/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 1 :: Fija cuánto se saca (extracción frente a reposición)
   3 rondas, recurso y reposición distintos en cada una (Rule 8, patrón B)
   ══════════════════════════════════════════════════════════════════════════ */
function w1(rng, host){
  var RES = shuffle([
    { n:{ es:'el bosque de la comunidad', en:'the community forest' },
      u:{ es:'cargas de leña', en:'loads of firewood' },
      r:{ es:'la madera nueva que el bosque suma cada año', en:'the new wood the forest adds each year' } },
    { n:{ es:'la laguna', en:'the lagoon' },
      u:{ es:'costales de pescado', en:'sacks of fish' },
      r:{ es:'lo que la población de peces repone con sus crías cada año', en:'what the fish population replaces with its young each year' } },
    { n:{ es:'el agostadero', en:'the grazing land' },
      u:{ es:'cargas de pasto', en:'loads of grass' },
      r:{ es:'lo que el pastizal rebrota cada año', en:'what the pasture regrows each year' } }
  ], rng);
  var REP = [ri(rng, 4, 8), ri(rng, 4, 8), ri(rng, 4, 8)];
  var rd = 0, tries = 0, locked = false, done = false, take = 0;

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Fija cuánto se saca al año', en:'Set how much is taken per year' }) + '</div>' +
    '<div class="gw-q" data-r="q"></div>' +
    '<div class="gw-mini">' + L({
      es:'Mueve la barra y mira lo que queda en reserva al final de cada año. Busca el máximo que puedes sacar sin que la reserva baje.',
      en:'Move the bar and watch what is left in reserve at the end of each year. Look for the maximum you can take without the reserve falling.'
    }) + '</div>' +
    '<div class="bars" data-r="bars"></div>' +
    '<div class="gw-lbl">' + L({ es:'Reserva al cierre de cada año', en:'Reserve at the close of each year' }) + '</div>' +
    '<input class="gw-range" type="range" min="0" max="12" step="1" value="0" data-r="sl">' +
    '<div class="gw-num" data-r="num"></div>' +
    '<div class="gw-note" data-r="verd"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Comprobar', en:'Check' }) + '</button></div>' +
    '<div class="gw-fb"></div>';

  var elQ = host.querySelector('[data-r="q"]'),
      elB = host.querySelector('[data-r="bars"]'),
      elS = host.querySelector('[data-r="sl"]'),
      elN = host.querySelector('[data-r="num"]'),
      elV = host.querySelector('[data-r="verd"]'),
      elK = host.querySelector('[data-r="chk"]');

  function series(){
    var s = 30, out = [];
    for (var y = 0; y < 6; y++){ s = Math.max(0, Math.min(40, s + REP[rd] - take)); out.push(s); }
    return out;
  }
  function render(){
    var res = RES[rd], rep = REP[rd], ser = series();
    elQ.innerHTML = L({
      es:'Cada año ' + L(res.n) + ' repone ' + rep + ' ' + L(res.u) + '. Hoy la reserva es de 30 ' + L(res.u) + '. ¿Cuánto puedes sacar cada año sin que esa reserva baje?',
      en:'Each year ' + L(res.n) + ' replaces ' + rep + ' ' + L(res.u) + '. Today the reserve is 30 ' + L(res.u) + '. How much can you take each year without that reserve falling?'
    });
    elB.innerHTML = ser.map(function(s, i){
      var cls = s === 0 ? ' low' : (s < 30 ? ' mid' : '');
      return '<div class="bar-y"><div class="bar-b' + cls + '" style="height:' + Math.max(2, Math.round(s / 40 * 100)) + '%"></div>' +
             '<div class="bar-l">' + L({ es:'año ', en:'yr ' }) + (i + 1) + '</div></div>';
    }).join('');
    elN.textContent = L({ es:'Sacas ' + take + ' ' + L(res.u) + ' al año', en:'You take ' + take + ' ' + L(res.u) + ' per year' });
    elS.value = String(take);
    elS.disabled = locked || done;
    var v;
    if (take > rep) v = L({ es:'La reserva baja: sale más de ' + L(res.r) + '.', en:'The reserve falls: more goes out than ' + L(res.r) + '.' });
    else if (take < rep) v = L({ es:'La reserva sube: queda recurso sin aprovechar.', en:'The reserve rises: there is resource left unused.' });
    else v = L({ es:'La reserva se mantiene igual año tras año.', en:'The reserve stays the same year after year.' });
    elV.textContent = v;
  }
  function advance(){
    rd++;
    if (rd >= 3){
      done = true;
      elK.textContent = L({ es:'Completado', en:'Completed' });
      elK.className = 'gw-btn solved';
      render();
      say(host, 'good', L({
        es:'Tres recursos distintos y la misma regla en los tres: el punto justo es sacar lo que el ecosistema alcanza a reponer en ese mismo año. Un poco por encima parece poco, pero se descuenta otra vez cada año.',
        en:'Three different resources and the same rule in all three: the right point is to take what the ecosystem manages to replace in that same year. A little above looks like little, but it is subtracted again every year.'
      }));
      return;
    }
    locked = false; tries = 0;
    take = Math.min(12, REP[rd] + ri(rng, 2, 3));
    elK.textContent = L({ es:'Comprobar', en:'Check' });
    elK.className = 'gw-btn';
    say(host, '', L({ es:'Otro recurso, otra velocidad de reposición. Vuelve a buscar el punto justo.', en:'Another resource, another replacement speed. Look for the right point again.' }));
    render();
  }
  function close(cls, msg){
    locked = true;
    elK.textContent = rd === 2 ? L({ es:'Terminar', en:'Finish' }) : L({ es:'Siguiente recurso', en:'Next resource' });
    elK.className = 'gw-btn solved';
    render();
    say(host, cls, msg);
  }
  function check(){
    if (done) return;
    if (locked){ advance(); return; }
    var rep = REP[rd], res = RES[rd];
    if (take === rep){
      close('good', L({
        es:'Ese es el punto: sacas ' + take + ' y ' + L(res.n) + ' repone ' + rep + '. La reserva termina el año seis igual que empezó, y aun así aprovechaste todo lo que se podía.',
        en:'That is the point: you take ' + take + ' and ' + L(res.n) + ' replaces ' + rep + '. The reserve ends year six as it started, and even so you used everything that could be used.'
      }));
      return;
    }
    tries++;
    if (tries >= 3){
      take = rep;
      close('warm', L({
        es:'Este es el punto justo para este recurso: ' + rep + ' ' + L(res.u) + ' al año, lo mismo que repone. Mira cómo las seis barras quedan parejas.',
        en:'This is the right point for this resource: ' + rep + ' ' + L(res.u) + ' a year, the same as it replaces. Look how the six bars come out level.'
      }));
      return;
    }
    if (take > rep){
      var ser = series(), z = -1;
      for (var i = 0; i < ser.length; i++){ if (ser[i] === 0){ z = i + 1; break; } }
      say(host, 'miss', L({
        es: z > 0 ? 'A ese ritmo la reserva se queda en cero en el año ' + z + '. Baja lo que sacas.' : 'A ese ritmo la reserva baja cada año y no se recupera sola. Baja lo que sacas.',
        en: z > 0 ? 'At that pace the reserve hits zero in year ' + z + '. Lower what you take.' : 'At that pace the reserve falls every year and does not recover on its own. Lower what you take.'
      }));
    } else {
      say(host, 'miss', L({
        es:'La reserva aguanta, pero estás dejando recurso sin aprovechar. Sube un poco lo que sacas, sin pasarte de lo que repone.',
        en:'The reserve holds, but you are leaving resource unused. Raise what you take a little, without going past what it replaces.'
      }));
    }
    render();
  }

  elS.addEventListener('input', function(){ if (locked || done) return; take = parseInt(elS.value, 10) || 0; render(); });
  elK.addEventListener('click', check);
  take = Math.min(12, REP[0] + ri(rng, 2, 3));
  say(host, '', L({ es:'Empieza moviendo la barra y observa las seis barras de reserva.', en:'Start by moving the slider and watch the six reserve bars.' }));
  render();
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 2 :: Cada terreno pide su técnica
   ══════════════════════════════════════════════════════════════════════════ */
function w2(rng, host){
  var TECH = [
    { es:'Terrazas con muro de piedra', en:'Terraces with a stone wall' },
    { es:'Chinampa sobre el canal', en:'Chinampa over the canal' },
    { es:'Metepantle con hileras de maguey', en:'Metepantle with rows of agave' },
    { es:'Parcela con años de descanso', en:'Plot with years of rest' }
  ];
  var TER = shuffle([
    { t:{ es:'Ladera inclinada donde cada lluvia se lleva la tierra cuesta abajo', en:'Steep hillside where every rain drags the earth downhill' }, k:0, p:[2],
      why:{ es:'lo que le sobra es pendiente: necesita algo que corte la caída del agua en escalones', en:'what it has too much of is slope: it needs something to break the fall of the water into steps' } },
    { t:{ es:'Orilla de un lago poco profundo, con canales y agua de sobra', en:'Edge of a shallow lake, with canals and water to spare' }, k:1, p:[],
      why:{ es:'lo que le falta es tierra firme, y le sobra agua y lodo rico del fondo', en:'what it lacks is solid ground, and it has water and rich mud from the bottom to spare' } },
    { t:{ es:'Valle seco y ventoso donde el suelo se reseca y se escurre', en:'Dry windy valley where the soil dries out and washes away' }, k:2, p:[0],
      why:{ es:'necesita hileras vivas que frenen el viento y el escurrimiento dentro de la misma parcela', en:'it needs living rows that slow the wind and the runoff inside the plot itself' } },
    { t:{ es:'Terreno de selva cuyo suelo da buena cosecha solo unos años', en:'Forest land whose soil gives a good harvest only for a few years' }, k:3, p:[],
      why:{ es:'necesita tiempo sin cultivo para que la vegetación regrese y el suelo recupere nutrientes', en:'it needs time without crops so the vegetation returns and the soil recovers nutrients' } }
  ], rng);
  var cur = TER.map(function(x){ return (x.k + 1 + ri(rng, 0, 2)) % 4; });
  var tries = 0, locked = false;

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Cada terreno pide su técnica', en:'Each piece of land calls for its technique' }) + '</div>' +
    '<div class="gw-q">' + L({ es:'¿Qué obra le queda a cada terreno?', en:'Which work fits each piece of land?' }) + '</div>' +
    '<div class="gw-mini">' + L({
      es:'Toca un terreno para cambiarle la técnica. La barra te muestra cuánto suelo conservaría con esa decisión.',
      en:'Tap a piece of land to change its technique. The bar shows how much soil it would keep with that decision.'
    }) + '</div>' +
    '<div class="gw-grid" data-r="tiles"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Comprobar', en:'Check' }) + '</button></div>' +
    '<div class="gw-fb"></div>';

  var elT = host.querySelector('[data-r="tiles"]'),
      elK = host.querySelector('[data-r="chk"]');

  function score(i){
    if (cur[i] === TER[i].k) return 92;
    if (TER[i].p.indexOf(cur[i]) >= 0) return 46;
    return 16;
  }
  function draw(){
    elT.innerHTML = TER.map(function(it, i){
      var sc = score(i);
      var cls = sc > 80 ? 'vC' : (sc > 30 ? 'vB' : 'vD');
      var fcl = sc > 80 ? ' full' : (sc > 30 ? '' : ' low');
      return '<button class="gw-tile ' + cls + '" data-k="' + i + '"' + (locked ? ' disabled' : '') + '>' +
             '<span class="gw-key">' + L(it.t) + '</span>' +
             '<span class="gw-sub">' + L(TECH[cur[i]]) + '</span>' +
             '<div class="mtr"><div class="mtr-t"><span>' + L({ es:'Suelo conservado', en:'Soil kept' }) + '</span><span>' + sc + '%</span></div>' +
             '<div class="mtr-b"><div class="mtr-f' + fcl + '" style="width:' + sc + '%"></div></div></div>' +
             '</button>';
    }).join('');
  }
  function firstWrong(){
    for (var i = 0; i < TER.length; i++) if (cur[i] !== TER[i].k) return i;
    return -1;
  }
  function check(){
    if (locked) return;
    if (firstWrong() === -1){
      locked = true;
      elK.textContent = L({ es:'Resuelto', en:'Solved' });
      elK.className = 'gw-btn solved';
      draw();
      say(host, 'good', L({
        es:'Los cuatro terrenos quedaron con la obra que resuelve su problema. Ninguna técnica es la mejor en abstracto: es la mejor para lo que a ese terreno le falta o le sobra.',
        en:'All four pieces of land ended up with the work that solves their problem. No technique is best in the abstract: it is best for what that land lacks or has too much of.'
      }));
      return;
    }
    tries++;
    if (tries >= 3){
      for (var i = 0; i < TER.length; i++) cur[i] = TER[i].k;
      locked = true;
      elK.textContent = L({ es:'Resuelto', en:'Solved' });
      elK.className = 'gw-btn solved';
      draw();
      say(host, 'warm', L({
        es:'Esta es la combinación que funciona: terrazas para la ladera, chinampa para la zona de canales, metepantle para el valle seco y descanso para el suelo de selva.',
        en:'This is the combination that works: terraces for the hillside, chinampa for the canal zone, metepantle for the dry valley and rest for the forest soil.'
      }));
      return;
    }
    var w = firstWrong();
    say(host, 'miss', L({
      es:'Revisa este terreno: ' + L(TER[w].t).toLowerCase() + '. Ahí ' + L(TER[w].why) + '. Tócalo para cambiar la técnica.',
      en:'Look again at this land: ' + L(TER[w].t).toLowerCase() + '. There ' + L(TER[w].why) + '. Tap it to change the technique.'
    }));
    draw();
  }

  elT.addEventListener('click', function(ev){
    var b = ev.target.closest('[data-k]');
    if (!b || locked) return;
    var i = parseInt(b.getAttribute('data-k'), 10);
    cur[i] = (cur[i] + 1) % 4;
    draw();
  });
  elK.addEventListener('click', check);
  say(host, '', L({ es:'Toca cada terreno hasta darle la obra que le queda.', en:'Tap each piece of land until you give it the work that fits.' }));
  draw();
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 3 :: Guarda la semilla del año que viene (2 rondas)
   ══════════════════════════════════════════════════════════════════════════ */
function w3(rng, host){
  var SC = shuffle([
    { i:0, t:{ es:'Este año la lluvia se cortó a la mitad del ciclo y hubo seca', en:'This year the rain stopped halfway through the cycle and there was drought' } },
    { i:1, t:{ es:'Este año entraron vientos fuertes justo antes de la cosecha', en:'This year strong winds came in just before the harvest' } },
    { i:2, t:{ es:'Este año apareció una plaga de gusano en las mazorcas', en:'This year a worm pest appeared in the cobs' } }
  ], rng).slice(0, 2);
  var COB = [
    { n:{ es:'Siguió verde cuando faltó el agua', en:'Stayed green when water ran short' }, s:[3,0,1] },
    { n:{ es:'Caña baja y gruesa, no se venció', en:'Low thick stalk, it did not fall over' }, s:[0,3,1] },
    { n:{ es:'Hojas que cubren la mazorca hasta la punta', en:'Leaves covering the cob to the tip' }, s:[1,0,3] },
    { n:{ es:'Ciclo corto: llenó grano antes que las demás', en:'Short cycle: it filled grain before the others' }, s:[3,3,0] },
    { n:{ es:'De pie hasta el final y con grano sano', en:'Standing to the end and with sound grain' }, s:[0,3,3] },
    { n:{ es:'Aguantó la seca y salió sin daño', en:'Stood the drought and came out undamaged' }, s:[3,1,3] }
  ];
  var rd = 0, tries = 0, locked = false, done = false, sel = [];

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Guarda la semilla del año que viene', en:'Save the seed for next year' }) + '</div>' +
    '<div class="gw-q" data-r="q"></div>' +
    '<div class="gw-mini">' + L({
      es:'Toca tres mazorcas para apartarlas. Tócalas otra vez para soltarlas. La barra estima cómo respondería esa semilla si el año se repite.',
      en:'Tap three cobs to set them aside. Tap them again to release them. The bar estimates how that seed would respond if the year repeats.'
    }) + '</div>' +
    '<div class="gw-grid" data-r="tiles"></div>' +
    '<div class="mtr"><div class="mtr-t"><span>' + L({ es:'Respuesta esperada de la semilla apartada', en:'Expected response of the saved seed' }) + '</span><span data-r="pct">0%</span></div>' +
    '<div class="mtr-b"><div class="mtr-f" data-r="fill" style="width:0%"></div></div></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Comprobar', en:'Check' }) + '</button></div>' +
    '<div class="gw-fb"></div>';

  var elQ = host.querySelector('[data-r="q"]'),
      elT = host.querySelector('[data-r="tiles"]'),
      elP = host.querySelector('[data-r="pct"]'),
      elF = host.querySelector('[data-r="fill"]'),
      elK = host.querySelector('[data-r="chk"]');

  function best(){
    var sc = SC[rd].i, idx = [0,1,2,3,4,5];
    idx.sort(function(a,b){ return COB[b].s[sc] - COB[a].s[sc]; });
    return idx.slice(0, 3).sort(function(a,b){ return a - b; });
  }
  function total(){
    var sc = SC[rd].i, t = 0;
    sel.forEach(function(i){ t += COB[i].s[sc]; });
    return t;
  }
  function draw(){
    var sc = SC[rd].i;
    elQ.textContent = L(SC[rd].t) + L({ es:'. ¿De cuáles tres plantas guardas la semilla?', en:'. From which three plants do you save the seed?' });
    elT.innerHTML = COB.map(function(c, i){
      var on = sel.indexOf(i) >= 0;
      return '<button class="gw-tile ' + (on ? 'on' : 'off') + '" data-k="' + i + '"' + (locked || done ? ' disabled' : '') + '>' +
             '<span class="gw-key">' + L(c.n) + '</span>' +
             '<span class="gw-sub">' + (on ? L({ es:'apartada para sembrar', en:'set aside for sowing' }) : L({ es:'se queda para comer', en:'kept to eat' })) + '</span></button>';
    }).join('');
    var pct = Math.round(total() / 9 * 100);
    elP.textContent = pct + '%';
    elF.style.width = pct + '%';
    elF.className = 'mtr-f' + (pct >= 90 ? ' full' : (pct <= 34 ? ' low' : ''));
  }
  function advance(){
    rd++;
    if (rd >= SC.length){
      done = true;
      elK.textContent = L({ es:'Completado', en:'Completed' });
      elK.className = 'gw-btn solved';
      draw();
      say(host, 'good', L({
        es:'Eso es seleccionar semilla criolla: no se guarda la mazorca más bonita, se guarda la de la planta que respondió a lo que pasó ese año en esa parcela. Repetido durante generaciones, así se ajusta una variedad a su lugar.',
        en:'That is how criollo seed is selected: you do not save the prettiest cob, you save the one from the plant that responded to what happened that year on that plot. Repeated over generations, that is how a variety gets tuned to its place.'
      }));
      return;
    }
    locked = false; tries = 0; sel = [];
    elK.textContent = L({ es:'Comprobar', en:'Check' });
    elK.className = 'gw-btn';
    say(host, '', L({ es:'Otro año, otro problema en la parcela. Vuelve a escoger.', en:'Another year, another problem on the plot. Choose again.' }));
    draw();
  }
  function close(cls, msg){
    locked = true;
    elK.textContent = rd === SC.length - 1 ? L({ es:'Terminar', en:'Finish' }) : L({ es:'Siguiente año', en:'Next year' });
    elK.className = 'gw-btn solved';
    draw();
    say(host, cls, msg);
  }
  function check(){
    if (done) return;
    if (locked){ advance(); return; }
    if (sel.length !== 3){
      say(host, 'warm', L({ es:'Aparta exactamente tres mazorcas antes de comprobar.', en:'Set aside exactly three cobs before checking.' }));
      return;
    }
    var b = best(), ok = sel.slice().sort(function(x,y){ return x-y; }).join(',') === b.join(',');
    if (ok){
      close('good', L({
        es:'Las tres que apartaste son justo las que respondieron a lo que pasó este año. Esa semilla lleva ventaja si el año siguiente se parece.',
        en:'The three you set aside are exactly the ones that responded to what happened this year. That seed carries an advantage if the following year is similar.'
      }));
      return;
    }
    tries++;
    if (tries >= 3){
      sel = b.slice();
      close('warm', L({
        es:'Estas tres son las que convenía guardar para un año así.',
        en:'These three are the ones worth saving for a year like this.'
      }));
      return;
    }
    var sc = SC[rd].i, worst = sel[0];
    sel.forEach(function(i){ if (COB[i].s[sc] < COB[worst].s[sc]) worst = i; });
    say(host, 'miss', L({
      es:'Revisa la mazorca apartada que dice: ' + L(COB[worst].n) + '. Esa característica no ayuda contra lo que pasó este año. Suéltala y busca otra.',
      en:'Look again at the cob you set aside that says: ' + L(COB[worst].n) + '. That trait does not help against what happened this year. Release it and look for another.'
    }));
    draw();
  }

  elT.addEventListener('click', function(ev){
    var b = ev.target.closest('[data-k]');
    if (!b || locked || done) return;
    var i = parseInt(b.getAttribute('data-k'), 10), at = sel.indexOf(i);
    if (at >= 0) sel.splice(at, 1);
    else if (sel.length >= 3){
      say(host, 'warm', L({ es:'Ya tienes tres apartadas. Suelta una para poder cambiarla.', en:'You already have three set aside. Release one to swap it.' }));
      return;
    } else sel.push(i);
    draw();
  });
  elK.addEventListener('click', check);
  say(host, '', L({ es:'Escoge las tres mazorcas que dejarías para sembrar.', en:'Choose the three cobs you would leave for sowing.' }));
  draw();
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 4 :: Rota el rebaño ocho meses
   ══════════════════════════════════════════════════════════════════════════ */
function w4(rng, host){
  var NAMES = shuffle([
    { es:'Potrero del arroyo', en:'Creek paddock' },
    { es:'Potrero del cerro', en:'Hill paddock' },
    { es:'Potrero de la loma', en:'Ridge paddock' },
    { es:'Potrero del llano', en:'Flat paddock' }
  ], rng);
  var lv = [100, 100, 100, 100], month = 0, here = -1, runs = 0, done = false;

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Rota el rebaño', en:'Rotate the flock' }) + '</div>' +
    '<div class="gw-q">' + L({ es:'Ocho meses de pastoreo: ¿en cuál potrero entra el rebaño cada mes?', en:'Eight months of grazing: which paddock does the flock enter each month?' }) + '</div>' +
    '<div class="gw-mini">' + L({
      es:'Toca un potrero para llevar ahí al rebaño ese mes. El pasto del potrero pastoreado baja y el de los demás rebrota. Termina los ocho meses con los cuatro potreros con pasto.',
      en:'Tap a paddock to take the flock there that month. The grass of the grazed paddock drops and the others regrow. Finish the eight months with all four paddocks still in grass.'
    }) + '</div>' +
    '<div class="gw-lbl" data-r="mes"></div>' +
    '<div class="pot" data-r="pots"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="rst">' + L({ es:'Empezar de nuevo', en:'Start over' }) + '</button></div>' +
    '<div class="gw-fb"></div>';

  var elM = host.querySelector('[data-r="mes"]'),
      elP = host.querySelector('[data-r="pots"]'),
      elR = host.querySelector('[data-r="rst"]');

  function draw(){
    elM.textContent = done
      ? L({ es:'Temporada terminada', en:'Season finished' })
      : L({ es:'Mes ' + (month + 1) + ' de 8', en:'Month ' + (month + 1) + ' of 8' });
    elP.innerHTML = lv.map(function(v, i){
      var fcl = v >= 55 ? '' : (v >= 25 ? ' mid' : ' low');
      return '<button class="pot-c' + (here === i ? ' here' : '') + '" data-k="' + i + '"' + (done ? ' disabled' : '') + '>' +
             '<div class="pot-n">' + L(NAMES[i]) + '</div>' +
             '<div class="pot-b"><div class="pot-f' + fcl + '" style="height:' + Math.max(2, v) + '%"></div></div>' +
             '<div class="pot-v">' + v + '%</div></button>';
    }).join('');
  }
  function graze(i){
    var before = lv.slice();
    lv[i] = Math.max(0, before[i] - 45);
    for (var j = 0; j < 4; j++){
      if (j === i) continue;
      lv[j] = Math.min(100, before[j] + (before[j] < 15 ? 10 : 20));
    }
    here = i; month++;
  }
  function reveal(){
    lv = [100, 100, 100, 100]; month = 0; here = -1;
    [0,1,2,3,0,1,2,3].forEach(function(i){ graze(i); });
    done = true;
    draw();
    say(host, 'warm', L({
      es:'Así queda la temporada rotando: el rebaño entra a un potrero distinto cada mes y no regresa al primero hasta que pasaron tres meses de rebrote. Los cuatro terminan con pasto y ninguno quedó rapado.',
      en:'This is how the season ends with rotation: the flock enters a different paddock each month and does not return to the first until three months of regrowth have passed. All four end with grass and none was stripped.'
    }));
  }
  function finish(){
    var low = -1;
    for (var i = 0; i < 4; i++) if (lv[i] < 40 && (low < 0 || lv[i] < lv[low])) low = i;
    done = true;
    draw();
    if (low < 0){
      say(host, 'good', L({
        es:'Ocho meses y los cuatro potreros siguen con pasto. Al dejar que cada uno descanse varios meses, la planta repuso las reservas de su raíz y volvió a rebrotar con fuerza: el mismo rebaño comió todo el año sin pelar el terreno.',
        en:'Eight months and all four paddocks still have grass. By letting each one rest for several months, the plant rebuilt the reserves in its root and sprouted strongly again: the same flock fed all year without stripping the land.'
      }));
      return;
    }
    runs++;
    if (runs >= 3){ reveal(); return; }
    say(host, 'miss', L({
      es:'Terminaste la temporada, pero ' + L(NAMES[low]) + ' quedó casi pelado. Ese pasto fue comido antes de reponer las reservas de su raíz y ya rebrota poco. Toca Empezar de nuevo y reparte mejor los meses.',
      en:'You finished the season, but ' + L(NAMES[low]) + ' ended up almost stripped. That grass was eaten before rebuilding the reserves in its root and now it barely regrows. Tap Start over and spread the months better.'
    }));
  }

  elP.addEventListener('click', function(ev){
    var b = ev.target.closest('[data-k]');
    if (!b || done) return;
    var i = parseInt(b.getAttribute('data-k'), 10);
    graze(i);
    draw();
    if (lv[i] < 15){
      say(host, 'miss', L({
        es:'Ese potrero quedó rapado: el pasto ya no tiene hoja con la que reponerse y rebrota a la mitad de velocidad. Dale varios meses sin rebaño.',
        en:'That paddock was stripped: the grass has no leaf left to rebuild itself and regrows at half speed. Give it several months without the flock.'
      }));
    } else if (month < 8){
      say(host, '', L({
        es:'El rebaño está en ' + L(NAMES[i]) + '. Los otros tres rebrotan mientras tanto.',
        en:'The flock is in ' + L(NAMES[i]) + '. The other three regrow meanwhile.'
      }));
    }
    if (month >= 8) finish();
  });
  elR.addEventListener('click', function(){
    if (done && runs >= 3) return;
    lv = [100, 100, 100, 100]; month = 0; here = -1; done = false;
    draw();
    say(host, '', L({ es:'Temporada reiniciada. Ocho meses otra vez.', en:'Season restarted. Eight months again.' }));
  });
  say(host, '', L({ es:'Toca el potrero donde entra el rebaño este mes.', en:'Tap the paddock the flock enters this month.' }));
  draw();
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 5 :: Sube la red (3 rondas)
   ══════════════════════════════════════════════════════════════════════════ */
function w5(rng, host){
  var CRIA = shuffle([
    { es:'Cría del tamaño de un dedo', en:'Young the size of a finger' },
    { es:'Juvenil que aún no llega a talla de reproducción', en:'Juvenile still below breeding size' },
    { es:'Pez chico con las aletas todavía transparentes', en:'Small fish with fins still transparent' }
  ], rng);
  var HUEV = shuffle([
    { es:'Hembra con el vientre lleno de huevos', en:'Female with a belly full of eggs' },
    { es:'Hembra que está por desovar esta semana', en:'Female about to spawn this week' },
    { es:'Hembra capturada en plena temporada de desove', en:'Female caught in the middle of spawning season' }
  ], rng);
  var ADUL = shuffle([
    { es:'Adulto que ya desovó esta temporada', en:'Adult that already spawned this season' },
    { es:'Adulto muy por encima de la talla mínima', en:'Adult well above the minimum size' },
    { es:'Adulto que se reprodujo dos temporadas seguidas', en:'Adult that reproduced two seasons in a row' }
  ], rng);
  var ROUND = [];
  for (var r = 0; r < 3; r++){
    var pack = [
      { n:CRIA[r], k:0 },
      { n:CRIA[(r + 1) % 3], k:0 },
      { n:HUEV[r], k:1 },
      { n:HUEV[(r + 2) % 3], k:1 },
      { n:ADUL[r], k:2 },
      { n:ADUL[(r + 1) % 3], k:2 }
    ];
    ROUND.push(shuffle(pack, rng));
  }
  var rd = 0, tries = 0, locked = false, done = false, keep = [];

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Sube la red', en:'Haul up the net' }) + '</div>' +
    '<div class="gw-q">' + L({ es:'Seis peces en la red. ¿Cuáles se quedan y cuáles regresan al agua?', en:'Six fish in the net. Which stay and which go back into the water?' }) + '</div>' +
    '<div class="gw-mini">' + L({
      es:'Toca un pez para cambiar tu decisión. La barra cuenta cuántos de los que aún no dejan descendencia lograrán reproducirse.',
      en:'Tap a fish to change your decision. The bar counts how many of those that have not left offspring yet will get to reproduce.'
    }) + '</div>' +
    '<div class="gw-grid" data-r="tiles"></div>' +
    '<div class="mtr"><div class="mtr-t"><span>' + L({ es:'Peces que llegarán a reproducirse', en:'Fish that will get to reproduce' }) + '</span><span data-r="pct">0 / 4</span></div>' +
    '<div class="mtr-b"><div class="mtr-f" data-r="fill" style="width:0%"></div></div></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Comprobar', en:'Check' }) + '</button></div>' +
    '<div class="gw-fb"></div>';

  var elT = host.querySelector('[data-r="tiles"]'),
      elP = host.querySelector('[data-r="pct"]'),
      elF = host.querySelector('[data-r="fill"]'),
      elK = host.querySelector('[data-r="chk"]');

  function why(k){
    return k === 0
      ? L({ es:'todavía no ha llegado a reproducirse ni una vez', en:'it has not reproduced even once yet' })
      : L({ es:'trae huevos y está a punto de desovar', en:'it is carrying eggs and is about to spawn' });
  }
  function draw(){
    elT.innerHTML = ROUND[rd].map(function(f, i){
      var on = keep.indexOf(i) >= 0;
      return '<button class="gw-tile ' + (on ? 'vB' : 'vC') + '" data-k="' + i + '"' + (locked || done ? ' disabled' : '') + '>' +
             '<span class="gw-key">' + L(f.n) + '</span>' +
             '<span class="gw-sub">' + (on ? L({ es:'se queda en la lancha', en:'stays in the boat' }) : L({ es:'regresa al agua', en:'goes back into the water' })) + '</span></button>';
    }).join('');
    var saved = 0;
    ROUND[rd].forEach(function(f, i){ if (f.k !== 2 && keep.indexOf(i) < 0) saved++; });
    elP.textContent = saved + ' / 4';
    elF.style.width = Math.round(saved / 4 * 100) + '%';
    elF.className = 'mtr-f' + (saved === 4 ? ' full' : (saved <= 1 ? ' low' : ''));
  }
  function advance(){
    rd++;
    if (rd >= 3){
      done = true;
      elK.textContent = L({ es:'Completado', en:'Completed' });
      elK.className = 'gw-btn solved';
      draw();
      say(host, 'good', L({
        es:'Tres redes revisadas con el mismo criterio: se aprovecha al adulto que ya dejó descendencia y regresan al agua los que aún no se reproducen y las hembras que traen huevos. De ahí sale la pesca del año que viene.',
        en:'Three nets sorted with the same criterion: the adult that already left offspring is used, and those that have not reproduced yet and the females carrying eggs go back into the water. Next year catch comes from there.'
      }));
      return;
    }
    locked = false; tries = 0; keep = [];
    elK.textContent = L({ es:'Comprobar', en:'Check' });
    elK.className = 'gw-btn';
    say(host, '', L({ es:'Otra red arriba. Vuelve a decidir.', en:'Another net up. Decide again.' }));
    draw();
  }
  function close(cls, msg){
    locked = true;
    elK.textContent = rd === 2 ? L({ es:'Terminar', en:'Finish' }) : L({ es:'Siguiente red', en:'Next net' });
    elK.className = 'gw-btn solved';
    draw();
    say(host, cls, msg);
  }
  function firstErr(){
    for (var i = 0; i < ROUND[rd].length; i++){
      var on = keep.indexOf(i) >= 0, f = ROUND[rd][i];
      if (f.k === 2 && !on) return { i:i, type:'devuelto' };
      if (f.k !== 2 && on) return { i:i, type:'retenido' };
    }
    return null;
  }
  function check(){
    if (done) return;
    if (locked){ advance(); return; }
    var e = firstErr();
    if (!e){
      close('good', L({
        es:'Red bien revisada: los cuatro que aún tenían que reproducirse volvieron al agua y los dos adultos que ya desovaron se aprovechan.',
        en:'Net well sorted: the four that still had to reproduce went back into the water and the two adults that already spawned are used.'
      }));
      return;
    }
    tries++;
    if (tries >= 3){
      keep = [];
      ROUND[rd].forEach(function(f, i){ if (f.k === 2) keep.push(i); });
      close('warm', L({
        es:'Esta es la decisión que sostiene la pesca: se quedan los adultos que ya dejaron crías y regresa al agua todo lo demás.',
        en:'This is the decision that sustains fishing: the adults that already left young stay and everything else goes back into the water.'
      }));
      return;
    }
    var f = ROUND[rd][e.i];
    say(host, 'miss', e.type === 'retenido'
      ? L({ es:'Ese que dejaste en la lancha, ' + L(f.n).toLowerCase() + ', ' + why(f.k) + '. Si se queda, se pierden también todas sus crías.',
            en:'The one you left in the boat, ' + L(f.n).toLowerCase() + ', ' + why(f.k) + '. If it stays, all its young are lost too.' })
      : L({ es:'Ese que devolviste, ' + L(f.n).toLowerCase() + ', ya se reprodujo: es justo el que sí se puede aprovechar.',
            en:'The one you returned, ' + L(f.n).toLowerCase() + ', has already reproduced: it is exactly the one that can be used.' }));
    draw();
  }

  elT.addEventListener('click', function(ev){
    var b = ev.target.closest('[data-k]');
    if (!b || locked || done) return;
    var i = parseInt(b.getAttribute('data-k'), 10), at = keep.indexOf(i);
    if (at >= 0) keep.splice(at, 1); else keep.push(i);
    draw();
  });
  elK.addEventListener('click', check);
  say(host, '', L({ es:'Decide pez por pez y comprueba.', en:'Decide fish by fish and check.' }));
  draw();
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 6 :: Arma el calendario de veda
   ══════════════════════════════════════════════════════════════════════════ */
function w6(rng, host){
  var MES = { es:['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'],
              en:['January','February','March','April','May','June','July','August','September','October','November','December'] };
  var s = ri(rng, 2, 8), len = ri(rng, 2, 3);
  if (s + len > 11) s = 11 - len;
  var win = [];
  for (var i = 0; i < len; i++) win.push(s + i);
  var shut = [], tries = 0, locked = false;

  function mn(i){ return MES[LANG] ? MES[LANG][i] : MES.es[i]; }

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Arma el calendario', en:'Build the calendar' }) + '</div>' +
    '<div class="gw-q">' + L({ es:'¿En qué meses se suspende la captura de esta especie?', en:'In which months is the catch of this species suspended?' }) + '</div>' +
    '<div class="gw-mini" data-r="cl"></div>' +
    '<div class="mon" data-r="mon"></div>' +
    '<div class="mtr"><div class="mtr-t"><span>' + L({ es:'Desove protegido', en:'Spawning protected' }) + '</span><span data-r="pct">0%</span></div>' +
    '<div class="mtr-b"><div class="mtr-f" data-r="fill" style="width:0%"></div></div></div>' +
    '<div class="gw-note" data-r="extra"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Comprobar', en:'Check' }) + '</button></div>' +
    '<div class="gw-fb"></div>';

  var elC = host.querySelector('[data-r="cl"]'),
      elM = host.querySelector('[data-r="mon"]'),
      elP = host.querySelector('[data-r="pct"]'),
      elF = host.querySelector('[data-r="fill"]'),
      elX = host.querySelector('[data-r="extra"]'),
      elK = host.querySelector('[data-r="chk"]');

  function clues(){
    return L({
      es:'Lo que cuentan quienes pescan aquí: en ' + mn(s - 1) + ' las hembras todavía no traen huevos; en ' + mn(s) + ' ya vienen cargadas; en ' + mn(s + len - 1) + ' siguen desovando cerca de la orilla; en ' + mn(s + len) + ' ya no se ven huevos y los peces vuelven a lo hondo.',
      en:'What the people who fish here say: in ' + mn(s - 1) + ' the females are not carrying eggs yet; in ' + mn(s) + ' they already come loaded; in ' + mn(s + len - 1) + ' they are still spawning near the shore; in ' + mn(s + len) + ' no eggs are seen any more and the fish return to deep water.'
    });
  }
  function draw(){
    elC.textContent = clues();
    elM.innerHTML = MES.es.map(function(_, i){
      var on = shut.indexOf(i) >= 0;
      return '<button class="mon-c' + (on ? ' shut' : '') + '" data-k="' + i + '"' + (locked ? ' disabled' : '') + '>' + mn(i) + '</button>';
    }).join('');
    var cov = 0;
    win.forEach(function(m){ if (shut.indexOf(m) >= 0) cov++; });
    var extra = shut.filter(function(m){ return win.indexOf(m) < 0; }).length;
    var pct = Math.round(cov / win.length * 100);
    elP.textContent = pct + '%';
    elF.style.width = pct + '%';
    elF.className = 'mtr-f' + (pct === 100 ? ' full' : (pct === 0 ? ' low' : ''));
    elX.textContent = extra === 0
      ? L({ es:'Ningún mes cerrado de más.', en:'No months closed beyond need.' })
      : L({ es:'Meses cerrados fuera del desove: ' + extra + '. Cada uno deja a las familias sin trabajo sin proteger nada.',
            en:'Months closed outside the spawning: ' + extra + '. Each one leaves families without work and protects nothing.' });
  }
  function check(){
    if (locked) return;
    var missing = win.filter(function(m){ return shut.indexOf(m) < 0; });
    var extra = shut.filter(function(m){ return win.indexOf(m) < 0; });
    if (missing.length === 0 && extra.length === 0){
      locked = true;
      elK.textContent = L({ es:'Resuelto', en:'Solved' });
      elK.className = 'gw-btn solved';
      draw();
      say(host, 'good', L({
        es:'Calendario armado: la captura se detiene justo mientras las hembras desovan y se reanuda en cuanto termina. Así se protege la reproducción sin quitar más meses de trabajo de los necesarios.',
        en:'Calendar built: the catch stops exactly while the females spawn and starts again as soon as it ends. That protects reproduction without taking away more working months than needed.'
      }));
      return;
    }
    tries++;
    if (tries >= 3){
      shut = win.slice();
      locked = true;
      elK.textContent = L({ es:'Resuelto', en:'Solved' });
      elK.className = 'gw-btn solved';
      draw();
      say(host, 'warm', L({
        es:'Estos son los meses de desove según lo que cuentan quienes pescan aquí: de ' + mn(win[0]) + ' a ' + mn(win[win.length - 1]) + '.',
        en:'These are the spawning months according to what the people who fish here say: from ' + mn(win[0]) + ' to ' + mn(win[win.length - 1]) + '.'
      }));
      return;
    }
    if (missing.length){
      say(host, 'miss', L({
        es:'En ' + mn(missing[0]) + ' las hembras todavía traen huevos y tu calendario deja la red tendida. Cierra ese mes.',
        en:'In ' + mn(missing[0]) + ' the females are still carrying eggs and your calendar leaves the net set. Close that month.'
      }));
    } else {
      say(host, 'miss', L({
        es:'En ' + mn(extra[0]) + ' ya no hay desove que proteger. Cerrar ese mes solo deja a las familias sin pescar.',
        en:'In ' + mn(extra[0]) + ' there is no spawning left to protect. Closing that month only leaves the families without fishing.'
      }));
    }
    draw();
  }

  elM.addEventListener('click', function(ev){
    var b = ev.target.closest('[data-k]');
    if (!b || locked) return;
    var i = parseInt(b.getAttribute('data-k'), 10), at = shut.indexOf(i);
    if (at >= 0) shut.splice(at, 1); else shut.push(i);
    draw();
  });
  elK.addEventListener('click', check);
  say(host, '', L({ es:'Toca los meses en los que no se pesca y comprueba.', en:'Tap the months in which nobody fishes and check.' }));
  draw();
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 7 :: Arma la cadena de consecuencias (2 rondas)
   ══════════════════════════════════════════════════════════════════════════ */
function w7(rng, host){
  var CH = shuffle([
    { t:{ es:'De la veda a la pesca del año que viene', en:'From the closed season to next year catch' },
      st:[
        { es:'La comunidad acuerda no pescar durante los meses de desove', en:'The community agrees not to fish during the spawning months' },
        { es:'Las hembras alcanzan a desovar sin ser capturadas', en:'The females manage to spawn without being caught' },
        { es:'Muchas crías crecen protegidas entre las raíces del manglar', en:'Many young grow protected among the mangrove roots' },
        { es:'La temporada siguiente hay más adultos en la zona', en:'The following season there are more adults in the area' },
        { es:'Las familias pescan cerca de la orilla sin salir más lejos', en:'The families fish near the shore without going farther out' }
      ] },
    { t:{ es:'Del potrero que descansa al pastizal que aguanta', en:'From the resting paddock to the pasture that holds' },
      st:[
        { es:'El rebaño cambia de potrero antes de acabarse el pasto', en:'The flock changes paddock before the grass runs out' },
        { es:'El pasto rebrota desde la raíz y repone sus reservas', en:'The grass regrows from the root and rebuilds its reserves' },
        { es:'El suelo queda cubierto por vegetación densa', en:'The soil ends up covered by dense vegetation' },
        { es:'La lluvia se infiltra en lugar de arrastrar la tierra', en:'The rain soaks in instead of dragging the earth away' },
        { es:'El pastizal sostiene al mismo rebaño año tras año', en:'The pasture supports the same flock year after year' }
      ] },
    { t:{ es:'De la mazorca guardada a la cosecha en año seco', en:'From the saved cob to the harvest in a dry year' },
      st:[
        { es:'Se aparta la semilla de las plantas que aguantaron la seca', en:'Seed is set aside from the plants that stood the drought' },
        { es:'Esa semilla se siembra en la misma parcela al año siguiente', en:'That seed is sown on the same plot the following year' },
        { es:'La mayoría de las plantas nuevas hereda esa resistencia', en:'Most of the new plants inherit that resistance' },
        { es:'La variedad queda ajustada al clima y al suelo del lugar', en:'The variety ends up tuned to the climate and soil of the place' },
        { es:'La familia cosecha incluso en los años de poca lluvia', en:'The family harvests even in years of little rain' }
      ] }
  ], rng).slice(0, 2);
  var rd = 0, order = [], tries = 0, locked = false, done = false, disp = [];

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Arma la cadena', en:'Build the chain' }) + '</div>' +
    '<div class="gw-q" data-r="q"></div>' +
    '<div class="gw-mini">' + L({
      es:'Toca los pasos en el orden en que ocurren, del primero al último. Si te equivocas puedes volver a empezar la cadena.',
      en:'Tap the steps in the order in which they happen, from first to last. If you get it wrong you can start the chain again.'
    }) + '</div>' +
    '<div class="chain" data-r="steps"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="rst">' + L({ es:'Volver a empezar', en:'Start again' }) + '</button></div>' +
    '<div class="gw-fb"></div>';

  var elQ = host.querySelector('[data-r="q"]'),
      elS = host.querySelector('[data-r="steps"]'),
      elR = host.querySelector('[data-r="rst"]');

  function seed(){
    disp = shuffle(CH[rd].st.map(function(x, i){ return { n:x, o:i }; }), rng);
    order = [];
  }
  function draw(){
    elQ.textContent = L(CH[rd].t);
    elS.innerHTML = disp.map(function(st, i){
      var at = order.indexOf(i);
      return '<button class="chain-s' + (at >= 0 ? ' set' : '') + '" data-k="' + i + '"' + (locked || done ? ' disabled' : '') + '>' +
             '<span class="chain-n">' + (at >= 0 ? (at + 1) : '?') + '</span><span>' + L(st.n) + '</span></button>';
    }).join('');
  }
  function advance(){
    rd++;
    if (rd >= CH.length){
      done = true;
      draw();
      elR.textContent = L({ es:'Completado', en:'Completed' });
      elR.className = 'gw-btn solved';
      say(host, 'good', L({
        es:'Las dos cadenas se sostienen igual: una decisión de la comunidad, un ser vivo que alcanza a cumplir su ciclo y, al final, gente que sigue comiendo de ahí. Así se explica por qué un saber tradicional funciona.',
        en:'Both chains hold together in the same way: a decision by the community, a living thing that gets to complete its cycle and, at the end, people who keep eating from it. That is how you explain why traditional knowledge works.'
      }));
      return;
    }
    tries = 0; locked = false; seed(); draw();
    elR.textContent = L({ es:'Volver a empezar', en:'Start again' });
    elR.className = 'gw-btn';
    say(host, '', L({ es:'Otra cadena, del primer paso al último.', en:'Another chain, from the first step to the last.' }));
  }
  function reveal(){
    order = [];
    for (var pos = 0; pos < disp.length; pos++){
      for (var i = 0; i < disp.length; i++) if (disp[i].o === pos) order.push(i);
    }
    locked = true;
    draw();
    elR.textContent = rd === CH.length - 1 ? L({ es:'Terminar', en:'Finish' }) : L({ es:'Siguiente cadena', en:'Next chain' });
    elR.className = 'gw-btn solved';
    say(host, 'warm', L({ es:'Este es el orden en que ocurren los pasos.', en:'This is the order in which the steps happen.' }));
  }

  elS.addEventListener('click', function(ev){
    var b = ev.target.closest('[data-k]');
    if (!b || locked || done) return;
    var i = parseInt(b.getAttribute('data-k'), 10);
    if (order.indexOf(i) >= 0) return;
    if (disp[i].o === order.length){
      order.push(i);
      draw();
      if (order.length === disp.length){
        locked = true;
        elR.textContent = rd === CH.length - 1 ? L({ es:'Terminar', en:'Finish' }) : L({ es:'Siguiente cadena', en:'Next chain' });
        elR.className = 'gw-btn solved';
        say(host, 'good', L({
          es:'Cadena completa. Cada paso hace posible el siguiente: por eso la práctica sostiene el recurso y no solo la buena intención.',
          en:'Chain complete. Each step makes the next one possible: that is why the practice sustains the resource and not just good intentions.'
        }));
      } else {
        say(host, '', L({ es:'Paso ' + order.length + ' colocado. ¿Qué ocurre inmediatamente después?', en:'Step ' + order.length + ' placed. What happens immediately after?' }));
      }
      return;
    }
    tries++;
    if (tries >= 3){ reveal(); return; }
    say(host, 'miss', L({
      es:'Ese paso todavía no puede ocurrir: antes tiene que pasar algo que lo haga posible. Busca cuál lo antecede.',
      en:'That step cannot happen yet: something that makes it possible has to happen first. Look for what comes before it.'
    }));
  });
  elR.addEventListener('click', function(){
    if (done) return;
    if (locked){ advance(); return; }
    order = [];
    draw();
    say(host, '', L({ es:'Cadena vacía otra vez. Empieza por el paso que ocurre primero.', en:'Chain empty again. Start with the step that happens first.' }));
  });
  seed();
  say(host, '', L({ es:'Empieza por el paso que ocurre primero.', en:'Start with the step that happens first.' }));
  draw();
}
</script>

<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbykkuJ_apGq3vALIFd4mr3acu81c7K4OKxW-DZ-i52Ceyl3lOanXMdvbS9SIXPrLQBm/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'Saberes Tradicionales en Agricultura y Pesca Sustentables';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
