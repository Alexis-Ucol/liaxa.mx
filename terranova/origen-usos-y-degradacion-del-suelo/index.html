function buildLesson(rng) {
  injectGuideCSS();

  /* ══ INTRO ══ */
  sec(
    L({ es:'Para empezar', en:'To begin' }),
    L({ es:'La capa delgada de la que dependemos', en:'The thin layer we depend on' }),
    '<p>' + L({
      es:'Debajo de tus pies hay una capa que casi nunca miramos y que sostiene casi todo lo que comes. No es tierra suelta ni polvo: es una mezcla viva de fragmentos de roca, restos de plantas y animales, agua, aire y millones de organismos que trabajan ahí dentro. Esa capa se llama suelo, y en muchos lugares mide apenas unos centímetros.',
      en:'Beneath your feet there is a layer we almost never look at and that supports nearly everything you eat. It is not loose earth or dust: it is a living mixture of rock fragments, remains of plants and animals, water, air and millions of organisms working inside it. That layer is called soil, and in many places it is only a few centimetres thick.'
    }) + '</p>' +
    '<p>' + L({
      es:'Lo que hace especial al suelo es su ritmo. Tarda siglos en formarse y puede perderse en unas cuantas temporadas de lluvias sobre un terreno descubierto. Por eso las decisiones que toma una comunidad sobre sus terrenos pesan tanto, y por eso el suelo aparece en el centro de la conversación sobre el clima que está cambiando.',
      en:'What makes soil special is its pace. It takes centuries to form and can be lost in a few rainy seasons on bare ground. That is why the decisions a community makes about its land weigh so much, and that is why soil sits at the centre of the conversation about the changing climate.'
    }) + '</p>' +
    '<div class="callout"><p><strong>' + L({ es:'Lo que vas a hacer: ', en:'What you are going to do: ' }) + '</strong>' + L({
      es:'vas a armar el orden en que nace un suelo sobre la roca desnuda, a clasificar terrenos según el uso que se les da, a emparejar cada práctica del campo con el daño que produce, a separar lo que sí calienta el planeta de lo que no, y a repartir las jornadas de un grupo hasta cubrir dos metas de cuidado del suelo.',
      en:'you are going to build the order in which a soil is born on bare rock, sort plots by the use given to them, pair each farming practice with the damage it produces, separate what really warms the planet from what does not, and share out the work sessions of a group until two soil care goals are covered.'
    }) + '</p></div>'
  );

  /* ══ CONCEPTO 1 ══ */
  var s1 = sec(
    L({ es:'Concepto 1', en:'Concept 1' }),
    L({ es:'De dónde sale el suelo', en:'Where soil comes from' }),
    '<p>' + L({
      es:'El suelo nace de la roca. El agua, el aire, el hielo y los cambios de temperatura agrietan la roca hasta partirla en fragmentos cada vez más pequeños. Sobre esos fragmentos se instalan los primeros seres vivos, musgos y líquenes, que la siguen desgastando y, al morir, dejan restos. Esos restos se transforman en materia orgánica y se mezclan con la parte mineral gracias a las lombrices, las raíces y las bacterias. Así aparece una capa oscura arriba, otra más clara debajo y la roca madre hasta el fondo.',
      en:'Soil is born from rock. Water, air, ice and changes in temperature crack the rock until it breaks into smaller and smaller fragments. On those fragments the first living things settle, mosses and lichens, which go on wearing them down and, when they die, leave remains. Those remains turn into organic matter and get mixed with the mineral part thanks to worms, roots and bacteria. That is how a dark layer appears on top, a lighter one below and the parent rock at the very bottom.'
    }) + '</p>' +
    '<p>' + L({
      es:'Cinco factores deciden cómo será ese suelo: la roca de la que parte, el clima del lugar, los seres vivos que llegan, el relieve donde se forma y el tiempo que se le dé. El tiempo es el factor más ignorado y el más importante: un centímetro de suelo puede tardar entre cien y varios cientos de años en formarse, según el lugar. Nada de lo que hagas puede acelerarlo.',
      en:'Five factors decide what that soil will be like: the rock it starts from, the climate of the place, the living things that arrive, the relief where it forms and the time it is given. Time is the most ignored factor and the most important one: one centimetre of soil can take between one hundred and several hundred years to form, depending on the place. Nothing you do can speed that up.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Roca madre', en:'Parent rock' }), L({ es:'material de partida', en:'starting material' }), L({ es:'aporta la parte mineral', en:'it provides the mineral part' })) +
      rcard(L({ es:'Clima', en:'Climate' }), L({ es:'agua y temperatura', en:'water and temperature' }), L({ es:'rompen la roca y mueven el proceso', en:'they break the rock and drive the process' })) +
      rcard(L({ es:'Seres vivos', en:'Living things' }), L({ es:'materia orgánica', en:'organic matter' }), L({ es:'la parte viva y oscura de arriba', en:'the living dark part on top' })) +
      rcard(L({ es:'Relieve', en:'Relief' }), L({ es:'plano o pendiente', en:'flat or sloping' }), L({ es:'decide si el suelo se queda o se va', en:'it decides whether soil stays or leaves' })) +
      rcard(L({ es:'Tiempo', en:'Time' }), L({ es:'siglos por centímetro', en:'centuries per centimetre' }), L({ es:'no hay manera de apurarlo', en:'there is no way to rush it' })) +
    '</div>'
  );
  wRoca(rng, widgetHost(s1, 'w_roca', 'timeline'));
  addProblem(rng, mkP1(rng));
  addProblem(rng, mkP2(rng));

  /* ══ CONCEPTO 2 ══ */
  var s2 = sec(
    L({ es:'Concepto 2', en:'Concept 2' }),
    L({ es:'Para qué usamos el suelo', en:'What we use soil for' }),
    '<p>' + L({
      es:'Uso del suelo es la actividad a la que una sociedad destina cada terreno. Los principales son el agrícola, donde se levantan cosechas; el ganadero, donde el terreno alimenta animales; el forestal, donde se aprovechan la madera y otros productos manteniendo el bosque en pie; el urbano e industrial, donde el suelo queda cubierto por calles, casas y bodegas; y el de conservación, donde se protege lo que hay para que siga funcionando.',
      en:'Soil use is the activity a society gives each piece of land over to. The main ones are farming, where harvests are raised; livestock, where the land feeds animals; forestry, where timber and other products are taken while the forest stays standing; urban and industrial, where the soil ends up covered by streets, houses and warehouses; and conservation, where what is there is protected so it keeps working.'
    }) + '</p>' +
    '<p>' + L({
      es:'Cada uso le pide algo distinto al suelo, y no todos los suelos aguantan lo mismo. Un suelo profundo de terreno plano soporta el trabajo del cultivo; uno delgado en pendiente fuerte se va con la primera lluvia si lo dejan descubierto. Cuando un terreno pasa de un uso a otro, por ejemplo de bosque a cultivo y de cultivo a colonia, hablamos de cambio de uso de suelo, y ese cambio casi siempre modifica lo que el suelo recibe y lo que puede seguir dando.',
      en:'Each use asks something different of the soil, and not all soils can take the same thing. Deep soil on flat ground stands up to the work of cropping; thin soil on a steep slope leaves with the first rain if it is left bare. When a plot moves from one use to another, for example from forest to crops and from crops to housing, we speak of a change of soil use, and that change nearly always alters what the soil receives and what it can go on giving.'
    }) + '</p>'
  );
  wUsos(rng, widgetHost(s2, 'w_usos', 'classify'));
  addProblem(rng, mkP3(rng));
  addProblem(rng, mkP4(rng));

  /* ══ CONCEPTO 3 ══ */
  var s3 = sec(
    L({ es:'Concepto 3', en:'Concept 3' }),
    L({ es:'Cuando se le pide de más: sobreexplotación y degradación', en:'When too much is asked: overuse and degradation' }),
    '<p>' + L({
      es:'Sobreexplotar un suelo es sacarle más de lo que alcanza a reponer: sembrar sin descanso, meter más animales de los que la hierba sostiene, quitarle la cubierta cada temporada. La degradación es el resultado: el suelo pierde materia orgánica, pierde estructura y pierde espesor, y con eso pierde la capacidad de sostener vida.',
      en:'To overuse a soil is to take from it more than it manages to replace: sowing without rest, putting in more animals than the grass supports, stripping its cover every season. Degradation is the result: the soil loses organic matter, loses structure and loses thickness, and with that it loses its ability to support life.'
    }) + '</p>' +
    '<p>' + L({
      es:'Toma varias formas. La erosión hídrica se lleva la capa fértil con el agua que escurre por una ladera descubierta. La erosión eólica hace lo mismo con el viento sobre un terreno seco y desnudo. La salinización deja sales en la superficie cuando se riega en exceso sin drenaje en climas calurosos. La compactación aplasta los huecos por donde entran el aire y el agua. Y cuando el proceso avanza tanto que el terreno ya casi no produce, se habla de desertificación. Recuerda el ritmo: lo que tardó siglos en formarse se puede perder en unos cuantos años.',
      en:'It takes several forms. Water erosion carries the fertile layer off with the water running down an uncovered slope. Wind erosion does the same with the wind over dry bare ground. Salinisation leaves salts on the surface when there is too much watering without drainage in hot climates. Compaction crushes the gaps through which air and water get in. And when the process goes so far that the land barely produces, we speak of desertification. Remember the pace: what took centuries to form can be lost in a few years.'
    }) + '</p>'
  );
  wDanio(rng, widgetHost(s3, 'w_danio', 'match'));
  addProblem(rng, mkP5(rng));
  addProblem(rng, mkP6(rng));

  /* ══ CONCEPTO 4 ══ */
  var s4 = sec(
    L({ es:'Concepto 4', en:'Concept 4' }),
    L({ es:'El suelo y el clima que está cambiando', en:'Soil and the changing climate' }),
    '<p>' + L({
      es:'La atmósfera tiene gases que retienen parte del calor que la Tierra devuelve al espacio. Ese efecto invernadero es natural y sin él el planeta sería un lugar helado. El problema es la cantidad: desde hace poco más de un siglo, quemar carbón, petróleo y gas, desmontar bosques y acumular residuos ha subido la concentración de esos gases, y con ella la temperatura promedio del planeta. A eso se le llama calentamiento global, y el cambio climático es el conjunto de alteraciones que trae consigo.',
      en:'The atmosphere has gases that hold back part of the heat the Earth returns to space. That greenhouse effect is natural and without it the planet would be a frozen place. The problem is the amount: for a little over a century, burning coal, oil and gas, clearing forests and piling up waste has raised the concentration of those gases, and with it the average temperature of the planet. That is called global warming, and climate change is the set of alterations it brings with it.'
    }) + '</p>' +
    '<p>' + L({
      es:'El suelo entra en esta historia por los dos lados. Por un lado guarda carbono: la materia orgánica de un suelo sano es un enorme depósito, y cuando se desmonta, se quema o se degrada, ese carbono termina en el aire. Por otro lado lo padece: las sequías más largas resecan y agrietan el terreno, y las lluvias más intensas arrastran más suelo en menos tiempo. Un suelo cubierto y con materia orgánica es al mismo tiempo un freno al problema y una defensa frente a él.',
      en:'Soil enters this story from both sides. On one side it stores carbon: the organic matter of a healthy soil is a huge store, and when it is cleared, burned or degraded, that carbon ends up in the air. On the other side it suffers: longer droughts dry out and crack the ground, and heavier rains drag more soil away in less time. A soil that is covered and rich in organic matter is at once a brake on the problem and a defence against it.'
    }) + '</p>' +
    '<p>' + L({
      es:'Para tomar postura hace falta una distinción que se confunde muy seguido. El estado del tiempo es lo que ocurre hoy en tu ciudad y cambia de un día a otro. El clima es el comportamiento promedio durante muchos años y en regiones enteras. Un invierno frío no desmiente el calentamiento, igual que un día de calor no lo demuestra: lo que se mide son tendencias de décadas y de todo el planeta.',
      en:'To take a stand you need a distinction that gets confused very often. Weather is what happens today in your city and changes from one day to the next. Climate is the average behaviour over many years and across whole regions. A cold winter does not disprove the warming, just as one hot day does not prove it: what is measured are trends over decades and across the whole planet.'
    }) + '</p>'
  );
  wClima(rng, widgetHost(s4, 'w_clima', 'board'));
  addProblem(rng, mkP7(rng));
  addProblem(rng, mkP8(rng));

  /* ══ CONCEPTO 5 ══ */
  var s5 = sec(
    L({ es:'Concepto 5', en:'Concept 5' }),
    L({ es:'Cuidar el suelo y sostener una postura', en:'Caring for soil and holding a stand' }),
    '<p>' + L({
      es:'Frente a un suelo que se está yendo hay dos clases de medidas y conviene usarlas juntas. Las que reparan devuelven lo perdido: composta y abonos orgánicos, plantación de árboles y arbustos, retiro del material arrastrado. Las que previenen cortan el origen: mantener el terreno cubierto entre cosechas, ajustar la cantidad de animales al pasto disponible, dejar descansar y rotar los cultivos, trabajar la ladera de modo que el agua no baje en línea recta. Una comunidad que solo repara repite el mismo trabajo cada temporada.',
      en:'Faced with soil that is leaving there are two kinds of measures and it is worth using them together. Those that repair give back what was lost: compost and organic fertiliser, planting trees and shrubs, removing the dragged material. Those that prevent cut the origin: keeping the ground covered between harvests, matching the number of animals to the available grass, resting and rotating crops, working the slope so that water does not run straight down. A community that only repairs repeats the same work every season.'
    }) + '</p>' +
    '<p>' + L({
      es:'Tomar postura crítica ante el calentamiento global no es repetir consignas ni resignarse. Es informarse con registros y no con impresiones, distinguir el tiempo del clima, señalar qué actividades concretas están detrás del problema, y comprometerse con una acción del tamaño de tus posibilidades. Una acción sirve cuando dice qué se hace, quién lo hace, cuándo, y con qué dato se sabrá después si funcionó.',
      en:'Taking a critical stand on global warming is not repeating slogans nor giving up. It is getting informed with records and not with impressions, telling weather from climate, pointing at which concrete activities lie behind the problem, and committing to an action the size of what you can manage. An action works when it says what is done, who does it, when, and which figure will show afterwards whether it worked.'
    }) + '</p>'
  );
  wParcela(rng, widgetHost(s5, 'w_parcela', 'plan'));
  wPostura(rng, widgetHost(s5, 'w_postura', 'reflect'));
  addProblem(rng, mkP9(rng));

  /* ══ CIERRE ══ */
  sec(
    L({ es:'Para cerrar', en:'To finish' }),
    L({ es:'Un caso con todas sus piezas', en:'A case with all its pieces' }),
    '<p>' + L({
      es:'El caso que sigue junta todo lo anterior: un uso que cambió, un suelo que se degradó, personas afectadas más abajo y una petición. Léelo con calma y decide cuál planteamiento no deja ninguna pieza fuera.',
      en:'The case below brings together everything above: a use that changed, a soil that degraded, people affected further down and a request. Read it calmly and decide which statement leaves no piece out.'
    }) + '</p>'
  );
  addProblem(rng, mkP10(rng));
}
</script>

<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbykkuJ_apGq3vALIFd4mr3acu81c7K4OKxW-DZ-i52Ceyl3lOanXMdvbS9SIXPrLQBm/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'Origen, Usos y Degradación del Suelo';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
