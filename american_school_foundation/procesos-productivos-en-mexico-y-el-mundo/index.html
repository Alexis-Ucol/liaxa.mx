<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Procesos Productivos en México y el Mundo</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:75px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 57px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

/* ── INTERACTIVE WIDGETS ── */
.wgt { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.1rem; margin:1rem 0; }
.wgt-h { font-size:.68rem; letter-spacing:.11em; text-transform:uppercase; color:var(--text3); margin-bottom:.55rem; font-weight:600; }
.iw-sub { font-size:.82rem; color:var(--text2); margin-bottom:.7rem; }
.wtask { background:var(--green-bg); border-radius:8px; padding:.55rem .8rem; font-size:.85rem; color:var(--text); margin-bottom:.75rem; }
.wtask strong { color:var(--green-dark); }
.wmsg { margin-top:.7rem; font-size:.83rem; padding:.6rem .8rem; border-radius:8px; background:var(--surface2); color:var(--text2); }
.wmsg.ok { background:var(--ok-bg); color:var(--ok); }
.wmsg.warn { background:var(--gold-bg); color:var(--text2); border-left:3px solid var(--gold); }
.wprog { font-size:.72rem; color:var(--text3); margin-bottom:.4rem; letter-spacing:.04em; }
.wbtn { background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:.5rem 1rem; font-size:.8rem; cursor:pointer; color:var(--text2); margin-top:.65rem; min-height:44px; }
.wbtn:hover { border-color:var(--green); color:var(--green); }

/* cadena productiva: ordenar pasos */
.ch-list { display:flex; flex-direction:column; gap:.45rem; margin:.6rem 0; }
.ch-chip { display:flex; align-items:center; gap:.6rem; border:1.5px solid var(--border); border-radius:9px; background:var(--surface2); padding:.55rem .75rem; font-size:.85rem; cursor:pointer; min-height:44px; transition:all .13s; }
.ch-chip:hover { border-color:var(--green); }
.ch-chip.sel { border-color:var(--gold); background:var(--gold-bg); }
.ch-chip.locked { cursor:default; border-color:var(--ok); background:var(--ok-bg); }
.ch-num { font-family:'IBM Plex Mono',monospace; font-weight:700; color:var(--text3); flex-shrink:0; width:1.3rem; text-align:center; }

/* clasificador de sectores */
.cls-card { border:1.5px solid var(--border); border-radius:9px; background:var(--surface2); padding:.7rem .85rem; font-size:.86rem; font-weight:600; text-align:center; margin:.6rem 0; }
.cls-bins { display:flex; flex-wrap:wrap; gap:.5rem; }
.cls-bin { flex:1; min-width:120px; min-height:44px; border:1.5px solid var(--border); border-radius:9px; background:var(--surface); padding:.55rem .7rem; font-size:.83rem; font-family:inherit; color:var(--text2); cursor:pointer; transition:all .14s; }
.cls-bin:hover { border-color:var(--green); color:var(--green); }

/* taller de valor agregado */
.cvbox { border:1px solid var(--border); border-radius:10px; background:var(--surface2); overflow:hidden; margin-bottom:.8rem; }
.wcv { display:block; width:100%; height:auto; }
.srow { display:flex; align-items:center; gap:.7rem; margin-bottom:.5rem; flex-wrap:wrap; }
.slbl { font-size:.76rem; color:var(--text3); min-width:118px; }
.srow input[type=range] { flex:1; min-width:150px; accent-color:var(--green); height:32px; }
.sval { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; color:var(--green); min-width:74px; text-align:right; }
.readout { display:grid; grid-template-columns:repeat(3,1fr); gap:.5rem; margin-top:.7rem; }
.rout { background:var(--surface2); border-radius:8px; padding:.55rem; text-align:center; }
.rlbl { font-size:.63rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); }
.rnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; color:var(--green); }

/* emparejar procesos con sus efectos */
.mt-grid { display:grid; grid-template-columns:1fr 1fr; gap:.5rem; margin:.6rem 0; }
.mt-col { display:flex; flex-direction:column; gap:.45rem; }
.mt-hd { font-size:.65rem; text-transform:uppercase; letter-spacing:.07em; color:var(--text3); font-weight:600; margin-bottom:.1rem; }
.mt-chip { border:1.5px solid var(--border); border-radius:9px; background:var(--surface2); padding:.5rem .65rem; font-size:.8rem; cursor:pointer; min-height:44px; transition:all .13s; }
.mt-chip:hover { border-color:var(--green); }
.mt-chip.sel { border-color:var(--gold); background:var(--gold-bg); }
.mt-chip.done { border-color:var(--ok); background:var(--ok-bg); color:var(--ok); cursor:default; }

/* reflexión */
.reflect-prompt { font-size:.92rem; margin:.5rem 0 .8rem; color:var(--text2); }

@media (max-width:600px){
  .readout { grid-template-columns:repeat(3,1fr); gap:.3rem; }
  .rnum { font-size:.8rem; }
  .rlbl { font-size:.56rem; }
  .slbl { min-width:96px; font-size:.72rem; }
  .mt-grid { grid-template-columns:1fr; }
  .cls-bin { min-width:100%; }
  .ch-chip { font-size:.82rem; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Procesos Productivos en México y el Mundo</div>
    <div class="wcourse" id="wcourse-el">Geografía · 1° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>

function setLang(l){
  LANG = l;
  try { localStorage.setItem(LANG_KEY, l); } catch(e){}
  var be=document.getElementById('btn-es'); if(be) be.classList.toggle('active', l==='es');
  var bn=document.getElementById('btn-en'); if(bn) bn.classList.toggle('active', l==='en');

  applyUIStrings();
  if (studentData.name && document.getElementById('lessonScreen').style.display !== 'none') {
    var prev = problems.map(function(p){ return p.studentChoice; });
    problems = []; answeredCount = 0; correctCount = 0;
    document.getElementById('lessonBody').innerHTML = '';
    var res = document.getElementById('s_results'); res.style.display='none'; res.classList.remove('vis');
    buildLesson(seededRng(studentData.name + studentData.group + currentAttempt(studentData.name, studentData.group)));
    var obs = new IntersectionObserver(function(entries){ entries.forEach(function(e){ if(e.isIntersecting) e.target.classList.add('vis'); }); }, { threshold:0.05 });
    document.querySelectorAll('.section').forEach(function(s){ obs.observe(s); });

/* ── Attempt counter + seed (Rule 4): seed = name+group+attempt ── */
function getAttemptKey(name, group){ return 'geo1_t07_g01__att__' + (name+'__'+group).replace(/\s+/g,'_'); }
function nextAttempt(name, group){ var k=getAttemptKey(name,group),n=0; try{n=parseInt(localStorage.getItem(k)||'0',10)||0;}catch(e){} n++; try{localStorage.setItem(k,String(n));}catch(e){} return n; }
function currentAttempt(name, group){ var k=getAttemptKey(name,group); try{return parseInt(localStorage.getItem(k)||'1',10)||1;}catch(e){return 1;} }
/* ================================================
   STATE
   ================================================ */
var studentData   = {};
var problems      = [];

/* ================================================
   SESSION PERSISTENCE  (localStorage)
   ================================================ */
function lsKey() {
  var n = (studentData.name  || '').trim();
  var g = (studentData.group || '').trim();
  return 'geo1_t07_g01__' + (n + '__' + g).replace(/\s+/g, '_');
}

function saveSession() {
  if (!studentData.name) return;
  var drawings = [], texts = [], photos = [];
  problems.forEach(function(p, i) {
    var dc = document.getElementById('dc' + i);
    if (dc && dc.width) {
      var blank = document.createElement('canvas');
      blank.width = dc.width; blank.height = dc.height;
      drawings.push(dc.toDataURL() === blank.toDataURL() ? null : dc.toDataURL('image/png'));
    } else { drawings.push(null); }
    var ta = document.getElementById('ta' + i);
    texts.push(ta ? ta.value : '');
    var pp = document.getElementById('pp' + i);
    photos.push((pp && pp.src && pp.src.indexOf('data:') === 0) ? pp.src : null);
  });
  var state = {
    name: studentData.name, group: studentData.group,
    answeredCount: answeredCount, correctCount: correctCount,
    choices: problems.map(function(p) { return p.studentChoice; }),
    drawings: drawings, texts: texts, photos: photos
  };
  try { localStorage.setItem(lsKey(), JSON.stringify(state)); } catch(e) {}
}

function loadSession(name, group) {
  var key = 'geo1_t07_g01__' + (name + '__' + group).replace(/\s+/g, '_');
  try { var r = localStorage.getItem(key); return r ? JSON.parse(r) : null; } catch(e) { return null; }
}

function restoreSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  var saved = loadSession(name, group);
  if (!saved) return;
  document.getElementById('restoreBar').style.display = 'none';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = currentAttempt(name, group);
  buildLesson(seededRng(name + group + att));
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
  saved.choices.forEach(function(choice, idx) {
    if (choice !== null && choice !== undefined) confirmMC(idx, choice);
  });
  setTimeout(function() {
    if (saved.drawings) {
      saved.drawings.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var dc = document.getElementById('dc' + i);
        if (!dc || !dc.width) return;
        var img = new Image();
        img.onload = function() {
          var dpr = window.devicePixelRatio || 1;
          dc.getContext('2d').drawImage(img, 0, 0, dc.width / dpr, dc.height / dpr);
        };
        img.src = dataUrl;
      });
    }
    if (saved.texts) {
      saved.texts.forEach(function(text, i) {
        if (!text) return;
        var ta = document.getElementById('ta' + i);
        if (ta) ta.value = text;
      });
    }
    if (saved.photos) {

        pp.src = dataUrl; pp.style.display = 'block';
        var pz = document.getElementById('pz' + i);
        if (pz) pz.style.opacity = '0.4';
      });
    }
  }, 300);
}

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

function cvar(name, fb){

function fmtN(n){ return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }

/* Shuffles options (Rule 7) keeping ES/EN aligned, then builds the card inline (Rule 1/5). */
function addProblem(v, rng){
  var n = v.options.es.length, idx = [], k;
  for (k = 0; k < n; k++) idx.push(k);
  for (k = n - 1; k > 0; k--) {
    var j = Math.floor(rng() * (k + 1));
    var tmp = idx[k]; idx[k] = idx[j]; idx[j] = tmp;
  }
  var langOpts = (LANG === 'es') ? v.options.es : v.options.en;
  var prob = {
    title:        v.title[LANG],
    questionText: v.stmt[LANG],
    fn:           v.fn || '',
    hint:         v.hint[LANG],
    explanation:  v.explanation[LANG],
    options:      idx.map(function(o){ return langOpts[o]; }),
    correctIdx:   idx.indexOf(v.correct),
    showWork:     !!v.showWork,
    studentChoice:null, pendingChoice:null
  };
  problems.push(prob);
  buildOneCard(prob, problems.length - 1);
}

/* ================================================
   WIDGET 1 - ARMA LA CADENA PRODUCTIVA
   Three products, one per round. The steps arrive shuffled and the student
   swaps two chips at a time; the feedback says whether the misplaced step
   happens earlier or later, and the third miss shows the finished chain.
   ================================================ */
var CH = null;
function chainProducts(){
  return [
    { es:'una camisa de algodón', en:'a cotton shirt', steps:[
      { es:'En el campo se cosecha el algodón', en:'The cotton is harvested in the field' },
      { es:'En una fábrica se hila la fibra y se teje la tela', en:'In a factory the fibre is spun and the cloth is woven' },
      { es:'En un taller se corta y se cose la camisa', en:'In a workshop the shirt is cut and sewn' },
      { es:'Los camiones reparten las camisas a las tiendas', en:'Trucks deliver the shirts to the shops' },
      { es:'Alguien compra la camisa y se la pone', en:'Someone buys the shirt and wears it' } ] },
    { es:'una taza de café', en:'a cup of coffee', steps:[
      { es:'Se corta el grano de café en la sierra', en:'The coffee bean is picked in the highlands' },
      { es:'Se seca el grano y se le quita la cáscara', en:'The bean is dried and the husk is removed' },
      { es:'Se tuesta y se muele en la planta procesadora', en:'It is roasted and ground at the processing plant' },
      { es:'Las bolsas viajan en tráiler a los comercios', en:'The bags travel by trailer to the shops' },
      { es:'Alguien prepara la taza en su cocina', en:'Someone brews the cup in the kitchen' } ] },
    { es:'una caja de jugo de naranja', en:'a carton of orange juice', steps:[
      { es:'Se cosecha la naranja en la huerta', en:'The orange is harvested in the grove' },
      { es:'Se lava y se exprime la fruta en la planta', en:'The fruit is washed and squeezed at the plant' },
      { es:'El jugo se envasa en cajas selladas', en:'The juice is packed into sealed cartons' },
      { es:'Los tráilers refrigerados llegan al supermercado', en:'Refrigerated trailers arrive at the supermarket' },
      { es:'Una familia lo bebe en el desayuno', en:'A family drinks it at breakfast' } ] }
  ];
}
function buildChain(rng){
  CH = { prods: shuffle(chainProducts(), rng), round:0, order:null, sel:null, tries:0,
         shown:false, done:false, rng:rng };
  chNew();
  return addWidget('chain', 'wChainW',
    '<div class="wgt">' +
      '<div class="wgt-h iw-tag">' + S('Arma la cadena productiva','Build the production chain') + '</div>' +
      '<div class="iw-sub">' + S('Toca dos pasos para intercambiarlos hasta dejar la cadena en orden.','Tap two steps to swap them until the chain is in order.') + '</div>' +
      '<div id="chBox"></div>' +
    '</div>');
}
function chNew(){
  var n = CH.prods[Math.min(CH.round, CH.prods.length - 1)].steps.length;
  var base = [], i;
  for (i = 0; i < n; i++) base.push(i);
  var p = shuffle(base, CH.rng);
  var same = true;
  for (i = 0; i < n; i++) if (p[i] !== i) same = false;
  if (same) { var f = p.shift(); p.push(f); }
  CH.order = p; CH.sel = null; CH.tries = 0; CH.shown = false;
}
function chRender(msg, cls){
  if (!CH) return;
  var box = document.getElementById('chBox');
  if (!box) return;
  var prod = CH.prods[Math.min(CH.round, CH.prods.length - 1)];
  if (CH.done) {
    box.innerHTML = '<div class="wmsg ok">' +
      S('Las tres cadenas quedaron armadas. En todas, el orden es el mismo: primero se obtiene la materia prima, luego se transforma, después se distribuye y al final se consume.',
        'The three chains are built. In all of them the order is the same: first the raw material is obtained, then it is transformed, then it is distributed and at the end it is consumed.') + '</div>';
    return;
  }
  var task = S('Cadena ' + (CH.round + 1) + ' de 3: ordena los pasos de <strong>' + prod.es + '</strong>, del primero al último.',
               'Chain ' + (CH.round + 1) + ' of 3: order the steps of <strong>' + prod.en + '</strong>, from first to last.');
  var chips = CH.order.map(function(si, pos){
    var cl = 'ch-chip' + (CH.sel === pos ? ' sel' : '') + (CH.shown ? ' locked' : '');
    return '<div class="' + cl + '" onclick="chTap(' + pos + ')">' +
             '<span class="ch-num">' + (pos + 1) + '</span> ' + prod.steps[si][LANG] + '</div>';
  }).join('');
  var deflt = S('Toca dos pasos para intercambiarlos de lugar. Puedes moverlos las veces que quieras.',
                'Tap two steps to swap their places. You can move them as many times as you want.');
  box.innerHTML =
    '<div class="wtask">' + task + '</div>' +
    '<div class="ch-list">' + chips + '</div>' +
    (CH.shown
      ? '<button class="wbtn" onclick="chNext()">' + S('Siguiente cadena','Next chain') + '</button>'
      : '<button class="wbtn" onclick="chCheck()">' + S('Comprobar','Check') + '</button>') +
    '<div class="wmsg' + (cls ? ' ' + cls : '') + '">' + (msg || deflt) + '</div>';
}
function chTap(pos){
  if (!CH || CH.done || CH.shown) return;
  if (CH.sel === null) CH.sel = pos;
  else if (CH.sel === pos) CH.sel = null;
  else {
    var t = CH.order[CH.sel]; CH.order[CH.sel] = CH.order[pos]; CH.order[pos] = t; CH.sel = null;
  }
  chRender();
}
function chCheck(){
  if (!CH || CH.done || CH.shown) return;
  var ok = true, i;
  for (i = 0; i < CH.order.length; i++) if (CH.order[i] !== i) ok = false;
  if (ok) {
    CH.shown = true;
    chRender(S('Cadena correcta. Fíjate en el salto entre el segundo y el tercer paso: ahí el producto deja de ser materia prima.',
               'Correct chain. Look at the jump between the second and the third step: that is where the product stops being a raw material.'), 'ok');
    return;
  }
  CH.tries++;
  if (CH.tries >= 3) {
    var fix = [];
    for (i = 0; i < CH.order.length; i++) fix.push(i);
    CH.order = fix; CH.sel = null; CH.shown = true;
    chRender(S('Este es el orden correcto. Pregúntate siempre qué necesita el paso siguiente para poder ocurrir.',
               'This is the correct order. Always ask yourself what the next step needs in order to happen.'), 'warn');
    return;
  }
  var bad = 0;
  for (i = 0; i < CH.order.length; i++) { if (CH.order[i] !== i) { bad = i; break; } }
  var late = CH.order[bad] > bad;
  var msg = late
    ? S('Todavía no. El paso que está en el lugar ' + (bad + 1) + ' ocurre más tarde: bájalo y sube el que le corresponde.',
        'Not yet. The step sitting in place ' + (bad + 1) + ' happens later: move it down and bring up the one that belongs there.')
    : S('Todavía no. El paso que está en el lugar ' + (bad + 1) + ' ocurre antes: súbelo y baja el que le corresponde.',
        'Not yet. The step sitting in place ' + (bad + 1) + ' happens earlier: move it up and push down the one that belongs there.');
  chRender(msg, 'warn');
}
function chNext(){
  if (!CH || CH.done) return;
  CH.round++;
  if (CH.round >= CH.prods.length) { CH.done = true; chRender(); return; }
  chNew();
  chRender();
}

/* ================================================
   WIDGET 2 - CLASIFICADOR DE SECTORES
   Each job goes into the sector that matches the step it performs. A wrong
   pick gives a directional question; the third miss reveals and moves on.
   ================================================ */
var SEC = null;
function buildSector(rng){
  var ITEMS = [
    { es:'Cortar caña de azúcar en la parcela', en:'Cutting sugar cane in the field', bin:0,
      why:{ es:'toma un producto directamente de la tierra', en:'takes a product straight from the land' } },
    { es:'Convertir la caña en azúcar dentro de un ingenio', en:'Turning the cane into sugar inside a mill', bin:1,
      why:{ es:'cambia la materia prima en otro producto', en:'changes the raw material into another product' } },
    { es:'Vender el azúcar por kilo en el mercado del pueblo', en:'Selling the sugar by the kilo in the town market', bin:2,
      why:{ es:'acerca el producto a quien lo consume', en:'brings the product closer to whoever consumes it' } },
    { es:'Sacar plata de una mina', en:'Extracting silver from a mine', bin:0,
      why:{ es:'toma un recurso del subsuelo', en:'takes a resource from underground' } },
    { es:'Ensamblar refrigeradores en una planta', en:'Assembling refrigerators in a plant', bin:1,
      why:{ es:'arma un producto con piezas ya elaboradas', en:'puts a product together from parts already made' } },
    { es:'Atender a los huéspedes de un hotel de playa', en:'Looking after the guests of a beach hotel', bin:2,
      why:{ es:'ofrece un servicio, no un objeto', en:'offers a service, not an object' } }
  ];
  SEC = { items:ITEMS, seq: shuffle([0,1,2,3,4,5], rng), i:0, tries:0, correct:0, done:false, lock:false };
  return addWidget('sector', 'wSectorW',
    '<div class="wgt">' +
      '<div class="wgt-h iw-tag">' + S('¿A qué sector pertenece?','Which sector does it belong to?') + '</div>' +
      '<div class="iw-sub">' + S('Manda cada trabajo al sector que le corresponde y observa la respuesta al instante.','Send each job to the sector it belongs to and watch the reply straight away.') + '</div>' +
      '<div id="secBox"></div>' +
    '</div>');
}
function secBins(){ return S(['Primario','Secundario','Terciario'], ['Primary','Secondary','Tertiary']); }
function secRender(msg, cls){
  if (!SEC) return;
  var box = document.getElementById('secBox');
  if (!box) return;
  if (SEC.done) {
    box.innerHTML = '<div class="wmsg ok">' + S('Trabajos clasificados: ','Jobs sorted: ') + SEC.correct + ' / ' + SEC.items.length + '. ' +
      S('El sector no depende del producto sino del paso que realiza cada trabajo dentro de la cadena.',
        'The sector does not depend on the product but on the step each job performs inside the chain.') + '</div>';
    return;
  }
  var it = SEC.items[SEC.seq[SEC.i]];
  var B = secBins();
  var deflt = S('Lee el trabajo y decide qué paso de la cadena realiza.',
                'Read the job and decide which step of the chain it performs.');
  box.innerHTML =
    '<div class="wprog">' + (SEC.i + 1) + ' / ' + SEC.items.length + '</div>' +
    '<div class="cls-card">' + it[LANG] + '</div>' +
    '<div class="cls-bins">' +
      '<button class="cls-bin" onclick="secPick(0)">' + B[0] + '</button>' +
      '<button class="cls-bin" onclick="secPick(1)">' + B[1] + '</button>' +
      '<button class="cls-bin" onclick="secPick(2)">' + B[2] + '</button>' +
    '</div>' +
    '<div class="wmsg' + (cls ? ' ' + cls : '') + '">' + (msg || deflt) + '</div>';
}
function secPick(bi){
  if (!SEC || SEC.done || SEC.lock) return;
  var it = SEC.items[SEC.seq[SEC.i]];
  var B = secBins();
  if (bi === it.bin) {
    SEC.correct++; SEC.tries = 0; SEC.i++;
    if (SEC.i >= SEC.items.length) SEC.done = true;
    secRender(S('Correcto: ese trabajo ' + it.why.es + '. Sigue con el siguiente.',
                'Correct: that job ' + it.why.en + '. On to the next one.'), 'ok');
    return;
  }
  SEC.tries++;
  if (SEC.tries >= 3) {
    SEC.tries = 0; SEC.i++; SEC.lock = true;
    if (SEC.i >= SEC.items.length) SEC.done = true;
    secRender(S('Era <b>' + B[it.bin] + '</b>, porque ese trabajo ' + it.why.es + '.',
                'It was <b>' + B[it.bin] + '</b>, because that job ' + it.why.en + '.'), 'warn');
    setTimeout(function(){ if (SEC) { SEC.lock = false; secRender(); } }, 1600);
    return;
  }
  var nudge = (bi === 0)
    ? S('Todavía no. ¿De verdad ese trabajo saca algo de la naturaleza, o recibe algo que ya salió de ella?',
        'Not yet. Does that job really take something out of nature, or does it receive something already taken from it?')
    : (bi === 1
        ? S('Todavía no. ¿Ese trabajo cambia la forma del producto, o lo deja igual y solo lo mueve u ofrece?',
            'Not yet. Does that job change the shape of the product, or does it leave it as it is and only move or offer it?')
        : S('Todavía no. ¿Ese trabajo mueve o atiende, o más bien obtiene o transforma el producto?',
            'Not yet. Does that job move or serve, or does it rather obtain or transform the product?'));
  secRender(nudge, 'warn');
}

/* ================================================
   WIDGET 3 - TALLER DE VALOR AGREGADO
   The same harvest sold at three different points of the chain. The kilos
   slider and the step tabs redraw the three income bars and the target line
   live; three targets, and the third miss shows one combination that works.
   ================================================ */
var VA = null;
var VA_PRICES = [40, 90, 150];
function vaSteps(){ return S(['En grano sin procesar','Tostado en grano','Molido y empacado'],
                             ['Unprocessed beans','Roasted beans','Ground and packed']); }
function vaShort(){ return S(['grano','tostado','empacado'], ['beans','roasted','packed']); }
function buildValue(rng){
  var pools = [ [6000, 4500, 12000], [8000, 5400, 10500] ];
  VA = { kg:50, step:0, round:0, tries:0, shown:false, done:false, goals: shuffle(pick(pools, rng), rng) };
  return addWidget('valor', 'wValueW',
    '<div class="wgt">' +
      '<div class="wgt-h iw-tag">' + S('Taller de valor agregado','Value added workshop') + '</div>' +
      '<div class="iw-sub">' + S('Mueve los kilos y cambia el paso de venta: las tres barras y la línea de la meta se dibujan al momento.','Move the kilos and change the selling step: the three bars and the target line are drawn instantly.') + '</div>' +
      '<div id="vaBox"></div>' +
    '</div>');
}
function vaIncome(){ return VA.kg * VA_PRICES[VA.step]; }
function vaSetKg(v){ if (!VA || VA.done || VA.shown) return; VA.kg = parseInt(v, 10); vaRender(); }
function vaSetStep(i){ if (!VA || VA.done || VA.shown) return; VA.step = i; vaRender(); }
function vaSolve(goal){
  for (var s = 0; s < 3; s++) {
    var kg = goal / VA_PRICES[s];
    if (kg === Math.round(kg) && kg % 10 === 0 && kg >= 10 && kg <= 200) return { step:s, kg:kg };
  }
  return null;
}
function vaRender(msg, cls){
  if (!VA) return;
  var box = document.getElementById('vaBox');
  if (!box) return;
  var names = vaSteps();
  var goal = VA.goals[Math.min(VA.round, VA.goals.length - 1)];
  var task = VA.done
    ? S('Las tres metas quedaron atrás. Sigue moviendo los kilos y el paso de venta para ver cómo cambia el ingreso.',
        'The three targets are behind you. Keep moving the kilos and the selling step to see how the income changes.')
    : S('Meta ' + (VA.round + 1) + ' de 3: consigue un ingreso de exactamente <strong>' + fmtN(goal) + ' pesos</strong>.',
        'Target ' + (VA.round + 1) + ' of 3: reach an income of exactly <strong>' + fmtN(goal) + ' pesos</strong>.');
  var tabs = names.map(function(nm, i){
    return '<button class="mtab' + (VA.step === i ? ' active' : '') + '" onclick="vaSetStep(' + i + ')">' + nm + '</button>';
  }).join('');
  var deflt = S('La cosecha es la misma. Elige cuántos kilos vendes y en qué paso de la cadena los vendes.',
                'The harvest is the same. Choose how many kilos you sell and at which step of the chain you sell them.');
  box.innerHTML =
    '<div class="wtask">' + task + '</div>' +
    '<div class="cvbox"><canvas class="wcv" id="vaCv" width="600" height="220"></canvas></div>' +
    '<div class="mtabs">' + tabs + '</div>' +
    '<div class="srow"><div class="slbl">' + S('Kilogramos','Kilograms') + '</div>' +
      '<input type="range" min="10" max="200" step="10" value="' + VA.kg + '" oninput="vaSetKg(this.value)">' +
      '<div class="sval">' + VA.kg + '</div></div>' +
    '<div class="readout">' +
      '<div class="rout"><div class="rlbl">' + S('Precio por kilo','Price per kilo') + '</div><div class="rnum">' + VA_PRICES[VA.step] + '</div></div>' +
      '<div class="rout"><div class="rlbl">' + S('Ingreso','Income') + '</div><div class="rnum">' + fmtN(vaIncome()) + '</div></div>' +
      '<div class="rout"><div class="rlbl">' + S('Sin procesar','Unprocessed') + '</div><div class="rnum">' + fmtN(VA.kg * VA_PRICES[0]) + '</div></div>' +
    '</div>' +
    (VA.done ? ''
      : (VA.shown
          ? '<button class="wbtn" onclick="vaNext()">' + S('Siguiente meta','Next target') + '</button>'
          : '<button class="wbtn" onclick="vaCheck()">' + S('Comprobar','Check') + '</button>')) +
    '<div class="wmsg' + (cls ? ' ' + cls : '') + '">' + (msg || deflt) + '</div>';
  vaDraw();
}
function vaDraw(){
  var cv = document.getElementById('vaCv');
  if (!cv || !cv.getContext) return;
  var ctx = cv.getContext('2d');
  var W = cv.width, H = cv.height;
  var cSurf = cvar('--surface2', '#f0ede6');
  var cBar = cvar('--green', '#1a4a8a');
  var cAcc = cvar('--gold', '#c9a84c');
  var cFaint = cvar('--border', '#ddd8cc');
  var cTxt = cvar('--text3', '#7a7468');
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = cSurf; ctx.fillRect(0, 0, W, H);
  var goal = VA.done ? 0 : VA.goals[Math.min(VA.round, VA.goals.length - 1)];
  var vals = [VA.kg * VA_PRICES[0], VA.kg * VA_PRICES[1], VA.kg * VA_PRICES[2]];
  var top = Math.max(vals[2], goal) * 1.18;
  if (top <= 0) top = 1;
  var L = 20, R = W - 20, T = 22, B = H - 26, i;
  ctx.strokeStyle = cFaint; ctx.lineWidth = 1;
  for (i = 0; i <= 3; i++) {
    var gy = T + (B - T) * i / 3;
    ctx.beginPath(); ctx.moveTo(L, gy); ctx.lineTo(R, gy); ctx.stroke();
  }
  var bw = (R - L) / 3 * 0.5;
  var labels = vaShort();
  for (i = 0; i < 3; i++) {
    var cx = L + (R - L) * (i + 0.5) / 3;
    var h = (B - T) * vals[i] / top;
    ctx.fillStyle = (i === VA.step) ? cBar : cFaint;
    ctx.fillRect(cx - bw / 2, B - h, bw, h);
    ctx.fillStyle = cTxt; ctx.textAlign = 'center'; ctx.font = '13px sans-serif';
    ctx.fillText(fmtN(vals[i]), cx, B - h - 7);
    ctx.font = '12px sans-serif';
    ctx.fillText(labels[i], cx, H - 8);
  }
  if (goal > 0) {
    var y = B - (B - T) * goal / top;
    ctx.setLineDash([6, 5]); ctx.strokeStyle = cAcc; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(L, y); ctx.lineTo(R, y); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = cAcc; ctx.textAlign = 'left'; ctx.font = '12px sans-serif';
    ctx.fillText(S('meta ', 'target ') + fmtN(goal), L + 4, y - 6);
  }
}
function vaCheck(){
  if (!VA || VA.done || VA.shown) return;
  var goal = VA.goals[VA.round];
  var got = vaIncome();
  if (got === goal) {
    VA.shown = true;
    vaRender(S('Exacto. Compara la barra que vendiste con la del grano sin procesar: esa diferencia es el valor que agregó el trabajo.',
               'Exactly. Compare the bar you sold with the unprocessed one: that difference is the value the work added.'), 'ok');
    return;
  }
  VA.tries++;
  if (VA.tries >= 3) {
    var sol = vaSolve(goal);
    if (sol) { VA.kg = sol.kg; VA.step = sol.step; }
    VA.shown = true;
    vaRender(S('Con ' + (sol ? sol.kg : VA.kg) + ' kilos vendidos en ese paso el ingreso llega justo a la meta. El precio por kilo sube con cada transformación.',
               'With ' + (sol ? sol.kg : VA.kg) + ' kilos sold at that step the income lands exactly on the target. The price per kilo rises with every transformation.'), 'warn');
    return;
  }
  var dif = goal - got;
  var msg;
  if (dif > 0) {
    msg = (VA.kg >= 200 && VA.step < 2)
      ? S('Te faltan ' + fmtN(dif) + ' pesos y ya estás en el máximo de kilos. La única salida es vender en un paso más adelantado de la cadena.',
          'You are ' + fmtN(dif) + ' pesos short and you are already at the maximum kilos. The only way out is to sell at a later step of the chain.')
      : S('Te faltan ' + fmtN(dif) + ' pesos. Sube los kilos o vende en un paso más adelantado de la cadena.',
          'You are ' + fmtN(dif) + ' pesos short. Raise the kilos or sell at a later step of the chain.');
  } else {
    msg = S('Te pasas por ' + fmtN(-dif) + ' pesos. Baja los kilos o vende en un paso anterior de la cadena.',
            'You are over by ' + fmtN(-dif) + ' pesos. Lower the kilos or sell at an earlier step of the chain.');
  }
  vaRender(msg, 'warn');
}
function vaNext(){
  if (!VA || VA.done) return;
  VA.round++; VA.tries = 0; VA.shown = false;
  if (VA.round >= VA.goals.length) { VA.done = true; }
  vaRender();
}

   Tap a process on the left, then the effect on the right. Wrong pairs stay
   open and give a nudge; the third miss on the same process shows its pair.
   ================================================ */
var MT = null;
function buildMatch(rng){
  var PAIRS = [
    { l:{ es:'Veinte lanchas familiares con redes pequeñas, una salida al día',
          en:'Twenty family boats with small nets, one trip a day' },

    { l:{ es:'Un barco industrial con redes de gran tamaño',
          en:'One industrial ship with very large nets' },
      r:{ es:'Trae mucho volumen con poca tripulación y puede agotar el banco de peces',
          en:'Brings a large volume with a small crew and can exhaust the fishing ground' },
      tip:{ es:'piensa en el volumen y en lo que queda en el mar', en:'think about the volume and about what is left in the sea' } },
    { l:{ es:'Un invernadero de jitomate con riego por goteo',
          en:'A tomato greenhouse with drip irrigation' },
      r:{ es:'Cosecha casi todo el año y aprovecha mejor cada litro de agua',
          en:'Harvests almost all year and makes better use of every litre of water' },
      tip:{ es:'pregúntate cuántas veces al año cosecha', en:'ask yourself how many times a year it harvests' } },
    { l:{ es:'Una milpa de temporal en la ladera del cerro',
          en:'A rain fed milpa on the hillside' },
      r:{ es:'Depende de que llueva y se cosecha una vez al año',
          en:'Depends on the rain and is harvested once a year' },
      tip:{ es:'fíjate de dónde saca el agua ese proceso', en:'look at where the water of that process comes from' } }
  ];
  MT = { pairs:PAIRS, right: shuffle([0,1,2,3], rng), sel:null, tries:0,
         doneL:[false,false,false,false], doneR:[false,false,false,false], solved:0, done:false };
  return addWidget('match', 'wMatchW',
    '<div class="wgt">' +
      '<div class="wgt-h iw-tag">' + S('Cada proceso y su efecto','Each process and its effect') + '</div>' +
      '<div class="iw-sub">' + S('Toca un proceso y luego el efecto que le corresponde hasta emparejar los cuatro.','Tap a process and then its matching effect until all four are paired.') + '</div>' +
      '<div id="mtBox"></div>' +
    '</div>');
}
function mtRender(msg, cls){
  if (!MT) return;
  var box = document.getElementById('mtBox');
  if (!box) return;
  if (MT.done) {
    box.innerHTML = '<div class="wmsg ok">' +
      S('Los cuatro procesos quedaron emparejados. Dos producen mucho con poca gente y dos reparten el trabajo entre muchas manos: eso es lo que se compara al mirar procesos productivos.',
        'The four processes are paired up. Two produce a lot with few people and two share the work among many hands: that is what gets compared when looking at productive processes.') + '</div>';
    return;
  }
  var left = MT.pairs.map(function(p, i){
    var cl = 'mt-chip' + (MT.doneL[i] ? ' done' : '') + (MT.sel === i ? ' sel' : '');
    return '<div class="' + cl + '" onclick="mtPickL(' + i + ')">' + p.l[LANG] + '</div>';
  }).join('');
  var right = MT.right.map(function(ri, pos){
    var cl = 'mt-chip' + (MT.doneR[pos] ? ' done' : '');
    return '<div class="' + cl + '" onclick="mtPickR(' + pos + ')">' + MT.pairs[ri].r[LANG] + '</div>';
  }).join('');
  var deflt = S('Toca un proceso y después el efecto que le corresponde.',
                'Tap a process and then the effect that goes with it.');
  box.innerHTML =
    '<div class="wprog">' + MT.solved + ' / ' + MT.pairs.length + '</div>' +
    '<div class="mt-grid">' +
      '<div class="mt-col"><div class="mt-hd">' + S('Proceso','Process') + '</div>' + left + '</div>' +
      '<div class="mt-col"><div class="mt-hd">' + S('Efecto','Effect') + '</div>' + right + '</div>' +
    '</div>' +
    '<div class="wmsg' + (cls ? ' ' + cls : '') + '">' + (msg || deflt) + '</div>';
}
function mtLock(li){
  MT.doneL[li] = true;
  for (var pos = 0; pos < MT.right.length; pos++) if (MT.right[pos] === li) MT.doneR[pos] = true;
  MT.solved++; MT.sel = null; MT.tries = 0;
  if (MT.solved >= MT.pairs.length) MT.done = true;
}
function mtPickL(li){
  if (!MT || MT.done || MT.doneL[li]) return;
  MT.sel = (MT.sel === li) ? null : li;
  MT.tries = 0;
  mtRender();
}
function mtPickR(pos){
  if (!MT || MT.done || MT.doneR[pos]) return;
  if (MT.sel === null) {
    mtRender(S('Elige primero un proceso de la columna izquierda.','Choose a process from the left column first.'), 'warn');
    return;
  }
  var li = MT.sel;
  if (MT.right[pos] === li) {
    mtLock(li);
    mtRender(S('Emparejado. Ese efecto sale de la manera de producir, no del producto.',
               'Paired. That effect comes from the way of producing, not from the product.'), 'ok');
    return;
  }
  MT.tries++;
  if (MT.tries >= 3) {
    var tip = MT.pairs[li].tip[LANG];
    mtLock(li);
    mtRender(S('Este era su efecto. Para la próxima, ' + tip + '.',
               'This was its effect. Next time, ' + tip + '.'), 'warn');
    return;
  }
  mtRender(S('Ese efecto es de otro proceso. Vuelve a leer el que elegiste: ' + MT.pairs[li].tip.es + '.',
             'That effect belongs to another process. Read again the one you chose: ' + MT.pairs[li].tip.en + '.'), 'warn');
}

function reflectTab(which, btn){

  var tabs = btn.closest('.wtabs');

    '<p>' + S('Un kilogramo de café en grano sin procesar no cuesta lo mismo que un kilogramo de café tostado, molido y empacado. Es el mismo café: lo que cambió es el trabajo, la maquinaria y el empaque que se le agregaron en el camino. A esa diferencia se le llama valor agregado.',

      hint:{ es:'Cuenta cuántas cosechas al año logra cada parcela y de qué depende cada una para conseguir agua.',
             en:'Count how many harvests a year each plot achieves and what each one depends on to get water.' },
      explanation:{ es:'La misma superficie puede dar resultados muy distintos según el proceso. El invernadero controla el agua y cosecha varias veces al año; la parcela de temporal depende de la lluvia y cosecha una sola vez. El número de trabajadores no decide por sí solo la cantidad producida.',
                    en:'The same surface can give very different results depending on the process. The greenhouse controls the water and harvests several times a year; the rain fed plot depends on the rain and harvests only once. The number of workers does not by itself decide the amount produced.' } }
  ], rng), rng);

  /* ── GRADED 8 ───────────────────────────────────────────────── */
  addProblem(pick([
    { title:{ es:'Los pozos cada vez más hondos', en:'Wells that go deeper and deeper' }, showWork:false,
      stmt:{ es:'En una zona semiárida se ampliaron los cultivos de exportación que necesitan riego constante. En pocos años, los pozos de las localidades vecinas tuvieron que perforarse cada vez más profundo para seguir sacando agua. ¿Qué implicación del proceso productivo muestra este caso?',
             en:'In a semi arid zone the export crops that need constant irrigation were expanded. Within a few years, the wells of the neighbouring localities had to be drilled deeper and deeper to keep pulling up water. Which implication of the production process does this case show?' },
      options:{ es:[
        'La producción para vender fuera compite por el agua con el uso de las localidades, y el recurso se gasta más rápido de lo que se recupera.',
        'La perforación de pozos más profundos demuestra que el agua del subsuelo aumenta cuando se riega más superficie.',
        'El riego constante no tiene efecto en los pozos, porque toda el agua de riego regresa completa al subsuelo.',
        'La implicación es únicamente económica, porque el cultivo de exportación deja ingresos a quienes lo siembran.' ],
        en:[
        'Production for sale abroad competes for water with the use of the localities, and the resource is spent faster than it is replenished.',
        'Drilling deeper wells proves that underground water increases when more surface is irrigated.',
        'Constant irrigation has no effect on the wells, because all the irrigation water returns in full to the subsoil.',
        'The implication is only economic, because the export crop leaves income for those who grow it.' ] },
      correct:0,
      hint:{ es:'Sigue el recorrido del agua: de dónde sale, quién más la necesita y cada cuánto se repone.',
             en:'Follow the path of the water: where it comes from, who else needs it and how often it is replenished.' },
      explanation:{ es:'El agua del subsuelo es la misma para el riego y para las casas. Si se extrae más de la que entra, el nivel baja y los pozos tienen que ir más hondo. Junto al ingreso aparece un costo ambiental y social que no viene incluido en el precio del producto.',
                    en:'The underground water is the same for irrigation and for homes. If more is taken out than comes in, the level drops and the wells have to go deeper. Alongside the income appears an environmental and social cost that does not come included in the price of the product.' } },
    { title:{ es:'La ladera sin bosque', en:'The hillside without woodland' }, showWork:false,
      stmt:{ es:'Para ampliar una plantación muy rentable se abrió terreno sobre el bosque de una ladera. Dos temporadas después, las lluvias arrastraron el suelo y el arroyo del que bebe el pueblo bajó su caudal. ¿Qué implicación del proceso productivo muestra este caso?',
             en:'To expand a very profitable plantation, land was cleared over the woodland of a hillside. Two seasons later, the rains washed away the soil and the stream the village drinks from lost part of its flow. Which implication of the production process does this case show?' },
      options:{ es:[
        'Al quitar la cubierta del bosque, la ganancia de la plantación llega junto con pérdida de suelo y menos agua para el pueblo.',
        'La pérdida de suelo demuestra que el bosque impedía que el agua de lluvia llegara al arroyo del pueblo.',
        'El cambio no tiene relación con la plantación, porque el suelo y el caudal dependen solamente del clima de cada temporada.',
        'La implicación es únicamente social, porque el terreno de la ladera cambió de dueño al abrirse la plantación.' ],
        en:[
        'By removing the woodland cover, the gain from the plantation arrives together with soil loss and less water for the village.',
        'The soil loss proves that the woodland was preventing rainwater from reaching the village stream.',
        'The change has nothing to do with the plantation, because soil and flow depend only on the climate of each season.',
        'The implication is only social, because the hillside land changed owner when the plantation was opened.' ] },
      correct:0,
      hint:{ es:'Pregúntate qué hacía el bosque con la lluvia que caía en esa ladera.',
             en:'Ask yourself what the woodland used to do with the rain that fell on that hillside.' },
      explanation:{ es:'Las raíces y la hojarasca sostenían el suelo y dejaban que el agua se filtrara poco a poco hacia el arroyo. Sin esa cubierta, la lluvia arrastra la tierra y escurre de golpe. La plantación gana dinero y el territorio pierde suelo y agua al mismo tiempo.',
                    en:'The roots and the leaf litter held the soil and let the water seep slowly toward the stream. Without that cover, the rain drags the earth away and runs off all at once. The plantation earns money and the territory loses soil and water at the same time.' } }
  ], rng), rng);

  buildReflect(rng);

  /* ── GRADED 9 ───────────────────────────────────────────────── */
  addProblem(pick([
    { title:{ es:'Cómo se reparte lo que pagas', en:'How what you pay gets shared' }, showWork:true,
      stmt:{ es:'De cada 100 pesos que paga quien compra una caja de fresas, 18 pesos son para quien las cosecha, 22 para el transporte y 15 para el empaque. El resto se queda en la tienda. ¿Cuánto de esos 100 pesos se queda en la tienda?',
             en:'Out of every 100 pesos paid by whoever buys a box of strawberries, 18 pesos go to whoever harvests them, 22 to transport and 15 to packaging. The rest stays in the shop. How much of those 100 pesos stays in the shop?' },
      options:{ es:['45 pesos','55 pesos','40 pesos','18 pesos'],
                en:['45 pesos','55 pesos','40 pesos','18 pesos'] },
      correct:0,
      hint:{ es:'Junta primero todo lo que ya tiene destino y quita ese total del precio completo.',
             en:'First gather everything that already has a destination and take that total from the full price.' },
      explanation:{ es:'Los tres pasos conocidos suman 18 + 22 + 15 = 55 pesos, así que a la tienda le quedan 100 − 55 = 45 pesos. Quien cosecha, que es donde empieza la cadena, se queda con 18 de cada 100.',
                    en:'The three known steps add up to 18 + 22 + 15 = 55 pesos, so the shop keeps 100 − 55 = 45 pesos. Whoever harvests, which is where the chain begins, keeps 18 out of every 100.' } },
    { title:{ es:'Cómo se reparte lo que pagas', en:'How what you pay gets shared' }, showWork:true,
      stmt:{ es:'De cada 100 pesos que paga quien compra una bolsa de café molido, 20 pesos son para quien lo cosecha, 25 para el tueste y 12 para el empaque. El resto se queda en la tienda. ¿Cuánto de esos 100 pesos se queda en la tienda?',
             en:'Out of every 100 pesos paid by whoever buys a bag of ground coffee, 20 pesos go to whoever harvests it, 25 to roasting and 12 to packaging. The rest stays in the shop. How much of those 100 pesos stays in the shop?' },
      options:{ es:['43 pesos','57 pesos','45 pesos','20 pesos'],
                en:['43 pesos','57 pesos','45 pesos','20 pesos'] },
      correct:0,
      hint:{ es:'Junta primero todo lo que ya tiene destino y quita ese total del precio completo.',
             en:'First gather everything that already has a destination and take that total from the full price.' },
      explanation:{ es:'Los tres pasos conocidos suman 20 + 25 + 12 = 57 pesos, así que a la tienda le quedan 100 − 57 = 43 pesos. Quien cosecha, que es donde empieza la cadena, se queda con 20 de cada 100.',
                    en:'The three known steps add up to 20 + 25 + 12 = 57 pesos, so the shop keeps 100 − 57 = 43 pesos. Whoever harvests, which is where the chain begins, keeps 20 out of every 100.' } }
  ], rng), rng);

  /* ── GRADED 10 ──────────────────────────────────────────────── */
  addProblem(pick([
    { title:{ es:'El municipio que cambió de oficio', en:'The municipality that changed trade' }, showWork:false,
      stmt:{ es:'En quince años, un municipio pasó de vivir del campo a alojar tres plantas armadoras. Llegaron trabajadores de otros estados, se abrieron colonias nuevas, escuelas y rutas de camión, y el suelo de cultivo de la orilla se convirtió en bodegas. ¿Qué muestra este caso?',
             en:'In fifteen years, a municipality went from living off farming to hosting three assembly plants. Workers arrived from other states, new neighbourhoods, schools and bus routes opened, and the farmland on the edge turned into warehouses. What does this case show?' },
      options:{ es:[
        'Que los procesos productivos organizan el espacio: donde se instala la industria se concentran población y servicios, y el uso del suelo cambia.',
        'Que la población de un municipio crece solo cuando aumentan las escuelas y las rutas de camión disponibles.',
        'Que la industria y la agricultura pueden ocupar el mismo suelo a la vez sin que ninguna de las dos se modifique.',
        'Que el municipio dejó de tener actividades primarias porque sus habitantes cambiaron de lugar de residencia.' ],
        en:[
        'That productive processes organise space: where industry settles, population and services concentrate, and land use changes.',
        'That the population of a municipality grows only when the available schools and bus routes increase.',
        'That industry and farming can occupy the same land at the same time without either of them changing.',
        'That the municipality lost its primary activities because its inhabitants changed where they live.' ] },
      correct:0,
      hint:{ es:'Ordena en el tiempo lo que fue llegando al municipio y pregúntate qué lo puso en marcha.',
             en:'Put in order what arrived in the municipality over time and ask yourself what set it off.' },
      explanation:{ es:'Primero llegaron las plantas; después la gente, las colonias, las escuelas, las rutas y el cambio de uso del suelo. La actividad productiva es la que atrae población y reordena el territorio, y por eso el mapa económico y el mapa de la gente se parecen tanto.',
                    en:'First came the plants; then the people, the neighbourhoods, the schools, the routes and the change in land use. The productive activity is what attracts population and reorders the territory, and that is why the economic map and the map of people look so alike.' } },
    { title:{ es:'La bahía que se llenó de hoteles', en:'The bay that filled with hotels' }, showWork:false,
      stmt:{ es:'Una bahía de pescadores se llenó de hoteles en veinte años. Se construyó un aeropuerto, llegaron familias de otros estados a trabajar en los servicios y las colonias nuevas subieron por el cerro sin agua entubada. ¿Qué muestra este caso?',
             en:'A bay of fishers filled with hotels in twenty years. An airport was built, families from other states arrived to work in services and the new neighbourhoods climbed up the hill without piped water. What does this case show?' },
      options:{ es:[
        'Que la actividad productiva reordena el territorio: atrae población y obras, y el crecimiento puede adelantarse a los servicios básicos.',
        'Que la llegada de los hoteles garantiza que todos los habitantes nuevos reciban agua entubada y servicios completos.',
        'Que la población de la bahía creció por su propio aumento de nacimientos y no por la actividad de los hoteles.',
        'Que el turismo forma parte de las actividades primarias, porque su atractivo principal es el paisaje natural de la costa.' ],
        en:[
        'That productive activity reorders the territory: it attracts population and public works, and growth can run ahead of basic services.',
        'That the arrival of the hotels guarantees that all new inhabitants receive piped water and complete services.',
        'That the population of the bay grew from its own rise in births and not from the activity of the hotels.',
        'That tourism is part of primary activities, because its main attraction is the natural landscape of the coast.' ] },
      correct:0,
      hint:{ es:'Fíjate en qué llegó primero a la bahía y qué llegó después, y qué quedó pendiente.',
             en:'Look at what arrived in the bay first and what came later, and what was left pending.' },
      explanation:{ es:'Los hoteles atrajeron empleo, y el empleo atrajo familias, aeropuerto y colonias nuevas. El crecimiento fue más rápido que la red de agua, y por eso las casas del cerro se quedaron sin ella. La actividad productiva reordena el territorio y deja tareas pendientes.',
                    en:'The hotels attracted jobs, and the jobs attracted families, an airport and new neighbourhoods. Growth was faster than the water network, and that is why the houses on the hill were left without it. Productive activity reorders the territory and leaves pending tasks.' } }
  ], rng), rng);
}
</script>

<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbzLGV15JRTPs9bbSvHRLfgOXeT9oUExDf1AH546WOwq5tYxXSdhX212OWi_bTJfMGx9/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'Procesos Productivos en México y el Mundo';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
