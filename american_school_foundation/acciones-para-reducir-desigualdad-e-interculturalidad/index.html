<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acciones para Reducir Desigualdad e Interculturalidad</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:75px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 57px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }

/* ── WIDGETS (concept manipulatives) ── */
.wgt { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.1rem; margin:1.1rem 0; }
.wgt-h { font-family:'Crimson Pro',serif; font-size:1.1rem; font-weight:700; margin-bottom:.2rem; }
.wgt-q { font-size:.82rem; color:var(--text3); margin-bottom:.85rem; }
.wmsg { margin-top:.75rem; padding:.6rem .85rem; border-radius:0 8px 8px 0; border-left:3px solid var(--border); background:var(--surface2); color:var(--text2); font-size:.83rem; }
.wmsg.ok   { background:var(--ok-bg);   color:var(--ok);    border-left-color:var(--ok); }
.wmsg.warn { background:var(--gold-bg); color:var(--text2); border-left-color:var(--gold); }
.wbtn { margin-top:.75rem; margin-right:.4rem; background:var(--green); color:#fff; border:none; border-radius:8px; padding:.55rem 1.1rem; font-size:.83rem; font-weight:600; cursor:pointer; min-height:44px; }
.wbtn:hover { background:var(--green-dark); }
.wprog { font-size:.72rem; color:var(--text3); margin-top:.55rem; }
.wcase { background:var(--surface2); border-radius:8px; padding:.75rem .9rem; font-size:.86rem; color:var(--text); margin-bottom:.7rem; }
.chips { display:flex; flex-wrap:wrap; gap:.45rem; margin:.6rem 0; }
.chip { border:1.5px solid var(--border); border-radius:22px; padding:.4rem .85rem; font-size:.8rem; cursor:pointer; background:var(--surface2); color:var(--text2); min-height:44px; display:flex; align-items:center; transition:all .14s; }
.chip:hover { border-color:var(--green); }
.chip.used { opacity:.75; cursor:default; font-family:'IBM Plex Mono',monospace; font-size:.74rem; min-height:34px; }
.chip.used:hover { border-color:var(--border); }

/* two-column matcher + strategy picker */
.mcols { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; }
.colh { font-size:.7rem; text-transform:uppercase; letter-spacing:.07em; color:var(--text3); margin:.6rem 0 .35rem; }
.optbox { border:1.5px solid var(--border); border-radius:9px; padding:.55rem .7rem; font-size:.79rem; cursor:pointer; background:var(--surface2); color:var(--text2); margin-bottom:.4rem; min-height:44px; display:flex; align-items:center; transition:all .14s; }
.optbox:hover { border-color:var(--green); }
.optbox.sel { border-color:var(--green); background:var(--green-bg); color:var(--green-dark); font-weight:600; }
.optbox.done { border-color:var(--ok); background:var(--ok-bg); color:var(--ok); cursor:default; }

/* live meters */
.mtr { margin-bottom:.5rem; }
.mtrlbl { display:flex; justify-content:space-between; gap:.6rem; font-size:.73rem; color:var(--text3); margin-bottom:.2rem; }
.mtrtrack { height:12px; border:1px solid var(--border); border-radius:6px; background:var(--surface2); overflow:hidden; }
.mtrfill { height:100%; width:0%; background:var(--gold); transition:width .3s; }
.mtrfill.ok { background:var(--ok); }

/* route sequencer */
.tl-list { display:flex; flex-direction:column; gap:.45rem; margin:.7rem 0; }
.tl-chip { border:1.5px solid var(--border); border-radius:9px; padding:.55rem .75rem; font-size:.81rem; cursor:pointer; background:var(--surface2); color:var(--text2); min-height:44px; display:flex; align-items:center; gap:.5rem; transition:all .14s; }
.tl-chip:hover { border-color:var(--green); }
.tl-chip.sel { border-color:var(--gold); background:var(--gold-bg); color:var(--text); font-weight:600; }
.tl-chip.locked { border-color:var(--ok); background:var(--ok-bg); color:var(--ok); cursor:default; }
.tl-num { font-family:'IBM Plex Mono',monospace; color:var(--text3); font-weight:700; font-size:.78rem; flex-shrink:0; }

/* open notebook */
.reflect-prompt { font-size:.9rem; color:var(--text2); margin:.4rem 0 .8rem; }

/* live split slider */
.repslider { width:100%; accent-color:var(--green); margin:.35rem 0 .6rem; height:28px; }
.repnums { display:flex; justify-content:space-between; font-family:'IBM Plex Mono',monospace; font-size:.75rem; color:var(--green-dark); font-weight:600; margin-bottom:.5rem; }

@media (max-width:600px) {
  .mcols { grid-template-columns:1fr; }
  .wgt { padding:.85rem; }
  .wcase { font-size:.83rem; }
}
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Acciones para Reducir Desigualdad e Interculturalidad</div>
    <div class="wcourse" id="wcourse-el">Formación Cívica y Ética · 3° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>

function setLang(l){
  LANG = l;
  try { localStorage.setItem(LANG_KEY, l); } catch(e){}
  var be=document.getElementById('btn-es'); if(be) be.classList.toggle('active', l==='es');
  var bn=document.getElementById('btn-en'); if(bn) bn.classList.toggle('active', l==='en');
  document.documentElement.setAttribute('lang', l);
  applyUIStrings();
  if (studentData.name && document.getElementById('lessonScreen').style.display !== 'none') {
    var prev = problems.map(function(p){ return p.studentChoice; });
    problems = []; answeredCount = 0; correctCount = 0;
    document.getElementById('lessonBody').innerHTML = '';
    var res = document.getElementById('s_results'); res.style.display='none'; res.classList.remove('vis');
    buildLesson(seededRng(studentData.name + studentData.group + currentAttempt(studentData.name, studentData.group)));
    var obs = new IntersectionObserver(function(entries){ entries.forEach(function(e){ if(e.isIntersecting) e.target.classList.add('vis'); }); }, { threshold:0.05 });
    document.querySelectorAll('.section').forEach(function(s){ obs.observe(s); });
    prev.forEach(function(ch, idx){ if(ch!==null && ch!==undefined) confirmMC(idx, ch); });

      res.style.display='block'; setTimeout(function(){ res.classList.add('vis'); }, 50);
    }
  }
}
/* ── Attempt counter + seed (Rule 4): seed = name+group+attempt ── */
function getAttemptKey(name, group){ return 'fce3_t07_g01__att__' + (name+'__'+group).replace(/\s+/g,'_'); }
function nextAttempt(name, group){ var k=getAttemptKey(name,group),n=0; try{n=parseInt(localStorage.getItem(k)||'0',10)||0;}catch(e){} n++; try{localStorage.setItem(k,String(n));}catch(e){} return n; }
function currentAttempt(name, group){ var k=getAttemptKey(name,group); try{return parseInt(localStorage.getItem(k)||'1',10)||1;}catch(e){return 1;} }
/* ================================================
   STATE
   ================================================ */
var studentData   = {};
var problems      = [];

/* ================================================
   SESSION PERSISTENCE  (localStorage)
   ================================================ */
function lsKey() {
  var n = (studentData.name  || '').trim();
  var g = (studentData.group || '').trim();
  return 'fce3_t07_g01__' + (n + '__' + g).replace(/\s+/g, '_');
}

function saveSession() {
  if (!studentData.name) return;
  var drawings = [], texts = [], photos = [];
  problems.forEach(function(p, i) {
    var dc = document.getElementById('dc' + i);
    if (dc && dc.width) {
      var blank = document.createElement('canvas');
      blank.width = dc.width; blank.height = dc.height;
      drawings.push(dc.toDataURL() === blank.toDataURL() ? null : dc.toDataURL('image/png'));
    } else { drawings.push(null); }
    var ta = document.getElementById('ta' + i);
    texts.push(ta ? ta.value : '');
    var pp = document.getElementById('pp' + i);
    photos.push((pp && pp.src && pp.src.indexOf('data:') === 0) ? pp.src : null);
  });
  var state = {
    name: studentData.name, group: studentData.group,
    answeredCount: answeredCount, correctCount: correctCount,
    choices: problems.map(function(p) { return p.studentChoice; }),
    drawings: drawings, texts: texts, photos: photos
  };
  try { localStorage.setItem(lsKey(), JSON.stringify(state)); } catch(e) {}
}

function loadSession(name, group) {
  var key = 'fce3_t07_g01__' + (name + '__' + group).replace(/\s+/g, '_');
  try { var r = localStorage.getItem(key); return r ? JSON.parse(r) : null; } catch(e) { return null; }
}

function restoreSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  var saved = loadSession(name, group);
  if (!saved) return;
  document.getElementById('restoreBar').style.display = 'none';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = currentAttempt(name, group);
  buildLesson(seededRng(name + group + att));
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
  saved.choices.forEach(function(choice, idx) {
    if (choice !== null && choice !== undefined) confirmMC(idx, choice);
  });
  setTimeout(function() {
    if (saved.drawings) {
      saved.drawings.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var dc = document.getElementById('dc' + i);
        if (!dc || !dc.width) return;
        var img = new Image();
        img.onload = function() {
          var dpr = window.devicePixelRatio || 1;

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS — INJECTION BLOCK ─────────────────────────────────────────
  //   Match these RGB values to --green and --gold above.
  //   PRIMARY  → pBR, pBG, pBB
  //   ACCENT   → pAR, pAG, pAB

  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;   // ACCENT (from SCHOOL, Rule 16)

    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/\u2192/g,'->').replace(/\u2212/g,'-').replace(/\u00b2/g,'^2')
      .replace(/\u00b3/g,'^3').replace(/\u00d7/g,'x').replace(/\u00f7/g,'/')
      .replace(/\u2260/g,'!=').replace(/\u2264/g,'<=').replace(/\u2265/g,'>=')
      .replace(/\u221a/g,'sqrt').replace(/\u03c0/g,'pi').replace(/\u2026/g,'...')

  }

  // ── PORTADA: orange line / white logo strip / orange line / blue band ──

function S(es, en){ return LANG === 'es' ? es : en; }

function addSection(tag, html){

/* Shuffles options (Rule 7) keeping ES/EN aligned, then builds the card inline (Rule 1/5). */
function addProblem(v, rng){
  var n = v.options.es.length, idx = [], k;
  for (k = 0; k < n; k++) idx.push(k);
  for (k = n - 1; k > 0; k--) {
    var j = Math.floor(rng() * (k + 1));
    var tmp = idx[k]; idx[k] = idx[j]; idx[j] = tmp;
  }
  var langOpts = (LANG === 'es') ? v.options.es : v.options.en;
  var prob = {
    title:        v.title[LANG],
    questionText: v.stmt[LANG],
    fn:           '',
    hint:         v.hint[LANG],
    explanation:  v.explanation[LANG],
    options:      idx.map(function(o){ return langOpts[o]; }),
    correctIdx:   idx.indexOf(v.correct),
    showWork:     !!v.showWork,
    studentChoice:null, pendingChoice:null
  };
  problems.push(prob);
  buildOneCard(prob, problems.length - 1);
}

/* A permutation of 0..n-1 that is never the identity. */
function shufflePerm(n, rng){
  var a = [], i, j, t;
  for (i = 0; i < n; i++) a.push(i);
  for (i = n - 1; i > 0; i--) { j = Math.floor(rng() * (i + 1)); t = a[i]; a[i] = a[j]; a[j] = t; }
  var sorted = true;
  for (i = 0; i < n; i++) if (a[i] !== i) sorted = false;
  if (sorted && n > 1) { t = a[0]; a[0] = a[1]; a[1] = t; }
  return a;
}

/* ================================================
   WIDGET 1 - REPARTO QUE EMPAREJA (deslizador con barras vivas)
   Two groups reach the same right at very different rates. The student moves a
   slider that splits a batch of supports between them and both coverage bars
   redraw on every pixel of movement, with the gap counted live in points. The
   equal split is the starting position on purpose: it leaves the gap open, and
   the student sees it before any check. Three rounds with fresh figures, and a
   reveal that parks the slider on the value that closes the gap (Rule 8, B).
   ================================================ */
var REP = null;

function buildReparto(rng){
  var ROUNDS = [
    { ctx:{ es:'Un plantel recibe 60 apoyos de transporte para repartirlos este ciclo.',
            en:'A school receives 60 transport supports to hand out this school year.' },
      unit:{ es:'apoyos', en:'supports' },
      A:{ es:'Estudiantes de la cabecera', en:'Students from the town center' },
      B:{ es:'Estudiantes de comunidades alejadas', en:'Students from distant communities' },
      nA:200, hA:120, nB:100, hB:30, T:60 },
    { ctx:{ es:'La escuela entrega 45 equipos con conexión a internet para uso en casa.',
            en:'The school hands out 45 devices with a home internet connection.' },
      unit:{ es:'equipos', en:'devices' },
      A:{ es:'Estudiantes con conexión en casa', en:'Students with a connection at home' },
      B:{ es:'Estudiantes sin conexión en casa', en:'Students with no connection at home' },
      nA:200, hA:100, nB:100, hB:20, T:45 },
    { ctx:{ es:'El municipio abre 90 lugares nuevos en el taller de robótica.',
            en:'The town opens 90 new places in the robotics workshop.' },
      unit:{ es:'lugares', en:'places' },
      A:{ es:'Estudiantes de escuelas urbanas', en:'Students from urban schools' },
      B:{ es:'Estudiantes de escuelas rurales', en:'Students from rural schools' },
      nA:400, hA:240, nB:200, hB:60, T:90 },
    { ctx:{ es:'Un club deportivo abre 60 lugares en el equipo de atletismo.',
            en:'A sports club opens 60 places on the athletics team.' },
      unit:{ es:'lugares', en:'places' },
      A:{ es:'Hombres', en:'Men' },
      B:{ es:'Mujeres', en:'Women' },
      nA:100, hA:70, nB:100, hB:30, T:60 }
  ];
  REP = { rounds:ROUNDS, order:shufflePerm(ROUNDS.length, rng), r:0, total:3,
          x:0, tries:0, locked:false, finished:false, msg:null, msgOk:false };
  repLoad();
  return '<div class="wgt" data-widget="slider" id="wReparto">' +
      '<div class="wgt-h">' + S('Reparto que empareja','A split that levels') + '</div>' +
      '<div class="wgt-q">' + S('Mueve el control y observa las dos barras. Empieza en el reparto por partes iguales.',
                                'Move the control and watch the two bars. It starts at the equal split.') + '</div>' +
      '<div id="repBox"></div>' +
    '</div>';
}

function repRound(){ return REP.rounds[REP.order[REP.r % REP.rounds.length]]; }

function repSol(){
  var d = repRound();
  return Math.round((d.nB * (d.hA + d.T) - d.nA * d.hB) / (d.nA + d.nB));
}

function repLoad(){
  var d = repRound();
  REP.x = Math.round(d.T / 2);
  REP.tries = 0; REP.locked = false; REP.msg = null; REP.msgOk = false;
}

function repCover(x){
  var d = repRound();
  return [ (d.hA + d.T - x) / d.nA * 100, (d.hB + x) / d.nB * 100 ];
}

function repRender(){
  if (!REP) return;
  var box = document.getElementById('repBox');
  if (!box) return;
  if (REP.finished) {
    box.innerHTML = '<div class="wmsg ok">' +
      S('Las tres situaciones quedaron parejas. Fíjate en lo que hiciste cada vez: el reparto por partes iguales conserva la distancia de origen, y solo un reparto desigual la cierra. Esa es la diferencia entre tratar igual y lograr resultados iguales.',
        'The three situations ended level. Notice what you did each time: the equal split keeps the starting distance, and only an uneven split closes it. That is the difference between treating people the same and reaching equal results.') +
      '</div>';
    return;
  }
  var d = repRound();
  box.innerHTML =
    '<div class="wcase">' + d.ctx[LANG] + ' ' +
      S('Ahora mismo alcanzan el apoyo ' + d.hA + ' de ' + d.nA + ' en un grupo y ' + d.hB + ' de ' + d.nB + ' en el otro.',
        'Right now the support reaches ' + d.hA + ' of ' + d.nA + ' in one group and ' + d.hB + ' of ' + d.nB + ' in the other.') + '</div>' +
    '<div class="mtrlbl"><span>' + S('Al grupo de arriba','To the top group') + '</span><span>' + S('Al grupo de abajo','To the bottom group') + '</span></div>' +
    '<input type="range" class="repslider" id="repSlider" min="0" max="' + d.T + '" value="' + REP.x + '"' +
      (REP.locked ? ' disabled' : '') + ' oninput="repSet(this.value)">' +
    '<div id="repLive"></div>' +
    '<div class="wmsg ' + (REP.msgOk ? 'ok' : (REP.msg ? 'warn' : '')) + '" id="repMsg">' +
      (REP.msg || S('Reparte los ' + d.T + ' ' + d.unit.es + ' y observa la diferencia entre las barras.',
                    'Split the ' + d.T + ' ' + d.unit.en + ' and watch the difference between the bars.')) + '</div>' +
    (REP.locked
      ? '<button class="wbtn" onclick="repNext()">' + S('Siguiente situación','Next situation') + '</button>'
      : '<button class="wbtn" onclick="repCheck()">' + S('Comprobar el reparto','Check the split') + '</button>') +
    '<div class="wprog">' + (REP.r + 1) + ' / ' + REP.total + '</div>';
  repLive();
}

function repLive(){
  if (!REP) return;
  var live = document.getElementById('repLive');
  if (!live) return;
  var d = repRound(), c = repCover(REP.x);
  var pA = Math.round(c[0] * 10) / 10, pB = Math.round(c[1] * 10) / 10;
  var gap = Math.round(Math.abs(pA - pB) * 10) / 10;
  var even = (gap === 0);
  function bar(lbl, val, got){
    return '<div class="mtr"><div class="mtrlbl"><span>' + lbl + '</span><span>' + val + ' % · ' + got + '</span></div>' +
      '<div class="mtrtrack"><div class="mtrfill' + (even ? ' ok' : '') + '" style="width:' + val + '%"></div></div></div>';
  }
  live.innerHTML =
    '<div class="repnums"><span>' + (d.T - REP.x) + ' ' + d.unit[LANG] + '</span><span>' + REP.x + ' ' + d.unit[LANG] + '</span></div>' +
    bar(d.A[LANG], pA, S('cobertura','coverage')) +
    bar(d.B[LANG], pB, S('cobertura','coverage')) +
    '<div class="wprog">' + (even
      ? S('Diferencia: 0 puntos. Las dos barras quedaron a la misma altura.',
          'Difference: 0 points. Both bars ended at the same height.')
      : S('Diferencia: ' + gap + ' puntos, con ' + (pA > pB ? d.A.es : d.B.es) + ' por arriba.',
          'Difference: ' + gap + ' points, with ' + (pA > pB ? d.A.en : d.B.en) + ' on top.')) + '</div>';
}

function repSet(v){
  if (!REP || REP.locked) return;
  REP.x = parseInt(v, 10) || 0;
  repLive();
}

function repCheck(){
  if (!REP || REP.locked) return;
  var d = repRound(), sol = repSol(), c = repCover(REP.x);
  if (REP.x === sol) {
    REP.locked = true; REP.msgOk = true;
    REP.msg = S('Quedaron parejas. Repartir por partes iguales habría dejado la distancia casi intacta: para emparejar el resultado hubo que dar más a quien empezaba más abajo.',
                'They ended level. An equal split would have left the distance almost untouched: to level the result you had to give more to whoever started lower.');
    repRender(); return;
  }
  REP.tries++;
  if (REP.tries >= 3) {
    REP.x = sol; REP.locked = true; REP.msgOk = false;
    REP.msg = S('Este es el reparto que empareja: ' + sol + ' de los ' + d.T + ' ' + d.unit.es + ' para el grupo que empezaba más abajo. Mira las barras y compáralo con lo que habías propuesto.',
                'This is the split that levels: ' + sol + ' of the ' + d.T + ' ' + d.unit.en + ' for the group that started lower. Look at the bars and compare it with what you had proposed.');
    repRender(); return;
  }
  REP.msgOk = false;
  if (c[1] < c[0]) {
    REP.msg = S('Todavía no. La barra del grupo que empezaba más abajo sigue por debajo de la otra: mueve más ' + d.unit.es + ' hacia ese lado.',
                'Not yet. The bar of the group that started lower is still under the other one: move more ' + d.unit.en + ' toward that side.');
  } else {
    REP.msg = S('Te pasaste. Ahora el grupo que empezaba más abajo quedó por encima del otro: regresa algunos ' + d.unit.es + ' hacia el primer grupo.',
                'You went too far. Now the group that started lower ended above the other: send some ' + d.unit.en + ' back to the first group.');
  }
  repRender();
}

function repNext(){
  if (!REP) return;
  REP.r++;
  if (REP.r >= REP.total) { REP.finished = true; repRender(); return; }
  repLoad();
  repRender();
}

/* ================================================

   Each card is a decision a school actually took. The student decides whether it
   only states an equal rule, whether it moves a condition that was blocking a

      }).join('') + '</div>' +
    tal +
    '<div class="wmsg ' + (CLS.note ? (CLS.noteOk ? 'ok' : 'warn') : '') + '">' + msg + '</div>' +
    '<div class="wprog">' + (CLS.i + 1) + ' / ' + CLS.items.length + '</div>';
}

function clsPick(k){
  if (!CLS || CLS.done) return;
  var it = CLS.items[CLS.order[CLS.i]];
  if (k === it.bin) {
    CLS.tally[k]++; CLS.tries = 0; CLS.noteOk = true;
    CLS.note = S('Así es. ' + it.wes, 'That is it. ' + it.wen);
    CLS.i++;
    if (CLS.i >= CLS.items.length) CLS.done = true;
    clsRender(); return;
  }
  CLS.tries++;
  if (CLS.tries >= 3) {
    CLS.tally[it.bin]++; CLS.tries = 0; CLS.noteOk = false;
    CLS.note = S('Esta tarjeta iba en ' + CLS_BINS.es[it.bin] + '. ' + it.wes,
                 'This card belonged in ' + CLS_BINS.en[it.bin] + '. ' + it.wen);
    CLS.i++;
    if (CLS.i >= CLS.items.length) CLS.done = true;
    clsRender(); return;
  }
  CLS.noteOk = false;
  if (k === 0) {
    CLS.note = S('Todavía no. La igualdad formal es la regla escrita que trata igual a todas y todos. Revisa si aquí alguien movió una condición concreta o si solo se anunció una intención.',
                 'Not yet. Formal equality is the written rule that treats everyone the same. Check whether someone here moved a concrete condition or only announced an intention.');
  } else if (k === 1) {
    CLS.note = S('Todavía no. Una medida que empareja cambia algo que estaba bloqueando a un grupo y su efecto se puede medir. Revisa si aquí solo se enuncia el derecho o se declara una postura.',
                 'Not yet. A measure that levels changes something that was blocking a group and its effect can be measured. Check whether this only states the right or declares a position.');
  } else {
    CLS.note = S('Todavía no. Un gesto sin efecto deja el acceso exactamente como estaba. Revisa si aquí se enuncia la regla o si algo del acceso quedó distinto.',
                 'Not yet. A gesture with no effect leaves access exactly as it was. Check whether the rule is being stated or whether something about access ended up different.');
  }
  clsRender();
}

/* ================================================
   WIDGET 3 - BARRERA Y AJUSTE (emparejar)
   The student taps a barrier and then the adjustment they believe removes it. A
   wrong pair does not lock: it answers with the question that chooses an
   adjustment, what exactly is blocking and who has to change. Third miss on the
   same barrier reveals its pair (Rule 8, A).
   ================================================ */
var BAR = null;

function buildBarreras(rng){
  var sets = [
    [ { p:{ es:'Una estudiante sorda sigue la clase de historia, que se imparte hablando y se evalúa con exposiciones orales.',
            en:'A deaf student follows the history class, which is taught by speaking and assessed with oral presentations.' },
        q:{ es:'Interpretación en lengua de señas, materiales por escrito y evaluación en su lengua con el mismo contenido.',
            en:'Sign language interpreting, written materials and assessment in her language with the same content.' } },
      { p:{ es:'Un estudiante en silla de ruedas tiene todas sus materias programadas en el primer piso, al que solo se sube por escaleras.',
            en:'A student in a wheelchair has every subject scheduled on the upper floor, reachable only by stairs.' },
        q:{ es:'Reprogramar esas materias en la planta baja mientras se construye el acceso, con fecha de entrega comprometida.',
            en:'Rescheduling those subjects on the ground floor while the access is built, with a committed delivery date.' } },
      { p:{ es:'Varias familias hablantes de una lengua originaria no se enteran de los avisos escolares.',
            en:'Several families who speak an Indigenous language never learn about the school notices.' },
        q:{ es:'Emitir los avisos también en esa lengua, con la traducción decidida por personas hablantes de la comunidad.',
            en:'Issuing the notices in that language too, with the wording decided by speakers from the community.' } },
      { p:{ es:'Un grupo de estudiantes falta a los talleres de la tarde porque a esa hora cuida a sus hermanos menores.',
            en:'A group of students misses the afternoon workshops because at that hour they look after younger siblings.' },
        q:{ es:'Abrir un segundo horario del mismo taller dentro de la jornada escolar y sostenerlo todo el periodo.',
            en:'Opening a second slot of the same workshop during school hours and keeping it all term.' } } ],
    [ { p:{ es:'Un estudiante con baja visión no alcanza a leer el material que se proyecta en clase.',
            en:'A student with low vision cannot read the material projected in class.' },
        q:{ es:'Entregar el material en formato ampliado y en archivo digital que su lector de pantalla pueda leer.',
            en:'Providing the material in enlarged format and as a digital file his screen reader can read.' } },
      { p:{ es:'Las estudiantes dejan de usar la cancha porque el único horario libre es el de la salida, cuando ya oscurece.',
            en:'The students stop using the court because the only free slot is at dismissal, when it is already dark.' },
        q:{ es:'Reasignar horarios de cancha dentro de la jornada y revisar el reparto cada mes con quienes la usan.',
            en:'Reassigning court slots during school hours and reviewing the split each month with those who use it.' } },
      { p:{ es:'Una familia no puede pagar el uniforme deportivo y su hija deja de presentarse a la clase.',
            en:'A family cannot afford the sports uniform and their daughter stops showing up for the class.' },
        q:{ es:'Aceptar ropa deportiva equivalente y crear un fondo de préstamo administrado por el comité escolar.',
            en:'Accepting equivalent sportswear and creating a loan fund managed by the school committee.' } },
      { p:{ es:'Un estudiante recién llegado de otro país entiende poco el español escolar y va quedando atrás.',
            en:'A student newly arrived from another country understands little school Spanish and is falling behind.' },
        q:{ es:'Acompañamiento en lengua y contenidos a la vez, sin retirarlo del grupo ni bajar lo que se le exige.',
            en:'Support in language and content at the same time, without removing him from the class or lowering what is asked of him.' } } ]
  ];
  var P = sets[Math.floor(rng() * sets.length)];
  var solved = [], i;
  for (i = 0; i < P.length; i++) solved.push(false);
  BAR = { pairs:P, right:shufflePerm(P.length, rng), sel:null, solved:solved, tries:0, msg:null, msgOk:false };
  return '<div class="wgt" data-widget="match" id="wBarreras">' +
      '<div class="wgt-h">' + S('Barrera y ajuste','Barrier and adjustment') + '</div>' +
      '<div class="wgt-q">' + S('Selecciona una barrera y después el ajuste que la quita.',
                                'Select a barrier and then the adjustment that removes it.') + '</div>' +
      '<div id="barBox"></div>' +
    '</div>';
}

function barRender(){
  if (!BAR) return;
  var box = document.getElementById('barBox');
  if (!box) return;
  var left = BAR.pairs.map(function(pr, i){
    var cls = 'optbox' + (BAR.solved[i] ? ' done' : '') + (BAR.sel === i ? ' sel' : '');
    return '<div class="' + cls + '" onclick="barLeft(' + i + ')">' + pr.p[LANG] + '</div>';
  }).join('');
  var right = BAR.right.map(function(r, pos){
    var cls = 'optbox' + (BAR.solved[r] ? ' done' : '');
    return '<div class="' + cls + '" onclick="barRight(' + pos + ')">' + BAR.pairs[r].q[LANG] + '</div>';
  }).join('');
  var done = BAR.solved.every(function(s){ return s; });
  var msg = BAR.msg || S('Para elegir un ajuste hay dos preguntas: qué está bloqueando exactamente, y qué tiene que cambiar el entorno para que deje de bloquear.',
                         'Choosing an adjustment takes two questions: what exactly is blocking, and what has to change in the setting so it stops blocking.');
  if (done) {
    msg = S('Las cuatro barreras quedaron con su ajuste. Fíjate en algo: en los cuatro casos lo que se modificó fue el entorno, y en ninguno se le pidió a la persona que se adaptara sola ni se le rebajó lo que se le exige.',
            'All four barriers now have their adjustment. Notice something: in all four cases what changed was the setting, and in none of them was the person asked to adapt alone or given a lower bar.');
  }
  box.innerHTML =
    '<div class="mcols">' +
      '<div><div class="colh">' + S('La barrera','The barrier') + '</div>' + left + '</div>' +
      '<div><div class="colh">' + S('El ajuste','The adjustment') + '</div>' + right + '</div>' +
    '</div>' +
    '<div class="wmsg ' + (done || BAR.msgOk ? 'ok' : (BAR.msg ? 'warn' : '')) + '">' + msg + '</div>' +
    '<div class="wprog">' + BAR.solved.filter(function(s){ return s; }).length + ' / ' + BAR.pairs.length + '</div>';
}

function barLeft(i){
  if (!BAR || BAR.solved[i]) return;
  if (BAR.sel !== i) BAR.tries = 0;
  BAR.sel = (BAR.sel === i) ? null : i;
  BAR.msg = null; BAR.msgOk = false;
  barRender();
}

function barRight(pos){
  if (!BAR) return;
  var r = BAR.right[pos];
  if (BAR.solved[r]) return;
  if (BAR.sel === null) {
    BAR.msgOk = false;
    BAR.msg = S('Elige primero una barrera de la columna izquierda.', 'Pick a barrier from the left column first.');
    barRender(); return;
  }
  if (r === BAR.sel) {
    BAR.solved[r] = true; BAR.sel = null; BAR.tries = 0; BAR.msgOk = true;
    BAR.msg = S('Encaja. Ese ajuste cambia el entorno y deja intacto lo que se espera que la persona aprenda.',
                'It fits. That adjustment changes the setting and leaves untouched what the person is expected to learn.');
    barRender(); return;
  }
  BAR.tries++;
  if (BAR.tries >= 3) {
    var s = BAR.sel;
    BAR.solved[s] = true; BAR.sel = null; BAR.tries = 0; BAR.msgOk = false;
    BAR.msg = S('Esa barrera se quita así: ' + BAR.pairs[s].q.es,
                'That barrier is removed like this: ' + BAR.pairs[s].q.en);
    barRender(); return;
  }
  BAR.msgOk = false;
  BAR.msg = S('Ese no. Vuelve a leer qué impide participar en ese caso: el acceso físico, la lengua, el dinero o el horario. El ajuste tiene que tocar justo eso.',
              'Not that one. Read again what prevents taking part in that case: physical access, language, money or schedule. The adjustment has to touch exactly that.');
  barRender();
}

/* ================================================

    { dx:{ es:'De los 40 lugares del taller de robótica, solo 6 los ocupan mujeres. El registro muestra que el taller sesiona a la hora de salida y que las pocas que entraron lo dejaron después de que sus compañeros les asignaron siempre tareas de limpieza del material.',

          { es:'Rediseñar el cartel de la convocatoria con imágenes de mujeres trabajando con robots.',
            en:'Redesigning the enrollment poster with images of women working with robots.', v:0 } ] },
        { h:{ es:'Quiénes deciden', en:'Who decides' }, opts:[
          { es:'Las estudiantes que se salieron y las que no se inscribieron, sentadas con quienes coordinan el taller.',
            en:'The students who left and those who never enrolled, sitting with the people who run the workshop.', v:3 },
          { es:'Quienes coordinan el taller, que luego preguntan al grupo si el cambio les pareció bien.',

        { h:{ es:'Cómo lo sabremos', en:'How we will know' }, opts:[

var ACT_METERS = {
  es:['Quita la barrera real','Deciden quienes viven el problema','Deja ver si la brecha bajó'],
  en:['Removes the real barrier','Those who live it decide','Shows whether the gap fell']
};

function actRender(){
  if (!ACT) return;
  var box = document.getElementById('actBox');
  if (!box) return;
  var rows = ACT.pool.rows;
  var body = rows.map(function(row, ri){
    var opts = row.opts.map(function(o, oi){
      var cls = 'optbox' + (ACT.sel[ri] === oi ? ' sel' : '') + (ACT.done && o.v === 3 ? ' done' : '');
      var click = ACT.done ? '' : ' onclick="actPick(' + ri + ',' + oi + ')"';
      return '<div class="' + cls + '"' + click + '>' + o[LANG] + '</div>';
    }).join('');
    return '<div class="colh">' + row.h[LANG] + '</div>' + opts;
  }).join('');
  var meters = ACT_METERS[LANG].map(function(lbl, ri){
    var v = ACT.sel[ri] === null ? 0 : rows[ri].opts[ACT.sel[ri]].v;
    var pctv = Math.round(v / 3 * 100);
    return '<div class="mtr"><div class="mtrlbl"><span>' + lbl + '</span><span>' + pctv + ' %</span></div>' +

  }).join('');

    (ACT.done ? '' : '<button class="wbtn" onclick="actCheck()">' + S('Comprobar la acción','Check the action') + '</button>');
}

function actPick(ri, oi){
  if (!ACT || ACT.done) return;
  ACT.sel[ri] = (ACT.sel[ri] === oi) ? null : oi;
  ACT.msg = null; ACT.msgOk = false;
  actRender();
}

var ACT_NUDGE = {
  es:['Esa medida celebra o compensa por fuera, y deja en pie la condición que el diagnóstico señala. Vuelve a leer dónde y cuándo se produce la desventaja.',
      'Con esa mesa, el grupo que vive el problema queda como destinatario y no como parte que decide. Pregúntate a quién le falta voz ahí.',
      'Ese dato mide la actividad realizada, no la brecha. Busca algo que puedas comparar con la cifra que había al inicio.'],
  en:['That measure celebrates or compensates from outside, and leaves standing the condition the diagnosis points at. Read again where and when the disadvantage is produced.',
      'With that table, the group living the problem stays a recipient instead of a party that decides. Ask who is missing a voice there.',
      'That figure measures the activity carried out, not the gap. Look for something you can compare with the figure that existed at the start.']
};

function actCheck(){
  if (!ACT || ACT.done) return;
  var rows = ACT.pool.rows, i, missing = -1, weak = -1;
  for (i = 0; i < 3; i++) if (ACT.sel[i] === null && missing === -1) missing = i;
  if (missing !== -1) {
    ACT.msgOk = false;
    ACT.msg = S('Falta elegir una tarjeta en la fila de ' + rows[missing].h.es + '.',
                'You still have to pick a card in the ' + rows[missing].h.en + ' row.');
    actRender(); return;
  }
  for (i = 0; i < 3; i++) if (rows[i].opts[ACT.sel[i]].v < 3 && weak === -1) weak = i;
  if (weak === -1) {
    ACT.done = true; ACT.msgOk = true;
    ACT.msg = S('Acción completa. Toca la condición que el diagnóstico mostró, la decide con quienes viven la desventaja y deja un dato comparable para saber si la brecha bajó.',
                'Action complete. It touches the condition the diagnosis showed, it is decided together with those who live the disadvantage, and it leaves a comparable figure to tell whether the gap fell.');
    actRender(); return;
  }
  ACT.tries++;
  if (ACT.tries >= 3) {
    for (i = 0; i < 3; i++) {
      var k, best = 0;
      for (k = 0; k < rows[i].opts.length; k++) if (rows[i].opts[k].v === 3) best = k;
      ACT.sel[i] = best;
    }
    ACT.done = true; ACT.msgOk = false;
    ACT.msg = S('Esta combinación sostiene los tres medidores. Compárala con la tuya y fíjate en qué fila se perdió el objetivo.',
                'This combination holds the three meters up. Compare it with yours and notice in which row the objective was lost.');
    actRender(); return;
  }
  ACT.msgOk = false;
  ACT.msg = ACT_NUDGE[LANG][weak];
  actRender();
}

/* ================================================
