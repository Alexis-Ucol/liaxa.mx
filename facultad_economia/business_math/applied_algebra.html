    if (es) return '' +
      '<div class="stag">Concepto 3</div>' +
      '<h2>Al menos, a lo más, y el tramo que queda en medio</h2>' +
      '<p>Un consejo de administración rara vez pide el volumen exacto que maximiza la utilidad. Lo que pide es que la utilidad sea <strong>al menos</strong> cierta cifra, o que el costo no pase de otra. Esas dos palabras cambian el objeto matemático: donde había una ecuación ahora hay una <strong>desigualdad</strong>, y donde había una respuesta única ahora hay un conjunto entero de respuestas válidas. Para quien decide, esa diferencia es una ventaja enorme, porque conocer todo el rango aceptable es lo que permite negociar con producción, con ventas y con el proveedor.</p>' +
      '<p>Las desigualdades se manipulan casi igual que las ecuaciones, con una sola excepción que hay que tener grabada: al multiplicar o dividir los dos lados por una cantidad <strong>negativa</strong>, el sentido se invierte. Lo que era mayor pasa a ser menor. No es una convención arbitraria sino una consecuencia de lo que significa el orden de los números, y es la fuente del error más común en este tema, porque en un problema de costos las diferencias negativas aparecen todo el tiempo al comparar dos alternativas.</p>' +
      '<p>Cuando la desigualdad es de segundo grado el método tiene un paso más. No se resuelve probando valores, sino en tres movimientos: primero se pasa todo a un lado para comparar la expresión contra cero, después se encuentran las <strong>raíces</strong> de la ecuación asociada, que son las fronteras exactas donde la utilidad iguala a la meta, y por último se decide de qué lado de esas fronteras vive la solución. Ese último paso se resuelve mirando la forma de la curva: si abre hacia abajo, la expresión es grande en medio, así que la solución es el tramo entre las raíces.</p>' +
      '<p>El resultado se lee mejor como una <strong>banda de operación</strong> con dos bordes de naturaleza distinta. El borde inferior es el que cualquiera calcula: por debajo de él no se cubre lo que hay que cubrir. El superior es el que suele pasar inadvertido y suele ser el más caro de ignorar, porque contradice la intuición de que vender más siempre acerca a la meta. La distancia entre ambos bordes es el <strong>margen de maniobra</strong> del plan, y se encoge conforme la meta se acerca al techo de la curva hasta desaparecer del todo. Cuando desaparece, la desigualdad no tiene solución, y ese vacío también es información: la meta es inalcanzable con esa estructura, no con ese esfuerzo comercial.</p>' +

      '</div>' +
      '<p><strong>Ejemplo resuelto.</strong> Una embotelladora coloca la primera caja del mes en ' + money(c3A) + ' y cada caja adicional la obliga a bajar el precio en ' + money(c3B) + '. Cada caja cuesta ' + money(c3v) + ' de producción y la planta carga ' + money(c3F) + ' al mes de costo fijo. El consejo aprobó el presupuesto con una condición: la utilidad mensual debe ser de al menos ' + money(c3T) + '.</p>' +
      '<div class="callout"><p><strong>Paso 1.</strong> Se plantea que la utilidad sea mayor o igual que ' + money(c3T) + ' y se pasa todo a un lado, dejando una expresión de segundo grado comparada contra cero.<br>' +
      '<strong>Paso 2.</strong> Se resuelven las fronteras con la fórmula general. Las dos raíces caen en ' + dec1(c3band.lo) + ' y ' + dec1(c3band.hi) + ' cajas.<br>' +

    return '' +
      '<div class="stag">Concept 3</div>' +
      '<h2>At least, at most, and the stretch left in between</h2>' +
      '<p>A board of directors rarely asks for the exact volume that maximizes profit. What it asks is that profit be <strong>at least</strong> some figure, or that cost not go beyond another. Those few words change the mathematical object: where there was an equation there is now an <strong>inequality</strong>, and where there was a single answer there is now a whole set of valid ones. For whoever decides, that difference is an enormous advantage, because knowing the entire acceptable range is what makes it possible to negotiate with production, with sales and with the supplier.</p>' +
      '<p>Inequalities are handled almost exactly like equations, with one exception that has to be burned into memory: multiplying or dividing both sides by a <strong>negative</strong> quantity reverses the direction. What was greater becomes smaller. It is not an arbitrary convention but a consequence of what the ordering of numbers means, and it is the source of the most common error in this topic, because in a cost problem negative differences turn up constantly when two alternatives are compared.</p>' +
      '<p>When the inequality is second degree the method has one more step. It is not solved by trying values, but in three moves: first everything goes to one side so the expression is compared against zero, then the <strong>roots</strong> of the associated equation are found, which are the exact boundaries where profit equals the target, and finally you decide which side of those boundaries the solution lives on. That last step is settled by looking at the shape of the curve: if it opens downward, the expression is large in the middle, so the solution is the stretch between the roots.</p>' +
      '<p>The result reads best as an <strong>operating band</strong> with two edges of different nature. The lower edge is the one anybody computes: below it, what has to be covered is not covered. The upper one usually goes unnoticed and is usually the more expensive to ignore, because it contradicts the intuition that selling more always brings you closer to the target. The distance between the two edges is the <strong>room to manoeuvre</strong> in the plan, and it shrinks as the target approaches the ceiling of the curve until it vanishes altogether. When it vanishes, the inequality has no solution, and that emptiness is information too: the target is unreachable with that structure, not with that commercial effort.</p>' +

      '</div>' +

      '<div class="callout"><p><strong>Step 1.</strong> Require profit to be greater than or equal to ' + money(c3T) + ' and move everything to one side, leaving a second degree expression compared against zero.<br>' +

      '<strong>Step 4.</strong> Check against the ceiling: maximum profit is ' + money(c3uMax) + ' at ' + intN(c3q) + ' cases, which leaves a slack of ' + money(c3uMax - c3T) + ' over the target and confirms the band exists.<br>' +
      '<strong>Business reading.</strong> The plan has ' + intN(c3hi - c3lo) + ' cases of room to manoeuvre, and that figure is worth more in a meeting than the exact optimum: it says how far the forecast can miss without breaking the commitment to the board. The two edges are watched differently. Falling short is the obvious risk. Overshooting the upper edge is the risk almost nobody budgets for, and it happens when the sales team pushes volume with discounts to hit a case quota: it delivers the volume, sinks the price of the whole output and ends up missing the profit target that was the real commitment.</p></div>';

    exp: { es: 'Al pedir que la utilidad sea al menos ' + money(p5T) + ' y pasar todo a un lado queda una desigualdad de segundo grado cuyas fronteras son ' + dec1(s5band.lo) + ' y ' + dec1(s5band.hi) + ' toneladas. Como la parábola abre hacia abajo, el compromiso se cumple entre esas dos cifras, así que el mínimo es ' + intN(s5lo) + ' toneladas: con una tonelada menos la utilidad todavía se queda corta, y por eso el redondeo va hacia arriba. La opción de ' + intN(s5hi) + ' es la frontera superior del tramo, el volumen a partir del cual el precio ya bajó tanto que la utilidad vuelve a caer por debajo del compromiso. La de ' + intN(s5flat) + ' reparte el costo fijo más la meta entre el margen de la primera tonelada, es decir supone que el precio no baja con el volumen y por eso queda por debajo del mínimo verdadero. Y la de ' + intN(p5q) + ' es el volumen que maximiza la utilidad, que cumple el compromiso con holgura pero no es el punto donde empieza a cumplirse.',

      '<h2>La incógnita en el denominador y el suelo que nunca se toca</h2>' +
      '<p>Hasta aquí la incógnita aparecía multiplicando. En cuanto una pregunta de negocio se plantea <em>por unidad</em>, la incógnita se muda al denominador y la expresión deja de ser un polinomio para volverse una <strong>expresión racional</strong>, es decir un cociente de dos polinomios. El caso más importante del curso es el <strong>costo medio</strong>: el costo total del periodo repartido entre las piezas producidas. Es la cifra con la que se compara un precio, se acepta un pedido o se decide cerrar una línea.</p>' +
      '<p>El primer movimiento útil es separar el cociente en dos pedazos, uno por cada término del numerador. Al hacerlo aparece algo que la fórmula original escondía: el costo medio es el costo variable, que no se mueve con el volumen, más el costo fijo repartido entre las piezas, que sí. Solo el segundo pedazo se encoge al producir más. Esa separación explica de una vez las <strong>economías de escala</strong> y también su límite, y conviene hacerla siempre antes de calcular nada.</p>' +
      '<p>De ahí sale la propiedad que más se usa en la práctica. Conforme el volumen crece, el pedazo repartido se hace pequeño y el costo medio se acerca al costo variable sin alcanzarlo jamás. Esa recta horizontal inalcanzable se llama <strong>asíntota</strong>, y en el negocio es un piso duro: por más volumen que se prometa, el costo por pieza nunca baja del costo variable. Es el argumento que cierra cualquier negociación en la que un cliente grande pide un precio por debajo de esa cifra.</p>' +

      '<p>Out of it comes the property most used in practice. As volume grows, the shared slice becomes small and average cost approaches the variable cost without ever reaching it. That unreachable horizontal line is called an <strong>asymptote</strong>, and in the business it is a hard floor: however much volume is promised, cost per piece never falls below the variable cost. It is the argument that closes any negotiation in which a large customer asks for a price under that figure.</p>' +

function applyUIStrings() {

  set('dlBtn',        t('btn-pdf'));

  var lr = document.getElementById('logo-right');  if (lr) lr.alt = SCHOOL.logoRightAlt;
}
/* Rebuilds the visible text of every card without touching the numbers. */
function applyProblemLang() {
  problems.forEach(function(p, i) {
    var card = document.getElementById('pc' + i);
    if (!card || !p.i18n) return;
    p.title        = p.i18n.title[LANG];
    p.questionText = p.i18n.q[LANG];
    p.hint         = p.i18n.hint[LANG];
    p.explanation  = p.i18n.exp[LANG];
    p.options      = p.i18n.opts[LANG].slice();
    var ti = card.querySelector('.ptitle'); if (ti) ti.textContent = p.title;
    var st = card.querySelector('.pstmt');  if (st) st.innerHTML = p.questionText;
    var hb = card.querySelector('.hintbox'); if (hb) hb.innerHTML = p.hint;
    var hbtn = card.querySelector('.hintbtn'); if (hbtn) hbtn.textContent = t('btn-hint');
    card.querySelectorAll('.mcopt').forEach(function(o, oi) {
      if (p.options[oi] !== undefined) o.innerHTML = p.options[oi];
    });
    var tabs = card.querySelectorAll('.wtab');
    if (tabs.length === 3) {
      tabs[0].textContent = t('tab-draw');
      tabs[1].textContent = t('tab-type');
      tabs[2].textContent = t('tab-photo');
    }
    var tools = card.querySelectorAll('.tbtn2');
    if (tools.length === 3) {
      tools[0].textContent = t('tool-pen');
      tools[1].textContent = t('tool-mark');
      tools[2].textContent = t('tool-erase');
    }
    var clr = card.querySelector('.clrbtn'); if (clr) clr.textContent = t('tool-clear');
    var ta  = card.querySelector('.wtextarea'); if (ta) ta.placeholder = t('ph-work');
    var pzt = card.querySelector('.pztxt'); if (pzt) pzt.textContent = t('ph-photo');
    var lab = card.querySelector('.pbody > div:last-child > div:first-child');
    if (lab) lab.textContent = t('lbl-answer');
    var fb = card.querySelector('.mcfb');
    if (fb && fb.classList.contains('show')) {
      var isOk = (p.studentChoice === p.correctIdx);
      fb.innerHTML = '<strong>' + (isOk ? t('fb-correct') : t('fb-wrong')) + '</strong> ' + p.explanation;
    }
  });
}
function setLang(l) {
  LANG = l;
  try { localStorage.setItem(LANG_KEY, l); } catch(e) {}
  document.documentElement.setAttribute('lang', l);
  var be = document.getElementById('btn-es'), bn = document.getElementById('btn-en');
  if (be) be.classList.toggle('active', l === 'es');
  if (bn) bn.classList.toggle('active', l === 'en');
  applyUIStrings();
  applySectionLang();
  applyProblemLang();
  widgets.forEach(function(f) { try { f(); } catch(e) {} });
  document.querySelectorAll('#lessonBody .section').forEach(function(s) { s.classList.add('vis'); });
}
(function() {
  try { var stored = localStorage.getItem(LANG_KEY); if (stored === 'es' || stored === 'en') LANG = stored; } catch(e) {}
  document.addEventListener('DOMContentLoaded', function() {
    document.documentElement.setAttribute('lang', LANG);
    var be = document.getElementById('btn-es'), bn = document.getElementById('btn-en');
    if (be) be.classList.toggle('active', LANG === 'es');
    if (bn) bn.classList.toggle('active', LANG === 'en');

  });
})();

    doc.setTextColor(255,255,255); doc.setFontSize(9); doc.setFont('helvetica','bold');
    doc.text(isOk?'v':'x', M+5.2, wy+10.5);
    var ay = wy+7;
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','bold');
    chLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5.5); });
    ay += chLines.length*5.5 + 3;
    doc.setTextColor(26,106,74); doc.setFontSize(8); doc.setFont('helvetica','normal');
    coLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    ay += coLines.length*5 + 3;
    doc.setTextColor(90,85,80); doc.setFontSize(7.5);
    exLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    wy += ansBoxH + 5;

    var dc = document.getElementById('dc'+i);
    if (dc) {
      doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
      doc.setFontSize(7); doc.setFont('helvetica','bold');
      doc.rect(M,wy,TW,8,'F'); doc.text(t('pdf-work'), M+4, wy+5.5);
      wy += 11;
      try {
        var imgD = dc.toDataURL('image/png');
        var ar   = dc.height / dc.width;
        var iw   = TW;
        var ih   = Math.min(iw * ar, 68);
        doc.addImage(imgD, 'PNG', M, wy, iw, ih);
        wy += ih + 4;
      } catch(e) {}
    }

    var ta = document.getElementById('ta'+i);
    if (ta && ta.value.trim()) {
      if (wy > PH-30) { doc.addPage(); wy = 20; }
      doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('courier','normal');
      var taLines = doc.splitTextToSize(ta.value, TW);
      taLines.slice(0,16).forEach(function(ln) {
        if (wy > PH-15) { doc.addPage(); wy = 20; }
        doc.text(ln, M, wy); wy += 5;
      });
      wy += 2;
    }

    var pp = document.getElementById('pp'+i);
    if (pp && pp.src && pp.src.indexOf('data:') === 0) {
      if (wy > PH-55) { doc.addPage(); wy = 20; }
      try { doc.addImage(pp.src, 'JPEG', M, wy, TW, 68); wy += 72; } catch(e) {}
    }
  }

  var pages = doc.internal.getNumberOfPages();
  for (var p = 1; p <= pages; p++) {
    doc.setPage(p);
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0, PH-3, PW, 3, 'F');
    doc.setTextColor(130,140,160); doc.setFontSize(6.5); doc.setFont('helvetica','normal');
    doc.text(name+'  ·  '+group+'  ·  '+t('pdf-code')+code+'  ·  '+t('pdf-page')+p+'/'+pages,
      PW/2, PH-5, {align:'center'});
  }

  var _fn = SCHOOL.filePrefix + '_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf';
  var _pdfBlob = doc.output('blob');
  var _blobUrl = URL.createObjectURL(_pdfBlob);
  var _a = document.createElement('a');
  _a.href = _blobUrl;
  _a.download = _fn;
  document.body.appendChild(_a);
  _a.click();
  setTimeout(function(){ document.body.removeChild(_a); URL.revokeObjectURL(_blobUrl); }, 200);
  btn.textContent = t('btn-pdf');
  btn.disabled  = false;
}
</script>
</body>
</html>
