<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tablas y Gráficas de Barras para Analizar Información</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }

/* ── WIDGETS DE ESTA GUÍA (tablas y gráficas de barras) ── */
.iw-tag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.4rem; }
.iw-box { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; padding:1rem; }
.iw-instr { font-size:.88rem; color:var(--text2); margin-bottom:.7rem; }
.rondas { font-family:'IBM Plex Mono',monospace; font-size:.7rem; color:var(--text3); letter-spacing:.08em; text-transform:uppercase; margin-bottom:.45rem; }
.rfb { font-size:.84rem; margin-top:.6rem; min-height:1.35rem; color:var(--text2); }
.rfb b { color:var(--green-dark); }
.okmsg { color:var(--ok); font-weight:700; }
.rverify-btn { background:var(--green); color:#fff; border:none; border-radius:8px; padding:.6rem 1.2rem; font-size:.86rem; font-weight:600; cursor:pointer; min-height:44px; margin-top:.7rem; font-family:inherit; }
.rverify-btn:hover { background:var(--green-dark); }
.goalbar { font-size:.83rem; color:var(--text2); background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.45rem .7rem; margin-bottom:.65rem; }
.goalbar b { color:var(--green-dark); }
.gcanvas { display:block; width:100%; height:250px; border:1px solid var(--border); border-radius:8px; background:var(--surface); touch-action:manipulation; }
.krow { display:flex; align-items:center; gap:.6rem; margin-top:.55rem; flex-wrap:wrap; }
.krow input[type=range] { flex:1; min-width:120px; accent-color:var(--green); height:34px; }
.klbl { font-size:.78rem; color:var(--text3); min-width:82px; }
.kval { font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:.95rem; color:var(--green); min-width:46px; text-align:right; }
.livelbl { margin-top:.55rem; font-size:.88rem; color:var(--text2); }
.livelbl b { color:var(--green-dark); }
.statline { margin-top:.35rem; font-size:.84rem; color:var(--text3); }
.defgrid { display:grid; grid-template-columns:repeat(2,1fr); gap:.6rem; margin:1rem 0; }
.defcell { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.75rem; border-top:3px solid var(--green); }
.defname { font-size:.72rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.25rem; }
.deftxt { font-size:.82rem; color:var(--text2); }
.stepslist { margin:.9rem 0 0; padding-left:1.1rem; }
.stepslist li { font-size:.86rem; color:var(--text2); margin-bottom:.35rem; }
.chiprow { display:flex; flex-wrap:wrap; gap:.35rem; margin:.5rem 0 .8rem; }
.chip { border:1.5px solid var(--border); border-radius:20px; padding:.3rem .7rem; font-size:.78rem; background:var(--surface2); color:var(--text2); cursor:pointer; user-select:none; min-height:34px; display:inline-flex; align-items:center; }
.chip.used { background:var(--green-bg); border-color:var(--green); color:var(--green-dark); text-decoration:line-through; }
.cntgrid { display:grid; grid-template-columns:1fr auto; gap:.4rem .6rem; align-items:center; margin-top:.4rem; }
.cntname { font-size:.86rem; color:var(--text2); }
.cntctl { display:flex; align-items:center; gap:.4rem; }
.stepbtn { width:38px; height:38px; border-radius:8px; border:1.5px solid var(--border); background:var(--surface2); color:var(--green-dark); font-size:1.05rem; font-weight:700; cursor:pointer; font-family:inherit; }
.stepbtn:hover { border-color:var(--green); }
.cntval { font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:1rem; color:var(--green); min-width:34px; text-align:center; }
.cntval.hit { color:var(--ok); }
.dtable { width:100%; border-collapse:collapse; margin:.55rem 0; font-size:.85rem; }
.dtable th { background:var(--green-bg); color:var(--green-dark); text-align:left; padding:.4rem .6rem; font-size:.72rem; text-transform:uppercase; letter-spacing:.05em; }
.dtable td { border-top:1px solid var(--border); padding:.4rem .6rem; color:var(--text2); }
.dtable td.num { font-family:'IBM Plex Mono',monospace; font-weight:600; color:var(--text); text-align:right; }
.qdata { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:.5rem .7rem; margin:.5rem 0 .2rem; font-size:.84rem; color:var(--text2); }
.qdata b { color:var(--green-dark); font-family:'IBM Plex Mono',monospace; }
.reflect-prompt { font-size:.9rem; color:var(--text2); margin:.4rem 0 .8rem; }
@media (max-width: 600px) {
  .defgrid { grid-template-columns:1fr; }
  .gcanvas { height:230px; }
  .klbl { min-width:66px; font-size:.74rem; }
  .chip { font-size:.74rem; padding:.28rem .55rem; }
}
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Tablas y Gráficas de Barras para Analizar Información</div>
    <div class="wcourse" id="wcourse-el">Matemáticas · 1° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>

function setLang(l){
  LANG = l;
  try { localStorage.setItem(LANG_KEY, l); } catch(e){}
  var be=document.getElementById('btn-es'); if(be) be.classList.toggle('active', l==='es');
  var bn=document.getElementById('btn-en'); if(bn) bn.classList.toggle('active', l==='en');

  applyUIStrings();
  if (studentData.name && document.getElementById('lessonScreen').style.display !== 'none') {
    var prev = problems.map(function(p){ return p.studentChoice; });
    problems = []; answeredCount = 0; correctCount = 0;
    document.getElementById('lessonBody').innerHTML = '';
    var res = document.getElementById('s_results'); res.style.display='none'; res.classList.remove('vis');
    buildLesson(seededRng(studentData.name + studentData.group + currentAttempt(studentData.name, studentData.group)));
    var obs = new IntersectionObserver(function(entries){ entries.forEach(function(e){ if(e.isIntersecting) e.target.classList.add('vis'); }); }, { threshold:0.05 });
    document.querySelectorAll('.section').forEach(function(s){ obs.observe(s); });
    prev.forEach(function(ch, idx){ if(ch!==null && ch!==undefined) confirmMC(idx, ch); });

/* ── Attempt counter + seed (Rule 4): seed = name+group+attempt ── */
function getAttemptKey(name, group){ return 'liaxa_mat1_t12_g01__att__' + (name+'__'+group).replace(/\s+/g,'_'); }
function nextAttempt(name, group){ var k=getAttemptKey(name,group),n=0; try{n=parseInt(localStorage.getItem(k)||'0',10)||0;}catch(e){} n++; try{localStorage.setItem(k,String(n));}catch(e){} return n; }
function currentAttempt(name, group){ var k=getAttemptKey(name,group); try{return parseInt(localStorage.getItem(k)||'1',10)||1;}catch(e){return 1;} }
/* ================================================
   STATE
   ================================================ */
var studentData   = {};
var problems      = [];

/* ================================================
   SESSION PERSISTENCE  (localStorage)
   ================================================ */
function lsKey() {
  var n = (studentData.name  || '').trim();
  var g = (studentData.group || '').trim();
  return 'liaxa_mat1_t12_g01__' + (n + '__' + g).replace(/\s+/g, '_');
}

function saveSession() {
  if (!studentData.name) return;
  var drawings = [], texts = [], photos = [];
  problems.forEach(function(p, i) {
    var dc = document.getElementById('dc' + i);
    if (dc && dc.width) {
      var blank = document.createElement('canvas');
      blank.width = dc.width; blank.height = dc.height;
      drawings.push(dc.toDataURL() === blank.toDataURL() ? null : dc.toDataURL('image/png'));
    } else { drawings.push(null); }
    var ta = document.getElementById('ta' + i);
    texts.push(ta ? ta.value : '');
    var pp = document.getElementById('pp' + i);
    photos.push((pp && pp.src && pp.src.indexOf('data:') === 0) ? pp.src : null);
  });
  var state = {
    name: studentData.name, group: studentData.group,
    answeredCount: answeredCount, correctCount: correctCount,
    choices: problems.map(function(p) { return p.studentChoice; }),
    drawings: drawings, texts: texts, photos: photos
  };
  try { localStorage.setItem(lsKey(), JSON.stringify(state)); } catch(e) {}
}

function loadSession(name, group) {
  var key = 'liaxa_mat1_t12_g01__' + (name + '__' + group).replace(/\s+/g, '_');
  try { var r = localStorage.getItem(key); return r ? JSON.parse(r) : null; } catch(e) { return null; }
}

function restoreSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  var saved = loadSession(name, group);
  if (!saved) return;
  document.getElementById('restoreBar').style.display = 'none';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = currentAttempt(name, group);
  buildLesson(seededRng(name + group + att));
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
  saved.choices.forEach(function(choice, idx) {
    if (choice !== null && choice !== undefined) confirmMC(idx, choice);
  });
  setTimeout(function() {
    if (saved.drawings) {
      saved.drawings.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var dc = document.getElementById('dc' + i);
        if (!dc || !dc.width) return;
        var img = new Image();
        img.onload = function() {
          var dpr = window.devicePixelRatio || 1;
          dc.getContext('2d').drawImage(img, 0, 0, dc.width / dpr, dc.height / dpr);
        };
        img.src = dataUrl;
      });
    }
    if (saved.texts) {
      saved.texts.forEach(function(text, i) {
        if (!text) return;
        var ta = document.getElementById('ta' + i);
        if (ta) ta.value = text;
      });
    }
    if (saved.photos) {
      saved.photos.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var pp = document.getElementById('pp' + i);
        if (!pp) return;
        pp.src = dataUrl; pp.style.display = 'block';
        var pz = document.getElementById('pz' + i);
        if (pz) pz.style.opacity = '0.4';
      });
    }
  }, 300);
}

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

async function generatePDF() {
  var btn = document.getElementById('dlBtn');
  btn.textContent = 'Generando PDF…';
  btn.disabled = true;

  var jspdf   = window.jspdf;
  var doc     = new jspdf.jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });
  var PW      = 215.9;
  var M       = 18;
  var TW      = PW - M * 2;
  var PH      = doc.internal.pageSize.height;
  var name    = studentData.name;
  var group   = studentData.group;
  var total   = problems.length;
  var pct     = Math.round(correctCount / total * 100);
  var dateStr = new Date().toLocaleString('es-MX', { dateStyle:'long', timeStyle:'short' });

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS — INJECTION BLOCK ─────────────────────────────────────────
  //   Match these RGB values to --green and --gold above.
  //   PRIMARY  → pBR, pBG, pBB
  //   ACCENT   → pAR, pAG, pAB
  // ──────────────────────────────────────────────────────────────────────────
  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;  // PRIMARY (from SCHOOL, Rule 16)
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;   // ACCENT (from SCHOOL, Rule 16)

  function pdfText(html) {
    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/\u2192/g,'->').replace(/\u2212/g,'-').replace(/\u00b2/g,'^2')
      .replace(/\u00b3/g,'^3').replace(/\u00d7/g,'x').replace(/\u00f7/g,'/')
      .replace(/\u2260/g,'!=').replace(/\u2264/g,'<=').replace(/\u2265/g,'>=')
      .replace(/\u221a/g,'sqrt').replace(/\u03c0/g,'pi').replace(/\u2026/g,'...')
      .replace(/\s+/g,' ').trim();
  }

  // ── PORTADA: orange line / white logo strip / orange line / blue band ──
  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,2,'F');   // top accent line
  doc.setFillColor(255,255,255); doc.rect(0,2,PW,26,'F');                               // white logo strip
  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,28,PW,2,'F');  // bottom accent line
  doc.setFillColor(pBR,pBG,pBB); doc.rect(0,30,PW,34,'F');       // blue header band

  if (SCHOOL.logoLeftB64) {

    try { doc.addImage(SCHOOL.logoLeftB64, fmtL, M, 4, 48, 22); } catch(e) {}

  if (SCHOOL.logoRightB64) {
    var fmtR = SCHOOL.logoRightB64.indexOf('/9j/') > -1 ? 'JPEG' : 'PNG';
    try { doc.addImage(SCHOOL.logoRightB64, fmtR, 130, 4, 48, 22); } catch(e) {}
  }

  var lx = PW - M - 36;
  var ly = 10;
  doc.setDrawColor(pBR,pBG,pBB); doc.setLineWidth(0.7);
  doc.lines([[2.57-1.03,4.63-6.17],[4.11-2.57,5.14-4.63],[5.66-4.11,2.57-5.14]], lx+1.03, ly+6.17);
  doc.setFillColor(pAR,pAG,pAB); doc.circle(lx+5.66, ly+2.57, 0.9, 'F');
  doc.setDrawColor(pAR,pAG,pAB); doc.setLineWidth(0.7);
  doc.line(lx+8.23, ly+1.54, lx+8.23, ly+7.2);
  doc.setTextColor(pBR,pBG,pBB); doc.setFontSize(11); doc.setFont('helvetica','bold');

  doc.text(t('wtitle'), M, 49);
  doc.setTextColor(150,165,200); doc.setFontSize(8); doc.setFont('helvetica','normal');
  doc.text(dateStr, M, 59);

  // ── Student info card (name + group only — código goes to footer) ──

  doc.setTextColor(130,140,160); doc.setFontSize(8.5); doc.setFont('helvetica','bold');

  doc.setTextColor(20,24,32); doc.setFontSize(11); doc.setFont('helvetica','bold');
  doc.text(name, M+4, 87); doc.text(group, 130, 87);

  doc.setFillColor(255,255,255); doc.roundedRect(M,100,TW,34,4,4,'F');

  doc.roundedRect(M,100,TW,34,4,4,'S');

    doc.setTextColor(255,255,255); doc.setFontSize(7); doc.setFont('helvetica','bold');
    doc.text(ok?'✓':'✗', M+4.5, sy+6.5);
    doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('helvetica','normal');
    doc.text('Problema '+(i+1)+': '+pdfText(prob.title), M+12, sy+6.5);
    doc.setTextColor(ok?26:176, ok?106:48, ok?74:16);
    doc.text(ok?'Correcto':'Incorrecto', PW-M-24, sy+6.5);
    sy += 12;
  });

  // ── Per-problem pages ──
  for (var i = 0; i < problems.length; i++) {
    var prob = problems[i];
    doc.addPage();
    var wy = 0;

    doc.setFillColor(pBR,pBG,pBB); doc.rect(0,0,PW,20,'F');

    var qRaw = pdfText(prob.questionText);

    var qBoxH  = 8 + qLines.length*5 + 3;
    doc.setFillColor(237,240,245); doc.roundedRect(M,wy,TW,qBoxH,2,2,'F');
    doc.setTextColor(pBR,pBG,pBB); doc.setFontSize(6.5); doc.setFont('helvetica','bold');
    doc.text('PREGUNTA', M+4, wy+6);
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var qy = wy+12;
    qLines.forEach(function(ln,li){ doc.text(ln, M+4, qy+li*5); });
    wy += qBoxH + 4;

    var isOk   = document.getElementById('pc'+i).classList.contains('ok');
    var chosen = prob.studentChoice != null ? pdfText(prob.options[prob.studentChoice]||'-') : '-';

    doc.setFontSize(8.5); var chLines = doc.splitTextToSize('Alumno: '+chosen, TW-18);
    doc.setFontSize(8);   var coLines = doc.splitTextToSize('Correcto: '+corr, TW-18);
    doc.setFontSize(7.5); var exLines = doc.splitTextToSize('Solución: '+expRaw, TW-18).slice(0,4);
    var ansBoxH = 8 + chLines.length*5.5 + coLines.length*5 + exLines.length*5 + 6;
    doc.setFillColor(isOk?232:255, isOk?240:232, isOk?232:228);
    doc.roundedRect(M,wy,TW,ansBoxH,2,2,'F');
    doc.setFillColor(isOk?26:176, isOk?106:48, isOk?74:16);
    doc.circle(M+7, wy+8, 3.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(9); doc.setFont('helvetica','bold');
    doc.text(isOk?'✓':'✗', M+5.2, wy+10.5);
    var ay = wy+7;
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','bold');
    chLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5.5); });
    ay += chLines.length*5.5 + 3;
    doc.setTextColor(26,106,74); doc.setFontSize(8); doc.setFont('helvetica','normal');
    coLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    ay += coLines.length*5 + 3;
    doc.setTextColor(90,85,80); doc.setFontSize(7.5);
    exLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    wy += ansBoxH + 5;

    doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
    doc.setFontSize(7); doc.setFont('helvetica','bold');
    doc.rect(M,wy,TW,8,'F'); doc.text('TRABAJO DEL ALUMNO', M+4, wy+5.5);
    wy += 11;

    var dc = document.getElementById('dc'+i);
    if (dc) {
      try {
        var imgD = dc.toDataURL('image/png');
        var ar   = dc.height / dc.width;
        var iw   = TW;
        var ih   = Math.min(iw * ar, 68);
        doc.addImage(imgD, 'PNG', M, wy, iw, ih);
        wy += ih + 4;
      } catch(e) {}
    }

    var ta = document.getElementById('ta'+i);
    if (ta && ta.value.trim()) {
      if (wy > PH-30) { doc.addPage(); wy = 20; }
      doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('courier','normal');
      var taLines = doc.splitTextToSize(ta.value, TW);
      taLines.slice(0,16).forEach(function(ln) {
        if (wy > PH-15) { doc.addPage(); wy = 20; }
        doc.text(ln, M, wy); wy += 5;
      });
      wy += 2;
    }

    var pp = document.getElementById('pp'+i);
    if (pp && pp.src && pp.src.indexOf('data:') === 0) {
      if (wy > PH-55) { doc.addPage(); wy = 20; }
      try { doc.addImage(pp.src, 'JPEG', M, wy, TW, 68); wy += 72; } catch(e) {}

  // ── Footer on every page ──
  var pages = doc.internal.getNumberOfPages();
  for (var p = 1; p <= pages; p++) {
    doc.setPage(p);
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0, PH-3, PW, 3, 'F');
    doc.setTextColor(130,140,160); doc.setFontSize(6.5); doc.setFont('helvetica','normal');
    doc.text(name+'  ·  '+group+'  ·  Código: '+code+'  ·  Página '+p+'/'+pages,
      PW/2, PH-5, {align:'center'});
  }

  doc.save('mat1_t12_g01_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf');
  btn.innerHTML = '⬇ &nbsp;Descargar Resultados PDF';
  btn.disabled  = false;
}

/* ================================================
   buildLesson — OVERRIDE IN EACH GUIDE
   ================================================ */
/* ================================================
   buildLesson: Tablas y gráficas de barras para analizar información
   (1o de Secundaria). Interleaved: idea -> manipulativo -> problema(s).
   Cards built inline, uno por uno.
   ================================================ */
function buildLesson(rng) {
  var LB = document.getElementById('lessonBody');
  LB.innerHTML = '';
  problems = [];

  /* ============================================================
     HELPERS
     ============================================================ */
  function T(o){
    if (o === undefined || o === null) return '';
    if (typeof o === 'string' || typeof o === 'number') return o;
    if (Object.prototype.toString.call(o) === '[object Array]') return o;
    return (o[LANG] !== undefined ? o[LANG] : o.es);
  }
  function ri(a,b){ return a + Math.floor(rng()*(b-a+1)); }
  function shufA(arr){
    var a = arr.slice(), i, j, t;
    for (i=a.length-1;i>0;i--){ j=Math.floor(rng()*(i+1)); t=a[i]; a[i]=a[j]; a[j]=t; }
    return a;
  }
  function sum(a){ var s=0,i; for(i=0;i<a.length;i++) s+=a[i]; return s; }
  function maxOf(a){ return Math.max.apply(null, a); }
  function minOf(a){ return Math.min.apply(null, a); }
  function sec(tag, title, html){
    var d = document.createElement('div');
    d.className = 'section';
    d.innerHTML = '<div class="stag">'+tag+'</div><h2>'+title+'</h2>'+(html||'');
    LB.appendChild(d);
    return d;
  }
  function widget(kind){
    var d = document.createElement('div');
    d.className = kind + 'wrap section';
    d.setAttribute('data-widget', kind);
    d.id = 'w' + kind;
    LB.appendChild(d);
    return d;
  }
  function cssv(n){
    try { var v = getComputedStyle(document.documentElement).getPropertyValue(n); return v ? v.trim() : ''; }
    catch(e){ return ''; }
  }
  function fitCv(cv){
    var dpr = window.devicePixelRatio || 1;
    var w = cv.clientWidth || 330;
    var h = cv.clientHeight || 240;
    cv.width  = Math.round(w*dpr);
    cv.height = Math.round(h*dpr);
    var ctx = cv.getContext('2d');
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,w,h);
    return { ctx:ctx, w:w, h:h };
  }
  /* dibuja una gráfica de barras completa: eje, marcas, barras y etiquetas */
  function drawBars(cv, cfg){
    if (!cv) return;
    var g = fitCv(cv), ctx = g.ctx, w = g.w, h = g.h;
    var bd = cssv('--border'), sub = cssv('--text3');
    var col = cssv('--green'), dk = cssv('--green-dark'), acc = cssv('--gold');
    var n = cfg.values.length, step = cfg.step, marks = cfg.marks, top = step*marks;
    var L = 42, R = 12, TP = 18, BT = 32;
    var pw = w-L-R, ph = h-TP-BT;
    var every = Math.max(1, Math.ceil(marks/8)), k, y, i, v, bh, x;
    ctx.font = '500 10px "IBM Plex Mono", monospace';
    ctx.textAlign = 'right';
    for (k=0;k<=marks;k++){
      if (k % every !== 0 && k !== marks) continue;
      y = (h-BT) - ph*(k/marks);
      ctx.strokeStyle = bd; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(L-4,y); ctx.lineTo(w-R,y); ctx.stroke();
      ctx.fillStyle = sub; ctx.fillText(String(k*step), L-7, y+3.5);
    }
    ctx.strokeStyle = sub; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(L,TP); ctx.lineTo(L,h-BT); ctx.lineTo(w-R,h-BT); ctx.stroke();
    var slot = pw/n, bw = Math.min(50, slot*0.58);
    for (i=0;i<n;i++){
      v  = Math.max(0, Math.min(top, cfg.values[i]));
      bh = top > 0 ? ph*(v/top) : 0;
      x  = L + slot*i + (slot-bw)/2;
      y  = (h-BT) - bh;
      ctx.fillStyle = (cfg.hi && cfg.hi.indexOf(i) >= 0) ? acc : col;
      ctx.fillRect(x, y, bw, bh);
      ctx.textAlign = 'center';
      ctx.font = '500 10px "IBM Plex Sans", sans-serif';
      ctx.fillStyle = sub;
      ctx.fillText(cfg.labels[i], x+bw/2, h-BT+15);
      if (cfg.showVals){
        ctx.fillStyle = dk;
        ctx.font = '600 11px "IBM Plex Mono", monospace';
        ctx.fillText(String(cfg.values[i]), x+bw/2, Math.max(11, y-5));
      }
      ctx.textAlign = 'right';
    }
  }
  /* cuatro opciones distintas: la correcta y los distractores que sí quepan */
  function opt4(correct, cands){
    var out = [String(correct)], i, v, k = 1;
    for (i=0;i<cands.length && out.length<4;i++){
      v = cands[i];
      if (v === null || v === undefined || isNaN(v) || v < 0) continue;
      v = String(Math.round(v));
      if (out.indexOf(v) === -1) out.push(v);
    }
    while (out.length < 4){
      v = String(Number(correct) + k);
      if (out.indexOf(v) === -1) out.push(v);
      k++;
    }
    return out;
  }
  function addProb(spec){
    var so  = shufA(T(spec.options));
    var cor = String(T(spec.correct));
    problems.push({
      title: T(spec.title),
      questionText: T(spec.q),
      fn: '',
      hint: T(spec.hint),
      explanation: T(spec.exp),
      options: so,
      correctIdx: so.indexOf(cor),
      showWork: !!spec.showWork,
      studentChoice: null,
      pendingChoice: null
    });
    buildOneCard(problems[problems.length-1], problems.length-1);
  }

  /* ============================================================
     TEMAS DE ENCUESTA (el sorteo elige tres distintos)
     ============================================================ */
  var THEMES = [
    { q:{es:'la mascota preferida', en:'the favorite pet'}, unit:{es:'estudiantes', en:'students'},
      cats:[{es:'Perro',en:'Dog'},{es:'Gato',en:'Cat'},{es:'Ave',en:'Bird'},{es:'Pez',en:'Fish'}] },
    { q:{es:'el deporte favorito', en:'the favorite sport'}, unit:{es:'estudiantes', en:'students'},
      cats:[{es:'Fútbol',en:'Soccer'},{es:'Básquet',en:'Basket'},{es:'Voleibol',en:'Volley'},{es:'Natación',en:'Swim'}] },
    { q:{es:'la fruta preferida', en:'the favorite fruit'}, unit:{es:'personas', en:'people'},
      cats:[{es:'Manzana',en:'Apple'},{es:'Plátano',en:'Banana'},{es:'Sandía',en:'Melon'},{es:'Uva',en:'Grape'}] },
    { q:{es:'cómo llegan a la escuela', en:'how they get to school'}, unit:{es:'estudiantes', en:'students'},
      cats:[{es:'Camión',en:'Bus'},{es:'Bici',en:'Bike'},{es:'A pie',en:'Walk'},{es:'Auto',en:'Car'}] },
    { q:{es:'el color favorito', en:'the favorite color'}, unit:{es:'personas', en:'people'},
      cats:[{es:'Azul',en:'Blue'},{es:'Verde',en:'Green'},{es:'Rojo',en:'Red'},{es:'Negro',en:'Black'}] },
    { q:{es:'la materia preferida', en:'the favorite subject'}, unit:{es:'estudiantes', en:'students'},
      cats:[{es:'Ciencias',en:'Science'},{es:'Historia',en:'History'},{es:'Arte',en:'Art'},{es:'Deporte',en:'Sports'}] }
  ];
  var TS  = shufA(THEMES);
  var THA = TS[0], THB = TS[1], THC = TS[2];
  function cn(th, i){ return T(th.cats[i]); }
  function labs(th){ return [cn(th,0), cn(th,1), cn(th,2), cn(th,3)]; }

  /* ============================================================
     VALORES SEMBRADOS (se sacan una sola vez, en orden fijo)
     ============================================================ */
  var v1 = Math.floor(rng()*2), v2 = Math.floor(rng()*2), v3 = Math.floor(rng()*2);
  var v4 = Math.floor(rng()*2), v5 = Math.floor(rng()*2), v6 = Math.floor(rng()*2);
  var v7 = Math.floor(rng()*2), v8 = Math.floor(rng()*2), v9 = Math.floor(rng()*2);
  var v10 = Math.floor(rng()*2);

  var a1  = ri(3,4);
  var f1  = shufA([a1, a1+1, a1+2, a1+3]);            // encuesta del salón (widgets 1 y 2)
  var tot1 = sum(f1);

  var b1  = ri(4,6);
  var f2  = shufA([b1, b1+1, b1+3, b1+5]);            // grupo B (problemas 1 y 2)
  var tot2 = sum(f2);
  var mx2 = maxOf(f2), mn2 = minOf(f2);
  var imx2 = f2.indexOf(mx2), imn2 = f2.indexOf(mn2);

  var c1  = ri(3,5);
  var f3  = shufA([c1, c1+2, c1+3, c1+5]);            // gráfica del grupo C (problema 3)
  var s3  = f3.slice().sort(function(p,q){ return p-q; });
  var hi3 = s3[3]+s3[2], lo3 = s3[0]+s3[1];

  var k4a = ri(4,7), k4b = ri(3,6), k4c = ri(5,8), miss4 = ri(4,9);
  var tot4 = k4a+k4b+k4c+miss4;                        // barra faltante (problema 4)

  var e2  = (ri(0,1) === 0) ? 2 : 5;                   // escala del bloque 3
  var m0  = ri(2,4);
  var mk  = shufA([m0, m0+1, m0+2, m0+4]);
  var val5 = [mk[0]*e2, mk[1]*e2, mk[2]*e2, mk[3]*e2];
  var i5  = ri(0,3);
  var pr6 = shufA([0,1,2,3]);
  var i6 = pr6[0], j6 = pr6[1];
  if (mk[i6] < mk[j6]) { var swp = i6; i6 = j6; j6 = swp; }
  var d6  = (mk[i6]-mk[j6])*e2;
  var srt5 = val5.slice().sort(function(p,q){ return p-q; });
  var thr7 = (v7 === 0) ? srt5[0] : srt5[2];
  var ans7 = 2;
  if (v7 === 0) ans7 = 3;

  var e8   = [2,5,10][ri(0,2)];                        // escala conveniente (problema 8)
  var mrk8 = ri(5,8);
  var max8 = e8*mrk8;

  var eT   = [2,5,10][ri(0,2)];                        // explorador de escala (widget 4)
  var mT   = ri(5,8);
  var maxT = eT*mT;
  var wT   = shufA([maxT, maxT-eT, maxT-2*eT, maxT-3*eT]);

  var q1 = ri(3,5), q2 = ri(3,5), q3 = 12-q1-q2;       // lista suelta (problema 9)
  var raw9 = [];
  (function(){
    var i;
    for (i=0;i<q1;i++) raw9.push(0);
    for (i=0;i<q2;i++) raw9.push(1);
    for (i=0;i<q3;i++) raw9.push(2);
    raw9 = shufA(raw9);
  })();

  var e10  = (ri(0,1) === 0) ? 2 : 5;                  // tabla con escala (problema 10)
  var n10  = ri(3,5);
  var mk10 = shufA([n10, n10+1, n10+2, n10+4]);
  var w10  = [mk10[0]*e10, mk10[1]*e10, mk10[2]*e10, mk10[3]*e10];
  var top10 = maxOf(mk10);
  var pair10 = (mk10[0]+mk10[1])*e10;

  /* rondas del lector de gráficas (widget 3), sorteadas de una vez */
  var LGR = [];
  (function(){
    var r, bs, mm, pr, ia, ib, tt;
    for (r=0;r<3;r++){
      bs = ri(2,4);
      mm = shufA([bs, bs+1, bs+2, bs+4]);
      pr = shufA([0,1,2,3]);
      ia = pr[0]; ib = pr[1];
      if (mm[ia] < mm[ib]) { tt = ia; ia = ib; ib = tt; }
      LGR.push({ m:mm, i:ia, j:ib });
    }
  })();

  /* helper de datos dentro del enunciado */
  function qdata(th, vals){
    var i, out = [];
    for (i=0;i<4;i++) out.push(cn(th,i) + ' <b>' + vals[i] + '</b>');
    return '<div class="qdata">' + out.join(', ') + '</div>';
  }

  /* ============================================================
     IDEA 1
     ============================================================ */
  sec(T({es:'Idea 1', en:'Idea 1'}),
      T({es:'De las respuestas sueltas a una tabla', en:'From loose answers to a table'}),
      '<p>'+T({
        es:'Cuando preguntas algo a todo un grupo, lo primero que tienes no es información: es un montón de respuestas revueltas, una por cada persona. Así, en desorden, no se puede comparar nada. El primer trabajo consiste en juntar las respuestas iguales y contarlas.',
        en:'When you ask a whole group something, the first thing you have is not information: it is a pile of scrambled answers, one per person. Like that, in disorder, nothing can be compared. The first job is to gather the equal answers together and count them.'
      })+'</p>'+
      '<p>'+T({
        es:'El número de veces que se repite una respuesta se llama frecuencia. Cuando escribes cada respuesta distinta en un renglón y a su lado su frecuencia, obtienes una tabla de frecuencias. Esa tabla ya es información: de un vistazo dice cuál respuesta se repitió más, cuál menos, y cuántas personas contestaron en total, porque el total sale de sumar todas las frecuencias.',
        en:'The number of times an answer repeats is called frequency. When you write each different answer on its own row with its frequency beside it, you get a frequency table. That table is already information: at a glance it tells which answer repeated most, which least, and how many people answered in total, because the total comes from adding up all the frequencies.'
      })+'</p>'+
      '<div class="defgrid">'+
        '<div class="defcell"><div class="defname">'+T({es:'Respuesta',en:'Answer'})+'</div><div class="deftxt">'+T({es:'Cada una de las opciones que la gente pudo elegir.',en:'Each of the options people could choose.'})+'</div></div>'+
        '<div class="defcell"><div class="defname">'+T({es:'Frecuencia',en:'Frequency'})+'</div><div class="deftxt">'+T({es:'Cuántas veces se repite esa respuesta en la lista.',en:'How many times that answer repeats in the list.'})+'</div></div>'+
        '<div class="defcell"><div class="defname">'+T({es:'Tabla',en:'Table'})+'</div><div class="deftxt">'+T({es:'Un renglón por respuesta, con su frecuencia al lado.',en:'One row per answer, with its frequency beside it.'})+'</div></div>'+
        '<div class="defcell"><div class="defname">'+T({es:'Total',en:'Total'})+'</div><div class="deftxt">'+T({es:'La suma de todas las frecuencias de la tabla.',en:'The sum of all the frequencies in the table.'})+'</div></div>'+
      '</div>');

  /* ---- MANIPULATIVO 1: cuenta las respuestas y llena la tabla ---- */
  (function(){
    var wrap = widget('tally');
    var st = { c:[0,0,0,0], used:[], tries:0, done:false };
    var chips = [], i, j;
    for (i=0;i<4;i++){ for (j=0;j<f1[i];j++) chips.push(i); }
    chips = shufA(chips);
    for (i=0;i<chips.length;i++) st.used.push(false);

    function tot(){ return st.c[0]+st.c[1]+st.c[2]+st.c[3]; }
    function live(){
      var e = document.getElementById('tyLive'); if (!e) return;
      var n = tot();
      var msg;
      if (n < chips.length) msg = T({es:'Todavía quedan respuestas sin repartir en la tabla.', en:'There are still answers not placed in the table.'});
      else if (n > chips.length) msg = T({es:'Te pasaste: alguna respuesta quedó contada dos veces.', en:'You went over: some answer got counted twice.'});
      else msg = T({es:'Ya repartiste todas. Revisa que cada renglón tenga el número que le toca.', en:'You placed them all. Check that each row holds the number it deserves.'});
      e.innerHTML = T({es:'Llevas contadas ', en:'You have counted '})+'<b>'+n+'</b>'+
                    T({es:' de ', en:' of '})+'<b>'+chips.length+'</b>'+
                    T({es:' respuestas. ', en:' answers. '})+msg;
    }
    function render(){
      var ch = chips.map(function(ci,pos){
        return '<div class="chip'+(st.used[pos]?' used':'')+'" onclick="tyChip('+pos+')">'+cn(THA,ci)+'</div>';
      }).join('');
      var rows = THA.cats.map(function(c,ci){

        '<li>'+T({es:'Con escala, una barra vale sus marcas repartidas al valor de cada marca.', en:'With a scale, a bar is worth its marks handed the value of each mark.'})+'</li>'+
      '</ul>');

  /* ---- MANIPULATIVO 5: cuaderno de la encuesta ---- */
  (function(){
    var wrap = widget('reflect');
    var PROMPTS = [
      { es:'Inventa una pregunta que le harías a tu salón, escribe cuatro respuestas posibles y dibuja cómo se vería su gráfica de barras si una respuesta ganara por mucho.',
        en:'Invent a question you would ask your class, write four possible answers and sketch how its bar graph would look if one answer won by a lot.' },
      { es:'Dibuja el mismo conjunto de barras dos veces: una con marcas de uno en uno y otra con marcas de cinco en cinco. Escribe abajo qué cambia y qué se conserva.',
        en:'Sketch the same set of bars twice: once with marks one by one and once with marks five by five. Write below what changes and what stays the same.' },
      { es:'Explica con tus palabras por qué dos gráficas de barras pueden verse muy distintas y aun así contar exactamente la misma encuesta.',
        en:'Explain in your own words why two bar graphs can look very different and still tell exactly the same survey.' }
    ];
    var pk = PROMPTS[Math.floor(rng()*PROMPTS.length)];
    wrap.innerHTML =
      '<div class="iw-tag">'+T({es:'Cuaderno de la encuesta', en:'Survey notebook'})+'</div>'+
      '<div class="iw-box">'+
        '<div class="iw-instr iw-sub">'+T({es:'Aquí no hay un solo camino bueno: escribe o dibuja lo que se te ocurra.', en:'There is no single good path here: write or sketch whatever comes to mind.'})+'</div>'+
        '<div class="reflect-prompt">'+T(pk)+'</div>'+
        '<div class="wtabs">'+
          '<button class="wtab active" onclick="rfTab(\'type\',this)">'+t('tab-type')+'</button>'+
          '<button class="wtab" onclick="rfTab(\'draw\',this)">'+t('tab-draw')+'</button>'+
        '</div>'+
        '<div class="wpanel active" id="rf_type"><textarea class="wtextarea" id="rfTa" placeholder="'+t('ph-work')+'"></textarea></div>'+
        '<div class="wpanel" id="rf_draw">'+
          '<div class="cvwrap">'+
            '<canvas class="dcanvas" id="rfCv"></canvas>'+
            '<div class="ctoolbar">'+
              '<button class="tbtn2 bpen on">'+t('btn-pen')+'</button>'+
              '<button class="tbtn2 bmarker">'+t('btn-marker')+'</button>'+
              '<button class="tbtn2 beraser">'+t('btn-eraser')+'</button>'+
              '<div class="cdot sel" data-color="#0f2d5a" style="background:#0f2d5a"></div>'+
              '<div class="cdot" data-color="#1a1a16" style="background:#1a1a16"></div>'+
              '<div class="cdot" data-color="#8b2500" style="background:#8b2500"></div>'+
              '<div class="cdot" data-color="#1d4e89" style="background:#1d4e89"></div>'+
              '<button class="clrbtn">'+t('btn-clear')+'</button>'+
            '</div>'+
          '</div>'+
        '</div>'+
        '<button class="rverify-btn" onclick="rfSave()">'+T({es:'Guardar en el cuaderno', en:'Save to the notebook'})+'</button>'+
        '<div class="rfb" id="rfFb"></div>'+
      '</div>';
    window.rfTab = function(which, btn){
      ['type','draw'].forEach(function(k){
        var p = document.getElementById('rf_'+k);
        if (p) p.classList.toggle('active', k === which);
      });
      wrap.querySelectorAll('.wtab').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      if (which === 'draw') setTimeout(function(){ var c = document.getElementById('rfCv'); if (c) initCanvas(c); }, 60);
    };
    window.rfSave = function(){
      var f = document.getElementById('rfFb');
      if (f) f.innerHTML = '<span class="okmsg">'+T({
        es:'Guardado. Esa idea es tuya y sirve para acomodar lo que ya viste.',
        en:'Saved. That idea is yours and it helps settle what you have already seen.'
      })+'</span>';
    };
  })();

  /* ---- PROBLEMA 9 ---- */
  addProb(v9 === 0 ? {
    title:{es:'Conteo en crudo', en:'Raw count'},
    q:{es:'Estas son, tal como se recogieron, las respuestas de doce personas a una pregunta sobre '+T(THA.q)+'.<div class="qdata">'+raw9.map(function(x){ return cn(THA,x); }).join(', ')+'</div>¿Cuántas personas respondieron '+cn(THA,0)+'?',
       en:'These are, exactly as they were collected, the answers of twelve people to a question about '+T(THA.q)+'.<div class="qdata">'+raw9.map(function(x){ return cn(THA,x); }).join(', ')+'</div>How many people answered '+cn(THA,0)+'?'},
    options: opt4(q1, [q2, q3, q1+1, q1-1]),
    correct: String(q1),
    hint:{es:'Ve tachando mentalmente cada respuesta que ya contaste para no repetir ninguna.',
          en:'Cross off in your head each answer you already counted so you do not repeat any.'},
    exp:{es:'Al recorrer la lista completa y marcar solo las respuestas de '+cn(THA,0)+', el conteo se detiene en '+q1+', que es la frecuencia de ese renglón.',
         en:'Going through the whole list and marking only the '+cn(THA,0)+' answers, the count stops at '+q1+', which is the frequency of that row.'},
    showWork:false
  } : {
    title:{es:'Las que no fueron', en:'The ones that were not'},
    q:{es:'Estas son, tal como se recogieron, las respuestas de doce personas a una pregunta sobre '+T(THA.q)+'.<div class="qdata">'+raw9.map(function(x){ return cn(THA,x); }).join(', ')+'</div>¿Cuántas personas respondieron algo distinto de '+cn(THA,0)+'?',
       en:'These are, exactly as they were collected, the answers of twelve people to a question about '+T(THA.q)+'.<div class="qdata">'+raw9.map(function(x){ return cn(THA,x); }).join(', ')+'</div>How many people answered something other than '+cn(THA,0)+'?'},
    options: opt4(12-q1, [q1, q2, q3, 12]),
    correct: String(12-q1),
    hint:{es:'Todas las personas de la lista entran en uno de dos montones: las de esa respuesta y las demás.',
          en:'Everyone in the list falls into one of two piles: those with that answer and all the others.'},
    exp:{es:'La lista tiene doce respuestas en total y '+q1+' de ellas son de '+cn(THA,0)+', así que las demás son las que quedan fuera de ese renglón: 12 − '+q1+' = '+(12-q1)+'.',
         en:'The list has twelve answers in total and '+q1+' of them are '+cn(THA,0)+', so the rest are the ones left out of that row: 12 − '+q1+' = '+(12-q1)+'.'},
    showWork:false
  });

  /* ---- PROBLEMA 10 ---- */
  addProb(v10 === 0 ? {
    title:{es:'De la tabla al eje', en:'From the table to the axis'},
    q:{es:'Con esta tabla de una encuesta sobre '+T(THB.q)+' se va a dibujar una gráfica de barras cuyo eje vertical sube de '+e10+' en '+e10+'.'+qdata(THB,w10)+'¿Hasta qué marca del eje llegará la barra más alta?',
       en:'With this table from a survey about '+T(THB.q)+' a bar graph is going to be drawn whose vertical axis climbs '+e10+' by '+e10+'.'+qdata(THB,w10)+'Up to which mark on the axis will the tallest bar reach?'},
    options: opt4(top10, [maxOf(w10), top10+1, top10+e10, top10-1]),
    correct: String(top10),
    hint:{es:'Primero localiza el dato mayor de la tabla y después piensa en cuántos saltos del eje lo alcanzan.',
          en:'First find the largest value in the table and then think how many jumps of the axis reach it.'},
    exp:{es:'El dato mayor de la tabla es '+maxOf(w10)+' y cada marca del eje sube '+e10+', así que la barra más alta ocupa '+maxOf(w10)+' ÷ '+e10+' = '+top10+' marcas.',
         en:'The largest value in the table is '+maxOf(w10)+' and each mark on the axis climbs '+e10+', so the tallest bar takes up '+maxOf(w10)+' ÷ '+e10+' = '+top10+' marks.'},
    showWork:true
  } : {
    title:{es:'Dos barras del mismo eje', en:'Two bars on the same axis'},
    q:{es:'En una gráfica sobre '+T(THB.q)+' el eje vertical sube de '+e10+' en '+e10+'. La barra de '+cn(THB,0)+' llega a la marca '+mk10[0]+' y la de '+cn(THB,1)+' llega a la marca '+mk10[1]+'. ¿A cuántas personas representan las dos barras juntas?',
       en:'In a graph about '+T(THB.q)+' the vertical axis climbs '+e10+' by '+e10+'. The '+cn(THB,0)+' bar reaches mark '+mk10[0]+' and the '+cn(THB,1)+' one reaches mark '+mk10[1]+'. How many people do the two bars represent together?'},
    options: opt4(pair10, [mk10[0]+mk10[1], mk10[0]*e10, Math.abs(mk10[0]-mk10[1])*e10, pair10+e10]),
    correct: String(pair10),
    hint:{es:'Las marcas de las dos barras se pueden juntar antes de convertirlas en personas.',
          en:'The marks of the two bars can be put together before turning them into people.'},
    exp:{es:'Entre las dos barras ocupan '+mk10[0]+' + '+mk10[1]+' = '+(mk10[0]+mk10[1])+' marcas del eje, y cada marca representa '+e10+' personas: '+(mk10[0]+mk10[1])+' × '+e10+' = '+pair10+'.',
         en:'Between them the two bars take up '+mk10[0]+' + '+mk10[1]+' = '+(mk10[0]+mk10[1])+' marks on the axis, and each mark represents '+e10+' people: '+(mk10[0]+mk10[1])+' × '+e10+' = '+pair10+'.'},
    showWork:true
  });
}
</script>
</body>
</html>
