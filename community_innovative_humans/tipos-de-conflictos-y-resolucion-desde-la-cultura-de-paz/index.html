<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tipos de Conflictos y Resolución desde la Cultura de Paz</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }

/* ── INTERACTIVE WIDGETS ── */
.wgt { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.1rem; margin:1rem 0; }
.wgt-h { font-size:.68rem; letter-spacing:.11em; text-transform:uppercase; color:var(--text3); margin-bottom:.55rem; font-weight:600; }
.wtask { background:var(--green-bg); border-radius:8px; padding:.6rem .85rem; font-size:.88rem; color:var(--text); margin:.6rem 0 .2rem; }
.wmsg { margin-top:.7rem; font-size:.83rem; padding:.6rem .8rem; border-radius:8px; background:var(--surface2); color:var(--text2); }
.wmsg.ok { background:var(--ok-bg); color:var(--ok); }
.wmsg.warn { background:var(--gold-bg); color:var(--text2); border-left:3px solid var(--gold); }
.wprog { font-size:.72rem; color:var(--text3); margin-top:.2rem; letter-spacing:.04em; }
.wbtn { background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:.5rem 1rem; font-size:.8rem; cursor:pointer; color:var(--text2); margin-top:.65rem; min-height:44px; font-family:inherit; }
.wbtn:hover { border-color:var(--green); color:var(--green); }

/* termómetro (canvas) */
.cvbox { border:1px solid var(--border); border-radius:10px; background:var(--surface2); overflow:hidden; margin-bottom:.8rem; }
.wcv { display:block; width:100%; height:auto; }
.reactions { display:flex; flex-direction:column; gap:.5rem; margin:.7rem 0 .2rem; }
.react { border:1.5px solid var(--border); border-radius:9px; padding:.6rem .8rem; background:var(--surface); cursor:pointer; font-size:.85rem; text-align:left; font-family:inherit; color:var(--text2); min-height:44px; transition:all .14s; }
.react:hover { border-color:var(--green); color:var(--green); }

/* clasificador */
.cls-card { border:1.5px solid var(--border); border-radius:9px; background:var(--surface2); padding:.7rem .85rem; font-size:.86rem; font-weight:600; text-align:center; margin:.6rem 0; }
.cls-bins { display:flex; flex-wrap:wrap; gap:.5rem; }
.cls-bin { flex:1; min-width:120px; min-height:44px; border:1.5px solid var(--border); border-radius:9px; background:var(--surface); padding:.55rem .8rem; font-size:.84rem; font-family:inherit; color:var(--text2); cursor:pointer; transition:all .14s; }
.cls-bin:hover { border-color:var(--green); color:var(--green); }

/* emparejar */
.mcol { display:grid; grid-template-columns:1fr 1.5fr; gap:.6rem; margin:.6rem 0; }
.mstack { display:flex; flex-direction:column; gap:.5rem; }
.mitem { border:1.5px solid var(--border); border-radius:9px; padding:.55rem .7rem; background:var(--surface2); cursor:pointer; font-size:.82rem; min-height:44px; display:flex; align-items:center; transition:all .14s; }
.mitem:hover { border-color:var(--green); }
.mitem.sel { border-color:var(--gold); background:var(--gold-bg); }
.mitem.done { border-color:var(--ok); background:var(--ok-bg); color:var(--ok); cursor:default; }

/* ordenar pasos */
.chiplist { display:flex; flex-direction:column; gap:.5rem; margin:.6rem 0; }
.chip { border:1.5px solid var(--border); border-radius:9px; padding:.55rem .8rem; background:var(--surface2); cursor:pointer; font-size:.85rem; min-height:44px; display:flex; align-items:center; gap:.6rem; transition:all .14s; }
.chip:hover { border-color:var(--green); }
.chip.sel { border-color:var(--gold); background:var(--gold-bg); }
.chip.locked { cursor:default; }
.chip-n { font-family:'IBM Plex Mono',monospace; color:var(--text3); font-weight:700; font-size:.78rem; }

/* reflexión */
.reflect-prompt { font-size:.92rem; margin:.5rem 0 .8rem; color:var(--text2); }

@media (max-width:600px){
  .mcol { grid-template-columns:1fr; }
  .cls-bin { min-width:110px; font-size:.8rem; }
  .react { font-size:.82rem; }
}
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Tipos de Conflictos y Resolución desde la Cultura de Paz</div>
    <div class="wcourse" id="wcourse-el">Formación Cívica y Ética · 1° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }

    var res = document.getElementById('s_results'); res.style.display='none'; res.classList.remove('vis');

/* ── Attempt counter + seed (Rule 4): seed = name+group+attempt ── */
function getAttemptKey(name, group){ return 'fce1_t06_g01__att__' + (name+'__'+group).replace(/\s+/g,'_'); }
function nextAttempt(name, group){ var k=getAttemptKey(name,group),n=0; try{n=parseInt(localStorage.getItem(k)||'0',10)||0;}catch(e){} n++; try{localStorage.setItem(k,String(n));}catch(e){} return n; }
function currentAttempt(name, group){ var k=getAttemptKey(name,group); try{return parseInt(localStorage.getItem(k)||'1',10)||1;}catch(e){return 1;} }
/* ================================================
   STATE
   ================================================ */
var studentData   = {};
var problems      = [];

/* ================================================
   SESSION PERSISTENCE  (localStorage)
   ================================================ */
function lsKey() {
  var n = (studentData.name  || '').trim();
  var g = (studentData.group || '').trim();
  return 'fce1_t06_g01__' + (n + '__' + g).replace(/\s+/g, '_');
}

function saveSession() {
  if (!studentData.name) return;
  var drawings = [], texts = [], photos = [];
  problems.forEach(function(p, i) {
    var dc = document.getElementById('dc' + i);
    if (dc && dc.width) {
      var blank = document.createElement('canvas');
      blank.width = dc.width; blank.height = dc.height;
      drawings.push(dc.toDataURL() === blank.toDataURL() ? null : dc.toDataURL('image/png'));
    } else { drawings.push(null); }
    var ta = document.getElementById('ta' + i);
    texts.push(ta ? ta.value : '');
    var pp = document.getElementById('pp' + i);
    photos.push((pp && pp.src && pp.src.indexOf('data:') === 0) ? pp.src : null);
  });
  var state = {
    name: studentData.name, group: studentData.group,
    answeredCount: answeredCount, correctCount: correctCount,
    choices: problems.map(function(p) { return p.studentChoice; }),
    drawings: drawings, texts: texts, photos: photos
  };
  try { localStorage.setItem(lsKey(), JSON.stringify(state)); } catch(e) {}
}

function loadSession(name, group) {
  var key = 'fce1_t06_g01__' + (name + '__' + group).replace(/\s+/g, '_');
  try { var r = localStorage.getItem(key); return r ? JSON.parse(r) : null; } catch(e) { return null; }
}

function restoreSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  var saved = loadSession(name, group);
  if (!saved) return;
  document.getElementById('restoreBar').style.display = 'none';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = currentAttempt(name, group);
  buildLesson(seededRng(name + group + att));
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
  saved.choices.forEach(function(choice, idx) {
    if (choice !== null && choice !== undefined) confirmMC(idx, choice);
  });
  setTimeout(function() {
    if (saved.drawings) {
      saved.drawings.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var dc = document.getElementById('dc' + i);
        if (!dc || !dc.width) return;
        var img = new Image();
        img.onload = function() {
          var dpr = window.devicePixelRatio || 1;
          dc.getContext('2d').drawImage(img, 0, 0, dc.width / dpr, dc.height / dpr);
        };
        img.src = dataUrl;
      });
    }
    if (saved.texts) {
      saved.texts.forEach(function(text, i) {
        if (!text) return;
        var ta = document.getElementById('ta' + i);
        if (ta) ta.value = text;
      });
    }
    if (saved.photos) {

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

async function generatePDF() {

  var doc     = new jspdf.jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });
  var PW      = 215.9;
  var M       = 18;

  var group   = studentData.group;
  var total   = problems.length;

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS — INJECTION BLOCK ─────────────────────────────────────────
  //   Match these RGB values to --green and --gold above.
  //   PRIMARY  → pBR, pBG, pBB
  //   ACCENT   → pAR, pAG, pAB
  // ──────────────────────────────────────────────────────────────────────────
  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;  // PRIMARY (from SCHOOL, Rule 16)
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;   // ACCENT (from SCHOOL, Rule 16)

  function pdfText(html) {
    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/\u2192/g,'->').replace(/\u2212/g,'-').replace(/\u00b2/g,'^2')
      .replace(/\u00b3/g,'^3').replace(/\u00d7/g,'x').replace(/\u00f7/g,'/')
      .replace(/\u2260/g,'!=').replace(/\u2264/g,'<=').replace(/\u2265/g,'>=')
      .replace(/\u221a/g,'sqrt').replace(/\u03c0/g,'pi').replace(/\u2026/g,'...')
      .replace(/\s+/g,' ').trim();
  }

  // ── PORTADA: orange line / white logo strip / orange line / blue band ──

/* Shuffles options (Rule 7) keeping ES/EN aligned, then builds the card inline (Rule 1/5). */
function addProblem(v, rng){
  var n = v.options.es.length, idx = [], k;
  for (k = 0; k < n; k++) idx.push(k);
  for (k = n - 1; k > 0; k--) {
    var j = Math.floor(rng() * (k + 1));
    var tmp = idx[k]; idx[k] = idx[j]; idx[j] = tmp;
  }
  var langOpts = (LANG === 'es') ? v.options.es : v.options.en;
  var prob = {
    title:        v.title[LANG],
    questionText: v.stmt[LANG],
    fn:           v.fn || '',
    hint:         v.hint[LANG],
    explanation:  v.explanation[LANG],
    options:      idx.map(function(o){ return langOpts[o]; }),
    correctIdx:   idx.indexOf(v.correct),
    showWork:     !!v.showWork,
    studentChoice:null, pendingChoice:null
  };
  problems.push(prob);
  buildOneCard(prob, problems.length - 1);
}

function thPal(){
  return {
    zoneA: cvar('--ok-bg','rgba(45,106,79,.10)'),
    zoneB: cvar('--gold-bg','#faf3e0'),
    zoneC: cvar('--bad-bg','rgba(139,37,0,.08)'),
    edge:  cvar('--border','#ddd8cc'),
    goal:  cvar('--ok','#2d6a4f'),
    txt:   cvar('--text3','#7a7468'),
    low:   cvar('--ok','#2d6a4f'),
    mid:   cvar('--gold','#c9a84c'),
    high:  cvar('--bad','#8b2500')
  };
}

function thDraw(){
  var cv = document.getElementById('thCv');
  if (!cv || !TH) return;
  var ctx = cv.getContext('2d');
  var P = thPal();
  var x0 = 50, w = 540, y = 72, h = 30;
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.fillStyle = P.zoneA; ctx.fillRect(x0, y, w * 0.33, h);
  ctx.fillStyle = P.zoneB; ctx.fillRect(x0 + w * 0.33, y, w * 0.34, h);
  ctx.fillStyle = P.zoneC; ctx.fillRect(x0 + w * 0.67, y, w * 0.33, h);
  ctx.strokeStyle = P.edge; ctx.lineWidth = 1.5; ctx.strokeRect(x0, y, w, h);
  ctx.strokeStyle = P.goal; ctx.lineWidth = 2.5; ctx.strokeRect(x0, y, w * 0.33, h);
  var lvl = Math.max(0, Math.min(100, TH.level));
  var mk = lvl <= 33 ? P.low : (lvl <= 67 ? P.mid : P.high);
  var px = x0 + (lvl / 100) * w;
  ctx.fillStyle = mk;
  ctx.beginPath(); ctx.moveTo(px, y - 4); ctx.lineTo(px - 9, y - 20); ctx.lineTo(px + 9, y - 20); ctx.closePath(); ctx.fill();
  ctx.fillRect(px - 2.5, y, 5, h);
  ctx.fillStyle = P.txt;
  ctx.font = '600 13px "IBM Plex Sans", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(S('Calma','Calm'), x0 + w * 0.165, y + h + 22);
  ctx.fillText(S('Tensión','Tension'), x0 + w * 0.50, y + h + 22);
  ctx.fillText(S('Estallido','Blow-up'), x0 + w * 0.835, y + h + 22);
  ctx.textAlign = 'left';
  ctx.font = '600 12px "IBM Plex Sans", sans-serif';
  ctx.fillText(S('Meta: llevar la aguja a la zona marcada','Goal: bring the needle into the marked zone'), x0, 30);
}

function thAnimate(target){
  if (THT) { clearInterval(THT); THT = null; }
  THT = setInterval(function(){
    if (!TH) { clearInterval(THT); THT = null; return; }
    var d = target - TH.level;
    if (Math.abs(d) <= 3) { TH.level = target; thDraw(); clearInterval(THT); THT = null; return; }
    TH.level += (d > 0 ? 4 : -4);
    thDraw();
  }, 18);
}

function thRender(msg, cls){
  if (!TH) return;
  var box = document.getElementById('thBox');
  if (!box) return;
  if (TH.done) {
    box.innerHTML = '<div class="wmsg ok">' +
      S('Las tres situaciones quedaron en calma. Observa qué tenían en común las respuestas que bajaron la aguja: ninguna devolvía el golpe y ninguna se callaba el problema.',
        'All three situations ended in calm. Notice what the responses that lowered the needle had in common: none of them struck back and none of them stayed silent about the problem.') +
      '</div>';
    thDraw();
    return;
  }
  var sc = TH.pool[TH.order[TH.i]];
  var deflt = S('Toca cada respuesta y mira hacia dónde se mueve la aguja. Puedes probar todas las que quieras.',
                'Tap each response and watch which way the needle moves. You can try as many as you like.');
  var btns = sc.reacts.map(function(r, ri){
    return '<button class="react" onclick="thTap(' + ri + ')">' + r[LANG] + '</button>';
  }).join('');
  box.innerHTML =
    '<div class="wprog">' + S('Situación ','Situation ') + (TH.i + 1) + ' / 3</div>' +
    '<div class="wtask">' + sc[LANG] + '</div>' +
    '<div class="reactions">' + btns + '</div>' +
    '<div class="wmsg' + (cls ? ' ' + cls : '') + '" id="thMsg">' + (msg || deflt) + '</div>';
  thDraw();
}

function thAdvance(){
  TH.i++; TH.tries = 0; TH.level = TH.base;
  if (TH.i >= 3) { TH.done = true; TH.level = 18; }
  TH.lock = false;
  thRender();
}

function thTap(ri){
  if (!TH || TH.done || TH.lock) return;
  var sc = TH.pool[TH.order[TH.i]];
  var r = sc.reacts[ri];
  var target = Math.max(0, Math.min(100, TH.base + r.d));
  thAnimate(target);
  if (r.ok) {
    TH.lock = true;
    thRender(r.fb[LANG], 'ok');
    setTimeout(function(){ if (TH) thAdvance(); }, 1700);
    return;
  }
  TH.tries++;
  if (TH.tries >= 3) {
    var good = null;
    sc.reacts.forEach(function(x){ if (x.ok) good = x; });
    TH.lock = true;
    thAnimate(Math.max(0, Math.min(100, TH.base + good.d)));
    thRender(S('La respuesta que baja la aguja es: “','The response that lowers the needle is: “') + good[LANG] + '” ' + good.fb[LANG], 'warn');
    setTimeout(function(){ if (TH) thAdvance(); }, 2600);
    return;
  }
  thRender(r.fb[LANG] + ' ' + S('Prueba otra respuesta y observa la aguja.','Try another response and watch the needle.'), 'warn');
}

    box.innerHTML = '<div class="wmsg ok">' + S('Situaciones clasificadas: ','Situations sorted: ') + CLS.correct + ' / ' + CLS.items.length + '. ' +
      S('Fíjate en la prueba que usaste cada vez: lo que hace falta para que el conflicto desaparezca es distinto en cada origen.',
        'Notice the test you used each time: what it would take for the conflict to disappear is different for each origin.') + '</div>';
    return;
  }
  var it = CLS.items[CLS.seq[CLS.i]];
  var deflt = S('Lee la situación y decide de dónde nace el conflicto.',
                'Read the situation and decide where the conflict comes from.');
  box.innerHTML =
    '<div class="wprog">' + (CLS.i + 1) + ' / ' + CLS.items.length + '</div>' +
    '<div class="cls-card">' + it[LANG] + '</div>' +
    '<div class="cls-bins">' +
      BINS.map(function(b, bi){ return '<button class="cls-bin" onclick="clsPick(' + bi + ')">' + b + '</button>'; }).join('') +
    '</div>' +
    '<div class="wmsg' + (cls ? ' ' + cls : '') + '">' + (msg || deflt) + '</div>';
}

function clsPick(bi){
  if (!CLS || CLS.done || CLS.lock) return;
  var it = CLS.items[CLS.seq[CLS.i]];
  var BINS = clsBins();
  if (bi === it.bin) {
    CLS.correct++; CLS.tries = 0; CLS.i++;
    if (CLS.i >= CLS.items.length) CLS.done = true;
    clsRender(S('Correcto. Pasa a la siguiente situación.','Correct. On to the next situation.'), 'ok');
    return;
  }
  CLS.tries++;
  var NUDGE = S(
    ['Piensa si alcanzaría con repartir mejor algo que no alcanza.',
     'Piensa si bastaría con que las dos partes tuvieran el mismo dato.',
     'Piensa si el problema empezó por algo que ocurrió entre las dos partes.',
     'Piensa si cada parte tiene una idea distinta de lo que está bien.'],
    ['Think about whether sharing out something scarce would be enough.',
     'Think about whether both sides having the same fact would settle it.',
     'Think about whether the problem started with something that happened between them.',
     'Think about whether each side holds a different idea of what is right.']);
  if (CLS.tries >= 3) {
    CLS.tries = 0; CLS.i++; CLS.lock = true;
    if (CLS.i >= CLS.items.length) CLS.done = true;
    clsRender(S('Era <b>' + BINS[it.bin] + '</b>. ', 'It was <b>' + BINS[it.bin] + '</b>. ') + NUDGE[it.bin], 'warn');
    setTimeout(function(){ if (CLS) { CLS.lock = false; clsRender(); } }, 1900);
    return;
  }
  clsRender(S('Todavía no. ','Not yet. ') + NUDGE[bi] + ' ' +
            S('Si esa prueba no resuelve el caso, el origen es otro.','If that test does not settle the case, the origin is another one.'), 'warn');
}

/* ================================================
   WIDGET 3 - EMPAREJA LA FORMA DE SOLUCION
   Tap a name, then tap the description that belongs to it. Wrong pairs give a
   distinguishing question; the third miss opens all the remaining pairs.
   ================================================ */
var MT = null;

function buildMatch(rng){
  var PAIRS = [
    { name:{ es:'Diálogo', en:'Dialogue' },
      desc:{ es:'Las dos partes hablan directamente, se escuchan sin interrumpir y deciden entre ellas.',
             en:'Both sides talk directly, listen without interrupting and decide between themselves.' } },
    { name:{ es:'Negociación', en:'Negotiation' },
      desc:{ es:'Cada parte cede en algo para llegar a un acuerdo que las dos puedan cumplir.',
             en:'Each side gives up something to reach an agreement both can keep.' } },
    { name:{ es:'Mediación', en:'Mediation' },
      desc:{ es:'Una tercera persona imparcial ayuda a que las partes se escuchen, pero no decide por ellas.',
             en:'An impartial third person helps the sides listen to each other, but does not decide for them.' } },
    { name:{ es:'Arbitraje', en:'Arbitration' },
      desc:{ es:'Las partes aceptan que una tercera persona escuche a las dos y tome la decisión final.',
             en:'The sides accept that a third person hears them both and makes the final decision.' } }
  ];
  MT = { pairs:PAIRS, left:shuffle([0,1,2,3], rng), right:shuffle([0,1,2,3], rng),
         sel:null, solved:[], tries:0, done:false };
  return addWidget('match',
    '<div class="wgt">' +
      '<div class="wgt-h">' + S('Empareja cada forma con lo que la define','Match each form with what defines it') + '</div>' +
      '<div id="mtBox"></div>' +
    '</div>');
}

function mtRender(msg, cls){
  if (!MT) return;
  var box = document.getElementById('mtBox');
  if (!box) return;
  if (MT.done) {
    box.innerHTML = '<div class="wmsg ok">' +
      S('Las cuatro quedaron emparejadas. Dos preguntas las separan: ¿participa alguien más además de las partes? y ¿quién toma la decisión final?',
        'All four are matched. Two questions separate them: does anyone take part besides the two sides, and who makes the final decision?') + '</div>';
    return;
  }
  var deflt = S('Toca una forma de la izquierda y después la descripción que le corresponde.',
                'Tap a form on the left and then the description that belongs to it.');
  var L = MT.left.map(function(pi){
    var done = MT.solved.indexOf(pi) >= 0;
    var cl = 'mitem' + (done ? ' done' : '') + (MT.sel === pi ? ' sel' : '');
    return '<div class="' + cl + '"' + (done ? '' : ' onclick="mtTapL(' + pi + ')"') + '>' + MT.pairs[pi].name[LANG] + '</div>';
  }).join('');
  var R = MT.right.map(function(pi){
    var done = MT.solved.indexOf(pi) >= 0;
    var cl = 'mitem' + (done ? ' done' : '');
    return '<div class="' + cl + '"' + (done ? '' : ' onclick="mtTapR(' + pi + ')"') + '>' + MT.pairs[pi].desc[LANG] + '</div>';
  }).join('');
  box.innerHTML =
    '<div class="wprog">' + MT.solved.length + ' / ' + MT.pairs.length + '</div>' +
    '<div class="mcol"><div class="mstack">' + L + '</div><div class="mstack">' + R + '</div></div>' +
    '<div class="wmsg' + (cls ? ' ' + cls : '') + '">' + (msg || deflt) + '</div>';
}

function mtTapL(pi){
  if (!MT || MT.done) return;
  MT.sel = (MT.sel === pi) ? null : pi;
  mtRender();
}

function mtTapR(pi){
  if (!MT || MT.done) return;
  if (MT.sel === null || MT.sel === undefined) {
    mtRender(S('Elige primero una forma de la izquierda.','Choose a form on the left first.'), 'warn');
    return;
  }
  if (MT.sel === pi) {
    MT.solved.push(pi); MT.sel = null;
    if (MT.solved.length >= MT.pairs.length) MT.done = true;
    mtRender(S('Correcto. Quedó emparejada.','Correct. That one is matched.'), 'ok');
    return;
  }
  MT.tries++;
  if (MT.tries >= 3) {
    MT.sel = null; MT.done = true;
    var lines = MT.pairs.map(function(p){ return '<b>' + p.name[LANG] + '</b>: ' + p.desc[LANG]; }).join('<br>');
    mtRender(S('Estas son las parejas. Léelas fijándote en quién decide al final.<br>',
               'These are the pairs. Read them looking at who decides in the end.<br>') + lines, 'warn');
    return;
  }
  mtRender(S('Todavía no. Pregúntate si en esa descripción participa alguien más que las dos partes, y si esa persona decide o solo acompaña.',
             'Not yet. Ask yourself whether anyone besides the two sides takes part in that description, and whether that person decides or only accompanies.'), 'warn');
}

/* ================================================
   WIDGET 4 - ORDENA LOS PASOS DEL DIALOGO
   Tap two steps to swap them. Verify gives the first step that is out of place;
   the third miss shows the full order.
   ================================================ */
var SQ = null;

function sqSteps(){
  return [
    { es:'Esperar a estar en calma antes de empezar a hablar.',
      en:'Wait until you are calm before starting to talk.' },
    { es:'Escuchar a la otra parte sin interrumpirla.',
      en:'Listen to the other side without interrupting.' },
    { es:'Decir cómo me sentí y qué necesito, sin acusar.',
      en:'Say how I felt and what I need, without accusing.' },
    { es:'Proponer varias opciones que sirvan a las dos partes.',
      en:'Propose several options that work for both sides.' },
    { es:'Elegir un acuerdo y fijar cuándo se revisa.',
      en:'Choose an agreement and set when it will be reviewed.' }
  ];
}

function buildSequence(rng){
  var order = shuffle([0,1,2,3,4], rng);
  if (order.every(function(v, k){ return v === k; })) { var a = order[0]; order[0] = order[4]; order[4] = a; }
  SQ = { order:order, sel:null, tries:0, done:false };
  return addWidget('sequence',
    '<div class="wgt">' +
      '<div class="wgt-h">' + S('Ordena la conversación','Put the conversation in order') + '</div>' +
      '<div id="sqBox"></div>' +
    '</div>');
}

function sqRender(msg, cls){
  if (!SQ) return;
  var box = document.getElementById('sqBox');
  if (!box) return;
  var ST = sqSteps();
  var deflt = S('Toca dos pasos para intercambiarlos hasta dejarlos del primero al último.',
                'Tap two steps to swap them until they run from first to last.');
  var chips = SQ.order.map(function(si, pos){
    var cl = 'chip' + (SQ.sel === pos ? ' sel' : '') + (SQ.done ? ' locked' : '');
    return '<div class="' + cl + '"' + (SQ.done ? '' : ' onclick="sqTap(' + pos + ')"') + '>' +
             '<span class="chip-n">' + (pos + 1) + '</span> ' + ST[si][LANG] + '</div>';
  }).join('');
  box.innerHTML =
    '<div class="chiplist">' + chips + '</div>' +
    (SQ.done ? '' : '<button class="wbtn" onclick="sqCheck()">' + S('Verificar','Check') + '</button>') +
    '<div class="wmsg' + (cls ? ' ' + cls : '') + '">' + (msg || deflt) + '</div>';
}

function sqTap(pos){
  if (!SQ || SQ.done) return;
  if (SQ.sel === null) { SQ.sel = pos; }
  else if (SQ.sel === pos) { SQ.sel = null; }
  else { var t = SQ.order[SQ.sel]; SQ.order[SQ.sel] = SQ.order[pos]; SQ.order[pos] = t; SQ.sel = null; }
  sqRender();
}

function sqCheck(){
  if (!SQ || SQ.done) return;
  var ok = SQ.order.every(function(si, pos){ return si === pos; });
  if (ok) {
    SQ.done = true;
    sqRender(S('Ese es el orden. Cada paso hace posible el siguiente: sin calma no se escucha, y sin escuchar no aparecen opciones.',
               'That is the order. Each step makes the next one possible: without calm there is no listening, and without listening no options appear.'), 'ok');
    return;
  }
  SQ.tries++;
  if (SQ.tries >= 3) {
    SQ.order = [0,1,2,3,4]; SQ.sel = null; SQ.done = true;
    sqRender(S('Este es el orden correcto. Observa que el acuerdo va al final y arrastra consigo su revisión.',
               'This is the correct order. Notice that the agreement comes last and brings its review along with it.'), 'warn');
    return;
  }
  var bad = 0;
  for (var k = 0; k < SQ.order.length; k++) { if (SQ.order[k] !== k) { bad = k; break; } }
  sqRender(S('Todavía no. Revisa el paso número ','Not yet. Look at step number ') + (bad + 1) +
           S(': ¿qué hace falta que ocurra antes para que ese paso sirva?',': what has to happen before it for that step to work?'), 'warn');
}

function reflectTab(which, btn){
  ['type','draw'].forEach(function(k){
    var el = document.getElementById('reflect_' + k);
    if (el) el.classList.toggle('active', k === which);
  });
  var tabs = btn.closest('.wtabs');
  if (tabs) tabs.querySelectorAll('.wtab').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  if (which === 'draw') setTimeout(function(){
    var c = document.getElementById('reflectCv');
    if (c && !c.width) initCanvas(c);
  }, 60);
}

function reflectSave(){
  var fb = document.getElementById('reflectFb');
  if (fb) {
    fb.className = 'wmsg ok';
    fb.textContent = S('Guardado. Buen razonamiento: aquí no hay una sola respuesta correcta.',
                       'Saved. Good thinking: there is no single right answer here.');
  }
}

/* ================================================

    '<p>' + S('Hay conflicto cuando dos partes quieren o necesitan algo que, por ahora, no pueden tener las dos al mismo tiempo. Pasa en el salón por el material, en la casa por el espacio y en la calle por el uso de un parque. Que aparezcan conflictos no significa que un grupo esté roto: significa que hay personas distintas conviviendo.',
              'There is conflict when two sides want or need something that, for now, they cannot both have at the same time. It happens in the classroom over supplies, at home over space and on the street over the use of a park. Conflicts appearing does not mean a group is broken: it means different people are living together.') + '</p>' +
    '<p>' + S('Lo que cambia todo es lo que hacemos con el conflicto. Cada respuesta lo mueve en alguna dirección: unas suben la tensión hasta que alguien sale dañado y otras la bajan y dejan el problema sobre la mesa, que es donde se puede tratar. La violencia no es un conflicto más grande: es lo que ocurre cuando una parte decide dañar a la otra para imponerse.',
              'What changes everything is what we do with the conflict. Every response moves it somewhere: some raise the tension until someone gets hurt and others lower it and leave the problem on the table, which is where it can be handled. Violence is not a bigger conflict: it is what happens when one side decides to harm the other in order to prevail.') + '</p>' +

      '<div class="rcard"><div class="rname">' + S('Escalada','Escalation') + '</div><div class="rform">' + S('cada respuesta sube la tensión','each response raises tension') + '</div><div class="rnote">' + S('El motivo original queda tapado.','The original reason gets buried.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Violencia','Violence') + '</div><div class="rform">' + S('daño buscado a la otra parte','harm aimed at the other side') + '</div><div class="rnote">' + S('Ya no es un desacuerdo: hay que detenerla.','It is no longer a disagreement: it has to be stopped.') + '</div></div>' +

    '<p>' + S('Dos conflictos pueden verse iguales por fuera y nacer de lugares muy distintos. Antes de buscar una salida conviene preguntar de dónde viene, porque la salida cambia por completo según la respuesta.',

    '<p>' + S('Cuatro orígenes explican la mayoría de los conflictos de la vida diaria: los recursos, la información, la relación y los valores. La prueba para distinguirlos es sencilla: pregúntate qué habría bastado para que ese conflicto no apareciera.',

    '<div class="callout"><p><strong>' + S('Detalle que se olvida: ','The detail people forget: ') + '</strong>' +
      S('un acuerdo sin fecha de revisión dura hasta la primera vez que alguien lo olvida, y nadie se entera hasta que el problema ya volvió completo.',
        'an agreement with no review date lasts until the first time someone forgets it, and nobody finds out until the problem has already come back in full.') + '</p></div>');

  buildSequence(rng); sqRender();

  /* ── PROBLEMA 7 ─────────────────────────────────────────────── */
  addProblem(pick([
    { title:{ es:'El paso que faltó', en:'The step that was missing' }, showWork:false,
      stmt:{ es:'Dos compañeros se sentaron a resolver su problema: cada uno escuchó al otro sin interrumpir, los dos dijeron cómo se habían sentido, propusieron tres opciones y eligieron una. Una semana después el problema volvió igual que antes. ¿Qué paso les faltó?',
             en:'Two classmates sat down to settle their problem: each listened to the other without interrupting, both said how they had felt, they proposed three options and chose one. A week later the problem was back exactly as before. Which step were they missing?' },
      options:{ es:[
        'Fijar una fecha para revisar si el acuerdo estaba funcionando',
        'Escribir en su cuaderno todo lo que cada uno dijo durante la conversación',
        'Pedir que un adulto estuviera presente mientras hablaban del problema',
        'Elegir la opción que más le conviniera a quien empezó el problema'],
        en:[
        'Setting a date to review whether the agreement was working',
        'Writing down in their notebook everything each of them said during the conversation',
        'Asking for an adult to be present while they talked about the problem',
        'Choosing the option that best suited whoever started the problem'] },
      correct:0,
      hint:{ es:'Un acuerdo no termina cuando se elige: falta algo para saber si de verdad sirvió.',
             en:'An agreement does not end when it is chosen: something is missing to know whether it actually worked.' },
      explanation:{ es:'Hicieron bien lo demás: esperaron a estar en calma, escucharon, dijeron lo que sentían, buscaron varias opciones y eligieron una. Lo que faltó fue la revisión: sin una fecha para comprobar si el acuerdo se estaba cumpliendo, nadie se entera de que dejó de funcionar hasta que el problema regresa completo.',
                    en:'They did the rest well: they waited to be calm, listened, said what they felt, looked for several options and chose one. What was missing was the review: with no date to check whether the agreement was being kept, nobody finds out it stopped working until the problem returns in full.' } },
    { title:{ es:'El paso que faltó', en:'The step that was missing' }, showWork:false,
      stmt:{ es:'Al empezar la conversación, uno de los dos dice: “tú siempre haces lo mismo y por eso no se puede trabajar contigo”. La otra parte se defiende y la conversación termina en menos de un minuto. ¿Qué le habría convenido hacer en ese momento?',
             en:'As the conversation starts, one of them says: “you always do the same thing and that is why nobody can work with you”. The other side gets defensive and the conversation ends in under a minute. What would have suited him at that moment?' },
      options:{ es:[
        'Decir cómo se sintió y qué necesita, sin señalar a la otra persona como el problema',
        'Repetir el reclamo con más calma hasta que la otra persona aceptara su parte',
        'Esperar a que la otra persona hablara primero y responder a cada punto que dijera',
        'Llevar una lista de todas las veces anteriores en que ocurrió exactamente lo mismo'],
        en:[
        'Saying how he felt and what he needs, without pointing at the other person as the problem',
        'Repeating the complaint more calmly until the other person accepted their share',
        'Waiting for the other person to speak first and answering every point they made',
        'Bringing a list of all the previous times exactly the same thing happened'] },
      correct:0,
      hint:{ es:'Fíjate sobre qué quedó puesto el problema en esa primera frase: sobre el asunto o sobre la persona.',
             en:'Notice where that first sentence put the problem: on the matter or on the person.' },
      explanation:{ es:'Empezar con “tú siempre” pone el problema sobre la persona, y entonces la otra parte se defiende en lugar de escuchar. Hablar desde lo que uno sintió y lo que necesita mantiene el problema sobre la mesa, que es lo único que permite llegar a las opciones. La lista de veces anteriores y el reclamo repetido siguen apuntando a la persona.',
                    en:'Starting with “you always” puts the problem on the person, and then the other side defends itself instead of listening. Speaking from what you felt and what you need keeps the problem on the table, which is the only thing that lets you reach the options. The list of previous times and the repeated complaint still point at the person.' } }
  ], rng), rng);

  buildReflect(rng);

  /* ── PROBLEMA 8 ─────────────────────────────────────────────── */
  addProblem(pick([
    { title:{ es:'Una salida que no construye paz', en:'A way out that does not build peace' }, showWork:false,
      stmt:{ es:'En una escuela, cada vez que aparece un problema entre estudiantes de barrios distintos, la salida acostumbrada es cambiar de grupo a uno de los dos. El número de problemas registrados bajó, pero los estudiantes de un mismo barrio terminaron repartidos siempre en los mismos grupos. ¿Por qué esa salida no construye una cultura de paz?',
             en:'At a school, whenever a problem appears between students from different neighbourhoods, the usual exit is to move one of the two to another class. The number of recorded problems fell, but students from one neighbourhood ended up always placed in the same classes. Why does that exit not build a culture of peace?' },
      options:{ es:[
        'Porque separa a las personas en lugar de tratar el problema y acaba dando un trato distinto a quienes vienen de un mismo lugar',
        'Porque los cambios de grupo necesitan la autorización de las familias antes de poder aplicarse',
        'Porque los problemas entre estudiantes deben resolverse siempre entre ellos, sin que participe ningún adulto',
        'Porque bajar el número de problemas registrados no es una meta que una escuela pueda proponerse'],
        en:[
        'Because it separates people instead of handling the problem and ends up treating those from one place differently',
        'Because class changes need family authorisation before they can be applied',
        'Because problems between students must always be settled among themselves, with no adult taking part',
        'Because lowering the number of recorded problems is not a goal a school can set for itself'] },
      correct:0,
      hint:{ es:'Mira dos cosas: si el problema quedó tratado, y quién termina cargando siempre con el costo de la solución.',
             en:'Look at two things: whether the problem was actually handled, and who always ends up carrying the cost of the solution.' },
      explanation:{ es:'La cultura de paz no busca que no haya conflictos, sino que se resuelvan sin dañar a nadie. Cambiar de grupo evita el ruido pero deja el conflicto sin tratar, y cuando quien se mueve viene siempre del mismo barrio, la escuela termina sosteniendo un trato desigual por el origen de las personas.',
                    en:'A culture of peace does not aim for zero conflicts, but for conflicts settled without harming anyone. Moving someone avoids the noise but leaves the conflict untreated, and when the one who moves always comes from the same neighbourhood, the school ends up sustaining unequal treatment based on where people are from.' } },
    { title:{ es:'Cuando no hay dos partes', en:'When there are not two sides' }, showWork:false,
      stmt:{ es:'En un salón, varios estudiantes repiten un apodo sobre el color de piel de un compañero y sostienen que es solo una broma entre amigos. El profesor duda si tratarlo como un conflicto entre dos partes. ¿Qué corresponde hacer?',
             en:'In a classroom, several students keep repeating a nickname about a classmate skin colour and hold that it is just a joke among friends. The teacher wonders whether to treat it as a conflict between two sides. What should be done?' },
      options:{ es:[
        'Tratarlo como un daño que hay que detener, y después trabajar con el grupo el acuerdo de trato que faltaba',
        'Tratarlo como un conflicto entre dos partes y pedir a las dos que cedan en algo para llegar a un acuerdo',
        'Dejar que el grupo lo resuelva solo, porque las bromas entre amigos no le corresponden a la escuela',
        'Pedirle al compañero que evite reaccionar, para que el apodo deje de usarse por sí mismo con el tiempo'],
        en:[
        'Treat it as harm that has to be stopped, and then work with the group on the agreement about treatment that was missing',
        'Treat it as a conflict between two sides and ask both to give up something to reach an agreement',
        'Let the group settle it alone, because jokes among friends are not the school concern',
        'Ask the classmate to avoid reacting, so the nickname stops being used on its own over time'] },
      correct:0,
      hint:{ es:'Pregúntate si las dos partes tienen algo legítimo que sostener, porque solo entonces tiene sentido pedirles que cedan.',
             en:'Ask whether both sides have something legitimate to hold, because only then does asking them to give ground make sense.' },
      explanation:{ es:'En un conflicto las dos partes tienen algo legítimo que sostener y por eso pueden ceder. Aquí no hay dos necesidades enfrentadas: hay un trato que discrimina a alguien por su color de piel, y eso primero se detiene. Pedirle a quien recibe el daño que no reaccione le traslada a él la responsabilidad. Solo después tiene sentido trabajar los acuerdos de convivencia con el grupo.',
                    en:'In a conflict both sides have something legitimate to hold and that is why they can give ground. Here there are not two competing needs: there is treatment that discriminates against someone for their skin colour, and that gets stopped first. Asking the person receiving the harm not to react shifts the responsibility onto him. Only afterwards does working on the group agreements make sense.' } }
  ], rng), rng);

  /* ── PROBLEMA 9 ─────────────────────────────────────────────── */
  addProblem(pick([
    { title:{ es:'Lo que deja evitar el conflicto', en:'What avoiding the conflict leaves behind' }, showWork:false,
      stmt:{ es:'Para no discutir, Karla acepta siempre lo que decide su equipo, aunque no esté de acuerdo. En la tercera entrega el equipo falla exactamente en lo que ella había notado desde el inicio. ¿Qué muestra ese resultado?',
             en:'To avoid arguing, Karla always accepts whatever her team decides, even when she disagrees. On the third submission the team fails on exactly what she had noticed from the start. What does that result show?' },
      options:{ es:[
        'Que evitar el conflicto no lo resuelve: lo aplaza y deja fuera información que el equipo necesitaba',
        'Que su equipo la excluyó a propósito de las decisiones importantes del proyecto',
        'Que un equipo trabaja mejor cuando una sola persona toma todas las decisiones',
        'Que los desacuerdos conviene plantearlos solo cuando ya se conoce el resultado final'],
        en:[
        'That avoiding conflict does not settle it: it postpones it and leaves out information the team needed',
        'That her team deliberately excluded her from the important decisions of the project',
        'That a team works better when one single person makes every decision',
        'That disagreements are best raised only once the final result is already known'] },
      correct:0,
      hint:{ es:'Pregúntate qué información se quedó sin llegar al equipo, y cuántas veces se repitió el mismo fallo por eso.',
             en:'Ask what information never reached the team, and how many times the same failure repeated because of it.' },
      explanation:{ es:'Karla eligió evadir: al no plantear su desacuerdo la discusión no ocurrió, pero el problema siguió ahí y el equipo repitió el error tres veces. Nadie la excluyó, ella decidió callar. Un desacuerdo planteado a tiempo pone sobre la mesa lo que una parte ve y la otra todavía no.',
                    en:'Karla chose avoidance: by not raising her disagreement the argument never happened, but the problem stayed and the team repeated the error three times. Nobody excluded her, she chose to stay silent. A disagreement raised in time puts on the table what one side sees and the other does not yet.' } },
    { title:{ es:'Lo que deja imponerse', en:'What imposing leaves behind' }, showWork:false,
      stmt:{ es:'En cada decisión del salón, un estudiante insiste en su propuesta hasta que los demás dejan de responder, y el asunto queda como él lo planteó. Al cabo de un mes, la mitad del grupo ya no participa en las decisiones. ¿Qué muestra ese resultado?',
             en:'In every classroom decision, one student pushes his proposal until the others stop answering, and the matter ends up as he framed it. After a month, half the group no longer takes part in decisions. What does that result show?' },
      options:{ es:[
        'Que imponerse termina la discusión pero no produce un acuerdo, y quienes callan dejan de sostenerlo',
        'Que el grupo necesita elegir a un representante que hable en nombre de todos sus integrantes',
        'Que las decisiones del salón tendrían que tomarse siempre mediante una votación abierta',
        'Que la mitad del grupo no tenía interés en esas decisiones desde antes de que empezara el mes'],
        en:[
        'That imposing ends the argument but produces no agreement, and those who fall silent stop upholding it',
        'That the group needs to elect a representative who speaks on behalf of all its members',
        'That classroom decisions ought always to be taken through an open vote',
        'That half the group had no interest in those decisions even before the month started'] },
      correct:0,
      hint:{ es:'Distingue entre que una discusión termine y que las partes queden de acuerdo, y mira quién sigue participando después.',
             en:'Tell apart an argument ending and the sides agreeing, and look at who still takes part afterwards.' },
      explanation:{ es:'Que nadie responda no significa que todos estén de acuerdo: significa que dejaron de hablar. Un acuerdo lo sostienen quienes participaron en él, y por eso la mitad del grupo se fue retirando. La caída de la participación empezó con el mes, así que no venía de antes.',
                    en:'Nobody answering does not mean everybody agrees: it means they stopped speaking. An agreement is upheld by those who took part in it, which is why half the group withdrew. The fall in participation began with the month, so it did not come from before.' } }
  ], rng), rng);

  /* ── PROBLEMA 10 ────────────────────────────────────────────── */
  addProblem(pick([
    { title:{ es:'Del problema al acuerdo', en:'From problem to agreement' }, showWork:true,
      stmt:{ es:'En la biblioteca de la escuela, dos grupos reclaman la misma mesa grande a la misma hora: uno la usa para armar maquetas y el otro para estudiar en silencio. Llevan un mes discutiendo y el trato entre ellos ya se volvió áspero. ¿Qué camino atiende lo que necesitan los dos grupos y evita además que el problema regrese?',
             en:'In the school library, two groups claim the same big table at the same hour: one uses it to build models and the other to study in silence. They have argued for a month and the treatment between them has turned harsh. Which route addresses what both groups need and also stops the problem from returning?' },
      options:{ es:[
        'Reconocer que son dos necesidades distintas, acordar horarios o espacios separados para cada actividad y fijar cuándo se revisa el acuerdo',
        'Pedirle a la persona encargada de la biblioteca que decida cada día cuál de los dos grupos se queda con la mesa',
        'Dejar la mesa al grupo que la haya usado durante más horas a lo largo del mes anterior',
        'Dividir la mesa por la mitad y pedirles a los dos grupos que trabajen ahí al mismo tiempo'],
        en:[
        'Recognise these are two different needs, agree on separate hours or spaces for each activity and set when the agreement gets reviewed',
        'Ask the person in charge of the library to decide each day which of the two groups keeps the table',
        'Leave the table to whichever group used it for more hours over the previous month',
        'Split the table in half and ask both groups to work there at the same time'] },
      correct:0,
      hint:{ es:'Revisa tres cosas: qué necesita cada parte, si la salida atiende las dos, y si deja algo previsto para más adelante.',
             en:'Check three things: what each side needs, whether the way out addresses both, and whether it leaves something planned for later.' },
      explanation:{ es:'Armar maquetas necesita superficie y movimiento; estudiar necesita silencio. Cualquier salida que las junte en la misma mesa a la misma hora choca con las dos. Repartir por horario o por espacio atiende cada necesidad, y la fecha de revisión permite ajustar el acuerdo si deja de funcionar. Que alguien decida cada día mantiene la disputa abierta todos los días.',
                    en:'Building models needs surface and movement; studying needs silence. Any way out that puts them at the same table at the same hour clashes with both. Sharing by hour or by space addresses each need, and the review date allows adjusting the agreement if it stops working. Having someone decide each day keeps the dispute open every single day.' } },
    { title:{ es:'Del problema al acuerdo', en:'From problem to agreement' }, showWork:true,
      stmt:{ es:'En el parque de la colonia, un grupo de vecinos entrena futbol por la tarde y otro grupo lleva a esa misma zona y a esa misma hora a niñas y niños pequeños. Ya hubo golpes con el balón y el trato entre los dos grupos se volvió áspero. ¿Qué camino atiende lo que necesitan los dos grupos y evita además que el problema regrese?',
             en:'In the neighbourhood park, a group of residents trains at football in the afternoon and another group brings small children to that same area at that same hour. There have already been hits with the ball and the treatment between the two groups has turned harsh. Which route addresses what both groups need and also stops the problem from returning?' },
      options:{ es:[
        'Reconocer que son dos necesidades distintas, acordar zonas u horarios separados para cada actividad y fijar cuándo se revisa el acuerdo',
        'Pedirle a la persona encargada del parque que decida cada tarde a cuál de los dos grupos le toca la zona',
        'Dejar la zona al grupo que lleve más años reuniéndose en ese parque por la tarde',
        'Dividir la zona con una línea y pedirles a los dos grupos que la usen al mismo tiempo'],
        en:[
        'Recognise these are two different needs, agree on separate areas or hours for each activity and set when the agreement gets reviewed',
        'Ask the person in charge of the park to decide each afternoon which of the two groups gets the area',
        'Leave the area to whichever group has been meeting in that park in the afternoon for more years',
        'Split the area with a line and ask both groups to use it at the same time'] },
      correct:0,
      hint:{ es:'Revisa tres cosas: qué necesita cada parte, si la salida atiende las dos, y si deja algo previsto para más adelante.',
             en:'Check three things: what each side needs, whether the way out addresses both, and whether it leaves something planned for later.' },
      explanation:{ es:'Entrenar necesita espacio abierto y balón en movimiento; cuidar a los pequeños necesita una zona donde el balón no llegue. Una línea en el suelo no detiene un balón, así que esa salida no atiende a ninguno de los dos. Repartir por zona o por horario atiende cada necesidad, y la revisión permite ajustar el acuerdo. La antigüedad no es un criterio que resuelva la necesidad del otro grupo.',
                    en:'Training needs open space and a moving ball; looking after small children needs an area the ball does not reach. A line on the ground does not stop a ball, so that way out addresses neither. Sharing by area or by hour addresses each need, and the review allows adjusting the agreement. Seniority is not a criterion that meets the other group need.' } }
  ], rng), rng);
}

</script>

<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbzLGV15JRTPs9bbSvHRLfgOXeT9oUExDf1AH546WOwq5tYxXSdhX212OWi_bTJfMGx9/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'Tipos de Conflictos y Resolución desde la Cultura de Paz';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
