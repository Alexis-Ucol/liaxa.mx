<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Reino Español y la Expedición de Colón</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:100px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 76px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">El Reino Español y la Expedición de Colón</div>
    <div class="wcourse" id="wcourse-el">Historia · 2° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">El Reino Español y la Expedición de Colón</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="sbtn" id="dlBtn" onclick="generatePDF()" style="max-width:280px;margin:0 auto;">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   CENTRALIZED SCHOOL CONFIG (Rule 16) — ships UNBRANDED (Rule 11).
   The ONLY rebranding point. build_all.py substitutes these exact fields
   (BRAND_FIELDS / RGB_FIELDS / logo*) downstream; :root/dark stay as fallback.
   Neutral defaults below == the static :root/dark values, so unbranded == no-op.
   ══════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:'#243c84', primaryDark:'#111d43', primaryBg:'#e8ebf5',
  accent:'#e42424', accentBg:'#fbdfdf',
  darkPrimary:'#4e69bb', darkPrimaryDark:'#7d95dd', darkPrimaryBg:'#0f1936',

function setLang(l){

    var res = document.getElementById('s_results'); res.style.display='none'; res.classList.remove('vis');

    var obs = new IntersectionObserver(function(entries){ entries.forEach(function(e){ if(e.isIntersecting) e.target.classList.add('vis'); }); }, { threshold:0.05 });

/* ── Attempt counter + seed (Rule 4): seed = name+group+attempt ── */
function getAttemptKey(name, group){ return 'his2_t02_g03__att__' + (name+'__'+group).replace(/\s+/g,'_'); }
function nextAttempt(name, group){ var k=getAttemptKey(name,group),n=0; try{n=parseInt(localStorage.getItem(k)||'0',10)||0;}catch(e){} n++; try{localStorage.setItem(k,String(n));}catch(e){} return n; }
function currentAttempt(name, group){ var k=getAttemptKey(name,group); try{return parseInt(localStorage.getItem(k)||'1',10)||1;}catch(e){return 1;} }
/* ================================================
   STATE
   ================================================ */
var studentData   = {};
var problems      = [];

/* ================================================
   SESSION PERSISTENCE  (localStorage)
   ================================================ */
function lsKey() {
  var n = (studentData.name  || '').trim();
  var g = (studentData.group || '').trim();
  return 'his2_t02_g03__' + (n + '__' + g).replace(/\s+/g, '_');
}

function saveSession() {
  if (!studentData.name) return;
  var drawings = [], texts = [], photos = [];
  problems.forEach(function(p, i) {
    var dc = document.getElementById('dc' + i);
    if (dc && dc.width) {
      var blank = document.createElement('canvas');
      blank.width = dc.width; blank.height = dc.height;
      drawings.push(dc.toDataURL() === blank.toDataURL() ? null : dc.toDataURL('image/png'));
    } else { drawings.push(null); }
    var ta = document.getElementById('ta' + i);
    texts.push(ta ? ta.value : '');
    var pp = document.getElementById('pp' + i);
    photos.push((pp && pp.src && pp.src.indexOf('data:') === 0) ? pp.src : null);
  });
  var state = {
    name: studentData.name, group: studentData.group,
    answeredCount: answeredCount, correctCount: correctCount,
    choices: problems.map(function(p) { return p.studentChoice; }),
    drawings: drawings, texts: texts, photos: photos
  };
  try { localStorage.setItem(lsKey(), JSON.stringify(state)); } catch(e) {}
}

function loadSession(name, group) {
  var key = 'his2_t02_g03__' + (name + '__' + group).replace(/\s+/g, '_');
  try { var r = localStorage.getItem(key); return r ? JSON.parse(r) : null; } catch(e) { return null; }
}

function restoreSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  var saved = loadSession(name, group);
  if (!saved) return;
  document.getElementById('restoreBar').style.display = 'none';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = currentAttempt(name, group);
  buildLesson(seededRng(name + group + att));
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  var obs = new IntersectionObserver(function(entries) {

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

  var doc     = new jspdf.jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS — INJECTION BLOCK ─────────────────────────────────────────
  //   Match these RGB values to --green and --gold above.
  //   PRIMARY  → pBR, pBG, pBB
  //   ACCENT   → pAR, pAG, pAB
  // ──────────────────────────────────────────────────────────────────────────
  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;  // PRIMARY (from SCHOOL, Rule 16)
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;   // ACCENT (from SCHOOL, Rule 16)

    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/\u2192/g,'->').replace(/\u2212/g,'-').replace(/\u00b2/g,'^2')
      .replace(/\u00b3/g,'^3').replace(/\u00d7/g,'x').replace(/\u00f7/g,'/')
      .replace(/\u2260/g,'!=').replace(/\u2264/g,'<=').replace(/\u2265/g,'>=')
      .replace(/\u221a/g,'sqrt').replace(/\u03c0/g,'pi').replace(/\u2026/g,'...')

var MANIP = {};

function shuffleIdx(n, rng){ var a=[],i,j,t; for(i=0;i<n;i++) a.push(i); for(i=n-1;i>0;i--){ j=Math.floor(rng()*(i+1)); t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function shuffleOpts(opts, correctIndex, rng){
  var ord = shuffleIdx(opts.length, rng);
  return { options: ord.map(function(k){ return opts[k]; }), correctIdx: ord.indexOf(correctIndex) };
}
function addProblem(spec, rng){
  var so = shuffleOpts(spec.options, spec.correct, rng);
  var p = { title: spec.title, questionText: spec.questionText, fn: '', hint: spec.hint || '',
            explanation: spec.explanation || '', options: so.options, correctIdx: so.correctIdx,
            showWork: !!spec.showWork, studentChoice: null, pendingChoice: null };

}

/* ── MANIPULABLE A :: la cadena de la especia (3 rondas, Regla 8 patrón B) ── */
var ESPECIA = [
  { es:'pimienta', en:'pepper' },
  { es:'clavo', en:'cloves' },
  { es:'canela', en:'cinnamon' },
  { es:'nuez moscada', en:'nutmeg' }
];
var PLAZA = [
  { es:'Alejandría', en:'Alexandria' },
  { es:'Damasco', en:'Damascus' },
  { es:'Constantinopla', en:'Constantinople' }
];
function mA_build(rng){
  var esp = shuffleIdx(ESPECIA.length, rng), plz = shuffleIdx(PLAZA.length, rng), r = [], i;
  for (i = 0; i < 3; i++){
    var b = 20 + 5 * Math.floor(rng() * 7);
    var c = 6 + 2 * Math.floor(rng() * 5);
    var k = 2 + Math.floor(rng() * 5);
    r.push({ esp: esp[i], plz: plz[i], b: b, c: c, k: k, goal: b + k * c });
  }
  MANIP.A = { r: r, round: 0, tries: 0, val: 0, done: false, fb: '', fbk: '' };
}
function mA_price(){ var A = MANIP.A, d = A.r[A.round]; return d.b + A.val * d.c; }
function mA_render(){
  var A = MANIP.A, z = document.getElementById('mzA');
  if (!z) return;
  if (A.done){
    z.innerHTML = '<div class="mztitle">' + L({ es:'Recorriste tres cadenas de comercio', en:'You traced three trade chains' }) + '</div>' +
                  '<div class="mzfb ok">' + A.fb + '</div>';
    return;
  }
  var d = A.r[A.round], i, links = '';
  links += '<div class="chlink orig"><div class="chtag">' + L(PLAZA[d.plz]) + '</div><div class="chprice">' + d.b + '</div></div>';
  for (i = 1; i <= A.val; i++){
    links += '<div class="chlink mid"><div class="chtag">' + L({ es:'mano ', en:'hand ' }) + i + '</div><div class="chprice">+' + d.c + '</div></div>';
  }
  links += '<div class="chlink endp"><div class="chtag">' + L({ es:'feria de Brujas', en:'Bruges fair' }) + '</div><div class="chprice">' + mA_price() + '</div></div>';
  z.innerHTML =
    '<div class="mzstep">' + L({ es:'Cadena', en:'Chain' }) + ' ' + (A.round + 1) + ' / 3</div>' +
    '<div class="mztitle">' + L({ es:'Un costal de ', en:'A sack of ' }) + L(ESPECIA[d.esp]) +
      L({ es:' sale de ', en:' leaves ' }) + L(PLAZA[d.plz]) + L({ es:' y cuesta ', en:' and costs ' }) + d.b + L({ es:' monedas', en:' coins' }) + '</div>' +
    '<div class="mzq">' + L({ es:'Cada intermediario que toca la carga le suma ' + d.c + ' monedas. En la feria de Brujas el costal se vendió en ' + d.goal + ' monedas. Mueve el control hasta reconstruir por cuántas manos pasó.',
                              en:'Each middleman who handles the load adds ' + d.c + ' coins. At the Bruges fair the sack sold for ' + d.goal + ' coins. Move the control until you rebuild how many hands it passed through.' }) + '</div>' +
    '<div class="chain" id="chainA">' + links + '</div>' +
    '<div class="mzread" id="readA">' + A.val + L({ es:' intermediarios, precio final ', en:' middlemen, final price ' }) + mA_price() + L({ es:' monedas', en:' coins' }) + '</div>' +
    '<input class="mzsl" id="slA" type="range" min="0" max="9" value="' + A.val + '" oninput="mA_input(this.value)">' +
    '<div class="mzrow">' +
      '<button class="mzbtn" onclick="mA_check()">' + L({ es:'Comparar con la feria', en:'Compare with the fair' }) + '</button>' +
      '<button class="mzbtn2" onclick="mA_input(0)">' + L({ es:'Deshacer la cadena', en:'Undo the chain' }) + '</button>' +
    '</div>' +
    '<div class="mzfb' + (A.fbk ? ' ' + A.fbk : '') + '">' + A.fb + '</div>';
}
function mA_input(v){
  var A = MANIP.A;
  if (A.done) return;
  A.val = parseInt(v, 10) || 0;
  mA_render();
}
function mA_check(){
  var A = MANIP.A;
  if (A.done) return;
  var d = A.r[A.round], pr = mA_price(), adv = false;
  if (pr === d.goal){
    A.fb = L({ es:'Coincide: ', en:'It matches: ' }) + d.b + L({ es:' monedas de origen más ', en:' coins at the source plus ' }) + A.val +
           L({ es:' cargos de ', en:' charges of ' }) + d.c + L({ es:' dan las ', en:' give the ' }) + d.goal +
           L({ es:' monedas de la feria. Cada mano encarece la misma carga.', en:' coins of the fair. Every hand makes the same load dearer.' });
    A.fbk = 'ok'; adv = true;
  } else {
    A.tries++;
    if (A.tries >= 3){
      A.val = d.k;
      A.fb = L({ es:'La carga pasó por ', en:'The load passed through ' }) + d.k + L({ es:' manos: ', en:' hands: ' }) + d.b + ' + ' + d.k + ' x ' + d.c + ' = ' + d.goal + L({ es:' monedas.', en:' coins.' });
      A.fbk = 'warn'; adv = true;
    } else {
      A.fb = (pr > d.goal)
        ? L({ es:'Tu cadena cobra de más: quita intermediarios para bajar el precio.', en:'Your chain charges too much: remove middlemen to lower the price.' })
        : L({ es:'Tu cadena cobra de menos: agrega intermediarios para subir el precio.', en:'Your chain charges too little: add middlemen to raise the price.' });
      A.fbk = 'bad';
    }
  }
  if (adv){
    A.round++; A.tries = 0;
    if (A.round >= 3){
      A.done = true;
      A.fb = L({ es:'Tres cadenas, la misma lección: mientras más manos y más aduanas hay entre Asia y Europa, más sube el precio. Una ruta propia por mar era el negocio del siglo.',
                 en:'Three chains, the same lesson: the more hands and customs posts between Asia and Europe, the higher the price. A sea route of their own was the deal of the century.' });
    } else { A.val = 0; }
  }
  mA_render();
}

    L({ es:'<p>En el siglo XV, la pimienta, el clavo, la canela y la nuez moscada valían en Europa mucho más que su peso en trabajo. No crecían en el continente: llegaban de la India, de Ceilán y de las islas del sureste de Asia. El viaje era larguísimo y en el camino la carga cambiaba de manos muchas veces, en caravanas, puertos y aduanas. Cada mano cobraba su parte, y el precio final en las ferias del norte de Europa podía ser varias veces el precio de origen.</p>' +
              '<p>En 1453 los otomanos tomaron Constantinopla y el control de los pasos entre Asia y el Mediterráneo cambió de dueño. Los mercaderes de Génova y Venecia siguieron comerciando, pero con más permisos, más impuestos y menos margen. Para los reinos del extremo occidental de Europa, llegar a Asia por mar dejó de ser una idea de eruditos y se volvió un negocio posible.</p>' +

          en:'<p>In the fifteenth century, pepper, cloves, cinnamon and nutmeg were worth far more in Europe than their weight in labour. They did not grow on the continent: they came from India, from Ceylon and from the islands of Southeast Asia. The journey was very long and along the way the cargo changed hands many times, in caravans, ports and customs posts. Every hand took its share, and the final price at the fairs of northern Europe could be several times the price at the source.</p>' +

    L({ es:'<p>En 1469 se casaron Isabel, heredera de Castilla, y Fernando, heredero de Aragón. Isabel fue reconocida reina de Castilla en 1474, tras una guerra por la sucesión, y Fernando llegó al trono de Aragón en 1479. Desde entonces los dos reinos más fuertes de la península tuvieron una sola política, aunque cada uno conservó sus leyes, sus Cortes, sus monedas y sus impuestos. Los historiadores llaman a eso una unión dinástica: no se fundieron en un reino único, se unieron las casas reinantes.</p>' +

  addSection(L({ es:'Concepto 3', en:'Concept 3' }), L({ es:'El viaje de 1492, paso a paso', en:'The 1492 voyage, step by step' }),
    L({ es:'<p>Cristóbal Colón, navegante genovés, sostenía que se podía llegar a Asia navegando hacia el occidente. Su cálculo de la distancia era mucho menor que la real y en su mapa no había un continente en medio. Portugal había rechazado su propuesta; en Castilla insistió durante años ante una junta de expertos que también dudaba de sus números.</p>' +

          en:'<p>Christopher Columbus, a Genoese navigator, argued that Asia could be reached by sailing west. His estimate of the distance was much smaller than the real one and his map had no continent in between. Portugal had turned his proposal down; in Castile he pressed for years before a panel of experts that also doubted his figures.</p>' +

              '<p>The fleet left the port of Palos de la Frontera on 3 August 1492: the ship Santa Maria and the caravels Pinta and Nina, with about ninety men. It stopped in the Canary Islands to repair a rudder and change the rigging, and from there it kept west with the trade winds. On 12 October 1492 it reached land on a Caribbean island that its inhabitants called Guanahani. He then sailed along the coasts of Cuba and Hispaniola, and returned to Palos in March 1493 convinced he had reached the neighbourhood of Asia. He never stopped believing it.</p>' +

  addSection(L({ es:'Concepto 4', en:'Concept 4' }), L({ es:'Repartir en un papel lo que ya estaba habitado', en:'Dividing on paper what was already inhabited' }),
    L({ es:'<p>Al volver la flota, Castilla y Portugal quedaron enfrentadas: las dos alegaban derechos sobre las tierras del Atlántico. En 1493 se emitieron en Roma las bulas alejandrinas, documentos papales que concedían a Castilla las tierras descubiertas al occidente de una raya trazada de polo a polo, cien leguas al occidente de las Azores y de Cabo Verde, con la obligación de difundir el cristianismo. Portugal no aceptó esa medida.</p>' +
              '<p>La negociación siguió y el 7 de junio de 1494 las dos coronas firmaron en Tordesillas un tratado que corrió la raya hasta 370 leguas al occidente de las islas de Cabo Verde: lo que quedara al oriente sería de Portugal y lo que quedara al occidente, de Castilla. Con esa línea, la punta de tierra firme que después se llamó Brasil cayó del lado portugués y las islas del Caribe del lado castellano.</p>' +

              '<div class="rules-grid">' +

                '<div class="rcard"><div class="rname">1494</div><div class="rform">Tordesillas</div><div class="rnote">raya a 370 leguas de Cabo Verde</div></div>' +
                '<div class="rcard"><div class="rname">Oriente</div><div class="rform">Portugal</div><div class="rnote">África, la ruta de la India y Brasil</div></div>' +
                '<div class="rcard"><div class="rname">Occidente</div><div class="rform">Castilla</div><div class="rnote">las Antillas y el continente americano</div></div>' +
              '</div>' +
              '<div class="callout"><p><strong>Una pregunta para la clase.</strong> ¿Quién estaba en la mesa cuando se firmó el tratado y quién no? Esa ausencia es el punto de partida de cualquier revisión honesta del reparto.</p></div>',
          en:'<p>When the fleet returned, Castile and Portugal came into conflict: both claimed rights over the Atlantic lands. In 1493 the Alexandrine bulls were issued in Rome, papal documents granting Castile the lands discovered west of a line drawn from pole to pole, one hundred leagues west of the Azores and Cape Verde, with the obligation of spreading Christianity. Portugal did not accept that measure.</p>' +
              '<p>The negotiation went on and on 7 June 1494 the two crowns signed at Tordesillas a treaty that moved the line to 370 leagues west of the Cape Verde islands: whatever lay east would belong to Portugal and whatever lay west, to Castile. With that line, the tip of the mainland later called Brazil fell on the Portuguese side and the Caribbean islands on the Castilian side.</p>' +
              '<p>It is worth stopping here and looking at these documents from universal values. None of the divided lands was empty: millions of people lived in them with their own governments, languages, beliefs and forms of justice. No one consulted them, no one asked for their consent and none of them signed the treaty. From liberty, justice, respect and tolerance, an agreement that decides about absent peoples does not hold up, even if it was considered legal at the time.</p>' +

                '<div class="rcard"><div class="rname">East</div><div class="rform">Portugal</div><div class="rnote">Africa, the India route and Brazil</div></div>' +

  addSection(L({ es:'Concepto 5', en:'Concept 5' }), L({ es:'Las Antillas: el primer modelo de colonización', en:'The Antilles: the first model of colonization' }),
    L({ es:'<p>Las islas del Caribe fueron el primer territorio colonizado y ahí se ensayó lo que después se aplicaría en el continente. En La Española, habitada por pueblos taínos con sus propios cacicazgos, se fundaron villas y en 1496 la ciudad de Santo Domingo. Los colonos recibieron repartimientos: grupos de personas obligadas a trabajar para ellos en el lavado de oro de los ríos y en los cultivos, primero de yuca y algodón y después de caña de azúcar. Esa entrega de trabajo obligatorio a cambio de la promesa de protección y enseñanza religiosa se llamó encomienda.</p>' +
              '<p>La Corona organizó el cobro: de todo el oro obtenido, una quinta parte le correspondía al rey, el llamado quinto real, y los pueblos entregaban tributo en oro, algodón o alimentos. En pocas décadas la población taína cayó de forma dramática por las epidemias traídas del otro lado del océano, el trabajo forzado, el hambre y los enfrentamientos. Fue una catástrofe demográfica, y la escasez de trabajadores llevó a la Corona a autorizar la llegada forzada de personas esclavizadas desde África.</p>' +
              '<p>Desde estas islas partió todo lo demás: Puerto Rico en 1508, Jamaica en 1509 y Cuba a partir de 1511. Y de los puertos de Cuba salieron, entre 1517 y 1519, las expediciones que llegaron a las costas de lo que hoy es México.</p>' +
              '<div class="rules-grid">' +
                '<div class="rcard"><div class="rname">Encomienda</div><div class="rform">Trabajo obligatorio</div><div class="rnote">entregado a un colono</div></div>' +
                '<div class="rcard"><div class="rname">Quinto real</div><div class="rform">Una quinta parte</div><div class="rnote">del oro obtenido, para el rey</div></div>' +
                '<div class="rcard"><div class="rname">Tributo</div><div class="rform">Oro y algodón</div><div class="rnote">también alimentos y trabajo</div></div>' +
                '<div class="rcard"><div class="rname">1511</div><div class="rform">Cuba</div><div class="rnote">base de las expediciones al continente</div></div>' +
              '</div>' +
              '<div class="callout"><p><strong>Lo que se ensaya se repite.</strong> Encomienda, tributo y quinto real no nacieron en el continente: llegaron ya probados desde las islas.</p></div>',
          en:'<p>The Caribbean islands were the first colonized territory and there the model later applied on the mainland was tried out. On Hispaniola, inhabited by Taino peoples with their own chiefdoms, towns were founded and in 1496 the city of Santo Domingo. Settlers received allotments: groups of people forced to work for them washing gold from the rivers and in the fields, first of cassava and cotton and later of sugar cane. That grant of forced labour in exchange for the promise of protection and religious teaching was called encomienda.</p>' +
              '<p>The Crown organized the collection: of all the gold obtained, one fifth belonged to the king, the so called royal fifth, and the peoples handed over tribute in gold, cotton or food. Within a few decades the Taino population fell dramatically because of the epidemics brought from the other side of the ocean, forced labour, hunger and armed conflict. It was a demographic catastrophe, and the shortage of workers led the Crown to authorize the forced arrival of enslaved people from Africa.</p>' +
              '<p>Everything else set out from these islands: Puerto Rico in 1508, Jamaica in 1509 and Cuba from 1511 on. And from the ports of Cuba, between 1517 and 1519, sailed the expeditions that reached the coasts of what is today Mexico.</p>' +
              '<div class="rules-grid">' +
                '<div class="rcard"><div class="rname">Encomienda</div><div class="rform">Forced labour</div><div class="rnote">granted to a settler</div></div>' +
                '<div class="rcard"><div class="rname">Royal fifth</div><div class="rform">One fifth</div><div class="rnote">of the gold obtained, for the king</div></div>' +
                '<div class="rcard"><div class="rname">Tribute</div><div class="rform">Gold and cotton</div><div class="rnote">also food and labour</div></div>' +
                '<div class="rcard"><div class="rname">1511</div><div class="rform">Cuba</div><div class="rnote">base of the expeditions to the mainland</div></div>' +
              '</div>' +
              '<div class="callout"><p><strong>What is tried out gets repeated.</strong> Encomienda, tribute and the royal fifth were not born on the mainland: they arrived already tested from the islands.</p></div>' }));

  /* ── PROBLEMA 9 ── */
  addProblem(v9 === 0 ? {
    title: L({ es:'El tributo de la encomienda', en:'The tribute of the encomienda' }),
    questionText: L({ es:'En La Española, un encomendero recibió el trabajo obligatorio de ' + p9f + ' familias y exigió a cada una ' + p9c + ' arrobas de algodón al año. Al cerrar el año entregó la tercera parte de lo reunido al gobernador de la isla y se quedó con el resto. ¿Cuántas arrobas se quedó?',
                      en:'On Hispaniola, an encomendero received the forced labour of ' + p9f + ' families and demanded ' + p9c + ' arrobas of cotton a year from each one. At the end of the year he handed one third of what was gathered to the governor of the island and kept the rest. How many arrobas did he keep?' }),
    hint: L({ es:'Reúne primero todo el algodón del año y después separa la parte que salió hacia el gobernador.',
              en:'First gather all the cotton of the year and then separate the part that went to the governor.' }),
    explanation: L({ es:'En el año se reunieron ' + p9f + ' x ' + p9c + ' = ' + p9t + ' arrobas; al gobernador fueron ' + p9t + ' / 3 = ' + p9third + ', y quedaron ' + p9t + ' - ' + p9third + ' = ' + p9r,
                     en:'Over the year ' + p9f + ' x ' + p9c + ' = ' + p9t + ' arrobas were gathered; ' + p9t + ' / 3 = ' + p9third + ' went to the governor, and ' + p9t + ' - ' + p9third + ' = ' + p9r + ' were left' }),
    options: [ p9r + L(ARR), p9third + L(ARR), p9t + L(ARR), (p9t/2) + L(ARR) ],
    correct: 0, showWork: true
  } : {
    title: L({ es:'La parte del rey', en:'The share of the king' }),
    questionText: L({ es:'En una isla de las Antillas, ' + p9q + ' cuadrillas de trabajadores obligados lavan oro en los ríos y cada cuadrilla entrega ' + p9o + ' pesos de oro en la fundición. De todo el oro registrado, una quinta parte se aparta para el rey. ¿Cuántos pesos de oro se apartan para el rey?',
                      en:'On an island of the Antilles, ' + p9q + ' gangs of forced workers wash gold in the rivers and each gang delivers ' + p9o + ' gold pesos at the foundry. Of all the registered gold, one fifth is set aside for the king. How many gold pesos are set aside for the king?' }),
    hint: L({ es:'Suma primero todo el oro que llega a la fundición y después considera la parte que se aparta.',
              en:'First add up all the gold arriving at the foundry and then consider the part that is set aside.' }),
    explanation: L({ es:'La fundición registra ' + p9q + ' x ' + p9o + ' = ' + (p9o*p9q) + ' pesos de oro, y la parte del rey es ' + (p9o*p9q) + ' / 5 = ' + p9r2,
                     en:'The foundry registers ' + p9q + ' x ' + p9o + ' = ' + (p9o*p9q) + ' gold pesos, and the share of the king is ' + (p9o*p9q) + ' / 5 = ' + p9r2 }),
    options: [ p9r2 + L(PES), (p9o*p9q) + L(PES), (p9o*p9q*4/5) + L(PES), (p9o*p9q/10) + L(PES) ],
    correct: 0, showWork: true
  }, rng);

  /* ══════════ CONCEPTO 6 ══════════ */
  addSection(L({ es:'Concepto 6', en:'Concept 6' }), L({ es:'Del otro lado del mar: señoríos, alianzas y tensiones', en:'On the other side of the sea: lordships, alliances and tensions' }),
    L({ es:'<p>Mientras en las islas se ensayaba la colonización, el territorio de lo que hoy es México no era un solo imperio parejo. Era un mosaico de señoríos, cada uno con su gobierno, su lengua y sus alianzas. El poder más fuerte era la Triple Alianza formada por México-Tenochtitlan, Texcoco y Tlacopan, que cobraba tributo a cientos de pueblos en provincias muy alejadas entre sí. El tributo llegaba en mantas, cacao, plumas, maíz, algodón y trabajo.</p>' +
              '<p>Ese cobro producía tensión. Los totonacos de Cempoala, en la costa del Golfo, pagaban y guardaban quejas por la forma en que se les cobraba. Otros pueblos nunca fueron sometidos: el señorío de Tlaxcala se mantuvo independiente y en guerra frecuente con Tenochtitlan; al occidente, el señorío purépecha de Tzintzuntzan había detenido varias veces a los ejércitos de la Alianza; también quedaban fuera Metztitlán y Yopitzinco.</p>' +
              '<p>Entender ese mapa cambia la manera de leer lo que vino después. Cuando llegaron las expediciones que salieron de Cuba, no encontraron un bloque unido ni un vacío: encontraron señoríos que ya negociaban, competían y se enfrentaban entre sí, y algunos vieron en los recién llegados una oportunidad para dejar de pagar tributo.</p>' +
              '<div class="rules-grid">' +
                '<div class="rcard"><div class="rname">Triple Alianza</div><div class="rform">Tres ciudades</div><div class="rnote">Tenochtitlan, Texcoco y Tlacopan</div></div>' +
                '<div class="rcard"><div class="rname">Tributarios</div><div class="rform">Cientos de pueblos</div><div class="rnote">mantas, cacao, maíz y trabajo</div></div>' +
                '<div class="rcard"><div class="rname">Nunca sometidos</div><div class="rform">Tlaxcala</div><div class="rnote">también los purépechas al occidente</div></div>' +
                '<div class="rcard"><div class="rname">Inconformes</div><div class="rform">Cempoala</div><div class="rnote">tributarios con quejas por el cobro</div></div>' +
              '</div>' +
              '<div class="callout"><p><strong>Ni bloque ni vacío.</strong> El mundo mesoamericano previo al contacto tenía sus propios conflictos, y esos conflictos también son parte de la explicación histórica.</p></div>',
          en:'<p>While colonization was being tried out on the islands, the territory of what is today Mexico was not a single even empire. It was a mosaic of lordships, each with its own government, language and alliances. The strongest power was the Triple Alliance formed by Mexico-Tenochtitlan, Texcoco and Tlacopan, which collected tribute from hundreds of towns in provinces far apart from one another. Tribute arrived as cloaks, cacao, feathers, maize, cotton and labour.</p>' +
              '<p>That collection produced tension. The Totonacs of Cempoala, on the Gulf coast, paid and held complaints about the way they were charged. Other peoples were never subdued: the lordship of Tlaxcala stayed independent and often at war with Tenochtitlan; to the west, the Purepecha lordship of Tzintzuntzan had stopped the armies of the Alliance several times; Metztitlan and Yopitzinco also stayed outside.</p>' +
              '<p>Understanding that map changes the way we read what came next. When the expeditions that sailed from Cuba arrived, they found neither a united bloc nor an empty land: they found lordships that already negotiated, competed and fought among themselves, and some saw in the newcomers a chance to stop paying tribute.</p>' +
              '<div class="rules-grid">' +
                '<div class="rcard"><div class="rname">Triple Alliance</div><div class="rform">Three cities</div><div class="rnote">Tenochtitlan, Texcoco and Tlacopan</div></div>' +
                '<div class="rcard"><div class="rname">Tributaries</div><div class="rform">Hundreds of towns</div><div class="rnote">cloaks, cacao, maize and labour</div></div>' +
                '<div class="rcard"><div class="rname">Never subdued</div><div class="rform">Tlaxcala</div><div class="rnote">also the Purepecha to the west</div></div>' +
                '<div class="rcard"><div class="rname">Discontented</div><div class="rform">Cempoala</div><div class="rnote">tributaries with complaints about the charge</div></div>' +
              '</div>' +
              '<div class="callout"><p><strong>Neither bloc nor empty land.</strong> The Mesoamerican world before contact had conflicts of its own, and those conflicts are also part of the historical explanation.</p></div>' }));

  addSection(L({ es:'Explora', en:'Explore' }), L({ es:'Mapa de señoríos', en:'Map of lordships' }),
    L({ es:'<p>Cada pista describe un señorío por su posición y por su relación con la Triple Alianza. Toca el que crees que es.</p>',
        en:'<p>Each clue describes a lordship by its position and by its relation with the Triple Alliance. Tap the one you think it is.</p>' }) +
    '<div class="mzone" id="mzE"></div>');
  mE_build(rng); mE_render();

  /* ── PROBLEMA 10 ── */
  addProblem(v10 === 0 ? {
    title: L({ es:'Un mapa con grietas', en:'A map with cracks' }),
    questionText: L({ es:'Antes de la llegada de las expediciones que salieron de Cuba, la Triple Alianza cobraba tributo a cientos de pueblos, Tlaxcala se mantenía fuera y en guerra con Tenochtitlan, y varios tributarios de la costa guardaban quejas por el cobro. ¿Cómo influyó esa situación en los primeros años del contacto?',
                      en:'Before the arrival of the expeditions that sailed from Cuba, the Triple Alliance collected tribute from hundreds of towns, Tlaxcala stayed outside and at war with Tenochtitlan, and several coastal tributaries held complaints about the charge. How did that situation influence the first years of contact?' }),
    hint: L({ es:'Piensa qué le conviene a un recién llegado que encuentra vecinos enfrentados entre sí.',
              en:'Think what suits a newcomer who finds neighbours in conflict with one another.' }),
    explanation: L({ es:'Las tensiones abiertas permitieron que los recién llegados buscaran alianzas con señoríos enemigos de Tenochtitlan o descontentos con el tributo, en lugar de enfrentar a todos a la vez.',
                     en:'The open tensions allowed the newcomers to seek alliances with lordships that were enemies of Tenochtitlan or discontented with the tribute, instead of facing everyone at once.' }),
    options: [ L({ es:'Permitió que los recién llegados buscaran alianzas con señoríos enemigos o inconformes con el tributo', en:'It allowed the newcomers to seek alliances with lordships that were enemies or discontented with the tribute' }),
               L({ es:'Obligó a todos los señoríos a formar un solo frente para responder juntos al contacto', en:'It forced all the lordships to form a single front to respond to the contact together' }),
               L({ es:'Impidió cualquier acuerdo entre los recién llegados y los pueblos de la costa del Golfo', en:'It prevented any agreement between the newcomers and the peoples of the Gulf coast' }),
               L({ es:'Llevó a la Triple Alianza a suspender el cobro de tributo en las provincias lejanas', en:'It led the Triple Alliance to suspend tribute collection in the distant provinces' }) ],
    correct: 0, showWork: false
  } : {
    title: L({ es:'La queja de Cempoala', en:'The complaint of Cempoala' }),
    questionText: L({ es:'Los totonacos de Cempoala, en la costa del Golfo, pagaban tributo a la Triple Alianza y guardaban quejas por la forma en que se les cobraba, mientras el señorío purépecha nunca fue sometido por esa misma Alianza. ¿Qué muestra este contraste sobre el mundo mesoamericano previo al contacto?',
                      en:'The Totonacs of Cempoala, on the Gulf coast, paid tribute to the Triple Alliance and held complaints about the way they were charged, while the Purepecha lordship was never subdued by that same Alliance. What does this contrast show about the Mesoamerican world before contact?' }),
    hint: L({ es:'Compara la situación de un pueblo que paga a disgusto con la de otro que nunca pagó.',
              en:'Compare the situation of a people that pays unwillingly with that of another that never paid.' }),
    explanation: L({ es:'Muestra que no era un bloque unido: había señoríos tributarios, señoríos aliados y reinos independientes, con alianzas y tensiones entre ellos.',
                     en:'It shows that it was not a united bloc: there were tributary lordships, allied lordships and independent kingdoms, with alliances and tensions among them.' }),
    options: [ L({ es:'Que no era un bloque unido, sino muchos señoríos con alianzas y tensiones entre sí', en:'That it was not a united bloc, but many lordships with alliances and tensions among themselves' }),
               L({ es:'Que todos los señoríos reconocían a Tenochtitlan como su única autoridad de gobierno', en:'That all the lordships recognized Tenochtitlan as their only governing authority' }),
               L({ es:'Que la costa del Golfo estaba casi despoblada cuando llegaron las primeras naves', en:'That the Gulf coast was almost unpopulated when the first ships arrived' }),
               L({ es:'Que el tributo se entregaba de forma voluntaria y sin conflictos entre los pueblos', en:'That tribute was handed over voluntarily and without conflicts among the peoples' }) ],
    correct: 0, showWork: false
  }, rng);

  /* ══════════ CIERRE ══════════ */
  addSection(L({ es:'Cierre', en:'Closing' }), L({ es:'Lo que quedó en marcha', en:'What was set in motion' }),
    L({ es:'<p>En veinte años se encadenaron un problema comercial, la consolidación de una corona, un viaje mal calculado, dos documentos que repartieron tierras habitadas y un modelo de colonización probado en unas islas. Ese encadenamiento es el que explica lo que sigue en el continente.</p>' +
              '<div class="callout"><p><strong>Para tu cuaderno.</strong> Escribe una sola pregunta que le harías a alguien que estuvo en Tordesillas en 1494. La mejor pregunta histórica es la que no se puede contestar con un sí o un no.</p></div>',
        en:'<p>In twenty years a trade problem, the consolidation of a crown, a badly calculated voyage, two documents that divided inhabited lands and a colonization model tested on some islands were chained together. That chain is what explains what follows on the mainland.</p>' +
              '<div class="callout"><p><strong>For your notebook.</strong> Write a single question you would ask someone who was at Tordesillas in 1494. The best historical question is the one that cannot be answered with a yes or a no.</p></div>' }));
}
</script>

<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbzLGV15JRTPs9bbSvHRLfgOXeT9oUExDf1AH546WOwq5tYxXSdhX212OWi_bTJfMGx9/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'El Reino Español y la Expedición de Colón';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
