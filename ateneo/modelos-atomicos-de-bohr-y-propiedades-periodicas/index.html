<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modelos Atómicos de Bohr y Propiedades Periódicas</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Modelos Atómicos de Bohr y Propiedades Periódicas</div>
    <div class="wcourse" id="wcourse-el">Química · 3° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Modelos Atómicos de Bohr y Propiedades Periódicas</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="sbtn" id="dlBtn" onclick="generatePDF()" style="max-width:280px;margin:0 auto;">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   CENTRALIZED SCHOOL CONFIG (Rule 16) — ships UNBRANDED (Rule 11).
   The ONLY rebranding point. build_all.py substitutes these exact fields
   (BRAND_FIELDS / RGB_FIELDS / logo*) downstream; :root/dark stay as fallback.
   Neutral defaults below == the static :root/dark values, so unbranded == no-op.
   ══════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:'#84246c', primaryDark:'#431136', primaryBg:'#f5e8f2',
  accent:'#585858', accentBg:'#ededed',
  darkPrimary:'#bb4ea0', darkPrimaryDark:'#dd7dc5', darkPrimaryBg:'#360f2d',

}

  document.getElementById('restoreBar').style.display = 'none';

  var att = currentAttempt(name, group);
  buildLesson(seededRng(name + group + att));
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
  saved.choices.forEach(function(choice, idx) {

    if (saved.texts) {
      saved.texts.forEach(function(text, i) {

        if (ta) ta.value = text;

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 1 :: la balanza del atomo neutro
   El alumno agrega o quita protones, neutrones y electrones. La viga se
   inclina en tiempo real con la carga y la masa se actualiza al instante.
   ══════════════════════════════════════════════════════════════════════════ */
function wBalance(rng, host){
  var POOL = ['Li','Be','B','C','N','O','F','Na','Mg','Al','Si','P','S','Cl','K','Ca'];
  var seq = shuffle(POOL, rng).slice(0, 3);
  var round = 0, tries = 0, done = false;
  var tgt = elBy(seq[0]);
  var st = { p:0, n:0, e:0 };

  function charge(){ return st.p - st.e; }
  function mass(){ return st.p + st.n; }

  function stepper(k, label, value){
    return '<div class="shrow">' +
      '<div class="shlbl">' + label + '</div>' +
      '<button class="iw-btn" data-k="' + k + '" data-d="-1">−</button>' +
      '<div class="shcnt">' + value + '</div>' +
      '<button class="iw-btn" data-k="' + k + '" data-d="1">+</button>' +
    '</div>';
  }

  function render(){
    var ang = Math.max(-16, Math.min(16, charge() * 5));
    var chTxt = charge() === 0
      ? L({ es:'neutro', en:'neutral' })
      : (charge() > 0 ? '+' + charge() : '−' + Math.abs(charge()));
    host.innerHTML =
      '<div class="iw-tag">' + L({ es:'Balanza del átomo', en:'Atom balance' }) + '</div>' +
      '<div class="iw-sub">' + L({ es:'Arma un átomo neutro de ', en:'Build a neutral atom of ' }) + nameOf(tgt) +
        L({ es:' con número de masa ', en:' with mass number ' }) + tgt.a + '.</div>' +
      '<div class="iw-mini">' + L({ es:'Átomo ', en:'Atom ' }) + (round + 1) + L({ es:' de 3. Número atómico de referencia: ', en:' of 3. Reference atomic number: ' }) + tgt.z + '.</div>' +
      '<div class="bal">' +
        '<div class="bal-beam" style="transform:rotate(' + ang + 'deg)">' +
          '<div class="bal-pan lft">' + L({ es:'protones', en:'protons' }) + '<b>' + st.p + '</b></div>' +
          '<div class="bal-pan rgt">' + L({ es:'electrones', en:'electrons' }) + '<b>' + st.e + '</b></div>' +
        '</div>' +
        '<div class="bal-post"></div><div class="bal-base"></div>' +
      '</div>' +
      '<div>' +
        '<span class="iw-pill">' + L({ es:'carga', en:'charge' }) + ': <b>' + chTxt + '</b></span>' +
        '<span class="iw-pill">' + L({ es:'masa', en:'mass' }) + ': <b>' + mass() + '</b></span>' +
        '<span class="iw-pill">' + L({ es:'objetivo', en:'target' }) + ': <b>' + tgt.a + '</b></span>' +
      '</div>' +
      stepper('p', L({ es:'protones', en:'protons' }), st.p) +
      stepper('n', L({ es:'neutrones', en:'neutrons' }), st.n) +
      stepper('e', L({ es:'electrones', en:'electrons' }), st.e) +
      '<div class="iw-row">' +
        (done ? '' : '<button class="iw-btn go" data-a="ck">' + L({ es:'Comprobar', en:'Check' }) + '</button>') +
        (done ? '' : '<button class="iw-btn" data-a="rs">' + L({ es:'Vaciar', en:'Empty' }) + '</button>') +
      '</div>' +
      '<div class="iw-fb"></div>';
    wire();
  }

  function live(){
    if (charge() !== 0){
      say(host, '', charge() > 0
        ? L({ es:'La viga cae del lado de los protones: sobran cargas positivas.', en:'The beam drops on the proton side: there are extra positive charges.' })
        : L({ es:'La viga cae del lado de los electrones: sobran cargas negativas.', en:'The beam drops on the electron side: there are extra negative charges.' }));
      return;
    }
    if (st.p === 0){
      say(host, '', L({ es:'La viga está equilibrada, pero todavía no hay nada en el núcleo.', en:'The beam is level, but there is still nothing in the nucleus.' }));
      return;
    }
    if (mass() < tgt.a){
      say(host, '', L({ es:'Equilibrada. Aún faltan ', en:'Level. Still ' }) + (tgt.a - mass()) + L({ es:' unidades para llegar al número de masa.', en:' units short of the mass number.' }));
      return;
    }
    if (mass() > tgt.a){
      say(host, '', L({ es:'Equilibrada, pero el núcleo pesa ', en:'Level, but the nucleus is ' }) + (mass() - tgt.a) + L({ es:' unidades de más.', en:' units too heavy.' }));
      return;
    }
    say(host, 'warm', L({ es:'Carga equilibrada y masa en el objetivo. Comprueba tu átomo.', en:'Charge balanced and mass on target. Check your atom.' }));
  }

  function reveal(){
    st = { p:tgt.z, n:neuOf(tgt), e:tgt.z };
    done = (round === 2);
    render();
    say(host, 'warm',
      L({ es:'Así queda: ', en:'This is how it looks: ' }) + tgt.z + L({ es:' protones, porque el número atómico fija la identidad; ', en:' protons, because the atomic number fixes the identity; ' }) +
      tgt.z + L({ es:' electrones para que la viga quede en cero; y ', en:' electrons so the beam sits at zero; and ' }) +
      neuOf(tgt) + L({ es:' neutrones, que es lo que falta para llegar a la masa ', en:' neutrons, which is what is missing to reach mass ' }) + tgt.a + '.');
    setTimeout(next, 2200);
  }

  function next(){
    round++;
    if (round >= 3){ done = true; render(); say(host, 'good', L({ es:'🎉 Tres átomos armados. Ya sabes leer el núcleo a partir de los dos números de la casilla.', en:'🎉 Three atoms built. You can now read the nucleus from the two numbers in the box.' })); return; }
    tries = 0; tgt = elBy(seq[round]); st = { p:0, n:0, e:0 };
    render();
    say(host, '', L({ es:'Nuevo átomo. Empieza por el núcleo.', en:'New atom. Start with the nucleus.' }));
  }

  function check(){
    if (st.p !== tgt.z){
      tries++;
      if (tries >= 3){ reveal(); return; }
      say(host, 'miss', st.p < tgt.z
        ? L({ es:'Con esos protones todavía no es ', en:'With those protons it is not yet ' }) + nameOf(tgt) + L({ es:'. Agrega ', en:'. Add ' }) + (tgt.z - st.p) + L({ es:' más.', en:' more.' })
        : L({ es:'Te pasaste de protones: quita ', en:'Too many protons: remove ' }) + (st.p - tgt.z) + L({ es:' y vuelve al número atómico.', en:' and go back to the atomic number.' }));
      return;
    }
    if (st.e !== st.p){
      tries++;
      if (tries >= 3){ reveal(); return; }
      say(host, 'miss', L({ es:'La identidad ya es correcta, pero la viga sigue inclinada: en un átomo neutro los electrones igualan a los protones.', en:'The identity is right, but the beam is still tilted: in a neutral atom electrons match protons.' }));
      return;
    }
    if (mass() !== tgt.a){
      tries++;
      if (tries >= 3){ reveal(); return; }
      say(host, 'miss', mass() < tgt.a
        ? L({ es:'Buen equilibrio. Falta peso en el núcleo: agrega ', en:'Good balance. The nucleus is light: add ' }) + (tgt.a - mass()) + L({ es:' neutrones.', en:' neutrons.' })
        : L({ es:'Buen equilibrio, pero el núcleo pesa de más: quita ', en:'Good balance, but the nucleus is too heavy: remove ' }) + (mass() - tgt.a) + L({ es:' neutrones.', en:' neutrons.' }));
      return;
    }
    say(host, 'good', '🎉 ' + nameOf(tgt) + L({ es:' listo: ', en:' done: ' }) + tgt.z + L({ es:' protones, ', en:' protons, ' }) + neuOf(tgt) + L({ es:' neutrones y ', en:' neutrons and ' }) + tgt.z + L({ es:' electrones.', en:' electrons.' }));
    setTimeout(next, 1600);
  }

  function wire(){
    on(host, '[data-k]', 'click', function(){
      if (done) return;
      var k = this.getAttribute('data-k'), d = parseInt(this.getAttribute('data-d'), 10);
      st[k] = Math.max(0, Math.min(30, st[k] + d));
      render(); live();
    });
    on(host, '[data-a="ck"]', 'click', check);
    on(host, '[data-a="rs"]', 'click', function(){ st = { p:0, n:0, e:0 }; render(); say(host, '', L({ es:'Platillos vacíos. Empieza de nuevo cuando quieras.', en:'Empty pans. Start again whenever you like.' })); });
  }

  render();
  say(host, '', L({ es:'Agrega partículas y observa hacia dónde cae la viga.', en:'Add particles and watch which way the beam falls.' }));
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 2 :: constructor de Bohr
   El alumno reparte los electrones capa por capa y el diagrama se redibuja
   en tiempo real.
   ══════════════════════════════════════════════════════════════════════════ */
function wBohr(rng, host){
  var POOL = ['C','O','F','Ne','Na','Mg','Al','Si','P','S','Cl','Ar','K','Ca'];
  var seq = shuffle(POOL, rng).slice(0, 3);
  var CAP = [2, 8, 8, 2];
  var RAD = [44, 72, 100, 122];
  var round = 0, tries = 0, done = false;
  var tgt = elBy(seq[0]);
  var cur = [0, 0, 0, 0];

  function total(){ return cur[0] + cur[1] + cur[2] + cur[3]; }
  function want(i){ return tgt.sh[i] || 0; }

  function diagram(){
    var html = '<div class="bh">';
    var i, j;
    for (i = 0; i < 4; i++){
      var R = RAD[i];
      html += '<div class="bhring" style="left:' + (125 - R) + 'px;top:' + (125 - R) + 'px;width:' + (2 * R) + 'px;height:' + (2 * R) + 'px"></div>';
    }
    html += '<div class="bhnuc"><span>' + tgt.z + ' p+</span><span>' + neuOf(tgt) + ' n</span></div>';
    for (i = 0; i < 4; i++){
      for (j = 0; j < cur[i]; j++){
        var ang = (2 * Math.PI * j / Math.max(1, cur[i])) - Math.PI / 2;
        var x = 125 + RAD[i] * Math.cos(ang) - 6;
        var y = 125 + RAD[i] * Math.sin(ang) - 6;
        html += '<div class="bhe" style="left:' + x.toFixed(1) + 'px;top:' + y.toFixed(1) + 'px"></div>';
      }
    }
    return html + '</div>';
  }

  function render(){
    var rows = '', i;
    for (i = 0; i < 4; i++){
      rows += '<div class="shrow">' +
        '<div class="shlbl">' + L({ es:'capa ', en:'shell ' }) + (i + 1) + ' (' + L({ es:'cabe ', en:'holds ' }) + CAP[i] + ')</div>' +
        '<button class="iw-btn" data-i="' + i + '" data-d="-1">−</button>' +
        '<div class="shcnt">' + cur[i] + '</div>' +
        '<button class="iw-btn" data-i="' + i + '" data-d="1">+</button>' +
      '</div>';
    }
    host.innerHTML =
      '<div class="iw-tag">' + L({ es:'Constructor de Bohr', en:'Bohr builder' }) + '</div>' +
      '<div class="iw-sub">' + L({ es:'Coloca los electrones de ', en:'Place the electrons of ' }) + nameOf(tgt) + L({ es:' en sus capas.', en:' in its shells.' }) + '</div>' +
      '<div class="iw-mini">' + L({ es:'Átomo ', en:'Atom ' }) + (round + 1) + L({ es:' de 3. Colocados: ', en:' of 3. Placed: ' }) + total() + ' / ' + tgt.z + '.</div>' +
      diagram() + rows +
      '<div class="iw-row">' +
        (done ? '' : '<button class="iw-btn go" data-a="ck">' + L({ es:'Comprobar', en:'Check' }) + '</button>') +
        (done ? '' : '<button class="iw-btn" data-a="rs">' + L({ es:'Quitar todos', en:'Remove all' }) + '</button>') +
      '</div>' +
      '<div class="iw-fb"></div>';
    wire();
  }

  function live(){
    var i;
    for (i = 0; i < 4; i++){
      if (cur[i] > CAP[i]){
        say(host, 'warm', L({ es:'La capa ', en:'Shell ' }) + (i + 1) + L({ es:' no admite más de ', en:' takes no more than ' }) + CAP[i] + L({ es:' electrones.', en:' electrons.' }));
        return;
      }
    }
    if (total() < tgt.z){ say(host, '', L({ es:'Te faltan ', en:'You are ' }) + (tgt.z - total()) + L({ es:' electrones por colocar.', en:' electrons short.' })); return; }
    if (total() > tgt.z){ say(host, 'warm', L({ es:'Colocaste ', en:'You placed ' }) + (total() - tgt.z) + L({ es:' de más: un átomo neutro tiene tantos electrones como protones.', en:' too many: a neutral atom has as many electrons as protons.' })); return; }
    say(host, 'warm', L({ es:'Ya están los ', en:'All ' }) + tgt.z + L({ es:' electrones. Revisa que las capas se hayan llenado por turnos.', en:' electrons are in. Check that the shells filled in turn.' }));
  }

  function reveal(){
    var i;
    for (i = 0; i < 4; i++) cur[i] = want(i);
    done = (round === 2);
    render();
    say(host, 'warm', L({ es:'Este es el reparto de ', en:'This is the layout of ' }) + nameOf(tgt) + ': ' + shStr(tgt) +
      L({ es:'. Cada capa se completa antes de que empiece la siguiente.', en:'. Each shell is completed before the next one starts.' }));
    setTimeout(next, 2200);
  }

  function next(){
    round++;
    if (round >= 3){ done = true; render(); say(host, 'good', L({ es:'🎉 Tres átomos dibujados. El número de capas ocupadas te dará el periodo.', en:'🎉 Three atoms drawn. The number of occupied shells will give you the period.' })); return; }
    tries = 0; tgt = elBy(seq[round]); cur = [0, 0, 0, 0];
    render();
    say(host, '', L({ es:'Nuevo átomo. Empieza por la capa más cercana al núcleo.', en:'New atom. Start with the shell closest to the nucleus.' }));
  }

  function check(){
    var i, ok = true;
    for (i = 0; i < 4; i++) if (cur[i] !== want(i)) ok = false;
    if (ok){
      say(host, 'good', '🎉 ' + nameOf(tgt) + ': ' + shStr(tgt) + L({ es:'. Ocupa ', en:'. It occupies ' }) + tgt.sh.length + L({ es:' capas y en la más externa quedan ', en:' shells and in the outermost one there are ' }) + tgt.sh[tgt.sh.length - 1] + L({ es:' electrones.', en:' electrons.' }));
      setTimeout(next, 1700);
      return;
    }
    tries++;
    if (tries >= 3){ reveal(); return; }
    if (total() !== tgt.z){ live(); return; }
    for (i = 0; i < 4; i++){
      if (cur[i] > CAP[i]){
        say(host, 'miss', L({ es:'La capa ', en:'Shell ' }) + (i + 1) + L({ es:' admite como máximo ', en:' takes at most ' }) + CAP[i] + L({ es:' electrones. Pasa los que sobran a la siguiente.', en:' electrons. Move the extra ones to the next shell.' }));
        return;
      }
    }
    for (i = 0; i < 4; i++){
      if (cur[i] < want(i)){
        say(host, 'miss', L({ es:'La capa ', en:'Shell ' }) + (i + 1) + L({ es:' todavía puede recibir más electrones antes de abrir la siguiente.', en:' can still take more electrons before the next one opens.' }));
        return;
      }
      if (cur[i] > want(i)){
        say(host, 'miss', L({ es:'En la capa ', en:'In shell ' }) + (i + 1) + L({ es:' hay electrones de más para este átomo: pásalos hacia afuera.', en:' there are too many electrons for this atom: move them outwards.' }));
        return;
      }
    }
  }

  function wire(){
    on(host, '[data-i]', 'click', function(){
      if (done) return;
      var i = parseInt(this.getAttribute('data-i'), 10), d = parseInt(this.getAttribute('data-d'), 10);
      cur[i] = Math.max(0, Math.min(10, cur[i] + d));
      render(); live();
    });
    on(host, '[data-a="ck"]', 'click', check);
    on(host, '[data-a="rs"]', 'click', function(){ cur = [0, 0, 0, 0]; render(); say(host, '', L({ es:'Capas vacías. Vuelve a repartir.', en:'Empty shells. Share them out again.' })); });
  }

  render();
  say(host, '', L({ es:'Reparte los electrones y mira cómo se llenan las órbitas.', en:'Share out the electrons and watch the orbits fill.' }));
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 3 :: diagrama de Lewis por toques
   Ocho posiciones alrededor del simbolo; el alumno enciende y apaga puntos.
   ══════════════════════════════════════════════════════════════════════════ */
function wLewis(rng, host){
  var POOL = ['Li','Be','B','C','N','O','F','Ne','Na','Mg','Al','Si','P','S','Cl'];
  var seq = shuffle(POOL, rng).slice(0, 3);
  var SLOT = [[108,10],[196,66],[108,146],[20,66],[136,10],[196,102],[136,146],[20,102]];
  var round = 0, tries = 0, done = false;
  var tgt = elBy(seq[0]);
  var on8 = [false, false, false, false, false, false, false, false];

  function count(){ var n = 0, i; for (i = 0; i < 8; i++) if (on8[i]) n++; return n; }
  function sides(){
    var full = 0, used = 0, j;
    for (j = 0; j < 4; j++){
      var c = (on8[j] ? 1 : 0) + (on8[j + 4] ? 1 : 0);
      if (c > 0) used++;
      if (c === 2) full++;
    }
    return { used:used, full:full };
  }
  function okNow(){
    var v = valOf(tgt), s = sides();
    return count() === v && s.used === Math.min(v, 4) && s.full === Math.max(0, v - 4);
  }

  function render(){
    var dots = '', i;
    for (i = 0; i < 8; i++){
      dots += '<div class="lwd' + (on8[i] ? ' on' : '') + '" data-s="' + i + '" style="left:' + SLOT[i][0] + 'px;top:' + SLOT[i][1] + 'px"></div>';
    }
    host.innerHTML =
      '<div class="iw-tag">' + L({ es:'Puntos de Lewis', en:'Lewis dots' }) + '</div>' +
      '<div class="iw-sub">' + L({ es:'Dibuja el diagrama de Lewis de ', en:'Draw the Lewis diagram of ' }) + nameOf(tgt) + L({ es:', del grupo ', en:', from group ' }) + tgt.g + '.</div>' +
      '<div class="iw-mini">' + L({ es:'Átomo ', en:'Atom ' }) + (round + 1) + L({ es:' de 3. Toca una posición para poner o quitar un punto.', en:' of 3. Tap a position to add or remove a dot.' }) + '</div>' +
      '<div class="lw' + (done ? ' locked' : '') + '"><div class="lwsym">' + tgt.s + '</div>' + dots + '</div>' +
      '<div><span class="iw-pill">' + L({ es:'puntos colocados', en:'dots placed' }) + ': <b>' + count() + '</b></span></div>' +
      '<div class="iw-row">' +
        (done ? '' : '<button class="iw-btn go" data-a="ck">' + L({ es:'Comprobar', en:'Check' }) + '</button>') +
        (done ? '' : '<button class="iw-btn" data-a="rs">' + L({ es:'Borrar puntos', en:'Clear dots' }) + '</button>') +
      '</div>' +
      '<div class="iw-fb"></div>';
    wire();
  }

  function live(){
    var v = valOf(tgt), c = count();
    if (c < v){
      say(host, '', L({ es:'Todavía faltan ', en:'Still ' }) + (v - c) + L({ es:' puntos.', en:' dots to go.' }));
      return;
    }
    if (c > v){
      say(host, 'warm', L({ es:'Sobran ', en:'There are ' }) + (c - v) + L({ es:' puntos para este elemento.', en:' dots too many for this element.' }));
      return;
    }
    say(host, 'warm', L({ es:'Ya tienes el número de puntos. Revisa cómo quedaron repartidos por los lados.', en:'You have the right number of dots. Check how they are spread over the sides.' }));
  }

  function reveal(){
    var v = valOf(tgt), i;
    for (i = 0; i < 8; i++) on8[i] = (i < v);
    done = (round === 2);
    render();
    say(host, 'warm', nameOf(tgt) + L({ es:' está en el grupo ', en:' is in group ' }) + tgt.g + L({ es:', así que lleva ', en:', so it carries ' }) + v +
      L({ es:' puntos: uno en cada lado y solo después se emparejan.', en:' dots: one on each side and only then they pair up.' }));
    setTimeout(next, 2200);
  }

  function next(){
    round++;
    if (round >= 3){ done = true; render(); say(host, 'good', L({ es:'🎉 Tres diagramas. Los puntos que dibujaste son los que deciden con quién se une cada átomo.', en:'🎉 Three diagrams. The dots you drew are the ones that decide who each atom joins.' })); return; }
    tries = 0; tgt = elBy(seq[round]); on8 = [false, false, false, false, false, false, false, false];
    render();
    say(host, '', L({ es:'Nuevo elemento. Mira su grupo antes de tocar.', en:'New element. Look at its group before tapping.' }));
  }

  function check(){
    var v = valOf(tgt), s = sides();
    if (okNow()){
      say(host, 'good', '🎉 ' + tgt.s + L({ es:' con ', en:' with ' }) + v + L({ es:' electrones de valencia, los mismos para toda la columna del grupo ', en:' valence electrons, the same for the whole column of group ' }) + tgt.g + '.');
      setTimeout(next, 1700);
      return;
    }
    tries++;
    if (tries >= 3){ reveal(); return; }
    if (count() !== v){ live(); return; }
    if (v <= 4 && s.full > 0){
      say(host, 'miss', L({ es:'Son los puntos correctos, pero están emparejados antes de tiempo: con ', en:'The dots are right, but they pair up too early: with ' }) + v + L({ es:' o menos, cada punto va en un lado distinto.', en:' or fewer, each dot goes on a different side.' }));
      return;
    }
    say(host, 'miss', L({ es:'Son los puntos correctos, pero falta ocupar los cuatro lados antes de emparejar: primero uno por lado y luego los pares.', en:'The dots are right, but the four sides are not all taken before pairing: first one per side, then the pairs.' }));
  }

  function wire(){
    on(host, '[data-s]', 'click', function(){
      if (done) return;
      var i = parseInt(this.getAttribute('data-s'), 10);
      on8[i] = !on8[i];
      render(); live();
    });
    on(host, '[data-a="ck"]', 'click', check);
    on(host, '[data-a="rs"]', 'click', function(){ on8 = [false, false, false, false, false, false, false, false]; render(); say(host, '', L({ es:'Símbolo limpio. Vuelve a colocar los puntos.', en:'Clean symbol. Place the dots again.' })); });
  }

  render();
  say(host, '', L({ es:'Enciende tantos puntos como electrones tenga la capa externa.', en:'Switch on as many dots as the outer shell has electrons.' }));
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 4 :: cazador de tendencias
   El alumno toca el elemento extremo de una propiedad; si falla, la pista le
   dice hacia donde moverse en la tabla. Al acertar aparecen las barras.
   ══════════════════════════════════════════════════════════════════════════ */
var TRENDSETS = [
  { kind:'row', els:['Li','Be','C','F'] },
  { kind:'row', els:['B','C','O','F'] },
  { kind:'row', els:['Na','Mg','Si','Cl'] },
  { kind:'row', els:['Na','Al','P','Cl'] },
  { kind:'row', els:['Mg','Si','S','Cl'] },
  { kind:'col', els:['H','Li','Na','K'] },
  { kind:'col', els:['F','Cl','Br','I'] }
];
function propName(p){
  if (p === 'r')  return L({ es:'radio atómico', en:'atomic radius' });
  if (p === 'ie') return L({ es:'energía de ionización', en:'ionization energy' });
  return L({ es:'electronegatividad', en:'electronegativity' });
}
function propVal(e, p){ return p === 'r' ? e.r : (p === 'ie' ? e.ie : e.eg); }
function propUnit(p){ return p === 'r' ? ' pm' : (p === 'ie' ? ' kJ por mol' : ''); }

function wTrend(rng, host){
  var order = shuffle([0, 1, 2, 3, 4, 5, 6], rng).slice(0, 3);
  var props = shuffle(['r', 'ie', 'eg'], rng);
  var wants = [rng() < 0.5, rng() < 0.5, rng() < 0.5];
  var round = 0, tries = 0, done = false, shown = false;
  var set, els, prop, wantMax, target;

  function load(){
    set = TRENDSETS[order[round]];
    els = set.els.map(elBy);
    prop = props[round];
    wantMax = wants[round];
    target = els[0];
    var i;
    for (i = 1; i < els.length; i++){
      if (wantMax ? propVal(els[i], prop) > propVal(target, prop) : propVal(els[i], prop) < propVal(target, prop)) target = els[i];
    }
  }

  function bars(){
    var mx = 0, i;
    for (i = 0; i < els.length; i++) mx = Math.max(mx, propVal(els[i], prop));
    var html = '<div style="margin-top:.6rem">';
    for (i = 0; i < els.length; i++){
      var v = propVal(els[i], prop);
      html += '<div class="tbrow"><div class="tbsym">' + els[i].s + '</div>' +
        '<div class="tbwrap"><div class="tbfill" style="width:' + Math.round(v / mx * 100) + '%"></div></div>' +
        '<div class="tbval">' + v + propUnit(prop) + '</div></div>';
    }
    return html + '</div>';
  }

  function render(){
    var cards = '', i;
    for (i = 0; i < els.length; i++){
      var cls = 'tcard' + (done || shown ? ' locked' : '') + (shown && els[i] === target ? ' hit' : '') + (shown && els[i] !== target ? ' off' : '');
      cards += '<div class="' + cls + '" data-e="' + els[i].s + '"><b>' + els[i].s + '</b><span>' + nameOf(els[i]) + '</span><small>Z ' + els[i].z + '</small></div>';
    }
    host.innerHTML =
      '<div class="iw-tag">' + L({ es:'Cazador de tendencias', en:'Trend hunter' }) + '</div>' +
      '<div class="iw-sub">' + (wantMax ? L({ es:'¿Cuál tiene la mayor ', en:'Which one has the greatest ' }) : L({ es:'¿Cuál tiene la menor ', en:'Which one has the smallest ' })) + propName(prop) + '?</div>' +
      '<div class="iw-mini">' + L({ es:'Ronda ', en:'Round ' }) + (round + 1) + L({ es:' de 3. ', en:' of 3. ' }) +
        (set.kind === 'row' ? L({ es:'Los cuatro están en el mismo periodo.', en:'All four are in the same period.' }) : L({ es:'Los cuatro están en el mismo grupo.', en:'All four are in the same group.' })) + '</div>' +
      '<div class="tcards">' + cards + '</div>' +
      (shown ? bars() : '') +
      '<div class="iw-fb"></div>';
    wire();
  }

  function why(){
    if (prop === 'r'){
      return set.kind === 'row'
        ? L({ es:'Dentro de un periodo el núcleo suma protones y jala más fuerte a electrones que siguen en la misma capa, así que el radio se encoge hacia la derecha.', en:'Within a period the nucleus adds protons and pulls harder on electrons that stay in the same shell, so the radius shrinks to the right.' })
        : L({ es:'Al bajar por un grupo se agrega una capa completa, así que el átomo se hace más grande.', en:'Going down a group a whole shell is added, so the atom gets bigger.' });
    }
    if (prop === 'ie'){
      return set.kind === 'row'
        ? L({ es:'Hacia la derecha del periodo el electrón externo está más sujeto, y arrancarlo cuesta más energía.', en:'Towards the right of the period the outer electron is held more tightly, and pulling it out costs more energy.' })
        : L({ es:'Al bajar por el grupo el electrón externo queda más lejos del núcleo, y arrancarlo cuesta menos energía.', en:'Going down the group the outer electron sits further from the nucleus, and pulling it out costs less energy.' });
    }
    return set.kind === 'row'
      ? L({ es:'Hacia la derecha del periodo el átomo atrae con más fuerza los electrones que comparte.', en:'Towards the right of the period the atom attracts the electrons it shares more strongly.' })
      : L({ es:'Al bajar por el grupo la capa externa queda más lejos y el átomo atrae con menos fuerza lo que comparte.', en:'Going down the group the outer shell sits further away and the atom attracts what it shares less strongly.' });
  }

  function next(){
    round++;
    if (round >= 3){ done = true; shown = true; render(); say(host, 'good', L({ es:'🎉 Tres tendencias cazadas. Con la posición en la tabla ya puedes anticipar el valor sin medirlo.', en:'🎉 Three trends hunted. With the position in the table you can now anticipate the value without measuring it.' })); return; }
    tries = 0; shown = false; load(); render();
    say(host, '', L({ es:'Nueva ronda. Fíjate primero si se mueven por un periodo o por un grupo.', en:'New round. First check whether they move along a period or a group.' }));
  }

  function reveal(){
    shown = true;
    render();
    say(host, 'warm', L({ es:'Era ', en:'It was ' }) + nameOf(target) + '. ' + why());
    setTimeout(next, 2500);
  }

  function tap(sym){
    if (done || shown) return;
    var e = elBy(sym);
    if (e === target){
      shown = true; render();
      say(host, 'good', '🎉 ' + nameOf(target) + '. ' + why());
      setTimeout(next, 2500);
      return;
    }
    tries++;
    if (tries >= 3){ reveal(); return; }
    var dir;
    if (set.kind === 'row'){
      dir = target.g > e.g
        ? L({ es:'Busca más a la derecha del periodo.', en:'Look further right along the period.' })
        : L({ es:'Busca más a la izquierda del periodo.', en:'Look further left along the period.' });
    } else {
      dir = target.p > e.p
        ? L({ es:'Busca más abajo en el grupo.', en:'Look further down the group.' })
        : L({ es:'Busca más arriba en el grupo.', en:'Look further up the group.' });
    }
    say(host, 'miss', L({ es:'Todavía no. ', en:'Not yet. ' }) + dir);
  }

  function wire(){
    on(host, '[data-e]', 'click', function(){ tap(this.getAttribute('data-e')); });
  }

  load(); render();
  say(host, '', L({ es:'Toca el elemento que creas que está en el extremo.', en:'Tap the element you think sits at the extreme.' }));
}

    }) + '</p>' +
    '<p>' + L({
      es:'De la casilla de la tabla se leen dos números y cada uno cuenta cosas distintas. El número atómico cuenta protones, no se repite en ningún otro elemento y por eso es el que ordena la tabla entera. El número de masa cuenta protones y neutrones juntos, así que los neutrones quedan escondidos dentro de esa suma. Y como un átomo neutro no tiene carga sobrante, sus electrones son exactamente tantos como sus protones. Dos átomos con el mismo número de protones y distinto número de neutrones siguen siendo el mismo elemento: lo único que cambia es su masa.',
      en:'Two numbers are read from the box of the table and each one counts different things. The atomic number counts protons, is repeated in no other element and that is why it orders the whole table. The mass number counts protons and neutrons together, so the neutrons stay hidden inside that sum. And since a neutral atom has no leftover charge, its electrons are exactly as many as its protons. Two atoms with the same number of protons and a different number of neutrons are still the same element: the only thing that changes is their mass.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Protones', en:'Protons' }), L({ es:'número atómico', en:'atomic number' }), L({ es:'fijan la identidad del elemento', en:'they fix the identity of the element' })) +
      rcard(L({ es:'Electrones', en:'Electrons' }), L({ es:'igual que los protones', en:'same as the protons' }), L({ es:'solo en un átomo neutro', en:'only in a neutral atom' })) +
      rcard(L({ es:'Neutrones', en:'Neutrons' }), L({ es:'masa menos atómico', en:'mass minus atomic' }), L({ es:'nunca se leen directamente de la casilla', en:'never read straight off the box' })) +
      rcard(L({ es:'Número de masa', en:'Mass number' }), L({ es:'protones y neutrones', en:'protons and neutrons' }), L({ es:'los electrones no entran en la cuenta', en:'electrons do not enter the count' })) +
    '</div>' +
    '<div class="callout"><p><strong>' + L({ es:'Ojo: ', en:'Careful: ' }) + '</strong>' + L({
      es:'cambiar un protón cambia el elemento; cambiar un neutrón solo cambia la masa; cambiar un electrón deja al átomo con carga y ya no se le llama neutro.',
      en:'changing a proton changes the element; changing a neutron only changes the mass; changing an electron leaves the atom with charge and it is no longer called neutral.'
    }) + '</p></div>'
  );
  wBalance(rng, widgetHost(s1, 'wBalanza', 'balance'));
  addProblem(rng, mkP1(rng));
  addProblem(rng, mkP2(rng));

  /* ══ CONCEPTO 2 ══ */
  var s2 = sec(
    L({ es:'Concepto 2', en:'Concept 2' }),
    L({ es:'El modelo de Bohr: los electrones hacen fila', en:'The Bohr model: the electrons queue up' }),
    '<p>' + L({
      es:'Bohr propuso que los electrones no están en cualquier parte alrededor del núcleo, sino en órbitas o capas con lugares contados. La capa más cercana al núcleo admite 2 electrones, la segunda hasta 8, la tercera hasta 8 en los primeros veinte elementos y la cuarta recibe el último o los dos últimos. La regla del reparto es estricta: no se abre una capa nueva mientras la anterior tenga lugares libres.',
      en:'Bohr proposed that electrons are not just anywhere around the nucleus, but in orbits or shells with counted places. The shell closest to the nucleus takes 2 electrons, the second up to 8, the third up to 8 in the first twenty elements and the fourth takes the last one or the last two. The rule of the layout is strict: a new shell does not open while the previous one still has free places.'
    }) + '</p>' +
    '<p>' + L({
      es:'Ese orden convierte al dibujo en un mapa. Si un átomo neutro de número atómico quince reparte sus electrones, la primera capa se queda con 2, la segunda con 8 y a la tercera le tocan los 5 restantes. Y ese dibujo se puede leer al revés: el número de capas ocupadas dice en qué fila de la tabla cae el elemento, es decir su periodo. Los neutrones, en cambio, no aparecen en ninguna capa: viven en el núcleo y solo se descubren cuando se conoce el número de masa.',
      en:'That order turns the drawing into a map. If a neutral atom of atomic number fifteen shares out its electrons, the first shell keeps 2, the second 8 and the third gets the remaining 5. And that drawing can be read backwards: the number of occupied shells says which row of the table the element falls in, that is, its period. Neutrons, on the other hand, appear in no shell: they live in the nucleus and are only found when the mass number is known.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Capa 1', en:'Shell 1' }), L({ es:'hasta 2', en:'up to 2' }), L({ es:'la más cercana al núcleo', en:'the closest to the nucleus' })) +
      rcard(L({ es:'Capas 2 y 3', en:'Shells 2 and 3' }), L({ es:'hasta 8', en:'up to 8' }), L({ es:'en los primeros veinte elementos', en:'in the first twenty elements' })) +
      rcard(L({ es:'Orden de llenado', en:'Filling order' }), L({ es:'de adentro hacia afuera', en:'from inside out' }), L({ es:'sin dejar lugares libres atrás', en:'leaving no free places behind' })) +
      rcard(L({ es:'Periodo', en:'Period' }), L({ es:'capas ocupadas', en:'occupied shells' }), L({ es:'la fila donde cae la casilla', en:'the row where the box falls' })) +
    '</div>'
  );
  wBohr(rng, widgetHost(s2, 'wBohrW', 'bohr'));
  addProblem(rng, mkP3(rng));
  addProblem(rng, mkP4(rng));

  /* ══ CONCEPTO 3 ══ */
  var s3 = sec(
    L({ es:'Concepto 3', en:'Concept 3' }),
    L({ es:'La última capa decide, y Lewis la dibuja', en:'The last shell decides, and Lewis draws it' }),
    '<p>' + L({
      es:'De todos los electrones de un átomo, los que participan en la química son los de la capa más externa: los electrones de valencia. Los de adentro quedan tapados por las capas que tienen encima y casi no intervienen. Por eso el comportamiento químico se repite columna por columna: todos los elementos representativos de una misma columna terminan con la misma cantidad de electrones en la orilla, aunque uno tenga dos capas y otro cuatro.',
      en:'Of all the electrons of an atom, the ones that take part in chemistry are those of the outermost shell: the valence electrons. The inner ones are covered by the shells above them and hardly intervene. That is why chemical behaviour repeats column by column: all the representative elements of one same column end with the same amount of electrons on the edge, even if one has two shells and another four.'
    }) + '</p>' +
    '<p>' + L({
      es:'El diagrama de Lewis dibuja solo esa orilla: se escribe el símbolo del elemento y se le ponen alrededor tantos puntos como electrones de valencia tenga, uno en cada uno de los cuatro lados antes de empezar a emparejarlos. Para los elementos representativos ese número se lee de la columna: en los grupos 1 y 2 es el número del grupo, y del grupo 13 en adelante es el número del grupo menos diez. Con ocho puntos alrededor la capa externa queda completa, que es la situación de los gases nobles y la razón de que casi no reaccionen.',
      en:'The Lewis diagram draws only that edge: the symbol of the element is written and it gets around it as many dots as it has valence electrons, one on each of the four sides before starting to pair them up. For representative elements that number is read from the column: in groups 1 and 2 it is the group number, and from group 13 onwards it is the group number minus ten. With eight dots around it the outer shell is complete, which is the situation of the noble gases and the reason why they hardly react.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Valencia', en:'Valence' }), L({ es:'capa más externa', en:'outermost shell' }), L({ es:'son los electrones que reaccionan', en:'they are the electrons that react' })) +
      rcard(L({ es:'Grupos 1 y 2', en:'Groups 1 and 2' }), L({ es:'1 o 2 puntos', en:'1 or 2 dots' }), L({ es:'les conviene cederlos', en:'giving them up suits them' })) +
      rcard(L({ es:'Grupos 13 al 18', en:'Groups 13 to 18' }), L({ es:'grupo menos diez', en:'group minus ten' }), L({ es:'de 3 a 8 puntos alrededor', en:'from 3 to 8 dots around' })) +
      rcard(L({ es:'Ocho puntos', en:'Eight dots' }), L({ es:'capa completa', en:'complete shell' }), L({ es:'gases nobles, casi sin reaccionar', en:'noble gases, hardly reacting' })) +
    '</div>'
  );
  wLewis(rng, widgetHost(s3, 'wLewisW', 'lewis'));
  addProblem(rng, mkP5(rng));
  addProblem(rng, mkP6(rng));

  /* ══ CONCEPTO 4 ══ */
  var s4 = sec(
    L({ es:'Concepto 4', en:'Concept 4' }),
    L({ es:'Propiedades que suben y bajan con la posición', en:'Properties that rise and fall with position' }),
    '<p>' + L({
      es:'Algunas propiedades no cambian al azar de un elemento a otro: cambian de manera ordenada al recorrer la tabla, y por eso se llaman periódicas. El radio atómico crece al bajar por un grupo, porque cada periodo agrega una capa completa entre el núcleo y la orilla, y se encoge al avanzar hacia la derecha dentro de un periodo, porque el núcleo suma protones que jalan con más fuerza a electrones que siguen en la misma capa.',
      en:'Some properties do not change at random from one element to another: they change in an orderly way as you travel the table, and that is why they are called periodic. Atomic radius grows going down a group, because each period adds a whole shell between the nucleus and the edge, and it shrinks moving to the right within a period, because the nucleus adds protons that pull harder on electrons that stay in the same shell.'
    }) + '</p>' +
    '<p>' + L({
      es:'La energía de ionización es la que hay que invertir para arrancarle a un átomo su electrón más externo, y hace lo contrario: crece hacia la derecha y disminuye hacia abajo. La electronegatividad, que mide con cuánta fuerza atrae un átomo los electrones que comparte, sigue el mismo sentido. Juntas dan el carácter metálico: hacia la izquierda y hacia abajo los átomos sueltan electrones con facilidad y se comportan como metales; hacia la derecha y hacia arriba los retienen y atraen más, y se comportan como no metales. Sobre la línea escalonada que separa a unos de otros quedan los semimetales, con un comportamiento intermedio.',
      en:'Ionization energy is what has to be invested to pull the outermost electron off an atom, and it does the opposite: it grows to the right and falls downwards. Electronegativity, which measures how strongly an atom attracts the electrons it shares, follows the same direction. Together they give metallic character: to the left and downwards atoms release electrons easily and behave as metals; to the right and upwards they hold on to them and attract more, and behave as nonmetals. On the stair line that separates one from the other sit the metalloids, with intermediate behaviour.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Radio atómico', en:'Atomic radius' }), L({ es:'crece hacia abajo', en:'grows downwards' }), L({ es:'y se encoge hacia la derecha', en:'and shrinks to the right' })) +
      rcard(L({ es:'Energía de ionización', en:'Ionization energy' }), L({ es:'crece hacia la derecha', en:'grows to the right' }), L({ es:'cuesta más arrancar el electrón externo', en:'pulling out the outer electron costs more' })) +
      rcard(L({ es:'Electronegatividad', en:'Electronegativity' }), L({ es:'crece hacia la derecha', en:'grows to the right' }), L({ es:'atrae con más fuerza lo que comparte', en:'attracts what it shares more strongly' })) +
      rcard(L({ es:'Carácter metálico', en:'Metallic character' }), L({ es:'crece hacia la izquierda', en:'grows to the left' }), L({ es:'y hacia abajo dentro de un grupo', en:'and downwards within a group' })) +
    '</div>'
  );
  wTrend(rng, widgetHost(s4, 'wTendencia', 'trend'));
  addProblem(rng, mkP7(rng));
  addProblem(rng, mkP8(rng));
  wReflect(rng, widgetHost(s4, 'wCuaderno', 'reflect'));

  /* ══ CIERRE :: sin explicacion previa (Rule 1) ══ */
  sec(
    L({ es:'Para cerrar', en:'To close' }),
    L({ es:'Tú decides', en:'Your call' }),
    '<p>' + L({
      es:'Un dibujo, dos casillas y todo lo que ya sabes leer en ellas.',
      en:'One drawing, two boxes and everything you already know how to read in them.'
    }) + '</p>'
  );
  addProblem(rng, mkP9(rng));
  addProblem(rng, mkP10(rng));
}
</script>

<!-- LIAXA ANALYTICS -->
<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbz210eFtEC9kduZdp_1O9aPwr3-z0tob2zILE8PxXj-Ms6tT3F9VIgH7mRpKwVluogp/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
</body>
</html>
