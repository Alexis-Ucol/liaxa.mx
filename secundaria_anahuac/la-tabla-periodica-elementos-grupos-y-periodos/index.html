/* ══════════════════════════════════════════════════════════════════════════
   buildLesson :: concepto, manipulativo, problema, alternados (Rule 1)
   ══════════════════════════════════════════════════════════════════════════ */
function buildLesson(rng){
  injectGuideCSS();

  /* ── Apertura ── */
  sec(
    L({ es:'Punto de partida', en:'Starting point' }),
    L({ es:'Una hoja que ordena toda la materia', en:'One sheet that orders all matter' }),
    '<p>' + L({
      es:'Todo lo que puedes tocar, respirar o mirar en el cielo está construido con la misma lista corta de materiales, y esa lista cabe en una sola hoja. Lo asombroso no es que quepa: es que el acomodo de las casillas no es un capricho. La posición de un elemento adelanta cómo se va a comportar antes de hacerle una sola prueba en el laboratorio.',
      en:'Everything you can touch, breathe or look at in the sky is built from the same short list of materials, and that list fits on a single sheet. The astonishing part is not that it fits: it is that the arrangement of the boxes is no whim. The position of an element tells you in advance how it will behave before a single test is run on it in the laboratory.'
    }) + '</p>' +
    '<p>' + L({
      es:'En esta guía vas a recorrer esa hoja como un mapa: localizarás elementos por coordenadas, armarás átomos capa por capa, dibujarás los electrones que quedan más afuera y ordenarás elementos según propiedades que crecen y decrecen siguiendo el mismo patrón.',
      en:'In this guide you are going to travel that sheet like a map: you will locate elements by coordinates, build atoms shell by shell, draw the electrons that sit furthest out and order elements by properties that rise and fall following the same pattern.'
    }) + '</p>' +
    '<div class="gw-lbl">' + L({ es:'Lo que vas a aprender a leer', en:'What you will learn to read' }) + '</div>' +
    '<div>' +
      '<span class="gw-chip">' + L({ es:'número atómico', en:'atomic number' }) + '</span>' +
      '<span class="gw-chip">' + L({ es:'grupos y periodos', en:'groups and periods' }) + '</span>' +
      '<span class="gw-chip">' + L({ es:'metales, no metales y semimetales', en:'metals, nonmetals and metalloids' }) + '</span>' +
      '<span class="gw-chip">' + L({ es:'modelo de Bohr', en:'Bohr model' }) + '</span>' +
      '<span class="gw-chip">' + L({ es:'electrones de valencia', en:'valence electrons' }) + '</span>' +
      '<span class="gw-chip">' + L({ es:'diagramas de Lewis', en:'Lewis diagrams' }) + '</span>' +
      '<span class="gw-chip">' + L({ es:'propiedades periódicas', en:'periodic properties' }) + '</span>' +
    '</div>'
  );

  /* ══ CONCEPTO 1 ══ */
  var s1 = sec(
    L({ es:'Concepto 1', en:'Concept 1' }),
    L({ es:'De qué está hecho el Universo, la Tierra y tú', en:'What the Universe, the Earth and you are made of' }),
    '<p>' + L({
      es:'Si se pesara todo el Universo, alrededor de tres cuartas partes de esa masa serían hidrógeno y casi todo el resto helio; los demás elementos juntos apenas alcanzan una fracción pequeña. La corteza terrestre cuenta otra historia: el oxígeno encabeza con cerca de la mitad de la masa, seguido del silicio y, más atrás, del aluminio y el hierro. Y un ser vivo cuenta una tercera: oxígeno, carbono, hidrógeno y nitrógeno reúnen alrededor del 96% de su masa. El mismo Universo, tres inventarios distintos.',
      en:'If the whole Universe were weighed, about three quarters of that mass would be hydrogen and almost all the rest helium; every other element together barely reaches a small fraction. The Earth crust tells another story: oxygen leads with about half of the mass, followed by silicon and, further back, by aluminium and iron. And a living being tells a third: oxygen, carbon, hydrogen and nitrogen hold around 96% of its mass. The same Universe, three different inventories.'
    }) + '</p>' +
    '<p>' + L({
      es:'Al llevar esos nombres a la Tabla periódica aparece un patrón. Los metales ocupan casi toda la parte izquierda y central: brillan, conducen el calor y la electricidad y se deforman sin romperse. Los no metales se agrupan en el extremo superior derecho: opacos, malos conductores y frágiles cuando son sólidos. Entre unos y otros corre una línea escalonada, y justo sobre ella se acomodan los semimetales, que conducen poco y además conducen mejor al calentarse. Las columnas de la tabla se llaman grupos y las filas, periodos: por ahora te sirven como coordenadas para localizar cualquier casilla.',
      en:'When those names are taken to the Periodic table a pattern appears. Metals occupy almost the whole left and central part: they shine, conduct heat and electricity and deform without breaking. Nonmetals gather in the upper right corner: dull, poor conductors and brittle when solid. A stair line runs between them, and right on it sit the metalloids, which conduct poorly and also conduct better when heated. The columns of the table are called groups and the rows periods: for now they serve you as coordinates to locate any box.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Metales', en:'Metals' }), L({ es:'izquierda y centro', en:'left and centre' }), L({ es:'brillo, conducen, se deforman sin romperse', en:'shine, conduct, deform without breaking' })) +
      rcard(L({ es:'No metales', en:'Nonmetals' }), L({ es:'extremo superior derecho', en:'upper right corner' }), L({ es:'opacos, aislantes, frágiles si son sólidos', en:'dull, insulating, brittle when solid' })) +
      rcard(L({ es:'Semimetales', en:'Metalloids' }), L({ es:'sobre la línea escalonada', en:'on the stair line' }), L({ es:'conducen poco, y mejor al calentarse', en:'conduct poorly, and better when heated' })) +
      rcard(L({ es:'Coordenadas', en:'Coordinates' }), L({ es:'grupo y periodo', en:'group and period' }), L({ es:'la columna y la fila de cada casilla', en:'the column and the row of each box' })) +
    '</div>' +
    '<div class="callout"><p><strong>' + L({ es:'Ojo: ', en:'Careful: ' }) + '</strong>' + L({
      es:'el elemento más abundante cambia según dónde mires. Hidrógeno en el Universo, oxígeno en la corteza terrestre y también oxígeno en tu cuerpo, aunque allí el carbono ocupa un lugar que en la roca no tiene.',
      en:'the most abundant element changes depending on where you look. Hydrogen in the Universe, oxygen in the Earth crust and oxygen in your body too, although there carbon takes a place it does not have in rock.'
    }) + '</p></div>'
  );
  wTable(rng, widgetHost(s1, 'wTabla', 'table'));
  addProblem(rng, mkP1(rng));
  addProblem(rng, mkP2(rng));

  /* ══ CONCEPTO 2 ══ */
  var s2 = sec(
    L({ es:'Concepto 2', en:'Concept 2' }),
    L({ es:'El número atómico manda y las capas se llenan por turnos', en:'The atomic number rules and the shells fill in turn' }),
    '<p>' + L({
      es:'Cada casilla lleva un número entero que no se repite en ninguna otra: el número atómico. Ese número dice cuántos protones hay en el núcleo y, en un átomo neutro, dice también cuántos electrones giran alrededor. La tabla está ordenada de menor a mayor número atómico, casilla tras casilla, y no por masa ni por orden de descubrimiento. El número de masa es otra cosa: cuenta protones y neutrones juntos, así que la cantidad de neutrones se obtiene restando el número atómico al número de masa.',
      en:'Every box carries a whole number that is repeated in no other: the atomic number. That number says how many protons are in the nucleus and, in a neutral atom, it also says how many electrons orbit around it. The table is ordered from lowest to highest atomic number, box after box, and not by mass or by order of discovery. The mass number is another thing: it counts protons and neutrons together, so the neutron count is obtained by subtracting the atomic number from the mass number.'
    }) + '</p>' +
    '<p>' + L({
      es:'El modelo de Bohr coloca esos electrones en capas alrededor del núcleo, y las capas se llenan por turnos: la primera admite 2 electrones, la segunda 8 y, para los primeros veinte elementos, la tercera se completa con 8 antes de que empiece la cuarta, que recibe los últimos 1 o 2. De ese reparto salen las dos coordenadas de la tabla: el número de capas ocupadas es el periodo, y para los elementos representativos lo que queda en la capa más externa marca el grupo.',
      en:'The Bohr model places those electrons in shells around the nucleus, and the shells fill in turn: the first takes 2 electrons, the second 8 and, for the first twenty elements, the third is completed with 8 before the fourth begins, which receives the last 1 or 2. The two coordinates of the table come out of that split: the number of occupied shells is the period, and for representative elements what is left in the outermost shell marks the group.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Número atómico', en:'Atomic number' }), L({ es:'protones', en:'protons' }), L({ es:'en un átomo neutro, también electrones', en:'in a neutral atom, electrons too' })) +
      rcard(L({ es:'Neutrones', en:'Neutrons' }), L({ es:'masa menos número atómico', en:'mass minus atomic number' }), L({ es:'nunca se leen directamente de la casilla', en:'never read straight off the box' })) +
      rcard(L({ es:'Capacidad de capas', en:'Shell capacity' }), L({ es:'2, 8, 8, 2', en:'2, 8, 8, 2' }), L({ es:'orden de llenado de los primeros veinte', en:'filling order of the first twenty' })) +
      rcard(L({ es:'Periodo', en:'Period' }), L({ es:'capas ocupadas', en:'occupied shells' }), L({ es:'la fila en la que cae la casilla', en:'the row the box falls in' })) +
    '</div>' +
    '<div class="callout"><p>' + L({
      es:'Dos átomos del mismo elemento pueden tener distinto número de neutrones y seguir siendo el mismo elemento. Lo que no cambia nunca es el número de protones: por eso ese es el número que ordena la tabla.',
      en:'Two atoms of the same element can have a different number of neutrons and still be the same element. What never changes is the number of protons: that is why that is the number that orders the table.'
    }) + '</p></div>'
  );
  wBohr(rng, widgetHost(s2, 'wBohr', 'bohr'));
  addProblem(rng, mkP3(rng));
  addProblem(rng, mkP4(rng));

  /* ══ CONCEPTO 3 ══ */
  var s3 = sec(
    L({ es:'Concepto 3', en:'Concept 3' }),
    L({ es:'Los electrones de la orilla y el dibujo que los muestra', en:'The electrons on the edge and the drawing that shows them' }),
    '<p>' + L({
      es:'De todos los electrones de un átomo, los que deciden su química son los de la capa más externa: los electrones de valencia. Los de adentro quedan cubiertos por las capas que tienen encima y casi no participan. Por eso dos elementos de columnas distintas se comportan distinto aunque tengan tamaños parecidos, y por eso dos elementos de una misma columna se parecen tanto aunque uno sea mucho más pesado que el otro.',
      en:'Of all the electrons of an atom, the ones that decide its chemistry are those of the outermost shell: the valence electrons. The inner ones are covered by the shells above them and hardly take part. That is why two elements from different columns behave differently even when their sizes are similar, and why two elements from one same column resemble each other so much even when one is far heavier than the other.'
    }) + '</p>' +
    '<p>' + L({
      es:'El diagrama de Lewis pone eso por escrito con lo mínimo: se escribe el símbolo del elemento y se lo rodea de tantos puntos como electrones de valencia tenga, repartidos en los cuatro lados y emparejándolos solo cuando ya no queda lado libre. Para los elementos representativos el número de puntos se lee directamente del grupo: en los grupos 1 y 2 es el número del grupo, y del grupo 13 en adelante es el número del grupo menos diez. Con ocho puntos alrededor el átomo ya tiene la capa externa completa, como un gas noble, y casi no reacciona; con uno o dos le sale más barato soltarlos que conseguir los seis o siete que le faltan.',
      en:'The Lewis diagram puts that down with the bare minimum: the symbol of the element is written and surrounded by as many dots as it has valence electrons, spread over the four sides and paired only when no free side is left. For representative elements the number of dots is read straight off the group: in groups 1 and 2 it is the group number, and from group 13 onwards it is the group number minus ten. With eight dots around it the atom already has a complete outer shell, like a noble gas, and hardly reacts; with one or two it is cheaper for it to release them than to get the six or seven it is missing.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Electrones de valencia', en:'Valence electrons' }), L({ es:'capa más externa', en:'outermost shell' }), L({ es:'son los que reaccionan', en:'they are the ones that react' })) +
      rcard(L({ es:'Grupos 1 y 2', en:'Groups 1 and 2' }), L({ es:'1 o 2 puntos', en:'1 or 2 dots' }), L({ es:'les conviene cederlos', en:'giving them up suits them' })) +
      rcard(L({ es:'Grupos 13 en adelante', en:'Groups 13 onwards' }), L({ es:'grupo menos diez', en:'group minus ten' }), L({ es:'de 3 a 8 puntos alrededor del símbolo', en:'from 3 to 8 dots around the symbol' })) +
      rcard(L({ es:'Ocho puntos', en:'Eight dots' }), L({ es:'capa completa', en:'complete shell' }), L({ es:'gases nobles, casi sin reaccionar', en:'noble gases, hardly reacting' })) +
    '</div>'
  );
  wLewis(rng, widgetHost(s3, 'wLewis', 'lewis'));
  addProblem(rng, mkP5(rng));
  addProblem(rng, mkP6(rng));

  /* ══ CONCEPTO 4 ══ */
  var s4 = sec(
    L({ es:'Concepto 4', en:'Concept 4' }),
    L({ es:'Propiedades que suben y bajan siguiendo el mapa', en:'Properties that rise and fall along the map' }),
    '<p>' + L({
      es:'Algunas propiedades de los elementos no cambian al azar: cambian de manera ordenada al recorrer la tabla, y por eso se llaman propiedades periódicas. El radio atómico crece al bajar por un grupo, porque cada periodo agrega una capa entera entre el núcleo y los electrones externos, y disminuye al avanzar hacia la derecha dentro de un periodo, porque el núcleo suma protones que jalan con más fuerza a unos electrones que siguen en la misma capa.',
      en:'Some properties of the elements do not change at random: they change in an orderly way as you travel the table, and that is why they are called periodic properties. Atomic radius grows going down a group, because each period adds a whole shell between the nucleus and the outer electrons, and it decreases moving to the right within a period, because the nucleus gains protons that pull harder on electrons that stay in the same shell.'
    }) + '</p>' +
    '<p>' + L({
      es:'La energía de ionización, que es la energía necesaria para arrancarle a un átomo su electrón más externo, hace lo contrario: crece hacia la derecha y disminuye hacia abajo. La electronegatividad, que mide cuánto atrae un átomo a los electrones que comparte, sigue el mismo sentido. Juntas explican el carácter metálico: hacia la izquierda y hacia abajo los átomos sueltan electrones con facilidad y se comportan como metales; hacia la derecha y hacia arriba los retienen y los atraen, y se comportan como no metales. Los gases nobles quedan fuera de esa competencia porque ya tienen la capa externa completa. Por eso, con solo ubicar dos casillas, se puede anticipar cuál cede y cuál gana electrones al encontrarse.',
      en:'Ionization energy, which is the energy needed to pull the outermost electron off an atom, does the opposite: it grows to the right and decreases downwards. Electronegativity, which measures how strongly an atom attracts the electrons it shares, follows the same direction. Together they explain metallic character: to the left and downwards atoms release electrons easily and behave as metals; to the right and upwards they hold on to them and attract more, and behave as nonmetals. Noble gases stay out of that contest because their outer shell is already complete. That is why locating two boxes is enough to anticipate which one gives up and which one gains electrons when they meet.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Radio atómico', en:'Atomic radius' }), L({ es:'crece hacia abajo', en:'grows downwards' }), L({ es:'y disminuye hacia la derecha', en:'and decreases to the right' })) +
      rcard(L({ es:'Energía de ionización', en:'Ionization energy' }), L({ es:'crece hacia la derecha', en:'grows to the right' }), L({ es:'cuesta más arrancar el electrón externo', en:'pulling out the outer electron costs more' })) +
      rcard(L({ es:'Electronegatividad', en:'Electronegativity' }), L({ es:'crece hacia la derecha', en:'grows to the right' }), L({ es:'atrae con más fuerza lo que comparte', en:'attracts what it shares more strongly' })) +
      rcard(L({ es:'Carácter metálico', en:'Metallic character' }), L({ es:'crece hacia la izquierda', en:'grows to the left' }), L({ es:'y hacia abajo dentro de un grupo', en:'and downwards within a group' })) +
    '</div>'
  );
  wTrend(rng, widgetHost(s4, 'wTendencia', 'trend'));
  addProblem(rng, mkP7(rng));
  addProblem(rng, mkP8(rng));
  wReflect(rng, widgetHost(s4, 'wCuaderno', 'reflect'));

  /* ══ CIERRE :: sin explicacion previa (Rule 1) ══ */
  sec(
    L({ es:'Para cerrar', en:'To close' }),
    L({ es:'Tú decides', en:'Your call' }),
    '<p>' + L({
      es:'Dos casillas y todo lo que ya sabes leer en ellas.',
      en:'Two boxes and everything you already know how to read in them.'
    }) + '</p>'
  );
  addProblem(rng, mkP9(rng));
  addProblem(rng, mkP10(rng));
}
</script>

<!-- LIAXA ANALYTICS -->
<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbwoSl0opNALX7IT8O9tk7xZoPU9LbrYvZ-n_p9u3R-pUlwi-rVTTfnYRaiKngnsY1QV/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
