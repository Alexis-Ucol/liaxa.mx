/* ══════════════════════════════════════════════════════════════════════════
   LECCIÓN :: concepto, manipulativo y problemas, intercalados (Rule 1)
   ══════════════════════════════════════════════════════════════════════════ */
function buildLesson(rng){
  injectGuideCSS();

  /* ── Apertura ── */
  sec(
    L({ es:'Punto de partida', en:'Starting point' }),
    L({ es:'Dos bebés que nacen el mismo día', en:'Two babies born on the same day' }),
    '<p>' + L({
      es:'Hoy nacen dos bebés a la misma hora. Uno abrirá la llave y tendrá agua; irá a una escuela con biblioteca y, si se enferma, habrá una clínica a diez minutos. El otro caminará por agua, estudiará en una escuela sin luz estable y la clínica más cercana quedará a dos horas de camino. Ninguno eligió dónde nacer, y sin embargo esa diferencia va a marcar cuántos años vive, cuánto estudia y cuánto dinero tendrá. Eso es una desigualdad socioeconómica, y no se explica con un solo dato.',
      en:'Two babies are born today at the same hour. One will turn the tap and have water; will go to a school with a library and, if they fall ill, there will be a clinic ten minutes away. The other will walk for water, will study in a school without steady power and the nearest clinic will be two hours away. Neither chose where to be born, and yet that difference will shape how many years they live, how much they study and how much money they will have. That is a socioeconomic inequality, and it cannot be explained with a single figure.'
    }) + '</p>' +
    '<p>' + L({
      es:'Para poder comparar lugares sin quedarse solo en el dinero se construyó el Índice de Desarrollo Humano, que se abrevia IDH. Es un número entre 0 y 1 que resume tres cosas a la vez, y en esta guía vas a aprender a leerlo, a discutirlo y a usarlo para señalar dónde hace falta actuar.',
      en:'In order to compare places without stopping at money alone, the Human Development Index was built, abbreviated HDI. It is a number between 0 and 1 that sums up three things at once, and in this guide you are going to learn to read it, to discuss it and to use it to point out where action is needed.'
    }) + '</p>' +
    '<div class="callout"><p><strong>' + L({ es:'Lo que vas a hacer: ', en:'What you are going to do: ' }) + '</strong>' + L({
      es:'vas a mover el ingreso de dos colonias hasta descubrir qué esconde un promedio, a repartir datos entre las tres dimensiones del IDH, a recorrer la escala de 0 a 1 con un marcador para encontrar dónde empieza cada grupo, a ordenar cinco territorios del más bajo al más alto y a proponer una acción para tu propia comunidad.',
      en:'you are going to move the income of two neighbourhoods until you discover what an average hides, sort figures among the three dimensions of the HDI, run a marker along the 0 to 1 scale to find where each group starts, order five territories from lowest to highest and propose one action for your own community.'
    }) + '</p></div>'
  );

  /* ══ CONCEPTO 1 ══ */
  var s1 = sec(
    L({ es:'Concepto 1', en:'Concept 1' }),
    L({ es:'La desigualdad no es lo mismo que la pobreza', en:'Inequality is not the same as poverty' }),
    '<p>' + L({
      es:'Una desigualdad socioeconómica es una diferencia sostenida entre personas o grupos en aquello que decide cómo se vive: el ingreso que entra a la casa, los servicios que llegan hasta la puerta, la escuela a la que se puede asistir, la atención médica disponible y el tipo de trabajo al que se tiene acceso. La pobreza dice cuánto le falta a alguien; la desigualdad dice qué tan lejos están unos de otros. Un lugar puede volverse más rico y al mismo tiempo más desigual, si lo que crece se queda en pocas manos.',
      en:'A socioeconomic inequality is a sustained difference between people or groups in what decides how life is lived: the income that comes into the home, the services that reach the door, the school one can attend, the medical care available and the kind of work one has access to. Poverty says how much someone lacks; inequality says how far apart people are from one another. A place can become richer and more unequal at the same time, if what grows stays in few hands.'
    }) + '</p>' +
    '<p>' + L({
      es:'Esas diferencias no se quedan quietas ni se reparten al azar: se acumulan. Quien vive en la zona sin drenaje se enferma más, falta más a la escuela, avanza menos y termina con menos opciones de trabajo, y sus hijas e hijos arrancan desde ahí. Por eso conviene desconfiar de las cifras que resumen a todo un lugar en un solo número: un promedio puede verse bien y esconder adentro dos realidades muy separadas.',
      en:'Those differences do not stay still or spread out at random: they pile up. Whoever lives in the area without drainage falls ill more often, misses more school, advances less and ends up with fewer job options, and their children start from there. That is why it pays to be suspicious of figures that sum a whole place up in a single number: an average can look fine and hide two very separate realities inside.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Ingreso', en:'Income' }), L({ es:'cuánto entra al mes', en:'how much comes in a month' }), L({ es:'decide qué se puede pagar y qué no', en:'decides what can be paid for and what cannot' })) +
      rcard(L({ es:'Servicios', en:'Services' }), L({ es:'agua, drenaje, luz', en:'water, drainage, power' }), L({ es:'lo que no llega se paga aparte', en:'whatever does not arrive is paid for separately' })) +
      rcard(L({ es:'Educación', en:'Education' }), L({ es:'años y condiciones', en:'years and conditions' }), L({ es:'abre o cierra oportunidades futuras', en:'opens or closes future opportunities' })) +
      rcard(L({ es:'Salud', en:'Health' }), L({ es:'atención disponible', en:'care available' }), L({ es:'se refleja en cuántos años se vive', en:'shows up in how many years people live' })) +
    '</div>'
  );
  wGap(rng, widgetHost(s1, 'w_brecha', 'gap'));
  addProblem(rng, mkP1(rng));
  addProblem(rng, mkP2(rng));

  /* ══ CONCEPTO 2 ══ */
  var s2 = sec(
    L({ es:'Concepto 2', en:'Concept 2' }),
    L({ es:'Las tres dimensiones que forman el IDH', en:'The three dimensions that form the HDI' }),
    '<p>' + L({
      es:'Durante mucho tiempo los países se compararon solo por el dinero que producían. El problema es evidente: dos países pueden producir lo mismo por habitante y en uno la gente vivir veinte años más. Por eso el IDH se construye con tres dimensiones que se miden por separado y después se combinan en un solo valor.',
      en:'For a long time countries were compared only by the money they produced. The problem is plain: two countries can produce the same per person and in one of them people live twenty years longer. That is why the HDI is built from three dimensions that are measured separately and then combined into a single value.'
    }) + '</p>' +
    '<p>' + L({
      es:'La primera es una vida larga y saludable, y se mide con la esperanza de vida al nacer, es decir, cuántos años vive en promedio quien nace ahí. La segunda es el acceso al conocimiento, y se mide con dos datos de escuela: los años que ya cursó la población adulta y los años que se esperan para quien apenas entra. La tercera es un nivel de vida digno, y se mide con el ingreso nacional bruto por habitante. Ninguna de las tres manda sobre las otras: una dimensión floja jala el resultado hacia abajo aunque las demás vayan bien.',
      en:'The first is a long and healthy life, measured with life expectancy at birth, that is, how many years someone born there lives on average. The second is access to knowledge, measured with two school figures: the years the adult population has already completed and the years expected for someone just starting. The third is a decent standard of living, measured with gross national income per person. None of the three rules over the others: a weak dimension pulls the result down even when the rest are doing well.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Vida larga y saludable', en:'Long and healthy life' }), L({ es:'esperanza de vida al nacer', en:'life expectancy at birth' }), L({ es:'cuántos años vive en promedio la población', en:'how many years the population lives on average' })) +
      rcard(L({ es:'Acceso al conocimiento', en:'Access to knowledge' }), L({ es:'años de escolaridad', en:'years of schooling' }), L({ es:'los ya cursados y los esperados', en:'those already completed and those expected' })) +
      rcard(L({ es:'Nivel de vida digno', en:'Decent standard of living' }), L({ es:'ingreso por habitante', en:'income per person' }), L({ es:'cuánto ingreso hay disponible por persona', en:'how much income is available per person' })) +
      rcard(L({ es:'Resultado', en:'Result' }), L({ es:'un valor de 0 a 1', en:'a value from 0 to 1' }), L({ es:'las tres dimensiones pesan juntas', en:'the three dimensions weigh in together' })) +
    '</div>'
  );
  wSort(rng, widgetHost(s2, 'w_dimensiones', 'classify'));
  addProblem(rng, mkP3(rng));
  addProblem(rng, mkP4(rng));

  /* ══ CONCEPTO 3 ══ */
  var s3 = sec(
    L({ es:'Concepto 3', en:'Concept 3' }),
    L({ es:'Leer la escala: de 0 a 1 y cuatro grupos', en:'Reading the scale: from 0 to 1 and four groups' }),
    '<p>' + L({
      es:'El IDH siempre cae entre 0 y 1, y cuanto más se acerca a 1, mejor le va a esa población en las tres dimensiones juntas. Como un número suelto dice poco, los valores se agrupan en cuatro tramos: desarrollo humano bajo cuando el valor es menor que 0.550, medio de 0.550 a 0.699, alto de 0.700 a 0.799 y muy alto de 0.800 en adelante. México se ubica desde hace años en el grupo de desarrollo humano alto.',
      en:'The HDI always falls between 0 and 1, and the closer it gets to 1, the better that population is doing across the three dimensions together. Since a loose number says little, values are grouped into four stretches: low human development when the value is below 0.550, medium from 0.550 to 0.699, high from 0.700 to 0.799 and very high from 0.800 upwards. Mexico has been in the high human development group for years.'
    }) + '</p>' +
    '<p>' + L({
      es:'Al comparar hay que leer los decimales con cuidado, porque el número avanza despacio. Subir de 0.690 a 0.705 parece poco, pero cruza una frontera y cambia el grupo al que pertenece ese lugar. Y hay que resistir una tentación: un IDH del doble no significa el doble de bienestar, porque la escala no funciona así. Sirve para ordenar y comparar, no para multiplicar.',
      en:'When comparing you have to read the decimals carefully, because the number moves slowly. Going from 0.690 to 0.705 looks like little, but it crosses a border and changes the group that place belongs to. And one temptation has to be resisted: an HDI twice as large does not mean twice the wellbeing, because the scale does not work that way. It serves to order and compare, not to multiply.'
    }) + '</p>'
  );
  wScale(rng, widgetHost(s3, 'w_termometro', 'scale'));
  addProblem(rng, mkP5(rng));
  addProblem(rng, mkP6(rng));

  /* ══ CONCEPTO 4 ══ */
  var s4 = sec(
    L({ es:'Concepto 4', en:'Concept 4' }),
    L({ es:'Un promedio nacional esconde muchos países adentro', en:'A national average hides many countries inside' }),
    '<p>' + L({
      es:'El IDH se publica por país, y así permite ver de un vistazo que el mundo está repartido de forma muy despareja: hay países en los que se vive más de ochenta años y se estudian más de doce, y otros donde ninguna de las dos cosas ocurre. Pero el mismo índice se puede calcular a otras escalas, y ahí aparece lo interesante.',
      en:'The HDI is published by country, and so it lets you see at a glance that the world is shared out very unevenly: there are countries where people live more than eighty years and study more than twelve, and others where neither of those things happens. But the same index can be worked out at other scales, and that is where things get interesting.'
    }) + '</p>' +
    '<p>' + L({
      es:'Cuando el IDH de México se desagrega por entidad, el valor nacional se abre en un abanico: entidades del norte y del centro registran los valores más altos del país y varias del sur los más bajos, con una distancia que se parece a la que hay entre países distintos. Si se baja todavía más, hasta el nivel de municipios o de colonias, la distancia crece otra vez. Por eso el número nacional sirve para comparar hacia afuera, pero para decidir dónde actuar hay que mirar hacia adentro.',
      en:'When the HDI of Mexico is broken down by state, the national value fans out: northern and central states record the highest values in the country and several southern ones the lowest, with a distance resembling the one between different countries. Going down further still, to municipalities or neighbourhoods, the distance grows again. That is why the national number is useful for comparing outwards, but to decide where to act you have to look inwards.'
    }) + '</p>'
  );
  wStairs(rng, widgetHost(s4, 'w_escalera', 'order'));
  addProblem(rng, mkP7(rng));
  addProblem(rng, mkP8(rng));

  /* ══ CONCEPTO 5 ══ */
  var s5 = sec(
    L({ es:'Concepto 5', en:'Concept 5' }),
    L({ es:'Lo que el IDH deja fuera y lo que sí se puede hacer', en:'What the HDI leaves out and what can actually be done' }),
    '<p>' + L({
      es:'El IDH resume mucho, pero no todo. No dice si la gente se siente segura al salir de casa, cuánto tiempo libre le queda después de trabajar, si el aire de su ciudad es respirable ni qué tan satisfecha está con su vida. Para completar ese retrato existe el Índice para una vida mejor, que suma dimensiones como la vivienda, el empleo, la comunidad, el medio ambiente, la seguridad y la satisfacción personal. Los dos instrumentos se usan juntos: uno mide las bases y el otro pregunta cómo se vive sobre ellas.',
      en:'The HDI sums up a great deal, but not everything. It does not say whether people feel safe leaving home, how much free time is left after work, whether the air in their city is breathable or how satisfied they are with their lives. To complete that portrait there is the Better Life Index, which adds dimensions such as housing, jobs, community, the environment, safety and personal satisfaction. The two instruments are used together: one measures the foundations and the other asks how life is lived on top of them.'
    }) + '</p>' +
    '<p>' + L({
      es:'Con esa lectura en la mano se puede pasar de describir a proponer. Las acciones que de verdad reducen desigualdades son las que tocan las causas y sostienen el esfuerzo en el tiempo: llevar servicios a las zonas que no los tienen, garantizar que todas y todos terminen sus estudios, mejorar la atención médica donde falta y crear empleos con salarios justos. Las que solo alivian el efecto por un rato ayudan, pero al año siguiente la brecha sigue ahí.',
      en:'With that reading in hand you can move from describing to proposing. The actions that really reduce inequalities are the ones that touch the causes and keep the effort going over time: bringing services to the areas that do not have them, making sure everyone finishes their studies, improving medical care where it is lacking and creating jobs with fair wages. The ones that only relieve the effect for a while do help, but the following year the gap is still there.'
    }) + '</p>'
  );

<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbykkuJ_apGq3vALIFd4mr3acu81c7K4OKxW-DZ-i52Ceyl3lOanXMdvbS9SIXPrLQBm/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'IDH y Desigualdades Socioeconómicas Globales';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
