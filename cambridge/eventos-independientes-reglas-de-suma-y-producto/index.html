<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eventos Independientes: Reglas de Suma y Producto</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--gold-bg); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }

/* ── INTERACTIVE WIDGETS ── */
.iwrap { background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--gold); border-radius:12px; padding:1.1rem 1.1rem 1.2rem; }
.iw-tag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:700; margin-bottom:.4rem; }
.iw-goal { font-size:.92rem; color:var(--text); font-weight:600; margin-bottom:.5rem; }
.iw-sub { font-size:.79rem; color:var(--text3); margin-bottom:.75rem; }
.iw-ctrl { display:flex; align-items:center; gap:.6rem; margin:.8rem 0 .5rem; }
.iw-ctrl input[type=range] { flex:1; accent-color:var(--green); min-height:34px; }
.iw-lbl { font-family:'IBM Plex Mono',monospace; font-size:.72rem; color:var(--text3); flex-shrink:0; }
.iw-read { font-family:'IBM Plex Mono',monospace; font-size:.78rem; color:var(--green-dark); background:var(--green-bg); border-radius:8px; padding:.5rem .7rem; text-align:center; }
.iw-prog { font-family:'IBM Plex Mono',monospace; font-size:.72rem; color:var(--text3); text-align:right; }
.iw-bar { display:flex; height:20px; border-radius:8px; overflow:hidden; border:1.5px solid var(--border); margin-top:.55rem; background:var(--surface2); }
.iw-bar-a { background:var(--green); transition:width .22s; }
.iw-bar-b { background:var(--gold); transition:width .22s; }
.iw-legend { display:flex; gap:1rem; justify-content:center; font-size:.7rem; color:var(--text3); margin-top:.3rem; flex-wrap:wrap; }
.iw-key { display:inline-block; width:11px; height:11px; border-radius:3px; vertical-align:-1px; margin-right:.3rem; }
.iw-key.ka { background:var(--green); }
.iw-key.kb { background:var(--gold); }
.rverify-btn { margin-top:.85rem; min-height:44px; padding:.55rem 1.25rem; border:none; border-radius:9px; background:var(--green); color:#fff; font-size:.86rem; font-weight:600; cursor:pointer; font-family:inherit; }
.rverify-btn:hover { background:var(--green-dark); }
.rfb { min-height:1.35rem; margin-top:.6rem; font-size:.85rem; color:var(--text2); }
.cls-card { display:block; text-align:center; font-weight:600; font-size:.92rem; color:var(--text); background:var(--surface2); border:1.5px solid var(--border); border-radius:10px; padding:.9rem .7rem; margin:.6rem 0; }
.cls-bins { display:flex; flex-wrap:wrap; gap:.5rem; }
.cls-bin { flex:1 1 130px; min-height:44px; border:1.5px solid var(--border); border-radius:9px; background:var(--surface2); color:var(--text); font-family:inherit; font-size:.82rem; font-weight:600; cursor:pointer; padding:.5rem .7rem; }
.cls-bin:hover { border-color:var(--green); color:var(--green); }
.cls-done { font-weight:700; color:var(--ok); text-align:center; padding:.7rem; font-size:1rem; }
.rj-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:3px; margin:.7rem 0 .2rem; }
.rj-cell { min-height:34px; border:1.5px solid var(--border); border-radius:6px; background:var(--surface2); color:var(--text3); font-family:'IBM Plex Mono',monospace; font-size:.74rem; display:flex; align-items:center; justify-content:center; padding:0; }
.rj-head { cursor:pointer; font-weight:700; color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.82rem; }
.rj-head:hover { border-color:var(--green); }
.rj-head.on { border-color:var(--green); background:var(--green-bg); color:var(--green-dark); }
.rj-cell.hit { border-color:var(--gold); background:var(--gold-bg); color:var(--text); }
.rj-corner { border:1.5px solid transparent; background:none; }
.br-list { display:flex; flex-direction:column; gap:.5rem; margin:.7rem 0; }
.br-leaf { display:flex; align-items:center; justify-content:space-between; gap:.6rem; border:1.5px solid var(--border); border-radius:10px; background:var(--surface2); padding:.55rem .75rem; cursor:pointer; min-height:48px; font-size:.83rem; color:var(--text); font-family:inherit; text-align:left; width:100%; }
.br-leaf:hover { border-color:var(--green); }
.br-leaf.on { border-color:var(--green); background:var(--green-bg); }
.br-path { display:flex; align-items:center; gap:.35rem; flex-wrap:wrap; }
.br-step { border:1px solid var(--border); border-radius:20px; padding:.1rem .55rem; font-size:.75rem; background:var(--surface); }
.br-val { font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); flex-shrink:0; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Eventos Independientes: Reglas de Suma y Producto</div>
    <div class="wcourse" id="wcourse-el">Matemáticas · 3° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>

/* ── Attempt counter + seed (Rule 4): seed = name+group+attempt ── */
function getAttemptKey(name, group){ return 'mat3_t08_g02__att__' + (name+'__'+group).replace(/\s+/g,'_'); }
function nextAttempt(name, group){ var k=getAttemptKey(name,group),n=0; try{n=parseInt(localStorage.getItem(k)||'0',10)||0;}catch(e){} n++; try{localStorage.setItem(k,String(n));}catch(e){} return n; }
function currentAttempt(name, group){ var k=getAttemptKey(name,group); try{return parseInt(localStorage.getItem(k)||'1',10)||1;}catch(e){return 1;} }

var studentData   = {};
var problems      = [];

/* ================================================
   SESSION PERSISTENCE  (localStorage)
   ================================================ */
function lsKey() {
  var n = (studentData.name  || '').trim();
  var g = (studentData.group || '').trim();
  return 'mat3_t08_g02__' + (n + '__' + g).replace(/\s+/g, '_');
}

function saveSession() {
  if (!studentData.name) return;
  var drawings = [], texts = [], photos = [];
  problems.forEach(function(p, i) {
    var dc = document.getElementById('dc' + i);
    if (dc && dc.width) {
      var blank = document.createElement('canvas');
      blank.width = dc.width; blank.height = dc.height;
      drawings.push(dc.toDataURL() === blank.toDataURL() ? null : dc.toDataURL('image/png'));
    } else { drawings.push(null); }
    var ta = document.getElementById('ta' + i);
    texts.push(ta ? ta.value : '');
    var pp = document.getElementById('pp' + i);
    photos.push((pp && pp.src && pp.src.indexOf('data:') === 0) ? pp.src : null);
  });
  var state = {
    name: studentData.name, group: studentData.group,
    answeredCount: answeredCount, correctCount: correctCount,
    choices: problems.map(function(p) { return p.studentChoice; }),
    drawings: drawings, texts: texts, photos: photos
  };
  try { localStorage.setItem(lsKey(), JSON.stringify(state)); } catch(e) {}
}

function loadSession(name, group) {
  var key = 'mat3_t08_g02__' + (name + '__' + group).replace(/\s+/g, '_');
  try { var r = localStorage.getItem(key); return r ? JSON.parse(r) : null; } catch(e) { return null; }
}

function restoreSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  var saved = loadSession(name, group);
  if (!saved) return;
  document.getElementById('restoreBar').style.display = 'none';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = currentAttempt(name, group);
  buildLesson(seededRng(name + group + att));
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
  saved.choices.forEach(function(choice, idx) {
    if (choice !== null && choice !== undefined) confirmMC(idx, choice);
  });
  setTimeout(function() {
    if (saved.drawings) {
      saved.drawings.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var dc = document.getElementById('dc' + i);
        if (!dc || !dc.width) return;
        var img = new Image();
        img.onload = function() {
          var dpr = window.devicePixelRatio || 1;
          dc.getContext('2d').drawImage(img, 0, 0, dc.width / dpr, dc.height / dpr);
        };
        img.src = dataUrl;
      });
    }
    if (saved.texts) {
      saved.texts.forEach(function(text, i) {
        if (!text) return;
        var ta = document.getElementById('ta' + i);
        if (ta) ta.value = text;
      });
    }
    if (saved.photos) {
      saved.photos.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var pp = document.getElementById('pp' + i);
        if (!pp) return;
        pp.src = dataUrl; pp.style.display = 'block';
        var pz = document.getElementById('pz' + i);
        if (pz) pz.style.opacity = '0.4';
      });
    }
  }, 300);
}

function dismissRestore() {
  document.getElementById('restoreBar').style.display = 'none';
}

function checkForSavedSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  if (!name || !group) { document.getElementById('restoreBar').style.display = 'none'; return; }
  var saved = loadSession(name, group);
  var bar = document.getElementById('restoreBar');
  bar.style.display = (saved && saved.choices && saved.choices.some(function(c){ return c !== null; })) ? 'block' : 'none';
}

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

async function generatePDF() {
  var btn = document.getElementById('dlBtn');
  btn.textContent = (LANG==='es'?'Generando PDF…':'Generating PDF…');
  btn.disabled = true;

  var jspdf   = window.jspdf;
  var doc     = new jspdf.jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });
  var PW      = 215.9;
  var M       = 18;
  var TW      = PW - M * 2;
  var PH      = doc.internal.pageSize.height;
  var name    = studentData.name;
  var group   = studentData.group;
  var total   = problems.length;
  var pct     = Math.round(correctCount / total * 100);
  var dateStr = new Date().toLocaleString(LANG==='es'?'es-MX':'en-US', { dateStyle:'long', timeStyle:'short' });

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS — INJECTION BLOCK ─────────────────────────────────────────
  //   Match these RGB values to --green and --gold above.
  //   PRIMARY  → pBR, pBG, pBB
  //   ACCENT   → pAR, pAG, pAB
  // ──────────────────────────────────────────────────────────────────────────
  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;  // PRIMARY (from SCHOOL, Rule 16)
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;   // ACCENT (from SCHOOL, Rule 16)

  function pdfText(html) {
    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/\u2192/g,'->').replace(/\u2212/g,'-').replace(/\u00b2/g,'^2')
      .replace(/\u00b3/g,'^3').replace(/\u00d7/g,'x').replace(/\u00f7/g,'/')
      .replace(/\u2260/g,'!=').replace(/\u2264/g,'<=').replace(/\u2265/g,'>=')
      .replace(/\u221a/g,'sqrt').replace(/\u03c0/g,'pi').replace(/\u2026/g,'...')
      .replace(/\s+/g,' ').trim();
  }

  // ── PORTADA: orange line / white logo strip / orange line / blue band ──
  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,2,'F');   // top accent line
  doc.setFillColor(255,255,255); doc.rect(0,2,PW,26,'F');                               // white logo strip
  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,28,PW,2,'F');  // bottom accent line

  }

  var lx = PW - M - 36;
  var ly = 10;

  doc.setFillColor(pAR,pAG,pAB); doc.circle(lx+5.66, ly+2.57, 0.9, 'F');
  doc.setDrawColor(pAR,pAG,pAB); doc.setLineWidth(0.7);

    chLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5.5); });
    ay += chLines.length*5.5 + 3;
    doc.setTextColor(26,106,74); doc.setFontSize(8); doc.setFont('helvetica','normal');
    coLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    ay += coLines.length*5 + 3;
    doc.setTextColor(90,85,80); doc.setFontSize(7.5);
    exLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    wy += ansBoxH + 5;

    doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
    doc.setFontSize(7); doc.setFont('helvetica','bold');
    doc.rect(M,wy,TW,8,'F'); doc.text(LANG==='es'?'TRABAJO DEL ALUMNO':'STUDENT WORK', M+4, wy+5.5);
    wy += 11;

    var dc = document.getElementById('dc'+i);
    if (dc) {
      try {
        var imgD = dc.toDataURL('image/png');
        var ar   = dc.height / dc.width;
        var iw   = TW;
        var ih   = Math.min(iw * ar, 68);
        doc.addImage(imgD, 'PNG', M, wy, iw, ih);
        wy += ih + 4;
      } catch(e) {}
    }

    var ta = document.getElementById('ta'+i);
    if (ta && ta.value.trim()) {
      if (wy > PH-30) { doc.addPage(); wy = 20; }
      doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('courier','normal');
      var taLines = doc.splitTextToSize(ta.value, TW);
      taLines.slice(0,16).forEach(function(ln) {
        if (wy > PH-15) { doc.addPage(); wy = 20; }
        doc.text(ln, M, wy); wy += 5;
      });
      wy += 2;
    }

    var pp = document.getElementById('pp'+i);
    if (pp && pp.src && pp.src.indexOf('data:') === 0) {
      if (wy > PH-55) { doc.addPage(); wy = 20; }
      try { doc.addImage(pp.src, 'JPEG', M, wy, TW, 68); wy += 72; } catch(e) {}
    }
  }

  // ── Footer on every page ──
  var pages = doc.internal.getNumberOfPages();
  for (var p = 1; p <= pages; p++) {
    doc.setPage(p);
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0, PH-3, PW, 3, 'F');
    doc.setTextColor(130,140,160); doc.setFontSize(6.5); doc.setFont('helvetica','normal');
    doc.text(name+'  ·  '+group+(LANG==='es'?'  ·  Código: ':'  ·  Code: ')+code+(LANG==='es'?'  ·  Página ':'  ·  Page ')+p+'/'+pages,
      PW/2, PH-5, {align:'center'});
  }

  doc.save(SCHOOL.filePrefix + '_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf');
  btn.innerHTML = '⬇ &nbsp;' + t('btn-pdf');
  btn.disabled  = false;
}

/* ══════════════════════════════════════════════════════════════════════
   GUIDE CONTENT — eventos independientes, regla de la suma y del producto
   Helpers, manipulatives and buildLesson (interleaved concept → widget →
   graded problem). Everything bilingual; every value comes from the seed.
   ══════════════════════════════════════════════════════════════════════ */
function addSection(tag, title, html){
  var d = document.createElement('div');
  d.className = 'section';
  d.innerHTML = '<div class="stag">'+tag+'</div><h2>'+title+'</h2>'+html;
  document.getElementById('lessonBody').appendChild(d);
}
function shuffleOpts(opts, correct, rng){
  var a = opts.slice();
  for (var i = a.length-1; i > 0; i--){ var j = Math.floor(rng()*(i+1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
  return { opts:a, idx:a.indexOf(correct) };
}
function shufflePerm(n, rng){
  var a = []; for (var i = 0; i < n; i++) a.push(i);
  for (var k = n-1; k > 0; k--){ var j = Math.floor(rng()*(k+1)); var t = a[k]; a[k] = a[j]; a[j] = t; }
  return a;
}
/* ── fraction helpers (Rule 13: stacked display, never an inline slash) ── */
function gcdOf(a, b){ a = Math.abs(a); b = Math.abs(b); while (b){ var t = a % b; a = b; b = t; } return a || 1; }
function frac(n, d){
  var g = gcdOf(n, d), nn = n/g, dd = d/g;
  if (dd === 1) return String(nn);
  return '<span class="mf-outer"><span class="mf-num">'+nn+'</span><span class="mf-den">'+dd+'</span></span>';
}
function fracRaw(n, d){
  return '<span class="mf-outer"><span class="mf-num">'+n+'</span><span class="mf-den">'+d+'</span></span>';
}
function ipow(b, e){ var r = 1; for (var i = 0; i < e; i++) r *= b; return r; }
function pctTxt(x){ return (Math.round(x*1000)/10).toFixed(1)+'%'; }

function addProblem(rng, spec){
  var sh = shuffleOpts(spec.options, spec.correct, rng);
  problems.push({
    title: spec.title,
    questionText: spec.q,
    fn: '',
    options: sh.opts,
    correctIdx: sh.idx,
    hint: spec.hint,
    explanation: spec.exp,
    showWork: !!spec.showWork,
    studentChoice: null,
    pendingChoice: null
  });
  var idx = problems.length - 1;
  buildOneCard(problems[idx], idx);
}

/* ══════════════════════════════════════════════════════════════════════
   MANIPULATIVE 1 — ¿Se entera la segunda etapa?
   Situations arrive one at a time; the student sends each one to a bin and
   the widget answers with a reason, never with a bare cross.
   ══════════════════════════════════════════════════════════════════════ */
function buildIndep(rng){
  var es = (LANG === 'es');
  var BINS = es ? ['Independientes','No independientes'] : ['Independent','Not independent'];
  var ITEMS = [
    { es:'Lanzar una moneda y después girar una ruleta de colores.',
      en:'Toss a coin and then spin a colour wheel.', bin:0,
      wes:'La moneda no toca nada de lo que hay en la ruleta.',
      wen:'The coin touches nothing of what is on the wheel.' },
    { es:'Sacar una canica de una bolsa, devolverla y sacar otra canica de la misma bolsa.',
      en:'Draw a marble from a bag, put it back and draw another marble from the same bag.', bin:0,
      wes:'Al devolver la canica la bolsa queda igual que al principio.',
      wen:'Putting the marble back leaves the bag just as it was at the start.' },
    { es:'Sacar una carta de una baraja, quedársela y sacar en seguida una segunda carta.',
      en:'Draw a card from a deck, keep it and draw a second card right away.', bin:1,
      wes:'La segunda carta se saca de una baraja con una carta menos.',
      wen:'The second card comes out of a deck with one card fewer.' },
    { es:'Extraer una canica de una bolsa y otra canica de una bolsa distinta.',
      en:'Draw one marble from one bag and another marble from a different bag.', bin:0,
      wes:'Cada bolsa conserva su propio contenido.',
      wen:'Each bag keeps its own content.' },
    { es:'Elegir al azar a un alumno de una lista y después a otro alumno distinto de la misma lista.',
      en:'Pick a student at random from a list and then another different student from the same list.', bin:1,
      wes:'El primer elegido ya no puede volver a salir, así que la lista cambió.',
      wen:'The first one picked can no longer come up again, so the list changed.' },
    { es:'Lanzar un dado, anotar la cara y volver a lanzar el mismo dado.',
      en:'Roll a die, write down the face and roll the same die again.', bin:0,
      wes:'El dado no guarda memoria de lo que mostró antes.',
      wen:'The die keeps no memory of what it showed before.' }
  ];
  var st = { seq:shufflePerm(ITEMS.length, rng), i:0, tries:0, right:0, lock:false, done:false };

  var wrap = document.createElement('div');
  wrap.className = 'iwrap section';
  wrap.setAttribute('data-widget','clasifica');
  wrap.id = 'wIndep';
  document.getElementById('lessonBody').appendChild(wrap);

  function cur(){ return ITEMS[st.seq[Math.min(st.i, ITEMS.length-1)]]; }
  function render(){
    if (st.done){
      wrap.innerHTML =
        '<div class="iw-tag">'+(es?'Detector de independencia':'Independence detector')+'</div>'+
        '<div class="cls-done">🎉 '+(es?'Las seis situaciones quedaron revisadas.':'All six situations have been reviewed.')+' '+st.right+' / '+ITEMS.length+'</div>';
      return;
    }
    var it = cur();
    wrap.innerHTML =
      '<div class="iw-tag">'+(es?'Detector de independencia':'Independence detector')+'</div>'+
      '<div class="iw-sub">'+(es
        ? 'Lee la situación y pregúntate si al terminar la primera parte quedó algo distinto para la segunda. Toca el cajón que le corresponde.'
        : 'Read the situation and ask yourself whether the first part left anything different for the second one. Tap the box it belongs to.')+'</div>'+
      '<div class="iw-prog">'+(st.i+1)+' / '+ITEMS.length+'</div>'+
      '<div class="cls-card">'+it[LANG]+'</div>'+
      '<div class="cls-bins">'+
        '<button class="cls-bin" onclick="indPick(0)">'+BINS[0]+'</button>'+
        '<button class="cls-bin" onclick="indPick(1)">'+BINS[1]+'</button>'+
      '</div>'+
      '<div class="rfb" id="indFb"></div>';
  }
  function advance(){
    st.i++; st.tries = 0; st.lock = false;
    if (st.i >= ITEMS.length) st.done = true;
    render();
  }
  window.indPick = function(bi){
    if (st.lock || st.done) return;
    var it = cur(), fb = document.getElementById('indFb');
    if (bi === it.bin){
      st.right++; st.lock = true;
      fb.innerHTML = '<span style="color:var(--ok);font-weight:700;">✓ '+(es?'Así es. ':'That is it. ')+it[es?'wes':'wen']+'</span>';
      setTimeout(advance, 1200);
      return;
    }
    st.tries++;
    if (st.tries >= 3){
      st.lock = true;
      fb.innerHTML = (es?'Va en <b>':'It goes in <b>')+BINS[it.bin]+'</b>. '+it[es?'wes':'wen'];
      setTimeout(advance, 2400);
      return;
    }
    fb.textContent = (it.bin === 0)
      ? (es ? 'Vuelve a intentar: revisa si la segunda parte empieza exactamente en la misma situación que la primera.'
            : 'Try again: check whether the second part starts in exactly the same situation as the first one.')
      : (es ? 'Vuelve a intentar: fíjate en qué se llevó la primera parte antes de que empezara la segunda.'
            : 'Try again: look at what the first part took away before the second one began.');
  };
  render();
}

/* ══════════════════════════════════════════════════════════════════════
   MANIPULATIVE 2 — Rejilla de dos dados
   Rows are the faces of the first die, columns the faces of the second.
   Tapping a header puts that face into an event; the shared casillas light
   up and the student sees the product appear as the area of a rectangle.
   ══════════════════════════════════════════════════════════════════════ */
function buildRejilla(rng){
  var es = (LANG === 'es');
  var rounds = shuffle([6,9,12,4,18,8], rng).slice(0,3);
  var st = { r:0, A:[false,false,false,false,false,false], B:[false,false,false,false,false,false], tries:0, lock:false, done:false };

  var wrap = document.createElement('div');
  wrap.className = 'iwrap section';
  wrap.setAttribute('data-widget','rejilla');
  wrap.id = 'wRejilla';
  wrap.innerHTML =
    '<div class="iw-tag">'+(es?'Rejilla de dos dados':'Two dice grid')+'</div>'+
    '<div class="iw-goal" id="rjGoal"></div>'+
    '<div class="iw-sub">'+(es
      ? 'Toca los números de la fila superior y de la columna izquierda para meterlos en cada evento. Las casillas que se encienden son las parejas en las que ocurren los dos.'
      : 'Tap the numbers on the top row and on the left column to put them into each event. The cells that light up are the pairs in which both happen.')+'</div>'+
    '<div class="rj-grid" id="rjGrid"></div>'+
    '<div class="iw-read" id="rjRead"></div>'+
    '<button class="rverify-btn" onclick="rjCheck()">'+(es?'Verificar':'Check')+'</button>'+
    '<div class="rfb" id="rjFb"></div>';
  document.getElementById('lessonBody').appendChild(wrap);

  function cur(){ return rounds[Math.min(st.r, rounds.length-1)]; }
  function cnt(x){ var c = 0; for (var i = 0; i < 6; i++) if (x[i]) c++; return c; }
  function solve(t){
    for (var a = 1; a <= 6; a++){ if (t % a === 0 && t/a <= 6) return [a, t/a]; }
    return [1,1];
  }
  function grid(){
    var g = document.getElementById('rjGrid'); if (!g) return;
    var h = '<div class="rj-cell rj-corner"></div>';
    for (var j = 0; j < 6; j++) h += '<button class="rj-cell rj-head'+(st.B[j]?' on':'')+'" onclick="rjCol('+j+')">'+(j+1)+'</button>';
    for (var i = 0; i < 6; i++){
      h += '<button class="rj-cell rj-head'+(st.A[i]?' on':'')+'" onclick="rjRow('+i+')">'+(i+1)+'</button>';
      for (var k = 0; k < 6; k++){
        var hit = st.A[i] && st.B[k];
        h += '<div class="rj-cell'+(hit?' hit':'')+'">'+(hit?'✦':'')+'</div>';
      }
    }
    g.innerHTML = h;
  }
  function readout(){
    var el = document.getElementById('rjRead'); if (!el) return;
    var a = cnt(st.A), b = cnt(st.B);
    el.innerHTML = (es?'Primer dado: ':'First die: ')+frac(a,6)+'&nbsp;&nbsp;·&nbsp;&nbsp;'+(es?'Segundo dado: ':'Second die: ')+frac(b,6)+
      '&nbsp;&nbsp;·&nbsp;&nbsp;'+(es?'Los dos: ':'Both: ')+fracRaw(a*b,36)+' ('+(a*b)+(es?' casillas)':' cells)');
  }
  function goal(){
    var el = document.getElementById('rjGoal'); if (!el) return;
    if (st.done){ el.innerHTML = (es?'Rejilla dominada.':'Grid mastered.'); return; }
    el.innerHTML = (es?'Rejilla ':'Grid ')+(st.r+1)+(es?' de 3: enciende un rectángulo cuya probabilidad valga exactamente ':' of 3: light up a rectangle whose probability is exactly ')+frac(cur(),36)+'.';
  }
  function sync(){ grid(); readout(); goal(); }

  window.rjRow = function(i){ if (st.lock || st.done) return; st.A[i] = !st.A[i]; sync(); var f = document.getElementById('rjFb'); if (f) f.innerHTML = ''; };
  window.rjCol = function(j){ if (st.lock || st.done) return; st.B[j] = !st.B[j]; sync(); var f = document.getElementById('rjFb'); if (f) f.innerHTML = ''; };
  window.rjCheck = function(){
    if (st.lock || st.done) return;
    var t = cur(), a = cnt(st.A), b = cnt(st.B), v = a*b, fb = document.getElementById('rjFb');
    if (v === t){
      st.r++; st.tries = 0;
      if (st.r >= rounds.length){
        st.done = true; sync();
        document.getElementById('rjFb').innerHTML = '<span style="color:var(--ok);font-weight:700;">🎉 '+(es?'Las tres rejillas quedaron exactas. El rectángulo siempre mide filas por columnas.':'All three grids came out exact. The rectangle always measures rows times columns.')+'</span>';
        return;
      }
      st.lock = true;
      fb.innerHTML = '<span style="color:var(--ok);font-weight:700;">✓ '+(es?'Exacto. Va la siguiente rejilla.':'Exact. Next grid coming.')+'</span>';
      setTimeout(function(){ st.lock = false; st.A = [false,false,false,false,false,false]; st.B = [false,false,false,false,false,false]; fb.innerHTML = ''; sync(); }, 1200);
      return;
    }
    st.tries++;
    if (st.tries >= 3){
      var s = solve(t);
      st.lock = true;
      st.A = [false,false,false,false,false,false]; st.B = [false,false,false,false,false,false];
      for (var i = 0; i < s[0]; i++) st.A[i] = true;
      for (var j = 0; j < s[1]; j++) st.B[j] = true;
      sync();
      fb.innerHTML = (es
        ? 'Así queda: con '+s[0]+' filas y '+s[1]+' columnas se encienden '+t+' casillas de 36, que valen '+frac(t,36)+'.'
        : 'Here it is: with '+s[0]+' rows and '+s[1]+' columns '+t+' cells out of 36 light up, and they are worth '+frac(t,36)+'.');
      setTimeout(function(){
        st.lock = false; st.tries = 0; st.r++;
        st.A = [false,false,false,false,false,false]; st.B = [false,false,false,false,false,false];
        if (st.r >= rounds.length) st.done = true;
        var f2 = document.getElementById('rjFb'); if (f2) f2.innerHTML = '';
        sync();
      }, 2800);
      return;
    }
    if (v === 0){
      fb.textContent = es ? 'Todavía no hay rectángulo: cada evento necesita al menos un número encendido.'
                          : 'There is no rectangle yet: each event needs at least one number lit up.';
      return;
    }
    fb.textContent = (v > t)
      ? (es ? 'El rectángulo cubre demasiadas casillas: apaga una fila o una columna.'
            : 'The rectangle covers too many cells: switch off a row or a column.')
      : (es ? 'El rectángulo se quedó corto: enciende otra fila u otra columna.'
            : 'The rectangle fell short: light up another row or another column.');
  };
  sync();
}

/* ══════════════════════════════════════════════════════════════════════
   MANIPULATIVE 3 — Árbol de dos bolsas
   Four complete branches, each already multiplied. The student picks the
   branches that satisfy the condition and watches the selection add up.
   ══════════════════════════════════════════════════════════════════════ */
function buildArbol(rng){
  var es = (LANG === 'es');
  var BAGS = [ {n1:4,r1:3,n2:5,r2:2}, {n1:5,r1:2,n2:4,r2:3}, {n1:6,r1:4,n2:5,r2:3}, {n1:4,r1:1,n2:6,r2:4} ];
  var bags = shuffle(BAGS, rng).slice(0,3);
  var goals = shuffle(['dos','ninguna','uno','almenos'], rng).slice(0,3);
  var rounds = [ {b:bags[0], g:goals[0]}, {b:bags[1], g:goals[1]}, {b:bags[2], g:goals[2]} ];
  var st = { r:0, sel:[false,false,false,false], tries:0, lock:false, done:false };

  var wrap = document.createElement('div');
  wrap.className = 'iwrap section';
  wrap.setAttribute('data-widget','arbol');
  wrap.id = 'wArbol';
  wrap.innerHTML =
    '<div class="iw-tag">'+(es?'Árbol de dos bolsas':'Two bag tree')+'</div>'+
    '<div class="iw-goal" id="abGoal"></div>'+
    '<div class="iw-sub">'+(es
      ? 'Cada renglón es una rama completa del árbol y ya trae su valor multiplicado. Toca las ramas que cumplen la condición y mira cómo se acumulan.'
      : 'Each row is a complete branch of the tree and already carries its multiplied value. Tap the branches that satisfy the condition and watch them add up.')+'</div>'+
    '<div class="br-list" id="abList"></div>'+
    '<div class="iw-read" id="abRead"></div>'+
    '<div class="iw-bar"><div class="iw-bar-a" id="abBarA"></div><div class="iw-bar-b" id="abBarB"></div></div>'+
    '<div class="iw-legend"><span><span class="iw-key ka"></span>'+(es?'ramas elegidas':'branches chosen')+'</span><span><span class="iw-key kb"></span>'+(es?'lo que falta':'what is missing')+'</span></div>'+
    '<button class="rverify-btn" onclick="abCheck()">'+(es?'Verificar':'Check')+'</button>'+
    '<div class="rfb" id="abFb"></div>';
  document.getElementById('lessonBody').appendChild(wrap);

  function cur(){ return rounds[Math.min(st.r, rounds.length-1)]; }
  function leaves(){
    var b = cur().b;
    return [
      { a:true,  c:true,  w:b.r1*b.r2,               p1:b.r1,      p2:b.r2 },
      { a:true,  c:false, w:b.r1*(b.n2-b.r2),        p1:b.r1,      p2:b.n2-b.r2 },
      { a:false, c:true,  w:(b.n1-b.r1)*b.r2,        p1:b.n1-b.r1, p2:b.r2 },
      { a:false, c:false, w:(b.n1-b.r1)*(b.n2-b.r2), p1:b.n1-b.r1, p2:b.n2-b.r2 }
    ];
  }
  function want(){
    var g = cur().g;
    if (g === 'dos')     return [true,false,false,false];
    if (g === 'ninguna') return [false,false,false,true];
    if (g === 'uno')     return [false,true,true,false];
    return [true,true,true,false];
  }
  function goalTxt(){
    var g = cur().g;
    if (g === 'dos')     return es ? 'las dos canicas salgan rojas' : 'both marbles come out red';
    if (g === 'ninguna') return es ? 'ninguna de las dos canicas sea roja' : 'neither of the two marbles is red';
    if (g === 'uno')     return es ? 'salga exactamente una canica roja' : 'exactly one red marble comes out';
    return es ? 'salga al menos una canica roja' : 'at least one red marble comes out';
  }
  function sumOf(mask){ var L = leaves(), s = 0; for (var i = 0; i < 4; i++) if (mask[i]) s += L[i].w; return s; }
  function list(){
    var el = document.getElementById('abList'); if (!el) return;
    var b = cur().b, L = leaves(), D = b.n1*b.n2, h = '';
    for (var i = 0; i < 4; i++){
      var c1 = L[i].a ? (es?'roja':'red') : (es?'azul':'blue');
      var c2 = L[i].c ? (es?'roja':'red') : (es?'azul':'blue');
      h += '<button class="br-leaf'+(st.sel[i]?' on':'')+'" onclick="abTap('+i+')">'+
             '<span class="br-path"><span class="br-step">'+(es?'bolsa 1: ':'bag 1: ')+c1+'</span><span class="br-step">'+(es?'bolsa 2: ':'bag 2: ')+c2+'</span></span>'+
             '<span class="br-val">'+frac(L[i].p1,b.n1)+' × '+frac(L[i].p2,b.n2)+' = '+fracRaw(L[i].w,D)+'</span>'+
           '</button>';
    }
    el.innerHTML = h;
  }
  function readout(){
    var el = document.getElementById('abRead'); if (!el) return;
    var b = cur().b, D = b.n1*b.n2, s = sumOf(st.sel), tg = sumOf(want());
    el.innerHTML = (es?'Ramas elegidas: ':'Branches chosen: ')+fracRaw(s,D)+'&nbsp;&nbsp;·&nbsp;&nbsp;'+(es?'de un total de ':'out of a whole of ')+D+(es?' parejas':' pairs');
    var ba = document.getElementById('abBarA'), bb = document.getElementById('abBarB');
    if (ba) ba.style.width = (s/D*100)+'%';
    if (bb) bb.style.width = (Math.max(0, tg-s)/D*100)+'%';
  }
  function goal(){
    var el = document.getElementById('abGoal'); if (!el) return;
    if (st.done){ el.innerHTML = (es?'Árbol dominado.':'Tree mastered.'); return; }
    var b = cur().b;
    el.innerHTML = (es?'Árbol ':'Tree ')+(st.r+1)+(es?' de 3: la bolsa 1 tiene ':' of 3: bag 1 holds ')+b.n1+(es?' canicas con ':' marbles with ')+b.r1+
      (es?' rojas y la bolsa 2 tiene ':' red and bag 2 holds ')+b.n2+(es?' canicas con ':' marbles with ')+b.r2+
      (es?' rojas. Elige las ramas en las que ':' red. Choose the branches in which ')+goalTxt()+'.';
  }
  function sync(){ list(); readout(); goal(); }

  window.abTap = function(i){ if (st.lock || st.done) return; st.sel[i] = !st.sel[i]; sync(); var f = document.getElementById('abFb'); if (f) f.innerHTML = ''; };
  window.abCheck = function(){
    if (st.lock || st.done) return;
    var w = want(), fb = document.getElementById('abFb'), extra = 0, miss = 0;
    for (var i = 0; i < 4; i++){ if (st.sel[i] && !w[i]) extra++; if (!st.sel[i] && w[i]) miss++; }
    var b = cur().b, D = b.n1*b.n2;
    if (extra === 0 && miss === 0){
      st.r++; st.tries = 0;
      if (st.r >= rounds.length){
        st.done = true; sync();
        document.getElementById('abFb').innerHTML = '<span style="color:var(--ok);font-weight:700;">🎉 '+(es?'Los tres árboles quedaron completos. Cada rama se multiplica y las ramas se suman entre sí.':'All three trees came out complete. Each branch multiplies and the branches add to one another.')+'</span>';
        return;
      }
      st.lock = true;
      fb.innerHTML = '<span style="color:var(--ok);font-weight:700;">✓ '+(es?'Esas son. Va el siguiente árbol.':'Those are the ones. Next tree coming.')+'</span>';
      setTimeout(function(){ st.lock = false; st.sel = [false,false,false,false]; fb.innerHTML = ''; sync(); }, 1200);
      return;
    }
    st.tries++;
    if (st.tries >= 3){
      st.lock = true; st.sel = want().slice(); sync();
      fb.innerHTML = (es
        ? 'Estas son las ramas que cumplen, y juntas valen '+frac(sumOf(want()),D)+'. Las ramas no pueden ocurrir a la vez, por eso se suman entre ellas.'
        : 'These are the branches that satisfy it, and together they are worth '+frac(sumOf(want()),D)+'. The branches cannot happen at once, which is why they add to one another.');
      setTimeout(function(){
        st.lock = false; st.tries = 0; st.r++; st.sel = [false,false,false,false];
        if (st.r >= rounds.length) st.done = true;
        var f2 = document.getElementById('abFb'); if (f2) f2.innerHTML = '';
        sync();
      }, 3000);
      return;
    }
    if (extra > 0){
      fb.textContent = es ? 'Hay una rama elegida que no cumple la condición: léela de nuevo y quítala.'
                          : 'One chosen branch does not satisfy the condition: read it again and take it out.';
    } else {
      fb.textContent = es ? 'Todavía falta alguna rama que sí cumple: revisa las cuatro de arriba abajo.'
                          : 'Some branch that does satisfy it is still missing: check the four from top to bottom.';
    }
  };
  sync();
}

/* ══════════════════════════════════════════════════════════════════════
   MANIPULATIVE 4 — Repetidor de intentos
   The slider adds independent repetitions and the two bars show how the
   chance of failing every time shrinks while at least once grows.
   ══════════════════════════════════════════════════════════════════════ */
function buildRepite(rng){
  var es = (LANG === 'es');
  var POOL = [ {pn:1,pd:6,thr:0.5}, {pn:1,pd:4,thr:0.75}, {pn:1,pd:3,thr:0.9}, {pn:2,pd:5,thr:0.9}, {pn:1,pd:5,thr:0.5}, {pn:1,pd:3,thr:0.5} ];
  var rounds = shuffle(POOL, rng).slice(0,3);
  var st = { r:0, n:1, tries:0, lock:false, done:false };

  var wrap = document.createElement('div');
  wrap.className = 'iwrap section';
  wrap.setAttribute('data-widget','repite');
  wrap.id = 'wRepite';
  wrap.innerHTML =
    '<div class="iw-tag">'+(es?'Repetidor de intentos':'Attempt repeater')+'</div>'+
    '<div class="iw-goal" id="rpGoal"></div>'+
    '<div class="iw-sub">'+(es
      ? 'Mueve la barra para repetir el intento más veces. La barra verde es la probabilidad de acertar alguna vez y la dorada la de fallar siempre.'
      : 'Move the slider to repeat the attempt more times. The green bar is the probability of hitting at some point and the golden one of missing every time.')+'</div>'+
    '<div class="iw-ctrl">'+
      '<span class="iw-lbl">'+(es?'intentos':'attempts')+'</span>'+
      '<input type="range" id="rpRange" min="1" max="8" step="1" value="1" oninput="rpSlide(this.value)">'+
      '<span class="iw-lbl" id="rpN">1</span>'+
    '</div>'+
    '<div class="iw-read" id="rpRead"></div>'+
    '<div class="iw-bar"><div class="iw-bar-a" id="rpBarA"></div><div class="iw-bar-b" id="rpBarB"></div></div>'+
    '<div class="iw-legend"><span><span class="iw-key ka"></span>'+(es?'al menos una vez':'at least once')+'</span><span><span class="iw-key kb"></span>'+(es?'ninguna vez':'never')+'</span></div>'+
    '<button class="rverify-btn" onclick="rpCheck()">'+(es?'Verificar':'Check')+'</button>'+
    '<div class="rfb" id="rpFb"></div>';
  document.getElementById('lessonBody').appendChild(wrap);

  function cur(){ return rounds[Math.min(st.r, rounds.length-1)]; }
  function atLeast(n){ var c = cur(); return 1 - Math.pow((c.pd-c.pn)/c.pd, n); }
  function answer(){
    var c = cur();
    for (var n = 1; n <= 8; n++) if (atLeast(n) > c.thr) return n;
    return 8;
  }
  function readout(){
    var el = document.getElementById('rpRead'); if (!el) return;
    var v = atLeast(st.n);
    el.innerHTML = (es?'Con ':'With ')+st.n+(es?' intento(s): al menos una vez ':' attempt(s): at least once ')+pctTxt(v)+
      '&nbsp;&nbsp;·&nbsp;&nbsp;'+(es?'ninguna vez ':'never ')+pctTxt(1-v);
    var ba = document.getElementById('rpBarA'), bb = document.getElementById('rpBarB');
    if (ba) ba.style.width = (v*100)+'%';
    if (bb) bb.style.width = ((1-v)*100)+'%';
  }
  function goal(){
    var el = document.getElementById('rpGoal'); if (!el) return;
    if (st.done){ el.innerHTML = (es?'Repetidor dominado.':'Repeater mastered.'); return; }
    var c = cur();
    el.innerHTML = (es?'Ronda ':'Round ')+(st.r+1)+(es?' de 3: cada intento acierta con probabilidad ':' of 3: each attempt hits with probability ')+frac(c.pn,c.pd)+
      (es?'. Busca el menor número de intentos con el que acertar al menos una vez pase de ':'. Find the smallest number of attempts for which hitting at least once goes past ')+pctTxt(c.thr)+'.';
  }
  function sync(){
    var rg = document.getElementById('rpRange'); if (rg) rg.value = String(st.n);
    var lb = document.getElementById('rpN'); if (lb) lb.textContent = String(st.n);
    goal(); readout();
  }
  window.rpSlide = function(v){
    if (st.lock || st.done) return;
    st.n = parseInt(v,10) || 1;
    var lb = document.getElementById('rpN'); if (lb) lb.textContent = String(st.n);
    readout();
    var f = document.getElementById('rpFb'); if (f) f.innerHTML = '';
  };
  window.rpCheck = function(){
    if (st.lock || st.done) return;
    var c = cur(), a = answer(), fb = document.getElementById('rpFb');
    if (st.n === a){
      st.r++; st.tries = 0;
      if (st.r >= rounds.length){
        st.done = true; sync();
        document.getElementById('rpFb').innerHTML = '<span style="color:var(--ok);font-weight:700;">🎉 '+(es?'Las tres rondas quedaron ajustadas. Fallar siempre se vuelve más raro con cada repetición.':'All three rounds are tuned. Missing every time gets rarer with each repetition.')+'</span>';
        return;
      }
      st.lock = true;
      fb.innerHTML = '<span style="color:var(--ok);font-weight:700;">✓ '+(es?'Ese es el menor. Va la siguiente ronda.':'That is the smallest one. Next round coming.')+'</span>';
      setTimeout(function(){ st.lock = false; st.n = 1; fb.innerHTML = ''; sync(); }, 1200);
      return;
    }
    st.tries++;
    if (st.tries >= 3){
      st.lock = true; st.n = a; sync();
      fb.innerHTML = (es
        ? 'Con '+a+' intentos fallar todas las veces baja hasta '+pctTxt(1-atLeast(a))+', y lo que falta para completar la certeza ya pasa de '+pctTxt(c.thr)+'.'
        : 'With '+a+' attempts missing every time drops to '+pctTxt(1-atLeast(a))+', and what is missing to complete certainty already goes past '+pctTxt(c.thr)+'.');
      setTimeout(function(){
        st.lock = false; st.tries = 0; st.r++; st.n = 1;
        if (st.r >= rounds.length) st.done = true;
        var f2 = document.getElementById('rpFb'); if (f2) f2.innerHTML = '';
        sync();
      }, 3000);
      return;
    }
    fb.textContent = (st.n < a)
      ? (es ? 'Todavía no alcanza el objetivo: agrega intentos.' : 'It does not reach the target yet: add attempts.')
      : (es ? 'Ya pasaste el objetivo, pero con menos intentos también se logra: quita alguno.'
            : 'You are past the target, but fewer attempts also do it: take one away.');
  };
  sync();
}

/* ══════════════════════════════════════════════════════════════════════
   MANIPULATIVE 5 — Ajusta el juego de dos ruedas
   Ana wins only when both wheels land on gold. The student tunes the gold
   sectors of each wheel until the two players carry the same weight.
   ══════════════════════════════════════════════════════════════════════ */
function buildJusto(rng){
  var es = (LANG === 'es');
  var POOL = [ {n1:8,n2:6}, {n1:10,n2:8}, {n1:10,n2:6}, {n1:12,n2:8}, {n1:6,n2:4} ];
  var rounds = shuffle(POOL, rng).slice(0,3);
  var st = { r:0, g1:1, g2:1, tries:0, lock:false, done:false };

  var wrap = document.createElement('div');
  wrap.className = 'iwrap section';
  wrap.setAttribute('data-widget','justo');
  wrap.id = 'wJusto';
  wrap.innerHTML =
    '<div class="iw-tag">'+(es?'Ajusta el juego':'Tune the game')+'</div>'+
    '<div class="iw-goal" id="juGoal"></div>'+
    '<div class="iw-sub">'+(es
      ? 'Ana gana solo si las dos ruedas caen en dorado; Beto gana en cualquier otro caso. Mueve las barras hasta que las dos partes pesen igual.'
      : 'Ana wins only if both wheels land on gold; Beto wins in any other case. Move the sliders until the two sides weigh the same.')+'</div>'+
    '<div class="iw-ctrl">'+
      '<span class="iw-lbl">'+(es?'rueda 1':'wheel 1')+'</span>'+
      '<input type="range" id="juR1" min="0" max="12" step="1" value="1" oninput="juSlide(1,this.value)">'+
      '<span class="iw-lbl" id="juL1">1</span>'+
    '</div>'+
    '<div class="iw-ctrl">'+
      '<span class="iw-lbl">'+(es?'rueda 2':'wheel 2')+'</span>'+
      '<input type="range" id="juR2" min="0" max="12" step="1" value="1" oninput="juSlide(2,this.value)">'+
      '<span class="iw-lbl" id="juL2">1</span>'+
    '</div>'+
    '<div class="iw-read" id="juRead"></div>'+
    '<div class="iw-bar"><div class="iw-bar-a" id="juBarA"></div><div class="iw-bar-b" id="juBarB"></div></div>'+
    '<div class="iw-legend"><span><span class="iw-key ka"></span>'+(es?'gana Ana':'Ana wins')+'</span><span><span class="iw-key kb"></span>'+(es?'gana Beto':'Beto wins')+'</span></div>'+
    '<button class="rverify-btn" onclick="juCheck()">'+(es?'Verificar':'Check')+'</button>'+
    '<div class="rfb" id="juFb"></div>';
  document.getElementById('lessonBody').appendChild(wrap);

  function cur(){ return rounds[Math.min(st.r, rounds.length-1)]; }
  function solve(){
    var c = cur(), half = c.n1*c.n2/2;
    for (var a = 1; a <= c.n1; a++){ if (half % a === 0 && half/a <= c.n2) return [a, half/a]; }
    return [c.n1, c.n2];
  }
  function readout(){
    var el = document.getElementById('juRead'); if (!el) return;
    var c = cur(), D = c.n1*c.n2, w = st.g1*st.g2;
    el.innerHTML = (es?'Gana Ana: ':'Ana wins: ')+fracRaw(w,D)+'&nbsp;&nbsp;·&nbsp;&nbsp;'+(es?'Gana Beto: ':'Beto wins: ')+fracRaw(D-w,D);
    var ba = document.getElementById('juBarA'), bb = document.getElementById('juBarB');
    if (ba) ba.style.width = (w/D*100)+'%';
    if (bb) bb.style.width = ((D-w)/D*100)+'%';
  }
  function goal(){
    var el = document.getElementById('juGoal'); if (!el) return;
    if (st.done){ el.innerHTML = (es?'Juego dominado.':'Game mastered.'); return; }
    var c = cur();
    el.innerHTML = (es?'Juego ':'Game ')+(st.r+1)+(es?' de 3: la rueda 1 tiene ':' of 3: wheel 1 has ')+c.n1+(es?' sectores iguales y la rueda 2 tiene ':' equal sectors and wheel 2 has ')+c.n2+
      (es?'. Reparte los sectores dorados hasta que el juego sea justo.':'. Hand out the golden sectors until the game is fair.');
  }
  function sync(){
    var c = cur();
    var r1 = document.getElementById('juR1'), r2 = document.getElementById('juR2');
    if (r1){ r1.max = String(c.n1); r1.value = String(st.g1); }
    if (r2){ r2.max = String(c.n2); r2.value = String(st.g2); }
    var l1 = document.getElementById('juL1'); if (l1) l1.textContent = String(st.g1);
    var l2 = document.getElementById('juL2'); if (l2) l2.textContent = String(st.g2);
    goal(); readout();
  }
  window.juSlide = function(which, v){
    if (st.lock || st.done) return;
    var n = parseInt(v,10) || 0;
    if (which === 1) st.g1 = n; else st.g2 = n;
    var l = document.getElementById(which === 1 ? 'juL1' : 'juL2'); if (l) l.textContent = String(n);
    readout();
    var f = document.getElementById('juFb'); if (f) f.innerHTML = '';
  };
  window.juCheck = function(){
    if (st.lock || st.done) return;
    var c = cur(), D = c.n1*c.n2, w = st.g1*st.g2, fb = document.getElementById('juFb');
    if (w*2 === D){
      st.r++; st.tries = 0;
      if (st.r >= rounds.length){
        st.done = true; sync();
        document.getElementById('juFb').innerHTML = '<span style="color:var(--ok);font-weight:700;">🎉 '+(es?'Los tres juegos quedaron parejos. Una rama de dos etapas pesa menos que cada uno de sus tramos.':'All three games came out even. A two stage branch weighs less than each of its stretches.')+'</span>';
        return;
      }
      st.lock = true;
      fb.innerHTML = '<span style="color:var(--ok);font-weight:700;">✓ '+(es?'Juego parejo. Va el siguiente.':'Even game. Next one coming.')+'</span>';
      setTimeout(function(){ st.lock = false; st.g1 = 1; st.g2 = 1; fb.innerHTML = ''; sync(); }, 1200);
      return;
    }
    st.tries++;
    if (st.tries >= 3){
      var s = solve();
      st.lock = true; st.g1 = s[0]; st.g2 = s[1]; sync();
      fb.innerHTML = (es
        ? 'Así queda parejo: '+frac(s[0],c.n1)+' de la primera rueda junto con '+frac(s[1],c.n2)+' de la segunda dejan a cada jugador con '+frac(1,2)+'.'
        : 'This is how it evens out: '+frac(s[0],c.n1)+' of the first wheel together with '+frac(s[1],c.n2)+' of the second leave each player with '+frac(1,2)+'.');
      setTimeout(function(){
        st.lock = false; st.tries = 0; st.r++; st.g1 = 1; st.g2 = 1;
        if (st.r >= rounds.length) st.done = true;
        var f2 = document.getElementById('juFb'); if (f2) f2.innerHTML = '';
        sync();
      }, 3000);
      return;
    }
    fb.textContent = (w*2 < D)
      ? (es ? 'Ana gana menos de la mitad de las veces: agrega sectores dorados en alguna rueda.'
            : 'Ana wins less than half the time: add golden sectors on one of the wheels.')
      : (es ? 'Ana gana más de la mitad de las veces: quita sectores dorados de alguna rueda.'
            : 'Ana wins more than half the time: take golden sectors off one of the wheels.');
  };
  sync();
}

/* ══════════════════════════════════════════════════════════════════════
   buildLesson: concepto, manipulativo, problema calificado, intercalados
   ══════════════════════════════════════════════════════════════════════ */
function buildLesson(rng) {
  problems = [];

  lb.innerHTML = '';
  var es = (LANG === 'es');
  var C  = es ? 'Concepto ' : 'Concept ';

  /* ── CONCEPTO 1 ──────────────────────────────────────────────── */
  addSection(C + '1',
    es ? 'Cuando el segundo paso no se entera del primero' : 'When the second step does not find out about the first',
    (es
    ? '<p>Muchos experimentos ocurren por etapas: primero se gira una rueda y luego se lanza una moneda, o primero se saca una canica y luego se saca otra. La pregunta que decide todo es siempre la misma: al terminar la primera etapa, ¿quedó algo distinto para la segunda? Si la respuesta es que nada cambió, los dos eventos son independientes. Si la primera etapa dejó una situación diferente, esa independencia se pierde y las probabilidades de la segunda etapa ya no son las de antes.</p>'
    + '<p>El caso que más confunde es el de una bolsa de canicas. Si la canica que salió se devuelve antes de la siguiente extracción, la bolsa vuelve a quedar como al principio y las dos extracciones son independientes. Si la canica se queda fuera, la segunda extracción trabaja con un total menor y con un color menos, de modo que depende de lo que ocurrió antes. Conviene además recordar que una moneda y un dado no guardan memoria: una racha de cuatro soles seguidos no inclina el siguiente lanzamiento hacia ningún lado.</p>'
    : '<p>Many experiments happen in stages: first a wheel is spun and then a coin is tossed, or first a marble is drawn and then another one is drawn. The question that decides everything is always the same: when the first stage ends, was anything left different for the second one? If the answer is that nothing changed, the two events are independent. If the first stage left a different situation, that independence is lost and the probabilities of the second stage are no longer what they were.</p>'
    + '<p>The case that confuses most is a bag of marbles. If the marble that came out is put back before the next draw, the bag is again just as it was at the start and the two draws are independent. If the marble stays out, the second draw works with a smaller total and with one colour fewer, so it depends on what happened before. It is also worth remembering that a coin and a die keep no memory: a run of four tails in a row does not tip the next toss to either side.</p>')

    + '<div class="rcard"><div class="rname">'+(es?'Sin memoria':'No memory')+'</div><div class="rform">'+(es?'cada lanzamiento empieza de cero':'each toss starts from zero')+'</div><div class="rnote">'+(es?'Las rachas anteriores no cambian el siguiente.':'Earlier runs do not change the next one.')+'</div></div>'
    + '</div>');

  buildIndep(rng);

  /* ── PROBLEMA 1 ── reconocer la independencia (conceptual) ── */
  var P1V = [
    { es:{ t:'La etapa que no cambia nada',
           q:'De las siguientes situaciones, ¿en cuál el resultado de la primera parte deja las probabilidades de la segunda exactamente como estaban?',
           o:['Sacar una canica de una bolsa, devolverla y sacar otra canica de la misma bolsa','Repartir dos cartas seguidas de la misma baraja sin devolver la primera','Elegir a dos alumnos distintos de una misma lista, uno después del otro','Sacar dos boletos seguidos de una tómbola y quedarse con los dos'],
           a:'Sacar una canica de una bolsa, devolverla y sacar otra canica de la misma bolsa',

      en:{ t:'The stage that changes nothing',
           q:'Of the following situations, in which one does the result of the first part leave the probabilities of the second exactly as they were?',
           o:['Drawing a marble from a bag, putting it back and drawing another marble from the same bag','Dealing two cards in a row from the same deck without putting the first one back','Picking two different students from one same list, one after the other','Drawing two tickets in a row from a raffle drum and keeping both'],

    { es:{ t:'La racha de la moneda',
           q:'Una moneda equilibrada cayó sol cuatro veces seguidas. Un jugador afirma que en el quinto lanzamiento el águila ya tiene más posibilidades de salir. ¿Qué conviene responderle?',
           o:['Que el quinto lanzamiento vuelve a repartirse por mitades, porque no guarda memoria de los anteriores','Que el águila es más probable, porque los resultados de una serie tienden a emparejarse entre sí','Que el sol es más probable, porque la moneda ya mostró esa tendencia cuatro veces seguidas','Que no se puede saber, porque después de cuatro lanzamientos la moneda perdió su equilibrio'],
           a:'Que el quinto lanzamiento vuelve a repartirse por mitades, porque no guarda memoria de los anteriores',
