      correct:0,
      hint:{ es:'Busca la medida que da un apoyo adicional al grupo en desventaja y que se revisa mientras dure esa desventaja.',
             en:'Look for the measure that gives extra support to the disadvantaged group and is reviewed while that disadvantage lasts.' },
      explanation:{ es:'La acción afirmativa entrega un apoyo adicional y temporal justo al grupo que quedó atrás, y se revisa para saber cuándo ya no hace falta. El anuncio y el reglamento tratan a todos igual sin tocar la desventaja acumulada, y el reconocimiento celebra casos aislados sin cambiar el acceso.',
                    en:'An affirmative action delivers extra, temporary support precisely to the group that fell behind, and is reviewed to know when it is no longer needed. The announcement and the regulation treat everyone the same without touching the accumulated disadvantage, and the tribute celebrates isolated cases without changing access.' } },
    { title:{ es:'Reconocer una acción afirmativa', en:'Spotting an affirmative action' }, showWork:false,

             en:'At one school no student with a visual disability has taken part in the science fair since it began. Which of these measures is an affirmative action?' },
      options:{ es:[
        'Un apoyo temporal con materiales en braille y acompañamiento técnico reservado para esas estudiantes mientras se cierra la brecha.',

        en:[

      explanation:{ es:'Solo la primera opción entrega un apoyo adicional al grupo que nunca pudo participar y lo hace de forma temporal, hasta cerrar la brecha. Repetir la convocatoria mantiene el mismo resultado, la mención premia esfuerzos sin abrir el acceso y la fecha no toca la barrera.',

  ], rng), rng);

      stmt:{ es:'Para apoyar a quienes no tienen internet en casa, un grupo propone publicar en la entrada de la escuela la lista con los nombres de esas familias, para que alguien se ofrezca a ayudarles. ¿Cuál es la falla principal de la propuesta?',

                    en:'The proposal addresses hunger but demands a trip the most distant families cannot afford, so the aid mostly reaches those who already live nearby. To reach the whole group the delivery has to move closer to the communities or the trip has to be covered.' } }
  ], rng), rng);

  /* ── CONCEPTO 4 ─────────────────────────────────────────────── */
  addSection(S('CONCEPTO 4','CONCEPT 4'),
    '<h2>' + S('Bienestar colectivo: la cuenta de quién queda fuera','Collective wellbeing: counting who is left out') + '</h2>' +
    '<p>' + S('El bienestar colectivo no es la suma de lo que gana cada quien por su lado. Una obra que mejora mucho a un grupo y deja intacto el problema de otro no lo fortalece; una medida más modesta que amplía el acceso de todas las personas sí lo hace. La pregunta útil no es cuánto se gastó, sino a quiénes alcanzó y quiénes siguieron fuera.',
              'Collective wellbeing is not the sum of what each person gains on their own. A big project that greatly improves one group while leaving another problem untouched does not strengthen it; a more modest measure that widens access for everyone does. The useful question is not how much was spent, but who it reached and who stayed outside.') + '</p>' +
    '<p>' + S('Poner esto en números ayuda a decidir: cuántas personas quedan dentro, cuántas fuera y con cuánto dinero. Un presupuesto siempre es una elección sobre quién entra primero.',
              'Putting this in numbers helps you decide: how many people are inside, how many outside, and with how much money. A budget is always a choice about who comes in first.') + '</p>' +
    '<div class="callout"><p><strong>' + S('Cobertura: ','Coverage: ') + '</strong>' +
      S('la parte del grupo que realmente alcanza el servicio. Mientras quede alguien fuera por la misma barrera, la medida no está terminada.',
        'the share of the group that actually reaches the service. As long as someone stays out because of the same barrier, the measure is not finished.') + '</p></div>' +
    buildPresu(rng));
  preUpdate();

  /* ── PROBLEMA 7 (numérico) ──────────────────────────────────── */
  var c7 = pick([1200, 1500, 1600], rng);
  var k7 = pick([14, 16, 18], rng);
  var f7 = pick([5, 6, 7], rng);
  var x7 = c7 * k7;
  var r7 = k7 + f7;
  addProblem({
    title:{ es:'Rampas en las esquinas', en:'Ramps at the corners' }, showWork:true,
    stmt:{ es:'El comité de una colonia reunió ' + x7 + ' pesos para construir rampas en las banquetas. Cada rampa cuesta ' + c7 + ' pesos. Para que toda la colonia sea accesible en silla de ruedas se necesitan rampas en ' + r7 + ' esquinas. ¿En cuántas esquinas quedará pendiente la rampa?',
           en:'A neighborhood committee gathered ' + x7 + ' pesos to build sidewalk ramps. Each ramp costs ' + c7 + ' pesos. For the whole neighborhood to be accessible by wheelchair, ramps are needed at ' + r7 + ' corners. At how many corners will the ramp still be pending?' },
    options:{ es: numOpts(f7, [k7, r7, r7 + k7]), en: numOpts(f7, [k7, r7, r7 + k7]) },
    correct:0,
    hint:{ es:'Calcula primero cuántas rampas completas se pueden pagar con el dinero reunido y compáralo con las que hacen falta.',
           en:'First work out how many complete ramps the gathered money pays for and compare it with how many are needed.' },
    explanation:{ es:'Con ' + x7 + ' pesos y un costo de ' + c7 + ' pesos por rampa se construyen ' + x7 + ' ÷ ' + c7 + ' = ' + k7 + ' rampas. La colonia necesita ' + r7 + ', así que quedan pendientes ' + r7 + ' − ' + k7 + ' = ' + f7,
                  en:'With ' + x7 + ' pesos and a cost of ' + c7 + ' pesos per ramp, ' + x7 + ' ÷ ' + c7 + ' = ' + k7 + ' ramps get built. The neighborhood needs ' + r7 + ', so the ones still pending are ' + r7 + ' − ' + k7 + ' = ' + f7 }
  }, rng);

  /* ── PROBLEMA 8 (numérico) ──────────────────────────────────── */
  var e8 = pick([600, 700, 800], rng);
  var n8 = pick([3, 4], rng);
  var g8 = pick([45, 55, 60], rng);
  var need8 = e8 * n8 / 10;
  var t8 = need8 - g8;
  addProblem({
    title:{ es:'Tabletas con conexión', en:'Tablets with a connection' }, showWork:true,
    stmt:{ es:'Una secundaria tiene ' + e8 + ' estudiantes. De cada diez, ' + n8 + ' no cuentan con conexión a internet en su casa y necesitan una tableta prestada para estudiar. La escuela ya consiguió ' + t8 + ' tabletas. ¿Cuántas tabletas le faltan para que ningún estudiante quede fuera?',
           en:'A secondary school has ' + e8 + ' students. Out of every ten, ' + n8 + ' have no internet connection at home and need a loaned tablet in order to study. The school has already obtained ' + t8 + ' tablets. How many tablets are still missing so that no student is left out?' },
    options:{ es: numOpts(g8, [need8, t8, g8 + 20]), en: numOpts(g8, [need8, t8, g8 + 20]) },
    correct:0,
    hint:{ es:'Averigua primero a cuántos estudiantes corresponde esa proporción del total y después descuenta lo que la escuela ya tiene.',
           en:'First work out how many students that proportion of the total comes to, then subtract what the school already has.' },
    explanation:{ es:'De ' + e8 + ' estudiantes, ' + n8 + ' de cada diez son ' + e8 + ' ÷ 10 × ' + n8 + ' = ' + need8 + ' estudiantes sin conexión. Como la escuela ya tiene ' + t8 + ' tabletas, faltan ' + need8 + ' − ' + t8 + ' = ' + g8,
                  en:'Out of ' + e8 + ' students, ' + n8 + ' in every ten come to ' + e8 + ' ÷ 10 × ' + n8 + ' = ' + need8 + ' students without a connection. Since the school already has ' + t8 + ' tablets, the missing ones are ' + need8 + ' − ' + t8 + ' = ' + g8 }
  }, rng);

  /* ── CONCEPTO 5 ─────────────────────────────────────────────── */
  addSection(S('CONCEPTO 5','CONCEPT 5'),
    '<h2>' + S('De la buena intención a la propuesta que funciona','From good intentions to a proposal that works') + '</h2>' +
    '<p>' + S('Proponer no es solo tener una buena idea. Una propuesta que sirve nace de un diagnóstico, pasa por la voz de quienes viven la barrera y termina con una revisión. Saltarse un paso suele salir caro: se instala algo que nadie usa, o se atiende un síntoma mientras la causa sigue en pie.',
              'Proposing is not just having a good idea. A proposal that works starts from a diagnosis, passes through the voice of those who live the barrier and ends with a review. Skipping a step usually costs dearly: something gets installed that nobody uses, or a symptom gets treated while the cause stays in place.') + '</p>' +
    '<p>' + S('En la escuela y en la colonia el orden importa tanto como el contenido. Escuchar después de decidir ya no cambia nada, y una medida sin seguimiento se apaga sola.',
              'At school and in the neighborhood the order matters as much as the content. Listening after deciding changes nothing anymore, and a measure with no follow up fades on its own.') + '</p>' +
    buildRuta(rng));
  rutRender();

  /* ── PROBLEMA 9 ─────────────────────────────────────────────── */
  addProblem(pick([
    { title:{ es:'El paso que faltó', en:'The step that was missing' }, showWork:false,
      stmt:{ es:'Un grupo consiguió instalar una rampa en la entrada de la escuela y dio por terminado el proyecto. Seis meses después la rampa está bloqueada con cajas del almacén y nadie la usa. ¿Qué paso de la ruta faltó?',
             en:'A group managed to install a ramp at the school entrance and considered the project finished. Six months later the ramp is blocked with storage boxes and nobody uses it. Which step of the route was missing?' },
      options:{ es:[
        'La revisión de los resultados después de aplicar la medida, para detectar y corregir lo que falla.',
        'El diagnóstico inicial, porque nunca se supo que había estudiantes que no podían entrar al edificio.',
        'La elección de la medida, porque una rampa no se dirigía a la barrera que enfrentaba ese grupo.',
        'La consecución de los recursos, porque el grupo nunca logró reunir el dinero para construir la obra.' ],
        en:[
        'Reviewing the results after applying the measure, in order to detect and correct what fails.',
        'The initial diagnosis, because nobody ever knew there were students unable to enter the building.',
        'Choosing the measure, because a ramp did not address the barrier that group was facing.',
        'Getting the resources, because the group never managed to raise the money for the work.' ] },
      correct:0,
      hint:{ es:'Fíjate en qué momento de la ruta se detuvo el grupo y qué habría detectado el paso siguiente.',
             en:'Notice where along the route the group stopped and what the next step would have detected.' },
      explanation:{ es:'El diagnóstico, la medida y los recursos sí ocurrieron: la rampa existe. Lo que faltó fue volver a mirar después. El seguimiento habría detectado las cajas y habría bastado con liberar el paso para que la rampa cumpliera su función.',
                    en:'Diagnosis, measure and resources did happen: the ramp exists. What was missing was looking again afterwards. Follow up would have spotted the boxes, and clearing the path would have been enough for the ramp to do its job.' } },
    { title:{ es:'El paso que faltó', en:'The step that was missing' }, showWork:false,
      stmt:{ es:'Sin consultar a nadie, un comité compró veinte tabletas para las familias sin internet. Al entregarlas descubrió que en esas casas tampoco hay señal, así que las tabletas quedaron guardadas. ¿Qué paso de la ruta faltó?',
             en:'Without consulting anyone, a committee bought twenty tablets for families without internet. On delivery it found that those homes have no signal either, so the tablets ended up stored away. Which step of the route was missing?' },
      options:{ es:[
        'Escuchar a las personas afectadas antes de decidir, porque ellas conocían la falta de señal en sus casas.',
        'Revisar los resultados al final del ciclo, porque el comité no llevó un registro de las entregas.',
        'Conseguir los recursos necesarios, porque veinte tabletas resultaron insuficientes para todas las familias.',
        'Nombrar a una persona responsable del proyecto, porque nadie firmó el acta de la compra.' ],
        en:[
        'Listening to the affected people before deciding, because they knew about the lack of signal at home.',
        'Reviewing the results at the end of the year, because the committee kept no record of the deliveries.',
        'Getting the necessary resources, because twenty tablets turned out to be too few for all the families.',
        'Naming a person in charge of the project, because nobody signed the purchase record.' ] },
      correct:0,
      hint:{ es:'Pregúntate quién tenía la información que habría evitado la compra equivocada y en qué momento debía aportarla.',
             en:'Ask who held the information that would have prevented the wrong purchase and when they should have given it.' },
      explanation:{ es:'El comité tenía recursos y buena intención, pero decidió antes de escuchar. Las familias sabían que sin señal la tableta no resuelve nada; consultarlas habría llevado a otra medida, como puntos de conexión comunitarios o materiales que funcionen sin internet.',
                    en:'The committee had resources and good intentions, but it decided before listening. The families knew a tablet solves nothing without signal; consulting them would have led to another measure, such as community connection points or materials that work offline.' } }
  ], rng), rng);

  /* ── PROBLEMA 10 ────────────────────────────────────────────── */
  addProblem(pick([
    { title:{ es:'Proponer para el bienestar colectivo', en:'Proposing for collective wellbeing' }, showWork:false,
      stmt:{ es:'En una secundaria, las estudiantes de una comunidad alejada faltan mucho porque el camino se inunda durante la temporada de lluvias y no hay transporte. El comité estudiantil quiere atender el problema de fondo. ¿Qué propuesta conviene presentar?',
             en:'At a secondary school, the students from a remote community miss many classes because the road floods during the rainy season and there is no transport. The student committee wants to address the root problem. Which proposal should it present?' },
      options:{ es:[
        'Gestionar un transporte escolar para esa ruta, con una partida revisada cada ciclo y una persona responsable del seguimiento.',
        'Organizar una rifa para comprar impermeables a las estudiantes que más faltaron durante este mes.',
        'Colocar en cada salón un cartel que invite al grupo a valorar el esfuerzo de quienes viven lejos.',
        'Autorizar que esas estudiantes justifiquen sus faltas presentando una carta firmada por su familia.' ],
        en:[
        'Arranging school transport for that route, with a budget line reviewed each year and a person in charge of follow up.',
        'Organizing a raffle to buy raincoats for the students who missed the most classes this month.',
        'Putting a poster in every classroom inviting the group to value the effort of those who live far away.',
        'Allowing those students to justify their absences with a letter signed by their family.' ] },
      correct:0,
      hint:{ es:'Compara las opciones con cuatro criterios: si atacan la causa, si alcanzan a todo el grupo, si respetan la dignidad y si pueden continuar.',
             en:'Compare the options against four criteria: whether they hit the cause, reach the whole group, respect dignity and can continue.' },
      explanation:{ es:'Solo el transporte actúa sobre la causa, que es la imposibilidad de llegar, y alcanza a todas las estudiantes de esa ruta. La partida revisada cada ciclo y la persona responsable le dan continuidad. La rifa dura un mes, el cartel no mueve el camino y justificar faltas administra la ausencia sin devolver las clases perdidas.',
                    en:'Only transport acts on the cause, which is the impossibility of getting there, and it reaches every student on that route. The budget line reviewed each year and the person in charge give it continuity. The raffle lasts a month, the poster does not move the road, and justifying absences manages the absence without giving back the lost classes.' } },
    { title:{ es:'Proponer para el bienestar colectivo', en:'Proposing for collective wellbeing' }, showWork:false,
      stmt:{ es:'En una colonia, las personas adultas mayores dejaron de acudir al centro comunitario porque la banqueta está rota y el trámite de inscripción solo se hace en línea. El comité vecinal quiere que vuelvan a participar. ¿Qué propuesta conviene presentar?',
             en:'In a neighborhood, older adults stopped going to the community center because the sidewalk is broken and enrollment is handled only online. The neighborhood committee wants them to take part again. Which proposal should it present?' },
      options:{ es:[
        'Reparar la banqueta y abrir la inscripción presencial permanente, con presupuesto anual y una persona encargada de revisarla.',
        'Realizar una comida de bienvenida para las personas adultas mayores el día del aniversario de la colonia.',
        'Publicar en redes sociales un video que explique paso a paso cómo llenar el formulario en línea.',
        'Pedir a las familias que acompañen a sus mayores al centro comunitario cada vez que haya actividad.' ],
        en:[
        'Repairing the sidewalk and opening permanent in person enrollment, with an annual budget and someone in charge of reviewing it.',
        'Holding a welcome meal for older adults on the neighborhood anniversary day.',
        'Posting a social media video explaining step by step how to fill out the online form.',
        'Asking families to walk their older relatives to the community center whenever there is an activity.' ] },
      correct:0,
      hint:{ es:'Identifica las dos barreras del caso y busca la opción que actúa sobre ambas y puede continuar el próximo año.',
             en:'Identify the two barriers in the case and look for the option that acts on both and can continue next year.' },
      explanation:{ es:'El caso tiene dos barreras, una física y una de trámite, y solo la primera opción quita las dos, además de asegurar presupuesto y responsable. La comida es un evento aislado, el video repite el canal en línea que ya excluye, y depender de la familia deja el acceso en manos de la disponibilidad ajena.',
                    en:'The case has two barriers, one physical and one procedural, and only the first option removes both while securing budget and a person in charge. The meal is an isolated event, the video repeats the online channel that already excludes, and depending on family leaves access in the hands of someone else availability.' } }
  ], rng), rng);
}
</script>

<!-- LIAXA ANALYTICS -->
<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbykkuJ_apGq3vALIFd4mr3acu81c7K4OKxW-DZ-i52Ceyl3lOanXMdvbS9SIXPrLQBm/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'Igualdad de Derechos y Bienestar Colectivo';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
</body>
</html>
