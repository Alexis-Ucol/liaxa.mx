<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mujeres y Hombres en la Historia de la Química</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--gold-bg); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }

/* ── WIDGETS (concept manipulatives) ── */
.wgt { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.1rem; margin:1.1rem 0; }
.iw-tag { font-family:'Crimson Pro',serif; font-size:1.1rem; font-weight:700; margin-bottom:.2rem; color:var(--text); }
.iw-sub { font-family:'IBM Plex Sans',sans-serif; font-size:.82rem; font-weight:400; color:var(--text3); margin-top:.15rem; margin-bottom:.7rem; line-height:1.5; }
.wmsg { margin-top:.75rem; padding:.6rem .85rem; border-radius:0 8px 8px 0; border-left:3px solid var(--border); background:var(--surface2); color:var(--text2); font-size:.83rem; }
.wmsg.ok   { background:var(--ok-bg);   color:var(--ok);    border-left-color:var(--ok); }
.wmsg.warn { background:var(--gold-bg); color:var(--text2); border-left-color:var(--gold); }
.wbtn { margin-top:.75rem; margin-right:.4rem; background:var(--green); color:#fff; border:none; border-radius:8px; padding:.55rem 1.1rem; font-size:.83rem; font-weight:600; cursor:pointer; min-height:44px; }
.wbtn:hover { background:var(--green-dark); }
.wprog { font-size:.72rem; color:var(--text3); margin-top:.55rem; font-family:'IBM Plex Mono',monospace; }
.wcase { background:var(--surface2); border-radius:8px; padding:.75rem .9rem; font-size:.86rem; color:var(--text); margin-bottom:.7rem; }
.chips { display:flex; flex-wrap:wrap; gap:.45rem; margin:.6rem 0; }
.chip { border:1.5px solid var(--border); border-radius:22px; padding:.4rem .85rem; font-size:.8rem; cursor:pointer; background:var(--surface2); color:var(--text2); min-height:44px; display:flex; align-items:center; transition:all .14s; }
.chip:hover { border-color:var(--green); }
.chip.used { opacity:.8; cursor:default; font-family:'IBM Plex Mono',monospace; font-size:.74rem; min-height:34px; }
.chip.used:hover { border-color:var(--border); }

/* timeline */
.tl-list { display:flex; flex-direction:column; gap:.45rem; margin:.7rem 0; }
.tl-chip { border:1.5px solid var(--border); border-radius:9px; padding:.55rem .75rem; font-size:.81rem; cursor:pointer; background:var(--surface2); color:var(--text2); min-height:44px; display:flex; align-items:center; gap:.55rem; transition:all .14s; }
.tl-chip:hover { border-color:var(--green); }
.tl-chip.sel { border-color:var(--gold); background:var(--gold-bg); color:var(--text); font-weight:600; }
.tl-chip.locked { border-color:var(--ok); background:var(--ok-bg); color:var(--ok); cursor:default; }
.tl-num { font-family:'IBM Plex Mono',monospace; color:var(--text3); font-weight:700; font-size:.78rem; flex-shrink:0; }

/* match */
.mcols { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin:.6rem 0; }
.colh { font-size:.7rem; text-transform:uppercase; letter-spacing:.07em; color:var(--text3); margin-bottom:.35rem; }
.mitem { border:1.5px solid var(--border); border-radius:9px; padding:.5rem .65rem; font-size:.78rem; cursor:pointer; background:var(--surface2); color:var(--text2); margin-bottom:.4rem; min-height:44px; display:flex; align-items:center; transition:all .14s; }
.mitem:hover { border-color:var(--green); }
.mitem.sel  { border-color:var(--gold); background:var(--gold-bg); color:var(--text); font-weight:600; }
.mitem.done { border-color:var(--ok); background:var(--ok-bg); color:var(--ok); cursor:default; }

/* meters */
.dlist { display:flex; flex-direction:column; gap:.7rem; margin:.6rem 0; }
.dq { font-size:.78rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.3rem; }
.optbox { border:1.5px solid var(--border); border-radius:9px; padding:.55rem .7rem; font-size:.79rem; cursor:pointer; background:var(--surface2); color:var(--text2); margin-bottom:.4rem; min-height:44px; display:flex; align-items:center; transition:all .14s; }
.optbox:hover { border-color:var(--green); }
.optbox.sel  { border-color:var(--green); background:var(--green-bg); color:var(--green-dark); font-weight:600; }
.optbox.done { border-color:var(--ok); background:var(--ok-bg); color:var(--ok); cursor:default; }
.mtrs { margin-top:.8rem; }
.mtr { margin-bottom:.55rem; }
.mtrlbl { display:flex; justify-content:space-between; gap:.6rem; font-size:.73rem; color:var(--text3); margin-bottom:.2rem; }
.mtrtrack { height:12px; border:1px solid var(--border); border-radius:6px; background:var(--surface2); overflow:hidden; }
.mtrfill { height:100%; width:0%; background:var(--gold); transition:width .35s; }
.mtrfill.ok { background:var(--ok); }

/* reflect */
.reflect-prompt { font-size:.9rem; color:var(--text2); margin:.4rem 0 .8rem; }

@media (max-width:600px) {
  .mcols { grid-template-columns:1fr; }
  .wgt { padding:.85rem; }
  .wcase { font-size:.83rem; }
  .mitem, .optbox { font-size:.78rem; }
}
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Mujeres y Hombres en la Historia de la Química</div>
    <div class="wcourse" id="wcourse-el">Química · 3° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">

function setLang(l){
  LANG = l;

    var res = document.getElementById('s_results'); res.style.display='none'; res.classList.remove('vis');

/* ── Attempt counter + seed (Rule 4): seed = name+group+attempt ── */
function getAttemptKey(name, group){ return 'qui3_t01_g02__att__' + (name+'__'+group).replace(/\s+/g,'_'); }
function nextAttempt(name, group){ var k=getAttemptKey(name,group),n=0; try{n=parseInt(localStorage.getItem(k)||'0',10)||0;}catch(e){} n++; try{localStorage.setItem(k,String(n));}catch(e){} return n; }
function currentAttempt(name, group){ var k=getAttemptKey(name,group); try{return parseInt(localStorage.getItem(k)||'1',10)||1;}catch(e){return 1;} }
/* ================================================
   STATE
   ================================================ */
var studentData   = {};
var problems      = [];

/* ================================================
   SESSION PERSISTENCE  (localStorage)
   ================================================ */
function lsKey() {
  var n = (studentData.name  || '').trim();
  var g = (studentData.group || '').trim();
  return 'qui3_t01_g02__' + (n + '__' + g).replace(/\s+/g, '_');
}

function saveSession() {
  if (!studentData.name) return;
  var drawings = [], texts = [], photos = [];
  problems.forEach(function(p, i) {
    var dc = document.getElementById('dc' + i);
    if (dc && dc.width) {
      var blank = document.createElement('canvas');
      blank.width = dc.width; blank.height = dc.height;
      drawings.push(dc.toDataURL() === blank.toDataURL() ? null : dc.toDataURL('image/png'));
    } else { drawings.push(null); }
    var ta = document.getElementById('ta' + i);
    texts.push(ta ? ta.value : '');
    var pp = document.getElementById('pp' + i);
    photos.push((pp && pp.src && pp.src.indexOf('data:') === 0) ? pp.src : null);
  });
  var state = {
    name: studentData.name, group: studentData.group,
    answeredCount: answeredCount, correctCount: correctCount,
    choices: problems.map(function(p) { return p.studentChoice; }),
    drawings: drawings, texts: texts, photos: photos
  };
  try { localStorage.setItem(lsKey(), JSON.stringify(state)); } catch(e) {}
}

function loadSession(name, group) {
  var key = 'qui3_t01_g02__' + (name + '__' + group).replace(/\s+/g, '_');
  try { var r = localStorage.getItem(key); return r ? JSON.parse(r) : null; } catch(e) { return null; }
}

function restoreSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  var saved = loadSession(name, group);
  if (!saved) return;
  document.getElementById('restoreBar').style.display = 'none';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = currentAttempt(name, group);
  buildLesson(seededRng(name + group + att));
  document.getElementById('welcomeScreen').style.display = 'none';

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

    doc.setFontSize(7.5); var exLines = doc.splitTextToSize('Solución: '+expRaw, TW-18).slice(0,4);
    var ansBoxH = 8 + chLines.length*5.5 + coLines.length*5 + exLines.length*5 + 6;

    ay += chLines.length*5.5 + 3;
    doc.setTextColor(26,106,74); doc.setFontSize(8); doc.setFont('helvetica','normal');
    coLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    ay += coLines.length*5 + 3;
    doc.setTextColor(90,85,80); doc.setFontSize(7.5);
    exLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });

    doc.setFontSize(7); doc.setFont('helvetica','bold');
    doc.rect(M,wy,TW,8,'F'); doc.text('TRABAJO DEL ALUMNO', M+4, wy+5.5);
    wy += 11;

    var dc = document.getElementById('dc'+i);
    if (dc) {
      try {
        var imgD = dc.toDataURL('image/png');
        var ar   = dc.height / dc.width;
        var iw   = TW;
        var ih   = Math.min(iw * ar, 68);
        doc.addImage(imgD, 'PNG', M, wy, iw, ih);
        wy += ih + 4;
      } catch(e) {}
    }

    var ta = document.getElementById('ta'+i);
    if (ta && ta.value.trim()) {
      if (wy > PH-30) { doc.addPage(); wy = 20; }
      doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('courier','normal');

      taLines.slice(0,16).forEach(function(ln) {

      if (wy > PH-55) { doc.addPage(); wy = 20; }
      try { doc.addImage(pp.src, 'JPEG', M, wy, TW, 68); wy += 72; } catch(e) {}
    }
  }

  // ── Footer on every page ──
  var pages = doc.internal.getNumberOfPages();
  for (var p = 1; p <= pages; p++) {
    doc.setPage(p);
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0, PH-3, PW, 3, 'F');

  }

  doc.save('qui3_t01_g02_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf');

function S(es, en){ return LANG === 'es' ? es : en; }

function addSection(tag, html){

/* Shuffles options (Rule 7) keeping ES/EN aligned, then builds the card inline (Rule 1/5). */
function addProblem(v, rng){
  var n = v.options.es.length, idx = [], k;
  for (k = 0; k < n; k++) idx.push(k);
  for (k = n - 1; k > 0; k--) {
    var j = Math.floor(rng() * (k + 1));
    var tmp = idx[k]; idx[k] = idx[j]; idx[j] = tmp;
  }
  var langOpts = (LANG === 'es') ? v.options.es : v.options.en;
  var prob = {
    title:        v.title[LANG],
    questionText: v.stmt[LANG],
    fn:           v.fn || '',
    hint:         v.hint[LANG],
    explanation:  v.explanation[LANG],
    options:      idx.map(function(o){ return langOpts[o]; }),
    correctIdx:   idx.indexOf(v.correct),
    showWork:     !!v.showWork,
    studentChoice:null, pendingChoice:null
  };
  problems.push(prob);
  buildOneCard(prob, problems.length - 1);
}

/* Seeded permutation that never comes back already ordered. */
function shufflePerm(n, rng){
  var a = [], i, j, t;
  for (i = 0; i < n; i++) a.push(i);
  for (i = n - 1; i > 0; i--) { j = Math.floor(rng() * (i + 1)); t = a[i]; a[i] = a[j]; a[j] = t; }
  var sorted = true;
  for (i = 0; i < n; i++) if (a[i] !== i) sorted = false;
  if (sorted && n > 1) { t = a[0]; a[0] = a[1]; a[1] = t; }
  return a;
}

function wgtHead(title, sub){
  return '<div class="iw-tag">' + title + '<div class="iw-sub">' + sub + '</div></div>';
}

/* ================================================
   WIDGET 1 - LA FILA DEL TIEMPO QUIMICO
   Five workshop achievements from five different cultures arrive scrambled.
   The student taps two cards to swap them and the row rebuilds on every tap.
   A failed check names the card that is out of place and says whether it goes
   earlier or later, never just wrong. Third miss reveals the row with its dates
   (Rule 8, pattern A).
   ================================================ */
var LIN = null;

function buildLinea(rng){
  var sets = [
    [ { es:'Tapputi, perfumista en Babilonia, deja escrito en una tablilla su método para destilar esencias',
        en:'Tapputi, a perfume maker in Babylon, writes her method for distilling essences on a clay tablet',
        dEs:'hacia 1200 a. C.', dEn:'around 1200 BCE' },
      { es:'Maria la Judia, en Alejandria, describe el calentamiento en baño de agua y un aparato para destilar',
        en:'Maria the Jewess, in Alexandria, describes heating in a water bath and an apparatus for distilling',
        dEs:'siglo III', dEn:'3rd century' },
      { es:'Los talleres mayas fijan el añil sobre una arcilla porosa y obtienen un azul que no se destiñe',
        en:'Maya workshops lock indigo into a porous clay and obtain a blue that does not fade',
        dEs:'siglo VI', dEn:'6th century' },
      { es:'Jabir ibn Hayyan ordena por escrito la destilación, la cristalización y los instrumentos del taller',
        en:'Jabir ibn Hayyan sets out in writing distillation, crystallization and the instruments of the workshop',
        dEs:'siglo VIII', dEn:'8th century' },
      { es:'Andres Manuel del Rio identifica un elemento nuevo en un mineral de Zimapan',
        en:'Andres Manuel del Rio identifies a new element in a mineral from Zimapan',
        dEs:'1801', dEn:'1801' } ],
    [ { es:'Los talleres andinos dominan la aleación de oro y cobre para cubrir de dorado piezas de metal',
        en:'Andean workshops master the gold and copper alloy used to give metal pieces a golden surface',
        dEs:'siglo I', dEn:'1st century' },
      { es:'Los talleres de la India producen un acero de alta calidad controlando el carbono en el crisol',
        en:'Workshops in India produce high quality steel by controlling the carbon inside the crucible',
        dEs:'siglo III', dEn:'3rd century' },
      { es:'Alquimistas chinos registran la mezcla de salitre, azufre y carbón que arde sin aire exterior',
        en:'Chinese alchemists record the mixture of saltpeter, sulfur and charcoal that burns without outside air',
        dEs:'siglo IX', dEn:'9th century' },
      { es:'Las minas de Zawar, en la India, destilan zinc metálico en hornos de retorta a gran escala',
        en:'The mines of Zawar, in India, distill metallic zinc in retort furnaces on a large scale',
        dEs:'siglo XII', dEn:'12th century' },
      { es:'Antoine y Marie-Anne Lavoisier publican con láminas los experimentos de combustión medidos en balanza',
        en:'Antoine and Marie-Anne Lavoisier publish, with engraved plates, combustion experiments measured on a balance',
        dEs:'1789', dEn:'1789' } ]
  ];
  var ev = sets[Math.floor(rng() * sets.length)];
  LIN = { ev:ev, order:shufflePerm(ev.length, rng), sel:null, tries:0, done:false, note:null, noteOk:false };
  return '<div class="wgt" data-widget="timeline" id="wLinea">' +
      wgtHead(S('La fila del tiempo químico','The chemical time row'),
              S('Cinco talleres de cinco culturas distintas llegaron revueltos. Toca dos tarjetas para intercambiarlas y deja la fila del más antiguo al más reciente.',
                'Five workshops from five different cultures arrived scrambled. Tap two cards to swap them and leave the row running from oldest to most recent.')) +
      '<div id="linBox"></div>' +
    '</div>';
}

function linRender(){
  if (!LIN) return;
  var box = document.getElementById('linBox');
  if (!box) return;
  var chips = LIN.order.map(function(ei, pos){
    var e = LIN.ev[ei];
    var cls = 'tl-chip' + (LIN.sel === pos ? ' sel' : '') + (LIN.done ? ' locked' : '');
    var date = LIN.done ? ' <b>(' + (LANG === 'es' ? e.dEs : e.dEn) + ')</b>' : '';
    return '<div class="' + cls + '" onclick="linTap(' + pos + ')"><span class="tl-num">' + (pos + 1) + '</span>' +
           '<span>' + e[LANG] + date + '</span></div>';
  }).join('');
  var msg = LIN.note || S('Ninguna de estas culturas copió a la otra: cada una resolvió su problema con lo que tenía a la mano. Colócalas en el orden en que ocurrieron.',
                          'None of these cultures copied another: each solved its own problem with what it had at hand. Place them in the order in which they happened.');
  box.innerHTML =
    '<div class="tl-list">' + chips + '</div>' +
    (LIN.done ? '' : '<button class="wbtn" onclick="linCheck()">' + S('Revisar la fila','Check the row') + '</button>') +
    '<div class="wmsg ' + (LIN.note ? (LIN.noteOk ? 'ok' : 'warn') : '') + '">' + msg + '</div>';
}

function linTap(pos){
  if (!LIN || LIN.done) return;
  if (LIN.sel === null) { LIN.sel = pos; }
  else if (LIN.sel === pos) { LIN.sel = null; }
  else { var t = LIN.order[LIN.sel]; LIN.order[LIN.sel] = LIN.order[pos]; LIN.order[pos] = t; LIN.sel = null; }
  LIN.note = null; LIN.noteOk = false;
  linRender();
}

function linCheck(){
  if (!LIN || LIN.done) return;
  var ok = true, bad = -1, i;
  for (i = 0; i < LIN.order.length; i++) if (LIN.order[i] !== i) { ok = false; if (bad < 0) bad = i; }
  if (ok) {
    LIN.done = true; LIN.noteOk = true;
    LIN.note = S('Fila completa. Mira las fechas: entre la primera y la última pasan tres mil años y cuatro continentes, y todas son química hecha en un taller.',
                 'Row complete. Look at the dates: three thousand years and four continents separate the first from the last, and all of them are chemistry done in a workshop.');
    linRender();
    return;
  }
  LIN.tries++;
  if (LIN.tries >= 3) {
    LIN.order = LIN.ev.map(function(_, k){ return k; });
    LIN.done = true; LIN.noteOk = false;
    LIN.note = S('Este es el orden real, ya con sus fechas. Fíjate en algo: la lista no avanza de una cultura a otra por herencia, sino por talleres separados que trabajaron el mismo tipo de problema.',
                 'This is the real order, now with its dates. Notice one thing: the list does not move from one culture to the next by inheritance, but through separate workshops working on the same kind of problem.');
    linRender();
    return;
  }
  LIN.noteOk = false;
  LIN.note = (LIN.order[bad] > bad)
    ? S('Todavía no. La tarjeta número ' + (bad + 1) + ' ocurrió más tarde de lo que su lugar indica: muévela hacia abajo.',
        'Not yet. Card number ' + (bad + 1) + ' happened later than its place suggests: move it down.')
    : S('Todavía no. La tarjeta número ' + (bad + 1) + ' es más antigua de lo que su lugar indica: muévela hacia arriba.',
        'Not yet. Card number ' + (bad + 1) + ' is older than its place suggests: move it up.');
  linRender();
}

function parDone(k){ return PAR.done.indexOf(k) !== -1; }

function parRender(){
  if (!PAR) return;
  var box = document.getElementById('parBox');
  if (!box) return;
  if (PAR.done.length >= PAR.it.length) {
    box.innerHTML = '<div class="wmsg ok">' +
      S('Los cinco quedaron emparejados. Ninguno de estos aportes cabe en una sola frase de libro: cada uno abrió algo que antes no se podía hacer.',
        'All five are matched. None of these contributions fits in a single textbook line: each opened up something that could not be done before.') + '</div>';
    return;
  }
  var lefts = PAR.left.map(function(k){
    var cls = 'mitem' + (parDone(k) ? ' done' : (PAR.sel === k ? ' sel' : ''));
    return '<div class="' + cls + '" onclick="parPickName(' + k + ')">' + PAR.it[k].p[LANG] + '</div>';
  }).join('');
  var rights = PAR.right.map(function(k){
    var cls = 'mitem' + (parDone(k) ? ' done' : '');
    return '<div class="' + cls + '" onclick="parPickWork(' + k + ')">' + PAR.it[k].c[LANG] + '</div>';
  }).join('');
  var msg = PAR.note || S('Empieza por el nombre que reconozcas y usa los otros para descartar. Cada aporte dice qué se volvió posible, no solo qué se descubrió.',
                          'Start with the name you recognize and use the others to rule things out. Each contribution says what became possible, not only what was discovered.');
  box.innerHTML =
    '<div class="mcols">' +
      '<div><div class="colh">' + S('Nombres','Names') + '</div>' + lefts + '</div>' +
      '<div><div class="colh">' + S('Aportes','Contributions') + '</div>' + rights + '</div>' +
    '</div>' +
    '<div class="wmsg ' + (PAR.note ? (PAR.noteOk ? 'ok' : 'warn') : '') + '">' + msg + '</div>' +
    '<div class="wprog">' + PAR.done.length + ' / ' + PAR.it.length + '</div>';
}

function parPickName(k){
  if (!PAR || parDone(k)) return;
  PAR.sel = (PAR.sel === k) ? null : k;
  PAR.tries = 0; PAR.note = null; PAR.noteOk = false;
  parRender();
}

function parPickWork(k){
  if (!PAR || parDone(k)) return;
  if (PAR.sel === null) {
    PAR.noteOk = false;
    PAR.note = S('Falta el nombre: toca primero a quién le atribuyes ese aporte.',
                 'The name is missing: first tap who you attribute that contribution to.');
    parRender();
    return;
  }
  if (k === PAR.sel) {
    PAR.done.push(k);
    PAR.noteOk = true; PAR.tries = 0;
    PAR.note = S('Correcto. ' + PAR.it[k].w.es, 'Correct. ' + PAR.it[k].w.en);
    PAR.sel = null;
    parRender();
    return;
  }
  PAR.tries++;
  if (PAR.tries >= 3) {
    var s = PAR.sel;
    PAR.done.push(s);
    PAR.noteOk = false;
    PAR.note = S(PAR.it[s].p.es + ' va con: ' + PAR.it[s].c.es + '. ' + PAR.it[s].w.es,
                 PAR.it[s].p.en + ' goes with: ' + PAR.it[s].c.en + '. ' + PAR.it[s].w.en);
    PAR.sel = null; PAR.tries = 0;
    parRender();
    return;
  }
  PAR.noteOk = false;
  PAR.note = S('Ese aporte es de otra persona. Vuelve a leerlo y pregúntate con qué técnica se consigue: separar, medir la forma de una molécula, ordenar o sintetizar.',
               'That contribution belongs to somebody else. Read it again and ask which technique achieves it: separating, measuring the shape of a molecule, ordering or synthesizing.');
  parRender();
}

/* ================================================
   WIDGET 3 - EL TABLERO DE LA CONFIANZA
   Laboratory practices arrive one by one with no label. The student sends each
   to one of two piles and the two tallies rebuild live. A miss answers with the
   question that separates the piles; the third miss files the card and explains
   why it belonged there (Rule 8, pattern A).
   ================================================ */
var CNF = null;
var CNF_BINS = { es:['Sostiene la confianza','Rompe la confianza'],
                 en:['Holds trust up','Breaks trust'] };

function buildConfianza(rng){
  var sets = [
    [ { es:'Publicar el procedimiento completo para que otro laboratorio lo repita', en:'Publishing the full procedure so another laboratory can repeat it', bin:0,
        wes:'Lo que se puede repetir deja de depender de la palabra de quien lo anunció.',
        wen:'Whatever can be repeated stops depending on the word of whoever announced it.' },
      { es:'Omitir del crédito a quien realizó las mediciones', en:'Leaving out of the credit whoever took the measurements', bin:1,
        wes:'El trabajo existió: quitar el nombre no lo borra, solo lo esconde.',
        wen:'The work existed: removing the name does not erase it, it only hides it.' },
      { es:'Informar también los resultados que contradicen la hipótesis propia', en:'Reporting also the results that contradict your own hypothesis', bin:0,
        wes:'Lo que no encaja es justo lo que permite corregir a tiempo.',
        wen:'What does not fit is precisely what allows a correction in time.' },
      { es:'Presentar como propio un método publicado años antes por otro equipo', en:'Presenting as your own a method published years earlier by another team', bin:1,
        wes:'El método tiene autoría, y usarlo sin citarlo se lleva un crédito ajeno.',
        wen:'The method has authorship, and using it without citing it takes credit that belongs to somebody else.' },
      { es:'Nombrar a la comunidad que aportó el saber sobre la planta utilizada', en:'Naming the community that contributed the knowledge about the plant used', bin:0,
        wes:'Ese saber fue parte del hallazgo, así que pertenece al relato y al crédito.',
        wen:'That knowledge was part of the finding, so it belongs in the account and in the credit.' },
      { es:'Anunciar un hallazgo en un cartel publicitario antes de que nadie lo revise', en:'Announcing a finding on an advertising poster before anybody reviews it', bin:1,
        wes:'Sin revisión previa, el anuncio pide creer en lugar de ofrecer algo que comprobar.',
        wen:'With no prior review, the announcement asks for belief instead of offering something to check.' } ],
    [ { es:'Guardar el registro de cada medición, incluidas las que salieron mal', en:'Keeping the record of every measurement, including the ones that went wrong', bin:0,
        wes:'Una medición fallida explica después por qué un resultado no se repite.',
        wen:'A failed measurement later explains why a result does not repeat.' },
      { es:'Ajustar un dato para que la gráfica quede más ordenada', en:'Adjusting a data point so the graph looks tidier', bin:1,
        wes:'Ese punto dejó de ser una medición y pasó a ser una decoración.',
        wen:'That point stopped being a measurement and became a decoration.' },
      { es:'Citar el artículo del que se tomó la fórmula empleada', en:'Citing the article the formula used was taken from', bin:0,
        wes:'La cita deja el camino abierto para que cualquiera revise de dónde viene el dato.',
        wen:'The citation leaves the path open for anyone to check where the data came from.' },
      { es:'Firmar como autor único un trabajo hecho entre cuatro personas', en:'Signing as sole author a work done by four people', bin:1,
        wes:'La firma describe quién hizo el trabajo, y aquí describe algo que no ocurrió.',
        wen:'The signature describes who did the work, and here it describes something that did not happen.' },
      { es:'Repetir el experimento tres veces antes de comunicar el resultado', en:'Repeating the experiment three times before communicating the result', bin:0,
        wes:'La repetición separa un resultado de una casualidad.',
        wen:'Repetition separates a result from a coincidence.' },
      { es:'Callar un efecto no deseado observado durante las pruebas', en:'Staying silent about an unwanted effect observed during the tests', bin:1,
        wes:'Quien decida usar ese producto necesita ese dato más que nadie.',
        wen:'Whoever decides to use that product needs that piece of information more than anybody.' } ]
  ];
  var items = sets[Math.floor(rng() * sets.length)];
  CNF = { items:items, order:shufflePerm(items.length, rng), i:0, tries:0, tally:[0,0], done:false, lock:false, note:null, noteOk:false };
  return '<div class="wgt" data-widget="classify" id="wCredito">' +
      wgtHead(S('El tablero de la confianza','The trust board'),
              S('Cada tarjeta describe algo que ocurre en un laboratorio real. Mándala al montón que le toca y observa cómo se llenan los dos.',
                'Each card describes something that happens in a real laboratory. Send it to the pile it belongs in and watch the two fill up.')) +
      '<div id="cnfBox"></div>' +
    '</div>';
}

function cnfRender(){
  if (!CNF) return;
  var box = document.getElementById('cnfBox');
  if (!box) return;
  var names = CNF_BINS[LANG];
  var tal = '<div class="chips">' + names.map(function(b, k){
    return '<div class="chip used">' + b + ': ' + CNF.tally[k] + '</div>';
  }).join('') + '</div>';
  if (CNF.done) {
    box.innerHTML = tal + '<div class="wmsg ok">' +
      S('Tablero completo. Fíjate en el montón de la derecha: ninguna de esas prácticas falsea la naturaleza, todas falsean el registro de lo que se hizo, y por eso se notan tarde.',
        'Board complete. Look at the right hand pile: none of those practices falsifies nature, all of them falsify the record of what was done, and that is why they show up late.') + '</div>';
    return;
  }
  var it = CNF.items[CNF.order[CNF.i]];
  var msg = CNF.note || S('Una pregunta basta para clasificar: después de esta práctica, ¿alguien de fuera puede comprobar lo que se afirma?',
                          'One question is enough to sort them: after this practice, can somebody from outside check what is being claimed?');
  box.innerHTML =
    '<div class="wcase">' + it[LANG] + '</div>' +
    '<div class="chips">' + names.map(function(b, k){
        return '<div class="chip" onclick="cnfPick(' + k + ')">' + b + '</div>';
      }).join('') + '</div>' +
    tal +
    '<div class="wmsg ' + (CNF.note ? (CNF.noteOk ? 'ok' : 'warn') : '') + '">' + msg + '</div>' +
    '<div class="wprog">' + (CNF.i + 1) + ' / ' + CNF.items.length + '</div>';
}

function cnfPick(k){
  if (!CNF || CNF.done || CNF.lock) return;
  var it = CNF.items[CNF.order[CNF.i]];
  if (k === it.bin) {
    CNF.tally[k]++; CNF.tries = 0; CNF.noteOk = true;
    CNF.note = S('Así es. ' + it.wes, 'That is it. ' + it.wen);
    CNF.i++;
    if (CNF.i >= CNF.items.length) CNF.done = true;
    cnfRender();
    return;
  }
  CNF.tries++;
  if (CNF.tries >= 3) {
    CNF.tally[it.bin]++; CNF.tries = 0; CNF.noteOk = false;
    CNF.note = S('Esta tarjeta iba en ' + CNF_BINS.es[it.bin] + '. ' + it.wes,
                 'This card belonged in ' + CNF_BINS.en[it.bin] + '. ' + it.wen);
    CNF.lock = true;
    cnfRender();
    setTimeout(function(){
      if (!CNF) return;
      CNF.lock = false;
      CNF.i++;
      if (CNF.i >= CNF.items.length) CNF.done = true;
      cnfRender();
    }, 1500);
    return;
  }
  CNF.noteOk = false;
  CNF.note = (k === 0)
    ? S('Todavía no. Para este montón, la práctica tendría que dejar a alguien de fuera en condiciones de revisar: pregúntate si aquí queda algo publicado, citado o registrado.',
        'Not yet. For this pile the practice would have to leave somebody outside able to review: ask whether anything here ends up published, cited or recorded.')
    : S('Todavía no. Para este montón, algo del registro tendría que quedar incompleto o cambiado: revisa si aquí se omite, se ajusta o se calla algo.',
        'Not yet. For this pile something in the record would have to end up incomplete or altered: check whether anything here is omitted, adjusted or silenced.');
  cnfRender();
}

/* ================================================
   WIDGET 4 - LOS TRES MEDIDORES DE LA COMPRA
   Three purchase decisions feed three meters that move on every tap. The student
   keeps re-choosing until the three clear the mark; a failed check names the
   meter that is lagging and where to look. Reveal on the third failed check
   (Rule 8, pattern A).
   ================================================ */
var CMP = null;
var CMP_META = 70;
var CMP_LBL = { es:['Residuo que no se genera','Sustancias que no llegan al drenaje','Material que se sigue aprovechando'],
                en:['Waste that is never generated','Substances that never reach the drain','Material that keeps being used'] };

function buildCompra(rng){
  var scen = [
    { intro:{ es:'Tu familia surte los productos de limpieza del mes y esta vez tú decides las tres cosas.',
              en:'Your family is stocking up on this month cleaning products and this time you make the three decisions.' },
      best:[1,2,0],
      dec:[
        { q:{ es:'Qué presentación eliges', en:'Which presentation you choose' }, opts:[
          { es:'El limpiador ya diluido en un envase de cinco litros, que se compra y se tira.',
            en:'The ready diluted cleaner in a five liter container, bought and thrown away.', v:[10,10,5] },
          { es:'El concentrado en envase pequeño, que se diluye en casa con agua de la llave.',
            en:'The concentrate in a small bottle, diluted at home with tap water.', v:[40,20,30] },
          { es:'Sobres individuales de un solo uso, uno por cada limpieza.',
            en:'Single use sachets, one for each cleaning session.', v:[0,10,0] } ] },
        { q:{ es:'Cómo lo usas', en:'How you use it' }, opts:[
          { es:'Viertes a ojo hasta que el olor se note fuerte.',
            en:'You pour by eye until the smell comes through strongly.', v:[5,5,5] },
          { es:'Mezclas dos limpiadores distintos para que rinda más.',
            en:'You mix two different cleaners so it goes further.', v:[5,0,0] },
          { es:'Sigues la dosis por litro que indica la etiqueta y mides con la tapa.',
            en:'You follow the dose per liter on the label and measure with the cap.', v:[25,45,20] } ] },
        { q:{ es:'Qué haces con el envase y el sobrante', en:'What you do with the container and the leftover' }, opts:[
          { es:'Enjuagas el envase, lo separas para reciclaje y llevas el sobrante al punto de acopio de residuos peligrosos.',
            en:'You rinse the container, separate it for recycling and take the leftover to the hazardous waste collection point.', v:[25,20,50] },
          { es:'Tiras el envase con el resto de la basura y vacías el sobrante en la coladera.',
            en:'You throw the container out with the rest of the rubbish and empty the leftover down the drain.', v:[5,0,5] },
          { es:'Guardas el envase con residuo en el patio por si algún día sirve para algo.',
            en:'You keep the container with leftover in the yard in case it is useful some day.', v:[15,20,10] } ] } ] },
    { intro:{ es:'Tu grupo compra el material para el proyecto de ciencias y esta vez tú decides las tres cosas.',
              en:'Your class is buying the materials for the science project and this time you make the three decisions.' },
      best:[0,1,2],
      dec:[
        { q:{ es:'Qué pilas eliges', en:'Which batteries you choose' }, opts:[
          { es:'Pilas recargables con su cargador, que servirán también para los proyectos siguientes.',
            en:'Rechargeable batteries with a charger, which will also serve the next projects.', v:[40,25,35] },
          { es:'Pilas desechables baratas, dos paquetes por si acaso.',
            en:'Cheap disposable batteries, two packs just in case.', v:[5,5,5] },
          { es:'Pilas desechables de la mejor marca, un paquete.',
            en:'Disposable batteries of the best brand, one pack.', v:[15,10,10] } ] },
        { q:{ es:'Cuánto material pides', en:'How much material you order' }, opts:[
          { es:'El doble de lo calculado, para que sobre.',
            en:'Double what you calculated, so there is plenty left.', v:[5,10,5] },
          { es:'La cantidad calculada, con el acuerdo de reponer si algo falta.',
            en:'The calculated amount, with an agreement to restock if anything runs short.', v:[30,20,30] },
          { es:'La mitad ahora y otro pedido el mismo día por si acaso.',
            en:'Half now and another order the same day just in case.', v:[15,10,10] } ] },
        { q:{ es:'Qué haces con las pilas usadas y los sobrantes', en:'What you do with the used batteries and the leftovers' }, opts:[
          { es:'Los tiras a la basura común al terminar el proyecto.',
            en:'You throw them in the ordinary bin once the project is over.', v:[5,0,5] },
          { es:'Los guardas en un cajón sin etiqueta y sin avisar a nadie.',
            en:'You keep them in a drawer with no label and tell nobody.', v:[10,15,10] },
          { es:'Llevas las pilas al contenedor de acopio y devuelves al almacén el material que no se usó.',
            en:'You take the batteries to the collection container and return the unused material to the store room.', v:[25,30,40] } ] } ] }
  ];
  var sc = scen[Math.floor(rng() * scen.length)];
  CMP = { sc:sc, sel:[null,null,null], tries:0, done:false, note:null, noteOk:false };
  return '<div class="wgt" data-widget="meters" id="wConsumo">' +
      wgtHead(S('Los tres medidores de la compra','The three purchase meters'),
              S('Elige en las tres decisiones y mira cómo se mueven los medidores. Cambia lo que quieras hasta dejar los tres arriba de la marca.',
                'Choose in all three decisions and watch the meters move. Change whatever you like until all three sit above the mark.')) +
      '<div id="cmpBox"></div>' +
    '</div>';
}

function cmpScores(){
  var m = [0,0,0], d, j;
  for (d = 0; d < 3; d++) {
    var k = CMP.sel[d];
    if (k === null) continue;
    var v = CMP.sc.dec[d].opts[k].v;
    for (j = 0; j < 3; j++) m[j] += v[j];
  }
  return m;
}

function cmpRender(){
  if (!CMP) return;
  var box = document.getElementById('cmpBox');
  if (!box) return;
  var m = cmpScores();
  var decs = CMP.sc.dec.map(function(d, di){
    var opts = d.opts.map(function(o, oi){
      var cls = 'optbox' + (CMP.sel[di] === oi ? (CMP.done ? ' done' : ' sel') : '');
      return '<div class="' + cls + '" onclick="cmpPick(' + di + ',' + oi + ')">' + o[LANG] + '</div>';
    }).join('');
    return '<div><div class="dq">' + d.q[LANG] + '</div>' + opts + '</div>';
  }).join('');
  var mtrs = CMP_LBL[LANG].map(function(lb, k){
    var w = Math.min(100, m[k]);
    return '<div class="mtr"><div class="mtrlbl"><span>' + lb + '</span><span>' + w + '</span></div>' +
           '<div class="mtrtrack"><div class="mtrfill' + (m[k] >= CMP_META ? ' ok' : '') + '" style="width:' + w + '%"></div></div></div>';
  }).join('');
  var msg = CMP.note || S('Las tres decisiones se suman: ninguna alcanza sola para levantar los tres medidores. Prueba combinaciones y observa cuál medidor se queda atrás.',
                          'The three decisions add up: none of them alone lifts all three meters. Try combinations and watch which meter lags behind.');
  box.innerHTML =
    '<div class="wcase">' + CMP.sc.intro[LANG] + '</div>' +
    '<div class="dlist">' + decs + '</div>' +
    '<div class="mtrs">' + mtrs + '</div>' +
    (CMP.done ? '' : '<button class="wbtn" onclick="cmpCheck()">' + S('Cerrar la compra','Close the purchase') + '</button>') +
    '<div class="wmsg ' + (CMP.note ? (CMP.noteOk ? 'ok' : 'warn') : '') + '">' + msg + '</div>';
}

function cmpPick(di, oi){
  if (!CMP || CMP.done) return;
  CMP.sel[di] = oi;
  CMP.note = null; CMP.noteOk = false;
  cmpRender();
}

function cmpCheck(){
  if (!CMP || CMP.done) return;
  if (CMP.sel.indexOf(null) !== -1) {
    CMP.noteOk = false;
    CMP.note = S('Falta elegir en las tres decisiones: la compra se cierra completa o no se cierra.',
                 'You still have to choose in all three decisions: the purchase closes whole or it does not close.');
    cmpRender();
    return;
  }
  var m = cmpScores();
  if (m[0] >= CMP_META && m[1] >= CMP_META && m[2] >= CMP_META) {
    CMP.done = true; CMP.noteOk = true;
    CMP.note = S('Compra cerrada con los tres medidores arriba de la marca. Ninguna de esas decisiones exige gastar más: exigen saber qué contiene el producto, cuánto se necesita y a dónde va lo que sobra.',
                 'Purchase closed with the three meters above the mark. None of those decisions demands spending more: they demand knowing what the product contains, how much is needed and where the leftover goes.');
    cmpRender();
    return;
  }
  CMP.tries++;
  if (CMP.tries >= 3) {
    CMP.sel = CMP.sc.best.slice();
    CMP.done = true; CMP.noteOk = false;
    CMP.note = S('Esta es la combinación que levanta los tres medidores: comprar lo que no arrastra material de más, usar la dosis que el producto pide y devolver el residuo a donde puede tratarse. Cada decisión levanta un medidor distinto, por eso ninguna basta sola.',
                 'This is the combination that lifts the three meters: buy what does not drag extra material along, use the dose the product asks for, and return the leftover where it can be treated. Each decision lifts a different meter, which is why none is enough on its own.');
    cmpRender();
    return;
  }
  var low = 0;
  if (m[1] < m[low]) low = 1;
  if (m[2] < m[low]) low = 2;
  CMP.noteOk = false;
  if (low === 0) {
    CMP.note = S('Todavía no. El medidor del residuo se quedó corto: revisa cuánto envase y cuánto material desechable arrastra tu elección antes de que empiece a usarse.',
                 'Not yet. The waste meter fell short: look again at how much packaging and how much disposable material your choice drags along before it is even used.');
  } else if (low === 1) {
    CMP.note = S('Todavía no. El medidor del drenaje se quedó corto: revisa qué sustancia termina en el agua, ya sea por exceso de dosis, por mezcla o por vaciar el sobrante.',
                 'Not yet. The drain meter fell short: look at which substance ends up in the water, whether through an excess dose, a mixture or emptying the leftover.');
  } else {
    CMP.note = S('Todavía no. El medidor del aprovechamiento se quedó corto: revisa si el material vuelve a servir o si queda fuera de circulación después de un uso.',
                 'Not yet. The reuse meter fell short: check whether the material serves again or whether it drops out of circulation after a single use.');
  }
  cmpRender();
}

/* ================================================
   WIDGET 5 - CUADERNO ABIERTO
   The humanities analog of showing your work: a seeded prompt answered by
   writing or sketching. Encouraging, non-verdict feedback.
   ================================================ */
function buildCuaderno(rng){

    '</div>' +
    '<div class="wpanel active" id="ref_type"><textarea class="wtextarea" id="refTa" placeholder="' + t('ph-work') + '"></textarea></div>' +
    '<div class="wpanel" id="ref_draw">' +
      '<div class="cvwrap">' +
        '<canvas class="dcanvas" id="refCv"></canvas>' +
        '<div class="ctoolbar">' +
          '<button class="tbtn2 bpen on">' + t('btn-pen') + '</button>' +
          '<button class="tbtn2 bmarker">' + t('btn-marker') + '</button>' +
          '<button class="tbtn2 beraser">' + t('btn-eraser') + '</button>' +
          '<div class="cdot sel" data-color="#0f2d5a" style="background:#0f2d5a"></div>' +
          '<div class="cdot"     data-color="#1a1a16" style="background:#1a1a16"></div>' +
          '<div class="cdot"     data-color="#8b2500" style="background:#8b2500"></div>' +
          '<div class="cdot"     data-color="#1d4e89" style="background:#1d4e89"></div>' +

                                        'There is no single answer here. What matters is that you can back up your own.') + '</div>';

var REF_CV_READY = false;

function refTab(which, btn){
  ['type','draw'].forEach(function(x){
    var p = document.getElementById('ref_' + x);
    if (p) p.classList.toggle('active', x === which);
  });
  var host = document.getElementById('wReflexion');
  if (host) host.querySelectorAll('.wtab').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  if (which === 'draw' && !REF_CV_READY) setTimeout(function(){
    var c = document.getElementById('refCv');
    if (c) { initCanvas(c); REF_CV_READY = true; }
  }, 60);
}

function refSave(){
  var fb = document.getElementById('refFb');
  if (!fb) return;
  var ta = document.getElementById('refTa');
  var written = ta && ta.value.trim().length > 0;
  fb.className = 'wmsg ok';
  fb.innerHTML = written
    ? S('Guardado. Buen punto de partida: ahora revisa si tu respuesta nombra un aporte concreto y no solo un nombre.',
        'Saved. Good starting point: now check whether your answer names a concrete contribution and not only a name.')
    : S('Guardado. Si dibujaste, agrega una línea escrita que explique lo que muestra tu esquema.',
        'Saved. If you drew something, add a written line explaining what your sketch shows.');
}

/* ================================================
   buildLesson: interleaved concept, manipulative, graded problem (Rule 1)
   ================================================ */
function buildLesson(rng) {
  problems = []; answeredCount = 0; correctCount = 0;
  document.getElementById('lessonBody').innerHTML = '';

  /* CONCEPTO 1 */
  addSection(S('CONCEPTO 1','CONCEPT 1'),
    '<h2>' + S('Química antes de que existiera la palabra','Chemistry before the word existed') + '</h2>' +
    '<p>' + S('Mucho antes de que alguien escribiera una fórmula, en talleres de todo el mundo ya se separaban, se purificaban y se transformaban sustancias con procedimientos que se repetían igual una y otra vez. En Babilonia se destilaban esencias; en Alejandría se calentaba en baño de agua para no quemar lo que se quería concentrar; en los talleres del mundo islámico se ordenaron por escrito la destilación y la cristalización; en Mesoamérica se cocía el maíz con cal y se fijaba el añil sobre arcilla; en los Andes se aleaban oro y cobre; en la India se controlaba el carbono del acero y se destilaba zinc metálico.',
              'Long before anybody wrote a formula, workshops all over the world were already separating, purifying and transforming substances with procedures that repeated the same way over and over. In Babylon essences were distilled; in Alexandria heating was done in a water bath so as not to burn what was being concentrated; in the workshops of the Islamic world distillation and crystallization were set out in writing; in Mesoamerica maize was cooked with lime and indigo was locked into clay; in the Andes gold and copper were alloyed; in India the carbon in steel was controlled and metallic zinc was distilled.') + '</p>' +
    '<p>' + S('Lo que distingue a esos talleres de la casualidad es el control: misma proporción, misma temperatura, mismo tiempo, mismo resultado. Eso ya es método experimental, aunque nadie lo llamara así. Lo que aparece más tarde, entre los siglos XVII y XVIII, no es la práctica sino una forma nueva de explicarla: medir la masa en balanza, nombrar las sustancias con un lenguaje común y publicar el procedimiento para que otros lo repitan. El conocimiento químico no nació en un lugar; se fue acumulando en muchos y después se puso en un mismo idioma.',
              'What separates those workshops from luck is control: same proportion, same temperature, same time, same result. That is already experimental method, even if nobody called it that. What appears later, between the seventeenth and eighteenth centuries, is not the practice but a new way of explaining it: measuring mass on a balance, naming substances in a common language and publishing the procedure so others can repeat it. Chemical knowledge was not born in one place; it accumulated in many and was later put into a single language.') + '</p>' +
    '<div class="callout"><p><strong>' + S('Clave: ','Key: ') + '</strong>' +
      S('un procedimiento que se repite con las mismas condiciones y da el mismo resultado ya es química, aunque no se escriba con símbolos.',
        'a procedure that repeats under the same conditions and gives the same result is already chemistry, even if it is not written with symbols.') + '</p></div>' +
    '<div class="rules-grid">' +
      '<div class="rcard"><div class="rname">' + S('Mesopotamia','Mesopotamia') + '</div><div class="rform">' + S('destilación','distillation') + '</div><div class="rnote">' + S('Separar por evaporación y condensación lo volátil de lo que no lo es.','Separating what is volatile from what is not, by evaporating and condensing.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Mesoamérica','Mesoamerica') + '</div><div class="rform">' + S('medio alcalino','alkaline medium') + '</div><div class="rnote">' + S('El maíz cocido con cal cambia de textura y libera nutrimentos.','Maize cooked with lime changes texture and releases nutrients.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Andes','Andes') + '</div><div class="rform">' + S('aleación','alloy') + '</div><div class="rnote">' + S('Mezclar dos metales da un material con propiedades nuevas.','Mixing two metals gives a material with new properties.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('India','India') + '</div><div class="rform">' + S('reducción en horno','furnace reduction') + '</div><div class="rnote">' + S('Del mineral al metal, controlando el aire y la temperatura.','From ore to metal, by controlling air and temperature.') + '</div></div>' +
    '</div>' +
    buildLinea(rng));
  linRender();

  /* PROBLEMA 1 */
  addProblem(pick([
    { title:{ es:'De dónde viene el saber químico', en:'Where chemical knowledge comes from' }, showWork:false,
      stmt:{ es:'Un cartel escolar afirma que la química nació en Europa en el siglo XVIII y que antes de eso solo hubo supersticiones. ¿Qué corrección le harías a esa afirmación?',
             en:'A school poster claims that chemistry was born in Europe in the eighteenth century and that before then there were only superstitions. What correction would you make to that claim?' },
      options:{ es:[
        'Que las transformaciones controladas ya se practicaban en talleres de varias regiones, y lo que aparece en el siglo XVIII es una forma de medirlas y explicarlas, no la práctica misma.',
        'Que la química nació en realidad en el mundo islámico y de ahí pasó completa a Europa, donde únicamente se le cambió el nombre.',
        'Que la afirmación es correcta, porque sin balanza y sin nomenclatura ninguna de esas prácticas puede considerarse conocimiento.',
        'Que el cartel se equivoca de siglo, pues la química europea comenzó doscientos años antes con los primeros talleres de vidrio.' ],
        en:[
        'That controlled transformations were already practiced in workshops across several regions, and what appears in the eighteenth century is a way of measuring and explaining them, not the practice itself.',
        'That chemistry was really born in the Islamic world and passed from there to Europe complete, where only its name was changed.',
        'That the claim is correct, because with no balance and no nomenclature none of those practices can count as knowledge.',
        'That the poster has the century wrong, since European chemistry began two hundred years earlier with the first glass workshops.' ] },
      correct:0,
      hint:{ es:'Separa dos cosas distintas: hacer transformaciones controladas y contar con un lenguaje y una medida comunes para explicarlas.',
             en:'Separate two different things: carrying out controlled transformations, and having a common language and measurement to explain them.' },
      explanation:{ es:'Fijar el añil sobre arcilla, alear cobre y oro, destilar esencias o fundir zinc son transformaciones controladas y repetibles, es decir, química hecha en talleres de muchas regiones. Lo que se consolida en el siglo XVIII es la medición de la masa en balanza y un lenguaje común para nombrar sustancias. Atribuir el origen a una sola región, sea Europa o cualquier otra, borra todo ese trabajo acumulado.',
                    en:'Locking indigo into clay, alloying copper and gold, distilling essences or smelting zinc are controlled, repeatable transformations, that is, chemistry done in workshops across many regions. What consolidates in the eighteenth century is measuring mass on a balance and a common language for naming substances. Crediting the origin to one region, whether Europe or any other, erases all that accumulated work.' } },
    { title:{ es:'Método o casualidad', en:'Method or luck' }, showWork:false,
      stmt:{ es:'En una exposición, alguien sostiene que los talleres antiguos de tintes y metales solo tuvieron suerte, porque trabajaban sin teoría atómica. ¿Qué respuesta corrige mejor esa idea?',
             en:'At an exhibition, somebody argues that ancient dye and metal workshops were merely lucky, because they worked without atomic theory. Which answer best corrects that idea?' },
      options:{ es:[
        'Que repetían el mismo procedimiento con las mismas proporciones y obtenían el mismo resultado, y esa repetición controlada es justamente lo que distingue a un método de la suerte.',
        'Que sí manejaban una teoría atómica equivalente a la actual, aunque la expresaran con otras palabras y sin símbolos químicos.',
        'Que la suerte explica bien esos resultados, y por eso hoy ninguno de esos procedimientos se sigue estudiando en los laboratorios.',
        'Que sus resultados eran irregulares, tanto que cada taller obtenía un color distinto aunque siguiera la misma receta.' ],
        en:[
        'That they repeated the same procedure with the same proportions and obtained the same result, and that controlled repetition is exactly what separates a method from luck.',
        'That they did handle an atomic theory equivalent to the current one, only expressed in other words and without chemical symbols.',
        'That luck explains those results well, which is why none of those procedures is still studied in laboratories today.',
        'That their results were irregular, so much so that each workshop got a different color even following the same recipe.' ] },
      correct:0,
      hint:{ es:'Pregúntate qué tendría que cumplirse para que un resultado deje de depender del azar.',
             en:'Ask what would have to be true for a result to stop depending on chance.' },
      explanation:{ es:'Un resultado que se repite con las mismas proporciones y los mismos pasos deja de ser casualidad: eso es control experimental, aunque no se escriba con fórmulas. Esos talleres no manejaban teoría atómica, pero sí dominaban las condiciones (proporción, temperatura, tiempo), y por eso el mismo azul o el mismo acero salían una y otra vez.',
                    en:'A result that repeats with the same proportions and the same steps stops being coincidence: that is experimental control, even when it is not written with formulas. Those workshops had no atomic theory, but they did master the conditions (proportion, temperature, time), and that is why the same blue or the same steel came out again and again.' } }
  ], rng), rng);

  addProblem(pick([
    { title:{ es:'El maíz y la cal', en:'Maize and lime' }, showWork:false,
      stmt:{ es:'Para hacer nixtamal, el maíz se cuece en agua con cal y después se enjuaga. El grano se ablanda, suelta la cáscara y la masa resultante aporta nutrimentos que el maíz molido en seco no aporta. ¿Qué explica ese cambio?',
             en:'To make nixtamal, maize is cooked in water with lime and then rinsed. The grain softens, sheds its skin, and the resulting dough provides nutrients that dry ground maize does not. What explains that change?' },
      options:{ es:[
        'Que la cal disuelta produce un medio alcalino que ataca la cubierta del grano y libera compuestos que el maíz sin tratar retiene.',

        'Que el calor por sí solo rompe el grano, y la cal se agrega únicamente para dar color y aroma a la masa.',

        en:[

        'That lime neutralizes the acids in the grain and this is why the dough keeps its flavor better through the day.',
