<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ciudadanía Activa y Defensa de Valores Democráticos</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; text-align: justify; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }

/* ── WIDGETS (concept manipulatives) ── */
.wgt { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.1rem; margin:1.1rem 0; }
.iw-tag { font-family:'Crimson Pro',serif; font-size:1.1rem; font-weight:700; margin-bottom:.2rem; color:var(--text); }
.iw-sub { font-family:'IBM Plex Sans',sans-serif; font-size:.82rem; font-weight:400; color:var(--text3); margin-top:.15rem; margin-bottom:.7rem; line-height:1.5; }
.wmsg { margin-top:.75rem; padding:.6rem .85rem; border-radius:0 8px 8px 0; border-left:3px solid var(--border); background:var(--surface2); color:var(--text2); font-size:.83rem; }
.wmsg.ok   { background:var(--ok-bg);   color:var(--ok);    border-left-color:var(--ok); }
.wmsg.warn { background:var(--gold-bg); color:var(--text2); border-left-color:var(--gold); }
.wbtn { margin-top:.75rem; margin-right:.4rem; background:var(--green); color:#fff; border:none; border-radius:8px; padding:.55rem 1.1rem; font-size:.83rem; font-weight:600; cursor:pointer; min-height:44px; }
.wbtn:hover { background:var(--green-dark); }
.wprog { font-size:.72rem; color:var(--text3); margin-top:.55rem; }
.wcase { background:var(--surface2); border-radius:8px; padding:.75rem .9rem; font-size:.86rem; color:var(--text); margin-bottom:.7rem; }
.chips { display:flex; flex-wrap:wrap; gap:.45rem; margin:.6rem 0; }
.chip { border:1.5px solid var(--border); border-radius:22px; padding:.4rem .85rem; font-size:.8rem; cursor:pointer; background:var(--surface2); color:var(--text2); min-height:44px; display:flex; align-items:center; transition:all .14s; }
.chip:hover { border-color:var(--green); }
.chip.used { opacity:.75; cursor:default; font-family:'IBM Plex Mono',monospace; font-size:.74rem; min-height:34px; }
.chip.used:hover { border-color:var(--border); }
.dlist { display:flex; flex-direction:column; gap:.7rem; margin:.6rem 0; }
.dq { font-size:.78rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.3rem; }
.optbox { border:1.5px solid var(--border); border-radius:9px; padding:.55rem .7rem; font-size:.79rem; cursor:pointer; background:var(--surface2); color:var(--text2); margin-bottom:.4rem; min-height:44px; display:flex; align-items:center; transition:all .14s; }
.optbox:hover { border-color:var(--green); }
.optbox.sel { border-color:var(--green); background:var(--green-bg); color:var(--green-dark); font-weight:600; }
.optbox.done { border-color:var(--ok); background:var(--ok-bg); color:var(--ok); cursor:default; }
.mcols { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; }
.colh { font-size:.7rem; text-transform:uppercase; letter-spacing:.07em; color:var(--text3); margin-bottom:.35rem; }
.mtrs { margin-top:.8rem; }
.mtr { margin-bottom:.55rem; }
.mtrlbl { display:flex; justify-content:space-between; gap:.6rem; font-size:.73rem; color:var(--text3); margin-bottom:.2rem; }
.mtrtrack { height:12px; border:1px solid var(--border); border-radius:6px; background:var(--surface2); overflow:hidden; }
.mtrfill { height:100%; width:0%; background:var(--gold); transition:width .35s; }
.mtrfill.ok { background:var(--ok); }
.tl-list { display:flex; flex-direction:column; gap:.45rem; margin:.7rem 0; }
.tl-chip { border:1.5px solid var(--border); border-radius:9px; padding:.55rem .75rem; font-size:.81rem; cursor:pointer; background:var(--surface2); color:var(--text2); min-height:44px; display:flex; align-items:center; gap:.5rem; transition:all .14s; }
.tl-chip:hover { border-color:var(--green); }
.tl-chip.sel { border-color:var(--gold); background:var(--gold-bg); color:var(--text); font-weight:600; }
.tl-chip.locked { border-color:var(--ok); background:var(--ok-bg); color:var(--ok); cursor:default; }
.tl-num { font-family:'IBM Plex Mono',monospace; color:var(--text3); font-weight:700; font-size:.78rem; flex-shrink:0; }
.reflect-prompt { font-size:.9rem; color:var(--text2); margin:.4rem 0 .8rem; }

@media (max-width:600px) {
  .mcols { grid-template-columns:1fr; }
  .wgt { padding:.85rem; }
  .wcase { font-size:.83rem; }
}
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Ética en Producción, Consumo y Estado de Derecho</div>
    <div class="wcourse" id="wcourse-el">Formación Cívica y Ética · 2° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>

/* ── Attempt counter + seed (Rule 4): seed = name+group+attempt ── */
function getAttemptKey(name, group){ return 'fce3_t08_g01__att__' + (name+'__'+group).replace(/\s+/g,'_'); }
function nextAttempt(name, group){ var k=getAttemptKey(name,group),n=0; try{n=parseInt(localStorage.getItem(k)||'0',10)||0;}catch(e){} n++; try{localStorage.setItem(k,String(n));}catch(e){} return n; }
function currentAttempt(name, group){ var k=getAttemptKey(name,group); try{return parseInt(localStorage.getItem(k)||'1',10)||1;}catch(e){return 1;} }
/* ================================================
   STATE
   ================================================ */
var studentData   = {};
var problems      = [];

/* ================================================
   SESSION PERSISTENCE  (localStorage)
   ================================================ */
function lsKey() {
  var n = (studentData.name  || '').trim();
  var g = (studentData.group || '').trim();
  return 'fce3_t08_g01__' + (n + '__' + g).replace(/\s+/g, '_');
}

function saveSession() {
  if (!studentData.name) return;
  var drawings = [], texts = [], photos = [];
  problems.forEach(function(p, i) {
    var dc = document.getElementById('dc' + i);
    if (dc && dc.width) {
      var blank = document.createElement('canvas');
      blank.width = dc.width; blank.height = dc.height;
      drawings.push(dc.toDataURL() === blank.toDataURL() ? null : dc.toDataURL('image/png'));
    } else { drawings.push(null); }
    var ta = document.getElementById('ta' + i);
    texts.push(ta ? ta.value : '');
    var pp = document.getElementById('pp' + i);
    photos.push((pp && pp.src && pp.src.indexOf('data:') === 0) ? pp.src : null);
  });
  var state = {
    name: studentData.name, group: studentData.group,
    answeredCount: answeredCount, correctCount: correctCount,
    choices: problems.map(function(p) { return p.studentChoice; }),
    drawings: drawings, texts: texts, photos: photos
  };
  try { localStorage.setItem(lsKey(), JSON.stringify(state)); } catch(e) {}
}

function loadSession(name, group) {
  var key = 'fce3_t08_g01__' + (name + '__' + group).replace(/\s+/g, '_');
  try { var r = localStorage.getItem(key); return r ? JSON.parse(r) : null; } catch(e) { return null; }
}

function restoreSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  var saved = loadSession(name, group);
  if (!saved) return;
  document.getElementById('restoreBar').style.display = 'none';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = currentAttempt(name, group);
  buildLesson(seededRng(name + group + att));
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
  saved.choices.forEach(function(choice, idx) {
    if (choice !== null && choice !== undefined) confirmMC(idx, choice);
  });
  setTimeout(function() {
    if (saved.drawings) {
      saved.drawings.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var dc = document.getElementById('dc' + i);
        if (!dc || !dc.width) return;
        var img = new Image();
        img.onload = function() {
          var dpr = window.devicePixelRatio || 1;
          dc.getContext('2d').drawImage(img, 0, 0, dc.width / dpr, dc.height / dpr);
        };
        img.src = dataUrl;
      });
    }
    if (saved.texts) {
      saved.texts.forEach(function(text, i) {
        if (!text) return;
        var ta = document.getElementById('ta' + i);
        if (ta) ta.value = text;
      });
    }
    if (saved.photos) {
      saved.photos.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var pp = document.getElementById('pp' + i);
        if (!pp) return;
        pp.src = dataUrl; pp.style.display = 'block';
        var pz = document.getElementById('pz' + i);
        if (pz) pz.style.opacity = '0.4';
      });
    }
  }, 300);
}

function dismissRestore() {
  document.getElementById('restoreBar').style.display = 'none';
}

function checkForSavedSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  if (!name || !group) { document.getElementById('restoreBar').style.display = 'none'; return; }
  var saved = loadSession(name, group);
  var bar = document.getElementById('restoreBar');
  bar.style.display = (saved && saved.choices && saved.choices.some(function(c){ return c !== null; })) ? 'block' : 'none';
}

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS — INJECTION BLOCK ─────────────────────────────────────────
  //   Match these RGB values to --green and --gold above.
  //   PRIMARY  → pBR, pBG, pBB

  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;   // ACCENT (from SCHOOL, Rule 16)

  function pdfText(html) {
    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/\u2192/g,'->').replace(/\u2212/g,'-').replace(/\u00b2/g,'^2')
      .replace(/\u00b3/g,'^3').replace(/\u00d7/g,'x').replace(/\u00f7/g,'/')
      .replace(/\u2260/g,'!=').replace(/\u2264/g,'<=').replace(/\u2265/g,'>=')
      .replace(/\u221a/g,'sqrt').replace(/\u03c0/g,'pi').replace(/\u2026/g,'...')

    // ── SAVE / SHARE — iOS-safe download (LIAXA iOS PDF fix, Rule 12) ─────────
  //   iOS Safari ignores the <a download> attribute, so a plain download fails
  //   silently on iPhone/iPad. iOS -> native share sheet (-> "Save to Files"),
  //   with an inline-open fallback; everything else -> <a download> click.
  //   Runs synchronously off the tap so iOS accepts navigator.share().
  var _fname   = 'fce3_t08_g01_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf';
  var _pdfBlob = doc.output('blob');

  function _restorePdfBtn(){ btn.innerHTML = '\u2b07 &nbsp;' + t('btn-pdf'); btn.disabled = false; }
  function _openPdfInline(b){
    var u = URL.createObjectURL(b);
    var w = window.open(u, '_blank');
    if (!w) { window.location.href = u; }
    setTimeout(function(){ URL.revokeObjectURL(u); }, 60000);
  }

  var _isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
               (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  if (_isIOS) {
    var _pdfFile = new File([_pdfBlob], _fname, { type:'application/pdf' });
    if (navigator.canShare && navigator.canShare({ files:[_pdfFile] })) {
      navigator.share({ files:[_pdfFile], title:_fname })
        .then(_restorePdfBtn)
        .catch(function(e){
          if (e && e.name === 'AbortError') { _restorePdfBtn(); return; }
          _openPdfInline(_pdfBlob); _restorePdfBtn();
        });
      return;
    }
    _openPdfInline(_pdfBlob); _restorePdfBtn();
    return;
  }

  var _dlUrl = URL.createObjectURL(_pdfBlob);
  var _dlA   = document.createElement('a');
  _dlA.href  = _dlUrl; _dlA.download = _fname;
  document.body.appendChild(_dlA); _dlA.click();
  setTimeout(function(){ document.body.removeChild(_dlA); URL.revokeObjectURL(_dlUrl); }, 200);
  _restorePdfBtn();
}

/* Shuffles options (Rule 7) keeping ES/EN aligned, then builds the card inline (Rule 1/5). */
function addProblem(v, rng){
  var n = v.options.es.length, idx = [], k;
  for (k = 0; k < n; k++) idx.push(k);
  for (k = n - 1; k > 0; k--) {
    var j = Math.floor(rng() * (k + 1));
    var tmp = idx[k]; idx[k] = idx[j]; idx[j] = tmp;
  }
  var langOpts = (LANG === 'es') ? v.options.es : v.options.en;
  var prob = {
    title:        v.title[LANG],
    questionText: v.stmt[LANG],
    fn:           v.fn || '',
    hint:         v.hint[LANG],
    explanation:  v.explanation[LANG],
    options:      idx.map(function(o){ return langOpts[o]; }),
    correctIdx:   idx.indexOf(v.correct),
    showWork:     !!v.showWork,
    studentChoice:null, pendingChoice:null
  };
  problems.push(prob);
  buildOneCard(prob, problems.length - 1);
}

/* Seeded permutation that never comes back already ordered. */
function shufflePerm(n, rng){
  var a = [], i, j, t;
  for (i = 0; i < n; i++) a.push(i);
  for (i = n - 1; i > 0; i--) { j = Math.floor(rng() * (i + 1)); t = a[i]; a[i] = a[j]; a[j] = t; }
  var sorted = true;
  for (i = 0; i < n; i++) if (a[i] !== i) sorted = false;
  if (sorted && n > 1) { t = a[0]; a[0] = a[1]; a[1] = t; }
  return a;
}

/* ================================================

   A demand arrives without a label. The student decides which door it knocks on:
   a personal liberty, a share in the decision, or a condition of life. The three

var PUE3 = null;
var PUE3_BINS = { es:['Puerta civil','Puerta política','Puerta social'],

function buildPuertas(rng){

        en:'A detained person demands to be told what the charge is and to speak with whoever defends them.', bin:0,

        en:'A group of students demands that the student council election be held by secret ballot.', bin:1,

      { es:'Una comunidad reclama que la clínica vuelva a abrir los turnos de la tarde que quedaron sin cubrir.',

        wes:'Lo que falta es una condición de vida: atención de salud al alcance.',

        wes:'Vigilar a quien decide y gasta es participar en el poder, no solo informarse.',

      { es:'Un periódico escolar publica una crítica a la dirección y exige que no se le impida circular.',
        en:'A school paper publishes a criticism of the head office and demands not to be stopped from circulating.', bin:0,
        wes:'Expresarse sin permiso previo es una libertad personal, aunque incomode a quien manda.',

        wes:'El trato igual ante quien atiende es una libertad personal protegida frente a la autoridad.',
        wen:'Equal treatment at the counter is a personal liberty protected against the authorities.' },
      { es:'Un grupo de jóvenes reclama que el programa de becas cubra a quienes quedaron fuera del padrón.',
        en:'A group of young people demands that the grant program cover those left off the register.', bin:2,
        wes:'Reclaman el acceso a un apoyo que sostiene su posibilidad de seguir estudiando.',

function pue3Render(){

  if (PUE3.done) {
    box.innerHTML = tal +
      '<div class="wmsg ok">' + S('Tablero completo. Las tres puertas se abren en lugares distintos: la civil protege lo que eres y dices, la política te mete en la decisión, y la social te da las condiciones para poder ejercer las otras dos.',
                                  'Board complete. The three doors open in different places: the civil one protects who you are and what you say, the political one puts you inside the decision, and the social one gives you the conditions to exercise the other two.') + '</div>';
    return;
  }
  var it = PUE3.items[PUE3.order[PUE3.i]];
  var msg = PUE3.note || S('Antes de elegir, pregúntate qué está realmente en juego: una libertad, un lugar en la decisión, o una condición de vida.',
                           'Before choosing, ask what is really at stake: a liberty, a place in the decision, or a condition of life.');
  box.innerHTML =
    '<div class="wcase">' + it[LANG] + '</div>' +
    '<div class="chips">' + names.map(function(b, k){
        return '<div class="chip" onclick="pue3Pick(' + k + ')">' + b + '</div>';

    '<div class="wprog">' + (PUE3.i + 1) + ' / ' + PUE3.items.length + '</div>';
}

function pue3Pick(k){
  if (!PUE3 || PUE3.done) return;
  var it = PUE3.items[PUE3.order[PUE3.i]];
  if (k === it.bin) {
    PUE3.tally[k]++; PUE3.tries = 0; PUE3.noteOk = true;
    PUE3.note = S('Así es. ' + it.wes, 'That is it. ' + it.wen);
    PUE3.i++;
    if (PUE3.i >= PUE3.items.length) PUE3.done = true;
    pue3Render();
    return;
  }
  PUE3.tries++;
  if (PUE3.tries >= 3) {
    PUE3.tally[it.bin]++; PUE3.tries = 0; PUE3.noteOk = false;
    PUE3.note = S('Este caso entraba por la ' + PUE3_BINS.es[it.bin].toLowerCase() + '. ' + it.wes,
                  'This case came in through the ' + PUE3_BINS.en[it.bin].toLowerCase() + '. ' + it.wen);
    PUE3.i++;
    if (PUE3.i >= PUE3.items.length) PUE3.done = true;
    pue3Render();
    return;
  }
  PUE3.noteOk = false;
  if (k === 0) {
    PUE3.note = S('Todavía no. La puerta civil se abre cuando lo que está en juego es una libertad personal frente al poder: expresarse, asociarse, moverse, ser tratado sin distinción.',
                  'Not yet. The civil door opens when what is at stake is a personal liberty against power: speaking, associating, moving, being treated without distinction.');
  } else if (k === 1) {
    PUE3.note = S('Todavía no. La puerta política se abre cuando lo que se disputa es entrar en la decisión o vigilar a quien decide.',
                  'Not yet. The political door opens when what is being disputed is entering the decision or watching whoever decides.');
  } else {
    PUE3.note = S('Todavía no. La puerta social se abre cuando falta una condición de vida: salud, agua, escuela, camino, ingreso.',
                  'Not yet. The social door opens when a condition of life is missing: health, water, school, road, income.');
  }
  pue3Render();
}

/* ================================================
   WIDGET 2 - ASAMBLEA EN VIVO (tres deslizadores, tres indicadores)
   The student designs an assembly by moving three sliders. Legitimacy, plurality
   and follow-through recompute on every pixel of movement, so the consequence of
   each choice is visible before committing. A failed call names the indicator that
   lagged and where to look; the third failed call lays out a design that works
   (Rule 8, pattern A).
   ================================================ */
var ASM = null;
var ASM_META = 70;
var ASM_IND = { es:['Legitimidad','Pluralidad','Cumplimiento'],
                en:['Legitimacy','Plurality','Follow-through'] };
var ASM_Q = { es:['¿A quiénes alcanza la convocatoria?','¿Cuánto se delibera antes de decidir?','¿Qué queda por escrito?'],
              en:['Who does the call reach?','How much is debated before deciding?','What is put in writing?'] };
var ASM_OPT = {
  es:[
    ['Solo quien organiza.',
     'Quien organiza y sus allegados.',
     'Un representante por sector.',
     'Toda la comunidad, avisada con un día.',
     'Toda la comunidad, avisada con una semana y en horario alcanzable.'],
    ['Se vota apenas se presenta la propuesta.',
     'Se admite una sola pregunta.',
     'Se escuchan objeciones, pero no se responden.',
     'Se escuchan y se responden las objeciones principales.',
     'Se responden todas y la propuesta se ajusta con lo dicho.'],
    ['Nada.',
     'Solo la lista de asistencia.',
     'El acuerdo, sin responsables.',
     'El acuerdo con responsables.',
     'Acta con acuerdo, responsables, fechas y quién verifica.']
  ],
  en:[
    ['Only whoever organizes.',
     'The organizer and their close circle.',
     'One delegate per sector.',
     'The whole community, notified one day ahead.',
     'The whole community, notified a week ahead and at a reachable hour.'],
    ['A vote is taken as soon as the proposal is read.',
     'A single question is allowed.',
     'Objections are heard but not answered.',
     'The main objections are heard and answered.',
     'All of them are answered and the proposal is adjusted with what was said.'],
    ['Nothing.',
     'Only the attendance list.',
     'The agreement, with no one responsible.',
     'The agreement with named responsibilities.',
     'Minutes with agreement, responsibilities, dates and who verifies.']
  ]
};

function buildAsamblea(rng){
  var SCEN = [
    { es:'El plantel tiene que decidir qué hacer con el patio trasero, y a ti te toca organizar la asamblea.',
      en:'The school has to decide what to do with the back yard, and organizing the assembly falls to you.' },
    { es:'La colonia tiene que decidir en qué se usa el fondo vecinal del año, y a ti te toca organizar la asamblea.',
      en:'The neighborhood has to decide what this year community fund goes to, and organizing the assembly falls to you.' }
  ];
  var sc = SCEN[Math.floor(rng() * SCEN.length)];
  ASM = { sc:sc, v:[2,2,2], tries:0, done:false, note:null, noteOk:false };
  return '<div class="wgt" data-widget="slider" id="wAsamblea">' +
      wgtHead(S('Asamblea en vivo','Live assembly'),
              S('Mueve los tres controles y mira cómo responden los indicadores. Ajusta cuanto quieras antes de convocar.',
                'Move the three controls and watch the indicators respond. Adjust as much as you like before calling it.')) +
      '<div id="asmBox"></div>' +
    '</div>';
}

function asmScores(){
  var a = ASM.v[0], b = ASM.v[1], c = ASM.v[2];
  return [14 * a + 6 * c, 8 * a + 12 * b, 6 * b + 14 * c];
}

function asmPaint(){
  if (!ASM) return;
  var el = document.getElementById('asmM');
  if (!el) return;
  var m = asmScores();
  el.innerHTML = ASM_IND[LANG].map(function(lb, k){
    var w = Math.min(100, m[k]);
    return '<div class="mtr"><div class="mtrlbl"><span>' + lb + '</span><span>' + w + '</span></div>' +
           '<div class="mtrtrack"><div class="mtrfill' + (m[k] >= ASM_META ? ' ok' : '') + '" style="width:' + w + '%"></div></div></div>';
  }).join('');
}

function asmRender(){
  if (!ASM) return;
  var box = document.getElementById('asmBox');
  if (!box) return;
  var qs = ASM_Q[LANG], opts = ASM_OPT[LANG];
  var sliders = qs.map(function(q, k){
    return '<div class="cg"><label>' + q + '</label>' +
      '<input type="range" min="1" max="5" step="1" value="' + ASM.v[k] + '" id="asmR' + k + '" ' +
        (ASM.done ? 'disabled ' : '') + 'oninput="asmInput(' + k + ',this.value)">' +
      '<div class="cval" id="asmL' + k + '">' + opts[k][ASM.v[k] - 1] + '</div></div>';
  }).join('');
  var msg = ASM.note || S('Ningún control basta solo: cada indicador se alimenta de dos de ellos a la vez.',
                          'No single control is enough: each indicator feeds on two of them at once.');
  box.innerHTML =
    '<div class="wcase">' + ASM.sc[LANG] + '</div>' +
    '<div class="gcrd"><div class="dlist">' + sliders + '</div><div class="mtrs" id="asmM"></div></div>' +
    (ASM.done ? '' : '<button class="wbtn" onclick="asmCheck()">' + S('Convocar la asamblea','Call the assembly') + '</button>') +
    '<div class="wmsg ' + (ASM.note ? (ASM.noteOk ? 'ok' : 'warn') : '') + '">' + msg + '</div>';
  asmPaint();
}

function asmInput(k, val){
  if (!ASM || ASM.done) return;
  ASM.v[k] = parseInt(val, 10) || 1;
  var lab = document.getElementById('asmL' + k);
  if (lab) lab.textContent = ASM_OPT[LANG][k][ASM.v[k] - 1];
  asmPaint();
}

function asmCheck(){
  if (!ASM || ASM.done) return;
  var m = asmScores();
  if (m[0] >= ASM_META && m[1] >= ASM_META && m[2] >= ASM_META) {
    ASM.done = true; ASM.noteOk = true;
    ASM.note = S('Asamblea convocada con los tres indicadores arriba de la marca. Una decisión así obliga incluso a quien votó en contra, porque pudo llegar, pudo objetar y quedó constancia de a qué se comprometió cada quien.',
                 'Assembly called with all three indicators above the mark. A decision like that binds even those who voted against it, because they could get there, could object, and a record was left of what each side committed to.');
    asmRender();
    return;
  }
  ASM.tries++;
  if (ASM.tries >= 3) {
    ASM.v = [4, 4, 4];
    ASM.done = true; ASM.noteOk = false;
    ASM.note = S('Este ajuste levanta los tres indicadores: convocar a toda la comunidad, responder las objeciones principales y dejar el acuerdo con responsables. Fíjate en que ninguno de los tres controles trabaja solo, porque cada indicador depende de dos de ellos.',
                 'This setting lifts all three indicators: call the whole community, answer the main objections and leave the agreement with named responsibilities. Notice that none of the three controls works alone, because each indicator depends on two of them.');
    asmRender();
    return;
  }
  var low = 0;
  if (m[1] < m[low]) low = 1;
  if (m[2] < m[low]) low = 2;
  ASM.noteOk = false;
  if (low === 0) {
    ASM.note = S('Todavía no. La legitimidad se quedó corta: revisa a quiénes alcanzó tu convocatoria y qué constancia quedó de lo acordado.',
                 'Not yet. Legitimacy fell short: check who your call actually reached and what record was left of the agreement.');
  } else if (low === 1) {
    ASM.note = S('Todavía no. La pluralidad se quedó corta: mira si las voces distintas alcanzaron a entrar y si sus objeciones recibieron respuesta.',
                 'Not yet. Plurality fell short: look at whether dissenting voices got in and whether their objections were answered.');
  } else {
    ASM.note = S('Todavía no. El cumplimiento se quedó corto: fíjate en qué quedó escrito y en si alguien podría reclamarlo dentro de un mes.',
                 'Not yet. Follow-through fell short: look at what was written down and whether anyone could claim it a month from now.');
  }
  asmRender();
}

/* ================================================
   WIDGET 3 - RUTA DEL PROYECTO (secuenciador)
   The stages of a community project arrive scrambled; one tap picks a stage and
   the next tap swaps it. A failed check names the first stage out of place and
   asks what has to exist before it. Third failed check lays out the route
   (Rule 8, pattern A).
   ================================================ */
var RUT = null;
function buildRuta(rng){
  var pools = [
    { t:{ es:'Caso: el patio del plantel se inunda con cada lluvia', en:'Case: the school yard floods with every rain' },
      steps:[
        { es:'Levantar el diagnóstico: fechas, fotos y días de clase perdidos.',
          en:'Build the diagnosis: dates, photos and school days lost.' },
        { es:'Llevar el diagnóstico a la asamblea y acordar ahí la propuesta.',
          en:'Take the diagnosis to the assembly and agree the proposal there.' },
        { es:'Redactar el plan con responsables, fechas y lo que hace falta.',
          en:'Draft the plan with responsibilities, dates and what is needed.' },
        { es:'Gestionar la solicitud por escrito ante la autoridad y guardar el acuse.',
          en:'File the written request with the authority and keep the acknowledgment.' },
        { es:'Ejecutar la parte que le toca al grupo, tal como se acordó.',
          en:'Carry out the part that falls to the group, exactly as agreed.' },
        { es:'Evaluar en asamblea abierta si se cumplió y dejarlo en el acta.',
          en:'Evaluate in open assembly whether it was fulfilled and record it in the minutes.' } ] },
    { t:{ es:'Caso: la colonia quiere recuperar el terreno baldío de la esquina', en:'Case: the neighborhood wants to reclaim the vacant lot on the corner' },
      steps:[
        { es:'Registrar con las vecinas y los vecinos qué usos hacen falta y qué riesgos hay.',
          en:'Register with the residents what uses are needed and what risks exist.' },
        { es:'Convocar a la asamblea y acordar ahí el uso del terreno.',
          en:'Call the assembly and agree the use of the lot there.' },
        { es:'Escribir el plan con tareas, responsables y calendario.',
          en:'Write the plan with tasks, responsibilities and a calendar.' },
        { es:'Solicitar el permiso a quien administra el terreno y conservar el folio.',
          en:'Request permission from whoever administers the lot and keep the file number.' },
        { es:'Realizar la jornada de trabajo con lo acordado.',
          en:'Hold the work day according to what was agreed.' },
        { es:'Rendir cuentas del gasto y del resultado ante la asamblea.',
          en:'Account for the spending and the outcome before the assembly.' } ] }
  ];
  var p = pools[Math.floor(rng() * pools.length)];
  RUT = { p:p, order:shufflePerm(p.steps.length, rng), sel:null, tries:0, done:false, note:null, noteOk:false };
  return '<div class="wgt" data-widget="timeline" id="wRuta">' +
      wgtHead(S('Ruta del proyecto','Project route'),
              S('Las etapas llegan revueltas. Ponlas en el orden que las sostiene: toca una y luego otra para intercambiarlas.',
                'The stages arrive scrambled. Put them in the order that holds them up: tap one and then another to swap them.')) +
      '<div id="rutBox"></div>' +
    '</div>';
}

function rutRender(){
  if (!RUT) return;
  var box = document.getElementById('rutBox');
  if (!box) return;
  var chips = RUT.order.map(function(ei, pos){
    var cls = 'tl-chip' + (RUT.sel === pos ? ' sel' : '') + (RUT.done ? ' locked' : '');
    return '<div class="' + cls + '" onclick="rutTap(' + pos + ')"><span class="tl-num">' + (pos + 1) + '</span> ' + RUT.p.steps[ei][LANG] + '</div>';
  }).join('');
  var msg = RUT.note || S('En cada etapa pregúntate qué tiene que existir ya para poder darla.',
                          'At each stage ask what has to exist already before you can take it.');
  box.innerHTML =
    '<div class="wcase">' + RUT.p.t[LANG] + '</div>' +
    '<div class="tl-list">' + chips + '</div>' +
    (RUT.done ? '' : '<button class="wbtn" onclick="rutCheck()">' + S('Revisar la ruta','Check the route') + '</button>') +
    '<div class="wmsg ' + (RUT.note ? (RUT.noteOk ? 'ok' : 'warn') : '') + '">' + msg + '</div>';
}

function rutTap(pos){
  if (!RUT || RUT.done) return;
  if (RUT.sel === null) { RUT.sel = pos; }
  else if (RUT.sel === pos) { RUT.sel = null; }
  else {
    var t = RUT.order[RUT.sel]; RUT.order[RUT.sel] = RUT.order[pos]; RUT.order[pos] = t;
    RUT.sel = null;
  }
  rutRender();
}

function rutCheck(){
  if (!RUT || RUT.done) return;
  var ok = true, first = -1, i;
  for (i = 0; i < RUT.order.length; i++) if (RUT.order[i] !== i) { ok = false; if (first < 0) first = i; }
  if (ok) {
    RUT.done = true; RUT.noteOk = true;
    RUT.note = S('Ruta armada. El diagnóstico da razones, la asamblea da mandato, el plan reparte el trabajo, la gestión suma la obligación de la autoridad y la evaluación deja el resultado a la vista de quien lo acordó.',
                 'Route assembled. The diagnosis provides reasons, the assembly provides a mandate, the plan distributes the work, the request adds the obligation of the authority, and the evaluation leaves the outcome in plain sight of those who agreed it.');
    rutRender();
    return;
  }
  RUT.tries++;
  if (RUT.tries >= 3) {
    RUT.order = RUT.p.steps.map(function(_, k){ return k; });
    RUT.done = true; RUT.noteOk = false;
    RUT.note = S('Esta es la ruta. Cada etapa produce lo que la siguiente necesita: sin diagnóstico no hay qué acordar, sin acuerdo no hay a nombre de quién gestionar, y sin evaluación el proyecto no le rinde cuentas a nadie.',
                 'This is the route. Each stage produces what the next one needs: with no diagnosis there is nothing to agree, with no agreement there is nobody to file in the name of, and with no evaluation the project accounts to nobody.');
    rutRender();
    return;
  }
  RUT.noteOk = false;
  RUT.note = S('Todavía no. Mira la etapa número ' + (first + 1) + ': ¿qué necesitarías tener ya en la mano para poder darla?',
               'Not yet. Look at stage number ' + (first + 1) + ': what would you need already in hand to be able to take it?');
  rutRender();
}

/* ================================================
   WIDGET 4 - EL ANTIDOTO (emparejador de dos columnas)
   A practice that erodes democratic life on the left, the mechanism that repairs
   it on the right. A wrong pair answers with what that mechanism actually does,
   never with a bare cross; the third miss on the same case reveals its pair
   (Rule 8, pattern A).
   ================================================ */
var ANT = null;
function buildAntidoto(rng){
  var sets = [
    [ { l:{ es:'Los apoyos se entregan solo a quienes asisten a los actos de quien los reparte.',
            en:'Support is handed out only to those who attend the events of whoever hands it out.' },
        r:{ es:'Reglas de operación públicas y padrón abierto.', en:'Public operating rules and an open register.' },
        w:{ es:'Fijan por escrito quién tiene derecho al apoyo, de modo que recibirlo deje de depender de a quién se aplaude.',
            en:'They set down in writing who is entitled to the support, so receiving it stops depending on who you applaud.' } },
      { l:{ es:'El comité gastó el dinero reunido y responde que preguntar por los recibos es desconfiar.',
            en:'The committee spent the money raised and replies that asking for receipts is a show of distrust.' },
        r:{ es:'Informe con comprobantes ante la asamblea.', en:'A report with receipts before the assembly.' },
        w:{ es:'Obliga a quien administra recursos ajenos a mostrar en qué se usaron y ante quién responde.',
            en:'It obliges whoever administers other people resources to show what they went to and to whom they answer.' } },
      { l:{ es:'Se le prohíbe al periódico escolar publicar críticas a la dirección.',
            en:'The school paper is forbidden from publishing criticism of the head office.' },
        r:{ es:'Libertad de expresión con derecho de réplica.', en:'Freedom of expression with a right of reply.' },
        w:{ es:'Deja circular la crítica y le da a quien se sienta aludido un espacio para responder, en vez de impedir la publicación.',
            en:'It lets the criticism circulate and gives whoever feels targeted a space to answer, instead of blocking publication.' } },
      { l:{ es:'La convocatoria a la consulta se publica el mismo día y en un solo lugar.',
            en:'The call for the public consultation is posted the same day and in one place only.' },
        r:{ es:'Convocatoria anticipada, difundida y en varios formatos.', en:'An early call, widely spread and in several formats.' },
        w:{ es:'Asegura que quien va a quedar obligado por la decisión alcance a enterarse y pueda llegar.',
            en:'It ensures that whoever will be bound by the decision finds out in time and can get there.' } } ],
    [ { l:{ es:'Se le niega un trámite a una persona porque habla una lengua indígena.',
            en:'A person is refused a procedure because they speak an indigenous language.' },
        r:{ es:'Trato igual y traducción disponible en la ventanilla.', en:'Equal treatment and translation available at the counter.' },
        w:{ es:'Quita la barrera que impedía ejercer un derecho y deja el servicio abierto a todas las personas.',
            en:'It removes the barrier that blocked the exercise of a right and leaves the service open to everyone.' } },
      { l:{ es:'La autoridad se niega a entregar el contrato de una obra pagada con dinero público.',
            en:'The authority refuses to hand over the contract of a work paid with public money.' },
        r:{ es:'Solicitud de transparencia con resolución obligatoria.', en:'A transparency request with a binding resolution.' },
        w:{ es:'Obliga a entregar la información o a justificar la negativa ante un órgano que puede revocarla.',
            en:'It forces the release of the information or a justified refusal before a body that can overturn it.' } },
      { l:{ es:'La asamblea aprueba en dos minutos, sin dejar hablar a quien se opone.',
            en:'The assembly approves in two minutes, without letting the opposition speak.' },
        r:{ es:'Turnos de palabra y respuesta a las objeciones.', en:'Speaking turns and answers to the objections.' },
        w:{ es:'Da lugar a las razones contrarias antes de votar, que es lo que vuelve obligatorio el acuerdo para todos.',
            en:'It makes room for the opposing reasons before the vote, which is what makes the agreement binding on everyone.' } },
      { l:{ es:'El presidente del comité decide por su cuenta y avisa después a la colonia.',
            en:'The committee chair decides alone and tells the neighborhood afterwards.' },
        r:{ es:'Facultades definidas y decisión en asamblea.', en:'Defined powers and decisions taken in assembly.' },
        w:{ es:'Deja claro qué puede resolver una persona sola y qué tiene que pasar por el colectivo.',
            en:'It makes clear what one person may settle alone and what has to go through the collective.' } } ]
  ];
  var items = sets[Math.floor(rng() * sets.length)];
  ANT = { items:items, right:shufflePerm(items.length, rng), sel:null, tries:0, solved:[], done:false, note:null, noteOk:false };
  items.forEach(function(){ ANT.solved.push(false); });
  return '<div class="wgt" data-widget="match" id="wAntidoto">' +
      wgtHead(S('El antídoto','The antidote'),
              S('Une cada práctica que desgasta la vida democrática con el mecanismo que la corrige. Toca una de la izquierda y luego una de la derecha.',
                'Match each practice that wears down democratic life with the mechanism that repairs it. Tap one on the left and then one on the right.')) +
      '<div id="antBox"></div>' +
    '</div>';
}

function antRender(){
  if (!ANT) return;
  var box = document.getElementById('antBox');
  if (!box) return;
  var left = ANT.items.map(function(it, i){
    var cls = 'optbox' + (ANT.solved[i] ? ' done' : (ANT.sel === i ? ' sel' : ''));
    return '<div class="' + cls + '" onclick="antLeft(' + i + ')">' + it.l[LANG] + '</div>';
  }).join('');
  var right = ANT.right.map(function(ri, pos){
    var cls = 'optbox' + (ANT.solved[ri] ? ' done' : '');
    return '<div class="' + cls + '" onclick="antRight(' + pos + ')">' + ANT.items[ri].r[LANG] + '</div>';
  }).join('');
  var msg = ANT.note || S('Cada mecanismo repara un daño distinto: elige por lo que corrige, no por el tema del que se habla.',
                          'Each mechanism repairs a different damage: choose by what it corrects, not by the topic being discussed.');
  box.innerHTML =
    '<div class="mcols">' +
      '<div><div class="colh">' + S('Lo que desgasta','What wears it down') + '</div>' + left + '</div>' +
      '<div><div class="colh">' + S('Lo que lo repara','What repairs it') + '</div>' + right + '</div>' +
    '</div>' +
    '<div class="wmsg ' + (ANT.note ? (ANT.noteOk ? 'ok' : 'warn') : '') + '">' + msg + '</div>' +
    '<div class="wprog">' + ANT.solved.filter(function(x){ return x; }).length + ' / ' + ANT.items.length + '</div>';
}

function antLeft(i){
  if (!ANT || ANT.done || ANT.solved[i]) return;
  var was = ANT.sel;
  ANT.sel = (ANT.sel === i) ? null : i;
  if (was !== i) ANT.tries = 0;
  ANT.note = null; ANT.noteOk = false;
  antRender();
}

function antRight(pos){
  if (!ANT || ANT.done) return;
  var ri = ANT.right[pos];
  if (ANT.solved[ri]) return;
  if (ANT.sel === null) {
    ANT.noteOk = false;
    ANT.note = S('Elige primero una práctica de la izquierda y después el mecanismo que le corresponde.',
                 'Pick a practice on the left first and then the mechanism that fits it.');
    antRender();
    return;
  }
  var i = ANT.sel;
  if (ri === i) {
    ANT.solved[i] = true; ANT.sel = null; ANT.tries = 0; ANT.noteOk = true;
    ANT.note = S('Correcto. ' + ANT.items[i].w.es, 'Correct. ' + ANT.items[i].w.en);
    if (ANT.solved.every(function(x){ return x; })) {
      ANT.done = true;
      ANT.note = S('Tablero completo. Ninguna de estas prácticas se corrige con buenas intenciones: cada una necesita una regla concreta que devuelva la decisión o la información a quien le corresponde.',
                   'Board complete. None of these practices is corrected with good intentions: each needs a concrete rule that returns the decision or the information to whoever it belongs to.');
    }
    antRender();
    return;
  }
  ANT.tries++;
  if (ANT.tries >= 3) {
    ANT.solved[i] = true; ANT.sel = null; ANT.tries = 0; ANT.noteOk = false;
    ANT.note = S('Esa práctica se repara con otro mecanismo. ' + ANT.items[i].w.es,
                 'That practice is repaired by a different mechanism. ' + ANT.items[i].w.en);
    if (ANT.solved.every(function(x){ return x; })) ANT.done = true;
    antRender();
    return;
  }
  ANT.noteOk = false;
  ANT.note = S('Todavía no. Lo que elegiste hace otra cosa: ' + ANT.items[ri].w.es + ' Vuelve a leer qué daño hay que reparar.',
               'Not yet. What you picked does something else: ' + ANT.items[ri].w.en + ' Read again what damage needs repairing.');
  antRender();
}

/* ================================================
   WIDGET 5 - CUADERNO ABIERTO (ejercicio de reflexión)
   Seeded prompt, answered by writing or sketching. Non verdict feedback.
   ================================================ */
function buildCuaderno(rng){
  var PROMPTS = [
    { es:'Elige una necesidad real de tu escuela o de tu colonia y escribe su diagnóstico en tres líneas: qué ocurre, desde cuándo y a quiénes alcanza.',
      en:'Pick a real need in your school or your neighborhood and write its diagnosis in three lines: what happens, since when, and who it reaches.' },
    { es:'Traza el mapa de un proyecto que te gustaría impulsar: marca quién decide, quién ejecuta, ante quién se gestiona y quién comprueba el resultado.',
      en:'Sketch the map of a project you would like to push: mark who decides, who carries it out, who it is filed with and who checks the result.' },
    { es:'Escribe tres reglas para que la próxima asamblea de tu grupo sea una decisión de todos y no de quien habla más fuerte.',
      en:'Write three rules so that your class next assembly is a decision by everyone and not by whoever talks loudest.' }
  ];
  var p = PROMPTS[Math.floor(rng() * PROMPTS.length)];
  var wrap = document.createElement('div');
  wrap.className = 'wgt section';
  wrap.setAttribute('data-widget', 'reflect');
  wrap.id = 'wCuaderno';
  wrap.innerHTML =
    wgtHead(S('Cuaderno abierto','Open notebook'),
            S('Aquí escribes o trazas tu propia respuesta.','Here you write or sketch your own answer.')) +
    '<div class="reflect-prompt">' + p[LANG] + '</div>' +
    '<div class="wtabs">' +
      '<button class="wtab active" onclick="cuadTab(\'type\',this)">' + t('tab-type') + '</button>' +
      '<button class="wtab" onclick="cuadTab(\'draw\',this)">' + t('tab-draw') + '</button>' +
    '</div>' +
    '<div class="wpanel active" id="cuad_type"><textarea class="wtextarea" id="cuadTa" placeholder="' + S('Tu respuesta...','Your answer...') + '"></textarea></div>' +
    '<div class="wpanel" id="cuad_draw"><div class="cvwrap"><canvas class="dcanvas" id="cuadCv"></canvas>' +
      '<div class="ctoolbar">' +
        '<button class="tbtn2 bpen on">' + t('btn-pen') + '</button>' +
        '<button class="tbtn2 bmarker">' + t('btn-marker') + '</button>' +
        '<button class="tbtn2 beraser">' + t('btn-eraser') + '</button>' +
        '<div class="cdot sel" data-color="#0f2d5a" style="background:#0f2d5a"></div>' +
        '<div class="cdot" data-color="#1a1a16" style="background:#1a1a16"></div>' +
        '<div class="cdot" data-color="#8b2500" style="background:#8b2500"></div>' +
        '<div class="cdot" data-color="#1d4e89" style="background:#1d4e89"></div>' +
        '<button class="clrbtn">' + t('btn-clear') + '</button>' +
      '</div>' +
    '</div></div>' +
    '<button class="wbtn" onclick="cuadSave()">' + S('Guardar','Save') + '</button>' +
    '<div class="wmsg" id="cuadFb">' + S('Aquí no hay una sola respuesta. Escribe la tuya y compárala después con la de alguien más.',
                                         'There is no single answer here. Write yours and compare it later with someone else.') + '</div>';
  document.getElementById('lessonBody').appendChild(wrap);
}

function cuadTab(which, btn){
  ['type', 'draw'].forEach(function(x){
    var el = document.getElementById('cuad_' + x);
    if (el) el.classList.toggle('active', x === which);
  });
  var wrap = document.getElementById('wCuaderno');
  if (wrap) wrap.querySelectorAll('.wtab').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  if (which === 'draw') setTimeout(function(){
    var c = document.getElementById('cuadCv');
    if (c && !c.width) initCanvas(c);
  }, 60);
}

function cuadSave(){
  var fb = document.getElementById('cuadFb');
  if (!fb) return;
  fb.className = 'wmsg ok';
  fb.textContent = S('Guardado. Lo que acabas de escribir ya tiene la forma de una propuesta, y una propuesta se puede llevar a una asamblea o a una autoridad.',
                     'Saved. What you just wrote already has the shape of a proposal, and a proposal can be taken to an assembly or to an authority.');
}

/* ================================================
   buildLesson - interleaved concept, manipulative, graded problem (Rule 1)
   ================================================ */
function buildLesson(rng) {
  problems = []; answeredCount = 0; correctCount = 0;
  document.getElementById('lessonBody').innerHTML = '';

  /* CONCEPTO 1 */
  addSection(S('CONCEPTO 1','CONCEPT 1'),
    '<h2>' + S('De la queja a la acción organizada','From complaint to organized action') + '</h2>' +
    '<p>' + S('Ser ciudadana o ciudadano no se agota en cumplir la ley y esperar. Consiste en intervenir en los asuntos que afectan a un conjunto de personas, hacerlo junto con otras y dirigir esa intervención a quien tiene la facultad de resolver. Esa posibilidad es un derecho, no un permiso que alguien concede cuando le parece.',
              'Being a citizen does not end with obeying the law and waiting. It consists of stepping into the matters that affect a group of people, doing it alongside others, and aiming that intervention at whoever holds the power to resolve. That possibility is a right, not a permission somebody grants when it suits them.') + '</p>' +
    '<p>' + S('Los derechos que se ejercen así se ordenan en tres dimensiones. La civil protege lo que cada quien es, dice y decide: expresarse, asociarse, moverse, recibir trato igual, no ser juzgado sin defensa. La política reparte el poder de decidir: votar, ser electo, proponer, consultar, vigilar y exigir cuentas a quien gobierna. La social sostiene las condiciones materiales sin las cuales las dos anteriores quedan en el papel: salud, educación, agua, vivienda, trabajo digno, un entorno sano. Reconocer cuál está en juego decide a qué puerta se toca y con qué argumento.',
              'The rights exercised this way fall into three dimensions. The civil one protects what each person is, says and decides: speaking, associating, moving, being treated equally, not being judged without a defense. The political one distributes the power to decide: voting, being elected, proposing, consulting, watching and demanding accounts from those who govern. The social one holds up the material conditions without which the other two stay on paper: health, education, water, housing, decent work, a healthy environment. Recognizing which one is at stake decides which door you knock on and with what argument.') + '</p>' +
    '<div class="callout"><p><strong>' + S('Clave: ','Key: ') + '</strong>' +
      S('la ciudadanía activa no empieza cuando alguien tiene la razón, sino cuando esa razón se organiza y se dirige a quien puede resolverla.',
        'active citizenship does not begin when somebody is right, but when that reason gets organized and aimed at whoever can settle it.') + '</p></div>' +
    '<div class="rules-grid">' +
      '<div class="rcard"><div class="rname">' + S('Dimensión civil','Civil dimension') + '</div><div class="rform">' + S('lo que eres y dices','what you are and say') + '</div><div class="rnote">' + S('Libertades personales protegidas frente al poder.','Personal liberties protected against power.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Dimensión política','Political dimension') + '</div><div class="rform">' + S('entrar en la decisión','entering the decision') + '</div><div class="rnote">' + S('Decidir, proponer y vigilar a quien gobierna.','Deciding, proposing and watching those who govern.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Dimensión social','Social dimension') + '</div><div class="rform">' + S('condiciones de vida','conditions of life') + '</div><div class="rnote">' + S('Salud, escuela, agua y trabajo al alcance.','Health, school, water and work within reach.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Acción organizada','Organized action') + '</div><div class="rform">' + S('con otros y por escrito','with others and in writing') + '</div><div class="rnote">' + S('Lo que se acuerda en grupo se puede exigir después.','What a group agrees can be demanded later.') + '</div></div>' +
    '</div>' +
    buildPuertas(rng));
  pue3Render();

  /* PROBLEMA 1 */
  addProblem(pick([
    { title:{ es:'La puerta que corresponde', en:'The door that fits' }, showWork:false,
      stmt:{ es:'Un grupo de estudiantes junta firmas para que el consejo escolar vuelva a discutir una cuota que se fijó sin consultar a nadie. Un adulto les dice que ese asunto no les toca. ¿Qué dimensión de la ciudadanía están ejerciendo?',
             en:'A group of students collects signatures so the school council will discuss again a fee that was set without consulting anyone. An adult tells them the matter is none of their business. Which dimension of citizenship are they exercising?' },
      options:{ es:[
        'La política, porque buscan entrar en la decisión y piden que el órgano que fijó la cuota la discuta de nuevo.',
        'La social, porque el reclamo trata de dinero y del acceso de las familias al servicio educativo.',
        'La civil, porque firmar es un acto personal y cada quien decide libremente si pone su nombre o no.',
        'Ninguna, porque el consejo escolar reúne a personas adultas y el estudiantado solo opina cuando se le pregunta.' ],
        en:[
        'The political one, because they are seeking a place in the decision and asking the body that set the fee to discuss it again.',
        'The social one, because the complaint is about money and about family access to the education service.',
        'The civil one, because signing is a personal act and each person freely decides whether to put their name down.',
        'None of them, because the school council is made up of adults and students only speak when asked.' ] },
      correct:0,
      hint:{ es:'Fíjate en qué está realmente en juego: una libertad personal, una condición de vida, o el modo en que se tomó una decisión que obliga a todos.',
             en:'Look at what is really at stake: a personal liberty, a condition of life, or the way a decision binding everyone was taken.' },
      explanation:{ es:'Firmar es en efecto un acto civil, pero eso es el medio, no el fin. Lo que persigue el grupo es que el órgano que decidió vuelva a decidir con ellos dentro, y eso es participación política aunque ocurra en una escuela y no en una elección. La dimensión social aparecería si el reclamo fuera por la falta del servicio mismo.',
                    en:'Signing is indeed a civil act, but that is the means, not the end. What the group is after is that the body which decided should decide again with them inside, and that is political participation even though it happens in a school and not in an election. The social dimension would appear if the complaint were about the absence of the service itself.' } },
    { title:{ es:'La puerta que corresponde', en:'The door that fits' }, showWork:false,
      stmt:{ es:'Una colonia lleva ocho meses sin agua entubada. Un grupo de vecinas documenta el problema y solicita audiencia con la autoridad municipal para que el servicio se restablezca. Alguien les advierte que eso ya es hacer política y que mejor esperen. ¿Cómo se describe mejor lo que están haciendo?',
             en:'A neighborhood has gone eight months without piped water. A group of residents documents the problem and requests a hearing with the town authority so the service is restored. Someone warns them that this is already doing politics and that they should just wait. How is what they are doing best described?' },
      options:{ es:[
        'Reclaman un derecho social y usan la vía política para exigirlo, que es justo lo que la ciudadanía activa permite hacer.',
        'Hacen un trámite civil, porque solicitar una audiencia es un acto personal que cualquiera puede realizar por su cuenta.',
        'Sustituyen a la autoridad, porque el abasto de agua es una tarea técnica que no admite intervención de quienes reciben el servicio.',
        'Ejercen solo un derecho político, porque el agua no figura entre los derechos que una persona puede exigir.' ],
        en:[
        'They are claiming a social right and using the political route to demand it, which is exactly what active citizenship allows.',
        'They are doing a civil procedure, because requesting a hearing is a personal act anyone can carry out on their own.',
        'They are replacing the authority, because water supply is a technical task that admits no intervention from those who receive the service.',
        'They are exercising only a political right, because water is not among the rights a person may demand.' ] },
      correct:0,
      hint:{ es:'Separa dos cosas: el derecho que está sin cumplirse y el camino que eligieron para exigirlo.',
             en:'Separate two things: the right that is going unfulfilled and the route they chose to demand it.' },
      explanation:{ es:'El agua es una condición material de vida, así que el derecho reclamado es social. Pedir audiencia y llevar el caso ante quien decide es la vía política. Las dos cosas conviven siempre: un derecho social se hace efectivo casi siempre por un camino político, y recorrerlo no sustituye a nadie ni es indebido.',
                    en:'Water is a material condition of life, so the right being claimed is social. Requesting a hearing and taking the case to whoever decides is the political route. The two always coexist: a social right is almost always made effective through a political route, and walking it replaces nobody and is not improper.' } }
  ], rng), rng);
