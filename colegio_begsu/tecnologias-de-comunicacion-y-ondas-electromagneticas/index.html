<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tecnologías de Comunicación y Ondas Electromagnéticas</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
  --pos:        #b8442c;
  --neg:        #2f6fa8;
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
  --pos:        #cf5a3e;
  --neg:        #4a8fcf;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }

/* ── MANIPULATIVOS INTERACTIVOS ── */
.iw { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.1rem; margin:1rem 0 2.4rem; }
.iw-tag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.iw-task { font-size:.88rem; color:var(--text2); margin-bottom:.75rem; }
.iw-cv { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface2); }
.iw-cv canvas { display:block; width:100%; height:auto; }
.ctrl { margin:.7rem 0; }
.ctrl label { display:block; font-size:.75rem; color:var(--text3); margin-bottom:.25rem; }
.ctrl input[type=range] { width:100%; accent-color:var(--green); height:28px; }
.readout { display:grid; grid-template-columns:repeat(3,1fr); gap:.5rem; margin:.8rem 0; }
.ro { background:var(--surface2); border-radius:8px; padding:.5rem .35rem; text-align:center; }
.ro-l { font-size:.62rem; text-transform:uppercase; letter-spacing:.05em; color:var(--text3); }
.ro-v { font-family:'IBM Plex Mono',monospace; font-size:.9rem; font-weight:600; color:var(--green); }
.rverify-btn { background:var(--green); color:#fff; border:none; border-radius:8px; padding:.6rem 1.2rem; font-size:.84rem; font-weight:600; cursor:pointer; min-height:44px; }
.rverify-btn:hover { background:var(--green-dark); }
.rfb { font-size:.84rem; color:var(--text2); margin-top:.6rem; min-height:1.3rem; }
.okfb { color:var(--ok); font-weight:700; }
.optrow { display:flex; flex-wrap:wrap; gap:.5rem; margin:.7rem 0; }
.optbtn { flex:1 1 140px; min-height:44px; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-family:inherit; font-size:.85rem; font-weight:600; cursor:pointer; padding:.5rem .7rem; }
.optbtn:hover { border-color:var(--green); background:var(--green-bg); }
.optbtn.on { border-color:var(--green); background:var(--green-bg); color:var(--green-dark); }
.stepper { display:flex; align-items:center; gap:.5rem; margin:.5rem 0; flex-wrap:wrap; }
.steplbl { font-size:.75rem; color:var(--text3); min-width:120px; }
.stepbtn { min-width:44px; min-height:44px; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:1.1rem; font-weight:700; cursor:pointer; font-family:inherit; }
.stepbtn:hover { border-color:var(--green); background:var(--green-bg); }
.stepval { font-family:'IBM Plex Mono',monospace; font-size:1rem; font-weight:600; color:var(--green); min-width:86px; text-align:center; }
.cls-card { display:block; text-align:center; font-weight:600; font-size:.92rem; background:var(--surface2); border:1.5px solid var(--border); border-radius:8px; padding:.8rem .6rem; margin:.6rem 0; }
.cls-prog { font-family:'IBM Plex Mono',monospace; font-size:.72rem; color:var(--text3); }
.cls-bins { display:flex; flex-wrap:wrap; gap:.5rem; margin:.7rem 0; }
.cls-bin { flex:1 1 140px; min-height:44px; border:1.5px solid var(--border); border-radius:8px; padding:.55rem .8rem; cursor:pointer; background:var(--surface2); color:var(--text); font-family:inherit; font-size:.86rem; font-weight:600; }
.cls-bin:hover { border-color:var(--green); background:var(--green-bg); }
.cls-done { font-weight:700; color:var(--ok); text-align:center; padding:.8rem; }
.tl-list { display:flex; flex-wrap:wrap; gap:.5rem; margin:.75rem 0; }
.tl-chip { display:flex; align-items:center; gap:.4rem; min-height:44px; border:1.5px solid var(--border); border-radius:8px; padding:.5rem .8rem; cursor:pointer; background:var(--surface2); color:var(--text); font-size:.85rem; font-weight:600; flex:1 1 100%; }
.tl-chip:hover { border-color:var(--green); }
.tl-chip.sel { border-color:var(--gold); background:var(--gold-bg); }
.tl-chip.locked { cursor:default; }
.tl-num { font-family:'IBM Plex Mono',monospace; color:var(--text3); font-weight:700; }
@media (max-width:600px) {
  .iw { padding:.8rem; }
  .readout { grid-template-columns:1fr 1fr; }
  .cls-bin { flex:1 1 100%; }
  .optbtn { flex:1 1 46%; }
  .steplbl { min-width:100%; }
}
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Tecnologías de Comunicación y Ondas Electromagnéticas</div>
    <div class="wcourse" id="wcourse-el">Física · 2° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>

/* ── Attempt counter + seed (Rule 4): seed = name+group+attempt ── */
function getAttemptKey(name, group){ return 'liaxa_fis2_t08_g03__att__' + (name+'__'+group).replace(/\s+/g,'_'); }
function nextAttempt(name, group){ var k=getAttemptKey(name,group),n=0; try{n=parseInt(localStorage.getItem(k)||'0',10)||0;}catch(e){} n++; try{localStorage.setItem(k,String(n));}catch(e){} return n; }
function currentAttempt(name, group){ var k=getAttemptKey(name,group); try{return parseInt(localStorage.getItem(k)||'1',10)||1;}catch(e){return 1;} }

var studentData   = {};
var problems      = [];

/* ================================================
   SESSION PERSISTENCE  (localStorage)
   ================================================ */
function lsKey() {
  var n = (studentData.name  || '').trim();
  var g = (studentData.group || '').trim();
  return 'liaxa_fis2_t08_g03__' + (n + '__' + g).replace(/\s+/g, '_');
}

function saveSession() {
  if (!studentData.name) return;
  var drawings = [], texts = [], photos = [];
  problems.forEach(function(p, i) {
    var dc = document.getElementById('dc' + i);
    if (dc && dc.width) {
      var blank = document.createElement('canvas');
      blank.width = dc.width; blank.height = dc.height;
      drawings.push(dc.toDataURL() === blank.toDataURL() ? null : dc.toDataURL('image/png'));
    } else { drawings.push(null); }
    var ta = document.getElementById('ta' + i);
    texts.push(ta ? ta.value : '');
    var pp = document.getElementById('pp' + i);
    photos.push((pp && pp.src && pp.src.indexOf('data:') === 0) ? pp.src : null);
  });
  var state = {
    name: studentData.name, group: studentData.group,
    answeredCount: answeredCount, correctCount: correctCount,
    choices: problems.map(function(p) { return p.studentChoice; }),
    drawings: drawings, texts: texts, photos: photos
  };
  try { localStorage.setItem(lsKey(), JSON.stringify(state)); } catch(e) {}
}

function loadSession(name, group) {
  var key = 'liaxa_fis2_t08_g03__' + (name + '__' + group).replace(/\s+/g, '_');
  try { var r = localStorage.getItem(key); return r ? JSON.parse(r) : null; } catch(e) { return null; }
}

function restoreSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  var saved = loadSession(name, group);
  if (!saved) return;
  document.getElementById('restoreBar').style.display = 'none';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = currentAttempt(name, group);
  buildLesson(seededRng(name + group + att));
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
  saved.choices.forEach(function(choice, idx) {
    if (choice !== null && choice !== undefined) confirmMC(idx, choice);
  });
  setTimeout(function() {
    if (saved.drawings) {
      saved.drawings.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var dc = document.getElementById('dc' + i);
        if (!dc || !dc.width) return;
        var img = new Image();
        img.onload = function() {
          var dpr = window.devicePixelRatio || 1;
          dc.getContext('2d').drawImage(img, 0, 0, dc.width / dpr, dc.height / dpr);
        };
        img.src = dataUrl;
      });
    }
    if (saved.texts) {
      saved.texts.forEach(function(text, i) {
        if (!text) return;
        var ta = document.getElementById('ta' + i);
        if (ta) ta.value = text;
      });
    }
    if (saved.photos) {
      saved.photos.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var pp = document.getElementById('pp' + i);
        if (!pp) return;
        pp.src = dataUrl; pp.style.display = 'block';
        var pz = document.getElementById('pz' + i);
        if (pz) pz.style.opacity = '0.4';
      });
    }
  }, 300);
}

function dismissRestore() {
  document.getElementById('restoreBar').style.display = 'none';
}

function checkForSavedSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  if (!name || !group) { document.getElementById('restoreBar').style.display = 'none'; return; }
  var saved = loadSession(name, group);
  var bar = document.getElementById('restoreBar');
  bar.style.display = (saved && saved.choices && saved.choices.some(function(c){ return c !== null; })) ? 'block' : 'none';
}

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS — INJECTION BLOCK ─────────────────────────────────────────
  //   Match these RGB values to --green and --gold above.

  function pdfText(html) {
    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/\u2192/g,'->').replace(/\u2212/g,'-').replace(/\u00b2/g,'^2')
      .replace(/\u00b3/g,'^3').replace(/\u00d7/g,'x').replace(/\u00f7/g,'/')
      .replace(/\u2260/g,'!=').replace(/\u2264/g,'<=').replace(/\u2265/g,'>=')
      .replace(/\u221a/g,'sqrt').replace(/\u03c0/g,'pi').replace(/\u2026/g,'...')

    doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
    doc.setFontSize(7); doc.setFont('helvetica','bold');
    doc.rect(M,wy,TW,8,'F'); doc.text('TRABAJO DEL ALUMNO', M+4, wy+5.5);
    wy += 11;

    var dc = document.getElementById('dc'+i);
    if (dc) {
      try {

      } catch(e) {}
    }

    var ta = document.getElementById('ta'+i);

      if (wy > PH-30) { doc.addPage(); wy = 20; }
      doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('courier','normal');
      var taLines = doc.splitTextToSize(ta.value, TW);
      taLines.slice(0,16).forEach(function(ln) {

    }

      if (wy > PH-55) { doc.addPage(); wy = 20; }
      try { doc.addImage(pp.src, 'JPEG', M, wy, TW, 68); wy += 72; } catch(e) {}

  }

  // ── Footer on every page ──
  var pages = doc.internal.getNumberOfPages();
  for (var p = 1; p <= pages; p++) {
    doc.setPage(p);

    doc.text(name+'  ·  '+group+'  ·  Código: '+code+'  ·  Página '+p+'/'+pages,
      PW/2, PH-5, {align:'center'});
  }

  doc.save('fis2_t08_g03_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf');
  btn.innerHTML = '⬇ &nbsp;Descargar Resultados PDF';
  btn.disabled  = false;
}

function L(o){ return (o && o[LANG] !== undefined) ? o[LANG] : (o && o.es) || ''; }
function fmt(x){ return String(Math.round(x * 1000) / 1000); }
function mil(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
function CV(n){ var v = getComputedStyle(document.documentElement).getPropertyValue(n); return (v || '').trim() || '#808080'; }

function sec(tag, title, html){
  var d = document.createElement('div');
  d.className = 'section';
  d.innerHTML = '<div class="stag">' + tag + '</div><h2>' + title + '</h2>' + html;
  document.getElementById('lessonBody').appendChild(d);
  return d;
}
function iw(kind, id){
  var d = document.createElement('div');
  d.className = 'iw section';
  d.id = id;
  d.setAttribute('data-widget', kind);
  document.getElementById('lessonBody').appendChild(d);
  return d;
}
function rcard(name, form, note){
  return '<div class="rcard"><div class="rname">' + name + '</div><div class="rform">' + form + '</div><div class="rnote">' + note + '</div></div>';
}
function shuffleOpts(opts, correctText, rng){
  var a = shuffle(opts, rng);
  return { opts: a, idx: a.indexOf(correctText) };
}
function optsU(correct, cands, unit){
  var vals = [correct];
  for (var i = 0; i < cands.length && vals.length < 4; i++) {
    if (cands[i] === null || cands[i] === undefined) continue;
    if (vals.indexOf(cands[i]) < 0) vals.push(cands[i]);
  }
  var k = 1;
  while (vals.length < 4) { if (vals.indexOf(correct + k) < 0) vals.push(correct + k); k++; }
  return vals.map(function(x){ return fmt(x) + unit; });
}
function addProb(spec, rng){
  var s = shuffleOpts(spec.options, spec.correct, rng);
  var i = problems.length;
  problems.push({
    title: spec.title, questionText: spec.q, fn: spec.fn || '',
    hint: spec.hint, explanation: spec.exp,
    options: s.opts, correctIdx: s.idx, showWork: !!spec.showWork,
    studentChoice: null, pendingChoice: null
  });
  buildOneCard(problems[i], i);
}

      en: 'Even though 300 000 kilometres per second is a huge amount, it is not infinite, and as soon as distances grow the delay becomes measurable. A signal going from a city antenna to your phone travels a few kilometres and takes millionths of a second, something nobody notices. A call that climbs to a very high satellite and comes back down travels tens of thousands of kilometres and its delay already shows as a small pause in the conversation.'
    }) + '</p>' +
    '<p>' + L({
      es: 'Ese retraso depende únicamente de la distancia recorrida, no del tipo de onda ni de la potencia del equipo. Una señal de radio y una de microondas que hagan el mismo recorrido tardan exactamente lo mismo. Por eso, para reducir demoras, se acercan las antenas al usuario y se usan satélites más bajos, en lugar de intentar acelerar la señal, que es imposible.',
      en: 'That delay depends only on the distance travelled, not on the kind of wave nor on the power of the equipment. A radio signal and a microwave signal covering the same route take exactly the same time. That is why, to cut delays, antennas are brought closer to the user and lower satellites are used, instead of trying to speed up the signal, which is impossible.'

  );

/* ══ MANIPULATIVO 1 · VENTANA DE ONDA ══════════════════════════════════════
   Ventana fija de 12 m. El alumno estira o encoge la onda con los botones y
   la curva se redibuja al instante, con los rótulos de longitud de onda y de
   oscilaciones visibles. Tres rondas con meta distinta, pista direccional y
   revelado al tercer intento fallido.
   ═════════════════════════════════════════════════════════════════════════ */
function wOnda(rng){
  var host = iw('onda', 'wOnda');
  var WIN = 12;
  var LAMS = [1, 1.5, 2, 3, 4, 6, 12];
  var METAS = shuffle([2, 3, 4, 6], rng).slice(0, 3);
  var st = { r: 0, li: 6, amp: 60, tries: 0, done: false };
  function lam(){ return LAMS[st.li]; }
  function osc(){ return WIN / lam(); }
  function meta(){ return METAS[Math.min(st.r, METAS.length - 1)]; }

  host.innerHTML =
    '<div class="iw-tag">' + L({ es: 'Ventana de onda', en: 'Wave window' }) + '</div>' +
    '<div class="iw-task iw-sub" id="wOnTask"></div>' +
    '<div class="iw-cv"><canvas id="wOnCv"></canvas></div>' +
    '<div class="stepper">' +
      '<span class="steplbl">' + L({ es: 'Longitud de onda', en: 'Wavelength' }) + '</span>' +
      '<button class="stepbtn" onclick="wOnStep(-1)">−</button>' +
      '<span class="stepval" id="wOnLam"></span>' +
      '<button class="stepbtn" onclick="wOnStep(1)">+</button>' +
    '</div>' +
    '<div class="ctrl"><label>' + L({ es: 'Amplitud de la señal', en: 'Signal amplitude' }) + '</label>' +
      '<input type="range" id="wOnAmp" min="20" max="80" value="60" oninput="wOnAmpSet(this.value)"></div>' +
    '<div class="readout">' +
      '<div class="ro"><div class="ro-l">' + L({ es: 'Ronda', en: 'Round' }) + '</div><div class="ro-v" id="wOnR"></div></div>' +
      '<div class="ro"><div class="ro-l">' + L({ es: 'Oscilaciones', en: 'Oscillations' }) + '</div><div class="ro-v" id="wOnN"></div></div>' +
      '<div class="ro"><div class="ro-l">' + L({ es: 'Meta', en: 'Target' }) + '</div><div class="ro-v" id="wOnM"></div></div>' +
    '</div>' +
    '<button class="rverify-btn" onclick="wOnCheck()">' + L({ es: 'Comprobar', en: 'Check' }) + '</button>' +
    '<div class="rfb" id="wOnFb"></div>';

  function draw(){
    var cv = document.getElementById('wOnCv');
    if (!cv) return;
    var rect = cv.getBoundingClientRect();
    var dpr = window.devicePixelRatio || 1;
    var W = Math.round(rect.width || 320), H = 200;
    cv.width = W * dpr; cv.height = H * dpr;
    var c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, W, H);
    var pad = 18, iw2 = W - pad * 2, cy = H / 2 + 6;
    c.strokeStyle = CV('--border'); c.lineWidth = 1;
    c.beginPath(); c.moveTo(pad, cy); c.lineTo(W - pad, cy); c.stroke();
    for (var m = 0; m <= WIN; m++) {
      var gx = pad + iw2 * m / WIN;
      c.beginPath(); c.moveTo(gx, cy - 4); c.lineTo(gx, cy + 4); c.stroke();
    }
    c.strokeStyle = CV('--neg'); c.lineWidth = 2.5;
    c.beginPath();
    for (var px = 0; px <= iw2; px++) {
      var xm = px / iw2 * WIN;
      var y = cy - st.amp * 0.9 * Math.sin(2 * Math.PI * xm / lam());
      if (px === 0) c.moveTo(pad + px, y); else c.lineTo(pad + px, y);
    }
    c.stroke();
    var w1 = iw2 * lam() / WIN;
    c.strokeStyle = CV('--pos'); c.lineWidth = 2;
    c.beginPath(); c.moveTo(pad, cy + 74); c.lineTo(pad + w1, cy + 74); c.stroke();
    c.beginPath(); c.moveTo(pad, cy + 70); c.lineTo(pad, cy + 78); c.stroke();
    c.beginPath(); c.moveTo(pad + w1, cy + 70); c.lineTo(pad + w1, cy + 78); c.stroke();
    c.fillStyle = CV('--text2'); c.font = '12px IBM Plex Sans, sans-serif'; c.textAlign = 'left';
    c.fillText(L({ es: 'ventana de 12 m', en: '12 m window' }), pad, 16);
    c.fillStyle = CV('--pos');
    c.fillText(fmt(lam()) + ' m', pad + w1 + 6, cy + 78);
  }
  function paint(){
    document.getElementById('wOnLam').textContent = fmt(lam()) + ' m';
    document.getElementById('wOnR').textContent = st.done ? L({ es: 'libre', en: 'free' }) : ((st.r + 1) + ' / 3');
    document.getElementById('wOnN').textContent = fmt(osc());
    document.getElementById('wOnM').textContent = st.done ? '-' : String(meta());
    document.getElementById('wOnTask').textContent = st.done
      ? L({ es: 'Ventana libre: estira y encoge la onda y observa cómo cambia el número de oscilaciones que caben en los mismos 12 metros.',
            en: 'Free window: stretch and shrink the wave and watch how the number of oscillations fitting into the same 12 metres changes.' })
      : L({ es: 'Ronda ' + (st.r + 1) + ' de 3: ajusta la onda hasta que quepan exactamente ' + meta() + ' oscilaciones completas en la ventana.',
            en: 'Round ' + (st.r + 1) + ' of 3: adjust the wave until exactly ' + meta() + ' complete oscillations fit inside the window.' });
    draw();
  }
  window.wOnStep = function(d){
    st.li = Math.max(0, Math.min(LAMS.length - 1, st.li + d));
    paint();
  };
  window.wOnAmpSet = function(v){ st.amp = parseInt(v, 10) * 0.9; paint(); };
  window.wOnCheck = function(){
    var fb = document.getElementById('wOnFb');
    if (st.done) { fb.textContent = L({ es: 'Sigue explorando: cada vez que acortas la onda caben más oscilaciones.', en: 'Keep exploring: every time you shorten the wave, more oscillations fit.' }); return; }
    var n = osc();
    if (n === meta()) {
      st.r++; st.tries = 0;
      if (st.r >= 3) { st.done = true; paint(); document.getElementById('wOnFb').innerHTML = '<span class="okfb">🎉 ' + L({ es: 'Las tres metas conseguidas. La ventana queda libre.', en: 'All three targets reached. The window is now free.' }) + '</span>'; return; }
      st.li = 6; paint();
      document.getElementById('wOnFb').innerHTML = '<span class="okfb">✓ ' + L({ es: 'Exacto. Siguiente meta.', en: 'Exactly. Next target.' }) + '</span>';
      return;
    }
    st.tries++;
    if (st.tries >= 3) {
      st.li = LAMS.indexOf(WIN / meta());
      st.r++; st.tries = 0;
      var solved = fmt(WIN / meta());
      if (st.r >= 3) st.done = true;
      paint();
      document.getElementById('wOnFb').textContent = L({
        es: 'Con ' + solved + ' m de longitud de onda caben justo ' + meta() + ' oscilaciones en los 12 metros.',
        en: 'With a wavelength of ' + solved + ' m, exactly ' + meta() + ' oscillations fit into the 12 metres.' });
      return;
    }
    paint();
    document.getElementById('wOnFb').textContent = n > meta()
      ? L({ es: 'Caben ' + fmt(n) + ' oscilaciones, son demasiadas: alarga la onda.', en: fmt(n) + ' oscillations fit, that is too many: make the wave longer.' })
      : L({ es: 'Caben ' + fmt(n) + ' oscilaciones, son muy pocas: acorta la onda.', en: fmt(n) + ' oscillations fit, that is too few: make the wave shorter.' });
  };
  paint();
  setTimeout(paint, 120);
}

/* ══ MANIPULATIVO 2 · MESA DE EQUILIBRIO ═══════════════════════════════════
   La barra del producto crece y se encoge en vivo mientras el alumno ajusta
   la longitud de onda; solo se alinea con la marca de la rapidez de la luz
   cuando la pareja de valores es la correcta. Tres rondas y revelado.
   ═════════════════════════════════════════════════════════════════════════ */
function wProducto(rng){
  var host = iw('balance', 'wProducto');
  var LAMS = [1, 1.5, 2, 3, 4, 5, 6, 8, 10, 12, 15, 20, 30];
  var FS = shuffle([50, 60, 75, 100, 150], rng).slice(0, 3);
  var st = { r: 0, li: 0, tries: 0, done: false };
  function f(){ return FS[Math.min(st.r, FS.length - 1)]; }
  function lam(){ return LAMS[st.li]; }
  function prod(){ return lam() * f(); }
  function goal(){ return 300 / f(); }

  host.innerHTML =
    '<div class="iw-tag">' + L({ es: 'Mesa de equilibrio', en: 'Balance table' }) + '</div>' +
    '<div class="iw-task iw-sub" id="wPrTask"></div>' +
    '<div class="iw-cv"><canvas id="wPrCv"></canvas></div>' +
    '<div class="stepper">' +
      '<span class="steplbl">' + L({ es: 'Longitud de onda', en: 'Wavelength' }) + '</span>' +
      '<button class="stepbtn" onclick="wPrStep(-1)">−</button>' +
      '<span class="stepval" id="wPrLam"></span>' +
      '<button class="stepbtn" onclick="wPrStep(1)">+</button>' +
    '</div>' +
    '<div class="readout">' +
      '<div class="ro"><div class="ro-l">' + L({ es: 'Ronda', en: 'Round' }) + '</div><div class="ro-v" id="wPrR"></div></div>' +
      '<div class="ro"><div class="ro-l">' + L({ es: 'Frecuencia', en: 'Frequency' }) + '</div><div class="ro-v" id="wPrF"></div></div>' +
      '<div class="ro"><div class="ro-l">' + L({ es: 'Producto', en: 'Product' }) + '</div><div class="ro-v" id="wPrP"></div></div>' +
    '</div>' +
    '<button class="rverify-btn" onclick="wPrCheck()">' + L({ es: 'Comprobar', en: 'Check' }) + '</button>' +
    '<div class="rfb" id="wPrFb"></div>';

  function draw(){
    var cv = document.getElementById('wPrCv');
    if (!cv) return;
    var rect = cv.getBoundingClientRect();
    var dpr = window.devicePixelRatio || 1;
    var W = Math.round(rect.width || 320), H = 170;
    cv.width = W * dpr; cv.height = H * dpr;
    var c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, W, H);
    var pad = 16, bw = W - pad * 2, MAXP = 600;
    var gx = pad + bw * 300 / MAXP;
    c.fillStyle = CV('--surface'); c.fillRect(pad, 44, bw, 26);
    c.strokeStyle = CV('--border'); c.lineWidth = 1.5; c.strokeRect(pad, 44, bw, 26);
    var pw = Math.min(bw, bw * prod() / MAXP);
    c.fillStyle = prod() === 300 ? CV('--ok') : CV('--neg');
    c.fillRect(pad, 44, pw, 26);
    c.strokeStyle = CV('--pos'); c.lineWidth = 3;
    c.beginPath(); c.moveTo(gx, 34); c.lineTo(gx, 88); c.stroke();
    c.fillStyle = CV('--pos'); c.font = 'bold 12px IBM Plex Sans, sans-serif'; c.textAlign = 'center';
    c.fillText(L({ es: 'rapidez de la luz', en: 'speed of light' }), gx, 26);
    c.textAlign = 'left';
    c.fillStyle = CV('--text2'); c.font = '12px IBM Plex Sans, sans-serif';
    c.fillText(L({ es: 'longitud de onda × frecuencia', en: 'wavelength × frequency' }), pad, 104);
    c.fillStyle = CV('--text'); c.font = 'bold 15px IBM Plex Mono, monospace';
    c.fillText(fmt(lam()) + ' × ' + f() + ' = ' + fmt(prod()), pad, 126);
    c.fillStyle = CV('--text3'); c.font = '11px IBM Plex Sans, sans-serif';
    c.fillText(L({ es: 'la barra debe llegar justo a la marca', en: 'the bar must reach exactly to the mark' }), pad, 148);
  }
  function paint(){
    document.getElementById('wPrLam').textContent = fmt(lam()) + ' m';
    document.getElementById('wPrR').textContent = st.done ? L({ es: 'libre', en: 'free' }) : ((st.r + 1) + ' / 3');
    document.getElementById('wPrF').textContent = f() + ' MHz';
    document.getElementById('wPrP').textContent = fmt(prod());
    document.getElementById('wPrTask').textContent = st.done
      ? L({ es: 'Mesa libre: mueve la longitud de onda y observa cómo se desborda o se queda corta la barra respecto a la marca fija.',
            en: 'Free table: move the wavelength and watch how the bar overshoots or falls short of the fixed mark.' })
      : L({ es: 'Ronda ' + (st.r + 1) + ' de 3: la emisora trabaja a ' + f() + ' MHz. Ajusta la longitud de onda hasta que la barra quede alineada con la marca.',
            en: 'Round ' + (st.r + 1) + ' of 3: the station works at ' + f() + ' MHz. Adjust the wavelength until the bar lines up with the mark.' });
    draw();
  }
  window.wPrStep = function(d){ st.li = Math.max(0, Math.min(LAMS.length - 1, st.li + d)); paint(); };
  window.wPrCheck = function(){
    var fb = document.getElementById('wPrFb');
    if (st.done) { fb.textContent = L({ es: 'Sigue probando: si duplicas la longitud de onda, la barra se pasa al doble.', en: 'Keep trying: if you double the wavelength, the bar overshoots twice as far.' }); return; }
    if (prod() === 300) {
      st.r++; st.tries = 0;
      if (st.r >= 3) { st.done = true; paint(); document.getElementById('wPrFb').innerHTML = '<span class="okfb">🎉 ' + L({ es: 'Las tres parejas equilibradas. La mesa queda libre.', en: 'All three pairs balanced. The table is now free.' }) + '</span>'; return; }
      st.li = 0; paint();
      document.getElementById('wPrFb').innerHTML = '<span class="okfb">✓ ' + L({ es: 'Equilibrada. Siguiente emisora.', en: 'Balanced. Next station.' }) + '</span>';
      return;
    }
    st.tries++;
    if (st.tries >= 3) {
      var g = goal();
      st.li = LAMS.indexOf(g); st.r++; st.tries = 0;
      if (st.r >= 3) st.done = true;
      paint();
      document.getElementById('wPrFb').textContent = L({
        es: 'La pareja que equilibra es ' + fmt(g) + ' m con esa frecuencia: su producto da exactamente la marca.',
        en: 'The pair that balances is ' + fmt(g) + ' m with that frequency: their product lands exactly on the mark.' });
      return;
    }
    paint();
    document.getElementById('wPrFb').textContent = prod() > 300
      ? L({ es: 'La barra se pasó de la marca: acorta la longitud de onda.', en: 'The bar overshot the mark: shorten the wavelength.' })
      : L({ es: 'La barra no llega a la marca: alarga la longitud de onda.', en: 'The bar falls short of the mark: lengthen the wavelength.' });
  };
  paint();
  setTimeout(paint, 120);
}

/* ══ MANIPULATIVO 3 · REPARTO DE BANDAS ════════════════════════════════════
   Aparatos reales, uno a la vez, que el alumno manda a su banda. Pista
   direccional al fallar y revelado al tercer intento del mismo aparato.
   ═════════════════════════════════════════════════════════════════════════ */
function wBandas(rng){
  var host = iw('classify', 'wBandas');
  var BINS = [
    L({ es: 'Ondas de radio', en: 'Radio waves' }),
    L({ es: 'Microondas', en: 'Microwaves' }),
    L({ es: 'Infrarrojo', en: 'Infrared' }),
    L({ es: 'Luz visible', en: 'Visible light' })
  ];
  var ITEMS = [
    { es: 'La estación de FM que escuchas en el auto', en: 'The FM station you listen to in the car', bin: 0,
      pes: 'cubre toda la ciudad y su antena mide varios metros', pen: 'it covers the whole city and its antenna is several metres long' },
    { es: 'La televisión abierta que se capta con antena de varilla', en: 'Broadcast television picked up with a rod antenna', bin: 0,
      pes: 'rodea edificios y llega a barrios enteros', pen: 'it goes around buildings and reaches whole neighbourhoods' },
    { es: 'El wifi que reparte internet en una casa', en: 'The wifi sharing internet in a house', bin: 1,
      pes: 'atraviesa paredes delgadas y su antena cabe en una caja pequeña', pen: 'it crosses thin walls and its antenna fits in a small box' },
    { es: 'La llamada entre un celular y la torre del barrio', en: 'The call between a mobile phone and the local tower', bin: 1,
      pes: 'necesita antena muy corta y llega a pocos kilómetros', pen: 'it needs a very short antenna and reaches a few kilometres' },
    { es: 'El enlace de un satélite de televisión con la antena del techo', en: 'The link from a television satellite to the rooftop dish', bin: 1,
      pes: 'sube al espacio en línea recta y usa un plato metálico', pen: 'it climbs into space in a straight line and uses a metal dish' },
    { es: 'El control remoto que apaga el televisor desde el sillón', en: 'The remote control that switches off the television from the sofa', bin: 2,
      pes: 'deja de funcionar si tapas su ventanita o te sales de la sala', pen: 'it stops working if you cover its little window or leave the room' },
    { es: 'El mando que cambia la temperatura del aire acondicionado', en: 'The handset that changes the air conditioning temperature', bin: 2,
      pes: 'hay que apuntarlo al aparato y no funciona desde otro cuarto', pen: 'you have to point it at the unit and it fails from another room' },
    { es: 'El internet que viaja entre ciudades por fibra óptica', en: 'The internet travelling between cities through optical fibre', bin: 3,
      pes: 'va encerrado en un hilo de vidrio, no por el aire', pen: 'it travels shut inside a glass thread, not through the air' }
  ];
  var seq = shuffle([0, 1, 2, 3, 4, 5, 6, 7], rng).slice(0, 6);
  var st = { i: 0, tries: 0, ok: 0, done: false };

  function render(){
    if (st.done) {
      host.innerHTML = '<div class="iw-tag">' + L({ es: 'Reparto de bandas', en: 'Band sorting' }) + '</div>' +
        '<div class="cls-done">🎉 ' + L({ es: 'Mesa completa: ', en: 'Table complete: ' }) + st.ok + ' / ' + seq.length + '</div>';
      return;
    }
    var it = ITEMS[seq[st.i]];
    host.innerHTML =
      '<div class="iw-tag">' + L({ es: 'Reparto de bandas', en: 'Band sorting' }) + '</div>' +
      '<div class="iw-task iw-sub">' + L({ es: 'Manda cada aparato a la banda que usa para comunicarse.', en: 'Send each device to the band it uses to communicate.' }) + '</div>' +
      '<div class="cls-prog">' + (st.i + 1) + ' / ' + seq.length + '</div>' +
      '<div class="cls-card">' + it[LANG === 'en' ? 'en' : 'es'] + '</div>' +
      '<div class="cls-bins">' + BINS.map(function(b, bi){
        return '<button class="cls-bin" onclick="wBaPick(' + bi + ')">' + b + '</button>';
      }).join('') + '</div>' +
      '<div class="rfb" id="wBaFb"></div>';
  }
  window.wBaPick = function(bi){
    if (st.done) return;
    var it = ITEMS[seq[st.i]];
    if (bi === it.bin) {
      st.ok++; st.tries = 0; st.i++;
      if (st.i >= seq.length) st.done = true;
      render();
      if (!st.done) document.getElementById('wBaFb').innerHTML = '<span class="okfb">✓ ' + L({ es: 'Ahí va. Siguiente aparato.', en: 'That is the one. Next device.' }) + '</span>';
      return;
    }
    st.tries++;
    var fb = document.getElementById('wBaFb');
    if (st.tries >= 3) {
      fb.innerHTML = L({ es: 'Era <b>', en: 'It was <b>' }) + BINS[it.bin] + '</b>: ' + (LANG === 'en' ? it.pen : it.pes) + '.';

      if (st.i >= seq.length) st.done = true;
      setTimeout(render, 1600);
      return;
    }
    fb.textContent = L({
      es: 'Aún no. Fíjate en el alcance y en el tamaño de la antena: ' + (LANG === 'en' ? it.pen : it.pes) + '.',
      en: 'Not yet. Look at the range and the antenna size: ' + it.pen + '.' });
  };
  render();
}

/* ══ MANIPULATIVO 4 · CADENA DE LA LLAMADA ═════════════════════════════════
   Los seis pasos del viaje de la voz, revueltos. El alumno toca dos tarjetas
   para intercambiarlas cuantas veces quiera; al comprobar recibe una pista
   sobre el primer paso mal colocado y al tercer fallo se revela el orden.
   ═════════════════════════════════════════════════════════════════════════ */
function wCadena(rng){
  var host = iw('timeline', 'wCadena');
  var PASOS = [
    { es: 'Tu voz mueve el micrófono y se vuelve una señal eléctrica', en: 'Your voice moves the microphone and becomes an electric signal' },
    { es: 'El aparato monta esa señal sobre una corriente que oscila muy rápido', en: 'The device mounts that signal onto a current oscillating very fast' },
    { es: 'La corriente llega a la antena y sale de ella una onda electromagnética', en: 'The current reaches the antenna and an electromagnetic wave leaves it' },
    { es: 'La onda cruza el aire hasta la antena que la espera', en: 'The wave crosses the air to the antenna waiting for it' },
    { es: 'La onda sacude las cargas de esa antena y produce en ella una corriente débil', en: 'The wave shakes the charges of that antenna and produces a weak current in it' },
    { es: 'El receptor separa la información y la bocina la devuelve como sonido', en: 'The receiver separates the information and the loudspeaker returns it as sound' }
  ];
  var st = { order: shuffle([0, 1, 2, 3, 4, 5], rng), sel: null, tries: 0, done: false };

  function render(){
    var chips = st.order.map(function(ei, pos){
      var cls = 'tl-chip' + (st.sel === pos ? ' sel' : '') + (st.done ? ' locked' : '');
      return '<div class="' + cls + '" onclick="wCaTap(' + pos + ')"><span class="tl-num">' + (pos + 1) + '</span> ' + L(PASOS[ei]) + '</div>';
    }).join('');
    host.innerHTML =
      '<div class="iw-tag">' + L({ es: 'Cadena de la llamada', en: 'Call chain' }) + '</div>' +
      '<div class="iw-task iw-sub">' + L({ es: 'Acomoda los pasos desde que hablas hasta que la otra persona te escucha. Toca dos tarjetas para intercambiarlas.', en: 'Arrange the steps from the moment you speak to the moment the other person hears you. Tap two cards to swap them.' }) + '</div>' +
      '<div class="tl-list">' + chips + '</div>' +
      '<button class="rverify-btn" onclick="wCaCheck()">' + L({ es: 'Comprobar', en: 'Check' }) + '</button>' +
      '<div class="rfb" id="wCaFb"></div>';
  }
  window.wCaTap = function(pos){
    if (st.done) return;
    if (st.sel === null) st.sel = pos;
    else if (st.sel === pos) st.sel = null;
    else { var t2 = st.order[st.sel]; st.order[st.sel] = st.order[pos]; st.order[pos] = t2; st.sel = null; }
    render();
  };
  window.wCaCheck = function(){
    var ok = st.order.every(function(ei, pos){ return ei === pos; });
    if (ok) {
      st.done = true; render();
      document.getElementById('wCaFb').innerHTML = '<span class="okfb">🎉 ' + L({ es: 'Cadena completa: así viaja tu voz.', en: 'Chain complete: that is how your voice travels.' }) + '</span>';
      return;
    }
    st.tries++;
    if (st.tries >= 3) {
      st.order = [0, 1, 2, 3, 4, 5]; st.done = true; render();
      document.getElementById('wCaFb').textContent = L({
        es: 'Este es el orden. Fíjate en que la onda solo existe entre las dos antenas: antes y después todo es corriente eléctrica.',
        en: 'This is the order. Notice that the wave only exists between the two antennas: before and after, everything is electric current.' });
      return;
    }
    var bad = 0;
    for (var i = 0; i < st.order.length; i++) { if (st.order[i] !== i) { bad = i; break; } }
    document.getElementById('wCaFb').textContent = L({
      es: 'Todavía no. Revisa el paso número ' + (bad + 1) + ': ¿lo que describe ocurre antes o después de lo que pusiste arriba?',
      en: 'Not yet. Check step number ' + (bad + 1) + ': does what it describes happen before or after what you put above it?' });
  };
  render();
}

/* ══ MANIPULATIVO 5 · MESA DE RETRASO ══════════════════════════════════════
   El alumno aleja o acerca la estación con el deslizador y elige si la señal
   hace solo la ida o la ida y vuelta. El cronómetro y el dibujo del recorrido
   responden al instante. Tres metas, pista direccional y revelado.
   ═════════════════════════════════════════════════════════════════════════ */
function wRetardo(rng){
  var host = iw('retardo', 'wRetardo');
  var METAS = shuffle([30, 60, 100, 120], rng).slice(0, 3);
  var st = { d: 6000, ida: true, r: 0, tries: 0, done: false };
  function rec(){ return st.d * (st.ida ? 1 : 2); }
  function ms(){ return rec() / 300; }
  function meta(){ return METAS[Math.min(st.r, METAS.length - 1)]; }

  host.innerHTML =
    '<div class="iw-tag">' + L({ es: 'Mesa de retraso', en: 'Delay table' }) + '</div>' +
    '<div class="iw-task iw-sub" id="wReTask"></div>' +
    '<div class="iw-cv"><canvas id="wReCv"></canvas></div>' +
    '<div class="ctrl"><label>' + L({ es: 'Distancia hasta la estación', en: 'Distance to the station' }) + '</label>' +
      '<input type="range" id="wReD" min="1500" max="45000" step="1500" value="6000" oninput="wReSet(this.value)"></div>' +
    '<div class="optrow">' +
      '<button class="optbtn" id="wRe_ida" onclick="wReVia(1)">' + L({ es: 'Solo ida', en: 'Outward only' }) + '</button>' +
      '<button class="optbtn" id="wRe_vue" onclick="wReVia(0)">' + L({ es: 'Ida y vuelta', en: 'Round trip' }) + '</button>' +
    '</div>' +
    '<div class="readout">' +
      '<div class="ro"><div class="ro-l">' + L({ es: 'Recorrido', en: 'Path' }) + '</div><div class="ro-v" id="wReKm"></div></div>' +
      '<div class="ro"><div class="ro-l">' + L({ es: 'Retraso', en: 'Delay' }) + '</div><div class="ro-v" id="wReMs"></div></div>' +
      '<div class="ro"><div class="ro-l">' + L({ es: 'Meta', en: 'Target' }) + '</div><div class="ro-v" id="wReM"></div></div>' +
    '</div>' +
    '<button class="rverify-btn" onclick="wReCheck()">' + L({ es: 'Comprobar', en: 'Check' }) + '</button>' +
    '<div class="rfb" id="wReFb"></div>';

  function draw(){
    var cv = document.getElementById('wReCv');
    if (!cv) return;
    var rect = cv.getBoundingClientRect();
    var dpr = window.devicePixelRatio || 1;
    var W = Math.round(rect.width || 320), H = 170;
    cv.width = W * dpr; cv.height = H * dpr;
    var c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, W, H);
    var pad = 30, ax = pad, by = H - 34;
    var frac = st.d / 45000;
    var bx = pad + (W - pad * 2) * frac;
    var topY = by - 24 - 68 * frac;
    c.strokeStyle = CV('--border'); c.lineWidth = 1.5;
    c.beginPath(); c.moveTo(10, by + 12); c.lineTo(W - 10, by + 12); c.stroke();
    c.strokeStyle = CV('--neg'); c.lineWidth = 2.5;
    c.beginPath(); c.moveTo(ax, by); c.lineTo(bx, topY); c.stroke();
    if (!st.ida) {
      c.strokeStyle = CV('--pos'); c.lineWidth = 2.5;
      c.beginPath(); c.moveTo(bx, topY); c.lineTo(ax + 16, by); c.stroke();
    }
    c.fillStyle = CV('--green');
    c.fillRect(ax - 4, by - 16, 8, 16);
    c.beginPath(); c.arc(bx, topY, 8, 0, Math.PI * 2); c.fill();
    c.fillStyle = CV('--text2'); c.font = '12px IBM Plex Sans, sans-serif'; c.textAlign = 'left';
    c.fillText(L({ es: 'tu aparato', en: 'your device' }), 10, 18);
    c.textAlign = 'right';
    c.fillText(L({ es: 'estación', en: 'station' }), W - 10, 18);
    c.textAlign = 'center';
    c.fillStyle = CV('--text'); c.font = 'bold 14px IBM Plex Mono, monospace';

  }
  function paint(){
    document.getElementById('wReKm').textContent = mil(rec()) + ' km';
    document.getElementById('wReMs').textContent = fmt(Math.round(ms() * 100) / 100) + ' ms';
    document.getElementById('wReM').textContent = st.done ? '-' : (meta() + ' ms');
    document.getElementById('wRe_ida').classList.toggle('on', st.ida);
    document.getElementById('wRe_vue').classList.toggle('on', !st.ida);
    document.getElementById('wReTask').textContent = st.done
      ? L({ es: 'Mesa libre: aleja y acerca la estación y observa que el retraso solo depende de los kilómetros recorridos.',
            en: 'Free table: move the station away and closer and notice that the delay depends only on the kilometres travelled.' })
      : L({ es: 'Ronda ' + (st.r + 1) + ' de 3: consigue un retraso de exactamente ' + meta() + ' ms. Hay más de una forma de lograrlo.',
            en: 'Round ' + (st.r + 1) + ' of 3: get a delay of exactly ' + meta() + ' ms. There is more than one way to do it.' });
    draw();
  }
  window.wReSet = function(v){ st.d = parseInt(v, 10); paint(); };
  window.wReVia = function(k){ st.ida = (k === 1); paint(); };
  window.wReCheck = function(){
    var fb = document.getElementById('wReFb');
    if (st.done) { fb.textContent = L({ es: 'Sigue explorando: al duplicar los kilómetros, el retraso se duplica.', en: 'Keep exploring: doubling the kilometres doubles the delay.' }); return; }
    var cur = Math.round(ms() * 100) / 100;
    if (cur === meta()) {
      st.r++; st.tries = 0;
      if (st.r >= 3) { st.done = true; paint(); document.getElementById('wReFb').innerHTML = '<span class="okfb">🎉 ' + L({ es: 'Los tres retrasos conseguidos. La mesa queda libre.', en: 'All three delays reached. The table is now free.' }) + '</span>'; return; }
      st.d = 6000; st.ida = true; paint();
      document.getElementById('wReFb').innerHTML = '<span class="okfb">✓ ' + L({ es: 'Justo ese retraso. Siguiente meta.', en: 'Exactly that delay. Next target.' }) + '</span>';
      return;
    }
    st.tries++;
    if (st.tries >= 3) {
      st.d = meta() * 300; st.ida = true; st.r++; st.tries = 0;
      var km = mil(meta() * 300);
      if (st.r >= 3) st.done = true;
      paint();
      document.getElementById('wReFb').textContent = L({
        es: 'Un recorrido de ' + km + ' km da ese retraso: cada 300 km cuestan una milésima de segundo.',
        en: 'A path of ' + km + ' km gives that delay: every 300 km costs one thousandth of a second.' });
      return;
    }
    paint();
    document.getElementById('wReFb').textContent = cur > meta()
      ? L({ es: 'Vas en ' + fmt(cur) + ' ms, te pasaste: acerca la estación o quita el viaje de regreso.', en: 'You are at ' + fmt(cur) + ' ms, too much: bring the station closer or drop the return trip.' })
      : L({ es: 'Vas en ' + fmt(cur) + ' ms, te quedaste corto: aleja la estación o agrega el viaje de regreso.', en: 'You are at ' + fmt(cur) + ' ms, too little: move the station away or add the return trip.' });
  };
  paint();
  setTimeout(paint, 120);
}

           en: 'A radio amateur disconnects the antenna from his transmitter but leaves the device switched on and speaking into the microphone. The internal circuits keep working normally. What happens to the transmission?' }),
    options: o2, correct: o2[0],
    hint: L({ es: 'Recorre el viaje del mensaje y localiza el punto exacto en el que deja de ser corriente eléctrica para volverse onda que cruza el aire.',
              en: 'Trace the journey of the message and find the exact point where it stops being electric current and becomes a wave crossing the air.' }),
    exp: L({ es: 'Dentro del aparato el mensaje viaja como corriente, y es la antena la que convierte esa corriente en onda que cruza el aire. Sin antena el eslabón se rompe justo ahí y nada sale al espacio, por más que el resto del equipo funcione.',
             en: 'Inside the device the message travels as current, and it is the antenna that turns that current into a wave crossing the air. With no antenna the link breaks exactly there and nothing goes out into space, however well the rest of the equipment works.' })

/* ── PROBLEMA 9 · retraso de la señal por satélite ── */
function mkP9(rng){
  var DS = [30000, 36000, 45000];
  var d = DS[Math.floor(rng() * DS.length)], ms = 2 * d / 300;
  if (rng() < 0.5) {
    return {
      title: L({ es: 'La pausa en la llamada', en: 'The pause in the call' }),
      showWork: true,
      q: L({ es: 'Una llamada se enruta por un satélite situado a ' + mil(d) + ' km de altura: la señal sube desde un teléfono hasta el satélite y baja hasta el otro teléfono. Las ondas viajan a 300 000 kilómetros por segundo. ¿Cuánto tarda la señal en hacer ese recorrido?',
             en: 'A call is routed through a satellite located ' + mil(d) + ' km up: the signal climbs from one phone to the satellite and comes down to the other phone. The waves travel at 300 000 kilometres per second. How long does the signal take to cover that path?' }),
      options: optsU(ms, [ms / 2, ms * 2, ms / 4], ' ms'), correct: fmt(ms) + ' ms',
      hint: L({ es: 'Suma primero los kilómetros de subida y de bajada; después reparte ese recorrido entre la rapidez, recordando que cada 300 km cuestan una milésima de segundo.',
                en: 'First add the kilometres going up and coming down; then divide that path by the speed, remembering that every 300 km costs one thousandth of a second.' }),
      exp: L({ es: 'El recorrido completo es ' + mil(d) + ' km de subida más ' + mil(d) + ' km de bajada, es decir ' + mil(2 * d) + ' km. Repartidos entre 300 km por milisegundo dan ' + ms + ' ms, una pausa ya perceptible al conversar.',
               en: 'The complete path is ' + mil(d) + ' km up plus ' + mil(d) + ' km down, that is ' + mil(2 * d) + ' km. Divided by 300 km per millisecond that gives ' + ms + ' ms, a pause already noticeable in conversation.' })
    };
  }
  var o = [
    L({ es: 'No es correcto: la señal viaja a 300 000 km por segundo y la pausa viene de los ' + mil(2 * d) + ' km que recorre de ida y vuelta.', en: 'It is not correct: the signal travels at 300 000 km per second and the pause comes from the ' + mil(2 * d) + ' km it covers up and down.' }),
    L({ es: 'Es correcto: en el vacío del espacio las ondas pierden rapidez y por eso tardan más en llegar.', en: 'It is correct: in the vacuum of space waves lose speed and that is why they take longer to arrive.' }),
    L({ es: 'Es correcto: la señal se frena cada vez que cambia de aparato al pasar por el satélite.', en: 'It is correct: the signal slows down every time it changes device passing through the satellite.' }),
    L({ es: 'No es correcto: la pausa aparece porque el satélite usa una frecuencia más baja que las antenas de tierra.', en: 'It is not correct: the pause appears because the satellite uses a lower frequency than the ground antennas.' })
  ];
  return {
    title: L({ es: 'La explicación del retraso', en: 'The explanation of the delay' }),
    showWork: false,
    q: L({ es: 'En una llamada que pasa por un satélite situado a ' + mil(d) + ' km de altura se nota una pequeña pausa antes de escuchar la respuesta. Un técnico explica que eso ocurre porque la señal viaja más despacio en el espacio que en el aire. ¿Es correcta su explicación?',
           en: 'In a call routed through a satellite located ' + mil(d) + ' km up, a small pause is noticed before the answer is heard. A technician explains that this happens because the signal travels more slowly in space than in air. Is his explanation correct?' }),
    options: o, correct: o[0],
    hint: L({ es: 'La rapidez de estas ondas es la misma en el aire y en el vacío. Fíjate entonces en el único dato que sí cambia mucho respecto de una llamada dentro de la ciudad.',
              en: 'The speed of these waves is the same in air and in vacuum. So look at the only figure that really does change a lot compared with a call inside the city.' }),
    exp: L({ es: 'La rapidez no baja en el espacio. Lo que crece es la distancia: subir y bajar suma ' + mil(2 * d) + ' km, y ese recorrido cuesta ' + ms + ' ms, mientras que una antena de la ciudad está a unos pocos kilómetros y su retraso es imperceptible.',
             en: 'The speed does not drop in space. What grows is the distance: going up and down adds up to ' + mil(2 * d) + ' km, and that path costs ' + ms + ' ms, whereas a city antenna is a few kilometres away and its delay is imperceptible.' })
  };
}

/* ── PROBLEMA 10 · cierre: tamaño de la onda y tiempo de viaje ── */
function mkP10(rng){
  var FS = [50, 60, 100], DS = [60, 90, 120];
  var f = FS[Math.floor(rng() * FS.length)], d = DS[Math.floor(rng() * DS.length)];
  var lam = 300 / f, ms = d / 300;
  if (rng() < 0.5) {
    var par = function(a, b){ return L({ es: fmt(a) + ' m y ' + fmt(b) + ' ms', en: fmt(a) + ' m and ' + fmt(b) + ' ms' }); };
    var o = [par(lam, ms), par(lam, ms * 10), par(lam / 2, ms), par(lam * 2, ms * 2)];
    return {
      title: L({ es: 'La señal de la emisora', en: 'The signal of the station' }),
      showWork: true,
      q: L({ es: 'Una emisora transmite a ' + f + ' MHz y su antena está a ' + d + ' km de tu casa. Las ondas electromagnéticas viajan a 300 000 kilómetros por segundo. ¿Cuánto mide una oscilación completa de esa señal y cuánto tarda en llegar hasta ti?',
             en: 'A station transmits at ' + f + ' MHz and its antenna is ' + d + ' km from your house. Electromagnetic waves travel at 300 000 kilometres per second. How long is one complete oscillation of that signal and how long does it take to reach you?' }),
      options: o, correct: o[0],
      hint: L({ es: 'Son dos cuentas separadas que usan el mismo dato de rapidez: una reparte la rapidez entre la frecuencia y la otra reparte la distancia entre la rapidez.',
                en: 'They are two separate calculations using the same speed figure: one divides the speed by the frequency and the other divides the distance by the speed.' }),
      exp: L({ es: 'La onda mide 300 / ' + f + ' = ' + lam + ' metros. El tiempo sale de repartir la distancia entre la rapidez: cada 300 km cuestan una milésima de segundo, así que ' + d + ' km cuestan ' + ms + ' ms.',
               en: 'The wave measures 300 / ' + f + ' = ' + lam + ' metres. The time comes from dividing the distance by the speed: every 300 km costs one thousandth of a second, so ' + d + ' km costs ' + ms + ' ms.' })
    };
  }
  var o2 = [
    L({ es: 'Se equivocó por mucho: el recorrido de ' + d + ' km cuesta apenas ' + fmt(ms) + ' ms, muy por debajo de medio segundo.', en: 'He was way off: the ' + d + ' km path costs barely ' + fmt(ms) + ' ms, far below half a second.' }),
    L({ es: 'Tiene razón: a esa distancia el retraso ronda efectivamente el medio segundo.', en: 'He is right: at that distance the delay is indeed around half a second.' }),
    L({ es: 'Se equivocó de sentido: el retraso real es todavía mayor que medio segundo por la altura de la antena.', en: 'He got it backwards: the real delay is even larger than half a second because of the height of the antenna.' }),
    L({ es: 'No se puede saber: falta conocer la frecuencia de la emisora para calcular ese tiempo.', en: 'It cannot be known: the frequency of the station is still needed to work out that time.' })
  ];
  return {
    title: L({ es: 'El cálculo del retraso', en: 'The delay estimate' }),
    showWork: true,
    q: L({ es: 'Un alumno concluye que, como la antena de la emisora está a ' + d + ' km de su casa y transmite a ' + f + ' MHz, la señal tarda casi medio segundo en llegar. Las ondas viajan a 300 000 kilómetros por segundo. ¿Qué tan cerca está su conclusión del valor real?',
           en: 'A student concludes that, since the station antenna is ' + d + ' km from his house and transmits at ' + f + ' MHz, the signal takes almost half a second to arrive. The waves travel at 300 000 kilometres per second. How close is his conclusion to the real value?' }),
    options: o2, correct: o2[0],
    hint: L({ es: 'Compara la distancia del recorrido con los 300 000 km que la onda cubre en un segundo: si el recorrido es miles de veces menor, el tiempo también lo es.',
              en: 'Compare the distance of the path with the 300 000 km the wave covers in one second: if the path is thousands of times smaller, so is the time.' }),
    exp: L({ es: 'En un segundo la onda recorre 300 000 km, así que ' + d + ' km se cubren en ' + fmt(ms) + ' ms, menos de una milésima de segundo. La frecuencia no interviene en este tiempo: solo cuentan la distancia y la rapidez.',
             en: 'In one second the wave covers 300 000 km, so ' + d + ' km are covered in ' + fmt(ms) + ' ms, less than one thousandth of a second. Frequency plays no part in this time: only distance and speed count.' })
  };
}
</script>

<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbykkuJ_apGq3vALIFd4mr3acu81c7K4OKxW-DZ-i52Ceyl3lOanXMdvbS9SIXPrLQBm/exec';
