<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vida Cotidiana a través del Tiempo</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--gold-bg); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Vida Cotidiana a través del Tiempo</div>
    <div class="wcourse" id="wcourse-el">Historia · 2° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Vida Cotidiana a través del Tiempo</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="sbtn" id="dlBtn" onclick="generatePDF()" style="max-width:280px;margin:0 auto;">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   CENTRALIZED SCHOOL CONFIG (Rule 16) — ships UNBRANDED (Rule 11).
   The ONLY rebranding point. build_all.py substitutes these exact fields
   (BRAND_FIELDS / RGB_FIELDS / logo*) downstream; :root/dark stay as fallback.
   Neutral defaults below == the static :root/dark values, so unbranded == no-op.
   ══════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:'#1a4a8a', primaryDark:'#0c2547', primaryBg:'#e7edf6',
  accent:'#e07b1a', accentBg:'#fbeddf',
  darkPrimary:'#437bc6', darkPrimaryDark:'#74a5e6', darkPrimaryBg:'#0c203a',

  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
  saved.choices.forEach(function(choice, idx) {

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');

}

    doc.setFontSize(7.5); var exLines = doc.splitTextToSize('Solución: '+expRaw, TW-18).slice(0,4);
    var ansBoxH = 8 + chLines.length*5.5 + coLines.length*5 + exLines.length*5 + 6;

    doc.setFillColor(isOk?26:176, isOk?106:48, isOk?74:16);

    doc.setTextColor(255,255,255); doc.setFontSize(9); doc.setFont('helvetica','bold');
    doc.text(isOk?'✓':'✗', M+5.2, wy+10.5);

    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','bold');

    doc.setTextColor(26,106,74); doc.setFontSize(8); doc.setFont('helvetica','normal');
    coLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    ay += coLines.length*5 + 3;
    doc.setTextColor(90,85,80); doc.setFontSize(7.5);
    exLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    wy += ansBoxH + 5;

    doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
    doc.setFontSize(7); doc.setFont('helvetica','bold');
    doc.rect(M,wy,TW,8,'F'); doc.text('TRABAJO DEL ALUMNO', M+4, wy+5.5);
    wy += 11;

    var dc = document.getElementById('dc'+i);
    if (dc) {
      try {
        var imgD = dc.toDataURL('image/png');
        var ar   = dc.height / dc.width;
        var iw   = TW;
        var ih   = Math.min(iw * ar, 68);
        doc.addImage(imgD, 'PNG', M, wy, iw, ih);
        wy += ih + 4;
      } catch(e) {}
    }

    var ta = document.getElementById('ta'+i);
    if (ta && ta.value.trim()) {
      if (wy > PH-30) { doc.addPage(); wy = 20; }
      doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('courier','normal');
      var taLines = doc.splitTextToSize(ta.value, TW);

      try { doc.addImage(pp.src, 'JPEG', M, wy, TW, 68); wy += 72; } catch(e) {}

  }

  // ── Footer on every page ──
  var pages = doc.internal.getNumberOfPages();
  for (var p = 1; p <= pages; p++) {
    doc.setPage(p);
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0, PH-3, PW, 3, 'F');

}

   CONTENT HELPERS  (Rule 1 / 5 / 7 / 10)
   ================================================ */
function S(es, en){ return LANG === 'es' ? es : en; }
function L(o){ if (o === null || o === undefined) return ''; if (typeof o === 'string') return o; return (o[LANG] !== undefined ? o[LANG] : o.es); }

function shufflePerm(n, rng){
  var a = [], i, j, t;
  for (i = 0; i < n; i++) a.push(i);
  for (i = n - 1; i > 0; i--) { j = Math.floor(rng() * (i + 1)); t = a[i]; a[i] = a[j]; a[j] = t; }
  var sorted = true;
  for (i = 0; i < n; i++) if (a[i] !== i) sorted = false;
  if (sorted && n > 1) { t = a[0]; a[0] = a[1]; a[1] = t; }
  return a;
}
function pickV(list, rng){ return list[Math.floor(rng() * list.length)]; }
function irand(rng, lo, hi){ return lo + Math.floor(rng() * (hi - lo + 1)); }
function without(arr, v){ var o = [], i; for (i = 0; i < arr.length; i++) if (arr[i] !== v) o.push(arr[i]); return o; }

function addSection(tag, title, body){
  var d = document.createElement('div');
  d.className = 'section';
  d.innerHTML = '<div class="stag">' + tag + '</div><h2>' + title + '</h2>' + body;
  document.getElementById('lessonBody').appendChild(d);
  return d;
}
function wgtHead(title, sub){
  return '<div class="iw-tag">' + title + '<div class="iw-sub">' + sub + '</div></div>';
}

/* Shuffles the options (Rule 7) keeping track of the correct index, then builds
   the card inline immediately after the push (Rule 1 / Rule 5). */
function addProblem(v, rng){
  var langOpts = L(v.options), n = langOpts.length, idx = shufflePerm(n, rng);
  var p = {
    title:        L(v.title),
    questionText: L(v.stmt),
    fn:           '',
    hint:         L(v.hint),
    explanation:  L(v.explanation),
    options:      idx.map(function(k){ return langOpts[k]; }),
    correctIdx:   idx.indexOf(v.correct),
    showWork:     !!v.showWork,
    studentChoice: null,
    pendingChoice: null
  };
  problems.push(p);
  buildOneCard(p, problems.length - 1);
}

             '<span class="inv-mark"></span>' + L(INV_ITEMS[k]) + '</button>';
    }).join('') + '</div>' +
    '<div class="iw-row">' + (INV.done ? '' :
      '<span class="iw-read">' + (INV.r + 1) + '/3</span><button class="iw-btn" onclick="invCheck()">' +
      S('Cerrar el inventario', 'Close the inventory') + '</button>') + '</div>' +
    '<div class="iw-fb' + (INV.fbk ? ' ' + INV.fbk : '') + '">' + INV.fb + '</div>';

function invTap(k){
  if (!INV) return;
  if (INV.sel.indexOf(k) >= 0) INV.sel = without(INV.sel, k);
  else INV.sel = INV.sel.concat([k]);
  if (!INV.done){
    INV.fbk = '';
    INV.fb = S('Con lo que llevas marcado, esas tareas ocupan ', 'With what you have marked so far, those tasks take ') +
             invHours() + S(' horas de cada día.', ' hours out of each day.');
  }
  invRender();
}
function invTip(missing, extra){
  var i;
  for (i = 0; i < extra.length; i++) if (INV_ITEMS[extra[i]].era > INV.r)
    return S('Marcaste algo que en esa casa todavía no existía. Fíjate en qué servicios dice el encargo que había en ese año.',
             'You marked something that did not exist yet in that house. Look at which services the task says there were in that year.');
  for (i = 0; i < extra.length; i++) if (INV_ITEMS[extra[i]].era < INV.r)
    return S('Marcaste algo que para ese año ya había salido de esa cocina, porque el barrio resolvía esa tarea de otro modo.',
             'You marked something that by that year had already left that kitchen, because the neighbourhood solved that task in another way.');
  if (missing.length)
    return S('Falta resolver ', 'You still have to solve ') + L(INV_CATS[INV_ITEMS[missing[0]].c]) +
           S('. Ninguna cocina funciona con ese hueco.', '. No kitchen works with that gap.');
  return S('Casi. Compara objeto por objeto lo que marcaste con lo que pide el encargo.',
           'Almost. Compare object by object what you marked with what the task asks for.');
}
function invCheck(){
  if (!INV || INV.done) return;
  var target = [], i;
  for (i = 0; i < INV_ITEMS.length; i++) if (INV_ITEMS[i].era === INV.r) target.push(i);
  var missing = [], extra = [];
  for (i = 0; i < target.length; i++) if (INV.sel.indexOf(target[i]) < 0) missing.push(target[i]);
  for (i = 0; i < INV.sel.length; i++) if (target.indexOf(INV.sel[i]) < 0) extra.push(INV.sel[i]);
  if (!missing.length && !extra.length){
    var hrs = invHours();
    INV.fbk = 'ok';
    INV.r++; INV.tries = 0; INV.sel = [];
    if (INV.r >= 3){
      INV.done = true;
      INV.fb = S('Las tres cocinas quedaron inventariadas: de ocho horas diarias a una sola. Ojo con la conclusión: el trabajo de la casa no desapareció, cambió de forma, y siguió recayendo sobre todo en las mujeres.',
                 'The three kitchens are inventoried: from eight hours a day down to one. Careful with the conclusion: household work did not vanish, it changed shape, and it kept falling above all on women.');
    } else {
      INV.fb = S('Inventario cerrado con ', 'Inventory closed with ') + hrs +
               S(' horas diarias. Ahora amuebla la siguiente cocina y compara el contador.',
                 ' hours a day. Now furnish the next kitchen and compare the counter.');
    }
    invRender(); return;
  }
  INV.tries++;
  if (INV.tries >= 3){
    INV.sel = target.slice();
    INV.fbk = 'warn';
    INV.fb = S('Así quedaba esa cocina, con ', 'That is how that kitchen looked, with ') + invHours() +
             S(' horas diarias de trabajo. Fíjate en qué tarea seguía haciéndose a mano.',
               ' hours of work a day. Notice which task was still done by hand.');
    INV.r++; INV.tries = 0;
    if (INV.r >= 3) INV.done = true; else INV.sel = [];
    invRender(); return;
  }
  INV.fbk = 'bad';
  INV.fb = invTip(missing, extra);
  invRender();
}

      { es:'Dormir en el mismo obrador donde trabaja', en:'Sleep in the same bakehouse where he works', h:{ es:'al caer la noche', en:'when night falls' } } ] },

      { es:'Videollamada con su mamá, que trabaja en otro país', en:'Video call with his mother, who works in another country', h:{ es:'9 de la noche', en:'9 at night' } } ] }
];
function jrBuild(rng){
  var ord = shufflePerm(JR_DAYS.length, rng).slice(0, 3);
  JR = { ord:ord, r:0, order:shufflePerm(5, rng), sel:null, tries:0, done:false, fb:'', fbk:'' };
  return '<div class="wgt" data-widget="jornada" id="wJor">' +
    wgtHead(S('La jornada', 'The working day'),
            S('Acomoda los cinco momentos del primero al último: toca uno y luego otro para intercambiarlos. Puedes reacomodarlos las veces que haga falta.',
              'Arrange the five moments from first to last: tap one and then another to swap them. You can rearrange them as often as you need.')) +
    '<div id="jrBox"></div></div>';
}
function jrLine(day){
  return day.st.map(function(s, k){ return (k + 1) + '. ' + L(s.h) + ': ' + L(s); }).join(' · ');
}
function jrRender(){
  var z = document.getElementById('jrBox');
  if (!JR || !z) return;
  if (JR.done){
    z.innerHTML = '<div class="iw-prompt">' +
      S('Tres jornadas acomodadas. Ninguna se rige por lo mismo: una sigue la luz del sol, otra el silbato de la fábrica y otra el horario de la escuela y la diferencia de horas con otro país.',
        'Three working days arranged. None of them follows the same thing: one follows the light of the sun, another the whistle of the factory and another the school timetable and the time difference with another country.') +
      '</div><div class="iw-fb' + (JR.fbk ? ' ' + JR.fbk : '') + '">' + JR.fb + '</div>';
    return;
  }
  var day = JR_DAYS[JR.ord[JR.r]];
  z.innerHTML =
    '<div class="iw-prompt">' + L(day.who) + '</div>' +
    '<div class="jr-list">' + JR.order.map(function(si, pos){
      return '<button class="jr-chip' + (JR.sel === pos ? ' sel' : '') + '" onclick="jrTap(' + pos + ')">' +
             '<span class="jr-num">' + (pos + 1) + '</span>' + L(day.st[si]) + '</button>';
    }).join('') + '</div>' +
    '<div class="iw-row"><span class="iw-read">' + (JR.r + 1) + '/3</span>' +
      '<button class="iw-btn" onclick="jrCheck()">' + S('Ver si el día cuadra', 'See if the day fits') + '</button></div>' +
    '<div class="iw-fb' + (JR.fbk ? ' ' + JR.fbk : '') + '">' + JR.fb + '</div>';
}
function jrTap(pos){
  if (!JR || JR.done) return;
  if (JR.sel === null) JR.sel = pos;
  else if (JR.sel === pos) JR.sel = null;
  else { var t = JR.order[JR.sel]; JR.order[JR.sel] = JR.order[pos]; JR.order[pos] = t; JR.sel = null; }
  jrRender();
}
function jrNext(){
  JR.r++; JR.tries = 0; JR.sel = null;
  if (JR.r >= 3) { JR.done = true; return; }
  var p = [0, 1, 2, 3, 4], i, j, tt;
  for (i = 4; i > 0; i--){ j = (JR.r * 7 + i * 3) % (i + 1); tt = p[i]; p[i] = p[j]; p[j] = tt; }
  var sorted = true;
  for (i = 0; i < 5; i++) if (p[i] !== i) sorted = false;
  if (sorted) { tt = p[0]; p[0] = p[1]; p[1] = tt; }
  JR.order = p;
}
function jrCheck(){
  if (!JR || JR.done) return;
  var day = JR_DAYS[JR.ord[JR.r]], ok = true, i;
  for (i = 0; i < JR.order.length; i++) if (JR.order[i] !== i) ok = false;
  if (ok){
    JR.fbk = 'ok';
    JR.fb = S('Así transcurría ese día: ', 'That is how that day went: ') + jrLine(day);
    jrNext();
    jrRender(); return;

  JR.tries++;
  if (JR.tries >= 3){
    JR.fbk = 'warn';
    JR.fb = S('Este era el orden: ', 'This was the order: ') + jrLine(day);
    jrNext();
    jrRender(); return;
  }
  var bad = 0;
  for (i = 0; i < JR.order.length; i++) if (JR.order[i] !== i) { bad = i; break; }
  JR.fbk = 'bad';
  JR.fb = S('Todavía no. Revisa el momento número ', 'Not yet. Look at moment number ') + (bad + 1) +
          S(': ¿de verdad ocurre a esa altura del día, o va antes?', ': does it really happen at that point of the day, or does it come earlier?');
  jrRender();
}

/* ════════════════════════════════════════════════════════════════════════
   buildLesson :: concepto, manipulable, problema (Rule 1)
   ════════════════════════════════════════════════════════════════════════ */
function buildLesson(rng) {
  injectGuideStyles();

  /* ══════════ CONCEPTO 1 ══════════ */
  addSection(S('Concepto 1', 'Concept 1'),
    S('Lo que parece no tener historia', 'What looks as if it had no history'),
    S('<p>La historia suele contarse con guerras, gobiernos y leyes. Pero también tiene historia lo que parece no tenerla: a qué hora se levantaba la gente, qué comía, cuánta agua usaba, dónde dormía, cuánto tardaba en llegar al trabajo. A todo eso se le llama vida cotidiana, y cambia tanto como los gobiernos, solo que más despacio y sin fechas famosas.</p>' +
      '<p>Se estudia con huellas que nadie dejó pensando en la historia: inventarios de bienes que anotan objeto por objeto lo que había en una casa, fotografías de una cocina, recetarios, cuentas de gastos, anuncios de periódico y el testimonio de quienes todavía lo recuerdan. Un metate, un cántaro o una plancha de carbón no son adornos: son la prueba de cuántas horas costaba comer, beber o vestirse limpio.</p>' +
      '<p>Por eso quien estudia la vida cotidiana no pregunta solo qué objeto había, sino cuánto tiempo del día se iba en usarlo y quién lo usaba. Cambiar un objeto de la casa podía cambiar la jornada entera de una persona.</p>',
      '<p>History is usually told with wars, governments and laws. But what looks as if it had no history has one too: what time people got up, what they ate, how much water they used, where they slept, how long it took them to reach work. All of that is called daily life, and it changes as much as governments do, only more slowly and without famous dates.</p>' +
      '<p>It is studied through traces that nobody left with history in mind: inventories of goods listing object by object what a house held, photographs of a kitchen, recipe books, expense accounts, newspaper advertisements and the testimony of those who still remember. A metate, a water jar or a coal iron are not ornaments: they are the proof of how many hours it cost to eat, to drink or to dress in clean clothes.</p>' +
      '<p>That is why somebody who studies daily life does not only ask which object was there, but how much of the day went into using it and who used it. Changing one object in the house could change the whole day of a person.</p>') +
    '<div class="rules-grid">' +

  addSection(S('Concepto 2', 'Concept 2'),
    S('El día no siempre se midió en horas', 'The day was not always measured in hours'),
    S('<p>Antes de que hubiera relojes en las casas, el día se medía con lo que se veía y se oía: la salida del sol, la sombra de una pared, las campanas de la iglesia que marcaban las horas de rezo. El trabajo se contaba por tareas terminadas y no por horas: se molía hasta acabar el maíz, se sembraba hasta terminar el surco, se horneaba hasta vender el pan.</p>' +
      '<p>Con la fábrica, el ferrocarril y el telégrafo el día se partió en horas exactas e iguales para todos. La fábrica no compraba piezas: compraba tiempo dentro de un edificio, y por eso aparecieron el silbato que llamaba al turno, la lista de asistencia y la multa por llegar tarde. Las jornadas eran larguísimas, y por eso una de las primeras demandas de los trabajadores fue la jornada de ocho horas, que en México quedó escrita en la Constitución de 1917.</p>' +
      '<p>Hoy el día se reparte entre horarios que no siempre coinciden: el turno de quien trabaja de noche, la clase que empieza a las siete, el camión que tarda una hora. Y para quien tiene familia en otro país aparece un reloj más, el de la diferencia de horas, que decide a qué hora se puede hablar.</p>',
      '<p>Before there were clocks in houses, the day was measured with what could be seen and heard: sunrise, the shadow of a wall, the church bells marking the hours of prayer. Work was counted by finished tasks and not by hours: you ground until the maize was done, you sowed until the furrow was finished, you baked until the bread was sold.</p>' +
      '<p>With the factory, the railway and the telegraph the day was cut into exact hours, equal for everybody. The factory did not buy pieces: it bought time inside a building, and that is why the whistle calling the shift, the attendance list and the fine for arriving late appeared. Working days were extremely long, and that is why one of the first demands of workers was the eight hour day, which in Mexico was written into the Constitution of 1917.</p>' +
      '<p>Today the day is split among timetables that do not always match: the shift of somebody working at night, the class that starts at seven, the bus that takes an hour. And for whoever has family in another country one more clock appears, that of the time difference, which decides at what hour it is possible to talk.</p>') +
    jrBuild(rng));

  addSection(S('Concepto 3', 'Concept 3'),
    S('El agua, el maíz y la ropa', 'The water, the maize and the clothes'),
    S('<p>En una casa sin agua entubada alguien tenía que ir por el agua, a veces varias veces al día. Alguien molía el nixtamal antes del amanecer para que hubiera tortillas. Alguien lavaba en el río o en el lavadero, cargaba leña, cuidaba a los pequeños y a los enfermos. Ese trabajo sostenía a la familia entera, no se pagaba y casi siempre recaía en las mujeres y las niñas de la casa.</p>' +
      '<p>Cuando llegaron el agua entubada, el molino de nixtamal, la luz eléctrica y más tarde la estufa de gas y la lavadora, esas horas se redujeron. El molino de nixtamal, que se extendió por México durante la primera mitad del siglo XX, es el caso más claro: quitó de encima varias horas diarias de moler a mano. Con ese tiempo disponible, más niñas pudieron asistir a la escuela y más mujeres pudieron tomar un empleo fuera de la casa.</p>' +
      '<p>Pero el trabajo doméstico no desapareció: cambió de forma. Aparecieron tareas nuevas, como los trámites, los traslados largos y el cuidado de personas mayores, y el reparto siguió siendo desigual. Por eso la pregunta útil no es solo qué aparato llegó a la casa, sino a quién le cambió el día.</p>',
      '<p>In a house without piped water somebody had to go for the water, sometimes several times a day. Somebody ground the nixtamal before dawn so there would be tortillas. Somebody washed in the river or at the washing sink, carried firewood, cared for the small children and the sick. That work held up the whole family, was not paid and almost always fell on the women and girls of the house.</p>' +
      '<p>When piped water, the nixtamal mill, electric light and later the gas stove and the washing machine arrived, those hours shrank. The nixtamal mill, which spread across Mexico during the first half of the twentieth century, is the clearest case: it lifted several daily hours of grinding by hand. With that time available, more girls could attend school and more women could take a job outside the house.</p>' +
      '<p>But domestic work did not vanish: it changed shape. New tasks appeared, such as paperwork, long journeys and the care of older people, and the sharing of it stayed unequal. That is why the useful question is not only which appliance reached the house, but whose day it changed.</p>')
  );

  addSection(S('Concepto 4', 'Concept 4'),
    S('Cuando alguien migra, el día cambia de los dos lados', 'When somebody migrates, the day changes on both sides'),
    S('<p>La migración no es solo un viaje: es la reorganización del día de dos casas. En la que se queda, las tareas de quien partió se reparten entre los demás. Muchas mujeres pasaron a administrar el dinero, a tratar con las autoridades y a llevar la parcela; muchos abuelos volvieron a criar. En la casa de llegada, quien migró aprende otro horario, otras rutas, otro clima y a veces otra lengua, y suele trabajar más horas de las que trabajaba antes.</p>' +
      '<p>Algunas cosas viajan y se sostienen: la comida de la fiesta, la música, las palabras, el modo de nombrarse entre parientes. Otras cambian porque el lugar obliga: la hora de la cena, el trayecto al trabajo, los papeles que hay que llevar encima. Por eso la vida cotidiana de una familia con migrantes mezcla continuidades muy firmes con cambios muy rápidos.</p>' +
      '<p>También cambió el modo de estar en contacto. Durante décadas fue la carta, que tardaba semanas, junto con el giro postal. Después la caseta telefónica del pueblo, con turnos y minutos contados. Hoy la videollamada casi diaria, con la diferencia de horas como único obstáculo. Cada una de esas formas reorganizó a qué hora se junta la familia y de qué alcanza a hablarse.</p>',
      '<p>Migration is not only a journey: it is the reorganization of the day of two houses. In the one that stays, the tasks of whoever left are shared out among the rest. Many women came to manage the money, to deal with the authorities and to run the plot; many grandparents went back to raising children. In the house of arrival, whoever migrated learns another timetable, other routes, another climate and sometimes another language, and usually works more hours than before.</p>' +
      '<p>Some things travel and hold on: the food of the feast, the music, the words, the way relatives name each other. Others change because the place forces it: the hour of dinner, the journey to work, the papers that must be carried. That is why the daily life of a family with migrants mixes very firm continuities with very fast changes.</p>' +
      '<p>The way of keeping in touch changed too. For decades it was the letter, which took weeks, along with the postal money order. Then the telephone booth of the village, with turns and counted minutes. Today the almost daily video call, with the time difference as the only obstacle. Each of those forms reorganized at what hour the family gathers and how much they manage to say.</p>') +
    clBuild(rng));
  clRender();

  addSection(S('Concepto 5', 'Concept 5'),
    S('Comparar dos días sin juzgar el pasado', 'Comparing two days without judging the past'),
    S('<p>Comparar dos días de épocas distintas exige dos preguntas: qué cambió y qué siguió igual. A lo que permanece se le llama continuidad; a lo que se transforma, cambio. Casi siempre aparecen juntos: en una misma cocina puede haber una estufa de gas nueva y un metate que se sigue usando los domingos.</p>' +
      '<p>Un error frecuente es medir el pasado con las costumbres de hoy y concluir que la gente vivía mal o que no sabía organizarse. Eso se llama anacronismo: juzgar una época con criterios que en ella no existían. Lo contrario, que es lo que hace quien estudia la vida cotidiana, consiste en entender por qué esa forma de vivir tenía sentido con los recursos, las leyes y las herramientas de su momento.</p>' +
      '<p>Conviene además no tomar un caso por el todo. La casa de un comerciante de la ciudad y la de una familia campesina del mismo año tuvieron días muy distintos. Por eso se cruzan fuentes: inventarios, fotografías, censos, entrevistas. Y por eso preguntarle a una persona mayor de tu casa cómo era su día a los doce años es, literalmente, trabajo de historia.</p>',
      '<p>Comparing two days from different periods demands two questions: what changed and what stayed the same. What remains is called continuity; what is transformed, change. They almost always appear together: in one and the same kitchen there can be a new gas stove and a metate still used on Sundays.</p>' +
      '<p>A frequent mistake is to measure the past with the customs of today and conclude that people lived badly or did not know how to organize themselves. That is called anachronism: judging a period with criteria that did not exist in it. The opposite, which is what somebody studying daily life does, consists of understanding why that way of living made sense with the resources, the laws and the tools of its moment.</p>' +
      '<p>It is also wise not to take one case for the whole. The house of a city merchant and that of a farming family in the same year had very different days. That is why sources are crossed: inventories, photographs, censuses, interviews. And that is why asking an older person in your house what their day was like at twelve is, literally, the work of history.</p>')
  );
