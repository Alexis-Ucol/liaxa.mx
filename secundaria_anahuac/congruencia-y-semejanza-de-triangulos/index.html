<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Congruencia y Semejanza de Triángulos</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--gold-bg); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

/* ── MANIPULATIVES ── */
.mcv { display:block; width:100%; height:250px; touch-action:none; background:var(--surface); }
.mrow { display:flex; flex-wrap:wrap; gap:.5rem; align-items:center; margin-top:.7rem; }
.mbtn { background:var(--surface2); border:1.5px solid var(--border); border-radius:8px; padding:.55rem .9rem; font-size:.82rem; cursor:pointer; color:var(--text2); font-family:inherit; min-height:44px; transition:all .14s; }
.mbtn:hover { border-color:var(--green); color:var(--green); }
.mbtn.go { background:var(--green); color:#fff; border-color:var(--green); }
.mbtn.go:hover { background:var(--green-dark); color:#fff; }
.mfb { margin-top:.7rem; padding:.6rem .85rem; border-radius:8px; font-size:.84rem; background:var(--surface2); color:var(--text2); border-left:3px solid var(--border); }
.mfb.good { background:var(--ok-bg); color:var(--ok); border-left-color:var(--ok); }
.mfb.near { background:var(--gold-bg); color:var(--text2); border-left-color:var(--gold); }
.mstat { display:grid; grid-template-columns:repeat(3,1fr); gap:.5rem; margin-top:.7rem; }
.mtile { background:var(--surface2); border-radius:8px; padding:.55rem .35rem; text-align:center; border:1.5px solid var(--border); }
.mtile.hit { border-color:var(--ok); background:var(--ok-bg); }
.mtile .tl { font-size:.62rem; text-transform:uppercase; letter-spacing:.05em; color:var(--text3); }
.mtile .tv { font-family:'IBM Plex Mono',monospace; font-size:.9rem; font-weight:600; color:var(--text); }
.mhead { display:flex; justify-content:space-between; align-items:baseline; gap:.6rem; flex-wrap:wrap; margin-bottom:.4rem; }
.mtitle { font-weight:600; font-size:.95rem; }
.mround { font-family:'IBM Plex Mono',monospace; font-size:.68rem; letter-spacing:.09em; text-transform:uppercase; color:var(--gold); font-weight:600; }
.mnote { font-size:.76rem; color:var(--text3); margin-top:.5rem; }
@media (max-width:600px){ .mstat { grid-template-columns:1fr 1fr; } .mcv { height:225px; } .mbtn { font-size:.78rem; padding:.5rem .6rem; } }
.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Congruencia y Semejanza de Triángulos</div>
    <div class="wcourse" id="wcourse-el">Matemáticas · 3° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Congruencia y Semejanza de Triángulos</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>

    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
  saved.choices.forEach(function(choice, idx) {

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');

}

/* ---------- small helpers ---------- */
function L(es, en){ return LANG === 'en' ? en : es; }
function cssv(n){ try { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); } catch(e){ return ''; } }
function nf(v){ return String(Math.round(v * 1000) / 1000); }
function frac(n, d){ return '<span class="mf-outer"><span class="mf-num">' + n + '</span><span class="mf-den">' + d + '</span></span>'; }
function addSection(html){
  var d = document.createElement('div');
  d.className = 'section';
  d.innerHTML = html;
  document.getElementById('lessonBody').appendChild(d);
  return d;
}
function shuffleOpts(opts, correct, rng){
  var a = opts.slice();
  for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(rng() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
  return { options: a, correctIdx: a.indexOf(correct) };
}
function pushProb(spec, rng){
  var s = shuffleOpts(spec.options, spec.correct, rng);
  var prob = {
    title: spec.title, questionText: spec.questionText, fn: spec.fn || '',
    hint: spec.hint || '', explanation: spec.explanation || '',
    options: s.options, correctIdx: s.correctIdx, showWork: !!spec.showWork,
    studentChoice: null, pendingChoice: null
  };
  problems.push(prob);
  buildOneCard(prob, problems.length - 1);
}

/* ---------- canvas geometry helpers ---------- */
function cvFit(id){
  var cv = document.getElementById(id);
  if (!cv) return null;
  var dpr = window.devicePixelRatio || 1;
  var r = cv.getBoundingClientRect();
  var w = Math.max(240, Math.round(r.width));
  var h = Math.max(180, Math.round(r.height));
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  var ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.font = '600 12px "IBM Plex Sans", sans-serif';
  return { ctx: ctx, w: w, h: h };
}
function triPts(sideAC, sideAB, angA){
  var r = angA * Math.PI / 180;
  return [ {x:0, y:0}, {x:sideAB, y:0}, {x:sideAC * Math.cos(r), y:-sideAC * Math.sin(r)} ];
}
function rotTri(pts, deg){
  var r = deg * Math.PI / 180, c = Math.cos(r), s = Math.sin(r);
  return pts.map(function(p){ return { x: p.x * c - p.y * s, y: p.x * s + p.y * c }; });
}
function fitMap(list, w, h, pad){
  var mnx = 1e9, mxx = -1e9, mny = 1e9, mxy = -1e9;
  list.forEach(function(t){ t.forEach(function(p){
    if (p.x < mnx) mnx = p.x; if (p.x > mxx) mxx = p.x;
    if (p.y < mny) mny = p.y; if (p.y > mxy) mxy = p.y;
  }); });
  var sw = Math.max(0.001, mxx - mnx), sh = Math.max(0.001, mxy - mny);
  var s = Math.min((w - 2 * pad) / sw, (h - 2 * pad) / sh);
  var ox = (w - sw * s) / 2 - mnx * s, oy = (h - sh * s) / 2 - mny * s;
  return function(p){ return { x: p.x * s + ox, y: p.y * s + oy }; };
}
function mapTri(pts, m){ return pts.map(m); }
function strokeTri(ctx, P, col, width, dashed){
  ctx.save();
  ctx.strokeStyle = col; ctx.lineWidth = width;
  if (dashed) ctx.setLineDash([6, 5]);
  ctx.beginPath(); ctx.moveTo(P[0].x, P[0].y); ctx.lineTo(P[1].x, P[1].y); ctx.lineTo(P[2].x, P[2].y); ctx.closePath();
  ctx.stroke(); ctx.restore();
}
function labelTri(ctx, P, names, col){
  ctx.save(); ctx.fillStyle = col; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  var cx = (P[0].x + P[1].x + P[2].x) / 3, cy = (P[0].y + P[1].y + P[2].y) / 3;
  P.forEach(function(p, i){
    var dx = p.x - cx, dy = p.y - cy, len = Math.max(1, Math.hypot(dx, dy));
    ctx.fillText(names[i], p.x + dx / len * 13, p.y + dy / len * 13);
  });
  ctx.restore();
}
function drawTicks(ctx, p1, p2, n, col){
  var mx = (p1.x + p2.x) / 2, my = (p1.y + p2.y) / 2;
  var dx = p2.x - p1.x, dy = p2.y - p1.y, len = Math.max(1, Math.hypot(dx, dy));
  var ux = dx / len, uy = dy / len, nx = -uy, ny = ux;
  ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = 2.6;
  for (var i = 0; i < n; i++){
    var off = (i - (n - 1) / 2) * 5.5;
    var cx = mx + ux * off, cy = my + uy * off;
    ctx.beginPath(); ctx.moveTo(cx - nx * 6, cy - ny * 6); ctx.lineTo(cx + nx * 6, cy + ny * 6); ctx.stroke();
  }
  ctx.restore();
}
function drawArc(ctx, v, p1, p2, col, r){
  var a1 = Math.atan2(p1.y - v.y, p1.x - v.x), a2 = Math.atan2(p2.y - v.y, p2.x - v.x);
  var d = a2 - a1;
  while (d < -Math.PI) d += 2 * Math.PI;
  while (d > Math.PI) d -= 2 * Math.PI;
  ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = 2.6;
  ctx.beginPath(); ctx.arc(v.x, v.y, r, a1, a1 + d, d < 0); ctx.stroke();
  ctx.restore();
}
function sideLabel(ctx, p1, p2, txt, col){
  var mx = (p1.x + p2.x) / 2, my = (p1.y + p2.y) / 2;
  var dx = p2.x - p1.x, dy = p2.y - p1.y, len = Math.max(1, Math.hypot(dx, dy));
  ctx.save(); ctx.fillStyle = col; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '500 11px "IBM Plex Mono", monospace';
  ctx.fillText(txt, mx - (-dy / len) * 14, my - (dx / len) * 14);
  ctx.restore();
}
function setFb(id, txt, cls){
  var e = document.getElementById(id);
  if (!e) return;
  e.innerHTML = txt;
  e.className = 'mfb' + (cls ? ' ' + cls : '');
}

/* ================================================
   MANIPULATIVE 1 : Constructor de triángulos (LAL)
   Overlay: the student rebuilds a hidden model triangle using
   two sides and the included angle. Live directional tiles.
   Pattern A: reveal on the 3rd miss.
   ================================================ */
var M1 = null;
function m1Build(rng){
  var tc = 4 + Math.floor(rng() * 4);          // AB
  var tb = 5 + Math.floor(rng() * 4);          // AC
  var ta = 40 + 5 * Math.floor(rng() * 9);     // angle A, 40..80
  var c = tc + (rng() < 0.5 ? 3 : -2); if (c < 3) c = tc + 3; if (c > 9) c = tc - 2;
  var b = tb + (rng() < 0.5 ? -3 : 2); if (b < 3) b = tb + 2; if (b > 9) b = tb - 3;
  var a = ta + (rng() < 0.5 ? 30 : -20); if (a < 30) a = ta + 30; if (a > 120) a = ta - 20;
  M1 = { tb: tb, tc: tc, ta: ta, b: b, c: c, a: a, tries: 0, done: false };
}
function m1Html(){
  return '<div class="gcrd">' +
    '<div class="mhead"><div class="mtitle">' + L('Reconstruye el triángulo modelo', 'Rebuild the model triangle') + '</div>' +
    '<div class="mround">' + L('LAL en acción', 'SAS in action') + '</div></div>' +
    '<p style="font-size:.86rem">' + L(
      'El triángulo punteado es el modelo. Solo conoces tres datos suyos: el lado AB, el lado AC y el ángulo que forman en A. Mueve los controles hasta que tu triángulo quede encima del modelo.',
      'The dashed triangle is the model. You only know three of its measurements: side AB, side AC and the angle they form at A. Move the controls until your triangle lands on top of the model.') + '</p>' +
    '<div class="cvwrap"><canvas class="mcv" id="m1cv"></canvas></div>' +
    '<div class="cgrid" style="margin-top:.8rem">' +
      '<div class="cg"><label>' + L('Lado AB', 'Side AB') + ': <span class="cval" id="m1lc"></span> cm</label>' +
        '<input type="range" id="m1c" min="3" max="9" step="1" oninput="m1Input()"></div>' +
      '<div class="cg"><label>' + L('Lado AC', 'Side AC') + ': <span class="cval" id="m1lb"></span> cm</label>' +
        '<input type="range" id="m1b" min="3" max="9" step="1" oninput="m1Input()"></div>' +
      '<div class="cg"><label>' + L('Ángulo A', 'Angle A') + ': <span class="cval" id="m1la"></span>°</label>' +
        '<input type="range" id="m1a" min="30" max="120" step="5" oninput="m1Input()"></div>' +
    '</div>' +
    '<div class="mstat">' +
      '<div class="mtile" id="m1tc"><div class="tl">AB</div><div class="tv" id="m1tvc">·</div></div>' +
      '<div class="mtile" id="m1tb"><div class="tl">AC</div><div class="tv" id="m1tvb">·</div></div>' +
      '<div class="mtile" id="m1ta"><div class="tl">' + L('Ángulo A', 'Angle A') + '</div><div class="tv" id="m1tva">·</div></div>' +
    '</div>' +
    '<div class="mrow"><button class="mbtn go" onclick="m1Check()">' + L('Comparar con el modelo', 'Compare with the model') + '</button></div>' +
    '<div class="mfb" id="m1fb"></div>' +
  '</div>';
}
function m1Init(){
  var c = document.getElementById('m1c'), b = document.getElementById('m1b'), a = document.getElementById('m1a');
  if (!c) return;
  c.value = M1.c; b.value = M1.b; a.value = M1.a;
  setFb('m1fb', L('Mueve un control y observa qué le pasa a tu triángulo.', 'Move a control and watch what happens to your triangle.'), '');
  m1Input();
}
function m1Input(){
  var c = document.getElementById('m1c'); if (!c) return;
  M1.c = parseInt(c.value, 10);
  M1.b = parseInt(document.getElementById('m1b').value, 10);
  M1.a = parseInt(document.getElementById('m1a').value, 10);
  document.getElementById('m1lc').textContent = M1.c;
  document.getElementById('m1lb').textContent = M1.b;
  document.getElementById('m1la').textContent = M1.a;
  var up = L('sube', 'go up'), dn = L('baja', 'go down'), ok = L('igual', 'match');
  function tile(id, tid, cur, tgt, unit){
    var el = document.getElementById(id), tv = document.getElementById(tid);
    if (!el) return;
    if (cur === tgt){ el.classList.add('hit'); tv.textContent = cur + unit + ' ✓ ' + ok; }
    else { el.classList.remove('hit'); tv.textContent = cur + unit + ' ' + (cur < tgt ? '▲ ' + up : '▼ ' + dn); }
  }
  tile('m1tc', 'm1tvc', M1.c, M1.tc, ' cm');
  tile('m1tb', 'm1tvb', M1.b, M1.tb, ' cm');
  tile('m1ta', 'm1tva', M1.a, M1.ta, '°');
  m1Draw();
}
function m1Draw(){
  var f = cvFit('m1cv'); if (!f) return;
  var ctx = f.ctx;
  var T = triPts(M1.tb, M1.tc, M1.ta), S = triPts(M1.b, M1.c, M1.a);
  var m = fitMap([T, S], f.w, f.h, 34);
  var PT = mapTri(T, m), PS = mapTri(S, m);
  strokeTri(ctx, PT, cssv('--gold'), 2.4, true);
  strokeTri(ctx, PS, cssv('--green'), 3, false);
  drawArc(ctx, PS[0], PS[1], PS[2], cssv('--green'), 22);
  labelTri(ctx, PS, ['A', 'B', 'C'], cssv('--text2'));
  sideLabel(ctx, PS[0], PS[1], M1.c + ' cm', cssv('--text3'));
  sideLabel(ctx, PS[2], PS[0], M1.b + ' cm', cssv('--text3'));
  ctx.save();
  ctx.fillStyle = cssv('--gold'); ctx.textAlign = 'left'; ctx.font = '500 11px "IBM Plex Sans", sans-serif';
  ctx.fillText(L('modelo', 'model'), 10, 16);
  ctx.fillStyle = cssv('--green');
  ctx.fillText(L('tu triángulo', 'your triangle'), 10, 32);
  ctx.restore();
}
function m1Check(){
  if (!M1 || M1.done) return;
  var okc = M1.c === M1.tc, okb = M1.b === M1.tb, oka = M1.a === M1.ta;
  if (okc && okb && oka){
    M1.done = true;
    setFb('m1fb', L('¡Encajan! 🎉 Con el lado AB, el lado AC y el ángulo entre ellos solo se puede armar un triángulo, y por eso los dos coinciden.',
                    'They match! 🎉 With side AB, side AC and the angle between them only one triangle can be built, which is why both coincide.'), 'good');
    return;
  }
  M1.tries++;
  if (M1.tries >= 3){
    M1.done = true;
    document.getElementById('m1c').value = M1.tc;
    document.getElementById('m1b').value = M1.tb;
    document.getElementById('m1a').value = M1.ta;
    m1Input();
    setFb('m1fb', L('El modelo tenía AB = ' + M1.tc + ' cm, AC = ' + M1.tb + ' cm y ángulo A = ' + M1.ta + '°. Ahí lo tienes: esos tres datos fijan el triángulo por completo.',
                    'The model had AB = ' + M1.tc + ' cm, AC = ' + M1.tb + ' cm and angle A = ' + M1.ta + '°. There it is: those three measurements fix the triangle completely.'), 'near');
    return;
  }
  var miss = [];
  if (!okc) miss.push('AB ' + (M1.c < M1.tc ? L('se queda corto', 'is too short') : L('se pasa', 'is too long')));
  if (!okb) miss.push('AC ' + (M1.b < M1.tb ? L('se queda corto', 'is too short') : L('se pasa', 'is too long')));
  if (!oka) miss.push(L('el ángulo A está ', 'angle A is ') + (M1.a < M1.ta ? L('muy cerrado', 'too narrow') : L('muy abierto', 'too wide')));
  setFb('m1fb', L('Casi: ', 'Almost: ') + miss.join(', ') + '.', 'near');
}

/* ================================================
   MANIPULATIVE 2 : Detective de criterios
   Pattern B: 3 rounds, marked figures re-drawn each round.
   ================================================ */
var M2 = null;
function m2Build(rng){
  var order = shuffle(['LLL', 'LAL', 'ALA', 'LLA'], rng).slice(0, 3);
  M2 = { types: order, round: 0, tries: 0, done: false, resolved: false, rot: 120 + Math.floor(rng() * 90) };
}
function m2Html(){
  return '<div class="gcrd">' +
    '<div class="mhead"><div class="mtitle">' + L('Detective de datos marcados', 'Marked data detective') + '</div>' +
    '<div class="mround" id="m2r"></div></div>' +
    '<p style="font-size:.86rem">' + L(
      'Las marcas doradas señalan qué partes se sabe que son iguales en los dos triángulos: las rayitas marcan lados, los arcos marcan ángulos. Decide qué criterio se está usando.',
      'The gold marks show which parts are known to be equal in both triangles: small dashes mark sides, arcs mark angles. Decide which criterion is being used.') + '</p>' +
    '<div class="cvwrap"><canvas class="mcv" id="m2cv"></canvas></div>' +
    '<div class="mrow">' +
      '<button class="mbtn" onclick="m2Answer(\'LLL\')">' + L('LLL', 'SSS') + '</button>' +
      '<button class="mbtn" onclick="m2Answer(\'LAL\')">' + L('LAL', 'SAS') + '</button>' +
      '<button class="mbtn" onclick="m2Answer(\'ALA\')">' + L('ALA', 'ASA') + '</button>' +
      '<button class="mbtn" onclick="m2Answer(\'ND\')">' + L('No queda determinado', 'Not determined') + '</button>' +
      '<button class="mbtn go" id="m2next" style="display:none" onclick="m2Next()">' + L('Siguiente →', 'Next →') + '</button>' +
    '</div>' +
    '<div class="mfb" id="m2fb"></div>' +
  '</div>';
}
var M2SPEC = {
  LLL: { sides: [[0,1],[1,2],[2,3]], angles: [] },
  LAL: { sides: [[0,1],[2,2]], angles: [0] },
  ALA: { sides: [[0,1]], angles: [0,1] },
  LLA: { sides: [[0,1],[2,2]], angles: [1] }
};
function m2Draw(){
  var f = cvFit('m2cv'); if (!f || !M2) return;
  var ctx = f.ctx;
  var base = triPts(6, 8, 58);
  var second = rotTri(base, M2.rot);
  var half = f.w / 2;
  var m1 = fitMap([base], half, f.h, 30), m2 = fitMap([second], half, f.h, 30);
  var P1 = base.map(function(p){ var q = m1(p); return { x: q.x, y: q.y }; });
  var P2 = second.map(function(p){ var q = m2(p); return { x: q.x + half, y: q.y }; });
  var spec = M2SPEC[M2.types[M2.round]];
  var gcol = cssv('--gold'), base2 = cssv('--green');
  [P1, P2].forEach(function(P){
    strokeTri(ctx, P, base2, 2.6, false);
    spec.sides.forEach(function(s){
      var a = P[s[0]], b = P[(s[0] + 1) % 3];
      drawTicks(ctx, a, b, s[1], gcol);
    });
    spec.angles.forEach(function(v){
      drawArc(ctx, P[v], P[(v + 1) % 3], P[(v + 2) % 3], gcol, 20);
    });
  });
  labelTri(ctx, P1, ['A', 'B', 'C'], cssv('--text2'));
  labelTri(ctx, P2, ['D', 'E', 'F'], cssv('--text2'));
  ctx.save();
  ctx.strokeStyle = cssv('--border'); ctx.lineWidth = 1; ctx.setLineDash([4, 4]);
  ctx.beginPath(); ctx.moveTo(half, 12); ctx.lineTo(half, f.h - 12); ctx.stroke();
  ctx.restore();
  var lbl = document.getElementById('m2r');
  if (lbl) lbl.textContent = L('Ronda ', 'Round ') + (M2.round + 1) + L(' de 3', ' of 3');
}
function m2Init(){
  m2Draw();
  setFb('m2fb', L('Cuenta cuántos lados y cuántos ángulos llevan marca, y fíjate dónde están.',
                  'Count how many sides and how many angles are marked, and notice where they are.'), '');
}
var M2TXT = {
  LLL: { ok: ['Los tres lados marcados: LLL.', 'All three sides marked: SSS.'],
         ex: ['Hay tres pares de lados marcados y ningún ángulo: es el criterio LLL, los tres lados correspondientes iguales.',
              'There are three pairs of marked sides and no angles: that is the SSS criterion, three corresponding sides equal.'] },
  LAL: { ok: ['Dos lados y el ángulo que queda entre ellos: LAL.', 'Two sides and the angle between them: SAS.'],
         ex: ['Están marcados AB y CA, y el arco está en A, justo entre esos dos lados: criterio LAL.',
              'AB and CA are marked, and the arc sits at A, right between those two sides: SAS criterion.'] },
  ALA: { ok: ['Dos ángulos y el lado que queda entre ellos: ALA.', 'Two angles and the side between them: ASA.'],
         ex: ['Hay arcos en A y en B y el lado marcado es AB, el que va de un ángulo al otro: criterio ALA.',
              'There are arcs at A and B and the marked side is AB, the one joining both angles: ASA criterion.'] },
  LLA: { ok: ['Correcto: con esos datos el triángulo no queda determinado.', 'Correct: with that data the triangle is not determined.'],
         ex: ['Están marcados AB y CA, pero el arco está en B, fuera de esos dos lados. Esa combinación puede dar dos triángulos distintos, así que no queda determinado.',
              'AB and CA are marked, but the arc is at B, outside those two sides. That combination can produce two different triangles, so it is not determined.'] }
};
function m2Nudge(type, chosen){
  var spec = M2SPEC[type];
  var ns = spec.sides.length, na = spec.angles.length;
  if (type === 'LLA' && chosen === 'LAL')
    return L('Los dos lados marcados sí están, pero mira otra vez dónde cae el arco: no está entre ellos.',
             'The two marked sides are there, but look again at where the arc falls: it is not between them.');
  if (type === 'LAL' && chosen === 'ND')
    return L('Vuelve a mirar el arco: está en el vértice que comparten los dos lados marcados.',
             'Look at the arc again: it sits at the vertex shared by both marked sides.');
  return L('En la figura hay ' + ns + ' lado(s) y ' + na + ' ángulo(s) con marca. Tu respuesta describe otra combinación.',
           'The figure has ' + ns + ' marked side(s) and ' + na + ' marked angle(s). Your answer describes a different combination.');
}
function m2Answer(choice){
  if (!M2 || M2.done || M2.resolved) return;
  var type = M2.types[M2.round];
  var correct = (type === 'LLA') ? 'ND' : type;
  if (choice === correct){
    M2.resolved = true;
    setFb('m2fb', '🎉 ' + L(M2TXT[type].ok[0], M2TXT[type].ok[1]) + ' ' + L(M2TXT[type].ex[0], M2TXT[type].ex[1]), 'good');
    document.getElementById('m2next').style.display = 'inline-block';
    return;
  }
  M2.tries++;
  if (M2.tries >= 3){
    M2.resolved = true;
    setFb('m2fb', L('Era ', 'It was ') + (correct === 'ND' ? L('“no queda determinado”', '"not determined"') : correct) + '. ' + L(M2TXT[type].ex[0], M2TXT[type].ex[1]), 'near');
    document.getElementById('m2next').style.display = 'inline-block';
    return;
  }
  setFb('m2fb', m2Nudge(type, choice), 'near');
}
function m2Next(){
  if (!M2) return;
  M2.round++; M2.tries = 0; M2.resolved = false;
  document.getElementById('m2next').style.display = 'none';
  if (M2.round >= M2.types.length){
    M2.done = true;
    M2.round = M2.types.length - 1;
    setFb('m2fb', L('Listo: ya distingues los tres criterios y el caso que no alcanza.',
                    'Done: you can now tell the three criteria apart from the case that is not enough.'), 'good');
    return;
  }
  m2Draw();
  setFb('m2fb', L('Figura nueva. Vuelve a contar marcas.', 'New figure. Count the marks again.'), '');
}

/* ================================================
   MANIPULATIVE 3 : Escalador de semejanza
   Pattern B: 3 rounds, live k slider, angles never change.
   ================================================ */
var M3 = null;
function m3Build(rng){
  var t = shuffle([1.5, 2, 2.5, 0.5, 3], rng).slice(0, 3);
  M3 = { AB: 4, BC: 3, CA: 5, k: 1, targets: t, round: 0, tries: 0, done: false, resolved: false };
}
function m3Html(){
  return '<div class="gcrd">' +
    '<div class="mhead"><div class="mtitle">' + L('Escalador de triángulos', 'Triangle scaler') + '</div>' +
    '<div class="mround" id="m3r"></div></div>' +
    '<p style="font-size:.86rem">' + L(
      'El triángulo verde mide 4 cm, 3 cm y 5 cm. La copia dorada se obtiene multiplicando cada lado por k. Mueve k y observa qué cambia y qué no.',
      'The green triangle measures 4 cm, 3 cm and 5 cm. The gold copy comes from multiplying each side by k. Move k and watch what changes and what does not.') + '</p>' +
    '<div class="cvwrap"><canvas class="mcv" id="m3cv"></canvas></div>' +
    '<div class="cg" style="margin-top:.8rem"><label>' + L('Razón k', 'Ratio k') + ' = <span class="cval" id="m3lk"></span></label>' +
      '<input type="range" id="m3k" min="5" max="30" step="1" oninput="m3Input()"></div>' +
    '<div class="mstat">' +
      '<div class="mtile"><div class="tl">A′B′</div><div class="tv" id="m3s1">·</div></div>' +
      '<div class="mtile"><div class="tl">B′C′</div><div class="tv" id="m3s2">·</div></div>' +
      '<div class="mtile"><div class="tl">C′A′</div><div class="tv" id="m3s3">·</div></div>' +
    '</div>' +
    '<div class="mnote" id="m3ang"></div>' +
    '<div class="mrow"><button class="mbtn go" onclick="m3Check()">' + L('Comprobar', 'Check') + '</button>' +
      '<button class="mbtn" id="m3next" style="display:none" onclick="m3Next()">' + L('Siguiente →', 'Next →') + '</button></div>' +
    '<div class="mfb" id="m3fb"></div>' +
  '</div>';
}
function m3Target(){ return M3.targets[M3.round] * M3.AB; }
function m3Init(){
  var s = document.getElementById('m3k'); if (!s) return;
  s.value = 10; M3.k = 1;
  m3Input();
  m3Ask();
}
function m3Ask(){
  var lbl = document.getElementById('m3r');
  if (lbl) lbl.textContent = L('Reto ', 'Task ') + (M3.round + 1) + L(' de 3', ' of 3');
  setFb('m3fb', L('Ajusta k hasta que A′B′ mida exactamente ' + nf(m3Target()) + ' cm.',
                  'Adjust k until A′B′ measures exactly ' + nf(m3Target()) + ' cm.'), '');
}
function m3Input(){
  var s = document.getElementById('m3k'); if (!s || !M3) return;
  M3.k = parseInt(s.value, 10) / 10;
  document.getElementById('m3lk').textContent = nf(M3.k);
  document.getElementById('m3s1').textContent = nf(M3.k * M3.AB) + ' cm';
  document.getElementById('m3s2').textContent = nf(M3.k * M3.BC) + ' cm';
  document.getElementById('m3s3').textContent = nf(M3.k * M3.CA) + ' cm';
  document.getElementById('m3ang').textContent = L(
    'Los ángulos siguen midiendo 37°, 53° y 90° en los dos triángulos: k estira los lados, no las aberturas.',
    'The angles are still 37°, 53° and 90° in both triangles: k stretches the sides, not the openings.');
  if (!M3.resolved && !M3.done){
    var cur = M3.k * M3.AB, tg = m3Target();
    if (Math.abs(cur - tg) < 0.001) setFb('m3fb', L('A′B′ = ' + nf(cur) + ' cm. Justo. Toca Comprobar.', 'A′B′ = ' + nf(cur) + ' cm. Exactly right. Tap Check.'), 'near');
    else setFb('m3fb', L('A′B′ = ' + nf(cur) + ' cm: todavía ' + (cur < tg ? 'es menor que' : 'pasa de') + ' ' + nf(tg) + ' cm.',
                         'A′B′ = ' + nf(cur) + ' cm: still ' + (cur < tg ? 'below' : 'above') + ' ' + nf(tg) + ' cm.'), '');
  }
  m3Draw();
}
function m3Draw(){
  var f = cvFit('m3cv'); if (!f || !M3) return;
  var ctx = f.ctx;
  var base = triPts(3, 4, 90);
  var big = base.map(function(p){ return { x: p.x * M3.k, y: p.y * M3.k }; });
  var m = fitMap([base, big], f.w, f.h, 34);
  var PB = mapTri(base, m), PG = mapTri(big, m);
  strokeTri(ctx, PG, cssv('--gold'), 2.6, true);
  strokeTri(ctx, PB, cssv('--green'), 3, false);
  drawArc(ctx, PB[2], PB[0], PB[1], cssv('--green'), 16);
  drawArc(ctx, PG[2], PG[0], PG[1], cssv('--gold'), 22);
  labelTri(ctx, PB, ['A', 'B', 'C'], cssv('--text2'));
  ctx.save();
  ctx.fillStyle = cssv('--gold'); ctx.textAlign = 'left'; ctx.font = '500 11px "IBM Plex Sans", sans-serif';
  ctx.fillText('k = ' + nf(M3.k), 10, 16);
  ctx.restore();
}
function m3Check(){
  if (!M3 || M3.done || M3.resolved) return;
  var cur = M3.k * M3.AB, tg = m3Target();
  if (Math.abs(cur - tg) < 0.001){
    M3.resolved = true;
    setFb('m3fb', '🎉 ' + L('Con k = ' + nf(M3.targets[M3.round]) + ' cada lado se multiplica por ese mismo número y los ángulos no se mueven: eso es semejanza.',
                            'With k = ' + nf(M3.targets[M3.round]) + ' every side is multiplied by that same number and the angles stay put: that is similarity.'), 'good');
    document.getElementById('m3next').style.display = 'inline-block';
    return;
  }
  M3.tries++;
  if (M3.tries >= 3){
    M3.resolved = true;
    document.getElementById('m3k').value = Math.round(M3.targets[M3.round] * 10);
    m3Input();
    setFb('m3fb', L('La razón buscada era k = ' + nf(M3.targets[M3.round]) + ', porque ' + nf(tg) + ' entre 4 da ese valor.',
                    'The ratio was k = ' + nf(M3.targets[M3.round]) + ', because ' + nf(tg) + ' divided by 4 gives that value.'), 'near');
    document.getElementById('m3next').style.display = 'inline-block';
    return;
  }
  setFb('m3fb', L('A′B′ = ' + nf(cur) + ' cm. ' + (cur < tg ? 'Sube k.' : 'Baja k.'),
                  'A′B′ = ' + nf(cur) + ' cm. ' + (cur < tg ? 'Raise k.' : 'Lower k.')), 'near');
}
function m3Next(){
  if (!M3) return;
  M3.round++; M3.tries = 0; M3.resolved = false;
  document.getElementById('m3next').style.display = 'none';
  if (M3.round >= M3.targets.length){
    M3.done = true; M3.round = M3.targets.length - 1;
    setFb('m3fb', L('Tres razones distintas y la misma forma en todas.', 'Three different ratios and the same shape in all of them.'), 'good');
    return;
  }
  document.getElementById('m3k').value = 10;
  m3Input();
  m3Ask();
}

/* ================================================
   MANIPULATIVE 4 : Balanza de proporciones (Tales)
   Pattern B: 3 rounds. The beam tips live toward the larger ratio.
   ================================================ */
var M4 = null;
function m4Build(rng){
  var pool = shuffle([[6,9,12],[4,8,6],[6,10,15],[8,12,10],[5,10,7]], rng).slice(0, 3);
  M4 = { pool: pool, round: 0, tries: 0, val: 4, done: false, resolved: false };
}
function m4Cur(){ var r = M4.pool[M4.round]; return { p: r[0], q: r[1], r: r[2], ec: r[1] * r[2] / r[0] }; }
function m4Html(){
  return '<div class="gcrd">' +
    '<div class="mhead"><div class="mtitle">' + L('Balanza de razones', 'Ratio balance') + '</div>' +
    '<div class="mround" id="m4r"></div></div>' +
    '<p style="font-size:.86rem">' + L(
      'En el triángulo ABC hay un segmento DE paralelo a BC. La balanza compara las dos razones: el platillo con la razón más grande baja. Mueve EC hasta equilibrarla.',
      'Triangle ABC has a segment DE parallel to BC. The balance compares the two ratios: the pan with the larger ratio drops. Move EC until it is level.') + '</p>' +
    '<div class="cvwrap"><canvas class="mcv" id="m4cv"></canvas></div>' +
    '<div class="cg" style="margin-top:.8rem"><label>EC = <span class="cval" id="m4lv"></span> cm</label>' +
      '<input type="range" id="m4v" min="1" max="34" step="1" oninput="m4Input()"></div>' +
    '<div class="mrow"><button class="mbtn go" onclick="m4Check()">' + L('Comprobar', 'Check') + '</button>' +
      '<button class="mbtn" id="m4next" style="display:none" onclick="m4Next()">' + L('Siguiente →', 'Next →') + '</button></div>' +
    '<div class="mfb" id="m4fb"></div>' +
  '</div>';
}
function m4Init(){
  var s = document.getElementById('m4v'); if (!s) return;
  M4.val = 4; s.value = 4;
  m4Input();
  m4Ask();
}
function m4Ask(){
  var c = m4Cur();
  var lbl = document.getElementById('m4r');
  if (lbl) lbl.textContent = L('Reto ', 'Task ') + (M4.round + 1) + L(' de 3', ' of 3');
  setFb('m4fb', L('Datos: AD = ' + c.p + ' cm, DB = ' + c.q + ' cm, AE = ' + c.r + ' cm. Busca EC.',
                  'Data: AD = ' + c.p + ' cm, DB = ' + c.q + ' cm, AE = ' + c.r + ' cm. Find EC.'), '');
}
function m4Input(){
  var s = document.getElementById('m4v'); if (!s || !M4) return;
  M4.val = parseInt(s.value, 10);
  document.getElementById('m4lv').textContent = M4.val;
  m4Draw();
  if (M4.resolved || M4.done) return;
  var c = m4Cur();
  var rl = c.p / c.q, rr = c.r / M4.val;
  if (Math.abs(rl - rr) < 1e-9)
    setFb('m4fb', L('Equilibrada. Las dos razones valen lo mismo: toca Comprobar.', 'Level. Both ratios are equal: tap Check.'), 'near');
  else if (rr > rl)
    setFb('m4fb', L('La razón de la derecha es mayor y ese platillo baja: agranda EC.',
                    'The right ratio is larger and that pan drops: make EC bigger.'), '');
  else
    setFb('m4fb', L('La razón de la izquierda es mayor y ese platillo baja: achica EC.',
                    'The left ratio is larger and that pan drops: make EC smaller.'), '');
}
function m4Draw(){
  var f = cvFit('m4cv'); if (!f || !M4) return;
  var ctx = f.ctx, c = m4Cur();
  var rl = c.p / c.q, rr = c.r / M4.val;
  var ang = Math.atan((rl - rr) * 1.8);
  if (ang > 0.42) ang = 0.42;
  if (ang < -0.42) ang = -0.42;
  var cx = f.w / 2, cy = f.h * 0.42, arm = Math.min(f.w * 0.33, 130);
  var col = cssv('--green'), gold = cssv('--gold'), txt = cssv('--text2'), bd = cssv('--border');
  ctx.save();
  ctx.strokeStyle = bd; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx - 20, f.h - 26); ctx.lineTo(cx + 20, f.h - 26); ctx.closePath(); ctx.stroke();
  ctx.strokeStyle = col; ctx.lineWidth = 4;
  var lx = cx - arm * Math.cos(ang), ly = cy + arm * Math.sin(ang);
  var rx = cx + arm * Math.cos(ang), ry = cy - arm * Math.sin(ang);
  ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(rx, ry); ctx.stroke();
  ctx.fillStyle = col; ctx.beginPath(); ctx.arc(cx, cy, 5, 0, 6.284); ctx.fill();
  function pan(x, y, a, b, hot){
    ctx.strokeStyle = bd; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + 22); ctx.stroke();
    ctx.strokeStyle = hot ? gold : bd;
    ctx.beginPath(); ctx.moveTo(x - 34, y + 22); ctx.lineTo(x + 34, y + 22); ctx.stroke();
    ctx.fillStyle = txt; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.font = '500 13px "IBM Plex Mono", monospace';
    ctx.fillText(String(a), x, y + 40);
    ctx.strokeStyle = txt; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(x - 16, y + 45); ctx.lineTo(x + 16, y + 45); ctx.stroke();
    ctx.fillText(String(b), x, y + 61);
  }
  var eq = Math.abs(rl - rr) < 1e-9;
  pan(lx, ly, c.p, c.q, !eq && rl > rr);
  pan(rx, ry, c.r, M4.val, !eq && rr > rl);
  ctx.fillStyle = cssv('--text3'); ctx.textAlign = 'center'; ctx.font = '500 11px "IBM Plex Sans", sans-serif';
  ctx.fillText('AD : DB', lx, ly + 78);
  ctx.fillText('AE : EC', rx, ry + 78);
  if (eq){
    ctx.fillStyle = cssv('--ok'); ctx.textAlign = 'center'; ctx.font = '600 13px "IBM Plex Sans", sans-serif';
    ctx.fillText(L('en equilibrio 🎉', 'balanced 🎉'), cx, 20);
  }
  ctx.restore();
}
function m4Check(){
  if (!M4 || M4.done || M4.resolved) return;
  var c = m4Cur();
  if (M4.val === c.ec){
    M4.resolved = true;
    setFb('m4fb', '🎉 ' + L('EC = ' + c.ec + ' cm. La paralela reparte los dos lados en la misma razón, por eso ' + c.p + ' entre ' + c.q + ' vale lo mismo que ' + c.r + ' entre ' + c.ec + '.',
                            'EC = ' + c.ec + ' cm. The parallel splits both sides in the same ratio, which is why ' + c.p + ' over ' + c.q + ' equals ' + c.r + ' over ' + c.ec + '.'), 'good');
    document.getElementById('m4next').style.display = 'inline-block';
    return;
  }
  M4.tries++;
  if (M4.tries >= 3){
    M4.resolved = true;
    document.getElementById('m4v').value = c.ec;
    m4Input();
    M4.resolved = true;
    setFb('m4fb', L('El valor que equilibra es EC = ' + c.ec + ' cm: multiplica DB por AE y divide entre AD.',
                    'The balancing value is EC = ' + c.ec + ' cm: multiply DB by AE and divide by AD.'), 'near');
    document.getElementById('m4next').style.display = 'inline-block';
    return;
  }
  setFb('m4fb', L('Todavía no: el platillo de la ' + (c.r / M4.val > c.p / c.q ? 'derecha' : 'izquierda') + ' sigue abajo.',
                  'Not yet: the ' + (c.r / M4.val > c.p / c.q ? 'right' : 'left') + ' pan is still down.'), 'near');
}
function m4Next(){
  if (!M4) return;
  M4.round++; M4.tries = 0; M4.resolved = false;
  document.getElementById('m4next').style.display = 'none';
  if (M4.round >= M4.pool.length){
    M4.done = true; M4.round = M4.pool.length - 1;
    setFb('m4fb', L('Tres figuras equilibradas: la proporción funciona siempre igual.',
                    'Three balanced figures: the proportion always works the same way.'), 'good');
    return;
  }
  document.getElementById('m4v').value = 4;
  m4Input();
  m4Ask();
}

              'Look at the endpoints of the known side: check whether the two known angles sit at those vertices.'),

  /* ── Problema 2 ── */
  var p2v = Math.floor(rng() * 2);

    pushProb({
      title: L('Leer la correspondencia', 'Reading the correspondence'),
      questionText: L('Los triángulos ABC y DEF son congruentes con la correspondencia A↔D, B↔E, C↔F. El ángulo D mide ' + ang[0] + '° y el ángulo E mide ' + ang[1] + '°. ¿Cuánto mide el ángulo C?',

  /*  CONCEPTO 2 : LOS CRITERIOS  */
  addSection(

      '<div class="rcard"><div class="rname">' + L('Ángulo, lado, ángulo', 'Angle, side, angle') + '</div><div class="rform">' + L('ALA', 'ASA') + '</div><div class="rnote">' + L('Dos ángulos y el lado que los une.', 'Two angles and the side joining them.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + L('El caso tramposo', 'The tricky case') + '</div><div class="rform">' + L('LLA', 'SSA') + '</div><div class="rnote">' + L('Dos lados y un ángulo fuera de ellos: puede dar dos triángulos.', 'Two sides and an angle outside them: it can give two triangles.') + '</div></div>' +
    '</div>' +
    '<p>' + L('Los tres ángulos iguales tampoco bastan: eso deja la forma fija pero no el tamaño. Ahora entrena el ojo con figuras marcadas.',

  m2Build(rng);
  setTimeout(m2Init, 90);

  /* ── Problema 3 ── */
  var p3v = Math.floor(rng() * 2);
  if (p3v === 0){
    var o3 = [
      L('AB = DE, BC = EF y el ángulo C igual al ángulo F', 'AB = DE, BC = EF and angle C equal to angle F'),

      hint: L('Revisa en cada opción si el ángulo mencionado queda encerrado entre los dos lados mencionados o si cae en otro vértice.',

      explanation: L('En esa opción los lados dados son AB y BC, que se cruzan en B, pero el ángulo dado está en C. Al quedar el ángulo fuera de los dos lados se pueden construir dos triángulos distintos con esos mismos datos.',
                     'In that option the given sides are AB and BC, which meet at B, but the given angle is at C. With the angle outside the two sides, two different triangles can be built from the same data.'),

              'First rule out what only fixes the shape and what leaves the angle outside the given sides; then count how many measurements each list has.'),
      explanation: L('El lado BC une los vértices B y C, y esos son justamente los dos ángulos dados: el lado queda comprendido entre ellos y se cumple el criterio ALA.',

  /*  CONCEPTO 3 : SEMEJANZA  */
  addSection(

    '<p>' + L('Dos triángulos son semejantes cuando sus ángulos correspondientes son iguales y sus lados correspondientes son proporcionales. Se escribe ABC ~ DEF. El número que relaciona los lados se llama razón de semejanza y se representa con k.',
              'Two triangles are similar when their corresponding angles are equal and their corresponding sides are proportional. It is written ABC ~ DEF. The number relating the sides is called the ratio of similarity and is written k.') + '</p>' +
    '<div class="callout"><p><strong>' + L('La razón k.', 'The ratio k.') + '</strong> ' +
      L('Si ABC ~ DEF, entonces k = ' + frac('DE', 'AB') + ' = ' + frac('EF', 'BC') + ' = ' + frac('FD', 'CA') + '. Cuando k vale 1 los triángulos además son congruentes.',
        'If ABC ~ DEF, then k = ' + frac('DE', 'AB') + ' = ' + frac('EF', 'BC') + ' = ' + frac('FD', 'CA') + '. When k equals 1 the triangles are congruent as well.') + '</p></div>' +
    '<p>' + L('Estira y encoge la copia y vigila los ángulos: si cambiaran, ya no sería una copia a escala.',
              'Stretch and shrink the copy and keep an eye on the angles: if they changed, it would no longer be a scaled copy.') + '</p>' +

  m3Build(rng);
  setTimeout(m3Init, 90);

  /* ── Problema 4 ── */
  var p4v = Math.floor(rng() * 2);
  if (p4v === 0){
    var a4 = pick([6, 8, 10], rng), k4 = pick([1.5, 2, 2.5], rng);

      title: L('Encontrar la razón', 'Finding the ratio'),

                     'Since DE = k · AB, we get ' + nf(k4b) + ' × ' + a4b + ' = ' + nf(de4) + ' cm.'),
      options: o4b, correct: o4b[0], showWork: true
    }, rng);
  }

  /* ── Problema 5 ── */
  var sh = pick([[6, 4, 12], [12, 6, 10], [8, 4, 14]], rng);
  var hA = sh[0], sA = sh[1], sP = sh[2], hP = hA * sP / sA;
  var o5 = [nf(hP) + ' m', nf(sP + hA - sA) + ' m', nf(sP * sA / hA) + ' m', nf(hP + hA - sA) + ' m'];
  pushProb({
    title: L('Sombras a la misma hora', 'Shadows at the same hour'),
    questionText: L('A media mañana, un árbol de ' + hA + ' m de altura proyecta una sombra de ' + sA + ' m sobre el patio. Al mismo tiempo, el asta bandera que está junto a él proyecta una sombra de ' + sP + ' m. Los rayos del sol llegan con la misma inclinación a los dos. ¿Qué altura tiene el asta bandera?',
                    'In the middle of the morning, a tree ' + hA + ' m tall casts a ' + sA + ' m shadow on the yard. At the same time, the flagpole next to it casts a ' + sP + ' m shadow. The sun rays reach both with the same slant. How tall is the flagpole?'),
    hint: L('Cada objeto y su sombra forman un triángulo rectángulo, y los dos triángulos son semejantes porque el sol llega con el mismo ángulo. Compara altura con sombra en el objeto que conoces por completo.',
