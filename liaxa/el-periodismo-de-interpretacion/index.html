  /* ══════════════ building blocks ══════════════ */
  function section(tag, title, paras, callout) {
    var d = document.createElement('div');
    d.className = 'section';
    d.innerHTML = '<div class="stag">' + tag + '</div><h2>' + title + '</h2>' +
      paras.map(function(p){ return '<p>' + p + '</p>'; }).join('') +
      (callout ? '<div class="callout"><p>' + callout + '</p></div>' : '');
    body.appendChild(d);
  }

  function shuffleOpts(opts, correct) {
    var idx = opts.map(function(_, i){ return i; });
    for (var i = idx.length - 1; i > 0; i--) {
      var j = Math.floor(rng() * (i + 1));
      var tmp = idx[i]; idx[i] = idx[j]; idx[j] = tmp;
    }
    return { opts: idx.map(function(k){ return opts[k]; }), idx: idx.indexOf(correct) };
  }

  function addProblem(q) {
    var raw = q.options[LANG] || q.options.es;
    var sh = shuffleOpts(raw, q.correct);
    problems.push({
      title: Lg(q.title), questionText: Lg(q.stmt), fn: '',
      options: sh.opts, correctIdx: sh.idx,
      hint: Lg(q.hint), explanation: Lg(q.expl),
      showWork: !!q.showWork,
      studentChoice: null, pendingChoice: null
    });
    buildOneCard(problems[problems.length - 1], problems.length - 1);
  }

  /* ══════════════ THE REPORT (working material) ══════════════ */
  function excerpt() {
    var d = document.createElement('div');
    d.className = 'section';
    d.innerHTML = '<div class="exc">' +
      '<div class="exc-kick">' + Lg(C.kick) + '</div>' +
      '<div class="exc-head">' + C.head + '</div>' +
      '<div class="exc-by">' + Lg(C.by) + '</div>' +
      C.paras.map(function(p, i){ return '<div class="exc-p"><span class="exc-n">' + (i + 1) + '</span>' + p + '</div>'; }).join('') +
      '<div class="exc-foot">' + L('El reportaje se conserva en español porque es el material que vas a analizar.',
                                   'The report is kept in Spanish because it is the material you are going to analyse.') + '</div>' +
      '</div>';
    body.appendChild(d);
  }

  /* ══════════════ W1 — the three layers of the text (Mode C) ══════════════ */
  function buildLayers() {
    var BINS = ES ? ['Hecho verificado', 'Testimonio atribuido', 'Interpretación del texto']
                  : ['Verified fact', 'Attributed testimony', 'Interpretation by the text'];
    var IT = C.capas;
    var st = { seq: perm(IT.length), i: 0, tries: 0, hits: 0, done: false, lastWhy: '' };
    var w = document.createElement('div');
    w.className = 'gw section'; w.id = 'wCap';
    w.setAttribute('data-widget', 'classify');
    body.appendChild(w);
    function render() {
      if (st.done) {
        w.innerHTML = '<div class="iw-tag">' + L('Separa las tres capas', 'Sort the three layers') + '</div>' +
          '<div class="cls-done">✓ ' + L('Capas separadas', 'Layers sorted') + ' ' + st.hits + ' / ' + IT.length + '</div>' +
          '<div class="rfb">' + (st.lastWhy ? st.lastWhy + ' ' : '') +
          L('Un texto de interpretación necesita las tres: los hechos sostienen, las voces atribuyen y la interpretación explica lo que ninguna de las dos dice sola.',
            'An interpretive text needs all three: facts support, voices attribute and interpretation explains what neither of the other two says on its own.') + '</div>';
        return;
      }
      var it = IT[st.seq[st.i]];
      w.innerHTML = '<div class="iw-tag">' + L('Separa las tres capas', 'Sort the three layers') + '</div>' +
        '<div class="gw-mini">' + L('Decide de dónde procede cada enunciado del reportaje: de un documento comprobado, de una persona citada, o del propio texto al relacionar lo demás.',
                                    'Decide where each statement of the report comes from: a verified document, a quoted person, or the text itself relating everything else.') + '</div>' +
        '<div class="gw-prog">' + (st.i + 1) + ' / ' + IT.length + '</div>' +
        '<div class="cls-card">' + Lg(it.frag) + '</div>' +
        '<div class="cls-bins">' + BINS.map(function(b, bi){ return '<button class="cls-bin" onclick="wCapPick(' + bi + ')">' + b + '</button>'; }).join('') + '</div>' +
        '<div class="rfb" id="wCapFb"></div>';
    }
    window.wCapPick = function(bi) {
      if (st.done) return;
      var it = IT[st.seq[st.i]];
      var fb = document.getElementById('wCapFb');
      if (bi === it.bin) {
        st.hits++; st.tries = 0; st.i++; st.lastWhy = Lg(it.why);
        if (st.i >= IT.length) st.done = true;
        render();
        if (!st.done) document.getElementById('wCapFb').innerHTML =
          '<span class="rok">✓ ' + L('Correcto.', 'Correct.') + '</span> ' + Lg(it.why);
        return;
      }
      st.tries++;
      if (st.tries >= 3) {
        fb.innerHTML = '<b>' + BINS[it.bin] + '.</b> ' + Lg(it.why);
        st.tries = 0; st.i++;
        if (st.i >= IT.length) st.done = true;
        setTimeout(render, 1700);
        return;
      }
      fb.textContent = (it.bin === 0)
        ? L('Todavía no. Pregúntate si el enunciado remite a un documento o a un trabajo que otra persona podría revisar aparte.',
            'Not yet. Ask yourself whether the statement points to a document or to work that someone else could check separately.')
        : (it.bin === 1)
          ? L('Todavía no. Busca la marca que dice de quién procede la afirmación: si la hay, la voz no es la del reportaje.',
              'Not yet. Look for the marker saying where the claim comes from: if it is there, the voice is not that of the report.')
          : L('Todavía no. Fíjate si el enunciado reúne varios hechos y les da un sentido que ningún registro contiene por sí solo.',
              'Not yet. Notice whether the statement gathers several facts and gives them a meaning that no record holds on its own.');
    };
    render();
  }

  /* ══════════════ W2 — order the moves of the report (Mode C) ══════════════ */
  function buildOrder() {
    var MOV = C.moves;
    var st = { order: permMoved(MOV.length), sel: null, tries: 0, done: false };
    var w = document.createElement('div');
    w.className = 'gw section'; w.id = 'wOrd';
    w.setAttribute('data-widget', 'timeline');
    body.appendChild(w);
    function render() {
      var chips = st.order.map(function(ei, pos) {
        var cls = 'tl-chip' + (st.sel === pos ? ' sel' : '') + (st.done ? ' locked' : '');
        return '<div class="' + cls + '" onclick="wOrdTap(' + pos + ')"><span class="tl-num">' + (pos + 1) + '</span>' + Lg(MOV[ei]) + '</div>';
      }).join('');
      w.innerHTML = '<div class="iw-tag">' + L('Arma el recorrido del reportaje', 'Assemble the route of the report') + '</div>' +
        '<div class="gw-mini">' + L('Coloca los movimientos en el orden en que aparecen en el texto. Toca dos para intercambiarlos.',
                                    'Put the moves in the order they appear in the text. Tap two to swap them.') + '</div>' +
        '<div class="tl-list">' + chips + '</div>' +
        (st.done ? '' : '<button class="rverify-btn" onclick="wOrdCheck()">' + L('Comprobar', 'Check') + '</button>') +
        '<div class="rfb" id="wOrdFb"></div>';
    }
    window.wOrdTap = function(pos) {
      if (st.done) return;
      if (st.sel === null) st.sel = pos;
      else if (st.sel === pos) st.sel = null;
      else { var t = st.order[st.sel]; st.order[st.sel] = st.order[pos]; st.order[pos] = t; st.sel = null; }
      render();
    };
    window.wOrdCheck = function() {
      var ok = st.order.every(function(ei, pos){ return ei === pos; });
      if (ok) {
        st.done = true; render();
        document.getElementById('wOrdFb').innerHTML = '<span class="rok">✓ ' + L('Ese es el recorrido.', 'That is the route.') + '</span> ' +
          L('La escena abre, el suceso se enuncia, los antecedentes lo explican, las voces se contrastan, el documento las coteja y el cierre dice qué queda de todo eso.',
            'The scene opens, the event is stated, the background explains it, the voices are contrasted, the document checks them and the closing says what all of it leaves behind.');
        return;
      }
      st.tries++;
      if (st.tries >= 3) {
        st.order = MOV.map(function(_, i){ return i; }); st.done = true; render();
        document.getElementById('wOrdFb').innerHTML =
          L('Este es el orden del reportaje. Observa que el documento llega después de las voces: solo así puede dirimir el desacuerdo.',
            'This is the order of the report. Notice the document arrives after the voices: only then can it settle the disagreement.');
        return;
      }
      var bad = 0;
      for (var k = 0; k < st.order.length; k++) { if (st.order[k] !== k) { bad = k; break; } }
      document.getElementById('wOrdFb').textContent =
        L('Aún no. Revisa la posición ' + (bad + 1) + ': ¿ese movimiento necesita algo que todavía no se ha contado?',
          'Not yet. Check position ' + (bad + 1) + ': does that move need something that has not been told yet?');
    };
    render();
  }

  /* ══════════════ W3 — match each fragment with its device (Mode C) ══════════════ */
  function buildDeviceMatch() {
    var R = C.recursos;
    var st = { left: permMoved(R.length), right: permMoved(R.length), sel: null, done: {}, tries: 0, over: false };
    var w = document.createElement('div');
    w.className = 'gw section'; w.id = 'wMat';
    w.setAttribute('data-widget', 'match');
    body.appendChild(w);
    function solved(i){ return st.done[i] === true; }
    function render() {
      var left = st.left.map(function(li) {
        var cls = 'mt-chip' + (solved(li) ? ' done' : '') + (st.sel === li ? ' sel' : '');
        return '<div class="' + cls + '" onclick="wMatLeft(' + li + ')">' + R[li].frag + '</div>';
      }).join('');
      var right = st.right.map(function(ri) {
        var cls = 'mt-chip' + (solved(ri) ? ' done' : '');
        return '<div class="' + cls + '" onclick="wMatRight(' + ri + ')">' + Lg(R[ri].rec) + '</div>';
      }).join('');
      w.innerHTML = '<div class="iw-tag">' + L('Nombra el recurso', 'Name the device') + '</div>' +
        '<div class="gw-mini">' + L('Toca un fragmento del reportaje y después el recurso que emplea.',
                                    'Tap a fragment of the report and then the device it uses.') + '</div>' +
        '<div class="mt-grid"><div><div class="mt-col-t">' + L('Fragmento', 'Fragment') + '</div>' + left + '</div>' +
        '<div><div class="mt-col-t">' + L('Recurso', 'Device') + '</div>' + right + '</div></div>' +
        '<div class="rfb" id="wMatFb"></div>';
    }
    window.wMatLeft = function(li) {
      if (st.over || solved(li)) return;
      st.sel = (st.sel === li) ? null : li;
      render();
    };
    window.wMatRight = function(ri) {
      if (st.over || solved(ri)) return;
      var fb = document.getElementById('wMatFb');
      if (st.sel === null) {
        fb.textContent = L('Elige primero un fragmento de la columna izquierda.', 'Choose a fragment from the left column first.');
        return;
      }
      if (st.sel === ri) {
        st.done[ri] = true; st.tries = 0; st.sel = null;
        var all = R.every(function(_, k){ return solved(k); });
        if (all) st.over = true;
        render();
        document.getElementById('wMatFb').innerHTML = '<span class="rok">✓ ' + L('Enlazado.', 'Linked.') + '</span> ' + Lg(R[ri].why) +
          (all ? ' ' + L('Los cinco recursos trabajan con lo que el reportaje pudo reunir: ninguno opina.',
                         'The five devices work with what the report was able to gather: none of them gives an opinion.') : '');
        return;
      }
      st.tries++;
      if (st.tries >= 3) {
        R.forEach(function(_, k){ st.done[k] = true; });
        st.over = true; st.sel = null; render();
        document.getElementById('wMatFb').innerHTML = L('Estos son los enlaces correctos. ', 'These are the correct links. ') +
          R.map(function(r){ return '<b>' + Lg(r.rec) + '</b>: ' + Lg(r.why); }).join(' ');
        return;
      }
      st.sel = null; render();
      document.getElementById('wMatFb').textContent =
        L('Todavía no. Vuelve a leer el fragmento y pregúntate qué hace: pone una escena, retrocede en el tiempo, enfrenta dos voces, trae un registro o dice qué significa todo.',
          'Not yet. Read the fragment again and ask what it does: sets a scene, steps back in time, faces two voices, brings a record or says what it all means.');
    };
    render();
  }

  /* ══════════════ W4 — mark the attribution (Mode B: silent until Comprobar) ══════════════ */
  function buildMarkAttribution() {
    var TOK = C.marca;
    var st = { on: {}, tries: 0, done: false };
    var w = document.createElement('div');
    w.className = 'gw section'; w.id = 'wMark';
    w.setAttribute('data-widget', 'mark');
    body.appendChild(w);
    function render() {
      var sent = TOK.map(function(tk, i) {
        var cls = 'mk-w' + (st.done && tk.hit ? ' hit' : (st.on[i] ? ' on' : ''));
        return '<span class="' + cls + '" onclick="wMarkTap(' + i + ')">' + tk.t + '</span>';
      }).join(' ');
      w.innerHTML = '<div class="iw-tag">' + L('Marca la frontera de la voz', 'Mark the border of the voice') + '</div>' +
        '<div class="gw-mini">' + L('Toca las palabras que avisan de quién procede cada afirmación. Puedes quitarlas volviendo a tocarlas.',
                                    'Tap the words that announce where each claim comes from. You can remove them by tapping again.') + '</div>' +
        '<div class="gw-prog">' + Lg(C.marcaTitle) + '</div>' +
        '<div class="mk-sent">' + sent + '</div>' +
        (st.done ? '' : '<button class="rverify-btn" onclick="wMarkCheck()">' + L('Comprobar', 'Check') + '</button>') +
        '<div class="rfb" id="wMarkFb"></div>';
    }
    window.wMarkTap = function(i) {
      if (st.done) return;
      st.on[i] = !st.on[i];
      render();
    };
    window.wMarkCheck = function() {
      var good = 0, bad = 0, total = 0;
      TOK.forEach(function(tk, i) {
        if (tk.hit) total++;
        if (st.on[i] && tk.hit) good++;
        if (st.on[i] && !tk.hit) bad++;
      });
      if (good === total && bad === 0) {
        st.done = true; render();
        document.getElementById('wMarkFb').innerHTML = '<span class="rok">✓ ' + L('Las cuatro.', 'All four.') + '</span> ' +
          L('según, de acuerdo con, confirmó y refirió ponen cada afirmación a nombre de alguien. Sin ellas, el reportaje estaría dando por comprobado lo que no comprobó.',
            'según, de acuerdo con, confirmó and refirió put each claim in the name of someone. Without them, the report would be taking as verified what it never verified.');
        return;
      }
      st.tries++;
      if (st.tries >= 3) {
        st.done = true; render();
        document.getElementById('wMarkFb').innerHTML =
          L('Estas son las cuatro marcas del párrafo. Quítalas mentalmente y verás que las afirmaciones siguen ahí, pero ya nadie responde por ellas salvo el reportaje.',
            'These are the four markers in the paragraph. Take them away mentally and you will see the claims are still there, but nobody answers for them except the report.');
        return;
      }
      var msg;
      if (bad > 0 && good < total) msg = L('Todavía no. Alguna de tus marcas forma parte de lo que se afirma, no de quién lo afirma, y aún falta encontrar otra marca.',
                                           'Not yet. One of your marks is part of what is claimed, not of who claims it, and there is still another marker to find.');
      else if (bad > 0) msg = L('Casi. Sobra una marca: quítala y comprueba si el párrafo pierde alguna frontera entre el texto y una fuente.',
                                'Almost. One mark is extra: remove it and check whether the paragraph loses any border between the text and a source.');
      else msg = L('Vas bien, pero falta al menos una. Busca también los verbos con que el texto presenta lo que alguien dijo.',
                   'You are on track, but at least one is missing. Look also at the verbs with which the text presents what someone said.');
      document.getElementById('wMarkFb').textContent = msg;
    };
    render();
  }

  /* ══════════════ W5 — build the bridge between a fact and a voice (Mode C, 3 rounds) ══════════════ */
  function buildBridge() {
    var RD = C.puentes;
    var st = { r: 0, tries: 0, done: false, lastWhy: '', ord: RD.map(function(){ return perm(4); }) };
    var w = document.createElement('div');
    w.className = 'gw section'; w.id = 'wBri';
    w.setAttribute('data-widget', 'bridge');
    body.appendChild(w);
    function render() {
      if (st.done) {
        w.innerHTML = '<div class="iw-tag">' + L('Tiende el puente', 'Build the bridge') + '</div>' +
          '<div class="cls-done">✓ ' + L('Puentes tendidos', 'Bridges built') + '</div>' +
          '<div class="rfb">' + (st.lastWhy ? st.lastWhy + ' ' : '') +
          L('Interpretar es relacionar dos materiales y mostrar algo que ninguno decía solo, sin repetir el dato, sin inventar causas y sin cambiar de género.',
            'Interpreting is relating two materials and showing something neither said alone, without repeating the fact, inventing causes or switching genre.') + '</div>';
        return;
      }
      var rd = RD[st.r], ord = st.ord[st.r];
      var raw = rd.opts[LANG] || rd.opts.es;
      var btns = ord.map(function(oi) {
        return '<button class="src-opt" onclick="wBriPick(' + oi + ')">' + raw[oi] + '</button>';
      }).join('');
      w.innerHTML = '<div class="iw-tag">' + L('Tiende el puente', 'Build the bridge') + '</div>' +
        '<div class="gw-mini">' + L('Tienes un dato comprobado y una voz. Elige la frase que explica lo que los dos juntos permiten decir, sin salirse de ellos.',
                                    'You have a verified fact and a voice. Choose the sentence that explains what the two together allow you to say, without going beyond them.') + '</div>' +
        '<div class="gw-prog">' + (st.r + 1) + ' / ' + RD.length + '</div>' +
        '<div class="bri-src"><div class="bri-lbl">' + L('Dato comprobado', 'Verified fact') + '</div><div class="bri-txt">' + Lg(rd.dato) + '</div></div>' +
        '<div class="bri-src"><div class="bri-lbl">' + L('Voz recogida', 'Voice gathered') + '</div><div class="bri-txt">' + Lg(rd.voz) + '</div></div>' +
        '<div class="src-opts">' + btns + '</div>' +
        '<div class="rfb" id="wBriFb"></div>';
    }
    function advance() {
      st.tries = 0; st.r++;
      if (st.r >= RD.length) st.done = true;
      render();
    }
    window.wBriPick = function(oi) {
      if (st.done) return;
      var rd = RD[st.r];
      var fb = document.getElementById('wBriFb');
      if (oi === rd.ok) {
        var why = Lg(rd.why);
        st.lastWhy = why;
        advance();
        var nf = document.getElementById('wBriFb');
        if (nf) nf.innerHTML = '<span class="rok">✓ ' + L('Ese es el puente.', 'That is the bridge.') + '</span> ' + why;
        return;
      }
      st.tries++;
      if (st.tries >= 3) {
        var raw = rd.opts[LANG] || rd.opts.es;
        fb.innerHTML = '<b>' + raw[rd.ok] + '</b> ' + Lg(rd.why);
        setTimeout(advance, 2000);
        return;
      }
      fb.textContent = L('Todavía no. Descarta la frase que solo repite el dato, la que afirma más de lo que las fuentes sostienen y la que dice qué preferiría quien escribe.',
                         'Not yet. Rule out the sentence that only repeats the fact, the one that claims more than the sources support and the one that says what the writer would prefer.');
    };
    render();
  }

  /* ══════════════ W6 — choose the source that settles the claim (Mode C, 3 rounds) ══════════════ */
  function buildSources() {
    var RD = C.fuentes;
    var st = { r: 0, tries: 0, done: false, lastWhy: '', ord: RD.map(function(){ return perm(4); }) };
    var w = document.createElement('div');
    w.className = 'gw section'; w.id = 'wSrc';
    w.setAttribute('data-widget', 'sources');
    body.appendChild(w);
    function render() {
      if (st.done) {
        w.innerHTML = '<div class="iw-tag">' + L('Busca la fuente', 'Find the source') + '</div>' +
          '<div class="cls-done">✓ ' + L('Investigación lista', 'Research ready') + '</div>' +
          '<div class="rfb">' + (st.lastWhy ? st.lastWhy + ' ' : '') +
          L('Cada afirmación pide su propia fuente: las fechas van a los registros llevados entonces, lo vivido va a las voces y lo que ya cambió va a las imágenes.',
            'Every claim asks for its own source: dates go to the registers kept back then, lived experience goes to the voices and what has already changed goes to the images.') + '</div>';
        return;
      }
      var rd = RD[st.r], ord = st.ord[st.r];
      var raw = rd.opts[LANG] || rd.opts.es;
      var btns = ord.map(function(oi) {
        return '<button class="src-opt" onclick="wSrcPick(' + oi + ')">' + raw[oi] + '</button>';
      }).join('');
      w.innerHTML = '<div class="iw-tag">' + L('Busca la fuente', 'Find the source') + '</div>' +
        '<div class="gw-mini">' + L('Antes de escribir hay que comprobar. Elige la fuente que resuelve cada encargo del taller.',
                                    'Before writing you have to verify. Choose the source that settles each workshop assignment.') + '</div>' +
        '<div class="gw-prog">' + (st.r + 1) + ' / ' + RD.length + '</div>' +
        '<div class="src-claim">' + Lg(rd.claim) + '</div>' +
        '<div class="src-opts">' + btns + '</div>' +
        '<div class="rfb" id="wSrcFb"></div>';
    }
    function advance() {
      st.tries = 0; st.r++;
      if (st.r >= RD.length) st.done = true;
      render();
    }
    window.wSrcPick = function(oi) {
      if (st.done) return;
      var rd = RD[st.r];
      var fb = document.getElementById('wSrcFb');
      if (oi === rd.ok) {
        var why = Lg(rd.why);
        st.lastWhy = why;
        advance();
        var nf = document.getElementById('wSrcFb');
        if (nf) nf.innerHTML = '<span class="rok">✓ ' + L('Buena elección.', 'Good choice.') + '</span> ' + why;
        return;
      }
      st.tries++;
      if (st.tries >= 3) {
        var raw = rd.opts[LANG] || rd.opts.es;
        fb.innerHTML = '<b>' + raw[rd.ok] + '.</b> ' + Lg(rd.why);
        setTimeout(advance, 1900);
        return;
      }
      fb.textContent = L('Todavía no. Pregúntate quién anotó ese dato mientras ocurría o quién lo vivió: la fuente correcta es la que estuvo más cerca del suceso.',
                         'Not yet. Ask yourself who wrote that down while it happened or who lived it: the right source is the one that was closest to the event.');
    };
    render();
  }

  /* ══════════════ W7 — the reporter notebook ══════════════ */
  function buildReflect() {
    var PROMPTS = [
      { es:'Elige un suceso de tu escuela o de tu comunidad que merezca un reportaje y escribe, en una sola oración, qué te gustaría explicar de él que hoy nadie tenga por escrito.',
        en:'Choose an event in your school or community that deserves a report and write, in a single sentence, what you would like to explain about it that nobody has in writing today.' },
      { es:'Anota dos personas a las que entrevistarías por ese suceso y el documento que consultarías para cotejar lo que te digan.',
        en:'Note two people you would interview about that event and the document you would consult to check what they tell you.' },
      { es:'Escribe la escena con la que abrirías tu reportaje: un detalle concreto que puedas comprobar, no una idea general.',
        en:'Write the scene you would open your report with: a concrete detail you can verify, not a general idea.' },
      { es:'Dibuja el esquema de tu reportaje: dónde iría la escena, dónde los antecedentes, dónde las voces y dónde el documento.',
        en:'Sketch the outline of your report: where the scene would go, where the background, where the voices and where the document.' }
    ];
    var pick = PROMPTS[Math.floor(rng() * PROMPTS.length)];
    var w = document.createElement('div');
    w.className = 'gw section'; w.id = 'wRef';
    w.setAttribute('data-widget', 'reflect');
    w.innerHTML = '<div class="iw-tag">' + L('Tu libreta de reportero', 'Your reporter notebook') + '</div>' +
      '<div class="reflect-prompt">' + Lg(pick) + '</div>' +
      '<div class="wtabs">' +
        '<button class="wtab active" onclick="wRefTab(\'type\',this)">⌨️ ' + L('Escribir', 'Write') + '</button>' +
        '<button class="wtab" onclick="wRefTab(\'draw\',this)">✏️ ' + L('Dibujar', 'Sketch') + '</button>' +
      '</div>' +
      '<div class="wpanel active" id="wRef_type"><textarea class="wtextarea" id="wRefTa" placeholder="' + L('Tu respuesta...', 'Your answer...') + '"></textarea></div>' +
      '<div class="wpanel" id="wRef_draw"><div class="cvwrap"><canvas class="dcanvas" id="wRefCv"></canvas>' +
        '<div class="ctoolbar"><button class="tbtn2 bpen on">' + t('btn-pen') + '</button>' +
        '<button class="tbtn2 bmarker">' + t('btn-marker') + '</button>' +
        '<button class="tbtn2 beraser">' + t('btn-eraser') + '</button>' +
        drawDotsHTML() + '<button class="clrbtn">' + t('btn-clear') + '</button></div></div></div>' +
      '<button class="rverify-btn" style="margin-top:.6rem" onclick="wRefSave()">' + L('Guardar en la libreta', 'Save to the notebook') + '</button>' +
      '<div class="rfb" id="wRefFb"></div>';
    body.appendChild(w);
    window.wRefTab = function(which, btn) {
      ['type', 'draw'].forEach(function(k){ document.getElementById('wRef_' + k).classList.toggle('active', k === which); });
      w.querySelectorAll('.wtab').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      if (which === 'draw') setTimeout(function(){ var c = document.getElementById('wRefCv'); if (c && !c.width) initCanvas(c); }, 60);
    };
    window.wRefSave = function() {
      document.getElementById('wRefFb').innerHTML = '<span class="rok">✓ ' +
        L('Guardado. Una escena comprobable y un documento que cotejar son ya el esqueleto de tu reportaje.',
          'Saved. A verifiable scene and a document to check against are already the skeleton of your report.') + '</span>';
    };
  }

  /* ══════════════════════════════════════════════════════════════════════════
     THE LESSON — concept, manipulative, problem, in that order (Rule 1)
     ══════════════════════════════════════════════════════════════════════════ */

  section(
    L('Los géneros de interpretación', 'The interpretive genres'),
    L('Contar el suceso, explicarlo, opinar sobre él', 'Telling the event, explaining it, arguing about it'),
    [ L('Un mismo suceso de la comunidad puede dar lugar a tres textos distintos. La nota informativa responde qué pasó, cuándo, dónde y quiénes estuvieron; ordena los datos del más importante al menos importante y se detiene ahí. Los géneros de interpretación parten de esos mismos datos verificados y avanzan una pregunta más: por qué ocurrió, con qué venía relacionado y qué deja detrás. A esa familia pertenecen la crónica, que narra el suceso conforme transcurrió y lo cuenta en escenas, y el reportaje interpretativo, que investiga con varias fuentes, las coteja entre sí y sitúa el suceso dentro de un proceso más amplio.',
         'The same community event can give rise to three different texts. The news report answers what happened, when, where and who was there; it ranks the data from most to least important and stops there. The interpretive genres start from those same verified data and push one question further: why it happened, what it was connected to and what it leaves behind. That family includes the chronicle, which narrates the event as it unfolded and tells it in scenes, and the interpretive report, which investigates with several sources, checks them against each other and places the event inside a wider process.'),
      L('Interpretar no es opinar. Quien opina defiende una preferencia y responde por ella con su firma; quien interpreta explica, y responde con los materiales que reunió. Por eso, dentro de un texto de interpretación conviven tres capas que el lector debe poder distinguir: los hechos verificados, las afirmaciones atribuidas a una fuente y el sentido que el propio texto construye al relacionar unos con otras.',
         'Interpreting is not the same as arguing an opinion. Whoever gives an opinion defends a preference and answers for it with a signature; whoever interprets explains, and answers with the materials gathered. That is why three layers live inside an interpretive text and the reader must be able to tell them apart: verified facts, claims attributed to a source, and the meaning the text itself builds by relating the first two.') ],
    L('Un texto de interpretación se juzga por sus materiales: si el lector puede rastrear de dónde salió cada afirmación, la explicación se sostiene.',
      'An interpretive text is judged by its materials: if the reader can trace where each claim came from, the explanation stands.')
  );

  section(
    L('El material de trabajo', 'The working material'),
    L('Un suceso que el pueblo recuerda de dos maneras', 'An event the town remembers in two ways'),
    [ L('El texto que sigue se publicó en el periódico de una secundaria. El taller de periodismo investigó un suceso de su comunidad, entrevistó a quienes lo vivieron, consultó un archivo y después escribió. Léelo completo antes de continuar: todas las actividades de esta guía vuelven a él.',
         'The text below appeared in a secondary school newspaper. The journalism workshop investigated an event in its community, interviewed those who lived it, consulted an archive and then wrote. Read it in full before going on: every activity in this guide comes back to it.') ]
  );
  excerpt();
  buildLayers();
  addProblem(C.qs.p1);

  section(
    L('La arquitectura del texto', 'The architecture of the text'),
    L('Por qué este texto no empieza por lo más importante', 'Why this text does not begin with the most important thing'),
    [ L('La nota informativa usa la pirámide invertida: primero el dato principal, después los detalles, y quien deja de leer a la mitad ya se llevó lo esencial. Un reportaje interpretativo no puede ordenarse así, porque lo que quiere transmitir no cabe en el primer párrafo: necesita que el lector recorra un camino. Empieza por una escena que muestra qué estaba en juego, enuncia después el suceso y retrocede a los antecedentes que lo explican.',
         'The news report uses the inverted pyramid: the main fact first, the details afterwards, and whoever stops reading halfway has already taken the essential part. An interpretive report cannot be arranged like that, because what it wants to convey does not fit in the first paragraph: it needs the reader to walk a path. It begins with a scene showing what was at stake, then states the event and steps back to the background that explains it.'),
      L('En la segunda mitad aparece el trabajo de investigación: las voces que no coinciden, colocadas una junto a otra, y el documento que permite compararlas. El cierre no repite lo dicho, sino que explica qué queda de todo eso. Cada párrafo ocupa el lugar en el que hace falta, y por eso mover uno de sitio cambia lo que el texto es capaz de demostrar.',
         'In the second half the research work appears: the voices that do not match, placed side by side, and the document that allows them to be compared. The closing does not repeat what was said, it explains what all of it leaves behind. Each paragraph sits where it is needed, and that is why moving one changes what the text is able to demonstrate.') ]
  );
  buildOrder();
  addProblem(C.qs.p2);
  addProblem(C.qs.p3);

  section(
    L('Los recursos del oficio', 'The devices of the trade'),
    L('Cinco piezas que hacen posible la explicación', 'Five pieces that make the explanation possible'),
    [ L('La escena de apertura pone al lector dentro del suceso con un detalle concreto y comprobable. El antecedente retrocede a lo que venía ocurriendo antes, para que el suceso deje de parecer casual. El contraste de fuentes coloca juntas dos versiones que no coinciden y deja el desacuerdo a la vista en lugar de esconderlo.',
         'The opening scene puts the reader inside the event with a concrete, checkable detail. The background steps back to what had been happening before, so the event stops looking accidental. The contrast of sources places two versions that do not match side by side and leaves the disagreement in plain sight instead of hiding it.'),
      L('El cotejo documental trae un registro hecho en el momento de los hechos y lo compara con lo que las personas recuerdan. El cierre interpretativo reúne todo lo anterior y dice qué significa, sin añadir información nueva. Ninguna de estas piezas opina: todas trabajan con lo que el reportaje pudo reunir.',
         'The documentary check brings a record made at the time of the events and compares it with what people remember. The interpretive closing gathers everything above and says what it means, without adding new information. None of these pieces gives an opinion: all of them work with what the report was able to gather.') ]
  );
  buildDeviceMatch();
  addProblem(C.qs.p4);
  addProblem(C.qs.p5);

  section(
    L('La frontera de la voz', 'The border of the voice'),
    L('Quién responde por cada afirmación', 'Who answers for each claim'),
    [ L('Un texto de interpretación mezcla materiales de origen distinto, y el lector tiene derecho a saber de dónde salió cada uno. Para eso existen las marcas de atribución: según, de acuerdo con, confirmó, refirió, sostuvo. Cada una traza una frontera y deja la afirmación en manos de quien la hizo.',
         'An interpretive text mixes materials of different origin, and the reader has the right to know where each one came from. That is what attribution markers are for: según, de acuerdo con, confirmó, refirió, sostuvo. Each one draws a border and leaves the claim in the hands of whoever made it.'),
      L('Lo que va sin marca queda a nombre del texto, y eso obliga a haberlo verificado antes. Cuando un reportaje suprime las atribuciones no se vuelve más claro: se vuelve responsable de afirmaciones que nunca comprobó. Revisar un texto propio consiste, en buena medida, en preguntarse frase por frase quién responde por ella.',
         'Whatever goes unmarked stands in the name of the text, and that requires having verified it beforehand. When a report drops its attributions it does not become clearer: it becomes responsible for claims it never checked. Revising your own text consists, to a large extent, of asking sentence by sentence who answers for it.') ]
  );
  buildMarkAttribution();
  addProblem(C.qs.p6);

  section(
    L('Interpretar sin inventar', 'Interpreting without inventing'),
    L('El puente entre un dato y una voz', 'The bridge between a fact and a voice'),
    [ L('La interpretación aparece cuando el texto relaciona dos materiales y muestra algo que ninguno decía por separado: un dato de archivo y un testimonio, un antecedente y una consecuencia. Ese puente es el trabajo propio de quien escribe, y también el punto donde es más fácil equivocarse.',
         'Interpretation appears when the text relates two materials and shows something neither said on its own: an archive fact and a testimony, a piece of background and a consequence. That bridge is the work proper to the writer, and also the point where it is easiest to go wrong.'),
      L('Hay tres maneras de fallar. Repetir el dato con otras palabras no explica nada. Ir más allá de lo que las fuentes sostienen, atribuyendo intenciones o causas que nadie documentó, convierte la explicación en invento. Y decir qué preferiría quien escribe cambia de género: eso ya es opinión. Un buen puente se sostiene cuando el lector puede seguirlo hasta los materiales que lo apoyan.',
         'There are three ways to fail. Repeating the fact in other words explains nothing. Going beyond what the sources support, attributing intentions or causes nobody documented, turns the explanation into invention. And saying what the writer would prefer switches genre: that is already opinion. A good bridge holds when the reader can follow it back to the materials that support it.') ]
  );
  buildBridge();
  addProblem(C.qs.p7);

  section(
    L('Antes de escribir', 'Before writing'),
    L('Dónde vive la memoria de un lugar', 'Where the memory of a place lives'),
    [ L('La memoria de una comunidad no está guardada en un solo sitio. Los libros de registro, las actas y las bitácoras conservan fechas anotadas mientras los hechos ocurrían. Las fotografías familiares conservan cómo se veían los lugares antes de cambiar. Y las personas conservan lo que ningún papel registró: qué se hacía, qué se sentía y con qué otro suceso se relaciona cada fecha.',
         'The memory of a community is not kept in a single place. Register books, official records and logs keep dates written down while the events were happening. Family photographs keep how places looked before they changed. And people keep what no paper recorded: what was done, what was felt and which other event each date is connected to.'),
      L('Cada afirmación pide su propia fuente, y el error más común no es inventar, sino pedirle a una fuente algo que no puede dar. Un recuerdo no fija una fecha, y un acta no cuenta cómo se vivía una calle. Elegir mal debilita el texto aunque lo afirmado sea cierto.',
         'Every claim asks for its own source, and the most common mistake is not inventing but asking a source for something it cannot give. A recollection does not fix a date, and an official record does not tell what life on a street was like. Choosing badly weakens the text even when the claim is true.') ]
  );
  buildSources();
  addProblem(C.qs.p8);

  section(
    L('La memoria colectiva', 'Collective memory'),
    L('Para qué sirve dejar el suceso por escrito', 'What putting the event in writing is for'),
    [ L('Cuando un suceso se cuenta con sus antecedentes, sus voces y sus documentos, deja de pertenecer solo a quienes estuvieron ahí. Otros podrán revisarlo, discutirlo y corregirlo, porque tienen enfrente los mismos materiales. A eso llamamos memoria colectiva: no un recuerdo que todos comparten igual, sino un conjunto de versiones y registros que la comunidad puede volver a consultar.',
         'When an event is told with its background, its voices and its documents, it stops belonging only to those who were there. Others will be able to review it, discuss it and correct it, because they have the same materials in front of them. That is what we call collective memory: not a recollection everyone shares alike, but a set of versions and records the community can consult again.'),
      L('Un texto de interpretación es una de las pocas formas en que una comunidad guarda a la vez el dato y la manera en que lo vivió. Sin él, el pasado queda repartido entre archivos que nadie relaciona y recuerdos que nadie coteja. Con él, un desacuerdo entre dos vecinos se vuelve una pregunta que cualquiera puede seguir investigando.',
         'An interpretive text is one of the few ways a community keeps at once the fact and the way it was lived. Without it, the past stays scattered between archives nobody relates and recollections nobody checks. With it, a disagreement between two neighbours becomes a question anyone can keep investigating.') ]
  );
  buildReflect();

  addProblem(q9);
  addProblem(q10);
}
</script>

  var moduleTitle = 'El Periodismo de Interpretación y la Memoria Colectiva';

    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;

  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});

})();
