<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recursos Literarios en Cartas y Biografías</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; text-align:justify; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--gold-bg); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Recursos Literarios en Cartas y Biografías</div>
    <div class="wcourse" id="wcourse-el">Español · 1° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Recursos Literarios en Cartas y Biografías</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="sbtn" id="dlBtn" onclick="generatePDF()" style="max-width:280px;margin:0 auto;">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   CENTRALIZED SCHOOL CONFIG (Rule 16) — ships UNBRANDED (Rule 11).
   The ONLY rebranding point. build_all.py substitutes these exact fields
   (BRAND_FIELDS / RGB_FIELDS / logo*) downstream; :root/dark stay as fallback.
   Neutral defaults below == the static :root/dark values, so unbranded == no-op.
   ══════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:'#0c246c', primaryDark:'#07184c', primaryBg:'#e6eaf7',
  accent:'#8484b4', accentBg:'#e9e9f1',
  darkPrimary:'#385ed1', darkPrimaryDark:'#6a8bf0', darkPrimaryBg:'#08153e',

/* ── Drawing palette, derived from the school's colours (Rule 16) ─────────
   slots 1-2 : school primary + accent
   slots 3-4 : the two of black/red/blue/green least similar to the school colours
   Falls back to neutral defaults if SCHOOL colours can't be parsed.
   ───────────────────────────────────────────────────────────────────── */
var DRAW_PALETTE = (function () {
  function hex2rgb(h) {
    h = String(h).replace('#', '');
    if (h.length === 3) { h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2]; }
    return [parseInt(h.substr(0,2),16), parseInt(h.substr(2,2),16), parseInt(h.substr(4,2),16)];
  }
  function dist(a, b) {
    var dr = a[0]-b[0], dg = a[1]-b[1], db = a[2]-b[2];
    return Math.sqrt(2*dr*dr + 4*dg*dg + 3*db*db);
  }
  var COMMON = ['#1a1a16', '#c0392b', '#1d4e89', '#1a7a3a'];  /* black, red, blue, green */
  var schoolRGB;
  try {
    schoolRGB = [hex2rgb(SCHOOL.primary), hex2rgb(SCHOOL.accent)];
  } catch (e) {
    return [SCHOOL.primary, SCHOOL.accent, '#1a1a16', '#1d4e89'];
  }
  var scored = COMMON.map(function (c, idx) {
    var rgb = hex2rgb(c);
    var nearest = Math.min(dist(rgb, schoolRGB[0]), dist(rgb, schoolRGB[1]));
    return { c: c, idx: idx, d: nearest };
  });
  scored.sort(function (a, b) { return b.d - a.d; });      /* farthest first */
  var keep = scored.slice(0, 2);
  keep.sort(function (a, b) { return a.idx - b.idx; });    /* restore visual order */
  return [SCHOOL.primary, SCHOOL.accent, keep[0].c, keep[1].c];
})();
function drawDotsHTML() {
  return DRAW_PALETTE.map(function (c, i) {
    return '<div class="cdot' + (i === 0 ? ' sel' : '') + '" data-color="' + c +
           '" style="background:' + c + '"></div>';
  }).join('');
}

/* ── Attempt counter + seed (Rule 4): seed = name+group+attempt ── */
function getAttemptKey(name, group){ return 'esp1_t05_g01__att__' + (name+'__'+group).replace(/\s+/g,'_'); }
function nextAttempt(name, group){ var k=getAttemptKey(name,group),n=0; try{n=parseInt(localStorage.getItem(k)||'0',10)||0;}catch(e){} n++; try{localStorage.setItem(k,String(n));}catch(e){} return n; }
function currentAttempt(name, group){ var k=getAttemptKey(name,group); try{return parseInt(localStorage.getItem(k)||'1',10)||1;}catch(e){return 1;} }
/* ================================================

var studentData   = {};
var problems      = [];

/* ================================================
   SESSION PERSISTENCE  (localStorage)
   ================================================ */
function lsKey() {
  var n = (studentData.name  || '').trim();
  var g = (studentData.group || '').trim();
  return 'esp1_t05_g01__' + (n + '__' + g).replace(/\s+/g, '_');
}

function saveSession() {
  if (!studentData.name) return;
  var drawings = [], texts = [], photos = [];
  problems.forEach(function(p, i) {
    var dc = document.getElementById('dc' + i);
    if (dc && dc.width) {
      var blank = document.createElement('canvas');
      blank.width = dc.width; blank.height = dc.height;
      drawings.push(dc.toDataURL() === blank.toDataURL() ? null : dc.toDataURL('image/png'));
    } else { drawings.push(null); }
    var ta = document.getElementById('ta' + i);
    texts.push(ta ? ta.value : '');
    var pp = document.getElementById('pp' + i);
    photos.push((pp && pp.src && pp.src.indexOf('data:') === 0) ? pp.src : null);
  });
  var state = {
    name: studentData.name, group: studentData.group,
    answeredCount: answeredCount, correctCount: correctCount,
    choices: problems.map(function(p) { return p.studentChoice; }),
    drawings: drawings, texts: texts, photos: photos
  };
  try { localStorage.setItem(lsKey(), JSON.stringify(state)); } catch(e) {}
}

function loadSession(name, group) {
  var key = 'esp1_t05_g01__' + (name + '__' + group).replace(/\s+/g, '_');
  try { var r = localStorage.getItem(key); return r ? JSON.parse(r) : null; } catch(e) { return null; }
}

function restoreSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  var saved = loadSession(name, group);
  if (!saved) return;
  document.getElementById('restoreBar').style.display = 'none';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = currentAttempt(name, group);
  buildLesson(seededRng(name + group + att));
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
  saved.choices.forEach(function(choice, idx) {
    if (choice !== null && choice !== undefined) confirmMC(idx, choice);
  });
  setTimeout(function() {
    if (saved.drawings) {
      saved.drawings.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var dc = document.getElementById('dc' + i);
        if (!dc || !dc.width) return;
        var img = new Image();
        img.onload = function() {
          var dpr = window.devicePixelRatio || 1;
          dc.getContext('2d').drawImage(img, 0, 0, dc.width / dpr, dc.height / dpr);
        };
        img.src = dataUrl;
      });
    }
    if (saved.texts) {
      saved.texts.forEach(function(text, i) {
        if (!text) return;
        var ta = document.getElementById('ta' + i);
        if (ta) ta.value = text;
      });
    }
    if (saved.photos) {
      saved.photos.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var pp = document.getElementById('pp' + i);
        if (!pp) return;
        pp.src = dataUrl; pp.style.display = 'block';
        var pz = document.getElementById('pz' + i);
        if (pz) pz.style.opacity = '0.4';
      });
    }
  }, 300);
}

function dismissRestore() {
  document.getElementById('restoreBar').style.display = 'none';
}

function checkForSavedSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  if (!name || !group) { document.getElementById('restoreBar').style.display = 'none'; return; }

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = DRAW_PALETTE[0];   // matches the first (selected) dot = SCHOOL.primary
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS — INJECTION BLOCK ─────────────────────────────────────────
  //   Match these RGB values to --green and --gold above.
  //   PRIMARY  → pBR, pBG, pBB

      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/\u2192/g,'->').replace(/\u2212/g,'-').replace(/\u00b2/g,'^2')
      .replace(/\u00b3/g,'^3').replace(/\u00d7/g,'x').replace(/\u00f7/g,'/')
      .replace(/\u2260/g,'!=').replace(/\u2264/g,'<=').replace(/\u2265/g,'>=')
      .replace(/\u221a/g,'sqrt').replace(/\u03c0/g,'pi').replace(/\u2026/g,'...')

    doc.setTextColor(255,255,255); doc.setFontSize(9); doc.setFont('helvetica','bold');
    doc.text(isOk?'✓':'✗', M+5.2, wy+10.5);
    var ay = wy+7;
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','bold');
    chLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5.5); });
    ay += chLines.length*5.5 + 3;
    doc.setTextColor(26,106,74); doc.setFontSize(8); doc.setFont('helvetica','normal');
    coLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    ay += coLines.length*5 + 3;

    exLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    wy += ansBoxH + 5;

    doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
    doc.setFontSize(7); doc.setFont('helvetica','bold');
    doc.rect(M,wy,TW,8,'F'); doc.text('TRABAJO DEL ALUMNO', M+4, wy+5.5);
    wy += 11;

    var dc = document.getElementById('dc'+i);
    if (dc) {
      try {
        var imgD = dc.toDataURL('image/png');
        var ar   = dc.height / dc.width;
        var iw   = TW;
        var ih   = Math.min(iw * ar, 68);
        doc.addImage(imgD, 'PNG', M, wy, iw, ih);
        wy += ih + 4;
      } catch(e) {}
    }

    var ta = document.getElementById('ta'+i);
    if (ta && ta.value.trim()) {
      if (wy > PH-30) { doc.addPage(); wy = 20; }
      doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('courier','normal');
      var taLines = doc.splitTextToSize(ta.value, TW);
      taLines.slice(0,16).forEach(function(ln) {
        if (wy > PH-15) { doc.addPage(); wy = 20; }
        doc.text(ln, M, wy); wy += 5;
      });
      wy += 2;
    }

    var pp = document.getElementById('pp'+i);
    if (pp && pp.src && pp.src.indexOf('data:') === 0) {
      if (wy > PH-55) { doc.addPage(); wy = 20; }
      try { doc.addImage(pp.src, 'JPEG', M, wy, TW, 68); wy += 72; } catch(e) {}
    }
  }

  // ── Footer on every page ──
  var pages = doc.internal.getNumberOfPages();
  for (var p = 1; p <= pages; p++) {
    doc.setPage(p);
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0, PH-3, PW, 3, 'F');
    doc.setTextColor(130,140,160); doc.setFontSize(6.5); doc.setFont('helvetica','normal');
    doc.text(name+'  ·  '+group+'  ·  Código: '+code+'  ·  Página '+p+'/'+pages,
      PW/2, PH-5, {align:'center'});
  }

  // ── SAVE / SHARE — iOS-safe download (LIAXA iOS PDF fix, Rule 12) ─────────
  //   iOS Safari ignores the <a download> attribute (and doc.save() relies on
  //   it), so on iPhone/iPad a plain download fails silently. We branch:
  //     • iOS  → native share sheet (→ "Save to Files"); if unavailable, open
  //              the PDF inline so the student can tap Safari's own Share.
  //     • else → <a download> click (works on desktop + Android).
  //   The whole function runs synchronously off the tap (no await above), which
  //   is what lets iOS accept navigator.share(). Do NOT add an await before this.
  // ──────────────────────────────────────────────────────────────────────────
  var _fname   = 'esp1_t05_g01_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf';
  var _pdfBlob = doc.output('blob');

  function _restorePdfBtn(){ btn.innerHTML = '⬇ &nbsp;' + t('btn-pdf'); btn.disabled = false; }
  function _openPdfInline(b){
    var u = URL.createObjectURL(b);
    var w = window.open(u, '_blank');
    if (!w) { window.location.href = u; }   // popup blocked → same tab
    setTimeout(function(){ URL.revokeObjectURL(u); }, 60000);
  }

  // iPadOS 13+ reports as "MacIntel" with a touch screen, so test for that too.
  var _isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
               (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  if (_isIOS) {
    var _pdfFile = new File([_pdfBlob], _fname, { type:'application/pdf' });
    if (navigator.canShare && navigator.canShare({ files:[_pdfFile] })) {
      navigator.share({ files:[_pdfFile], title:_fname })
        .then(_restorePdfBtn)
        .catch(function(e){
          if (e && e.name === 'AbortError') { _restorePdfBtn(); return; } // cancelled
          _openPdfInline(_pdfBlob); _restorePdfBtn();
        });
      return;
    }
    _openPdfInline(_pdfBlob); _restorePdfBtn();   // older iOS: open inline
    return;
  }

  // Desktop + Android: the native download works.
  var _dlUrl = URL.createObjectURL(_pdfBlob);
  var _dlA   = document.createElement('a');
  _dlA.href  = _dlUrl; _dlA.download = _fname;
  document.body.appendChild(_dlA); _dlA.click();
  setTimeout(function(){ document.body.removeChild(_dlA); URL.revokeObjectURL(_dlUrl); }, 200);
  _restorePdfBtn();
}

  var C = CORPUS[Math.floor(rng() * CORPUS.length)];

  /* ───────── indexado y render de los textos ───────── */
  function indexText(tx) {
    tx.figs = [];
    tx.paras.forEach(function (p) {
      p.forEach(function (ch) {
        if (ch.r) { ch.k = tx.figs.length; tx.figs.push(ch); }
      });
    });
  }
  indexText(C.carta);
  indexText(C.bio);

  function textHTML(tx, mode, marks) {
    return tx.paras.map(function (p) {
      return '<span class="dpara">' + p.map(function (ch) {
        var txt = L(ch);
        if (!ch.r) return txt;
        if (mode === 'hunt') {
          return '<span class="xchip' + ((marks && marks[ch.k]) ? marks[ch.k] : '') + '" onclick="czTap(' + ch.k + ')">' + txt + '</span>';
        }
        return '<span class="xmark">' + txt + '</span>';
      }).join('') + '</span>';
    }).join('');
  }
  function textBlock(tx, label) {
    return '<div class="dtext"><div class="dtitle">' + label + ' · ' + L(tx.title) + ' · ' + L(tx.meta) + '</div>' +
           textHTML(tx, 'plain', null) + '</div>';
  }
  function figOf(tx, key) {
    var i;
    for (i = 0; i < tx.figs.length; i++) { if (tx.figs[i].r === key) return tx.figs[i]; }
    return tx.figs[0];
  }
  function otherFigs(tx, key, n) {
    var all = shuffle(tx.figs, rng), out = [], i;
    for (i = 0; i < all.length && out.length < n; i++) { if (all[i].r !== key) out.push(all[i]); }
    return out;
  }
  function otherNames(key, n) {
    var ks = shuffle(RKEYS, rng), out = [], i;
    for (i = 0; i < ks.length && out.length < n; i++) { if (ks[i] !== key) out.push(RECURSOS[ks[i]].n); }
    return out;
  }

  /* ═════════ WIDGET 1 · caza de recursos en la carta ═════════ */
  function widgetCaza() {
    var order = shuffle(C.carta.figs, rng).slice(0, 3);
    var st = { r:0, tries:0, marks:{}, done:false };
    var w = widgetBox('wCaza', 'hunt');

    function paint(fb) {
      if (st.done) {
        w.innerHTML = '<div class="iw-tag">' + T('Caza de recursos', 'Device hunt') + '</div>' +
          '<div class="iw-sub">' + T('Recorriste las tres marcas de esta ronda dentro de la carta.',
                                     'You worked through the three marks of this round inside the letter.') + '</div>' +
          '<div class="iw-fb">' + (fb || '') + '</div>';
        return;
      }
      var tp = RECURSOS[order[st.r].r];
      w.innerHTML =
        '<div class="iw-tag">' + T('Caza de recursos', 'Device hunt') + '</div>' +
        '<div class="iw-sub">' + T('En la carta hay cinco fragmentos subrayados. Toca aquel en el que el texto ',
                                   'The letter has five underlined fragments. Tap the one where the text ') + L(tp.d) + '.</div>' +
        '<div class="iw-prog">' + (st.r + 1) + ' / ' + order.length + '</div>' +
        '<div class="dtext"><div class="dtitle">' + L(C.carta.title) + '</div>' + textHTML(C.carta, 'hunt', st.marks) + '</div>' +
        '<div class="iw-fb" id="czFb">' + (fb || '') + '</div>';
    }
    function advance(fb) {
      st.r++; st.tries = 0; st.marks = {};
      if (st.r >= order.length) st.done = true;
      if (st.done) { paint(''); return; }
      st.locked = true;
      var _fe = document.getElementById('clFb');
      if (_fe) _fe.innerHTML = (fb || '') + '<br><button onclick="clSig()" style="margin-top:.6rem;background:var(--green);color:#fff;border:none;border-radius:8px;padding:.45rem 1.2rem;font-size:.84rem;font-weight:600;cursor:pointer;min-height:44px;font-family:inherit">' + (LANG==='es' ? 'Siguiente →' : 'Next →') + '</button>';
      var _bs = wrap.querySelectorAll('.binbtn');
      if (_bs) _bs.forEach(function(b){ b.style.opacity='0.35'; b.style.pointerEvents='none'; });
    }
    window.czTap = function (k) {
      if (st.done) return;
      var want = order[st.r], got = C.carta.figs[k];
      if (k === want.k) {
        st.marks[k] = ' hit';
        advance('<span class="iw-ok">' + Q(want) + ': ' + L(want.eff) + '</span>');
        return;
      }
      st.tries++;
      if (st.tries >= 3) {
        st.marks[want.k] = ' rev';
        advance(T('El fragmento que buscabas era ', 'The fragment you were after was ') + Q(want) + ': ' + L(want.eff));
        return;
      }
      st.marks[k] = ' miss';
      paint(T('Ese fragmento ', 'That fragment ') + L(RECURSOS[got.r].d) +
            T('. Busca el que ', '. Look for the one that ') + L(RECURSOS[want.r].d) + '.');
      st.marks[k] = '';
    };
    paint('');
  }

  /* ═════════ WIDGET 2 · clasificador de recursos ═════════ */
  function widgetClasifica() {
    var items = shuffle(C.carta.figs.concat(C.bio.figs), rng).slice(0, 6);
    var st = { i:0, tries:0, hits:0, done:false };
    var w = widgetBox('wClasifica', 'classify');

    function paint(fb) {
      if (st.done) {
        w.innerHTML = '<div class="iw-tag">' + T('Clasificador de recursos', 'Device sorter') + '</div>' +
          '<div class="iw-sub">' + T('Clasificaste las seis fichas de esta ronda.', 'You sorted the six cards of this round.') + '</div>' +
          '<div class="iw-fb"><span class="iw-ok">' + st.hits + ' / ' + items.length +
          T(' a la primera.', ' on the first try.') + '</span></div>';
        return;
      }
      w.innerHTML =
        '<div class="iw-tag">' + T('Clasificador de recursos', 'Device sorter') + '</div>' +
        '<div class="iw-sub">' + T('Cada ficha es un fragmento de los dos textos. Decide con qué recurso está construido.',
                                   'Each card is a fragment from the two texts. Decide which device it is built with.') + '</div>' +
        '<div class="iw-prog">' + (st.i + 1) + ' / ' + items.length + '</div>' +
        '<div class="clscard">' + Q(items[st.i]) + '</div>' +
        '<div class="binrow">' + RKEYS.map(function (k, bi) {
          return '<button class="binbtn" onclick="clPick(' + bi + ')">' + L(RECURSOS[k].n) + '</button>';
        }).join('') + '</div>' +
        '<div class="iw-fb" id="clFb">' + (fb || '') + '</div>';
    }
    window.clPick = function (bi) {
      if (st.done || st.locked) return;
      if (st.done) return;
      var it = items[st.i], key = RKEYS[bi];
      if (key === it.r) {
        if (st.tries === 0) st.hits++;
        st.tries = 0; st.i++;
        if (st.i >= items.length) { st.done = true; paint(''); return; }
        paint('<span class="iw-ok">' + T('Correcto: ahí el texto ', 'Correct: there the text ') + L(RECURSOS[it.r].d) + '.</span>');
        return;
      }
      st.tries++;
      if (st.tries >= 3) {
        var sol = T('Era ', 'It was ') + L(RECURSOS[it.r].n).toLowerCase() + T(': ', ': ') + L(it.eff);
        st.tries = 0; st.i++;
        if (st.i >= items.length) { st.done = true; paint(''); return; }
        paint(sol);
        return;
      }
      document.getElementById('clFb').textContent =
        T('Todavía no. La ', 'Not yet. A ') + L(RECURSOS[key].n).toLowerCase() +
        T(' ', ' ') + L(RECURSOS[key].d) + T(', y esta ficha hace otra cosa. Vuelve a leerla.',
                                             ', and this card does something else. Read it again.');
    };

    window.clSig = function(){
      st.locked = false;
      (typeof paint !== 'undefined' ? paint : render)('');
    };
    paint('');
  }

  /* ═════════ WIDGET 3 · del fragmento al efecto ═════════ */
  function widgetEfecto() {
    var use = shuffle(C.carta.figs, rng).slice(0, 2).concat(shuffle(C.bio.figs, rng).slice(0, 2));
    var lo = perm(use.length), ro = perm(use.length);
    while (ro.every(function (v, k) { return v === lo[k]; })) { ro.push(ro.shift()); }
    var st = { sel:null, done:{}, tries:0, over:false };
    var w = widgetBox('wEfecto', 'match');

    function paint(fb) {
      var left = lo.map(function (i) {
        var cls = 'mtchip' + (st.done[i] ? ' done' : (st.sel === i ? ' sel' : ''));
        return '<button class="' + cls + '" onclick="efLeft(' + i + ')">' + Q(use[i]) + '</button>';
      }).join('');
      var right = ro.map(function (i) {
        return '<button class="mtchip' + (st.done[i] ? ' done' : '') + '" onclick="efRight(' + i + ')">' + L(use[i].eff) + '</button>';
      }).join('');
      w.innerHTML =
        '<div class="iw-tag">' + T('Del fragmento al efecto', 'From the fragment to the effect') + '</div>' +
        '<div class="iw-sub">' + T('Toca un fragmento y después aquello que produce en quien lee. Un recurso no se reconoce solo por su nombre: se reconoce por lo que hace.',
                                   'Tap a fragment and then what it produces in the reader. A device is not recognised by its name alone: it is recognised by what it does.') + '</div>' +
        '<div class="mtcols">' +
          '<div><div class="mthead">' + T('Fragmento', 'Fragment') + '</div>' + left + '</div>' +
          '<div><div class="mthead">' + T('Lo que produce', 'What it produces') + '</div>' + right + '</div>' +
        '</div>' +
        '<div class="iw-fb" id="efFb">' + (fb || '') + '</div>';
    }
    function allDone() {
      var i;
      for (i = 0; i < use.length; i++) { if (!st.done[i]) return false; }
      return true;
    }
    window.efLeft = function (i) {
      if (st.over || st.done[i]) return;
      st.sel = (st.sel === i) ? null : i;
      paint('');
    };
    window.efRight = function (i) {
      if (st.over || st.done[i]) return;
      if (st.sel === null) { paint(T('Elige primero un fragmento de la columna izquierda.', 'Choose a fragment from the left column first.')); return; }
      if (st.sel === i) {
        st.done[i] = true; st.sel = null; st.tries = 0;
        if (allDone()) {
          st.over = true;
          paint('<span class="iw-ok">' + T('Las cuatro parejas quedaron completas: cada recurso deja una huella distinta en quien lee.',
                                           'All four pairs are complete: each device leaves a different trace on the reader.') + '</span>');
          return;
        }
        paint('<span class="iw-ok">' + T('Pareja correcta. Ahí el texto ', 'Correct pair. There the text ') + L(RECURSOS[use[i].r].d) + '.</span>');
        return;
      }
      st.tries++;
      if (st.tries >= 3) {
        var k;
        for (k = 0; k < use.length; k++) { st.done[k] = true; }
        st.over = true; st.sel = null;
        paint(T('Estas son las parejas correctas. Fíjate en que el efecto siempre dice, con otras palabras, lo que hace el fragmento.',
                'These are the correct pairs. Notice how the effect always says, in other words, what the fragment does.'));
        return;
      }
      var mine = st.sel;
      st.sel = null;
      paint(T('Ese efecto pertenece a otro fragmento. El que elegiste ', 'That effect belongs to a different fragment. The one you chose ') +
            L(RECURSOS[use[mine].r].d) + T('; busca el efecto que diga eso mismo.', '; look for the effect that says exactly that.'));
    };
    paint('');
  }

  /* ═════════ WIDGET 5 · línea de vida ═════════ */
  function widgetVida() {
    var st = { order: perm(C.vida.length), sel:null, tries:0, done:false };
    var w = widgetBox('wVida', 'timeline');

    function paint(fb) {
      var chips = st.order.map(function (ei, pos) {
        var cls = 'tchip' + (st.done ? ' lock' : (st.sel === pos ? ' sel' : ''));
        return '<div class="' + cls + '" onclick="vdTap(' + pos + ')"><span class="tnum">' + (pos + 1) + '</span><span>' + L(C.vida[ei]) + '</span></div>';
      }).join('');
      w.innerHTML =
        '<div class="iw-tag">' + T('Línea de vida', 'Life line') + '</div>' +
        '<div class="iw-sub">' + T('Una biografía sigue el orden en que ocurrió la vida que cuenta. Estos momentos están revueltos: acomódalos del primero al último. Toca una tarjeta y luego otra para intercambiarlas.',
                                   'A biography follows the order in which the life it tells actually happened. These moments are scrambled: put them first to last. Tap one card and then another to swap them.') + '</div>' +
        '<div class="tlist">' + chips + '</div>' +
        (st.done ? '' : '<button class="iwbtn" onclick="vdCheck()">' + T('Comprobar', 'Check') + '</button>') +
        '<div class="iw-fb" id="vdFb">' + (fb || '') + '</div>';
    }
    window.vdTap = function (pos) {
      if (st.done) return;
      if (st.sel === null) { st.sel = pos; }
      else if (st.sel === pos) { st.sel = null; }
      else { var t2 = st.order[st.sel]; st.order[st.sel] = st.order[pos]; st.order[pos] = t2; st.sel = null; }
      paint('');
    };
    window.vdCheck = function () {
      if (st.done) return;
      if (st.order.every(function (ei, pos) { return ei === pos; })) {
        st.done = true;
        paint('<span class="iw-ok">' + T('Ese es el orden: cada momento explica el siguiente, y por eso la vida se entiende sin que nadie la resuma.',
                                         'That is the order: each moment explains the next, and that is why the life is understood without anyone summing it up.') + '</span>');
        return;
      }
      st.tries++;
      if (st.tries >= 3) {
        st.order = C.vida.map(function (_, i) { return i; });
        st.done = true;
        paint(T('Este es el orden correcto. Compáralo con el tuyo y fíjate en qué momento hace posible al que viene después.',
                'This is the correct order. Compare it with yours and notice which moment makes the next one possible.'));
        return;
      }
      var bad = 0, i;
      for (i = 0; i < st.order.length; i++) { if (st.order[i] !== i) { bad = i; break; } }
      paint(T('Todavía no. Revisa la tarjeta número ', 'Not yet. Look at card number ') + (bad + 1) +
            T(': ¿pudo ocurrir antes de la que tiene encima?', ': could it have happened before the one above it?'));
    };
    paint('');
  }

  /* ═════════ constructor de tarjetas ═════════ */
  function addP(spec) {
    var shuffled = shuffle(spec.options, rng);
    var p = {
      title: L(spec.title),
      questionText: L(spec.q),
      fn: '',
      hint: L(spec.hint),
      explanation: L(spec.exp),
      options: shuffled.map(function (o) { return L(o); }),
      correctIdx: shuffled.indexOf(spec.correct),
      showWork: !!spec.showWork,
      studentChoice: null,
      pendingChoice: null
    };
    problems.push(p);
    buildOneCard(p, problems.length - 1);

    return {
      title: { es:'De la comparación a la metáfora', en:'From simile to metaphor' },
      q: { es:'En la carta se lee ' + Q(C.trans.base) + '. En el área de trabajo, reescribe esa línea de modo que diga lo mismo sin la palabra «como»: la cosa nombrada tiene que ser la otra, no parecerse a ella. Cuando tengas tu versión escrita, elige la opción que coincide con lo que hiciste.',
           en:'In the letter we read ' + Q(C.trans.base) + '. In the work area, rewrite that line so that it says the same thing without the word “as”: the thing named has to be the other one, not resemble it. Once your version is written down, choose the option that matches what you did.' },
      hint: { es:'Quita el aviso y afirma directamente: en lugar de decir que algo es tan grande, tan largo o tan alto como otra cosa, escribe que es esa otra cosa.',
              en:'Remove the warning and state it directly: instead of saying that something is as big, as long or as tall as another thing, write that it is that other thing.' },
      exp: { es:'La versión correcta afirma sin rodeos que una cosa es la otra: eso es una metáfora. De las demás, una conserva el aviso y sigue siendo comparación, otra cambia el recurso por una exageración y otra devuelve la frase a un dato literal.',
             en:'The correct version states outright that one thing is the other: that is a metaphor. Of the rest, one keeps the warning and stays a simile, another swaps the device for an exaggeration and another returns the sentence to a literal fact.' },
      options: [C.trans.c].concat(C.trans.d),
      correct: C.trans.c,
      showWork: true
    };
  }

  function q8() {
    if (rng() < 0.5) {
      return {
        title: { es:'Por qué es una biografía', en:'Why it is a biography' },
        q: { es:'Los dos textos de esta guía usan recursos literarios y los dos hablan de sentimientos. Determina qué rasgo hace que ' + Q(C.bio.title) + ' sea una biografía y no una carta personal.',
             en:'Both texts in this guide use literary devices and both speak about feelings. Determine which feature makes ' + Q(C.bio.title) + ' a biography and not a personal letter.' },
        hint: { es:'Fíjate en dos cosas: a quién le habla cada texto y en qué orden va contando lo que cuenta.',
                en:'Look at two things: who each text is speaking to, and in what order it tells what it tells.' },
        exp: { es:'Los recursos, las palabras y los sentimientos aparecen en los dos textos. Lo que separa a la biografía es que cuenta la vida de otra persona en el orden en que sucedió y no se dirige a nadie en particular.',
               en:'Devices, words and feelings appear in both texts. What sets the biography apart is that it tells another person’s life in the order it happened and addresses nobody in particular.' },
        options: [GEN.bio.c].concat(GEN.bio.d),
        correct: GEN.bio.c
      };
    }
    return {
      title: { es:'Dos textos, dos maneras', en:'Two texts, two ways' },
      q: { es:'Ya leíste ' + Q(C.carta.title) + ' y ' + Q(C.bio.title) + '. Identifica cuál de estas diferencias separa de verdad a una carta personal de una biografía.',
           en:'You have now read ' + Q(C.carta.title) + ' and ' + Q(C.bio.title) + '. Identify which of these differences really separates a personal letter from a biography.' },
      hint: { es:'Descarta las diferencias que dependen del soporte o del formato y quédate con la que depende de quién habla y de quién se habla.',
              en:'Rule out the differences that depend on the medium or the format and keep the one that depends on who speaks and who is spoken about.' },
      exp: { es:'Ni el papel, ni la publicación, ni el uso de imágenes distinguen a los dos textos: ambos pueden ser reales y ambos admiten recursos. La diferencia está en la persona desde la que se escribe y en el destinatario.',
             en:'Neither the paper, nor the publication, nor the use of images tells the two texts apart: both can be real and both allow devices. The difference lies in the person the text is written from and in the addressee.' },
      options: [GEN.dif.c].concat(GEN.dif.d),
      correct: GEN.dif.c
    };
  }

  function q9() {
    var f = figOf(C.bio, 'repeticion');
    if (rng() < 0.5) {
      return {
        title: { es:'Tres veces el mismo verbo', en:'The same verb three times' },
        q: { es:'En la biografía aparece esta línea: ' + Q(f) + '. Determina qué consigue quien escribe al repetir así el mismo verbo.',
             en:'This line appears in the biography: ' + Q(f) + '. Determine what the writer achieves by repeating the same verb in that way.' },
        hint: { es:'Léela en voz alta y después léela otra vez con el verbo dicho una sola vez. Compara lo que oyes en cada caso.',
                en:'Read it out loud and then read it again with the verb said only once. Compare what you hear in each case.' },
        exp: { es:'Al volver el verbo una y otra vez, la línea deja de contar un episodio suelto y hace oír una costumbre sostenida en el tiempo: ' + L(f.eff) + '.',
               en:'By bringing the verb back again and again, the line stops telling a single episode and makes a habit sustained over time audible: ' + L(f.eff) + '.' },
        options: [GEN.repet.c].concat(GEN.repet.d),
        correct: GEN.repet.c
      };
    }
    var op = [qo(f)].concat(otherFigs(C.bio, 'repeticion', 3).map(qo));
    return {
      title: { es:'La insistencia que se oye', en:'The insistence you can hear' },
      q: { es:'Estos cuatro fragmentos pertenecen a la biografía ' + Q(C.bio.title) + '. Identifica en cuál el texto vuelve a decir la misma estructura varias veces seguidas.',
           en:'These four fragments belong to the biography ' + Q(C.bio.title) + '. Identify the one in which the text says the same structure over again several times in a row.' },
      hint: { es:'No busques el fragmento más largo, sino aquel en el que una misma palabra o un mismo arranque de frase regresa dentro de la misma línea.',
              en:'Do not look for the longest fragment, but for the one in which the same word or the same sentence opening comes back inside the same line.' },
      exp: { es:'Solo un fragmento repite la misma estructura dentro de la línea, y esa insistencia se oye al leerla: ' + L(f.eff) + '. Los otros tres construyen su imagen con recursos distintos.',
             en:'Only one fragment repeats the same structure inside the line, and that insistence is heard as you read it: ' + L(f.eff) + '. The other three build their image with different devices.' },
      options: op,
      correct: op[0]
    };
  }

  function q10() {
    if (rng() < 0.5) {
      return {
        title: { es:'Decirlo sin decirlo', en:'Saying it without saying it' },
        q: { es:'Vas a escribirle una carta a alguien que se fue de tu ciudad y quieres darle a entender que lo extrañas, sin escribir «te extraño». Identifica cuál de estas líneas lo consigue con un recurso literario.',
             en:'You are going to write a letter to someone who left your city and you want to get across that you miss them, without writing “I miss you”. Identify which of these lines achieves that with a literary device.' },
        hint: { es:'La línea que buscas tiene que cumplir dos condiciones a la vez: llevar un recurso y hablar de esa ausencia. Comprueba las dos en cada opción.',
                en:'The line you want has to meet two conditions at once: carry a device and speak about that absence. Check both in every option.' },
        exp: { es:'Una opción dice el sentimiento tal cual, otra da una cuenta exacta de días y otra lleva una comparación que no habla de la ausencia. La correcta cumple las dos condiciones: usa una comparación y deja ver la falta que hace esa persona.',
               en:'One option says the feeling outright, another gives an exact count of days and another carries a simile that says nothing about the absence. The correct one meets both conditions: it uses a simile and lets the person’s absence be seen.' },
        options: [GEN.sin.c].concat(GEN.sin.d),
        correct: GEN.sin.c
      };
    }
    return {
      title: { es:'El plan de tu biografía', en:'The plan for your biography' },
      q: { es:'Vas a escribir la biografía de alguien de tu familia y quieres que quien la lea sienta lo que esa persona vivió. Determina qué plan de trabajo lo consigue.',
           en:'You are going to write the biography of someone in your family and you want the reader to feel what that person lived through. Determine which work plan achieves that.' },
        hint: { es:'Recuerda lo que hacía la biografía que leíste: mantenía el orden de la vida y se detenía en unos pocos momentos para mostrarlos con imágenes.',
                en:'Remember what the biography you read was doing: it kept the order of the life and stopped at a few moments to show them with images.' },
      exp: { es:'Una lista de fechas informa pero no deja sentir nada; exagerarlo todo hace que ya nada se crea; y escribirla como si fuera una carta suya deja de ser una biografía. El plan correcto conserva el orden de la vida y elige unos pocos momentos para mostrarlos con imágenes.',
             en:'A list of dates informs but lets nothing be felt; exaggerating everything means nothing is believed any more; and writing it as if it were a letter from that person stops being a biography. The correct plan keeps the order of the life and picks a few moments to show them with images.' },
      options: [GEN.plan.c].concat(GEN.plan.d),
      correct: GEN.plan.c
    };
  }

  /* ═════════ LA LECCIÓN: concepto, manipulativo, problema ═════════ */

  sec(T('Punto de partida', 'Starting point'),
      T('Palabras que se sienten', 'Words you can feel'),
      '<p>' + T('Cuando le escribes a alguien que quieres, casi nunca basta con poner «te extraño» o «estoy contento». Esas palabras nombran el sentimiento, pero no lo hacen sentir. Los recursos literarios son maneras de usar el lenguaje para que quien lee no solo entienda lo que sientes, sino que lo vea, lo oiga o lo toque. No son adornos ni palabras difíciles: son decisiones. Puedes comparar una cosa con otra, llamarla directamente por el nombre de otra, prestarle acciones de persona a algo que no lo es, exagerar a propósito o repetir una palabra hasta que se oiga la insistencia. Estos recursos no viven solo en los poemas: aparecen en las cartas que se escriben de verdad y también en las biografías, esos textos que cuentan la vida de una persona. Aquí vas a leer dos textos: una carta personal y un fragmento de biografía. Los fragmentos marcados con línea punteada son los que vas a trabajar en toda la guía.',
                'When you write to someone you love, it is almost never enough to put “I miss you” or “I am happy”. Those words name the feeling, but they do not make it felt. Literary devices are ways of using language so that the reader does not merely understand what you feel, but sees it, hears it or touches it. They are not ornaments or hard words: they are decisions. You can compare one thing with another, call it directly by the name of another, lend person-like actions to something that is not a person, exaggerate on purpose or repeat a word until the insistence can be heard. These devices do not live in poems alone: they show up in letters people really write and also in biographies, the texts that tell a person’s life. Here you are going to read two texts: a personal letter and an excerpt from a biography. The fragments marked with a dotted line are the ones you will work with all through this guide.') + '</p>' +
      textBlock(C.carta, T('Texto I', 'Text I')) +
      textBlock(C.bio,   T('Texto II', 'Text II')) +
      '<div class="callout"><p><strong>' + T('Al leer:', 'While reading:') + '</strong> ' +
        T('pregúntate qué ves, qué oyes y qué sientes gracias a cada fragmento marcado.',
          'ask yourself what you see, what you hear and what you feel thanks to each marked fragment.') + '</p></div>');
  widgetCaza();
  addP(q1());
  addP(q2());

  sec(T('Comparar y nombrar', 'Comparing and naming'),
      T('La comparación y la metáfora', 'The simile and the metaphor'),
      '<p>' + T('La comparación pone dos cosas lado a lado y avisa que son dos: usa «como», «parece», «igual que» o «tan… como». Su trabajo es explicar algo que quien lee no conoce por medio de algo que sí conoce. La metáfora da un paso más y quita el aviso: llama a una cosa directamente con el nombre de la otra. Por eso suena más rotunda, porque no dice que algo se parece, dice que es. Las dos hacen lo mismo en el fondo, unir dos mundos, pero no pesan igual. Convertir una en otra, quitando o poniendo la palabra que avisa, es el mejor ejercicio para entenderlas.',
                'The simile puts two things side by side and warns that they are two: it uses “like”, “looks like”, “just as” or “as… as”. Its job is to explain something the reader does not know by means of something they do. The metaphor goes one step further and drops the warning: it calls one thing directly by the name of the other. That is why it sounds more absolute, because it does not say that something resembles, it says that it is. Deep down both do the same, joining two worlds, but they do not weigh the same. Turning one into the other, removing or adding the word that warns, is the best exercise for understanding them.') + '</p>' +
      '<div class="glosslist">' +
        '<div class="gloss"><div class="glossn">' + L(RECURSOS.comparacion.n) + '</div><div class="glossd">' + L(RECURSOS.comparacion.d) + '</div></div>' +
        '<div class="gloss"><div class="glossn">' + L(RECURSOS.metafora.n)    + '</div><div class="glossd">' + L(RECURSOS.metafora.d)    + '</div></div>' +
      '</div>');
  widgetClasifica();
  addP(q3());
  addP(q4());

  sec(T('Dar vida y tamaño', 'Giving life and size'),
      T('Personificación, hipérbole y repetición', 'Personification, hyperbole and repetition'),
      '<p>' + T('La personificación le presta acciones o sentimientos de persona a algo que no lo es: una puerta que se resiste, un reloj que corre, la lluvia que golpea con enojo. Al hacerlo, el mundo alrededor deja de ser decorado y empieza a tener carácter. La hipérbole exagera a propósito, y quien lee lo sabe: nadie cuenta las veces ni revisa la cifra, porque lo que se está midiendo no es una cantidad sino el tamaño de un sentimiento. La repetición vuelve a decir la misma palabra o la misma estructura, y esa insistencia se oye antes de entenderse. Ninguno de los tres sirve para adornar: cada uno hace un trabajo distinto sobre quien lee, y por eso conviene reconocerlos por su efecto y no solo por su nombre.',
                'Personification lends the actions or feelings of a person to something that is not one: a door that resists, a clock that runs, rain that beats down angrily. In doing so, the world around stops being scenery and starts having a character. Hyperbole exaggerates on purpose, and the reader knows it: nobody counts the times or checks the figure, because what is being measured is not an amount but the size of a feeling. Repetition says the same word or the same structure again, and that insistence is heard before it is understood. None of the three is there to decorate: each does a different job on the reader, which is why it pays to recognise them by their effect and not only by their name.') + '</p>' +
      '<div class="glosslist">' +
        '<div class="gloss"><div class="glossn">' + L(RECURSOS.personificacion.n) + '</div><div class="glossd">' + L(RECURSOS.personificacion.d) + '</div></div>' +
        '<div class="gloss"><div class="glossn">' + L(RECURSOS.hiperbole.n)       + '</div><div class="glossd">' + L(RECURSOS.hiperbole.d)       + '</div></div>' +
        '<div class="gloss"><div class="glossn">' + L(RECURSOS.repeticion.n)      + '</div><div class="glossd">' + L(RECURSOS.repeticion.d)      + '</div></div>' +
      '</div>');
  widgetEfecto();
  addP(q5());
  addP(q6());

  sec(T('La carta', 'The letter'),
      T('Escribir para alguien que existe', 'Writing for someone who exists'),
      '<p>' + T('Una carta personal se dirige a una persona concreta, que la va a leer: por eso lleva un saludo al principio, habla desde el yo y se despide al final. Los recursos no se colocan ahí para adornar el papel, sino en los puntos donde el sentimiento no cabe en una sola palabra. También tienen un límite: la misma idea admite muchas fuerzas, y elegir mal la fuerza estropea la carta. Si exageras en cada línea, quien lee deja de creerte; si lo dices todo de manera literal, la carta informa pero no llega. Escribir bien una carta es, sobre todo, decidir cuánta imagen necesita cada cosa que quieres decir.',
                'A personal letter is addressed to a specific person who is going to read it: that is why it opens with a greeting, speaks from the I and says goodbye at the end. Devices are not placed there to decorate the paper, but at the points where the feeling does not fit into a single word. They also have a limit: the same idea allows many degrees of force, and choosing the wrong degree spoils the letter. If you exaggerate in every line, the reader stops believing you; if you say everything literally, the letter informs but does not arrive. Writing a good letter is, above all, deciding how much image each thing you want to say needs.') + '</p>');
  widgetTermometro();
  addP(q7());

  sec(T('La biografía', 'The biography'),
      T('Contar la vida de otra persona', 'Telling another person’s life'),
      '<p>' + T('Una biografía cuenta la vida de alguien más. Habla de esa persona en tercera persona, no le habla a nadie de tú, y sigue el orden en que las cosas ocurrieron, porque cada momento explica el que viene después. Aun así, una biografía no es una lista de fechas: quien la escribe elige dos o tres momentos y los cuenta con imágenes, para que el lector sienta lo que esa vida tuvo de difícil, de terco o de luminoso. Los mismos recursos de la carta trabajan aquí, solo que al servicio de una vida ajena en lugar de un sentimiento propio.',
                'A biography tells someone else’s life. It speaks about that person in the third person, addresses nobody directly, and follows the order in which things happened, because each moment explains the one that comes next. Even so, a biography is not a list of dates: whoever writes it picks two or three moments and tells them with images, so that the reader feels what was hard, stubborn or luminous about that life. The same devices used in the letter work here too, only in the service of someone else’s life instead of a feeling of your own.') + '</p>');
  widgetVida();
  addP(q8());
  addP(q9());

  sec(T('Cierre', 'Wrap-up'),
      T('Tu turno de escribir', 'Your turn to write'),
      '<p>' + T('Ya reconociste los cinco recursos en una carta y en una biografía, y comprobaste qué le hace cada uno a quien lee. Lo que sigue es usarlos: elegir qué quieres que sienta la persona que te lea y buscar la imagen que lo consiga.',
                'You have now recognised the five devices in a letter and in a biography, and checked what each one does to the reader. What comes next is using them: choosing what you want your reader to feel and finding the image that achieves it.') + '</p>');
  widgetCuaderno();
  addP(q10());
}
</script>

(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbykkuJ_apGq3vALIFd4mr3acu81c7K4OKxW-DZ-i52Ceyl3lOanXMdvbS9SIXPrLQBm/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'Recursos Literarios en Cartas y Biografías';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
