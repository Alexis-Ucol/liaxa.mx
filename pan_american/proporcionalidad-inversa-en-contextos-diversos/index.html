<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proporcionalidad Inversa en Contextos Diversos</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Proporcionalidad Inversa en Contextos Diversos</div>
    <div class="wcourse" id="wcourse-el">Matemáticas · 2° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Proporcionalidad Inversa en Contextos Diversos</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="sbtn" id="dlBtn" onclick="generatePDF()" style="max-width:280px;margin:0 auto;">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   CENTRALIZED SCHOOL CONFIG (Rule 16) — ships UNBRANDED (Rule 11).
   The ONLY rebranding point. build_all.py substitutes these exact fields
   (BRAND_FIELDS / RGB_FIELDS / logo*) downstream; :root/dark stay as fallback.
   Neutral defaults below == the static :root/dark values, so unbranded == no-op.
   ══════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:'#0c3c9c', primaryDark:'#041d4f', primaryBg:'#e5ebf8',
  accent:'#9cb4e4', accentBg:'#e3e9f7',
  darkPrimary:'#3369d6', darkPrimaryDark:'#6595f5', darkPrimaryBg:'#061940',

  if (!saved) return;
  document.getElementById('restoreBar').style.display = 'none';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = currentAttempt(name, group);
  buildLesson(seededRng(name + group + att));
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
  saved.choices.forEach(function(choice, idx) {

    if (saved.texts) {
      saved.texts.forEach(function(text, i) {
        if (!text) return;

        if (ta) ta.value = text;
      });

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

      sy += 12;
    }
    var ok = document.getElementById('pc'+i).classList.contains('ok');
    doc.setFillColor(ok?232:255, ok?240:232, ok?232:228);
    doc.roundedRect(M,sy,TW,10,2,2,'F');
    doc.setFillColor(ok?26:176, ok?106:48, ok?74:16);
    doc.circle(M+6, sy+5, 2.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(7); doc.setFont('helvetica','bold');
    doc.text(ok?'✓':'✗', M+4.5, sy+6.5);
    doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('helvetica','normal');
    doc.text('Problema '+(i+1)+': '+pdfText(prob.title), M+12, sy+6.5);
    doc.setTextColor(ok?26:176, ok?106:48, ok?74:16);
    doc.text(ok?'Correcto':'Incorrecto', PW-M-24, sy+6.5);
    sy += 12;
  });

  // ── Per-problem pages ──
  for (var i = 0; i < problems.length; i++) {
    var prob = problems[i];
    doc.addPage();
    var wy = 0;

    doc.setFillColor(pBR,pBG,pBB); doc.rect(0,0,PW,20,'F');
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,3,'F');
    doc.setTextColor(pAR,pAG,pAB); doc.setFontSize(7); doc.setFont('helvetica','normal');
    doc.text(t('wcourse')+'  ·  '+t('wtitle'), M, 10);
    doc.setTextColor(232,238,247); doc.setFontSize(10.5); doc.setFont('helvetica','bold');
    doc.text('Problema '+(i+1)+' de '+total+'  ·  '+pdfText(prob.title), M, 17);
    wy = 25;

    var qRaw = pdfText(prob.questionText);
    doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var qLines = doc.splitTextToSize(qRaw, TW-10);
    var qBoxH  = 8 + qLines.length*5 + 3;
    doc.setFillColor(237,240,245); doc.roundedRect(M,wy,TW,qBoxH,2,2,'F');
    doc.setTextColor(pBR,pBG,pBB); doc.setFontSize(6.5); doc.setFont('helvetica','bold');
    doc.text('PREGUNTA', M+4, wy+6);
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var qy = wy+12;
    qLines.forEach(function(ln,li){ doc.text(ln, M+4, qy+li*5); });
    wy += qBoxH + 4;

    var isOk   = document.getElementById('pc'+i).classList.contains('ok');
    var chosen = prob.studentChoice != null ? pdfText(prob.options[prob.studentChoice]||'-') : '-';
    var corr   = pdfText(prob.options[prob.correctIdx]||'');
    var expRaw = pdfText(prob.explanation||'');
    doc.setFontSize(8.5); var chLines = doc.splitTextToSize('Alumno: '+chosen, TW-18);
    doc.setFontSize(8);   var coLines = doc.splitTextToSize('Correcto: '+corr, TW-18);
    doc.setFontSize(7.5); var exLines = doc.splitTextToSize('Solución: '+expRaw, TW-18).slice(0,4);
    var ansBoxH = 8 + chLines.length*5.5 + coLines.length*5 + exLines.length*5 + 6;
    doc.setFillColor(isOk?232:255, isOk?240:232, isOk?232:228);
    doc.roundedRect(M,wy,TW,ansBoxH,2,2,'F');
    doc.setFillColor(isOk?26:176, isOk?106:48, isOk?74:16);
    doc.circle(M+7, wy+8, 3.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(9); doc.setFont('helvetica','bold');
    doc.text(isOk?'✓':'✗', M+5.2, wy+10.5);
    var ay = wy+7;
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','bold');
    chLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5.5); });
    ay += chLines.length*5.5 + 3;
    doc.setTextColor(26,106,74); doc.setFontSize(8); doc.setFont('helvetica','normal');
    coLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    ay += coLines.length*5 + 3;
    doc.setTextColor(90,85,80); doc.setFontSize(7.5);
    exLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    wy += ansBoxH + 5;

    doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
    doc.setFontSize(7); doc.setFont('helvetica','bold');
    doc.rect(M,wy,TW,8,'F'); doc.text('TRABAJO DEL ALUMNO', M+4, wy+5.5);
    wy += 11;

    var dc = document.getElementById('dc'+i);
    if (dc) {
      try {
        var imgD = dc.toDataURL('image/png');
        var ar   = dc.height / dc.width;
        var iw   = TW;
        var ih   = Math.min(iw * ar, 68);
        doc.addImage(imgD, 'PNG', M, wy, iw, ih);
        wy += ih + 4;
      } catch(e) {}
    }

    var ta = document.getElementById('ta'+i);
    if (ta && ta.value.trim()) {
      if (wy > PH-30) { doc.addPage(); wy = 20; }
      doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('courier','normal');
      var taLines = doc.splitTextToSize(ta.value, TW);
      taLines.slice(0,16).forEach(function(ln) {
        if (wy > PH-15) { doc.addPage(); wy = 20; }
        doc.text(ln, M, wy); wy += 5;
      });
      wy += 2;
    }

    var pp = document.getElementById('pp'+i);
    if (pp && pp.src && pp.src.indexOf('data:') === 0) {
      if (wy > PH-55) { doc.addPage(); wy = 20; }
      try { doc.addImage(pp.src, 'JPEG', M, wy, TW, 68); wy += 72; } catch(e) {}
    }
  }

  // ── Footer on every page ──
  var pages = doc.internal.getNumberOfPages();
  for (var p = 1; p <= pages; p++) {
    doc.setPage(p);
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0, PH-3, PW, 3, 'F');
    doc.setTextColor(130,140,160); doc.setFontSize(6.5); doc.setFont('helvetica','normal');
    doc.text(name+'  ·  '+group+'  ·  Código: '+code+'  ·  Página '+p+'/'+pages,
      PW/2, PH-5, {align:'center'});
  }

  doc.save('mat2_t05_g02_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf');
  btn.innerHTML = '⬇ &nbsp;Descargar Resultados PDF';
  btn.disabled  = false;
}

/* ================================================
   buildLesson — OVERRIDE IN EACH GUIDE
   ================================================ */
function buildLesson(rng) {
  var LB = document.getElementById('lessonBody');

  /* ── helpers ─────────────────────────────────────────────────────── */
  function L(o){ if(o===null||o===undefined) return ''; if(typeof o==='string') return o; return (o[LANG]!==undefined ? o[LANG] : o.es); }
  function ri(a,b){ return a + Math.floor(rng()*(b-a+1)); }
  function pk(a){ return a[Math.floor(rng()*a.length)]; }
  function frac(n,d){ return '<span class="mf-outer"><span class="mf-num">'+n+'</span><span class="mf-den">'+d+'</span></span>'; }
  function cssv(n){ try { return getComputedStyle(document.documentElement).getPropertyValue(n).trim() || 'transparent'; } catch(e){ return 'transparent'; } }

  var THS = 'border:1px solid var(--border);padding:.42rem .7rem;background:var(--green-bg);color:var(--green-dark);font-weight:700;font-size:.76rem;letter-spacing:.04em';
  var TDS = 'border:1px solid var(--border);padding:.42rem .7rem;background:var(--surface);color:var(--text);font-size:.88rem;text-align:center';
  var TDH = 'border:1px solid var(--border);padding:.42rem .7rem;background:var(--gold-bg);color:var(--text);font-size:.88rem;text-align:center;font-weight:700';
  var BTN  = 'min-height:44px;min-width:44px;padding:.55rem 1.1rem;border-radius:8px;border:1.5px solid var(--green);background:var(--green);color:#fff;font-family:inherit;font-size:.85rem;font-weight:600;cursor:pointer';
  var BTN2 = 'min-height:44px;min-width:44px;padding:.45rem .9rem;border-radius:8px;border:1.5px solid var(--border);background:var(--surface2);color:var(--text);font-family:inherit;font-size:.85rem;font-weight:600;cursor:pointer';
  var INP  = 'width:92px;min-height:44px;padding:.3rem;border:1.5px solid var(--green);border-radius:6px;background:var(--surface);color:var(--text);font-size:1rem;text-align:center;font-weight:700;font-family:inherit';

  function tbl2(lx, xs, ly, ys){
    var h = '<div style="overflow-x:auto"><table style="border-collapse:collapse;margin:.7rem auto">';
    h += '<tr><th style="'+THS+'">'+lx+'</th>';
    for (var i=0;i<xs.length;i++) h += '<td style="'+(String(xs[i])==='?'?TDH:TDS)+'">'+xs[i]+'</td>';
    h += '</tr><tr><th style="'+THS+'">'+ly+'</th>';
    for (var j=0;j<ys.length;j++) h += '<td style="'+(String(ys[j])==='?'?TDH:TDS)+'">'+ys[j]+'</td>';
    return h + '</tr></table></div>';
  }
  function tblCols(cols, lx, xs, ly, ys){
    var h = '<div style="overflow-x:auto"><table style="border-collapse:collapse;margin:.7rem auto">';
    h += '<tr><th style="'+THS+'"> </th>';
    for (var c=0;c<cols.length;c++) h += '<th style="'+THS+'">'+cols[c]+'</th>';
    h += '</tr><tr><th style="'+THS+'">'+lx+'</th>';
    for (var i=0;i<xs.length;i++) h += '<td style="'+TDS+'">'+xs[i]+'</td>';
    h += '</tr><tr><th style="'+THS+'">'+ly+'</th>';
    for (var j=0;j<ys.length;j++) h += '<td style="'+TDS+'">'+ys[j]+'</td>';
    return h + '</tr></table></div>';
  }
  function optN(correct, cands){
    var out=[correct];
    for (var i=0;i<cands.length && out.length<4;i++){
      var c = Math.round(cands[i]);
      if (c>0 && out.indexOf(c)<0) out.push(c);
    }
    var d=1;
    while (out.length<4 && d<600){
      if (out.indexOf(correct+d)<0) out.push(correct+d);
      else if (correct-d>0 && out.indexOf(correct-d)<0) out.push(correct-d);
      d++;
    }
    return out.map(function(v){ return String(v); });
  }
  function optT(correct, others){
    var out=[correct];
    for (var i=0;i<others.length && out.length<4;i++){ if (out.indexOf(others[i])<0) out.push(others[i]); }
    return out;
  }
  function unit(arr, u){ return arr.map(function(v){ return v+' '+u; }); }
  function fbSet(id, ok, html){
    var e=document.getElementById(id); if(!e) return;
    e.className='mcfb show'; e.innerHTML=html;
    e.style.background = ok ? 'var(--ok-bg)' : 'var(--gold-bg)';
    e.style.color      = ok ? 'var(--ok)'    : 'var(--text2)';
  }
  function sec(tag,title,html){
    var d=document.createElement('div'); d.className='section';
    d.innerHTML='<div class="stag">'+tag+'</div><h2>'+title+'</h2>'+html;
    LB.appendChild(d); return d;
  }
  function widget(html){
    var d=document.createElement('div'); d.className='section';
    d.innerHTML=html; LB.appendChild(d); return d;
  }
  function addProb(p){
    var so = shuffle(p.options, rng);
    problems.push({
      title:p.title, questionText:p.q, fn:(p.fn||''), hint:p.hint, explanation:p.exp,
      options:so, correctIdx:so.indexOf(p.correct), showWork:!!p.showWork,
      studentChoice:null, pendingChoice:null
    });
    buildOneCard(problems[problems.length-1], problems.length-1);
  }

  /* ── constantes con divisores cómodos ── */
  var KB = [
    { k:120, ds:[4,5,6,8,10,12,15,20] },
    { k:144, ds:[4,6,8,9,12,16,18] },
    { k:180, ds:[4,5,6,9,10,12,15,18] },
    { k:240, ds:[5,6,8,10,12,15,16,20] },
    { k:360, ds:[6,8,9,10,12,15,18,20,24] }
  ];
  function kcfg(){ return KB[Math.floor(rng()*KB.length)]; }
  function someDs(c,n){
    var pool=c.ds.slice(), out=[];
    while (out.length<n && pool.length) out.push(pool.splice(Math.floor(rng()*pool.length),1)[0]);
    out.sort(function(a,b){ return a-b; });
    return out;
  }

  /* ══════════════════════════════════════════════════════════════════
     SECCIÓN 1
     ══════════════════════════════════════════════════════════════════ */
  sec(L({es:'Concepto 1', en:'Concept 1'}),
      L({es:'Situaciones muy distintas con la misma firma', en:'Very different situations with the same signature'}),
    '<p>'+L({es:'Una balanza de laboratorio, un viaje en carretera, una cuota que se reparte entre amigos y un par de engranes parecen no tener nada en común. Y sin embargo, en las cuatro pasa exactamente lo mismo: hay una cantidad total que ya está decidida y que no se puede tocar, y hay dos magnitudes que se acomodan como pueden para respetarla. Cuando una de esas dos magnitudes crece, la otra no tiene más remedio que encogerse, y no encoge de cualquier manera sino justo lo necesario para que el total siga siendo el mismo.',
             en:'A laboratory balance, a highway trip, a fee split among friends and a pair of gears seem to have nothing in common. And yet the same thing happens in all four: there is a total amount already decided that cannot be touched, and there are two quantities that arrange themselves as best they can to respect it. When one of those two quantities grows, the other has no choice but to shrink, and it does not shrink just anyhow but exactly as much as needed for the total to stay the same.'})+'</p>'+
    '<p>'+L({es:'Esa cantidad intocable es la <strong>constante de proporcionalidad</strong> y se escribe con la letra k. Reconocer un contexto de <strong>proporcionalidad inversa</strong> es, antes que nada, encontrar quién es k: en la balanza k es el momento que sostiene el brazo, en el viaje k es la distancia por recorrer, en la cuota k es el dinero que hay que juntar, en los engranes k es el número de dientes que pasan por minuto. Cambia el nombre, cambia la unidad, pero no cambia el comportamiento.',
             en:'That untouchable amount is the <strong>constant of proportionality</strong> and is written with the letter k. Recognizing an <strong>inverse proportionality</strong> context means, first of all, finding who k is: on the balance k is the turning effect holding the arm, on the trip k is the distance to cover, in the fee k is the money to be gathered, in the gears k is the number of teeth passing per minute. The name changes, the unit changes, but the behavior does not.'})+'</p>'+
    '<div class="rules-grid">'+
      '<div class="rcard"><div class="rname">'+L({es:'Balanza',en:'Balance'})+'</div><div class="rform">peso · distancia</div><div class="rnote">'+L({es:'Una pesa ligera lejos equilibra a una pesada cerca.',en:'A light weight far out balances a heavy one close in.'})+'</div></div>'+
      '<div class="rcard"><div class="rname">'+L({es:'Viaje',en:'Trip'})+'</div><div class="rform">velocidad · tiempo</div><div class="rnote">'+L({es:'La carretera mide lo mismo se corra o se vaya despacio.',en:'The road is the same length whether you rush or crawl.'})+'</div></div>'+
      '<div class="rcard"><div class="rname">'+L({es:'Cuota',en:'Fee'})+'</div><div class="rform">personas · aportación</div><div class="rnote">'+L({es:'Mientras más se apuntan, menos le toca poner a cada uno.',en:'The more people join, the less each one has to put in.'})+'</div></div>'+
      '<div class="rcard"><div class="rname">'+L({es:'Engranes',en:'Gears'})+'</div><div class="rform">dientes · vueltas</div><div class="rnote">'+L({es:'La rueda chica gira rápido, la grande gira despacio.',en:'The small wheel spins fast, the big one spins slow.'})+'</div></div>'+
    '</div>'+
    '<div class="callout"><p>'+L({es:'Hay una manera rápida de saber si estás frente a uno de estos contextos: imagina que duplicas una de las dos magnitudes. Si la otra se parte exactamente a la mitad, la relación es inversa. Si la otra también se duplica, es directa. Y si la otra hace cualquier otra cosa, no es ninguna de las dos.',
                                  en:'There is a quick way to tell whether you are facing one of these contexts: imagine doubling one of the two quantities. If the other splits exactly in half, the relation is inverse. If the other doubles as well, it is direct. And if the other does anything else, it is neither of the two.'})+'</p></div>');

  /* ── W1: balanza de brazos ── */
  var BAL = [
    { k:600, ds:[10,12,15,20,24,30] },
    { k:720, ds:[12,15,16,18,20,24,30] },
    { k:480, ds:[10,12,15,16,20,24] },
    { k:900, ds:[15,18,20,25,30,36] }
  ];
  var w1R = [];
  (function(){
    for (var i=0;i<3;i++){
      var c = BAL[Math.floor(rng()*BAL.length)];
      var pool = c.ds.slice();
      var a = pool.splice(Math.floor(rng()*pool.length),1)[0];
      var b = pool.splice(Math.floor(rng()*pool.length),1)[0];
      w1R.push({ k:c.k, ds:c.ds.slice(), dL:a, wL:c.k/a, dR:b, wR:c.k/b });
    }
  })();
  widget(
    '<div class="stag">'+L({es:'Balanza de brazos',en:'Beam balance'})+'</div>'+
    '<h2>'+L({es:'Mueve la pesa hasta que el brazo quede horizontal',en:'Slide the weight until the arm sits level'})+'</h2>'+
    '<p>'+L({es:'Del lado izquierdo hay una pesa fija que ya no se puede tocar. Del lado derecho tienes otra pesa que puedes deslizar por la regla. El brazo se inclina en tiempo real conforme la mueves y los dos productos aparecen abajo mientras deslizas. Colócala donde creas que la balanza queda horizontal y comprueba.',
             en:'On the left there is a fixed weight that can no longer be touched. On the right you have another weight that you can slide along the ruler. The arm tilts in real time as you move it and the two products appear below while you slide. Place it where you think the balance sits level and check.'})+'</p>'+
    '<div class="gcrd">'+
      '<div style="font-size:.85rem;color:var(--text2);margin-bottom:.7rem" id="w1goal"></div>'+
      '<div class="cvwrap"><canvas id="w1cv" style="display:block;width:100%;height:215px"></canvas></div>'+
      '<div class="cg" style="margin-top:.9rem"><label>'+L({es:'Distancia de la pesa derecha: ',en:'Distance of the right weight: '})+'<span class="cval" id="w1vv">-</span></label>'+
        '<input type="range" id="w1v" min="0" max="5" value="0" step="1"></div>'+
      '<div class="metrics">'+
        '<div class="metric"><div class="mlbl">'+L({es:'Izquierda',en:'Left'})+'</div><div class="mnum cs" id="w1tl">-</div></div>'+
        '<div class="metric"><div class="mlbl">'+L({es:'Derecha',en:'Right'})+'</div><div class="mnum ps" id="w1tr">-</div></div>'+
        '<div class="metric"><div class="mlbl">'+L({es:'Brazo',en:'Arm'})+'</div><div class="mnum ts" id="w1st">-</div></div>'+
      '</div>'+
      '<div style="margin-top:.9rem"><button id="w1chk" style="'+BTN+'">'+L({es:'Comprobar',en:'Check'})+'</button></div>'+
      '<div class="mcfb" id="w1fb"></div>'+
    '</div>');

  (function(){
    var round=0, tries=0, done=false;
    function R(){ return w1R[Math.min(round,2)]; }
    function idx(){ var e=document.getElementById('w1v'); return e ? parseInt(e.value,10) : 0; }
    function curD(){ var r=R(); return r.ds[Math.min(idx(), r.ds.length-1)]; }
    function draw(){
      var cv=document.getElementById('w1cv'); if(!cv) return;
      var dpr=window.devicePixelRatio||1, W=cv.clientWidth||320, H=215;
      cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
      var g=cv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,W,H);
      var r=R(), d=curD();
      var maxD=r.ds[r.ds.length-1];
      var s=(W/2-40)/maxD, cx=W/2, by=H-62;
      var tL=r.wL*r.dL, tR=r.wR*d, diff=tR-tL;
      var ang=0.30*(diff/(Math.abs(diff)+r.k*0.75));
      g.fillStyle=cssv('--surface2');
      g.beginPath(); g.moveTo(cx, by+5); g.lineTo(cx-18, by+40); g.lineTo(cx+18, by+40); g.closePath(); g.fill();
      g.strokeStyle=cssv('--border'); g.lineWidth=1.4; g.stroke();
      var half=maxD*s+18;
      var ca=Math.cos(ang), sa=Math.sin(ang);
      g.strokeStyle=cssv('--green'); g.lineWidth=6; g.lineCap='round';
      g.beginPath(); g.moveTo(cx-half*ca, by-half*sa); g.lineTo(cx+half*ca, by+half*sa); g.stroke();
      g.strokeStyle=cssv('--border'); g.lineWidth=1;
      for (var t=0;t<r.ds.length;t++){
        var dd=r.ds[t];
        for (var sg=-1; sg<=1; sg+=2){
          var px=cx+sg*dd*s*ca, py=by+sg*dd*s*sa;
          g.beginPath(); g.moveTo(px, py+4); g.lineTo(px, py+9); g.stroke();
        }
      }
      function block(dist, side, w, fillTok){
        var px=cx+side*dist*s*ca, py=by+side*dist*s*sa;
        var bw=Math.max(19, 10+w*0.22), bh=Math.max(13, 7+w*0.18);
        g.fillStyle=cssv(fillTok); g.fillRect(px-bw/2, py-bh-4, bw, bh);
        g.strokeStyle=cssv('--green'); g.lineWidth=1.5; g.strokeRect(px-bw/2, py-bh-4, bw, bh);
        g.fillStyle=cssv('--text'); g.font='700 10px "IBM Plex Sans", sans-serif';
        g.textAlign='center'; g.textBaseline='bottom';
        g.fillText(w+' g', px, py-bh-7);
        g.fillStyle=cssv('--text3'); g.font='500 9px "IBM Plex Sans", sans-serif'; g.textBaseline='top';
        g.fillText(dist+' cm', px, py+11);
      }
      block(r.dL,-1,r.wL,'--green-bg');
      block(d,1,r.wR,'--gold-bg');
      g.fillStyle = (diff===0) ? cssv('--ok') : cssv('--text3');
      g.font='700 11px "IBM Plex Sans", sans-serif'; g.textAlign='center'; g.textBaseline='top';

  } else {
    p8title = L({es:'El regalo de la maestra', en:'The gift for the teacher'});
    p8q = L({es:'Los '+n8a+' integrantes de un salón juntaron un regalo de despedida para su maestra aportando '+a8a+' pesos cada uno. Al día siguiente decidieron mantener el mismo regalo, pero invitar a más compañeros para que la aportación bajara a '+a8b+' pesos por persona. ¿Cuántas personas tendrán que participar?',
             en:'The '+n8a+' members of a class gathered a farewell gift for their teacher by putting in '+a8a+' pesos each. The next day they decided to keep the same gift, but invite more classmates so that the contribution would drop to '+a8b+' pesos per person. How many people will have to take part?'});
    p8exp = L({es:'El regalo cuesta siempre lo mismo: '+n8a+' personas de a '+a8a+' pesos reúnen '+n8a+' × '+a8a+' = '+c8.T+' pesos. Con aportaciones de '+a8b+' pesos, ese costo alcanza para '+c8.T+' ÷ '+a8b+' = '+n8b,
               en:'The gift always costs the same: '+n8a+' people at '+a8a+' pesos each gather '+n8a+' × '+a8a+' = '+c8.T+' pesos. With contributions of '+a8b+' pesos, that cost covers '+c8.T+' ÷ '+a8b+' = '+n8b});
    p8corr = String(n8b)+' '+L({es:'personas',en:'people'});
    p8opts = unit(optN(n8b, [n8a+(a8a-a8b), n8a*2, n8a+4]), L({es:'personas',en:'people'}));
  }
  addProb({
    title: p8title,
    q: p8q,
    hint: L({es:'Lo que se junta al final no depende de cuántos participen. Averigua primero de cuánto es esa cantidad completa con la pareja de datos que aparece junta, y después repártela según el dato nuevo.',
             en:'What gets gathered in the end does not depend on how many take part. First work out how big that complete amount is using the pair of values that appears together, then share it out according to the new value.'}),
    exp: p8exp,
    correct: p8corr,
    options: p8opts,
    showWork: true
  });

  /* ── P9 ── */
  var GEAR = [{k:720,ts:[24,30,36,40,45,48,60]},{k:960,ts:[24,30,32,40,48,60]},{k:600,ts:[20,24,25,30,40,50]}];
  var PUL  = [{k:720,ds:[12,15,18,20,24,30]},{k:600,ds:[10,12,15,20,24,30]}];
  var p9v = pk([0,1]);
  var p9q, p9exp, p9corr, p9opts, p9title;
  if (p9v===0){
    var g9 = pk(GEAR), gp = g9.ts.slice();
    var t9a = gp.splice(Math.floor(rng()*gp.length),1)[0];
    var t9b = gp.splice(Math.floor(rng()*gp.length),1)[0];
    var r9a = g9.k/t9a, r9b = g9.k/t9b;
    p9title = L({es:'Los engranes del taller', en:'The workshop gears'});
    p9q = L({es:'Una misma cadena mueve los engranes de una máquina y les hace pasar siempre la misma cantidad de dientes por minuto. El engrane de '+t9a+' dientes gira a '+r9a+' vueltas por minuto. En su lugar se coloca otro engrane, de '+t9b+' dientes, movido por esa misma cadena. ¿A cuántas vueltas por minuto girará?',
             en:'One and the same chain drives the gears of a machine and always makes the same number of teeth pass per minute. The '+t9a+' tooth gear turns at '+r9a+' turns per minute. In its place another gear is fitted, with '+t9b+' teeth, driven by that same chain. At how many turns per minute will it spin?'});
    p9exp = L({es:'La cadena hace pasar siempre la misma cantidad de dientes cada minuto: '+t9a+' × '+r9a+' = '+g9.k+' dientes por minuto. El engrane nuevo tiene que repartir esa misma cantidad entre sus '+t9b+' dientes: '+g9.k+' ÷ '+t9b+' = '+r9b,
               en:'The chain always makes the same number of teeth pass each minute: '+t9a+' × '+r9a+' = '+g9.k+' teeth per minute. The new gear has to share that same amount among its '+t9b+' teeth: '+g9.k+' ÷ '+t9b+' = '+r9b});
    p9corr = String(r9b)+' '+L({es:'vueltas por minuto',en:'turns per minute'});
    p9opts = unit(optN(r9b, [r9a-(t9b-t9a), r9a+(t9a-t9b), Math.round(r9a*t9b/t9a)]), L({es:'vueltas por minuto',en:'turns per minute'}));
  } else {
    var u9 = pk(PUL), up = u9.ds.slice();
    var d9a = up.splice(Math.floor(rng()*up.length),1)[0];
    var d9b = up.splice(Math.floor(rng()*up.length),1)[0];
    var v9a = u9.k/d9a, v9b = u9.k/d9b;
    p9title = L({es:'Las poleas del molino', en:'The mill pulleys'});
    p9q = L({es:'Una banda une el motor de un molino con la polea que hace girar la piedra, y la banda avanza siempre a la misma rapidez. Con una polea de '+d9a+' centímetros de diámetro, la piedra da '+v9a+' vueltas por minuto. El mecánico cambia esa polea por una de '+d9b+' centímetros de diámetro. ¿Cuántas vueltas por minuto dará ahora la piedra?',
             en:'A belt links the motor of a mill with the pulley that spins the stone, and the belt always advances at the same speed. With a pulley '+d9a+' centimeters in diameter, the stone makes '+v9a+' turns per minute. The mechanic swaps that pulley for one '+d9b+' centimeters in diameter. How many turns per minute will the stone make now?'});
    p9exp = L({es:'La banda entrega siempre la misma cantidad de recorrido por minuto: '+d9a+' × '+v9a+' = '+u9.k+'. Con la polea nueva ese mismo recorrido se reparte entre un diámetro mayor o menor: '+u9.k+' ÷ '+d9b+' = '+v9b,
               en:'The belt always delivers the same amount of travel per minute: '+d9a+' × '+v9a+' = '+u9.k+'. With the new pulley that same travel is shared among a larger or smaller diameter: '+u9.k+' ÷ '+d9b+' = '+v9b});
    p9corr = String(v9b)+' '+L({es:'vueltas por minuto',en:'turns per minute'});
    p9opts = unit(optN(v9b, [v9a-(d9b-d9a), v9a+(d9a-d9b), Math.round(v9a*d9b/d9a)]), L({es:'vueltas por minuto',en:'turns per minute'}));
  }
  addProb({
    title: p9title,
    q: p9q,
    hint: L({es:'Hay una cantidad que la cadena o la banda mantiene fija cada minuto, sin importar la pieza que se coloque. Reconstrúyela con la pareja de datos completa y después repártela entre el dato de la pieza nueva.',
             en:'There is an amount the chain or the belt keeps fixed every minute, whatever piece is fitted. Rebuild it with the complete pair of values and then share it out among the value of the new piece.'}),
    exp: p9exp,
    correct: p9corr,
    options: p9opts,
    showWork: true
  });

  /* ── P10 ── */
  var p10v = pk([0,1]);
  var p10q, p10exp, p10corr, p10opts, p10title, p10sw;
  if (p10v===0){
    var fac = pk([2,3,4]);
    var facw = { 2:{es:'la mitad',en:'half'}, 3:{es:'la tercera parte',en:'a third'}, 4:{es:'la cuarta parte',en:'a quarter'} }[fac];
    p10title = L({es:'Qué le pasa a la otra magnitud', en:'What happens to the other quantity'});
    p10q = L({es:'En cierta situación de proporcionalidad inversa, la magnitud x se reduce hasta quedar en '+L(facw)+' de lo que valía, mientras la constante de la relación sigue siendo la misma. ¿Qué le ocurre entonces a la magnitud y?',
             en:'In a certain inverse proportionality situation, the quantity x is reduced until it is '+L(facw)+' of what it was, while the constant of the relation stays the same. What then happens to the quantity y?'});
    p10corr = L({es:'Queda multiplicada por '+fac+'.', en:'It ends up multiplied by '+fac+'.'});
    p10opts = optT(p10corr, [
      L({es:'Queda dividida entre '+fac+'.', en:'It ends up divided by '+fac+'.'}),
      L({es:'Se mantiene con el mismo valor de antes.', en:'It stays at the same value as before.'}),
      L({es:'Disminuye en '+fac+' unidades.', en:'It decreases by '+fac+' units.'})
    ]);
    p10exp = L({es:'El producto de las dos magnitudes está obligado a repetir la constante. Si x se queda con '+L(facw)+' de su valor, la única forma de sostener ese producto es que y se agrande en la misma medida, es decir que quede multiplicada por '+fac,
               en:'The product of the two quantities is forced to repeat the constant. If x keeps '+L(facw)+' of its value, the only way to hold that product up is for y to grow in the same measure, that is, to end up multiplied by '+fac});
    p10sw = false;
  } else {
    var WK = [{k:90,ns:[5,6,9,10,15,18]},{k:120,ns:[6,8,10,12,15,20]},{k:144,ns:[8,9,12,16,18,24]}];
    var w10 = pk(WK), wp = w10.ns.slice();
    var n10a = wp.splice(Math.floor(rng()*wp.length),1)[0];
    var n10b = wp.splice(Math.floor(rng()*wp.length),1)[0];
    var d10a = w10.k/n10a, d10b = w10.k/n10b;
    p10title = L({es:'La entrega del taller de costura', en:'The sewing workshop delivery'});
    p10q = L({es:'En un taller de costura, '+n10a+' costureras trabajando al mismo ritmo terminan un pedido de uniformes en '+d10a+' días. La escuela adelantó la entrega y ahora el pedido, que es exactamente el mismo, debe quedar listo en '+d10b+' días. ¿Cuántas costureras de ese mismo ritmo hacen falta?',
             en:'At a sewing workshop, '+n10a+' seamstresses working at the same pace finish an order of uniforms in '+d10a+' days. The school moved the delivery up and now the order, which is exactly the same one, has to be ready in '+d10b+' days. How many seamstresses working at that same pace are needed?'});
    p10exp = L({es:'El pedido guarda siempre la misma cantidad de trabajo: '+n10a+' costureras durante '+d10a+' días son '+n10a+' × '+d10a+' = '+w10.k+' jornadas. Para que quepan en '+d10b+' días, esas jornadas se reparten entre el nuevo plazo: '+w10.k+' ÷ '+d10b+' = '+n10b,
               en:'The order always holds the same amount of work: '+n10a+' seamstresses over '+d10a+' days come to '+n10a+' × '+d10a+' = '+w10.k+' worker days. For them to fit in '+d10b+' days, those worker days are shared among the new deadline: '+w10.k+' ÷ '+d10b+' = '+n10b});
    p10corr = String(n10b)+' '+L({es:'costureras',en:'seamstresses'});
    p10opts = unit(optN(n10b, [n10a+(d10a-d10b), n10a*2, n10a+3]), L({es:'costureras',en:'seamstresses'}));
    p10sw = true;
  }
  addProb({
    title: p10title,
    q: p10q,
    hint: L({es:'Apóyate en lo que no puede cambiar: el resultado de combinar las dos magnitudes. Si una de ellas se mueve, la otra tiene que moverse justo lo necesario para dejar ese resultado intacto.',
             en:'Lean on what cannot change: the result of combining the two quantities. If one of them moves, the other has to move exactly as much as needed to leave that result untouched.'}),
    exp: p10exp,
    correct: p10corr,
    options: p10opts,
    showWork: p10sw
  });
}
</script>

<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbzLGV15JRTPs9bbSvHRLfgOXeT9oUExDf1AH546WOwq5tYxXSdhX212OWi_bTJfMGx9/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'Proporcionalidad Inversa en Contextos Diversos';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
