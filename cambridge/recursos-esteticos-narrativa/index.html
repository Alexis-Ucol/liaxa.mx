              en:'Compare the two versions and notice what information is kept and what intensity disappears.' },
      exp: { es:'Las dos versiones informan lo mismo, pero la propuesta se queda en lo posible: desaparece la exageración, que era justamente lo que volvía intensa la escena.',
             en:'Both versions report the same thing, but the proposal stays within the possible: the exaggeration disappears, and that was exactly what made the scene intense.' },
      options: [ PD.hipLose.c ].concat(PD.hipLose.d),
      correct: PD.hipLose.c
    };
  }

  function q7() {
    var OP = {
      ana: { es:'Una analepsis, es decir un salto hacia un momento anterior',  en:'An analepsis, that is, a jump back to an earlier moment' },
      pro: { es:'Una prolepsis, es decir un salto hacia un momento posterior', en:'A prolepsis, that is, a jump forward to a later moment' },
      eli: { es:'Una elipsis que suprime un tramo entero de la historia',      en:'An ellipsis that cuts out a whole stretch of the story' },
      abi: { es:'Un desenlace abierto que deja la historia sin cerrar',        en:'An open ending that leaves the story unresolved' }
    };
    if (rng() < 0.5) {
      var corr = (C.tiempo.kind === 'analepsis') ? OP.ana : OP.pro;
      return {
        title: { es:'El salto del relato', en:'The jump in the story' },
        q: { es:'La expresión ' + Q(C.tiempo.q) + ' rompe el orden en que se venían contando los hechos. Determina qué recurso temporal aparece ahí.',
             en:'The expression ' + Q(C.tiempo.q) + ' breaks the order in which the events were being told. Determine which time resource appears there.' },
        hint: { es:'Compara el momento al que remite esa expresión con el momento en que se encontraba la narración justo antes.',
                en:'Compare the moment that expression points to with the moment the narration had reached just before it.' },
        exp: (C.tiempo.kind === 'analepsis')
          ? { es:'La narración ya estaba en el presente de la escena y retrocede a un momento previo: eso es una analepsis, y sirve para explicar el valor que tiene ese objeto para quien narra.',
              en:'The narration was already in the present of the scene and steps back to an earlier moment: that is an analepsis, and it serves to explain what that object means to the narrator.' }
          : { es:'La narración abandona el presente de la escena y se adelanta a un momento muy posterior: eso es una prolepsis, y sirve para anunciar la huella que dejará lo narrado.',
              en:'The narration leaves the present of the scene and jumps ahead to a much later moment: that is a prolepsis, and it serves to announce the mark the events will leave.' },
        options: [ OP.ana, OP.pro, OP.eli, OP.abi ],
        correct: corr
      };
    }
    return {
      title: { es:'Primero en la historia', en:'First in the story' },
      q: { es:'Determina cuál de estos hechos ocurrió primero en la historia, aunque no sea el primero en aparecer en el texto.',
           en:'Determine which of these events happened first in the story, even if it is not the first one to appear in the text.' },
      hint: { es:'Separa el orden de las páginas del orden de los sucesos y reconstruye la secuencia real antes de responder.',
              en:'Separate the order of the pages from the order of the events and rebuild the real sequence before answering.' },
      exp: { es:'El texto no respeta la secuencia real: coloca ese hecho fuera de su lugar cronológico, y por eso quien lee debe reconstruir el orden de la historia.',
             en:'The text does not respect the real sequence: it places that event out of its chronological spot, so the reader has to rebuild the order of the story.' },
      options: [ PD.firstEvent.c ].concat(PD.firstEvent.d),
      correct: PD.firstEvent.c
    };
  }

  function q8() {
    if (rng() < 0.5) {
      return {
        title: { es:'La voz de la novela', en:'The voice of the novel' },
        q: { es:'Determina qué tipo de narrador conduce el fragmento de novela ' + Q(C.novTitle) + '.',
             en:'Determine what kind of narrator carries the novel excerpt ' + Q(C.novTitle) + '.' },
        hint: { es:'Revisa de cuántos personajes conoce el interior esa voz y si alguno de ellos podría estar contando.',
                en:'Check how many characters that voice knows the inside of, and whether any of them could be the one telling it.' },
        exp: { es:'La voz no participa en la escena y aun así informa de lo que un personaje piensa y de lo que el otro ignora: solo un narrador omnisciente en tercera persona tiene ese alcance.',
               en:'The voice does not take part in the scene and still reports what one character thinks and what the other one misses: only an omniscient third-person narrator has that reach.' },
        options: [ NARR_OPTS.omni, NARR_OPTS.primera, NARR_OPTS.testigo, NARR_OPTS.lector ],
        correct: NARR_OPTS.omni
      };
    }
    var cc = { es:'Informa a la vez de lo que piensa un personaje y de lo que otro ignora',
               en:'It reports at the same time what one character thinks and what another one does not know' };
    return {
      title: { es:'La prueba del alcance', en:'The proof of reach' },
      q: { es:'Determina qué rasgo del fragmento de novela demuestra el alcance de su narrador.',
           en:'Determine which feature of the novel excerpt proves the reach of its narrator.' },
      hint: { es:'Tres de los rasgos podrían aparecer en cualquier narrador; busca el único que exige conocer el interior de más de un personaje.',
              en:'Three of the features could appear with any narrator; look for the only one that requires knowing the inside of more than one character.' },
      exp: { es:'Nombrar un lugar, numerar un capítulo o alargar las oraciones no dice nada del alcance de la voz. Acceder al pensamiento de uno y a la ignorancia de otro sí lo hace.',
             en:'Naming a place, numbering a chapter or lengthening the sentences says nothing about the reach of the voice. Reaching one character’s thought and another’s ignorance does.' },
      options: [ cc,
        { es:'Menciona el lugar exacto donde transcurre la escena', en:'It mentions the exact place where the scene happens' },
        { es:'Emplea oraciones largas separadas por comas',         en:'It uses long sentences separated by commas' },
        { es:'Indica el capítulo al que pertenece el fragmento',    en:'It indicates the chapter the excerpt belongs to' } ],
      correct: cc
    };
  }

  function q9() {
    if (rng() < 0.5) {
      var c1 = { es:'Abre varias líneas de acción con personajes que todavía no se encuentran',
                 en:'It opens several lines of action with characters who have not met yet' };
      return {
        title: { es:'Cuento frente a novela', en:'Short story against novel' },
        q: { es:'Compara el relato ' + Q(C.title) + ' con el fragmento de novela. Determina qué rasgo pertenece a la novela y no al relato breve.',
             en:'Compare the story ' + Q(C.title) + ' with the novel excerpt. Determine which feature belongs to the novel and not to the short story.' },
        hint: { es:'Descarta lo que ambos textos comparten y quédate con lo que solo puede sostenerse a lo largo de muchos capítulos.',
                en:'Rule out what both texts share and keep what can only be sustained across many chapters.' },
        exp: { es:'Los dos textos usan recursos estéticos, tienen narrador y construyen un ambiente. Lo que solo hace la novela es sostener varias líneas de acción que tardarán en cruzarse.',
               en:'Both texts use aesthetic resources, have a narrator and build a setting. What only the novel does is sustain several lines of action that will take time to meet.' },
        options: [ c1,
          { es:'Emplea recursos estéticos, mientras que el relato breve no los emplea', en:'It uses aesthetic resources, while the short story does not use them' },
          { es:'Cuenta con un narrador, mientras que el relato breve carece de uno',    en:'It has a narrator, while the short story has none' },
          { es:'Construye un ambiente, mientras que el relato breve solo enumera hechos', en:'It builds a setting, while the short story only lists events' } ],
        correct: c1
      };
    }
    var c2 = { es:'Anuncia que lo decisivo ocurrirá mucho después de la escena que se narra',
               en:'It announces that the decisive part will happen long after the scene being told' };
    return {
      title: { es:'Por qué no cierra', en:'Why it does not close' },
      q: { es:'Un lector sostiene que el fragmento de novela no podría funcionar como final de un cuento. Determina qué elemento del fragmento apoya mejor esa afirmación.',
           en:'A reader claims the novel excerpt could not work as the ending of a short story. Determine which element of the excerpt best supports that claim.' },
      hint: { es:'Un cuento cierra su efecto en el propio texto; busca el elemento que deja el sentido pendiente de páginas que aún no se han leído.',
              en:'A short story closes its effect within its own text; look for the element that leaves the meaning waiting on pages that have not been read yet.' },
      exp: { es:'Mencionar un oficio, un lugar o la tercera persona es compatible con un cuento. Aplazar lo decisivo a un momento muy lejano solo funciona si quedan capítulos por delante.',
             en:'Mentioning a job, a place or the third person is compatible with a short story. Postponing the decisive part to a far-off moment only works if there are chapters ahead.' },
      options: [ c2,
        { es:'Menciona el oficio de uno de los personajes',              en:'It mentions the job of one of the characters' },
        { es:'Describe una acción cotidiana de uno de los personajes',   en:'It describes an everyday action of one of the characters' },
        { es:'Está escrito en tercera persona y no en primera',          en:'It is written in the third person and not in the first' } ],
      correct: c2
    };
  }

  function q10() {
    if (rng() < 0.5) {
      return {
        title: { es:'La atmósfera completa', en:'The whole atmosphere' },
        q: { es:'Reúne todos los recursos que aparecen en el relato ' + Q(C.title) + ' y determina cuál de estas afirmaciones describe con precisión el modo en que ese texto construye su atmósfera.',
             en:'Bring together every resource that appears in the story ' + Q(C.title) + ' and determine which of these statements accurately describes how that text builds its atmosphere.' },
        hint: { es:'Anota los recursos que localizaste y busca qué tienen en común antes de elegir; una afirmación exacta debe valer para casi todos ellos.',
                en:'Write down the resources you located and look for what they share before choosing; an accurate statement has to hold for nearly all of them.' },
        exp: { es:'Los recursos del relato no se limitan a adornar: coinciden en dar movimiento y presencia a lo que no es humano, y esa coincidencia es la que produce la atmósfera del texto.',
               en:'The resources in the story do not merely decorate: they agree in giving movement and presence to what is not human, and that agreement is what produces the atmosphere of the text.' },
        options: [ PD.atmos.c ].concat(PD.atmos.d),
        correct: PD.atmos.c,
        showWork: true
      };
    }
    return {
      title: { es:'Lo que borra el resumen', en:'What the summary erases' },
      q: { es:'Un compañero resume el relato así: ' + Q(PD.resumen) + ' Determina qué desaparece por completo en ese resumen.',
           en:'A classmate summarises the story like this: ' + Q(PD.resumen) + ' Determine what disappears completely in that summary.' },
      hint: { es:'Contrasta el resumen con el relato punto por punto y marca lo que sigue estando y lo que ya no.',
              en:'Contrast the summary with the story point by point and mark what is still there and what is not.' },
      exp: { es:'El resumen conserva el lugar, el orden y el hecho que rompe la rutina; lo único que pierde son las imágenes, es decir, aquello que hacía del relato algo más que una noticia.',
             en:'The summary keeps the place, the order and the event that breaks the routine; the only thing it loses are the images, that is, what made the story something more than a piece of news.' },
      options: [ PD.resLose.c ].concat(PD.resLose.d),
      correct: PD.resLose.c,
      showWork: true
    };
  }

  /* ═════════ LA LECCIÓN: concepto, manipulativo, problema ═════════ */

  sec(T('Punto de partida', 'Starting point'),
      T('Quién cuenta y desde dónde', 'Who tells it and from where'),
      '<p>' + T('Un texto narrativo cuenta hechos que le ocurren a alguien en un tiempo y un lugar. Antes de valorar un relato conviene identificar quién lo cuenta, porque esa voz decide qué sabemos y qué se nos oculta. Si la voz vive los hechos y habla de sí misma, es un narrador protagonista. Si mira desde fuera y solo refiere lo que alcanza a ver, es un narrador testigo. Si entra en la mente de los personajes y conoce su pasado y su futuro, es un narrador omnisciente. Junto a esa voz, todo relato levanta un ambiente, presenta personajes y encadena acciones.',
                'A narrative text tells events that happen to someone in a time and a place. Before judging a story it is worth identifying who tells it, because that voice decides what we know and what is kept from us. If the voice lives the events and speaks about itself, it is a main-character narrator. If it looks on from outside and only reports what it can see, it is a witness narrator. If it enters the characters’ minds and knows their past and their future, it is an omniscient narrator. Alongside that voice, every story builds a setting, presents characters and links actions together.') + '</p>' +
      storyBlock() +
      '<div class="callout"><p><strong>' + T('Para leer:', 'While reading:') + '</strong> ' +
        T('la persona gramatical y el alcance de lo que la voz sabe son las dos pistas que identifican a un narrador.',
          'the grammatical person and the reach of what the voice knows are the two clues that identify a narrator.') + '</p></div>');
  widgetVoz();
  addP(q1());
  addP(q2());

  sec(T('Imágenes', 'Images'),
      T('Cuando el lenguaje inventa imágenes', 'When language invents images'),
      '<p>' + T('Los recursos estéticos son usos del lenguaje que buscan un efecto en quien lee, no solo transmitir un dato. Tres de ellos trabajan con imágenes. El símil enlaza dos elementos distintos y deja visible el nexo que los compara. La metáfora da un paso más y nombra una cosa con el nombre de otra, sin avisar. La personificación presta acciones o intenciones humanas a animales, objetos o fuerzas. En los tres casos el texto afirma algo que no es literalmente cierto para que el lector vea mejor.',
                'Aesthetic resources are uses of language that aim for an effect on the reader, not just the transfer of information. Three of them work with images. The simile links two different elements and leaves the comparing word visible. The metaphor goes further and names one thing with the name of another, without warning. Personification lends human actions or intentions to animals, objects or forces. In all three cases the text states something that is not literally true so that the reader can see better.') + '</p>' +
      '<div class="glosslist">' +
        '<div class="gloss"><div class="glossn">' + L(TYPES.simil.n)    + '</div><div class="glossd">' + L(TYPES.simil.d)    + '</div></div>' +
        '<div class="gloss"><div class="glossn">' + L(TYPES.metafora.n) + '</div><div class="glossd">' + L(TYPES.metafora.d) + '</div></div>' +
        '<div class="gloss"><div class="glossn">' + L(TYPES.person.n)   + '</div><div class="glossd">' + L(TYPES.person.d)   + '</div></div>' +
      '</div>');
  widgetCaza();
  addP(q3());
  addP(q4());

  sec(T('Intensidad y sonido', 'Intensity and sound'),
      T('Exagerar y hacer sonar el relato', 'Exaggerating and making the story sound'),
      '<p>' + T('Otros dos recursos no construyen imágenes: trabajan con la intensidad y con el oído. La hipérbole exagera más allá de lo posible para que una sensación se perciba enorme. La aliteración repite un mismo sonido en palabras cercanas y produce un ritmo que acompaña lo que se cuenta. Ningún recurso vale por sí mismo: vale por el efecto que provoca en quien lee dentro de ese relato concreto, y ese efecto es lo que se analiza.',
                'Two other resources do not build images: they work with intensity and with the ear. Hyperbole exaggerates beyond the possible so that a sensation is felt as enormous. Alliteration repeats the same sound in nearby words and produces a rhythm that accompanies what is being told. No resource is worth anything on its own: it is worth what it produces in the reader inside that particular story, and that effect is what gets analysed.') + '</p>' +
      '<div class="glosslist">' +
        '<div class="gloss"><div class="glossn">' + L(TYPES.hiperbole.n)   + '</div><div class="glossd">' + L(TYPES.hiperbole.d)   + '</div></div>' +
        '<div class="gloss"><div class="glossn">' + L(TYPES.aliteracion.n) + '</div><div class="glossd">' + L(TYPES.aliteracion.d) + '</div></div>' +
      '</div>');
  widgetEfecto();
  addP(q5());
  addP(q6());

  sec(T('El tiempo', 'Time'),
      T('El orden en que se cuenta', 'The order in which it is told'),
      '<p>' + T('Una historia tiene un orden de hechos y un texto tiene un orden de párrafos, y no siempre coinciden. Cuando el relato retrocede a un momento anterior ocurre una analepsis. Cuando se adelanta a un momento posterior ocurre una prolepsis. Estos saltos no son descuidos: sirven para explicar una causa, para crear expectativa o para dar peso a un recuerdo. Reconocerlos exige separar el orden de la historia del orden del texto.',
                'A story has an order of events and a text has an order of paragraphs, and the two do not always match. When the story steps back to an earlier moment, an analepsis happens. When it jumps ahead to a later moment, a prolepsis happens. These jumps are not slips: they serve to explain a cause, to create expectation or to give weight to a memory. Recognising them means separating the order of the story from the order of the text.') + '</p>');
  widgetLinea();
  addP(q7());

  sec(T('Dos formatos', 'Two formats'),
      T('Del cuento a la novela', 'From the short story to the novel'),
      '<p>' + T('El cuento y la novela comparten los mismos recursos, pero no la misma escala. El cuento concentra una sola línea de acción y suele cerrarse en un efecto único. La novela dispone de espacio para abrir varias líneas a la vez, dividirse en capítulos y hacer que los personajes tarden en encontrarse. Lee este fragmento y compáralo con el relato del inicio.',
                'The short story and the novel share the same resources, but not the same scale. The short story concentrates a single line of action and usually closes on a single effect. The novel has room to open several lines at once, to divide itself into chapters and to make the characters take a long time to meet. Read this excerpt and compare it with the story from the beginning.') + '</p>' +
      novelBlock());
  widgetLectura();
  addP(q8());

  sec(T('Cierre', 'Wrap-up'),
      T('Dos lecturas para decidir', 'Two readings to decide'),
      '<p>' + T('Resuelve los últimos casos con los dos textos a la vista.', 'Work through the last cases with both texts in view.') + '</p>');
  addP(q9());
  addP(q10());
}
</script>

<!-- LIAXA ANALYTICS -->
<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbykkuJ_apGq3vALIFd4mr3acu81c7K4OKxW-DZ-i52Ceyl3lOanXMdvbS9SIXPrLQBm/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'Recursos Estéticos en la Narrativa: Cuento y Novela';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
