<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Introducción a Matemáticas Básicas · Semana 1 · ALEXIS</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --green:#1a4a8a;--green-dark:#0f2d5a;--green-bg:#e8edf5;
  --gold:#c9a84c;--gold-bg:#faf3e0;
  --bg:#f8f6f1;--surface:#ffffff;--surface2:#f0ede6;
  --border:#ddd8cc;--text:#1a1a16;--text2:#4a4640;--text3:#7a7468;
  --ok:#1e7d45;--ok-bg:rgba(30,125,69,.12);
  --bad:#c0321a;--bad-bg:rgba(192,50,26,.10);
  --shadow:0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"]{
  --bg:#18181a;--surface:#242420;--surface2:#2e2e28;--border:#3a3830;
  --text:#e8e4da;--text2:#b0aa9e;--text3:#7a7468;--shadow:0 4px 20px rgba(0,0,0,.35);
  --green:      #1a4a8a;   /* PRIMARY      */--green-dark:#7aaae0;--green-bg:#0e1e38;
  --gold:#d4b86a;--gold-bg:#241e0e;
  --ok:#4a9a6f;--ok-bg:rgba(74,154,111,.12);
  --bad:#c05030;--bad-bg:rgba(192,80,48,.10);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'IBM Plex Sans',sans-serif;background:var(--bg);color:var(--text);line-height:1.65}

#welcomeScreen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:1.5rem}
.wcard{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:2.4rem 2rem;width:100%;max-width:460px;text-align:center;border-top:4px solid var(--gold)}
.wlogos{display:flex;justify-content:center;align-items:center;gap:1.4rem;margin-bottom:1.6rem;padding-bottom:1.6rem;border-bottom:1px solid var(--border)}
.wlogos img{height:50px;width:auto;object-fit:contain}
.wlogsep{width:1px;height:40px;background:var(--border);flex-shrink:0}
.wtitle{font-family:'Crimson Pro',serif;font-size:1.65rem;font-weight:700;margin-bottom:.25rem}
.wcourse{font-size:.78rem;color:var(--text3);letter-spacing:.07em;text-transform:uppercase;margin-bottom:1.6rem}
.flabel{display:block;font-size:.75rem;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.3rem;text-align:left}
.finput{width:100%;padding:.7rem .9rem;border:1.5px solid var(--border);border-radius:8px;background:var(--surface2);color:var(--text);font-size:.95rem;font-family:inherit;margin-bottom:.9rem;transition:border-color .18s}
.finput:focus{outline:none;border-color:var(--green)}
.sbtn{width:100%;padding:.85rem;background:var(--green);color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;transition:background .18s}
.sbtn:hover{background:var(--green-dark)}
.serr{min-height:1.2rem;font-size:.82rem;color:var(--bad);margin-top:.4rem}

#lessonScreen{display:none}
.stickybar{position:sticky;top:0;z-index:100;background:var(--surface);border-bottom:1px solid var(--border);padding:.55rem 1.2rem;display:flex;align-items:center;gap:.7rem;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.hsep{width:1px;height:22px;background:var(--border);flex-shrink:0}
.htitle{font-family:'Crimson Pro',serif;font-size:1rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip{font-size:.7rem;background:var(--green-bg);color:var(--green-dark);padding:.2rem .65rem;border-radius:20px;white-space:nowrap;flex-shrink:0}
.tbtn{background:none;border:1px solid var(--border);border-radius:7px;padding:.28rem .55rem;cursor:pointer;font-size:.82rem;color:var(--text2);flex-shrink:0}
.progbar{height:3px;background:var(--border);position:sticky;top:47px;z-index:99}
.progfill{height:100%;background:var(--green);width:0%;transition:width .4s}
.lang-toggle{display:flex;border:1.5px solid var(--border);border-radius:8px;overflow:hidden;flex-shrink:0}
.lang-btn{padding:.28rem .7rem;font-size:.72rem;font-weight:600;letter-spacing:.06em;cursor:pointer;border:none;background:none;color:var(--text3);font-family:inherit;transition:all .15s}
.lang-btn.active{background:var(--green);color:#fff}

.lbody{max-width:760px;margin:0 auto;padding:2rem 1.2rem 4rem}
.section{opacity:0;transform:translateY(16px);transition:opacity .48s,transform .48s;margin-bottom:2.8rem}
.section.vis{opacity:1;transform:none}
.stag{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:.45rem}
.section h2{font-family:'Crimson Pro',serif;font-size:1.65rem;font-weight:700;margin-bottom:.7rem}
.section p{color:var(--text2);margin-bottom:.8rem}
.callout{background:var(--green-bg);border-left:4px solid var(--green);border-radius:0 10px 10px 0;padding:1rem 1.2rem;margin:1rem 0}
.callout strong{color:var(--green-dark)}
.callout p{margin-bottom:0}
.rules-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:.75rem;margin:1.1rem 0}
.rcard{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:.9rem;border-top:3px solid var(--green)}
.rname{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);margin-bottom:.35rem}
.rval{font-size:.88rem;color:var(--green-dark);font-weight:600;margin-bottom:.3rem;font-family:'IBM Plex Mono',monospace}
.rnote{font-size:.76rem;color:var(--text3)}

/* ROADMAP */
.roadmap{display:flex;flex-direction:column;gap:.45rem;margin:1rem 0}
.rm-row{display:flex;align-items:flex-start;gap:.8rem;padding:.7rem .9rem;border-radius:9px;background:var(--surface);border:1px solid var(--border)}
.rm-week{font-family:'IBM Plex Mono',monospace;font-size:.72rem;color:var(--text3);min-width:52px;padding-top:.1rem;flex-shrink:0}
.rm-title{font-size:.85rem;font-weight:600;color:var(--text);margin-bottom:.1rem}
.rm-why{font-size:.74rem;color:var(--text3);line-height:1.45}
.rm-row.current{border-color:var(--gold);background:var(--gold-bg)}
.rm-row.current .rm-week{color:var(--gold)}
.rm-row.current .rm-title{color:var(--green-dark)}

/* DRAG-DROP */
.dd-pool{display:flex;flex-wrap:wrap;gap:.5rem;padding:.9rem;background:var(--surface2);border-radius:10px;border:2px dashed var(--border);margin:.75rem 0;min-height:52px}
.dd-chip{background:var(--green);color:#fff;border-radius:6px;padding:.32rem .8rem;font-size:.82rem;font-weight:500;cursor:grab;user-select:none;transition:opacity .15s,transform .1s;border:2px solid transparent}
.dd-chip:active{cursor:grabbing;transform:scale(1.06)}
.dd-bins{display:grid;gap:.65rem;margin:.75rem 0}
.dd-bins.cols2{grid-template-columns:1fr 1fr}
.dd-bin{min-height:70px;border-radius:10px;border:2px dashed var(--border);padding:.6rem .8rem;background:var(--surface);transition:background .16s,border-color .16s}
.dd-bin.over{background:var(--green-bg);border-color:var(--green)}
.dd-bin h4{font-size:.72rem;font-weight:600;color:var(--text3);letter-spacing:.06em;text-transform:uppercase;margin-bottom:.45rem;pointer-events:none}
.dd-bin .dd-chip{margin:.2rem .2rem .2rem 0;cursor:default}
.dd-bin .dd-chip.ok-chip{background:var(--ok);border-color:var(--ok)}
.dd-bin .dd-chip.bad-chip{background:var(--bad);border-color:var(--bad)}
.dd-actions{display:flex;gap:.5rem;margin-top:.5rem;flex-wrap:wrap}
.dd-check{background:var(--green);color:#fff;border:none;border-radius:8px;padding:.45rem 1.1rem;font-size:.82rem;font-weight:600;cursor:pointer;font-family:inherit}
.dd-reset{background:none;border:1.5px solid var(--border);color:var(--text2);border-radius:8px;padding:.45rem .9rem;font-size:.82rem;cursor:pointer;font-family:inherit}
.dd-fb{font-size:.82rem;margin-top:.55rem;padding:.55rem .85rem;border-radius:8px;display:none;line-height:1.5}
.dd-fb.show{display:block}
.dd-fb.ok{background:var(--ok-bg);color:var(--ok)}
.dd-fb.bad{background:var(--bad-bg);color:var(--bad)}
.dd-fb.part{background:var(--gold-bg);color:#7a5800}

/* SELF-ASSESSMENT */
.selfcheck{display:flex;flex-direction:column;gap:.55rem;margin:.8rem 0}
.sc-row{display:flex;align-items:center;gap:.8rem;background:var(--surface);border:1.5px solid var(--border);border-radius:9px;padding:.65rem .9rem;flex-wrap:wrap}
.sc-topic{flex:1;font-size:.85rem;color:var(--text);min-width:160px}
.sc-btns{display:flex;gap:.35rem;flex-shrink:0}
.sc-btn{padding:.28rem .75rem;border-radius:6px;border:1.5px solid var(--border);background:var(--surface2);font-size:.76rem;font-weight:600;cursor:pointer;font-family:inherit;color:var(--text2);transition:all .15s}
.sc-btn.sel-ok{background:var(--ok);border-color:var(--ok);color:#fff}
.sc-btn.sel-med{background:var(--gold);border-color:var(--gold);color:#1a1a00}
.sc-btn.sel-bad{background:var(--bad);border-color:var(--bad);color:#fff}

/* PREVIEW WIDGETS */
.preview-widget{background:var(--surface);border:1.5px solid var(--border);border-radius:14px;padding:1.2rem 1.4rem;margin:1.2rem 0;overflow:hidden}
.pw-label{font-size:.65rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:.3rem}
.pw-title{font-family:'Crimson Pro',serif;font-size:1.15rem;font-weight:700;margin-bottom:.25rem;color:var(--text)}
.pw-sub{font-size:.8rem;color:var(--text3);margin-bottom:.9rem;line-height:1.5}
.pw-canvas{width:100%;border-radius:10px;background:var(--surface2);display:block}
.pw-ctrl{display:flex;align-items:center;gap:.75rem;margin:.75rem 0;flex-wrap:wrap}
.pw-slider-label{font-size:.8rem;color:var(--text3);min-width:100px;flex-shrink:0}
.pw-slider{flex:1;min-width:140px;accent-color:var(--green)}
.pw-val{font-family:'IBM Plex Mono',monospace;font-size:.92rem;color:var(--green-dark);font-weight:700;min-width:80px;text-align:right;flex-shrink:0}
.pw-eq{font-family:'IBM Plex Mono',monospace;font-size:1rem;font-weight:700;color:var(--green-dark);text-align:center;padding:.5rem;background:var(--green-bg);border-radius:8px;margin:.5rem 0;letter-spacing:.04em}
.pw-insight{font-size:.8rem;color:var(--text3);margin-top:.6rem;padding:.65rem .9rem;background:var(--green-bg);border-radius:8px;line-height:1.55}
.pw-insight strong{color:var(--green-dark)}

.dlbtn{background:var(--green);color:#fff;border:none;border-radius:10px;padding:.8rem 1.8rem;font-size:.95rem;font-weight:600;cursor:pointer;transition:background .18s}
.dlbtn:hover{background:var(--green-dark)}
.dlbtn:disabled{opacity:.6;cursor:wait}

@media(max-width:600px){
  .wcard{padding:1.6rem 1.1rem}
  .dd-bins.cols2{grid-template-columns:1fr 1fr}
  .lbody{padding:1.2rem .7rem 3rem}
  .section h2{font-size:1.3rem}
  .htitle{display:none}
  .lang-btn{padding:.26rem .48rem;font-size:.68rem}
  .rm-row{flex-direction:column;gap:.3rem}
  .pw-ctrl{flex-direction:column;align-items:flex-start}
  .pw-val{text-align:left}
}
</style>
</head>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <div style="font-family:'Crimson Pro',serif;font-size:2rem;font-weight:700;letter-spacing:.06em;color:var(--green);line-height:1">ALEXIS</div>
    </div>
    <div class="wtitle" id="w-title">Introducción a Matemáticas Básicas</div>
    <div class="wcourse" id="w-course">Matemáticas Básicas · Semana 1</div>
    <label class="flabel" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name">
    <label class="flabel" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 1A" autocomplete="off">
    <button class="sbtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr">
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div></div>
    <div style="display:flex;justify-content:center;padding-top:.9rem">
      <svg width="160" height="52" viewBox="0 0 180 52" xmlns="http://www.w3.org/2000/svg">
        <polyline points="5,40 14,28 24,33 36,14" fill="none" stroke="#1a4a8a" stroke-width="3"/>
        <circle cx="36" cy="14" r="4.5" fill="#c9a84c"/>
        <line x1="52" y1="6" x2="52" y2="46" stroke="#c9a84c" stroke-width="2.5"/>
        <text x="64" y="38" font-family="'Crimson Pro',serif" font-weight="700" font-size="28" letter-spacing="2" fill="#1a4a8a">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo -->
      <img id="hlogo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle" id="h-title">Introducción a Matemáticas Básicas</div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle">
      <button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button>
      <button class="lang-btn"        id="btn-en" onclick="setLang('en')">EN</button>
    </div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>
  <div class="section" id="s_results" style="display:none">
    <div style="text-align:center;padding:2rem 1rem">
      <button class="dlbtn" id="dlBtn" onclick="generatePDF()">⬇ &nbsp;<span id="pdf-lbl">Descargar resultados en PDF</span></button>
    </div>
  </div>
</div>

<script>
var LANG='es',studentName='',studentGroup='';
var activityScores={dd1:null,sc1:null};

function setLang(l){
  LANG=l;
  document.getElementById('btn-es').className='lang-btn'+(l==='es'?' active':'');
  document.getElementById('btn-en').className='lang-btn'+(l==='en'?' active':'');
  document.getElementById('w-title').textContent=l==='es'?'Introducción a Matemáticas Básicas':'Introduction to Basic Mathematics';
  document.getElementById('w-course').textContent=l==='es'?'Matemáticas Básicas · Semana 1':'Basic Mathematics · Week 1';
  document.getElementById('h-title').textContent=l==='es'?'Introducción a Matemáticas Básicas':'Introduction to Basic Mathematics';
  document.getElementById('pdf-lbl').textContent=l==='es'?'Descargar resultados en PDF':'Download results as PDF';
  buildLesson();
}
function toggleTheme(){
  var d=document.documentElement,dark=d.getAttribute('data-theme')==='dark';
  d.setAttribute('data-theme',dark?'light':'dark');
  document.getElementById('themeBtn').textContent=dark?'🌙':'☀️';
  setTimeout(function(){drawSlope();drawExp();drawTip();drawQuadratic();},50);
}
function startLesson(){
  var n=document.getElementById('sName').value.trim();
  var g=document.getElementById('sGroup').value.trim();
  var err=document.getElementById('startErr');
  if(!n){err.textContent=LANG==='es'?'Por favor ingresa tu nombre.':'Please enter your name.';return;}
  if(!g){err.textContent=LANG==='es'?'Por favor ingresa tu grupo.':'Please enter your group.';return;}
  studentName=n;studentGroup=g;err.textContent='';
  document.getElementById('welcomeScreen').style.display='none';
  document.getElementById('lessonScreen').style.display='block';
  document.getElementById('studentChip').textContent=n+' · '+g;
  buildLesson();
  setTimeout(observeSections,200);
}
function updateProgress(){
  var scores=Object.values(activityScores);
  var done=scores.filter(function(s){return s!==null;}).length;
  document.getElementById('progFill').style.width=Math.round(done/scores.length*100)+'%';
  if(done===scores.length){
    var res=document.getElementById('s_results');
    res.style.display='block';
    setTimeout(function(){res.classList.add('vis');},100);
  }
}
function observeSections(){
  if(!window.IntersectionObserver){document.querySelectorAll('.section').forEach(function(s){s.classList.add('vis');});return;}
  var obs=new IntersectionObserver(function(entries){entries.forEach(function(e){if(e.isIntersecting)e.target.classList.add('vis');});},{threshold:0.06});
  document.querySelectorAll('.section').forEach(function(s){obs.observe(s);});
}

// ── DRAG-DROP ENGINE ──
var _dragged=null,_tapped=null;
function ddStart(el){_dragged=el;if(_tapped){_tapped.style.outline='';_tapped=null;}setTimeout(function(){el.style.opacity='.4';},0);}
function ddEnd(el){el.style.opacity='';_dragged=null;}
function ddOver(e){e.preventDefault();e.currentTarget.classList.add('over');}
function ddLeave(e){e.currentTarget.classList.remove('over');}
function ddDrop(e,binId){
  e.preventDefault();e.currentTarget.classList.remove('over');
  if(!_dragged)return;
  var bin=document.getElementById(binId);if(!bin)return;
  _dragged.style.opacity='';bin.appendChild(_dragged);_dragged=null;
}
function ddDropPool(e,poolId){
  e.preventDefault();e.currentTarget.classList.remove('over');
  if(!_dragged)return;
  var pool=document.getElementById(poolId);if(!pool)return;
  _dragged.style.opacity='';pool.appendChild(_dragged);_dragged=null;
}
function chipTap(el,e){
  e.stopPropagation();
  if(el.parentElement&&el.parentElement.classList.contains('dd-bin')){
    if(_tapped){_tapped.style.outline='';_tapped=null;}
    var binsEl=el.parentElement.parentElement,poolEl=null;
    if(binsEl){var sibs=binsEl.parentElement?binsEl.parentElement.childNodes:[];for(var i=0;i<sibs.length;i++){if(sibs[i].classList&&sibs[i].classList.contains('dd-pool')){poolEl=sibs[i];break;}}}
    if(poolEl)poolEl.appendChild(el);return;
  }
  if(_tapped===el){_tapped.style.outline='';_tapped=null;return;}
  if(_tapped)_tapped.style.outline='';
  _tapped=el;el.style.outline='2px solid var(--gold)';
}
function binTap(binId){
  if(!_tapped)return;
  var bin=document.getElementById(binId);if(!bin)return;
  _tapped.style.outline='';bin.appendChild(_tapped);_tapped=null;
}
function seededRng(seed){var s=seed;return function(){s=(s*16807)%2147483647;return(s-1)/2147483646;};}
function shuffle(arr,rng){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(rng()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
var rng=seededRng(Date.now()%999+1);

// ── CANVAS HELPERS ──
function gc(){
  var style=getComputedStyle(document.documentElement);
  return{
    green: style.getPropertyValue('--green').trim()||'#1a4a8a',
    greenDark:style.getPropertyValue('--green-dark').trim()||'#2d5a27',
    greenBg:style.getPropertyValue('--green-bg').trim()||'#eaf0e7',
    gold:  style.getPropertyValue('--gold').trim()||'#c9a84c',
    goldBg:style.getPropertyValue('--gold-bg').trim()||'#faf3e0',
    bg:    style.getPropertyValue('--bg').trim()||'#f8f6f1',
    surface:style.getPropertyValue('--surface').trim()||'#fff',
    surface2:style.getPropertyValue('--surface2').trim()||'#f0ede6',
    border:style.getPropertyValue('--border').trim()||'#ddd8cc',
    text:  style.getPropertyValue('--text').trim()||'#1a1a16',
    text2: style.getPropertyValue('--text2').trim()||'#4a4640',
    text3: style.getPropertyValue('--text3').trim()||'#7a7468',
    ok:    style.getPropertyValue('--ok').trim()||'#1e7d45',
    bad:   style.getPropertyValue('--bad').trim()||'#c0321a',
  };
}
function drawGrid(ctx,W,H,ox,oy,scaleX,scaleY,col,xMin,xMax,yMin,yMax){
  ctx.strokeStyle=col.border;ctx.lineWidth=1;ctx.setLineDash([3,4]);
  // vertical grid lines
  for(var x=Math.ceil(xMin);x<=xMax;x++){
    var px=ox+x*scaleX;
    ctx.beginPath();ctx.moveTo(px,4);ctx.lineTo(px,H-20);ctx.stroke();
  }
  // horizontal grid lines
  for(var y=Math.ceil(yMin);y<=yMax;y++){
    var py=oy-y*scaleY;
    if(py<4||py>H-20)continue;
    ctx.beginPath();ctx.moveTo(4,py);ctx.lineTo(W-4,py);ctx.stroke();
  }
  ctx.setLineDash([]);
  // axes
  ctx.strokeStyle=col.text3;ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(4,oy);ctx.lineTo(W-4,oy);ctx.stroke();
  ctx.beginPath();ctx.moveTo(ox,4);ctx.lineTo(ox,H-20);ctx.stroke();
  // axis labels
  ctx.font='10px IBM Plex Mono,monospace';ctx.fillStyle=col.text3;ctx.textAlign='center';
  for(var xl=Math.ceil(xMin);xl<=xMax;xl++){
    if(xl===0)continue;
    var pxl=ox+xl*scaleX;
    ctx.fillText(xl,pxl,oy+13);
  }
  ctx.textAlign='right';
  for(var yl=Math.ceil(yMin);yl<=yMax;yl++){
    if(yl===0)continue;
    var pyl=oy-yl*scaleY;
    if(pyl<4||pyl>H-20)continue;
    ctx.fillText(yl,ox-4,pyl+4);
  }
  ctx.textAlign='left';
  // axis name labels
  ctx.fillStyle=col.text3;ctx.font='11px IBM Plex Sans,sans-serif';
  ctx.fillText('x',W-14,oy-5);
  ctx.fillText('y',ox+5,10);
}

  document.getElementById('slopeMVal').textContent=m;
  document.getElementById('slopeBVal').textContent=b;
  var sign=b>=0?'+':'-';
  document.getElementById('slopeEq').textContent='y = '+m+'·x '+sign+' '+Math.abs(b);

  ctx.clearRect(0,0,W,H);
  ctx.fillStyle=col.surface2;ctx.fillRect(0,0,W,H);

  // coordinate space: x ∈ [-5,5], y ∈ [-5,5]
  var xMin=-5,xMax=5,yMin=-5,yMax=5;
  var ox=W/2,oy=H/2;
  var sx=(W-60)/(xMax-xMin),sy=(H-40)/(yMax-yMin);

  drawGrid(ctx,W,H,ox,oy,sx,sy,col,xMin,xMax,yMin,yMax);

  // draw line y=mx+b
  ctx.strokeStyle=col.green;ctx.lineWidth=2.5;ctx.setLineDash([]);
  ctx.beginPath();
  var x0=xMin,y0=m*x0+b;
  var x1=xMax,y1=m*x1+b;
  ctx.moveTo(ox+x0*sx,oy-y0*sy);
  ctx.lineTo(ox+x1*sx,oy-y1*sy);
  ctx.stroke();

  // y-intercept dot
  ctx.fillStyle=col.gold;
  ctx.beginPath();ctx.arc(ox,oy-b*sy,6,0,Math.PI*2);ctx.fill();
  ctx.font='bold 11px IBM Plex Mono,monospace';ctx.fillStyle=col.gold;
  ctx.fillText('b='+b,ox+9,oy-b*sy-8);

  // figure walking along line at x=2
  var fx=2,fy=m*fx+b;
  if(fy>yMax-0.5)fy=yMax-0.5;
  if(fy<yMin+0.5)fy=yMin+0.5;
  var fpx=ox+fx*sx,fpy=oy-fy*sy;
  var angle=Math.atan(m)*-1;
  var fatigue=Math.min(Math.abs(m)/4,1);
  var bodyColor=fatigue>0.7?col.bad:fatigue>0.35?col.gold:col.greenDark;

  ctx.save();ctx.translate(fpx,fpy);ctx.rotate(angle);
  // shadow
  ctx.fillStyle='rgba(0,0,0,0.1)';ctx.beginPath();ctx.ellipse(0,4,12,4,0,0,Math.PI*2);ctx.fill();
  // legs
  ctx.strokeStyle=bodyColor;ctx.lineWidth=2.5;ctx.lineCap='round';
  var walk=m>0?4:-4;
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-6+walk,-18);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(6-walk,-16);ctx.stroke();
  // body
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-30);ctx.stroke();
  // arms lean
  ctx.beginPath();ctx.moveTo(0,-20);ctx.lineTo(-12,-14+fatigue*6);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,-20);ctx.lineTo(12,-16+fatigue*6);ctx.stroke();
  // head
  ctx.beginPath();ctx.arc(0,-36,7,0,Math.PI*2);ctx.fillStyle=bodyColor;ctx.fill();
  // face
  ctx.strokeStyle='#fff';ctx.lineWidth=1.5;
  if(fatigue>0.5){ctx.beginPath();ctx.arc(0,-35,2.5,0.3,Math.PI-0.3);ctx.stroke();}
  else{ctx.beginPath();ctx.arc(0,-36,2.5,0,Math.PI);ctx.stroke();}
  // sweat if steep
  if(fatigue>0.6){
    ctx.fillStyle='#74b9ff';
    for(var i=0;i<3;i++){ctx.beginPath();ctx.arc(9+i*5,-38+i*3,2,0,Math.PI*2);ctx.fill();}
  }
  ctx.restore();

  // slope arrow annotation
  if(m!==0){
    var arrowX=ox-1.5*sx,arrowY1=oy-m*(-1.5)*sy,arrowY2=arrowY1-m*sy;
    ctx.strokeStyle=col.bad;ctx.lineWidth=1.5;ctx.setLineDash([4,3]);
    ctx.beginPath();ctx.moveTo(arrowX,arrowY1);ctx.lineTo(arrowX+sx,arrowY1);ctx.lineTo(arrowX+sx,arrowY2);ctx.stroke();
    ctx.setLineDash([]);
    ctx.font='bold 10px IBM Plex Mono,monospace';ctx.fillStyle=col.bad;
    ctx.fillText('Δy='+m,arrowX+sx+4,(arrowY1+arrowY2)/2);
    ctx.fillText('Δx=1',arrowX+sx/2-12,arrowY1+13);
  }

  // insight
  var ins=document.getElementById('slopeInsight');
  if(m===0)ins.innerHTML=(es?'<strong>m=0:</strong> la recta es horizontal — y siempre vale <strong>'+b+'</strong>, sin importar x. Sin pendiente, sin cambio.':'<strong>m=0:</strong> the line is horizontal — y always equals <strong>'+b+'</strong>, no matter x. No slope, no change.');
  else if(m>0)ins.innerHTML=(es?'<strong>m='+m+':</strong> pendiente positiva — por cada unidad que x avanza, y sube '+m+'. La persona sube la cuesta. En negocios: ingresos que crecen con las ventas.':'<strong>m='+m+':</strong> positive slope — for every 1 unit x increases, y increases by '+m+'. In business: revenue growing with sales.');
  else ins.innerHTML=(es?'<strong>m='+m+':</strong> pendiente negativa — por cada unidad que x avanza, y baja '+Math.abs(m)+'. La persona baja la cuesta. En negocios: costos que caen con economías de escala.':'<strong>m='+m+':</strong> negative slope — for every 1 unit x increases, y decreases by '+Math.abs(m)+'. In business: costs falling with economies of scale.');
}

// ════════════════════════════════════════
// WIDGET 2 — EXPONENTIAL  y = aˣ
// ════════════════════════════════════════
function drawExp(){
  var c=document.getElementById('expCanvas');if(!c)return;
  var ctx=c.getContext('2d'),W=c.width,H=c.height,col=gc(),es=LANG==='es';
  var xVal=parseFloat(document.getElementById('expX').value);
  var a=parseFloat(document.getElementById('expA').value);
  document.getElementById('expXVal').textContent='x = '+xVal.toFixed(1);
  document.getElementById('expAVal').textContent='a = '+a.toFixed(1);
  document.getElementById('expEq').textContent='y = '+a.toFixed(1)+'ˣ   →   y('+xVal.toFixed(1)+') = '+Math.pow(a,xVal).toFixed(2);

  ctx.clearRect(0,0,W,H);
  ctx.fillStyle=col.surface2;ctx.fillRect(0,0,W,H);

  // space: x ∈ [0,6], y ∈ [0,65]
  var xMin=0,xMax=6,yMax=Math.pow(a,6)+2,yMin=0;
  var padL=52,padR=16,padT=16,padB=30;
  var sx=(W-padL-padR)/(xMax-xMin);
  var sy=(H-padT-padB)/(yMax-yMin);
  var ox=padL,oy=H-padB;

  function px(x){return ox+x*sx;}
  function py(y){return oy-Math.min(y,yMax)*sy;}

  // grid
  ctx.strokeStyle=col.border;ctx.lineWidth=1;ctx.setLineDash([3,4]);
  for(var gx=0;gx<=6;gx++){ctx.beginPath();ctx.moveTo(px(gx),padT);ctx.lineTo(px(gx),oy);ctx.stroke();}
  var ySteps=[1,2,5,10,20,50,100];
  var yStep=ySteps.find(function(s){return yMax/s<=8;})||10;
  for(var gy=0;gy<=yMax;gy+=yStep){
    var pyg=py(gy);if(pyg<padT)break;
    ctx.beginPath();ctx.moveTo(ox,pyg);ctx.lineTo(W-padR,pyg);ctx.stroke();
  }
  ctx.setLineDash([]);
  // axes
  ctx.strokeStyle=col.text3;ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(ox,padT);ctx.lineTo(ox,oy);ctx.lineTo(W-padR,oy);ctx.stroke();
  // labels
  ctx.font='10px IBM Plex Mono,monospace';ctx.fillStyle=col.text3;ctx.textAlign='center';
  for(var lx=0;lx<=6;lx++)ctx.fillText(lx,px(lx),oy+14);
  ctx.textAlign='right';
  for(var ly=0;ly<=yMax;ly+=yStep){var ply=py(ly);if(ply<padT)break;ctx.fillText(ly,ox-4,ply+4);}
  ctx.textAlign='left';
  ctx.fillStyle=col.text3;ctx.font='11px IBM Plex Sans,sans-serif';
  ctx.fillText('x',W-padR+2,oy-4);ctx.fillText('y',ox+4,padT+8);

  // fill under curve (area feeling)
  ctx.beginPath();ctx.moveTo(px(xMin),oy);
  for(var xi=0;xi<=200;xi++){
    var xp=xMin+xi*(xMax-xMin)/200;
    var yp=Math.pow(a,xp);
    ctx.lineTo(px(xp),py(yp));
  }
  ctx.lineTo(px(xMax),oy);ctx.closePath();
  ctx.fillStyle='rgba(74,124,63,0.08)';ctx.fill();

  // curve
  ctx.beginPath();ctx.moveTo(px(xMin),py(Math.pow(a,xMin)));
  for(var xi2=1;xi2<=200;xi2++){
    var xp2=xMin+xi2*(xMax-xMin)/200;
    ctx.lineTo(px(xp2),py(Math.pow(a,xp2)));
  }
  ctx.strokeStyle=col.green;ctx.lineWidth=3;ctx.setLineDash([]);ctx.stroke();

  // vertical line from xVal to curve
  var yAtX=Math.pow(a,xVal);
  ctx.strokeStyle=col.bad;ctx.lineWidth=1.5;ctx.setLineDash([5,4]);
  ctx.beginPath();ctx.moveTo(px(xVal),oy);ctx.lineTo(px(xVal),py(yAtX));ctx.stroke();
  ctx.beginPath();ctx.moveTo(ox,py(yAtX));ctx.lineTo(px(xVal),py(yAtX));ctx.stroke();
  ctx.setLineDash([]);

  // dot on curve
  ctx.fillStyle=col.bad;
  ctx.beginPath();ctx.arc(px(xVal),py(yAtX),7,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.font='bold 10px IBM Plex Mono,monospace';ctx.textAlign='center';
  ctx.fillText('•',px(xVal),py(yAtX)+4);ctx.textAlign='left';

  // value callout box
  var valStr=yAtX>=100?yAtX.toFixed(1):yAtX.toFixed(2);
  ctx.fillStyle=col.bad;ctx.font='bold 12px IBM Plex Mono,monospace';
  var bxPos=px(xVal)+10,byPos=py(yAtX)-10;
  if(bxPos>W-90)bxPos=px(xVal)-90;
  if(byPos<padT+10)byPos=py(yAtX)+20;
  ctx.fillText('y = '+valStr,bxPos,byPos);

  // growth rate arrow: show dy at current x vs x-1
  if(xVal>=1){
    var yPrev=Math.pow(a,xVal-1);
    var growthPct=((yAtX-yPrev)/yPrev*100).toFixed(0);
    ctx.font='11px IBM Plex Sans,sans-serif';ctx.fillStyle=col.gold;
    ctx.fillText('+'+(es?'crece':'grows')+' '+growthPct+'%',px(Math.max(xVal-0.5,0))+4,py((yAtX+yPrev)/2));
  }

  var ins=document.getElementById('expInsight');
  var yStr=yAtX>=1000?(yAtX/1000).toFixed(1)+'k':yAtX.toFixed(2);
  if(xVal<=1)ins.innerHTML=(es?'Al inicio la curva parece casi plana — <strong>y='+yStr+'</strong>. El crecimiento exponencial empieza despacio.':'At the start the curve looks almost flat — <strong>y='+yStr+'</strong>. Exponential growth starts slowly.');
  else if(xVal<=3)ins.innerHTML=(es?'Ya se nota la curva. En x='+xVal.toFixed(1)+', <strong>y='+yStr+'</strong>. Cada paso multiplica el anterior — no lo suma.':'The curve is taking shape. At x='+xVal.toFixed(1)+', <strong>y='+yStr+'</strong>. Each step multiplies the previous — it doesn\'t add to it.');
  else ins.innerHTML=(es?'¡La curva se dispara! En x='+xVal.toFixed(1)+', <strong>y='+yStr+'</strong>. Esto es lo que hace especial a la función exponencial: el crecimiento <em>se alimenta de sí mismo</em>.':'The curve explodes! At x='+xVal.toFixed(1)+', <strong>y='+yStr+'</strong>. This is what makes exponential functions special: growth <em>feeds on itself</em>.');
}

// ════════════════════════════════════════
// WIDGET 3 — TIP / PERCENTAGE (money to trash)
// ════════════════════════════════════════
var _tipAnim=0,_tipAnimFrame=null;
function drawTip(){
  var pct=parseInt(document.getElementById('tipPct').value);
  document.getElementById('tipPctVal').textContent=pct+'%';
  _tipAnim=0;
  if(_tipAnimFrame)cancelAnimationFrame(_tipAnimFrame);
  animateTip(pct);
}
function animateTip(pct){
  var c=document.getElementById('tipCanvas');if(!c)return;
  var ctx=c.getContext('2d'),W=c.width,H=c.height,col=gc(),es=LANG==='es';
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle=col.surface2;ctx.fillRect(0,0,W,H);

  var food=320,tax=food*0.16,total=food+tax;
  var tipFood=food*pct/100,tipTotal=total*pct/100,diff=tipTotal-tipFood;

  // table surface
  ctx.fillStyle='#8B6914';ctx.fillRect(0,H-55,W,55);
  ctx.fillStyle='#7A5C10';ctx.fillRect(0,H-60,W,8);

  // ── Left side: correct tip (jar) ──
  var jarX=W*0.18,jarY=H-58;
  // jar body
  ctx.fillStyle='rgba(120,200,255,0.25)';ctx.strokeStyle='#5590aa';ctx.lineWidth=2;
  ctx.beginPath();ctx.roundRect(jarX-22,jarY-60,44,62,6);ctx.fill();ctx.stroke();
  // jar label
  ctx.font='bold 11px IBM Plex Sans,sans-serif';ctx.fillStyle=col.greenDark;
  ctx.textAlign='center';ctx.fillText(es?'Propina':'Tip jar',jarX,jarY-68);
  // tip amount in jar
  var fillH=Math.min(tipFood/60*48,50);
  ctx.fillStyle='rgba(30,125,69,0.3)';ctx.beginPath();ctx.roundRect(jarX-21,jarY-2-fillH,42,fillH,4);ctx.fill();
  ctx.font='bold 13px IBM Plex Mono,monospace';ctx.fillStyle=col.ok;
  ctx.fillText('$'+tipFood.toFixed(2),jarX,jarY-70+14);

  // ── Right side: trash can ──
  var trashX=W*0.82,trashY=H-58;
  // can body
  ctx.fillStyle='#666';ctx.strokeStyle='#444';ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(trashX-26,trashY-50);ctx.lineTo(trashX-22,trashY);ctx.lineTo(trashX+22,trashY);ctx.lineTo(trashX+26,trashY-50);
  ctx.closePath();ctx.fill();ctx.stroke();
  // lid
  ctx.fillStyle='#555';ctx.strokeStyle='#333';
  ctx.beginPath();ctx.roundRect(trashX-30,trashY-58,60,12,3);ctx.fill();ctx.stroke();
  ctx.fillStyle='#777';ctx.beginPath();ctx.roundRect(trashX-10,trashY-64,20,10,3);ctx.fill();ctx.stroke();
  // stripes
  ctx.strokeStyle='#888';ctx.lineWidth=1;
  for(var s=0;s<3;s++){
    var sx=trashX-15+s*15;
    ctx.beginPath();ctx.moveTo(sx,-22+trashY);ctx.lineTo(sx-2,-4+trashY);ctx.stroke();
  }
  ctx.font='bold 11px IBM Plex Sans,sans-serif';ctx.fillStyle=col.bad;
  ctx.fillText(es?'Basura':'Trash',trashX,trashY-72);

  // ── Animated flying bill ──
  _tipAnim=Math.min(_tipAnim+0.022,1);
  // bill arc from center-left to trash
  var t=_tipAnim;
  var startX=W*0.5,startY=H*0.35;
  var endX=trashX,endY=trashY-55;
  var ctrlX=W*0.65,ctrlY=H*0.05;
  var billX=(1-t)*(1-t)*startX+2*(1-t)*t*ctrlX+t*t*endX;
  var billY=(1-t)*(1-t)*startY+2*(1-t)*t*ctrlY+t*t*endY;
  var billAngle=t*Math.PI*1.5;
  var billAlpha=t<0.85?1:1-(t-0.85)/0.15;

  ctx.save();ctx.globalAlpha=billAlpha;
  ctx.translate(billX,billY);ctx.rotate(billAngle);
  // bill
  ctx.fillStyle='#6a9fd8';ctx.strokeStyle='#1a4a8a';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.roundRect(-24,-14,48,28,4);ctx.fill();ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,0.3)';ctx.beginPath();ctx.roundRect(-20,-10,40,20,3);ctx.fill();
  ctx.font='bold 12px IBM Plex Mono,monospace';ctx.fillStyle='#1a5a10';ctx.textAlign='center';
  ctx.fillText('$'+diff.toFixed(2),0,5);
  ctx.restore();ctx.globalAlpha=1;

  // ── Labels ──
  // Left label: correct
  ctx.font='12px IBM Plex Sans,sans-serif';ctx.fillStyle=col.text2;ctx.textAlign='center';
  ctx.fillText(es?'Propina correcta:':'Correct tip:',W*0.28,H*0.28);
  ctx.font='bold 16px IBM Plex Mono,monospace';ctx.fillStyle=col.ok;
  ctx.fillText('$'+tipFood.toFixed(2),W*0.28,H*0.28+20);
  ctx.font='11px IBM Plex Sans,sans-serif';ctx.fillStyle=col.text3;
  ctx.fillText(pct+'% de $320',W*0.28,H*0.28+36);

  // Center arrow → trash
  ctx.font='bold 12px IBM Plex Sans,sans-serif';ctx.fillStyle=col.bad;
  ctx.fillText(es?'Propina sobre total:':'Tip on total:',W*0.5,H*0.28);
  ctx.font='bold 16px IBM Plex Mono,monospace';ctx.fillStyle=col.bad;
  ctx.fillText('$'+tipTotal.toFixed(2),W*0.5,H*0.28+20);
  ctx.font='11px IBM Plex Sans,sans-serif';ctx.fillStyle=col.text3;
  ctx.fillText(pct+'% de $'+total.toFixed(2),W*0.5,H*0.28+36);
  // Extra going to trash
  ctx.font='bold 13px IBM Plex Mono,monospace';ctx.fillStyle=col.bad;
  ctx.fillText('+$'+diff.toFixed(2)+' → 🗑',W*0.5,H*0.28+54);

  if(_tipAnim<1){_tipAnimFrame=requestAnimationFrame(function(){animateTip(pct);});}

  // insight
  var ins=document.getElementById('tipInsight');
  ins.innerHTML=(es?
    'Con <strong>'+pct+'%</strong>: propina correcta (sobre $320) = <strong>$'+tipFood.toFixed(2)+'</strong>. Propina sobre el total ($371.20) = <strong>$'+tipTotal.toFixed(2)+'</strong>. Diferencia: <strong>$'+diff.toFixed(2)+'</strong> que pagaste de más. Mismo porcentaje, diferente base → diferente resultado.':
    'With <strong>'+pct+'%</strong>: correct tip (on $320) = <strong>$'+tipFood.toFixed(2)+'</strong>. Tip on total ($371.20) = <strong>$'+tipTotal.toFixed(2)+'</strong>. Difference: <strong>$'+diff.toFixed(2)+'</strong> overpaid. Same percentage, different base → different result.');
}

// ════════════════════════════════════════
// WIDGET 4 — QUADRATIC OPTIMIZATION
// ════════════════════════════════════════
function drawQuadratic(){
  var c=document.getElementById('quadCanvas');if(!c)return;
  var ctx=c.getContext('2d'),W=c.width,H=c.height,col=gc(),es=LANG==='es';
  var price=parseInt(document.getElementById('quadP').value);
  document.getElementById('quadPVal').textContent='$'+price;

  // demand model: D(p) = max(0, 100 - p)  (linear demand)
  // variable cost v=15, fixed cost F=500
  var v=15,F=500;
  var demand=Math.max(0,100-price);
  var profit=(price-v)*demand-F;
  // optimal price: p* = (100+v)/2 = 57.5
  var pStar=Math.round((100+v)/2);
  var profitStar=(pStar-v)*(100-pStar)-F;

  document.getElementById('quadEq').textContent=
    'P($'+price+') = ($'+price+'−$'+v+') × '+demand+' − $'+F+' = $'+Math.round(profit);

  // ── Graph: profit parabola ──
  var padL=56,padR=16,padT=20,padB=36;
  var gW=W*0.55-padL-padR;var gH=H-padT-padB;
  var pMin=v+1,pMax=99;
  var profMin=-F-50,profMax=profitStar+100;
  var sx=gW/(pMax-pMin);var sy=gH/(profMax-profMin);
  var ox=padL,oy=padT+gH-(-profMin)*sy;

  function gpx(p){return ox+(p-pMin)*sx;}
  function gpy(pr){return Math.max(padT,Math.min(H-padB,padT+gH-(pr-profMin)*sy));}

  ctx.clearRect(0,0,W,H);ctx.fillStyle=col.surface2;ctx.fillRect(0,0,W,H);

  // grid area background
  ctx.fillStyle=col.surface;ctx.fillRect(padL,padT,gW+padL,gH);

  // zero line
  ctx.strokeStyle=col.border;ctx.lineWidth=1;ctx.setLineDash([4,4]);
  ctx.beginPath();ctx.moveTo(padL,gpy(0));ctx.lineTo(padL+gW,gpy(0));ctx.stroke();
  ctx.setLineDash([]);
  ctx.font='10px IBM Plex Mono,monospace';ctx.fillStyle=col.text3;ctx.textAlign='right';
  ctx.fillText('$0',padL-3,gpy(0)+4);

  // axes
  ctx.strokeStyle=col.text3;ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(padL,padT);ctx.lineTo(padL,padT+gH);ctx.lineTo(padL+gW,padT+gH);ctx.stroke();
  ctx.font='11px IBM Plex Sans,sans-serif';ctx.fillStyle=col.text3;ctx.textAlign='center';
  ctx.fillText(es?'precio ($)':'price ($)',padL+gW/2,padT+gH+26);
  ctx.save();ctx.translate(12,padT+gH/2);ctx.rotate(-Math.PI/2);ctx.fillText(es?'ganancia':'profit',0,0);ctx.restore();

  // x labels
  [20,30,40,50,60,70,80,90].forEach(function(p){
    var px2=gpx(p);if(px2<padL||px2>padL+gW)return;
    ctx.fillStyle=col.text3;ctx.textAlign='center';ctx.font='9px IBM Plex Mono,monospace';
    ctx.fillText('$'+p,px2,padT+gH+14);
  });

  // loss zone fill
  ctx.fillStyle='rgba(192,50,26,0.06)';
  ctx.beginPath();ctx.moveTo(padL,gpy(0));
  for(var pi=pMin;pi<=pMax;pi++){
    var pr2=(pi-v)*Math.max(0,100-pi)-F;
    if(pr2<0)ctx.lineTo(gpx(pi),gpy(pr2));
  }
  ctx.lineTo(padL+gW,gpy(0));ctx.closePath();ctx.fill();

  // profit curve
  ctx.beginPath();
  for(var pi2=pMin;pi2<=pMax;pi2++){
    var pr3=(pi2-v)*Math.max(0,100-pi2)-F;
    if(pi2===pMin)ctx.moveTo(gpx(pi2),gpy(pr3));
    else ctx.lineTo(gpx(pi2),gpy(pr3));
  }
  ctx.strokeStyle=col.green;ctx.lineWidth=2.5;ctx.stroke();

  // optimal price marker
  ctx.strokeStyle=col.gold;ctx.lineWidth=1.5;ctx.setLineDash([5,4]);
  ctx.beginPath();ctx.moveTo(gpx(pStar),padT);ctx.lineTo(gpx(pStar),padT+gH);ctx.stroke();
  ctx.setLineDash([]);
  ctx.font='bold 10px IBM Plex Sans,sans-serif';ctx.fillStyle=col.gold;ctx.textAlign='center';
  ctx.fillText('p*=$'+pStar,gpx(pStar),padT+10);

  // current price dot
  var curPr=(price-v)*demand-F;
  var dotColor=curPr>0?col.green:col.bad;
  ctx.fillStyle=dotColor;
  ctx.beginPath();ctx.arc(gpx(price),gpy(curPr),7,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.font='bold 9px sans-serif';ctx.textAlign='center';
  ctx.fillText('●',gpx(price),gpy(curPr)+3);

  // ── Right side: street scene ──
  var sceneX=W*0.6,sceneW=W-sceneX-8,sceneH=H;
  ctx.fillStyle=col.surface;ctx.fillRect(sceneX,0,sceneW,sceneH);
  ctx.strokeStyle=col.border;ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(sceneX,0);ctx.lineTo(sceneX,sceneH);ctx.stroke();

  // sidewalk
  ctx.fillStyle='#c8b89a';ctx.fillRect(sceneX,H-40,sceneW,40);
  ctx.fillStyle='#bba888';ctx.fillRect(sceneX,H-44,sceneW,6);

  // taco stand
  var standX=sceneX+sceneW*0.22,standY=H-44;
  // table
  ctx.fillStyle='#8B6914';ctx.fillRect(standX-28,standY-20,56,20);
  ctx.fillStyle='#A0791A';ctx.fillRect(standX-30,standY-25,60,8);
  // umbrella pole
  ctx.fillStyle='#555';ctx.fillRect(standX-2,standY-80,4,60);
  // umbrella
  ctx.fillStyle=col.green;
  ctx.beginPath();ctx.ellipse(standX,standY-82,38,14,0,Math.PI,0);ctx.fill();
  ctx.fillStyle=col.gold;
  ctx.beginPath();ctx.ellipse(standX,standY-82,20,8,0,Math.PI,0);ctx.fill();
  // sign
  ctx.fillStyle='#fff';ctx.strokeStyle=col.green;ctx.lineWidth=1.5;
  ctx.beginPath();ctx.roundRect(standX-22,standY-72,44,22,4);ctx.fill();ctx.stroke();
  ctx.font='bold 10px IBM Plex Mono,monospace';ctx.fillStyle=col.greenDark;ctx.textAlign='center';
  ctx.fillText('🌮 $'+price,standX,standY-57);

  // customers (more at optimal price, fewer at extremes)
  var customerCount=Math.max(0,Math.min(6,Math.round(demand/14)));
  var walkingAway=price>pStar+15||price<20;
  var emojis=[];
  for(var ci=0;ci<6;ci++){
    var cx2=sceneX+sceneW*0.55+ci*(sceneW*0.07);
    var cy2=H-52;
    if(ci<customerCount){
      // happy customer
      ctx.font='18px serif';ctx.textAlign='center';
      ctx.fillText('😊',cx2,cy2);
    } else if(!walkingAway){
      // empty spot
      ctx.font='16px serif';ctx.fillStyle=col.text3;
      ctx.fillText('·',cx2,cy2);
    } else {
      // walking away
      ctx.font='18px serif';ctx.textAlign='center';
      ctx.fillText('🚶',cx2,cy2);
    }
  }

  // profit badge
  ctx.textAlign='center';
  var badgeColor=profit>0?col.ok:col.bad;
  ctx.fillStyle=badgeColor;
  ctx.beginPath();ctx.roundRect(sceneX+sceneW*0.5-40,H-H*0.72,80,28,6);ctx.fill();
  ctx.font='bold 13px IBM Plex Mono,monospace';ctx.fillStyle='#fff';
  ctx.fillText((profit>=0?'+':'')+'$'+Math.round(profit),sceneX+sceneW*0.5,H-H*0.72+19);
  ctx.font='10px IBM Plex Sans,sans-serif';ctx.fillStyle=badgeColor;
  ctx.fillText(profit>0?(es?'ganancia':'profit'):profit===0?(es?'equilibrio':'break-even'):(es?'pérdida':'loss'),sceneX+sceneW*0.5,H-H*0.72+40);

  ctx.textAlign='left';

  var ins=document.getElementById('quadInsight');
  if(profit<-200)ins.innerHTML=(es?'<strong>Precio $'+price+'</strong> — muy bajo. Vendes '+demand+' tacos pero la ganancia es <strong>$'+Math.round(profit)+'</strong>. Los costos fijos te destrozan.':'<strong>Price $'+price+'</strong> — too low. You sell '+demand+' tacos but profit is <strong>$'+Math.round(profit)+'</strong>. Fixed costs destroy you.');
  else if(profit<0)ins.innerHTML=(es?'<strong>Precio $'+price+'</strong> — todavía en pérdida ($'+Math.round(profit)+'). El precio óptimo es <strong>$'+pStar+'</strong>, donde la ganancia es máxima ($'+Math.round(profitStar)+').':'<strong>Price $'+price+'</strong> — still at a loss ($'+Math.round(profit)+'). Optimal price is <strong>$'+pStar+'</strong>, where profit is maximum ($'+Math.round(profitStar)+').');
  else if(Math.abs(price-pStar)<=3)ins.innerHTML=(es?'🎯 <strong>¡Cerca del óptimo!</strong> Precio $'+price+', ganancia <strong>$'+Math.round(profit)+'</strong>. La función cuadrática tiene exactamente un máximo — y las matemáticas lo encuentran sin adivinar.':'🎯 <strong>Near the optimum!</strong> Price $'+price+', profit <strong>$'+Math.round(profit)+'</strong>. The quadratic function has exactly one maximum — and math finds it without guessing.');
  else if(profit>0&&price<pStar)ins.innerHTML=(es?'<strong>Precio $'+price+'</strong> — en ganancia ($'+Math.round(profit)+'), pero podrías ganar más subiendo el precio hasta $'+pStar+'.':'<strong>Price $'+price+'</strong> — profitable ($'+Math.round(profit)+'), but you could earn more by raising the price to $'+pStar+'.');
  else if(demand===0)ins.innerHTML=(es?'<strong>Precio $'+price+'</strong> — ¡nadie compra! La demanda cae a cero. Subiste demasiado el precio.':'<strong>Price $'+price+'</strong> — nobody buys! Demand falls to zero. You raised the price too much.');
  else ins.innerHTML=(es?'<strong>Precio $'+price+'</strong> — en ganancia ($'+Math.round(profit)+'), pero la demanda ('+demand+' tacos) cae. El precio óptimo es $'+pStar+'.':'<strong>Price $'+price+'</strong> — profitable ($'+Math.round(profit)+'), but demand ('+demand+' tacos) falls. Optimal price is $'+pStar+'.');
}

// ════════════════════════════════════════
// ACTIVITY 1 CHECK
// ════════════════════════════════════════
function checkDD1(){
  var cats=['nat','ent','rac','irr'],correct=0,total=0;
  cats.forEach(function(cat){
    document.getElementById('bin1-'+cat).querySelectorAll('.dd-chip').forEach(function(chip){
      total++;var ok=chip.dataset.ans===cat;
      chip.classList.remove('ok-chip','bad-chip');chip.classList.add(ok?'ok-chip':'bad-chip');
      chip.style.pointerEvents='none';if(ok)correct++;
    });
  });
  var fb=document.getElementById('fb1'),es=LANG==='es';
  if(total<8){fb.className='dd-fb show part';fb.textContent=(es?'⚠ Coloca todos los números antes de verificar.':'⚠ Place all numbers before checking.');return;}
  if(correct===total){fb.className='dd-fb show ok';fb.textContent=(es?'✓ ¡Perfecto! Todos los números están en el conjunto correcto.':'✓ Perfect! All numbers are in the correct set.');}
  else{fb.className='dd-fb show bad';fb.textContent=(es?'Obtuviste '+correct+' de '+total+' correctos. Los que están en rojo van en otro conjunto.':'You got '+correct+' of '+total+' correct. Red ones belong to a different set.');}
  activityScores.dd1=correct/total;updateProgress();
  document.querySelector('#act1 .dd-check').disabled=true;
}
function resetDD1(){
  var pool=document.getElementById('pool1');
  ['nat','ent','rac','irr'].forEach(function(cat){
    document.getElementById('bin1-'+cat).querySelectorAll('.dd-chip').forEach(function(c){
      c.classList.remove('ok-chip','bad-chip');c.style.opacity='1';c.style.pointerEvents='';c.style.outline='';pool.appendChild(c);
    });
  });
  document.getElementById('fb1').className='dd-fb';
  var btn=document.querySelector('#act1 .dd-check');if(btn)btn.disabled=false;
  activityScores.dd1=null;updateProgress();
}

// ════════════════════════════════════════
// ACTIVITY 2: SELF-ASSESSMENT
// ════════════════════════════════════════
function scSelect(idx,level){
  window._scAnswers[idx]=level;
  var row=document.getElementById('scr'+idx);
  row.querySelectorAll('.sc-btn').forEach(function(b){b.className='sc-btn';});
  var btns=row.querySelectorAll('.sc-btn');
  if(level==='ok')btns[0].classList.add('sel-ok');
  if(level==='med')btns[1].classList.add('sel-med');
  if(level==='bad')btns[2].classList.add('sel-bad');
  var all=window._scAnswers.every(function(a){return a!==null;});
  if(all&&activityScores.sc1===null){
    activityScores.sc1=1;
    var fb=document.getElementById('fb2'),es=LANG==='es';
    var nOk=window._scAnswers.filter(function(a){return a==='ok';}).length;
    var nBad=window._scAnswers.filter(function(a){return a==='bad';}).length;
    fb.className='dd-fb show ok';
    if(nBad>=3)fb.textContent=(es?'¡Gracias por tu honestidad! Tienes varios temas por reforzar — para eso está diseñado este curso. El ritmo está pensado para recuperar esas bases.':'Thanks for your honesty! You have several areas to strengthen — that\'s exactly what this course is for.');
    else if(nOk>=4)fb.textContent=(es?'¡Buena base! Muchos conceptos te van a resultar familiares. Aprovecha esa ventaja para profundizar en los que aún no dominas.':'Great foundation! Many concepts will feel familiar. Use that advantage to go deeper on the ones you haven\'t mastered yet.');
    else fb.textContent=(es?'Tienes una base mixta — normal en este punto. Presta especial atención a las semanas que coincidan con tus áreas de mejora.':'You have a mixed foundation — normal at this point. Pay special attention to the weeks that match your areas for improvement.');
    updateProgress();
  }
}

}
