function stcRender(){
  if (!STC) return;
  var box = document.getElementById('stcBox');
  if (!box) return;
  var labels = [
    S('El hecho','The fact'),
    S('El derecho en juego','The right at stake'),
    S('Mi postura y compromiso','My stance and commitment')
  ];
  var slots = labels.map(function(l, k){
    var f = STC.filled[k];
    return '<div class="slot' + (f ? ' filled' : '') + '"><span class="slotlbl">' + l + '</span>' +
           (f ? f[LANG] : S('por armar','to be built')) + '</div>';
  }).join('');
  if (STC.done) {
    box.innerHTML = '<div class="wcase">' + STC.sit[LANG] + '</div>' +
      '<div class="slotgrid">' + slots + '</div>' +
      '<div class="wmsg ok">' +
      S('Así se sostiene una postura: nombras el hecho, dices qué derecho está en juego y te comprometes con una acción concreta y pacífica. Eso es lo que hicieron los movimientos que estudiaste.',
        'That is how a stance holds: you name the fact, you say which right is at stake and you commit to a concrete, peaceful action. That is what the movements you studied did.') +
      '</div>' +
      '<button class="wbtn" onclick="stcReset()">' + S('Armarla otra vez','Build it again') + '</button>';
    return;
  }
  var list = STC.frags.map(function(f, k){
    var used = false, i;
    for (i = 0; i < STC.filled.length; i++) if (STC.filled[i] === f) used = true;
    return '<div class="frag' + (used ? ' used' : '') + (STC.miss === k ? ' miss' : '') + '" onclick="stcPick(' + k + ')">' + f[LANG] + '</div>';
  }).join('');
  box.innerHTML =
    '<div class="wgt-q">' + S('Arma tu postura pieza por pieza. Ahora te toca: ','Build your stance piece by piece. Now you need: ') +
      '<strong>' + labels[STC.filled.length] + '</strong></div>' +
    '<div class="wcase">' + STC.sit[LANG] + '</div>' +
    '<div class="slotgrid">' + slots + '</div>' +
    '<div class="fraglist">' + list + '</div>' +
    '<div class="wmsg' + (STC.msgCls ? ' ' + STC.msgCls : '') + '">' +
      (STC.msg || S('Empieza por lo que cualquiera podría comprobar mirando la escena.','Start with what anybody could check just by looking at the scene.')) + '</div>' +
    (STC.filled.length > 0 ? '<button class="wbtn" onclick="stcUndo()">' + S('Quitar la última pieza','Remove the last piece') + '</button>' : '');
}
function stcPick(k){
  if (!STC || STC.done) return;
  var f = STC.frags[k], i;
  for (i = 0; i < STC.filled.length; i++) if (STC.filled[i] === f) return;
  var need = STC.filled.length;
  if (f.slot === need) {
    STC.filled.push(f); STC.tries = 0; STC.miss = -1;
    if (STC.filled.length === 3) { STC.done = true; }
    else {
      STC.msg = S('Encaja. Ahora sigue la siguiente pieza.','It fits. Now go for the next piece.');
      STC.msgCls = 'ok';
    }
  } else {
    STC.tries++; STC.miss = k;
    if (STC.tries >= 3) {
      var right = null;
      STC.frags.forEach(function(x){ if (x.slot === need) right = x; });
      STC.filled.push(right); STC.tries = 0; STC.miss = -1;
      STC.msg = S('Esta era la pieza: ','This was the piece: ') + '<strong>' + right[LANG] + '</strong>';
      STC.msgCls = 'warn';
      if (STC.filled.length === 3) STC.done = true;
    } else if (f.slot >= 0) {
      STC.msg = (need === 0)
        ? S('Esa pieza ya opina o ya propone. Primero hace falta el hecho: lo que cualquiera puede observar.',
            'That piece already judges or already proposes. First comes the fact: what anybody can observe.')
        : (need === 1
          ? S('Esa pieza no nombra un derecho. Di qué queda dañado cuando ocurre el hecho.',
              'That piece does not name a right. Say what is damaged when the fact happens.')
          : S('Esa pieza no dice qué vas a hacer. La postura termina en un compromiso concreto.',
              'That piece does not say what you will do. A stance ends in a concrete commitment.'));
      STC.msgCls = 'warn';
    } else {
      STC.msg = (LANG === 'es' ? f.nes : f.nen);
      STC.msgCls = 'warn';
    }
  }
  stcRender();
}
function stcUndo(){
  if (!STC || STC.filled.length === 0) return;
  STC.filled.pop(); STC.done = false; STC.tries = 0; STC.miss = -1;
  STC.msg = S('Pieza retirada. Puedes elegir otra.','Piece removed. You can choose another one.');
  STC.msgCls = null;
  stcRender();
}
function stcReset(){
  if (!STC) return;
  STC.filled = []; STC.tries = 0; STC.done = false; STC.msg = null; STC.msgCls = null; STC.miss = -1;
  stcRender();
}

    '<h2>' + S('Dónde quedó escrito cada reclamo','Where each demand was written down') + '</h2>' +
    '<p>' + S('Los documentos famosos son la huella que dejaron los movimientos. Ninguno se escribió en una tarde tranquila: cada uno recoge reclamos que venían de años atrás y de personas concretas.',
              'The famous documents are the mark the movements left behind. None was written on a quiet afternoon: each one gathers demands that came from years before and from specific people.') + '</p>' +
    '<div class="rules-grid">' +
      '<div class="rcard"><div class="rname">' + S('Francia, 1789','France, 1789') + '</div><div class="rform">' + S('igualdad ante la ley','equality before the law') + '</div><div class="rnote">' + S('Nadie nace con privilegios legales.','Nobody is born with legal privileges.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('México, 1917','Mexico, 1917') + '</div><div class="rform">' + S('derechos sociales','social rights') + '</div><div class="rnote">' + S('Educación, tierra y trabajo por escrito.','Education, land and labor in writing.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Naciones Unidas, 1948','United Nations, 1948') + '</div><div class="rform">' + S('lista común','shared list') + '</div><div class="rnote">' + S('Una referencia válida en todo el mundo.','A reference valid worldwide.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Naciones Unidas, 1989','United Nations, 1989') + '</div><div class="rform">' + S('derechos de la niñez','rights of the child') + '</div><div class="rnote">' + S('Protección especial hasta los 18 años.','Special protection until age 18.') + '</div></div>' +
    '</div>' +
    buildDocs(rng));
  docRender();

  /* ── PROBLEMA 8 ─────────────────────────────────────────────── */
  addProblem(pick([
    { title:{ es:'Un texto que se adelantó', en:'A text that went first' }, showWork:false,
      stmt:{ es:'La Constitución mexicana de 1917 escribió en su texto la jornada máxima de trabajo, el derecho a la educación y el reparto de la tierra. ¿Por qué se le reconoce importancia en la historia de los derechos humanos?',
             en:'The 1917 Mexican Constitution wrote into its text the maximum working day, the right to education and land distribution. Why is it recognized as important in the history of human rights?' },
      options:{ es:[
        'Porque fue la primera constitución del mundo en incluir derechos sociales nacidos de reclamos obreros y campesinos.',
        'Porque fue el primer documento redactado después de la Segunda Guerra Mundial en América.',
        'Porque sustituyó a la Declaración Universal de los Derechos Humanos en el continente americano.',
        'Porque fue el primer texto del mundo que reconoció el derecho al voto de las mujeres.' ],
        en:[
        'Because it was the first constitution in the world to include social rights born from worker and peasant demands.',
        'Because it was the first document drafted after the Second World War in America.',
        'Because it replaced the Universal Declaration of Human Rights on the American continent.',
        'Because it was the first text in the world to recognize the right of women to vote.' ] },
      correct:0,
      hint:{ es:'Compara su fecha con la de los otros documentos y fíjate en qué tipo de derechos incluyó.',
             en:'Compare its date with the other documents and look at which kind of rights it included.' },
      explanation:{ es:'En 1917, treinta y un años antes de la Declaración Universal, México puso por escrito derechos de trabajo, tierra y educación que hasta entonces ninguna constitución había reconocido.',
                    en:'In 1917, thirty one years before the Universal Declaration, Mexico put in writing labor, land and education rights that no constitution had recognized until then.' } },
    { title:{ es:'El documento que corresponde', en:'The matching document' }, showWork:false,
      stmt:{ es:'Un equipo debe explicar en qué documento quedó el acuerdo de los países para contar con una lista de derechos válida para toda persona en cualquier lugar, después de la Segunda Guerra Mundial. ¿Cuál corresponde?',
             en:'A team must explain in which document countries left their agreement to have a list of rights valid for every person anywhere, after the Second World War. Which one is it?' },
      options:{ es:[
        'La Declaración Universal de los Derechos Humanos, aprobada en 1948.',
        'La Declaración de los Derechos del Hombre y del Ciudadano, de 1789.',
        'La Constitución mexicana, promulgada en 1917.',
        'La Convención sobre los Derechos del Niño, aprobada en 1989.' ],
        en:[
        'The Universal Declaration of Human Rights, approved in 1948.',
        'The Declaration of the Rights of Man and of the Citizen, from 1789.',
        'The Mexican Constitution, enacted in 1917.',
        'The Convention on the Rights of the Child, approved in 1989.' ] },
      correct:0,
      hint:{ es:'Fíjate en dos datos del enunciado: después de la guerra mundial y para toda persona en cualquier lugar.',
             en:'Look at two clues in the statement: after the world war and for every person anywhere.' },
      explanation:{ es:'La Declaración Universal fue el acuerdo que los países firmaron en 1948 para tener una referencia común. Los otros textos son anteriores o se ocupan de un grupo o de un país en particular.',
                    en:'The Universal Declaration was the agreement countries signed in 1948 to have a shared reference. The other texts are earlier or deal with one group or one country in particular.' } }
  ], rng), rng);

  /* ── CONCEPTO 6 ─────────────────────────────────────────────── */
  addSection(S('CONCEPTO 6','CONCEPT 6'),
    '<h2>' + S('Tomar postura sin repetir consignas','Taking a stance without repeating slogans') + '</h2>' +
    '<p>' + S('Asumir una postura ética no es gritar más fuerte ni repetir lo que otros dicen. Es sostener una posición que se pueda explicar: parte de un hecho que cualquiera puede comprobar, nombra el derecho que está en juego y termina en un compromiso concreto.',
              'Taking an ethical stance is not shouting louder or repeating what others say. It is holding a position you can explain: it starts from a fact anybody can check, names the right at stake and ends in a concrete commitment.') + '</p>' +
    '<p>' + S('Los movimientos que estudiaste hicieron exactamente eso durante años, y por eso lograron que la ley cambiara. Arma tu propia postura pieza por pieza.',
              'The movements you studied did exactly that for years, and that is why they got the law to change. Build your own stance piece by piece.') + '</p>' +
    buildStance(rng));
  stcRender();

  /* ── CIERRE ─────────────────────────────────────────────────── */
  addSection(S('CIERRE','CLOSING'),
    '<h2>' + S('Ponlo a prueba','Put it to the test') + '</h2>');

  /* ── PROBLEMA 9 ─────────────────────────────────────────────── */
  addProblem(pick([
    (function(){
      var s = 20 + 5 * Math.floor(rng() * 4);
      var L = 30 + 5 * s;
      return { title:{ es:'La tira de la línea del tiempo', en:'The timeline strip' }, showWork:true,
        stmt:{ es:'Para su exposición, un grupo dibuja una línea del tiempo sobre una tira de papel de ' + L + ' cm de largo. Deja 15 cm libres en cada extremo y reparte el resto en 5 espacios iguales entre los seis hitos que va a colocar. ¿Cuántos centímetros mide cada espacio?',
               en:'For their exhibition, a group draws a timeline on a paper strip ' + L + ' cm long. They leave 15 cm free at each end and split the rest into 5 equal spaces between the six milestones they will place. How many centimeters does each space measure?' },
        options:{ es:[String(s), String(L / 5), String(s + 3), String(s - 5)],
                  en:[String(s), String(L / 5), String(s + 3), String(s - 5)] },
        correct:0,
        hint:{ es:'Quita primero lo que ocupan los dos márgenes y solo después reparte lo que queda.',
               en:'First take away what the two margins occupy and only then split what is left.' },
        explanation:{ es:'Los márgenes ocupan 15 + 15 = 30 cm, así que quedan ' + L + ' − 30 = ' + (L - 30) + ' cm para repartir entre 5 espacios: ' + (L - 30) + ' ÷ 5 = ' + s,
                      en:'The margins take 15 + 15 = 30 cm, so ' + L + ' − 30 = ' + (L - 30) + ' cm are left to split between 5 spaces: ' + (L - 30) + ' ÷ 5 = ' + s } };
    })(),
    (function(){
      var E = 6 + Math.floor(rng() * 5);
      var P = 4 + Math.floor(rng() * 6);
      var tot = 3 * E, ans = tot - P;
      return { title:{ es:'La exposición del grupo', en:'The group exhibition' }, showWork:true,
        stmt:{ es:'En una exposición sobre movimientos sociales participan ' + E + ' equipos y cada uno presenta 3 movimientos distintos. Hasta el momento se han presentado ' + P + ' movimientos. ¿Cuántos faltan por presentar?',
               en:'In an exhibition about social movements ' + E + ' teams take part and each one presents 3 different movements. So far ' + P + ' movements have been presented. How many are still to be presented?' },
        options:{ es:[String(ans), String(tot), String(ans + 3), String(ans - 3)],
                  en:[String(ans), String(tot), String(ans + 3), String(ans - 3)] },
        correct:0,
        hint:{ es:'Averigua primero cuántos movimientos habrá en total y después compara con los ya presentados.',
               en:'First find out how many movements there will be in total and then compare with those already presented.' },
        explanation:{ es:'En total serán 3 × ' + E + ' = ' + tot + ' movimientos. Como ya se presentaron ' + P + ', faltan ' + tot + ' − ' + P + ' = ' + ans,
                      en:'In total there will be 3 × ' + E + ' = ' + tot + ' movements. Since ' + P + ' have been presented, the ones missing are ' + tot + ' − ' + P + ' = ' + ans } };
    })()
  ], rng), rng);

  /* ── PROBLEMA 10 ────────────────────────────────────────────── */
  addProblem(pick([
    { title:{ es:'Tu postura frente a la crítica', en:'Your stance against the critique' }, showWork:false,
      stmt:{ es:'Al terminar su investigación, un equipo escribe: “Los movimientos sociales solo causan desorden; sería mejor esperar a que las autoridades corrijan las injusticias por su cuenta.” ¿Qué postura ética resulta más sólida frente a esa conclusión?',
             en:'After finishing their research, a team writes: “Social movements only cause disorder; it would be better to wait for the authorities to correct injustices on their own.” Which ethical stance is stronger against that conclusion?' },
      options:{ es:[
        'Que la organización pacífica ha sido la vía por la que se reconocieron derechos que hoy parecen obvios, y sigue siendo legítima cuando algo se incumple.',
        'Que cualquier protesta es válida sin importar los medios que use, porque el fin justifica lo que se haga.',
        'Que las injusticias se corrigen solas con el paso del tiempo y por eso no hace falta reclamar nada.',
        'Que solo las autoridades pueden decidir en qué momento un derecho merece ser reconocido.' ],
        en:[
        'That peaceful organizing has been the path by which rights that now seem obvious were recognized, and remains legitimate when something is not met.',
        'That any protest is valid whatever means it uses, because the end justifies whatever is done.',
        'That injustices correct themselves as time passes and therefore nothing needs to be demanded.',
        'That only the authorities can decide when a right deserves to be recognized.' ] },
      correct:0,
      hint:{ es:'Apóyate en los casos que revisaste: pregúntate qué habría pasado si nadie hubiera reclamado.',
             en:'Lean on the cases you reviewed: ask what would have happened if nobody had demanded anything.' },
      explanation:{ es:'La abolición, la jornada de ocho horas y el voto de las mujeres no llegaron por espera ni por concesión: llegaron por reclamos organizados y pacíficos sostenidos durante años. Sostener eso no equivale a aceptar cualquier medio.',
                    en:'Abolition, the eight hour working day and the vote of women did not arrive by waiting or by concession: they arrived through organized, peaceful demands sustained for years. Holding that does not mean accepting any means whatsoever.' } },
    { title:{ es:'Tu postura en la escuela', en:'Your stance at school' }, showWork:false,
      stmt:{ es:'En tu escuela se prohíbe a un grupo usar la cancha durante el receso sin explicar por qué. Un compañero propone romper el candado; una compañera propone juntar firmas, documentar los días sin acceso y pedir una reunión con la dirección. ¿Qué postura se apoya mejor en lo que enseñan los movimientos por los derechos humanos?',
             en:'At your school one group is banned from using the court during recess with no explanation. One classmate proposes breaking the padlock; another proposes collecting signatures, documenting the days without access and asking for a meeting with the school office. Which stance leans better on what human rights movements teach?' },
      options:{ es:[
        'Sostener el reclamo de forma organizada y pacífica ante quien puede cambiar la regla, con pruebas de lo que ocurre.',
        'Romper el candado de inmediato, porque una injusticia autoriza cualquier respuesta.',
        'No hacer nada, porque el uso de la cancha no tiene relación con ningún derecho.',
        'Pedir que se prohíba la cancha a todos los grupos para que la medida resulte pareja.' ],
        en:[
        'Sustaining the demand in an organized, peaceful way before whoever can change the rule, with evidence of what happens.',
        'Breaking the padlock right away, because an injustice authorizes any response.',
        'Doing nothing, because using the court has no relation to any right.',
        'Asking for the court to be banned for every group so the measure is even.' ] },
      correct:0,
      hint:{ es:'Recuerda los eslabones de la cadena: reclamo organizado, regla que cambia y pruebas para exigir.',
             en:'Recall the links of the chain: organized demand, a rule that changes, and evidence to demand with.' },
      explanation:{ es:'Los movimientos que lograron cambios duraderos reunieron pruebas, se organizaron y llevaron su demanda a quien podía modificar la regla. Romper el candado resuelve una tarde y deja la regla intacta; no hacer nada la deja intacta también.',
                    en:'The movements that achieved lasting change gathered evidence, organized and took their demand to whoever could change the rule. Breaking the padlock solves one afternoon and leaves the rule untouched; doing nothing leaves it untouched too.' } }
  ], rng), rng);
}
</script>

<!-- LIAXA ANALYTICS -->
<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbzLGV15JRTPs9bbSvHRLfgOXeT9oUExDf1AH546WOwq5tYxXSdhX212OWi_bTJfMGx9/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'Movimientos Sociales que Originaron los DDHH';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
