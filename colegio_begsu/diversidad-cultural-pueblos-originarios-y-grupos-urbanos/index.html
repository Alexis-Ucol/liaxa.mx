             en:'Look at who decides what is shown of each group, not at how nice the programme looks.' },
      exp:{ es:'Reconocer a un grupo incluye que sea él quien decida cómo se presenta: por eso la primera propuesta es la única que no habla en su nombre. Que el comité elija por todos, que se junte todo en un solo número o que se exija tener vestuario listo deja fuera voces o las presenta como los demás creen que deberían verse.',
            en:'Recognising a group includes letting it decide how it presents itself: that is why the first proposal is the only one that does not speak on its behalf. Having the committee choose for everyone, merging everything into one performance or requiring costumes ready leaves voices out or presents them as others think they should look.' }
    }
  ];
  return pk(rng, vs);
}

function mkP10(rng){
  var vs = [
    {
      title:{ es:'El caso del pozo y la fiesta', en:'The case of the well and the festival' },
      q:{ es:'En un municipio, el pozo de la parte alta se seca cada temporada seca y ahí viven sobre todo familias de un pueblo originario y familias llegadas hace pocos años; en la parte baja el agua llega todos los días. El comité de la escuela quiere llevar el caso a la autoridad. ¿Cuál planteamiento reúne todas las piezas del problema?',
          en:'In a municipality, the well in the upper part dries up every dry season and mostly families of an original people and families who arrived a few years ago live there; in the lower part water arrives every day. The school committee wants to take the case to the authority. Which statement brings together all the pieces of the problem?' },
      opts:{ es:['El agua falta solo en la parte alta, ahí viven grupos que ya resienten otras carencias, y pedimos un horario de reparto y el aviso en las dos lenguas',
                 'El agua falta en el municipio desde hace años y pedimos a la autoridad que resuelva pronto el problema del abasto',
                 'Las familias de la parte alta deberían organizarse mejor entre ellas para repartirse el agua que sí llega al pozo',
                 'El pozo de la parte alta se seca por la temporada, así que conviene esperar a las lluvias para volver a revisarlo'],
             en:['Water is missing only in the upper part, groups that already feel other shortages live there, and we ask for a delivery timetable and the notice in both languages',
                 'Water has been missing in the municipality for years and we ask the authority to solve the supply problem soon',
                 'The families of the upper part should organise better among themselves to share out the water that does reach the well',
                 'The well in the upper part dries up because of the season, so it is better to wait for the rains to check it again'] },
      ci:0, showWork:false,
      hint:{ es:'Revisa que el planteamiento diga dónde ocurre, a quiénes toca más y qué se está pidiendo.',
             en:'Check that the statement says where it happens, whom it affects most and what is being asked for.' },
      exp:{ es:'El primer planteamiento nombra el lugar exacto, reconoce que la falta golpea más fuerte a grupos que ya cargan otras carencias y termina en una petición concreta que además incluye la lengua en que debe darse el aviso. El segundo borra la diferencia entre las dos partes del municipio, el tercero traslada la responsabilidad a las familias afectadas y el cuarto pospone el caso sin pedir nada.',
            en:'The first statement names the exact place, recognises that the shortage hits harder groups that already carry other shortages, and ends in a concrete request that also includes the language the notice should be given in. The second erases the difference between the two parts of the municipality, the third shifts responsibility onto the affected families and the fourth postpones the case without asking for anything.' }
    },
    {
      title:{ es:'El caso del terreno de la cancha', en:'The case of the land for the court' },
      q:{ es:'El municipio va a usar un terreno donde ahora se instala el tianguis de artesanos del pueblo originario y donde por las tardes patina un colectivo de jóvenes. La decisión se tomó en una junta a la que no asistió ninguno de los dos grupos. ¿Cuál planteamiento reúne todas las piezas del problema?',
          en:'The municipality is going to use a piece of land where the craft market of the original people is now set up and where a collective of young people skates in the afternoons. The decision was taken at a meeting neither group attended. Which statement brings together all the pieces of the problem?' },
      opts:{ es:['Dos grupos que usan el terreno todos los días quedaron fuera de la decisión, y pedimos una junta con ellos antes de que empiece la obra',
                 'El terreno estaba disponible y el municipio tiene la facultad de decidir qué construir en él y en qué fecha',
                 'Los artesanos podrían mudar el tianguis a otra calle y los jóvenes podrían patinar en cualquier otro lugar del pueblo',
                 'La obra es necesaria para el municipio, así que los dos grupos tendrán que acostumbrarse al cambio poco a poco'],
             en:['Two groups that use the land every day were left out of the decision, and we ask for a meeting with them before the works begin',
                 'The land was available and the municipality has the power to decide what to build on it and on what date',
                 'The craftspeople could move the market to another street and the young people could skate anywhere else in the town',
                 'The works are necessary for the municipality, so the two groups will have to get used to the change little by little'] },
      ci:0, showWork:false,
      hint:{ es:'Pregúntate qué pieza falta en las otras tres respuestas: quién usa el terreno y quién decidió sobre él.',
             en:'Ask yourself which piece is missing from the other three answers: who uses the land and who decided about it.' },
      exp:{ es:'El primer planteamiento nombra a los dos grupos afectados, señala que no participaron en la decisión y pide algo concreto y a tiempo. Los otros tres se apoyan en la facultad de decidir, mandan a los afectados a buscar otro sitio o les piden que se acostumbren, y en los tres casos la pieza que falta es la misma: quienes usan el terreno no estuvieron en la junta donde se decidió su futuro.',
            en:'The first statement names the two affected groups, points out that they did not take part in the decision and asks for something concrete and in time. The other three lean on the power to decide, send the affected to look for another spot or ask them to get used to it, and in all three the missing piece is the same: those who use the land were not at the meeting where its future was decided.' }
    }
  ];
  return pk(rng, vs);
}

function buildLesson(rng) {
  injectGuideCSS();

  /* ══ INTRO ══ */
  sec(
    L({ es:'Para empezar', en:'To begin' }),
    L({ es:'Quién vive en tu comunidad', en:'Who lives in your community' }),
    '<p>' + L({
      es:'Si sales a la calle de tu localidad y escuchas con atención, no vas a oír una sola manera de hablar, ni una sola música, ni un solo modo de cocinar. En un mismo municipio pueden convivir un pueblo originario que lleva siglos ahí, familias afromexicanas con su propia historia, personas que llegaron hace poco desde otro estado o desde otro país, y colectivos de jóvenes que se reconocen por el deporte o el arte que practican.',
      en:'If you walk out into the street of your town and listen carefully, you will not hear one single way of speaking, nor one single music, nor one single way of cooking. In one municipality there can live together an original people that has been there for centuries, Afro-Mexican families with a history of their own, people who arrived recently from another state or another country, and collectives of young people who recognise one another by the sport or the art they practise.' }) + '</p>' +
    '<p>' + L({
      es:'A esa mezcla que habita un mismo territorio se le llama identidad pluricultural, y no es un adorno del pasado: es la forma en que está hecho el país hoy. En esta guía vas a ubicar en el mapa a los pueblos originarios, a reconocer a los cuatro grupos que forman una comunidad diversa, a rastrear qué aportó cada uno a tu vida diaria, a ver por qué negar esa diversidad se convierte en una problemática social, y a proponer algo que tu grupo pueda hacer al respecto.',
      en:'That mixture inhabiting one territory is called pluricultural identity, and it is not a decoration from the past: it is the way the country is made today. In this guide you will place original peoples on the map, recognise the four groups that make up a diverse community, trace what each one contributed to your daily life, see why denying that diversity becomes a social issue, and propose something your group can do about it.' }) + '</p>' +
    '<div class="callout"><p><strong>' + L({ es:'Lo que vas a hacer: ', en:'What you are going to do: ' }) + '</strong>' + L({
      es:'vas a ubicar pueblos originarios leyendo el paisaje donde viven, a armar el retrato de un municipio donde quepan todas sus voces, a rastrear de dónde vienen palabras y comidas que usas a diario, a decidir qué haces en cuatro escenas donde alguien está quedando fuera, y a escribir tu propio compromiso.',
      en:'you are going to place original peoples by reading the landscape where they live, build the portrait of a municipality where all its voices fit, trace where words and foods you use daily come from, decide what you do in four scenes where someone is being left out, and write your own commitment.' }) + '</p></div>'
  );

  /* ══ CONCEPTO 1 ══ */
  var s1 = sec(
    L({ es:'Concepto 1', en:'Concept 1' }),
    L({ es:'Los pueblos originarios y su territorio', en:'Original peoples and their territory' }),
    '<p>' + L({
      es:'Un pueblo originario desciende de las poblaciones que ya habitaban este territorio antes de que se formara el país que conocemos, y hoy conserva parte de su lengua, su cultura y sus propias formas de organizarse y decidir. Muchos toman acuerdos en asamblea, nombran a sus autoridades por costumbre propia y cuidan en común el monte, el agua o la tierra de la que viven.',
      en:'An original people descends from the populations that already inhabited this territory before the country we know was formed, and today it keeps part of its language, its culture and its own ways of organising and deciding. Many take decisions in assembly, name their authorities by their own custom and look after in common the woodland, the water or the land they live from.' }) + '</p>' +
    '<p>' + L({
      es:'No están en un solo rincón del país. Hay pueblos originarios en las sierras del norte, en los valles del centro, en las montañas y los valles del sur y en la península del sureste, y también en las ciudades grandes, adonde muchas familias se han trasladado sin dejar de hablar su lengua. Cada territorio tiene su paisaje, y ese paisaje explica buena parte de cómo vive cada pueblo: quien habita una planicie sin ríos guarda el agua de otra manera que quien vive junto a un río de la sierra.',
      en:'They are not in one corner of the country. There are original peoples in the mountains of the north, in the valleys of the centre, in the mountains and valleys of the south and on the peninsula of the south east, and also in the big cities, where many families have moved without giving up their language. Each territory has its landscape, and that landscape explains much of how each people lives: whoever inhabits a plain with no rivers stores water differently from whoever lives beside a mountain river.' }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Origen', en:'Origin' }), L({ es:'estaban antes', en:'they were here before' }), L({ es:'vienen de quienes ya habitaban el territorio', en:'they come from those already inhabiting the territory' })) +
      rcard(L({ es:'Lengua', en:'Language' }), L({ es:'propia y viva', en:'their own and alive' }), L({ es:'se habla en la casa, la asamblea y la fiesta', en:'spoken at home, in the assembly and at the festival' })) +
      rcard(L({ es:'Organización', en:'Organisation' }), L({ es:'decidir en común', en:'deciding together' }), L({ es:'asambleas y autoridades por costumbre propia', en:'assemblies and authorities by their own custom' })) +
      rcard(L({ es:'Territorio', en:'Territory' }), L({ es:'norte, centro, sur', en:'north, centre, south' }), L({ es:'también en la península y en las ciudades', en:'also on the peninsula and in the cities' })) +
    '</div>'
  );
  wMapa(rng, widgetHost(s1, 'w_mapa', 'map'));
  addProblem(rng, mkP1(rng));
  addProblem(rng, mkP2(rng));

  /* ══ CONCEPTO 2 ══ */
  var s2 = sec(
    L({ es:'Concepto 2', en:'Concept 2' }),
    L({ es:'Las cuatro voces de una comunidad', en:'The four voices of a community' }),
    '<p>' + L({
      es:'Además de los pueblos originarios, en el país viven comunidades afromexicanas: su historia empezó con las personas traídas desde África durante la época colonial, se asentaron sobre todo en la Costa Chica de Guerrero y Oaxaca y en la costa de Veracruz, y hoy tienen fiestas, música y danzas propias. Su existencia está reconocida en la Constitución del país.',
      en:'Besides original peoples, in the country there live Afro-Mexican communities: their history began with the people brought from Africa during colonial times, they settled above all on the Costa Chica of Guerrero and Oaxaca and on the coast of Veracruz, and today they have their own festivals, music and dances. Their existence is recognised in the Constitution of the country.' }) + '</p>' +
    '<p>' + L({
      es:'A eso se suman las personas migrantes, que llegaron desde otro estado o desde otro país y traen consigo oficios, comida, palabras y música; y los grupos urbanos, formados sobre todo por jóvenes de las ciudades que se reconocen por una práctica compartida: el patinaje, el grafiti, la música, el deporte. Los cuatro habitan el mismo lugar y ninguno es más dueño de él que los demás: a esa convivencia se le llama identidad pluricultural.',
      en:'To that are added people who migrated, who arrived from another state or another country bringing trades, food, words and music; and urban groups, formed above all by young people in the cities who recognise one another by a shared practice: skating, graffiti, music, sport. The four inhabit the same place and none owns it more than the others: that living together is called pluricultural identity.' }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Pueblos originarios', en:'Original peoples' }), L({ es:'lengua y territorio', en:'language and territory' }), L({ es:'estaban aquí antes de que se formara el país', en:'they were here before the country was formed' })) +
      rcard(L({ es:'Afromexicanos', en:'Afro-Mexicans' }), L({ es:'historia propia', en:'a history of their own' }), L({ es:'reconocidos en la Constitución', en:'recognised in the Constitution' })) +
      rcard(L({ es:'Migrantes', en:'People who migrated' }), L({ es:'llegan y aportan', en:'they arrive and contribute' }), L({ es:'oficios, comida, música, palabras', en:'trades, food, music, words' })) +
      rcard(L({ es:'Grupos urbanos', en:'Urban groups' }), L({ es:'práctica compartida', en:'a shared practice' }), L({ es:'deporte, arte y música de la ciudad', en:'sport, art and music of the city' })) +
    '</div>'
  );
  wRetrato(rng, widgetHost(s2, 'w_retrato', 'build'));
  addProblem(rng, mkP3(rng));
  addProblem(rng, mkP4(rng));

  /* ══ CONCEPTO 3 ══ */
  var s3 = sec(
    L({ es:'Concepto 3', en:'Concept 3' }),
    L({ es:'Lo que cada grupo aporta a la vida diaria', en:'What each group contributes to daily life' }),
    '<p>' + L({
      es:'La diversidad no se guarda en el museo: se usa todos los días. Muchas palabras que dices sin pensarlas vienen de lenguas originarias, y varias comidas que se venden en cualquier esquina nacieron cuando la cocina de unas familias que llegaron de fuera se mezcló con los ingredientes de aquí. La música de la costa, las danzas de la fiesta y los murales de la escuela también tienen autor y procedencia.',
      en:'Diversity is not kept in a museum: it is used every day. Many words you say without thinking come from original languages, and several foods sold on any corner were born when the cooking of families who arrived from elsewhere mixed with the ingredients from here. The music of the coast, the dances of the festival and the murals at school also have an author and a place they came from.' }) + '</p>' +
    '<p>' + L({
      es:'Reconocer de dónde viene cada cosa tiene un efecto muy concreto: deja de parecer que un solo grupo hizo el lugar y los demás llegaron a mirar. Y hay aportes que no se ven en la mesa ni en la pared, como los saberes de los pueblos originarios sobre el manejo del agua, del bosque o de las semillas, que hoy sirven para enfrentar problemas que nos tocan a todos.',
      en:'Recognising where each thing comes from has a very concrete effect: it stops looking as if one single group made the place and the rest arrived to watch. And there are contributions you do not see on the table or on the wall, such as the knowledge of original peoples about managing water, forest or seeds, which today helps to face problems that concern everyone.' }) + '</p>'
  );
  wHerencia(rng, widgetHost(s3, 'w_herencia', 'match'));
  addProblem(rng, mkP5(rng));
  addProblem(rng, mkP6(rng));

  /* ══ CONCEPTO 4 ══ */
  var s4 = sec(
    L({ es:'Concepto 4', en:'Concept 4' }),
    L({ es:'Cuando la diversidad se niega: discriminación y desigualdad', en:'When diversity is denied: discrimination and inequality' }),
    '<p>' + L({
      es:'Hay discriminación cuando a una persona se le da un trato peor o se le niega un derecho por su origen, su lengua, su color de piel, su forma de vestir o el grupo al que pertenece. Empieza en cosas que parecen pequeñas, como imitar un acento o decir que una lengua suena mal, y termina en cosas grandes, como negar un trabajo, un trámite o un lugar en la fiesta del pueblo.',
      en:'There is discrimination when a person is given worse treatment or denied a right because of their origin, their language, their skin colour, the way they dress or the group they belong to. It starts in things that look small, such as mimicking an accent or saying a language sounds bad, and it ends in big things, such as refusing a job, an official procedure or a place at the town festival.' }) + '</p>' +
    '<p>' + L({
      es:'Eso deja de ser un pleito entre dos personas cuando se repite con quienes comparten el mismo origen: entonces es una problemática social, porque deja fuera a una parte de la comunidad. Y hay otro efecto menos visible: una misma problemática no golpea igual a todos. Un corte de agua avisado solo en español, o una obra decidida sin quienes viven del monte que se va a talar, reparten el daño de manera desigual entre los grupos del mismo municipio.',
      en:'That stops being a quarrel between two people when it repeats with those who share the same origin: then it is a social issue, because it shuts out part of the community. And there is another, less visible effect: the same issue does not hit everyone alike. A water cut announced only in Spanish, or a project decided without those who live off the woodland about to be felled, share out the damage unequally among the groups of the same municipality.' }) + '</p>'
  );
  wSemaforo(rng, widgetHost(s4, 'w_semaforo', 'meter'));
  addProblem(rng, mkP7(rng));
  addProblem(rng, mkP8(rng));

  /* ══ CONCEPTO 5 ══ */
  var s5 = sec(
    L({ es:'Concepto 5', en:'Concept 5' }),
    L({ es:'Agente de cambio: reconocer sin hablar por nadie', en:'Agent of change: recognising without speaking for anyone' }),
    '<p>' + L({
      es:'Un agente de cambio es alguien que hace algo del tamaño de sus posibilidades y lo hace con otros. En la escuela y en el barrio hay acciones al alcance de un grupo de tu edad: grabar entrevistas a personas de distintos grupos del municipio, pedir que los avisos y las lecturas del festival estén en las dos lenguas, invitar a un colectivo juvenil a mostrar su trabajo, acompañar a quien acaba de llegar para que no quede solo.',
      en:'An agent of change is someone who does something the size of what they can manage and does it with others. At school and in the barrio there are actions within reach of a group your age: recording interviews with people from different groups of the municipality, asking for the notices and readings at the festival to be in both languages, inviting a youth collective to show its work, staying close to someone who has just arrived so they are not left alone.' }) + '</p>' +
    '<p>' + L({
      es:'Una acción sirve cuando se puede cumplir y cuando se puede revisar: hay que decir qué se hace, quién lo hace, cuándo, y con qué dato se sabrá si funcionó. Y tiene una regla extra cuando se trata de diversidad: reconocer a un grupo incluye que sea él quien decida cómo se presenta. Organizar algo sobre otros sin ellos termina siendo otra manera de dejarlos fuera.',
      en:'An action works when it can be carried out and when it can be reviewed: you have to say what is done, who does it, when, and which figure will show whether it worked. And it has an extra rule when it comes to diversity: recognising a group includes letting that group decide how it presents itself. Organising something about others without them ends up being another way of leaving them out.' }) + '</p>'
  );
  wCompromiso(rng, widgetHost(s5, 'w_compromiso', 'reflect'));
  addProblem(rng, mkP9(rng));

  /* ══ CIERRE ══ */
  sec(
    L({ es:'Para cerrar', en:'To finish' }),
    L({ es:'Un caso con todas sus piezas', en:'A case with all its pieces' }),
    '<p>' + L({
      es:'El caso que sigue trae junto todo lo anterior: un lugar, varios grupos que lo habitan, un daño que no se reparte parejo y una petición. Léelo con calma y decide cuál planteamiento no deja ninguna pieza fuera.',
      en:'The case below brings together everything above: a place, several groups inhabiting it, damage that is not shared evenly and a request. Read it calmly and decide which statement leaves no piece out.'
    }) + '</p>'
  );
  addProblem(rng, mkP10(rng));
}
</script>

<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbykkuJ_apGq3vALIFd4mr3acu81c7K4OKxW-DZ-i52Ceyl3lOanXMdvbS9SIXPrLQBm/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'Diversidad Cultural: Pueblos Originarios y Grupos Urbanos';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
