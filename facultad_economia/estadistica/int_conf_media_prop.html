<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Intervalos de Confianza para la Media y Proporciones · Estadística · Facultad de Economía, Universidad de Colima</title>
<link rel="canonical" href="https://liaxa.mx/facultad_economia/estadistica/est_ci_mean.html">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS ── fallback only; applyBranding() re-injects from SCHOOL ── */
:root {
  --green:      #4a7c3f;
  --green-dark: #2d5a27;
  --green-bg:   #eaf0e7;
  --gold:       #c9a84c;
  --gold-bg:    #faf3e0;
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #6aaa5f;
  --green-dark: #8ecf82;
  --green-bg:   #1a281a;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--green-bg); color:var(--green-dark); border:1.5px solid var(--green); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; }
#restoreBar strong { color:var(--green-dark); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; object-fit:contain; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; min-width:0; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── LANGUAGE TOGGLE ── */
.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }
.dlist { font-family:'IBM Plex Mono',monospace; font-size:.78rem; color:var(--green-dark); background:var(--surface2); border-radius:8px; padding:.6rem .7rem; margin:.6rem 0; word-break:break-word; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); overflow-x:auto; }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── INTERACTIVE WIDGETS ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.iw-head { display:flex; align-items:baseline; gap:.6rem; margin-bottom:.3rem; flex-wrap:wrap; }
.iw-tag { font-size:.62rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; }
.iw-title { font-family:'Crimson Pro',serif; font-size:1.08rem; font-weight:700; }
.iw-sub { font-size:.8rem; color:var(--text2); margin-bottom:.85rem; }
.iw-canvas { display:block; width:100%; border-radius:8px; background:var(--surface2); }
.iw-read { margin-top:.85rem; background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 8px 8px 0; padding:.7rem .85rem; font-size:.82rem; color:var(--text2); }
.iw-read strong { color:var(--green-dark); }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (widget toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.3rem .7rem; font-size:.76rem; cursor:pointer; color:var(--text2); transition:all .14s; font-family:inherit; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--gold-bg); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }

/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos { gap: .9rem; }
  .wlogos img { height: 38px; max-width: 42%; }
  .wtitle { font-size: 1.35rem; }
  .stickybar { padding: .5rem .55rem; gap: .38rem; }
  .htitle { display: none; }
  .halexis { display: none; }
  .hsep { display: none; }
  .hlogos { gap: .3rem; }
  .hlogos img { height: 18px; max-width: 60px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 78px; overflow: hidden; text-overflow: ellipsis; }
  .lang-btn { padding: .26rem .48rem; font-size: .68rem; }
  .lbody { padding: 1.2rem .7rem 3rem; max-width: 100%; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .gcrd { padding: .9rem .75rem; }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}
</style>
</head>
<body>

<!-- ════════════════════ WELCOME ════════════════════ -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <img id="logo-left"  src="" alt="Facultad de Economía" style="display:none">
      <div class="wlogsep" id="wlogsep"></div>
      <img id="logo-right" src="" alt="Universidad de Colima" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Intervalos de Confianza para la Media y Proporciones</div>
    <div class="wcourse" id="wcourse-el">Estadística</div>
    <label class="flabel" for="sName" id="lbl-name-el">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" for="sGroup" id="lbl-group-el">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar" style="background:var(--green-bg); color:var(--green-dark);">
      <strong id="restoreTitle">Sesión guardada encontrada</strong><br>
      <span id="restoreMsg">¿Deseas continuar donde la dejaste?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Retomar sesión</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Empezar de nuevo</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.9rem">
      <svg width="160" height="52" viewBox="0 0 180 52" xmlns="http://www.w3.org/2000/svg">
        <style>
          .lbt { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.1em; fill:var(--green); font-size:28px; }
          .lbl { stroke:var(--gold); stroke-width:2.5; }
          .lba { fill:var(--gold); }
        </style>
        <polyline points="5,40 14,28 24,33 36,14" fill="none" stroke="var(--green)" stroke-width="3"/>
        <circle cx="36" cy="14" r="4.5" class="lba"/>
        <line x1="52" y1="6" x2="52" y2="46" class="lbl"/>
        <text x="64" y="38" class="lbt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- ════════════════════ LESSON ════════════════════ -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <img id="hlogo-left"  src="" alt="Facultad de Economía" style="display:none">
      <img id="hlogo-right" src="" alt="Universidad de Colima" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle" id="htitle-el">Intervalos de Confianza para la Media y Proporciones</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg">
        <style>
          .lht { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
          .lhl { stroke:var(--gold); stroke-width:2; }
          .lha { fill:var(--gold); }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" fill="none" stroke="var(--green)" stroke-width="2"/>
        <circle cx="22" cy="10" r="2.5" class="lha"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lhl"/>
        <text x="42" y="22" class="lht">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle">
      <button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button>
      <button class="lang-btn"        id="btn-en" onclick="setLang('en')">EN</button>
    </div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="dlbtn" id="dlBtn" onclick="generatePDF()">Descargar resultados en PDF</button>
    </div>
  </div>
</div>

<script>
/* ════════════════════════════════════════════════════════════════════════
   SCHOOL CONFIG · edit ONLY this block to rebrand for a different school
   ════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:      '#4a7c3f',
  primaryDark:  '#2d5a27',
  primaryBg:    '#eaf0e7',
  accent:       '#c9a84c',
  accentBg:     '#faf3e0',
  pBR: 74,  pBG: 124, pBB: 63,
  pAR: 201, pAG: 168, pAB: 76,
  darkPrimary:     '#6aaa5f',
  darkPrimaryDark: '#8ecf82',
  darkPrimaryBg:   '#1a281a',

   ════════════════════════════════════════════════════════════════════════ */
function moneyOpts(correct, wrongs, rng) {

  function add(v) {

    var s = money(v);
    if (seen[s]) return;
    seen[s] = 1; vals.push(s);
  }

  for (var i = 0; i < wrongs.length && vals.length < 4; i++) add(wrongs[i]);

}

    if (seen[s]) return;
    seen[s] = 1; vals.push(s);
  }
  add(correct);
  for (var i = 0; i < wrongs.length && vals.length < 4; i++) add(wrongs[i]);

function lsKey() {

  return 'fac_econ_est__' + (n + '__' + g).replace(/\s+/g, '_');
}
function saveSession() {
  if (!studentData.name) return;
  var drawings = [], texts = [], photos = [];
  problems.forEach(function(p, i) {
    var dc = document.getElementById('dc' + i);
    if (dc && dc.width) {
      var blank = document.createElement('canvas');
      blank.width = dc.width; blank.height = dc.height;
      drawings.push(dc.toDataURL() === blank.toDataURL() ? null : dc.toDataURL('image/png'));
    } else { drawings.push(null); }
    var ta = document.getElementById('ta' + i);
    texts.push(ta ? ta.value : '');
    var pp = document.getElementById('pp' + i);
    photos.push((pp && pp.src && pp.src.indexOf('data:') === 0) ? pp.src : null);
  });
  var state = {
    name: studentData.name, group: studentData.group,
    answeredCount: answeredCount, correctCount: correctCount,
    choices: problems.map(function(p) { return p.studentChoice; }),
    drawings: drawings, texts: texts, photos: photos
  };
  try { localStorage.setItem(lsKey(), JSON.stringify(state)); } catch(e) {}
}
function loadSession(name, group) {
  var key = 'fac_econ_est__' + (name + '__' + group).replace(/\s+/g, '_');
  try { var r = localStorage.getItem(key); return r ? JSON.parse(r) : null; } catch(e) { return null; }
}
function dismissRestore() { document.getElementById('restoreBar').style.display = 'none'; }
function checkForSavedSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  if (!name || !group) { document.getElementById('restoreBar').style.display = 'none'; return; }
  var saved = loadSession(name, group);
  var bar = document.getElementById('restoreBar');
  bar.style.display = (saved && saved.choices && saved.choices.some(function(c) { return c !== null; })) ? 'block' : 'none';
}
function observeSections() {
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
}

/* ════════════════════════════════════════════════════════════════════════
   START / RESTORE
   ════════════════════════════════════════════════════════════════════════ */
function startLesson() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  var err   = document.getElementById('startErr');
  if (!name || !group) { err.textContent = t('err-fields'); return; }
  err.textContent = '';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = nextAttempt(name, group);
  var rng = seededRng(name + group + att);
  buildLesson(rng);
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  observeSections();
}
function restoreSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  var saved = loadSession(name, group);
  if (!saved) return;
  document.getElementById('restoreBar').style.display = 'none';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = currentAttempt(name, group);
  var rng = seededRng(name + group + att);
  buildLesson(rng);
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  observeSections();
  saved.choices.forEach(function(choice, idx) {
    if (choice !== null && choice !== undefined) confirmMC(idx, choice);
  });
  setTimeout(function() {
    if (saved.drawings) saved.drawings.forEach(function(dataUrl, i) {
      if (!dataUrl) return;
      var dc = document.getElementById('dc' + i);
      if (!dc || !dc.width) return;
      var img = new Image();
      img.onload = function() {
        var dpr = window.devicePixelRatio || 1;
        dc.getContext('2d').drawImage(img, 0, 0, dc.width / dpr, dc.height / dpr);
      };
      img.src = dataUrl;
    });
    if (saved.texts) saved.texts.forEach(function(txt, i) {
      if (!txt) return;
      var ta = document.getElementById('ta' + i);
      if (ta) ta.value = txt;
    });
    if (saved.photos) saved.photos.forEach(function(dataUrl, i) {
      if (!dataUrl) return;
      var pp = document.getElementById('pp' + i);
      if (!pp) return;
      pp.src = dataUrl; pp.style.display = 'block';
      var pz = document.getElementById('pz' + i);
      if (pz) pz.style.opacity = '0.4';
    });
  }, 300);
}

  ctx.lineJoin    = 'round';

  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e) { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e) { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(p[0], p[1]); ctx.stroke(); lx = p[0]; ly = p[1]; }
  function onUp() { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}
function switchTab(idx, panel, btn) {
  var prefix = 'wp_' + idx + '_';

/* ════════════════════════════════════════════════════════════════════════
   ANSWER HANDLER · two taps to confirm
   ════════════════════════════════════════════════════════════════════════ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = '<strong>' + (isOk ? t('fb-correct') : t('fb-wrong')) + '</strong> ' + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (!prob || prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = '<strong>' + (isOk ? t('fb-correct') : t('fb-wrong')) + '</strong> ' + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

/* ════════════════════════════════════════════════════════════════════════
   CANVAS PRIMITIVES FOR THE WIDGETS
   ════════════════════════════════════════════════════════════════════════ */
function fitCanvas(cv, h) {
  var dpr = window.devicePixelRatio || 1;
  var w = Math.max(240, cv.clientWidth || cv.parentNode.clientWidth || 300);
  cv.style.height = h + 'px';
  cv.width  = Math.round(w * dpr);
  cv.height = Math.round(h * dpr);
  var ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  return { ctx: ctx, w: w, h: h };
}
function palette() {
  return {
    green: cssv('--green'), dark: cssv('--green-dark'), tint: cssv('--green-bg'),
    gold: cssv('--gold'), bad: cssv('--bad'), border: cssv('--border'),
    text: cssv('--text'), text2: cssv('--text2'), text3: cssv('--text3')
  };
}
/* Draws a normal density over four standard deviations on each side. bands is
   a list of regions to shade, each one with a kind: 0 pale, 1 green for the
   region that answers the question, 2 gold for what is left outside. */
function drawCurve(g, mu, sd, bands, opts) {
  var ctx = g.ctx, P = palette(), W = g.w, H = g.h;
  var padL = 12, padR = 12, padT = 16, padB = 22;
  var x0 = mu - 4 * sd, x1 = mu + 4 * sd, i;
  opts = opts || {};
  var fmt = opts.fmt || function(v) { return nf(v); };
  function X(v) { return padL + (v - x0) / (x1 - x0) * (W - padL - padR); }
  var peak = nPdf(0) / sd;
  function Y(d) { return H - padB - d / peak * (H - padT - padB); }
  function dens(v) { return nPdf((v - mu) / sd) / sd; }
  var step = (x1 - x0) / 260;
  (bands || []).forEach(function(b) {
    var a = Math.max(x0, b.a), c = Math.min(x1, b.b), v;
    if (c <= a) return;
    ctx.beginPath();
    ctx.moveTo(X(a), H - padB);
    for (v = a; v <= c; v += step) ctx.lineTo(X(v), Y(dens(v)));
    ctx.lineTo(X(c), Y(dens(c)));
    ctx.lineTo(X(c), H - padB);
    ctx.closePath();
    ctx.fillStyle = b.kind === 2 ? P.gold : b.kind === 1 ? P.green : P.tint;
    ctx.globalAlpha = b.kind === 0 ? 1 : 0.42;
    ctx.fill();
    ctx.globalAlpha = 1;
  });
  ctx.strokeStyle = P.border; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(padL, H - padB); ctx.lineTo(W - padR, H - padB); ctx.stroke();
  ctx.strokeStyle = P.dark; ctx.lineWidth = 2;
  ctx.beginPath();
  for (i = 0; i <= 260; i++) {
    var vv = x0 + i * step;
    if (i === 0) ctx.moveTo(X(vv), Y(dens(vv))); else ctx.lineTo(X(vv), Y(dens(vv)));
  }
  ctx.stroke();
  (opts.marks || []).forEach(function(m) {
    if (m < x0 || m > x1) return;
    ctx.save();
    ctx.strokeStyle = P.gold; ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.moveTo(X(m), H - padB); ctx.lineTo(X(m), Y(dens(m))); ctx.stroke();
    ctx.restore();
  });
  ctx.save();
  ctx.strokeStyle = P.dark; ctx.lineWidth = 1.6; ctx.setLineDash([4, 3]);
  ctx.beginPath(); ctx.moveTo(X(mu), padT - 8); ctx.lineTo(X(mu), H - padB); ctx.stroke();
  ctx.restore();
  if (opts.muLabel) {
    ctx.fillStyle = P.dark; ctx.font = '600 10px "IBM Plex Sans", sans-serif';
    var lw = ctx.measureText(opts.muLabel).width;
    ctx.fillText(opts.muLabel, Math.min(Math.max(2, X(mu) - lw / 2), W - lw - 2), 11);
  }
  ctx.fillStyle = P.text3; ctx.font = '9px "IBM Plex Mono", monospace';
  for (i = -2; i <= 2; i++) {
    var tv = mu + i * sd, lab = fmt(tv), tw = ctx.measureText(lab).width;
    ctx.fillText(lab, Math.min(Math.max(1, X(tv) - tw / 2), W - tw - 1), H - padB + 13);
  }
}
/* Draws the standard normal and the t model on the same axis, in units of
   standard error, so the extra width of the t tails becomes visible. */
function drawTvsZ(g, df, tc, zc, labelT, labelZ) {
  var ctx = g.ctx, P = palette(), W = g.w, H = g.h;
  var padL = 12, padR = 12, padT = 20, padB = 22;
  var x0 = -4.4, x1 = 4.4, i;
  function X(v) { return padL + (v - x0) / (x1 - x0) * (W - padL - padR); }
  var peak = nPdf(0);
  function Y(d) { return H - padB - d / peak * (H - padT - padB); }
  var step = (x1 - x0) / 280;
  function band(a, b, kind) {
    var v;
    if (b <= a) return;
    ctx.beginPath();
    ctx.moveTo(X(a), H - padB);
    for (v = a; v <= b; v += step) ctx.lineTo(X(v), Y(tPdf(v, df)));
    ctx.lineTo(X(b), Y(tPdf(b, df)));
    ctx.lineTo(X(b), H - padB);
    ctx.closePath();
    ctx.fillStyle = kind === 1 ? P.green : P.gold;
    ctx.globalAlpha = 0.42; ctx.fill(); ctx.globalAlpha = 1;
  }
  band(x0, -tc, 2); band(-tc, tc, 1); band(tc, x1, 2);
  ctx.strokeStyle = P.border; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(padL, H - padB); ctx.lineTo(W - padR, H - padB); ctx.stroke();
  ctx.save();
  ctx.strokeStyle = P.text3; ctx.lineWidth = 1.4; ctx.setLineDash([5, 3]);
  ctx.beginPath();
  for (i = 0; i <= 280; i++) {
    var vz = x0 + i * step;
    if (i === 0) ctx.moveTo(X(vz), Y(nPdf(vz))); else ctx.lineTo(X(vz), Y(nPdf(vz)));
  }
  ctx.stroke();
  ctx.restore();
  ctx.strokeStyle = P.dark; ctx.lineWidth = 2;
  ctx.beginPath();
  for (i = 0; i <= 280; i++) {
    var vt = x0 + i * step;
    if (i === 0) ctx.moveTo(X(vt), Y(tPdf(vt, df))); else ctx.lineTo(X(vt), Y(tPdf(vt, df)));
  }
  ctx.stroke();
  [-tc, tc].forEach(function(m) {
    ctx.save();
    ctx.strokeStyle = P.gold; ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.moveTo(X(m), H - padB); ctx.lineTo(X(m), Y(tPdf(m, df))); ctx.stroke();
    ctx.restore();
  });
  [-zc, zc].forEach(function(m) {
    ctx.save();
    ctx.strokeStyle = P.text3; ctx.lineWidth = 1.2; ctx.setLineDash([3, 3]);
    ctx.beginPath(); ctx.moveTo(X(m), H - padB); ctx.lineTo(X(m), Y(nPdf(m))); ctx.stroke();
    ctx.restore();
  });
  ctx.fillStyle = P.dark; ctx.font = '600 10px "IBM Plex Sans", sans-serif';
  ctx.fillText(labelT, padL + 2, 12);
  ctx.fillStyle = P.text3;
  ctx.fillText(labelZ, W - padR - ctx.measureText(labelZ).width - 2, 12);
  ctx.fillStyle = P.text3; ctx.font = '9px "IBM Plex Mono", monospace';
  for (i = -3; i <= 3; i++) {
    var lab = dec2(i), tw = ctx.measureText(lab).width;
    ctx.fillText(lab, Math.min(Math.max(1, X(i) - tw / 2), W - tw - 1), H - padB + 13);
  }
}

/* ════════════════════════════════════════════════════════════════════════
   WIDGET 1 · how the average of a sample settles down as n grows
   ════════════════════════════════════════════════════════════════════════ */
function widgetSampling(mu0, sd0, n0, tol0) {

  function mount() {
    var es = LANG === 'es';

      { id: 'one', es: 'Un solo ticket',        en: 'A single ticket' },
      { id: 'avg', es: 'Promedio de la muestra', en: 'Average of the sample' }
    ];
    var tabs = MODES.map(function(m) {
      return '<button class="mtab' + (m.id === state.mode ? ' active' : '') + '" data-m="' + m.id + '">' + m[LANG] + '</button>';
    }).join('');
    host.innerHTML =
      '<div class="gcrd" data-widget="distribucion-muestral-de-la-media">' +
        '<div class="iw-head"><span class="iw-tag">' + (es ? 'Herramienta' : 'Tool') + '</span>' +
        '<span class="iw-title">' + (es ? 'Un ticket suelto contra el promedio de la muestra' : 'One loose ticket against the average of the sample') + '</span></div>' +
        '<div class="iw-sub">' + (es

          : 'A coffee shop chain wants to estimate the average ticket of its whole clientele and can only review a sample of bills. Switch tabs to compare two things that often get mixed up: how much the spending of any single customer varies and how much the average of the sample varies. Then move the sample size and watch the average become steadier, though not at the same pace as the sample grows.') + '</div>' +
        '<div class="mtabs">' + tabs + '</div>' +
        '<div class="cgrid"><div class="cg">' +
          '<label>' + (es ? 'Desviación estándar de la población' : 'Standard deviation of the population') + ': <span class="cval" id="w1sl"></span></label>' +
          '<input type="range" min="20" max="120" step="5" id="w1s" value="' + state.sd + '">' +
        '</div><div class="cg">' +

          '<input type="range" min="4" max="400" step="4" id="w1n" value="' + state.n + '">' +
        '</div></div>' +
        '<div class="cgrid"><div class="cg">' +
          '<label>' + (es ? 'Error que la gerencia tolera en pesos' : 'Error tolerated by management in pesos') + ': <span class="cval" id="w1tl"></span></label>' +

        '</div><div class="cg">' +

        '</div></div>' +
        '<canvas class="iw-canvas" id="w1cv"></canvas>' +
        '<div class="metrics">' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Dispersión mostrada' : 'Spread on display') + '</div><div class="mnum ts" id="w1sd"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Error estándar' : 'Standard error') + '</div><div class="mnum cs" id="w1se"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Veces más estable que un ticket' : 'Times steadier than one ticket') + '</div><div class="mnum ts" id="w1rf"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Cae dentro de lo tolerado' : 'Falls inside the tolerance') + '</div><div class="mnum cs" id="w1in"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Error si la muestra se cuadruplica' : 'Error if the sample quadruples') + '</div><div class="mnum ps" id="w1q"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Cuentas para la mitad del error' : 'Bills for half the error') + '</div><div class="mnum ps" id="w1h"></div></div>' +
        '</div>' +

    host.querySelectorAll('.mtab').forEach(function(b) {

    var se = seMean(sd, n);
    var shown = (state.mode === 'one') ? sd : se;
    var inside = pBet(mu - tol, mu + tol, mu, shown);
    var nHalf = Math.ceil(n * 4);
    host.querySelector('#w1sl').textContent = money(sd);
    host.querySelector('#w1nl').textContent = intN(n);
    host.querySelector('#w1tl').textContent = money(tol);
    host.querySelector('#w1sd').textContent = money(shown);
    host.querySelector('#w1se').textContent = dec2(se);
    host.querySelector('#w1rf').textContent = dec2(Math.sqrt(n));
    host.querySelector('#w1in').textContent = pr(inside);
    host.querySelector('#w1q').textContent  = dec2(seMean(sd, n * 4));
    host.querySelector('#w1h').textContent  = intN(nHalf);
    var modeMsg = (state.mode === 'one')
      ? (es
        ? 'Ahora la campana muestra el gasto de un cliente cualquiera, con toda la dispersión de la población: ' + money(sd) + '.'
        : 'The bell now shows the spending of any single customer, carrying the full spread of the population: ' + money(sd) + '.')
      : (es
        ? 'Ahora la campana muestra el promedio de las ' + intN(n) + ' cuentas de la muestra, y su dispersión es el error estándar: ' + dec2(se) + ' pesos.'
        : 'The bell now shows the average of the ' + intN(n) + ' bills in the sample, and its spread is the standard error: ' + dec2(se) + ' pesos.');
    host.querySelector('#w1read').innerHTML = (es
      ? '<strong>Lectura de negocio:</strong> ' : '<strong>Business reading:</strong> ') + modeMsg + (es
      ? ' El promedio de la muestra es ' + dec2(Math.sqrt(n)) + ' veces más estable que un ticket individual, porque la desviación se divide entre la raíz del tamaño de muestra y no entre el tamaño completo. Con esta muestra, el ' + pct1(inside) + ' por ciento de los muestreos posibles caería a menos de ' + money(tol) + ' del ticket real de la cadena. Si la gerencia quisiera la mitad de ese error tendría que revisar ' + intN(nHalf) + ' cuentas, es decir cuatro veces más trabajo de campo por solo el doble de precisión, y esa asimetría es la que encarece los estudios de mercado.'
      : ' The average of the sample is ' + dec2(Math.sqrt(n)) + ' times steadier than an individual ticket, because the deviation is divided by the square root of the sample size and not by the full size. With this sample, ' + pct1(inside) + ' percent of the possible samplings would land within ' + money(tol) + ' of the true ticket of the chain. If management wanted half that error it would have to review ' + intN(nHalf) + ' bills, that is four times the field work for only twice the precision, and that asymmetry is what makes market studies expensive.');
    var g = fitCanvas(host.querySelector('#w1cv'), 160);
    drawCurve(g, mu, shown,
      [{ a: mu - 4 * shown, b: mu - tol, kind: 2 }, { a: mu - tol, b: mu + tol, kind: 1 }, { a: mu + tol, b: mu + 4 * shown, kind: 2 }],
      { marks: [mu - tol, mu + tol], fmt: function(v) { return money(v); },
        muLabel: (es ? 'Ticket real ' : 'True ticket ') + money(mu) });
  }
  widgets.push(mount);
  mount();
}

/* ════════════════════════════════════════════════════════════════════════
   WIDGET 3 · the price of not knowing the deviation of the population
   ════════════════════════════════════════════════════════════════════════ */
function widgetT(n0, s0, cf0) {
  var host = document.createElement('div');
  host.className = 'section';
  document.getElementById('lessonBody').appendChild(host);
  var state = { n: n0, s: s0, cf: cf0 };
  function mount() {
    var es = LANG === 'es';
    host.innerHTML =
      '<div class="gcrd" data-widget="distribucion-t-y-grados-de-libertad">' +
        '<div class="iw-head"><span class="iw-tag">' + (es ? 'Herramienta' : 'Tool') + '</span>' +
        '<span class="iw-title">' + (es ? 'Lo que cuesta estimar la desviación con la propia muestra' : 'What it costs to estimate the deviation from the sample itself') + '</span></div>' +
        '<div class="iw-sub">' + (es
          ? 'Una consultora audita facturas de un proveedor y no conoce la variabilidad de la población: la estima con la misma muestra que va a usar para el intervalo. Esa incertidumbre extra se paga con una curva de colas más gruesas, la t de Student. La curva sólida es la t con los grados de libertad de tu muestra y la punteada es la normal. Baja el número de facturas y observa cómo se separan; súbelo y observa cómo vuelven a encimarse.'
          : 'A consultancy audits invoices from a supplier and does not know the variability of the population: it estimates it from the very sample that will produce the interval. That extra uncertainty is paid for with a curve of thicker tails, the Student t. The solid curve is the t with the degrees of freedom of your sample and the dotted one is the normal. Lower the number of invoices and watch them separate; raise it and watch them overlap again.') + '</div>' +
        '<div class="cgrid"><div class="cg">' +
          '<label>' + (es ? 'Facturas auditadas' : 'Invoices audited') + ': <span class="cval" id="w3nl"></span></label>' +
          '<input type="range" min="4" max="80" step="1" id="w3n" value="' + state.n + '">' +
        '</div><div class="cg">' +
          '<label>' + (es ? 'Nivel de confianza en por ciento' : 'Confidence level in percent') + ': <span class="cval" id="w3cl"></span></label>' +
          '<input type="range" min="80" max="99" step="1" id="w3c" value="' + state.cf + '">' +
        '</div></div>' +
        '<div class="cgrid"><div class="cg">' +
          '<label>' + (es ? 'Desviación estándar de la muestra' : 'Standard deviation of the sample') + ': <span class="cval" id="w3sl"></span></label>' +
          '<input type="range" min="4" max="60" step="2" id="w3s" value="' + state.s + '">' +
        '</div><div class="cg">' +
          '<label>' + (es ? 'Curva punteada' : 'Dotted curve') + '</label>' +
          '<div style="font-size:.74rem;color:var(--text3)">' + (es ? 'Es la normal, la que se usaría si la variabilidad fuera conocida' : 'It is the normal, the one used if the variability were known') + '</div>' +
        '</div></div>' +
        '<canvas class="iw-canvas" id="w3cv"></canvas>' +
        '<div class="metrics">' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Grados de libertad' : 'Degrees of freedom') + '</div><div class="mnum ts" id="w3df"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Valor crítico t' : 'Critical value t') + '</div><div class="mnum cs" id="w3t"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Valor crítico z' : 'Critical value z') + '</div><div class="mnum ts" id="w3z"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Margen usando t' : 'Margin using t') + '</div><div class="mnum cs" id="w3mt"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Margen usando z' : 'Margin using z') + '</div><div class="mnum ps" id="w3mz"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Sobrecosto en por ciento' : 'Extra cost in percent') + '</div><div class="mnum ps" id="w3ex"></div></div>' +
        '</div>' +
        '<div class="iw-read" id="w3read"></div>' +
      '</div>';
    host.querySelector('#w3n').addEventListener('input', function() { state.n  = parseInt(this.value, 10); update(); });
    host.querySelector('#w3c').addEventListener('input', function() { state.cf = parseInt(this.value, 10); update(); });
    host.querySelector('#w3s').addEventListener('input', function() { state.s  = parseInt(this.value, 10); update(); });
    update();
  }
  function update() {
    var es = LANG === 'es';
    var conf = state.cf / 100, df = state.n - 1;
    var tc = tCrit(conf, df), zc = zCrit(conf);
    var se = seMean(state.s, state.n);
    var mt = tc * se, mz = zc * se;
    var extra = (tc - zc) / zc;
    host.querySelector('#w3nl').textContent = intN(state.n);
    host.querySelector('#w3cl').textContent = dec2(state.cf);
    host.querySelector('#w3sl').textContent = money(state.s);

    host.querySelector('#w3z').textContent  = dec3(zc);
    host.querySelector('#w3mt').textContent = dec2(mt);
    host.querySelector('#w3mz').textContent = dec2(mz);
    host.querySelector('#w3ex').textContent = pct1(extra);
    host.querySelector('#w3read').innerHTML = es
      ? '<strong>Lectura de negocio:</strong> con ' + intN(state.n) + ' facturas quedan ' + intN(df) + ' grados de libertad y el valor crítico de la t vale ' + dec3(tc) + ', contra ' + dec3(zc) + ' de la normal. Sobre un error estándar de ' + dec2(se) + ' pesos eso significa un margen de ' + dec2(mt) + ' en lugar de ' + dec2(mz) + ', o sea ' + pct1(extra) + ' por ciento más ancho. Ese exceso es el precio de haber estimado la variabilidad con la propia muestra, y se vuelve casi invisible cuando la auditoría revisa muchas facturas. Reportar el intervalo con z en una muestra chica no lo hace más preciso: lo hace optimista, y esa es exactamente la clase de error que un auditor externo detecta.'
      : '<strong>Business reading:</strong> with ' + intN(state.n) + ' invoices there are ' + intN(df) + ' degrees of freedom and the critical value of the t is worth ' + dec3(tc) + ', against ' + dec3(zc) + ' for the normal. Over a standard error of ' + dec2(se) + ' pesos that means a margin of ' + dec2(mt) + ' instead of ' + dec2(mz) + ', that is ' + pct1(extra) + ' percent wider. That excess is the price of having estimated variability from the sample itself, and it becomes almost invisible once the audit reviews many invoices. Reporting the interval with z on a small sample does not make it more precise: it makes it optimistic, and that is exactly the kind of error an outside auditor catches.';
    var g = fitCanvas(host.querySelector('#w3cv'), 160);
    drawTvsZ(g, df, tc, zc,
      (es ? 'Curva t con ' : 't curve with ') + intN(df) + (es ? ' grados' : ' degrees'),
      (es ? 'Normal' : 'Normal'));
  }
  widgets.push(mount);
  mount();
}

/* ════════════════════════════════════════════════════════════════════════
   WIDGET 4 · intervals for a proportion and the sample size they demand
   ════════════════════════════════════════════════════════════════════════ */
function widgetProp(p0, n0, cf0, e0) {
  var host = document.createElement('div');
  host.className = 'section';

          : 'The marketing team surveys customers to estimate what percentage would buy again. Here nothing is measured, a yes is counted among many, and the standard error depends on the proportion itself. Move the observed proportion and you will see the margin is wider near one half than at the extremes. Then move the target margin and the calculator returns how many surveys have to be run.') + '</div>' +

          '<input type="range" min="80" max="99" step="1" id="w4c" value="' + state.cf + '">' +

          '<label>' + (es ? 'Margen objetivo en puntos' : 'Target margin in points') + ': <span class="cval" id="w4el"></span></label>' +
          '<input type="range" min="1" max="10" step="1" id="w4e" value="' + state.e + '">' +
        '</div></div>' +
        '<canvas class="iw-canvas" id="w4cv"></canvas>' +
        '<div class="metrics">' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Error estándar' : 'Standard error') + '</div><div class="mnum ts" id="w4se"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Valor crítico z' : 'Critical value z') + '</div><div class="mnum ps" id="w4z"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Margen de error' : 'Margin of error') + '</div><div class="mnum ps" id="w4me"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Límite inferior' : 'Lower limit') + '</div><div class="mnum cs" id="w4lo"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Límite superior' : 'Upper limit') + '</div><div class="mnum cs" id="w4hi"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Encuestas para el margen objetivo' : 'Surveys for the target margin') + '</div><div class="mnum cs" id="w4nn"></div></div>' +
        '</div>' +
        '<div class="iw-read" id="w4read"></div>' +
      '</div>';
    host.querySelector('#w4p').addEventListener('input', function() { state.p  = parseInt(this.value, 10); update(); });
    host.querySelector('#w4n').addEventListener('input', function() { state.n  = parseInt(this.value, 10); update(); });

    host.querySelector('#w4e').addEventListener('input', function() { state.e  = parseInt(this.value, 10); update(); });
    update();

  function update() {

    var g = fitCanvas(host.querySelector('#w4cv'), 160);
    drawCurve(g, p, se,

      { marks: [p - me, p + me], fmt: function(v) { return pctS(v); },
        muLabel: (es ? 'Proporción observada ' : 'Observed proportion ') + pctS(p) });
  }
  widgets.push(mount);
  mount();
}

      '<h2>De una muestra al total de la operación</h2>' +
      '<p>Casi ninguna decisión de negocio se toma con toda la información. Nadie revisa los tickets de todos los clientes del año, ni audita las cien mil facturas de un proveedor, ni encuesta al padrón completo de compradores. Se toma una muestra, se calcula un promedio y con eso se decide. La pregunta que abre este tema es incómoda y honesta: si otro analista hubiera tomado una muestra distinta el mismo día, habría obtenido un promedio distinto. ¿Qué tanto distinto?</p>' +
      '<p>El promedio de una muestra es un <strong>estimador puntual</strong> del promedio de la población. Es la mejor apuesta con la información disponible, pero es una apuesta que cambia de muestra en muestra. Si se repitiera el muestreo muchas veces y se anotara cada promedio obtenido, esos promedios formarían su propia distribución, llamada <strong>distribución muestral de la media</strong>. Su centro coincide con el promedio verdadero de la población, y ahí está la buena noticia: el procedimiento no está sesgado, no tiende a quedarse ni corto ni largo de manera sistemática.</p>' +
      '<p>La dispersión de esa distribución es lo que interesa para el negocio, y tiene nombre propio: el <strong>error estándar</strong>. Vale la desviación estándar de la población dividida entre la raíz del tamaño de muestra. Conviene detenerse en el detalle de la raíz porque ahí se esconde el costo real de la precisión. Duplicar la muestra no reduce el error a la mitad, apenas lo baja a poco más del setenta por ciento. Para reducirlo a la mitad hace falta cuadruplicar la muestra, y para reducirlo a la décima parte hace falta multiplicarla por cien.</p>' +

      '<div class="stag">Concept 1</div>' +
      '<h2>From one sample to the whole operation</h2>' +
      '<p>Almost no business decision is made with complete information. Nobody reviews the tickets of every customer in the year, or audits the hundred thousand invoices of a supplier, or surveys the entire register of buyers. A sample is taken, an average is computed and a decision follows. The question that opens this topic is uncomfortable and honest: if another analyst had taken a different sample on the same day, they would have obtained a different average. How different?</p>' +
      '<p>The average of a sample is a <strong>point estimate</strong> of the average of the population. It is the best bet with the information at hand, but it is a bet that changes from sample to sample. If the sampling were repeated many times and every average were written down, those averages would form their own distribution, called the <strong>sampling distribution of the mean</strong>. Its centre coincides with the true average of the population, and that is the good news: the procedure is not biased, it does not systematically land short or long.</p>' +

      '</div>' +
      '<p><strong>Worked example.</strong> A coffee shop chain knows from its history that spending per visit has a standard deviation of ' + money(sg1) + '. For this quarter study a sample of ' + intN(n1) + ' bills will be reviewed. Management wants to know how close to the true average ticket the sample average will land, and accepts an error of up to ' + money(tol1) + '.</p>' +

    if (es) return '' +
      '<div class="stag">Concepto 2</div>' +
      '<h2>El intervalo de confianza para la media</h2>' +
      '<p>Reportar un promedio muestral solo, sin decir qué tan firme es, esconde información que el que decide necesita. Un gasto promedio estimado de dos mil seiscientos pesos con una muestra de ochenta clientes y el mismo número obtenido con ocho clientes valen cosas muy distintas, aunque en la diapositiva se vean idénticos. El <strong>intervalo de confianza</strong> resuelve eso: en lugar de una cifra suelta reporta un rango, y junto con el rango declara qué tan seguido el procedimiento acierta.</p>' +
      '<p>La construcción es directa. Se parte del promedio de la muestra y se le suma y se le resta un <strong>margen de error</strong>, que es el producto de dos cosas: un valor crítico que depende de la confianza elegida y el error estándar del promedio. El valor crítico traduce la confianza a distancias en la campana. Para el noventa por ciento vale alrededor de uno punto seis cuatro cinco, para el noventa y cinco por ciento alrededor de uno punto nueve seis, y para el noventa y nueve por ciento alrededor de dos punto cinco siete cinco.</p>' +
      '<p>La <strong>interpretación</strong> merece cuidado porque es donde casi todos resbalan. Decir que hay noventa y cinco por ciento de probabilidad de que el gasto promedio real caiga dentro de este intervalo suena natural y es incorrecto: el gasto promedio real es un número fijo, no una variable, y este intervalo ya está calculado, así que o lo contiene o no lo contiene. Lo que sí se puede afirmar es esto: si se repitiera el estudio muchas veces con el mismo método, alrededor del noventa y cinco por ciento de los intervalos construidos así contendrían el valor real. La confianza describe al procedimiento, no a este intervalo en particular.</p>' +
      '<p>Del intervalo se leen dos cosas de negocio. El centro dice cuál es la mejor estimación y el ancho dice qué tan lejos se está de poder tomar decisiones finas. Un intervalo tan ancho que abarca escenarios que exigen acciones opuestas no es un resultado, es una señal de que la muestra no alcanzó.</p>' +
      '<div class="rules-grid">' +
        '<div class="rcard"><div class="rname">Intervalo</div><div class="rform">promedio ± margen</div><div class="rnote">Centro del rango y su holgura.</div></div>' +
        '<div class="rcard"><div class="rname">Margen de error</div><div class="rform">valor crítico × EE</div><div class="rnote">Todo el ancho sale de aquí.</div></div>' +
        '<div class="rcard"><div class="rname">Valor crítico</div><div class="rform">1.645 · 1.96 · 2.576</div><div class="rnote">Para 90, 95 y 99 por ciento.</div></div>' +

      '</div>' +
      '<p><strong>Ejemplo resuelto.</strong> Una tienda departamental levantó una muestra aleatoria de ' + intN(n3) + ' tickets y obtuvo un gasto promedio por visita de ' + money(mu3) + '. Por estudios anteriores se acepta que la desviación estándar del gasto en la población es ' + money(sg3) + '. La dirección pidió el intervalo al ' + pct1(cf3) + ' por ciento de confianza para incluirlo en el reporte trimestral.</p>' +

      '<strong>Paso 2.</strong> Al ' + pct1(cf3) + ' por ciento de confianza el valor crítico vale ' + dec3(z3) + '.<br>' +

      '<p>Los dos ejemplos anteriores tenían una comodidad que la práctica rara vez concede: la desviación estándar de la población venía del histórico. En un negocio real esa cifra casi nunca está disponible. Se abre una sucursal nueva, se lanza un producto sin antecedente, se audita a un proveedor por primera vez. Lo único que hay es la muestra, y de ella hay que sacar tanto el promedio como la variabilidad.</p>' +
      '<p>Sustituir la desviación de la población por la de la muestra parece un cambio menor y no lo es. El error estándar deja de ser una cantidad fija y pasa a ser una cantidad estimada, con su propio error. Ignorar esa incertidumbre extra produce intervalos demasiado angostos, es decir reportes que prometen más precisión de la que tienen. La corrección es usar la <strong>distribución t de Student</strong> en lugar de la normal.</p>' +
      '<p>La curva t se parece a la normal pero tiene <strong>colas más gruesas</strong>, y por eso sus valores críticos son más grandes y los intervalos salen más anchos. Su forma exacta depende de un solo parámetro, los <strong>grados de libertad</strong>, que valen el tamaño de muestra menos uno. El nombre tiene una razón intuitiva: una vez fijado el promedio de la muestra, solo n menos uno de los datos pueden moverse libremente, porque el último queda determinado. Conforme los grados de libertad crecen, la t se acerca a la normal hasta volverse indistinguible, y con muestras de treinta o más la diferencia deja de importar en la práctica.</p>' +
      '<p>La regla de decisión para el trabajo diario es corta. Si la desviación de la población se conoce de verdad, se usa el valor crítico de la normal. Si la desviación se estimó con la propia muestra, se usa el de la t con n menos uno grados de libertad. En muestras chicas la diferencia es grande y cambia conclusiones; en muestras grandes es cosmética, pero usar la t nunca está mal.</p>' +

      '<p>Replacing the deviation of the population with that of the sample looks like a minor change and it is not. The standard error stops being a fixed quantity and becomes an estimated one, with an error of its own. Ignoring that extra uncertainty produces intervals that are too narrow, that is reports promising more precision than they hold. The fix is to use the <strong>Student t distribution</strong> instead of the normal.</p>' +
      '<p>The t curve resembles the normal but has <strong>thicker tails</strong>, and that is why its critical values are larger and the intervals come out wider. Its exact shape depends on a single parameter, the <strong>degrees of freedom</strong>, worth the sample size minus one. The name has an intuitive reason: once the average of the sample is fixed, only n minus one of the data can move freely, because the last one is already determined. As the degrees of freedom grow, the t approaches the normal until it becomes indistinguishable, and with samples of thirty or more the difference stops mattering in practice.</p>' +

      '<div class="stag">Concepto 4</div>' +
      '<h2>Proporciones y el tamaño de muestra que exigen</h2>' +
      '<p>Una parte enorme de la información comercial no se mide sino que se cuenta como un sí o un no. Clientes que recomendarían la marca, créditos que cayeron en mora, pedidos entregados completos, votantes que prefieren una opción. En todos esos casos el parámetro de interés es una <strong>proporción</strong>, y el estimador natural es la proporción observada en la muestra: el número de casos favorables entre el total de encuestados.</p>' +
      '<p>La estructura del intervalo no cambia. Se toma la proporción observada y se le suma y se le resta un margen de error, que otra vez es el valor crítico multiplicado por el error estándar. Lo único distinto es la fórmula del error estándar: la raíz de la proporción por su complemento, todo dividido entre el tamaño de muestra. Esa fórmula tiene una consecuencia práctica curiosa. El producto de la proporción por su complemento alcanza su máximo cuando la proporción vale la mitad, así que un mercado partido por la mitad es el más caro de medir, y un fenómeno muy raro o muy común se estima con menos encuestas.</p>' +
      '<p>Hay una <strong>condición de uso</strong> que conviene revisar antes de reportar nada. La aproximación normal necesita al menos diez casos favorables esperados y al menos diez desfavorables. Con proporciones muy pequeñas y muestras chicas la campana deja de describir bien la situación y el intervalo puede incluso salirse del rango de cero a uno, lo cual delata que el método no aplica.</p>' +
      '<p>El uso más valioso de todo este tema es al revés: no calcular el margen que salió, sino decidir el <strong>tamaño de muestra</strong> antes de gastar. Si la dirección fija cuánto error tolera, la fórmula del margen se despeja y devuelve el número de observaciones necesarias. Para una media hace falta una idea previa de la desviación estándar; para una proporción hace falta una idea previa de la proporción, y cuando no se tiene se usa la mitad, que es el escenario más exigente y por lo tanto el presupuesto seguro. El resultado siempre se redondea hacia arriba, porque una fracción de encuesta no existe.</p>' +

  var lr = document.getElementById('logo-right');  if (lr) lr.alt = SCHOOL.logoRightAlt;

/* Rebuilds the visible text of every card without touching the numbers. */
function applyProblemLang() {
  problems.forEach(function(p, i) {
    var card = document.getElementById('pc' + i);
    if (!card || !p.i18n) return;
    p.title        = p.i18n.title[LANG];
    p.questionText = p.i18n.q[LANG];
    p.hint         = p.i18n.hint[LANG];
    p.explanation  = p.i18n.exp[LANG];
    p.options      = p.i18n.opts[LANG].slice();
    var ti = card.querySelector('.ptitle'); if (ti) ti.textContent = p.title;
    var st = card.querySelector('.pstmt');
    if (st) st.innerHTML = p.questionText + '<span class="pfn">' + (p.fn || '') + '</span>';
    var hb = card.querySelector('.hintbox'); if (hb) hb.innerHTML = p.hint;
    var hbtn = card.querySelector('.hintbtn'); if (hbtn) hbtn.textContent = t('btn-hint');
    card.querySelectorAll('.mcopt').forEach(function(o, oi) {
      if (p.options[oi] !== undefined) o.innerHTML = p.options[oi];
    });
    var tabs = card.querySelectorAll('.wtab');
    if (tabs.length === 3) {
      tabs[0].textContent = t('tab-draw');
      tabs[1].textContent = t('tab-type');
      tabs[2].textContent = t('tab-photo');
    }
    var tools = card.querySelectorAll('.tbtn2');
    if (tools.length === 3) {
      tools[0].textContent = t('tool-pen');
      tools[1].textContent = t('tool-mark');
      tools[2].textContent = t('tool-erase');
    }
    var clr = card.querySelector('.clrbtn'); if (clr) clr.textContent = t('tool-clear');
    var ta  = card.querySelector('.wtextarea'); if (ta) ta.placeholder = t('ph-work');
    var pzt = card.querySelector('.pztxt'); if (pzt) pzt.textContent = t('ph-photo');
    var lab = card.querySelector('.pbody > div:last-child > div:first-child');
    if (lab) lab.textContent = t('lbl-answer');
    var fb = card.querySelector('.mcfb');
    if (fb && fb.classList.contains('show')) {
      var isOk = (p.studentChoice === p.correctIdx);
      fb.innerHTML = '<strong>' + (isOk ? t('fb-correct') : t('fb-wrong')) + '</strong> ' + p.explanation;
    }
  });
}
function setLang(l) {
  LANG = l;
  try { localStorage.setItem(LANG_KEY, l); } catch(e) {}
  document.documentElement.setAttribute('lang', l);
  var be = document.getElementById('btn-es'), bn = document.getElementById('btn-en');
  if (be) be.classList.toggle('active', l === 'es');
  if (bn) bn.classList.toggle('active', l === 'en');
  applyUIStrings();
  applySectionLang();
  applyProblemLang();
  widgets.forEach(function(f) { try { f(); } catch(e) {} });
  document.querySelectorAll('#lessonBody .section').forEach(function(s) { s.classList.add('vis'); });
}
(function() {
  try { var stored = localStorage.getItem(LANG_KEY); if (stored === 'es' || stored === 'en') LANG = stored; } catch(e) {}
  document.addEventListener('DOMContentLoaded', function() {
    document.documentElement.setAttribute('lang', LANG);
    var be = document.getElementById('btn-es'), bn = document.getElementById('btn-en');
    if (be) be.classList.toggle('active', LANG === 'es');
    if (bn) bn.classList.toggle('active', LANG === 'en');
    applyUIStrings();
  });
})();

    }
    var ok = document.getElementById('pc'+i).classList.contains('ok');
    doc.setFillColor(ok?232:255, ok?240:232, ok?232:228);
    doc.roundedRect(M,sy,TW,10,2,2,'F');
    doc.setFillColor(ok?26:176, ok?106:48, ok?74:16);
    doc.circle(M+6, sy+5, 2.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(7); doc.setFont('helvetica','bold');
    doc.text(ok?'v':'x', M+4.5, sy+6.5);
    doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('helvetica','normal');
    doc.text(t('pdf-item')+' '+(i+1)+': '+pdfText(prob.title), M+12, sy+6.5);
    doc.setTextColor(ok?26:176, ok?106:48, ok?74:16);
    doc.text(ok?t('pdf-ok'):t('pdf-bad'), PW-M-24, sy+6.5);
    sy += 12;
  });

  for (var i = 0; i < problems.length; i++) {
    var prob = problems[i];
    doc.addPage();
    var wy = 0;

    doc.setFillColor(pBR,pBG,pBB); doc.rect(0,0,PW,20,'F');
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,3,'F');
    doc.setTextColor(pAR,pAG,pAB); doc.setFontSize(7); doc.setFont('helvetica','normal');
    doc.text(SCHOOL.courseName[LANG]+'  ·  '+SCHOOL.guideTitle[LANG], M, 10);
    doc.setTextColor(240,244,238); doc.setFontSize(10.5); doc.setFont('helvetica','bold');
    doc.text(t('pdf-item')+' '+(i+1)+' '+t('pdf-of')+' '+total+'  ·  '+pdfText(prob.title), M, 17);
    wy = 25;

    var qRaw = pdfText(prob.questionText);
    doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var qLines = doc.splitTextToSize(qRaw, TW-10);
    var qBoxH  = 8 + qLines.length*5 + 3;
    doc.setFillColor(237,240,245); doc.roundedRect(M,wy,TW,qBoxH,2,2,'F');
    doc.setTextColor(pBR,pBG,pBB); doc.setFontSize(6.5); doc.setFont('helvetica','bold');
    doc.text(t('pdf-question'), M+4, wy+6);
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var qy = wy+12;
    qLines.forEach(function(ln,li){ doc.text(ln, M+4, qy+li*5); });
    wy += qBoxH + 4;

    var isOk   = document.getElementById('pc'+i).classList.contains('ok');
    var chosen = prob.studentChoice != null ? pdfText(prob.options[prob.studentChoice]||'') : '';
    var corr   = pdfText(prob.options[prob.correctIdx]||'');
    var expRaw = pdfText(prob.explanation||'');
    doc.setFontSize(8.5); var chLines = doc.splitTextToSize(t('pdf-yours')+chosen, TW-18);
    doc.setFontSize(8);   var coLines = doc.splitTextToSize(t('pdf-key')+corr, TW-18);
    doc.setFontSize(7.5); var exLines = doc.splitTextToSize(t('pdf-sol')+expRaw, TW-18).slice(0,4);
    var ansBoxH = 8 + chLines.length*5.5 + coLines.length*5 + exLines.length*5 + 6;
    doc.setFillColor(isOk?232:255, isOk?240:232, isOk?232:228);
    doc.roundedRect(M,wy,TW,ansBoxH,2,2,'F');
    doc.setFillColor(isOk?26:176, isOk?106:48, isOk?74:16);
    doc.circle(M+7, wy+8, 3.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(9); doc.setFont('helvetica','bold');
    doc.text(isOk?'v':'x', M+5.2, wy+10.5);
    var ay = wy+7;
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','bold');
    chLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5.5); });
    ay += chLines.length*5.5 + 3;
    doc.setTextColor(26,106,74); doc.setFontSize(8); doc.setFont('helvetica','normal');
    coLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    ay += coLines.length*5 + 3;
    doc.setTextColor(90,85,80); doc.setFontSize(7.5);
    exLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    wy += ansBoxH + 5;

    var dc = document.getElementById('dc'+i);
    if (dc) {
      doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
      doc.setFontSize(7); doc.setFont('helvetica','bold');
      doc.rect(M,wy,TW,8,'F'); doc.text(t('pdf-work'), M+4, wy+5.5);
      wy += 11;
      try {
        var imgD = dc.toDataURL('image/png');
        var ar   = dc.height / dc.width;
        var iw   = TW;
        var ih   = Math.min(iw * ar, 68);
        doc.addImage(imgD, 'PNG', M, wy, iw, ih);
        wy += ih + 4;
      } catch(e) {}
    }

    var ta = document.getElementById('ta'+i);
    if (ta && ta.value.trim()) {
      if (wy > PH-30) { doc.addPage(); wy = 20; }
      doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('courier','normal');
      var taLines = doc.splitTextToSize(ta.value, TW);
      taLines.slice(0,16).forEach(function(ln) {
        if (wy > PH-15) { doc.addPage(); wy = 20; }
        doc.text(ln, M, wy); wy += 5;
      });
      wy += 2;
    }

    var pp = document.getElementById('pp'+i);
    if (pp && pp.src && pp.src.indexOf('data:') === 0) {
      if (wy > PH-55) { doc.addPage(); wy = 20; }
      try { doc.addImage(pp.src, 'JPEG', M, wy, TW, 68); wy += 72; } catch(e) {}
    }
  }

  var pages = doc.internal.getNumberOfPages();
  for (var p = 1; p <= pages; p++) {
    doc.setPage(p);
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0, PH-3, PW, 3, 'F');
    doc.setTextColor(130,140,160); doc.setFontSize(6.5); doc.setFont('helvetica','normal');
    doc.text(name+'  ·  '+group+'  ·  '+t('pdf-code')+code+'  ·  '+t('pdf-page')+p+'/'+pages,
      PW/2, PH-5, {align:'center'});
  }

  var _fn = SCHOOL.filePrefix + '_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf';
  var _pdfBlob = doc.output('blob');
  var _blobUrl = URL.createObjectURL(_pdfBlob);
  var _a = document.createElement('a');
  _a.href = _blobUrl;
  _a.download = _fn;
  document.body.appendChild(_a);
  _a.click();
  setTimeout(function(){ document.body.removeChild(_a); URL.revokeObjectURL(_blobUrl); }, 200);
  btn.textContent = t('btn-pdf');
  btn.disabled  = false;
}
</script>
</body>
</html>
