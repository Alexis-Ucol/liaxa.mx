<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Introducción a la Estadística para Negocios | Facultad de Economía, Universidad de Colima</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS (fallback; runtime applyBranding always wins) ────────── */
:root {
  --green:      #4a7c3f;
  --green-dark: #2d5a27;
  --green-bg:   #eaf0e7;
  --gold:       #c9a84c;
  --gold-bg:    #faf3e0;
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #6aaa5f;
  --green-dark: #8ecf82;
  --green-bg:   #1a281a;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; max-width:42%; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--green-bg); border:1.5px solid var(--green); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--green-dark); text-align:left; }
#restoreBar strong { color:var(--green-dark); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; object-fit:contain; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; overflow:hidden; text-overflow:ellipsis; max-width:150px; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── LANGUAGE TOGGLE ── */
.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); overflow-x:auto; }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH / WIDGET CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; font-family:inherit; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── INTERACTIVE WIDGETS ── */
.iw-h { font-family:'Crimson Pro',serif; font-size:1.1rem; font-weight:700; margin-bottom:.15rem; }
.iw-sub { font-size:.78rem; color:var(--text3); margin-bottom:.9rem; }
.iw-row { display:flex; flex-wrap:wrap; align-items:center; gap:.35rem; margin-bottom:.5rem; padding-bottom:.5rem; border-bottom:1px solid var(--border); }
.iw-var { flex:1 1 170px; font-size:.82rem; color:var(--text2); }
.iw-ok  { background:var(--ok-bg);  border-color:var(--ok);  color:var(--ok); }
.iw-bad { background:var(--bad-bg); border-color:var(--bad); color:var(--bad); }
.iw-note { font-size:.78rem; color:var(--text2); margin-top:.7rem; }
.iw-bars { display:flex; align-items:flex-end; gap:.25rem; height:160px; padding:.5rem .4rem; background:var(--surface2); border-radius:8px; }
.iw-col { flex:1; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; height:100%; }
.iw-cnt { font-family:'IBM Plex Mono',monospace; font-size:.6rem; color:var(--text3); margin-bottom:.15rem; }
.iw-bar { width:100%; background:var(--green); border-radius:3px 3px 0 0; min-height:2px; }
.iw-axis { display:flex; gap:.25rem; margin-top:.3rem; }
.iw-tick { flex:1; text-align:center; font-size:.58rem; color:var(--text3); font-family:'IBM Plex Mono',monospace; }
.ftwrap { overflow-x:auto; margin:.7rem 0; }
.ftab { width:100%; border-collapse:collapse; font-size:.8rem; min-width:340px; }
.ftab th, .ftab td { border:1px solid var(--border); padding:.35rem .5rem; text-align:center; color:var(--text2); }
.ftab th { background:var(--surface2); color:var(--text3); font-size:.68rem; text-transform:uppercase; letter-spacing:.05em; }
.ftab tr.hl td { background:var(--green-bg); color:var(--green-dark); font-weight:600; }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; font-family:inherit; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); font-family:inherit; }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; font-family:inherit; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; font-family:inherit; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--gold-bg); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; font-family:inherit; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }

/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos { gap: .9rem; }
  .wlogos img { height: 38px; max-width: 40%; }
  .wtitle { font-size: 1.35rem; }
  .stickybar { padding: .5rem .55rem; gap: .4rem; }
  .htitle { display: none; }
  .halexis { display: none; }
  .hsep { display: none; }
  .hlogos img { height: 20px; max-width: 62px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 92px; overflow: hidden; text-overflow: ellipsis; }
  .lang-btn { padding: .26rem .45rem; font-size: .66rem; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .gcrd { padding: .9rem; }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
  .iw-bars { height: 130px; }
  .iw-tick { font-size: .5rem; }
}
</style>
</head>
<body>

<!-- ════════════════════ WELCOME ════════════════════ -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <img id="wlogo-left"  src="" alt="Facultad de Economía" style="display:none">
      <div class="wlogsep" id="wlogsep"></div>
      <img id="wlogo-right" src="" alt="Universidad de Colima" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Introducción a la Estadística para Negocios</div>
    <div class="wcourse" id="wcourse-el">Estadística · Facultad de Economía, Universidad de Colima</div>
    <label class="flabel" for="sName" id="lbl-name-el" data-tx="lbl-name">Nombre completo</label>
    <input class="finput" id="sName" type="text" data-tx-ph="ph-name" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" for="sGroup" id="lbl-group-el" data-tx="lbl-group">Grupo</label>
    <input class="finput" id="sGroup" type="text" data-tx-ph="ph-group" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" data-tx="btn-start" onclick="startLesson()">Comenzar</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreTitle" data-tx="restore-title">Sesión guardada encontrada</strong><br>
      <span id="restoreMsg" data-tx="restore-msg">Puedes continuar donde la dejaste.</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" data-tx="btn-restore" onclick="restoreSession()">Retomar sesión</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" data-tx="btn-dismiss" onclick="dismissRestore()">Empezar de nuevo</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.9rem">
      <svg width="160" height="52" viewBox="0 0 180 52" xmlns="http://www.w3.org/2000/svg">
        <style>
          .lbt { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.1em; fill:var(--green); font-size:28px; }
          .lbl { stroke:var(--gold); stroke-width:2.5; }
          .lba { fill:var(--gold); }
        </style>
        <polyline points="5,40 14,28 24,33 36,14" fill="none" stroke="var(--green)" stroke-width="3"/>
        <circle cx="36" cy="14" r="4.5" class="lba"/>
        <line x1="52" y1="6" x2="52" y2="46" class="lbl"/>
        <text x="64" y="38" class="lbt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- ════════════════════ LESSON ════════════════════ -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <img id="hlogo-left"  src="" alt="Facultad de Economía" style="display:none">
      <img id="hlogo-right" src="" alt="Universidad de Colima" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle" id="htitle-el">Introducción a la Estadística para Negocios</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg">
        <style>
          .lht { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
          .lhl { stroke:var(--gold); stroke-width:2; }
          .lha { fill:var(--gold); }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" fill="none" stroke="var(--green)" stroke-width="2"/>
        <circle cx="22" cy="10" r="2.5" class="lha"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lhl"/>
        <text x="42" y="22" class="lht">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle">
      <button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button>

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t2 = s ^ (s >>> 16);
    t2 = Math.imul(t2, 0x21f0aaad);
    t2 ^= (t2 >>> 15);
    t2 = Math.imul(t2, 0x735a2d97);
    return ((t2 ^ (t2 >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}
/* shuffles the ES and EN option lists with the SAME permutation */
function shufPair(es, en, correct0, rng) {
  var idx = es.map(function(_, k) { return k; });
  for (var i = idx.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = idx[i]; idx[i] = idx[j]; idx[j] = tmp;
  }
  return {
    es: idx.map(function(k) { return es[k]; }),
    en: idx.map(function(k) { return en[k]; }),
    correctIdx: idx.indexOf(correct0)
  };
}
/* number helpers */
function nf(x) { return String(Math.round(x)).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
function money(x) { return '$' + nf(x); }
function d1(x) { return (Math.round(x * 10) / 10).toFixed(1); }
function pc1(x) { return d1(x) + '%'; }
/* builds 4 distinct option strings: correct first, then alternates, then nudges */
function opts4(correct, alts, nudge) {
  var out = [correct], i;
  for (i = 0; i < alts.length && out.length < 4; i++) {
    if (out.indexOf(alts[i]) < 0) out.push(alts[i]);
  }
  var k = 1;
  while (out.length < 4 && k < 60) {
    var c = nudge(k);
    if (out.indexOf(c) < 0) out.push(c);
    k++;
  }
  return out;
}

  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });

function restoreSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  var saved = loadSession(name, group);
  if (!saved) return;
  document.getElementById('restoreBar').style.display = 'none';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = currentAttempt(name, group);
  var rng = seededRng(name + group + att);

  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';

    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
  saved.choices.forEach(function(choice, idx) {
    if (choice !== null && choice !== undefined) confirmMC(idx, choice);
  });

    if (saved.drawings) {

        var ta = document.getElementById('ta' + i);

        pp.src = dataUrl; pp.style.display = 'block';

        if (pz) pz.style.opacity = '0.4';
      });
    }
  }, 300);
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#2d5a27';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER (two taps to confirm)
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = '<strong>' + (isOk ? t('fb-correct') : t('fb-wrong')) + '</strong> ' + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (!prob || prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = '<strong>' + (isOk ? t('fb-correct') : t('fb-wrong')) + '</strong> ' + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

function lcg(seed) {
  var s = seed >>> 0;
  return function() { s = (Math.imul(1664525, s) + 1013904223) >>> 0; return s / 4294967296; };
}

/* ── WIDGET 1: sampling simulator ─────────────────────────────────────── */
function widgetSampling(D) {
  var el = document.createElement('div');
  el.setAttribute('data-widget', 'sampling');
  el.className = 'gcrd section';
  el.id = 'wgSampling';
  var st = { n: 20, seed: D.wseed, mean: 0 };
  function draw() {
    var r = lcg(st.seed);
    st.seed = (Math.imul(st.seed, 22695477) + 1) >>> 0;
    var idx = D.pop.map(function(_, i) { return i; });
    for (var i = idx.length - 1; i > 0; i--) {
      var j = Math.floor(r() * (i + 1));
      var tmp = idx[i]; idx[i] = idx[j]; idx[j] = tmp;
    }
    var s = 0;
    for (i = 0; i < st.n; i++) s += D.pop[idx[i]];
    st.mean = s / st.n;
  }
  function upd() {
    var a = el.querySelector('#wsN');    if (a) a.textContent = st.n;
    var b = el.querySelector('#wsMean'); if (b) b.textContent = d1(st.mean);
    var c = el.querySelector('#wsErr');  if (c) c.textContent = d1(Math.abs(st.mean - D.popMean));
    var f = el.querySelector('#wsRange');if (f) f.textContent = st.n;
  }
  function render() {
    var es = LANG === 'es';
    el.innerHTML =
      '<div class="iw-h">' + (es ? 'Simulador de muestreo' : 'Sampling simulator') + '</div>' +
      '<div class="iw-sub">' + (es
        ? 'Aquí conocemos la venta mensual de las ' + D.N + ' sucursales, algo que en la realidad casi nunca ocurre. Cambia el tamaño de muestra, toma varias muestras y observa cómo se comporta el error de estimación.'
        : 'Here we know the monthly sales of all ' + D.N + ' branches, something that almost never happens in practice. Change the sample size, draw several samples and watch how the estimation error behaves.') + '</div>' +
      '<div class="cgrid"><div class="cg">' +
        '<label>' + (es ? 'Tamaño de muestra n' : 'Sample size n') + ': <span class="cval" id="wsRange">' + st.n + '</span></label>' +
        '<input type="range" id="wsSlider" min="5" max="60" step="1" value="' + st.n + '">' +
      '</div><div class="cg">' +
        '<label>&#8203;</label>' +
        '<button class="mtab" id="wsDraw">' + (es ? 'Tomar otra muestra' : 'Draw another sample') + '</button>' +
      '</div></div>' +
      '<div class="metrics">' +
        '<div class="metric"><div class="mlbl">' + (es ? 'Media poblacional' : 'Population mean') + '</div><div class="mnum ts">' + d1(D.popMean) + '</div></div>' +
        '<div class="metric"><div class="mlbl">' + (es ? 'Media de la muestra' : 'Sample mean') + '</div><div class="mnum cs" id="wsMean">' + d1(st.mean) + '</div></div>' +
        '<div class="metric"><div class="mlbl">' + (es ? 'Error de estimación' : 'Estimation error') + '</div><div class="mnum ps" id="wsErr">' + d1(Math.abs(st.mean - D.popMean)) + '</div></div>' +
      '</div>' +
      '<div class="iw-note">' + (es
        ? 'Cifras en miles de pesos por sucursal. Con n = <span id="wsN">' + st.n + '</span> sucursales, cada muestra da un promedio distinto: eso es variabilidad muestral, no un error de captura.'
        : 'Figures in thousands of pesos per branch. With n = <span id="wsN">' + st.n + '</span> branches, every sample gives a different average: that is sampling variability, not a data entry mistake.') + '</div>';
    var sl = el.querySelector('#wsSlider');
    sl.addEventListener('input', function() { st.n = parseInt(sl.value, 10); draw(); upd(); });
    el.querySelector('#wsDraw').addEventListener('click', function() { draw(); upd(); });
    upd();
  }
  draw();
  render();
  document.getElementById('lessonBody').appendChild(el);
  WIDGETS.push({ el: el, relabel: render });
}

/* ── WIDGET 3: frequency table / histogram builder ────────────────────── */
function widgetHistogram(D) {
  var el = document.createElement('div');
  el.setAttribute('data-widget', 'histogram');
  el.className = 'gcrd section';
  el.id = 'wgHistogram';
  var st = { k: 5 };
  function bins(k) {
    var w = 200 / k, arr = [], i;
    for (i = 0; i < k; i++) arr.push(0);
    D.raw.forEach(function(v) {
      var idx = Math.floor((v - D.base) / w);
      if (idx < 0) idx = 0;
      if (idx > k - 1) idx = k - 1;
      arr[idx]++;
    });
    return arr;
  }
  function render() {
    var es = LANG === 'es';
    var f = bins(st.k), w = 200 / st.k;
    var mx = Math.max.apply(null, f);
    var html =
      '<div class="iw-h">' + (es ? 'Constructor de tabla de frecuencias' : 'Frequency table builder') + '</div>' +
      '<div class="iw-sub">' + (es
        ? 'Los mismos ' + D.nT + ' tickets, agrupados de distintas formas. Cambia el número de clases y compara: pocas clases esconden el detalle, demasiadas lo vuelven ruido.'
        : 'The same ' + D.nT + ' tickets, grouped in different ways. Change the number of classes and compare: too few classes hide the detail, too many turn it into noise.') + '</div>' +
      '<div class="mtabs">';
    [4, 5, 8, 10].forEach(function(k) {
      html += '<button class="mtab' + (k === st.k ? ' active' : '') + '" data-k="' + k + '">' + k + (es ? ' clases' : ' classes') + '</button>';
    });
    html += '</div><div class="iw-bars">';
    f.forEach(function(c) {
      html += '<div class="iw-col"><div class="iw-cnt">' + c + '</div><div class="iw-bar" style="height:' + (mx ? Math.round(c / mx * 88) : 2) + '%"></div></div>';
    });
    html += '</div><div class="iw-axis">';
    f.forEach(function(c, i) {
      html += '<div class="iw-tick">' + Math.round(D.base + i * w) + '</div>';
    });
    html += '</div>' +
      '<div class="iw-note">' + (es
        ? 'Amplitud de clase: ' + Math.round(w) + ' pesos. Total de tickets: ' + D.nT + '. La suma de las frecuencias siempre reproduce el total, sin importar cuántas clases uses.'
        : 'Class width: ' + Math.round(w) + ' pesos. Total tickets: ' + D.nT + '. The sum of the frequencies always reproduces the total, no matter how many classes you use.') + '</div>';
    el.innerHTML = html;
    el.querySelectorAll('button[data-k]').forEach(function(btn) {
      btn.addEventListener('click', function() {
        st.k = parseInt(btn.getAttribute('data-k'), 10);
        render();
      });
    });
  }
  render();
  document.getElementById('lessonBody').appendChild(el);
  WIDGETS.push({ el: el, relabel: render });
}

/* ================================================
   BUILD LESSON
   ================================================ */
function buildLesson(rng) {
  var body = document.getElementById('lessonBody');
  body.innerHTML = '';
  problems = []; SECTIONS = []; WIDGETS = [];
  var ri = function(a, b) { return a + Math.floor(rng() * (b - a + 1)); };
  var D = {};

  /* ── numbers: chain of coffee shops ── */
  D.N   = ri(150, 240);
  D.n   = ri(20, 40);
  D.mu  = ri(380, 520);
  D.sd  = ri(40, 70);
  D.wseed = 1 + Math.floor(rng() * 2000000000);
  D.pop = [];
  var i, j, s;
  for (i = 0; i < D.N; i++) {
    var z = (rng() + rng() + rng() - 1.5) * 2;
    D.pop.push(Math.max(60, Math.round(D.mu + z * D.sd)));
  }
  s = 0; for (i = 0; i < D.N; i++) s += D.pop[i];
  D.popMean = s / D.N;
  s = 0; for (i = 0; i < D.n; i++) s += D.pop[i];
  D.xbar = Math.round(s / D.n);
  D.est  = D.xbar * D.N;

  /* ── numbers: spare parts distributor (problem 2) ── */
  D.N2 = ri(120, 200);
  D.n2 = ri(25, 40);
  D.m2 = 100 * ri(42, 78);
  D.est2 = D.m2 * D.N2;

  /* ── numbers: satisfaction scale (section 2) ── */
  D.scale   = ri(5, 7);
  D.regions = ri(4, 7);
  D.rows    = 1000 * ri(8, 24);

  /* ── numbers: ticket amounts (section 3) ── */
  D.base  = 100 + 20 * ri(0, 3);
  D.w     = 40;
  D.f     = [ri(6, 10), ri(11, 16), ri(14, 20), ri(9, 14), ri(5, 9)];
  D.nT    = D.f[0] + D.f[1] + D.f[2] + D.f[3] + D.f[4];
  D.raw   = [];
  for (i = 0; i < 5; i++) {
    for (j = 0; j < D.f[i]; j++) D.raw.push(D.base + 40 * i + Math.floor(rng() * 40));
  }
  D.cut   = D.base + 120;
  D.lo    = function(k) { return D.base + 40 * k; };
  D.hi    = function(k) { return D.base + 40 * k + 39; };

  /* ── numbers: bank survey (problem 6) and finance (problem 10) ── */
  D.clients = 1000 * ri(9, 30);
  D.invAvg  = 100 * ri(38, 96);

  function clsL(k, l) { return D.lo(k) + (l === 'en' ? ' to ' : ' a ') + D.hi(k); }
  function cls(k) { return clsL(k, LANG === 'en' ? 'en' : 'es'); }
  function ftable(hl) {
    var acc = 0, rows = '';
    for (var k = 0; k < 5; k++) {
      acc += D.f[k];
      rows += '<tr' + (k === hl ? ' class="hl"' : '') + '><td>' + cls(k) + '</td><td>' + D.f[k] + '</td><td>' +
        pc1(D.f[k] / D.nT * 100) + '</td><td>' + acc + '</td></tr>';
    }
    var h = LANG === 'es'
      ? ['Clase (pesos)', 'Frecuencia', 'Frecuencia relativa', 'Acumulada']
      : ['Class (pesos)', 'Frequency', 'Relative frequency', 'Cumulative'];
    return '<div class="ftwrap"><table class="ftab"><tr><th>' + h[0] + '</th><th>' + h[1] + '</th><th>' +
      h[2] + '</th><th>' + h[3] + '</th></tr>' + rows +
      '<tr><td><strong>' + (LANG === 'es' ? 'Total' : 'Total') + '</strong></td><td><strong>' + D.nT +
      '</strong></td><td><strong>100.0%</strong></td><td>&#8203;</td></tr></table></div>';
  }

  /* ════════ SECTION 1 ════════ */
  addSection({
    es: function() { return ''
      + '<div class="stag">Concepto 1</div>'
      + '<h2>Población, muestra, parámetro y estadístico</h2>'
      + '<p>La estadística es el conjunto de métodos para recolectar, organizar, describir e interpretar datos con el fin de tomar decisiones cuando existe incertidumbre. En una empresa casi nunca se observa todo: se observa una parte y con ella se decide.</p>'
      + '<p>La <strong>población</strong> es el conjunto completo de unidades sobre las que se quiere concluir. La <strong>muestra</strong> es el subconjunto que realmente se observa y se mide. Un valor calculado con toda la población es un <strong>parámetro</strong> (la media poblacional se escribe μ). El mismo valor calculado con la muestra es un <strong>estadístico</strong> (la media muestral se escribe x̄).</p>'
      + '<div class="rules-grid">'
        + '<div class="rcard"><div class="rname">Población</div><div class="rform">N = ' + D.N + '</div><div class="rnote">Todas las sucursales de la cadena.</div></div>'
        + '<div class="rcard"><div class="rname">Muestra</div><div class="rform">n = ' + D.n + '</div><div class="rnote">Sucursales auditadas este mes.</div></div>'
        + '<div class="rcard"><div class="rname">Parámetro</div><div class="rform">μ</div><div class="rnote">Valor fijo, casi siempre desconocido.</div></div>'
        + '<div class="rcard"><div class="rname">Estadístico</div><div class="rform">x̄</div><div class="rnote">Cambia con cada muestra que se toma.</div></div>'
      + '</div>'
      + '<div class="callout"><p><strong>Regla práctica.</strong> Si la cifra sale de un registro completo, por ejemplo todas las facturas del sistema contable, es un parámetro. Si sale de una encuesta o de una selección de unidades, es un estadístico y trae consigo un margen de error.</p></div>'
      + '<div class="gcrd"><div class="rname">Ejemplo resuelto</div>'
        + '<p>La cadena Café del Puerto opera ' + D.N + ' sucursales. La dirección necesita la venta mensual promedio por sucursal, pero auditar las ' + D.N + ' tomaría semanas. Se auditan ' + D.n + ' sucursales elegidas al azar y su venta promedio resulta de ' + D.xbar + ' miles de pesos.</p>'
        + '<p><strong>Paso 1.</strong> Población: las ' + D.N + ' sucursales de la cadena, porque sobre ellas se quiere concluir.</p>'
        + '<p><strong>Paso 2.</strong> Muestra: las ' + D.n + ' sucursales auditadas.</p>'
        + '<p><strong>Paso 3.</strong> La cifra de ' + D.xbar + ' miles es un estadístico (x̄), no un parámetro: proviene de la muestra.</p>'
        + '<p><strong>Paso 4.</strong> Para estimar la venta mensual de toda la cadena, la venta promedio por sucursal se lleva a las ' + D.N + ' sucursales y se obtiene ' + money(D.est) + ' miles de pesos.</p>'
        + '<p><strong>Paso 5.</strong> Esa cifra es una estimación, no un dato exacto: otra muestra de ' + D.n + ' sucursales daría un promedio algo distinto y por lo tanto otro total estimado.</p>'
      + '</div>'; },
    en: function() { return ''
      + '<div class="stag">Concept 1</div>'
      + '<h2>Population, sample, parameter and statistic</h2>'
      + '<p>Statistics is the set of methods used to collect, organize, describe and interpret data in order to make decisions under uncertainty. A company almost never observes everything: it observes a part and decides with it.</p>'
      + '<p>The <strong>population</strong> is the complete set of units you want to draw conclusions about. The <strong>sample</strong> is the subset that is actually observed and measured. A value computed from the whole population is a <strong>parameter</strong> (the population mean is written μ). The same value computed from the sample is a <strong>statistic</strong> (the sample mean is written x̄).</p>'
      + '<div class="rules-grid">'
        + '<div class="rcard"><div class="rname">Population</div><div class="rform">N = ' + D.N + '</div><div class="rnote">Every branch of the chain.</div></div>'
        + '<div class="rcard"><div class="rname">Sample</div><div class="rform">n = ' + D.n + '</div><div class="rnote">Branches audited this month.</div></div>'
        + '<div class="rcard"><div class="rname">Parameter</div><div class="rform">μ</div><div class="rnote">Fixed value, almost always unknown.</div></div>'
        + '<div class="rcard"><div class="rname">Statistic</div><div class="rform">x̄</div><div class="rnote">Changes with every sample drawn.</div></div>'
      + '</div>'
      + '<div class="callout"><p><strong>Working rule.</strong> If the figure comes from a complete record, for example every invoice in the accounting system, it is a parameter. If it comes from a survey or from a selection of units, it is a statistic and it carries a margin of error.</p></div>'
      + '<div class="gcrd"><div class="rname">Worked example</div>'
        + '<p>The Café del Puerto chain runs ' + D.N + ' branches. Management needs the average monthly sales per branch, but auditing all ' + D.N + ' would take weeks. They audit ' + D.n + ' randomly chosen branches and their average sales figure is ' + D.xbar + ' thousand pesos.</p>'
        + '<p><strong>Step 1.</strong> Population: the ' + D.N + ' branches of the chain, because that is what management wants to conclude about.</p>'
        + '<p><strong>Step 2.</strong> Sample: the ' + D.n + ' audited branches.</p>'
        + '<p><strong>Step 3.</strong> The figure of ' + D.xbar + ' thousand is a statistic (x̄), not a parameter: it comes from the sample.</p>'
        + '<p><strong>Step 4.</strong> To estimate monthly sales for the whole chain, the average sales per branch is carried over to the ' + D.N + ' branches, which gives ' + money(D.est) + ' thousand pesos.</p>'
        + '<p><strong>Step 5.</strong> That figure is an estimate, not an exact value: another sample of ' + D.n + ' branches would give a slightly different average and therefore a different estimated total.</p>'
      + '</div>'; }
  });

  widgetSampling(D);

  /* ── PROBLEM 1 ── */
  var o1 = shufPair(
    ['Las ' + D.N + ' sucursales de la cadena',
     'Las ' + D.n + ' sucursales auditadas',
     'La venta promedio obtenida en la auditoría',
     'Los clientes que compraron durante el mes'],
    ['The ' + D.N + ' branches of the chain',
     'The ' + D.n + ' audited branches',
     'The average sales figure obtained in the audit',
     'The customers who bought during the month'],
    0, rng);
  problems.push({
    i18n: {
      es: { title: 'Identificar la población',
            q: 'En el estudio de Café del Puerto que acabas de leer, la dirección quiere una conclusión válida para toda la cadena. ¿Cuál de los siguientes conjuntos es la población del estudio?',
            options: o1.es,
            hint: 'Pregúntate sobre qué conjunto se quiere concluir, no cuál fue observado.',
            exp: 'La población es el conjunto completo de unidades sobre las que se desea concluir: las ' + D.N + ' sucursales. Las ' + D.n + ' auditadas son la muestra, y su venta promedio es un estadístico, no un conjunto de unidades.' },
      en: { title: 'Identify the population',
            q: 'In the Café del Puerto study you just read, management wants a conclusion that is valid for the whole chain. Which of the following sets is the population of the study?',
            options: o1.en,

            exp: 'The population is the complete set of units you want to conclude about: the ' + D.N + ' branches. The ' + D.n + ' audited ones are the sample, and their average sales figure is a statistic, not a set of units.' }
    },
    correctIdx: o1.correctIdx, fn: '', showWork: false,
    title: '', questionText: '', options: [], explanation: '', hint: '',
    studentChoice: null, pendingChoice: null
  });
  emitProblem();

  /* ── PROBLEM 2 ── */

  var o7 = shufPair(p7o, p7o, 0, rng);
  problems.push({
    i18n: {
      es: { title: 'Alcance de un programa de lealtad',
            q: 'La cafetería quiere lanzar un programa de lealtad solo para los tickets de mayor importe, es decir los de las dos clases más altas de la tabla. Las frecuencias por clase fueron ' + D.f[0] + ', ' + D.f[1] + ', ' + D.f[2] + ', ' + D.f[3] + ', ' + D.f[4] + ' tickets. ¿Qué porcentaje de los tickets del día alcanzaría el programa?',
            options: o7.es,
            hint: 'Suma las dos clases más altas y compáralas contra el total de tickets del día.',
            exp: 'Las dos clases más altas reúnen ' + D.f[3] + ' y ' + D.f[4] + ' tickets, es decir ' + (D.f[3] + D.f[4]) + ' de los ' + D.nT + ' del día, lo que representa ' + p7c + '. Tomar solo la última clase subestima el alcance y dividir entre los tickets restantes lo sobreestima.' },
      en: { title: 'Reach of a loyalty program',
            q: 'The coffee shop wants to launch a loyalty program only for the largest tickets, that is the two highest classes of the table. The class frequencies were ' + D.f[0] + ', ' + D.f[1] + ', ' + D.f[2] + ', ' + D.f[3] + ', ' + D.f[4] + ' tickets. What percentage of the tickets of the day would the program reach?',
            options: o7.en,
            hint: 'Add the two highest classes and compare them against the total tickets of the day.',
            exp: 'The two highest classes hold ' + D.f[3] + ' and ' + D.f[4] + ' tickets, that is ' + (D.f[3] + D.f[4]) + ' out of the ' + D.nT + ' of the day, which represents ' + p7c + '. Taking only the last class underestimates the reach and dividing by the remaining tickets overestimates it.' }
    },
    correctIdx: o7.correctIdx, fn: '', showWork: true,
    title: '', questionText: '', options: [], explanation: '', hint: '',
    studentChoice: null, pendingChoice: null
  });
  emitProblem();

  /* ── PROBLEM 8 ── */
  var o8 = shufPair(
    ['Con base en las sucursales auditadas, se estima que la venta promedio de toda la cadena ronda cierto valor',
     'El importe total facturado en el trimestre fue de ' + money(D.est) + ' miles de pesos',
     'La sucursal con mayor venta del año fue la del puerto',
     'El ' + pc1(D.f[2] / D.nT * 100) + ' de los tickets de ayer cayó en la clase intermedia'],
    ['Based on the audited branches, average sales for the whole chain are estimated to be around a certain value',
     'Total billing for the quarter was ' + money(D.est) + ' thousand pesos',
     'The branch with the highest sales this year was the one at the port',
     pc1(D.f[2] / D.nT * 100) + ' of yesterday tickets fell in the middle class'],
    0, rng);
  problems.push({
    i18n: {
      es: { title: 'Descriptiva o inferencial',
            q: 'El comité directivo revisa cuatro frases de un reporte y pide separar lo que solo describe los datos observados de lo que concluye sobre unidades no medidas. ¿Cuál de las siguientes frases es inferencial?',
            options: o8.es,
            hint: 'Busca la frase que afirma algo sobre unidades que nunca fueron medidas.',
            exp: 'Solo la primera frase va más allá de lo observado: parte de las sucursales auditadas para afirmar algo sobre toda la cadena, que es exactamente lo que hace la inferencia. Las otras tres resumen datos ya registrados, así que son descriptivas.' },
      en: { title: 'Descriptive or inferential',
            q: 'The board reviews four sentences from a report and asks to separate what merely describes the observed data from what concludes about units that were not measured. Which of the following sentences is inferential?',
            options: o8.en,
            hint: 'Look for the sentence that claims something about units that were never measured.',
            exp: 'Only the first sentence goes beyond what was observed: it starts from the audited branches to claim something about the whole chain, which is exactly what inference does. The other three summarize data already recorded, so they are descriptive.' }
    },
    correctIdx: o8.correctIdx, fn: '', showWork: false,
    title: '', questionText: '', options: [], explanation: '', hint: '',
    studentChoice: null, pendingChoice: null
  });
  emitProblem();

  /* ── PROBLEM 9 ── */
  var p9c = D.nT - D.f[0];
  var p9o = opts4(String(p9c), [
    String(D.nT - D.f[0] - D.f[1]),
    String(D.f[1] + D.f[2]),
    String(D.nT)
  ], function(k) { return String(p9c - k); });
  var o9 = shufPair(p9o, p9o, 0, rng);
  problems.push({
    i18n: {
      es: { title: 'Clientes por encima de un umbral',
            q: 'El proveedor de la terminal de pago cobra comisión fija solo a los tickets desde ' + D.lo(1) + ' pesos en adelante. Con las frecuencias por clase del día (' + D.f[0] + ', ' + D.f[1] + ', ' + D.f[2] + ', ' + D.f[3] + ', ' + D.f[4] + '), la cafetería necesita saber a cuántos tickets se les aplicaría esa comisión.',
            options: o9.es,
            hint: 'Solo la primera clase queda por debajo del umbral; todo lo demás entra.',
            exp: 'Los tickets desde ' + D.lo(1) + ' pesos son todos menos los de la primera clase. Del total de ' + D.nT + ' tickets se descuentan los ' + D.f[0] + ' de la clase más baja, lo que deja ' + D.nT + ' menos ' + D.f[0] + ' = ' + p9c + ' tickets.' },
      en: { title: 'Customers above a threshold',
            q: 'The payment terminal provider charges a flat fee only on tickets from ' + D.lo(1) + ' pesos upward. With the class frequencies of the day (' + D.f[0] + ', ' + D.f[1] + ', ' + D.f[2] + ', ' + D.f[3] + ', ' + D.f[4] + '), the coffee shop needs to know how many tickets that fee would apply to.',
            options: o9.en,
            hint: 'Only the first class stays below the threshold; everything else is included.',
            exp: 'Tickets from ' + D.lo(1) + ' pesos upward are all of them except the first class. From the total of ' + D.nT + ' tickets we remove the ' + D.f[0] + ' of the lowest class, which leaves ' + D.nT + ' minus ' + D.f[0] + ' = ' + p9c + ' tickets.' }
    },
    correctIdx: o9.correctIdx, fn: '', showWork: true,
    title: '', questionText: '', options: [], explanation: '', hint: '',
    studentChoice: null, pendingChoice: null
  });
  emitProblem();

  /* ── PROBLEM 10 ── */
  var o10 = shufPair(
    ['Es un parámetro, porque se calculó con la población completa de facturas del año',
     'Es un estadístico, porque proviene de una consulta al sistema contable',
     'Es un estadístico, porque todo promedio es por definición un estadístico',
     'Es un parámetro solo si la empresa emitió más de mil facturas en el año'],
    ['It is a parameter, because it was computed from the complete population of invoices of the year',
     'It is a statistic, because it comes from a query to the accounting system',
     'It is a statistic, because every average is by definition a statistic',
     'It is a parameter only if the company issued more than one thousand invoices in the year'],
    0, rng);
  problems.push({
    i18n: {
      es: { title: 'Parámetro o estadístico',
            q: 'El área de finanzas procesó todas las facturas emitidas durante el año y reportó un monto promedio de ' + money(D.invAvg) + ' por factura. Un analista pregunta cómo debe clasificarse esa cifra en el informe.',
            options: o10.es,
            hint: 'Lo que decide la clasificación es si el cálculo abarcó toda la población o solo una parte.',
            exp: 'La cifra se calculó con todas las facturas del año, es decir con la población completa, así que es un parámetro. Sería un estadístico solo si se hubiera calculado con una muestra de facturas; el origen del dato o el volumen de facturas no cambian esa clasificación.' },
      en: { title: 'Parameter or statistic',
            q: 'The finance department processed every invoice issued during the year and reported an average amount of ' + money(D.invAvg) + ' per invoice. An analyst asks how that figure should be classified in the report.',
            options: o10.en,
            hint: 'What decides the classification is whether the computation covered the whole population or only a part of it.',
            exp: 'The figure was computed from every invoice of the year, that is from the complete population, so it is a parameter. It would be a statistic only if it had been computed from a sample of invoices; the source of the data or the number of invoices does not change that classification.' }
    },
    correctIdx: o10.correctIdx, fn: '', showWork: false,
    title: '', questionText: '', options: [], explanation: '', hint: '',
    studentChoice: null, pendingChoice: null
  });
  emitProblem();

  applyUIStrings();
}

/* ================================================
   PDF
   ================================================ */
async function generatePDF() {
  var btn = document.getElementById('dlBtn');
  btn.textContent = t('pdf-making');
  btn.disabled = true;

  var jspdf   = window.jspdf;
  var doc     = new jspdf.jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });
  var PW      = 215.9;
  var M       = 18;
  var TW      = PW - M * 2;
  var PH      = doc.internal.pageSize.height;
  var name    = studentData.name;
  var group   = studentData.group;
  var total   = problems.length;
  var pct     = Math.round(correctCount / total * 100);
  var dateStr = new Date().toLocaleString(LANG === 'es' ? 'es-MX' : 'en-US', { dateStyle:'long', timeStyle:'short' });

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;

  function pdfText(html) {
    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/→/g,'->').replace(/−/g,'-').replace(/²/g,'^2')
      .replace(/³/g,'^3').replace(/×/g,'x').replace(/÷/g,'/')
      .replace(/≠/g,'!=').replace(/≤/g,'<=').replace(/≥/g,'>=')
      .replace(/√/g,'sqrt').replace(/π/g,'pi').replace(/…/g,'...')
      .replace(/\s+/g,' ').trim();
  }

  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,2,'F');
  doc.setFillColor(255,255,255); doc.rect(0,2,PW,26,'F');
  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,28,PW,2,'F');
  doc.setFillColor(pBR,pBG,pBB); doc.rect(0,30,PW,34,'F');

  var logoLeftB64  = SCHOOL.logoLeftB64;
  var logoRightB64 = SCHOOL.logoRightB64;
  try { doc.addImage(logoLeftB64,  logoLeftB64.indexOf('/9j/')  > -1 ? 'JPEG' : 'PNG', M,  5, 20, 20); } catch(e) {}
  try { doc.addImage(logoRightB64, logoRightB64.indexOf('/9j/') > -1 ? 'JPEG' : 'PNG', 62, 6, 40, 17.7); } catch(e) {}

  var lx = PW - M - 36;
  var ly = 10;
  doc.setDrawColor(pBR,pBG,pBB); doc.setLineWidth(0.7);
  doc.lines([[2.57-1.03,4.63-6.17],[4.11-2.57,5.14-4.63],[5.66-4.11,2.57-5.14]], lx+1.03, ly+6.17);
  doc.setFillColor(pAR,pAG,pAB); doc.circle(lx+5.66, ly+2.57, 0.9, 'F');
  doc.setDrawColor(pAR,pAG,pAB); doc.setLineWidth(0.7);
  doc.line(lx+8.23, ly+1.54, lx+8.23, ly+7.2);
  doc.setTextColor(pBR,pBG,pBB); doc.setFontSize(11); doc.setFont('helvetica','bold');
  doc.text('LIAXA', lx+10, ly+6.8);

  doc.setTextColor(240,245,238); doc.setFontSize(17); doc.setFont('helvetica','bold');
  doc.text(pdfText(SCHOOL.guideTitle[LANG]), M, 49);
  doc.setTextColor(200,215,195); doc.setFontSize(8); doc.setFont('helvetica','normal');
  doc.text(dateStr, M, 59);

  doc.setFillColor(237,240,235); doc.roundedRect(M,72,TW,20,3,3,'F');
  doc.setTextColor(130,140,130); doc.setFontSize(8.5); doc.setFont('helvetica','bold');
  doc.text(t('pdf-student'), M+4, 79); doc.text(t('pdf-group'), 130, 79);
  doc.setTextColor(20,24,20); doc.setFontSize(11); doc.setFont('helvetica','bold');
  doc.text(name, M+4, 87); doc.text(group, 130, 87);

  var sc = pct>=70?[26,106,74]:pct>=50?[224,123,26]:[176,48,16];
  doc.setFillColor(255,255,255); doc.roundedRect(M,100,TW,34,4,4,'F');
  doc.setDrawColor(sc[0],sc[1],sc[2]); doc.setLineWidth(0.8);
  doc.roundedRect(M,100,TW,34,4,4,'S');
  doc.setTextColor(sc[0],sc[1],sc[2]); doc.setFontSize(40); doc.setFont('helvetica','bold');
  doc.text(pct+'%', PW/2, 124, {align:'center'});
  doc.setTextColor(130,140,130); doc.setFontSize(8.5); doc.setFont('helvetica','normal');
  doc.text(correctCount+' '+t('pdf-score')+' '+total+' '+t('pdf-items'), PW/2, 131, {align:'center'});

  doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
  doc.setFontSize(7); doc.setFont('helvetica','bold');
  doc.rect(M,142,TW,8,'F'); doc.text(t('pdf-summary'), M+4, 148);
  var sy = 154;
  problems.forEach(function(prob, i) {
    if (sy + 12 > PH - 15) {
      doc.addPage(); sy = 20;
      doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
      doc.setFontSize(7); doc.setFont('helvetica','bold');
      doc.rect(M,sy,TW,8,'F'); doc.text(t('pdf-cont'), M+4, sy+6);
      sy += 12;
    }
    var ok = document.getElementById('pc'+i).classList.contains('ok');
    doc.setFillColor(ok?232:255, ok?240:232, ok?232:228);
    doc.roundedRect(M,sy,TW,10,2,2,'F');
    doc.setFillColor(ok?26:176, ok?106:48, ok?74:16);
    doc.circle(M+6, sy+5, 2.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(7); doc.setFont('helvetica','bold');
    doc.text(ok?'OK':'X', M+4.5, sy+6.5);
    doc.setTextColor(20,24,20); doc.setFontSize(8); doc.setFont('helvetica','normal');
    doc.text(t('pdf-prob')+' '+(i+1)+': '+pdfText(prob.title), M+12, sy+6.5);
    doc.setTextColor(ok?26:176, ok?106:48, ok?74:16);
    doc.text(ok?t('pdf-right'):t('pdf-wrong'), PW-M-24, sy+6.5);
    sy += 12;
  });

  for (var i = 0; i < problems.length; i++) {
    var prob = problems[i];
    doc.addPage();
    var wy = 0;

    doc.setFillColor(pBR,pBG,pBB); doc.rect(0,0,PW,20,'F');
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,3,'F');
    doc.setTextColor(pAR,pAG,pAB); doc.setFontSize(7); doc.setFont('helvetica','normal');
    doc.text(pdfText(SCHOOL.courseName[LANG]) + '  ·  ' + pdfText(SCHOOL.guideTitle[LANG]), M, 10);
    doc.setTextColor(240,245,238); doc.setFontSize(10.5); doc.setFont('helvetica','bold');
    doc.text(t('pdf-prob')+' '+(i+1)+' '+t('pdf-of')+' '+total+'  ·  '+pdfText(prob.title), M, 17);
    wy = 25;

    var qRaw = pdfText(prob.questionText);
    doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var qLines = doc.splitTextToSize(qRaw, TW-10);
    var qBoxH  = 8 + qLines.length*5 + 3;
    doc.setFillColor(237,240,235); doc.roundedRect(M,wy,TW,qBoxH,2,2,'F');
    doc.setTextColor(pBR,pBG,pBB); doc.setFontSize(6.5); doc.setFont('helvetica','bold');
    doc.text(t('pdf-question'), M+4, wy+6);
    doc.setTextColor(20,24,20); doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var qy = wy+12;
    qLines.forEach(function(ln,li){ doc.text(ln, M+4, qy+li*5); });
    wy += qBoxH + 4;

    var isOk   = document.getElementById('pc'+i).classList.contains('ok');
    var chosen = prob.studentChoice != null ? pdfText(prob.options[prob.studentChoice]||'') : '';
    var corr   = pdfText(prob.options[prob.correctIdx]||'');
    var expRaw = pdfText(prob.explanation||'');
    doc.setFontSize(8.5); var chLines = doc.splitTextToSize(t('pdf-you')+' '+chosen, TW-18);
    doc.setFontSize(8);   var coLines = doc.splitTextToSize(t('pdf-ok')+' '+corr, TW-18);
    doc.setFontSize(7.5); var exLines = doc.splitTextToSize(t('pdf-sol')+' '+expRaw, TW-18).slice(0,5);
    var ansBoxH = 8 + chLines.length*5.5 + coLines.length*5 + exLines.length*5 + 6;
    doc.setFillColor(isOk?232:255, isOk?240:232, isOk?232:228);
    doc.roundedRect(M,wy,TW,ansBoxH,2,2,'F');
    doc.setFillColor(isOk?26:176, isOk?106:48, isOk?74:16);
    doc.circle(M+7, wy+8, 3.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(9); doc.setFont('helvetica','bold');
    doc.text(isOk?'OK':'X', M+5.2, wy+10.5);
    var ay = wy+7;
    doc.setTextColor(20,24,20); doc.setFontSize(8.5); doc.setFont('helvetica','bold');
    chLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5.5); });
    ay += chLines.length*5.5 + 3;
    doc.setTextColor(26,106,74); doc.setFontSize(8); doc.setFont('helvetica','normal');
    coLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    ay += coLines.length*5 + 3;
    doc.setTextColor(90,88,80); doc.setFontSize(7.5);
    exLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    wy += ansBoxH + 5;

    if (prob.showWork) {
      doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
      doc.setFontSize(7); doc.setFont('helvetica','bold');
      doc.rect(M,wy,TW,8,'F'); doc.text(t('pdf-work'), M+4, wy+5.5);
      wy += 11;

      var dc = document.getElementById('dc'+i);
      if (dc) {
        try {
          var imgD = dc.toDataURL('image/png');
          var ar   = dc.height / dc.width;
          var iw   = TW;
          var ih   = Math.min(iw * ar, 68);
          doc.addImage(imgD, 'PNG', M, wy, iw, ih);
          wy += ih + 4;
        } catch(e) {}
      }

      var ta = document.getElementById('ta'+i);
      if (ta && ta.value.trim()) {
        if (wy > PH-30) { doc.addPage(); wy = 20; }
        doc.setTextColor(20,24,20); doc.setFontSize(8); doc.setFont('courier','normal');
        var taLines = doc.splitTextToSize(ta.value, TW);
        taLines.slice(0,16).forEach(function(ln) {
          if (wy > PH-15) { doc.addPage(); wy = 20; }
          doc.text(ln, M, wy); wy += 5;
        });
        wy += 2;
      }

      var pp = document.getElementById('pp'+i);
      if (pp && pp.src && pp.src.indexOf('data:') === 0) {
        if (wy > PH-55) { doc.addPage(); wy = 20; }
        try { doc.addImage(pp.src, 'JPEG', M, wy, TW, 68); wy += 72; } catch(e) {}
      }
    }
  }

  var pages = doc.internal.getNumberOfPages();
  for (var p = 1; p <= pages; p++) {
    doc.setPage(p);
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0, PH-3, PW, 3, 'F');
    doc.setTextColor(130,140,130); doc.setFontSize(6.5); doc.setFont('helvetica','normal');
    doc.text(name+'  ·  '+group+'  ·  '+t('pdf-code')+': '+code+'  ·  '+t('pdf-page')+' '+p+'/'+pages,
      PW/2, PH-5, {align:'center'});
  }

  doc.save(SCHOOL.filePrefix + '_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf');
  btn.textContent = t('btn-pdf');
  btn.disabled  = false;
}

/* ================================================
   LOGO INJECTION + INITIAL UI STRINGS

document.addEventListener('DOMContentLoaded', function() {
  var wl = document.getElementById('wlogo-left');
  if (wl && SCHOOL.logoLeftB64)  { wl.src = SCHOOL.logoLeftB64;  wl.style.display = 'block'; }
  var wr = document.getElementById('wlogo-right');
  var sep = document.getElementById('wlogsep');
  if (wr && SCHOOL.logoRightB64) { wr.src = SCHOOL.logoRightB64; wr.style.display = 'block'; }
  else { if (wr) wr.style.display = 'none'; if (sep) sep.style.display = 'none'; }
  var hl = document.getElementById('hlogo-left');
  if (hl && SCHOOL.logoLeftB64)  { hl.src = SCHOOL.logoLeftB64;  hl.style.display = 'block'; }
  var hr = document.getElementById('hlogo-right');
  if (hr && SCHOOL.logoRightB64) { hr.src = SCHOOL.logoRightB64; hr.style.display = 'block'; }
  var be = document.getElementById('btn-es'), bn = document.getElementById('btn-en');
  if (be) be.classList.toggle('active', LANG === 'es');
  if (bn) bn.classList.toggle('active', LANG === 'en');
  document.documentElement.setAttribute('lang', LANG);
  applyUIStrings();
});
