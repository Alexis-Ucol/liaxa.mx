<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Probabilidad Condicional</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Probabilidad Condicional</div>
    <div class="wcourse" id="wcourse-el">Pensamiento Matemático I · Sem 1</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Probabilidad Condicional</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="sbtn" id="dlBtn" onclick="generatePDF()" style="max-width:280px;margin:0 auto;">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   CENTRALIZED SCHOOL CONFIG (Rule 16) — ships UNBRANDED (Rule 11).
   The ONLY rebranding point. build_all.py substitutes these exact fields
   (BRAND_FIELDS / RGB_FIELDS / logo*) downstream; :root/dark stay as fallback.
   Neutral defaults below == the static :root/dark values, so unbranded == no-op.
   ══════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:'#24246c', primaryDark:'#14143f', primaryBg:'#e9e9f4',
  accent:'#e42424', accentBg:'#fbdfdf',
  darkPrimary:'#5555b4', darkPrimaryDark:'#8383d7', darkPrimaryBg:'#121234',

function getAttemptKey(name, group){ return 'liaxa_pm1_t04_g01__att__' + (name+'__'+group).replace(/\s+/g,'_'); }
function nextAttempt(name, group){ var k=getAttemptKey(name,group),n=0; try{n=parseInt(localStorage.getItem(k)||'0',10)||0;}catch(e){} n++; try{localStorage.setItem(k,String(n));}catch(e){} return n; }

var studentData   = {};

function lsKey() {
  var n = (studentData.name  || '').trim();
  var g = (studentData.group || '').trim();
  return 'liaxa_pm1_t04_g01__' + (n + '__' + g).replace(/\s+/g, '_');
}

function saveSession() {
  if (!studentData.name) return;
  var drawings = [], texts = [], photos = [];
  problems.forEach(function(p, i) {
    var dc = document.getElementById('dc' + i);
    if (dc && dc.width) {
      var blank = document.createElement('canvas');
      blank.width = dc.width; blank.height = dc.height;
      drawings.push(dc.toDataURL() === blank.toDataURL() ? null : dc.toDataURL('image/png'));
    } else { drawings.push(null); }
    var ta = document.getElementById('ta' + i);
    texts.push(ta ? ta.value : '');
    var pp = document.getElementById('pp' + i);
    photos.push((pp && pp.src && pp.src.indexOf('data:') === 0) ? pp.src : null);
  });
  var state = {
    name: studentData.name, group: studentData.group,
    answeredCount: answeredCount, correctCount: correctCount,
    choices: problems.map(function(p) { return p.studentChoice; }),
    drawings: drawings, texts: texts, photos: photos
  };
  try { localStorage.setItem(lsKey(), JSON.stringify(state)); } catch(e) {}
}

function loadSession(name, group) {
  var key = 'liaxa_pm1_t04_g01__' + (name + '__' + group).replace(/\s+/g, '_');
  try { var r = localStorage.getItem(key); return r ? JSON.parse(r) : null; } catch(e) { return null; }
}

function restoreSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  var saved = loadSession(name, group);
  if (!saved) return;
  document.getElementById('restoreBar').style.display = 'none';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = currentAttempt(name, group);
  buildLesson(seededRng(name + group + att));
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
  saved.choices.forEach(function(choice, idx) {
    if (choice !== null && choice !== undefined) confirmMC(idx, choice);
  });
  setTimeout(function() {
    if (saved.drawings) {
      saved.drawings.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var dc = document.getElementById('dc' + i);
        if (!dc || !dc.width) return;
        var img = new Image();
        img.onload = function() {
          var dpr = window.devicePixelRatio || 1;
          dc.getContext('2d').drawImage(img, 0, 0, dc.width / dpr, dc.height / dpr);
        };
        img.src = dataUrl;
      });
    }
    if (saved.texts) {
      saved.texts.forEach(function(text, i) {
        if (!text) return;
        var ta = document.getElementById('ta' + i);
        if (ta) ta.value = text;
      });
    }
    if (saved.photos) {
      saved.photos.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var pp = document.getElementById('pp' + i);
        if (!pp) return;
        pp.src = dataUrl; pp.style.display = 'block';
        var pz = document.getElementById('pz' + i);
        if (pz) pz.style.opacity = '0.4';
      });
    }
  }, 300);
}

function dismissRestore() {

  var name  = document.getElementById('sName').value.trim();

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

async function generatePDF() {
  var btn = document.getElementById('dlBtn');

  var jspdf   = window.jspdf;
  var doc     = new jspdf.jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });
  var PW      = 215.9;
  var M       = 18;
  var TW      = PW - M * 2;
  var PH      = doc.internal.pageSize.height;
  var name    = studentData.name;
  var group   = studentData.group;
  var total   = problems.length;
  var pct     = Math.round(correctCount / total * 100);
  var dateStr = new Date().toLocaleString('es-MX', { dateStyle:'long', timeStyle:'short' });

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS — INJECTION BLOCK ─────────────────────────────────────────
  //   Match these RGB values to --green and --gold above.
  //   PRIMARY  → pBR, pBG, pBB
  //   ACCENT   → pAR, pAG, pAB
  // ──────────────────────────────────────────────────────────────────────────
  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;  // PRIMARY (from SCHOOL, Rule 16)
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;   // ACCENT (from SCHOOL, Rule 16)

  function pdfText(html) {
    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/\u2192/g,'->').replace(/\u2212/g,'-').replace(/\u00b2/g,'^2')
      .replace(/\u00b3/g,'^3').replace(/\u00d7/g,'x').replace(/\u00f7/g,'/')
      .replace(/\u2260/g,'!=').replace(/\u2264/g,'<=').replace(/\u2265/g,'>=')
      .replace(/\u221a/g,'sqrt').replace(/\u03c0/g,'pi').replace(/\u2026/g,'...')
      .replace(/\s+/g,' ').trim();
  }

  // ── PORTADA: orange line / white logo strip / orange line / blue band ──

  doc.setFillColor(255,255,255); doc.rect(0,2,PW,26,'F');                               // white logo strip
  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,28,PW,2,'F');  // bottom accent line
  doc.setFillColor(pBR,pBG,pBB); doc.rect(0,30,PW,34,'F');       // blue header band

  // ── PDF LOGO INJECTION BLOCK ─────────────────────────────────────────────

  //     var logoLeftB64  = 'data:image/png;base64,...';   // from LOGOS_MASTER.HTML

  doc.lines([[2.57-1.03,4.63-6.17],[4.11-2.57,5.14-4.63],[5.66-4.11,2.57-5.14]], lx+1.03, ly+6.17);

    exLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    wy += ansBoxH + 5;

    doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
    doc.setFontSize(7); doc.setFont('helvetica','bold');
    doc.rect(M,wy,TW,8,'F'); doc.text('TRABAJO DEL ALUMNO', M+4, wy+5.5);
    wy += 11;

    var dc = document.getElementById('dc'+i);
    if (dc) {
      try {
        var imgD = dc.toDataURL('image/png');
        var ar   = dc.height / dc.width;
        var iw   = TW;
        var ih   = Math.min(iw * ar, 68);
        doc.addImage(imgD, 'PNG', M, wy, iw, ih);
        wy += ih + 4;
      } catch(e) {}
    }

    var ta = document.getElementById('ta'+i);
    if (ta && ta.value.trim()) {
      if (wy > PH-30) { doc.addPage(); wy = 20; }
      doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('courier','normal');
      var taLines = doc.splitTextToSize(ta.value, TW);
      taLines.slice(0,16).forEach(function(ln) {
        if (wy > PH-15) { doc.addPage(); wy = 20; }
        doc.text(ln, M, wy); wy += 5;
      });
      wy += 2;
    }

    var pp = document.getElementById('pp'+i);
    if (pp && pp.src && pp.src.indexOf('data:') === 0) {
      if (wy > PH-55) { doc.addPage(); wy = 20; }
      try { doc.addImage(pp.src, 'JPEG', M, wy, TW, 68); wy += 72; } catch(e) {}
    }
  }

  // ── Footer on every page ──
  var pages = doc.internal.getNumberOfPages();
  for (var p = 1; p <= pages; p++) {
    doc.setPage(p);
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0, PH-3, PW, 3, 'F');
    doc.setTextColor(130,140,160); doc.setFontSize(6.5); doc.setFont('helvetica','normal');
    doc.text(name+'  ·  '+group+'  ·  Código: '+code+'  ·  Página '+p+'/'+pages,
      PW/2, PH-5, {align:'center'});
  }

  doc.save('pm1_t04_g01_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf');
  btn.innerHTML = '⬇ &nbsp;Descargar Resultados PDF';
  btn.disabled  = false;
}

  /* ============================================================
     HELPERS
     ============================================================ */
  function T(o){
    if (o === undefined || o === null) return '';
    if (typeof o === 'string' || typeof o === 'number') return o;
    if (Object.prototype.toString.call(o) === '[object Array]') return o;
    return (o[LANG] !== undefined ? o[LANG] : o.es);
  }
  function ri(a,b){ return a + Math.floor(rng()*(b-a+1)); }
  function pk(a){ return a[Math.floor(rng()*a.length)]; }
  function shufA(arr){ var a=arr.slice(),i,j,t; for(i=a.length-1;i>0;i--){ j=Math.floor(rng()*(i+1)); t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
  function r2(x){ return Math.round(x*100)/100; }
  function fx(v,d){ return Number(v).toFixed(d); }
  function gcd(a,b){ a=Math.abs(a); b=Math.abs(b); while(b){ var t=a%b; a=b; b=t; } return a||1; }
  function mf(n,d){ return '<span class="mf-outer"><span class="mf-num">'+n+'</span><span class="mf-den">'+d+'</span></span>'; }
  function frH(n,d){ var g=gcd(n,d); n=n/g; d=d/g; return d===1 ? String(n) : mf(n,d); }
  function frK(n,d){ var g=gcd(n,d); return (n/g)+':'+(d/g); }
  function frOpts(cn,cd,cands){
    var keys=[frK(cn,cd)], out=[frH(cn,cd)], i, n, d, k;
    for(i=0;i<cands.length && out.length<4;i++){
      n=cands[i][0]; d=cands[i][1];
      if(!(d>0) || n<=0 || n>=d) continue;
      k=frK(n,d); if(keys.indexOf(k)<0){ keys.push(k); out.push(frH(n,d)); }
    }
    var extra=[[1,4],[1,3],[3,8],[2,5],[3,5],[1,5],[7,20],[9,20],[1,2],[5,12],[7,12],[2,9]];
    for(i=0;i<extra.length && out.length<4;i++){
      k=frK(extra[i][0],extra[i][1]);
      if(keys.indexOf(k)<0){ keys.push(k); out.push(frH(extra[i][0],extra[i][1])); }
    }
    return out;
  }
  function decOpts(corr, cands, d){
    var out=[fx(corr,d)], i, s, v;
    for(i=0;i<cands.length && out.length<4;i++){
      v=cands[i];
      if(v===null || v===undefined || !(v>0) || v>=1) continue;
      s=fx(v,d); if(out.indexOf(s)<0) out.push(s);
    }
    var k=1;
    while(out.length<4 && k<30){
      var alts=[corr+0.05*k, corr-0.05*k], j;
      for(j=0;j<2;j++){
        v=r2(alts[j]);
        if(v>0 && v<1){ s=fx(v,d); if(out.indexOf(s)<0) out.push(s); }
        if(out.length>=4) break;
      }
      k++;
    }
    return out;
  }
  function unitOpts(corr, cands, unit){
    var out=[String(corr)+unit], i, s, v;
    for(i=0;i<cands.length && out.length<4;i++){
      v=Math.round(cands[i]);
      if(!(v>0)) continue;
      s=String(v)+unit; if(out.indexOf(s)<0) out.push(s);
    }
    var k=1;
    while(out.length<4 && k<40){
      var alts=[corr+5*k, corr-5*k], j;
      for(j=0;j<2;j++){
        v=alts[j];
        if(v>0){ s=String(v)+unit; if(out.indexOf(s)<0) out.push(s); }
        if(out.length>=4) break;
      }
      k++;
    }
    return out;
  }
  function sec(tag, title, html){
    var d = document.createElement('div');

  }
  function widget(kind){

    d.className = kind + 'wrap section';
    d.setAttribute('data-widget', kind);
    d.id = 'w' + kind;
    LB.appendChild(d);
    return d;
  }
  function cssv(n){
    try { var v = getComputedStyle(document.documentElement).getPropertyValue(n); return v ? v.trim() : ''; }
    catch(e){ return ''; }
  }
  function fitCv(cv){
    var dpr = window.devicePixelRatio || 1;
    var w = cv.clientWidth || 320, h = cv.clientHeight || 215;
    cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr);
    var ctx = cv.getContext('2d');
    ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,w,h);
    return { ctx:ctx, w:w, h:h };
  }
  function addProb(spec){
    var optArr = T(spec.options);
    var cor = optArr[0];
    var so  = shufA(optArr);
    problems.push({
      title: T(spec.title),
      questionText: T(spec.q),
      fn: T(spec.fn) || '',
      hint: T(spec.hint),
      explanation: T(spec.exp),
      options: so,
      correctIdx: so.indexOf(cor),
      showWork: !!spec.showWork,
      studentChoice:null,
      pendingChoice:null
    });
    buildOneCard(problems[problems.length-1], problems.length-1);
  }

  /* ============================================================
     VALORES CON SEMILLA (extraidos una sola vez, en orden fijo)
     ============================================================ */
  var v1 = Math.floor(rng()*2), v2 = Math.floor(rng()*2), v3 = Math.floor(rng()*2);
  var v4 = Math.floor(rng()*2), v6 = Math.floor(rng()*2), v7 = Math.floor(rng()*2);
  var v8 = Math.floor(rng()*2), v9 = Math.floor(rng()*2), v10 = Math.floor(rng()*2);

  /* manipulativo 1: tres metas de probabilidad condicional */
  var w1T = shufA([[1,4],[1,2],[3,4],[2,5],[3,5]]).slice(0,3);

  /* manipulativo 2: tabla 2x3 y tres condiciones */
  var w2M = [[ri(10,22), ri(8,18), ri(11,20)], [ri(12,26), ri(9,19), ri(14,26)]];
  var w2C = shufA([{k:'row',i:0},{k:'row',i:1},{k:'col',i:0},{k:'col',i:2}]).slice(0,3);

  /* manipulativo 3: tres escenarios de independencia */
  var w3R = shufA([{b:40,m:18},{b:50,m:15},{b:25,m:21},{b:60,m:8}]).slice(0,3);

  /* manipulativo 4: tres urnas con meta */
  var w4R = shufA([{r:5,a:3,tn:1,td:2},{r:4,a:6,tn:2,td:3},{r:6,a:3,tn:1,td:3},{r:3,a:5,tn:1,td:2}]).slice(0,3);

  /* P1: dado equilibrado con informacion parcial */
  var p1m = pk([2,3]);
  var p1ev = [2,4,6];
  var p1gt = [1,2,3,4,5,6].filter(function(x){ return x > p1m; });
  var p1red = (v1===0) ? p1gt.length : p1ev.length;
  var p1fav = (v1===0)
    ? p1gt.filter(function(x){ return x%2===0; }).length
    : p1ev.filter(function(x){ return x > p1m; }).length;
  var p1all = (v1===0) ? 3 : p1gt.length;
  var p1Opts = frOpts(p1fav, p1red, [[p1fav,6],[p1red,6],[p1all,p1red]]);

  /* P2: definicion de probabilidad condicional con valores dados */
  var p2p = pk([[0.40,0.25],[0.60,0.75],[0.80,0.40],[0.45,0.40],[0.50,0.30]]);
  var p2B = p2p[0], p2q = p2p[1], p2J = r2(p2B*p2q);
  var p2Opts = (v2===0)
    ? decOpts(p2q, [p2J, p2B, r2(p2B-p2J)], 2)
    : decOpts(p2B, [p2J, r2(p2q-p2J), r2(1-p2q)], 2);

  /* P3: tabla de frecuencias en prosa */
  var p3 = pk([{a:12,c:28,b:18,d:42},{a:15,c:25,b:20,d:40},{a:18,c:12,b:22,d:48},{a:20,c:30,b:10,d:40}]);
  var p3N = p3.a+p3.b+p3.c+p3.d, p3B = p3.a+p3.c, p3A = p3.a+p3.b;
  var p3Opts = (v3===0)
    ? frOpts(p3.a, p3B, [[p3.a,p3N],[p3.a,p3A],[p3B,p3N]])
    : frOpts(p3.a, p3A, [[p3.a,p3N],[p3.a,p3B],[p3A,p3N]]);

  /* P5: decision de independencia */
  var p5 = pk([{a:0.30,b:0.50},{a:0.40,b:0.50},{a:0.25,b:0.60},{a:0.50,b:0.40}]);
  var p5mode = pk([0,1,2]);
  var p5prod = r2(p5.a*p5.b);
  var p5J = (p5mode===0) ? p5prod : (p5mode===1 ? r2(p5prod+0.06) : r2(p5prod-0.06));
  var p5cond = r2(p5J/p5.b);

  /* P6: independencia y producto */
  var p6p = pk([[0.40,0.65],[0.30,0.80],[0.25,0.60],[0.50,0.36]]);
  var p6A = p6p[0], p6B = p6p[1], p6J = r2(p6A*p6B);
  var p6Opts = (v6===0)
    ? decOpts(p6J, [r2(p6A+p6B-p6J), p6A, r2(p6B-p6A)], 2)
    : decOpts(p6B, [p6J, r2(p6A-p6J), r2(p6A+p6J)], 2);

  /* P7: extracciones sucesivas sin devolver la ficha */
  var p7r = pk([4,5,6]), p7a = pk([3,4,5]), p7n = p7r + p7a;
  var p7Opts = (v7===0)
    ? frOpts(p7r*(p7r-1), p7n*(p7n-1), [[p7r*p7r, p7n*p7n],[p7r-1, p7n-1],[p7r*p7r, p7n*(p7n-1)]])
    : frOpts(p7a, p7n-1, [[p7a,p7n],[p7a-1,p7n-1],[p7r,p7n-1]]);

  /* P9: regla del producto expresada en porcentajes */
  var p9p = pk([[60,25],[40,25],[50,30],[80,15],[60,35]]);
  var p9b = p9p[0], p9q = p9p[1], p9j = p9b*p9q/100;
  var p9Opts = (v9===0)
    ? unitOpts(p9j, [p9q, p9b, p9b-p9j], ' %')
    : unitOpts(p9q, [p9j, p9b, p9b-p9j], ' %');

  /* P10: valor que vuelve independientes a dos eventos */
  var p10 = pk([{N:200,nA:80,nB:50},{N:240,nA:60,nB:80},{N:300,nA:120,nB:75},{N:200,nA:90,nB:60}]);
  var p10c = p10.nA*p10.nB/p10.N;
  var p10u = T({es:' personas', en:' people'});
  var p10Opts = (v10===0)
    ? unitOpts(p10c, [2*p10c, p10.nA+p10.nB-p10.N/2, Math.round((p10.nA+p10.nB)/2)], p10u)
    : unitOpts(p10.nA, [p10.nB+p10c, 2*p10c, p10.N/2], p10u);

  /* ============================================================
     IDEA 1 - EL ESPACIO MUESTRAL SE REDUCE
     ============================================================ */
  sec(T({es:'Idea 1', en:'Idea 1'}),
      T({es:'Cuando llega información parcial', en:'When partial information arrives'}),
      '<p>'+T({
        es:'En un experimento aleatorio, el espacio muestral reúne todos los resultados posibles. Si antes de conocer el resultado exacto se recibe una información parcial, por ejemplo que ocurrió cierto evento B, los resultados que contradicen esa información dejan de ser posibles y salen del conteo. Lo que queda es un espacio muestral reducido: el propio evento B.',
        en:'In a random experiment, the sample space collects every possible outcome. If partial information arrives before the exact outcome is known, for example that a certain event B occurred, the outcomes that contradict that information stop being possible and leave the count. What remains is a reduced sample space: the event B itself.'
      })+'</p>'+
      '<p>'+T({
        es:'La probabilidad condicional de A dado B mide qué tan probable es A dentro de ese espacio reducido. Se escribe P(A | B) y se define como el cociente entre la probabilidad de que ocurran los dos eventos y la probabilidad del evento que ya se sabe que ocurrió. La definición exige P(B) mayor que cero, porque no tiene sentido condicionar sobre algo imposible.',
        en:'The conditional probability of A given B measures how likely A is inside that reduced space. It is written P(A | B) and is defined as the ratio between the probability that both events occur and the probability of the event already known to have occurred. The definition requires P(B) greater than zero, because conditioning on something impossible makes no sense.'
      })+'</p>'+
      '<div class="dataline">P(A | B) = P(A ∩ B) ÷ P(B),  con P(B) &gt; 0</div>'+
      '<div class="callout"><p><strong>'+T({es:'Con resultados equiprobables: ', en:'With equally likely outcomes: '})+'</strong>'+T({
        es:'cuando todos los resultados tienen la misma probabilidad, el cociente anterior se vuelve un conteo. Basta contar cuántos resultados quedan dentro del espacio reducido y cuántos de ellos cumplen además el evento de interés.',
        en:'when all outcomes are equally likely, the ratio above becomes a count. It is enough to count how many outcomes remain inside the reduced space and how many of those also satisfy the event of interest.'
      })+'</p></div>'+
      '<div class="defgrid">'+
        '<div class="defcell"><div class="defname">'+T({es:'Espacio reducido',en:'Reduced space'})+'</div><div class="deftxt">'+T({es:'El conjunto de resultados que siguen siendo posibles después del dato recibido.',en:'The set of outcomes that remain possible after the information received.'})+'</div></div>'+
        '<div class="defcell"><div class="defname">'+T({es:'Evento condicionante',en:'Conditioning event'})+'</div><div class="deftxt">'+T({es:'El evento que se sabe que ocurrió; aparece después de la barra vertical.',en:'The event known to have occurred; it appears after the vertical bar.'})+'</div></div>'+
        '<div class="defcell"><div class="defname">'+T({es:'Probabilidad conjunta',en:'Joint probability'})+'</div><div class="deftxt">'+T({es:'La probabilidad de que los dos eventos ocurran en el mismo resultado.',en:'The probability that both events occur in the same outcome.'})+'</div></div>'+

  (function(){
    var wrap = widget('barras');
    var st = { r:0, k:0, tries:0, done:false, lock:false };
    function rd(){ return w3R[st.r]; }
    function sol(){ var d=rd(); return d.b*d.m/(100-d.b); }
    function pA(){ var d=rd(); return (st.k+d.m)/100; }
    function pAB(){ var d=rd(); return st.k/d.b; }
    function render(){
      if(st.done){
        wrap.innerHTML =

          '<div class="rfb">'+T({
            es:'Cuando las dos barras se alinean, el dato sobre B deja de mover la probabilidad de A. Ese equilibrio es exactamente la independencia.',
            en:'When the two bars line up, the information about B stops moving the probability of A. That balance is exactly independence.'
          })+'</div></div>';
        return;

        '<div class="iw-box">'+

            en:'A population of 100 people splits like this: '+d.b+' belong to B and '+(100-d.b)+' do not. Outside B, exactly '+d.m+' satisfy A. The slider moves how many people in B satisfy A and both probabilities are redrawn instantly.'
          })+'</div>'+
          '<div class="rondas">'+T({es:'Ronda ',en:'Round '})+(st.r+1)+' / 3</div>'+
          '<div class="goalbar">'+T({es:'Meta: dejar A y B independientes, es decir, que las dos barras midan lo mismo.',en:'Goal: leave A and B independent, that is, make both bars the same length.'})+'</div>'+
          '<div class="barrow"><div class="barlbl"><span>P(A)</span><span class="kval" id="brA">'+fx(pA(),3)+'</span></div>'+
            '<div class="bartrack"><div class="barfill pa" id="brAf" style="width:'+wa+'%"></div></div></div>'+
          '<div class="barrow"><div class="barlbl"><span>P(A | B)</span><span class="kval" id="brB">'+fx(pAB(),3)+'</span></div>'+
            '<div class="bartrack"><div class="barfill pb" id="brBf" style="width:'+wb+'%"></div></div></div>'+
          '<div class="krow"><span class="klbl">'+T({es:'De B, con A',en:'In B, with A'})+'</span><input type="range" min="0" max="'+d.b+'" step="1" value="'+st.k+'" oninput="brSet(this.value)"><span class="kval" id="brK">'+st.k+'</span></div>'+
          '<button class="rverify-btn" onclick="brChk()">'+T({es:'Verificar',en:'Check'})+'</button>'+
          '<div class="rfb" id="brFb"></div>'+
        '</div>';
    }
    function live(){
      var fb=document.getElementById('brFb'); if(!fb) return;
      var a=pA(), b=pAB();
      if(Math.abs(a-b) < 1e-9) fb.textContent=T({es:'Las dos barras coinciden. Confírmalo con Verificar.',en:'The two bars coincide. Confirm it with Check.'});
      else if(b>a) fb.textContent=T({es:'La barra de P(A | B) sobresale: dentro de B el evento A es más frecuente que en la población, así que B lo favorece.',en:'The P(A | B) bar sticks out: inside B the event A is more frequent than in the population, so B favours it.'});
      else fb.textContent=T({es:'La barra de P(A | B) se queda corta: dentro de B el evento A es menos frecuente que en la población, así que B lo desalienta.',en:'The P(A | B) bar falls short: inside B the event A is less frequent than in the population, so B discourages it.'});
    }
    function adv(ms){
      st.lock=true;
      setTimeout(function(){
        st.lock=false; st.r++;
        if(st.r>=w3R.length){ st.done=true; render(); return; }
        st.k=0; st.tries=0; render();
      }, ms);
    }
    window.brSet = function(v){
      if(st.done || st.lock) return;
      st.k = parseInt(v,10)||0;
      var ek=document.getElementById('brK'); if(ek) ek.textContent=st.k;
      var ea=document.getElementById('brA'); if(ea) ea.textContent=fx(pA(),3);
      var eb=document.getElementById('brB'); if(eb) eb.textContent=fx(pAB(),3);
      var fa=document.getElementById('brAf'); if(fa) fa.style.width=(pA()*100).toFixed(1)+'%';
      var fbr=document.getElementById('brBf'); if(fbr) fbr.style.width=(pAB()*100).toFixed(1)+'%';
      live();
    };
    window.brChk = function(){
      if(st.done || st.lock) return;
      var d=rd(), fb=document.getElementById('brFb'); if(!fb) return;
      if(st.k*100 === d.b*(st.k+d.m)){
        fb.innerHTML = '<span class="okmsg">'+T({es:'Correcto. ',en:'Correct. '})+'</span>'+T({
          es:'Con '+st.k+' personas de B que cumplen A, la proporción dentro de B iguala a la proporción de toda la población: el dato sobre B deja de cambiar la probabilidad de A.',
          en:'With '+st.k+' people in B satisfying A, the proportion inside B equals the proportion in the whole population: the information about B stops changing the probability of A.'
        });

      st.tries++;

        st.k = sol(); render();
        document.getElementById('brFb').innerHTML = T({
          es:'El equilibrio se alcanza con '+sol()+' personas de B que cumplen A. Ahí la proporción interna y la global coinciden.',
          en:'Balance is reached with '+sol()+' people in B satisfying A. There the inner proportion and the overall one coincide.'
        });
        adv(2600); return;
      }
      live();
    };
    render();
  })();

  (function(){

    function rd(){ return w4R[st.r]; }
    function reset(){ var d=rd(), i; st.out=[]; for(i=0;i<d.r+d.a;i++) st.out.push(false); }
    function keptRed(){ var d=rd(), c=0, i; for(i=0;i<d.r;i++) if(!st.out[i]) c++; return c; }
    function keptAll(){ var d=rd(), c=0, i; for(i=0;i<d.r+d.a;i++) if(!st.out[i]) c++; return c; }
    function sol(){
      var d=rd(), k, m;
      for(k=0;k<=d.r;k++) for(m=0;m<=d.a;m++){ if(k+m>0 && k*d.td === d.tn*(k+m)) return [k,m]; }

        '<div class="iw-tag">'+T({es:'Urna que cambia', en:'A changing urn'})+'</div>'+
        '<div class="iw-box">'+
          '<div class="iw-sub">'+T({
            es:'La urna empieza con '+d.r+' fichas rojas y '+d.a+' fichas azules. Toca una ficha para sacarla de la urna y tócala otra vez para devolverla. El indicador muestra la probabilidad de que la siguiente extracción sea roja.',
            en:'The urn starts with '+d.r+' red chips and '+d.a+' blue chips. Tap a chip to take it out of the urn and tap it again to put it back. The readout shows the probability that the next draw is red.'
          })+'</div>'+
          '<div class="rondas">'+T({es:'Ronda ',en:'Round '})+(st.r+1)+' / 3</div>'+
          '<div class="goalbar">'+T({es:'Meta: dejar la urna en un estado donde la probabilidad de extraer roja valga exactamente ',en:'Goal: leave the urn in a state where the probability of drawing red equals exactly '})+'<b>'+frH(d.tn,d.td)+'</b>.</div>'+
          '<div class="urnwrap">'+balls+'</div>'+
          '<div class="readgrid">'+
            '<div class="readcell"><div class="readlbl">'+T({es:'Rojas en la urna',en:'Red in the urn'})+'</div><div class="readval" id="urR">'+keptRed()+'</div></div>'+
            '<div class="readcell"><div class="readlbl">'+T({es:'Fichas en la urna',en:'Chips in the urn'})+'</div><div class="readval" id="urN">'+keptAll()+'</div></div>'+
            '<div class="readcell hi"><div class="readlbl">'+T({es:'P(roja)',en:'P(red)'})+'</div><div class="readval" id="urP">'+pTxt()+'</div></div>'+
          '</div>'+
          '<button class="rverify-btn" onclick="urChk()">'+T({es:'Verificar',en:'Check'})+'</button>'+
          '<button class="rverify-btn rghost" onclick="urReset()">'+T({es:'Devolver todas',en:'Return all'})+'</button>'+
          '<div class="rfb" id="urFb"></div>'+
        '</div>';
    }
    function live(){
      var fb=document.getElementById('urFb'); if(!fb) return;
      var d=rd(), n=keptAll(), k=keptRed();
      if(n===0){ fb.textContent=T({es:'La urna quedó vacía: sin fichas no hay extracción posible. Devuelve alguna.',en:'The urn is empty: with no chips there is no possible draw. Put some back.'}); return; }
      var cur=k/n, goal=d.tn/d.td;
      if(Math.abs(cur-goal)<1e-9) fb.textContent=T({es:'El indicador coincide con la meta. Confírmalo con Verificar.',en:'The readout matches the goal. Confirm it with Check.'});
      else if(cur>goal) fb.textContent=T({es:'La probabilidad de roja va por encima de la meta: saca una ficha roja o devuelve una azul.',en:'The probability of red is above the goal: take out a red chip or put a blue one back.'});
      else fb.textContent=T({es:'La probabilidad de roja va por debajo de la meta: saca una ficha azul o devuelve una roja.',en:'The probability of red is below the goal: take out a blue chip or put a red one back.'});
    }
    function adv(ms){
      st.lock=true;
      setTimeout(function(){
        st.lock=false; st.r++;
        if(st.r>=w4R.length){ st.done=true; render(); return; }
        reset(); st.tries=0; render();
      }, ms);
    }
    window.urTap = function(i){
      if(st.done || st.lock) return;
      st.out[i] = !st.out[i];
      render(); live();
    };
    window.urReset = function(){
      if(st.done || st.lock) return;
      reset(); render();
      var fb=document.getElementById('urFb');
      if(fb) fb.textContent=T({es:'La urna volvió a su composición inicial.',en:'The urn is back to its initial composition.'});
    };
    window.urChk = function(){
      if(st.done || st.lock) return;
      var d=rd(), fb=document.getElementById('urFb'); if(!fb) return;
      var n=keptAll(), k=keptRed();
      if(n>0 && k*d.td === d.tn*n){
        fb.innerHTML = '<span class="okmsg">'+T({es:'Correcto. ',en:'Correct. '})+'</span>'+T({
          es:'Con '+k+' rojas entre '+n+' fichas, la probabilidad de la siguiente extracción es justo la meta. Observa que la urna inicial daba otro valor.',
          en:'With '+k+' red among '+n+' chips, the probability of the next draw is exactly the goal. Notice that the initial urn gave a different value.'
        });
        adv(2200); return;
      }
      st.tries++;
      if(st.tries>=3){
        var s=sol(), i;
        for(i=0;i<d.r;i++) st.out[i] = (i>=s[0]);
        for(i=0;i<d.a;i++) st.out[d.r+i] = (i>=s[1]);
        render();
        document.getElementById('urFb').innerHTML = T({
          es:'Una urna que cumple la meta tiene '+s[0]+' rojas y '+s[1]+' azules. Cada retiro reescribió la probabilidad de la siguiente extracción.',
          en:'An urn that meets the goal has '+s[0]+' red and '+s[1]+' blue. Each removal rewrote the probability of the next draw.'
        });
        adv(2800); return;
      }
      live();
    };
    reset(); render();
  })();

  /* ---- P7 ---- */
  addProb({
    title:{es:'Dos extracciones seguidas', en:'Two draws in a row'},
    q: (v7===0)
      ? {es:'Una caja contiene '+p7r+' fichas rojas y '+p7a+' fichas azules, idénticas al tacto. Se extraen dos fichas al azar, una después de la otra, y la primera no se devuelve a la caja antes de sacar la segunda. Determina la probabilidad de que las dos fichas extraídas sean rojas.',
         en:'A box contains '+p7r+' red chips and '+p7a+' blue chips, identical to the touch. Two chips are drawn at random, one after the other, and the first is not returned to the box before the second is drawn. Determine the probability that both chips drawn are red.'}
      : {es:'Una caja contiene '+p7r+' fichas rojas y '+p7a+' fichas azules, idénticas al tacto. Se extraen dos fichas al azar, una después de la otra, y la primera no se devuelve a la caja antes de sacar la segunda. Se sabe que la primera ficha extraída fue roja. Determina la probabilidad de que la segunda sea azul.',
         en:'A box contains '+p7r+' red chips and '+p7a+' blue chips, identical to the touch. Two chips are drawn at random, one after the other, and the first is not returned to the box before the second is drawn. It is known that the first chip drawn was red. Determine the probability that the second one is blue.'},
    hint: (v7===0)
      ? {es:'Encadena las dos etapas con la regla del producto y calcula el segundo factor sobre la caja ya modificada: después de sacar una roja quedan una roja menos y una ficha menos en total.',
         en:'Chain the two stages with the product rule and compute the second factor on the already modified box: after a red one is drawn there is one red fewer and one chip fewer in total.'}
      : {es:'El dato recibido cambia la composición de la caja. Cuenta cuántas fichas azules quedan y cuántas fichas hay en total justo antes de la segunda extracción.',
         en:'The information received changes the composition of the box. Count how many blue chips remain and how many chips there are in total just before the second draw.'},
    exp: (v7===0)
      ? {es:'La primera ficha es roja con probabilidad '+frH(p7r,p7n)+' y, retirada esa ficha, la segunda es roja con probabilidad '+frH(p7r-1,p7n-1)+'. El producto de ambos factores es '+frH(p7r*(p7r-1),p7n*(p7n-1))+'. Elevar al cuadrado la primera fracción corresponde al caso en que la ficha se devuelve.',
         en:'The first chip is red with probability '+frH(p7r,p7n)+' and, once that chip is removed, the second is red with probability '+frH(p7r-1,p7n-1)+'. The product of both factors is '+frH(p7r*(p7r-1),p7n*(p7n-1))+'. Squaring the first fraction corresponds to the case where the chip is returned.'}
      : {es:'Después de retirar una ficha roja quedan '+p7a+' azules entre '+(p7n-1)+' fichas, así que la probabilidad condicional es '+frH(p7a,p7n-1)+'. El denominador '+p7n+' correspondería a la caja original, que ya no existe.',
         en:'After a red chip is removed there are '+p7a+' blue among '+(p7n-1)+' chips, so the conditional probability is '+frH(p7a,p7n-1)+'. The denominator '+p7n+' would correspond to the original box, which no longer exists.'},
    options: p7Opts,
    showWork: true
  });

  /* ============================================================
     IDEA 5 - EL ORDEN DEL CONDICIONAMIENTO
     ============================================================ */
  sec(T({es:'Idea 5', en:'Idea 5'}),
      T({es:'Invertir la barra cambia la pregunta', en:'Flipping the bar changes the question'}),
      '<p>'+T({
        es:'P(A | B) y P(B | A) comparten el mismo numerador, la probabilidad conjunta, pero se apoyan en denominadores distintos. Por eso son cantidades diferentes salvo en el caso particular en que los dos eventos condicionantes tengan la misma probabilidad. Tratarlas como intercambiables produce conclusiones equivocadas incluso con datos correctos.',
        en:'P(A | B) and P(B | A) share the same numerator, the joint probability, but rest on different denominators. That is why they are different quantities except in the particular case where the two conditioning events have the same probability. Treating them as interchangeable produces wrong conclusions even with correct data.'
      })+'</p>'+
      '<p>'+T({
        es:'El contraste es más visible cuando un evento es raro y el otro es común. Un evento poco frecuente puede estar casi siempre acompañado de otro muy frecuente sin que ocurra lo recíproco, porque el grupo grande diluye la proporción. Antes de interpretar una probabilidad condicional conviene identificar cuál es el grupo que se tomó como denominador.',
        en:'The contrast is clearest when one event is rare and the other is common. An infrequent event may almost always come together with a very frequent one without the converse holding, because the large group dilutes the proportion. Before interpreting a conditional probability it helps to identify which group was taken as the denominator.'
      })+'</p>');

  /* ---- P8 ---- */
  addProb({
    title:{es:'Dos condicionales distintas', en:'Two different conditionals'},
    q: (v8===0)
      ? {es:'En una región, casi todas las personas que padecen cierta alergia dan positivo en una prueba de tamizaje, mientras que solo una fracción muy pequeña de quienes dan positivo padece esa alergia. Elige la afirmación que describe correctamente esa situación.',
         en:'In one region, almost everyone who has a certain allergy tests positive in a screening test, while only a very small fraction of those who test positive has that allergy. Choose the statement that correctly describes this situation.'}
      : {es:'En una ciudad, casi todos los futbolistas profesionales entrenan a diario, mientras que solo una fracción muy pequeña de quienes entrenan a diario son futbolistas profesionales. Elige la afirmación que describe correctamente esa situación.',
         en:'In one city, almost all professional footballers train daily, while only a very small fraction of those who train daily are professional footballers. Choose the statement that correctly describes this situation.'},
    hint:{es:'Escribe las dos probabilidades condicionales que están en juego y observa cuál grupo funciona como denominador en cada una. El grupo más numeroso reparte la misma cantidad de casos entre muchos más individuos.',
          en:'Write the two conditional probabilities at play and look at which group acts as the denominator in each. The larger group spreads the same number of cases over many more individuals.'},
    exp: (v8===0)
      ? {es:'Las dos condicionales comparten el numerador, que es la cantidad de personas con alergia y prueba positiva. Al condicionar sobre la alergia el denominador es pequeño y el cociente resulta alto; al condicionar sobre el resultado positivo el denominador es mucho mayor y el cociente resulta bajo.',
         en:'Both conditionals share the numerator, which is the number of people with the allergy and a positive test. Conditioning on the allergy makes the denominator small and the ratio high; conditioning on the positive result makes the denominator much larger and the ratio low.'}
      : {es:'Las dos condicionales comparten el numerador, que es la cantidad de futbolistas profesionales que entrenan a diario. Al condicionar sobre ser profesional el denominador es pequeño y el cociente resulta alto; al condicionar sobre entrenar a diario el denominador es mucho mayor y el cociente resulta bajo.',
         en:'Both conditionals share the numerator, which is the number of professional footballers who train daily. Conditioning on being professional makes the denominator small and the ratio high; conditioning on training daily makes the denominator much larger and the ratio low.'},
    options: (v8===0)
      ? {es:['La probabilidad de dar positivo dado que hay alergia es alta, y la probabilidad de tener alergia dado que la prueba salió positiva es baja',
             'La probabilidad de tener alergia dado que la prueba salió positiva es alta, y la probabilidad de dar positivo dado que hay alergia es baja',
             'Las dos probabilidades condicionales coinciden porque involucran a los mismos dos eventos',
             'La probabilidad conjunta de alergia y prueba positiva es igual al producto de las dos condicionales'],
         en:['The probability of testing positive given the allergy is high, and the probability of having the allergy given a positive test is low',
             'The probability of having the allergy given a positive test is high, and the probability of testing positive given the allergy is low',
             'The two conditional probabilities coincide because they involve the same two events',
             'The joint probability of allergy and positive test equals the product of the two conditionals']}
      : {es:['La probabilidad de entrenar a diario dado que se es profesional es alta, y la probabilidad de ser profesional dado que se entrena a diario es baja',
             'La probabilidad de ser profesional dado que se entrena a diario es alta, y la probabilidad de entrenar a diario dado que se es profesional es baja',
             'Las dos probabilidades condicionales coinciden porque involucran a los mismos dos eventos',
             'La probabilidad conjunta de entrenar a diario y ser profesional es igual al producto de las dos condicionales'],
         en:['The probability of training daily given that one is professional is high, and the probability of being professional given daily training is low',
             'The probability of being professional given daily training is high, and the probability of training daily given that one is professional is low',
             'The two conditional probabilities coincide because they involve the same two events',
             'The joint probability of training daily and being professional equals the product of the two conditionals']},
    showWork: false
  });

  /* ============================================================
     CIERRE
     ============================================================ */
  sec(T({es:'Cierre', en:'Closing'}), T({es:'Dos situaciones para resolver', en:'Two situations to solve'}), '');

  /* ---- P9 ---- */
  addProb({
    title:{es:'Del porcentaje al caso conjunto', en:'From percentage to the joint case'},
    q: (v9===0)
      ? {es:'En un plantel, el '+p9b+' % de los estudiantes usa transporte público y, dentro de ese grupo, el '+p9q+' % llegó tarde al menos una vez durante la semana. Determina qué porcentaje del total de estudiantes usa transporte público y además llegó tarde al menos una vez.',
         en:'At one campus, '+p9b+' % of the students use public transport and, within that group, '+p9q+' % arrived late at least once during the week. Determine what percentage of all students use public transport and also arrived late at least once.'}
      : {es:'En un plantel, el '+p9b+' % de los estudiantes usa transporte público y el '+p9j+' % del total usa transporte público y además llegó tarde al menos una vez durante la semana. Determina qué porcentaje de los usuarios de transporte público llegó tarde al menos una vez.',
         en:'At one campus, '+p9b+' % of the students use public transport and '+p9j+' % of all students use public transport and also arrived late at least once during the week. Determine what percentage of the public transport users arrived late at least once.'},
    hint: (v9===0)
      ? {es:'El segundo porcentaje está calculado sobre un subgrupo, no sobre el plantel completo. Para llevarlo al total hay que multiplicarlo por la proporción que representa ese subgrupo.',
         en:'The second percentage is computed on a subgroup, not on the whole campus. To bring it back to the total it has to be multiplied by the share that subgroup represents.'}
      : {es:'Los dos porcentajes dados están calculados sobre el plantel completo. Para pasar al subgrupo hay que dividir la proporción conjunta entre la proporción del subgrupo.',
         en:'Both given percentages are computed on the whole campus. To move to the subgroup, divide the joint share by the share of the subgroup.'},
    exp: (v9===0)
      ? {es:'La regla del producto da P(tarde ∩ transporte) = '+fx(p9b/100,2)+' · '+fx(p9q/100,2)+' = '+fx(p9j/100,4)+', es decir '+p9j+' %. El valor '+p9q+' % describe solo al subgrupo de usuarios y no al plantel completo.',
         en:'The product rule gives P(late ∩ transport) = '+fx(p9b/100,2)+' · '+fx(p9q/100,2)+' = '+fx(p9j/100,4)+', that is '+p9j+' %. The value '+p9q+' % describes only the subgroup of users and not the whole campus.'}
      : {es:'La proporción condicional es '+fx(p9j/100,4)+' ÷ '+fx(p9b/100,2)+' = '+fx(p9q/100,2)+', es decir '+p9q+' %. Al cambiar de denominador el mismo grupo de estudiantes representa una fracción mayor.',
         en:'The conditional share is '+fx(p9j/100,4)+' ÷ '+fx(p9b/100,2)+' = '+fx(p9q/100,2)+', that is '+p9q+' %. Changing the denominator makes the same group of students represent a larger fraction.'},
    options: p9Opts,
    showWork: true
  });

  /* ---- P10 ---- */
  addProb({
    title:{es:'El valor que da independencia', en:'The value that yields independence'},
    q: (v10===0)
      ? {es:'Una encuesta cubre a '+p10.N+' personas. De ellas, '+p10.nA+' pertenecen al club A y '+p10.nB+' pertenecen al club B. Se elige a una persona al azar. Determina cuántas personas tendrían que pertenecer a los dos clubes a la vez para que pertenecer a A y pertenecer a B resultaran eventos independientes.',
         en:'A survey covers '+p10.N+' people. Of these, '+p10.nA+' belong to club A and '+p10.nB+' belong to club B. One person is chosen at random. Determine how many people would have to belong to both clubs at once for belonging to A and belonging to B to be independent events.'}
      : {es:'Una encuesta cubre a '+p10.N+' personas. De ellas, '+p10.nB+' pertenecen al club B y '+p10c+' pertenecen a los dos clubes a la vez. Se elige a una persona al azar. Determina cuántas personas tendrían que pertenecer al club A en total para que pertenecer a A y pertenecer a B resultaran eventos independientes.',
         en:'A survey covers '+p10.N+' people. Of these, '+p10.nB+' belong to club B and '+p10c+' belong to both clubs at once. One person is chosen at random. Determine how many people would have to belong to club A in total for belonging to A and belonging to B to be independent events.'},
    hint:{es:'Traduce cada cantidad a una probabilidad dividiendo entre el total de personas y aplica el criterio del producto. Después regresa el resultado a número de personas multiplicando por el total.',
          en:'Turn each quantity into a probability by dividing by the total number of people and apply the product criterion. Then bring the result back to a number of people by multiplying by the total.'},
    exp: (v10===0)
      ? {es:'P(A) vale '+fx(p10.nA/p10.N,3)+' y P(B) vale '+fx(p10.nB/p10.N,3)+'. La independencia exige que la probabilidad conjunta sea el producto, es decir '+fx(p10c/p10.N,3)+', que sobre '+p10.N+' personas corresponde a '+p10c+'. Promediar los dos grupos no responde a ningún criterio de probabilidad.',
         en:'P(A) equals '+fx(p10.nA/p10.N,3)+' and P(B) equals '+fx(p10.nB/p10.N,3)+'. Independence requires the joint probability to be the product, that is '+fx(p10c/p10.N,3)+', which over '+p10.N+' people corresponds to '+p10c+'. Averaging the two groups answers no probability criterion.'}
      : {es:'P(B) vale '+fx(p10.nB/p10.N,3)+' y la probabilidad conjunta vale '+fx(p10c/p10.N,3)+'. Bajo independencia, P(A) es el cociente de ambas, es decir '+fx(p10.nA/p10.N,3)+', que sobre '+p10.N+' personas corresponde a '+p10.nA+'. Sumar los dos conteos no responde a ningún criterio de probabilidad.',
         en:'P(B) equals '+fx(p10.nB/p10.N,3)+' and the joint probability equals '+fx(p10c/p10.N,3)+'. Under independence, P(A) is the ratio of the two, that is '+fx(p10.nA/p10.N,3)+', which over '+p10.N+' people corresponds to '+p10.nA+'. Adding the two counts answers no probability criterion.'},
    options: p10Opts,
    showWork: true
  });
}

</script>
</body>
</html>
