<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crear Normas para la Igualdad y la Justicia</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }

/* ── INTERACTIVE WIDGETS ── */
.wgt { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.1rem; margin:1rem 0; }
.wgt-h { font-size:.68rem; letter-spacing:.11em; text-transform:uppercase; color:var(--text3); margin-bottom:.55rem; font-weight:600; }
.wgt-q { font-size:.9rem; font-weight:600; margin-bottom:.6rem; }
.wcase { background:var(--surface2); border-left:4px solid var(--gold); border-radius:0 8px 8px 0; padding:.75rem .9rem; font-size:.88rem; color:var(--text2); margin-bottom:.8rem; }
.wmsg { margin-top:.7rem; font-size:.83rem; padding:.6rem .8rem; border-radius:8px; background:var(--surface2); color:var(--text2); }
.wmsg.ok { background:var(--ok-bg); color:var(--ok); }
.wmsg.warn { background:var(--gold-bg); color:var(--text2); border-left:3px solid var(--gold); }
.wprog { font-size:.72rem; color:var(--text3); margin-top:.5rem; letter-spacing:.04em; }
.wrow { display:flex; gap:.5rem; flex-wrap:wrap; }
.wbtn { background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:.45rem .9rem; font-size:.78rem; cursor:pointer; color:var(--text2); margin-top:.65rem; min-height:44px; }
.wbtn:hover { border-color:var(--green); color:var(--green); }
.wsteplbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.09em; color:var(--gold); font-weight:700; margin:.7rem 0 .35rem; }

/* opciones internas de los widgets */
.opts2 { display:flex; flex-direction:column; gap:.45rem; margin-top:.5rem; }
.opt2 { background:var(--surface2); border:1.5px solid var(--border); border-radius:8px; padding:.58rem .8rem; font-size:.82rem; cursor:pointer; color:var(--text2); transition:all .14s; min-height:44px; display:flex; align-items:center; }
.opt2:hover { border-color:var(--green); color:var(--green); }
.opt2.miss { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.opt2.good { border-color:var(--ok); background:var(--ok-bg); color:var(--ok); }
.opt2.on { border-color:var(--green); background:var(--green-bg); color:var(--green-dark); font-weight:600; }
.opt2.lock { pointer-events:none; opacity:.55; }

/* banco de pruebas: tarjeta de caso + seguimiento de rondas */
.casetag { display:inline-flex; align-items:center; gap:.35rem; font-size:.7rem; letter-spacing:.06em; text-transform:uppercase; color:var(--green-dark); background:var(--green-bg); border-radius:20px; padding:.2rem .7rem; margin-bottom:.5rem; font-weight:600; }
.rtrack { display:flex; gap:.3rem; margin-top:.6rem; flex-wrap:wrap; }
.rdot { width:11px; height:11px; border-radius:50%; background:var(--surface2); border:1.5px solid var(--border); }
.rdot.done { background:var(--ok); border-color:var(--ok); }
.rdot.now { border-color:var(--gold); background:var(--gold-bg); }

/* lienzos */
.cvbox { border:1px solid var(--border); border-radius:10px; background:var(--surface2); overflow:hidden; margin-bottom:.8rem; }
.rtcv { display:block; width:100%; height:250px; }
.eqcv { display:block; width:100%; height:245px; }

/* piezas de la ruta */
.pieces { display:flex; flex-direction:column; gap:.45rem; }
.piece { background:var(--surface2); border:1.5px solid var(--border); border-radius:8px; padding:.5rem .8rem; font-size:.81rem; cursor:pointer; color:var(--text2); transition:all .14s; min-height:44px; display:flex; align-items:center; }
.piece:hover { border-color:var(--green); color:var(--green); }
.piece.used { opacity:.35; pointer-events:none; }
.piece.miss { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }

/* tablero de tres columnas */
.board { display:grid; grid-template-columns:repeat(3,1fr); gap:.5rem; margin-bottom:.8rem; }
@media(max-width:600px){ .board { grid-template-columns:1fr; } }
.bcol { border:1.5px dashed var(--border); border-radius:10px; padding:.55rem; min-height:96px; background:var(--surface2); cursor:pointer; }
.bcol:hover { border-color:var(--green); }
.bcol.armed { border-style:solid; border-color:var(--gold); background:var(--gold-bg); }
.bcol-h { font-size:.66rem; text-transform:uppercase; letter-spacing:.07em; color:var(--text3); font-weight:700; margin-bottom:.4rem; }
.bitem { background:var(--surface); border:1px solid var(--ok); color:var(--ok); border-radius:6px; padding:.35rem .5rem; font-size:.72rem; margin-bottom:.3rem; }
.cardlist { display:flex; flex-direction:column; gap:.45rem; }
.acard { background:var(--surface); border:1.5px solid var(--border); border-radius:8px; padding:.55rem .8rem; font-size:.81rem; cursor:pointer; color:var(--text2); transition:all .14s; min-height:44px; display:flex; align-items:center; }
.acard:hover { border-color:var(--green); color:var(--green); }
.acard.sel { border-color:var(--gold); background:var(--gold-bg); color:var(--text); font-weight:600; }
.acard.used { display:none; }
.acard.miss { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Crear Normas para la Igualdad y la Justicia</div>
    <div class="wcourse" id="wcourse-el">Formación Cívica y Ética · 2° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>

function setLang(l){
  LANG = l;
  try { localStorage.setItem(LANG_KEY, l); } catch(e){}

    document.getElementById('lessonBody').innerHTML = '';
    var res = document.getElementById('s_results'); res.style.display='none'; res.classList.remove('vis');

/* ── Attempt counter + seed (Rule 4): seed = name+group+attempt ── */
function getAttemptKey(name, group){ return 'fce2_t05_g01__att__' + (name+'__'+group).replace(/\s+/g,'_'); }
function nextAttempt(name, group){ var k=getAttemptKey(name,group),n=0; try{n=parseInt(localStorage.getItem(k)||'0',10)||0;}catch(e){} n++; try{localStorage.setItem(k,String(n));}catch(e){} return n; }
function currentAttempt(name, group){ var k=getAttemptKey(name,group); try{return parseInt(localStorage.getItem(k)||'1',10)||1;}catch(e){return 1;} }
/* ================================================
   STATE
   ================================================ */
var studentData   = {};
var problems      = [];

/* ================================================
   SESSION PERSISTENCE  (localStorage)
   ================================================ */
function lsKey() {
  var n = (studentData.name  || '').trim();
  var g = (studentData.group || '').trim();
  return 'fce2_t05_g01__' + (n + '__' + g).replace(/\s+/g, '_');
}

function saveSession() {
  if (!studentData.name) return;
  var drawings = [], texts = [], photos = [];
  problems.forEach(function(p, i) {
    var dc = document.getElementById('dc' + i);
    if (dc && dc.width) {
      var blank = document.createElement('canvas');
      blank.width = dc.width; blank.height = dc.height;
      drawings.push(dc.toDataURL() === blank.toDataURL() ? null : dc.toDataURL('image/png'));
    } else { drawings.push(null); }
    var ta = document.getElementById('ta' + i);
    texts.push(ta ? ta.value : '');
    var pp = document.getElementById('pp' + i);
    photos.push((pp && pp.src && pp.src.indexOf('data:') === 0) ? pp.src : null);
  });
  var state = {
    name: studentData.name, group: studentData.group,
    answeredCount: answeredCount, correctCount: correctCount,
    choices: problems.map(function(p) { return p.studentChoice; }),
    drawings: drawings, texts: texts, photos: photos
  };
  try { localStorage.setItem(lsKey(), JSON.stringify(state)); } catch(e) {}
}

function loadSession(name, group) {
  var key = 'fce2_t05_g01__' + (name + '__' + group).replace(/\s+/g, '_');
  try { var r = localStorage.getItem(key); return r ? JSON.parse(r) : null; } catch(e) { return null; }
}

function restoreSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  var saved = loadSession(name, group);
  if (!saved) return;
  document.getElementById('restoreBar').style.display = 'none';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = currentAttempt(name, group);
  buildLesson(seededRng(name + group + att));
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
  saved.choices.forEach(function(choice, idx) {
    if (choice !== null && choice !== undefined) confirmMC(idx, choice);
  });
  setTimeout(function() {
    if (saved.drawings) {
      saved.drawings.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var dc = document.getElementById('dc' + i);
        if (!dc || !dc.width) return;

          var dpr = window.devicePixelRatio || 1;
          dc.getContext('2d').drawImage(img, 0, 0, dc.width / dpr, dc.height / dpr);
        };
        img.src = dataUrl;
      });
    }
    if (saved.texts) {
      saved.texts.forEach(function(text, i) {
        if (!text) return;
        var ta = document.getElementById('ta' + i);
        if (ta) ta.value = text;
      });
    }
    if (saved.photos) {

        pp.src = dataUrl; pp.style.display = 'block';

      });

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

  var doc     = new jspdf.jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS — INJECTION BLOCK ─────────────────────────────────────────
  //   Match these RGB values to --green and --gold above.
  //   PRIMARY  → pBR, pBG, pBB
  //   ACCENT   → pAR, pAG, pAB
  // ──────────────────────────────────────────────────────────────────────────
  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;  // PRIMARY (from SCHOOL, Rule 16)
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;   // ACCENT (from SCHOOL, Rule 16)

    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/\u2192/g,'->').replace(/\u2212/g,'-').replace(/\u00b2/g,'^2')
      .replace(/\u00b3/g,'^3').replace(/\u00d7/g,'x').replace(/\u00f7/g,'/')
      .replace(/\u2260/g,'!=').replace(/\u2264/g,'<=').replace(/\u2265/g,'>=')
      .replace(/\u221a/g,'sqrt').replace(/\u03c0/g,'pi').replace(/\u2026/g,'...')
      .replace(/\s+/g,' ').trim();
  }

  // ── PORTADA: orange line / white logo strip / orange line / blue band ──

    doc.setTextColor(255,255,255); doc.setFontSize(9); doc.setFont('helvetica','bold');
    doc.text(isOk?'✓':'✗', M+5.2, wy+10.5);

    doc.setTextColor(26,106,74); doc.setFontSize(8); doc.setFont('helvetica','normal');

    doc.setTextColor(90,85,80); doc.setFontSize(7.5);
    exLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });

    doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
    doc.setFontSize(7); doc.setFont('helvetica','bold');
    doc.rect(M,wy,TW,8,'F'); doc.text('TRABAJO DEL ALUMNO', M+4, wy+5.5);
    wy += 11;

    var dc = document.getElementById('dc'+i);
    if (dc) {
      try {
        var imgD = dc.toDataURL('image/png');
        var ar   = dc.height / dc.width;
        var iw   = TW;
        var ih   = Math.min(iw * ar, 68);
        doc.addImage(imgD, 'PNG', M, wy, iw, ih);
        wy += ih + 4;
      } catch(e) {}
    }

    var ta = document.getElementById('ta'+i);
    if (ta && ta.value.trim()) {
      if (wy > PH-30) { doc.addPage(); wy = 20; }
      doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('courier','normal');
      var taLines = doc.splitTextToSize(ta.value, TW);
      taLines.slice(0,16).forEach(function(ln) {
        if (wy > PH-15) { doc.addPage(); wy = 20; }

      });

    }

    var pp = document.getElementById('pp'+i);
    if (pp && pp.src && pp.src.indexOf('data:') === 0) {
      if (wy > PH-55) { doc.addPage(); wy = 20; }

  }

  // ── Footer on every page ──
  var pages = doc.internal.getNumberOfPages();
  for (var p = 1; p <= pages; p++) {
    doc.setPage(p);
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0, PH-3, PW, 3, 'F');

    doc.text(name+'  ·  '+group+'  ·  Código: '+code+'  ·  Página '+p+'/'+pages,
      PW/2, PH-5, {align:'center'});
  }

  doc.save('fce2_t05_g01_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf');
  btn.innerHTML = '⬇ &nbsp;Descargar Resultados PDF';

}

/* Shuffles options (Rule 7) keeping ES/EN aligned, then builds the card inline (Rule 1/5). */
function addProblem(v, rng){
  var n = v.options.es.length, idx = [], k;
  for (k = 0; k < n; k++) idx.push(k);
  for (k = n - 1; k > 0; k--) {
    var j = Math.floor(rng() * (k + 1));
    var tmp = idx[k]; idx[k] = idx[j]; idx[j] = tmp;
  }
  var langOpts = (LANG === 'es') ? v.options.es : v.options.en;
  var prob = {
    title:        v.title[LANG],
    questionText: v.stmt[LANG],
    fn:           v.fn || '',
    hint:         v.hint[LANG],
    explanation:  v.explanation[LANG],
    options:      idx.map(function(o){ return langOpts[o]; }),
    correctIdx:   idx.indexOf(v.correct),
    showWork:     !!v.showWork,
    studentChoice:null, pendingChoice:null
  };
  problems.push(prob);
  buildOneCard(prob, problems.length - 1);
}

/* Reads a CSS token so every canvas drawing follows the theme (Rule 14). */
function tok(nameStr, fallback){
  var v = getComputedStyle(document.documentElement).getPropertyValue(nameStr).trim();
  return v || fallback;
}

/* ================================================
   WIDGET 1 - BANCO DE PRUEBAS DE NORMAS
   A proposed rule enters the bench one at a time. Step 1: does it hold up or
   does it fail? Step 2 (only when it fails): which of the four tests it did
   not pass. Every tap answers back with the reason that points to the test;
   the third miss opens the answer and the rule moves off the bench.
   ================================================ */
var NRM = null;
function nrmTests(){
  return [ S('Persigue un fin que protege derechos','It pursues an aim that protects rights'),
           S('Trata igual a quienes están en la misma situación','It treats equally those in the same situation'),
           S('La consecuencia es proporcional a la falta','The consequence is proportional to the offense'),
           S('Se escuchó a quienes va a obligar','Those it will bind were listened to') ];
}
function buildNrm(rng){
  var fair = [
    { case:{ es:'Después de consultar a los seis grupos, la escuela acuerda que quien raye una pared la limpie y ayude a repintarla el sábado siguiente.',
             en:'After consulting the six groups, the school agrees that whoever writes on a wall cleans it and helps repaint it the following Saturday.' },
      just:true,
      why:{ es:'Repara el daño, se aplica a quien lo causó y salió de una consulta: pasa las cuatro pruebas.',
            en:'It repairs the damage, applies to whoever caused it and came out of a consultation: it passes all four tests.' } },
    { case:{ es:'Tras escuchar a las familias, se acuerda que la lista de materiales del ciclo se publique con un mes de anticipación.',
             en:'After listening to the families, it is agreed that the list of materials for the year be published a month in advance.' },
      just:true,
      why:{ es:'Persigue un fin claro, obliga igual a toda la escuela y se acordó con quienes la van a cumplir.',
            en:'It pursues a clear aim, binds the whole school equally and was agreed with those who will follow it.' } },
    { case:{ es:'La asamblea del grupo acuerda que la cancha se turne por semanas entre los tres grados, con un calendario visible en la entrada.',
             en:'The class assembly agrees that the court rotates weekly among the three grades, with a calendar posted at the entrance.' },
      just:true,
      why:{ es:'Reparte un recurso escaso con una regla conocida y aplicable a todos los grados por igual.',
            en:'It shares a scarce resource with a rule that is known and applies equally to every grade.' } }
  ];
  var unfair = [
    { case:{ es:'Una propuesta obliga a todo el grupo a aplaudir de pie cada vez que entra al salón quien preside la sociedad de alumnos.',
             en:'A proposal obliges the whole class to stand and applaud every time the head of the student body walks into the room.' },
      just:false, test:0,
      why:{ es:'No protege ningún derecho ni resuelve un problema del grupo: solo sirve para honrar a una persona.',
            en:'It protects no right and solves no problem of the group: it only serves to honor one person.' },
      twhy:[ { es:'Correcto: una norma necesita un fin que proteja algo de la convivencia, y aquí no hay ninguno.',
               en:'Correct: a rule needs an aim that protects something in shared life, and here there is none.' },
             { es:'Obliga a todo el grupo por igual, así que el problema no está en el trato desigual.',
               en:'It binds the whole class equally, so the problem is not unequal treatment.' },
             { es:'Aplaudir no es un castigo desmedido; lo que falla está antes, en para qué existe la norma.',
               en:'Applauding is not an excessive punishment; what fails comes earlier, in what the rule exists for.' },
             { es:'Aunque se hubiera consultado al grupo entero, seguiría sin proteger derecho alguno.',
               en:'Even if the whole class had been consulted, it would still protect no right at all.' } ] },
    { case:{ es:'El reglamento del taller de robótica establece que solo los alumnos hombres pueden usar las herramientas y que las alumnas tomen notas.',
             en:'The robotics workshop rules state that only male students may use the tools and that female students take notes.' },
      just:false, test:1,
      why:{ es:'Separa a estudiantes que están exactamente en la misma situación usando un rasgo que no tiene relación con la tarea.',
            en:'It splits students who are in exactly the same situation using a trait unrelated to the task.' },
      twhy:[ { es:'Cuidar las herramientas sí sería un fin válido; el problema es a quién se le permite usarlas.',
               en:'Taking care of the tools would be a valid aim; the problem is who is allowed to use them.' },
             { es:'Correcto: dos estudiantes del mismo taller reciben trato distinto por su sexo y no por su desempeño.',
               en:'Correct: two students in the same workshop get different treatment because of their sex, not their performance.' },
             { es:'No hay aquí una sanción excesiva: lo que se reparte de forma injusta es la oportunidad de aprender.',
               en:'There is no excessive sanction here: what is unfairly distributed is the chance to learn.' },
             { es:'Una consulta no volvería aceptable una regla que excluye por un rasgo personal.',
               en:'A consultation would not make a rule that excludes by a personal trait acceptable.' } ] },
    { case:{ es:'Una propuesta establece que quien llegue un minuto tarde pierda el derecho a presentar todos los exámenes del trimestre.',
             en:'A proposal states that anyone arriving one minute late loses the right to sit all the term exams.' },
      just:false, test:2,
      why:{ es:'La falta es pequeña y la consecuencia arrastra el trimestre completo: el castigo pesa mucho más que el hecho.',
            en:'The offense is small and the consequence drags the whole term along: the punishment weighs far more than the act.' },
      twhy:[ { es:'Cuidar la puntualidad sí es un fin razonable, así que la norma no falla por su propósito.',
               en:'Caring about punctuality is a reasonable aim, so the rule does not fail because of its purpose.' },
             { es:'La regla alcanza a cualquiera que llegue tarde, sin distinguir entre personas.',
               en:'The rule reaches anyone who arrives late, without distinguishing between people.' },
             { es:'Correcto: perder el trimestre entero por un minuto no guarda relación con el tamaño de la falta.',
               en:'Correct: losing the whole term over one minute bears no relation to the size of the offense.' },
             { es:'El problema no es quién la propuso, sino cuánto castiga en comparación con lo ocurrido.',
               en:'The problem is not who proposed it, but how much it punishes compared with what happened.' } ] },
    { case:{ es:'La dirección publica un lunes un reglamento nuevo de uniformes, redactado sin avisar a nadie, y empieza a sancionar ese mismo día.',
             en:'On a Monday the principal\'s office posts new uniform rules, drafted without telling anyone, and starts sanctioning that same day.' },
      just:false, test:3,
      why:{ es:'Quienes deben cumplirla se enteran cuando ya los está sancionando: no hubo consulta ni tiempo para conocerla.',
            en:'Those who must follow it find out when it is already sanctioning them: there was no consultation and no time to learn it.' },
      twhy:[ { es:'Ordenar cómo se asiste a la escuela puede ser un fin válido; el defecto está en cómo se hizo la norma.',
               en:'Setting how people come to school can be a valid aim; the flaw is in how the rule was made.' },
             { es:'El reglamento obliga a toda la escuela por igual, así que el trato no es lo que falla.',
               en:'The rules bind the whole school equally, so unequal treatment is not what fails.' },
             { es:'La sanción podría ser razonable; lo que no lo es, es aplicarla antes de que alguien pudiera conocerla.',
               en:'The sanction could be reasonable; what is not, is applying it before anyone could learn about it.' },
             { es:'Correcto: nadie escuchó a estudiantes ni familias, y la norma se aplicó sin difundirla antes.',
               en:'Correct: neither students nor families were heard, and the rule was applied without being made known first.' } ] },
    { case:{ es:'Una propuesta del comité de limpieza indica que solo quienes viven en la colonia de la escuela pueden usar los baños del edificio nuevo.',
             en:'A proposal from the cleaning committee states that only those living in the school\'s neighborhood may use the restrooms in the new building.' },
      just:false, test:1,
      why:{ es:'El domicilio no cambia en nada la necesidad: separa a estudiantes idénticos ante la misma situación.',
            en:'An address changes nothing about the need: it splits identical students facing the same situation.' },
      twhy:[ { es:'Mantener limpios los baños es un fin razonable; el defecto aparece al elegir a quién se le permite entrar.',
               en:'Keeping restrooms clean is a reasonable aim; the flaw appears when choosing who is allowed in.' },
             { es:'Correcto: dos estudiantes con la misma necesidad reciben trato distinto por dónde viven.',
               en:'Correct: two students with the same need get different treatment because of where they live.' },
             { es:'No se impone un castigo desmedido: se reparte de forma desigual el acceso a un servicio básico.',
               en:'No excessive punishment is imposed: access to a basic service is distributed unequally.' },
             { es:'Aunque el comité hubiera consultado a toda la escuela, el criterio del domicilio seguiría sin sostenerse.',
               en:'Even if the committee had consulted the whole school, the address criterion would still not hold up.' } ] }
  ];
  var rounds = shuffle(shuffle(fair, rng).slice(0, 2).concat(shuffle(unfair, rng).slice(0, 3)), rng);
  NRM = { rounds:rounds, i:0, step:1, tries:0, msg:null, cls:'', missIdx:-1, done:false };
  return '<div class="wgt">' +
      '<div class="wgt-h">' + S('Banco de pruebas','Test bench') + '</div>' +
      '<div class="wgt-q">' + S('Cada propuesta pasa por el banco. Decide si se sostiene y, cuando no, señala la prueba que reprueba.',
                                'Each proposal goes through the bench. Decide whether it holds up and, when it does not, point out the test it fails.') + '</div>' +
      '<div id="nrmBox"></div>' +
    '</div>';
}
function nrmRender(){
  if (!NRM) return;
  var box = document.getElementById('nrmBox');
  if (!box) return;
  var r = NRM.rounds[NRM.i];
  var dots = NRM.rounds.map(function(x, k){
    var c = k < NRM.i ? ' done' : (k === NRM.i && !NRM.done ? ' now' : '');
    return '<div class="rdot' + c + '"></div>';
  }).join('');
  if (NRM.done) {
    box.innerHTML = '<div class="wmsg ok">' +
        S('Pasaste las cinco propuestas por el banco. Una norma no se sostiene porque alguien con autoridad la firme: se sostiene si protege algo, si obliga igual a quienes están igual, si castiga en la medida de la falta y si quienes van a cumplirla pudieron opinar antes.',
          'You ran all five proposals through the bench. A rule does not hold up because someone in charge signs it: it holds up if it protects something, if it binds equally those who are equal, if it punishes in proportion to the offense and if those who must follow it could speak first.') +
      '</div>' +
      '<div class="wrow"><button class="wbtn" onclick="nrmReset()">' + S('Pasar las propuestas de nuevo','Run the proposals again') + '</button></div>' +
      '<div class="rtrack">' + dots + '</div>';
    return;
  }
  var body = '<div class="casetag">' + S('Propuesta ','Proposal ') + (NRM.i + 1) + S(' de ',' of ') + NRM.rounds.length + '</div>' +
             '<div class="wcase">' + r.case[LANG] + '</div>';
  if (NRM.step === 1) {
    body += '<div class="wsteplbl">' + S('¿Se sostiene esta norma?','Does this rule hold up?') + '</div>' +
      '<div class="opts2">' +
        '<div class="opt2' + (NRM.missIdx === 0 ? ' miss' : '') + '" onclick="nrmTap1(0)">' +
          S('Sí, pasa las cuatro pruebas','Yes, it passes all four tests') + '</div>' +
        '<div class="opt2' + (NRM.missIdx === 1 ? ' miss' : '') + '" onclick="nrmTap1(1)">' +
          S('No, reprueba una de las pruebas','No, it fails one of the tests') + '</div>' +
      '</div>';
  } else {
    body += '<div class="opt2 good lock">' + S('No se sostiene: reprueba una de las pruebas','It does not hold up: it fails one of the tests') + '</div>' +
      '<div class="wsteplbl">' + S('¿Cuál prueba reprueba?','Which test does it fail?') + '</div>' +
      '<div class="opts2">' +
        nrmTests().map(function(tst, k){
          return '<div class="opt2' + (NRM.missIdx === k ? ' miss' : '') + '" onclick="nrmTap2(' + k + ')">' + tst + '</div>';
        }).join('') +
      '</div>';
  }
  var msg = NRM.msg || S('Léela como si tuvieras que cumplirla mañana: ¿qué protege, a quién obliga, cuánto castiga y quién opinó antes de aprobarla?',
                         'Read it as if you had to follow it tomorrow: what does it protect, whom does it bind, how much does it punish and who spoke before it was approved?');
  body += '<div class="wmsg' + (NRM.cls ? ' ' + NRM.cls : '') + '">' + msg + '</div>' +
          '<div class="rtrack">' + dots + '</div>' +
          '<div class="wprog">' + S('Propuestas revisadas: ','Proposals reviewed: ') + NRM.i + ' / ' + NRM.rounds.length + '</div>';
  box.innerHTML = body;
}
function nrmAdvance(){
  NRM.i++; NRM.step = 1; NRM.tries = 0; NRM.missIdx = -1;
  if (NRM.i >= NRM.rounds.length) NRM.done = true;
  nrmRender();
}
function nrmTap1(k){
  if (!NRM || NRM.done || NRM.step !== 1) return;
  var r = NRM.rounds[NRM.i];
  var want = r.just ? 0 : 1;
  if (k === want) {
    NRM.missIdx = -1; NRM.tries = 0; NRM.cls = 'ok';
    if (!r.just) {
      NRM.step = 2;
      NRM.msg = r.why[LANG] + ' ' + S('Ahora marca la prueba exacta que reprueba.','Now mark the exact test it fails.');
      nrmRender(); return;
    }
    NRM.msg = r.why[LANG];
    nrmRender(); setTimeout(nrmAdvance, 1000); return;
  }
  NRM.tries++; NRM.missIdx = k; NRM.cls = 'warn';
  NRM.msg = r.just
    ? S('Vuelve a leerla: protege algo concreto, obliga igual a todos y quienes la cumplen participaron. Ninguna prueba queda reprobada.',
        'Read it again: it protects something concrete, binds everyone equally and those who follow it took part. No test comes out failed.')
    : S('Míralas una por una: alguna de las cuatro no se cumple en este texto, aunque las otras tres sí.',
        'Check them one by one: one of the four is not met in this text, even though the other three are.');
  if (NRM.tries >= 3) {
    NRM.msg = r.why[LANG];
    NRM.cls = 'ok'; NRM.missIdx = -1;
    if (!r.just) { NRM.step = 2; NRM.tries = 0; nrmRender(); return; }
    nrmRender(); setTimeout(nrmAdvance, 1200); return;
  }
  nrmRender();
}
function nrmTap2(k){
  if (!NRM || NRM.done || NRM.step !== 2) return;
  var r = NRM.rounds[NRM.i];
  if (k === r.test) {
    NRM.msg = r.twhy[k][LANG]; NRM.cls = 'ok'; NRM.missIdx = -1;
    nrmRender(); setTimeout(nrmAdvance, 1050); return;
  }
  NRM.tries++; NRM.missIdx = k; NRM.cls = 'warn';
  NRM.msg = r.twhy[k][LANG] + ' ' + S('Sigue buscando la prueba que este texto sí deja fuera.','Keep looking for the test this text really leaves out.');
  if (NRM.tries >= 3) {
    NRM.msg = r.twhy[r.test][LANG]; NRM.cls = 'ok'; NRM.missIdx = -1;
    nrmRender(); setTimeout(nrmAdvance, 1250); return;
  }
  nrmRender();
}
function nrmReset(){
  if (!NRM) return;
  NRM.i = 0; NRM.step = 1; NRM.tries = 0; NRM.missIdx = -1;
  NRM.msg = null; NRM.cls = ''; NRM.done = false;
  nrmRender();
}

/* ================================================
   WIDGET 2 - LA RUTA DE LA NORMA
   Six moments of making a rule arrive shuffled. The student taps the one that
   comes next and the canvas draws that node and the arrow reaching it. Picking
   out of turn answers back with what the route still needs at that point and
   the piece returns to the list; the third miss places the step and explains it.
   ================================================ */
var RUT = null;
function buildRut(rng){
  var sets = [
    { ctx:{ es:'En una secundaria, varios estudiantes del turno vespertino se quedan sin lugar para comer porque la cooperativa cierra antes de que ellos entren. El grupo quiere una norma escolar que resuelva eso. Arma la ruta completa.',
            en:'In one secondary school, several afternoon-shift students are left with nowhere to eat because the co-op closes before they arrive. The group wants a school rule that solves it. Build the full route.' },
      steps:[
        { lbl:{ es:'Nombrar', en:'Name it' },
          t:{ es:'Nombrar con precisión el problema: quiénes quedan sin comer y por qué.', en:'Name the problem precisely: who is left without food and why.' },
          why:{ es:'Sin nombrar el problema no hay nada que regular: la norma nace de una necesidad concreta, no de una ocurrencia.',
                en:'Without naming the problem there is nothing to regulate: a rule is born from a concrete need, not from a whim.' },
          need:{ es:'Antes de todo hay que poder decir con precisión qué está quedando fuera de alcance y para quiénes.',

function rtWrap(ctx, txt, maxW){
  var words = txt.split(' '), lines = [], cur = '';
  for (var i = 0; i < words.length; i++) {
    var test = cur ? cur + ' ' + words[i] : words[i];
    if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = words[i]; }
    else cur = test;
  }
  if (cur) lines.push(cur);
  return lines;
}
var rtWait = 0;
function rtDraw(){
  var cv = document.getElementById('rtCv');
  if (!cv || !RUT) return;
  var r = cv.getBoundingClientRect();
  if (!r.width) { if (rtWait++ < 40) setTimeout(rtDraw, 100); return; }
  rtWait = 0;
  var dpr = window.devicePixelRatio || 1;
  cv.width = r.width * dpr; cv.height = r.height * dpr;
  var ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  var W = r.width, H = r.height;
  var CG = tok('--green', '#1a4a8a'), CA = tok('--gold', '#c9a84c');
  var C3 = tok('--text3', '#7a7468'), CB = tok('--border', '#ddd8cc'), COK = tok('--ok', '#2d6a4f');
  ctx.clearRect(0, 0, W, H);
  var xs = [W * 0.18, W * 0.50, W * 0.82];
  var ys = [H * 0.30, H * 0.76];
  var rad = Math.min(20, W * 0.055);
  function posOf(i){
    var row = i < 3 ? 0 : 1;
    var col = row === 0 ? i : 5 - i;
    return [xs[col], ys[row]];
  }
  ctx.font = '600 11px IBM Plex Sans, sans-serif';
  ctx.textAlign = 'left'; ctx.fillStyle = C3;
  ctx.fillText(S('Ruta de la norma','Route of the rule'), 12, 18);
  ctx.textAlign = 'right';
  ctx.fillText(RUT.done + ' / 6', W - 12, 18);
  var i, p, q;
  for (i = 0; i < 5; i++) {
    p = posOf(i); q = posOf(i + 1);
    var live = (i + 1) < RUT.done;
    ctx.strokeStyle = live ? COK : CB;
    ctx.lineWidth = live ? 2.4 : 1.4;
    ctx.beginPath();
    if (p[1] === q[1]) {
      ctx.moveTo(p[0] + rad + 3, p[1]); ctx.lineTo(q[0] - rad - 3, q[1]);
    } else {
      ctx.moveTo(p[0], p[1] + rad + 3); ctx.lineTo(q[0], q[1] - rad - 3);
    }
    ctx.stroke();
  }
  for (i = 0; i < 6; i++) {
    p = posOf(i);
    var on = i < RUT.done;
    ctx.beginPath(); ctx.arc(p[0], p[1], rad, 0, Math.PI * 2);
    if (on) { ctx.fillStyle = COK; ctx.fill(); }
    else {
      ctx.fillStyle = tok('--surface', '#ffffff'); ctx.fill();
      ctx.strokeStyle = (i === RUT.done) ? CA : CB;
      ctx.lineWidth = (i === RUT.done) ? 2.4 : 1.4;
      ctx.stroke();
    }
    ctx.textAlign = 'center';
    ctx.font = '700 12px IBM Plex Sans, sans-serif';
    ctx.fillStyle = on ? '#ffffff' : (i === RUT.done ? CA : C3);
    ctx.fillText(String(i + 1), p[0], p[1] + 4);
    ctx.font = '10px IBM Plex Sans, sans-serif';
    ctx.fillStyle = on ? CG : C3;
    var lbl = on || i === RUT.done ? RUT.st.steps[i].lbl[LANG] : '· · ·';
    var ln = rtWrap(ctx, lbl, W * 0.28);
    for (var k = 0; k < ln.length; k++) ctx.fillText(ln[k], p[0], p[1] + rad + 13 + k * 11);
  }
}
function rutRender(){
  if (!RUT) return;
  var box = document.getElementById('rutBox');
  if (!box) return;
  rtDraw();
  if (RUT.done >= 6) {
    box.innerHTML = '<div class="wmsg ok">' +
        S('La ruta quedó cerrada. Crear una norma no es escribirla: es detectar el problema, escuchar a quienes obligará, redactarla con claridad, acordarla donde puede acordarse, darla a conocer y volver a mirarla. Saltarse un paso no acelera la norma, la debilita.',
          'The route is closed. Creating a rule is not writing it: it is detecting the problem, listening to those it will bind, drafting it clearly, agreeing on it where it can be agreed, making it known and looking at it again. Skipping a step does not speed a rule up, it weakens it.') +
      '</div>' +
      '<div class="wrow"><button class="wbtn" onclick="rutReset()">' + S('Armar la ruta otra vez','Build the route again') + '</button></div>';
    return;
  }
  var pieces = RUT.order.map(function(id){
    var used = id < RUT.done;
    var cl = 'piece' + (used ? ' used' : '') + (RUT.missIdx === id ? ' miss' : '');
    return '<div class="' + cl + '" onclick="rutTap(' + id + ')">' + RUT.st.steps[id].t[LANG] + '</div>';
  }).join('');
  var msg = RUT.msg || S('Pregúntate qué le hace falta a la ruta en este punto para que el paso siguiente tenga sentido.',
                         'Ask what the route is missing at this point for the next step to make sense.');
  box.innerHTML =
    '<div class="wcase">' + RUT.st.ctx[LANG] + '</div>' +
    '<div class="pieces">' + pieces + '</div>' +
    '<div class="wmsg' + (RUT.cls ? ' ' + RUT.cls : '') + '">' + msg + '</div>' +
    '<div class="wprog">' + S('Pasos colocados: ','Steps placed: ') + RUT.done + ' / 6</div>';
}
function rutTap(id){
  if (!RUT || RUT.done >= 6 || id < RUT.done) return;
  var next = RUT.done;
  if (id === next) {
    RUT.done++; RUT.tries = 0; RUT.missIdx = -1;
    RUT.msg = RUT.st.steps[id].why[LANG]; RUT.cls = 'ok';
    rutRender(); return;
  }
  RUT.tries++; RUT.missIdx = id; RUT.cls = 'warn';
  RUT.msg = S('Ese paso regresó a la lista. ','That step went back to the list. ') + RUT.st.steps[next].need[LANG];
  if (RUT.tries >= 3) {
    RUT.done++; RUT.tries = 0; RUT.missIdx = -1;
    RUT.msg = RUT.st.steps[next].why[LANG]; RUT.cls = 'ok';
  }
  rutRender();
}
function rutReset(){
  if (!RUT) return;
  RUT.done = 0; RUT.tries = 0; RUT.missIdx = -1; RUT.msg = null; RUT.cls = '';
  rutRender();
}

    '<div class="opts2">' + opts + '</div>' +
    '<div class="wmsg' + (EQU.cls ? ' ' + EQU.cls : '') + '">' + msg + '</div>' +
    (solved ? '<div class="wmsg ok">' + S('Con este diseño la promesa de la norma se cumple para las cuatro. Igualdad no es repetir la misma frase para todos: es que el mismo derecho quede al alcance de todos, y eso a veces exige caminos distintos.',
                                          'With this design the rule\'s promise is kept for all four. Equality is not repeating the same sentence for everyone: it is the same right being within everyone\'s reach, and that sometimes requires different paths.') + '</div>' : '') +
    '<div class="wprog">' + S('Diseños probados: ','Designs tried: ') + Object.keys(EQU.tried).length + ' / 3</div>';
}
function equPick(k){
  if (!EQU) return;
  EQU.rule = k; EQU.tried[k] = 1;
  var rl = EQU.st.rules[k];
  EQU.cls = rl.ok ? 'ok' : 'warn';
  EQU.msg = rl.why[LANG] + (rl.ok ? '' : ' ' + S('Prueba otro diseño: todavía hay barras que no tocan la línea.',
                                                 'Try another design: there are still bars that do not touch the line.'));
  equRender();
}

/* ================================================
   WIDGET 4 - MESA DE REDACCIÓN
   Six draft clauses go to one of three columns. A wrong drop sends the clause
   back to the list with the reason it does not belong there; after three
   misses the clause lands where it belongs and says why.
   ================================================ */
var MSA = null;
function buildMsa(rng){
  var sets = [
    { ctx:{ es:'El comité está redactando el reglamento de la biblioteca escolar. Estas seis cláusulas llegaron a la mesa. Colócalas donde corresponde.',
            en:'The committee is drafting the school library rules. These six clauses arrived at the table. Place them where they belong.' },
      cards:[
        { t:{ es:'Quien tome un libro lo registra en la libreta de la entrada y lo devuelve dentro de siete días; si no lo devuelve, no puede llevarse otro hasta regularizarlo.',
              en:'Whoever takes a book records it in the notebook at the entrance and returns it within seven days; if they do not, they cannot take another until they settle it.' }, c:0,
          why:{ es:'Dice quién, qué, en cuánto tiempo y qué pasa si no se cumple: cualquiera puede saber si la cumplió.',
                en:'It says who, what, within how long and what happens if it is not met: anyone can tell whether they complied.' } },
        { t:{ es:'Las personas usuarias deberán comportarse de manera adecuada dentro de la biblioteca.',

          why:{ es:'"Adecuada" lo decide quien vigila ese día: sin conductas concretas, la misma acción se sanciona o se perdona según quién esté.',
                en:'"Appropriately" is decided by whoever is on watch that day: with no concrete conduct listed, the same action gets punished or forgiven depending on who is there.' } },
        { t:{ es:'Solo el estudiantado con promedio superior a nueve podrá llevarse libros a casa.',
              en:'Only students with an average above nine may take books home.' }, c:2,
          why:{ es:'El promedio no dice nada sobre cuidar un libro, y deja fuera del préstamo justamente a quien más lo necesita para estudiar.',
                en:'A grade average says nothing about caring for a book, and it shuts out of lending precisely those who most need it to study.' } },
        { t:{ es:'El comité publica cada lunes en el tablero de la entrada la lista de libros disponibles esa semana.',
              en:'Every Monday the committee posts on the entrance board the list of books available that week.' }, c:0,
          why:{ es:'Señala quién lo hace, qué publica y con qué periodicidad: la obligación se puede verificar sin discutir.',
                en:'It states who does it, what they post and how often: the duty can be verified without argument.' } },
        { t:{ es:'Se procurará que el acervo se mantenga siempre en buen estado.',
              en:'It shall be endeavored that the collection always stays in good condition.' }, c:1,
          why:{ es:'"Se procurará" no obliga a nadie en particular ni fija un plazo: es una intención, no una regla que alguien pueda cumplir.',
                en:'"It shall be endeavored" binds nobody in particular and sets no deadline: it is an intention, not a rule anyone can follow.' } },
        { t:{ es:'El estudiantado del turno vespertino podrá usar la biblioteca únicamente si sobra lugar después del turno matutino.',
              en:'Afternoon-shift students may use the library only if there is space left after the morning shift.' }, c:2,
          why:{ es:'El turno no cambia la necesidad de estudiar: la cláusula convierte a un grupo en usuario de segunda por su horario.',
                en:'The shift does not change the need to study: the clause turns one group into second-class users because of their timetable.' } } ] },
    { ctx:{ es:'La escuela redacta el acuerdo de uso del laboratorio de cómputo. Estas seis cláusulas llegaron a la mesa. Colócalas donde corresponde.',
            en:'The school is drafting the agreement on the use of the computer lab. These six clauses arrived at the table. Place them where they belong.' },
      cards:[
        { t:{ es:'Cada grupo usa el laboratorio en el horario publicado y quien dañe un equipo por descuido participa en su reparación durante el mes siguiente.',
              en:'Each class uses the lab during the posted schedule and whoever damages equipment through carelessness takes part in its repair during the following month.' }, c:0,
          why:{ es:'Fija quién usa, cuándo, y qué consecuencia sigue a un daño: está lista para aplicarse tal como está escrita.',
                en:'It sets who uses it, when, and what consequence follows damage: it is ready to be applied exactly as written.' } },
        { t:{ es:'El equipo se usará con responsabilidad y sentido común.',
              en:'The equipment shall be used with responsibility and common sense.' }, c:1,
          why:{ es:'El sentido común de cada persona es distinto: sin decir qué está permitido y qué no, la cláusula no se puede aplicar sin arbitrariedad.',
                en:'Common sense differs from person to person: without saying what is allowed and what is not, the clause cannot be applied without arbitrariness.' } },
        { t:{ es:'El acceso al laboratorio queda reservado al estudiantado que no haya reprobado ninguna materia.',
              en:'Access to the lab is reserved for students who have not failed any subject.' }, c:2,
          why:{ es:'Convierte una herramienta de aprendizaje en un premio y se la quita a quien va atrasado, que es quien más la ocupa.',

        { t:{ es:'La persona responsable del laboratorio publica el primer lunes de cada mes, en la puerta, el horario de los seis grupos.',
              en:'The lab supervisor posts the schedule of the six classes on the door on the first Monday of each month.' }, c:0,
          why:{ es:'Hay una persona obligada, un acto concreto, una fecha y un lugar: nadie puede alegar que no se enteró.',

        { t:{ es:'Se buscará que todos los grupos tengan oportunidades suficientes de usar los equipos.',

        { t:{ es:'Las alumnas podrán usar las computadoras únicamente acompañadas por una persona docente.',
              en:'Female students may use the computers only when accompanied by a teacher.' }, c:2,

  ];
  var st = pick(sets, rng);

  return '<div class="wgt">' +
      '<div class="wgt-h">' + S('Mesa de redacción','Drafting table') + '</div>' +
      '<div class="wgt-q">' + S('Toca una cláusula y después la columna a la que pertenece.',
                                'Tap a clause and then the column it belongs to.') + '</div>' +

}
function msaCols(){
  return [ S('Lista para aplicarse','Ready to apply'),
           S('Le falta precisión','Too vague to apply'),
           S('Excluye sin razón','Excludes for no reason') ];
}
function msaRender(){
  if (!MSA) return;
  var box = document.getElementById('msaBox');
  if (!box) return;
  var cols = msaCols();
  var colHtml = cols.map(function(c, k){
    var items = '';
    Object.keys(MSA.placed).forEach(function(id){
      if (MSA.placed[id] === k) items += '<div class="bitem">' + MSA.st.cards[id].t[LANG] + '</div>';
    });
    return '<div class="bcol' + (MSA.sel >= 0 ? ' armed' : '') + '" onclick="msaDrop(' + k + ')">' +
             '<div class="bcol-h">' + c + '</div>' + items + '</div>';
  }).join('');
  var count = Object.keys(MSA.placed).length;
  var cards = MSA.order.map(function(id){
    var used = MSA.placed.hasOwnProperty(id);
    var cl = 'acard' + (used ? ' used' : '') + (MSA.sel === id ? ' sel' : '') + (MSA.missIdx === id ? ' miss' : '');
    return '<div class="' + cl + '" onclick="msaPick(' + id + ')">' + MSA.st.cards[id].t[LANG] + '</div>';
  }).join('');
  var def = MSA.sel >= 0
    ? S('Ahora toca la columna donde va esa cláusula.','Now tap the column where that clause goes.')
    : S('Léela como si tuvieras que aplicarla: ¿sabrías a quién obliga, qué exige y qué pasa si no se cumple? ¿Y deja fuera a alguien sin motivo?',
        'Read it as if you had to enforce it: would you know whom it binds, what it demands and what happens if it is not met? And does it leave someone out for no reason?');
  var done = count >= 6;
  var msg = done
    ? S('Las seis quedaron clasificadas. Una norma vaga y una norma excluyente fallan por caminos distintos: la primera se aplica según el humor de quien vigila, la segunda se aplica muy bien pero contra alguien. Redactar es evitar las dos.',
        'All six are sorted. A vague rule and an excluding rule fail in different ways: the first gets applied according to the mood of whoever is watching, the second is applied very well but against someone. Drafting means avoiding both.')
    : (MSA.msg || def);
  box.innerHTML =
    '<div class="wcase">' + MSA.st.ctx[LANG] + '</div>' +
    '<div class="board">' + colHtml + '</div>' +
    (done ? '' : '<div class="cardlist">' + cards + '</div>') +
    '<div class="wmsg' + (done ? ' ok' : (MSA.cls ? ' ' + MSA.cls : '')) + '">' + msg + '</div>' +
    (count > 0 ? '<div class="wrow"><button class="wbtn" onclick="msaReset()">' + S('Vaciar la mesa','Clear the table') + '</button></div>' : '') +
    '<div class="wprog">' + S('Cláusulas colocadas: ','Clauses placed: ') + count + ' / 6</div>';
}
function msaPick(id){
  if (!MSA || MSA.placed.hasOwnProperty(id)) return;
  MSA.sel = (MSA.sel === id) ? -1 : id;
  MSA.tries = 0; MSA.missIdx = -1; MSA.msg = null; MSA.cls = '';
  msaRender();
}
function msaDrop(k){
  if (!MSA || MSA.sel < 0) return;
  var id = MSA.sel, card = MSA.st.cards[id];
  if (card.c === k) {
    MSA.placed[id] = k; MSA.sel = -1; MSA.tries = 0; MSA.missIdx = -1;
    MSA.msg = card.why[LANG]; MSA.cls = 'ok';
    msaRender(); return;
  }
  MSA.tries++; MSA.missIdx = id; MSA.cls = 'warn';
  var cols = msaCols();
  MSA.msg = S('Esa cláusula regresó a la lista. ','That clause went back to the list. ') + card.why[LANG];
  if (MSA.tries >= 3) {
    MSA.placed[id] = card.c; MSA.sel = -1; MSA.tries = 0; MSA.missIdx = -1;
    MSA.msg = card.why[LANG] + ' ' + S('Por eso quedó en ','That is why it went to ') + '"' + cols[card.c] + '".';
    MSA.cls = 'ok';
  }
  msaRender();
}
function msaReset(){
  if (!MSA) return;
  MSA.placed = {}; MSA.sel = -1; MSA.tries = 0; MSA.msg = null; MSA.cls = ''; MSA.missIdx = -1;
  msaRender();
}
