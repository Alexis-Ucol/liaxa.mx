<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Concentración de Mezclas en Productos Cotidianos</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }

/* ── LAB WIDGETS (manipulativos del tema: concentración) ── */
.labtitle { font-family:'Crimson Pro',serif; font-size:1.05rem; font-weight:700; margin-bottom:.15rem; }
.labsub { font-size:.79rem; color:var(--text3); margin-bottom:.7rem; }
.wcanvas { display:block; width:100%; height:230px; border:1px solid var(--border); border-radius:10px; background:var(--surface2); touch-action:none; }
.fbline { margin-top:.6rem; font-size:.83rem; min-height:1.35rem; color:var(--text2); }
.fbline.good { color:var(--ok); font-weight:600; }
.fbline.warn { color:var(--gold); }
.fbline.bad  { color:var(--bad); }
.tally { font-size:.72rem; letter-spacing:.06em; text-transform:uppercase; color:var(--text3); margin-top:.55rem; }
.qprompt { font-size:.86rem; font-weight:600; margin:.75rem 0 .4rem; }
.slrow { margin:.7rem 0 .2rem; }
.slrow label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.slrow input[type=range] { width:100%; accent-color:var(--green); min-height:30px; }
.chiprow { display:flex; gap:.45rem; flex-wrap:wrap; margin:.55rem 0; }
.chipbtn { background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:.42rem .8rem; font-size:.79rem; cursor:pointer; color:var(--text2); font-family:inherit; min-height:36px; transition:all .14s; }
.chipbtn:hover { background:var(--green); color:#fff; border-color:var(--green); }
.chipbtn.on { background:var(--green); color:#fff; border-color:var(--green); }
.chipbtn.locked { opacity:.45; pointer-events:none; }
.readrow { display:grid; grid-template-columns:repeat(3,1fr); gap:.5rem; margin-top:.7rem; }
.readbox { background:var(--surface2); border-radius:8px; padding:.55rem; text-align:center; }
.readlbl { font-size:.64rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); }
.readnum { font-family:'IBM Plex Mono',monospace; font-size:1rem; font-weight:600; color:var(--green); }
.readnum.acc { color:var(--gold); }
.readnum.pl  { color:var(--text); }
.revealbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.6rem .8rem; font-size:.82rem; color:var(--text2); margin-top:.6rem; }
.revealbox.show { display:block; }
.legend { display:flex; gap:.85rem; flex-wrap:wrap; font-size:.72rem; color:var(--text3); margin-top:.5rem; }
.lgdot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:.3rem; vertical-align:middle; }
.lblcard { border:1.5px solid var(--border); border-radius:10px; padding:.7rem .8rem; cursor:pointer; background:var(--surface); transition:all .14s; }
.lblcard:hover { border-color:var(--green); }
.lblcard.pick { border-color:var(--gold); background:var(--gold-bg); }
.lblcard.locked { pointer-events:none; }
.lblgrid { display:grid; grid-template-columns:1fr 1fr; gap:.6rem; margin-top:.6rem; }
.lblname { font-weight:600; font-size:.85rem; margin-bottom:.3rem; }
.lblrow { font-size:.76rem; color:var(--text2); display:flex; justify-content:space-between; gap:.5rem; }
.bartrack { height:9px; background:var(--surface2); border-radius:5px; overflow:hidden; margin-top:.45rem; border:1px solid var(--border); }
.barfill { height:100%; width:0%; background:var(--green); transition:width .45s; }
.barfill.alt { background:var(--gold); }
@media (max-width:600px){ .wcanvas { height:205px; } .readrow { grid-template-columns:1fr 1fr; } .lblgrid { grid-template-columns:1fr; } }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Concentración de Mezclas en Productos Cotidianos</div>
    <div class="wcourse" id="wcourse-el">Química · 3° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');

}

async function generatePDF() {
  var btn = document.getElementById('dlBtn');
  btn.textContent = 'Generando PDF…';
  btn.disabled = true;

  var jspdf   = window.jspdf;
  var doc     = new jspdf.jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });
  var PW      = 215.9;
  var M       = 18;
  var TW      = PW - M * 2;
  var PH      = doc.internal.pageSize.height;
  var name    = studentData.name;
  var group   = studentData.group;
  var total   = problems.length;
  var pct     = Math.round(correctCount / total * 100);
  var dateStr = new Date().toLocaleString('es-MX', { dateStyle:'long', timeStyle:'short' });

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS — INJECTION BLOCK ─────────────────────────────────────────
  //   Match these RGB values to --green and --gold above.
  //   PRIMARY  → pBR, pBG, pBB
  //   ACCENT   → pAR, pAG, pAB
  // ──────────────────────────────────────────────────────────────────────────
  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;  // PRIMARY (from SCHOOL, Rule 16)
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;   // ACCENT (from SCHOOL, Rule 16)

  function pdfText(html) {
    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')

/* ================================================
   CONTENT HELPERS (bilingual resolution, shuffling, DOM builders)
   ================================================ */
function L(o){
  if (o === null || o === undefined) return '';
  if (typeof o === 'string' || typeof o === 'number') return o;
  return (o[LANG] !== undefined) ? o[LANG] : o.es;
}
function shuffleOpts(opts, ci, rng){
  var pairs = opts.map(function(o,i){ return { o:o, i:i }; });
  for (var k=pairs.length-1;k>0;k--){ var j=Math.floor(rng()*(k+1)); var t=pairs[k]; pairs[k]=pairs[j]; pairs[j]=t; }
  var out=[], idx=0;
  pairs.forEach(function(e,n){ out.push(e.o); if (e.i===ci) idx=n; });
  return { options:out, idx:idx };
}
function probObj(v, rng){
  var sh = shuffleOpts(L(v.opts), v.ci, rng);
  return { title:L(v.title), questionText:L(v.stmt), fn:v.fn||'', showWork:!!v.sw,
           hint:L(v.hint), explanation:L(v.exp), options:sh.options, correctIdx:sh.idx };
}
function pushProb(v, rng){
  var o = probObj(v, rng);
  problems.push({ title:o.title, questionText:o.questionText, fn:o.fn, showWork:o.showWork, hint:o.hint,
                  explanation:o.explanation, options:o.options, correctIdx:o.correctIdx,
                  studentChoice:null, pendingChoice:null });
  buildOneCard(problems[problems.length-1], problems.length-1);
}
function cssv(name){
  try { var v = getComputedStyle(document.documentElement).getPropertyValue(name); return (v||'').trim() || '#888888'; }
  catch(e){ return '#888888'; }
}
function elt(tag, cls, html){
  var d = document.createElement(tag);
  if (cls) d.className = cls;
  if (html !== undefined) d.innerHTML = html;
  return d;
}
function addSection(tag, title, bodyHtml){
  var s = elt('div','section','<div class="stag">'+tag+'</div><h2>'+title+'</h2>'+bodyHtml);
  document.getElementById('lessonBody').appendChild(s);
  return s;
}
function labCard(host, title, sub, inner){
  var c = elt('div','gcrd','<div class="labtitle">'+title+'</div><div class="labsub">'+sub+'</div>'+(inner||''));
  host.appendChild(c);
  return c;
}
/* numeric formatting */
function fmt(n){
  var r = Math.round(n*10000)/10000;
  var s = r.toFixed(4);
  if (s.indexOf('.') >= 0) s = s.replace(/0+$/,'').replace(/\.$/,'');
  return s;
}
function r1(n){ return Math.round(n*10)/10; }
function pc(n){ return fmt(n)+'%'; }
function distinct(arr){
  var seen = {}, ok = true;
  arr.forEach(function(x){ if (seen[x]) ok = false; seen[x] = 1; });
  return ok;
}
/* canvas sizing (Canvas 2D cannot read CSS variables directly; Rule 14 canvas exception) */
function fitCanvas(cv){
  var dpr = window.devicePixelRatio || 1;
  var r = cv.getBoundingClientRect();
  var w = Math.max(240, r.width || 600), h = Math.max(160, r.height || 230);
  cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr);
  var ctx = cv.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return { ctx:ctx, w:w, h:h };
}
function roundRectPath(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
}
function pickN(pool, n, rng){
  var c = pool.slice(), out = [];
  for (var i=0;i<n && c.length;i++){ var j = Math.floor(rng()*c.length); out.push(c.splice(j,1)[0]); }
  return out;
}

/* ══════════════════════════════════════════════════════════════
   MANIPULATIVO 1 — MEZCLADOR DE MASA
   Dos deslizadores (soluto y disolvente). El vaso se llena y se
   oscurece en tiempo real; una regla de concentración muestra el
   marcador del alumno frente al objetivo. 3 rondas.
   ══════════════════════════════════════════════════════════════ */
function widgetMasa(rng, host){
  var card = labCard(host,
    L({es:'Mezclador de masa', en:'Mass mixer'}),
    L({es:'Mueve los deslizadores: el vaso se oscurece cuando la disolución se concentra. Alcanza el porcentaje señalado en la regla.',
       en:'Move the sliders: the beaker darkens as the solution gets more concentrated. Reach the percent marked on the ruler.'}),
    '');
  var cv = elt('canvas','wcanvas'); card.appendChild(cv);
  var prompt = elt('div','qprompt',''); card.appendChild(prompt);
  var r1w = elt('div','slrow',
    '<label>'+L({es:'Masa de soluto (g)',en:'Mass of solute (g)'})+': <span class="cval" id="mzS">20</span></label>'+
    '<input type="range" min="2" max="80" step="1" value="20" id="mzSr">');
  var r2w = elt('div','slrow',
    '<label>'+L({es:'Masa de disolvente (g)',en:'Mass of solvent (g)'})+': <span class="cval" id="mzW">180</span></label>'+
    '<input type="range" min="40" max="400" step="5" value="180" id="mzWr">');
  card.appendChild(r1w); card.appendChild(r2w);
  var read = elt('div','readrow',
    '<div class="readbox"><div class="readlbl">'+L({es:'Masa de disolución',en:'Solution mass'})+'</div><div class="readnum pl" id="mzTot">200 g</div></div>'+
    '<div class="readbox"><div class="readlbl">'+L({es:'Porcentaje en masa',en:'Mass percent'})+'</div><div class="readnum" id="mzPct">10%</div></div>'+
    '<div class="readbox"><div class="readlbl">'+L({es:'Objetivo',en:'Target'})+'</div><div class="readnum acc" id="mzTgt">12%</div></div>');
  card.appendChild(read);
  var fb = elt('div','fbline',''); card.appendChild(fb);
  var tally = elt('div','tally',''); card.appendChild(tally);
  var rev = elt('div','revealbox',''); card.appendChild(rev);

  var targets = pickN([6,8,10,12,15,18,20,25], 3, rng);
  var round = 0, moves = 0, done = false;

  function setRound(){
    document.getElementById('mzTgt').textContent = targets[round]+'%';
    prompt.textContent = L({es:'Ronda '+(round+1)+' de 3: lleva la disolución a '+targets[round]+'% en masa.',
                            en:'Round '+(round+1)+' of 3: bring the solution to '+targets[round]+'% by mass.'});
    tally.textContent = L({es:'Rondas logradas: '+round+' de 3', en:'Rounds cleared: '+round+' of 3'});
    moves = 0; rev.classList.remove('show');
  }
  function draw(s, w, pct){
    var d = fitCanvas(cv), ctx = d.ctx, W = d.w, H = d.h;
    var line = cssv('--border'), txt = cssv('--text3'), gr = cssv('--green'), gd = cssv('--gold'), sf = cssv('--surface');
    ctx.clearRect(0,0,W,H);
    // beaker
    var bx = W*0.06, bw = Math.min(120, W*0.26), by = H*0.10, bh = H*0.80;
    ctx.fillStyle = sf; roundRectPath(ctx,bx,by,bw,bh,8); ctx.fill();
    var total = s + w, maxT = 480;
    var lh = Math.max(6, bh * Math.min(1, total/maxT));
    var sat = Math.min(1, pct/30);
    ctx.save();
    roundRectPath(ctx,bx,by,bw,bh,8); ctx.clip();
    ctx.globalAlpha = 0.22 + 0.6*sat;
    ctx.fillStyle = gr;
    ctx.fillRect(bx, by+bh-lh, bw, lh);
    ctx.globalAlpha = 1;
    // solute specks
    var n = Math.round(Math.min(60, pct*2.2));
    ctx.fillStyle = gd;
    for (var i=0;i<n;i++){
      var fx = bx + 6 + ((i*37)%Math.max(1,(bw-12)));
      var fy = by + bh - 5 - ((i*23)%Math.max(1,(lh-8)));
      ctx.beginPath(); ctx.arc(fx, fy, 2.1, 0, 6.2832); ctx.fill();
    }
    ctx.restore();
    ctx.strokeStyle = line; ctx.lineWidth = 1.6; roundRectPath(ctx,bx,by,bw,bh,8); ctx.stroke();
    ctx.fillStyle = txt; ctx.font = '11px IBM Plex Sans, sans-serif'; ctx.textAlign='center';
    ctx.fillText(L({es:'vaso',en:'beaker'}), bx+bw/2, by+bh+14);
    // concentration ruler
    var rx = bx + bw + 34, rw = W - rx - 26, ry = H*0.52;
    ctx.strokeStyle = line; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(rx, ry); ctx.lineTo(rx+rw, ry); ctx.stroke();
    ctx.font = '10px IBM Plex Sans, sans-serif'; ctx.textAlign='center'; ctx.fillStyle = txt;
    for (var v=0; v<=30; v+=5){
      var px = rx + rw*(v/30);
      ctx.strokeStyle = line; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(px, ry-5); ctx.lineTo(px, ry+5); ctx.stroke();
      ctx.fillText(v+'%', px, ry+19);
    }
    // target flag
    var tx = rx + rw*(Math.min(30,targets[round])/30);
    ctx.strokeStyle = gd; ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.moveTo(tx, ry-40); ctx.lineTo(tx, ry+8); ctx.stroke();
    ctx.fillStyle = gd; ctx.beginPath(); ctx.moveTo(tx, ry-40); ctx.lineTo(tx+22, ry-33); ctx.lineTo(tx, ry-26); ctx.closePath(); ctx.fill();
    // current marker
    var cx = rx + rw*(Math.min(30,pct)/30);
    ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(cx, ry, 8, 0, 6.2832); ctx.fill();
    ctx.fillStyle = sf; ctx.font = '9px IBM Plex Mono, monospace';
    ctx.fillText(fmt(Math.round(pct)), cx, ry+3);
    ctx.fillStyle = txt; ctx.font = '11px IBM Plex Sans, sans-serif'; ctx.textAlign='left';
    ctx.fillText(L({es:'regla de concentración',en:'concentration ruler'}), rx, ry-52);
  }
  function update(fromMove){
    var s = parseFloat(document.getElementById('mzSr').value);
    var w = parseFloat(document.getElementById('mzWr').value);
    var pct = s/(s+w)*100;
    document.getElementById('mzS').textContent = s;
    document.getElementById('mzW').textContent = w;
    document.getElementById('mzTot').textContent = (s+w)+' g';
    document.getElementById('mzPct').textContent = fmt(r1(pct))+'%';
    draw(s,w,pct);
    if (done) return;
    var tgt = targets[round];
    if (Math.abs(pct-tgt) <= 0.35){
      fb.className = 'fbline good';
      fb.textContent = L({es:'¡Exacto! '+fmt(s)+' g de soluto en '+(s+w)+' g de disolución dan '+tgt+'%.',
                          en:'Exactly right. '+fmt(s)+' g of solute in '+(s+w)+' g of solution give '+tgt+'%.'});
      done = true;
      setTimeout(function(){
        round++;
        if (round >= 3){
          fb.className = 'fbline good';
          fb.textContent = L({es:'Tres rondas resueltas. Ya controlas el porcentaje en masa desde los dos lados: soluto y disolución.',
                              en:'Three rounds cleared. You now control mass percent from both sides: solute and solution.'});
          tally.textContent = L({es:'Rondas logradas: 3 de 3', en:'Rounds cleared: 3 of 3'});
          return;
        }
        done = false; setRound(); update(false);
      }, 1000);
      return;
    }
    if (fromMove) moves++;
    if (pct < tgt){
      fb.className = 'fbline warn';
      fb.textContent = L({es:'Vas por debajo del objetivo ('+fmt(r1(pct))+'%): agrega soluto o quita disolvente.',
                          en:'You are below the target ('+fmt(r1(pct))+'%): add solute or take away solvent.'});
    } else {
      fb.className = 'fbline warn';
      fb.textContent = L({es:'Te pasaste del objetivo ('+fmt(r1(pct))+'%): quita soluto o agrega disolvente.',
                          en:'You went past the target ('+fmt(r1(pct))+'%): remove solute or add solvent.'});
    }
    if (moves >= 22 && !rev.classList.contains('show')){
      var need = Math.round(tgt*4);
      rev.classList.add('show');
      rev.innerHTML = L({es:'Una combinación que funciona: '+need+' g de soluto con '+(400-need)+' g de disolvente. La masa de la disolución es 400 g y '+need+' ÷ 400 × 100 = '+tgt+'%.',
                         en:'One combination that works: '+need+' g of solute with '+(400-need)+' g of solvent. The solution mass is 400 g and '+need+' ÷ 400 × 100 = '+tgt+'%.'});
    }
  }
  setRound();
  ['mzSr','mzWr'].forEach(function(id){
    var el = document.getElementById(id);
    el.addEventListener('input', function(){ update(true); });
  });
  setTimeout(function(){ update(false); }, 70);
  window.addEventListener('resize', function(){ update(false); });
}

/* ══════════════════════════════════════════════════════════════
   MANIPULATIVO 2 — PROBETA DEL ANTISÉPTICO
   El alumno reparte mililitros de alcohol dentro de un envase de
   volumen fijo. La probeta se llena en vivo y aparece la franja de
   seguridad del 60%. 3 rondas con envases distintos.
   ══════════════════════════════════════════════════════════════ */
function widgetProbeta(rng, host){
  var card = labCard(host,
    L({es:'Probeta del antiséptico', en:'Antiseptic cylinder'}),
    L({es:'Reparte el alcohol dentro del envase y observa el porcentaje en volumen. La franja marca el mínimo recomendado para desinfectar manos.',
       en:'Share the alcohol inside the container and watch the volume percent. The band marks the minimum recommended to disinfect hands.'}),
    '');
  var cv = elt('canvas','wcanvas'); card.appendChild(cv);
  var prompt = elt('div','qprompt',''); card.appendChild(prompt);
  var sl = elt('div','slrow',
    '<label>'+L({es:'Alcohol dentro del envase (mL)',en:'Alcohol inside the container (mL)'})+': <span class="cval" id="pbA">0</span></label>'+
    '<input type="range" min="0" max="500" step="5" value="0" id="pbAr">');
  card.appendChild(sl);
  var read = elt('div','readrow',
    '<div class="readbox"><div class="readlbl">'+L({es:'Volumen del envase',en:'Container volume'})+'</div><div class="readnum pl" id="pbV">250 mL</div></div>'+
    '<div class="readbox"><div class="readlbl">'+L({es:'Porcentaje en volumen',en:'Volume percent'})+'</div><div class="readnum" id="pbP">0%</div></div>'+
    '<div class="readbox"><div class="readlbl">'+L({es:'Objetivo',en:'Target'})+'</div><div class="readnum acc" id="pbT">70%</div></div>');
  card.appendChild(read);
  var fb = elt('div','fbline',''); card.appendChild(fb);
  card.appendChild(elt('div','legend',
    '<span><span class="lgdot" style="background:var(--green)"></span>'+L({es:'alcohol',en:'alcohol'})+'</span>'+
    '<span><span class="lgdot" style="background:var(--border)"></span>'+L({es:'resto de la fórmula',en:'rest of the formula'})+'</span>'+
    '<span><span class="lgdot" style="background:var(--gold)"></span>'+L({es:'mínimo recomendado 60%',en:'recommended minimum 60%'})+'</span>'));
  var tally = elt('div','tally',''); card.appendChild(tally);
  var rev = elt('div','revealbox',''); card.appendChild(rev);

  var rounds = pickN([[250,70],[500,62],[400,75],[200,68],[300,64],[350,60]], 3, rng);
  var round = 0, moves = 0, locked = false;

  function setRound(){
    var V = rounds[round][0], T = rounds[round][1];
    var sr = document.getElementById('pbAr');
    sr.max = V; sr.value = 0;
    document.getElementById('pbV').textContent = V+' mL';
    document.getElementById('pbT').textContent = T+'%';
    prompt.textContent = L({es:'Ronda '+(round+1)+' de 3: el envase es de '+V+' mL. Ajusta el alcohol hasta llegar a '+T+'% en volumen.',
                            en:'Round '+(round+1)+' of 3: the container holds '+V+' mL. Adjust the alcohol until you reach '+T+'% by volume.'});
    tally.textContent = L({es:'Rondas logradas: '+round+' de 3', en:'Rounds cleared: '+round+' of 3'});
    moves = 0; rev.classList.remove('show');
  }
  function draw(a, V, pct){
    var d = fitCanvas(cv), ctx = d.ctx, W = d.w, H = d.h;
    var line = cssv('--border'), txt = cssv('--text3'), gr = cssv('--green'), gd = cssv('--gold'), sf = cssv('--surface'), s2 = cssv('--surface2');
    ctx.clearRect(0,0,W,H);
    var bx = W*0.10, bw = Math.min(96, W*0.22), by = H*0.09, bh = H*0.78;
    ctx.fillStyle = sf; roundRectPath(ctx,bx,by,bw,bh,7); ctx.fill();
    // full column = container volume; alcohol at the bottom
    var ah = bh * (a/V);
    ctx.save(); roundRectPath(ctx,bx,by,bw,bh,7); ctx.clip();
    ctx.fillStyle = s2; ctx.fillRect(bx, by, bw, bh);
    ctx.fillStyle = gr; ctx.globalAlpha = 0.75; ctx.fillRect(bx, by+bh-ah, bw, ah); ctx.globalAlpha = 1;
    ctx.restore();
    // 60% safety band
    var sy = by + bh*(1-0.60);
    ctx.strokeStyle = gd; ctx.lineWidth = 2; ctx.setLineDash([5,4]);
    ctx.beginPath(); ctx.moveTo(bx-8, sy); ctx.lineTo(bx+bw+10, sy); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = gd; ctx.font = '10px IBM Plex Sans, sans-serif'; ctx.textAlign='left';
    ctx.fillText('60%', bx+bw+14, sy+3);
    // graduations
    ctx.strokeStyle = line; ctx.lineWidth = 1; ctx.fillStyle = txt; ctx.font='9px IBM Plex Mono, monospace';
    for (var k=0;k<=4;k++){
      var gy = by + bh*(k/4);
      ctx.beginPath(); ctx.moveTo(bx, gy); ctx.lineTo(bx+9, gy); ctx.stroke();
      ctx.textAlign='right'; ctx.fillText(Math.round(V*(1-k/4)), bx-4, gy+3);
    }
    ctx.strokeStyle = line; ctx.lineWidth = 1.6; roundRectPath(ctx,bx,by,bw,bh,7); ctx.stroke();
    // side dial
    var dx = bx + bw + 76, dw = W - dx - 24;
    if (dw > 60){
      ctx.textAlign='left'; ctx.fillStyle = txt; ctx.font='11px IBM Plex Sans, sans-serif';
      ctx.fillText(L({es:'alcohol en el envase',en:'alcohol in the container'}), dx, by+16);
      ctx.fillStyle = gr; ctx.font='26px IBM Plex Mono, monospace';
      ctx.fillText(fmt(r1(pct))+'%', dx, by+50);
      ctx.fillStyle = txt; ctx.font='11px IBM Plex Sans, sans-serif';
      ctx.fillText(fmt(a)+' mL '+L({es:'de',en:'of'})+' '+V+' mL', dx, by+72);
      var tw = dw, ty = by+96;
      ctx.fillStyle = s2; roundRectPath(ctx,dx,ty,tw,12,6); ctx.fill();
      ctx.fillStyle = pct>=60 ? gr : gd;
      roundRectPath(ctx,dx,ty,Math.max(4,tw*Math.min(1,pct/100)),12,6); ctx.fill();
      ctx.fillStyle = txt; ctx.font='10px IBM Plex Sans, sans-serif';
      ctx.fillText(pct>=60 ? L({es:'alcanza el mínimo recomendado',en:'meets the recommended minimum'})
                           : L({es:'por debajo del mínimo recomendado',en:'below the recommended minimum'}), dx, ty+28);
    }
  }
  function update(fromMove){
    var V = rounds[round][0], T = rounds[round][1];
    var a = parseFloat(document.getElementById('pbAr').value);
    var pct = a/V*100;
    document.getElementById('pbA').textContent = a;
    document.getElementById('pbP').textContent = fmt(r1(pct))+'%';
    draw(a, V, pct);
    if (locked) return;
    if (Math.abs(pct-T) <= 0.6){
      fb.className = 'fbline good';
      fb.textContent = L({es:'Correcto: '+fmt(a)+' mL de alcohol en '+V+' mL de producto son '+T+'% en volumen.',
                          en:'Correct: '+fmt(a)+' mL of alcohol in '+V+' mL of product is '+T+'% by volume.'});
      locked = true;
      setTimeout(function(){
        round++;
        if (round >= 3){
          fb.textContent = L({es:'Tres envases resueltos. El mismo porcentaje significa distintos mililitros según el tamaño del envase.',
                              en:'Three containers solved. The same percent means different millilitres depending on container size.'});
          tally.textContent = L({es:'Rondas logradas: 3 de 3', en:'Rounds cleared: 3 of 3'});
          return;
        }
        locked = false; setRound(); update(false);
      }, 1050);
      return;
    }
    if (fromMove) moves++;
    fb.className = 'fbline warn';
    fb.textContent = pct < T
      ? L({es:'Falta alcohol: vas en '+fmt(r1(pct))+'% y el objetivo es '+T+'%. Sube el deslizador.',
           en:'Not enough alcohol: you are at '+fmt(r1(pct))+'% and the target is '+T+'%. Raise the slider.'})
      : L({es:'Hay alcohol de más: vas en '+fmt(r1(pct))+'% y el objetivo es '+T+'%. Baja el deslizador.',
           en:'Too much alcohol: you are at '+fmt(r1(pct))+'% and the target is '+T+'%. Lower the slider.'});
    if (moves >= 20 && !rev.classList.contains('show')){
      rev.classList.add('show');
      rev.innerHTML = L({es:'Piensa al revés: '+T+'% de '+V+' mL es '+V+' × '+T+' ÷ 100 = '+fmt(V*T/100)+' mL de alcohol.',
                         en:'Think backwards: '+T+'% of '+V+' mL is '+V+' × '+T+' ÷ 100 = '+fmt(V*T/100)+' mL of alcohol.'});
    }
  }
  setRound();
  document.getElementById('pbAr').addEventListener('input', function(){ update(true); });
  setTimeout(function(){ update(false); }, 70);
  window.addEventListener('resize', function(){ update(false); });
}

/* ══════════════════════════════════════════════════════════════
   MANIPULATIVO 3 — EL DILUIDOR
   Se parte de un producto concentrado y se agrega o se retira agua
   por pasos. El color del vaso se aclara en vivo y el porcentaje
   baja. Botón de comprobación con revelación al tercer intento.
   ══════════════════════════════════════════════════════════════ */
function widgetDiluidor(rng, host){
  var card = labCard(host,
    L({es:'El diluidor', en:'The diluter'}),
    L({es:'Agrega o retira agua por pasos de 50 mL. El soluto no cambia: lo que cambia es el volumen total, y con él la concentración.',
       en:'Add or remove water in 50 mL steps. The solute does not change: what changes is the total volume, and with it the concentration.'}),
    '');
  var cv = elt('canvas','wcanvas'); card.appendChild(cv);
  var prompt = elt('div','qprompt',''); card.appendChild(prompt);
  var row = elt('div','chiprow',
    '<button class="chipbtn" id="dlAdd">'+L({es:'+ 50 mL de agua',en:'+ 50 mL of water'})+'</button>'+
    '<button class="chipbtn" id="dlSub">'+L({es:'- 50 mL de agua',en:'- 50 mL of water'})+'</button>'+
    '<button class="chipbtn" id="dlRst">'+L({es:'Volver al inicio',en:'Back to the start'})+'</button>'+
    '<button class="chipbtn on" id="dlChk">'+L({es:'Comprobar',en:'Check'})+'</button>');
  card.appendChild(row);
  var read = elt('div','readrow',
    '<div class="readbox"><div class="readlbl">'+L({es:'Volumen total',en:'Total volume'})+'</div><div class="readnum pl" id="dlV">100 mL</div></div>'+
    '<div class="readbox"><div class="readlbl">'+L({es:'Concentración actual',en:'Current concentration'})+'</div><div class="readnum" id="dlC">20%</div></div>'+
    '<div class="readbox"><div class="readlbl">'+L({es:'Objetivo',en:'Target'})+'</div><div class="readnum acc" id="dlT">5%</div></div>');
  card.appendChild(read);
  var fb = elt('div','fbline',''); card.appendChild(fb);
  var tally = elt('div','tally',''); card.appendChild(tally);
  var rev = elt('div','revealbox',''); card.appendChild(rev);

  /* [concentración inicial %, volumen inicial mL, objetivo %] */
  var rounds = pickN([[20,100,5],[30,150,10],[40,200,8],[25,200,10],[60,100,20],[50,150,15]], 3, rng);
  var round = 0, water = 0, tries = 0, locked = false;

  function cur(){
    var C1 = rounds[round][0], V1 = rounds[round][1];
    var V = V1 + water;
    return { C1:C1, V1:V1, V:V, pct: C1*V1/V, T: rounds[round][2] };
  }
  function setRound(){
    water = 0; tries = 0; locked = false; rev.classList.remove('show');
    var st = cur();
    prompt.textContent = L({es:'Ronda '+(round+1)+' de 3: partes de '+st.V1+' mL de producto al '+st.C1+'% en volumen. Diluye hasta dejarlo en '+st.T+'%.',
                            en:'Round '+(round+1)+' of 3: you start with '+st.V1+' mL of product at '+st.C1+'% by volume. Dilute it down to '+st.T+'%.'});
    document.getElementById('dlT').textContent = st.T+'%';
    tally.textContent = L({es:'Rondas logradas: '+round+' de 3', en:'Rounds cleared: '+round+' of 3'});
    fb.className = 'fbline'; fb.textContent = '';
  }
  function draw(st){
    var d = fitCanvas(cv), ctx = d.ctx, W = d.w, H = d.h;
    var line = cssv('--border'), txt = cssv('--text3'), gr = cssv('--green'), gd = cssv('--gold'), sf = cssv('--surface');
    ctx.clearRect(0,0,W,H);
    var bx = W*0.07, bw = Math.min(140, W*0.30), by = H*0.10, bh = H*0.78;
    ctx.fillStyle = sf; roundRectPath(ctx,bx,by,bw,bh,8); ctx.fill();
    var maxV = 900;
    var lh = bh*Math.min(1, st.V/maxV);
    ctx.save(); roundRectPath(ctx,bx,by,bw,bh,8); ctx.clip();
    ctx.globalAlpha = 0.18 + 0.7*Math.min(1, st.pct/60);
    ctx.fillStyle = gr; ctx.fillRect(bx, by+bh-lh, bw, lh);
    ctx.globalAlpha = 1;
    ctx.restore();
    ctx.strokeStyle = line; ctx.lineWidth = 1.6; roundRectPath(ctx,bx,by,bw,bh,8); ctx.stroke();
    ctx.fillStyle = txt; ctx.font='10px IBM Plex Mono, monospace'; ctx.textAlign='center';
    ctx.fillText(st.V+' mL', bx+bw/2, by+bh-lh-6);
    // vertical concentration scale
    var sx = bx + bw + 46, sh = bh*0.86, sy = by + bh*0.07;
    ctx.strokeStyle = line; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx, sy+sh); ctx.stroke();
    ctx.font='10px IBM Plex Sans, sans-serif'; ctx.textAlign='right';
    var top = Math.max(st.C1, 60);
    for (var v=0; v<=top; v+= (top>40?20:10)){
      var py = sy + sh*(1 - v/top);
      ctx.strokeStyle = line; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(sx-5, py); ctx.lineTo(sx+5, py); ctx.stroke();
      ctx.fillStyle = txt; ctx.fillText(v+'%', sx-9, py+3);
    }
    var ty = sy + sh*(1 - st.T/top);
    ctx.strokeStyle = gd; ctx.lineWidth = 2.2; ctx.setLineDash([5,4]);
    ctx.beginPath(); ctx.moveTo(sx, ty); ctx.lineTo(Math.min(W-16, sx+90), ty); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = gd; ctx.textAlign='left'; ctx.font='10px IBM Plex Sans, sans-serif';
    ctx.fillText(L({es:'objetivo',en:'target'})+' '+st.T+'%', sx+8, ty-6);
    var py2 = sy + sh*(1 - Math.min(top,st.pct)/top);
    ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(sx, py2, 8, 0, 6.2832); ctx.fill();
    ctx.fillStyle = txt; ctx.font='11px IBM Plex Mono, monospace'; ctx.textAlign='left';
    ctx.fillText(fmt(r1(st.pct))+'%', sx+14, py2+18);
  }
  function update(){
    var st = cur();
    document.getElementById('dlV').textContent = st.V+' mL';
    document.getElementById('dlC').textContent = fmt(r1(st.pct))+'%';
    draw(st);
  }
  function step(delta){
    if (locked) return;
    water = Math.max(0, Math.min(800, water + delta));
    var st = cur();
    fb.className = 'fbline';
    fb.textContent = delta > 0
      ? L({es:'Agregaste agua: el mismo soluto quedó repartido en '+st.V+' mL y la concentración bajó a '+fmt(r1(st.pct))+'%.',
           en:'You added water: the same solute is now spread over '+st.V+' mL and the concentration dropped to '+fmt(r1(st.pct))+'%.'})
      : L({es:'Quitaste agua: el volumen bajó a '+st.V+' mL y la concentración subió a '+fmt(r1(st.pct))+'%.',
           en:'You removed water: the volume fell to '+st.V+' mL and the concentration rose to '+fmt(r1(st.pct))+'%.'});
    update();
  }
  function check(){
    if (locked) return;
    var st = cur();
    if (Math.abs(st.pct - st.T) <= 0.25){
      locked = true;
      fb.className = 'fbline good';
      fb.textContent = L({es:'Lo lograste: '+st.C1+' × '+st.V1+' ÷ '+st.V+' = '+fmt(r1(st.pct))+'%. El soluto nunca cambió, solo el volumen total.',
                          en:'You did it: '+st.C1+' × '+st.V1+' ÷ '+st.V+' = '+fmt(r1(st.pct))+'%. The solute never changed, only the total volume.'});
      setTimeout(function(){
        round++;
        if (round >= 3){
          fb.textContent = L({es:'Tres diluciones resueltas. Diluir reparte el mismo soluto en más disolución.',
                              en:'Three dilutions solved. Diluting spreads the same solute over more solution.'});
          tally.textContent = L({es:'Rondas logradas: 3 de 3', en:'Rounds cleared: 3 of 3'});
          return;
        }
        setRound(); update();
      }, 1150);
      return;
    }
    tries++;
    if (tries >= 3){
      var need = st.C1*st.V1/st.T;
      locked = true;
      rev.classList.add('show');
      rev.innerHTML = L({es:'El volumen final debe ser '+st.C1+' × '+st.V1+' ÷ '+st.T+' = '+fmt(need)+' mL, así que hay que agregar '+fmt(need-st.V1)+' mL de agua a los '+st.V1+' mL iniciales.',
                         en:'The final volume must be '+st.C1+' × '+st.V1+' ÷ '+st.T+' = '+fmt(need)+' mL, so you add '+fmt(need-st.V1)+' mL of water to the initial '+st.V1+' mL.'});
      fb.className = 'fbline warn';
      fb.textContent = L({es:'Revisa el volumen final que se necesita y sigue con la siguiente ronda.',
                          en:'Look at the final volume needed and move on to the next round.'});
      setTimeout(function(){
        round++;
        if (round >= 3){
          tally.textContent = L({es:'Rondas logradas: '+round+' de 3', en:'Rounds cleared: '+round+' of 3'});
          return;
        }
        setRound(); update();
      }, 2600);
      return;
    }
    fb.className = 'fbline warn';
    fb.textContent = st.pct > st.T
      ? L({es:'Sigue más concentrado que el objetivo ('+fmt(r1(st.pct))+'% contra '+st.T+'%): agrega más agua.',
           en:'It is still more concentrated than the target ('+fmt(r1(st.pct))+'% against '+st.T+'%): add more water.'})
      : L({es:'Te pasaste de agua ('+fmt(r1(st.pct))+'% contra '+st.T+'%): retira un poco.',
           en:'You added too much water ('+fmt(r1(st.pct))+'% against '+st.T+'%): take some out.'});
  }
  document.getElementById('dlAdd').addEventListener('click', function(){ step(50); });
  document.getElementById('dlSub').addEventListener('click', function(){ step(-50); });
  document.getElementById('dlRst').addEventListener('click', function(){ if(locked) return; water = 0; update(); fb.className='fbline'; fb.textContent = L({es:'Volviste al producto concentrado del inicio.',en:'You are back to the concentrated product you started with.'}); });
  document.getElementById('dlChk').addEventListener('click', check);
  setRound();
  setTimeout(update, 70);
  window.addEventListener('resize', update);
}

/* ══════════════════════════════════════════════════════════════
   MANIPULATIVO 4 — COMPARADOR DE ETIQUETAS
   Dos productos reales con distinta porción. El alumno elige cuál
   concentra más soluto y al comparar aparecen las barras calculadas.
   3 rondas con productos nuevos.
   ══════════════════════════════════════════════════════════════ */
function widgetEtiquetas(rng, host){
  var card = labCard(host,
    L({es:'Comparador de etiquetas', en:'Label comparator'}),
    L({es:'Elige el producto que concentra más soluto en cada 100 g y compara. Las barras muestran el porcentaje real de cada etiqueta.',
       en:'Choose the product that packs more solute in every 100 g and compare. The bars show the real percent of each label.'}),

  var fb = elt('div','fbline',''); card.appendChild(fb);

  var POOL = [
    { a:{n:{es:'Yogur bebible',en:'Drinkable yogurt'}, s:18, m:200, u:{es:'azúcar',en:'sugar'}},
      b:{n:{es:'Néctar de mango',en:'Mango nectar'},   s:26, m:250, u:{es:'azúcar',en:'sugar'}} },
    { a:{n:{es:'Cereal de caja',en:'Boxed cereal'},    s:9,  m:30,  u:{es:'azúcar',en:'sugar'}},
      b:{n:{es:'Barra de granola',en:'Granola bar'},   s:12, m:50,  u:{es:'azúcar',en:'sugar'}} },
    { a:{n:{es:'Jabón líquido',en:'Liquid soap'},      s:14, m:200, u:{es:'agente limpiador',en:'cleaning agent'}},
      b:{n:{es:'Detergente en gel',en:'Gel detergent'},s:33, m:300, u:{es:'agente limpiador',en:'cleaning agent'}} },
    { a:{n:{es:'Salsa embotellada',en:'Bottled sauce'},s:7,  m:50,  u:{es:'sal',en:'salt'}},
      b:{n:{es:'Caldo en polvo',en:'Powdered broth'},  s:24, m:200, u:{es:'sal',en:'salt'}} },
    { a:{n:{es:'Crema para manos',en:'Hand cream'},    s:15, m:250, u:{es:'humectante',en:'moisturizer'}},
      b:{n:{es:'Loción corporal',en:'Body lotion'},    s:16, m:400, u:{es:'humectante',en:'moisturizer'}} },
    { a:{n:{es:'Pan de caja',en:'Sliced bread'},       s:5,  m:100, u:{es:'azúcar',en:'sugar'}},
      b:{n:{es:'Galleta integral',en:'Whole grain cookie'}, s:8, m:40, u:{es:'azúcar',en:'sugar'}} }
  ];
  var rounds = pickN(POOL, 3, rng);
  var round = 0, choice = null, tries = 0, locked = false;

  function render(){
    var d = rounds[round];
    choice = null; locked = false; tries = 0; rev.classList.remove('show');
    fb.className='fbline'; fb.textContent='';
    prompt.textContent = L({es:'Ronda '+(round+1)+' de 3: ¿cuál de las dos etiquetas concentra más '+L(d.a.u)+'?',
                            en:'Round '+(round+1)+' of 3: which of the two labels packs more '+L(d.a.u)+'?'});
    tally.textContent = L({es:'Rondas logradas: '+round+' de 3', en:'Rounds cleared: '+round+' of 3'});
    grid.innerHTML = '';
    ['a','b'].forEach(function(k){
      var p = d[k];
      var c = elt('div','lblcard',
        '<div class="lblname">'+L(p.n)+'</div>'+
        '<div class="lblrow"><span>'+L({es:'Porción',en:'Serving'})+'</span><span>'+p.m+' g</span></div>'+
        '<div class="lblrow"><span>'+L(p.u)+'</span><span>'+p.s+' g</span></div>'+
        '<div class="bartrack"><div class="barfill'+(k==='b'?' alt':'')+'" id="etBar_'+k+'"></div></div>');
      c.id = 'etCard_'+k;
      c.addEventListener('click', function(){
        if (locked) return;
        choice = k;
        document.getElementById('etCard_a').classList.toggle('pick', k==='a');
        document.getElementById('etCard_b').classList.toggle('pick', k==='b');
        fb.className='fbline';
        fb.textContent = L({es:'Elegiste '+L(p.n)+'. Puedes cambiar de opinión antes de comparar.',
                            en:'You picked '+L(p.n)+'. You can change your mind before comparing.'});
      });
      grid.appendChild(c);
    });
  }
  function showBars(){
    var d = rounds[round];
    var pa = d.a.s/d.a.m*100, pb = d.b.s/d.b.m*100, mx = Math.max(pa,pb);
    document.getElementById('etBar_a').style.width = (pa/mx*100)+'%';
    document.getElementById('etBar_b').style.width = (pb/mx*100)+'%';
    return { pa:pa, pb:pb };
  }
  function check(){
    if (locked) return;
    var d = rounds[round];
    if (!choice){ fb.className='fbline warn'; fb.textContent = L({es:'Toca una de las dos etiquetas antes de comparar.',en:'Tap one of the two labels before comparing.'}); return; }
    var v = showBars();
    var winner = v.pa > v.pb ? 'a' : 'b';
    if (choice === winner){
      locked = true;
      fb.className = 'fbline good';
      fb.textContent = L({es:L(d.a.n)+' tiene '+fmt(r1(v.pa))+'% y '+L(d.b.n)+' tiene '+fmt(r1(v.pb))+'%. Elegiste bien: la porción más grande no siempre es la más concentrada.',
                          en:L(d.a.n)+' has '+fmt(r1(v.pa))+'% and '+L(d.b.n)+' has '+fmt(r1(v.pb))+'%. Good choice: the bigger serving is not always the more concentrated one.'});
      setTimeout(function(){
        round++;
        if (round >= 3){
          fb.textContent = L({es:'Tres etiquetas comparadas. Para decidir hay que llevar todo a la misma base: cuánto soluto por cada 100 g.',
                              en:'Three labels compared. To decide you must bring everything to the same base: how much solute per 100 g.'});
          tally.textContent = L({es:'Rondas logradas: 3 de 3', en:'Rounds cleared: 3 of 3'});
          grid.querySelectorAll('.lblcard').forEach(function(c){ c.classList.add('locked'); });
          return;
        }
        render();
      }, 1900);
      return;
    }
    tries++;
    document.getElementById('etBar_a').style.width='0%';
    document.getElementById('etBar_b').style.width='0%';
    document.getElementById('etCard_a').classList.remove('pick');
    document.getElementById('etCard_b').classList.remove('pick');
    choice = null;
    if (tries >= 3){
      locked = true; rev.classList.add('show');
      showBars();
      rev.innerHTML = L({es:'Divide el soluto entre la porción: '+d.a.s+' ÷ '+d.a.m+' × 100 = '+fmt(r1(v.pa))+'% y '+d.b.s+' ÷ '+d.b.m+' × 100 = '+fmt(r1(v.pb))+'%. Gana '+L(d[winner].n)+'.',
                         en:'Divide solute by serving: '+d.a.s+' ÷ '+d.a.m+' × 100 = '+fmt(r1(v.pa))+'% and '+d.b.s+' ÷ '+d.b.m+' × 100 = '+fmt(r1(v.pb))+'%. The winner is '+L(d[winner].n)+'.'});
      setTimeout(function(){
        round++;
        if (round >= 3){ tally.textContent = L({es:'Rondas logradas: '+round+' de 3', en:'Rounds cleared: '+round+' of 3'}); return; }
        render();
      }, 2800);
      return;
    }
    fb.className = 'fbline warn';
    fb.textContent = L({es:'Todavía no. Fíjate que las porciones son distintas: divide los gramos de soluto entre los gramos de porción antes de comparar.',
                        en:'Not yet. Notice the servings differ: divide the grams of solute by the grams of the serving before comparing.'});
  }
  document.getElementById('etChk').addEventListener('click', check);
  document.getElementById('etClr').addEventListener('click', function(){
    if (locked) return;
    choice = null;
    document.getElementById('etCard_a').classList.remove('pick');
    document.getElementById('etCard_b').classList.remove('pick');
    fb.className='fbline'; fb.textContent='';
  });
  render();
}

      hint:{es:'Aquí se conoce la parte y falta el total. Divide los mililitros de alcohol entre el porcentaje y multiplica por 100.',

    pushProb(V[Math.floor(rng()*V.length)], rng);
  })();

  (function(){
    var V = [
      { title:{es:'Dos geles en el estante', en:'Two gels on the shelf'},
        stmt:{es:'En una farmacia hay dos geles para manos: uno declara 70% en volumen de alcohol y el otro 40%. Para desinfectar las manos se recomienda un producto con al menos 60% de alcohol. ¿Qué conviene concluir antes de comprar?',
              en:'A pharmacy has two hand gels: one states 70% alcohol by volume and the other 40%. To disinfect hands a product with at least 60% alcohol is recommended. What should you conclude before buying?'},
        opts:{es:['El gel de 70% cumple la recomendación y el de 40% se queda por debajo',

                  'Neither can be compared because the recommendation is given as a mass percent']}, ci:0, sw:false,
        hint:{es:'Compara cada porcentaje declarado contra el valor mínimo recomendado; el porcentaje ya está expresado en la misma unidad que la recomendación.',

             en:'The recommendation and the labels are both given as volume percent, so they compare directly: 70% is above the 60% minimum and 40% falls below it. Less alcohol does not mean a gentler product, it means less ability to disinfect.'} },
      { title:{es:'Dos vinagres para la receta', en:'Two vinegars for the recipe'},
        stmt:{es:'En la alacena hay dos vinagres: uno declara 6% en volumen de ácido acético y el otro 4%. La receta pide el vinagre más concentrado. ¿Cuál se debe elegir y por qué razón?',
              en:'In the cupboard there are two vinegars: one states 6% acetic acid by volume and the other 4%. The recipe asks for the more concentrated vinegar. Which should be chosen and for what reason?'},
        opts:{es:['El de 6%, porque en cada 100 mL de vinagre hay 6 mL de ácido acético',
                  'El de 4%, porque un número menor indica que el ácido está más concentrado',

            en:[pc(r1(rA)), pc(pA), pc(r1(pA*mfA/mA)), pc(r1(solA/evA*100))]}, ci:0, sw:true,
      hint:{es:'La sal se queda completa mientras el agua se va. Calcula esa sal, resta el agua evaporada a la masa total y vuelve a comparar.',
            en:'The salt stays whole while the water leaves. Work out that salt, subtract the evaporated water from the total mass and compare again.'},
      exp:{es:'La sal no se evapora: sigue habiendo '+mA+' × '+pA+' ÷ 100 = '+fmt(solA)+' g. La masa restante es '+mA+' - '+evA+' = '+mfA+' g, así que '+fmt(solA)+' ÷ '+mfA+' × 100 = '+pc(r1(rA)),
           en:'The salt does not evaporate: there are still '+mA+' × '+pA+' ÷ 100 = '+fmt(solA)+' g. The remaining mass is '+mA+' - '+evA+' = '+mfA+' g, so '+fmt(solA)+' ÷ '+mfA+' × 100 = '+pc(r1(rA))} });
    var b = pk([[600,4,200],[500,6,200],[800,3,300],[750,4,250],[400,9,100]]);
    var mB=b[0], pB=b[1], evB=b[2], solB=mB*pB/100, mfB=mB-evB, rB=r1(solB/mfB*100);
    V.push({
      title:{es:'Concentrar la salmuera', en:'Concentrating the brine'},
      stmt:{es:'Una salmuera de '+mB+' g está al '+pB+'% en masa y se quiere concentrar hasta '+fmt(rB)+'% dejándola al sol, sin perder sal. ¿Cuántos gramos de agua deben evaporarse?',
            en:'A brine of '+mB+' g is at '+pB+'% by mass and must be concentrated up to '+fmt(rB)+'% by leaving it in the sun, without losing salt. How many grams of water must evaporate?'},
      opts:{es:[fmt(evB)+' g', fmt(mfB)+' g', fmt(solB)+' g', fmt(mB)+' g'],
            en:[fmt(evB)+' g', fmt(mfB)+' g', fmt(solB)+' g', fmt(mB)+' g']}, ci:0, sw:true,
      hint:{es:'La sal es la misma antes y después. Averigua qué masa total haría que esa sal represente el porcentaje pedido y compárala con la masa inicial.',
            en:'The salt is the same before and after. Find the total mass that would make that salt equal the requested percent and compare it with the initial mass.'},
      exp:{es:'La sal se mantiene en '+mB+' × '+pB+' ÷ 100 = '+fmt(solB)+' g. Para que esa sal sea el '+fmt(rB)+'%, la masa final debe ser '+fmt(solB)+' ÷ '+fmt(rB)+' × 100 = '+mfB+' g, así que el agua evaporada es '+mB+' - '+mfB+' = '+fmt(evB)+' g',
           en:'The salt stays at '+mB+' × '+pB+' ÷ 100 = '+fmt(solB)+' g. For that salt to be '+fmt(rB)+'%, the final mass must be '+fmt(solB)+' ÷ '+fmt(rB)+' × 100 = '+mfB+' g, so the evaporated water is '+mB+' - '+mfB+' = '+fmt(evB)+' g'} });
    pushProb(V[Math.floor(rng()*V.length)], rng);
  })();
}
</script>

<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbzLGV15JRTPs9bbSvHRLfgOXeT9oUExDf1AH546WOwq5tYxXSdhX212OWi_bTJfMGx9/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'Concentración de Mezclas en Productos Cotidianos';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
