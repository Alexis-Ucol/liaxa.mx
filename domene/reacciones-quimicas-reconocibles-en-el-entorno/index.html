<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reacciones Químicas Reconocibles en el Entorno</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Reacciones Químicas Reconocibles en el Entorno</div>
    <div class="wcourse" id="wcourse-el">Química · 3° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Reacciones Químicas Reconocibles en el Entorno</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="sbtn" id="dlBtn" onclick="generatePDF()" style="max-width:280px;margin:0 auto;">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   CENTRALIZED SCHOOL CONFIG (Rule 16) — ships UNBRANDED (Rule 11).
   The ONLY rebranding point. build_all.py substitutes these exact fields
   (BRAND_FIELDS / RGB_FIELDS / logo*) downstream; :root/dark stay as fallback.
   Neutral defaults below == the static :root/dark values, so unbranded == no-op.
   ══════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:'#00a8e8', primaryDark:'#003c53', primaryBg:'#e4f3f9',
  accent:'#303070', accentBg:'#e6e6f4',
  darkPrimary:'#25afe4', darkPrimaryDark:'#5bd2ff', darkPrimaryBg:'#013245',

function saveSession() {
  if (!studentData.name) return;
  var drawings = [], texts = [], photos = [];
  problems.forEach(function(p, i) {
    var dc = document.getElementById('dc' + i);
    if (dc && dc.width) {

      blank.width = dc.width; blank.height = dc.height;
      drawings.push(dc.toDataURL() === blank.toDataURL() ? null : dc.toDataURL('image/png'));
    } else { drawings.push(null); }
    var ta = document.getElementById('ta' + i);
    texts.push(ta ? ta.value : '');
    var pp = document.getElementById('pp' + i);
    photos.push((pp && pp.src && pp.src.indexOf('data:') === 0) ? pp.src : null);
  });
  var state = {
    name: studentData.name, group: studentData.group,
    answeredCount: answeredCount, correctCount: correctCount,
    choices: problems.map(function(p) { return p.studentChoice; }),
    drawings: drawings, texts: texts, photos: photos
  };
  try { localStorage.setItem(lsKey(), JSON.stringify(state)); } catch(e) {}
}

function loadSession(name, group) {
  var key = 'qui3_t10_g01__' + (name + '__' + group).replace(/\s+/g, '_');
  try { var r = localStorage.getItem(key); return r ? JSON.parse(r) : null; } catch(e) { return null; }
}

  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
  saved.choices.forEach(function(choice, idx) {

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

function L(o){ return (o && o[LANG] !== undefined) ? o[LANG] : (o ? o.es : ''); }
function vpick(rng, list){ return list[Math.floor(rng() * list.length)]; }
function ri(rng, a, b){ return a + Math.floor(rng() * (b - a + 1)); }
function distinctNums(vals){
  var out = [];
  for (var i = 0; i < vals.length; i++){
    var v = vals[i];
    while (out.indexOf(v) !== -1) v = v + 1;
    out.push(v);
  }
  return out;
}
function gramos(n){ return n + ' g'; }

  var opts = L(v.opts).slice();
  var correctVal = opts[v.ci];
  var sh = shuffle(opts, rng);
  var prob = {
    title: L(v.title),
    questionText: L(v.q),
    fn: v.fn ? L(v.fn) : '',
    hint: L(v.hint),
    explanation: L(v.exp),
    options: sh,
    correctIdx: sh.indexOf(correctVal),
    showWork: !!v.showWork,
    studentChoice: null,
    pendingChoice: null
  };
  problems.push(prob);
  buildOneCard(prob, idx);
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 1 :: detector de cambios
   Un suceso cotidiano a la vez. El estudiante decide si aparecieron sustancias
   nuevas o si solo cambio la forma o el estado. Cada fallo devuelve una pista
   dirigida hacia la pregunta correcta; a la tercera se revela la respuesta con
   su razón y avanza el siguiente suceso.
   ══════════════════════════════════════════════════════════════════════════ */
var CAMBIOS = [
  { es:'Un clavo olvidado en el patio queda cubierto de un polvo rojizo', en:'A nail left in the yard ends up covered in a reddish powder',
    bin:0, why:{ es:'el hierro se combinó con el oxígeno del aire y formó óxido, una sustancia distinta y quebradiza', en:'the iron combined with the oxygen of the air and formed rust, a different and brittle substance' } },
  { es:'Un hielo se derrite dentro del vaso y queda agua liquida', en:'An ice cube melts inside the glass and leaves liquid water',
    bin:1, why:{ es:'la sustancia sigue siendo agua, solo cambio de estado y puede volver a congelarse', en:'the substance is still water, it only changed state and can be frozen again' } },
  { es:'La leche olvidada fuera del refrigerador se corta y huele agrio', en:'Milk left out of the fridge curdles and smells sour',
    bin:0, why:{ es:'aparecieron sustancias nuevas de sabor y olor distintos que ya no regresan a la leche original', en:'new substances with a different taste and smell appeared and never go back to the original milk' } },
  { es:'Un alambre de cobre se dobla hasta formar un aro', en:'A copper wire is bent into a ring',
    bin:1, why:{ es:'sigue siendo cobre con las mismas propiedades, solo cambio la forma', en:'it is still copper with the same properties, only the shape changed' } },
  { es:'La cáscara de un huevo dentro del vinagre burbujea hasta desaparecer', en:'An eggshell in vinegar bubbles until it disappears',
    bin:0, why:{ es:'el gas que sale no estaba en el vinagre ni en la cáscara: se formó durante la reacción', en:'the gas coming out was not in the vinegar or in the shell: it formed during the reaction' } },
  { es:'Una cucharada de azúcar se disuelve por completo en el agua', en:'A spoonful of sugar dissolves completely in the water',
    bin:1, why:{ es:'el azúcar se reparte entre el agua y puede recuperarse evaporando: no hay sustancias nuevas', en:'the sugar spreads through the water and can be recovered by evaporating: there are no new substances' } },
  { es:'Un plátano verde madura y cambia de color, olor y sabor', en:'A green banana ripens and changes colour, smell and taste',
    bin:0, why:{ es:'dentro del fruto ocurren reacciones que transforman unas sustancias en otras', en:'inside the fruit there are reactions that turn some substances into others' } },
  { es:'El agua de la olla hierve y sale como vapor', en:'The water in the pot boils and leaves as steam',
    bin:1, why:{ es:'el vapor sigue siendo agua: al enfriarse vuelve a ser liquida', en:'the steam is still water: on cooling it turns liquid again' } }
];

function wDetector(rng, host){
  var ITEMS = shuffle(CAMBIOS, rng).slice(0, 6);
  var BINS = [
    { es:'Se formaron sustancias nuevas', en:'New substances formed' },
    { es:'Solo cambio la forma o el estado', en:'Only the shape or state changed' }
  ];
  var st = { i:0, tries:0, hits:0, done:false };

  function render(){
    if (st.done){
      host.innerHTML =
        '<div class="gw-h iw-tag">' + L({ es:'Detector de cambios', en:'Change detector' }) + '</div>' +
        '<div class="gw-fb good">' + L({ es:'Recorriste los seis sucesos. Aciertos directos: ', en:'You went through the six events. Direct hits: ' }) + st.hits + ' / ' + ITEMS.length + '. ' +
        L({ es:'La pregunta que separó cada caso siempre fue la misma: al final, la sustancia sigue siendo la misma o ya es otra.', en:'The question that separated every case was always the same: in the end, is the substance still the same one or already another.' }) + '</div>';
      return;
    }
    var it = ITEMS[st.i];
    host.innerHTML =
      '<div class="gw-h iw-tag">' + L({ es:'Detector de cambios', en:'Change detector' }) + '</div>' +
      '<div class="gw-mini iw-sub">' + L({
        es:'Lee el suceso y decide qué ocurrió con la materia. Si te equivocas recibes una pista y el mismo suceso se queda para que lo vuelvas a intentar.',
        en:'Read the event and decide what happened to the matter. If you miss you get a clue and the same event stays so you can try again.'
      }) + '</div>' +
      '<div class="gw-prog">' + (st.i + 1) + ' / ' + ITEMS.length + '</div>' +
      '<div class="dt-card">' + it[LANG] + '</div>' +
      '<div class="dt-bins">' +
        '<button class="dt-bin" data-act="b0">' + L(BINS[0]) + '</button>' +
        '<button class="dt-bin" data-act="b1">' + L(BINS[1]) + '</button>' +
      '</div>' +
      '<div class="gw-fb" data-r="fb">' + L({ es:'Pista disponible: piensa si podrías deshacer el cambio con solo calentar, enfriar o evaporar.', en:'Clue available: think about whether you could undo the change just by heating, cooling or evaporating.' }) + '</div>';
  }

  function say(cls, msg){
    var fb = host.querySelector('[data-r="fb"]');
    if (fb){ fb.className = 'gw-fb ' + cls; fb.innerHTML = msg; }
  }

  function advance(){
    st.i++; st.tries = 0;
    if (st.i >= ITEMS.length) st.done = true;
    setTimeout(render, 1200);
  }

  host.addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!b || st.done) return;
    var choice = b.getAttribute('data-act') === 'b0' ? 0 : 1;
    var it = ITEMS[st.i];
    if (choice === it.bin){
      st.hits++;
      say('good', L({ es:'Correcto: ', en:'Correct: ' }) + L(it.why));
      advance();
      return;
    }
    st.tries++;
    if (st.tries >= 3){
      say('warm', L({ es:'Era el otro caso: ', en:'It was the other case: ' }) + L(it.why));
      advance();
      return;
    }
    if (it.bin === 0){
      say('miss', L({
        es:'Todavia no. Fíjate en el color, el olor y la textura del final: si ya no se parecen a los del inicio, algo nuevo se formó.',
        en:'Not yet. Look at the colour, the smell and the texture at the end: if they no longer look like the ones at the start, something new formed.'
      }));
    } else {
      say('miss', L({
        es:'Todavia no. Pregunta si podrías recuperar exactamente el material inicial enfriando, calentando o evaporando.',
        en:'Not yet. Ask whether you could get exactly the starting material back by cooling, heating or evaporating.'
      }));
    }
  });

  render();
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 2 :: bitácora de evidencias
   Una escena real y seis observaciones. El estudiante enciende y apaga las que
   considera manifestaciones de una reacción. El contador de evidencias marcadas

   sobrante concreta o avisa que falta alguna, sin decir cuál, hasta el tercer

var ESCENAS = [

      { es:'Sale vapor y se escucha un chisporroteo', en:'Steam comes out and a crackling is heard', key:true, no:{ es:'', en:'' } },
      { es:'Queda una pasta blanca que ya no es cal ni agua', en:'A white paste is left that is no longer lime or water', key:true, no:{ es:'', en:'' } },
      { es:'El agua moja las paredes de la cubeta', en:'The water wets the walls of the bucket', key:false,

      { es:'La mezcla ocupa más espacio que el agua sola', en:'The mixture takes up more room than the water alone', key:false,

        no:{ es:'el recipiente no participa: observa lo que ocurre dentro de la mezcla', en:'the container does not take part: watch what happens inside the mixture' } }
    ] },
  { case:{ es:'Partes una manzana y la dejas sobre la mesa durante una hora.',
           en:'You cut an apple open and leave it on the table for an hour.' },
    obs:[

      { es:'El color café no se quita al enjuagar con agua', en:'The brown colour does not come off when rinsed with water', key:true, no:{ es:'', en:'' } },
      { es:'El sabor y el olor de esa zona ya son distintos', en:'The taste and smell of that area are already different', key:true, no:{ es:'', en:'' } },
      { es:'El corte conserva la misma forma que le diste', en:'The cut keeps the same shape you gave it', key:false,
        no:{ es:'la forma la decidió el cuchillo, no la química del fruto', en:'the shape was decided by the knife, not by the chemistry of the fruit' } },
      { es:'La manzana pesa casi lo mismo que al principio', en:'The apple weighs almost the same as at the start', key:false,
        no:{ es:'la masa se conserva en cualquier reacción, así que ese dato no distingue un caso del otro', en:'mass is conserved in any reaction, so that fact does not tell one case from the other' } },
      { es:'La parte de adentro sigue estando húmeda', en:'The inside part is still moist', key:false,

function wBitacora(rng, host){
  var esc = ESCENAS[Math.floor(rng() * ESCENAS.length)];
  var ORD = shuffle(esc.obs, rng);
  var st = { on:ORD.map(function(){ return false; }), tries:0, done:false };

  function render(){
    var chips = ORD.map(function(o, i){
      var cls = 'ev-chip' + (st.on[i] ? ' on' : '') + (st.done && o.key ? ' key' : '');
      return '<button class="' + cls + '" data-act="e' + i + '">' + o[LANG] + '</button>';
    }).join('');
    var n = 0; st.on.forEach(function(v){ if (v) n++; });
    host.innerHTML =
      '<div class="gw-h iw-tag">' + L({ es:'Bitácora de evidencias', en:'Evidence log' }) + '</div>' +
      '<div class="gw-mini iw-sub">' + L({
        es:'Enciende las observaciones que sirven como prueba de que se formaron sustancias nuevas y apaga las que no. Puedes cambiar de opinión las veces que quieras antes de verificar.',
        en:'Switch on the observations that work as proof that new substances formed and switch off those that do not. You can change your mind as many times as you want before checking.'
      }) + '</div>' +
      '<div class="ev-case">' + L(esc.case) + '</div>' +
      '<div class="gw-prog">' + L({ es:'Encendidas: ', en:'Switched on: ' }) + n + ' / ' + ORD.length + '</div>' +
      '<div class="ev-grid">' + chips + '</div>' +
      (st.done ? '' : '<div class="gw-row"><button class="gw-btn go" data-act="chk">' + L({ es:'Verificar bitácora', en:'Check the log' }) + '</button></div>') +
      '<div class="gw-fb" data-r="fb">' + (st.done ? '' : L({ es:'Tres de las seis observaciones son pruebas reales.', en:'Three of the six observations are real proof.' })) + '</div>';
  }

  function say(cls, msg){
    var fb = host.querySelector('[data-r="fb"]');
    if (fb){ fb.className = 'gw-fb ' + cls; fb.innerHTML = msg; }
  }

  host.addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!b || st.done) return;
    var act = b.getAttribute('data-act');
    if (act.charAt(0) === 'e'){
      var i = parseInt(act.slice(1), 10);
      st.on[i] = !st.on[i];
      render();
      var falt = 0, sobr = 0;
      ORD.forEach(function(o, k){ if (o.key && !st.on[k]) falt++; if (!o.key && st.on[k]) sobr++; });
      say('', L({ es:'Marcadas de más: ', en:'Marked too many: ' }) + sobr + ' · ' + L({ es:'pendientes: ', en:'still missing: ' }) + falt);
      return;
    }
    if (act !== 'chk') return;
    var extras = [], missing = 0;
    ORD.forEach(function(o, k){
      if (o.key && !st.on[k]) missing++;
      if (!o.key && st.on[k]) extras.push(o);
    });
    if (!extras.length && !missing){
      st.done = true; render();
      say('good', L({
        es:'Bitácora completa. Las tres pruebas apuntan a lo mismo: hay algo al final que no estaba al principio y que no se puede deshacer con solo enfriar o evaporar.',
        en:'Log complete. The three proofs point at the same thing: there is something at the end that was not there at the start and that cannot be undone just by cooling or evaporating.'
      }));
      return;
    }
    st.tries++;
    if (st.tries >= 3){
      st.on = ORD.map(function(o){ return !!o.key; });
      st.done = true; render();
      say('warm', L({
        es:'Estas tres son las pruebas. Las otras describen lo que ocurre también cuando algo solo se moja, se disuelve o cambia de forma.',
        en:'These three are the proofs. The others describe what also happens when something only gets wet, dissolves or changes shape.'
      }));
      return;
    }
    if (extras.length){
      say('miss', L({ es:'Quita esta: ', en:'Take this one out: ' }) + '<b>' + extras[0][LANG] + '</b>. ' + L(extras[0].no) + '.');
    } else {
      say('miss', L({
        es:'Vas bien, pero te falta al menos una prueba. Busca gas nuevo, color que no se quita, olor nuevo o cambio de temperatura.',
        en:'You are on track, but at least one proof is missing. Look for new gas, colour that does not come off, a new smell or a temperature change.'
      }));
    }
  });

  render();
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 3 :: balanza de la ecuación
   Tres ecuaciones del entorno con sus coeficientes en 1. Cada toque en más o
   menos recalcula al instante cuántos átomos de cada elemento hay de cada lado
   y la tabla marca el desajuste con su signo. Reversible siempre; a la tercera
   verificacion fallida se revelan los coeficientes correctos.
   ══════════════════════════════════════════════════════════════════════════ */
var ECUACIONES = [
  { name:{ es:'Combustión del metano en la estufa', en:'Combustion of methane on the stove' },
    L:[{ f:'CH<sub>4</sub>', at:{ C:1, H:4 } }, { f:'O<sub>2</sub>', at:{ O:2 } }],
    R:[{ f:'CO<sub>2</sub>', at:{ C:1, O:2 } }, { f:'H<sub>2</sub>O', at:{ H:2, O:1 } }],
    sol:[1, 2, 1, 2] },
  { name:{ es:'Oxidación del hierro a la intemperie', en:'Rusting of iron in the open air' },
    L:[{ f:'Fe', at:{ Fe:1 } }, { f:'O<sub>2</sub>', at:{ O:2 } }],
    R:[{ f:'Fe<sub>2</sub>O<sub>3</sub>', at:{ Fe:2, O:3 } }],
    sol:[4, 3, 2] },
  { name:{ es:'Descomposición del agua oxigenada', en:'Decomposition of hydrogen peroxide' },
    L:[{ f:'H<sub>2</sub>O<sub>2</sub>', at:{ H:2, O:2 } }],
    R:[{ f:'H<sub>2</sub>O', at:{ H:2, O:1 } }, { f:'O<sub>2</sub>', at:{ O:2 } }],
    sol:[2, 2, 1] },
  { name:{ es:'Cinta de magnesio que arde con luz blanca', en:'Magnesium ribbon burning with a white light' },
    L:[{ f:'Mg', at:{ Mg:1 } }, { f:'O<sub>2</sub>', at:{ O:2 } }],
    R:[{ f:'MgO', at:{ Mg:1, O:1 } }],
    sol:[2, 1, 2] },
  { name:{ es:'Zinc atacado por el ácido del limpiador', en:'Zinc attacked by the acid in the cleaner' },
    L:[{ f:'Zn', at:{ Zn:1 } }, { f:'HCl', at:{ H:1, Cl:1 } }],
    R:[{ f:'ZnCl<sub>2</sub>', at:{ Zn:1, Cl:2 } }, { f:'H<sub>2</sub>', at:{ H:2 } }],
    sol:[1, 2, 1, 1] },
  { name:{ es:'Amoniaco que se forma a partir de nitrógeno del aire', en:'Ammonia formed from nitrogen in the air' },
    L:[{ f:'N<sub>2</sub>', at:{ N:2 } }, { f:'H<sub>2</sub>', at:{ H:2 } }],
    R:[{ f:'NH<sub>3</sub>', at:{ N:1, H:3 } }],
    sol:[1, 3, 2] }
];

function gcd2(a, b){ while (b){ var t = a % b; a = b; b = t; } return a; }

function wBalanza(rng, host){
  var wr = seededRng('bal' + Math.floor(rng() * 1000000));
  var ROUNDS = shuffle(ECUACIONES, wr).slice(0, 3);
  var st = { r:0, co:[], tries:0, solved:false, over:false };

  function spec(eq){ return eq.L.concat(eq.R); }

  function startRound(){
    st.co = spec(ROUNDS[st.r]).map(function(){ return 1; });
    st.tries = 0; st.solved = false;
    render('', '');
  }

  function counts(){
    var eq = ROUNDS[st.r], sp = spec(eq), out = {};
    sp.forEach(function(s, i){
      var side = i < eq.L.length ? 'l' : 'r';
      Object.keys(s.at).forEach(function(el){
        if (!out[el]) out[el] = { l:0, r:0 };
        out[el][side] += s.at[el] * st.co[i];
      });
    });
    return out;
  }

  function firstGap(){
    var c = counts(), keys = Object.keys(c);
    for (var i = 0; i < keys.length; i++){
      if (c[keys[i]].l !== c[keys[i]].r) return { el:keys[i], l:c[keys[i]].l, r:c[keys[i]].r };
    }
    return null;
  }

  function render(cls, msg){
    var eq = ROUNDS[st.r], sp = spec(eq);
    var eqHtml = '';
    sp.forEach(function(s, i){
      if (i === eq.L.length) eqHtml += '<span class="bl-op">→</span>';
      else if (i > 0) eqHtml += '<span class="bl-op">+</span>';
      eqHtml += '<span class="bl-sp">' +
        '<button class="bl-step" data-act="m' + i + '">−</button>' +
        '<span class="bl-n">' + st.co[i] + '</span>' +
        '<button class="bl-step" data-act="p' + i + '">+</button>' +
        '<span class="bl-f">' + s.f + '</span></span>';
    });
    var c = counts();
    var rows = Object.keys(c).map(function(el){
      var eq2 = c[el].l === c[el].r;
      return '<div class="bl-row"><span class="bl-el">' + el + '</span>' +
        '<span class="bl-cnt' + (eq2 ? '' : ' hi') + '">' + c[el].l + '</span>' +
        '<span class="bl-op">' + L({ es:'contra', en:'against' }) + '</span>' +
        '<span class="bl-cnt' + (eq2 ? '' : ' hi') + '">' + c[el].r + '</span>' +
        '<span class="bl-mk ' + (eq2 ? 'ok' : 'no') + '">' + (eq2 ? '✓' : '≠') + '</span></div>';
    }).join('');
    var live = '';
    var g = firstGap();
    if (g){
      live = g.l > g.r
        ? L({ es:'Del lado de los productos faltan ', en:'On the product side there are ' }) + (g.l - g.r) + L({ es:' átomos de ', en:' atoms of ' }) + g.el + L({ es:'.', en:' missing.' })
        : L({ es:'Del lado de los reactivos faltan ', en:'On the reactant side there are ' }) + (g.r - g.l) + L({ es:' átomos de ', en:' atoms of ' }) + g.el + L({ es:'.', en:' missing.' });
    } else {
      live = L({ es:'Cada elemento aparece la misma cantidad de veces en los dos lados.', en:'Every element appears the same number of times on both sides.' });
    }
    host.innerHTML =
      '<div class="gw-h iw-tag">' + L({ es:'Balanza de la ecuación', en:'Equation balance' }) + '</div>' +
      '<div class="gw-mini iw-sub">' + L({
        es:'Sube o baja el número que va delante de cada sustancia y observa cómo cambia el conteo de átomos de los dos lados. Puedes moverlos cuantas veces quieras antes de verificar.',
        en:'Raise or lower the number in front of each substance and watch how the atom count on both sides changes. You can move them as many times as you like before checking.'
      }) + '</div>' +
      '<div class="gw-prog">' + (st.r + 1) + ' / 3</div>' +
      '<div class="gw-q">' + L(ROUNDS[st.r].name) + '</div>' +
      '<div class="bl-eq">' + eqHtml + '</div>' +
      '<div class="gw-lbl">' + L({ es:'Átomos: reactivos contra productos', en:'Atoms: reactants against products' }) + '</div>' +
      rows +
      '<div class="gw-row">' +
        (st.solved || st.over
          ? '<button class="gw-btn go" data-act="next">' + (st.r >= 2 ? L({ es:'Terminar', en:'Finish' }) : L({ es:'Siguiente reacción', en:'Next reaction' })) + '</button>'
          : '<button class="gw-btn go" data-act="chk">' + L({ es:'Verificar', en:'Check' }) + '</button>') +
      '</div>' +
      '<div class="gw-fb ' + (cls || '') + '" data-r="fb">' + (msg || live) + '</div>';
  }

  function done(){
    host.innerHTML =
      '<div class="gw-h iw-tag">' + L({ es:'Balanza de la ecuación', en:'Equation balance' }) + '</div>' +
      '<div class="gw-fb good">' + L({
        es:'Tres ecuaciones equilibradas. En las tres cambio la manera de agrupar los átomos, nunca su cantidad: por eso los números de adelante se ajustan y los de abajo jamas se tocan.',
        en:'Three balanced equations. In all three the way the atoms are grouped changed, never how many there are: that is why the numbers in front get adjusted and the ones below are never touched.'
      }) + '</div>';
  }

  host.addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!b) return;
    var act = b.getAttribute('data-act');
    if (act === 'next'){
      st.r++;
      if (st.r > 2){ done(); return; }
      st.over = false;
      startRound();
      return;
    }
    if (act.charAt(0) === 'm' || act.charAt(0) === 'p'){
      if (st.solved || st.over) return;
      var i = parseInt(act.slice(1), 10);
      st.co[i] = Math.max(1, Math.min(9, st.co[i] + (act.charAt(0) === 'p' ? 1 : -1)));
      render('', '');
      return;
    }
    if (act !== 'chk') return;
    var g = firstGap();
    if (!g){
      var gg = st.co[0];
      for (var k = 1; k < st.co.length; k++) gg = gcd2(gg, st.co[k]);
      if (gg > 1){
        st.tries++;
        render('warm', L({
          es:'Los dos lados ya tienen los mismos átomos, pero todos tus números se pueden dividir entre ' + gg + '. Busca el juego más pequeño.',
          en:'Both sides already hold the same atoms, but all your numbers can be divided by ' + gg + '. Look for the smallest set.'
        }));
        return;
      }
      st.solved = true;
      render('good', L({
        es:'Equilibrada. Ni un solo átomo apareció ni desaparecio: solo cambiaron de compañía.',
        en:'Balanced. Not a single atom appeared or disappeared: they only changed company.'
      }));
      return;
    }
    st.tries++;
    if (st.tries >= 3){
      st.co = ROUNDS[st.r].sol.slice();
      st.over = true;
      render('warm', L({
        es:'Estos son los números que la dejan pareja. Revisa la tabla: cada elemento quedó con la misma cuenta en los dos lados.',
        en:'These are the numbers that even it out. Check the table: every element ends with the same count on both sides.'
      }));
      return;
    }
    render('miss', (g.l > g.r
      ? L({ es:'Aún no. Sobran ', en:'Not yet. There are ' }) + (g.l - g.r) + L({ es:' átomos de ' + g.el + ' del lado izquierdo: sube un número de la derecha.', en:' extra ' + g.el + ' atoms on the left side: raise a number on the right.' })
      : L({ es:'Aún no. Sobran ', en:'Not yet. There are ' }) + (g.r - g.l) + L({ es:' átomos de ' + g.el + ' del lado derecho: sube un número de la izquierda.', en:' extra ' + g.el + ' atoms on the right side: raise a number on the left.' })));
  });

  startRound();
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 4 :: balanza del frasco cerrado
   Una reacción dentro de un recipiente sellado con una masa oculta. El
   deslizador mueve esa masa y la balanza se inclina en tiempo real hacia el
   lado más pesado. El estudiante busca la horizontal; a la tercera
   verificacion fallida se revela la masa y por que es la única posible.
   ══════════════════════════════════════════════════════════════════════════ */
var FRASCOS = [
  { case:{ es:'bicarbonato y vinagre sellados dentro de un matraz con tapón', en:'baking soda and vinegar sealed inside a stoppered flask' },
    ra:{ es:'bicarbonato', en:'baking soda' }, rb:{ es:'vinagre', en:'vinegar' },
    pa:{ es:'líquido final', en:'final liquid' }, pb:{ es:'gas atrapado', en:'trapped gas' } },
  { case:{ es:'una viruta de hierro que arde dentro de una ampolleta cerrada con aire', en:'iron filings burning inside a sealed bulb with air' },
    ra:{ es:'viruta de hierro', en:'iron filings' }, rb:{ es:'oxígeno del aire', en:'oxygen from the air' },
    pa:{ es:'óxido sólido', en:'solid oxide' }, pb:{ es:'hierro sin reaccionar', en:'unreacted iron' } },
  { case:{ es:'una pastilla efervescente dentro de una botella tapada con agua', en:'an effervescent tablet inside a capped bottle with water' },
    ra:{ es:'pastilla', en:'tablet' }, rb:{ es:'agua', en:'water' },
    pa:{ es:'disolución final', en:'final solution' }, pb:{ es:'gas dentro de la botella', en:'gas inside the bottle' } }
];

function wFrasco(rng, host){
  var wr = seededRng('frasco' + Math.floor(rng() * 1000000));
  var st = { r:0, tries:0, over:false, solved:false, guess:0, d:null };

  function build(){
    var c = FRASCOS[Math.floor(wr() * FRASCOS.length)];
    var pa = 12 + Math.floor(wr() * 15);
    var pb = 4 + Math.floor(wr() * 8);
    var total = pa + pb;
    var ra = 5 + Math.floor(wr() * (total - 8));
    var rb = total - ra;
    var slot = Math.floor(wr() * 4);
    var vals = [ra, rb, pa, pb];
    st.d = { c:c, vals:vals, slot:slot, target:vals[slot], total:total };
    st.guess = 0; st.tries = 0; st.over = false; st.solved = false;
  }

  function shown(i){ return i === st.d.slot ? st.guess : st.d.vals[i]; }

  function sums(){
    return { l: shown(0) + shown(1), r: shown(2) + shown(3) };
  }

  function line(label, i){
    var v = shown(i);
    var mark = (i === st.d.slot && !st.solved && !st.over) ? ' ?' : '';
    return '<div>' + label + ': <b>' + gramos(v) + '</b>' + mark + '</div>';
  }

  function paint(cls, msg){
    var d = st.d, s = sums(), diff = s.r - s.l;
    var ang = Math.max(-11, Math.min(11, diff * 1.6));
    var beam = host.querySelector('[data-r="beam"]');
    if (beam) beam.style.transform = 'rotate(' + ang.toFixed(1) + 'deg)';
    var read = host.querySelector('[data-r="read"]');
    if (read) read.innerHTML = '<span>' + L({ es:'Antes: ', en:'Before: ' }) + gramos(s.l) + '</span><span>' + L({ es:'Después: ', en:'After: ' }) + gramos(s.r) + '</span>';
    var lr = host.querySelector('[data-r="lreac"]');
    if (lr) lr.innerHTML = line(L(d.c.ra), 0) + line(L(d.c.rb), 1);
    var lp = host.querySelector('[data-r="lprod"]');
    if (lp) lp.innerHTML = line(L(d.c.pa), 2) + line(L(d.c.pb), 3);
    var dl = host.querySelector('[data-r="delta"]');
    if (dl) dl.innerHTML = diff === 0
      ? L({ es:'En equilibrio', en:'In balance' })
      : (diff > 0 ? L({ es:'Pesa más el final: ', en:'The end weighs more: ' }) : L({ es:'Pesa más el inicio: ', en:'The start weighs more: ' })) + gramos(Math.abs(diff));
    var fb = host.querySelector('[data-r="fb"]');
    if (fb){
      fb.className = 'gw-fb ' + (cls || '');
      fb.innerHTML = msg || (diff === 0
        ? L({ es:'Los dos lados pesan lo mismo. Verifica para confirmarlo.', en:'Both sides weigh the same. Check to confirm it.' })
        : (diff > 0
          ? L({ es:'Te pasaste por ', en:'You are over by ' }) + gramos(diff) + L({ es:': baja el valor.', en:': lower the value.' })
          : L({ es:'Te faltan ', en:'You are short by ' }) + gramos(-diff) + L({ es:': sube el valor.', en:': raise the value.' })));
    }
    var btn = host.querySelector('[data-r="btn"]');
    if (btn) btn.innerHTML = (st.solved || st.over)
      ? '<button class="gw-btn go" data-act="next">' + (st.r >= 2 ? L({ es:'Terminar', en:'Finish' }) : L({ es:'Otro frasco', en:'Another flask' })) + '</button>'
      : '<button class="gw-btn go" data-act="chk">' + L({ es:'Verificar', en:'Check' }) + '</button>';
    var sl = host.querySelector('[data-r="sl"]');
    if (sl) sl.disabled = !!(st.solved || st.over);
  }

  function render(cls, msg){
    var d = st.d;
    host.innerHTML =
      '<div class="gw-h iw-tag">' + L({ es:'Balanza del frasco cerrado', en:'Sealed flask balance' }) + '</div>' +
      '<div class="gw-mini iw-sub">' + L({
        es:'Mueve el deslizador hasta que la balanza quede horizontal. La barra se inclina hacia el lado que pesa más y los totales se recalculan mientras la mueves.',
        en:'Move the slider until the balance lies flat. The bar tips towards the heavier side and the totals are recalculated while you move it.'
      }) + '</div>' +
      '<div class="gw-prog">' + (st.r + 1) + ' / 3</div>' +
      '<div class="gw-q">' + L({ es:'Reacción sellada: ', en:'Sealed reaction: ' }) + L(d.c.case) + '</div>' +
      '<div class="ms-stage">' +
        '<div class="ms-beam" data-r="beam">' +
          '<div class="ms-pan lft"></div><div class="ms-pan rgt"></div>' +
        '</div>' +
        '<div class="ms-post"></div>' +
      '</div>' +
      '<div class="ms-read" data-r="read"></div>' +
      '<div class="gw-lbl">' + L({ es:'Lo que entro al frasco', en:'What went into the flask' }) + '</div>' +
      '<div class="ms-list" data-r="lreac"></div>' +
      '<div class="gw-lbl">' + L({ es:'Lo que quedó dentro al final', en:'What was left inside at the end' }) + '</div>' +
      '<div class="ms-list" data-r="lprod"></div>' +
      '<div class="ms-delta" data-r="delta"></div>' +
      '<input class="ms-sl" type="range" min="0" max="' + (d.total + 6) + '" step="1" value="' + st.guess + '" data-r="sl">' +
      '<div class="gw-row" data-r="btn"></div>' +
      '<div class="gw-fb" data-r="fb"></div>';
    var sl = host.querySelector('[data-r="sl"]');
    if (sl) sl.addEventListener('input', function(){
      st.guess = parseInt(sl.value, 10) || 0;
      paint('', '');
    });
    paint(cls, msg || L({ es:'Nada entra y nada sale del frasco: usa eso para decidir el valor oculto.', en:'Nothing enters and nothing leaves the flask: use that to decide the hidden value.' }));
  }

  function done(){
    host.innerHTML =
      '<div class="gw-h iw-tag">' + L({ es:'Balanza del frasco cerrado', en:'Sealed flask balance' }) + '</div>' +
      '<div class="gw-fb good">' + L({
        es:'Tres frascos y siempre el mismo resultado: la masa del final es igual a la del inicio. Solo hay un valor que deja la balanza horizontal, y por eso la masa oculta se puede calcular sin abrir el frasco.',
        en:'Three flasks and always the same result: the mass at the end equals the mass at the start. There is only one value that leaves the balance flat, and that is why the hidden mass can be worked out without opening the flask.'
      }) + '</div>';
  }

  host.addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!b) return;
    var act = b.getAttribute('data-act');
    if (act === 'next'){
      st.r++;
      if (st.r > 2){ done(); return; }
      build(); render('', '');
      return;
    }
    if (act !== 'chk') return;
    var s = sums(), diff = s.r - s.l;
    if (diff === 0){
      st.solved = true;
      render('good', L({
        es:'Horizontal. La masa que estaba escondida es ' + gramos(st.d.target) + ', porque el total no cambio durante la reacción.',
        en:'Flat. The hidden mass is ' + gramos(st.d.target) + ', because the total did not change during the reaction.'
      }));
      return;
    }
    st.tries++;
    if (st.tries >= 3){
      st.guess = st.d.target; st.over = true;
      render('warm', L({
        es:'El valor era ' + gramos(st.d.target) + '. Suma lo que entro y lo que quedó: los dos totales tienen que coincidir.',
        en:'The value was ' + gramos(st.d.target) + '. Add up what went in and what was left: the two totals have to match.'
      }));
      return;
    }
    render('miss', diff > 0
      ? L({ es:'Aún no. El lado del final pesa ' + gramos(diff) + ' de más.', en:'Not yet. The end side weighs ' + gramos(diff) + ' too much.' })
      : L({ es:'Aún no. Al lado del final le faltan ' + gramos(-diff) + '.', en:'Not yet. The end side is short by ' + gramos(-diff) + '.' }));
  });

  build();
  render('', '');
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 5 :: termómetro de la reacción
   El estudiante predice con un deslizador que le pasa a la temperatura del
   entorno cercano. La columna del termómetro sube o baja mientras arrastra,
   con color cálido o frío. Solo importa el sentido; a la tercera fallida se
   revela hacia donde viaja la energía.
   ══════════════════════════════════════════════════════════════════════════ */
var TERMOS = [
  { case:{ es:'Se enciende el gas de la estufa y la olla que está encima empieza a calentarse.', en:'The stove gas is lit and the pot on top starts to heat up.' },
    exo:true, why:{ es:'la combustión entrega energía al entorno: por eso la flama calienta la olla y el aire alrededor', en:'combustion delivers energy to the surroundings: that is why the flame heats the pot and the air around it' } },
  { case:{ es:'Se rompe la bolsita interna de una compresa instantánea y el paquete se pone helado sobre el golpe.', en:'The inner pouch of an instant cold pack is broken and the pack turns icy on the bruise.' },
    exo:false, why:{ es:'la mezcla toma energía de lo que la rodea, incluida tu piel, y por eso todo baja de temperatura', en:'the mixture takes energy from its surroundings, your skin included, and that is why everything drops in temperature' } },
  { case:{ es:'Se agrega agua a la cal viva de una obra y el bote se calienta hasta que no se puede sostener.', en:'Water is added to the quicklime on a building site and the bucket heats up until it cannot be held.' },
    exo:true, why:{ es:'la reacción libera energía y el recipiente y el aire cercano la reciben', en:'the reaction releases energy and the container and the nearby air receive it' } },
  { case:{ es:'La masa del pan solo se transforma en pan si el horno le mantiene calor durante media hora.', en:'Bread dough only turns into bread if the oven keeps heat on it for half an hour.' },
    exo:false, why:{ es:'las transformaciones del horneado necesitan energía constante: sin ella no ocurren', en:'the transformations of baking need constant energy: without it they do not happen' } },
  { case:{ es:'Se agita un calentador químico de manos y en pocos segundos entibia los dedos.', en:'A chemical hand warmer is shaken and in a few seconds it warms the fingers.' },
    exo:true, why:{ es:'el hierro del interior se oxida rápido y esa reacción entrega energía a tus manos', en:'the iron inside oxidizes quickly and that reaction hands energy over to your fingers' } },
  { case:{ es:'La hoja de una planta usa la luz del sol para fabricar azúcares a partir de agua y de dióxido de carbono.', en:'A plant leaf uses sunlight to build sugars out of water and carbon dioxide.' },
    exo:false, why:{ es:'sin la energía de la luz esa transformación no avanza: la reacción la absorbe y la guarda en los enlaces del azúcar', en:'without the energy of light that transformation does not go ahead: the reaction absorbs it and stores it in the bonds of the sugar' } }
];

function wTermo(rng, host){
  var wr = seededRng('term' + Math.floor(rng() * 1000000));
  var ROUNDS = shuffle(TERMOS, wr).slice(0, 3);
  var st = { r:0, v:0, tries:0, solved:false, over:false };

  function paint(cls, msg){
    var merc = host.querySelector('[data-r="merc"]');
    if (merc){
      merc.className = 'th-merc ' + (st.v > 0 ? 'up' : 'down');
      merc.style.height = (50 + st.v * 5) + '%';
    }
    var val = host.querySelector('[data-r="val"]');
    if (val) val.textContent = (st.v > 0 ? '+' : '') + st.v + ' °C';
    var note = host.querySelector('[data-r="note"]');
    if (note) note.textContent = st.v === 0
      ? L({ es:'Sin cambio: todavia no te decides', en:'No change: you have not decided yet' })
      : (st.v > 0 ? L({ es:'El entorno se calienta', en:'The surroundings warm up' }) : L({ es:'El entorno se enfria', en:'The surroundings cool down' }));
    var fb = host.querySelector('[data-r="fb"]');
    if (fb){
      fb.className = 'gw-fb ' + (cls || '');
      fb.innerHTML = msg || L({ es:'Solo importa el sentido del cambio, no el número exacto.', en:'Only the direction of the change matters, not the exact number.' });
    }
    var btn = host.querySelector('[data-r="btn"]');
    if (btn) btn.innerHTML = (st.solved || st.over)
      ? '<button class="gw-btn go" data-act="next">' + (st.r >= 2 ? L({ es:'Terminar', en:'Finish' }) : L({ es:'Siguiente caso', en:'Next case' })) + '</button>'
      : '<button class="gw-btn go" data-act="chk">' + L({ es:'Verificar', en:'Check' }) + '</button>';
    var sl = host.querySelector('[data-r="sl"]');
    if (sl){ sl.value = st.v; sl.disabled = !!(st.solved || st.over); }
  }

  function render(cls, msg){
    var c = ROUNDS[st.r];
    host.innerHTML =
      '<div class="gw-h iw-tag">' + L({ es:'Termómetro de la reacción', en:'Reaction thermometer' }) + '</div>' +
      '<div class="gw-mini iw-sub">' + L({
        es:'Arrastra el deslizador para predecir qué le ocurre a la temperatura de lo que rodea a la reacción. La columna sigue tu predicción mientras la mueves.',
        en:'Drag the slider to predict what happens to the temperature of whatever surrounds the reaction. The column follows your prediction as you move it.'
      }) + '</div>' +
      '<div class="gw-prog">' + (st.r + 1) + ' / 3</div>' +
      '<div class="th-case">' + L(c.case) + '</div>' +
      '<div class="th-wrap">' +
        '<div class="th-tube"><div class="th-merc down" data-r="merc" style="height:50%"></div><div class="th-mid"></div></div>' +
        '<div><div class="th-val" data-r="val"></div>' +
        '<div class="th-note" data-r="note"></div></div>' +
      '</div>' +
      '<input class="th-sl" type="range" min="-8" max="8" step="1" value="' + st.v + '" data-r="sl">' +
      '<div class="gw-row" data-r="btn"></div>' +
      '<div class="gw-fb" data-r="fb"></div>';
    var sl = host.querySelector('[data-r="sl"]');
    if (sl) sl.addEventListener('input', function(){
      st.v = parseInt(sl.value, 10) || 0;
      paint('', '');
    });
    paint(cls, msg);
  }

  function done(){
    host.innerHTML =
      '<div class="gw-h iw-tag">' + L({ es:'Termómetro de la reacción', en:'Reaction thermometer' }) + '</div>' +
      '<div class="gw-fb good">' + L({
        es:'Tres casos leídos por su energía. Cuando la reacción entrega energía el entorno se calienta; cuando la reacción la necesita, la toma del entorno y todo se enfria.',
        en:'Three cases read through their energy. When the reaction hands energy over, the surroundings warm up; when the reaction needs it, it takes it from the surroundings and everything cools down.'
      }) + '</div>';
  }

  host.addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!b) return;
    var act = b.getAttribute('data-act');
    if (act === 'next'){
      st.r++;
      if (st.r > 2){ done(); return; }
      st.v = 0; st.tries = 0; st.solved = false; st.over = false;
      render('', '');
      return;
    }
    if (act !== 'chk') return;
    var c = ROUNDS[st.r];
    if (st.v === 0){
      render('warm', L({ es:'Mueve la columna hacia arriba o hacia abajo antes de verificar.', en:'Move the column up or down before checking.' }));
      return;
    }
    if ((st.v > 0) === c.exo){
      st.solved = true;
      render('good', L({ es:'Así es: ', en:'That is it: ' }) + L(c.why) + '.');
      return;
    }
    st.tries++;
    if (st.tries >= 3){
      st.v = c.exo ? 5 : -5; st.over = true;
      render('warm', L({ es:'La columna va hacia el otro lado: ', en:'The column goes the other way: ' }) + L(c.why) + '.');
      return;
    }
    render('miss', c.exo
      ? L({ es:'Vuelve a intentar. Pregunta quién está recibiendo energía en la escena: si algo cercano se calienta, la energía sale de la reacción.',
            en:'Try again. Ask who is receiving energy in the scene: if something nearby heats up, the energy is coming out of the reaction.' })
      : L({ es:'Vuelve a intentar. Pregunta de dónde saldría la energía que la transformación necesita para ocurrir.',
            en:'Try again. Ask where the energy that the transformation needs to happen would come from.' }));
  });

  render('', '');
}

function wCuaderno(rng, host){
  var PROMPTS = [
    { es:'Elige una reacción química que ocurra en tu casa y describe qué sustancias había antes, qué apareció después y cuál fue la señal que te permitió darte cuenta.',
      en:'Choose a chemical reaction that happens in your home and describe what substances were there before, what appeared afterwards and what signal let you notice it.' },
    { es:'Dibuja el antes y el después de una reacción que hayas visto y marca con una flecha lo que cambio y con un círculo lo que permanecio.',
      en:'Draw the before and after of a reaction you have seen and mark with an arrow what changed and with a circle what stayed the same.' },
    { es:'Piensa en una reacción que libere energía y en una que la necesite dentro de tu colonia, y explica qué se aprovecha de cada una.',
      en:'Think of one reaction that releases energy and one that needs it somewhere in your neighbourhood, and explain what is taken advantage of in each one.' },
    { es:'Explica con tus palabras por que la ceniza de una fogata pesa menos que la leña sin que se haya destruido materia.',
      en:'Explain in your own words why the ash of a campfire weighs less than the firewood without any matter having been destroyed.' }
  ];
  var p = PROMPTS[Math.floor(rng() * PROMPTS.length)];
  host.innerHTML =
    '<div class="gw-h iw-tag">' + L({ es:'Cuaderno de campo', en:'Field notebook' }) + '</div>' +
    '<div class="reflect-prompt iw-sub">' + L(p) + '</div>' +
    '<div class="wtabs">' +
      '<button class="wtab active" data-act="ttype">⌨️ ' + L({ es:'Escribir', en:'Write' }) + '</button>' +
      '<button class="wtab" data-act="tdraw">✏️ ' + L({ es:'Dibujar', en:'Sketch' }) + '</button>' +
    '</div>' +
    '<div class="wpanel active" id="cua_type"><textarea class="wtextarea" id="cuaTa" placeholder="' + L({ es:'Tu observación...', en:'Your observation...' }) + '"></textarea></div>' +
    '<div class="wpanel" id="cua_draw"><div class="cvwrap">' +
      '<canvas class="dcanvas" id="cuaCv"></canvas>' +
      '<div class="ctoolbar">' +
        '<button class="tbtn2 bpen on">' + t('btn-pen') + '</button>' +
        '<button class="tbtn2 bmarker">' + t('btn-marker') + '</button>' +
        '<button class="tbtn2 beraser">' + t('btn-eraser') + '</button>' +
        '<div class="cdot sel" data-color="#0f2d5a" style="background:#0f2d5a"></div>' +
        '<div class="cdot" data-color="#1a1a16" style="background:#1a1a16"></div>' +
        '<div class="cdot" data-color="#8b2500" style="background:#8b2500"></div>' +
        '<div class="cdot" data-color="#1d4e89" style="background:#1d4e89"></div>' +
        '<button class="clrbtn">' + t('btn-clear') + '</button>' +
      '</div>' +
    '</div></div>' +
    '<div class="gw-row"><button class="gw-btn go" data-act="save">' + L({ es:'Guardar en el cuaderno', en:'Save to the notebook' }) + '</button></div>' +
    '<div class="gw-fb" data-r="fb"></div>';

  host.addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!b) return;
    var act = b.getAttribute('data-act');
    if (act === 'ttype' || act === 'tdraw'){
      var which = act === 'ttype' ? 'type' : 'draw';
      ['type', 'draw'].forEach(function(k){
        var el = document.getElementById('cua_' + k);
        if (el) el.classList.toggle('active', k === which);
      });
      host.querySelectorAll('.wtab').forEach(function(x){ x.classList.remove('active'); });
      b.classList.add('active');
      if (which === 'draw') setTimeout(function(){
        var c = document.getElementById('cuaCv');
        if (c && !c.width) initCanvas(c);
      }, 60);
      return;
    }
    if (act !== 'save') return;
    var fb = host.querySelector('[data-r="fb"]');
    fb.className = 'gw-fb good';
    fb.innerHTML = L({
      es:'Guardado. Observar y describir con precisión es la mitad del trabajo de la química: aquí no hay una sola respuesta correcta.',
      en:'Saved. Observing and describing precisely is half the work of chemistry: there is no single right answer here.'
    });
  });
}
