      options:{ es:[
        'Reparar la iluminación, abrir ese corredor con actividades en el receso y turnar el acompañamiento de docentes y estudiantes, con revisión mensual.',
        'Organizar una jornada contra la violencia al inicio del ciclo, con carteles elaborados por cada grupo y un mensaje de bienvenida en el auditorio.',

    { title:{ es:'La acción que toca la causa', en:'The action that hits the cause' }, showWork:false,
      stmt:{ es:'El comité de un grupo documenta que los pleitos empiezan de noche en el chat del salón y llegan al aula a la mañana siguiente, y que ninguna de las personas afectadas sabe a quién avisar cuando eso ocurre. ¿Cuál acción se dirige a la causa que muestra el diagnóstico?',

             en:'The diagnosis points to two things at once: where the conflict is born and what the person suffering it lacks. Look for the action that handles both.' },
      explanation:{ es:'El diagnóstico muestra que el conflicto nace en el chat y que nadie sabe a quién avisar. Acordar reglas del propio chat y abrir un canal de reporte con seguimiento actúa sobre las dos cosas. Prohibir teléfonos en el plantel no alcanza lo que ocurre de noche fuera de él, la lectura semanal no cambia la dinámica del chat, y pedir que lo abandonen deja sin regla ni canal a quienes se queden.',

      hint:{ es:'Compara cada dato con lo que promete el objetivo: fíjate si habla del esfuerzo realizado o del resultado buscado.',
             en:'Compare each figure with what the objective promises: notice whether it speaks of the effort made or of the result sought.' },
      explanation:{ es:'Un indicador sirve si mide justo lo que el objetivo promete y se puede comparar con un punto de partida. Los incidentes de ese corredor, mes a mes y frente al ciclo anterior, hacen ambas cosas. Carteles y personas asistentes miden actividad, no resultado. Las sanciones de todo el plantel mezclan lugares distintos y pueden subir porque se reporta más, no porque haya menos daño.',
                    en:'An indicator works if it measures exactly what the objective promises and can be compared with a starting point. The incidents in that corridor, month by month and against last year, do both. Posters and attendees measure activity, not result. Sanctions across the whole school mix different places and may rise because more is reported, not because there is less harm.' } },
    { title:{ es:'Qué mide de verdad', en:'What it really measures' }, showWork:false,
      stmt:{ es:'El objetivo acordado dice: lograr que cualquier estudiante sepa a quién acudir y qué pasos seguir cuando presencia una agresión. El comité debe elegir con qué dato comprobará si lo logró. ¿Cuál indicador mide ese objetivo?',
             en:'The agreed objective says: get every student to know whom to turn to and which steps to follow when they witness an aggression. The committee must choose which figure will prove whether it succeeded. Which indicator measures that objective?' },
      options:{ es:[
        'La proporción de estudiantes que, en una consulta anónima al final del ciclo, describe correctamente a quién acudir y qué pasos seguir.',
        'El número de trípticos con la ruta de atención que el comité repartió en los salones durante el ciclo escolar completo.',
        'La cantidad de reuniones que el comité sostuvo con la dirección del plantel para difundir la ruta de atención entre el personal.',
        'El total de reportes recibidos en el buzón, sin distinguir de qué grupo provienen ni sobre qué tema fueron presentados.' ],
        en:[
        'The share of students who, in an anonymous survey at the end of the year, correctly describe whom to turn to and which steps to follow.',
        'The number of leaflets with the response route that the committee handed out in classrooms over the whole school year.',
        'The number of meetings the committee held with the school office to spread the response route among the staff.',
        'The total of reports received in the mailbox, without distinguishing which class they come from or what they are about.' ] },
      correct:0,
      hint:{ es:'El objetivo habla de lo que las personas saben, así que revisa cuál de los datos les pregunta a ellas.',
             en:'The objective speaks about what people know, so check which of the figures actually asks them.' },
      explanation:{ es:'El objetivo promete conocimiento, así que el dato tiene que venir de las propias estudiantes: una consulta anónima muestra cuántas pueden describir la ruta. Trípticos y reuniones miden lo que hizo el comité, no lo que aprendió el grupo. El total de reportes puede subir o bajar por muchas razones y no dice si la ruta se conoce.',
                    en:'The objective promises knowledge, so the figure has to come from the students themselves: an anonymous survey shows how many can describe the route. Leaflets and meetings measure what the committee did, not what the class learned. The total of reports can rise or fall for many reasons and says nothing about whether the route is known.' } }
  ], rng), rng);

  /* ── CONCEPTO 5 ─────────────────────────────────────────────── */
  addSection(S('CONCEPTO 5','CONCEPT 5'),
    '<h2>' + S('Tejido social: lo que queda cuando termina la campaña','Social fabric: what remains when the campaign ends') + '</h2>' +
    '<p>' + S('El tejido social es la red de relaciones de confianza y cooperación que sostiene a una comunidad. Se fortalece cuando personas de distintos grupos comparten un espacio, cumplen los acuerdos que toman y saben a quién acudir cuando algo se rompe. Se debilita cuando cada quien resuelve por su cuenta y la desconfianza vuelve razonable el silencio.',
              'The social fabric is the network of trust and cooperation that holds a community together. It grows stronger when people from different groups share a space, keep the agreements they make and know whom to turn to when something breaks. It weakens when everyone solves things on their own and mistrust makes silence look reasonable.') + '</p>' +
    '<p>' + S('Por eso una estrategia se mide también por lo que deja instalado: acuerdos escritos, responsabilidades repartidas, relevo previsto y formación para quienes llegan. Y por eso colaborar con la escuela, la comunidad, el país y redes de otros países aporta cuando lo que se intercambia es experiencia evaluada, que cada lugar adapta a su propio diagnóstico.',
              'That is why a strategy is also measured by what it leaves installed: written agreements, shared responsibilities, a planned handover and training for those who arrive. And that is why collaborating with the school, the community, the country and networks in other countries pays off when what is exchanged is evaluated experience, which each place adapts to its own diagnosis.') + '</p>' +
    '');
  buildCuaderno(rng);

  /* ── PROBLEMA 9 ─────────────────────────────────────────────── */
  addProblem(pick([
    { title:{ es:'Leer los resultados', en:'Reading the results' }, showWork:false,
      stmt:{ es:'Al terminar el ciclo, la evaluación muestra que la estrategia llegó solo a un grado, que los incidentes se mantuvieron igual y que el buzón de reportes sí empezó a usarse. ¿Qué decisión sostiene el trabajo del comité?',
             en:'At the end of the year, the evaluation shows that the strategy reached only one grade level, that incidents stayed the same and that the reporting mailbox did start being used. Which decision sustains the work of the committee?' },
      options:{ es:[
        'Presentar el resultado completo, indagar por qué la estrategia no alcanzó a los demás grados y conservar el buzón mientras se ajusta lo demás.',
        'Presentar únicamente el aumento en el uso del buzón, para que la comunidad escolar mantenga la confianza en el trabajo del comité.',
        'Suspender la estrategia completa, ya que un resultado sin descenso de incidentes demuestra que el diagnóstico inicial estaba equivocado.',
        'Repetir el mismo plan sin cambios el próximo ciclo, confiando en que los resultados aparecerán con el paso del tiempo suficiente.' ],
        en:[
        'Presenting the full result, looking into why the strategy did not reach the other grades and keeping the mailbox while the rest is adjusted.',
        'Presenting only the rise in mailbox use, so the school community keeps its confidence in the work of the committee.',
        'Suspending the whole strategy, since a result with no drop in incidents proves that the initial diagnosis was wrong.',
        'Repeating the same plan unchanged next year, trusting that results will appear once enough time has passed.' ] },
      correct:0,
      hint:{ es:'Una evaluación sirve para decidir qué se conserva, qué se ajusta y qué se abandona. Revisa uno por uno los tres datos.',
             en:'An evaluation is there to decide what is kept, what is adjusted and what is dropped. Go through the three figures one by one.' },
      explanation:{ es:'La evaluación honesta reporta lo que funcionó y lo que no. Aquí hay una señal buena, el buzón en uso, y dos problemas, la cobertura y los incidentes sin cambio. Ocultar datos rompe la confianza que la estrategia quería construir, suspender todo tira lo que ya funcionaba, y repetir sin cambios ignora la información que la evaluación acaba de dar.',
                    en:'An honest evaluation reports what worked and what did not. Here there is one good signal, the mailbox in use, and two problems, the coverage and the unchanged incidents. Hiding data breaks the very trust the strategy wanted to build, suspending everything throws away what already worked, and repeating unchanged ignores the information the evaluation has just provided.' } },
    { title:{ es:'Señales de un tejido más fuerte', en:'Signs of a stronger fabric' }, showWork:false,
      stmt:{ es:'Dos escuelas afirman haber fortalecido su tejido social. En la primera, un festival reunió a mucha gente un sábado y llenó las redes de fotografías. En la segunda, familias, docentes y estudiantes sostienen un comité mixto que atiende casos cada mes y los acuerdos que toma se cumplen. ¿Qué señal indica que el tejido social se fortaleció?',
             en:'Two schools claim to have strengthened their social fabric. In the first, a festival gathered many people on a Saturday and filled social media with photographs. In the second, families, teachers and students sustain a joint committee that handles cases every month and the agreements it reaches are kept. Which sign indicates that the social fabric got stronger?' },
      options:{ es:[
        'Que personas de distintos grupos sostienen en el tiempo un espacio común donde los problemas se atienden con acuerdos que se cumplen.',
        'Que la convocatoria de un solo día haya reunido a muchas personas y haya tenido una difusión amplia en las redes sociales del plantel.',
        'Que la escuela cuente con un reglamento actualizado donde se describan con detalle todas las conductas que pueden ser sancionadas.',
        'Que el número de conflictos reportados haya bajado a cero desde que se anunciaron las nuevas actividades de convivencia escolar.' ],
        en:[
        'That people from different groups sustain over time a shared space where problems are handled with agreements that are kept.',
        'That a single day event gathered many people and had wide circulation on the social media accounts of the school.',
        'That the school has updated rules describing in detail every conduct that can be sanctioned.',
        'That the number of reported conflicts has dropped to zero since the new coexistence activities were announced.' ] },
      correct:0,
      hint:{ es:'Pregúntate qué queda en pie el lunes siguiente, y qué relaciones tuvieron que existir para que eso se sostenga.',
             en:'Ask what is still standing the following Monday, and what relationships had to exist for that to hold.' },
      explanation:{ es:'El tejido social son relaciones de confianza y cooperación que duran. Un festival puede ser un buen inicio, pero por sí solo no crea vínculos que resistan el siguiente conflicto. Un espacio mixto y sostenido, con acuerdos que se cumplen, sí lo muestra. Un reglamento detallado no garantiza relación alguna, y cero reportes suele indicar que la gente dejó de reportar.',
                    en:'The social fabric is trust and cooperation that last. A festival can be a good start, but on its own it does not create bonds that survive the next conflict. A joint, sustained space with agreements that are kept does show it. Detailed rules guarantee no relationship at all, and zero reports usually means people stopped reporting.' } }
  ], rng), rng);

  /* ── PROBLEMA 10 ────────────────────────────────────────────── */
  addProblem(pick([
    { title:{ es:'Que no dependa de una persona', en:'So it does not depend on one person' }, showWork:false,
      stmt:{ es:'La estrategia de convivencia de una secundaria funciona, pero la sostienen tres estudiantes de tercero que están por egresar y una maestra que pidió cambio de plantel. ¿Qué decisión hace que la estrategia continúe?',
             en:'The coexistence strategy of a secondary school works, but it is held up by three third year students about to graduate and a teacher who requested a transfer. Which decision makes the strategy continue?' },
      options:{ es:[
        'Dejar por escrito la ruta y las responsabilidades en los acuerdos del plantel, con un comité que se renueva cada ciclo y forma a quienes entran.',
        'Pedir a los tres estudiantes que sigan coordinando el comité a distancia después de haber egresado de la secundaria.',
        'Guardar todos los materiales y los registros en el chat del comité para que el siguiente grupo los consulte cuando los necesite.',
        'Repetir cada año la misma jornada que organizó ese grupo, respetando la fecha y el programa con los que se realizó la primera vez.' ],
        en:[
        'Putting the route and the responsibilities in writing in the school agreements, with a committee renewed each year that trains newcomers.',
        'Asking the three students to keep coordinating the committee remotely after graduating from the school.',
        'Storing all the materials and records in the committee chat so the next group can look them up when they need them.',
        'Repeating the same event every year exactly as that group organized it, keeping the date and the programme of the first time.' ] },
      correct:0,
      hint:{ es:'Pregúntate qué parte de la estrategia sobrevive si mañana ninguna de las personas actuales estuviera en la escuela.',
             en:'Ask which part of the strategy survives if tomorrow none of the current people were at the school.' },
      explanation:{ es:'Una estrategia se sostiene cuando deja de depender de quienes la iniciaron: reglas escritas, responsabilidades asignadas, relevo previsto y formación para quien llega. Coordinar a distancia y guardar archivos en un chat mantienen el conocimiento en manos de unas cuantas personas, y repetir la jornada conserva el evento pero no la capacidad de atender lo que vaya surgiendo.',
                    en:'A strategy holds up when it stops depending on those who started it: written rules, assigned responsibilities, a planned handover and training for newcomers. Coordinating remotely and storing files in a chat keep the knowledge in the hands of a few people, and repeating the event preserves the event but not the ability to handle whatever comes up.' } },
    { title:{ es:'Sumar sin copiar', en:'Joining without copying' }, showWork:false,
      stmt:{ es:'Un colectivo estudiantil recibe la invitación de una red de escuelas de varios países para trabajar juntas contra la violencia. Su propio diagnóstico señala un problema distinto del que atiende la campaña de esa red. ¿Qué decisión aprovecha mejor esa colaboración?',
             en:'A student collective receives an invitation from a network of schools in several countries to work together against violence. Its own diagnosis points to a problem different from the one the network campaign addresses. Which decision makes the best use of that collaboration?' },
      options:{ es:[
        'Participar en la red para intercambiar lo que cada escuela midió, y adaptar a su propio diagnóstico las prácticas que allá dieron resultado.',
        'Reproducir la campaña de la red tal como está diseñada, ya que fue puesta a prueba por escuelas de varios países distintos.',
        'Rechazar la invitación hasta que su propio problema quede resuelto, para no distraer al colectivo de lo que ya venía haciendo.',
        'Adoptar el nombre y la imagen de la campaña internacional y mantener sin cambios las actividades que el colectivo ya realizaba.' ],
        en:[
        'Taking part in the network to exchange what each school measured, and adapting to its own diagnosis the practices that worked there.',
        'Reproducing the network campaign exactly as designed, since it was tested by schools in several different countries.',
        'Turning down the invitation until its own problem is solved, so the collective is not distracted from what it was already doing.',
        'Adopting the name and the image of the international campaign while keeping unchanged the activities the collective already ran.' ] },
      correct:0,
      hint:{ es:'Distingue entre tomar prestada una campaña completa y tomar prestado lo aprendido para resolver el problema propio.',
             en:'Tell apart borrowing a whole campaign from borrowing what was learned in order to solve your own problem.' },
      explanation:{ es:'Colaborar a escala internacional aporta cuando lo que viaja es el aprendizaje: qué se intentó, qué se midió y qué resultó. Copiar la campaña completa la desconecta del diagnóstico local, rechazar la invitación pierde experiencia ya acumulada, y adoptar solo el nombre y la imagen deja el trabajo igual con una etiqueta nueva.',
                    en:'Collaborating at an international scale pays off when what travels is the learning: what was tried, what was measured and what resulted. Copying the whole campaign disconnects it from the local diagnosis, turning down the invitation loses experience already gathered, and adopting only the name and the image leaves the work unchanged under a new label.' } }
  ], rng), rng);
}

</script>

<!-- LIAXA ANALYTICS -->
<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbzLGV15JRTPs9bbSvHRLfgOXeT9oUExDf1AH546WOwq5tYxXSdhX212OWi_bTJfMGx9/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'Resolución Pacífica y Estrategias de Transformación Social';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
</body>
