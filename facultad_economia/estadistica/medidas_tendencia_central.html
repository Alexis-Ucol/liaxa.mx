<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medidas de Tendencia Central | Facultad de Economía, Universidad de Colima</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS (fallback; runtime applyBranding always wins) ────────── */
:root {
  --green:      #4a7c3f;
  --green-dark: #2d5a27;
  --green-bg:   #eaf0e7;
  --gold:       #c9a84c;
  --gold-bg:    #faf3e0;
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #6aaa5f;
  --green-dark: #8ecf82;
  --green-bg:   #1a281a;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; max-width:42%; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--green-bg); border:1.5px solid var(--green); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--green-dark); text-align:left; }
#restoreBar strong { color:var(--green-dark); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; object-fit:contain; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; overflow:hidden; text-overflow:ellipsis; max-width:150px; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── LANGUAGE TOGGLE ── */
.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); overflow-x:auto; }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH / WIDGET CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; font-family:inherit; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── INTERACTIVE WIDGETS ── */
.iw-h { font-family:'Crimson Pro',serif; font-size:1.1rem; font-weight:700; margin-bottom:.15rem; }
.iw-sub { font-size:.8rem; color:var(--text2); margin-bottom:.9rem; }
.iw-row { display:flex; flex-wrap:wrap; align-items:center; gap:.35rem; margin-bottom:.5rem; padding-bottom:.5rem; border-bottom:1px solid var(--border); }
.iw-var { flex:1 1 170px; font-size:.82rem; color:var(--text2); }
.iw-ok  { background:var(--ok-bg);  border-color:var(--ok);  color:var(--ok); }
.iw-bad { background:var(--bad-bg); border-color:var(--bad); color:var(--bad); }
.iw-note { font-size:.78rem; color:var(--text2); margin-top:.7rem; }
.iw-bars { display:flex; align-items:flex-end; gap:.25rem; height:160px; padding:.5rem .4rem; background:var(--surface2); border-radius:8px; }
.iw-col { flex:1; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; height:100%; }
.iw-cnt { font-family:'IBM Plex Mono',monospace; font-size:.6rem; color:var(--text3); margin-bottom:.15rem; }
.iw-bar { width:100%; background:var(--green); border-radius:3px 3px 0 0; min-height:2px; }
.iw-bar.adj { background:var(--gold); }
.iw-axis { display:flex; gap:.25rem; margin-top:.3rem; }
.iw-tick { flex:1; text-align:center; font-size:.58rem; color:var(--text3); font-family:'IBM Plex Mono',monospace; }
.iw-btn { background:var(--green); color:#fff; border:none; border-radius:8px; padding:.5rem 1.2rem; font-size:.83rem; font-weight:600; cursor:pointer; font-family:inherit; margin-top:.7rem; }
.iw-btn:hover { background:var(--green-dark); }
.rfb { font-size:.82rem; color:var(--text2); margin-top:.6rem; min-height:1.3rem; }
.rfb .good { color:var(--ok); font-weight:700; }
.rfb .rev { color:var(--green-dark); font-weight:600; }
.ftwrap { overflow-x:auto; margin:.7rem 0; }
.ftab { width:100%; border-collapse:collapse; font-size:.8rem; min-width:340px; }
.ftab th, .ftab td { border:1px solid var(--border); padding:.35rem .5rem; text-align:center; color:var(--text2); }
.ftab th { background:var(--surface2); color:var(--text3); font-size:.68rem; text-transform:uppercase; letter-spacing:.05em; }
.ftab tr.hl td { background:var(--green-bg); color:var(--green-dark); font-weight:600; }

/* ── CHIP SORTER ── */
.chips { display:flex; flex-wrap:wrap; gap:.4rem; margin:.7rem 0; }
.chip { border:1.5px solid var(--border); border-radius:8px; padding:.5rem .75rem; cursor:pointer; background:var(--surface2); font-family:'IBM Plex Mono',monospace; font-size:.82rem; user-select:none; min-height:44px; display:flex; align-items:center; gap:.4rem; }
.chip.sel { border-color:var(--gold); background:var(--gold-bg); }
.chip.mid { border-color:var(--ok); background:var(--ok-bg); color:var(--ok); font-weight:700; }
.chip.locked { cursor:default; }
.chip-pos { font-size:.62rem; color:var(--text3); }

/* ── NUMBER LINE ── */
.numline { position:relative; height:64px; margin:.9rem 0 .3rem; background:var(--surface2); border-radius:8px; }
.nlmark { position:absolute; top:10px; width:3px; height:26px; border-radius:2px; }
.nl-mean { background:var(--green); }
.nl-med  { background:var(--gold); }
.nldot { position:absolute; top:44px; width:6px; height:6px; border-radius:50%; background:var(--text3); transform:translateX(-50%); }
.nllbl { position:absolute; top:38px; font-size:.6rem; font-family:'IBM Plex Mono',monospace; transform:translateX(-50%); white-space:nowrap; }
.nllbl.a { color:var(--green); }
.nllbl.b { color:var(--gold); top:52px; }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; font-family:inherit; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); font-family:inherit; }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; font-family:inherit; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; font-family:inherit; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--gold-bg); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; font-family:inherit; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }

/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos { gap: .9rem; }
  .wlogos img { height: 38px; max-width: 40%; }
  .wtitle { font-size: 1.35rem; }
  .stickybar { padding: .5rem .55rem; gap: .4rem; }
  .htitle { display: none; }
  .halexis { display: none; }
  .hsep { display: none; }
  .hlogos img { height: 20px; max-width: 62px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 92px; overflow: hidden; text-overflow: ellipsis; }
  .lang-btn { padding: .26rem .45rem; font-size: .66rem; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .gcrd { padding: .9rem; }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
  .iw-bars { height: 130px; }
  .iw-tick { font-size: .5rem; }
  .chip { font-size: .78rem; padding: .45rem .6rem; }
  .numline { height: 72px; }
}
</style>
</head>
<body>

<!-- ════════════════════ WELCOME ════════════════════ -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <img id="wlogo-left"  src="" alt="Facultad de Economía" style="display:none">
      <div class="wlogsep" id="wlogsep"></div>
      <img id="wlogo-right" src="" alt="Universidad de Colima" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Medidas de Tendencia Central</div>
    <div class="wcourse" id="wcourse-el">Estadística · Facultad de Economía, Universidad de Colima</div>
    <label class="flabel" for="sName" id="lbl-name-el" data-tx="lbl-name">Nombre completo</label>
    <input class="finput" id="sName" type="text" data-tx-ph="ph-name" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" for="sGroup" id="lbl-group-el" data-tx="lbl-group">Grupo</label>
    <input class="finput" id="sGroup" type="text" data-tx-ph="ph-group" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" data-tx="btn-start" onclick="startLesson()">Comenzar</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreTitle" data-tx="restore-title">Sesión guardada encontrada</strong><br>
      <span id="restoreMsg" data-tx="restore-msg">Puedes continuar donde la dejaste.</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" data-tx="btn-restore" onclick="restoreSession()">Retomar sesión</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" data-tx="btn-dismiss" onclick="dismissRestore()">Empezar de nuevo</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.9rem">
      <svg width="160" height="52" viewBox="0 0 180 52" xmlns="http://www.w3.org/2000/svg">
        <style>

}

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t2 = s ^ (s >>> 16);
    t2 = Math.imul(t2, 0x21f0aaad);
    t2 ^= (t2 >>> 15);
    t2 = Math.imul(t2, 0x735a2d97);
    return ((t2 ^ (t2 >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}
/* shuffles the ES and EN option lists with the SAME permutation */
function shufPair(es, en, correct0, rng) {
  var idx = es.map(function(_, k) { return k; });
  for (var i = idx.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = idx[i]; idx[i] = idx[j]; idx[j] = tmp;
  }
  return {
    es: idx.map(function(k) { return es[k]; }),
    en: idx.map(function(k) { return en[k]; }),
    correctIdx: idx.indexOf(correct0)
  };
}
/* number helpers */
function nf(x) { return String(Math.round(x)).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
function money(x) { return '$' + nf(x); }
function d1(x) { return (Math.round(x * 10) / 10).toFixed(1); }
function pc1(x) { return d1(x) + '%'; }
function md(x) { return '$' + d1(x); }
function m2(x) {
  var v  = Math.round(x * 100) / 100;
  var ip = Math.floor(v);
  var fp = Math.round((v - ip) * 100);
  if (fp === 100) { ip += 1; fp = 0; }
  return '$' + nf(ip) + '.' + (fp < 10 ? '0' : '') + fp;
}
/* builds 4 distinct option strings: correct first, then alternates, then nudges */
function opts4(correct, alts, nudge) {
  var out = [correct], i;
  for (i = 0; i < alts.length && out.length < 4; i++) {
    if (out.indexOf(alts[i]) < 0) out.push(alts[i]);
  }
  var k = 1;
  while (out.length < 4 && k < 60) {
    var c = nudge(k);
    if (out.indexOf(c) < 0) out.push(c);
    k++;
  }
  return out;
}

   ================================================ */
function lsKey() {
  var n = (studentData.name  || '').trim();
  var g = (studentData.group || '').trim();
  return 'fac_econ_est__' + (n + '__' + g).replace(/\s+/g, '_');
}
function saveSession() {
  if (!studentData.name) return;
  var drawings = [], texts = [], photos = [];
  problems.forEach(function(p, i) {
    var dc = document.getElementById('dc' + i);
    if (dc && dc.width) {
      var blank = document.createElement('canvas');
      blank.width = dc.width; blank.height = dc.height;
      drawings.push(dc.toDataURL() === blank.toDataURL() ? null : dc.toDataURL('image/png'));
    } else { drawings.push(null); }
    var ta = document.getElementById('ta' + i);
    texts.push(ta ? ta.value : '');
    var pp = document.getElementById('pp' + i);
    photos.push((pp && pp.src && pp.src.indexOf('data:') === 0) ? pp.src : null);
  });
  var state = {
    name: studentData.name, group: studentData.group,
    answeredCount: answeredCount, correctCount: correctCount,
    choices: problems.map(function(p) { return p.studentChoice; }),
    drawings: drawings, texts: texts, photos: photos
  };
  try { localStorage.setItem(lsKey(), JSON.stringify(state)); } catch(e) {}
}
function loadSession(name, group) {
  var key = 'fac_econ_est__' + (name + '__' + group).replace(/\s+/g, '_');
  try { var r = localStorage.getItem(key); return r ? JSON.parse(r) : null; } catch(e) { return null; }
}
function dismissRestore() {
  document.getElementById('restoreBar').style.display = 'none';
}
function checkForSavedSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  if (!name || !group) { document.getElementById('restoreBar').style.display = 'none'; return; }
  var saved = loadSession(name, group);
  var bar = document.getElementById('restoreBar');
  bar.style.display = (saved && saved.choices && saved.choices.some(function(c){ return c !== null; })) ? 'block' : 'none';
}

/* ================================================
   START / RESTORE
   ================================================ */
function startLesson() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  var err   = document.getElementById('startErr');
  if (!name || !group) { err.textContent = t('err-fields'); return; }
  err.textContent = '';
  studentData = { name: name, group: group };
  answeredCount = 0;
  correctCount  = 0;
  var att = nextAttempt(name, group);
  var rng = seededRng(name + group + att);
  buildLesson(rng);
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
}

function restoreSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  var saved = loadSession(name, group);
  if (!saved) return;
  document.getElementById('restoreBar').style.display = 'none';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = currentAttempt(name, group);
  var rng = seededRng(name + group + att);
  buildLesson(rng);
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
  saved.choices.forEach(function(choice, idx) {
    if (choice !== null && choice !== undefined) confirmMC(idx, choice);
  });
  setTimeout(function() {
    if (saved.drawings) {
      saved.drawings.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var dc = document.getElementById('dc' + i);
        if (!dc || !dc.width) return;
        var img = new Image();
        img.onload = function() {
          var dpr = window.devicePixelRatio || 1;
          dc.getContext('2d').drawImage(img, 0, 0, dc.width / dpr, dc.height / dpr);
        };
        img.src = dataUrl;
      });
    }
    if (saved.texts) {
      saved.texts.forEach(function(text, i) {
        if (!text) return;
        var ta = document.getElementById('ta' + i);
        if (ta) ta.value = text;
      });
    }
    if (saved.photos) {
      saved.photos.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var pp = document.getElementById('pp' + i);
        if (!pp) return;
        pp.src = dataUrl; pp.style.display = 'block';
        var pz = document.getElementById('pz' + i);
        if (pz) pz.style.opacity = '0.4';
      });
    }
  }, 300);
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#2d5a27';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER (two taps to confirm)
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = '<strong>' + (isOk ? t('fb-correct') : t('fb-wrong')) + '</strong> ' + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (!prob || prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = '<strong>' + (isOk ? t('fb-correct') : t('fb-wrong')) + '</strong> ' + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

/* ── WIDGET 1: the mean as a balance point ────────────────────────────── */
function widgetBalance(D) {
  var el = document.createElement('div');
  el.setAttribute('data-widget', 'balance');
  el.className = 'gcrd section';
  el.id = 'wgBalance';
  var st = { x: D.sucStart, tries: 0, done: false };

  function meanNow() {
    var s = D.sucSum5 + st.x;
    return s / 6;
  }
  function liveHint() {
    var es = LANG === 'es';
    var m = meanNow(), diff = m - D.sucTarget;
    if (Math.abs(diff) < 0.001) {
      return es ? 'La media de las seis sucursales ya coincide con el objetivo. Presiona Comprobar.'
                : 'The mean of the six branches already matches the target. Press Check.';
    }
    if (diff < 0) {
      return es ? 'La media del grupo se queda por debajo del objetivo por ' + d1(-diff) + ' miles. Sube la venta de la sucursal nueva.'
                : 'The group mean stays below the target by ' + d1(-diff) + ' thousand. Raise the new branch sales.';
    }
    return es ? 'La media del grupo rebasa el objetivo por ' + d1(diff) + ' miles. Baja la venta de la sucursal nueva.'
              : 'The group mean overshoots the target by ' + d1(diff) + ' thousand. Lower the new branch sales.';
  }
  function paint() {
    var m = meanNow();
    var a = el.querySelector('#waMean');  if (a) a.textContent = d1(m);
    var b = el.querySelector('#waDiff');  if (b) b.textContent = d1(Math.abs(m - D.sucTarget));
    var c = el.querySelector('#waVal');   if (c) c.textContent = nf(st.x);
    var g = el.querySelector('#waBarAdj');
    if (g) {
      var mx = Math.max.apply(null, D.suc.concat([st.x, D.sucTarget]));
      g.style.height = Math.round(st.x / mx * 88) + '%';
      var lab = el.querySelector('#waCntAdj');
      if (lab) lab.textContent = nf(st.x);
    }
    var f = el.querySelector('#waFb');
    if (f && !st.done) f.innerHTML = liveHint();
  }
  function render() {
    var es = LANG === 'es';
    var mx = Math.max.apply(null, D.suc.concat([st.x, D.sucTarget]));
    var bars = '';
    D.suc.forEach(function(v) {
      bars += '<div class="iw-col"><div class="iw-cnt">' + nf(v) + '</div>' +
              '<div class="iw-bar" style="height:' + Math.round(v / mx * 88) + '%"></div></div>';
    });
    bars += '<div class="iw-col"><div class="iw-cnt" id="waCntAdj">' + nf(st.x) + '</div>' +
            '<div class="iw-bar adj" id="waBarAdj" style="height:' + Math.round(st.x / mx * 88) + '%"></div></div>';
    var ticks = '';
    for (var k = 1; k <= 5; k++) ticks += '<div class="iw-tick">S' + k + '</div>';
    ticks += '<div class="iw-tick">' + (es ? 'Nueva' : 'New') + '</div>';

    el.innerHTML =
      '<div class="iw-h">' + (es ? 'Laboratorio de la media' : 'Mean laboratory') + '</div>' +
      '<div class="iw-sub">' + (es
        ? 'Cinco sucursales ya cerraron el mes con las ventas que ves en las barras verdes. Buscas la venta de la sucursal nueva (barra dorada) que hace que la media de las seis sea exactamente el objetivo de ' + nf(D.sucTarget) + ' miles de pesos. Sabrás que acertaste cuando la media actual marque ese mismo número y la diferencia quede en cero. Mueve el deslizador y presiona Comprobar cuando estés listo.'
        : 'Five branches already closed the month with the sales shown in the green bars. You are looking for the sales of the new branch (gold bar) that make the mean of all six exactly the target of ' + nf(D.sucTarget) + ' thousand pesos. You will know you are right when the current mean shows that same number and the difference drops to zero. Move the slider and press Check when you are ready.') + '</div>' +
      '<div class="iw-bars">' + bars + '</div>' +
      '<div class="iw-axis">' + ticks + '</div>' +
      '<div class="cgrid" style="margin-top:.9rem"><div class="cg">' +
        '<label>' + (es ? 'Venta de la sucursal nueva' : 'New branch sales') + ': <span class="cval" id="waVal">' + nf(st.x) + '</span></label>' +
        '<input type="range" id="waSlider" min="' + D.sucMin + '" max="' + D.sucMax + '" step="1" value="' + st.x + '"' + (st.done ? ' disabled' : '') + '>' +
      '</div><div class="cg">' +
        '<label>' + (es ? 'Cifras en miles de pesos' : 'Figures in thousands of pesos') + '</label>' +
        '<button class="iw-btn" id="waCheck" style="margin-top:0"' + (st.done ? ' disabled' : '') + '>' + (es ? 'Comprobar' : 'Check') + '</button>' +
      '</div></div>' +
      '<div class="metrics">' +
        '<div class="metric"><div class="mlbl">' + (es ? 'Media actual' : 'Current mean') + '</div><div class="mnum cs" id="waMean">' + d1(meanNow()) + '</div></div>' +
        '<div class="metric"><div class="mlbl">' + (es ? 'Objetivo' : 'Target') + '</div><div class="mnum ts">' + d1(D.sucTarget) + '</div></div>' +
        '<div class="metric"><div class="mlbl">' + (es ? 'Diferencia' : 'Difference') + '</div><div class="mnum ps" id="waDiff">' + d1(Math.abs(meanNow() - D.sucTarget)) + '</div></div>' +
      '</div>' +
      '<div class="rfb" id="waFb"></div>';

    var sl = el.querySelector('#waSlider');
    if (sl) sl.addEventListener('input', function() { st.x = parseInt(sl.value, 10); paint(); });
    var bt = el.querySelector('#waCheck');
    if (bt) bt.addEventListener('click', waCheck);
    var fb = el.querySelector('#waFb');
    if (st.done) {
      fb.innerHTML = '<span class="rev">' + (LANG === 'es'
        ? 'La sucursal nueva necesita vender ' + nf(D.sucX) + ' miles. Con ese valor la suma de las seis llega a ' + nf(D.sucTarget * 6) + ' miles y, repartida entre 6, da justo el objetivo.'
        : 'The new branch needs to sell ' + nf(D.sucX) + ' thousand. With that value the six branches add up to ' + nf(D.sucTarget * 6) + ' thousand and, split among 6, that lands exactly on the target.') + '</span>';
    } else {
      fb.innerHTML = liveHint();
    }
  }
  function waCheck() {
    if (st.done) return;
    var es = LANG === 'es';
    var fb = el.querySelector('#waFb');
    if (Math.abs(meanNow() - D.sucTarget) < 0.001) {
      st.done = true;
      render();
      el.querySelector('#waFb').innerHTML = '<span class="good">' + (es
        ? 'Exacto. La media es un punto de equilibrio: al fijar el total en ' + nf(D.sucTarget * 6) + ' miles, el sexto valor queda determinado por los otros cinco.'
        : 'Exactly. The mean is a balance point: once the total is fixed at ' + nf(D.sucTarget * 6) + ' thousand, the sixth value is determined by the other five.') + '</span>';
      return;
    }
    st.tries++;
    if (st.tries >= 3) {
      st.x = D.sucX;
      st.done = true;
      render();
      return;
    }
    fb.innerHTML = liveHint() + ' ' + (es
      ? 'Piensa primero qué total necesitan las seis sucursales juntas.'
      : 'Think first about the total the six branches need together.');
  }
  render();
  document.getElementById('lessonBody').appendChild(el);
  WIDGETS.push({ el: el, relabel: render });
}

/* ── WIDGET 2: order the tickets and locate the median ────────────────── */
function widgetMedian(D) {
  var el = document.createElement('div');
  el.setAttribute('data-widget', 'median');
  el.className = 'gcrd section';
  el.id = 'wgMedian';
  var n  = D.medV.length;
  var st = { order: D.medOrder.slice(), sel: null, tries: 0, done: false };

  function firstInversion() {
    for (var k = 0; k < n - 1; k++) {
      if (D.medV[st.order[k]] > D.medV[st.order[k + 1]]) return k;
    }
    return -1;
  }
  function isSorted() { return firstInversion() === -1; }
  function render() {
    var es = LANG === 'es';
    var mid = (n - 1) / 2;
    var chips = st.order.map(function(vi, pos) {
      var cls = 'chip';
      if (st.sel === pos) cls += ' sel';
      if (st.done && pos === mid) cls += ' mid';
      if (st.done) cls += ' locked';
      return '<div class="' + cls + '" data-pos="' + pos + '">' +
             '<span class="chip-pos">' + (pos + 1) + '</span>' + money(D.medV[vi]) + '</div>';
    }).join('');
    el.innerHTML =
      '<div class="iw-h">' + (es ? 'Ordena la caja del día' : 'Sort the day tickets') + '</div>' +
      '<div class="iw-sub">' + (es
        ? 'Estos son los ' + n + ' tickets que cobró la sucursal, capturados en el desorden en que salieron de la terminal. Buscas dejarlos de menor a mayor importe, porque solo así la posición central señala la mediana. Sabrás que acertaste cuando ningún ticket tenga a su izquierda uno más caro. Toca dos tickets para intercambiarlos y presiona Comprobar cuando el orden te convenza.'
        : 'These are the ' + n + ' tickets the branch collected, captured in the disorder in which they left the terminal. You want them from lowest to highest amount, because only then does the central position point at the median. You will know you are right when no ticket has a more expensive one to its left. Tap two tickets to swap them and press Check when the order convinces you.') + '</div>' +
      '<div class="chips" id="wmChips">' + chips + '</div>' +
      (st.done ? '' : '<button class="iw-btn" id="wmCheck">' + (es ? 'Comprobar' : 'Check') + '</button>') +
      '<div class="rfb" id="wmFb"></div>';

    el.querySelectorAll('.chip').forEach(function(c) {
      c.addEventListener('click', function() { wmTap(parseInt(c.getAttribute('data-pos'), 10)); });
    });
    var bt = el.querySelector('#wmCheck');
    if (bt) bt.addEventListener('click', wmCheck);
    var fb = el.querySelector('#wmFb');
    if (st.done) {
      fb.innerHTML = '<span class="rev">' + (LANG === 'es'
        ? 'Con ' + n + ' tickets ordenados, la posición ' + (mid + 1) + ' deja la misma cantidad de tickets a cada lado, así que la mediana es ' + money(D.medV[mid]) + '.'
        : 'With ' + n + ' tickets in order, position ' + (mid + 1) + ' leaves the same number of tickets on each side, so the median is ' + money(D.medV[mid]) + '.') + '</span>';
    }
  }
  function wmTap(pos) {
    if (st.done) return;
    if (st.sel === null) { st.sel = pos; }
    else if (st.sel === pos) { st.sel = null; }
    else {
      var tmp = st.order[st.sel];
      st.order[st.sel] = st.order[pos];
      st.order[pos] = tmp;
      st.sel = null;
    }
    render();
  }
  function wmCheck() {
    var es = LANG === 'es';
    var fb = el.querySelector('#wmFb');
    if (isSorted()) {
      st.done = true;
      st.sel = null;
      render();
      el.querySelector('#wmFb').innerHTML = '<span class="good">' + (es
        ? 'Orden correcto. La mediana es ' + money(D.medV[(n - 1) / 2]) + ': la mitad de los tickets cobró menos que eso y la otra mitad cobró más.'
        : 'Correct order. The median is ' + money(D.medV[(n - 1) / 2]) + ': half the tickets came in below that and the other half above.') + '</span>';
      return;
    }
    st.tries++;
    if (st.tries >= 3) {
      st.order = D.medV.map(function(_, k) { return k; });
      st.done = true;
      st.sel = null;
      render();
      return;
    }
    var k = firstInversion();
    fb.innerHTML = (es
      ? 'Todavía no. Los tickets de las posiciones ' + (k + 1) + ' y ' + (k + 2) + ' están al revés: el de la izquierda es más caro que el de su derecha.'
      : 'Not yet. The tickets in positions ' + (k + 1) + ' and ' + (k + 2) + ' are the wrong way round: the left one is more expensive than the one to its right.');
  }
  render();
  document.getElementById('lessonBody').appendChild(el);
  WIDGETS.push({ el: el, relabel: render });
}

/* ── WIDGET 3: weighted mean of a sales mix ───────────────────────────── */
function widgetWeighted(D) {
  var el = document.createElement('div');

  el.className = 'gcrd section';
  el.id = 'wgWeighted';
  var st = { a: D.wcStartA, b: D.wcStartB, tries: 0, done: false };

  function cUnits() { return D.wcT - st.a - st.b; }
  function avgNow() {

  }

    var es = LANG === 'es';
    var a = avgNow(), diff = a - D.wcTarget;

                : 'The average price per cup already reaches the target. Press Check.';
    }

                : 'The average price runs ' + d1(-diff) + ' pesos below the target. Move cups toward the more expensive sizes.';

        : 'The coffee shop sells ' + D.wcT + ' cups a day split across three sizes with different prices. You are looking for the mix of cups that leaves the average price per cup at the target of ' + money(D.wcTarget) + '. You will know you are right when the displayed average rounds to that figure. Move the small and medium sliders, watch the large one adjust and press Check.') + '</div>' +

        '<input type="range" id="wcSlA" min="0" max="' + D.wcT + '" step="5" value="' + st.a + '"' + (st.done ? ' disabled' : '') + '>' +
      '</div><div class="cg">' +
        '<label>' + names[1] + ' ' + money(D.wcP[1]) + ': <span class="cval" id="wcBv">' + st.b + '</span> ' + (es ? 'vasos' : 'cups') + '</label>' +
        '<input type="range" id="wcSlB" min="0" max="' + D.wcT + '" step="5" value="' + st.b + '"' + (st.done ? ' disabled' : '') + '>' +
      '</div></div>' +
      '<div class="metrics">' +
        '<div class="metric"><div class="mlbl">' + names[2] + ' ' + money(D.wcP[2]) + '</div><div class="mnum ts"><span id="wcCv">' + cUnits() + '</span></div></div>' +
        '<div class="metric"><div class="mlbl">' + (es ? 'Precio promedio' : 'Average price') + '</div><div class="mnum cs" id="wcAvg">' + d1(avgNow()) + '</div></div>' +

      '</div>' +
      (st.done ? '' : '<button class="iw-btn" id="wcCheck">' + (es ? 'Comprobar' : 'Check') + '</button>') +
      '<div class="iw-note">' + (es
        ? 'El promedio nunca es el punto medio entre ' + money(D.wcP[0]) + ' y ' + money(D.wcP[2] ) + ': cada precio pesa según cuántos vasos se vendieron a ese precio.'
        : 'The average is never the midpoint between ' + money(D.wcP[0]) + ' and ' + money(D.wcP[2]) + ': each price weighs according to how many cups sold at that price.') + '</div>' +

        : 'That mix reaches the target. Notice there are several valid combinations: what rules is the weight of each price, not the price itself.') + '</span>';
      return;
    }
    st.tries++;
    if (st.tries >= 3) {
      st.a = D.wcA0; st.b = D.wcB0;
      st.done = true;
      render();
      return;
    }
    fb.innerHTML = liveHint() + ' ' + (es
      ? 'Cambia los vasos de tamaño en bloques y vuelve a leer el promedio.'
      : 'Shift cups between sizes in blocks and read the average again.');
  }
  render();
  document.getElementById('lessonBody').appendChild(el);
  WIDGETS.push({ el: el, relabel: render });

/* ── WIDGET 4: one corporate ticket against mean and median ───────────── */

        : 'Eight normal tickets of the day are fixed; the ninth is a corporate purchase you control. You are looking for the amount that puts the mean at least ' + D.skGap + ' pesos above the median, to see how far a single data point can pull them apart. You will know you are right when the displayed gap reaches that figure. Move the slider and press Check.') + '</div>' +

        : 'From ' + nf(D.skNeed) + ' pesos upward the mean beats the median by ' + D.skGap + ' or more. The median stayed at ' + nf(D.skMed) + ' the whole time.') + '</span>';

        : 'There it is. A single ticket moved the mean by ' + d1(gapNow()) + ' pesos and left the median untouched: that is why the median describes the typical customer better.') + '</span>';
      return;
    }
    st.tries++;
    if (st.tries >= 3) {
      st.x = D.skNeed;
      st.done = true;
      render();
      return;
    }
    fb.innerHTML = liveHint() + ' ' + (es
      ? 'Recuerda que ese importe se reparte entre los nueve tickets.'
      : 'Remember that amount is spread across all nine tickets.');
  }
  render();
  document.getElementById('lessonBody').appendChild(el);
  WIDGETS.push({ el: el, relabel: render });
}

/* ================================================
   BUILD LESSON
   ================================================ */
function buildLesson(rng) {
  var body = document.getElementById('lessonBody');
  body.innerHTML = '';
  problems = []; SECTIONS = []; WIDGETS = [];
  var ri = function(a, b) { return a + Math.floor(rng() * (b - a + 1)); };
  var D = {};
  var i, j, s;

  /* ── concept 1 + balance widget: chain of branches, thousands of pesos ── */
  D.suc = [];
  for (i = 0; i < 5; i++) D.suc.push(ri(280, 520));
  D.sucSum5 = 0;
  for (i = 0; i < 5; i++) D.sucSum5 += D.suc[i];
  D.sucX = ri(300, 470);
  D.sucX += (6 - ((D.sucSum5 + D.sucX) % 6)) % 6;
  D.sucTarget = (D.sucSum5 + D.sucX) / 6;
  D.sucMin   = D.sucX - 85;
  D.sucMax   = D.sucX + 85;
  D.sucStart = D.sucX - 52;
  D.sucMean5 = D.sucSum5 / 5;

  /* ── problem 1: bakery daily sales, pesos ── */
  D.k1  = ri(5, 6);
  D.d1v = [];
  for (i = 0; i < D.k1; i++) D.d1v.push(100 * ri(38, 86));
  var a1 = 0;
  for (i = 0; i < D.k1; i++) a1 += D.d1v[i] / 100;
  D.d1v[D.k1 - 1] += 100 * ((D.k1 - (a1 % D.k1)) % D.k1);
  D.sum1 = 0;
  for (i = 0; i < D.k1; i++) D.sum1 += D.d1v[i];
  D.mean1 = D.sum1 / D.k1;
  var srt1 = D.d1v.slice().sort(function(p, q) { return p - q; });
  D.med1 = D.k1 % 2 ? srt1[(D.k1 - 1) / 2] : (srt1[D.k1 / 2 - 1] + srt1[D.k1 / 2]) / 2;

  /* ── problem 2: accounting firm, missing value to reach a target mean ── */
  D.p2v = [];
  for (i = 0; i < 4; i++) D.p2v.push(1000 * ri(18, 44));
  var b2 = 0;
  for (i = 0; i < 4; i++) b2 += D.p2v[i] / 1000;
  D.p2x = 1000 * ri(22, 46);
  D.p2x += 1000 * ((5 - ((b2 + D.p2x / 1000) % 5)) % 5);
  D.p2sum = 0;
  for (i = 0; i < 4; i++) D.p2sum += D.p2v[i];
  D.p2target = (D.p2sum + D.p2x) / 5;

  /* ── concept 2 + median widget: seven tickets, pesos ── */
  D.medV = [];
  var mv = 10 * ri(9, 17);
  for (i = 0; i < 7; i++) { D.medV.push(mv); mv += 10 * ri(2, 6); }
  D.medOrder = shuffle([0, 1, 2, 3, 4, 5, 6], rng);
  var sorted0 = true;
  for (i = 0; i < 7; i++) if (D.medOrder[i] !== i) sorted0 = false;
  if (sorted0) { var tt = D.medOrder[0]; D.medOrder[0] = D.medOrder[6]; D.medOrder[6] = tt; }

  /* ── problem 3: eight tickets, median with an even count ── */
  D.p3 = [];
  var v3 = 10 * ri(9, 16);
  for (i = 0; i < 8; i++) { D.p3.push(v3); v3 += 10 * ri(1, 5); }
  D.p3med  = (D.p3[3] + D.p3[4]) / 2;
  D.p3sum  = 0;

      + '<h2>Median and mode: the centre by position and the most frequent value</h2>'
      + '<p>The mean is not the only way to point at the centre. The <strong>median</strong> is the value sitting in the central position once the data are ordered from lowest to highest: it leaves half the observations below and half above. It is not computed by adding, it is located by counting.</p>'

  addSection({
    es: function() { return ''

      + '<h2>Media ponderada: cuando no todos los datos pesan igual</h2>'
      + '<p>Promediar precios, tasas o calificaciones como si cada uno valiera lo mismo es uno de los errores más caros en un análisis comercial. Si la línea barata vende diez veces más unidades que la cara, el precio promedio real está cerca del barato, no a medio camino entre los dos.</p>'
      + '<p>La <strong>media ponderada</strong> corrige eso: cada valor se multiplica por su peso, se suman esos productos y el resultado se divide entre la suma de los pesos. El peso es lo que dice cuántas veces cuenta cada valor, y casi siempre es una cantidad del negocio: unidades vendidas, número de cuentas, monto invertido, horas trabajadas.</p>'
      + '<p>La misma idea resuelve un problema distinto. Cuando los datos llegan ya agrupados en una tabla de frecuencias, los importes individuales se perdieron y solo quedan las clases. Se usa entonces la <strong>marca de clase</strong>, el punto medio de cada intervalo, como representante de todos los datos de esa clase, y la frecuencia hace de peso. Para localizar la mediana en esa misma tabla no se promedia nada: se busca en la columna acumulada la primera clase que alcanza la mitad de las observaciones.</p>'

    en: function() { return ''
      + '<div class="stag">Concept 3</div>'
      + '<h2>Weighted mean: when data points do not weigh the same</h2>'
      + '<p>Averaging prices, rates or scores as if each one counted the same is one of the most expensive mistakes in commercial analysis. If the cheap line sells ten times more units than the expensive one, the real average price sits close to the cheap one, not halfway between the two.</p>'
      + '<p>The <strong>weighted mean</strong> fixes that: each value is multiplied by its weight, those products are added, and the result is divided by the sum of the weights. The weight states how many times each value counts, and it is almost always a business quantity: units sold, number of accounts, amount invested, hours worked.</p>'
      + '<p>The same idea solves a different problem. When data arrive already grouped in a frequency table, the individual amounts are gone and only the classes remain. The <strong>class mark</strong>, the midpoint of each interval, is then used as the representative of every data point in that class, and the frequency plays the role of weight. To locate the median in that same table nothing is averaged: you look down the cumulative column for the first class that reaches half of the observations.</p>'
      + '<div class="rules-grid">'

      + '</div>'
      + '<div class="callout"><p><strong>Warning sign.</strong> If while computing an average you divide by the number of rows in the table instead of by the total number of units, you are treating a line of 12 pieces exactly like a line of 900. The correct divisor is almost never the number of rows.</p></div>'

        + '<p><strong>Step 3.</strong> For the median you look for half of the observations, that is ' + d1(D.gn / 2) + ' tickets. The cumulative column reaches it for the first time in the highlighted class, ' + gcls(D.gMedIdx) + ' pesos, so that is where the central ticket falls.</p>'

      + '<h2>When the mean misleads: outliers and skewed distributions</h2>'
      + '<p>An <strong>outlier</strong> is an observation far away from the rest: the corporate sale among counter tickets, the partner salary among the team salaries, the annual contract among monthly invoices. Since the mean spreads the total across every unit, that lonely value gets spread as well and lifts the whole figure.</p>'
      + '<p>The median does not behave that way. It only depends on which observation sits in the central position, not on how large the highest value is. You can multiply the largest data point by ten and the median will not move a single peso. That is why the median is called <strong>robust</strong> and the mean is not.</p>'
      + '<p>When the mean lands clearly above the median, the distribution has a long tail to the right: it is called <strong>right skewed</strong> and it is the usual shape of incomes, salaries and purchase amounts. Comparing both measures is the quick way to detect that shape without plotting anything.</p>'
      + '<div class="callout"><p><strong>How to choose.</strong> If the goal is to split or project a total, the mean is the right measure even with outliers, because the total does include them. If the goal is to describe the typical unit, the median is the honest one. Reporting the mean of a heavily skewed set as if it described the typical customer is not an arithmetic error, it is an interpretation error.</p></div>'

    title: '', questionText: '', options: [], explanation: '', hint: '',
    studentChoice: null, pendingChoice: null
  });
  emitProblem();

  /* ── PROBLEM 10 ── */
  var o10 = shufPair(
    ['La media baja de forma notable y la mediana se queda casi igual',
     'La mediana baja de forma notable y la media se queda casi igual',
     'Las dos bajan en la misma proporción porque se corrige un solo dato',
     'Ninguna de las dos cambia porque el ticket sigue estando en la lista'],
    ['The mean drops noticeably and the median stays almost the same',
     'The median drops noticeably and the mean stays almost the same',
     'Both drop in the same proportion because a single value is corrected',
     'Neither one changes because the ticket is still on the list'],
    0, rng);
  problems.push({
    i18n: {
      es: { title: 'Corregir un dato capturado con un cero de más',
            q: 'Al revisar el corte de una tienda, el contador descubre que el ticket más alto del día se capturó con un cero de más y en realidad valía la décima parte. La lista tiene decenas de tickets y ese fue el único error. ¿Qué les ocurre a la media y a la mediana del día cuando se corrige ese ticket?',
            options: o10.es,
            hint: 'Una de las dos medidas usa el valor del ticket y la otra solo usa su posición en la lista ordenada.',
            exp: 'La media reparte el total entre todos los tickets, así que al reducir el ticket más alto a la décima parte el total cae y la media baja de forma notable. La mediana solo depende de qué ticket ocupa la posición central: el ticket corregido sigue siendo alto o pasa a otra posición sin desplazar el centro, de modo que la mediana se queda prácticamente igual. Esa diferencia de comportamiento es justo lo que hace robusta a la mediana.' },
      en: { title: 'Correcting a value captured with an extra zero',
            q: 'While reviewing a store daily close, the accountant discovers that the highest ticket of the day was captured with an extra zero and was really worth a tenth of that. The list holds dozens of tickets and that was the only error. What happens to the mean and the median of the day once that ticket is corrected?',
            options: o10.en,
            hint: 'One of the two measures uses the ticket value and the other only uses its position in the ordered list.',
            exp: 'The mean spreads the total across every ticket, so cutting the highest ticket down to a tenth makes the total fall and the mean drop noticeably. The median depends only on which ticket occupies the central position: the corrected ticket is still high or moves to another position without displacing the centre, so the median stays practically the same. That difference in behaviour is exactly what makes the median robust.' }
    },
    correctIdx: o10.correctIdx, fn: '', showWork: false,
    title: '', questionText: '', options: [], explanation: '', hint: '',
    studentChoice: null, pendingChoice: null
  });
  emitProblem();

  applyUIStrings();
}

/* ================================================
   PDF
   ================================================ */
async function generatePDF() {
  var btn = document.getElementById('dlBtn');
  btn.textContent = t('pdf-making');
  btn.disabled = true;

  var jspdf   = window.jspdf;
  var doc     = new jspdf.jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });
  var PW      = 215.9;
  var M       = 18;
  var TW      = PW - M * 2;
  var PH      = doc.internal.pageSize.height;
  var name    = studentData.name;
  var group   = studentData.group;
  var total   = problems.length;
  var pct     = Math.round(correctCount / total * 100);
  var dateStr = new Date().toLocaleString(LANG === 'es' ? 'es-MX' : 'en-US', { dateStyle:'long', timeStyle:'short' });

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;

  function pdfText(html) {
    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/→/g,'->').replace(/−/g,'-').replace(/²/g,'^2')
      .replace(/³/g,'^3').replace(/×/g,'x').replace(/÷/g,'/')
      .replace(/≠/g,'!=').replace(/≤/g,'<=').replace(/≥/g,'>=')
      .replace(/√/g,'sqrt').replace(/π/g,'pi').replace(/…/g,'...')
      .replace(/\s+/g,' ').trim();
  }

  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,2,'F');
  doc.setFillColor(255,255,255); doc.rect(0,2,PW,26,'F');
  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,28,PW,2,'F');
  doc.setFillColor(pBR,pBG,pBB); doc.rect(0,30,PW,34,'F');

  var logoLeftB64  = SCHOOL.logoLeftB64;
  var logoRightB64 = SCHOOL.logoRightB64;
  try { doc.addImage(logoLeftB64,  logoLeftB64.indexOf('/9j/')  > -1 ? 'JPEG' : 'PNG', M,  5, 20, 20); } catch(e) {}
  try { doc.addImage(logoRightB64, logoRightB64.indexOf('/9j/') > -1 ? 'JPEG' : 'PNG', 62, 6, 40, 17.7); } catch(e) {}

  var lx = PW - M - 36;
  var ly = 10;
  doc.setDrawColor(pBR,pBG,pBB); doc.setLineWidth(0.7);
  doc.lines([[2.57-1.03,4.63-6.17],[4.11-2.57,5.14-4.63],[5.66-4.11,2.57-5.14]], lx+1.03, ly+6.17);
  doc.setFillColor(pAR,pAG,pAB); doc.circle(lx+5.66, ly+2.57, 0.9, 'F');
  doc.setDrawColor(pAR,pAG,pAB); doc.setLineWidth(0.7);
  doc.line(lx+8.23, ly+1.54, lx+8.23, ly+7.2);
  doc.setTextColor(pBR,pBG,pBB); doc.setFontSize(11); doc.setFont('helvetica','bold');
  doc.text('LIAXA', lx+10, ly+6.8);

  doc.setTextColor(240,245,238); doc.setFontSize(17); doc.setFont('helvetica','bold');
  doc.text(pdfText(SCHOOL.guideTitle[LANG]), M, 49);
  doc.setTextColor(200,215,195); doc.setFontSize(8); doc.setFont('helvetica','normal');
  doc.text(dateStr, M, 59);

  doc.setFillColor(237,240,235); doc.roundedRect(M,72,TW,20,3,3,'F');
  doc.setTextColor(130,140,130); doc.setFontSize(8.5); doc.setFont('helvetica','bold');
  doc.text(t('pdf-student'), M+4, 79); doc.text(t('pdf-group'), 130, 79);
  doc.setTextColor(20,24,20); doc.setFontSize(11); doc.setFont('helvetica','bold');
  doc.text(name, M+4, 87); doc.text(group, 130, 87);

  var sc = pct>=70?[26,106,74]:pct>=50?[224,123,26]:[176,48,16];
  doc.setFillColor(255,255,255); doc.roundedRect(M,100,TW,34,4,4,'F');
  doc.setDrawColor(sc[0],sc[1],sc[2]); doc.setLineWidth(0.8);
  doc.roundedRect(M,100,TW,34,4,4,'S');
  doc.setTextColor(sc[0],sc[1],sc[2]); doc.setFontSize(40); doc.setFont('helvetica','bold');
  doc.text(pct+'%', PW/2, 124, {align:'center'});
  doc.setTextColor(130,140,130); doc.setFontSize(8.5); doc.setFont('helvetica','normal');
  doc.text(correctCount+' '+t('pdf-score')+' '+total+' '+t('pdf-items'), PW/2, 131, {align:'center'});

  doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
  doc.setFontSize(7); doc.setFont('helvetica','bold');
  doc.rect(M,142,TW,8,'F'); doc.text(t('pdf-summary'), M+4, 148);
  var sy = 154;
  problems.forEach(function(prob, i) {
    if (sy + 12 > PH - 15) {
      doc.addPage(); sy = 20;
      doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
      doc.setFontSize(7); doc.setFont('helvetica','bold');
      doc.rect(M,sy,TW,8,'F'); doc.text(t('pdf-cont'), M+4, sy+6);
      sy += 12;
    }
    var ok = document.getElementById('pc'+i).classList.contains('ok');
    doc.setFillColor(ok?232:255, ok?240:232, ok?232:228);
    doc.roundedRect(M,sy,TW,10,2,2,'F');
    doc.setFillColor(ok?26:176, ok?106:48, ok?74:16);
    doc.circle(M+6, sy+5, 2.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(7); doc.setFont('helvetica','bold');
    doc.text(ok?'OK':'X', M+4.5, sy+6.5);
    doc.setTextColor(20,24,20); doc.setFontSize(8); doc.setFont('helvetica','normal');
    doc.text(t('pdf-prob')+' '+(i+1)+': '+pdfText(prob.title), M+12, sy+6.5);
    doc.setTextColor(ok?26:176, ok?106:48, ok?74:16);
    doc.text(ok?t('pdf-right'):t('pdf-wrong'), PW-M-24, sy+6.5);
    sy += 12;
  });

  for (var i = 0; i < problems.length; i++) {
    var prob = problems[i];
    doc.addPage();
    var wy = 0;

    doc.setFillColor(pBR,pBG,pBB); doc.rect(0,0,PW,20,'F');
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,3,'F');
    doc.setTextColor(pAR,pAG,pAB); doc.setFontSize(7); doc.setFont('helvetica','normal');
    doc.text(pdfText(SCHOOL.courseName[LANG]) + '  ·  ' + pdfText(SCHOOL.guideTitle[LANG]), M, 10);
    doc.setTextColor(240,245,238); doc.setFontSize(10.5); doc.setFont('helvetica','bold');
    doc.text(t('pdf-prob')+' '+(i+1)+' '+t('pdf-of')+' '+total+'  ·  '+pdfText(prob.title), M, 17);
    wy = 25;

    var qRaw = pdfText(prob.questionText);
    doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var qLines = doc.splitTextToSize(qRaw, TW-10);
    var qBoxH  = 8 + qLines.length*5 + 3;
    doc.setFillColor(237,240,235); doc.roundedRect(M,wy,TW,qBoxH,2,2,'F');
    doc.setTextColor(pBR,pBG,pBB); doc.setFontSize(6.5); doc.setFont('helvetica','bold');
    doc.text(t('pdf-question'), M+4, wy+6);
    doc.setTextColor(20,24,20); doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var qy = wy+12;
    qLines.forEach(function(ln,li){ doc.text(ln, M+4, qy+li*5); });
    wy += qBoxH + 4;

    var isOk   = document.getElementById('pc'+i).classList.contains('ok');
    var chosen = prob.studentChoice != null ? pdfText(prob.options[prob.studentChoice]||'') : '';
    var corr   = pdfText(prob.options[prob.correctIdx]||'');
    var expRaw = pdfText(prob.explanation||'');
    doc.setFontSize(8.5); var chLines = doc.splitTextToSize(t('pdf-you')+' '+chosen, TW-18);
    doc.setFontSize(8);   var coLines = doc.splitTextToSize(t('pdf-ok')+' '+corr, TW-18);
    doc.setFontSize(7.5); var exLines = doc.splitTextToSize(t('pdf-sol')+' '+expRaw, TW-18).slice(0,5);
    var ansBoxH = 8 + chLines.length*5.5 + coLines.length*5 + exLines.length*5 + 6;
    doc.setFillColor(isOk?232:255, isOk?240:232, isOk?232:228);
    doc.roundedRect(M,wy,TW,ansBoxH,2,2,'F');
    doc.setFillColor(isOk?26:176, isOk?106:48, isOk?74:16);
    doc.circle(M+7, wy+8, 3.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(9); doc.setFont('helvetica','bold');
    doc.text(isOk?'OK':'X', M+5.2, wy+10.5);
    var ay = wy+7;
    doc.setTextColor(20,24,20); doc.setFontSize(8.5); doc.setFont('helvetica','bold');
    chLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5.5); });
    ay += chLines.length*5.5 + 3;
    doc.setTextColor(26,106,74); doc.setFontSize(8); doc.setFont('helvetica','normal');
    coLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    ay += coLines.length*5 + 3;
    doc.setTextColor(90,88,80); doc.setFontSize(7.5);
    exLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    wy += ansBoxH + 5;

    if (prob.showWork) {
      doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
      doc.setFontSize(7); doc.setFont('helvetica','bold');
      doc.rect(M,wy,TW,8,'F'); doc.text(t('pdf-work'), M+4, wy+5.5);
      wy += 11;

      var dc = document.getElementById('dc'+i);
      if (dc) {
        try {
          var imgD = dc.toDataURL('image/png');
          var ar   = dc.height / dc.width;
          var iw   = TW;
          var ih   = Math.min(iw * ar, 68);
          doc.addImage(imgD, 'PNG', M, wy, iw, ih);
          wy += ih + 4;
        } catch(e) {}
      }

      var ta = document.getElementById('ta'+i);
      if (ta && ta.value.trim()) {
        if (wy > PH-30) { doc.addPage(); wy = 20; }
        doc.setTextColor(20,24,20); doc.setFontSize(8); doc.setFont('courier','normal');
        var taLines = doc.splitTextToSize(ta.value, TW);
        taLines.slice(0,16).forEach(function(ln) {
          if (wy > PH-15) { doc.addPage(); wy = 20; }
          doc.text(ln, M, wy); wy += 5;
        });
        wy += 2;
      }

      var pp = document.getElementById('pp'+i);
      if (pp && pp.src && pp.src.indexOf('data:') === 0) {
        if (wy > PH-55) { doc.addPage(); wy = 20; }
        try { doc.addImage(pp.src, 'JPEG', M, wy, TW, 68); wy += 72; } catch(e) {}
      }
    }
  }

  var pages = doc.internal.getNumberOfPages();
  for (var p = 1; p <= pages; p++) {
    doc.setPage(p);
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0, PH-3, PW, 3, 'F');
    doc.setTextColor(130,140,130); doc.setFontSize(6.5); doc.setFont('helvetica','normal');
    doc.text(name+'  ·  '+group+'  ·  '+t('pdf-code')+': '+code+'  ·  '+t('pdf-page')+' '+p+'/'+pages,
      PW/2, PH-5, {align:'center'});
  }

  var _fn = SCHOOL.filePrefix + '_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf';
  var _pdfBlob = doc.output('blob');
  var _blobUrl = URL.createObjectURL(_pdfBlob);
  var _a = document.createElement('a');
  _a.href = _blobUrl;
  _a.download = _fn;
  document.body.appendChild(_a);
  _a.click();
  setTimeout(function(){ document.body.removeChild(_a); URL.revokeObjectURL(_blobUrl); }, 200);
  btn.textContent = t('btn-pdf');
  btn.disabled  = false;
}

  if (wr && SCHOOL.logoRightB64) { wr.src = SCHOOL.logoRightB64; wr.style.display = 'block'; }

  var hl = document.getElementById('hlogo-left');
  if (hl && SCHOOL.logoLeftB64)  { hl.src = SCHOOL.logoLeftB64;  hl.style.display = 'block'; }

  if (hr && SCHOOL.logoRightB64) { hr.src = SCHOOL.logoRightB64; hr.style.display = 'block'; }
