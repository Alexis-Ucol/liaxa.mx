<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dinámica de Placas Tectónicas y Distribución del Relieve</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Dinámica de Placas Tectónicas y Distribución del Relieve</div>
    <div class="wcourse" id="wcourse-el">Geografía · 1° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Dinámica de Placas Tectónicas y Distribución del Relieve</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="sbtn" id="dlBtn" onclick="generatePDF()" style="max-width:280px;margin:0 auto;">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   CENTRALIZED SCHOOL CONFIG (Rule 16) — ships UNBRANDED (Rule 11).
   The ONLY rebranding point. build_all.py substitutes these exact fields
   (BRAND_FIELDS / RGB_FIELDS / logo*) downstream; :root/dark stay as fallback.
   Neutral defaults below == the static :root/dark values, so unbranded == no-op.
   ══════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:'#2d3194', primaryDark:'#121441', primaryBg:'#e9e9f4',
  accent:'#c9a84c', accentBg:'#f7f1e3',
  darkPrimary:'#5256b8', darkPrimaryDark:'#8084da', darkPrimaryBg:'#111235',

function lsKey() {

function saveSession() {
  if (!studentData.name) return;
  var drawings = [], texts = [], photos = [];
  problems.forEach(function(p, i) {
    var dc = document.getElementById('dc' + i);
    if (dc && dc.width) {
      var blank = document.createElement('canvas');
      blank.width = dc.width; blank.height = dc.height;
      drawings.push(dc.toDataURL() === blank.toDataURL() ? null : dc.toDataURL('image/png'));
    } else { drawings.push(null); }
    var ta = document.getElementById('ta' + i);
    texts.push(ta ? ta.value : '');
    var pp = document.getElementById('pp' + i);
    photos.push((pp && pp.src && pp.src.indexOf('data:') === 0) ? pp.src : null);
  });
  var state = {
    name: studentData.name, group: studentData.group,
    answeredCount: answeredCount, correctCount: correctCount,
    choices: problems.map(function(p) { return p.studentChoice; }),
    drawings: drawings, texts: texts, photos: photos
  };
  try { localStorage.setItem(lsKey(), JSON.stringify(state)); } catch(e) {}
}

function loadSession(name, group) {
  var key = 'geo1_t04_g01__' + (name + '__' + group).replace(/\s+/g, '_');
  try { var r = localStorage.getItem(key); return r ? JSON.parse(r) : null; } catch(e) { return null; }
}

function restoreSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  var saved = loadSession(name, group);
  if (!saved) return;
  document.getElementById('restoreBar').style.display = 'none';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = currentAttempt(name, group);
  buildLesson(seededRng(name + group + att));
  patchProblemTotals();
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
  saved.choices.forEach(function(choice, idx) {
    if (choice !== null && choice !== undefined) confirmMC(idx, choice);
  });
  setTimeout(function() {
    if (saved.drawings) {
      saved.drawings.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var dc = document.getElementById('dc' + i);
        if (!dc || !dc.width) return;
        var img = new Image();
        img.onload = function() {
          var dpr = window.devicePixelRatio || 1;
          dc.getContext('2d').drawImage(img, 0, 0, dc.width / dpr, dc.height / dpr);
        };
        img.src = dataUrl;
      });
    }
    if (saved.texts) {
      saved.texts.forEach(function(text, i) {
        if (!text) return;
        var ta = document.getElementById('ta' + i);
        if (ta) { ta.value = text; checkTextGate(i); }
      });
    }
    if (saved.photos) {
      saved.photos.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var pp = document.getElementById('pp' + i);
        if (!pp) return;
        pp.src = dataUrl; pp.style.display = 'block';
        var pz = document.getElementById('pz' + i);
        if (pz) pz.style.opacity = '0.4';
      });
    }
  }, 300);
}

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

  buildLesson(seededRng(name + group + att));
  patchProblemTotals();
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
}

function patchProblemTotals() {
  var total = problems.length;
  for (var k = 0; k < total; k++) {
    var pnum = document.querySelector('#pc' + k + ' .pnum');
    if (pnum) pnum.title = L({ es:'Pregunta ' + (k+1) + ' de ' + total, en:'Question ' + (k+1) + ' of ' + total });
    var phdr = document.querySelector('#pc' + k + ' .phdr');
    if (phdr && !phdr.querySelector('.ptotal')) {
      var span = document.createElement('span');
      span.className = 'ptotal';
      span.style.cssText = 'margin-left:auto;font-size:.68rem;color:var(--text3);font-family:"IBM Plex Mono",monospace;white-space:nowrap;';
      span.textContent = L({ es:(k+1) + ' / ' + total, en:(k+1) + ' / ' + total });
      phdr.appendChild(span);
    }
  }
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

/* ================================================

   ================================================ */
async function generatePDF() {
  var btn = document.getElementById('dlBtn');
  btn.textContent = 'Generando PDF…';
  btn.disabled = true;

  var jspdf   = window.jspdf;
  var doc     = new jspdf.jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });
  var PW      = 215.9;
  var M       = 18;
  var TW      = PW - M * 2;
  var PH      = doc.internal.pageSize.height;
  var name    = studentData.name;
  var group   = studentData.group;
  var total   = problems.length;
  var pct     = Math.round(correctCount / total * 100);
  var dateStr = new Date().toLocaleString('es-MX', { dateStyle:'long', timeStyle:'short' });

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS — INJECTION BLOCK ─────────────────────────────────────────
  //   Match these RGB values to --green and --gold above.
  //   PRIMARY  → pBR, pBG, pBB
  //   ACCENT   → pAR, pAG, pAB
  // ──────────────────────────────────────────────────────────────────────────
  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;  // PRIMARY (from SCHOOL, Rule 16)
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;   // ACCENT (from SCHOOL, Rule 16)

  function pdfText(html) {
    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/\u2192/g,'->').replace(/\u2212/g,'-').replace(/\u00b2/g,'^2')
      .replace(/\u00b3/g,'^3').replace(/\u00d7/g,'x').replace(/\u00f7/g,'/')
      .replace(/\u2260/g,'!=').replace(/\u2264/g,'<=').replace(/\u2265/g,'>=')
      .replace(/\u221a/g,'sqrt').replace(/\u03c0/g,'pi').replace(/\u2026/g,'...')
      .replace(/\s+/g,' ').trim();
  }

  // ── PORTADA: orange line / white logo strip / orange line / blue band ──
  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,2,'F');   // top accent line
  doc.setFillColor(255,255,255); doc.rect(0,2,PW,26,'F');                               // white logo strip
  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,28,PW,2,'F');  // bottom accent line
  doc.setFillColor(pBR,pBG,pBB); doc.rect(0,30,PW,34,'F');       // blue header band

  if (SCHOOL.logoLeftB64) {
    var fmtL = SCHOOL.logoLeftB64.indexOf('/9j/') > -1 ? 'JPEG' : 'PNG';
    try { doc.addImage(SCHOOL.logoLeftB64, fmtL, M, 4, 48, 22); } catch(e) {}
  }
  if (SCHOOL.logoRightB64) {
    var fmtR = SCHOOL.logoRightB64.indexOf('/9j/') > -1 ? 'JPEG' : 'PNG';
    try { doc.addImage(SCHOOL.logoRightB64, fmtR, 130, 4, 48, 22); } catch(e) {}
  }

  var lx = PW - M - 36;
  var ly = 10;
  doc.setDrawColor(pBR,pBG,pBB); doc.setLineWidth(0.7);
  doc.lines([[2.57-1.03,4.63-6.17],[4.11-2.57,5.14-4.63],[5.66-4.11,2.57-5.14]], lx+1.03, ly+6.17);
  doc.setFillColor(pAR,pAG,pAB); doc.circle(lx+5.66, ly+2.57, 0.9, 'F');
  doc.setDrawColor(pAR,pAG,pAB); doc.setLineWidth(0.7);
  doc.line(lx+8.23, ly+1.54, lx+8.23, ly+7.2);
  doc.setTextColor(pBR,pBG,pBB); doc.setFontSize(11); doc.setFont('helvetica','bold');
  doc.text('LIAXA', lx+10, ly+6.8);

  // Guide title + date inside the blue band
  doc.setTextColor(232,238,247); doc.setFontSize(19); doc.setFont('helvetica','bold');
  doc.text(t('wtitle'), M, 49);
  doc.setTextColor(150,165,200); doc.setFontSize(8); doc.setFont('helvetica','normal');
  doc.text(dateStr, M, 59);

  // ── Student info card (name + group only — código goes to footer) ──
  doc.setFillColor(237,240,245); doc.roundedRect(M,72,TW,20,3,3,'F');
  doc.setTextColor(130,140,160); doc.setFontSize(8.5); doc.setFont('helvetica','bold');
  doc.text('ALUMNO', M+4, 79); doc.text('GRUPO', 130, 79);
  doc.setTextColor(20,24,32); doc.setFontSize(11); doc.setFont('helvetica','bold');
  doc.text(name, M+4, 87); doc.text(group, 130, 87);

  // ── Score box ──
  var sc = pct>=70?[26,106,74]:pct>=50?[224,123,26]:[176,48,16];
  doc.setFillColor(255,255,255); doc.roundedRect(M,100,TW,34,4,4,'F');
  doc.setDrawColor(sc[0],sc[1],sc[2]); doc.setLineWidth(0.8);
  doc.roundedRect(M,100,TW,34,4,4,'S');
  doc.setTextColor(sc[0],sc[1],sc[2]); doc.setFontSize(40); doc.setFont('helvetica','bold');
  doc.text(pct+'%', PW/2, 124, {align:'center'});
  doc.setTextColor(130,140,160); doc.setFontSize(8.5); doc.setFont('helvetica','normal');
  doc.text(correctCount+' correcta(s) de '+total+' preguntas', PW/2, 131, {align:'center'});

  // ── Problem summary table ──
  doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
  doc.setFontSize(7); doc.setFont('helvetica','bold');
  doc.rect(M,142,TW,8,'F'); doc.text('RESUMEN DE PROBLEMAS', M+4, 148);
  var sy = 154;
  problems.forEach(function(prob, i) {
    if (sy + 12 > PH - 15) {
      doc.addPage(); sy = 20;
      doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
      doc.setFontSize(7); doc.setFont('helvetica','bold');
      doc.rect(M,sy,TW,8,'F'); doc.text('RESUMEN DE PROBLEMAS (continuación)', M+4, sy+6);
      sy += 12;
    }
    var ok = document.getElementById('pc'+i).classList.contains('ok');
    doc.setFillColor(ok?232:255, ok?240:232, ok?232:228);
    doc.roundedRect(M,sy,TW,10,2,2,'F');
    doc.setFillColor(ok?26:176, ok?106:48, ok?74:16);
    doc.circle(M+6, sy+5, 2.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(7); doc.setFont('helvetica','bold');
    doc.text(ok?'✓':'✗', M+4.5, sy+6.5);
    doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('helvetica','normal');
    doc.text('Problema '+(i+1)+': '+pdfText(prob.title), M+12, sy+6.5);
    doc.setTextColor(ok?26:176, ok?106:48, ok?74:16);
    doc.text(ok?'Correcto':'Incorrecto', PW-M-24, sy+6.5);
    sy += 12;
  });

  // ── Per-problem pages ──
  for (var i = 0; i < problems.length; i++) {
    var prob = problems[i];
    doc.addPage();
    var wy = 0;

    doc.setFillColor(pBR,pBG,pBB); doc.rect(0,0,PW,20,'F');
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,3,'F');
    doc.setTextColor(pAR,pAG,pAB); doc.setFontSize(7); doc.setFont('helvetica','normal');
    doc.text(t('wcourse')+'  ·  '+t('wtitle'), M, 10);
    doc.setTextColor(232,238,247); doc.setFontSize(10.5); doc.setFont('helvetica','bold');
    doc.text('Problema '+(i+1)+' de '+total+'  ·  '+pdfText(prob.title), M, 17);
    wy = 25;

    var qRaw = pdfText(prob.questionText);
    doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var qLines = doc.splitTextToSize(qRaw, TW-10);
    var qBoxH  = 8 + qLines.length*5 + 3;
    doc.setFillColor(237,240,245); doc.roundedRect(M,wy,TW,qBoxH,2,2,'F');
    doc.setTextColor(pBR,pBG,pBB); doc.setFontSize(6.5); doc.setFont('helvetica','bold');
    doc.text('PREGUNTA', M+4, wy+6);
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var qy = wy+12;
    qLines.forEach(function(ln,li){ doc.text(ln, M+4, qy+li*5); });
    wy += qBoxH + 4;

    var isOk   = document.getElementById('pc'+i).classList.contains('ok');

    // ── SAVE / SHARE — iOS-safe download (LIAXA iOS PDF fix, Rule 12) ─────────

  var _fname   = 'geo1_t04_g01_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf';

  function _openPdfInline(b){
    var u = URL.createObjectURL(b);

    if (!w) { window.location.href = u; }
    setTimeout(function(){ URL.revokeObjectURL(u); }, 60000);
  }

  var _isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
               (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  if (_isIOS) {
    var _pdfFile = new File([_pdfBlob], _fname, { type:'application/pdf' });
    if (navigator.canShare && navigator.canShare({ files:[_pdfFile] })) {
      navigator.share({ files:[_pdfFile], title:_fname })
        .then(_restorePdfBtn)
        .catch(function(e){
          if (e && e.name === 'AbortError') { _restorePdfBtn(); return; }
          _openPdfInline(_pdfBlob); _restorePdfBtn();
        });
      return;
    }
    _openPdfInline(_pdfBlob); _restorePdfBtn();

  }

  var _dlUrl = URL.createObjectURL(_pdfBlob);
  var _dlA   = document.createElement('a');
  _dlA.href  = _dlUrl; _dlA.download = _fname;
  document.body.appendChild(_dlA); _dlA.click();
  setTimeout(function(){ document.body.removeChild(_dlA); URL.revokeObjectURL(_dlUrl); }, 200);
  _restorePdfBtn();

function L(o){ return (o && o[LANG] !== undefined) ? o[LANG] : (o ? o.es : ''); }
function ri(rng, a, b){ return a + Math.floor(rng() * (b - a + 1)); }
function pk(rng, a){ return a[Math.floor(rng() * a.length)]; }
function pickV(rng, V){ return V[Math.floor(rng() * V.length)]; }

function mcSpec(v){
  return { title:L(v.title), q:L(v.q), fn:'', options:L(v.opts), correct:v.ci, hint:L(v.hint), exp:L(v.exp), showWork:false };
}

function say(host, cls, msg){
  var e = host.querySelector('.gw-fb');
  if (!e) return;
  e.className = 'gw-fb' + (cls ? ' ' + cls : '');
  e.innerHTML = msg;
}

function rcard(name, form, note){
  return '<div class="rcard"><div class="rname">' + name + '</div><div class="rform">' + form + '</div><div class="rnote">' + note + '</div></div>';
}

function sec(tag, title, html){
  var d = document.createElement('div');
  d.className = 'section';
  d.innerHTML = '<div class="stag">' + tag + '</div><h2>' + title + '</h2>' + html;
  document.getElementById('lessonBody').appendChild(d);
  return d;
}

function widgetHost(parent, id){
  var d = document.createElement('div');
  d.className = 'gw';
  d.id = id;
  parent.appendChild(d);
  return d;
}

function addProblem(rng, spec){
  var idx = problems.length;
  var correctVal = spec.options[spec.correct];
  var sh = shuffle(spec.options, rng);
  var prob = {
    title: spec.title,
    questionText: spec.q,
    fn: spec.fn || '',
    hint: spec.hint || '',
    explanation: spec.exp || '',
    options: sh,
    correctIdx: sh.indexOf(correctVal),
    showWork: !!spec.showWork,
    studentChoice: null,
    pendingChoice: null
  };
  problems.push(prob);
  buildOneCard(prob, idx);
}

/* ══════════════════════════════════════════════════════════════════════════
   buildLesson :: concepto -> manipulativo -> problema, alternados (Rule 1)
   ══════════════════════════════════════════════════════════════════════════ */
function buildLesson(rng){
  injectGuideCSS();

  /* ── Apertura ── */
  sec(
    L({ es:'Punto de partida', en:'Starting point' }),
    L({ es:'Un rompecabezas que nunca deja de moverse', en:'A jigsaw that never stops moving' }),
    '<p>' + L({
      es:'Si pudieras ver la Tierra en cámara rápida, con millones de años comprimidos en unos segundos, el mapa dejaría de parecer un dibujo fijo. Los continentes se desplazarían, unos mares se cerrarían y otros se abrirían, y las montañas se levantarían como arrugas de un mantel que alguien empuja desde los extremos. La superficie sólida sobre la que caminas no es una cáscara entera: está partida en piezas enormes que se mueven unos pocos centímetros al año, lo mismo que crecen las uñas de tus manos.',
      en:'If you could watch the Earth in fast motion, with millions of years squeezed into a few seconds, the map would stop looking like a fixed drawing. Continents would shift, some seas would close and others would open, and mountains would rise like the wrinkles of a tablecloth someone pushes from the edges. The solid surface you walk on is not one whole shell: it is broken into huge pieces that move a few centimetres a year, the same rate at which your fingernails grow.'
    }) + '</p>' +
    '<div class="callout"><p><strong>' + L({ es:'Idea clave: ', en:'Key idea: ' }) + '</strong>' + L({
      es:'casi todo lo que ocurre en la superficie de la Tierra, desde una cordillera hasta un sismo o una erupción, se explica por el movimiento de esas piezas y por lo que pasa en sus bordes. En esta guía vas a bajar hasta el interior del planeta, vas a mover placas con tus propias manos y vas a terminar entendiendo por qué México tiembla donde tiembla y por qué sus volcanes están alineados.',
      en:'almost everything that happens on the surface of the Earth, from a mountain range to an earthquake or an eruption, is explained by the movement of those pieces and by what happens at their edges. In this guide you will travel down into the interior of the planet, you will move plates with your own hands and you will end up understanding why Mexico shakes where it shakes and why its volcanoes are lined up.'
    }) + '</p></div>'
  );

  /* ══ CONCEPTO 1 :: interior de la Tierra y placas ══ */
  var s1 = sec(
    L({ es:'Concepto 1', en:'Concept 1' }),
    L({ es:'La Tierra por dentro y las piezas que la cubren', en:'The Earth inside and the pieces that cover it' }),
    '<p>' + L({
      es:'El interior del planeta está organizado en capas, y lo que más importa para el relieve no es de qué están hechas sino cómo se comportan. La capa exterior, rígida y quebradiza, se llama litosfera: incluye la corteza y la parte más alta del manto, y alcanza alrededor de cien kilómetros de espesor. Esa capa rígida está rota en fragmentos llamados placas tectónicas, y cada placa puede cargar océano, continente o las dos cosas a la vez.',
      en:'The interior of the planet is organized in layers, and what matters most for relief is not what they are made of but how they behave. The outer layer, rigid and brittle, is called the lithosphere: it includes the crust and the topmost part of the mantle, and it is around one hundred kilometres thick. That rigid layer is broken into fragments called tectonic plates, and each plate can carry ocean, continent or both at once.'
    }) + '</p>' +
    '<p>' + L({
      es:'Debajo está la astenosfera, una zona del manto donde la roca, sometida a mucho calor y presión, se comporta como una masa espesa que fluye con lentitud. El calor que sale del interior pone esa masa en movimiento: el material caliente asciende, se enfría cerca de la superficie y vuelve a bajar. Ese circuito se llama corriente de convección y funciona como una banda transportadora que arrastra a las placas. Las placas también son empujadas desde las dorsales oceánicas y jaladas por su propio extremo frío cuando este se hunde.',
      en:'Below it lies the asthenosphere, a zone of the mantle where rock, under great heat and pressure, behaves like a thick mass that flows slowly. The heat coming from the interior sets that mass in motion: hot material rises, cools near the surface and sinks again. That circuit is called a convection current and it works like a conveyor belt dragging the plates. Plates are also pushed from the ocean ridges and pulled by their own cold edge when it sinks.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Litosfera', en:'Lithosphere' }), L({ es:'rígida, rota en placas', en:'rigid, broken into plates' }), L({ es:'corteza y manto superior rígido', en:'crust and rigid upper mantle' })) +
      rcard(L({ es:'Astenosfera', en:'Asthenosphere' }), L({ es:'plástica, fluye', en:'plastic, it flows' }), L({ es:'sobre ella se deslizan las placas', en:'plates slide over it' })) +
      rcard(L({ es:'Manto', en:'Mantle' }), L({ es:'la capa más gruesa', en:'the thickest layer' }), L({ es:'ahí se forman las corrientes de convección', en:'convection currents form there' })) +
      rcard(L({ es:'Núcleo', en:'Core' }), L({ es:'externo líquido, interno sólido', en:'liquid outer, solid inner' }), L({ es:'la fuente principal del calor interno', en:'the main source of internal heat' })) +
    '</div>' +
    '<div class="callout"><p>' + L({
      es:'Hace poco más de cien años, Alfred Wegener notó que las costas de África y Sudamérica encajaban y que los mismos fósiles aparecían en continentes hoy separados por un océano. Propuso que alguna vez formaron un solo bloque, Pangea. Le faltaba explicar quién los movía; la respuesta llegó décadas después con el descubrimiento de las dorsales oceánicas y de las corrientes del manto.',
      en:'A little over a hundred years ago, Alfred Wegener noticed that the coasts of Africa and South America fitted together and that the same fossils appeared on continents now separated by an ocean. He proposed that they once formed a single block, Pangaea. What he could not explain was what moved them; the answer came decades later with the discovery of the ocean ridges and of the currents in the mantle.'
    }) + '</p></div>'
  );
  w1(rng, widgetHost(s1, 'w_sonda'));
  addProblem(rng, mkP1(rng));

  /* ══ CONCEPTO 2 :: límites de placas ══ */
  var s2 = sec(
    L({ es:'Concepto 2', en:'Concept 2' }),
    L({ es:'Tres maneras de encontrarse: los límites de placas', en:'Three ways of meeting: plate boundaries' }),
    '<p>' + L({
      es:'El interior de una placa suele ser tranquilo. Lo interesante ocurre en sus bordes, y todo depende de hacia dónde apunte el movimiento de las dos placas que se tocan. Si se separan, el límite es divergente: el hueco se llena con material que sube del manto y nace corteza nueva. En el fondo del océano eso levanta una cordillera sumergida llamada dorsal, como la que recorre el Atlántico de norte a sur; en un continente abre un valle largo y hundido, como el que parte África por el este.',
      en:'The inside of a plate is usually quiet. The interesting part happens at its edges, and everything depends on where the movement of the two touching plates points. If they pull apart, the boundary is divergent: the gap is filled with material rising from the mantle and new crust is born. On the ocean floor that raises a submerged range called a ridge, like the one running down the Atlantic from north to south; on a continent it opens a long sunken valley, like the one splitting Africa in the east.'
    }) + '</p>' +
    '<p>' + L({
      es:'Si las placas se acercan, el límite es convergente y el resultado depende de quién choca con quién. Cuando una placa oceánica, más densa, se encuentra con una continental, se hunde bajo ella: eso es la subducción, y deja una fosa marina profunda del lado del mar y una cordillera con volcanes del lado del continente, como los Andes. Cuando chocan dos bloques continentales, ninguno se hunde y las rocas se pliegan hacia arriba hasta formar cordilleras gigantescas sin volcanes en el frente, como el Himalaya. Y si las placas simplemente se rozan de lado, el límite es transformante: no se crea ni se destruye corteza, pero la roca se traba y se libera de golpe, como en la falla de San Andrés.',
      en:'If the plates come closer, the boundary is convergent and the result depends on who collides with whom. When an oceanic plate, which is denser, meets a continental one, it sinks beneath it: that is subduction, and it leaves a deep sea trench on the ocean side and a range with volcanoes on the continental side, like the Andes. When two continental blocks collide, neither sinks and the rocks fold upwards into gigantic ranges with no volcanoes at the front, like the Himalaya. And if the plates simply scrape sideways, the boundary is transform: no crust is created or destroyed, but the rock locks and releases suddenly, as in the San Andreas fault.'
    }) + '</p>' +
    '<div class="rules-grid">' +

      es:'Las placas no se deslizan de manera suave: sus bordes se traban por la fricción y siguen empujando durante años, acumulando energía como un resorte que se comprime. Cuando la roca no aguanta más, se rompe y libera esa energía de golpe en forma de ondas. El punto del interior donde comienza la ruptura es el hipocentro o foco; el punto de la superficie que queda justo encima es el epicentro, y es ahí donde el movimiento suele sentirse con más fuerza.',

      en:'A volcano does not appear just anywhere. When an oceanic plate sinks in a subduction zone, it drags water and sediment down with it. At great depth that material makes the mantle rock melt at lower temperatures than usual and magma forms, which is less dense than the solid rock around it. The magma rises through cracks, gathers in a chamber and, when the pressure of the gases overcomes the rock roof, it reaches the surface and slowly builds a volcanic edifice.'

      en:'That is why volcanoes line up: they follow the line of the boundary, not the line of the borders. In Mexico, the Trans Mexican Volcanic Belt crosses the centre of the country from west to east, from Nayarit and Jalisco to Veracruz, and it holds Citlaltepetl or Pico de Orizaba, the highest summit in the country, Popocatepetl, Iztaccihuatl, Nevado de Toluca and the Colima volcano. In Michoacan, Paricutin was born in 1943 in the middle of a field, and in Chiapas rises the southern volcanic arc with Chichonal and Tacana. There is another kind of volcano, the hot spot volcano, which breaks out in the middle of a plate, as in the Hawaiian islands, but it is the exception.'

      en:'Relief is the result of a permanent contest between two teams. Internal forces, which come from the heat of the planet, build: they fold rock layers into ranges, break them along faults that lift some blocks and drop others, and add new material with every eruption. External forces, which come from the atmosphere and from water, wear down: rain, rivers, wind, ice and temperature changes break the rock, carry the fragments away and deposit them further down, where they form plains, deltas and beaches.'

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 1 :: La sonda que baja al interior de la Tierra
   ══════════════════════════════════════════════════════════════════════════ */
function w1(rng, host){
  var Z = [
    { k:'lito',  d0:0,    d1:100,  w:1.0, c:'z1', n:{ es:'Litosfera', en:'Lithosphere' } },
    { k:'asten', d0:100,  d1:700,  w:1.3, c:'z2', n:{ es:'Astenosfera', en:'Asthenosphere' } },
    { k:'manto', d0:700,  d1:2900, w:2.4, c:'z3', n:{ es:'Manto inferior', en:'Lower mantle' } },
    { k:'next',  d0:2900, d1:5150, w:2.0, c:'z4', n:{ es:'Núcleo externo', en:'Outer core' } },
    { k:'nint',  d0:5150, d1:6371, w:1.3, c:'z5', n:{ es:'Núcleo interno', en:'Inner core' } }
  ];
  var POOL = [
    { k:'lito',
      q:{ es:'Detén la sonda en la capa exterior rígida, la que está partida en placas tectónicas.',
          en:'Stop the probe in the rigid outer layer, the one broken into tectonic plates.' },
      why:{ es:'Esa capa es la litosfera: reúne la corteza y la parte más alta del manto, se comporta como un material quebradizo y por eso puede fracturarse en placas.',
            en:'That layer is the lithosphere: it gathers the crust and the topmost part of the mantle, it behaves like a brittle material and that is why it can break into plates.' } },
    { k:'asten',
      q:{ es:'Detén la sonda en la capa del manto que fluye con lentitud y sobre la cual se deslizan las placas.',
          en:'Stop the probe in the mantle layer that flows slowly and over which the plates slide.' },
      why:{ es:'Esa capa es la astenosfera. Su roca caliente se comporta como una masa espesa, y ese comportamiento plástico es lo que permite que la litosfera rígida se mueva encima.',
            en:'That layer is the asthenosphere. Its hot rock behaves like a thick mass, and that plastic behaviour is what lets the rigid lithosphere move on top.' } },
    { k:'manto',
      q:{ es:'Detén la sonda en la parte más profunda del manto, la que queda justo encima del núcleo externo.',
          en:'Stop the probe in the deepest part of the mantle, the one lying right above the outer core.' },
      why:{ es:'Es el manto inferior, la porción más voluminosa del planeta. El calor que llega del núcleo lo pone en circulación y esas corrientes acaban arrastrando a las placas.',
            en:'It is the lower mantle, the bulkiest portion of the planet. The heat arriving from the core sets it circulating and those currents end up dragging the plates.' } },
    { k:'next',
      q:{ es:'Detén la sonda en la única capa del interior que se comporta como un líquido.',
          en:'Stop the probe in the only layer of the interior that behaves like a liquid.' },
      why:{ es:'Es el núcleo externo, formado sobre todo por hierro fundido. Su movimiento genera el campo magnético que hace funcionar a las brújulas.',
            en:'It is the outer core, made mostly of molten iron. Its movement generates the magnetic field that makes compasses work.' } },
    { k:'nint',
      q:{ es:'Detén la sonda en la capa más profunda de todas, que sigue siendo sólida aunque es la más caliente.',
          en:'Stop the probe in the deepest layer of all, which stays solid even though it is the hottest.' },
      why:{ es:'Es el núcleo interno. La presión que soporta es tan enorme que mantiene sólido al hierro a pesar de la temperatura.',
            en:'It is the inner core. The pressure it bears is so enormous that it keeps the iron solid despite the temperature.' } }
  ];
  var R = shuffle(POOL, rng).slice(0, 3);
  var rd = 0, tries = 0, cur = ri(rng, 200, 6000), locked = false, done = false;
  var TOT = 0, i;
  for (i = 0; i < Z.length; i++) TOT += Z[i].w;

  var bands = '';
  for (i = 0; i < Z.length; i++) bands += '<div class="ec-z ' + Z[i].c + '" style="flex:' + Z[i].w + '">' + L(Z[i].n) + '</div>';

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Una sonda hacia el centro del planeta', en:'A probe towards the centre of the planet' }) + '</div>' +
    '<div class="gw-q" data-r="q"></div>' +
    '<div class="gw-mini">' + L({ es:'Mueve la barra para bajar o subir la sonda. El nombre de la capa cambia mientras la mueves.', en:'Move the bar to lower or raise the probe. The name of the layer changes as you move it.' }) + '</div>' +
    '<div class="ec" data-r="col">' + bands + '<div class="ec-probe" data-r="pr"><span data-r="tag"></span></div></div>' +
    '<div class="gw-num" data-r="num"></div>' +
    '<input class="gw-range" type="range" min="0" max="6371" step="1" data-r="sl">' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Comprobar', en:'Check' }) + '</button></div>' +
    '<div class="gw-fb"></div>';

  var elQ = host.querySelector('[data-r="q"]'),
      elN = host.querySelector('[data-r="num"]'),
      elS = host.querySelector('[data-r="sl"]'),
      elK = host.querySelector('[data-r="chk"]'),
      elP = host.querySelector('[data-r="pr"]'),
      elT = host.querySelector('[data-r="tag"]');

  function zoneAt(d){
    for (var j = 0; j < Z.length; j++) if (d >= Z[j].d0 && d <= Z[j].d1) return j;
    return Z.length - 1;
  }
  function topPct(d){
    var j = zoneAt(d), acc = 0;
    for (var q = 0; q < j; q++) acc += Z[q].w;
    var f = (d - Z[j].d0) / (Z[j].d1 - Z[j].d0);
    return (acc + f * Z[j].w) / TOT * 100;
  }
  function draw(){
    elQ.innerHTML = L(R[rd].q);
    elS.value = cur;
    var j = zoneAt(cur);
    elP.style.top = topPct(cur) + '%';
    elT.textContent = L(Z[j].n);
    elN.textContent = cur + ' km · ' + L(Z[j].n);
  }
  function idxOf(k){ for (var j = 0; j < Z.length; j++) if (Z[j].k === k) return j; return 0; }
  function advance(){
    rd++;
    if (rd >= R.length){
      done = true; elS.disabled = true;
      elK.textContent = L({ es:'Completado', en:'Completed' });
      elK.className = 'gw-btn solved';
      say(host, 'good', L({
        es:'Ya recorriste el interior completo. Recuerda el orden: una cáscara rígida partida en placas, debajo una capa que fluye, luego el manto profundo y al final el núcleo.',
        en:'You have now travelled the whole interior. Remember the order: a rigid shell broken into plates, below it a layer that flows, then the deep mantle and finally the core.'
      }));
      return;
    }
    locked = false; tries = 0; cur = ri(rng, 150, 6100);
    elK.textContent = L({ es:'Comprobar', en:'Check' });
    elK.className = 'gw-btn';
    say(host, '', L({ es:'Nueva instrucción. Vuelve a colocar la sonda.', en:'New instruction. Place the probe again.' }));
    draw();
  }
  function close(cls, msg){
    locked = true;
    elK.textContent = (rd === R.length - 1) ? L({ es:'Terminar', en:'Finish' }) : L({ es:'Siguiente', en:'Next' });
    elK.className = 'gw-btn solved';
    draw();
    say(host, cls, msg);
  }
  function check(){
    if (done) return;
    if (locked){ advance(); return; }
    var tj = idxOf(R[rd].k), cj = zoneAt(cur);
    if (cj === tj){ close('good', L(R[rd].why)); return; }
    tries++;
    if (tries >= 3){
      cur = Math.round((Z[tj].d0 + Z[tj].d1) / 2);
      close('warm', L({ es:'Aquí estaba la capa que buscabas. ', en:'Here was the layer you were looking for. ' }) + L(R[rd].why));
      return;
    }
    var dir = cj < tj ? L({ es:'Sigue bajando: la capa que buscas está más abajo.', en:'Keep going down: the layer you want is deeper.' })
                      : L({ es:'Te pasaste: la capa que buscas está más arriba.', en:'You went too far: the layer you want is higher up.' });
    var salto = Math.abs(cj - tj) > 1 ? L({ es:' Te faltan varias capas.', en:' You are several layers away.' }) : L({ es:' Está justo al lado.', en:' It is right next to you.' });
    say(host, 'miss', L({ es:'La sonda está en ', en:'The probe is in ' }) + L(Z[cj].n) + '. ' + dir + salto);
    draw();
  }

  elS.addEventListener('input', function(){
    if (done || locked){ elS.value = cur; return; }
    cur = parseInt(elS.value, 10);
    draw();
  });
  elK.addEventListener('click', check);
  say(host, '', L({ es:'Lee la instrucción, coloca la sonda a la profundidad correcta y comprueba.', en:'Read the instruction, place the probe at the right depth and check.' }));
  draw();
}

      q:{ es:'Consigue el borde donde hay sismos frecuentes pero no se crea ni se destruye corteza.', en:'Build the boundary where earthquakes are frequent but no crust is created or destroyed.' },
      why:{ es:'Al rozarse de lado las placas se traban y se sueltan de golpe: eso produce sismos, pero la superficie ni se agranda ni se consume. Es el caso de la falla de San Andrés.',
            en:'Scraping sideways, the plates lock and release suddenly: that produces earthquakes, but the surface neither grows nor is consumed. That is the case of the San Andreas fault.' } },
    { k:'arco',
      q:{ es:'Consigue el borde donde una fosa profunda aparece junto a una hilera de islas volcánicas.', en:'Build the boundary where a deep trench appears beside a row of volcanic islands.' },
      why:{ es:'Cuando convergen dos placas oceánicas, la más antigua y fría se hunde y el magma sale en medio del mar: se forma un arco de islas, como Japón o las Marianas.',
            en:'When two oceanic plates converge, the older and colder one sinks and the magma comes out in the middle of the sea: an island arc forms, like Japan or the Marianas.' } }
  ];
  var R = shuffle(POOL, rng).slice(0, 3);
  var rd = 0, tries = 0, locked = false, done = false;
  var dir1, dir2, tp1, tp2;

  function seed(){
    var D = ['izq', 'der', 'lado'];
    dir1 = pk(rng, D); dir2 = pk(rng, D);
    tp1 = pk(rng, ['o', 'c']); tp2 = pk(rng, ['o', 'c']);
  }
  seed();

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Mesa de límites: mueve las placas', en:'Boundary table: move the plates' }) + '</div>' +
    '<div class="gw-q" data-r="q"></div>' +
    '<div class="gw-mini">' + L({ es:'Elige el tipo de cada placa (Oceánica o Continental) y su dirección (◀ aleja = se separan, ▶ acerca = se juntan, ↔ de lado = rozan). El corte del terreno se actualiza al instante.', en:'Choose each plate\'s type (Oceanic or Continental) and its direction (◀ away = separating, ▶ toward = converging, ↔ sideways = scraping). The cross-section updates instantly.' }) + '</div>' +
    '<div class="pl">' +
      '<div class="pl-sky"></div>' +
      '<div class="pl-b b1" data-r="b1"></div>' +
      '<div class="pl-b b2" data-r="b2"></div>' +
      '<div class="pl-astn">' + L({ es:'astenosfera', en:'asthenosphere' }) + '</div>' +
    '</div>' +
    '<div class="pl-out" data-r="out"></div>' +
    '<div class="gw-lbl">' + L({ es:'Placa izquierda — tipo y dirección de movimiento', en:'Left plate — type and direction of movement' }) + '</div>' +
    '<div class="gw-row" data-r="c1">' +
      '<button class="gw-btn" data-t="o" title="' + L({ es:'Tipo: Oceánica', en:'Type: Oceanic' }) + '">' + L({ es:'Oceánica', en:'Oceanic' }) + '</button>' +
      '<button class="gw-btn" data-t="c" title="' + L({ es:'Tipo: Continental', en:'Type: Continental' }) + '">' + L({ es:'Continental', en:'Continental' }) + '</button>' +
      '<button class="gw-btn" data-d="izq" title="' + L({ es:'Se aleja (hacia la izquierda)', en:'Moves away (leftward)' }) + '">◀ ' + L({ es:'aleja', en:'away' }) + '</button>' +
      '<button class="gw-btn" data-d="der" title="' + L({ es:'Se acerca (hacia la derecha)', en:'Moves toward (rightward)' }) + '">▶ ' + L({ es:'acerca', en:'toward' }) + '</button>' +
      '<button class="gw-btn" data-d="lado">' + L({ es:'↔ de lado', en:'↔ sideways' }) + '</button>' +
    '</div>' +
    '<div class="gw-lbl">' + L({ es:'Placa derecha — tipo y dirección de movimiento', en:'Right plate — type and direction of movement' }) + '</div>' +
    '<div class="gw-row" data-r="c2">' +
      '<button class="gw-btn" data-t="o" title="' + L({ es:'Tipo: Oceánica', en:'Type: Oceanic' }) + '">' + L({ es:'Oceánica', en:'Oceanic' }) + '</button>' +
      '<button class="gw-btn" data-t="c" title="' + L({ es:'Tipo: Continental', en:'Type: Continental' }) + '">' + L({ es:'Continental', en:'Continental' }) + '</button>' +
      '<button class="gw-btn" data-d="izq" title="' + L({ es:'Se aleja (hacia la izquierda)', en:'Moves away (leftward)' }) + '">◀ ' + L({ es:'aleja', en:'away' }) + '</button>' +
      '<button class="gw-btn" data-d="der" title="' + L({ es:'Se acerca (hacia la derecha)', en:'Moves toward (rightward)' }) + '">▶ ' + L({ es:'acerca', en:'toward' }) + '</button>' +
      '<button class="gw-btn" data-d="lado">' + L({ es:'↔ de lado', en:'↔ sideways' }) + '</button>' +
    '</div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Comprobar', en:'Check' }) + '</button></div>' +
    '<div class="gw-fb"></div>';

  var elQ = host.querySelector('[data-r="q"]'),
      elO = host.querySelector('[data-r="out"]'),
      elK = host.querySelector('[data-r="chk"]'),
      b1 = host.querySelector('[data-r="b1"]'),
      b2 = host.querySelector('[data-r="b2"]'),
      c1 = host.querySelector('[data-r="c1"]'),
      c2 = host.querySelector('[data-r="c2"]');

  function motion(){
    if (dir1 === 'lado' && dir2 === 'lado') return 'lat';
    if (dir1 === 'der' && dir2 === 'izq') return 'conv';
    if (dir1 === 'izq' && dir2 === 'der') return 'div';
    if (dir1 === dir2) return 'jun';
    return 'mix';
  }
  function result(){
    var m = motion();
    if (m === 'lat') return 'falla';
    if (m === 'jun') return 'juntas';
    if (m === 'mix') return 'mixto';
    var pair = tp1 + tp2;
    if (m === 'div') return (pair === 'oo') ? 'dorsal' : (pair === 'cc' ? 'rift' : 'marJoven');
    return (pair === 'oo') ? 'arco' : (pair === 'cc' ? 'colision' : 'subduccion');
  }
  function label(t){ return t === 'o' ? L({ es:'placa oceánica', en:'oceanic plate' }) : L({ es:'placa continental', en:'continental plate' }); }
  function draw(){
    elQ.innerHTML = L(R[rd].q);
    // Build label: add ⊙ (toward viewer) / ⊗ (away from viewer) for lateral motion
    function plateLabel(tp, dir) {
      var base = label(tp);
      if (dir === 'lado') {
        // left plate comes toward viewer (⊙), right plate goes away (⊗)
        return base;
      }
      return base;
    }
    b1.textContent = plateLabel(tp1, dir1);
    b2.textContent = plateLabel(tp2, dir2);
    // Horizontal shift for convergent/divergent; NO vertical shift for lateral
    var x1 = dir1 === 'der' ? 16 : (dir1 === 'izq' ? -16 : 0);
    var x2 = dir2 === 'der' ? 16 : (dir2 === 'izq' ? -16 : 0);
    // For lateral (de lado): both plates stay at y=0, use skewY to suggest depth motion
    var skew1 = dir1 === 'lado' ? 'skewY(-6deg)' : '';
    var skew2 = dir2 === 'lado' ? 'skewY(6deg)' : '';
    b1.style.transform = 'translate(' + x1 + 'px, 0px) ' + skew1;
    b2.style.transform = 'translate(' + x2 + 'px, 0px) ' + skew2;

    // Overlay lateral-motion arrows on the plates
    var m = motion();
    if (m === 'lat') {
      b1.innerHTML = label(tp1) + '<span style="display:block;font-size:.85rem;margin-top:.1rem;letter-spacing:.05em">⊙ ' + L({ es:'sale', en:'out' }) + '</span>';
      b2.innerHTML = label(tp2) + '<span style="display:block;font-size:.85rem;margin-top:.1rem;letter-spacing:.05em">⊗ ' + L({ es:'entra', en:'in' }) + '</span>';
    } else {
      b1.textContent = label(tp1);
      b2.textContent = label(tp2);
    }
    elO.innerHTML = '<b>' + L(RES[result()]) + '</b>';
    [[c1, tp1, dir1], [c2, tp2, dir2]].forEach(function(g){
      g[0].querySelectorAll('.gw-btn').forEach(function(b){
        var on = (b.dataset.t && b.dataset.t === g[1]) || (b.dataset.d && b.dataset.d === g[2]);
        b.classList.toggle('on', !!on);
      });
    });
  }
  function bind(cont, which){
    cont.querySelectorAll('.gw-btn').forEach(function(b){
      b.addEventListener('click', function(){
        if (done || locked) return;
        if (b.dataset.t){ if (which === 1) tp1 = b.dataset.t; else tp2 = b.dataset.t; }
        else { if (which === 1) dir1 = b.dataset.d; else dir2 = b.dataset.d; }
        draw();
      });
    });
  }
  bind(c1, 1); bind(c2, 2);

  function advance(){
    rd++;
    if (rd >= R.length){
      done = true;
      elK.textContent = L({ es:'Completado', en:'Completed' });
      elK.className = 'gw-btn solved';
      say(host, 'good', L({
        es:'Ya armaste los tres bordes. Lo que decide el paisaje son dos cosas: hacia dónde se mueven las placas y de qué están hechas.',
        en:'You have now built the three boundaries. Two things decide the landscape: where the plates move and what they are made of.'
      }));
      return;
    }
    locked = false; tries = 0; seed();
    elK.textContent = L({ es:'Comprobar', en:'Check' });
    elK.className = 'gw-btn';
    say(host, '', L({ es:'Nuevo encargo. Vuelve a acomodar las placas.', en:'New assignment. Set the plates again.' }));
    draw();
  }
  function close(cls, msg){
    locked = true;
    elK.textContent = (rd === R.length - 1) ? L({ es:'Terminar', en:'Finish' }) : L({ es:'Siguiente', en:'Next' });
    elK.className = 'gw-btn solved';
    draw();
    say(host, cls, msg);
  }
  function reveal(){
    var k = R[rd].k;
    if (k === 'falla'){ dir1 = 'lado'; dir2 = 'lado'; }
    else if (k === 'dorsal'){ dir1 = 'izq'; dir2 = 'der'; tp1 = 'o'; tp2 = 'o'; }
    else if (k === 'subduccion'){ dir1 = 'der'; dir2 = 'izq'; tp1 = 'o'; tp2 = 'c'; }
    else if (k === 'colision'){ dir1 = 'der'; dir2 = 'izq'; tp1 = 'c'; tp2 = 'c'; }
    else { dir1 = 'der'; dir2 = 'izq'; tp1 = 'o'; tp2 = 'o'; }
  }
  function nudge(){
    var m = motion(), k = R[rd].k;
    var wantMove = (k === 'falla') ? 'lat' : (k === 'dorsal' ? 'div' : 'conv');
    if (m === 'jun') return L({ es:'Las dos placas viajan en el mismo sentido, así que el borde no hace nada. Dales sentidos distintos.', en:'Both plates travel the same way, so the boundary does nothing. Give them different directions.' });
    if (m === 'mix') return L({ es:'Una placa se mueve de lado y la otra de frente: decide un mismo tipo de movimiento para el borde.', en:'One plate moves sideways and the other head on: decide on one single kind of movement for the boundary.' });
    if (m !== wantMove){
      if (wantMove === 'div') return L({ es:'Con ese movimiento el borde no puede crear nada nuevo. Haz que las placas se alejen una de la otra.', en:'With that movement the boundary cannot create anything new. Make the plates move away from each other.' });
      if (wantMove === 'conv') return L({ es:'Ese borde no está apretando nada. Haz que las placas se acerquen para que una se hunda o se plieguen.', en:'That boundary is not squeezing anything. Make the plates come closer so one sinks or they fold.' });
      return L({ es:'Ese borde crea o consume corteza, y el encargo pide un contacto donde solo se rocen. Ponlas a deslizarse de lado.', en:'That boundary creates or consumes crust, and the assignment asks for a contact where they only scrape. Set them sliding sideways.' });
    }
    return L({ es:'El movimiento ya es el correcto. Ahora cambia de qué están hechas las placas: el resultado depende de si son oceánicas o continentales.', en:'The movement is already right. Now change what the plates are made of: the result depends on whether they are oceanic or continental.' });
  }
  function check(){
    if (done) return;
    if (locked){ advance(); return; }
    if (result() === R[rd].k){ close('good', L(R[rd].why)); return; }
    tries++;
    if (tries >= 3){ reveal(); close('warm', L({ es:'Esta es la combinación que lo produce. ', en:'This is the combination that produces it. ' }) + L(R[rd].why)); return; }
    say(host, 'miss', L({ es:'Con lo que tienes ahora sale esto: ', en:'What you have now gives this: ' }) + L(RES[result()]) + '. ' + nudge());
    draw();
  }
  host.querySelector('[data-r="chk"]').addEventListener('click', check);
  say(host, '', L({ es:'Lee el encargo, arma el borde y comprueba.', en:'Read the assignment, build the boundary and check.' }));
  draw();
}


/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 3 :: Reparte las placas del territorio mexicano
   ══════════════════════════════════════════════════════════════════════════ */
function w3(rng, host){
  var PAR = [
    { es:'Pacífica y Norteamericana', en:'Pacific and North American' },
    { es:'Rivera y Norteamericana', en:'Rivera and North American' },
    { es:'Cocos y Norteamericana', en:'Cocos and North American' },
    { es:'Caribe y Norteamericana', en:'Caribbean and North American' }
  ];
  var ZON = [
    { v:0, n:{ es:'Baja California y el Golfo de California', en:'Baja California and the Gulf of California' },
      why:{ es:'La península viaja sobre la placa del Pacífico, que se desliza de lado respecto a la Norteamericana y a la vez abre el golfo.',
            en:'The peninsula travels on the Pacific plate, which slides sideways relative to the North American one and at the same time opens the gulf.' } },
    { v:1, n:{ es:'Costas de Jalisco y Colima', en:'Coasts of Jalisco and Colima' },
      why:{ es:'Frente a ese tramo está la pequeña placa de Rivera, que se hunde bajo la Norteamericana y alimenta al Volcán de Colima.',
            en:'Off that stretch lies the small Rivera plate, which sinks beneath the North American one and feeds the Colima volcano.' } },
    { v:2, n:{ es:'Costas de Guerrero y Oaxaca', en:'Coasts of Guerrero and Oaxaca' },
      why:{ es:'Ahí la placa de Cocos se hunde bajo la Norteamericana y forma la Fosa Mesoamericana: es el tramo más sísmico del país.',
            en:'There the Cocos plate sinks beneath the North American one and forms the Middle America Trench: it is the most seismic stretch of the country.' } },
    { v:3, n:{ es:'Sur de Chiapas y la frontera con Guatemala', en:'Southern Chiapas and the border with Guatemala' },
      why:{ es:'En ese extremo la placa del Caribe se encuentra con la Norteamericana a lo largo de un sistema de fallas.',
            en:'At that end the Caribbean plate meets the North American one along a system of faults.' } }
  ];
  var Z = shuffle(ZON, rng);
  var tries = 0, done = false;
  var cur = [];
  for (var i = 0; i < Z.length; i++) cur.push((Z[i].v + 1 + ri(rng, 0, 2)) % 4);

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'El rompecabezas mexicano', en:'The Mexican jigsaw' }) + '</div>' +
    '<div class="gw-q">' + L({ es:'¿Qué dos placas se encuentran en cada tramo del territorio?', en:'Which two plates meet along each stretch of the territory?' }) + '</div>' +
    '<div class="gw-mini">' + L({ es:'Toca un tramo varias veces para recorrer las opciones de pares de placas (↻ cicla entre 4 opciones). Cuando los cuatro tramos te convenzan, presiona Comprobar.', en:'Tap a stretch repeatedly to cycle through the plate-pair options (↻ cycles through 4 choices). When all four stretches look right, press Check.' }) + '</div>' +
    '<div class="gw-grid" data-r="tiles"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Comprobar', en:'Check' }) + '</button></div>' +
    '<div class="gw-fb"></div>';

  var wrap = host.querySelector('[data-r="tiles"]'),
      elK = host.querySelector('[data-r="chk"]');

  function draw(){
    var h = '';
    for (var j = 0; j < Z.length; j++){
      var cls = 'gw-tile ' + ['vA', 'vB', 'vC', ''][cur[j]];
      if (done && cur[j] === Z[j].v) cls += ' good';
      h += '<button class="' + cls + '" data-i="' + j + '"' + (done ? ' disabled' : '') + '>' +
             '<span class="gw-key">' + L(Z[j].n) + (done ? '' : ' <span style="font-size:.6rem;opacity:.55;font-weight:400">↻ ' + (cur[j]+1) + '/4</span>') + '</span>' +
             '<span class="gw-sub">' + L(PAR[cur[j]]) + '</span>' +
           '</button>';
    }
    wrap.innerHTML = h;
    wrap.querySelectorAll('.gw-tile').forEach(function(b){
      b.addEventListener('click', function(){
        if (done) return;
        var k = parseInt(b.dataset.i, 10);
        cur[k] = (cur[k] + 1) % 4;
        draw();
      });
    });
  }
  function finish(cls, msg){
    done = true;
    elK.textContent = L({ es:'Completado', en:'Completed' });
    elK.className = 'gw-btn solved';
    draw();
    say(host, cls, msg);
  }
  function check(){
    if (done) return;
    var bad = [];
    for (var j = 0; j < Z.length; j++) if (cur[j] !== Z[j].v) bad.push(j);
    if (!bad.length){
      finish('good', L({ es:'Los cuatro tramos quedaron bien. Con ese mapa en la cabeza puedes anticipar dónde tiembla y dónde hay volcanes en el país.',
                         en:'All four stretches came out right. With that map in your head you can anticipate where the country shakes and where its volcanoes are.' }));
      return;
    }
    tries++;
    if (tries >= 3){
      for (var m = 0; m < Z.length; m++) cur[m] = Z[m].v;
      finish('warm', L({ es:'Este es el reparto real. ', en:'This is the real arrangement. ' }) + L(Z[bad[0]].why));
      return;
    }
    var b0 = Z[bad[0]];
    say(host, 'miss', L({ es:'Vas con ', en:'You have ' }) + (Z.length - bad.length) + L({ es:' de 4. Revisa el tramo de ', en:' out of 4. Check the stretch of ' }) + L(b0.n) +
      L({ es:': el par que le pusiste no es el que se encuentra ahí.', en:': the pair you gave it is not the one meeting there.' }));
    draw();
  }
  elK.addEventListener('click', check);
  say(host, '', L({ es:'Toca los tramos hasta que el reparto de placas te convenza.', en:'Tap the stretches until the plate arrangement convinces you.' }));
  draw();
}

  var R = [

            en:'Mexican seismicity is concentrated in the south and the west, where the territory touches the Cocos, Rivera, Pacific and Caribbean plates. The east and the peninsula are far from the boundaries.' } }

  var rd = 0, tries = 0, locked = false, done = false, items = [], on = [];
