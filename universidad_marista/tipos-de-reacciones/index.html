<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tipos de Reacciones</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }

/* ── GUIDE WIDGETS (tipos de reacciones) ── */
.iw-tag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.4rem; }
.iw-box { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; padding:1rem; }
.iw-sub { font-size:.88rem; color:var(--text2); margin-bottom:.7rem; }
.rondas { font-family:'IBM Plex Mono',monospace; font-size:.7rem; color:var(--text3); letter-spacing:.08em; text-transform:uppercase; margin-bottom:.45rem; }
.rfb { font-size:.84rem; margin-top:.6rem; min-height:1.35rem; color:var(--text2); }
.rfb b { color:var(--green-dark); }
.okmsg { color:var(--ok); font-weight:700; }
.rverify-btn { background:var(--green); color:#fff; border:none; border-radius:8px; padding:.6rem 1.2rem; font-size:.86rem; font-weight:600; cursor:pointer; min-height:44px; margin-top:.7rem; font-family:inherit; }
.rverify-btn:hover { background:var(--green-dark); }
.goalbar { font-size:.83rem; color:var(--text2); background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.45rem .7rem; margin-bottom:.65rem; }
.defgrid { display:grid; grid-template-columns:repeat(2,1fr); gap:.6rem; margin:1rem 0; }
.defcell { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.75rem; border-top:3px solid var(--green); }
.defname { font-size:.72rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.25rem; }
.deftxt { font-size:.82rem; color:var(--text2); }
.dataline { font-family:'IBM Plex Mono',monospace; font-size:.82rem; color:var(--green-dark); background:var(--surface2); border-radius:8px; padding:.5rem .7rem; margin:.5rem 0; overflow-x:auto; }
.notabox { font-family:'IBM Plex Mono',monospace; font-size:1.02rem; font-weight:700; color:var(--green-dark); text-align:center; margin:.6rem 0; overflow-x:auto; }
.readrow { display:grid; grid-template-columns:repeat(3,1fr); gap:.5rem; margin-top:.8rem; }
.readcell { background:var(--surface2); border-radius:8px; padding:.55rem; text-align:center; }
.readlbl { font-size:.64rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.readnum { font-family:'IBM Plex Mono',monospace; font-size:1rem; font-weight:700; color:var(--green-dark); }
/* balanza de átomos */
.eqrow { display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:center; gap:.35rem; margin:.7rem 0; }
.eqsp { display:flex; flex-direction:column; align-items:center; gap:.3rem; }
.eqform { font-family:'IBM Plex Mono',monospace; font-size:1rem; font-weight:700; color:var(--green-dark); }
.eqctr { display:flex; align-items:center; gap:.2rem; }
.coefbtn { width:44px; height:44px; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:1rem; font-weight:700; cursor:pointer; font-family:inherit; }
.coefbtn:hover { border-color:var(--green); color:var(--green); }
.coefval { font-family:'IBM Plex Mono',monospace; font-size:1.05rem; font-weight:700; min-width:28px; text-align:center; color:var(--green); }
.eqop { font-family:'IBM Plex Mono',monospace; font-size:1.05rem; color:var(--text3); padding-bottom:.7rem; }
.atomtab { display:flex; flex-direction:column; gap:.3rem; margin-top:.8rem; }
.atomrow { display:grid; grid-template-columns:.8fr 1fr 1fr 1.5fr; gap:.35rem; align-items:center; background:var(--surface2); border-radius:8px; padding:.4rem .5rem; }
.atomrow.head { background:none; padding:0 .5rem; }
.atomcell { font-family:'IBM Plex Mono',monospace; font-size:.86rem; text-align:center; color:var(--text2); }
.atomcell.el { font-weight:700; color:var(--green-dark); }
.atomcell.hd { font-family:'IBM Plex Sans',sans-serif; font-size:.62rem; text-transform:uppercase; letter-spacing:.05em; color:var(--text3); }
.atomstate { font-size:.72rem; text-align:center; font-weight:700; color:var(--bad); }
.atomstate.ok { color:var(--ok); }
/* armador de reacciones */
.pool { border:1.5px dashed var(--border); border-radius:10px; padding:.5rem; background:var(--surface); min-height:62px; text-align:center; }
.zones { display:grid; grid-template-columns:1fr 1fr; gap:.5rem; margin:.5rem 0; }
.zone { border:1.5px dashed var(--border); border-radius:10px; min-height:82px; padding:.5rem; background:var(--surface2); text-align:center; }
.zonelbl { font-size:.64rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.3rem; }
.tile { display:inline-block; font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:.9rem; color:var(--green-dark); border:1.5px solid var(--border); border-radius:8px; background:var(--surface); padding:.55rem .7rem; margin:.2rem; cursor:pointer; min-height:44px; }
.tile:hover { border-color:var(--green); }
.arrowmid { text-align:center; font-family:'IBM Plex Mono',monospace; color:var(--text3); font-size:.9rem; }
/* intercambio de socios */
.chiprow { display:flex; flex-wrap:wrap; gap:.5rem; justify-content:center; margin:.6rem 0; }
.swapchip { border:1.5px solid var(--border); border-radius:22px; background:var(--surface2); color:var(--text); font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:.9rem; padding:.5rem 1.1rem; min-height:44px; cursor:pointer; }
.swapchip:hover { border-color:var(--green); }
.swapchip.sel { border-color:var(--gold); background:var(--gold-bg); color:var(--green-dark); }
.prodbox { font-family:'IBM Plex Mono',monospace; font-size:1rem; font-weight:700; text-align:center; color:var(--green-dark); background:var(--surface2); border-radius:8px; padding:.6rem; margin-top:.5rem; overflow-x:auto; }
/* neutralización */
.titrow { display:flex; align-items:flex-end; justify-content:center; gap:1.2rem; margin:.7rem 0 .3rem; flex-wrap:wrap; }
.beaker { position:relative; width:96px; height:124px; border:2px solid var(--border); border-top:none; border-radius:0 0 16px 16px; background:var(--surface2); overflow:hidden; }
.beakfill { position:absolute; left:0; right:0; bottom:0; background:var(--bad); transition:height .25s; }
.beakfill.neu { background:var(--ok); }
.beakfill.base { background:var(--green); }
.titside { display:flex; flex-direction:column; gap:.3rem; }
.titbig { font-family:'IBM Plex Mono',monospace; font-size:1.3rem; font-weight:700; color:var(--green-dark); }
.titlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); }
.statechip { display:inline-block; font-size:.72rem; font-weight:700; letter-spacing:.05em; text-transform:uppercase; border-radius:20px; padding:.2rem .7rem; background:var(--surface2); color:var(--text3); }
.statechip.acid { background:var(--bad-bg); color:var(--bad); }
.statechip.neu { background:var(--ok-bg); color:var(--ok); }
.statechip.base { background:var(--green-bg); color:var(--green-dark); }
.krow { display:flex; align-items:center; gap:.6rem; margin-top:.7rem; flex-wrap:wrap; }
.krow input[type=range] { flex:1; min-width:150px; accent-color:var(--green); height:44px; }
.klbl { font-size:.76rem; color:var(--text3); min-width:120px; }
.kval { font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:.95rem; color:var(--green); min-width:76px; text-align:right; }
/* clasificador */
.cls-prog { font-family:'IBM Plex Mono',monospace; font-size:.7rem; color:var(--text3); letter-spacing:.08em; text-transform:uppercase; margin-bottom:.45rem; }
.cls-card { background:var(--surface2); border:1.5px solid var(--border); border-radius:10px; padding:.85rem; text-align:center; font-weight:700; font-family:'IBM Plex Mono',monospace; font-size:.95rem; margin:.6rem 0; color:var(--green-dark); overflow-x:auto; }
.cls-bins { display:grid; grid-template-columns:1fr 1fr; gap:.5rem; }
.cls-bin { min-height:44px; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.84rem; font-weight:600; cursor:pointer; font-family:inherit; padding:.5rem; }
.cls-bin:hover { border-color:var(--green); color:var(--green); }
.cls-done { font-weight:700; color:var(--ok); text-align:center; padding:.6rem; }
@media (max-width:600px) {
  .defgrid { grid-template-columns:1fr; }
  .readrow { grid-template-columns:1fr 1fr; }
  .zones { grid-template-columns:1fr; }
  .cls-bins { grid-template-columns:1fr; }
  .klbl { min-width:92px; }
  .kval { min-width:66px; }
  .dataline { font-size:.72rem; }
  .notabox { font-size:.9rem; }
  .eqform { font-size:.9rem; }
  .atomcell { font-size:.78rem; }
  .prodbox { font-size:.88rem; }
}
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Tipos de Reacciones</div>
    <div class="wcourse" id="wcourse-el">Reacciones Químicas: Conservación de la Materia · Sem 2</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Tipos de Reacciones</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="sbtn" id="dlBtn" onclick="generatePDF()" style="max-width:280px;margin:0 auto;">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

function saveSession() {
  if (!studentData.name) return;
  var drawings = [], texts = [], photos = [];
  problems.forEach(function(p, i) {
    var dc = document.getElementById('dc' + i);
    if (dc && dc.width) {
      var blank = document.createElement('canvas');
      blank.width = dc.width; blank.height = dc.height;
      drawings.push(dc.toDataURL() === blank.toDataURL() ? null : dc.toDataURL('image/png'));
    } else { drawings.push(null); }
    var ta = document.getElementById('ta' + i);
    texts.push(ta ? ta.value : '');
    var pp = document.getElementById('pp' + i);
    photos.push((pp && pp.src && pp.src.indexOf('data:') === 0) ? pp.src : null);
  });
  var state = {
    name: studentData.name, group: studentData.group,
    answeredCount: answeredCount, correctCount: correctCount,
    choices: problems.map(function(p) { return p.studentChoice; }),
    drawings: drawings, texts: texts, photos: photos
  };
  try { localStorage.setItem(lsKey(), JSON.stringify(state)); } catch(e) {}
}

function loadSession(name, group) {
  var key = 'liaxa_cneyt2a_t01_g01__' + (name + '__' + group).replace(/\s+/g, '_');
  try { var r = localStorage.getItem(key); return r ? JSON.parse(r) : null; } catch(e) { return null; }
}

function restoreSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  var saved = loadSession(name, group);
  if (!saved) return;
  document.getElementById('restoreBar').style.display = 'none';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = currentAttempt(name, group);
  buildLesson(seededRng(name + group + att));
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
  saved.choices.forEach(function(choice, idx) {
    if (choice !== null && choice !== undefined) confirmMC(idx, choice);
  });
  setTimeout(function() {
    if (saved.drawings) {
      saved.drawings.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var dc = document.getElementById('dc' + i);
        if (!dc || !dc.width) return;
        var img = new Image();
        img.onload = function() {
          var dpr = window.devicePixelRatio || 1;
          dc.getContext('2d').drawImage(img, 0, 0, dc.width / dpr, dc.height / dpr);
        };
        img.src = dataUrl;
      });
    }
    if (saved.texts) {
      saved.texts.forEach(function(text, i) {
        if (!text) return;
        var ta = document.getElementById('ta' + i);
        if (ta) ta.value = text;
      });
    }
    if (saved.photos) {
      saved.photos.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var pp = document.getElementById('pp' + i);
        if (!pp) return;
        pp.src = dataUrl; pp.style.display = 'block';
        var pz = document.getElementById('pz' + i);
        if (pz) pz.style.opacity = '0.4';
      });
    }
  }, 300);
}

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

  err.textContent = '';
  studentData = { name: name, group: group };
  answeredCount = 0;
  correctCount  = 0;
  var att = nextAttempt(name, group);
  buildLesson(seededRng(name + group + att));
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

      .replace(/\u2192/g,'->').replace(/\u2212/g,'-').replace(/\u00b2/g,'^2')

        doc.addImage(imgD, 'PNG', M, wy, iw, ih);
        wy += ih + 4;
      } catch(e) {}
    }

    var ta = document.getElementById('ta'+i);
    if (ta && ta.value.trim()) {
      if (wy > PH-30) { doc.addPage(); wy = 20; }
      doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('courier','normal');
      var taLines = doc.splitTextToSize(ta.value, TW);
      taLines.slice(0,16).forEach(function(ln) {
        if (wy > PH-15) { doc.addPage(); wy = 20; }
        doc.text(ln, M, wy); wy += 5;
      });
      wy += 2;
    }

    var pp = document.getElementById('pp'+i);
    if (pp && pp.src && pp.src.indexOf('data:') === 0) {
      if (wy > PH-55) { doc.addPage(); wy = 20; }
      try { doc.addImage(pp.src, 'JPEG', M, wy, TW, 68); wy += 72; } catch(e) {}
    }
  }

  // ── Footer on every page ──
  var pages = doc.internal.getNumberOfPages();
  for (var p = 1; p <= pages; p++) {
    doc.setPage(p);
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0, PH-3, PW, 3, 'F');
    doc.setTextColor(130,140,160); doc.setFontSize(6.5); doc.setFont('helvetica','normal');
    doc.text(name+'  ·  '+group+'  ·  Código: '+code+'  ·  Página '+p+'/'+pages,
      PW/2, PH-5, {align:'center'});
  }

  doc.save('cneyt2a_t01_g01_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf');
  btn.innerHTML = '⬇ &nbsp;Descargar Resultados PDF';
  btn.disabled  = false;
}

   ================================================ */
function buildLesson(rng) {
  var LB = document.getElementById('lessonBody');
  LB.innerHTML = '';
  problems = [];

  /* ============================================================
     HELPERS
     ============================================================ */
  function T(o){
    if (o === undefined || o === null) return '';
    if (typeof o === 'string' || typeof o === 'number') return o;
    if (Object.prototype.toString.call(o) === '[object Array]') return o;
    return (o[LANG] !== undefined ? o[LANG] : o.es);
  }
  function ri(a,b){ return a + Math.floor(rng()*(b-a+1)); }
  function shufA(arr){
    var a = arr.slice(), i, j, t;
    for (i=a.length-1;i>0;i--){ j=Math.floor(rng()*(i+1)); t=a[i]; a[i]=a[j]; a[j]=t; }
    return a;
  }
  function sec(tag, title, html){
    var d = document.createElement('div');
    d.className = 'section';
    d.innerHTML = '<div class="stag">'+tag+'</div><h2>'+title+'</h2>'+(html||'');
    LB.appendChild(d);
    return d;
  }
  function widget(kind){
    var d = document.createElement('div');
    d.className = kind + 'wrap section';
    d.setAttribute('data-widget', kind);
    d.id = 'w' + kind;
    LB.appendChild(d);
    return d;
  }
  function gm(x){ return x + ' g'; }
  function mlv(x){ return x + ' mL'; }
  function f2(x){ return x.toFixed(2); }
  function gcdList(list){
    function gg(a,b){ while(b){ var t=a%b; a=b; b=t; } return a; }
    var g = list[0], i;
    for (i=1;i<list.length;i++) g = gg(g, list[i]);
    return g;
  }
  function atomsOf(sp, cf){
    var tot = {}, i, k;
    for (i=0;i<sp.length;i++){
      for (k in sp[i].a){ if (Object.prototype.hasOwnProperty.call(sp[i].a,k)) tot[k] = (tot[k]||0) + sp[i].a[k]*cf[i]; }
    }
    return tot;
  }
  function elemsOf(l, r){
    var out = [], i, k;
    function add(sp){ for (k in sp.a){ if (Object.prototype.hasOwnProperty.call(sp.a,k) && out.indexOf(k) < 0) out.push(k); } }
    for (i=0;i<l.length;i++) add(l[i]);
    for (i=0;i<r.length;i++) add(r[i]);

  /* ---- MANIPULATIVO 1: balanza de átomos ---- */
  (function(){

      var t = tally(), rows = '', bad = null;

                   : (L > R ? T({es:'Sobran '+(L-R)+' a la izquierda', en:(L-R)+' extra on the left'})
                            : T({es:'Sobran '+(R-L)+' a la derecha', en:(R-L)+' extra on the right'})))+'</div></div>';
      }

      if (bad){
        live = T({es:'El '+bad.el+' todavía no cuadra: '+bad.L+' átomos entre los reactivos y '+bad.R+' entre los productos. Sube el coeficiente del lado que va corto.',
                  en:'Element '+bad.el+' does not match yet: '+bad.L+' atoms among the reactants and '+bad.R+' among the products. Raise the coefficient on the side that falls short.'});
      } else if (gcdList(st.c) > 1){
        live = T({es:'El inventario ya cuadra, pero todos los coeficientes se pueden dividir entre '+gcdList(st.c)+'. Busca el conjunto más pequeño.',
                  en:'The inventory already matches, but every coefficient can be divided by '+gcdList(st.c)+'. Look for the smallest set.'});
      } else {
        live = T({es:'Cada elemento aparece el mismo número de veces en los dos lados. Comprueba el resultado.',
                  en:'Every element appears the same number of times on both sides. Check the result.'});
      }
      wrap.innerHTML = head()+
        '<div class="iw-box">'+
          '<div class="rondas">'+T({es:'Ronda',en:'Round'})+' '+(st.r+1)+' / 3</div>'+
          '<div class="iw-sub">'+T({
            es:'Sube y baja los coeficientes con los botones y observa cómo cambia el inventario de átomos de la tabla. Los subíndices de las fórmulas no se tocan.',

        return;

      var goalTxt = d.goal === 0
        ? T({es:'Objetivo: coloca las piezas para que la reacción produzca '+nm+' como única sustancia final.',

        : T({es:'Objetivo: coloca las piezas para que '+nm+' sea la única sustancia de partida y se separe en las demás.',
             en:'Goal: place the pieces so that '+nm+' is the only starting substance and it splits into the others.'});
      var L = zoneList(1), R = zoneList(2), P = zoneList(0);
      var live;
      if (P.length){

        live = T({es:'Una reacción necesita al menos una sustancia de cada lado de la flecha.',

      } else {
        var la = atomsOf(d.d.tiles, st.place.map(function(p){ return p === 1 ? 1 : 0; }));
        var ra = atomsOf(d.d.tiles, st.place.map(function(p){ return p === 2 ? 1 : 0; }));
        var els = elemsOf(d.d.tiles, []), i, bad = null;

          live = T({es:'Entran '+L.length+' y salen '+R.length+', pero el inventario no cuadra: hay '+(la[bad]||0)+' átomos de '+bad+' de un lado y '+(ra[bad]||0)+' del otro.',
                    en:'There are '+L.length+' going in and '+R.length+' coming out, but the inventory does not match: there are '+(la[bad]||0)+' atoms of '+bad+' on one side and '+(ra[bad]||0)+' on the other.'});
        } else {
          live = T({es:'Entran '+L.length+' sustancia(s) y sale(n) '+R.length+', con el mismo inventario de átomos en los dos lados.',
                    en:'There are '+L.length+' substance(s) going in and '+R.length+' coming out, with the same atom inventory on both sides.'});
        }
      }
      wrap.innerHTML = head()+
        '<div class="iw-box">'+
          '<div class="rondas">'+T({es:'Ronda',en:'Round'})+' '+(st.r+1)+' / 3</div>'+

          '<div class="zones">'+
            '<div class="zone"><div class="zonelbl">'+T({es:'Reactivos',en:'Reactants'})+'</div>'+(tiles(1) || '')+'</div>'+

               en:'This is how it looks: a single substance goes in and several come out, which is the mark of a decomposition.'});

        : T({es:'Todavía no. En una descomposición el lado de los reactivos termina con una sola pieza.',
             en:'Not yet. In a decomposition the reactant side ends with a single piece.'});
    };

    addProb({
      title:{es:'El volumen del punto exacto', en:'The volume of the exact point'},
      q:{es:'Se neutralizan por completo '+d.va+' mL de una disolución de '+T(d.an)+' de concentración '+d.ca+' mol/L con una disolución de '+T(d.bn)+' de concentración '+d.cb+' mol/L. Determina el volumen de disolución básica que se necesita.',
         en:'A volume of '+d.va+' mL of a '+T(d.an)+' solution at a concentration of '+d.ca+' mol/L is completely neutralised with a '+T(d.bn)+' solution at a concentration of '+d.cb+' mol/L. Determine the volume of basic solution needed.'},
      options: [mlv(d.ans), mlv(d.dis[0]), mlv(d.dis[1]), mlv(d.dis[2])],
      correct: mlv(d.ans),
      hint:{es:'Calcula primero cuántos milimoles de iones hidrógeno hay en la porción de ácido, sin olvidar cuántos aporta cada unidad de ese ácido, y averigua después qué volumen de base contiene esa misma cantidad de iones hidróxido.',
            en:'First calculate how many millimoles of hydrogen ions there are in the acid portion, without forgetting how many each unit of that acid supplies, and then work out which volume of base contains that same amount of hydroxide ions.'},
      exp: p8v
        ? {es:'Cada unidad de '+d.an.es+' aporta dos iones hidrógeno, así que los '+d.va+' mL contienen '+f2(mh)+' mmol de iones hidrógeno. Para igualarlos hacen falta '+f2(mh)+' mmol de iones hidróxido, que ocupan '+d.ans+' mL de una disolución de '+d.cb+' mol/L. El valor '+d.half+' mL es el que sale de olvidar el segundo ion hidrógeno del ácido, y suponer volúmenes iguales ignora que las concentraciones son distintas.',
           en:'Each unit of '+d.an.en+' supplies two hydrogen ions, so the '+d.va+' mL contain '+f2(mh)+' mmol of hydrogen ions. Matching them requires '+f2(mh)+' mmol of hydroxide ions, which occupy '+d.ans+' mL of a solution at '+d.cb+' mol/L. The value '+d.half+' mL is what comes from forgetting the second hydrogen ion of the acid, and assuming equal volumes ignores that the concentrations differ.'}
        : {es:'La porción de ácido contiene '+f2(mh)+' mmol de iones hidrógeno, porque cada unidad de '+d.an.es+' aporta uno solo. La neutralización completa exige la misma cantidad de iones hidróxido, y esa cantidad se alcanza con '+d.ans+' mL de la disolución de '+d.cb+' mol/L. Responder con el mismo volumen del ácido supone que las dos disoluciones están igual de concentradas, lo que aquí no ocurre.',
           en:'The acid portion contains '+f2(mh)+' mmol of hydrogen ions, because each unit of '+d.an.en+' supplies only one. Complete neutralisation demands the same amount of hydroxide ions, and that amount is reached with '+d.ans+' mL of the solution at '+d.cb+' mol/L. Answering with the same volume as the acid assumes both solutions are equally concentrated, which is not the case here.'},
      showWork:true });
  })();

  /* ---- MANIPULATIVO 5: clasificador de ecuaciones ---- */
  (function(){
    var wrap = widget('clasifica');
    var st = { i:0, tries:0, correct:0, done:false };
    function item(){ return CLSPOOL[clsPickIdx[st.i]]; }
    function head(){ return '<div class="iw-tag">'+T({es:'Clasificador de ecuaciones', en:'Equation sorter'})+'</div>'; }
    function render(){
      if (st.done){
        wrap.innerHTML = head()+'<div class="iw-box"><div class="cls-done">🎉 '+T({
          es:'Clasificación terminada: '+st.correct+' de '+clsPickIdx.length+' a la primera. Cada tipo se reconoce por el reparto de sustancias, no por las fórmulas concretas.',
          en:'Sorting finished: '+st.correct+' out of '+clsPickIdx.length+' on the first try. Each type is recognised by how the substances are shared out, not by the particular formulas.'})+'</div></div>';
        return;
      }
      var bins = T(TIPOS), i, bt = '';
      for (i=0;i<bins.length;i++) bt += '<button class="cls-bin" onclick="clTap('+i+')">'+bins[i]+'</button>';
      wrap.innerHTML = head()+
        '<div class="iw-box">'+
          '<div class="cls-prog">'+(st.i+1)+' / '+clsPickIdx.length+'</div>'+
          '<div class="iw-sub">'+T({
            es:'Lee la ecuación y envíala al grupo que le corresponde. Si fallas, la pista te dirá dónde mirar.',
            en:'Read the equation and send it to the group it belongs to. If you miss, the hint will tell you where to look.'})+'</div>'+
          '<div class="cls-card">'+item().eq+'</div>'+
          '<div class="cls-bins">'+bt+'</div>'+
          '<div class="rfb" id="clFb"></div>'+
        '</div>';
    }
    window.clTap = function(bi){
      if (st.done) return;
      var it = item(), fb;
      if (bi === it.bin){
        if (st.tries === 0) st.correct++;
        st.tries = 0; st.i++;
        if (st.i >= clsPickIdx.length) st.done = true;
        render();
        if (!st.done){ fb = document.getElementById('clFb'); if (fb) fb.innerHTML = '<span class="okmsg">✓ '+T({es:'Correcto. Sigue la siguiente.', en:'Correct. On to the next one.'})+'</span>'; }
        return;
      }
      st.tries++;
      fb = document.getElementById('clFb');
      if (st.tries >= 3){
        fb.innerHTML = T({es:'Era <b>'+T(TIPOS)[it.bin]+'</b>. Cuenta las sustancias de cada lado y revisa si alguna queda libre o si hay agua entre los productos.',
                          en:'It was <b>'+T(TIPOS)[it.bin]+'</b>. Count the substances on each side and check whether any is left free or whether water appears among the products.'});
        st.tries = 0; st.i++;
        if (st.i >= clsPickIdx.length) st.done = true;
        setTimeout(render, 2200);
        return;
      }
      fb.textContent = T({es:'Vuelve a intentar. Pregunta primero cuántas sustancias entran y cuántas salen, y después quién cambia de pareja.',
                          en:'Try again. Ask first how many substances go in and how many come out, and then who changes partner.'});
    };
    render();
  })();

  /* ============================================================
     CIERRE
     ============================================================ */
  sec(T({es:'Cierre', en:'Closing'}),
      T({es:'Dos registros de laboratorio', en:'Two laboratory records'}),
      '<p>'+T({
        es:'Las dos situaciones siguientes llegan tal como aparecen en una libreta de laboratorio, con una ecuación anotada y una observación hecha durante el experimento. Cada una se resuelve con lo que ya trabajaste en esta guía.',
        en:'The two situations below arrive just as they appear in a laboratory notebook, with an equation written down and an observation made during the experiment. Each one is settled with what you already worked through in this guide.'
      })+'</p>');

  /* ---- P9 ---- */
  (function(){
    var byBin = [[],[],[],[]], i;
    for (i=0;i<CLSPOOL.length;i++) byBin[CLSPOOL[i].bin].push(CLSPOOL[i].eq);
    var tgt = p9t;
    var cor = byBin[tgt][p9j % byBin[tgt].length];
    var others = [];
    for (i=0;i<4;i++){
      if (i === tgt) continue;
      if (tgt === 2 && i === 3) continue;   /* una neutralización también intercambia parejas */
      others.push(byBin[i]);
    }
    var dis = [];
    for (i=0;i<others.length;i++) dis.push(others[i][(p9j+i) % others[i].length]);
    while (dis.length < 3){
      var pool = others[dis.length % others.length];
      var cand = pool[(p9j+dis.length+1) % pool.length];
      if (dis.indexOf(cand) < 0 && cand !== cor) dis.push(cand); else dis.push(pool[(p9j+dis.length+2) % pool.length]);
    }
    var nombre = { es:['una síntesis','una descomposición','una sustitución','una neutralización'],
                   en:['a synthesis','a decomposition','a substitution','a neutralisation'] };
    var razon = {
      es:['dos sustancias se combinan y dejan una sola','una sola sustancia se separa en varias',
          'las sustancias intercambian sus parejas sin cambiar de número','un ácido y una base producen una sal y agua'],
      en:['two substances combine and leave a single one','a single substance separates into several',
          'the substances exchange their partners without changing in number','an acid and a base produce a salt and water']
    };
    addProb({
      title:{es:'Encuentra la ecuación', en:'Find the equation'},
      q:{es:'Una libreta de laboratorio reúne cuatro ecuaciones de sesiones distintas. Identifica la que corresponde a '+T(nombre)[tgt]+'.',
         en:'A laboratory notebook gathers four equations from different sessions. Identify the one that corresponds to '+T(nombre)[tgt]+'.'},
      options: [cor].concat(dis.slice(0,3)),
      correct: cor,
      hint:{es:'Revisa cada ecuación por separado y anota cuántas sustancias hay antes y después de la flecha, además de si alguna sustancia aparece sola o si entre los productos hay agua.',
            en:'Go through each equation on its own and note how many substances there are before and after the arrow, along with whether any substance appears on its own or whether water shows up among the products.'},
      exp:{es:'La ecuación '+cor+' es la buscada, porque en ella '+T(razon)[tgt]+'. Las otras tres pertenecen a familias distintas, y basta contar sustancias y observar quién cambia de pareja para separarlas.',
           en:'The equation '+cor+' is the one being looked for, because in it '+T(razon)[tgt]+'. The other three belong to different families, and counting substances and observing who changes partner is enough to tell them apart.'},
      showWork:false });
  })();

  /* ---- P10 ---- */
  (function(){
    var A = {
      q:{es:'Se calienta carbonato de calcio en un crisol abierto y ocurre el cambio CaCO₃ → CaO + CO₂. La balanza marca menos masa al final que al principio, y un estudiante concluye que en esa reacción la materia no se conservó. Identifica el error de esa conclusión.',
         en:'Calcium carbonate is heated in an open crucible and the change CaCO₃ → CaO + CO₂ takes place. The balance reads less mass at the end than at the start, and a student concludes that matter was not conserved in that reaction. Identify the error in that conclusion.'},
      opt:{es:['El dióxido de carbono salió del crisol abierto, de modo que su masa dejó de aparecer en la balanza aunque sus átomos siguen existiendo.',
               'Una parte de los átomos de carbono se destruyó durante el calentamiento, y por eso la masa final resultó menor que la inicial.',
               'El calor absorbido por la muestra se descuenta de su masa, y por eso toda reacción que requiere calor pesa menos al terminar.',
               'La conservación de la materia se cumple solo en las reacciones de síntesis, mientras que las descomposiciones siempre pierden masa.'],
           en:['The carbon dioxide left the open crucible, so its mass stopped appearing on the balance even though its atoms still exist.',
               'Part of the carbon atoms were destroyed during the heating, and that is why the final mass turned out smaller than the initial one.',
               'The heat absorbed by the sample is discounted from its mass, and that is why any reaction needing heat weighs less at the end.',
               'Conservation of matter holds only in synthesis reactions, while decompositions always lose mass.']},
      exp:{es:'La balanza solo registra lo que permanece en el crisol, y uno de los productos es un gas que se dispersó en el aire. Si el mismo cambio ocurriera en un recipiente cerrado, la masa final coincidiría con la inicial. Los átomos de carbono no se destruyen, el calor no se descuenta de la masa y la conservación de la materia rige en cualquier tipo de reacción.',
           en:'The balance only records what stays inside the crucible, and one of the products is a gas that spread into the air. If the same change happened in a sealed container, the final mass would match the initial one. Carbon atoms are not destroyed, heat is not discounted from mass, and conservation of matter governs every type of reaction.'} };
    var B = {
      q:{es:'Se deja caer zinc en ácido clorhídrico dentro de un vaso abierto y ocurre el cambio Zn + 2 HCl → ZnCl₂ + H₂. La balanza marca menos masa al final que al principio, y un estudiante concluye que parte de la materia desapareció. Identifica el error de esa conclusión.',
         en:'Zinc is dropped into hydrochloric acid in an open beaker and the change Zn + 2 HCl → ZnCl₂ + H₂ takes place. The balance reads less mass at the end than at the start, and a student concludes that part of the matter disappeared. Identify the error in that conclusion.'},
      opt:{es:['El hidrógeno formado escapó del vaso abierto, de modo que su masa dejó de aparecer en la balanza aunque sus átomos siguen existiendo.',
               'Una parte de los átomos de hidrógeno se destruyó al separarse del cloro, y por eso la masa final resultó menor que la inicial.',
               'El zinc que se disuelve deja de ser materia al pasar a la disolución, y por eso la balanza registra una masa menor.',
               'La conservación de la materia se cumple solo cuando todos los productos son sólidos, y aquí uno de ellos no lo es.'],
           en:['The hydrogen formed escaped from the open beaker, so its mass stopped appearing on the balance even though its atoms still exist.',
               'Part of the hydrogen atoms were destroyed on separating from the chlorine, and that is why the final mass turned out smaller than the initial one.',
               'The zinc that dissolves stops being matter when it passes into the solution, and that is why the balance records a smaller mass.',
               'Conservation of matter holds only when every product is a solid, and here one of them is not.']},
      exp:{es:'El hidrógeno es un gas y abandona el vaso abierto en cuanto se forma, así que la balanza deja de contarlo aunque sus átomos sigan intactos. Repetido en un recipiente cerrado, el mismo cambio dejaría la masa total sin variación. Ni los átomos se destruyen al separarse ni una sustancia deja de ser materia por disolverse.',
           en:'Hydrogen is a gas and leaves the open beaker as soon as it forms, so the balance stops counting it even though its atoms remain intact. Repeated in a sealed container, the same change would leave the total mass unchanged. Atoms are not destroyed on separating, and a substance does not stop being matter by dissolving.'} };
    var d = v10 ? B : A;
    addProb({
      title:{es:'La balanza que parece fallar', en:'The balance that seems to fail'},
      q: d.q, options: d.opt, correct: T(d.opt)[0],
      hint:{es:'Pregúntate qué sustancias siguen dentro del recipiente al terminar y cuáles ya no lo están, antes de decidir si el problema está en la materia o en lo que la balanza alcanza a medir.',
            en:'Ask yourself which substances are still inside the container at the end and which are not, before deciding whether the problem lies in the matter or in what the balance manages to measure.'},
      exp: d.exp, showWork:false });
  })();
}
</script>

<!-- LIAXA ANALYTICS -->
<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbzLGV15JRTPs9bbSvHRLfgOXeT9oUExDf1AH546WOwq5tYxXSdhX212OWi_bTJfMGx9/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'Tipos de Reacciones';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
