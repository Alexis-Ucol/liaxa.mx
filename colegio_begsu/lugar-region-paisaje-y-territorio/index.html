<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lugar, Región, Paisaje y Territorio</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; text-align: justify; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Lugar, Región, Paisaje y Territorio</div>
    <div class="wcourse" id="wcourse-el">Geografía · 1° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Lugar, Región, Paisaje y Territorio</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="sbtn" id="dlBtn" onclick="generatePDF()" style="max-width:280px;margin:0 auto;">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   CENTRALIZED SCHOOL CONFIG (Rule 16) — ships UNBRANDED (Rule 11).
   The ONLY rebranding point. build_all.py substitutes these exact fields
   (BRAND_FIELDS / RGB_FIELDS / logo*) downstream; :root/dark stay as fallback.
   Neutral defaults below == the static :root/dark values, so unbranded == no-op.
   ══════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:'#24240c', primaryDark:'#3f3f14', primaryBg:'#f4f4e9',
  accent:'#fcb40c', accentBg:'#fff4db',
  darkPrimary:'#b4b455', darkPrimaryDark:'#d7d783', darkPrimaryBg:'#343412',

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);

  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');

}

async function generatePDF() {
  var btn = document.getElementById('dlBtn');
  btn.textContent = 'Generando PDF…';
  btn.disabled = true;

  var jspdf   = window.jspdf;
  var doc     = new jspdf.jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });
  var PW      = 215.9;
  var M       = 18;
  var TW      = PW - M * 2;
  var PH      = doc.internal.pageSize.height;
  var name    = studentData.name;
  var group   = studentData.group;
  var total   = problems.length;
  var pct     = Math.round(correctCount / total * 100);
  var dateStr = new Date().toLocaleString('es-MX', { dateStyle:'long', timeStyle:'short' });

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS — INJECTION BLOCK ─────────────────────────────────────────
  //   Match these RGB values to --green and --gold above.
  //   PRIMARY  → pBR, pBG, pBB
  //   ACCENT   → pAR, pAG, pAB
  // ──────────────────────────────────────────────────────────────────────────
  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;  // PRIMARY (from SCHOOL, Rule 16)
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;   // ACCENT (from SCHOOL, Rule 16)

  function pdfText(html) {
    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/\u2192/g,'->').replace(/\u2212/g,'-').replace(/\u00b2/g,'^2')
      .replace(/\u00b3/g,'^3').replace(/\u00d7/g,'x').replace(/\u00f7/g,'/')
      .replace(/\u2260/g,'!=').replace(/\u2264/g,'<=').replace(/\u2265/g,'>=')
      .replace(/\u221a/g,'sqrt').replace(/\u03c0/g,'pi').replace(/\u2026/g,'...')
      .replace(/\s+/g,' ').trim();

  //   silently on iPhone/iPad. iOS -> native share sheet (-> "Save to Files"),
  //   with an inline-open fallback; everything else -> <a download> click.
  //   Runs synchronously off the tap so iOS accepts navigator.share().
  var _fname   = 'geo1_t02_g01_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf';
  var _pdfBlob = doc.output('blob');

  function _restorePdfBtn(){ btn.innerHTML = '\u2b07 &nbsp;' + t('btn-pdf'); btn.disabled = false; }
  function _openPdfInline(b){
    var u = URL.createObjectURL(b);
    var w = window.open(u, '_blank');
    if (!w) { window.location.href = u; }
    setTimeout(function(){ URL.revokeObjectURL(u); }, 60000);
  }

  var _isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
               (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  if (_isIOS) {
    var _pdfFile = new File([_pdfBlob], _fname, { type:'application/pdf' });
    if (navigator.canShare && navigator.canShare({ files:[_pdfFile] })) {
      navigator.share({ files:[_pdfFile], title:_fname })
        .then(_restorePdfBtn)
        .catch(function(e){
          if (e && e.name === 'AbortError') { _restorePdfBtn(); return; }
          _openPdfInline(_pdfBlob); _restorePdfBtn();
        });
      return;
    }
    _openPdfInline(_pdfBlob); _restorePdfBtn();
    return;
  }

  var _dlUrl = URL.createObjectURL(_pdfBlob);
  var _dlA   = document.createElement('a');
  _dlA.href  = _dlUrl; _dlA.download = _fname;
  document.body.appendChild(_dlA); _dlA.click();
  setTimeout(function(){ document.body.removeChild(_dlA); URL.revokeObjectURL(_dlUrl); }, 200);
  _restorePdfBtn();
}

function L(o){ return (o && o[LANG] !== undefined) ? o[LANG] : (o ? o.es : ''); }
function ri(rng, a, b){ return a + Math.floor(rng() * (b - a + 1)); }
function pk(rng, a){ return a[Math.floor(rng() * a.length)]; }
function uniq(a){ var m = {}, i; for (i = 0; i < a.length; i++){ var k = '' + a[i]; if (m[k]) return false; m[k] = 1; } return true; }
function gen(rng, mk){ var i, d; for (i = 0; i < 90; i++){ d = mk(rng); if (d && uniq(d.vals)) return d; } return d; }
function nums(a){ return [String(a[0]), String(a[1]), String(a[2]), String(a[3])]; }

function say(host, cls, msg){
  var e = host.querySelector('.gw-fb');
  if (!e) return;
  e.className = 'gw-fb' + (cls ? ' ' + cls : '');
  e.innerHTML = msg;
}

function rcard(name, form, note){
  return '<div class="rcard"><div class="rname">' + name + '</div><div class="rform">' + form + '</div><div class="rnote">' + note + '</div></div>';
}

function sec(tag, title, html){
  var d = document.createElement('div');
  d.className = 'section';
  d.innerHTML = '<div class="stag">' + tag + '</div><h2>' + title + '</h2>' + html;
  document.getElementById('lessonBody').appendChild(d);
  return d;
}

function widgetHost(parent, id){
  var d = document.createElement('div');
  d.className = 'gw';
  d.id = id;
  parent.appendChild(d);
  return d;
}

function addProblem(rng, spec){
  var idx = problems.length;
  var correctVal = spec.options[spec.correct];
  var sh = shuffle(spec.options, rng);
  var prob = {
    title: spec.title,
    questionText: spec.q,
    fn: spec.fn || '',
    hint: spec.hint || '',
    explanation: spec.exp || '',
    options: sh,
    correctIdx: sh.indexOf(correctVal),
    showWork: !!spec.showWork,
    studentChoice: null,
    pendingChoice: null
  };
  problems.push(prob);
  buildOneCard(prob, idx);
}

   ══════════════════════════════════════════════════════════════════════════ */
function buildLesson(rng){
  injectGuideCSS();

  /* ── Apertura ── */
  sec(
    L({ es:'Punto de partida', en:'Starting point' }),
    L({ es:'Cuatro miradas sobre la misma barranca', en:'Four ways of looking at the same ravine' }),
    '<p>' + L({
      es:'Una misma barranca se puede describir de cuatro maneras. Quien creció junto a ella habla del sitio donde aprendió a nadar. Quien la fotografía enumera lo que se ve: el agua, las rocas, las milpas de la orilla. Quien estudia la producción la agrupa con otras barrancas parecidas. Quien decide sobre ella señala hasta dónde llegan sus límites y quién la cuida. Las cuatro descripciones son correctas porque cada una usa una categoría de análisis distinta.',
      en:'The same ravine can be described in four ways. Someone who grew up beside it talks about the spot where they learned to swim. Someone photographing it lists what can be seen: the water, the rocks, the maize fields on the bank. Someone studying production groups it with other similar ravines. Someone deciding about it points out where its limits run and who looks after it. All four descriptions are correct because each one uses a different category of analysis.'
    }) + '</p>' +
    '<div class="callout"><p><strong>' + L({ es:'Idea clave: ', en:'Key idea: ' }) + '</strong>' + L({
      es:'el espacio geográfico es el resultado de la relación entre la sociedad y la naturaleza a lo largo del tiempo. Lugar, paisaje, región y territorio son las cuatro herramientas que permiten estudiarlo por partes sin perder de vista el conjunto.',
      en:'geographic space is the result of the relationship between society and nature over time. Place, landscape, region and territory are the four tools that allow it to be studied part by part without losing sight of the whole.'
    }) + '</p></div>'
  );

  /* ══ CONCEPTO 1 :: saberes ancestrales ══ */
  var s1 = sec(
    L({ es:'Concepto 1', en:'Concept 1' }),
    L({ es:'Saberes ancestrales para ubicarse', en:'Ancestral knowledge for finding your way' }),
    '<p>' + L({
      es:'Mucho antes de los mapas impresos, los pueblos originarios de México y del mundo ya sabían ubicarse y representar su espacio. Seguían por dónde sale y por dónde se oculta el Sol, la posición de las estrellas durante la noche, la silueta de los cerros, el rumbo de los vientos y el curso de los ríos. Ese conocimiento quedó guardado en códices, en cantos, en el calendario de la milpa y en los nombres de los lugares, y sigue vivo en muchas comunidades.',
      en:'Long before printed maps, the original peoples of Mexico and of the world already knew how to locate themselves and represent their space. They followed where the Sun rises and where it sets, the position of the stars at night, the outline of the hills, the direction of the winds and the course of the rivers. That knowledge was kept in codices, in songs, in the calendar of the maize field and in the names of places, and it is still alive in many communities.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Oriente', en:'East' }), L({ es:'este', en:'east' }), L({ es:'por donde sale el Sol', en:'where the Sun rises' })) +
      rcard(L({ es:'Poniente', en:'West' }), L({ es:'oeste', en:'west' }), L({ es:'por donde se oculta el Sol', en:'where the Sun sets' })) +
      rcard(L({ es:'Norte', en:'North' }), L({ es:'estrella fija', en:'fixed star' }), L({ es:'la que no gira en la noche', en:'the one that does not turn at night' })) +
      rcard(L({ es:'Sur', en:'South' }), L({ es:'rumbo opuesto', en:'opposite bearing' }), L({ es:'queda frente al norte', en:'it faces the north' })) +
    '</div>' +
    '<div class="callout"><p>' + L({
      es:'Con esos rumbos se organizaba la siembra, la construcción de las casas y la orientación de los templos. Observar el cielo y el relieve era, y sigue siendo, una forma de ubicarse sin ningún aparato.',
      en:'With those bearings people organized the sowing, the building of houses and the orientation of temples. Watching the sky and the relief was, and still is, a way of finding your bearings with no device at all.'
    }) + '</p></div>'
  );
  w1(rng, widgetHost(s1, 'w_orienta'));
  addProblem(rng, mkP1(rng));

  /* ══ CONCEPTO 2 :: el lugar ══ */
  var s2 = sec(
    L({ es:'Concepto 2', en:'Concept 2' }),
    L({ es:'El lugar: el espacio con nombre propio', en:'Place: space with a name of its own' }),
    '<p>' + L({
      es:'El lugar es el espacio que se vive de cerca y que se reconoce por su nombre: una esquina, un mercado, un manantial, un pueblo. Es la escala más próxima a la experiencia diaria y por eso carga recuerdos, significados e identidad. Dos personas pueden describir el mismo lugar de manera distinta, porque cada una lo vive de otra forma.',
      en:'A place is the space lived up close and recognized by its name: a street corner, a market, a spring, a town. It is the scale closest to daily experience and for that reason it carries memories, meanings and identity. Two people can describe the same place differently, because each one lives it in another way.'
    }) + '</p>' +
    '<p>' + L({
      es:'En México muchos nombres de lugar vienen del náhuatl, del maya, del purépecha o del zapoteco, y describen lo que había ahí: un cerro, un río, un animal, una planta. Al traducir esas raíces aparece la descripción que dieron quienes habitaron el sitio primero.',
      en:'In Mexico many place names come from Nahuatl, Maya, Purepecha or Zapotec, and they describe what was there: a hill, a river, an animal, a plant. Translating those roots reveals the description given by the people who inhabited the site first.'
    }) + '</p>' +
    '<div class="callout"><p>' + L({
      es:'Un nombre de lugar es un saber ancestral guardado en una palabra: dice cómo se veía el sitio cuando alguien lo nombró.',
      en:'A place name is ancestral knowledge kept inside a word: it says how the site looked when someone named it.'
    }) + '</p></div>'
  );
  w2(rng, widgetHost(s2, 'w_topo'));
  addProblem(rng, mkP2(rng));
  addProblem(rng, mkP3(rng));

  /* ══ CONCEPTO 3 :: el paisaje ══ */
  var s3 = sec(
    L({ es:'Concepto 3', en:'Concept 3' }),
    L({ es:'El paisaje: la parte visible del espacio', en:'Landscape: the visible part of space' }),
    '<p>' + L({
      es:'El paisaje es lo que se alcanza a ver desde un punto. En él se mezclan elementos naturales, como el relieve, el agua, la vegetación y las nubes, con elementos sociales, como los caminos, los cultivos, las casas y las antenas. Ningún paisaje es una fotografía fija: cambia con las estaciones, con el crecimiento de las ciudades y con el trabajo de la gente.',
      en:'The landscape is what can be seen from a point. In it natural elements are mixed, such as relief, water, vegetation and clouds, with social elements, such as roads, crops, houses and antennas. No landscape is a fixed photograph: it changes with the seasons, with the growth of cities and with the work of people.'
    }) + '</p>' +
    '<p>' + L({
      es:'Comparar dos imágenes del mismo sitio en años distintos muestra ese cambio. La geografía estudia esa comparación con la idea de temporalidad, y estudia la relación entre lo natural y lo social con la idea de interacción.',
      en:'Comparing two images of the same site in different years shows that change. Geography studies that comparison with the idea of temporality, and studies the relation between the natural and the social with the idea of interaction.'
    }) + '</p>' +
    '<div class="callout"><p>' + L({
      es:'Un cultivo está hecho de plantas, pero alguien preparó el suelo y lo sembró. La pregunta útil para clasificar un elemento es si existiría sin el trabajo de la sociedad.',
      en:'A crop is made of plants, but someone prepared the soil and sowed it. The useful question when classifying an element is whether it would exist without the work of society.'
    }) + '</p></div>'
  );
  w3(rng, widgetHost(s3, 'w_paisaje'));
  addProblem(rng, mkP4(rng));
  addProblem(rng, mkP5(rng));

  /* ══ CONCEPTO 4 :: la región ══ */
  var s4 = sec(
    L({ es:'Concepto 4', en:'Concept 4' }),
    L({ es:'La región: agrupar con un criterio', en:'Region: grouping with a criterion' }),
    '<p>' + L({
      es:'Una región es un conjunto de lugares que se agrupan porque comparten algo: un clima, un cultivo, una lengua, una actividad económica o una forma de vida. La región no viene dibujada en el suelo, la define el criterio con el que se decide agrupar. Si se cambia el criterio, cambian los límites de la región aunque el terreno sea el mismo.',
      en:'A region is a set of places grouped together because they share something: a climate, a crop, a language, an economic activity or a way of life. A region does not come drawn on the ground, it is defined by the criterion chosen for grouping. If the criterion changes, the limits of the region change even though the ground is the same.'
    }) + '</p>' +
    '<div class="callout"><p>' + L({
      es:'Una misma comunidad puede pertenecer a la región cafetalera, a la región de clima templado y a la región donde se habla purépecha al mismo tiempo, porque cada región responde a un criterio diferente. Comparar regiones es la manera de explicar la diversidad del espacio geográfico.',
      en:'One community can belong to the coffee region, to the temperate climate region and to the region where Purepecha is spoken at the same time, because each region answers a different criterion. Comparing regions is the way to explain the diversity of geographic space.'
    }) + '</p></div>'
  );
  w4(rng, widgetHost(s4, 'w_region'));
  addProblem(rng, mkP6(rng));
  addProblem(rng, mkP7(rng));

  /* ══ CONCEPTO 5 :: el territorio ══ */
  var s5 = sec(
    L({ es:'Concepto 5', en:'Concept 5' }),
    L({ es:'El territorio: límites, reglas y autoridad', en:'Territory: limits, rules and authority' }),
    '<p>' + L({
      es:'El territorio es el espacio delimitado que un grupo humano se apropia, organiza y cuida. Tiene límites reconocidos, reglas y autoridades que deciden: la asamblea de una comunidad, el ayuntamiento de un municipio, el gobierno de un estado o el de un país. Hablar de territorio es hablar de quién decide, hasta dónde llega su decisión y con qué acuerdos se resuelven los desacuerdos.',
      en:'Territory is the bounded space that a human group appropriates, organizes and cares for. It has recognized limits, rules and authorities that decide: the assembly of a community, the council of a municipality, the government of a state or that of a country. Talking about territory means talking about who decides, how far that decision reaches and which agreements settle disagreements.'
    }) + '</p>' +
    '<div class="callout"><p>' + L({
      es:'Los límites del territorio se acuerdan y también se discuten. Por eso existen mapas oficiales, actas de asamblea y convenios: sirven para que todas las partes reconozcan las mismas fronteras.',
      en:'The limits of a territory are agreed on and also disputed. That is why official maps, assembly records and agreements exist: they make all parties recognize the same boundaries.'
    }) + '</p></div>'
  );
  w5(rng, widgetHost(s5, 'w_territorio'));
  addProblem(rng, mkP8(rng));

  /* ══ CONCEPTO 6 :: integración ══ */
  var s6 = sec(
    L({ es:'Concepto 6', en:'Concept 6' }),
    L({ es:'Las cuatro miradas trabajando juntas', en:'The four views working together' }),
    '<p>' + L({
      es:'Las cuatro categorías no compiten entre sí, se complementan. Funcionan como cuatro preguntas sobre el mismo espacio, y cada pregunta se apoya en los conceptos de localización, distribución, diversidad, temporalidad e interacción.',
      en:'The four categories do not compete with each other, they complement each other. They work as four questions about the same space, and each question leans on the ideas of location, distribution, diversity, temporality and interaction.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Lugar', en:'Place' }), L({ es:'¿qué significa?', en:'what does it mean?' }), L({ es:'el sitio vivido, con nombre propio', en:'the lived site, with a name of its own' })) +
      rcard(L({ es:'Paisaje', en:'Landscape' }), L({ es:'¿qué se ve?', en:'what can be seen?' }), L({ es:'lo visible, natural y social', en:'the visible, natural and social' })) +
      rcard(L({ es:'Región', en:'Region' }), L({ es:'¿con qué se agrupa?', en:'what is it grouped with?' }), L({ es:'conjunto unido por un criterio', en:'a set joined by a criterion' })) +
      rcard(L({ es:'Territorio', en:'Territory' }), L({ es:'¿quién decide?', en:'who decides?' }), L({ es:'espacio delimitado y apropiado', en:'bounded and appropriated space' })) +
    '</div>'
  );
  w6(rng, widgetHost(s6, 'w_miradas'));
  addProblem(rng, mkP9(rng));
  addProblem(rng, mkP10(rng));
}


/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 1 :: Orienta la mirada con el Sol y las estrellas
   ══════════════════════════════════════════════════════════════════════════ */
function w1(rng, host){
  var POOL = [
    { deg:90,
      clue:{ es:'El Sol acaba de salir detrás del cerro y lo tienes justo de frente.',
             en:'The Sun has just risen behind the hill and you are facing it head on.' },
      why:{ es:'El Sol sale por el oriente, así que mirarlo al amanecer es mirar al este, en los 90 grados de la rosa.',
            en:'The Sun rises in the east, so facing it at dawn means facing east, at 90 degrees on the rose.' } },
    { deg:270,
      clue:{ es:'El Sol se está ocultando y caminas directamente hacia él.',
             en:'The Sun is setting and you walk straight towards it.' },
      why:{ es:'El Sol se oculta por el poniente, de modo que caminar hacia él al atardecer es ir al oeste, en los 270 grados.',
            en:'The Sun sets in the west, so walking towards it at dusk means going west, at 270 degrees.' } },
    { deg:0,
      clue:{ es:'Es de noche, localizas la estrella que casi no cambia de sitio y la tienes de frente.',
             en:'It is night, you locate the star that hardly changes position and you are facing it.' },
      why:{ es:'Esa estrella señala el norte porque se mantiene casi fija mientras las demás giran, y el norte es el cero de la rosa.',
            en:'That star marks the north because it stays almost fixed while the others turn, and north is the zero of the rose.' } },
    { deg:180,
      clue:{ es:'De noche localizas la estrella fija y la dejas exactamente a tus espaldas.',
             en:'At night you locate the fixed star and leave it exactly behind your back.' },
      why:{ es:'Si el norte queda atrás, al frente queda el rumbo opuesto, que es el sur, en los 180 grados.',
            en:'If the north is behind you, ahead lies the opposite bearing, which is the south, at 180 degrees.' } },
    { deg:45,
      clue:{ es:'El viento que trae la lluvia sopla desde el punto medio entre el norte y el oriente, y quieres recibirlo de frente.',
             en:'The wind that brings the rain blows from the midpoint between north and east, and you want to face it.' },
      why:{ es:'El punto medio entre el norte y el este es el noreste, que en la rosa cae en los 45 grados.',
            en:'The midpoint between north and east is the northeast, which falls at 45 degrees on the rose.' } },
    { deg:225,
      clue:{ es:'La vereda del monte baja hacia el punto medio entre el sur y el poniente, y tú la sigues.',
             en:'The mountain path goes down towards the midpoint between south and west, and you follow it.' },
      why:{ es:'El punto medio entre el sur y el oeste es el suroeste, que en la rosa cae en los 225 grados.',
            en:'The midpoint between south and west is the southwest, which falls at 225 degrees on the rose.' } }
  ];
  var R = shuffle(POOL, rng).slice(0, 3);
  var rd = 0, tries = 0, cur = ri(rng, 3, 68) * 5, locked = false, done = false;

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Orienta la mirada sin aparatos', en:'Find the bearing with no devices' }) + '</div>' +
    '<div class="gw-q" data-r="clue"></div>' +
    '<div class="gw-mini">' + L({ es:'Mueve la flecha hasta el rumbo que describe la escena.', en:'Move the arrow to the bearing the scene describes.' }) + '</div>' +
    '<div class="gw-rose">' +
      '<div class="gw-rl" style="top:5px;left:50%;margin-left:-4px">N</div>' +
      '<div class="gw-rl" style="right:7px;top:50%;margin-top:-9px" data-r="lE"></div>' +
      '<div class="gw-rl" style="bottom:5px;left:50%;margin-left:-4px">S</div>' +
      '<div class="gw-rl" style="left:7px;top:50%;margin-top:-9px" data-r="lW"></div>' +
      '<div class="gw-arrow" data-r="arr"></div>' +
    '</div>' +
    '<div class="gw-deg" data-r="deg"></div>' +
    '<input class="gw-range" type="range" min="0" max="355" step="5" data-r="sl">' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Comprobar', en:'Check' }) + '</button><span class="gw-val" data-r="live"></span></div>' +
    '<div class="gw-fb"></div>';

  var elClue = host.querySelector('[data-r="clue"]'),
      elArr  = host.querySelector('[data-r="arr"]'),
      elDeg  = host.querySelector('[data-r="deg"]'),
      elSl   = host.querySelector('[data-r="sl"]'),
      elChk  = host.querySelector('[data-r="chk"]'),
      elLive = host.querySelector('[data-r="live"]');
  host.querySelector('[data-r="lE"]').textContent = 'E';
  host.querySelector('[data-r="lW"]').textContent = LANG === 'en' ? 'W' : 'O';

  function rumbo(d){
    var NA = LANG === 'en' ? ['N','NE','E','SE','S','SW','W','NW'] : ['N','NE','E','SE','S','SO','O','NO'];
    return NA[((Math.round(d / 45) % 8) + 8) % 8];
  }
  function draw(){
    elArr.style.transform = 'rotate(' + cur + 'deg)';
    elSl.value = cur;
    elDeg.textContent = cur + '°';
    elLive.textContent = (cur % 45 === 0 ? rumbo(cur) : L({ es:'entre ', en:'between ' }) + rumbo(cur - 25) + ' ' + L({ es:'y ', en:'and ' }) + rumbo(cur + 25));
    elClue.innerHTML = L(R[rd].clue);
  }
  function gap(){
    var d = ((R[rd].deg - cur + 540) % 360) - 180;
    return d;
  }
  function advance(){
    rd++;
    if (rd >= 3){
      done = true; elSl.disabled = true;
      elChk.textContent = L({ es:'Completado', en:'Completed' });
      elChk.className = 'gw-btn solved';
      say(host, 'good', L({
        es:'Tres rumbos encontrados solo con el Sol, las estrellas y el relieve. Así se orientaba la gente antes de cualquier instrumento.',
        en:'Three bearings found using only the Sun, the stars and the relief. That is how people found their way before any instrument.'
      }));
      return;
    }
    locked = false; tries = 0;
    elChk.textContent = L({ es:'Comprobar', en:'Check' });
    elChk.className = 'gw-btn';
    say(host, '', L({ es:'Nueva escena. Vuelve a mover la flecha.', en:'New scene. Move the arrow again.' }));
    draw();
  }
  function close(cls, txt){
    locked = true;
    elChk.textContent = rd === 2 ? L({ es:'Terminar', en:'Finish' }) : L({ es:'Siguiente escena', en:'Next scene' });
    elChk.className = 'gw-btn solved';
    draw();
    say(host, cls, txt);
  }
  function check(){
    if (done) return;
    if (locked){ advance(); return; }
    var d = gap();
    if (Math.abs(d) <= 5){ close('good', L(R[rd].why)); return; }
    tries++;
    if (tries >= 3){
      cur = R[rd].deg;
      close('warm', L({ es:'Este es el rumbo. ', en:'This is the bearing. ' }) + L(R[rd].why));
      return;
    }
    var much = Math.abs(d) > 90 ? L({ es:'bastante', en:'quite a lot' }) : (Math.abs(d) > 30 ? L({ es:'un poco', en:'a little' }) : L({ es:'muy poco', en:'very little' }));
    say(host, 'miss', L({
      es:'Ahora la flecha apunta hacia el rumbo ' + rumbo(cur) + '. Gírala ' + much + ' hacia la ' + (d > 0 ? 'derecha' : 'izquierda') + ' y vuelve a comprobar.',
      en:'Right now the arrow points to bearing ' + rumbo(cur) + '. Turn it ' + much + ' to the ' + (d > 0 ? 'right' : 'left') + ' and check again.'
    }));
    draw();
  }

  elSl.addEventListener('input', function(){
    if (done || locked) { elSl.value = cur; return; }
    cur = parseInt(elSl.value, 10);
    draw();
  });
  elChk.addEventListener('click', check);
  say(host, '', L({ es:'Lee la escena, coloca la flecha y comprueba.', en:'Read the scene, place the arrow and check.' }));
  draw();
}


/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 2 :: Traduce el topónimo (el nombre del lugar guarda su descripción)
   ══════════════════════════════════════════════════════════════════════════ */
function w2(rng, host){
  var POOL = [
    { name:'Chapultepec', from:{ es:'náhuatl', en:'Nahuatl' },
      parts:[
        { r:'chapul', opts:{ es:['chapulín','coyote','pescado'], en:['grasshopper','coyote','fish'] }, ok:0 },
        { r:'tepec',  opts:{ es:['cerro','agua','arena'], en:['hill','water','sand'] }, ok:0 }
      ],
      gloss:{ es:'en el cerro del chapulín', en:'on the hill of the grasshopper' } },
    { name:'Xalapa', from:{ es:'náhuatl', en:'Nahuatl' },
      parts:[
        { r:'xal',  opts:{ es:['arena','piedra','flor'], en:['sand','stone','flower'] }, ok:0 },
        { r:'apan', opts:{ es:['en el agua','en el llano','en el bosque'], en:['in the water','on the plain','in the forest'] }, ok:0 }
      ],
      gloss:{ es:'manantial en la arena', en:'spring in the sand' } },
    { name:'Coyoacán', from:{ es:'náhuatl', en:'Nahuatl' },
      parts:[
        { r:'coyo', opts:{ es:['coyote','venado','maíz'], en:['coyote','deer','maize'] }, ok:0 },
        { r:'can',  opts:{ es:['lugar de','cerro de','río de'], en:['place of','hill of','river of'] }, ok:0 }
      ],
      gloss:{ es:'lugar de coyotes', en:'place of coyotes' } },
    { name:'Michoacán', from:{ es:'náhuatl', en:'Nahuatl' },
      parts:[
        { r:'michhua', opts:{ es:['pescadores','alfareros','tejedores'], en:['fishers','potters','weavers'] }, ok:0 },
        { r:'can',     opts:{ es:['lugar de','camino de','valle de'], en:['place of','road of','valley of'] }, ok:0 }
      ],
      gloss:{ es:'lugar de pescadores', en:'place of fishers' } },
    { name:'Tenochtitlan', from:{ es:'náhuatl', en:'Nahuatl' },
      parts:[
        { r:'te',      opts:{ es:['piedra','árbol','viento'], en:['stone','tree','wind'] }, ok:0 },
        { r:'nochtli', opts:{ es:['nopal','maguey','encino'], en:['prickly pear cactus','agave','oak'] }, ok:0 }
      ],
      gloss:{ es:'entre las piedras y los nopales', en:'among the stones and the prickly pear cacti' } },
    { name:'Zacatecas', from:{ es:'náhuatl', en:'Nahuatl' },
      parts:[
        { r:'zacate', opts:{ es:['pasto','pino','carrizo'], en:['grass','pine','reed'] }, ok:0 },
        { r:'tecas',  opts:{ es:['gente del lugar donde abunda','montaña que rodea','agua que corre'], en:['people of the place where it abounds','mountain that surrounds','water that runs'] }, ok:0 }
      ],
      gloss:{ es:'gente del lugar donde abunda el pasto', en:'people of the place where grass abounds' } }
  ];
  var R = shuffle(POOL, rng).slice(0, 3);
  var rd = 0, tries = 0, locked = false, done = false, cur = [];

  function seed(){
    var d = R[rd], i;
    cur = [];
    for (i = 0; i < d.parts.length; i++) cur.push((d.parts[i].ok + 1 + ri(rng, 0, 1)) % 3);
  }

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Traduce el nombre del lugar', en:'Translate the name of the place' }) + '</div>' +
    '<div class="gw-q" data-r="name"></div>' +
    '<div class="gw-mini" data-r="from"></div>' +
    '<div class="gw-grid" data-r="parts"></div>' +
    '<div class="gw-lbl">' + L({ es:'Lo que dice el nombre', en:'What the name says' }) + '</div>' +
    '<div class="gw-word" data-r="live"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Comprobar', en:'Check' }) + '</button></div>' +
    '<div class="gw-fb"></div>';

  var elName = host.querySelector('[data-r="name"]'),
      elFrom = host.querySelector('[data-r="from"]'),
      elP    = host.querySelector('[data-r="parts"]'),
      elLive = host.querySelector('[data-r="live"]'),
      elChk  = host.querySelector('[data-r="chk"]');

  function txt(i){ return L(R[rd].parts[i].opts)[cur[i]]; }
  function draw(){
    var d = R[rd];
    elName.textContent = d.name;
    elFrom.textContent = L({ es:'Raíces en ', en:'Roots in ' }) + L(d.from) + L({ es:'. Toca cada raíz hasta darle su significado.', en:'. Tap each root until it gets its meaning.' });
    elP.innerHTML = d.parts.map(function(p, i){
      return '<button class="gw-tile" data-k="' + i + '"' + (locked || done ? ' disabled' : '') + '><span class="gw-key">' + p.r + '</span><br>' + txt(i) + '</button>';
    }).join('');
    elLive.innerHTML = d.parts.map(function(p, i){ return txt(i); }).join(' + ');
  }
  function advance(){
    rd++;
    if (rd >= 3){
      done = true;
      elChk.textContent = L({ es:'Completado', en:'Completed' });
      elChk.className = 'gw-btn solved';
      draw();
      say(host, 'good', L({
        es:'Tres nombres traducidos. Cada topónimo guarda una descripción del sitio hecha por quienes lo habitaron primero.',
        en:'Three names translated. Every place name keeps a description of the site made by the people who inhabited it first.'
      }));
      return;
    }
    locked = false; tries = 0; seed();
    elChk.textContent = L({ es:'Comprobar', en:'Check' });
    elChk.className = 'gw-btn';
    say(host, '', L({ es:'Otro nombre. Vuelve a armar su significado.', en:'Another name. Build its meaning again.' }));
    draw();
  }
  function close(cls, msg){
    locked = true;
    elChk.textContent = rd === 2 ? L({ es:'Terminar', en:'Finish' }) : L({ es:'Siguiente nombre', en:'Next name' });
    elChk.className = 'gw-btn solved';
    draw();
    say(host, cls, msg);
  }
  function wrongIdx(){
    var d = R[rd], i;
    for (i = 0; i < d.parts.length; i++) if (cur[i] !== d.parts[i].ok) return i;
    return -1;
  }
  function check(){
    if (done) return;
    if (locked){ advance(); return; }
    var d = R[rd];
    if (wrongIdx() === -1){
      close('good', L({ es:'Así es: ' + d.name + ' quiere decir ' + L(d.gloss) + '.', en:'That is it: ' + d.name + ' means ' + L(d.gloss) + '.' }));
      return;
    }
    tries++;
    if (tries >= 3){
      var i;
      for (i = 0; i < d.parts.length; i++) cur[i] = d.parts[i].ok;
      close('warm', L({ es:'Esta es la traducción: ' + d.name + ' quiere decir ' + L(d.gloss) + '.', en:'This is the translation: ' + d.name + ' means ' + L(d.gloss) + '.' }));
      return;
    }
    var w = wrongIdx();
    say(host, 'miss', L({
      es:'La raíz ' + d.parts[w].r + ' todavía no encaja: en este nombre no significa ' + txt(w) + '. Tócala para cambiarla.',
      en:'The root ' + d.parts[w].r + ' does not fit yet: in this name it does not mean ' + txt(w) + '. Tap it to change it.'
    }));
    draw();
  }

  elP.addEventListener('click', function(ev){
    var b = ev.target.closest('[data-k]');
    if (!b || locked || done) return;
    var i = parseInt(b.getAttribute('data-k'), 10);
    cur[i] = (cur[i] + 1) % 3;
    draw();
  });
  elChk.addEventListener('click', check);
  seed();
  say(host, '', L({ es:'Toca las raíces para probar significados y comprueba cuando la frase tenga sentido.', en:'Tap the roots to try meanings and check when the phrase makes sense.' }));
  draw();
}


/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 3 :: Arma el paisaje (elementos naturales y sociales)
   ══════════════════════════════════════════════════════════════════════════ */
function w3(rng, host){
  var NAT = [
    { es:'cerro', en:'hill', why:{ es:'el relieve ya estaba ahí antes de cualquier trabajo humano', en:'the relief was already there before any human work' } },
    { es:'río', en:'river', why:{ es:'el agua corre por su cauce sin que nadie la siembre', en:'water runs along its bed without anyone sowing it' } },
    { es:'bosque de pinos', en:'pine forest', why:{ es:'los pinos crecen por sí solos en la ladera', en:'the pines grow by themselves on the slope' } },
    { es:'nubes', en:'clouds', why:{ es:'las nubes se forman por el ciclo del agua, no por una obra', en:'clouds form through the water cycle, not through a construction' } },
    { es:'manantial', en:'spring', why:{ es:'el agua brota del subsuelo sin intervención', en:'the water comes out of the ground with no intervention' } },
    { es:'barranca', en:'ravine', why:{ es:'la barranca la abrió el escurrimiento del agua', en:'the ravine was opened by running water' } }
  ];
  var SOC = [
    { es:'milpa', en:'maize field', why:{ es:'alguien preparó el suelo y sembró: sin ese trabajo no habría milpa', en:'someone prepared the soil and sowed: without that work there would be no maize field' } },
    { es:'carretera', en:'road', why:{ es:'la carretera se trazó y se pavimentó', en:'the road was laid out and paved' } },
    { es:'mercado', en:'market', why:{ es:'el mercado es una construcción para el intercambio', en:'the market is a building for exchange' } },
    { es:'puente', en:'bridge', why:{ es:'el puente se construyó para cruzar', en:'the bridge was built in order to cross' } },
    { es:'casas de adobe', en:'adobe houses', why:{ es:'el adobe se hace y se levanta con trabajo', en:'adobe is made and raised with work' } },
    { es:'canal de riego', en:'irrigation canal', why:{ es:'el canal lleva el agua por donde la gente decidió', en:'the canal carries water where people decided' } },
    { es:'antena', en:'antenna', why:{ es:'la antena se instaló para comunicar', en:'the antenna was installed to communicate' } }
  ];
  var rd = 0, tries = 0, done = false, items = [], st = [];

  function build(){
    var a = shuffle(NAT, rng).slice(0, 3).map(function(o){ return { o:o, k:1 }; });
    var b = shuffle(SOC, rng).slice(0, 3).map(function(o){ return { o:o, k:2 }; });
    items = shuffle(a.concat(b), rng);
    st = items.map(function(){ return 0; });
  }

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Clasifica lo que se ve desde el mirador', en:'Sort what can be seen from the lookout' }) + '</div>' +
    '<div class="gw-mini">' + L({
      es:'Cada toque mueve el elemento: primero a natural, luego a social, luego lo deja sin ubicar.',
      en:'Each tap moves the element: first to natural, then to social, then back to unplaced.'
    }) + '</div>' +
    '<div class="gw-grid" data-r="items"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Comprobar', en:'Check' }) + '</button><span class="gw-val" data-r="live"></span></div>' +
    '<div class="gw-fb"></div>';

  var elI = host.querySelector('[data-r="items"]'),
      elChk = host.querySelector('[data-r="chk"]'),
      elLive = host.querySelector('[data-r="live"]');

  function tagOf(s){
    if (s === 1) return L({ es:'natural', en:'natural' });
    if (s === 2) return L({ es:'social', en:'social' });
    return L({ es:'sin ubicar', en:'unplaced' });
  }
  function draw(){
    elI.innerHTML = items.map(function(it, i){
      var cls = st[i] === 1 ? ' nat' : (st[i] === 2 ? ' soc' : '');
      return '<button class="gw-tile' + cls + '" data-k="' + i + '"' + (done ? ' disabled' : '') + '>' + L(it.o) + '<br><span class="gw-key">' + tagOf(st[i]) + '</span></button>';
    }).join('');
    var n = 0, s = 0, f = 0, i;
    for (i = 0; i < st.length; i++){ if (st[i] === 1) n++; else if (st[i] === 2) s++; else f++; }
    elLive.textContent = L({ es:'naturales ', en:'natural ' }) + n + L({ es:' · sociales ', en:' · social ' }) + s + L({ es:' · sin ubicar ', en:' · unplaced ' }) + f;
  }
  function firstBad(){
    var i;
    for (i = 0; i < items.length; i++) if (st[i] !== items[i].k) return i;
    return -1;
  }
  function check(){
    if (done) return;
    if (firstBad() === -1){
      if (rd === 0){
        rd = 1; tries = 0; build(); draw();
        say(host, 'good', L({
          es:'Paisaje ordenado. Ahora cambia la vista: estos elementos se ven desde otro mirador del mismo valle.',
          en:'Landscape sorted. Now the view changes: these elements are seen from another lookout in the same valley.'
        }));
        return;
      }
      done = true;
      elChk.textContent = L({ es:'Completado', en:'Completed' });
      elChk.className = 'gw-btn solved';
      draw();
      say(host, 'good', L({
        es:'Los dos paisajes quedaron clasificados. En todo paisaje lo natural y lo social aparecen mezclados, y esa mezcla es la interacción entre sociedad y naturaleza.',
        en:'Both landscapes are sorted. In every landscape the natural and the social appear mixed, and that mixture is the interaction between society and nature.'
      }));
      return;
    }
    tries++;
    var i = firstBad();
    if (tries >= 3){
      var j;
      for (j = 0; j < items.length; j++) st[j] = items[j].k;
      draw();
      if (rd === 0){
        rd = 1; tries = 0;
        say(host, 'warm', L({
          es:'Así queda esta vista. Fíjate en cuáles existirían sin el trabajo de la gente, y sigue con el siguiente mirador.',
          en:'This is how this view looks. Notice which ones would exist without the work of people, and move on to the next lookout.'
        }));
        setTimeout(function(){ build(); draw(); }, 900);
        return;
      }
      done = true;
      elChk.textContent = L({ es:'Completado', en:'Completed' });
      elChk.className = 'gw-btn solved';
      say(host, 'warm', L({
        es:'Esta es la clasificación completa. Compárala con la tuya: la clave es preguntar si el elemento existiría sin el trabajo de la sociedad.',
        en:'This is the complete sorting. Compare it with yours: the key is to ask whether the element would exist without the work of society.'
      }));
      return;
    }
    if (st[i] === 0){
      say(host, 'miss', L({
        es:'Falta ubicar ' + L(items[i].o) + '. Pregúntate si existiría sin el trabajo de la gente.',
        en:'You still have to place the ' + L(items[i].o) + '. Ask yourself whether it would exist without the work of people.'
      }));
    } else {
      say(host, 'miss', L({
        es:L(items[i].o) + ' está del lado equivocado, porque ' + L(items[i].o.why) + '.',
        en:'The ' + L(items[i].o) + ' is on the wrong side, because ' + L(items[i].o.why) + '.'
      }));
    }
    draw();
  }

  elI.addEventListener('click', function(ev){
    var b = ev.target.closest('[data-k]');
    if (!b || done) return;
    var i = parseInt(b.getAttribute('data-k'), 10);
    st[i] = (st[i] + 1) % 3;
    draw();
  });
  elChk.addEventListener('click', check);
  build();
  say(host, '', L({ es:'Toca cada elemento hasta dejarlo del lado que le corresponde y comprueba.', en:'Tap each element until it sits on the side where it belongs and check.' }));
  draw();
}


/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 4 :: Traza la región (el criterio decide los límites)
   ══════════════════════════════════════════════════════════════════════════ */
function w4(rng, host){
  var NAMES = ['Tepetla','Xalcuapan','Río Blanco','San Andrés','La Cañada','El Palmar','Zacamitla','Yaxché','Ocotal','Tlacotal','Agua Fría','Peña Alta'];
  var CRIT = [
    { name:{ es:'Región cafetalera', en:'Coffee region' },
      ask:{ es:'Incluye los municipios donde el cultivo principal es el café.', en:'Include the municipalities where the main crop is coffee.' },
      hit:{ es:'café', en:'coffee' },
      other:[{ es:'maíz', en:'maize' }, { es:'caña', en:'sugar cane' }, { es:'ganado', en:'cattle' }],
      why:{ es:'La región cafetalera reúne los municipios que comparten ese cultivo, aunque no sean vecinos en el mapa.',
            en:'The coffee region gathers the municipalities that share that crop, even if they are not neighbours on the map.' } },
    { name:{ es:'Región de clima seco', en:'Dry climate region' },
      ask:{ es:'Incluye los municipios cuyo clima es seco.', en:'Include the municipalities whose climate is dry.' },
      hit:{ es:'clima seco', en:'dry climate' },
      other:[{ es:'clima templado', en:'temperate climate' }, { es:'clima cálido húmedo', en:'warm humid climate' }],
      why:{ es:'Con el criterio del clima la región se dibuja distinta, aunque el terreno sea el mismo de antes.',
            en:'With the climate criterion the region is drawn differently, even though the ground is the same as before.' } },
    { name:{ es:'Región de habla originaria', en:'Region of original language' },
      ask:{ es:'Incluye los municipios donde la mayoría habla una lengua originaria además del español.', en:'Include the municipalities where most people speak an original language besides Spanish.' },
      hit:{ es:'lengua originaria', en:'original language' },
      other:[{ es:'solo español', en:'Spanish only' }],
      why:{ es:'Una región cultural agrupa por lo que la gente habla y comparte, no por la cercanía en el mapa.',
            en:'A cultural region groups by what people speak and share, not by closeness on the map.' } }
  ];
  var order = shuffle([0, 1, 2], rng).slice(0, 2);
  var rd = 0, tries = 0, done = false, locked = false, cells = [], sel = [], C = null;

  function build(){
    C = CRIT[order[rd]];
    var nm = shuffle(NAMES, rng);
    var k = ri(rng, 4, 6), i;
    var flags = [];
    for (i = 0; i < 12; i++) flags.push(i < k);
    flags = shuffle(flags, rng);
    cells = [];
    for (i = 0; i < 12; i++){
      cells.push({ n:nm[i], hit:flags[i], attr:flags[i] ? L(C.hit) : L(pk(rng, C.other)) });
    }
    sel = cells.map(function(){ return false; });
  }

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Traza la región', en:'Draw the region' }) + '</div>' +
    '<div class="gw-q" data-r="crit"></div>' +
    '<div class="gw-mini" data-r="ask"></div>' +
    '<div class="gw-map" data-r="map"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Comprobar', en:'Check' }) + '</button><span class="gw-val" data-r="live"></span></div>' +
    '<div class="gw-fb"></div>';

  var elC = host.querySelector('[data-r="crit"]'),
      elA = host.querySelector('[data-r="ask"]'),
      elM = host.querySelector('[data-r="map"]'),
      elChk = host.querySelector('[data-r="chk"]'),
      elLive = host.querySelector('[data-r="live"]');

  function draw(){
    elC.textContent = L(C.name);
    elA.textContent = L(C.ask);
    elM.innerHTML = cells.map(function(c, i){
      return '<button class="gw-cell' + (sel[i] ? ' in' : '') + (locked && c.hit ? ' hit' : '') + '" data-k="' + i + '"' + (done ? ' disabled' : '') + '>' +
        '<span class="gw-cname">' + c.n + '</span>' + c.attr + '</button>';
    }).join('');
    var n = 0, i;
    for (i = 0; i < sel.length; i++) if (sel[i]) n++;
    elLive.textContent = L({ es:'municipios elegidos: ', en:'municipalities chosen: ' }) + n + L({ es:' de 12', en:' of 12' });
  }
  function counts(){
    var extra = 0, miss = 0, i;
    for (i = 0; i < cells.length; i++){
      if (sel[i] && !cells[i].hit) extra++;
      if (!sel[i] && cells[i].hit) miss++;
    }
    return { extra:extra, miss:miss };
  }
  function advance(){
    rd++;
    if (rd >= 2){
      done = true;
      elChk.textContent = L({ es:'Completado', en:'Completed' });
      elChk.className = 'gw-btn solved';
      draw();
      say(host, 'good', L({
        es:'Dos regiones sobre el mismo conjunto de municipios. El criterio cambió y con él cambiaron los límites: eso es lo que distingue a la región de un territorio con fronteras fijas.',
        en:'Two regions over the same set of municipalities. The criterion changed and with it the limits changed: that is what tells a region apart from a territory with fixed boundaries.'
      }));
      return;
    }
    locked = false; tries = 0; build(); draw();
    say(host, '', L({ es:'Cambia el criterio. Vuelve a elegir los municipios que ahora forman la región.', en:'The criterion changes. Choose again the municipalities that now form the region.' }));
  }
  function close(cls, msg){
    locked = true;
    elChk.textContent = rd === 0 ? L({ es:'Siguiente criterio', en:'Next criterion' }) : L({ es:'Terminar', en:'Finish' });
    elChk.className = 'gw-btn solved';
    draw();
    say(host, cls, msg);
  }
  function check(){
    if (done) return;
    if (locked){ advance(); return; }
    var c = counts();
    if (c.extra === 0 && c.miss === 0){ close('good', L(C.why)); return; }
    tries++;
    if (tries >= 3){
      var i;
      for (i = 0; i < cells.length; i++) sel[i] = cells[i].hit;
      close('warm', L({ es:'Esta es la región completa, marcada en el mapa. ', en:'This is the whole region, marked on the map. ' }) + L(C.why));
      return;
    }
    var partes = [];
    if (c.extra > 0) partes.push(L({
      es:c.extra === 1 ? 'incluiste 1 municipio que no cumple el criterio' : 'incluiste ' + c.extra + ' municipios que no cumplen el criterio',
      en:c.extra === 1 ? 'you included 1 municipality that does not meet the criterion' : 'you included ' + c.extra + ' municipalities that do not meet the criterion'
    }));
    if (c.miss > 0) partes.push(L({
      es:c.miss === 1 ? 'dejaste fuera 1 que sí lo cumple' : 'dejaste fuera ' + c.miss + ' que sí lo cumplen',
      en:c.miss === 1 ? 'you left out 1 that does meet it' : 'you left out ' + c.miss + ' that do meet it'
    }));
    say(host, 'miss', L({ es:'Casi: ' + partes.join(L({ es:' y ', en:' and ' })) + '. Revisa el dato de cada municipio.',
                          en:'Almost: ' + partes.join(L({ es:' y ', en:' and ' })) + '. Check the data of each municipality.' }));
    draw();
  }

  elM.addEventListener('click', function(ev){
    var b = ev.target.closest('[data-k]');
    if (!b || done || locked) return;
    var i = parseInt(b.getAttribute('data-k'), 10);
    sel[i] = !sel[i];
    draw();
  });
  elChk.addEventListener('click', check);
  build();
  say(host, '', L({ es:'Toca los municipios para incluirlos o sacarlos de la región y comprueba.', en:'Tap the municipalities to include them or take them out of the region and check.' }));
  draw();
}

                 en:'An agreement is signed with another country to share the water of a river that crosses the border.' },
      why:{ es:'Un acuerdo con otro país solo puede firmarse en el nivel nacional, porque afecta a todo el territorio.',
            en:'An agreement with another country can only be signed at the national level, because it affects the whole territory.' } },
    { i:1, sit:{ es:'Se decide por dónde pasará la ruta del camión que conecta las colonias de la cabecera.',

      why:{ es:'La laguna rebasa cada municipio pero no sale del estado, así que la decisión se toma en el nivel estatal.',

  ];
  var R = shuffle(POOL, rng).slice(0, 3);
  var rd = 0, tries = 0, sel = null, locked = false, done = false;

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'¿Quién decide aquí?', en:'Who decides here?' }) + '</div>' +
    '<div class="gw-q" data-r="sit"></div>' +
    '<div class="gw-mini">' + L({ es:'Elige el escalón del territorio donde se toma esa decisión.', en:'Choose the step of the territory where that decision is taken.' }) + '</div>' +
    '<div class="gw-lad" data-r="lad"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Comprobar', en:'Check' }) + '</button><span class="gw-val" data-r="live"></span></div>' +
    '<div class="gw-fb"></div>';

  var elS = host.querySelector('[data-r="sit"]'),
      elL = host.querySelector('[data-r="lad"]'),
      elChk = host.querySelector('[data-r="chk"]'),

  function draw(){
    elS.innerHTML = L(R[rd].sit);
    elL.innerHTML = LV.map(function(o, i){

  function check(){

  var elT = host.querySelector('[data-r="txt"]'),

  function nameOf(k){ var i; for (i = 0; i < CAT.length; i++) if (CAT[i].k === k) return L(CAT[i]); return '?'; }

    }).join('');
    elLive.textContent = L({ es:'ronda ', en:'round ' }) + (rd + 1) + ' / 4';

  function advance(){
    rd++;

    if (done) return;

  draw();

function mkP10(rng){

    var a = B - p;
    if (a < 8) return null;
    return { A:A, C:C, B:B, p:p, a:a, vals:[a, B - C, B - A, p] };
  });
  var V = [
    { title:{ es:'El bosque de la ladera', en:'The forest on the slope' },
      q:{ es:'El paisaje de un valle tenía ' + d.B + ' hectáreas de bosque en la ladera. En cada uno de los últimos ' + d.A + ' años, ' + d.C + ' hectáreas de ese bosque se volvieron terreno de cultivo. ¿Cuántas hectáreas de bosque quedan hoy en la ladera?',

             en:'First find out how much forest was transformed in all those years together, and then compare it with the forest there was at the start.' },
      exp:{ es:'En ' + d.A + ' años se transformaron ' + d.A + ' × ' + d.C + ' = ' + d.p + ' hectáreas, así que del bosque original quedan ' + d.B + ' − ' + d.p + ' = ' + d.a,
            en:'In ' + d.A + ' years ' + d.A + ' × ' + d.C + ' = ' + d.p + ' hectares were transformed, so what is left of the original forest is ' + d.B + ' − ' + d.p + ' = ' + d.a } },

  ];
  var v = pickV(rng, V);
  return { title:L(v.title), q:L(v.q), fn:'', options:nums(d.vals), correct:0, hint:L(v.hint), exp:L(v.exp), showWork:true };
}
