<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Applied Algebra in Business · Business Math · School of Economics, Universidad de Colima</title>
<link rel="canonical" href="https://liaxa.mx/facultad_economia/business_math/neg_algebra_aplicada.html">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS ── fallback only; applyBranding() re-injects from SCHOOL ── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;
  --gold-bg:    #faf3e0;
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; object-fit:contain; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; min-width:0; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── LANGUAGE TOGGLE ── */
.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }
.dlist { font-family:'IBM Plex Mono',monospace; font-size:.78rem; color:var(--green-dark); background:var(--surface2); border-radius:8px; padding:.6rem .7rem; margin:.6rem 0; word-break:break-word; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); overflow-x:auto; }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── INTERACTIVE WIDGETS ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.iw-head { display:flex; align-items:baseline; gap:.6rem; margin-bottom:.3rem; flex-wrap:wrap; }
.iw-tag { font-size:.62rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; }
.iw-title { font-family:'Crimson Pro',serif; font-size:1.08rem; font-weight:700; }
.iw-sub { font-size:.8rem; color:var(--text2); margin-bottom:.85rem; }
.iw-canvas { display:block; width:100%; border-radius:8px; background:var(--surface2); }
.iw-read { margin-top:.85rem; background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 8px 8px 0; padding:.7rem .85rem; font-size:.82rem; color:var(--text2); }
.iw-read strong { color:var(--green-dark); }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (widget toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.3rem .7rem; font-size:.76rem; cursor:pointer; color:var(--text2); transition:all .14s; font-family:inherit; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--gold-bg); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }

/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos { gap: .9rem; }
  .wlogos img { height: 38px; max-width: 42%; }
  .wtitle { font-size: 1.35rem; }
  .stickybar { padding: .5rem .55rem; gap: .38rem; }
  .htitle { display: none; }
  .halexis { display: none; }
  .hsep { display: none; }
  .hlogos { gap: .3rem; }
  .hlogos img { height: 18px; max-width: 60px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 78px; overflow: hidden; text-overflow: ellipsis; }
  .lang-btn { padding: .26rem .48rem; font-size: .68rem; }
  .lbody { padding: 1.2rem .7rem 3rem; max-width: 100%; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .gcrd { padding: .9rem .75rem; }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}
</style>
</head>
<body>

<!-- ════════════════════ WELCOME ════════════════════ -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <div style="font-family:'Crimson Pro',serif;font-size:2rem;font-weight:700;letter-spacing:.06em;color:#1a4a8a;line-height:1;letter-spacing:.28em;text-indent:.28em">ALEXIS</div>
    </div>
    <div class="wtitle" id="wtitle-el">Applied Algebra in Business</div>
    <div class="wcourse" id="wcourse-el">Business Math</div>
    <label class="flabel" for="sName" id="lbl-name-el">Full name</label>
    <input class="finput" id="sName" type="text" placeholder="Your full name" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" for="sGroup" id="lbl-group-el">Group</label>
    <input class="finput" id="sGroup" type="text" placeholder="e.g. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Start</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreTitle">Saved session found</strong><br>
      <span id="restoreMsg">Do you want to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="200" height="48" viewBox="-22 0 160 34" xmlns="http://www.w3.org/2000/svg"><polyline points="4,24 10,18 16,20 22,10" fill="none" stroke="#1a4a8a" stroke-width="2"/><circle cx="22" cy="10" r="2.5" fill="#c9a84c"/><line x1="32" y1="6" x2="32" y2="28" stroke="#c9a84c" stroke-width="2"/><text x="42" y="22" font-family="'Crimson Pro',serif" font-weight="700" letter-spacing="3" fill="#1a4a8a" font-size="16">LIAXA</text></svg>
    </div>
  </div>
</div>

<!-- ════════════════════ LESSON ════════════════════ -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo -->
      <img id="hlogo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle" id="htitle-el">Applied Algebra in Business</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 120 34" xmlns="http://www.w3.org/2000/svg"><polyline points="4,24 10,18 16,20 22,10" fill="none" stroke="#1a4a8a" stroke-width="2"/><circle cx="22" cy="10" r="2.5" fill="#c9a84c"/><line x1="32" y1="6" x2="32" y2="28" stroke="#c9a84c" stroke-width="2"/><text x="42" y="22" font-family="'Crimson Pro',serif" font-weight="700" letter-spacing="3" fill="#1a4a8a" font-size="16">LIAXA</text></svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle">
      <button class="lang-btn"        id="btn-es" onclick="setLang('es')">ES</button>
      <button class="lang-btn active" id="btn-en" onclick="setLang('en')">EN</button>
    </div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="dlbtn" id="dlBtn" onclick="generatePDF()">Download results as PDF</button>
    </div>
  </div>
</div>

<script>

/* ── Score reporting ─────────────────────────────────────────────────────────
   Sends grade silently to Google Sheet when student finishes.
   Set SCORE_ENDPOINT = '' to disable without breaking anything.
   ──────────────────────────────────────────────────────────────────────────── */
var SCORE_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzIje7cRD7iI77G2-t6LMJEHtvjnwrFOJXsbbLe_4phhI7h9AhjL2HoIil1C-IoEn8T/exec';
/* ════════════════════════════════════════════════════════════════════════
   SCHOOL CONFIG · edit ONLY this block to rebrand for a different school
   ════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:      '#1a4a8a',
  primaryDark:  '#0f2d5a',
  primaryBg:    '#e8edf5',
  accent:       '#c9a84c',
  accentBg:     '#faf3e0',
  pBR: 26,  pBG: 74,  pBB: 138,
  pAR: 201, pAG: 168, pAB: 76,
  darkPrimary:     '#4a7abf',
  darkPrimaryDark: '#7aaae0',
  darkPrimaryBg:   '#0e1e38',
  darkAccent:      '#d4b86a',
  darkAccentBg:    '#241e0e',
  logoLeftB64:  '',

   ════════════════════════════════════════════════════════════════════════ */
function getAttemptKey(name, group) {
  return 'fac_econ_neg__neg_algebra_aplicada__att__' + (name + '__' + group).replace(/\s+/g, '_');
}
function nextAttempt(name, group) {
  var k = getAttemptKey(name, group), n = 0;
  try { n = parseInt(localStorage.getItem(k) || '0', 10) || 0; } catch(e) {}
  n++;
  try { localStorage.setItem(k, String(n)); } catch(e) {}
  return n;
}
function currentAttempt(name, group) {
  var k = getAttemptKey(name, group);
  try { return parseInt(localStorage.getItem(k) || '1', 10) || 1; } catch(e) { return 1; }
}
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t2 = s ^ (s >>> 16);
    t2 = Math.imul(t2, 0x21f0aaad);
    t2 ^= (t2 >>> 15);
    t2 = Math.imul(t2, 0x735a2d97);
    return ((t2 ^ (t2 >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}
/* Shuffles the four options once and keeps both language versions aligned. */
function shuffleOpts(rawEs, rawEn, rng) {
  var p = shuffle([0, 1, 2, 3], rng);
  return {
    es: p.map(function(j) { return rawEs[j]; }),
    en: p.map(function(j) { return rawEn[j]; }),
    correctIdx: p.indexOf(0)
  };
}

   ════════════════════════════════════════════════════════════════════════ */
function nf(x) {
  var neg = x < 0, v = Math.abs(x);
  var s = (Math.round(v * 10) / 10).toString().split('.');
  s[0] = s[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return (neg ? '−' : '') + s.join('.');
}
function nfD(x, d) {
  var neg = x < 0, v = Math.abs(x);
  var s = v.toFixed(d).split('.');
  s[0] = s[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return (neg ? '−' : '') + s.join('.');
}
function money(v)  { return '$' + nf(Math.round(v)); }
function money2(v) { return '$' + nfD(v, 2); }
function dec1(x)   { return x.toFixed(1); }
function dec2(x)   { return x.toFixed(2); }
/* Percentage with one decimal, identical in both languages. */
function pct1(x)   { return (Math.round(x * 1000) / 10).toFixed(1); }
/* Percentage with two decimals, used for option values. */
function pct2(x)   { return (x * 100).toFixed(2) + '%'; }
function intN(x)   { return nf(Math.round(x)); }
function cssv(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }

/* ── THE MODELS THIS GUIDE RUNS ON ────────────────────────────────────────
   Applied algebra starts where the straight line stops being enough. Once
   the price a business can charge depends on how much it wants to place,
   revenue stops being proportional to volume and starts curving, and the
   algebra that answers business questions turns quadratic, then rational. */
function demandUnits(a, b, p)     { return a - b * p; }
function revenueAtPrice(a, b, p)  { return p * demandUnits(a, b, p); }
/* The peak of a downward parabola sits halfway between its two zeros. */
function revenueMaxPrice(a, b)    { return a / (2 * b); }
function chokePrice(a, b)         { return a / b; }
/* Inverse demand: every extra unit placed costs B pesos of price. */
function priceAtVolume(A, B, q)   { return A - B * q; }
function profitAtVolume(A, B, v, F, q) { return (A - B * q - v) * q - F; }
function profitMaxVolume(A, B, v) { return (A - v) / (2 * B); }
function maxProfit(A, B, v, F)    { var m = A - v; return m * m / (4 * B) - F; }
/* The two volumes at which profit exactly equals a target. Between them the
   target is met or beaten; outside them it is missed. A negative value under
   the root means the target sits above the peak and no volume reaches it. */
function profitTargetRoots(A, B, v, F, T) {
  var m = A - v, disc = m * m - 4 * B * (F + T);
  if (disc < 0) return null;
  var r = Math.sqrt(disc);
  return { lo: (m - r) / (2 * B), hi: (m + r) / (2 * B), disc: disc };
}
/* Average cost per unit: a rational expression whose floor is the variable
   cost, approached but never reached however large the volume grows. */
function averageCost(F, v, q)     { return F / q + v; }
function volumeForAverageCost(F, v, target) { return F / (target - v); }
function profitMaxPrice(a, b, v)  { return a / (2 * b) + v / 2; }

/* ════════════════════════════════════════════════════════════════════════
   OPTION BUILDERS · the key is always the first value handed in
   ════════════════════════════════════════════════════════════════════════ */
/* Four distinct numbers rendered by fmt, aligned across languages. */
function valOpts(correct, wrongs, fmt, rng) {
  var seen = {}, vals = [];
  function add(v) {
    if (typeof v !== 'number' || !isFinite(v)) return;
    var s = fmt(v);
    if (seen[s]) return;
    seen[s] = 1; vals.push(s);
  }
  add(correct);
  for (var i = 0; i < wrongs.length && vals.length < 4; i++) add(wrongs[i]);
  for (var j = 1; vals.length < 4 && j < 900; j++) {
    add(correct * (1 + j * 0.12 * (j % 2 ? 1 : -1)));
  }
  for (var k = 1; vals.length < 4 && k < 900; k++) add(correct + k * 0.37);
  return shuffleOpts(vals, vals, rng);
}
function intOpts(correct, wrongs, rng) {
  var seen = {}, vals = [];
  function add(v) {
    if (typeof v !== 'number' || !isFinite(v) || v < 1) return;
    var s = intN(v);
    if (seen[s]) return;
    seen[s] = 1; vals.push(s);
  }
  add(correct);
  for (var i = 0; i < wrongs.length && vals.length < 4; i++) add(wrongs[i]);
  for (var j = 1; vals.length < 4 && j < 900; j++) add(Math.round(correct * (1 + j * 0.13 * (j % 2 ? 1 : -1))));
  return shuffleOpts(vals, vals, rng);
}

/* ════════════════════════════════════════════════════════════════════════
   CANVAS / TABS / PHOTO / HINT / RESULTS

function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#2d5a27';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e) { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e) { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(p[0], p[1]); ctx.stroke(); lx = p[0]; ly = p[1]; }
  function onUp() { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}
function switchTab(idx, panel, btn) {

/* ════════════════════════════════════════════════════════════════════════
   ANSWER HANDLER · two taps to confirm
   ════════════════════════════════════════════════════════════════════════ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = '<strong>' + (isOk ? t('fb-correct') : t('fb-wrong')) + '</strong> ' + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (!prob || prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = '<strong>' + (isOk ? t('fb-correct') : t('fb-wrong')) + '</strong> ' + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

/* ════════════════════════════════════════════════════════════════════════
   CANVAS PRIMITIVES FOR THE WIDGETS
   ════════════════════════════════════════════════════════════════════════ */
function fitCanvas(cv, h) {
  var dpr = window.devicePixelRatio || 1;
  var w = Math.max(240, cv.clientWidth || cv.parentNode.clientWidth || 300);
  cv.style.height = h + 'px';
  cv.width  = Math.round(w * dpr);
  cv.height = Math.round(h * dpr);
  var ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  return { ctx: ctx, w: w, h: h };
}
function palette() {
  return {
    green: cssv('--green'), dark: cssv('--green-dark'), tint: cssv('--green-bg'),
    gold: cssv('--gold'), bad: cssv('--bad'), border: cssv('--border'),
    text: cssv('--text'), text2: cssv('--text2'), text3: cssv('--text3')
  };
}
function kindColor(P, kind) {
  if (kind === 'gold') return P.gold;
  if (kind === 'bad')  return P.bad;
  if (kind === 'tint') return P.tint;
  if (kind === 'soft') return P.text3;
  return P.dark;
}
/* Plots any curve given as a function of one business quantity. A straight
   line, a revenue parabola and an average cost hyperbola are all the same
   picture to this routine, which is the point: the shape follows from the
   algebra, not from a different drawing method.
     opts.marks  points worth naming, such as a peak or a break even volume
     opts.band   the stretch of the horizontal axis that satisfies a target
     opts.hline  a target drawn as a horizontal reference
     opts.asym   the floor a rational curve approaches without touching
     opts.at     where the student is standing right now                     */
function drawCurveChart(g, xMin, xMax, series, opts) {
  var ctx = g.ctx, P = palette(), W = g.w, H = g.h, i;
  var padL = 56, padR = 12, padT = 18, padB = 28;
  opts = opts || {};
  var fmtY  = opts.fmtY || function(v) { return intN(v); };
  var fmtX  = opts.fmtX || function(v) { return intN(v); };
  var STEPS = 140;
  var yLo = null, yHi = null;
  function note(v) {
    if (typeof v !== 'number' || !isFinite(v)) return;
    if (yLo === null || v < yLo) yLo = v;
    if (yHi === null || v > yHi) yHi = v;
  }
  series.forEach(function(s) {
    for (i = 0; i <= STEPS; i++) note(s.f(xMin + (xMax - xMin) * i / STEPS));
  });
  note(opts.yFloor); note(opts.yCeil);
  if (opts.hline) note(opts.hline.y);
  if (opts.asym)  note(opts.asym.y);
  if (yLo === null) { yLo = 0; yHi = 1; }
  if (yHi - yLo < 1) yHi = yLo + 1;
  var pd = (yHi - yLo) * 0.10;
  yLo -= pd; yHi += pd;
  function X(v) { return padL + (v - xMin) / (xMax - xMin) * (W - padL - padR); }
  function Y(v) { return H - padB - (v - yLo) / (yHi - yLo) * (H - padT - padB); }
  function Yc(v) { return Math.max(padT - 10, Math.min(H - padB + 10, Y(v))); }

  /* the stretch of volumes that meets the target, painted before everything */
  if (opts.band && opts.band.to > opts.band.from) {
    var b1 = X(Math.max(xMin, opts.band.from)), b2 = X(Math.min(xMax, opts.band.to));
    if (b2 > b1) {
      ctx.save();
      ctx.fillStyle = P.tint;
      ctx.fillRect(b1, padT - 8, b2 - b1, H - padB - padT + 8);
      ctx.restore();
    }
  }
  /* horizontal guides and the value axis */
  ctx.strokeStyle = P.border; ctx.lineWidth = 1;
  ctx.fillStyle = P.text3; ctx.font = '9px "IBM Plex Mono", monospace';
  for (i = 0; i <= 3; i++) {
    var gv = yLo + (yHi - yLo) * i / 3;
    ctx.beginPath(); ctx.moveTo(padL, Y(gv)); ctx.lineTo(W - padR, Y(gv)); ctx.stroke();
    var gl = fmtY(gv);
    ctx.fillText(gl, Math.max(1, padL - 4 - ctx.measureText(gl).width), Y(gv) + 3);
  }
  /* the zero line matters as soon as a profit curve is on screen */
  if (yLo < 0 && yHi > 0) {
    ctx.save();
    ctx.strokeStyle = P.text3; ctx.lineWidth = 1.4; ctx.setLineDash([3, 3]);
    ctx.beginPath(); ctx.moveTo(padL, Y(0)); ctx.lineTo(W - padR, Y(0)); ctx.stroke();
    ctx.restore();
  }
  /* the floor a rational curve never reaches */
  if (opts.asym) {
    ctx.save();
    ctx.strokeStyle = P.bad; ctx.lineWidth = 1.3; ctx.setLineDash([5, 4]);
    ctx.beginPath(); ctx.moveTo(padL, Y(opts.asym.y)); ctx.lineTo(W - padR, Y(opts.asym.y)); ctx.stroke();
    ctx.restore();
    if (opts.asym.label) {
      ctx.fillStyle = P.bad; ctx.font = '600 9px "IBM Plex Sans", sans-serif';
      ctx.fillText(opts.asym.label, padL + 4, Math.max(10, Y(opts.asym.y) - 4));
    }
  }
  /* the target a business is asked to hit */
  if (opts.hline) {
    ctx.save();
    ctx.strokeStyle = P.gold; ctx.lineWidth = 1.5; ctx.setLineDash([6, 3]);
    ctx.beginPath(); ctx.moveTo(padL, Y(opts.hline.y)); ctx.lineTo(W - padR, Y(opts.hline.y)); ctx.stroke();
    ctx.restore();
    if (opts.hline.label) {
      ctx.fillStyle = P.gold; ctx.font = '600 9px "IBM Plex Sans", sans-serif';
      var hw = ctx.measureText(opts.hline.label).width;
      ctx.fillText(opts.hline.label, W - padR - hw - 2, Math.max(10, Y(opts.hline.y) - 4));
    }
  }
  /* the curves themselves */
  series.forEach(function(s) {
    ctx.strokeStyle = kindColor(P, s.kind); ctx.lineWidth = 2.2;
    ctx.beginPath();
    var started = false;
    for (i = 0; i <= STEPS; i++) {
      var xv = xMin + (xMax - xMin) * i / STEPS;
      var yv = s.f(xv);
      if (typeof yv !== 'number' || !isFinite(yv)) { started = false; continue; }
      var px = X(xv), py = Yc(yv);
      if (!started) { ctx.moveTo(px, py); started = true; } else { ctx.lineTo(px, py); }
    }
    ctx.stroke();
  });
  /* named points, dropped onto both axes */
  (opts.marks || []).forEach(function(m) {
    if (typeof m.x !== 'number' || !isFinite(m.x) || m.x < xMin || m.x > xMax) return;
    var cx = X(m.x), cy = Yc(m.y);
    ctx.save();
    ctx.strokeStyle = kindColor(P, m.kind || 'gold'); ctx.lineWidth = 1.4; ctx.setLineDash([4, 3]);
    ctx.beginPath(); ctx.moveTo(cx, H - padB); ctx.lineTo(cx, cy); ctx.stroke();
    ctx.restore();
    ctx.fillStyle = kindColor(P, m.kind || 'gold');
    ctx.beginPath(); ctx.arc(cx, cy, 4.2, 0, Math.PI * 2); ctx.fill();
    if (m.label) {
      ctx.font = '600 10px "IBM Plex Sans", sans-serif';
      var mw = ctx.measureText(m.label).width;
      ctx.fillText(m.label, Math.min(Math.max(2, cx - mw / 2), W - mw - 2), Math.max(10, cy - 9));
    }
  });
  /* where the student is standing right now */
  if (typeof opts.at === 'number' && opts.at >= xMin && opts.at <= xMax) {
    ctx.save();
    ctx.strokeStyle = P.bad; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(X(opts.at), H - padB); ctx.lineTo(X(opts.at), padT - 6); ctx.stroke();
    ctx.restore();
  }
  /* axes */
  ctx.strokeStyle = P.border; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(padL, padT - 8); ctx.lineTo(padL, H - padB); ctx.lineTo(W - padR, H - padB); ctx.stroke();
  ctx.fillStyle = P.text3; ctx.font = '9px "IBM Plex Mono", monospace';
  [xMin, (xMin + xMax) / 2, xMax].forEach(function(v) {
    var lab = fmtX(v), lw = ctx.measureText(lab).width;
    ctx.fillText(lab, Math.min(Math.max(1, X(v) - lw / 2), W - lw - 1), H - padB + 13);
  });
  /* legend */
  var legX = padL + 4;
  ctx.font = '600 9.5px "IBM Plex Sans", sans-serif';
  series.forEach(function(s) {
    if (!s.label) return;
    ctx.fillStyle = kindColor(P, s.kind);
    ctx.fillRect(legX, 9, 9, 3);
    ctx.fillText(s.label, legX + 12, 13);
    legX += 12 + ctx.measureText(s.label).width + 12;
  });
  if (opts.xLabel) {
    ctx.fillStyle = P.text3; ctx.font = '9px "IBM Plex Sans", sans-serif';
    var xl = opts.xLabel;
    ctx.fillText(xl, W - padR - ctx.measureText(xl).width, H - 3);
  }
}

/* ════════════════════════════════════════════════════════════════════════
   WIDGET 1 · the price that peaks revenue, and why it is not the top price
   ════════════════════════════════════════════════════════════════════════ */
function widgetRevenueCurve(a0, b0, p0) {
  var host = document.createElement('div');
  host.className = 'section';
  document.getElementById('lessonBody').appendChild(host);
  var state = { view: 'rev', a: a0, b: b0, p: p0 };
  function mount() {
    var es = LANG === 'es';
    var MODES = [
      { id: 'rev',    es: 'Ingreso contra precio', en: 'Revenue against price' },
      { id: 'demand', es: 'Unidades contra precio', en: 'Units against price' }
    ];
    var tabs = MODES.map(function(m) {
      return '<button class="mtab' + (m.id === state.view ? ' active' : '') + '" data-m="' + m.id + '">' + m[LANG] + '</button>';
    }).join('');
    host.innerHTML =
      '<div class="gcrd" data-widget="curva-de-ingreso-contra-precio">' +
        '<div class="iw-head"><span class="iw-tag">' + (es ? 'Herramienta' : 'Tool') + '</span>' +
        '<span class="iw-title">' + (es ? 'Dos fuerzas que jalan en sentidos opuestos' : 'Two forces pulling in opposite directions') + '</span></div>' +
        '<div class="iw-sub">' + (es
          ? 'Una tienda sube el precio y gana más por pieza, pero vende menos piezas. El ingreso es el producto de esas dos cosas, así que no crece ni cae sin parar: sube hasta un punto y después se desploma. Mueve el precio a lo largo de toda la barra y sigue la curva. Fíjate en algo que conviene entender antes de seguir: la curva es simétrica, y su punto más alto cae justo a la mitad entre el precio cero y el precio en el que ya nadie compra. Cambia también la sensibilidad del mercado y verás que un público más reactivo no mueve el precio óptimo si el tamaño del mercado se ajusta con él.'
          : 'A store raises its price and earns more per piece, but sells fewer pieces. Revenue is the product of those two things, so it neither grows nor falls forever: it climbs to a point and then collapses. Move the price along the whole bar and follow the curve. Notice something worth understanding before moving on: the curve is symmetric, and its highest point falls exactly halfway between a price of zero and the price at which nobody buys any more. Change the sensitivity of the market too, and you will see that a more reactive public does not move the best price when the size of the market adjusts along with it.') + '</div>' +
        '<div class="mtabs">' + tabs + '</div>' +
        '<div class="cgrid"><div class="cg">' +
          '<label>' + (es ? 'Precio que estás probando' : 'Price you are testing') + ': <span class="cval" id="r1pl"></span></label>' +
          '<input type="range" min="20" max="560" step="5" id="r1p" value="' + state.p + '">' +
        '</div><div class="cg">' +
          '<label>' + (es ? 'Compradores al mes si el precio fuera cero' : 'Buyers a month if the price were zero') + ': <span class="cval" id="r1al"></span></label>' +
          '<input type="range" min="2400" max="9600" step="400" id="r1a" value="' + state.a + '">' +
        '</div></div>' +
        '<div class="cgrid"><div class="cg">' +
          '<label>' + (es ? 'Piezas que se pierden por cada peso de aumento' : 'Units lost for every peso added to the price') + ': <span class="cval" id="r1bl"></span></label>' +
          '<input type="range" min="8" max="40" step="2" id="r1b" value="' + state.b + '">' +
        '</div><div class="cg">' +
          '<label>' + (es ? 'Distancia al precio que más ingreso deja' : 'Distance to the price that leaves the most revenue') + ': <span class="cval" id="r1gl"></span></label>' +
          '<input type="range" min="20" max="560" step="5" id="r1p2" value="' + state.p + '">' +
        '</div></div>' +
        '<canvas class="iw-canvas" id="r1cv"></canvas>' +
        '<div class="metrics">' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Piezas al mes a ese precio' : 'Units a month at that price') + '</div><div class="mnum cs" id="r1q"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Ingreso mensual' : 'Monthly revenue') + '</div><div class="mnum ps" id="r1r"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Precio que más factura' : 'Price that peaks revenue') + '</div><div class="mnum ts" id="r1ps"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Ingreso en el punto más alto' : 'Revenue at the peak') + '</div><div class="mnum cs" id="r1rm"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Precio en el que nadie compra' : 'Price at which nobody buys') + '</div><div class="mnum ps" id="r1ch"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Ingreso que estás dejando ir' : 'Revenue you are leaving behind') + '</div><div class="mnum ts" id="r1gap"></div></div>' +
        '</div>' +
        '<div class="dlist" id="r1steps"></div>' +
        '<div class="iw-read" id="r1read"></div>' +
      '</div>';
    host.querySelectorAll('.mtab').forEach(function(b) {
      b.addEventListener('click', function() {
        state.view = b.getAttribute('data-m');
        host.querySelectorAll('.mtab').forEach(function(x) { x.classList.remove('active'); });
        b.classList.add('active');
        update();
      });
    });
    host.querySelector('#r1p').addEventListener('input', function() {
      state.p = parseInt(this.value, 10);
      host.querySelector('#r1p2').value = state.p;
      update();
    });
    host.querySelector('#r1p2').addEventListener('input', function() {
      state.p = parseInt(this.value, 10);
      host.querySelector('#r1p').value = state.p;
      update();
    });
    host.querySelector('#r1a').addEventListener('input', function() { state.a = parseInt(this.value, 10); update(); });
    host.querySelector('#r1b').addEventListener('input', function() { state.b = parseInt(this.value, 10); update(); });
    update();
  }
  function update() {
    var es = LANG === 'es';
    var a = state.a, b = state.b, p = state.p;
    var choke = chokePrice(a, b);
    var pStar = revenueMaxPrice(a, b);
    var q     = Math.max(0, demandUnits(a, b, p));
    var R     = p * q;
    var Rmax  = revenueAtPrice(a, b, pStar);
    var gap   = Rmax - R;
    var xMax  = Math.max(60, Math.ceil(choke / 20) * 20);
    host.querySelector('#r1pl').textContent  = money(p);
    host.querySelector('#r1al').textContent  = intN(a);
    host.querySelector('#r1bl').textContent  = intN(b);
    host.querySelector('#r1gl').textContent  = money(p - pStar);
    host.querySelector('#r1q').textContent   = intN(q);
    host.querySelector('#r1r').textContent   = money(R);
    host.querySelector('#r1ps').textContent  = money(pStar);
    host.querySelector('#r1rm').textContent  = money(Rmax);
    host.querySelector('#r1ch').textContent  = money(choke);
    host.querySelector('#r1gap').textContent = money(gap);
    host.querySelector('#r1steps').textContent = es
      ? 'La recta de demanda es ' + intN(a) + ' piezas menos ' + intN(b) + ' piezas por cada peso de precio  ·  ' +
        'el ingreso es el precio multiplicado por esa recta, y eso abre una parábola hacia abajo  ·  ' +
        'sus dos ceros están en un precio de cero y en ' + money(choke) + '  ·  ' +
        'el punto más alto cae a la mitad de los dos, en ' + money(pStar)
      : 'The demand line is ' + intN(a) + ' units minus ' + intN(b) + ' units for every peso of price  ·  ' +
        'revenue is the price multiplied by that line, which opens a downward parabola  ·  ' +
        'its two zeros sit at a price of zero and at ' + money(choke) + '  ·  ' +
        'the highest point falls halfway between them, at ' + money(pStar);
    var g = fitCanvas(host.querySelector('#r1cv'), 180);
    if (state.view === 'rev') {
      drawCurveChart(g, 0, xMax, [
        { f: function(x) { return x * Math.max(0, demandUnits(a, b, x)); }, kind: 'green',
          label: (es ? 'Ingreso' : 'Revenue') }
      ], {
        at: p, yFloor: 0,
        fmtY: function(v) { return money(v); }, fmtX: function(v) { return money(v); },
        marks: [{ x: pStar, y: Rmax, label: (es ? 'Punto más alto' : 'Peak'), kind: 'gold' }],
        xLabel: (es ? 'precio' : 'price')
      });
    } else {
      drawCurveChart(g, 0, xMax, [
        { f: function(x) { return Math.max(0, demandUnits(a, b, x)); }, kind: 'green',
          label: (es ? 'Piezas al mes' : 'Units a month') }
      ], {
        at: p, yFloor: 0,
        fmtY: function(v) { return intN(v); }, fmtX: function(v) { return money(v); },
        marks: [{ x: pStar, y: demandUnits(a, b, pStar), label: (es ? 'Mitad del mercado' : 'Half the market'), kind: 'gold' }],
        xLabel: (es ? 'precio' : 'price')
      });
    }
    var side = Math.abs(p - pStar) < 3
      ? 'at'
      : (p > pStar ? 'above' : 'below');
    host.querySelector('#r1read').innerHTML = es
      ? '<strong>Lectura de negocio:</strong> a ' + money(p) + ' la tienda coloca ' + intN(q) + ' piezas y factura ' + money(R) + ' al mes. ' +
        (side === 'at'
          ? 'Estás prácticamente sobre el punto más alto de la curva, así que cualquier movimiento del precio, hacia arriba o hacia abajo, baja el ingreso. '
          : (side === 'above'
            ? 'Estás por arriba del precio que más factura, que es ' + money(pStar) + ', y por eso dejas ir ' + money(gap) + ' al mes: el margen por pieza ya no compensa las piezas que dejas de vender. '
            : 'Estás por debajo del precio que más factura, que es ' + money(pStar) + ', y por eso dejas ir ' + money(gap) + ' al mes: podrías subir el precio y aun así facturar más, porque las piezas que perderías valen menos que los pesos que ganarías en cada venta. ')) +
        'Lo que hay que llevarse es la forma del razonamiento. El ingreso dejó de ser proporcional a la cantidad en cuanto el precio empezó a depender de ella, y una expresión con la incógnita multiplicándose a sí misma ya no es una recta sino una parábola. Ahí termina el álgebra de primer grado y empieza la que este tema pide. Ojo con una confusión frecuente: este precio maximiza el ingreso, no la utilidad, porque hasta aquí no ha aparecido ningún costo.'
      : '<strong>Business reading:</strong> at ' + money(p) + ' the store places ' + intN(q) + ' units and bills ' + money(R) + ' a month. ' +
        (side === 'at'
          ? 'You are practically standing on the highest point of the curve, so any move in the price, up or down, lowers revenue. '
          : (side === 'above'
            ? 'You are above the price that bills the most, which is ' + money(pStar) + ', and that is why you are leaving ' + money(gap) + ' a month behind: the margin per piece no longer makes up for the pieces you stop selling. '
            : 'You are below the price that bills the most, which is ' + money(pStar) + ', and that is why you are leaving ' + money(gap) + ' a month behind: you could raise the price and still bill more, because the pieces you would lose are worth less than the pesos you would gain on every sale. ')) +
        'What is worth taking away is the shape of the reasoning. Revenue stopped being proportional to quantity the moment the price began to depend on it, and an expression where the unknown multiplies itself is no longer a line but a parabola. That is where first degree algebra ends and the algebra this topic asks for begins. Watch out for a common confusion: this price maximizes revenue, not profit, because no cost has appeared yet.';
  }
  widgets.push(mount);
  mount();
}

/* ════════════════════════════════════════════════════════════════════════
   WIDGET 2 · the profit parabola, its two roots and its peak
   ════════════════════════════════════════════════════════════════════════ */
function widgetProfitParabola(A0, B0, v0, F0) {
  var host = document.createElement('div');

  function mount() {

          : 'A plant can place more cases if it lowers the price, so the price is not a given but a consequence of volume. With that, profit stops being a line that rises forever and becomes a parabola with a ceiling. Move the four pieces and watch three things at once: the curve crosses zero at two different volumes, between them the business earns and outside them it loses, and the highest point coincides with neither crossing. Raise the fixed cost little by little until the whole curve sits below zero: that is the moment the square root runs out of numbers to take.') + '</div>' +
        '<div class="mtabs">' + tabs + '</div>' +
        '<div class="cgrid"><div class="cg">' +
          '<label>' + (es ? 'Precio de la primera caja colocada' : 'Price of the first case placed') + ': <span class="cval" id="u2Al"></span></label>' +
          '<input type="range" min="500" max="1600" step="20" id="u2A" value="' + state.A + '">' +
        '</div><div class="cg">' +
          '<label>' + (es ? 'Pesos de precio que cuesta cada caja adicional' : 'Pesos of price each additional case costs') + ': <span class="cval" id="u2Bl"></span></label>' +

        '</div></div>' +
        '<div class="cgrid"><div class="cg">' +
          '<label>' + (es ? 'Costo variable por caja' : 'Variable cost per case') + ': <span class="cval" id="u2vl"></span></label>' +
          '<input type="range" min="100" max="700" step="25" id="u2v" value="' + state.v + '">' +
        '</div><div class="cg">' +
          '<label>' + (es ? 'Costo fijo del mes' : 'Fixed cost of the month') + ': <span class="cval" id="u2Fl"></span></label>' +
          '<input type="range" min="5000" max="150000" step="5000" id="u2F" value="' + state.F + '">' +
        '</div></div>' +
        '<canvas class="iw-canvas" id="u2cv"></canvas>' +
        '<div class="dlist" id="u2steps"></div>' +
        '<div class="metrics">' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Volumen que más deja' : 'Volume that leaves the most') + '</div><div class="mnum cs" id="u2q"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Precio en ese volumen' : 'Price at that volume') + '</div><div class="mnum ps" id="u2p"></div></div>' +

          '<div class="metric"><div class="mlbl">' + (es ? 'Segundo equilibrio' : 'Second break even') + '</div><div class="mnum ts" id="u2r2"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Margen unitario en el óptimo' : 'Unit margin at the optimum') + '</div><div class="mnum ps" id="u2m"></div></div>' +

      '</div>';
    host.querySelectorAll('.mtab').forEach(function(b) {
      b.addEventListener('click', function() {

  function update() {
    var es = LANG === 'es';

    var m  = A - v;
    var viable = m > 0;
    var qStar = viable ? profitMaxVolume(A, B, v) : 0;
    var uMax  = maxProfit(A, B, v, F);
    var roots = viable ? profitTargetRoots(A, B, v, F, 0) : null;
    var xMax  = Math.max(40, Math.ceil(Math.max(qStar * 2.2, viable ? m / B : 40) / 20) * 20);

    host.querySelector('#u2Al').textContent = money(A);
    host.querySelector('#u2Bl').textContent = money(B);
    host.querySelector('#u2vl').textContent = money(v);
    host.querySelector('#u2Fl').textContent = money(F);

    host.querySelector('#u2u').textContent  = money(uMax);

    host.querySelector('#u2r2').textContent = roots ? intN(Math.floor(roots.hi)) : (es ? 'No hay' : 'None');

      ? 'El precio en el volumen q es ' + money(A) + ' menos ' + money(B) + ' por caja  ·  ' +

        (roots
          ? 'sus dos raíces caen en ' + intN(Math.ceil(roots.lo)) + ' y ' + intN(Math.floor(roots.hi)) + ' cajas'
          : 'el discriminante quedó negativo, así que no hay ninguna raíz real y ningún volumen deja ganancia')
      : 'The price at volume q is ' + money(A) + ' minus ' + money(B) + ' per case  ·  ' +
        'profit is that price minus ' + money(v) + ', all multiplied by q, and minus ' + money(F) + '  ·  ' +
        'expanding brings out a term in q squared, so the curve is a downward parabola  ·  ' +
        (roots
          ? 'its two roots land at ' + intN(Math.ceil(roots.lo)) + ' and ' + intN(Math.floor(roots.hi)) + ' cases'
          : 'the discriminant came out negative, so there is no real root and no volume leaves a gain');
    var g = fitCanvas(host.querySelector('#u2cv'), 185);
    if (state.view === 'profit') {
      var marks = [];
      if (viable) marks.push({ x: qStar, y: uMax, label: (es ? 'Techo' : 'Ceiling'), kind: 'gold' });
      if (roots) {
        marks.push({ x: roots.lo, y: 0, label: (es ? 'Equilibrio' : 'Break even'), kind: 'bad' });
        marks.push({ x: roots.hi, y: 0, label: (es ? 'Equilibrio' : 'Break even'), kind: 'bad' });
      }
      drawCurveChart(g, 0, xMax, [
        { f: function(x) { return profitAtVolume(A, B, v, F, x); }, kind: 'green', label: (es ? 'Utilidad' : 'Profit') }
      ], {
        yCeil: 0, fmtY: function(val) { return money(val); },
        band: roots ? { from: roots.lo, to: roots.hi } : null,
        marks: marks, xLabel: (es ? 'cajas al mes' : 'cases a month')
      });
    } else {
      drawCurveChart(g, 0, xMax, [
        { f: function(x) { return priceAtVolume(A, B, x) * x; }, kind: 'gold', label: (es ? 'Ingreso' : 'Revenue') },
        { f: function(x) { return F + v * x; }, kind: 'green', label: (es ? 'Costo total' : 'Total cost') }
      ], {
        fmtY: function(val) { return money(val); },
        marks: roots ? [{ x: roots.lo, y: priceAtVolume(A, B, roots.lo) * roots.lo, label: (es ? 'Se cruzan' : 'They cross'), kind: 'bad' },
                        { x: roots.hi, y: priceAtVolume(A, B, roots.hi) * roots.hi, label: (es ? 'Se cruzan' : 'They cross'), kind: 'bad' }] : [],
        xLabel: (es ? 'cajas al mes' : 'cases a month')
      });
    }
    host.querySelector('#u2read').innerHTML = es
      ? '<strong>Lectura de negocio:</strong> ' + (viable
          ? 'el techo de la utilidad está en ' + intN(qStar) + ' cajas, con un precio de ' + money(pAt) + ' y una ganancia de ' + money(uMax) + ' al mes. '
          : 'con el precio inicial por debajo del costo variable ninguna caja deja margen, así que la curva no tiene techo positivo. ') +
        (roots
          ? 'Los dos equilibrios están en ' + intN(Math.ceil(roots.lo)) + ' y ' + intN(Math.floor(roots.hi)) + ' cajas, y el tramo verde entre ellos es la única zona donde el negocio gana dinero. Que existan dos y no uno tiene una explicación de negocio directa: por debajo del primero el volumen no alcanza a cubrir el costo fijo, y por arriba del segundo hay que rebajar tanto el precio para colocar tantas cajas que el ingreso adicional ya no paga ni el costo variable. Producir de más puede quebrar a una empresa igual que producir de menos. '
          : 'La curva entera quedó por debajo del cero: el discriminante es negativo y no hay raíces reales, lo que en el negocio significa que ningún volumen salva al producto. Bajar el costo fijo o ensanchar el margen sube la parábola hasta que vuelve a tocar el eje. ') +
        'Un detalle que vale la pena fijar: el volumen que más deja no es ninguno de los equilibrios ni el punto medio de una recta, sino el vértice, y cae exactamente a la mitad entre las dos raíces por la simetría de la parábola.'
      : '<strong>Business reading:</strong> ' + (viable
          ? 'the ceiling of profit sits at ' + intN(qStar) + ' cases, at a price of ' + money(pAt) + ' and a gain of ' + money(uMax) + ' a month. '
          : 'with the opening price below the variable cost no case leaves a margin, so the curve has no positive ceiling. ') +
        (roots
          ? 'The two break even points are at ' + intN(Math.ceil(roots.lo)) + ' and ' + intN(Math.floor(roots.hi)) + ' cases, and the green stretch between them is the only zone where the business earns money. That there are two and not one has a direct business explanation: below the first, volume does not cover the fixed cost, and above the second the price has to be cut so far to place that many cases that the extra revenue no longer pays even the variable cost. Producing too much can sink a company just as producing too little can. '
          : 'The whole curve sits below zero: the discriminant is negative and there are no real roots, which in the business means no volume saves this product. Cutting the fixed cost or widening the margin lifts the parabola until it touches the axis again. ') +
        'One detail worth fixing in memory: the volume that leaves the most is neither of the break even points nor the midpoint of a line, but the vertex, and it falls exactly halfway between the two roots because the parabola is symmetric.';
  }
  widgets.push(mount);
  mount();
}

/* ════════════════════════════════════════════════════════════════════════

    host.querySelector('#t3w').textContent   = band ? intN(Math.max(0, Math.floor(band.hi) - Math.ceil(band.lo))) : (es ? 'Vacío' : 'Empty');

      marks: marks,
      xLabel: (es ? 'cajas al mes' : 'cases a month')
    });
    host.querySelector('#t3read').innerHTML = es
      ? '<strong>Lectura de negocio:</strong> ' + (band
          ? 'cualquier volumen entre ' + intN(Math.ceil(band.lo)) + ' y ' + intN(Math.floor(band.hi)) + ' cajas cumple la meta de ' + money(T) + ', y eso son ' + intN(Math.max(0, Math.floor(band.hi) - Math.ceil(band.lo))) + ' cajas de margen de maniobra para producción y ventas. El techo de la curva está en ' + money(uMax) + ' con ' + intN(qStar) + ' cajas, así que la meta deja una holgura de ' + money(slack) + '. Conviene leer los dos extremos con cabeza distinta: el mínimo es el que casi todos calculan, mientras que el máximo se le escapa a mucha gente porque cuesta creer que vender de más pueda tirar la utilidad por debajo de la meta. Aquí sí puede, porque cada caja extra se coloca a un precio más bajo. '
          : 'con esta meta de ' + money(T) + ' no existe ningún volumen que la cumpla: el techo de la curva es ' + money(uMax) + ', que se queda ' + money(Math.abs(slack)) + ' por debajo de lo pedido. La desigualdad no tiene solución, y ese vacío es información valiosa: hay que mover el costo fijo, el costo variable o la sensibilidad del precio, porque insistir en el volumen no llevará a ningún lado. ') +
        'El punto de método es este: una desigualdad de segundo grado no se resuelve probando volúmenes, se resuelve encontrando primero las dos fronteras donde la utilidad iguala exactamente a la meta, y decidiendo después si el tramo bueno queda entre ellas o fuera. Como el coeficiente cuadrático es negativo, la parábola abre hacia abajo y el tramo bueno es el de en medio.'
      : '<strong>Business reading:</strong> ' + (band
          ? 'any volume between ' + intN(Math.ceil(band.lo)) + ' and ' + intN(Math.floor(band.hi)) + ' cases meets the target of ' + money(T) + ', and that is ' + intN(Math.max(0, Math.floor(band.hi) - Math.ceil(band.lo))) + ' cases of room to manoeuvre for production and sales. The ceiling of the curve is ' + money(uMax) + ' at ' + intN(qStar) + ' cases, so the target leaves a slack of ' + money(slack) + '. The two ends deserve different reading: the minimum is the one almost everybody computes, while the maximum escapes many people because it is hard to believe that selling more could push profit below the target. Here it can, because every extra case is placed at a lower price. '
          : 'with this target of ' + money(T) + ' no volume meets it: the ceiling of the curve is ' + money(uMax) + ', which falls ' + money(Math.abs(slack)) + ' short of what was asked. The inequality has no solution, and that emptiness is valuable information: the fixed cost, the variable cost or the price sensitivity has to move, because insisting on volume will lead nowhere. ') +
        'The point of method is this: a second degree inequality is not solved by trying volumes, it is solved by finding first the two boundaries where profit exactly equals the target, and then deciding whether the good stretch lies between them or outside. Because the squared coefficient is negative, the parabola opens downward and the good stretch is the middle one.';
  }
  widgets.push(mount);
  mount();
}

      : '<strong>Business reading:</strong> at ' + intN(q) + ' pieces a month each one carries ' + money2(ac) + ', of which ' + money(v) + ' is its own material and ' + money2(fixedPart) + ' is the slice of fixed cost it was handed. If the plant doubled its volume, average cost would fall to ' + money2(ac2) + ', a saving of ' + money2(ac - ac2) + ' per piece. That saving is not constant: doubling from a small volume saves a lot and doubling from a large one saves cents, because the only thing being spread is the fixed block and it was already nearly spread. ' +

  /* ═══════════════════════ CONCEPT 1 ═══════════════════════ */

  addSection(function(L) {
    var es = L === 'es';
    if (es) return '' +
      '<div class="stag">Concepto 1</div>' +
      '<h2>Cuando el precio deja de ser un dato y pasa a ser una decisión</h2>' +
      '<p>En el álgebra lineal de un negocio el precio se recibe como un dato: alguien lo fija y la única incógnita es cuánto hay que vender. En cuanto se acepta que el precio también se decide, aparece un hecho incómodo que cualquier comerciante conoce por experiencia: subirlo aleja compradores. Esa relación entre precio y cantidad se llama <strong>demanda</strong>, y en el rango en que trabaja una empresa se aproxima muy bien con una recta descendente, donde el término que acompaña al precio mide cuántas piezas se pierden por cada peso de aumento.</p>' +
      '<p>El cambio de fondo ocurre al calcular el ingreso. Antes era el precio multiplicado por una cantidad independiente de él, es decir una recta. Ahora la cantidad es una expresión que contiene al propio precio, así que al multiplicar aparece el precio consigo mismo y el resultado es un <strong>polinomio de segundo grado</strong>. Ese producto de dos factores lineales es el corazón de este tema, y conviene desarrollarlo a mano al menos una vez para ver de dónde sale el término cuadrático y por qué su coeficiente es negativo.</p>' +
      '<p>Un polinomio de segundo grado con coeficiente principal negativo dibuja una <strong>parábola que abre hacia abajo</strong>, y una parábola tiene un punto más alto llamado <strong>vértice</strong>. Hay un atajo que evita toda la maquinaria de derivadas y que además se entiende: la parábola es simétrica respecto de una recta vertical que pasa por el vértice, así que si se conocen sus dos ceros, el vértice cae exactamente a la mitad de ellos. Los ceros del ingreso son fáciles de nombrar: un precio de cero no factura nada, y el precio en el que ya nadie compra tampoco.</p>' +
      '<p>Conviene decir desde ahora lo que este cálculo no responde. El precio que maximiza el <strong>ingreso</strong> no es el que maximiza la <strong>utilidad</strong>, porque el ingreso ignora por completo lo que cuesta producir. La utilidad óptima siempre está a un precio más alto y a un volumen más bajo que el óptimo de ingreso, y la razón es sencilla: las últimas piezas que se colocan para llegar al máximo de facturación se venden tan baratas que traen consigo un costo variable que no alcanzan a cubrir con holgura. Ese contraste es el asunto del siguiente concepto.</p>' +
      '<div class="rules-grid">' +
        '<div class="rcard"><div class="rname">Demanda</div><div class="rform">q = a − b·p</div><div class="rnote">Cada peso de precio cuesta b piezas.</div></div>' +

        '<div class="rcard"><div class="rname">Vértice</div><div class="rform">p* = ' + frac('a', '2·b') + '</div><div class="rnote">Justo a la mitad de los dos ceros.</div></div>' +

      '<p><strong>Ejemplo resuelto.</strong> Una editorial universitaria vende hoy su manual de contabilidad en ' + money(c1p0) + ' y coloca ' + intN(c1q0) + ' ejemplares al mes. El área comercial midió la reacción del mercado y encontró que por cada peso que sube el precio deja de vender ' + intN(c1b) + ' ejemplares, y por cada peso que lo baja vende ' + intN(c1b) + ' más. La dirección quiere saber si el precio actual es el que más factura.</p>' +

    return '' +
      '<div class="stag">Concept 1</div>' +
      '<h2>When the price stops being a given and becomes a decision</h2>' +
      '<p>In the linear algebra of a business the price arrives as a given: somebody sets it and the only unknown is how much has to be sold. The moment you accept that the price is also decided, an uncomfortable fact appears that any shopkeeper knows from experience: raising it drives buyers away. That relation between price and quantity is called <strong>demand</strong>, and over the range a company works in it is approximated very well by a downward straight line, where the term beside the price measures how many units are lost for every peso added.</p>' +
      '<p>The deep change happens when revenue is computed. Before, it was the price multiplied by a quantity independent of it, that is, a straight line. Now the quantity is an expression containing the price itself, so multiplying brings the price together with itself and the result is a <strong>second degree polynomial</strong>. That product of two linear factors is the heart of this topic, and it pays to expand it by hand at least once to see where the squared term comes from and why its coefficient is negative.</p>' +
      '<p>A second degree polynomial with a negative leading coefficient draws a <strong>parabola opening downward</strong>, and a parabola has a highest point called the <strong>vertex</strong>. There is a shortcut that avoids the whole machinery of derivatives and that also makes sense on its own: the parabola is symmetric about a vertical line through the vertex, so if you know its two zeros, the vertex falls exactly halfway between them. The zeros of revenue are easy to name: a price of zero bills nothing, and neither does the price at which nobody buys any more.</p>' +
      '<p>It is worth saying right away what this calculation does not answer. The price that maximizes <strong>revenue</strong> is not the one that maximizes <strong>profit</strong>, because revenue ignores entirely what it costs to produce. The profit optimum always sits at a higher price and a lower volume than the revenue optimum, and the reason is simple: the last units placed on the way to peak billing are sold so cheaply that they drag along a variable cost they barely cover. That contrast is the business of the next concept.</p>' +

        '<div class="rcard"><div class="rname">The two zeros</div><div class="rform">p = 0  and  p = ' + frac('a', 'b') + '</div><div class="rnote">Neither free nor too dear for anyone.</div></div>' +

  addSection(function(L) {

      '<div class="stag">Concepto 2</div>' +
      '<h2>La utilidad con techo y sus dos puntos de equilibrio</h2>' +
      '<p>Meter el costo dentro del modelo anterior cambia la pregunta de facturar a ganar. La utilidad sigue siendo el ingreso menos el costo total, pero ahora el ingreso es una parábola y el costo total sigue siendo una recta, de modo que la resta hereda el término cuadrático y la utilidad se vuelve también una <strong>parábola hacia abajo</strong>. Ese único hecho tiene tres consecuencias de negocio que conviene separar con cuidado, porque en el modelo lineal ninguna de las tres existía.</p>' +
      '<p>La primera es que la utilidad tiene un <strong>techo</strong>. En el mundo lineal, si el margen unitario era positivo, vender más siempre convenía y la única frontera era la capacidad de la planta. Aquí no: pasado cierto volumen, colocar una caja más obliga a rebajar tanto el precio de todas las cajas que la utilidad empieza a bajar. El volumen que la maximiza es el vértice, y como la parábola es simétrica, ese vértice está a la mitad entre las dos raíces.</p>' +
      '<p>La segunda es que ahora hay <strong>dos puntos de equilibrio</strong> y no uno. La utilidad vale cero en dos volúmenes distintos: uno bajo, donde todavía no se cubre el costo fijo, y otro alto, donde el precio ya se hundió demasiado. Entre ellos la empresa gana y fuera de ellos pierde. Encontrarlos es resolver una <strong>ecuación de segundo grado</strong>, y para eso sirve la fórmula general, que no es un conjuro sino el resultado de completar el cuadrado una vez y para siempre.</p>' +
      '<p>La tercera vive dentro de esa fórmula, en la cantidad que queda bajo la raíz, llamada <strong>discriminante</strong>. Si es positiva hay dos raíces y existe una zona rentable. Si vale cero las dos raíces se juntan y el negocio apenas roza el cero en un solo volumen. Y si es negativa no hay raíces reales, lo que traducido al negocio significa que el techo de la utilidad quedó por debajo de cero y ningún volumen salva al producto. Ese signo es una de las señales más útiles que el álgebra le manda a una dirección: el problema no es de ventas, es de estructura de costos o de precio.</p>' +
      '<div class="rules-grid">' +
        '<div class="rcard"><div class="rname">Precio por volumen</div><div class="rform">p = A − B·q</div><div class="rnote">Colocar más obliga a cobrar menos.</div></div>' +
        '<div class="rcard"><div class="rname">Utilidad</div><div class="rform">U = (A − B·q − v)·q − F</div><div class="rnote">Una parábola, no una recta.</div></div>' +
        '<div class="rcard"><div class="rname">Vértice</div><div class="rform">q* = ' + frac('A − v', '2·B') + '</div><div class="rnote">El volumen que más deja.</div></div>' +

      '</div>' +
      '<p><strong>Ejemplo resuelto.</strong> Una planta de muebles en Colima puede colocar la primera recámara del mes en ' + money(c2A) + ', pero para colocar cada recámara adicional tiene que bajar el precio de toda la línea en ' + money(c2B) + '. Fabricar cada recámara cuesta ' + money(c2v) + ' en madera, herrajes y mano de obra directa, y la planta sostiene ' + money(c2F) + ' al mes de costo fijo. La dirección quiere el volumen que más utilidad deja.</p>' +

      '<strong>Paso 2.</strong> Con la primera recámara a ' + money(c2A) + ' y un costo de ' + money(c2v) + ', el margen de arranque es ' + money(c2m) + '. El vértice cae en ' + intN(c2q) + ' recámaras.<br>' +

      '<strong>Paso 4.</strong> Igualando la utilidad a cero y aplicando la fórmula general aparecen los dos equilibrios, en ' + intN(Math.ceil(c2roots.lo)) + ' y en ' + intN(Math.floor(c2roots.hi)) + ' recámaras. Entre esas dos cifras la planta gana dinero.<br>' +

    return '' +
      '<div class="stag">Concept 2</div>' +
      '<h2>Profit with a ceiling, and its two break even points</h2>' +
      '<p>Bringing cost into the previous model turns the question from billing into earning. Profit is still revenue minus total cost, but revenue is now a parabola while total cost is still a straight line, so the subtraction inherits the squared term and profit becomes a <strong>downward parabola</strong> as well. That single fact has three business consequences worth separating carefully, because none of the three existed in the linear model.</p>' +
      '<p>The first is that profit has a <strong>ceiling</strong>. In the linear world, if the unit margin was positive, selling more was always worth it and the only boundary was the capacity of the plant. Not here: past a certain volume, placing one more case forces the price of every case down so far that profit starts to fall. The volume that maximizes it is the vertex, and because the parabola is symmetric, that vertex sits halfway between the two roots.</p>' +
      '<p>The second is that there are now <strong>two break even points</strong> and not one. Profit is zero at two different volumes: a low one, where the fixed cost is still uncovered, and a high one, where the price has already sunk too far. Between them the company earns and outside them it loses. Finding them means solving a <strong>quadratic equation</strong>, which is what the general formula is for, and that formula is no incantation but the result of completing the square once and for all.</p>' +
      '<p>The third lives inside that formula, in the quantity under the root, called the <strong>discriminant</strong>. If it is positive there are two roots and a profitable zone exists. If it is zero the two roots merge and the business barely grazes zero at a single volume. And if it is negative there are no real roots, which translated into the business means the ceiling of profit ended up below zero and no volume saves the product. That sign is one of the most useful signals algebra sends to a management team: the problem is not sales, it is the cost structure or the price.</p>' +
      '<div class="rules-grid">' +
        '<div class="rcard"><div class="rname">Price by volume</div><div class="rform">p = A − B·q</div><div class="rnote">Placing more forces charging less.</div></div>' +
        '<div class="rcard"><div class="rname">Profit</div><div class="rform">U = (A − B·q − v)·q − F</div><div class="rnote">A parabola, not a line.</div></div>' +
        '<div class="rcard"><div class="rname">Vertex</div><div class="rform">q* = ' + frac('A − v', '2·B') + '</div><div class="rnote">The volume that leaves the most.</div></div>' +
        '<div class="rcard"><div class="rname">Discriminant</div><div class="rform">(A − v)² − 4·B·F</div><div class="rnote">Negative: no volume saves the product.</div></div>' +
      '</div>' +
      '<p><strong>Worked example.</strong> A furniture plant in Colima can place the first bedroom set of the month at ' + money(c2A) + ', but to place each additional set it has to cut the price of the whole line by ' + money(c2B) + '. Making each set costs ' + money(c2v) + ' in timber, fittings and direct labour, and the plant carries ' + money(c2F) + ' a month of fixed cost. Management wants the volume that leaves the most profit.</p>' +
      '<div class="callout"><p><strong>Step 1.</strong> Write the margin per set as the price minus ' + money(c2v) + ', and multiply it by the volume. Expanding brings out the squared term with a negative sign that makes profit a downward parabola.<br>' +

  addSection(function(L) {
