<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medidas de Tendencia Central y Dispersión</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }

/* ── GUIDE-SPECIFIC: manipulativos de azar y frecuencia ── */
.iw-tag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.4rem; }
.iw-box { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; padding:1rem; }
.iw-instr { font-size:.88rem; color:var(--text2); margin-bottom:.7rem; }
.rondas { font-family:'IBM Plex Mono',monospace; font-size:.7rem; color:var(--text3); letter-spacing:.08em; text-transform:uppercase; margin-bottom:.45rem; }
.rfb { font-size:.84rem; margin-top:.6rem; min-height:1.35rem; color:var(--text2); }
.rfb b { color:var(--green-dark); }
.okmsg { color:var(--ok); font-weight:700; }
.rverify-btn { background:var(--green); color:#fff; border:none; border-radius:8px; padding:.6rem 1.2rem; font-size:.86rem; font-weight:600; cursor:pointer; min-height:44px; margin-top:.7rem; font-family:inherit; }
.rverify-btn:hover { background:var(--green-dark); }
.goalbar { font-size:.83rem; color:var(--text2); background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.45rem .7rem; margin-bottom:.65rem; }
.gcanvas { display:block; width:100%; height:250px; border:1px solid var(--border); border-radius:8px; background:var(--surface); touch-action:manipulation; cursor:pointer; }
.binrow { display:flex; gap:.5rem; flex-wrap:wrap; margin-top:.7rem; }
.binbtn { flex:1 1 150px; min-height:44px; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.82rem; font-weight:600; cursor:pointer; font-family:inherit; padding:.4rem .5rem; }
.binbtn:hover { border-color:var(--green); color:var(--green); }
.simrow { display:flex; gap:.45rem; flex-wrap:wrap; margin-top:.75rem; }
.simbtn { flex:1 1 92px; min-height:44px; border:1.5px solid var(--green); border-radius:8px; background:var(--green); color:#fff; font-size:.82rem; font-weight:600; cursor:pointer; font-family:inherit; padding:.4rem .5rem; }
.simbtn.alt { background:var(--surface2); color:var(--text2); border-color:var(--border); }
.facegrid { display:grid; grid-template-columns:repeat(6,1fr); gap:.4rem; margin:.75rem 0 .2rem; }
.facebtn { min-height:46px; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:1.05rem; font-weight:700; cursor:pointer; }
.facebtn.on { background:var(--gold-bg); border-color:var(--gold); }
.facebtn.good { background:var(--ok-bg); border-color:var(--ok); color:var(--ok); }
.pbarwrap { position:relative; height:26px; background:var(--surface2); border:1px solid var(--border); border-radius:6px; overflow:hidden; margin:.65rem 0 .2rem; }
.pbarfill { position:absolute; left:0; top:0; bottom:0; background:var(--green); opacity:.72; transition:width .14s; }
.krow { display:flex; align-items:center; gap:.6rem; margin-top:.7rem; flex-wrap:wrap; }
.krow input[type=range] { flex:1; min-width:150px; accent-color:var(--green); height:36px; }
.kval { font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:1rem; color:var(--green); min-width:120px; text-align:right; }
.livelbl { margin-top:.55rem; font-size:.88rem; color:var(--text2); }
.livelbl b { color:var(--green-dark); }
.bigval { font-family:'IBM Plex Mono',monospace; font-size:1.5rem; font-weight:700; color:var(--green-dark); text-align:center; margin:.45rem 0; }
.dtable { width:100%; border-collapse:collapse; margin:.7rem 0; font-size:.83rem; }
.dtable th, .dtable td { border:1px solid var(--border); padding:.35rem .5rem; text-align:center; }
.dtable th { background:var(--surface2); color:var(--text3); font-size:.72rem; text-transform:uppercase; letter-spacing:.05em; font-weight:600; }
.dtable td { color:var(--text2); font-family:'IBM Plex Mono',monospace; }
.defgrid { display:grid; grid-template-columns:repeat(2,1fr); gap:.6rem; margin:1rem 0; }
.defcell { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.75rem; border-top:3px solid var(--green); }
.defname { font-size:.72rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.25rem; }
.deftxt { font-size:.82rem; color:var(--text2); }
.stepslist { margin:.9rem 0 0; padding-left:1.1rem; }
.stepslist li { font-size:.86rem; color:var(--text2); margin-bottom:.35rem; }
.mdgrid { display:grid; grid-template-columns:repeat(5,1fr); gap:.4rem; margin-top:.75rem; }
.mdcell { display:flex; flex-direction:column; gap:.3rem; }
.mdbtn { min-height:42px; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.9rem; font-weight:700; cursor:pointer; font-family:inherit; }
.mdbtn:hover { border-color:var(--green); color:var(--green); }
.chiprow { display:flex; flex-wrap:wrap; gap:.45rem; margin:.75rem 0 .2rem; }
.numchip { min-width:52px; min-height:44px; display:flex; align-items:center; justify-content:center; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:.92rem; cursor:pointer; }
.numchip.mid { border-color:var(--green); }
.numchip.sel { border-color:var(--gold); background:var(--gold-bg); }
.numchip.locked { cursor:default; border-color:var(--ok); color:var(--ok); }
.statrow { display:flex; gap:.5rem; flex-wrap:wrap; margin-top:.7rem; }
.statcell { flex:1 1 104px; background:var(--surface2); border-radius:8px; padding:.45rem; text-align:center; }
.statlbl { font-size:.65rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); }

.statval.alt { color:var(--gold); }

  .mdbtn { font-size:.8rem; }

<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Medidas de Tendencia Central y Dispersión</div>
    <div class="wcourse" id="wcourse-el">Matemáticas · 2° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Medidas de Tendencia Central y Dispersión</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

      <button class="sbtn" id="dlBtn" onclick="generatePDF()" style="max-width:280px;margin:0 auto;">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

/* ── Attempt counter + seed (Rule 4): seed = name+group+attempt ── */
function getAttemptKey(name, group){ return 'liaxa_mat2_t11_g02__att__' + (name+'__'+group).replace(/\s+/g,'_'); }
function nextAttempt(name, group){ var k=getAttemptKey(name,group),n=0; try{n=parseInt(localStorage.getItem(k)||'0',10)||0;}catch(e){} n++; try{localStorage.setItem(k,String(n));}catch(e){} return n; }
function currentAttempt(name, group){ var k=getAttemptKey(name,group); try{return parseInt(localStorage.getItem(k)||'1',10)||1;}catch(e){return 1;} }
/* ================================================
   STATE
   ================================================ */
var studentData   = {};
var problems      = [];

/* ================================================
   SESSION PERSISTENCE  (localStorage)
   ================================================ */
function lsKey() {
  var n = (studentData.name  || '').trim();
  var g = (studentData.group || '').trim();
  return 'liaxa_mat2_t11_g02__' + (n + '__' + g).replace(/\s+/g, '_');
}

function saveSession() {
  if (!studentData.name) return;
  var drawings = [], texts = [], photos = [];
  problems.forEach(function(p, i) {
    var dc = document.getElementById('dc' + i);
    if (dc && dc.width) {
      var blank = document.createElement('canvas');
      blank.width = dc.width; blank.height = dc.height;
      drawings.push(dc.toDataURL() === blank.toDataURL() ? null : dc.toDataURL('image/png'));
    } else { drawings.push(null); }
    var ta = document.getElementById('ta' + i);
    texts.push(ta ? ta.value : '');
    var pp = document.getElementById('pp' + i);
    photos.push((pp && pp.src && pp.src.indexOf('data:') === 0) ? pp.src : null);
  });
  var state = {
    name: studentData.name, group: studentData.group,
    answeredCount: answeredCount, correctCount: correctCount,
    choices: problems.map(function(p) { return p.studentChoice; }),
    drawings: drawings, texts: texts, photos: photos
  };
  try { localStorage.setItem(lsKey(), JSON.stringify(state)); } catch(e) {}
}

function loadSession(name, group) {
  var key = 'liaxa_mat2_t11_g02__' + (name + '__' + group).replace(/\s+/g, '_');
  try { var r = localStorage.getItem(key); return r ? JSON.parse(r) : null; } catch(e) { return null; }
}

function restoreSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  var saved = loadSession(name, group);
  if (!saved) return;
  document.getElementById('restoreBar').style.display = 'none';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = currentAttempt(name, group);
  buildLesson(seededRng(name + group + att));
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
  saved.choices.forEach(function(choice, idx) {
    if (choice !== null && choice !== undefined) confirmMC(idx, choice);
  });
  setTimeout(function() {
    if (saved.drawings) {
      saved.drawings.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var dc = document.getElementById('dc' + i);
        if (!dc || !dc.width) return;
        var img = new Image();
        img.onload = function() {
          var dpr = window.devicePixelRatio || 1;
          dc.getContext('2d').drawImage(img, 0, 0, dc.width / dpr, dc.height / dpr);
        };
        img.src = dataUrl;
      });
    }
    if (saved.texts) {
      saved.texts.forEach(function(text, i) {
        if (!text) return;
        var ta = document.getElementById('ta' + i);
        if (ta) ta.value = text;
      });
    }
    if (saved.photos) {
      saved.photos.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var pp = document.getElementById('pp' + i);
        if (!pp) return;
        pp.src = dataUrl; pp.style.display = 'block';
        var pz = document.getElementById('pz' + i);
        if (pz) pz.style.opacity = '0.4';
      });
    }
  }, 300);
}

function dismissRestore() {
  document.getElementById('restoreBar').style.display = 'none';
}

function checkForSavedSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  if (!name || !group) { document.getElementById('restoreBar').style.display = 'none'; return; }
  var saved = loadSession(name, group);
  var bar = document.getElementById('restoreBar');
  bar.style.display = (saved && saved.choices && saved.choices.some(function(c){ return c !== null; })) ? 'block' : 'none';
}

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS — INJECTION BLOCK ─────────────────────────────────────────
  //   Match these RGB values to --green and --gold above.

  function pdfText(html) {
    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/\u2192/g,'->').replace(/\u2212/g,'-').replace(/\u00b2/g,'^2')
      .replace(/\u00b3/g,'^3').replace(/\u00d7/g,'x').replace(/\u00f7/g,'/')
      .replace(/\u2260/g,'!=').replace(/\u2264/g,'<=').replace(/\u2265/g,'>=')
      .replace(/\u221a/g,'sqrt').replace(/\u03c0/g,'pi').replace(/\u2026/g,'...')

/* ================================================
   buildLesson — OVERRIDE IN EACH GUIDE
   ================================================ */
function buildLesson(rng) {
  var LB = document.getElementById('lessonBody');
  LB.innerHTML = '';
  problems = [];

  /* ============================================================
     HELPERS
     ============================================================ */
  function T(o){
    if (o === undefined || o === null) return '';
    if (typeof o === 'string' || typeof o === 'number') return o;
    if (Object.prototype.toString.call(o) === '[object Array]') return o;
    return (o[LANG] !== undefined ? o[LANG] : o.es);
  }
  function ri(a,b){ return a + Math.floor(rng()*(b-a+1)); }
  function shufA(arr){
    var a = arr.slice(), i, j, t;
    for (i=a.length-1;i>0;i--){ j=Math.floor(rng()*(i+1)); t=a[i]; a[i]=a[j]; a[j]=t; }
    return a;
  }
  var REDRAW = [];
  function sec(tag, title, html){
    var d = document.createElement('div');
    d.className = 'section';
    d.innerHTML = '<div class="stag">'+tag+'</div><h2>'+title+'</h2>'+(html||'');
    LB.appendChild(d);
    return d;
  }
  function widget(kind){
    var d = document.createElement('div');
    d.className = kind + 'wrap section';
    d.setAttribute('data-widget', kind);
    d.id = 'w' + kind;
    LB.appendChild(d);
    return d;
  }
  function cssv(n){
    try { var v = getComputedStyle(document.documentElement).getPropertyValue(n); return v ? v.trim() : ''; }
    catch(e){ return ''; }
  }
  function fitCv(cv){
    var dpr = window.devicePixelRatio || 1;
    var w = cv.clientWidth || 320, h = cv.clientHeight || 230;
    cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr);
    var ctx = cv.getContext('2d');
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,w,h);
    return { ctx:ctx, w:w, h:h };
  }
  function d2(v){ return String(Math.round(v*100)/100); }
  function sumA(a){ var s=0,i; for(i=0;i<a.length;i++) s+=a[i]; return s; }
  function mediaA(a){ return sumA(a)/a.length; }
  function ordA(a){ return a.slice().sort(function(x,y){ return x-y; }); }
  function medianaA(a){ var s=ordA(a), n=s.length; return (n%2) ? s[(n-1)/2] : (s[n/2-1]+s[n/2])/2; }
  function modaA(a){
    var c={}, best=a[0], bc=0, i, k;
    for (i=0;i<a.length;i++){ k=String(a[i]); c[k]=(c[k]||0)+1; if (c[k]>bc){ bc=c[k]; best=a[i]; } }
    return best;
  }
  function rangoA(a){ var s=ordA(a); return s[s.length-1]-s[0]; }
  function desvA(a){ var m=mediaA(a), s=0, i; for(i=0;i<a.length;i++) s+=Math.abs(a[i]-m); return s/a.length; }
  function lista(a){ return a.join(', '); }
  function optsN(c, cands, fmt, step){
    var out = [fmt(c)], i, k = 1, v;
    for (i=0;i<cands.length && out.length<4;i++){
      v = cands[i];
      if (v === null || v === undefined || v < 0) continue;
      if (out.indexOf(fmt(v)) < 0) out.push(fmt(v));
    }
    while (out.length < 4 && k < 90){
      v = c + k*step; if (out.indexOf(fmt(v)) < 0) out.push(fmt(v));
      if (out.length < 4){ v = c - k*step; if (v >= 0 && out.indexOf(fmt(v)) < 0) out.push(fmt(v)); }
      k++;
    }
    return out;
  }
  function addProb(spec){
    var so  = shufA(T(spec.options));
    var cor = T(spec.correct);
    problems.push({
      title: T(spec.title),
      questionText: T(spec.q),
      fn: '',
      hint: T(spec.hint),
      explanation: T(spec.exp),
      options: so,
      correctIdx: so.indexOf(cor),
      showWork: !!spec.showWork,
      studentChoice: null,
      pendingChoice: null
    });
    buildOneCard(problems[problems.length-1], problems.length-1);
  }

  /* ============================================================
     DATOS CON SEMILLA
     ============================================================ */
  var vsel = [], vi, SP, i, z;
  for (vi=0; vi<10; vi++) vsel.push(Math.floor(rng()*2));

  var CTX5 = [
    { lead:{ es:'Diego anotó estos puntos en sus últimos 5 partidos de basquetbol',
             en:'Diego scored these points in his last 5 basketball games' },
      u:{ es:'puntos', en:'points' }, u1:{ es:'1 punto', en:'1 point' },
      reg:{ es:'partido', en:'game' } },
    { lead:{ es:'Sofía anotó los minutos que tardó en llegar a la escuela durante 5 días',

    { lead:{ es:'Una panadería anotó los panes que sobraron al cierre durante 5 días',

  var CX = CTX5[Math.floor(rng()*CTX5.length)];

  var CTX7 = [
    { lead:{ es:'En una biblioteca se anotó cuántos libros se prestaron cada día durante 7 días',
             en:'A library wrote down how many books were lent each day over 7 days' },
      u:{ es:'libros', en:'books' }, u1:{ es:'1 libro', en:'1 book' } },
    { lead:{ es:'Un puesto de jugos anotó cuántos vasos vendió cada día durante 7 días',
             en:'A juice stand wrote down how many cups it sold each day over 7 days' },
      u:{ es:'vasos', en:'cups' }, u1:{ es:'1 vaso', en:'1 cup' } }
  ];
  var CY = CTX7[Math.floor(rng()*CTX7.length)];
  function un7(){ return T(CY.u); }
  function fu7(v){ return (v === 1) ? T(CY.u1) : d2(v)+' '+un7(); }

  /* lista de 5 registros: la media es un entero exacto */
  var D5 = [
    [-3,-1,-1, 2, 3],
    [-2,-2,-1, 2, 3],
    [-3,-1,-1, 1, 4],
    [-3,-2,-2, 3, 4],
    [-2,-1,-1, 1, 3]
  ];
  var b1 = ri(9,15);
  var S1 = shufA(D5[Math.floor(rng()*D5.length)].map(function(x){ return b1 + x; }));
  var m1 = mediaA(S1), md1 = medianaA(S1), mo1 = modaA(S1), rg1 = rangoA(S1), dv1 = desvA(S1);

  /* lista de 7 registros */
  var D7 = [
    [-4,-2,-2,-1, 1, 3, 5],
    [-5,-2,-2,-1, 2, 3, 5],
    [-4,-3,-3, 1, 2, 3, 4],
    [-6,-2,-1, 1, 1, 3, 4]
  ];
  var b2 = ri(14,20);
  var S2 = shufA(D7[Math.floor(rng()*D7.length)].map(function(x){ return b2 + x; }));
  var m2 = mediaA(S2), md2 = medianaA(S2), mo2 = modaA(S2), rg2 = rangoA(S2);
  var S2sin = ordA(S2).slice(0,6);
  var md2sin = medianaA(S2sin);

  /* dos equipos con la misma media y distinta dispersión */
  var mT = ri(14,20);
  var sA = 1 + Math.floor(rng()*2);
  var sB = 3 + Math.floor(rng()*2);
  var TA = shufA([-2,-1,0,1,2].map(function(x){ return mT + sA*x; }));
  var TB = shufA([-2,-1,0,1,2].map(function(x){ return mT + sB*x; }));
  var rgA = rangoA(TA), rgB = rangoA(TB), dvA = desvA(TA), dvB = desvA(TB);

  /* datos del sexto registro y del ajuste por parejo */
  var extra6 = b1 + 6;                 /* la media de los 6 registros queda en b1+1 */
  var addK   = ri(2,4);

  /* distancias ya medidas (cierre) */
  var DD = [[4,1,0,3,2],[5,3,1,4,2],[2,0,1,1,1],[6,2,3,5,4]];
  var dist9 = shufA(DD[Math.floor(rng()*DD.length)]);
  var dm9 = mediaA(dist9);

  /* registros iguales (cierre de desviación media) */
  var igual = ri(11,18);

  /* rondas del manipulativo de la media */
  var mdR = [], tg, base, kk;
  for (i=0;i<3;i++){
    tg = ri(6,12);
    base = [tg-2, tg-1, tg, tg+1, tg+2];
    kk = Math.floor(rng()*5);
    base[kk] = base[kk] - (2 + Math.floor(rng()*2));
    mdR.push({ t:tg, v:shufA(base) });
  }

  /* rondas del manipulativo de la desviación media */
  var DW = [[-2,-1,-1,1,3],[-1,-1,0,1,1],[-3,-1,-1,2,3],[-4,-2,-1,3,4],[-5,-2,-1,3,5]];
  var dwPick = shufA([0,1,2,3,4]).slice(0,3), dwR = [];
  for (i=0;i<3;i++){
    var bw = ri(9,14);
    dwR.push(shufA(DW[dwPick[i]].map(function(x){ return bw + x; })));
  }

  /* objetivos del manipulativo de rango */
  var rgTargets = shufA([8,12,16,20]).slice(0,3);

  /* valores fijos del manipulativo del dato extremo */
  var extF = [b1-3, b1-1, b1, b1+1, b1+2, b1+4];

  /* ============================================================
     IDEA 1: la media como reparto en partes iguales
     ============================================================ */
  sec(T({es:'Idea 1', en:'Idea 1'}),
      T({es:'La media: repartir el total en partes iguales', en:'The mean: sharing the total out in equal parts'}),
      '<p>'+T({
        es:'La media aritmética responde a una pregunta muy concreta: si todo lo que se registró se repartiera en partes iguales, ¿cuánto le tocaría a cada registro? Por eso la media casi nunca coincide con alguno de los datos de la lista. Es el valor que tendrían todos si ninguno tuviera más ni menos que los demás.',
        en:'The arithmetic mean answers a very concrete question: if everything that was recorded were shared out in equal parts, how much would each record get? That is why the mean almost never matches one of the values in the list. It is the value they would all have if none had more or less than the others.'
      })+'</p>'+
      '<p>'+T({
        es:'Como se construye a partir del total, la media siente cualquier cambio en cualquier dato: si un registro sube, el total sube y la media sube con él. Esa sensibilidad la vuelve muy útil para resumir una lista completa, y al mismo tiempo la hace frágil cuando aparece un dato disparado del resto.',
        en:'Since it is built from the total, the mean feels any change in any value: if one record goes up, the total goes up and the mean goes up with it. That sensitivity makes it very useful for summarising a whole list, and at the same time it makes it fragile when one value shoots far away from the rest.'
      })+'</p>'+
      '<div class="defgrid">'+
        '<div class="defcell"><div class="defname">'+T({es:'Registro',en:'Record'})+'</div><div class="deftxt">'+T({es:'Cada valor anotado en la lista de datos.',en:'Each value written down in the data list.'})+'</div></div>'+
        '<div class="defcell"><div class="defname">'+T({es:'Total',en:'Total'})+'</div><div class="deftxt">'+T({es:'Lo que se junta al reunir todos los registros.',en:'What you get when all the records are gathered together.'})+'</div></div>'+
        '<div class="defcell"><div class="defname">'+T({es:'Media',en:'Mean'})+'</div><div class="deftxt">'+T({es:'Lo que le toca a cada registro en un reparto parejo.',en:'What each record gets in an even share out.'})+'</div></div>'+
        '<div class="defcell"><div class="defname">'+T({es:'Compensación',en:'Trade off'})+'</div><div class="deftxt">'+T({es:'Lo que un registro tiene de más, otro lo tiene de menos.',en:'What one record has too much of, another has too little of.'})+'</div></div>'+
      '</div>'+
      '<div class="callout"><p>'+T({
        es:'Conocer la media y saber cuántos registros hay equivale a conocer el total. Por eso, si se pierde un dato de la lista, todavía se puede recuperar.',
        en:'Knowing the mean and how many records there are is the same as knowing the total. That is why, if one value of the list gets lost, it can still be recovered.'
      })+'</p></div>');

  /* ---- MANIPULATIVO 1: llevar la media al objetivo ---- */
  (function(){
    var wrap = widget('media');
    var st = { r:0, v:mdR[0].v.slice(), done:false, lock:false, hit:false };
    var MX = 20;
    function draw(){
      var cv = document.getElementById('mdCv'); if (!cv) return;
      var G = fitCv(cv), ctx = G.ctx, W = G.w, H = G.h;
      var L = 34, Rm = 12, Tp = 14, B = 26;
      var pw = W-L-Rm, ph = H-Tp-B, n = st.v.length, bw = pw/n, q, y, bh;
      var col = cssv('--green'), gold = cssv('--gold'), bd = cssv('--border'), tx = cssv('--text3');
      ctx.font = '500 10px "IBM Plex Sans", sans-serif';
      ctx.textAlign = 'right'; ctx.fillStyle = tx; ctx.strokeStyle = bd; ctx.lineWidth = 1;
      for (q=0; q<=4; q++){
        y = Tp + ph - (q/4)*ph;
        ctx.beginPath(); ctx.moveTo(L,y); ctx.lineTo(W-Rm,y); ctx.stroke();
        ctx.fillText(String(q*MX/4), L-5, y+3);
      }
      for (q=0; q<n; q++){
        bh = Math.max(0, Math.min(st.v[q], MX)/MX)*ph;
        ctx.fillStyle = col; ctx.globalAlpha = .78;
        ctx.fillRect(L+q*bw+7, Tp+ph-bh, bw-14, bh);
        ctx.globalAlpha = 1;
        ctx.textAlign = 'center'; ctx.fillStyle = tx;
        ctx.fillText(String(st.v[q]), L+(q+.5)*bw, Tp+ph+15);
      }
      if (!st.done){
        y = Tp + ph - (mdR[st.r].t/MX)*ph;
        ctx.strokeStyle = gold; ctx.lineWidth = 2; ctx.setLineDash([6,4]);
        ctx.beginPath(); ctx.moveTo(L,y); ctx.lineTo(W-Rm,y); ctx.stroke();
        ctx.setLineDash([]);
        ctx.textAlign = 'left'; ctx.fillStyle = gold;
        ctx.fillText(T({es:'objetivo',en:'target'}), L+3, y-4);
      }
      y = Tp + ph - (mediaA(st.v)/MX)*ph;
      ctx.strokeStyle = col; ctx.lineWidth = 2.2;
      ctx.beginPath(); ctx.moveTo(L,y); ctx.lineTo(W-Rm,y); ctx.stroke();
      ctx.textAlign = 'right'; ctx.fillStyle = col;
      ctx.fillText(T({es:'media',en:'mean'}), W-Rm-3, y-4);
      ctx.strokeStyle = tx; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(L,Tp+ph); ctx.lineTo(W-Rm,Tp+ph); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(L,Tp); ctx.lineTo(L,Tp+ph); ctx.stroke();
    }
    function upd(){
      var mv = document.getElementById('mdMedia'), fb = document.getElementById('mdFb');
      if (mv) mv.textContent = d2(mediaA(st.v));
      var dif = mediaA(st.v) - mdR[st.r].t;
      if (fb){
        if (Math.abs(dif) < 0.0001){
          fb.innerHTML = '<span class="okmsg">'+T({
            es:'¡La media cayó justo en el objetivo! Fíjate en que subiste unos registros y bajaste otros: lo que se quita de un lado aparece del otro.',
            en:'The mean landed right on the target! Notice that you raised some records and lowered others: what is taken from one side shows up on the other.'
          })+'</span>';
        } else if (dif < 0){
          fb.textContent = T({ es:'La media va '+d2(-dif)+' por debajo del objetivo. Sube algún registro y observa cómo se levanta la línea verde.',
                               en:'The mean is '+d2(-dif)+' below the target. Raise some record and watch the green line climb.' });
        } else {
          fb.textContent = T({ es:'La media va '+d2(dif)+' por encima del objetivo. Baja algún registro y observa cómo cede la línea verde.',
                               en:'The mean is '+d2(dif)+' above the target. Lower some record and watch the green line drop.' });
        }
      }
      draw();
    }
    function render(){
      if (st.done){
        wrap.innerHTML =
          '<div class="iw-tag">'+T({es:'Lleva la media al objetivo', en:'Bring the mean to the target'})+'</div>'+
          '<div class="iw-box"><div class="rfb"><span class="okmsg">'+T({
            es:'Ya lo tienes: la media no depende de un registro suelto, depende del total. Puedes mover los registros como quieras y, mientras el total no cambie, la media se queda donde está.',
            en:'You have it: the mean does not depend on a single record, it depends on the total. You can move the records around as you like and, as long as the total does not change, the mean stays where it is.'
          })+'</span></div></div>';
        return;
      }
      var cells = '', q;
      for (q=0; q<st.v.length; q++){
        cells += '<div class="mdcell"><button class="mdbtn" onclick="mdAdj('+q+',1)">▲</button>'+
                 '<button class="mdbtn" onclick="mdAdj('+q+',-1)">▼</button></div>';
      }
      wrap.innerHTML =
        '<div class="iw-tag">'+T({es:'Lleva la media al objetivo', en:'Bring the mean to the target'})+'</div>'+
        '<div class="iw-box">'+
          '<div class="rondas">'+T({es:'Ronda',en:'Round'})+' '+(st.r+1)+' / 3</div>'+
          '<div class="iw-instr iw-sub">'+T({
            es:'Toca las flechas para subir o bajar cada registro. La línea verde es la media de los cinco y la línea dorada punteada es el objetivo. Ajusta hasta que las dos coincidan.',
            en:'Tap the arrows to raise or lower each record. The green line is the mean of the five and the dashed golden line is the target. Adjust until the two lines meet.'
          })+'</div>'+
          '<div class="goalbar">'+T({es:'Objetivo: que la media quede exactamente en ', en:'Goal: get the mean to land exactly on '})+'<b>'+mdR[st.r].t+'</b></div>'+
          '<canvas class="gcanvas" id="mdCv"></canvas>'+
          '<div class="mdgrid">'+cells+'</div>'+
          '<div class="statrow">'+
            '<div class="statcell"><div class="statlbl">'+T({es:'Media actual',en:'Current mean'})+'</div><div class="statval" id="mdMedia">'+d2(mediaA(st.v))+'</div></div>'+
            '<div class="statcell"><div class="statlbl">'+T({es:'Objetivo',en:'Target'})+'</div><div class="statval alt">'+mdR[st.r].t+'</div></div>'+
          '</div>'+
          '<div class="rfb" id="mdFb"></div>';
      upd();
    }
    window.mdAdj = function(k, s){
      if (st.done || st.lock) return;
      var nv = st.v[k] + s;
      if (nv < 1 || nv > 20) return;
      st.v[k] = nv;
      upd();
      if (Math.abs(mediaA(st.v) - mdR[st.r].t) < 0.0001){
        st.lock = true;
        setTimeout(function(){
          st.r++;
          if (st.r >= 3){ st.done = true; st.lock = false; render(); return; }
          st.v = mdR[st.r].v.slice(); st.lock = false; render();
        }, 1800);
      }
    };
    render();
    REDRAW.push(draw);
  })();

  /* ---- P1 ---- */
  (function(){
    if (vsel[0] === 0){
      SP = {
        title:{es:'El reparto parejo', en:'The even share out'},
        q:{ es: T(CX.lead)+': '+lista(S1)+'. ¿Cuál es la media de esos registros?',
            en: T(CX.lead)+': '+lista(S1)+'. What is the mean of those records?' },
        options: optsN(m1, [md1, mo1, m1+2], fu, 1),

            es:'Eso es la desviación media: el ancho que tendría cada distancia si todas midieran lo mismo. Una banda angosta significa registros apretados alrededor del centro; una banda ancha, registros regados.',
            en:'That is the mean deviation: the width each distance would have if they all measured the same. A narrow band means records packed around the centre; a wide band, records scattered about.'
          })+'</span></div></div>';
        return;
      }
      wrap.innerHTML =
        '<div class="iw-tag">'+T({es:'La banda de las distancias', en:'The band of distances'})+'</div>'+
        '<div class="iw-box">'+
          '<div class="rondas">'+T({es:'Ronda',en:'Round'})+' '+(st.r+1)+' / 3</div>'+
          '<div class="iw-instr iw-sub">'+T({
            es:'Cada punto muestra su distancia a la media. Mueve la barra para abrir o cerrar la banda dorada alrededor del centro y déjala en el ancho que le tocaría a cada distancia en un reparto parejo.',
            en:'Each dot shows its distance to the mean. Move the slider to open or close the golden band around the centre and leave it at the width each distance would get in an even share out.'
          })+'</div>'+
          '<div class="goalbar">'+T({
            es:'Reto: ajusta el ancho de la banda hasta que valga la desviación media de estos cinco registros.',
            en:'Challenge: adjust the width of the band until it is worth the mean deviation of these five records.'
          })+'</div>'+
          '<canvas class="gcanvas" id="bnCv"></canvas>'+
          '<div class="krow">'+
            '<input type="range" min="0" max="50" step="1" value="'+st.k+'" oninput="bnSlide(this.value)">'+
            '<div class="kval">'+T({es:'ancho: ',en:'width: '})+'<span id="bnVal">'+d2(st.k/10)+'</span></div>'+
          '</div>'+
          '<button class="rverify-btn" onclick="bnCheck()">'+T({es:'Comprobar el ancho', en:'Check the width'})+'</button>'+
          '<div class="rfb" id="bnFb"></div>';
      upd();
    }
    function avanza(ms){
      st.lock = true;
      setTimeout(function(){
        st.lock = false; st.r++; st.tries = 0; st.k = 5;
        if (st.r >= 3){ st.done = true; }
        render();
      }, ms);
    }
    window.bnSlide = function(v){
      if (st.done || st.lock) return;
      st.k = parseInt(v,10) || 0;
      upd();
    };
    window.bnCheck = function(){
      if (st.done || st.lock) return;
      var dd = datos(), dm = desvA(dd), meta = Math.round(dm*10);
      var fb = document.getElementById('bnFb'); if (!fb) return;
      if (st.k === meta){
        fb.innerHTML = '<span class="okmsg">'+T({
          es:'¡Ese es el ancho! Las cinco distancias juntas suman '+d2(dm*5)+', y repartidas en partes iguales le tocan '+d2(dm)+' a cada una.',
          en:'That is the width! The five distances together add up to '+d2(dm*5)+', and shared out in equal parts each one gets '+d2(dm)+'.'
        })+'</span>';
        avanza(2400); return;
      }
      st.tries++;
      if (st.tries >= 3){
        st.k = meta; upd();
        fb.innerHTML = T({
          es:'Este es el ancho correcto: '+d2(dm)+'. Suma las cinco distancias que ves sobre los puntos y repártelas entre los cinco registros.',
          en:'This is the correct width: '+d2(dm)+'. Add the five distances you can see above the dots and share them among the five records.'
        });
        avanza(3000); return;
      }
      fb.textContent = (st.k > meta)
        ? T({ es:'Tu banda es más ancha que el reparto parejo de las distancias. Ciérrala un poco y vuelve a comprobar.',
              en:'Your band is wider than the even share out of the distances. Close it a little and check again.' })
        : T({ es:'Tu banda es más angosta que el reparto parejo de las distancias. Ábrela un poco y vuelve a comprobar.',
              en:'Your band is narrower than the even share out of the distances. Open it a little and check again.' });
    };
    render();
    REDRAW.push(draw);
  })();

  /* ---- P8 ---- */
  (function(){
    if (vsel[7] === 0){
      SP = {
        title:{es:'El reparto de las distancias', en:'Sharing out the distances'},
        q:{ es: T(CX.lead)+': '+lista(S1)+'. La media de esa lista es '+m1+'. ¿Cuál es la desviación media de esos registros?',
            en: T(CX.lead)+': '+lista(S1)+'. The mean of that list is '+m1+'. What is the mean deviation of those records?' },
        options: optsN(dv1, [dv1+1, rg1, dv1+2], fu, 0.4),
        correct: fu(dv1),
        hint:{ es:'Mide cuánto se aleja del centro cada uno de los cinco registros, tomando todas esas distancias como cantidades positivas, y después repártelas en partes iguales.',
               en:'Measure how far each of the five records moves from the centre, taking all those distances as positive amounts, and then share them out in equal parts.' },
        exp:{ es:'Las distancias de los registros a la media son '+lista(S1.map(function(v){ return Math.abs(v-m1); }))+', que juntas dan '+d2(dv1*5)+'. Repartidas entre los cinco registros toca '+fu(dv1)+' a cada uno.',
              en:'The distances from the records to the mean are '+lista(S1.map(function(v){ return Math.abs(v-m1); }))+', which together give '+d2(dv1*5)+'. Shared among the five records, each one gets '+fu(dv1)+'.' },
        showWork:true
      };
    } else {
      var fr = function(v){ return (v === 1) ? T({es:'1 refresco',en:'1 drink'}) : d2(v)+' '+T({es:'refrescos',en:'drinks'}); };
      SP = {
        title:{es:'Cinco registros idénticos', en:'Five identical records'},
        q:{ es:'Durante 5 días seguidos, una tienda vendió exactamente la misma cantidad de refrescos: '+igual+' refrescos cada día. ¿Cuál es la desviación media de esos cinco registros?',
            en:'For 5 days in a row, a shop sold exactly the same amount of drinks: '+igual+' drinks each day. What is the mean deviation of those five records?' },
        options: optsN(0, [igual, 5, 1], fr, 2),
        correct: fr(0),
        hint:{ es:'Averigua primero dónde queda el centro de una lista en la que todos los registros valen lo mismo y después mide cuánto se aleja cada uno de ese centro.',
               en:'First work out where the centre of a list falls when every record is worth the same and then measure how far each one moves from that centre.' },
        exp:{ es:'La media de la lista es '+igual+', el mismo valor de cada registro, así que ningún dato se aleja del centro: todas las distancias valen cero y su reparto también.',
              en:'The mean of the list is '+igual+', the same value as every record, so no value moves away from the centre: all the distances are worth zero and so is their share out.' },
        showWork:true
      };
    }
    addProb(SP);
  })();

  /* ---- P9 ---- */
  (function(){
    var fp = function(v){ return d2(v)+' '+T({es:'puntos',en:'points'}); };
    if (vsel[8] === 0){
      SP = {
        title:{es:'El grupo más parejo', en:'The most even group'},
        q:{ es:'Dos grupos de cinco registros terminaron con la misma media de puntos. El grupo A anotó: '+lista(TA)+'. El grupo B anotó: '+lista(TB)+'. ¿Cuál es la desviación media del grupo cuyos registros están más parejos entre sí?',
            en:'Two groups of five records ended with the same mean of points. Group A scored: '+lista(TA)+'. Group B scored: '+lista(TB)+'. What is the mean deviation of the group whose records are the most even among themselves?' },
        options: optsN(dvA, [dvB, rgA, dvA+1], fp, 0.4),
        correct: fp(dvA),
        hint:{ es:'Compara primero qué tan estirada está cada lista para decidir cuál es la más pareja, y después trabaja solo con esa: mide la distancia de cada registro al centro y repártelas.',
               en:'First compare how stretched each list is to decide which is the most even, and then work only with that one: measure the distance of each record to the centre and share them out.' },
        exp:{ es:'Los registros del grupo A son los que quedan más juntos. Sus distancias a la media suman '+d2(dvA*5)+', y repartidas entre los cinco registros dan '+fp(dvA)+'.',
              en:'The records of group A are the ones that stay closest together. Their distances to the mean add up to '+d2(dvA*5)+', and shared among the five records they give '+fp(dvA)+'.' },
        showWork:true
      };
    } else {
      SP = {
        title:{es:'De las distancias al promedio', en:'From the distances to the average'},
        q:{ es:'De una lista de cinco registros ya se midió qué tan lejos quedó cada uno de la media. Las cinco distancias fueron: '+lista(dist9)+' puntos. ¿Cuál es la desviación media de esa lista?',
            en:'For a list of five records it has already been measured how far each one ended up from the mean. The five distances were: '+lista(dist9)+' points. What is the mean deviation of that list?' },
        options: optsN(dm9, [sumA(dist9), dm9+1, ordA(dist9)[4]], fp, 1),
        correct: fp(dm9),
        hint:{ es:'Las distancias ya están medidas, así que solo falta el reparto parejo: júntalas en un total y divídelo entre la cantidad de registros de la lista.',
               en:'The distances are already measured, so only the even share out is missing: gather them into a total and divide it among the number of records in the list.' },
        exp:{ es:'Las cinco distancias juntas dan '+sumA(dist9)+', y al repartirlas en partes iguales entre los cinco registros a cada uno le corresponden '+fp(dm9)+'.',
              en:'The five distances together give '+sumA(dist9)+', and sharing them out in equal parts among the five records gives '+fp(dm9)+' to each one.' },
        showWork:true
      };
    }
    addProb(SP);
  })();

  /* ---- P10 ---- */
  (function(){
    if (vsel[9] === 0){
      var oA = T({
        es:['Una medida de dispersión, como el rango o la desviación media',
            'La moda de cada grupo, para saber qué registro se repite más',
            'La media de cada grupo otra vez, usando solo los registros altos',
            'La cantidad de registros que se anotaron en cada uno de los grupos'],
        en:['A measure of spread, such as the range or the mean deviation',
            'The mode of each group, to know which record repeats most',
            'The mean of each group again, using only the high records',
            'The amount of records written down in each of the groups']
      });
      SP = {
        title:{es:'Qué falta por calcular', en:'What is left to work out'},
        q:{ es:'De dos grupos solo se conoce la media y las dos medias resultaron iguales. Antes de afirmar que los grupos se comportaron de la misma manera, ¿qué conviene calcular?',
            en:'Only the mean is known for two groups and the two means turned out to be equal. Before stating that the groups behaved in the same way, what is worth working out?' },
        options: oA,
        correct: T({ es:'Una medida de dispersión, como el rango o la desviación media',
                     en:'A measure of spread, such as the range or the mean deviation' }),
        hint:{ es:'Piensa en qué parte de la historia de una lista queda sin contar cuando solo se conoce el valor alrededor del cual giran los datos.',
               en:'Think about which part of the story of a list stays untold when only the value the data revolve around is known.' },
        exp:{ es:'Dos grupos con la misma media pueden ser muy distintos: en uno los registros pueden estar apretados y en el otro regados. Solo una medida de dispersión distingue esos dos casos.',
              en:'Two groups with the same mean can be very different: in one the records may be packed together and in the other scattered about. Only a measure of spread tells those two cases apart.' },
        showWork:false
      };
    } else {
      var oB = T({
        es:['Sus registros se alejan más del centro que los de la otra lista',
            'Su centro quedó más arriba que el centro de la otra lista',
            'Tiene más registros anotados que la otra lista',
            'Su registro más repetido es mayor que el de la otra lista'],
        en:['Its records move further from the centre than those of the other list',
            'Its centre ended up higher than the centre of the other list',
            'It has more records written down than the other list',
            'Its most repeated record is larger than that of the other list']
      });
      SP = {
        title:{es:'Leer una desviación grande', en:'Reading a large deviation'},
        q:{ es:'Dos listas tienen la misma media y la misma mediana, pero la desviación media de la primera es mucho mayor que la de la segunda. ¿Qué se puede afirmar de la primera lista?',
            en:'Two lists have the same mean and the same median, but the mean deviation of the first is much larger than that of the second. What can be stated about the first list?' },
        options: oB,
        correct: T({ es:'Sus registros se alejan más del centro que los de la otra lista',
                     en:'Its records move further from the centre than those of the other list' }),
        hint:{ es:'Recuerda qué distancia es exactamente la que se reparte al obtener una desviación media y qué significa entonces que ese reparto salga grande.',
               en:'Recall which distance is exactly the one being shared out when a mean deviation is obtained and what it then means for that share out to come out large.' },
        exp:{ es:'La desviación media reparte las distancias de cada registro al centro. Si ese reparto es mayor, los registros de esa lista están, en promedio, más lejos del centro, aunque el centro sea el mismo en las dos.',
              en:'The mean deviation shares out the distances from each record to the centre. If that share out is larger, the records of that list are, on average, further from the centre, even though the centre is the same in both.' },
        showWork:false
      };
    }
    addProb(SP);
  })();

  /* los canvas se dibujan de nuevo cuando la pantalla ya es visible */
  setTimeout(function(){
    for (var q=0; q<REDRAW.length; q++){ try { REDRAW[q](); } catch(e){} }
  }, 220);
}
</script>

<!-- LIAXA ANALYTICS -->
<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbykkuJ_apGq3vALIFd4mr3acu81c7K4OKxW-DZ-i52Ceyl3lOanXMdvbS9SIXPrLQBm/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'Medidas de Tendencia Central y Dispersión';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
