      exp:{ es:'La energía que entra por el pasto es limitada, así que sostiene una cantidad limitada de conejos. Al pasarse de ese número la competencia por el mismo alimento se vuelve más dura y la población deja de crecer.',
            en:'The energy coming in through the grass is limited, so it sustains a limited number of rabbits. Past that number the competition for the same food becomes harder and the population stops growing.' }
    },
    {
      title:{ es:'Dos aves iguales', en:'Two alike birds' },
      q:{ es:'Dos aves del mismo bosque comen exactamente las mismas semillas y anidan en el mismo tipo de árbol, que escasea. ¿Qué se espera entre las dos poblaciones?',
          en:'Two birds of the same forest eat exactly the same seeds and nest in the same kind of tree, which is scarce. What is expected between the two populations?' },
      opts:{ es:['Competencia, porque necesitan los mismos recursos limitados',
                 'Depredación, porque una terminará cazando a la otra',
                 'Descomposición, porque las dos aprovechan los mismos restos',
                 'Ninguna relación, porque las dos son aves del mismo nivel'],
             en:['Competition, because they need the same limited resources',
                 'Predation, because one will end up hunting the other',
                 'Decomposition, because both use the same remains',
                 'No relationship at all, because both are birds of the same level'] },
      ci:0,
      hint:{ es:'La relación aparece cuando dos poblaciones necesitan lo mismo y no alcanza para las dos.',
             en:'The relationship shows up when two populations need the same thing and there is not enough for both.' },
      exp:{ es:'Comparten alimento y sitio de anidación, y los dos recursos son limitados: lo que ocupa una deja de estar disponible para la otra. Eso es competencia, y suele terminar con una de las dos usando el recurso en menor medida.',
            en:'They share food and nesting site, and both resources are limited: what one takes is no longer available to the other. That is competition, and it usually ends with one of the two using the resource less.' }
    }
  ];
  return pk(rng, vs);
}

function mkP10(rng){
  var vs = [
    {
      title:{ es:'Qué conviene dibujar', en:'What is worth drawing' },
      q:{ es:'Un equipo quiere mostrar en una sola imagen todas las conexiones de quién come a quién en el pastizal que estudió, incluidas las poblaciones que comen de varias fuentes. ¿Qué representación le conviene?',
          en:'A team wants to show in a single image every connection of who eats whom in the grassland they studied, including the populations that eat from several sources. Which representation suits them?' },
      opts:{ es:['Una red trófica', 'Una cadena trófica de cuatro eslabones', 'Una pirámide de energía', 'Una lista de las especies del pastizal'],
             en:['A food web', 'A food chain with four links', 'An energy pyramid', 'A list of the grassland species'] },
      ci:0,
      hint:{ es:'Pregúntate cuál de las representaciones admite que de una misma población salgan varias flechas.',
             en:'Ask which representation allows several arrows to leave the same population.' },
      exp:{ es:'La red trófica junta todas las cadenas del mismo lugar, así que una población puede tener varias flechas de entrada y de salida. La cadena muestra un solo camino y la pirámide reparte la energía por niveles, sin decir quién come a quién.',
            en:'The food web gathers all the chains of the same place, so one population can have several arrows in and out. The chain shows a single path and the pyramid spreads the energy across levels, without saying who eats whom.' }
    },
    {
      title:{ es:'La imagen del reparto', en:'The picture of the share-out' },
      q:{ es:'Un equipo quiere mostrar cuánta energía queda disponible en cada nivel del pastizal y cómo esa cantidad se reduce al subir. ¿Qué representación le conviene?',
          en:'A team wants to show how much energy is available on each level of the grassland and how that amount shrinks going up. Which representation suits them?' },
      opts:{ es:['Una pirámide de energía', 'Una red trófica con todas las flechas', 'Una cadena trófica de cuatro eslabones', 'Un mapa del terreno con sus plantas'],
             en:['An energy pyramid', 'A food web with all the arrows', 'A food chain with four links', 'A map of the ground with its plants'] },
      ci:0,
      hint:{ es:'Piensa cuál de las representaciones usa el tamaño de cada nivel para decir algo.',
             en:'Think about which representation uses the size of each level to say something.' },
      exp:{ es:'La pirámide dibuja cada nivel con un tamaño proporcional a la energía que le llega, y por eso se ve cómo se reduce al subir. La red dice quién come a quién, pero no cuánta energía queda en cada nivel.',
            en:'The pyramid draws each level with a size proportional to the energy reaching it, which is why the shrinking going up can be seen. The web says who eats whom, but not how much energy is left on each level.' }
    }
  ];
  return pk(rng, vs);
}

/* ══════════════════════════════════════════════════════════════════════════
   buildLesson
   ══════════════════════════════════════════════════════════════════════════ */
function buildLesson(rng){
  injectGuideCSS();

  /* ── Apertura ── */
  sec(
    L({ es:'Punto de partida', en:'Starting point' }),
    L({ es:'Todo lo que comes viene de una flecha', en:'Everything you eat comes from an arrow' }),
    '<p>' + L({
      es:'El desayuno de hoy tiene una historia larga. El maíz de la tortilla armó su propio alimento con la luz del Sol; si hubo huevo, una gallina comió granos; si hubo queso, una vaca comió pasto. Toda la comida del mundo empieza en algo verde y va pasando de un ser vivo a otro. Ese recorrido se puede dibujar, y cuando se dibuja aparecen dos cosas: quién depende de quién, y cuánta energía queda en cada paso.',
      en:'Today breakfast has a long story behind it. The corn in the tortilla put its own food together with sunlight; if there was egg, a hen ate grain; if there was cheese, a cow ate grass. All the food in the world starts in something green and keeps passing from one living thing to another. That route can be drawn, and when it is drawn two things show up: who depends on whom, and how much energy is left at each step.'
    }) + '</p>' +
    '<div class="callout"><p><strong>' + L({ es:'Lo que vas a hacer: ', en:'What you are going to do: ' }) + '</strong>' + L({
      es:'vas a armar cadenas con seres vivos revueltos, a sacar una población de una red para ver a quiénes deja sin comer, a construir la pirámide de energía de un pastizal nivel por nivel y a predecir qué le pasa a cada población cuando un eslabón se pierde o aumenta.',
      en:'you are going to build chains out of shuffled living things, take one population out of a web to see who is left without food, build the energy pyramid of a grassland level by level and predict what happens to each population when a link is lost or increases.'
    }) + '</p></div>'
  );

  /* ══ CONCEPTO 1 ══ */
  var s1 = sec(
    L({ es:'Concepto 1', en:'Concept 1' }),
    L({ es:'La fila del alimento y el sentido de la flecha', en:'The food queue and the direction of the arrow' }),
    '<p>' + L({
      es:'Todo lo que come un ser vivo estuvo antes en otro ser vivo, y si sigues hacia atrás siempre llegas a alguien que no come a nadie: las plantas, las algas y otros organismos que arman su alimento con la luz del Sol. A esos se les llama productores. Quien se alimenta directamente de ellos es un consumidor primario; quien se come a ese consumidor es un consumidor secundario, y así sigue la fila. Al final, los hongos y las bacterias trabajan sobre las hojas caídas y los animales muertos y devuelven esa materia al suelo: son los descomponedores, y por ellos la materia da vueltas mientras la energía se gasta.',
      en:'Everything a living thing eats was inside another living thing before, and if you keep going backwards you always reach somebody who eats nobody: plants, algae and other organisms that put their food together with sunlight. Those are called producers. Whoever feeds directly on them is a primary consumer; whoever eats that consumer is a secondary consumer, and the queue goes on. At the end, fungi and bacteria work on fallen leaves and dead animals and return that matter to the soil: they are the decomposers, and thanks to them matter goes around while energy is spent.'
    }) + '</p>' +
    '<p>' + L({
      es:'Cuando esa fila se dibuja se usa una flecha, y la flecha tiene una regla que conviene no olvidar: sale del que es comido y apunta a quien se lo come, porque ese es el camino que siguen la materia y la energía. Escribir conejo &#8594; pasto sería afirmar que el pasto se alimenta de conejos. Una cadena trófica es exactamente eso: un camino de flechas que empieza en un productor.',
      en:'When that queue is drawn an arrow is used, and the arrow follows a rule worth remembering: it leaves the one that is eaten and points at the one that eats it, because that is the path matter and energy follow. Writing rabbit &#8594; grass would claim that grass feeds on rabbits. A food chain is exactly that: a path of arrows starting at a producer.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Productor', en:'Producer' }), L({ es:'arranca la cadena', en:'starts the chain' }), L({ es:'arma su alimento con luz del Sol', en:'makes its food with sunlight' })) +
      rcard(L({ es:'Consumidor primario', en:'Primary consumer' }), L({ es:'come al productor', en:'eats the producer' }), L({ es:'segundo lugar de la fila', en:'second place in the queue' })) +
      rcard(L({ es:'Consumidor secundario', en:'Secondary consumer' }), L({ es:'come al primario', en:'eats the primary one' }), L({ es:'tercer lugar de la fila', en:'third place in the queue' })) +
      rcard(L({ es:'Descomponedor', en:'Decomposer' }), L({ es:'trabaja sobre los restos', en:'works on the remains' }), L({ es:'devuelve la materia al suelo', en:'returns matter to the soil' })) +
    '</div>'
  );
  wChain(rng, widgetHost(s1, 'w_cadena', 'chain'));
  addProblem(rng, mkP1(rng));
  addProblem(rng, mkP2(rng));

  /* ══ CONCEPTO 2 ══ */
  var s2 = sec(
    L({ es:'Concepto 2', en:'Concept 2' }),
    L({ es:'Muchas cadenas juntas hacen una red', en:'Many chains together make a web' }),
    '<p>' + L({
      es:'En un lugar real casi nadie come una sola cosa ni es presa de un solo cazador. El ratón de campo come pasto y también moras; el halcón caza ratones y también pájaros. Cuando dibujas al mismo tiempo todas las cadenas de un lugar, las flechas se cruzan y aparece una red trófica: el mismo ecosistema, pero con todas sus conexiones a la vista. En la red se nota algo que la cadena escondía: de una sola población pueden salir y entrar varias flechas.',
      en:'In a real place hardly anyone eats a single thing or is prey to a single hunter. The field mouse eats grass and also berries; the hawk hunts mice and also birds. When you draw all the chains of a place at once, the arrows cross and a food web appears: the same ecosystem, but with all its connections on show. In the web something the chain was hiding becomes visible: several arrows can leave and enter a single population.'
    }) + '</p>' +
    '<p>' + L({
      es:'Dentro de la red hay dos relaciones que la sostienen. Hay competencia cuando dos poblaciones necesitan el mismo recurso limitado, como el conejo y el saltamontes con el mismo pasto: lo que come una deja de estar disponible para la otra, aunque nunca se toquen. Y hay interdependencia cuando lo que le pasa a una población se nota en otras, incluso en las que no come: si el halcón mantiene bajos a los ratones, el pasto pierde menos semillas. Por eso quitar una sola especie casi nunca afecta a una sola: el efecto se reparte por las flechas y regula el funcionamiento del ecosistema.',
      en:'Two relationships hold the web together. There is competition when two populations need the same limited resource, like the rabbit and the grasshopper with the same grass: what one eats is no longer available to the other, even though they never touch. And there is interdependence when what happens to one population shows up in others, even the ones it does not eat: if the hawk keeps mice low, the grass loses fewer seeds. That is why taking out a single species hardly ever affects only one: the effect spreads along the arrows and regulates how the ecosystem works.'
    }) + '</p>'
  );
  wWeb(rng, widgetHost(s2, 'w_red', 'web'));
  addProblem(rng, mkP3(rng));
  addProblem(rng, mkP4(rng));

  /* ══ CONCEPTO 3 ══ */
  var s3 = sec(
    L({ es:'Concepto 3', en:'Concept 3' }),
    L({ es:'La energía se reparte en forma de pirámide', en:'Energy is shared out in the shape of a pyramid' }),
    '<p>' + L({
      es:'La materia da vueltas por el ecosistema, pero la energía va en un solo sentido y se acaba. Cada población gasta casi toda la energía que consigue en moverse, respirar y mantener el cuerpo, y esa parte sale del ecosistema como calor. Solo lo que queda guardado en el cuerpo puede pasar al siguiente nivel, y eso ronda la décima parte, es decir cerca del 10 por ciento. Del resto ya nadie se alimenta.',
      en:'Matter goes around the ecosystem, but energy travels one way only and runs out. Each population spends almost all the energy it gets on moving, breathing and keeping its body going, and that part leaves the ecosystem as heat. Only what stays stored in the body can pass to the next level, and that is around a tenth, that is, close to 10 per cent. Nobody feeds on the rest.'
    }) + '</p>' +
    '<p>' + L({
      es:'Si apilas los niveles y dibujas cada uno con un tamaño proporcional a la energía que recibe, el dibujo queda ancho abajo y angosto arriba: esa es la pirámide trófica. La forma explica cosas que se ven en el campo. En un pastizal hay muchísimo pasto, bastantes conejos y unos pocos zorros, y no al revés. También explica por qué las cadenas son cortas: después de cuatro o cinco niveles ya casi no queda energía que repartir.',
      en:'If you stack the levels and draw each one with a size proportional to the energy it receives, the drawing comes out wide at the bottom and narrow at the top: that is the trophic pyramid. The shape explains things you can see in the field. In a grassland there is a great deal of grass, a fair number of rabbits and only a few foxes, and not the other way round. It also explains why chains are short: after four or five levels there is hardly any energy left to share out.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Nivel 1', en:'Level 1' }), L({ es:'productores', en:'producers' }), L({ es:'entra toda la energía del Sol aprovechada', en:'all the captured solar energy comes in here' })) +
      rcard(L({ es:'De un nivel al siguiente', en:'From one level to the next' }), L({ es:'pasa cerca del 10%', en:'about 10% passes on' }), L({ es:'el resto se pierde como calor', en:'the rest is lost as heat' })) +
      rcard(L({ es:'Forma', en:'Shape' }), L({ es:'ancha abajo', en:'wide at the bottom' }), L({ es:'cada nivel recibe menos que el de abajo', en:'each level receives less than the one below' })) +
      rcard(L({ es:'Largo de la cadena', en:'Length of the chain' }), L({ es:'cuatro o cinco niveles', en:'four or five levels' }), L({ es:'arriba ya no queda energía suficiente', en:'up top there is no longer enough energy' })) +
    '</div>'
  );
  wPyramid(rng, widgetHost(s3, 'w_piramide', 'pyramid'));
  addProblem(rng, mkP5(rng));
  addProblem(rng, mkP6(rng));

  /* ══ CONCEPTO 4 ══ */
  var s4 = sec(
    L({ es:'Concepto 4', en:'Concept 4' }),
    L({ es:'Lo que pasa cuando falta o sobra un eslabón', en:'What happens when a link is missing or extra' }),
    '<p>' + L({
      es:'Con la red y la pirámide a la vista se puede hacer algo más que describir: se puede anticipar. Si se pierde un eslabón, lo primero que cambia es la población que estaba justo al lado, y después el cambio se corre a la siguiente flecha. Al quitar un depredador, su presa crece; al haber más presas, el alimento de esas presas escasea. Al quitar un productor, todos los que comían de él quedan con menos opciones al mismo tiempo.',
      en:'With the web and the pyramid in view you can do more than describe: you can anticipate. If a link is lost, the first thing that changes is the population right next to it, and then the change travels along the next arrow. Take a predator away and its prey grows; with more prey, the food of that prey becomes scarce. Take a producer away and everyone that ate from it is left with fewer options at the same time.'
    }) + '</p>' +
    '<p>' + L({
      es:'Lo mismo vale cuando un eslabón aumenta, por ejemplo cuando se sueltan muchos ejemplares de una especie o cuando desaparece la que la controlaba. Estas predicciones no son adivinanzas: se leen siguiendo las flechas del dibujo, un paso a la vez, y por eso conviene tener la red bien hecha antes de opinar sobre lo que va a pasar en un ecosistema.',
      en:'The same holds when a link increases, for instance when many specimens of a species are released or when the one that kept it in check disappears. These predictions are not guesses: they are read by following the arrows of the drawing, one step at a time, and that is why it pays to have the web properly made before giving an opinion about what will happen in an ecosystem.'
    }) + '</p>'
  );
  wPredict(rng, widgetHost(s4, 'w_prediccion', 'predict'));
  addProblem(rng, mkP7(rng));

  /* ══ CIERRE ══ */
  sec(
    L({ es:'Para cerrar', en:'To finish' }),
    L({ es:'Lee el ecosistema con lo que ya tienes', en:'Read the ecosystem with what you already have' }),
    '<p>' + L({
      es:'Las siguientes situaciones vienen de pastizales, lagunas y bosques distintos. En cada una hay que decidir con qué herramienta se lee mejor: el sentido de las flechas, el reparto de la energía o el efecto que se corre por la red.',
      en:'The situations below come from different grasslands, lagoons and forests. In each one you have to decide which tool reads it best: the direction of the arrows, the share-out of energy or the effect that travels along the web.'
    }) + '</p>'
  );
  addProblem(rng, mkP8(rng));
  addProblem(rng, mkP9(rng));
  addProblem(rng, mkP10(rng));
}
</script>
