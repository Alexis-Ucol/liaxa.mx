<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Principio de Arquímedes: Flotación y Propiedades de Fluidos</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
  --wtr:        #5b9bd5;
  --wtr2:       #2f6fa8;
  --obj:        #c89b5a;
  --obj2:       #8b5a2b;
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
  --wtr:        #2c5c88;
  --wtr2:       #7ab0dd;
  --obj:        #a87c44;
  --obj2:       #d6a86a;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }

/* ── INTERACTIVE WIDGETS (concept manipulatives) ── */
.iw { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.1rem; margin:1rem 0 2.4rem; }
.iw-tag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.iw-task { font-size:.88rem; color:var(--text2); margin-bottom:.75rem; }
.iw-cv { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface2); }
.iw-cv canvas { display:block; width:100%; height:auto; }
.ctrl { margin:.7rem 0; }
.ctrl label { display:block; font-size:.75rem; color:var(--text3); margin-bottom:.25rem; }
.ctrl input[type=range] { width:100%; accent-color:var(--green); height:28px; }
.readout { display:grid; grid-template-columns:repeat(3,1fr); gap:.5rem; margin:.8rem 0; }
.ro { background:var(--surface2); border-radius:8px; padding:.5rem .35rem; text-align:center; }
.ro-l { font-size:.62rem; text-transform:uppercase; letter-spacing:.05em; color:var(--text3); }
.ro-v { font-family:'IBM Plex Mono',monospace; font-size:.9rem; font-weight:600; color:var(--green); }
.rverify-btn { background:var(--green); color:#fff; border:none; border-radius:8px; padding:.6rem 1.2rem; font-size:.84rem; font-weight:600; cursor:pointer; min-height:44px; }
.rverify-btn:hover { background:var(--green-dark); }
.rfb { font-size:.84rem; color:var(--text2); margin-top:.6rem; min-height:1.3rem; }
.okfb { color:var(--ok); font-weight:700; }
.cls-card { display:block; text-align:center; font-weight:600; font-size:.92rem; background:var(--surface2); border:1.5px solid var(--border); border-radius:8px; padding:.8rem .6rem; margin:.6rem 0; }
.cls-bins { display:flex; flex-wrap:wrap; gap:.5rem; margin:.7rem 0; }
.cls-bin { flex:1 1 120px; min-height:44px; border:1.5px solid var(--border); border-radius:8px; padding:.55rem .8rem; cursor:pointer; background:var(--surface2); color:var(--text); font-family:inherit; font-size:.86rem; font-weight:600; }
.cls-bin:hover { border-color:var(--green); background:var(--green-bg); }
.cls-done { font-weight:700; color:var(--ok); text-align:center; padding:.8rem; }
@media (max-width:600px) {
  .iw { padding:.8rem; }
  .readout { grid-template-columns:1fr 1fr; }
  .cls-bin { flex:1 1 100%; }
}
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Principio de Arquímedes: Flotación y Propiedades de Fluidos</div>
    <div class="wcourse" id="wcourse-el">Física · 2° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Principio de Arquímedes: Flotación y Propiedades de Fluidos</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">

  var g = (studentData.group || '').trim();
  return 'liaxa_fis2_t06_g02__' + (n + '__' + g).replace(/\s+/g, '_');
}

function saveSession() {
  if (!studentData.name) return;
  var drawings = [], texts = [], photos = [];
  problems.forEach(function(p, i) {
    var dc = document.getElementById('dc' + i);
    if (dc && dc.width) {
      var blank = document.createElement('canvas');
      blank.width = dc.width; blank.height = dc.height;
      drawings.push(dc.toDataURL() === blank.toDataURL() ? null : dc.toDataURL('image/png'));
    } else { drawings.push(null); }
    var ta = document.getElementById('ta' + i);
    texts.push(ta ? ta.value : '');
    var pp = document.getElementById('pp' + i);
    photos.push((pp && pp.src && pp.src.indexOf('data:') === 0) ? pp.src : null);
  });
  var state = {
    name: studentData.name, group: studentData.group,
    answeredCount: answeredCount, correctCount: correctCount,
    choices: problems.map(function(p) { return p.studentChoice; }),
    drawings: drawings, texts: texts, photos: photos
  };
  try { localStorage.setItem(lsKey(), JSON.stringify(state)); } catch(e) {}
}

function loadSession(name, group) {
  var key = 'liaxa_fis2_t06_g02__' + (name + '__' + group).replace(/\s+/g, '_');
  try { var r = localStorage.getItem(key); return r ? JSON.parse(r) : null; } catch(e) { return null; }
}

function restoreSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  var saved = loadSession(name, group);
  if (!saved) return;
  document.getElementById('restoreBar').style.display = 'none';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = currentAttempt(name, group);
  buildLesson(seededRng(name + group + att));
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
  saved.choices.forEach(function(choice, idx) {
    if (choice !== null && choice !== undefined) confirmMC(idx, choice);
  });
  setTimeout(function() {
    if (saved.drawings) {
      saved.drawings.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var dc = document.getElementById('dc' + i);
        if (!dc || !dc.width) return;
        var img = new Image();
        img.onload = function() {
          var dpr = window.devicePixelRatio || 1;
          dc.getContext('2d').drawImage(img, 0, 0, dc.width / dpr, dc.height / dpr);
        };
        img.src = dataUrl;
      });
    }
    if (saved.texts) {
      saved.texts.forEach(function(text, i) {
        if (!text) return;
        var ta = document.getElementById('ta' + i);
        if (ta) ta.value = text;
      });
    }
    if (saved.photos) {
      saved.photos.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var pp = document.getElementById('pp' + i);
        if (!pp) return;
        pp.src = dataUrl; pp.style.display = 'block';
        var pz = document.getElementById('pz' + i);
        if (pz) pz.style.opacity = '0.4';
      });
    }
  }, 300);
}

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

async function generatePDF() {
  var btn = document.getElementById('dlBtn');
  btn.textContent = 'Generando PDF…';
  btn.disabled = true;

  var jspdf   = window.jspdf;
  var doc     = new jspdf.jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });
  var PW      = 215.9;
  var M       = 18;
  var TW      = PW - M * 2;
  var PH      = doc.internal.pageSize.height;
  var name    = studentData.name;
  var group   = studentData.group;
  var total   = problems.length;
  var pct     = Math.round(correctCount / total * 100);
  var dateStr = new Date().toLocaleString('es-MX', { dateStyle:'long', timeStyle:'short' });

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS — INJECTION BLOCK ─────────────────────────────────────────
  //   Match these RGB values to --green and --gold above.
  //   PRIMARY  → pBR, pBG, pBB
  //   ACCENT   → pAR, pAG, pAB
  // ──────────────────────────────────────────────────────────────────────────
  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;  // PRIMARY (from SCHOOL, Rule 16)
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;   // ACCENT (from SCHOOL, Rule 16)

  function pdfText(html) {
    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/\u2192/g,'->').replace(/\u2212/g,'-').replace(/\u00b2/g,'^2')
      .replace(/\u00b3/g,'^3').replace(/\u00d7/g,'x').replace(/\u00f7/g,'/')
      .replace(/\u2260/g,'!=').replace(/\u2264/g,'<=').replace(/\u2265/g,'>=')
      .replace(/\u221a/g,'sqrt').replace(/\u03c0/g,'pi').replace(/\u2026/g,'...')
      .replace(/\s+/g,' ').trim();
  }

  // ── PORTADA: orange line / white logo strip / orange line / blue band ──
  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,2,'F');   // top accent line
  doc.setFillColor(255,255,255); doc.rect(0,2,PW,26,'F');                               // white logo strip
  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,28,PW,2,'F');  // bottom accent line
  doc.setFillColor(pBR,pBG,pBB); doc.rect(0,30,PW,34,'F');       // blue header band

  if (SCHOOL.logoLeftB64) {
    var fmtL = SCHOOL.logoLeftB64.indexOf('/9j/') > -1 ? 'JPEG' : 'PNG';
    try { doc.addImage(SCHOOL.logoLeftB64, fmtL, M, 4, 48, 22); } catch(e) {}
  }
  if (SCHOOL.logoRightB64) {
    var fmtR = SCHOOL.logoRightB64.indexOf('/9j/') > -1 ? 'JPEG' : 'PNG';
    try { doc.addImage(SCHOOL.logoRightB64, fmtR, 130, 4, 48, 22); } catch(e) {}
  }

  var lx = PW - M - 36;
  var ly = 10;
  doc.setDrawColor(pBR,pBG,pBB); doc.setLineWidth(0.7);
  doc.lines([[2.57-1.03,4.63-6.17],[4.11-2.57,5.14-4.63],[5.66-4.11,2.57-5.14]], lx+1.03, ly+6.17);
  doc.setFillColor(pAR,pAG,pAB); doc.circle(lx+5.66, ly+2.57, 0.9, 'F');
  doc.setDrawColor(pAR,pAG,pAB); doc.setLineWidth(0.7);
  doc.line(lx+8.23, ly+1.54, lx+8.23, ly+7.2);
  doc.setTextColor(pBR,pBG,pBB); doc.setFontSize(11); doc.setFont('helvetica','bold');
  doc.text('LIAXA', lx+10, ly+6.8);

  // Guide title + date inside the blue band
  doc.setTextColor(232,238,247); doc.setFontSize(19); doc.setFont('helvetica','bold');
  doc.text(t('wtitle'), M, 49);
  doc.setTextColor(150,165,200); doc.setFontSize(8); doc.setFont('helvetica','normal');
  doc.text(dateStr, M, 59);

  // ── Student info card (name + group only — código goes to footer) ──
  doc.setFillColor(237,240,245); doc.roundedRect(M,72,TW,20,3,3,'F');
  doc.setTextColor(130,140,160); doc.setFontSize(8.5); doc.setFont('helvetica','bold');
  doc.text('ALUMNO', M+4, 79); doc.text('GRUPO', 130, 79);
  doc.setTextColor(20,24,32); doc.setFontSize(11); doc.setFont('helvetica','bold');
  doc.text(name, M+4, 87); doc.text(group, 130, 87);

  // ── Score box ──
  var sc = pct>=70?[26,106,74]:pct>=50?[224,123,26]:[176,48,16];
  doc.setFillColor(255,255,255); doc.roundedRect(M,100,TW,34,4,4,'F');
  doc.setDrawColor(sc[0],sc[1],sc[2]); doc.setLineWidth(0.8);

function L(o){ return (o && o[LANG] !== undefined) ? o[LANG] : (o && o.es) || ''; }
function num(x){ return String(Math.round(x * 100) / 100); }
function CV(n){ var v = getComputedStyle(document.documentElement).getPropertyValue(n); return (v || '').trim() || '#808080'; }

function sec(tag, title, html){
  var d = document.createElement('div');
  d.className = 'section';
  d.innerHTML = '<div class="stag">' + tag + '</div><h2>' + title + '</h2>' + html;
  document.getElementById('lessonBody').appendChild(d);
  return d;
}
function iw(kind, id){
  var d = document.createElement('div');
  d.className = 'iw section';
  d.id = id;
  d.setAttribute('data-widget', kind);
  document.getElementById('lessonBody').appendChild(d);
  return d;
}
function rcard(name, form, note){
  return '<div class="rcard"><div class="rname">' + name + '</div><div class="rform">' + form + '</div><div class="rnote">' + note + '</div></div>';
}
function shuffleOpts(opts, correctText, rng){
  var a = shuffle(opts, rng);
  return { opts: a, idx: a.indexOf(correctText) };
}
function addProb(spec, rng){
  var s = shuffleOpts(spec.options, spec.correct, rng);
  var i = problems.length;
  problems.push({
    title: spec.title, questionText: spec.q, fn: spec.fn || '',
    hint: spec.hint, explanation: spec.exp,
    options: s.opts, correctIdx: s.idx, showWork: !!spec.showWork,
    studentChoice: null, pendingChoice: null
  });
  buildOneCard(problems[i], i);
}

/* ── PROBLEMA 1 · densidad del cuerpo frente a la del agua ── */
function mkP1(rng){
  var v = rng() < 0.5 ? 0 : 1;
  if (v === 0) {
    var p = pick([[120,200],[180,300],[240,400],[200,250],[320,400],[150,200],[300,400],[270,300]], rng);
    var m = p[0], vol = p[1], d = num(m / vol), inv = num(vol / m);
    var o = [
      L({ es: d + ' g/cm³, así que flota', en: d + ' g/cm³, so it floats' }),
      L({ es: d + ' g/cm³, así que se hunde', en: d + ' g/cm³, so it sinks' }),
      L({ es: inv + ' g/cm³, así que se hunde', en: inv + ' g/cm³, so it sinks' }),
      L({ es: inv + ' g/cm³, así que flota', en: inv + ' g/cm³, so it floats' })
    ];
    return {
      title: L({ es: 'Un bloque en la cubeta', en: 'A block in the bucket' }),
      showWork: true,
      q: L({ es: 'Un bloque de madera tiene una masa de ' + m + ' g y ocupa un volumen de ' + vol + ' cm³. Lo sueltas dentro de una cubeta con agua, cuya densidad es de 1 g/cm³. ¿Qué densidad tiene el bloque y qué le ocurre al soltarlo?',
             en: 'A wooden block has a mass of ' + m + ' g and takes up a volume of ' + vol + ' cm³. You drop it into a bucket of water, whose density is 1 g/cm³. What density does the block have and what happens when you let it go?' }),
      options: o, correct: o[0],
      hint: L({ es: 'La densidad sale de repartir la masa entre el volumen que ocupa el cuerpo. Después compara ese número con 1 g/cm³, que es la densidad del agua: si es menor, el cuerpo flota.',
                en: 'Density comes from sharing the mass over the volume the body occupies. Then compare that number with 1 g/cm³, the density of water: if it is smaller, the body floats.' }),
      exp: L({ es: m + ' g repartidos en ' + vol + ' cm³ dan ' + d + ' g/cm³. Como ' + d + ' es menor que 1 g/cm³ del agua, el bloque flota con una parte fuera del líquido.',
               en: m + ' g shared over ' + vol + ' cm³ give ' + d + ' g/cm³. Since ' + d + ' is smaller than the 1 g/cm³ of water, the block floats with part of it above the liquid.' })
    };
  }
  var q2 = pick([[540,200],[810,300],[600,300],[1560,200]], rng);
  var m2 = q2[0], v2 = q2[1], d2 = num(m2 / v2), i2 = num(v2 / m2);
  var o2 = [
    L({ es: d2 + ' g/cm³, así que se hunde', en: d2 + ' g/cm³, so it sinks' }),
    L({ es: d2 + ' g/cm³, así que flota', en: d2 + ' g/cm³, so it floats' }),
    L({ es: i2 + ' g/cm³, así que flota', en: i2 + ' g/cm³, so it floats' }),
    L({ es: i2 + ' g/cm³, así que se hunde', en: i2 + ' g/cm³, so it sinks' })
  ];
  return {
    title: L({ es: 'Una pieza de metal', en: 'A piece of metal' }),
    showWork: true,
    q: L({ es: 'Una pieza maciza de metal tiene una masa de ' + m2 + ' g y ocupa un volumen de ' + v2 + ' cm³. La colocas con cuidado en una cubeta con agua, cuya densidad es de 1 g/cm³. ¿Qué densidad tiene la pieza y qué le ocurre?',
           en: 'A solid piece of metal has a mass of ' + m2 + ' g and takes up a volume of ' + v2 + ' cm³. You carefully place it in a bucket of water, whose density is 1 g/cm³. What density does the piece have and what happens to it?' }),
    options: o2, correct: o2[0],
    hint: L({ es: 'La densidad sale de repartir la masa entre el volumen que ocupa el cuerpo. Después compara ese número con 1 g/cm³, que es la densidad del agua: si es mayor, el cuerpo se hunde.',
              en: 'Density comes from sharing the mass over the volume the body occupies. Then compare that number with 1 g/cm³, the density of water: if it is bigger, the body sinks.' }),
    exp: L({ es: m2 + ' g repartidos en ' + v2 + ' cm³ dan ' + d2 + ' g/cm³. Como ' + d2 + ' es mayor que 1 g/cm³ del agua, la pieza baja hasta el fondo.',
             en: m2 + ' g shared over ' + v2 + ' cm³ give ' + d2 + ' g/cm³. Since ' + d2 + ' is bigger than the 1 g/cm³ of water, the piece goes down to the bottom.' })
  };
}

/* ── PROBLEMA 2 · el empuje vale el peso del líquido desalojado ── */
function mkP2(rng){
  var v = rng() < 0.5 ? 0 : 1;
  if (v === 0) {
    var vl = pick([2,3,4,5], rng), e = vl * 10;
    var o = [
      L({ es: e + ' N', en: e + ' N' }),
      L({ es: vl + ' N', en: vl + ' N' }),
      L({ es: (e * 10) + ' N', en: (e * 10) + ' N' }),
      L({ es: '10 N', en: '10 N' })
    ];
    return {
      title: L({ es: 'La boya sumergida', en: 'The submerged buoy' }),
      showWork: true,
      q: L({ es: 'Una boya se mantiene completamente sumergida en agua y el agua que queda desplazada por ella llenaría un bote de ' + vl + ' litros. Cada litro de agua tiene una masa de 1 kg y cada kilogramo pesa 10 N. ¿De cuánto es el empuje que recibe la boya?',
             en: 'A buoy is held completely under water and the water it pushes aside would fill a ' + vl + ' litre can. Each litre of water has a mass of 1 kg and each kilogram weighs 10 N. How big is the upward push the buoy receives?' }),
      options: o, correct: o[0],
      hint: L({ es: 'El empuje vale lo mismo que el peso del líquido desalojado. Calcula primero la masa de esa agua y después cuánto pesa.',
                en: 'The upward push is worth the same as the weight of the displaced liquid. Work out the mass of that water first and then its weight.' }),
      exp: L({ es: vl + ' litros de agua tienen una masa de ' + vl + ' kg, y esa masa pesa ' + e + ' N. El empuje es igual a ese peso, así que vale ' + e + ' N.',
               en: vl + ' litres of water have a mass of ' + vl + ' kg, and that mass weighs ' + e + ' N. The upward push equals that weight, so it is ' + e + ' N.' })
    };
  }
  var vl2 = pick([5,10,15], rng), e2 = vl2 * 8;
  var o2 = [
    L({ es: e2 + ' N', en: e2 + ' N' }),
    L({ es: (vl2 * 10) + ' N', en: (vl2 * 10) + ' N' }),
    L({ es: num(vl2 * 0.8) + ' N', en: num(vl2 * 0.8) + ' N' }),
    L({ es: vl2 + ' N', en: vl2 + ' N' })
  ];
  return {
    title: L({ es: 'Sumergida en aceite', en: 'Submerged in oil' }),
    showWork: true,
    q: L({ es: 'Una pieza de plástico se sumerge por completo en un tanque de aceite y desplaza ' + vl2 + ' litros de ese aceite. Cada litro del aceite tiene una masa de 0.8 kg y cada kilogramo pesa 10 N. ¿De cuánto es el empuje que recibe la pieza?',
           en: 'A plastic part is fully submerged in a tank of oil and pushes aside ' + vl2 + ' litres of that oil. Each litre of the oil has a mass of 0.8 kg and each kilogram weighs 10 N. How big is the upward push on the part?' }),
    options: o2, correct: o2[0],
    hint: L({ es: 'El empuje vale lo mismo que el peso del líquido desalojado, y aquí ese líquido es aceite: cada litro tiene menos masa que un litro de agua.',
              en: 'The upward push is worth the same as the weight of the displaced liquid, and here the liquid is oil: each litre has less mass than a litre of water.' }),
    exp: L({ es: vl2 + ' litros de aceite tienen una masa de ' + num(vl2 * 0.8) + ' kg, y esa masa pesa ' + e2 + ' N. El empuje es igual a ese peso: ' + e2 + ' N.',
             en: vl2 + ' litres of oil have a mass of ' + num(vl2 * 0.8) + ' kg, and that mass weighs ' + e2 + ' N. The upward push equals that weight: ' + e2 + ' N.' })
  };
}

/* ── PROBLEMA 3 · peso aparente dentro del líquido ── */
function mkP3(rng){
  var v = rng() < 0.5 ? 0 : 1;
  if (v === 0) {
    var w = pick([90,110,120], rng), e = pick([25,30,40], rng);
    var o = [
      L({ es: (w - e) + ' N', en: (w - e) + ' N' }),
      L({ es: (w + e) + ' N', en: (w + e) + ' N' }),
      L({ es: w + ' N', en: w + ' N' }),
      L({ es: e + ' N', en: e + ' N' })
    ];
    return {
      title: L({ es: 'La escultura en el agua', en: 'The sculpture in the water' }),
      showWork: true,
      q: L({ es: 'Una escultura de metal colgada de un dinamómetro marca ' + w + ' N mientras está en el aire. Después se sumerge por completo en agua y el agua que desplaza pesa ' + e + ' N. ¿Qué marca el dinamómetro con la escultura sumergida?',
             en: 'A metal sculpture hanging from a spring scale reads ' + w + ' N while it is in the air. It is then fully submerged in water and the water it pushes aside weighs ' + e + ' N. What does the scale read with the sculpture under water?' }),
      options: o, correct: o[0],
      hint: L({ es: 'Dentro del líquido el dinamómetro marca el peso real menos el empuje, y el empuje vale lo mismo que el peso del líquido desplazado.',
                en: 'Inside the liquid the scale reads the real weight minus the upward push, and that push is worth the same as the weight of the displaced liquid.' }),
      exp: L({ es: 'El empuje vale ' + e + ' N, porque ese es el peso del agua desplazada. La marca del dinamómetro baja de ' + w + ' N a ' + (w - e) + ' N, aunque la escultura sigue teniendo la misma masa.',
               en: 'The upward push is ' + e + ' N, because that is the weight of the displaced water. The scale reading drops from ' + w + ' N to ' + (w - e) + ' N, although the sculpture still has the same mass.' })
    };
  }
  var w2 = pick([48,60,75], rng), e2 = pick([12,15,20], rng), a2 = w2 - e2;
  var o2 = [
    L({ es: e2 + ' N', en: e2 + ' N' }),
    L({ es: (w2 + a2) + ' N', en: (w2 + a2) + ' N' }),
    L({ es: a2 + ' N', en: a2 + ' N' }),
    L({ es: w2 + ' N', en: w2 + ' N' })
  ];
  return {
    title: L({ es: 'Dos marcas del dinamómetro', en: 'Two scale readings' }),
    showWork: true,
    q: L({ es: 'Un cilindro de bronce marca ' + w2 + ' N colgado del dinamómetro en el aire, y marca ' + a2 + ' N cuando queda totalmente sumergido en agua. ¿De cuánto es el empuje que recibe dentro del agua?',
           en: 'A bronze cylinder reads ' + w2 + ' N hanging from the spring scale in the air, and reads ' + a2 + ' N when it is fully submerged in water. How big is the upward push it gets inside the water?' }),
    options: o2, correct: o2[0],
    hint: L({ es: 'La marca baja justo lo que vale el empuje: compara la lectura en el aire con la lectura dentro del agua.',
              en: 'The reading drops by exactly the value of the upward push: compare the reading in air with the reading under water.' }),
    exp: L({ es: 'La diferencia entre ' + w2 + ' N y ' + a2 + ' N es de ' + e2 + ' N, y esa diferencia es el empuje. También es el peso del agua que el cilindro desalojó.',
             en: 'The difference between ' + w2 + ' N and ' + a2 + ' N is ' + e2 + ' N, and that difference is the upward push. It is also the weight of the water the cylinder displaced.' })
  };
}

/* ── PROBLEMA 4 · qué parte del volumen queda sumergida ── */
function mkP4(rng){
  var v = rng() < 0.5 ? 0 : 1;
  if (v === 0) {
    var d = pick([0.6,0.75,0.8,0.9], rng), pc = Math.round(d * 100);
    var o = [
      L({ es: 'El ' + pc + '% de su volumen queda sumergido', en: 'The ' + pc + '% of its volume stays under water' }),

      L({ es: 'La mitad del volumen, sin importar la densidad', en: 'Half of its volume, whatever the density is' }),
      L({ es: 'No se puede saber sin conocer el tamaño del tronco', en: 'It cannot be known without the size of the log' })
    ];
    return {
      title: L({ es: 'El tronco en el lago', en: 'The log in the lake' }),
      showWork: true,
      q: L({ es: 'Un tronco de densidad ' + num(d) + ' g/cm³ flota quieto en un lago de agua dulce, cuya densidad es de 1 g/cm³. ¿Qué parte de su volumen queda por debajo de la superficie?',
             en: 'A log of density ' + num(d) + ' g/cm³ floats still on a fresh water lake, whose density is 1 g/cm³. What part of its volume stays below the surface?' }),
      options: o, correct: o[0],

/* ══════════════════════════════════════════════════════════════════════════
   buildLesson · recorrido interleaved (Regla 1)
     Concepto 1 densidad              -> manipulativo TANQUE DE DENSIDAD    -> P1
     Concepto 2 empuje de Arquímedes  -> manipulativo DINAMÓMETRO Y PROBETA -> P2, P3
     Concepto 3 flotar o hundirse     -> manipulativo FLOTA O SE HUNDE      -> P4, P5
     Concepto 4 barcos y globos       -> manipulativo CARGA LA BARCAZA      -> P6, P7
     Cierre                                                                 -> P8, P9, P10
   Los cuatro manipulativos responden en tiempo real y dan pistas
   direccionales; ninguno otorga puntaje.
   ══════════════════════════════════════════════════════════════════════════ */
function buildLesson(rng){

  sec(

    '<p>' + L({
      es: 'En esta guía vas a ajustar la densidad de un cubo, a leer un dinamómetro mientras hundes un bloque, a decidir qué flota en cada líquido y a cargar una barcaza hasta el límite.',

    }) + '</p>' +
    '<div class="callout"><p><strong>' + L({ es: 'Idea clave: ', en: 'Key idea: ' }) + '</strong>' + L({
      es: 'todo cuerpo metido en un fluido recibe un empujón hacia arriba, y ese empujón vale exactamente lo que pesa el fluido que el cuerpo quitó de en medio. Ese es el principio de Arquímedes.',
      en: 'every body placed in a fluid gets an upward push, and that push is worth exactly what the fluid pushed aside by the body weighs. That is the Archimedes principle.'
    }) + '</p></div>'
  );

  /* ══ CONCEPTO 1 ══ */
  sec(
    L({ es: 'Concepto 1', en: 'Concept 1' }),
    L({ es: 'Densidad: cuánta materia cabe en cada espacio', en: 'Density: how much matter fits in each space' }),
    '<p>' + L({
      es: 'Lo que hunde a un cuerpo no es su peso, sino qué tan apretada está su materia. La densidad dice cuánta masa hay en cada unidad de volumen: un litro de plomo y un litro de unicel ocupan lo mismo, pero uno guarda muchísima más masa que el otro.',
      en: 'What sinks a body is not its weight, but how tightly packed its matter is. Density says how much mass there is in each unit of volume: a litre of lead and a litre of foam take up the same room, but one holds far more mass than the other.'
    }) + '</p>' +
    '<p>' + L({
      es: 'El agua sirve de referencia porque su densidad es de 1 g/cm³, o sea 1 kg por litro. Un cuerpo con densidad menor que la del agua flota, y uno con densidad mayor se va al fondo. Por eso importa si la pieza es maciza o hueca: el hueco añade volumen sin añadir masa.',
      en: 'Water works as the reference because its density is 1 g/cm³, that is 1 kg per litre. A body with density below that of water floats, and one above it goes to the bottom. That is why it matters whether the piece is solid or hollow: the hollow adds volume without adding mass.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es: 'Masa', en: 'Mass' }), L({ es: 'gramo (g)', en: 'gram (g)' }), L({ es: 'cuánta materia tiene el cuerpo, sin decir cuánto lugar ocupa', en: 'how much matter the body has, without saying how much room it takes' })) +
      rcard(L({ es: 'Volumen', en: 'Volume' }), L({ es: 'centímetro cúbico', en: 'cubic centimetre' }), L({ es: 'el lugar que ocupa, incluidos sus huecos cerrados', en: 'the room it takes up, closed hollows included' })) +
      rcard(L({ es: 'Densidad', en: 'Density' }), L({ es: 'g/cm³', en: 'g/cm³' }), L({ es: 'la masa que le toca a cada centímetro cúbico del cuerpo', en: 'the mass falling on each cubic centimetre of the body' })) +
    '</div>' +
    '<div class="callout"><p>' + L({
      es: 'En el tanque que sigue, mueve la masa y el volumen del cubo y observa a qué altura se acomoda. Cuando la densidad pasa de 1 g/cm³, el cubo se va al fondo.',
      en: 'In the tank below, move the mass and the volume of the cube and watch the height where it settles. Once the density goes past 1 g/cm³, the cube drops to the bottom.'
    }) + '</p></div>'
  );
  wDensity(rng);
  addProb(mkP1(rng), rng);

  /* ══ CONCEPTO 2 ══ */
  sec(
    L({ es: 'Concepto 2', en: 'Concept 2' }),
    L({ es: 'El empuje: lo que el líquido devuelve', en: 'The upward push: what the liquid gives back' }),
    '<p>' + L({
      es: 'Para entrar en un líquido, un cuerpo tiene que quitar de en medio parte de ese líquido. El líquido no se deja del todo: responde con una fuerza hacia arriba llamada empuje. Arquímedes encontró la medida exacta de esa fuerza: vale lo mismo que el peso del líquido desalojado.',
      en: 'To get into a liquid, a body has to push part of that liquid aside. The liquid does not give in completely: it answers with an upward force called buoyant push. Archimedes found the exact size of that force: it is worth the same as the weight of the displaced liquid.'
    }) + '</p>' +
    '<p>' + L({
      es: 'Por eso una piedra pesada se levanta con menos esfuerzo dentro del agua que fuera de ella. La piedra no perdió masa: el dinamómetro marca menos porque el empuje jala hacia arriba. A esa lectura menor se le llama peso aparente, y es el peso real menos el empuje.',
      en: 'That is why a heavy stone is easier to lift inside the water than out of it. The stone lost no mass: the scale reads less because the push pulls upwards. That smaller reading is called apparent weight, and it is the real weight minus the push.'
    }) + '</p>' +
    '<div class="callout"><p>' + L({
      es: 'Con agua es muy cómodo medir: cada litro desalojado tiene 1 kg de masa y pesa 10 N. Hunde el bloque poco a poco en el aparato siguiente y observa cómo baja la marca del dinamómetro conforme sube el nivel del agua.',
      en: 'With water the numbers are friendly: each displaced litre has 1 kg of mass and weighs 10 N. Sink the block little by little in the device below and watch the scale reading drop as the water level rises.'
    }) + '</p></div>'
  );
  wBuoy(rng);
  addProb(mkP2(rng), rng);
  addProb(mkP3(rng), rng);

  /* ══ CONCEPTO 3 ══ */
  sec(
    L({ es: 'Concepto 3', en: 'Concept 3' }),
    L({ es: 'Flotar, hundirse y qué tanto se sumerge', en: 'Floating, sinking and how deep it sits' }),
    '<p>' + L({
      es: 'Un cuerpo suelto en un líquido se queda quieto solo cuando el empuje iguala a su peso. Si sumergido por completo el empuje todavía es menor que el peso, no hay equilibrio posible y el cuerpo baja; si es mayor, sube hasta asomar y se detiene con una parte afuera.',
      en: 'A body left in a liquid stays still only when the push equals its weight. If fully submerged the push is still smaller than the weight, no balance is possible and the body goes down; if it is bigger, it rises until part of it shows and stops there.'
    }) + '</p>' +
    '<p>' + L({
      es: 'La parte que queda bajo la superficie no es cualquiera: es la que hace falta para desalojar un peso de líquido igual al del cuerpo. Comparando densidades sale de inmediato: un cuerpo de 0.8 g/cm³ en agua se hunde 80 de cada 100 partes de su volumen, y en un líquido más denso se hunde menos.',
      en: 'The part left under the surface is not just any part: it is the part needed to displace a weight of liquid equal to that of the body. Comparing densities gives it at once: a body of 0.8 g/cm³ in water sinks 80 out of every 100 parts of its volume, and in a denser liquid it sinks less.'
    }) + '</p>' +
    '<div class="callout"><p>' + L({
      es: 'Abajo aparecen objetos y líquidos con su densidad. Decide en cada caso si el objeto se queda arriba o se va al fondo antes de mirar la respuesta.',
      en: 'Below you get objects and liquids with their densities. Decide in each case whether the object stays up or goes to the bottom before looking at the answer.'
    }) + '</p></div>'
  );
  wSort(rng);
  addProb(mkP4(rng), rng);
  addProb(mkP5(rng), rng);

  /* ══ CONCEPTO 4 ══ */
  sec(
    L({ es: 'Concepto 4', en: 'Concept 4' }),
    L({ es: 'Barcos, submarinos y globos', en: 'Ships, submarines and balloons' }),
    '<p>' + L({
      es: 'Un barco es acero con muchísimo aire adentro. Contando el casco hueco completo, su densidad media queda muy por debajo de la del agua, y por eso flota lo que en forma de clavo se hundiría. Cuanta más carga sube, más se hunde el casco y más agua desaloja, hasta llegar a su límite.',
      en: 'A ship is steel with a great deal of air inside. Counting the whole hollow hull, its average density stays well below that of water, and that is why something that would sink as a nail floats. The more load it takes, the deeper the hull sits and the more water it displaces, up to its limit.'
    }) + '</p>' +
    '<p>' + L({
      es: 'El submarino juega con la masa: inunda sus tanques de lastre para bajar y los vacía con aire comprimido para subir, sin cambiar el volumen del casco. El globo aerostático hace lo mismo dentro del aire, que también es un fluido: calienta el aire de adentro para que el conjunto pese menos que el aire desalojado.',
      en: 'The submarine plays with mass: it floods its ballast tanks to go down and empties them with compressed air to go up, without changing the hull volume. The hot air balloon does the same inside air, which is a fluid too: it heats the air inside so the whole thing weighs less than the displaced air.'
    }) + '</p>' +
    '<div class="callout"><p>' + L({
      es: 'Prueba la barcaza que sigue: sube carga y mira hasta dónde baja la línea de flotación antes de que el agua entre por la borda.',
      en: 'Try the barge below: add load and watch how far the waterline drops before water comes over the side.'
    }) + '</p></div>'
  );
  wCargo(rng);
  addProb(mkP6(rng), rng);
  addProb(mkP7(rng), rng);

  /* ══ CIERRE ══ */

    L({ es: 'Cierre', en: 'Closing' }),

    '<p>' + L({
      es: 'Lo que sigue mezcla las tres ideas del recorrido en situaciones nuevas.',
      en: 'What follows mixes the three ideas of the route in new situations.'
    }) + '</p>'

  addProb(mkP9(rng), rng);
