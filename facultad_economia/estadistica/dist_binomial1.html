var P_POOL = [0.20, 0.25, 0.30, 0.35, 0.40, 0.45];

/* ════════════════════════════════════════════════════════════════════════
   WIDGET 1 - Bernoulli exact-order sequence builder   (Mode B)
   data-widget="bernoulli-sequence"
   ════════════════════════════════════════════════════════════════════════ */
function wBernoulliSeq(rng, host) {
  var n = pick([4, 5], rng);
  var p = pick(P_POOL, rng), q = 1 - p;
  var ctx = CTX.sales;
  var st = { slots: [], answer: '', tries: 0, verified: false };
  for (var i = 0; i < n; i++) st.slots.push(false);

  function target() {
    var r = st.slots.filter(function(v) { return v; }).length;
    return { r: r, val: Math.pow(p, r) * Math.pow(q, n - r) };
  }

  function render() {
    var head =
      '<div class="iw-head"><span class="iw-tag">' + L({es:'Actividad',en:'Activity'}) + '</span>' +
      '<span class="iw-title">' + L({es:'Construye un orden exacto',en:'Build one exact order'}) + '</span></div>' +
      '<div class="iw-sub">' + L({
        es: cap1(ctx.es.agent) + ' hace ' + n + ' ' + ctx.es.n + ' hoy. Cada llamada, de forma independiente, tiene probabilidad p = ' + p.toFixed(2) + ' de que ' + ctx.es.succ + '.',
        en: cap1(ctx.en.agent) + ' makes ' + n + ' ' + ctx.en.n + ' today. Each call, independently, has probability p = ' + p.toFixed(2) + ' that ' + ctx.en.succ + '.'
      }) + '</div>' +
      '<div class="gw-mini">' + L({
        es: 'Toca cada casilla para marcarla como <strong>venta</strong> (✓) o <strong>no venta</strong> (✗) y construye cualquier secuencia de ' + n + ' llamadas que quieras. Luego calcula la probabilidad de que las llamadas ocurran EXACTAMENTE en ese orden - ni uno distinto.',
        en: 'Tap each box to mark it <strong>sale</strong> (✓) or <strong>no sale</strong> (✗) and build any sequence of ' + n + ' calls you like. Then calculate the probability that the calls occur in EXACTLY that order - no other order.'
      }) + '</div>';

    var slots = '<div class="bseq-row">';
    for (var i = 0; i < n; i++) {
      var on = st.slots[i];
      slots += '<div class="bseq-slot ' + (on ? 'on' : 'off') + '" data-i="' + i + '">' +
        (on ? '✓' : '✗') + '<span class="bseq-lbl">' + (on ? L({es:'Venta',en:'Sale'}) : L({es:'No venta',en:'No sale'})) + '</span></div>';
    }
    slots += '</div>';

    var ans =
      '<div class="bseq-ansrow">' +
        '<span style="font-size:.83rem;color:var(--text2)">' + L({es:'P(ese orden exacto) =',en:'P(that exact order) ='}) + '</span>' +
        '<input class="bseq-inp" id="bseqInp" type="text" inputmode="decimal" placeholder="0.0000" value="' + st.answer + '">' +
        '<button class="verify-btn" id="bseqVfy">' + L({es:'Verificar',en:'Check'}) + '</button>' +
      '</div>';

    host.innerHTML = head + slots + ans + '<div class="iw-fb"></div>';

    if (st.verified) { host.querySelector('#bseqVfy').disabled = true; host.querySelector('#bseqInp').disabled = true; }

    host.querySelectorAll('.bseq-slot').forEach(function(el) {
      el.onclick = function() {
        if (st.verified) return;
        var i = parseInt(this.getAttribute('data-i'));
        st.slots[i] = !st.slots[i];
        this.classList.toggle('on');
        this.classList.toggle('off');
        this.firstChild.textContent = st.slots[i] ? '✓' : '✗';
        this.querySelector('.bseq-lbl').textContent = st.slots[i] ? L({es:'Venta',en:'Sale'}) : L({es:'No venta',en:'No sale'});
      };
    });
    host.querySelector('#bseqInp').oninput = function() { st.answer = this.value; };
    host.querySelector('#bseqVfy').onclick = function() {
      var val = parseFloat((st.answer || '').replace(',', '.'));
      var t = target();
      if (isNaN(val)) {
        say(host, 'warm', L({es:'Escribe tu cálculo como número decimal, por ejemplo 0.0324.', en:'Enter your calculation as a decimal, e.g. 0.0324.'}));
        return;
      }
      if (Math.abs(val - t.val) < 0.0007) {
        st.verified = true;
        say(host, 'good', '✓ ' + L({
          es: 'Correcto. Multiplicaste ' + t.r + ' factor(es) de p = ' + p.toFixed(2) + ' y ' + (n - t.r) + ' factor(es) de (1 − p) = ' + q.toFixed(2) + ' en el orden exacto que construiste, dando ' + fmtP(t.val) + '. Cualquier otro orden con el mismo número de ventas (' + t.r + ') tendría esta misma probabilidad - en la siguiente sección veremos cuántos órdenes de ese tipo existen.',
          en: 'Correct. You multiplied ' + t.r + ' factor(s) of p = ' + p.toFixed(2) + ' and ' + (n - t.r) + ' factor(s) of (1 − p) = ' + q.toFixed(2) + ' in the exact order you built, giving ' + fmtP(t.val) + '. Any other order with the same number of sales (' + t.r + ') would have this same probability - the next section shows how many such orders exist.'
        }));
        host.querySelector('#bseqVfy').disabled = true;
        host.querySelector('#bseqInp').disabled = true;
      } else {
        st.tries++;
        if (st.tries >= 3) {
          st.verified = true;
          say(host, 'warm', L({
            es: 'La probabilidad de tu secuencia exacta es ' + fmtP(t.val) + '. Se obtiene multiplicando, casilla por casilla en orden, p = ' + p.toFixed(2) + ' cuando hay venta y (1 − p) = ' + q.toFixed(2) + ' cuando no la hay: en tu caso, ' + t.r + ' venta(s) y ' + (n - t.r) + ' no-venta(s).',
            en: 'The probability of your exact sequence is ' + fmtP(t.val) + '. Multiply, box by box in order, p = ' + p.toFixed(2) + ' when it is a sale and (1 − p) = ' + q.toFixed(2) + ' when it is not: in your case, ' + t.r + ' sale(s) and ' + (n - t.r) + ' non-sale(s).'
          }));
          host.querySelector('#bseqVfy').disabled = true;
          host.querySelector('#bseqInp').disabled = true;
        } else {
          say(host, 'miss', L({es:'No coincide. Multiplica la probabilidad correspondiente a cada casilla, en el orden en que aparece, una por una.', en:'Not quite. Multiply the probability for each box, in the order it appears, one at a time.'}));
        }
      }
    };
  }
  widgets.push(render); render();
}

/* ════════════════════════════════════════════════════════════════════════
   WIDGET 2 - Combination / arrangement counter   (Mode C)
   data-widget="combination-counter"
   ════════════════════════════════════════════════════════════════════════ */
function wCombinationCounter(rng, host) {
  var PAIRS = [[4,1],[4,2],[4,3],[5,1],[5,2],[5,3],[5,4]];
  var seq = shuffle(PAIRS.slice(), rng).slice(0, 3);
  var st = { round: 0, tries: 0, done: false };

  function enumerate(n, r) {
    var out = [];
    for (var i = 0; i < (1 << n); i++) {
      var bits = 0, arr = [];
      for (var b = n - 1; b >= 0; b--) { var on = (i >> b) & 1; if (on) bits++; arr.push(on); }
      if (bits === r) out.push(arr);
    }
    return out;
  }

  function render() {
    if (st.done) {
      host.innerHTML =
        '<div class="iw-head"><span class="iw-title">' + L({es:'Contador de combinaciones',en:'Combination counter'}) + '</span></div>' +
        '<div class="iw-fb good">✓ ' + L({es:'Completaste las tres rondas. Contar combinaciones - no permutaciones - es la pieza que faltaba para pasar de un solo orden a la probabilidad de "r éxitos, en cualquier orden".',en:'You completed all three rounds. Counting combinations - not permutations - is the missing piece for moving from one order to the probability of "r successes, in any order".'}) + '</div>';
      return;
    }
    var pr = seq[st.round], n = pr[0], r = pr[1];
    var correct = nCr(n, r);
    var nPr = 1; for (var k = 0; k < r; k++) nPr *= (n - k); /* permutations, order matters */
    var altRow = nCr(n, Math.min(n, r + 1) === r ? Math.max(0, r - 1) : r + 1);
    var naive = n * r;
    var opts = uniqueIntOptions(correct, [nPr, altRow, naive], rng);
    var shuffled = shuffle(opts, rng);

    host.innerHTML =
      '<div class="iw-head"><span class="iw-tag">' + L({es:'Ronda',en:'Round'}) + ' ' + (st.round + 1) + '/3</span>' +
      '<span class="iw-title">' + L({es:'Contador de combinaciones',en:'Combination counter'}) + '</span></div>' +
      '<div class="iw-sub">' + L({es:'¿Cuántos órdenes distintos de ventas / no-ventas dan exactamente el número de ventas pedido?',en:'How many distinct orders of sale / no-sale give exactly the requested number of sales?'}) + '</div>' +
      '<div class="cc-scenario">' + L({
        es: 'Se hacen <strong>n = ' + n + '</strong> llamadas. Se necesitan exactamente <strong>r = ' + r + '</strong> ventas, sin importar en qué llamadas ocurren. ¿En cuántos órdenes distintos de las ' + n + ' llamadas ocurre esto?',
        en: '<strong>n = ' + n + '</strong> calls are made. Exactly <strong>r = ' + r + '</strong> sales are needed, regardless of which calls they occur on. In how many distinct orders of the ' + n + ' calls does this happen?'
      }) + '</div>' +
      '<div class="cc-optgrid">' + shuffled.map(function(v) { return '<div class="cc-opt" data-v="' + v + '">' + v + '</div>'; }).join('') + '</div>' +
      '<div class="iw-fb"></div>' +
      '<div class="cc-enum" id="ccEnum" style="display:none"></div>';

    host.querySelectorAll('.cc-opt').forEach(function(btn) {
      btn.onclick = function() {
        if (st.done) return;
        var v = parseInt(this.getAttribute('data-v'));
        if (v === correct) {
          this.classList.add('right');
          host.querySelectorAll('.cc-opt').forEach(function(b) { b.style.pointerEvents = 'none'; });
          var arrangements = enumerate(n, r);
          var grid = document.getElementById('ccEnum');
          grid.style.display = 'grid';
          grid.innerHTML = arrangements.map(function(arr) {
            return '<div class="cc-enum-item">' + arr.map(function(x) { return x ? '✓' : '✗'; }).join('') + '</div>';
          }).join('');
          say(host, 'good', '✓ ' + L({
            es: 'Correcto: C(' + n + ', ' + r + ') = ' + correct + '. Arriba se muestran las ' + correct + ' secuencias distintas - cada una con exactamente ' + r + ' ventas. El orden no importa para contar "cuántas ventas", así que no se usa la permutación (que sí distingue el orden).',
            en: 'Correct: C(' + n + ', ' + r + ') = ' + correct + '. Above are the ' + correct + ' distinct sequences - each with exactly ' + r + ' sales. Order does not matter for counting "how many sales", so the permutation count (which does track order) is not used.'
          }));
          st.round++; st.tries = 0;
          setTimeout(function() { if (st.round >= 3) st.done = true; render(); }, 2200);
        } else {
          st.tries++;
          this.classList.add('wrong');
          var self = this;
          setTimeout(function() { self.classList.remove('wrong'); }, 650);
          if (st.tries >= 3) {
            host.querySelectorAll('.cc-opt').forEach(function(b) {
              if (parseInt(b.getAttribute('data-v')) === correct) b.classList.add('right');
              b.style.pointerEvents = 'none';
            });
            say(host, 'warm', L({
              es: 'El valor correcto es C(' + n + ', ' + r + ') = ' + correct + ' = ' + mfrac('n!', 'r!(n−r)!') + '. No se multiplica n × r ni se usa la permutación ' + mfrac('n!', '(n−r)!') + ', porque esas cuentan el orden.',
              en: 'The correct value is C(' + n + ', ' + r + ') = ' + correct + ' = ' + mfrac('n!', 'r!(n−r)!') + '. Do not multiply n × r or use the permutation ' + mfrac('n!', '(n−r)!') + ', since those count order.'
            }));
            st.round++; st.tries = 0;
            setTimeout(function() { if (st.round >= 3) st.done = true; render(); }, 2200);
          } else {
            say(host, 'miss', L({es:'Aquí el orden no importa - cuenta grupos posibles, no secuencias ordenadas (evita multiplicar posiciones o usar la permutación).', en:'Order does not matter here - count possible groups, not ordered sequences (avoid multiplying positions or using the permutation).'}));
          }
        }
      };
    });
  }
  widgets.push(render); render();
}

/* ════════════════════════════════════════════════════════════════════════
   WIDGET 3 - Binomial PMF formula assembler   (Mode B)
   data-widget="pmf-assembler"
   ════════════════════════════════════════════════════════════════════════ */
function wPmfAssembler(rng, host) {
  var n = pick([5, 6, 7, 8], rng);
  var p = pick(P_POOL, rng), q = 1 - p;
  var r = rngInt(rng, 1, n - 1);
  var ctx = CTX.sales;
  var cCorrect = nCr(n, r);
  var pr = Math.pow(p, r);
  var qnr = Math.pow(q, n - r);
  var finalVal = cCorrect * pr * qnr;
  var st = { tries: 0, verified: false, v1: '', v2: '', v3: '' };

  function render() {
    host.innerHTML =
      '<div class="iw-head"><span class="iw-tag">' + L({es:'Actividad',en:'Activity'}) + '</span>' +
      '<span class="iw-title">' + L({es:'Arma la fórmula binomial',en:'Assemble the binomial formula'}) + '</span></div>' +
      '<div class="iw-sub">' + L({
        es: cap1(ctx.es.agent) + ' hace n = ' + n + ' ' + ctx.es.n + '. p = ' + p.toFixed(2) + '. Calcula P(X = ' + r + '), la probabilidad de obtener exactamente r = ' + r + ' ventas, en cualquier orden.',
        en: cap1(ctx.en.agent) + ' makes n = ' + n + ' ' + ctx.en.n + '. p = ' + p.toFixed(2) + '. Calculate P(X = ' + r + '), the probability of exactly r = ' + r + ' sales, in any order.'
      }) + '</div>' +
      '<div class="gw-mini">' + L({es:'Llena las tres piezas de la fórmula y después toca Verificar. La casilla de resultado se revela solo cuando las tres piezas sean correctas.', en:'Fill in the three pieces of the formula, then tap Check. The result cell is revealed only once all three pieces are correct.'}) + '</div>' +
      '<div class="pmf-grid">' +
        '<div class="pmf-cell"><div class="pmf-lbl">' + L({es:'Combinaciones',en:'Combinations'}) + '</div><div class="pmf-expr">C(' + n + ', ' + r + ')</div><input class="pmf-inp" id="pmfC" type="text" inputmode="numeric" value="' + st.v1 + '"></div>' +
        '<div class="pmf-cell"><div class="pmf-lbl">p<sup>r</sup></div><div class="pmf-expr">' + p.toFixed(2) + '<sup>' + r + '</sup></div><input class="pmf-inp" id="pmfP" type="text" inputmode="decimal" value="' + st.v2 + '"></div>' +
        '<div class="pmf-cell"><div class="pmf-lbl">(1 − p)<sup>n−r</sup></div><div class="pmf-expr">' + q.toFixed(2) + '<sup>' + (n - r) + '</sup></div><input class="pmf-inp" id="pmfQ" type="text" inputmode="decimal" value="' + st.v3 + '"></div>' +
      '</div>' +
      '<div class="pmf-final"><strong>P(X = ' + r + ') =</strong>&nbsp; C(' + n + ',' + r + ') × p<sup>' + r + '</sup> × (1−p)<sup>' + (n-r) + '</sup> =&nbsp; <span id="pmfOut" style="font-family:\'IBM Plex Mono\',monospace;font-weight:700">' + (st.verified ? fmtP(finalVal) : '—') + '</span></div>' +
      '<button class="verify-btn" id="pmfVfy">' + L({es:'Verificar',en:'Check'}) + '</button>' +
      '<div class="iw-fb"></div>';

    if (st.verified) { host.querySelectorAll('.pmf-inp').forEach(function(el){ el.disabled = true; }); host.querySelector('#pmfVfy').disabled = true; }

    host.querySelector('#pmfC').oninput = function() { st.v1 = this.value; };
    host.querySelector('#pmfP').oninput = function() { st.v2 = this.value; };
    host.querySelector('#pmfQ').oninput = function() { st.v3 = this.value; };

    host.querySelector('#pmfVfy').onclick = function() {
      var a = parseInt(st.v1);
      var b = parseFloat((st.v2 || '').replace(',', '.'));
      var c = parseFloat((st.v3 || '').replace(',', '.'));
      var okA = (a === cCorrect);
      var okB = !isNaN(b) && Math.abs(b - pr) < 0.0006;
      var okC = !isNaN(c) && Math.abs(c - qnr) < 0.0006;
      var cA = document.getElementById('pmfC'), cB = document.getElementById('pmfP'), cC = document.getElementById('pmfQ');
      cA.classList.toggle('pmf-ok', okA); cA.classList.toggle('pmf-bad', !okA);
      cB.classList.toggle('pmf-ok', okB); cB.classList.toggle('pmf-bad', !okB);
      cC.classList.toggle('pmf-ok', okC); cC.classList.toggle('pmf-bad', !okC);
      if (okA && okB && okC) {
        st.verified = true;
        document.getElementById('pmfOut').textContent = fmtP(finalVal);
        say(host, 'good', '✓ ' + L({
          es: 'Correcto. P(X = ' + r + ') = ' + cCorrect + ' × ' + fmtP(pr) + ' × ' + fmtP(qnr) + ' = ' + fmtP(finalVal) + '. El primer factor cuenta CUÁNTOS órdenes tienen ' + r + ' ventas; los otros dos dan la probabilidad de CADA UNO de esos órdenes - por eso se multiplican.',
          en: 'Correct. P(X = ' + r + ') = ' + cCorrect + ' × ' + fmtP(pr) + ' × ' + fmtP(qnr) + ' = ' + fmtP(finalVal) + '. The first factor counts HOW MANY orders have ' + r + ' sales; the other two give the probability of EACH of those orders - which is why they are multiplied.'
        }));
        host.querySelectorAll('.pmf-inp').forEach(function(el) { el.disabled = true; });
        host.querySelector('#pmfVfy').disabled = true;
      } else {
        st.tries++;
        if (st.tries >= 3) {
          st.verified = true;
          document.getElementById('pmfC').value = cCorrect;
          document.getElementById('pmfP').value = fmtP(pr);
          document.getElementById('pmfQ').value = fmtP(qnr);
          document.getElementById('pmfOut').textContent = fmtP(finalVal);
          cA.classList.add('pmf-ok'); cA.classList.remove('pmf-bad');
          cB.classList.add('pmf-ok'); cB.classList.remove('pmf-bad');
          cC.classList.add('pmf-ok'); cC.classList.remove('pmf-bad');
          say(host, 'warm', L({
            es: 'C(' + n + ',' + r + ') = ' + cCorrect + ', p<sup>' + r + '</sup> = ' + fmtP(pr) + ', (1−p)<sup>' + (n-r) + '</sup> = ' + fmtP(qnr) + '. El resultado es su producto: ' + fmtP(finalVal) + '.',
            en: 'C(' + n + ',' + r + ') = ' + cCorrect + ', p<sup>' + r + '</sup> = ' + fmtP(pr) + ', (1−p)<sup>' + (n-r) + '</sup> = ' + fmtP(qnr) + '. The result is their product: ' + fmtP(finalVal) + '.'
          }));
          host.querySelectorAll('.pmf-inp').forEach(function(el) { el.disabled = true; });
          host.querySelector('#pmfVfy').disabled = true;
        } else {
          say(host, 'miss', L({es:'Alguna celda en rojo no coincide todavía. Revisa: combinaciones es un entero; las otras dos son potencias de p y (1−p).', en:'A cell in red does not match yet. Check: combinations is an integer; the other two are powers of p and (1−p).'}));
        }
      }
    };
  }
  widgets.push(render); render();
}

/* ════════════════════════════════════════════════════════════════════════
   WIDGET 4 - Cumulative-probability region selector   (Mode B)
   data-widget="cumulative-bars"
   ════════════════════════════════════════════════════════════════════════ */
function wCumulativeBars(rng, host) {
  var n = pick([5, 6, 7], rng);
  var p = pick(P_POOL, rng);
  var ctx = CTX.quality;
  var pmf = []; for (var i = 0; i <= n; i++) pmf.push(binomPMF(n, i, p));
  var OPS = shuffle(['>', '<', '>=', '<='], rng).slice(0, 3);
  var st = { round: 0, tries: 0, done: false, sel: {} };

  function matches(r, op, r0) {
    if (op === '>')  return r >  r0;
    if (op === '<')  return r <  r0;
    if (op === '>=') return r >= r0;
    return r <= r0;
  }
  function opSymbol(op) { return op === '>=' ? '≥' : (op === '<=' ? '≤' : op); }

  function render() {
    if (st.done) {
      host.innerHTML =
        '<div class="iw-head"><span class="iw-title">' + L({es:'Selector de probabilidad acumulada',en:'Cumulative probability selector'}) + '</span></div>' +
        '<div class="iw-fb good">✓ ' + L({es:'Completaste las tres rondas. Una probabilidad acumulada siempre es la suma de las probabilidades puntuales P(X = r) que cumplen la desigualdad.',en:'You completed all three rounds. A cumulative probability is always the sum of the individual P(X = r) values that satisfy the inequality.'}) + '</div>';
      return;
    }
    var op = OPS[st.round];
    var r0 = rngInt(rng, 1, n - 1);
    var key = st.round + '_' + op + '_' + r0;
    if (!st.sel[key]) st.sel[key] = {};
    var sel = st.sel[key];

    var cvId = 'cbCanvas_' + Math.random().toString(36).slice(2, 7);
    host.innerHTML =
      '<div class="iw-head"><span class="iw-tag">' + L({es:'Ronda',en:'Round'}) + ' ' + (st.round + 1) + '/3</span>' +
      '<span class="iw-title">' + L({es:'Selector de probabilidad acumulada',en:'Cumulative probability selector'}) + '</span></div>' +
      '<div class="iw-sub">' + L({
        es: 'Un inspector revisa n = ' + n + ' ' + ctx.es.n + '; p = ' + p.toFixed(2) + ' de que ' + ctx.es.succ + '. X = número de unidades defectuosas.',
        en: 'An inspector checks n = ' + n + ' ' + ctx.en.n + '; p = ' + p.toFixed(2) + ' that ' + ctx.en.succ + '. X = number of defective units.'
      }) + '</div>' +
      '<div class="cb-prompt">' + L({es:'Toca las barras que forman <strong>P(X ' + opSymbol(op) + ' ' + r0 + ')</strong>.', en:'Tap the bars that make up <strong>P(X ' + opSymbol(op) + ' ' + r0 + ')</strong>.'}) + '</div>' +
      '<canvas id="' + cvId + '" class="iw-canvas" style="height:190px"></canvas>' +
      '<div class="cb-sumrow"><span>' + L({es:'Barras seleccionadas:',en:'Selected bars:'}) + ' <span class="cb-sv" id="cbCount">0</span></span>' +
      '<span>' + L({es:'Suma seleccionada:',en:'Selected sum:'}) + ' <span class="cb-sv" id="cbSum">0.0000</span></span></div>' +
      '<button class="verify-btn" id="cbVfy">' + L({es:'Verificar',en:'Check'}) + '</button>' +
      '<div class="iw-fb"></div>';

    var cv = document.getElementById(cvId);
    var bars = [];

    function draw() {
      var g = fitCanvas(cv, 190);
      var ctx2 = g.ctx, W = g.w, H = g.h;
      var ox = 30, oy = H - 26, tp = 14, rp = 8;
      var maxP = Math.max.apply(null, pmf) * 1.18;
      var bw = (W - ox - rp) / (n + 1);
      bars = [];
      for (var r = 0; r <= n; r++) {
        var bh = (pmf[r] / maxP) * (oy - tp);
        var bx = ox + r * bw + bw * 0.12;
        var bwid = bw * 0.76;
        var by = oy - bh;
        bars.push({ r: r, x: bx, y: by, w: bwid, h: bh });
        ctx2.fillStyle = sel[r] ? cssv('--green') : cssv('--surface2');
        ctx2.strokeStyle = cssv('--border'); ctx2.lineWidth = 1;
        ctx2.fillRect(bx, by, bwid, bh);
        ctx2.strokeRect(bx, by, bwid, bh);
        ctx2.fillStyle = cssv('--text3'); ctx2.font = '10px IBM Plex Sans,sans-serif'; ctx2.textAlign = 'center';
        ctx2.fillText(String(r), bx + bwid / 2, oy + 13);
      }
      ctx2.strokeStyle = cssv('--border'); ctx2.beginPath(); ctx2.moveTo(ox, tp); ctx2.lineTo(ox, oy); ctx2.lineTo(W - rp, oy); ctx2.stroke();
      ctx2.fillStyle = cssv('--text3'); ctx2.font = '10px IBM Plex Sans,sans-serif'; ctx2.textAlign = 'center';
      ctx2.fillText('r', W - rp - 4, oy + 13);
    }

    function updateSum() {
      var count = 0, sum = 0;
      Object.keys(sel).forEach(function(k) { if (sel[k]) { count++; sum += pmf[parseInt(k)]; } });
      var elC = document.getElementById('cbCount'), elS = document.getElementById('cbSum');
      if (elC) elC.textContent = String(count);
      if (elS) elS.textContent = fmtP(sum);
    }

    cv.addEventListener('click', function(e) {
      if (st.tries >= 3 && host.querySelector('#cbVfy').disabled) return;
      var rect = cv.getBoundingClientRect();
      var mx = e.clientX - rect.left, my = e.clientY - rect.top;
      bars.forEach(function(b) {
        if (mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h + 6) {
          sel[b.r] = !sel[b.r];
        }
      });
      draw(); updateSum();
    });

    setTimeout(function() { draw(); updateSum(); }, 60);
    widgets.push(function() { if (document.getElementById(cvId)) { draw(); updateSum(); } });

    document.getElementById('cbVfy').onclick = function() {
      var correctSet = {};
      for (var r = 0; r <= n; r++) if (matches(r, op, r0)) correctSet[r] = true;
      var ok = true;
      for (var r2 = 0; r2 <= n; r2++) {
        var picked = !!sel[r2], should = !!correctSet[r2];
        if (picked !== should) ok = false;
      }
      if (ok) {
        st.done = st.round >= 2;
        var sum = 0; Object.keys(correctSet).forEach(function(k) { sum += pmf[parseInt(k)]; });
        say(host, 'good', '✓ ' + L({
          es: 'Correcto. P(X ' + opSymbol(op) + ' ' + r0 + ') = ' + fmtP(sum) + ', la suma de P(X = r) para cada r que cumple la desigualdad.',
          en: 'Correct. P(X ' + opSymbol(op) + ' ' + r0 + ') = ' + fmtP(sum) + ', the sum of P(X = r) for every r that satisfies the inequality.'
        }));
        document.getElementById('cbVfy').disabled = true;
        st.round++;
        setTimeout(function() { if (st.round >= 3) st.done = true; render(); }, 2200);
      } else {
        st.tries++;
        if (st.tries >= 3) {
          Object.keys(correctSet).forEach(function(k) { sel[k] = true; });
          Object.keys(sel).forEach(function(k) { if (!correctSet[k]) sel[k] = false; });
          draw(); updateSum();
          var sum2 = 0; Object.keys(correctSet).forEach(function(k) { sum2 += pmf[parseInt(k)]; });
          say(host, 'warm', L({
            es: 'Las barras correctas son r ' + opSymbol(op) + ' ' + r0 + '. P(X ' + opSymbol(op) + ' ' + r0 + ') = ' + fmtP(sum2) + '.',
            en: 'The correct bars are r ' + opSymbol(op) + ' ' + r0 + '. P(X ' + opSymbol(op) + ' ' + r0 + ') = ' + fmtP(sum2) + '.'
          }));
          document.getElementById('cbVfy').disabled = true;
          st.round++;
          setTimeout(function() { if (st.round >= 3) st.done = true; render(); }, 2400);
        } else {
          say(host, 'miss', L({
            es: 'Tu selección no coincide todavía. Revisa si r = ' + r0 + ' mismo debe incluirse (según si el símbolo es ' + opSymbol(op) + ') o quedar fuera.',
            en: 'Your selection does not match yet. Check whether r = ' + r0 + ' itself should be included (based on the ' + opSymbol(op) + ' symbol) or left out.'
          }));
        }
      }
    };
  }
  widgets.push(render); render();
}

/* ════════════════════════════════════════════════════════════════════════
   WIDGET 5 - Binomial shape explorer   (Mode A - pure exploration)
   data-widget="shape-explorer"
   ════════════════════════════════════════════════════════════════════════ */
function wShapeExplorer(rng, host) {
  var st = { n: pick([6, 8, 10], rng), p: pick(P_POOL, rng) };

  function render() {
    var cvId = 'seCanvas_' + Math.random().toString(36).slice(2, 7);
    host.innerHTML =
      '<div class="iw-head"><span class="iw-tag">' + L({es:'Exploración',en:'Exploration'}) + '</span>' +
      '<span class="iw-title">' + L({es:'Explorador de forma',en:'Shape explorer'}) + '</span></div>' +
      '<div class="iw-sub">' + L({es:'Desliza n y p y observa cómo cambian la forma de la distribución, la media (μ) y la varianza (σ²). No hay una única respuesta correcta aquí - es para desarrollar intuición.', en:'Slide n and p and watch how the shape of the distribution, the mean (μ) and the variance (σ²) change. There is no single correct answer here - this is for building intuition.'}) + '</div>' +
      '<div class="cgrid">' +
        '<div class="cg"><label>n = <span class="cval" id="seNVal">' + st.n + '</span></label>' +
        '<input type="range" id="seN" min="3" max="15" step="1" value="' + st.n + '"></div>' +
        '<div class="cg"><label>p = <span class="cval" id="sePVal">' + st.p.toFixed(2) + '</span></label>' +
        '<input type="range" id="seP" min="0.05" max="0.95" step="0.05" value="' + st.p + '"></div>' +
      '</div>' +
      '<canvas id="' + cvId + '" class="iw-canvas" style="height:190px"></canvas>' +
      '<div class="se-metrics">' +
        '<div class="metric"><div class="mlbl" style="text-transform:none">μ = n·p</div><div class="mnum cs" id="seMu">—</div></div>' +
        '<div class="metric"><div class="mlbl" style="text-transform:none">σ<sup>2</sup> = n·p·(1−p)</div><div class="mnum ps" id="seVar">—</div></div>' +
        '<div class="metric"><div class="mlbl" style="text-transform:none">σ (SD)</div><div class="mnum ts" id="seSd">—</div></div>' +
      '</div>';

    var cv = document.getElementById(cvId);
    function draw() {
      var n = st.n, p = st.p;
      var pmf = []; for (var i = 0; i <= n; i++) pmf.push(binomPMF(n, i, p));
      var g = fitCanvas(cv, 190);
      var ctx2 = g.ctx, W = g.w, H = g.h;
      var ox = 30, oy = H - 26, tp = 14, rp = 8;
      var maxP = Math.max.apply(null, pmf) * 1.18;
      var bw = (W - ox - rp) / (n + 1);
      var mu = n * p;
      for (var r = 0; r <= n; r++) {
        var bh = (pmf[r] / maxP) * (oy - tp);
        var bx = ox + r * bw + bw * 0.12, bwid = bw * 0.76, by = oy - bh;
        ctx2.fillStyle = cssv('--green'); ctx2.fillRect(bx, by, bwid, bh);
        ctx2.strokeStyle = cssv('--border'); ctx2.lineWidth = 1; ctx2.strokeRect(bx, by, bwid, bh);
        ctx2.fillStyle = cssv('--text3'); ctx2.font = '9px IBM Plex Sans,sans-serif'; ctx2.textAlign = 'center';
        ctx2.fillText(String(r), bx + bwid / 2, oy + 13);
      }
      ctx2.strokeStyle = cssv('--border'); ctx2.beginPath(); ctx2.moveTo(ox, tp); ctx2.lineTo(ox, oy); ctx2.lineTo(W - rp, oy); ctx2.stroke();
      /* mean marker */
      var mx = ox + (mu + 0.5) * bw;
      ctx2.strokeStyle = cssv('--gold'); ctx2.lineWidth = 2;
      ctx2.beginPath(); ctx2.moveTo(mx, tp); ctx2.lineTo(mx, oy); ctx2.stroke();
      ctx2.fillStyle = cssv('--gold'); ctx2.font = '9px IBM Plex Sans,sans-serif'; ctx2.textAlign = 'center';
      ctx2.fillText('μ', mx, tp - 3);
    }

    function updateMetrics() {
      var n = st.n, p = st.p;
      var mu = n * p, va = n * p * (1 - p), sd = Math.sqrt(va);
      document.getElementById('seMu').textContent = mu.toFixed(2);
      document.getElementById('seVar').textContent = va.toFixed(3);
      document.getElementById('seSd').textContent = sd.toFixed(3);
    }

    document.getElementById('seN').oninput = function() {
      st.n = parseInt(this.value);
      document.getElementById('seNVal').textContent = st.n;
      draw(); updateMetrics();
    };
    document.getElementById('seP').oninput = function() {
      st.p = parseFloat(this.value);
      document.getElementById('sePVal').textContent = st.p.toFixed(2);
      draw(); updateMetrics();
    };

    setTimeout(function() { draw(); updateMetrics(); }, 60);
    widgets.push(function() { if (document.getElementById(cvId)) { draw(); updateMetrics(); } });
  }
  render();
}

/* ════════════════════════════════════════════════════════════════════════
   buildLesson(rng)
   ════════════════════════════════════════════════════════════════════════ */
function buildLesson(rng) {
  /*
   * CONCEPT ARC
   * topic        : Distribución Binomial - de un orden exacto a la media y la varianza
   * prerequisite : Regla de multiplicación para eventos independientes; lectura de probabilidades entre 0 y 1.
   * sequence     : 1. Probabilidad de UN orden exacto de éxitos/fracasos en n ensayos independientes (p^r · q^(n-r), sin conteo).
   *                2. Conteo: cuántos órdenes distintos producen el mismo número r de éxitos - combinaciones C(n,r).
   *                3. Fusionar conteo × probabilidad de un orden → fórmula binomial P(X=r) = C(n,r)·p^r·q^(n-r).
   *                4. Probabilidades acumuladas P(X>r), P(X<r), P(X≥r), P(X≤r) como sumas de P(X=r).
   *                5. Media μ=np y varianza σ²=np(1-p) como resúmenes compactos de toda la distribución.
   * why_this_order: Cada paso resuelve la carencia que dejó el anterior: primero se ancla en un solo orden
   *                concreto (sin conteo), luego surge la necesidad de contar cuando varios órdenes comparten
   *                probabilidad, después se funden conteo y probabilidad en la fórmula puntual, esa fórmula
   *                se extiende a rangos mediante suma, y finalmente, una vez que sumar se vuelve repetitivo,
   *                se comprime toda la distribución en dos números de resumen.
   */

  /* Running worked-example numbers, generated once from rng() and threaded
     through concept sections 1-4 so the narrative stays continuous while the
     figures stay seeded (never hardcoded) per attempt. */
  var exN = pick([4, 5], rng);
  var exP = pick(P_POOL, rng), exQ = 1 - exP;
  var exPattern = [];

      : ['El Escenario B tiene mayor probabilidad.', 'El Escenario A tiene mayor probabilidad.', 'Ambos escenarios tienen la misma probabilidad.', 'No se puede determinar sin más datos.'];
    var rawEn = aIsBigger
      ? ['Scenario A has the higher probability.', 'Scenario B has the higher probability.', 'Both scenarios have the same probability.', 'It cannot be determined without more data.']
      : ['Scenario B has the higher probability.', 'Scenario A has the higher probability.', 'Both scenarios have the same probability.', 'It cannot be determined without more data.'];
    var shuffled = shuffleOpts(rawEs, rawEn, rng);
    var qEs = 'Escenario A: n = ' + nA + ' ' + ctxA.es.n + ', p = ' + pA.toFixed(2) + ' de que ' + ctxA.es.succ + '. Escenario B: n = ' + nB + ' ' + ctxB.es.n + ', p = ' + pB.toFixed(2) + ' de que ' + ctxB.es.succ + '. ¿En cuál escenario es mayor la probabilidad de que ocurra AL MENOS un éxito?';
    var qEn = 'Scenario A: n = ' + nA + ' ' + ctxA.en.n + ', p = ' + pA.toFixed(2) + ' that ' + ctxA.en.succ + '. Scenario B: n = ' + nB + ' ' + ctxB.en.n + ', p = ' + pB.toFixed(2) + ' that ' + ctxB.en.succ + '. In which scenario is the probability of AT LEAST one success higher?';
    var expEs = 'P(X ≥ 1) = 1 − P(X = 0) = 1 − (1−p)<sup>n</sup>. Escenario A: 1 − ' + (1-pA).toFixed(2) + '<sup>' + nA + '</sup> = ' + fmtP(pAatLeast1) + '. Escenario B: 1 − ' + (1-pB).toFixed(2) + '<sup>' + nB + '</sup> = ' + fmtP(pBatLeast1) + '. El complemento evita sumar n términos.';
    var expEn = 'P(X ≥ 1) = 1 − P(X = 0) = 1 − (1−p)<sup>n</sup>. Scenario A: 1 − ' + (1-pA).toFixed(2) + '<sup>' + nA + '</sup> = ' + fmtP(pAatLeast1) + '. Scenario B: 1 − ' + (1-pB).toFixed(2) + '<sup>' + nB + '</sup> = ' + fmtP(pBatLeast1) + '. The complement avoids adding n terms.';
    var probObj = {
      title: L({es:'Compara dos escenarios', en:'Compare two scenarios'}),
      questionText: L({es:qEs,en:qEn}), options: shuffled.es, correctIdx: shuffled.correctIdx,
      hint: L({es:'Usa el complemento: P(X ≥ 1) = 1 − P(X = 0) = 1 − (1−p)<sup>n</sup>, en lugar de sumar todos los términos.', en:'Use the complement: P(X ≥ 1) = 1 − P(X = 0) = 1 − (1−p)<sup>n</sup>, instead of adding every term.'}),
      explanation: L({es:expEs,en:expEn}), showWork:true, fn:'A: n=' + nA + ', p=' + pA.toFixed(2) + ' · B: n=' + nB + ', p=' + pB.toFixed(2),
      studentChoice:null, pendingChoice:null,
      i18n:{ title:{es:'Compara dos escenarios', en:'Compare two scenarios'}, q:{es:qEs,en:qEn},
        hint:{es:'Usa el complemento: P(X ≥ 1) = 1 − P(X = 0) = 1 − (1−p)<sup>n</sup>, en lugar de sumar todos los términos.', en:'Use the complement: P(X ≥ 1) = 1 − P(X = 0) = 1 − (1−p)<sup>n</sup>, instead of adding every term.'},
        exp:{es:expEs,en:expEn}, opts:{es:shuffled.es, en:shuffled.en} }
    };
    problems.push(probObj); buildOneCard(problems[problems.length-1], problems.length-1);
  })();

  /* Problem 9 - apply full PMF to a new context */
  (function() {
    var ctx = pick([CTX.loan, CTX.quality], rng);
    var n = pick([6,7,8], rng);
    var p = pick(P_POOL, rng), q = 1-p;
    var r = rngInt(rng, 0, n);
    var correct = binomPMF(n,r,p);
    var wrongRow = binomPMF(n, Math.max(0, r-1), p);
    var wrongNoC = Math.pow(p,r) * Math.pow(q, n-r);
    var wrongPerm = 1; for (var k=0;k<r;k++) wrongPerm *= (n-k); wrongPerm = wrongPerm * Math.pow(p,r) * Math.pow(q, n-r);
    var opts = uniqueProbOptions(correct, [wrongRow, wrongNoC, wrongPerm]);
    var rawEs = opts.map(function(v){return fmtP(parseFloat(v));}), rawEn = rawEs.slice();
    var shuffled = shuffleOpts(rawEs, rawEn, rng);
    var qEs = cap1(ctx.es.agent) + ' trabaja con n = ' + n + ' ' + ctx.es.n + '; p = ' + p.toFixed(2) + ' de que ' + ctx.es.succ + '. Calcula P(X = ' + r + ').';
    var qEn = cap1(ctx.en.agent) + ' works with n = ' + n + ' ' + ctx.en.n + '; p = ' + p.toFixed(2) + ' that ' + ctx.en.succ + '. Calculate P(X = ' + r + ').';
    var expEs = 'P(X = ' + r + ') = C(' + n + ',' + r + ') · ' + p.toFixed(2) + '<sup>' + r + '</sup> · ' + q.toFixed(2) + '<sup>' + (n-r) + '</sup> = ' + fmtP(correct) + '.';
    var expEn = expEs;
    var probObj = {
      title: L({es:'Aplica la fórmula completa', en:'Apply the full formula'}),
      questionText: L({es:qEs,en:qEn}), options: shuffled.es, correctIdx: shuffled.correctIdx,
      hint: L({es:'C(n,r) cuenta los órdenes; p<sup>r</sup>(1−p)<sup>n−r</sup> da la probabilidad de cada uno. Multiplica los tres factores.', en:'C(n,r) counts the orders; p<sup>r</sup>(1−p)<sup>n−r</sup> gives the probability of each one. Multiply the three factors.'}),
      explanation: L({es:expEs,en:expEn}), showWork:true, fn:'n=' + n + ', p=' + p.toFixed(2) + ', r=' + r,
      studentChoice:null, pendingChoice:null,
      i18n:{ title:{es:'Aplica la fórmula completa', en:'Apply the full formula'}, q:{es:qEs,en:qEn},
        hint:{es:'C(n,r) cuenta los órdenes; p<sup>r</sup>(1−p)<sup>n−r</sup> da la probabilidad de cada uno. Multiplica los tres factores.', en:'C(n,r) counts the orders; p<sup>r</sup>(1−p)<sup>n−r</sup> gives the probability of each one. Multiply the three factors.'},
        exp:{es:expEs,en:expEn}, opts:{es:shuffled.es, en:shuffled.en} }
    };
    problems.push(probObj); buildOneCard(problems[problems.length-1], problems.length-1);
  })();

  /* Problem 10 - cumulative probability computed from scratch */
  (function() {
    var ctx = pick([CTX.email, CTX.survey], rng);
    var n = pick([4,5], rng);
    var p = pick(P_POOL, rng);
    var r0 = rngInt(rng, 0, n-2);
    var op = pick(['<=', '<'], rng);
    var pmf = []; for (var i=0;i<=n;i++) pmf.push(binomPMF(n,i,p));
    var correct = 0;
    for (var r=0;r<=n;r++) { if (op==='<=' ? r<=r0 : r<r0) correct += pmf[r]; }
    var complementWrong = 1 - correct;
    var offByOne = 0;
    for (var r2=0;r2<=n;r2++) { if (op==='<=' ? r2<r0 : r2<=r0) offByOne += pmf[r2]; }
    var singleTerm = pmf[r0];
    var opts = uniqueProbOptions(correct, [complementWrong, offByOne, singleTerm]);
    var rawEs = opts.map(function(v){return fmtP(parseFloat(v));}), rawEn = rawEs.slice();
    var shuffled = shuffleOpts(rawEs, rawEn, rng);
    var opSym = op === '<=' ? '≤' : '<';
    var opWordEs = op === '<=' ? 'a lo más' : 'menos de';
    var opWordEn = op === '<=' ? 'at most' : 'fewer than';
    var qEs = cap1(ctx.es.agent) + ' trabaja con n = ' + n + ' ' + ctx.es.n + '; p = ' + p.toFixed(2) + ' de que ' + ctx.es.succ + '. Calcula P(X ' + opSym + ' ' + r0 + ') - la probabilidad de ' + opWordEs + ' ' + r0 + ' éxitos - calculando primero cada P(X=r) necesaria.';
    var qEn = cap1(ctx.en.agent) + ' works with n = ' + n + ' ' + ctx.en.n + '; p = ' + p.toFixed(2) + ' that ' + ctx.en.succ + '. Calculate P(X ' + opSym + ' ' + r0 + ') - the probability of ' + opWordEn + ' ' + r0 + ' successes - by first computing each needed P(X=r).';
    var expEs = 'P(X ' + opSym + ' ' + r0 + ') = ' + fmtP(correct) + ', sumando cada P(X=r) para los valores de r que cumplen r ' + opSym + ' ' + r0 + '.';
    var expEn = 'P(X ' + opSym + ' ' + r0 + ') = ' + fmtP(correct) + ', by adding each P(X=r) for the values of r that satisfy r ' + opSym + ' ' + r0 + '.';
    var probObj = {
      title: L({es:'Acumulada desde cero', en:'Cumulative from scratch'}),
      questionText: L({es:qEs,en:qEn}), options: shuffled.es, correctIdx: shuffled.correctIdx,
      hint: L({es:'Calcula P(X=r) con la fórmula binomial para cada r que cumpla la desigualdad, y súmalas.', en:'Compute P(X=r) with the binomial formula for each r that satisfies the inequality, then add them.'}),
      explanation: L({es:expEs,en:expEn}), showWork:true, fn:'n=' + n + ', p=' + p.toFixed(2),
      studentChoice:null, pendingChoice:null,
      i18n:{ title:{es:'Acumulada desde cero', en:'Cumulative from scratch'}, q:{es:qEs,en:qEn},
        hint:{es:'Calcula P(X=r) con la fórmula binomial para cada r que cumpla la desigualdad, y súmalas.', en:'Compute P(X=r) with the binomial formula for each r that satisfies the inequality, then add them.'},
        exp:{es:expEs,en:expEn}, opts:{es:shuffled.es, en:shuffled.en} }
    };
    problems.push(probObj); buildOneCard(problems[problems.length-1], problems.length-1);
  })();
}
