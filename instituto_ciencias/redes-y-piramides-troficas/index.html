<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redes y Pirámides Tróficas</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Redes y Pirámides Tróficas</div>
    <div class="wcourse" id="wcourse-el">Biología · 1° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Redes y Pirámides Tróficas</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="sbtn" id="dlBtn" onclick="generatePDF()" style="max-width:280px;margin:0 auto;">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   CENTRALIZED SCHOOL CONFIG (Rule 16) — ships UNBRANDED (Rule 11).
   The ONLY rebranding point. build_all.py substitutes these exact fields
   (BRAND_FIELDS / RGB_FIELDS / logo*) downstream; :root/dark stay as fallback.
   Neutral defaults below == the static :root/dark values, so unbranded == no-op.
   ══════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:'#cc243c', primaryDark:'#480b14', primaryBg:'#f6e7e9',
  accent:'#fc0c24', accentBg:'#ffdbdf',
  darkPrimary:'#c74255', darkPrimaryDark:'#e87283', darkPrimaryBg:'#3b0b12',

  if (!saved) return;
  document.getElementById('restoreBar').style.display = 'none';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = currentAttempt(name, group);
  buildLesson(seededRng(name + group + att));
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
  saved.choices.forEach(function(choice, idx) {

      saved.texts.forEach(function(text, i) {

        if (ta) ta.value = text;
      });

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

      doc.rect(M,sy,TW,8,'F'); doc.text('RESUMEN DE PROBLEMAS (continuación)', M+4, sy+6);
      sy += 12;
    }
    var ok = document.getElementById('pc'+i).classList.contains('ok');
    doc.setFillColor(ok?232:255, ok?240:232, ok?232:228);
    doc.roundedRect(M,sy,TW,10,2,2,'F');
    doc.setFillColor(ok?26:176, ok?106:48, ok?74:16);
    doc.circle(M+6, sy+5, 2.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(7); doc.setFont('helvetica','bold');
    doc.text(ok?'✓':'✗', M+4.5, sy+6.5);
    doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('helvetica','normal');
    doc.text('Problema '+(i+1)+': '+pdfText(prob.title), M+12, sy+6.5);
    doc.setTextColor(ok?26:176, ok?106:48, ok?74:16);
    doc.text(ok?'Correcto':'Incorrecto', PW-M-24, sy+6.5);
    sy += 12;
  });

  // ── Per-problem pages ──
  for (var i = 0; i < problems.length; i++) {
    var prob = problems[i];
    doc.addPage();
    var wy = 0;

    doc.setFillColor(pBR,pBG,pBB); doc.rect(0,0,PW,20,'F');
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,3,'F');
    doc.setTextColor(pAR,pAG,pAB); doc.setFontSize(7); doc.setFont('helvetica','normal');
    doc.text(t('wcourse')+'  ·  '+t('wtitle'), M, 10);
    doc.setTextColor(232,238,247); doc.setFontSize(10.5); doc.setFont('helvetica','bold');
    doc.text('Problema '+(i+1)+' de '+total+'  ·  '+pdfText(prob.title), M, 17);
    wy = 25;

    var qRaw = pdfText(prob.questionText);
    doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var qLines = doc.splitTextToSize(qRaw, TW-10);
    var qBoxH  = 8 + qLines.length*5 + 3;
    doc.setFillColor(237,240,245); doc.roundedRect(M,wy,TW,qBoxH,2,2,'F');
    doc.setTextColor(pBR,pBG,pBB); doc.setFontSize(6.5); doc.setFont('helvetica','bold');
    doc.text('PREGUNTA', M+4, wy+6);
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var qy = wy+12;
    qLines.forEach(function(ln,li){ doc.text(ln, M+4, qy+li*5); });
    wy += qBoxH + 4;

    var isOk   = document.getElementById('pc'+i).classList.contains('ok');
    var chosen = prob.studentChoice != null ? pdfText(prob.options[prob.studentChoice]||'-') : '-';
    var corr   = pdfText(prob.options[prob.correctIdx]||'');
    var expRaw = pdfText(prob.explanation||'');
    doc.setFontSize(8.5); var chLines = doc.splitTextToSize('Alumno: '+chosen, TW-18);
    doc.setFontSize(8);   var coLines = doc.splitTextToSize('Correcto: '+corr, TW-18);
    doc.setFontSize(7.5); var exLines = doc.splitTextToSize('Solución: '+expRaw, TW-18).slice(0,4);
    var ansBoxH = 8 + chLines.length*5.5 + coLines.length*5 + exLines.length*5 + 6;
    doc.setFillColor(isOk?232:255, isOk?240:232, isOk?232:228);
    doc.roundedRect(M,wy,TW,ansBoxH,2,2,'F');
    doc.setFillColor(isOk?26:176, isOk?106:48, isOk?74:16);
    doc.circle(M+7, wy+8, 3.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(9); doc.setFont('helvetica','bold');
    doc.text(isOk?'✓':'✗', M+5.2, wy+10.5);
    var ay = wy+7;
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','bold');
    chLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5.5); });
    ay += chLines.length*5.5 + 3;
    doc.setTextColor(26,106,74); doc.setFontSize(8); doc.setFont('helvetica','normal');
    coLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    ay += coLines.length*5 + 3;
    doc.setTextColor(90,85,80); doc.setFontSize(7.5);
    exLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    wy += ansBoxH + 5;

    doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
    doc.setFontSize(7); doc.setFont('helvetica','bold');
    doc.rect(M,wy,TW,8,'F'); doc.text('TRABAJO DEL ALUMNO', M+4, wy+5.5);
    wy += 11;

    var dc = document.getElementById('dc'+i);
    if (dc) {
      try {
        var imgD = dc.toDataURL('image/png');
        var ar   = dc.height / dc.width;
        var iw   = TW;
        var ih   = Math.min(iw * ar, 68);
        doc.addImage(imgD, 'PNG', M, wy, iw, ih);
        wy += ih + 4;
      } catch(e) {}
    }

    var ta = document.getElementById('ta'+i);
    if (ta && ta.value.trim()) {
      if (wy > PH-30) { doc.addPage(); wy = 20; }
      doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('courier','normal');
      var taLines = doc.splitTextToSize(ta.value, TW);
      taLines.slice(0,16).forEach(function(ln) {
        if (wy > PH-15) { doc.addPage(); wy = 20; }
        doc.text(ln, M, wy); wy += 5;
      });
      wy += 2;
    }

    var pp = document.getElementById('pp'+i);
    if (pp && pp.src && pp.src.indexOf('data:') === 0) {
      if (wy > PH-55) { doc.addPage(); wy = 20; }
      try { doc.addImage(pp.src, 'JPEG', M, wy, TW, 68); wy += 72; } catch(e) {}
    }
  }

  // ── Footer on every page ──
  var pages = doc.internal.getNumberOfPages();
  for (var p = 1; p <= pages; p++) {
    doc.setPage(p);
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0, PH-3, PW, 3, 'F');
    doc.setTextColor(130,140,160); doc.setFontSize(6.5); doc.setFont('helvetica','normal');
    doc.text(name+'  ·  '+group+'  ·  Código: '+code+'  ·  Página '+p+'/'+pages,
      PW/2, PH-5, {align:'center'});
  }

  doc.save('bio1_t07_g01_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf');
  btn.innerHTML = '⬇ &nbsp;Descargar Resultados PDF';
  btn.disabled  = false;
}

   interdependencia la sostienen, por qué la energía se reparte en forma de
   pirámide y qué se puede predecir cuando un eslabón se pierde o aumenta.

function L(o){ return (o && o[LANG] !== undefined) ? o[LANG] : (o ? o.es : ''); }
function ri(rng, a, b){ return a + Math.floor(rng() * (b - a + 1)); }
function pk(rng, a){ return a[Math.floor(rng() * a.length)]; }

function say(host, cls, msg){
  var e = host.querySelector('.gw-fb');
  if (!e) return;
  e.className = 'gw-fb' + (cls ? ' ' + cls : '');

}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 1 :: arma la cadena
   Cuatro seres vivos revueltos. El alumno los coloca en el orden en que viaja
   la materia y la energía; cada toque responde al momento y la pista dice si
   ese ser vivo va antes o después. Tres rondas con ecosistemas distintos.
   ══════════════════════════════════════════════════════════════════════════ */
function wChain(rng, host){
  var SETS = [
    { lugar:{ es:'la milpa', en:'the cornfield' }, items:[
      { es:'planta de maíz', en:'corn plant' }, { es:'saltamontes', en:'grasshopper' },
      { es:'rana', en:'frog' }, { es:'culebra', en:'snake' } ] },
    { lugar:{ es:'el arroyo', en:'the stream' }, items:[
      { es:'algas', en:'algae' }, { es:'caracol de agua', en:'water snail' },
      { es:'charal', en:'small fish' }, { es:'garza', en:'heron' } ] },
    { lugar:{ es:'la pradera', en:'the grassland' }, items:[
      { es:'pasto', en:'grass' }, { es:'conejo', en:'rabbit' },
      { es:'zorro', en:'fox' }, { es:'águila', en:'eagle' } ] },
    { lugar:{ es:'el encinar', en:'the oak wood' }, items:[
      { es:'hojas de encino', en:'oak leaves' }, { es:'oruga', en:'caterpillar' },
      { es:'pájaro', en:'small bird' }, { es:'gavilán', en:'hawk' } ] },
    { lugar:{ es:'el mar abierto', en:'the open sea' }, items:[
      { es:'fitoplancton', en:'phytoplankton' }, { es:'zooplancton', en:'zooplankton' },
      { es:'sardina', en:'sardine' }, { es:'atún', en:'tuna' } ] }
  ];
  var rounds = shuffle(SETS, rng).slice(0, 3);
  var round = 0, tries = 0, placed = [], pool = [], revealed = false, done = false;

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Arma la cadena', en:'Build the chain' }) + '</div>' +
    '<div class="gw-q" data-r="q"></div>' +
    '<div class="gw-mini">' + L({
      es:'Toca a los seres vivos en el orden en que viajan la materia y la energía. Puedes quitar el último y volver a intentarlo cuantas veces quieras.',
      en:'Tap the living things in the order matter and energy travel. You can remove the last one and try again as often as you like.'
    }) + '</div>' +
    '<div class="chline" data-r="line"></div>' +
    '<div class="pool" data-r="pool"></div>' +
    '<div class="gw-row">' +
      '<button class="gw-btn" data-r="undo">' + L({ es:'Quitar el último', en:'Remove the last one' }) + '</button>' +
      '<button class="gw-btn" data-r="next" style="display:none">' + L({ es:'Siguiente', en:'Next' }) + '</button>' +
    '</div>' +
    '<div class="gw-fb"></div>';

  var elQ = host.querySelector('[data-r="q"]'),
      elL = host.querySelector('[data-r="line"]'),
      elP = host.querySelector('[data-r="pool"]'),
      elU = host.querySelector('[data-r="undo"]'),
      elN = host.querySelector('[data-r="next"]');

  function nm(i){ return L(rounds[round].items[i]); }

  function render(){
    var set = rounds[round];
    elQ.textContent = L({ es:'Cadena ' + (round + 1) + ' de 3: ' + L(set.lugar), en:'Chain ' + (round + 1) + ' of 3: ' + L(set.lugar) });
    var parts = [];
    for (var i = 0; i < placed.length; i++){
      if (i > 0) parts.push('<span class="arw">&#8594;</span>');
      parts.push('<span class="chip ' + (revealed ? 'rev' : 'set') + '">' + nm(placed[i]) + '</span>');
    }
    if (!placed.length) parts.push('<span class="chslot">' + L({ es:'Empieza por quien fabrica su propio alimento', en:'Start with the one that makes its own food' }) + '</span>');
    elL.innerHTML = parts.join(' ');
    var rest = [];
    for (var k = 0; k < pool.length; k++){
      if (placed.indexOf(pool[k]) === -1) rest.push('<button class="chip" data-i="' + pool[k] + '">' + nm(pool[k]) + '</button>');
    }
    elP.innerHTML = rest.join(' ');
    elP.querySelectorAll('.chip').forEach(function(b){
      b.addEventListener('click', function(){ tap(parseInt(b.getAttribute('data-i'), 10)); });
    });
    elU.disabled = (placed.length === 0 || revealed || done);
    elN.style.display = revealed ? 'inline-block' : 'none';
  }

  function newRound(){
    tries = 0; placed = []; revealed = false;
    pool = shuffle([0, 1, 2, 3], rng);
    render();
    say(host, '', L({ es:'Nueva cadena. ¿Quién no come a nadie y arranca el recorrido?', en:'New chain. Which one eats nobody and starts the journey?' }));
  }

  function finishRound(){
    if (round >= 2){
      done = true;
      elU.disabled = true;
      say(host, 'good', L({
        es:'🎉 Las tres cadenas quedaron armadas. En todas, la flecha sale del que es comido y apunta a quien se lo come.',
        en:'🎉 All three chains are built. In every one, the arrow leaves the one that is eaten and points to the one that eats it.'
      }));
      return;
    }
    round++;
    setTimeout(newRound, 900);
  }

  function tap(i){
    if (done || revealed) return;
    var expected = placed.length;
    if (i === expected){
      placed.push(i);
      render();
      if (placed.length === 4){
        say(host, 'good', L({
          es:'🎉 Cadena completa: ' + nm(0) + ' &#8594; ' + nm(1) + ' &#8594; ' + nm(2) + ' &#8594; ' + nm(3) + '.',
          en:'🎉 Chain complete: ' + nm(0) + ' &#8594; ' + nm(1) + ' &#8594; ' + nm(2) + ' &#8594; ' + nm(3) + '.'
        }));
        finishRound();
      } else if (expected === 0){
        say(host, 'good', L({
          es:'Bien: ' + nm(0) + ' arma su propio alimento, así que ahí arranca todo. Sigue con quien se alimenta de él.',
          en:'Good: ' + nm(0) + ' makes its own food, so everything starts there. Carry on with whoever feeds on it.'
        }));
      } else {
        say(host, 'good', L({
          es:'Va bien: ' + nm(expected) + ' recibe la energía de ' + nm(expected - 1) + '. Sigue con quien se lo come.',
          en:'Going well: ' + nm(expected) + ' receives the energy from ' + nm(expected - 1) + '. Carry on with whoever eats it.'
        }));
      }
      return;
    }
    tries++;
    if (tries >= 3){
      revealed = true;
      placed = [0, 1, 2, 3];
      render();
      say(host, 'miss', L({
        es:'Esta era la cadena: ' + nm(0) + ' &#8594; ' + nm(1) + ' &#8594; ' + nm(2) + ' &#8594; ' + nm(3) + '. Fíjate en el tamaño y en qué come cada uno.',
        en:'This was the chain: ' + nm(0) + ' &#8594; ' + nm(1) + ' &#8594; ' + nm(2) + ' &#8594; ' + nm(3) + '. Look at the size and at what each one eats.'
      }));
      return;
    }
    if (i === 0){
      say(host, 'warm', L({
        es:'Ese fabrica su propio alimento con la luz del Sol, así que no puede ir a media cadena.',
        en:'That one makes its own food with sunlight, so it cannot sit in the middle of the chain.'
      }));
    } else if (i > expected){
      say(host, 'warm', L({
        es:'Ese se alimenta de alguien que todavía no está en la cadena. Busca uno más pequeño.',
        en:'That one feeds on somebody who is not in the chain yet. Look for a smaller one.'
      }));
    } else {
      say(host, 'warm', L({
        es:'Ese ya viene antes de donde vas: la flecha no puede regresar.',
        en:'That one comes earlier than where you are: the arrow cannot go back.'
      }));
    }
  }

  elU.addEventListener('click', function(){
    if (revealed || done || !placed.length) return;
    placed.pop();
    render();
    say(host, '', L({ es:'Quitaste el último eslabón. Prueba con otro.', en:'You removed the last link. Try another one.' }));
  });
  elN.addEventListener('click', function(){
    if (!revealed) return;
    if (round >= 2){
      done = true; revealed = false; elN.style.display = 'none'; elU.disabled = true;
      say(host, 'good', L({ es:'Listo. Ya tienes las tres cadenas del recorrido.', en:'Done. You now have the three chains of the route.' }));
      return;
    }
    round++; newRound();
  });

  newRound();
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 2 :: quita una especie de la red
   Ocho poblaciones conectadas por quién come a quién. Al tocar una, se apaga y
   se encienden en rojo las que se quedan sin uno de sus alimentos directos.
   El alumno busca a la que deja sin alimento directo a más poblaciones.
   ══════════════════════════════════════════════════════════════════════════ */
function wWeb(rng, host){
  var WEBS = [
    { lugar:{ es:'la pradera', en:'the grassland' }, nodes:[
      { es:'pasto', en:'grass', eats:[] },
      { es:'arbusto de moras', en:'berry shrub', eats:[] },
      { es:'conejo', en:'rabbit', eats:[0] },
      { es:'ratón de campo', en:'field mouse', eats:[0, 1] },
      { es:'saltamontes', en:'grasshopper', eats:[0] },
      { es:'pájaro', en:'small bird', eats:[1, 4] },
      { es:'zorro', en:'fox', eats:[2, 3] },
      { es:'halcón', en:'hawk', eats:[3, 5] }
    ] },
    { lugar:{ es:'la laguna', en:'the lagoon' }, nodes:[
      { es:'algas', en:'algae', eats:[] },
      { es:'plantas acuáticas', en:'water plants', eats:[] },
      { es:'zooplancton', en:'zooplankton', eats:[0] },
      { es:'caracol de agua', en:'water snail', eats:[1] },
      { es:'charal', en:'small fish', eats:[2] },
      { es:'rana', en:'frog', eats:[2] },
      { es:'mojarra', en:'sunfish', eats:[2, 3] },
      { es:'garza', en:'heron', eats:[4, 5, 6] }
    ] }
  ];
  var rounds = shuffle(WEBS, rng);
  var round = 0, sel = -1, tries = 0, revealed = false, done = false;

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Quita una pieza de la red', en:'Take one piece out of the web' }) + '</div>' +
    '<div class="gw-q" data-r="q"></div>' +
    '<div class="gw-mini">' + L({
      es:'Toca una población para sacarla de la red y ver a quiénes deja sin uno de sus alimentos directos. Tócala otra vez para regresarla. Cuando creas que encontraste la que deja sin alimento directo a más poblaciones, usa el botón de abajo.',
      en:'Tap a population to take it out of the web and see who is left without one of their direct foods. Tap it again to bring it back. When you think you have found the one that leaves the most populations without direct food, use the button below.'
    }) + '</div>' +
    '<div data-r="grid"></div>' +
    '<div class="gw-row">' +
      '<button class="gw-btn" data-r="choose">' + L({ es:'Elegir esta', en:'Choose this one' }) + '</button>' +
      '<button class="gw-btn" data-r="next" style="display:none">' + L({ es:'Siguiente', en:'Next' }) + '</button>' +
    '</div>' +
    '<div class="gw-fb"></div>';

  var elQ = host.querySelector('[data-r="q"]'),
      elG = host.querySelector('[data-r="grid"]'),
      elC = host.querySelector('[data-r="choose"]'),
      elN = host.querySelector('[data-r="next"]');

  function nodes(){ return rounds[round].nodes; }
  function levelOf(i){
    var ns = nodes();
    if (!ns[i].eats.length) return 0;
    var m = 0;
    ns[i].eats.forEach(function(j){ var l = levelOf(j); if (l > m) m = l; });
    return m + 1;
  }
  function deps(i){
    var out = [];
    nodes().forEach(function(n, j){ if (n.eats.indexOf(i) !== -1) out.push(j); });
    return out;
  }
  function best(){
    var bi = 0, bc = -1;
    nodes().forEach(function(n, j){ var c = deps(j).length; if (c > bc){ bc = c; bi = j; } });
    return { i:bi, c:bc };
  }
  function names(list){ return list.map(function(j){ return L(nodes()[j]); }).join(', '); }

  function render(){
    var ns = nodes();
    elQ.textContent = L({ es:'Red ' + (round + 1) + ' de 2: ' + L(rounds[round].lugar), en:'Web ' + (round + 1) + ' of 2: ' + L(rounds[round].lugar) });
    var hit = sel >= 0 ? deps(sel) : [];
    var lvls = [
      L({ es:'Fabrican su alimento', en:'Make their own food' }),
      L({ es:'Se alimentan de plantas', en:'Feed on plants' }),
      L({ es:'Se alimentan de otros animales', en:'Feed on other animals' }),
      L({ es:'Arriba de la red', en:'Top of the web' })
    ];
    var html = '';
    for (var lv = 0; lv < 4; lv++){
      var row = '';
      ns.forEach(function(n, j){
        if (levelOf(j) !== lv) return;
        var cls = '';
        if (revealed && j === best().i) cls = ' win';
        else if (j === sel) cls = ' out';
        else if (hit.indexOf(j) !== -1) cls = ' hit';
        var sub = n.eats.length
          ? L({ es:'come: ', en:'eats: ' }) + names(n.eats)
          : L({ es:'usa la luz del Sol', en:'uses sunlight' });
        row += '<button class="wnode' + cls + '" data-i="' + j + '">' + L(n) + '<span class="wsub">' + sub + '</span></button>';
      });
      if (row) html += '<div class="wlevel"><div class="wlvl-lbl">' + lvls[lv] + '</div><div class="wrow">' + row + '</div></div>';
    }
    elG.innerHTML = html;
    elG.querySelectorAll('.wnode').forEach(function(b){
      b.addEventListener('click', function(){ tap(parseInt(b.getAttribute('data-i'), 10)); });
    });
    elC.disabled = (sel < 0 || revealed || done);
    elN.style.display = revealed ? 'inline-block' : 'none';
  }

  function tap(i){
    if (done || revealed) return;
    sel = (sel === i) ? -1 : i;
    render();
    if (sel < 0){ say(host, '', L({ es:'La red está completa otra vez.', en:'The web is whole again.' })); return; }
    var d = deps(sel);
    if (!d.length){
      say(host, '', L({
        es:'Sin ' + L(nodes()[sel]) + ' nadie se queda sin alimento directo: nadie de esta red se lo come.',
        en:'Without ' + L(nodes()[sel]) + ' nobody is left without direct food: nobody in this web eats it.'
      }));
    } else {
      say(host, '', L({
        es:'Sin ' + L(nodes()[sel]) + ' se quedan sin uno de sus alimentos directos: ' + names(d) + ' (' + d.length + ').',
        en:'Without ' + L(nodes()[sel]) + ' these lose one of their direct foods: ' + names(d) + ' (' + d.length + ').'
      }));
    }
  }

  function nextRound(from){
    if (done) return;
    if (typeof from === 'number' && from !== round) return;
    if (round >= rounds.length - 1){
      done = true; revealed = false; sel = -1; render();
      say(host, 'good', L({
        es:'Ya viste las dos redes: quitar una sola población nunca afecta a una sola.',
        en:'You have seen both webs: taking out a single population never affects just one.'
      }));
      return;
    }
    round++; sel = -1; tries = 0; revealed = false; render();
    say(host, '', L({ es:'Otra red, otro reparto de flechas. Vuelve a probar.', en:'Another web, another spread of arrows. Try again.' }));
  }

  elC.addEventListener('click', function(){
    if (sel < 0 || revealed || done) return;
    var b = best();
    if (sel === b.i){
      revealed = true; render();
      say(host, 'good', L({
        es:'🎉 Correcto: sin ' + L(nodes()[b.i]) + ' quedan sin alimento directo ' + b.c + ' poblaciones, más que con cualquier otra.',
        en:'🎉 Correct: without ' + L(nodes()[b.i]) + ' there are ' + b.c + ' populations left without direct food, more than with any other.'
      }));
      var rNow = round;
      setTimeout(function(){ nextRound(rNow); }, 1500);
      return;
    }
    tries++;
    var mine = deps(sel).length;
    if (tries >= 3){
      revealed = true; render();
      say(host, 'miss', L({
        es:'Era ' + L(nodes()[b.i]) + ': deja sin alimento directo a ' + b.c + ' poblaciones (' + names(deps(b.i)) + '). Cuenta cuántas flechas salen de cada una.',
        en:'It was ' + L(nodes()[b.i]) + ': it leaves ' + b.c + ' populations without direct food (' + names(deps(b.i)) + '). Count how many arrows leave each one.'
      }));
      return;
    }
    say(host, 'warm', L({
      es:'Esa deja sin alimento directo a ' + mine + '. Hay otra que deja a más: ve tocando y compara los números.',
      en:'That one leaves ' + mine + ' without direct food. There is another that leaves more: keep tapping and compare the numbers.'
    }));
  });
  elN.addEventListener('click', function(){ if (revealed) nextRound(round); });

  render();
  say(host, '', L({ es:'Empieza tocando cualquier población de la red.', en:'Start by tapping any population in the web.' }));
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 3 :: la pirámide de la energía
   El nivel 1 llega con su cantidad puesta. El alumno arma un valor con los
   botones de dividir y multiplicar por diez y lo coloca en el nivel siguiente.
   La barra se acomoda al momento y la pista dice si el valor va alto o bajo.
   ══════════════════════════════════════════════════════════════════════════ */
function wPyramid(rng, host){
  var round = 0, filled = 1, tries = 0, work = 0, vals = [], done = false;
  var WIDTH = ['96%', '74%', '52%', '30%'];

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'La pirámide de la energía', en:'The energy pyramid' }) + '</div>' +
    '<div class="gw-q" data-r="q"></div>' +
    '<div class="gw-mini">' + L({
      es:'Arma la cantidad con los dos botones y colócala en el nivel que sigue. Si no queda bien puedes seguir ajustando, y el botón de quitar te regresa un nivel.',
      en:'Build the amount with the two buttons and place it on the next level. If it is not right you can keep adjusting, and the remove button takes you back one level.'
    }) + '</div>' +
    '<div class="pyr" data-r="pyr"></div>' +
    '<div class="work">' +
      '<button class="gw-btn" data-r="div">&#247; 10</button>' +
      '<span class="workv" data-r="val">0</span>' +
      '<button class="gw-btn" data-r="mul">&#215; 10</button>' +
    '</div>' +
    '<div class="gw-row">' +
      '<button class="gw-btn" data-r="put"></button>' +
      '<button class="gw-btn" data-r="undo">' + L({ es:'Quitar un nivel', en:'Remove one level' }) + '</button>' +
    '</div>' +
    '<div class="gw-fb"></div>';

  var elQ = host.querySelector('[data-r="q"]'),
      elP = host.querySelector('[data-r="pyr"]'),
      elV = host.querySelector('[data-r="val"]'),
      elD = host.querySelector('[data-r="div"]'),
      elM = host.querySelector('[data-r="mul"]'),
      elPut = host.querySelector('[data-r="put"]'),
      elU = host.querySelector('[data-r="undo"]');

  function render(){
    elQ.textContent = L({
      es: 'Pirámide ' + (round + 1) + ' de 2: un pastizal con ' + vals[0] + ' unidades de energía en sus plantas',
      en: 'Pyramid ' + (round + 1) + ' of 2: a grassland with ' + vals[0] + ' energy units in its plants'
    });
    var rows = '';
    for (var lv = 3; lv >= 0; lv--){
      var setted = lv < filled;
      var cls = 'pyrrow' + (setted ? ' set' : (lv === filled ? ' tgt' : ''));
      var txt = setted ? vals[lv] : '?';
      rows += '<div class="' + cls + '" style="width:' + WIDTH[lv] + '">' +
        '<span class="pyrlbl">' + L({ es:'Nivel ', en:'Level ' }) + (lv + 1) + '</span>' + txt + '</div>';
    }
    elP.innerHTML = rows;
    elV.textContent = work;
    elPut.textContent = filled < 4
      ? L({ es:'Colocar en el nivel ' + (filled + 1), en:'Place on level ' + (filled + 1) })
      : L({ es:'Pirámide completa', en:'Pyramid complete' });
    elPut.disabled = (filled >= 4 || done);
    elU.disabled = (filled <= 1 || done);
    elD.disabled = done; elM.disabled = done;
  }

  function newRound(){
    var E = ri(rng, 2, 9) * 10000;
    vals = [E, E / 10, E / 100, E / 1000];
    filled = 1; tries = 0; work = E;
    render();
    say(host, '', L({
      es:'El nivel 1 ya está puesto. ¿Cuánta de esa energía alcanza el nivel 2?',
      en:'Level 1 is already in place. How much of that energy reaches level 2?'
    }));
  }

  elD.addEventListener('click', function(){
    if (done) return;
    if (work >= 10 && work % 10 === 0) work = work / 10;
    render();
  });
  elM.addEventListener('click', function(){
    if (done) return;
    if (work * 10 <= vals[0]) work = work * 10;
    render();
  });
  elU.addEventListener('click', function(){
    if (done || filled <= 1) return;
    filled--; tries = 0; work = vals[filled - 1];
    render();
    say(host, '', L({ es:'Quitaste ese nivel. Vuelve a armar la cantidad.', en:'You removed that level. Build the amount again.' }));
  });

  elPut.addEventListener('click', function(){
    if (done || filled >= 4) return;
    var target = vals[filled];
    if (work === target){
      filled++; tries = 0;
      work = filled < 4 ? vals[filled - 1] : vals[3];
      render();
      if (filled >= 4){
        if (round >= 1){
          done = true; render();
          say(host, 'good', L({
            es:'🎉 Pirámide terminada: de ' + vals[0] + ' unidades abajo solo ' + vals[3] + ' llegan hasta arriba. Por eso el dibujo se angosta.',
            en:'🎉 Pyramid finished: out of ' + vals[0] + ' units at the bottom only ' + vals[3] + ' reach the top. That is why the drawing narrows.'
          }));
        } else {
          say(host, 'good', L({
            es:'🎉 Pirámide terminada. Va otra con una cantidad distinta abajo.',
            en:'🎉 Pyramid finished. Here comes another one with a different amount at the bottom.'
          }));
          round++;
          setTimeout(newRound, 1400);
        }
        return;
      }
      say(host, 'good', L({
        es:'Correcto: al nivel ' + filled + ' llegan ' + vals[filled - 1] + ' unidades. Sigue con el siguiente.',
        en:'Correct: level ' + filled + ' receives ' + vals[filled - 1] + ' units. Carry on with the next one.'
      }));
      return;
    }
    tries++;
    if (tries >= 3){
      filled++; tries = 0;
      work = filled < 4 ? vals[filled - 1] : vals[3];
      render();
      say(host, 'miss', L({
        es:'Ahí llegan ' + vals[filled - 1] + ' unidades: cada nivel recibe la décima parte del que tiene debajo.',
        en:'What arrives there is ' + vals[filled - 1] + ' units: each level receives a tenth of the one below it.'
      }));
      if (filled >= 4 && round < 1){ round++; setTimeout(newRound, 1600); }
      else if (filled >= 4){ done = true; render(); }
      return;
    }
    if (work > target){
      say(host, 'warm', L({
        es:'Va muy alto: en cada salto se queda por el camino la mayor parte de la energía. Prueba dividiendo otra vez.',
        en:'That is too high: most of the energy is lost at every jump. Try dividing once more.'
      }));
    } else {
      say(host, 'warm', L({
        es:'Va muy bajo: dividiste de más y esa cantidad corresponde a un nivel más arriba.',
        en:'That is too low: you divided too much and that amount belongs to a level further up.'
      }));
    }
  });

  newRound();
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 4 :: predice el efecto
   Un cambio en un eslabón y dos poblaciones que responden. El alumno marca si
   cada una sube o baja y las barras se mueven al momento con su elección.
   Tres escenarios distintos, pista dirigida a la población mal marcada.
   ══════════════════════════════════════════════════════════════════════════ */
function wPredict(rng, host){
  var SCEN = [
    { stmt:{ es:'En la pradera desaparecen los zorros, que eran los únicos que cazaban conejos.',
             en:'The foxes disappear from the grassland; they were the only ones hunting rabbits.' },
      tg:[ { n:{ es:'los conejos', en:'the rabbits' }, up:true,
             why:{ es:'ya nadie los caza, así que su población crece', en:'nobody hunts them any more, so their population grows' } },
           { n:{ es:'el pasto', en:'the grass' }, up:false,
             why:{ es:'más conejos comiendo dejan menos pasto en pie', en:'more rabbits feeding leave less grass standing' } } ] },
    { stmt:{ es:'Una sequía larga reduce mucho el pasto de la pradera.',
             en:'A long drought greatly reduces the grass of the grassland.' },
      tg:[ { n:{ es:'los conejos', en:'the rabbits' }, up:false,
             why:{ es:'su alimento se acaba y muchos no logran comer', en:'their food runs out and many do not manage to feed' } },
           { n:{ es:'los zorros', en:'the foxes' }, up:false,
             why:{ es:'con menos conejos, sus presas escasean', en:'with fewer rabbits, their prey becomes scarce' } } ] },
    { stmt:{ es:'En el estanque se sueltan muchas ranas, que se alimentan de insectos acuáticos.',
             en:'Many frogs are released into the pond; they feed on water insects.' },
      tg:[ { n:{ es:'los insectos acuáticos', en:'the water insects' }, up:false,
             why:{ es:'hay muchas más ranas comiéndoselos', en:'there are many more frogs eating them' } },
           { n:{ es:'las plantas del borde', en:'the plants at the edge' }, up:true,
             why:{ es:'los insectos que las mordían son menos', en:'the insects that chewed them are fewer' } } ] },
    { stmt:{ es:'En el bosque desaparecen los hongos y las bacterias que trabajan sobre los restos.',
             en:'The fungi and bacteria that work on remains disappear from the forest.' },
      tg:[ { n:{ es:'las hojas caídas y los restos', en:'the fallen leaves and remains' }, up:true,
             why:{ es:'ya nadie los desarma y se van acumulando', en:'nobody breaks them down any more and they pile up' } },
           { n:{ es:'las plantas del bosque', en:'the forest plants' }, up:false,
             why:{ es:'los nutrientes no regresan al suelo', en:'the nutrients do not return to the soil' } } ] }
  ];
  var rounds = shuffle(SCEN, rng).slice(0, 3);
  var round = 0, tries = 0, ch = [null, null], revealed = false, done = false;

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Predice el efecto', en:'Predict the effect' }) + '</div>' +
    '<div class="gw-q" data-r="q"></div>' +
    '<div class="gw-mini">' + L({
      es:'Marca qué le pasa a cada población. Las barras se mueven con lo que elijas y puedes cambiar de opinión antes de comprobar.',
      en:'Mark what happens to each population. The bars move with what you choose and you can change your mind before checking.'
    }) + '</div>' +
    '<div data-r="rows"></div>' +
    '<div class="gw-row">' +
      '<button class="gw-btn" data-r="chk">' + L({ es:'Comprobar', en:'Check' }) + '</button>' +
      '<button class="gw-btn" data-r="next" style="display:none">' + L({ es:'Siguiente', en:'Next' }) + '</button>' +
    '</div>' +
    '<div class="gw-fb"></div>';

  var elQ = host.querySelector('[data-r="q"]'),
      elR = host.querySelector('[data-r="rows"]'),
      elK = host.querySelector('[data-r="chk"]'),
      elN = host.querySelector('[data-r="next"]');

  function render(){
    var sc = rounds[round];
    elQ.textContent = L(sc.stmt);
    var html = '';
    sc.tg.forEach(function(t, k){
      var v = ch[k];
      var w = v === null ? 50 : (v ? 85 : 18);
      html += '<div class="prow">' +
        '<div class="plbl">' + L({ es:'¿Qué pasa con ', en:'What happens to ' }) + L(t.n) + '?</div>' +
        '<div class="pbtns">' +
          '<button class="gw-btn' + (v === true ? ' on' : '') + '" data-k="' + k + '" data-v="1">' + L({ es:'Sube', en:'Goes up' }) + '</button>' +
          '<button class="gw-btn' + (v === false ? ' on' : '') + '" data-k="' + k + '" data-v="0">' + L({ es:'Baja', en:'Goes down' }) + '</button>' +
        '</div>' +
        '<div class="pbar"><div class="pbarf' + (v === false ? ' dn' : '') + '" style="width:' + w + '%"></div></div>' +
      '</div>';
    });
    elR.innerHTML = html;
    elR.querySelectorAll('.gw-btn').forEach(function(b){
      b.addEventListener('click', function(){
        if (revealed || done) return;
        ch[parseInt(b.getAttribute('data-k'), 10)] = b.getAttribute('data-v') === '1';
        render();
      });
    });
    elK.disabled = (done || revealed);
    elN.style.display = revealed ? 'inline-block' : 'none';
  }

  function newRound(){
    tries = 0; ch = [null, null]; revealed = false;
    render();
    say(host, '', L({ es:'Piensa primero en la población que toca el cambio de manera directa.', en:'Think first about the population the change touches directly.' }));
  }

  function nextRound(from){
    if (done) return;
    if (typeof from === 'number' && from !== round) return;
    if (round >= rounds.length - 1){
      done = true; revealed = false; render();
      say(host, 'good', L({
        es:'Con la red delante se puede anticipar el efecto: el cambio se corre eslabón por eslabón.',
        en:'With the web in front of you the effect can be anticipated: the change travels link by link.'
      }));
      return;
    }
    round++; newRound();
  }

  elK.addEventListener('click', function(){
    if (done || revealed) return;
    var sc = rounds[round];
    if (ch[0] === null || ch[1] === null){
      say(host, 'warm', L({ es:'Falta marcar una de las dos poblaciones.', en:'One of the two populations is still unmarked.' }));
      return;
    }
    var bad = [];
    sc.tg.forEach(function(t, k){ if (ch[k] !== t.up) bad.push(k); });
    if (!bad.length){
      revealed = true; render();
      say(host, 'good', L({
        es:'🎉 Bien predicho: ' + L(sc.tg[0].n) + ' porque ' + L(sc.tg[0].why) + ', y ' + L(sc.tg[1].n) + ' porque ' + L(sc.tg[1].why) + '.',
        en:'🎉 Well predicted: ' + L(sc.tg[0].n) + ' because ' + L(sc.tg[0].why) + ', and ' + L(sc.tg[1].n) + ' because ' + L(sc.tg[1].why) + '.'
      }));
      var rNow = round;
      setTimeout(function(){ nextRound(rNow); }, 1800);
      return;
    }
    tries++;
    if (tries >= 3){
      revealed = true;
      ch = [sc.tg[0].up, sc.tg[1].up];
      render();
      say(host, 'miss', L({
        es:'Así queda: ' + L(sc.tg[0].n) + ' ' + (sc.tg[0].up ? 'sube' : 'baja') + ', porque ' + L(sc.tg[0].why) + '; ' + L(sc.tg[1].n) + ' ' + (sc.tg[1].up ? 'sube' : 'baja') + ', porque ' + L(sc.tg[1].why) + '.',
        en:'This is how it goes: ' + L(sc.tg[0].n) + ' ' + (sc.tg[0].up ? 'goes up' : 'goes down') + ', because ' + L(sc.tg[0].why) + '; ' + L(sc.tg[1].n) + ' ' + (sc.tg[1].up ? 'goes up' : 'goes down') + ', because ' + L(sc.tg[1].why) + '.'
      }));
      return;
    }
    say(host, 'warm', L({
      es:'Revisa ' + L(sc.tg[bad[0]].n) + ': sigue la flecha desde el cambio y pregúntate si ahora les llega más o menos alimento.',
      en:'Look again at ' + L(sc.tg[bad[0]].n) + ': follow the arrow from the change and ask whether more or less food now reaches them.'
    }));
  });
  elN.addEventListener('click', function(){ if (revealed) nextRound(round); });

  newRound();
}

/* ══════════════════════════════════════════════════════════════════════════
   PROBLEMAS

function addProblem(rng, v){
  var idx = problems.length;
  var opts = L(v.opts).slice();
  var correctVal = opts[v.ci];
  var sh = shuffle(opts, rng);
  var prob = {
    title: L(v.title),
    questionText: L(v.q),
    fn: '',
    hint: L(v.hint),
    explanation: L(v.exp),
    options: sh,
    correctIdx: sh.indexOf(correctVal),
    showWork: !!v.showWork,
    studentChoice: null,
    pendingChoice: null
  };
  problems.push(prob);
  buildOneCard(prob, idx);
}
