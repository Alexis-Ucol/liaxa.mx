            en: 'The rate you are after is the one at which the ' + intN(p3n) + ' savings, once carried back to the present, add up to exactly what the vans cost. Take each option, discount the savings with it and see whether the total falls short of the outlay or overshoots it: the right one is the only one that matches it. Remember too that the return has to be above the required rate, because this project does add value.' },
    exp: { es: 'Descontados al ' + pct2(s3IRR) + ', los ' + intN(p3n) + ' ahorros de ' + money(p3A) + ' valen hoy justo los ' + money(s3I) + ' que cuestan las camionetas, y por eso esa es la tasa interna de retorno; queda ' + dec2((s3IRR - p3h) * 100) + ' puntos por encima del ' + pctS(p3h) + ' por ciento exigido. La opción de ' + pct2(p3A / s3I) + ' divide el ahorro de un año entre el desembolso, lo que mide qué proporción del costo se recupera cada año pero no descuenta nada y por eso siempre sale demasiado alta. La de ' + pct2((p3A * p3n - s3I) / (s3I * p3n)) + ' reparte la ganancia total del proyecto entre el desembolso y entre los años, que es un rendimiento contable promedio: ignora las fechas y en un proyecto de flujos parejos siempre queda por debajo de la tasa interna. Y la de ' + pct2(p3h) + ' es la tasa que la empresa exige, no la que el proyecto ofrece: confundirlas equivale a suponer que todo proyecto rinde exactamente el mínimo, con lo cual ningún proyecto agregaría nunca valor.',
           en: 'Discounted at ' + pct2(s3IRR) + ', the ' + intN(p3n) + ' savings of ' + money(p3A) + ' are worth today exactly the ' + money(s3I) + ' the vans cost, which is what makes that the internal rate of return; it sits ' + dec2((s3IRR - p3h) * 100) + ' points above the ' + pctS(p3h) + ' percent required. The option of ' + pct2(p3A / s3I) + ' divides one year of saving by the outlay, which measures the share of the cost recovered each year but discounts nothing, so it always comes out too high. The one of ' + pct2((p3A * p3n - s3I) / (s3I * p3n)) + ' spreads the total gain of the project over the outlay and over the years, which is an average accounting return: it ignores the dates and, in a project with level flows, always lands below the internal rate. And the one of ' + pct2(p3h) + ' is the rate the company demands, not the one the project offers: confusing the two amounts to assuming every project earns exactly the minimum, in which case no project would ever add value.' }
  };
  var d3 = mk(q3i, o3.correctIdx, true);
  problems.push({ i18n: d3.i18n, title: d3.title, questionText: d3.questionText, options: d3.options, correctIdx: d3.correctIdx, explanation: d3.explanation, hint: d3.hint, showWork: true, studentChoice: null, pendingChoice: null });
  buildOneCard(problems[problems.length - 1], problems.length - 1);

  /* ── Item 4 ── */
  var s4af  = annFactor(p4r, p4n);
  var s4Ib  = p4Is * p4mult;
  var s4As  = Math.round(p4Is * p4ks / s4af / 1000) * 1000;
  var s4Ab  = Math.round(s4Ib * p4kb / s4af / 1000) * 1000;
  var s4ns  = pvAnnuity(s4As, p4r, p4n) - p4Is;
  var s4nb  = pvAnnuity(s4Ab, p4r, p4n) - s4Ib;
  var s4is  = irrLevel(p4Is, s4As, p4n);
  var s4ib  = irrLevel(s4Ib, s4Ab, p4n);
  var o4 = shuffleOpts(
    ['Que conviene el proyecto grande, porque agrega ' + money(s4nb) + ' de valor contra ' + money(s4ns) + ' del pequeño, y con presupuesto suficiente y sin otro destino para el sobrante lo que se maximiza son los pesos y no el porcentaje.',
     'Que el analista tiene razón y conviene el proyecto pequeño, porque entre dos inversiones siempre debe elegirse la de mayor rendimiento porcentual, que es la medida que hace comparables proyectos de tamaños distintos.',
     'Que ninguno de los dos conviene mientras no se conozca el plazo de recuperación, porque un proyecto de ' + intN(p4n) + ' años mantiene el capital comprometido demasiado tiempo como para juzgarlo solo por rendimiento o por valor.',
     'Que conviene el proyecto pequeño por una razón distinta a la del analista: al costar menos deja capital libre, y ese capital libre vale por sí mismo aunque la empresa no tenga en qué colocarlo.'],
    ['That the large project is the one to take, because it adds ' + money(s4nb) + ' of value against ' + money(s4ns) + ' from the small one, and with enough budget and nowhere else to put the remainder what gets maximised is pesos rather than the percentage.',
     'That the analyst is right and the small project is the one to take, because between two investments you should always pick the higher percentage return, which is the measure that makes projects of different sizes comparable.',
     'That neither is worth taking until the payback period is known, because a project running ' + intN(p4n) + ' years keeps capital committed for too long to be judged on return or value alone.',
     'That the small project is the one to take but for a different reason than the analyst gives: costing less, it leaves capital free, and free capital is worth something in itself even if the company has nowhere to put it.'], rng);
  var q4i = {
    title: { es: 'El porcentaje más alto y el proyecto más chico', en: 'The highest percentage and the smallest project' },
    q: { es: 'Una empresa de logística portuaria en Manzanillo tiene dos proyectos y presupuesto de sobra para cualquiera de los dos, pero sus bodegas solo admiten uno. Ampliar el patio de maniobras cuesta ' + money(p4Is) + ' y rinde ' + pct2(s4is) + ' anual. Construir la nave refrigerada cuesta ' + money(s4Ib) + ' y rinde ' + pct2(s4ib) + ' anual. Ambos duran ' + intN(p4n) + ' años y la empresa descuenta al ' + pctS(p4r) + ' por ciento. El analista recomienda el patio porque su rendimiento es mayor y no tiene otro proyecto en el que colocar el dinero restante. ¿Qué debe responder la dirección?',
        en: 'A port logistics company in Manzanillo has two projects and more than enough budget for either, but its yard has room for only one. Extending the manoeuvring area costs ' + money(p4Is) + ' and earns ' + pct2(s4is) + ' a year. Building the refrigerated warehouse costs ' + money(s4Ib) + ' and earns ' + pct2(s4ib) + ' a year. Both last ' + intN(p4n) + ' years and the company discounts at ' + pctS(p4r) + ' percent. The analyst recommends the yard because its return is higher, and there is no other project in which to place the money left over. What should management reply?' },
    opts: { es: o4.es, en: o4.en },
    hint: { es: 'Un rendimiento se expresa por cada peso invertido, así que dice qué tan bien trabaja el dinero pero no cuánto dinero está trabajando. Pregúntate qué se lleva la empresa a casa al final: un porcentaje alto sobre una base chica o uno más modesto sobre una base varias veces mayor. Y fíjate en el dato que el enunciado subraya, que es qué pasa con el dinero que sobra si se elige el proyecto barato.',
            en: 'A return is stated per peso invested, so it says how hard the money works but not how much money is working. Ask yourself what the company actually takes home at the end: a high percentage on a small base, or a more modest one on a base several times larger. And note the detail the statement underlines, which is what happens to the leftover money if the cheap project is chosen.' },
    exp: { es: 'El rendimiento del patio es más alto, pero se aplica sobre ' + money(p4Is) + ' y deja ' + money(s4ns) + ' de valor. El de la nave es menor y se aplica sobre ' + money(s4Ib) + ', de modo que deja ' + money(s4nb) + ', es decir ' + money(s4nb - s4ns) + ' más. Como los proyectos son excluyentes, hay presupuesto para cualquiera y el sobrante no tiene otro destino productivo, la empresa debe quedarse con la nave. La opción que respalda al analista aplica una regla que solo es válida cuando el capital escasea y hay muchos proyectos entre los cuales repartirlo; aquí no escasea. La que pide el plazo de recuperación cambia de pregunta: ese dato mide exposición y liquidez, no valor, y no puede resolver una comparación entre proyectos. Y la que atribuye un valor propio al capital libre se contradice con el enunciado, porque un capital sin destino no rinde nada y por eso no compensa los ' + money(s4nb - s4ns) + ' que se estarían dejando sobre la mesa.',
           en: 'The return on the yard is higher, but it applies to ' + money(p4Is) + ' and leaves ' + money(s4ns) + ' of value. The return on the warehouse is lower and applies to ' + money(s4Ib) + ', so it leaves ' + money(s4nb) + ', which is ' + money(s4nb - s4ns) + ' more. Since the projects are mutually exclusive, there is budget for either and the remainder has no other productive use, the company should take the warehouse. The option backing the analyst applies a rule that only holds when capital is scarce and there are many projects to spread it over; here it is not scarce. The one asking for the payback period changes the question: that figure measures exposure and liquidity rather than value, and it cannot settle a comparison between projects. And the one that credits free capital with a value of its own contradicts the statement, because capital with nowhere to go earns nothing and so does not make up for the ' + money(s4nb - s4ns) + ' being left on the table.' }
  };
  var d4 = mk(q4i, o4.correctIdx, false);
  problems.push({ i18n: d4.i18n, title: d4.title, questionText: d4.questionText, options: d4.options, correctIdx: d4.correctIdx, explanation: d4.explanation, hint: d4.hint, showWork: false, studentChoice: null, pendingChoice: null });
  buildOneCard(problems[problems.length - 1], problems.length - 1);

  /* ═══════════════════════ CONCEPT 3 ═══════════════════════ */
  var c3PV  = pvAnnuity(c3A, c3r, c3n);
  var c3I   = Math.round(c3PV * c3f / 10000) * 10000;
  var c3NPV = c3PV - c3I;
  var c3sp  = payback(c3I, c3A);
  var c3dp  = discPayback(c3I, c3A, c3r);

  addSection(function(L) {
    var es = L === 'es';
    if (es) return '' +
      '<div class="stag">Concepto 3</div>' +
      '<h2>Cuánto tiempo sigue el dinero expuesto</h2>' +
      '<p>Hay una pregunta que ninguna de las dos medidas anteriores contesta y que en la práctica se hace siempre: ¿en cuánto tiempo recupero lo que puse? El <strong>plazo de recuperación</strong> la responde contando cuántos años tardan los flujos en completar el desembolso. Su atractivo es que se entiende sin explicación previa y que habla el idioma de la tesorería, que no piensa en valor sino en cuándo vuelve el dinero a estar disponible.</p>' +
      '<p>En su versión más simple los flujos se cuentan tal como llegan, y eso es precisamente lo que la vuelve tramposa: durante toda la espera el capital de la empresa está comprometido en este proyecto y no en otro, y ese costo no aparece por ningún lado. La corrección se llama <strong>plazo de recuperación descontado</strong> y consiste en traer cada flujo al presente antes de acumularlo. El resultado es siempre posterior al simple, nunca anterior, porque cada flujo descontado aporta menos que su cifra nominal. La diferencia entre las dos fechas es, en años, lo que cuesta esperar.</p>' +
      '<p>Hay un caso extremo que conviene reconocer. Si la tasa exigida es suficientemente alta, la suma de los flujos descontados deja de crecer lo bastante rápido y nunca alcanza el desembolso, por más años que dure el proyecto. Cuando eso ocurre el plazo de recuperación descontado sencillamente no existe, y no existe por la misma razón por la que el valor presente neto es negativo: son dos maneras de decir lo mismo.</p>' +
      '<p>Y ahora la limitación que define a esta medida, la que hay que tener presente cada vez que alguien la cite en una junta. El plazo de recuperación <strong>deja de contar el día en que el proyecto termina de pagarse</strong>. Todo lo que ocurra después, sean tres años de flujos excelentes o el cierre inmediato de la operación, es invisible para el criterio. Por eso un proyecto que se recupera rápido y muere enseguida puede parecer superior a uno que tarda y luego produce durante años, y por eso el plazo de recuperación se usa como filtro de riesgo y de liquidez, nunca como criterio único de selección.</p>' +
      '<div class="rules-grid">' +
        '<div class="rcard"><div class="rname">Recuperación simple</div><div class="rform">' + frac('I', 'A') + '</div><div class="rnote">Con flujos parejos y sin descontar.</div></div>' +
        '<div class="rcard"><div class="rname">Recuperación descontada</div><div class="rform">VP acumulado = I</div><div class="rnote">El año en que lo traído a hoy iguala el costo.</div></div>' +
        '<div class="rcard"><div class="rname">Orden garantizado</div><div class="rform">descontada > simple</div><div class="rnote">Descontar siempre retrasa el cruce.</div></div>' +
        '<div class="rcard"><div class="rname">Punto ciego</div><div class="rform">ignora lo posterior</div><div class="rnote">Filtro de riesgo, no criterio de valor.</div></div>' +
      '</div>' +
      '<p><strong>Ejemplo resuelto.</strong> Una purificadora de agua en Colima invierte ' + money(c3I) + ' en una planta de ósmosis inversa que le ahorraría ' + money(c3A) + ' al año durante ' + intN(c3n) + ' años. La empresa descuenta al ' + pctS(c3r) + ' por ciento y su política interna es no aprobar proyectos que tarden más de cinco años en recuperarse.</p>' +
      '<div class="callout"><p><strong>Paso 1.</strong> Contando los ahorros tal como llegan, el desembolso queda cubierto en ' + dec1(c3sp) + ' años.<br>' +
      '<strong>Paso 2.</strong> Descontando cada ahorro antes de acumularlo, el cruce se recorre a ' + dec1(c3dp) + ' años, es decir ' + dec1(c3dp - c3sp) + ' años más tarde. Esa diferencia es el precio de haber tenido el capital comprometido durante la espera.<br>' +
      '<strong>Paso 3.</strong> Al terminar los ' + intN(c3n) + ' años el proyecto deja además ' + money(c3NPV) + ' de valor presente neto, cifra que ninguno de los dos plazos alcanza a mostrar.<br>' +
      '<strong>Lectura de negocio.</strong> Si la purificadora aplica su regla de cinco años sobre la cifra simple y no sobre la descontada, se estará dando por recuperada antes de tiempo. Conviene por eso que la política interna nombre cuál de las dos usa. Y hay que decir algo más importante: los dos plazos dejan de mirar en ' + dec1(c3dp) + ' años, mientras que el proyecto sigue produciendo hasta el año ' + intN(c3n) + '. Toda esa cola es la que hace que el valor presente neto sea ' + money(c3NPV) + ' y no una cifra menor, y es exactamente lo que el criterio de recuperación no ve.</p></div>';
    return '' +
      '<div class="stag">Concept 3</div>' +
      '<h2>How long the money stays exposed</h2>' +
      '<p>There is a question neither of the previous measures answers and that in practice always gets asked: how long before I get back what I put in? The <strong>payback period</strong> answers it by counting how many years the flows take to complete the outlay. Its appeal is that it needs no explaining and that it speaks the language of the treasury, which thinks less about value than about when the money becomes available again.</p>' +
      '<p>In its plainest form the flows are counted as they arrive, and that is precisely what makes it treacherous: throughout the wait the company capital is committed to this project rather than another, and that cost appears nowhere. The correction is called <strong>discounted payback</strong> and it consists of carrying each flow back to the present before accumulating it. The result always falls later than the plain figure, never earlier, because each discounted flow contributes less than its face amount. The distance between the two dates is, in years, what the waiting costs.</p>' +
      '<p>There is an extreme case worth recognising. If the required rate is high enough, the sum of the discounted flows stops growing fast enough and never reaches the outlay, however long the project runs. When that happens the discounted payback simply does not exist, and it does not exist for the same reason that net present value is negative: the two are saying the same thing.</p>' +
      '<p>And now the limitation that defines this measure, the one to keep in mind whenever somebody quotes it in a meeting. Payback <strong>stops counting the day the project finishes paying for itself</strong>. Anything that happens afterwards, whether three years of excellent flows or the immediate closure of the operation, is invisible to the test. That is why a project recovering fast and dying straight after can look better than one that takes its time and then produces for years, and it is why payback is used as a risk and liquidity filter and never as the sole selection criterion.</p>' +

function applyUIStrings() {
  var set = function(id, txt) { var e = document.getElementById(id); if (e) e.textContent = txt; };
  var ph  = function(id, txt) { var e = document.getElementById(id); if (e) e.placeholder = txt; };
  set('wtitle-el',    SCHOOL.guideTitle[LANG]);
  set('wcourse-el',   SCHOOL.courseName[LANG]);
  set('htitle-el',    SCHOOL.guideTitle[LANG]);
  set('lbl-name-el',  t('lbl-name'));
  set('lbl-group-el', t('lbl-group'));
  set('startBtn',     t('btn-start'));
  set('restoreTitle', t('restore-title'));
  set('restoreMsg',   t('restore-msg'));
  set('restoreBtn',   t('btn-restore'));
  set('dismissBtn',   t('btn-dismiss'));
  set('dlBtn',        t('btn-pdf'));
  ph('sName',  t('ph-name'));
  ph('sGroup', t('ph-group'));
  var ll = document.getElementById('logo-left');   if (ll) ll.alt = SCHOOL.logoLeftAlt;
  var lr = document.getElementById('logo-right');  if (lr) lr.alt = SCHOOL.logoRightAlt;
}
/* Rebuilds the visible text of every card without touching the numbers. */
function applyProblemLang() {
  problems.forEach(function(p, i) {
    var card = document.getElementById('pc' + i);
    if (!card || !p.i18n) return;
    p.title        = p.i18n.title[LANG];
    p.questionText = p.i18n.q[LANG];
    p.hint         = p.i18n.hint[LANG];
    p.explanation  = p.i18n.exp[LANG];
    p.options      = p.i18n.opts[LANG].slice();
    var ti = card.querySelector('.ptitle'); if (ti) ti.textContent = p.title;
    var st = card.querySelector('.pstmt');  if (st) st.innerHTML = p.questionText;
    var hb = card.querySelector('.hintbox'); if (hb) hb.innerHTML = p.hint;
    var hbtn = card.querySelector('.hintbtn'); if (hbtn) hbtn.textContent = t('btn-hint');
    card.querySelectorAll('.mcopt').forEach(function(o, oi) {
      if (p.options[oi] !== undefined) o.innerHTML = p.options[oi];
    });
    var tabs = card.querySelectorAll('.wtab');
    if (tabs.length === 3) {
      tabs[0].textContent = t('tab-draw');
      tabs[1].textContent = t('tab-type');
      tabs[2].textContent = t('tab-photo');
    }
    var tools = card.querySelectorAll('.tbtn2');
    if (tools.length === 3) {
      tools[0].textContent = t('tool-pen');
      tools[1].textContent = t('tool-mark');
      tools[2].textContent = t('tool-erase');
    }
    var clr = card.querySelector('.clrbtn'); if (clr) clr.textContent = t('tool-clear');
    var ta  = card.querySelector('.wtextarea'); if (ta) ta.placeholder = t('ph-work');
    var pzt = card.querySelector('.pztxt'); if (pzt) pzt.textContent = t('ph-photo');
    var lab = card.querySelector('.pbody > div:last-child > div:first-child');
    if (lab) lab.textContent = t('lbl-answer');
    var fb = card.querySelector('.mcfb');
    if (fb && fb.classList.contains('show')) {
      var isOk = (p.studentChoice === p.correctIdx);
      fb.innerHTML = '<strong>' + (isOk ? t('fb-correct') : t('fb-wrong')) + '</strong> ' + p.explanation;
    }
  });
}
function setLang(l) {
  LANG = l;
  try { localStorage.setItem(LANG_KEY, l); } catch(e) {}
  document.documentElement.setAttribute('lang', l);
  var be = document.getElementById('btn-es'), bn = document.getElementById('btn-en');
  if (be) be.classList.toggle('active', l === 'es');
  if (bn) bn.classList.toggle('active', l === 'en');
  applyUIStrings();
  applySectionLang();
  applyProblemLang();
  widgets.forEach(function(f) { try { f(); } catch(e) {} });
  document.querySelectorAll('#lessonBody .section').forEach(function(s) { s.classList.add('vis'); });
}
(function() {
  try { var stored = localStorage.getItem(LANG_KEY); if (stored === 'es' || stored === 'en') LANG = stored; } catch(e) {}
  document.addEventListener('DOMContentLoaded', function() {
    document.documentElement.setAttribute('lang', LANG);
    var be = document.getElementById('btn-es'), bn = document.getElementById('btn-en');
    if (be) be.classList.toggle('active', LANG === 'es');
    if (bn) bn.classList.toggle('active', LANG === 'en');
    applyUIStrings();
  });
})();

async function generatePDF() {
  var btn = document.getElementById('dlBtn');
  btn.textContent = t('pdf-busy');
  btn.disabled = true;

  var jspdf   = window.jspdf;
  var doc     = new jspdf.jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });
  var PW      = 215.9;
  var M       = 18;
  var TW      = PW - M * 2;
  var PH      = doc.internal.pageSize.height;
  var name    = studentData.name;
  var group   = studentData.group;
  var total   = problems.length;
  var pct     = Math.round(correctCount / total * 100);
  var dateStr = new Date().toLocaleString(LANG === 'es' ? 'es-MX' : 'en-US', { dateStyle:'long', timeStyle:'short' });

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;

  function pdfText(html) {
    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/→/g,'->').replace(/−/g,'-').replace(/²/g,'^2')
      .replace(/³/g,'^3').replace(/×/g,'x').replace(/÷/g,'/')
      .replace(/≠/g,'!=').replace(/≤/g,'<=').replace(/≥/g,'>=')
      .replace(/√/g,'sqrt').replace(/π/g,'pi').replace(/…/g,'...')
      .replace(/μ/g,'mu').replace(/σ/g,'sigma').replace(/α/g,'alpha').replace(/β/g,'beta')
      .replace(/₀/g,'0').replace(/₁/g,'1').replace(/₂/g,'2').replace(/·/g,'*')
      .replace(/\s+/g,' ').trim();
  }

  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,2,'F');
  doc.setFillColor(255,255,255); doc.rect(0,2,PW,26,'F');
  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,28,PW,2,'F');
  doc.setFillColor(pBR,pBG,pBB); doc.rect(0,30,PW,34,'F');

  var fmtL = SCHOOL.logoLeftB64.indexOf('/9j/') > -1 ? 'JPEG' : 'PNG';
  var fmtR = SCHOOL.logoRightB64.indexOf('/9j/') > -1 ? 'JPEG' : 'PNG';
  try { doc.addImage(SCHOOL.logoLeftB64,  fmtL, M,  4.0, 22, 22); } catch(e) {}
  try { doc.addImage(SCHOOL.logoRightB64, fmtR, 48, 4.5, 48, 21); } catch(e) {}

  var lx = PW - M - 36;
  var ly = 10;
  doc.setDrawColor(pBR,pBG,pBB); doc.setLineWidth(0.7);
  doc.lines([[2.57-1.03,4.63-6.17],[4.11-2.57,5.14-4.63],[5.66-4.11,2.57-5.14]], lx+1.03, ly+6.17);
  doc.setFillColor(pAR,pAG,pAB); doc.circle(lx+5.66, ly+2.57, 0.9, 'F');
  doc.setDrawColor(pAR,pAG,pAB); doc.setLineWidth(0.7);
  doc.line(lx+8.23, ly+1.54, lx+8.23, ly+7.2);
  doc.setTextColor(pBR,pBG,pBB); doc.setFontSize(11); doc.setFont('helvetica','bold');
  doc.text('LIAXA', lx+10, ly+6.8);

  doc.setTextColor(240,244,238); doc.setFontSize(13); doc.setFont('helvetica','bold');
  doc.text(SCHOOL.guideTitle[LANG], M, 49);
  doc.setTextColor(198,214,192); doc.setFontSize(8); doc.setFont('helvetica','normal');
  doc.text(dateStr, M, 59);

  doc.setFillColor(237,240,245); doc.roundedRect(M,72,TW,20,3,3,'F');
  doc.setTextColor(130,140,160); doc.setFontSize(8.5); doc.setFont('helvetica','bold');
  doc.text(t('pdf-student'), M+4, 79); doc.text(t('pdf-group'), 130, 79);
  doc.setTextColor(20,24,32); doc.setFontSize(11); doc.setFont('helvetica','bold');
  doc.text(name, M+4, 87); doc.text(group, 130, 87);

  var sc = pct>=70?[26,106,74]:pct>=50?[224,123,26]:[176,48,16];
  doc.setFillColor(255,255,255); doc.roundedRect(M,100,TW,34,4,4,'F');
  doc.setDrawColor(sc[0],sc[1],sc[2]); doc.setLineWidth(0.8);
  doc.roundedRect(M,100,TW,34,4,4,'S');
  doc.setTextColor(sc[0],sc[1],sc[2]); doc.setFontSize(40); doc.setFont('helvetica','bold');
  doc.text(pct+'%', PW/2, 124, {align:'center'});
  doc.setTextColor(130,140,160); doc.setFontSize(8.5); doc.setFont('helvetica','normal');
  doc.text(correctCount+' '+t('pdf-score')+' '+total+' '+t('pdf-questions'), PW/2, 131, {align:'center'});

  doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
  doc.setFontSize(7); doc.setFont('helvetica','bold');
  doc.rect(M,142,TW,8,'F'); doc.text(t('pdf-summary'), M+4, 148);
  var sy = 154;
  problems.forEach(function(prob, i) {
    if (sy + 12 > PH - 15) {
      doc.addPage(); sy = 20;
      doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
      doc.setFontSize(7); doc.setFont('helvetica','bold');
      doc.rect(M,sy,TW,8,'F'); doc.text(t('pdf-summary2'), M+4, sy+6);
      sy += 12;
    }
    var ok = document.getElementById('pc'+i).classList.contains('ok');
    doc.setFillColor(ok?232:255, ok?240:232, ok?232:228);
    doc.roundedRect(M,sy,TW,10,2,2,'F');
    doc.setFillColor(ok?26:176, ok?106:48, ok?74:16);
    doc.circle(M+6, sy+5, 2.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(7); doc.setFont('helvetica','bold');
    doc.text(ok?'v':'x', M+4.5, sy+6.5);
    doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('helvetica','normal');
    doc.text(t('pdf-item')+' '+(i+1)+': '+pdfText(prob.title), M+12, sy+6.5);
    doc.setTextColor(ok?26:176, ok?106:48, ok?74:16);
    doc.text(ok?t('pdf-ok'):t('pdf-bad'), PW-M-24, sy+6.5);
    sy += 12;
  });

  for (var i = 0; i < problems.length; i++) {
    var prob = problems[i];
    doc.addPage();
    var wy = 0;

    doc.setFillColor(pBR,pBG,pBB); doc.rect(0,0,PW,20,'F');
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,3,'F');
    doc.setTextColor(pAR,pAG,pAB); doc.setFontSize(7); doc.setFont('helvetica','normal');
    doc.text(SCHOOL.courseName[LANG]+'  ·  '+SCHOOL.guideTitle[LANG], M, 10);
    doc.setTextColor(240,244,238); doc.setFontSize(10.5); doc.setFont('helvetica','bold');
    doc.text(t('pdf-item')+' '+(i+1)+' '+t('pdf-of')+' '+total+'  ·  '+pdfText(prob.title), M, 17);
    wy = 25;

    var qRaw = pdfText(prob.questionText);
    doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var qLines = doc.splitTextToSize(qRaw, TW-10);
    var qBoxH  = 8 + qLines.length*5 + 3;
    doc.setFillColor(237,240,245); doc.roundedRect(M,wy,TW,qBoxH,2,2,'F');
    doc.setTextColor(pBR,pBG,pBB); doc.setFontSize(6.5); doc.setFont('helvetica','bold');
    doc.text(t('pdf-question'), M+4, wy+6);
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var qy = wy+12;
    qLines.forEach(function(ln,li){ doc.text(ln, M+4, qy+li*5); });
    wy += qBoxH + 4;

    var isOk   = document.getElementById('pc'+i).classList.contains('ok');
    var chosen = prob.studentChoice != null ? pdfText(prob.options[prob.studentChoice]||'') : '';
    var corr   = pdfText(prob.options[prob.correctIdx]||'');
    var expRaw = pdfText(prob.explanation||'');
    doc.setFontSize(8.5); var chLines = doc.splitTextToSize(t('pdf-yours')+chosen, TW-18);
    doc.setFontSize(8);   var coLines = doc.splitTextToSize(t('pdf-key')+corr, TW-18);
    doc.setFontSize(7.5); var exLines = doc.splitTextToSize(t('pdf-sol')+expRaw, TW-18).slice(0,4);
    var ansBoxH = 8 + chLines.length*5.5 + coLines.length*5 + exLines.length*5 + 6;
    doc.setFillColor(isOk?232:255, isOk?240:232, isOk?232:228);
    doc.roundedRect(M,wy,TW,ansBoxH,2,2,'F');
    doc.setFillColor(isOk?26:176, isOk?106:48, isOk?74:16);
    doc.circle(M+7, wy+8, 3.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(9); doc.setFont('helvetica','bold');
    doc.text(isOk?'v':'x', M+5.2, wy+10.5);
    var ay = wy+7;
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','bold');
    chLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5.5); });
    ay += chLines.length*5.5 + 3;
    doc.setTextColor(26,106,74); doc.setFontSize(8); doc.setFont('helvetica','normal');
    coLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    ay += coLines.length*5 + 3;
    doc.setTextColor(90,85,80); doc.setFontSize(7.5);
    exLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    wy += ansBoxH + 5;

    var dc = document.getElementById('dc'+i);
    if (dc) {
      doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
      doc.setFontSize(7); doc.setFont('helvetica','bold');
      doc.rect(M,wy,TW,8,'F'); doc.text(t('pdf-work'), M+4, wy+5.5);
      wy += 11;
      try {
        var imgD = dc.toDataURL('image/png');
        var ar   = dc.height / dc.width;
        var iw   = TW;
        var ih   = Math.min(iw * ar, 68);
        doc.addImage(imgD, 'PNG', M, wy, iw, ih);
        wy += ih + 4;
      } catch(e) {}
    }

    var ta = document.getElementById('ta'+i);
    if (ta && ta.value.trim()) {
      if (wy > PH-30) { doc.addPage(); wy = 20; }
      doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('courier','normal');
      var taLines = doc.splitTextToSize(ta.value, TW);
      taLines.slice(0,16).forEach(function(ln) {
        if (wy > PH-15) { doc.addPage(); wy = 20; }
        doc.text(ln, M, wy); wy += 5;
      });
      wy += 2;
    }

    var pp = document.getElementById('pp'+i);
    if (pp && pp.src && pp.src.indexOf('data:') === 0) {
      if (wy > PH-55) { doc.addPage(); wy = 20; }
      try { doc.addImage(pp.src, 'JPEG', M, wy, TW, 68); wy += 72; } catch(e) {}
    }
  }

  var pages = doc.internal.getNumberOfPages();
  for (var p = 1; p <= pages; p++) {
    doc.setPage(p);
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0, PH-3, PW, 3, 'F');
    doc.setTextColor(130,140,160); doc.setFontSize(6.5); doc.setFont('helvetica','normal');
    doc.text(name+'  ·  '+group+'  ·  '+t('pdf-code')+code+'  ·  '+t('pdf-page')+p+'/'+pages,
      PW/2, PH-5, {align:'center'});
  }

  var _fn = SCHOOL.filePrefix + '_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf';
  var _pdfBlob = doc.output('blob');
  var _blobUrl = URL.createObjectURL(_pdfBlob);
  var _a = document.createElement('a');
  _a.href = _blobUrl;
  _a.download = _fn;
  document.body.appendChild(_a);
  _a.click();
  setTimeout(function(){ document.body.removeChild(_a); URL.revokeObjectURL(_blobUrl); }, 200);
  btn.textContent = t('btn-pdf');
  btn.disabled  = false;
}
</script>
</body>
</html>
