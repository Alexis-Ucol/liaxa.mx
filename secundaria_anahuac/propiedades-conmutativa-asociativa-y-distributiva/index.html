<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Propiedades Conmutativa, Asociativa y Distributiva</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--gold-bg); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }

/* ── MANIPULATIVES ── */
.mstage { font-size:.7rem; letter-spacing:.09em; text-transform:uppercase; color:var(--text3); margin-bottom:.45rem; }
.mlabel { font-size:.82rem; color:var(--text2); margin-bottom:.55rem; }
.mexpr { font-family:'IBM Plex Mono',monospace; font-size:1.1rem; font-weight:600; color:var(--green-dark); background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:.75rem .8rem; text-align:center; overflow-x:auto; white-space:nowrap; }
.mexpr.big { font-size:1.22rem; }
.mrow { display:flex; gap:.45rem; flex-wrap:wrap; align-items:center; margin-top:.65rem; }
.mbtn { background:var(--surface2); border:1.5px solid var(--border); border-radius:8px; padding:.5rem .8rem; font-size:.83rem; cursor:pointer; color:var(--text); font-family:inherit; min-height:44px; text-align:left; }
.mbtn:hover { border-color:var(--green); background:var(--green-bg); }
.mbtn.on { background:var(--green); color:var(--green-bg); border-color:var(--green); }
.mbtn.mono { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mbtn.wide { flex:1; min-width:135px; text-align:center; }
.mfb { margin-top:.7rem; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.6rem .8rem; font-size:.82rem; color:var(--text2); min-height:2.6rem; }
.mfb.good { background:var(--ok-bg); border-left-color:var(--ok); color:var(--ok); }
.mfb.warn { background:var(--bad-bg); border-left-color:var(--bad); color:var(--bad); }
.mcanvas { display:block; width:100%; height:150px; touch-action:none; }
.mcanvas.tall { height:200px; cursor:ew-resize; }
.mtrack { font-size:.72rem; color:var(--text3); margin-top:.5rem; letter-spacing:.03em; }
.eqbox { display:grid; grid-template-columns:1fr 1fr; gap:.5rem; align-items:stretch; margin-top:.7rem; }
@media(max-width:520px){ .eqbox { grid-template-columns:1fr; } }
.eqside { background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:.6rem .5rem; text-align:center; font-family:'IBM Plex Mono',monospace; font-size:.84rem; color:var(--text2); }
.eqside b { display:block; font-size:1.08rem; color:var(--green-dark); margin-top:.25rem; }
.mtiles { display:flex; gap:.3rem; flex-wrap:wrap; align-items:center; justify-content:center; margin:.2rem 0; }
.mtile { font-family:'IBM Plex Mono',monospace; font-size:1rem; font-weight:600; background:var(--surface2); border:1.5px solid var(--border); border-radius:8px; min-width:44px; min-height:44px; display:inline-flex; align-items:center; justify-content:center; color:var(--green-dark); padding:0 .5rem; }
.mtile.op { color:var(--gold); border-style:dashed; cursor:pointer; font-family:inherit; font-size:1.05rem; }
.mtile.op:hover { background:var(--gold-bg); border-color:var(--gold); }
.mtile.par { border:none; background:none; color:var(--text3); font-size:1.35rem; min-width:12px; padding:0; }
.mstep { display:flex; gap:.5rem; align-items:center; margin-top:.55rem; font-size:.8rem; color:var(--text2); }
.mstep .mbtn { min-height:40px; padding:.35rem .7rem; }
.mval { font-family:'IBM Plex Mono',monospace; font-weight:700; color:var(--green); font-size:1rem; min-width:2.4rem; text-align:center; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Propiedades Conmutativa, Asociativa y Distributiva</div>
    <div class="wcourse" id="wcourse-el">Matemáticas · 1° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);

  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');

}

  var dateStr = new Date().toLocaleString('es-MX', { dateStyle:'long', timeStyle:'short' });

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS — INJECTION BLOCK ─────────────────────────────────────────
  //   Match these RGB values to --green and --gold above.
  //   PRIMARY  → pBR, pBG, pBB
  //   ACCENT   → pAR, pAG, pAB
  // ──────────────────────────────────────────────────────────────────────────
  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;  // PRIMARY (from SCHOOL, Rule 16)
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;   // ACCENT (from SCHOOL, Rule 16)

  function pdfText(html) {
    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/\u2192/g,'->').replace(/\u2212/g,'-').replace(/\u00b2/g,'^2')
      .replace(/\u00b3/g,'^3').replace(/\u00d7/g,'x').replace(/\u00f7/g,'/')
      .replace(/\u2260/g,'!=').replace(/\u2264/g,'<=').replace(/\u2265/g,'>=')
      .replace(/\u221a/g,'sqrt').replace(/\u03c0/g,'pi').replace(/\u2026/g,'...')

  var lx = PW - M - 36;

  doc.setFillColor(pAR,pAG,pAB); doc.circle(lx+5.66, ly+2.57, 0.9, 'F');
  doc.setDrawColor(pAR,pAG,pAB); doc.setLineWidth(0.7);

  // ── Student info card (name + group only — código goes to footer) ──

  // ── Score box ──

  // ── Problem summary table ──
  doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
  doc.setFontSize(7); doc.setFont('helvetica','bold');
  doc.rect(M,142,TW,8,'F'); doc.text('RESUMEN DE PROBLEMAS', M+4, 148);
  var sy = 154;
  problems.forEach(function(prob, i) {
    if (sy + 12 > PH - 15) {

    var ok = document.getElementById('pc'+i).classList.contains('ok');

    doc.circle(M+6, sy+5, 2.5, 'F');

    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var qy = wy+12;
    qLines.forEach(function(ln,li){ doc.text(ln, M+4, qy+li*5); });
    wy += qBoxH + 4;

    var isOk   = document.getElementById('pc'+i).classList.contains('ok');
    var chosen = prob.studentChoice != null ? pdfText(prob.options[prob.studentChoice]||'-') : '-';
    var corr   = pdfText(prob.options[prob.correctIdx]||'');
    var expRaw = pdfText(prob.explanation||'');
    doc.setFontSize(8.5); var chLines = doc.splitTextToSize('Alumno: '+chosen, TW-18);
    doc.setFontSize(8);   var coLines = doc.splitTextToSize('Correcto: '+corr, TW-18);
    doc.setFontSize(7.5); var exLines = doc.splitTextToSize('Solución: '+expRaw, TW-18).slice(0,4);
    var ansBoxH = 8 + chLines.length*5.5 + coLines.length*5 + exLines.length*5 + 6;
    doc.setFillColor(isOk?232:255, isOk?240:232, isOk?232:228);
    doc.roundedRect(M,wy,TW,ansBoxH,2,2,'F');
    doc.setFillColor(isOk?26:176, isOk?106:48, isOk?74:16);
    doc.circle(M+7, wy+8, 3.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(9); doc.setFont('helvetica','bold');
    doc.text(isOk?'✓':'✗', M+5.2, wy+10.5);
    var ay = wy+7;
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','bold');
    chLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5.5); });
    ay += chLines.length*5.5 + 3;
    doc.setTextColor(26,106,74); doc.setFontSize(8); doc.setFont('helvetica','normal');
    coLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    ay += coLines.length*5 + 3;
    doc.setTextColor(90,85,80); doc.setFontSize(7.5);

    doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
    doc.setFontSize(7); doc.setFont('helvetica','bold');
    doc.rect(M,wy,TW,8,'F'); doc.text('TRABAJO DEL ALUMNO', M+4, wy+5.5);
    wy += 11;

    var dc = document.getElementById('dc'+i);
    if (dc) {
      try {
        var imgD = dc.toDataURL('image/png');
        var ar   = dc.height / dc.width;
        var iw   = TW;
        var ih   = Math.min(iw * ar, 68);
        doc.addImage(imgD, 'PNG', M, wy, iw, ih);
        wy += ih + 4;
      } catch(e) {}
    }

    var ta = document.getElementById('ta'+i);
    if (ta && ta.value.trim()) {
      if (wy > PH-30) { doc.addPage(); wy = 20; }
      doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('courier','normal');
      var taLines = doc.splitTextToSize(ta.value, TW);
      taLines.slice(0,16).forEach(function(ln) {
        if (wy > PH-15) { doc.addPage(); wy = 20; }
        doc.text(ln, M, wy); wy += 5;
      });
      wy += 2;
    }

    var pp = document.getElementById('pp'+i);
    if (pp && pp.src && pp.src.indexOf('data:') === 0) {
      if (wy > PH-55) { doc.addPage(); wy = 20; }
      try { doc.addImage(pp.src, 'JPEG', M, wy, TW, 68); wy += 72; } catch(e) {}
    }
  }

  // ── Footer on every page ──
  var pages = doc.internal.getNumberOfPages();
  for (var p = 1; p <= pages; p++) {
    doc.setPage(p);
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0, PH-3, PW, 3, 'F');
    doc.setTextColor(130,140,160); doc.setFontSize(6.5); doc.setFont('helvetica','normal');
    doc.text(name+'  ·  '+group+'  ·  Código: '+code+'  ·  Página '+p+'/'+pages,
      PW/2, PH-5, {align:'center'});
  }

  doc.save('mat1_t03_g02_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf');
  btn.innerHTML = '⬇ &nbsp;Descargar Resultados PDF';
  btn.disabled  = false;
}

/* ══════════════════════════════════════════════════════════════════════════
   GUIDE CONTENT: mat1_t03_g02
   Operaciones y sus relaciones inversas / 1 de Secundaria
   Propiedades conmutativa, asociativa y distributiva + jerarquia
   ══════════════════════════════════════════════════════════════════════════ */
function L(o){ if(o===null||o===undefined) return ''; if(typeof o!=='object') return String(o); return (o[LANG]!==undefined?o[LANG]:o.es); }
function numStr(n){ return n<0 ? '−'+Math.abs(n) : String(n); }
function par(n){ return n<0 ? '(−'+Math.abs(n)+')' : String(n); }
function addT(n){ return n<0 ? ' − '+Math.abs(n) : ' + '+n; }
function q2(x){ return Math.round(x*100)/100; }
function ri(r,a,b){ return a + Math.floor(r()*(b-a+1)); }
function cssVar(n){ try { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); } catch(e){ return ''; } }
function shuffleOpts(opts, correct, rng){ var a=shuffle(opts,rng); return { options:a, correctIdx:a.indexOf(correct) }; }
function mkNums(correct, cands){
  var out=[correct], i;
  for(i=0;i<cands.length && out.length<4;i++){ if(out.indexOf(cands[i])<0) out.push(cands[i]); }
  var d=1;
  while(out.length<4){
    if(out.indexOf(correct+d)<0) out.push(correct+d);
    if(out.length<4 && out.indexOf(correct-d)<0) out.push(correct-d);
    d++;
  }
  return out;
}
function numOptions(correct, cands){
  return { options: mkNums(correct,cands).map(function(v){ return numStr(v); }), correct: numStr(correct) };
}
function txtOptions(correct, others){ return { options:[correct].concat(others), correct:correct }; }
function addSection(html){
  var d=document.createElement('div'); d.className='section'; d.innerHTML=html;
  document.getElementById('lessonBody').appendChild(d); return d;
}
function addProblem(rng, cfg){
  var so = shuffleOpts(cfg.options, cfg.correct, rng);
  problems.push({ title:cfg.title, questionText:cfg.questionText, fn:cfg.fn||'', hint:cfg.hint,
    explanation:cfg.explanation, options:so.options, correctIdx:so.correctIdx,
    showWork:!!cfg.showWork, studentChoice:null, pendingChoice:null });
  buildOneCard(problems[problems.length-1], problems.length-1);
}
function subRng(rng, tag){ return seededRng(tag + Math.floor(rng()*1000000)); }
function setFb(id, txt, kind){ var e=document.getElementById(id); if(!e) return; e.innerHTML=txt; e.className='mfb'+(kind?(' '+kind):''); }
function actv(btn){ var row=btn.parentNode.querySelectorAll('.mbtn'), i; for(i=0;i<row.length;i++) row[i].classList.remove('on'); btn.classList.add('on'); }

/* ═════════ WIDGET 1 · intercambiador de parejas (conmutativa) ═════════ */
var W1 = { a:6, b:-4, op:'+', moves:0, solved:false };
function w1Step(which, d){
  if(which==='a') W1.a = Math.max(-12, Math.min(12, W1.a + d));
  else W1.b = Math.max(-12, Math.min(12, W1.b + d));
  W1.moves++; w1Render();
}
function w1Op(op, btn){ W1.op = op; actv(btn); W1.moves++; w1Render(); }
function w1Val(x, y, op){
  if(op==='+') return x+y;
  if(op==='−') return x-y;
  if(op==='×') return x*y;
  return y===0 ? null : q2(x/y);
}
function w1Expr(x, y, op){ return op==='+' ? (numStr(x)+addT(y)) : (numStr(x)+' '+op+' '+par(y)); }
function w1Show(v){ return v===null ? L({es:'sin definir',en:'undefined'}) : numStr(v); }
function w1Render(){
  var a=W1.a, b=W1.b, op=W1.op;
  var ea=document.getElementById('w1a'); if(!ea) return;
  var v1=w1Val(a,b,op), v2=w1Val(b,a,op);
  ea.textContent = numStr(a);
  document.getElementById('w1b').textContent = numStr(b);
  document.getElementById('w1L').innerHTML = w1Expr(a,b,op)+'<b>'+w1Show(v1)+'</b>';
  document.getElementById('w1R').innerHTML = w1Expr(b,a,op)+'<b>'+w1Show(v2)+'</b>';
  var same = (v1!==null && v2!==null && v1===v2);
  if(op==='+' || op==='×'){
    setFb('w1fb', L({es:'Los dos resultados coinciden. Mueve los números todo lo que quieras: con esta operación el orden no altera el resultado.',
                     en:'Both results agree. Move the numbers as much as you like: with this operation the order does not change the result.'}), 'good');
  } else if(same){
    W1.solved = true;
    setFb('w1fb', L({es:'¡Lo lograste! Con estos dos números en particular los dos órdenes coinciden, pero un caso aislado no alcanza para decir que la operación cumple la propiedad.',
                     en:'You made it. With these two particular numbers both orders agree, yet a single case is not enough to say the operation satisfies the property.'}), 'good');
  } else {
    var gap = (v1===null||v2===null) ? null : Math.abs(q2(v1-v2));
    var extra = (W1.moves>=6 && !W1.solved) ? L({es:' Pista: esa separación es el doble de la distancia entre los dos números.',
                                                 en:' Hint: that gap is twice the distance between the two numbers.'}) : '';
    if(gap===null){
      setFb('w1fb', L({es:'Uno de los dos órdenes no se puede calcular porque nadie puede dividir entre cero. Cambia los números.',
                       en:'One of the two orders cannot be worked out because nothing can be divided by zero. Change the numbers.'}), 'warn');
    } else {
      setFb('w1fb', L({es:'Los dos resultados se separan por '+numStr(gap)+'. Acerca los números para reducir esa separación.',
                       en:'The two results are '+numStr(gap)+' apart. Bring the numbers closer to shrink that gap.'})+extra, 'warn');
    }
  }
}

/* ═════════ WIDGET 2 · movedor de paréntesis (asociativa) ═════════ */
var W2 = { round:0, tries:0, a:0, b:0, c:0, op:'+', group:'L', revealed:false, done:false, rng:null };
function w2Op(x, y, op){ if(op==='+') return x+y; if(op==='−') return x-y; return x*y; }
function w2Term(op, x){ return op==='+' ? addT(x) : (' '+op+' '+par(x)); }
function w2Str(g){
  var a=W2.a, b=W2.b, c=W2.c, op=W2.op;
  if(g==='L') return '('+numStr(a)+w2Term(op,b)+')'+w2Term(op,c);
  return numStr(a)+' '+op+' ('+numStr(b)+w2Term(op,c)+')';
}
function w2New(){
  var r=W2.rng, ops=['+','−','×','−'];
  W2.op = ops[Math.floor(r()*ops.length)];
  if(W2.op==='×'){ W2.a=ri(r,2,6); W2.b=-ri(r,2,5); W2.c=ri(r,2,5); }
  else if(W2.op==='+'){ W2.a=ri(r,-9,14); if(W2.a===0) W2.a=6; W2.b=ri(r,2,11); W2.c=ri(r,2,9); }
  else { W2.a=ri(r,-6,16); if(W2.a===0) W2.a=7; W2.b=ri(r,-8,11); if(W2.b===0) W2.b=4; W2.c=ri(r,2,9); }
  W2.tries=0; W2.revealed=false; W2.group='L';
  var bs=document.querySelectorAll('#w2move .mbtn'), i;
  for(i=0;i<bs.length;i++) bs[i].classList.remove('on');
  if(bs[0]) bs[0].classList.add('on');
  w2Render();
  setFb('w2fb', L({es:'Caso '+(W2.round+1)+' de 3. Mueve el paréntesis con los dos botones y observa cómo cambia la agrupación. Después decide si las dos formas darán el mismo resultado.',
                   en:'Case '+(W2.round+1)+' of 3. Move the parentheses with the two buttons and watch the grouping change. Then decide whether both forms will give the same result.'}));
}
function w2Move(g, btn){ W2.group=g; actv(btn); w2Render(); }
function w2Render(){
  var e=document.getElementById('w2expr'); if(!e) return;
  e.textContent = w2Str(W2.group);
  var vl=w2Op(w2Op(W2.a,W2.b,W2.op),W2.c,W2.op), vr=w2Op(W2.a,w2Op(W2.b,W2.c,W2.op),W2.op);
  var sh=W2.revealed;
  document.getElementById('w2L').innerHTML = w2Str('L')+'<b>'+(sh?numStr(vl):'?')+'</b>';
  document.getElementById('w2R').innerHTML = w2Str('R')+'<b>'+(sh?numStr(vr):'?')+'</b>';
  var tr=document.getElementById('w2round');
  if(tr) tr.textContent = L({es:'Caso '+Math.min(W2.round+1,3)+' de 3',en:'Case '+Math.min(W2.round+1,3)+' of 3'});
}
function w2Predict(same){
  if(W2.done || W2.revealed) return;
  var vl=w2Op(w2Op(W2.a,W2.b,W2.op),W2.c,W2.op), vr=w2Op(W2.a,w2Op(W2.b,W2.c,W2.op),W2.op);
  var real = (vl===vr);
  if(same===real){
    W2.revealed=true; w2Render();
    if(real) setFb('w2fb', L({es:'Correcto: las dos formas valen '+numStr(vl)+'. Con esta operación el paréntesis se puede mover sin que el resultado cambie.',
                              en:'Right: both forms come out to '+numStr(vl)+'. With this operation the parentheses can move without changing the result.'}), 'good');
    else setFb('w2fb', L({es:'Correcto: una forma vale '+numStr(vl)+' y la otra '+numStr(vr)+', una diferencia de '+numStr(Math.abs(vl-vr))+'. Aquí el lugar del paréntesis decide el resultado.',
                          en:'Right: one form is '+numStr(vl)+' and the other is '+numStr(vr)+', a difference of '+numStr(Math.abs(vl-vr))+'. Here the place of the parentheses decides the result.'}), 'good');
    return;
  }
  W2.tries++;
  if(W2.tries>=3){
    W2.revealed=true; w2Render();

                     en:'Look at the two values now shown: '+numStr(vl)+' and '+numStr(vr)+'. '+(real?'They are equal, so here the parentheses can move.':'They differ, so here the parentheses cannot move.')}), 'warn');

function w2Next(){

/* ═════════ WIDGET 3 · rectángulo repartido (distributiva) ═════════ */
var W3 = { a:3, T:9, b:4, target:12, tries:0, solved:false, drag:false, geo:null, rng:null };
function w3New(){
  var r=W3.rng;

                   en:'Drag the golden line across the rectangle. The green part has to end up with exactly '+numStr(W3.target)+' squares.'}));
}
function w3StepA(d){ W3.a=Math.max(2,Math.min(6,W3.a+d)); w3Draw(); w3Info(); w3Judge(); }
function w3StepT(d){ W3.T=Math.max(4,Math.min(12,W3.T+d)); if(W3.b>W3.T-1) W3.b=W3.T-1; w3Draw(); w3Info(); w3Judge(); }
function w3Draw(){
  var cv=document.getElementById('w3canvas'); if(!cv) return;
  var rc=cv.getBoundingClientRect(); if(rc.width<10) return;
  var dpr=window.devicePixelRatio||1;
  cv.width=rc.width*dpr; cv.height=rc.height*dpr;
  var ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
  var W=rc.width, H=rc.height; ctx.clearRect(0,0,W,H);
  var padL=32, padR=14, padT=28, padB=20;
  var gw=W-padL-padR, gh=H-padT-padB;
  var cw=gw/W3.T, ch=gh/W3.a;
  W3.geo={padL:padL,padT:padT,cw:cw,ch:ch,gh:gh};
  var i,j;
  for(i=0;i<W3.T;i++){

      ctx.fillRect(padL+i*cw, padT+j*ch, cw, ch);
      ctx.strokeStyle = cssVar('--border'); ctx.lineWidth=1;
      ctx.strokeRect(padL+i*cw, padT+j*ch, cw, ch);
    }
  }
  ctx.strokeStyle=cssVar('--gold'); ctx.lineWidth=4;
  ctx.beginPath(); ctx.moveTo(padL+W3.b*cw, padT-10); ctx.lineTo(padL+W3.b*cw, padT+gh+8); ctx.stroke();
  ctx.font='600 12px "IBM Plex Mono", monospace'; ctx.textAlign='center';
  ctx.fillStyle=cssVar('--green');
  ctx.fillText(String(W3.b), padL+W3.b*cw/2, padT-14);
  ctx.fillStyle=cssVar('--gold');
  ctx.fillText(String(W3.T-W3.b), padL+W3.b*cw+(W3.T-W3.b)*cw/2, padT-14);
  ctx.fillStyle=cssVar('--text2'); ctx.textAlign='right';
  ctx.fillText(String(W3.a), padL-10, padT+gh/2+4);
  ctx.font='400 10px "IBM Plex Sans", sans-serif'; ctx.textAlign='left';

}
function w3Info(){
  var a=W3.a, b=W3.b, c=W3.T-W3.b;
  var e1=document.getElementById('w3eq1'); if(!e1) return;
  e1.innerHTML = a+' × ('+b+' + '+c+') = '+a+' × '+(b+c)+'<b>'+(a*(b+c))+'</b>';
  document.getElementById('w3eq2').innerHTML = a+' × '+b+' + '+a+' × '+c+' = '+(a*b)+' + '+(a*c)+'<b>'+(a*b+a*c)+'</b>';
  var g=document.getElementById('w3green'); if(g) g.textContent = numStr(a*b);
  var t=document.getElementById('w3target'); if(t) t.textContent = numStr(W3.target);
}
function w3Judge(){
  if(W3.solved) return;
  var a=W3.a, green=a*W3.b, t=W3.target;
  if(green===t){
    W3.solved=true;
    setFb('w3fb', L({es:'¡Exacto! '+a+' filas de '+W3.b+' dan '+numStr(t)+' cuadros verdes, y el rectángulo completo sigue valiendo lo mismo aunque muevas la línea.',
                     en:'Exactly. '+a+' rows of '+W3.b+' give '+numStr(t)+' green squares, and the whole rectangle keeps the same value even when you move the line.'}), 'good');
    return;
  }
  if(t % a !== 0){
    setFb('w3fb', L({es:'Con un alto de '+a+' no puedes formar exactamente '+numStr(t)+' cuadros verdes, porque '+numStr(t)+' no se reparte en filas iguales de '+a+'. Cambia el alto.',
                     en:'With a height of '+a+' you cannot build exactly '+numStr(t)+' green squares, because '+numStr(t)+' does not split into equal rows of '+a+'. Change the height.'}), 'warn');
    return;
  }
  if(t/a > W3.T-1){
    setFb('w3fb', L({es:'Necesitas '+numStr(t/a)+' columnas verdes y el ancho total es demasiado corto. Sube el ancho total.',
                     en:'You need '+numStr(t/a)+' green columns and the total width is too short. Raise the total width.'}), 'warn');
    return;
  }
  W3.tries++;
  var diff = t - green;
  if(W3.tries>=3){
    W3.b = t/a; W3.solved=true; w3Draw(); w3Info();
    setFb('w3fb', L({es:'La línea iba después de la columna '+numStr(t/a)+': '+a+' × '+numStr(t/a)+' = '+numStr(t)+'. Ya quedó colocada; observa que el total del rectángulo no cambió.',
                     en:'The line belonged after column '+numStr(t/a)+': '+a+' × '+numStr(t/a)+' = '+numStr(t)+'. It is placed now; notice the total of the rectangle did not change.'}), 'warn');
    return;
  }
  if(diff>0) setFb('w3fb', L({es:'La parte verde tiene '+numStr(green)+' cuadros y te faltan '+numStr(diff)+'. Mueve la línea hacia la derecha.',
                              en:'The green part has '+numStr(green)+' squares and you are short by '+numStr(diff)+'. Move the line to the right.'}), 'warn');
  else setFb('w3fb', L({es:'La parte verde tiene '+numStr(green)+' cuadros y te sobran '+numStr(-diff)+'. Mueve la línea hacia la izquierda.',
                        en:'The green part has '+numStr(green)+' squares and you are over by '+numStr(-diff)+'. Move the line to the left.'}), 'warn');
}
function w3Bind(){
  var cv=document.getElementById('w3canvas'); if(!cv || cv.getAttribute('data-bound')) return;
  cv.setAttribute('data-bound','1');
  function set(e){
    var rc=cv.getBoundingClientRect(), src=e.touches?e.touches[0]:e, g=W3.geo;
    if(!g) return;
    var col=Math.round((src.clientX-rc.left-g.padL)/g.cw);
    col=Math.max(1,Math.min(W3.T-1,col));
    if(col!==W3.b){ W3.b=col; w3Draw(); w3Info(); }
  }
  cv.addEventListener('mousedown', function(e){ e.preventDefault(); W3.drag=true; set(e); }, {passive:false});
  cv.addEventListener('mousemove', function(e){ if(W3.drag){ e.preventDefault(); set(e); } }, {passive:false});
  cv.addEventListener('mouseup', function(){ if(W3.drag){ W3.drag=false; w3Judge(); } });
  cv.addEventListener('mouseleave', function(){ if(W3.drag){ W3.drag=false; w3Judge(); } });
  cv.addEventListener('touchstart', function(e){ e.preventDefault(); W3.drag=true; set(e); }, {passive:false});
  cv.addEventListener('touchmove', function(e){ e.preventDefault(); set(e); }, {passive:false});
  cv.addEventListener('touchend', function(){ W3.drag=false; w3Judge(); });
}

/* ═════════ WIDGET 4 · torre de jerarquía ═════════ */
var W4 = { round:0, tries:0, toks:[], orig:[], done:false, rng:null };
function w4n(v){ return {k:'n',v:v}; }
function w4o(v){ return {k:'o',v:v}; }
function w4Build(r){
  var s=Math.floor(r()*4), p,q,u,v,d,k,tot;
  if(s===0){ p=ri(r,4,15); q=ri(r,2,9); u=ri(r,2,6); v=ri(r,2,12);
    return [w4n(p),w4o('+'),w4n(q),w4o('×'),w4n(u),w4o('−'),w4n(v)]; }
  if(s===1){ p=ri(r,3,12); q=ri(r,2,9); u=ri(r,2,6); v=ri(r,3,15);
    return [{k:'('},w4n(p),w4o('+'),w4n(q),{k:')'},w4o('×'),w4n(u),w4o('−'),w4n(v)]; }
  if(s===2){ p=ri(r,12,30); q=ri(r,2,7); u=ri(r,3,9); v=ri(r,2,8);
    return [w4n(p),w4o('−'),w4n(q),w4o('×'),{k:'('},w4n(u),w4o('−'),w4n(v),{k:')'}]; }
  d=ri(r,2,6); k=ri(r,2,7); tot=d*k; p=ri(r,2,tot-2); q=tot-p; v=ri(r,2,12);
  return [{k:'('},w4n(p),w4o('+'),w4n(q),{k:')'},w4o('÷'),w4n(d),w4o('+'),w4n(v)];
}
function w4Scope(toks){
  var open=-1, close=-1, i, j;
  for(i=0;i<toks.length;i++){
    if(toks[i].k==='(') open=i;
    else if(toks[i].k===')' && open>=0){ close=i; break; }
  }
  var lo = open>=0 ? open+1 : 0, hi = open>=0 ? close-1 : toks.length-1;
  var idx=-1;
  for(j=lo;j<=hi;j++) if(toks[j].k==='o' && (toks[j].v==='×'||toks[j].v==='÷')){ idx=j; break; }
  if(idx<0) for(j=lo;j<=hi;j++) if(toks[j].k==='o'){ idx=j; break; }
  return {idx:idx, lo:lo, hi:hi, paren:(open>=0)};
}
function w4Val(a, op, b){ if(op==='+') return a+b; if(op==='−') return a-b; if(op==='×') return a*b; return b===0?a:q2(a/b); }
function w4Apply(toks, idx){
  var res = w4Val(toks[idx-1].v, toks[idx].v, toks[idx+1].v);
  var out = toks.slice(0,idx-1).concat([w4n(res)], toks.slice(idx+2)), i;
  for(i=0;i+2<out.length;i++){
    if(out[i].k==='(' && out[i+1].k==='n' && out[i+2].k===')'){
      out = out.slice(0,i).concat([out[i+1]], out.slice(i+3)); break;
    }
  }
  return out;
}
function w4Render(){
  var host=document.getElementById('w4expr'); if(!host) return;
  var h='', i, t;
  for(i=0;i<W4.toks.length;i++){
    t=W4.toks[i];
    if(t.k==='n') h+='<span class="mtile">'+numStr(t.v)+'</span>';
    else if(t.k==='o') h+='<button class="mtile op" onclick="w4Click('+i+')">'+t.v+'</button>';
    else h+='<span class="mtile par">'+(t.k==='('?'(':')')+'</span>';
  }
  host.innerHTML=h;
  var tr=document.getElementById('w4round');
  if(tr) tr.textContent = L({es:'Cálculo '+Math.min(W4.round+1,3)+' de 3',en:'Calculation '+Math.min(W4.round+1,3)+' of 3'});
}
function w4Why(i, sc){
  var t=W4.toks[i], nx=W4.toks[sc.idx];
  if(sc.paren && (i<sc.lo || i>sc.hi))
    return L({es:'Todavía no: lo que está dentro del paréntesis se resuelve antes que todo lo demás.',
              en:'Not yet: whatever sits inside the parentheses is resolved before everything else.'});
  if((t.v==='+'||t.v==='−') && nx && (nx.v==='×'||nx.v==='÷'))
    return L({es:'Todavía no: queda una multiplicación o una división pendiente y esas van antes de sumar o restar.',
              en:'Not yet: a multiplication or a division is still pending, and those come before adding or subtracting.'});
  return L({es:'Todavía no: cuando quedan operaciones del mismo nivel, se resuelven de izquierda a derecha.',
            en:'Not yet: when operations of the same level remain, they are resolved from left to right.'});
}
function w4End(){
  if(W4.toks.length===1 && W4.toks[0].k==='n'){
    setFb('w4fb', L({es:'Cálculo terminado: el resultado es '+numStr(W4.toks[0].v)+'. Pasa al siguiente con el botón de abajo.',
                     en:'Calculation finished: the result is '+numStr(W4.toks[0].v)+'. Move to the next one with the button below.'}), 'good');
  }
}
function w4Click(i){
  if(W4.done) return;
  if(W4.toks.length===1) return;
  var sc=w4Scope(W4.toks);
  if(sc.idx===i){
    var a=W4.toks[i-1].v, opv=W4.toks[i].v, b=W4.toks[i+1].v, res=w4Val(a,opv,b);
    W4.toks=w4Apply(W4.toks,i); W4.tries=0; w4Render();
    setFb('w4fb', L({es:'Bien: '+numStr(a)+' '+opv+' '+par(b)+' = '+numStr(res)+'. Ese paso ya está resuelto; elige el siguiente.',
                     en:'Good: '+numStr(a)+' '+opv+' '+par(b)+' = '+numStr(res)+'. That step is done; choose the next one.'}), 'good');
    w4End(); return;
  }
  W4.tries++;
  if(W4.tries>=3){
    var a2=W4.toks[sc.idx-1].v, op2=W4.toks[sc.idx].v, b2=W4.toks[sc.idx+1].v, r2=w4Val(a2,op2,b2);
    W4.toks=w4Apply(W4.toks,sc.idx); W4.tries=0; w4Render();
    setFb('w4fb', L({es:'El paso que tocaba era '+numStr(a2)+' '+op2+' '+par(b2)+' = '+numStr(r2)+'. Ya quedó aplicado; observa cómo se acortó la expresión.',
                     en:'The step that was due is '+numStr(a2)+' '+op2+' '+par(b2)+' = '+numStr(r2)+'. It is applied now; notice how the expression got shorter.'}), 'warn');
    w4End(); return;
  }

}
function w4Reset(){
  if(W4.done) return;
  W4.tries=0; W4.toks=W4.orig.slice(); w4Render();
  setFb('w4fb', L({es:'La expresión volvió a su forma inicial. Toca la operación que se resuelve primero.',
                   en:'The expression is back to its starting form. Tap the operation that gets resolved first.'}));
}
function w4Next(){
  if(W4.done) return;
  if(W4.round>=2){
    W4.done=true;
    setFb('w4fb', L({es:'Ordenaste los pasos de tres cálculos distintos. El turno de cada operación es lo que decide el resultado final.',
                     en:'You ordered the steps of three different calculations. The turn of each operation is what decides the final result.'}), 'good');
    return;
  }
  W4.round++; W4.tries=0; W4.toks=w4Build(W4.rng); W4.orig=W4.toks.slice(); w4Render();
  setFb('w4fb', L({es:'Toca la operación que se resuelve primero.',en:'Tap the operation that gets resolved first.'}));
}

/* ═════════ WIDGET 5 · máquina de ida y vuelta (inversas) ═════════ */
var W5 = { round:0, tries:0, s:0, op:'+', v:1, r:0, land:null, keys:[], done:false, rng:null };
function w5Apply(x, op, v){ if(op==='+') return x+v; if(op==='−') return x-v; if(op==='×') return x*v; return v===0?x:q2(x/v); }
function w5Inv(){ return W5.op==='+' ? '−' : (W5.op==='−' ? '+' : '÷'); }
function w5New(){
  var r=W5.rng, kinds=['+','−','×'];
  W5.op = kinds[Math.floor(r()*kinds.length)];
  W5.s = ri(r,-8,8);
  if(W5.op==='×'){
    if(W5.s===0) W5.s=3;
    W5.v=ri(r,2,4);
    var guard=0;
    while(guard<24 && (W5.s+W5.v===W5.s*W5.v || W5.s-W5.v===W5.s*W5.v)){
      W5.s = (W5.s>=8 ? -8 : W5.s+1); if(W5.s===0) W5.s=1; guard++;
    }
    W5.r=W5.s*W5.v;
  }
  else { W5.v=ri(r,3,11); W5.r = (W5.op==='+') ? W5.s+W5.v : W5.s-W5.v; }
  W5.land=null; W5.tries=0;
  W5.keys = shuffle(['+','−','×','÷'], r);
  w5Keys(); w5Draw();
  setFb('w5fb', L({es:'La máquina tomó '+numStr(W5.s)+', aplicó '+W5.op+' '+W5.v+' y quedó en '+numStr(W5.r)+'. Elige la tecla que lo devuelve al punto de partida.',
                   en:'The machine took '+numStr(W5.s)+', applied '+W5.op+' '+W5.v+' and landed on '+numStr(W5.r)+'. Choose the key that brings it back to the starting point.'}));
}
function w5Keys(){
  var host=document.getElementById('w5keys'); if(!host) return;
  var h='', i;
  for(i=0;i<W5.keys.length;i++) h+='<button class="mbtn mono" onclick="w5Press('+i+')">'+W5.keys[i]+' '+W5.v+'</button>';
  host.innerHTML=h;
  var tr=document.getElementById('w5round');
  if(tr) tr.textContent = L({es:'Viaje '+Math.min(W5.round+1,3)+' de 3',en:'Trip '+Math.min(W5.round+1,3)+' of 3'});
}
function w5Press(i){
  if(W5.done) return;
  var op=W5.keys[i], land=w5Apply(W5.r, op, W5.v);
  W5.land=land; w5Draw();
  if(land===W5.s){
    setFb('w5fb', L({es:'¡Regresaste al punto de partida! '+numStr(W5.r)+' '+op+' '+W5.v+' = '+numStr(W5.s)+'. Esa tecla deshace exactamente lo que hizo la máquina.',
                     en:'You are back at the starting point. '+numStr(W5.r)+' '+op+' '+W5.v+' = '+numStr(W5.s)+'. That key undoes exactly what the machine did.'}), 'good');
    return;
  }
  W5.tries++;
  if(W5.tries>=3){
    W5.land=W5.s; w5Draw();
    setFb('w5fb', L({es:'La tecla que deshace '+W5.op+' '+W5.v+' es '+w5Inv()+' '+W5.v+': '+numStr(W5.r)+' '+w5Inv()+' '+W5.v+' = '+numStr(W5.s)+'. El punto ya volvió a su lugar.',
                     en:'The key that undoes '+W5.op+' '+W5.v+' is '+w5Inv()+' '+W5.v+': '+numStr(W5.r)+' '+w5Inv()+' '+W5.v+' = '+numStr(W5.s)+'. The point is back in place.'}), 'warn');
    return;
  }
  setFb('w5fb', L({es:'Con esa tecla caes en '+numStr(land)+', no en '+numStr(W5.s)+': te quedaste a '+numStr(Math.abs(q2(land-W5.s)))+' de distancia. Prueba otra tecla.',
                   en:'That key lands you on '+numStr(land)+', not on '+numStr(W5.s)+': you stayed '+numStr(Math.abs(q2(land-W5.s)))+' away. Try another key.'}), 'warn');
}
function w5Reset(){ if(W5.done) return; W5.land=null; w5Draw(); }
function w5Next(){
  if(W5.done) return;
  if(W5.round>=2){
    W5.done=true;
    setFb('w5fb', L({es:'Tres viajes de ida y vuelta. Cada operación tiene una que la deshace, y eso sirve para comprobar cualquier resultado.',
                     en:'Three round trips. Every operation has one that undoes it, and that is how any result can be checked.'}), 'good');
    return;
  }
  W5.round++; w5New();
}
function w5Draw(){
  var cv=document.getElementById('w5canvas'); if(!cv) return;
  var rc=cv.getBoundingClientRect(); if(rc.width<10) return;
  var dpr=window.devicePixelRatio||1;
  cv.width=rc.width*dpr; cv.height=rc.height*dpr;
  var ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
  var W=rc.width, H=rc.height; ctx.clearRect(0,0,W,H);
  var vals=[W5.s, W5.r, 0]; if(W5.land!==null) vals.push(W5.land);
  var mn=Math.floor(Math.min.apply(null,vals))-2, mx=Math.ceil(Math.max.apply(null,vals))+2;
  var span=Math.max(4,mx-mn), step= span<=24?2:(span<=50?5:10);
  var padX=22, y=H*0.66, v0, x;
  function px(v){ return padX + (v-mn)/span*(W-2*padX); }
  ctx.strokeStyle=cssVar('--border'); ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(padX,y); ctx.lineTo(W-padX,y); ctx.stroke();
  ctx.font='400 9px "IBM Plex Mono", monospace'; ctx.textAlign='center';
  for(v0=Math.ceil(mn/step)*step; v0<=mx; v0+=step){
    x=px(v0);
    ctx.strokeStyle=cssVar('--border'); ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(x,y-5); ctx.lineTo(x,y+5); ctx.stroke();
    ctx.fillStyle=cssVar('--text3'); ctx.fillText(numStr(v0), x, y+18);
  }
  ctx.font='600 10px "IBM Plex Mono", monospace';
  ctx.fillStyle=cssVar('--green');
  ctx.beginPath(); ctx.arc(px(W5.s), y, 6, 0, 6.2832); ctx.fill();

  ctx.beginPath(); ctx.arc(px(W5.r), y, 5, 0, 6.2832); ctx.fill();

  })();
}
</script>

<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbzLGV15JRTPs9bbSvHRLfgOXeT9oUExDf1AH546WOwq5tYxXSdhX212OWi_bTJfMGx9/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'Propiedades Conmutativa, Asociativa y Distributiva';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
