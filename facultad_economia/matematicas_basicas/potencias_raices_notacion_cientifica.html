      '<div class="stag">Concepto 2</div>' +
      '<h2>Raíces, exponentes fraccionarios y la tasa media</h2>' +
      '<p>Una <strong>raíz</strong> es la operación que deshace una potencia. Si elevar el factor a los años dice a dónde llega el negocio, la raíz de orden igual al número de años dice a qué ritmo llegó. Por eso la raíz se escribe también como <strong>exponente fraccionario</strong>: la raíz de orden n es el exponente uno sobre n, y no hay dos operaciones distintas sino una sola leída en dos direcciones. Esta equivalencia es la que permite bajar una tasa anual a mensual, subir una mensual a anual o repartir un crecimiento acumulado entre los periodos que lo produjeron.</p>' +
      '<p>El uso más frecuente en una empresa es la <strong>tasa media de crecimiento</strong>. Dadas las ventas del primer año y las del último, la tasa media anual es la que, sostenida todo el horizonte, lleva exactamente de una cifra a la otra. Es la <strong>media geométrica</strong> de los factores anuales y nunca su media aritmética. La diferencia no es de estilo: como los años se multiplican entre sí, promediar sumando produce siempre una tasa más alta que la real, y esa cifra inflada es la que después se convierte en metas imposibles de sostener.</p>' +
      '<p>Hay dos reparticiones que conviene distinguir con cuidado. Repartir el <strong>cambio total</strong> entre el número de años es una división, y responde a la pregunta de cuánto tocaría por año si el crecimiento fuera lineal. Extraer la <strong>raíz</strong> del factor total responde a la pregunta de qué tasa constante reproduce la trayectoria, y es la que se reporta. La misma distinción aparece al bajar de escala: una tasa anual no se divide entre doce para volverse mensual, se le extrae la raíz de orden doce al factor, porque doce meses se multiplican unos con otros y no se suman.</p>' +
      '<p>Conviene además fijar dos hechos técnicos que se usarán todo el tiempo. Primero, la raíz de un producto es el producto de las raíces, de modo que una trayectoria hecha de tramos distintos se puede promediar por partes. Segundo, la raíz cuadrada de un factor de dos periodos es exactamente la media geométrica de esos dos periodos, que es el caso más común en los reportes trimestrales y anuales. Y una nota de prudencia: la tasa media resume la trayectoria, no la describe. Dos negocios con la misma tasa media pueden haber recorrido caminos muy distintos, y por eso la cifra se acompaña siempre del rango de años que la produjo.</p>' +

        '<div class="rcard"><div class="rname">Tasa media anual</div><div class="rform">(' + frac('V<sub>n</sub>', 'V<sub>0</sub>') + ')<sup>1/n</sup> − 1</div><div class="rnote">La que reproduce la trayectoria.</div></div>' +

    return '' +
      '<div class="stag">Concept 2</div>' +
      '<h2>Roots, fractional exponents and the average rate</h2>' +
      '<p>A <strong>root</strong> is the operation that undoes a power. If raising the factor to the years says where the business lands, the root of order equal to the number of years says at what pace it got there. That is why a root is also written as a <strong>fractional exponent</strong>: the root of order n is the exponent one over n, and there are not two different operations but a single one read in two directions. This equivalence is what allows an annual rate to be brought down to a monthly one, a monthly one to be lifted to an annual one, or an accumulated growth to be spread over the periods that produced it.</p>' +
      '<p>The most frequent use in a company is the <strong>average growth rate</strong>. Given the sales of the first year and those of the last, the average annual rate is the one that, held for the whole horizon, leads exactly from one figure to the other. It is the <strong>geometric mean</strong> of the annual factors and never their arithmetic mean. The difference is not one of style: since the years multiply each other, averaging by adding always produces a rate higher than the real one, and that inflated figure is what later turns into targets nobody can hold.</p>' +
      '<p>There are two ways of splitting that deserve careful separation. Splitting the <strong>total change</strong> by the number of years is a division, and it answers the question of how much would fall to each year if growth were linear. Taking the <strong>root</strong> of the total factor answers the question of which constant rate reproduces the path, and that is the one reported. The same distinction appears when the scale drops: an annual rate is not divided by twelve to become monthly, the twelfth root of the factor is taken, because twelve months multiply each other rather than adding up.</p>' +
      '<p>Two technical facts are worth fixing here, since they will be used throughout. First, the root of a product is the product of the roots, so a path made of different stretches can be averaged piece by piece. Second, the square root of a two period factor is exactly the geometric mean of those two periods, which is the most common case in quarterly and annual reporting. And a note of caution: the average rate summarises the path, it does not describe it. Two businesses with the same average rate may have travelled very different roads, which is why the figure always travels with the range of years that produced it.</p>' +
      '<div class="rules-grid">' +
        '<div class="rcard"><div class="rname">Root as an exponent</div><div class="rform">√<sup>n</sup> x = x<sup>1/n</sup></div><div class="rnote">One idea in two directions.</div></div>' +
        '<div class="rcard"><div class="rname">Average annual rate</div><div class="rform">(' + frac('V<sub>n</sub>', 'V<sub>0</sub>') + ')<sup>1/n</sup> − 1</div><div class="rnote">The one that reproduces the path.</div></div>' +
        '<div class="rcard"><div class="rname">Split by division</div><div class="rform">' + frac('total change', 'number of years') + '</div><div class="rnote">Another question, another figure.</div></div>' +
        '<div class="rcard"><div class="rname">From annual to monthly</div><div class="rform">(1 + i)<sup>1/12</sup> − 1</div><div class="rnote">Never the rate over twelve.</div></div>' +
      '</div>' +
      '<p><strong>Worked example.</strong> Analysis compares the first year of the series, with sales of ' + money(c2A) + ', against the last one, with sales of ' + money(c2B) + '. Between the two figures ' + yearsEn(c2n) + ' of growth went by.</p>' +
      '<div class="callout"><p><strong>Step 1.</strong> The total factor of the period is ' + dec4(c2B / c2A) + ', that is an accumulated change of ' + moveEn1(c2B / c2A - 1) + '.<br>' +
      '<strong>Step 2.</strong> The average annual rate is the root of order ' + intN(c2n) + ' of that factor minus one, and it lands at ' + pct2(c2cag) + '.<br>' +
      '<strong>Step 3.</strong> Splitting the accumulated change over the years would have given ' + pct2(c2flat) + ', a rate that held for the whole horizon would overshoot the final figure.<br>' +
      '<strong>Step 4.</strong> Brought down to the month, that same average rate amounts to ' + pct2(c2mes) + ' monthly, and not to the annual one divided by twelve.<br>' +
      '<strong>Business reading.</strong> The figure reported to the board is the average rate, because it is the only one that, applied year after year, lands back on ' + money(c2B) + '. Checking it is immediate: raise the annual factor to the years of the horizon and verify that it reproduces the total. If it does not reproduce it, the rate is wrong however reasonable it looks.</p></div>';

        en: 'A supplier of Distribuidora del Pacífico applies a surcharge of ' + pct0(p4i) + ' a year to invoices paid after the due date, and the contract makes clear that the surcharge accumulates on the already surcharged balance. Credit control needs to post the surcharge month by month in the system, so that twelve months of delay end up costing exactly what the contract says. Which of the following statements is correct?' },

            en: 'Ask yourself which operation undoes twelve chained months: if every month multiplies the previous one, joining the twelve is raising to a power, and separating them calls for the opposite operation. Keep in mind that what accumulates is the factor and not the bare rate, so the root applies to one plus the rate. As a check, any candidate monthly rate has to rebuild the annual surcharge after twelve months.' },
    exp: { es: 'El contrato describe un recargo que se acumula sobre sí mismo, así que el factor del año es el factor del mes elevado a doce y la tasa mensual es la raíz de orden doce de ese factor menos uno, ' + pct2(s4ok) + '. La opción de ' + pct2(s4div) + ' divide la tasa anual entre doce y por eso cobra de más: doce meses a esa tasa acumulan ' + pct2(effAnnual(s4div, 12)) + ' anual en lugar del ' + pct0(p4i) + ' pactado. La de ' + pct2(s4root) + ' extrae la raíz de la tasa suelta y no del factor, y basta mirarla para descartarla, porque ningún recargo mensual de esa magnitud produciría un cargo anual tan moderado. La última afirma que no existe tasa equivalente; el saldo sí cambia con el monto de la factura, pero la tasa es una proporción y por eso no depende de la cantidad sobre la que se aplica. Comprueba la respuesta elevando ' + dec4(1 + s4ok) + ' a la doceava potencia: regresas a ' + dec4(1 + p4i) + '.',
           en: 'The contract describes a surcharge that accumulates on itself, so the factor of the year is the factor of the month raised to twelve and the monthly rate is the twelfth root of that factor minus one, ' + pct2(s4ok) + '. The option of ' + pct2(s4div) + ' divides the annual rate by twelve and therefore overcharges: twelve months at that rate accumulate ' + pct2(effAnnual(s4div, 12)) + ' a year instead of the agreed ' + pct0(p4i) + '. The one of ' + pct2(s4root) + ' takes the root of the bare rate rather than of the factor, and one look is enough to discard it, because no monthly surcharge of that size would produce so moderate an annual charge. The last one claims no equivalent rate exists; the balance does change with the amount of the invoice, but a rate is a proportion and so it does not depend on the quantity it is applied to. Check the answer by raising ' + dec4(1 + s4ok) + ' to the twelfth power: you land back on ' + dec4(1 + p4i) + '.' }

  /* ═══════════════════════ CONCEPT 3 ═══════════════════════ */
  var c3fac = pvFactor(c3r, c3n);

  addSection(function(L) {
    var es = L === 'es';
    if (es) return '' +
      '<div class="stag">Concepto 3</div>' +
      '<h2>Exponente cero, exponentes negativos y el valor de hoy</h2>' +
      '<p>Las dos extensiones que faltan de la potencia no se inventaron por gusto: se siguen de la ley del cociente. Si dividir potencias de la misma base resta exponentes, entonces dividir una potencia entre sí misma deja exponente cero, y como cualquier cantidad dividida entre sí misma vale uno, el <strong>exponente cero</strong> vale uno para toda base distinta de cero. En una proyección financiera esto tiene una lectura muy concreta: el factor del año cero es uno porque todavía no ha pasado nada, y por eso un peso de hoy vale exactamente un peso.</p>' +
      '<p>Si la resta de exponentes continúa por debajo de cero aparece el <strong>exponente negativo</strong>, que no significa una cantidad negativa sino un recíproco: elevar a menos n es dividir entre la potencia n. Aquí está toda la mecánica del <strong>valor presente</strong>. Crecer multiplica por el factor tantas veces como periodos haya; traer al presente divide entre ese mismo factor las mismas veces. Una operación deshace a la otra, y por eso el resultado nunca depende de por dónde se empiece a calcular.</p>' +
      '<p>El error que la tesorería ve con más frecuencia es quitar el rendimiento por resta. Restar tantos puntos como años haya de espera no equivale a dividir entre el factor elevado a esos años, y la brecha crece con el plazo hasta volverse absurda: la resta llega a producir valores negativos, mientras el factor correcto se acerca a cero sin tocarlo nunca. Ese comportamiento asintótico es el mismo del exponente negativo en cualquier base mayor que uno, y conviene reconocerlo porque es la firma visual de un descuento bien calculado.</p>' +
      '<p>De aquí sale además el criterio comercial que ordena buena parte de las negociaciones de crédito. Si un cliente pide plazo, el costo de concederlo es la diferencia entre el monto pactado y su valor de hoy; si un proveedor ofrece descuento por pago anticipado, conviene aceptarlo solo cuando el descuento supera lo que la tesorería obtendría por conservar el dinero. En los dos casos la decisión se toma comparando cantidades llevadas a la misma fecha, y llevarlas ahí es exactamente lo que hace el exponente con signo negativo.</p>' +
      '<div class="rules-grid">' +
        '<div class="rcard"><div class="rname">Exponente cero</div><div class="rform">x<sup>0</sup> = 1</div><div class="rnote">Hoy no ha pasado nada todavía.</div></div>' +
        '<div class="rcard"><div class="rname">Exponente negativo</div><div class="rform">x<sup>−n</sup> = ' + frac('1', 'x<sup>n</sup>') + '</div><div class="rnote">Un recíproco, no un negativo.</div></div>' +
        '<div class="rcard"><div class="rname">Factor de descuento</div><div class="rform">(1 + i)<sup>−n</sup></div><div class="rnote">Siempre entre cero y uno.</div></div>' +
        '<div class="rcard"><div class="rname">Valor de hoy</div><div class="rform">F × (1 + i)<sup>−n</sup></div><div class="rnote">Dividir, nunca restar.</div></div>' +
      '</div>' +
      '<p><strong>Ejemplo resuelto.</strong> Una cadena de mueblerías propone liquidar un pedido de ' + money(c3F) + ' hasta dentro de ' + yearsEs(c3n) + '. La tesorería de Distribuidora del Pacífico coloca sus excedentes a ' + pct0(c3r) + ' anual.</p>' +
      '<div class="callout"><p><strong>Paso 1.</strong> Esperar ' + yearsEs(c3n) + ' con ese rendimiento deja un factor de descuento de ' + dec4(c3fac) + ', que está entre cero y uno como debe estar.<br>' +
      '<strong>Paso 2.</strong> El cobro futuro vale hoy ' + money(c3pv) + ', porque el monto pactado se divide entre el factor de crecimiento del plazo.<br>' +
      '<strong>Paso 3.</strong> Conceder el plazo cuesta ' + money(c3F - c3pv) + ', y ese es el descuento máximo que conviene ofrecer a cambio de pago inmediato.<br>' +
      '<strong>Paso 4.</strong> Restar la tasa una vez por año habría dado ' + money(c3sub) + ', una cifra distinta que además se derrumba a valores imposibles en plazos largos.<br>' +
      '<strong>Lectura de negocio.</strong> La comprobación de todo cálculo de valor presente es hacerlo al derecho: si ' + money(c3pv) + ' se invierten hoy a ' + pct0(c3r) + ' durante ' + yearsEs(c3n) + ', se convierten otra vez en ' + money(c3F) + '. Nota que el resultado no depende del tamaño de la empresa ni de su humor, solo del rendimiento al que puede colocar su dinero, y por eso dos empresas distintas valoran el mismo plazo de manera distinta.</p></div>';
    return '' +
      '<div class="stag">Concept 3</div>' +
      '<h2>Zero and negative exponents, and the value of today</h2>' +
      '<p>The two remaining extensions of the power were not invented for pleasure: they follow from the quotient law. If dividing powers of the same base subtracts exponents, then dividing a power by itself leaves exponent zero, and since any quantity divided by itself is one, the <strong>zero exponent</strong> is worth one for every base other than zero. In a financial projection this has a very concrete reading: the factor of year zero is one because nothing has happened yet, and that is why a peso of today is worth exactly one peso.</p>' +
      '<p>If the subtraction of exponents continues below zero, the <strong>negative exponent</strong> appears, which does not mean a negative quantity but a reciprocal: raising to minus n is dividing by the n-th power. Here lies the whole mechanics of <strong>present value</strong>. Growing multiplies by the factor as many times as there are periods; bringing to the present divides by that same factor the same number of times. One operation undoes the other, and that is why the result never depends on where the calculation starts.</p>' +
      '<p>The mistake treasury sees most often is taking the return off by subtraction. Subtracting as many points as there are years of waiting is not the same as dividing by the factor raised to those years, and the gap widens with the term until it turns absurd: the subtraction reaches negative values, while the correct factor approaches zero without ever touching it. That asymptotic behaviour belongs to the negative exponent in any base greater than one, and it is worth recognising because it is the visual signature of a properly calculated discount.</p>' +
      '<p>From here also comes the commercial criterion that orders much of any credit negotiation. If a customer asks for a term, the cost of granting it is the difference between the agreed amount and its value today; if a supplier offers a discount for early payment, it is worth taking only when the discount beats what treasury would earn by keeping the money. In both cases the decision is made by comparing quantities carried to the same date, and carrying them there is exactly what the exponent with a minus sign does.</p>' +
      '<div class="rules-grid">' +
        '<div class="rcard"><div class="rname">Zero exponent</div><div class="rform">x<sup>0</sup> = 1</div><div class="rnote">Nothing has happened today yet.</div></div>' +
        '<div class="rcard"><div class="rname">Negative exponent</div><div class="rform">x<sup>−n</sup> = ' + frac('1', 'x<sup>n</sup>') + '</div><div class="rnote">A reciprocal, not a negative.</div></div>' +
        '<div class="rcard"><div class="rname">Discount factor</div><div class="rform">(1 + i)<sup>−n</sup></div><div class="rnote">Always between zero and one.</div></div>' +
        '<div class="rcard"><div class="rname">Value today</div><div class="rform">F × (1 + i)<sup>−n</sup></div><div class="rnote">Divide, never subtract.</div></div>' +
      '</div>' +
      '<p><strong>Worked example.</strong> A chain of furniture stores proposes to settle an order of ' + money(c3F) + ' only in ' + yearsEn(c3n) + '. Treasury at Distribuidora del Pacífico places its surplus at ' + pct0(c3r) + ' a year.</p>' +
      '<div class="callout"><p><strong>Step 1.</strong> Waiting ' + yearsEn(c3n) + ' with that return leaves a discount factor of ' + dec4(c3fac) + ', which sits between zero and one as it should.<br>' +
      '<strong>Step 2.</strong> The future collection is worth ' + money(c3pv) + ' today, because the agreed amount is divided by the growth factor of the term.<br>' +
      '<strong>Step 3.</strong> Granting the term costs ' + money(c3F - c3pv) + ', and that is the largest discount worth offering in exchange for immediate payment.<br>' +
      '<strong>Step 4.</strong> Subtracting the rate once a year would have given ' + money(c3sub) + ', a different figure that also collapses into impossible values over long terms.<br>' +
      '<strong>Business reading.</strong> The check on any present value calculation is to run it forwards: if ' + money(c3pv) + ' are invested today at ' + pct0(c3r) + ' for ' + yearsEn(c3n) + ', they turn back into ' + money(c3F) + '. Notice that the result depends neither on the size of the company nor on its mood, only on the return at which it can place its money, which is why two different companies value the same term differently.</p></div>';
  });

  widgetDiscount(w3F, w3r, w3n);

  var o5 = valOpts(s5ok, [s5sub, s5up, s5div], money, rng);
  var q5i = {
    title: { es: 'El pedido que se cobra hasta después', en: 'The order that gets collected much later' },
    q: { es: 'Una cadena de mueblerías propone a Distribuidora del Pacífico liquidar un pedido de ' + money(p5F) + ' en un solo pago al término de ' + yearsEs(p5n) + ', sin abonos intermedios. La tesorería coloca sus excedentes a ' + pct0(p5r) + ' anual con capitalización anual y quiere saber a cuánto equivale hoy esa promesa de pago para decidir si acepta el plazo o insiste en el contado. ¿Cuánto vale hoy ese cobro futuro?',
        en: 'A chain of furniture stores proposes to Distribuidora del Pacífico that an order of ' + money(p5F) + ' be settled in a single payment at the end of ' + yearsEn(p5n) + ', with no instalments in between. Treasury places its surplus at ' + pct0(p5r) + ' a year with annual compounding and wants to know what that promise of payment amounts to today in order to decide whether to accept the term or hold out for cash. What is that future collection worth today?' },
    opts: { es: o5.es, en: o5.en },

      '<p>La aritmética hereda las leyes del primer bloque. Al multiplicar dos cantidades, las mantisas se multiplican y los exponentes se <strong>suman</strong>; al dividirlas, las mantisas se dividen y los exponentes se <strong>restan</strong>. Si la mantisa del resultado se sale del rango, se recorre el punto y se ajusta el exponente en un paso. Este procedimiento no es una comodidad tipográfica: permite estimar de cabeza el resultado de una división enorme y detectar de inmediato un error de tres ceros, que en una hoja de cálculo pasaría inadvertido.</p>' +

function applyUIStrings() {
  var set = function(id, txt) { var e = document.getElementById(id); if (e) e.textContent = txt; };
  var ph  = function(id, txt) { var e = document.getElementById(id); if (e) e.placeholder = txt; };
  set('wtitle-el',    SCHOOL.guideTitle[LANG]);

  set('htitle-el',    SCHOOL.guideTitle[LANG]);

  set('lbl-group-el', t('lbl-group'));

  set('restoreTitle', t('restore-title'));
  set('restoreMsg',   t('restore-msg'));
  set('restoreBtn',   t('btn-restore'));
  set('dismissBtn',   t('btn-dismiss'));
  set('dlBtn',        t('btn-pdf'));
  ph('sName',  t('ph-name'));
  ph('sGroup', t('ph-group'));

  var lr = document.getElementById('logo-right');  if (lr) lr.alt = SCHOOL.logoRightAlt;
}
/* Rebuilds the visible text of every card without touching the numbers. */
function applyProblemLang() {
  problems.forEach(function(p, i) {
    var card = document.getElementById('pc' + i);
    if (!card || !p.i18n) return;
    p.title        = p.i18n.title[LANG];
    p.questionText = p.i18n.q[LANG];
    p.hint         = p.i18n.hint[LANG];
    p.explanation  = p.i18n.exp[LANG];
    p.options      = p.i18n.opts[LANG].slice();
    var ti = card.querySelector('.ptitle'); if (ti) ti.textContent = p.title;
    var st = card.querySelector('.pstmt');  if (st) st.innerHTML = p.questionText;
    var hb = card.querySelector('.hintbox'); if (hb) hb.innerHTML = p.hint;
    var hbtn = card.querySelector('.hintbtn'); if (hbtn) hbtn.textContent = t('btn-hint');
    card.querySelectorAll('.mcopt').forEach(function(o, oi) {
      if (p.options[oi] !== undefined) o.innerHTML = p.options[oi];
    });
    var tabs = card.querySelectorAll('.wtab');
    if (tabs.length === 3) {
      tabs[0].textContent = t('tab-draw');
      tabs[1].textContent = t('tab-type');
      tabs[2].textContent = t('tab-photo');
    }
    var tools = card.querySelectorAll('.tbtn2');
    if (tools.length === 3) {
      tools[0].textContent = t('tool-pen');
      tools[1].textContent = t('tool-mark');
      tools[2].textContent = t('tool-erase');
    }
    var clr = card.querySelector('.clrbtn'); if (clr) clr.textContent = t('tool-clear');
    var ta  = card.querySelector('.wtextarea'); if (ta) ta.placeholder = t('ph-work');
    var pzt = card.querySelector('.pztxt'); if (pzt) pzt.textContent = t('ph-photo');
    var lab = card.querySelector('.pbody > div:last-child > div:first-child');
    if (lab) lab.textContent = t('lbl-answer');
    var fb = card.querySelector('.mcfb');
    if (fb && fb.classList.contains('show')) {
      var isOk = (p.studentChoice === p.correctIdx);
      fb.innerHTML = '<strong>' + (isOk ? t('fb-correct') : t('fb-wrong')) + '</strong> ' + p.explanation;
    }
  });
}
function setLang(l) {
  LANG = l;
  try { localStorage.setItem(LANG_KEY, l); } catch(e) {}
  document.documentElement.setAttribute('lang', l);
  var be = document.getElementById('btn-es'), bn = document.getElementById('btn-en');
  if (be) be.classList.toggle('active', l === 'es');
  if (bn) bn.classList.toggle('active', l === 'en');
  applyUIStrings();
  applySectionLang();
  applyProblemLang();
  widgets.forEach(function(f) { try { f(); } catch(e) {} });
  document.querySelectorAll('#lessonBody .section').forEach(function(s) { s.classList.add('vis'); });
}
(function() {
  try { var stored = localStorage.getItem(LANG_KEY); if (stored === 'es' || stored === 'en') LANG = stored; } catch(e) {}
  document.addEventListener('DOMContentLoaded', function() {
    document.documentElement.setAttribute('lang', LANG);
    var be = document.getElementById('btn-es'), bn = document.getElementById('btn-en');
    if (be) be.classList.toggle('active', LANG === 'es');
    if (bn) bn.classList.toggle('active', LANG === 'en');
    applyUIStrings();
  });
})();

      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/’/g, String.fromCharCode(39))
      .replace(/→/g,'->').replace(/−/g,'-').replace(/²/g,'^2')

      .replace(/μ/g,'mu').replace(/σ/g,'sigma').replace(/α/g,'alpha').replace(/β/g,'beta')
      .replace(/₀/g,'0').replace(/₁/g,'1').replace(/₂/g,'2').replace(/·/g,'*')

  doc.text(t('pdf-student'), M+4, 79); doc.text(t('pdf-group'), 130, 79);
  doc.setTextColor(20,24,32); doc.setFontSize(11); doc.setFont('helvetica','bold');
  doc.text(name, M+4, 87); doc.text(group, 130, 87);

  var sc = pct>=70?[26,106,74]:pct>=50?[224,123,26]:[176,48,16];
  doc.setFillColor(255,255,255); doc.roundedRect(M,100,TW,34,4,4,'F');
  doc.setDrawColor(sc[0],sc[1],sc[2]); doc.setLineWidth(0.8);
  doc.roundedRect(M,100,TW,34,4,4,'S');
  doc.setTextColor(sc[0],sc[1],sc[2]); doc.setFontSize(40); doc.setFont('helvetica','bold');
  doc.text(pct+'%', PW/2, 124, {align:'center'});
  doc.setTextColor(130,140,160); doc.setFontSize(8.5); doc.setFont('helvetica','normal');
  doc.text(correctCount+' '+t('pdf-score')+' '+total+' '+t('pdf-questions'), PW/2, 131, {align:'center'});

  doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
  doc.setFontSize(7); doc.setFont('helvetica','bold');
  doc.rect(M,142,TW,8,'F'); doc.text(t('pdf-summary'), M+4, 148);
  var sy = 154;
  problems.forEach(function(prob, i) {
    if (sy + 12 > PH - 15) {
      doc.addPage(); sy = 20;
      doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
      doc.setFontSize(7); doc.setFont('helvetica','bold');
      doc.rect(M,sy,TW,8,'F'); doc.text(t('pdf-summary2'), M+4, sy+6);
      sy += 12;
    }
    var ok = document.getElementById('pc'+i).classList.contains('ok');
    doc.setFillColor(ok?232:255, ok?240:232, ok?232:228);
    doc.roundedRect(M,sy,TW,10,2,2,'F');
    doc.setFillColor(ok?26:176, ok?106:48, ok?74:16);
    doc.circle(M+6, sy+5, 2.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(7); doc.setFont('helvetica','bold');
    doc.text(ok?'v':'x', M+4.5, sy+6.5);
    doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('helvetica','normal');
    doc.text(t('pdf-item')+' '+(i+1)+': '+pdfText(prob.title), M+12, sy+6.5);
    doc.setTextColor(ok?26:176, ok?106:48, ok?74:16);
    doc.text(ok?t('pdf-ok'):t('pdf-bad'), PW-M-24, sy+6.5);
    sy += 12;
  });

  for (var i = 0; i < problems.length; i++) {
    var prob = problems[i];
    doc.addPage();
    var wy = 0;

    doc.setFillColor(pBR,pBG,pBB); doc.rect(0,0,PW,20,'F');
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,3,'F');
    doc.setTextColor(pAR,pAG,pAB); doc.setFontSize(7); doc.setFont('helvetica','normal');
    doc.text(SCHOOL.courseName[LANG]+'  ·  '+SCHOOL.guideTitle[LANG], M, 10);
    doc.setTextColor(240,244,238); doc.setFontSize(10.5); doc.setFont('helvetica','bold');
    doc.text(t('pdf-item')+' '+(i+1)+' '+t('pdf-of')+' '+total+'  ·  '+pdfText(prob.title), M, 17);
    wy = 25;

    var qRaw = pdfText(prob.questionText);
    doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var qLines = doc.splitTextToSize(qRaw, TW-10);
    var qBoxH  = 8 + qLines.length*5 + 3;
    doc.setFillColor(237,240,245); doc.roundedRect(M,wy,TW,qBoxH,2,2,'F');
    doc.setTextColor(pBR,pBG,pBB); doc.setFontSize(6.5); doc.setFont('helvetica','bold');
    doc.text(t('pdf-question'), M+4, wy+6);
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var qy = wy+12;
    qLines.forEach(function(ln,li){ doc.text(ln, M+4, qy+li*5); });
    wy += qBoxH + 4;

    var isOk   = document.getElementById('pc'+i).classList.contains('ok');
    var chosen = prob.studentChoice != null ? pdfText(prob.options[prob.studentChoice]||'') : '';
    var corr   = pdfText(prob.options[prob.correctIdx]||'');
    var expRaw = pdfText(prob.explanation||'');
    doc.setFontSize(8.5); var chLines = doc.splitTextToSize(t('pdf-yours')+chosen, TW-18);
    doc.setFontSize(8);   var coLines = doc.splitTextToSize(t('pdf-key')+corr, TW-18);
    doc.setFontSize(7.5); var exLines = doc.splitTextToSize(t('pdf-sol')+expRaw, TW-18).slice(0,4);
    var ansBoxH = 8 + chLines.length*5.5 + coLines.length*5 + exLines.length*5 + 6;
    doc.setFillColor(isOk?232:255, isOk?240:232, isOk?232:228);
    doc.roundedRect(M,wy,TW,ansBoxH,2,2,'F');
    doc.setFillColor(isOk?26:176, isOk?106:48, isOk?74:16);
    doc.circle(M+7, wy+8, 3.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(9); doc.setFont('helvetica','bold');
    doc.text(isOk?'v':'x', M+5.2, wy+10.5);
    var ay = wy+7;
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','bold');
    chLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5.5); });
    ay += chLines.length*5.5 + 3;
    doc.setTextColor(26,106,74); doc.setFontSize(8); doc.setFont('helvetica','normal');
    coLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    ay += coLines.length*5 + 3;
    doc.setTextColor(90,85,80); doc.setFontSize(7.5);
    exLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    wy += ansBoxH + 5;

    var dc = document.getElementById('dc'+i);
    if (dc) {
      doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
      doc.setFontSize(7); doc.setFont('helvetica','bold');
      doc.rect(M,wy,TW,8,'F'); doc.text(t('pdf-work'), M+4, wy+5.5);
      wy += 11;
      try {
        var imgD = dc.toDataURL('image/png');
        var ar   = dc.height / dc.width;
        var iw   = TW;
        var ih   = Math.min(iw * ar, 68);
        doc.addImage(imgD, 'PNG', M, wy, iw, ih);
        wy += ih + 4;
      } catch(e) {}
    }

    var ta = document.getElementById('ta'+i);
    if (ta && ta.value.trim()) {
      if (wy > PH-30) { doc.addPage(); wy = 20; }
      doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('courier','normal');
      var taLines = doc.splitTextToSize(ta.value, TW);
      taLines.slice(0,16).forEach(function(ln) {
        if (wy > PH-15) { doc.addPage(); wy = 20; }
        doc.text(ln, M, wy); wy += 5;
      });
      wy += 2;
    }

    var pp = document.getElementById('pp'+i);
    if (pp && pp.src && pp.src.indexOf('data:') === 0) {
      if (wy > PH-55) { doc.addPage(); wy = 20; }
      try { doc.addImage(pp.src, 'JPEG', M, wy, TW, 68); wy += 72; } catch(e) {}
    }
  }

  var pages = doc.internal.getNumberOfPages();
  for (var p = 1; p <= pages; p++) {
    doc.setPage(p);
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0, PH-3, PW, 3, 'F');
    doc.setTextColor(130,140,160); doc.setFontSize(6.5); doc.setFont('helvetica','normal');
    doc.text(name+'  ·  '+group+'  ·  '+t('pdf-code')+code+'  ·  '+t('pdf-page')+p+'/'+pages,
      PW/2, PH-5, {align:'center'});
  }

  var _fn = SCHOOL.filePrefix + '_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf';
  var _pdfBlob = doc.output('blob');
  var _blobUrl = URL.createObjectURL(_pdfBlob);
  var _a = document.createElement('a');
  _a.href = _blobUrl;
  _a.download = _fn;
  document.body.appendChild(_a);
  _a.click();
  setTimeout(function(){ document.body.removeChild(_a); URL.revokeObjectURL(_blobUrl); }, 200);
  btn.textContent = t('btn-pdf');
  btn.disabled  = false;
}
</script>
</body>
</html>
