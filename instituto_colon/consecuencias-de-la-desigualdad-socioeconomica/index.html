<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consecuencias de la Desigualdad Socioeconómica</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }

/* ── INTERACTIVE WIDGETS ── */
.wgt { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.1rem; margin:1rem 0; }
.wgt-h { font-size:.68rem; letter-spacing:.11em; text-transform:uppercase; color:var(--text3); margin-bottom:.55rem; font-weight:600; }
.wgt-q { font-size:.9rem; font-weight:600; margin-bottom:.6rem; }
.wcase { background:var(--surface2); border-left:4px solid var(--gold); border-radius:0 8px 8px 0; padding:.75rem .9rem; font-size:.88rem; color:var(--text2); margin-bottom:.8rem; }
.wmsg { margin-top:.7rem; font-size:.83rem; padding:.6rem .8rem; border-radius:8px; background:var(--surface2); color:var(--text2); }
.wmsg.ok { background:var(--ok-bg); color:var(--ok); }
.wmsg.warn { background:var(--gold-bg); color:var(--text2); border-left:3px solid var(--gold); }
.wprog { font-size:.72rem; color:var(--text3); margin-top:.5rem; letter-spacing:.04em; }
.wrow { display:flex; gap:.5rem; flex-wrap:wrap; }
.wbtn { background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:.45rem .9rem; font-size:.78rem; cursor:pointer; color:var(--text2); margin-top:.65rem; min-height:44px; }
.wbtn:hover { border-color:var(--green); color:var(--green); }
.wsteplbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.09em; color:var(--gold); font-weight:700; margin:.7rem 0 .35rem; }

/* opciones internas de los widgets */
.opts2 { display:flex; flex-direction:column; gap:.45rem; margin-top:.5rem; }
.opt2 { background:var(--surface2); border:1.5px solid var(--border); border-radius:8px; padding:.58rem .8rem; font-size:.82rem; cursor:pointer; color:var(--text2); transition:all .14s; min-height:44px; display:flex; align-items:center; }
.opt2:hover { border-color:var(--green); color:var(--green); }
.opt2.miss { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.opt2.good { border-color:var(--ok); background:var(--ok-bg); color:var(--ok); }
.opt2.lock { pointer-events:none; opacity:.55; }

/* widget 1: tarjeta de caso + etiqueta de derecho */
.casetag { display:inline-flex; align-items:center; gap:.35rem; font-size:.7rem; letter-spacing:.06em; text-transform:uppercase; color:var(--green-dark); background:var(--green-bg); border-radius:20px; padding:.2rem .7rem; margin-bottom:.5rem; font-weight:600; }
.rtrack { display:flex; gap:.3rem; margin-top:.6rem; flex-wrap:wrap; }
.rdot { width:11px; height:11px; border-radius:50%; background:var(--surface2); border:1.5px solid var(--border); }
.rdot.done { background:var(--ok); border-color:var(--ok); }
.rdot.now { border-color:var(--gold); background:var(--gold-bg); }

/* widget 2: trayectorias en canvas */
.cvbox { border:1px solid var(--border); border-radius:10px; background:var(--surface2); overflow:hidden; margin-bottom:.8rem; }
.trcv { display:block; width:100%; height:250px; }
.whcv { display:block; width:100%; height:290px; }
.mdcv { display:block; width:100%; height:210px; }

/* widget 3: piezas de la rueda */
.pieces { display:flex; flex-direction:column; gap:.45rem; }
.piece { background:var(--surface2); border:1.5px solid var(--border); border-radius:8px; padding:.5rem .8rem; font-size:.81rem; cursor:pointer; color:var(--text2); transition:all .14s; min-height:44px; display:flex; align-items:center; }
.piece:hover { border-color:var(--green); color:var(--green); }
.piece.used { opacity:.35; pointer-events:none; }
.piece.miss { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }

/* widget 4: selectores de diseño de la medida */
.dsel { margin-bottom:.7rem; }
.dsel-lbl { font-size:.72rem; text-transform:uppercase; letter-spacing:.07em; color:var(--text3); margin-bottom:.3rem; }
.dopts { display:flex; gap:.4rem; flex-wrap:wrap; }
.dopt { flex:1; min-width:150px; background:var(--surface2); border:1.5px solid var(--border); border-radius:8px; padding:.5rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; min-height:44px; display:flex; align-items:center; }
.dopt:hover { border-color:var(--green); }
.dopt.on { border-color:var(--green); background:var(--green-bg); color:var(--green-dark); font-weight:600; }

/* widget 5: tablero de tres columnas */
.board { display:grid; grid-template-columns:repeat(3,1fr); gap:.5rem; margin-bottom:.8rem; }
@media(max-width:600px){ .board { grid-template-columns:1fr; } }
.bcol { border:1.5px dashed var(--border); border-radius:10px; padding:.55rem; min-height:96px; background:var(--surface2); cursor:pointer; }
.bcol:hover { border-color:var(--green); }
.bcol.armed { border-style:solid; border-color:var(--gold); background:var(--gold-bg); }
.bcol-h { font-size:.66rem; text-transform:uppercase; letter-spacing:.07em; color:var(--text3); font-weight:700; margin-bottom:.4rem; }
.bitem { background:var(--surface); border:1px solid var(--ok); color:var(--ok); border-radius:6px; padding:.35rem .5rem; font-size:.72rem; margin-bottom:.3rem; }
.cardlist { display:flex; flex-direction:column; gap:.45rem; }
.acard { background:var(--surface); border:1.5px solid var(--border); border-radius:8px; padding:.55rem .8rem; font-size:.81rem; cursor:pointer; color:var(--text2); transition:all .14s; min-height:44px; display:flex; align-items:center; }
.acard:hover { border-color:var(--green); color:var(--green); }
.acard.sel { border-color:var(--gold); background:var(--gold-bg); color:var(--text); font-weight:600; }
.acard.used { display:none; }
.acard.miss { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">

    <div class="wtitle" id="wtitle-el">Consecuencias de la Desigualdad Socioeconómica</div>

        <text x="42" y="22" class="lw-txt">LIAXA</text>

function setLang(l){
  LANG = l;
  try { localStorage.setItem(LANG_KEY, l); } catch(e){}

  if (studentData.name && document.getElementById('lessonScreen').style.display !== 'none') {

    problems = []; answeredCount = 0; correctCount = 0;
    document.getElementById('lessonBody').innerHTML = '';
    var res = document.getElementById('s_results'); res.style.display='none'; res.classList.remove('vis');
    buildLesson(seededRng(studentData.name + studentData.group + currentAttempt(studentData.name, studentData.group)));
    var obs = new IntersectionObserver(function(entries){ entries.forEach(function(e){ if(e.isIntersecting) e.target.classList.add('vis'); }); }, { threshold:0.05 });

/* ── Attempt counter + seed (Rule 4): seed = name+group+attempt ── */
function getAttemptKey(name, group){ return 'fce2_t04_g01__att__' + (name+'__'+group).replace(/\s+/g,'_'); }
function nextAttempt(name, group){ var k=getAttemptKey(name,group),n=0; try{n=parseInt(localStorage.getItem(k)||'0',10)||0;}catch(e){} n++; try{localStorage.setItem(k,String(n));}catch(e){} return n; }
function currentAttempt(name, group){ var k=getAttemptKey(name,group); try{return parseInt(localStorage.getItem(k)||'1',10)||1;}catch(e){return 1;} }
/* ================================================
   STATE
   ================================================ */
var studentData   = {};
var problems      = [];

/* ================================================
   SESSION PERSISTENCE  (localStorage)
   ================================================ */
function lsKey() {
  var n = (studentData.name  || '').trim();
  var g = (studentData.group || '').trim();
  return 'fce2_t04_g01__' + (n + '__' + g).replace(/\s+/g, '_');
}

function saveSession() {
  if (!studentData.name) return;
  var drawings = [], texts = [], photos = [];
  problems.forEach(function(p, i) {
    var dc = document.getElementById('dc' + i);
    if (dc && dc.width) {
      var blank = document.createElement('canvas');
      blank.width = dc.width; blank.height = dc.height;
      drawings.push(dc.toDataURL() === blank.toDataURL() ? null : dc.toDataURL('image/png'));
    } else { drawings.push(null); }
    var ta = document.getElementById('ta' + i);
    texts.push(ta ? ta.value : '');
    var pp = document.getElementById('pp' + i);
    photos.push((pp && pp.src && pp.src.indexOf('data:') === 0) ? pp.src : null);
  });
  var state = {
    name: studentData.name, group: studentData.group,
    answeredCount: answeredCount, correctCount: correctCount,
    choices: problems.map(function(p) { return p.studentChoice; }),
    drawings: drawings, texts: texts, photos: photos
  };
  try { localStorage.setItem(lsKey(), JSON.stringify(state)); } catch(e) {}
}

function loadSession(name, group) {
  var key = 'fce2_t04_g01__' + (name + '__' + group).replace(/\s+/g, '_');
  try { var r = localStorage.getItem(key); return r ? JSON.parse(r) : null; } catch(e) { return null; }
}

function restoreSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  var saved = loadSession(name, group);
  if (!saved) return;
  document.getElementById('restoreBar').style.display = 'none';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = currentAttempt(name, group);
  buildLesson(seededRng(name + group + att));
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
  saved.choices.forEach(function(choice, idx) {
    if (choice !== null && choice !== undefined) confirmMC(idx, choice);
  });
  setTimeout(function() {
    if (saved.drawings) {
      saved.drawings.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var dc = document.getElementById('dc' + i);
        if (!dc || !dc.width) return;
        var img = new Image();
        img.onload = function() {
          var dpr = window.devicePixelRatio || 1;
          dc.getContext('2d').drawImage(img, 0, 0, dc.width / dpr, dc.height / dpr);
        };
        img.src = dataUrl;
      });
    }
    if (saved.texts) {
      saved.texts.forEach(function(text, i) {
        if (!text) return;
        var ta = document.getElementById('ta' + i);
        if (ta) ta.value = text;
      });
    }
    if (saved.photos) {
      saved.photos.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var pp = document.getElementById('pp' + i);
        if (!pp) return;
        pp.src = dataUrl; pp.style.display = 'block';
        var pz = document.getElementById('pz' + i);
        if (pz) pz.style.opacity = '0.4';
      });
    }
  }, 300);
}

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

async function generatePDF() {
  var btn = document.getElementById('dlBtn');
  btn.textContent = 'Generando PDF…';
  btn.disabled = true;

  var jspdf   = window.jspdf;
  var doc     = new jspdf.jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });
  var PW      = 215.9;
  var M       = 18;
  var TW      = PW - M * 2;
  var PH      = doc.internal.pageSize.height;
  var name    = studentData.name;
  var group   = studentData.group;
  var total   = problems.length;
  var pct     = Math.round(correctCount / total * 100);
  var dateStr = new Date().toLocaleString('es-MX', { dateStyle:'long', timeStyle:'short' });

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS — INJECTION BLOCK ─────────────────────────────────────────
  //   Match these RGB values to --green and --gold above.
  //   PRIMARY  → pBR, pBG, pBB
  //   ACCENT   → pAR, pAG, pAB
  // ──────────────────────────────────────────────────────────────────────────
  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;  // PRIMARY (from SCHOOL, Rule 16)
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;   // ACCENT (from SCHOOL, Rule 16)

  function pdfText(html) {
    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/\u2192/g,'->').replace(/\u2212/g,'-').replace(/\u00b2/g,'^2')
      .replace(/\u00b3/g,'^3').replace(/\u00d7/g,'x').replace(/\u00f7/g,'/')
      .replace(/\u2260/g,'!=').replace(/\u2264/g,'<=').replace(/\u2265/g,'>=')
      .replace(/\u221a/g,'sqrt').replace(/\u03c0/g,'pi').replace(/\u2026/g,'...')
      .replace(/\s+/g,' ').trim();
  }

  // ── PORTADA: orange line / white logo strip / orange line / blue band ──
  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,2,'F');   // top accent line
  doc.setFillColor(255,255,255); doc.rect(0,2,PW,26,'F');                               // white logo strip
  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,28,PW,2,'F');  // bottom accent line
  doc.setFillColor(pBR,pBG,pBB); doc.rect(0,30,PW,34,'F');       // blue header band

  if (SCHOOL.logoLeftB64) {

  if (SCHOOL.logoRightB64) {
    var fmtR = SCHOOL.logoRightB64.indexOf('/9j/') > -1 ? 'JPEG' : 'PNG';
    try { doc.addImage(SCHOOL.logoRightB64, fmtR, 130, 4, 48, 22); } catch(e) {}
  }

  var lx = PW - M - 36;
  var ly = 10;
  doc.setDrawColor(pBR,pBG,pBB); doc.setLineWidth(0.7);
  doc.lines([[2.57-1.03,4.63-6.17],[4.11-2.57,5.14-4.63],[5.66-4.11,2.57-5.14]], lx+1.03, ly+6.17);
  doc.setFillColor(pAR,pAG,pAB); doc.circle(lx+5.66, ly+2.57, 0.9, 'F');
  doc.setDrawColor(pAR,pAG,pAB); doc.setLineWidth(0.7);
  doc.line(lx+8.23, ly+1.54, lx+8.23, ly+7.2);
  doc.setTextColor(pBR,pBG,pBB); doc.setFontSize(11); doc.setFont('helvetica','bold');

  doc.text(t('wtitle'), M, 49);
  doc.setTextColor(150,165,200); doc.setFontSize(8); doc.setFont('helvetica','normal');
  doc.text(dateStr, M, 59);

  doc.setTextColor(130,140,160); doc.setFontSize(8.5); doc.setFont('helvetica','bold');

  doc.setTextColor(20,24,32); doc.setFontSize(11); doc.setFont('helvetica','bold');
  doc.text(name, M+4, 87); doc.text(group, 130, 87);

  doc.setFillColor(255,255,255); doc.roundedRect(M,100,TW,34,4,4,'F');
  doc.setDrawColor(sc[0],sc[1],sc[2]); doc.setLineWidth(0.8);
  doc.roundedRect(M,100,TW,34,4,4,'S');

function S(es, en){ return LANG === 'es' ? es : en; }

function addSection(tag, html){

/* Shuffles options (Rule 7) keeping ES/EN aligned, then builds the card inline (Rule 1/5). */
function addProblem(v, rng){
  var n = v.options.es.length, idx = [], k;
  for (k = 0; k < n; k++) idx.push(k);
  for (k = n - 1; k > 0; k--) {
    var j = Math.floor(rng() * (k + 1));
    var tmp = idx[k]; idx[k] = idx[j]; idx[j] = tmp;
  }
  var langOpts = (LANG === 'es') ? v.options.es : v.options.en;
  var prob = {
    title:        v.title[LANG],
    questionText: v.stmt[LANG],
    fn:           v.fn || '',
    hint:         v.hint[LANG],
    explanation:  v.explanation[LANG],
    options:      idx.map(function(o){ return langOpts[o]; }),
    correctIdx:   idx.indexOf(v.correct),
    showWork:     !!v.showWork,
    studentChoice:null, pendingChoice:null
  };
  problems.push(prob);
  buildOneCard(prob, problems.length - 1);
}

/* Reads a CSS token so every canvas drawing follows the theme (Rule 14). */
function tok(nameStr, fallback){
  var v = getComputedStyle(document.documentElement).getPropertyValue(nameStr).trim();
  return v || fallback;
}

/* ================================================
   WIDGET 1 - ¿DIFERENCIA O DESIGUALDAD?
   Three cases, one at a time. Step 1: is this just a difference between
   households or a difference that decides access to a right? Step 2 (only when
   it is inequality): which right is the one being closed off. Every wrong tap
   answers back with the reason; the third miss opens the answer and moves on.
   ================================================ */
var DIF = null;
function buildDif(rng){
  var pool = [
    { case:{ es:'Dos familias de la misma colonia festejan de forma distinta: una prepara tamales en diciembre y la otra prefiere una comida sencilla.',
             en:'Two families in the same neighborhood celebrate differently: one makes tamales in December and the other prefers a simple meal.' },
      ineq:false,
      why:{ es:'Cambia la costumbre, no cambia a qué tiene acceso ninguna de las dos familias.',
            en:'The custom changes, but what either family can access does not.' } },
    { case:{ es:'En una comunidad, las familias con menos ingreso solo alcanzan a comprar agua en garrafón, mientras las del centro reciben agua entubada todos los días.',
             en:'In one community, the families with the lowest income can only afford bottled water, while those downtown receive piped water every day.' },
      ineq:true,
      right:1,
      why:{ es:'El ingreso del hogar está decidiendo quién bebe agua segura y quién no.',
            en:'Household income is deciding who drinks safe water and who does not.' },
      rwhy:[ { es:'La escuela no es lo que queda fuera de alcance en este caso.', en:'School is not what is left out of reach in this case.' },
             { es:'Correcto: el agua segura es parte de la salud y de la vivienda adecuada.', en:'Correct: safe water is part of health and adequate housing.' },
             { es:'Aquí no se está discutiendo quién participa en las decisiones del pueblo.', en:'What is at stake here is not who takes part in the town decisions.' } ] },
    { case:{ es:'Una estudiante quiere ser bióloga marina y su compañero de banca quiere ser músico.',
             en:'One student wants to be a marine biologist and her deskmate wants to be a musician.' },
      ineq:false,
      why:{ es:'Son proyectos de vida distintos y ninguno cierra el acceso del otro a nada.',
            en:'They are different life projects and neither one closes off the other from anything.' } },
    { case:{ es:'En un municipio, las secundarias de las localidades pequeñas cerraron el turno vespertino y quienes trabajan por la mañana ya no tienen dónde estudiar.',
             en:'In one municipality, the secondary schools in the small towns closed their afternoon shift and those who work in the morning no longer have anywhere to study.' },
      ineq:true,
      right:0,
      why:{ es:'Quien necesita trabajar para sostener su casa queda sin lugar donde continuar sus estudios.',
            en:'Whoever needs to work to support their home is left with nowhere to continue studying.' },
      rwhy:[ { es:'Correcto: lo que queda cerrado es la posibilidad de seguir estudiando.', en:'Correct: what is closed off is the possibility of continuing to study.' },
             { es:'La atención médica no es lo que se está perdiendo en este caso.', en:'Medical care is not what is being lost in this case.' },
             { es:'El caso no habla de quién puede opinar en las decisiones públicas.', en:'The case is not about who gets to speak in public decisions.' } ] },
    { case:{ es:'En una colonia sin transporte público por las noches, quienes salen del turno de la tarde en la fábrica caminan una hora por calles sin alumbrado.',
             en:'In a neighborhood with no public transport at night, those leaving the afternoon shift at the factory walk for an hour along unlit streets.' },
      ineq:true,
      right:2,
      why:{ es:'El tipo de empleo y el lugar donde se vive están decidiendo quién llega a casa en condiciones seguras.',
            en:'The kind of job and the place where you live are deciding who gets home under safe conditions.' },
      rwhy:[ { es:'El acceso a la escuela no es lo que está en juego aquí.', en:'Access to school is not what is at stake here.' },
             { es:'No es la atención de la salud lo que queda fuera de alcance en este caso.', en:'It is not health care that is left out of reach in this case.' },
             { es:'Correcto: un entorno seguro para trasladarse es parte de una vida digna.', en:'Correct: a safe environment to move around in is part of a dignified life.' } ] },
    { case:{ es:'Dos hermanos escuchan música distinta: uno prefiere banda y el otro prefiere rap.',
             en:'Two siblings listen to different music: one prefers banda and the other prefers rap.' },
      ineq:false,
      why:{ es:'El gusto personal no decide a qué servicios o derechos puede llegar cada quien.',
            en:'Personal taste does not decide which services or rights each one can reach.' } }
  ];
  var chosen = shuffle(pool, rng).slice(0, 4);
  DIF = { rounds:chosen, i:0, step:1, tries:0, msg:null, cls:'', missIdx:-1, done:false };
  return '<div class="wgt">' +
      '<div class="wgt-h">' + S('Detector de desigualdad','Inequality detector') + '</div>' +
      '<div class="wgt-q">' + S('Lee cada caso y decide si describe una diferencia o una desigualdad. Si es desigualdad, señala el derecho que queda fuera de alcance.',
                                'Read each case and decide whether it describes a difference or an inequality. If it is inequality, point out the right left out of reach.') + '</div>' +
      '<div id="difBox"></div>' +

}
function difRights(){
  return [ S('Estudiar','Being able to study'),
           S('Salud y vivienda adecuada','Health and adequate housing'),
           S('Un entorno seguro','A safe environment') ];
}
function difRender(){
  if (!DIF) return;
  var box = document.getElementById('difBox');
  if (!box) return;
  var r = DIF.rounds[DIF.i];
  var dots = DIF.rounds.map(function(x, k){
    var c = k < DIF.i ? ' done' : (k === DIF.i && !DIF.done ? ' now' : '');
    return '<div class="rdot' + c + '"></div>';
  }).join('');
  if (DIF.done) {
    box.innerHTML = '<div class="wmsg ok">' +
        S('Revisaste los cuatro casos. La pregunta que los separa siempre fue la misma: ¿esta diferencia decide a qué puede llegar una persona? Cuando la respuesta es sí, deja de ser una diferencia y se vuelve desigualdad.',
          'You went through all four cases. The question that separates them was always the same: does this difference decide what a person can reach? When the answer is yes, it stops being a difference and becomes inequality.') +
      '</div>' +
      '<div class="wrow"><button class="wbtn" onclick="difReset()">' + S('Revisar los casos otra vez','Go through the cases again') + '</button></div>' +
      '<div class="rtrack">' + dots + '</div>';
    return;
  }
  var body = '<div class="casetag">' + S('Caso ','Case ') + (DIF.i + 1) + S(' de ',' of ') + DIF.rounds.length + '</div>' +
             '<div class="wcase">' + r.case[LANG] + '</div>';
  if (DIF.step === 1) {
    body += '<div class="wsteplbl">' + S('¿Qué es lo que describe?','What does it describe?') + '</div>' +
      '<div class="opts2">' +
        '<div class="opt2' + (DIF.missIdx === 0 ? ' miss' : '') + '" onclick="difTap1(0)">' +
          S('Una diferencia entre las personas','A difference between people') + '</div>' +
        '<div class="opt2' + (DIF.missIdx === 1 ? ' miss' : '') + '" onclick="difTap1(1)">' +
          S('Una desigualdad que cierra el acceso a un derecho','An inequality that closes off access to a right') + '</div>' +
      '</div>';
  } else {
    body += '<div class="opt2 good lock">' + S('Es una desigualdad que cierra el acceso a un derecho','It is an inequality that closes off access to a right') + '</div>' +
      '<div class="wsteplbl">' + S('¿Qué queda fuera de alcance?','What is left out of reach?') + '</div>' +
      '<div class="opts2">' +
        difRights().map(function(rt, k){
          return '<div class="opt2' + (DIF.missIdx === k ? ' miss' : '') + '" onclick="difTap2(' + k + ')">' + rt + '</div>';
        }).join('') +
      '</div>';
  }
  var msg = DIF.msg || S('Fíjate en si el caso cambia solo la costumbre o el gusto, o si cambia lo que una persona puede alcanzar.',
                         'Look at whether the case only changes a custom or a taste, or whether it changes what a person can reach.');
  body += '<div class="wmsg' + (DIF.cls ? ' ' + DIF.cls : '') + '">' + msg + '</div>' +
          '<div class="rtrack">' + dots + '</div>' +
          '<div class="wprog">' + S('Casos revisados: ','Cases reviewed: ') + DIF.i + ' / ' + DIF.rounds.length + '</div>';
  box.innerHTML = body;
}
function difAdvance(){
  DIF.i++; DIF.step = 1; DIF.tries = 0; DIF.missIdx = -1;
  if (DIF.i >= DIF.rounds.length) DIF.done = true;
  difRender();
}
function difTap1(k){
  if (!DIF || DIF.done || DIF.step !== 1) return;
  var r = DIF.rounds[DIF.i];
  var want = r.ineq ? 1 : 0;
  if (k === want) {
    DIF.missIdx = -1; DIF.tries = 0;
    if (r.ineq) { DIF.step = 2; DIF.msg = r.why[LANG] + ' ' + S('Ahora di cuál es el derecho que queda cerrado.','Now say which right is being closed off.'); DIF.cls = 'ok'; }
    else { DIF.msg = r.why[LANG]; DIF.cls = 'ok'; difRender(); setTimeout(difAdvance, 900); return; }
    difRender(); return;
  }
  DIF.tries++; DIF.missIdx = k; DIF.cls = 'warn';
  DIF.msg = r.ineq
    ? S('Vuelve a leer: aquí el ingreso, el empleo o el lugar donde se vive están decidiendo a qué puede llegar la gente. Eso ya no es solo una diferencia.',
        'Read it again: here income, work or where you live are deciding what people can reach. That is no longer just a difference.')
    : S('Mira otra vez: nadie queda sin escuela, sin salud ni sin seguridad por lo que dice el caso. Solo cambia la costumbre.',
        'Look again: nobody is left without school, health or safety by what the case says. Only the custom changes.');
  if (DIF.tries >= 3) {
    DIF.msg = r.why[LANG] + ' ' + S('Guarda esta señal para el siguiente caso.','Keep that signal in mind for the next case.');
    DIF.cls = 'ok'; DIF.missIdx = -1;
    difRender(); setTimeout(difAdvance, 1100); return;
  }
  difRender();
}
function difTap2(k){
  if (!DIF || DIF.done || DIF.step !== 2) return;
  var r = DIF.rounds[DIF.i];
  if (k === r.right) {
    DIF.msg = r.rwhy[k][LANG]; DIF.cls = 'ok'; DIF.missIdx = -1;
    difRender(); setTimeout(difAdvance, 950); return;
  }
  DIF.tries++; DIF.missIdx = k; DIF.cls = 'warn';
  DIF.msg = r.rwhy[k][LANG] + ' ' + S('Busca lo que el caso deja explícitamente fuera de alcance.','Look for what the case explicitly leaves out of reach.');
  if (DIF.tries >= 3) {
    DIF.msg = r.rwhy[r.right][LANG]; DIF.cls = 'ok'; DIF.missIdx = -1;
    difRender(); setTimeout(difAdvance, 1100); return;
  }
  difRender();
}
function difReset(){
  if (!DIF) return;
  DIF.i = 0; DIF.step = 1; DIF.tries = 0; DIF.missIdx = -1;
  DIF.msg = null; DIF.cls = ''; DIF.done = false;
  difRender();
}

function trDraw(){
  var cv = document.getElementById('trCv');
  if (!cv || !TRY_) return;
  var r = cv.getBoundingClientRect();
  if (!r.width) return;
  var dpr = window.devicePixelRatio || 1;
  cv.width = r.width * dpr; cv.height = r.height * dpr;
  var ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  var W = r.width, H = r.height;
  var CG = tok('--green', '#1a4a8a'), CA = tok('--gold', '#c9a84c');
  var CT = tok('--text2', '#4a4640'), C3 = tok('--text3', '#7a7468'), CB = tok('--border', '#ddd8cc');
  ctx.clearRect(0, 0, W, H);
  var L = 14, R = W - 14, top = 44, base = H - 34;
  var n = TRY_.st.stages.length;
  ctx.strokeStyle = CB; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(L, base + 0.5); ctx.lineTo(R, base + 0.5); ctx.stroke();
  var stepX = (R - L) / n;
  ctx.font = '10px IBM Plex Sans, sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = C3;
  for (var k = 0; k < n; k++) {
    var xm = L + stepX * (k + 0.5);
    ctx.fillText(TRY_.st.stages[k].lbl[LANG], xm, base + 16);
    if (k > 0) {
      ctx.strokeStyle = CB;
      ctx.beginPath(); ctx.moveTo(L + stepX * k, top - 6); ctx.lineTo(L + stepX * k, base); ctx.stroke();
    }
  }
  var yTop = top + 6, span = base - yTop - 6;
  function yOf(v){ return yTop + span * v; }
  var ptsA = [], ptsB = [], i;
  for (i = 0; i <= n; i++) {
    var x = L + stepX * i;
    ptsA.push([x, yOf(0.10)]);
    var g = (i < TRY_.gap.length) ? TRY_.gap[i] : TRY_.gap[TRY_.gap.length - 1];
    ptsB.push([x, yOf(0.10 + g * 0.80)]);
  }
  var lastIdx = TRY_.gap.length - 1;
  ctx.beginPath();
  ctx.moveTo(ptsA[0][0], ptsA[0][1]);
  for (i = 1; i <= lastIdx; i++) ctx.lineTo(ptsA[i][0], ptsA[i][1]);
  for (i = lastIdx; i >= 0; i--) ctx.lineTo(ptsB[i][0], ptsB[i][1]);
  ctx.closePath();
  ctx.globalAlpha = 0.13; ctx.fillStyle = C3; ctx.fill(); ctx.globalAlpha = 1;
  function line(pts, color){
    ctx.strokeStyle = color; ctx.lineWidth = 2.6; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
    for (var j = 1; j <= lastIdx; j++) ctx.lineTo(pts[j][0], pts[j][1]);
    ctx.stroke();
    for (var q = 0; q <= lastIdx; q++) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(pts[q][0], pts[q][1], 3.4, 0, Math.PI * 2); ctx.fill(); }
  }
  line(ptsA, CA); line(ptsB, CG);
  ctx.textAlign = 'left'; ctx.font = '600 12px IBM Plex Sans, sans-serif';
  ctx.fillStyle = CA; ctx.fillText(TRY_.st.a[LANG], L + 2, 18);
  ctx.fillStyle = CG; ctx.fillText(TRY_.st.b[LANG], L + 2, 34);
  ctx.textAlign = 'right'; ctx.font = '10px IBM Plex Sans, sans-serif'; ctx.fillStyle = C3;
  ctx.fillText(S('condiciones para una vida digna','conditions for a dignified life'), R, 18);
  var gp = TRY_.gap[lastIdx];
  var band = gp < 0.05 ? S('casi la misma','almost the same') : (gp < 0.4 ? S('empieza a abrirse','starting to open') : (gp < 0.75 ? S('amplia','wide') : S('muy amplia','very wide')));
  ctx.fillText(S('Distancia: ','Distance: ') + band, R, 34);
}
function trRender(){
  if (!TRY_) return;
  var box = document.getElementById('trBox');
  if (!box) return;
  trDraw();
  if (TRY_.done) {
    box.innerHTML = '<div class="wmsg ok">' +
        S('Las dos líneas salieron del mismo punto y terminaron lejos. Ninguna etapa por sí sola explica la distancia final: cada una agregó una desventaja sobre la anterior. A eso se le llama acumulación, y es lo que hace que la desigualdad crezca con los años.',
          'The two lines started from the same point and ended far apart. No single stage explains the final distance: each one added a disadvantage on top of the previous one. That is called accumulation, and it is what makes inequality grow over the years.') +
      '</div>' +
      '<div class="wrow"><button class="wbtn" onclick="trReset()">' + S('Recorrer las etapas de nuevo','Walk the stages again') + '</button></div>';
    return;
  }
  var s = TRY_.st.stages[TRY_.i];
  var opts = s.opts.map(function(o, k){
    return '<div class="opt2' + (TRY_.missIdx === k ? ' miss' : '') + '" onclick="trTap(' + k + ')">' + o.t[LANG] + '</div>';
  }).join('');
  var msg = TRY_.msg || S('Elige lo que se desprende de las condiciones descritas, no lo que sería deseable que ocurriera.',
                          'Choose what follows from the conditions described, not what it would be desirable to happen.');
  box.innerHTML =
    '<div class="wcase">' + (TRY_.i === 0 ? TRY_.st.intro[LANG] + ' ' : '') + s.q[LANG] + '</div>' +
    '<div class="opts2">' + opts + '</div>' +
    '<div class="wmsg' + (TRY_.cls ? ' ' + TRY_.cls : '') + '">' + msg + '</div>' +
    '<div class="wprog">' + S('Etapa ','Stage ') + (TRY_.i + 1) + ' / ' + TRY_.st.stages.length + '</div>';
}
function trAdvance(){
  TRY_.i++; TRY_.tries = 0; TRY_.missIdx = -1;
  if (TRY_.i >= TRY_.st.stages.length) TRY_.done = true;
  trRender();
}
function trTap(k){
  if (!TRY_ || TRY_.done) return;
  var s = TRY_.st.stages[TRY_.i];
  var o = s.opts[k];
  if (o.ok) {
    TRY_.gap.push((TRY_.i + 1) / TRY_.st.stages.length);
    TRY_.msg = o.why[LANG]; TRY_.cls = 'ok'; TRY_.missIdx = -1;
    trRender(); setTimeout(trAdvance, 1100); return;
  }
  TRY_.tries++; TRY_.missIdx = k; TRY_.cls = 'warn';
  TRY_.msg = o.why[LANG] + ' ' + S('La línea no se movió: vuelve a mirar qué recursos tiene esa casa.',
                                   'The line did not move: look again at what resources that household has.');
  if (TRY_.tries >= 3) {
    var gi = 0, j;
    for (j = 0; j < s.opts.length; j++) if (s.opts[j].ok) gi = j;
    TRY_.gap.push((TRY_.i + 1) / TRY_.st.stages.length);
    TRY_.msg = s.opts[gi].why[LANG]; TRY_.cls = 'ok'; TRY_.missIdx = -1;
    trRender(); setTimeout(trAdvance, 1300); return;
  }
  trRender();
}
function trReset(){
  if (!TRY_) return;
  TRY_.i = 0; TRY_.tries = 0; TRY_.missIdx = -1; TRY_.msg = null; TRY_.cls = ''; TRY_.done = false; TRY_.gap = [0];
  trRender();
}

function whDraw(){

  if (!r.width) return;
  var dpr = window.devicePixelRatio || 1;
  cv.width = r.width * dpr; cv.height = r.height * dpr;
  var ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  var W = r.width, H = r.height;
  var CG = tok('--green', '#1a4a8a'), CGB = tok('--green-bg', '#e8edf5'), CGD = tok('--green-dark', '#0f2d5a');
  var CA = tok('--gold', '#c9a84c'), CT = tok('--text2', '#4a4640'), C3 = tok('--text3', '#7a7468');
  var CB = tok('--border', '#ddd8cc'), CS = tok('--surface2', '#f0ede6'), CD = tok('--bad', '#8b2500');
  ctx.clearRect(0, 0, W, H);
  var bw = Math.min(160, W * 0.34), bh = 46;

    var ax = px(a1), ay = py(a1);
    var tx = -rx * Math.sin(a1), ty = ry * Math.cos(a1);
    var tl = Math.sqrt(tx * tx + ty * ty) || 1; tx /= tl; ty /= tl;
    ctx.fillStyle = isCut ? CD : CG;
    ctx.beginPath();
    ctx.moveTo(ax + tx * 7, ay + ty * 7);
    ctx.lineTo(ax - tx * 3 + ty * 5, ay - ty * 3 - tx * 5);
    ctx.lineTo(ax - tx * 3 - ty * 5, ay - ty * 3 + tx * 5);
    ctx.closePath(); ctx.fill();
    if (isCut) {
      var mid = (a0 + a1) / 2, mx = px(mid), my = py(mid);
      ctx.strokeStyle = CD; ctx.lineWidth = 2.6;
      ctx.beginPath(); ctx.moveTo(mx - 8, my - 8); ctx.lineTo(mx + 8, my + 8); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(mx + 8, my - 8); ctx.lineTo(mx - 8, my + 8); ctx.stroke();
    }
  }
  for (i = 0; i < 4; i++) {
    var a = ang(i), bx = px(a) - bw / 2, by = py(a) - bh / 2;
    var filled = WHL.placed.length > i;
    ctx.beginPath();
    var rr = 8;
    ctx.moveTo(bx + rr, by);
    ctx.lineTo(bx + bw - rr, by); ctx.quadraticCurveTo(bx + bw, by, bx + bw, by + rr);
    ctx.lineTo(bx + bw, by + bh - rr); ctx.quadraticCurveTo(bx + bw, by + bh, bx + bw - rr, by + bh);
    ctx.lineTo(bx + rr, by + bh); ctx.quadraticCurveTo(bx, by + bh, bx, by + bh - rr);
    ctx.lineTo(bx, by + rr); ctx.quadraticCurveTo(bx, by, bx + rr, by);
    ctx.closePath();
    ctx.fillStyle = filled ? CGB : CS; ctx.fill();
    ctx.lineWidth = 1.6;
    if (filled) { ctx.strokeStyle = CG; ctx.setLineDash([]); }
    else { ctx.strokeStyle = CB; ctx.setLineDash([4, 4]); }
    ctx.stroke(); ctx.setLineDash([]);
    ctx.textAlign = 'center'; ctx.font = '600 10.5px IBM Plex Sans, sans-serif';
    ctx.fillStyle = filled ? CGD : C3;
    var label = filled ? WHL.st.links[WHL.placed[i]].s[LANG] : (S('eslabón ','link ') + (i + 1));
    var words = label.split(' '), line = '', lines = [];
    for (k = 0; k < words.length; k++) {
      var test = line ? line + ' ' + words[k] : words[k];
      if (ctx.measureText(test).width > bw - 12 && line) { lines.push(line); line = words[k]; }
      else line = test;
    }
    if (line) lines.push(line);
    lines = lines.slice(0, 3);
    var y0 = py(a) - (lines.length - 1) * 6;
    lines.forEach(function(ln, li){ ctx.fillText(ln, px(a), y0 + li * 12 + 3.5); });
  }
  ctx.textAlign = 'center'; ctx.font = '10px IBM Plex Sans, sans-serif'; ctx.fillStyle = C3;
  if (WHL.placed.length >= 4 && WHL.phase !== 'done') {
    ctx.fillStyle = CA; ctx.font = '600 11px IBM Plex Sans, sans-serif';
    ctx.fillText(S('la rueda quedó cerrada','the wheel is now closed'), cx, cy + 4);
  } else if (WHL.phase === 'done') {
    ctx.fillStyle = CD; ctx.font = '600 11px IBM Plex Sans, sans-serif';
    ctx.fillText(S('la rueda quedó abierta','the wheel is now open'), cx, cy + 4);
  } else {
    ctx.fillText(S('coloca los eslabones','place the links'), cx, cy + 4);
  }
}
function whRender(){
  if (!WHL) return;
  var box = document.getElementById('whBox');
  if (!box) return;
  whDraw();
  var body = '<div class="wcase">' + WHL.st.ctx[LANG] + '</div>';
  if (WHL.phase === 'order') {
    var pieces = WHL.bag.map(function(id, k){
      var used = WHL.placed.indexOf(id) >= 0;
      return '<div class="piece' + (used ? ' used' : '') + (WHL.missIdx === k ? ' miss' : '') + '" onclick="whTap(' + k + ')">' +
             WHL.st.links[id].t[LANG] + '</div>';
    }).join('');
    body += '<div class="pieces">' + pieces + '</div>';
  } else {
    body += '<div class="wcase" style="border-left-color:var(--green)"><strong>' + S('Medida en la mesa: ','Measure on the table: ') + '</strong>' + WHL.st.msr[LANG] + '</div>' +
      '<div class="wsteplbl">' + S('¿Qué eslabón deja de ocurrir con esta medida?','Which link stops happening with this measure?') + '</div>' +
      '<div class="opts2">' +
        WHL.placed.map(function(id, k){
          var cl = (WHL.phase === 'done' && WHL.cutSel === k) ? ' good' : (WHL.missIdx === k ? ' miss' : '');
          return '<div class="opt2' + cl + (WHL.phase === 'done' ? ' lock' : '') + '" onclick="whCut(' + k + ')">' + WHL.st.links[id].s[LANG] + ': ' + WHL.st.links[id].t[LANG] + '</div>';
        }).join('') +
      '</div>';
  }
  var def = WHL.phase === 'order'
    ? S('Empieza por lo que ocurre primero dentro del hogar y sigue el efecto de cada eslabón sobre el siguiente.',
        'Start with what happens first inside the household and follow the effect of each link on the next one.')
    : S('Busca el eslabón donde la medida quita el obstáculo, no donde alivia el resultado.',
        'Look for the link where the measure removes the obstacle, not where it eases the result.');
  body += '<div class="wmsg' + (WHL.cls ? ' ' + WHL.cls : '') + '">' + (WHL.msg || def) + '</div>';
  var btns = '';
  if (WHL.placed.length > 0) btns += '<button class="wbtn" onclick="whReset()">' + S('Armar la rueda de nuevo','Build the wheel again') + '</button>';
  body += '<div class="wrow">' + btns + '</div>' +
    '<div class="wprog">' + S('Eslabones colocados: ','Links placed: ') + WHL.placed.length + ' / 4</div>';
  box.innerHTML = body;
}
function whTap(k){
  if (!WHL || WHL.phase !== 'order') return;
  var id = WHL.bag[k];
  if (WHL.placed.indexOf(id) >= 0) return;
  if (id === WHL.placed.length) {
    WHL.placed.push(id); WHL.tries = 0; WHL.missIdx = -1;
    if (WHL.placed.length >= 4) {
      WHL.phase = 'cut';
      WHL.msg = S('La rueda quedó cerrada: el último eslabón devuelve la situación al primero, y por eso vuelve a empezar una generación después. Ahora mira dónde se puede cortar.',
                  'The wheel is closed: the last link returns the situation to the first one, and that is why it starts over a generation later. Now look at where it can be cut.');
      WHL.cls = 'ok';
    } else {
      WHL.msg = WHL.st.links[id].why[LANG]; WHL.cls = 'ok';
    }
    whRender(); return;
  }
  WHL.tries++; WHL.missIdx = k; WHL.cls = 'warn';
  WHL.msg = WHL.st.links[id].why[LANG];
  if (WHL.tries >= 3) {
    var need = WHL.placed.length;
    WHL.placed.push(need); WHL.tries = 0; WHL.missIdx = -1;
    WHL.msg = WHL.st.links[need].why[LANG] + ' ' + S('Ese era el eslabón que seguía.','That was the link that came next.');
    WHL.cls = 'ok';
    if (WHL.placed.length >= 4) { WHL.phase = 'cut'; }
  }
  whRender();
}
function whCut(k){
  if (!WHL || WHL.phase !== 'cut') return;
  var id = WHL.placed[k];
  if (id === WHL.st.cut) {
    WHL.cutSel = k; WHL.phase = 'done'; WHL.missIdx = -1; WHL.cls = 'ok';
    WHL.msg = WHL.st.cwhy[id][LANG] + ' ' +
      S('Una rueda con un eslabón cortado deja de repetirse, siempre que el corte se sostenga en el tiempo.',
        'A wheel with one link cut stops repeating, as long as the cut is sustained over time.');
    whRender(); return;
  }
  WHL.tries++; WHL.missIdx = k; WHL.cls = 'warn';
  WHL.msg = WHL.st.cwhy[id][LANG] + ' ' + S('Prueba con otro eslabón.','Try another link.');
  if (WHL.tries >= 3) {
    var pos = WHL.placed.indexOf(WHL.st.cut);
    WHL.cutSel = pos; WHL.phase = 'done'; WHL.missIdx = -1; WHL.cls = 'ok';
    WHL.msg = WHL.st.cwhy[WHL.st.cut][LANG];
  }
  whRender();
}
function whReset(){
  if (!WHL) return;
  WHL.placed = []; WHL.phase = 'order'; WHL.tries = 0; WHL.msg = null; WHL.cls = '';
  WHL.missIdx = -1; WHL.cutSel = -1;
  whRender();
}

function mdDraw(){

  var CG = tok('--green', '#1a4a8a'), CA = tok('--gold', '#c9a84c'), COK = tok('--ok', '#2d6a4f');

      if (covered && MDS.dig === 1) { ctx.strokeStyle = CA; ctx.lineWidth = 1.6; ctx.stroke(); }

  }
