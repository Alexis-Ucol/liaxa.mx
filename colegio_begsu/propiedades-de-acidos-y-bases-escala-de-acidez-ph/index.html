<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Propiedades de Ácidos y Bases; Escala de Acidez (pH)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; text-align: justify; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Propiedades de Ácidos y Bases; Escala de Acidez (pH)</div>
    <div class="wcourse" id="wcourse-el">Química · 3° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Propiedades de Ácidos y Bases; Escala de Acidez (pH)</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="sbtn" id="dlBtn" onclick="generatePDF()" style="max-width:280px;margin:0 auto;">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   CENTRALIZED SCHOOL CONFIG (Rule 16) — ships UNBRANDED (Rule 11).
   The ONLY rebranding point. build_all.py substitutes these exact fields
   (BRAND_FIELDS / RGB_FIELDS / logo*) downstream; :root/dark stay as fallback.
   Neutral defaults below == the static :root/dark values, so unbranded == no-op.
   ══════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:'#24240c', primaryDark:'#3f3f14', primaryBg:'#f4f4e9',
  accent:'#fcb40c', accentBg:'#fff4db',
  darkPrimary:'#b4b455', darkPrimaryDark:'#d7d783', darkPrimaryBg:'#343412',

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;

  saveSession();

}

async function generatePDF() {
  var btn = document.getElementById('dlBtn');
  btn.textContent = 'Generando PDF…';
  btn.disabled = true;

  var jspdf   = window.jspdf;
  var doc     = new jspdf.jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });
  var PW      = 215.9;
  var M       = 18;
  var TW      = PW - M * 2;
  var PH      = doc.internal.pageSize.height;
  var name    = studentData.name;
  var group   = studentData.group;
  var total   = problems.length;
  var pct     = Math.round(correctCount / total * 100);
  var dateStr = new Date().toLocaleString('es-MX', { dateStyle:'long', timeStyle:'short' });

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS — INJECTION BLOCK ─────────────────────────────────────────
  //   Match these RGB values to --green and --gold above.
  //   PRIMARY  → pBR, pBG, pBB
  //   ACCENT   → pAR, pAG, pAB
  // ──────────────────────────────────────────────────────────────────────────
  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;  // PRIMARY (from SCHOOL, Rule 16)
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;   // ACCENT (from SCHOOL, Rule 16)

  function pdfText(html) {
    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/\u2192/g,'->').replace(/\u2212/g,'-').replace(/\u00b2/g,'^2')
      .replace(/\u00b3/g,'^3').replace(/\u00d7/g,'x').replace(/\u00f7/g,'/')
      .replace(/\u2260/g,'!=').replace(/\u2264/g,'<=').replace(/\u2265/g,'>=')
      .replace(/\u221a/g,'sqrt').replace(/\u03c0/g,'pi').replace(/\u2026/g,'...')

  var _fname   = 'qui3_t11_g01_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf';

  function _openPdfInline(b){
    var u = URL.createObjectURL(b);
    var w = window.open(u, '_blank');
    if (!w) { window.location.href = u; }
    setTimeout(function(){ URL.revokeObjectURL(u); }, 60000);
  }

  var _isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
               (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  if (_isIOS) {
    var _pdfFile = new File([_pdfBlob], _fname, { type:'application/pdf' });
    if (navigator.canShare && navigator.canShare({ files:[_pdfFile] })) {
      navigator.share({ files:[_pdfFile], title:_fname })
        .then(_restorePdfBtn)
        .catch(function(e){
          if (e && e.name === 'AbortError') { _restorePdfBtn(); return; }
          _openPdfInline(_pdfBlob); _restorePdfBtn();
        });
      return;
    }
    _openPdfInline(_pdfBlob); _restorePdfBtn();
    return;
  }

  var _dlUrl = URL.createObjectURL(_pdfBlob);
  var _dlA   = document.createElement('a');
  _dlA.href  = _dlUrl; _dlA.download = _fname;
  document.body.appendChild(_dlA); _dlA.click();

   GUIA :: qui3_t11_g01 - Propiedades de ácidos y bases; escala de acidez (pH)
   El estudiante distingue ácidos y bases por sus propiedades y con indicadores,
   interpreta la escala de acidez, deduce los productos de una neutralización
   con el modelo de Arrhenius y evalúa beneficios y riesgos de estas sustancias.
   Bilingüe (Rule 10), variantes por semilla (Rule 4), manipulativos marcados
   con data-widget (Part 0).
   ══════════════════════════════════════════════════════════════════════════ */
function L(o){ return (o && o[LANG] !== undefined) ? o[LANG] : (o ? o.es : ''); }
function vpick(rng, list){ return list[Math.floor(rng() * list.length)]; }
function ri(rng, a, b){ return a + Math.floor(rng() * (b - a + 1)); }

function rcard(name, form, note){
  return '<div class="rcard"><div class="rname">' + name + '</div><div class="rform">' + form + '</div><div class="rnote">' + note + '</div></div>';
}

function sec(tag, title, html){
  var d = document.createElement('div');
  d.className = 'section';
  d.innerHTML = '<div class="stag">' + tag + '</div><h2>' + title + '</h2>' + html;
  document.getElementById('lessonBody').appendChild(d);
  return d;
}

function widgetHost(parent, id, kind){
  var d = document.createElement('div');
  d.className = 'gw section';
  d.id = id;
  d.setAttribute('data-widget', kind);
  (parent || document.getElementById('lessonBody')).appendChild(d);
  return d;
}

function addProblem(rng, v){
  var idx = problems.length;
  var opts = L(v.opts).slice();
  var correctVal = opts[v.ci];
  var sh = shuffle(opts, rng);
  var prob = {
    title: L(v.title),
    questionText: L(v.q),
    fn: v.fn ? L(v.fn) : '',
    hint: L(v.hint),
    explanation: L(v.exp),
    options: sh,
    correctIdx: sh.indexOf(correctVal),
    showWork: !!v.showWork,
    studentChoice: null,
    pendingChoice: null
  };
  problems.push(prob);
  buildOneCard(prob, idx);
}

function wPropiedades(rng, host){

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 2 :: mesa de indicadores
   Tres muestras sin identificar. El estudiante aplica los indicadores que quiera
   y el tubo cambia de color al instante. Con esa evidencia clasifica la muestra.
   Un indicador solo casi nunca alcanza: la col morada es la única que separa los
   tres casos, y la retroalimentación empuja hacia ese descubrimiento.
   ══════════════════════════════════════════════════════════════════════════ */
var MUESTRAS = [
  { pista:{ es:'líquido transparente, sin color ni olor perceptible', en:'clear liquid, with no colour or noticeable smell' },
    nat:'acida', real:{ es:'agua con unas gotas de ácido del laboratorio', en:'water with a few drops of laboratory acid' } },
  { pista:{ es:'líquido amarillo muy claro, ligeramente turbio', en:'very pale yellow liquid, slightly cloudy' },
    nat:'acida', real:{ es:'jugo de limón filtrado', en:'filtered lemon juice' } },
  { pista:{ es:'líquido incoloro embotellado, sin etiqueta', en:'colourless bottled liquid, with no label' },
    nat:'neutra', real:{ es:'agua destilada', en:'distilled water' } },
  { pista:{ es:'líquido transparente que sabe a nada según quien lo embotelló', en:'clear liquid that tastes of nothing according to whoever bottled it' },
    nat:'neutra', real:{ es:'agua de garrafón', en:'bottled drinking water' } },
  { pista:{ es:'líquido blanquecino, de aspecto lechoso', en:'whitish liquid, milky looking' },
    nat:'basica', real:{ es:'leche de magnesia diluida', en:'diluted milk of magnesia' } },
  { pista:{ es:'líquido incoloro, un poco espeso', en:'colourless liquid, a little thick' },
    nat:'basica', real:{ es:'agua con bicarbonato y jabón', en:'water with baking soda and soap' } }
];

var INDICADORES = [
  { id:'ta', es:'Tornasol azul', en:'Blue litmus' },
  { id:'tr', es:'Tornasol rojo', en:'Red litmus' },
  { id:'fe', es:'Fenolftaleína', en:'Phenolphthalein' },
  { id:'cm', es:'Col morada', en:'Red cabbage' }
];

var COLORES = {
  rojo:     { es:'rojo', en:'red' },
  rosa:     { es:'rosa intenso', en:'deep pink' },
  azul:     { es:'azul', en:'blue' },
  verde:    { es:'verde', en:'green' },
  violeta:  { es:'violeta', en:'violet' },
  amarillo: { es:'amarillo', en:'yellow' },
  inc:      { es:'sin color', en:'colourless' }
};

function indResultado(indId, nat){
  if (indId === 'ta') return nat === 'acida' ? 'rojo' : 'azul';
  if (indId === 'tr') return nat === 'basica' ? 'azul' : 'rojo';
  if (indId === 'fe') return nat === 'basica' ? 'rosa' : 'inc';
  return nat === 'acida' ? 'rosa' : (nat === 'neutra' ? 'violeta' : 'verde');
}

function wIndicador(rng, host){
  var RONDAS = shuffle(MUESTRAS, rng).slice(0, 3);
  var st = { r:0, tries:0, hits:0, usados:[], done:false };

  function natName(n){
    if (n === 'acida') return L({ es:'ácida', en:'acidic' });
    if (n === 'neutra') return L({ es:'neutra', en:'neutral' });
    return L({ es:'básica', en:'basic' });
  }

  function render(){
    if (st.done){
      host.innerHTML =
        '<div class="gw-h iw-tag">' + L({ es:'Mesa de indicadores', en:'Indicator bench' }) + '</div>' +
        '<div class="gw-fb good">' + L({ es:'Identificaste las tres muestras. Aciertos directos: ', en:'You identified the three samples. Direct hits: ' }) + st.hits + ' / ' + RONDAS.length + '. ' +
        L({ es:'La col morada fue la única que dio un color distinto para cada uno de los tres casos; las demás dejan siempre dos posibilidades abiertas.', en:'Red cabbage was the only one that gave a different colour for each of the three cases; the others always leave two possibilities open.' }) + '</div>';
      return;
    }
    var m = RONDAS[st.r];
    host.innerHTML =
      '<div class="gw-h iw-tag">' + L({ es:'Mesa de indicadores', en:'Indicator bench' }) + '</div>' +
      '<div class="gw-mini iw-sub">' + L({
        es:'Aplica los indicadores que quieras sobre la muestra: el tubo cambia de color al instante. Cuando tengas evidencia suficiente, clasifícala.',
        en:'Apply as many indicators as you want to the sample: the tube changes colour at once. When you have enough evidence, classify it.'
      }) + '</div>' +
      '<div class="gw-prog">' + (st.r + 1) + ' / ' + RONDAS.length + '</div>' +
      '<div class="ind-sample">' + L({ es:'Muestra sin identificar: ', en:'Unidentified sample: ' }) + L(m.pista) + '</div>' +
      '<div class="ind-stage">' +
        '<div class="ind-tube"><div class="ind-liq c-inc" data-r="liq"></div></div>' +
        '<div class="ind-info">' +
          '<div class="ind-res" data-r="res">' + L({ es:'Todavía sin indicador', en:'No indicator yet' }) + '</div>' +
          '<div class="gw-mini">' + L({ es:'Toca un indicador para agregarlo al tubo.', en:'Tap an indicator to add it to the tube.' }) + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="gw-lbl">' + L({ es:'Indicadores disponibles', en:'Available indicators' }) + '</div>' +
      '<div class="gw-row">' +
        INDICADORES.map(function(ind){
          return '<button class="gw-btn" data-ind="' + ind.id + '">' + L(ind) + '</button>';
        }).join('') +
      '</div>' +
      '<div class="gw-lbl">' + L({ es:'Tu clasificación', en:'Your classification' }) + '</div>' +
      '<div class="gw-row">' +
        '<button class="gw-btn go" data-nat="acida">' + L({ es:'Ácida', en:'Acidic' }) + '</button>' +
        '<button class="gw-btn go" data-nat="neutra">' + L({ es:'Neutra', en:'Neutral' }) + '</button>' +
        '<button class="gw-btn go" data-nat="basica">' + L({ es:'Básica', en:'Basic' }) + '</button>' +
      '</div>' +
      '<div class="gw-fb" data-r="fb">' + L({ es:'Una sola prueba puede dejarte con dos opciones abiertas. Compara los resultados de varios indicadores.', en:'A single test can leave you with two options open. Compare the results of several indicators.' }) + '</div>';
    st.usados = [];
  }

  function say(cls, msg){
    var fb = host.querySelector('[data-r="fb"]');
    if (fb){ fb.className = 'gw-fb ' + cls; fb.innerHTML = msg; }
  }

  function aplicar(indId){
    var m = RONDAS[st.r];
    var key = indResultado(indId, m.nat);
    var liq = host.querySelector('[data-r="liq"]');
    var res = host.querySelector('[data-r="res"]');
    if (liq) liq.className = 'ind-liq c-' + key;
    var nombre = '';
    INDICADORES.forEach(function(x){ if (x.id === indId) nombre = L(x); });
    if (res) res.innerHTML = nombre + ': ' + L(COLORES[key]);
    if (st.usados.indexOf(indId) === -1) st.usados.push(indId);
    host.querySelectorAll('[data-ind]').forEach(function(b){
      b.classList.toggle('on', b.getAttribute('data-ind') === indId);
    });
  }

  function advance(){
    st.r++; st.tries = 0;
    if (st.r >= RONDAS.length) st.done = true;
    setTimeout(render, 1500);
  }

  host.addEventListener('click', function(e){
    if (st.done) return;
    var t = e.target.closest ? e.target.closest('[data-ind]') : null;
    if (t){ aplicar(t.getAttribute('data-ind')); return; }
    var n = e.target.closest ? e.target.closest('[data-nat]') : null;
    if (!n) return;
    var m = RONDAS[st.r];
    var elegida = n.getAttribute('data-nat');
    if (elegida === m.nat){
      st.hits++;
      say('good', L({ es:'Correcto: era ', en:'Correct: it was ' }) + natName(m.nat) + '. ' + L({ es:'Se trataba de ', en:'It was ' }) + L(m.real) + '.');
      advance();
      return;
    }
    st.tries++;
    if (st.tries >= 3){
      say('warm', L({ es:'Era ', en:'It was ' }) + natName(m.nat) + ': ' + L(m.real) + '. ' +
        L({ es:'Vuelve a leer los colores que obtuviste y asócialos con esa respuesta.', en:'Read again the colours you got and link them with that answer.' }));
      advance();
      return;
    }
    if (st.usados.length === 0){
      say('miss', L({
        es:'Todavía no, y decidiste sin probar nada. Aplica al menos un indicador y observa el color del tubo.',
        en:'Not yet, and you decided without testing anything. Apply at least one indicator and watch the colour of the tube.'
      }));
    } else if (st.usados.indexOf('cm') === -1){
      say('miss', L({
        es:'Todavía no. Prueba la col morada: es la única que da un color distinto para cada uno de los tres casos.',
        en:'Not yet. Try the red cabbage: it is the only one that gives a different colour for each of the three cases.'
      }));
    } else {
      say('miss', L({
        es:'Todavía no. Con la col morada, rosa señala el lado ácido, violeta el centro de la escala y verde el lado básico.',
        en:'Not yet. With red cabbage, pink marks the acidic side, violet the centre of the scale and green the basic side.'
      }));
    }
  });

  render();
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 3 :: escala de acidez
   Tres rondas con una sustancia distinta cada una. El estudiante mueve el
   cursor por la escala de 0 a 14 y la lectura, la zona y la celda iluminada se
   actualizan mientras arrastra. Al verificar recibe una indicación de dirección
   y de distancia; a la tercera falla la escala se acomoda sola en el valor real.
   ══════════════════════════════════════════════════════════════════════════ */
var ESCALA_SUST = [
  { es:'jugo de limón', en:'lemon juice', ph:2, nota:{ es:'ataca el esmalte de los dientes si el contacto es frecuente', en:'it attacks tooth enamel if the contact is frequent' } },
  { es:'refresco de cola', en:'cola drink', ph:3, nota:{ es:'su acidez viene de los ácidos que le agregan al fabricarlo', en:'its acidity comes from the acids added when it is made' } },
  { es:'jugo de naranja', en:'orange juice', ph:4, nota:{ es:'ácido, pero diez veces menos que un refresco de cola', en:'acidic, but ten times less than a cola drink' } },
  { es:'café negro', en:'black coffee', ph:5, nota:{ es:'ligeramente ácido, cerca del límite de lo que se percibe', en:'slightly acidic, close to the limit of what can be perceived' } },
  { es:'leche', en:'milk', ph:6, nota:{ es:'casi neutra, y se vuelve más ácida cuando se corta', en:'almost neutral, and it turns more acidic when it curdles' } },
  { es:'agua destilada', en:'distilled water', ph:7, nota:{ es:'el punto exacto donde la escala deja de ser ácida', en:'the exact point where the scale stops being acidic' } },
  { es:'agua de mar', en:'sea water', ph:8, nota:{ es:'apenas del lado básico, y los organismos marinos dependen de ese valor', en:'just on the basic side, and marine organisms depend on that value' } },
  { es:'bicarbonato disuelto en agua', en:'baking soda dissolved in water', ph:9, nota:{ es:'básico suave, por eso sirve para tratar derrames de ácido', en:'mildly basic, which is why it works for treating acid spills' } },
  { es:'leche de magnesia', en:'milk of magnesia', ph:10, nota:{ es:'básica, y por eso alivia el exceso de acidez del estómago', en:'basic, and that is why it relieves excess stomach acidity' } },
  { es:'limpiador con amoniaco', en:'ammonia based cleaner', ph:11, nota:{ es:'básico y corrosivo para la piel: se maneja con guantes', en:'basic and corrosive to the skin: it is handled with gloves' } },
  { es:'destapacaños', en:'drain cleaner', ph:13, nota:{ es:'de los productos más peligrosos que hay en una casa', en:'one of the most dangerous products there is in a home' } }
];

function phZone(v){ return v <= 3 ? 'za' : (v <= 6 ? 'zb' : (v === 7 ? 'zn' : (v <= 11 ? 'zc' : 'zd'))); }
function phLabel(v){
  if (v <= 3) return L({ es:'muy ácida', en:'strongly acidic' });
  if (v <= 6) return L({ es:'ácida', en:'acidic' });
  if (v === 7) return L({ es:'neutra', en:'neutral' });
  if (v <= 11) return L({ es:'básica', en:'basic' });
  return L({ es:'muy básica', en:'strongly basic' });
}

function wEscala(rng, host){
  var RONDAS = shuffle(ESCALA_SUST, rng).slice(0, 3);
  var st = { r:0, tries:0, hits:0, done:false };

  function celdas(){
    var out = '';
    for (var i = 0; i <= 14; i++){
      out += '<div class="ph-cell ' + phZone(i) + '" data-cell="' + i + '">' + i + '</div>';
    }
    return out;
  }

  function render(){
    if (st.done){
      host.innerHTML =
        '<div class="gw-h iw-tag">' + L({ es:'Escala de acidez', en:'Acidity scale' }) + '</div>' +
        '<div class="gw-fb good">' + L({ es:'Ubicaste las tres sustancias. Aciertos directos: ', en:'You placed the three substances. Direct hits: ' }) + st.hits + ' / ' + RONDAS.length + '. ' +
        L({ es:'Recuerda que moverse una sola casilla hacia la izquierda significa diez veces más iones hidrógeno, no un poco más.', en:'Remember that moving a single box to the left means ten times more hydrogen ions, not a little more.' }) + '</div>';
      return;
    }
    var s = RONDAS[st.r];
    host.innerHTML =
      '<div class="gw-h iw-tag">' + L({ es:'Escala de acidez', en:'Acidity scale' }) + '</div>' +
      '<div class="gw-mini iw-sub">' + L({
        es:'Arrastra el cursor hasta el valor de la escala que le corresponde a la sustancia. La lectura y la casilla encendida cambian mientras te mueves.',
        en:'Drag the cursor to the value of the scale that matches the substance. The reading and the lit box change as you move.'
      }) + '</div>' +
      '<div class="gw-prog">' + (st.r + 1) + ' / ' + RONDAS.length + '</div>' +
      '<div class="ph-target">' + L({ es:'Ubica: ', en:'Place: ' }) + L(s) + '</div>' +
      '<div class="ph-scale">' + celdas() + '</div>' +
      '<input type="range" class="ph-sl" min="0" max="14" step="1" value="7" data-r="sl">' +
      '<div class="ph-read"><span data-r="val">pH 7</span><span data-r="zon">' + phLabel(7) + '</span></div>' +
      '<div class="gw-row"><button class="gw-btn go" data-act="ver">' + L({ es:'Colocar aquí', en:'Place it here' }) + '</button></div>' +
      '<div class="gw-fb" data-r="fb">' + L({ es:'El 7 es el centro: por debajo la disolución es ácida y por encima es básica.', en:'The 7 is the centre: below it the solution is acidic and above it is basic.' }) + '</div>';
    live(7);
  }

  function live(v){
    var val = host.querySelector('[data-r="val"]');
    var zon = host.querySelector('[data-r="zon"]');
    if (val) val.textContent = 'pH ' + v;
    if (zon) zon.textContent = phLabel(v);
    host.querySelectorAll('[data-cell]').forEach(function(c){
      c.classList.toggle('on', parseInt(c.getAttribute('data-cell'), 10) === v);
    });
  }

  function say(cls, msg){
    var fb = host.querySelector('[data-r="fb"]');
    if (fb){ fb.className = 'gw-fb ' + cls; fb.innerHTML = msg; }
  }

  function advance(){
    st.r++; st.tries = 0;
    if (st.r >= RONDAS.length) st.done = true;
    setTimeout(render, 1600);
  }

  host.addEventListener('input', function(e){
    var sl = e.target && e.target.getAttribute && e.target.getAttribute('data-r') === 'sl' ? e.target : null;
    if (!sl) return;
    live(parseInt(sl.value, 10));
  });

  host.addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!b || st.done) return;
    var sl = host.querySelector('[data-r="sl"]');
    if (!sl) return;
    var v = parseInt(sl.value, 10);
    var s = RONDAS[st.r];
    if (v === s.ph){
      st.hits++;
      say('good', L({ es:'Exacto: ', en:'Exactly: ' }) + L(s) + ' ' + L({ es:'tiene pH ', en:'has pH ' }) + s.ph + ', ' + L(s.nota) + '.');
      advance();
      return;
    }
    st.tries++;
    if (st.tries >= 3){
      sl.value = String(s.ph);
      live(s.ph);
      say('warm', L({ es:'Su lugar es pH ', en:'Its place is pH ' }) + s.ph + ': ' + L(s.nota) + '.');
      advance();
      return;
    }
    var dif = v - s.ph;
    var lejos = Math.abs(dif) >= 4;
    if (dif > 0){
      say('miss', (lejos ? L({ es:'Muy lejos hacia arriba. ', en:'Far too high. ' }) : L({ es:'Te pasaste un poco. ', en:'A little too high. ' })) +
        L({ es:'Ahí la disolución sería más básica de lo que es: muévete hacia la izquierda, hacia el lado ácido.', en:'There the solution would be more basic than it is: move to the left, towards the acidic side.' }));
    } else {
      say('miss', (lejos ? L({ es:'Muy lejos hacia abajo. ', en:'Far too low. ' }) : L({ es:'Te quedaste corto. ', en:'A little too low. ' })) +
        L({ es:'Ahí la disolución sería más ácida de lo que es: muévete hacia la derecha, hacia el lado básico.', en:'There the solution would be more acidic than it is: move to the right, towards the basic side.' }));
    }
  });

  render();
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 4 :: armar los productos
   Los iones del ácido y de la base quedan sueltos sobre la mesa. El estudiante
   une dos fichas a la vez y el par se acepta solo si tiene sentido: cargas
   opuestas y sustancia nueva. Cada unión imposible explica por qué no funciona.
   ══════════════════════════════════════════════════════════════════════════ */
var PARES = [
  { ac:{ es:'ácido clorhídrico', en:'hydrochloric acid', f:'HCl' }, ba:{ es:'hidróxido de sodio', en:'sodium hydroxide', f:'NaOH' },
    cat:{ id:'Na', lab:'Na<sup>+</sup>' }, ani:{ id:'Cl', lab:'Cl<sup>-</sup>' },
    sal:{ f:'NaCl', es:'cloruro de sodio', en:'sodium chloride' } },
  { ac:{ es:'ácido nítrico', en:'nitric acid', f:'HNO<sub>3</sub>' }, ba:{ es:'hidróxido de potasio', en:'potassium hydroxide', f:'KOH' },
    cat:{ id:'K', lab:'K<sup>+</sup>' }, ani:{ id:'NO3', lab:'NO<sub>3</sub><sup>-</sup>' },
    sal:{ f:'KNO<sub>3</sub>', es:'nitrato de potasio', en:'potassium nitrate' } },
  { ac:{ es:'ácido clorhídrico', en:'hydrochloric acid', f:'HCl' }, ba:{ es:'hidróxido de potasio', en:'potassium hydroxide', f:'KOH' },
    cat:{ id:'K', lab:'K<sup>+</sup>' }, ani:{ id:'Cl', lab:'Cl<sup>-</sup>' },
    sal:{ f:'KCl', es:'cloruro de potasio', en:'potassium chloride' } },
  { ac:{ es:'ácido nítrico', en:'nitric acid', f:'HNO<sub>3</sub>' }, ba:{ es:'hidróxido de sodio', en:'sodium hydroxide', f:'NaOH' },
    cat:{ id:'Na', lab:'Na<sup>+</sup>' }, ani:{ id:'NO3', lab:'NO<sub>3</sub><sup>-</sup>' },
    sal:{ f:'NaNO<sub>3</sub>', es:'nitrato de sodio', en:'sodium nitrate' } }
];

function wNeutraliza(rng, host){
  var RONDAS = shuffle(PARES, rng).slice(0, 2);
  var st = { r:0, sel:[], tries:0, agua:false, sal:false, done:false };

  function fichas(){
    var p = RONDAS[st.r];
    return [
      { id:'H',  lab:'H<sup>+</sup>', q:1 },
      { id:p.ani.id, lab:p.ani.lab, q:-1 },
      { id:p.cat.id, lab:p.cat.lab, q:1 },
      { id:'OH', lab:'OH<sup>-</sup>', q:-1 }
    ];
  }

  function render(){
    if (st.done){
      host.innerHTML =
        '<div class="gw-h iw-tag">' + L({ es:'Armar los productos', en:'Build the products' }) + '</div>' +
        '<div class="gw-fb good">' + L({ es:'Armaste las dos mezclas. El reparto es siempre el mismo: el ion hidrógeno del ácido con el ion hidróxido de la base forman agua, y los dos iones que sobran forman la sal.', en:'You built the two mixtures. The sharing out is always the same: the hydrogen ion of the acid with the hydroxide ion of the base form water, and the two ions left over form the salt.' }) + '</div>';
      return;
    }
    var p = RONDAS[st.r];
    var fs = shuffle(fichas(), rng);
    st.orden = fs;
    host.innerHTML =
      '<div class="gw-h iw-tag">' + L({ es:'Armar los productos', en:'Build the products' }) + '</div>' +
      '<div class="gw-mini iw-sub">' + L({
        es:'Estos son los iones que quedan sueltos al mezclar el ácido con la base. Une dos fichas para formar un producto; si la unión no puede existir, la mesa te dice por qué.',
        en:'These are the ions left loose when the acid is mixed with the base. Join two chips to form a product; if the join cannot exist, the bench tells you why.'
      }) + '</div>' +
      '<div class="gw-prog">' + (st.r + 1) + ' / ' + RONDAS.length + '</div>' +
      '<div class="nz-eq">' + L(p.ac) + ' (' + p.ac.f + ')  +  ' + L(p.ba) + ' (' + p.ba.f + ')  →  ?</div>' +
      '<div class="nz-chips">' +
        fs.map(function(f, i){
          return '<button class="nz-chip" data-chip="' + i + '">' + f.lab + '</button>';
        }).join('') +
      '</div>' +
      '<div class="nz-slots">' +
        '<div class="nz-slot" data-r="s0">' + L({ es:'Producto 1', en:'Product 1' }) + '</div>' +
        '<div class="nz-slot" data-r="s1">' + L({ es:'Producto 2', en:'Product 2' }) + '</div>' +
      '</div>' +
      '<div class="gw-fb" data-r="fb">' + L({ es:'Empieza por la pareja que tenga cargas opuestas.', en:'Start with the pair that has opposite charges.' }) + '</div>';
    st.sel = []; st.agua = false; st.sal = false; st.tries = 0;
  }

  function say(cls, msg){
    var fb = host.querySelector('[data-r="fb"]');
    if (fb){ fb.className = 'gw-fb ' + cls; fb.innerHTML = msg; }
  }

  function marcarUsadas(ids){
    host.querySelectorAll('[data-chip]').forEach(function(b){
      var f = st.orden[parseInt(b.getAttribute('data-chip'), 10)];
      if (ids.indexOf(f.id) !== -1){ b.classList.add('used'); b.classList.remove('sel'); }
    });
  }

  function ponerSlot(which, formula, nombre){
    var slot = host.querySelector('[data-r="s' + which + '"]');
    if (slot){
      slot.className = 'nz-slot full';
      slot.innerHTML = '<div class="nz-form">' + formula + '</div>' + nombre;
    }
  }

  function revisarFin(){
    if (!(st.agua && st.sal)) return;
    var p = RONDAS[st.r];
    say('good', L({ es:'Ecuación completa: ', en:'Complete equation: ' }) + L(p.ac) + ' + ' + L(p.ba) + ' → ' + L(p.sal) + ' + ' + L({ es:'agua', en:'water' }) +
      '. ' + L({ es:'El pH de la mezcla queda cerca de 7.', en:'The pH of the mixture ends up close to 7.' }));
    st.r++;
    if (st.r >= RONDAS.length) st.done = true;
    setTimeout(render, 1800);
  }

  function revelar(){
    var p = RONDAS[st.r];
    if (!st.agua){ ponerSlot(0, 'H<sub>2</sub>O', L({ es:'agua', en:'water' })); st.agua = true; }
    if (!st.sal){ ponerSlot(1, p.sal.f, L(p.sal)); st.sal = true; }
    marcarUsadas(['H', 'OH', p.cat.id, p.ani.id]);
    say('warm', L({ es:'Así queda el reparto: el hidrógeno con el hidróxido dan agua, y los otros dos iones dan la sal.', en:'This is how the sharing out ends: hydrogen with hydroxide give water, and the other two ions give the salt.' }));
    st.r++;
    if (st.r >= RONDAS.length) st.done = true;
    setTimeout(render, 2200);
  }

  function evaluar(a, b){
    var p = RONDAS[st.r];
    var ids = [a.id, b.id];
    var tieneH = ids.indexOf('H') !== -1, tieneOH = ids.indexOf('OH') !== -1;
    var tieneCat = ids.indexOf(p.cat.id) !== -1, tieneAni = ids.indexOf(p.ani.id) !== -1;
    if (tieneH && tieneOH){
      if (st.agua){ say('miss', L({ es:'El agua ya está formada; queda por armar el otro producto.', en:'The water is already formed; the other product is still to be built.' })); return; }
      st.agua = true;
      ponerSlot(0, 'H<sub>2</sub>O', L({ es:'agua', en:'water' }));
      marcarUsadas(['H', 'OH']);
      say('good', L({ es:'Así es: el ion hidrógeno del ácido y el ion hidróxido de la base se unen y forman agua.', en:'That is it: the hydrogen ion of the acid and the hydroxide ion of the base join and form water.' }));
      revisarFin();
      return;
    }
    if (tieneCat && tieneAni){
      if (st.sal){ say('miss', L({ es:'La sal ya está formada; queda por armar el otro producto.', en:'The salt is already formed; the other product is still to be built.' })); return; }
      st.sal = true;
      ponerSlot(1, p.sal.f, L(p.sal));
      marcarUsadas([p.cat.id, p.ani.id]);
      say('good', L({ es:'Correcto: los dos iones que sobran forman una sal, ', en:'Correct: the two ions left over form a salt, ' }) + L(p.sal) + '.');
      revisarFin();
      return;
    }
    st.tries++;
    if (st.tries >= 3){ revelar(); return; }
    if (a.q === b.q && a.q > 0){
      say('miss', L({ es:'Las dos fichas tienen carga positiva y se rechazan. Busca una con carga negativa.', en:'Both chips carry positive charge and they push each other away. Look for one with negative charge.' }));
    } else if (a.q === b.q){
      say('miss', L({ es:'Las dos fichas tienen carga negativa y se rechazan. Busca una con carga positiva.', en:'Both chips carry negative charge and they push each other away. Look for one with positive charge.' }));
    } else if (tieneH && tieneAni){
      say('miss', L({ es:'Esa unión te devuelve el ácido con el que empezaste, no un producto nuevo.', en:'That join gives you back the acid you started with, not a new product.' }));
    } else {
      say('miss', L({ es:'Esa unión te devuelve la base con la que empezaste, no un producto nuevo.', en:'That join gives you back the base you started with, not a new product.' }));
    }
    st.sel = [];
    host.querySelectorAll('[data-chip]').forEach(function(x){ x.classList.remove('sel'); });
  }

  host.addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('[data-chip]') : null;
    if (!b || st.done || b.classList.contains('used')) return;
    var i = parseInt(b.getAttribute('data-chip'), 10);
    if (st.sel.length === 1 && st.sel[0] === i){
      st.sel = []; b.classList.remove('sel'); return;
    }
    if (st.sel.length === 0){
      st.sel = [i]; b.classList.add('sel'); return;
    }
    var first = st.orden[st.sel[0]], second = st.orden[i];
    b.classList.add('sel');
    st.sel = [];
    evaluar(first, second);
  });

  render();
}

          en:'A school laboratory measures the pH of two juices with a digital meter: juice A reads pH ' + pa + ' and juice B reads pH ' + pb + '. How many times greater is the concentration of hydrogen ions of juice A compared with that of juice B?' },
      opts:{ es:[f + ' veces', bajo + ' veces', '10 veces', alto + ' veces'],

             en:'Count how many units of the scale separate the two values. Each unit multiplies the concentration of hydrogen ions by ten, so ten has to be multiplied by itself that many times.' },
      exp:{ es:'Entre pH ' + pa + ' y pH ' + pb + ' hay ' + d + ' unidades de diferencia. Como cada unidad vale un factor de diez, la diferencia total es diez multiplicado por sí mismo ' + d + ' veces, es decir ' + f + ' veces. Restar los valores del pH daría solo ' + d + ', que es el número de saltos, no el tamaño de la diferencia.',
            en:'Between pH ' + pa + ' and pH ' + pb + ' there are ' + d + ' units of difference. Since each unit is worth a factor of ten, the total difference is ten multiplied by itself ' + d + ' times, that is ' + f + ' times. Subtracting the pH values would give only ' + d + ', which is the number of steps, not the size of the difference.' } },
