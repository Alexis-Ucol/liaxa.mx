<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Construcción de Normas para Garantizar los Derechos Humanos</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }

/* ── INTERACTIVE WIDGETS ── */
.wgt { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.1rem; margin:1rem 0; }
.wgt-h { font-size:.68rem; letter-spacing:.11em; text-transform:uppercase; color:var(--text3); margin-bottom:.55rem; font-weight:600; }
.wgt-q { font-size:.9rem; font-weight:600; margin-bottom:.6rem; }
.wcase { background:var(--surface2); border-left:4px solid var(--gold); border-radius:0 8px 8px 0; padding:.75rem .9rem; font-size:.88rem; color:var(--text2); margin-bottom:.8rem; }
.wmsg { margin-top:.7rem; font-size:.83rem; padding:.6rem .8rem; border-radius:8px; background:var(--surface2); color:var(--text2); }
.wmsg.ok { background:var(--ok-bg); color:var(--ok); }
.wmsg.warn { background:var(--gold-bg); color:var(--text2); border-left:3px solid var(--gold); }
.wprog { font-size:.72rem; color:var(--text3); margin-top:.5rem; letter-spacing:.04em; }
.wbtn { background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:.45rem .9rem; font-size:.78rem; cursor:pointer; color:var(--text2); margin-top:.65rem; min-height:44px; }
.wbtn:hover { border-color:var(--green); color:var(--green); }
.wrow { display:flex; gap:.5rem; flex-wrap:wrap; }
/* constructor de normas: ranuras + piezas */
.slotgrid { display:grid; gap:.5rem; margin-bottom:.85rem; }
.slot { border:1.5px dashed var(--border); border-radius:8px; padding:.55rem .8rem; font-size:.82rem; color:var(--text3); min-height:44px; display:flex; align-items:center; gap:.6rem; flex-wrap:wrap; }
.slot.filled { border-style:solid; border-color:var(--green); background:var(--green-bg); color:var(--text); }
.slot.aim { border-color:var(--gold); background:var(--gold-bg); color:var(--text2); }
.slot.done { border-style:solid; border-color:var(--ok); background:var(--ok-bg); color:var(--text); }
.slotlbl { font-size:.64rem; text-transform:uppercase; letter-spacing:.09em; color:var(--gold); font-weight:700; flex-shrink:0; }
.frag { background:var(--surface2); border:1.5px solid var(--border); border-radius:8px; padding:.5rem .8rem; font-size:.81rem; cursor:pointer; color:var(--text2); transition:all .14s; min-height:44px; display:flex; align-items:center; }
.frag:hover { border-color:var(--green); color:var(--green); }
.frag.used { opacity:.35; pointer-events:none; }
.frag.miss { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.fraglist { display:flex; flex-direction:column; gap:.45rem; }
/* detector de fallas: fichas de requisitos */
.chips { display:flex; flex-wrap:wrap; gap:.45rem; }
.chip { background:var(--surface2); border:1.5px solid var(--border); border-radius:22px; padding:.45rem .9rem; font-size:.8rem; cursor:pointer; color:var(--text2); transition:all .14s; min-height:44px; display:flex; align-items:center; }
.chip:hover { border-color:var(--green); color:var(--green); }
.chip.good { border-color:var(--ok); background:var(--ok-bg); color:var(--ok); }
.chip.miss { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.chip.used { opacity:.4; pointer-events:none; }
/* mesa de acuerdos: lienzo + interruptores de voces */
.mesawrap { border:1px solid var(--border); border-radius:10px; background:var(--surface2); overflow:hidden; margin-bottom:.8rem; }
.mesacv { display:block; width:100%; height:250px; }
.voces { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:.5rem; }
.voz { background:var(--surface2); border:1.5px solid var(--border); border-radius:10px; padding:.55rem .7rem; font-size:.8rem; cursor:pointer; color:var(--text2); transition:all .15s; min-height:44px; display:flex; flex-direction:column; justify-content:center; }
.voz:hover { border-color:var(--green); }
.voz.on { border-color:var(--green); background:var(--green-bg); color:var(--green-dark); font-weight:600; }
.voz.key { border-color:var(--ok); background:var(--ok-bg); color:var(--ok); }
.voz.over { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.vozname { font-size:.79rem; }
.vozsub { font-size:.68rem; color:var(--text3); margin-top:.15rem; }
.meter { height:14px; border-radius:8px; background:var(--surface2); border:1px solid var(--border); overflow:hidden; margin-top:.75rem; }
.meterfill { height:100%; background:var(--green); width:0%; transition:width .35s; }
.meterfill.full { background:var(--ok); }
/* ruta de la norma: eslabones encadenados */
.chainrow { display:flex; flex-wrap:wrap; align-items:center; gap:.4rem; margin:.7rem 0; min-height:44px; }
.link { background:var(--green-bg); border:1.5px solid var(--green); color:var(--green-dark); border-radius:8px; padding:.42rem .7rem; font-size:.79rem; }
.link.start { background:var(--gold-bg); border-color:var(--gold); color:var(--text); }
.link.ghost { background:var(--surface2); border:1.5px dashed var(--border); color:var(--text3); }
.arw { color:var(--text3); font-weight:700; }
.opts2 { display:flex; flex-direction:column; gap:.45rem; margin-top:.6rem; }
.opt2 { background:var(--surface2); border:1.5px solid var(--border); border-radius:8px; padding:.55rem .8rem; font-size:.81rem; cursor:pointer; color:var(--text2); transition:all .14s; min-height:44px; display:flex; align-items:center; }
.opt2:hover { border-color:var(--green); color:var(--green); }
.opt2.miss { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.opt2.good { border-color:var(--ok); background:var(--ok-bg); color:var(--ok); }

.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);

  opts.forEach(function(o, i) {

    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');

}

async function generatePDF() {
  var btn = document.getElementById('dlBtn');
  btn.textContent = 'Generando PDF…';
  btn.disabled = true;

  var jspdf   = window.jspdf;
  var doc     = new jspdf.jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });
  var PW      = 215.9;
  var M       = 18;
  var TW      = PW - M * 2;
  var PH      = doc.internal.pageSize.height;
  var name    = studentData.name;
  var group   = studentData.group;
  var total   = problems.length;
  var pct     = Math.round(correctCount / total * 100);
  var dateStr = new Date().toLocaleString('es-MX', { dateStyle:'long', timeStyle:'short' });

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS — INJECTION BLOCK ─────────────────────────────────────────
  //   Match these RGB values to --green and --gold above.
  //   PRIMARY  → pBR, pBG, pBB
  //   ACCENT   → pAR, pAG, pAB
  // ──────────────────────────────────────────────────────────────────────────
  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;  // PRIMARY (from SCHOOL, Rule 16)
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;   // ACCENT (from SCHOOL, Rule 16)

  function pdfText(html) {
    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/\u2192/g,'->').replace(/\u2212/g,'-').replace(/\u00b2/g,'^2')
      .replace(/\u00b3/g,'^3').replace(/\u00d7/g,'x').replace(/\u00f7/g,'/')
      .replace(/\u2260/g,'!=').replace(/\u2264/g,'<=').replace(/\u2265/g,'>=')
      .replace(/\u221a/g,'sqrt').replace(/\u03c0/g,'pi').replace(/\u2026/g,'...')
      .replace(/\s+/g,' ').trim();
  }

  // ── PORTADA: orange line / white logo strip / orange line / blue band ──
  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,2,'F');   // top accent line
  doc.setFillColor(255,255,255); doc.rect(0,2,PW,26,'F');                               // white logo strip
  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,28,PW,2,'F');  // bottom accent line
  doc.setFillColor(pBR,pBG,pBB); doc.rect(0,30,PW,34,'F');       // blue header band

  if (SCHOOL.logoLeftB64) {

    setTimeout(function(){ URL.revokeObjectURL(u); }, 60000);
  }

               (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  if (_isIOS) {
    var _pdfFile = new File([_pdfBlob], _fname, { type:'application/pdf' });

      navigator.share({ files:[_pdfFile], title:_fname })
        .then(_restorePdfBtn)

  document.body.appendChild(_dlA); _dlA.click();

  _restorePdfBtn();
}

/* Shuffles options (Rule 7) keeping ES/EN aligned, then builds the card inline (Rule 1/5). */
function addProblem(v, rng){
  var n = v.options.es.length, idx = [], k;
  for (k = 0; k < n; k++) idx.push(k);
  for (k = n - 1; k > 0; k--) {
    var j = Math.floor(rng() * (k + 1));
    var tmp = idx[k]; idx[k] = idx[j]; idx[j] = tmp;
  }
  var langOpts = (LANG === 'es') ? v.options.es : v.options.en;
  var prob = {
    title:        v.title[LANG],
    questionText: v.stmt[LANG],
    fn:           v.fn || '',
    hint:         v.hint[LANG],
    explanation:  v.explanation[LANG],
    options:      idx.map(function(o){ return langOpts[o]; }),
    correctIdx:   idx.indexOf(v.correct),
    showWork:     !!v.showWork,
    studentChoice:null, pendingChoice:null
  };
  problems.push(prob);
  buildOneCard(prob, problems.length - 1);
}

/* ================================================

   The student assembles a rule piece by piece: the right it protects, the
   agreement itself, and how it is applied and reviewed. A piece that does not
   belong returns a message pointing at what the empty slot still needs; the
   piece is revealed on the third miss. Pieces can be undone at any time.
   ================================================ */
var NB = null;
function nbSlotLbl(i){
  return [ S('Derecho que se cuida','Right being protected'),
           S('Acuerdo: qué hacemos','Agreement: what we do'),
           S('Cómo se aplica y se revisa','How it is applied and reviewed') ][i];

function nbAim(i){

function nbRender(){
  if (!NB) return;
  var box = document.getElementById('nbBox');
  if (!box) return;
  var rd = NB.rounds[NB.r];
  var slots = '';
  for (var i = 0; i < 3; i++) {
    var cls = 'slot', body = '';
    if (i < NB.filled.length) {
      cls += (NB.state === 'ok' || NB.state === 'reveal') ? ' done' : ' filled';
      body = rd.frags[NB.filled[i]].t[LANG];
    } else if (i === NB.filled.length && NB.state === 'play') {
      cls += ' aim';
      body = S('elige una pieza','choose a piece');
    } else {
      body = '·';
    }
    slots += '<div class="' + cls + '"><span class="slotlbl">' + nbSlotLbl(i) + '</span><span>' + body + '</span></div>';
  }
  var list = rd.frags.map(function(f, k){
    var cls = 'frag';
    if (NB.filled.indexOf(k) >= 0) cls += ' used';
    else if (NB.state !== 'play') cls += ' used';
    if (NB.miss === k) cls += ' miss';
    return '<div class="' + cls + '" onclick="nbTap(' + k + ')">' + f.t[LANG] + '</div>';
  }).join('');
  var msg, cl = '';
  if (NB.state === 'ok') { msg = S('Norma armada. ','Rule assembled. ') + rd.why[LANG]; cl = ' ok'; }
  else if (NB.state === 'reveal') { msg = S('Estas eran las tres piezas que se sostienen entre sí. ','These were the three pieces that hold each other up. ') + rd.why[LANG]; cl = ' warn'; }
  else if (NB.flash) { msg = NB.flash; cl = ' warn'; }
  else { msg = nbAim(NB.filled.length); }
  var btns = '';
  if (NB.state === 'play' && NB.filled.length > 0) btns += '<button class="wbtn" onclick="nbUndo()">' + S('Quitar la última','Remove the last') + '</button>';
  if (NB.state !== 'play' && NB.r < NB.rounds.length - 1) btns += '<button class="wbtn" onclick="nbNext()">' + S('Otra situación →','Another situation →') + '</button>';
  box.innerHTML =
    '<div class="wcase">' + rd.c[LANG] + '</div>' +
    '<div class="slotgrid">' + slots + '</div>' +
    '<div class="fraglist">' + list + '</div>' +
    '<div class="wmsg' + cl + '">' + msg + '</div>' +
    '<div class="wrow">' + btns + '</div>' +
    '<div class="wprog">' + S('Situación ','Situation ') + (NB.r + 1) + ' / ' + NB.rounds.length + '</div>';
}
function nbTap(k){
  if (!NB || NB.state !== 'play') return;
  var rd = NB.rounds[NB.r], f = rd.frags[k], cur = NB.filled.length;
  NB.miss = -1;
  if (f.s === cur) {
    NB.filled.push(k); NB.tries = 0; NB.flash = null;
    if (NB.filled.length === 3) NB.state = 'ok';
    nbRender(); return;
  }
  NB.tries++;
  if (NB.tries >= 3) {
    for (var j = 0; j < rd.frags.length; j++) {
      if (rd.frags[j].s === cur && NB.filled.indexOf(j) < 0) { NB.filled.push(j); break; }
    }
    NB.tries = 0; NB.flash = S('Esta era la pieza que faltaba en esa ranura. Sigue con la siguiente.',
                               'This was the piece missing in that slot. Carry on with the next one.');
    if (NB.filled.length === 3) NB.state = 'reveal';
    nbRender(); return;
  }
  NB.miss = k;
  var w = f.w ? f.w[LANG] : S('Esa pieza corresponde a otro momento de la norma.','That piece belongs to another moment of the rule.');
  NB.flash = w + ' ' + nbAim(cur);
  nbRender();
  setTimeout(function(){ if (NB && NB.miss === k) { NB.miss = -1; nbRender(); } }, 1400);
}
function nbUndo(){
  if (!NB || NB.state !== 'play' || !NB.filled.length) return;
  NB.filled.pop(); NB.flash = null; NB.miss = -1; NB.tries = 0;
  nbRender();
}
function nbNext(){
  if (!NB) return;
  NB.r++; NB.filled = []; NB.tries = 0; NB.state = 'play'; NB.flash = null; NB.miss = -1;
  nbRender();
}

function msStats(){
  var rd = MS.rounds[MS.r], hits = 0, extra = 0, need = 0, i;
  for (i = 0; i < rd.v.length; i++) {
    if (rd.v[i].need) need++;
    if (MS.sel[i]) { if (rd.v[i].need) hits++; else extra++; }
  }
  return { rd:rd, hits:hits, extra:extra, need:need, missing:need - hits };
}
function msDraw(){
  var cv = document.getElementById('msCv');
  if (!cv || !MS) return;
  var r = cv.getBoundingClientRect();
  if (!r.width) return;
  var dpr = window.devicePixelRatio || 1;
  cv.width = r.width * dpr; cv.height = r.height * dpr;
  var ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  var W = r.width, H = r.height;
  var cs = getComputedStyle(document.documentElement);
  var CG = cs.getPropertyValue('--green').trim() || '#1a4a8a';
  var CGB = cs.getPropertyValue('--green-bg').trim() || '#e8edf5';
  var CA = cs.getPropertyValue('--gold').trim() || '#c9a84c';
  var CT = cs.getPropertyValue('--text2').trim() || '#4a4640';
  var C3 = cs.getPropertyValue('--text3').trim() || '#7a7468';
  var CB = cs.getPropertyValue('--border').trim() || '#ddd8cc';
  var CS = cs.getPropertyValue('--surface').trim() || '#ffffff';
  var rd = MS.rounds[MS.r];
  ctx.clearRect(0, 0, W, H);
  var cx = W / 2, cy = H / 2 + 4;
  var rx = Math.min(W * 0.20, 92), ry = Math.min(H * 0.16, 40);
  ctx.fillStyle = CGB; ctx.strokeStyle = CG; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = CG; ctx.font = '600 12px IBM Plex Sans, sans-serif'; ctx.textAlign = 'center';
  ctx.fillText(S('Mesa de acuerdos','Agreement table'), cx, cy + 4);
  var n = rd.v.length;
  var orx = Math.min(W * 0.40, 190), ory = Math.min(H * 0.36, 92);
  for (var i = 0; i < n; i++) {
    var ang = -Math.PI / 2 + (i * 2 * Math.PI / n);
    var on = MS.sel[i];
    var far = on ? 1 : 1.22;
    var x = cx + Math.cos(ang) * orx * far;
    var y = cy + Math.sin(ang) * ory * far;
    if (x < 34) x = 34; if (x > W - 34) x = W - 34;
    if (y < 22) y = 22; if (y > H - 20) y = H - 20;
    if (on) {
      ctx.strokeStyle = CG; ctx.lineWidth = 1.5; ctx.setLineDash([]);
      ctx.beginPath(); ctx.moveTo(cx + Math.cos(ang) * rx, cy + Math.sin(ang) * ry); ctx.lineTo(x, y); ctx.stroke();
      ctx.fillStyle = CG; ctx.strokeStyle = CA; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(x, y, 13, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = CS; ctx.font = '700 11px IBM Plex Sans, sans-serif';
      ctx.fillText('✓', x, y + 4);
      ctx.fillStyle = CT;
    } else {
      ctx.setLineDash([4, 3]); ctx.strokeStyle = CB; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(x, y, 12, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = C3;
    }
    ctx.font = '10px IBM Plex Sans, sans-serif';
    var lbl = rd.v[i].sh[LANG];
    var ly = (Math.sin(ang) < -0.4) ? y - 18 : y + 26;
    ctx.fillText(lbl, x, ly);
  }
}
function msRender(){
  if (!MS) return;
  var box = document.getElementById('msBox');
  if (!box) return;
  var st = msStats(), rd = st.rd;
  var cards = rd.v.map(function(v, k){
    var cls = 'voz';
    if (MS.state === 'play') { if (MS.sel[k]) cls += ' on'; }
    else { if (v.need) cls += ' key'; else if (MS.sel[k]) cls += ' over'; }
    return '<div class="' + cls + '" onclick="msTap(' + k + ')">' +
             '<div class="vozname">' + v.n[LANG] + '</div>' +
             '<div class="vozsub">' + (MS.sel[k] ? S('en la mesa','at the table') : S('fuera de la mesa','away from the table')) + '</div>' +
           '</div>';
  }).join('');
  var clauses = rd.v.map(function(v, k){
    if (!MS.sel[k]) return '';
    return '<li>' + v.adds[LANG] + '</li>';
  }).join('');
  var acuerdo = clauses ?
    ('<div class="wcase"><strong>' + S('Acuerdo que va saliendo:','Agreement taking shape:') + '</strong><ul style="margin:.4rem 0 0 1rem">' + clauses + '</ul></div>') :
    ('<div class="wcase">' + S('La mesa está vacía: por ahora el acuerdo no dice nada.','The table is empty: for now the agreement says nothing.') + '</div>');
  var msg, cl = '';
  if (MS.state === 'ok') { msg = S('Mesa completa. ','Table complete. ') + rd.why[LANG]; cl = ' ok'; }
  else if (MS.state === 'reveal') { msg = S('Estas eran las voces indispensables, marcadas en verde. ','These were the indispensable voices, marked in green. ') + rd.why[LANG]; cl = ' warn'; }
  else if (MS.flash) { msg = MS.flash; cl = ' warn'; }
  else if (st.extra > 0) {
    msg = S('Hay en la mesa una voz que este caso no señala como indispensable. Puedes apagarla tocándola otra vez.',
            'There is a voice at the table this case does not point to as indispensable. You can switch it off by tapping again.');
    cl = ' warn';
  } else if (st.hits === 0) {
    msg = S('Toca a las personas que viven este problema para sentarlas. Puedes sentarlas y levantarlas las veces que quieras.',
            'Tap the people who live this problem to seat them. You can seat and unseat them as many times as you like.');
  } else if (st.missing > 0) {
    var g = null;
    for (var i = 0; i < rd.v.length; i++) if (rd.v[i].need && !MS.sel[i]) { g = rd.v[i].gap[LANG]; break; }
    msg = S('El acuerdo todavía no dice nada sobre ' + g + ', porque quien lo vive sigue fuera de la mesa.',
            'The agreement still says nothing about ' + g + ', because whoever lives it is still away from the table.');
  } else {
    msg = S('El acuerdo ya cubre las tres partes del problema. Toca Comprobar.',
            'The agreement now covers the three parts of the problem. Tap Check.');
  }
  var btns = '';
  if (MS.state === 'play') btns += '<button class="wbtn" onclick="msCheck()">' + S('Comprobar','Check') + '</button>';
  if (MS.state !== 'play' && MS.r < MS.rounds.length - 1) btns += '<button class="wbtn" onclick="msNext()">' + S('Otro acuerdo →','Another agreement →') + '</button>';
  var pctv = Math.round(st.hits / st.need * 100);
  box.innerHTML =
    '<div class="wcase">' + rd.c[LANG] + '</div>' +
    '<div class="mesawrap"><canvas class="mesacv" id="msCv"></canvas></div>' +
    '<div class="voces">' + cards + '</div>' +
    acuerdo +
    '<div class="meter"><div class="meterfill' + ((st.missing === 0 && st.extra === 0) ? ' full' : '') + '" style="width:' + pctv + '%"></div></div>' +
    '<div class="wmsg' + cl + '">' + msg + '</div>' +
    '<div class="wrow">' + btns + '</div>' +
    '<div class="wprog">' + S('Acuerdo ','Agreement ') + (MS.r + 1) + ' / ' + MS.rounds.length + '</div>';
  setTimeout(msDraw, 20);
}
function msTap(k){
  if (!MS || MS.state !== 'play') return;
  MS.sel[k] = !MS.sel[k];
  MS.flash = null;
  msRender();
}
function msCheck(){
  if (!MS || MS.state !== 'play') return;
  var st = msStats();
  if (st.missing === 0 && st.extra === 0) { MS.state = 'ok'; MS.flash = null; msRender(); return; }
  MS.tries++;
  if (MS.tries >= 3) {
    MS.state = 'reveal';
    MS.sel = st.rd.v.map(function(v){ return !!v.need; });
  } else if (st.extra > 0) {
    MS.flash = S('Esa voz puede sumar en otros temas, pero el caso no la señala como indispensable aquí. Revisa a quién afecta el problema de manera directa.',
                 'That voice can add value on other matters, but the case does not point to it as indispensable here. Check who the problem affects directly.');
  } else {
    MS.flash = S('Falta al menos una voz que vive este problema, y por eso el acuerdo tiene un hueco. Vuelve a leer el caso.',
                 'At least one voice that lives this problem is missing, and that is why the agreement has a hole. Read the case again.');
  }
  msRender();
}
function msNext(){
  if (!MS) return;
  MS.r++; MS.sel = [false,false,false,false,false];
  MS.tries = 0; MS.state = 'play'; MS.flash = null;
  msRender();
}

/* ================================================
   WIDGET 4 - RUTA DE LA NORMA
   The chain is built one link at a time. Choosing a step that belongs later
   answers with what is still missing before it; after three misses the link
   is added with its explanation. The chain can be undone or restarted.
   ================================================ */
var RT = null;
function buildRT(rng){
  var chains = [
    { start:{ es:'Notamos que en el receso varios se quedan sin lugar para jugar', en:'We notice that at break several are left with nowhere to play' },

        { ok:{ es:'Nombramos el derecho que está en juego: descansar y jugar en un espacio común',

        { ok:{ es:'Escuchamos a todos los grupos y al personal que cuida el patio',

          w:[ { es:'Una decisión tomada sin escuchar deja fuera necesidades que nadie más conoce, y suele terminar incumplida.',
                en:'A decision taken without listening leaves out needs nobody else knows, and usually ends up unmet.' },

          note:{ es:'Escuchar es lo que hace que la norma recoja necesidades reales.',

        { ok:{ es:'Acordamos entre todos un rol de horarios y lo escribimos con claridad',
               en:'Together we agree on a schedule rota and write it down clearly' },
          bad:[ { es:'Cada grupo aplica en su salón la versión que más le convenga',
                  en:'Each group applies in its classroom whichever version suits it best' },
                { es:'Guardamos las propuestas en una carpeta para consultarlas algún día',

          w:[ { es:'Si cada quien se queda con su versión, no hay norma común: vuelve el mismo conflicto del receso.',
                en:'If each keeps their own version there is no common rule: the same break time conflict returns.' },
              { es:'Guardar propuestas no crea un acuerdo. Hay que elegir una y dejarla por escrito para todos.',
                en:'Filing proposals creates no agreement. One must be chosen and written down for everyone.' } ],
          note:{ es:'Escrito y conocido, el acuerdo deja de depender de la memoria de cada quien.',
                 en:'Written and known, the agreement stops depending on each person memory.' } },
        { ok:{ es:'Aplicamos el rol de la misma manera para todos los grupos',
               en:'We apply the rota in the same way for every group' },
          bad:[ { es:'Aplicamos el rol solo a los grupos que estuvieron de acuerdo',
                  en:'We apply the rota only to the groups that agreed' },
                { es:'Volvemos a preguntar a cada grupo qué horario prefiere',
                  en:'We ask each group again which schedule it prefers' } ],
          w:[ { es:'Una norma que se aplica solo a unos deja de proteger a todos y se convierte en un privilegio.',
                en:'A rule applied only to some stops protecting everyone and turns into a privilege.' },
              { es:'Preguntar otra vez lo ya acordado detiene el proceso. Ese momento ya pasó.',
                en:'Asking again about what was already agreed stalls the process. That moment has passed.' } ],
          note:{ es:'Aplicarla parejo es lo que sostiene la confianza en el acuerdo.',
                 en:'Applying it evenly is what sustains trust in the agreement.' } },
        { ok:{ es:'Revisamos en asamblea si funcionó y ajustamos lo que hizo falta',
               en:'We review in assembly whether it worked and adjust what was needed' },
          bad:[ { es:'Dejamos el rol tal cual para siempre, sin volver a hablar del tema',
                  en:'We leave the rota as it is forever, without discussing it again' },
                { es:'Nombramos otra vez el derecho que estaba en juego al inicio',
                  en:'We name again the right that was at stake at the beginning' } ],
          w:[ { es:'Una norma que nunca se revisa envejece: cambian los grupos y los horarios, y deja de servir.',
                en:'A rule that is never reviewed ages: groups and schedules change, and it stops working.' },
              { es:'Ese paso ya lo diste al principio del camino. Ahora toca mirar el resultado.',
                en:'You already took that step at the start of the road. Now it is time to look at the result.' } ],
          note:{ es:'Revisar convierte el acuerdo en algo vivo y no en un papel viejo.',

      ] },
    { start:{ es:'Notamos que en la comunidad la parada del camión quedó a oscuras y sin banqueta', en:'We notice that in the community the bus stop is left dark and with no sidewalk' },
      steps:[
        { ok:{ es:'Nombramos el derecho que está en juego: moverse con seguridad por la comunidad',
               en:'We name the right at stake: moving safely around the community' },
          bad:[ { es:'Pedimos que se multe a quien deje su auto sobre el paso peatonal',
                  en:'We ask for a fine for anyone leaving their car on the crosswalk' },
                { es:'Redactamos el acuerdo vecinal y lo firmamos esa misma tarde',
                  en:'We draft the neighborhood agreement and sign it that same afternoon' } ],
          w:[ { es:'Una multa castiga un caso suelto, pero no dice qué se busca proteger en la comunidad.',
                en:'A fine punishes an isolated case, but it does not say what the community seeks to protect.' },
              { es:'Firmar sin haber dicho qué derecho está en riesgo deja el acuerdo sin brújula.',
                en:'Signing without saying which right is at risk leaves the agreement with no compass.' } ],
          note:{ es:'El derecho afectado es el punto de partida de toda norma.',

        { ok:{ es:'Escuchamos a quienes usan la parada de noche y a quienes viven frente a ella',

          bad:[ { es:'Un vecino redacta la propuesta y la manda por mensaje al grupo',
                  en:'One neighbor drafts the proposal and sends it to the group by message' },
                { es:'Revisamos a los seis meses si el alumbrado sigue encendido',
                  en:'We check in six months whether the lighting is still on' } ],
          w:[ { es:'Una propuesta escrita por una sola persona recoge una sola experiencia; quedan fuera quienes esperan ahí de noche.',
                en:'A proposal written by one person gathers one single experience; those waiting there at night are left out.' },
              { es:'Revisar es el último paso: por ahora no hay nada instalado que revisar.',
                en:'Reviewing is the last step: for now there is nothing installed to review.' } ],
          note:{ es:'Quien vive el problema aporta datos que nadie más tiene.',
                 en:'Whoever lives the problem brings information nobody else has.' } },
        { ok:{ es:'Acordamos en asamblea qué pedir y lo dejamos por escrito con responsables',
               en:'In assembly we agree what to request and put it in writing with people responsible' },
          bad:[ { es:'Cada familia decide por su cuenta qué le pide a la autoridad',
                  en:'Each family decides on its own what to request from the authority' },
                { es:'Esperamos a que la autoridad proponga algo cuando pueda',
                  en:'We wait for the authority to propose something when it can' } ],
          w:[ { es:'Peticiones sueltas se dispersan y ninguna llega con la fuerza de un acuerdo común.',
                en:'Scattered requests get lost and none arrives with the strength of a common agreement.' },
              { es:'Esperar no es acordar. Sin un texto común no hay nada que sostener frente a la autoridad.',
                en:'Waiting is not agreeing. With no common text there is nothing to uphold before the authority.' } ],
          note:{ es:'Un acuerdo escrito y con responsables se puede exigir.',
                 en:'An agreement in writing and with people responsible can be demanded.' } },
        { ok:{ es:'Presentamos el acuerdo ante la autoridad municipal y damos seguimiento',
               en:'We present the agreement to the municipal authority and follow it up' },

                en:'A filed agreement does not change the street. Someone has to take it to whoever can install the lighting.' },
              { es:'Volver a escuchar lo mismo repite un paso ya dado y deja el acuerdo detenido.',
                en:'Listening to the same thing again repeats a step already taken and leaves the agreement stalled.' } ],
          note:{ es:'Las instituciones existen para responder a acuerdos como este.',
                 en:'Institutions exist to respond to agreements like this one.' } },
        { ok:{ es:'Revisamos si el problema se resolvió y ajustamos el acuerdo si hace falta',
               en:'We check whether the problem was solved and adjust the agreement if needed' },
          bad:[ { es:'Damos por terminado el asunto en cuanto se entrega el escrito',

                { es:'Nombramos de nuevo el derecho que estaba en juego al inicio',
                  en:'We name again the right that was at stake at the beginning' } ],

                en:'Handing in a document does not guarantee the stop ends up lit. The result has to be checked.' },
              { es:'Ese paso abrió el camino. Al final lo que toca es mirar si el acuerdo sirvió.',
                en:'That step opened the road. At the end what matters is seeing whether the agreement worked.' } ],
          note:{ es:'Revisar permite corregir sin empezar todo de nuevo.',
                 en:'Reviewing allows correcting without starting all over.' } }
      ] }
  ];
  var ch = pick(chains, rng);
  var steps = ch.steps.map(function(s){
    var opts = [ { t:s.ok, ok:true } ,
                 { t:s.bad[0], ok:false, w:s.w[0] },
                 { t:s.bad[1], ok:false, w:s.w[1] } ];
    return { opts:shuffle(opts, rng), note:s.note, ok:s.ok };
  });
  RT = { start:ch.start, steps:steps, i:0, tries:0, state:'play', flash:null, miss:-1 };

      '<div class="wgt-h">' + S('Ruta de la norma','Road of the rule') + '</div>' +
      '<div class="wgt-q">' + S('Encadena los pasos en el orden que hace que el acuerdo funcione.',

}
function rtRender(){
  if (!RT) return;
  var box = document.getElementById('rtBox');
  if (!box) return;
  var row = '<span class="link start">' + RT.start[LANG] + '</span>';
  for (var k = 0; k < RT.i; k++) {
    row += '<span class="arw">→</span><span class="link">' + RT.steps[k].ok[LANG] + '</span>';
  }
  if (RT.i < RT.steps.length) row += '<span class="arw">→</span><span class="link ghost">' + S('¿qué sigue?','what comes next?') + '</span>';
  var body = '';
  if (RT.i < RT.steps.length) {
    body = '<div class="opts2">' + RT.steps[RT.i].opts.map(function(o, k){
      var cls = 'opt2';
      if (RT.miss === k) cls += ' miss';
      return '<div class="' + cls + '" onclick="rtTap(' + k + ')">' + o.t[LANG] + '</div>';
    }).join('') + '</div>';
  }
  var msg, cl = '';
  if (RT.state === 'done') { msg = S('Ruta completa. Del derecho afectado a la revisión, cada paso sostiene al siguiente.',
                                     'Road complete. From the affected right to the review, each step holds up the next one.'); cl = ' ok'; }
  else if (RT.flash) { msg = RT.flash; cl = ' warn'; }
  else if (RT.i === 0) { msg = S('El camino empieza con el problema detectado. Elige el paso que va inmediatamente después.',
                                 'The road starts with the detected problem. Choose the step that comes immediately after.'); }
  else { msg = RT.steps[RT.i - 1].note[LANG]; }
  var btns = '';
  if (RT.i > 0 && RT.state === 'play') btns += '<button class="wbtn" onclick="rtUndo()">' + S('Quitar el último paso','Remove the last step') + '</button>';
  if (RT.state === 'done') btns += '<button class="wbtn" onclick="rtReset()">' + S('Armar la ruta otra vez','Build the road again') + '</button>';
  box.innerHTML =
    '<div class="chainrow">' + row + '</div>' + body +
    '<div class="wmsg' + cl + '">' + msg + '</div>' +
    '<div class="wrow">' + btns + '</div>' +
    '<div class="wprog">' + S('Paso ','Step ') + Math.min(RT.i + 1, RT.steps.length) + ' / ' + RT.steps.length + '</div>';
}
function rtTap(k){
  if (!RT || RT.state !== 'play' || RT.i >= RT.steps.length) return;
  var o = RT.steps[RT.i].opts[k];
  RT.miss = -1;
  if (o.ok) {
    RT.i++; RT.tries = 0; RT.flash = null;
    if (RT.i >= RT.steps.length) RT.state = 'done';
    rtRender(); return;
  }
  RT.tries++;
  if (RT.tries >= 3) {
    RT.flash = S('Este era el paso que seguía. ','This was the step that came next. ') + RT.steps[RT.i].note[LANG];
    RT.i++; RT.tries = 0;
    if (RT.i >= RT.steps.length) RT.state = 'done';
    rtRender(); return;
  }
  RT.miss = k; RT.flash = o.w[LANG];
  rtRender();
  setTimeout(function(){ if (RT && RT.miss === k) { RT.miss = -1; rtRender(); } }, 1500);
}
function rtUndo(){
  if (!RT || RT.state !== 'play' || RT.i === 0) return;
  RT.i--; RT.flash = null; RT.miss = -1; RT.tries = 0;
  rtRender();
}
function rtReset(){
  if (!RT) return;
  RT.i = 0; RT.tries = 0; RT.state = 'play'; RT.flash = null; RT.miss = -1;
  rtRender();
}

    '<p>' + S('Hay reglas que existen, están pegadas en la pared y aun así hacen daño. Unas reparten un espacio dejando fuera a la mayoría. Otras están escritas de manera tan vaga que cada quien las aplica a su modo. Otras piden algo que una parte del grupo no está en condiciones de lograr.',

    '<p>' + S('Dos escuelas pueden tener una norma sobre lo mismo y obtener resultados opuestos. Casi siempre la diferencia no está en la redacción, sino en quiénes participaron antes de escribirla. Quien vive el problema todos los días conoce detalles que nadie más puede aportar.',
