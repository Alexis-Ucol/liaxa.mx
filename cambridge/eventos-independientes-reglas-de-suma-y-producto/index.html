           e:'Cada lanzamiento de una moneda equilibrada es independiente de los demás, así que el quinto reparte la certeza en dos partes iguales sin importar lo que salió antes. La idea de que los resultados se compensan a corto plazo es justamente el error que hay que evitar.' },
      en:{ t:'The run of the coin',
           q:'A fair coin came up tails four times in a row. A player claims that on the fifth toss heads already has a better chance of coming up. What should be answered?',
           o:['That the fifth toss shares itself in halves again, because it keeps no memory of the earlier ones','That heads is more likely, because the results of a series tend to even out among themselves','That tails is more likely, because the coin already showed that tendency four times in a row','That it cannot be known, because after four tosses the coin lost its balance'],
           a:'That the fifth toss shares itself in halves again, because it keeps no memory of the earlier ones',
           h:'Ask yourself what information the coin holds about the earlier tosses at the moment it spins in the air.',
           e:'Every toss of a fair coin is independent of the others, so the fifth one shares the certainty into two equal parts no matter what came up before. The idea that results compensate one another in the short run is exactly the mistake to avoid.' } }
  ];
  var p1 = P1V[Math.floor(rng()*P1V.length)][LANG];
  addProblem(rng, { title:p1.t, q:p1.q, hint:p1.h, exp:p1.e, options:p1.o, correct:p1.a, showWork:false });

  /* ── CONCEPTO 2 ──────────────────────────────────────────────── */
  addSection(C + '2',
    es ? 'Por qué las probabilidades se multiplican' : 'Why probabilities multiply',
    (es
    ? '<p>Cuando un experimento tiene dos etapas, cada resultado completo es una pareja: lo que salió en la primera junto con lo que salió en la segunda. Si la primera etapa tiene 6 resultados y la segunda 4, la lista completa tiene 24 parejas, y cuando esas parejas son igual de posibles entre sí, contar sobre esa lista resuelve cualquier pregunta.</p>'
    + '<p>Los resultados que hacen ocurrir los dos eventos forman un rectángulo dentro de esa lista: tantas filas como resultados cumplen el primer evento y tantas columnas como cumplen el segundo. El número de casillas del rectángulo es el producto de esas dos cantidades, y de ahí sale la regla del producto. Ese rectángulo solo describe bien la situación cuando la segunda etapa no cambió por lo que hizo la primera; si hubo cambio, hay que actualizar la segunda etapa antes de combinarla con la primera.</p>'
    : '<p>When an experiment has two stages, every complete result is a pair: what came up in the first one together with what came up in the second. If the first stage has 6 results and the second one 4, the complete list has 24 pairs, and when those pairs are equally likely among themselves, counting on that list settles any question.</p>'
    + '<p>The results that make both events happen form a rectangle inside that list: as many rows as results satisfy the first event and as many columns as satisfy the second. The number of cells in the rectangle is the product of those two amounts, and that is where the multiplication rule comes from. That rectangle only describes the situation properly when the second stage did not change because of what the first one did; if there was a change, the second stage has to be updated before combining it with the first.</p>')
    + '<div class="rules-grid">'
    + '<div class="rcard"><div class="rname">'+(es?'Regla del producto':'Multiplication rule')+'</div><div class="rform">P(A y B) = P(A) · P(B)</div><div class="rnote">'+(es?'Solo para eventos independientes entre sí.':'Only for events that are independent of each other.')+'</div></div>'
    + '<div class="rcard"><div class="rname">'+(es?'Lista completa':'Complete list')+'</div><div class="rform">'+(es?'filas × columnas':'rows × columns')+'</div><div class="rnote">'+(es?'Todas las parejas que el experimento puede dar.':'Every pair the experiment can give.')+'</div></div>'
    + '<div class="rcard"><div class="rname">'+(es?'Rama del árbol':'Tree branch')+'</div><div class="rform">'+(es?'se multiplica hacia abajo':'multiplies downwards')+'</div><div class="rnote">'+(es?'Una rama pesa menos que cualquiera de sus tramos.':'A branch weighs less than any of its stretches.')+'</div></div>'
    + '<div class="rcard"><div class="rname">'+(es?'Sin devolución':'Without replacement')+'</div><div class="rform">'+(es?'el segundo factor cambia':'the second factor changes')+'</div><div class="rnote">'+(es?'Hay que actualizar la segunda etapa antes de combinar.':'The second stage has to be updated before combining.')+'</div></div>'
    + '</div>');

  buildRejilla(rng);

  /* ── PROBLEMA 2 ── producto de dos etapas independientes ── */
  var P2P = [ {n:6,g:2,m:5,w:3}, {n:8,g:3,m:4,w:1}, {n:5,g:2,m:6,w:2}, {n:10,g:4,m:4,w:1} ];
  var p2n = P2P[Math.floor(rng()*P2P.length)];
  var p2D = p2n.n * p2n.m;
  var p2o = [
    frac(p2n.g*p2n.w, p2D),
    frac((p2n.n-p2n.g)*(p2n.m-p2n.w), p2D),
    frac(p2n.g*p2n.m + p2n.w*p2n.n, p2D),
    frac(p2n.g+p2n.w, p2n.n+p2n.m)
  ];
  var p2v = (rng() < 0.5) ? 'ambos' : 'ninguno';
  addProblem(rng, {
    title: es ? 'La rueda y la bolsa' : 'The wheel and the bag',
    q: (es
      ? 'En un puesto de feria se gira una rueda de '+p2n.n+' sectores iguales, de los cuales '+p2n.g+' son dorados, y en seguida se saca sin mirar una canica de una bolsa con '+p2n.m+' canicas, de las cuales '+p2n.w+' son blancas. ¿Cuál es la probabilidad de que '+(p2v === 'ambos' ? 'la rueda caiga en dorado y además la canica salga blanca' : 'la rueda no caiga en dorado y además la canica no salga blanca')+'?'
      : 'At a fairground stall a wheel of '+p2n.n+' equal sectors is spun, '+p2n.g+' of which are golden, and right after that a marble is drawn without looking from a bag with '+p2n.m+' marbles, '+p2n.w+' of which are white. What is the probability that '+(p2v === 'ambos' ? 'the wheel lands on gold and the marble also comes out white' : 'the wheel does not land on gold and the marble does not come out white either')+'?'),
    hint: es
      ? 'Lo que hace la rueda no cambia nada dentro de la bolsa, así que puedes escribir por separado la probabilidad de cada etapa y después recorrer con ellas una sola rama del árbol.'
      : 'What the wheel does changes nothing inside the bag, so you can write the probability of each stage separately and then walk a single branch of the tree with them.',
    exp: (es
      ? 'Las dos etapas son independientes porque la rueda y la bolsa no se afectan. '+(p2v === 'ambos'
          ? 'La rueda cae en dorado con probabilidad '+frac(p2n.g,p2n.n)+' y la canica sale blanca con probabilidad '+frac(p2n.w,p2n.m)+', de modo que la rama que necesita las dos cosas vale '+fracRaw(p2n.g*p2n.w,p2D)+', es decir '+frac(p2n.g*p2n.w,p2D)+'.'
          : 'La rueda evita el dorado con probabilidad '+frac(p2n.n-p2n.g,p2n.n)+' y la canica no es blanca con probabilidad '+frac(p2n.m-p2n.w,p2n.m)+', de modo que la rama que necesita las dos cosas vale '+fracRaw((p2n.n-p2n.g)*(p2n.m-p2n.w),p2D)+', es decir '+frac((p2n.n-p2n.g)*(p2n.m-p2n.w),p2D)+'.')
      : 'The two stages are independent because the wheel and the bag do not affect each other. '+(p2v === 'ambos'
          ? 'The wheel lands on gold with probability '+frac(p2n.g,p2n.n)+' and the marble comes out white with probability '+frac(p2n.w,p2n.m)+', so the branch that needs both things is worth '+fracRaw(p2n.g*p2n.w,p2D)+', that is '+frac(p2n.g*p2n.w,p2D)+'.'
          : 'The wheel avoids the gold with probability '+frac(p2n.n-p2n.g,p2n.n)+' and the marble is not white with probability '+frac(p2n.m-p2n.w,p2n.m)+', so the branch that needs both things is worth '+fracRaw((p2n.n-p2n.g)*(p2n.m-p2n.w),p2D)+', that is '+frac((p2n.n-p2n.g)*(p2n.m-p2n.w),p2D)+'.')),
    options: p2o, correct: (p2v === 'ambos' ? p2o[0] : p2o[1]), showWork: true

  /* ── PROBLEMA 3 ── la independencia se pierde (sin devolución) ── */
  var P3P = [ {n:6,r:4}, {n:8,r:5}, {n:5,r:3}, {n:10,r:6} ];
  var p3n = P3P[Math.floor(rng()*P3P.length)];
  var p3D = p3n.n * (p3n.n - 1);
  var p3o = [
    frac(p3n.r*(p3n.r-1), p3D),
    frac(p3n.r*p3n.r, p3n.n*p3n.n),

    frac(p3n.r*(p3n.r-1), p3n.n*p3n.n)
  ];
  var p3v = (rng() < 0.5) ? 'dos' : 'ninguna';
  addProblem(rng, {

    q: (es

      : 'A bag holds '+p3n.n+' marbles, '+p3n.r+' of which are red. One marble is drawn, left outside the bag and right after that a second marble is drawn. What is the probability that '+(p3v === 'dos' ? 'both marbles drawn are red' : 'neither of the two marbles drawn is red')+'?'),
    hint: es

      : 'First write down how many marbles there are inside the bag before each draw. Since the first marble did not go back, the second stage starts from a different content and has to be updated before combining the two.',
    exp: (es
      ? 'Las dos extracciones no son independientes: al quedarse fuera la primera canica, la segunda se hace entre '+(p3n.n-1)+' canicas. '+(p3v === 'dos'
          ? 'La primera sale roja con probabilidad '+frac(p3n.r,p3n.n)+' y, hecho eso, la segunda sale roja con probabilidad '+frac(p3n.r-1,p3n.n-1)+', de modo que la rama completa vale '+fracRaw(p3n.r*(p3n.r-1),p3D)+', es decir '+frac(p3n.r*(p3n.r-1),p3D)+'.'
          : 'La primera evita el rojo con probabilidad '+frac(p3n.n-p3n.r,p3n.n)+' y, hecho eso, la segunda lo evita con probabilidad '+frac(p3n.n-p3n.r-1,p3n.n-1)+', de modo que la rama completa vale '+fracRaw((p3n.n-p3n.r)*(p3n.n-p3n.r-1),p3D)+', es decir '+frac((p3n.n-p3n.r)*(p3n.n-p3n.r-1),p3D)+'.')
      : 'The two draws are not independent: with the first marble left outside, the second one is made among '+(p3n.n-1)+' marbles. '+(p3v === 'dos'
          ? 'The first comes out red with probability '+frac(p3n.r,p3n.n)+' and, once that is done, the second comes out red with probability '+frac(p3n.r-1,p3n.n-1)+', so the complete branch is worth '+fracRaw(p3n.r*(p3n.r-1),p3D)+', that is '+frac(p3n.r*(p3n.r-1),p3D)+'.'
          : 'The first avoids red with probability '+frac(p3n.n-p3n.r,p3n.n)+' and, once that is done, the second avoids it with probability '+frac(p3n.n-p3n.r-1,p3n.n-1)+', so the complete branch is worth '+fracRaw((p3n.n-p3n.r)*(p3n.n-p3n.r-1),p3D)+', that is '+frac((p3n.n-p3n.r)*(p3n.n-p3n.r-1),p3D)+'.')),
    options: p3o, correct: (p3v === 'dos' ? p3o[0] : p3o[2]), showWork: true

  /* ── CONCEPTO 3 ──────────────────────────────────────────────── */
  addSection(C + '3',
    es ? 'Sumar hacia los lados, multiplicar hacia abajo' : 'Add sideways, multiply downwards',
    (es
    ? '<p>En este tema conviven dos reglas y cada una responde a una pregunta distinta. Cuando la pregunta usa la palabra o sobre dos eventos que no pueden ocurrir juntos, los casos favorables de uno y del otro se apilan sin repetirse y las probabilidades se suman. Cuando la pregunta usa la palabra y sobre dos etapas independientes, se recorre una rama completa del árbol y las probabilidades se multiplican.</p>'
    + '<p>Muchos problemas piden las dos cosas en el mismo cálculo. Para saber qué tan probable es acertar exactamente una vez en dos intentos hay que recorrer dos ramas distintas del árbol, porque acertar solo en el primer intento y acertar solo en el segundo son casos diferentes. Cada rama se obtiene multiplicando sus tramos, y como esas dos ramas no pueden ocurrir a la vez, al final se suman entre ellas. Un árbol dibujado a mano deja ver de inmediato cuál de las dos reglas toca en cada paso.</p>'
    : '<p>Two rules live side by side in this topic and each one answers a different question. When the question uses the word or about two events that cannot happen together, the favourable cases of one and of the other stack without repeating and the probabilities add. When the question uses the word and about two independent stages, a complete branch of the tree is walked and the probabilities multiply.</p>'
    + '<p>Many problems ask for both things in the same calculation. To know how likely it is to hit exactly once in two attempts you have to walk two different branches of the tree, because hitting only on the first attempt and hitting only on the second are different cases. Each branch comes from multiplying its stretches, and since those two branches cannot happen at once, in the end they add to one another. A tree drawn by hand shows at once which of the two rules belongs at each step.</p>')
    + '<div class="callout"><p><strong>'+(es?'Guía rápida:':'Quick guide:')+'</strong> '+(es
      ? 'los tramos de una misma rama se multiplican; las ramas distintas, que nunca ocurren juntas, se suman.'
      : 'the stretches of one same branch multiply; different branches, which never happen together, add.')+'</p></div>');

  buildArbol(rng);

  /* ── PROBLEMA 4 ── exactamente uno o los dos (suma de ramas) ── */
  var P4P = [ {a:2,b:3,c:1,d:4}, {a:3,b:5,c:1,d:2}, {a:1,b:2,c:2,d:5}, {a:3,b:4,c:1,d:3} ];
  var p4n = P4P[Math.floor(rng()*P4P.length)];
  var p4D = p4n.b * p4n.d;
  var p4both = p4n.a * p4n.c;
  var p4none = (p4n.b-p4n.a) * (p4n.d-p4n.c);
  var p4one  = p4n.a*(p4n.d-p4n.c) + (p4n.b-p4n.a)*p4n.c;
  var p4o = [ frac(p4one,p4D), frac(p4both,p4D), frac(p4none,p4D), frac(p4D-p4none,p4D) ];
  var p4v = (rng() < 0.5) ? 'uno' : 'dos';
  addProblem(rng, {
    title: es ? 'Dos tiros libres' : 'Two free throws',
    q: (es
      ? 'Ana encesta '+p4n.a+' de cada '+p4n.b+' tiros libres y Beto encesta '+p4n.c+' de cada '+p4n.d+', y el tiro de cada quien no influye en el del otro. Cada uno lanza un solo tiro libre. ¿Cuál es la probabilidad de que '+(p4v === 'uno' ? 'enceste exactamente uno de los dos' : 'encesten los dos')+'?'
      : 'Ana sinks '+p4n.a+' out of every '+p4n.b+' free throws and Beto sinks '+p4n.c+' out of every '+p4n.d+', and the throw of each one does not influence the other. Each of them takes a single free throw. What is the probability that '+(p4v === 'uno' ? 'exactly one of the two sinks it' : 'both of them sink it')+'?'),
    hint: es
      ? 'Dibuja las cuatro ramas posibles del árbol y calcula cada una con los tramos que la forman. Después decide cuáles de esas ramas cumplen lo que pide la pregunta y qué hacer con ellas.'
      : 'Draw the four possible branches of the tree and work out each one from the stretches that form it. Then decide which of those branches satisfy what the question asks and what to do with them.',
    exp: (es
      ? 'El árbol tiene cuatro ramas y cada una se obtiene multiplicando sus dos tramos, sobre un total de '+p4D+' casos. '+(p4v === 'uno'
          ? 'Encestar exactamente uno ocurre en dos ramas distintas: que enceste Ana y falle Beto, que vale '+fracRaw(p4n.a*(p4n.d-p4n.c),p4D)+', y que falle Ana y enceste Beto, que vale '+fracRaw((p4n.b-p4n.a)*p4n.c,p4D)+'. Esas dos ramas no pueden ocurrir juntas, así que se suman y dan '+frac(p4one,p4D)+'.'
          : 'Que encesten los dos es una sola rama, la que necesita el acierto de Ana junto con el de Beto, y vale '+fracRaw(p4both,p4D)+', es decir '+frac(p4both,p4D)+'.')
      : 'The tree has four branches and each one comes from multiplying its two stretches, out of a whole of '+p4D+' cases. '+(p4v === 'uno'
          ? 'Sinking exactly one happens on two different branches: Ana sinks it and Beto misses, which is worth '+fracRaw(p4n.a*(p4n.d-p4n.c),p4D)+', and Ana misses and Beto sinks it, which is worth '+fracRaw((p4n.b-p4n.a)*p4n.c,p4D)+'. Those two branches cannot happen together, so they add and give '+frac(p4one,p4D)+'.'
          : 'Both of them sinking it is a single branch, the one that needs the hit of Ana together with the hit of Beto, and it is worth '+fracRaw(p4both,p4D)+', that is '+frac(p4both,p4D)+'.')),
    options: p4o, correct: (p4v === 'uno' ? p4o[0] : p4o[1]), showWork: true
  });

  /* ── PROBLEMA 5 ── elegir la regla correcta (conceptual) ── */
  var P5V = [
    { es:{ t:'La cuenta que salió de más',
           q:'En un juego se gira una rueda y se lanza un dado. Un alumno calcula la probabilidad de que la rueda caiga en rojo y el dado muestre seis apilando las dos probabilidades. ¿Qué conviene responderle?',
           o:['Que apilar casos favorables sirve cuando los eventos no pueden ocurrir juntos, y aquí se pide que ocurran los dos','Que su cuenta está bien, pero le falta quitar una vez la probabilidad de que ocurran los dos','Que su cuenta está bien, porque la rueda y el dado son independientes entre sí','Que apilar casos favorables solo funciona cuando los dos objetos tienen el mismo número de resultados'],
           a:'Que apilar casos favorables sirve cuando los eventos no pueden ocurrir juntos, y aquí se pide que ocurran los dos',
           h:'Fíjate en la palabra que une los dos eventos en la pregunta y en si el resultado buscado es una rama del árbol o dos montones separados.',
           e:'Apilar casos favorables responde preguntas del tipo uno u otro entre eventos que se estorban. Aquí se pide una sola rama, la que recorre las dos etapas, y una rama se obtiene combinando sus tramos, no apilando montones. La señal de que algo falló es que su resultado sale mayor que cada probabilidad por separado, cuando una rama siempre pesa menos.' },
      en:{ t:'The count that came out too big',
           q:'In a game a wheel is spun and a die is rolled. A student works out the probability that the wheel lands on red and the die shows a six by stacking the two probabilities. What should be answered?',
           o:['That stacking favourable cases works when the events cannot happen together, and here both are asked to happen','That the count is right, but the probability of both happening has to be taken off once','That the count is right, because the wheel and the die are independent of each other','That stacking favourable cases only works when both objects have the same number of results'],
           a:'That stacking favourable cases works when the events cannot happen together, and here both are asked to happen',
           h:'Look at the word that joins the two events in the question and at whether the result wanted is one branch of the tree or two separate piles.',
           e:'Stacking favourable cases answers questions of the kind one or the other between events that get in each other way. Here a single branch is asked for, the one that walks both stages, and a branch comes from combining its stretches, not from stacking piles. The sign that something went wrong is that the result comes out larger than each probability on its own, when a branch always weighs less.' } },
    { es:{ t:'El resultado imposible',
           q:'Una arquera acierta 2 de cada 3 tiros y cada tiro es independiente del anterior. Para dos tiros afirma que la probabilidad de acertar al menos una vez se obtiene apilando las dos probabilidades, y le queda un número mayor que la unidad. ¿Qué muestra ese resultado?',
           o:['Que el procedimiento está mal, porque el caso de acertar los dos tiros quedó contado dos veces','Que el resultado es correcto, porque con dos tiros hay el doble de oportunidades de acertar','Que el procedimiento está bien, pero al final hay que repartir el resultado entre el número de tiros','Que el error está en el dato, porque acertar 2 de cada 3 tiros no describe una probabilidad válida'],
           a:'Que el procedimiento está mal, porque el caso de acertar los dos tiros quedó contado dos veces',
           h:'Recuerda que ninguna probabilidad puede pasar de la certeza. Después busca cuál caso aparece en los dos montones que la arquera juntó.',
           e:'Acertar en el primer tiro y acertar en el segundo son eventos que sí pueden ocurrir juntos, de modo que al apilar sus casos favorables el caso de acertar los dos tiros se contó dos veces. Por eso el número se pasa de la unidad, algo que ninguna probabilidad puede hacer. El camino corto es pasar por el evento contrario, fallar los dos tiros.' },
      en:{ t:'The impossible result',
           q:'An archer hits 2 out of every 3 shots and each shot is independent of the previous one. For two shots she claims that the probability of hitting at least once comes from stacking the two probabilities, and she gets a number larger than the unit. What does that result show?',
           o:['That the procedure is wrong, because the case of hitting both shots ended up counted twice','That the result is right, because with two shots there are twice as many chances of hitting','That the procedure is right, but at the end the result has to be shared out among the number of shots','That the mistake is in the data, because hitting 2 out of every 3 shots does not describe a valid probability'],
           a:'That the procedure is wrong, because the case of hitting both shots ended up counted twice',
           h:'Remember that no probability can go past certainty. Then look for the case that appears in both of the piles the archer put together.',

    { es:{ t:'La pregunta que pide una sola rama',
           q:'De las siguientes preguntas sobre un mismo juego, ¿en cuál hay que combinar dos etapas independientes en una sola rama?',
           o:['La probabilidad de que la moneda muestre águila y además el dado muestre un número par','La probabilidad de que el dado muestre un número menor que tres o un número mayor que cuatro','La probabilidad de que el dado no muestre seis en un solo lanzamiento','La probabilidad de que la moneda muestre águila o bien muestre sol en un solo lanzamiento'],
           a:'La probabilidad de que la moneda muestre águila y además el dado muestre un número par',
           h:'Busca la pregunta en la que hacen falta dos objetos distintos y las dos condiciones deben cumplirse al mismo tiempo.',
           e:'Solo la primera pregunta exige que ocurran dos cosas a la vez en dos objetos que no se afectan entre sí, y eso corresponde a recorrer una rama completa del árbol. Las otras tres se resuelven dentro de un solo lanzamiento: dos de ellas apilando casos favorables que no se estorban y una pasando al evento contrario.' },
      en:{ t:'The question that asks for a single branch',
           q:'Of the following questions about one same game, in which one do two independent stages have to be combined into a single branch?',
           o:['The probability that the coin shows heads and the die also shows an even number','The probability that the die shows a number lower than three or a number greater than four','The probability that the die does not show a six on a single roll','The probability that the coin shows heads or else shows tails on a single toss'],

  /* ── CONCEPTO 4 ──────────────────────────────────────────────── */
  addSection(C + '4',
    es ? 'Al menos una vez' : 'At least once',
    (es
    ? '<p>Cuando una pregunta dice al menos una vez, la lista de casos favorables se alarga enseguida: en tres intentos habría que revisar acertar una vez, acertar dos y acertar las tres. El evento contrario, en cambio, es uno solo y muy fácil de describir: fallar en todos los intentos. Como los intentos son independientes, ese caso único se obtiene recorriendo una sola rama del árbol, y lo que falta para completar la certeza es la respuesta buscada.</p>'
    + '<p>Este camino explica algo que se nota en cualquier juego de feria: repetir intentos independientes hace crecer la probabilidad de que el resultado buscado aparezca alguna vez, porque fallar siempre se vuelve más raro con cada repetición. Nunca se llega a la certeza total, pero uno se acerca tanto como quiera si hay suficientes intentos. Y cuidado con el atajo falso: repetir un intento no hace que las probabilidades se apilen, porque los intentos sí pueden acertar los dos a la vez.</p>'
    : '<p>When a question says at least once, the list of favourable cases gets long right away: in three attempts you would have to go through hitting once, hitting twice and hitting all three times. The opposite event, on the other hand, is a single one and very easy to describe: missing on every attempt. Since the attempts are independent, that single case comes from walking one branch of the tree, and what is missing to complete certainty is the answer wanted.</p>'
    + '<p>This road explains something visible in any fairground game: repeating independent attempts makes the probability that the wanted result shows up at some point grow, because missing every time gets rarer with each repetition. Full certainty is never reached, but you get as close to it as you like if there are enough attempts. And beware of the false shortcut: repeating an attempt does not make the probabilities stack, because the attempts can indeed both hit at once.</p>')
    + '<div class="callout"><p><strong>'+(es?'El atajo:':'The shortcut:')+'</strong> '+(es
      ? 'al menos una vez es lo contrario de ninguna vez, y ninguna vez es una sola rama del árbol.'
      : 'at least once is the opposite of never, and never is a single branch of the tree.')+'</p></div>');

  buildRepite(rng);

      : 'At a fairground stall, each attempt knocks the can down '+p6n.pn+' out of every '+p6n.pd+' times, and the attempts do not influence one another. A player pays for '+p6n.k+' attempts. What is the probability that the can is knocked down '+(p6v === 'almenos' ? 'at least once' : 'on none of the attempts')+'?'),
    hint: es
      ? 'Listar todos los casos en los que la lata cae alguna vez es largo. Trabaja con el caso único en el que la lata nunca cae, que se obtiene recorriendo una sola rama, y recuerda que ese caso y el pedido completan la certeza.'
      : 'Listing every case in which the can falls at some point is long. Work with the single case in which the can never falls, which comes from walking one branch, and remember that this case and the one asked for complete certainty.',
    exp: (es

    title: es ? 'Tres extracciones seguidas' : 'Three draws in a row',

      : 'Putting the marble back keeps the bag the same, so the 3 draws are independent and each one '+(p7v === 'tres' ? 'gives red with probability '+frac(p7n.r,p7n.n) : 'avoids red with probability '+frac(p7n.n-p7n.r,p7n.n))+'. The branch that repeats that result on all 3 draws is worth '+(p7v === 'tres' ? fracRaw(ipow(p7n.r,3), ipow(p7n.n,3))+', that is '+frac(ipow(p7n.r,3), ipow(p7n.n,3)) : fracRaw(ipow(p7n.n-p7n.r,3), ipow(p7n.n,3))+', that is '+frac(ipow(p7n.n-p7n.r,3), ipow(p7n.n,3)))+'. Each extra draw makes the branch narrower.'),

  });

  /* ── CONCEPTO 5 ──────────────────────────────────────────────── */
  addSection(C + '5',
    es ? 'Juegos justos de dos etapas' : 'Fair games with two stages',
    (es
    ? '<p>Un juego de azar es justo cuando cada participante gana con exactamente la misma probabilidad. En un juego de una sola etapa basta contar cuántos resultados equiprobables favorecen a cada quien y comparar esas dos cantidades. En un juego de dos etapas hay que mirar el árbol completo, porque quien gana solo si ocurren las dos cosas se queda con una sola rama, y una rama siempre pesa menos que cualquiera de sus tramos.</p>'
    + '<p>Por eso un juego de dos etapas puede parecer generoso sin serlo. Una rueda que cae en dorado tres de cada cuatro veces suena muy favorable, pero si además hace falta que una moneda muestre águila, la parte que gana se reduce a la mitad y queda por debajo del reparto parejo. Para equilibrar un juego así hay que ajustar las etapas hasta que la rama ganadora abarque exactamente la mitad de todas las parejas de resultados posibles.</p>'
    : '<p>A game of chance is fair when each participant wins with exactly the same probability. In a single stage game it is enough to count how many equally likely results favour each person and to compare those two amounts. In a two stage game you have to look at the complete tree, because whoever wins only if both things happen keeps a single branch, and a branch always weighs less than any of its stretches.</p>'
    + '<p>That is why a two stage game can look generous without being so. A wheel that lands on gold three out of every four times sounds very favourable, but if a coin also has to show heads, the winning part is cut in half and falls below an even share. To balance a game like that the stages have to be tuned until the winning branch covers exactly half of all the possible pairs of results.</p>')
    + '<div class="callout"><p><strong>'+(es?'Antes de aceptar el juego:':'Before accepting the game:')+'</strong> '+(es
      ? 'cuenta cuántas parejas de resultados te dan la victoria y compáralas con las que se lleva el otro jugador.'
      : 'count how many pairs of results give you the win and compare them with the ones the other player takes.')+'</p></div>');

  buildJusto(rng);

      : 'In a fairground game two wheels of equal sectors are spun. The first one has '+p8n.n1+' sectors, '+p8n.g1+' of which are golden. The second one has '+p8n.n2+' sectors and how many of them will be golden is not decided yet. Ana wins if both wheels land on a golden sector and Beto wins in any other case. How many golden sectors must the second wheel have so that both players win with the same probability?'),

      : 'Think of the complete list of pairs the two wheels form and of how many of those pairs Ana needs in order to be even with Beto. The winning branch has to cover half of that list.',
    exp: (es

           o:['Que Beto tiene ventaja, porque la rama que necesita Ana abarca menos de la mitad de las parejas posibles','Que el juego es justo, porque la moneda divide la certeza en dos partes iguales para los dos jugadores','Que Ana tiene ventaja, porque su rama empieza quedándose con la mayor parte de los sectores de la rueda','Que no se puede decidir, porque la rueda y la moneda tienen distinto número de resultados posibles'],

<script>
(function(){

  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;

    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
