<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Tabla Periódica: Elementos, Grupos y Periodos</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">La Tabla Periódica: Elementos, Grupos y Periodos</div>
    <div class="wcourse" id="wcourse-el">Química · 3° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">La Tabla Periódica: Elementos, Grupos y Periodos</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="sbtn" id="dlBtn" onclick="generatePDF()" style="max-width:280px;margin:0 auto;">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   CENTRALIZED SCHOOL CONFIG (Rule 16) — ships UNBRANDED (Rule 11).
   The ONLY rebranding point. build_all.py substitutes these exact fields
   (BRAND_FIELDS / RGB_FIELDS / logo*) downstream; :root/dark stay as fallback.
   Neutral defaults below == the static :root/dark values, so unbranded == no-op.
   ══════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:'#1a4a8a', primaryDark:'#0c2547', primaryBg:'#e7edf6',
  accent:'#e07b1a', accentBg:'#fbeddf',
  darkPrimary:'#437bc6', darkPrimaryDark:'#74a5e6', darkPrimaryBg:'#0c203a',

    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
  saved.choices.forEach(function(choice, idx) {

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);

  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');

}

  doc.setTextColor(20,24,32); doc.setFontSize(11); doc.setFont('helvetica','bold');
  doc.text(name, M+4, 87); doc.text(group, 130, 87);

  // ── Score box ──
  var sc = pct>=70?[26,106,74]:pct>=50?[224,123,26]:[176,48,16];
  doc.setFillColor(255,255,255); doc.roundedRect(M,100,TW,34,4,4,'F');
  doc.setDrawColor(sc[0],sc[1],sc[2]); doc.setLineWidth(0.8);
  doc.roundedRect(M,100,TW,34,4,4,'S');
  doc.setTextColor(sc[0],sc[1],sc[2]); doc.setFontSize(40); doc.setFont('helvetica','bold');
  doc.text(pct+'%', PW/2, 124, {align:'center'});
  doc.setTextColor(130,140,160); doc.setFontSize(8.5); doc.setFont('helvetica','normal');
  doc.text(correctCount+' correcta(s) de '+total+' preguntas', PW/2, 131, {align:'center'});

  // ── Problem summary table ──
  doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
  doc.setFontSize(7); doc.setFont('helvetica','bold');
  doc.rect(M,142,TW,8,'F'); doc.text('RESUMEN DE PROBLEMAS', M+4, 148);
  var sy = 154;
  problems.forEach(function(prob, i) {
    if (sy + 12 > PH - 15) {
      doc.addPage(); sy = 20;
      doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
      doc.setFontSize(7); doc.setFont('helvetica','bold');
      doc.rect(M,sy,TW,8,'F'); doc.text('RESUMEN DE PROBLEMAS (continuación)', M+4, sy+6);
      sy += 12;
    }
    var ok = document.getElementById('pc'+i).classList.contains('ok');
    doc.setFillColor(ok?232:255, ok?240:232, ok?232:228);
    doc.roundedRect(M,sy,TW,10,2,2,'F');
    doc.setFillColor(ok?26:176, ok?106:48, ok?74:16);
    doc.circle(M+6, sy+5, 2.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(7); doc.setFont('helvetica','bold');
    doc.text(ok?'✓':'✗', M+4.5, sy+6.5);
    doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('helvetica','normal');
    doc.text('Problema '+(i+1)+': '+pdfText(prob.title), M+12, sy+6.5);
    doc.setTextColor(ok?26:176, ok?106:48, ok?74:16);
    doc.text(ok?'Correcto':'Incorrecto', PW-M-24, sy+6.5);
    sy += 12;
  });

  // ── Per-problem pages ──
  for (var i = 0; i < problems.length; i++) {
    var prob = problems[i];
    doc.addPage();
    var wy = 0;

    doc.setFillColor(pBR,pBG,pBB); doc.rect(0,0,PW,20,'F');
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,3,'F');
    doc.setTextColor(pAR,pAG,pAB); doc.setFontSize(7); doc.setFont('helvetica','normal');
    doc.text(t('wcourse')+'  ·  '+t('wtitle'), M, 10);
    doc.setTextColor(232,238,247); doc.setFontSize(10.5); doc.setFont('helvetica','bold');
    doc.text('Problema '+(i+1)+' de '+total+'  ·  '+pdfText(prob.title), M, 17);
    wy = 25;

    var qRaw = pdfText(prob.questionText);
    doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var qLines = doc.splitTextToSize(qRaw, TW-10);
    var qBoxH  = 8 + qLines.length*5 + 3;
    doc.setFillColor(237,240,245); doc.roundedRect(M,wy,TW,qBoxH,2,2,'F');
    doc.setTextColor(pBR,pBG,pBB); doc.setFontSize(6.5); doc.setFont('helvetica','bold');
    doc.text('PREGUNTA', M+4, wy+6);
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var qy = wy+12;
    qLines.forEach(function(ln,li){ doc.text(ln, M+4, qy+li*5); });
    wy += qBoxH + 4;

    var isOk   = document.getElementById('pc'+i).classList.contains('ok');
    var chosen = prob.studentChoice != null ? pdfText(prob.options[prob.studentChoice]||'-') : '-';
    var corr   = pdfText(prob.options[prob.correctIdx]||'');
    var expRaw = pdfText(prob.explanation||'');
    doc.setFontSize(8.5); var chLines = doc.splitTextToSize('Alumno: '+chosen, TW-18);
    doc.setFontSize(8);   var coLines = doc.splitTextToSize('Correcto: '+corr, TW-18);
    doc.setFontSize(7.5); var exLines = doc.splitTextToSize('Solución: '+expRaw, TW-18).slice(0,4);
    var ansBoxH = 8 + chLines.length*5.5 + coLines.length*5 + exLines.length*5 + 6;
    doc.setFillColor(isOk?232:255, isOk?240:232, isOk?232:228);
    doc.roundedRect(M,wy,TW,ansBoxH,2,2,'F');
    doc.setFillColor(isOk?26:176, isOk?106:48, isOk?74:16);
    doc.circle(M+7, wy+8, 3.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(9); doc.setFont('helvetica','bold');
    doc.text(isOk?'✓':'✗', M+5.2, wy+10.5);
    var ay = wy+7;
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','bold');
    chLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5.5); });
    ay += chLines.length*5.5 + 3;
    doc.setTextColor(26,106,74); doc.setFontSize(8); doc.setFont('helvetica','normal');
    coLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    ay += coLines.length*5 + 3;
    doc.setTextColor(90,85,80); doc.setFontSize(7.5);
    exLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    wy += ansBoxH + 5;

    doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
    doc.setFontSize(7); doc.setFont('helvetica','bold');
    doc.rect(M,wy,TW,8,'F'); doc.text('TRABAJO DEL ALUMNO', M+4, wy+5.5);
    wy += 11;

    var dc = document.getElementById('dc'+i);
    if (dc) {
      try {
        var imgD = dc.toDataURL('image/png');
        var ar   = dc.height / dc.width;
        var iw   = TW;
        var ih   = Math.min(iw * ar, 68);
        doc.addImage(imgD, 'PNG', M, wy, iw, ih);
        wy += ih + 4;
      } catch(e) {}
    }

    var ta = document.getElementById('ta'+i);
    if (ta && ta.value.trim()) {
      if (wy > PH-30) { doc.addPage(); wy = 20; }
      doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('courier','normal');
      var taLines = doc.splitTextToSize(ta.value, TW);
      taLines.slice(0,16).forEach(function(ln) {
        if (wy > PH-15) { doc.addPage(); wy = 20; }
        doc.text(ln, M, wy); wy += 5;
      });
      wy += 2;
    }

    var pp = document.getElementById('pp'+i);
    if (pp && pp.src && pp.src.indexOf('data:') === 0) {
      if (wy > PH-55) { doc.addPage(); wy = 20; }
      try { doc.addImage(pp.src, 'JPEG', M, wy, TW, 68); wy += 72; } catch(e) {}
    }
  }

  // ── Footer on every page ──
  var pages = doc.internal.getNumberOfPages();
  for (var p = 1; p <= pages; p++) {
    doc.setPage(p);
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0, PH-3, PW, 3, 'F');
    doc.setTextColor(130,140,160); doc.setFontSize(6.5); doc.setFont('helvetica','normal');
    doc.text(name+'  ·  '+group+'  ·  Código: '+code+'  ·  Página '+p+'/'+pages,
      PW/2, PH-5, {align:'center'});
  }

  doc.save('qui3_t07_g01_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf');
  btn.innerHTML = '⬇ &nbsp;Descargar Resultados PDF';
  btn.disabled  = false;
}

function L(o){ return (o && o[LANG] !== undefined) ? o[LANG] : (o ? o.es : ''); }
function vpick(rng, list){ return list[Math.floor(rng() * list.length)]; }

function say(host, cls, msg){
  var e = host.querySelector('.gw-fb');
  if (!e) return;
  e.className = 'gw-fb' + (cls ? ' ' + cls : '');
  e.innerHTML = msg;
}

function rcard(name, form, note){
  return '<div class="rcard"><div class="rname">' + name + '</div><div class="rform">' + form + '</div><div class="rnote">' + note + '</div></div>';
}

function sec(tag, title, html){
  var d = document.createElement('div');
  d.className = 'section';
  d.innerHTML = '<div class="stag">' + tag + '</div><h2>' + title + '</h2>' + html;
  document.getElementById('lessonBody').appendChild(d);
  return d;
}

function widgetHost(parent, id, kind){
  var d = document.createElement('div');
  d.className = 'gw';
  d.id = id;
  d.setAttribute('data-widget', kind);
  parent.appendChild(d);
  return d;
}

function addProblem(rng, v){
  var idx = problems.length;
  var opts = L(v.opts).slice();
  var correctVal = opts[v.ci];
  var sh = shuffle(opts, rng);
  var prob = {
    title: L(v.title),
    questionText: L(v.q),
    fn: '',
    hint: L(v.hint),
    explanation: L(v.exp),
    options: sh,
    correctIdx: sh.indexOf(correctVal),
    showWork: !!v.showWork,
    studentChoice: null,
    pendingChoice: null
  };
  problems.push(prob);
  buildOneCard(prob, idx);
}

    '@media (max-width:600px){.gw{padding:.75rem;}.ptc{min-height:40px;font-size:.7rem;}.ptc small{font-size:.5rem;}.shlbl{width:82px;font-size:.68rem;}.shcnt{width:46px;}.trval{width:60px;font-size:.66rem;}.trmeta{display:none;}}'
  ].join('');
  document.head.appendChild(s);
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 1 :: explorador de la tabla periodica
   Cada casilla responde al toque con sus datos. Tres encargos de localizacion
   con pistas distintas y retroalimentacion direccional por filas y columnas.
   ══════════════════════════════════════════════════════════════════════════ */
function wTable(rng, host){
  var pool = ELS.filter(function(e){ return e.p >= 2; });
  var picks = shuffle(pool, rng).slice(0, 3);
  var clues = picks.map(function(e){
    var c = ['z', 'gp', 'val'];
    if (e.k === 'sm' && e.p <= 3) c.push('sm');
    if (e.g === 18) c.push('noble');
    return c[Math.floor(rng() * c.length)];
  });
  var round = 0, tries = 0, done = false, explore = false, shown = null, hit = null;

  function clueText(e, c){
    if (c === 'z') return L({ es:'Encuentra la casilla del elemento cuyo número atómico es ', en:'Find the box of the element whose atomic number is ' }) + e.z + '.';
    if (c === 'gp') return L({ es:'Encuentra la casilla del grupo ', en:'Find the box in group ' }) + e.g + L({ es:', periodo ', en:', period ' }) + e.p + '.';
    if (c === 'val') return L({ es:'Encuentra el elemento del periodo ', en:'Find the element of period ' }) + e.p + L({ es:' que tiene ', en:' that has ' }) + val(e) + L({ es:' electrones de valencia.', en:' valence electrons.' });
    if (c === 'sm') return L({ es:'Encuentra el único semimetal del periodo ', en:'Find the only metalloid of period ' }) + e.p + '.';
    return L({ es:'Encuentra el gas noble del periodo ', en:'Find the noble gas of period ' }) + e.p + '.';
  }

  host.innerHTML =
    '<div class="gw-h iw-tag">' + L({ es:'Explorador de la tabla', en:'Table explorer' }) + '</div>' +
    '<div class="gw-q" data-r="q"></div>' +
    '<div class="gw-mini iw-sub">' + L({
      es:'Toca cualquier casilla y aparecerán sus datos abajo. La franja de color de cada casilla dice a qué zona pertenece.',
      en:'Tap any box and its data appears below. The colour band of each box says which zone it belongs to.'
    }) + '</div>' +
    '<div class="ptleg">' +
      '<span><i class="me"></i>' + L({ es:'metales', en:'metals' }) + '</span>' +
      '<span><i class="sm"></i>' + L({ es:'semimetales', en:'metalloids' }) + '</span>' +
      '<span><i class="nm"></i>' + L({ es:'no metales', en:'nonmetals' }) + '</span>' +
    '</div>' +
    '<div class="pt" data-r="grid"></div>' +
    '<div class="gw-mini">' + L({
      es:'Entre el grupo 2 y el grupo 13 del periodo 4 va un bloque de metales de transición que este mapa deja fuera.',
      en:'Between group 2 and group 13 of period 4 there is a block of transition metals that this map leaves out.'
    }) + '</div>' +
    '<div class="gw-read" data-r="info"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="exp"></button></div>' +
    '<div class="gw-fb"></div>';

  var elQ = host.querySelector('[data-r="q"]'),
      elG = host.querySelector('[data-r="grid"]'),
      elI = host.querySelector('[data-r="info"]'),
      elE = host.querySelector('[data-r="exp"]');

  function info(e){
    return '<span class="gw-pill">' + e.s + ' · ' + L(e) + '</span>' +
      '<span class="gw-pill">Z: <b>' + e.z + '</b></span>' +
      '<span class="gw-pill">' + L({ es:'grupo', en:'group' }) + ': <b>' + e.g + '</b></span>' +
      '<span class="gw-pill">' + L({ es:'periodo', en:'period' }) + ': <b>' + e.p + '</b></span>' +
      '<span class="gw-pill">' + L({ es:'valencia', en:'valence' }) + ': <b>' + val(e) + '</b></span>' +
      '<span class="gw-pill">' + kindName(e.k) + '</span>';
  }

  function render(){
    var h = '', p, gc, e, cls;
    for (gc = 0; gc < GCOLS.length; gc++) h += '<div class="ptc hd">' + GCOLS[gc] + '</div>';
    for (p = 1; p <= 4; p++){
      for (gc = 0; gc < GCOLS.length; gc++){
        e = elAt(p, GCOLS[gc]);
        if (!e){ h += '<div class="ptc gap"></div>'; continue; }
        cls = 'ptc ' + (e.k === 'me' ? 'metal' : (e.k === 'sm' ? 'semi' : 'nometal'));
        if (shown === e.z) cls += ' sel';
        if (hit === e.z) cls += ' hit';
        if (done) cls += ' locked';
        h += '<div class="' + cls + '" data-z="' + e.z + '">' + e.s + '<small>' + e.z + '</small></div>';
      }
    }
    elG.innerHTML = h;
    elQ.innerHTML = done
      ? L({ es:'Mapa recorrido. Sigue tocando casillas para consultar cualquier elemento.', en:'Map covered. Keep tapping boxes to look up any element.' })
      : L({ es:'Encargo ', en:'Task ' }) + (round + 1) + L({ es:' de tres. ', en:' of three. ' }) + clueText(picks[round], clues[round]);
    elE.textContent = explore
      ? L({ es:'Volver al encargo', en:'Back to the task' })
      : L({ es:'Explorar sin encargo', en:'Explore with no task' });
    elE.className = 'gw-btn' + (explore ? ' on' : '');
    elG.querySelectorAll('.ptc[data-z]').forEach(function(c){
      c.addEventListener('click', function(){ tap(parseInt(c.getAttribute('data-z'), 10)); });
    });
  }

  function tap(z){
    var e = null, i;
    for (i = 0; i < ELS.length; i++) if (ELS[i].z === z) e = ELS[i];
    if (!e) return;
    shown = z;
    hit = null;
    elI.innerHTML = info(e);
    if (done || explore){ render(); elI.innerHTML = info(e);
      say(host, '', L({ es:'Consulta libre: compara la valencia de dos casillas de la misma columna y verás que se repite.', en:'Free lookup: compare the valence of two boxes in the same column and you will see it repeat.' }));
      return; }
    var tgt = picks[round];
    if (e.z === tgt.z){ solve(); return; }
    tries++;
    if (tries >= 3){ reveal(); return; }
    var dp = tgt.p - e.p, dg = GCOLS.indexOf(tgt.g) - GCOLS.indexOf(e.g);
    var m = L({ es:'Esa casilla es ', en:'That box is ' }) + e.s + ' (' + L(e) + '), ' +
      L({ es:'grupo ', en:'group ' }) + e.g + L({ es:', periodo ', en:', period ' }) + e.p + '. ' +
      (dp > 0 ? L({ es:'La que buscas está más abajo', en:'The one you want is further down' })
              : dp < 0 ? L({ es:'La que buscas está más arriba', en:'The one you want is further up' })
                       : L({ es:'Ya estás en el periodo correcto', en:'You are already in the right period' })) +
      (dg > 0 ? L({ es:' y más a la derecha.', en:' and further right.' })
              : dg < 0 ? L({ es:' y más a la izquierda.', en:' and further left.' })
                       : L({ es:' y en el grupo correcto.', en:' and in the right group.' }));
    render();
    elI.innerHTML = info(e);
    say(host, 'miss', m);
  }

  function solve(){
    var tgt = picks[round];
    hit = tgt.z;
    say(host, 'good', L({ es:'Correcto: ', en:'Correct: ' }) + tgt.s + ' (' + L(tgt) + '), ' +
      L({ es:'grupo ', en:'group ' }) + tgt.g + L({ es:', periodo ', en:', period ' }) + tgt.p + '. ' +
      L({ es:'La columna te da los electrones de valencia y la fila, el número de capas ocupadas.', en:'The column gives you the valence electrons and the row the number of occupied shells.' }));
    next();
  }

  function reveal(){
    var tgt = picks[round];
    hit = tgt.z;
    shown = tgt.z;
    say(host, 'warm', L({ es:'La casilla buscada era ', en:'The box being looked for was ' }) + tgt.s + ' (' + L(tgt) + '), ' +
      L({ es:'grupo ', en:'group ' }) + tgt.g + L({ es:', periodo ', en:', period ' }) + tgt.p + ', ' + kindName(tgt.k) + '. ' +
      L({ es:'Localizarla se reduce a cruzar una columna con una fila.', en:'Locating it comes down to crossing one column with one row.' }));
    elI.innerHTML = info(tgt);
    next();
  }

  function next(){
    round++;
    tries = 0;
    if (round >= picks.length){ done = true; round = picks.length - 1; }
    render();
    if (!done) elI.innerHTML = '';
  }

  elE.addEventListener('click', function(){
    explore = !explore;
    render();
    say(host, '', explore
      ? L({ es:'Modo consulta: toca las casillas que quieras sin que cuente como intento.', en:'Lookup mode: tap whichever boxes you like without it counting as an attempt.' })
      : L({ es:'De vuelta al encargo. Lee la pista y cruza columna con fila.', en:'Back to the task. Read the clue and cross column with row.' }));
  });

  render();
  say(host, '', L({ es:'Empieza por tocar cualquier casilla para ver qué información guarda.', en:'Start by tapping any box to see what information it holds.' }));
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 2 :: constructor de modelos de Bohr
   El alumno reparte electrones capa por capa y ve el atomo redibujarse.
   Tres atomos distintos, reveal a la tercera falla (Rule 8).
   ══════════════════════════════════════════════════════════════════════════ */
function wBohr(rng, host){
  var CAP = [2, 8, 8, 2];
  var RAD = [34, 58, 82, 106];
  var NAMES = ['K', 'L', 'M', 'N'];
  var pool = ELS.filter(function(e){ return e.sh && e.z >= 5; });
  var picks = shuffle(pool, rng).slice(0, 3);
  var round = 0, tries = 0, cur = [0, 0, 0, 0], locked = false, done = false;

  host.innerHTML =
    '<div class="gw-h iw-tag">' + L({ es:'Constructor de Bohr', en:'Bohr builder' }) + '</div>' +
    '<div class="gw-q" data-r="q"></div>' +
    '<div class="gw-mini iw-sub">' + L({
      es:'Suma y quita electrones en cada capa con los botones. El dibujo y las cuentas se actualizan al instante.',
      en:'Add and remove electrons in each shell with the buttons. The drawing and the counters update instantly.'
    }) + '</div>' +
    '<div class="bh" data-r="draw"></div>' +
    '<div class="gw-read" data-r="read"></div>' +
    '<div data-r="ctrl"></div>' +
    '<div class="gw-row">' +
      '<button class="gw-btn" data-r="chk">' + L({ es:'Comprobar', en:'Check' }) + '</button>' +
      '<button class="gw-btn" data-r="clr">' + L({ es:'Quitar todos', en:'Remove all' }) + '</button>' +
    '</div>' +
    '<div class="gw-fb"></div>';

  var elQ = host.querySelector('[data-r="q"]'),
      elD = host.querySelector('[data-r="draw"]'),
      elR = host.querySelector('[data-r="read"]'),
      elC = host.querySelector('[data-r="ctrl"]'),
      elK = host.querySelector('[data-r="chk"]'),
      elX = host.querySelector('[data-r="clr"]');

  function total(){ return cur[0] + cur[1] + cur[2] + cur[3]; }

  function draw(){
    var e = picks[round], h = '', i, j, n, ang, x, y;
    for (i = 0; i < 4; i++){
      h += '<div class="bhring" style="left:' + (120 - RAD[i]) + 'px;top:' + (120 - RAD[i]) + 'px;width:' + (2 * RAD[i]) + 'px;height:' + (2 * RAD[i]) + 'px"></div>';
    }
    h += '<div class="bhnuc"><span>' + e.z + ' p</span><span>' + (e.a - e.z) + ' n</span></div>';
    for (i = 0; i < 4; i++){
      n = cur[i];
      for (j = 0; j < n; j++){
        ang = (2 * Math.PI * j / Math.max(n, 1)) - Math.PI / 2;
        x = 120 + RAD[i] * Math.cos(ang) - 5.5;
        y = 120 + RAD[i] * Math.sin(ang) - 5.5;
        h += '<div class="bhe" style="left:' + x.toFixed(1) + 'px;top:' + y.toFixed(1) + 'px"></div>';
      }
    }
    elD.innerHTML = h;
  }

  function render(){
    var e = picks[round], i, h = '';
    elQ.innerHTML = done
      ? L({ es:'Tres átomos armados. Fíjate en cuántas capas ocupó cada uno y cuántos electrones le quedaron en la última.', en:'Three atoms built. Notice how many shells each one used and how many electrons were left in the last one.' })
      : L({ es:'Átomo ', en:'Atom ' }) + (round + 1) + L({ es:' de tres: arma el ', en:' of three: build ' }) + L(e) +
        L({ es:', de número atómico ', en:', of atomic number ' }) + e.z + L({ es:' y número de masa ', en:' and mass number ' }) + e.a + '.';
    elR.innerHTML =
      '<span class="gw-pill">' + L({ es:'protones', en:'protons' }) + ': <b>' + e.z + '</b></span>' +
      '<span class="gw-pill">' + L({ es:'neutrones', en:'neutrons' }) + ': <b>' + (e.a - e.z) + '</b></span>' +
      '<span class="gw-pill">' + L({ es:'electrones colocados', en:'electrons placed' }) + ': <b>' + total() + '</b></span>' +
      '<span class="gw-pill">' + L({ es:'capas ocupadas', en:'occupied shells' }) + ': <b>' + cur.filter(function(n){ return n > 0; }).length + '</b></span>';
    for (i = 0; i < 4; i++){
      h += '<div class="shrow">' +
        '<span class="shlbl">' + L({ es:'Capa ', en:'Shell ' }) + NAMES[i] + L({ es:' (caben ', en:' (holds ' }) + CAP[i] + ')</span>' +
        '<button class="gw-btn mini" data-m="' + i + '"' + (locked || done ? ' disabled' : '') + '>−</button>' +
        '<span class="shcnt">' + cur[i] + '</span>' +
        '<button class="gw-btn mini" data-a="' + i + '"' + (locked || done ? ' disabled' : '') + '>+</button>' +
        '</div>';
    }
    elC.innerHTML = h;
    draw();
    if (locked || done) return;
    elC.querySelectorAll('[data-a]').forEach(function(b){
      b.addEventListener('click', function(){
        var i2 = parseInt(b.getAttribute('data-a'), 10);
        if (cur[i2] >= CAP[i2]){
          say(host, 'warm', L({ es:'La capa ', en:'Shell ' }) + NAMES[i2] + L({ es:' ya está llena: solo admite ', en:' is already full: it only takes ' }) + CAP[i2] + L({ es:' electrones.', en:' electrons.' }));
          return;
        }
        cur[i2]++; render(); live();
      });
    });
    elC.querySelectorAll('[data-m]').forEach(function(b){
      b.addEventListener('click', function(){
        var i2 = parseInt(b.getAttribute('data-m'), 10);
        if (cur[i2] > 0){ cur[i2]--; render(); live(); }
      });
    });
  }

  function live(){
    var e = picks[round], t = total();
    if (t === 0){ say(host, '', L({ es:'Empieza por la capa más cercana al núcleo.', en:'Start with the shell closest to the nucleus.' })); return; }
    if (t < e.z){ say(host, '', L({ es:'Llevas ', en:'You have ' }) + t + L({ es:' electrones colocados; aún faltan ', en:' electrons placed; still missing ' }) + (e.z - t) + '.'); return; }
    if (t > e.z){ say(host, 'warm', L({ es:'Ya te pasaste por ', en:'You have gone over by ' }) + (t - e.z) + L({ es:': un átomo neutro tiene tantos electrones como protones.', en:': a neutral atom has as many electrons as protons.' })); return; }
    say(host, 'warm', L({ es:'El total ya cuadra. Comprueba para ver si el reparto entre capas también.', en:'The total already matches. Check to see whether the split between shells does too.' }));
  }

  function nudge(){
    var e = picks[round], t = total(), i;
    if (t !== e.z){
      say(host, 'miss', t < e.z
        ? L({ es:'Todavía no. Un átomo neutro de este elemento necesita ', en:'Not yet. A neutral atom of this element needs ' }) + e.z + L({ es:' electrones y colocaste ', en:' electrons and you placed ' }) + t + '.'
        : L({ es:'Todavía no. Colocaste ', en:'Not yet. You placed ' }) + t + L({ es:' electrones y un átomo neutro de este elemento solo admite ', en:' electrons and a neutral atom of this element only takes ' }) + e.z + '.');
      return;
    }
    for (i = 0; i < 4; i++){
      if (cur[i] !== (e.sh[i] || 0)){
        say(host, 'miss', L({ es:'El total está bien, pero el orden no. La capa ', en:'The total is right, but the order is not. Shell ' }) + NAMES[i] +
          (cur[i] < (e.sh[i] || 0)
            ? L({ es:' se llena antes de pasar a la siguiente: caben ', en:' fills up before moving to the next one: it holds ' }) + CAP[i] + L({ es:' y pusiste ', en:' and you put ' }) + cur[i] + '.'
            : L({ es:' lleva de más: solo caben ', en:' has too many: it only holds ' }) + CAP[i] + L({ es:' y pusiste ', en:' and you put ' }) + cur[i] + '.'));
        return;
      }
    }
  }

  function settle(msgCls, msg){
    locked = true;
    elK.textContent = round === picks.length - 1 ? L({ es:'Terminar', en:'Finish' }) : L({ es:'Siguiente átomo', en:'Next atom' });
    elK.className = 'gw-btn solved';
    render();
    say(host, msgCls, msg);
  }

  elK.addEventListener('click', function(){
    if (done) return;
    if (locked){
      round++;
      tries = 0; locked = false; cur = [0, 0, 0, 0];
      if (round >= picks.length){
        done = true; round = picks.length - 1;
        elK.textContent = L({ es:'Completado', en:'Completed' });
        elK.className = 'gw-btn solved';
        elK.disabled = true;
        render();
        say(host, 'good', L({ es:'Ya puedes leer cualquier átomo de los primeros veinte: el número de capas es su periodo y lo que queda en la última capa lleva a su grupo.', en:'You can now read any of the first twenty atoms: the number of shells is its period and what is left in the last shell leads to its group.' }));
        return;
      }
      elK.textContent = L({ es:'Comprobar', en:'Check' });
      elK.className = 'gw-btn';
      render();
      say(host, '', L({ es:'Nuevo átomo. Empieza otra vez por la capa más interna.', en:'New atom. Start again from the innermost shell.' }));
      return;
    }
    var e = picks[round], ok = true, i;
    if (total() !== e.z) ok = false;
    for (i = 0; i < 4; i++) if (cur[i] !== (e.sh[i] || 0)) ok = false;
    if (ok){
      settle('good', L({ es:'Correcto: el reparto es ', en:'Correct: the distribution is ' }) + e.sh.join(', ') +
        L({ es:'. Con ', en:'. With ' }) + e.sh.length + L({ es:' capas ocupadas, el elemento cae en el periodo ', en:' occupied shells, the element falls in period ' }) + e.p +
        L({ es:', y con ', en:', and with ' }) + val(e) + L({ es:' electrones en la última capa, en el grupo ', en:' electrons in the last shell, in group ' }) + e.g + '.');
      return;
    }
    tries++;
    if (tries >= 3){
      cur = [0, 0, 0, 0];
      for (i = 0; i < e.sh.length; i++) cur[i] = e.sh[i];
      settle('warm', L({ es:'Así queda el átomo: ', en:'This is how the atom looks: ' }) + e.sh.join(', ') +
        L({ es:'. Las capas se llenan en orden y solo la última queda incompleta.', en:'. The shells fill in order and only the last one is left incomplete.' }));
      return;
    }
    nudge();
  });

  elX.addEventListener('click', function(){
    if (locked || done) return;
    cur = [0, 0, 0, 0];
    render();
    live();
  });

  render();
  say(host, '', L({ es:'Coloca los electrones uno por uno y observa cómo se llena cada órbita.', en:'Place the electrons one by one and watch each orbit fill up.' }));
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 3 :: tablero de Lewis
   Ocho posiciones alrededor del simbolo. El alumno enciende y apaga puntos.
   ══════════════════════════════════════════════════════════════════════════ */
function wLewis(rng, host){
  var SLOTS = [[81,15],[127,15],[181,59],[181,99],[127,133],[81,133],[27,99],[27,59]];
  var pool = ELS.filter(function(e){ return e.p <= 3 && e.g !== 14 && e.s !== 'H' && e.s !== 'He'; });
  var picks = shuffle(pool, rng).slice(0, 3);
  var round = 0, tries = 0, on = [], locked = false, done = false;

  host.innerHTML =
    '<div class="gw-h iw-tag">' + L({ es:'Tablero de Lewis', en:'Lewis board' }) + '</div>' +
    '<div class="gw-q" data-r="q"></div>' +
    '<div class="gw-mini iw-sub">' + L({
      es:'Toca las posiciones alrededor del símbolo para encender o apagar puntos. Cada punto es un electrón de la capa externa.',
      en:'Tap the positions around the symbol to switch dots on or off. Each dot is one electron of the outer shell.'
    }) + '</div>' +
    '<div class="lw" data-r="board"></div>' +
    '<div class="gw-read" data-r="read"></div>' +
    '<div class="gw-row">' +
      '<button class="gw-btn" data-r="chk">' + L({ es:'Comprobar', en:'Check' }) + '</button>' +
      '<button class="gw-btn" data-r="clr">' + L({ es:'Borrar puntos', en:'Clear dots' }) + '</button>' +
    '</div>' +
    '<div class="gw-fb"></div>';

  var elQ = host.querySelector('[data-r="q"]'),
      elB = host.querySelector('[data-r="board"]'),
      elR = host.querySelector('[data-r="read"]'),
      elK = host.querySelector('[data-r="chk"]'),
      elX = host.querySelector('[data-r="clr"]');

  function count(){ var n = 0, i; for (i = 0; i < 8; i++) if (on[i]) n++; return n; }

  function render(){
    var e = picks[round], h = '', i;
    elQ.innerHTML = done
      ? L({ es:'Tres diagramas listos. El número de puntos nunca fue un dato suelto: siempre salió de la columna.', en:'Three diagrams done. The number of dots was never a loose fact: it always came from the column.' })
      : L({ es:'Diagrama ', en:'Diagram ' }) + (round + 1) + L({ es:' de tres: dibuja el diagrama de Lewis del ', en:' of three: draw the Lewis diagram of ' }) + L(e) +
        L({ es:', que ocupa el grupo ', en:', which occupies group ' }) + e.g + L({ es:' del periodo ', en:' of period ' }) + e.p + '.';
    h = '<div class="lwsym">' + e.s + '</div>';
    for (i = 0; i < 8; i++){
      h += '<div class="lwd' + (on[i] ? ' on' : '') + '" data-i="' + i + '" style="left:' + SLOTS[i][0] + 'px;top:' + SLOTS[i][1] + 'px"></div>';
    }
    elB.className = 'lw' + (locked || done ? ' locked' : '');
    elB.innerHTML = h;
    elR.innerHTML =
      '<span class="gw-pill">' + L({ es:'puntos colocados', en:'dots placed' }) + ': <b>' + count() + '</b></span>' +
      '<span class="gw-pill">' + L({ es:'grupo', en:'group' }) + ': <b>' + e.g + '</b></span>' +
      '<span class="gw-pill">' + L({ es:'faltan para ocho', en:'short of eight' }) + ': <b>' + (8 - count()) + '</b></span>';
    if (locked || done) return;
    elB.querySelectorAll('.lwd').forEach(function(d){
      d.addEventListener('click', function(){
        var i2 = parseInt(d.getAttribute('data-i'), 10);
        on[i2] = !on[i2];
        render();
        say(host, '', L({ es:'Llevas ', en:'You have ' }) + count() + L({ es:' puntos. Recuerda de dónde sale ese número.', en:' dots. Remember where that number comes from.' }));
      });
    });
  }

  function settle(cls, msg){
    locked = true;
    elK.textContent = round === picks.length - 1 ? L({ es:'Terminar', en:'Finish' }) : L({ es:'Siguiente elemento', en:'Next element' });
    elK.className = 'gw-btn solved';
    render();
    say(host, cls, msg);
  }

  function tendency(e){
    var v = val(e);
    if (v === 8) return L({ es:'Con la capa externa completa, no necesita ni ceder ni ganar electrones.', en:'With a complete outer shell, it needs neither to give up nor to gain electrons.' });
    if (v <= 3) return L({ es:'Con tan pocos electrones fuera, le cuesta menos cederlos que conseguir ', en:'With so few electrons outside, giving them up costs it less than getting ' }) + (8 - v) + L({ es:' más.', en:' more.' });
    return L({ es:'Le faltan ', en:'It is ' }) + (8 - v) + L({ es:' electrones para llegar a ocho, así que le conviene ganarlos.', en:' electrons short of eight, so gaining them suits it.' });
  }

  elK.addEventListener('click', function(){
    if (done) return;
    if (locked){
      round++;
      tries = 0; locked = false; on = [];
      if (round >= picks.length){
        done = true; round = picks.length - 1;
        elK.textContent = L({ es:'Completado', en:'Completed' });
        elK.className = 'gw-btn solved';
        elK.disabled = true;
        render();
        say(host, 'good', L({ es:'Tres columnas distintas, tres diagramas distintos: el grupo es el atajo para saber cuántos puntos van.', en:'Three different columns, three different diagrams: the group is the shortcut for how many dots go in.' }));
        return;
      }
      elK.textContent = L({ es:'Comprobar', en:'Check' });
      elK.className = 'gw-btn';
      render();
      say(host, '', L({ es:'Nuevo elemento. Mira su grupo antes de tocar el tablero.', en:'New element. Look at its group before touching the board.' }));
      return;
    }
    var e = picks[round], v = val(e), n = count();
    if (n === v){
      settle('good', L({ es:'Correcto: ', en:'Correct: ' }) + v + L({ es:' puntos, uno por cada electrón de valencia del grupo ', en:' dots, one for each valence electron of group ' }) + e.g + '. ' + tendency(e));
      return;
    }
    tries++;
    if (tries >= 3){
      on = [];
      for (var i = 0; i < v; i++) on[i] = true;
      settle('warm', L({ es:'Así queda: ', en:'This is how it looks: ' }) + v + L({ es:' puntos. En los grupos 1 y 2 los electrones de valencia son el número del grupo, y del grupo 13 en adelante son el número del grupo menos diez.', en:'  dots. In groups 1 and 2 the valence electrons are the group number, and from group 13 onwards they are the group number minus ten.' }));
      return;
    }
    say(host, 'miss', n < v
      ? L({ es:'Faltan puntos. Vuelve a mirar el número del grupo y decide si hay que restarle diez.', en:'Dots are missing. Look at the group number again and decide whether ten has to be subtracted from it.' })
      : L({ es:'Sobran puntos. Solo se dibujan los electrones de la última capa, no todos los del átomo.', en:'There are too many dots. Only the electrons of the last shell are drawn, not all those of the atom.' }));
  });

  elX.addEventListener('click', function(){
    if (locked || done) return;
    on = [];
    render();
    say(host, '', L({ es:'Tablero limpio. Empieza otra vez.', en:'Board cleared. Start again.' }));
  });

  render();
  say(host, '', L({ es:'Enciende tantos puntos como electrones tenga la capa externa de este átomo.', en:'Switch on as many dots as there are electrons in the outer shell of this atom.' }));
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 4 :: ordenador de tendencias periodicas
   Cuatro elementos desordenados. El alumno toca dos para intercambiarlos y ve
   en vivo la secuencia de grupos y periodos que va formando.
   ══════════════════════════════════════════════════════════════════════════ */
function wTrend(rng, host){
  var TASKS = [
    { es:'Ordena estos elementos del periodo 3 de menor a mayor radio atómico.',
      en:'Order these period 3 elements from smallest to largest atomic radius.',
      ues:'picómetros', uen:'picometres',
      it:[{ s:'Si', g:14, p:3, v:118 }, { s:'Al', g:13, p:3, v:143 }, { s:'Mg', g:2, p:3, v:160 }, { s:'Na', g:1, p:3, v:186 }],
      key:{ es:'Dentro de un periodo el núcleo suma protones sin agregar capas, así que el átomo se encoge hacia la derecha.',
            en:'Within a period the nucleus gains protons without adding shells, so the atom shrinks towards the right.' } },
    { es:'Ordena estos elementos del grupo 17 de menor a mayor radio atómico.',
      en:'Order these group 17 elements from smallest to largest atomic radius.',
      ues:'picómetros', uen:'picometres',
      it:[{ s:'F', g:17, p:2, v:64 }, { s:'Cl', g:17, p:3, v:99 }, { s:'Br', g:17, p:4, v:114 }, { s:'I', g:17, p:5, v:133 }],
      key:{ es:'Al bajar por un grupo cada periodo agrega una capa completa, y el átomo crece.',
            en:'Going down a group each period adds a complete shell, and the atom grows.' } },
    { es:'Ordena estos elementos del periodo 2 de menor a mayor electronegatividad.',
      en:'Order these period 2 elements from lowest to highest electronegativity.',
      ues:'en la escala de Pauling', uen:'on the Pauling scale',
      it:[{ s:'Li', g:1, p:2, v:1.0 }, { s:'B', g:13, p:2, v:2.0 }, { s:'N', g:15, p:2, v:3.0 }, { s:'F', g:17, p:2, v:4.0 }],
      key:{ es:'La electronegatividad crece hacia la derecha dentro de un periodo.',
            en:'Electronegativity grows towards the right within a period.' } },
    { es:'Ordena estos elementos del periodo 2 de menor a mayor energía de ionización.',
      en:'Order these period 2 elements from lowest to highest ionization energy.',
      ues:'kilojoules por mol', uen:'kilojoules per mole',
      it:[{ s:'Li', g:1, p:2, v:520 }, { s:'B', g:13, p:2, v:801 }, { s:'C', g:14, p:2, v:1086 }, { s:'Ne', g:18, p:2, v:2081 }],
      key:{ es:'Cuesta más arrancar un electrón conforme se avanza hacia la derecha del periodo.',
            en:'Pulling out an electron costs more as you move to the right of the period.' } },
    { es:'Ordena estos elementos del periodo 2 de mayor a menor radio atómico.',
      en:'Order these period 2 elements from largest to smallest atomic radius.',
      ues:'picómetros', uen:'picometres',
      it:[{ s:'Li', g:1, p:2, v:152 }, { s:'Be', g:2, p:2, v:112 }, { s:'B', g:13, p:2, v:85 }, { s:'C', g:14, p:2, v:77 }],
      key:{ es:'El primero de la fila es el más grande y cada paso a la derecha lo encoge.',
            en:'The first of the row is the largest and each step to the right shrinks it.' } }
  ];
  var picks = shuffle(TASKS, rng).slice(0, 3);
  var round = 0, tries = 0, ord = [], sel = null, locked = false, done = false, showVals = false;

  function shufflePerm(n){
    var a = [], i;
    for (i = 0; i < n; i++) a.push(i);
    a = shuffle(a, rng);
    if (a.every(function(x, k){ return x === k; })) { var t = a[0]; a[0] = a[1]; a[1] = t; }
    return a;
  }

  host.innerHTML =
    '<div class="gw-h iw-tag">' + L({ es:'Ordenador de tendencias', en:'Trend sorter' }) + '</div>' +
    '<div class="gw-q" data-r="q"></div>' +
    '<div class="gw-mini iw-sub">' + L({
      es:'Toca dos elementos para intercambiar sus posiciones. Abajo verás la secuencia de grupos y periodos que llevas armada.',
      en:'Tap two elements to swap their positions. Below you will see the sequence of groups and periods you have built.'
    }) + '</div>' +
    '<div class="trrow" data-r="list"></div>' +
    '<div class="gw-read" data-r="read"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Comprobar', en:'Check' }) + '</button></div>' +
    '<div class="gw-fb"></div>';

  var elQ = host.querySelector('[data-r="q"]'),
      elL = host.querySelector('[data-r="list"]'),
      elR = host.querySelector('[data-r="read"]'),
      elK = host.querySelector('[data-r="chk"]');

  function render(){
    var tk = picks[round], mx = 0, i, h = '';
    for (i = 0; i < tk.it.length; i++) if (tk.it[i].v > mx) mx = tk.it[i].v;
    elQ.innerHTML = done
      ? L({ es:'Tres tendencias ordenadas. Ninguna dependió de memorizar valores: todas se leen en el mapa.', en:'Three trends sorted. None of them depended on memorising values: they are all read off the map.' })
      : L({ es:'Tendencia ', en:'Trend ' }) + (round + 1) + L({ es:' de tres. ', en:' of three. ' }) + L(tk);
    h = ord.map(function(ii, pos){
      var it = tk.it[ii];
      return '<div class="trchip' + (sel === pos ? ' sel' : '') + (locked || done ? ' locked' : '') + '" data-p="' + pos + '">' +
        '<span class="trpos">' + (pos + 1) + '</span>' +
        '<span class="trsym">' + it.s + '</span>' +
        '<span class="trmeta">' + L({ es:'grupo ', en:'group ' }) + it.g + ' · ' + L({ es:'periodo ', en:'period ' }) + it.p + '</span>' +
        (showVals ? '<span class="trbarwrap"><span class="trbar" style="width:' + Math.round(it.v / mx * 100) + '%"></span></span>' +
                    '<span class="trval">' + it.v + '</span>' : '') +
        '</div>';
    }).join('');
    elL.innerHTML = h;
    elR.innerHTML =
      '<span class="gw-pill">' + L({ es:'grupos en tu orden', en:'groups in your order' }) + ': <b>' + ord.map(function(ii){ return tk.it[ii].g; }).join(', ') + '</b></span>' +
      '<span class="gw-pill">' + L({ es:'periodos', en:'periods' }) + ': <b>' + ord.map(function(ii){ return tk.it[ii].p; }).join(', ') + '</b></span>';
    if (locked || done) return;
    elL.querySelectorAll('.trchip').forEach(function(c){
      c.addEventListener('click', function(){
        var pos = parseInt(c.getAttribute('data-p'), 10);
        if (sel === null) sel = pos;
        else if (sel === pos) sel = null;
        else { var t = ord[sel]; ord[sel] = ord[pos]; ord[pos] = t; sel = null; }
        render();
        say(host, '', L({ es:'Revisa la secuencia de grupos y periodos que quedó abajo: si es ordenada, el orden de los elementos también lo es.', en:'Look at the sequence of groups and periods left below: if it is orderly, the order of the elements is too.' }));
      });
    });
  }

  function settle(cls, msg){
    locked = true;
    showVals = true;
    elK.textContent = round === picks.length - 1 ? L({ es:'Terminar', en:'Finish' }) : L({ es:'Siguiente tendencia', en:'Next trend' });
    elK.className = 'gw-btn solved';
    render();
    say(host, cls, msg);
  }

  function start(){
    ord = shufflePerm(picks[round].it.length);
    sel = null; tries = 0; locked = false; showVals = false;
    render();
  }

  elK.addEventListener('click', function(){
    if (done) return;
    if (locked){
      round++;
      if (round >= picks.length){
        done = true; round = picks.length - 1;
        elK.textContent = L({ es:'Completado', en:'Completed' });
        elK.className = 'gw-btn solved';
        elK.disabled = true;
        render();
        say(host, 'good', L({ es:'Con la posición en la tabla basta para anticipar tamaños y fuerzas de atracción sin medir nada.', en:'Position in the table alone is enough to anticipate sizes and attraction strengths without measuring anything.' }));
        return;
      }
      elK.textContent = L({ es:'Comprobar', en:'Check' });
      elK.className = 'gw-btn';
      start();
      say(host, '', L({ es:'Nueva tendencia. Ubica primero a los cuatro en el mapa.', en:'New trend. Locate the four on the map first.' }));
      return;
    }
    var tk = picks[round], ok = ord.every(function(ii, pos){ return ii === pos; }), i;
    if (ok){
      settle('good', L({ es:'Orden correcto. ', en:'Correct order. ' }) + L(tk.key) + L({ es:' Los valores medidos, en ', en:' The measured values, in ' }) + L({ es:tk.ues, en:tk.uen }) + L({ es:', confirman la lectura.', en:', confirm the reading.' }));
      return;
    }
    tries++;
    if (tries >= 3){
      ord = tk.it.map(function(_, k){ return k; });
      settle('warm', L({ es:'Este es el orden correcto. ', en:'This is the correct order. ' }) + L(tk.key) + L({ es:' Compara ahora las barras con las posiciones en la tabla.', en:' Now compare the bars with the positions in the table.' }));
      return;
    }
    for (i = 0; i < ord.length; i++){
      if (ord[i] !== i){
        say(host, 'miss', L({ es:'Aún no. El elemento de la posición ', en:'Not yet. The element in position ' }) + (i + 1) +
          (ord[i] > i ? L({ es:' debería ir más adelante en la fila.', en:' should come later in the row.' })
                      : L({ es:' debería ir más atrás en la fila.', en:' should come earlier in the row.' })));
        break;
      }
    }
  });

  start();
  say(host, '', L({ es:'Empieza por decidir quién va primero: eso suele resolver el resto.', en:'Start by deciding who goes first: that usually settles the rest.' }));
}

  host.querySelector('[data-r="save"]').addEventListener('click', function(){

      es:'Guardado. Aquí no hay una sola respuesta correcta: lo que vale es que tu explicación se sostenga con la posición del elemento en la tabla.',

function mkP5(rng){
  var direct = (function(){
    var e = pick([elBy('Li'), elBy('Be'), elBy('B'), elBy('N'), elBy('O'), elBy('F'),

    var tC = { es: v <= 3 ? 'le conviene cederlos' : 'le conviene ganar ' + (8 - v) + ' electrones',
               en: v <= 3 ? 'it is best for it to give them up' : 'it is best for it to gain ' + (8 - v) + ' electrons' };
    var tW = { es: v <= 3 ? 'le conviene ganar ' + (8 - v) + ' electrones' : 'le conviene cederlos',

    return {

      q:{ es:'Se va a dibujar el diagrama de Lewis de un átomo neutro de ' + e.es + ', que ocupa el grupo ' + e.g + ' de la Tabla periódica. ¿Cuántos puntos rodean al símbolo y qué le conviene hacer a ese átomo para completar su capa externa?',
          en:'The Lewis diagram of a neutral atom of ' + e.en + ', which occupies group ' + e.g + ' of the Periodic table, is going to be drawn. How many dots surround the symbol and what suits that atom in order to complete its outer shell?' },
      opts:{ es:[v + ' puntos, y ' + tC.es, v + ' puntos, y ' + tW.es, alt + ' puntos, y ' + tC.es, alt + ' puntos, y ' + tW.es],
             en:[v + ' dots, and ' + tC.en, v + ' dots, and ' + tW.en, alt + ' dots, and ' + tC.en, alt + ' dots, and ' + tW.en] }, ci:0,
      hint:{ es:'En los grupos 1 y 2 los electrones de valencia coinciden con el número del grupo; del grupo 13 en adelante hay que restarle diez. Después compara qué camino hacia los ocho electrones es más corto.',
             en:'In groups 1 and 2 the valence electrons match the group number; from group 13 onwards ten has to be subtracted. Then compare which route towards eight electrons is shorter.' },
      exp:{ es:'El ' + e.es + ' está en el grupo ' + e.g + ', así que tiene ' + v + ' electrones de valencia y su diagrama de Lewis lleva ' + v + ' puntos alrededor del símbolo. ' +
              (v <= 3 ? 'Soltar esos ' + v + ' electrones lo deja con la capa completa que tenía debajo, y eso cuesta mucho menos que conseguir los ' + (8 - v) + ' que le faltarían.'
                      : 'Le faltan ' + (8 - v) + ' electrones para llegar a ocho, y conseguirlos cuesta mucho menos que soltar los ' + v + ' que ya tiene.'),
           en:'The element ' + e.en + ' is in group ' + e.g + ', so it has ' + v + ' valence electrons and its Lewis diagram carries ' + v + ' dots around the symbol. ' +
              (v <= 3 ? 'Releasing those ' + v + ' electrons leaves it with the complete shell it had underneath, and that costs far less than getting the ' + (8 - v) + ' it would be missing.'
                      : 'It is ' + (8 - v) + ' electrons short of eight, and getting them costs far less than releasing the ' + v + ' it already has.') }
    };
  })();
  var reverse = (function(){

    return {
      showWork:true,
      title:{ es:'Del dibujo a la columna', en:'From the drawing to the column' },

      opts:{ es:['Grupo ' + e.g + ', el ' + e.es, 'Grupo ' + v + ', el ' + e.es, 'Grupo ' + e.g + ', el ' + o.es, 'Grupo ' + v + ', el ' + o.es],

      hint:{ es:'Los puntos son los electrones de la capa externa; para los grupos del 13 en adelante hay que sumarle diez a ese número. El periodo termina de decidir la casilla.',
             en:'The dots are the electrons of the outer shell; for groups from 13 onwards ten has to be added to that number. The period settles the box.' },
      exp:{ es:'Con ' + v + ' puntos hay ' + v + ' electrones de valencia. En los grupos del 13 en adelante los electrones de valencia son el número del grupo menos diez, así que el grupo es ' + e.g + '. El periodo ' + e.p + ' fija la fila, y el cruce de esa fila con esa columna da la casilla del ' + e.es + '. El ' + o.es + ' comparte el grupo, pero está en otro periodo.',

    };
  })();
  return vpick(rng, [direct, reverse]);
}
