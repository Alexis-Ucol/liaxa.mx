<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geometría Sintética y Analítica</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }

/* ── INTERACTIVE WIDGETS ── */
.iwrap { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; padding:1.1rem; }
.iw-tag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.35rem; }
.iw-round { font-family:'IBM Plex Mono',monospace; font-size:.7rem; letter-spacing:.08em; color:var(--text3); text-transform:uppercase; margin-bottom:.5rem; }
.iw-instr { font-size:.9rem; color:var(--text2); margin-bottom:.7rem; }
.gcanvas { display:block; width:100%; height:300px; touch-action:manipulation; cursor:crosshair; border:1px solid var(--border); border-radius:8px; background:var(--surface); }
.minicv { display:block; width:100%; height:200px; border:1px solid var(--border); border-radius:8px; background:var(--surface); }
.readout { display:grid; grid-template-columns:repeat(3,1fr); gap:.5rem; margin-top:.7rem; }
.ro { background:var(--surface2); border-radius:8px; padding:.5rem; text-align:center; }
.ro-l { font-size:.62rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); }
.ro-v { font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:.92rem; color:var(--green); }
.rfb { min-height:1.4rem; font-size:.85rem; margin-top:.6rem; color:var(--text2); }
.rverify-btn { margin-top:.7rem; background:var(--green); color:#fff; border:none; border-radius:8px; padding:.55rem 1.1rem; font-size:.85rem; font-weight:600; cursor:pointer; min-height:44px; font-family:inherit; }
.rverify-btn:hover { background:var(--green-dark); }
.sl-row { display:grid; grid-template-columns:1fr 1fr; gap:.8rem; margin:.7rem 0 .2rem; }
.sl-row label { display:block; font-size:.72rem; color:var(--text3); margin-bottom:.2rem; }
.sl-row input[type=range] { width:100%; accent-color:var(--green); min-height:34px; }
.eqline { font-family:'IBM Plex Mono',monospace; font-size:.9rem; color:var(--green-dark); font-weight:600; text-align:center; margin-top:.5rem; }
.cls-prog { font-family:'IBM Plex Mono',monospace; font-size:.7rem; color:var(--text3); }
.cls-card { border:1.5px solid var(--border); border-radius:8px; padding:.65rem; text-align:center; font-weight:600; margin:.6rem 0; background:var(--surface2); font-size:.9rem; }
.cls-bins { display:flex; flex-wrap:wrap; gap:.5rem; margin:.7rem 0 0; }
.cls-bin { border:1.5px solid var(--border); border-radius:8px; padding:.5rem .8rem; cursor:pointer; background:var(--surface2); color:var(--text); font-family:inherit; font-size:.83rem; min-height:44px; flex:1 1 30%; }
.cls-bin:hover { border-color:var(--green); background:var(--green-bg); }
.cls-done { font-weight:700; color:var(--ok); text-align:center; padding:.7rem; font-size:.92rem; }
.reflect-prompt { font-size:.95rem; margin:.5rem 0 .8rem; color:var(--text2); }
@media (max-width: 600px) {
  .gcanvas { height:270px; }
  .iwrap { padding:.8rem; }
  .sl-row { grid-template-columns:1fr; }
  .cls-bin { flex:1 1 100%; }
  .readout { grid-template-columns:repeat(3,1fr); gap:.35rem; }
  .ro { padding:.4rem .2rem; }
  .ro-v { font-size:.82rem; }
}
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Geometría Sintética y Analítica</div>
    <div class="wcourse" id="wcourse-el">Pensamiento Matemático II · Sem 2 · Geometría</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->

function saveSession() {
  if (!studentData.name) return;
  var drawings = [], texts = [], photos = [];
  problems.forEach(function(p, i) {
    var dc = document.getElementById('dc' + i);
    if (dc && dc.width) {
      var blank = document.createElement('canvas');
      blank.width = dc.width; blank.height = dc.height;
      drawings.push(dc.toDataURL() === blank.toDataURL() ? null : dc.toDataURL('image/png'));
    } else { drawings.push(null); }
    var ta = document.getElementById('ta' + i);
    texts.push(ta ? ta.value : '');
    var pp = document.getElementById('pp' + i);
    photos.push((pp && pp.src && pp.src.indexOf('data:') === 0) ? pp.src : null);
  });
  var state = {
    name: studentData.name, group: studentData.group,
    answeredCount: answeredCount, correctCount: correctCount,
    choices: problems.map(function(p) { return p.studentChoice; }),
    drawings: drawings, texts: texts, photos: photos
  };
  try { localStorage.setItem(lsKey(), JSON.stringify(state)); } catch(e) {}
}

function loadSession(name, group) {
  var key = 'pm2_t06_g01__' + (name + '__' + group).replace(/\s+/g, '_');
  try { var r = localStorage.getItem(key); return r ? JSON.parse(r) : null; } catch(e) { return null; }
}

function restoreSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  var saved = loadSession(name, group);
  if (!saved) return;
  document.getElementById('restoreBar').style.display = 'none';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = currentAttempt(name, group);
  buildLesson(seededRng(name + group + att));
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
  saved.choices.forEach(function(choice, idx) {
    if (choice !== null && choice !== undefined) confirmMC(idx, choice);
  });
  setTimeout(function() {
    if (saved.drawings) {
      saved.drawings.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var dc = document.getElementById('dc' + i);
        if (!dc || !dc.width) return;
        var img = new Image();
        img.onload = function() {
          var dpr = window.devicePixelRatio || 1;
          dc.getContext('2d').drawImage(img, 0, 0, dc.width / dpr, dc.height / dpr);
        };
        img.src = dataUrl;
      });
    }
    if (saved.texts) {
      saved.texts.forEach(function(text, i) {
        if (!text) return;
        var ta = document.getElementById('ta' + i);
        if (ta) ta.value = text;
      });
    }
    if (saved.photos) {
      saved.photos.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var pp = document.getElementById('pp' + i);
        if (!pp) return;
        pp.src = dataUrl; pp.style.display = 'block';
        var pz = document.getElementById('pz' + i);
        if (pz) pz.style.opacity = '0.4';
      });
    }
  }, 300);
}

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

  if (!name || !group) { err.textContent = t('err-fields'); return; }
  err.textContent = '';
  studentData = { name: name, group: group };
  answeredCount = 0;
  correctCount  = 0;
  var att = nextAttempt(name, group);
  buildLesson(seededRng(name + group + att));
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS — INJECTION BLOCK ─────────────────────────────────────────
  //   Match these RGB values to --green and --gold above.
  //   PRIMARY  → pBR, pBG, pBB
  //   ACCENT   → pAR, pAG, pAB
  // ──────────────────────────────────────────────────────────────────────────
  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;  // PRIMARY (from SCHOOL, Rule 16)
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;   // ACCENT (from SCHOOL, Rule 16)

  function pdfText(html) {
    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/\u2192/g,'->').replace(/\u2212/g,'-').replace(/\u00b2/g,'^2')
      .replace(/\u00b3/g,'^3').replace(/\u00d7/g,'x').replace(/\u00f7/g,'/')
      .replace(/\u2260/g,'!=').replace(/\u2264/g,'<=').replace(/\u2265/g,'>=')
      .replace(/\u221a/g,'sqrt').replace(/\u03c0/g,'pi').replace(/\u2026/g,'...')

var MINUS = '−';
function mf(n, d) { return '<span class="mf-outer"><span class="mf-num">' + n + '</span><span class="mf-den">' + d + '</span></span>'; }
function sg(v) { return v < 0 ? MINUS + Math.abs(v) : '' + v; }
function pt(x, y) { return '(' + sg(x) + ', ' + sg(y) + ')'; }
function gcd2(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { var t = a % b; a = b; b = t; } return a || 1; }
function rat(n, d) { if (d < 0) { n = -n; d = -d; } var g = gcd2(n, d); return { n: n / g, d: d / g }; }
function ratVal(r) { return r.n / r.d; }
function ratTxt(r) { return r.d === 1 ? sg(r.n) : (r.n < 0 ? MINUS : '') + mf(Math.abs(r.n), r.d); }
function coefX(r) {

/* ---------- plane drawing kit (shared by the coordinate widgets) ---------- */
function mkPlane(cvs, R) {
  var dpr = window.devicePixelRatio || 1;
  var rect = cvs.getBoundingClientRect();
  var W = rect.width || 320, H = rect.height || 260;
  cvs.width = W * dpr; cvs.height = H * dpr;
  var ctx = cvs.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  var u = Math.min(W, H) / (2 * R + 2);
  var cx = W / 2, cy = H / 2;
  return {
    ctx: ctx, W: W, H: H, u: u, R: R,
    X: function (x) { return cx + x * u; },
    Y: function (y) { return cy - y * u; },
    ix: function (px) { return Math.round((px - cx) / u); },
    iy: function (py) { return Math.round((cy - py) / u); }
  };
}
function drawGrid(P) {
  var ctx = P.ctx, i;
  ctx.clearRect(0, 0, P.W, P.H);
  ctx.fillStyle = cv('--surface'); ctx.fillRect(0, 0, P.W, P.H);
  ctx.lineWidth = 1; ctx.strokeStyle = cv('--border');
  for (i = -P.R; i <= P.R; i++) {
    ctx.beginPath(); ctx.moveTo(P.X(i), P.Y(-P.R)); ctx.lineTo(P.X(i), P.Y(P.R)); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(P.X(-P.R), P.Y(i)); ctx.lineTo(P.X(P.R), P.Y(i)); ctx.stroke();
  }
  ctx.lineWidth = 2; ctx.strokeStyle = cv('--text3');
  ctx.beginPath(); ctx.moveTo(P.X(-P.R), P.Y(0)); ctx.lineTo(P.X(P.R), P.Y(0)); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(P.X(0), P.Y(-P.R)); ctx.lineTo(P.X(0), P.Y(P.R)); ctx.stroke();
}
function drawDot(P, x, y, color, label) {
  var ctx = P.ctx;
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(P.X(x), P.Y(y), 5.5, 0, Math.PI * 2); ctx.fill();
  if (label) {
    ctx.fillStyle = cv('--text');
    ctx.font = '600 12px "IBM Plex Sans", sans-serif';
    ctx.fillText(label, P.X(x) + 9, P.Y(y) - 9);

}
function drawRing(P, x, y, color) {
  var ctx = P.ctx;
  ctx.strokeStyle = color; ctx.lineWidth = 2.5;

function drawLineMB(P, m, b, color, dashed) {
  var ctx = P.ctx;

function gridTap(cvs, P, cb) {

function shuffleOpts(list, correctIdx, rng) {

}

/* ══════════ WIDGET 2 — build the right triangle under a segment ══════════ */
function buildDistanceWidget(rng) {

      es: 'Una tubería recta pasa por A' + pt(x1, y1) + ' y B' + pt(x2, y2) + '. Determina el valor de k para que el punto P(k, ' + sg(y0) + ') quede sobre esa tubería.',
      en: 'A straight pipe passes through A' + pt(x1, y1) + ' and B' + pt(x2, y2) + '. Determine the value of k so that the point P(k, ' + sg(y0) + ') lies on that pipe.'
    },
    fn: '',
    showWork: true,
    options: o2,
    correct: 0,
    hint: {
      es: 'Obtén primero la ecuación de la recta con las dos lecturas conocidas y después sustituye la ordenada del punto P para despejar k.',
      en: 'First get the equation of the line from the two known readings and then substitute the y value of point P to solve for k.'
    },
    expl: {
      es: 'La recta que pasa por A y B es ' + slopeEq(rat(m, 1), b) + '. Al pedir que la ordenada valga ' + sg(y0) + ' y despejar, se obtiene k = ' + sg(k) + '.',
      en: 'The line through A and B is ' + slopeEq(rat(m, 1), b) + '. Requiring the y value to be ' + sg(y0) + ' and solving gives k = ' + sg(k) + '.'
    }
  };
}

function slot10(rng) {
  var v = Math.floor(rng() * 2);
  var ox = Math.floor(rng() * 7) - 3, oy = Math.floor(rng() * 7) - 3;
  if (v === 0) {
    var A = [ox, oy];
    var B = [ox + pick([3, 4, 5, 6], rng), oy + pick([1, 2, 3], rng)];
    var C, opts, g;
    for (g = 0; g < 24; g++) {
      C = [B[0] + pick([-3, -2, 2, 3], rng), B[1] + pick([4, 5, 6], rng)];
      opts = [
        pt(A[0] + C[0] - B[0], A[1] + C[1] - B[1]),
        pt(A[0] + B[0] - C[0], A[1] + B[1] - C[1]),
        pt(B[0] + C[0] - A[0], B[1] + C[1] - A[1]),
        pt(2 * A[0] - B[0], 2 * A[1] - B[1])
      ];
      if (allDistinct(opts)) break;
    }
    return {
      title: { es: 'Cerrar el paralelogramo', en: 'Closing the parallelogram' },
      stmt: {
        es: 'Tres esquinas consecutivas de una loseta con forma de paralelogramo están en A' + pt(A[0], A[1]) + ', B' + pt(B[0], B[1]) + ' y C' + pt(C[0], C[1]) + '. Determina las coordenadas de la cuarta esquina D.',
        en: 'Three consecutive corners of a parallelogram shaped tile are at A' + pt(A[0], A[1]) + ', B' + pt(B[0], B[1]) + ' and C' + pt(C[0], C[1]) + '. Determine the coordinates of the fourth corner D.'
      },
      fn: 'A' + pt(A[0], A[1]) + ',  B' + pt(B[0], B[1]) + ',  C' + pt(C[0], C[1]),
      showWork: true,
      options: opts,
      correct: 0,
      hint: {
        es: 'En un paralelogramo el desplazamiento que lleva de B a C es el mismo que lleva de A a D, y las diagonales se cortan en su punto medio común.',
        en: 'In a parallelogram the shift taking B to C is the same one taking A to D, and the diagonals share a common midpoint.'
      },
      expl: {
        es: 'El desplazamiento de B a C es ' + pt(C[0] - B[0], C[1] - B[1]) + '. Aplicado desde A, lleva a D' + pt(A[0] + C[0] - B[0], A[1] + C[1] - B[1]) + ', que cierra la figura con lados paralelos dos a dos.',
        en: 'The shift from B to C is ' + pt(C[0] - B[0], C[1] - B[1]) + '. Applied from A, it leads to D' + pt(A[0] + C[0] - B[0], A[1] + C[1] - B[1]) + ', which closes the figure with sides parallel in pairs.'
      }
    };
  }
  var rhomb = rng() < 0.5;
  var V = rhomb
    ? [[0, 0], [3, 4], [8, 4], [5, 0]]
    : [[0, 0], [6, 2], [8, 7], [2, 5]];
  var W = V.map(function (p) { return [p[0] + ox, p[1] + oy]; });
  var opts2 = [
    { es: 'Rombo', en: 'Rhombus' },
    { es: 'Rectángulo', en: 'Rectangle' },
    { es: 'Cuadrado', en: 'Square' },
    { es: 'Paralelogramo que no es rombo ni rectángulo', en: 'Parallelogram that is neither a rhombus nor a rectangle' }
  ];
  return {
    title: { es: 'Identificar el cuadrilátero', en: 'Identifying the quadrilateral' },
    stmt: {
      es: 'Los vértices consecutivos de una pieza de mosaico son A' + pt(W[0][0], W[0][1]) + ', B' + pt(W[1][0], W[1][1]) + ', C' + pt(W[2][0], W[2][1]) + ' y D' + pt(W[3][0], W[3][1]) + '. Indica qué tipo de cuadrilátero es.',
      en: 'The consecutive vertices of a mosaic piece are A' + pt(W[0][0], W[0][1]) + ', B' + pt(W[1][0], W[1][1]) + ', C' + pt(W[2][0], W[2][1]) + ' and D' + pt(W[3][0], W[3][1]) + '. State what kind of quadrilateral it is.'
    },
    fn: '',
    showWork: true,
    options: opts2.map(function (o) { return L(o); }),
    correct: rhomb ? 0 : 3,
    hint: {
      es: 'Compara las longitudes de los cuatro lados con la distancia entre puntos y revisa con las pendientes si algún ángulo es recto.',
      en: 'Compare the lengths of the four sides with the distance between points and use the slopes to check whether any angle is right.'
    },
    expl: {
      es: rhomb
        ? 'Los cuatro lados miden 5, así que la figura es un rombo. No es cuadrado porque las pendientes de dos lados consecutivos no cumplen la condición de perpendicularidad.'
        : 'Los lados opuestos son paralelos, pero AB mide √40 y AD mide √29, y ningún ángulo es recto: se trata de un paralelogramo que no llega a rombo ni a rectángulo.',
      en: rhomb
        ? 'All four sides measure 5, so the figure is a rhombus. It is not a square because the slopes of two consecutive sides do not meet the perpendicularity condition.'
        : 'Opposite sides are parallel, but AB measures √40 and AD measures √29, and no angle is right: this is a parallelogram that is neither a rhombus nor a rectangle.'
    }
  };
}
/* ══════════ THE LESSON ══════════ */
function buildLesson(rng) {

  addSection(
    { es: 'Concepto 1', en: 'Concept 1' },
    { es: 'Dos maneras de mirar la misma figura', en: 'Two ways of looking at the same figure' },
    { es:
      '<p>La geometría <strong>sintética</strong> es la de Euclides: describe una figura por sus propiedades, lados congruentes, ángulos rectos, rectas paralelas, sin necesidad de medir posiciones. La geometría <strong>analítica</strong> estudia las mismas figuras, pero las coloca sobre un plano cartesiano y traduce cada afirmación a números y ecuaciones. Lo que en una es un argumento con regla y compás, en la otra es un cálculo.</p>' +
      '<p>El puente entre ambas es el <strong>par ordenado</strong>. Cada punto queda descrito por P(x, y): la <strong>abscisa</strong> x mide el desplazamiento horizontal desde el origen y la <strong>ordenada</strong> y el vertical. La pareja de signos decide en qué región del plano cae el punto.</p>' +
      '<div class="rules-grid">' +
        '<div class="rcard"><div class="rname">Cuadrante I</div><div class="rform">x &gt; 0, y &gt; 0</div><div class="rnote">derecha y arriba</div></div>' +
        '<div class="rcard"><div class="rname">Cuadrante II</div><div class="rform">x &lt; 0, y &gt; 0</div><div class="rnote">izquierda y arriba</div></div>' +
        '<div class="rcard"><div class="rname">Cuadrante III</div><div class="rform">x &lt; 0, y &lt; 0</div><div class="rnote">izquierda y abajo</div></div>' +
        '<div class="rcard"><div class="rname">Cuadrante IV</div><div class="rform">x &gt; 0, y &lt; 0</div><div class="rnote">derecha y abajo</div></div>' +
      '</div>' +
      '<div class="callout"><p><strong>Simetrías.</strong> Reflejar un punto respecto al eje X cambia el signo de la ordenada y conserva la abscisa. Respecto al eje Y ocurre lo contrario. Respecto al origen cambian ambos signos a la vez.</p></div>',
      en:
      '<p>Synthetic geometry is the geometry of Euclid: it describes a figure through its properties, congruent sides, right angles, parallel lines, with no need to measure positions. Analytic geometry studies the very same figures, but places them on a Cartesian plane and translates every statement into numbers and equations. What in one is an argument with straightedge and compass, in the other is a calculation.</p>' +
      '<p>The bridge between them is the <strong>ordered pair</strong>. Every point is described by P(x, y): the <strong>x value</strong> measures the horizontal shift from the origin and the <strong>y value</strong> the vertical one. The pair of signs decides which region of the plane the point falls in.</p>' +
      '<div class="rules-grid">' +
        '<div class="rcard"><div class="rname">Quadrant I</div><div class="rform">x &gt; 0, y &gt; 0</div><div class="rnote">right and up</div></div>' +
        '<div class="rcard"><div class="rname">Quadrant II</div><div class="rform">x &lt; 0, y &gt; 0</div><div class="rnote">left and up</div></div>' +
        '<div class="rcard"><div class="rname">Quadrant III</div><div class="rform">x &lt; 0, y &lt; 0</div><div class="rnote">left and down</div></div>' +
        '<div class="rcard"><div class="rname">Quadrant IV</div><div class="rform">x &gt; 0, y &lt; 0</div><div class="rnote">right and down</div></div>' +
      '</div>' +
      '<div class="callout"><p><strong>Symmetries.</strong> Reflecting a point across the X axis flips the sign of the y value and keeps the x value. Across the Y axis it is the other way round. Across the origin both signs flip at once.</p></div>'
    }
  );
  buildPlaneWidget(rng);
  addProb(slot1(rng), rng);

  addSection(
    { es: 'Concepto 2', en: 'Concept 2' },
    { es: 'Cuánto mide un segmento oblicuo', en: 'How long a slanted segment is' },
    { es:
      '<p>En geometría sintética un segmento simplemente tiene una longitud. En el plano cartesiano esa longitud se puede <em>calcular</em>: al trazar desde cada extremo una paralela a los ejes aparece un triángulo rectángulo cuyos catetos son las diferencias de coordenadas Δx y Δy, y cuya hipotenusa es justamente el segmento.</p>' +
      '<div class="rules-grid">' +
        '<div class="rcard"><div class="rname">Diferencias</div><div class="rform">Δx = x₂ ' + MINUS + ' x₁,  Δy = y₂ ' + MINUS + ' y₁</div><div class="rnote">catetos del triángulo</div></div>' +
        '<div class="rcard"><div class="rname">Distancia</div><div class="rform">d = √(Δx² + Δy²)</div><div class="rnote">hipotenusa</div></div>' +
      '</div>' +
      '<p>El orden en que tomes los puntos no altera el resultado, porque las diferencias se elevan al cuadrado y el signo desaparece. Esta única fórmula convierte toda pregunta sobre longitudes en aritmética.</p>',
      en:
      '<p>In synthetic geometry a segment simply has a length. On the Cartesian plane that length can be <em>computed</em>: drawing a parallel to each axis from each endpoint produces a right triangle whose legs are the coordinate differences Δx and Δy, and whose hypotenuse is precisely the segment.</p>' +
      '<div class="rules-grid">' +
        '<div class="rcard"><div class="rname">Differences</div><div class="rform">Δx = x₂ ' + MINUS + ' x₁,  Δy = y₂ ' + MINUS + ' y₁</div><div class="rnote">legs of the triangle</div></div>' +
        '<div class="rcard"><div class="rname">Distance</div><div class="rform">d = √(Δx² + Δy²)</div><div class="rnote">hypotenuse</div></div>' +
      '</div>' +
      '<p>The order in which you take the points does not change the result, because the differences are squared and the sign disappears. This single formula turns every question about lengths into arithmetic.</p>'
    }
  );
  buildDistanceWidget(rng);
  addProb(slot2(rng), rng);

  addSection(
    { es: 'Concepto 3', en: 'Concept 3' },
    { es: 'El punto que parte el segmento en dos', en: 'The point that splits a segment in two' },
    { es:
      '<p>Bisecar un segmento con regla y compás es un clásico de la geometría sintética. Con coordenadas el mismo problema se resuelve promediando: el punto medio de A(x₁, y₁) y B(x₂, y₂) tiene por abscisa el promedio de las abscisas y por ordenada el promedio de las ordenadas.</p>' +
      '<div class="callout"><p><strong>Punto medio.</strong> M ' + '= ' + '(' + mf('x₁ + x₂', '2') + ', ' + mf('y₁ + y₂', '2') + '). La relación funciona en los dos sentidos: si conoces M y un extremo, puedes recuperar el otro repitiendo el mismo desplazamiento.</p></div>',
      en:
      '<p>Bisecting a segment with straightedge and compass is a classic of synthetic geometry. With coordinates the same problem is solved by averaging: the midpoint of A(x₁, y₁) and B(x₂, y₂) has as its x value the average of the x values and as its y value the average of the y values.</p>' +
      '<div class="callout"><p><strong>Midpoint.</strong> M = (' + mf('x₁ + x₂', '2') + ', ' + mf('y₁ + y₂', '2') + '). The relationship works both ways: if you know M and one endpoint, you can recover the other by repeating the same shift.</p></div>'
    }
  );
  addProb(slot3(rng), rng);

  addSection(
    { es: 'Concepto 4', en: 'Concept 4' },
    { es: 'La pendiente como razón de cambio', en: 'Slope as a rate of change' },
    { es:
      '<p>La <strong>pendiente</strong> mide cuánto sube o baja una recta por cada unidad que avanza hacia la derecha. Es una razón de cambio: compara el cambio vertical con el cambio horizontal entre dos puntos cualesquiera de la recta, y su valor es el mismo sin importar qué par de puntos elijas.</p>' +
      '<div class="rules-grid">' +
        '<div class="rcard"><div class="rname">Pendiente</div><div class="rform">m = ' + mf('Δy', 'Δx') + '</div><div class="rnote">sube entre avanza</div></div>' +
        '<div class="rcard"><div class="rname">Signo</div><div class="rform">m &gt; 0 sube, m &lt; 0 baja</div><div class="rnote">de izquierda a derecha</div></div>' +
        '<div class="rcard"><div class="rname">Casos límite</div><div class="rform">m = 0 horizontal</div><div class="rnote">vertical: no está definida</div></div>' +
      '</div>' +
      '<p>Una recta vertical tiene Δx = 0 y la razón no existe, por eso se dice que no tiene pendiente definida en lugar de decir que vale cero.</p>',
      en:
      '<p><strong>Slope</strong> measures how much a line rises or falls for every unit it advances to the right. It is a rate of change: it compares the vertical change with the horizontal change between any two points of the line, and its value is the same no matter which pair you choose.</p>' +
      '<div class="rules-grid">' +
        '<div class="rcard"><div class="rname">Slope</div><div class="rform">m = ' + mf('Δy', 'Δx') + '</div><div class="rnote">rise over run</div></div>' +
        '<div class="rcard"><div class="rname">Sign</div><div class="rform">m &gt; 0 rises, m &lt; 0 falls</div><div class="rnote">from left to right</div></div>' +
        '<div class="rcard"><div class="rname">Edge cases</div><div class="rform">m = 0 horizontal</div><div class="rnote">vertical: undefined</div></div>' +
      '</div>' +
      '<p>A vertical line has Δx = 0 and the ratio does not exist, which is why we say its slope is undefined rather than saying it is zero.</p>'
    }
  );
  buildSlopeWidget(rng);
  addProb(slot4(rng), rng);

  addSection(
    { es: 'Concepto 5', en: 'Concept 5' },
    { es: 'Tres vestidos para la misma recta', en: 'Three outfits for the same line' },
    { es:
      '<p>Una recta admite varias escrituras equivalentes. Elegir una u otra depende de qué datos tengas a la mano y de qué te pregunten.</p>' +
      '<div class="rules-grid">' +
        '<div class="rcard"><div class="rname">Punto y pendiente</div><div class="rform">y ' + MINUS + ' y₁ = m(x ' + MINUS + ' x₁)</div><div class="rnote">un punto y la inclinación</div></div>' +
        '<div class="rcard"><div class="rname">Pendiente y ordenada</div><div class="rform">y = mx + b</div><div class="rnote">b es el corte con el eje Y</div></div>' +
        '<div class="rcard"><div class="rname">General</div><div class="rform">Ax + By + C = 0</div><div class="rnote">m = ' + MINUS + mf('A', 'B') + '</div></div>' +
      '</div>' +
      '<p>Pasar de una forma a otra es puro álgebra: agrupar términos en un solo miembro produce la forma general, y despejar y devuelve la forma pendiente y ordenada al origen.</p>',
      en:
      '<p>A line admits several equivalent ways of being written. Choosing one or another depends on which data you have at hand and what you are asked for.</p>' +
      '<div class="rules-grid">' +
        '<div class="rcard"><div class="rname">Point and slope</div><div class="rform">y ' + MINUS + ' y₁ = m(x ' + MINUS + ' x₁)</div><div class="rnote">one point and the tilt</div></div>' +
        '<div class="rcard"><div class="rname">Slope and intercept</div><div class="rform">y = mx + b</div><div class="rnote">b is the cut on the Y axis</div></div>' +
        '<div class="rcard"><div class="rname">General</div><div class="rform">Ax + By + C = 0</div><div class="rnote">m = ' + MINUS + mf('A', 'B') + '</div></div>' +
      '</div>' +
      '<p>Moving from one form to another is pure algebra: gathering terms on a single side produces the general form, and solving for y returns the slope and intercept form.</p>'
    }
  );
  addProb(slot5(rng), rng);
  addProb(slot6(rng), rng);

  addSection(
    { es: 'Concepto 6', en: 'Concept 6' },
    { es: 'Paralelismo y perpendicularidad, ahora con números', en: 'Parallelism and perpendicularity, now with numbers' },
    { es:
      '<p>Que dos rectas sean paralelas o perpendiculares era, en la geometría de Euclides, una afirmación sobre ángulos. En el plano cartesiano se vuelve una comparación entre dos números.</p>' +
      '<div class="rules-grid">' +
        '<div class="rcard"><div class="rname">Paralelas</div><div class="rform">m₁ = m₂</div><div class="rnote">nunca se cortan</div></div>' +
        '<div class="rcard"><div class="rname">Perpendiculares</div><div class="rform">m₁ · m₂ = ' + MINUS + '1</div><div class="rnote">recíprocas con signo opuesto</div></div>' +
        '<div class="rcard"><div class="rname">Oblicuas</div><div class="rform">m₁ ≠ m₂ y m₁ · m₂ ≠ ' + MINUS + '1</div><div class="rnote">se cortan sin ángulo recto</div></div>' +
      '</div>' +
      '<p>Si además de la pendiente coincide la ordenada al origen, no hay dos rectas: hay una sola escrita de dos formas.</p>',
      en:
      '<p>Two lines being parallel or perpendicular was, in the geometry of Euclid, a statement about angles. On the Cartesian plane it becomes a comparison between two numbers.</p>' +
      '<div class="rules-grid">' +
        '<div class="rcard"><div class="rname">Parallel</div><div class="rform">m₁ = m₂</div><div class="rnote">they never meet</div></div>' +
        '<div class="rcard"><div class="rname">Perpendicular</div><div class="rform">m₁ · m₂ = ' + MINUS + '1</div><div class="rnote">opposite reciprocals</div></div>' +
        '<div class="rcard"><div class="rname">Oblique</div><div class="rform">m₁ ≠ m₂ and m₁ · m₂ ≠ ' + MINUS + '1</div><div class="rnote">they meet without a right angle</div></div>' +
      '</div>' +
      '<p>If the y intercept also coincides, there are not two lines: there is a single one written in two ways.</p>'
    }
  );
  buildLinePairWidget(rng);
  addProb(slot7(rng), rng);

  addSection(
    { es: 'Concepto 7', en: 'Concept 7' },
    { es: 'Demostrar propiedades de una figura con cálculos', en: 'Proving properties of a figure with calculations' },
    { es:
      '<p>Aquí las dos geometrías se encuentran del todo. Cada criterio sintético que sirve para clasificar una figura tiene un equivalente numérico exacto sobre el plano.</p>' +
      '<div class="rules-grid">' +
        '<div class="rcard"><div class="rname">Lados iguales</div><div class="rform">misma distancia</div><div class="rnote">isósceles, rombo, cuadrado</div></div>' +
        '<div class="rcard"><div class="rname">Ángulo recto</div><div class="rform">producto de pendientes = ' + MINUS + '1</div><div class="rnote">triángulo rectángulo, rectángulo</div></div>' +
        '<div class="rcard"><div class="rname">Lados paralelos</div><div class="rform">pendientes iguales</div><div class="rnote">paralelogramo, trapecio</div></div>' +
      '</div>' +
      '<p>Clasificar una figura deja de ser cuestión de apariencia: se calculan distancias y pendientes, y el conjunto de resultados decide el nombre de la figura sin margen de duda.</p>',
      en:
      '<p>Here the two geometries meet completely. Every synthetic criterion used to classify a figure has an exact numerical equivalent on the plane.</p>' +
      '<div class="rules-grid">' +
        '<div class="rcard"><div class="rname">Equal sides</div><div class="rform">same distance</div><div class="rnote">isosceles, rhombus, square</div></div>' +
        '<div class="rcard"><div class="rname">Right angle</div><div class="rform">product of slopes = ' + MINUS + '1</div><div class="rnote">right triangle, rectangle</div></div>' +
        '<div class="rcard"><div class="rname">Parallel sides</div><div class="rform">equal slopes</div><div class="rnote">parallelogram, trapezoid</div></div>' +
      '</div>' +
      '<p>Classifying a figure stops being a matter of appearance: distances and slopes are computed, and the set of results decides the name of the figure with no room for doubt.</p>'
    }
  );
  addProb(slot8(rng), rng);

  buildReflect(rng);

  addSection(
    { es: 'Cierre', en: 'Wrap up' },
    { es: 'Todo junto', en: 'All together' },
    { es: '<p>Las dos situaciones que siguen combinan coordenadas, distancias, pendientes y ecuaciones en un mismo trazado.</p>',
      en: '<p>The two situations that follow combine coordinates, distances, slopes and equations within a single layout.</p>' }
  );
  addProb(slot9(rng), rng);
  addProb(slot10(rng), rng);
}
</script>
