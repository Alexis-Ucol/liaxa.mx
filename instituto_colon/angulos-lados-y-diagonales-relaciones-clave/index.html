          g.fillText('180°', mx, my);
        }
      }
    }
    function update(){
      var n=N(), e;
      e=document.getElementById('w2vv'); if(e) e.textContent=n;
      e=document.getElementById('w2n'); if(e) e.textContent=n;
      e=document.getElementById('w2t'); if(e) e.textContent=(n-2);
      e=document.getElementById('w2s');
      if (e){ e.textContent=dg((n-2)*180); e.style.color = ((n-2)*180===R().sum ? 'var(--ok)' : 'var(--gold)'); }
      e=document.getElementById('w2goal');
      if (e) e.innerHTML=L({es:'Ronda '+(round+1)+' de 3: arma el polígono cuyos ángulos interiores sumen <strong>'+dg(R().sum)+'</strong>.',
                            en:'Round '+(round+1)+' of 3: build the polygon whose interior angles add up to <strong>'+dg(R().sum)+'</strong>.'});
      draw();
    }
    function nextRound(){
      round++; busy=false;
      if (round>=3){ done=true; return; }
      tries=0;
      var sl=document.getElementById('w2v'); if(sl) sl.value='3';
      update();
    }
    function check(){
      if (done || busy) return;
      var r=R(), n=N(), s=(n-2)*180;
      if (n===r.n){
        fbSet('w2fb', true, L({es:'🎉 Ahí está. La figura de '+n+' lados se parte en '+(n-2)+' triángulos, y '+(n-2)+' × 180 = '+dg(r.sum)+'.'+(round===2?' Las tres rondas quedaron listas.':' Va la siguiente ronda.'),
                               en:'🎉 There it is. The '+n+' sided figure splits into '+(n-2)+' triangles, and '+(n-2)+' × 180 = '+dg(r.sum)+'.'+(round===2?' All three rounds are done.':' On to the next round.')}));
        draw(); busy=true; setTimeout(nextRound, 80); return;
      }
      tries++;
      if (tries>=3){
        var sl=document.getElementById('w2v'); if(sl) sl.value=String(r.n);
        update();
        fbSet('w2fb', true, L({es:'La meta de '+dg(r.sum)+' se alcanza con '+(r.n-2)+' triángulos, porque '+r.sum+' ÷ 180 = '+(r.n-2)+'. Y un polígono se parte en dos triángulos menos que lados, así que la figura tiene '+r.n+' lados.',
                               en:'The target of '+dg(r.sum)+' is reached with '+(r.n-2)+' triangles, because '+r.sum+' ÷ 180 = '+(r.n-2)+'. And a polygon splits into two triangles fewer than its sides, so the figure has '+r.n+' sides.'}));
        busy=true; setTimeout(nextRound, 80); return;
      }
      fbSet('w2fb', false, (s>r.sum)
        ? L({es:'Con '+n+' lados aparecen '+(n-2)+' triángulos y la suma se dispara a '+dg(s)+', por encima de la meta. Quítale lados.',
             en:'With '+n+' sides there are '+(n-2)+' triangles and the sum shoots up to '+dg(s)+', above the target. Take sides away.'})
        : L({es:'Con '+n+' lados solo aparecen '+(n-2)+' triángulos y la suma se queda en '+dg(s)+', por debajo de la meta. Agrégale lados.',
             en:'With '+n+' sides there are only '+(n-2)+' triangles and the sum stays at '+dg(s)+', below the target. Add sides.'}));
    }
    var sl0=document.getElementById('w2v'); if(sl0) sl0.addEventListener('input', update);
    var cb=document.getElementById('w2chk'); if(cb) cb.addEventListener('click', check);
    setTimeout(update, 90);
    window.addEventListener('resize', function(){ if(document.getElementById('w2cv')===myCv) draw(); });
  })();

  /* ── P3 ── */
  var p3v = pk([0,1]);
  var p3q, p3exp, p3corr, p3opts, p3title, p3hint, p3sfx;
  if (p3v===0){
    var n3 = pk([7,9,11,13,14]);
    var s3 = (n3-2)*180;
    p3corr = s3; p3sfx = '°';
    p3opts = optN(s3, [n3*180, (n3-1)*180, (n3-3)*180], '°');
    p3title = L({es:'Todo lo que suma por dentro', en:'Everything it adds up to inside'});
    p3q = L({es:'Un polígono tiene '+n3+' lados. ¿Cuánto suman todos sus ángulos interiores?',
             en:'A polygon has '+n3+' sides. How much do all its interior angles add up to?'});
    p3exp = L({es:'Al unir un vértice con todos los demás, la figura de '+n3+' lados queda partida en '+(n3-2)+' triángulos, dos menos que lados. Cada triángulo aporta su ángulo llano: '+(n3-2)+' × 180 = '+dg(s3),
               en:'Joining one vertex to all the others, the '+n3+' sided figure comes apart into '+(n3-2)+' triangles, two fewer than its sides. Each triangle contributes its straight angle: '+(n3-2)+' × 180 = '+dg(s3)});
    p3hint = L({es:'Parte la figura en triángulos desde un solo vértice, cuenta cuántos salen y recuerda cuánto suma cada triángulo por su cuenta.',
                en:'Split the figure into triangles from a single vertex, count how many come out and remember how much each triangle adds up to on its own.'});
  } else {
    var n3b = pk([8,10,12,15,16]);
    var s3b = (n3b-2)*180;
    p3corr = n3b; p3sfx = '';
    p3opts = optN(n3b, [n3b-2, n3b+2, n3b-1], '');
    p3title = L({es:'De la suma a los lados', en:'From the sum back to the sides'});
    p3q = L({es:'Los ángulos interiores de cierto polígono suman '+dg(s3b)+'. ¿Cuántos lados tiene esa figura?',
             en:'The interior angles of a certain polygon add up to '+dg(s3b)+'. How many sides does that figure have?'});
    p3exp = L({es:'Esa suma se reparte en triángulos de 180° cada uno: '+s3b+' ÷ 180 = '+(n3b-2)+' triángulos. Como la partición desde un vértice siempre deja dos triángulos menos que lados, el polígono tiene '+(n3b-2)+' + 2 lados, es decir n = '+n3b,
               en:'That sum is made of triangles of 180° each: '+s3b+' ÷ 180 = '+(n3b-2)+' triangles. Since splitting from one vertex always leaves two triangles fewer than sides, the polygon has '+(n3b-2)+' + 2 sides, that is n = '+n3b});
    p3hint = L({es:'Averigua primero cuántos triángulos caben en esa suma y después recuerda que la figura tiene dos lados más que triángulos.',
                en:'First work out how many triangles fit in that sum and then remember the figure has two sides more than triangles.'});
  }
  addProb({
    title: p3title, q: p3q, hint: p3hint, exp: p3exp,
    correct: p3corr+p3sfx, options: p3opts, showWork: true
  });

  /* ── P4 ── */
  var p4v = pk([0,1,2]);
  var p4q, p4exp, p4corr, p4opts, p4title, p4hint, p4sfx;
  var REG = [{n:5,a:108},{n:6,a:120},{n:8,a:135},{n:9,a:140},{n:10,a:144},{n:12,a:150}];
  var reg4 = pk(REG);
  if (p4v===0){
    p4corr = reg4.a; p4sfx = '°';
    p4opts = optN(reg4.a, [360/reg4.n, (reg4.n-2)*180, 180], '°');
    p4title = L({es:'Cada esquina de un polígono regular', en:'Each corner of a regular polygon'});
    p4q = L({es:'Un polígono regular de '+reg4.n+' lados tiene todos sus ángulos interiores iguales. ¿Cuánto mide cada uno de ellos?',
             en:'A regular polygon with '+reg4.n+' sides has all its interior angles equal. How much does each one measure?'});
    p4exp = L({es:'La figura se parte en '+(reg4.n-2)+' triángulos, así que sus ángulos interiores suman '+(reg4.n-2)+' × 180 = '+dg((reg4.n-2)*180)+'. Al ser regular ese total se reparte por igual entre sus '+reg4.n+' vértices: '+((reg4.n-2)*180)+' ÷ '+reg4.n+' = '+dg(reg4.a),
               en:'The figure splits into '+(reg4.n-2)+' triangles, so its interior angles add up to '+(reg4.n-2)+' × 180 = '+dg((reg4.n-2)*180)+'. Being regular, that total is shared equally among its '+reg4.n+' vertices: '+((reg4.n-2)*180)+' ÷ '+reg4.n+' = '+dg(reg4.a)});
    p4hint = L({es:'Calcula primero el total que suman todos los ángulos interiores y después piensa qué le toca a cada vértice cuando todos son iguales.',
                en:'First work out the total of all the interior angles and then think what each vertex gets when they are all equal.'});
  } else if (p4v===1){
    p4corr = reg4.n; p4sfx = '';
    p4opts = optN(reg4.n, [reg4.n-2, reg4.n+2, reg4.n*2], '');
    p4title = L({es:'Del ángulo al número de lados', en:'From the angle to the number of sides'});
    p4q = L({es:'En un polígono regular cada ángulo interior mide '+dg(reg4.a)+'. ¿Cuántos lados tiene la figura?',
             en:'In a regular polygon each interior angle measures '+dg(reg4.a)+'. How many sides does the figure have?'});
    p4exp = L({es:'Junto a cada ángulo interior queda el exterior, y entre los dos completan un ángulo llano: 180 − '+reg4.a+' = '+dg(180-reg4.a)+'. Como los exteriores de cualquier polígono suman una vuelta completa, caben '+360+' ÷ '+(180-reg4.a)+' de ellos, de modo que n = '+reg4.n,
               en:'Next to each interior angle sits its exterior one, and between them they complete a straight angle: 180 − '+reg4.a+' = '+dg(180-reg4.a)+'. Since the exterior angles of any polygon add up to one full turn, there is room for '+360+' ÷ '+(180-reg4.a)+' of them, so n = '+reg4.n});
    p4hint = L({es:'Fíjate en el ángulo exterior que acompaña a cada interior y recuerda cuánto suman todos los exteriores juntos.',
                en:'Look at the exterior angle that accompanies each interior one and remember how much all the exterior angles add up to together.'});
  } else {
    p4corr = 360/reg4.n; p4sfx = '°';
    p4opts = optN(360/reg4.n, [reg4.a, (reg4.n-2)*180, 360], '°');
    p4title = L({es:'La vuelta completa repartida', en:'The full turn shared out'});
    p4q = L({es:'Al prolongar cada lado de un polígono regular de '+reg4.n+' lados queda formado un ángulo exterior en cada vértice, y todos miden lo mismo. ¿Cuánto mide cada ángulo exterior?',
             en:'Extending each side of a regular polygon with '+reg4.n+' sides forms an exterior angle at every vertex, and they all measure the same. How much does each exterior angle measure?'});
    p4exp = L({es:'Recorrer el contorno del polígono equivale a dar una vuelta completa, así que los ángulos exteriores suman 360°. Al ser regular esa vuelta se reparte por igual entre los '+reg4.n+' vértices: 360 ÷ '+reg4.n+' = '+dg(360/reg4.n),
               en:'Walking around the outline of the polygon amounts to one full turn, so the exterior angles add up to 360°. Being regular, that turn is shared equally among the '+reg4.n+' vertices: 360 ÷ '+reg4.n+' = '+dg(360/reg4.n)});
    p4hint = L({es:'Imagina que caminas por la orilla del polígono girando en cada esquina hasta volver al punto de partida, y piensa cuánto giraste en total.',
                en:'Imagine walking around the edge of the polygon turning at each corner until you are back where you started, and think how much you turned in total.'});
  }
  addProb({
    title: p4title, q: p4q, hint: p4hint, exp: p4exp,
    correct: p4corr+p4sfx, options: p4opts, showWork: true
  });

  /* ══════════════════════════════════════════════════════════════════
     SECCIÓN 3 - Las diagonales
     ══════════════════════════════════════════════════════════════════ */
  sec(L({es:'Concepto 3', en:'Concept 3'}),
      L({es:'Los trazos que cruzan la figura por dentro', en:'The strokes that cross the figure inside'}),
    '<p>'+L({es:'Una diagonal une dos vértices que no son vecinos. Desde un vértice cualquiera salen tantas diagonales como vértices haya, menos tres: se descuenta él mismo y se descuentan sus dos vecinos, porque unirse con ellos daría lados y no diagonales. Si se hace la cuenta vértice por vértice y luego se suma todo, cada diagonal aparece dos veces, una desde cada extremo, así que el total verdadero es la mitad de esa cuenta.',
             en:'A diagonal joins two vertices that are not neighbours. From any vertex there come out as many diagonals as there are vertices, minus three: itself is discounted and so are its two neighbours, because joining them would give sides and not diagonals. If the count is done vertex by vertex and then added up, every diagonal shows up twice, once from each end, so the true total is half that count.'})+'</p>'+
    '<p>'+L({es:'En los cuadriláteros las diagonales hacen algo más que cruzar la figura: la identifican. En cualquier paralelogramo las dos diagonales se cortan justo en su punto medio, y cada figura especial añade una condición. En el rectángulo, además, las dos miden lo mismo. En el rombo, además, se cruzan formando ángulo recto. El cuadrado cumple las dos condiciones al mismo tiempo. Y hay figuras que rompen el patrón: en un trapecio isósceles las diagonales miden lo mismo, pero no se cortan en su punto medio.',
             en:'In quadrilaterals the diagonals do more than cross the figure: they identify it. In any parallelogram the two diagonals cut each other exactly at their midpoint, and each special figure adds one condition. In the rectangle, on top of that, the two are equal in length. In the rhombus, on top of that, they cross at a right angle. The square meets both conditions at once. And there are figures that break the pattern: in an isosceles trapezoid the diagonals are equal in length, but they do not cut each other at their midpoint.'})+'</p>'+
    '<div class="rules-grid">'+
      '<div class="rcard"><div class="rname">'+L({es:'Desde un vértice',en:'From one vertex'})+'</div><div class="rform">n − 3</div><div class="rnote">'+L({es:'Se descartan el propio vértice y sus vecinos.',en:'The vertex itself and its neighbours are ruled out.'})+'</div></div>'+
      '<div class="rcard"><div class="rname">'+L({es:'En toda la figura',en:'In the whole figure'})+'</div><div class="rform">n × (n − 3) ÷ 2</div><div class="rnote">'+L({es:'Se divide entre dos porque cada una se cuenta doble.',en:'Halved because each one gets counted twice.'})+'</div></div>'+
      '<div class="rcard"><div class="rname">'+L({es:'Paralelogramo',en:'Parallelogram'})+'</div><div class="rform">'+L({es:'se cortan a la mitad',en:'they bisect each other'})+'</div><div class="rnote">'+L({es:'El punto de cruce parte a las dos por igual.',en:'The crossing point splits both evenly.'})+'</div></div>'+
      '<div class="rcard"><div class="rname">'+L({es:'Rombo',en:'Rhombus'})+'</div><div class="rform">'+L({es:'se cruzan a 90°',en:'they cross at 90°'})+'</div><div class="rnote">'+L({es:'Perpendiculares, aunque de distinto tamaño.',en:'Perpendicular, though of different lengths.'})+'</div></div>'+
    '</div>'+
    '<div class="callout"><p>'+L({es:'En un cuadrilátero una sola diagonal ya lo parte en dos triángulos, y por eso sus ángulos interiores suman 360°. La misma idea que sirvió para los polígonos vuelve a aparecer aquí, ahora con el trazo más corto posible.',
                                  en:'In a quadrilateral a single diagonal already splits it into two triangles, and that is why its interior angles add up to 360°. The same idea that worked for polygons shows up again here, now with the shortest possible stroke.'})+'</p></div>');

  /* ── W3: traza todas las diagonales ── */
  var w3n = pk([5,6]);
  var w3names = letters(w3n);
  widget('diagonals',
    '<div class="stag">'+L({es:'Traza las diagonales',en:'Draw the diagonals'})+'</div>'+
    '<h2>'+L({es:'No dejes ni una sin trazar',en:'Do not leave a single one out'})+'</h2>'+
    '<p>'+L({es:'Toca un vértice y luego otro para unirlos. Si los dos son vecinos el trazo sería un lado y la figura lo rechaza. Si te arrepientes de un trazo, vuelve a tocar sus dos extremos y desaparece. Cuando creas que ya están todas, comprueba.',
             en:'Tap one vertex and then another to join them. If the two are neighbours the stroke would be a side and the figure rejects it. If you regret a stroke, tap its two ends again and it disappears. When you think they are all there, check.'})+'</p>'+
    '<div class="gcrd">'+
      '<div style="font-size:.85rem;color:var(--text2);margin-bottom:.7rem" id="w3goal"></div>'+
      '<div class="cvwrap"><canvas id="w3cv" style="display:block;width:100%;height:236px"></canvas></div>'+
      '<div style="display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.7rem">'+
        '<button id="w3clr" style="'+BTN2+'">'+L({es:'Borrar trazos',en:'Erase strokes'})+'</button>'+
        '<button id="w3chk" style="'+BTN+'">'+L({es:'Comprobar',en:'Check'})+'</button>'+
      '</div>'+
      '<div class="metrics" style="margin-top:.9rem">'+
        '<div class="metric"><div class="mlbl">'+L({es:'Vértices',en:'Vertices'})+'</div><div class="mnum cs" id="w3n">-</div></div>'+
        '<div class="metric"><div class="mlbl">'+L({es:'Trazos hechos',en:'Strokes drawn'})+'</div><div class="mnum ps" id="w3c">0</div></div>'+
        '<div class="metric"><div class="mlbl">'+L({es:'Vértice elegido',en:'Chosen vertex'})+'</div><div class="mnum ts" id="w3sel">-</div></div>'+
      '</div>'+
      '<div class="mcfb" id="w3fb"></div>'+
    '</div>');

  (function(){
    var n=w3n, target=n*(n-3)/2, sel=-1, drawn={}, tries=0, done=false, busy=false, VP=[];
    var myCv = document.getElementById('w3cv');
    function key(a,b){ return Math.min(a,b)+'-'+Math.max(a,b); }
    function adj(a,b){ var d=Math.abs(a-b); return d===1 || d===n-1; }
    function count(){ var c=0, k; for (k in drawn) if (drawn[k]) c++; return c; }
    function fromVertex(i){
      var c=0, j;
      for (j=0;j<n;j++) if (j!==i && !adj(i,j) && drawn[key(i,j)]) c++;
      return c;
    }
    function draw(){
      var cv=document.getElementById('w3cv'); if(!cv || cv!==myCv) return;
      var dpr=window.devicePixelRatio||1, W=cv.clientWidth||320, H=236;
      cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
      var g=cv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,W,H);
      var cx=W/2, cy=H/2, rad=Math.min(W,H)/2-30, i, j;
      VP=[];
      for (i=0;i<n;i++){
        var a=-Math.PI/2 + i*2*Math.PI/n;
        VP.push([cx+rad*Math.cos(a), cy+rad*Math.sin(a)]);
      }
      g.fillStyle=cssv('--green-bg');
      g.beginPath(); g.moveTo(VP[0][0],VP[0][1]);
      for (i=1;i<n;i++) g.lineTo(VP[i][0],VP[i][1]);
      g.closePath(); g.fill();
      g.strokeStyle=cssv('--green'); g.lineWidth=2.4; g.stroke();
      g.strokeStyle=cssv('--gold'); g.lineWidth=2.2;
      for (i=0;i<n;i++) for (j=i+1;j<n;j++){
        if (drawn[key(i,j)]){ g.beginPath(); g.moveTo(VP[i][0],VP[i][1]); g.lineTo(VP[j][0],VP[j][1]); g.stroke(); }
      }
      for (i=0;i<n;i++){
        g.beginPath(); g.arc(VP[i][0],VP[i][1],9,0,Math.PI*2);
        g.fillStyle = (i===sel) ? cssv('--gold') : cssv('--surface');
        g.fill();
        g.strokeStyle=cssv('--green-dark'); g.lineWidth=2; g.stroke();
        g.fillStyle=cssv('--text'); g.font='700 11px "IBM Plex Sans", sans-serif';
        g.textAlign='center'; g.textBaseline='middle';
        var lx=VP[i][0]+(VP[i][0]-cx)*0.17, ly=VP[i][1]+(VP[i][1]-cy)*0.17;
        g.fillText(w3names[i], lx, ly);
      }
    }
    function update(){
      var e;
      e=document.getElementById('w3n'); if(e) e.textContent=n;
      e=document.getElementById('w3c'); if(e) e.textContent=count();
      e=document.getElementById('w3sel'); if(e) e.textContent = (sel<0 ? '-' : w3names[sel]);
      e=document.getElementById('w3goal');
      if (e) e.innerHTML=L({es:'Traza todas las diagonales de este polígono de <strong>'+n+' lados</strong> y comprueba cuántas resultaron.',
                            en:'Draw every diagonal of this <strong>'+n+' sided</strong> polygon and check how many came out.'});
      draw();
    }
    function tap(i){
      if (done) return;
      if (sel<0){ sel=i; update(); return; }
      if (sel===i){ sel=-1; update(); return; }
      if (adj(sel,i)){
        fbSet('w3fb', false, L({es:'Los vértices '+w3names[sel]+' y '+w3names[i]+' son vecinos: ese trazo sería un lado de la figura, no una diagonal.',
                                en:'Vertices '+w3names[sel]+' and '+w3names[i]+' are neighbours: that stroke would be a side of the figure, not a diagonal.'}));
        sel=-1; update(); return;
      }
      var k=key(sel,i);
      if (drawn[k]) { delete drawn[k]; } else { drawn[k]=true; }
      sel=-1; update();
    }
    function check(){
      if (done || busy) return;
      var c=count();
      if (c===target){
        done=true; sel=-1; update();
        fbSet('w3fb', true, L({es:'🎉 Están todas: '+target+' diagonales. De cada uno de los '+n+' vértices salen '+(n-3)+', y como cada trazo se cuenta desde sus dos extremos, el total es '+n+' × '+(n-3)+' ÷ 2 = '+target+'.',
                               en:'🎉 They are all there: '+target+' diagonals. From each of the '+n+' vertices there come out '+(n-3)+', and since every stroke gets counted from both ends, the total is '+n+' × '+(n-3)+' ÷ 2 = '+target+'.'}));
        return;
      }
      tries++;
      if (tries>=3){
        var i,j;
        for (i=0;i<n;i++) for (j=i+1;j<n;j++) if (!adj(i,j)) drawn[key(i,j)]=true;
        done=true; sel=-1; update();
        fbSet('w3fb', true, L({es:'Así queda la figura completa. De cada uno de los '+n+' vértices salen '+(n-3)+' diagonales, y al contar vértice por vértice cada trazo aparece dos veces: '+n+' × '+(n-3)+' ÷ 2 = '+target+'.',
                               en:'This is the complete figure. From each of the '+n+' vertices there come out '+(n-3)+' diagonals, and counting vertex by vertex each stroke shows up twice: '+n+' × '+(n-3)+' ÷ 2 = '+target+'.'}));
        return;
      }
      var faltan=-1, v;
      for (v=0;v<n;v++) if (fromVertex(v) < n-3){ faltan=v; break; }
      if (faltan>=0){
        fbSet('w3fb', false, L({es:'Todavía no. Del vértice '+w3names[faltan]+' puede salir alguna diagonal más: revísalo y vuelve a comprobar.',
                                en:'Not yet. Vertex '+w3names[faltan]+' can still send out another diagonal: check it and try again.'}));
      } else {
        fbSet('w3fb', false, L({es:'Todavía no. Recorre los vértices uno por uno y asegúrate de que ninguno se quedó con trazos de menos.',
                                en:'Not yet. Go through the vertices one by one and make sure none of them was left short of strokes.'}));
      }
    }
    var cv0=document.getElementById('w3cv');
    if (cv0){
      cv0.addEventListener('click', function(ev){
        var r=cv0.getBoundingClientRect(), x=ev.clientX-r.left, y=ev.clientY-r.top, i, best=-1, bd=1e9;
        for (i=0;i<VP.length;i++){
          var d=Math.sqrt((VP[i][0]-x)*(VP[i][0]-x)+(VP[i][1]-y)*(VP[i][1]-y));
          if (d<bd){ bd=d; best=i; }
        }
        if (best>=0 && bd<=26) tap(best);
      });
    }
    var cl=document.getElementById('w3clr');
    if (cl) cl.addEventListener('click', function(){ if(done) return; drawn={}; sel=-1; update(); });
    var cb=document.getElementById('w3chk'); if(cb) cb.addEventListener('click', check);
    setTimeout(update, 90);
    window.addEventListener('resize', function(){ if(document.getElementById('w3cv')===myCv) draw(); });
  })();

  /* ── P5 ── */
  var p5v = pk([0,1,2]);
  var p5q, p5exp, p5corr, p5opts, p5title, p5hint;
  if (p5v===0){
    var n5 = pk([9,10,11,12]);
    var d5 = n5*(n5-3)/2;
    p5corr = d5;
    p5opts = optN(d5, [n5-3, n5*(n5-3), n5*(n5-1)/2], '');
    p5title = L({es:'Todas las diagonales', en:'Every diagonal'});
    p5q = L({es:'Se quiere trazar en un polígono de '+n5+' lados cada una de las diagonales posibles, sin repetir ninguna. ¿Cuántos trazos se hacen en total?',
             en:'In a polygon with '+n5+' sides every possible diagonal is to be drawn, with no repeats. How many strokes are made in total?'});
    p5exp = L({es:'De cada vértice salen '+n5+' − 3 = '+(n5-3)+' diagonales, y hay '+n5+' vértices: '+n5+' × '+(n5-3)+' = '+(n5*(n5-3))+'. Esa cuenta toma cada trazo dos veces, una desde cada extremo, así que el total real es '+(n5*(n5-3))+' ÷ 2 = '+d5,
               en:'From each vertex there come out '+n5+' − 3 = '+(n5-3)+' diagonals, and there are '+n5+' vertices: '+n5+' × '+(n5-3)+' = '+(n5*(n5-3))+'. That count takes every stroke twice, once from each end, so the real total is '+(n5*(n5-3))+' ÷ 2 = '+d5});
    p5hint = L({es:'Cuenta cuántas diagonales salen de un solo vértice, multiplica por todos los vértices y piensa cuántas veces quedó contado cada trazo.',
                en:'Count how many diagonals come out of a single vertex, multiply by all the vertices and think how many times each stroke ended up counted.'});
  } else if (p5v===1){
    var n5b = pk([11,13,14,15,16]);
    p5corr = n5b-3;
    p5opts = optN(n5b-3, [n5b-2, n5b-1, n5b*(n5b-3)/2], '');
    p5title = L({es:'Desde una sola esquina', en:'From a single corner'});
    p5q = L({es:'En un polígono de '+n5b+' lados se elige un vértice y desde ahí se trazan todas las diagonales que salen de él. ¿Cuántas son?',
             en:'In a polygon with '+n5b+' sides one vertex is chosen and every diagonal coming out of it is drawn. How many are there?'});
    p5exp = L({es:'Ese vértice podría unirse con los otros '+(n5b-1)+' vértices, pero dos de esas uniones son sus lados, porque llegan a sus vecinos, y consigo mismo no se une. Quedan '+n5b+' − 3 = '+(n5b-3),
               en:'That vertex could join the other '+(n5b-1)+' vertices, but two of those joins are its sides, since they reach its neighbours, and it does not join itself. What is left is '+n5b+' − 3 = '+(n5b-3)});
    p5hint = L({es:'Piensa con cuántos vértices podría unirse ese punto y descarta los que darían lados en lugar de diagonales.',
                en:'Think how many vertices that point could join and rule out the ones that would give sides instead of diagonals.'});
  } else {
    var reg5 = pk([{n:6,d:9},{n:7,d:14},{n:8,d:20},{n:9,d:27},{n:10,d:35}]);
    p5corr = reg5.n;
    p5opts = optN(reg5.n, [reg5.n+2, reg5.n-2, reg5.n+4], '');
    p5title = L({es:'Al revés, desde las diagonales', en:'The other way round, from the diagonals'});
    p5q = L({es:'Un polígono admite '+reg5.d+' diagonales distintas en total. ¿Cuántos lados tiene?',
             en:'A polygon admits '+reg5.d+' different diagonals in total. How many sides does it have?'});
    p5exp = L({es:'Como cada diagonal se cuenta desde sus dos extremos, las '+reg5.d+' diagonales representan '+reg5.d+' × 2 = '+(2*reg5.d)+' salidas repartidas entre los vértices. De cada vértice salen tres menos que el número de lados, y el único caso que da '+(2*reg5.d)+' salidas es el de n = '+reg5.n,
               en:'Since each diagonal is counted from both ends, the '+reg5.d+' diagonals stand for '+reg5.d+' × 2 = '+(2*reg5.d)+' departures shared among the vertices. From each vertex there come out three fewer than the number of sides, and the only case giving '+(2*reg5.d)+' departures is n = '+reg5.n});
    p5hint = L({es:'Recuerda que la cuenta vértice por vértice toma cada diagonal dos veces, y prueba con figuras de pocos lados hasta dar con la que encaja.',
                en:'Remember the vertex by vertex count takes each diagonal twice, and try figures with few sides until you hit the one that fits.'});
  }
  addProb({
    title: p5title, q: p5q, hint: p5hint, exp: p5exp,
    correct: String(p5corr), options: p5opts, showWork: true
  });

  /* ── P6 ── */
  var NAMEQ = {
    rect: {es:'El rectángulo', en:'The rectangle'},
    romb: {es:'El rombo', en:'The rhombus'},
    cuad: {es:'El cuadrado', en:'The square'},
    trap: {es:'El trapecio isósceles', en:'The isosceles trapezoid'},
    para: {es:'El paralelogramo sin ángulos rectos', en:'The parallelogram with no right angles'}
  };
  var p6v = pk([0,1,2]);
  var p6q, p6exp, p6corr, p6opts, p6title;
  if (p6v===0){
    p6corr = L(NAMEQ.rect);
    p6opts = optT(p6corr, [L(NAMEQ.cuad), L(NAMEQ.romb), L(NAMEQ.trap)]);
    p6title = L({es:'Reconoce la figura', en:'Identify the figure'});
    p6q = L({es:'En cierto cuadrilátero las dos diagonales miden lo mismo y se cortan justo en su punto medio, pero el cruce no forma ángulo recto. ¿De qué figura se trata?',
             en:'In a certain quadrilateral the two diagonals are equal in length and cut each other exactly at their midpoint, but the crossing does not form a right angle. Which figure is it?'});
    p6exp = L({es:'Que se corten en su punto medio descarta al trapecio isósceles, cuyas diagonales son iguales pero no se parten a la mitad. Que sean iguales descarta al rombo. Y que el cruce no sea recto descarta al cuadrado. La figura es el rectángulo.',
               en:'The fact that they cut at their midpoint rules out the isosceles trapezoid, whose diagonals are equal but do not halve each other. Being equal rules out the rhombus. And the crossing not being right rules out the square. The figure is the rectangle.'});
  } else if (p6v===1){
    p6corr = L(NAMEQ.romb);
    p6opts = optT(p6corr, [L(NAMEQ.cuad), L(NAMEQ.rect), L(NAMEQ.trap)]);
    p6title = L({es:'Reconoce la figura', en:'Identify the figure'});
    p6q = L({es:'En cierto cuadrilátero las dos diagonales se cortan en su punto medio formando ángulo recto, y una de ellas es más larga que la otra. ¿De qué figura se trata?',
             en:'In a certain quadrilateral the two diagonals cut each other at their midpoint forming a right angle, and one of them is longer than the other. Which figure is it?'});
    p6exp = L({es:'El cruce en ángulo recto descarta al rectángulo y al trapecio isósceles. Que una diagonal sea más larga que la otra descarta al cuadrado, donde las dos miden lo mismo. Queda el rombo.',
               en:'The right angle crossing rules out the rectangle and the isosceles trapezoid. One diagonal being longer than the other rules out the square, where both are equal. The rhombus is what remains.'});
  } else {
    p6corr = L(NAMEQ.trap);
    p6opts = optT(p6corr, [L(NAMEQ.rect), L(NAMEQ.romb), L(NAMEQ.para)]);
    p6title = L({es:'Reconoce la figura', en:'Identify the figure'});
    p6q = L({es:'En cierto cuadrilátero las dos diagonales miden lo mismo, pero al cruzarse ninguna queda partida en dos mitades iguales. ¿De qué figura se trata?',
             en:'In a certain quadrilateral the two diagonals are equal in length, but when they cross neither one is split into two equal halves. Which figure is it?'});
    p6exp = L({es:'En el rectángulo y en cualquier paralelogramo el cruce parte a las dos diagonales por la mitad, así que ambos quedan descartados. En el rombo, además, las diagonales no miden lo mismo. La única figura que tiene diagonales iguales sin cortarse a la mitad es el trapecio isósceles.',
               en:'In the rectangle and in any parallelogram the crossing halves both diagonals, so both are ruled out. In the rhombus, on top of that, the diagonals are not equal. The only figure with equal diagonals that do not halve each other is the isosceles trapezoid.'});
  }
  addProb({
    title: p6title, q: p6q,
    hint: L({es:'Ve descartando figuras una por una: primero por el tamaño de las diagonales, después por dónde se cruzan y al final por el ángulo del cruce.',
             en:'Rule the figures out one by one: first by the length of the diagonals, then by where they cross and finally by the angle of the crossing.'}),
    exp: p6exp, correct: p6corr, options: p6opts, showWork: false
  });

  /* ══════════════════════════════════════════════════════════════════
     SECCIÓN 4 - Construir a escala
     ══════════════════════════════════════════════════════════════════ */
  sec(L({es:'Concepto 4', en:'Concept 4'}),
      L({es:'La misma figura, de otro tamaño', en:'The same figure, at another size'}),
    '<p>'+L({es:'Un terreno de cuarenta metros no cabe en una hoja, pero su forma sí. Dibujar a escala consiste en reducir todas las longitudes con un mismo factor, ni uno más ni uno menos, y dejar los ángulos exactamente como estaban. Por eso una escala se anuncia con dos números: cuando se dice que un centímetro del dibujo representa cinco metros, cada medida real se reparte entre cinco para saber cuánto ocupa en el papel, y cada medida del papel se multiplica por cinco para volver al terreno.',
             en:'A forty metre plot does not fit on a sheet of paper, but its shape does. Drawing to scale means shrinking every length by one and the same factor, not one more and not one less, and leaving the angles exactly as they were. That is why a scale is announced with two numbers: when one centimetre of the drawing stands for five metres, every real measurement is shared out among five to know how much room it takes on paper, and every paper measurement is multiplied by five to get back to the plot.'})+'</p>'+
    '<p>'+L({es:'Los ángulos son el detalle que más se olvida: no se reducen ni se agrandan. Un ángulo de sesenta grados sigue midiendo sesenta grados en el dibujo, porque un ángulo no es una longitud sino una abertura, y la abertura entre dos lados no cambia al acortarlos. Las longitudes sí obedecen al factor, y también lo obedece el perímetro, que es una suma de longitudes. Gracias a eso, todo lo aprendido sobre ángulos, lados y diagonales se puede verificar en el dibujo pequeño y dar por válido en la figura grande.',
             en:'The angles are the detail most often forgotten: they do not shrink and do not grow. A sixty degree angle still measures sixty degrees in the drawing, because an angle is not a length but an opening, and the opening between two sides does not change when they are shortened. Lengths do obey the factor, and so does the perimeter, which is a sum of lengths. Thanks to that, everything learnt about angles, sides and diagonals can be checked on the small drawing and taken as valid on the big figure.'})+'</p>'+
    '<div class="rules-grid">'+
      '<div class="rcard"><div class="rname">'+L({es:'Los ángulos',en:'The angles'})+'</div><div class="rform">'+L({es:'no cambian',en:'do not change'})+'</div><div class="rnote">'+L({es:'La abertura es la misma en los dos tamaños.',en:'The opening is the same at both sizes.'})+'</div></div>'+
      '<div class="rcard"><div class="rname">'+L({es:'Cada lado',en:'Each side'})+'</div><div class="rform">'+L({es:'× el mismo factor',en:'× the same factor'})+'</div><div class="rnote">'+L({es:'Todos se reducen por igual, sin excepción.',en:'All shrink alike, with no exceptions.'})+'</div></div>'+
      '<div class="rcard"><div class="rname">'+L({es:'Del terreno al papel',en:'From plot to paper'})+'</div><div class="rform">'+L({es:'real ÷ factor',en:'real ÷ factor'})+'</div><div class="rnote">'+L({es:'Así se busca la medida del dibujo.',en:'That is how the drawing measurement is found.'})+'</div></div>'+
      '<div class="rcard"><div class="rname">'+L({es:'El perímetro',en:'The perimeter'})+'</div><div class="rform">'+L({es:'× el mismo factor',en:'× the same factor'})+'</div><div class="rnote">'+L({es:'Es una suma de lados, y sigue su suerte.',en:'It is a sum of sides, and follows their fate.'})+'</div></div>'+
    '</div>'+
    '<div class="callout"><p>'+L({es:'Elegir la escala es parte del trabajo de dibujar. Una escala que reduce poco deja un dibujo enorme que se sale de la hoja; una que reduce demasiado deja un dibujo diminuto donde ya no se distingue nada. La buena es la que aprovecha la hoja completa sin desbordarla.',
                                  en:'Choosing the scale is part of the job of drawing. A scale that shrinks too little leaves a huge drawing that runs off the sheet; one that shrinks too much leaves a tiny drawing where nothing can be told apart. The good one is the one that uses the whole sheet without spilling over it.'})+'</p></div>');

  /* ── W4: ajusta la escala (3 rondas) ── */
  var W4D = [2,3,4,5,6,8];
  var w4R = [];
  (function(){
    var ds = shuffle(W4D.slice(), rng);
    for (var i=0;i<3;i++){
      var D=ds[i], T=pk([8,10,12]), Ht=pk([5,6,7]);
      w4R.push({ D:D, T:T, Ht:Ht, Wr:T*D, Hr:Ht*D });
    }
  })();
  widget('scale',
    '<div class="stag">'+L({es:'Elige la escala',en:'Choose the scale'})+'</div>'+
    '<h2>'+L({es:'Haz que el terreno quepa en la hoja',en:'Make the plot fit on the sheet'})+'</h2>'+
    '<p>'+L({es:'El rectángulo verde es tu dibujo y el contorno dorado punteado es el hueco exacto que debe ocupar en la hoja. Cambia cuántos metros representa cada centímetro y verás encoger o crecer el dibujo al instante. Los ángulos de las esquinas no se inmutan: siguen siendo rectos en los dos tamaños.',
             en:'The green rectangle is your drawing and the dashed golden outline is the exact space it has to take up on the sheet. Change how many metres each centimetre stands for and you will see the drawing shrink or grow at once. The corner angles do not flinch: they stay right angles at both sizes.'})+'</p>'+
    '<div class="gcrd">'+
      '<div style="font-size:.85rem;color:var(--text2);margin-bottom:.7rem" id="w4goal"></div>'+
      '<div class="cvwrap"><canvas id="w4cv" style="display:block;width:100%;height:214px"></canvas></div>'+
      '<div class="cg" style="margin-top:.9rem"><label>'+L({es:'Cada centímetro representa: ',en:'Each centimetre stands for: '})+'<span class="cval" id="w4vv">-</span></label>'+
        '<input type="range" id="w4v" min="0" max="5" value="0" step="1"></div>'+
      '<div style="display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.6rem">'+
        '<button id="w4chk" style="'+BTN+'">'+L({es:'Comprobar',en:'Check'})+'</button>'+
      '</div>'+
      '<div class="metrics" style="margin-top:.9rem">'+
        '<div class="metric"><div class="mlbl">'+L({es:'Frente real',en:'Real front'})+'</div><div class="mnum cs" id="w4wr">-</div></div>'+
        '<div class="metric"><div class="mlbl">'+L({es:'Frente dibujado',en:'Drawn front'})+'</div><div class="mnum ps" id="w4wd">-</div></div>'+
        '<div class="metric"><div class="mlbl">'+L({es:'Fondo dibujado',en:'Drawn depth'})+'</div><div class="mnum ts" id="w4hd">-</div></div>'+
      '</div>'+
      '<div class="mcfb" id="w4fb"></div>'+
    '</div>');

  (function(){
    var round=0, tries=0, done=false, busy=false;
    var myCv = document.getElementById('w4cv');
    function R(){ return w4R[Math.min(round,2)]; }
    function D(){ var e=document.getElementById('w4v'); return W4D[e ? parseInt(e.value,10) : 0]; }
    function draw(){
      var cv=document.getElementById('w4cv'); if(!cv || cv!==myCv) return;
      var dpr=window.devicePixelRatio||1, W=cv.clientWidth||320, H=214;
      cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
      var g=cv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,W,H);
      var r=R(), d=D();
      var pageW=20, pageH=13;
      var s=Math.min((W-26)/pageW, (H-26)/pageH);
      var ox=(W-pageW*s)/2, oy=(H-pageH*s)/2;
      g.fillStyle=cssv('--surface2'); g.fillRect(ox,oy,pageW*s,pageH*s);
      var mx=ox+2.2*s, my=oy+2.6*s;
      var dw=r.Wr/d, dh=r.Hr/d;
      g.save(); g.beginPath(); g.rect(0,0,W,H); g.clip();
      g.globalAlpha=0.8; g.fillStyle=cssv('--green-bg'); g.fillRect(mx,my,dw*s,dh*s); g.globalAlpha=1;
      g.strokeStyle=cssv('--green'); g.lineWidth=2.4; g.strokeRect(mx,my,dw*s,dh*s);
      g.restore();
      g.strokeStyle=cssv('--border'); g.lineWidth=1.6; g.strokeRect(ox,oy,pageW*s,pageH*s);
      g.strokeStyle=cssv('--gold'); g.lineWidth=2; g.setLineDash([6,4]);
      g.strokeRect(mx,my,r.T*s,r.Ht*s); g.setLineDash([]);
      g.fillStyle=cssv('--text3'); g.font='500 9px "IBM Plex Sans", sans-serif';
      g.textAlign='right'; g.textBaseline='bottom';
      g.fillText(L({es:'la hoja',en:'the sheet'}), ox+pageW*s-4, oy+pageH*s-3);
      g.fillStyle=cssv('--gold'); g.font='700 10px "IBM Plex Sans", sans-serif';
      g.textAlign='left'; g.textBaseline='bottom';
      g.fillText(r.T+' cm', mx, my-4);
      g.fillStyle=cssv('--green-dark'); g.font='700 10px "IBM Plex Sans", sans-serif';
      g.textAlign='left'; g.textBaseline='top';
      g.fillText('90°', mx+5, my+4);
      g.fillText(L({es:'tu dibujo: ',en:'your drawing: '})+(Math.round(dw*10)/10)+' cm', mx+5, my+18);
    }
    function update(){
      var r=R(), d=D(), e;
      e=document.getElementById('w4vv'); if(e) e.textContent = d+' '+L({es:'m',en:'m'});
      e=document.getElementById('w4wr'); if(e) e.textContent = r.Wr+' m';
      e=document.getElementById('w4wd');
      if (e){ e.textContent = (Math.round(r.Wr/d*10)/10)+' cm'; e.style.color = (r.Wr/d===r.T ? 'var(--ok)' : 'var(--gold)'); }
      e=document.getElementById('w4hd'); if(e) e.textContent = (Math.round(r.Hr/d*10)/10)+' cm';
      e=document.getElementById('w4goal');
      if (e) e.innerHTML=L({es:'Ronda '+(round+1)+' de 3: el terreno mide <strong>'+r.Wr+' m</strong> de frente y <strong>'+r.Hr+' m</strong> de fondo, y en la hoja el frente debe quedar de <strong>'+r.T+' cm</strong>.',
                            en:'Round '+(round+1)+' of 3: the plot measures <strong>'+r.Wr+' m</strong> across the front and <strong>'+r.Hr+' m</strong> deep, and on the sheet the front has to come out at <strong>'+r.T+' cm</strong>.'});
      draw();
    }
    function nextRound(){
      round++; busy=false;
      if (round>=3){ done=true; return; }
      tries=0;
      var sl=document.getElementById('w4v'); if(sl) sl.value='0';
      update();
    }
    function check(){
      if (done || busy) return;
      var r=R(), d=D(), dw=r.Wr/d;
      if (d===r.D){
        fbSet('w4fb', true, L({es:'🎉 Encaja. Con cada centímetro representando '+d+' m, el frente de '+r.Wr+' m se dibuja con '+r.Wr+' ÷ '+d+' = '+r.T+' cm, y el fondo queda de '+(r.Hr/d)+' cm.'+(round===2?' Las tres rondas quedaron listas.':' Va la siguiente ronda.'),
                               en:'🎉 It fits. With each centimetre standing for '+d+' m, the '+r.Wr+' m front is drawn with '+r.Wr+' ÷ '+d+' = '+r.T+' cm, and the depth comes out at '+(r.Hr/d)+' cm.'+(round===2?' All three rounds are done.':' On to the next round.')}));
        draw(); busy=true; setTimeout(nextRound, 80); return;
      }
      tries++;
      if (tries>=3){
        var sl=document.getElementById('w4v'); if(sl) sl.value=String(W4D.indexOf(r.D));
        update();
        fbSet('w4fb', true, L({es:'La escala buena era la de '+r.D+' m por centímetro, porque el frente real de '+r.Wr+' m repartido entre '+r.D+' deja justo '+r.T+' cm de dibujo.',
                               en:'The right scale was the one of '+r.D+' m per centimetre, because the real front of '+r.Wr+' m shared out among '+r.D+' leaves exactly '+r.T+' cm of drawing.'}));
        busy=true; setTimeout(nextRound, 80); return;
      }
      fbSet('w4fb', false, (dw>r.T)
        ? L({es:'Tu dibujo sale de '+(Math.round(dw*10)/10)+' cm de frente y desborda el contorno de '+r.T+' cm. Estás reduciendo poco: haz que cada centímetro represente más metros.',
             en:'Your drawing comes out '+(Math.round(dw*10)/10)+' cm across and spills past the '+r.T+' cm outline. You are shrinking too little: make each centimetre stand for more metres.'})
        : L({es:'Tu dibujo se queda en '+(Math.round(dw*10)/10)+' cm de frente y no llena el contorno de '+r.T+' cm. Estás reduciendo de más: haz que cada centímetro represente menos metros.',
             en:'Your drawing stays at '+(Math.round(dw*10)/10)+' cm across and does not fill the '+r.T+' cm outline. You are shrinking too much: make each centimetre stand for fewer metres.'}));
    }
    var sl0=document.getElementById('w4v'); if(sl0) sl0.addEventListener('input', update);
    var cb=document.getElementById('w4chk'); if(cb) cb.addEventListener('click', check);
    setTimeout(update, 90);
    window.addEventListener('resize', function(){ if(document.getElementById('w4cv')===myCv) draw(); });
  })();

  /* ── P7 ── */
  var p7v = pk([0,1,2]);
  var p7q, p7exp, p7corr, p7opts, p7title, p7hint;
  if (p7v===0){
    var m7 = pk([4,6,8]), c7 = pk([6,9,12]);
    var real7 = m7*c7;
    p7corr = real7+' m';
    p7opts = optN(real7, [m7+c7, real7/2, real7-m7], ' m');
    p7title = L({es:'Del plano al terreno', en:'From the plan to the plot'});
    p7q = L({es:'En un plano hecho a escala, cada centímetro representa '+m7+' metros del terreno. Uno de los lados de la cancha aparece dibujado con '+c7+' centímetros de largo. ¿Cuánto mide ese lado en la realidad?',
             en:'In a plan drawn to scale, each centimetre stands for '+m7+' metres of the plot. One of the sides of the court appears drawn '+c7+' centimetres long. How long is that side in reality?'});
    p7exp = L({es:'Cada centímetro del plano vale '+m7+' metros, y el lado ocupa '+c7+' centímetros, así que hay que repetir esa cantidad '+c7+' veces: '+c7+' × '+m7+' = '+real7+' metros.',
               en:'Each centimetre of the plan is worth '+m7+' metres, and the side takes up '+c7+' centimetres, so that amount has to be repeated '+c7+' times: '+c7+' × '+m7+' = '+real7+' metres.'});
    p7hint = L({es:'Pregúntate cuántos metros aporta cada centímetro dibujado y cuántos centímetros hay que recorrer sobre el plano.',
                en:'Ask yourself how many metres each drawn centimetre contributes and how many centimetres have to be covered on the plan.'});
  } else if (p7v===1){
    var m7b = pk([3,4,5,6]), c7b = pk([7,8,11]);
    var real7b = m7b*c7b;
    p7corr = c7b+' cm';
    p7opts = optN(c7b, [real7b, real7b-m7b, c7b*2], ' cm');
    p7title = L({es:'Del terreno al papel', en:'From the plot to the paper'});
    p7q = L({es:'Una barda mide '+real7b+' metros de largo y se va a dibujar a escala, de manera que cada centímetro del dibujo represente '+m7b+' metros. ¿Con cuántos centímetros quedará dibujada la barda?',
             en:'A wall is '+real7b+' metres long and is going to be drawn to scale, so that each centimetre of the drawing stands for '+m7b+' metres. How many centimetres long will the wall be drawn?'});
    p7exp = L({es:'Hay que ver cuántos tramos de '+m7b+' metros caben en la barda, porque cada uno de esos tramos ocupará un centímetro en el papel: '+real7b+' ÷ '+m7b+' = '+c7b+' centímetros.',
               en:'You have to see how many stretches of '+m7b+' metres fit in the wall, because each of those stretches will take one centimetre on paper: '+real7b+' ÷ '+m7b+' = '+c7b+' centimetres.'});
    p7hint = L({es:'Averigua cuántos tramos del tamaño que representa un centímetro caben en la medida real.',
                en:'Work out how many stretches of the size one centimetre stands for fit into the real measurement.'});
  } else {
    var m7c = pk([2,3,4]);
    var tri7 = pk([[12,16,20],[9,12,15],[15,20,25],[18,24,30]]);
    var per7 = (tri7[0]+tri7[1]+tri7[2])*m7c;
    var dib7 = per7/m7c;
    p7corr = dib7+' cm';
    p7opts = optN(dib7, [per7, Math.round(dib7/2), dib7+m7c], ' cm');
    p7title = L({es:'El contorno del dibujo', en:'The outline of the drawing'});
    p7q = L({es:'Un terreno triangular tiene lados de '+(tri7[0]*m7c)+' metros, '+(tri7[1]*m7c)+' metros y '+(tri7[2]*m7c)+' metros. Se dibuja a escala usando un centímetro por cada '+m7c+' metros. ¿Cuánto mide el contorno completo del dibujo?',
             en:'A triangular plot has sides of '+(tri7[0]*m7c)+' metres, '+(tri7[1]*m7c)+' metres and '+(tri7[2]*m7c)+' metres. It is drawn to scale using one centimetre for every '+m7c+' metres. How long is the complete outline of the drawing?'});
    p7exp = L({es:'Los tres lados del terreno suman '+(tri7[0]*m7c)+' + '+(tri7[1]*m7c)+' + '+(tri7[2]*m7c)+' = '+per7+' metros de contorno. Ese contorno se reduce con la misma escala que los lados: '+per7+' ÷ '+m7c+' = '+dib7+' centímetros.',
               en:'The three sides of the plot add up to '+(tri7[0]*m7c)+' + '+(tri7[1]*m7c)+' + '+(tri7[2]*m7c)+' = '+per7+' metres of outline. That outline shrinks with the same scale as the sides: '+per7+' ÷ '+m7c+' = '+dib7+' centimetres.'});
    p7hint = L({es:'Reúne primero el contorno completo del terreno y después aplícale la misma reducción que se aplica a cada lado.',
                en:'First gather the complete outline of the plot and then apply to it the same shrinking applied to each side.'});
  }
  addProb({
    title: p7title, q: p7q, hint: p7hint, exp: p7exp,
    correct: p7corr, options: p7opts, showWork: true
  });

  /* ── P8 ── */
  var p8v = pk([0,1]);
  var p8q, p8exp, p8corr, p8opts, p8title, p8hint;
  if (p8v===0){
    var f8 = pk([2,3,4]), a8 = pk([48,54,63,72]);
    p8corr = dg(a8);
    p8opts = optN(a8, [a8*f8, Math.round(a8/f8), 180-a8], '°');
    p8title = L({es:'El ángulo de la copia', en:'The angle of the copy'});
    p8q = L({es:'Un triángulo se copia a escala de modo que cada lado de la copia resulta '+f8+' veces más largo que el del original. En el original uno de los ángulos mide '+dg(a8)+'. ¿Cuánto mide el ángulo correspondiente en la copia?',
             en:'A triangle is copied to scale so that each side of the copy comes out '+f8+' times longer than the original one. In the original one of the angles measures '+dg(a8)+'. How much does the matching angle measure in the copy?'});
    p8exp = L({es:'Al alargar los dos lados que forman el ángulo, la abertura entre ellos no se mueve: solo se hacen más largos los brazos. La copia conserva el ángulo tal cual, de '+dg(a8)+'.',
               en:'Stretching the two sides that form the angle leaves the opening between them untouched: only the arms get longer. The copy keeps the angle just as it was, at '+dg(a8)+'.'});
    p8hint = L({es:'Piensa qué es lo que mide un ángulo, y si eso depende de qué tan largos sean los lados que lo forman.',
                en:'Think about what an angle actually measures, and whether that depends on how long the sides forming it are.'});
  } else {
    var f8b = pk([2,3,4]), per8 = pk([24,30,36,42]);
    var res8 = per8*f8b;
    p8corr = res8+' cm';
    p8opts = optN(res8, [per8+f8b, per8/2, per8*f8b*f8b], ' cm');
    p8title = L({es:'El perímetro de la copia', en:'The perimeter of the copy'});
    p8q = L({es:'Un cuadrilátero de '+per8+' centímetros de perímetro se copia a escala, de modo que cada uno de sus lados queda '+f8b+' veces más largo. ¿Cuál es el perímetro de la copia?',
             en:'A quadrilateral with a perimeter of '+per8+' centimetres is copied to scale, so that each of its sides comes out '+f8b+' times longer. What is the perimeter of the copy?'});
    p8exp = L({es:'El perímetro es la suma de los cuatro lados, y si cada lado se hace '+f8b+' veces más largo, la suma completa se hace '+f8b+' veces más larga también: '+per8+' × '+f8b+' = '+res8+' centímetros.',
               en:'The perimeter is the sum of the four sides, and if every side becomes '+f8b+' times longer, the whole sum becomes '+f8b+' times longer as well: '+per8+' × '+f8b+' = '+res8+' centimetres.'});
    p8hint = L({es:'El contorno no es más que la suma de los lados, así que fíjate en qué le pasa a esa suma cuando cada sumando crece igual.',
                en:'The outline is nothing but the sum of the sides, so look at what happens to that sum when every term grows the same way.'});
  }
  addProb({
    title: p8title, q: p8q, hint: p8hint, exp: p8exp,
    correct: p8corr, options: p8opts, showWork: false
  });

  /* ══════════════════════════════════════════════════════════════════
     CIERRE
     ══════════════════════════════════════════════════════════════════ */
  sec(L({es:'Cierre', en:'Closing'}),
      L({es:'Las piezas trabajando juntas', en:'The pieces working together'}),
    '<p>'+L({es:'Las dos últimas situaciones no traen ningún dato de más: en cada una hay que pasar por dos o tres etapas antes de llegar al número que se pide. Conviene anotar los resultados intermedios, porque el dato que sale de la primera etapa es justamente el que hace falta para la siguiente.',
             en:'The last two situations bring no spare information: in each one you have to go through two or three stages before reaching the number being asked for. It is worth writing down the intermediate results, because the value coming out of the first stage is exactly the one needed for the next.'})+'</p>');

  /* ── P9 ── */
  var P9POOL = [{n:5,a:108,d:5},{n:6,a:120,d:9},{n:8,a:135,d:20},{n:9,a:140,d:27},{n:10,a:144,d:35},{n:12,a:150,d:54}];
  var r9 = pk(P9POOL);
  var p9v = pk([0,1]);
  var p9q, p9exp, p9corr, p9opts, p9title, p9hint;
  if (p9v===0){
    p9corr = String(r9.d);
    p9opts = optN(r9.d, [r9.n-3, r9.n*(r9.n-3), r9.n+2], '');
    p9title = L({es:'Del ángulo a las diagonales', en:'From the angle to the diagonals'});
    p9q = L({es:'Cada ángulo interior de un polígono regular mide '+dg(r9.a)+'. ¿Cuántas diagonales distintas se pueden trazar en esa figura?',
             en:'Each interior angle of a regular polygon measures '+dg(r9.a)+'. How many different diagonals can be drawn in that figure?'});
    p9exp = L({es:'Junto a cada ángulo interior queda un exterior que lo completa hasta el ángulo llano: 180 − '+r9.a+' = '+dg(180-r9.a)+'. Los exteriores dan una vuelta completa, así que hay '+360+' ÷ '+(180-r9.a)+' = '+r9.n+' vértices. De cada uno salen '+(r9.n-3)+' diagonales y cada trazo se cuenta dos veces: '+r9.n+' × '+(r9.n-3)+' ÷ 2 = '+r9.d,
               en:'Next to each interior angle sits an exterior one completing it up to the straight angle: 180 − '+r9.a+' = '+dg(180-r9.a)+'. The exterior angles make one full turn, so there are '+360+' ÷ '+(180-r9.a)+' = '+r9.n+' vertices. From each one there come out '+(r9.n-3)+' diagonals and every stroke is counted twice: '+r9.n+' × '+(r9.n-3)+' ÷ 2 = '+r9.d});
    p9hint = L({es:'Necesitas primero el número de vértices: el ángulo exterior que acompaña a cada interior te lleva a él. Con ese número ya puedes contar los trazos.',
                en:'You need the number of vertices first: the exterior angle accompanying each interior one takes you there. With that number you can already count the strokes.'});
  } else {
    p9corr = dg((r9.n-2)*180);
    p9opts = optN((r9.n-2)*180, [r9.n*180, (r9.n-1)*180, 360], '°');
    p9title = L({es:'De las diagonales a la suma', en:'From the diagonals to the sum'});
    p9q = L({es:'En cierto polígono se pueden trazar '+r9.d+' diagonales distintas en total. ¿Cuánto suman los ángulos interiores de esa figura?',
             en:'In a certain polygon '+r9.d+' different diagonals can be drawn in total. How much do the interior angles of that figure add up to?'});
    p9exp = L({es:'Cada diagonal se cuenta desde sus dos extremos, así que las '+r9.d+' diagonales equivalen a '+r9.d+' × 2 = '+(2*r9.d)+' salidas, repartidas entre vértices que mandan tres menos que el número de lados: eso ocurre con '+r9.n+' lados. Esa figura se parte en '+(r9.n-2)+' triángulos, y '+(r9.n-2)+' × 180 = '+dg((r9.n-2)*180),
               en:'Each diagonal is counted from both ends, so the '+r9.d+' diagonals amount to '+r9.d+' × 2 = '+(2*r9.d)+' departures, shared among vertices that send out three fewer than the number of sides: that happens with '+r9.n+' sides. That figure splits into '+(r9.n-2)+' triangles, and '+(r9.n-2)+' × 180 = '+dg((r9.n-2)*180)});
    p9hint = L({es:'Busca primero cuántos lados tiene la figura a partir del número de trazos, y después parte esa figura en triángulos.',
                en:'First find how many sides the figure has from the number of strokes, and then split that figure into triangles.'});
  }
  addProb({
    title: p9title, q: p9q, hint: p9hint, exp: p9exp,
    correct: p9corr, options: p9opts, showWork: true
  });

  /* ── P10 ── */
  var p10v = pk([0,1]);
  var p10q, p10exp, p10corr, p10opts, p10title, p10hint;
  if (p10v===0){
    var e10 = pk([3,4,5,6]), fr10 = pk([9,12,15]), fo10 = pk([6,8,10]);
    var wr10 = fr10*e10, hr10 = fo10*e10, per10 = 2*(fr10+fo10);
    p10corr = per10+' cm';
    p10opts = optN(per10, [fr10+fo10, per10*e10, 2*(fr10+hr10)], ' cm');
    p10title = L({es:'El contorno en la hoja', en:'The outline on the sheet'});
    p10q = L({es:'Un terreno rectangular mide '+wr10+' metros de frente y '+hr10+' metros de fondo. Se dibuja en una hoja usando un centímetro por cada '+e10+' metros. ¿Cuánto mide el contorno completo del dibujo?',
             en:'A rectangular plot measures '+wr10+' metres across the front and '+hr10+' metres deep. It is drawn on a sheet using one centimetre for every '+e10+' metres. How long is the complete outline of the drawing?'});
    p10exp = L({es:'En el dibujo el frente ocupa '+wr10+' ÷ '+e10+' = '+fr10+' centímetros y el fondo '+hr10+' ÷ '+e10+' = '+fo10+' centímetros. Un rectángulo tiene los lados opuestos iguales, así que su contorno es 2 × ('+fr10+' + '+fo10+') = '+per10+' centímetros.',
                en:'In the drawing the front takes '+wr10+' ÷ '+e10+' = '+fr10+' centimetres and the depth '+hr10+' ÷ '+e10+' = '+fo10+' centimetres. A rectangle has equal opposite sides, so its outline is 2 × ('+fr10+' + '+fo10+') = '+per10+' centimetres.'});
    p10hint = L({es:'Lleva primero cada medida del terreno al papel y después recuerda cuántos lados tiene un rectángulo y cómo se repiten.',
                 en:'First bring each measurement of the plot onto the paper and then remember how many sides a rectangle has and how they repeat.'});
  } else {
    var e10b = pk([3,4,7]), lado10 = pk([4,6,7]);
    var nlados = pk([5,6,8]);
    var perreal = nlados*lado10*e10b;
    p10corr = perreal+' m';
    p10opts = optN(perreal, [nlados*lado10, lado10*e10b, perreal*2], ' m');
    p10title = L({es:'Del dibujo al terreno', en:'From the drawing to the plot'});
    p10q = L({es:'En un dibujo hecho a escala aparece un polígono regular de '+nlados+' lados y cada lado del dibujo mide '+lado10+' centímetros. Cada centímetro del dibujo representa '+e10b+' metros. ¿Cuánto mide el contorno completo del terreno real?',
              en:'A drawing made to scale shows a regular polygon with '+nlados+' sides and each side of the drawing measures '+lado10+' centimetres. Each centimetre of the drawing stands for '+e10b+' metres. How long is the complete outline of the real plot?'});
    p10exp = L({es:'En un polígono regular los '+nlados+' lados miden lo mismo, así que el contorno del dibujo es '+nlados+' × '+lado10+' = '+(nlados*lado10)+' centímetros. Cada centímetro vale '+e10b+' metros, de modo que el contorno real es '+(nlados*lado10)+' × '+e10b+' = '+perreal+' metros.',
                en:'In a regular polygon the '+nlados+' sides are equal, so the outline of the drawing is '+nlados+' × '+lado10+' = '+(nlados*lado10)+' centimetres. Each centimetre is worth '+e10b+' metres, so the real outline is '+(nlados*lado10)+' × '+e10b+' = '+perreal+' metres.'});
    p10hint = L({es:'Reúne primero todo el contorno sobre el papel aprovechando que los lados son iguales, y hasta el final regresa a la medida del terreno.',
                 en:'First gather the whole outline on the paper, taking advantage of the sides being equal, and only at the end go back to the real measurement.'});
  }
  addProb({
    title: p10title, q: p10q, hint: p10hint, exp: p10exp,
    correct: p10corr, options: p10opts, showWork: true
  });
}
</script>
