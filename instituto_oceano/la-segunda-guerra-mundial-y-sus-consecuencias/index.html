    { q:{ es:'Después de la crisis económica iniciada en 1929, millones de personas quedaron sin empleo en varios países europeos y, en esos mismos años, crecieron con rapidez los partidos que prometían orden, trabajo y grandeza nacional. ¿Qué relación hay entre esos dos hechos?',
          en:'After the economic crisis that began in 1929, millions of people were left jobless in several European countries and, in those same years, parties promising order, work and national greatness grew quickly. What is the relation between those two facts?' },
      o:{ es:['La ruina económica debilitó la confianza en los gobiernos existentes y volvió atractivas las promesas de quienes ofrecían soluciones rápidas y mano dura.',
              'La crisis obligó a repartir la tierra entre los desempleados, y ese reparto hizo desaparecer a los partidos autoritarios.',
              'El desempleo impidió toda actividad política, de modo que ningún partido pudo crecer durante esos años.',
              'Los partidos autoritarios solo prosperaron en los países que no habían sufrido la crisis económica.'],
          en:['Economic ruin weakened trust in the existing governments and made attractive the promises of those offering quick solutions and a firm hand.',
              'The crisis forced land to be shared out among the unemployed, and that made authoritarian parties disappear.',
              'Unemployment prevented all political activity, so no party could grow during those years.',
              'Authoritarian parties prospered only in the countries that had not suffered the economic crisis.'] }, c:0,
      h:{ es:'Pregúntate a quién escucha una población que ha perdido su empleo y no ve respuesta en quienes gobiernan.',
          en:'Ask who a population listens to when it has lost its jobs and sees no answer from those in government.' },
      e:{ es:'La crisis no creó por sí sola los regímenes totalitarios, pero les abrió la puerta: ofrecieron empleo, orden y orgullo nacional a quienes lo habían perdido todo, y a cambio pidieron obediencia y la renuncia a las libertades políticas.',
          en:'The crisis did not create the totalitarian regimes by itself, but it opened the door to them: they offered work, order and national pride to those who had lost everything, and in exchange asked for obedience and the surrender of political freedoms.' } },
    { q:{ es:'Un rasgo compartido por los regímenes totalitarios de los años treinta fue la eliminación de los partidos de oposición y el control estatal de los periódicos y la radio. ¿Por qué ese control resultaba tan importante para sostener esos gobiernos?',
          en:'A feature shared by the totalitarian regimes of the 1930s was the elimination of opposition parties and state control of newspapers and radio. Why was that control so important for keeping those governments in place?' },
      o:{ es:['Sin voces que informaran de otra manera, la población recibía una sola versión de los hechos y resultaba mucho más difícil organizar una crítica.',
              'Porque los periódicos y la radio eran la principal fuente de ingresos del Estado en aquellos años.',
              'Porque las leyes internacionales de la época obligaban a cada gobierno a administrar sus propios medios.',
              'Porque de ese modo se garantizaba que las elecciones libres se celebraran con información verificada.'],
          en:['With no voices reporting otherwise, the population received a single version of events and organizing criticism became far harder.',
              'Because newspapers and radio were the main source of state income in those years.',
              'Because the international laws of the time required every government to run its own media.',
              'Because that guaranteed that free elections were held with verified information.'] }, c:0,
      h:{ es:'Piensa en qué necesita una persona para darse cuenta de que su gobierno se equivoca, y en qué pasa si esa información no existe.',
          en:'Think about what a person needs in order to realize their government is wrong, and what happens if that information does not exist.' },
      e:{ es:'Un régimen totalitario no solo manda: quiere que nadie pueda imaginar otra opción. Suprimir partidos y controlar la información deja a la población sin manera de comparar, y esa falta de comparación es lo que mantiene el poder sin necesidad de elecciones.',
          en:'A totalitarian regime does not only rule: it wants nobody to be able to imagine another option. Abolishing parties and controlling information leaves the population with no way to compare, and that lack of comparison is what keeps power in place without elections.' } }
  ];
  var v2 = pickVariant(p2v, rng);
  addProblem({ title:L({ es:'Cuando la crisis abre la puerta', en:'When crisis opens the door' }), questionText:L(v2.q), options:L(v2.o), correct:v2.c, hint:L(v2.h), explanation:L(v2.e) }, rng);
}

/* ══════════════════ BLOQUE 2 ══════════════════ */
function blkDos(rng){
  addSection(L({ es:'Concepto 2', en:'Concept 2' }), L({ es:'De una guerra europea a una guerra mundial', en:'From a European war to a world war' }),
    L({ es:'<p>El 1 de septiembre de 1939, el ejército alemán invadió Polonia. Dos días después, el Reino Unido y Francia declararon la guerra: la garantía dada a Polonia se cumplió y el apaciguamiento terminó. Durante casi dos años, Alemania avanzó con una táctica de ataque rápido que combinaba aviación, tanques y radio para romper las líneas enemigas antes de que pudieran reorganizarse. Polonia, Dinamarca, Noruega, los Países Bajos, Bélgica y Francia cayeron en pocos meses. El Reino Unido resistió en su isla los bombardeos de 1940.</p>' +
            '<p>Dos decisiones tomadas en 1941 cambiaron la escala del conflicto. En junio, Alemania invadió la Unión Soviética rompiendo el pacto de no agresión que ambas habían firmado: se abrió un frente inmenso en el este que devoró la mayor parte de las fuerzas alemanas. En diciembre, el ataque japonés a la base estadounidense de Pearl Harbor llevó a Estados Unidos a entrar en la guerra. Desde ese momento, los combates de Europa, el norte de África, Asia y el océano Pacífico formaban un mismo conflicto, y el bando aliado reunía a las tres potencias que terminarían decidiendo su desenlace.</p>' +
            '<p>A partir de 1942 la marea cambió: Stalingrado en el este, El Alamein en el norte de África y Midway en el Pacífico marcaron el límite del avance del bando contrario. El desembarco en Normandía abrió en 1944 un frente en el oeste, y la rendición alemana llegó en mayo de 1945.</p>',
        en:'<p>On 1 September 1939 the German army invaded Poland. Two days later the United Kingdom and France declared war: the guarantee given to Poland was honoured and appeasement was over. For almost two years Germany advanced with a tactic of rapid attack combining aircraft, tanks and radio to break enemy lines before they could reorganize. Poland, Denmark, Norway, the Netherlands, Belgium and France fell within months. The United Kingdom held out on its island through the bombing of 1940.</p>' +
            '<p>Two decisions taken in 1941 changed the scale of the conflict. In June, Germany invaded the Soviet Union breaking the non aggression pact both had signed: an immense front opened in the east that swallowed most of the German forces. In December, the Japanese attack on the American base at Pearl Harbor brought the United States into the war. From that moment the fighting in Europe, North Africa, Asia and the Pacific Ocean formed a single conflict, and the Allied side gathered the three powers that would end up deciding its outcome.</p>' +
            '<p>From 1942 the tide turned: Stalingrad in the east, El Alamein in North Africa and Midway in the Pacific marked the limit of the opposing advance. The Normandy landing opened a front in the west in 1944, and the German surrender came in May 1945.</p>' }) +
    '<div class="callout"><p><strong>' + L({ es:'Fíjate: ', en:'Notice: ' }) + '</strong>' + L({ es:'lo que convirtió una guerra europea en una guerra mundial no fue el número de países, sino que los frentes de tres continentes pasaron a depender unos de otros.',
                                                                                                  en:'what turned a European war into a world war was not the number of countries, but that the fronts of three continents came to depend on one another.' }) + '</p></div>' +
    '<div class="mzone" id="mzB"></div>');
  mB_render();

  /* ── graded 3 ── */
  var p3v = [
    { q:{ es:'En junio de 1941, Alemania invadió la Unión Soviética pese al pacto de no agresión que ambos gobiernos habían firmado menos de dos años antes. ¿Qué consecuencia tuvo esa decisión para el desarrollo de la guerra?',
          en:'In June 1941, Germany invaded the Soviet Union despite the non aggression pact both governments had signed less than two years earlier. What consequence did that decision have for the course of the war?' },
      o:{ es:['Abrió un frente enorme en el este que consumió la mayor parte de las fuerzas alemanas y colocó a la Unión Soviética del lado aliado.',
              'Permitió a Alemania concentrar todas sus tropas en el oeste y forzar la rendición del Reino Unido.',
              'Provocó que el Reino Unido y Estados Unidos rompieran relaciones con la Unión Soviética.',
              'Puso fin a los combates en Europa oriental mediante un nuevo acuerdo entre los dos gobiernos.'],
          en:['It opened an enormous front in the east that consumed most of the German forces and placed the Soviet Union on the Allied side.',
              'It let Germany concentrate all its troops in the west and force the surrender of the United Kingdom.',
              'It caused the United Kingdom and the United States to break relations with the Soviet Union.',
              'It ended the fighting in eastern Europe through a new agreement between the two governments.'] }, c:0,
      h:{ es:'Piensa en cuántos soldados y recursos exige mantener un frente que se extiende por miles de kilómetros, y en de qué lado quedó la Unión Soviética después del ataque.',
          en:'Think about how many soldiers and resources it takes to hold a front stretching thousands of kilometres, and which side the Soviet Union ended up on after the attack.' },
      e:{ es:'La invasión buscaba una victoria rápida antes del invierno y terminó siendo el frente más costoso de toda la guerra. Además empujó a la Unión Soviética a aliarse con el Reino Unido y, poco después, con Estados Unidos.',
          en:'The invasion sought a quick victory before winter and became the costliest front of the whole war. It also pushed the Soviet Union into alliance with the United Kingdom and, soon after, with the United States.' } },
    { q:{ es:'En diciembre de 1941, tras el ataque a la base de Pearl Harbor, Estados Unidos entró en la guerra. ¿Por qué ese hecho suele señalarse como el momento en que el conflicto se volvió verdaderamente mundial?',
          en:'In December 1941, after the attack on the Pearl Harbor base, the United States entered the war. Why is that event usually pointed to as the moment when the conflict became truly worldwide?' },
      o:{ es:['Porque enlazó los frentes de Europa, el norte de África y el Pacífico en un solo conflicto sostenido por las mayores potencias industriales del planeta.',
              'Porque fue la primera vez que un país americano declaró la guerra a otro país americano.',
              'Porque a partir de entonces los combates se trasladaron por completo al continente americano.',
              'Porque obligó a Alemania y a Japón a firmar por primera vez una alianza entre ambas.'],
          en:['Because it linked the fronts of Europe, North Africa and the Pacific into a single conflict sustained by the greatest industrial powers on the planet.',
              'Because it was the first time an American country declared war on another American country.',
              'Because from then on the fighting moved entirely to the American continent.',
              'Because it forced Germany and Japan to sign an alliance between them for the first time.'] }, c:0,
      h:{ es:'Fíjate en cuántos escenarios de combate quedaron conectados a partir de esa entrada y quién los sostenía.',
          en:'Look at how many theatres of fighting became connected after that entry and who sustained them.' },
      e:{ es:'Antes de diciembre de 1941 había guerras conectadas pero distintas. Con la entrada estadounidense, los recursos, las decisiones y las campañas de Europa, África y Asia pasaron a formar un solo tablero, y la producción industrial de un continente entero se volcó en él.',
          en:'Before December 1941 there were connected but separate wars. With the American entry, the resources, decisions and campaigns of Europe, Africa and Asia became a single board, and the industrial output of a whole continent was poured into it.' } }
  ];
  var v3 = pickVariant(p3v, rng);
  addProblem({ title:L({ es:'El año que lo cambió todo', en:'The year that changed everything' }), questionText:L(v3.q), options:L(v3.o), correct:v3.c, hint:L(v3.h), explanation:L(v3.e) }, rng);

  /* ── graded 4 ── */
  var p4v = [
    { q:{ es:'¿Cuál de estas secuencias respeta el orden en que ocurrieron los hechos de la guerra?',
          en:'Which of these sequences respects the order in which the events of the war took place?' },
      o:{ es:['Invasión de Polonia, invasión de la Unión Soviética, desembarco en Normandía, rendición alemana.',
              'Invasión de la Unión Soviética, invasión de Polonia, rendición alemana, desembarco en Normandía.',
              'Desembarco en Normandía, invasión de Polonia, invasión de la Unión Soviética, rendición alemana.',
              'Invasión de Polonia, desembarco en Normandía, invasión de la Unión Soviética, rendición alemana.'],
          en:['Invasion of Poland, invasion of the Soviet Union, Normandy landing, German surrender.',
              'Invasion of the Soviet Union, invasion of Poland, German surrender, Normandy landing.',
              'Normandy landing, invasion of Poland, invasion of the Soviet Union, German surrender.',
              'Invasion of Poland, Normandy landing, invasion of the Soviet Union, German surrender.'] }, c:0,
      h:{ es:'Apóyate en la lógica del proceso: primero el estallido, después la expansión del conflicto y al final el avance aliado que lleva a la rendición.',
          en:'Lean on the logic of the process: first the outbreak, then the spread of the conflict and finally the Allied advance that leads to the surrender.' },
      e:{ es:'La guerra comienza con la invasión de Polonia en 1939, se amplía con la invasión de la Unión Soviética en 1941, gira con el desembarco aliado en Normandía en 1944 y se cierra en Europa con la rendición alemana en mayo de 1945.',
          en:'The war begins with the invasion of Poland in 1939, widens with the invasion of the Soviet Union in 1941, turns with the Allied landing in Normandy in 1944 and closes in Europe with the German surrender in May 1945.' } },
    { q:{ es:'Un compañero escribe en su cuaderno: la Segunda Guerra Mundial empezó cuando Estados Unidos entró en el conflicto tras el ataque a Pearl Harbor; antes de eso solo hubo tensiones diplomáticas. ¿Cuál es el principal error de esa afirmación?',
          en:'A classmate writes in his notebook: the Second World War began when the United States entered the conflict after the attack on Pearl Harbor; before that there were only diplomatic tensions. What is the main error in that statement?' },
      o:{ es:['Confunde la entrada de una potencia con el inicio de la guerra, que ya se libraba desde 1939 en Europa y llevaba años en Asia.',
              'Se equivoca al afirmar que Estados Unidos entró en la guerra, porque en realidad se mantuvo neutral hasta el final.',
              'Supone que el ataque a Pearl Harbor ocurrió en Europa cuando sucedió en el océano Pacífico.',
              'Sostiene que la guerra terminó en 1941 y no en el año 1945.'],
          en:['It confuses the entry of one power with the start of the war, which had been fought in Europe since 1939 and for years in Asia.',
              'It is wrong to say the United States entered the war, because it actually stayed neutral to the end.',
              'It assumes the attack on Pearl Harbor happened in Europe when it took place in the Pacific Ocean.',
              'It claims the war ended in 1941 and not in the year 1945.'] }, c:0,
      h:{ es:'Revisa si el dato sobre Pearl Harbor es falso o si el problema está en el papel que se le da dentro de la explicación.',
          en:'Check whether the fact about Pearl Harbor is false or whether the problem is the role it is given inside the explanation.' },
      e:{ es:'El dato es correcto, pero el lugar que ocupa no lo es: cuando Estados Unidos entró, Polonia y Francia ya habían sido ocupadas y el frente del este llevaba medio año abierto. Confundir la ampliación de una guerra con su inicio deja fuera dos años de combates.',
          en:'The fact is right, but the place it is given is not: when the United States entered, Poland and France had already been occupied and the eastern front had been open for half a year. Confusing the widening of a war with its start leaves out two years of fighting.' } }
  ];
  var v4 = pickVariant(p4v, rng);
  addProblem({ title:L({ es:'Poner los hechos en su lugar', en:'Putting the facts in place' }), questionText:L(v4.q), options:L(v4.o), correct:v4.c, hint:L(v4.h), explanation:L(v4.e) }, rng);
}
/* ═══ FIN BLOQUE 3 ═══ */

/* ══════════════════ BLOQUE 3 ══════════════════ */
function blkTres(rng){
  addSection(L({ es:'Concepto 3', en:'Concept 3' }), L({ es:'Una guerra sin frontera entre el frente y la casa', en:'A war with no border between the front and the home' }),
    L({ es:'<p>Esta guerra llevó al extremo una idea que ya se había ensayado entre 1914 y 1918: la guerra total. Los gobiernos organizaron la economía completa alrededor del conflicto, racionaron alimentos y combustible, censuraron la prensa, difundieron propaganda y llamaron a trabajar en la industria a mujeres, a personas mayores y a trabajadores de las colonias. La ciencia se puso al servicio de la guerra y produjo radares, submarinos, cohetes y, al final, el arma nuclear.</p>' +
            '<p>Ese cambio tuvo un costo que recayó sobre la población civil. La aviación permitió bombardear ciudades enteras a cientos de kilómetros del frente, de modo que por primera vez murieron más civiles que soldados. Millones de familias abandonaron sus hogares y quedaron como refugiadas. En los territorios ocupados, las poblaciones vivieron bajo administraciones militares, trabajos forzados y represión.</p>' +
            '<p>El hecho más grave de este periodo fue la persecución organizada desde el Estado. El régimen nazi aprobó leyes que quitaron derechos y ciudadanía a la población judía, la aisló del resto de la sociedad y después llevó adelante su exterminio sistemático, junto al de otros grupos como la población gitana, las personas con discapacidad y los opositores políticos. A ese crimen se le conoce como Holocausto o Shoá, y se estima que costó la vida a seis millones de personas judías. Estudiarlo con seriedad y respeto es una manera de sostener el compromiso de que algo así no vuelva a ocurrir.</p>',
        en:'<p>This war took to the extreme an idea already tried between 1914 and 1918: total war. Governments organized the entire economy around the conflict, rationed food and fuel, censored the press, spread propaganda and called women, older people and workers from the colonies into industry. Science was put at the service of the war and produced radar, submarines, rockets and, at the end, the nuclear weapon.</p>' +
            '<p>That change had a cost that fell on civilians. Aircraft made it possible to bomb whole cities hundreds of kilometres from the front, so for the first time more civilians died than soldiers. Millions of families left their homes and became refugees. In the occupied territories, populations lived under military administration, forced labour and repression.</p>' +
            '<p>The gravest fact of this period was persecution organized by the state. The Nazi regime passed laws that stripped rights and citizenship from the Jewish population, isolated it from the rest of society and then carried out its systematic extermination, together with that of other groups such as Roma people, people with disabilities and political opponents. That crime is known as the Holocaust or Shoah, and it is estimated to have cost the lives of six million Jewish people. Studying it seriously and respectfully is a way of upholding the commitment that something like it should never happen again.</p>' }) +
    '<table class="dtable"><tr><th>' + L({ es:'Rasgo', en:'Feature' }) + '</th><th>' + L({ es:'Guerra anterior, 1914 a 1918', en:'Earlier war, 1914 to 1918' }) + '</th><th>' + L({ es:'Guerra de 1939 a 1945', en:'War of 1939 to 1945' }) + '</th></tr>' +
      '<tr><td>' + L({ es:'Movimiento del frente', en:'Movement of the front' }) + '</td><td>' + L({ es:'Trincheras casi fijas durante años', en:'Almost fixed trenches for years' }) + '</td><td>' + L({ es:'Avances rápidos con tanques y aviación', en:'Rapid advances with tanks and aircraft' }) + '</td></tr>' +
      '<tr><td>' + L({ es:'Quién sufre las pérdidas', en:'Who bears the losses' }) + '</td><td>' + L({ es:'Sobre todo soldados', en:'Mostly soldiers' }) + '</td><td>' + L({ es:'Más civiles que soldados', en:'More civilians than soldiers' }) + '</td></tr>' +
      '<tr><td>' + L({ es:'Alcance geográfico', en:'Geographic reach' }) + '</td><td>' + L({ es:'Centrada en Europa', en:'Centred on Europe' }) + '</td><td>' + L({ es:'Europa, África, Asia y el Pacífico', en:'Europe, Africa, Asia and the Pacific' }) + '</td></tr>' +
    '</table>' +
    '<div class="mzone" id="mzC"></div>');
  mC_render();

  /* ── graded 5 ── */
  var p5v = [
    { q:{ es:'En esta guerra murieron más personas civiles que soldados, algo que no había sucedido en el conflicto de 1914 a 1918. ¿Qué explica mejor ese cambio?',
          en:'In this war more civilians died than soldiers, something that had not happened in the conflict of 1914 to 1918. What best explains that change?' },
      o:{ es:['Los bombardeos aéreos sobre ciudades, las ocupaciones militares y las políticas de persecución llevaron la guerra al interior de la vida civil.',
              'Los ejércitos redujeron su tamaño y dejaron los combates en manos de voluntarios sin entrenamiento.',
              'Las armas empleadas contra los soldados resultaron menos peligrosas que las del conflicto anterior.',
              'Los gobiernos trasladaron a toda su población a las zonas de combate para protegerla mejor.'],
          en:['Air bombing of cities, military occupations and policies of persecution carried the war into civilian life.',
              'Armies shrank in size and left the fighting to untrained volunteers.',
              'The weapons used against soldiers proved less dangerous than those of the earlier conflict.',
              'Governments moved their whole population into the combat zones to protect them better.'] }, c:0,
      h:{ es:'Pregúntate qué armas y qué medidas alcanzaron a personas que nunca estuvieron en un campo de batalla.',
          en:'Ask which weapons and which measures reached people who were never on a battlefield.' },
      e:{ es:'La aviación de largo alcance permitió atacar ciudades lejos del frente, las ocupaciones sometieron a poblaciones enteras y la persecución organizada desde el Estado tuvo como blanco a civiles. La distancia entre el frente y la casa dejó de existir.',
          en:'Long range aircraft made it possible to attack cities far from the front, occupations subjected whole populations and state organized persecution targeted civilians. The distance between the front and the home ceased to exist.' } },
    { q:{ es:'Los gobiernos en guerra racionaron los alimentos, censuraron los periódicos, transformaron fábricas de automóviles en fábricas de aviones y llamaron a millones de mujeres a ocupar puestos en la industria. ¿Qué idea de la guerra explica ese conjunto de medidas?',
          en:'Governments at war rationed food, censored newspapers, turned car factories into aircraft factories and called millions of women into industrial jobs. What idea of war explains that set of measures?' },
      o:{ es:['La guerra total: el país entero, y no solo su ejército, queda organizado en función del conflicto.',
              'La guerra defensiva: cada país se limita a proteger sus fronteras sin modificar su vida interna.',
              'La guerra relámpago: el ataque debe ser tan rápido que la economía no alcance a intervenir.',
              'La guerra de trincheras: los ejércitos se entierran y esperan el desgaste del adversario.'],
          en:['Total war: the whole country, and not only its army, is organized around the conflict.',
              'Defensive war: each country limits itself to protecting its borders without changing its internal life.',
              'Lightning war: the attack must be so fast that the economy has no time to intervene.',
              'Trench war: armies dig in and wait for the opponent to wear down.'] }, c:0,
      h:{ es:'Fíjate en cuánta parte de la vida cotidiana quedó decidida en función de lo que ocurría en el frente.',
          en:'Look at how much of daily life came to be decided by what was happening at the front.' },
      e:{ es:'Ninguna de esas medidas es militar en sentido estricto: tocan la comida, la información y el trabajo. Cuando un Estado pone la vida entera de su sociedad al servicio del conflicto, hablamos de guerra total.',
          en:'None of those measures is military in the strict sense: they touch food, information and work. When a state puts the entire life of its society at the service of the conflict, we speak of total war.' } }
  ];
  var v5 = pickVariant(p5v, rng);
  addProblem({ title:L({ es:'La guerra entra en casa', en:'The war moves in' }), questionText:L(v5.q), options:L(v5.o), correct:v5.c, hint:L(v5.h), explanation:L(v5.e) }, rng);

  /* ── graded 6 ── */
  var p6v = [
    { q:{ es:'Durante el régimen nazi se aprobaron leyes que privaron de ciudadanía y de derechos a la población judía antes de que comenzara su persecución masiva. ¿Qué enseña ese proceso sobre la relación entre las leyes de un Estado y los derechos de las personas?',
          en:'Under the Nazi regime, laws were passed stripping the Jewish population of citizenship and rights before their mass persecution began. What does that process teach about the relation between the laws of a state and the rights of people?' },
      o:{ es:['Que un gobierno puede usar sus propias leyes para negar la dignidad de un grupo, y por eso existen normas internacionales que protegen a las personas por encima de cada Estado.',
              'Que las leyes de un país garantizan por sí solas los derechos de todos sus habitantes en cualquier circunstancia.',
              'Que la persecución fue obra de decisiones aisladas, sin relación con las leyes ni con las autoridades del país.',
              'Que los derechos humanos ya estaban protegidos por acuerdos internacionales obligatorios desde los años treinta.'],
          en:['That a government can use its own laws to deny the dignity of a group, and that is why international rules exist to protect people above each state.',
              'That the laws of a country by themselves guarantee the rights of all its inhabitants in any circumstance.',
              'That the persecution came from isolated decisions, unrelated to the laws or the authorities of the country.',
              'That human rights were already protected by binding international agreements since the 1930s.'] }, c:0,
      h:{ es:'Pregúntate qué protege a una persona cuando la ley de su propio país deja de protegerla.',
          en:'Ask what protects a person when the law of their own country stops protecting them.' },
      e:{ es:'La persecución no comenzó en secreto: comenzó en el diario oficial, con normas que quitaron derechos por escrito. Por eso, al terminar la guerra se buscó un marco de derechos válido para todas las personas y por encima de cualquier gobierno, que se expresó en la Declaración Universal de 1948.',
          en:'The persecution did not begin in secret: it began in the official gazette, with rules that removed rights in writing. That is why, when the war ended, a framework of rights valid for all people and above any government was sought, expressed in the Universal Declaration of 1948.' } },
    { q:{ es:'Los países aliados produjeron durante la guerra muchos más aviones, tanques y barcos que sus adversarios, y pudieron reponer con rapidez lo que perdían. ¿Por qué ese dato ayuda a explicar el resultado del conflicto?',
          en:'The Allied countries produced far more aircraft, tanks and ships during the war than their opponents, and were able to replace their losses quickly. Why does that fact help explain the outcome of the conflict?' },
      o:{ es:['Porque en una guerra sostenida durante años la capacidad de reponer material y abastecer a los ejércitos pesa tanto como el resultado de cada batalla.',
              'Porque los ejércitos con más material nunca llegan a combatir y ganan sin entrar en batalla.',
              'Porque la cantidad de armas producidas determina por sí sola la calidad de las decisiones militares.',
              'Porque la producción industrial reemplazó por completo la necesidad de soldados en el frente.'],
          en:['Because in a war sustained over years the ability to replace equipment and supply the armies weighs as much as the outcome of each battle.',
              'Because armies with more equipment never have to fight and win without entering battle.',
              'Because the number of weapons produced determines by itself the quality of military decisions.',
              'Because industrial production entirely replaced the need for soldiers at the front.'] }, c:0,
      h:{ es:'Piensa en qué ocurre después de una batalla ganada si un bando puede reponer sus pérdidas y el otro no.',
          en:'Think about what happens after a battle is won if one side can replace its losses and the other cannot.' },
      e:{ es:'Ninguna batalla decidió sola la guerra. Lo decisivo fue la capacidad de sostener el esfuerzo año tras año: quien podía reemplazar aviones, tanques, combustible y alimentos resistía las derrotas, y quien no podía se iba quedando sin margen.',
          en:'No single battle decided the war. What was decisive was the ability to sustain the effort year after year: whoever could replace aircraft, tanks, fuel and food survived defeats, and whoever could not gradually ran out of room.' } }
  ];
  var v6 = pickVariant(p6v, rng);
  addProblem({ title:L({ es:'Lo que sostiene una guerra larga', en:'What sustains a long war' }), questionText:L(v6.q), options:L(v6.o), correct:v6.c, hint:L(v6.h), explanation:L(v6.e) }, rng);
}

/* ══════════════════ BLOQUE 4 ══════════════════ */
function blkCuatro(rng){
  addSection(L({ es:'Concepto 4', en:'Concept 4' }), L({ es:'Reglas nuevas para que no se repita', en:'New rules so it does not happen again' }),
    L({ es:'<p>El balance de 1945 es difícil de imaginar: alrededor de sesenta millones de personas muertas, ciudades enteras en ruinas, millones de refugiados cruzando fronteras y una economía europea que dependía de créditos externos para volver a funcionar. Con ese balance sobre la mesa, los vencedores intentaron algo distinto a lo que habían hecho en 1919.</p>' +
            '<p>En 1945 se firmó en San Francisco la carta que creó la Organización de las Naciones Unidas. Su diseño corrigió las fallas del organismo anterior: reunió desde el inicio a todas las grandes potencias, incluida Estados Unidos, y creó un Consejo de Seguridad capaz de aprobar sanciones y autorizar el uso de la fuerza. En 1948, su asamblea proclamó la Declaración Universal de los Derechos Humanos, un texto que reconoce derechos a toda persona por el hecho de serlo, sin importar el país donde viva.</p>' +
            '<p>En paralelo, los juicios de Núremberg juzgaron a dirigentes del régimen nazi por crímenes de guerra y crímenes contra la humanidad. Su aportación fue un principio nuevo: obedecer órdenes o cumplir una ley nacional no exime de responsabilidad cuando lo que se hace es un crimen contra personas. Ese principio sostiene hoy buena parte del derecho internacional.</p>',
        en:'<p>The balance of 1945 is hard to picture: around sixty million people dead, whole cities in ruins, millions of refugees crossing borders and a European economy that depended on foreign credit to work again. With that balance on the table, the victors tried something different from what they had done in 1919.</p>' +
            '<p>In 1945 the charter creating the United Nations Organization was signed in San Francisco. Its design corrected the failures of the earlier body: it gathered all the great powers from the start, including the United States, and created a Security Council able to approve sanctions and authorize the use of force. In 1948 its assembly proclaimed the Universal Declaration of Human Rights, a text recognizing rights for every person simply for being one, whatever country they live in.</p>' +
            '<p>Alongside this, the Nuremberg trials judged leaders of the Nazi regime for war crimes and crimes against humanity. Their contribution was a new principle: obeying orders or following a national law does not remove responsibility when what is done is a crime against people. That principle underpins much of international law today.</p>' }) +
    '<div class="mzone" id="mzD"></div>');
  mD_render();

  /* ── graded 7 ── */
  var p7v = [
    { q:{ es:'La ONU nació en 1945 con un Consejo de Seguridad capaz de aprobar sanciones y autorizar el uso de la fuerza, y con todas las grandes potencias sentadas en ella desde el primer día. ¿Qué problema del organismo anterior se quiso corregir con ese diseño?',
          en:'The UN was born in 1945 with a Security Council able to approve sanctions and authorize the use of force, and with every great power seated in it from day one. What problem of the earlier body was that design meant to correct?' },
      o:{ es:['Que sus resoluciones no podían hacerse cumplir y que varias potencias decisivas quedaban fuera de sus salas.',
              'Que dedicaba demasiado tiempo a discutir asuntos económicos en lugar de asuntos de salud pública.',
              'Que obligaba a todos sus miembros a mantener ejércitos del mismo tamaño y equipamiento.',
              'Que se reunía únicamente cuando ya había estallado un conflicto armado entre dos de sus miembros.'],
          en:['That its resolutions could not be enforced and that several decisive powers stayed outside its rooms.',
              'That it spent too much time discussing economic matters instead of public health.',
              'That it required every member to keep armies of the same size and equipment.',
              'That it met only once an armed conflict between two of its members had already broken out.'] }, c:0,
      h:{ es:'Recuerda qué podía hacer la Sociedad de Naciones cuando un Estado ignoraba sus decisiones, y quién nunca se sentó en ella.',
          en:'Recall what the League of Nations could do when a state ignored its decisions, and who never sat in it.' },
      e:{ es:'La Sociedad de Naciones solo podía recomendar, y nació sin Estados Unidos. Por eso no pudo frenar las agresiones de los años treinta. El nuevo organismo se construyó justamente sobre esos dos huecos: capacidad de sanción y presencia de las grandes potencias.',
          en:'The League of Nations could only recommend, and it was born without the United States. That is why it could not stop the aggressions of the 1930s. The new body was built precisely on those two gaps: power to sanction and the presence of the great powers.' } },
    { q:{ es:'En los juicios de Núremberg se juzgó a dirigentes por hechos que habían cometido siguiendo órdenes y amparados en leyes de su propio país. ¿Qué principio quedó establecido con esos juicios?',
          en:'At the Nuremberg trials, leaders were judged for acts committed following orders and covered by the laws of their own country. What principle was established by those trials?' },
      o:{ es:['Que existen crímenes que ninguna orden ni ley nacional puede justificar, y que sus responsables pueden ser juzgados ante la comunidad internacional.',
              'Que las personas juzgadas debían ser sancionadas por los tribunales de su propio país y no por otros.',
              'Que quien cumple una orden queda siempre libre de responsabilidad por lo que esa orden produzca.',
              'Que solo los jefes de Estado pueden ser juzgados por lo ocurrido durante una guerra.'],
          en:['That there are crimes no order and no national law can justify, and that those responsible can be tried before the international community.',
              'That the people judged had to be punished by the courts of their own country and not by others.',
              'That whoever follows an order is always free of responsibility for what that order produces.',
              'That only heads of state can be judged for what happened during a war.'] }, c:0,
      h:{ es:'Piensa en qué argumento presentaron los acusados y en por qué el tribunal no lo aceptó.',
          en:'Think about the argument the accused presented and why the court did not accept it.' },
      e:{ es:'La defensa habitual fue que se cumplían órdenes y leyes vigentes. El tribunal respondió que hay actos que ninguna autoridad puede volver legítimos. Ese principio abrió el camino a los tribunales internacionales que existen hoy.',
          en:'The usual defence was that orders and laws in force were being obeyed. The court answered that there are acts no authority can make legitimate. That principle opened the way to the international courts that exist today.' } }
  ];
  var v7 = pickVariant(p7v, rng);
  addProblem({ title:L({ es:'Aprender de la falla anterior', en:'Learning from the earlier failure' }), questionText:L(v7.q), options:L(v7.o), correct:v7.c, hint:L(v7.h), explanation:L(v7.e) }, rng);

  /* ── graded 8 ── */
  var p8v = [
    { q:{ es:'La Declaración Universal de los Derechos Humanos, proclamada en 1948, reconoce derechos a toda persona sin importar su país, su origen o su religión. ¿Qué experiencia reciente explica mejor que ese texto se aprobara justo en esos años?',
          en:'The Universal Declaration of Human Rights, proclaimed in 1948, recognizes rights for every person regardless of country, origin or religion. What recent experience best explains why that text was approved in exactly those years?' },
      o:{ es:['Que durante la guerra un Estado había usado sus propias leyes para perseguir y exterminar a grupos enteros de su población.',
              'Que los países vencedores necesitaban un documento para repartirse las colonias del bando derrotado.',
              'Que la mayoría de los países carecía de constitución escrita y debía adoptar una redactada en común.',
              'Que las potencias buscaban un texto que sustituyera a los tratados de paz firmados en 1919.'],
          en:['That during the war a state had used its own laws to persecute and exterminate entire groups of its population.',
              'That the victorious countries needed a document to share out the colonies of the defeated side.',
              'That most countries had no written constitution and had to adopt one drafted in common.',
              'That the powers wanted a text to replace the peace treaties signed in 1919.'] }, c:0,
      h:{ es:'Relaciona el contenido del documento con lo que acababa de ocurrir en Europa entre 1933 y 1945.',
          en:'Relate the content of the document to what had just happened in Europe between 1933 and 1945.' },
      e:{ es:'La declaración responde de manera directa a la experiencia del Holocausto y de las ocupaciones: si un Estado puede quitar derechos por ley, hace falta un piso de derechos que ningún Estado pueda tocar. Por eso el texto habla de la persona y no del ciudadano de tal país.',
          en:'The declaration answers directly to the experience of the Holocaust and of the occupations: if a state can remove rights by law, a floor of rights that no state can touch is needed. That is why the text speaks of the person and not of the citizen of a given country.' } },
    { q:{ es:'Al terminar la guerra, Alemania y su capital quedaron divididas en zonas administradas por los ejércitos vencedores. ¿Qué proceso mayor anunciaba esa división?',
          en:'When the war ended, Germany and its capital were divided into zones administered by the victorious armies. What larger process did that division announce?' },
      o:{ es:['El reparto de Europa en dos áreas de influencia enfrentadas, encabezadas por Estados Unidos y por la Unión Soviética.',
              'El regreso de las fronteras europeas al trazado que tenían antes de la Primera Guerra Mundial.',
              'La desaparición de Alemania como Estado y su reparto definitivo entre Francia y Polonia.',
              'La creación de un gobierno europeo único con capital en la ciudad de Berlín.'],
          en:['The division of Europe into two opposed areas of influence, led by the United States and by the Soviet Union.',
              'The return of European borders to the lines they had before the First World War.',
              'The disappearance of Germany as a state and its permanent partition between France and Poland.',
              'The creation of a single European government with its capital in the city of Berlin.'] }, c:0,
      h:{ es:'Fíjate en quiénes administraban esas zonas y en qué relación tenían entre sí una vez derrotado el enemigo común.',
          en:'Look at who administered those zones and what relation they had with one another once the common enemy was defeated.' },
      e:{ es:'Las zonas de ocupación reflejaban hasta dónde había llegado cada ejército. Cuando la alianza entre los vencedores se rompió, esas líneas administrativas se convirtieron en fronteras políticas y Alemania quedó dividida durante décadas.',
          en:'The occupation zones reflected how far each army had reached. When the alliance among the victors broke down, those administrative lines became political borders and Germany stayed divided for decades.' } }
  ];
  var v8 = pickVariant(p8v, rng);
  addProblem({ title:L({ es:'Derechos y fronteras después de 1945', en:'Rights and borders after 1945' }), questionText:L(v8.q), options:L(v8.o), correct:v8.c, hint:L(v8.h), explanation:L(v8.e) }, rng);
}

/* ══════════════════ BLOQUE 5 ══════════════════ */
function blkCinco(rng){
  addSection(L({ es:'Concepto 5', en:'Concept 5' }), L({ es:'El mundo que salió de la guerra', en:'The world that came out of the war' }),
    L({ es:'<p>Las consecuencias de esta guerra no caben en una sola lista, porque tocaron terrenos distintos a la vez. Hubo consecuencias humanas, con decenas de millones de muertos y millones de refugiados; territoriales, con fronteras redibujadas y Alemania partida en zonas; políticas, con el nacimiento de la ONU y el ascenso de dos superpotencias; y económicas, con Europa destruida y endeudada mientras Estados Unidos salía de la guerra con su industria intacta y crecida.</p>' +
            '<p>De esas consecuencias salió el mapa del resto del siglo. Estados Unidos y la Unión Soviética habían combatido juntos contra un enemigo común, pero defendían modelos opuestos: economía de mercado y democracia liberal frente a economía planificada y partido único. Terminado el enemigo común, cada uno buscó asegurar su zona de influencia, y el mundo se ordenó en dos bloques que compitieron durante más de cuarenta años sin enfrentarse de manera directa. A ese periodo se le llama Guerra Fría.</p>' +
            '<p>Fuera de Europa, la guerra debilitó a las potencias coloniales y fortaleció a los movimientos de independencia en Asia y en África: muchos pueblos que habían aportado soldados y recursos reclamaron el derecho a gobernarse a sí mismos. En pocas décadas, decenas de países nuevos entraron en la escena internacional.</p>',
        en:'<p>The consequences of this war do not fit in a single list, because they touched different areas at once. There were human consequences, with tens of millions dead and millions of refugees; territorial ones, with borders redrawn and Germany split into zones; political ones, with the birth of the UN and the rise of two superpowers; and economic ones, with Europe destroyed and in debt while the United States came out of the war with its industry intact and grown.</p>' +
            '<p>Out of those consequences came the map of the rest of the century. The United States and the Soviet Union had fought together against a common enemy, but they defended opposite models: market economy and liberal democracy against planned economy and single party rule. Once the common enemy was gone, each sought to secure its zone of influence, and the world arranged itself into two blocs that competed for more than forty years without facing each other directly. That period is called the Cold War.</p>' +
            '<p>Outside Europe, the war weakened the colonial powers and strengthened independence movements in Asia and Africa: many peoples who had contributed soldiers and resources claimed the right to govern themselves. Within a few decades, dozens of new countries entered the international scene.</p>' }) +
    '<div class="mzone" id="mzE"></div>');
  mE_render();

  /* ── graded 9 ── */
  var p9v = [
    { q:{ es:'Estados Unidos y la Unión Soviética combatieron en el mismo bando hasta 1945 y poco después se convirtieron en rivales que dividieron el mundo en dos bloques. ¿Qué explica mejor ese cambio de relación?',
          en:'The United States and the Soviet Union fought on the same side until 1945 and soon after became rivals who split the world into two blocs. What best explains that change of relation?' },
      o:{ es:['Los unía derrotar a un enemigo común, pero defendían modelos políticos y económicos opuestos y cada uno quiso asegurar su influencia sobre el mundo de posguerra.',
              'Ambos gobiernos firmaron un tratado que les prohibía mantener relaciones diplomáticas después de 1945.',
              'Sus ejércitos se enfrentaron directamente en una batalla decisiva pocos meses después de la rendición alemana.',
              'Los dos países perdieron su capacidad industrial durante la guerra y compitieron por los recursos que quedaban en Europa.'],
          en:['They were united by defeating a common enemy, but defended opposite political and economic models and each wanted to secure its influence over the postwar world.',
              'Both governments signed a treaty forbidding them from keeping diplomatic relations after 1945.',
              'Their armies clashed directly in a decisive battle a few months after the German surrender.',
              'Both countries lost their industrial capacity during the war and competed for the resources left in Europe.'] }, c:0,
      h:{ es:'Pregúntate qué mantenía unida esa alianza y qué quedaba en pie una vez desaparecido el motivo que la había creado.',
          en:'Ask what held that alliance together and what was left standing once the reason that created it had gone.' },
      e:{ es:'La alianza fue de circunstancia, no de proyecto. Derrotado el enemigo común, quedaron dos potencias con visiones incompatibles del orden social y con ejércitos desplegados en Europa. De esa desconfianza salió la división en bloques que llamamos Guerra Fría.',
          en:'The alliance was one of circumstance, not of shared project. With the common enemy defeated, two powers remained with incompatible visions of social order and with armies deployed in Europe. Out of that distrust came the division into blocs we call the Cold War.' } },
    { q:{ es:'Después de 1945, los movimientos de independencia en Asia y en África ganaron fuerza y en pocas décadas surgieron decenas de países nuevos. ¿Qué relación tiene ese proceso con la guerra que acababa de terminar?',
          en:'After 1945, independence movements in Asia and Africa gained strength and within a few decades dozens of new countries appeared. What relation does that process have with the war that had just ended?' },
      o:{ es:['Las potencias coloniales salieron debilitadas del conflicto y muchos pueblos que habían aportado soldados y recursos reclamaron el derecho a gobernarse a sí mismos.',
              'Las potencias coloniales decidieron por iniciativa propia entregar sus colonias antes de que terminara la guerra.',
              'La ONU prohibió expresamente en 1945 la existencia de cualquier colonia en el mundo.',
              'Los territorios coloniales se habían mantenido al margen del conflicto y por eso conservaron intactos sus ejércitos.'],
          en:['The colonial powers came out of the conflict weakened and many peoples who had contributed soldiers and resources claimed the right to govern themselves.',
              'The colonial powers decided on their own initiative to hand over their colonies before the war ended.',
              'The UN expressly banned the existence of any colony in the world in 1945.',
              'The colonial territories had stayed out of the conflict and therefore kept their armies intact.'] }, c:0,
      h:{ es:'Piensa en qué argumento podía usar una población que había peleado en nombre de la libertad de otros países.',
          en:'Think about the argument available to a population that had fought in the name of the freedom of other countries.' },
      e:{ es:'La guerra dejó a Francia, al Reino Unido y a otras potencias sin recursos para sostener imperios lejanos, y dio a los movimientos independentistas un argumento poderoso: quien había combatido por la libertad ajena reclamaba la propia. La descolonización se aceleró en las dos décadas siguientes.',
          en:'The war left France, the United Kingdom and other powers without the resources to hold distant empires, and gave independence movements a powerful argument: those who had fought for the freedom of others claimed their own. Decolonization sped up over the following two decades.' } }
  ];
  var v9 = pickVariant(p9v, rng);
  addProblem({ title:L({ es:'Dos bloques y muchos países nuevos', en:'Two blocs and many new countries' }), questionText:L(v9.q), options:L(v9.o), correct:v9.c, hint:L(v9.h), explanation:L(v9.e) }, rng);

  /* ══════════════════ CIERRE ══════════════════ */
  addSection(L({ es:'Cierre', en:'Closing' }), L({ es:'Mirar el siglo desde 1945', en:'Looking at the century from 1945' }),
    L({ es:'<p>La pregunta que sigue recorre todo el proceso que acabas de trabajar, desde la paz de 1919 hasta el mundo que salió de la guerra.</p>',
        en:'<p>The question that follows runs across the whole process you have just worked through, from the peace of 1919 to the world that came out of the war.</p>' }));

  /* ── graded 10 ── */
  var p10v = [
    { q:{ es:'Con frecuencia se afirma que la Segunda Guerra Mundial es hija de la Primera. ¿Qué evidencia sostiene mejor esa afirmación?',
          en:'It is often claimed that the Second World War is a child of the First. What evidence best supports that claim?' },
      o:{ es:['El acuerdo de paz de 1919, la crisis económica posterior y el ascenso de regímenes que prometían revertir ese acuerdo enlazan un conflicto con el otro.',
              'Los dos conflictos se libraron con las mismas armas y con la misma táctica de trincheras fijas.',
              'Los dos conflictos comenzaron con el asesinato de un heredero al trono en la península balcánica.',
              'Los países que participaron en el primer conflicto fueron exactamente los mismos que en el segundo.'],
          en:['The 1919 peace settlement, the later economic crisis and the rise of regimes promising to reverse that settlement link one conflict to the other.',
              'The two conflicts were fought with the same weapons and the same tactic of fixed trenches.',
              'Both conflicts began with the assassination of an heir to a throne in the Balkan peninsula.',
              'The countries taking part in the first conflict were exactly the same as in the second.'] }, c:0,
      h:{ es:'Una afirmación de continuidad se sostiene mostrando procesos que van de un conflicto al otro, no rasgos sueltos que se parezcan.',
          en:'A claim of continuity is supported by showing processes running from one conflict to the other, not by loose features that look alike.' },
      e:{ es:'Lo que enlaza los dos conflictos no es su forma sino su cadena: un acuerdo de paz vivido como humillación, una crisis económica que arruinó a millones y unos regímenes que ofrecieron revancha y orden. Cada eslabón se apoya en el anterior.',
          en:'What links the two conflicts is not their form but their chain: a peace settlement experienced as humiliation, an economic crisis that ruined millions and regimes that offered revenge and order. Each link rests on the one before.' } },
    { q:{ es:'Al estudiar este periodo, una alumna sostiene que sirve para entender el mundo en que vive hoy. ¿Qué argumento apoya mejor su postura?',
          en:'While studying this period, a student argues that it helps to understand the world she lives in today. What argument best supports her position?' },
      o:{ es:['De esta guerra salieron la ONU, la Declaración Universal de los Derechos Humanos y una división del mundo en bloques cuyas huellas siguen presentes en la política internacional.',
              'De esta guerra salió el conjunto de fronteras europeas que existía antes de 1914 y que no ha vuelto a modificarse.',
              'De esta guerra salió la desaparición definitiva de los conflictos armados entre países del mundo.',
              'De esta guerra salió el primer sistema de alianzas militares de la historia europea.'],
          en:['Out of this war came the UN, the Universal Declaration of Human Rights and a division of the world into blocs whose traces are still present in international politics.',
              'Out of this war came the set of European borders that existed before 1914 and has not changed since.',
              'Out of this war came the permanent disappearance of armed conflicts between countries of the world.',
              'Out of this war came the first system of military alliances in European history.'] }, c:0,
      h:{ es:'Busca la opción que nombre instituciones y acuerdos que sigan funcionando hoy, y descarta las que afirmen algo que la realidad desmiente.',
          en:'Look for the option naming institutions and agreements still working today, and discard those claiming something reality contradicts.' },
      e:{ es:'Las tres opciones descartadas afirman hechos falsos o exagerados. La que sostiene su postura señala herencias verificables: un organismo internacional que sigue existiendo, un texto de derechos que se sigue invocando y una división de bloques que marcó la política mundial durante décadas.',
          en:'The three discarded options state false or exaggerated facts. The one that supports her position points to verifiable legacies: an international body that still exists, a text of rights still invoked and a division into blocs that shaped world politics for decades.' } }
  ];
  var v10 = pickVariant(p10v, rng);
  addProblem({ title:L({ es:'La huella que sigue viva', en:'The legacy still alive' }), questionText:L(v10.q), options:L(v10.o), correct:v10.c, hint:L(v10.h), explanation:L(v10.e) }, rng);
}
