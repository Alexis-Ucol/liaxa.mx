           o:['Que el número sea múltiplo de cinco y que el número sea múltiplo de seis','Que el número sea múltiplo de cuatro y que el número sea par','Que el número sea impar y que el número sea múltiplo de tres','Que el número sea mayor que diez y que el número sea múltiplo de cinco'],
           a:'Que el número sea múltiplo de cinco y que el número sea múltiplo de seis',
           h:'Escribe las fichas que cumplen cada condición y compara las dos listas buscando un número repetido. La pareja correcta es la que no comparte ninguno.',
           e:'Entre uno y veinte los múltiplos de cinco son cinco, diez, quince y veinte, y los de seis son seis, doce y dieciocho: ninguna ficha aparece en las dos listas. En las demás parejas sí hay coincidencias, como el doce, que es múltiplo de cuatro y además par.' },
      en:{ t:'Numbered tokens in a bag',
           q:'A bag holds tokens numbered from one to twenty and one single token is drawn. Of the following pairs of events, which one is made of two events that cannot happen with the same token?',
           o:['That the number is a multiple of five and that the number is a multiple of six','That the number is a multiple of four and that the number is even','That the number is odd and that the number is a multiple of three','That the number is greater than ten and that the number is a multiple of five'],
           a:'That the number is a multiple of five and that the number is a multiple of six',
           h:'Write down the tokens that satisfy each condition and compare the two lists looking for a repeated number. The right pair is the one that shares none.',
           e:'Between one and twenty the multiples of five are five, ten, fifteen and twenty, and those of six are six, twelve and eighteen: no token appears on both lists. In the other pairs there are coincidences, such as twelve, which is a multiple of four and is also even.' } }
  ];
  var p3 = P3V[Math.floor(rng()*P3V.length)][LANG];
  addProblem(rng, { title:p3.t, q:p3.q, hint:p3.h, exp:p3.e, options:p3.o, correct:p3.a, showWork:false });

  /* ── CONCEPT 3 ───────────────────────────────────────────────── */
  addSection(C + '3',
    es ? 'Cuando los dos eventos comparten resultados' : 'When the two events share outcomes',
    (es
    ? '<p>Si los eventos sí pueden ocurrir a la vez, sumar sus probabilidades cuenta dos veces los resultados que pertenecen a los dos. Para reparar ese exceso se resta una vez la probabilidad de que ocurran juntos, y así cada resultado favorable queda contado una sola vez. Esta es la versión general de la regla de la suma, y la regla del caso excluyente es solo lo que queda cuando esa intersección está vacía.</p>'
    + '<p>El trabajo, entonces, es de conteo cuidadoso. Conviene listar los resultados de cada evento, marcar los que aparecen en las dos listas y decidir con ese dibujo cuánto hay que descontar. En cuanto la intersección se identifica, el resto del cálculo se vuelve mecánico.</p>'
    : '<p>If the events can happen at the same time, adding their probabilities counts twice the outcomes that belong to both. To repair that excess you subtract once the probability that they happen together, and then every favourable outcome is counted only once. This is the general version of the addition rule, and the rule for the exclusive case is just what is left when that intersection is empty.</p>'
    + '<p>The work, then, is careful counting. It helps to list the outcomes of each event, mark the ones that appear on both lists and decide from that picture how much has to be taken off. As soon as the intersection is identified, the rest of the calculation becomes mechanical.</p>')
    + '<div class="callout"><p><strong>'+(es?'Ejemplo resuelto:':'Worked example:')+'</strong> '+(es

      : 'among the tokens from one to twelve there are 6 even ones and 4 multiples of three, but six and twelve are on both lists. Stacking the piles would give 10 tokens when there are really only 8 different ones, so the 2 repeated tokens are taken off once and the probability of getting even or a multiple of three lands on ')
      + frac(8,12)+'.</p></div>');

  /* ── PROBLEM 4 ── regla general de la suma ── */
  var P4P = [ {N:30,a:3,b:5,A:10,B:6,I:2}, {N:40,a:4,b:6,A:10,B:6,I:3}, {N:36,a:4,b:6,A:9,B:6,I:3}, {N:24,a:3,b:4,A:8,B:6,I:2} ];
  var p4n = P4P[Math.floor(rng()*P4P.length)];
  var p4v = (rng() < 0.5) ? 'o' : 'ni';
  var p4u = p4n.A + p4n.B - p4n.I;
  var p4o = (p4v === 'o')
    ? [ frac(p4u, p4n.N), frac(p4n.A+p4n.B, p4n.N), frac(p4n.A, p4n.N), frac(p4n.B, p4n.N) ]
    : [ frac(p4n.N-p4u, p4n.N), frac(p4n.N-p4n.A-p4n.B, p4n.N), frac(p4n.N-p4n.A, p4n.N), frac(p4n.N-p4n.B, p4n.N) ];
  addProblem(rng, {
    title: es ? 'Las fichas de la caja' : 'The tokens in the box',
    q: (es
      ? 'Una caja contiene fichas numeradas del 1 al '+p4n.N+', una ficha por número, y se extrae una sola ficha al azar. ¿Cuál es la probabilidad de que el número de la ficha '+(p4v === 'o' ? 'sea múltiplo de '+p4n.a+' o múltiplo de '+p4n.b : 'no sea múltiplo de '+p4n.a+' ni múltiplo de '+p4n.b)+'?'
      : 'A box holds tokens numbered from 1 to '+p4n.N+', one token per number, and one single token is drawn at random. What is the probability that the number on the token '+(p4v === 'o' ? 'is a multiple of '+p4n.a+' or a multiple of '+p4n.b : 'is neither a multiple of '+p4n.a+' nor a multiple of '+p4n.b)+'?'),
    hint: es
      ? 'Escribe las dos listas de múltiplos y marca los números que aparecen en ambas. Esos números se contarían dos veces si apilas los montones sin más, de modo que hay que descontarlos una vez antes de comparar contra el total.'
      : 'Write the two lists of multiples and mark the numbers that appear on both. Those numbers would be counted twice if you simply stack the piles, so they have to be taken off once before comparing against the whole.',
    exp: (es

        + (p4v === 'o' ? ', así que la probabilidad pedida es '+frac(p4u, p4n.N)+'.' : '. El evento pedido es el contrario de ese, de modo que las fichas favorables son las '+(p4n.N-p4u)+' restantes y la probabilidad queda en '+frac(p4n.N-p4u, p4n.N)+'.')
      : 'There are '+p4n.A+' multiples of '+p4n.a+' and '+p4n.B+' multiples of '+p4n.b+', but '+p4n.I+' numbers appear on both lists because they are multiples of both at once. Taking that repetition off leaves '+p4u+' different favourable tokens among the '+p4n.N+' in the box'
        + (p4v === 'o' ? ', so the probability asked for is '+frac(p4u, p4n.N)+'.' : '. The event asked for is the opposite of that one, so the favourable tokens are the remaining '+(p4n.N-p4u)+' and the probability lands on '+frac(p4n.N-p4u, p4n.N)+'.')),

  /* ── CONCEPT 4 ───────────────────────────────────────────────── */
  addSection(C + '4',
    es ? 'Cuando un resultado no cambia al otro' : 'When one outcome does not change the other',
    (es
    ? '<p>Dos eventos son independientes cuando saber que uno ocurrió no modifica en nada la probabilidad del otro. Lanzar una moneda y después girar una ruleta son eventos independientes, y también lo son dos extracciones hechas en bolsas distintas o dos extracciones de la misma bolsa cuando la primera canica se devuelve antes de sacar la segunda. Si en cambio la canica no se devuelve, la segunda extracción trabaja con una bolsa distinta y la independencia se pierde.</p>'
    + '<p>Para eventos independientes, la probabilidad de que ocurran los dos se obtiene multiplicando sus probabilidades. Un diagrama de árbol lo hace visible: cada rama completa vale lo que valen sus tramos multiplicados entre sí, y por eso una rama larga siempre pesa menos que cualquiera de sus tramos. Esta regla se combina muy bien con el complemento cuando la pregunta habla de que ocurra al menos una vez algo, porque el contrario de eso es que no ocurra en ninguna de las repeticiones, y eso último es un producto sencillo.</p>'
    : '<p>Two events are independent when knowing that one happened does not change the probability of the other at all. Tossing a coin and then spinning a wheel are independent events, and so are two draws made from different bags, or two draws from the same bag when the first marble is put back before the second is taken. If instead the marble is not put back, the second draw works with a different bag and independence is lost.</p>'
    + '<p>For independent events, the probability that both happen comes from multiplying their probabilities. A tree diagram makes it visible: each complete branch is worth what its stretches are worth multiplied together, which is why a long branch always weighs less than any of its stretches. This rule combines very well with the complement when the question speaks of something happening at least once, because the opposite of that is it happening in none of the repetitions, and that last one is a simple product.</p>')
    + '<div class="rules-grid">'
    + '<div class="rcard"><div class="rname">'+(es?'Independientes':'Independent')+'</div><div class="rform">P(A y B) = P(A) · P(B)</div><div class="rnote">'+(es?'Vale cuando el primer resultado no altera al segundo.':'Holds when the first outcome does not alter the second.')+'</div></div>'
    + '<div class="rcard"><div class="rname">'+(es?'Al menos una vez':'At least once')+'</div><div class="rform">1 − P('+(es?'ninguna':'none')+')</div><div class="rnote">'+(es?'Más corto por el contrario que caso por caso.':'Shorter through the opposite than case by case.')+'</div></div>'
    + '<div class="rcard"><div class="rname">'+(es?'Con devolución':'With replacement')+'</div><div class="rform">'+(es?'misma bolsa':'same bag')+'</div><div class="rnote">'+(es?'Devolver la canica conserva la independencia.':'Putting the marble back keeps independence.')+'</div></div>'
    + '<div class="rcard"><div class="rname">'+(es?'Sin devolución':'Without replacement')+'</div><div class="rform">'+(es?'bolsa distinta':'different bag')+'</div><div class="rnote">'+(es?'La segunda extracción ya no parte de lo mismo.':'The second draw no longer starts from the same thing.')+'</div></div>'
    + '</div>');

  buildProducto(rng);

  var p5o = [ frac(p5n.a1*p5n.a2, p5D), frac((p5n.n1-p5n.a1)*(p5n.n2-p5n.a2), p5D), frac(p5n.a1*p5n.n2 + p5n.a2*p5n.n1, p5D), frac(p5n.a1+p5n.a2, p5n.n1+p5n.n2) ];
  var p5v = (rng() < 0.5) ? 'dos' : 'ninguna';
  addProblem(rng, {

    q: (es

      : 'One bag holds '+p5n.n1+' marbles, of which '+p5n.a1+' are red. A different bag holds '+p5n.n2+' marbles, of which '+p5n.a2+' are red. One marble is drawn from each bag without looking. What is the probability that '+(p5v === 'dos' ? 'both marbles drawn are red' : 'neither of the two marbles drawn is red')+'?'),

      : 'The two draws are independent because they are made in different bags. '+(p5v === 'dos'

  /* ── PROBLEM 6 ── al menos uno, vía complemento ── */

  /* ── CONCEPT 5 ───────────────────────────────────────────────── */
  addSection(C + '5',
    es ? 'Resultados que no pesan lo mismo' : 'Outcomes that do not weigh the same',
    (es
    ? '<p>Un juego de azar es justo cuando cada participante tiene exactamente la misma probabilidad de ganar. Comprobarlo exige mirar el peso real de cada resultado y no su apariencia. Al girar una ruleta de sectores iguales todos los resultados son equiprobables y basta contar sectores, pero al lanzar dos dados y sumar los puntos las once sumas posibles no son equiprobables en absoluto: la suma siete se puede formar de seis maneras distintas y la suma doce de una sola.</p>'
    + '<p>Por eso un reparto que parece equilibrado puede no serlo. Repartir las once sumas dando cinco a una jugadora y seis a la otra no dice nada sobre la justicia del juego, porque lo que decide es cuántas de las treinta y seis parejas de caras caen de cada lado. Analizar un juego de azar consiste en construir la lista de resultados verdaderamente equiprobables, ver cuántos favorecen a cada quien y comparar esas dos cantidades.</p>'
    : '<p>A game of chance is fair when each participant has exactly the same probability of winning. Checking it means looking at the real weight of each outcome and not at its appearance. When spinning a wheel of equal sectors every outcome is equally likely and counting sectors is enough, but when rolling two dice and adding the points the eleven possible sums are not equally likely at all: the sum seven can be formed in six different ways and the sum twelve in only one.</p>'
    + '<p>That is why a split that looks balanced may not be. Handing out the eleven sums by giving five to one player and six to the other says nothing about the fairness of the game, because what decides it is how many of the thirty six pairs of faces fall on each side. Analysing a game of chance means building the list of truly equally likely outcomes, seeing how many favour each person and comparing those two amounts.</p>')
    + '<div class="callout"><p><strong>'+(es?'Antes de declarar justo un juego:':'Before calling a game fair:')+'</strong> '+(es
      ? 'pregunta cuáles son los resultados que sí pesan lo mismo. Contar categorías bonitas no es lo mismo que contar resultados equiprobables.'
      : 'ask which outcomes really do weigh the same. Counting tidy categories is not the same as counting equally likely outcomes.')+'</p></div>');

    { es:{ t:'La bolsa de dos colores',
           q:'En una bolsa hay canicas blancas y negras. Ana gana si sale blanca y Beto gana si sale negra. Se quiere que el juego sea justo. ¿Qué condición hay que cumplir?',
           o:['Que la bolsa contenga la misma cantidad de canicas de cada color','Que la bolsa contenga un número par de canicas en total','Que cada jugador saque el mismo número de veces a lo largo de la partida','Que las canicas de los dos colores tengan el mismo tamaño y peso'],
           a:'Que la bolsa contenga la misma cantidad de canicas de cada color',
           h:'Escribe la probabilidad de ganar de cada jugador en términos de cuántas canicas de su color hay sobre el total y pregúntate cuándo esas dos expresiones coinciden.',
           e:'Los dos eventos son complementarios, de modo que sus probabilidades completan la unidad y solo pueden coincidir cuando cada una vale la mitad. Eso ocurre exactamente cuando hay tantas canicas blancas como negras, sin importar cuántas sean en total.' },
      en:{ t:'The two colour bag',
           q:'A bag holds white and black marbles. Ana wins if a white one comes out and Beto wins if a black one comes out. The game is meant to be fair. Which condition has to be met?',
           o:['That the bag holds the same amount of marbles of each colour','That the bag holds an even number of marbles in total','That each player draws the same number of times during the match','That the marbles of both colours have the same size and weight'],
           a:'That the bag holds the same amount of marbles of each colour',
           h:'Write the winning probability of each player in terms of how many marbles of their colour there are out of the whole and ask yourself when those two expressions match.',
           e:'The two events are complementary, so their probabilities complete the unit and can only match when each one is worth a half. That happens exactly when there are as many white marbles as black ones, no matter how many there are in total.' } }
  ];
  var p8 = P8V[Math.floor(rng()*P8V.length)][LANG];
  addProblem(rng, { title:p8.t, q:p8.q, hint:p8.h, exp:p8.e, options:p8.o, correct:p8.a, showWork:false });

  /* ── PROBLEM 9 ── producto seguido de complemento ── */
  var P9P = [ {n:8,g:3}, {n:12,g:5}, {n:10,g:4}, {n:16,g:7} ];
  var p9n = P9P[Math.floor(rng()*P9P.length)];
  var p9D = p9n.n * 2;
  var p9o = [ frac(p9D-p9n.g, p9D), frac(p9n.g, p9D), frac(p9n.n-p9n.g, p9n.n), frac(p9n.n-p9n.g, p9D) ];
  var p9v = (rng() < 0.5) ? 'perder' : 'ganar';
  addProblem(rng, {
    title: es ? 'La ruleta y la moneda' : 'The wheel and the coin',
    q: (es
      ? 'En un puesto de feria se gira una ruleta de '+p9n.n+' sectores iguales, de los cuales '+p9n.g+' son dorados, y en seguida se lanza una moneda equilibrada. El premio se entrega únicamente si la ruleta cae en sector dorado y además la moneda muestra águila. ¿Cuál es la probabilidad de '+(p9v === 'perder' ? 'salir del puesto sin premio' : 'llevarse el premio')+'?'
      : 'At a fairground stall a wheel of '+p9n.n+' equal sectors is spun, '+p9n.g+' of which are golden, and right after that a fair coin is tossed. The prize is handed over only if the wheel lands on a golden sector and the coin also shows heads. What is the probability of '+(p9v === 'perder' ? 'leaving the stall with no prize' : 'taking the prize home')+'?'),
    hint: es
      ? 'La ruleta y la moneda no se afectan entre sí, así que primero combina las dos condiciones del premio en una sola rama. Después decide si la pregunta se refiere a esa rama o a todo lo que queda fuera de ella.'
      : 'The wheel and the coin do not affect each other, so first combine the two prize conditions into a single branch. Then decide whether the question refers to that branch or to everything outside it.',
    exp: (es
      ? 'La ruleta cae en dorado con probabilidad '+frac(p9n.g,p9n.n)+' y la moneda muestra águila con probabilidad '+frac(1,2)+'. Como los dos resultados son independientes, la rama que otorga el premio vale '+fracRaw(p9n.g, p9D)+'. '+(p9v === 'perder'
          ? 'Salir sin premio es el evento contrario, de modo que la probabilidad pedida es '+frac(p9D-p9n.g, p9D)+'.'
          : 'Simplificada, la probabilidad pedida es '+frac(p9n.g, p9D)+'.')
      : 'The wheel lands on golden with probability '+frac(p9n.g,p9n.n)+' and the coin shows heads with probability '+frac(1,2)+'. Since the two outcomes are independent, the branch that gives the prize is worth '+fracRaw(p9n.g, p9D)+'. '+(p9v === 'perder'
          ? 'Leaving with no prize is the opposite event, so the probability asked for is '+frac(p9D-p9n.g, p9D)+'.'
          : 'Simplified, the probability asked for is '+frac(p9n.g, p9D)+'.')),
    options: p9o, correct: (p9v === 'perder' ? p9o[0] : p9o[1]), showWork: true
  });

  /* ── PROBLEM 10 ── excluyentes frente a independientes (conceptual) ── */
  var P10V = [
    { es:{ t:'Dos ideas que se confunden',
           q:'Un equipo discute sobre dos eventos que tienen probabilidad distinta de cero y que resultaron ser mutuamente excluyentes. ¿Qué se puede afirmar con seguridad sobre ellos?',
           o:['Que no son independientes, porque saber que ocurrió uno deja al otro sin ninguna posibilidad','Que también son independientes, porque cada uno conserva su propia probabilidad','Que son complementarios, porque no comparten ningún resultado del espacio muestral','Que la probabilidad de que ocurran los dos a la vez es el producto de sus probabilidades'],
           a:'Que no son independientes, porque saber que ocurrió uno deja al otro sin ninguna posibilidad',
           h:'Pregúntate qué le pasa a la probabilidad del segundo evento en cuanto te enteras de que el primero ya ocurrió, y compara eso con lo que exige la independencia.',
           e:'Si dos eventos no pueden ocurrir juntos y te enteras de que uno ocurrió, el otro queda descartado y su probabilidad se vuelve cero, que no era su valor original. La independencia exige justamente lo contrario, que enterarse de uno no modifique al otro, así que dos eventos excluyentes con probabilidad distinta de cero nunca son independientes.' },
      en:{ t:'Two ideas that get mixed up',
           q:'A team is discussing two events that have nonzero probability and that turned out to be mutually exclusive. What can be stated with certainty about them?',
           o:['That they are not independent, because knowing that one happened leaves the other with no chance at all','That they are also independent, because each one keeps its own probability','That they are complementary, because they share no outcome of the sample space','That the probability that both happen at once is the product of their probabilities'],
           a:'That they are not independent, because knowing that one happened leaves the other with no chance at all',
           h:'Ask yourself what happens to the probability of the second event as soon as you learn that the first one already happened, and compare that with what independence demands.',
           e:'If two events cannot happen together and you learn that one happened, the other is ruled out and its probability becomes zero, which was not its original value. Independence demands exactly the opposite, that learning about one does not change the other, so two exclusive events with nonzero probability are never independent.' } },
    { es:{ t:'La segunda extracción',
           q:'De una bolsa con canicas de varios colores se extrae una canica, se anota su color y se guarda fuera de la bolsa; después se extrae una segunda canica. ¿Qué se puede afirmar sobre las dos extracciones?',
           o:['Que no son independientes, porque la segunda extracción se hace sobre un contenido ya modificado','Que son independientes, porque cada extracción se hace de la misma bolsa','Que son mutuamente excluyentes, porque las dos canicas nunca son la misma','Que son complementarias, porque entre las dos agotan el contenido de la bolsa'],
           a:'Que no son independientes, porque la segunda extracción se hace sobre un contenido ya modificado',
           h:'Compara el contenido de la bolsa justo antes de cada extracción y pregúntate si la primera cambió las posibilidades de la segunda.',
           e:'Al no devolver la primera canica, la bolsa pierde una unidad del total y una del color que salió, de modo que las probabilidades de la segunda extracción dependen de lo que ocurrió en la primera. Eso es exactamente lo que impide llamarlas independientes.' },
      en:{ t:'The second draw',
           q:'From a bag with marbles of several colours one marble is drawn, its colour is written down and it is kept outside the bag; then a second marble is drawn. What can be stated about the two draws?',
           o:['That they are not independent, because the second draw is made on an already modified content','That they are independent, because each draw is made from the same bag','That they are mutually exclusive, because the two marbles are never the same one','That they are complementary, because together they exhaust the content of the bag'],
           a:'That they are not independent, because the second draw is made on an already modified content',
           h:'Compare the content of the bag right before each draw and ask yourself whether the first one changed the chances of the second.',
           e:'By not putting the first marble back, the bag loses one unit of the total and one of the colour that came out, so the probabilities of the second draw depend on what happened in the first. That is exactly what stops them from being called independent.' } },
    { es:{ t:'La moneda y el dado',
           q:'Se lanza una moneda y un dado al mismo tiempo. Se consideran el evento de que la moneda muestre águila y el evento de que el dado muestre un número par. ¿Qué se puede afirmar sobre esos dos eventos?',
           o:['Que son independientes y además pueden ocurrir a la vez, así que no son mutuamente excluyentes','Que son mutuamente excluyentes, porque se refieren a objetos distintos','Que son complementarios, porque entre los dos cubren todos los resultados posibles','Que no son independientes, porque se lanzan al mismo tiempo y en la misma mesa'],
           a:'Que son independientes y además pueden ocurrir a la vez, así que no son mutuamente excluyentes',
           h:'Revisa dos cosas por separado: si existe un resultado que cumpla los dos eventos, y si conocer el resultado de la moneda cambia lo que hace el dado.',
           e:'La moneda no influye en el dado ni el dado en la moneda, de modo que los eventos son independientes. Además existe un resultado que cumple los dos al mismo tiempo, por ejemplo águila junto con un cuatro, así que los eventos no se estorban entre sí.' },
      en:{ t:'The coin and the die',
           q:'A coin and a die are thrown at the same time. The event that the coin shows heads and the event that the die shows an even number are considered. What can be stated about those two events?',
           o:['That they are independent and can also happen at once, so they are not mutually exclusive','That they are mutually exclusive, because they refer to different objects','That they are complementary, because together they cover every possible outcome','That they are not independent, because they are thrown at the same time on the same table'],
           a:'That they are independent and can also happen at once, so they are not mutually exclusive',
           h:'Check two things separately: whether there is an outcome that satisfies both events, and whether knowing the result of the coin changes what the die does.',
           e:'The coin does not influence the die nor the die the coin, so the events are independent. There is also an outcome that satisfies both at the same time, for instance heads together with a four, so the events do not get in each other way.' } }
  ];
  var p10 = P10V[Math.floor(rng()*P10V.length)][LANG];
  addProblem(rng, { title:p10.t, q:p10.q, hint:p10.h, exp:p10.e, options:p10.o, correct:p10.a, showWork:false });
}
</script>

<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbwoSl0opNALX7IT8O9tk7xZoPU9LbrYvZ-n_p9u3R-pUlwi-rVTTfnYRaiKngnsY1QV/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
