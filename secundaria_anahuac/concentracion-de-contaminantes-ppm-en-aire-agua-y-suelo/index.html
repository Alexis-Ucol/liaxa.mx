<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Concentración de Contaminantes (ppm) en Aire, Agua y Suelo</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Concentración de Contaminantes (ppm) en Aire, Agua y Suelo</div>
    <div class="wcourse" id="wcourse-el">Química · 3° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Concentración de Contaminantes (ppm) en Aire, Agua y Suelo</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="sbtn" id="dlBtn" onclick="generatePDF()" style="max-width:280px;margin:0 auto;">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   CENTRALIZED SCHOOL CONFIG (Rule 16) — ships UNBRANDED (Rule 11).
   The ONLY rebranding point. build_all.py substitutes these exact fields
   (BRAND_FIELDS / RGB_FIELDS / logo*) downstream; :root/dark stay as fallback.
   Neutral defaults below == the static :root/dark values, so unbranded == no-op.
   ══════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:'#1a4a8a', primaryDark:'#0c2547', primaryBg:'#e7edf6',
  accent:'#e07b1a', accentBg:'#fbeddf',
  darkPrimary:'#437bc6', darkPrimaryDark:'#74a5e6', darkPrimaryBg:'#0c203a',

  document.getElementById('restoreBar').style.display = 'none';

  var att = currentAttempt(name, group);
  buildLesson(seededRng(name + group + att));

  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;

    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
  saved.choices.forEach(function(choice, idx) {

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);

  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');

}

  // ── Per-problem pages ──

    doc.setFontSize(8);   var coLines = doc.splitTextToSize('Correcto: '+corr, TW-18);
    doc.setFontSize(7.5); var exLines = doc.splitTextToSize('Solución: '+expRaw, TW-18).slice(0,4);
    var ansBoxH = 8 + chLines.length*5.5 + coLines.length*5 + exLines.length*5 + 6;
    doc.setFillColor(isOk?232:255, isOk?240:232, isOk?232:228);
    doc.roundedRect(M,wy,TW,ansBoxH,2,2,'F');
    doc.setFillColor(isOk?26:176, isOk?106:48, isOk?74:16);
    doc.circle(M+7, wy+8, 3.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(9); doc.setFont('helvetica','bold');
    doc.text(isOk?'✓':'✗', M+5.2, wy+10.5);
    var ay = wy+7;
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','bold');
    chLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5.5); });

    doc.setTextColor(26,106,74); doc.setFontSize(8); doc.setFont('helvetica','normal');
    coLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    ay += coLines.length*5 + 3;
    doc.setTextColor(90,85,80); doc.setFontSize(7.5);
    exLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });

    doc.rect(M,wy,TW,8,'F'); doc.text('TRABAJO DEL ALUMNO', M+4, wy+5.5);

    var dc = document.getElementById('dc'+i);

    var ta = document.getElementById('ta'+i);

function L(o){ return (o && o[LANG] !== undefined) ? o[LANG] : (o ? o.es : ''); }
function pk(rng, a){ return a[Math.floor(rng() * a.length)]; }
function pkN(rng, a, n){ return shuffle(a, rng).slice(0, n); }
function fmt(x){
  var v = Math.round(x * 1000) / 1000;
  return (Math.round(v) === v) ? String(Math.round(v)) : String(v);
}

function sec(tag, title, html){
  var d = document.createElement('div');
  d.className = 'section';
  d.innerHTML = '<div class="stag">' + tag + '</div><h2>' + title + '</h2>' + html;
  document.getElementById('lessonBody').appendChild(d);
  return d;
}

function widgetHost(parent, id){
  var d = document.createElement('div');
  d.className = 'gw';
  d.id = id;
  parent.appendChild(d);
  return d;
}

function rcard(name, form, note){
  return '<div class="rcard"><div class="rname">' + name + '</div><div class="rform">' + form + '</div><div class="rnote">' + note + '</div></div>';
}

function chip(txt){ return '<span class="gw-chip">' + txt + '</span>'; }

function say(host, cls, msg){
  var e = host.querySelector('.gw-fb');
  if (!e) return;
  e.className = 'gw-fb' + (cls ? ' ' + cls : '');
  e.innerHTML = msg;
}

function addProblem(rng, spec){
  var idx = problems.length;
  var correctVal = spec.options[spec.correct];
  var sh = shuffle(spec.options, rng);
  var prob = {
    title: spec.title,
    questionText: spec.q,
    fn: spec.fn || '',
    hint: spec.hint || '',
    explanation: spec.exp || '',
    options: sh,
    correctIdx: sh.indexOf(correctVal),
    showWork: !!spec.showWork,
    studentChoice: null,
    pendingChoice: null
  };
  problems.push(prob);
  buildOneCard(prob, idx);
}

/* Un variante trae su propio enunciado, sus cuatro opciones y su explicacion. */
function useVariant(v){
  return { title:L(v.t), q:L(v.q), options:L(v.o), correct:v.c, hint:L(v.h), exp:L(v.e), fn:'', showWork:false };
}

function buildLesson(rng){
  injectGuideCSS();

  sec(
    L({ es:'Punto de partida', en:'Starting point' }),
    L({ es:'Un número diminuto que decide una política de barrio', en:'A tiny number that decides a neighbourhood policy' }),
    '<p>' + L({
      es:'Cuando una comunidad sospecha que su pozo, su aire o su tierra están contaminados, la conversación tarde o temprano llega a una cifra: tantas partes por millón de tal sustancia. Ese número parece pequeño, casi insignificante, y sin embargo puede ser la diferencia entre un agua que se puede beber y otra que no.',
      en:'When a community suspects that its well, its air or its soil is polluted, the conversation sooner or later arrives at a figure: so many parts per million of some substance. That number looks small, almost negligible, and yet it can be the difference between water that can be drunk and water that cannot.'
    }) + '</p>' +
    '<p>' + L({
      es:'Esta guía trabaja en leer esa cifra con precisión: qué compara, cómo cambia la unidad según se mida aire, agua o suelo, contra qué referencia se juzga y qué se puede concluir cuando hay varias lecturas juntas. Al final, esa lectura cuidadosa es la que sostiene una propuesta preventiva frente a la asamblea.',
      en:'This guide works on reading that figure precisely: what it compares, how the unit changes depending on whether air, water or soil is measured, against which reference it is judged, and what can be concluded when several readings are put together. In the end, that careful reading is what supports a preventive proposal before the assembly.'
    }) + '</p>' +
    '<div class="gw-lbl">' + L({ es:'Lo que vas a leer en esta guía', en:'What you will read in this guide' }) + '</div>' +
    '<div>' +

      en:'Parts per million answer a single question: out of all the material in the sample, which fraction corresponds to the pollutant? A reading of 1 ppm means that for every million parts of the sample there is one part of the substance being looked for. It is the same idea as a percentage, which is one part in a hundred, taken to a scale ten thousand times finer.'

  /* CONCEPTO 2 ────────────────────────────────────────────────────────── */
  var s2 = sec(

      es:'La idea de proporción es la misma en aire, agua y suelo, pero lo que se pone arriba y abajo de esa proporción cambia. En agua se compara la masa de la sustancia con el volumen del líquido: un miligramo por litro se informa como una parte por millón, porque un litro de agua tiene una masa cercana a un millón de miligramos. En suelo se comparan masas: un miligramo por kilogramo de muestra seca equivale también a una parte por millón, y la muestra se seca antes de pesarla para que la humedad del día no altere el resultado.',
      en:'The idea of proportion is the same in air, water and soil, but what goes on top and at the bottom of that proportion changes. In water the mass of the substance is compared with the volume of the liquid: one milligram per litre is reported as one part per million, because one litre of water has a mass close to a million milligrams. In soil masses are compared: one milligram per kilogram of dry sample also equals one part per million, and the sample is dried before weighing so that the humidity of the day does not alter the result.'

      es:'Un valor en partes por millón no es alto ni bajo por sí mismo. Se vuelve alto o bajo frente a un valor de referencia, que es el máximo recomendado para un uso concreto. La referencia del agua de bebida es más exigente que la del agua de riego; la del suelo de un patio escolar es más exigente que la de un terreno industrial. Comparar contra la referencia equivocada produce una conclusión falsa aunque la medición sea impecable.',
      en:'A value in parts per million is neither high nor low by itself. It becomes high or low against a reference value, which is the maximum recommended for a specific use. The reference for drinking water is stricter than the one for irrigation water; the one for the soil of a school yard is stricter than the one for industrial land. Comparing against the wrong reference produces a false conclusion even when the measurement is flawless.'

      en:'When measurements are taken at several points in the same neighbourhood they stop being loose figures and form a pattern. Almost always the concentration is higher near the place where the substance is released and decreases as the distance grows, because air disperses, water dilutes and soil holds whatever reaches it. That orderly decline is the trail that leads to the source.'

      es:'La información sobre concentración casi nunca viene de un solo lado: hay reportes de laboratorio, boletines de estaciones de monitoreo, mediciones escolares con equipo sencillo y testimonios de quienes viven en el sitio. Sistematizar es acomodar todo eso en una misma tabla donde cada renglón declare sustancia, sitio, fecha, unidad, periodo y método. Con esos campos a la vista se distingue qué lecturas se pueden comparar y cuáles solo parecen comparables.',
      en:'Information about concentration almost never comes from a single place: there are laboratory reports, bulletins from monitoring stations, school measurements with simple equipment and accounts from the people who live at the site. Systematizing means arranging all of that in one table where each row declares substance, site, date, unit, period and method. With those fields in sight you can tell which readings can be compared and which only look comparable.'
    }) + '</p>' +

      en:'The table is the starting point of the proposal, not its end. With it an action is chosen, and actions are not worth the same: a preventive measure acts on the source so the substance is not released, while a corrective one cleans up what was already released. Every proposal also needs to be feasible with the real resources of the community, to hold over time, and to bring an indicator: the same substance, measured at the same point and with the same method, before and after.'

var SCALE = [

  { lab:'0.1 ppm',   side:1, parts:{ es:'1 parte en 10 000 000 de partes', en:'1 part in 10 000 000 parts' },
    agua:{ es:'1 miligramo en 10 litros de agua', en:'1 milligram in 10 litres of water' },

var SCROUNDS = [

          en:'The report of the well on the common land says: 1 milligram of nitrates in every litre of water.' }, i:4 },

function w1(rng, host){
  var R = pkN(rng, SCROUNDS, 3);
  var rd = 0, tries = 0, locked = false, done = false, cur = 3;

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Escala de la proporción', en:'Scale of the proportion' }) + '</div>' +
    '<div class="gw-q" data-r="ask"></div>' +
    '<div class="gw-mini">' + L({
      es:'Mueve el control por los escalones y observa cómo cambia la marca dorada y cómo cambian las equivalencias. Detente en el escalón que describe la proporción del reporte.',
      en:'Move the control across the steps and watch how the gold mark changes and how the equivalences change. Stop at the step that describes the proportion of the report.'
    }) + '</div>' +
    '<div class="sc-box">' +
      '<div class="sc-frame"><div class="sc-halo"></div><div class="sc-part" data-r="part"></div></div>' +

    '</div>' +
    '<div class="gw-read" data-r="read"></div>' +

    '<div class="gw-fb"></div>';

  var elA = host.querySelector('[data-r="ask"]'),
      elP = host.querySelector('[data-r="part"]'),

      elU = host.querySelector('[data-r="ruler"]'),
      elE = host.querySelector('[data-r="eq"]'),
      elD = host.querySelector('[data-r="read"]'),
      elB = host.querySelector('[data-r="chk"]');

  function draw(reveal){
    var s = SCALE[cur], c = R[rd];
    elA.innerHTML = L(c.txt);
    elP.style.width = s.side + 'px';
    elP.style.height = s.side + 'px';
    var ruler = '';
    for (var k = 0; k < SCALE.length; k++){
      ruler += '<div class="sc-tick' + (k === cur ? ' on' : '') + (reveal && k === c.i ? ' goal' : '') + '">' + SCALE[k].lab + '</div>';
    }
    elU.innerHTML = ruler;
    elE.innerHTML = L({ es:'Para separar una sola parte habría que dividir la muestra en ', en:'To separate a single part the sample would have to be divided into ' }) +
      '<span class="gw-val">' + s.div + '</span>' + L({ es:' partes iguales.', en:' equal parts.' });
    elD.innerHTML =
      '<div class="gw-rd"><div class="k">' + L({ es:'Proporción', en:'Proportion' }) + '</div><div class="v">' + s.lab + '</div></div>' +
      '<div class="gw-rd"><div class="k">' + L({ es:'En agua', en:'In water' }) + '</div><div class="v" style="font-size:.72rem">' + L(s.agua) + '</div></div>' +
      '<div class="gw-rd"><div class="k">' + L({ es:'En suelo', en:'In soil' }) + '</div><div class="v" style="font-size:.72rem">' + L(s.suelo) + '</div></div>';
    elR.disabled = locked || done;
  }

  function advance(){
    rd++;
    if (rd >= 3){
      done = true;
      elB.textContent = L({ es:'Completado', en:'Completed' });
      elB.className = 'gw-btn solved';
      draw(false);
      say(host, 'good', L({
        es:'Recorriste las tres proporciones. Cada escalón hacia la derecha vuelve la parte diez veces más pequeña dentro de la misma muestra.',
        en:'You went through the three proportions. Each step to the right makes the part ten times smaller inside the same sample.'
      }));
      return;
    }
    tries = 0; locked = false; cur = 3;
    elR.value = '3';
    elB.textContent = L({ es:'Comprobar', en:'Check' });
    elB.className = 'gw-btn';
    draw(false);
    say(host, '', L({ es:'Nuevo reporte sobre la mesa.', en:'A new report on the table.' }));
  }

  elR.addEventListener('input', function(){
    cur = parseInt(elR.value, 10);
    draw(false);
  });

  elB.addEventListener('click', function(){
    if (done) return;
    if (locked){ advance(); return; }
    var c = R[rd];
    if (cur === c.i){
      locked = true;
      elB.textContent = rd === 2 ? L({ es:'Terminar', en:'Finish' }) : L({ es:'Siguiente reporte', en:'Next report' });
      elB.className = 'gw-btn solved';
      draw(true);
      say(host, 'good', L({
        es:'Coincide: esa es la proporción del reporte, escrita en la escala que usan los informes de contaminantes.',
        en:'It matches: that is the proportion of the report, written in the scale used by pollutant reports.'
      }));
      return;
    }
    tries++;
    if (tries >= 3){
      cur = c.i; elR.value = String(c.i); locked = true;
      elB.textContent = rd === 2 ? L({ es:'Terminar', en:'Finish' }) : L({ es:'Siguiente reporte', en:'Next report' });
      elB.className = 'gw-btn solved';
      draw(true);
      say(host, 'warm', L({
        es:'Queda marcado el escalón correcto: ',
        en:'The correct step is marked: '
      }) + '<strong>' + SCALE[c.i].lab + '</strong>. ' + L({
        es:'Compara la frase del reporte con la equivalencia que aparece abajo y verás que dicen lo mismo.',
        en:'Compare the sentence of the report with the equivalence shown below and you will see they say the same thing.'
      }));
      return;
    }
    say(host, 'miss', cur < c.i
      ? L({ es:'La proporción que marcaste es mayor que la del reporte: mueve el control hacia la derecha, donde la parte es más pequeña.',
            en:'The proportion you marked is larger than the one in the report: move the control to the right, where the part is smaller.' })
      : L({ es:'La proporción que marcaste es menor que la del reporte: mueve el control hacia la izquierda, donde la parte es más grande.',
            en:'The proportion you marked is smaller than the one in the report: move the control to the left, where the part is larger.' }));
    draw(false);
  });

  draw(false);
}

var COMPS = [
  { k:'aire',  n:{ es:'Aire',  en:'Air' } },
  { k:'agua',  n:{ es:'Agua',  en:'Water' } },
  { k:'suelo', n:{ es:'Suelo', en:'Soil' } }
];

function w2(rng, host){
  var byC = {}, i;
  for (i = 0; i < COMPS.length; i++) byC[COMPS[i].k] = [];
  for (i = 0; i < UNITS.length; i++) byC[UNITS[i].c].push(UNITS[i]);
  var cards = [];
  for (i = 0; i < COMPS.length; i++){
    cards = cards.concat(pkN(rng, byC[COMPS[i].k], 2));
  }
  cards = shuffle(cards, rng).map(function(u, k){
    return { id:k, u:u, at:null, miss:0, shown:false };
  });
  var sel = null, done = false;

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Mesa de unidades', en:'Units table' }) + '</div>' +
    '<div class="gw-q">' + L({
      es:'¿A qué compartimento pertenece cada manera de medir?',
      en:'Which compartment does each way of measuring belong to?'
    }) + '</div>' +
    '<div class="gw-mini">' + L({
      es:'Toca una tarjeta para tomarla y luego la bandeja donde crees que va. Puedes tocar una tarjeta ya colocada para regresarla a la mesa.',
      en:'Tap a card to pick it up and then the tray where you think it goes. You can tap a card already placed to bring it back to the table.'
    }) + '</div>' +
    '<div class="un-trays" data-r="trays"></div>' +
    '<div class="un-pool"><div class="gw-lbl">' + L({ es:'Tarjetas sin colocar', en:'Cards not yet placed' }) + '</div><div data-r="pool"></div></div>' +
    '<div class="gw-fb"></div>';

  var elT = host.querySelector('[data-r="trays"]'),
      elP = host.querySelector('[data-r="pool"]');

  function draw(){
    var html = '', j, c;
    for (j = 0; j < COMPS.length; j++){
      var inside = '';
      for (var m = 0; m < cards.length; m++){
        c = cards[m];
        if (c.at === COMPS[j].k){
          inside += '<div class="un-card ' + (c.shown ? 'shown' : 'set') + '" data-c="' + c.id + '">' + L(c.u.t) + '</div>';
        }
      }
      html += '<div class="un-tray' + (sel !== null ? ' armed' : '') + '" data-t="' + COMPS[j].k + '">' +
        '<div class="un-tname">' + L(COMPS[j].n) + '</div>' + inside + '</div>';
    }
    elT.innerHTML = html;
    var pool = '';
    for (j = 0; j < cards.length; j++){
      c = cards[j];
      if (c.at === null) pool += '<div class="un-card' + (sel === c.id ? ' sel' : '') + '" data-c="' + c.id + '">' + L(c.u.t) + '</div>';
    }
    elP.innerHTML = pool || '<div class="gw-mini">' + L({ es:'La mesa quedó vacía.', en:'The table is empty.' }) + '</div>';
    bind();
  }

  function bind(){
    host.querySelectorAll('.un-card').forEach(function(el){
      el.addEventListener('click', function(ev){
        ev.stopPropagation();
        if (done) return;
        var c = cards[parseInt(el.dataset.c, 10)];
        if (c.shown) return;
        if (c.at !== null){
          c.at = null; sel = null;
          say(host, '', L({ es:'Regresaste la tarjeta a la mesa. Colócala de nuevo cuando quieras.',
                            en:'You brought the card back to the table. Place it again whenever you want.' }));
          draw(); return;
        }
        sel = (sel === c.id) ? null : c.id;
        draw();
      });
    });
    host.querySelectorAll('.un-tray').forEach(function(el){
      el.addEventListener('click', function(){
        if (done || sel === null) return;
        place(cards[sel], el.dataset.t);
      });
    });
  }

  function place(c, k){
    if (c.u.c === k){
      c.at = k; sel = null;
      say(host, 'good', L(c.u.w));
    } else {
      c.miss++;
      if (c.miss >= 3){
        c.at = c.u.c; c.shown = true; sel = null;
        say(host, 'warm', L({ es:'Esa tarjeta queda colocada en su bandeja: ', en:'That card stays placed in its tray: ' }) +
          '<strong>' + L(COMPS.filter(function(x){ return x.k === c.u.c; })[0].n) + '</strong>. ' + L(c.u.w));
      } else {
        sel = null;
        say(host, 'miss', L({ es:'Ahí no encaja. ', en:'It does not fit there. ' }) + L(c.u.n));
      }
    }
    var pend = cards.filter(function(x){ return x.at === null; }).length;
    if (pend === 0){
      done = true;
      var okc = cards.filter(function(x){ return !x.shown; }).length;
      say(host, 'good', L({ es:'Mesa completa: ', en:'Table complete: ' }) + okc + L({ es:' de 6 tarjetas colocadas por tu cuenta. La unidad depende siempre de qué se pone abajo de la proporción.',
                                                                                       en:' of 6 cards placed on your own. The unit always depends on what goes at the bottom of the proportion.' }));
    }
    draw();
  }

  draw();
  say(host, '', L({ es:'Toma la primera tarjeta y decide su compartimento.', en:'Pick up the first card and decide its compartment.' }));
}

   Una serie de lecturas y una linea de referencia. El alumno marca las barras
   que quedan por encima y recibe pistas direccionales hasta cerrar la ronda.
   ========================================================================== */

var SERIES = [
  { sub:{ es:'Ozono', en:'Ozone' }, site:{ es:'Estación Alameda', en:'Alameda station' }, unit:' ppm', ref:0.07,
    per:{ es:'lecturas por hora del mismo día', en:'hourly readings from the same day' },

  { sub:{ es:'Dióxido de azufre', en:'Sulfur dioxide' }, site:{ es:'Estación Ladrillera', en:'Brickworks station' }, unit:' ppm', ref:0.11,
    per:{ es:'lecturas por hora del mismo día', en:'hourly readings from the same day' },
    labs:['06','08','10','12','14','16'], vals:[0.14, 0.19, 0.09, 0.06, 0.05, 0.12] },
  { sub:{ es:'Nitratos', en:'Nitrates' }, site:{ es:'Pozo del ejido', en:'Well on the common land' }, unit:' ppm', ref:10,
    per:{ es:'una lectura por semana', en:'one reading per week' },
    labs:['S1','S2','S3','S4','S5','S6'], vals:[6, 8, 11, 14, 9, 7] },
  { sub:{ es:'Monóxido de carbono', en:'Carbon monoxide' }, site:{ es:'Estación Carretera', en:'Highway station' }, unit:' ppm', ref:9,
    per:{ es:'lecturas por hora del mismo día', en:'hourly readings from the same day' },
    labs:['07','09','11','13','15','17'], vals:[4, 12, 10, 6, 3, 5] },
  { sub:{ es:'Partículas suspendidas', en:'Suspended particles' }, site:{ es:'Estación Mercado', en:'Market station' }, unit:' µg/m³', ref:45,
    per:{ es:'un promedio por día', en:'one average per day' },
    labs:['L','M','X','J','V','S'], vals:[20, 38, 52, 61, 44, 30] }
];

function w3(rng, host){
  var R = pkN(rng, SERIES, 3);
  var rd = 0, tries = 0, locked = false, done = false, mk = [], reveal = false;

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Ventana de exceso', en:'Exceedance window' }) + '</div>' +
    '<div class="gw-q" data-r="ask"></div>' +
    '<div class="gw-mini">' + L({
      es:'Toca las barras que quedan por encima de la línea dorada de referencia. Puedes marcar y desmarcar las veces que necesites antes de comprobar.',
      en:'Tap the bars that stay above the gold reference line. You can mark and unmark as many times as you need before checking.'
    }) + '</div>' +
    '<div class="tw-plot" data-r="plot"></div>' +
    '<div class="tw-axis" data-r="axis"></div>' +
    '<div class="gw-read" data-r="read"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Comprobar', en:'Check' }) + '</button></div>' +
    '<div class="gw-fb"></div>';

  var elA = host.querySelector('[data-r="ask"]'),
      elP = host.querySelector('[data-r="plot"]'),
      elX = host.querySelector('[data-r="axis"]'),
      elD = host.querySelector('[data-r="read"]'),
      elB = host.querySelector('[data-r="chk"]');

  function over(c){
    var out = [], i;
    for (i = 0; i < c.vals.length; i++) if (c.vals[i] > c.ref) out.push(i);
    return out;
  }

  function draw(){
    var c = R[rd], i;
    var mx = Math.max.apply(null, c.vals);
    var top = Math.max(mx, c.ref) * 1.22;
    elA.innerHTML = L(c.sub) + ' · ' + L(c.site) + ' · ' + L({ es:'referencia ', en:'reference ' }) +
      '<span class="gw-val">' + fmt(c.ref) + c.unit + '</span>';
    var bars = '<div class="tw-ref" style="bottom:' + (c.ref / top * 100) + '%"><span class="tw-reflbl">' +
      L({ es:'referencia', en:'reference' }) + '</span></div>';
    for (i = 0; i < c.vals.length; i++){
      var cls = 'tw-bar';
      if (reveal){
        if (c.vals[i] > c.ref) cls += ' hit';
        else if (mk.indexOf(i) !== -1) cls += ' slip';
      } else if (mk.indexOf(i) !== -1) cls += ' mk';
      bars += '<div class="' + cls + '" data-i="' + i + '" style="height:' + (c.vals[i] / top * 100) + '%" title="' + fmt(c.vals[i]) + c.unit + '"></div>';
    }
    elP.innerHTML = bars;
    var ax = '';
    for (i = 0; i < c.labs.length; i++) ax += '<div class="tw-ax">' + c.labs[i] + '<br>' + fmt(c.vals[i]) + '</div>';
    elX.innerHTML = ax;
    elD.innerHTML =
      '<div class="gw-rd"><div class="k">' + L({ es:'Serie', en:'Series' }) + '</div><div class="v" style="font-size:.7rem">' + L(c.per) + '</div></div>' +
      '<div class="gw-rd"><div class="k">' + L({ es:'Referencia', en:'Reference' }) + '</div><div class="v">' + fmt(c.ref) + c.unit + '</div></div>' +
      '<div class="gw-rd"><div class="k">' + L({ es:'Marcadas', en:'Marked' }) + '</div><div class="v">' + mk.length + '</div></div>';
    elP.querySelectorAll('.tw-bar').forEach(function(b){
      b.addEventListener('click', function(){
        if (locked || done) return;
        var i2 = parseInt(b.dataset.i, 10);
        var at = mk.indexOf(i2);
        if (at === -1) mk.push(i2); else mk.splice(at, 1);
        draw();
      });
    });
  }

  function advance(){
    rd++;
    if (rd >= 3){
      done = true;
      elB.textContent = L({ es:'Completado', en:'Completed' });
      elB.className = 'gw-btn solved';
      reveal = false; mk = [];
      draw();
      say(host, 'good', L({
        es:'Tres series revisadas. Contar las excedencias y en qué momento ocurren es lo que convierte una serie de números en una descripción del problema.',
        en:'Three series reviewed. Counting the exceedances and when they happen is what turns a series of numbers into a description of the problem.'
      }));
      return;
    }
    tries = 0; locked = false; reveal = false; mk = [];
    elB.textContent = L({ es:'Comprobar', en:'Check' });
    elB.className = 'gw-btn';
    draw();
    say(host, '', L({ es:'Nueva serie en el tablero.', en:'A new series on the board.' }));
  }

  elB.addEventListener('click', function(){
    if (done) return;
    if (locked){ advance(); return; }
    var c = R[rd], good = over(c);
    var missing = good.filter(function(i){ return mk.indexOf(i) === -1; }).length;
    var extra = mk.filter(function(i){ return good.indexOf(i) === -1; }).length;
    if (missing === 0 && extra === 0 && mk.length > 0){
      locked = true; reveal = true;
      elB.textContent = rd === 2 ? L({ es:'Terminar', en:'Finish' }) : L({ es:'Siguiente serie', en:'Next series' });
      elB.className = 'gw-btn solved';
      draw();
      say(host, 'good', L({ es:'Exacto: ', en:'Exactly: ' }) + good.length +
        L({ es:' lecturas por encima de la referencia. Ese conteo, con su horario, es lo que se reporta.',
            en:' readings above the reference. That count, with its time, is what gets reported.' }));
      return;
    }
    tries++;
    if (tries >= 3){
      locked = true; reveal = true;
      elB.textContent = rd === 2 ? L({ es:'Terminar', en:'Finish' }) : L({ es:'Siguiente serie', en:'Next series' });
      elB.className = 'gw-btn solved';
      draw();
      say(host, 'warm', L({ es:'Quedan señaladas las lecturas que rebasan la referencia: son ', en:'The readings above the reference are now marked: there are ' }) +
        good.length + L({ es:'. Compara cada barra con la altura de la línea dorada, no con las barras vecinas.',
                          en:'. Compare each bar with the height of the gold line, not with the neighbouring bars.' }));
      return;
    }
    if (mk.length === 0){
      say(host, 'miss', L({ es:'Todavía no marcas ninguna barra. Busca las que sobresalen por encima de la línea dorada.',
                            en:'You have not marked any bar yet. Look for the ones rising above the gold line.' }));
    } else if (extra > 0){
      say(host, 'miss', L({ es:'Marcaste una lectura que queda por debajo de la referencia: quítala y revisa la altura de la línea.',
                            en:'You marked a reading that stays below the reference: remove it and check the height of the line.' }));
    } else {
      say(host, 'miss', L({ es:'Vas bien, pero todavía queda al menos una lectura por encima de la referencia sin marcar.',
                            en:'You are on track, but at least one reading above the reference is still unmarked.' }));
    }
    draw();
  });

  draw();
}

function w4(rng, host){
  var R = pkN(rng, MAPS, 3);
  var rd = 0, tries = 0, locked = false, done = false, sel = -1, shown = false;

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Mapa de lecturas', en:'Map of readings' }) + '</div>' +
    '<div class="gw-q" data-r="ask"></div>' +
    '<div class="gw-mini">' + L({
      es:'Toca el punto donde es más probable que esté la fuente. Si te equivocas, el plano te dice hacia dónde crecen las lecturas.',
      en:'Tap the point where the source is most likely to be. If you miss, the plan tells you which way the readings grow.'
    }) + '</div>' +
    '<div class="mp-grid" data-r="grid"></div>' +
    '<div class="mp-comp" data-r="note"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk" disabled>' + L({ es:'Siguiente recorrido', en:'Next survey' }) + '</button></div>' +
    '<div class="gw-fb"></div>';

  var elA = host.querySelector('[data-r="ask"]'),
      elG = host.querySelector('[data-r="grid"]'),
      elN = host.querySelector('[data-r="note"]'),
      elB = host.querySelector('[data-r="chk"]');

  function srcIdx(c){
    var b = 0, i;
    for (i = 1; i < c.pts.length; i++) if (c.pts[i].v > c.pts[b].v) b = i;
    return b;
  }

  function draw(){
    var c = R[rd], mx = 0, i;
    for (i = 0; i < c.pts.length; i++) if (c.pts[i].v > mx) mx = c.pts[i].v;
    elA.innerHTML = L(c.intro);
    elN.innerHTML = L(c.note) + ' · ' + L({ es:'todas las lecturas son de ', en:'all readings are of ' }) + L(c.sub);
    var at = {}, s = srcIdx(c);
    for (i = 0; i < c.pts.length; i++) at[c.pts[i].r + '_' + c.pts[i].c] = i;
    var html = '';
    for (var r = 0; r < 3; r++){
      for (var col = 0; col < 3; col++){
        var k = r + '_' + col;
        if (at[k] !== undefined){
          var p = c.pts[at[k]], tier = p.v / mx < 0.4 ? 't1' : (p.v / mx < 0.75 ? 't2' : 't3');
          var extra = (sel === at[k] ? ' sel' : '') + (shown && at[k] === s ? ' found' : '');
          html += '<div class="mp-cell pt ' + tier + extra + '" data-p="' + at[k] + '">' +
            '<div class="mp-v">' + fmt(p.v) + c.unit + '</div><div class="mp-n">' + L(p.n) + '</div></div>';
        } else {
          html += '<div class="mp-cell">' + (c.fill[k] ? L(c.fill[k]) : '') + '</div>';
        }
      }
    }
    elG.innerHTML = html;
    elG.querySelectorAll('.mp-cell.pt').forEach(function(el){
      el.addEventListener('click', function(){
        if (locked || done) return;
        choose(parseInt(el.dataset.p, 10));
      });
    });
  }

  function dirTo(from, to){
    var parts = [];
    if (to.r < from.r) parts.push(L({ es:'hacia el norte', en:'towards the north' }));
    if (to.r > from.r) parts.push(L({ es:'hacia el sur', en:'towards the south' }));
    if (to.c < from.c) parts.push(L({ es:'hacia el poniente', en:'towards the west' }));
    if (to.c > from.c) parts.push(L({ es:'hacia el oriente', en:'towards the east' }));
    return parts.join(L({ es:' y ', en:' and ' }));
  }

  function choose(i){
    var c = R[rd], s = srcIdx(c);
    sel = i;
    if (i === s){
      locked = true; shown = true;
      elB.disabled = false;
      elB.textContent = rd === 2 ? L({ es:'Terminar', en:'Finish' }) : L({ es:'Siguiente recorrido', en:'Next survey' });
      elB.className = 'gw-btn solved';
      draw();
      say(host, 'good', L({ es:'Ahí está: la lectura mayor y el descenso de los puntos alrededor apuntan a ese sitio como fuente probable de ',
                            en:'There it is: the highest reading and the decline of the surrounding points point to that site as the likely source of ' }) + L(c.sub) + '.');
      return;
    }
    tries++;
    if (tries >= 3){
      locked = true; shown = true; sel = s;
      elB.disabled = false;
      elB.textContent = rd === 2 ? L({ es:'Terminar', en:'Finish' }) : L({ es:'Siguiente recorrido', en:'Next survey' });
      elB.className = 'gw-btn solved';
      draw();
      say(host, 'warm', L({ es:'Queda señalado el punto de la fuente probable: ', en:'The likely source point is now marked: ' }) +
        '<strong>' + L(c.pts[s].n) + '</strong>, ' + L({ es:'con ', en:'with ' }) + fmt(c.pts[s].v) + c.unit +
        L({ es:'. Las demás lecturas bajan conforme se alejan de ese punto.', en:'. The other readings drop as they move away from that point.' }));
      return;
    }
    draw();
    say(host, 'miss', L({ es:'Ahí la lectura es menor. Las lecturas crecen ', en:'The reading is lower there. The readings grow ' }) +
      dirTo(c.pts[i], c.pts[s]) + L({ es:' de ese punto.', en:' from that point.' }));
  }

  elB.addEventListener('click', function(){
    if (done) return;
    rd++;
    if (rd >= 3){
      done = true; rd = 2;
      elB.textContent = L({ es:'Completado', en:'Completed' });
      elB.className = 'gw-btn solved';
      elB.disabled = true;
      say(host, 'good', L({
        es:'Tres recorridos leídos. En los tres el rastro fue el mismo: seguir la dirección en la que crecen los números.',
        en:'Three surveys read. In all three the trail was the same: follow the direction in which the numbers grow.'
      }));
      return;
    }
    tries = 0; locked = false; shown = false; sel = -1;
    elB.disabled = true;
    elB.className = 'gw-btn';
    draw();
    say(host, '', L({ es:'Nuevo recorrido sobre el plano.', en:'A new survey on the plan.' }));
  });

  draw();
  say(host, '', L({ es:'Lee las lecturas y decide desde dónde se está liberando la sustancia.',
                    en:'Read the values and decide where the substance is being released from.' }));
}

function w5(rng, host){
  var R = pkN(rng, PAIRS, 3);
  var rd = 0, tries = 0, locked = false, done = false, pickd = null, shown = false;

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Comparador de fichas', en:'Record comparator' }) + '</div>' +
    '<div class="gw-q" data-r="ask"></div>' +
    '<div class="gw-mini">' + L({
      es:'Toca el renglón del dato que impide poner las dos lecturas una junto a la otra. Puedes cambiar de renglón las veces que quieras.',
      en:'Tap the row of the field that keeps the two readings from being placed side by side. You can change rows as often as you like.'
    }) + '</div>' +
    '<div class="fc-head"><div></div><div>' + L({ es:'Ficha A', en:'Record A' }) + '</div><div>' + L({ es:'Ficha B', en:'Record B' }) + '</div></div>' +
    '<div data-r="rows"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk" disabled>' + L({ es:'Siguiente par', en:'Next pair' }) + '</button></div>' +
    '<div class="gw-fb"></div>';

  var elA = host.querySelector('[data-r="ask"]'),
      elR = host.querySelector('[data-r="rows"]'),
      elB = host.querySelector('[data-r="chk"]');

  function val(o){ return (typeof o === 'string') ? o : L(o); }

  function draw(){
    var c = R[rd], html = '';
    elA.innerHTML = L(c.ctx);
    for (var i = 0; i < FKEYS.length; i++){
      var k = FKEYS[i].k;
      var cls = 'fc-row';
      if (pickd === k) cls += ' pickd';
      if (shown && k === c.bad) cls += ' block';
      if (shown && k !== c.bad && k !== 'fec' && val(c.a[k]) === val(c.b[k])) cls += ' same';
      html += '<div class="' + cls + '" data-k="' + k + '">' +
        '<div class="fc-k">' + L(FKEYS[i].n) + '</div>' +
        '<div class="fc-v">' + val(c.a[k]) + '</div>' +
        '<div class="fc-v">' + val(c.b[k]) + '</div></div>';
    }
    elR.innerHTML = html;
    elR.querySelectorAll('.fc-row').forEach(function(el){
      el.addEventListener('click', function(){
        if (locked || done) return;
        choose(el.dataset.k);
      });
    });
  }

  function choose(k){
    var c = R[rd];
    pickd = k;
    if (k === c.bad){
      locked = true; shown = true;
      elB.disabled = false;
      elB.textContent = rd === 2 ? L({ es:'Terminar', en:'Finish' }) : L({ es:'Siguiente par', en:'Next pair' });
      elB.className = 'gw-btn solved';
      draw();
      say(host, 'good', L(c.why));
      return;
    }
    tries++;
    if (tries >= 3){
      locked = true; shown = true; pickd = c.bad;
      elB.disabled = false;
      elB.textContent = rd === 2 ? L({ es:'Terminar', en:'Finish' }) : L({ es:'Siguiente par', en:'Next pair' });
      elB.className = 'gw-btn solved';
      draw();
      say(host, 'warm', L({ es:'Queda marcado el renglón que bloquea la comparación. ', en:'The row that blocks the comparison is now marked. ' }) + L(c.why));
      return;
    }
    draw();
    if (k === 'fec'){
      say(host, 'miss', L({ es:'Las fechas distintas no impiden comparar: son dos momentos del mismo seguimiento, y esa es justamente la información que interesa.',
                            en:'Different dates do not block the comparison: they are two moments of the same follow up, and that is exactly the information of interest.' }));
    } else {
      say(host, 'miss', L({ es:'Ese dato dice lo mismo en las dos fichas, así que no es el que estorba. Sigue buscando la diferencia.',
                            en:'That field says the same in both records, so it is not the one getting in the way. Keep looking for the difference.' }));
    }
  }

  elB.addEventListener('click', function(){
    if (done) return;
    rd++;
    if (rd >= 3){
      done = true; rd = 2;
      elB.textContent = L({ es:'Completado', en:'Completed' });
      elB.className = 'gw-btn solved';
      elB.disabled = true;
      say(host, 'good', L({
        es:'Tres pares revisados. Sistematizar es justamente esto: dejar a la vista sustancia, sitio, fecha, unidad, periodo y método para saber qué se puede comparar.',
        en:'Three pairs reviewed. Systematizing is exactly this: keeping substance, site, date, unit, period and method in sight to know what can be compared.'
      }));
      return;
    }
    tries = 0; locked = false; shown = false; pickd = null;
    elB.disabled = true;
    elB.className = 'gw-btn';
    draw();
    say(host, '', L({ es:'Otro par de fichas sobre la mesa.', en:'Another pair of records on the table.' }));
  });

  draw();
  say(host, '', L({ es:'Compara renglón por renglón antes de decidir.', en:'Compare row by row before deciding.' }));
}

      o:{ es:[ 'Expresa la misma proporción con cifras manejables, lo que reduce los errores al copiar y comparar valores muy pequeños.',
               'Convierte la proporción en una cantidad total, lo que permite saber cuánta sustancia hay en el sitio medido.',
               'Indica que la muestra es más segura, porque un número mayor corresponde siempre a una lectura aceptable.',
               'Sustituye al valor de referencia, porque las partes por millón ya incluyen el máximo recomendado.' ],
          en:[ 'It expresses the same proportion with manageable figures, which reduces mistakes when copying and comparing very small values.',
               'It turns the proportion into a total amount, which allows knowing how much substance there is at the measured site.',
               'It shows the sample is safer, because a larger number always corresponds to an acceptable reading.',
               'It replaces the reference value, because parts per million already include the recommended maximum.' ] },
      c:0,
      h:{ es:'Las dos escrituras dicen exactamente lo mismo. La ventaja hay que buscarla en el trabajo de quien anota, copia y compara decenas de datos.',
          en:'Both ways of writing say exactly the same thing. The advantage has to be looked for in the work of whoever writes down, copies and compares dozens of figures.' },
      e:{ es:'Ambas escrituras representan la misma proporción. Las partes por millón la escriben sin arrastrar ceros ni decimales, y cada cero de más es una oportunidad de equivocarse al vaciar el dato en una tabla.',
          en:'Both forms represent the same proportion. Parts per million write it without dragging zeros and decimals, and every extra zero is a chance to make a mistake when copying the figure into a table.' } },
    { t:{ es:'Cambio de escala en el reporte', en:'A change of scale in the report' },
      q:{ es:'Un boletín informa cierto plaguicida en partes por mil millones en lugar de partes por millón. ¿Qué indica esa elección de unidad?',
          en:'A bulletin reports a certain pesticide in parts per billion instead of parts per million. What does that choice of unit indicate?' },
      o:{ es:[ 'Que la sustancia se detecta en proporciones aún menores, y usar partes por millón obligaría a escribir varios decimales.',
               'Que la sustancia se volvió menos peligrosa, porque el laboratorio la mide en una escala más fina.',
               'Que la muestra analizada fue mil veces más grande que las muestras habituales de ese laboratorio.',
               'Que la lectura ya no necesita compararse con una referencia, porque la escala fina la sustituye.' ],
          en:[ 'That the substance is detected in even smaller proportions, and using parts per million would force writing several decimals.',
               'That the substance became less dangerous, because the laboratory measures it on a finer scale.',
               'That the analysed sample was a thousand times bigger than the usual samples of that laboratory.',
               'That the reading no longer needs to be compared with a reference, because the fine scale replaces it.' ] },
      c:0,
      h:{ es:'La unidad se elige por el tamaño de la proporción que se quiere escribir, no por el daño que causa la sustancia.',
          en:'The unit is chosen according to the size of the proportion to be written, not according to the harm the substance causes.' },
      e:{ es:'Las partes por mil millones se usan cuando la sustancia aparece en proporciones todavía más pequeñas que las partes por millón. Es una decisión de escritura: el peligro depende de la sustancia y de su referencia, no de la unidad elegida.',
          en:'Parts per billion are used when the substance appears in proportions even smaller than parts per million. It is a decision about writing: the danger depends on the substance and its reference, not on the chosen unit.' } }
  ]));
}

function mkP3(rng){
  return useVariant(pk(rng, [
    { t:{ es:'La unidad y su compartimento', en:'The unit and its compartment' },
      q:{ es:'Un equipo escolar toma tierra del patio, la envía al laboratorio y anota el resultado de plomo como 35 mg/L. ¿Qué error contiene ese registro?',
          en:'A school team takes soil from the yard, sends it to the laboratory and writes down the lead result as 35 mg/L. What error does that record contain?' },
      o:{ es:[ 'La muestra es sólida y su proporción se establece contra la masa de suelo seco, no contra un volumen de líquido.',
               'El plomo del suelo debe informarse siempre en gramos, porque los miligramos son una unidad de laboratorio.',
               'Falta anotar la hora de la toma, que es el dato que vuelve válida cualquier unidad de concentración.',
               'La lectura debía escribirse en partes por mil millones, porque el plomo es un metal pesado.' ],
          en:[ 'The sample is solid and its proportion is set against the mass of dry soil, not against a volume of liquid.',
               'Lead in soil must always be reported in grams, because milligrams are a laboratory unit.',
               'The time of sampling is missing, and that is the field that makes any concentration unit valid.',
               'The reading should have been written in parts per billion, because lead is a heavy metal.' ] },
      c:0,
      h:{ es:'Revisa qué aparece abajo de la proporción y pregúntate si eso se puede medir en el compartimento del que se tomó la muestra.',
          en:'Check what appears at the bottom of the proportion and ask whether that can be measured in the compartment the sample came from.' },
      e:{ es:'El litro mide volumen de líquido y sirve para el agua. En suelo la muestra se seca y se pesa, de modo que la concentración se informa como masa de sustancia por masa de suelo, en miligramos por kilogramo.',
          en:'The litre measures volume of liquid and works for water. In soil the sample is dried and weighed, so the concentration is reported as mass of substance per mass of soil, in milligrams per kilogram.' } },
    { t:{ es:'Un dato de aire mal anotado', en:'A badly written air figure' },
      q:{ es:'El reporte de una estación de monitoreo aparece con la leyenda ozono: 0.08 mg/kg de aire. La maestra pide revisar el registro antes de vaciarlo en la tabla. ¿Qué corresponde corregir?',
          en:'The report of a monitoring station appears with the line ozone: 0.08 mg/kg of air. The teacher asks to review the record before copying it into the table. What has to be corrected?' },
      o:{ es:[ 'La unidad, porque el ozono es un gas dentro de otro gas y su proporción se establece entre volúmenes, no entre masas.',
               'El nombre de la sustancia, porque el ozono se registra siempre junto con las partículas suspendidas.',
               'El número, porque ninguna lectura de aire puede tener decimales en un boletín de monitoreo.',
               'El sitio, porque las estaciones de monitoreo solo pueden informar lecturas de agua y de suelo.' ],
          en:[ 'The unit, because ozone is a gas inside another gas and its proportion is set between volumes, not between masses.',
               'The name of the substance, because ozone is always recorded together with suspended particles.',
               'The number, because no air reading can carry decimals in a monitoring bulletin.',
               'The site, because monitoring stations can only report water and soil readings.' ] },
      c:0,
      h:{ es:'Piensa en qué estado están el contaminante y la muestra en este caso, y en qué se puede pesar con una balanza.',
          en:'Think about the state of the pollutant and of the sample in this case, and about what can be weighed on a balance.' },
      e:{ es:'El kilogramo pertenece a las muestras que se pesan, como el suelo. Para un gas dentro del aire la proporción se expresa entre volúmenes: partes de gas por millón de partes de aire.',
          en:'The kilogram belongs to samples that are weighed, such as soil. For a gas inside air the proportion is expressed between volumes: parts of gas per million parts of air.' } }
  ]));
}

function mkP4(rng){

      q:{ es:'La estación del barrio informa el monóxido de carbono en partes por millón. ¿Qué compara exactamente esa lectura?',
          en:'The neighbourhood station reports carbon monoxide in parts per million. What exactly does that reading compare?' },
      o:{ es:[ 'El volumen del gas contaminante frente al volumen total del aire de la muestra.',
               'La masa del gas contaminante frente a la masa del equipo que realiza la medición.',
               'El volumen del gas contaminante frente al volumen de agua que contiene la humedad del aire.',
               'La masa de las partículas depositadas frente a la superficie del terreno que las recibe.' ],
          en:[ 'The volume of the polluting gas against the total volume of air in the sample.',
               'The mass of the polluting gas against the mass of the equipment taking the measurement.',
               'The volume of the polluting gas against the volume of water held in the humidity of the air.',
               'The mass of deposited particles against the surface of the ground that receives them.' ] },
      c:0,
      h:{ es:'Tanto el contaminante como la muestra son gases. Pregúntate qué propiedad comparten y resulta cómodo comparar en ese caso.',
          en:'Both the pollutant and the sample are gases. Ask which property they share that is convenient to compare in that case.' },
      e:{ es:'En aire la proporción se establece entre volúmenes: cuántos volúmenes del gas hay por cada millón de volúmenes de aire. Por eso el reporte declara también la temperatura y la presión, que modifican el volumen del gas.',
          en:'In air the proportion is set between volumes: how many volumes of the gas there are for every million volumes of air. That is why the report also declares temperature and pressure, which change the volume of the gas.' } },
    { t:{ es:'El caso de las partículas', en:'The case of particles' },
      q:{ es:'Las partículas suspendidas del aire se informan en microgramos por metro cúbico y no en partes por millón. ¿Cuál es la razón de esa diferencia?',
          en:'Suspended particles in air are reported in micrograms per cubic metre and not in parts per million. What is the reason for that difference?' },
      o:{ es:[ 'Son material sólido flotando en el aire y no un gas que ocupe una fracción del volumen, así que se pesa la masa contenida en un volumen conocido.',
               'Son un contaminante más reciente que los gases y todavía no existe una escala de proporción para describirlas.',
               'Provienen siempre del suelo, de modo que conservan las unidades con las que se informan las muestras de tierra.',
               'Se miden en interiores y no en el aire libre, por lo que necesitan una unidad distinta de la del monitoreo urbano.' ],
          en:[ 'They are solid material floating in the air and not a gas occupying a fraction of the volume, so the mass contained in a known volume is weighed.',
               'They are a more recent pollutant than gases and no proportion scale exists yet to describe them.',
               'They always come from the soil, so they keep the units used for reporting earth samples.',
               'They are measured indoors and not in open air, so they need a unit different from the one used in urban monitoring.' ] },
      c:0,
      h:{ es:'Compara el estado físico de un gas contaminante con el de una partícula suspendida y piensa qué se puede comparar con el volumen del aire.',
          en:'Compare the physical state of a polluting gas with that of a suspended particle and think about what can be compared with the volume of the air.' },
      e:{ es:'Las partes por millón en aire comparan volúmenes de gas. Una partícula es materia sólida en suspensión, así que el equipo aspira un volumen conocido de aire, retiene lo sólido y lo pesa: masa por metro cúbico.',
          en:'Parts per million in air compare volumes of gas. A particle is solid matter in suspension, so the equipment draws in a known volume of air, retains the solids and weighs them: mass per cubic metre.' } }

function mkP5(rng){

    { t:{ es:'La referencia correcta', en:'The right reference' },
      q:{ es:'Una estación informa 0.09 ppm de ozono como promedio de una hora. La referencia que el grupo tiene a la mano está definida como promedio de ocho horas. ¿Qué corresponde hacer antes de afirmar en la asamblea que se rebasó la referencia?',
          en:'A station reports 0.09 ppm of ozone as a one hour average. The reference the group has at hand is defined as an eight hour average. What should be done before stating at the assembly that the reference was exceeded?' },
      o:{ es:[ 'Buscar la referencia definida para el mismo periodo de promedio, porque un valor horario y uno de ocho horas describen exposiciones distintas.',
               'Repetir la medición con otro equipo, porque una sola estación nunca puede confirmar que hubo una excedencia.',
               'Informar la lectura sin ninguna referencia, porque los valores de aire se leen por sí solos en cada boletín.',
               'Comparar la lectura con la referencia del agua de bebida, que es la más exigente de todas y protege mejor.' ],
          en:[ 'Look for the reference defined for the same averaging period, because an hourly value and an eight hour one describe different exposures.',
               'Repeat the measurement with other equipment, because a single station can never confirm an exceedance.',
               'Report the reading with no reference at all, because air values can be read on their own in each bulletin.',
               'Compare the reading with the drinking water reference, which is the strictest of all and protects better.' ] },
      c:0,
      h:{ es:'Fíjate en que el dato y la referencia traen cada uno un periodo. Pregúntate si describen el mismo tiempo de exposición.',
          en:'Notice that the figure and the reference each carry a period. Ask whether they describe the same exposure time.' },
      e:{ es:'La referencia de aire se define junto con un periodo de promedio, porque el daño depende del tiempo que se respire el contaminante. Un dato de una hora se juzga contra una referencia de una hora, no contra una de ocho.',
