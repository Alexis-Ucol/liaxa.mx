<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bacterias y Virus: Características y Propagación</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; text-align: justify; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Bacterias y Virus: Características y Propagación</div>
    <div class="wcourse" id="wcourse-el">Biología · 1° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Bacterias y Virus: Características y Propagación</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="sbtn" id="dlBtn" onclick="generatePDF()" style="max-width:280px;margin:0 auto;">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   CENTRALIZED SCHOOL CONFIG (Rule 16) — ships UNBRANDED (Rule 11).
   The ONLY rebranding point. build_all.py substitutes these exact fields
   (BRAND_FIELDS / RGB_FIELDS / logo*) downstream; :root/dark stay as fallback.
   Neutral defaults below == the static :root/dark values, so unbranded == no-op.
   ══════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:'#243c6c', primaryDark:'#14223f', primaryBg:'#e9edf4',
  accent:'#9cb4cc', accentBg:'#e7edf3',
  darkPrimary:'#5575b4', darkPrimaryDark:'#839fd7', darkPrimaryBg:'#121d34',

function setLang(l){

/* ── Attempt counter + seed (Rule 4): seed = name+group+attempt ── */
function getAttemptKey(name, group){ return 'bio1_t09_g01__att__' + (name+'__'+group).replace(/\s+/g,'_'); }
function nextAttempt(name, group){ var k=getAttemptKey(name,group),n=0; try{n=parseInt(localStorage.getItem(k)||'0',10)||0;}catch(e){} n++; try{localStorage.setItem(k,String(n));}catch(e){} return n; }
function currentAttempt(name, group){ var k=getAttemptKey(name,group); try{return parseInt(localStorage.getItem(k)||'1',10)||1;}catch(e){return 1;} }
/* ================================================
   STATE
   ================================================ */
var studentData   = {};
var problems      = [];

/* ================================================
   SESSION PERSISTENCE  (localStorage)
   ================================================ */
function lsKey() {
  var n = (studentData.name  || '').trim();
  var g = (studentData.group || '').trim();
  return 'bio1_t09_g01__' + (n + '__' + g).replace(/\s+/g, '_');
}

function saveSession() {
  if (!studentData.name) return;
  var drawings = [], texts = [], photos = [];
  problems.forEach(function(p, i) {
    var dc = document.getElementById('dc' + i);
    if (dc && dc.width) {
      var blank = document.createElement('canvas');
      blank.width = dc.width; blank.height = dc.height;
      drawings.push(dc.toDataURL() === blank.toDataURL() ? null : dc.toDataURL('image/png'));
    } else { drawings.push(null); }
    var ta = document.getElementById('ta' + i);
    texts.push(ta ? ta.value : '');
    var pp = document.getElementById('pp' + i);
    photos.push((pp && pp.src && pp.src.indexOf('data:') === 0) ? pp.src : null);
  });
  var state = {
    name: studentData.name, group: studentData.group,
    answeredCount: answeredCount, correctCount: correctCount,
    choices: problems.map(function(p) { return p.studentChoice; }),
    drawings: drawings, texts: texts, photos: photos
  };
  try { localStorage.setItem(lsKey(), JSON.stringify(state)); } catch(e) {}
}

function loadSession(name, group) {
  var key = 'bio1_t09_g01__' + (name + '__' + group).replace(/\s+/g, '_');
  try { var r = localStorage.getItem(key); return r ? JSON.parse(r) : null; } catch(e) { return null; }
}

  document.getElementById('restoreBar').style.display = 'none';

  answeredCount = 0; correctCount = 0;
  var att = currentAttempt(name, group);

  document.getElementById('lessonScreen').style.display  = 'block';

  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

  function _openPdfInline(b){
    var u = URL.createObjectURL(b);
    var w = window.open(u, '_blank');
    if (!w) { window.location.href = u; }
    setTimeout(function(){ URL.revokeObjectURL(u); }, 60000);
  }

  var _isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
               (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  if (_isIOS) {
    var _pdfFile = new File([_pdfBlob], _fname, { type:'application/pdf' });
    if (navigator.canShare && navigator.canShare({ files:[_pdfFile] })) {
      navigator.share({ files:[_pdfFile], title:_fname })
        .then(_restorePdfBtn)
        .catch(function(e){
          if (e && e.name === 'AbortError') { _restorePdfBtn(); return; }
          _openPdfInline(_pdfBlob); _restorePdfBtn();
        });
      return;
    }
    _openPdfInline(_pdfBlob); _restorePdfBtn();
    return;
  }

  var _dlUrl = URL.createObjectURL(_pdfBlob);
  var _dlA   = document.createElement('a');
  _dlA.href  = _dlUrl; _dlA.download = _fname;

   GUIA :: Bacterias y virus, características y propagación.
   Qué es una bacteria y qué es un virus, la cadena de contagio, por qué las
   enfermedades infecciosas se propagan tan rápido, cómo se formula y se
   contrasta una hipótesis, y qué hacen las vacunas para la persona y para la
   comunidad, con sus beneficios, sus costos y sus límites.

function L(o){ return (o && o[LANG] !== undefined) ? o[LANG] : (o ? o.es : ''); }
function ri(rng, a, b){ return a + Math.floor(rng() * (b - a + 1)); }
function pk(rng, a){ return a[Math.floor(rng() * a.length)]; }
function clampn(v, a, b){ return v < a ? a : (v > b ? b : v); }
function perm(n, rng){ var a = [], i; for (i = 0; i < n; i++) a.push(i); return shuffle(a, rng); }

function say(host, cls, msg){
  var e = host.querySelector('.gw-fb');
  if (!e) return;
  e.className = 'gw-fb' + (cls ? ' ' + cls : '');
  e.innerHTML = msg;
}

}

function addProblem(rng, v){
  var idx = problems.length;
  var opts = L(v.opts).slice();
  var correctVal = opts[v.ci];
  var sh = shuffle(opts, rng);
  var prob = {
    title: L(v.title),
    questionText: L(v.q),
    fn: '',
    hint: L(v.hint),
    explanation: L(v.exp),
    options: sh,
    correctIdx: sh.indexOf(correctVal),
    showWork: !!v.showWork,
    studentChoice: null,
    pendingChoice: null
  };
  problems.push(prob);
  buildOneCard(prob, idx);
}

   ══════════════════════════════════════════════════════════════════════════ */
function wClasifica(rng, host){
  var BINS = [{ es:'Bacteria', en:'Bacterium' }, { es:'Virus', en:'Virus' }, { es:'Las dos', en:'Both' }];
  var POOL = [
    { t:{ es:'Es una célula completa, con su membrana y su pared', en:'It is a complete cell, with its membrane and its wall' }, b:0,
      k:{ es:'De los dos, solo uno es una célula. El otro ni siquiera llega a serlo.', en:'Of the two, only one is a cell. The other one does not even get that far.' } },
    { t:{ es:'Para hacer copias de sí mismo tiene que meterse dentro de una célula viva', en:'To make copies of itself it has to get inside a living cell' }, b:1,
      k:{ es:'Pregúntate cuál de los dos tiene maquinaria propia para reproducirse.', en:'Ask yourself which of the two has its own machinery to reproduce.' } },
    { t:{ es:'Guarda material genético con las instrucciones para hacer copias', en:'It holds genetic material with the instructions to make copies' }, b:2,
      k:{ es:'Fíjate si esto le falta a alguno de los dos. Si no le falta a ninguno, hay una caja para eso.', en:'Check whether either of the two lacks this. If neither does, there is a box for that.' } },
    { t:{ es:'Se reproduce sola partiéndose en dos, si tiene alimento y calor', en:'It reproduces on its own by splitting in two, given food and warmth' }, b:0,
      k:{ es:'Piensa quién puede multiplicarse en un caldo, sin ninguna célula alrededor.', en:'Think who can multiply in a broth, with no cell around.' } },
    { t:{ es:'Es material genético envuelto en una cápsula de proteína, y nada más', en:'It is genetic material wrapped in a protein capsule, and nothing else' }, b:1,
      k:{ es:'Una célula tiene mucho más que eso adentro.', en:'A cell has a lot more than that inside.' } },
    { t:{ es:'Los antibióticos pueden detenerla', en:'Antibiotics can stop it' }, b:0,
      k:{ es:'El antibiótico ataca partes de una célula. Si no hay célula, no hay dónde atacar.', en:'An antibiotic attacks parts of a cell. With no cell, there is nothing to attack.' } },
    { t:{ es:'Puede provocar una enfermedad que pasa de una persona a otra', en:'It can cause a disease that passes from one person to another' }, b:2,
      k:{ es:'Recuerda la gripe y recuerda una infección de garganta. ¿Las causa el mismo tipo de microbio?', en:'Think of the flu and think of a throat infection. Are they caused by the same kind of microbe?' } },
    { t:{ es:'Muchas viven en tu intestino y te ayudan a digerir los alimentos', en:'Many live in your gut and help you digest food' }, b:0,
      k:{ es:'Esto lo hace algo que está vivo y se sostiene por sí mismo dentro de ti.', en:'This is done by something alive that keeps itself going inside you.' } },
    { t:{ es:'Es unas cien veces más pequeño que el otro y no se ve en un microscopio escolar', en:'It is about a hundred times smaller than the other and is invisible in a school microscope' }, b:1,
      k:{ es:'En el microscopio de la escuela se alcanzan a ver bastoncitos y puntitos. Uno de los dos ni así aparece.', en:'A school microscope does show little rods and dots. One of the two does not show up even then.' } }
  ];

  var order = perm(POOL.length, rng).slice(0, 6);
  var st = { i: 0, tries: 0, hits: 0, done: false };

  function cur(){ return POOL[order[st.i]]; }

  function render(){
    if (st.done){
      host.innerHTML =
        '<div class="gw-h iw-tag">' + L({ es:'Bacteria, virus o las dos', en:'Bacterium, virus or both' }) + '</div>' +
        '<div class="gw-live">' + L({
          es:'Terminaste la tanda con ' + st.hits + ' de ' + order.length + ' al primer intento. Lo que separa a los dos no es el tamaño: es que uno es una célula que se basta a sí misma y el otro necesita entrar en una para existir.',
          en:'You finished the run with ' + st.hits + ' of ' + order.length + ' on the first try. What separates the two is not size: one is a cell that stands on its own and the other needs to get inside one in order to exist.'
        }) + '</div>';
      return;
    }
    host.innerHTML =
      '<div class="gw-h iw-tag">' + L({ es:'Bacteria, virus o las dos', en:'Bacterium, virus or both' }) + '</div>' +
      '<div class="cl-prog">' + (st.i + 1) + ' / ' + order.length + '</div>' +
      '<div class="gw-mini iw-sub">' + L({
        es:'Manda cada característica a la caja donde le toca. Si te equivocas puedes volver a mandarla.',
        en:'Send each feature to the box where it belongs. If you get it wrong you can send it again.'
      }) + '</div>' +
      '<div class="cl-card">' + L(cur().t) + '</div>' +
      '<div class="cl-bins">' + BINS.map(function(b, bi){
        return '<button class="gw-tile" data-b="' + bi + '" style="text-align:center">' + L(b) + '</button>';
      }).join('') + '</div>' +
      '<div class="gw-fb">' + L({ es:'Elige una caja.', en:'Pick a box.' }) + '</div>';
    host.querySelectorAll('.gw-tile').forEach(function(btn){
      btn.addEventListener('click', function(){ pickBin(parseInt(btn.getAttribute('data-b'), 10)); });
    });
  }

  function advance(){
    st.i++; st.tries = 0;
    if (st.i >= order.length) st.done = true;
    setTimeout(render, 900);
  }

  function pickBin(bi){
    var it = cur();
    if (bi === it.b){
      if (st.tries === 0) st.hits++;
      say(host, 'good', L({
        es:'✓ Va en ' + L(BINS[it.b]) + '. ' + L(it.k),
        en:'✓ It goes in ' + L(BINS[it.b]) + '. ' + L(it.k)
      }));
      advance();
      return;
    }
    st.tries++;
    if (st.tries >= 3){
      say(host, 'warm', L({
        es:'Va en <b>' + L(BINS[it.b]) + '</b>. ' + L(it.k),
        en:'It goes in <b>' + L(BINS[it.b]) + '</b>. ' + L(it.k)
      }));
      advance();
      return;
    }
    say(host, 'miss', L({
      es:'Todavía no. ' + L(it.k),
      en:'Not yet. ' + L(it.k)
    }));
  }

  render();
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 2 :: la cadena de contagio  (data-widget="timeline")
   Cinco eslabones desordenados de un brote real de escuela. El alumno toca
   una ficha y luego otra para intercambiarlas, cuantas veces quiera. Al fallar
   se le dice cuál eslabon esta fuera de lugar, no solo que esta mal.
   ══════════════════════════════════════════════════════════════════════════ */
function wCadena(rng, host){
  var CASOS = [
    { n:{ es:'Gripe en el salón', en:'Flu in the classroom' },
      p:[
        { es:'Un alumno con gripe llega al salón y se sienta en su lugar', en:'A student with the flu arrives in the classroom and sits down' },
        { es:'Estornuda y salen gotitas diminutas con el virus', en:'He sneezes and tiny droplets carrying the virus come out' },
        { es:'Las gotitas quedan flotando en el aire del salón cerrado', en:'The droplets stay floating in the air of the closed classroom' },
        { es:'Una compañera respira ese aire y el virus entra por su nariz', en:'A classmate breathes that air and the virus gets in through her nose' },
        { es:'Días después ella también estornuda y ya puede contagiar', en:'Days later she is sneezing too and can already pass it on' }
      ] },
    { n:{ es:'Diarrea después del recreo', en:'Diarrhoea after break' },
      p:[
        { es:'Una persona enferma del estómago va al baño y no se lava bien las manos', en:'Someone with a stomach illness uses the toilet and does not wash their hands well' },
        { es:'La bacteria sale en sus manos y llega al agua que se guarda en el garrafón', en:'The bacterium leaves on their hands and reaches the water kept in the jug' },
        { es:'Esa agua sin hervir se sirve en el bebedero de la escuela', en:'That unboiled water is served at the school drinking fountain' },
        { es:'Un alumno bebe del bebedero y la bacteria entra por su boca', en:'A student drinks from the fountain and the bacterium enters through his mouth' },
        { es:'La bacteria se multiplica en su intestino y empieza la diarrea', en:'The bacterium multiplies in his gut and the diarrhoea starts' }
      ] },
    { n:{ es:'Una herida y una manija', en:'A wound and a door handle' },
      p:[
        { es:'Un alumno trae una herida en la mano con bacterias adentro', en:'A student has a wound on his hand with bacteria inside' },
        { es:'Se toca la herida y las bacterias quedan en sus dedos', en:'He touches the wound and the bacteria end up on his fingers' },
        { es:'Con esos dedos abre la puerta y las deja en la manija', en:'With those fingers he opens the door and leaves them on the handle' },
        { es:'Otra alumna toma la misma manija y después se frota el ojo', en:'Another student grabs the same handle and then rubs her eye' },
        { es:'Las bacterias entran por el ojo y aparece la infección', en:'The bacteria get in through the eye and the infection appears' }
      ] }
  ];
  var caso = pk(rng, CASOS);
  var n = caso.p.length;
  var st = { ord: perm(n, rng), sel: null, tries: 0, done: false };
  if (st.ord.every(function(v, i){ return v === i; })) { var a = st.ord[0]; st.ord[0] = st.ord[n - 1]; st.ord[n - 1] = a; }

  function render(){
    host.innerHTML =
      '<div class="gw-h iw-tag">' + L({ es:'La cadena de contagio', en:'The chain of infection' }) + '</div>' +
      '<div class="gw-q">' + L(caso.n) + '</div>' +
      '<div class="gw-mini iw-sub">' + L({
        es:'Los cinco eslabones están revueltos. Toca una ficha y luego otra para intercambiarlas hasta que la cadena quede en el orden en que ocurre.',
        en:'The five links are jumbled. Tap one chip and then another to swap them until the chain reads in the order it happens.'
      }) + '</div>' +
      '<div class="tl-list">' + st.ord.map(function(ei, pos){
        var cls = 'tl-chip' + (st.sel === pos ? ' sel' : '') + (st.done ? ' lock' : '');
        return '<div class="' + cls + '" data-p="' + pos + '"><span class="tl-num">' + (pos + 1) + '</span><span>' + L(caso.p[ei]) + '</span></div>';
      }).join('') + '</div>' +
      (st.done ? '' : '<div class="gw-row"><button class="gw-btn" data-r="check">' + L({ es:'Revisar la cadena', en:'Check the chain' }) + '</button></div>') +
      '<div class="gw-fb">' + L({
        es:'Cada eslabón tiene que hacer posible el siguiente.',
        en:'Each link has to make the next one possible.'
      }) + '</div>';
    host.querySelectorAll('.tl-chip').forEach(function(ch){
      ch.addEventListener('click', function(){ tap(parseInt(ch.getAttribute('data-p'), 10)); });
    });
    var c = host.querySelector('[data-r="check"]');
    if (c) c.addEventListener('click', check);
  }

  function tap(pos){
    if (st.done) return;
    if (st.sel === null) st.sel = pos;
    else if (st.sel === pos) st.sel = null;
    else { var t = st.ord[st.sel]; st.ord[st.sel] = st.ord[pos]; st.ord[pos] = t; st.sel = null; }
    render();
  }

  function check(){
    if (st.done) return;
    var ok = st.ord.every(function(ei, pos){ return ei === pos; });
    if (ok){
      st.done = true; render();
      say(host, 'good', L({
        es:'🎉 Así ocurre. Y fíjate en algo: si rompes cualquiera de los cinco eslabones, el contagio se detiene ahí.',
        en:'🎉 That is how it happens. And notice something: if you break any of the five links, the spread stops right there.'
      }));
      return;
    }
    st.tries++;
    var bad = 0;
    for (var i = 0; i < n; i++){ if (st.ord[i] !== i) { bad = i; break; } }
    if (st.tries >= 3){
      st.ord = caso.p.map(function(_, i){ return i; });
      st.done = true; render();
      say(host, 'warm', L({
        es:'Esta es la cadena completa. Léela de arriba abajo y verás que el microbio primero sale de alguien, luego viaja por algún camino y al final entra en alguien más.',
        en:'This is the full chain. Read it top to bottom and you will see that the microbe first leaves someone, then travels along some route and finally gets into someone else.'
      }));
      return;
    }
    say(host, 'miss', L({
      es:'Todavía no. Mira la ficha número ' + (bad + 1) + ': para que eso pase, ¿qué tuvo que ocurrir antes?',
      en:'Not yet. Look at chip number ' + (bad + 1) + ': for that to happen, what had to happen first?'
    }));
  }

  render();
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 3 :: el simulador de rondas  (data-widget="contagio")
   El alumno mueve cuántas personas contagia cada enfermo y enciende medidas.
   Las cinco barras y el conteo se recalculan en el momento, sin botones de
   por medio, para que vea que quitar un solo contacto cambia todo el brote.
   ══════════════════════════════════════════════════════════════════════════ */
function wPropaga(rng, host){
  var META = pk(rng, [35, 40, 45]);
  var C0 = pk(rng, [3, 4]);
  var MED = [
    { es:'Lavarse las manos con jabón', en:'Washing hands with soap' },
    { es:'Ventilar el salón y abrir las ventanas', en:'Airing the classroom and opening the windows' },
    { es:'Quedarse en casa al primer síntoma', en:'Staying home at the first symptom' }
  ];
  var st = { c: C0, med: [false, false, false], tries: 0, done: false };

  function eff(){
    var r = st.c;
    for (var i = 0; i < 3; i++) if (st.med[i]) r--;
    return clampn(r, 1, 6);
  }
  function serie(){ var e = eff(), a = [1], v = 1, i; for (i = 0; i < 4; i++){ v = v * e; a.push(v); } return a; }
  function total(){ var a = serie(), s = 0, i; for (i = 0; i < a.length; i++) s += a[i]; return s; }

  host.innerHTML =
    '<div class="gw-h iw-tag">' + L({ es:'Cuatro rondas de contagio', en:'Four rounds of spread' }) + '</div>' +
    '<div class="gw-q">' + L({ es:'Meta: terminar la ronda 4 con ' + META + ' contagiados o menos', en:'Goal: finish round 4 with ' + META + ' infected or fewer' }) + '</div>' +
    '<div class="gw-mini iw-sub">' + L({
      es:'Todo empieza con una sola persona enferma. Mueve cuántas personas contagia cada enferma en una ronda y enciende las medidas que quieras: cada medida le quita un contacto. Los números cambian mientras mueves.',
      en:'Everything starts with a single sick person. Move how many people each sick person infects in one round and switch on any measures you like: each measure removes one contact. The numbers change as you move.'
    }) + '</div>' +
    '<div class="gw-lbl">' + L({ es:'Personas que contagia cada enfermo', en:'People each sick person infects' }) + '</div>' +
    '<input class="gw-range" type="range" min="1" max="6" step="1" value="' + C0 + '" data-r="c">' +
    '<div class="gw-num" data-r="cv"></div>' +
    '<div class="gw-lbl">' + L({ es:'Medidas encendidas', en:'Measures switched on' }) + '</div>' +
    '<div class="gw-grid" data-r="med"></div>' +
    '<div class="pg-rows" data-r="rows"></div>' +
    '<div class="pg-dots" data-r="dots"></div>' +
    '<div class="gw-live" data-r="live"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="check">' + L({ es:'Comprobar el brote', en:'Check the outbreak' }) + '</button></div>' +
    '<div class="gw-fb">' + L({ es:'Prueba combinaciones: puedes cambiarlas todas las veces que quieras.', en:'Try combinations: you can change them as many times as you like.' }) + '</div>';

  var elC = host.querySelector('[data-r="c"]'),
      elCV = host.querySelector('[data-r="cv"]'),
      elMed = host.querySelector('[data-r="med"]'),
      elRows = host.querySelector('[data-r="rows"]'),
      elDots = host.querySelector('[data-r="dots"]'),
      elLive = host.querySelector('[data-r="live"]'),
      elChk = host.querySelector('[data-r="check"]');

  function renderMed(){
    elMed.innerHTML = MED.map(function(m, i){
      return '<button class="gw-tile' + (st.med[i] ? ' on' : '') + '" data-i="' + i + '"' + (st.done ? ' disabled' : '') + '>' + L(m) + '</button>';
    }).join('');
    elMed.querySelectorAll('.gw-tile').forEach(function(b){
      b.addEventListener('click', function(){
        if (st.done) return;
        var i = parseInt(b.getAttribute('data-i'), 10);
        st.med[i] = !st.med[i];
        renderMed(); update();
      });
    });
  }

  function update(){
    var a = serie(), tot = total(), mx = a[a.length - 1] || 1, i;
    elCV.textContent = st.c + ' ' + L({ es:'contactos', en:'contacts' });
    var rows = '';
    for (i = 0; i < a.length; i++){
      var w = clampn(Math.round(a[i] / mx * 100), 3, 100);
      rows += '<div class="pg-row"><span class="pg-lab">' + L({ es:'Ronda ', en:'Round ' }) + i + '</span>' +
        '<span class="pg-track"><span class="pg-fill' + (a[i] > META ? ' hi' : '') + '" style="width:' + w + '%"></span></span>' +
        '<span class="pg-val">' + a[i] + '</span></div>';
    }
    elRows.innerHTML = rows;
    var lit = clampn(tot, 0, 48), dots = '';
    for (i = 0; i < 48; i++) dots += '<span class="pg-dot' + (i < lit ? ' on' : '') + '"></span>';
    elDots.innerHTML = dots;
    var extra = tot > META
      ? L({ es:' Todavía está por encima de la meta: te sobran ' + (tot - META) + '.', en:' Still above the goal: you are over by ' + (tot - META) + '.' })
      : L({ es:' Ya estás dentro de la meta.', en:' You are already within the goal.' });
    elLive.innerHTML = L({
      es:'Cada enfermo contagia a ' + eff() + '. Al terminar la ronda 4 habría <b>' + tot + '</b> contagiados.',
      en:'Each sick person infects ' + eff() + '. By the end of round 4 there would be <b>' + tot + '</b> infected.'
    }) + extra;
  }

  function check(){
    if (st.done) return;
    var tot = total();
    if (tot <= META){
      st.done = true; renderMed(); update();
      elChk.disabled = true;
      say(host, 'good', L({
        es:'🎉 Lo lograste con ' + tot + ' contagiados. Fíjate en lo que hiciste: no curaste a nadie, solo bajaste el número de personas que cada enfermo alcanza. Ahí está la respuesta a por qué estas enfermedades se propagan tan rápido y por qué medidas tan sencillas funcionan.',
        en:'🎉 You did it with ' + tot + ' infected. Notice what you did: you cured nobody, you only lowered how many people each sick person reaches. That is the answer to why these diseases spread so fast and why such simple measures work.'
      }));
      return;
    }
    st.tries++;
    if (st.tries >= 3){
      st.c = 3; st.med = [true, false, false];
      st.done = true; renderMed(); update();
      elChk.disabled = true;
      say(host, 'warm', L({
        es:'Mira esta combinación: con 3 contactos y una sola medida encendida, cada enfermo alcanza a 2 personas y el brote termina en 31. Con 3 alcanzados por enfermo serían 121. Un contacto de diferencia, cuatro veces más enfermos.',
        en:'Look at this combination: with 3 contacts and a single measure switched on, each sick person reaches 2 people and the outbreak ends at 31. With 3 reached per sick person it would be 121. One contact of difference, four times as many sick people.'
      }));
      return;
    }
    say(host, 'miss', L({
      es:'Vas en ' + tot + ' y la meta es ' + META + '. No bajes solo un poco: quita un contacto entero, encendiendo una medida más o moviendo el control, y vuelve a mirar la ronda 4.',
      en:'You are at ' + tot + ' and the goal is ' + META + '. Do not shave a little: remove a whole contact, by switching on one more measure or moving the control, and look at round 4 again.'
    }));
  }

  elC.addEventListener('input', function(){ if (st.done) return; st.c = parseInt(elC.value, 10); update(); });
  elChk.addEventListener('click', check);
  renderMed(); update();
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 4 :: arma una hipótesis  (data-widget="hipotesis")
   Tres casos. En cada uno el alumno elige una causa posible y una predicción
   y la frase se arma sola arriba. Solo una pareja se puede poner a prueba;
   las demás reciben la razón exacta por la que no sirven.
   ══════════════════════════════════════════════════════════════════════════ */
function wHipotesis(rng, host){
  var CASOS = [
    { q:{ es:'En el grupo 1B casi todos se enfermaron de gripe en una semana. En el 1C, casi nadie.', en:'In class 1B almost everyone caught the flu in one week. In 1C, almost nobody.' },
      A:[ { t:{ es:'el grupo 1B pasa toda la mañana en un salón cerrado y sin ventilar', en:'class 1B spends the whole morning in a closed classroom with no airing' }, ok:true },
          { t:{ es:'al grupo 1B simplemente le tocó mala suerte', en:'class 1B simply had bad luck' }, ok:false,
            k:{ es:'La mala suerte no se puede medir ni cambiar, así que no hay forma de ponerla a prueba.', en:'Bad luck cannot be measured or changed, so there is no way to test it.' } },
          { t:{ es:'el virus decidió atacar primero al grupo 1B', en:'the virus decided to attack class 1B first' }, ok:false,
            k:{ es:'Un virus no decide nada. Una causa que no existe no se puede comprobar.', en:'A virus decides nothing. A cause that does not exist cannot be checked.' } } ],
      B:[ { t:{ es:'más casos nuevos en los salones sin ventilar que en los salones ventilados', en:'more new cases in unaired classrooms than in aired ones' }, ok:true },
          { t:{ es:'que todos se sientan bastante mal', en:'that everyone feels pretty bad' }, ok:false,
            k:{ es:'Sentirse mal no se puede contar ni comparar entre dos grupos.', en:'Feeling bad cannot be counted or compared between two groups.' } },
          { t:{ es:'que la gripe existe y es contagiosa', en:'that the flu exists and is contagious' }, ok:false,
            k:{ es:'Eso ya se sabe de antemano, así que observarlo no prueba nada nuevo.', en:'That is known beforehand, so observing it proves nothing new.' } } ] },
    { q:{ es:'Después de la kermés de la escuela, muchos alumnos tuvieron diarrea al día siguiente.', en:'After the school fair, many students had diarrhoea the next day.' },
      A:[ { t:{ es:'el agua de sabor se preparó con agua sin hervir', en:'the flavoured water was made with unboiled water' }, ok:true },
          { t:{ es:'la comida de la kermés estaba muy sabrosa', en:'the food at the fair was very tasty' }, ok:false,
            k:{ es:'El sabor no tiene relación con que un microbio entre al intestino.', en:'Taste has nothing to do with a microbe getting into the gut.' } },
          { t:{ es:'ese día el clima estaba pesado para el estómago', en:'that day the weather was heavy on the stomach' }, ok:false,
            k:{ es:'El clima no es lo que se investiga aquí, y no explica de dónde salió el microbio.', en:'The weather is not what is under study here, and it does not explain where the microbe came from.' } } ],
      B:[ { t:{ es:'más casos entre quienes tomaron esa agua que entre quienes no la tomaron', en:'more cases among those who drank that water than among those who did not' }, ok:true },
          { t:{ es:'que la diarrea es una molestia desagradable', en:'that diarrhoea is an unpleasant nuisance' }, ok:false,
            k:{ es:'Es una opinión sobre la enfermedad, no algo que se pueda contar.', en:'That is an opinion about the illness, not something you can count.' } },
          { t:{ es:'que la próxima kermés tendrá menos visitantes', en:'that the next fair will have fewer visitors' }, ok:false,
            k:{ es:'Eso no dice nada sobre el agua ni sobre quién se enfermó.', en:'That says nothing about the water or about who got sick.' } } ] },
    { q:{ es:'En un salón hubo la mitad de ausencias por gripe que en los demás salones del mismo grado.', en:'One classroom had half the flu absences of the other classrooms in the same year group.' },
      A:[ { t:{ es:'en ese salón se lavan las manos antes de comer todos los días', en:'in that classroom they wash their hands before eating every day' }, ok:true },
          { t:{ es:'los alumnos de ese salón son más fuertes por naturaleza', en:'the students in that classroom are naturally stronger' }, ok:false,
            k:{ es:'Ser más fuerte por naturaleza no se puede medir ni comparar entre salones.', en:'Being naturally stronger cannot be measured or compared between classrooms.' } },
          { t:{ es:'ese salón tiene mejor suerte que los demás', en:'that classroom has better luck than the others' }, ok:false,
            k:{ es:'La suerte no se puede cambiar a propósito para ver qué pasa.', en:'Luck cannot be changed on purpose to see what happens.' } } ],
      B:[ { t:{ es:'menos ausencias por gripe en los grupos que se lavan las manos antes de comer', en:'fewer flu absences in the groups that wash their hands before eating' }, ok:true },
          { t:{ es:'que lavarse las manos es una buena costumbre', en:'that washing your hands is a good habit' }, ok:false,
            k:{ es:'Es una recomendación, no una observación que se pueda contar.', en:'That is a recommendation, not an observation you can count.' } },
          { t:{ es:'que la gripe desaparecerá de la escuela para siempre', en:'that the flu will disappear from the school forever' }, ok:false,
            k:{ es:'Es una promesa demasiado grande: ningún dato de un salón puede sostenerla.', en:'It is far too big a promise: no data from one classroom can hold it up.' } } ] }
  ];
  var seq = perm(CASOS.length, rng);
  var st = { r: 0, a: null, b: null, tries: 0, done: false };

  function cur(){ return CASOS[seq[st.r]]; }
  function blank(){ return L({ es:'...', en:'...' }); }

  function render(){
    if (st.done){
      host.innerHTML =
        '<div class="gw-h iw-tag">' + L({ es:'Arma una hipótesis', en:'Build a hypothesis' }) + '</div>' +
        '<div class="gw-live">' + L({
          es:'Ya tienes el molde. Una hipótesis útil enlaza algo que se puede cambiar u observar con algo que se puede contar, y por eso se puede comparar con lo que reportan las fuentes serias.',
          en:'You have the mould now. A useful hypothesis links something you can change or observe with something you can count, and that is why it can be checked against what serious sources report.'
        }) + '</div>';
      return;
    }
    var c = cur();
    host.innerHTML =
      '<div class="gw-h iw-tag">' + L({ es:'Arma una hipótesis', en:'Build a hypothesis' }) + '</div>' +
      '<div class="cl-prog">' + (st.r + 1) + ' / ' + seq.length + '</div>' +
      '<div class="gw-q">' + L(c.q) + '</div>' +
      '<div class="gw-mini iw-sub">' + L({
        es:'Elige una causa posible y una observación. La frase se arma arriba mientras eliges, y puedes cambiar cualquiera de las dos piezas.',
        en:'Pick a possible cause and an observation. The sentence assembles above as you choose, and you can change either piece.'
      }) + '</div>' +
      '<div class="hp-sent">' + L({ es:'Si ', en:'If ' }) +
        '<span class="hp-slot">' + (st.a === null ? blank() : L(c.A[st.a].t)) + '</span>' +
        L({ es:', entonces esperaría observar ', en:', then I would expect to observe ' }) +
        '<span class="hp-slot">' + (st.b === null ? blank() : L(c.B[st.b].t)) + '</span>.' +
      '</div>' +
      '<div class="gw-lbl">' + L({ es:'Causa posible', en:'Possible cause' }) + '</div>' +
      '<div class="hp-col" data-r="A">' + c.A.map(function(o, i){
        return '<button class="hp-chip' + (st.a === i ? ' sel' : '') + '" data-i="' + i + '">' + L(o.t) + '</button>';
      }).join('') + '</div>' +
      '<div class="gw-lbl">' + L({ es:'Lo que esperaría observar', en:'What I would expect to observe' }) + '</div>' +
      '<div class="hp-col" data-r="B">' + c.B.map(function(o, i){
        return '<button class="hp-chip' + (st.b === i ? ' sel' : '') + '" data-i="' + i + '">' + L(o.t) + '</button>';
      }).join('') + '</div>' +
      '<div class="gw-row"><button class="gw-btn" data-r="check">' + L({ es:'Ponerla a prueba', en:'Put it to the test' }) + '</button></div>' +
      '<div class="gw-fb">' + L({ es:'Una hipótesis se puede poner a prueba solo si sus dos piezas se pueden observar.', en:'A hypothesis can be tested only if both of its pieces can be observed.' }) + '</div>';
    host.querySelectorAll('[data-r="A"] .hp-chip').forEach(function(b){
      b.addEventListener('click', function(){ st.a = parseInt(b.getAttribute('data-i'), 10); render(); });
    });
    host.querySelectorAll('[data-r="B"] .hp-chip').forEach(function(b){
      b.addEventListener('click', function(){ st.b = parseInt(b.getAttribute('data-i'), 10); render(); });
    });
    host.querySelector('[data-r="check"]').addEventListener('click', check);
  }

  function advance(){
    st.r++; st.a = null; st.b = null; st.tries = 0;
    if (st.r >= seq.length) st.done = true;
    setTimeout(render, 1500);
  }

  function check(){
    var c = cur();
    if (st.a === null || st.b === null){
      say(host, 'warm', L({ es:'Faltan piezas: elige una causa y una observación.', en:'Pieces are missing: pick a cause and an observation.' }));
      return;
    }
    var oa = c.A[st.a], ob = c.B[st.b];
    if (oa.ok && ob.ok){
      say(host, 'good', L({
        es:'✓ Esta sí se puede poner a prueba: la causa se puede observar o cambiar, y lo que esperas se puede contar y comparar entre dos grupos.',
        en:'✓ This one can be tested: the cause can be observed or changed, and what you expect can be counted and compared between two groups.'
      }));
      advance();
      return;
    }
    st.tries++;
    var razon = !oa.ok ? L(oa.k) : L(ob.k);
    if (st.tries >= 3){
      var ia = 0, ib = 0, i;
      for (i = 0; i < c.A.length; i++) if (c.A[i].ok) ia = i;
      for (i = 0; i < c.B.length; i++) if (c.B[i].ok) ib = i;
      st.a = ia; st.b = ib; render();
      say(host, 'warm', L({
        es:'Esta es la pareja que sirve. Las dos piezas se pueden observar, y por eso alguien más podría repetir la comparación y llegar al mismo resultado.',
        en:'This is the pair that works. Both pieces can be observed, and that is why somebody else could repeat the comparison and reach the same result.'
      }));
      st.tries = 0;
      setTimeout(function(){ st.r++; st.a = null; st.b = null; if (st.r >= seq.length) st.done = true; render(); }, 2600);
      return;
    }
    say(host, 'miss', L({ es:'Casi. ' + razon + ' Cambia esa pieza.', en:'Close. ' + razon + ' Swap that piece.' }));
  }

  render();
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 5 :: la cobertura que protege al bebé  (data-widget="vacuna")
   Un vecindario de 36 personas con un bebé que todavía no puede vacunarse.
   Al mover la cobertura, la mancha roja del contagio se recalcula en el
   momento y busca caminos entre las personas sin vacunar. La pregunta no es
   cuántos se enferman: es si la cadena todavía llega hasta el bebé.
   ══════════════════════════════════════════════════════════════════════════ */
function wCobertura(rng, host){
  var W = 6, N = 36;
  var baby = ri(rng, 1, 4) * W + ri(rng, 1, 4);
  var start = pk(rng, [0, W - 1, N - W, N - 1]);
  var rest = [];
  for (var q = 0; q < N; q++) if (q !== baby && q !== start) rest.push(q);
  var order = shuffle(rest, rng);
  var st = { k: 0, tries: 0, done: false };

  function vacSet(k){
    var v = {}, i;
    for (i = 0; i < k && i < order.length; i++) v[order[i]] = true;
    return v;
  }
  function spread(k){
    var v = vacSet(k), seen = {}, stack = [start], inf = [];
    seen[start] = true;
    while (stack.length){
      var c = stack.pop();
      inf.push(c);
      var r = Math.floor(c / W), col = c % W;
      var nb = [];
      if (r > 0) nb.push(c - W);
      if (r < W - 1) nb.push(c + W);
      if (col > 0) nb.push(c - 1);
      if (col < W - 1) nb.push(c + 1);
      for (var j = 0; j < nb.length; j++){
        var m = nb[j];
        if (!seen[m] && !v[m]){ seen[m] = true; stack.push(m); }
      }
    }
    return { v: v, inf: seen, count: inf.length, baby: !!seen[baby] };
  }
  var minK = order.length;
  for (var kk = 0; kk <= order.length; kk++){ if (!spread(kk).baby){ minK = kk; break; } }

  host.innerHTML =
    '<div class="gw-h iw-tag">' + L({ es:'La cobertura que protege al bebé', en:'The coverage that protects the baby' }) + '</div>' +
    '<div class="gw-q">' + L({ es:'Corta todos los caminos que llegan al bebé', en:'Cut every path that reaches the baby' }) + '</div>' +
    '<div class="gw-mini iw-sub">' + L({
      es:'Este vecindario tiene 36 personas. Una ya está enferma y el bebé del círculo dorado es demasiado pequeño para vacunarse, así que nunca se vacuna. Mueve la cobertura y mira cómo el contagio busca caminos entre quienes no están vacunados.',
      en:'This neighbourhood has 36 people. One is already sick and the baby in the golden circle is too young to be vaccinated, so it never gets the vaccine. Move the coverage and watch the infection look for paths among those who are not vaccinated.'
    }) + '</div>' +
    '<div class="gw-lbl">' + L({ es:'Cobertura de vacunación', en:'Vaccination coverage' }) + '</div>' +
    '<input class="gw-range" type="range" min="0" max="' + order.length + '" step="1" value="0" data-r="k">' +
    '<div class="gw-num" data-r="kv"></div>' +
    '<div class="vc-grid" data-r="grid"></div>' +
    '<div class="vc-leg">' +
      '<span><span class="vc-key vac"></span>' + L({ es:'vacunada', en:'vaccinated' }) + '</span>' +
      '<span><span class="vc-key inf"></span>' + L({ es:'contagiada', en:'infected' }) + '</span>' +
      '<span><span class="vc-key baby"></span>' + L({ es:'bebé sin vacunar', en:'unvaccinated baby' }) + '</span>' +
    '</div>' +
    '<div class="gw-live" data-r="live"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="check">' + L({ es:'Revisar al bebé', en:'Check on the baby' }) + '</button></div>' +
    '<div class="gw-fb">' + L({ es:'Puedes subir y bajar la cobertura las veces que quieras.', en:'You can raise and lower the coverage as often as you like.' }) + '</div>';

  var elK = host.querySelector('[data-r="k"]'),
      elKV = host.querySelector('[data-r="kv"]'),
      elG = host.querySelector('[data-r="grid"]'),
      elLive = host.querySelector('[data-r="live"]'),
      elChk = host.querySelector('[data-r="check"]');

  function update(){
    var s = spread(st.k), i, cells = '';
    for (i = 0; i < N; i++){
      var cls = 'vc-dot';
      if (s.v[i]) cls += ' vac';
      else if (s.inf[i]) cls += ' inf';
      if (i === baby) cls += ' baby';
      cells += '<div class="' + cls + '"></div>';
    }
    elG.innerHTML = cells;
    var pct = Math.round(st.k / N * 100);
    elKV.textContent = st.k + ' ' + L({ es:'de 36 personas vacunadas', en:'of 36 people vaccinated' }) + ' (' + pct + '%)';
    elLive.innerHTML = s.baby
      ? L({ es:'Contagiados: <b>' + s.count + '</b>. La cadena todavía encuentra un camino de personas sin vacunar hasta el bebé.',
            en:'Infected: <b>' + s.count + '</b>. The chain still finds a path of unvaccinated people all the way to the baby.' })
      : L({ es:'Contagiados: <b>' + s.count + '</b>. Ningún camino de personas sin vacunar llega al bebé.',
            en:'Infected: <b>' + s.count + '</b>. No path of unvaccinated people reaches the baby.' });
  }

  function check(){
    if (st.done) return;
    var s = spread(st.k);
    if (!s.baby){
      st.done = true; elChk.disabled = true; elK.disabled = true;
      say(host, 'good', L({
        es:'🎉 El bebé quedó protegido y nunca recibió una vacuna. Lo protegieron las personas vacunadas de alrededor, porque ninguna de ellas puede pasarle el microbio. A eso se le llama protección de la comunidad, y solo aparece cuando la cobertura es alta.',
        en:'🎉 The baby ended up protected and never received a vaccine. The vaccinated people around did it, because none of them can pass the microbe on. That is called community protection, and it only appears when coverage is high.'
      }));
      return;
    }
    st.tries++;
    if (st.tries >= 3){
      st.k = minK; elK.value = minK; update();
      st.done = true; elChk.disabled = true; elK.disabled = true;
      say(host, 'warm', L({
        es:'Con ' + minK + ' personas vacunadas se cierran todos los caminos hacia el bebé. Un poco menos y basta un solo hueco para que la cadena pase: por eso la protección de la comunidad no se consigue a medias.',
        en:'With ' + minK + ' people vaccinated every path to the baby closes. A little less and a single gap is enough for the chain to slip through: that is why community protection is not achieved halfway.'
      }));
      return;
    }
    say(host, 'miss', L({
      es:'Todavía llega. Fíjate por dónde sigue roja la mancha y sube la cobertura: te falta cerrar al menos ' + Math.max(1, minK - st.k) + ' hueco o más.',
      en:'It still gets there. Look at where the red patch continues and raise the coverage: you still need to close at least ' + Math.max(1, minK - st.k) + ' gap or more.'
    }));
  }

  elK.addEventListener('input', function(){ if (st.done) return; st.k = parseInt(elK.value, 10); update(); });
  elChk.addEventListener('click', check);
  update();
}

function reflectTab(which, btn){
  ['type', 'draw'].forEach(function(k){
    var el = document.getElementById('reflect_' + k);
    if (el) el.classList.toggle('active', k === which);
  });
  var tabs = btn.closest('.wtabs');
  if (tabs) tabs.querySelectorAll('.wtab').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  if (which === 'draw') setTimeout(function(){
    var c = document.getElementById('reflectCv');
    if (c && !c.width) initCanvas(c);
  }, 60);
}

function reflectSave(){
  var host = document.getElementById('wReflexion');
  if (!host) return;
  say(host, 'good', L({
    es:'✓ Guardado. Una razón que se apoya en un dato se puede discutir con cualquiera; una que se apoya en una creencia, no.',
    en:'✓ Saved. A reason that rests on data can be discussed with anybody; one that rests on a belief cannot.'
  }));
}
