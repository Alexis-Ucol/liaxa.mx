/* ══════════════════════════════════════════════════════════════════════════
   BUILD LESSON - concepto, manipulativo y problema, intercalados (Rule 1)
   ══════════════════════════════════════════════════════════════════════════ */
function buildLesson(rng){
  injectGuideCSS();

  sec(
    L({ es:'Punto de partida', en:'Starting point' }),
    L({ es:'La química no ocurre solo en el laboratorio', en:'Chemistry does not happen only in the laboratory' }),
    '<p>' + L({
      es:'Mientras lees esto, en la cocina de tu casa hay materia transformandose. El gas que arde en la estufa deja de ser gas, el pan que se dora deja de ser masa cruda, la fruta que madura cambia de color y de sabor, el clavo del patio se cubre de un polvo que no estaba ahí. Todos esos procesos tienen algo en común: al final quedan sustancias que no existían al principio.',
      en:'While you read this, in the kitchen of your home there is matter transforming. The gas burning on the stove stops being gas, the bread browning stops being raw dough, the ripening fruit changes colour and taste, the nail in the yard gets covered by a powder that was not there. All those processes share something: at the end there are substances that did not exist at the start.'
    }) + '</p>' +
    '<p>' + L({
      es:'En esta guía vas a aprender a reconocer esas transformaciones sin necesidad de un laboratorio, a escribirlas con el lenguaje corto y exacto de las ecuaciones químicas, a comprobar que ni un solo átomo se pierde en el camino y a explicar por que unas reacciones calientan lo que tienen alrededor mientras otras lo enfrian. Al terminar vas a poder mirar una escena cotidiana y decir, con argumentos, si hubo una reacción y qué se puede hacer con ella.',
      en:'In this guide you will learn to recognize those transformations without needing a laboratory, to write them with the short and exact language of chemical equations, to check that not a single atom is lost along the way and to explain why some reactions heat up what surrounds them while others cool it down. By the end you will be able to look at an everyday scene and say, with arguments, whether there was a reaction and what can be done with it.'
    }) + '</p>' +
    '<div class="gw-lbl">' + L({ es:'Lo que vas a poder decidir', en:'What you will be able to decide' }) + '</div>' +
    '<div>' +
      '<span class="gw-chip">' + L({ es:'reactivos y productos', en:'reactants and products' }) + '</span>' +
      '<span class="gw-chip">' + L({ es:'manifestaciones', en:'manifestations' }) + '</span>' +
      '<span class="gw-chip">' + L({ es:'cambio de propiedades', en:'change of properties' }) + '</span>' +
      '<span class="gw-chip">' + L({ es:'ecuación química', en:'chemical equation' }) + '</span>' +
      '<span class="gw-chip">' + L({ es:'conservación de la materia', en:'conservation of matter' }) + '</span>' +
      '<span class="gw-chip">' + L({ es:'reacciones exotérmicas', en:'exothermic reactions' }) + '</span>' +
      '<span class="gw-chip">' + L({ es:'reacciones endotérmicas', en:'endothermic reactions' }) + '</span>' +
      '<span class="gw-chip">' + L({ es:'aprovechamiento', en:'making use of them' }) + '</span>' +
    '</div>'
  );

  /* ══ CONCEPTO 1 ══ */
  var s1 = sec(
    L({ es:'Concepto 1', en:'Concept 1' }),
    L({ es:'Sustancias nuevas o el mismo material con otra apariencia', en:'New substances or the same material with another look' }),
    '<p>' + L({
      es:'La materia cambia de dos maneras muy distintas. En un cambio físico, el material sigue siendo el mismo aunque se vea diferente: el hielo derretido sigue siendo agua, el alambre doblado sigue siendo cobre, el azúcar disuelta sigue siendo azúcar repartida entre el agua. Cambian la forma, el tamaño, el estado o la manera de estar mezclado, pero si devuelves las condiciones iniciales, el material vuelve tal cual era.',
      en:'Matter changes in two very different ways. In a physical change, the material stays the same even if it looks different: melted ice is still water, a bent wire is still copper, dissolved sugar is still sugar spread through the water. Shape, size, state or the way of being mixed change, but if you bring the initial conditions back, the material returns exactly as it was.'
    }) + '</p>' +
    '<p>' + L({
      es:'En una reacción química ocurre otra cosa: los materiales de partida, llamados reactivos, se transforman en materiales distintos, llamados productos, con propiedades propias. El hierro gris y flexible se convierte en un óxido rojizo y quebradizo; la leche fresca se convierte en un líquido agrio con grumos. Lo que cambia son las sustancias, no los átomos: estos ni se crean ni se destruyen, solo se separan de unos vecinos y se unen a otros. Por eso una reacción casi nunca se deshace sola, mientras que un cambio físico casi siempre se revierte.',
      en:'In a chemical reaction something else happens: the starting materials, called reactants, transform into different materials, called products, with properties of their own. Grey, flexible iron turns into a reddish, brittle oxide; fresh milk turns into a sour, lumpy liquid. What changes are the substances, not the atoms: these are neither created nor destroyed, they only leave some neighbours and join others. That is why a reaction almost never undoes itself, while a physical change almost always reverses.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Cambio físico', en:'Physical change' }), L({ es:'misma sustancia', en:'same substance' }), L({ es:'cambia la forma o el estado y casi siempre se revierte', en:'shape or state changes and it almost always reverses' })) +
      rcard(L({ es:'Reacción química', en:'Chemical reaction' }), L({ es:'reactivos a productos', en:'reactants to products' }), L({ es:'aparecen sustancias con propiedades distintas', en:'substances with different properties appear' })) +
      rcard(L({ es:'Lo que cambia', en:'What changes' }), L({ es:'la agrupacion', en:'the grouping' }), L({ es:'los átomos se separan y se unen de otra manera', en:'the atoms separate and join in another way' })) +
      rcard(L({ es:'Lo que permanece', en:'What stays' }), L({ es:'los átomos', en:'the atoms' }), L({ es:'ni uno solo se crea ni se destruye en el camino', en:'not a single one is created or destroyed along the way' })) +
    '</div>' +
    '<div class="callout"><p><strong>' + L({ es:'La pregunta clave: ', en:'The key question: ' }) + '</strong>' + L({
      es:'al final, ¿tengo el mismo material con otra apariencia, o tengo un material que antes no existia?',
      en:'at the end, do I have the same material with another look, or do I have a material that did not exist before?'
    }) + '</p></div>'
  );
  wDetector(rng, widgetHost(s1, 'wDetector', 'classify'));
  addProblem(rng, mkP1(rng));
  addProblem(rng, mkP2(rng));

  /* ══ CONCEPTO 2 ══ */
  var s2 = sec(
    L({ es:'Concepto 2', en:'Concept 2' }),
    L({ es:'Las señales que delatan una reacción', en:'The signals that give a reaction away' }),
    '<p>' + L({
      es:'Como no puedes ver los átomos, reconoces una reacción por lo que si se percibe: sus manifestaciones. Las más confiables son cinco. Aparece un gas que antes no estaba, y se ve como burbujeo constante que no se detiene al dejar de agitar. Se forma un sólido dentro de un líquido transparente, llamado precipitado, y no vuelve a disolverse. Cambia el color de manera permanente, sin que se pueda enjuagar. Aparece un olor nuevo. Y cambia la temperatura sin que nadie caliente ni enfrie desde fuera.',
      en:'Since you cannot see the atoms, you recognize a reaction by what can be perceived: its manifestations. The five most reliable ones are these. A gas that was not there appears, and it shows as constant bubbling that does not stop when you stop stirring. A solid forms inside a transparent liquid, called a precipitate, and it does not dissolve again. The colour changes permanently, with no way to rinse it off. A new smell appears. And the temperature changes without anyone heating or cooling from outside.'
    }) + '</p>' +
    '<p>' + L({
      es:'Una sola señal no siempre basta, porque hay procesos que la imitan: el agua hirviendo también hace burbujas y un sólido también desaparece al disolverse. Por eso la prueba de fondo es siempre la misma, comparar las propiedades de los reactivos con las de los productos. El hierro es gris, brillante y se dobla; su óxido es rojizo, opaco y se desmorona. El azúcar es blanca y dulce; el caramelo quemado es oscuro y amargo. Cuando dos o más propiedades cambian a la vez y no regresan, la conclusión es firme: hay sustancias nuevas.',
      en:'One signal alone is not always enough, because there are processes that imitate it: boiling water also makes bubbles and a solid also disappears when it dissolves. That is why the underlying test is always the same, comparing the properties of the reactants with those of the products. Iron is grey, shiny and bends; its oxide is reddish, dull and crumbles. Sugar is white and sweet; burnt caramel is dark and bitter. When two or more properties change at once and do not come back, the conclusion is firm: there are new substances.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Gas nuevo', en:'New gas' }), L({ es:'burbujeo sostenido', en:'sustained bubbling' }), L({ es:'la efervescencia del bicarbonato con vinagre', en:'the fizzing of baking soda with vinegar' })) +
      rcard(L({ es:'Precipitado', en:'Precipitate' }), L({ es:'sólido que no se disuelve', en:'solid that will not dissolve' }), L({ es:'el sarro blanco que deja el agua dura', en:'the white scale left by hard water' })) +
      rcard(L({ es:'Color y olor', en:'Colour and smell' }), L({ es:'sin retorno', en:'no way back' }), L({ es:'la manzana que se oscurece, la leche que se agria', en:'the apple that darkens, the milk that sours' })) +
      rcard(L({ es:'Temperatura', en:'Temperature' }), L({ es:'cambio propio', en:'change of its own' }), L({ es:'la cal con agua que calienta el recipiente', en:'lime with water that heats the container' })) +
    '</div>' +
    '<div class="callout"><p>' + L({
      es:'Hervir hace burbujas y disolver hace desaparecer un sólido, y en ninguno de los dos casos hay reacción. La señal orienta; la comparacion de propiedades decide.',
      en:'Boiling makes bubbles and dissolving makes a solid disappear, and in neither case is there a reaction. The signal points the way; the comparison of properties decides.'
    }) + '</p></div>'
  );
  wBitacora(rng, widgetHost(s2, 'wBitacora', 'evidencias'));
  addProblem(rng, mkP3(rng));
  addProblem(rng, mkP4(rng));

  /* ══ CONCEPTO 3 ══ */
  var s3 = sec(
    L({ es:'Concepto 3', en:'Concept 3' }),
    L({ es:'Escribir la reacción en el lenguaje de la química', en:'Writing the reaction in the language of chemistry' }),
    '<p>' + L({
      es:'Describir una reacción con palabras funciona, pero es largo e impreciso. La química usa una escritura breve: la ecuación química. A la izquierda van los reactivos, a la derecha los productos y entre ellos una flecha que se lee como se transforma en. Cada sustancia aparece con su fórmula, y dentro de la fórmula los números pequeños escritos abajo indican cuántos átomos de cada elemento forman una unidad de esa sustancia. En el agua, el dos pequeño junto a la H dice que hay dos átomos de hidrógeno por cada átomo de oxígeno.',
      en:'Describing a reaction with words works, but it is long and imprecise. Chemistry uses a short writing: the chemical equation. On the left go the reactants, on the right the products and between them an arrow read as turns into. Each substance appears with its formula, and inside the formula the small numbers written below tell how many atoms of each element make up one unit of that substance. In water, the small two next to the H says there are two hydrogen atoms for each oxygen atom.'
    }) + '</p>' +
    '<p>' + L({
      es:'Hay un segundo tipo de número, el que se escribe grande y delante de la fórmula: el coeficiente. Indica cuántas unidades iguales de esa sustancia participan y multiplica a todos los átomos que le siguen. La diferencia entre ambos es decisiva. Cambiar un número pequeño de abajo convierte a la sustancia en otra distinta, porque cambia de que está hecha. Cambiar el número grande de adelante solo dice cuántas unidades de la misma sustancia hay. Por eso, cuando una ecuación necesita ajustarse, lo único que se puede tocar son los coeficientes.',
      en:'There is a second kind of number, the one written large and in front of the formula: the coefficient. It says how many identical units of that substance take part and it multiplies every atom that follows it. The difference between the two is decisive. Changing a small number below turns the substance into a different one, because it changes what it is made of. Changing the large number in front only says how many units of the same substance there are. That is why, when an equation needs adjusting, the only thing that can be touched are the coefficients.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Reactivos', en:'Reactants' }), L({ es:'lado izquierdo', en:'left side' }), L({ es:'las sustancias con las que empieza el proceso', en:'the substances the process starts with' })) +
      rcard(L({ es:'Productos', en:'Products' }), L({ es:'lado derecho', en:'right side' }), L({ es:'las sustancias que quedan al final', en:'the substances left at the end' })) +
      rcard(L({ es:'Subíndice', en:'Subscript' }), L({ es:'número pequeño abajo', en:'small number below' }), L({ es:'define la sustancia: cambiarlo la convierte en otra', en:'it defines the substance: changing it turns it into another' })) +
      rcard(L({ es:'Coeficiente', en:'Coefficient' }), L({ es:'número grande adelante', en:'large number in front' }), L({ es:'cuenta unidades iguales y multiplica toda la fórmula', en:'it counts identical units and multiplies the whole formula' })) +
    '</div>' +
    '<div class="callout"><p><strong>' + L({ es:'Ojo: ', en:'Careful: ' }) + '</strong>' + L({
      es:'el agua y el agua oxigenada se diferencian por un solo número pequeño, y son sustancias con propiedades muy distintas.',
      en:'water and hydrogen peroxide differ by a single small number, and they are substances with very different properties.'
    }) + '</p></div>'
  );
  wBalanza(rng, widgetHost(s3, 'wBalanza', 'balance'));
  addProblem(rng, mkP5(rng));
  addProblem(rng, mkP6(rng));

  /* ══ CONCEPTO 4 ══ */
  var s4 = sec(
    L({ es:'Concepto 4', en:'Concept 4' }),
    L({ es:'Nada se pierde: la ley de la conservación de la materia', en:'Nothing is lost: the law of conservation of matter' }),
    '<p>' + L({
      es:'Cuando se pesan con cuidado los materiales antes y después de una reacción realizada en un recipiente cerrado, el resultado siempre es el mismo: la masa total no cambia. Esa regularidad es la ley de la conservación de la materia, y tiene una explicación sencilla en el nivel de los átomos. Los átomos que estaban al principio son exactamente los mismos que estan al final; solo se reorganizaron. Si no se pierde ningun átomo, tampoco se pierde masa.',
      en:'When the materials are carefully weighed before and after a reaction carried out in a closed container, the result is always the same: the total mass does not change. That regularity is the law of conservation of matter, and it has a simple explanation at the level of the atoms. The atoms that were there at the start are exactly the ones that are there at the end; they only rearranged. If no atom is lost, no mass is lost either.'
    }) + '</p>' +
    '<p>' + L({
      es:'La ley parece fallar cuando el recipiente esta abierto, y ahí esta la trampa. La leña que arde deja cenizas mucho más ligeras porque una parte de los productos se fue como gas al aire; el clavo que se oxida, en cambio, gana masa porque incorpora oxígeno que estaba en el aire. En los dos casos la contabilidad cierra si se pesa todo lo que entra y todo lo que sale, gases incluidos. Esta ley es también la razón de ser de los coeficientes: una ecuación solo está bien escrita cuando cada elemento aparece la misma cantidad de veces de los dos lados de la flecha.',
      en:'The law seems to fail when the container is open, and that is where the trap lies. Firewood that burns leaves much lighter ashes because part of the products went off as gas into the air; the nail that rusts, on the other hand, gains mass because it takes in oxygen that was in the air. In both cases the accounting adds up if everything that goes in and everything that goes out is weighed, gases included. This law is also the reason coefficients exist: an equation is only properly written when each element appears the same number of times on both sides of the arrow.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Recipiente cerrado', en:'Closed container' }), L({ es:'masa constante', en:'constant mass' }), L({ es:'lo que pesaba antes pesa igual después', en:'what it weighed before it weighs the same after' })) +
      rcard(L({ es:'Recipiente abierto', en:'Open container' }), L({ es:'gases que escapan', en:'gases that escape' }), L({ es:'la ceniza pesa menos, pero nada se destruyó', en:'the ash weighs less, but nothing was destroyed' })) +
      rcard(L({ es:'Oxidación al aire', en:'Rusting in air' }), L({ es:'masa que aumenta', en:'mass that increases' }), L({ es:'el sólido incorpora oxígeno que estaba en el aire', en:'the solid takes in oxygen that was in the air' })) +
      rcard(L({ es:'Ecuación equilibrada', en:'Balanced equation' }), L({ es:'mismos átomos', en:'same atoms' }), L({ es:'la misma cuenta de cada elemento a los dos lados', en:'the same count of each element on both sides' })) +
    '</div>' +
    '<div class="callout"><p>' + L({
      es:'Antes de decir que falta materia, revisa si el recipiente estaba abierto. Casi siempre lo que se perdió de vista fue un gas.',
      en:'Before saying matter is missing, check whether the container was open. Almost always what was lost from sight was a gas.'
    }) + '</p></div>'
  );
  wFrasco(rng, widgetHost(s4, 'wFrasco', 'masa'));
  addProblem(rng, mkP7(rng));

  /* ══ CONCEPTO 5 ══ */
  var s5 = sec(
    L({ es:'Concepto 5', en:'Concept 5' }),
    L({ es:'Toda reacción mueve energía, y en los dos sentidos', en:'Every reaction moves energy, and in both directions' }),
    '<p>' + L({
      es:'Junto con la materia, en una reacción se mueve energía. Romper las uniones de los reactivos cuesta energía y formar las uniones de los productos la libera; el balance entre esas dos cantidades decide el sentido del intercambio. Cuando los productos guardan menos energía que los reactivos, la diferencia sale hacia el entorno y todo lo cercano se calienta: es una reacción exotérmica, como la combustión del gas o la cal viva con agua. Cuando los productos guardan más, la reacción tiene que tomar esa energía de fuera y el entorno se enfria: es una reacción endotérmica, como la mezcla de una compresa instantánea.',
      en:'Along with matter, energy moves in a reaction. Breaking the joins of the reactants costs energy and forming the joins of the products releases it; the balance between those two amounts decides the direction of the exchange. When the products store less energy than the reactants, the difference goes out to the surroundings and everything nearby heats up: it is an exothermic reaction, like the burning of gas or quicklime with water. When the products store more, the reaction has to take that energy from outside and the surroundings cool down: it is an endothermic reaction, like the mixture inside an instant cold pack.'
    }) + '</p>' +
    '<p>' + L({
      es:'Ese intercambio es lo que se aprovecha en la vida diaria. La cocina, el transporte y la calefacción funcionan con reacciones que entregan energía; las compresas frías del botiquín y la cocción de los alimentos aprovechan reacciones que la necesitan. La fotosíntesis es el caso más importante de todos: guarda energía luminosa dentro de los azúcares, y esa energía se recupera después en la respiración de quienes los comen. Reconocer el sentido del intercambio permite decidir con criterio, desde elegir un tratamiento para un golpe hasta evaluar el impacto ambiental de una combustión.',
      en:'That exchange is what gets used in daily life. Cooking, transport and heating run on reactions that hand energy over; the cold packs of the first aid kit and the cooking of food make use of reactions that need it. Photosynthesis is the most important case of all: it stores light energy inside sugars, and that energy is recovered later in the breathing of whoever eats them. Recognizing the direction of the exchange allows sound decisions, from choosing a treatment for a bruise to weighing the environmental impact of a burning.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Exotérmica', en:'Exothermic' }), L({ es:'entrega energía', en:'hands energy over' }), L({ es:'el entorno se calienta: combustión, cal viva con agua', en:'the surroundings warm up: burning gas, quicklime with water' })) +
      rcard(L({ es:'Endotérmica', en:'Endothermic' }), L({ es:'necesita energía', en:'needs energy' }), L({ es:'el entorno se enfria: compresas frías instantáneas', en:'the surroundings cool down: instant cold packs' })) +
      rcard(L({ es:'Dónde se guarda', en:'Where it is stored' }), L({ es:'en las uniones', en:'in the joins' }), L({ es:'romperlas cuesta energía y formarlas la libera', en:'breaking them costs energy and forming them releases it' })) +
      rcard(L({ es:'Para qué sirve', en:'What it is for' }), L({ es:'aprovechamiento', en:'making use of it' }), L({ es:'cocinar, transportar, curar un golpe, alimentar plantas', en:'cooking, transport, treating a bruise, feeding plants' })) +
    '</div>' +
    '<div class="callout"><p>' + L({
      es:'La energía tampoco se crea ni se destruye: solo pasa de las uniones químicas al entorno, o del entorno a las uniones químicas.',
      en:'Energy is not created or destroyed either: it only passes from the chemical joins to the surroundings, or from the surroundings to the chemical joins.'
    }) + '</p></div>'
  );
  wTermo(rng, widgetHost(s5, 'wTermo', 'energía'));
  addProblem(rng, mkP8(rng));

  /* ══ CIERRE ══ */
  wCuaderno(rng, widgetHost(null, 'wCuaderno', 'reflect'));
  addProblem(rng, mkP9(rng));
  addProblem(rng, mkP10(rng));
}
</script>

<!-- LIAXA ANALYTICS -->
<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbzLGV15JRTPs9bbSvHRLfgOXeT9oUExDf1AH546WOwq5tYxXSdhX212OWi_bTJfMGx9/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'Reacciones Químicas Reconocibles en el Entorno';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
