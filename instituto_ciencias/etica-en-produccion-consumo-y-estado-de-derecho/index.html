function conScores(){
  var m = [0,0,0], d, j;
  for (d = 0; d < 3; d++) {
    var k = CON.sel[d];
    if (k === null) continue;
    var v = CON.sc.dec[d].opts[k].v;
    for (j = 0; j < 3; j++) m[j] += v[j];
  }
  return m;
}

function conRender(){
  if (!CON) return;
  var box = document.getElementById('conBox');
  if (!box) return;
  var m = conScores();
  var decs = CON.sc.dec.map(function(d, di){
    var opts = d.opts.map(function(o, oi){
      var cls = 'optbox' + (CON.sel[di] === oi ? (CON.done ? ' done' : ' sel') : '');
      return '<div class="' + cls + '" onclick="conPick(' + di + ',' + oi + ')">' + o[LANG] + '</div>';
    }).join('');
    return '<div><div class="dq">' + d.q[LANG] + '</div>' + opts + '</div>';
  }).join('');
  var mtrs = CON_LBL[LANG].map(function(lb, k){
    var w = Math.min(100, m[k]);
    return '<div class="mtr"><div class="mtrlbl"><span>' + lb + '</span><span>' + w + '</span></div>' +
           '<div class="mtrtrack"><div class="mtrfill' + (m[k] >= CON_META ? ' ok' : '') + '" style="width:' + w + '%"></div></div></div>';
  }).join('');
  var msg = CON.note || S('El trato lo cierras tú. Mueve tus tres decisiones y mira qué medidor sube y cuál se queda corto.',
                          'You are the one closing the deal. Move your three decisions and watch which meter rises and which falls short.');
  box.innerHTML =
    '<div class="wcase">' + CON.sc.intro[LANG] + '</div>' +
    '<div class="dlist">' + decs + '</div>' +
    '<div class="mtrs">' + mtrs + '</div>' +
    (CON.done ? '' : '<button class="wbtn" onclick="conCheck()">' + S('Cerrar el trato','Close the deal') + '</button>') +
    '<div class="wmsg ' + (CON.note ? (CON.noteOk ? 'ok' : 'warn') : '') + '">' + msg + '</div>';
}

function conPick(di, oi){
  if (!CON || CON.done) return;
  CON.sel[di] = oi;
  CON.note = null; CON.noteOk = false;
  conRender();
}

function conCheck(){
  if (!CON || CON.done) return;
  if (CON.sel.indexOf(null) !== -1) {
    CON.noteOk = false;
    CON.note = S('Falta elegir en las tres decisiones: el trato se cierra completo o no se cierra.',
                 'You still have to choose in all three decisions: a deal closes whole or it does not close.');
    conRender();
    return;
  }
  var m = conScores();
  if (m[0] >= CON_META && m[1] >= CON_META && m[2] >= CON_META) {
    CON.done = true; CON.noteOk = true;
    CON.note = S('Trato cerrado con los tres medidores arriba de la marca. Esa compra sostiene a quien produce con condiciones visibles, se apoya en información que puedes comprobar y no deja basura de más.',
                 'Deal closed with all three meters above the mark. That purchase backs producers whose conditions are visible, rests on information you can check, and leaves no extra waste behind.');
    conRender();
    return;
  }
  CON.tries++;
  if (CON.tries >= 3) {
    CON.sel = CON.sc.best.slice();
    CON.done = true; CON.noteOk = false;
    CON.note = S('Esta es la combinación que deja los tres medidores arriba: comprar a quien muestra sus condiciones, pedir lo que se puede comprobar y ajustar la cantidad al conteo. Cada decisión levanta un medidor distinto, por eso ninguna basta sola.',
                 'This is the combination that lifts all three meters: buy from whoever shows their conditions, ask for what you can check, and match the amount to the headcount. Each decision lifts a different meter, which is why none of them is enough on its own.');
    conRender();
    return;
  }
  var low = 0;
  if (m[1] < m[low]) low = 1;
  if (m[2] < m[low]) low = 2;
  CON.noteOk = false;
  if (low === 0) {
    CON.note = S('Todavía no. El medidor del trato justo se quedó corto: revisa a quién le estás comprando y qué sabes de las condiciones en que se produce.',
                 'Not yet. The fair deal meter fell short: look again at who you are buying from and what you know about the conditions behind the product.');
  } else if (low === 1) {
    CON.note = S('Todavía no. El medidor de la información se quedó corto: pregúntate qué pediste que se pueda comprobar después de pagar.',
                 'Not yet. The information meter fell short: ask yourself what you requested that can still be checked after paying.');
  } else {
    CON.note = S('Todavía no. El medidor del entorno se quedó corto: mira cuánto estás pidiendo y en qué llega el pedido.',
                 'Not yet. The surroundings meter fell short: look at how much you are ordering and what it arrives in.');
  }
  conRender();
}

/* ================================================
   WIDGET 3 - RUTA DEL RECLAMO (secuenciador)
   The steps of a lawful complaint arrive scrambled; one tap picks a step and
   the next tap swaps it. A failed check names the first step out of place and
   asks what has to exist before it. Third failed check lays out the route
   (Rule 8, pattern A).
   ================================================ */
var RUT = null;
function buildRuta(rng){
  var pools = [
    { t:{ es:'Caso: un aparato que no es lo que se anunció', en:'Case: a device that is not what was advertised' },
      steps:[
        { es:'Reunir el ticket, el anuncio y las fotos de lo que llegó.',
          en:'Gather the receipt, the advert and photos of what arrived.' },
        { es:'Reclamar por escrito en la tienda y guardar el folio que te den.',
          en:'Complain in writing at the shop and keep the reference number they give you.' },
        { es:'Presentar la queja ante la autoridad que protege a quien compra.',
          en:'File the complaint with the authority that protects buyers.' },
        { es:'Acudir a la audiencia de conciliación con todas las pruebas.',
          en:'Attend the conciliation hearing with all the evidence.' },
        { es:'Verificar que el acuerdo se cumpla dentro del plazo y dejar constancia.',
          en:'Check that the agreement is honored within the deadline and put it on record.' } ] },
    { t:{ es:'Caso: una obra pública que se pagó y no se terminó', en:'Case: public works that were paid for and never finished' },
      steps:[
        { es:'Documentar con fotos y fechas lo que sí quedó construido.',
          en:'Document with photos and dates what actually got built.' },
        { es:'Solicitar por transparencia el contrato y el calendario de la obra.',
          en:'Request the contract and the works schedule through the transparency channel.' },
        { es:'Comparar lo contratado con lo entregado y anotar cada diferencia.',
          en:'Compare what was contracted with what was delivered and note every difference.' },
        { es:'Presentar la queja ante el órgano de control con ese comparativo.',
          en:'File the complaint with the oversight body using that comparison.' },
        { es:'Dar seguimiento al folio y llevar el resultado a la asamblea del barrio.',
          en:'Follow the case number and take the outcome to the neighborhood assembly.' } ] }
  ];
  var p = pools[Math.floor(rng() * pools.length)];
  RUT = { p:p, order:shufflePerm(p.steps.length, rng), sel:null, tries:0, done:false, note:null, noteOk:false };
  return '<div class="wgt" data-widget="timeline" id="wRuta">' +
      wgtHead(S('Ruta del reclamo','Complaint route'),
              S('Los pasos llegan revueltos. Ponlos en el orden que los sostiene: toca uno y luego otro para intercambiarlos.',
                'The steps arrive scrambled. Put them in the order that holds them up: tap one step and then another to swap them.')) +
      '<div id="rutBox"></div>' +
    '</div>';
}

function rutRender(){
  if (!RUT) return;
  var box = document.getElementById('rutBox');
  if (!box) return;
  var chips = RUT.order.map(function(ei, pos){
    var cls = 'tl-chip' + (RUT.sel === pos ? ' sel' : '') + (RUT.done ? ' locked' : '');
    return '<div class="' + cls + '" onclick="rutTap(' + pos + ')"><span class="tl-num">' + (pos + 1) + '</span> ' + RUT.p.steps[ei][LANG] + '</div>';
  }).join('');
  var msg = RUT.note || S('Pregúntate en cada paso qué tiene que existir ya para poder darlo.',
                          'At each step ask what has to exist already before you can take it.');
  box.innerHTML =
    '<div class="wcase">' + RUT.p.t[LANG] + '</div>' +
    '<div class="tl-list">' + chips + '</div>' +
    (RUT.done ? '' : '<button class="wbtn" onclick="rutCheck()">' + S('Revisar la ruta','Check the route') + '</button>') +
    '<div class="wmsg ' + (RUT.note ? (RUT.noteOk ? 'ok' : 'warn') : '') + '">' + msg + '</div>';
}

function rutTap(pos){
  if (!RUT || RUT.done) return;
  if (RUT.sel === null) { RUT.sel = pos; }
  else if (RUT.sel === pos) { RUT.sel = null; }
  else {
    var t = RUT.order[RUT.sel]; RUT.order[RUT.sel] = RUT.order[pos]; RUT.order[pos] = t;
    RUT.sel = null;
  }
  rutRender();
}

function rutCheck(){
  if (!RUT || RUT.done) return;
  var ok = true, first = -1, i;
  for (i = 0; i < RUT.order.length; i++) if (RUT.order[i] !== i) { ok = false; if (first < 0) first = i; }
  if (ok) {
    RUT.done = true; RUT.noteOk = true;
    RUT.note = S('Ruta armada. Cada paso deja un rastro que el siguiente necesita, y por eso el reclamo se puede sostener frente a quien tenga que resolverlo.',
                 'Route assembled. Each step leaves a trace the next one needs, and that is why the complaint can be held up before whoever has to resolve it.');
    rutRender();
    return;
  }
  RUT.tries++;
  if (RUT.tries >= 3) {
    RUT.order = RUT.p.steps.map(function(_, k){ return k; });
    RUT.done = true; RUT.noteOk = false;
    RUT.note = S('Esta es la ruta. Primero existe la prueba, después el reclamo directo, luego la instancia que puede obligar, y al final la verificación: sin ese orden, el reclamo se cae por falta de rastro.',
                 'This is the route. First the evidence exists, then the direct complaint, then the body that can compel, and last the verification: without that order the complaint collapses for lack of a trace.');
    rutRender();
    return;
  }
  RUT.noteOk = false;
  RUT.note = S('Todavía no. Mira el paso número ' + (first + 1) + ': ¿qué necesitarías tener en la mano para poder darlo?',
               'Not yet. Look at step number ' + (first + 1) + ': what would you need in hand to be able to take it?');
  rutRender();
}

/* ================================================
   WIDGET 4 - A DONDE ACUDO (emparejador de dos columnas)
   A situation on the left, the body that can act on the right. Tap one of each.
   A wrong pair answers with what that body actually does, never with a bare
   cross; the third miss on the same situation reveals its pair (Rule 8, A).
   ================================================ */
var PUE = null;
function buildPuente(rng){
  var sets = [
    [ { l:{ es:'Un producto no cumple lo que anunció y la tienda no responde al reclamo.',
            en:'A product does not do what the advert promised and the shop ignores the complaint.' },
        r:{ es:'La autoridad que protege a quien compra.', en:'The authority that protects buyers.' },
        w:{ es:'Atiende a quien compró un producto o contrató un servicio que no cumplió lo ofrecido.',
            en:'It deals with whoever bought a product or hired a service that failed to deliver what was offered.' } },
      { l:{ es:'El municipio se niega a entregar el contrato de una obra pagada con dinero público.',
            en:'The town hall refuses to hand over the contract for works paid with public money.' },
        r:{ es:'El órgano que obliga a entregar información pública.', en:'The body that compels the release of public information.' },
        w:{ es:'Revisa las negativas de información y puede ordenar que el documento se entregue.',
            en:'It reviews refusals of information and can order the document to be handed over.' } },
      { l:{ es:'Una autoridad detiene a una persona y no le dice el motivo ni la deja avisar a nadie.',
            en:'An authority detains a person without stating the reason or letting them notify anybody.' },
        r:{ es:'La comisión que defiende los derechos humanos frente a la autoridad.', en:'The commission that defends human rights against the authorities.' },
        w:{ es:'Recibe quejas por abusos de la autoridad y emite recomendaciones públicas.',
            en:'It receives complaints about abuses by the authorities and issues public recommendations.' } },
      { l:{ es:'Hay indicios de que un servidor público usó dinero de un programa para un gasto personal.',
            en:'There are signs that a public servant used program money for a personal expense.' },
        r:{ es:'La contraloría que revisa cómo se gastó el dinero público.', en:'The comptroller that reviews how public money was spent.' },
        w:{ es:'Investiga el manejo de los recursos públicos y finca responsabilidades a quien los usó mal.',
            en:'It investigates the handling of public resources and holds to account whoever misused them.' } } ],
    [ { l:{ es:'Una planta vierte residuos en el arroyo que cruza el pueblo.',
            en:'A plant dumps waste into the stream that crosses the village.' },
        r:{ es:'La autoridad que vigila el cuidado del ambiente.', en:'The authority that oversees care for the environment.' },
        w:{ es:'Inspecciona descargas y emisiones y puede suspender la actividad que las provoca.',
            en:'It inspects discharges and emissions and can suspend the activity causing them.' } },
      { l:{ es:'Un patrón no paga las horas extra que su personal ya trabajó.',
            en:'An employer does not pay the overtime the staff have already worked.' },
        r:{ es:'La autoridad laboral que atiende los conflictos de trabajo.', en:'The labor authority that handles work disputes.' },
        w:{ es:'Recibe la demanda de quien trabaja y resuelve lo que se le adeuda.',
            en:'It receives the claim from the worker and settles what is owed.' } },
      { l:{ es:'Un servidor público pide un pago para hacer un trámite que es gratuito.',
            en:'A public servant asks for a payment to carry out a procedure that is free of charge.' },
        r:{ es:'El órgano de control interno que investiga a la autoridad.', en:'The internal oversight body that investigates the authorities.' },
        w:{ es:'Investiga la conducta de quien ocupa un cargo y puede sancionarla.',
            en:'It investigates the conduct of whoever holds the post and can sanction it.' } },
      { l:{ es:'En la escuela cobran una cuota que ningún acuerdo respalda.',
            en:'At school a fee is charged that no agreement backs up.' },
        r:{ es:'El consejo escolar y la autoridad educativa de la zona.', en:'The school council and the district education authority.' },
        w:{ es:'Acuerda y revisa lo que el plantel puede cobrar, y responde por escrito.',
            en:'It agrees and reviews what the campus may charge, and answers in writing.' } } ]
  ];
  var items = sets[Math.floor(rng() * sets.length)];
  PUE = { items:items, right:shufflePerm(items.length, rng), sel:null, tries:0, solved:[], done:false, note:null, noteOk:false };
  items.forEach(function(){ PUE.solved.push(false); });
  return '<div class="wgt" data-widget="match" id="wPuente">' +
      wgtHead(S('A dónde acudo','Where to take it'),
              S('Une cada situación con la instancia que puede resolverla. Toca una de la izquierda y luego una de la derecha.',
                'Match each situation with the body that can resolve it. Tap one on the left and then one on the right.')) +
      '<div id="pueBox"></div>' +
    '</div>';
}

function pueRender(){
  if (!PUE) return;
  var box = document.getElementById('pueBox');
  if (!box) return;
  var left = PUE.items.map(function(it, i){
    var cls = 'optbox' + (PUE.solved[i] ? ' done' : (PUE.sel === i ? ' sel' : ''));
    return '<div class="' + cls + '" onclick="pueLeft(' + i + ')">' + it.l[LANG] + '</div>';
  }).join('');
  var right = PUE.right.map(function(ri, pos){
    var cls = 'optbox' + (PUE.solved[ri] ? ' done' : '');
    return '<div class="' + cls + '" onclick="pueRight(' + pos + ')">' + PUE.items[ri].r[LANG] + '</div>';
  }).join('');
  var msg = PUE.note || S('No todas las instancias hacen lo mismo: elige por lo que cada una puede resolver, no por el tema del que se habla.',
                          'Not every body does the same thing: choose by what each one can actually resolve, not by the topic being discussed.');
  box.innerHTML =
    '<div class="mcols">' +
      '<div><div class="colh">' + S('Situación','Situation') + '</div>' + left + '</div>' +
      '<div><div class="colh">' + S('Instancia','Body') + '</div>' + right + '</div>' +
    '</div>' +
    '<div class="wmsg ' + (PUE.note ? (PUE.noteOk ? 'ok' : 'warn') : '') + '">' + msg + '</div>' +
    '<div class="wprog">' + PUE.solved.filter(function(x){ return x; }).length + ' / ' + PUE.items.length + '</div>';
}

function pueLeft(i){
  if (!PUE || PUE.done || PUE.solved[i]) return;
  PUE.sel = (PUE.sel === i) ? null : i;
  if (PUE.sel !== i) PUE.tries = 0;
  PUE.note = null; PUE.noteOk = false;
  pueRender();
}

function pueRight(pos){
  if (!PUE || PUE.done) return;
  var ri = PUE.right[pos];
  if (PUE.solved[ri]) return;
  if (PUE.sel === null) {
    PUE.noteOk = false;
    PUE.note = S('Elige primero una situación de la izquierda y después la instancia que le corresponde.',
                 'Pick a situation on the left first and then the body that fits it.');
    pueRender();
    return;
  }
  var i = PUE.sel;
  if (ri === i) {
    PUE.solved[i] = true; PUE.sel = null; PUE.tries = 0; PUE.noteOk = true;
    PUE.note = S('Correcto. ' + PUE.items[i].w.es, 'Correct. ' + PUE.items[i].w.en);
    if (PUE.solved.every(function(x){ return x; })) {
      PUE.done = true;
      PUE.note = S('Tablero completo. Cada reclamo llega a donde puede resolverse, y ese es el rastro que hace exigible una respuesta.',
                   'Board complete. Each complaint reaches where it can be resolved, and that trace is what makes an answer enforceable.');
    }
    pueRender();
    return;
  }
  PUE.tries++;
  if (PUE.tries >= 3) {
    PUE.solved[i] = true; PUE.sel = null; PUE.tries = 0; PUE.noteOk = false;
    PUE.note = S('Esa situación iba con otra instancia. ' + PUE.items[i].w.es,
                 'That situation belonged with a different body. ' + PUE.items[i].w.en);
    if (PUE.solved.every(function(x){ return x; })) PUE.done = true;
    pueRender();
    return;
  }
  PUE.noteOk = false;
  PUE.note = S('Todavía no. Lo que elegiste hace otra cosa: ' + PUE.items[ri].w.es + ' Vuelve a leer qué se necesita resolver.',
               'Not yet. What you picked does something else: ' + PUE.items[ri].w.en + ' Read again what needs resolving.');
  pueRender();
}

/* ================================================
   WIDGET 5 - CUADERNO ABIERTO (ejercicio de reflexión)
   Seeded prompt, answered by writing or sketching. Non verdict feedback.
   ================================================ */
function buildCuaderno(rng){
  var PROMPTS = [
    { es:'Elige algo que hayas comprado esta semana y rastrea su cadena: quién lo produjo, qué información tuviste antes de pagar y qué te habría hecho falta saber.',
      en:'Pick something you bought this week and trace its chain: who produced it, what information you had before paying and what you would have needed to know.' },
    { es:'Traza el mapa de un reclamo real de tu escuela o tu colonia: marca dónde empieza, por dónde tendría que pasar y quién comprobaría que se cumplió.',
      en:'Sketch the map of a real complaint from your school or your neighborhood: mark where it starts, where it would have to pass through and who would check that it was honored.' },
    { es:'Escribe una propuesta de tres puntos para que una compra que hace tu escuela sea más justa con quien produce: qué cambia, con quién se acuerda y quién revisa que se cumpla.',
      en:'Write a three point proposal so that a purchase your school makes becomes fairer to the producers: what changes, with whom it is agreed and who checks that it happens.' }
  ];
  var p = PROMPTS[Math.floor(rng() * PROMPTS.length)];
  var wrap = document.createElement('div');
  wrap.className = 'wgt section';
  wrap.setAttribute('data-widget', 'reflect');
  wrap.id = 'wCuaderno';
  wrap.innerHTML =
    wgtHead(S('Cuaderno abierto','Open notebook'),
            S('Aquí escribes o trazas tu propia respuesta.','Here you write or sketch your own answer.')) +
    '<div class="reflect-prompt">' + p[LANG] + '</div>' +
    '<div class="wtabs">' +
      '<button class="wtab active" onclick="cuadTab(\'type\',this)">' + t('tab-type') + '</button>' +
      '<button class="wtab" onclick="cuadTab(\'draw\',this)">' + t('tab-draw') + '</button>' +
    '</div>' +
    '<div class="wpanel active" id="cuad_type"><textarea class="wtextarea" id="cuadTa" placeholder="' + S('Tu respuesta...','Your answer...') + '"></textarea></div>' +
    '<div class="wpanel" id="cuad_draw"><div class="cvwrap"><canvas class="dcanvas" id="cuadCv"></canvas>' +
      '<div class="ctoolbar">' +
        '<button class="tbtn2 bpen on">' + t('btn-pen') + '</button>' +
        '<button class="tbtn2 bmarker">' + t('btn-marker') + '</button>' +
        '<button class="tbtn2 beraser">' + t('btn-eraser') + '</button>' +
        '<div class="cdot sel" data-color="#0f2d5a" style="background:#0f2d5a"></div>' +
        '<div class="cdot" data-color="#1a1a16" style="background:#1a1a16"></div>' +
        '<div class="cdot" data-color="#8b2500" style="background:#8b2500"></div>' +
        '<div class="cdot" data-color="#1d4e89" style="background:#1d4e89"></div>' +
        '<button class="clrbtn">' + t('btn-clear') + '</button>' +
      '</div>' +
    '</div></div>' +
    '<button class="wbtn" onclick="cuadSave()">' + S('Guardar','Save') + '</button>' +
    '<div class="wmsg" id="cuadFb">' + S('Aquí no hay una sola respuesta. Escribe la tuya y compárala después con la de alguien más.',
                                         'There is no single answer here. Write yours and compare it later with someone else.') + '</div>';
  document.getElementById('lessonBody').appendChild(wrap);
}

function cuadTab(which, btn){
  ['type', 'draw'].forEach(function(x){
    var el = document.getElementById('cuad_' + x);
    if (el) el.classList.toggle('active', x === which);
  });
  var wrap = document.getElementById('wCuaderno');
  if (wrap) wrap.querySelectorAll('.wtab').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  if (which === 'draw') setTimeout(function(){
    var c = document.getElementById('cuadCv');
    if (c && !c.width) initCanvas(c);
  }, 60);
}

function cuadSave(){
  var fb = document.getElementById('cuadFb');
  if (!fb) return;
  fb.className = 'wmsg ok';
  fb.textContent = S('Guardado. Lo que escribiste ya es una propuesta, y una propuesta se puede llevar a una asamblea o a una autoridad.',
                     'Saved. What you wrote is already a proposal, and a proposal can be taken to an assembly or to an authority.');
}

/* ================================================
   buildLesson - interleaved concept, manipulative, graded problem (Rule 1)
   ================================================ */
function buildLesson(rng) {
  problems = []; answeredCount = 0; correctCount = 0;
  document.getElementById('lessonBody').innerHTML = '';

  /* CONCEPTO 1 */
  addSection(S('CONCEPTO 1','CONCEPT 1'),
    '<h2>' + S('Lo que hay detrás de un precio','What sits behind a price') + '</h2>' +
    '<p>' + S('Producir cualquier cosa exige decisiones: a quién se contrata y en qué condiciones, con qué materiales, qué se hace con los residuos, qué se le dice a quien compra. Ninguna de esas decisiones es solo técnica. En todas hay alguien que gana algo y alguien que puede salir perdiendo, y por eso la producción se puede juzgar con criterios éticos y no solo con la cuenta de ganancias.',
              'Producing anything demands decisions: who gets hired and under what conditions, with which materials, what happens to the waste, what buyers are told. None of those decisions is merely technical. In all of them somebody gains something and somebody may lose out, which is why production can be judged with ethical criteria and not only with the profit column.') + '</p>' +
    '<p>' + S('Tres criterios ordenan ese juicio: que quien trabaja reciba pago, tiempo y protección conforme a lo acordado; que quien compra reciba información verdadera; y que el costo de producir no se descargue sobre personas que no participaron en la decisión, empezando por el agua, el aire y el suelo del lugar. Cuando un precio baja conviene preguntar de dónde salió esa rebaja: de producir mejor, o de cobrársela a alguien más.',
              'Three criteria order that judgment: that whoever works receives pay, time and protection as agreed; that whoever buys receives truthful information; and that the cost of producing is not dumped on people who took no part in the decision, starting with the water, the air and the soil of the place. When a price drops it pays to ask where the discount came from: from producing better, or from charging it to somebody else.') + '</p>' +
    '<div class="callout"><p><strong>' + S('Clave: ','Key: ') + '</strong>' +
      S('un precio bajo no es bueno ni malo por sí mismo; lo que se juzga es quién termina financiando la rebaja.',
        'a low price is neither good nor bad in itself; what gets judged is who ends up financing the discount.') + '</p></div>' +
    '<div class="rules-grid">' +
      '<div class="rcard"><div class="rname">' + S('Trabajo digno','Decent work') + '</div><div class="rform">' + S('pago, tiempo, protección','pay, time, protection') + '</div><div class="rnote">' + S('Lo acordado se cumple y el riesgo se cubre.','What was agreed is honored and the risk is covered.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Información verdadera','Truthful information') + '</div><div class="rform">' + S('lo que dice es lo que es','what it says is what it is') + '</div><div class="rnote">' + S('Quien compra puede comprobar lo que le ofrecen.','Buyers can verify what they are offered.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Costo asumido','Cost carried') + '</div><div class="rform">' + S('se paga donde se genera','paid where it is produced') + '</div><div class="rnote">' + S('Los residuos no se dejan en el patio de otro.','Waste is not left in somebody else yard.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Mejora real','Real improvement') + '</div><div class="rform">' + S('menos desperdicio','less waste') + '</div><div class="rnote">' + S('El ahorro nace del proceso, no de un recorte ajeno.','The saving comes from the process, not from cutting somebody else.') + '</div></div>' +
    '</div>' +
    buildRastreador(rng));
  rasRender();

  /* PROBLEMA 1 */
  addProblem(pick([
    { title:{ es:'De dónde salió la rebaja', en:'Where the discount came from' }, showWork:false,
      stmt:{ es:'Dos talleres ofrecen el mismo uniforme más barato que el ciclo pasado. El primero rediseñó el corte para aprovechar mejor la tela; el segundo dejó de pagar las horas extra de quien cose. ¿Qué juicio corresponde a las dos rebajas?',
             en:'Two workshops offer the same uniform cheaper than last year. The first redesigned its cutting so the cloth goes further; the second stopped paying the overtime of whoever sews. Which judgment fits the two discounts?' },
      options:{ es:[
        'Solo la primera es una mejora real: la segunda abarata el uniforme trasladando el costo a quien trabajó esas horas.',
        'Las dos son mejoras reales, porque en ambos casos el taller encontró la forma de entregar el mismo uniforme por menos dinero.',
        'Ninguna es aceptable, porque toda rebaja de precio termina afectando a quien fabrica el producto.',
        'Solo la segunda es una mejora real, porque ajustar los pagos internos es una decisión del taller que no altera el uniforme.' ],
        en:[
        'Only the first is a real improvement: the second cheapens the uniform by shifting the cost onto whoever worked those hours.',
        'Both are real improvements, because in each case the workshop found a way to deliver the same uniform for less money.',
        'Neither is acceptable, because every price cut ends up harming whoever manufactures the product.',
        'Only the second is a real improvement, because adjusting internal pay is a workshop decision that leaves the uniform unchanged.' ] },
      correct:0,
      hint:{ es:'Sigue el dinero de la rebaja en cada taller: pregúntate de qué bolsillo salió lo que dejó de cobrarse.',
             en:'Follow the money behind each discount: ask which pocket the uncharged amount came out of.' },
      explanation:{ es:'Aprovechar mejor la tela produce el mismo uniforme con menos insumo, y ahí nadie queda pagando la diferencia. Dejar de pagar horas ya trabajadas no reduce ningún costo: lo traslada a quien cosió, que financia la rebaja con tiempo que no se le retribuyó.',
                    en:'Getting more out of the cloth produces the same uniform with less input, and there nobody is left paying the difference. Not paying hours already worked reduces no cost at all: it shifts it onto whoever sewed, who finances the discount with time that went unpaid.' } },
    { title:{ es:'De dónde salió la rebaja', en:'Where the discount came from' }, showWork:false,
      stmt:{ es:'Dos panaderías bajan el precio del pan. Una compra la harina en volumen junto con otras panaderías del barrio; la otra retiró los guantes y el extintor que usa quien maneja el horno. ¿Qué juicio corresponde a las dos rebajas?',
             en:'Two bakeries lower the price of bread. One buys flour in bulk together with other neighborhood bakeries; the other removed the gloves and the extinguisher used by whoever works the oven. Which judgment fits the two discounts?' },
      options:{ es:[
        'Solo la compra conjunta es una mejora real: retirar el equipo de seguridad convierte el ahorro en riesgo para quien trabaja frente al horno.',
        'Las dos son mejoras reales, porque las dos panaderías lograron reducir sus gastos sin cambiar la receta del pan.',
        'Ninguna es aceptable, porque el precio del pan debería fijarse igual en todas las panaderías del barrio.',
        'Solo el retiro del equipo es una mejora real, porque el ahorro se nota de inmediato y la compra conjunta depende de otros negocios.' ],
        en:[
        'Only the joint purchase is a real improvement: removing the safety gear turns the saving into risk for whoever works the oven.',
        'Both are real improvements, because both bakeries managed to cut costs without changing the bread recipe.',
        'Neither is acceptable, because the price of bread should be set the same in every bakery in the neighborhood.',
        'Only removing the gear is a real improvement, because the saving shows up at once while the joint purchase depends on other businesses.' ] },
      correct:0,
      hint:{ es:'Revisa qué desapareció en cada caso: un gasto que se pudo negociar, o una protección que alguien necesitaba.',
             en:'Check what disappeared in each case: an expense that could be negotiated, or a protection somebody needed.' },
      explanation:{ es:'Comprar en volumen baja el precio del insumo y deja intacto todo lo demás. Quitar guantes y extintor no elimina el peligro del horno: lo traslada al cuerpo de quien lo opera, que es quien acaba pagando esa rebaja si algo sale mal.',
                    en:'Buying in bulk lowers the input price and leaves everything else intact. Removing gloves and extinguisher does not remove the danger of the oven: it shifts it onto the body of whoever operates it, who is the one paying for that discount if anything goes wrong.' } }
  ], rng), rng);

  /* PROBLEMA 2 */
  addProblem(pick([
    { title:{ es:'El costo que no aparece en el precio', en:'The cost that is not in the price' }, showWork:false,
      stmt:{ es:'Una fábrica de muebles descarga el aserrín y el barniz sobrante en el canal que cruza la colonia. Su dueño explica que así el mueble sale más barato y que nadie de su personal resulta afectado. ¿Qué le falta a ese razonamiento?',
             en:'A furniture factory dumps its sawdust and leftover varnish into the canal that crosses the neighborhood. The owner explains that this makes the furniture cheaper and that none of the staff is harmed. What is missing from that reasoning?' },
      options:{ es:[
        'Que el costo de limpiar el canal no desapareció: lo pagan las familias de la colonia, que no participaron en esa decisión.',
        'Nada le falta: si el personal de la fábrica no resulta afectado, la descarga queda dentro de lo que la empresa resuelve por su cuenta.',
        'Que el precio del mueble tendría que subir para que la fábrica pueda pagar mejores sueldos a quien lo produce.',
        'Que la fábrica debería avisar a la colonia antes de cada descarga para que las familias tomen sus precauciones.' ],
        en:[
        'That the cost of cleaning the canal did not vanish: it is paid by the families of the neighborhood, who took no part in that decision.',
        'Nothing is missing: if the factory staff are unharmed, the discharge stays within what the company settles on its own.',
        'That the price of the furniture would have to rise so the factory can pay better wages to whoever produces it.',
        'That the factory should warn the neighborhood before each discharge so the families can take precautions.' ] },
      correct:0,
      hint:{ es:'Haz la lista de todas las personas alcanzadas por la descarga, no solo de quienes trabajan dentro de la fábrica.',
             en:'List everyone reached by the discharge, not only the people working inside the factory.' },
      explanation:{ es:'El razonamiento mira solo hacia adentro de la fábrica. El barniz y el aserrín siguen costando dinero y salud, pero la cuenta llega a quien vive junto al canal y no eligió nada de eso. Un costo trasladado a terceros no es un ahorro: es una deuda que otros liquidan.',
                    en:'The reasoning looks only inside the factory. The varnish and sawdust still cost money and health, but the bill lands on whoever lives by the canal and chose none of it. A cost shifted onto third parties is not a saving: it is a debt that others settle.' } },
    { title:{ es:'El costo que no aparece en el precio', en:'The cost that is not in the price' }, showWork:false,
      stmt:{ es:'Una lavandería industrial manda a la coladera de la calle el agua con químicos de sus máquinas. La gerencia sostiene que el servicio es más barato así y que la ley no la obliga a instalar una trampa de residuos. ¿Qué le falta a ese razonamiento?',
             en:'An industrial laundry sends the chemical water from its machines into the street drain. Management holds that the service is cheaper this way and that no law obliges it to install a waste trap. What is missing from that reasoning?' },
      options:{ es:[
        'Que el tratamiento del agua no dejó de costar: ahora lo cubre el drenaje del vecindario y quien vive aguas abajo.',
        'Nada le falta: mientras ninguna norma exija la trampa de residuos, la decisión pertenece por completo a la empresa.',
        'Que la lavandería debería cobrar más caro su servicio para reunir el dinero de la trampa de residuos.',
        'Que conviene mandar el agua por la noche, cuando el drenaje de la calle recibe menos carga de las casas.' ],
        en:[
        'That treating the water did not stop costing: now the neighborhood drainage and whoever lives downstream cover it.',
        'Nothing is missing: as long as no rule demands the waste trap, the decision belongs entirely to the company.',
        'That the laundry should charge more for its service in order to raise the money for the waste trap.',
        'That it is better to send the water at night, when the street drainage takes less load from the houses.' ] },
      correct:0,
      hint:{ es:'Pregúntate si el costo desapareció o solo cambió de dueño, y quién es ese nuevo dueño.',
             en:'Ask whether the cost disappeared or merely changed owner, and who that new owner is.' },
      explanation:{ es:'Que la ley todavía no lo exija no borra el efecto: los químicos siguen en el agua y alguien tendrá que sacarlos. Ese alguien es el vecindario, que no cobra por recibirlos. El servicio parece barato porque una parte de su costo se factura fuera de la empresa.',
                    en:'That the law does not yet demand it does not erase the effect: the chemicals are still in the water and somebody will have to take them out. That somebody is the neighborhood, which charges nothing for receiving them. The service looks cheap because part of its cost is billed outside the company.' } }
  ], rng), rng);

  /* CONCEPTO 2 */
  addSection(S('CONCEPTO 2','CONCEPT 2'),
    '<h2>' + S('Consumir también es decidir','Consuming is also deciding') + '</h2>' +
    '<p>' + S('Cada compra sostiene una forma de producir. Quien consume no controla la fábrica, pero sí decide a quién le entrega su dinero, con qué información lo hace y cuánto pide. Por eso el consumo tiene un lado ético: no se agota en el gusto ni en el presupuesto de cada quien.',
              'Every purchase sustains a way of producing. Whoever consumes does not run the factory, but does decide who receives the money, with what information, and how much is ordered. That is why consuming has an ethical side: it does not end with personal taste or with the budget.') + '</p>' +
    '<p>' + S('Consumir con criterio empieza por separar dos cosas que llegan juntas: la publicidad, que existe para convencer, y la información, que existe para describir. La etiqueta, la ficha del producto y el comprobante describen; el anuncio promete. Quien compra tiene derecho a recibir información veraz, a que se respete lo ofrecido y a reclamar cuando no se cumple, y eso último solo se sostiene si guardó con qué comprobarlo. En una compra en línea la regla no cambia: importa quién vende, qué datos deja y qué comprobante entrega, más que la cantidad de estrellas que muestre.',
              'Consuming with judgment starts by separating two things that arrive together: advertising, which exists to convince, and information, which exists to describe. The label, the product sheet and the receipt describe; the advert promises. Buyers have the right to truthful information, to have what was offered honored, and to complain when it is not, and that last one only holds up if they kept something to prove it with. Online the rule does not change: who is selling, what details they leave and what receipt they give matter more than the number of stars on display.') + '</p>' +
    '<div class="callout"><p><strong>' + S('Clave: ','Key: ') + '</strong>' +
      S('la publicidad busca convencerte; la etiqueta y el comprobante son lo único que después puedes sostener frente a alguien.',
        'advertising sets out to convince you; the label and the receipt are the only things you can later hold up in front of somebody.') + '</p></div>' +
    '<div class="rules-grid">' +
      '<div class="rcard"><div class="rname">' + S('Información veraz','Truthful information') + '</div><div class="rform">' + S('leer la etiqueta','read the label') + '</div><div class="rnote">' + S('Describe el contenido; el anuncio solo promete.','It describes the content; the advert only promises.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Comparar','Compare') + '</div><div class="rform">' + S('precio y contenido','price and content') + '</div><div class="rnote">' + S('El precio solo se entiende junto a lo que trae.','Price makes sense only next to what comes in it.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Lo necesario','What is needed') + '</div><div class="rform">' + S('cantidad ajustada','matched amount') + '</div><div class="rnote">' + S('Lo que sobra se convierte en residuo.','Whatever is left over turns into waste.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Comprobante','Receipt') + '</div><div class="rform">' + S('rastro de la compra','a trace of the purchase') + '</div><div class="rnote">' + S('Sin él, el reclamo se queda sin respaldo.','Without it a complaint has nothing behind it.') + '</div></div>' +
    '</div>' +
    buildConsumo(rng));
  conRender();

  /* PROBLEMA 3 */
  addProblem(pick([
    { title:{ es:'El anuncio y la etiqueta', en:'The advert and the label' }, showWork:false,
      stmt:{ es:'Un jugo se anuncia como natural en el envase y en los carteles de la tienda. La etiqueta, en letra pequeña, dice que contiene agua, azúcar añadida y saborizante. ¿Qué conviene concluir?',
             en:'A juice is advertised as natural on the carton and on the shop posters. The label, in small print, says it contains water, added sugar and flavoring. What is the sound conclusion?' },
      options:{ es:[
        'Que la etiqueta describe lo que el producto contiene y el cartel solo busca convencer, así que la decisión se apoya en la etiqueta.',
        'Que el cartel y la etiqueta dicen lo mismo con otras palabras, porque un saborizante también se obtiene de la fruta.',
        'Que la palabra natural no compromete a nadie, y por eso revisar el envase o no revisarlo da exactamente igual.',
        'Que la etiqueta es un trámite para la autoridad y quien compra debería guiarse por el sabor del producto.' ],
        en:[
        'That the label describes what the product contains while the poster only sets out to convince, so the decision rests on the label.',
        'That the poster and the label say the same thing in different words, because flavoring can also come from fruit.',
        'That the word natural commits nobody, so checking the carton or not checking it makes no difference at all.',
        'That the label is paperwork for the authorities and buyers should be guided by how the product tastes.' ] },
      correct:0,
      hint:{ es:'Pregúntate cuál de los dos textos tendrías en la mano si después quisieras reclamar lo que te ofrecieron.',
             en:'Ask which of the two texts you would be holding if you later wanted to complain about what you were offered.' },
      explanation:{ es:'El cartel usa una palabra que suena bien y no compromete un contenido. La etiqueta enumera lo que trae el envase y es el documento que puede compararse con lo que se prometió. Por eso la etiqueta decide y el anuncio solo acompaña.',
                    en:'The poster uses a word that sounds good and commits to no content. The label lists what is in the carton and is the document that can be compared with what was promised. That is why the label decides and the advert merely accompanies.' } },
    { title:{ es:'El anuncio y la etiqueta', en:'The advert and the label' }, showWork:false,
      stmt:{ es:'Una tienda en línea muestra decenas de reseñas de cinco estrellas publicadas el mismo día y con frases casi idénticas. El vendedor no aparece con nombre, domicilio ni forma de contacto. ¿Qué conviene concluir?',
             en:'An online shop displays dozens of five star reviews posted on the same day with almost identical wording. The seller shows no name, address or way of getting in touch. What is the sound conclusion?' },
      options:{ es:[
        'Que esas reseñas no son información comprobable, y antes de pagar conviene buscar los datos del vendedor y el comprobante que entregará.',
        'Que la cantidad de reseñas positivas es la mejor prueba de que el producto cumple con lo que ofrece.',
        'Que comprar en línea implica un riesgo que ninguna revisión previa puede reducir.',
        'Que basta con pagar al recibir el paquete para que la compra quede protegida ante cualquier problema.' ],
        en:[
        'That those reviews are not verifiable information, and before paying it is worth looking for the seller details and the receipt they will issue.',
        'That the sheer number of positive reviews is the best proof that the product does what it offers.',
        'That buying online carries a risk no prior checking can reduce.',
        'That paying on delivery is enough for the purchase to be protected against any problem.' ] },
      correct:0,
      hint:{ es:'Piensa a quién le reclamarías si el paquete llega distinto, y con qué documento lo harías.',
             en:'Think about who you would complain to if the parcel arrives different, and with what document.' },
      explanation:{ es:'Un montón de reseñas iguales publicadas el mismo día no describe nada verificable. Lo que sostiene una compra es saber quién vende y quedarse con un comprobante, porque son los dos elementos que permiten reclamar después. Pagar al recibir no reemplaza ninguno de los dos.',
                    en:'A pile of identical reviews posted on one day describes nothing verifiable. What holds a purchase up is knowing who sells and keeping a receipt, because those are the two things that allow a later complaint. Paying on delivery replaces neither of them.' } }
  ], rng), rng);

  /* PROBLEMA 4 */
  addProblem(pick([
    { title:{ es:'Lo ofrecido y lo entregado', en:'What was offered and what arrived' }, showWork:false,
      stmt:{ es:'Una alumna compra unos audífonos anunciados como inalámbricos y en casa descubre que solo funcionan con cable. Regresa a la tienda con el ticket y le responden que no hay devoluciones. ¿Qué juicio y qué acción corresponden?',
             en:'A student buys headphones advertised as wireless and at home finds they only work with a cable. She returns to the shop with the receipt and is told there are no refunds.  Which judgment and which action fit?' },
      options:{ es:[
        'Lo ofrecido no se cumplió, así que puede dejar su reclamo por escrito en la tienda y, si no la atienden, presentarlo ante la autoridad que protege a quien compra.',
        'El aviso de que no hay devoluciones cancela cualquier reclamo, porque estaba a la vista antes de que ella pagara.',
        'Lo que corresponde es publicar el caso en redes y esperar a que la presión sobre la tienda la obligue a responder.',
        'El error fue no probar los audífonos en el mostrador, así que ya no queda ninguna vía para la alumna.' ],
        en:[
        'What was offered was not delivered, so she can leave her complaint in writing at the shop and, if ignored, take it to the authority that protects buyers.',
        'The no refunds notice cancels any complaint, because it was in plain sight before she paid.',
        'The right move is to post the case on social media and wait for the pressure on the shop to force a response.',
        'The mistake was not testing the headphones at the counter, so no route is left open to the student.' ] },
      correct:0,
      hint:{ es:'Separa dos cosas: qué derecho quedó incumplido, y cuál es la vía que deja constancia de tu reclamo.',
             en:'Separate two things: which right went unmet, and which route leaves a record of your complaint.' },
      explanation:{ es:'El producto no hace lo que el anuncio prometió, y ese incumplimiento no lo borra ningún letrero: un aviso interno no puede cancelar un derecho. El ticket es la prueba, el reclamo por escrito abre el expediente y la autoridad de protección al consumidor es la instancia que puede obligar a la tienda. La difusión pública no obliga a nada.',
                    en:'The product does not do what the advert promised, and no sign erases that failure: an in house notice cannot cancel a right. The receipt is the evidence, the written complaint opens the file, and the consumer protection authority is the body that can compel the shop. Public exposure compels nothing.' } },
    { title:{ es:'Lo ofrecido y lo entregado', en:'What was offered and what arrived' }, showWork:false,
      stmt:{ es:'Una familia contrata la reparación de un refrigerador. El técnico cobra por adelantado, deja una nota escrita a mano con su teléfono y el aparato sigue sin enfriar. ¿Qué juicio y qué acción corresponden?',
             en:'A family hires a fridge repair. The technician charges in advance, leaves a handwritten note with a phone number, and the appliance still does not cool. Which judgment and which action fit?' },
      options:{ es:[
        'El servicio no se prestó como se acordó, así que puede reclamarlo por escrito y llevar la nota y el pago ante la autoridad que protege a quien contrata un servicio.',
        'Como la nota está escrita a mano y no trae datos fiscales, el acuerdo nunca existió y no hay nada que reclamar.',

  addSection(S('CONCEPTO 3','CONCEPT 3'),
    '<h2>' + S('El Estado de derecho democrático','The democratic rule of law') + '</h2>' +
    '<p>' + S('Hay Estado de derecho cuando las reglas se conocen de antemano, se aplican por igual a toda persona y también obligan a quien manda. Ese último punto es el que decide: una autoridad que puede saltarse la norma cuando le conviene no está aplicando la ley, está usándola. Y para que la regla se sostenga hacen falta procedimientos e instituciones donde reclamar, porque un derecho sin vía para exigirlo se queda escrito.',
              'There is rule of law when the rules are known in advance, apply equally to every person, and also bind those who govern. That last point is what decides it: an authority able to skip the rule when convenient is not applying the law, it is using it. And for the rule to hold there must be procedures and institutions where claims can be made, because a right with no route to demand it stays on paper.') + '</p>' +
    '<p>' + S('La palabra democrático agrega tres exigencias: que las normas se elaboren con participación y no se impongan, que respeten los derechos humanos aunque una mayoría opine distinto, y que la autoridad rinda cuentas de lo que hace con el dinero y el poder que le fueron confiados. El Estado de derecho se debilita cuando la falta queda sin consecuencia, cuando el asunto se arregla por fuera con un pago, cuando la información se guarda, y cuando alguien decide cobrarse la justicia por su cuenta.',
              'The word democratic adds three demands: that rules are drawn up with participation rather than imposed, that they respect human rights even when a majority thinks otherwise, and that the authorities account for what they do with the money and the power entrusted to them. The rule of law weakens when a wrong carries no consequence, when the matter is settled outside with a payment, when information is withheld, and when somebody decides to collect justice on their own.') + '</p>' +
    '<div class="callout"><p><strong>' + S('Clave: ','Key: ') + '</strong>' +
      S('la prueba no es que existan leyes e instituciones, sino que alcancen igual a quien tiene poder y a quien no lo tiene.',
        'the test is not that laws and institutions exist, but that they reach the powerful and the powerless alike.') + '</p></div>' +
    '<div class="rules-grid">' +
      '<div class="rcard"><div class="rname">' + S('Reglas conocidas','Known rules') + '</div><div class="rform">' + S('antes, no después','beforehand, not after') + '</div><div class="rnote">' + S('Nadie responde por una regla que ignoraba.','Nobody answers for a rule they could not know.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Misma ley','Same law') + '</div><div class="rform">' + S('sin excepciones por cargo','no exceptions by rank') + '</div><div class="rnote">' + S('El apellido o el puesto no cambian la norma.','Surname or post do not change the rule.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Rendición de cuentas','Accountability') + '</div><div class="rform">' + S('explicar y comprobar','explain and prove it') + '</div><div class="rnote">' + S('Quien decide muestra con qué y para qué.','Whoever decides shows with what and what for.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Vía para reclamar','Route to complain') + '</div><div class="rform">' + S('instancia y plazo','a body and a deadline') + '</div><div class="rnote">' + S('Un derecho sin vía se queda en el papel.','A right with no route stays on paper.') + '</div></div>' +
    '</div>' +
    buildRuta(rng));

  addSection(S('CONCEPTO 4','CONCEPT 4'),
    '<h2>' + S('Lo que la ciudadanía sostiene','What citizens hold up') + '</h2>' +
    '<p>' + S('El Estado de derecho no se sostiene solo con leyes: se sostiene con personas que las usan. La ciudadanía activa pide información pública, denuncia por la vía que corresponde, participa en asambleas y consultas, vigila que lo acordado se cumpla, y también decide con su consumo, porque comprar mercancía que nadie puede rastrear sostiene una cadena que ninguna autoridad revisa.',
              'The rule of law does not stand on laws alone: it stands on people who use them. Active citizens request public information, report through the route that fits, take part in assemblies and consultations, keep watch that agreements are honored, and also decide with what they buy, because purchasing goods nobody can trace sustains a chain no authority reviews.') + '</p>' +
    '<p>' + S('No toda reacción sirve igual. Señalar a alguien en redes, arreglar el asunto con un pago o cobrarse la justicia por propia mano dejan una sensación de respuesta y ningún expediente: no hay quién revise, quién corrija ni quién responda si el señalamiento estaba equivocado. Una propuesta ciudadana útil, en cambio, dice qué cambia, con quién se acuerda, quién da seguimiento y en qué momento se comprueba, y por eso puede exigirse después.',
              'Not every reaction works the same. Naming somebody on social media, settling the matter with a payment or collecting justice yourself leave a feeling of response and no file: there is nobody to review it, nobody to correct it and nobody to answer if the accusation was wrong. A useful citizen proposal, by contrast, says what changes, with whom it is agreed, who follows it up and when it gets checked, and that is why it can be demanded later.') + '</p>' +
    '<div class="callout"><p><strong>' + S('Clave: ','Key: ') + '</strong>' +
      S('una acción fortalece el Estado de derecho cuando pasa por la vía que corresponde y deja un rastro que alguien puede revisar.',
        'an action strengthens the rule of law when it goes through the route that fits and leaves a trace somebody can review.') + '</p></div>' +
    '<div class="rules-grid">' +
      '<div class="rcard"><div class="rname">' + S('Pedir información','Request information') + '</div><div class="rform">' + S('transparencia','transparency') + '</div><div class="rnote">' + S('Lo público se puede consultar y comparar.','What is public can be consulted and compared.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Denunciar','Report') + '</div><div class="rform">' + S('la instancia que puede','the body that can act') + '</div><div class="rnote">' + S('Cada asunto tiene una puerta que sí resuelve.','Each matter has a door that actually resolves it.') + '</div></div>' +

      hint:{ es:'Pregúntate cuál de las cuatro deja algo escrito que se pueda revisar dentro de un mes.',
             en:'Ask which of the four leaves something in writing that can be reviewed a month from now.' },
      explanation:{ es:'El problema es que el reparto no se conoce ni se comprueba, así que la propuesta que sirve pone el calendario por escrito, lo acuerda con quien administra el pozo y deja a alguien registrando lo que ocurre cada semana. Cerrar la llave presiona pero no fija ninguna regla; pagar pipas resuelve unos días y acepta la desigualdad; y disolver el comité deja el pozo sin nadie que responda.',
                    en:'The problem is that the distribution is neither known nor verifiable, so the proposal that works puts the timetable in writing, agrees it with whoever runs the well and leaves somebody recording what happens each week. Shutting the valve applies pressure but sets no rule; paying for trucks solves a few days and accepts the inequality; and dissolving the committee leaves the well with nobody answerable.' } }
  ], rng), rng);

  /* PROBLEMA 9 */
  addProblem(pick([
    { title:{ es:'El precio bajo y la cadena', en:'The low price and the chain' }, showWork:false,
      stmt:{ es:'En un tianguis se ofrecen teléfonos a mitad de precio, sin comprobante y con el número de serie raspado. Alguien argumenta que comprarlos no daña a nadie, porque el precio bajo ayuda a las familias del barrio. ¿Qué le falta a ese argumento?',
             en:'At a street market phones are offered at half price, with no receipt and with the serial number scratched off. Somebody argues that buying them harms nobody, because the low price helps the families of the neighborhood. What is missing from that argument?' },
      options:{ es:[
        'Que esa compra sostiene una cadena que se mantiene fuera de la ley, y quien perdió el teléfono queda sin forma de recuperarlo ni de reclamar.',
        'Que el precio bajo no alcanza para todas las familias del barrio y por eso el beneficio termina repartiéndose de manera desigual.',
        'Que los teléfonos sin comprobante suelen fallar antes, de modo que el ahorro se pierde después en reparaciones.',
        'Que el puesto debería vender esos teléfonos con comprobante para poder ofrecerlos a un precio todavía más bajo.' ],
        en:[
        'That the purchase sustains a chain kept outside the law, and whoever lost the phone is left with no way to recover it or to complain.',
        'That the low price does not stretch to every family in the neighborhood, so the benefit ends up unevenly shared.',
        'That phones with no receipt tend to fail sooner, so the saving is later lost on repairs.',
        'That the stall should sell those phones with a receipt so it can offer them at an even lower price.' ] },
      correct:0,
      hint:{ es:'Amplía la lista de personas involucradas: no está solo quien vende y quien compra.',
             en:'Widen the list of people involved: it is not only the seller and the buyer.' },
      explanation:{ es:'El argumento cuenta solo a quien compra barato. Falta quien perdió el teléfono, que no tiene a quién reclamarle, y falta el efecto de sostener un mercado donde nadie responde por nada. El posible desgaste del aparato es un inconveniente para quien compra, no la razón por la que la compra está mal.',
                    en:'The argument counts only whoever buys cheap. Missing is the person who lost the phone, with nobody to claim from, and missing is the effect of sustaining a market where nobody answers for anything. The device possibly wearing out sooner is an inconvenience for the buyer, not the reason the purchase is wrong.' } },
    { title:{ es:'El precio bajo y la cadena', en:'The low price and the chain' }, showWork:false,
      stmt:{ es:'Un puesto vende copias de películas y programas a precio muy bajo. Quien atiende sostiene que no perjudica a nadie, porque las empresas grandes ya ganaron suficiente con esos títulos. ¿Qué le falta a ese argumento?',
             en:'A stall sells copies of films and software very cheaply. The vendor holds that it harms nobody, because the big companies already earned enough from those titles. What is missing from that argument?' },
      options:{ es:[
        'Que la venta desconoce el trabajo de quienes producen cada título y sostiene una cadena fuera de la ley, en la que nadie responde ante quien compra.',
        'Que las copias tienen menor calidad de imagen y por eso el precio bajo no compensa del todo lo que se paga.',
        'Que las empresas grandes también incumplen la ley en otros asuntos y por eso el puesto no es el problema principal.',
        'Que el puesto debería anunciar con claridad que sus copias no son originales antes de venderlas a la gente.' ],
        en:[
        'That the sale disregards the work of everyone who produces each title and sustains a chain outside the law, where nobody answers to the buyer.',
        'That the copies have lower image quality, so the low price does not entirely make up for what is paid.',
        'That the big companies also break the law in other matters, so the stall is not the main problem.',
        'That the stall should clearly state that its copies are not originals before selling them to people.' ] },
      correct:0,
      hint:{ es:'Pregúntate quiénes trabajaron en cada título y a quién podrías reclamarle si la copia no sirve.',
             en:'Ask who worked on each title and who you could complain to if the copy does not work.' },
      explanation:{ es:'Detrás de un título no está solo una empresa grande: está el trabajo de mucha gente que cobra por él. Además, en esa venta no hay comprobante ni nadie que responda si la copia falla. Avisar que no son originales hace más honesta la transacción, pero no cambia que la cadena completa opera donde ninguna autoridad puede intervenir.',
                    en:'Behind a title there is not only a big company: there is the work of many people who are paid for it. Besides, in that sale there is no receipt and nobody answers if the copy fails. Stating that they are not originals makes the transaction more honest, but does not change that the whole chain runs where no authority can step in.' } }
  ], rng), rng);

  /* PROBLEMA 10 */
  addProblem(pick([
    { title:{ es:'Cumplir la ley y responder', en:'Meeting the law and answering for it' }, showWork:false,
      stmt:{ es:'Una empresa afirma que su producción es ética porque ninguna norma la obliga a informar de dónde vienen sus materiales, y que por eso no tiene nada que explicar a nadie. ¿Qué juicio corresponde a esa afirmación?',
             en:'A company states that its production is ethical because no rule obliges it to say where its materials come from, and that therefore it owes nobody an explanation. Which judgment fits that statement?' },
      options:{ es:[
        'Que cumplir el mínimo exigido no agota la responsabilidad ética: informar el origen es lo que permite a quien compra decidir y a cualquiera revisar la cadena.',
        'Que la empresa tiene razón: mientras ninguna norma la obligue, el origen de sus materiales es un asunto estrictamente interno.',
        'Que la empresa debería informar el origen únicamente cuando alguna persona se lo pregunte directamente en el punto de venta.',
        'Que la ética empieza donde la ley termina, así que la empresa está obligada a publicar también los precios que paga a cada proveedor.' ],
        en:[
        'That meeting the minimum required does not exhaust ethical responsibility: stating the origin is what lets buyers decide and lets anyone review the chain.',
        'That the company is right: as long as no rule obliges it, the origin of its materials is a strictly internal matter.',
        'That the company should state the origin only when somebody asks about it directly at the point of sale.',
        'That ethics begins where law ends, so the company is obliged to publish the prices it pays each supplier as well.' ] },
      correct:0,
      hint:{ es:'Distingue dos preguntas: qué está obligada a hacer, y qué hace falta para que alguien pueda revisarla.',
             en:'Separate two questions: what it is obliged to do, and what is needed for anybody to be able to review it.' },
      explanation:{ es:'La ley fija un piso, no un techo. Sin información sobre el origen, quien compra no puede decidir y nadie puede verificar en qué condiciones se produjo, que es justo lo que la responsabilidad ética exige. Responder solo a quien pregunta deja la información al alcance de unos pocos, y publicar los precios de compra es otra cosa distinta que nadie está reclamando aquí.',
                    en:'The law sets a floor, not a ceiling. Without information about origin, buyers cannot decide and nobody can verify under what conditions the goods were made, which is exactly what ethical responsibility demands. Answering only whoever asks leaves the information within reach of a few, and publishing purchase prices is a different matter that nobody is demanding here.' } },
    { title:{ es:'Cumplir la ley y responder', en:'Meeting the law and answering for it' }, showWork:false,
      stmt:{ es:'Un funcionario sostiene que su gestión es honesta porque ninguna denuncia ha prosperado en su contra, y por eso no publica los contratos que firmó. ¿Qué juicio corresponde a esa afirmación?',
             en:'An official holds that his term has been honest because no complaint against him has prospered, and that this is why he does not publish the contracts he signed. Which judgment fits that statement?' },
      options:{ es:[
        'Que la ausencia de denuncias no equivale a rendir cuentas: publicar los contratos es lo que permite a cualquier persona revisar cómo se usó el dinero público.',
        'Que el funcionario tiene razón: si ninguna denuncia prosperó, la revisión de esos contratos ya quedó hecha por la vía legal.',
        'Que los contratos deben publicarse solo cuando exista una denuncia en curso que los tenga como materia.',
        'Que la honestidad de una gestión se comprueba con el número de obras entregadas y no con los documentos que las respaldan.' ],
        en:[
        'That the absence of complaints is not the same as accountability: publishing the contracts is what lets any person review how public money was used.',
        'That the official is right: if no complaint prospered, the review of those contracts has already been done through legal channels.',
        'That contracts should be published only when there is an ongoing complaint that concerns them.',
        'That the honesty of a term is proven by the number of works delivered and not by the documents behind them.' ] },
      correct:0,
      hint:{ es:'Pregúntate qué haría falta para que alguien ajeno pudiera comprobar por sí mismo lo que se afirma.',
             en:'Ask what it would take for an outsider to verify for themselves what is being claimed.' },
      explanation:{ es:'Que nadie haya denunciado puede significar que nadie tuvo cómo hacerlo, y por eso no prueba nada por sí solo. Rendir cuentas es entregar los documentos para que la revisión sea posible antes de cualquier denuncia. Publicar solo bajo denuncia invierte el orden, y contar obras entregadas no dice a qué precio ni con qué contratos se hicieron.',
                    en:'That nobody has complained may mean nobody had the means to, so on its own it proves nothing. Accountability means handing over the documents so that review is possible before any complaint. Publishing only under complaint reverses the order, and counting delivered works says nothing about at what price or under which contracts they were done.' } }
  ], rng), rng);
}
</script>

<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbykkuJ_apGq3vALIFd4mr3acu81c7K4OKxW-DZ-i52Ceyl3lOanXMdvbS9SIXPrLQBm/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'Ética en Producción, Consumo y Estado de Derecho';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
