<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Efectos Globales de la Guerra Fría</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; text-align: justify; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Efectos Globales de la Guerra Fría</div>
    <div class="wcourse" id="wcourse-el">Historia · 2° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Efectos Globales de la Guerra Fría</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="sbtn" id="dlBtn" onclick="generatePDF()" style="max-width:280px;margin:0 auto;">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   CENTRALIZED SCHOOL CONFIG (Rule 16) — ships UNBRANDED (Rule 11).
   The ONLY rebranding point. build_all.py substitutes these exact fields
   (BRAND_FIELDS / RGB_FIELDS / logo*) downstream; :root/dark stay as fallback.
   Neutral defaults below == the static :root/dark values, so unbranded == no-op.
   ══════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:'#243c54', primaryDark:'#182a3b', primaryBg:'#eaeef3',
  accent:'#24549c', accentBg:'#e2ebf8',
  darkPrimary:'#5e85ab', darkPrimaryDark:'#8badce', darkPrimaryBg:'#152331',

function lsKey() {

function saveSession() {
  if (!studentData.name) return;
  var drawings = [], texts = [], photos = [];
  problems.forEach(function(p, i) {
    var dc = document.getElementById('dc' + i);
    if (dc && dc.width) {
      var blank = document.createElement('canvas');
      blank.width = dc.width; blank.height = dc.height;
      drawings.push(dc.toDataURL() === blank.toDataURL() ? null : dc.toDataURL('image/png'));
    } else { drawings.push(null); }
    var ta = document.getElementById('ta' + i);
    texts.push(ta ? ta.value : '');
    var pp = document.getElementById('pp' + i);
    photos.push((pp && pp.src && pp.src.indexOf('data:') === 0) ? pp.src : null);
  });
  var state = {
    name: studentData.name, group: studentData.group,
    answeredCount: answeredCount, correctCount: correctCount,
    choices: problems.map(function(p) { return p.studentChoice; }),
    drawings: drawings, texts: texts, photos: photos
  };
  try { localStorage.setItem(lsKey(), JSON.stringify(state)); } catch(e) {}
}

function loadSession(name, group) {
  var key = 'his2_t05_g04__' + (name + '__' + group).replace(/\s+/g, '_');
  try { var r = localStorage.getItem(key); return r ? JSON.parse(r) : null; } catch(e) { return null; }
}

function restoreSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  var saved = loadSession(name, group);
  if (!saved) return;
  document.getElementById('restoreBar').style.display = 'none';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = currentAttempt(name, group);
  buildLesson(seededRng(name + group + att));
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
  saved.choices.forEach(function(choice, idx) {
    if (choice !== null && choice !== undefined) confirmMC(idx, choice);
  });
  setTimeout(function() {
    if (saved.drawings) {
      saved.drawings.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var dc = document.getElementById('dc' + i);
        if (!dc || !dc.width) return;
        var img = new Image();
        img.onload = function() {
          var dpr = window.devicePixelRatio || 1;
          dc.getContext('2d').drawImage(img, 0, 0, dc.width / dpr, dc.height / dpr);
        };
        img.src = dataUrl;
      });
    }
    if (saved.texts) {
      saved.texts.forEach(function(text, i) {
        if (!text) return;
        var ta = document.getElementById('ta' + i);
        if (ta) ta.value = text;
      });
    }
    if (saved.photos) {
      saved.photos.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var pp = document.getElementById('pp' + i);
        if (!pp) return;
        pp.src = dataUrl; pp.style.display = 'block';
        var pz = document.getElementById('pz' + i);
        if (pz) pz.style.opacity = '0.4';
      });
    }
  }, 300);
}

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function startLesson() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  var err   = document.getElementById('startErr');
  if (!name || !group) { err.textContent = t('fillboth'); return; }
  err.textContent = '';
  studentData = { name: name, group: group };
  answeredCount = 0;
  correctCount  = 0;
  var att = nextAttempt(name, group);
  buildLesson(seededRng(name + group + att));
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   TABS
   ================================================ */
function switchTab(idx, panel, btn) {
  var prefix = 'wp_' + idx + '_';
  document.querySelectorAll('[id^="' + prefix + '"]').forEach(function(p) { p.classList.remove('active'); });
  document.getElementById(prefix + panel).classList.add('active');
  btn.closest('.wtabs').querySelectorAll('.wtab').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
}

/* ================================================
   PHOTO
   ================================================ */
function handlePhoto(idx, input) {
  if (!input.files || !input.files[0]) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    var img = document.getElementById('pp' + idx);
    img.src = e.target.result;
    img.style.display = 'block';
    document.getElementById('pz' + idx).style.opacity = '0.4';
    saveSession();
  };
  reader.readAsDataURL(input.files[0]);
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

/* ================================================
   BUILD ONE CARD — inline construction, per-problem showWork branch
   Replaces the removed batch card renderer (Rule 1 / §5 lint: batch renderer
   absent; cards built inline). Contradiction A (Record §3.A):
   showWork:true  -> Draw/Type/Photo work area + canvas init.
   showWork:false -> pure recall/conceptual MC: no .wtabs, no canvas, no init.
   Called inline from buildLesson(), appended to #lessonBody.
   ================================================ */
function buildOneCard(prob, globalIdx) {
  var i = globalIdx;
  var opts = prob.options.map(function(opt, oi) {
    return '<div class="mcopt" onclick="handleMC(' + i + ',' + oi + ')">' + opt + '</div>';
  }).join('');

  var workArea = '';
  if (prob.showWork) {
    workArea =
      '<div style="margin-bottom:.85rem">' +
        '<div class="wtabs">' +
          '<button class="wtab active" onclick="switchTab(' + i + ',\'draw\',this)">'+t('tab-draw')+'</button>' +
          '<button class="wtab"        onclick="switchTab(' + i + ',\'type\',this)">'+t('tab-type')+'</button>' +
          '<button class="wtab"        onclick="switchTab(' + i + ',\'photo\',this)">'+t('tab-photo')+'</button>' +
        '</div>' +
        '<div class="wpanel active" id="wp_' + i + '_draw">' +
          '<div class="cvwrap">' +
            '<canvas class="dcanvas" id="dc' + i + '"></canvas>' +
            '<div class="ctoolbar">' +
              '<button class="tbtn2 bpen on">'+t('btn-pen')+'</button>' +
              '<button class="tbtn2 bmarker">'+t('btn-marker')+'</button>' +
              '<button class="tbtn2 beraser">'+t('btn-eraser')+'</button>' +
              '<div class="cdot sel" data-color="#0f2d5a" style="background:#0f2d5a"></div>' +
              '<div class="cdot"     data-color="#1a1a16" style="background:#1a1a16"></div>' +
              '<div class="cdot"     data-color="#8b2500" style="background:#8b2500"></div>' +
              '<div class="cdot"     data-color="#1d4e89" style="background:#1d4e89"></div>' +
              '<button class="clrbtn">'+t('btn-clear')+'</button>' +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div class="wpanel" id="wp_' + i + '_type">' +
          '<textarea class="wtextarea" id="ta' + i + '" placeholder="'+t('ph-work')+'" oninput="saveSession()"></textarea>' +
        '</div>' +
        '<div class="wpanel" id="wp_' + i + '_photo">' +
          '<div class="pzone" id="pz' + i + '">' +
            '<input type="file" accept="image/*" onchange="handlePhoto(' + i + ',this)">' +
            '<div class="pzicon">📸</div>' +
            '<div class="pztxt">'+t('ph-photo')+'</div>' +
          '</div>' +
          '<img class="ppreview" id="pp' + i + '" alt="student work">' +
        '</div>' +
      '</div>';
  }

  var card = document.createElement('div');
  card.className = 'pcrd section';
  card.id = 'pc' + i;
  card.innerHTML =
    '<div class="phdr"><div class="pnum">' + (i+1) + '</div><div class="ptitle">' + prob.title + '</div></div>' +
    '<div class="pbody">' +
      '<div class="pstmt">' + prob.questionText + '<span class="pfn">' + (prob.fn||'') + '</span></div>' +
      workArea +
      '<button class="hintbtn" id="hintbtn'+i+'" onclick="toggleHint(' + i + ')">'+t('btn-hint')+'</button>' +
      '<div class="hintbox" id="hint' + i + '">' + (prob.hint||'') + '</div>' +
      '<div style="margin-top:.7rem">' +
        '<div style="font-family:\'IBM Plex Mono\',monospace;font-size:.65rem;letter-spacing:.1em;color:var(--text3);text-transform:uppercase;margin-bottom:.5rem">'+t('lbl-answer')+'</div>' +
        '<div class="mcopts">' + opts + '</div>' +
        '<div class="mcfb" id="fb' + i + '"></div>' +
      '</div>' +
    '</div>';
  document.getElementById('lessonBody').appendChild(card);

  if (prob.showWork) setTimeout(function() {
    var c = document.getElementById('dc' + i);
    if (c) initCanvas(c);
  }, 80);
}

/* ================================================
   PDF
   ================================================ */
async function generatePDF() {
  var btn = document.getElementById('dlBtn');
  btn.textContent = 'Generando PDF…';
  btn.disabled = true;

  var jspdf   = window.jspdf;
  var doc     = new jspdf.jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });
  var PW      = 215.9;
  var M       = 18;
  var TW      = PW - M * 2;
  var PH      = doc.internal.pageSize.height;
  var name    = studentData.name;
  var group   = studentData.group;
  var total   = problems.length;
  var pct     = Math.round(correctCount / total * 100);
  var dateStr = new Date().toLocaleString('es-MX', { dateStyle:'long', timeStyle:'short' });

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS — INJECTION BLOCK ─────────────────────────────────────────
  //   Match these RGB values to --green and --gold above.
  //   PRIMARY  → pBR, pBG, pBB
  //   ACCENT   → pAR, pAG, pAB
  // ──────────────────────────────────────────────────────────────────────────
  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;  // PRIMARY (from SCHOOL, Rule 16)
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;   // ACCENT (from SCHOOL, Rule 16)

  function pdfText(html) {
    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/\u2192/g,'->').replace(/\u2212/g,'-').replace(/\u00b2/g,'^2')
      .replace(/\u00b3/g,'^3').replace(/\u00d7/g,'x').replace(/\u00f7/g,'/')
      .replace(/\u2260/g,'!=').replace(/\u2264/g,'<=').replace(/\u2265/g,'>=')
      .replace(/\u221a/g,'sqrt').replace(/\u03c0/g,'pi').replace(/\u2026/g,'...')
      .replace(/\s+/g,' ').trim();
  }

  // ── PORTADA: orange line / white logo strip / orange line / blue band ──
  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,2,'F');   // top accent line
  doc.setFillColor(255,255,255); doc.rect(0,2,PW,26,'F');                               // white logo strip
  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,28,PW,2,'F');  // bottom accent line
  doc.setFillColor(pBR,pBG,pBB); doc.rect(0,30,PW,34,'F');       // blue header band

  if (SCHOOL.logoLeftB64) {
    var fmtL = SCHOOL.logoLeftB64.indexOf('/9j/') > -1 ? 'JPEG' : 'PNG';
    try { doc.addImage(SCHOOL.logoLeftB64, fmtL, M, 4, 48, 22); } catch(e) {}
  }
  if (SCHOOL.logoRightB64) {
    var fmtR = SCHOOL.logoRightB64.indexOf('/9j/') > -1 ? 'JPEG' : 'PNG';
    try { doc.addImage(SCHOOL.logoRightB64, fmtR, 130, 4, 48, 22); } catch(e) {}
  }

  var lx = PW - M - 36;
  var ly = 10;
  doc.setDrawColor(pBR,pBG,pBB); doc.setLineWidth(0.7);
  doc.lines([[2.57-1.03,4.63-6.17],[4.11-2.57,5.14-4.63],[5.66-4.11,2.57-5.14]], lx+1.03, ly+6.17);
  doc.setFillColor(pAR,pAG,pAB); doc.circle(lx+5.66, ly+2.57, 0.9, 'F');
  doc.setDrawColor(pAR,pAG,pAB); doc.setLineWidth(0.7);
  doc.line(lx+8.23, ly+1.54, lx+8.23, ly+7.2);
  doc.setTextColor(pBR,pBG,pBB); doc.setFontSize(11); doc.setFont('helvetica','bold');
  doc.text('LIAXA', lx+10, ly+6.8);

  // Guide title + date inside the blue band
  doc.setTextColor(232,238,247); doc.setFontSize(19); doc.setFont('helvetica','bold');
  doc.text(t('wtitle'), M, 49);
  doc.setTextColor(150,165,200); doc.setFontSize(8); doc.setFont('helvetica','normal');
  doc.text(dateStr, M, 59);

  // ── Student info card (name + group only — código goes to footer) ──
  doc.setFillColor(237,240,245); doc.roundedRect(M,72,TW,20,3,3,'F');
  doc.setTextColor(130,140,160); doc.setFontSize(8.5); doc.setFont('helvetica','bold');
  doc.text('ALUMNO', M+4, 79); doc.text('GRUPO', 130, 79);
  doc.setTextColor(20,24,32); doc.setFontSize(11); doc.setFont('helvetica','bold');
  doc.text(name, M+4, 87); doc.text(group, 130, 87);

  // ── Score box ──
  var sc = pct>=70?[26,106,74]:pct>=50?[224,123,26]:[176,48,16];
  doc.setFillColor(255,255,255); doc.roundedRect(M,100,TW,34,4,4,'F');
  doc.setDrawColor(sc[0],sc[1],sc[2]); doc.setLineWidth(0.8);
  doc.roundedRect(M,100,TW,34,4,4,'S');
  doc.setTextColor(sc[0],sc[1],sc[2]); doc.setFontSize(40); doc.setFont('helvetica','bold');
  doc.text(pct+'%', PW/2, 124, {align:'center'});
  doc.setTextColor(130,140,160); doc.setFontSize(8.5); doc.setFont('helvetica','normal');
  doc.text(correctCount+' correcta(s) de '+total+' preguntas', PW/2, 131, {align:'center'});

  // ── Problem summary table ──
  doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
  doc.setFontSize(7); doc.setFont('helvetica','bold');
  doc.rect(M,142,TW,8,'F'); doc.text('RESUMEN DE PROBLEMAS', M+4, 148);
  var sy = 154;
  problems.forEach(function(prob, i) {
    if (sy + 12 > PH - 15) {
      doc.addPage(); sy = 20;
      doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
      doc.setFontSize(7); doc.setFont('helvetica','bold');
      doc.rect(M,sy,TW,8,'F'); doc.text('RESUMEN DE PROBLEMAS (continuación)', M+4, sy+6);
      sy += 12;
    }
    var ok = document.getElementById('pc'+i).classList.contains('ok');
    doc.setFillColor(ok?232:255, ok?240:232, ok?232:228);
    doc.roundedRect(M,sy,TW,10,2,2,'F');
    doc.setFillColor(ok?26:176, ok?106:48, ok?74:16);
    doc.circle(M+6, sy+5, 2.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(7); doc.setFont('helvetica','bold');
    doc.text(ok?'✓':'✗', M+4.5, sy+6.5);
    doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('helvetica','normal');
    doc.text('Problema '+(i+1)+': '+pdfText(prob.title), M+12, sy+6.5);
    doc.setTextColor(ok?26:176, ok?106:48, ok?74:16);
    doc.text(ok?'Correcto':'Incorrecto', PW-M-24, sy+6.5);
    sy += 12;
  });

  // ── Per-problem pages ──
  for (var i = 0; i < problems.length; i++) {
    var prob = problems[i];
    doc.addPage();
    var wy = 0;

    doc.setFillColor(pBR,pBG,pBB); doc.rect(0,0,PW,20,'F');
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,3,'F');
    doc.setTextColor(pAR,pAG,pAB); doc.setFontSize(7); doc.setFont('helvetica','normal');
    doc.text(t('wcourse')+'  ·  '+t('wtitle'), M, 10);
    doc.setTextColor(232,238,247); doc.setFontSize(10.5); doc.setFont('helvetica','bold');
    doc.text('Problema '+(i+1)+' de '+total+'  ·  '+pdfText(prob.title), M, 17);
    wy = 25;

    var qRaw = pdfText(prob.questionText);
    doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var qLines = doc.splitTextToSize(qRaw, TW-10);
    var qBoxH  = 8 + qLines.length*5 + 3;
    doc.setFillColor(237,240,245); doc.roundedRect(M,wy,TW,qBoxH,2,2,'F');
    doc.setTextColor(pBR,pBG,pBB); doc.setFontSize(6.5); doc.setFont('helvetica','bold');
    doc.text('PREGUNTA', M+4, wy+6);
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var qy = wy+12;
    qLines.forEach(function(ln,li){ doc.text(ln, M+4, qy+li*5); });
    wy += qBoxH + 4;

    var isOk   = document.getElementById('pc'+i).classList.contains('ok');
    var chosen = prob.studentChoice != null ? pdfText(prob.options[prob.studentChoice]||'-') : '-';
    var corr   = pdfText(prob.options[prob.correctIdx]||'');
    var expRaw = pdfText(prob.explanation||'');
    doc.setFontSize(8.5); var chLines = doc.splitTextToSize('Alumno: '+chosen, TW-18);
    doc.setFontSize(8);   var coLines = doc.splitTextToSize('Correcto: '+corr, TW-18);
    doc.setFontSize(7.5); var exLines = doc.splitTextToSize('Solución: '+expRaw, TW-18).slice(0,4);
    var ansBoxH = 8 + chLines.length*5.5 + coLines.length*5 + exLines.length*5 + 6;
    doc.setFillColor(isOk?232:255, isOk?240:232, isOk?232:228);
    doc.roundedRect(M,wy,TW,ansBoxH,2,2,'F');
    doc.setFillColor(isOk?26:176, isOk?106:48, isOk?74:16);
    doc.circle(M+7, wy+8, 3.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(9); doc.setFont('helvetica','bold');
    doc.text(isOk?'✓':'✗', M+5.2, wy+10.5);
    var ay = wy+7;
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','bold');
    chLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5.5); });
    ay += chLines.length*5.5 + 3;
    doc.setTextColor(26,106,74); doc.setFontSize(8); doc.setFont('helvetica','normal');
    coLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    ay += coLines.length*5 + 3;
    doc.setTextColor(90,85,80); doc.setFontSize(7.5);
    exLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    wy += ansBoxH + 5;

    doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
    doc.setFontSize(7); doc.setFont('helvetica','bold');
    doc.rect(M,wy,TW,8,'F'); doc.text('TRABAJO DEL ALUMNO', M+4, wy+5.5);
    wy += 11;

    var dc = document.getElementById('dc'+i);
    if (dc) {
      try {
        var imgD = dc.toDataURL('image/png');
        var ar   = dc.height / dc.width;
        var iw   = TW;
        var ih   = Math.min(iw * ar, 68);
        doc.addImage(imgD, 'PNG', M, wy, iw, ih);
        wy += ih + 4;
      } catch(e) {}
    }

    var ta = document.getElementById('ta'+i);

}

  mD_render();
}

function buildLesson(rng) {
  injectManipStyles();
  MANIP = {};
  mA_build(rng); mB_build(rng); mC_build(rng); mD_build(rng); mE_build(rng);

  /* ══════════════════ CONCEPTO 1 ══════════════════ */
  addSection(L({ es:'Concepto 1', en:'Concept 1' }), L({ es:'Una rivalidad que se volvió mundial', en:'A rivalry that turned worldwide' }),
    L({ es:'<p>La disputa entre Estados Unidos y la Unión Soviética empezó en Europa, pero no se quedó ahí. Entre 1945 y 1975 más de cincuenta territorios de Asia y África dejaron de ser colonias europeas y se convirtieron en Estados independientes. Cada uno tenía que decidir de dónde sacaría créditos, maquinaria, armamento y apoyo diplomático. Para las dos superpotencias, cada uno de esos gobiernos era una posición que se podía ganar o perder.</p>' +
              '<p>Ese cálculo tenía una lógica sencilla y despiadada: lo que ganaba un bloque lo perdía el otro. Un puerto, una base aérea, un yacimiento de minerales, un voto en los organismos internacionales o simplemente el ejemplo de un país que prosperaba con un modelo determinado valían la pena. Por eso la rivalidad llegó a lugares que nada tenían que ver con Berlín o con Moscú.</p>' +
              '<p>Llegó por vías distintas según el caso. A veces partió un país en dos Estados con gobiernos opuestos. A veces alimentó durante años una guerra interna entregando armas y asesores a bandos contrarios. A veces sostuvo el derrocamiento de un gobierno incómodo. Y a veces provocó la reacción opuesta: gobiernos que se negaron a alinearse y buscaron una tercera posición. Reconocer por cuál de esas vías llegó a cada región es el primer paso para entender sus efectos globales.</p>',
          en:'<p>The dispute between the United States and the Soviet Union began in Europe, but it did not stay there. Between 1945 and 1975 more than fifty territories in Asia and Africa stopped being European colonies and became independent states. Each one had to decide where it would obtain loans, machinery, weaponry and diplomatic support. For the two superpowers, each of those governments was a position that could be won or lost.</p>' +
              '<p>That calculation had a simple and merciless logic: what one bloc gained the other lost. A port, an air base, a mineral deposit, a vote in international bodies or simply the example of a country prospering under a particular model were all worth the effort. That is why the rivalry reached places that had nothing to do with Berlin or with Moscow.</p>' +
              '<p>It arrived by different routes depending on the case. Sometimes it split a country into two states with opposing governments. Sometimes it fed an internal war for years by handing weapons and advisers to opposing sides. Sometimes it backed the overthrow of an inconvenient government. And sometimes it produced the opposite reaction: governments that refused to align and looked for a third position. Recognizing which of those routes reached each region is the first step towards understanding its global effects.</p>' }) +
    '<div class="rules-grid">' +
      '<div class="rcard"><div class="rname">' + L({ es:'Zona de influencia', en:'Zone of influence' }) + '</div><div class="rform">' + L({ es:'mando sin ocupación', en:'control without occupation' }) + '</div><div class="rnote">' + L({ es:'Región donde una potencia decide lo esencial sin gobernarla de manera directa.', en:'A region where a power decides the essentials without governing it directly.' }) + '</div></div>' +
      '<div class="rcard"><div class="rname">' + L({ es:'Guerra por delegación', en:'Proxy war' }) + '</div><div class="rform">' + L({ es:'pelean otros', en:'others do the fighting' }) + '</div><div class="rnote">' + L({ es:'Conflicto local en el que cada superpotencia sostiene a un bando sin combatir ella misma.', en:'A local conflict in which each superpower sustains one side without fighting itself.' }) + '</div></div>' +
      '<div class="rcard"><div class="rname">' + L({ es:'Descolonización', en:'Decolonization' }) + '</div><div class="rform">' + L({ es:'nuevos Estados', en:'new states' }) + '</div><div class="rnote">' + L({ es:'Proceso por el que las colonias de Asia y África se volvieron países independientes.', en:'The process by which the colonies of Asia and Africa became independent countries.' }) + '</div></div>' +
      '<div class="rcard"><div class="rname">' + L({ es:'No alineamiento', en:'Non alignment' }) + '</div><div class="rform">' + L({ es:'tercera posición', en:'third position' }) + '</div><div class="rnote">' + L({ es:'Política de no integrarse a las alianzas militares de ninguno de los dos bloques.', en:'A policy of not joining the military alliances of either bloc.' }) + '</div></div>' +
    '</div>' +
    '<div class="mzone" id="mzA"></div>');
  mA_render();

  /* ── graded 1 ── */
  var p1v = [
    { q:{ es:'Entre 1945 y 1975 más de cincuenta colonias de Asia y África se convirtieron en Estados independientes. Los gobiernos de Washington y de Moscú dedicaron enormes esfuerzos diplomáticos, económicos y militares a países pequeños y muy lejanos de sus fronteras. ¿Qué explica ese interés?',
          en:'Between 1945 and 1975 more than fifty colonies in Asia and Africa became independent states. The governments in Washington and Moscow devoted enormous diplomatic, economic and military effort to small countries very far from their borders. What explains that interest?' },
      o:{ es:['Cada nuevo Estado podía aportar bases, materias primas, votos internacionales y prestigio a un bloque, y lo que uno sumaba el otro lo perdía.',
              'Los nuevos Estados exigieron a las dos superpotencias que se hicieran cargo de administrar sus territorios.',
              'Las dos superpotencias habían firmado un acuerdo que las obligaba a repartirse por igual cada territorio que se independizara.',
              'Ninguna de las dos superpotencias contaba con ejército suficiente y buscaba reclutar soldados en esas regiones.'],
          en:['Each new state could add bases, raw materials, international votes and prestige to a bloc, and what one gained the other lost.',
              'The new states demanded that the two superpowers take charge of administering their territories.',
              'The two superpowers had signed an agreement obliging them to share equally every territory that became independent.',
              'Neither superpower had a large enough army and both were looking to recruit soldiers in those regions.'] }, c:0,
      h:{ es:'Piensa en qué gana una potencia cuando un gobierno lejano se acerca a ella, y en qué pierde cuando ese mismo gobierno se acerca a su rival.',
          en:'Think about what a power gains when a distant government moves closer to it, and what it loses when that same government moves closer to its rival.' },
      e:{ es:'La rivalidad funcionaba como un juego de suma cero: no había territorio neutral. Un puerto en el océano Índico, un yacimiento de cobre, un voto en la Asamblea General o el simple ejemplo de un país que crecía con un modelo determinado se contaban como puntos a favor de un bloque y en contra del otro. Por eso la disputa se extendió a regiones sin ninguna relación histórica con Europa oriental.',
          en:'The rivalry worked like a zero sum game: there was no neutral territory. A port on the Indian Ocean, a copper deposit, a vote in the General Assembly or the simple example of a country growing under a particular model counted as points for one bloc and against the other. That is why the dispute spread to regions with no historical connection to eastern Europe.' } },
    { q:{ es:'Un país africano que acaba de independizarse recibe en el mismo año una oferta de créditos y maquinaria de una superpotencia, una oferta de armamento y asesores militares de la otra, y visitas de delegaciones de ambas. Ninguna de las dos propone ocupar su territorio. ¿Qué revela esa situación sobre la forma en que actuaban las superpotencias fuera de Europa?',
          en:'A newly independent African country receives in the same year an offer of loans and machinery from one superpower, an offer of weaponry and military advisers from the other, and visits from delegations of both. Neither proposes occupying its territory. What does that situation reveal about how the superpowers acted outside Europe?' },
      o:{ es:['Buscaban ganar influencia sin ocupar el territorio, ofreciendo justo aquello que el nuevo gobierno necesitaba con urgencia.',
              'Habían renunciado a intervenir en los asuntos de los países recién independizados.',
              'Actuaban siempre de común acuerdo para repartirse por partes iguales los recursos del continente africano.',
              'Solo se interesaban por los países que ya contaban con una industria desarrollada y un ejército numeroso.'],
          en:['They sought influence without occupying the territory, offering exactly what the new government urgently needed.',
              'They had given up intervening in the affairs of newly independent countries.',
              'They always acted in agreement in order to share the resources of the African continent equally.',
              'They were interested only in countries that already had a developed industry and a large army.'] }, c:0,
      h:{ es:'Fíjate en qué se ofrece y en qué no se pide a cambio: la influencia también se construye con créditos, asesores y visitas.',
          en:'Look at what is offered and at what is not demanded in return: influence is also built with loans, advisers and visits.' },
      e:{ es:'La disputa por el mundo poscolonial rara vez tomó la forma de una ocupación. Tomó la de créditos con condiciones, becas, asesores militares, tratados comerciales y apoyo diplomático. Un gobierno recién nacido necesitaba todo eso de inmediato, y aceptarlo de un bloque lo alejaba del otro. Así se construyeron zonas de influencia sin desplegar ejércitos permanentes.',
          en:'The dispute over the postcolonial world rarely took the form of an occupation. It took the form of loans with conditions, scholarships, military advisers, trade treaties and diplomatic support. A newborn government needed all of that immediately, and accepting it from one bloc pushed it away from the other. Zones of influence were built that way, without deploying permanent armies.' } }
  ];
  var v1 = pickVariant(p1v, rng);
  addProblem({ title:L({ es:'Por qué el mundo entero', en:'Why the whole world' }), questionText:L(v1.q), options:L(v1.o), correct:v1.c, hint:L(v1.h), explanation:L(v1.e) }, rng);

  /* ── graded 2 ── */
  var p2v = [
    { q:{ es:'En 1975 Angola dejó de ser colonia portuguesa. Tres organizaciones que habían combatido juntas contra el dominio colonial pasaron a disputarse el gobierno; una recibió respaldo soviético y tropas enviadas desde Cuba, otra recibió respaldo estadounidense y sudafricano. El conflicto se prolongó más de veinticinco años. ¿Qué efecto global de la Guerra Fría ilustra este caso?',
          en:'In 1975 Angola stopped being a Portuguese colony. Three organizations that had fought together against colonial rule began disputing the government; one received Soviet backing and troops sent from Cuba, another received American and South African backing. The conflict dragged on for more than twenty five years. Which global effect of the Cold War does this case illustrate?' },
      o:{ es:['El respaldo externo a bandos contrarios convirtió una disputa interna por el poder en una guerra mucho más larga y mejor armada.',
              'La independencia de las colonias africanas solo fue posible gracias a la intervención directa de las superpotencias.',
              'Las dos superpotencias enviaron sus propios ejércitos a combatir una contra la otra en territorio africano.',
              'Los conflictos internos africanos se resolvieron con rapidez porque los dos bloques presionaron para lograr un acuerdo.'],
          en:['Outside backing for opposing sides turned an internal dispute over power into a much longer and better armed war.',
              'The independence of the African colonies was possible only thanks to direct intervention by the superpowers.',
              'The two superpowers sent their own armies to fight each other on African soil.',
              'Internal African conflicts were settled quickly because both blocs pushed for an agreement.'] }, c:0,
      h:{ es:'Compara cuánto puede durar un conflicto interno sin recursos externos con lo que ocurre cuando cada bando recibe armas y dinero desde fuera.',
          en:'Compare how long an internal conflict can last without outside resources with what happens when each side receives weapons and money from abroad.' },
      e:{ es:'La independencia angoleña coincidió con el momento más competitivo de la rivalidad en África. Al recibir armamento, dinero y asesores, cada bando dejó de tener motivos para negociar: podía reponer lo perdido. El resultado fue una guerra que sobrevivió a la propia Guerra Fría y dejó al país con enormes daños materiales y con minas terrestres que tardaron décadas en retirarse.',
          en:'Angolan independence coincided with the most competitive moment of the rivalry in Africa. On receiving weaponry, money and advisers, neither side had reason to negotiate any more: it could replace what it lost. The result was a war that outlived the Cold War itself and left the country with enormous material damage and with landmines that took decades to clear.' } },
    { q:{ es:'El Congo se independizó de Bélgica en 1960. En pocos meses, una provincia rica en minerales se separó con apoyo de empresas extranjeras, el primer ministro pidió ayuda a la Unión Soviética, las potencias occidentales respaldaron a sus adversarios y el país entró en una crisis que terminó con un gobierno militar sostenido durante tres décadas por el bloque occidental. ¿Qué muestra este caso sobre los efectos de la rivalidad en los países recién independizados?',
          en:'The Congo became independent from Belgium in 1960. Within months a mineral rich province broke away with support from foreign firms, the prime minister asked the Soviet Union for help, the western powers backed his opponents and the country entered a crisis that ended with a military government sustained for three decades by the western bloc. What does this case show about the effects of the rivalry on newly independent countries?' },
      o:{ es:['La independencia formal no garantizaba el control real del país, porque cada decisión interna se leía desde la disputa entre los bloques y atraía apoyos externos.',
              'Los países africanos recién independizados quedaron completamente al margen de la rivalidad entre las superpotencias.',
              'Las Naciones Unidas impidieron cualquier injerencia extranjera en los asuntos internos del país.',
              'La riqueza mineral de un territorio hacía que las potencias perdieran interés en su situación política.'],
          en:['Formal independence did not guarantee real control of the country, because every internal decision was read through the dispute between the blocs and attracted outside support.',
              'Newly independent African countries were left completely outside the rivalry between the superpowers.',
              'The United Nations prevented any foreign interference in the internal affairs of the country.',
              'The mineral wealth of a territory made the powers lose interest in its political situation.'] }, c:0,
      h:{ es:'Distingue entre izar una bandera propia y poder decidir sin que cada paso sea interpretado y respondido desde fuera.',
          en:'Distinguish between raising your own flag and being able to decide without every step being interpreted and answered from outside.' },
      e:{ es:'El caso congoleño se volvió el ejemplo más citado de lo que significaba independizarse en plena Guerra Fría. Pedir ayuda a un bloque bastaba para que el otro respaldara a los rivales internos. La soberanía quedaba así limitada por una disputa ajena, y el desenlace habitual era un gobierno sostenido desde el exterior mientras se mantuviera del lado correcto.',
          en:'The Congolese case became the most quoted example of what becoming independent in the middle of the Cold War meant. Asking one bloc for help was enough for the other to back the internal rivals. Sovereignty was thus limited by a dispute that was not its own, and the usual outcome was a government sustained from abroad as long as it stayed on the right side.' } }

  /* ══════════════════ CONCEPTO 2 ══════════════════ */
  addSection(L({ es:'Concepto 2', en:'Concept 2' }), L({ es:'Guerras por delegación: pelear sin pelear', en:'Proxy wars: fighting without fighting' }),
    L({ es:'<p>Desde 1949 las dos superpotencias tenían armas nucleares. A partir de ese momento, un choque directo entre ellas dejó de ser una opción razonable para cualquiera de las dos: quien atacara primero recibiría la respuesta antes de que sus propias armas terminaran de llegar. Esa certeza congeló el enfrentamiento en el centro y lo empujó hacia la periferia.</p>' +
              '<p>El resultado fueron las guerras por delegación. Corea entre 1950 y 1953, Vietnam entre 1955 y 1975, Afganistán entre 1979 y 1989, además de conflictos en Angola, Etiopía, Nicaragua y otros lugares. En todos ellos, quienes combatían eran ejércitos y grupos locales, con sus propias razones y sus propias historias, pero recibían armamento, dinero, entrenamiento y asesores de una superpotencia o de las dos.</p>' +
              '<p>Ese apoyo externo cambió la naturaleza de esos conflictos. Un bando que pierde material y no puede reponerlo tiene que negociar; un bando que lo repone puede seguir. Las guerras se alargaron, se volvieron mucho más destructivas para la población civil y dejaron sociedades divididas y territorios llenos de armamento. Cuando la rivalidad terminó en 1991, nadie recogió lo repartido.</p>',
          en:'<p>From 1949 both superpowers had nuclear weapons. From that moment a direct clash between them stopped being a reasonable option for either: whoever attacked first would receive the answer before their own weapons finished arriving. That certainty froze the confrontation at the centre and pushed it towards the edges.</p>' +
              '<p>The result was proxy wars. Korea between 1950 and 1953, Vietnam between 1955 and 1975, Afghanistan between 1979 and 1989, along with conflicts in Angola, Ethiopia, Nicaragua and other places. In all of them those doing the fighting were local armies and groups, with their own reasons and their own histories, but they received weaponry, money, training and advisers from one superpower or from both.</p>' +
              '<p>That outside support changed the nature of those conflicts. A side that loses equipment and cannot replace it has to negotiate; a side that can replace it can carry on. The wars grew longer, became far more destructive for the civilian population and left divided societies and territories full of weaponry. When the rivalry ended in 1991, nobody collected back what had been handed out.</p>' }) +
    '<div class="callout"><p><strong>' + L({ es:'Dato para pensar: ', en:'Something to think about: ' }) + '</strong>' + L({ es:'las dos superpotencias jamás combatieron de manera directa entre ellas en ningún frente, en cuarenta y cuatro años de enfrentamiento. Sus armas, en cambio, estuvieron presentes en casi todos los conflictos armados del planeta durante ese periodo.', en:'the two superpowers never fought each other directly on any front in forty four years of confrontation. Their weapons, on the other hand, were present in almost every armed conflict on the planet during that period.' }) + '</p></div>' +
    '<div class="mzone" id="mzC"></div>');
  mC_render();

  /* ── graded 3 ── */
  var p3v = [
    { q:{ es:'La guerra de Corea terminó en 1953 con un armisticio, no con un tratado de paz. La frontera quedó casi donde estaba en 1950, después de tres años de combates y de un enorme costo humano y material para la población de la península. Setenta años después, las dos Coreas siguen separadas por esa misma línea. ¿Qué conclusión sobre las guerras por delegación se sostiene mejor con este caso?',
          en:'The Korean War ended in 1953 with an armistice, not a peace treaty. The border was left almost where it had been in 1950, after three years of fighting and an enormous human and material cost for the population of the peninsula. Seventy years later the two Koreas remain separated by that same line. Which conclusion about proxy wars is best supported by this case?' },
      o:{ es:['Podían costar años de guerra y un daño inmenso sin modificar el reparto de fuerzas, y sus efectos quedaban instalados por generaciones en la población local.',
              'Servían para que las superpotencias resolvieran sus diferencias de manera rápida y definitiva.',
              'Terminaban siempre con la victoria clara del bando apoyado por la superpotencia más poderosa.',
              'Tenían consecuencias limitadas al periodo de los combates y desaparecían al firmarse el alto al fuego.'],
          en:['They could cost years of war and immense damage without changing the balance of forces, and their effects stayed in place for generations among the local population.',
              'They allowed the superpowers to settle their differences quickly and definitively.',
              'They always ended with a clear victory for the side backed by the more powerful superpower.',
              'Their consequences were limited to the period of fighting and vanished once the ceasefire was signed.'] }, c:0,
      h:{ es:'Compara el mapa de 1950 con el de 1953 y después piensa en quién siguió cargando con las consecuencias hasta hoy.',
          en:'Compare the map of 1950 with that of 1953 and then think about who kept bearing the consequences until today.' },
      e:{ es:'Corea es el ejemplo más claro de una guerra por delegación que terminó donde empezó en términos territoriales. Para las superpotencias fue una prueba de fuerza; para las familias coreanas significó una división que aún hoy separa a parientes, un armisticio que nunca se convirtió en paz y una de las fronteras más vigiladas del planeta. El costo lo pagó la población que vivía en el terreno de la disputa.',
          en:'Korea is the clearest example of a proxy war that ended where it began in territorial terms. For the superpowers it was a test of strength; for Korean families it meant a division that still separates relatives today, an armistice that never became peace and one of the most heavily guarded borders on the planet. The cost was paid by the population living on the ground of the dispute.' } },
    { q:{ es:'En Nicaragua, durante la década de 1980, el gobierno recibió apoyo económico y militar del bloque oriental mientras los grupos armados que lo combatían recibían financiamiento y entrenamiento del bloque occidental. La guerra se prolongó casi diez años y terminó con elecciones y con un país empobrecido. ¿Qué explica mejor por qué este tipo de conflicto tendía a alargarse?',
          en:'In Nicaragua, during the 1980s, the government received economic and military support from the eastern bloc while the armed groups fighting it received funding and training from the western bloc. The war dragged on for almost ten years and ended with elections and an impoverished country. What best explains why this kind of conflict tended to drag on?' },
      o:{ es:['Mientras cada bando podía reponer desde el exterior lo que perdía, ninguno se veía obligado a negociar un acuerdo.',
              'Los dos bandos carecían por completo de armamento y por eso los combates avanzaban con lentitud.',
              'Las superpotencias exigían a los bandos locales que firmaran la paz antes de enviarles cualquier ayuda.',
              'La población civil de esos países decidía por votación la duración de cada campaña militar.'],
          en:['As long as each side could replace from abroad what it lost, neither was forced to negotiate an agreement.',
              'Both sides completely lacked weaponry and for that reason the fighting advanced slowly.',
              'The superpowers demanded that the local sides sign peace before sending them any aid.',
              'The civilian population of those countries voted on the length of each military campaign.'] }, c:0,
      h:{ es:'Pregúntate en qué momento un bando armado se sienta a negociar, y qué ocurre si ese momento nunca llega porque siempre hay reemplazo.',
          en:'Ask yourself at what moment an armed side sits down to negotiate, and what happens if that moment never arrives because replacements always come.' },
      e:{ es:'La negociación suele llegar cuando alguno de los bandos ya no puede sostener el esfuerzo. El apoyo externo eliminaba justamente ese límite: había fondos, armamento y entrenamiento disponibles mientras el conflicto siguiera siendo útil para el bloque que lo financiaba. Por eso las guerras por delegación fueron largas, y por eso muchas terminaron poco después de 1989, cuando el apoyo se retiró.',
          en:'Negotiation usually arrives when one of the sides can no longer sustain the effort. Outside support removed precisely that limit: funds, weaponry and training were available as long as the conflict remained useful to the bloc funding it. That is why proxy wars were long, and why many ended shortly after 1989, when the support was withdrawn.' } }
  ];

  var p4v = [
    { q:{ es:'Estados Unidos combatió en Vietnam entre 1965 y 1973 y se retiró sin conseguir su objetivo. La Unión Soviética intervino en Afganistán entre 1979 y 1989 y también se retiró sin conseguirlo. En los dos casos, la potencia contaba con una superioridad militar abrumadora. ¿Qué comparación entre ambos casos está mejor fundamentada?',
          en:'The United States fought in Vietnam between 1965 and 1973 and withdrew without achieving its aim. The Soviet Union intervened in Afghanistan between 1979 and 1989 and also withdrew without achieving it. In both cases the power had overwhelming military superiority. Which comparison between the two cases is best grounded?' },
      o:{ es:['Una enorme ventaja militar no bastó frente a una resistencia local prolongada que recibía apoyo del bloque contrario y contaba con respaldo en su propio territorio.',
              'Las dos potencias se retiraron porque firmaron entre ellas un acuerdo que prohibía intervenir fuera de Europa.',
              'Los dos conflictos terminaron con la victoria militar completa de la potencia interventora.',
              'En ninguno de los dos casos la potencia rival tuvo participación de ningún tipo.'],
          en:['A huge military advantage was not enough against a prolonged local resistance that received support from the rival bloc and had backing in its own territory.',
              'Both powers withdrew because they signed an agreement between themselves forbidding intervention outside Europe.',
              'Both conflicts ended with a complete military victory for the intervening power.',
              'In neither case did the rival power take part in any way.'] }, c:0,
      h:{ es:'Busca lo que se repite en los dos casos, no lo que los distingue: mismo tipo de ventaja, mismo tipo de desenlace.',
          en:'Look for what repeats in both cases, not for what separates them: the same kind of advantage, the same kind of outcome.' },
      e:{ es:'Las dos intervenciones enseñaron una lección parecida y muy costosa. Un ejército con aviones, helicópteros y presupuesto ilimitado puede ganar batallas y aun así no imponer un gobierno si la población del lugar no lo acepta y si el bloque contrario suministra armamento a quienes resisten. Las dos retiradas tuvieron además fuertes consecuencias internas: en un caso una crisis política y social, en el otro una crisis económica que se sumó a las que llevaron al final de la Unión Soviética.',
          en:'The two interventions taught a similar and very costly lesson. An army with planes, helicopters and an unlimited budget can win battles and still fail to impose a government if the local population does not accept it and if the rival bloc supplies weaponry to those resisting. Both withdrawals also had strong internal consequences: in one case a political and social crisis, in the other an economic crisis that added to those that led to the end of the Soviet Union.' } },
    { q:{ es:'Un equipo de tu grupo sostiene que las guerras de Corea, Vietnam y Afganistán fueron el mismo conflicto repetido en tres lugares distintos. Otro equipo responde que cada una tuvo causas propias anteriores a la Guerra Fría. ¿Cuál es la postura mejor sustentada históricamente?',
          en:'A team in your class argues that the wars in Korea, Vietnam and Afghanistan were the same conflict repeated in three different places. Another team answers that each had its own causes predating the Cold War. Which position is better grounded historically?' },
      o:{ es:['La segunda con un matiz: cada conflicto tuvo raíces locales propias, y la rivalidad entre los bloques las agravó, las armó y las prolongó.',
              'La primera sin matices: los tres conflictos fueron creados desde cero por las dos superpotencias.',
              'Ninguna de las dos: los tres conflictos ocurrieron sin ninguna relación con la rivalidad entre los bloques.',
              'La primera, porque los tres conflictos ocurrieron en Asia y compartieron por eso las mismas causas.'],
          en:['The second with a nuance: each conflict had its own local roots, and the rivalry between the blocs aggravated, armed and prolonged them.',
              'The first without nuance: the three conflicts were created from scratch by the two superpowers.',
              'Neither: the three conflicts happened with no relation whatsoever to the rivalry between the blocs.',
              'The first, because the three conflicts happened in Asia and therefore shared the same causes.'] }, c:0,
      h:{ es:'Piensa en qué había en cada uno de esos países antes de 1945 y en qué agregó la disputa entre los bloques después.',
          en:'Think about what existed in each of those countries before 1945 and about what the dispute between the blocs added afterwards.' },
      e:{ es:'Corea llevaba décadas bajo ocupación japonesa y con proyectos políticos enfrentados; Vietnam venía de una larga lucha contra el dominio colonial francés; Afganistán tenía tensiones internas anteriores a cualquier intervención. La rivalidad no inventó esos conflictos: los conectó con una disputa mundial, les entregó armamento moderno y los volvió mucho más largos. Reconocer las dos capas, la local y la global, es lo que permite explicarlos bien.',
          en:'Korea had spent decades under Japanese occupation with opposing political projects; Vietnam came from a long struggle against French colonial rule; Afghanistan had internal tensions predating any intervention. The rivalry did not invent those conflicts: it connected them to a worldwide dispute, handed them modern weaponry and made them much longer. Recognizing both layers, the local and the global, is what allows them to be explained properly.' } }
