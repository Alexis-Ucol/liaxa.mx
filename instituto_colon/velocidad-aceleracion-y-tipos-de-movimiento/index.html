<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Velocidad, Aceleración y Tipos de Movimiento</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Velocidad, Aceleración y Tipos de Movimiento</div>
    <div class="wcourse" id="wcourse-el">Física · 2° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Velocidad, Aceleración y Tipos de Movimiento</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="sbtn" id="dlBtn" onclick="generatePDF()" style="max-width:280px;margin:0 auto;">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   CENTRALIZED SCHOOL CONFIG (Rule 16) — ships UNBRANDED (Rule 11).
   The ONLY rebranding point. build_all.py substitutes these exact fields
   (BRAND_FIELDS / RGB_FIELDS / logo*) downstream; :root/dark stay as fallback.
   Neutral defaults below == the static :root/dark values, so unbranded == no-op.
   ══════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:'#0c246c', primaryDark:'#07184c', primaryBg:'#e6eaf7',
  accent:'#8484b4', accentBg:'#e9e9f1',
  darkPrimary:'#385ed1', darkPrimaryDark:'#6a8bf0', darkPrimaryBg:'#08153e',

function getAttemptKey(name, group){ return 'liaxa_fis2_t05_g02__att__' + (name+'__'+group).replace(/\s+/g,'_'); }
function nextAttempt(name, group){ var k=getAttemptKey(name,group),n=0; try{n=parseInt(localStorage.getItem(k)||'0',10)||0;}catch(e){} n++; try{localStorage.setItem(k,String(n));}catch(e){} return n; }

function lsKey() {
  var n = (studentData.name  || '').trim();
  var g = (studentData.group || '').trim();
  return 'liaxa_fis2_t05_g02__' + (n + '__' + g).replace(/\s+/g, '_');

function saveSession() {
  if (!studentData.name) return;
  var drawings = [], texts = [], photos = [];
  problems.forEach(function(p, i) {
    var dc = document.getElementById('dc' + i);
    if (dc && dc.width) {
      var blank = document.createElement('canvas');
      blank.width = dc.width; blank.height = dc.height;
      drawings.push(dc.toDataURL() === blank.toDataURL() ? null : dc.toDataURL('image/png'));
    } else { drawings.push(null); }
    var ta = document.getElementById('ta' + i);
    texts.push(ta ? ta.value : '');
    var pp = document.getElementById('pp' + i);
    photos.push((pp && pp.src && pp.src.indexOf('data:') === 0) ? pp.src : null);
  });
  var state = {
    name: studentData.name, group: studentData.group,
    answeredCount: answeredCount, correctCount: correctCount,
    choices: problems.map(function(p) { return p.studentChoice; }),
    drawings: drawings, texts: texts, photos: photos
  };
  try { localStorage.setItem(lsKey(), JSON.stringify(state)); } catch(e) {}
}

function loadSession(name, group) {
  var key = 'liaxa_fis2_t05_g02__' + (name + '__' + group).replace(/\s+/g, '_');
  try { var r = localStorage.getItem(key); return r ? JSON.parse(r) : null; } catch(e) { return null; }
}

function restoreSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  var saved = loadSession(name, group);
  if (!saved) return;
  document.getElementById('restoreBar').style.display = 'none';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = currentAttempt(name, group);
  buildLesson(seededRng(name + group + att));
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
  saved.choices.forEach(function(choice, idx) {
    if (choice !== null && choice !== undefined) confirmMC(idx, choice);
  });
  setTimeout(function() {
    if (saved.drawings) {
      saved.drawings.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var dc = document.getElementById('dc' + i);
        if (!dc || !dc.width) return;
        var img = new Image();
        img.onload = function() {
          var dpr = window.devicePixelRatio || 1;
          dc.getContext('2d').drawImage(img, 0, 0, dc.width / dpr, dc.height / dpr);
        };
        img.src = dataUrl;
      });
    }
    if (saved.texts) {
      saved.texts.forEach(function(text, i) {
        if (!text) return;
        var ta = document.getElementById('ta' + i);
        if (ta) ta.value = text;
      });
    }
    if (saved.photos) {
      saved.photos.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var pp = document.getElementById('pp' + i);
        if (!pp) return;
        pp.src = dataUrl; pp.style.display = 'block';
        var pz = document.getElementById('pz' + i);
        if (pz) pz.style.opacity = '0.4';
      });
    }
  }, 300);
}

function dismissRestore() {

  var name  = document.getElementById('sName').value.trim();

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

async function generatePDF() {
  var btn = document.getElementById('dlBtn');
  btn.textContent = (LANG==='en' ? 'Generating PDF...' : 'Generando PDF...');
  btn.disabled = true;

  var jspdf   = window.jspdf;
  var doc     = new jspdf.jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });
  var PW      = 215.9;
  var M       = 18;
  var TW      = PW - M * 2;
  var PH      = doc.internal.pageSize.height;
  var name    = studentData.name;
  var group   = studentData.group;
  var total   = problems.length;
  var pct     = Math.round(correctCount / total * 100);
  var dateStr = new Date().toLocaleString('es-MX', { dateStyle:'long', timeStyle:'short' });

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS — INJECTION BLOCK ─────────────────────────────────────────
  //   Match these RGB values to --green and --gold above.
  //   PRIMARY  → pBR, pBG, pBB
  //   ACCENT   → pAR, pAG, pAB
  // ──────────────────────────────────────────────────────────────────────────
  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;  // PRIMARY (from SCHOOL, Rule 16)
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;   // ACCENT (from SCHOOL, Rule 16)

  function pdfText(html) {
    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/\u2192/g,'->').replace(/\u2212/g,'-').replace(/\u00b2/g,'^2')
      .replace(/\u00b3/g,'^3').replace(/\u00d7/g,'x').replace(/\u00f7/g,'/')
      .replace(/\u2260/g,'!=').replace(/\u2264/g,'<=').replace(/\u2265/g,'>=')
      .replace(/\u221a/g,'sqrt').replace(/\u03c0/g,'pi').replace(/\u2026/g,'...')
      .replace(/\s+/g,' ').trim();
  }

  // ── PORTADA: orange line / white logo strip / orange line / blue band ──
  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,2,'F');   // top accent line
  doc.setFillColor(255,255,255); doc.rect(0,2,PW,26,'F');                               // white logo strip
  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,28,PW,2,'F');  // bottom accent line

    try { doc.addImage(SCHOOL.logoRightB64, fmtR, 130, 4, 48, 22); } catch(e) {}
  }

  var lx = PW - M - 36;
  var ly = 10;
  doc.setDrawColor(pBR,pBG,pBB); doc.setLineWidth(0.7);
  doc.lines([[2.57-1.03,4.63-6.17],[4.11-2.57,5.14-4.63],[5.66-4.11,2.57-5.14]], lx+1.03, ly+6.17);
  doc.setFillColor(pAR,pAG,pAB); doc.circle(lx+5.66, ly+2.57, 0.9, 'F');
  doc.setDrawColor(pAR,pAG,pAB); doc.setLineWidth(0.7);
  doc.line(lx+8.23, ly+1.54, lx+8.23, ly+7.2);

        var iw   = TW;
        var ih   = Math.min(iw * ar, 68);
        doc.addImage(imgD, 'PNG', M, wy, iw, ih);
        wy += ih + 4;
      } catch(e) {}
    }

    var ta = document.getElementById('ta'+i);
    if (ta && ta.value.trim()) {
      if (wy > PH-30) { doc.addPage(); wy = 20; }
      doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('courier','normal');
      var taLines = doc.splitTextToSize(ta.value, TW);
      taLines.slice(0,16).forEach(function(ln) {
        if (wy > PH-15) { doc.addPage(); wy = 20; }
        doc.text(ln, M, wy); wy += 5;
      });
      wy += 2;
    }

    var pp = document.getElementById('pp'+i);
    if (pp && pp.src && pp.src.indexOf('data:') === 0) {
      if (wy > PH-55) { doc.addPage(); wy = 20; }
      try { doc.addImage(pp.src, 'JPEG', M, wy, TW, 68); wy += 72; } catch(e) {}
    }
  }

  // ── Footer on every page ──
  var pages = doc.internal.getNumberOfPages();
  for (var p = 1; p <= pages; p++) {
    doc.setPage(p);
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0, PH-3, PW, 3, 'F');
    doc.setTextColor(130,140,160); doc.setFontSize(6.5); doc.setFont('helvetica','normal');
    doc.text(name+'  ·  '+group+'  ·  Código: '+code+'  ·  Página '+p+'/'+pages,
      PW/2, PH-5, {align:'center'});
  }

  doc.save('fis2_t05_g02_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf');
  btn.innerHTML = '⬇️  ' + t('btn-pdf');
  btn.disabled  = false;
}

function L(o){ return (o && o[LANG] !== undefined) ? o[LANG] : (o ? o.es : ''); }
function ri(rng, a, b){ return a + Math.floor(rng() * (b - a + 1)); }
function pk(rng, a){ return a[Math.floor(rng() * a.length)]; }
function cssv(n){ var v = getComputedStyle(document.documentElement).getPropertyValue(n); return (v || '').trim() || '#000000'; }
function sgn(n){ return (n < 0 ? '−' : '') + Math.abs(n); }

var GW_DRAWS = [];
function fitCanvas(c){
  var dpr = window.devicePixelRatio || 1;
  var w = c.clientWidth || 320;
  var h = c.clientHeight || 220;
  if (c.width !== Math.round(w * dpr) || c.height !== Math.round(h * dpr)) {
    c.width = Math.round(w * dpr); c.height = Math.round(h * dpr);
  }
  var ctx = c.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  return { ctx: ctx, w: w, h: h };
}
function regDraw(fn){ GW_DRAWS.push(fn); setTimeout(fn, 140); setTimeout(fn, 520); }
(function(){
  var to = null;
  window.addEventListener('resize', function(){
    clearTimeout(to);
    to = setTimeout(function(){ GW_DRAWS.forEach(function(f){ try{ f(); }catch(e){} }); }, 120);
  });
})();

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 1 :: PISTA CON SIGNO
   Camina paso a paso sobre una recta numérica. La distancia recorrida suma
   todo el camino; el desplazamiento compara el punto final con la salida y
   lleva signo. Tres rondas con metas distintas, feedback direccional.
   ══════════════════════════════════════════════════════════════════════════ */
function w1(rng, host){
  var rounds = [];
  for (var k = 0; k < 3; k++){
    var dd = pk(rng, [-4, -3, -2, -1, 1, 2, 3, 4]);
    var extra = pk(rng, [2, 4]);
    rounds.push({ start: pk(rng, [-3, -2, 0, 2, 3]), disp: dd, dist: Math.abs(dd) + extra });
  }
  var r = 0, tries = 0, pos = 0, dist = 0, done = false;

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Pista con signo', en:'Signed track' }) + '<span class="gw-tag" id="w1tag"></span></div>' +
    '<div class="gw-q" id="w1q"></div>' +
    '<div class="gw-mini">' + L({
      es:'Cada botón mueve al caminante un metro. La cinta amarilla marca la salida. Mira cómo cambian los tres marcadores con cada paso.',
      en:'Each button moves the walker one metre. The yellow tape marks the start. Watch the three readings change with every step.'
    }) + '</div>' +
    '<canvas class="gw-cvs" id="w1c"></canvas>' +
    '<div class="gw-out">' +
      '<div class="gw-cell"><div class="gw-cn">' + L({ es:'Posición', en:'Position' }) + '</div><div class="gw-cv" id="w1p">0 m</div></div>' +
      '<div class="gw-cell"><div class="gw-cn">' + L({ es:'Distancia recorrida', en:'Distance travelled' }) + '</div><div class="gw-cv" id="w1d">0 m</div></div>' +
      '<div class="gw-cell"><div class="gw-cn">' + L({ es:'Desplazamiento', en:'Displacement' }) + '</div><div class="gw-cv" id="w1s">0 m</div></div>' +
    '</div>' +
    '<div class="gw-row">' +
      '<button class="gw-btn" id="w1l">◀ 1 m</button>' +
      '<button class="gw-btn" id="w1r">1 m ▶</button>' +
      '<button class="gw-btn" id="w1z">' + L({ es:'Volver a la salida', en:'Back to start' }) + '</button>' +
      '<button class="gw-btn" id="w1k">' + L({ es:'Comprobar', en:'Check' }) + '</button>' +
    '</div>' +
    '<div class="gw-fb" id="w1f"></div>';

  var cv = host.querySelector('#w1c');
  function draw(){
    var g = fitCanvas(cv), ctx = g.ctx, W = g.w, H = g.h;
    var x0 = 24, x1 = W - 24, mid = H * 0.58;
    function sx(m){ return x0 + (m + 9) * (x1 - x0) / 18; }
    ctx.lineWidth = 2; ctx.strokeStyle = cssv('--border');
    ctx.beginPath(); ctx.moveTo(x0, mid); ctx.lineTo(x1, mid); ctx.stroke();
    ctx.font = '11px "IBM Plex Sans", sans-serif'; ctx.textAlign = 'center';
    for (var m = -9; m <= 9; m += 3){
      ctx.strokeStyle = cssv('--border');
      ctx.beginPath(); ctx.moveTo(sx(m), mid - 6); ctx.lineTo(sx(m), mid + 6); ctx.stroke();
      ctx.fillStyle = cssv('--text3');
      ctx.fillText(sgn(m), sx(m), mid + 22);
    }
    ctx.fillStyle = cssv('--text3');
    ctx.fillText(L({ es:'metros', en:'metres' }), W / 2, mid + 42);
    var st = rounds[Math.min(r, 2)].start;
    ctx.strokeStyle = cssv('--gold'); ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(sx(st), mid - 46); ctx.lineTo(sx(st), mid + 12); ctx.stroke();
    ctx.fillStyle = cssv('--gold'); ctx.font = '10px "IBM Plex Sans", sans-serif';
    ctx.fillText(L({ es:'SALIDA', en:'START' }), sx(st), mid - 52);
    if (pos !== st){
      var dir = pos > st ? 1 : -1;
      ctx.strokeStyle = cssv('--green'); ctx.lineWidth = 5;
      ctx.beginPath(); ctx.moveTo(sx(st), mid - 26); ctx.lineTo(sx(pos) - dir * 6, mid - 26); ctx.stroke();
      ctx.fillStyle = cssv('--green');
      ctx.beginPath();
      ctx.moveTo(sx(pos), mid - 26);
      ctx.lineTo(sx(pos) - dir * 11, mid - 32);
      ctx.lineTo(sx(pos) - dir * 11, mid - 20);
      ctx.closePath(); ctx.fill();
      ctx.font = '10px "IBM Plex Sans", sans-serif';
      ctx.fillText(L({ es:'desplazamiento', en:'displacement' }), (sx(st) + sx(pos)) / 2, mid - 34);
    }
    ctx.fillStyle = cssv('--green-dark');
    ctx.beginPath(); ctx.arc(sx(pos), mid, 10, 0, Math.PI * 2); ctx.fill();
  }
  regDraw(draw);

  function live(){
    var st = rounds[Math.min(r, 2)].start;
    document.getElementById('w1p').textContent = sgn(pos) + ' m';
    document.getElementById('w1d').textContent = dist + ' m';
    document.getElementById('w1s').textContent = sgn(pos - st) + ' m';
    draw();
  }
  function showRound(){
    var R = rounds[r];
    pos = R.start; dist = 0; tries = 0;
    document.getElementById('w1tag').textContent = L({ es:'Ronda ', en:'Round ' }) + (r + 1) + '/3';
    document.getElementById('w1q').innerHTML = L({
      es:'Meta: termina con una distancia recorrida de <span class="gw-cv">' + R.dist + ' m</span> y un desplazamiento de <span class="gw-cv">' + sgn(R.disp) + ' m</span>.',
      en:'Goal: finish with a distance travelled of <span class="gw-cv">' + R.dist + ' m</span> and a displacement of <span class="gw-cv">' + sgn(R.disp) + ' m</span>.'
    });
    say(host, '', L({
      es:'Puedes ir y venir cuantas veces quieras: el camino se suma aunque regreses.',
      en:'You can go back and forth as often as you like: the path adds up even when you come back.'
    }));
    live();
  }
  function step(d){
    if (done) return;
    var np = pos + d;
    if (np < -9 || np > 9){
      say(host, 'warm', L({ es:'La pista termina ahí. Prueba hacia el otro lado.', en:'The track ends there. Try the other way.' }));
      return;
    }
    pos = np; dist += 1;
    var R = rounds[r], cd = pos - R.start;
    var msg;
    if (cd === R.disp && dist === R.dist) msg = L({ es:'Los dos marcadores coinciden con la meta.', en:'Both readings match the goal.' });
    else if (cd !== R.disp) msg = L({
      es:'Tu desplazamiento va en ' + sgn(cd) + ' m y la meta es ' + sgn(R.disp) + ' m: te conviene caminar hacia la ' + (cd < R.disp ? 'derecha' : 'izquierda') + '.',
      en:'Your displacement is at ' + sgn(cd) + ' m and the goal is ' + sgn(R.disp) + ' m: you should walk to the ' + (cd < R.disp ? 'right' : 'left') + '.'
    });
    else msg = L({
      es:'El desplazamiento ya coincide, pero llevas ' + dist + ' m de camino y la meta pide ' + R.dist + ' m: ' + (dist < R.dist ? 'da un par de pasos de ida y vuelta' : 'esta vez recorriste de más, vuelve a la salida') + '.',
      en:'Displacement already matches, but you have walked ' + dist + ' m and the goal asks for ' + R.dist + ' m: ' + (dist < R.dist ? 'take a couple of steps out and back' : 'you walked too much this time, go back to the start') + '.'
    });
    live();
    say(host, cd === R.disp && dist === R.dist ? 'good' : 'warm', msg);
  }
  function nextRound(){
    r++;
    if (r >= 3){
      done = true;
      document.getElementById('w1tag').textContent = L({ es:'Pista dominada', en:'Track mastered' });
      say(host, 'good', L({
        es:'Ya distingues las dos medidas: una cuenta el camino, la otra cuenta el cambio de posición y lleva signo.',
        en:'You now tell the two measures apart: one counts the path, the other counts the change of position and carries a sign.'
      }));
      ['w1l','w1r','w1z','w1k'].forEach(function(id){ document.getElementById(id).disabled = true; });
      document.getElementById('w1k').classList.add('solved');
      return;
    }
    showRound();
  }
  document.getElementById('w1l').onclick = function(){ step(-1); };
  document.getElementById('w1r').onclick = function(){ step(1); };
  document.getElementById('w1z').onclick = function(){
    if (done) return;
    pos = rounds[r].start; dist = 0; live();
    say(host, '', L({ es:'De vuelta en la salida, con los marcadores en cero.', en:'Back at the start, with the readings at zero.' }));
  };
  document.getElementById('w1k').onclick = function(){
    if (done) return;
    var R = rounds[r], cd = pos - R.start;
    if (cd === R.disp && dist === R.dist){
      say(host, 'good', L({
        es:'Lo lograste: recorriste ' + R.dist + ' m de camino y quedaste a ' + sgn(R.disp) + ' m de la salida.',
        en:'You did it: you covered ' + R.dist + ' m of path and ended ' + sgn(R.disp) + ' m from the start.'
      }));
      setTimeout(nextRound, 900);
      return;
    }
    tries++;
    if (tries >= 3){
      var right = (R.dist + R.disp) / 2, left = (R.dist - R.disp) / 2;
      say(host, 'miss', L({
        es:'Un camino que sirve: ' + right + ' m hacia la derecha y ' + left + ' m hacia la izquierda. Suman ' + R.dist + ' m de camino y dejan al caminante a ' + sgn(R.disp) + ' m de la salida.',
        en:'One path that works: ' + right + ' m to the right and ' + left + ' m to the left. They add up to ' + R.dist + ' m of path and leave the walker ' + sgn(R.disp) + ' m from the start.'
      }));
      setTimeout(nextRound, 2600);
      return;
    }
    say(host, 'warm', L({
      es:'Todavía no. Llevas ' + dist + ' m de camino y un desplazamiento de ' + sgn(cd) + ' m. Sigue ajustando.',
      en:'Not yet. You have ' + dist + ' m of path and a displacement of ' + sgn(cd) + ' m. Keep adjusting.'
    }));
  };
  showRound();
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 2 :: LABORATORIO DE LA PISTA (movimiento uniforme)
   Dos deslizadores, rapidez y tiempo. El auto se coloca en vivo sobre la
   pista y la bandera marca la meta: se ve si se queda corto o se pasa.
   ══════════════════════════════════════════════════════════════════════════ */
function w2(rng, host){
  var pool = [24, 30, 36, 40, 45, 48, 56, 60, 72];
  var targets = shuffle(pool, rng).slice(0, 3);
  var r = 0, tries = 0, v = 3, tt = 4, done = false, anim = null;

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Laboratorio de la pista', en:'Track laboratory' }) + '<span class="gw-tag" id="w2tag"></span></div>' +
    '<div class="gw-q" id="w2q"></div>' +
    '<div class="gw-mini">' + L({
      es:'El auto viaja siempre con la misma rapidez. Mueve los deslizadores y mira dónde queda respecto a la bandera.',
      en:'The car always travels at the same speed. Move the sliders and watch where it lands relative to the flag.'
    }) + '</div>' +
    '<canvas class="gw-cvs" id="w2c"></canvas>' +
    '<div class="gw-slab"><span class="gw-cl">' + L({ es:'Rapidez', en:'Speed' }) + '</span><input type="range" id="w2v" min="1" max="12" step="1" value="3"><span class="gw-sv" id="w2vv">3 m/s</span></div>' +
    '<div class="gw-slab"><span class="gw-cl">' + L({ es:'Tiempo', en:'Time' }) + '</span><input type="range" id="w2t" min="1" max="12" step="1" value="4"><span class="gw-sv" id="w2tv">4 s</span></div>' +
    '<div class="gw-out">' +
      '<div class="gw-cell"><div class="gw-cn">' + L({ es:'Rapidez', en:'Speed' }) + '</div><div class="gw-cv" id="w2a">3 m/s</div></div>' +
      '<div class="gw-cell"><div class="gw-cn">' + L({ es:'Tiempo', en:'Time' }) + '</div><div class="gw-cv" id="w2b">4 s</div></div>' +
      '<div class="gw-cell"><div class="gw-cn">' + L({ es:'Distancia', en:'Distance' }) + '</div><div class="gw-cv" id="w2d">12 m</div></div>' +
    '</div>' +
    '<div class="gw-row">' +
      '<button class="gw-btn" id="w2go">' + L({ es:'Arrancar', en:'Run' }) + '</button>' +
      '<button class="gw-btn" id="w2k">' + L({ es:'Comprobar', en:'Check' }) + '</button>' +
    '</div>' +
    '<div class="gw-fb" id="w2f"></div>';

  var cv = host.querySelector('#w2c');
  var carAt = null;
  function draw(){
    var g = fitCanvas(cv), ctx = g.ctx, W = g.w, H = g.h;
    var x0 = 22, x1 = W - 22, road = H * 0.62, MAX = 84;
    function sx(m){ return x0 + Math.max(0, Math.min(m, MAX)) * (x1 - x0) / MAX; }
    ctx.fillStyle = cssv('--border');
    ctx.fillRect(x0, road, x1 - x0, 3);
    ctx.font = '10px "IBM Plex Sans", sans-serif'; ctx.textAlign = 'center';
    for (var m = 0; m <= MAX; m += 12){
      ctx.fillStyle = cssv('--border'); ctx.fillRect(sx(m) - 1, road - 5, 2, 5);
      ctx.fillStyle = cssv('--text3'); ctx.fillText(m + '', sx(m), road + 16);
    }
    ctx.fillStyle = cssv('--text3'); ctx.fillText(L({ es:'metros', en:'metres' }), W / 2, road + 34);
    var T = targets[Math.min(r, 2)];
    ctx.strokeStyle = cssv('--gold'); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(sx(T), road); ctx.lineTo(sx(T), road - 44); ctx.stroke();
    ctx.fillStyle = cssv('--gold');
    ctx.beginPath(); ctx.moveTo(sx(T), road - 44); ctx.lineTo(sx(T) + 20, road - 38); ctx.lineTo(sx(T), road - 32); ctx.closePath(); ctx.fill();
    ctx.textAlign = 'center'; ctx.font = '10px "IBM Plex Sans", sans-serif';
    ctx.fillText(L({ es:'META', en:'GOAL' }), sx(T), road - 50);
    var d = (carAt === null) ? v * tt : carAt;
    var cx = sx(d);
    ctx.fillStyle = cssv('--green');
    ctx.fillRect(cx - 17, road - 15, 34, 11);
    ctx.fillStyle = cssv('--green-dark');
    ctx.fillRect(cx - 9, road - 22, 18, 8);
    ctx.beginPath(); ctx.arc(cx - 9, road - 3, 4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + 9, road - 3, 4, 0, Math.PI * 2); ctx.fill();
    if (d > 84){
      ctx.fillStyle = cssv('--bad'); ctx.textAlign = 'right'; ctx.font = '11px "IBM Plex Sans", sans-serif';
      ctx.fillText(L({ es:'se sale de la pista', en:'off the track' }), x1, road - 60);
    }
  }
  regDraw(draw);

  function live(){
    var d = v * tt, T = targets[Math.min(r, 2)];
    document.getElementById('w2vv').textContent = v + ' m/s';
    document.getElementById('w2tv').textContent = tt + ' s';
    document.getElementById('w2a').textContent = v + ' m/s';
    document.getElementById('w2b').textContent = tt + ' s';
    document.getElementById('w2d').textContent = d + ' m';
    carAt = null;
    draw();
    if (done) return;
    if (d === T) say(host, 'good', L({
      es:'El auto queda justo en la bandera. Pulsa Comprobar.',
      en:'The car lands right on the flag. Press Check.'
    }));
    else if (d < T) say(host, 'warm', L({
      es:'Se queda ' + (T - d) + ' m antes de la bandera: sube la rapidez o dale más tiempo.',
      en:'It stops ' + (T - d) + ' m short of the flag: raise the speed or give it more time.'
    }));
    else say(host, 'warm', L({
      es:'Se pasa ' + (d - T) + ' m de la bandera: baja la rapidez o recorta el tiempo.',
      en:'It overshoots the flag by ' + (d - T) + ' m: lower the speed or cut the time.'
    }));
  }
  function showRound(){
    tries = 0;
    document.getElementById('w2tag').textContent = L({ es:'Ronda ', en:'Round ' }) + (r + 1) + '/3';
    document.getElementById('w2q').innerHTML = L({
      es:'Ajusta los deslizadores para que el auto se detenga exactamente en la bandera de <span class="gw-cv">' + targets[r] + ' m</span>.',
      en:'Set the sliders so the car stops exactly at the <span class="gw-cv">' + targets[r] + ' m</span> flag.'
    });
    live();
  }
  document.getElementById('w2v').oninput = function(){ v = parseInt(this.value, 10); live(); };
  document.getElementById('w2t').oninput = function(){ tt = parseInt(this.value, 10); live(); };
  document.getElementById('w2go').onclick = function(){
    if (anim) cancelAnimationFrame(anim);
    var d = v * tt, t0 = null, dur = 1300;
    function frame(ts){
      if (t0 === null) t0 = ts;
      var p = Math.min(1, (ts - t0) / dur);
      carAt = d * p;
      draw();
      if (p < 1) anim = requestAnimationFrame(frame); else { anim = null; carAt = null; draw(); }
    }
    anim = requestAnimationFrame(frame);
  };
  document.getElementById('w2k').onclick = function(){
    if (done) return;
    var d = v * tt, T = targets[r];
    if (d === T){
      say(host, 'good', L({
        es:'Correcto. En movimiento uniforme la distancia crece siempre al mismo ritmo, así que rapidez y tiempo se compensan entre sí.',
        en:'Correct. In uniform motion the distance grows always at the same rate, so speed and time trade off against each other.'
      }));
      r++;
      if (r >= 3){
        done = true;
        document.getElementById('w2tag').textContent = L({ es:'Pista dominada', en:'Track mastered' });
        document.getElementById('w2k').classList.add('solved');
        ['w2v','w2t','w2k'].forEach(function(id){ document.getElementById(id).disabled = true; });
        say(host, 'good', L({
          es:'Encontraste varias parejas de rapidez y tiempo que llevan a la misma meta: esa es la marca del movimiento uniforme.',
          en:'You found several speed and time pairs that reach the same goal: that is the signature of uniform motion.'
        }));
        return;
      }
      setTimeout(showRound, 1100);
      return;
    }
    tries++;
    if (tries >= 3){
      var vs = [];
      for (var q = 1; q <= 12; q++) if (T % q === 0 && T / q <= 12) vs.push(q + ' m/s ' + L({ es:'durante ', en:'for ' }) + (T / q) + ' s');
      say(host, 'miss', L({
        es:'Combinaciones que llegan a ' + T + ' m: ' + vs.slice(0, 3).join('; ') + '.',
        en:'Combinations that reach ' + T + ' m: ' + vs.slice(0, 3).join('; ') + '.'
      }));
      r++;
      if (r >= 3){
        done = true;
        document.getElementById('w2tag').textContent = L({ es:'Pista terminada', en:'Track finished' });
        ['w2v','w2t','w2k'].forEach(function(id){ document.getElementById(id).disabled = true; });
        return;
      }
      setTimeout(showRound, 2800);
      return;
    }
    say(host, 'warm', L({
      es:'Con esos valores el auto recorre ' + d + ' m y la bandera está en ' + T + ' m. Mueve un deslizador y vuelve a mirar.',
      en:'With those values the car covers ' + d + ' m and the flag is at ' + T + ' m. Move a slider and look again.'
    }));
  };
  showRound();
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 3 :: CONSTRUCTOR DE GRAFICA VELOCIDAD-TIEMPO
   Tres tramos que el estudiante alterna entre gana rapidez, rapidez
   constante y pierde rapidez. La curva se redibuja al instante y el texto
   traduce en palabras lo que la gráfica está contando.
   ══════════════════════════════════════════════════════════════════════════ */
function w3(rng, host){
  var stories = [
    { pat:['up','flat','down'], txt:{ es:'El camión arranca del semáforo, avanza parejo por la avenida y frena al llegar al crucero.', en:'The bus pulls away from the lights, cruises steadily along the avenue and brakes at the junction.' } },
    { pat:['flat','up','flat'], txt:{ es:'Un auto viaja parejo por la carretera, acelera para rebasar a un camión y luego sigue parejo con su nueva rapidez.', en:'A car drives steadily on the highway, speeds up to overtake a truck and then carries on steadily at its new speed.' } },
    { pat:['down','flat','up'], txt:{ es:'Una motocicleta frena al ver un tope, lo cruza despacio sin cambiar de rapidez y acelera al pasarlo.', en:'A motorbike brakes when it sees a speed bump, crosses it slowly without changing speed and speeds up after it.' } },
    { pat:['up','down','flat'], txt:{ es:'Un patinador gana rapidez al bajar la rampa, frena en la curva y termina rodando parejo por el pasillo.', en:'A skater gains speed going down the ramp, slows in the bend and ends up rolling steadily along the corridor.' } },
    { pat:['flat','down','up'], txt:{ es:'El tren ligero viaja parejo, pierde rapidez al entrar a la estación y vuelve a ganarla al salir de ella.', en:'The light train runs steadily, loses speed as it enters the station and gains it again on the way out.' } }
  ];
  var order = shuffle(stories, rng).slice(0, 3);
  var LBL = {
    up:   { es:'gana rapidez', en:'gains speed' },
    flat: { es:'rapidez constante', en:'steady speed' },
    down: { es:'pierde rapidez', en:'loses speed' }
  };
  var cyc = ['up', 'flat', 'down'];
  var r = 0, tries = 0, done = false, cur = ['flat', 'flat', 'flat'];

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Constructor de gráficas', en:'Graph builder' }) + '<span class="gw-tag" id="w3tag"></span></div>' +
    '<div class="gw-q" id="w3q"></div>' +
    '<div class="gw-mini">' + L({
      es:'Toca cada tramo para cambiar lo que hace la velocidad en ese trozo del viaje. La gráfica se redibuja al instante.',
      en:'Tap each segment to change what the velocity does in that piece of the trip. The graph redraws instantly.'
    }) + '</div>' +
    '<canvas class="gw-cvs" id="w3c"></canvas>' +
    '<div class="gw-grid">' +
      '<button class="gw-tile" id="w3s0"></button>' +
      '<button class="gw-tile" id="w3s1"></button>' +
      '<button class="gw-tile" id="w3s2"></button>' +
    '</div>' +
    '<div class="gw-row"><button class="gw-btn" id="w3k">' + L({ es:'Comprobar', en:'Check' }) + '</button></div>' +
    '<div class="gw-fb" id="w3f"></div>';

  var cv = host.querySelector('#w3c');
  function vals(){
    var out = [3], vv = 3;
    for (var i = 0; i < 3; i++){
      if (cur[i] === 'up') vv += 3;
      else if (cur[i] === 'down') vv = Math.max(1, vv - 3);
      out.push(vv);
    }
    return out;
  }
  function draw(){
    var g = fitCanvas(cv), ctx = g.ctx, W = g.w, H = g.h;
    var x0 = 42, x1 = W - 16, yb = H - 34, yt = 18;
    ctx.strokeStyle = cssv('--border'); ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(x0, yt); ctx.lineTo(x0, yb); ctx.lineTo(x1, yb); ctx.stroke();
    ctx.fillStyle = cssv('--text3'); ctx.font = '10px "IBM Plex Sans", sans-serif';
    ctx.textAlign = 'right'; ctx.fillText(L({ es:'velocidad', en:'velocity' }), x0 - 6, yt + 4);
    ctx.textAlign = 'center'; ctx.fillText(L({ es:'tiempo', en:'time' }), (x0 + x1) / 2, yb + 26);
    var vv = vals(), maxv = 12;
    function px(i){ return x0 + i * (x1 - x0) / 3; }
    function py(val){ return yb - (val / maxv) * (yb - yt); }
    for (var i = 1; i < 3; i++){
      ctx.strokeStyle = cssv('--border'); ctx.setLineDash([3, 4]); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(px(i), yt); ctx.lineTo(px(i), yb); ctx.stroke(); ctx.setLineDash([]);
    }
    ctx.strokeStyle = cssv('--green'); ctx.lineWidth = 3.5;
    ctx.beginPath(); ctx.moveTo(px(0), py(vv[0]));
    for (var j = 1; j <= 3; j++) ctx.lineTo(px(j), py(vv[j]));
    ctx.stroke();
    ctx.fillStyle = cssv('--green');
    for (var k = 0; k <= 3; k++){ ctx.beginPath(); ctx.arc(px(k), py(vv[k]), 4, 0, Math.PI * 2); ctx.fill(); }
    ctx.fillStyle = cssv('--text3'); ctx.font = '10px "IBM Plex Sans", sans-serif'; ctx.textAlign = 'center';
    for (var s = 0; s < 3; s++) ctx.fillText((s + 1) + '', (px(s) + px(s + 1)) / 2, yb + 14);
  }
  regDraw(draw);

  function tiles(){
    for (var i = 0; i < 3; i++){
      var b = document.getElementById('w3s' + i);
      b.innerHTML = L({ es:'Tramo ', en:'Segment ' }) + (i + 1) + '<span class="gw-lb">' + L(LBL[cur[i]]) + '</span>';
      b.className = 'gw-tile' + (cur[i] === 'flat' ? '' : ' on');
    }
  }
  function tale(){
    return cur.map(function(c){ return L(LBL[c]); }).join(L({ es:', luego ', en:', then ' }));
  }
  function live(){
    tiles(); draw();
    if (done) return;
    say(host, '', L({
      es:'Tu gráfica cuenta esto: ' + tale() + '.',
      en:'Your graph tells this: ' + tale() + '.'
    }));
  }
  function showRound(){
    tries = 0; cur = ['flat', 'flat', 'flat'];
    document.getElementById('w3tag').textContent = L({ es:'Ronda ', en:'Round ' }) + (r + 1) + '/3';
    document.getElementById('w3q').textContent = L(order[r].txt);
    live();
  }
  for (var i = 0; i < 3; i++){
    (function(idx){
      document.getElementById('w3s' + idx).onclick = function(){
        if (done) return;
        cur[idx] = cyc[(cyc.indexOf(cur[idx]) + 1) % 3];
        live();
      };
    })(i);
  }
  document.getElementById('w3k').onclick = function(){
    if (done) return;
    var pat = order[r].pat, bad = -1;
    for (var i = 0; i < 3; i++) if (cur[i] !== pat[i]) { bad = i; break; }
    if (bad === -1){
      say(host, 'good', L({
        es:'La gráfica coincide con la historia. Donde la línea sube hay aceleración a favor del movimiento, donde baja la aceleración va en contra y donde es horizontal no hay aceleración.',
        en:'The graph matches the story. Where the line rises the acceleration favours the motion, where it falls the acceleration opposes it, and where it is flat there is no acceleration.'
      }));
      r++;
      if (r >= 3){
        done = true;
        document.getElementById('w3tag').textContent = L({ es:'Gráficas dominadas', en:'Graphs mastered' });
        document.getElementById('w3k').classList.add('solved');
        for (var q = 0; q < 3; q++) document.getElementById('w3s' + q).disabled = true;
        document.getElementById('w3k').disabled = true;
        return;
      }
      setTimeout(showRound, 1300);
      return;
    }
    tries++;
    if (tries >= 3){
      cur = pat.slice(); tiles(); draw();
      say(host, 'miss', L({
        es:'Así se ve esa historia: ' + tale() + '. Fíjate en qué verbo de la historia corresponde a cada tramo.',
        en:'This is what that story looks like: ' + tale() + '. Notice which verb of the story matches each segment.'
      }));
      r++;
      if (r >= 3){
        done = true;
        document.getElementById('w3tag').textContent = L({ es:'Gráficas terminadas', en:'Graphs finished' });
        for (var z = 0; z < 3; z++) document.getElementById('w3s' + z).disabled = true;
        document.getElementById('w3k').disabled = true;
        return;
      }
      setTimeout(showRound, 3000);
      return;
    }
    say(host, 'warm', L({
      es:'Revisa el tramo ' + (bad + 1) + ': ahí lo pusiste en "' + L(LBL[cur[bad]]) + '", pero la historia no dice eso en ese momento.',
      en:'Check segment ' + (bad + 1) + ': you set it to "' + L(LBL[cur[bad]]) + '", but the story does not say that at that moment.'
    }));
  };
  showRound();
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 4 :: CLASIFICADOR DE TIPOS DE MOVIMIENTO
   Seis escenas cotidianas. Cada toque cambia la etiqueta de la escena.
   Reversible siempre; a la tercera revisión se revela la clasificación.
   ══════════════════════════════════════════════════════════════════════════ */
function w4(rng, host){
  var bank = [
    { t:{ es:'Un elevador sube del piso 1 al piso 5', en:'A lift goes up from floor 1 to floor 5' }, c:'rect', h:{ es:'sigue una línea recta vertical, sin dar vueltas ni regresar', en:'it follows a straight vertical line, without turning or coming back' } },
    { t:{ es:'Las aspas de un ventilador encendido', en:'The blades of a fan that is switched on' }, c:'circ', h:{ es:'cada punto de las aspas repite la misma circunferencia', en:'each point of the blades repeats the same circle' } },
    { t:{ es:'El péndulo de un reloj de pared', en:'The pendulum of a wall clock' }, c:'osc', h:{ es:'va y viene alrededor de un mismo punto central', en:'it goes back and forth around one central point' } },
    { t:{ es:'Las olas que avanzan por la superficie de un lago', en:'The waves moving across the surface of a lake' }, c:'ond', h:{ es:'lo que viaja es la perturbación, no el agua completa', en:'what travels is the disturbance, not the whole body of water' } },
    { t:{ es:'Una canica que rueda por un pasillo recto', en:'A marble rolling along a straight corridor' }, c:'rect', h:{ es:'su trayectoria es una línea recta', en:'its path is a straight line' } },
    { t:{ es:'La rueda de la fortuna de la feria', en:'The ferris wheel at the fair' }, c:'circ', h:{ es:'las cabinas describen una circunferencia alrededor del eje', en:'the cabins describe a circle around the axle' } },
    { t:{ es:'Un columpio con alguien sentado', en:'A swing with someone sitting on it' }, c:'osc', h:{ es:'repite el mismo recorrido de ida y vuelta', en:'it repeats the same out and back path' } },
    { t:{ es:'El sonido que viaja de una bocina a tu oído', en:'The sound travelling from a speaker to your ear' }, c:'ond', h:{ es:'el aire no se traslada, solo transmite la vibración', en:'the air does not travel, it only passes the vibration on' } },
    { t:{ es:'Un tren de juguete en una vía circular', en:'A toy train on a circular track' }, c:'circ', h:{ es:'da vueltas completas alrededor del centro de la vía', en:'it goes in full turns around the centre of the track' } },
    { t:{ es:'La cuerda de una guitarra recién tocada', en:'A guitar string just after being plucked' }, c:'osc', h:{ es:'vibra de un lado a otro sin cambiar de lugar', en:'it vibrates from side to side without changing place' } }
  ];
  var CAT = {
    rect: { es:'Rectilíneo', en:'Straight line' },
    circ: { es:'Circular', en:'Circular' },
    osc:  { es:'Oscilatorio', en:'Oscillating' },
    ond:  { es:'Ondulatorio', en:'Wave' }
  };
  var cyc = ['rect', 'circ', 'osc', 'ond'];
  var items = shuffle(bank, rng).slice(0, 6);
  var pick = items.map(function(){ return 'rect'; });
  var tries = 0, done = false;

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Clasificador de movimientos', en:'Motion sorter' }) + '<span class="gw-tag" id="w4tag"></span></div>' +
    '<div class="gw-q">' + L({
      es:'Toca cada escena hasta que muestre el tipo de movimiento que le corresponde.',
      en:'Tap each scene until it shows the type of motion that belongs to it.'
    }) + '</div>' +
    '<div class="gw-mini">' + L({
      es:'Las etiquetas giran entre rectilíneo, circular, oscilatorio y ondulatorio. Puedes cambiarlas todas las veces que quieras.',
      en:'The labels cycle through straight line, circular, oscillating and wave. You can change them as often as you like.'
    }) + '</div>' +
    '<div class="gw-grid" id="w4g">' +
      items.map(function(it, i){ return '<button class="gw-tile" id="w4t' + i + '"></button>'; }).join('') +
    '</div>' +
    '<div class="gw-row"><button class="gw-btn" id="w4k">' + L({ es:'Comprobar', en:'Check' }) + '</button></div>' +
    '<div class="gw-fb" id="w4f"></div>';

  function paint(){
    items.forEach(function(it, i){
      var b = document.getElementById('w4t' + i);
      b.innerHTML = L(it.t) + '<span class="gw-lb">' + L(CAT[pick[i]]) + '</span>';
      b.className = 'gw-tile' + (done && pick[i] === it.c ? ' fix' : (pick[i] === 'rect' ? '' : ' on'));
    });
  }
  items.forEach(function(it, i){
    document.getElementById('w4t' + i).onclick = function(){
      if (done) return;
      pick[i] = cyc[(cyc.indexOf(pick[i]) + 1) % 4];
      paint();
      say(host, '', L({
        es:'"' + L(it.t) + '" quedó como ' + L(CAT[pick[i]]).toLowerCase() + '. Piensa en la forma del camino que sigue.',
        en:'"' + L(it.t) + '" is now set to ' + L(CAT[pick[i]]).toLowerCase() + '. Think about the shape of the path it follows.'
      }));
    };
  });
  document.getElementById('w4k').onclick = function(){
    if (done) return;
    var wrong = [];
    items.forEach(function(it, i){ if (pick[i] !== it.c) wrong.push(i); });
    if (wrong.length === 0){
      done = true; paint();
      document.getElementById('w4tag').textContent = L({ es:'Clasificado', en:'Sorted' });
      document.getElementById('w4k').classList.add('solved');
      document.getElementById('w4k').disabled = true;
      say(host, 'good', L({
        es:'Las seis quedaron en su lugar. La clave está en la forma del camino y en si el movimiento se repite.',
        en:'All six are in place. The key is the shape of the path and whether the motion repeats.'
      }));
      return;
    }
    tries++;
    if (tries >= 3){
      pick = items.map(function(it){ return it.c; });
      done = true; paint();
      document.getElementById('w4tag').textContent = L({ es:'Revelado', en:'Revealed' });
      document.getElementById('w4k').disabled = true;
      say(host, 'miss', L({
        es:'Así quedan las seis escenas. Compara cada etiqueta con la forma del camino: recta, circunferencia, ida y vuelta alrededor de un punto, o una perturbación que viaja.',
        en:'This is how the six scenes end up. Compare each label with the shape of the path: a straight line, a circle, a back and forth around a point, or a disturbance that travels.'
      }));
      return;
    }
    var i0 = wrong[0];
    say(host, 'warm', L({
      es:'Todavía hay ' + wrong.length + ' por ajustar. Empieza por "' + L(items[i0].t) + '": ' + L(items[i0].h) + '.',
      en:'There are still ' + wrong.length + ' to adjust. Start with "' + L(items[i0].t) + '": ' + L(items[i0].h) + '.'
    }));
  };
  paint();
  say(host, '', L({
    es:'Empieza a tocar las escenas. Nada queda fijo hasta que tú lo decidas.',
    en:'Start tapping the scenes. Nothing is fixed until you decide it is.'
  }));
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 5 :: MESA DE FUERZAS (fricción y equilibrio)
   La flecha de fricción crece con el empuje hasta su tope. El objetivo es
   deslizar la caja sin ganar ni perder rapidez: fuerza neta cero en marcha.
   ══════════════════════════════════════════════════════════════════════════ */
function w5(rng, host){
  var surf = [
    { n:{ es:'una pista de hielo', en:'an ice rink' }, f:3 },
    { n:{ es:'un piso de loseta pulida', en:'a polished tile floor' }, f:6 },
    { n:{ es:'un piso de madera', en:'a wooden floor' }, f:9 },
    { n:{ es:'una alfombra gruesa', en:'a thick carpet' }, f:13 },
    { n:{ es:'un piso de concreto rugoso', en:'a rough concrete floor' }, f:16 }
  ];
  var order = shuffle(surf, rng).slice(0, 3);
  var r = 0, tries = 0, F = 0, done = false;

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Mesa de fuerzas', en:'Force table' }) + '<span class="gw-tag" id="w5tag"></span></div>' +
    '<div class="gw-q" id="w5q"></div>' +
    '<div class="gw-mini">' + L({
      es:'La flecha verde es tu empuje y la roja es la fricción. Observa cómo la fricción crece contigo hasta que ya no puede más.',
      en:'The green arrow is your push and the red one is friction. Watch how friction grows with you until it cannot grow any more.'
    }) + '</div>' +
    '<canvas class="gw-cvs" id="w5c"></canvas>' +
    '<div class="gw-slab"><span class="gw-cl">' + L({ es:'Tu empuje', en:'Your push' }) + '</span><input type="range" id="w5s" min="0" max="20" step="1" value="0"><span class="gw-sv" id="w5sv">0 N</span></div>' +
    '<div class="gw-row"><button class="gw-btn" id="w5k">' + L({ es:'Comprobar', en:'Check' }) + '</button></div>' +
    '<div class="gw-fb" id="w5f"></div>';

  var cv = host.querySelector('#w5c');
  function draw(){
    var g = fitCanvas(cv), ctx = g.ctx, W = g.w, H = g.h;
    var f = order[Math.min(r, 2)].f;
    var fr = Math.min(F, f);
    var floor = H - 46, cx = W / 2, bw = 62, bh = 46;
    ctx.fillStyle = cssv('--border'); ctx.fillRect(16, floor, W - 32, 3);
    ctx.fillStyle = cssv('--green-bg'); ctx.fillRect(cx - bw / 2, floor - bh, bw, bh);
    ctx.strokeStyle = cssv('--green'); ctx.lineWidth = 2;
    ctx.strokeRect(cx - bw / 2, floor - bh, bw, bh);
    ctx.fillStyle = cssv('--text3'); ctx.font = '11px "IBM Plex Sans", sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(L({ es:'caja', en:'box' }), cx, floor - bh / 2 + 4);
    var sc = 8;
    function arrow(x, y, len, col, lab){
      if (len <= 0) return;
      var d = len > 0 ? 1 : -1, L2 = Math.abs(len);
      ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + d * (L2 - 9), y); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x + d * L2, y);
      ctx.lineTo(x + d * (L2 - 12), y - 7);
      ctx.lineTo(x + d * (L2 - 12), y + 7);
      ctx.closePath(); ctx.fill();
      ctx.font = '10px "IBM Plex Sans", sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(lab, x + d * L2 / 2, y - 12);
    }
    arrow(cx + bw / 2, floor - bh * 0.62, F * sc, cssv('--green'), L({ es:'empuje', en:'push' }) + ' ' + F + ' N');
    arrow(cx - bw / 2, floor - bh * 0.62, -fr * sc, cssv('--bad'), L({ es:'fricción', en:'friction' }));
    var net = F - fr;
    ctx.textAlign = 'center'; ctx.font = '12px "IBM Plex Sans", sans-serif';
    if (net > 0){
      ctx.fillStyle = cssv('--gold');
      ctx.fillText(L({ es:'fuerza neta hacia la derecha: la caja gana rapidez', en:'net force to the right: the box gains speed' }), W / 2, 20);
    } else if (F === 0){
      ctx.fillStyle = cssv('--text3');
      ctx.fillText(L({ es:'nadie empuja: la caja sigue quieta', en:'nobody is pushing: the box stays still' }), W / 2, 20);
    } else if (F < f){
      ctx.fillStyle = cssv('--text3');
      ctx.fillText(L({ es:'fuerza neta cero, pero la caja no arranca', en:'zero net force, but the box does not start moving' }), W / 2, 20);
    } else {
      ctx.fillStyle = cssv('--ok');
      ctx.fillText(L({ es:'fuerza neta cero con la caja en marcha', en:'zero net force with the box on the move' }), W / 2, 20);
    }
  }
  regDraw(draw);

  function live(){
    var f = order[Math.min(r, 2)].f;
    document.getElementById('w5sv').textContent = F + ' N';
    draw();
    if (done) return;
    if (F === 0) say(host, '', L({
      es:'Con cero empuje no hay nada que vencer. Sube poco a poco y observa la flecha roja.',
      en:'With zero push there is nothing to overcome. Raise it little by little and watch the red arrow.'
    }));
    else if (F < f) say(host, 'warm', L({
      es:'La fricción está igualando tu empuje y la caja sigue quieta: necesitas empujar un poco más fuerte.',
      en:'Friction is matching your push and the box stays still: you need to push a little harder.'
    }));
    else if (F === f) say(host, 'good', L({
      es:'La flecha roja ya no puede crecer más y mide lo mismo que la verde: la caja se desliza sin ganar ni perder rapidez.',
      en:'The red arrow cannot grow any further and matches the green one: the box slides without gaining or losing speed.'
    }));
    else say(host, 'warm', L({
      es:'Tu empuje supera a la fricción por ' + (F - f) + ' N, así que la caja va ganando rapidez: bájalo un poco.',
      en:'Your push beats friction by ' + (F - f) + ' N, so the box keeps gaining speed: lower it a little.'
    }));
  }
  function showRound(){
    tries = 0; F = 0;
    document.getElementById('w5s').value = '0';
    document.getElementById('w5tag').textContent = L({ es:'Ronda ', en:'Round ' }) + (r + 1) + '/3';
    document.getElementById('w5q').textContent = L({
      es:'Arrastras una caja sobre ' + L(order[r].n) + '. Ajusta tu empuje para que la caja se deslice con la misma rapidez todo el tramo.',
      en:'You are dragging a box over ' + L(order[r].n) + '. Set your push so the box slides at the same speed all the way.'
    });
    live();
  }
  document.getElementById('w5s').oninput = function(){ F = parseInt(this.value, 10); live(); };
  document.getElementById('w5k').onclick = function(){
    if (done) return;
    var f = order[r].f;
    if (F === f){
      say(host, 'good', L({
        es:'Eso es el equilibrio en movimiento: las dos fuerzas se cancelan y la velocidad se queda como está.',
        en:'That is equilibrium in motion: the two forces cancel and the velocity stays as it is.'
      }));
      r++;
      if (r >= 3){
        done = true;
        document.getElementById('w5tag').textContent = L({ es:'Superficies dominadas', en:'Surfaces mastered' });
        document.getElementById('w5k').classList.add('solved');
        document.getElementById('w5k').disabled = true;
        document.getElementById('w5s').disabled = true;
        say(host, 'good', L({
          es:'En las tres superficies el equilibrio se logró con un empuje distinto: la fricción cambia con el tipo de superficie.',
          en:'On all three surfaces the balance needed a different push: friction changes with the type of surface.'
        }));
        return;
      }
      setTimeout(showRound, 1300);
      return;
    }
    tries++;
    if (tries >= 3){
      F = f; document.getElementById('w5s').value = String(f); draw();
      document.getElementById('w5sv').textContent = F + ' N';
      say(host, 'miss', L({
        es:'En esta superficie la fricción vale ' + f + ' N, así que el empuje que deja la fuerza neta en cero es de ' + f + ' N.',
        en:'On this surface friction is ' + f + ' N, so the push that leaves the net force at zero is ' + f + ' N.'
      }));
      r++;
      if (r >= 3){
        done = true;
        document.getElementById('w5tag').textContent = L({ es:'Superficies terminadas', en:'Surfaces finished' });
        document.getElementById('w5k').disabled = true;
        document.getElementById('w5s').disabled = true;
        return;
      }
      setTimeout(showRound, 3000);
      return;
    }
    say(host, 'warm', L({
      es:'Aún no. Fíjate en la flecha roja: mientras siga creciendo contigo, la caja no ha arrancado.',
      en:'Not yet. Watch the red arrow: while it keeps growing with you, the box has not started moving.'
    }));
  };
  showRound();
}

      en:'To describe any of these scenes you need a few precise ideas: relative to what the motion is measured, how much path is covered, where it ends up, how fast it goes and whether that speed is changing. This guide is for handling those ideas and for recognising, in everyday scenes, which type of motion is at play.'

    '<div class="callout"><p><strong>' + L({ es:'Idea clave: ', en:'Key idea: ' }) + '</strong>' + L({

      en:'velocity is not just a number: it includes which way. And acceleration does not mean going fast, it means that the velocity is changing, either in size or in direction.'

    '<p>' + L({
      es:'Antes de decir que algo se mueve hay que decir respecto a qué. Ese punto de comparación se llama marco de referencia. Tu mochila está quieta respecto a ti y en movimiento respecto a un poste de la calle, y las dos afirmaciones son correctas porque parten de referencias distintas.',
      en:'Before saying that something moves you have to say relative to what. That point of comparison is called a frame of reference. Your backpack is still relative to you and moving relative to a lamp post on the street, and both statements are correct because they start from different references.'
