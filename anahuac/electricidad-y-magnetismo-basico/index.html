<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Electricidad y Magnetismo Básico</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS - INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }

/* ── WIDGET CHROME (concept manipulatives) ── */
.iwbox { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; padding:1.1rem; }
.iw-tag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:700; margin-bottom:.35rem; }
.iw-sub { font-size:.86rem; color:var(--text2); margin-bottom:.75rem; }
.rfb { font-size:.84rem; color:var(--text2); min-height:1.35rem; margin-top:.6rem; line-height:1.5; }
.rfb b { color:var(--green-dark); }
.okmsg { color:var(--ok); font-weight:700; }
.rverify-btn { min-height:44px; padding:.55rem 1.1rem; border:none; border-radius:8px; background:var(--green); color:#fff; font-size:.85rem; font-weight:600; cursor:pointer; font-family:inherit; margin-top:.6rem; }
.rverify-btn:hover { background:var(--green-dark); }
.wprog { font-family:'IBM Plex Mono',monospace; font-size:.7rem; color:var(--text3); letter-spacing:.08em; text-transform:uppercase; margin-bottom:.45rem; }
.wgoal { font-size:.84rem; color:var(--text2); background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.55rem .75rem; margin:.45rem 0 .7rem; }
.wgoal b { color:var(--green-dark); font-family:'IBM Plex Mono',monospace; }

/* ── SLIDER CONTROLS ── */
.ctrl { display:flex; align-items:center; gap:.6rem; margin:.4rem 0; flex-wrap:wrap; }
.ctrl-lbl { font-size:.76rem; color:var(--text3); min-width:118px; }
.ctrl-rng { flex:1; min-width:120px; accent-color:var(--green); height:44px; }
.ctrl-val { font-family:'IBM Plex Mono',monospace; font-weight:700; color:var(--green); min-width:86px; text-align:right; font-size:.92rem; }

/* ── READOUTS AND BARS ── */
.readout { text-align:center; font-family:'IBM Plex Mono',monospace; font-size:1.5rem; font-weight:700; margin:.7rem 0 .15rem; color:var(--text); }
.readout.hit { color:var(--ok); }
.rdlbl { text-align:center; font-size:.68rem; letter-spacing:.1em; text-transform:uppercase; color:var(--text3); margin-bottom:.5rem; }
.bars { margin-top:.8rem; }
.bar-row { display:flex; align-items:center; gap:.5rem; margin-bottom:.34rem; }
.bar-name { font-size:.72rem; color:var(--text3); min-width:118px; }
.bar-track { flex:1; background:var(--surface2); border-radius:5px; height:16px; overflow:hidden; min-width:46px; }
.bar-fill { height:100%; border-radius:5px; transition:width .22s; background:var(--green); }
.bar-fill.tgt { background:var(--gold); }
.bar-fill.now { background:var(--green); }
.bar-num { font-family:'IBM Plex Mono',monospace; font-size:.74rem; min-width:82px; text-align:right; color:var(--text2); }

/* ── RESISTOR CHIPS AND MODE BUTTONS ── */
.chips { display:flex; flex-wrap:wrap; gap:.4rem; margin:.5rem 0 .7rem; }
.chip { border:1.5px solid var(--border); border-radius:22px; background:var(--surface2); color:var(--text2); padding:.4rem .95rem; font-size:.8rem; cursor:pointer; min-height:44px; font-family:inherit; }
.chip.on { border-color:var(--green); background:var(--green-bg); color:var(--green-dark); font-weight:700; }
.modes { display:flex; gap:.45rem; flex-wrap:wrap; margin:.2rem 0 .5rem; }
.mode-btn { min-height:44px; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text2); font-size:.8rem; font-weight:600; padding:.5rem 1.05rem; cursor:pointer; font-family:inherit; }
.mode-btn.on { background:var(--green); color:#fff; border-color:var(--green); }

/* ── MAGNETIC FIELD STAGE ── */
.fstage { position:relative; height:224px; margin:.65rem 0 .2rem; background:var(--surface2); border-radius:10px; overflow:hidden; }
.fring { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); border:1px dashed var(--border); border-radius:50%; transition:width .2s, height .2s; }
.fwire { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); font-size:2rem; line-height:1; font-weight:700; color:var(--green-dark); }
.ndl { position:absolute; line-height:1; font-weight:700; color:var(--gold); transition:left .2s, top .2s, transform .2s, font-size .2s; }
.fcap { text-align:center; font-size:.72rem; color:var(--text3); font-family:'IBM Plex Mono',monospace; }

/* ── CLASSIFIER ── */
.cls-card { background:var(--surface2); border:1.5px solid var(--border); border-radius:10px; padding:.9rem; text-align:center; font-weight:600; font-size:.88rem; margin:.6rem 0; color:var(--text); }
.cls-prog { font-family:'IBM Plex Mono',monospace; font-size:.7rem; color:var(--text3); letter-spacing:.08em; text-transform:uppercase; }
.cls-bins { display:grid; grid-template-columns:repeat(3,1fr); gap:.5rem; }
.cls-bin { min-height:44px; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.8rem; font-weight:600; cursor:pointer; font-family:inherit; padding:.5rem; }
.cls-bin:hover { border-color:var(--green); color:var(--green); }
.cls-done { font-weight:700; color:var(--ok); text-align:center; padding:.6rem; }

/* ── REFLECT ── */
.reflect-prompt { font-size:.9rem; color:var(--text2); background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 8px 8px 0; padding:.7rem .85rem; margin:.5rem 0 .8rem; }

@media (max-width: 600px) {
  .cls-bins { grid-template-columns:1fr; }
  .ctrl-lbl { min-width:88px; font-size:.72rem; }
  .ctrl-val { min-width:70px; font-size:.84rem; }
  .bar-name { min-width:86px; font-size:.66rem; }
  .bar-num { min-width:64px; font-size:.68rem; }
  .iwbox { padding:.8rem; }
  .readout { font-size:1.25rem; }

/* ── Drawing palette, derived from the school's colours (Rule 16) ─────────
   slots 1-2 : school primary + accent
   slots 3-4 : the two of black/red/blue/green least similar to the school colours
   Falls back to neutral defaults if SCHOOL colours can't be parsed.
   ───────────────────────────────────────────────────────────────────── */
var DRAW_PALETTE = (function () {
  function hex2rgb(h) {
    h = String(h).replace('#', '');
    if (h.length === 3) { h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2]; }
    return [parseInt(h.substr(0,2),16), parseInt(h.substr(2,2),16), parseInt(h.substr(4,2),16)];
  }
  function dist(a, b) {
    var dr = a[0]-b[0], dg = a[1]-b[1], db = a[2]-b[2];
    return Math.sqrt(2*dr*dr + 4*dg*dg + 3*db*db);
  }
  var COMMON = ['#1a1a16', '#c0392b', '#1d4e89', '#1a7a3a'];  /* black, red, blue, green */
  var schoolRGB;
  try {
    schoolRGB = [hex2rgb(SCHOOL.primary), hex2rgb(SCHOOL.accent)];
  } catch (e) {
    return [SCHOOL.primary, SCHOOL.accent, '#1a1a16', '#1d4e89'];
  }
  var scored = COMMON.map(function (c, idx) {
    var rgb = hex2rgb(c);
    var nearest = Math.min(dist(rgb, schoolRGB[0]), dist(rgb, schoolRGB[1]));
    return { c: c, idx: idx, d: nearest };
  });
  scored.sort(function (a, b) { return b.d - a.d; });      /* farthest first */
  var keep = scored.slice(0, 2);
  keep.sort(function (a, b) { return a.idx - b.idx; });    /* restore visual order */
  return [SCHOOL.primary, SCHOOL.accent, keep[0].c, keep[1].c];
})();
function drawDotsHTML() {
  return DRAW_PALETTE.map(function (c, i) {
    return '<div class="cdot' + (i === 0 ? ' sel' : '') + '" data-color="' + c +
           '" style="background:' + c + '"></div>';
  }).join('');
}

function lsKey() {

function saveSession() {
  if (!studentData.name) return;
  var drawings = [], texts = [], photos = [];
  problems.forEach(function(p, i) {
    var dc = document.getElementById('dc' + i);
    if (dc && dc.width) {
      var blank = document.createElement('canvas');
      blank.width = dc.width; blank.height = dc.height;
      drawings.push(dc.toDataURL() === blank.toDataURL() ? null : dc.toDataURL('image/png'));
    } else { drawings.push(null); }
    var ta = document.getElementById('ta' + i);
    texts.push(ta ? ta.value : '');
    var pp = document.getElementById('pp' + i);
    photos.push((pp && pp.src && pp.src.indexOf('data:') === 0) ? pp.src : null);
  });
  var state = {
    name: studentData.name, group: studentData.group,
    answeredCount: answeredCount, correctCount: correctCount,
    choices: problems.map(function(p) { return p.studentChoice; }),
    drawings: drawings, texts: texts, photos: photos
  };
  try { localStorage.setItem(lsKey(), JSON.stringify(state)); } catch(e) {}
}

function loadSession(name, group) {
  var key = 'liaxa_cneyt3_t05_g01__' + (name + '__' + group).replace(/\s+/g, '_');
  try { var r = localStorage.getItem(key); return r ? JSON.parse(r) : null; } catch(e) { return null; }
}

function restoreSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  var saved = loadSession(name, group);
  if (!saved) return;
  document.getElementById('restoreBar').style.display = 'none';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = currentAttempt(name, group);
  buildLesson(seededRng(name + group + att));
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
  saved.choices.forEach(function(choice, idx) {
    if (choice !== null && choice !== undefined) confirmMC(idx, choice);
  });
  setTimeout(function() {
    if (saved.drawings) {
      saved.drawings.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var dc = document.getElementById('dc' + i);
        if (!dc || !dc.width) return;
        var img = new Image();
        img.onload = function() {
          var dpr = window.devicePixelRatio || 1;
          dc.getContext('2d').drawImage(img, 0, 0, dc.width / dpr, dc.height / dpr);
        };
        img.src = dataUrl;
      });
    }
    if (saved.texts) {
      saved.texts.forEach(function(text, i) {
        if (!text) return;
        var ta = document.getElementById('ta' + i);
        if (ta) ta.value = text;
      });
    }
    if (saved.photos) {
      saved.photos.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var pp = document.getElementById('pp' + i);
        if (!pp) return;
        pp.src = dataUrl; pp.style.display = 'block';
        var pz = document.getElementById('pz' + i);
        if (pz) pz.style.opacity = '0.4';
      });
    }
  }, 300);
}

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

  }, { threshold: 0.05 });

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = DRAW_PALETTE[0];   // matches the first (selected) dot = SCHOOL.primary
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER - two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm - used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

async function generatePDF() {
  var btn = document.getElementById('dlBtn');
  btn.textContent = 'Generando PDF…';
  btn.disabled = true;

  var jspdf   = window.jspdf;
  var doc     = new jspdf.jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });
  var PW      = 215.9;
  var M       = 18;
  var TW      = PW - M * 2;
  var PH      = doc.internal.pageSize.height;
  var name    = studentData.name;
  var group   = studentData.group;
  var total   = problems.length;
  var pct     = Math.round(correctCount / total * 100);
  var dateStr = new Date().toLocaleString('es-MX', { dateStyle:'long', timeStyle:'short' });

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS - INJECTION BLOCK ─────────────────────────────────────────
  //   Match these RGB values to --green and --gold above.
  //   PRIMARY  → pBR, pBG, pBB
  //   ACCENT   → pAR, pAG, pAB
  // ──────────────────────────────────────────────────────────────────────────
  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;  // PRIMARY (from SCHOOL, Rule 16)
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;   // ACCENT (from SCHOOL, Rule 16)

  function pdfText(html) {
    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/\u2192/g,'->').replace(/\u2212/g,'-').replace(/\u00b2/g,'^2')
      .replace(/\u00b3/g,'^3').replace(/\u00d7/g,'x').replace(/\u00f7/g,'/')
      .replace(/\u2260/g,'!=').replace(/\u2264/g,'<=').replace(/\u2265/g,'>=')
      .replace(/\u221a/g,'sqrt').replace(/\u03c0/g,'pi').replace(/\u2026/g,'...')
      .replace(/\s+/g,' ').trim();
  }

  // ── PORTADA: orange line / white logo strip / orange line / blue band ──
  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,2,'F');   // top accent line
  doc.setFillColor(255,255,255); doc.rect(0,2,PW,26,'F');                               // white logo strip
  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,28,PW,2,'F');  // bottom accent line
  doc.setFillColor(pBR,pBG,pBB); doc.rect(0,30,PW,34,'F');       // blue header band

  // ── PDF LOGO INJECTION BLOCK ─────────────────────────────────────────────
  //   When injecting logos, replace the two placeholder lines below with:
  //     var logoLeftB64  = 'data:image/png;base64,...';   // from LOGOS_MASTER.HTML
  //     var logoRightB64 = 'data:image/png;base64,...';   // from LOGOS_MASTER.HTML

  doc.lines([[2.57-1.03,4.63-6.17],[4.11-2.57,5.14-4.63],[5.66-4.11,2.57-5.14]], lx+1.03, ly+6.17);

  // ── SAVE / SHARE - iOS-safe download (LIAXA iOS PDF fix, Rule 12) ─────────
  //   iOS Safari ignores the <a download> attribute (and doc.save() relies on
  //   it), so on iPhone/iPad a plain download fails silently. We branch:
  //     • iOS  → native share sheet (→ "Save to Files"); if unavailable, open
  //              the PDF inline so the student can tap Safari's own Share.
  //     • else → <a download> click (works on desktop + Android).
  //   The whole function runs synchronously off the tap (no await above), which
  //   is what lets iOS accept navigator.share(). Do NOT add an await before this.
  // ──────────────────────────────────────────────────────────────────────────
  var _fname   = 'cneyt3_t05_g01_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf';
  var _pdfBlob = doc.output('blob');

  function _restorePdfBtn(){ btn.innerHTML = '⬇ &nbsp;' + t('btn-pdf'); btn.disabled = false; }
  function _openPdfInline(b){
    var u = URL.createObjectURL(b);
    var w = window.open(u, '_blank');
    if (!w) { window.location.href = u; }   // popup blocked → same tab
    setTimeout(function(){ URL.revokeObjectURL(u); }, 60000);
  }

  // iPadOS 13+ reports as "MacIntel" with a touch screen, so test for that too.
  var _isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
               (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  if (_isIOS) {
    var _pdfFile = new File([_pdfBlob], _fname, { type:'application/pdf' });
    if (navigator.canShare && navigator.canShare({ files:[_pdfFile] })) {
      navigator.share({ files:[_pdfFile], title:_fname })
        .then(_restorePdfBtn)
        .catch(function(e){
          if (e && e.name === 'AbortError') { _restorePdfBtn(); return; } // cancelled
          _openPdfInline(_pdfBlob); _restorePdfBtn();
        });
      return;
    }
    _openPdfInline(_pdfBlob); _restorePdfBtn();   // older iOS: open inline
    return;
  }

  // Desktop + Android: the native download works.
  var _dlUrl = URL.createObjectURL(_pdfBlob);
  var _dlA   = document.createElement('a');
  _dlA.href  = _dlUrl; _dlA.download = _fname;
  document.body.appendChild(_dlA); _dlA.click();
  setTimeout(function(){ document.body.removeChild(_dlA); URL.revokeObjectURL(_dlUrl); }, 200);
  _restorePdfBtn();
}

/* ================================================
   buildLesson - OVERRIDE IN EACH GUIDE
   ================================================ */
function buildLesson(rng) {
  var LB = document.getElementById('lessonBody');
  LB.innerHTML = '';
  problems = [];

  var VSRC = 12;                 /* fuente fija del banco de resistores, en volts */

  /* ---------------- helpers ---------------- */
  function T(o){
    if (o === undefined || o === null) return '';
    if (typeof o === 'string' || typeof o === 'number') return o;
    if (Object.prototype.toString.call(o) === '[object Array]') return o;
    return (o[LANG] !== undefined ? o[LANG] : o.es);
  }
  function pk(a){ return a[Math.floor(rng()*a.length)]; }
  function shufA(a){
    var b = a.slice(), i, j, t;
    for (i=b.length-1;i>0;i--){ j=Math.floor(rng()*(i+1)); t=b[i]; b[i]=b[j]; b[j]=t; }
    return b;
  }
  function rd(x,d){ var p = Math.pow(10,d); return Math.round(x*p)/p; }
  function num(x,d){
    var r = rd(x,d);
    if (Math.abs(r) < 1e-9) r = 0;
    return (r < 0 ? '−' : '') + String(Math.abs(r));
  }
  function fA(x){ return num(x,3)+' A'; }
  function fO(x){ return num(x,2)+' Ω'; }
  function fW(x){ return num(x,2)+' W'; }
  function fV(x){ return num(x,2)+' V'; }
  function fB(x){ return num(x,2)+' µT'; }
  function fN(x){ return num(x,3)+' N'; }
  function fKWH(x){ return num(x,3)+' kWh'; }
  function fKJ(x){ return num(x,2)+' kJ'; }
  function frac(a,b){
    return '<span class="mf-outer"><span class="mf-num">'+a+'</span><span class="mf-den">'+b+'</span></span>';
  }
  function sec(tag,title,html){
    var d = document.createElement('div');
    d.className = 'section';
    d.innerHTML = '<div class="stag">'+tag+'</div><h2>'+title+'</h2>'+(html||'');
    LB.appendChild(d);
    return d;
  }
  function widget(kind){
    var d = document.createElement('div');
    d.className = kind + 'wrap section';
    d.setAttribute('data-widget', kind);
    d.id = 'w_' + kind;
    LB.appendChild(d);
    return d;
  }
  function rcard(name, form, note){
    return '<div class="rcard"><div class="rname">'+name+'</div><div class="rform">'+form+
           '</div><div class="rnote">'+note+'</div></div>';
  }
  /* 4 cadenas distintas: el valor correcto primero, luego los valores que
     producen las confusiones típicas y, si alguno colapsa, un reparto de respaldo */
  function optsFrom(correct, wrongs, fmt, positive){
    var strs = [fmt(correct)], i, s;
    for (i=0;i<wrongs.length && strs.length<4;i++){
      if (!isFinite(wrongs[i])) continue;
      if (positive && wrongs[i] <= 0) continue;
      s = fmt(wrongs[i]);
      if (strs.indexOf(s) === -1) strs.push(s);
    }
    var k = 1, base = Math.abs(correct) > 1e-9 ? Math.abs(correct) : 1;
    while (strs.length < 4 && k < 40){
      var cand = correct + (k % 2 === 0 ? 1 : -1) * base * (0.19 + 0.13*k);
      k++;
      if (positive && cand <= 0) continue;
      s = fmt(cand);
      if (strs.indexOf(s) === -1) strs.push(s);
    }
    return { options: strs, correct: strs[0] };
  }
  function addProb(spec){
    var so  = shufA(T(spec.options));
    var cor = T(spec.correct);
    problems.push({
      title: T(spec.title),
      questionText: T(spec.q),
      fn: T(spec.fn) || '',
      hint: T(spec.hint),
      explanation: T(spec.exp),
      options: so,
      correctIdx: so.indexOf(cor),
      showWork: !!spec.showWork,
      studentChoice: null,
      pendingChoice: null
    });

  /* ============================================================
     BANCOS DE DATOS
     ============================================================ */

    return { a:a, b:t[0], c:t[1], p:t[2], Req:a+t[2] }; })();

  sec(T({es:'Idea 1', en:'Idea 1'}),

        es:'La corriente eléctrica es el desplazamiento ordenado de portadores de carga dentro de un conductor. Su intensidad se define como la cantidad de carga que atraviesa una sección transversal del conductor en cada unidad de tiempo, y se expresa en amperes: un ampere equivale a un coulomb por segundo. Mientras no exista una diferencia de potencial entre los extremos del alambre, los electrones libres se agitan en todas direcciones y el transporte neto de carga es nulo.',
        en:'Electric current is the ordered displacement of charge carriers inside a conductor. Its intensity is defined as the amount of charge crossing a cross-section of the conductor in each unit of time, and it is expressed in amperes: one ampere equals one coulomb per second. As long as no potential difference exists between the ends of the wire, free electrons jitter in every direction and the net transport of charge is zero.'

      { es:'Estirar la bobina al doble de longitud sin agregar espiras', en:'Stretching the coil to twice its length without adding turns', bin:1 }
    ];
    var st = { i:0, tries:0, ok:0, done:false };
    function render(){
      if (st.done){
        wrap.innerHTML = '<div class="iw-tag">'+T({es:'Ajustes al electroimán', en:'Adjustments to the electromagnet'})+'</div>'+
          '<div class="cls-done">🎉 '+st.ok+' / '+w4SEQ.length+'</div>';
        return;
      }
      var it = ITEMS[w4SEQ[st.i]];
      wrap.innerHTML =
        '<div class="iw-tag">'+T({es:'Ajustes al electroimán', en:'Adjustments to the electromagnet'})+'</div>'+
        '<div class="iw-sub">'+T({
          es:'Un electroimán sostiene tornillos mientras circula corriente. Decide qué provoca cada modificación en el campo de su interior.',
          en:'An electromagnet holds screws while current flows. Decide what each modification does to the field inside it.'
        })+'</div>'+
        '<div class="iwbox">'+
          '<div class="cls-prog">'+(st.i+1)+' / '+w4SEQ.length+'</div>'+
          '<div class="cls-card">'+it[LANG]+'</div>'+
          '<div class="cls-bins">'+ BINS.map(function(b,bi){
              return '<button class="cls-bin" onclick="w4Pick('+bi+')">'+b+'</button>';
            }).join('') +'</div>'+
          '<div class="rfb" id="w4fb"></div>'+
        '</div>';
    }
    function advance(){
      st.tries = 0; st.i++;
      if (st.i >= w4SEQ.length) st.done = true;
      render();
    }
    window.w4Pick = function(bi){
      var it = ITEMS[w4SEQ[st.i]], fb = document.getElementById('w4fb');
      if (bi === it.bin){
        st.ok++;
        fb.innerHTML = '<span class="okmsg">✓ '+BINS[it.bin]+'</span>';
        setTimeout(advance, 700);
        return;
      }
      st.tries++;
      if (st.tries >= 3){
        fb.innerHTML = T({es:'Correspondía a <b>', en:'It belonged to <b>'})+BINS[it.bin]+'</b>.';
        setTimeout(advance, 1600);
        return;
      }
      fb.textContent = T({
        es:'Vuelve a intentarlo: pregúntate si ese cambio modifica la corriente, la densidad de espiras o solamente el sentido del giro.',
        en:'Try again: ask yourself whether that change alters the current, the density of turns or only the turning sense.'
      });
    };
    render();
  })();

  /* ---- problema 7 ---- */
  if (p7v === 0){
    var o7 = optsFrom(p7.F, [p7.B*p7.I/p7.L, p7.B*p7.I, 2*p7.F, p7.I*p7.L], fN, true);
    addProb({
      title:{es:'Fuerza sobre el tramo conductor', en:'Force on the conducting segment'},
      q:{es:'Un tramo recto de '+num(p7.L,2)+' m de conductor transporta una corriente de '+p7.I+' A y se coloca perpendicular a un campo magnético uniforme de '+num(p7.B,2)+' T. Determina la magnitud de la fuerza que experimenta.',
         en:'A straight segment of conductor '+num(p7.L,2)+' m long carries a current of '+p7.I+' A and is placed perpendicular to a uniform magnetic field of '+num(p7.B,2)+' T. Determine the magnitude of the force it experiences.'},
      fn:'B = '+num(p7.B,2)+' T · I = '+p7.I+' A · L = '+num(p7.L,2)+' m',
      hint:{es:'Con el conductor perpendicular al campo, la fuerza es el producto F = B · I · L, con B en teslas, I en amperes y L en metros.',
            en:'With the conductor perpendicular to the field, the force is the product F = B · I · L, with B in teslas, I in amperes and L in metres.'},
      exp:{es:'F = '+num(p7.B,2)+' · '+p7.I+' · '+num(p7.L,2)+' = '+fN(p7.F)+'. Dividir entre la longitud, en lugar de multiplicar, agranda el resultado sin justificación.',
           en:'F = '+num(p7.B,2)+' · '+p7.I+' · '+num(p7.L,2)+' = '+fN(p7.F)+'. Dividing by the length instead of multiplying inflates the result with no justification.'},
      options:o7.options, correct:o7.correct, showWork:true
    });
  } else {
    var o7b = optsFrom(p7.I, [p7.F*p7.B*p7.L, p7.F/p7.B, p7.B*p7.L/p7.F, p7.I/2], fA, true);
    addProb({
      title:{es:'Corriente que sostiene la fuerza', en:'Current behind the force'},
      q:{es:'Un tramo recto de '+num(p7.L,2)+' m de conductor, perpendicular a un campo magnético uniforme de '+num(p7.B,2)+' T, experimenta una fuerza de '+num(p7.F,3)+' N. Determina la intensidad de corriente que lo recorre.',
         en:'A straight segment of conductor '+num(p7.L,2)+' m long, perpendicular to a uniform magnetic field of '+num(p7.B,2)+' T, experiences a force of '+num(p7.F,3)+' N. Determine the current running through it.'},
      fn:'F = '+num(p7.F,3)+' N · B = '+num(p7.B,2)+' T · L = '+num(p7.L,2)+' m',
      hint:{es:'Parte de F = B · I · L y despeja la corriente: I = F / (B · L).',
            en:'Start from F = B · I · L and solve for the current: I = F / (B · L).'},
      exp:{es:'I = '+frac(num(p7.F,3), num(p7.B,2)+' · '+num(p7.L,2))+' = '+fA(p7.I)+'. Multiplicar los tres datos, en vez de dividir, deja un valor mucho menor que el real.',
           en:'I = '+frac(num(p7.F,3), num(p7.B,2)+' · '+num(p7.L,2))+' = '+fA(p7.I)+'. Multiplying the three data instead of dividing leaves a value far below the real one.'},
      options:o7b.options, correct:o7b.correct, showWork:true
    });
  }

  /* ---- problema 8 ---- */
  if (p8v === 0){
    var op8 = T({es:['Salen del polo norte, entran por el polo sur y se cierran dentro del imán',
                     'Nacen en el polo norte y terminan en cualquier punto del espacio vacío',
                     'Se cruzan entre sí en las regiones donde el campo es más intenso',
                     'Son radiales y se alejan del imán en todas direcciones'],
                 en:['They leave the north pole, enter the south pole and close inside the magnet',
                     'They are born at the north pole and end at any point of empty space',
                     'They cross one another in the regions where the field is strongest',
                     'They are radial and move away from the magnet in every direction']});
    addProb({
      title:{es:'Trazado de las líneas de campo', en:'Layout of the field lines'},
      q:{es:'Se espolvorea limadura de hierro sobre una hoja colocada encima de un imán de barra y se dibuja el patrón obtenido. ¿Qué afirmación describe correctamente las líneas de campo de ese imán?',
         en:'Iron filings are sprinkled on a sheet placed over a bar magnet and the resulting pattern is drawn. Which statement correctly describes the field lines of that magnet?'},
      fn:'',
      hint:{es:'Las líneas de campo magnético son siempre curvas cerradas, sin principio ni final en el espacio, y su densidad indica la intensidad.',
            en:'Magnetic field lines are always closed curves, with no beginning or end in space, and their density indicates the intensity.'},
      exp:{es:'Por convenio las líneas salen del norte y entran por el sur en el exterior, y continúan dentro del material hasta cerrarse. Si se cruzaran, en ese punto el campo tendría dos direcciones distintas a la vez.',
           en:'By convention the lines leave the north and enter the south outside, and continue inside the material until they close. If they crossed, the field would have two different directions at that point at once.'},
      options:op8,
      correct:T({es:'Salen del polo norte, entran por el polo sur y se cierran dentro del imán',
                 en:'They leave the north pole, enter the south pole and close inside the magnet'}),
      showWork:false
    });
  } else {
    var op8b = T({es:['Aumentar el número de espiras por centímetro del devanado',
                      'Separar las espiras hasta duplicar la longitud del devanado',
                      'Sustituir el núcleo de hierro dulce por uno de madera',
                      'Intercambiar los bornes de la fuente que lo alimenta'],
                  en:['Increasing the number of turns per centimetre of the winding',
                      'Separating the turns until the winding doubles its length',
                      'Replacing the soft iron core with a wooden one',
                      'Swapping the terminals of the source that feeds it']});
    addProb({
      title:{es:'Un electroimán más intenso', en:'A stronger electromagnet'},
      q:{es:'Por el devanado de un electroimán circula una corriente que se mantiene constante durante la prueba. ¿Qué modificación produce un campo más intenso en su interior?',
         en:'A current that stays constant during the test flows through the winding of an electromagnet. Which modification produces a stronger field inside it?'},
      fn:'',
      hint:{es:'El campo de un solenoide crece con la corriente y con las espiras por unidad de longitud, y el núcleo ferromagnético lo multiplica.',
            en:'The field of a solenoid grows with the current and with the turns per unit length, and the ferromagnetic core multiplies it.'},
      exp:{es:'Apretar las espiras aumenta la densidad de vueltas y con ella el campo. Estirar el devanado la reduce, la madera no se magnetiza y cambiar los bornes solo intercambia los polos.',
           en:'Packing the turns raises the density of turns and with it the field. Stretching the winding lowers it, wood does not become magnetized and swapping the terminals only exchanges the poles.'},
      options:op8b,
      correct:T({es:'Aumentar el número de espiras por centímetro del devanado',
                 en:'Increasing the number of turns per centimetre of the winding'}),
      showWork:false
    });
  }

  /* ---- MANIPULATIVO 5: trazo libre ---- */
  (function(){
    var PROMPTS = [
      { es:'Dibuja el circuito de una lámpara alimentada por una pila y señala dónde se conecta el voltímetro y dónde el amperímetro.',
        en:'Sketch the circuit of a lamp fed by a battery and mark where the voltmeter and the ammeter are connected.' },
      { es:'Traza las líneas de campo de un imán de barra y explica, con tus palabras, por qué nunca se cruzan.',
        en:'Draw the field lines of a bar magnet and explain, in your own words, why they never cross.' },
      { es:'Explica qué le ocurre a la corriente total de un circuito cuando se agrega un resistor en serie y qué le ocurre cuando se agrega en paralelo.',
        en:'Explain what happens to the total current of a circuit when a resistor is added in series and what happens when it is added in parallel.' }
    ];
    var pickP = PROMPTS[Math.floor(rng()*PROMPTS.length)];
    var wrap = widget('reflect');
    wrap.innerHTML =
      '<div class="iw-tag">'+T({es:'Cuaderno de trabajo', en:'Working notebook'})+'</div>'+
      '<div class="reflect-prompt">'+pickP[LANG]+'</div>'+
      '<div class="wtabs">'+
        '<button class="wtab active" onclick="rfTab(\'type\',this)">'+T({es:'⌨️ Escribir', en:'⌨️ Write'})+'</button>'+
        '<button class="wtab" onclick="rfTab(\'draw\',this)">'+T({es:'✏️ Dibujar', en:'✏️ Sketch'})+'</button>'+
      '</div>'+
      '<div class="wpanel active" id="rf_type"><textarea class="wtextarea" id="rfTa" placeholder="'+T({es:'Tu respuesta...', en:'Your answer...'})+'"></textarea></div>'+
      '<div class="wpanel" id="rf_draw"><div class="cvwrap">'+
        '<canvas class="dcanvas" id="rfCv"></canvas>'+
        '<div class="ctoolbar">'+
          '<button class="tbtn2 bpen on">'+t('btn-pen')+'</button>'+
          '<button class="tbtn2 bmarker">'+t('btn-marker')+'</button>'+
          '<button class="tbtn2 beraser">'+t('btn-eraser')+'</button>'+
          drawDotsHTML()+
          '<button class="clrbtn">'+t('btn-clear')+'</button>'+
        '</div>'+
      '</div></div>'+
      '<button class="rverify-btn" onclick="rfSave()">'+T({es:'Guardar', en:'Save'})+'</button>'+
      '<div class="rfb" id="rfFb"></div>';
    window.rfTab = function(which, btn){
      ['type','draw'].forEach(function(k){
        document.getElementById('rf_'+k).classList.toggle('active', k === which);
      });
      wrap.querySelectorAll('.wtab').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      if (which === 'draw') setTimeout(function(){
        var c = document.getElementById('rfCv');
        if (c && !c.width) initCanvas(c);
      }, 60);
    };
    window.rfSave = function(){
      document.getElementById('rfFb').innerHTML = '<span class="okmsg">✓ '+T({
        es:'Guardado. Este trazo te servirá de referencia al resolver los planteamientos que siguen.',
        en:'Saved. This sketch will serve as a reference while you work through what follows.'
      })+'</span>';
    };
  })();

  /* ============================================================
     CIERRE
     ============================================================ */
  sec(T({es:'Cierre', en:'Closing'}),
      T({es:'Integración', en:'Integration'}), '');

  /* ---- problema 9 ---- */
  if (p9v === 0){
    var o9 = optsFrom(p9a.E,
      [(p9a.V/p9a.R)*p9a.h, p9a.P*p9a.h/100, p9a.P*p9a.h/2000, p9a.P*p9a.h/500], fKWH, true);
    addProb({
      title:{es:'Consumo del calentador', en:'Consumption of the heater'},
      q:{es:'Un calentador con una resistencia de '+p9a.R+' Ω permanece conectado a una línea de '+p9a.V+' V durante '+p9a.h+' horas seguidas. Determina la energía eléctrica que consume, expresada en kilowatt hora.',
         en:'A heater with a resistance of '+p9a.R+' Ω stays connected to a '+p9a.V+' V line for '+p9a.h+' straight hours. Determine the electrical energy it consumes, expressed in kilowatt hours.'},
      fn:'V = '+p9a.V+' V · R = '+p9a.R+' Ω · t = '+p9a.h+' h',
      hint:{es:'Calcula la potencia con P = V² / R, conviértela a kilowatts dividiendo entre mil y multiplícala por las horas de funcionamiento.',
            en:'Compute the power with P = V² / R, convert it to kilowatts by dividing by one thousand and multiply it by the hours of operation.'},
      exp:{es:'P = '+frac(p9a.V+'²', p9a.R)+' = '+fW(p9a.P)+', es decir '+num(p9a.P/1000,3)+' kW, y en '+p9a.h+' h la energía es '+fKWH(p9a.E)+'. Multiplicar watts por horas sin convertir a kilowatts deja el resultado mil veces mayor.',
           en:'P = '+frac(p9a.V+'²', p9a.R)+' = '+fW(p9a.P)+', that is '+num(p9a.P/1000,3)+' kW, and over '+p9a.h+' h the energy is '+fKWH(p9a.E)+'. Multiplying watts by hours without converting to kilowatts leaves the result one thousand times larger.'},
      options:o9.options, correct:o9.correct, showWork:true
    });
  } else {
    var o9b = optsFrom(p9b.E,
      [p9b.V*p9b.I*p9b.min/1000, p9b.V*p9b.I*60/1000, p9b.E*2, p9b.E/60], fKJ, true);
    addProb({
      title:{es:'Energía entregada al motor', en:'Energy delivered to the motor'},
      q:{es:'Un motor pequeño conectado a '+p9b.V+' V demanda una corriente de '+p9b.I+' A y trabaja sin pausa durante '+p9b.min+' minutos. Determina la energía eléctrica que recibe, expresada en kilojoules.',
         en:'A small motor connected to '+p9b.V+' V draws a current of '+p9b.I+' A and runs without pause for '+p9b.min+' minutes. Determine the electrical energy it receives, expressed in kilojoules.'},
      fn:'V = '+p9b.V+' V · I = '+p9b.I+' A · t = '+p9b.min+' min',
      hint:{es:'Obtén la potencia con P = V · I y multiplícala por el tiempo en segundos; cada mil joules equivalen a un kilojoule.',
            en:'Get the power with P = V · I and multiply it by the time in seconds; every thousand joules make one kilojoule.'},
      exp:{es:'P = '+p9b.V+' V · '+p9b.I+' A = '+fW(p9b.V*p9b.I)+' y t = '+(p9b.min*60)+' s, de modo que E = '+fKJ(p9b.E)+'. Dejar el tiempo en minutos reduce el resultado sesenta veces.',
           en:'P = '+p9b.V+' V · '+p9b.I+' A = '+fW(p9b.V*p9b.I)+' and t = '+(p9b.min*60)+' s, so E = '+fKJ(p9b.E)+'. Leaving the time in minutes shrinks the result sixty times.'},
      options:o9b.options, correct:o9b.correct, showWork:true
    });
  }

  /* ---- problema 10 ---- */
  if (p10v === 0){
    var o10 = optsFrom(p10a.F,
      [p10a.B*p10a.V*p10a.L, p10a.B*p10a.I, p10a.I*p10a.L, p10a.F/2], fN, true);
    addProb({
      title:{es:'Del circuito a la fuerza sobre la barra', en:'From the circuit to the force on the bar'},
      q:{es:'Una barra conductora de '+num(p10a.L,2)+' m forma parte de un circuito alimentado por '+p10a.V+' V cuya resistencia total es de '+p10a.R+' Ω. La barra queda perpendicular a un campo magnético uniforme de '+num(p10a.B,2)+' T. Determina la magnitud de la fuerza que actúa sobre ella.',
         en:'A conducting bar '+num(p10a.L,2)+' m long is part of a circuit fed by '+p10a.V+' V whose total resistance is '+p10a.R+' Ω. The bar sits perpendicular to a uniform magnetic field of '+num(p10a.B,2)+' T. Determine the magnitude of the force acting on it.'},
      fn:'V = '+p10a.V+' V · R = '+p10a.R+' Ω · B = '+num(p10a.B,2)+' T · L = '+num(p10a.L,2)+' m',
      hint:{es:'Primero obtén la corriente del circuito con I = V / R y después aplica F = B · I · L al tramo inmerso en el campo.',
            en:'First obtain the circuit current with I = V / R and then apply F = B · I · L to the segment immersed in the field.'},
      exp:{es:'I = '+frac(p10a.V, p10a.R)+' = '+fA(p10a.I)+' y F = '+num(p10a.B,2)+' · '+num(p10a.I,2)+' · '+num(p10a.L,2)+' = '+fN(p10a.F)+'. Usar el voltaje en lugar de la corriente confunde dos magnitudes distintas.',
           en:'I = '+frac(p10a.V, p10a.R)+' = '+fA(p10a.I)+' and F = '+num(p10a.B,2)+' · '+num(p10a.I,2)+' · '+num(p10a.L,2)+' = '+fN(p10a.F)+'. Using the voltage instead of the current confuses two different quantities.'},
      options:o10.options, correct:o10.correct, showWork:true
    });
  } else {
    var o10b = optsFrom(p10b.B,
      [20*p10b.V/p10b.d, 20*p10b.I*p10b.d, 20*p10b.d/p10b.I, p10b.B/2], fB, true);
    addProb({
      title:{es:'Del circuito al campo del alambre', en:'From the circuit to the field of the wire'},
      q:{es:'Un alambre rectilíneo y largo se alimenta con una fuente de '+p10b.V+' V a través de una resistencia total de '+p10b.R+' Ω. Determina la magnitud del campo magnético en un punto situado a '+p10b.d+' cm del alambre.',
         en:'A long straight wire is fed by a '+p10b.V+' V source through a total resistance of '+p10b.R+' Ω. Determine the magnitude of the magnetic field at a point '+p10b.d+' cm from the wire.'},
      fn:'V = '+p10b.V+' V · R = '+p10b.R+' Ω · r = '+p10b.d+' cm',
      hint:{es:'Obtén primero la corriente con I = V / R y aplícala después en B = 2×10⁻⁷ · I / r, con la distancia en metros.',
            en:'Obtain the current first with I = V / R and then use it in B = 2×10⁻⁷ · I / r, with the distance in metres.'},
      exp:{es:'I = '+frac(p10b.V, p10b.R)+' = '+fA(p10b.I)+' y, con r = '+num(p10b.d/100,2)+' m, B = '+fB(p10b.B)+'. Entrar a la segunda expresión con el voltaje, y no con la corriente, altera el resultado por completo.',
           en:'I = '+frac(p10b.V, p10b.R)+' = '+fA(p10b.I)+' and, with r = '+num(p10b.d/100,2)+' m, B = '+fB(p10b.B)+'. Entering the second expression with the voltage instead of the current changes the result completely.'},
      options:o10b.options, correct:o10b.correct, showWork:true
    });
  }
}
</script>

<!-- LIAXA ANALYTICS -->
<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbykkuJ_apGq3vALIFd4mr3acu81c7K4OKxW-DZ-i52Ceyl3lOanXMdvbS9SIXPrLQBm/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'Electricidad y Magnetismo Básico';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
