function detRender(){
  if (!DET) return;
  var box = document.getElementById('detBox');
  if (!box) return;
  var names = DET_BINS[LANG];
  var tal = '<div class="chips">' + names.map(function(b, k){
    return '<div class="chip used">' + b + ': ' + DET.tally[k] + '</div>';
  }).join('') + '</div>';
  if (DET.done) {
    box.innerHTML = tal +
      '<div class="wmsg ok">' + S('Tablero completo. Los tres montones piden respuestas distintas: lo que discrimina se corrige, lo que nivela se sostiene mientras dure la desventaja, y lo que se explica por la tarea se deja como está.',
                                  'Board complete. The three piles call for different answers: what discriminates gets corrected, what levels is kept while the disadvantage lasts, and what the task explains is left as it is.') + '</div>';
    return;
  }
  var it = DET.items[DET.order[DET.i]];
  var msg = DET.note || S('Pregúntate primero: lo que se pide, ¿tiene relación con la tarea, con la seguridad o con corregir una desventaja anterior?',
                          'Ask yourself first: what is being asked, does it relate to the task, to safety, or to correcting an earlier disadvantage?');
  box.innerHTML =
    '<div class="wcase">' + it[LANG] + '</div>' +
    '<div class="chips">' + names.map(function(b, k){
        return '<div class="chip" onclick="detPick(' + k + ')">' + b + '</div>';
      }).join('') + '</div>' +
    tal +
    '<div class="wmsg ' + (DET.note ? (DET.noteOk ? 'ok' : 'warn') : '') + '">' + msg + '</div>' +
    '<div class="wprog">' + (DET.i + 1) + ' / ' + DET.items.length + '</div>';
}

function detPick(k){
  if (!DET || DET.done) return;
  var it = DET.items[DET.order[DET.i]];
  if (k === it.bin) {
    DET.tally[k]++; DET.tries = 0; DET.noteOk = true;
    DET.note = S('Así es. ' + it.wes, 'That is it. ' + it.wen);
    DET.i++;
    if (DET.i >= DET.items.length) DET.done = true;
    detRender();
    return;
  }
  DET.tries++;
  if (DET.tries >= 3) {
    DET.tally[it.bin]++; DET.tries = 0; DET.noteOk = false;
    DET.note = S('Este caso iba en ' + DET_BINS.es[it.bin] + '. ' + it.wes,
                 'This case belonged in ' + DET_BINS.en[it.bin] + '. ' + it.wen);
    DET.i++;
    if (DET.i >= DET.items.length) DET.done = true;
    detRender();
    return;
  }
  DET.noteOk = false;
  if (k === 0) {
    DET.note = S('Todavía no. Antes de llamarlo discriminación, revisa si lo que se pide se relaciona con la tarea o si busca corregir una desventaja que ya existía.',
                 'Not yet. Before calling it discrimination, check whether what is asked relates to the task or seeks to correct a disadvantage that already existed.');
  } else if (k === 1) {
    DET.note = S('Todavía no. Una medida que nivela existe para corregir una desventaja anterior: pregúntate qué desventaja se estaría corrigiendo aquí.',
                 'Not yet. A leveling measure exists to correct an earlier disadvantage: ask yourself which disadvantage would be corrected here.');
  } else {
    DET.note = S('Todavía no. Una distinción justificada usa un criterio ligado a la tarea o a la seguridad: mira si la característica que se usa tiene que ver con lo que se pide.',
                 'Not yet. A justified distinction uses a criterion tied to the task or to safety: look at whether the characteristic used has anything to do with what is asked.');
  }
  detRender();
}

/* ================================================
   WIDGET 2 - ARMA EL JUICIO (secuenciador)
   The six moves of an ethical judgment arrive scrambled; two taps swap them.
   A failed check names the first move out of place and asks what has to be
   settled before it. The third failed check lays the reasoning out (Rule 8, A).
   ================================================ */
var JUI = null;
function buildJuicio(rng){
  var pools = [
    { t:{ es:'Caso: una convocatoria que deja fuera', en:'Case: a call for entries that shuts people out' },
      steps:[
        { es:'Describe el hecho sin adjetivos: qué se pidió, quién lo pidió y a quién dejó fuera.',
          en:'Describe the fact with no adjectives: what was asked, who asked it and who was left out.' },
        { es:'Nombra el derecho que queda tocado y a quién afecta.',
          en:'Name the right that is touched and who it affects.' },
        { es:'Revisa si la característica que se usó tiene relación con lo que se pide.',
          en:'Check whether the characteristic used has any relation to what is asked for.' },
        { es:'Contrasta el hecho con los principios de dignidad, igualdad e inclusión.',
          en:'Contrast the fact with the principles of dignity, equality and inclusion.' },
        { es:'Formula el juicio y escribe las razones que lo sostienen.',
          en:'State the judgment and write down the reasons that hold it up.' },
        { es:'Propón una acción que corrija lo ocurrido y deja quién la revisa y cuándo.',
          en:'Propose an action that corrects what happened and set who reviews it and when.' } ] },
    { t:{ es:'Caso: una regla que no nombra a nadie', en:'Case: a rule that names nobody' },
      steps:[
        { es:'Describe la regla tal como está escrita, sin suponer intenciones.',
          en:'Describe the rule exactly as written, without assuming intentions.' },
        { es:'Observa a quién deja fuera en los hechos, aunque el texto no lo diga.',
          en:'Look at who it leaves out in practice, even if the text does not say so.' },
        { es:'Pregunta si esa exclusión guarda relación con la finalidad de la regla.',
          en:'Ask whether that exclusion has anything to do with the purpose of the rule.' },
        { es:'Compara el efecto de la regla con el principio de igualdad sustantiva.',
          en:'Compare the effect of the rule with the principle of substantive equality.' },
        { es:'Formula el juicio con razones que otra persona pueda revisar.',
          en:'State the judgment with reasons another person can review.' },
        { es:'Propón el ajuste concreto y fija la fecha en que se comprobará.',
          en:'Propose the concrete adjustment and set the date on which it will be checked.' } ] }
  ];
  var P = pools[Math.floor(rng() * pools.length)];
  JUI = { pool:P, order:shufflePerm(P.steps.length, rng), sel:null, tries:0, done:false, msg:null, msgOk:false };
  return '<div class="wgt" data-widget="timeline" id="wJuicio">' +
      wgtHead(S('Arma el juicio','Assemble the judgment'),
              S('Los pasos llegaron revueltos. Selecciona dos pasos para intercambiarlos hasta que el razonamiento se sostenga.',
                'The steps arrived scrambled. Select two steps to swap them until the reasoning holds together.')) +
      '<div id="juiBox"></div>' +
    '</div>';
}

function juiRender(){
  if (!JUI) return;
  var box = document.getElementById('juiBox');
  if (!box) return;
  var chips = JUI.order.map(function(si, pos){
    var cls = 'tl-chip' + (JUI.sel === pos ? ' sel' : '') + (JUI.done ? ' locked' : '');
    return '<div class="' + cls + '" onclick="juiTap(' + pos + ')"><span class="tl-num">' + (pos + 1) + '</span> ' + JUI.pool.steps[si][LANG] + '</div>';
  }).join('');
  var msg = JUI.msg || S('Un juicio ético se sostiene cuando cada paso deja lista la información que necesita el siguiente.',
                         'An ethical judgment holds when each step leaves ready the information the next one needs.');
  box.innerHTML =
    '<div class="colh">' + JUI.pool.t[LANG] + '</div>' +
    '<div class="tl-list">' + chips + '</div>' +
    (JUI.done ? '' : '<button class="wbtn" onclick="juiCheck()">' + S('Comprobar el razonamiento','Check the reasoning') + '</button>') +
    '<div class="wmsg ' + (JUI.msgOk ? 'ok' : (JUI.msg ? 'warn' : '')) + '">' + msg + '</div>';
}

function juiTap(pos){
  if (!JUI || JUI.done) return;
  if (JUI.sel === null) { JUI.sel = pos; }
  else if (JUI.sel === pos) { JUI.sel = null; }
  else {
    var t = JUI.order[JUI.sel]; JUI.order[JUI.sel] = JUI.order[pos]; JUI.order[pos] = t; JUI.sel = null;
  }
  juiRender();
}

function juiCheck(){
  if (!JUI || JUI.done) return;
  var ok = true, first = -1, i;
  for (i = 0; i < JUI.order.length; i++) if (JUI.order[i] !== i) { ok = false; if (first < 0) first = i; }
  if (ok) {
    JUI.done = true; JUI.msgOk = true;
    JUI.msg = S('Razonamiento armado. Nadie puede juzgar antes de describir lo que pasó, y ninguna propuesta se sostiene si no se sabe qué derecho hay que reparar.',
                'Reasoning assembled. Nobody can judge before describing what happened, and no proposal holds if you do not know which right must be repaired.');
    juiRender(); return;
  }
  JUI.tries++;
  if (JUI.tries >= 3) {
    JUI.order = JUI.pool.steps.map(function(_, k){ return k; });
    JUI.done = true; JUI.msgOk = false;
    JUI.msg = S('Este es el orden completo. Observa que describir viene antes de valorar, y que la propuesta llega al final, cuando ya hay razones que la expliquen.',
                'This is the full order. Notice that describing comes before valuing, and the proposal arrives last, once there are reasons that explain it.');
    juiRender(); return;
  }
  JUI.msgOk = false;
  JUI.msg = S('Todavía no. Mira el paso que ocupa el lugar ' + (first + 1) + ': ¿qué tendrías que tener resuelto antes de poder darlo?',
              'Not yet. Look at the step sitting in place ' + (first + 1) + ': what would you need settled before you could take it?');
  juiRender();
}

/* ================================================
   WIDGET 3 - DEBAJO DEL CASO (emparejador de dos columnas)
   A situation on the left, the barrier it reveals on the right. Selecting a
   situation and then a barrier locks the pair when it fits; a miss answers
   with what to look for. Third miss reveals that pair (Rule 8, A).
   ================================================ */
var EMP = null;
function buildEmparejador(rng){
  var pools = [
    [ { p:{ es:'En cada trabajo en equipo, las alumnas terminan escribiendo el reporte y los alumnos exponiéndolo.',
            en:'In every team task the girls end up writing the report and the boys presenting it.' },
        q:{ es:'Estereotipo de rol: la tarea se reparte por sexo y no por interés o habilidad.',
            en:'Role stereotype: the task is split by sex and not by interest or ability.' } },
      { p:{ es:'La beca deportiva exige entrenar sábado y domingo; casi ninguna alumna se inscribe porque cuida a sus hermanos.',
            en:'The sports grant demands training on Saturday and Sunday; almost no girl applies because she looks after her siblings.' },
        q:{ es:'Regla neutra con efecto desigual: el trabajo de cuidado recae sobre ellas.',
            en:'Neutral rule with unequal effect: the care work falls on them.' } },
      { p:{ es:'En la asamblea escolar, cada vez que una alumna toma la palabra se escuchan burlas y la interrumpen.',
            en:'In the school assembly, every time a girl takes the floor there are jeers and she is interrupted.' },
        q:{ es:'Barrera de participación: la palabra de unas pesa menos que la de otros.',
            en:'Participation barrier: the word of some counts for less than the word of others.' } },
      { p:{ es:'El taller de mecánica no tiene vestidor para alumnas y ninguna se ha inscrito.',
            en:'The mechanics workshop has no changing room for girls and none has enrolled.' },
        q:{ es:'Barrera material: falta la condición mínima para que el acceso sea real.',
            en:'Material barrier: the minimum condition for access to be real is missing.' } } ],
    [ { p:{ es:'El aviso de la asamblea se da por el altavoz y nadie lo escribe; un alumno sordo se entera al día siguiente.',
            en:'The assembly notice goes out over the loudspeaker and nobody writes it down; a deaf student finds out the next day.' },
        q:{ es:'Barrera de información: el mensaje viaja por un solo canal.',
            en:'Information barrier: the message travels through a single channel.' } },
      { p:{ es:'La entrada del laboratorio tiene tres escalones y una alumna usuaria de silla de ruedas recibe sus prácticas por escrito.',
            en:'The laboratory entrance has three steps and a student who uses a wheelchair receives her practicals in writing.' },
        q:{ es:'Barrera física: el espacio decide quién entra y quién se queda afuera.',
            en:'Physical barrier: the space decides who gets in and who stays outside.' } },
      { p:{ es:'Las instrucciones del examen están solo en español y el grupo que habla otra lengua reprueba mucho más.',
            en:'The exam instructions are only in Spanish and the group that speaks another language fails far more often.' },
        q:{ es:'Barrera de lengua: se evalúa el idioma antes que el conocimiento.',
            en:'Language barrier: the language gets assessed before the knowledge does.' } },
      { p:{ es:'Un alumno con discapacidad visual recibe el material impreso y trabaja aparte durante la práctica.',
            en:'A student with a visual disability gets printed material and works apart during the practical.' },
        q:{ es:'Barrera de formato: el mismo contenido llega en un soporte que él no puede usar.',
            en:'Format barrier: the same content arrives in a medium he cannot use.' } } ]
  ];
  var pairs = pools[Math.floor(rng() * pools.length)];
  EMP = { pairs:pairs, right:shufflePerm(pairs.length, rng), sel:null, solved:pairs.map(function(){ return false; }),
          tries:0, msg:null, msgOk:false };
  return '<div class="wgt" data-widget="match" id="wEmparejador">' +
      wgtHead(S('Debajo del caso','Underneath the case'),
              S('Selecciona una situación y después la barrera que revela. Si encaja, las dos quedan fijas.',
                'Select a situation and then the barrier it reveals. If it fits, both lock in place.')) +
      '<div id="empBox"></div>' +
    '</div>';
}

function empRender(){
  if (!EMP) return;
  var box = document.getElementById('empBox');
  if (!box) return;
  var left = EMP.pairs.map(function(pr, i){
    var cls = 'optbox' + (EMP.solved[i] ? ' done' : (EMP.sel === i ? ' sel' : ''));
    return '<div class="' + cls + '" onclick="empLeft(' + i + ')">' + pr.p[LANG] + '</div>';
  }).join('');
  var right = EMP.right.map(function(ri, pos){
    var cls = 'optbox' + (EMP.solved[ri] ? ' done' : '');
    return '<div class="' + cls + '" onclick="empRight(' + pos + ')">' + EMP.pairs[ri].q[LANG] + '</div>';
  }).join('');
  var done = EMP.solved.every(function(s){ return s; });
  var msg = EMP.msg || S('Una situación no se juzga por lo que parece, sino por la barrera que deja ver.',
                         'A situation is not judged by how it looks, but by the barrier it lets you see.');
  if (done && !EMP.msg) {
    msg = S('Todas emparejadas. Nombrar la barrera es lo que vuelve posible una propuesta: se corrige la barrera, no a la persona.',
            'All matched. Naming the barrier is what makes a proposal possible: you correct the barrier, not the person.');
  }
  box.innerHTML =
    '<div class="mcols">' +
      '<div><div class="colh">' + S('La situación','The situation') + '</div>' + left + '</div>' +
      '<div><div class="colh">' + S('La barrera que revela','The barrier it reveals') + '</div>' + right + '</div>' +
    '</div>' +
    '<div class="wmsg ' + (done || EMP.msgOk ? 'ok' : (EMP.msg ? 'warn' : '')) + '">' + msg + '</div>' +
    '<div class="wprog">' + EMP.solved.filter(function(s){ return s; }).length + ' / ' + EMP.pairs.length + '</div>';
}

function empLeft(i){
  if (!EMP || EMP.solved[i]) return;
  if (EMP.sel !== i) EMP.tries = 0;
  EMP.sel = (EMP.sel === i) ? null : i;
  EMP.msg = null; EMP.msgOk = false;
  empRender();
}

function empRight(pos){
  if (!EMP) return;
  var r = EMP.right[pos];
  if (EMP.solved[r]) return;
  if (EMP.sel === null) {
    EMP.msgOk = false;
    EMP.msg = S('Elige primero una situación de la columna izquierda.', 'Pick a situation from the left column first.');
    empRender(); return;
  }
  if (r === EMP.sel) {
    EMP.solved[r] = true; EMP.sel = null; EMP.tries = 0; EMP.msgOk = true;
    EMP.msg = S('Encaja. Con la barrera a la vista ya se puede decir qué hay que cambiar.',
                'It fits. With the barrier in view you can already say what needs changing.');
    empRender(); return;
  }
  EMP.tries++;
  if (EMP.tries >= 3) {
    var s = EMP.sel;
    EMP.solved[s] = true; EMP.sel = null; EMP.tries = 0; EMP.msgOk = false;
    EMP.msg = S('Esa situación revelaba esto: ' + EMP.pairs[s].q.es + ' Cuesta verlo porque nadie lo dice en voz alta.',
                'That situation revealed this: ' + EMP.pairs[s].q.en + ' It is hard to see because nobody says it out loud.');
    empRender(); return;
  }
  EMP.msgOk = false;
  EMP.msg = S('Esa no. Pregúntate qué tendría que cambiar para que esa persona pudiera participar igual que el resto.',
              'Not that one. Ask what would have to change for that person to take part like everyone else.');
  empRender();
}

/* ================================================
   WIDGET 4 - CONSTRUCTOR DE PROPUESTAS (medidores en vivo)
   Three measures out of six. Every tap moves three meters at once, so the
   student sees a measure that calms the complaint and leaves the barrier
   standing. A failed check names the meter that fell shortest and by how
   much; the third lays out a combination that clears all three (Rule 8, A).
   ================================================ */
var PRO = null;
function buildPropuesta(rng){
  var cases = [
    { caso:{ es:'En tu escuela, una alumna usuaria de silla de ruedas no puede llegar al laboratorio del segundo piso. Sus prácticas se las mandan por escrito y trabaja sola en la biblioteca.',
             en:'At your school, a student who uses a wheelchair cannot reach the laboratory on the second floor. Her practicals are sent to her in writing and she works alone in the library.' },
      m:[ { es:'Reubicar el laboratorio a la planta baja después de acordarlo con ella y con el grupo.',
            en:'Move the laboratory to the ground floor after agreeing it with her and with the group.', n:2, i:2, s:1 },
          { es:'Formar una comisión con ella, docentes y familias que revise cada mes qué espacios siguen sin ser accesibles.',
            en:'Set up a committee with her, teachers and families that reviews monthly which spaces are still not accessible.', n:1, i:2, s:2 },
          { es:'Instalar rampa y elevador con presupuesto asignado y una persona responsable del mantenimiento.',
            en:'Install a ramp and a lift with assigned budget and someone responsible for maintenance.', n:2, i:1, s:2 },
          { es:'Seguir enviándole las prácticas por escrito para que las resuelva desde su casa.',
            en:'Keep sending her the practicals in writing so she can do them from home.', n:0, i:0, s:1 },
          { es:'Pedir a dos compañeros que la suban por las escaleras los días de práctica.',
            en:'Ask two classmates to carry her up the stairs on practical days.', n:1, i:0, s:0 },
          { es:'Reconocerla en el acto cívico por su esfuerzo para superar los obstáculos.',
            en:'Honor her at the school assembly for her effort in overcoming obstacles.', n:0, i:0, s:0 } ] },
    { caso:{ es:'En una secundaria, las alumnas de un grupo dejaron de asistir a los talleres de la tarde. Varias explican que a esa hora cuidan a sus hermanos menores.',
             en:'At a secondary school, the girls in one group stopped attending the afternoon workshops. Several explain that at that hour they look after their younger siblings.' },
      m:[ { es:'Cambiar el horario del taller a uno acordado con quienes hoy no pueden asistir, con la programación publicada.',
            en:'Move the workshop to a time agreed with those who cannot attend today, with the schedule published.', n:2, i:2, s:1 },
          { es:'Formar una comisión con alumnas, familias y docentes que revise cada mes quién sigue quedando fuera.',
            en:'Set up a committee with students, families and teachers that reviews monthly who is still being left out.', n:1, i:2, s:2 },
          { es:'Abrir un espacio de cuidado en el plantel durante el taller, con personal asignado y revisión al final del ciclo.',
            en:'Open a care space on campus during the workshop, with assigned staff and a review at the end of the term.', n:2, i:1, s:2 },
          { es:'Subir el material del taller a una carpeta digital para que lo revisen cuando puedan.',
            en:'Upload the workshop material to a digital folder so they can review it whenever they can.', n:0, i:0, s:1 },
          { es:'Permitir que lleven a sus hermanos al taller y se hagan cargo de ellos durante la sesión.',
            en:'Let them bring their siblings to the workshop and look after them during the session.', n:1, i:0, s:0 },
          { es:'Dar un reconocimiento a quienes logren asistir pese a sus responsabilidades en casa.',
            en:'Give an award to those who manage to attend despite their responsibilities at home.', n:0, i:0, s:0 } ] }
  ];
  var C = cases[Math.floor(rng() * cases.length)];
  PRO = { c:C, sel:[], tries:0, revealed:false, msg:null, msgOk:false, best:[0,1,2], goal:5 };
  return '<div class="wgt" data-widget="build" id="wPropuesta">' +
      wgtHead(S('Constructor de propuestas','Proposal builder'),
              S('Elige tres medidas y observa cómo se mueven los tres medidores.',
                'Choose three measures and watch the three meters move.')) +
      '<div id="proBox"></div>' +
    '</div>';
}

function proLabels(){
  return LANG === 'es'
    ? ['Quita la barrera', 'Se decide con quien la vive', 'Se sostiene y se revisa']
    : ['Removes the barrier', 'Decided with whoever lives it', 'Holds up and gets reviewed'];
}

function proScores(){
  var v = [0, 0, 0], k;
  for (k = 0; k < PRO.sel.length; k++) {
    var m = PRO.c.m[PRO.sel[k]];
    v[0] += m.n; v[1] += m.i; v[2] += m.s;
  }
  return v;
}

function proRender(){
  if (!PRO) return;
  var box = document.getElementById('proBox');
  if (!box) return;
  var labels = proLabels(), v = proScores();
  var boxes = PRO.c.m.map(function(m, k){
    var cls = 'optbox' + (PRO.sel.indexOf(k) >= 0 ? ' sel' : '');
    return '<div class="' + cls + '" onclick="proTap(' + k + ')">' + m[LANG] + '</div>';
  }).join('');
  var meters = labels.map(function(lb, k){
    var w = Math.round(v[k] / 6 * 100);
    return '<div class="mtr"><div class="mtrlbl"><span>' + lb + '</span><span>' + v[k] + ' / 6</span></div>' +
      '<div class="mtrtrack"><div class="mtrfill' + (v[k] >= PRO.goal ? ' ok' : '') + '" style="width:' + w + '%"></div></div></div>';
  }).join('');
  var msg = PRO.msg || S('Una medida puede calmar la queja y dejar la barrera intacta. Los medidores te dicen cuál es cuál.',
                         'A measure can calm the complaint and leave the barrier untouched. The meters tell you which is which.');
  box.innerHTML =
    '<div class="wcase">' + PRO.c.caso[LANG] + '</div>' +
    boxes +
    '<div style="margin-top:.9rem">' + meters + '</div>' +
    (PRO.revealed ? '' : '<button class="wbtn" onclick="proCheck()">' + S('Comprobar la propuesta','Check the proposal') + '</button>') +
    '<div class="wmsg ' + (PRO.msgOk ? 'ok' : (PRO.msg ? 'warn' : '')) + '">' + msg + '</div>' +
    '<div class="wprog">' + S('Medidas elegidas: ','Measures chosen: ') + PRO.sel.length + ' / 3</div>';
}

function proTap(k){
  if (!PRO || PRO.revealed) return;
  var at = PRO.sel.indexOf(k);
  if (at >= 0) { PRO.sel.splice(at, 1); PRO.msg = null; PRO.msgOk = false; proRender(); return; }
  if (PRO.sel.length >= 3) {
    PRO.msgOk = false;
    PRO.msg = S('Ya tienes tres medidas. Quita una para poder cambiarla.', 'You already have three measures. Remove one to swap it.');
    proRender(); return;
  }
  PRO.sel.push(k); PRO.msg = null; PRO.msgOk = false;
  proRender();
}

function proCheck(){
  if (!PRO || PRO.revealed) return;
  if (PRO.sel.length !== 3) {
    PRO.msgOk = false;
    PRO.msg = S('Elige exactamente tres medidas antes de comprobar.', 'Choose exactly three measures before checking.');
    proRender(); return;
  }
  var v = proScores(), labels = proLabels(), k, worst = 0;
  for (k = 1; k < 3; k++) if (v[k] < v[worst]) worst = k;
  if (v[0] >= PRO.goal && v[1] >= PRO.goal && v[2] >= PRO.goal) {
    PRO.revealed = true; PRO.msgOk = true;
    PRO.msg = S('Los tres medidores pasaron la marca. Una propuesta así quita la barrera, se decide con quien la vive y deja fijado quién la revisa.',
                'All three meters cleared the mark. A proposal like this removes the barrier, is decided with whoever lives it, and sets who reviews it.');
    proRender(); return;
  }
  PRO.tries++;
  if (PRO.tries >= 3) {
    PRO.sel = PRO.best.slice();
    PRO.revealed = true; PRO.msgOk = false;
    PRO.msg = S('Esta combinación cruza las tres marcas: cambia la condición que excluye, se acuerda con la persona afectada y deja quién revisa y cuándo.',
                'This combination clears all three marks: it changes the condition that excludes, is agreed with the person affected, and sets who reviews it and when.');
    proRender(); return;
  }
  PRO.msgOk = false;
  PRO.msg = S('Tu propuesta se queda corta en: ' + labels[worst] + '. Le faltan ' + (PRO.goal - v[worst]) + ' puntos. Cambia una medida y vuelve a mirar los medidores.',
              'Your proposal falls short on: ' + labels[worst] + '. It is ' + (PRO.goal - v[worst]) + ' points short. Swap one measure and look at the meters again.');
  proRender();
}

/* ================================================
   WIDGET 5 - CUADERNO ABIERTO (escribir o trazar)
   The humanities analogue of showing your work: a seeded prompt the student
   answers by writing or sketching. Encouraging, never a verdict.
   ================================================ */
function buildCuaderno(rng){
  var PROMPTS = [
    { es:'Recuerda una situación de tu escuela o de tu colonia en la que alguien quedó fuera. Describe el hecho, di qué derecho se tocó y escribe tu juicio con dos razones.',
      en:'Recall a situation at your school or in your neighborhood where somebody was left out. Describe the fact, say which right was touched and write your judgment with two reasons.' },
    { es:'Traza el plano de un espacio que conozcas y marca con una señal cada punto donde alguien no podría entrar, oír o entender lo que ahí ocurre.',
      en:'Sketch the plan of a space you know and mark every point where somebody could not enter, hear or understand what happens there.' },
    { es:'Escribe una propuesta de tres puntos para que una actividad de tu escuela incluya a quienes hoy no participan: qué cambia, con quién se acuerda y quién revisa que se cumpla.',
      en:'Write a three point proposal so an activity at your school includes those who do not take part today: what changes, with whom it is agreed and who checks that it happens.' }
  ];
  var p = PROMPTS[Math.floor(rng() * PROMPTS.length)];
  var wrap = document.createElement('div');
  wrap.className = 'wgt section';
  wrap.setAttribute('data-widget', 'reflect');
  wrap.id = 'wCuaderno';
  wrap.innerHTML =
    wgtHead(S('Cuaderno abierto','Open notebook'),
            S('Aquí escribes o trazas tu propia respuesta.','Here you write or sketch your own answer.')) +
    '<div class="reflect-prompt">' + p[LANG] + '</div>' +
    '<div class="wtabs">' +
      '<button class="wtab active" onclick="cuadTab(\'type\',this)">' + t('tab-type') + '</button>' +
      '<button class="wtab" onclick="cuadTab(\'draw\',this)">' + t('tab-draw') + '</button>' +
    '</div>' +
    '<div class="wpanel active" id="cuad_type"><textarea class="wtextarea" id="cuadTa" placeholder="' + S('Tu respuesta...','Your answer...') + '"></textarea></div>' +
    '<div class="wpanel" id="cuad_draw"><div class="cvwrap"><canvas class="dcanvas" id="cuadCv"></canvas>' +
      '<div class="ctoolbar">' +
        '<button class="tbtn2 bpen on">' + t('btn-pen') + '</button>' +
        '<button class="tbtn2 bmarker">' + t('btn-marker') + '</button>' +
        '<button class="tbtn2 beraser">' + t('btn-eraser') + '</button>' +
        '<div class="cdot sel" data-color="#0f2d5a" style="background:#0f2d5a"></div>' +
        '<div class="cdot" data-color="#1a1a16" style="background:#1a1a16"></div>' +
        '<div class="cdot" data-color="#8b2500" style="background:#8b2500"></div>' +
        '<div class="cdot" data-color="#1d4e89" style="background:#1d4e89"></div>' +
        '<button class="clrbtn">' + t('btn-clear') + '</button>' +
      '</div>' +
    '</div></div>' +
    '<button class="wbtn" onclick="cuadSave()">' + S('Guardar','Save') + '</button>' +
    '<div class="wmsg" id="cuadFb">' + S('Aquí no hay una sola respuesta. Escribe la tuya y compárala después con la de alguien más.',
                                         'There is no single answer here. Write yours and compare it later with someone else.') + '</div>';
  document.getElementById('lessonBody').appendChild(wrap);
}

function cuadTab(which, btn){
  ['type', 'draw'].forEach(function(x){
    var el = document.getElementById('cuad_' + x);
    if (el) el.classList.toggle('active', x === which);
  });
  var wrap = document.getElementById('wCuaderno');
  if (wrap) wrap.querySelectorAll('.wtab').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  if (which === 'draw') setTimeout(function(){
    var c = document.getElementById('cuadCv');
    if (c && !c.width) initCanvas(c);
  }, 60);
}

function cuadSave(){
  var fb = document.getElementById('cuadFb');
  if (!fb) return;
  fb.className = 'wmsg ok';
  fb.textContent = S('Guardado. Lo que escribiste ya es una propuesta, y una propuesta se puede llevar a una asamblea.',
                     'Saved. What you wrote is already a proposal, and a proposal can be taken to an assembly.');
}

/* ================================================
   buildLesson - interleaved concept, manipulative, graded problem (Rule 1)
   ================================================ */
function buildLesson(rng) {
  problems = []; answeredCount = 0; correctCount = 0;
  document.getElementById('lessonBody').innerHTML = '';

  /* CONCEPTO 1 */
  addSection(S('CONCEPTO 1','CONCEPT 1'),
    '<h2>' + S('La igualdad escrita y la igualdad que ocurre','Equality on paper and equality that happens') + '</h2>' +
    '<p>' + S('La igualdad formal es la que está escrita: la ley y los reglamentos dicen que todas las personas tienen los mismos derechos. La igualdad sustantiva es otra cosa: ocurre cuando ese derecho llega de verdad a la vida de cada quien. Entre una y otra suele haber barreras que nadie escribió, y que sin embargo deciden quién entra, quién habla y quién se queda afuera.',
              'Formal equality is the one on paper: the law and the rulebooks say every person holds the same rights. Substantive equality is something else: it happens when that right actually reaches each person life. Between the two there are usually barriers nobody wrote down, and which nevertheless decide who gets in, who speaks and who stays outside.') + '</p>' +
    '<p>' + S('La discriminación aparece cuando alguien recibe un trato que le cierra o le recorta un derecho por una característica suya: su sexo, su género, su discapacidad, su lengua, su origen, su apariencia o su condición. No todo trato distinto discrimina. Un requisito ligado a la tarea o a la seguridad es una distinción justificada, y una medida que da apoyo extra a quien parte con desventaja busca nivelar el terreno, no privilegiar a nadie.',
              'Discrimination appears when somebody receives treatment that closes off or cuts back a right because of a characteristic of theirs: their sex, their gender, their disability, their language, their origin, their appearance or their situation. Not every different treatment discriminates. A requirement tied to the task or to safety is a justified distinction, and a measure giving extra support to whoever starts at a disadvantage seeks to level the ground, not to privilege anyone.') + '</p>' +
    '<div class="callout"><p><strong>' + S('Clave: ','Key: ') + '</strong>' +
      S('la pregunta que separa un caso de otro es siempre la misma: lo que se pide o se decide, ¿tiene relación con la tarea, con la seguridad, o solo con quién es la persona?',
        'the question that tells one case from another is always the same: what is asked or decided, does it relate to the task, to safety, or only to who the person is?') + '</p></div>' +
    '<div class="rules-grid">' +
      '<div class="rcard"><div class="rname">' + S('Igualdad formal','Formal equality') + '</div><div class="rform">' + S('la misma regla','the same rule') + '</div><div class="rnote">' + S('Está escrita para todas las personas.','It is written for every person.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Igualdad sustantiva','Substantive equality') + '</div><div class="rform">' + S('el mismo derecho','the same right') + '</div><div class="rnote">' + S('El derecho llega de verdad a cada quien.','The right actually reaches each person.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Discriminación','Discrimination') + '</div><div class="rform">' + S('cierra un derecho','closes a right') + '</div><div class="rnote">' + S('Usa una característica ajena a lo que se pide.','It uses a characteristic unrelated to what is asked.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Medida que nivela','Leveling measure') + '</div><div class="rform">' + S('abre un derecho','opens a right') + '</div><div class="rnote">' + S('Corrige una desventaja mientras esta dure.','It corrects a disadvantage while it lasts.') + '</div></div>' +
    '</div>' +
    buildDetector(rng));
  detRender();

  /* PROBLEMA 1 */
  addProblem(pick([
    { title:{ es:'El requisito que sobra', en:'The requirement that does not belong' }, showWork:false,
      stmt:{ es:'La convocatoria para integrar la escolta de la escuela pide dos cosas: haber cursado el ciclo completo en el plantel y ser hombre. ¿Cuál es el juicio que corresponde a esa convocatoria?',
             en:'The call to join the school honor guard asks for two things: having completed the full school year at the campus and being male. Which judgment fits that call?' },
      options:{ es:[
        'Discrimina, porque ser hombre no guarda relación con las tareas de la escolta y por esa vía deja fuera a las alumnas.',
        'No discrimina, porque quien organiza una convocatoria puede fijar los requisitos que considere convenientes.',
        'Discrimina, porque todo requisito de ingreso limita la participación de alguien y ninguna convocatoria debería pedirlos.',
        'No discrimina, porque las alumnas pueden participar en otras actividades del plantel durante ese mismo ciclo.' ],
        en:[
        'It discriminates, because being male bears no relation to the honor guard tasks and by that route it shuts the girls out.',
        'It does not discriminate, because whoever organizes a call may set whatever requirements they consider convenient.',
        'It discriminates, because every entry requirement limits somebody participation and no call should ask for any.',
        'It does not discriminate, because the girls can take part in other campus activities during that same school year.' ] },
      correct:0,
      hint:{ es:'Revisa los requisitos por separado y pregúntate, en cada uno, si se relaciona con lo que la escolta tiene que hacer.',
             en:'Check the requirements one at a time and ask, for each, whether it relates to what the honor guard has to do.' },
      explanation:{ es:'Haber cursado el ciclo completo se relaciona con la actividad y con conocer el plantel; ser hombre no se relaciona con nada de lo que la escolta hace. Un requisito discrimina cuando usa una característica de la persona ajena a la tarea y por esa vía cierra el acceso.',
                    en:'Having completed the full year relates to the activity and to knowing the campus; being male relates to nothing the honor guard does. A requirement discriminates when it uses a characteristic of the person unrelated to the task and by that route closes access.' } },
    { title:{ es:'El requisito que sobra', en:'The requirement that does not belong' }, showWork:false,
      stmt:{ es:'Una tienda del barrio publica una vacante de cajero y pide dos cosas: saber usar el sistema de cobro y hablar sin acento. ¿Cuál es el juicio que corresponde a esa vacante?',
             en:'A neighborhood shop posts a cashier vacancy and asks for two things: knowing how to use the checkout system and speaking with no accent. Which judgment fits that vacancy?' },
      options:{ es:[
        'Discrimina, porque el acento no interviene en el trabajo de una caja y deja fuera a quienes hablan como en su comunidad.',
        'No discrimina, porque cada negocio decide qué perfil de personal quiere atender a su clientela.',
        'Discrimina, porque pedir el manejo del sistema de cobro ya excluye a quien nunca ha trabajado en una tienda.',
        'No discrimina, porque quien no cumpla ese requisito puede buscar empleo en otro comercio de la zona.' ],
        en:[
        'It discriminates, because the accent plays no part in working a till and it shuts out people who speak as they do in their community.',
        'It does not discriminate, because each business decides what kind of staff it wants serving its customers.',
        'It discriminates, because asking for checkout system skills already excludes anyone who has never worked in a shop.',
        'It does not discriminate, because whoever fails that requirement can look for work in another shop nearby.' ] },
      correct:0,
      hint:{ es:'Separa los dos requisitos y pregúntate cuál mide algo que el trabajo exige y cuál mide de dónde viene la persona.',
             en:'Separate the two requirements and ask which one measures something the job demands and which measures where the person comes from.' },
      explanation:{ es:'Manejar el sistema de cobro es justo lo que el puesto exige y cualquier persona puede aprenderlo. El acento, en cambio, señala el origen de quien habla y no interviene en cobrar. Ese segundo requisito convierte una característica personal en una puerta cerrada.',
                    en:'Handling the checkout system is exactly what the post demands and anybody can learn it. The accent, by contrast, points to where the speaker comes from and plays no part in taking payments. That second requirement turns a personal characteristic into a closed door.' } }
  ], rng), rng);

  /* PROBLEMA 2 */
  addProblem(pick([
    { title:{ es:'Reparto parejo o reparto justo', en:'Equal share or fair share' }, showWork:false,
      stmt:{ es:'Un municipio abre becas de transporte solo para el estudiantado de las comunidades más alejadas, donde el abandono escolar es el más alto. Un grupo reclama que el programa es injusto porque no lo recibe todo el estudiantado. ¿Qué juicio corresponde al reclamo?',
             en:'A town hall opens transport grants only for students from the most distant communities, where dropout rates are highest. A group protests that the program is unfair because not every student receives it. Which judgment fits the protest?' },
      options:{ es:[
        'El reclamo se equivoca: el programa busca igualdad sustantiva, porque da apoyo distinto a quien enfrenta una barrera distinta para llegar a la escuela.',
        'El reclamo tiene razón: la igualdad exige que todo apoyo público se reparta en partes iguales entre todo el estudiantado.',
        'El reclamo tiene razón: quien vive lejos conoce esa distancia desde antes y le corresponde asumir el costo de su traslado.',
        'El reclamo se equivoca: el municipio puede repartir sus recursos como decida y no tiene que explicar el criterio a nadie.' ],
        en:[
        'The protest is wrong: the program seeks substantive equality, because it gives different support to whoever faces a different barrier to reaching school.',
        'The protest is right: equality demands that every public support be split in equal parts among all students.',
        'The protest is right: whoever lives far away knew that distance beforehand and should bear the cost of the journey.',
        'The protest is wrong: the town hall may hand out its resources however it decides and owes nobody an explanation of the criterion.' ] },
      correct:0,
      hint:{ es:'Pregúntate si el apoyo se entrega por una característica ajena al problema o por la barrera concreta que impide llegar a la escuela.',
             en:'Ask whether the support is given for a characteristic unrelated to the problem or for the concrete barrier that prevents reaching school.' },
      explanation:{ es:'Repartir lo mismo a quien parte de situaciones distintas conserva la diferencia. El programa atiende una barrera concreta, la distancia, que es la que explica el abandono escolar, y por eso corrige y no privilegia. Justificar el criterio, además, es parte de la obligación de la autoridad.',
                    en:'Handing out the same to people starting from different situations preserves the gap. The program addresses a concrete barrier, the distance, which is what explains the dropout rate, so it corrects rather than privileges. Justifying the criterion, moreover, is part of the authority obligation.' } },
    { title:{ es:'Reparto parejo o reparto justo', en:'Equal share or fair share' }, showWork:false,
      stmt:{ es:'Una escuela destina el doble de horas de asesoría al grupo que llegó a mitad del ciclo desde otra región y va muy atrasado en matemáticas. Varias familias reclaman que es injusto porque los demás grupos reciben menos horas. ¿Qué juicio corresponde al reclamo?',
             en:'A school assigns twice the tutoring hours to the group that arrived mid year from another region and is far behind in mathematics. Several families protest that it is unfair because the other groups receive fewer hours. Which judgment fits the protest?' },
      options:{ es:[
        'El reclamo se equivoca: repartir las horas según el rezago busca que todos los grupos alcancen el mismo aprendizaje, que es lo que la escuela debe garantizar.',
        'El reclamo tiene razón: en una escuela pública toda hora de asesoría debe distribuirse por igual entre todos los grupos.',
        'El reclamo tiene razón: el grupo que llegó tarde debe recuperar el rezago por su cuenta antes de recibir apoyo adicional.',
        'El reclamo se equivoca: la dirección organiza los tiempos del plantel y no necesita justificar sus decisiones ante las familias.' ],
        en:[
        'The protest is wrong: sharing the hours according to the gap seeks to have every group reach the same learning, which is what the school must guarantee.',
        'The protest is right: in a public school every tutoring hour must be distributed equally among all groups.',
        'The protest is right: the group that arrived late should catch up on its own before receiving any extra support.',
        'The protest is wrong: the principal organizes campus time and does not need to justify decisions to the families.' ] },
      correct:0,
      hint:{ es:'Compara dos metas distintas: repartir las horas en partes iguales o lograr que todos los grupos lleguen al mismo aprendizaje.',
             en:'Compare two different goals: splitting the hours into equal parts, or getting every group to the same learning.' },
      explanation:{ es:'Las horas no son el derecho: el derecho es aprender. Dar más asesoría a quien llegó con rezago es lo que permite que ese derecho llegue igual a todos, y la medida dura mientras dure el rezago. Y una autoridad escolar sí debe explicar el criterio con el que decide.',
                    en:'The hours are not the right: the right is to learn. Giving more tutoring to whoever arrived behind is what lets that right reach everyone alike, and the measure lasts as long as the gap does. And a school authority does have to explain the criterion behind its decision.' } }
  ], rng), rng);

  /* CONCEPTO 2 */
  addSection(S('CONCEPTO 2','CONCEPT 2'),
    '<h2>' + S('De la molestia al juicio ético','From annoyance to an ethical judgment') + '</h2>' +
    '<p>' + S('Decir que algo está mal no es todavía un juicio ético. Una opinión expresa lo que a alguien le gusta o le molesta; un prejuicio juzga a la persona antes de mirar los hechos. Un juicio ético, en cambio, se construye: describe el hecho, identifica el derecho afectado, revisa si el criterio usado tiene relación con lo que se pide, lo contrasta con principios como la dignidad y la igualdad, y sostiene una conclusión con razones que cualquier persona puede revisar.',
              'Saying something is wrong is not yet an ethical judgment. An opinion expresses what somebody likes or dislikes; a prejudice judges the person before looking at the facts. An ethical judgment, by contrast, gets built: it describes the fact, identifies the right affected, checks whether the criterion used relates to what is asked, contrasts it with principles such as dignity and equality, and holds a conclusion with reasons anyone can review.') + '</p>' +
    '<p>' + S('Ese trabajo termina en una propuesta. Un juicio que solo señala culpables deja la situación igual; uno completo dice qué hay que cambiar, con quién se acuerda el cambio y en qué momento se comprobará si funcionó.',
              'That work ends in a proposal. A judgment that only points at culprits leaves the situation as it was; a complete one says what has to change, with whom the change is agreed and when it will be checked whether it worked.') + '</p>' +
    '<div class="callout"><p><strong>' + S('Clave: ','Key: ') + '</strong>' +
      S('un juicio ético se reconoce porque se pueden pedir sus razones, y esas razones valdrían igual si la persona afectada fuera cualquier otra.',
        'an ethical judgment is recognized because you can ask for its reasons, and those reasons would hold just the same if the person affected were anyone else.') + '</p></div>' +
    buildJuicio(rng));
  juiRender();

  /* PROBLEMA 3 */
  addProblem(pick([
    { title:{ es:'Lo que le falta a la frase', en:'What the sentence is missing' }, showWork:false,
      stmt:{ es:'Un alumno escribe en el mural: me parece mal que no dejaran entrar a Julia al equipo, es una injusticia y ya. ¿Qué le falta a esa frase para ser un juicio ético?',
             en:'A student writes on the board: I think it is wrong that they did not let Julia into the team, it is an injustice and that is that. What does that sentence lack to be an ethical judgment?' },
      options:{ es:[
        'Las razones: falta decir qué derecho quedó afectado y por qué el motivo del rechazo no se relaciona con lo que el equipo exige.',
        'Nada: basta con expresar lo que uno siente, porque en cuestiones de justicia cada quien juzga desde su propia experiencia.',
        'Le falta suavizar el tono, porque un juicio ético evita señalar la decisión que tomó otra persona.',
        'Le falta pedir una sanción para quienes dejaron fuera a Julia, que es lo que cierra cualquier juicio.' ],
        en:[
        'The reasons: it fails to say which right was affected and why the ground for the refusal bears no relation to what the team demands.',
        'Nothing: expressing what one feels is enough, because in matters of justice each person judges from their own experience.',
        'It needs a softer tone, because an ethical judgment avoids pointing at the decision another person made.',
        'It needs to demand a penalty for those who left Julia out, which is what closes any judgment.' ] },
      correct:0,
      hint:{ es:'Pregúntate qué tendría que agregar para que otra persona pudiera revisar su conclusión sin conocer a Julia.',
             en:'Ask what would have to be added so another person could review the conclusion without knowing Julia.' },
      explanation:{ es:'La frase expresa una molestia legítima, pero se queda en la opinión: nadie puede revisarla. Un juicio ético nombra el hecho, el derecho afectado y el criterio que no corresponde, y por eso puede discutirse y sostenerse frente a quien decidió. El tono no es el problema y la sanción no es el objetivo.',
                    en:'The sentence expresses a legitimate annoyance, but stays at the level of opinion: nobody can review it. An ethical judgment names the fact, the right affected and the criterion that does not fit, and that is why it can be discussed and held up before whoever decided. The tone is not the problem and a penalty is not the goal.' } },
    { title:{ es:'Lo que le falta a la frase', en:'What the sentence is missing' }, showWork:false,
      stmt:{ es:'En una discusión de grupo, alguien afirma: los del turno vespertino siempre dejan sucio el salón, por algo será. ¿Cómo se describe mejor esa afirmación?',
             en:'In a group discussion, somebody states: the afternoon shift students always leave the classroom dirty, there must be a reason. How is that statement best described?' },
      options:{ es:[
        'Es un prejuicio: atribuye una conducta a todo un grupo sin hechos verificados y usa la pertenencia al turno como explicación.',
        'Es un juicio ético: identifica un problema real de convivencia y señala a quienes deberían corregirlo en el plantel.',
        'Es una propuesta de mejora: invita al turno vespertino a hacerse cargo de la limpieza del salón que comparten.',
        'Es una opinión sin consecuencias: hablar del turno vespertino no afecta a ninguna persona en particular del plantel.' ],
        en:[
        'It is a prejudice: it attributes a behavior to a whole group with no verified facts and uses belonging to the shift as the explanation.',
        'It is an ethical judgment: it identifies a real problem of school life and points at those who should correct it on campus.',
        'It is an improvement proposal: it invites the afternoon shift to take charge of cleaning the classroom they share.',
        'It is an opinion with no consequences: talking about the afternoon shift affects no particular person on campus.' ] },
      correct:0,
      hint:{ es:'Fíjate en dos cosas: de dónde salen los hechos y a quiénes alcanza la conclusión.',
             en:'Look at two things: where the facts come from, and how many people the conclusion reaches.' },
      explanation:{ es:'La afirmación no describe hechos comprobados ni distingue personas: convierte pertenecer a un turno en una explicación de la conducta. Eso es un prejuicio, y sí tiene consecuencias, porque alimenta el trato desigual hacia quienes estudian en ese horario.',
                    en:'The statement describes no verified facts and tells no one person from another: it turns belonging to a shift into an explanation of behavior. That is a prejudice, and it does have consequences, because it feeds unequal treatment of those who study at that time.' } }
  ], rng), rng);

  /* PROBLEMA 4 */
  addProblem(pick([
    { title:{ es:'La regla que no nombra a nadie', en:'The rule that names nobody' }, showWork:true,
      stmt:{ es:'En una empresa, las vacantes de supervisión se anuncian solo en el grupo de mensajería del turno nocturno. Casi todo el personal con hijos pequeños trabaja de día y no pertenece a ese grupo. Elabora el juicio: ¿qué se puede afirmar y qué acción corresponde?',
             en:'At a company, supervisor vacancies are announced only in the night shift messaging group. Almost all staff with small children work days and do not belong to that group. Build the judgment: what can be stated and what action fits?' },
      options:{ es:[
        'La práctica produce un efecto excluyente aunque el aviso no nombre a nadie, y corresponde publicar las vacantes por un medio que alcance a todo el personal, con plazo y responsable.',
        'No hay nada que juzgar, porque el aviso no prohíbe postularse a nadie y la empresa eligió el medio que le resulta más práctico.',
        'Hay discriminación y corresponde reservar todas las vacantes de supervisión al personal con hijos pequeños hasta emparejar las cifras.',
        'Hay un problema de disciplina y corresponde sancionar a quienes difundieron la vacante en un grupo de mensajería privado.' ],
        en:[
        'The practice produces an excluding effect even though the notice names nobody, and the vacancies should be posted through a channel reaching all staff, with a deadline and someone responsible.',
        'There is nothing to judge, because the notice forbids nobody from applying and the company chose the channel it finds most practical.',
        'There is discrimination and all supervisor vacancies should be reserved for staff with small children until the figures even out.',
        'There is a discipline problem and whoever spread the vacancy in a private messaging group should be penalized.' ] },
      correct:0,
      hint:{ es:'Describe primero el efecto real del aviso, después revisa si ese efecto tiene relación con lo que exige el puesto, y hasta el final propón.',
             en:'First describe the real effect of the notice, then check whether that effect relates to what the post demands, and only at the end propose.' },
      explanation:{ es:'El aviso no excluye por escrito, pero en los hechos deja fuera a quien no está en ese grupo, y pertenecer al turno nocturno no tiene relación con supervisar. La acción congruente amplía el canal de difusión, que es la barrera, en lugar de invertir la exclusión o de castigar a alguien por difundir la vacante.',
                    en:'The notice excludes nobody in writing, yet in practice it leaves out whoever is not in that group, and belonging to the night shift has nothing to do with supervising. The consistent action widens the announcement channel, which is the barrier, instead of reversing the exclusion or punishing somebody for sharing the vacancy.' } },
    { title:{ es:'La regla que no nombra a nadie', en:'The rule that names nobody' }, showWork:true,
      stmt:{ es:'Un reglamento escolar exige uniforme completo y calzado nuevo para entrar a la ceremonia. Las familias con menos ingresos dejan de enviar a sus hijos ese día y la escuela registra sus faltas. Elabora el juicio: ¿qué se puede afirmar y qué acción corresponde?',
             en:'A school rulebook demands a full uniform and new shoes to enter the ceremony. Families with lower incomes stop sending their children that day and the school records their absences. Build the judgment: what can be stated and what action fits?' },
      options:{ es:[
        'La regla produce un efecto excluyente aunque no mencione ingresos, y corresponde revisar el requisito con las familias y fijar quién verifica que nadie quede fuera.',
        'No hay nada que juzgar, porque el reglamento se aplica igual a todo el estudiantado y cada familia decide si lo cumple.',
        'Hay discriminación y corresponde exentar de todo requisito de presentación a las familias con menos ingresos de manera permanente.',
        'Hay un problema de asistencia y corresponde justificar las faltas de ese día sin modificar el requisito del reglamento.' ],
        en:[
        'The rule produces an excluding effect even though it never mentions income, and the requirement should be reviewed with the families, setting who checks that nobody is left out.',
        'There is nothing to judge, because the rulebook applies equally to every student and each family decides whether to comply.',
        'There is discrimination and families with lower incomes should be permanently exempted from every presentation requirement.',
        'There is an attendance problem and the absences that day should be excused without changing the rulebook requirement.' ] },
      correct:0,
      hint:{ es:'Mira quién queda fuera en los hechos y pregúntate si el calzado nuevo tiene relación con la finalidad de la ceremonia.',
             en:'Look at who is left out in practice and ask whether new shoes have anything to do with the purpose of the ceremony.' },
      explanation:{ es:'La regla es igual para todos en el papel y desigual en sus efectos, porque el gasto que exige no está al alcance de todas las familias y no se relaciona con participar en la ceremonia. Lo que corresponde es revisar el requisito con quienes lo resienten y dejar quién comprueba el resultado, no exentar de todo ni solo justificar faltas.',
                    en:'The rule is equal for everyone on paper and unequal in its effects, because the expense it demands is out of reach for some families and has nothing to do with taking part in the ceremony. What fits is reviewing the requirement with those who feel it and setting who checks the result, not blanket exemptions nor merely excusing absences.' } }
  ], rng), rng);

  /* CONCEPTO 3 */
  addSection(S('CONCEPTO 3','CONCEPT 3'),
    '<h2>' + S('Mirar con perspectiva de género','Looking with a gender perspective') + '</h2>' +
    '<p>' + S('La perspectiva de género es una forma de mirar: consiste en preguntar, ante cualquier situación, si hombres y mujeres la viven igual y por qué no. Los estereotipos reparten de antemano tareas, gustos y lugares según el sexo de cada quien, y ese reparto termina decidiendo quién expone, quién toma nota, quién entrena el fin de semana y quién se queda cuidando en casa.',
              'The gender perspective is a way of looking: it consists of asking, in any situation, whether men and women live it the same way and why not. Stereotypes assign tasks, tastes and places in advance according to each person sex, and that assignment ends up deciding who presents, who takes notes, who trains at the weekend and who stays home caring for others.') + '</p>' +
    '<p>' + S('Por eso hay reglas que no nombran a nadie y aun así excluyen: una convocatoria en horario de fin de semana no menciona a las mujeres, pero deja fuera a quienes cargan con el trabajo de cuidado. A eso se le llama discriminación indirecta, y se detecta mirando los efectos, no las palabras.',
              'That is why there are rules that name nobody and still exclude: a call scheduled at the weekend mentions no women, yet leaves out whoever carries the care work. This is called indirect discrimination, and it is spotted by looking at effects, not at words.') + '</p>' +
    '<div class="callout"><p><strong>' + S('Clave: ','Key: ') + '</strong>' +
      S('cuando un espacio se queda sin mujeres o sin hombres durante años, la explicación rara vez es el gusto de cada quien; casi siempre hay una barrera que nadie escribió.',

                    en:'That nobody agrees it out loud is exactly what characterizes a stereotype: it runs on its own. The cost is concrete, because some stop practicing public speaking and others stop practicing writing. And an unwritten practice can also be reviewed and changed in the classroom.' } },

  addSection(S('CONCEPTO 4','CONCEPT 4'),
    '<h2>' + S('Inclusión: se corrige el entorno, no a la persona','Inclusion: you correct the setting, not the person') + '</h2>' +
    '<p>' + S('Incluir no es dejar entrar y esperar que cada quien se las arregle. Una escuela incluyente revisa qué de su entorno impide participar: unas escaleras sin rampa, un aviso que solo se dice en voz alta, un examen redactado en una lengua que no es la de casa, un horario imposible para quien cuida. Esas condiciones son las barreras, y son ellas las que se cambian.',
              'Including is not letting people in and hoping each one copes. An inclusive school reviews what in its setting prevents participation: stairs with no ramp, a notice given only out loud, an exam written in a language that is not the one spoken at home, a timetable impossible for whoever cares for others. Those conditions are the barriers, and they are what gets changed.') + '</p>' +
    '<p>' + S('Un ajuste razonable es un cambio concreto que permite a una persona participar en la misma actividad que el resto: el material en otro formato, un tiempo distinto, un espacio accesible, la información en dos lenguas. No es un favor ni un premio, y no consiste en pedir menos: consiste en pedir lo mismo por un camino que sí exista. Además, quien vive la barrera participa en decidir el ajuste, porque nadie conoce mejor el obstáculo.',
              'A reasonable adjustment is a concrete change letting a person take part in the same activity as everyone else: material in another format, different timing, an accessible space, information in two languages. It is not a favor or a prize, and it does not consist of asking for less: it consists of asking the same through a route that actually exists. Moreover, whoever lives the barrier takes part in deciding the adjustment, because nobody knows the obstacle better.') + '</p>' +
    '<div class="rules-grid">' +
      '<div class="rcard"><div class="rname">' + S('Barrera','Barrier') + '</div><div class="rform">' + S('está en el entorno','sits in the setting') + '</div><div class="rnote">' + S('Escaleras, formatos, horarios, lengua.','Stairs, formats, timetables, language.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Ajuste razonable','Reasonable adjustment') + '</div><div class="rform">' + S('mismo objetivo','same goal') + '</div><div class="rnote">' + S('Cambia el camino, no la exigencia.','It changes the route, not the demand.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Participación','Participation') + '</div><div class="rform">' + S('se decide con','decided with') + '</div><div class="rnote">' + S('Quien vive la barrera opina sobre el ajuste.','Whoever lives the barrier has a say in the adjustment.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Seguimiento','Follow up') + '</div><div class="rform">' + S('quién y cuándo','who and when') + '</div><div class="rnote">' + S('Sin revisión, el ajuste se desvanece.','With no review, the adjustment fades away.') + '</div></div>' +
    '</div>' +

             en:'After several offensive comments toward a migrant student in the class messaging group, somebody proposes opening another group without the students who wrote them and carrying on school life there. Which judgment fits that proposal?' },

        'No es congruente: separa al grupo sin reparar al alumno agredido ni trabajar el trato que hizo posibles los comentarios.',
        'Es congruente: apartar a quienes ofenden es la única forma de garantizar que el alumno agredido esté seguro en el salón.',
        'Es congruente: cada grupo de mensajería es privado y quien lo administra decide libremente a quién deja participar.',
        'No es congruente: los comentarios ocurrieron fuera del horario escolar y por eso no corresponde a la escuela intervenir.' ],
        en:[
        'It is not consistent: it splits the group without repairing the student attacked or working on the treatment that made the comments possible.',
        'It is consistent: setting aside those who offend is the only way to guarantee the student attacked is safe in the classroom.',
        'It is consistent: every messaging group is private and whoever runs it freely decides who gets to take part.',
        'It is not consistent: the comments happened outside school hours and therefore the school should not step in.' ] },
      correct:0,
      hint:{ es:'Pregúntate qué pasa al día siguiente en el salón, cuando todo el grupo vuelve a compartir el mismo espacio.',
             en:'Ask what happens the next day in the classroom, when the whole group shares the same space again.' },
      explanation:{ es:'Abrir otro grupo mueve la conversación de lugar y deja intacto el trato dentro del salón, donde todos siguen conviviendo. Tampoco repara al alumno agredido. Lo congruente es atender lo ocurrido con él, trabajar el trato en el grupo y fijar quién revisa que no se repita.',
                    en:'Opening another group moves the conversation elsewhere and leaves untouched the treatment inside the classroom, where everyone still lives together. It repairs nothing for the student attacked either. What fits is addressing what happened with him, working on the treatment in the group and setting who checks that it does not happen again.' } }
  ], rng), rng);

  addProblem(pick([
    { title:{ es:'Lo que dice el reglamento y lo que pasa', en:'What the rulebook says and what happens' }, showWork:false,
      stmt:{ es:'El reglamento de una escuela establece que todo el estudiantado puede inscribirse a cualquier taller. Aun así, en el taller de carpintería no se ha inscrito ninguna alumna en cuatro ciclos escolares. ¿Qué muestra esa situación?',
             en:'A school rulebook establishes that every student may enroll in any workshop. Even so, not one girl has enrolled in the carpentry workshop in four school years. What does that situation show?' },
      options:{ es:[
        'Que la igualdad escrita en el reglamento no se ha vuelto igualdad real, y hace falta buscar qué barreras operan fuera del texto.',
        'Que la igualdad ya está garantizada, porque el reglamento no impide a ninguna alumna inscribirse en ese taller del plantel.',
        'Que el reglamento debería prohibir la inscripción de alumnos varones hasta emparejar el número de inscritas en el taller.',
        'Que a las alumnas no les interesa la carpintería, y por eso el mismo resultado se repite ciclo tras ciclo en la escuela.' ],
        en:[
        'That the equality written in the rulebook has not become real equality, and the barriers operating outside the text need to be found.',
        'That equality is already guaranteed, because the rulebook stops no girl from enrolling in that campus workshop.',
        'That the rulebook should ban boys from enrolling until the number of girls enrolled evens out in the workshop.',
        'That the girls are not interested in carpentry, and that is why the same result repeats year after year at the school.' ] },
      correct:0,
      hint:{ es:'Compara lo que el reglamento permite con lo que ocurre en los hechos y pregúntate a qué corresponde esa distancia.',
             en:'Compare what the rulebook allows with what happens in practice and ask what that distance corresponds to.' },
      explanation:{ es:'Un resultado que se repite durante cuatro ciclos rara vez se explica por decisiones individuales. La distancia entre el permiso escrito y la inscripción real es justo lo que distingue la igualdad formal de la sustantiva, y obliga a buscar la barrera. Prohibir la entrada a los varones invierte la exclusión en lugar de quitarla.',
                    en:'A result repeating over four school years is rarely explained by individual decisions. The distance between written permission and actual enrollment is precisely what tells formal equality from substantive equality, and it forces you to look for the barrier. Banning boys reverses the exclusion instead of removing it.' } },
    { title:{ es:'Lo que dice el reglamento y lo que pasa', en:'What the rulebook says and what happens' }, showWork:false,
      stmt:{ es:'Una biblioteca pública anuncia que sus servicios están abiertos a toda la población. Sin embargo, ninguna persona usuaria de silla de ruedas ha solicitado un préstamo en tres años, y la entrada tiene cinco escalones. ¿Qué muestra esa situación?',
             en:'A public library announces that its services are open to the whole population. However, no person who uses a wheelchair has requested a loan in three years, and the entrance has five steps.  What does that situation show?' },
      options:{ es:[
        'Que el servicio es abierto en el anuncio y cerrado en los hechos, porque el acceso depende de una condición del edificio.',
        'Que el servicio ya es igual para toda la población, porque el anuncio no excluye a ninguna persona usuaria en particular.',
        'Que la biblioteca debería reservar sus préstamos a personas con discapacidad hasta emparejar las cifras de los últimos años.',
        'Que ninguna persona usuaria de silla de ruedas ha necesitado los libros de esa biblioteca durante esos tres años.' ],
        en:[
        'That the service is open in the announcement and closed in practice, because access depends on a condition of the building.',
        'That the service is already the same for the whole population, because the announcement excludes no particular user.',
        'That the library should reserve its loans for people with disabilities until the figures of recent years even out.',
        'That no wheelchair user has needed the books of that library during those three years.' ] },
      correct:0,
      hint:{ es:'Pon juntos los dos datos del caso, el anuncio y los escalones, y pregúntate cuál de los dos decide quién entra.',
             en:'Put the two facts of the case side by side, the announcement and the steps, and ask which of the two decides who gets in.' },
      explanation:{ es:'El anuncio no cierra la puerta, pero los escalones sí, y por eso el servicio no llega. Eso es exactamente la diferencia entre la igualdad formal y la sustantiva. Suponer falta de interés ignora el dato del edificio, y reservar los préstamos no toca la barrera que impide entrar.',
                    en:'The announcement does not close the door, but the steps do, and that is why the service does not arrive. This is exactly the difference between formal and substantive equality. Assuming lack of interest ignores the fact about the building, and reserving loans touches nothing of the barrier preventing entry.' } }
  ], rng), rng);
}
</script>

  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
