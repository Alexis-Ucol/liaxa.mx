                en:'It leaves the effort to others and does not guarantee the solution reaches the other communities.' } } ] }
  ];
  var rounds = shuffle(cases, rng).slice(0, 3).map(function(c){
    return { cse:c.cse, opts:shuffle(c.opts, rng) };
  });
  TP = { rounds:rounds, r:0, tries:0, resolved:false, done:false, state:[0,0,0,0],
         msg:{ es:'Elige la acción que llega a quien tiene la obligación de responder.', en:'Choose the action that reaches whoever has the duty to answer.' }, cls:'' };
  return '<div class="wgt" id="tpw">' +
    '<div class="wgt-h">' + S('Mesa de decisiones','Decision table') + '</div>' +
    '<div class="wgt-q">' + S('Lee el caso y elige la acción del repertorio que mueve el asunto.','Read the case and choose the action from the repertoire that moves the matter forward.') + '</div>' +
    '<div class="wcase" id="tpcase"></div>' +
    '<div class="tools" id="tptools"></div>' +
    '<div class="wmsg" id="tpmsg"></div>' +
    '<button class="wbtn" id="tpnext" onclick="tpNext()">' + S('Siguiente caso','Next case') + '</button>' +
    '<div class="wprog" id="tpprog"></div>' +
  '</div>';
}
function tpRender(){
  var box = document.getElementById('tpcase');
  if (!box || !TP) return;
  var R = TP.rounds[TP.r];
  box.innerHTML = R.cse[LANG];
  document.getElementById('tptools').innerHTML = R.opts.map(function(o,i){
    var st = TP.state[i];
    var cls = 'tool' + (st === 1 ? ' good' : st === 2 ? ' miss' : '');
    return '<div class="' + cls + '" onclick="tpPick(' + i + ')">' +
             '<div class="toolname">' + o[LANG] + '</div>' +
             (st ? '<div class="toolwhy">' + o.why[LANG] + '</div>' : '') +
           '</div>';
  }).join('');
  var m = document.getElementById('tpmsg');
  m.className = 'wmsg' + (TP.cls ? ' ' + TP.cls : '');
  m.innerHTML = TP.msg[LANG];
  var nb = document.getElementById('tpnext');
  nb.style.display = (TP.resolved && !TP.done) ? 'inline-block' : 'none';
  document.getElementById('tpprog').textContent = TP.done
    ? S('Casos resueltos: ','Cases solved: ') + TP.rounds.length + ' / ' + TP.rounds.length
    : S('Caso ','Case ') + (TP.r + 1) + ' / ' + TP.rounds.length;
}
function tpPick(i){
  if (!TP || TP.resolved || TP.done) return;
  if (TP.state[i]) return;
  var o = TP.rounds[TP.r].opts[i];
  if (o.ok){
    TP.state[i] = 1; TP.resolved = true; TP.cls = 'ok';
    TP.msg = { es:'Esa es la vía. ' + o.why.es, en:'That is the route. ' + o.why.en };
  } else {
    TP.state[i] = 2; TP.tries++;
    if (TP.tries >= 3){
      TP.rounds[TP.r].opts.forEach(function(x,k){ if (x.ok) TP.state[k] = 1; });
      TP.resolved = true; TP.cls = 'warn';
      var good = TP.rounds[TP.r].opts.filter(function(x){ return x.ok; })[0];
      TP.msg = { es:'La acción marcada es la que mueve el caso. ' + good.why.es,
                 en:'The marked action is the one that moves the case. ' + good.why.en };
    } else {
      TP.cls = 'bad';
      TP.msg = { es:o.why.es + ' Prueba con otra de las opciones abiertas.',
                 en:o.why.en + ' Try one of the options still open.' };
    }
  }
  tpRender();
}
function tpNext(){
  if (!TP || !TP.resolved) return;
  TP.r++;
  if (TP.r >= TP.rounds.length){
    TP.r = TP.rounds.length - 1; TP.done = true; TP.cls = 'ok';
    TP.msg = { es:'Los tres casos comparten un criterio: la acción sirve cuando alcanza a quien decide, deja constancia y se apoya en evidencia.',
               en:'The three cases share one criterion: the action works when it reaches whoever decides, leaves a record and rests on evidence.' };
  } else {
    TP.tries = 0; TP.resolved = false; TP.state = [0,0,0,0]; TP.cls = '';
    TP.msg = { es:'Caso nuevo. Pregúntate quién tiene aquí la obligación de responder.',
               en:'New case. Ask yourself who has the duty to answer here.' };
  }
  tpRender();
}

/* ================================================
   WIDGET 3 · CONSTRUCTOR DE RUTA
   The seven steps of an action route arrive shuffled. Each tap adds a step to
   the live sequence; a step chosen too early answers with what it still lacks
   and the route restarts. Third miss reveals the whole route (Rule 8, A).
   ================================================ */
var RT = null;
function buildRuta(rng){
  var steps = [
    { es:'Nombrar el derecho afectado y a quiénes alcanza', en:'Name the affected right and who it reaches',
      need:{ es:'sin saber qué derecho está en juego, todo lo demás queda sin rumbo.', en:'without knowing which right is at stake, everything else has no direction.' } },
    { es:'Reunir evidencia fechada y verificable del problema', en:'Gather dated and verifiable evidence of the problem',
      need:{ es:'antes hace falta saber qué derecho se documenta.', en:'first you need to know which right is being documented.' } },
    { es:'Identificar quién tiene la obligación de responder', en:'Identify who has the duty to answer',
      need:{ es:'antes hace falta la evidencia que muestra de qué se le va a pedir cuentas.', en:'first you need the evidence that shows what they will be held to account for.' } },
    { es:'Redactar una petición concreta con plazo de respuesta', en:'Write a concrete petition with a response deadline',
      need:{ es:'antes hace falta saber a quién se dirige la petición.', en:'first you need to know who the petition is addressed to.' } },
    { es:'Sumar aliados y a las personas directamente afectadas', en:'Bring in allies and the people directly affected',
      need:{ es:'antes hace falta tener redactado qué se pide, para invitar a respaldar algo definido.', en:'first the demand has to be written, so that people are invited to back something definite.' } },
    { es:'Entregar la petición por una vía formal que deje acuse', en:'Deliver the petition through a formal route that leaves a receipt',
      need:{ es:'antes conviene sumar respaldo, porque una petición acompañada pesa más al entregarse.', en:'gathering support comes first, because a backed petition weighs more when delivered.' } },
    { es:'Dar seguimiento en las fechas acordadas y hacer público el resultado', en:'Follow up on the agreed dates and make the result public',
      need:{ es:'antes hace falta entregar la petición: no se puede dar seguimiento a lo que no se presentó.', en:'the petition has to be delivered first: you cannot follow up on what was never filed.' } }
  ];
  RT = { order:steps, pool:shuffle(steps, rng), placed:[], tries:0, done:false,
         msg:{ es:'Toca el paso con el que empieza cualquier acción bien armada.', en:'Tap the step any well built action begins with.' }, cls:'' };
  return '<div class="wgt" id="rtw">' +
    '<div class="wgt-h">' + S('Constructor de ruta','Route builder') + '</div>' +
    '<div class="wgt-q">' + S('Arma la ruta de la acción tocando los pasos en el orden que los sostiene.','Build the action route by tapping the steps in the order that holds them up.') + '</div>' +
    '<div class="wsub">' + S('Tu ruta','Your route') + '</div>' +
    '<div class="seq" id="rtseq"></div>' +
    '<div class="wsub">' + S('Pasos disponibles','Available steps') + '</div>' +
    '<div id="rtpool"></div>' +
    '<div class="wmsg" id="rtmsg"></div>' +
    '<button class="wbtn alt" onclick="rtReset()">' + S('Rehacer la ruta','Rebuild the route') + '</button>' +
    '<div class="wprog" id="rtprog"></div>' +
  '</div>';
}
function rtRender(){
  var seq = document.getElementById('rtseq');
  if (!seq || !RT) return;
  seq.innerHTML = RT.placed.length
    ? RT.placed.map(function(s,i){ return '<div class="seqitem">' + (i+1) + '. ' + s[LANG] + '</div>'; }).join('')
    : '<div class="wprog" style="color:var(--text3)">' + S('Tu ruta está vacía.','Your route is empty.') + '</div>';
  document.getElementById('rtpool').innerHTML = RT.pool.map(function(s,i){
    var used = RT.placed.indexOf(s) >= 0;
    return '<div class="step' + (used ? ' done' : '') + '" onclick="rtTap(' + i + ')">' + s[LANG] + '</div>';
  }).join('');
  var m = document.getElementById('rtmsg');
  m.className = 'wmsg' + (RT.cls ? ' ' + RT.cls : '');
  m.innerHTML = RT.msg[LANG];
  document.getElementById('rtprog').textContent = S('Pasos en su lugar: ','Steps in place: ') + RT.placed.length + ' / ' + RT.order.length;
}
function rtTap(i){
  if (!RT || RT.done) return;
  var s = RT.pool[i];
  if (RT.placed.indexOf(s) >= 0) return;
  var expected = RT.order[RT.placed.length];
  if (s === expected){
    RT.placed.push(s);
    if (RT.placed.length === RT.order.length){
      RT.done = true; RT.cls = 'ok';
      RT.msg = { es:'Ruta completa. Cada paso existe porque el siguiente lo necesita: sin evidencia no hay a quién exigir, y sin entrega formal no hay nada que seguir.',
                 en:'Route complete. Each step exists because the next one needs it: with no evidence there is nobody to hold accountable, and with no formal delivery there is nothing to follow up.' };
    } else {
      RT.cls = 'ok';
      RT.msg = { es:'Ese paso ya tiene lo que necesita. Faltan ' + (RT.order.length - RT.placed.length) + '.',
                 en:'That step already has what it needs. ' + (RT.order.length - RT.placed.length) + ' to go.' };
    }
  } else {
    RT.tries++;
    if (RT.tries >= 3){
      RT.placed = RT.order.slice(); RT.done = true; RT.cls = 'warn';
      RT.msg = { es:'Esta es la ruta completa. Léela como una cadena: cada paso entrega al siguiente aquello sin lo cual no se sostiene.',
                 en:'This is the full route. Read it as a chain: each step hands the next one what it cannot stand without.' };
    } else {
      RT.placed = []; RT.cls = 'bad';
      RT.msg = { es:'Ese paso llega demasiado pronto: ' + s.need.es + ' La ruta vuelve a empezar.',
                 en:'That step arrives too early: ' + s.need.en + ' The route starts over.' };
    }
  }
  rtRender();
}
function rtReset(){
  if (!RT || RT.done) return;
  RT.placed = []; RT.cls = '';
  RT.msg = { es:'Ruta vacía otra vez. Empieza por lo que da rumbo a todo lo demás.', en:'Empty route again. Start with what gives direction to everything else.' };
  rtRender();
}

/* ================================================
   WIDGET 4 · MEDIDOR DE LA ACCIÓN
   Sliders and a target selector move three meters in real time: legitimacy,
   reach and staying power. The message always names the weakest meter and how
   to lift it. Third check without reaching the goal reveals a working
   combination (Rule 8, A).
   ================================================ */
var MT = null;
function buildMedidor(rng){
  MT = { p:pick([10,20,30], rng), e:pick([1,2,3], rng), c:pick([2,3,4], rng), d:0, tries:0, done:false,
         msg:{ es:'Mueve los controles y observa cuál de los tres medidores se queda atrás.', en:'Move the controls and watch which of the three meters lags behind.' }, cls:'' };
  return '<div class="wgt" id="mtw">' +
    '<div class="wgt-h">' + S('Medidor de la acción','Action meter') + '</div>' +
    '<div class="wgt-q">' + S('Un colectivo prepara su acción. Ajusta las decisiones hasta que los tres medidores pasen de 70.','A collective is preparing its action. Adjust the decisions until the three meters go above 70.') + '</div>' +
    '<div class="sldrow">' +
      '<div class="sldlbl"><span>' + S('Personas afectadas que participan en las decisiones','Affected people taking part in the decisions') + '</span><span class="sldval" id="mtpv"></span></div>' +
      '<input type="range" min="0" max="100" step="10" id="mtp" oninput="mtSet(\'p\',this.value)">' +
    '</div>' +
    '<div class="sldrow">' +
      '<div class="sldlbl"><span>' + S('Casos documentados con fecha','Cases documented with a date') + '</span><span class="sldval" id="mtev"></span></div>' +
      '<input type="range" min="0" max="10" step="1" id="mte" oninput="mtSet(\'e\',this.value)">' +
    '</div>' +
    '<div class="sldrow">' +
      '<div class="sldlbl"><span>' + S('Semanas de seguimiento previstas','Weeks of follow up planned') + '</span><span class="sldval" id="mtcv"></span></div>' +
      '<input type="range" min="0" max="24" step="1" id="mtc" oninput="mtSet(\'c\',this.value)">' +
    '</div>' +
    '<div class="wsub">' + S('¿A quién se entrega la petición?','Who receives the petition?') + '</div>' +
    '<div class="tri" id="mttri"></div>' +
    '<div style="margin-top:.9rem">' +
      '<div class="mtr"><div class="mtrlbl"><span>' + S('Legitimidad','Legitimacy') + '</span><span id="mtl1"></span></div><div class="mtrtrack"><div class="mtrfill" id="mtf1"></div></div></div>' +
      '<div class="mtr"><div class="mtrlbl"><span>' + S('Alcance','Reach') + '</span><span id="mtl2"></span></div><div class="mtrtrack"><div class="mtrfill" id="mtf2"></div></div></div>' +
      '<div class="mtr"><div class="mtrlbl"><span>' + S('Continuidad','Staying power') + '</span><span id="mtl3"></span></div><div class="mtrtrack"><div class="mtrfill" id="mtf3"></div></div></div>' +
    '</div>' +
    '<div class="wmsg" id="mtmsg"></div>' +
    '<button class="wbtn" onclick="mtCheck()">' + S('Presentar la acción','Present the action') + '</button>' +
  '</div>';
}
function mtScores(){
  var leg = Math.min(100, Math.round(0.75 * MT.p + (MT.e >= 4 ? 25 : MT.e * 6)));
  var alc = Math.min(100, (MT.d === 2 ? 60 : MT.d === 1 ? 30 : 10) + MT.e * 4);
  var con = Math.min(100, MT.c * 4 + (MT.p >= 50 ? 20 : 0));
  return [leg, alc, con];
}
function mtRender(){
  var tri = document.getElementById('mttri');
  if (!tri || !MT) return;
  document.getElementById('mtp').value = MT.p;
  document.getElementById('mte').value = MT.e;
  document.getElementById('mtc').value = MT.c;
  document.getElementById('mtpv').textContent = MT.p + '%';
  document.getElementById('mtev').textContent = MT.e;
  document.getElementById('mtcv').textContent = MT.c;
  var labels = [
    S('El grupo de amigos del colectivo','The friend group of the collective'),
    S('Una figura pública con muchos seguidores','A public figure with many followers'),
    S('La autoridad que decide sobre el asunto','The authority that decides on the matter')
  ];
  tri.innerHTML = labels.map(function(l,i){
    return '<div class="tribtn' + (MT.d === i ? ' sel' : '') + '" onclick="mtSet(\'d\',' + i + ')">' + l + '</div>';
  }).join('');
  var s = mtScores();
  [1,2,3].forEach(function(n){
    var v = s[n-1];
    document.getElementById('mtl' + n).textContent = v;
    var f = document.getElementById('mtf' + n);
    f.style.width = v + '%';
    f.className = 'mtrfill' + (v >= 70 ? ' ok' : v < 40 ? ' low' : '');
  });
  var m = document.getElementById('mtmsg');
  m.className = 'wmsg' + (MT.cls ? ' ' + MT.cls : '');
  m.innerHTML = MT.msg[LANG];
}
function mtSet(k, v){
  if (!MT || MT.done) return;
  MT[k] = parseInt(v, 10);
  var s = mtScores();
  if (s[0] >= 70 && s[1] >= 70 && s[2] >= 70){
    MT.cls = 'warn';
    MT.msg = { es:'Los tres medidores están arriba de 70. Presenta la acción para confirmarlo.',
               en:'The three meters are above 70. Present the action to confirm it.' };
  } else if (s[0] <= s[1] && s[0] <= s[2]){
    MT.cls = '';
    MT.msg = { es:'La legitimidad va a la zaga: sube cuando quienes viven el problema participan en las decisiones y cuando hay casos documentados.',
               en:'Legitimacy is lagging: it rises when the people living the problem take part in the decisions and when there are documented cases.' };
  } else if (s[1] <= s[2]){
    MT.cls = '';
    MT.msg = { es:'El alcance va a la zaga: depende de que la petición llegue a quien tiene la facultad de decidir, no solo a quien la comparte.',
               en:'Reach is lagging: it depends on the petition arriving at whoever has the power to decide, not only at whoever shares it.' };
  } else {
    MT.cls = '';
    MT.msg = { es:'La continuidad va a la zaga: sin semanas de seguimiento el compromiso se apaga cuando baja la atención.',
               en:'Staying power is lagging: with no weeks of follow up the commitment fades once attention drops.' };
  }
  mtRender();
}
function mtCheck(){
  if (!MT || MT.done) return;
  var s = mtScores();
  if (s[0] >= 70 && s[1] >= 70 && s[2] >= 70){
    MT.done = true; MT.cls = 'ok';
    MT.msg = { es:'Acción sólida: la sostienen quienes viven el problema, llega a quien decide y tiene un seguimiento con fechas. Esas tres piezas juntas son las que producen resultados.',
               en:'A solid action: it is held up by the people living the problem, it reaches whoever decides and it has a dated follow up. Those three pieces together are what produce results.' };
  } else {
    MT.tries++;
    if (MT.tries >= 3){
      MT.p = 80; MT.e = 6; MT.c = 15; MT.d = 2; MT.done = true; MT.cls = 'warn';
      MT.msg = { es:'Así queda una combinación que funciona: la mayoría de las personas afectadas decide, hay varios casos documentados, la petición va a la autoridad que decide y el seguimiento cubre varios meses.',
                 en:'Here is a combination that works: most of the affected people decide, several cases are documented, the petition goes to the authority that decides and the follow up covers several months.' };
    } else {
      var low = (s[0] <= s[1] && s[0] <= s[2]) ? S('la legitimidad','legitimacy') : (s[1] <= s[2]) ? S('el alcance','reach') : S('la continuidad','staying power');
      MT.cls = 'bad';
      MT.msg = { es:'Todavía no. El medidor más bajo es ' + low + ', y una acción con una pieza floja se detiene ahí. Ajusta y vuelve a presentarla.',
                 en:'Not yet. The lowest meter is ' + low + ', and an action with one loose piece stops right there. Adjust it and present it again.' };
    }
  }
  mtRender();
}

/* ================================================
   WIDGET 5 · FILTRO DE VERIFICACIÓN
   Tap-to-toggle chips, fully reversible. The counter updates on every tap and
   the message names one concrete chip that does not belong or one that is
   missing. Third check reveals the filter (Rule 8, A).
   ================================================ */
var VF = null;
function buildFiltro(rng){
  var chips = [
    { ok:true,  es:'Fecha y lugar exactos del hecho', en:'Exact date and place of the fact',
      why:{ es:'sin fecha y lugar nadie puede confirmarlo ni desmentirlo.', en:'with no date and place nobody can confirm or refute it.' } },
    { ok:true,  es:'Una fuente que se pueda consultar', en:'A source that can be consulted',
      why:{ es:'una afirmación sin origen rastreable no se puede sostener ante nadie.', en:'a claim with no traceable origin cannot be sustained before anyone.' } },
    { ok:true,  es:'Consentimiento de la persona afectada para difundir su caso', en:'Consent from the affected person to share their case',
      why:{ es:'difundir el caso de alguien sin su acuerdo puede exponerlo a un daño mayor.', en:'sharing somebody case without their agreement can expose them to greater harm.' } },
    { ok:true,  es:'Que el mensaje no exponga datos personales de nadie', en:'That the message exposes nobody personal data',
      why:{ es:'los datos personales convierten un reclamo en un señalamiento contra personas concretas.', en:'personal data turn a claim into an accusation against specific people.' } },
    { ok:false, es:'Cuántas veces ha sido reenviado', en:'How many times it has been forwarded',
      why:{ es:'que circule mucho no lo vuelve cierto: un dato falso se reenvía igual de rápido.', en:'wide circulation does not make it true: a false datum is forwarded just as fast.' } },
    { ok:false, es:'Cuántas reacciones acumula la publicación', en:'How many reactions the post has gathered',
      why:{ es:'las reacciones miden atención, no veracidad.', en:'reactions measure attention, not truth.' } },
    { ok:false, es:'Que la imagen se vea impactante', en:'That the image looks striking',
      why:{ es:'el impacto visual persuade sin aportar ninguna prueba.', en:'visual impact persuades without providing any proof.' } },
    { ok:false, es:'Que lo haya enviado alguien conocido del grupo', en:'That somebody known in the group sent it',
      why:{ es:'la confianza en quien reenvía no verifica el contenido que reenvía.', en:'trust in whoever forwards it does not verify what they forward.' } }
  ];
  VF = { chips:shuffle(chips, rng), sel:[], tries:0, done:false,
         msg:{ es:'Selecciona solo lo que permite comprobar si el hecho ocurrió y a quién puede dañar difundirlo.', en:'Select only what makes it possible to check whether the fact happened and who could be harmed by sharing it.' }, cls:'' };
  return '<div class="wgt" id="vfw">' +
    '<div class="wgt-h">' + S('Filtro antes de amplificar','Filter before amplifying') + '</div>' +
    '<div class="wgt-q">' + S('Llega un mensaje que denuncia un caso de discriminación. Elige las cuatro comprobaciones que hacen falta antes de difundirlo.','A message denouncing a case of discrimination arrives. Choose the four checks needed before sharing it.') + '</div>' +
    '<div class="chips" id="vfchips"></div>' +
    '<div class="wmsg" id="vfmsg"></div>' +
    '<button class="wbtn" onclick="vfCheck()">' + S('Aplicar el filtro','Apply the filter') + '</button>' +
    '<button class="wbtn alt" onclick="vfClear()">' + S('Limpiar','Clear') + '</button>' +
    '<div class="wprog" id="vfprog"></div>' +
  '</div>';
}
function vfRender(){
  var box = document.getElementById('vfchips');
  if (!box || !VF) return;
  box.innerHTML = VF.chips.map(function(c,i){
    var cls = 'chip';
    if (VF.done) cls += c.ok ? ' good' : (VF.sel.indexOf(i) >= 0 ? ' miss' : '');
    else if (VF.sel.indexOf(i) >= 0) cls += ' sel';
    return '<div class="' + cls + '" onclick="vfTap(' + i + ')">' + c[LANG] + '</div>';
  }).join('');
  var m = document.getElementById('vfmsg');
  m.className = 'wmsg' + (VF.cls ? ' ' + VF.cls : '');
  m.innerHTML = VF.msg[LANG];
  document.getElementById('vfprog').textContent = S('Seleccionadas: ','Selected: ') + VF.sel.length + ' / 4';
}
function vfTap(i){
  if (!VF || VF.done) return;
  var k = VF.sel.indexOf(i);
  if (k >= 0) VF.sel.splice(k, 1); else VF.sel.push(i);
  VF.cls = '';
  VF.msg = VF.sel.length === 4
    ? { es:'Ya tienes cuatro. Aplica el filtro para ver si son las que sostienen la difusión.', en:'You already have four. Apply the filter to see whether these are the ones that hold the sharing up.' }
    : { es:'Puedes tocar de nuevo una tarjeta para quitarla. Faltan ' + (4 - VF.sel.length > 0 ? (4 - VF.sel.length) : 0) + ' por elegir.',
        en:'You can tap a card again to remove it. ' + (4 - VF.sel.length > 0 ? (4 - VF.sel.length) : 0) + ' still to choose.' };
  vfRender();
}
function vfClear(){
  if (!VF || VF.done) return;
  VF.sel = []; VF.cls = '';
  VF.msg = { es:'Filtro vacío. Piensa en qué haría falta para que alguien más pudiera comprobar el hecho.', en:'Empty filter. Think about what somebody else would need in order to check the fact.' };
  vfRender();
}
function vfCheck(){
  if (!VF || VF.done) return;
  var wrong = VF.sel.filter(function(i){ return !VF.chips[i].ok; });
  var missing = [];
  VF.chips.forEach(function(c,i){ if (c.ok && VF.sel.indexOf(i) < 0) missing.push(i); });
  if (VF.sel.length === 4 && wrong.length === 0 && missing.length === 0){
    VF.done = true; VF.cls = 'ok';
    VF.msg = { es:'Ese es el filtro. Verificar no frena la denuncia: la protege, porque un solo dato falso le sirve a quien quiere desacreditar todos los casos reales.',
               en:'That is the filter. Verifying does not slow the complaint down: it protects it, because a single false datum serves whoever wants to discredit every real case.' };
  } else {
    VF.tries++;
    if (VF.tries >= 3){
      VF.sel = []; VF.chips.forEach(function(c,i){ if (c.ok) VF.sel.push(i); });
      VF.done = true; VF.cls = 'warn';
      VF.msg = { es:'Estas cuatro son las comprobaciones. Las demás miden popularidad o confianza, y ninguna de esas dos cosas prueba que el hecho haya ocurrido.',
                 en:'These four are the checks. The rest measure popularity or trust, and neither of those proves the fact happened.' };
    } else if (wrong.length){
      VF.cls = 'bad';
      var w = VF.chips[wrong[0]];
      VF.msg = { es:'Una de tus tarjetas no comprueba nada: ' + w.why.es + ' Quítala y busca otra.',
                 en:'One of your cards checks nothing: ' + w.why.en + ' Remove it and look for another.' };
      VF.sel = VF.sel.filter(function(i){ return VF.chips[i].ok; });
    } else {
      VF.cls = 'bad';
      var mss = VF.chips[missing[0]];
      VF.msg = { es:'Te falta una comprobación: ' + mss.why.es + ' Búscala entre las tarjetas.',
                 en:'One check is missing: ' + mss.why.en + ' Look for it among the cards.' };
    }
  }
  vfRender();
}

/* ================================================
   buildLesson — concept, manipulative, graded problem, interleaved (Rule 1)
   ================================================ */
function buildLesson(rng) {
  problems = []; answeredCount = 0; correctCount = 0;
  document.getElementById('lessonBody').innerHTML = '';

  /* ── CONCEPTO 1 ─────────────────────────────────────────────── */
  addSection(S('CONCEPTO 1','CONCEPT 1'),
    '<h2>' + S('Los derechos que hoy tienes fueron exigidos antes','The rights you have today were demanded first') + '</h2>' +
    '<p>' + S('Casi ningún derecho apareció escrito por decisión espontánea de una autoridad. El patrón se repite: un grupo excluido descubre que su situación no es un destino sino una injusticia, se organiza, hace pública su demanda y la sostiene durante años. Solo entonces la norma la reconoce. A esa forma de acción colectiva se le llama movimiento social.',
              'Almost no right appeared in writing through the spontaneous decision of an authority. The pattern repeats itself: an excluded group discovers that its situation is not a fate but an injustice, gets organized, makes its demand public and sustains it for years. Only then does the rule recognize it. That form of collective action is called a social movement.') + '</p>' +
    '<p>' + S('Un movimiento social no es cualquier grupo ni cualquier queja. Se reconoce por cuatro rasgos que van juntos: una demanda compartida que va más allá del caso de una persona, continuidad en el tiempo, acción pública y organización interna. Sin esos rasgos hay reclamos legítimos, pero aislados. Con ellos, la demanda llega a convertirse en obligación escrita.',
              'A social movement is not just any group or any complaint. It is recognized by four features that travel together: a shared demand that goes beyond the case of one person, continuity over time, public action and internal organization. Without those features there are legitimate claims, but isolated ones. With them, the demand ends up turning into a written obligation.') + '</p>' +
    '<div class="callout"><p><strong>' + S('Algunos hitos: ','Some milestones: ') + '</strong>' +
      S('el movimiento obrero exigió la jornada de ocho horas desde 1886; la Declaración Universal de los Derechos Humanos se proclamó en 1948; México reconoció el voto de las mujeres en elecciones federales en 1953; el movimiento por los derechos civiles logró la Ley de Derechos Civiles en Estados Unidos en 1964; la Convención sobre los Derechos del Niño se aprobó en 1989; la Convención sobre los Derechos de las Personas con Discapacidad, en 2006; y la Asamblea General de la ONU reconoció el derecho a un medio ambiente sano en 2022.',
        'the labor movement demanded the eight hour working day from 1886; the Universal Declaration of Human Rights was proclaimed in 1948; Mexico recognized the vote of women in federal elections in 1953; the civil rights movement achieved the Civil Rights Act in the United States in 1964; the Convention on the Rights of the Child was adopted in 1989; the Convention on the Rights of Persons with Disabilities, in 2006; and the UN General Assembly recognized the right to a healthy environment in 2022.') + '</p></div>' +
    '<div class="rules-grid">' +
      '<div class="rcard"><div class="rname">' + S('Demanda compartida','Shared demand') + '</div><div class="rform">' + S('¿alcanza a un grupo?','does it reach a group?') + '</div><div class="rnote">' + S('No es el caso de una sola persona.','It is not the case of a single person.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Continuidad','Continuity') + '</div><div class="rform">' + S('¿se sostiene en el tiempo?','does it last over time?') + '</div><div class="rnote">' + S('Sobrevive a la atención del momento.','It survives the attention of the moment.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Acción pública','Public action') + '</div><div class="rform">' + S('¿se hace visible?','is it made visible?') + '</div><div class="rnote">' + S('El reclamo sale del ámbito privado.','The claim leaves the private sphere.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Organización','Organization') + '</div><div class="rform">' + S('¿hay acuerdos y tareas?','are there agreements and tasks?') + '</div><div class="rnote">' + S('Alguien responde por cada paso.','Somebody answers for each step.') + '</div></div>' +
    '</div>' +
    buildTimeline(rng));
  tlRender();

  /* ── PROBLEMA 1 ─────────────────────────────────────────────── */
  addProblem(pick([
    { title:{ es:'Qué convierte un reclamo en movimiento', en:'What turns a claim into a movement' }, showWork:false,
      stmt:{ es:'En un municipio ocurren cuatro cosas el mismo año: un vecino escribe una carta a la presidencia municipal por el alumbrado de su calle; una tienda lanza una campaña publicitaria con causas sociales; un grupo de familias de personas con discapacidad se organiza durante tres años, documenta casos, presenta peticiones y consigue que se apruebe una norma de accesibilidad; y un club privado organiza su comida anual. ¿Cuál de las cuatro corresponde a un movimiento social?',
             en:'Four things happen in one town in the same year: a neighbor writes a letter to the town hall about the street lighting; a store launches an advertising campaign with social causes; a group of families of persons with disabilities organizes for three years, documents cases, files petitions and gets an accessibility rule approved; and a private club holds its annual dinner. Which of the four corresponds to a social movement?' },
      options:{ es:[
        'El grupo de familias, porque sostiene durante años una demanda compartida, actúa en público y busca cambiar una regla que afecta a muchas personas.',
        'La carta del vecino, porque expresa una inconformidad dirigida a la autoridad que puede resolver el problema planteado.',
        'La campaña de la tienda, porque difunde causas sociales entre un público amplio y con recursos propios considerables.',
        'El club privado, porque reúne de manera constante y organizada a un grupo de personas con intereses comunes.' ],
        en:[
        'The group of families, because it sustains a shared demand for years, acts in public and seeks to change a rule affecting many people.',
        'The letter from the neighbor, because it voices a complaint addressed to the authority that can solve the problem raised.',
        'The store campaign, because it spreads social causes among a wide audience and with considerable resources of its own.',
        'The private club, because it gathers a group of people with common interests in a constant and organized way.' ] },
      correct:0,
      hint:{ es:'Revisa los cuatro rasgos juntos: demanda compartida, continuidad, acción pública y organización.',
             en:'Check the four features together: shared demand, continuity, public action and organization.' },
      explanation:{ es:'Un movimiento social sostiene una demanda compartida durante el tiempo, actúa públicamente y busca cambiar una regla o una práctica que afecta a un grupo. La carta es una acción individual y aislada, la campaña persigue un fin comercial y el club se reúne sin plantear ninguna demanda pública, aunque esté bien organizado.',
                    en:'A social movement sustains a shared demand over time, acts publicly and seeks to change a rule or a practice affecting a group. The letter is an individual and isolated action, the campaign pursues a commercial goal and the club gathers without raising any public demand, however well organized it may be.' } },
    { title:{ es:'Qué convierte un reclamo en movimiento', en:'What turns a claim into a movement' }, showWork:false,
      stmt:{ es:'Una organización estudiantil de la región lleva cinco años reuniendo firmas, publicando informes y acudiendo a las sesiones del cabildo para pedir transporte seguro. En un debate, alguien afirma que eso no es un movimiento social porque nunca ha realizado una marcha. ¿Cuál respuesta corrige mejor esa afirmación?',
             en:'A student organization in the region has spent five years collecting signatures, publishing reports and attending town council sessions to ask for safe transport. In a debate, somebody claims that is not a social movement because it has never held a march. Which answer best corrects that claim?' },
      options:{ es:[
        'Lo que define a un movimiento es sostener una demanda compartida con acción pública y organizada, y la marcha es solo una de las formas posibles de hacerlo.',
        'La afirmación es correcta, porque sin marchas ninguna demanda logra la visibilidad suficiente para llegar a las autoridades del municipio.',
        'La afirmación es correcta, porque reunir firmas y publicar informes son trámites administrativos y no verdaderas formas de participación.',
        'Lo que define a un movimiento es el número de integrantes, y cinco años de trabajo no bastan cuando el grupo que actúa es pequeño.' ],
        en:[
        'What defines a movement is sustaining a shared demand with public and organized action, and a march is only one of the possible ways of doing it.',
        'The claim is correct, because without marches no demand gains enough visibility to reach the authorities of the town.',
        'The claim is correct, because collecting signatures and publishing reports are administrative procedures and not real forms of participation.',
        'What defines a movement is the number of members, and five years of work is not enough when the acting group is small.' ] },
      correct:0,
      hint:{ es:'Separa el rasgo que define a un movimiento de las formas concretas que puede tomar su acción.',
             en:'Separate the feature that defines a movement from the concrete forms its action can take.' },
      explanation:{ es:'La marcha es parte del repertorio de acción, no la definición del movimiento. Firmar, documentar, publicar informes y acudir a sesiones públicas son acciones organizadas y visibles que sostienen una demanda compartida durante cinco años. Las otras respuestas confunden una forma de acción con la definición, o miden el movimiento por su tamaño.',
                    en:'A march is part of the action repertoire, not the definition of the movement. Signing, documenting, publishing reports and attending public sessions are organized and visible actions that have sustained a shared demand for five years. The other answers confuse one form of action with the definition, or measure the movement by its size.' } }
  ], rng), rng);

  /* ── PROBLEMA 2 ─────────────────────────────────────────────── */
  addProblem(pick([
    { title:{ es:'De la demanda a la norma', en:'From demand to rule' }, showWork:false,
      stmt:{ es:'En una discusión, alguien sostiene que los derechos que hoy tenemos fueron concedidos por los gobiernos por iniciativa propia, cuando les pareció oportuno. ¿Qué evidencia histórica pone en duda esa idea?',
             en:'In a discussion, somebody argues that the rights we have today were granted by governments on their own initiative, whenever they saw fit. Which historical evidence casts doubt on that idea?' },
      options:{ es:[
        'Que derechos como el voto de las mujeres o la jornada laboral limitada quedaron escritos después de décadas de organización y demanda pública de quienes estaban excluidos.',
        'Que los gobiernos han firmado numerosos tratados internacionales sobre derechos humanos en distintas épocas y regiones del mundo.',
        'Que los textos constitucionales cambian con frecuencia y por eso ningún derecho permanece redactado de la misma forma mucho tiempo.',
        'Que las personas conocen hoy sus derechos mucho mejor que en el pasado gracias a la educación escolar obligatoria.' ],
        en:[
        'That rights such as the vote of women or the limited working day were written down after decades of organizing and public demand by those who were excluded.',
        'That governments have signed numerous international human rights treaties in different periods and regions of the world.',
        'That constitutional texts change frequently and therefore no right stays worded the same way for long.',
        'That people today know their rights much better than in the past thanks to compulsory school education.' ] },
      correct:0,
      hint:{ es:'Pregúntate quién sostuvo la demanda antes de que el derecho quedara escrito.',
             en:'Ask yourself who sustained the demand before the right was written down.' },
      explanation:{ es:'La historia muestra un patrón constante: primero un grupo excluido se organiza y hace pública su demanda, y solo después la norma la reconoce. En México el voto de las mujeres en elecciones federales se reconoció en 1953 tras décadas de exigencia organizada. Las otras opciones describen hechos ciertos que no dicen nada sobre el origen de la demanda.',
                    en:'History shows a constant pattern: first an excluded group organizes and makes its demand public, and only afterwards does the rule recognize it. In Mexico the vote of women in federal elections was recognized in 1953 after decades of organized demand. The other options describe true facts that say nothing about where the demand came from.' } },
    { title:{ es:'De la demanda a la norma', en:'From demand to rule' }, showWork:false,
      stmt:{ es:'Dos movimientos obtienen resultados distintos. El primero consigue que la autoridad reconozca públicamente su reclamo en un discurso y nada más. El segundo consigue que el reclamo quede escrito en una norma, con obligaciones y plazos. ¿Cuál es la diferencia decisiva entre ambos resultados?',
             en:'Two movements obtain different results. The first gets the authority to recognize its claim publicly in a speech and nothing else. The second gets the claim written into a rule, with obligations and deadlines. What is the decisive difference between the two results?' },
      options:{ es:[
        'La norma crea una obligación exigible que sigue en pie aunque cambien las personas en el cargo, mientras el discurso depende de la voluntad de quien lo pronunció.',
        'El discurso llega a más personas que el texto de una norma, así que su efecto sobre la opinión pública resulta más duradero con el paso del tiempo.',
        'La norma tarda mucho más tiempo en redactarse y aprobarse, y por eso demuestra un compromiso mayor de la autoridad con el reclamo recibido.',
        'El discurso deja abierta la negociación posterior, mientras la norma cierra la posibilidad de seguir dialogando con la autoridad sobre el asunto.' ],
        en:[
        'The rule creates an enforceable duty that stands even when the people in office change, while the speech depends on the will of whoever gave it.',
        'The speech reaches more people than the text of a rule, so its effect on public opinion turns out more lasting as time goes by.',
        'The rule takes much longer to draft and approve, and therefore shows a greater commitment of the authority to the claim it received.',
        'The speech leaves later negotiation open, while the rule closes the possibility of continuing to talk with the authority about the matter.' ] },
      correct:0,
      hint:{ es:'Piensa qué queda del resultado cuando la persona que gobierna cambia de cargo.',
             en:'Think about what remains of the result when the person governing changes office.' },
      explanation:{ es:'El objetivo de un movimiento no es ser escuchado una vez, sino que la demanda se vuelva obligación. Una norma se puede exigir, tiene plazos y sobrevive al cambio de titulares; un reconocimiento verbal se agota con quien lo pronunció. Las demás opciones comparan difusión, tiempo de trámite o apertura al diálogo, y ninguna toca el carácter exigible del resultado.',
                    en:'The goal of a movement is not to be heard once, but for the demand to become an obligation. A rule can be enforced, has deadlines and survives changes of office holders; a verbal recognition runs out with whoever pronounced it. The other options compare outreach, processing time or openness to dialogue, and none touches the enforceable nature of the result.' } }
  ], rng), rng);

  /* ── CONCEPTO 2 ─────────────────────────────────────────────── */
  addSection(S('CONCEPTO 2','CONCEPT 2'),
    '<h2>' + S('El repertorio: qué se puede hacer y con qué alcance','The repertoire: what can be done and how far it reaches') + '</h2>' +
    '<p>' + S('Participar no se reduce a opinar. Existe un repertorio de acciones pacíficas y legales que los movimientos combinan según el caso: documentar con fechas, solicitar información pública, presentar una petición por escrito con acuse de recibido, acudir a una asamblea o consulta, formar alianzas con otros grupos afectados, difundir información verificada, acompañar a la persona afectada y, cuando la vía ordinaria se agota, presentar una queja ante el organismo público de derechos humanos.',
              'Taking part is not reduced to voicing an opinion. There is a repertoire of peaceful and lawful actions that movements combine depending on the case: documenting with dates, requesting public information, filing a written petition with a stamped receipt, attending an assembly or consultation, building alliances with other affected groups, spreading verified information, accompanying the affected person and, when the ordinary route is exhausted, filing a complaint with the public human rights body.') + '</p>' +
    '<p>' + S('Ninguna acción es buena o mala en abstracto: sirve o no sirve para el caso. Cuatro preguntas ayudan a elegir. ¿Llega a quien tiene la obligación de responder, o solo a quien simpatiza? ¿Deja constancia con fecha, o se pierde en una conversación? ¿Se apoya en evidencia verificable, o en una impresión? ¿Respeta los derechos de terceras personas, o los sacrifica para hacerse notar? Una acción que falla en la primera pregunta puede repetirse durante meses sin mover nada.',
              'No action is good or bad in the abstract: it either works for the case or it does not. Four questions help to choose. Does it reach whoever has the duty to answer, or only those who sympathize? Does it leave a dated record, or does it vanish in a conversation? Does it rest on verifiable evidence, or on an impression? Does it respect the rights of third parties, or sacrifice them to get noticed? An action that fails the first question can be repeated for months without moving anything.') + '</p>' +
    '<div class="callout"><p><strong>' + S('Sujeto obligado: ','Duty bearer: ') + '</strong>' +
      S('la persona o institución que, por su cargo o sus facultades, tiene que responder por ese derecho. Identificarla es lo que separa un reclamo que avanza de uno que se repite.',
        'the person or institution that, because of their office or powers, has to answer for that right. Identifying them is what separates a claim that advances from one that repeats itself.') + '</p></div>' +
    buildTools(rng));
  tpRender();

  /* ── PROBLEMA 3 ─────────────────────────────────────────────── */
  addProblem(pick([
    { title:{ es:'A quién se dirige el reclamo', en:'Who the claim is addressed to' }, showWork:false,
      stmt:{ es:'En una secundaria el laboratorio lleva un año cerrado. Los estudiantes publican fotografías en redes durante semanas y reúnen cientos de comentarios de apoyo, pero la situación sigue igual. ¿Qué acción atiende mejor lo que le falta a su estrategia?',
             en:'At a secondary school the laboratory has been closed for a year. Students post photos on social media for weeks and gather hundreds of supportive comments, but the situation stays the same. Which action best addresses what their strategy is missing?' },
      options:{ es:[
        'Entregar por escrito y con acuse una solicitud a la autoridad escolar que decide sobre el laboratorio, con la evidencia reunida y una fecha de respuesta.',

        en:[
        'Deliver a written request with a stamped receipt to the school authority that decides about the laboratory, with the gathered evidence and a response date.',

      explanation:{ es:'La difusión visibiliza, pero no obliga a nadie a contestar. Una solicitud entregada con acuse a quien tiene la facultad de decidir crea un registro y una fecha, y convierte el reclamo en un asunto que debe responderse. La colecta traslada a las familias una obligación que no les corresponde, y esperar deja el problema sin nadie que responda por él.',
                    en:'Spreading the word makes things visible, but obliges nobody to answer. A request delivered with a receipt to whoever holds the power to decide creates a record and a date, and turns the claim into a matter that must be answered. The collection shifts onto families a duty that is not theirs, and waiting leaves the problem with nobody answering for it.' } },
    { title:{ es:'La vía que deja constancia', en:'The route that leaves a record' }, showWork:false,
      stmt:{ es:'Una familia reclama de palabra, cada semana y ante distintas personas de la escuela, que su hija no recibe los apoyos que necesita para sus clases. Cada quien responde algo distinto y el asunto no avanza. ¿Qué cambio en su forma de actuar resulta más útil?',
             en:'A family complains verbally, every week and to different people at school, that their daughter is not receiving the support she needs for her classes. Each person answers something different and the matter does not advance. Which change in the way they act turns out most useful?' },
      options:{ es:[
        'Presentar una solicitud escrita dirigida a la persona responsable, con los hechos fechados y una petición concreta, y conservar el acuse de recibido.',
        'Insistir con mayor frecuencia y ante más personas del plantel hasta que alguna de ellas decida ocuparse del caso de la estudiante.',

        en:[

        'Insist more often and before more people at the school until one of them decides to take care of the case of the student.',

      explanation:{ es:'El reclamo no avanza porque no tiene destinatario ni registro: sin ambos, cada respuesta improvisada sustituye a la anterior. Una solicitud escrita con acuse fija quién debe responder, qué se pide y desde cuándo. Sumar a otras familias fortalece un reclamo, pero por sí solo no resuelve la falta de un destinatario, y cambiar de grupo traslada el costo a la estudiante.',
                    en:'The claim does not advance because it has no addressee and no record: without both, each improvised answer replaces the previous one. A written request with a receipt fixes who must answer, what is asked and since when. Bringing in other families strengthens a claim, but on its own it does not solve the lack of an addressee, and changing class shifts the cost onto the student.' } }

  addProblem(pick([

             en:'A student collective decides to protest about the lack of water at school and weighs four ways of doing it. Which one sustains their claim without affecting the rights of other people?' },
      options:{ es:[

        'Publicar los datos personales y el domicilio del personal administrativo para presionarlo directamente en su vida diaria.',

             en:'Check whether the chosen means cancels somebody else right or rests on unverified data.' },
      explanation:{ es:'Protestar es un derecho, y su ejercicio se sostiene cuando no anula derechos de terceras personas ni se apoya en información falsa. Reunirse en el receso y entregar una petición firmada mantiene el reclamo en pie sin impedir el estudio de nadie. Bloquear la entrada afecta el derecho a la educación de todo el plantel, exponer datos personales pone en riesgo a personas concretas y difundir cifras sin verificar destruye la credibilidad del propio reclamo.',
                    en:'Protesting is a right, and its exercise holds up when it does not cancel the rights of third parties and does not rest on false information. Meeting during break and delivering a signed petition keeps the claim standing without preventing anybody from studying. Blocking the entrance affects the right to education of the whole school, exposing personal data puts specific people at risk and spreading unverified figures destroys the credibility of the claim itself.' } },
    { title:{ es:'Cuando el medio contradice el fin', en:'When the means contradicts the goal' }, showWork:false,
      stmt:{ es:'En una asamblea escolar alguien propone difundir el nombre y las fotografías de estudiantes señalados de acoso, sin que exista todavía ninguna investigación. Otra persona se opone. ¿Qué razón sostiene mejor esa oposición desde los derechos humanos?',
             en:'At a school assembly somebody proposes sharing the names and photos of students accused of bullying, with no investigation carried out yet. Another person objects. Which reason best supports that objection from a human rights standpoint?' },
      options:{ es:[
        'Señalar públicamente a alguien sin investigación previa vulnera su presunción de inocencia y puede dañar de forma irreversible a quien resulte ajeno a los hechos.',
        'La difusión de nombres no lograría suficiente atención pública y por eso resultaría un esfuerzo poco eficaz para el objetivo del grupo.',
        'La asamblea escolar no es el espacio adecuado para tratar asuntos que corresponden por completo al ámbito de las familias.',
        'La escuela debería atender primero otros problemas más urgentes de la comunidad antes de ocuparse de este asunto en particular.' ],
        en:[
        'Publicly pointing at somebody with no prior investigation violates their presumption of innocence and can irreversibly harm anybody unconnected to the facts.',
        'Sharing names would not achieve enough public attention and would therefore be an ineffective effort for the goal of the group.',
        'The school assembly is not the right space to deal with matters that belong entirely to the sphere of families.',

      correct:0,
      hint:{ es:'Pregúntate qué derecho de la persona señalada queda en juego cuando aún no hay investigación.',
             en:'Ask which right of the person accused is at stake when there is still no investigation.' },
      explanation:{ es:'Defender a quien sufre acoso es una causa legítima, y el medio elegido también debe respetar derechos. La presunción de inocencia protege a cualquiera mientras no exista una investigación que establezca los hechos, y una exhibición pública puede dañar de forma irreversible a personas ajenas. Las demás opciones miden la propuesta por su eficacia, por el espacio o por las prioridades, no por el derecho que estaría en juego.',
                    en:'Defending whoever suffers bullying is a legitimate cause, and the chosen means must respect rights too. The presumption of innocence protects anybody while no investigation has established the facts, and a public exhibition can irreversibly harm unconnected people. The other options measure the proposal by its effectiveness, by the space or by priorities, not by the right that would be at stake.' } }

  addSection(S('CONCEPTO 3','CONCEPT 3'),
    '<h2>' + S('De la inconformidad al plan','From discontent to a plan') + '</h2>' +
    '<p>' + S('Entre sentir que algo está mal y lograr que cambie hay una ruta que se puede aprender. Empieza por nombrar el derecho afectado y a quiénes alcanza, porque eso decide todo lo que sigue. Después viene la evidencia fechada, que convierte una impresión en un hecho difícil de negar. Con la evidencia en la mano se identifica al sujeto obligado, y solo entonces tiene sentido redactar la petición.',
              'Between feeling that something is wrong and getting it to change there is a route that can be learned. It starts by naming the affected right and who it reaches, because that decides everything that follows. Then comes dated evidence, which turns an impression into a fact that is hard to deny. With the evidence in hand the duty bearer is identified, and only then does writing the petition make sense.') + '</p>' +
    '<p>' + S('La petición es la pieza que más veces se redacta mal. Una petición se puede responder cuando dice qué se pide, dónde, quién debe hacerlo y para cuándo. Pedir que se mejore la situación en la medida de lo posible suena razonable y sirve de poco: al vencer el plazo nadie puede decir si se cumplió. Después de redactarla se suman aliados y las personas directamente afectadas, se entrega por una vía que deje acuse y se da seguimiento en las fechas acordadas.',
              'The petition is the piece most often written badly. A petition can be answered when it says what is asked, where, who must do it and by when. Asking that the situation be improved as far as possible sounds reasonable and helps little: when the deadline arrives nobody can say whether it was met. Once written, allies and the directly affected people join in, it is delivered through a route that leaves a receipt, and it is followed up on the agreed dates.') + '</p>' +
    '<div class="callout"><p><strong>' + S('Petición verificable: ','Verifiable petition: ') + '</strong>' +
      S('la que permite que cualquiera diga, al llegar la fecha, si se cumplió o no. Si la respuesta depende de la interpretación de quien la lee, la petición todavía no está terminada.',
        'the one that lets anybody say, when the date arrives, whether it was met or not. If the answer depends on the interpretation of whoever reads it, the petition is not finished yet.') + '</p></div>' +
    buildRuta(rng));
  rtRender();

  addProblem(pick([
    { title:{ es:'La pieza que falta en el plan', en:'The missing piece in the plan' }, showWork:false,
      stmt:{ es:'Un grupo prepara su acción así: reunió setenta firmas, tiene fotografías fechadas del salón sin ventilación y consiguió el apoyo de otros dos grupos. Su texto dice: pedimos que la escuela mejore las condiciones cuando sea posible. ¿Qué debilita más ese plan?',
             en:'A group prepares its action like this: it collected seventy signatures, it has dated photos of the classroom without ventilation and it obtained the support of two other groups. Its text says: we ask the school to improve conditions when possible. What weakens that plan most?' },
      options:{ es:[
        'La petición no dice qué se pide en concreto ni para cuándo, así que al vencer cualquier fecha nadie podrá comprobar si se cumplió.',
        'El número de firmas reunidas resulta bajo frente al total de estudiantes que están inscritos en el plantel este ciclo.',
        'Las fotografías no bastan como evidencia porque no fueron tomadas por una persona con formación técnica en la materia.',
        'El apoyo de otros dos grupos vuelve confuso quién encabeza la petición cuando la autoridad decida responderla.' ],
        en:[
        'The petition does not say what exactly is asked or by when, so when any date arrives nobody will be able to check whether it was met.',
        'The number of signatures gathered turns out low compared with the total of students enrolled at the school this year.',
        'The photos are not enough as evidence because they were not taken by a person with technical training in the matter.',
        'The support of two other groups makes it confusing who leads the petition when the authority decides to answer it.' ] },
      correct:0,
      hint:{ es:'Revisa si al llegar una fecha alguien podría decir con certeza que la petición se cumplió.',
             en:'Check whether, when a date arrives, somebody could say with certainty that the petition was met.' },
      explanation:{ es:'Un petitorio se sostiene cuando es concreto y verificable: qué se pide, a quién y para cuándo. Mejorar las condiciones cuando sea posible no permite comprobar nada después, y por eso cualquier respuesta parcial puede presentarse como cumplimiento. Las firmas, las fotografías fechadas y las alianzas son fortalezas de ese plan, no sus debilidades.',
                    en:'A petition holds up when it is concrete and verifiable: what is asked, from whom and by when. Improving conditions when possible allows nothing to be checked afterwards, and therefore any partial answer can be presented as compliance. The signatures, the dated photos and the alliances are strengths of that plan, not its weaknesses.' } },
    { title:{ es:'El destinatario correcto', en:'The right addressee' }, showWork:false,
      stmt:{ es:'Un colectivo documentó durante tres meses que la parada de autobús junto a la escuela no tiene alumbrado, reunió testimonios y redactó una petición clara con plazo. Decidió entregarla a la sociedad de alumnos. Un mes después no ha ocurrido nada. ¿Qué explica mejor ese resultado?',
             en:'A collective documented for three months that the bus stop next to the school has no lighting, gathered testimonies and wrote a clear petition with a deadline. It decided to deliver it to the student council. A month later nothing has happened. What best explains that result?' },
      options:{ es:[
        'La petición se dirigió a una instancia que no tiene la facultad de instalar alumbrado, así que nadie con la obligación de responder quedó interpelado.',
        'El periodo de documentación fue demasiado corto para sostener una petición sobre el alumbrado de una parada de autobús.',
        'Los testimonios pierden valor probatorio cuando provienen de personas que pertenecen a la misma comunidad escolar.',
        'Un mes resulta un plazo insuficiente para que cualquier petición de este tipo reciba una respuesta formal por escrito.' ],
        en:[

        'The documentation period was too short to sustain a petition about the lighting of a bus stop.',

      correct:0,
      hint:{ es:'Revisa si quien recibió la petición tiene la facultad de hacer lo que se pide.',
             en:'Check whether whoever received the petition has the power to do what is asked.' },
      explanation:{ es:'El plan estaba bien armado en evidencia y redacción, y falló en el paso del sujeto obligado: el alumbrado público corresponde a la autoridad municipal, no a la sociedad de alumnos. Una petición impecable entregada a quien no puede resolver no genera ninguna obligación de respuesta. Las otras explicaciones cuestionan el tiempo o los testimonios, que en este caso estaban en orden.',
                    en:'The plan was well built in evidence and drafting, and it failed at the duty bearer step: public lighting belongs to the town authority, not to the student council. A flawless petition delivered to somebody who cannot solve it generates no duty to answer. The other explanations question the time or the testimonies, which in this case were in order.' } }

  addSection(S('CONCEPTO 4','CONCEPT 4'),
    '<h2>' + S('Qué hace fuerte a una acción','What makes an action strong') + '</h2>' +
    '<p>' + S('Dos grupos pueden pedir lo mismo y obtener resultados opuestos. La diferencia suele estar en tres cualidades. La legitimidad viene de que quienes viven el problema participen en las decisiones, no solo como testimonio: el lema nada sobre nosotros sin nosotros, nacido del movimiento de personas con discapacidad, resume esa exigencia. El alcance depende de que la petición llegue a quien tiene la facultad de decidir. Y la continuidad es lo que sostiene el reclamo cuando la atención pública baja, que es siempre.',
              'Two groups can ask for the same thing and obtain opposite results. The difference usually lies in three qualities. Legitimacy comes from the people living the problem taking part in the decisions, not only as testimony: the motto nothing about us without us, born from the movement of persons with disabilities, sums up that demand. Reach depends on the petition arriving at whoever holds the power to decide. And staying power is what sustains the claim when public attention drops, which it always does.') + '</p>' +
    '<p>' + S('Estas tres cualidades no se suman, se multiplican: una acción con una pieza floja se detiene justo ahí. Un plan diseñado sin las personas afectadas produce soluciones que no sirven, aunque estén bien intencionadas. Un plan impecable entregado a quien no decide se queda esperando. Y un plan que se celebra el día de la firma y se abandona después deja el compromiso sin nadie que lo vigile.',
              'These three qualities do not add up, they multiply: an action with one loose piece stops right there. A plan designed without the affected people produces solutions that do not work, however well meant. A flawless plan delivered to somebody who does not decide sits waiting. And a plan celebrated on signing day and abandoned afterwards leaves the commitment with nobody watching it.') + '</p>' +
    buildMedidor(rng));
  mtRender();

        'Decidir por las personas afectadas sin escucharlas produce soluciones que no responden a su experiencia y las coloca como objeto de ayuda en lugar de titulares de un derecho.',

        'Building a ramp represents a high expense for the school and there were other more urgent needs to address first.',

      explanation:{ es:'La participación de quienes viven el problema no es un gesto de cortesía: es lo que hace que la solución sirva. Sin escucharlos, la rampa terminó donde no la necesitan, y el grupo afectado quedó tratado como destinatario de un favor y no como titular de un derecho. Las otras críticas hablan de trámites, costos o técnica, y ninguna toca el problema de fondo.',

    { title:{ es:'Sostener la acción en el tiempo', en:'Sustaining the action over time' }, showWork:false,
