<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Razones Trigonométricas: Seno, Coseno y Tangente</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }

/* ── MANIPULATIVES ── */
.mwrap { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.1rem; }
.mcv { display:block; width:100%; height:260px; touch-action:none; background:var(--surface); border:1px solid var(--border); border-radius:8px; }
.mhead { display:flex; justify-content:space-between; align-items:baseline; gap:.6rem; flex-wrap:wrap; margin-bottom:.45rem; }
.mtitle { font-weight:600; font-size:.95rem; }
.mround { font-family:'IBM Plex Mono',monospace; font-size:.68rem; letter-spacing:.09em; text-transform:uppercase; color:var(--gold); font-weight:600; }
.mtask { font-size:.85rem; color:var(--text2); margin-bottom:.6rem; }
.mrow { display:flex; flex-wrap:wrap; gap:.45rem; align-items:center; margin-top:.6rem; }
.mbtn { background:var(--surface2); border:1.5px solid var(--border); border-radius:8px; padding:.5rem .85rem; font-size:.82rem; cursor:pointer; color:var(--text2); font-family:inherit; min-height:44px; transition:all .14s; }
.mbtn:hover { border-color:var(--green); color:var(--green); }
.mbtn.go { background:var(--green); color:#fff; border-color:var(--green); }
.mbtn.go:hover { background:var(--green-dark); color:#fff; }
.mval { font-family:'IBM Plex Mono',monospace; font-weight:600; color:var(--green); min-width:30px; display:inline-block; text-align:center; font-size:.95rem; }
.mfb { margin-top:.7rem; padding:.6rem .85rem; border-radius:8px; font-size:.84rem; background:var(--surface2); color:var(--text2); border-left:3px solid var(--border); }
.mfb.good { background:var(--ok-bg); color:var(--ok); border-left-color:var(--ok); }
.mfb.near { background:var(--gold-bg); color:var(--text2); border-left-color:var(--gold); }
.mstat { display:grid; grid-template-columns:repeat(3,1fr); gap:.5rem; margin-top:.7rem; }
.mtile { background:var(--surface2); border-radius:8px; padding:.55rem .35rem; text-align:center; border:1.5px solid var(--border); }
.mtile.hit { border-color:var(--ok); background:var(--ok-bg); }
.mtile .tl { font-size:.62rem; text-transform:uppercase; letter-spacing:.05em; color:var(--text3); }
.mtile .tv { font-family:'IBM Plex Mono',monospace; font-size:.9rem; font-weight:600; color:var(--text); }
.mslide { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-top:.7rem; }
.mslide label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.mslide input[type=range] { width:100%; accent-color:var(--green); height:28px; }
.mslide.one { grid-template-columns:1fr; }
.mcard { border:1.5px solid var(--border); border-radius:10px; background:var(--surface2); padding:.85rem; text-align:center; margin:.7rem 0; }
.mcard .cq { font-size:.92rem; font-weight:600; color:var(--text); }
.mcard .cu { font-size:.7rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-top:.25rem; }
.mchips { display:flex; flex-wrap:wrap; gap:.5rem; margin-top:.6rem; }
.mchip { border:1.5px solid var(--border); border-radius:8px; padding:.55rem .8rem; font-size:.82rem; cursor:pointer; background:var(--surface2); color:var(--text2); min-height:44px; flex:1 1 30%; display:flex; align-items:center; justify-content:center; text-align:center; font-family:inherit; }
.mchip:hover { border-color:var(--green); color:var(--green); }
.mprog { font-family:'IBM Plex Mono',monospace; font-size:.7rem; color:var(--text3); letter-spacing:.08em; }
.mlens { font-family:'IBM Plex Mono',monospace; font-size:.72rem; color:var(--text3); margin-top:.5rem; text-align:center; }
.mdone { font-weight:700; color:var(--ok); text-align:center; padding:.7rem; }
@media (max-width:600px){
  .mstat { grid-template-columns:1fr 1fr; }
  .mslide { grid-template-columns:1fr; }
  .mcv { height:225px; }
  .mbtn { font-size:.78rem; padding:.45rem .65rem; }
  .mchip { flex:1 1 100%; }
}
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Razones Trigonométricas: Seno, Coseno y Tangente</div>
    <div class="wcourse" id="wcourse-el">Matemáticas · 3° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>

/* ── Attempt counter + seed (Rule 4): seed = name+group+attempt ── */
function getAttemptKey(name, group){ return 'mat3_t06_g03__att__' + (name+'__'+group).replace(/\s+/g,'_'); }
function nextAttempt(name, group){ var k=getAttemptKey(name,group),n=0; try{n=parseInt(localStorage.getItem(k)||'0',10)||0;}catch(e){} n++; try{localStorage.setItem(k,String(n));}catch(e){} return n; }
function currentAttempt(name, group){ var k=getAttemptKey(name,group); try{return parseInt(localStorage.getItem(k)||'1',10)||1;}catch(e){return 1;} }
/* ================================================
   STATE
   ================================================ */
var studentData   = {};
var problems      = [];

/* ================================================
   SESSION PERSISTENCE  (localStorage)
   ================================================ */
function lsKey() {
  var n = (studentData.name  || '').trim();
  var g = (studentData.group || '').trim();
  return 'mat3_t06_g03__' + (n + '__' + g).replace(/\s+/g, '_');
}

function saveSession() {
  if (!studentData.name) return;
  var drawings = [], texts = [], photos = [];
  problems.forEach(function(p, i) {
    var dc = document.getElementById('dc' + i);
    if (dc && dc.width) {
      var blank = document.createElement('canvas');
      blank.width = dc.width; blank.height = dc.height;
      drawings.push(dc.toDataURL() === blank.toDataURL() ? null : dc.toDataURL('image/png'));
    } else { drawings.push(null); }
    var ta = document.getElementById('ta' + i);
    texts.push(ta ? ta.value : '');
    var pp = document.getElementById('pp' + i);
    photos.push((pp && pp.src && pp.src.indexOf('data:') === 0) ? pp.src : null);
  });
  var state = {
    name: studentData.name, group: studentData.group,
    answeredCount: answeredCount, correctCount: correctCount,
    choices: problems.map(function(p) { return p.studentChoice; }),
    drawings: drawings, texts: texts, photos: photos
  };
  try { localStorage.setItem(lsKey(), JSON.stringify(state)); } catch(e) {}
}

function loadSession(name, group) {
  var key = 'mat3_t06_g03__' + (name + '__' + group).replace(/\s+/g, '_');
  try { var r = localStorage.getItem(key); return r ? JSON.parse(r) : null; } catch(e) { return null; }
}

function restoreSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  var saved = loadSession(name, group);
  if (!saved) return;
  document.getElementById('restoreBar').style.display = 'none';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = currentAttempt(name, group);
  buildLesson(seededRng(name + group + att));
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
  saved.choices.forEach(function(choice, idx) {
    if (choice !== null && choice !== undefined) confirmMC(idx, choice);
  });
  setTimeout(function() {
    if (saved.drawings) {
      saved.drawings.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var dc = document.getElementById('dc' + i);
        if (!dc || !dc.width) return;

          var dpr = window.devicePixelRatio || 1;
          dc.getContext('2d').drawImage(img, 0, 0, dc.width / dpr, dc.height / dpr);
        };
        img.src = dataUrl;
      });
    }
    if (saved.texts) {
      saved.texts.forEach(function(text, i) {
        if (!text) return;
        var ta = document.getElementById('ta' + i);
        if (ta) ta.value = text;
      });
    }
    if (saved.photos) {

      });

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

async function generatePDF() {

  var doc     = new jspdf.jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });
  var PW      = 215.9;

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS — INJECTION BLOCK ─────────────────────────────────────────
  //   Match these RGB values to --green and --gold above.
  //   PRIMARY  → pBR, pBG, pBB
  //   ACCENT   → pAR, pAG, pAB
  // ──────────────────────────────────────────────────────────────────────────
  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;  // PRIMARY (from SCHOOL, Rule 16)
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;   // ACCENT (from SCHOOL, Rule 16)

  function pdfText(html) {
    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/\u2192/g,'->').replace(/\u2212/g,'-').replace(/\u00b2/g,'^2')
      .replace(/\u00b3/g,'^3').replace(/\u00d7/g,'x').replace(/\u00f7/g,'/')
      .replace(/\u2260/g,'!=').replace(/\u2264/g,'<=').replace(/\u2265/g,'>=')
      .replace(/\u221a/g,'sqrt').replace(/\u03c0/g,'pi').replace(/\u2026/g,'...')
      .replace(/\s+/g,' ').trim();
  }

  // ── PORTADA: orange line / white logo strip / orange line / blue band ──

function L(es, en){ return LANG === 'en' ? en : es; }
function cssv(n){ try { return getComputedStyle(document.documentElement).getPropertyValue(n).trim() || '#888'; } catch(e){ return '#888'; } }
function mv(v){ return (Math.round(v * 10) / 10).toFixed(1); }
function rv(v){ return (Math.round(v * 100) / 100).toFixed(2); }
function dr(a){ return a * Math.PI / 180; }
function TS(a){ var r = dr(a); return { s: Math.round(Math.sin(r) * 100) / 100, c: Math.round(Math.cos(r) * 100) / 100, t: Math.round(Math.tan(r) * 100) / 100 }; }
function tline(a){ var v = TS(a);
  return L('sen ' + a + '° = ' + rv(v.s) + ' · cos ' + a + '° = ' + rv(v.c) + ' · tan ' + a + '° = ' + rv(v.t),
           'sin ' + a + '° = ' + rv(v.s) + ' · cos ' + a + '° = ' + rv(v.c) + ' · tan ' + a + '° = ' + rv(v.t)); }
function frac(n, d){ return '<span class="mf-outer"><span class="mf-num">' + n + '</span><span class="mf-den">' + d + '</span></span>'; }

function shuffleOpts(opts, correct, rng){
  var a = opts.slice();
  for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(rng() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
  return { options: a, correctIdx: a.indexOf(correct) };
}
function pushProb(spec, rng){
  var s = shuffleOpts(spec.options, spec.correct, rng);
  var prob = {
    title: spec.title, questionText: spec.questionText, fn: spec.fn || '',
    hint: spec.hint || '', explanation: spec.explanation || '',
    options: s.options, correctIdx: s.correctIdx, showWork: !!spec.showWork,
    studentChoice: null, pendingChoice: null
  };
  problems.push(prob);
  buildOneCard(prob, problems.length - 1);
}
/* Builds 4 distinct options from numbers. The correct value stays at index 0 of
   the returned array, so the caller passes options:o, correct:o[0]. fmt turns a
   number into its display string (with unit), and distinctness is judged on that
   string, which is what the student actually compares. */
function opt4(correct, cands, fmt){
  var out = [correct], seen = {}, i;
  seen[fmt(correct)] = 1;
  for (i = 0; i < cands.length && out.length < 4; i++){
    var v = cands[i];
    if (typeof v !== 'number' || !isFinite(v) || v <= 0) continue;
    var k = fmt(v);
    if (seen[k]) continue;
    seen[k] = 1; out.push(v);
  }
  var step = 1;
  while (out.length < 4 && step < 60){
    var w = correct * (1 + step * 0.09), k2 = fmt(w);
    if (!seen[k2]){ seen[k2] = 1; out.push(w); }
    step++;
  }
  return out.map(fmt);
}
function fmM(v){ return mv(v) + ' m'; }
function fmR(v){ return rv(v); }
function cvFit(id){
  var cv = document.getElementById(id);
  if (!cv) return null;
  var dpr = window.devicePixelRatio || 1;
  var r = cv.getBoundingClientRect();
  var w = Math.max(240, Math.round(r.width));
  var h = Math.max(180, Math.round(r.height));
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  var ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  return { ctx: ctx, w: w, h: h };
}
function cvLabel(ctx, txt, x, y, col, align, size){
  ctx.save();
  ctx.fillStyle = col; ctx.textAlign = align || 'left'; ctx.textBaseline = 'middle';
  ctx.font = '600 ' + (size || 11) + 'px "IBM Plex Sans", sans-serif';
  ctx.fillText(txt, x, y); ctx.restore();
}
function cvArc(ctx, x, y, rad, a0, a1, col){
  ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.arc(x, y, rad, a0, a1, true); ctx.stroke(); ctx.restore();
}
function cvRight(ctx, x, y, sx, sy, col){
  ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = 1.1;
  ctx.beginPath(); ctx.moveTo(x + sx, y); ctx.lineTo(x + sx, y + sy); ctx.lineTo(x, y + sy); ctx.stroke(); ctx.restore();
}

var W1 = null, W2 = null, W3 = null, W4 = null;

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVE 1 : EL ABANICO DE COCIENTES
   Two sliders: one opens the acute angle, the other stretches the whole
   triangle. The three side lengths and the three quotients are recomputed and
   redrawn on every move, so the student sees the lengths run while the
   quotients sit still, and only the angle moves them. Hunt an exact quotient.
   Three rounds, reveal on the 3rd miss.
   ══════════════════════════════════════════════════════════════════════════ */
var W1POOL = [{k:0,a:25},{k:0,a:38},{k:0,a:52},{k:0,a:64},
              {k:1,a:22},{k:1,a:35},{k:1,a:48},{k:1,a:60},
              {k:2,a:28},{k:2,a:40},{k:2,a:55},{k:2,a:66}];
function w1Ratio(k, a){ var r = dr(a), s = Math.sin(r), c = Math.cos(r); return k === 0 ? s : (k === 1 ? c : s / c); }
function w1R2(k, a){ return Math.round(w1Ratio(k, a) * 100) / 100; }
function w1Name(k){
  return L(['opuesto ÷ hipotenusa', 'adyacente ÷ hipotenusa', 'opuesto ÷ adyacente'][k],
           ['opposite ÷ hypotenuse', 'adjacent ÷ hypotenuse', 'opposite ÷ adjacent'][k]);
}
function w1Build(rng){
  var g0 = [], g1 = [], g2 = [], i;
  for (i = 0; i < W1POOL.length; i++){
    if (W1POOL[i].k === 0) g0.push(W1POOL[i]);
    else if (W1POOL[i].k === 1) g1.push(W1POOL[i]);
    else g2.push(W1POOL[i]);
  }
  var raw = [pick(g0, rng), pick(g1, rng), pick(g2, rng)];
  var rounds = shuffle(raw, rng).map(function(o){ return { k: o.k, a: o.a, g: w1R2(o.k, o.a) }; });
  W1 = { rounds: rounds, round: 0, tries: 0, done: false, ang: 30, size: 10, moved: false };
}
function w1Cur(){ return W1.rounds[W1.round]; }
function w1Vals(){ var r = dr(W1.ang); return { op: W1.size * Math.sin(r), ad: W1.size * Math.cos(r), hy: W1.size }; }
function w1Html(){
  return '<div class="mhead"><div class="mtitle">' + L('El abanico de cocientes', 'The fan of quotients') + '</div>' +
      '<div class="mround" id="w1r"></div></div>' +
    '<div class="mtask" id="w1task"></div>' +
    '<canvas class="mcv" id="w1cv"></canvas>' +
    '<div class="mslide">' +
      '<div><label>' + L('Abertura del ángulo', 'Opening of the angle') + ': <span class="mval" id="w1av">30</span>°</label>' +
        '<input type="range" id="w1as" min="10" max="80" step="1" value="30" oninput="w1AngIn()"></div>' +
      '<div><label>' + L('Tamaño del triángulo', 'Size of the triangle') + ': <span class="mval" id="w1sv">10</span> u</label>' +
        '<input type="range" id="w1ss" min="6" max="20" step="1" value="10" oninput="w1SizeIn()"></div>' +
    '</div>' +
    '<div class="mstat">' +
      '<div class="mtile" id="w1t0"><div class="tl">' + w1Name(0) + '</div><div class="tv" id="w1q0">0</div></div>' +
      '<div class="mtile" id="w1t1"><div class="tl">' + w1Name(1) + '</div><div class="tv" id="w1q1">0</div></div>' +
      '<div class="mtile" id="w1t2"><div class="tl">' + w1Name(2) + '</div><div class="tv" id="w1q2">0</div></div>' +
    '</div>' +
    '<div class="mlens" id="w1len"></div>' +
    '<div class="mrow"><button class="mbtn go" onclick="w1Check()">' + L('Comprobar', 'Check') + '</button>' +
      '<button class="mbtn" onclick="w1Reset()">' + L('Empezar de nuevo', 'Start over') + '</button></div>' +
    '<div class="mfb" id="w1fb"></div>';
}
function w1Init(){ if (W1) w1Round(); }
function w1Round(){
  if (!W1) return;
  var c = w1Cur();
  setTxt('w1r', L('Reto ', 'Task ') + (W1.round + 1) + L(' de ', ' of ') + W1.rounds.length);
  setTxt('w1task', L('Deja el cociente ' + w1Name(c.k) + ' marcando exactamente ' + rv(c.g) + '. Mueve también el tamaño y observa a cuál de los dos renglones le importa.',
                     'Leave the ' + w1Name(c.k) + ' quotient reading exactly ' + rv(c.g) + '. Move the size too and watch which of the two rows cares about it.'));
  W1.ang = 30; W1.size = 10; W1.tries = 0; W1.moved = false;

function w1AngIn(){

}
function w1Update(){
  if (!W1) return;
  var c = w1Cur(), v = w1Vals(), i;
  var q = [w1R2(0, W1.ang), w1R2(1, W1.ang), w1R2(2, W1.ang)];
  setTxt('w1av', W1.ang); setTxt('w1sv', W1.size);
  setTxt('w1q0', rv(q[0])); setTxt('w1q1', rv(q[1])); setTxt('w1q2', rv(q[2]));
  setTxt('w1len', L('opuesto ' + mv(v.op) + ' u · adyacente ' + mv(v.ad) + ' u · hipotenusa ' + mv(v.hy) + ' u',
                    'opposite ' + mv(v.op) + ' u · adjacent ' + mv(v.ad) + ' u · hypotenuse ' + mv(v.hy) + ' u'));
  for (i = 0; i < 3; i++){
    var tl = document.getElementById('w1t' + i);
    if (tl) tl.classList.toggle('hit', i === c.k && q[i] === c.g);
  }
  var cur = q[c.k], d = cur - c.g;
  var note = W1.moved ? L(' Los tres lados cambiaron de tamaño y los tres cocientes se quedaron donde estaban.',
                          ' The three sides changed size and the three quotients stayed where they were.') : '';
  if (d === 0){
    setFb('w1fb', L('El cociente ya marca ' + rv(c.g) + '. Comprueba para cerrar el reto.',
                    'The quotient already reads ' + rv(c.g) + '. Check to close the task.') + note, 'near');
  } else {
    var open = (c.k === 1) ? (d > 0) : (d < 0);
    setFb('w1fb', L('El cociente va en ' + rv(cur) + ' y la marca está en ' + rv(c.g) + '. ' +
                    (open ? 'Abre más el ángulo.' : 'Ciérralo un poco.'),
                    'The quotient is at ' + rv(cur) + ' and the mark is at ' + rv(c.g) + '. ' +
                    (open ? 'Open the angle wider.' : 'Close it a little.')) + note, '');
  }
  w1Draw();
}
function w1Check(){
  if (!W1 || W1.done) return;
  var c = w1Cur(), cur = w1R2(c.k, W1.ang);
  if (cur === c.g){
    setFb('w1fb', L('🎉 Ahí está. Con ' + W1.ang + '° el cociente ' + w1Name(c.k) + ' vale ' + rv(c.g) + ', y seguiría valiendo lo mismo con cualquier tamaño de triángulo.',
                    '🎉 There it is. At ' + W1.ang + '° the ' + w1Name(c.k) + ' quotient is ' + rv(c.g) + ', and it would keep the same value at any size of triangle.'), 'good');
    setTimeout(w1Advance, 1400);
    return;
  }
  W1.tries++;
  if (W1.tries >= 3){
    W1.ang = c.a; setVal('w1as', c.a); W1.moved = false;
    w1Update();
    setFb('w1fb', L('La abertura que buscabas era ' + c.a + '°: ahí el cociente ' + w1Name(c.k) + ' cae en ' + rv(c.g) + '. Cada abertura tiene su propio valor y no lo comparte con ninguna otra.',
                    'The opening you were after was ' + c.a + '°: there the ' + w1Name(c.k) + ' quotient lands on ' + rv(c.g) + '. Every opening has its own value and shares it with no other.'), 'near');
    setTimeout(w1Advance, 2400);
    return;
  }
  var open2 = (c.k === 1) ? (cur - c.g > 0) : (cur - c.g < 0);
  setFb('w1fb', L('Todavía no. Con ' + W1.ang + '° el cociente vale ' + rv(cur) + ' y la marca está en ' + rv(c.g) + '. ' +
                  (open2 ? 'Abre más el ángulo.' : 'Ciérralo un poco.'),
                  'Not yet. At ' + W1.ang + '° the quotient is ' + rv(cur) + ' and the mark is at ' + rv(c.g) + '. ' +
                  (open2 ? 'Open the angle wider.' : 'Close it a little.')), '');
}
function w1Advance(){
  if (!W1) return;
  W1.round++;
  if (W1.round >= W1.rounds.length){
    W1.done = true;
    setTxt('w1r', L('Completado', 'Completed'));

                       'The three quotients landed on their mark. In all three tasks the size of the triangle had nothing to say: the opening of the angle decided on its own.'));
    setFb('w1fb', L('🎉 Abanico completo.', '🎉 Fan completed.'), 'good');
    return;

}
function w1Draw(){
  var g = cvFit('w1cv'); if (!g || !W1) return;
  var ctx = g.ctx, W = g.w, H = g.h, v = w1Vals();
  var s = Math.min((W - 108) / Math.max(v.ad, 0.7), (H - 74) / Math.max(v.op, 0.7));
  var ox = 52, oy = H - 34, bx = ox + v.ad * s, ty = oy - v.op * s;
  var gr = cssv('--green'), gd = cssv('--gold'), t2 = cssv('--text2'), t3 = cssv('--text3'), s2 = cssv('--surface2');
  ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(bx, oy); ctx.lineTo(bx, ty); ctx.closePath();
  ctx.fillStyle = s2; ctx.fill();
  ctx.strokeStyle = t3; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(bx, oy); ctx.stroke();
  ctx.strokeStyle = gd; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(bx, oy); ctx.lineTo(bx, ty); ctx.stroke();
  ctx.strokeStyle = gr; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(bx, ty); ctx.stroke();
  cvRight(ctx, bx - 10, oy - 10, 10, 10, t2);
  cvArc(ctx, ox, oy, 26, 0, -dr(W1.ang), t2);
  cvLabel(ctx, W1.ang + '°', ox + 32, oy - 13, t2, 'left', 11);
  cvLabel(ctx, L('adyacente ', 'adjacent ') + mv(v.ad) + ' u', (ox + bx) / 2, oy + 16, t3, 'center', 11);

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVE 2 : LA MESA DE ENCARGOS
   A job arrives describing which side is known and which one is wanted. The
   student taps the name that works with exactly that pair of sides. Wrong taps
   push toward the pair, not toward the answer; reveal on the 3rd miss.
   ══════════════════════════════════════════════════════════════════════════ */
var W2POOL = [
  { es:'Conoces la hipotenusa y buscas el cateto opuesto al ángulo', en:'You know the hypotenuse and you want the leg opposite the angle', b:0 },
  { es:'Conoces el cateto opuesto al ángulo y buscas la hipotenusa', en:'You know the leg opposite the angle and you want the hypotenuse', b:0 },
  { es:'Conoces el cateto opuesto y la hipotenusa, y buscas el ángulo', en:'You know the opposite leg and the hypotenuse, and you want the angle', b:0 },
  { es:'Conoces la hipotenusa y buscas el cateto adyacente al ángulo', en:'You know the hypotenuse and you want the leg adjacent to the angle', b:1 },
  { es:'Conoces el cateto adyacente al ángulo y buscas la hipotenusa', en:'You know the leg adjacent to the angle and you want the hypotenuse', b:1 },
  { es:'Conoces el cateto adyacente y la hipotenusa, y buscas el ángulo', en:'You know the adjacent leg and the hypotenuse, and you want the angle', b:1 },
  { es:'Conoces el cateto adyacente y buscas el cateto opuesto', en:'You know the adjacent leg and you want the opposite leg', b:2 },
  { es:'Conoces el cateto opuesto y buscas el cateto adyacente', en:'You know the opposite leg and you want the adjacent leg', b:2 },
  { es:'Conoces los dos catetos y buscas el ángulo', en:'You know both legs and you want the angle', b:2 }
];
function w2Bins(){ return L(['Seno', 'Coseno', 'Tangente'], ['Sine', 'Cosine', 'Tangent']); }
function w2Pair(b){
  return L(['el cateto opuesto y la hipotenusa', 'el cateto adyacente y la hipotenusa', 'los dos catetos'][b],
           ['the opposite leg and the hypotenuse', 'the adjacent leg and the hypotenuse', 'both legs'][b]);
}
function w2Build(rng){
  var g0 = [], g1 = [], g2 = [], i;
  for (i = 0; i < W2POOL.length; i++){
    if (W2POOL[i].b === 0) g0.push(W2POOL[i]);
    else if (W2POOL[i].b === 1) g1.push(W2POOL[i]);
    else g2.push(W2POOL[i]);
  }
  var items = shuffle(g0, rng).slice(0, 2).concat(shuffle(g1, rng).slice(0, 2)).concat(shuffle(g2, rng).slice(0, 2));
  W2 = { items: shuffle(items, rng), i: 0, tries: 0, hits: 0, done: false };
}
function w2Html(){
  return '<div class="mhead"><div class="mtitle">' + L('La mesa de encargos', 'The order desk') + '</div>' +
      '<div class="mprog" id="w2p"></div></div>' +
    '<div class="mtask">' + L('Cada encargo dice qué lado llega medido y qué lado hay que entregar. Elige el nombre que trabaja justo con esa pareja.',
                              'Each order says which side arrives measured and which one has to be delivered. Pick the name that works with exactly that pair.') + '</div>' +
    '<div id="w2body"></div>' +
    '<div class="mfb" id="w2fb"></div>';
}
function w2Init(){ if (W2) w2Render(); }
function w2Render(){
  if (!W2) return;
  var body = document.getElementById('w2body');
  if (!body) return;
  if (W2.done){
    setTxt('w2p', L('Completado', 'Completed'));
    body.innerHTML = '<div class="mdone">🎉 ' + L('Encargos resueltos: ', 'Orders filled: ') + W2.hits + ' / ' + W2.items.length + '</div>';
    return;
  }
  var it = W2.items[W2.i], bins = w2Bins();
  setTxt('w2p', (W2.i + 1) + ' / ' + W2.items.length);
  body.innerHTML =
    '<div class="mcard"><div class="cq">' + it[LANG === 'en' ? 'en' : 'es'] + '</div>' +
      '<div class="cu">' + L('encargo del taller', 'workshop order') + '</div></div>' +
    '<div class="mchips">' + bins.map(function(b, bi){
      return '<button class="mchip" onclick="w2Pick(' + bi + ')">' + b + '</button>';
    }).join('') + '</div>';
}
function w2Pick(bi){
  if (!W2 || W2.done) return;
  var it = W2.items[W2.i], bins = w2Bins();
  if (bi === it.b){
    W2.hits++;
    setFb('w2fb', L('✓ Correcto. Los dos lados que entran son ' + w2Pair(it.b) + ', y ese es el par que le toca a ' + bins[it.b].toLowerCase() + '.',
                    '✓ Correct. The two sides involved are ' + w2Pair(it.b) + ', and that is the pair belonging to ' + bins[it.b].toLowerCase() + '.'), 'good');
    W2.tries = 0; W2.i++;
    if (W2.i >= W2.items.length) W2.done = true;
    setTimeout(w2Render, 1000);
    return;
  }
  W2.tries++;
  if (W2.tries >= 3){
    setFb('w2fb', L('Era <b>' + bins[it.b] + '</b>. En este encargo aparecen ' + w2Pair(it.b) + ', y ninguna otra razón trabaja con esa pareja.',
                    'It was <b>' + bins[it.b] + '</b>. This order involves ' + w2Pair(it.b) + ', and no other ratio works with that pair.'), 'near');
    W2.tries = 0; W2.i++;
    if (W2.i >= W2.items.length) W2.done = true;
    setTimeout(w2Render, 2300);
    return;
  }
  setFb('w2fb', L('Todavía no. Subraya en el encargo el lado que llega medido y el que hay que entregar, y pregúntate qué nombre junta a esos dos.',
                  'Not yet. Underline in the order the side that arrives measured and the one to be delivered, and ask which name joins those two.'), '');
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVE 3 : EL TEODOLITO
   The student plants the instrument at a distance and tips it up. The line of
   sight, the angle and the height it reads on the tower are redrawn live, so
   stepping back and tipping up are seen trading against each other. Park the
   reading on the marked height. Three rounds, reveal on the 3rd miss.
   ══════════════════════════════════════════════════════════════════════════ */
var W3POOL = [{d:30,a:38},{d:25,a:52},{d:40,a:27},{d:20,a:58},{d:35,a:44},{d:45,a:33}];
function w3Build(rng){
  var rounds = shuffle(W3POOL, rng).slice(0, 3).map(function(o){
    return { d: o.d, a: o.a, g: Math.round(o.d * Math.tan(dr(o.a)) * 10) / 10 };
  });

}
function w3Cur(){ return W3.rounds[W3.round]; }
function w3H(){ return W3.d * Math.tan(dr(W3.ang)); }
function w3Hit(){ return Math.abs(w3H() - w3Cur().g) < 0.25; }
function w3Html(){
  return '<div class="mhead"><div class="mtitle">' + L('El teodolito', 'The theodolite') + '</div>' +
      '<div class="mround" id="w3r"></div></div>' +
    '<div class="mtask" id="w3task"></div>' +
    '<canvas class="mcv" id="w3cv"></canvas>' +
    '<div class="mslide">' +
      '<div><label>' + L('Distancia al pie de la torre', 'Distance to the foot of the tower') + ': <span class="mval" id="w3dv">20</span> m</label>' +
        '<input type="range" id="w3ds" min="10" max="60" step="1" value="20" oninput="w3In()"></div>' +
      '<div><label>' + L('Inclinación del aparato', 'Tilt of the instrument') + ': <span class="mval" id="w3av">20</span>°</label>' +
        '<input type="range" id="w3as" min="8" max="72" step="1" value="20" oninput="w3In()"></div>' +
    '</div>' +
    '<div class="mstat">' +
      '<div class="mtile"><div class="tl">' + L('Distancia', 'Distance') + '</div><div class="tv" id="w3d">0</div></div>' +
      '<div class="mtile"><div class="tl">' + L('Ángulo', 'Angle') + '</div><div class="tv" id="w3a">0</div></div>' +
      '<div class="mtile" id="w3t3"><div class="tl">' + L('Altura leída', 'Height read') + '</div><div class="tv" id="w3hv">0</div></div>' +
    '</div>' +
    '<div class="mrow"><button class="mbtn go" onclick="w3Check()">' + L('Comprobar', 'Check') + '</button></div>' +
    '<div class="mfb" id="w3fb"></div>';
}
function w3Init(){ if (W3) w3Round(); }
function w3Round(){
  if (!W3) return;
  var c = w3Cur();
  setTxt('w3r', L('Reto ', 'Task ') + (W3.round + 1) + L(' de ', ' of ') + W3.rounds.length);
  setTxt('w3task', L('La punta de esta torre está a ' + mv(c.g) + ' m del suelo. Coloca el aparato y inclínalo hasta que la lectura de altura caiga en esa marca.',
                     'The top of this tower is ' + mv(c.g) + ' m above the ground. Place the instrument and tilt it until the height reading lands on that mark.'));
  W3.d = c.d; W3.ang = 20; W3.tries = 0;
  setVal('w3ds', c.d); setVal('w3as', 20);

}
function w3In(){
  if (!W3 || W3.done) return;
  var a = document.getElementById('w3ds'), b = document.getElementById('w3as');
  if (a) W3.d = parseInt(a.value, 10) || 10;
  if (b) W3.ang = parseInt(b.value, 10) || 8;
  w3Update();
}
function w3Update(){
  if (!W3) return;
  var c = w3Cur(), h = w3H(), d = h - c.g;
  setTxt('w3dv', W3.d); setTxt('w3av', W3.ang);
  setTxt('w3d', W3.d + ' m'); setTxt('w3a', W3.ang + '°'); setTxt('w3hv', mv(h) + ' m');
  var t3 = document.getElementById('w3t3'); if (t3) t3.classList.toggle('hit', w3Hit());
  if (w3Hit()) setFb('w3fb', L('La lectura cayó en la marca. Comprueba para cerrar el reto.',
                               'The reading landed on the mark. Check to close the task.'), 'near');
  else if (d < 0) setFb('w3fb', L('La visual pasa ' + mv(-d) + ' m por debajo de la punta. Levanta más el aparato, o aléjate del pie sin bajarlo.',
                                  'The line of sight passes ' + mv(-d) + ' m below the top. Tilt the instrument higher, or step back without lowering it.'), '');
  else setFb('w3fb', L('La visual pasa ' + mv(d) + ' m por encima de la punta. Baja el aparato, o acércate al pie sin moverlo.',
                       'The line of sight passes ' + mv(d) + ' m above the top. Tilt the instrument lower, or step closer without moving it.'), '');

}
function w3Check(){
  if (!W3 || W3.done) return;
  var c = w3Cur();
  if (w3Hit()){
    setFb('w3fb', L('🎉 En la marca. Desde ' + W3.d + ' m y con ' + W3.ang + '° de inclinación, la altura leída es ' + mv(w3H()) + ' m: la distancia y el ángulo bastan para conocer la torre sin trepar a ella.',
                    '🎉 On the mark. From ' + W3.d + ' m and with a tilt of ' + W3.ang + '°, the height read is ' + mv(w3H()) + ' m: distance and angle are enough to know the tower without climbing it.'), 'good');
    setTimeout(w3Advance, 1600);
    return;
  }
  W3.tries++;
  if (W3.tries >= 3){
    W3.d = c.d; W3.ang = c.a;
    setVal('w3ds', c.d); setVal('w3as', c.a);
    w3Update();
    setFb('w3fb', L('Una colocación que sirve: a ' + c.d + ' m del pie y con ' + c.a + '° de inclinación. Al alejarte necesitas menos inclinación para la misma punta, y al acercarte necesitas más.',
                    'A placement that works: ' + c.d + ' m from the foot and a tilt of ' + c.a + '°. Stepping back you need less tilt for the same top, and stepping closer you need more.'), 'near');

    ? L('Todavía no. La lectura va en ' + mv(h2) + ' m y la marca está en ' + mv(c.g) + ' m. Sube la inclinación.',
        'Not yet. The reading is at ' + mv(h2) + ' m and the mark is at ' + mv(c.g) + ' m. Raise the tilt.')
    : L('Todavía no. La lectura va en ' + mv(h2) + ' m y la marca está en ' + mv(c.g) + ' m. Baja la inclinación.',
        'Not yet. The reading is at ' + mv(h2) + ' m and the mark is at ' + mv(c.g) + ' m. Lower the tilt.'), '');
}
function w3Advance(){
  if (!W3) return;

  if (W3.round >= W3.rounds.length){
    W3.done = true;
    setTxt('w3r', L('Completado', 'Completed'));
    setTxt('w3task', L('Las tres torres quedaron medidas desde el suelo. En las tres, la distancia al pie y la inclinación de la visual bastaron para saber la altura.',
                       'The three towers were measured from the ground. In all three, the distance to the foot and the tilt of the sight line were enough to know the height.'));
    setFb('w3fb', L('🎉 Torres medidas.', '🎉 Towers measured.'), 'good');

  }

}
function w3Draw(){
  var g = cvFit('w3cv'); if (!g || !W3) return;
  var ctx = g.ctx, W = g.w, H = g.h, c = w3Cur(), h = w3H();
  var top = Math.max(c.g, h, 4);
  var s = Math.min((W - 92) / Math.max(W3.d, 6), (H - 56) / top);
  var ox = 44, oy = H - 28, tx = ox + W3.d * s;
  var gr = cssv('--green'), gd = cssv('--gold'), bd = cssv('--border'), t2 = cssv('--text2'), t3 = cssv('--text3'), ok = cssv('--ok');
  ctx.strokeStyle = bd; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(14, oy); ctx.lineTo(W - 12, oy); ctx.stroke();
  ctx.strokeStyle = t3; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(tx, oy); ctx.lineTo(tx, oy - c.g * s); ctx.stroke();
  ctx.save(); ctx.setLineDash([5, 4]); ctx.strokeStyle = gd; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(ox - 16, oy - c.g * s); ctx.lineTo(W - 14, oy - c.g * s); ctx.stroke(); ctx.restore();
  cvLabel(ctx, L('marca ', 'mark ') + mv(c.g) + ' m', W - 16, oy - c.g * s - 11, gd, 'right', 11);
  ctx.strokeStyle = w3Hit() ? ok : gr; ctx.lineWidth = 2.6;
  ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(tx, oy - h * s); ctx.stroke();
  ctx.fillStyle = gr;
  ctx.beginPath(); ctx.arc(ox, oy, 4.5, 0, 6.2832); ctx.fill();
  cvArc(ctx, ox, oy, 24, 0, -dr(W3.ang), t2);
  cvLabel(ctx, W3.ang + '°', ox + 30, oy - 12, t2, 'left', 11);
  cvLabel(ctx, W3.d + ' m', (ox + tx) / 2, oy + 15, t3, 'center', 11);
  cvLabel(ctx, L('lectura ', 'reading ') + mv(h) + ' m', 10, 16, w3Hit() ? ok : gr, 'left', 11);

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVE 4 : LA PENDIENTE DEL TERRENO
   Here the two measurements are already taken and what is missing is the
   angle. The horizontal run is fixed; the student turns the slope until the

   Three rounds, reveal on the 3rd miss.

var W4POOL = [{r:12,a:35},{r:20,a:28},{r:15,a:52},{r:24,a:40},{r:18,a:47},{r:10,a:62}];

}
function w4Init(){ if (W4) w4Round(); }
function w4Round(){

function w4Draw(){

      explanation: L('Con ese ángulo, la distancia al muro es el cateto adyacente y la altura buscada es el cateto opuesto, o sea que la pareja en juego son los dos catetos y la razón que les corresponde es la tangente. El coseno relaciona la distancia con la visual, que aquí nadie midió, y por eso el resultado no es la altura.',
                     'With that angle, the distance to the wall is the adjacent leg and the wanted height is the opposite leg, so the pair in play is the two legs and the ratio belonging to them is the tangent. The cosine relates the distance with the line of sight, which nobody measured here, and that is why the result is not the height.'),
      options: [
        L('El coseno relaciona la distancia con la visual, no con la altura del muro', 'The cosine relates the distance with the line of sight, not with the height of the wall'),
        L('El resultado es correcto, aunque convendría comprobarlo con el seno del mismo ángulo', 'The result is correct, though it would be worth checking it with the sine of the same angle'),
        L('La falla está en multiplicar: con ese mismo coseno el resultado sale al dividir', 'The mistake is multiplying: with that same cosine the result comes out by dividing'),
        L('La falla está en el ángulo: para usar el coseno había que medirlo desde la vertical del muro', 'The mistake is the angle: to use the cosine it had to be measured from the vertical of the wall')
      ],
      showWork: false
    };
    sp10.correct = sp10.options[0];
  } else {
    var rp = pick(RAMPS, rng);
    sp10 = {
      title: L('Cuál rampa está más empinada', 'Which ramp is steeper'),
      questionText: L('Se comparan dos rampas rectas. La rampa A sube ' + rp.ha + ' m mientras avanza ' + rp.ba + ' m en horizontal, y la rampa B sube ' + rp.hb + ' m mientras avanza ' + rp.bb + ' m. ¿Cuál está más empinada y por qué?',
                      'Two straight ramps are compared. Ramp A rises ' + rp.ha + ' m while advancing ' + rp.ba + ' m horizontally, and ramp B rises ' + rp.hb + ' m while advancing ' + rp.bb + ' m. Which one is steeper and why?'),
      hint: L('Lo empinado no se decide con los metros que sube cada rampa, sino comparando esa subida con lo que avanza. Arma ese cociente en cada rampa y ponlos uno junto al otro.',
              'Steepness is not decided by the metres each ramp rises, but by comparing that rise with what it advances. Build that quotient for each ramp and put them side by side.'),
      explanation: L('En la rampa A el cociente entre subida y avance vale ' + rv(rp.ha / rp.ba) + ', y en la B vale ' + rv(rp.hb / rp.bb) + '. Ese cociente es la tangente del ángulo de inclinación, y a mayor tangente, ángulo más abierto. Subir más metros no basta cuando el avance también creció.',
                     'In ramp A the quotient between rise and run is ' + rv(rp.ha / rp.ba) + ', and in B it is ' + rv(rp.hb / rp.bb) + '. That quotient is the tangent of the slope angle, and the bigger the tangent, the wider the angle. Rising more metres is not enough when the run has grown too.'),
      options: [
        L('La A, porque el cociente entre lo que sube y lo que avanza es mayor', 'Ramp A, because the quotient between what it rises and what it advances is bigger'),
        L('La B, porque sube más metros en total', 'Ramp B, because it rises more metres in total'),
        L('La B, porque su tramo horizontal es más largo', 'Ramp B, because its horizontal stretch is longer'),
        L('Las dos por igual, porque las dos suben menos de lo que avanzan', 'Both the same, because both rise less than they advance')
      ],
      showWork: false
    };
    sp10.correct = sp10.options[0];
  }
  pushProb(sp10, rng);
}
</script>

<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbzLGV15JRTPs9bbSvHRLfgOXeT9oUExDf1AH546WOwq5tYxXSdhX212OWi_bTJfMGx9/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';

  var moduleTitle = 'Razones Trigonométricas: Seno, Coseno y Tangente';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
