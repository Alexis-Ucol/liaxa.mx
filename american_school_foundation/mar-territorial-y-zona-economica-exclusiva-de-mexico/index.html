      elK.textContent = L({ es:'Completado', en:'Completed' });
      elK.className = 'gw-btn solved';
      say(host, 'good', L({
        es:'Esa es la idea de una pesca sostenible: sacar cada año lo que el mar repone, ni una tonelada más. Las vedas y los permisos sirven justo para eso.',
        en:'That is the idea of sustainable fishing: taking out each year what the sea replaces, not one tonne more. Closed seasons and permits exist for exactly that.'
      }));
      return;
    }
    locked = false; tries = 0; D = build(); cur = 10 * ri(rng, 0, 12);
    while (cur === D.rec) cur = 10 * ri(rng, 0, 12);
    elK.textContent = L({ es:'Comprobar', en:'Check' });
    elK.className = 'gw-btn';
    say(host, '', L({ es:'Otro banco, otras cifras. Vuelve a ajustar la captura.', en:'Another stock, other figures. Set the catch again.' }));
    draw();
  }
  function close(cls, msg){
    locked = true;
    elK.textContent = rd === 2 ? L({ es:'Terminar', en:'Finish' }) : L({ es:'Siguiente banco', en:'Next stock' });
    elK.className = 'gw-btn solved';
    draw();
    say(host, cls, msg);
  }
  function check(){
    if (done) return;
    if (locked){ advance(); return; }
    if (cur === D.rec){
      close('good', L({
        es:'Equilibrado: sacar ' + D.rec + ' toneladas al año es exactamente lo que el banco repone, así que al tercer año siguen las ' + D.s0 + ' toneladas del inicio.',
        en:'Balanced: taking out ' + D.rec + ' tonnes a year is exactly what the stock replaces, so in the third year the ' + D.s0 + ' tonnes of the start are still there.'
      }));
      return;
    }
    tries++;
    if (tries >= 3){
      cur = D.rec;
      close('warm', L({
        es:'La captura sostenible era de ' + D.rec + ' toneladas al año, la misma cantidad que nace cada año.',
        en:'The sustainable catch was ' + D.rec + ' tonnes a year, the same amount that is born each year.'
      }));
      return;
    }
    var fin = series(cur)[3];
    if (cur > D.rec){
      say(host, 'miss', L({
        es:'Sacaste más de lo que nace: al tercer año quedan ' + fin + ' toneladas, menos que las ' + D.s0 + ' del inicio. Baja la captura y comprueba otra vez.',
        en:'You took out more than is born: in the third year ' + fin + ' tonnes are left, fewer than the ' + D.s0 + ' at the start. Lower the catch and check again.'
      }));
    } else {
      say(host, 'miss', L({
        es:'El banco creció hasta ' + fin + ' toneladas, así que quedó pesca sin aprovechar. Sube la captura y comprueba otra vez.',
        en:'The stock grew to ' + fin + ' tonnes, so there was catch left unused. Raise the catch and check again.'
      }));
    }
    draw();
  }

  elS.addEventListener('input', function(){
    if (done || locked){ elS.value = cur; return; }
    cur = parseInt(elS.value, 10);
    draw();
  });
  elK.addEventListener('click', check);
  D = build();
  cur = 10 * ri(rng, 0, 12);
  while (cur === D.rec) cur = 10 * ri(rng, 0, 12);
  say(host, '', L({ es:'Mueve la barra de captura y observa cómo cambia el banco año con año.', en:'Move the catch bar and watch how the stock changes year by year.' }));
  draw();
}

function mkP8(rng){
  var vi = Math.floor(rng() * 3);
  if (vi === 0){
    return numSpec({
      title:{ es:'El litoral completo', en:'The whole coastline' },
      q:{ es:'Un atlas registra que el litoral de México en el océano Pacífico mide 7828 kilómetros y que el litoral del Golfo de México y el mar Caribe mide 3294 kilómetros. ¿Cuántos kilómetros de litoral tiene el país en total?',
          en:'An atlas records that the coastline of Mexico on the Pacific Ocean measures 7828 kilometres and that the coastline of the Gulf of Mexico and the Caribbean Sea measures 3294 kilometres. How many kilometres of coastline does the country have in total?' },
      hint:{ es:'El litoral del país es todo lo que suman sus costas en los mares donde tiene salida.',
             en:'The coastline of the country is everything its coasts add up to in the seas where it has an outlet.' },
      exp:{ es:'Se suman los dos litorales: 7828 + 3294 = 11122',
            en:'The two coastlines are added: 7828 + 3294 = 11122' }
    }, [11122, 4534, 10122, 11022]);
  }
  if (vi === 1){
    var b = ri(rng, 6, 15), tn = 10 * ri(rng, 3, 9);
    return numSpec({
      title:{ es:'La descarga de la flota', en:'The unloading of the fleet' },
      q:{ es:'En una temporada de pesca, ' + b + ' barcos sardineros descargan ' + tn + ' toneladas cada uno en un puerto de Sonora. ¿Cuántas toneladas descargó la flota completa?',
          en:'In one fishing season, ' + b + ' sardine boats unload ' + tn + ' tonnes each at a port in Sonora. How many tonnes did the whole fleet unload?' },
      hint:{ es:'Todos los barcos traen la misma cantidad, así que basta con repetir esa cantidad tantas veces como barcos hay.',
             en:'All the boats bring the same amount, so it is enough to repeat that amount as many times as there are boats.' },
      exp:{ es:'Se multiplica la carga de un barco por el número de barcos: ' + tn + ' × ' + b + ' = ' + (tn * b),
            en:'The load of one boat is multiplied by the number of boats: ' + tn + ' × ' + b + ' = ' + (tn * b) }
    }, [tn * b, b + tn, tn * (b - 1), tn * (b + 1)]);
  }
  var a = 100 * ri(rng, 4, 9), c = 100 * ri(rng, 1, 3);
  return numSpec({
    title:{ es:'Las dos plataformas', en:'The two platforms' },
    q:{ es:'En la sonda de Campeche, una plataforma marina extrae ' + a + ' barriles de petróleo al día y otra plataforma cercana extrae ' + c + ' barriles al día. ¿Cuántos barriles extraen entre las dos cada día?',
        en:'In the Campeche sound, an offshore platform extracts ' + a + ' barrels of oil a day and another nearby platform extracts ' + c + ' barrels a day. How many barrels do the two extract together each day?' },
    hint:{ es:'Lo que producen entre las dos es lo que aporta una junto con lo que aporta la otra.',
           en:'What the two produce together is what one contributes along with what the other contributes.' },
    exp:{ es:'Se suman las dos producciones diarias: ' + a + ' + ' + c + ' = ' + (a + c),
          en:'The two daily outputs are added: ' + a + ' + ' + c + ' = ' + (a + c) }
  }, [a + c, a - c, 2 * a, 2 * c]);
}

<script>
