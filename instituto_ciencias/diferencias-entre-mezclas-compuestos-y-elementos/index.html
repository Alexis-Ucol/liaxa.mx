/* ══════════════════════════════════════════════════════════════════════════
   buildLesson :: concepto -> manipulativo -> problema, alternados (Rule 1)
   ══════════════════════════════════════════════════════════════════════════ */
function buildLesson(rng){
  injectGuideCSS();

  /* ── Apertura ── */
  sec(
    L({ es:'Punto de partida', en:'Starting point' }),
    L({ es:'Cinco materiales de la cocina', en:'Five materials from the kitchen' }),
    '<p>' + L({
      es:'Sobre la mesa hay sal, agua, un trozo de aluminio, aire dentro de una bolsa y una cucharada de leche. Vistos así, los cinco son polvos, líquidos o pedazos: nada en su aspecto dice cuál de ellos está hecho de una sola clase de átomo, cuál guarda átomos distintos unidos en una proporción que nunca cambia y cuál es solo un revoltijo de varias sustancias que siguen siendo lo que eran.',
      en:'On the table there is salt, water, a piece of aluminium, air inside a bag and a spoonful of milk. Seen that way, all five are powders, liquids or lumps: nothing in their appearance says which of them is made of a single kind of atom, which one holds different atoms joined in a proportion that never changes and which one is just a jumble of several substances that are still what they were.'
    }) + '</p>' +
    '<p>' + L({
      es:'La química resuelve eso mirando más abajo, al nivel de las partículas. En esta guía vas a armar cajas de partículas, a clasificarlas, a mover la energía de una muestra para verla pasar de sólido a líquido y a gas, a separar mezclas con tratamientos que no cambian ninguna sustancia y a pesar la proporción con la que dos elementos se combinan.',
      en:'Chemistry settles that by looking further down, at the level of the particles. In this guide you are going to assemble boxes of particles, sort them, move the energy of a sample to watch it go from solid to liquid to gas, separate mixtures with treatments that change no substance at all and weigh the proportion in which two elements combine.'
    }) + '</p>' +
    '<div class="gw-lbl">' + L({ es:'Las clases que vas a distinguir', en:'The classes you will tell apart' }) + '</div>' +
    '<div>' +
      '<span class="gw-chip">' + L({ es:'elemento', en:'element' }) + '</span>' +
      '<span class="gw-chip">' + L({ es:'compuesto', en:'compound' }) + '</span>' +
      '<span class="gw-chip">' + L({ es:'mezcla homogénea', en:'homogeneous mixture' }) + '</span>' +
      '<span class="gw-chip">' + L({ es:'mezcla heterogénea', en:'heterogeneous mixture' }) + '</span>' +
      '<span class="gw-chip">' + L({ es:'sólido, líquido y gas', en:'solid, liquid and gas' }) + '</span>' +
    '</div>'
  );

  /* ══ CONCEPTO 1 ══ */
  var s1 = sec(
    L({ es:'Concepto 1', en:'Concept 1' }),
    L({ es:'Una sustancia o varias, y qué hay dentro de cada partícula', en:'One substance or several, and what is inside each particle' }),
    '<p>' + L({
      es:'Toda muestra de materia se clasifica respondiendo dos preguntas en orden. La primera: ¿hay una sola sustancia o hay varias juntas? Si hay varias, la muestra es una mezcla, y sus componentes conservan sus propias propiedades. La segunda pregunta solo se hace cuando hay una sola sustancia: ¿sus partículas tienen átomos de una sola clase o de clases distintas? Si son de una sola clase, la sustancia es un elemento; si hay clases distintas unidas, es un compuesto.',
      en:'Every sample of matter is classified by answering two questions in order. First: is there one single substance or several together? If there are several, the sample is a mixture, and its components keep their own properties. The second question is only asked when there is a single substance: do its particles hold atoms of one single kind or of different kinds? If they are of one kind, the substance is an element; if different kinds are joined, it is a compound.'
    }) + '</p>' +
    '<p>' + L({
      es:'Conviene no confundir dos cosas que se parecen. Una partícula puede tener varios átomos y aun así pertenecer a un elemento, siempre que esos átomos sean iguales entre sí: el oxígeno del aire viaja en partículas de dos átomos iguales y sigue siendo un elemento. Y una mezcla puede verse perfectamente uniforme, como el agua con sal, sin dejar de ser mezcla: en ella cada sustancia conserva sus partículas y la proporción entre ellas se puede cambiar a voluntad, cosa que en un compuesto es imposible.',
      en:'It pays not to confuse two things that look alike. A particle may hold several atoms and still belong to an element, as long as those atoms are identical to each other: the oxygen in the air travels in particles of two identical atoms and is still an element. And a mixture may look perfectly uniform, like water with salt, without ceasing to be a mixture: in it each substance keeps its own particles and the proportion between them can be changed at will, something impossible in a compound.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Elemento', en:'Element' }), L({ es:'una clase de átomo', en:'one kind of atom' }), L({ es:'no se descompone en otras sustancias', en:'it does not break down into other substances' })) +
      rcard(L({ es:'Compuesto', en:'Compound' }), L({ es:'átomos distintos unidos', en:'different atoms joined' }), L({ es:'proporción fija, propiedades nuevas', en:'fixed proportion, new properties' })) +
      rcard(L({ es:'Mezcla', en:'Mixture' }), L({ es:'varias sustancias juntas', en:'several substances together' }), L({ es:'proporción variable, cada una se conserva', en:'variable proportion, each one is preserved' })) +
      rcard(L({ es:'La pregunta clave', en:'The key question' }), L({ es:'¿una o varias?', en:'one or several?' }), L({ es:'primero cuenta sustancias, luego mira dentro', en:'count substances first, then look inside' })) +
    '</div>' +
    '<div class="callout"><p><strong>' + L({ es:'Ojo: ', en:'Careful: ' }) + '</strong>' + L({
      es:'que una partícula tenga varios átomos no la vuelve un compuesto. Lo que decide es si esos átomos son iguales entre sí o de clases distintas.',
      en:'a particle holding several atoms is not thereby a compound. What decides it is whether those atoms are identical to each other or of different kinds.'
    }) + '</p></div>'
  );
  wBuild(rng, widgetHost(s1, 'w_constructor', 'build'));
  addProblem(rng, mkP1(rng));
  addProblem(rng, mkP2(rng));

  /* ══ CONCEPTO 2 ══ */
  var s2 = sec(
    L({ es:'Concepto 2', en:'Concept 2' }),
    L({ es:'Leer una caja de partículas', en:'Reading a box of particles' }),
    '<p>' + L({
      es:'Un modelo corpuscular es un dibujo con reglas. Cada esfera representa un átomo y su color indica de qué clase es; dos esferas pegadas representan átomos unidos, es decir, una sola partícula; dos partículas separadas son partículas distintas aunque estén cerca. Con esas tres reglas, cualquier caja se lee en dos pasos: contar cuántas clases de partícula hay y mirar qué esferas tiene cada clase por dentro.',
      en:'A particle model is a drawing with rules. Each sphere stands for an atom and its colour says which kind it is; two spheres stuck together stand for joined atoms, that is, a single particle; two separate particles are different particles even if they sit close by. With those three rules any box is read in two steps: count how many kinds of particle there are and look at which spheres each kind holds inside.'
    }) + '</p>' +
    '<p>' + L({
      es:'De ahí salen cuatro lecturas posibles y vale la pena tenerlas juntas. Una sola clase de partícula con esferas iguales es un elemento. Una sola clase con esferas distintas unidas es un compuesto. Dos clases o más, todas con esferas iguales dentro de cada partícula, forman una mezcla de elementos. Y si entre esas clases hay alguna con esferas distintas unidas, es una mezcla en la que participa un compuesto. Dos cajas pueden tener exactamente los mismos átomos y aun así representar cosas diferentes, porque lo que cambia es cómo están repartidos.',
      en:'Four possible readings come out of that and it is worth holding them together. A single kind of particle with identical spheres is an element. A single kind with different spheres joined is a compound. Two or more kinds, all of them with identical spheres inside each particle, make a mixture of elements. And if among those kinds there is one with different spheres joined, it is a mixture in which a compound takes part. Two boxes can hold exactly the same atoms and still represent different things, because what changes is how they are distributed.'
    }) + '</p>' +
    '<div class="callout"><p>' + L({
      es:'Los mismos átomos sueltos y los mismos átomos unidos no son la misma sustancia. Esa es la diferencia entre una mezcla de dos elementos y el compuesto que se forma cuando reaccionan.',
      en:'The same atoms loose and the same atoms joined are not the same substance. That is the difference between a mixture of two elements and the compound formed when they react.'
    }) + '</p></div>'
  );
  wSort(rng, widgetHost(s2, 'w_clasificador', 'classify'));
  addProblem(rng, mkP3(rng));

  /* ══ CONCEPTO 3 ══ */
  var s3 = sec(
    L({ es:'Concepto 3', en:'Concept 3' }),
    L({ es:'La misma sustancia en sólido, líquido y gas', en:'The same substance as a solid, a liquid and a gas' }),
    '<p>' + L({
      es:'El modelo corpuscular explica los estados de agregación sin inventar partículas nuevas. En un sólido las partículas están juntas y ordenadas, cada una vibra alrededor de un sitio fijo y no cambia de vecino: por eso el sólido conserva su forma y su volumen. En un líquido siguen igual de juntas pero desordenadas y capaces de deslizarse unas sobre otras: el líquido conserva su volumen y adopta la forma del recipiente. En un gas quedan muy separadas y se mueven rápido en todas direcciones: el gas ocupa todo el recipiente y se puede comprimir porque entre sus partículas hay mucho espacio vacío.',
      en:'The particle model explains the states of aggregation without inventing new particles. In a solid the particles sit close together and ordered, each one vibrating around a fixed spot and never changing neighbour: that is why a solid keeps its shape and its volume. In a liquid they stay just as close but disordered and able to slide over one another: a liquid keeps its volume and takes the shape of its container. In a gas they end up far apart and move fast in every direction: a gas fills the whole container and can be compressed because there is a lot of empty space between its particles.'
    }) + '</p>' +
    '<p>' + L({
      es:'Lo importante es lo que no cambia. Al fundir hielo o al hervir agua, las partículas no se hacen más grandes, no se parten y no se convierten en otras: solo cambian su separación, su orden y su rapidez. Por eso un cambio de estado es un cambio físico y el agua sólida, líquida y gaseosa siguen siendo la misma sustancia, con la misma clase de partícula. Esto vale igual para un elemento, para un compuesto y para una mezcla: cada uno se puede representar en los tres estados.',
      en:'What matters is what does not change. When ice melts or water boils, the particles do not grow bigger, do not split and do not turn into others: only their separation, their order and their speed change. That is why a change of state is a physical change and solid, liquid and gaseous water are still the same substance, with the same kind of particle. This holds just the same for an element, for a compound and for a mixture: each one can be represented in the three states.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Sólido', en:'Solid' }), L({ es:'juntas y ordenadas', en:'close and ordered' }), L({ es:'forma y volumen propios', en:'its own shape and volume' })) +
      rcard(L({ es:'Líquido', en:'Liquid' }), L({ es:'juntas y desordenadas', en:'close and disordered' }), L({ es:'volumen propio, forma del recipiente', en:'own volume, shape of the container' })) +
      rcard(L({ es:'Gas', en:'Gas' }), L({ es:'muy separadas y rápidas', en:'far apart and fast' }), L({ es:'llena el recipiente y se comprime', en:'fills the container and compresses' })) +
      rcard(L({ es:'En los tres', en:'In all three' }), L({ es:'la misma partícula', en:'the same particle' }), L({ es:'cambia el arreglo, no la sustancia', en:'the arrangement changes, not the substance' })) +
    '</div>'
  );
  wStates(rng, widgetHost(s3, 'w_estados', 'states'));
  addProblem(rng, mkP4(rng));
  addProblem(rng, mkP5(rng));

  /* ══ CONCEPTO 4 ══ */
  var s4 = sec(
    L({ es:'Concepto 4', en:'Concept 4' }),
    L({ es:'Lo que se separa sin cambiar la sustancia', en:'What can be separated without changing the substance' }),
    '<p>' + L({
      es:'Una mezcla se puede deshacer aprovechando alguna diferencia física entre sus componentes: el tamaño de los granos permite filtrar, la diferencia entre hervir pronto o tarde permite evaporar y destilar, el magnetismo permite usar un imán, la diferencia de densidad permite decantar. Ninguno de esos tratamientos rompe partículas ni forma sustancias nuevas: al final se recupera exactamente lo que se había mezclado.',
      en:'A mixture can be taken apart by taking advantage of some physical difference between its components: the size of the grains allows filtering, the difference between boiling early or late allows evaporating and distilling, magnetism allows using a magnet, a difference in density allows decanting. None of those treatments breaks particles or forms new substances: in the end exactly what was mixed is recovered.'
    }) + '</p>' +
    '<p>' + L({
      es:'Con un compuesto no funciona nada de eso. Sus átomos están unidos dentro de la misma partícula, así que ningún filtro, ningún imán y ninguna evaporación los separa: hace falta una reacción química, por ejemplo pasar corriente eléctrica por el agua para obtener dos gases distintos. Esa es la prueba más clara de la diferencia. Y entre las mezclas también hay dos casos: la heterogénea deja ver sus partes, como la arena en el agua, y la homogénea no, como la sal disuelta, porque sus partículas quedan repartidas de manera uniforme aunque sigan siendo dos sustancias.',
      en:'With a compound none of that works. Its atoms are joined inside the same particle, so no filter, no magnet and no evaporation separates them: a chemical reaction is needed, for instance passing an electric current through water to obtain two different gases. That is the clearest proof of the difference. And among mixtures there are also two cases: the heterogeneous one lets its parts be seen, like sand in water, and the homogeneous one does not, like dissolved salt, because its particles end up evenly spread even though they are still two substances.'
    }) + '</p>' +
    '<div class="callout"><p><strong>' + L({ es:'Prueba decisiva: ', en:'Decisive test: ' }) + '</strong>' + L({
      es:'si un tratamiento físico devuelve los componentes intactos, era una mezcla. Si solo una reacción química los obtiene, era un compuesto.',
      en:'if a physical treatment gives the components back untouched, it was a mixture. If only a chemical reaction obtains them, it was a compound.'
    }) + '</p></div>'
  );
  wSeparate(rng, widgetHost(s4, 'w_separacion', 'match'));
  addProblem(rng, mkP6(rng));
  addProblem(rng, mkP7(rng));

  /* ══ CONCEPTO 5 ══ */
  var s5 = sec(
    L({ es:'Concepto 5', en:'Concept 5' }),
    L({ es:'La proporción fija, huella de un compuesto', en:'Fixed proportion, the fingerprint of a compound' }),
    '<p>' + L({
      es:'Cuando dos elementos forman un compuesto, se combinan siempre en la misma proporción de masas, sin importar de dónde venga la muestra ni cuánta se prepare. Si se pone de más uno de los dos, el exceso simplemente no reacciona y queda sobrando al final. En una mezcla no ocurre nada parecido: se puede echar más de un componente o menos, y lo que se obtiene sigue siendo la misma mezcla, solo que con otra composición.',
      en:'When two elements form a compound they always combine in the same proportion of masses, no matter where the sample comes from or how much of it is prepared. If too much of one of the two is added, the excess simply does not react and is left over at the end. Nothing of the sort happens in a mixture: you can put in more of one component or less, and what you get is still the same mixture, only with a different composition.'
    }) + '</p>' +
    '<p>' + L({
      es:'Esa regularidad tiene una lectura corpuscular directa. Si cada partícula del compuesto lleva siempre el mismo número de átomos de cada clase, la relación entre las masas que se combinan tiene que repetirse en cualquier cantidad de muestra. Por eso la proporción fija sirve como huella: medirla es una manera experimental de decidir si lo que se tiene entre manos es un compuesto o una mezcla.',
      en:'That regularity has a direct particle reading. If each particle of the compound always carries the same number of atoms of each kind, the relation between the masses that combine has to repeat itself in any amount of sample. That is why fixed proportion works as a fingerprint: measuring it is an experimental way of deciding whether what you have in front of you is a compound or a mixture.'
    }) + '</p>'
  );
  wRatio(rng, widgetHost(s5, 'w_proporcion', 'ratio'));
  addProblem(rng, mkP8(rng));
  wReflect(rng, widgetHost(s5, 'w_cuaderno', 'reflect'));

  /* ══ CIERRE :: sin explicación previa (Rule 1) ══ */
  sec(
    L({ es:'Para cerrar', en:'To close' }),
    L({ es:'Tú decides', en:'Your call' }),
    '<p>' + L({
      es:'Dos situaciones de laboratorio, con todo lo que ya trabajaste en la mano.',
      en:'Two laboratory situations, with everything you have already worked on in hand.'
    }) + '</p>'
  );
  addProblem(rng, mkP9(rng));
  addProblem(rng, mkP10(rng));
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 1 :: constructor de cajas
   El alumno agrega y quita partículas de una paleta. La lectura de la caja se
   recalcula en cada toque y dice qué clase de materia lleva construida. Tres
   encargos distintos, reveal a la tercera falla (Rule 8).
   ══════════════════════════════════════════════════════════════════════════ */
function wBuild(rng, host){
  var PAL = ['A', 'B2', 'C', 'AB', 'CB2'];
  var GOALS = [
    { key:'elemento',   es:'una muestra de un elemento puro',             en:'a sample of a pure element' },
    { key:'compuesto',  es:'una muestra de un compuesto puro',            en:'a sample of a pure compound' },
    { key:'mezclaElem', es:'una mezcla de dos elementos, sin compuestos', en:'a mixture of two elements, with no compounds' },
    { key:'mezclaComp', es:'una mezcla de un elemento y un compuesto',    en:'a mixture of an element and a compound' }
  ];
  var ORDER = shuffle(GOALS, rng).slice(0, 3);
  var round = 0, tries = 0, cell = [], locked = false, done = false;

  function kindsIn(){
    var out = [], i;
    for (i = 0; i < cell.length; i++) if (out.indexOf(cell[i]) < 0) out.push(cell[i]);
    return out;
  }

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Constructor de cajas', en:'Box builder' }) + '</div>' +
    '<div class="gw-q" data-r="q"></div>' +
    '<div class="gw-mini">' + L({
      es:'Toca una partícula de la paleta para meterla en la caja y toca una partícula de la caja para sacarla. La lectura de abajo cambia contigo.',
      en:'Tap a particle in the palette to put it in the box and tap a particle in the box to take it out. The reading below changes along with you.'
    }) + '</div>' +
    '<div class="box" data-r="box"></div>' +
    '<div class="gw-read" data-r="read"></div>' +
    '<div class="pal" data-r="pal"></div>' +
    '<div class="gw-row">' +
      '<button class="gw-btn" data-r="chk">' + L({ es:'Comprobar', en:'Check' }) + '</button>' +
      '<button class="gw-btn" data-r="clr">' + L({ es:'Vaciar la caja', en:'Empty the box' }) + '</button>' +
    '</div>' +
    '<div class="gw-fb"></div>';

  var elQ = host.querySelector('[data-r="q"]'),
      elBox = host.querySelector('[data-r="box"]'),
      elRead = host.querySelector('[data-r="read"]'),
      elPal = host.querySelector('[data-r="pal"]'),
      elChk = host.querySelector('[data-r="chk"]'),
      elClr = host.querySelector('[data-r="clr"]');

  function render(){
    var g = ORDER[round];
    elQ.innerHTML = L({ es:'Encargo ', en:'Order ' }) + (round + 1) + L({ es:' de tres: construye ', en:' of three: build ' }) + L(g);
    elBox.className = 'box' + (locked || done ? ' locked' : '');
    elBox.innerHTML = cell.length
      ? cell.map(function(id, i){ return '<span class="mol" data-i="' + i + '">' + molInner(KINDS[id].atoms) + '</span>'; }).join('')
      : '<span class="gw-mini">' + L({ es:'caja vacía', en:'empty box' }) + '</span>';
    var ks = kindsIn();
    elRead.innerHTML =
      '<span class="gw-pill">' + L({ es:'partículas', en:'particles' }) + ': <b>' + cell.length + '</b></span>' +
      '<span class="gw-pill">' + L({ es:'sustancias distintas', en:'different substances' }) + ': <b>' + ks.length + '</b></span>' +
      '<span class="gw-pill">' + L({ es:'lectura', en:'reading' }) + ': <b>' + className(classifyBox(ks)) + '</b></span>';
    elPal.innerHTML = PAL.map(function(id){
      return '<button class="palb" data-k="' + id + '"' + (locked || done ? ' disabled' : '') + '>' +
        molHTML(KINDS[id].atoms) + '<small>' + (isCompound(id)
          ? L({ es:'átomos distintos', en:'different atoms' })
          : L({ es:'átomos iguales', en:'identical atoms' })) + '</small></button>';
    }).join('');
    if (locked || done) return;
    elPal.querySelectorAll('.palb').forEach(function(b){
      b.addEventListener('click', function(){
        if (cell.length >= 12){
          say(host, 'warm', L({ es:'La caja ya está llena. Saca alguna partícula antes de meter otra.', en:'The box is full already. Take a particle out before putting another in.' }));
          return;
        }
        cell.push(b.getAttribute('data-k'));
        render();
        live();
      });
    });
    elBox.querySelectorAll('.mol').forEach(function(m){
      m.addEventListener('click', function(){
        var i = parseInt(m.getAttribute('data-i'), 10);
        cell.splice(i, 1);
        render();
        live();
      });
    });
  }

  function live(){
    var ks = kindsIn(), got = classifyBox(ks), g = ORDER[round];
    if (!cell.length){ say(host, '', L({ es:'Caja vacía: elige la primera partícula.', en:'Empty box: choose the first particle.' })); return; }
    if (got === g.key){
      say(host, 'warm', L({
        es:'Tu caja ya se lee como ' + className(got) + '. Comprueba para confirmarla.',
        en:'Your box already reads as ' + className(got) + '. Check to confirm it.'
      }));
      return;
    }
    say(host, '', L({ es:'Por ahora tu caja se lee como ', en:'For now your box reads as ' }) + className(got) + '.');
  }

  function nudge(){
    var ks = kindsIn(), got = classifyBox(ks), g = ORDER[round];
    var hints = {
      elemento: { es:'Un elemento necesita una sola clase de partícula y que dentro de ella todos los átomos sean iguales. Saca lo que sobre.',
                  en:'An element needs a single kind of particle and all atoms inside it identical. Take out whatever is left over.' },
      compuesto: { es:'Un compuesto necesita una sola clase de partícula, pero con átomos de clases distintas unidos dentro de ella.',
                   en:'A compound needs a single kind of particle, but with atoms of different kinds joined inside it.' },
      mezclaElem: { es:'Una mezcla de elementos necesita dos clases de partícula y que ninguna lleve átomos distintos unidos.',
                    en:'A mixture of elements needs two kinds of particle and none of them carrying different atoms joined.' },
      mezclaComp: { es:'Aquí hacen falta dos clases: una con átomos iguales y otra con átomos distintos unidos.',
                    en:'Here two kinds are needed: one with identical atoms and another with different atoms joined.' }
    };
    say(host, 'miss', L({ es:'Tu caja se lee como ', en:'Your box reads as ' }) + className(got) + '. ' + L(hints[g.key]));
  }

  function example(key){
    if (key === 'elemento') return ['B2', 'B2', 'B2'];
    if (key === 'compuesto') return ['AB', 'AB', 'AB'];
    if (key === 'mezclaElem') return ['A', 'A', 'B2', 'B2'];
    return ['C', 'C', 'AB', 'AB'];
  }

  function advance(){
    round++;
    tries = 0; locked = false; cell = [];
    if (round >= ORDER.length){
      done = true;
      round = ORDER.length - 1;
      elChk.textContent = L({ es:'Completado', en:'Completed' });
      elChk.className = 'gw-btn solved';
      elChk.disabled = true;
      render();
      say(host, 'good', L({
        es:'Tres cajas construidas. Fíjate en lo que decidió cada una: cuántas clases de partícula hay y qué átomos lleva cada clase por dentro.',
        en:'Three boxes built. Notice what decided each one: how many kinds of particle there are and which atoms each kind carries inside.'
      }));
      return;
    }
    elChk.textContent = L({ es:'Comprobar', en:'Check' });
    elChk.className = 'gw-btn';
    render();
    say(host, '', L({ es:'Nuevo encargo. Empieza por decidir cuántas sustancias necesitas.', en:'New order. Start by deciding how many substances you need.' }));
  }

  elChk.addEventListener('click', function(){
    if (done) return;
    if (locked){ advance(); return; }
    var g = ORDER[round], ks = kindsIn();
    if (cell.length < 3){
      say(host, 'warm', L({ es:'Pon al menos tres partículas para que la caja represente una muestra.', en:'Put in at least three particles so the box represents a sample.' }));
      return;
    }
    if (classifyBox(ks) === g.key){
      locked = true;
      elChk.textContent = round === ORDER.length - 1 ? L({ es:'Terminar', en:'Finish' }) : L({ es:'Siguiente encargo', en:'Next order' });
      elChk.className = 'gw-btn solved';
      render();
      say(host, 'good', L({
        es:'Correcto: ' + ks.length + (ks.length === 1 ? ' clase de partícula' : ' clases de partícula') + ' y la lectura es ' + className(g.key) + '.',
        en:'Correct: ' + ks.length + (ks.length === 1 ? ' kind of particle' : ' kinds of particle') + ' and the reading is ' + className(g.key) + '.'
      }));
      return;
    }
    tries++;
    if (tries >= 3){
      cell = example(g.key);
      locked = true;
      elChk.textContent = round === ORDER.length - 1 ? L({ es:'Terminar', en:'Finish' }) : L({ es:'Siguiente encargo', en:'Next order' });
      elChk.className = 'gw-btn solved';
      render();
      say(host, 'warm', L({
        es:'Así queda el encargo: la caja tiene ahora ' + kindsIn().length + ' clase(s) de partícula y se lee como ' + className(g.key) + '.',
        en:'This is how the order looks: the box now has ' + kindsIn().length + ' kind(s) of particle and reads as ' + className(g.key) + '.'
      }));
      return;
    }
    nudge();
  });

  elClr.addEventListener('click', function(){
    if (locked || done) return;
    cell = [];
    render();
    live();
  });

  render();
  say(host, '', L({ es:'Empieza por preguntarte cuántas sustancias distintas pide el encargo.', en:'Start by asking yourself how many different substances the order calls for.' }));
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 2 :: clasificador de diagramas
   Cinco cajas generadas con la semilla. El alumno decide en cuál de las cuatro
   lecturas cae cada una; a la tercera falla se revela y avanza (Rule 8).
   ══════════════════════════════════════════════════════════════════════════ */
function wSort(rng, host){
  var BINS = ['elemento', 'compuesto', 'mezclaElem', 'mezclaComp'];

  function makeBox(cat){
    var ids = [], n, i, s2;
    if (cat === 'elemento') ids = [pk(rng, SIMPLE)];
    else if (cat === 'compuesto') ids = [pk(rng, COMPOUND)];
    else if (cat === 'mezclaElem'){
      s2 = shuffle(SIMPLE, rng);
      ids = [s2[0], s2[1]];
    } else {
      ids = [pk(rng, SIMPLE), pk(rng, COMPOUND)];
    }
    var cell = [];
    for (i = 0; i < ids.length; i++){
      n = ri(rng, 2, 4);
      while (n--) cell.push(ids[i]);
    }
    return { cat:cat, cell:shuffle(cell, rng) };
  }

  var ITEMS = shuffle(['elemento', 'compuesto', 'mezclaElem', 'mezclaComp', pk(rng, BINS)], rng).map(makeBox);
  var idx = 0, tries = 0, hits = 0, done = false;

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Cinco cajas, cuatro lecturas', en:'Five boxes, four readings' }) + '</div>' +
    '<div class="gw-q" data-r="q"></div>' +
    '<div class="gw-mini">' + L({
      es:'Cuenta primero cuántas clases de partícula hay y después mira qué esferas tiene cada clase por dentro.',
      en:'First count how many kinds of particle there are and then look at which spheres each kind holds inside.'
    }) + '</div>' +
    '<div class="box locked" data-r="box"></div>' +
    '<div class="binrow" data-r="bins"></div>' +
    '<div class="gw-fb"></div>';

  var elQ = host.querySelector('[data-r="q"]'),
      elBox = host.querySelector('[data-r="box"]'),
      elBins = host.querySelector('[data-r="bins"]');

  function render(){
    if (done){
      elQ.innerHTML = L({ es:'Cinco cajas revisadas', en:'Five boxes reviewed' });
      elBox.innerHTML = '<span class="gw-mini">' + L({ es:'aciertos: ', en:'hits: ' }) + hits + ' / ' + ITEMS.length + '</span>';
      elBins.innerHTML = '';
      return;
    }
    var it = ITEMS[idx];
    elQ.innerHTML = L({ es:'Caja ', en:'Box ' }) + (idx + 1) + ' / ' + ITEMS.length;
    elBox.innerHTML = it.cell.map(function(id){ return molHTML(KINDS[id].atoms); }).join('');
    elBins.innerHTML = BINS.map(function(b){
      return '<button class="bin" data-b="' + b + '">' + className(b) + '</button>';
    }).join('');
    elBins.querySelectorAll('.bin').forEach(function(btn){
      btn.addEventListener('click', function(){ pickBin(btn.getAttribute('data-b')); });
    });
  }

  function advance(){
    idx++; tries = 0;
    if (idx >= ITEMS.length){
      done = true;
      render();
      say(host, 'good', L({
        es:'Terminaste las cinco. Los dos pasos siempre son los mismos: contar clases de partícula y mirar dentro de cada una.',
        en:'You finished all five. The two steps are always the same: count kinds of particle and look inside each one.'
      }));
      return;
    }
    render();
  }

  function pickBin(b){
    if (done) return;
    var it = ITEMS[idx], ks = [], i;
    if (b === it.cat){
      hits++;
      say(host, 'good', L({ es:'Sí: esta caja es ', en:'Yes: this box is ' }) + className(it.cat) + '.');
      setTimeout(advance, 900);
      return;
    }
    tries++;
    if (tries >= 3){
      say(host, 'warm', L({ es:'Era ', en:'It was ' }) + className(it.cat) + '. ' + L({
        es:'Vuelve a los dos pasos con la siguiente caja.',
        en:'Go back to the two steps with the next box.'
      }));
      setTimeout(advance, 1600);
      return;
    }
    for (i = 0; i < it.cell.length; i++) if (ks.indexOf(it.cell[i]) < 0) ks.push(it.cell[i]);
    say(host, 'miss', ks.length === 1
      ? L({ es:'Aún no. Todas las partículas de esta caja son iguales entre sí, así que hay una sola sustancia: la duda está en lo que llevan dentro.',
            en:'Not yet. Every particle in this box is identical to the others, so there is a single substance: the doubt is about what they hold inside.' })
      : L({ es:'Aún no. En esta caja hay más de una clase de partícula: la duda está en si alguna de ellas lleva átomos distintos unidos.',
            en:'Not yet. In this box there is more than one kind of particle: the doubt is whether any of them carries different atoms joined.' }));
  }

  render();
  say(host, '', L({ es:'Toma la primera caja con calma: el conteo va antes que la etiqueta.', en:'Take the first box calmly: the counting comes before the label.' }));
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 3 :: energía y estado de agregación
   Un control de energía reacomoda las mismas partículas en el recipiente y las
   lecturas cambian al instante. Tres observaciones que hay que reproducir.
   ══════════════════════════════════════════════════════════════════════════ */
function wStates(rng, host){
  var N = 24;
  var jx = [], jy = [], gx = [], gy = [], i;
  for (i = 0; i < N; i++){
    jx.push(rng()); jy.push(rng()); gx.push(rng()); gy.push(rng());
  }
  var CASES = [
    { st:0, es:'La muestra conserva su propia forma y su propio volumen, y cada partícula vibra sin cambiar de vecino.',
            en:'The sample keeps its own shape and its own volume, and each particle vibrates without changing neighbour.' },
    { st:1, es:'La muestra conserva su volumen pero toma la forma del recipiente y se puede verter.',
            en:'The sample keeps its volume but takes the shape of the container and can be poured.' },
    { st:2, es:'La muestra llena todo el recipiente y se puede comprimir hasta la mitad de su volumen.',
            en:'The sample fills the whole container and can be compressed to half its volume.' },
    { st:0, es:'Las partículas ocupan posiciones fijas y ordenadas, una junto a otra, sin desplazarse.',
            en:'The particles occupy fixed, ordered positions, one next to another, without moving away.' },
    { st:1, es:'Las partículas siguen tocándose pero se deslizan unas sobre otras sin ningún orden.',
            en:'The particles keep touching but slide over one another with no order at all.' },
    { st:2, es:'Entre partícula y partícula queda mucho espacio vacío y el movimiento es rápido en todas direcciones.',
            en:'Between one particle and the next there is a lot of empty space and the movement is fast in every direction.' }
  ];
  var ROUND = shuffle(CASES, rng).slice(0, 3);
  var STN = [
    { es:'sólido', en:'solid' },
    { es:'líquido', en:'liquid' },
    { es:'gas', en:'gas' }
  ];
  var round = 0, tries = 0, locked = false, done = false, energy = 15;

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Energía y estado', en:'Energy and state' }) + '</div>' +
    '<div class="gw-q" data-r="q"></div>' +
    '<div class="gw-mini">' + L({
      es:'Mueve el control de energía y observa el recipiente. El número de partículas nunca cambia: solo cambian su orden, su separación y su movimiento.',
      en:'Move the energy control and watch the container. The number of particles never changes: only their order, their separation and their movement change.'
    }) + '</div>' +
    '<div class="stbox" data-r="box"><div class="stlid"></div></div>' +
    '<input class="yr" type="range" min="0" max="100" step="1" value="15" data-r="rng">' +
    '<div class="gw-read" data-r="read"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Comprobar', en:'Check' }) + '</button></div>' +
    '<div class="gw-fb"></div>';

  var elQ = host.querySelector('[data-r="q"]'),
      elBox = host.querySelector('[data-r="box"]'),
      elRng = host.querySelector('[data-r="rng"]'),
      elRead = host.querySelector('[data-r="read"]'),
      elChk = host.querySelector('[data-r="chk"]');

  var dots = [], d;
  for (i = 0; i < N; i++){
    d = document.createElement('div');
    d.className = 'sp';
    elBox.appendChild(d);
    dots.push(d);
  }

  function state(){ return energy < 34 ? 0 : (energy < 68 ? 1 : 2); }

  function place(){
    var st = state(), k, col, row, left, bottom, cls;
    for (k = 0; k < N; k++){
      col = k % 8; row = Math.floor(k / 8);
      if (st === 0){
        left = 16 + col * 8.6;
        bottom = 7 + row * 13;
        cls = 'sp vib';
      } else if (st === 1){
        left = 8 + jx[k] * 80;
        bottom = 5 + jy[k] * 42;
        cls = 'sp flow';
      } else {
        left = 4 + gx[k] * 90;
        bottom = 4 + gy[k] * 84;
        cls = 'sp fly';
      }
      dots[k].className = cls;
      dots[k].style.left = left + '%';
      dots[k].style.bottom = bottom + '%';
    }
    var R = [
      { o:{ es:'alto', en:'high' }, d:{ es:'mínima', en:'minimal' }, m:{ es:'vibra en su sitio', en:'vibrates in place' }, f:{ es:'propia', en:'its own' }, v:{ es:'propio', en:'its own' } },
      { o:{ es:'nulo', en:'none' }, d:{ es:'mínima', en:'minimal' }, m:{ es:'se desliza', en:'slides' }, f:{ es:'del recipiente', en:'of the container' }, v:{ es:'propio', en:'its own' } },
      { o:{ es:'nulo', en:'none' }, d:{ es:'grande', en:'large' }, m:{ es:'libre y rápido', en:'free and fast' }, f:{ es:'del recipiente', en:'of the container' }, v:{ es:'del recipiente', en:'of the container' } }
    ][st];
    elRead.innerHTML =
      '<span class="gw-pill">' + L({ es:'estado', en:'state' }) + ': <b>' + L(STN[st]) + '</b></span>' +
      '<span class="gw-pill">' + L({ es:'orden', en:'order' }) + ': <b>' + L(R.o) + '</b></span>' +
      '<span class="gw-pill">' + L({ es:'separación', en:'separation' }) + ': <b>' + L(R.d) + '</b></span>' +
      '<span class="gw-pill">' + L({ es:'movimiento', en:'movement' }) + ': <b>' + L(R.m) + '</b></span>' +
      '<span class="gw-pill">' + L({ es:'forma', en:'shape' }) + ': <b>' + L(R.f) + '</b></span>' +
      '<span class="gw-pill">' + L({ es:'volumen', en:'volume' }) + ': <b>' + L(R.v) + '</b></span>' +
      '<span class="gw-pill">' + L({ es:'partículas', en:'particles' }) + ': <b>' + N + '</b></span>';
    elRng.disabled = locked || done;
  }

  function head(){
    elQ.innerHTML = L({ es:'Observación ', en:'Observation ' }) + (round + 1) + L({ es:' de tres: ', en:' of three: ' }) + L(ROUND[round]);
  }

  function advance(){
    round++; tries = 0; locked = false;
    if (round >= ROUND.length){
      done = true;
      round = ROUND.length - 1;
      elChk.textContent = L({ es:'Completado', en:'Completed' });
      elChk.className = 'gw-btn solved';
      elChk.disabled = true;
      place();
      say(host, 'good', L({
        es:'Las tres observaciones quedaron reproducidas con las mismas veinticuatro partículas. Eso es lo que sostiene el modelo: cambiar de estado no cambia la sustancia.',
        en:'The three observations were reproduced with the same twenty four particles. That is what the model holds: changing state does not change the substance.'
      }));
      return;
    }
    elChk.textContent = L({ es:'Comprobar', en:'Check' });
    elChk.className = 'gw-btn';
    head();
    place();
    say(host, '', L({ es:'Otra observación del cuaderno de laboratorio.', en:'Another observation from the laboratory notebook.' }));
  }

  elRng.addEventListener('input', function(){
    if (locked || done) return;
    energy = parseInt(elRng.value, 10);
    place();
    var st = state(), tg = ROUND[round].st;
    if (st === tg){
      say(host, 'warm', L({ es:'El recipiente ya se comporta como pide la observación. Comprueba para confirmarlo.', en:'The container already behaves as the observation asks. Check to confirm it.' }));
    } else if (st < tg){
      say(host, '', L({ es:'Con esta energía las partículas todavía están demasiado sujetas: sube la energía.', en:'At this energy the particles are still too tied down: raise the energy.' }));
    } else {
      say(host, '', L({ es:'Con esta energía las partículas quedaron demasiado sueltas: baja la energía.', en:'At this energy the particles ended up too loose: lower the energy.' }));
    }
  });

  elChk.addEventListener('click', function(){
    if (done) return;
    if (locked){ advance(); return; }
    var st = state(), tg = ROUND[round].st;
    if (st === tg){
      locked = true;
      elChk.textContent = round === ROUND.length - 1 ? L({ es:'Terminar', en:'Finish' }) : L({ es:'Siguiente observación', en:'Next observation' });
      elChk.className = 'gw-btn solved';
      place();
      say(host, 'good', L({ es:'Correcto: esa observación describe el estado ', en:'Correct: that observation describes the ' }) + L(STN[tg]) + L({ es:'.', en:' state.' }));
      return;
    }
    tries++;
    if (tries >= 3){
      energy = [15, 50, 88][tg];
      elRng.value = String(energy);
      locked = true;
      elChk.textContent = round === ROUND.length - 1 ? L({ es:'Terminar', en:'Finish' }) : L({ es:'Siguiente observación', en:'Next observation' });
      elChk.className = 'gw-btn solved';
      place();
      say(host, 'warm', L({ es:'Esta es la energía que reproduce la observación: el estado ', en:'This is the energy that reproduces the observation: the ' }) + L(STN[tg]) + L({ es:'.', en:' state.' }));
      return;
    }
    say(host, 'miss', st < tg
      ? L({ es:'Todavía no. Fíjate en lo que la observación permite hacer a las partículas y sube la energía.', en:'Not yet. Look at what the observation lets the particles do and raise the energy.' })
      : L({ es:'Todavía no. Con tanta energía la muestra hace más de lo que dice la observación: baja la energía.', en:'Not yet. With that much energy the sample does more than the observation says: lower the energy.' }));
  });

  head();
  place();
  say(host, '', L({ es:'Lee la observación y busca la energía que la reproduce.', en:'Read the observation and look for the energy that reproduces it.' }));
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 4 :: mesa de separación
   Cuatro frascos y cuatro tratamientos. El emparejamiento equivocado explica
   qué quedaría sin separar; a la tercera falla se muestra la mesa resuelta.
   ══════════════════════════════════════════════════════════════════════════ */
function wSeparate(rng, host){
  var PAIRS = [
    { s:{ es:'Arena revuelta con agua, con la arena a la vista en el fondo', en:'Sand stirred into water, with the sand visible at the bottom' },
      m:{ es:'Filtrar: la arena queda en el papel y el agua pasa', en:'Filter: the sand stays on the paper and the water goes through' },
      w:{ es:'la arena seguiría en el agua', en:'the sand would still be in the water' } },
    { s:{ es:'Agua de mar, transparente, con la sal disuelta', en:'Sea water, transparent, with the salt dissolved' },
      m:{ es:'Evaporar el agua: la sal queda en el fondo del recipiente', en:'Evaporate the water: the salt stays at the bottom of the dish' },
      w:{ es:'la sal pasaría por el filtro junto con el agua', en:'the salt would go through the filter along with the water' } },
    { s:{ es:'Limadura de hierro revuelta con azufre en polvo, sin calentar', en:'Iron filings stirred with powdered sulfur, without heating' },
      m:{ es:'Acercar un imán: el hierro se pega y el azufre se queda', en:'Bring a magnet close: the iron sticks to it and the sulfur stays' },
      w:{ es:'los dos polvos seguirían revueltos', en:'the two powders would stay stirred together' } },
    { s:{ es:'Sulfuro de hierro, el sólido gris obtenido al calentar esa misma mezcla', en:'Iron sulfide, the grey solid obtained by heating that same mixture' },
      m:{ es:'Ningún tratamiento físico lo separa: haría falta una reacción química', en:'No physical treatment separates it: a chemical reaction would be needed' },
      w:{ es:'no saldría nada, porque sus átomos están unidos en la misma partícula', en:'nothing would come out, because its atoms are joined in the same particle' } }
  ];
  var order = shuffle(PAIRS.map(function(_, i){ return i; }), rng);
  var assign = [-1, -1, -1, -1];
  var sel = -1, tries = 0, revealed = false, done = false;

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Mesa de separación', en:'Separation bench' }) + '</div>' +
    '<div class="gw-q">' + L({
      es:'Cuatro frascos esperan tratamiento. Elige para cada uno el que devuelve sus componentes sin cambiarlos.',
      en:'Four jars are waiting for treatment. For each one choose the treatment that gives its components back unchanged.'
    }) + '</div>' +
    '<div class="gw-mini">' + L({
      es:'Toca un frasco y después un tratamiento. Si te arrepientes, vuelve a tocar el frasco para liberarlo.',
      en:'Tap a jar and then a treatment. If you change your mind, tap the jar again to release it.'
    }) + '</div>' +
    '<div class="mtrow" data-r="jars"></div>' +
    '<div class="gw-lbl">' + L({ es:'Tratamientos disponibles', en:'Available treatments' }) + '</div>' +
    '<div class="pool" data-r="acts"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Comprobar', en:'Check' }) + '</button></div>' +
    '<div class="gw-fb"></div>';

  var elJ = host.querySelector('[data-r="jars"]'),
      elA = host.querySelector('[data-r="acts"]'),
      elK = host.querySelector('[data-r="chk"]');

  function render(){
    elJ.innerHTML = PAIRS.map(function(p, ci){
      var cls = 'mtcause' + (sel === ci ? ' sel' : '') + (revealed || done ? ' good' : '');
      var slot = assign[ci] < 0
        ? L({ es:'sin tratamiento asignado', en:'no treatment assigned yet' })
        : L(PAIRS[assign[ci]].m);
      return '<div class="' + cls + '" data-c="' + ci + '">' + L(p.s) + '<span class="mtslot">' + slot + '</span></div>';
    }).join('');
    elA.innerHTML = order.map(function(ai){
      var used = assign.indexOf(ai) >= 0;
      return '<button class="mtact" data-a="' + ai + '"' + (used || revealed || done ? ' disabled' : '') + '>' + L(PAIRS[ai].m) + '</button>';
    }).join('');
    if (revealed || done) return;
    elJ.querySelectorAll('.mtcause').forEach(function(dv){
      dv.addEventListener('click', function(){
        var ci = parseInt(dv.getAttribute('data-c'), 10);
        if (assign[ci] >= 0){ assign[ci] = -1; sel = ci; }
        else sel = (sel === ci ? -1 : ci);
        render();
      });
    });
    elA.querySelectorAll('.mtact').forEach(function(b){
      b.addEventListener('click', function(){
        if (sel < 0){
          say(host, 'warm', L({ es:'Primero toca el frasco al que quieres dar ese tratamiento.', en:'First tap the jar you want to give that treatment to.' }));
          return;
        }
        assign[sel] = parseInt(b.getAttribute('data-a'), 10);
        sel = -1;
        render();
      });
    });
  }

  elK.addEventListener('click', function(){
    if (done) return;
    if (revealed){
      done = true;
      elK.textContent = L({ es:'Completado', en:'Completed' });
      elK.className = 'gw-btn solved';
      elK.disabled = true;
      return;
    }
    if (assign.indexOf(-1) >= 0){
      say(host, 'warm', L({ es:'Falta asignar tratamiento a algún frasco.', en:'Some jar still has no treatment assigned.' }));
      return;
    }
    var bad = -1, ci;
    for (ci = 0; ci < PAIRS.length; ci++) if (assign[ci] !== ci){ bad = ci; break; }
    if (bad < 0){
      done = true;
      elK.textContent = L({ es:'Completado', en:'Completed' });
      elK.className = 'gw-btn solved';
      elK.disabled = true;
      render();
      say(host, 'good', L({
        es:'Los tres primeros frascos eran mezclas y por eso un tratamiento físico bastó. El cuarto no cedió ante ninguno: ahí los átomos ya están unidos dentro de la misma partícula.',
        en:'The first three jars were mixtures and that is why a physical treatment was enough. The fourth gave in to none of them: there the atoms are already joined inside the same particle.'
      }));
      return;
    }
    tries++;
    if (tries >= 3){
      revealed = true;
      for (ci = 0; ci < PAIRS.length; ci++) assign[ci] = ci;
      render();
      elK.textContent = L({ es:'Entendido', en:'Got it' });
      say(host, 'miss', L({ es:'Esta es la mesa resuelta. Léela al revés: con el tratamiento que habías puesto, ', en:'This is the solved bench. Read it backwards: with the treatment you had put, ' }) + L(PAIRS[bad].w) + '.');
      return;
    }
    assign[bad] = -1;
    render();
    say(host, 'warm', L({ es:'El tratamiento del primer frasco marcado no funciona: ', en:'The treatment on the first flagged jar does not work: ' }) + L(PAIRS[bad].w) + L({ es:'. Elige otro para ese frasco.', en:'. Choose another one for that jar.' }));
  });

  render();
  say(host, '', L({ es:'Antes de asignar, pregúntate qué diferencia física puede aprovechar cada tratamiento.', en:'Before assigning, ask yourself which physical difference each treatment can take advantage of.' }));
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 5 :: balanza de proporción fija
   La masa de un elemento está fija; el alumno ajusta la del otro y ve cuánto
   reacciona y cuánto sobra. Tres compuestos con proporciones distintas.
   ══════════════════════════════════════════════════════════════════════════ */
function wRatio(rng, host){
  var COMPS = [
    { a:3, b:2, ea:{ es:'magnesio', en:'magnesium' }, eb:{ es:'oxígeno', en:'oxygen' }, c:{ es:'óxido de magnesio', en:'magnesium oxide' } },
    { a:7, b:4, ea:{ es:'hierro', en:'iron' }, eb:{ es:'azufre', en:'sulfur' }, c:{ es:'sulfuro de hierro', en:'iron sulfide' } },
    { a:4, b:1, ea:{ es:'cobre', en:'copper' }, eb:{ es:'oxígeno', en:'oxygen' }, c:{ es:'óxido de cobre', en:'copper oxide' } }
  ];
  var ORDER = shuffle(COMPS, rng);
  var round = 0, tries = 0, locked = false, done = false;
  var cur = null, k = 2, j = 0;

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Balanza de proporción', en:'Proportion balance' }) + '</div>' +
    '<div class="gw-q" data-r="q"></div>' +
    '<div class="gw-mini">' + L({
      es:'La masa del primer elemento ya está en la balanza y no se toca. Ajusta la del segundo hasta que la reacción no deje sobrantes de ninguno.',
      en:'The mass of the first element is already on the balance and is not to be touched. Adjust the mass of the second until the reaction leaves no leftovers of either one.'
    }) + '</div>' +
    '<div data-r="bars"></div>' +
    '<input class="yr" type="range" min="0" max="10" step="1" value="0" data-r="rng">' +
    '<div class="gw-read" data-r="read"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Comprobar', en:'Check' }) + '</button></div>' +
    '<div class="gw-fb"></div>';

  var elQ = host.querySelector('[data-r="q"]'),
      elBars = host.querySelector('[data-r="bars"]'),
      elRng = host.querySelector('[data-r="rng"]'),
      elRead = host.querySelector('[data-r="read"]'),
      elChk = host.querySelector('[data-r="chk"]');

  function setup(){
    cur = ORDER[round];
    k = ri(rng, 2, 4);
    j = pk(rng, [0, 1, 2 * k, 2 * k - 1]);
    if (j === k) j = 0;
    tries = 0; locked = false;
    elRng.min = '0'; elRng.max = String(2 * k); elRng.step = '1'; elRng.value = String(j);
  }

  function bar(lbl, reacted, total, val){
    var pr = total > 0 ? Math.round(reacted / total * 100) : 0;
    return '<div class="rxrow"><span class="rxlbl">' + lbl + '</span>' +
      '<span class="rxbar"><i class="rx" style="width:' + pr + '%"></i><i class="lf" style="width:' + (100 - pr) + '%"></i></span>' +
      '<span class="rxval">' + val + '</span></div>';
  }

  function draw(){
    var mA = cur.a * k, mB = cur.b * j;
    var used = Math.min(j, k);
    var rA = cur.a * used, rB = cur.b * used;
    var comp = rA + rB;
    elQ.innerHTML = L({ es:'Compuesto ', en:'Compound ' }) + (round + 1) + L({ es:' de tres: ', en:' of three: ' }) + L(cur.c) +
      '  ·  ' + L({ es:'se combinan ', en:'they combine ' }) + cur.a + L({ es:' g de ', en:' g of ' }) + L(cur.ea) +
      L({ es:' con ', en:' with ' }) + cur.b + L({ es:' g de ', en:' g of ' }) + L(cur.eb);
    elBars.innerHTML =
      bar(L(cur.ea), rA, mA, mA + ' g') +
      bar(L(cur.eb), rB, mB, mB + ' g');
    elRead.innerHTML =
      '<span class="gw-pill">' + L({ es:'reacciona', en:'reacts' }) + ': <b>' + rA + ' g + ' + rB + ' g</b></span>' +
      '<span class="gw-pill">' + L({ es:'compuesto formado', en:'compound formed' }) + ': <b>' + comp + ' g</b></span>' +
      '<span class="gw-pill">' + L({ es:'sobra ', en:'left over ' }) + L(cur.ea) + ': <b>' + (mA - rA) + ' g</b></span>' +
      '<span class="gw-pill">' + L({ es:'sobra ', en:'left over ' }) + L(cur.eb) + ': <b>' + (mB - rB) + ' g</b></span>';
    elRng.disabled = locked || done;
  }

  function advance(){
    round++;
    if (round >= ORDER.length){
      done = true;
      round = ORDER.length - 1;
      elChk.textContent = L({ es:'Completado', en:'Completed' });
      elChk.className = 'gw-btn solved';
      elChk.disabled = true;
      draw();
      say(host, 'good', L({
        es:'Tres compuestos, tres proporciones distintas y siempre la misma regla: cada compuesto exige su relación de masas y el exceso se queda fuera.',
        en:'Three compounds, three different proportions and always the same rule: each compound demands its own mass relation and the excess stays out.'
      }));
      return;
    }
    setup();
    elChk.textContent = L({ es:'Comprobar', en:'Check' });
    elChk.className = 'gw-btn';
    draw();
    say(host, '', L({ es:'Otro compuesto en la balanza.', en:'Another compound on the balance.' }));
  }

  elRng.addEventListener('input', function(){
    if (locked || done) return;
    j = parseInt(elRng.value, 10);
    draw();
    var mA = cur.a * k, used = Math.min(j, k);
    if (j === k){
      say(host, 'warm', L({ es:'Ya no sobra nada de ninguno de los dos. Comprueba para confirmarlo.', en:'Nothing is left over from either one now. Check to confirm it.' }));
    } else if (j < k){
      say(host, '', L({ es:'Todavía sobran ', en:'There are still ' }) + (mA - cur.a * used) + L({ es:' g de ', en:' g of ' }) + L(cur.ea) + L({ es:' sin reaccionar: hace falta más ', en:' left unreacted: more ' }) + L(cur.eb) + L({ es:'.', en:' is needed.' }));
    } else {
      say(host, '', L({ es:'Ahora sobran ', en:'Now there are ' }) + (cur.b * (j - k)) + L({ es:' g de ', en:' g of ' }) + L(cur.eb) + L({ es:' sin reaccionar: te pasaste.', en:' left unreacted: you went too far.' }));
    }
  });

  elChk.addEventListener('click', function(){
    if (done) return;
    if (locked){ advance(); return; }
    if (j === k){
      locked = true;
      elChk.textContent = round === ORDER.length - 1 ? L({ es:'Terminar', en:'Finish' }) : L({ es:'Siguiente compuesto', en:'Next compound' });
      elChk.className = 'gw-btn solved';
      draw();
      say(host, 'good', L({
        es:'Exacto: ' + (cur.a * k) + ' g de ' + L(cur.ea) + ' piden ' + (cur.b * k) + ' g de ' + L(cur.eb) + ' y forman ' + ((cur.a + cur.b) * k) + ' g de ' + L(cur.c) + ', sin sobrantes.',
        en:'Exactly: ' + (cur.a * k) + ' g of ' + L(cur.ea) + ' call for ' + (cur.b * k) + ' g of ' + L(cur.eb) + ' and form ' + ((cur.a + cur.b) * k) + ' g of ' + L(cur.c) + ', with no leftovers.'
      }));
      return;
    }
    tries++;
    if (tries >= 3){
      j = k;
      elRng.value = String(j);
      locked = true;
      elChk.textContent = round === ORDER.length - 1 ? L({ es:'Terminar', en:'Finish' }) : L({ es:'Siguiente compuesto', en:'Next compound' });
      elChk.className = 'gw-btn solved';
      draw();
      say(host, 'warm', L({
        es:'Esta es la masa que encaja: ' + (cur.b * k) + ' g de ' + L(cur.eb) + ' para ' + (cur.a * k) + ' g de ' + L(cur.ea) + '. La relación se repite tantas veces como haga falta.',
        en:'This is the mass that fits: ' + (cur.b * k) + ' g of ' + L(cur.eb) + ' for ' + (cur.a * k) + ' g of ' + L(cur.ea) + '. The relation repeats as many times as needed.'
      }));
      return;
    }
    say(host, 'miss', j < k
      ? L({ es:'Aún no. Queda ' + L(cur.ea) + ' sin reaccionar, así que falta ' + L(cur.eb) + ' en la balanza.',
            en:'Not yet. There is ' + L(cur.ea) + ' left unreacted, so the balance is short of ' + L(cur.eb) + '.' })
      : L({ es:'Aún no. Ahora el sobrante es de ' + L(cur.eb) + ', así que hay que quitar masa de la balanza.',
            en:'Not yet. Now the leftover is ' + L(cur.eb) + ', so mass has to be taken off the balance.' }));
  });

  setup();
  draw();
  say(host, '', L({ es:'Mueve el control y observa cuál de los dos elementos queda sobrando.', en:'Move the control and watch which of the two elements is left over.' }));
}

<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbzLGV15JRTPs9bbSvHRLfgOXeT9oUExDf1AH546WOwq5tYxXSdhX212OWi_bTJfMGx9/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'Diferencias entre Mezclas, Compuestos y Elementos';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
