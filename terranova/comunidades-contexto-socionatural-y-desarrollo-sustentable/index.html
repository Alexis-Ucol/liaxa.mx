  addSection(S('CONCEPTO 4', 'CONCEPT 4'),
    '<h2>' + S('De la molestia a la acción: cómo decide una comunidad', 'From complaint to action: how a community decides') + '</h2>' +
    '<p>' + S('Darse cuenta de un problema no lo resuelve, y quejarse tampoco. Una ciudadanía activa hace otra cosa: se informa, junta a quienes están involucrados, lleva el asunto a donde se decide, acuerda reglas por escrito, reparte tareas y después revisa si aquello funcionó.',
              'Noticing a problem does not solve it, and complaining does not either. Active citizenship does something else: it gets informed, brings together those involved, takes the matter to where decisions are made, agrees rules in writing, shares out tasks and afterwards reviews whether it worked.') + '</p>' +
    '<p>' + S('Dos detalles deciden si el acuerdo aguanta. El primero: escuchar a quienes dependen del recurso antes de decidir, porque son quienes conocen el detalle y quienes van a cargar con la consecuencia. El segundo: dejar una fecha de revisión, porque un acuerdo que nadie vuelve a mirar se cae solo en cuanto cambian las condiciones.',
              'Two details decide whether the agreement holds. The first: listening to those who depend on the resource before deciding, because they know the detail and they will carry the consequence. The second: setting a review date, because an agreement nobody looks at again falls apart as soon as conditions change.') + '</p>' +
    '<div class="rules-grid">' +
      '<div class="rcard"><div class="rname">' + S('Informarse', 'Get informed') + '</div><div class="rform">' + S('datos antes que opiniones', 'data before opinions') + '</div><div class="rnote">' + S('Qué pasa, dónde y desde cuándo.', 'What is happening, where and since when.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Escuchar', 'Listen') + '</div><div class="rform">' + S('quien depende del recurso', 'whoever depends on the resource') + '</div><div class="rnote">' + S('Sin su voz el acuerdo se decide sobre ellos.', 'Without their voice the agreement is decided over them.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Acordar', 'Agree') + '</div><div class="rform">' + S('reglas y tareas por escrito', 'rules and tasks in writing') + '</div><div class="rnote">' + S('Queda claro quién hace qué.', 'It becomes clear who does what.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Revisar', 'Review') + '</div><div class="rform">' + S('una fecha para volver a mirar', 'a date to look again') + '</div><div class="rnote">' + S('Permite corregir lo que salió mal.', 'It allows what went wrong to be corrected.') + '</div></div>' +
    '</div>');

  addProblem(pick([
    { title:{ es:'El acuerdo de la leña', en:'The firewood agreement' }, showWork:false,
      stmt:{ es:'La asamblea escribe este acuerdo: cada familia podrá juntar leña seca del monte, ninguna podrá derribar árboles vivos, dos personas recorrerán el monte cada mes y el acuerdo se revisará dentro de un año. ¿Cuál de sus partes es la que evita que el monte se agote?',
             en:'The assembly writes this agreement: each family may collect dry firewood from the woodland, none may fell living trees, two people will walk the woodland every month and the agreement will be reviewed in a year. Which of its parts is the one that keeps the woodland from running out?' },
      options:{ es:[
        'Permitir solo leña seca: se toma lo que el monte ya soltó y quedan en pie los árboles que siguen creciendo',
        'El recorrido mensual de dos personas, que por sí solo hace que el monte reponga los árboles que se cortan',
        'El plazo de un año, porque el acuerdo termina antes de que el monte alcance a sufrir algún daño',
        'Que el acuerdo esté escrito, lo cual asegura que ninguna familia lo incumpla durante ese año'],
        en:[
        'Allowing only dry firewood: what the woodland has already dropped is taken and the trees still growing stay standing',
        'The monthly walk by two people, which on its own makes the woodland replace the trees that are cut',

        'That the agreement is written down, which ensures no family breaks it during that year'] },
      correct:0,
      hint:{ es:'Separa lo que sirve para vigilar el acuerdo de lo que realmente limita cuánto sale del monte.',
             en:'Separate what serves to watch over the agreement from what actually limits how much leaves the woodland.' },
      explanation:{ es:'El recorrido, el plazo y la escritura sirven para que el acuerdo se cumpla y se corrija, pero ninguno cambia la cantidad que sale del monte. Lo que la cambia es el límite de fondo: si solo se junta leña seca, se aprovecha lo que el monte ya dejó caer y los árboles vivos siguen creciendo y reponiendo.',
                    en:'The walk, the term and the writing serve to have the agreement met and corrected, but none of them changes the amount that leaves the woodland. What changes it is the underlying limit: if only dry firewood is collected, what the woodland has already dropped is used and the living trees keep growing and replacing.' } },
    { title:{ es:'El acuerdo del agua del pozo', en:'The agreement on the well water' }, showWork:false,
      stmt:{ es:'Una asamblea acuerda esto: cada familia podrá llenar dos tambos por día, el orden se turnará por calles, tres vecinos anotarán el nivel del pozo cada semana y el acuerdo se revisará al terminar la temporada de secas. ¿Cuál de sus partes es la que evita que el pozo se quede sin agua?',
             en:'An assembly agrees this: each family may fill two drums a day, the order will rotate street by street, three neighbours will note the level of the well every week and the agreement will be reviewed when the dry season ends. Which of its parts is the one that keeps the well from running dry?' },
      options:{ es:[
        'El tope de dos tambos por familia al día, que fija cuánta agua sale del pozo en total',
        'El turno por calles, que reparte el horario y con eso reduce la cantidad de agua que se saca',
        'La anotación semanal del nivel, que por sí sola devuelve al pozo el agua que se va sacando',
        'La revisión al terminar las secas, porque el pozo se repone justo cuando el acuerdo se vuelve a discutir'],
        en:[
        'The cap of two drums per family a day, which sets how much water leaves the well in total',
        'The rotation by streets, which spreads out the timing and thereby reduces the amount of water taken',
        'The weekly note of the level, which on its own returns to the well the water being taken out',
        'The review at the end of the dry season, because the well refills just as the agreement is discussed again'] },
      correct:0,
      hint:{ es:'Pregúntate cuál de las cuatro partes cambia la cantidad de agua que sale del pozo.',
             en:'Ask which of the four parts changes the amount of water that leaves the well.' },
      explanation:{ es:'Los turnos ordenan quién saca a qué hora, la anotación avisa cómo va el nivel y la revisión permite corregir. Son útiles, pero el volumen que sale del pozo lo fija una sola de las cuatro partes: el tope por familia. Sin ese tope, ordenar los turnos solo reparte el mismo vaciado entre más horas.',
                    en:'The rotation orders who draws at what time, the note warns how the level is going and the review allows correction. They are useful, but the volume leaving the well is set by only one of the four parts: the cap per family. Without that cap, ordering the turns merely spreads the same emptying over more hours.' } }
  ], rng), rng);

  /* ── PROBLEMA 9 ─────────────────────────────────────────────── */
  addProblem(pick([
    { title:{ es:'Dos escuelas y el agua', en:'Two schools and the water' }, showWork:false,
      stmt:{ es:'Dos escuelas anuncian acciones por el agua. La primera pinta en la entrada un mural sobre el cuidado del agua. La segunda cambia las llaves que goteaban, mide cada mes cuánta agua gasta y publica el resultado en la entrada. ¿Cuál de las dos reduce de verdad el uso de agua?',
             en:'Two schools announce actions for water. The first paints a mural about looking after water at the entrance. The second replaces the taps that were dripping, measures each month how much water it uses and posts the result at the entrance. Which of the two really reduces water use?' },
      options:{ es:[
        'La segunda: corrige la fuga y además mide, de modo que puede saber si el gasto bajó y ajustar lo que falte',
        'La primera: informar a la comunidad escolar es lo único que hace falta para que el gasto de agua baje',
        'Las dos por igual: cualquier acción que se anuncie en la entrada tiene el mismo efecto sobre el gasto de agua',
        'Ninguna de las dos: el gasto de agua de una escuela depende del número de personas y no de lo que la escuela haga'],
        en:[
        'The second: it fixes the leak and also measures, so it can tell whether use fell and adjust what is left over',
        'The first: informing the school community is the only thing needed for water use to fall',
        'Both equally: any action announced at the entrance has the same effect on water use',
        'Neither one: the water use of a school depends on the number of people and not on what the school does'] },
      correct:0,
      hint:{ es:'Busca cuál de las dos acciones cambia algo que gasta agua y cuál además permite comprobarlo.',
             en:'Look for which of the two actions changes something that uses water and which also lets you check it.' },
      explanation:{ es:'Un mural puede ayudar a que la gente se fije, pero una llave que gotea sigue goteando aunque todos lo lean. La segunda escuela toca la causa y además mide, y esa medición es lo que permite saber si la acción sirvió. Sin medida, cualquier anuncio se queda en intención.',
                    en:'A mural can help people pay attention, but a dripping tap keeps dripping however many people read it. The second school touches the cause and also measures, and that measurement is what tells whether the action worked. Without a measure, any announcement stays an intention.' } },
    { title:{ es:'Dos barrios y los árboles', en:'Two neighbourhoods and the trees' }, showWork:false,
      stmt:{ es:'Dos barrios anuncian acciones por el arbolado. El primero organiza una jornada en la que se plantan muchos arbolitos en un solo día y se toman fotografías. El segundo planta menos arbolitos, reparte por calles quién los riega y revisa cada mes cuántos siguen vivos. ¿Cuál de los dos aumenta de verdad el arbolado?',
             en:'Two neighbourhoods announce actions for tree cover. The first organises a day on which many saplings are planted in one go and photographs are taken. The second plants fewer saplings, shares out street by street who waters them and checks each month how many are still alive. Which of the two really increases tree cover?' },
      options:{ es:[
        'El segundo: se hace cargo del riego y revisa cuántos sobreviven, que es lo que decide si al final hay más árboles',
        'El primero: mientras más arbolitos se planten en la jornada, más árboles habrá en el barrio al cabo de los años',
        'Los dos por igual: la cantidad de árboles de un barrio depende únicamente de cuántos se hayan plantado',
        'Ninguno de los dos: el arbolado de un barrio depende del clima del año y no del cuidado que reciba'],
        en:[
        'The second: it takes charge of the watering and checks how many survive, which is what decides whether there are more trees in the end',
        'The first: the more saplings planted on the day, the more trees the neighbourhood will have as the years go by',
        'Both equally: the number of trees in a neighbourhood depends only on how many have been planted',
        'Neither one: the tree cover of a neighbourhood depends on the weather of the year and not on the care it receives'] },
      correct:0,
      hint:{ es:'Piensa qué le pasa a un arbolito plantado en marzo cuando llega mayo y nadie lo ha regado.',
             en:'Think what happens to a sapling planted in March when May arrives and nobody has watered it.' },
      explanation:{ es:'Plantar es apenas el primer día. Un arbolito sin riego ni responsable se seca antes del año, así que la cuenta que importa no es cuántos se plantaron sino cuántos siguen vivos. El segundo barrio reparte la tarea y revisa, y por eso su jornada se convierte en árboles y no solo en fotografías.',
                    en:'Planting is barely the first day. A sapling with no watering and nobody responsible dries out within the year, so the count that matters is not how many were planted but how many are still alive. The second neighbourhood shares out the task and checks, and that is why its day turns into trees and not only into photographs.' } }
  ], rng), rng);

  /* ── PROBLEMA 10 ────────────────────────────────────────────── */
  addProblem(pick([
    { title:{ es:'Que el plan aguante veinte años', en:'Making the plan last twenty years' }, showWork:true,
      stmt:{ es:'Una comunidad quiere que su plan para el bosque siga funcionando dentro de veinte años. ¿Cuál de estos rasgos hace más probable que aguante todo ese tiempo?',
             en:'A community wants its woodland plan to still be working twenty years from now. Which of these features makes it most likely to last all that time?' },
      options:{ es:[
        'Que el corte anual quede por debajo de lo que el bosque repone, que las familias que viven de él tengan sustento y que el acuerdo se revise cada cierto tiempo',
        'Que el plan lo diseñe una sola persona con experiencia, de modo que no se pierda tiempo en discusiones de asamblea',
        'Que el plan sea muy estricto el primer año y después se deje de aplicar, porque el bosque ya habrá descansado lo suficiente',
        'Que el plan se anuncie en la fiesta más concurrida del año, con lo cual todas las familias quedan enteradas de lo acordado'],
        en:[
        'That the yearly cut stays below what the woodland replaces, that the families living from it have a livelihood and that the agreement is reviewed from time to time',
        'That the plan be designed by a single experienced person, so that no time is lost in assembly discussions',
        'That the plan be very strict the first year and then be dropped, because the woodland will already have rested enough',
        'That the plan be announced at the busiest festival of the year, so that all the families learn what was agreed'] },
      correct:0,
      hint:{ es:'Un plan largo se puede caer por tres lados: por el recurso, por la gente y por la falta de revisión. Busca el rasgo que atiende los tres.',
             en:'A long plan can fall on three sides: the resource, the people and the lack of review. Look for the feature that covers all three.' },
      explanation:{ es:'Veinte años son muchas temporadas y muchos cambios. El plan aguanta si el bosque no se vacía, porque el corte queda por debajo de lo que repone; si la gente que depende de él puede vivir, porque de otro modo buscará otra salida por su cuenta; y si hay una revisión que permita corregir lo que salió mal. Diseñarlo una sola persona, aplicarlo un año o anunciarlo bien no cubren ninguno de los tres.',
                    en:'Twenty years are many seasons and many changes. The plan holds if the woodland is not emptied, because the cut stays below what is replaced; if the people who depend on it can live, since otherwise they will find their own way out; and if there is a review that allows what went wrong to be corrected. Having one person design it, applying it for a year or announcing it well cover none of the three.' } },
    { title:{ es:'El plan del agua a largo plazo', en:'The long term water plan' }, showWork:true,
      stmt:{ es:'Un barrio quiere que su plan para cuidar el agua del pozo siga funcionando cuando quienes lo firmaron ya no estén al frente. ¿Cuál de estos rasgos lo hace más probable?',
             en:'A neighbourhood wants its plan for looking after the well water to keep working once those who signed it are no longer in charge. Which of these features makes that most likely?' },
      options:{ es:[
        'Que lo que se saca quede por debajo de lo que la lluvia repone, que el uso diario de las familias quede cubierto y que haya una fecha fija para revisar el acuerdo',
        'Que el acuerdo quede firmado por el mayor número posible de vecinos, porque las firmas obligan a cumplirlo con el paso de los años',
        'Que el plan sea muy exigente al principio y se relaje después, ya que el pozo se habrá recuperado con los primeros meses',
        'Que la vigilancia quede a cargo de una sola familia de confianza, de modo que nadie más tenga que ocuparse del asunto'],
        en:[
        'That what is drawn stays below what the rain replaces, that the daily use of the families is covered and that there is a fixed date to review the agreement',
        'That the agreement be signed by as many neighbours as possible, because signatures compel people to keep it as the years pass',
        'That the plan be very demanding at first and relax afterwards, since the well will have recovered during the first months',
        'That the watching over it be left to a single trusted family, so that nobody else has to deal with the matter'] },
      correct:0,
      hint:{ es:'Piensa en las tres cosas que pueden hacer que un acuerdo se caiga: el recurso, la gente y el paso del tiempo.',
             en:'Think of the three things that can make an agreement fall: the resource, the people and the passing of time.' },
      explanation:{ es:'Un acuerdo dura cuando no gasta más de lo que entra, cuando a la gente le alcanza para su uso diario y cuando existe un momento previsto para revisarlo. Las firmas no reponen agua, relajar el plan devuelve el problema al punto de partida y dejar todo en una sola familia hace que el acuerdo se caiga en cuanto esa familia deje de estar.',
                    en:'An agreement lasts when it does not spend more than comes in, when people have enough for their daily use and when there is a moment set aside to review it. Signatures do not replace water, relaxing the plan returns the problem to its starting point and leaving everything to one family makes the agreement fall as soon as that family is gone.' } }
  ], rng), rng);
}

<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbykkuJ_apGq3vALIFd4mr3acu81c7K4OKxW-DZ-i52Ceyl3lOanXMdvbS9SIXPrLQBm/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'Comunidades, Contexto Socionatural y Desarrollo Sustentable';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
