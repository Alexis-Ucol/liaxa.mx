<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diferencias entre Compuestos Iónicos y Moleculares</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; text-align: justify; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Diferencias entre Compuestos Iónicos y Moleculares</div>
    <div class="wcourse" id="wcourse-el">Química · 3° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Diferencias entre Compuestos Iónicos y Moleculares</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="sbtn" id="dlBtn" onclick="generatePDF()" style="max-width:280px;margin:0 auto;">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   CENTRALIZED SCHOOL CONFIG (Rule 16) — ships UNBRANDED (Rule 11).
   The ONLY rebranding point. build_all.py substitutes these exact fields
   (BRAND_FIELDS / RGB_FIELDS / logo*) downstream; :root/dark stay as fallback.
   Neutral defaults below == the static :root/dark values, so unbranded == no-op.
   ══════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:'#24240c', primaryDark:'#3f3f14', primaryBg:'#f4f4e9',
  accent:'#fcb40c', accentBg:'#fff4db',
  darkPrimary:'#b4b455', darkPrimaryDark:'#d7d783', darkPrimaryBg:'#343412',

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);

  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');

}

async function generatePDF() {
  var btn = document.getElementById('dlBtn');
  btn.textContent = 'Generando PDF…';
  btn.disabled = true;

  var jspdf   = window.jspdf;
  var doc     = new jspdf.jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });
  var PW      = 215.9;
  var M       = 18;
  var TW      = PW - M * 2;
  var PH      = doc.internal.pageSize.height;
  var name    = studentData.name;
  var group   = studentData.group;
  var total   = problems.length;
  var pct     = Math.round(correctCount / total * 100);
  var dateStr = new Date().toLocaleString('es-MX', { dateStyle:'long', timeStyle:'short' });

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS — INJECTION BLOCK ─────────────────────────────────────────
  //   Match these RGB values to --green and --gold above.
  //   PRIMARY  → pBR, pBG, pBB
  //   ACCENT   → pAR, pAG, pAB
  // ──────────────────────────────────────────────────────────────────────────
  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;  // PRIMARY (from SCHOOL, Rule 16)
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;   // ACCENT (from SCHOOL, Rule 16)

  function pdfText(html) {
    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/\u2192/g,'->').replace(/\u2212/g,'-').replace(/\u00b2/g,'^2')
      .replace(/\u00b3/g,'^3').replace(/\u00d7/g,'x').replace(/\u00f7/g,'/')
      .replace(/\u2260/g,'!=').replace(/\u2264/g,'<=').replace(/\u2265/g,'>=')
      .replace(/\u221a/g,'sqrt').replace(/\u03c0/g,'pi').replace(/\u2026/g,'...')
      .replace(/\s+/g,' ').trim();

  var _fname   = 'qui3_t08_g01_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf';

  function _openPdfInline(b){
    var u = URL.createObjectURL(b);
    var w = window.open(u, '_blank');
    if (!w) { window.location.href = u; }
    setTimeout(function(){ URL.revokeObjectURL(u); }, 60000);
  }

  var _isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
               (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  if (_isIOS) {
    var _pdfFile = new File([_pdfBlob], _fname, { type:'application/pdf' });
    if (navigator.canShare && navigator.canShare({ files:[_pdfFile] })) {
      navigator.share({ files:[_pdfFile], title:_fname })
        .then(_restorePdfBtn)
        .catch(function(e){
          if (e && e.name === 'AbortError') { _restorePdfBtn(); return; }
          _openPdfInline(_pdfBlob); _restorePdfBtn();
        });
      return;
    }
    _openPdfInline(_pdfBlob); _restorePdfBtn();
    return;
  }

  var _dlUrl = URL.createObjectURL(_pdfBlob);
  var _dlA   = document.createElement('a');
  _dlA.href  = _dlUrl; _dlA.download = _fname;
  document.body.appendChild(_dlA); _dlA.click();
  setTimeout(function(){ document.body.removeChild(_dlA); URL.revokeObjectURL(_dlUrl); }, 200);
  _restorePdfBtn();
}

/* ══════════════════════════════════════════════════════════════════════════
   GUIA :: qui3_t08_g01 - Diferencias entre compuestos ionicos y moleculares.
   Formacion (transferencia vs comparticion, electronegatividad y tabla),
   estructura (red ionica vs moleculas discretas), pruebas experimentales
   (fusion, fragilidad, solubilidad, conductividad) y aprovechamiento en el
   cuerpo humano y otros ambitos.
   Bilingue (Rule 10), variantes por semilla (Rule 4), manipulativos marcados
   con data-widget (Part 0).
   ══════════════════════════════════════════════════════════════════════════ */
function L(o){ return (o && o[LANG] !== undefined) ? o[LANG] : (o ? o.es : ''); }
function vpick(rng, list){ return list[Math.floor(rng() * list.length)]; }
function nInt(rng, a, b){ return a + Math.floor(rng() * (b - a + 1)); }
function gcd2(a, b){ a = Math.abs(a); b = Math.abs(b); while (b){ var t = b; b = a % b; a = t; } return a; }
function sub(sym, n){ return sym + (n > 1 ? '<sub>' + n + '</sub>' : ''); }
function ionLbl(sym, q){ return sym + '<sup>' + (Math.abs(q) > 1 ? Math.abs(q) : '') + (q > 0 ? '+' : '-') + '</sup>'; }

function rcard(name, form, note){
  return '<div class="rcard"><div class="rname">' + name + '</div><div class="rform">' + form + '</div><div class="rnote">' + note + '</div></div>';
}

function sec(tag, title, html){
  var d = document.createElement('div');
  d.className = 'section';
  d.innerHTML = '<div class="stag">' + tag + '</div><h2>' + title + '</h2>' + html;
  document.getElementById('lessonBody').appendChild(d);
  return d;
}

function widgetHost(parent, id, kind){
  var d = document.createElement('div');
  d.className = 'gw section';
  d.id = id;
  d.setAttribute('data-widget', kind);
  parent.appendChild(d);
  return d;
}

function addProblem(rng, v){
  var idx = problems.length;
  var opts = L(v.opts).slice();
  var correctVal = opts[v.ci];
  var sh = shuffle(opts, rng);
  var prob = {
    title: L(v.title),
    questionText: L(v.q),
    fn: '',
    hint: L(v.hint),
    explanation: L(v.exp),
    options: sh,
    correctIdx: sh.indexOf(correctVal),
    showWork: !!v.showWork,
    studentChoice: null,
    pendingChoice: null
  };
  problems.push(prob);
  buildOneCard(prob, idx);
}

    '@media (max-width:600px){.gw{padding:.75rem;}.bl-ball{width:60px;height:60px;font-size:.92rem;}.bl-at{min-width:48px;font-size:.78rem;}.cg-name{min-width:74px;font-size:.68rem;}.ck-beaker{width:84px;}.tb-line{font-size:.74rem;}}'
  ].join('');
  document.head.appendChild(s);
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 1 :: laboratorio de enlace
   El estudiante junta dos atomos y ve en vivo si los electrones se transfieren
   o se comparten, con la diferencia de electronegatividad actualizandose a
   cada toque. Tres encargos distintos, retroalimentacion direccional.
   ══════════════════════════════════════════════════════════════════════════ */
function wEnlace(rng, host){
  var POOL = [
    { s:'K',  es:'potasio',   en:'potassium', x:0.82, k:'me' },
    { s:'Na', es:'sodio',     en:'sodium',    x:0.93, k:'me' },
    { s:'Ca', es:'calcio',    en:'calcium',   x:1.00, k:'me' },
    { s:'Mg', es:'magnesio',  en:'magnesium', x:1.31, k:'me' },
    { s:'Al', es:'aluminio',  en:'aluminium', x:1.61, k:'me' },
    { s:'H',  es:'hidrógeno', en:'hydrogen',  x:2.20, k:'nm' },
    { s:'C',  es:'carbono',   en:'carbon',    x:2.55, k:'nm' },
    { s:'S',  es:'azufre',    en:'sulfur',    x:2.58, k:'nm' },
    { s:'N',  es:'nitrógeno', en:'nitrogen',  x:3.04, k:'nm' },
    { s:'Cl', es:'cloro',     en:'chlorine',  x:3.16, k:'nm' },
    { s:'O',  es:'oxígeno',   en:'oxygen',    x:3.44, k:'nm' },
    { s:'F',  es:'flúor',     en:'fluorine',  x:3.98, k:'nm' }
  ];
  var MIS = shuffle(['ionico', 'molecular', 'fuerte'], rng);
  var st = { r:0, tries:0, sel:[], done:false };

  function d(a, b){ return Math.abs(a.x - b.x); }
  function ok(m, a, b){
    var dd = d(a, b);
    if (m === 'ionico')    return a.k !== b.k && dd >= 1.7;
    if (m === 'fuerte')    return a.k !== b.k && dd >= 2.5;
    return a.k === 'nm' && b.k === 'nm';
  }
  function misText(m){
    if (m === 'ionico')  return L({ es:'Junta dos átomos que formen un compuesto iónico.', en:'Put together two atoms that form an ionic compound.' });
    if (m === 'fuerte')  return L({ es:'Junta dos átomos cuya diferencia de electronegatividad pase de 2.5.', en:'Put together two atoms whose electronegativity difference goes past 2.5.' });
    return L({ es:'Junta dos átomos que formen un compuesto molecular.', en:'Put together two atoms that form a molecular compound.' });
  }

  host.innerHTML =
    '<div class="gw-h iw-tag">' + L({ es:'Laboratorio de enlace', en:'Bonding bench' }) + '</div>' +
    '<div class="gw-q" data-r="q"></div>' +
    '<div class="gw-mini iw-sub">' + L({
      es:'Toca un átomo para ponerlo en la mesa y tócalo otra vez para quitarlo. Con dos átomos en la mesa verás qué hacen sus electrones.',
      en:'Tap an atom to put it on the bench and tap it again to take it off. With two atoms on the bench you will see what their electrons do.'
    }) + '</div>' +
    '<div class="bl-pal" data-r="pal"></div>' +
    '<div class="bl-stage" data-r="stage"></div>' +
    '<div class="gw-read" data-r="info"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="go"></button></div>' +
    '<div class="gw-fb" data-r="fb"></div>';

  var elQ = host.querySelector('[data-r="q"]'),
      elP = host.querySelector('[data-r="pal"]'),
      elS = host.querySelector('[data-r="stage"]'),
      elI = host.querySelector('[data-r="info"]'),
      elG = host.querySelector('[data-r="go"]'),
      elF = host.querySelector('[data-r="fb"]');

  function say(cls, msg){ elF.className = 'gw-fb' + (cls ? ' ' + cls : ''); elF.innerHTML = msg; }

  function stage(){
    if (st.sel.length < 2){
      elS.innerHTML = '<div class="bl-empty">' + L({ es:'La mesa está vacía. Elige dos átomos.', en:'The bench is empty. Choose two atoms.' }) + '</div>';
      elI.innerHTML = '';
      return;
    }
    var a = POOL[st.sel[0]], b = POOL[st.sel[1]];
    if (a.x > b.x){ var t = a; a = b; b = t; }
    var dd = d(a, b), transf = (a.k !== b.k && dd >= 1.7);
    var link = transf
      ? '<div class="bl-dots">' + '→ • →' + '</div><div>' + L({ es:'transferencia', en:'transfer' }) + '</div>'
      : '<div class="bl-dots">' + '••' + '</div><div>' + (dd >= 0.5
          ? L({ es:'comparten, desigual', en:'shared, unequally' })
          : L({ es:'comparten por igual', en:'shared equally' })) + '</div>';
    elS.innerHTML =
      '<div class="bl-ball' + (transf ? ' pos' : '') + '">' + a.s + (transf ? '<sup>+</sup>' : '') + '<small>' + a.x.toFixed(2) + '</small></div>' +
      '<div class="bl-link">' + link + '</div>' +
      '<div class="bl-ball' + (transf ? ' neg' : '') + '">' + b.s + (transf ? '<sup>-</sup>' : '') + '<small>' + b.x.toFixed(2) + '</small></div>';
    elI.innerHTML =
      '<span class="gw-pill">' + L(a) + ' + ' + L(b) + '</span>' +
      '<span class="gw-pill">ΔEN: <b>' + dd.toFixed(2) + '</b></span>' +
      '<span class="gw-pill">' + (a.k === 'me' || b.k === 'me'
        ? L({ es:'metal con no metal', en:'metal with nonmetal' })
        : L({ es:'dos no metales', en:'two nonmetals' })) + '</span>' +
      '<span class="gw-pill">' + (transf
        ? L({ es:'compuesto iónico', en:'ionic compound' })
        : L({ es:'compuesto molecular', en:'molecular compound' })) + '</span>';
  }

  function render(){
    elQ.textContent = st.done
      ? L({ es:'Mesa cerrada: los tres encargos están resueltos.', en:'Bench closed: the three assignments are solved.' })
      : (st.r + 1) + ' / 3 · ' + misText(MIS[st.r]);
    var h = '';
    for (var i = 0; i < POOL.length; i++){
      h += '<button class="bl-at ' + POOL[i].k + (st.sel.indexOf(i) >= 0 ? ' sel' : '') + '" data-i="' + i + '"' + (st.done ? ' disabled' : '') + '>' +
           POOL[i].s + '<small>' + POOL[i].x.toFixed(2) + '</small></button>';
    }
    elP.innerHTML = h;
    elP.querySelectorAll('.bl-at').forEach(function(btn){
      btn.addEventListener('click', function(){
        if (st.done) return;
        var i = parseInt(btn.getAttribute('data-i'), 10);
        var p = st.sel.indexOf(i);
        if (p >= 0) st.sel.splice(p, 1);
        else { if (st.sel.length === 2) st.sel.shift(); st.sel.push(i); }
        render();
      });
    });
    elG.textContent = L({ es:'Comprobar', en:'Check' });
    elG.disabled = st.done;
    elG.className = 'gw-btn' + (st.done ? ' solved' : '');
    stage();
  }

  function reveal(){
    var m = MIS[st.r], i, j;
    for (i = 0; i < POOL.length && st.sel.length !== 99; i++){
      for (j = i + 1; j < POOL.length; j++){
        if (ok(m, POOL[i], POOL[j])){ st.sel = [i, j]; i = POOL.length; break; }
      }
    }
    render();
    say('warm', L({
      es:'Una pareja que sí cumple es la de la mesa. Fíjate en de qué lado de la tabla viene cada átomo antes de mirar el número.',
      en:'One pair that does work is the one on the bench. Look at which side of the table each atom comes from before looking at the number.'
    }));
    next(1600);
  }

  function next(ms){
    setTimeout(function(){
      if (!host.isConnected) return;
      st.r++; st.tries = 0; st.sel = [];
      if (st.r >= 3){ st.done = true; render(); say('good', '🎉 ' + L({ es:'Los tres encargos quedaron resueltos.', en:'The three assignments are solved.' })); return; }
      render(); say('', L({ es:'Siguiente encargo.', en:'Next assignment.' }));
    }, ms);
  }

  elG.addEventListener('click', function(){
    if (st.done) return;
    if (st.sel.length < 2){ say('warm', L({ es:'Faltan átomos en la mesa: necesitas dos.', en:'Atoms are missing on the bench: you need two.' })); return; }
    var a = POOL[st.sel[0]], b = POOL[st.sel[1]], m = MIS[st.r], dd = d(a, b);
    if (ok(m, a, b)){
      say('good', '✓ ' + L({ es:'Correcto. ', en:'Correct. ' }) + L(a) + ' + ' + L(b) + ', ΔEN ' + dd.toFixed(2) + '.');
      next(1300);
      return;
    }
    st.tries++;
    if (st.tries >= 3){ reveal(); return; }
    var msg;
    if (m === 'molecular'){
      msg = (a.k === 'me' || b.k === 'me')
        ? L({ es:'Hay un metal en la mesa y un metal suelta electrones en lugar de compartirlos. Cambia ese átomo por uno del lado derecho de la tabla.', en:'There is a metal on the bench and a metal releases electrons instead of sharing them. Swap that atom for one from the right side of the table.' })
        : L({ es:'Ya casi: revisa que ninguno de los dos venga del lado izquierdo.', en:'Almost there: check that neither of the two comes from the left side.' });
    } else if (a.k === b.k){
      msg = (a.k === 'nm')
        ? L({ es:'Los dos son no metales: ninguno le arranca los electrones al otro, los jalan entre los dos. Cambia uno por un metal.', en:'Both are nonmetals: neither pulls the electrons off the other, they tug at them together. Swap one for a metal.' })
        : L({ es:'Los dos son metales: ambos sueltan electrones y nadie los recibe. Cambia uno por un no metal.', en:'Both are metals: they both release electrons and nobody receives them. Swap one for a nonmetal.' });
    } else {
      var falta = ((m === 'fuerte' ? 2.5 : 1.7) - dd).toFixed(2);
      msg = L({ es:'ΔEN ' + dd.toFixed(2) + ': te faltan ' + falta + ' para el umbral. Separa más los dos átomos en la tabla, uno más a la izquierda o el otro más a la derecha.',
                en:'ΔEN ' + dd.toFixed(2) + ': you are ' + falta + ' short of the threshold. Move the two atoms further apart in the table, one further left or the other further right.' });
    }
    say('miss', msg);
  });

  render();
  say('', L({ es:'Elige dos átomos y observa la mesa.', en:'Choose two atoms and watch the bench.' }));
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 2 :: balanza de cargas
   Se agregan y quitan iones hasta que la carga total llega a cero. La barra
   se inclina en vivo hacia el exceso y la formula aparece sola al equilibrar.
   ══════════════════════════════════════════════════════════════════════════ */
function wCargas(rng, host){
  var CAT = [
    { s:'Na', q:1, es:'sodio',    en:'sodium' },
    { s:'K',  q:1, es:'potasio',  en:'potassium' },
    { s:'Mg', q:2, es:'magnesio', en:'magnesium' },
    { s:'Ca', q:2, es:'calcio',   en:'calcium' },
    { s:'Al', q:3, es:'aluminio', en:'aluminium' }
  ];
  var ANI = [
    { s:'Cl', q:-1, es:'cloruro',  en:'chloride' },
    { s:'Br', q:-1, es:'bromuro',  en:'bromide' },
    { s:'O',  q:-2, es:'óxido',    en:'oxide' },
    { s:'S',  q:-2, es:'sulfuro',  en:'sulfide' },
    { s:'N',  q:-3, es:'nitruro',  en:'nitride' }
  ];
  var COMBOS = shuffle([[0,2],[3,0],[4,2],[2,4],[1,3],[4,0],[3,3],[0,4]], rng).slice(0, 3);
  var st = { r:0, nc:1, na:1, tries:0, done:false };

  function cur(){ return { c: CAT[COMBOS[st.r][0]], a: ANI[COMBOS[st.r][1]] }; }
  function target(){
    var p = cur(), g = gcd2(p.c.q, p.a.q);
    return { nc: Math.abs(p.a.q) / g, na: p.c.q / g };
  }

  host.innerHTML =
    '<div class="gw-h iw-tag">' + L({ es:'Balanza de cargas', en:'Charge balance' }) + '</div>' +
    '<div class="gw-q" data-r="q"></div>' +
    '<div class="gw-mini iw-sub">' + L({
      es:'Agrega o quita iones con los botones. La barra se inclina hacia el lado que tiene carga de sobra y se centra cuando el compuesto queda neutro.',
      en:'Add or remove ions with the buttons. The bar tips toward the side with charge to spare and centres when the compound comes out neutral.'
    }) + '</div>' +
    '<div class="cg-tray" data-r="tray"></div>' +
    '<div class="cg-scale"><div class="cg-fill" data-r="fill"></div><div class="cg-mid"></div></div>' +
    '<div class="gw-read" data-r="info"></div>' +
    '<div class="cg-ctrl"><span class="cg-name" data-r="cn"></span>' +
      '<button class="gw-btn" data-r="cm">−</button><span class="cg-cnt" data-r="cc"></span><button class="gw-btn" data-r="cp">+</button></div>' +
    '<div class="cg-ctrl"><span class="cg-name" data-r="an"></span>' +
      '<button class="gw-btn" data-r="am">−</button><span class="cg-cnt" data-r="ac"></span><button class="gw-btn" data-r="ap">+</button></div>' +
    '<div class="cg-form" data-r="form"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="go"></button></div>' +
    '<div class="gw-fb" data-r="fb"></div>';

  var R = {};
  ['q','tray','fill','info','cn','cm','cc','cp','an','am','ac','ap','form','go','fb'].forEach(function(k){
    R[k] = host.querySelector('[data-r="' + k + '"]');
  });
  function say(cls, msg){ R.fb.className = 'gw-fb' + (cls ? ' ' + cls : ''); R.fb.innerHTML = msg; }

  function render(){
    var p = cur(), i, h = '';
    R.q.innerHTML = st.done
      ? L({ es:'Balanza cerrada: las tres fórmulas quedaron armadas.', en:'Balance closed: the three formulas are built.' })
      : (st.r + 1) + ' / 3 · ' + L({ es:'Arma el compuesto neutro con ', en:'Build the neutral compound from ' }) + ionLbl(p.c.s, p.c.q) + L({ es:' y ', en:' and ' }) + ionLbl(p.a.s, p.a.q) + '.';
    for (i = 0; i < st.nc; i++) h += '<div class="cg-ion pos">' + ionLbl(p.c.s, p.c.q) + '</div>';
    for (i = 0; i < st.na; i++) h += '<div class="cg-ion neg">' + ionLbl(p.a.s, p.a.q) + '</div>';
    R.tray.innerHTML = h;
    var tot = st.nc * p.c.q + st.na * p.a.q;
    var w = Math.min(Math.abs(tot) * 8, 50);
    R.fill.className = 'cg-fill ' + (tot >= 0 ? 'pos' : 'neg');
    R.fill.style.left = tot >= 0 ? '50%' : (50 - w) + '%';
    R.fill.style.width = w + '%';
    R.info.innerHTML =
      '<span class="gw-pill">' + L({ es:'carga positiva', en:'positive charge' }) + ': <b>+' + (st.nc * p.c.q) + '</b></span>' +
      '<span class="gw-pill">' + L({ es:'carga negativa', en:'negative charge' }) + ': <b>' + (st.na * p.a.q) + '</b></span>' +
      '<span class="gw-pill">' + L({ es:'total', en:'total' }) + ': <b>' + (tot > 0 ? '+' : '') + tot + '</b></span>';
    R.cn.textContent = L(p.c);
    R.an.textContent = L(p.a);
    R.cc.textContent = st.nc;
    R.ac.textContent = st.na;
    R.form.innerHTML = tot === 0 ? sub(p.c.s, st.nc) + sub(p.a.s, st.na) : '–';
    R.go.textContent = L({ es:'Comprobar', en:'Check' });
    R.go.className = 'gw-btn' + (st.done ? ' solved' : '');
    R.go.disabled = st.done;
    [R.cm, R.cp, R.am, R.ap].forEach(function(b){ b.disabled = st.done; });
    live(tot);
  }

  function live(tot){
    var t = target();
    if (tot > 0) say('warm', L({ es:'Sobra carga positiva (' + '+' + tot + '): agrega un ion negativo o quita uno positivo.', en:'Positive charge to spare (' + '+' + tot + '): add a negative ion or remove a positive one.' }));
    else if (tot < 0) say('warm', L({ es:'Sobra carga negativa (' + tot + '): agrega un ion positivo o quita uno negativo.', en:'Negative charge to spare (' + tot + '): add a positive ion or remove a negative one.' }));
    else if (st.nc !== t.nc || st.na !== t.na) say('warm', L({ es:'Está equilibrada, pero la proporción todavía se puede reducir a números más pequeños.', en:'It is balanced, but the ratio can still be reduced to smaller numbers.' }));
    else say('', L({ es:'Equilibrada y con la proporción más pequeña posible.', en:'Balanced and at the smallest possible ratio.' }));
  }

  function bump(which, dv){
    if (st.done) return;
    if (which === 'c') st.nc = Math.max(1, Math.min(6, st.nc + dv));
    else st.na = Math.max(1, Math.min(6, st.na + dv));
    render();
  }
  R.cm.addEventListener('click', function(){ bump('c', -1); });
  R.cp.addEventListener('click', function(){ bump('c', 1); });
  R.am.addEventListener('click', function(){ bump('a', -1); });
  R.ap.addEventListener('click', function(){ bump('a', 1); });

  R.go.addEventListener('click', function(){
    if (st.done) return;
    var p = cur(), t = target(), tot = st.nc * p.c.q + st.na * p.a.q;
    if (tot === 0 && st.nc === t.nc && st.na === t.na){
      say('good', '✓ ' + L({ es:'Fórmula correcta: ', en:'Correct formula: ' }) + sub(p.c.s, st.nc) + sub(p.a.s, st.na) + '.');
      setTimeout(function(){
        if (!host.isConnected) return;
        st.r++; st.nc = 1; st.na = 1; st.tries = 0;
        if (st.r >= 3){ st.done = true; render(); say('good', '🎉 ' + L({ es:'Las tres fórmulas quedaron armadas.', en:'The three formulas are built.' })); return; }
        render();
      }, 1300);
      return;
    }
    st.tries++;
    if (st.tries >= 3){
      st.nc = t.nc; st.na = t.na; render();
      say('warm', L({ es:'Así queda: ', en:'This is how it comes out: ' }) + sub(p.c.s, t.nc) + sub(p.a.s, t.na) + '. ' +
        L({ es:'La carga de cada ion dice cuántos hacen falta del otro.', en:'The charge of each ion says how many of the other one are needed.' }));
      setTimeout(function(){
        if (!host.isConnected) return;
        st.r++; st.nc = 1; st.na = 1; st.tries = 0;
        if (st.r >= 3){ st.done = true; render(); say('good', '🎉 ' + L({ es:'Se acabaron los encargos de la balanza.', en:'The balance assignments are over.' })); return; }
        render();
      }, 1900);
      return;
    }
    live(tot);
  });

  render();
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 3 :: circuito de conductividad
   Se elige la sustancia y su estado; el foco y el amperimetro responden al
   instante. Tres encargos obligan a razonar cuando hay cargas libres.
   ══════════════════════════════════════════════════════════════════════════ */
function wCircuito(rng, host){
  var SUB = [
    { id:'sal', es:'cloruro de sodio', en:'sodium chloride', ionic:true },
    { id:'azu', es:'sacarosa (azúcar)', en:'sucrose (sugar)', ionic:false }
  ];
  var EST = [
    { id:'sol', es:'sólido', en:'solid' },
    { id:'dis', es:'disuelto en agua', en:'dissolved in water' },
    { id:'fun', es:'fundido', en:'molten' }
  ];
  var ALLM = ['enciende', 'apagaIonico', 'disuelveSinLuz', 'fundeSinLuz'];
  var MIS = shuffle(ALLM, rng).slice(0, 3);
  var st = { r:0, s:0, e:0, tries:0, done:false, mA:0 };

  function conduce(){ return SUB[st.s].ionic && EST[st.e].id !== 'sol'; }
  function misText(m){
    if (m === 'enciende') return L({ es:'Haz que el foco encienda.', en:'Make the bulb light up.' });
    if (m === 'apagaIonico') return L({ es:'Deja el foco apagado usando el cloruro de sodio.', en:'Leave the bulb off using sodium chloride.' });
    if (m === 'disuelveSinLuz') return L({ es:'Muestra una sustancia disuelta en agua que deje el foco apagado.', en:'Show a substance dissolved in water that leaves the bulb off.' });
    return L({ es:'Muestra una sustancia fundida que deje el foco apagado.', en:'Show a molten substance that leaves the bulb off.' });
  }
  function misOk(m){
    var s = SUB[st.s], e = EST[st.e];
    if (m === 'enciende') return conduce();
    if (m === 'apagaIonico') return s.ionic && !conduce();
    if (m === 'disuelveSinLuz') return e.id === 'dis' && !conduce();
    return e.id === 'fun' && !conduce();
  }

  host.innerHTML =
    '<div class="gw-h iw-tag">' + L({ es:'Circuito de prueba', en:'Test circuit' }) + '</div>' +
    '<div class="gw-q" data-r="q"></div>' +
    '<div class="gw-mini iw-sub">' + L({
      es:'Cambia la sustancia y su estado: el vaso, el foco y el medidor responden al momento.',
      en:'Change the substance and its state: the beaker, the bulb and the meter respond right away.'
    }) + '</div>' +
    '<div class="gw-lbl">' + L({ es:'Sustancia', en:'Substance' }) + '</div>' +
    '<div class="gw-row" data-r="rs"></div>' +
    '<div class="gw-lbl">' + L({ es:'Estado', en:'State' }) + '</div>' +
    '<div class="gw-row" data-r="re"></div>' +
    '<div class="ck">' +
      '<div class="ck-bulb" data-r="bulb">💡</div>' +
      '<div class="ck-beaker" data-r="bk"></div>' +
      '<div class="ck-meter" data-r="mt"></div>' +
    '</div>' +
    '<div class="gw-read" data-r="info"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="go"></button></div>' +
    '<div class="gw-fb" data-r="fb"></div>';

  var R = {};
  ['q','rs','re','bulb','bk','mt','info','go','fb'].forEach(function(k){ R[k] = host.querySelector('[data-r="' + k + '"]'); });
  function say(cls, msg){ R.fb.className = 'gw-fb' + (cls ? ' ' + cls : ''); R.fb.innerHTML = msg; }

  function render(){
    R.q.textContent = st.done
      ? L({ es:'Circuito cerrado: los tres encargos están resueltos.', en:'Circuit closed: the three assignments are solved.' })
      : (st.r + 1) + ' / 3 · ' + misText(MIS[st.r]);
    R.rs.innerHTML = SUB.map(function(s, i){ return '<button class="gw-btn' + (i === st.s ? ' on' : '') + '" data-s="' + i + '">' + L(s) + '</button>'; }).join('');
    R.re.innerHTML = EST.map(function(e, i){ return '<button class="gw-btn' + (i === st.e ? ' on' : '') + '" data-e="' + i + '">' + L(e) + '</button>'; }).join('');
    R.rs.querySelectorAll('[data-s]').forEach(function(b){
      b.disabled = st.done;
      b.addEventListener('click', function(){ if (st.done) return; st.s = parseInt(b.getAttribute('data-s'), 10); render(); });
    });
    R.re.querySelectorAll('[data-e]').forEach(function(b){
      b.disabled = st.done;
      b.addEventListener('click', function(){ if (st.done) return; st.e = parseInt(b.getAttribute('data-e'), 10); render(); });
    });
    var s = SUB[st.s], e = EST[st.e], on = conduce();
    var h = '', i;
    if (s.ionic && e.id === 'sol'){
      for (i = 0; i < 8; i++) h += '<div class="ck-p fixed ' + (i % 2 ? 'neg' : 'pos') + '"></div>';
    } else if (s.ionic){
      for (i = 0; i < 8; i++) h += '<div class="ck-p ' + (i % 2 ? 'neg' : 'pos') + '"></div>';
    } else {
      for (i = 0; i < 8; i++) h += '<div class="ck-p mol' + (e.id === 'sol' ? ' fixed' : '') + '"></div>';
    }
    R.bk.innerHTML = h;
    R.bulb.className = 'ck-bulb' + (on ? ' on' : '');
    R.mt.innerHTML = (on ? (11 + Math.round(st.mA * 10) / 10).toFixed(1) : '0.0') + ' mA';
    R.info.innerHTML =
      '<span class="gw-pill">' + L({ es:'partículas', en:'particles' }) + ': ' + (s.ionic
        ? L({ es:'iones + y −', en:'ions + and −' })
        : L({ es:'moléculas neutras', en:'neutral molecules' })) + '</span>' +
      '<span class="gw-pill">' + L({ es:'se mueven', en:'they move' }) + ': ' + (e.id === 'sol'
        ? L({ es:'no, están fijas', en:'no, they are fixed' })
        : L({ es:'sí, con libertad', en:'yes, freely' })) + '</span>' +
      '<span class="gw-pill">' + L({ es:'foco', en:'bulb' }) + ': ' + (on
        ? L({ es:'encendido', en:'lit' })
        : L({ es:'apagado', en:'off' })) + '</span>';
    R.go.textContent = L({ es:'Comprobar', en:'Check' });
    R.go.className = 'gw-btn' + (st.done ? ' solved' : '');
    R.go.disabled = st.done;
  }

  function resetState(){
    var combos = [[0,0],[1,1],[0,2],[1,0],[0,1],[1,2]], i;
    for (i = 0; i < combos.length; i++){
      st.s = combos[i][0]; st.e = combos[i][1];
      if (!misOk(MIS[st.r])) return;
    }
  }

  function advance(ms){
    setTimeout(function(){
      if (!host.isConnected) return;
      st.r++; st.tries = 0;
      if (st.r < 3) resetState();
      if (st.r >= 3){ st.done = true; render(); say('good', '🎉 ' + L({ es:'Los tres encargos del circuito están resueltos.', en:'The three circuit assignments are solved.' })); return; }
      render(); say('', L({ es:'Siguiente encargo.', en:'Next assignment.' }));
    }, ms);
  }

  R.go.addEventListener('click', function(){
    if (st.done) return;
    var m = MIS[st.r], s = SUB[st.s], e = EST[st.e];
    if (misOk(m)){
      say('good', '✓ ' + L({ es:'Así es: ', en:'That is it: ' }) + L(s) + ', ' + L(e) + '.');
      advance(1300);
      return;
    }
    st.tries++;
    if (st.tries >= 3){
      if (m === 'enciende'){ st.s = 0; st.e = 1; }
      else if (m === 'apagaIonico'){ st.s = 0; st.e = 0; }
      else if (m === 'disuelveSinLuz'){ st.s = 1; st.e = 1; }
      else { st.s = 1; st.e = 2; }
      render();
      say('warm', L({ es:'Esta combinación sí cumple. La corriente pasa solo cuando hay cargas sueltas que puedan moverse.', en:'This combination does work. Current only passes when there are loose charges free to move.' }));
      advance(1900);
      return;
    }
    var msg;
    if (m === 'enciende'){
      msg = s.ionic
        ? L({ es:'La sustancia tiene iones, pero en el sólido están atrapados en la red. Cámbiale el estado.', en:'The substance has ions, but in the solid they are trapped in the lattice. Change its state.' })
        : L({ es:'Esa sustancia solo tiene moléculas neutras, así que ningún estado le dará carga. Prueba con la otra.', en:'That substance has only neutral molecules, so no state will give it charge. Try the other one.' });
    } else if (m === 'apagaIonico'){
      msg = !s.ionic
        ? L({ es:'El encargo pide el cloruro de sodio. Cámbialo y luego busca el estado que deje quietos a sus iones.', en:'The assignment asks for sodium chloride. Switch to it and then find the state that keeps its ions still.' })
        : L({ es:'Con los iones sueltos el foco enciende. Busca el estado en el que quedan sujetos en su lugar.', en:'With loose ions the bulb lights. Look for the state where they stay locked in place.' });
    } else if (m === 'disuelveSinLuz'){
      msg = L({ es:'Está disuelto, pero eso solo apaga el foco si lo que se dispersa en el agua no lleva carga.', en:'It is dissolved, but that only leaves the bulb off if what spreads in the water carries no charge.' });
    } else {
      msg = L({ es:'Fundido sí está. Falta que las partículas que quedan libres sean neutras.', en:'Molten it is. What is missing is that the freed particles be neutral.' });
    }
    say('miss', msg);
  });

  st.mA = Math.round(rng() * 60) / 10;
  resetState();
  render();
  say('', L({ es:'Prueba combinaciones y observa el foco.', en:'Try combinations and watch the bulb.' }));
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 4 :: mesa de pruebas con muestra desconocida
   Tres muestras selladas. El estudiante corre las pruebas que quiera, ve los
   datos aparecer y decide de que tipo es cada una.
   ══════════════════════════════════════════════════════════════════════════ */
function wPruebas(rng, host){
  var types = shuffle(['io', 'mol', (rng() < 0.5 ? 'io' : 'mol')], rng);
  var data = types.map(function(t){
    return t === 'io'
      ? { t:t, mp: nInt(rng, 700, 1450), mA: (8 + Math.round(rng() * 90) / 10).toFixed(1) }
      : { t:t, mp: nInt(rng, 38, 190), mA: '0.0' };
  });
  var st = { r:0, ran:[], tries:0, done:false };

  var TESTS = [
    { id:'calor', es:'Calentar', en:'Heat it' },
    { id:'golpe', es:'Golpear', en:'Strike it' },
    { id:'agua',  es:'Disolver y medir', en:'Dissolve and measure' }
  ];

  function line(id){
    var d = data[st.r];
    if (id === 'calor') return L({ es:'Funde hasta los ' + d.mp + ' °C.', en:'It melts only at ' + d.mp + ' °C.' });
    if (id === 'golpe') return d.t === 'io'
      ? L({ es:'Se parte de golpe en trozos con caras planas.', en:'It splits at once into pieces with flat faces.' })
      : L({ es:'Se aplasta y se deshace en polvo blando.', en:'It flattens and crumbles into soft powder.' });
    return L({ es:'Se disuelve en agua y la disolución marca ' + d.mA + ' mA.', en:'It dissolves in water and the solution reads ' + d.mA + ' mA.' });
  }

  host.innerHTML =
    '<div class="gw-h iw-tag">' + L({ es:'Muestra sellada', en:'Sealed sample' }) + '</div>' +
    '<div class="gw-q" data-r="q"></div>' +
    '<div class="gw-mini iw-sub">' + L({
      es:'Corre las pruebas que necesites, en el orden que quieras, y con los datos en la mesa decide de qué tipo es la muestra.',
      en:'Run the tests you need, in any order you like, and with the data on the bench decide which type the sample is.'
    }) + '</div>' +
    '<div class="gw-row" data-r="tests"></div>' +
    '<div class="tb-res" data-r="res"></div>' +
    '<div class="gw-lbl">' + L({ es:'Tu veredicto', en:'Your verdict' }) + '</div>' +
    '<div class="gw-row">' +
      '<button class="gw-btn" data-v="io"></button>' +
      '<button class="gw-btn" data-v="mol"></button>' +
    '</div>' +
    '<div class="gw-fb" data-r="fb"></div>';

  var R = {};
  ['q','tests','res','fb'].forEach(function(k){ R[k] = host.querySelector('[data-r="' + k + '"]'); });
  function say(cls, msg){ R.fb.className = 'gw-fb' + (cls ? ' ' + cls : ''); R.fb.innerHTML = msg; }

  function render(){
    R.q.textContent = st.done
      ? L({ es:'Mesa cerrada: las tres muestras quedaron identificadas.', en:'Bench closed: the three samples are identified.' })
      : L({ es:'Muestra ', en:'Sample ' }) + (st.r + 1) + ' / 3';
    R.tests.innerHTML = TESTS.map(function(t){
      return '<button class="gw-btn' + (st.ran.indexOf(t.id) >= 0 ? ' on' : '') + '" data-t="' + t.id + '">' + L(t) + '</button>';
    }).join('');
    R.tests.querySelectorAll('[data-t]').forEach(function(b){
      b.disabled = st.done;
      b.addEventListener('click', function(){
        if (st.done) return;
        var id = b.getAttribute('data-t');
        var p = st.ran.indexOf(id);
        if (p >= 0) st.ran.splice(p, 1); else st.ran.push(id);
        render();
      });
    });
    R.res.innerHTML = st.ran.length
      ? st.ran.map(function(id){
          var t = TESTS.filter(function(x){ return x.id === id; })[0];
          return '<div class="tb-line"><span class="tb-tag">' + L(t) + '</span>' + line(id) + '</div>';
        }).join('')
      : '<div class="tb-line">' + L({ es:'Todavía no hay datos en la mesa.', en:'There is no data on the bench yet.' }) + '</div>';
    host.querySelectorAll('[data-v]').forEach(function(b){
      b.disabled = st.done;
      b.className = 'gw-btn' + (st.done ? ' solved' : '');
      b.textContent = b.getAttribute('data-v') === 'io'
        ? L({ es:'Es iónica', en:'It is ionic' })
        : L({ es:'Es molecular', en:'It is molecular' });
    });
  }

  function advance(ms){
    setTimeout(function(){
      if (!host.isConnected) return;
      st.r++; st.ran = []; st.tries = 0;
      if (st.r >= 3){ st.done = true; render(); say('good', '🎉 ' + L({ es:'Las tres muestras quedaron identificadas.', en:'The three samples are identified.' })); return; }
      render(); say('', L({ es:'Muestra nueva sobre la mesa.', en:'A new sample on the bench.' }));
    }, ms);
  }

  host.querySelectorAll('[data-v]').forEach(function(b){
    b.addEventListener('click', function(){
      if (st.done) return;
      var v = b.getAttribute('data-v'), d = data[st.r];
      if (v === d.t){
        say('good', '✓ ' + (d.t === 'io'
          ? L({ es:'Iónica: funde a ' + d.mp + ' °C y su disolución conduce ' + d.mA + ' mA.', en:'Ionic: it melts at ' + d.mp + ' °C and its solution carries ' + d.mA + ' mA.' })
          : L({ es:'Molecular: funde a ' + d.mp + ' °C y su disolución marca ' + d.mA + ' mA.', en:'Molecular: it melts at ' + d.mp + ' °C and its solution reads ' + d.mA + ' mA.' })));
        advance(1500);
        return;
      }
      st.tries++;
      if (st.tries >= 3){
        st.ran = ['calor', 'golpe', 'agua']; render();
        say('warm', (d.t === 'io'
          ? L({ es:'Era iónica. Con los tres datos juntos el patrón se ve completo.', en:'It was ionic. With the three results together the pattern shows up whole.' })
          : L({ es:'Era molecular. Con los tres datos juntos el patrón se ve completo.', en:'It was molecular. With the three results together the pattern shows up whole.' })));
        advance(2100);
        return;
      }
      var falta = TESTS.filter(function(t){ return st.ran.indexOf(t.id) < 0; });
      say('miss', falta.length
        ? L({ es:'Todavía no. Te queda una prueba sin correr: ', en:'Not yet. You still have a test to run: ' }) + L(falta[0]) + '.'
        : L({ es:'Todavía no. Vuelve a leer la temperatura de fusión y el amperaje juntos, no por separado.', en:'Not yet. Read the melting temperature and the current together, not separately.' }));
    });
  });

  render();
  say('', L({ es:'Empieza por la prueba que prefieras.', en:'Start with whichever test you prefer.' }));
}

function mkP2(rng){
  var p = vpick(rng, P2PAIRS);

  var nc = p.aq / g, na = p.cq / g;
  var good = sub(p.c, nc) + sub(p.a, na);
  var swap = sub(p.c, na) + sub(p.a, nc);
  var uno  = p.c + p.a;
  var dob  = sub(p.c, nc * 2) + sub(p.a, na * 2);

  var q = v === 0
    ? { es:'El ' + L(p.ces) + ' forma iones ' + ionLbl(p.c, p.cq) + ' y el ' + L(p.aes) + ' forma iones ' + ionLbl(p.a, -p.aq) + '. ¿Cuál es la fórmula del compuesto que resulta al unirlos?',

        en:'Ions ' + ionLbl(p.c, p.cq) + ' are mixed with ions ' + ionLbl(p.a, -p.aq) + '. Which of these formulas represents the electrically neutral compound at the smallest possible ratio?' };
  return {
    title:{ es:'La fórmula que sale de las cargas', en:'The formula that comes out of the charges' },

          en:'You need ' + nc + ' ' + p.c + ' ion(s) of charge ' + p.cq + '+ to give ' + (nc * p.cq) + ' positive charges and ' + na + ' ' + p.a + ' ion(s) of charge ' + p.aq + '- to give ' + (na * p.aq) + ' negative ones. The formula is ' + good + ', which states the ratio of the lattice and not a loose molecule.' },
