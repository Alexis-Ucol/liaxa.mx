  /* ══════════════ building blocks ══════════════ */
  function section(tag, title, paras, callout) {
    var d = document.createElement('div');
    d.className = 'section';
    d.innerHTML = '<div class="stag">' + tag + '</div><h2>' + title + '</h2>' +
      paras.map(function(p){ return '<p>' + p + '</p>'; }).join('') +
      (callout ? '<div class="callout"><p>' + callout + '</p></div>' : '');
    body.appendChild(d);
  }

  function shuffleOpts(opts, correct) {
    var idx = opts.map(function(_, i){ return i; });
    for (var i = idx.length - 1; i > 0; i--) {
      var j = Math.floor(rng() * (i + 1));
      var tmp = idx[i]; idx[i] = idx[j]; idx[j] = tmp;
    }
    return { opts: idx.map(function(k){ return opts[k]; }), idx: idx.indexOf(correct) };
  }

  function addProblem(q) {
    var raw = q.options[LANG] || q.options.es;
    var sh = shuffleOpts(raw, q.correct);
    problems.push({
      title: Lg(q.title), questionText: Lg(q.stmt), fn: '',
      options: sh.opts, correctIdx: sh.idx,
      hint: Lg(q.hint), explanation: Lg(q.expl),
      showWork: !!q.showWork,
      studentChoice: null, pendingChoice: null
    });
    buildOneCard(problems[problems.length - 1], problems.length - 1);
  }

  /* ══════════════ THE ARTICLE (working material) ══════════════ */
  function excerpt() {
    var d = document.createElement('div');
    d.className = 'section';
    d.innerHTML = '<div class="exc">' +
      '<div class="exc-kick">' + Lg(C.kick) + '</div>' +
      '<div class="exc-head">' + C.head + '</div>' +
      '<div class="exc-by">' + Lg(C.by) + '</div>' +
      C.paras.map(function(p, i){ return '<div class="exc-p"><span class="exc-n">' + (i + 1) + '</span>' + p + '</div>'; }).join('') +
      '<div class="exc-foot">' + L('El texto se conserva en español porque es el material que vas a analizar.',
                                   'The text is kept in Spanish because it is the material you are going to analyse.') + '</div>' +
      '</div>';
    body.appendChild(d);
  }

  /* ══════════════ W1 — fact / opinion sorter (Mode C) ══════════════ */
  function buildFactOpinion() {
    var BINS = [ L('Hecho comprobable', 'Verifiable fact'), L('Opinión de quien escribe', 'Writer opinion') ];
    var IT = C.hechos;
    var st = { seq: perm(IT.length), i: 0, tries: 0, hits: 0, done: false, lastWhy: '' };
    var w = document.createElement('div');
    w.className = 'gw section'; w.id = 'wFact';
    w.setAttribute('data-widget', 'classify');
    body.appendChild(w);
    function render() {
      if (st.done) {
        w.innerHTML = '<div class="iw-tag">' + L('Separa la mesa de redacción', 'Sort the newsroom desk') + '</div>' +
          '<div class="cls-done">✓ ' + L('Mesa clasificada', 'Desk sorted') + ' ' + st.hits + ' / ' + IT.length + '</div>' +
          '<div class="rfb">' + (st.lastWhy ? st.lastWhy + ' ' : '') + L('Un texto de opinión mezcla las dos columnas a propósito: los hechos sostienen y la valoración persuade.',
                                  'An opinion text mixes both columns on purpose: the facts support and the appraisal persuades.') + '</div>';
        return;
      }
      var it = IT[st.seq[st.i]];
      w.innerHTML = '<div class="iw-tag">' + L('Separa la mesa de redacción', 'Sort the newsroom desk') + '</div>' +
        '<div class="gw-mini">' + L('Decide si el enunciado podría comprobarse con un registro o si depende de quien escribe.',
                                    'Decide whether the statement could be checked against a record or depends on the writer.') + '</div>' +
        '<div class="gw-prog">' + (st.i + 1) + ' / ' + IT.length + '</div>' +
        '<div class="cls-card">' + Lg(it.frag) + '</div>' +
        '<div class="cls-bins">' + BINS.map(function(b, bi){ return '<button class="cls-bin" onclick="wFactPick(' + bi + ')">' + b + '</button>'; }).join('') + '</div>' +
        '<div class="rfb" id="wFactFb"></div>';
    }
    window.wFactPick = function(bi) {
      if (st.done) return;
      var it = IT[st.seq[st.i]];
      var fb = document.getElementById('wFactFb');
      if (bi === it.bin) {
        st.hits++; st.tries = 0; st.i++; st.lastWhy = Lg(it.why);
        if (st.i >= IT.length) st.done = true;
        render();
        if (!st.done) document.getElementById('wFactFb').innerHTML =
          '<span class="rok">✓ ' + L('Correcto.', 'Correct.') + '</span> ' + Lg(it.why);
        return;
      }
      st.tries++;
      if (st.tries >= 3) {
        fb.innerHTML = '<b>' + BINS[it.bin] + '.</b> ' + Lg(it.why);
        st.tries = 0; st.i++;
        if (st.i >= IT.length) st.done = true;
        setTimeout(render, 1600);
        return;
      }
      fb.innerHTML = (it.bin === 0)
        ? L('Todavía no. Busca en el enunciado una cifra, una fecha o un lugar: si los hay, alguien puede ir a revisarlos.',
            'Not yet. Look in the statement for a figure, a date or a place: if they are there, someone can go and check them.')
        : L('Todavía no. Fíjate si el enunciado califica, jerarquiza o desea algo: eso lo pone quien escribe, no un documento.',
            'Not yet. Notice whether the statement rates, ranks or wishes for something: the writer puts that there, not a document.');
    };
    render();
  }

  /* ══════════════ W2 — order the moves of the argument (Mode C) ══════════════ */
  function buildOrder() {
    var MOV = C.moves;
    var st = { order: permMoved(MOV.length), sel: null, tries: 0, done: false };
    var w = document.createElement('div');
    w.className = 'gw section'; w.id = 'wOrder';
    w.setAttribute('data-widget', 'timeline');
    body.appendChild(w);
    function render() {
      var chips = st.order.map(function(ei, pos) {
        var cls = 'tl-chip' + (st.sel === pos ? ' sel' : '') + (st.done ? ' locked' : '');
        return '<div class="' + cls + '" onclick="wOrderTap(' + pos + ')"><span class="tl-num">' + (pos + 1) + '</span>' + Lg(MOV[ei]) + '</div>';
      }).join('');
      w.innerHTML = '<div class="iw-tag">' + L('Arma el esqueleto del texto', 'Assemble the skeleton of the text') + '</div>' +
        '<div class="gw-mini">' + L('Coloca los movimientos en el orden en que aparecen en el artículo. Toca dos para intercambiarlos.',
                                    'Put the moves in the order they appear in the article. Tap two to swap them.') + '</div>' +
        '<div class="tl-list">' + chips + '</div>' +
        (st.done ? '' : '<button class="rverify-btn" onclick="wOrderCheck()">' + L('Comprobar', 'Check') + '</button>') +
        '<div class="rfb" id="wOrderFb"></div>';
    }
    window.wOrderTap = function(pos) {
      if (st.done) return;
      if (st.sel === null) st.sel = pos;
      else if (st.sel === pos) st.sel = null;
      else { var t = st.order[st.sel]; st.order[st.sel] = st.order[pos]; st.order[pos] = t; st.sel = null; }
      render();
    };
    window.wOrderCheck = function() {
      var ok = st.order.every(function(ei, pos){ return ei === pos; });
      if (ok) {
        st.done = true; render();
        document.getElementById('wOrderFb').innerHTML = '<span class="rok">✓ ' + L('Ese es el orden.', 'That is the order.') + '</span> ' +
          L('La postura abre, las razones la sostienen una tras otra, la objeción se contesta y el cierre vuelve al punto de partida.',
            'The stance opens, the reasons hold it one after another, the objection is answered and the closing returns to the starting point.');
        return;
      }
      st.tries++;
      if (st.tries >= 3) {
        st.order = MOV.map(function(_, i){ return i; }); st.done = true; render();
        document.getElementById('wOrderFb').innerHTML =
          L('Este es el orden del artículo. Observa que la postura va primero: todo lo demás existe para sostenerla.',
            'This is the order of the article. Notice the stance comes first: everything else exists to hold it up.');
        return;
      }
      var bad = 0;
      for (var k = 0; k < st.order.length; k++) { if (st.order[k] !== k) { bad = k; break; } }
      document.getElementById('wOrderFb').textContent =
        L('Aún no. Revisa la posición ' + (bad + 1) + ': ¿ese movimiento va antes o después de lo que tiene encima?',
          'Not yet. Check position ' + (bad + 1) + ': does that move come before or after what sits above it?');
    };
    render();
  }

  /* ══════════════ W3 — match each fragment with its device (Mode C) ══════════════ */
  function buildDeviceMatch() {
    var R = C.recursos;
    var st = { left: permMoved(R.length), right: permMoved(R.length), sel: null, done: {}, tries: 0, over: false };
    var w = document.createElement('div');
    w.className = 'gw section'; w.id = 'wMatch';
    w.setAttribute('data-widget', 'match');
    body.appendChild(w);
    function solved(i){ return st.done[i] === true; }
    function render() {
      var left = st.left.map(function(li, pos) {
        var cls = 'mt-chip' + (solved(li) ? ' done' : '') + (st.sel === li ? ' sel' : '');
        return '<div class="' + cls + '" onclick="wMatchLeft(' + li + ')">' + R[li].frag + '</div>';
      }).join('');
      var right = st.right.map(function(ri, pos) {
        var cls = 'mt-chip' + (solved(ri) ? ' done' : '');
        return '<div class="' + cls + '" onclick="wMatchRight(' + ri + ')">' + Lg(R[ri].rec) + '</div>';
      }).join('');
      w.innerHTML = '<div class="iw-tag">' + L('Nombra el recurso', 'Name the device') + '</div>' +
        '<div class="gw-mini">' + L('Toca un fragmento del artículo y después el recurso que emplea.',
                                    'Tap a fragment of the article and then the device it uses.') + '</div>' +
        '<div class="mt-grid"><div><div class="mt-col-t">' + L('Fragmento', 'Fragment') + '</div>' + left + '</div>' +
        '<div><div class="mt-col-t">' + L('Recurso', 'Device') + '</div>' + right + '</div></div>' +
        '<div class="rfb" id="wMatchFb"></div>';
    }
    window.wMatchLeft = function(li) {
      if (st.over || solved(li)) return;
      st.sel = (st.sel === li) ? null : li;
      render();
    };
    window.wMatchRight = function(ri) {
      if (st.over || solved(ri)) return;
      var fb = document.getElementById('wMatchFb');
      if (st.sel === null) {
        fb.textContent = L('Elige primero un fragmento de la columna izquierda.', 'Choose a fragment from the left column first.');
        return;
      }
      if (st.sel === ri) {
        st.done[ri] = true; st.tries = 0; st.sel = null;
        var all = R.every(function(_, k){ return solved(k); });
        if (all) st.over = true;
        render();
        document.getElementById('wMatchFb').innerHTML = '<span class="rok">✓ ' + L('Enlazado.', 'Linked.') + '</span> ' + Lg(R[ri].why) +
          (all ? ' ' + L('Los cuatro recursos hacen lo mismo desde distintos ángulos: vuelven creíble una postura.',
                         'The four devices do the same thing from different angles: they make a stance believable.') : '');
        return;
      }
      st.tries++;
      if (st.tries >= 3) {
        R.forEach(function(_, k){ st.done[k] = true; });
        st.over = true; st.sel = null; render();
        document.getElementById('wMatchFb').innerHTML = L('Estos son los enlaces correctos. ', 'These are the correct links. ') +
          R.map(function(r){ return '<b>' + Lg(r.rec) + '</b>: ' + Lg(r.why); }).join(' ');
        return;
      }
      st.sel = null; render();
      document.getElementById('wMatchFb').textContent =
        L('Todavía no. Vuelve a leer el fragmento y pregúntate si trae una cifra, unas palabras citadas, una semejanza o una pregunta sin respuesta.',
          'Not yet. Read the fragment again and ask yourself whether it brings a figure, quoted words, a resemblance or an unanswered question.');
    };
    render();
  }

  /* ══════════════ W4 — mark the connectors (Mode B: silent until Comprobar) ══════════════ */
  function buildMarkConnectors() {
    var TOK = C.marca;
    var st = { on: {}, tries: 0, done: false };
    var w = document.createElement('div');
    w.className = 'gw section'; w.id = 'wMark';
    w.setAttribute('data-widget', 'mark');
    body.appendChild(w);
    function render() {
      var sent = TOK.map(function(tk, i) {
        var cls = 'mk-w' + (st.done && tk.hit ? ' hit' : (st.on[i] ? ' on' : ''));
        return '<span class="' + cls + '" onclick="wMarkTap(' + i + ')">' + tk.t + '</span>';
      }).join(' ');
      w.innerHTML = '<div class="iw-tag">' + L('Subraya lo que encadena', 'Underline what links') + '</div>' +
        '<div class="gw-mini">' + L('Toca las palabras que no aportan información nueva y solo enlazan una idea con la siguiente. Puedes quitarlas volviendo a tocarlas.',
                                    'Tap the words that add no new information and only link one idea to the next. You can remove them by tapping again.') + '</div>' +
        '<div class="gw-prog">' + Lg(C.marcaTitle) + '</div>' +
        '<div class="mk-sent">' + sent + '</div>' +
        (st.done ? '' : '<button class="rverify-btn" onclick="wMarkCheck()">' + L('Comprobar', 'Check') + '</button>') +
        '<div class="rfb" id="wMarkFb"></div>';
    }
    window.wMarkTap = function(i) {
      if (st.done) return;
      st.on[i] = !st.on[i];
      render();
    };
    window.wMarkCheck = function() {
      var good = 0, bad = 0, total = 0;
      TOK.forEach(function(tk, i) {
        if (tk.hit) total++;
        if (st.on[i] && tk.hit) good++;
        if (st.on[i] && !tk.hit) bad++;
      });
      if (good === total && bad === 0) {
        st.done = true; render();
        document.getElementById('wMarkFb').innerHTML = '<span class="rok">✓ ' + L('Los cuatro.', 'All four.') + '</span> ' +
          L('En primer lugar abre la lista de razones, Además suma otra, sin embargo opone la objeción y Por lo tanto anuncia la conclusión. Ninguno cuenta nada nuevo: ordenan.',
            'En primer lugar opens the list of reasons, Además adds another, sin embargo sets the objection against them and Por lo tanto announces the conclusion. None of them tells anything new: they organise.');
        return;
      }
      st.tries++;
      if (st.tries >= 3) {
        st.done = true; render();
        document.getElementById('wMarkFb').innerHTML =
          L('Estos son los cuatro enlaces del párrafo. Quítalos mentalmente y verás que las ideas siguen ahí, pero ya no se sabe cuál apoya a cuál.',
            'These are the four links in the paragraph. Take them away mentally and you will see the ideas are still there, but you no longer know which supports which.');
        return;
      }
      var msg;
      if (bad > 0 && good < total) msg = L('Todavía no. Alguna de tus marcas nombra cosas o acciones en lugar de enlazarlas, y aún falta encontrar otro enlace.',
                                           'Not yet. One of your marks names things or actions instead of linking them, and there is still another link to find.');
      else if (bad > 0) msg = L('Casi. Sobra una marca: prueba a quitarla y comprueba si el párrafo pierde algún enlace entre ideas.',
                                'Almost. One mark is extra: try removing it and check whether the paragraph loses any link between ideas.');
      else msg = L('Vas bien, pero falta al menos uno. Busca también al principio del párrafo y antes de la conclusión.',
                   'You are on track, but at least one is missing. Look at the start of the paragraph and before the conclusion too.');
      document.getElementById('wMarkFb').textContent = msg;
    };
    render();
  }

  /* ══════════════ W5 — choose the source that verifies the claim (Mode C, 3 rounds) ══════════════ */
  function buildSources() {
    var RD = C.fuentes;
    var st = { r: 0, tries: 0, done: false, lastWhy: '', ord: RD.map(function(rd){ return perm(4); }) };
    var w = document.createElement('div');
    w.className = 'gw section'; w.id = 'wSrc';
    w.setAttribute('data-widget', 'sources');
    body.appendChild(w);
    function render() {
      if (st.done) {
        w.innerHTML = '<div class="iw-tag">' + L('Busca la fuente', 'Find the source') + '</div>' +
          '<div class="cls-done">✓ ' + L('Investigación lista', 'Research ready') + '</div>' +
          '<div class="rfb">' + (st.lastWhy ? st.lastWhy + ' ' : '') + L('Cada afirmación pide su propia fuente: las cifras van a los registros, lo vivido va a las voces y lo que ya cambió va a las imágenes.',
                                  'Every claim asks for its own source: figures go to records, lived experience goes to voices and what has already changed goes to images.') + '</div>';
        return;
      }
      var rd = RD[st.r], ord = st.ord[st.r];
      var raw = rd.opts[LANG] || rd.opts.es;
      var btns = ord.map(function(oi) {
        return '<button class="src-opt" onclick="wSrcPick(' + oi + ')">' + raw[oi] + '</button>';
      }).join('');
      w.innerHTML = '<div class="iw-tag">' + L('Busca la fuente', 'Find the source') + '</div>' +
        '<div class="gw-mini">' + L('Antes de escribir hay que comprobar. Elige la fuente que resuelve cada encargo.',
                                    'Before writing you have to verify. Choose the source that settles each assignment.') + '</div>' +
        '<div class="gw-prog">' + (st.r + 1) + ' / ' + RD.length + '</div>' +
        '<div class="src-claim">' + Lg(rd.claim) + '</div>' +
        '<div class="src-opts">' + btns + '</div>' +
        '<div class="rfb" id="wSrcFb"></div>';
    }
    function advance() {
      st.tries = 0; st.r++;
      if (st.r >= RD.length) st.done = true;
      render();
    }
    window.wSrcPick = function(oi) {
      if (st.done) return;
      var rd = RD[st.r];
      var fb = document.getElementById('wSrcFb');
      if (oi === rd.ok) {
        var why = Lg(rd.why);
        st.lastWhy = why;
        advance();
        var nf = document.getElementById('wSrcFb');
        if (nf) nf.innerHTML = '<span class="rok">✓ ' + L('Buena elección.', 'Good choice.') + '</span> ' + why;
        return;
      }
      st.tries++;
      if (st.tries >= 3) {
        var raw = rd.opts[LANG] || rd.opts.es;
        fb.innerHTML = '<b>' + raw[rd.ok] + '.</b> ' + Lg(rd.why);
        setTimeout(advance, 1800);
        return;
      }
      fb.textContent = L('Todavía no. Pregúntate quién anotó ese dato o quién lo vivió: la fuente correcta es la que estuvo más cerca del suceso.',
                         'Not yet. Ask yourself who wrote that down or who lived it: the right source is the one that was closest to the event.');
    };
    render();
  }

  /* ══════════════ W6 — sort the three genres (Mode C) ══════════════ */
  function buildGenreSort() {
    var BINS = ES ? ['Nota informativa', 'Artículo de opinión', 'Editorial'] : ['News report', 'Opinion article', 'Editorial'];
    var IT = GENEROS;
    var st = { seq: perm(IT.length), i: 0, tries: 0, hits: 0, done: false, lastWhy: '' };
    var w = document.createElement('div');
    w.className = 'gw section'; w.id = 'wGen';
    w.setAttribute('data-widget', 'classify');
    body.appendChild(w);
    function render() {
      if (st.done) {
        w.innerHTML = '<div class="iw-tag">' + L('Reparte la plana', 'Lay out the page') + '</div>' +
          '<div class="cls-done">✓ ' + L('Plana repartida', 'Page laid out') + ' ' + st.hits + ' / ' + IT.length + '</div>' +
          '<div class="rfb">' + (st.lastWhy ? st.lastWhy + ' ' : '') + L('Dos preguntas bastan para ubicar cualquiera de los tres: ¿toma postura?, y si la toma, ¿quién la firma?',
                                  'Two questions are enough to place any of the three: does it take a stance, and if it does, who signs it?') + '</div>';
        return;
      }
      var it = IT[st.seq[st.i]];
      w.innerHTML = '<div class="iw-tag">' + L('Reparte la plana', 'Lay out the page') + '</div>' +
        '<div class="gw-mini">' + L('Cada tarjeta describe un texto del periódico escolar. Envíala a su sección.',
                                    'Each card describes a text from the school newspaper. Send it to its section.') + '</div>' +
        '<div class="gw-prog">' + (st.i + 1) + ' / ' + IT.length + '</div>' +
        '<div class="cls-card">' + Lg(it) + '</div>' +
        '<div class="cls-bins">' + BINS.map(function(b, bi){ return '<button class="cls-bin" onclick="wGenPick(' + bi + ')">' + b + '</button>'; }).join('') + '</div>' +
        '<div class="rfb" id="wGenFb"></div>';
    }
    window.wGenPick = function(bi) {
      if (st.done) return;
      var it = IT[st.seq[st.i]];
      var fb = document.getElementById('wGenFb');
      if (bi === it.bin) {
        st.hits++; st.tries = 0; st.i++; st.lastWhy = Lg(it.why);
        if (st.i >= IT.length) st.done = true;
        render();
        if (!st.done) document.getElementById('wGenFb').innerHTML =
          '<span class="rok">✓ ' + L('Correcto.', 'Correct.') + '</span> ' + Lg(it.why);
        return;
      }
      st.tries++;
      if (st.tries >= 3) {
        fb.innerHTML = '<b>' + BINS[it.bin] + '.</b> ' + Lg(it.why);
        st.tries = 0; st.i++;
        if (st.i >= IT.length) st.done = true;
        setTimeout(render, 1600);
        return;
      }
      fb.textContent = (it.bin === 0)
        ? L('Todavía no. Pregúntate si la tarjeta menciona alguna valoración o solo el relato de lo ocurrido.',
            'Not yet. Ask yourself whether the card mentions any appraisal or only the account of what happened.')
        : L('Todavía no. La tarjeta sí opina; ahora fíjate en quién asume esa opinión, una persona o el periódico completo.',
            'Not yet. The card does give an opinion; now look at who owns it, one person or the whole newspaper.');
    };
    render();
  }

  /* ══════════════ W7 — the reporter notebook ══════════════ */
  function buildReflect() {
    var PROMPTS = [
      { es:'Elige un suceso de tu escuela o de tu colonia que merezca un texto de opinión y escribe, en una sola oración, la postura que defenderías.',
        en:'Choose an event from your school or neighbourhood that deserves an opinion piece and write, in a single sentence, the stance you would defend.' },
      { es:'Escribe una razón que apoyarías con un dato y anota dónde buscarías ese dato para poder comprobarlo.',
        en:'Write one reason you would support with a figure and note where you would look for that figure so it can be checked.' },
      { es:'Dibuja el esquema del texto que escribirías: dónde iría la postura, dónde las razones y dónde el cierre.',
        en:'Sketch the outline of the text you would write: where the stance would go, where the reasons and where the closing.' },
      { es:'Escoge a una persona de tu comunidad a quien entrevistarías para tu texto y escribe la primera pregunta que le harías.',
        en:'Choose someone in your community you would interview for your text and write the first question you would ask.' }
    ];
    var pick = PROMPTS[Math.floor(rng() * PROMPTS.length)];
    var w = document.createElement('div');
    w.className = 'gw section'; w.id = 'wRef';
    w.setAttribute('data-widget', 'reflect');
    w.innerHTML = '<div class="iw-tag">' + L('Tu libreta de reportero', 'Your reporter notebook') + '</div>' +
      '<div class="reflect-prompt">' + Lg(pick) + '</div>' +
      '<div class="wtabs">' +
        '<button class="wtab active" onclick="wRefTab(\'type\',this)">⌨️ ' + L('Escribir', 'Write') + '</button>' +
        '<button class="wtab" onclick="wRefTab(\'draw\',this)">✏️ ' + L('Dibujar', 'Sketch') + '</button>' +
      '</div>' +
      '<div class="wpanel active" id="wRef_type"><textarea class="wtextarea" id="wRefTa" placeholder="' + L('Tu respuesta...', 'Your answer...') + '"></textarea></div>' +
      '<div class="wpanel" id="wRef_draw"><div class="cvwrap"><canvas class="dcanvas" id="wRefCv"></canvas>' +
        '<div class="ctoolbar"><button class="tbtn2 bpen on">' + t('btn-pen') + '</button>' +
        '<button class="tbtn2 bmarker">' + t('btn-marker') + '</button>' +
        '<button class="tbtn2 beraser">' + t('btn-eraser') + '</button>' +
        drawDotsHTML() + '<button class="clrbtn">' + t('btn-clear') + '</button></div></div></div>' +
      '<button class="rverify-btn" style="margin-top:.6rem" onclick="wRefSave()">' + L('Guardar en la libreta', 'Save to the notebook') + '</button>' +
      '<div class="rfb" id="wRefFb"></div>';
    body.appendChild(w);
    window.wRefTab = function(which, btn) {
      ['type', 'draw'].forEach(function(k){ document.getElementById('wRef_' + k).classList.toggle('active', k === which); });
      w.querySelectorAll('.wtab').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      if (which === 'draw') setTimeout(function(){ var c = document.getElementById('wRefCv'); if (c && !c.width) initCanvas(c); }, 60);
    };
    window.wRefSave = function() {
      document.getElementById('wRefFb').innerHTML = '<span class="rok">✓ ' +
        L('Guardado. Una postura clara y una razón comprobable son ya la mitad del artículo.',
          'Saved. A clear stance and one checkable reason are already half the article.') + '</span>';
    };
  }

  /* ══════════════════════════════════════════════════════════════════════════
     THE LESSON — concept, manipulative, problem, in that order (Rule 1)
     ══════════════════════════════════════════════════════════════════════════ */

  section(
    L('El periódico y sus géneros', 'The newspaper and its genres'),
    L('Cuando el periódico deja de informar y empieza a opinar', 'When the newspaper stops informing and starts arguing'),
    [ L('Un periódico hace dos cosas distintas con un mismo suceso. En la primera página lo cuenta: qué pasó, cuándo, dónde y quiénes estuvieron ahí. En otras páginas alguien toma ese mismo suceso y dice qué piensa de él, por qué le importa y qué debería ocurrir después. Los géneros del primer grupo se llaman informativos; los del segundo, de opinión.',
         'A newspaper does two different things with the same event. On the front page it tells it: what happened, when, where and who was there. On other pages someone takes that same event and says what they think of it, why it matters and what should happen next. The genres in the first group are called informative; those in the second, opinion genres.'),
      L('La diferencia no está en el tema, sino en lo que el texto hace con él. Por eso la primera destreza de quien escribe opinión es distinguir, dentro de su propio texto, lo que puede comprobarse de lo que solo puede defenderse. Un hecho lo confirma un registro, una fecha, una cifra o una fotografía. Una opinión la sostiene quien la escribe, y solo se sostiene si trae razones detrás.',
         'The difference is not in the subject but in what the text does with it. That is why the first skill of an opinion writer is telling apart, inside their own text, what can be verified from what can only be defended. A fact is confirmed by a record, a date, a figure or a photograph. An opinion is held up by whoever writes it, and only stands if it brings reasons behind it.') ],
    L('Un texto de opinión no elige entre hechos y valoraciones: usa los hechos para que su valoración resulte creíble.',
      'An opinion text does not choose between facts and appraisals: it uses facts to make its appraisal believable.')
  );

  section(
    L('El material de trabajo', 'The working material'),
    L('Un suceso de la memoria del barrio, contado por quien lo vivió', 'A neighbourhood memory, told by someone who lived it'),
    [ L('El texto que sigue apareció en el periódico de una secundaria. Su autor investigó un suceso de su comunidad, habló con vecinos, revisó registros y después escribió lo que piensa de ese suceso. Léelo entero antes de continuar: cada actividad de esta guía vuelve a él.',
         'The text below appeared in a secondary school newspaper. Its author researched an event in the community, talked with neighbours, checked records and then wrote what they think about it. Read it in full before going on: every activity in this guide comes back to it.') ]
  );
  excerpt();
  buildFactOpinion();
  addProblem(C.qs.p1);

  section(
    L('La arquitectura del texto', 'The architecture of the text'),
    L('Postura, razones y cierre', 'Stance, reasons and closing'),
    [ L('Un texto de opinión no se ordena por orden cronológico, sino por fuerza argumentativa. Empieza presentando el suceso y enunciando la postura, esa oración en la que quien escribe dice exactamente qué va a defender. Enseguida vienen las razones, una por párrafo, cada una apoyada en algo que el lector pueda revisar o escuchar.',
         'An opinion text is not ordered chronologically but by argumentative force. It begins by presenting the event and stating the stance, that sentence where the writer says exactly what will be defended. Then come the reasons, one per paragraph, each supported by something the reader can check or hear.'),
      L('Antes de terminar suele aparecer un movimiento que muchos olvidan: hacerse cargo de lo que diría quien piensa distinto y contestarle. Un texto que ignora la postura contraria parece más débil, no más fuerte. El cierre retoma la postura inicial y la deja mirando hacia adelante.',
         'Before ending there is usually a move many forget: taking on what someone who thinks otherwise would say and answering them. A text that ignores the opposing stance looks weaker, not stronger. The closing takes up the initial stance again and leaves it looking ahead.') ]
  );
  buildOrder();
  addProblem(C.qs.p2);
  addProblem(C.qs.p3);

  section(
    L('Los recursos del oficio', 'The devices of the trade'),
    L('Cuatro maneras de volver creíble una postura', 'Four ways to make a stance believable'),
    [ L('Quien opina bien no repite su postura más fuerte: la apoya. El dato verificable trae una cifra tomada de un registro y permite al lector comprobarla por su cuenta. El testimonio citado reproduce entre comillas las palabras de alguien que estuvo ahí y añade su nombre, para que la voz tenga dueño.',
         'Someone who argues well does not repeat the stance louder: they support it. The verifiable figure brings a number taken from a record and lets the reader check it independently. The quoted testimony reproduces in quotation marks the words of someone who was there and adds their name, so the voice has an owner.'),
      L('La comparación enlaza el suceso con algo conocido para que se entienda de golpe, sin que ninguna de las dos cosas deje de ser lo que era. La pregunta retórica no busca respuesta: está construida para que el lector solo pueda contestarla de una manera, la que conviene a la postura del texto.',
         'The comparison links the event to something familiar so it is grasped at once, without either of the two things ceasing to be what it was. The rhetorical question seeks no answer: it is built so the reader can only answer it one way, the way that suits the stance of the text.') ]
  );
  buildDeviceMatch();
  addProblem(C.qs.p4);
  addProblem(C.qs.p5);

  section(
    L('Las piezas que enlazan', 'The pieces that link'),
    L('Conectores: las señales que guían al lector', 'Connectors: the signals that guide the reader'),
    [ L('Entre una razón y la siguiente hay palabras que no cuentan nada nuevo y sin embargo son imprescindibles: los conectores. Unos abren la lista de razones, otros suman una más, otros avisan de que viene un giro contra lo dicho y otros anuncian que llega la conclusión. El lector los usa como señales de tránsito.',
         'Between one reason and the next there are words that tell nothing new and yet are indispensable: connectors. Some open the list of reasons, others add one more, others warn that a turn against what was said is coming and others announce that the conclusion is arriving. The reader uses them as road signs.'),
      L('Cambiar un conector por otro cambia el argumento completo aunque las ideas sigan siendo las mismas. Por eso, al revisar un texto de opinión, conviene leer solo los conectores: en ellos se ve, en pocas palabras, la forma del razonamiento.',
         'Swapping one connector for another changes the whole argument even if the ideas stay the same. That is why, when revising an opinion text, it helps to read only the connectors: in them you see, in a few words, the shape of the reasoning.') ]
  );
  buildMarkConnectors();
  addProblem(C.qs.p6);

  section(
    L('Antes de escribir', 'Before writing'),
    L('Investigar el suceso: quién lo guarda y dónde', 'Researching the event: who keeps it and where'),
    [ L('Un texto de opinión sobre un suceso de la comunidad no empieza en el teclado, sino en la búsqueda. Los archivos del periódico local guardan fechas y nombres. Los registros de una escuela o de una asociación guardan cifras. Las fotografías familiares guardan cómo se veían los lugares antes de cambiar. Y las personas guardan lo que ningún papel registró: qué se sintió.',
         'An opinion text about a community event does not start at the keyboard but in the search. Local newspaper archives keep dates and names. School or association records keep figures. Family photographs keep how places looked before they changed. And people keep what no paper recorded: how it felt.'),
      L('Cada afirmación del texto pide su propia fuente, y elegir mal la fuente debilita el argumento aunque la afirmación sea cierta. Una cifra respaldada por un recuerdo, o una emoción respaldada por un presupuesto, dejan al lector con la duda que el texto quería despejar.',
         'Every claim in the text asks for its own source, and choosing the wrong source weakens the argument even if the claim is true. A figure backed by a memory, or an emotion backed by a budget, leave the reader with the very doubt the text meant to clear up.') ]
  );
  buildSources();
  addProblem(C.qs.p7);
  addProblem(C.qs.p8);

  section(
    L('La firma y la voz', 'The signature and the voice'),
    L('Quién responde por lo que ahí se dice', 'Who answers for what is said there'),
    [ L('Dentro de la opinión no todos los textos hablan desde el mismo lugar. El artículo de opinión lo firma una persona, y esa firma indica que la postura es suya. El editorial no lleva firma: lo escribe el equipo del periódico y fija la posición de la publicación entera, por eso ocupa siempre el mismo sitio en la plana.',
         'Within opinion, not every text speaks from the same place. The opinion article is signed by a person, and that signature indicates the stance is theirs. The editorial carries no signature: the newspaper team writes it and it sets the position of the whole publication, which is why it always occupies the same spot on the page.'),
      L('Frente a los dos está la nota informativa, que relata el suceso y se detiene ahí. Saber en qué sección va cada texto no es un detalle de forma: le dice al lector cuánto de lo que lee es hecho y cuánto es postura, y quién responde por ella.',
         'Facing both is the news report, which recounts the event and stops there. Knowing which section each text belongs to is not a matter of form: it tells the reader how much of what they read is fact and how much is stance, and who answers for it.') ]
  );
  buildGenreSort();
  buildReflect();

  addProblem(q9);
  addProblem(q10);
}
</script>

<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbzLGV15JRTPs9bbSvHRLfgOXeT9oUExDf1AH546WOwq5tYxXSdhX212OWi_bTJfMGx9/exec';

})();
