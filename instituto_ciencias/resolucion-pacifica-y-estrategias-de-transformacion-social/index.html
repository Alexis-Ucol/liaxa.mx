function carRender(){
  if (!CAR) return;
  var box = document.getElementById('carBox');
  if (!box) return;
  var names = CAR_BINS[LANG];
  var tal = '<div class="chips">' + names.map(function(b, k){
    return '<div class="chip used">' + b + ': ' + CAR.tally[k] + '</div>';
  }).join('') + '</div>';
  if (CAR.done) {
    box.innerHTML = tal +
      '<div class="wmsg ok">' + S('Tablero completo. Las tres caras se atienden distinto: el acto se detiene y se repara, la organización se cambia, y la idea que lo justifica se discute abiertamente hasta dejar de repetirse.',
                                  'Board complete. The three faces are handled differently: the act is stopped and repaired, the organization is changed, and the idea that justifies it is discussed openly until it stops being repeated.') + '</div>';
    return;
  }
  var it = CAR.items[CAR.order[CAR.i]];
  var msg = CAR.note || S('Pregúntate primero: ¿hay un acto, una condición del lugar, o una idea que se repite?',
                          'Ask yourself first: is there an act, a condition of the place, or an idea that keeps being repeated?');
  box.innerHTML =
    '<div class="wcase">' + it[LANG] + '</div>' +
    '<div class="chips">' + names.map(function(b, k){
        return '<div class="chip" onclick="carPick(' + k + ')">' + b + '</div>';
      }).join('') + '</div>' +
    tal +
    '<div class="wmsg ' + (CAR.note ? (CAR.noteOk ? 'ok' : 'warn') : '') + '">' + msg + '</div>' +
    '<div class="wprog">' + (CAR.i + 1) + ' / ' + CAR.items.length + '</div>';
}

function carPick(k){
  if (!CAR || CAR.done) return;
  var it = CAR.items[CAR.order[CAR.i]];
  if (k === it.bin) {
    CAR.tally[k]++; CAR.tries = 0; CAR.noteOk = true;
    CAR.note = S('Así es. ' + it.wes, 'That is it. ' + it.wen);
    CAR.i++;
    if (CAR.i >= CAR.items.length) CAR.done = true;
    carRender();
    return;
  }
  CAR.tries++;
  if (CAR.tries >= 3) {
    CAR.tally[it.bin]++; CAR.tries = 0; CAR.noteOk = false;
    CAR.note = S('Esta situación iba en ' + CAR_BINS.es[it.bin] + '. ' + it.wes,
                 'This situation belonged in ' + CAR_BINS.en[it.bin] + '. ' + it.wen);
    CAR.i++;
    if (CAR.i >= CAR.items.length) CAR.done = true;
    carRender();
    return;
  }
  CAR.noteOk = false;
  if (k === 0) {
    CAR.note = S('Todavía no. La violencia directa necesita un acto y alguien que lo ejerza en ese momento. Revisa si aquí el daño viene de cómo está organizado el lugar o de una idea que se repite.',
                 'Not yet. Direct violence needs an act and someone doing it right then. Check whether the harm here comes from how the place is organized or from an idea that keeps being repeated.');
  } else if (k === 1) {
    CAR.note = S('Todavía no. La violencia estructural vive en la organización: reglas, horarios, presupuestos, accesos. Revisa si aquí hay más bien un acto concreto o un discurso que lo justifica.',
                 'Not yet. Structural violence lives in the organization: rules, schedules, budgets, access. Check whether what you have here is instead a concrete act or a discourse that justifies it.');
  } else {
    CAR.note = S('Todavía no. La violencia cultural son las ideas que hacen que el daño parezca normal. Revisa si aquí hay un acto concreto o una condición del entorno que niega un derecho.',
                 'Not yet. Cultural violence is the set of ideas that make harm look normal. Check whether what you have here is a concrete act or a condition of the setting that denies a right.');
  }
  carRender();
}

/* ================================================
   WIDGET 2 - ORDENA LA RUTA (secuenciador)
   Six steps arrive scrambled; two taps swap them. A failed check names the first
   step that is out of place and asks what has to happen before it, instead of
   marking it wrong. The third failed check lays the route out in order (Rule 8, A).
   ================================================ */
var RUT = null;
function buildRuta(rng){
  var pools = [
    { t:{ es:'De la reacción a la transformación', en:'From reaction to transformation' },
      q:{ es:'Una escuela responde a una agresión. Ordena lo que tiene que ocurrir, del primer paso al último.',
          en:'A school responds to an act of aggression. Put in order what has to happen, from first step to last.' },
      steps:[
        { es:'Se detiene la agresión y se pone a salvo a la persona afectada.',
          en:'The aggression is stopped and the person harmed is brought to safety.' },
        { es:'El hecho se reporta con su registro a la instancia que puede actuar.',
          en:'The incident is reported, with its record, to the body that can act.' },
        { es:'Se escucha a la persona afectada y se acuerda cómo reparar el daño.',
          en:'The person harmed is heard and how to repair the damage is agreed.' },
        { es:'Se revisa qué condición del entorno hizo posible el hecho.',
          en:'The team reviews which condition of the setting made the incident possible.' },
        { es:'Se cambia esa condición y se nombra a quién le toca sostenerla.',
          en:'That condition is changed and someone is named to keep it in place.' },
        { es:'En una fecha acordada se evalúa si el cambio se sostuvo y se ajusta.',
          en:'On an agreed date the team evaluates whether the change held, and adjusts.' } ] },
    { t:{ es:'Ruta de una estrategia comunitaria', en:'Route of a community strategy' },
      q:{ es:'Un comité del barrio quiere reducir la violencia en su calle. Ordena los pasos, del primero al último.',
          en:'A neighborhood committee wants to reduce violence on its street. Put the steps in order, first to last.' },
      steps:[
        { es:'Se documenta el problema con datos del propio barrio.',
          en:'The problem is documented with data from the neighborhood itself.' },
        { es:'Se define un objetivo que pueda comprobarse al final del ciclo.',
          en:'An objective that can be checked at the end of the cycle is defined.' },
        { es:'Se suman aliados que comparten el problema y se reúnen los recursos.',
          en:'Allies who share the problem join in and resources are gathered.' },
        { es:'Se realiza la acción dirigida a la causa que se documentó.',
          en:'The action aimed at the documented cause is carried out.' },
        { es:'Se compara el indicador con el registro que había al inicio.',
          en:'The indicator is compared with the record that existed at the start.' },
        { es:'Se decide qué continúa, qué se ajusta y quién lo sostiene después.',
          en:'The committee decides what continues, what is adjusted and who sustains it afterwards.' } ] }
  ];
  var p = pools[Math.floor(rng() * pools.length)];
  RUT = { pool:p, order:shufflePerm(p.steps.length, rng), sel:null, tries:0, done:false, msg:null, msgOk:false };
  return '<div class="wgt" data-widget="sequence" id="wRuta">' +
      '<div class="wgt-h">' + p.t[LANG] + '</div>' +
      '<div class="wgt-q">' + p.q[LANG] + ' ' + S('Toca dos pasos para intercambiarlos.','Tap two steps to swap them.') + '</div>' +
      '<div id="rutBox"></div>' +
    '</div>';
}

function rutRender(){
  if (!RUT) return;
  var box = document.getElementById('rutBox');
  if (!box) return;
  var steps = RUT.pool.steps;
  var list = RUT.order.map(function(si, pos){
    var cls = 'tl-chip' + (RUT.sel === pos ? ' sel' : '') + (RUT.done ? ' locked' : '');
    var click = RUT.done ? '' : ' onclick="rutTap(' + pos + ')"';
    return '<div class="' + cls + '"' + click + '><span class="tl-num">' + (pos + 1) + '</span>' + steps[si][LANG] + '</div>';
  }).join('');
  var msg = RUT.msg || S('Piensa qué tiene que estar resuelto antes de dar el paso siguiente.',
                         'Think about what has to be settled before the next step can be taken.');
  box.innerHTML =
    '<div class="tl-list">' + list + '</div>' +
    '<div class="wmsg ' + (RUT.msgOk ? 'ok' : (RUT.msg ? 'warn' : '')) + '">' + msg + '</div>' +
    (RUT.done ? '' : '<button class="wbtn" onclick="rutCheck()">' + S('Comprobar la ruta','Check the route') + '</button>');
}

function rutTap(pos){
  if (!RUT || RUT.done) return;
  if (RUT.sel === null) { RUT.sel = pos; }
  else if (RUT.sel === pos) { RUT.sel = null; }
  else {
    var t = RUT.order[RUT.sel]; RUT.order[RUT.sel] = RUT.order[pos]; RUT.order[pos] = t; RUT.sel = null;
  }
  RUT.msg = null; RUT.msgOk = false;
  rutRender();
}

function rutCheck(){
  if (!RUT || RUT.done) return;
  var bad = -1, i;
  for (i = 0; i < RUT.order.length; i++) if (RUT.order[i] !== i) { bad = i; break; }
  if (bad === -1) {
    RUT.done = true; RUT.msgOk = true;
    RUT.msg = S('Ruta completa. Fíjate en los tres últimos pasos: ahí es donde una respuesta deja de repetirse y empieza a cambiar lo que hacía posible el daño.',
                'Route complete. Look at the last three steps: that is where a response stops repeating itself and starts changing what made the harm possible.');
    rutRender(); return;
  }
  RUT.tries++;
  if (RUT.tries >= 3) {
    RUT.order = RUT.pool.steps.map(function(_, k){ return k; });
    RUT.done = true; RUT.msgOk = false;
    RUT.msg = S('Esta es la ruta completa. Léela de arriba abajo: cada paso solo tiene sentido cuando el anterior ya ocurrió.',
                'This is the full route. Read it from top to bottom: each step only makes sense once the previous one has happened.');
    rutRender(); return;
  }
  RUT.msgOk = false;
  RUT.msg = S('Aún no. Revisa el paso que quedó en el lugar ' + (bad + 1) + ': ¿qué tendría que haber ocurrido antes de él?',
              'Not yet. Look at the step sitting in position ' + (bad + 1) + ': what would have had to happen before it?');
  rutRender();
}

/* ================================================
   WIDGET 3 - CADA CASO, SU VIA (emparejar)
   The student taps a case, then the route they believe fits it. A wrong pair does
   not lock: it answers with the two questions that choose a route, who can act
   and what the person harmed needs. Third miss on the same case reveals its pair
   (Rule 8, A).
   ================================================ */
var VIA = null;
function buildVias(rng){
  var sets = [
    [ { p:{ es:'Dos compañeras dejaron de hablarse por un malentendido y las dos quieren arreglarlo.',
            en:'Two classmates stopped speaking over a misunderstanding and both want to fix it.' },
        q:{ es:'Mediación entre pares: una persona imparcial las ayuda a acordar, sin decidir por ellas.',
            en:'Peer mediation: an impartial person helps them agree, without deciding for them.' } },
      { p:{ es:'Un adulto del plantel humilla de manera repetida a un estudiante frente al grupo.',
            en:'An adult in the school repeatedly humiliates a student in front of the class.' },
        q:{ es:'Protocolo de la escuela: la instancia responsable investiga y toma medidas de protección.',
            en:'School protocol: the responsible body investigates and takes protective measures.' } },
      { p:{ es:'Alguien recibe amenazas en línea y teme quedar expuesto si lo cuenta.',
            en:'Someone receives online threats and fears being exposed if they tell.' },
        q:{ es:'Canal confidencial de ayuda: recibe el reporte y orienta sin hacer circular el nombre.',
            en:'Confidential help channel: it takes the report and gives guidance without circulating the name.' } },
      { p:{ es:'A una comunidad se le niega un servicio que sí llega a las colonias vecinas.',
            en:'A community is denied a service that does reach the neighboring areas.' },
        q:{ es:'Queja ante un organismo público de derechos humanos, que puede investigar a la autoridad.',
            en:'Complaint to a public human rights body, which can investigate the authority.' } } ],
    [ { p:{ es:'Dos equipos discuten por el horario de la cancha y aceptan sentarse a hablar.',
            en:'Two teams argue over the court schedule and agree to sit down and talk.' },
        q:{ es:'Negociación con reglas acordadas entre las partes y un acuerdo escrito con fechas.',
            en:'Negotiation with rules agreed between the parties and a written agreement with dates.' } },
      { p:{ es:'Un grupo del salón excluye y hostiga a un compañero desde hace meses.',
            en:'A group in the classroom has been excluding and harassing a classmate for months.' },
        q:{ es:'Protocolo de la escuela: se activa el seguimiento y se protege a quien recibe el daño.',
            en:'School protocol: follow up is activated and the person receiving the harm is protected.' } },
      { p:{ es:'Una estudiante quiere contar lo que le ocurre sin que su nombre circule por el plantel.',
            en:'A student wants to tell what is happening to her without her name circulating in the school.' },
        q:{ es:'Buzón confidencial: el reporte llega a quien puede actuar y la información se resguarda.',
            en:'Confidential mailbox: the report reaches whoever can act and the information is safeguarded.' } },
      { p:{ es:'Un colectivo juvenil quiere que su experiencia sirva en escuelas de otros países.',
            en:'A youth collective wants its experience to be useful in schools in other countries.' },
        q:{ es:'Red internacional de jóvenes: se intercambian experiencias evaluadas y cada lugar las adapta.',
            en:'International youth network: evaluated experiences are exchanged and each place adapts them.' } } ]
  ];
  var P = sets[Math.floor(rng() * sets.length)];
  var solved = [], i;
  for (i = 0; i < P.length; i++) solved.push(false);
  VIA = { pairs:P, right:shufflePerm(P.length, rng), sel:null, solved:solved, tries:0, msg:null, msgOk:false };
  return '<div class="wgt" data-widget="match" id="wVias">' +
      '<div class="wgt-h">' + S('Cada caso, su vía','Each case, its route') + '</div>' +
      '<div class="wgt-q">' + S('Selecciona un caso y después la vía que le corresponde.',
                                'Select a case and then the route that fits it.') + '</div>' +
      '<div id="viaBox"></div>' +
    '</div>';
}

function viaRender(){
  if (!VIA) return;
  var box = document.getElementById('viaBox');
  if (!box) return;
  var left = VIA.pairs.map(function(pr, i){
    var cls = 'optbox' + (VIA.solved[i] ? ' done' : '') + (VIA.sel === i ? ' sel' : '');
    return '<div class="' + cls + '" onclick="viaLeft(' + i + ')">' + pr.p[LANG] + '</div>';
  }).join('');
  var right = VIA.right.map(function(r, pos){
    var cls = 'optbox' + (VIA.solved[r] ? ' done' : '');
    return '<div class="' + cls + '" onclick="viaRight(' + pos + ')">' + VIA.pairs[r].q[LANG] + '</div>';
  }).join('');
  var done = VIA.solved.every(function(s){ return s; });
  var msg = VIA.msg || S('Para elegir una vía hay dos preguntas: quién puede actuar sobre ese caso, y qué necesita la persona afectada para no quedar más expuesta.',
                         'Choosing a route takes two questions: who can act on that case, and what the person harmed needs in order not to be further exposed.');
  if (done) {
    msg = S('Los cuatro casos quedaron con su vía. Fíjate en algo: la mediación solo funciona cuando las dos partes están en igualdad y quieren acordar.',
            'All four cases now have their route. Notice something: mediation only works when both parties stand as equals and want to agree.');
  }
  box.innerHTML =
    '<div class="mcols">' +
      '<div><div class="colh">' + S('El caso','The case') + '</div>' + left + '</div>' +
      '<div><div class="colh">' + S('La vía','The route') + '</div>' + right + '</div>' +
    '</div>' +
    '<div class="wmsg ' + (done || VIA.msgOk ? 'ok' : (VIA.msg ? 'warn' : '')) + '">' + msg + '</div>' +
    '<div class="wprog">' + VIA.solved.filter(function(s){ return s; }).length + ' / ' + VIA.pairs.length + '</div>';
}

function viaLeft(i){
  if (!VIA || VIA.solved[i]) return;
  if (VIA.sel !== i) VIA.tries = 0;
  VIA.sel = (VIA.sel === i) ? null : i;
  VIA.msg = null; VIA.msgOk = false;
  viaRender();
}

function viaRight(pos){
  if (!VIA) return;
  var r = VIA.right[pos];
  if (VIA.solved[r]) return;
  if (VIA.sel === null) {
    VIA.msgOk = false;
    VIA.msg = S('Elige primero un caso de la columna izquierda.', 'Pick a case from the left column first.');
    viaRender(); return;
  }
  if (r === VIA.sel) {
    VIA.solved[r] = true; VIA.sel = null; VIA.tries = 0; VIA.msgOk = true;
    VIA.msg = S('Encaja. Esa vía puede actuar sobre el caso y no obliga a la persona afectada a exponerse.',
                'It fits. That route can act on the case and does not force the person harmed to expose themselves.');
    viaRender(); return;
  }
  VIA.tries++;
  if (VIA.tries >= 3) {
    var s = VIA.sel;
    VIA.solved[s] = true; VIA.sel = null; VIA.tries = 0; VIA.msgOk = false;
    VIA.msg = S('Ese caso corresponde a esta vía: ' + VIA.pairs[s].q.es,
                'That case corresponds to this route: ' + VIA.pairs[s].q.en);
    viaRender(); return;
  }
  VIA.msgOk = false;
  VIA.msg = S('Esa no. Pregúntate si las dos partes están en igualdad, si hay una autoridad que incumple, o si lo que hace falta es resguardar a quien reporta.',
              'Not that one. Ask whether both parties stand as equals, whether an authority is failing its duty, or whether what is needed is protecting whoever reports.');
  viaRender();
}

/* ================================================
   WIDGET 4 - ARMA LA ESTRATEGIA (constructor con medidores)
   The diagnosis is fixed and the student assembles the strategy: an action, an
   alliance and an indicator. Three meters move the instant a card is tapped, so
   a weak choice is visible before any check. Wrong combinations do not lock: the
   message names the meter that stayed low. Reveal on the third check (Rule 8, A).
   ================================================ */
var EST = null;
function buildEstrategia(rng){
  var pools = [
    { dx:{ es:'El registro de todo un ciclo muestra que casi todos los incidentes ocurren en el corredor trasero durante el receso: un espacio sin luz, sin actividades y por donde no pasa ninguna persona adulta.',
           en:'The record of a whole school year shows that almost every incident happens in the back corridor during break: a space with no light, no activities and where no adult ever passes.' },
      rows:[
        { h:{ es:'Acción', en:'Action' }, opts:[
          { es:'Reparar la luz, abrir el corredor con actividades y turnar el acompañamiento.',
            en:'Repair the lighting, open the corridor with activities and rotate adult accompaniment.', v:3 },
          { es:'Organizar una jornada contra la violencia en el auditorio al inicio del ciclo.',
            en:'Hold an anti violence day in the auditorium at the start of the year.', v:1 },
          { es:'Colocar carteles con frases contra la violencia en la entrada del plantel.',
            en:'Put up posters with anti violence slogans at the school entrance.', v:0 } ] },
        { h:{ es:'Alianza', en:'Alliance' }, opts:[
          { es:'Sumar a las familias y al comité vecinal que usa ese mismo corredor.',
            en:'Bring in the families and the neighborhood committee that uses that same corridor.', v:3 },
          { es:'Pedir apoyo solo al grupo que propuso la idea.',
            en:'Ask for support only from the group that proposed the idea.', v:1 },
          { es:'Invitar a una figura conocida a publicar un mensaje de apoyo.',
            en:'Invite a well known figure to post a message of support.', v:0 } ] },
        { h:{ es:'Indicador', en:'Indicator' }, opts:[
          { es:'Comparar cada mes los incidentes de ese corredor con el registro del ciclo anterior.',
            en:'Compare each month the incidents in that corridor with last year record.', v:3 },
          { es:'Registrar cuántas personas asistieron a la jornada.',
            en:'Record how many people attended the event.', v:1 },
          { es:'Contar cuántos carteles se colocaron durante la campaña.',
            en:'Count how many posters were put up during the campaign.', v:0 } ] } ] },
    { dx:{ es:'El comité documentó que los pleitos empiezan de noche en el chat del grupo y llegan al salón a la mañana siguiente, y que nadie sabe a quién avisar cuando eso ocurre.',
           en:'The committee documented that the fights start at night in the group chat and reach the classroom the next morning, and that nobody knows whom to tell when that happens.' },
      rows:[
        { h:{ es:'Acción', en:'Action' }, opts:[
          { es:'Acordar reglas del chat y un canal conocido para reportar, con seguimiento semanal.',
            en:'Agree on chat rules and a known channel for reporting, with weekly follow up.', v:3 },
          { es:'Prohibir los teléfonos dentro del plantel durante un mes.',
            en:'Ban phones inside the school for a month.', v:1 },
          { es:'Pedir a cada quien que ignore lo que ocurra en el chat.',
            en:'Ask everyone to ignore whatever happens in the chat.', v:0 } ] },
        { h:{ es:'Alianza', en:'Alliance' }, opts:[
          { es:'Sumar a las familias y a la persona tutora, que reciben los reportes.',
            en:'Bring in the families and the class tutor, who receive the reports.', v:3 },
          { es:'Dejarlo en manos de las dos personas que más se quejan.',
            en:'Leave it to the two people who complain the most.', v:1 },
          { es:'Convocar a otro salón que no usa ese chat.',
            en:'Call in another class that does not use that chat.', v:0 } ] },
        { h:{ es:'Indicador', en:'Indicator' }, opts:[
          { es:'Comparar cuántos conflictos del chat llegaron al salón antes y después del acuerdo.',
            en:'Compare how many chat conflicts reached the classroom before and after the agreement.', v:3 },
          { es:'Contar cuántas personas leyeron el reglamento del chat.',
            en:'Count how many people read the chat rules.', v:1 },
          { es:'Medir cuántos mensajes se enviaron en el chat cada semana.',
            en:'Measure how many messages were sent in the chat each week.', v:0 } ] } ] }
  ];
  var p = pools[Math.floor(rng() * pools.length)];
  EST = { pool:p, sel:[null, null, null], tries:0, done:false, msg:null, msgOk:false };
  return '<div class="wgt" data-widget="build" id="wEstrategia">' +
      '<div class="wgt-h">' + S('Arma la estrategia','Build the strategy') + '</div>' +
      '<div class="wgt-q">' + S('El diagnóstico ya está hecho. Elige una tarjeta en cada fila y observa los medidores.',
                                'The diagnosis is already done. Pick one card in each row and watch the meters.') + '</div>' +
      '<div id="estBox"></div>' +
    '</div>';
}

var EST_METERS = {
  es:['Ataca la causa','Alcanza a quienes hace falta','Se puede medir'],
  en:['Hits the cause','Reaches everyone involved','Can be measured']
};

function estRender(){
  if (!EST) return;
  var box = document.getElementById('estBox');
  if (!box) return;
  var rows = EST.pool.rows;
  var body = rows.map(function(row, ri){
    var opts = row.opts.map(function(o, oi){
      var cls = 'optbox' + (EST.sel[ri] === oi ? ' sel' : '') + (EST.done && o.v === 3 ? ' done' : '');
      var click = EST.done ? '' : ' onclick="estPick(' + ri + ',' + oi + ')"';
      return '<div class="' + cls + '"' + click + '>' + o[LANG] + '</div>';
    }).join('');
    return '<div class="colh">' + row.h[LANG] + '</div>' + opts;
  }).join('');
  var meters = EST_METERS[LANG].map(function(lbl, ri){
    var v = EST.sel[ri] === null ? 0 : rows[ri].opts[EST.sel[ri]].v;
    var pctv = Math.round(v / 3 * 100);
    return '<div class="mtr"><div class="mtrlbl"><span>' + lbl + '</span><span>' + pctv + '%</span></div>' +
      '<div class="mtrtrack"><div class="mtrfill' + (v === 3 ? ' ok' : '') + '" style="width:' + pctv + '%"></div></div></div>';
  }).join('');
  var msg = EST.msg || S('Cada tarjeta mueve un medidor. Una estrategia se sostiene cuando los tres quedan arriba.',
                         'Each card moves one meter. A strategy holds up when all three end up high.');
  box.innerHTML =
    '<div class="wcase">' + EST.pool.dx[LANG] + '</div>' +
    body +
    '<div style="margin-top:.9rem">' + meters + '</div>' +
    '<div class="wmsg ' + (EST.msgOk ? 'ok' : (EST.msg ? 'warn' : '')) + '">' + msg + '</div>' +
    (EST.done ? '' : '<button class="wbtn" onclick="estCheck()">' + S('Comprobar la estrategia','Check the strategy') + '</button>');
}

function estPick(ri, oi){
  if (!EST || EST.done) return;
  EST.sel[ri] = (EST.sel[ri] === oi) ? null : oi;
  EST.msg = null; EST.msgOk = false;
  estRender();
}

var EST_NUDGE = {
  es:['Esa acción sensibiliza o castiga, pero deja intacta la condición que el diagnóstico señala. Vuelve a leer dónde y cuándo ocurre el problema.',
      'Con ese apoyo la estrategia no alcanza a todas las personas involucradas. Pregúntate quiénes más comparten el problema y pueden aportar algo.',
      'Ese dato mide el esfuerzo del comité, no el resultado prometido. Busca algo que puedas comparar con el punto de partida.'],
  en:['That action raises awareness or punishes, but leaves untouched the condition the diagnosis points at. Read again where and when the problem happens.',
      'With that support the strategy does not reach everyone involved. Ask who else shares the problem and can contribute something.',
      'That figure measures the effort of the committee, not the promised result. Look for something you can compare with the starting point.']
};

function estCheck(){
  if (!EST || EST.done) return;
  var rows = EST.pool.rows, i, missing = -1, weak = -1;
  for (i = 0; i < 3; i++) if (EST.sel[i] === null && missing === -1) missing = i;
  if (missing !== -1) {
    EST.msgOk = false;
    EST.msg = S('Falta elegir una tarjeta en la fila de ' + rows[missing].h.es + '.',
                'You still have to pick a card in the ' + rows[missing].h.en + ' row.');
    estRender(); return;
  }
  for (i = 0; i < 3; i++) if (rows[i].opts[EST.sel[i]].v < 3 && weak === -1) weak = i;
  if (weak === -1) {
    EST.done = true; EST.msgOk = true;
    EST.msg = S('Estrategia completa. Actúa sobre la causa que el diagnóstico mostró, involucra a quienes comparten el problema y deja un dato comparable para saber si funcionó.',
                'Strategy complete. It acts on the cause the diagnosis showed, it involves those who share the problem, and it leaves a comparable figure to tell whether it worked.');
    estRender(); return;
  }
  EST.tries++;
  if (EST.tries >= 3) {
    for (i = 0; i < 3; i++) {
      var k, best = 0;
      for (k = 0; k < rows[i].opts.length; k++) if (rows[i].opts[k].v === 3) best = k;
      EST.sel[i] = best;
    }
    EST.done = true; EST.msgOk = false;
    EST.msg = S('Esta combinación es la que sostiene los tres medidores. Compárala con la tuya y fíjate en qué fila se te fue el objetivo.',
                'This combination is the one that holds the three meters up. Compare it with yours and notice in which row the objective slipped away.');
    estRender(); return;
  }
  EST.msgOk = false;
  EST.msg = EST_NUDGE[LANG][weak];
  estRender();
}

/* ================================================
   WIDGET 5 - CUADERNO ABIERTO
   The humanities version of showing your work: a seeded prompt the student
   answers by writing or sketching, with encouraging feedback and no verdict.
   ================================================ */
function buildCuaderno(rng){
  var PROMPTS = [
    { es:'Elige un conflicto que hayas visto en tu escuela o tu colonia. Descríbelo en tres partes: qué se disputaba, qué daño se agregó y qué condición del entorno lo hacía probable.',
      en:'Pick a conflict you have seen at your school or in your neighborhood. Describe it in three parts: what was being disputed, what harm was added, and which condition of the setting made it likely.' },
    { es:'Dibuja el mapa de tu escuela y marca los lugares y las horas donde se concentran los conflictos. Escribe al lado qué cambiarías en cada punto y quién tendría que sostenerlo.',
      en:'Draw the map of your school and mark the places and times where conflicts concentrate. Write beside each point what you would change there and who would have to sustain it.' },
    { es:'Escribe la ruta que seguirías si presenciaras una agresión: a quién acudirías, qué guardarías como registro y qué le preguntarías a la persona afectada antes de actuar.',
      en:'Write the route you would follow if you witnessed an aggression: whom you would turn to, what you would keep as a record, and what you would ask the person harmed before acting.' },
    { es:'Propón una acción para fortalecer el tejido social de tu grupo y explica con qué dato sabrías, al final del ciclo, si de verdad funcionó.',
      en:'Propose one action to strengthen the social fabric of your class and explain which figure would tell you, at the end of the year, whether it really worked.' }
  ];
  var p = PROMPTS[Math.floor(rng() * PROMPTS.length)];
  var wrap = document.createElement('div');
  wrap.className = 'wgt section';
  wrap.setAttribute('data-widget', 'reflect');
  wrap.id = 'wCuaderno';
  wrap.innerHTML =
    '<div class="wgt-h">' + S('Cuaderno abierto','Open notebook') + '</div>' +
    '<div class="reflect-prompt">' + p[LANG] + '</div>' +
    '<div class="wtabs">' +
      '<button class="wtab active" onclick="cuadTab(\'type\',this)">' + t('tab-type') + '</button>' +
      '<button class="wtab" onclick="cuadTab(\'draw\',this)">' + t('tab-draw') + '</button>' +
    '</div>' +
    '<div class="wpanel active" id="cuad_type"><textarea class="wtextarea" id="cuadTa" placeholder="' + S('Tu respuesta...','Your answer...') + '"></textarea></div>' +
    '<div class="wpanel" id="cuad_draw"><div class="cvwrap"><canvas class="dcanvas" id="cuadCv"></canvas>' +
      '<div class="ctoolbar">' +
        '<button class="tbtn2 bpen on">' + t('btn-pen') + '</button>' +
        '<button class="tbtn2 bmarker">' + t('btn-marker') + '</button>' +
        '<button class="tbtn2 beraser">' + t('btn-eraser') + '</button>' +
        '<div class="cdot sel" data-color="#0f2d5a" style="background:#0f2d5a"></div>' +
        '<div class="cdot" data-color="#1a1a16" style="background:#1a1a16"></div>' +
        '<div class="cdot" data-color="#8b2500" style="background:#8b2500"></div>' +
        '<div class="cdot" data-color="#1d4e89" style="background:#1d4e89"></div>' +
        '<button class="clrbtn">' + t('btn-clear') + '</button>' +
      '</div>' +
    '</div></div>' +
    '<button class="wbtn" onclick="cuadSave()">' + S('Guardar','Save') + '</button>' +
    '<div class="wmsg" id="cuadFb">' + S('Aquí no hay una sola respuesta. Escribe la tuya y compárala después con la de alguien más.',
                                         'There is no single answer here. Write yours and compare it later with someone else.') + '</div>';
  document.getElementById('lessonBody').appendChild(wrap);
}

function cuadTab(which, btn){
  ['type', 'draw'].forEach(function(x){
    var el = document.getElementById('cuad_' + x);
    if (el) el.classList.toggle('active', x === which);
  });
  var wrap = document.getElementById('wCuaderno');
  if (wrap) wrap.querySelectorAll('.wtab').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  if (which === 'draw') setTimeout(function(){
    var c = document.getElementById('cuadCv');
    if (c && !c.width) initCanvas(c);
  }, 60);
}

function cuadSave(){
  var fb = document.getElementById('cuadFb');
  if (!fb) return;
  fb.className = 'wmsg ok';
  fb.innerHTML = S('Guardado. Lo que escribiste aquí es material para la próxima reunión de tu grupo.',
                   'Saved. What you wrote here is material for the next meeting of your class.');
}

/* ================================================
   buildLesson — concepto -> manipulativo -> problema, intercalado (Rule 1)
   C1 violencia y paz  -> clasificador  -> P1, P2
   C2 reaccion/transformacion -> secuenciador -> P3, P4
   C3 rechazar y denunciar -> emparejador -> P5, P6
   C4 gestionar la estrategia -> constructor -> P7, P8
   C5 tejido social -> cuaderno abierto -> P9, P10
   ================================================ */
function buildLesson(rng) {
  problems = []; answeredCount = 0; correctCount = 0;
  document.getElementById('lessonBody').innerHTML = '';

  /* ── CONCEPTO 1 ─────────────────────────────────────────────── */
  addSection(S('CONCEPTO 1','CONCEPT 1'),
    '<h2>' + S('El conflicto se trabaja, la violencia se rechaza','A conflict is worked through, violence is refused') + '</h2>' +
    '<p>' + S('Convivir produce conflictos: intereses que chocan, necesidades que compiten por el mismo espacio, ideas distintas sobre lo que es justo. Un conflicto no es una falla de la comunidad, es una señal de que algo tiene que revisarse. La violencia es otra cosa: es un daño evitable que alguien agrega a la disputa y que casi nunca toca aquello que se estaba discutiendo.',
              'Living together produces conflicts: interests that clash, needs competing for the same space, different ideas about what is fair. A conflict is not a failure of the community, it is a signal that something has to be reviewed. Violence is a different thing: it is avoidable harm that someone adds to the dispute and that almost never touches what was being discussed.') + '</p>' +
    '<p>' + S('La violencia tampoco aparece siempre como un golpe. Hay violencia directa, que se ve y tiene autor. Hay violencia estructural, que vive en cómo están organizados los horarios, los presupuestos, los accesos y los servicios, y deja a grupos enteros sin poder ejercer un derecho. Y hay violencia cultural, que son las ideas, los dichos y las bromas que hacen que el daño parezca normal.',
              'Violence does not always show up as a blow either. There is direct violence, which is visible and has an author. There is structural violence, which lives in how schedules, budgets, access and services are organized, and leaves whole groups unable to exercise a right. And there is cultural violence, the ideas, sayings and jokes that make harm look normal.') + '</p>' +
    '<div class="callout"><p><strong>' + S('Cultura de paz: ','Culture of peace: ') + '</strong>' +
      S('manera de convivir en la que los desacuerdos se atienden sin daño, las condiciones que excluyen se corrigen y cada persona tiene un lugar donde ser escuchada.',
        'a way of living together in which disagreements are handled without harm, the conditions that exclude are corrected, and every person has a place where they are heard.') + '</p></div>' +
    '<div class="rules-grid">' +
      '<div class="rcard"><div class="rname">' + S('Directa','Direct') + '</div><div class="rform">' + S('¿quién ejerce el daño?','who does the harm?') + '</div><div class="rnote">' + S('Un acto visible, con autor y con persona afectada.','A visible act, with an author and a person harmed.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Estructural','Structural') + '</div><div class="rform">' + S('¿qué lo hace posible?','what makes it possible?') + '</div><div class="rnote">' + S('Reglas, horarios y accesos que niegan un derecho.','Rules, schedules and access that deny a right.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Cultural','Cultural') + '</div><div class="rform">' + S('¿qué lo vuelve normal?','what makes it normal?') + '</div><div class="rnote">' + S('Ideas, dichos y bromas que justifican el daño.','Ideas, sayings and jokes that justify the harm.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Paz positiva','Positive peace') + '</div><div class="rform">' + S('¿qué falta para que no vuelva?','what is missing so it does not return?') + '</div><div class="rnote">' + S('Corregir la causa, no solo detener el episodio.','Correcting the cause, not just stopping the episode.') + '</div></div>' +
    '</div>' +
    buildCaras(rng));
  carRender();

  /* ── PROBLEMA 1 ─────────────────────────────────────────────── */
  addProblem(pick([
    { title:{ es:'Conflicto o violencia', en:'Conflict or violence' }, showWork:false,
      stmt:{ es:'El equipo de básquetbol y el taller de danza necesitan el patio a la misma hora y llevan semanas sin acordar nada. Esta semana, alguien del equipo grabó a las bailarinas para burlarse y el video circuló por el plantel. ¿Qué distingue al conflicto de la violencia en este caso?',
             en:'The basketball team and the dance workshop need the yard at the same time and have gone weeks without agreeing on anything. This week someone from the team filmed the dancers to mock them and the video went around the school. What tells conflict and violence apart in this case?' },
      options:{ es:[
        'El desacuerdo por el horario del patio es el conflicto y puede terminar en un acuerdo; grabar para burlarse es un daño evitable que se sumó y que no resuelve nada del horario.',
        'El conflicto aparece cuando el video empieza a circular, porque hasta ese día las dos actividades habían convivido sin ningún desacuerdo en el plantel.',
        'Se trata del mismo fenómeno visto en dos momentos, ya que todo desacuerdo que se prolonga termina por convertirse en una agresión entre las partes.',
        'La diferencia está en el número de personas afectadas, porque el horario involucra a dos grupos completos y la burla alcanza solo a las bailarinas.' ],
        en:[
        'The disagreement over the yard schedule is the conflict and can end in an agreement; filming to mock is avoidable harm that was added and settles nothing about the schedule.',
        'The conflict appears when the video starts circulating, because until that day the two activities had coexisted with no disagreement at all in the school.',
        'They are the same phenomenon seen at two moments, since every disagreement that drags on ends up turning into an attack between the parties.',
        'The difference lies in the number of people affected, because the schedule involves two whole groups and the mockery reaches only the dancers.' ] },
      correct:0,
      hint:{ es:'Separa dos preguntas: qué se está disputando, y qué daño se agregó que nadie necesitaba para disputarlo.',
             en:'Separate two questions: what is being disputed, and what harm was added that nobody needed in order to dispute it.' },
      explanation:{ es:'El conflicto es la disputa por un espacio que los dos grupos necesitan, y admite salidas: turnos, horarios compartidos, otro lugar. La burla grabada no forma parte de esa disputa: es un daño evitable que agrega un problema nuevo y aleja el acuerdo. Por eso el objetivo nunca es eliminar el conflicto, sino tramitarlo sin violencia.',
                    en:'The conflict is the dispute over a space both groups need, and it allows solutions: turns, shared schedules, another place. The filmed mockery is not part of that dispute: it is avoidable harm that adds a new problem and pushes agreement further away. That is why the goal is never to eliminate the conflict, but to handle it without violence.' } },
    { title:{ es:'Conflicto o violencia', en:'Conflict or violence' }, showWork:false,
      stmt:{ es:'Dos colonias comparten un campo deportivo y llevan meses discutiendo quién lo usa los domingos. La semana pasada, un grupo de una de ellas rompió la reja y pintó insultos contra las familias de la otra. ¿Qué distingue al conflicto de la violencia en este caso?',
             en:'Two neighborhoods share a sports field and have spent months arguing over who uses it on Sundays. Last week a group from one of them broke the fence and painted insults against the families of the other. What tells conflict and violence apart in this case?' },
      options:{ es:[
        'La disputa por el uso del campo es el conflicto y admite un acuerdo de turnos; romper la reja y pintar insultos es un daño evitable que se agregó a esa disputa.',
        'El conflicto comenzó con la reja rota, porque hasta ese día las dos colonias habían usado el campo sin ningún desacuerdo entre ellas.',
        'No hay una diferencia real entre ambos, ya que cuando una disputa dura meses el daño a la propiedad es su desenlace esperado.',
        'La diferencia está en quién tiene la razón, y eso queda definido cuando una autoridad revisa cuál de las dos colonias solicitó primero el campo.' ],
        en:[
        'The dispute over the use of the field is the conflict and allows an agreement on turns; breaking the fence and painting insults is avoidable harm added to that dispute.',
        'The conflict began with the broken fence, because until that day the two neighborhoods had used the field with no disagreement between them.',
        'There is no real difference between the two, since when a dispute lasts for months damage to property is its expected outcome.',
        'The difference lies in who is right, and that is settled once an authority checks which of the two neighborhoods requested the field first.' ] },
      correct:0,
      hint:{ es:'Pregúntate cuál de las dos cosas se puede resolver con un acuerdo, y cuál solo agrega un problema nuevo.',
             en:'Ask which of the two things can be settled with an agreement, and which one only adds a new problem.' },
      explanation:{ es:'El desacuerdo sobre el uso del campo es legítimo y tiene salidas negociadas: turnos, horarios alternados, uso compartido. La reja rota y los insultos pintados no negocian nada, agregan daño y desconfianza, y vuelven más difícil cualquier acuerdo. El conflicto se trabaja; la violencia se rechaza y se repara.',
                    en:'The disagreement over the use of the field is legitimate and has negotiated solutions: turns, alternating schedules, shared use. The broken fence and the painted insults negotiate nothing, they add harm and mistrust, and they make any agreement harder. The conflict is worked through; the violence is refused and repaired.' } }
  ], rng), rng);

  /* ── PROBLEMA 2 ─────────────────────────────────────────────── */
  addProblem(pick([
    { title:{ es:'Lo que no se ve a simple vista', en:'What is not visible at first glance' }, showWork:false,
      stmt:{ es:'En un plantel ocurren tres cosas a la vez: la única rampa permanece cerrada con candado y la llave la tiene alguien que casi nunca está; en el grupo se repite que quien pide ayuda para subir es un exagerado; y un estudiante empujó a un compañero en la escalera. ¿Cuál de esas situaciones corresponde a la violencia estructural?',
             en:'Three things happen at once in a school: the only ramp stays padlocked and the key is held by someone who is hardly ever there; the class keeps saying that anyone who asks for help going up is overreacting; and a student shoved a classmate on the stairs. Which of those situations is structural violence?' },
      options:{ es:[
        'La rampa cerrada, porque la manera en que está organizado el plantel deja sin acceso a quienes la necesitan aunque nadie los agreda.',
        'La frase que se repite en el grupo, porque instala la idea de que pedir ayuda es exagerar y esa idea circula por todo el plantel.',
        'El empujón en la escalera, porque es la situación en la que hay una persona dañada y otra que provoca el daño de manera visible.',
        'Las tres por igual, porque cualquier hecho que ocurra dentro del plantel afecta la convivencia y termina dañando al mismo grupo.' ],
        en:[
        'The padlocked ramp, because the way the school is organized leaves without access those who need it, even though nobody attacks them.',
        'The phrase repeated in the class, because it installs the idea that asking for help is overreacting and that idea travels across the school.',
        'The shove on the stairs, because it is the situation where there is a person harmed and another who causes the harm visibly.',
        'All three equally, because anything that happens inside the school affects coexistence and ends up harming the same group.' ] },
      correct:0,
      hint:{ es:'Pregúntate cuál de las tres seguiría causando daño aunque ese día nadie tuviera la intención de dañar.',
             en:'Ask which of the three would keep causing harm even if nobody meant to harm anyone that day.' },
      explanation:{ es:'La violencia estructural no necesita a alguien que agreda: vive en cómo están organizados los espacios, los horarios y los accesos. La rampa con candado niega un derecho por la vía de la organización, y seguiría haciéndolo aunque el trato entre compañeros fuera excelente. El empujón es violencia directa y la frase repetida es violencia cultural, porque vuelve aceptable el daño.',
                    en:'Structural violence does not need anyone to attack: it lives in how spaces, schedules and access are organized. The padlocked ramp denies a right through organization, and would keep doing so even if the treatment among classmates were excellent. The shove is direct violence and the repeated phrase is cultural violence, because it makes the harm acceptable.' } },
    { title:{ es:'Lo que no se ve a simple vista', en:'What is not visible at first glance' }, showWork:false,
      stmt:{ es:'En una comunidad, las clases terminan cuando ya oscureció y el único camino de regreso no tiene alumbrado, así que varias familias dejaron de enviar a sus hijas. Además se repite que a las muchachas no les hace falta estudiar tanto, y el mes pasado un hombre acosó a dos estudiantes en ese camino. ¿Cuál de esas situaciones corresponde a la violencia estructural?',
             en:'In one community, classes end after dark and the only way home has no street lighting, so several families stopped sending their daughters. People also keep saying that girls do not need to study that much, and last month a man harassed two students on that road. Which of those situations is structural violence?' },
      options:{ es:[
        'El horario de salida junto con el camino sin alumbrado, porque la forma en que está organizado el servicio deja a un grupo sin poder seguir estudiando.',
        'La idea repetida de que a las muchachas no les hace falta estudiar, porque prepara el terreno para que nadie reclame lo que está ocurriendo.',
        'El acoso del mes pasado, porque hay una persona que ejerce el daño y otras que lo reciben en un momento que se puede identificar.',
        'Ninguna de las tres, porque la violencia estructural solo existe cuando una ley escrita prohíbe de manera expresa el acceso a un derecho.' ],
        en:[
        'The dismissal time together with the unlit road, because the way the service is organized leaves a group unable to continue studying.',
        'The repeated idea that girls do not need to study that much, because it prepares the ground for nobody to complain about what is happening.',
        'The harassment last month, because there is a person doing the harm and others receiving it at a moment that can be identified.',
        'None of the three, because structural violence exists only when a written law expressly forbids access to a right.' ] },
      correct:0,
      hint:{ es:'Busca cuál de las tres depende de una decisión de organización y no de la intención de una persona.',
             en:'Look for the one of the three that depends on an organizational decision and not on any person intention.' },
      explanation:{ es:'Nadie decidió excluir a las estudiantes, pero el horario y el camino sin luz producen ese resultado: el derecho a estudiar queda suspendido para un grupo. Eso es violencia estructural, y se corrige cambiando el horario, iluminando el camino o llevando transporte. El acoso es violencia directa y la frase repetida es violencia cultural, porque justifica que el abandono parezca natural.',
                    en:'Nobody decided to exclude the students, yet the schedule and the unlit road produce that result: the right to study is suspended for a group. That is structural violence, and it is corrected by changing the schedule, lighting the road or providing transport. The harassment is direct violence and the repeated phrase is cultural violence, because it makes the dropping out look natural.' } }
  ], rng), rng);

  /* ── CONCEPTO 2 ─────────────────────────────────────────────── */
  addSection(S('CONCEPTO 2','CONCEPT 2'),
    '<h2>' + S('De la reacción inmediata a la transformación','From the immediate reaction to transformation') + '</h2>' +
    '<p>' + S('Ante un hecho violento lo primero es detenerlo y poner a salvo a quien lo recibió. Después viene el registro ante la instancia que puede actuar, y la reparación acordada con la persona afectada. Hasta ahí se atendió el episodio. La transformación empieza en el paso siguiente: preguntar qué condición del entorno hizo posible ese hecho y cambiarla, con alguien responsable y una fecha para evaluar.',
              'Faced with a violent act, the first thing is to stop it and bring the person harmed to safety. Then comes the record filed with the body that can act, and the repair agreed with the person harmed. Up to there the episode has been handled. Transformation begins at the next step: asking which condition of the setting made that act possible and changing it, with someone responsible and a date to evaluate.') + '</p>' +
    '<p>' + S('Esa diferencia explica por qué algunos problemas se repiten aunque se sancionen una y otra vez. Sancionar cierra el expediente; transformar modifica lo que volvía probable el daño: un horario, un espacio sin acompañamiento, una regla de reparto injusta, un canal de reporte que nadie conoce. Resolver mira hacia el hecho; transformar mira hacia la relación y hacia la estructura que lo rodea.',
              'That difference explains why some problems repeat even when they are punished again and again. Punishing closes the file; transforming modifies what made the harm likely: a schedule, a space with no accompaniment, an unfair sharing rule, a reporting channel nobody knows about. Resolving looks at the act; transforming looks at the relationship and at the structure around it.') + '</p>' +
    buildRuta(rng));
  rutRender();

  /* ── PROBLEMA 3 ─────────────────────────────────────────────── */
  addProblem(pick([
    { title:{ es:'El primer paso que faltó', en:'The first step that was missing' }, showWork:false,
      stmt:{ es:'Tras una agresión en el receso, la escuela convocó de inmediato a una asamblea sobre valores. La persona agredida siguió sentada junto a quien la agredió, nadie registró lo ocurrido y no se le preguntó qué necesitaba. ¿Cuál es el error principal de esa respuesta?',
             en:'After an aggression at break, the school immediately called an assembly about values. The person attacked stayed seated next to the person who attacked them, nobody recorded what happened, and nobody asked what they needed. What is the main error in that response?' },
      options:{ es:[
        'Se saltó la protección inmediata y el registro del hecho, y una actividad formativa no sustituye poner a salvo a quien recibió el daño.',
        'La asamblea se convocó demasiado pronto, porque este tipo de actividades funciona mejor cuando el grupo ya dejó atrás el episodio.',
        'El error fue tratar el tema con todo el grupo, ya que estos hechos deben resolverse únicamente entre las familias de quienes participaron.',
        'Faltó anunciar la sanción antes de la asamblea, porque sin una consecuencia visible ninguna actividad formativa alcanza a tener efecto.' ],
        en:[
        'It skipped immediate protection and the record of the incident, and a teaching activity does not replace bringing the person harmed to safety.',
        'The assembly was called too soon, because this kind of activity works better once the class has left the episode behind.',
        'The error was addressing the matter with the whole class, since such incidents should be settled only between the families of those involved.',
        'The sanction should have been announced before the assembly, because without a visible consequence no teaching activity has any effect.' ] },
      correct:0,
      hint:{ es:'Ordena lo que una respuesta debe hacer primero: proteger, registrar, reparar, y solo después trabajar con el grupo.',
             en:'Put in order what a response must do first: protect, record, repair, and only then work with the class.' },
      explanation:{ es:'Una respuesta se sostiene si empieza por poner a salvo a la persona afectada y por dejar registro ante la instancia que puede actuar. La formación con el grupo es necesaria, pero llega después: sin protección ni registro, la asamblea deja a esa persona en la misma situación de riesgo y sin nada que permita dar seguimiento.',
                    en:'A response holds up if it begins by bringing the person harmed to safety and by leaving a record with the body that can act. Working with the class is necessary, but it comes later: with no protection and no record, the assembly leaves that person in the same risky situation and with nothing that allows follow up.' } },
    { title:{ es:'El primer paso que faltó', en:'The first step that was missing' }, showWork:false,
      stmt:{ es:'Al enterarse de una agresión, un comité escolar publicó en sus redes los nombres de las personas implicadas y pidió al grupo opinar sobre el caso. A la persona afectada nadie le preguntó si quería que su situación se hiciera pública. ¿Cuál es el error principal de esa respuesta?',
             en:'On learning of an aggression, a school committee posted on its social media the names of those involved and asked the class to give their opinion on the case. Nobody asked the person harmed whether they wanted their situation made public. What is the main error in that response?' },
      options:{ es:[
        'Expuso públicamente a la persona afectada sin su consentimiento, y eso agrega un daño nuevo en lugar de llevar el caso a quien puede atenderlo.',
        'Publicó demasiado tarde, porque una respuesta pierde fuerza cuando el grupo ya conoce los hechos por otras vías dentro del plantel.',
        'Pidió opinión al grupo, cuando lo correcto habría sido someter el caso a una votación abierta de todo el plantel para decidir la sanción.',
        'Nombró a las personas implicadas sin adjuntar las pruebas, que era lo único que le faltaba a la publicación para resultar adecuada.' ],
        en:[
        'It publicly exposed the person harmed without their consent, and that adds new harm instead of taking the case to whoever can handle it.',
        'It posted too late, because a response loses force once the class already knows the facts through other channels inside the school.',
        'It asked the class for an opinion, when the right move would have been to put the case to an open vote of the whole school to decide the sanction.',
        'It named those involved without attaching the evidence, which was the only thing the post was missing in order to be adequate.' ] },
      correct:0,
      hint:{ es:'Distingue entre hacer visible la violencia y volver a exponer a quien la recibió sin haberle preguntado nada.',
             en:'Tell apart making violence visible from exposing again the person who received it without having asked them anything.' },
      explanation:{ es:'Rechazar la violencia no autoriza a exponer a quien la recibió. Difundir nombres y abrir el caso a la opinión del grupo revictimiza y puede aumentar el riesgo. La ruta es preguntar a la persona afectada qué necesita, resguardar la información y llevar el hecho a la instancia con protocolo, que sí puede investigar y proteger.',
                    en:'Refusing violence does not authorize exposing the person who received it. Spreading names and opening the case to the opinion of the class revictimizes and can increase the risk. The route is to ask the person harmed what they need, safeguard the information and take the incident to the body with a protocol, which can indeed investigate and protect.' } }
  ], rng), rng);

  /* ── PROBLEMA 4 ─────────────────────────────────────────────── */
  addProblem(pick([
    { title:{ es:'Dos respuestas al mismo hecho', en:'Two responses to the same fact' }, showWork:false,
      stmt:{ es:'Dos escuelas registran el mismo problema: peleas repetidas siempre a la misma hora y en el mismo lugar. La primera sanciona a quienes participan y cierra cada caso. La segunda sanciona, y además revisa por qué ese lugar y esa hora concentran las peleas, cambia la organización del receso y fija una fecha para evaluar. ¿Qué distingue a la segunda respuesta?',
             en:'Two schools record the same problem: repeated fights always at the same hour and in the same place. The first one punishes those involved and closes each case. The second one punishes, and also reviews why that place and that hour concentrate the fights, changes how break time is organized and sets a date to evaluate. What sets the second response apart?' },
      options:{ es:[
        'Actúa sobre la condición que hace posible que el hecho se repita, además de atender el episodio, y deja una fecha para comprobar si el cambio funcionó.',
        'Aplica sanciones más severas que la primera escuela, y esa mayor severidad explica que en ella los mismos hechos dejen de repetirse.',
        'Sustituye la sanción por una revisión del entorno, de manera que el episodio concreto ya no requiere ninguna consecuencia para quienes participaron.',
        'Atiende cada caso con mayor rapidez, porque revisar la organización del receso acorta el tiempo que toma cerrar el expediente de cada pelea.' ],
        en:[
        'It acts on the condition that makes the fact repeat, as well as handling the episode, and it leaves a date to check whether the change worked.',
        'It applies harsher sanctions than the first school, and that greater harshness explains why the same facts stop repeating there.',
        'It replaces the sanction with a review of the setting, so the specific episode no longer requires any consequence for those involved.',
        'It handles each case faster, because reviewing how break time is organized shortens the time it takes to close the file on each fight.' ] },
      correct:0,
      hint:{ es:'Pregúntate qué queda distinto en cada escuela cuando el caso concreto ya se cerró.',
             en:'Ask what is left different in each school once the specific case is already closed.' },
      explanation:{ es:'Resolver el episodio detiene el daño de hoy; transformar el conflicto cambia lo que lo hacía probable. La segunda escuela hace las dos cosas: atiende el caso y modifica la condición que lo repetía, con una evaluación en el calendario. La sanción por sí sola deja el entorno intacto, y por eso el mismo hecho regresa.',
                    en:'Resolving the episode stops the harm of today; transforming the conflict changes what made it likely. The second school does both: it handles the case and modifies the condition that kept repeating it, with an evaluation on the calendar. The sanction alone leaves the setting untouched, and that is why the same fact comes back.' } },
    { title:{ es:'Dos respuestas al mismo hecho', en:'Two responses to the same fact' }, showWork:false,
      stmt:{ es:'En un barrio hay pleitos cada semana en la toma de agua. Una parte de los vecinos llama a la patrulla cada vez que ocurre. Otra parte propone acordar turnos por calle, escribirlos en una lista visible, nombrar responsables y revisar el acuerdo al final del mes. ¿Qué distingue a la segunda respuesta?',
             en:'In a neighborhood there are fights every week at the water tap. Some residents call the patrol every time it happens. Others propose agreeing on turns by street, writing them on a visible list, naming people in charge and reviewing the agreement at the end of the month. What sets the second response apart?' },
      options:{ es:[
        'Modifica la regla de reparto que originaba los pleitos y deja responsables y una revisión, de modo que el cambio no depende de que alguien intervenga cada semana.',
        'Evita por completo la intervención de cualquier autoridad, y esa ausencia es la razón por la que los conflictos por el agua terminan desapareciendo.',
        'Atiende a más personas en cada episodio, porque una lista de turnos alcanza a más vecinos de los que puede atender una patrulla en el lugar.',
        'Resuelve el pleito del día con mayor rapidez, ya que acordar turnos toma menos tiempo que esperar a que la patrulla llegue a la toma de agua.' ],
        en:[
        'It modifies the sharing rule that caused the fights and leaves people in charge plus a review, so the change does not depend on someone stepping in every week.',
        'It completely avoids the intervention of any authority, and that absence is the reason the water conflicts end up disappearing.',
        'It serves more people in each episode, because a list of turns reaches more residents than a patrol at the site can attend to.',
        'It settles the fight of the day faster, since agreeing on turns takes less time than waiting for the patrol to arrive at the water tap.' ] },
      correct:0,
      hint:{ es:'Fíjate en cuál de las dos respuestas sigue funcionando el día en que nadie de fuera acude al lugar.',
             en:'Look at which of the two responses keeps working on a day when nobody from outside comes to the site.' },
      explanation:{ es:'Llamar a la patrulla detiene el pleito de esa semana y deja la causa intacta: no existe una regla clara de reparto. Acordar turnos escritos, con responsables y una revisión al final del mes, cambia esa causa y reparte la responsabilidad de sostenerla. Eso es transformar el conflicto, no solo contenerlo.',
                    en:'Calling the patrol stops the fight of that week and leaves the cause untouched: there is no clear sharing rule. Agreeing on written turns, with people in charge and a review at the end of the month, changes that cause and shares out the responsibility of sustaining it. That is transforming the conflict, not just containing it.' } }
  ], rng), rng);

  /* ── CONCEPTO 3 ─────────────────────────────────────────────── */
  addSection(S('CONCEPTO 3','CONCEPT 3'),
    '<h2>' + S('Rechazar y denunciar sin causar más daño','Refusing and reporting without causing more harm') + '</h2>' +
    '<p>' + S('Rechazar la violencia es negarse a que se vuelva normal: no reírse, no reenviar, no repetir el rumor, no dejar sola a la persona afectada. Denunciar es llevar el hecho, con su registro, a quien tiene la obligación y la facultad de actuar. Las dos cosas cuidan a quien recibió el daño solo si se hacen sin exponerla.',
              'Refusing violence means refusing to let it become normal: not laughing, not forwarding, not repeating the rumor, not leaving the person harmed alone. Reporting means taking the incident, with its record, to whoever has the duty and the power to act. Both things protect the person harmed only if they are done without exposing them.') + '</p>' +
    '<p>' + S('Difundir nombres, imágenes o detalles convierte la denuncia en un daño nuevo y suele aumentar el riesgo de quien ya fue agredido. Confidencialidad no significa silencio: significa que la información llega solo a quien puede proteger. Y cada caso tiene su vía, según quién puede actuar y qué necesita la persona afectada.',
              'Spreading names, images or details turns the report into new harm and usually increases the risk for whoever was already attacked. Confidentiality does not mean silence: it means the information reaches only whoever can protect. And each case has its route, depending on who can act and what the person harmed needs.') + '</p>' +
    '<div class="rules-grid">' +
      '<div class="rcard"><div class="rname">' + S('Mediación','Mediation') + '</div><div class="rform">' + S('¿hay igualdad entre las partes?','are the parties equals?') + '</div><div class="rnote">' + S('Las dos quieren acordar y nadie decide por ellas.','Both want to agree and nobody decides for them.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Protocolo','Protocol') + '</div><div class="rform">' + S('¿hay hostigamiento o abuso?','is there harassment or abuse?') + '</div><div class="rnote">' + S('La instancia investiga y protege, no negocia.','The body investigates and protects, it does not negotiate.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Canal confidencial','Confidential channel') + '</div><div class="rform">' + S('¿teme quedar expuesta?','do they fear exposure?') + '</div><div class="rnote">' + S('El reporte llega sin que circule el nombre.','The report arrives without the name circulating.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Organismo público','Public body') + '</div><div class="rform">' + S('¿quién incumple es autoridad?','is an authority failing its duty?') + '</div><div class="rnote">' + S('Investiga a la autoridad y emite recomendaciones.','It investigates the authority and issues recommendations.') + '</div></div>' +
    '</div>' +
    buildVias(rng));
  viaRender();

  addProblem(pick([
    { title:{ es:'Rechazar sin exponer', en:'Refusing without exposing' }, showWork:false,
      stmt:{ es:'En el chat del salón empieza a circular el video de una agresión ocurrida en la escuela. Varias personas lo reenvían y otras comentan burlas. ¿Cuál es la primera acción que rechaza la violencia sin causar más daño?',
             en:'In the class chat, a video of an aggression that happened at school starts circulating. Several people forward it and others post mocking comments. What is the first action that refuses the violence without causing more harm?' },
      options:{ es:[
        'No reenviarlo, conservar el registro de dónde apareció y llevarlo a la instancia con protocolo, preguntando antes a la persona afectada qué necesita.',
        'Reenviarlo a la mayor cantidad de personas posible para que todo el plantel vea con claridad quién fue el responsable de la agresión.',
        'Responder en el chat con insultos a quien aparece agrediendo, para que el grupo entienda que esa conducta no se acepta entre compañeros.',
        'Salir del chat y borrar el video del teléfono, de modo que nadie pueda relacionarte con lo que se está compartiendo en ese grupo.' ],
        en:[
        'Not forwarding it, keeping the record of where it appeared and taking it to the body with a protocol, first asking the person harmed what they need.',
        'Forwarding it to as many people as possible so the whole school can clearly see who was responsible for the aggression.',
        'Replying in the chat with insults to whoever appears attacking, so the class understands that such conduct is not accepted among classmates.',
        'Leaving the chat and deleting the video from your phone, so nobody can connect you with what is being shared in that group.' ] },
      correct:0,
      hint:{ es:'Distingue entre hacer visible la agresión y volver a exponer a quien la recibió, y piensa qué queda como prueba.',
             en:'Tell apart making the aggression visible from exposing again the person who received it, and think about what is left as evidence.' },
      explanation:{ es:'Reenviar el video multiplica el daño sobre la persona agredida, aunque la intención sea denunciar. Responder con insultos escala el conflicto y agrega otra agresión. Borrar todo elimina la prueba que permitiría investigar. Rechazar sin causar más daño es cortar la circulación, resguardar el registro para quien puede actuar y decidir con la persona afectada, no sobre ella.',
                    en:'Forwarding the video multiplies the harm to the person attacked, even if the intention is to report it. Replying with insults escalates the conflict and adds another aggression. Deleting everything removes the evidence that would allow an investigation. Refusing without causing more harm means cutting the circulation, safeguarding the record for whoever can act, and deciding with the person harmed, not about them.' } },
    { title:{ es:'Rechazar sin exponer', en:'Refusing without exposing' }, showWork:false,
      stmt:{ es:'Una compañera te cuenta que recibe amenazas en línea desde hace semanas y te pide que no le digas a nadie, porque teme que la culpen a ella. ¿Cuál es la primera acción que rechaza la violencia sin causar más daño?',
             en:'A classmate tells you she has been receiving online threats for weeks and asks you not to tell anyone, because she fears she will be blamed. What is the first action that refuses the violence without causing more harm?' },
      options:{ es:[
        'Acompañarla a una persona adulta o instancia que pueda protegerla, cuidando que la información no circule fuera de ese espacio.',
        'Guardar el secreto sin hacer nada más, porque respetar al pie de la letra lo que ella pidió es la única forma de no aumentar su miedo.',
        'Publicar las capturas de las amenazas en el chat del grupo para que quien la amenaza sepa que ya quedó identificado por todos.',
        'Escribirle directamente a quien la amenaza para exigirle que se detenga, antes de involucrar a cualquier otra persona en el asunto.' ],
        en:[
        'Going with her to an adult or a body that can protect her, making sure the information does not circulate outside that space.',
        'Keeping the secret and doing nothing else, because respecting to the letter what she asked is the only way not to increase her fear.',
        'Posting the screenshots of the threats in the class chat so whoever threatens her knows that everyone has identified them.',
        'Writing directly to whoever threatens her to demand that they stop, before involving any other person in the matter.' ] },
      correct:0,
      hint:{ es:'Piensa en la diferencia entre guardar confidencialidad y quedarse en silencio cuando hay un riesgo que crece.',
             en:'Think about the difference between keeping confidentiality and staying silent when there is a growing risk.' },
      explanation:{ es:'Confidencialidad no es silencio: significa que la información llega solo a quien puede proteger. Callar la deja sola frente a un riesgo que crece; publicar las capturas la expone y puede provocar represalias; confrontar por tu cuenta escala el peligro y te coloca en él. Acompañarla respeta su voz y activa la protección que ella sola no puede activar.',
                    en:'Confidentiality is not silence: it means the information reaches only whoever can protect. Staying quiet leaves her alone facing a growing risk; posting the screenshots exposes her and may trigger reprisals; confronting on your own escalates the danger and puts you in it. Going with her respects her voice and activates the protection she cannot activate alone.' } }
  ], rng), rng);

  addProblem(pick([
    { title:{ es:'La vía que corresponde', en:'The route that fits' }, showWork:false,
      stmt:{ es:'Una comunidad lleva un año sin que el servicio de agua llegue a sus calles, mientras sí llega a las colonias vecinas del mismo municipio. El comité ya presentó escritos a la autoridad local y no obtuvo respuesta. ¿Cuál es la vía que corresponde al siguiente paso?',
             en:'A community has gone a year without the water service reaching its streets, while it does reach the neighboring areas of the same town. The committee has already filed letters with the local authority and got no answer. Which route fits the next step?' },
      options:{ es:[
        'Presentar una queja ante un organismo público de derechos humanos, que puede investigar a la autoridad y emitir una recomendación.',
        'Organizar una mediación entre las familias de la comunidad para acordar cómo repartirse el agua que logren conseguir por su cuenta.',
        'Publicar los nombres y domicilios de los funcionarios en redes sociales hasta que alguno de ellos responda a los escritos presentados.',
        'Esperar al siguiente cambio de gobierno municipal y volver a presentar el mismo escrito acompañado de más firmas de vecinos.' ],
        en:[
        'Filing a complaint with a public human rights body, which can investigate the authority and issue a recommendation.',
        'Organizing a mediation among the families of the community to agree on how to share the water they manage to get on their own.',
        'Posting the names and home addresses of the officials on social media until one of them answers the letters that were filed.',
        'Waiting for the next change of town government and filing the same letter again, this time with more resident signatures.' ] },
      correct:0,

             en:'First identify who has failed a duty, and then which body can review that authority.' },
      explanation:{ es:'El problema no está entre vecinos, así que una mediación entre ellos no toca la causa. Quien incumple es una autoridad, y existe una instancia pública que puede investigarla y emitir recomendaciones. Exhibir domicilios agrega un riesgo y no obliga a nadie, y esperar sin actuar deja el derecho suspendido otro año.',
                    en:'The problem is not between neighbors, so a mediation among them does not touch the cause. The one failing a duty is an authority, and there is a public body that can investigate it and issue recommendations. Publishing home addresses adds risk and compels nobody, and waiting without acting leaves the right suspended for another year.' } },
    { title:{ es:'La vía que corresponde', en:'The route that fits' }, showWork:false,
      stmt:{ es:'Un grupo estudiantil logró reducir las agresiones en su escuela y quiere que su experiencia sirva en planteles de otros estados y de otros países. ¿Cuál es la vía que corresponde a esa escala?',
             en:'A student group managed to reduce aggressions in its school and wants its experience to be useful in schools in other states and other countries. Which route fits that scale?' },
      options:{ es:[
        'Sumarse a una red juvenil que intercambia experiencias evaluadas, para compartir lo que midieron y adaptarlo al diagnóstico de cada plantel.',
        'Enviar su reglamento interno a otras escuelas con la indicación de aplicarlo tal cual, ya que en su plantel demostró funcionar bien.',
        'Solicitar que su campaña se declare obligatoria en todo el país antes de que otros grupos hayan podido ponerla a prueba en sus escuelas.',
        'Concentrar el trabajo en su propio plantel, porque una estrategia de convivencia pierde todo sentido fuera del lugar donde nació.' ],
        en:[
        'Joining a youth network that exchanges evaluated experiences, to share what they measured and adapt it to the diagnosis of each school.',
        'Sending its internal rules to other schools with the instruction to apply them as they are, since they proved to work well in its own school.',
        'Requesting that its campaign be declared mandatory across the country before other groups have been able to test it in their schools.',
        'Concentrating the work on its own school, because a coexistence strategy loses all meaning outside the place where it was born.' ] },
      correct:0,
      hint:{ es:'Piensa qué se puede compartir entre contextos distintos: los resultados medidos, o la copia exacta de las medidas.',
             en:'Think about what can be shared between different contexts: the measured results, or an exact copy of the measures.' },
      explanation:{ es:'Colaborar a mayor escala funciona cuando se intercambia lo aprendido y lo medido, y cada comunidad lo adapta a su propio diagnóstico. Copiar un reglamento ignora las causas particulares de cada plantel, y volver obligatoria una campaña sin evaluación impone algo no probado. Encerrarse en el propio plantel desaprovecha lo que ya funcionó.',
                    en:'Collaborating at a larger scale works when what is exchanged is what was learned and measured, and each community adapts it to its own diagnosis. Copying a set of rules ignores the particular causes of each school, and making a campaign mandatory without evaluation imposes something untested. Staying inside your own school wastes what already worked.' } }
  ], rng), rng);

  addSection(S('CONCEPTO 4','CONCEPT 4'),
    '<h2>' + S('Gestionar una estrategia, no organizar un evento','Managing a strategy, not organizing an event') + '</h2>' +
    '<p>' + S('Gestionar significa hacerse cargo del proceso completo. Empieza por un diagnóstico con datos propios: qué ocurre, dónde, cuándo y a quiénes. Sigue con un objetivo que pueda comprobarse al final del ciclo, con acciones dirigidas a la causa que el diagnóstico señaló y con aliados que comparten el problema y aportan recursos.',
              'Managing means taking charge of the whole process. It starts with a diagnosis built on your own data: what happens, where, when and to whom. It continues with an objective that can be checked at the end of the year, with actions aimed at the cause the diagnosis pointed to, and with allies who share the problem and contribute resources.') + '</p>' +
    '<p>' + S('Falta lo que casi siempre se olvida: el indicador. Un indicador mide el resultado prometido y se compara con un punto de partida. Contar carteles o personas asistentes mide el esfuerzo, no el efecto. Al final se evalúa con honestidad, se conserva lo que funcionó, se ajusta lo que no y se decide quién lo sostiene el próximo ciclo.',
              'What almost always gets forgotten is still missing: the indicator. An indicator measures the promised result and is compared with a starting point. Counting posters or attendees measures the effort, not the effect. At the end you evaluate honestly, keep what worked, adjust what did not, and decide who sustains it next year.') + '</p>' +
    '<div class="rules-grid">' +
      '<div class="rcard"><div class="rname">' + S('Diagnóstico','Diagnosis') + '</div><div class="rform">' + S('¿qué, dónde y cuándo?','what, where and when?') + '</div><div class="rnote">' + S('Datos propios antes de decidir la acción.','Your own data before deciding the action.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Objetivo','Objective') + '</div><div class="rform">' + S('¿qué se promete lograr?','what is promised?') + '</div><div class="rnote">' + S('Algo comprobable al terminar el ciclo.','Something checkable when the year ends.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Aliados','Allies') + '</div><div class="rform">' + S('¿quién comparte el problema?','who shares the problem?') + '</div><div class="rnote">' + S('Quienes aportan recursos y sostienen la acción.','Those who bring resources and sustain the action.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Indicador','Indicator') + '</div><div class="rform">' + S('¿con qué dato se comprueba?','which figure proves it?') + '</div><div class="rnote">' + S('Un dato comparable con el punto de partida.','A figure comparable with the starting point.') + '</div></div>' +
    '</div>' +
    buildEstrategia(rng));

  addProblem(pick([
    { title:{ es:'La acción que toca la causa', en:'The action that hits the cause' }, showWork:false,
      stmt:{ es:'El registro de un ciclo muestra que casi todos los incidentes de una secundaria ocurren en el corredor trasero durante el receso, un espacio sin luz, sin actividades y por donde no pasa ninguna persona adulta. El comité debe elegir una acción para el ciclo que viene. ¿Cuál se dirige a la causa que muestra el registro?',
