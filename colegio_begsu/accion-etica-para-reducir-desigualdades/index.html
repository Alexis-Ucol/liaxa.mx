      FL.msg = { es:'Encontraste ' + hit + ' de ' + tot + ' señales' + (extra ? ' y marcaste ' + extra + ' decisión que en realidad cuidaba el proyecto.' : '. Todavía falta alguna.') + ' Ajusta y vuelve a revisar.',
                 en:'You found ' + hit + ' of ' + tot + ' signals' + (extra ? ' and marked ' + extra + ' decision that actually protected the project.' : '. One is still missing.') + ' Adjust and check again.' };
    }
  }
  flRender();
}
function flClear(){
  if (!FL || FL.done) return;
  FL.sel = []; FL.cls = '';
  FL.msg = { es:'Filtro limpio. Lee otra vez el proyecto y busca dónde queda fuera la comunidad.',
             en:'Clean filter. Read the project again and look for where the community is left out.' };
  flRender();
}

/* ================================================
   buildLesson — concept, manipulative and graded problem, interleaved (Rule 1)
   ================================================ */
function buildLesson(rng) {
  problems = []; answeredCount = 0; correctCount = 0;
  document.getElementById('lessonBody').innerHTML = '';

  /* ── CONCEPTO 1 ─────────────────────────────────────────────── */
  addSection(S('CONCEPTO 1','CONCEPT 1'),
    '<h2>' + S('Ser distintos no es lo mismo que vivir desigual','Being different is not the same as living unequally') + '</h2>' +
    '<p>' + S('Las personas somos distintas en muchas cosas: la lengua que hablamos en casa, la edad, la estatura, la música que nos gusta, el lugar donde nacimos. Ninguna de esas diferencias, por sí sola, decide si alguien podrá terminar la secundaria, beber agua limpia o llegar a una consulta médica. La desigualdad aparece en otro momento: cuando la forma en que está organizada la vida social convierte una diferencia en menos acceso a derechos y servicios.',
              'People are different in many things: the language we speak at home, age, height, the music we like, the place where we were born. None of those differences, on its own, decides whether somebody will finish secondary school, drink clean water or reach a medical appointment. Inequality appears at another moment: when the way social life is organized turns a difference into less access to rights and services.') + '</p>' +
    '<p>' + S('Por eso conviene distinguir tres palabras. Una diferencia es un rasgo. Una desigualdad es una distancia en el acceso a bienes y oportunidades. Y una inequidad es esa distancia cuando además resulta injusta y evitable, porque depende de decisiones humanas que podrían tomarse de otro modo. Que dos comunidades tengan distinta lengua es una diferencia; que una tenga clínica y la otra no, es una desigualdad; que nadie haya construido esa clínica en veinte años pese a haberla pedido, es una inequidad.',
              'That is why it helps to separate three words. A difference is a trait. An inequality is a distance in access to goods and opportunities. And an inequity is that distance when it is also unjust and avoidable, because it depends on human decisions that could be taken differently. That two communities speak different languages is a difference; that one has a clinic and the other does not, is an inequality; that nobody has built that clinic in twenty years despite requests, is an inequity.') + '</p>' +
    '<p>' + S('La calidad de vida es lo que esas distancias afectan. No se mide con un solo dato ni se reduce al dinero que entra a una casa: es el conjunto de condiciones que permiten a una persona vivir con dignidad y decidir sobre su propia vida. Agua, alimentación, salud, escuela, vivienda segura, transporte, información, espacios públicos donde se pueda estar sin miedo y tiempo para descansar y participar.',
              'Quality of life is what those distances affect. It is not measured with a single figure and is not reduced to the money entering a home: it is the set of conditions that allow a person to live with dignity and decide about their own life. Water, food, health, school, safe housing, transport, information, public spaces where one can be without fear, and time to rest and take part.') + '</p>' +
    '<div class="rules-grid">' +
      '<div class="rcard"><div class="rname">' + S('Diferencia','Difference') + '</div><div class="rform">' + S('un rasgo','a trait') + '</div><div class="rnote">' + S('Existe sin producir ventaja ni desventaja.','It exists without producing advantage or disadvantage.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Desigualdad','Inequality') + '</div><div class="rform">' + S('una distancia','a distance') + '</div><div class="rnote">' + S('Unos acceden a un derecho y otros no.','Some reach a right and others do not.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Inequidad','Inequity') + '</div><div class="rform">' + S('injusta y evitable','unjust and avoidable') + '</div><div class="rnote">' + S('Depende de decisiones que podrían cambiar.','It depends on decisions that could change.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Calidad de vida','Quality of life') + '</div><div class="rform">' + S('un conjunto','a whole set') + '</div><div class="rnote">' + S('Varias condiciones juntas, no un solo dato.','Several conditions together, not one figure.') + '</div></div>' +
    '</div>' +
    buildTablero(rng));
  cvRender();

  /* ── PROBLEMA 1 ─────────────────────────────────────────────── */
  addProblem(pick([
    { title:{ es:'Diferencia o desigualdad', en:'Difference or inequality' },
      stmt:{ es:'En un mismo municipio ocurren cuatro situaciones: en una comunidad se habla una lengua originaria y en la cabecera se habla español; a unas personas les gusta el futbol y a otras la música; las niñas de una localidad dejan la escuela antes que los niños porque la secundaria queda a dos horas y el camino no es seguro para ellas; y en la escuela hay estudiantes de distintas estaturas. ¿Cuál de las cuatro es una desigualdad y no solamente una diferencia?',
             en:'Four situations happen in the same town: in one community an original language is spoken and in the town center Spanish is spoken; some people like football and others like music; the girls of one locality leave school earlier than the boys because the secondary school is two hours away and the road is not safe for them; and at school there are students of different heights. Which of the four is an inequality and not only a difference?' },
      options:{ es:[
        'La de las niñas que dejan la escuela, porque una condición social evitable les cierra el acceso a un derecho que otros sí ejercen.',
        'La de las lenguas que se hablan, porque quienes hablan una lengua originaria entienden el mundo de una manera propia y distinta.',
        'La de los gustos por el futbol o la música, porque marca grupos separados dentro de la convivencia diaria de la escuela.',
        'La de las estaturas del grupo, porque establece una distancia física visible entre las personas que conviven en el aula.' ],
        en:[
        'The girls leaving school, because an avoidable social condition closes their access to a right that others do exercise.',
        'The languages spoken, because those who speak an original language understand the world in their own distinct way.',
        'The taste for football or music, because it marks separate groups inside the daily life of the school.',
        'The heights in the group, because it sets a visible physical distance among the people sharing the classroom.' ] },
      correct:0,
      hint:{ es:'Pregúntate en cuál de los cuatro casos alguien deja de ejercer un derecho por una causa que podría cambiarse.',
             en:'Ask in which of the four cases somebody stops exercising a right for a cause that could be changed.' },
      explanation:{ es:'La lengua, el gusto y la estatura son diferencias: existen sin quitar ni dar acceso a nada. En cambio, dejar la escuela por la distancia y por un camino inseguro significa que un derecho queda fuera del alcance de un grupo por una condición social que podría resolverse con transporte y con seguridad en el trayecto. Esa distancia en el acceso es lo que llamamos desigualdad.',
                    en:'Language, taste and height are differences: they exist without taking away or giving access to anything. Leaving school because of distance and an unsafe road means instead that a right stays out of reach for one group because of a social condition that could be solved with transport and safety along the way. That distance in access is what we call inequality.' } },
    { title:{ es:'Cuando lo natural explica poco', en:'When the natural explains little' },
      stmt:{ es:'Durante un debate en clase alguien sostiene que la desigualdad es natural, porque todas las personas somos distintas y siempre lo hemos sido. ¿Cuál respuesta corrige mejor esa afirmación?',
             en:'During a class debate somebody argues that inequality is natural, because all people are different and always have been. Which answer best corrects that claim?' },
      options:{ es:[
        'Las diferencias no producen por sí mismas ventajas ni desventajas: la desigualdad aparece cuando la organización social convierte una diferencia en menos acceso a derechos, y eso puede cambiarse.',
        'La afirmación es correcta, porque en todas las sociedades conocidas han existido personas con más recursos y personas con menos recursos disponibles.',
        'La afirmación es correcta, porque las capacidades de cada persona son distintas desde el nacimiento y explican los resultados que obtiene después.',
        'Las diferencias son en realidad menores de lo que parecen, y por eso la desigualdad que observamos entre las personas suele estar exagerada.' ],
        en:[
        'Differences do not produce advantages or disadvantages by themselves: inequality appears when social organization turns a difference into less access to rights, and that can be changed.',
        'The claim is correct, because in every known society there have been people with more resources and people with fewer resources available.',
        'The claim is correct, because the capacities of each person differ from birth and explain the results they obtain afterwards.',
        'Differences are actually smaller than they seem, and that is why the inequality we observe among people is usually exaggerated.' ] },
      correct:0,
      hint:{ es:'Distingue el rasgo que una persona tiene de la forma en que la vida social reparte el acceso a los derechos.',
             en:'Separate the trait a person has from the way social life distributes access to rights.' },
      explanation:{ es:'Llamar natural a la desigualdad la vuelve intocable, y ese es el problema del argumento. Ser distintos es un hecho; que unas personas tengan clínica, escuela y agua y otras no, es el resultado de decisiones sobre dónde se construye, a quién se informa y a quién se atiende. Las otras respuestas confunden la permanencia histórica de un fenómeno o las capacidades individuales con una causa natural.',
                    en:'Calling inequality natural makes it untouchable, and that is the problem with the argument. Being different is a fact; that some people have a clinic, a school and water while others do not is the result of decisions about where things are built, who is informed and who is served. The other answers confuse the historical permanence of a phenomenon or individual capacities with a natural cause.' } }
  ], rng), rng);

  /* ── PROBLEMA 2 ─────────────────────────────────────────────── */
  addProblem(pick([
    { title:{ es:'Medir la vida con un solo dato', en:'Measuring life with a single figure' },
      stmt:{ es:'Una autoridad afirma que la calidad de vida de una comunidad es equivalente a la de la cabecera municipal, porque las familias reciben ingresos parecidos. En la comunidad no hay red de agua potable, el centro de salud más cercano está a tres horas y la secundaria funciona con un solo maestro para todos los grados. ¿Por qué esa conclusión es incorrecta?',
             en:'An authority states that the quality of life of a community is equivalent to that of the town center, because families receive similar income. The community has no drinking water network, the closest health center is three hours away and the secondary school runs with a single teacher for all grades. Why is that conclusion incorrect?' },
      options:{ es:[
        'Porque la calidad de vida es el conjunto de condiciones que permiten vivir con dignidad, y varias de ellas están ausentes aunque el ingreso sea parecido.',
        'Porque el ingreso de las familias de la comunidad cambia mucho de un mes a otro y por eso no puede compararse con el de la cabecera municipal.',
        'Porque la cabecera municipal concentra más habitantes y sus servicios siempre resultan más caros de sostener que los de una comunidad pequeña.',
        'Porque nadie ha preguntado a las familias de la comunidad si se sienten satisfechas con la vida que llevan actualmente en ese lugar.' ],
        en:[
        'Because quality of life is the set of conditions that allow a dignified life, and several of them are absent even if income is similar.',
        'Because the income of the families in the community changes a lot from month to month and therefore cannot be compared with that of the town center.',
        'Because the town center concentrates more inhabitants and its services are always more expensive to sustain than those of a small community.',
        'Because nobody has asked the families of the community whether they feel satisfied with the life they currently lead in that place.' ] },
      correct:0,
      hint:{ es:'Revisa cuántas condiciones distintas aparecen en el caso y cuántas mira la conclusión de la autoridad.',
             en:'Check how many different conditions appear in the case and how many the conclusion of the authority looks at.' },
      explanation:{ es:'El ingreso es una condición entre varias, y por sí solo no dice nada sobre agua, salud o escuela. En el caso faltan tres condiciones básicas al mismo tiempo, y cada una limita a las demás: sin agua se enferman más, sin clínica cercana la enfermedad avanza y sin docentes suficientes la escuela no sostiene la trayectoria. Las otras opciones desplazan la discusión hacia la variabilidad del ingreso, el tamaño de la localidad o la percepción personal.',
                    en:'Income is one condition among several, and on its own it says nothing about water, health or school. In the case three basic conditions are missing at the same time, and each one limits the others: without water people get sick more often, without a nearby clinic illness advances and without enough teachers the school does not sustain the trajectory. The other options move the discussion toward income variability, the size of the locality or personal perception.' } },
    { title:{ es:'El tiempo también es calidad de vida', en:'Time is also quality of life' },
      stmt:{ es:'En dos hogares entra el mismo ingreso mensual. En el primero, el agua llega por la red a la vivienda. En el segundo, dos integrantes de la familia dedican cuatro horas diarias a acarrear agua desde un pozo. ¿Qué muestra esta comparación sobre la calidad de vida?',
             en:'Two households receive the same monthly income. In the first one, water reaches the home through the network. In the second one, two members of the family spend four hours a day carrying water from a well. What does this comparison show about quality of life?' },
      options:{ es:[
        'Que con el mismo ingreso la calidad de vida puede ser muy distinta, porque el tiempo y la salud que exige suplir un servicio ausente también son condiciones de vida.',
        'Que el segundo hogar necesita organizarse mejor para repartir las tareas domésticas entre todos sus integrantes durante la semana.',
        'Que el ingreso mensual resulta insuficiente en ambos hogares y por eso ninguno alcanza una calidad de vida aceptable en ese lugar.',
        'Que acarrear agua es una costumbre del lugar y las familias la mantienen aunque exista la posibilidad de conectarse a la red.' ],
        en:[
        'That with the same income quality of life can be very different, because the time and health demanded by replacing an absent service are also living conditions.',
        'That the second household needs to organize better in order to share the domestic tasks among all its members during the week.',
        'That the monthly income is insufficient in both households and therefore neither reaches an acceptable quality of life in that place.',
        'That carrying water is a local custom and families keep it even when the possibility of connecting to the network exists.' ] },
      correct:0,
      hint:{ es:'Pregúntate qué pierden las personas del segundo hogar en esas cuatro horas diarias.',
             en:'Ask what the people of the second household lose in those four hours a day.' },
      explanation:{ es:'Cuando un servicio falta, alguien lo suple con su propio cuerpo y su propio tiempo. Esas cuatro horas diarias salen del estudio, del descanso, del trabajo remunerado y de la participación, y el esfuerzo repetido afecta la salud. Por eso dos hogares con el mismo ingreso pueden tener calidad de vida muy distinta. Las otras opciones convierten una carencia de servicio en un asunto de organización familiar, de ingreso o de costumbre.',
                    en:'When a service is missing, somebody replaces it with their own body and their own time. Those four hours a day come out of study, rest, paid work and participation, and the repeated effort affects health. That is why two households with the same income can have very different quality of life. The other options turn a missing service into a matter of family organization, income or custom.' } }
  ], rng), rng);

  /* ── CONCEPTO 2 ─────────────────────────────────────────────── */
  addSection(S('CONCEPTO 2','CONCEPT 2'),
    '<h2>' + S('La desigualdad se hereda, se acumula y se cruza','Inequality is inherited, accumulates and overlaps') + '</h2>' +
    '<p>' + S('Una desigualdad estructural no es una mala racha ni una suma de decisiones personales desafortunadas. Se llama estructural porque está inscrita en la forma en que se reparten los servicios, las decisiones y la información: dónde se construye una escuela, en qué lengua se publica una convocatoria, qué camino se pavimenta primero. Quien nace en el lugar equivocado de ese reparto recibe una desventaja que no eligió y que se acumula año con año.',
              'A structural inequality is not a bad streak or a sum of unfortunate personal decisions. It is called structural because it is inscribed in the way services, decisions and information are distributed: where a school is built, in which language a call is published, which road is paved first. Whoever is born in the wrong place of that distribution receives a disadvantage they did not choose and that accumulates year after year.') + '</p>' +
    '<p>' + S('En México y en América Latina esa desventaja se concentra en pueblos y comunidades que han sido vulnerados de forma sostenida: pueblos indígenas, comunidades afrodescendientes, familias jornaleras que se trasladan con las cosechas, localidades rurales alejadas y personas con discapacidad. No son grupos débiles por naturaleza: son grupos a los que la organización social ha negado durante mucho tiempo servicios, información y voz en las decisiones que les afectan.',
              'In Mexico and in Latin America that disadvantage concentrates in peoples and communities that have been harmed in a sustained way: indigenous peoples, communities of African descent, farm worker families that move with the harvests, distant rural localities and persons with disabilities. They are not weak groups by nature: they are groups to which social organization has denied services, information and a voice in the decisions affecting them for a long time.') + '</p>' +
    '<p>' + S('Además, las desventajas se cruzan. Vivir lejos pesa; hablar una lengua distinta a la de los trámites pesa; usar silla de ruedas donde no hay rampa pesa. Cuando esas condiciones coinciden en una misma persona, no se suman de manera simple: se multiplican, porque cada una cierra las salidas que la otra dejaba abiertas. Reconocer ese cruce es lo que permite diseñar una respuesta que sirva de verdad.',
              'Besides, disadvantages overlap. Living far away weighs; speaking a language different from the one used in paperwork weighs; using a wheelchair where there is no ramp weighs. When those conditions meet in the same person they do not add up simply: they multiply, because each one closes the exits the other left open. Recognizing that overlap is what allows designing a response that truly works.') + '</p>' +
    '<div class="callout"><p><strong>' + S('Pueblos vulnerados: ','Harmed peoples: ') + '</strong>' +
      S('comunidades cuyos derechos han sido negados de forma sostenida por la manera en que se organizaron el acceso a los servicios y la participación en las decisiones. Nombrarlas así recuerda que se trata de un daño causado, no de una condición propia de esas comunidades.',
        'communities whose rights have been denied in a sustained way by how access to services and participation in decisions were organized. Naming them this way recalls that this is a caused harm, not a condition of those communities themselves.') + '</p></div>' +
    buildCadena(rng));
  chRender();

  /* ── PROBLEMA 3 ─────────────────────────────────────────────── */
  addProblem(pick([
    { title:{ es:'Esfuerzo y punto de partida', en:'Effort and starting point' },
      stmt:{ es:'Dos estudiantes terminan la secundaria con calificaciones muy parecidas. Uno vive en la cabecera, donde hay bachillerato, internet y biblioteca. La otra vive en una comunidad donde el bachillerato más cercano está a dos horas y el pasaje diario cuesta casi lo que gana su familia en un día. Tres años después, solo uno de los dos continúa estudiando. Un compañero concluye que ella se esforzó menos. ¿Qué muestra en realidad el caso?',
             en:'Two students finish secondary school with very similar grades. One lives in the town center, where there is a high school, internet and a library. The other lives in a community where the closest high school is two hours away and the daily fare costs almost what her family earns in a day. Three years later, only one of them is still studying. A classmate concludes that she made less effort. What does the case actually show?' },
      options:{ es:[
        'Que el resultado no depende solo del esfuerzo personal, porque las condiciones del entorno abren o cierran las opciones disponibles para cada quien.',
        'Que las calificaciones de la secundaria no sirven para anticipar quién continuará estudiando después de terminar ese nivel escolar.',
        'Que ella eligió libremente dedicarse a otra actividad y esa decisión merece el mismo respeto que la de continuar los estudios.',
        'Que él aprovechó mejor los recursos de su localidad y por eso obtuvo un resultado distinto al de su compañera de generación.' ],
        en:[
        'That the result does not depend only on personal effort, because the conditions of the surroundings open or close the options available to each person.',
        'That secondary school grades are not useful for anticipating who will keep studying after finishing that school level.',
        'That she freely chose to dedicate herself to another activity and that decision deserves the same respect as continuing studies.',
        'That he made better use of the resources of his locality and therefore obtained a different result from his classmate.' ] },
      correct:0,
      hint:{ es:'Compara lo que cada estudiante tenía disponible antes de que empezara la diferencia de trayectoria.',
             en:'Compare what each student had available before the difference in trajectory began.' },
      explanation:{ es:'Los dos partieron con el mismo desempeño escolar, así que la diferencia posterior no puede explicarse por él. Lo que cambió fue el entorno: uno tenía la escuela a la vuelta y la otra necesitaba pagar un traslado que su familia no podía sostener. Atribuirlo a la falta de esfuerzo hace invisible el obstáculo y deja intacta la causa. Las otras opciones ignoran el costo del traslado o presentan como elección libre lo que fue una salida forzada.',
                    en:'Both started with the same school performance, so the later difference cannot be explained by it. What changed was the surroundings: one had the school around the corner and the other needed to pay for a trip her family could not sustain. Attributing it to a lack of effort makes the obstacle invisible and leaves the cause untouched. The other options ignore the cost of the trip or present as a free choice what was a forced exit.' } },
    { title:{ es:'Por qué se llama estructural', en:'Why it is called structural' },
      stmt:{ es:'En una comunidad, tres generaciones seguidas de una misma familia dejaron de estudiar al terminar la primaria. En ese tiempo cambiaron los gobiernos, los programas y las personas, pero nunca se construyó una secundaria cercana ni hubo transporte escolar. ¿Qué permite afirmar que se trata de una desigualdad estructural y no de un problema de esa familia?',
             en:'In one community, three consecutive generations of the same family stopped studying after primary school. During that time governments, programs and people changed, but a nearby secondary school was never built and there was no school transport. What allows saying that this is a structural inequality and not a problem of that family?' },
      options:{ es:[
        'Que el obstáculo se mantuvo igual durante décadas y afecta a quien viva ahí, sin importar qué decida cada familia en particular.',
        'Que la familia no presentó ninguna queja formal ante las autoridades educativas durante todo el periodo señalado en el caso.',
        'Que tres generaciones seguidas son suficientes para considerar que existe una tradición familiar de abandono de los estudios.',
        'Que los gobiernos cambiaron varias veces y cada cambio interrumpió los programas educativos dirigidos a esa comunidad.' ],
        en:[
        'That the obstacle stayed the same for decades and affects whoever lives there, no matter what each particular family decides.',
        'That the family never filed a formal complaint with the education authorities during the whole period mentioned in the case.',
        'That three consecutive generations are enough to consider that a family tradition of dropping out exists.',
        'That governments changed several times and each change interrupted the education programs aimed at that community.' ] },
      correct:0,
      hint:{ es:'Fíjate en qué se mantuvo constante mientras todo lo demás cambiaba.',
             en:'Notice what stayed constant while everything else changed.' },
      explanation:{ es:'Una desigualdad es estructural cuando depende de cómo está organizado el acceso, y no de las decisiones de quien la padece. Aquí cambiaron gobiernos y programas, pero la ausencia de secundaria y de transporte permaneció, así que cualquier familia del lugar habría enfrentado lo mismo. Las otras opciones trasladan la responsabilidad a la familia, convierten el patrón en una costumbre o culpan a la rotación de autoridades sin tocar la condición que nunca se resolvió.',
                    en:'An inequality is structural when it depends on how access is organized, not on the decisions of whoever suffers it. Here governments and programs changed, but the absence of a secondary school and transport remained, so any family in the place would have faced the same. The other options shift responsibility to the family, turn the pattern into a custom or blame the rotation of authorities without touching the condition that was never solved.' } }
  ], rng), rng);

  /* ── PROBLEMA 4 ─────────────────────────────────────────────── */
  addProblem(pick([
    { title:{ es:'Desventajas que se cruzan', en:'Disadvantages that overlap' },
      stmt:{ es:'Un programa estatal ofrece apoyos para jóvenes de zonas rurales. La convocatoria se publica únicamente en internet y en español, y el registro exige un correo electrónico. Al cerrar, casi todos los apoyos quedaron en manos de jóvenes de la cabecera municipal. ¿Qué desigualdad no consideró el diseño del programa?',
             en:'A state program offers supports for young people from rural areas. The call is published only online and in Spanish, and registration requires an email address. At closing, almost all the supports ended up with young people from the town center. Which inequality did the program design fail to consider?' },
      options:{ es:[
        'La que resulta de combinar la falta de conectividad con el uso exclusivo del español, que deja fuera justo a quienes el programa decía atender.',
        'La que existe entre las zonas rurales y las urbanas en cuanto al número de jóvenes que solicitan apoyos educativos cada año.',
        'La que se produce cuando los apoyos ofrecidos resultan insuficientes para cubrir todos los gastos escolares de las personas beneficiarias.',
        'La que aparece entre quienes ya estudian y quienes abandonaron la escuela antes de que se publicara la convocatoria del programa.' ],
        en:[
        'The one resulting from combining lack of connectivity with the exclusive use of Spanish, which leaves out precisely those the program claimed to serve.',
        'The one existing between rural and urban areas regarding the number of young people who apply for education supports each year.',
        'The one produced when the offered supports turn out insufficient to cover all the school expenses of the beneficiaries.',
        'The one appearing between those who already study and those who left school before the program call was published.' ] },
      correct:0,
      hint:{ es:'Piensa en qué dos condiciones tendría que reunir una persona para enterarse y registrarse a tiempo.',
             en:'Think about which two conditions a person would need in order to find out and register in time.' },
      explanation:{ es:'Enterarse exigía conexión, y registrarse exigía leer y escribir en español con correo electrónico. Quien vive lejos y habla una lengua originaria falla en las dos puertas a la vez, y por eso el apoyo termina donde ya había ventaja. Ese cruce de condiciones es lo que hace que un programa bien intencionado profundice la desigualdad que dice combatir. Las otras opciones señalan problemas reales que no explican por qué se excluyó justo a la población destinataria.',
                    en:'Finding out required a connection, and registering required reading and writing in Spanish with an email address. Whoever lives far away and speaks an original language fails at both doors at once, and that is why the support ends up where advantage already existed. That overlap of conditions is what makes a well intentioned program deepen the inequality it claims to fight. The other options point to real problems that do not explain why the target population was precisely the one excluded.' } },
    { title:{ es:'Quién enfrenta más obstáculos', en:'Who faces more obstacles' },
      stmt:{ es:'Cuatro estudiantes quieren inscribirse al bachillerato. La primera vive en la cabecera y tiene internet. El segundo vive en la cabecera y usa silla de ruedas, y el plantel tiene rampa. La tercera vive en una comunidad alejada, habla una lengua originaria en casa y el plantel más cercano no tiene rampa ni intérprete, y ella usa silla de ruedas. El cuarto vive en una comunidad alejada con transporte diario. ¿Quién enfrenta una desigualdad que combina varias condiciones a la vez?',
             en:'Four students want to enroll in high school. The first lives in the town center and has internet. The second lives in the town center and uses a wheelchair, and the school has a ramp. The third lives in a distant community, speaks an original language at home and the closest school has neither ramp nor interpreter, and she uses a wheelchair. The fourth lives in a distant community with daily transport. Who faces an inequality that combines several conditions at once?' },
      options:{ es:[
        'La tercera estudiante, porque distancia, lengua y falta de accesibilidad actúan juntas y cada una cierra la salida que la otra dejaba abierta.',
        'El segundo estudiante, porque desplazarse en silla de ruedas dentro de un plantel escolar siempre exige un esfuerzo adicional considerable.',
        'El cuarto estudiante, porque vivir en una comunidad alejada implica trasladarse todos los días para asistir a las clases del plantel.',
        'La primera estudiante, porque la competencia por los lugares disponibles suele ser más intensa dentro de la cabecera municipal.' ],
        en:[
        'The third student, because distance, language and lack of accessibility act together and each one closes the exit the other left open.',
        'The second student, because moving in a wheelchair inside a school always demands a considerable additional effort.',
        'The fourth student, because living in a distant community means travelling every day to attend classes at the school.',
        'The first student, because competition for the available places is usually more intense inside the town center.' ] },
      correct:0,
      hint:{ es:'Cuenta cuántos obstáculos distintos tendría que resolver cada persona para llegar al primer día de clases.',
             en:'Count how many different obstacles each person would have to solve in order to reach the first day of class.' },
      explanation:{ es:'Los casos segundo y cuarto presentan un obstáculo que ya está resuelto: hay rampa en uno y transporte diario en el otro. La tercera estudiante enfrenta tres condiciones sin resolver que se refuerzan entre sí, porque acercarse al plantel no le sirve si no puede entrar, y entrar no le sirve si no entiende lo que ocurre en clase. Reconocer ese cruce es lo que permite diseñar apoyos que funcionen de verdad.',
                    en:'The second and fourth cases present an obstacle that is already solved: there is a ramp in one and daily transport in the other. The third student faces three unsolved conditions that reinforce each other, because getting close to the school is useless if she cannot enter, and entering is useless if she cannot understand what happens in class. Recognizing that overlap is what allows designing supports that really work.' } }
  ], rng), rng);

  /* ── CONCEPTO 3 ─────────────────────────────────────────────── */
  addSection(S('CONCEPTO 3','CONCEPT 3'),
    '<h2>' + S('Tratar igual no siempre es dar las mismas oportunidades','Treating equally is not always giving the same opportunities') + '</h2>' +
    '<p>' + S('La igualdad ante la ley significa que la misma regla vale para todas las personas y que nadie puede ser excluido por su origen, su lengua, su sexo o su condición. Ese principio es indispensable, pero no basta por sí solo. Si dos personas parten de lugares muy distintos, aplicarles exactamente la misma medida deja la distancia inicial donde estaba. Por eso se distingue entre igualdad formal, que es la misma regla, e igualdad sustantiva, que es el ejercicio real del derecho.',
              'Equality before the law means that the same rule applies to every person and that nobody can be excluded because of origin, language, sex or condition. That principle is indispensable, but it is not enough by itself. If two people start from very different places, applying exactly the same measure to them leaves the initial distance where it was. That is why a distinction is drawn between formal equality, which is the same rule, and substantive equality, which is the real exercise of the right.') + '</p>' +
    '<p>' + S('La equidad es el puente entre ambas. Consiste en ajustar el trato al punto de partida para que el resultado sea igual de digno para todos: intérprete para quien no habla la lengua del trámite, rampa para quien usa silla de ruedas, transporte para quien vive lejos, materiales para quien no puede comprarlos. No se trata de dar más a alguien porque sí, sino de retirar un obstáculo que solo esa persona tiene enfrente.',
              'Equity is the bridge between them. It consists of adjusting the treatment to the starting point so that the result is equally dignified for everyone: an interpreter for whoever does not speak the language of the procedure, a ramp for whoever uses a wheelchair, transport for whoever lives far away, materials for whoever cannot buy them. It is not about giving more to somebody for no reason, but about removing an obstacle that only that person has in front.') + '</p>' +
    '<p>' + S('Cuando ese ajuste se convierte en una medida pública dirigida a un grupo, se llama acción afirmativa. Para sostenerse necesita tres cosas: una desventaja documentada, un objetivo concreto que se pueda comprobar y una evaluación que diga si la brecha se está cerrando. Una medida así deja de ser necesaria el día en que la desventaja desaparece, y eso es justamente lo que la distingue de un privilegio.',
              'When that adjustment becomes a public measure aimed at a group, it is called affirmative action. To hold up it needs three things: a documented disadvantage, a concrete goal that can be verified and an evaluation saying whether the gap is closing. A measure like that stops being necessary the day the disadvantage disappears, and that is precisely what distinguishes it from a privilege.') + '</p>' +
    '<div class="rules-grid">' +
      '<div class="rcard"><div class="rname">' + S('Igualdad formal','Formal equality') + '</div><div class="rform">' + S('misma regla','same rule') + '</div><div class="rnote">' + S('Nadie queda excluido por lo que es.','Nobody is excluded for what they are.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Igualdad sustantiva','Substantive equality') + '</div><div class="rform">' + S('mismo ejercicio','same exercise') + '</div><div class="rnote">' + S('El derecho se ejerce de verdad.','The right is actually exercised.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Equidad','Equity') + '</div><div class="rform">' + S('trato ajustado','adjusted treatment') + '</div><div class="rnote">' + S('Retira el obstáculo de quien lo tiene.','It removes the obstacle from whoever has it.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Acción afirmativa','Affirmative action') + '</div><div class="rform">' + S('medida con meta','measure with a goal') + '</div><div class="rnote">' + S('Se evalúa y termina al cerrar la brecha.','It is evaluated and ends when the gap closes.') + '</div></div>' +
    '</div>' +
    buildApoyos(rng));
  apRender();

  /* ── PROBLEMA 5 ─────────────────────────────────────────────── */
  addProblem(pick([
    { title:{ es:'El mismo recurso, distinta oportunidad', en:'The same resource, a different opportunity' },
      stmt:{ es:'Una escuela entrega la misma tableta a todo el alumnado para las tareas en línea. Al mes, quienes viven en la cabecera cumplen sin problema y quienes viven en dos comunidades sin señal siguen sin entregar. La dirección insiste en que el trato fue idéntico para todos. ¿Qué medida corrige mejor la situación?',
             en:'A school gives the same tablet to all students for online homework. After a month, those living in the town center comply without trouble and those living in two communities with no signal still do not hand work in. The school office insists that the treatment was identical for everybody. Which measure best corrects the situation?' },
      options:{ es:[
        'Mantener la entrega y añadir puntos de conexión en esas comunidades o tareas que funcionen sin conexión, porque el mismo recurso no produce la misma oportunidad.',
        'Retirar las tabletas a todo el grupo y volver a las tareas en papel, para que nadie quede en desventaja frente al resto del alumnado.',
        'Ampliar el plazo de entrega para todo el grupo, de modo que quienes tienen dificultades cuenten con más días para completar sus trabajos.',
        'Ofrecer un taller de uso de la tableta a quienes no entregan, para que aprovechen mejor la herramienta que ya se les proporcionó.' ],
        en:[
        'Keep the delivery and add connection points in those communities or homework that works offline, because the same resource does not produce the same opportunity.',
        'Take the tablets away from the whole group and return to paper homework, so that nobody is at a disadvantage compared with the rest of the students.',
        'Extend the deadline for the whole group, so that those with difficulties have more days to complete their work.',
        'Offer a workshop on using the tablet to those who do not hand work in, so they make better use of the tool already provided.' ] },
      correct:0,
      hint:{ es:'Identifica cuál es el obstáculo real que impide entregar y comprueba si la medida lo retira.',
             en:'Identify the real obstacle preventing delivery and check whether the measure removes it.' },
      explanation:{ es:'El obstáculo no es la tableta ni el tiempo ni el manejo del aparato: es la ausencia de señal. Una medida equitativa actúa justo sobre esa condición, ya sea acercando la conexión o cambiando el tipo de tarea. Retirar las tabletas iguala hacia abajo y nadie gana; ampliar el plazo o dar un taller supone un problema que el caso no describe, porque el alumnado sabe usar el aparato y no tiene dónde conectarlo.',
                    en:'The obstacle is not the tablet, the time or the handling of the device: it is the absence of signal. An equitable measure acts precisely on that condition, either bringing the connection closer or changing the type of homework. Taking the tablets away levels downward and nobody gains; extending the deadline or giving a workshop assumes a problem the case does not describe, because the students know how to use the device and have nowhere to connect it.' } },
    { title:{ es:'La misma regla y distinto resultado', en:'The same rule and a different result' },
      stmt:{ es:'Un municipio abre una convocatoria de becas con una sola regla para todos: presentar la solicitud en la oficina central antes de las dos de la tarde. Las comunidades más alejadas cuentan con un solo camión que llega a las tres. Alguien afirma que la regla es justa porque es idéntica para toda la población. ¿Cuál respuesta corrige mejor esa afirmación?',
             en:'A town opens a scholarship call with a single rule for everybody: submit the application at the central office before two in the afternoon. The most distant communities have a single bus that arrives at three. Somebody claims the rule is fair because it is identical for the whole population. Which answer best corrects that claim?' },
      options:{ es:[
        'Una regla idéntica puede producir resultados desiguales cuando las condiciones de partida difieren, y aquí excluye a quien depende del único transporte disponible.',
        'La regla es injusta porque el horario elegido resulta demasiado temprano para cualquier persona que trabaje durante la mañana en el municipio.',
        'La regla es correcta y el problema corresponde por completo al servicio de transporte, que debería ajustar sus horarios a las oficinas.',
        'La regla debería eliminarse porque las becas tendrían que repartirse entre todas las personas que las soliciten sin ningún requisito previo.' ],
        en:[
        'An identical rule can produce unequal results when starting conditions differ, and here it excludes whoever depends on the only available transport.',
        'The rule is unfair because the chosen hour turns out too early for anybody who works during the morning in the town.',
        'The rule is correct and the problem belongs entirely to the transport service, which should adjust its schedule to the offices.',
        'The rule should be removed because scholarships would have to be shared among everybody who applies with no previous requirement.' ] },
      correct:0,
      hint:{ es:'Compara la regla con lo que cada persona necesita hacer para cumplirla.',
             en:'Compare the rule with what each person needs to do in order to comply with it.' },
      explanation:{ es:'La igualdad formal se cumple, porque la regla no menciona a ningún grupo, y aun así el efecto es excluyente: quien depende del único camión no puede llegar a tiempo por más que quiera. Ese es el punto en el que hace falta un ajuste, como una ventanilla itinerante o una recepción en línea con acompañamiento. Las otras opciones desplazan la responsabilidad al transporte, generalizan el horario o proponen suprimir todo requisito, y ninguna atiende la condición que produce la exclusión.',
                    en:'Formal equality is met, because the rule mentions no group, and even so the effect is exclusionary: whoever depends on the only bus cannot arrive in time no matter how much they want to. That is the point where an adjustment is needed, such as a travelling desk or online reception with support. The other options shift responsibility to transport, generalize the schedule or propose removing every requirement, and none addresses the condition producing the exclusion.' } }
  ], rng), rng);

  /* ── PROBLEMA 6 ─────────────────────────────────────────────── */
  addProblem(pick([
    { title:{ es:'Acción afirmativa o privilegio', en:'Affirmative action or privilege' },
      stmt:{ es:'Una universidad pública reserva lugares para estudiantes de comunidades donde no existe bachillerato. Un aspirante afirma que se trata de un privilegio. ¿Qué distingue a una acción afirmativa de un privilegio?',
             en:'A public university reserves places for students from communities where no high school exists. An applicant claims this is a privilege. What distinguishes an affirmative action from a privilege?' },
      options:{ es:[
        'Que se dirige a un grupo con una desventaja documentada, persigue cerrar una brecha concreta y se evalúa para saber cuándo dejó de ser necesaria.',
        'Que la decide una institución pública y no una persona particular, lo cual le da respaldo legal frente a cualquier inconformidad.',
        'Que beneficia a un número reducido de personas y por eso no afecta de manera significativa a quienes compiten por los demás lugares.',
        'Que se aplica solamente durante el proceso de admisión y no interviene en la evaluación posterior de quienes fueron aceptados.' ],
        en:[
        'That it targets a group with a documented disadvantage, seeks to close a concrete gap and is evaluated to know when it stopped being necessary.',
        'That it is decided by a public institution and not by a private person, which gives it legal backing against any objection.',
        'That it benefits a small number of people and therefore does not significantly affect those competing for the remaining places.',
        'That it applies only during the admission process and does not intervene in the later evaluation of those who were accepted.' ] },
      correct:0,
      hint:{ es:'Pregúntate qué tendría que ocurrir para que la medida dejara de aplicarse.',
             en:'Ask what would have to happen for the measure to stop being applied.' },
      explanation:{ es:'Un privilegio no responde a ninguna desventaja, no tiene meta y nadie lo revisa: por eso se sostiene indefinidamente. Una acción afirmativa nace de una desventaja que se puede mostrar, se propone cerrar esa brecha y se evalúa, de modo que su final está previsto desde el inicio. Las otras opciones describen rasgos administrativos o de tamaño que no dicen nada sobre la desventaja que la medida busca compensar.',
                    en:'A privilege responds to no disadvantage, has no goal and nobody reviews it: that is why it lasts indefinitely. An affirmative action is born from a disadvantage that can be shown, aims to close that gap and is evaluated, so its ending is foreseen from the start. The other options describe administrative or size features that say nothing about the disadvantage the measure seeks to compensate.' } },
    { title:{ es:'Qué evidencia sostiene la medida', en:'What evidence sustains the measure' },
      stmt:{ es:'Tras dos ciclos escolares, una escuela quiere saber si su programa de transporte gratuito para estudiantes de comunidades alejadas cumplió su propósito. ¿Qué evidencia sostendría mejor esa conclusión?',
             en:'After two school years, a school wants to know whether its free transport program for students from distant communities fulfilled its purpose. Which evidence would best support that conclusion?' },
      options:{ es:[
        'Que las y los estudiantes de esas comunidades ahora asisten y concluyen el ciclo en una proporción parecida a la del resto del alumnado.',
        'Que el programa se difundió ampliamente y la comunidad escolar lo considera una de las mejores iniciativas recientes del plantel.',
        'Que el número de unidades de transporte contratadas aumentó respecto del que se tenía al inicio del primer ciclo escolar.',
        'Que ningún estudiante presentó quejas sobre el servicio durante los dos ciclos escolares en que estuvo funcionando el programa.' ],
        en:[
        'That the students from those communities now attend and finish the school year in a proportion similar to that of the rest of the students.',
        'That the program was widely publicized and the school community considers it one of the best recent initiatives of the school.',
        'That the number of contracted transport units increased compared with the one available at the start of the first school year.',
        'That no student filed complaints about the service during the two school years in which the program was running.' ] },
      correct:0,
      hint:{ es:'Distingue lo que la medida hizo de lo que la medida logró en la brecha que quería cerrar.',
             en:'Separate what the measure did from what the measure achieved in the gap it wanted to close.' },
      explanation:{ es:'Una acción afirmativa se evalúa por la brecha que dice cerrar, no por su difusión ni por sus insumos. Comparar la asistencia y la conclusión del ciclo entre las comunidades alejadas y el resto del alumnado responde exactamente a esa pregunta. La difusión, el número de unidades y la ausencia de quejas describen la operación del programa, y pueden ser altos incluso si la brecha sigue igual.',
                    en:'An affirmative action is evaluated by the gap it claims to close, not by its publicity or its inputs. Comparing attendance and completion of the school year between the distant communities and the rest of the students answers exactly that question. Publicity, the number of units and the absence of complaints describe the operation of the program, and can be high even if the gap stays the same.' } }
  ], rng), rng);

  /* ── CONCEPTO 4 ─────────────────────────────────────────────── */
  addSection(S('CONCEPTO 4','CONCEPT 4'),
    '<h2>' + S('Respeto y solidaridad: actuar con, no actuar por','Respect and solidarity: acting with, not acting for') + '</h2>' +
    '<p>' + S('El respeto no consiste en aplaudir de lejos ni en admirar la ropa, la comida o la música de una comunidad durante una semana cultural. Consiste en reconocer que quienes viven una situación son quienes mejor la conocen y quienes tienen derecho a decidir sobre ella. Cuando una comunidad aparece solo como decorado y nunca como voz, el gesto se convierte en exhibición y el respeto desaparece justo cuando se dice practicarlo.',
              'Respect does not consist of applauding from afar or admiring the clothing, food or music of a community during a cultural week. It consists of recognizing that those who live a situation are the ones who know it best and the ones with the right to decide about it. When a community appears only as decoration and never as a voice, the gesture becomes an exhibition and respect disappears precisely when it is said to be practiced.') + '</p>' +
    '<p>' + S('La solidaridad tampoco es lo mismo que la caridad ocasional. Ayudar una vez alivia un efecto y termina ahí; a veces incluso deja intacta la causa y coloca a quien recibe en el lugar de quien nunca decide. La solidaridad, en cambio, reconoce a la otra persona como igual, se construye con ella, va sobre la causa del problema y se sostiene con acuerdos, fechas y responsables.',
              'Solidarity is not the same as occasional charity either. Helping once eases an effect and ends there; sometimes it even leaves the cause untouched and places whoever receives in the position of somebody who never decides. Solidarity, in contrast, recognizes the other person as an equal, is built together with them, goes after the cause of the problem and is sustained with agreements, dates and people responsible.') + '</p>' +
    '<p>' + S('La diferencia se nota en preguntas muy concretas. ¿Quién decidió qué se iba a hacer? ¿La acción toca la causa o solo el efecto? ¿Qué queda cuando el grupo se retira? ¿Las personas aparecen como titulares de derechos o como receptoras de una ayuda? Una acción puede empezar como entrega y convertirse en solidaridad si esas cuatro respuestas cambian.',
              'The difference shows in very concrete questions. Who decided what would be done? Does the action touch the cause or only the effect? What remains when the group withdraws? Do people appear as rights holders or as recipients of help? An action can begin as a delivery and turn into solidarity if those four answers change.') + '</p>' +
    '<div class="callout"><p><strong>' + S('Asistencialismo: ','Welfare dependency: ') + '</strong>' +
      S('forma de ayuda que atiende el efecto inmediato, decide desde fuera y no deja capacidad instalada. Alivia por un momento y mantiene intacta la relación desigual entre quien da y quien recibe.',
        'a form of help that attends to the immediate effect, decides from outside and leaves no installed capacity. It eases for a moment and keeps the unequal relation between the one who gives and the one who receives intact.') + '</p></div>' +
    buildTermo(rng));
  tmRender();

  /* ── PROBLEMA 7 ─────────────────────────────────────────────── */
  addProblem(pick([
    { title:{ es:'Dos formas de responder', en:'Two ways of responding' },
      stmt:{ es:'Ante la falta de agua potable en una comunidad, dos grupos actúan. El primero lleva garrafones una vez al año en diciembre y publica fotografías de la entrega. El segundo acompaña a la comunidad a documentar el problema, presenta con ella la solicitud ante el organismo operador y da seguimiento a la respuesta durante el año. ¿Cuál corresponde a la solidaridad y por qué?',
             en:'Faced with the lack of drinking water in a community, two groups act. The first takes water containers once a year in December and posts photos of the delivery. The second accompanies the community in documenting the problem, files the request with the water utility together with them and follows up on the answer during the year. Which one corresponds to solidarity and why?' },
      options:{ es:[
        'El segundo, porque actúa junto con la comunidad, va sobre la causa de la falta de agua y sostiene el seguimiento en el tiempo.',
        'El primero, porque resuelve una necesidad inmediata en el momento del año en que las familias enfrentan mayores gastos.',
        'El segundo, porque trata con una institución pública y ese trato le da mayor formalidad y respaldo a cualquier reclamo vecinal.',
        'El primero, porque al difundir la entrega consigue que más personas conozcan la situación que vive esa comunidad.' ],
        en:[
        'The second, because it acts together with the community, goes after the cause of the water shortage and sustains follow up over time.',
        'The first, because it solves an immediate need at the time of year when families face the greatest expenses.',
        'The second, because it deals with a public institution and that dealing gives greater formality and backing to any neighborhood claim.',
        'The first, because by publicizing the delivery it gets more people to know the situation that community lives.' ] },
      correct:0,
      hint:{ es:'Pregúntate qué queda en la comunidad cuando cada grupo se retira.',
             en:'Ask what remains in the community when each group withdraws.' },
      explanation:{ es:'Al retirarse el primer grupo, la comunidad sigue sin red de agua y esperará otro diciembre. Al retirarse el segundo, quedan un expediente, una solicitud presentada y una comunidad que sabe cómo dar seguimiento. Esa capacidad instalada, junto con haber actuado con la comunidad y no en su lugar, es lo que define a la solidaridad. La tercera opción acierta el grupo pero lo justifica por formalidad y no por el papel que juega la comunidad.',
                    en:'When the first group withdraws, the community still has no water network and will wait for another December. When the second withdraws, a file, a filed request and a community that knows how to follow up remain. That installed capacity, together with having acted with the community and not in its place, is what defines solidarity. The third option picks the right group but justifies it by formality and not by the role the community plays.' } },
    { title:{ es:'La señal de que algo cambió', en:'The signal that something changed' },
      stmt:{ es:'Un grupo escolar sostiene desde hace dos años una colecta mensual de ropa para una comunidad. Quieren saber si su acción se volvió asistencialista. ¿Qué señal lo indicaría con mayor claridad?',
             en:'A school group has been running a monthly clothing collection for a community for two years. They want to know whether their action became welfare dependency. Which signal would indicate it most clearly?' },
      options:{ es:[
        'Que el grupo decide sin consultar qué se entrega y en dos años nunca se ha discutido con la comunidad qué causa el problema.',
        'Que la cantidad de ropa reunida cada mes ha disminuido respecto de la que se lograba durante el primer año de la colecta.',
        'Que algunas familias de la comunidad prefieren no participar en las entregas que organiza el grupo escolar cada mes.',
        'Que el grupo ha tenido que cambiar varias veces el día de la entrega para ajustarse al calendario escolar del plantel.' ],
        en:[
        'That the group decides without asking what is delivered and in two years the cause of the problem has never been discussed with the community.',
        'That the amount of clothing gathered each month has decreased compared with what was achieved during the first year of the collection.',
        'That some families of the community prefer not to take part in the deliveries the school group organizes every month.',
        'That the group has had to change the delivery day several times to fit the school calendar of the campus.' ] },
      correct:0,
      hint:{ es:'Revisa quién decide y si alguien ha mirado alguna vez la causa del problema.',
             en:'Check who decides and whether anybody has ever looked at the cause of the problem.' },
      explanation:{ es:'El asistencialismo se reconoce por dos rasgos juntos: la decisión se toma desde fuera y la causa nunca entra en la conversación. Eso mantiene a la comunidad en el lugar de quien recibe y deja el problema intacto durante años. Las otras señales describen variaciones normales de una colecta, como la cantidad reunida, la participación de algunas familias o el día elegido, y ninguna dice nada sobre quién decide ni sobre la causa.',
                    en:'Welfare dependency is recognized by two features together: the decision is taken from outside and the cause never enters the conversation. That keeps the community in the position of whoever receives and leaves the problem untouched for years. The other signals describe normal variations of a collection, such as the amount gathered, the participation of some families or the chosen day, and none says anything about who decides or about the cause.' } }
  ], rng), rng);

  /* ── CONCEPTO 5 ─────────────────────────────────────────────── */
  addSection(S('CONCEPTO 5','CONCEPT 5'),
    '<h2>' + S('De la intención a la acción: qué puedes hacer donde vives','From intention to action: what you can do where you live') + '</h2>' +
    '<p>' + S('Reducir una desigualdad no empieza por organizar una actividad, sino por escuchar. La ruta tiene cinco pasos que se sostienen entre sí. Primero, escuchar a quienes viven la situación y preguntar qué necesitan. Segundo, identificar con precisión quién está quedando fuera y de qué. Tercero, definir la acción junto con la comunidad, no antes de hablar con ella. Cuarto, acordar responsables, fechas y qué ocurrirá cuando el grupo se retire. Quinto, evaluar con quienes participaron si algo cambió de verdad.',
              'Reducing an inequality does not begin by organizing an activity, but by listening. The route has five steps that hold each other up. First, listen to those who live the situation and ask what they need. Second, identify precisely who is being left out and from what. Third, define the action together with the community, not before speaking with it. Fourth, agree on people responsible, dates and what will happen when the group withdraws. Fifth, evaluate with those who took part whether something really changed.') + '</p>' +
    '<p>' + S('Esta ruta funciona en las tres escalas en que se vive la desigualdad. En la comunidad, donde puedes preguntar, documentar y presentar una petición. En México, donde un mismo patrón se repite entre regiones y entre el campo y la ciudad. Y en América Latina, donde el territorio, el origen étnico y la lengua predicen con demasiada frecuencia quién llega a la escuela, al médico y al agua limpia. Reconocer ese patrón compartido explica por qué la respuesta no puede ser solo individual.',
              'This route works at the three scales at which inequality is lived. In the community, where you can ask, document and file a petition. In Mexico, where the same pattern repeats between regions and between the countryside and the city. And in Latin America, where territory, ethnic origin and language too often predict who reaches school, a doctor and clean water. Recognizing that shared pattern explains why the response cannot be only individual.') + '</p>' +
    '<p>' + S('Una acción ética se reconoce, entonces, por cómo está hecha y no solo por lo que entrega. Si la comunidad decidió, si la causa fue nombrada, si alguien queda a cargo cuando ustedes se van y si las personas fueron tratadas como titulares de derechos, la acción reduce desigualdad. Si falta alguna de esas cuatro cosas, conviene rediseñarla antes de salir.',
              'An ethical action is recognized, then, by how it is made and not only by what it delivers. If the community decided, if the cause was named, if somebody stays in charge when you leave and if people were treated as rights holders, the action reduces inequality. If any of those four things is missing, it is worth redesigning it before going out.') + '</p>' +
    buildFiltro(rng));
  flRender();

  /* ── PROBLEMA 8 ─────────────────────────────────────────────── */
  addProblem(pick([
    { title:{ es:'Por dónde empieza el plan', en:'Where the plan starts' },
      stmt:{ es:'Un grupo de tercero quiere reducir la desigualdad en el acceso a la lectura en su colonia. En la primera reunión surgen cuatro propuestas de arranque. ¿Cuál corresponde al primer paso de una acción ética?',
             en:'A third year group wants to reduce inequality in access to reading in their neighborhood. At the first meeting four starting proposals appear. Which one corresponds to the first step of an ethical action?' },
      options:{ es:[
        'Conversar con vecinas y vecinos para saber quiénes no tienen acceso a libros y qué haría falta para que sí lo tuvieran.',
        'Elegir los títulos que el grupo considera más valiosos y organizar una colecta de libros entre las familias del plantel.',
        'Reservar un salón de la escuela y fijar el horario en que funcionará el espacio de lectura durante el resto del ciclo.',
        'Diseñar carteles atractivos que anuncien la actividad para asegurar que asista el mayor número posible de personas.' ],
        en:[
        'Talk with neighbors to find out who has no access to books and what would be needed for them to have it.',
        'Choose the titles the group considers most valuable and organize a book collection among the families of the school.',
        'Book a school classroom and set the schedule in which the reading space will run for the rest of the year.',
        'Design attractive posters announcing the activity to make sure the largest possible number of people attend.' ] },
      correct:0,
      hint:{ es:'Pregúntate qué información necesita el grupo antes de decidir cualquier otra cosa.',
             en:'Ask what information the group needs before deciding anything else.' },
      explanation:{ es:'Las otras tres propuestas ya deciden el qué, el dónde y el cómo sin saber quién queda fuera ni por qué. Si el obstáculo es el horario, el traslado o la falta de un espacio con luz, una colecta de títulos elegidos en la escuela no lo resolverá. Escuchar primero no retrasa la acción: es lo que evita diseñar una respuesta que no corresponde al problema.',
                    en:'The other three proposals already decide the what, the where and the how without knowing who is left out or why. If the obstacle is the schedule, the trip or the lack of a lit space, a collection of titles chosen at school will not solve it. Listening first does not delay the action: it is what avoids designing a response that does not match the problem.' } },
    { title:{ es:'Saber si la acción sirvió', en:'Knowing whether the action worked' },
      stmt:{ es:'Al terminar el ciclo, el mismo grupo quiere saber si su espacio de lectura redujo la desigualdad de acceso que detectaron al inicio. ¿Qué evidencia responde mejor esa pregunta?',
             en:'At the end of the school year, the same group wants to know whether their reading space reduced the access inequality they detected at the start. Which evidence best answers that question?' },
      options:{ es:[
        'Comprobar con las personas que antes no tenían acceso si ahora consiguen libros y en qué condiciones lo hacen.',
        'Contar cuántas personas asistieron en total a lo largo del ciclo y compararlo con lo que el grupo esperaba al inicio.',
        'Revisar cuántas publicaciones sobre la actividad se difundieron y qué respuesta obtuvieron entre la comunidad escolar.',
        'Preguntar a las y los integrantes del grupo si consideran que la experiencia fue valiosa para su propia formación.' ],
        en:[
        'Check with the people who previously had no access whether they now obtain books and under what conditions.',
        'Count how many people attended in total during the year and compare it with what the group expected at the start.',
        'Review how many posts about the activity were shared and what response they obtained in the school community.',
        'Ask the members of the group whether they consider the experience valuable for their own education.' ] },
      correct:0,
      hint:{ es:'Recuerda a quién quería alcanzar la acción y busca la evidencia que habla de esas personas.',
             en:'Recall who the action wanted to reach and look for the evidence that speaks about those people.' },
      explanation:{ es:'La acción se propuso cerrar una brecha concreta, así que la evidencia tiene que venir de quienes estaban del lado desfavorecido de esa brecha. La asistencia total puede crecer con personas que ya tenían libros en casa, la difusión mide alcance y no acceso, y la satisfacción del grupo habla de su propia experiencia. Solo la primera opción compara la situación de quienes quedaban fuera antes y después.',
                    en:'The action set out to close a concrete gap, so the evidence has to come from those who were on the disadvantaged side of that gap. Total attendance can grow with people who already had books at home, publicity measures reach and not access, and the satisfaction of the group speaks about its own experience. Only the first option compares the situation of those left out before and after.' } }
  ], rng), rng);

  /* ── PROBLEMA 9 ─────────────────────────────────────────────── */
  addProblem(pick([
    { title:{ es:'Cuando la cultura se vuelve decorado', en:'When culture becomes decoration' },
      stmt:{ es:'Una escuela organiza una semana dedicada a un pueblo indígena de la región. Hay muestra de vestimenta, comida y música, fotografías en el patio y un concurso de trajes. No se invitó a nadie de la comunidad, no se mencionó ninguna de sus demandas actuales y no se habló de su lengua. ¿Qué falla desde el punto de vista del respeto?',
             en:'A school organizes a week dedicated to an indigenous people of the region. There is a display of clothing, food and music, photos in the yard and a costume contest. Nobody from the community was invited, none of its current demands was mentioned and its language was not discussed. What fails from the point of view of respect?' },
      options:{ es:[
        'Que convierte a la comunidad en objeto de exhibición en lugar de reconocerla como un pueblo que habla por sí mismo y tiene demandas vigentes.',
        'Que la organización de la semana requirió muchos recursos que podrían haberse destinado a otras actividades escolares del ciclo.',
        'Que las actividades elegidas resultan poco atractivas para el alumnado y por eso no logran despertar un interés duradero.',
        'Que una sola semana es un tiempo insuficiente para conocer a fondo todas las expresiones culturales de un pueblo originario.' ],
        en:[
        'That it turns the community into an object of display instead of recognizing it as a people that speaks for itself and has current demands.',
        'That organizing the week required many resources that could have gone to other school activities during the year.',
        'That the chosen activities are not attractive to the students and therefore fail to awaken a lasting interest.',
        'That a single week is insufficient time to know in depth all the cultural expressions of an original people.' ] },
      correct:0,
      hint:{ es:'Fíjate en quién habla durante toda la semana y quién solo aparece.',
             en:'Notice who speaks during the whole week and who only appears.' },
      explanation:{ es:'El respeto empieza por reconocer que la comunidad es sujeto y no tema. Al mostrar ropa y comida sin voz, sin lengua y sin demandas, la escuela reduce a un pueblo a un adorno y refuerza la idea de que otros pueden hablar en su nombre. Invitar a integrantes de la comunidad, incluir su lengua y escuchar lo que exigen hoy habría cambiado por completo el sentido de la semana. Las demás opciones evalúan costo, atractivo o duración.',
                    en:'Respect starts by recognizing that the community is a subject and not a topic. By showing clothing and food with no voice, no language and no demands, the school reduces a people to an ornament and reinforces the idea that others can speak in its name. Inviting members of the community, including its language and listening to what they demand today would have changed the meaning of the week completely. The other options evaluate cost, appeal or duration.' } },
    { title:{ es:'Una consulta que sí respeta', en:'A consultation that does respect' },
      stmt:{ es:'Una autoridad planea una obra que afectará las tierras de una comunidad y anuncia que hará una consulta. ¿Cuál de estas formas de consultar respeta efectivamente a la comunidad?',
             en:'An authority plans public works that will affect the lands of a community and announces it will hold a consultation. Which of these ways of consulting effectively respects the community?' },
      options:{ es:[
        'Informar con anticipación en la lengua de la comunidad, en su asamblea, y aceptar que el resultado pueda modificar o detener la obra.',
        'Reunir a las personas interesadas el día del inicio de la obra para explicarles con detalle en qué consistirá el proyecto.',
        'Publicar el proyecto completo en el sitio oficial y abrir un buzón de comentarios durante los quince días siguientes.',
        'Invitar a las autoridades de la comunidad a la ceremonia de arranque para que participen en el acto público de inicio.' ],
        en:[
        'Inform in advance in the language of the community, at its assembly, and accept that the result may modify or stop the works.',
        'Gather the interested people on the day the works begin in order to explain in detail what the project will consist of.',
        'Publish the complete project on the official site and open a comment box during the following fifteen days.',
        'Invite the community authorities to the opening ceremony so they take part in the public act of inauguration.' ] },
      correct:0,
      hint:{ es:'Pregúntate si la comunidad podría cambiar algo con lo que diga, o si solo será informada.',
             en:'Ask whether the community could change anything with what it says, or whether it will only be informed.' },
      explanation:{ es:'Una consulta respetuosa reúne tres condiciones: llega a tiempo, llega en la lengua y por el canal propio de la comunidad, y puede modificar la decisión. Las otras tres formas informan cuando ya no hay nada que decidir, exigen conexión y lectura en otra lengua, o convierten la participación en un acto ceremonial. En todas ellas la comunidad escucha, pero no decide.',
                    en:'A respectful consultation meets three conditions: it arrives in time, it arrives in the language and through the channel of the community, and it can modify the decision. The other three forms inform when there is nothing left to decide, require connection and reading in another language, or turn participation into a ceremonial act. In all of them the community listens, but does not decide.' } }
  ], rng), rng);

  /* ── PROBLEMA 10 ────────────────────────────────────────────── */
  addProblem(pick([
    { title:{ es:'Un patrón compartido en la región', en:'A shared pattern in the region' },
      stmt:{ es:'Al revisar situaciones de desigualdad en varios países de América Latina, un equipo encuentra que en todos ellos las comunidades rurales, indígenas y afrodescendientes tienen menos acceso a agua, salud y escuela que las zonas urbanas. ¿Qué conclusión se sostiene mejor con ese hallazgo?',
             en:'While reviewing inequality situations in several Latin American countries, a team finds that in all of them rural, indigenous and Afro descendant communities have less access to water, health and school than urban areas. Which conclusion is best supported by that finding?' },
      options:{ es:[
        'Que existe un patrón regional en el que el territorio y el origen predicen el acceso a derechos, y por eso la respuesta debe cambiar reglas y no solo conductas individuales.',
        'Que cada país enfrenta un problema propio cuya explicación depende por completo de las decisiones tomadas por sus autoridades recientes.',
        'Que las zonas urbanas de la región concentran más población y por eso reciben de manera natural una mayor cantidad de servicios.',
        'Que las comunidades rurales de la región prefieren conservar sus formas de vida y por eso solicitan menos servicios públicos.' ],
        en:[
        'That a regional pattern exists in which territory and origin predict access to rights, so the response must change rules and not only individual behavior.',
        'That each country faces its own problem whose explanation depends entirely on the decisions taken by its recent authorities.',
        'That the urban areas of the region concentrate more population and therefore naturally receive a greater amount of services.',
        'That the rural communities of the region prefer to preserve their ways of life and therefore request fewer public services.' ] },
      correct:0,
      hint:{ es:'Pregúntate qué significa que el mismo resultado aparezca en países distintos y con gobiernos distintos.',
             en:'Ask what it means that the same result appears in different countries with different governments.' },
      explanation:{ es:'Cuando un mismo resultado se repite en países distintos, con historias y gobiernos distintos, la causa no puede estar solo en decisiones recientes ni en preferencias de las comunidades. Lo que se repite es la forma de repartir servicios y decisiones según territorio y origen, y eso se corrige con reglas, presupuesto y participación. Las otras opciones naturalizan la concentración urbana o atribuyen la exclusión a una elección de las propias comunidades.',
                    en:'When the same result repeats in different countries, with different histories and governments, the cause cannot lie only in recent decisions or in the preferences of the communities. What repeats is the way services and decisions are distributed according to territory and origin, and that is corrected with rules, budget and participation. The other options naturalize urban concentration or attribute the exclusion to a choice of the communities themselves.' } },
    { title:{ es:'La desigualdad de otros países', en:'Inequality in other countries' },
      stmt:{ es:'En una discusión sobre desigualdad en América Latina, alguien dice que lo que ocurre en otros países no le concierne, porque cada quien debe resolver lo suyo. ¿Qué argumento ético responde mejor a esa postura?',
             en:'In a discussion about inequality in Latin America, somebody says that what happens in other countries does not concern them, because each one should solve their own affairs. Which ethical argument best answers that position?' },
      options:{ es:[
        'La dignidad de las personas no depende de la frontera donde nacieron, y conocer respuestas que funcionaron en otros lugares mejora las decisiones propias.',
        'Los países de la región tienen acuerdos comerciales entre sí, y por eso lo que ocurre en uno termina afectando los precios de los demás.',
        'Ningún país de la región ha logrado resolver por completo sus desigualdades internas, así que la comparación no aporta nada útil.',
        'Las desigualdades de otros países son mucho más profundas que las propias y por eso conviene atender primero lo que sucede aquí.' ],
        en:[
        'The dignity of people does not depend on the border where they were born, and knowing responses that worked elsewhere improves your own decisions.',
        'The countries of the region have trade agreements with each other, and that is why what happens in one ends up affecting the prices of the others.',
        'No country in the region has completely solved its internal inequalities, so the comparison contributes nothing useful.',
        'The inequalities of other countries are much deeper than your own and that is why it is better to attend to what happens here first.' ] },
      correct:0,
      hint:{ es:'Busca la respuesta que se apoya en el valor de la persona y no solo en un interés práctico.',
             en:'Look for the answer that rests on the value of the person and not only on a practical interest.' },
      explanation:{ es:'El argumento ético parte de que la dignidad no se reparte por nacionalidad: una persona vale lo mismo aquí y del otro lado de una frontera. A eso se suma una razón práctica, porque las soluciones ensayadas en la región enseñan qué funciona. La opción comercial reduce el vínculo a los precios, y las otras dos usan la comparación para desestimar el problema o para posponerlo.',
                    en:'The ethical argument starts from the fact that dignity is not distributed by nationality: a person is worth the same here and on the other side of a border. To that a practical reason is added, because the solutions tried in the region teach what works. The commercial option reduces the link to prices, and the other two use the comparison to dismiss the problem or to postpone it.' } }
  ], rng), rng);
}
</script>

<!-- LIAXA ANALYTICS -->
<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbykkuJ_apGq3vALIFd4mr3acu81c7K4OKxW-DZ-i52Ceyl3lOanXMdvbS9SIXPrLQBm/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'Acción Ética para Reducir Desigualdades';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
</body>
