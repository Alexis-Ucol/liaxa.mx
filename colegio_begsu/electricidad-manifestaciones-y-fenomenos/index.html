<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Electricidad: Manifestaciones y Fenómenos</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
  --pos:        #b8442c;
  --neg:        #2f6fa8;
  --wire:       #6b6558;
  --glow:       #e8c15a;
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
  --pos:        #cf5a3e;
  --neg:        #4a8fcf;
  --wire:       #8a8272;
  --glow:       #a8843a;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; text-align: justify; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }

/* ── INTERACTIVE WIDGETS (concept manipulatives) ── */
.iw { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.1rem; margin:1rem 0 2.4rem; }
.iw-tag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.iw-task { font-size:.88rem; color:var(--text2); margin-bottom:.75rem; }
.iw-cv { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface2); }
.iw-cv canvas { display:block; width:100%; height:auto; }
.ctrl { margin:.7rem 0; }
.ctrl label { display:block; font-size:.75rem; color:var(--text3); margin-bottom:.25rem; }
.ctrl input[type=range] { width:100%; accent-color:var(--green); height:28px; }
.readout { display:grid; grid-template-columns:repeat(3,1fr); gap:.5rem; margin:.8rem 0; }
.ro { background:var(--surface2); border-radius:8px; padding:.5rem .35rem; text-align:center; }
.ro-l { font-size:.62rem; text-transform:uppercase; letter-spacing:.05em; color:var(--text3); }
.ro-v { font-family:'IBM Plex Mono',monospace; font-size:.9rem; font-weight:600; color:var(--green); }
.rverify-btn { background:var(--green); color:#fff; border:none; border-radius:8px; padding:.6rem 1.2rem; font-size:.84rem; font-weight:600; cursor:pointer; min-height:44px; }
.rverify-btn:hover { background:var(--green-dark); }
.rfb { font-size:.84rem; color:var(--text2); margin-top:.6rem; min-height:1.3rem; }
.okfb { color:var(--ok); font-weight:700; }
.sgnrow { display:flex; flex-wrap:wrap; gap:.5rem; align-items:center; margin:.55rem 0; }
.sgnlbl { font-size:.75rem; color:var(--text3); min-width:92px; }
.sgnbtn { min-height:44px; min-width:56px; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-family:inherit; font-size:1rem; font-weight:700; cursor:pointer; }
.sgnbtn.on { border-color:var(--green); background:var(--green-bg); color:var(--green-dark); }
.cls-card { display:block; text-align:center; font-weight:600; font-size:.92rem; background:var(--surface2); border:1.5px solid var(--border); border-radius:8px; padding:.8rem .6rem; margin:.6rem 0; }
.cls-prog { font-family:'IBM Plex Mono',monospace; font-size:.72rem; color:var(--text3); }
.cls-bins { display:flex; flex-wrap:wrap; gap:.5rem; margin:.7rem 0; }
.cls-bin { flex:1 1 140px; min-height:44px; border:1.5px solid var(--border); border-radius:8px; padding:.55rem .8rem; cursor:pointer; background:var(--surface2); color:var(--text); font-family:inherit; font-size:.86rem; font-weight:600; }
.cls-bin:hover { border-color:var(--green); background:var(--green-bg); }
.cls-done { font-weight:700; color:var(--ok); text-align:center; padding:.8rem; }
@media (max-width:600px) {
  .iw { padding:.8rem; }
  .readout { grid-template-columns:1fr 1fr; }
  .cls-bin { flex:1 1 100%; }
  .sgnlbl { min-width:100%; }
}
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Electricidad: Manifestaciones y Fenómenos</div>
    <div class="wcourse" id="wcourse-el">Física · 2° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">

function getAttemptKey(name, group){ return 'liaxa_fis2_t08_g01__att__' + (name+'__'+group).replace(/\s+/g,'_'); }
function nextAttempt(name, group){ var k=getAttemptKey(name,group),n=0; try{n=parseInt(localStorage.getItem(k)||'0',10)||0;}catch(e){} n++; try{localStorage.setItem(k,String(n));}catch(e){} return n; }

var studentData   = {};
var problems      = [];

/* ================================================
   SESSION PERSISTENCE  (localStorage)
   ================================================ */
function lsKey() {
  var n = (studentData.name  || '').trim();
  var g = (studentData.group || '').trim();
  return 'liaxa_fis2_t08_g01__' + (n + '__' + g).replace(/\s+/g, '_');
}

function saveSession() {
  if (!studentData.name) return;
  var drawings = [], texts = [], photos = [];
  problems.forEach(function(p, i) {
    var dc = document.getElementById('dc' + i);
    if (dc && dc.width) {
      var blank = document.createElement('canvas');
      blank.width = dc.width; blank.height = dc.height;
      drawings.push(dc.toDataURL() === blank.toDataURL() ? null : dc.toDataURL('image/png'));
    } else { drawings.push(null); }
    var ta = document.getElementById('ta' + i);
    texts.push(ta ? ta.value : '');
    var pp = document.getElementById('pp' + i);
    photos.push((pp && pp.src && pp.src.indexOf('data:') === 0) ? pp.src : null);
  });
  var state = {
    name: studentData.name, group: studentData.group,
    answeredCount: answeredCount, correctCount: correctCount,
    choices: problems.map(function(p) { return p.studentChoice; }),
    drawings: drawings, texts: texts, photos: photos
  };
  try { localStorage.setItem(lsKey(), JSON.stringify(state)); } catch(e) {}
}

function loadSession(name, group) {
  var key = 'liaxa_fis2_t08_g01__' + (name + '__' + group).replace(/\s+/g, '_');
  try { var r = localStorage.getItem(key); return r ? JSON.parse(r) : null; } catch(e) { return null; }
}

function restoreSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  var saved = loadSession(name, group);
  if (!saved) return;
  document.getElementById('restoreBar').style.display = 'none';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = currentAttempt(name, group);
  buildLesson(seededRng(name + group + att));
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
  saved.choices.forEach(function(choice, idx) {
    if (choice !== null && choice !== undefined) confirmMC(idx, choice);
  });
  setTimeout(function() {
    if (saved.drawings) {
      saved.drawings.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var dc = document.getElementById('dc' + i);
        if (!dc || !dc.width) return;
        var img = new Image();
        img.onload = function() {
          var dpr = window.devicePixelRatio || 1;
          dc.getContext('2d').drawImage(img, 0, 0, dc.width / dpr, dc.height / dpr);
        };
        img.src = dataUrl;
      });
    }
    if (saved.texts) {
      saved.texts.forEach(function(text, i) {
        if (!text) return;
        var ta = document.getElementById('ta' + i);
        if (ta) ta.value = text;
      });
    }
    if (saved.photos) {
      saved.photos.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var pp = document.getElementById('pp' + i);
        if (!pp) return;
        pp.src = dataUrl; pp.style.display = 'block';
        var pz = document.getElementById('pz' + i);
        if (pz) pz.style.opacity = '0.4';
      });
    }
  }, 300);
}

function dismissRestore() {
  document.getElementById('restoreBar').style.display = 'none';
}

function checkForSavedSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  if (!name || !group) { document.getElementById('restoreBar').style.display = 'none'; return; }
  var saved = loadSession(name, group);
  var bar = document.getElementById('restoreBar');
  bar.style.display = (saved && saved.choices && saved.choices.some(function(c){ return c !== null; })) ? 'block' : 'none';
}

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

async function generatePDF() {
  var btn = document.getElementById('dlBtn');
  btn.textContent = 'Generando PDF…';
  btn.disabled = true;

  var jspdf   = window.jspdf;
  var doc     = new jspdf.jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });
  var PW      = 215.9;
  var M       = 18;
  var TW      = PW - M * 2;
  var PH      = doc.internal.pageSize.height;
  var name    = studentData.name;
  var group   = studentData.group;
  var total   = problems.length;
  var pct     = Math.round(correctCount / total * 100);
  var dateStr = new Date().toLocaleString('es-MX', { dateStyle:'long', timeStyle:'short' });

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS — INJECTION BLOCK ─────────────────────────────────────────
  //   Match these RGB values to --green and --gold above.
  //   PRIMARY  → pBR, pBG, pBB
  //   ACCENT   → pAR, pAG, pAB
  // ──────────────────────────────────────────────────────────────────────────
  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;  // PRIMARY (from SCHOOL, Rule 16)
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;   // ACCENT (from SCHOOL, Rule 16)

  function pdfText(html) {
    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/\u2192/g,'->').replace(/\u2212/g,'-').replace(/\u00b2/g,'^2')
      .replace(/\u00b3/g,'^3').replace(/\u00d7/g,'x').replace(/\u00f7/g,'/')
      .replace(/\u2260/g,'!=').replace(/\u2264/g,'<=').replace(/\u2265/g,'>=')
      .replace(/\u221a/g,'sqrt').replace(/\u03c0/g,'pi').replace(/\u2026/g,'...')
      .replace(/\s+/g,' ').trim();
  }

  // ── PORTADA: orange line / white logo strip / orange line / blue band ──
  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,2,'F');   // top accent line
  doc.setFillColor(255,255,255); doc.rect(0,2,PW,26,'F');                               // white logo strip

  var lx = PW - M - 36;

/* ── PROBLEMA 5 · voltaje, corriente y resistencia ── */
function mkP5(rng){
  var v = rng() < 0.5 ? 0 : 1;
  if (v === 0) {
    var p = pick([[12, 2], [9, 3], [24, 4], [20, 4], [18, 2]], rng);
    var vo = p[0], cu = p[1], re = vo / cu;
    var o = [
      L({ es: re + ' Ω', en: re + ' Ω' }),
      L({ es: (vo * cu) + ' Ω', en: (vo * cu) + ' Ω' }),
      L({ es: (vo + cu) + ' Ω', en: (vo + cu) + ' Ω' }),
      L({ es: (vo - cu) + ' Ω', en: (vo - cu) + ' Ω' })
    ];
    return {
      title: L({ es: 'La resistencia del foco', en: 'The resistance of the bulb' }),
      showWork: true,
      q: L({ es: 'Un foco pequeño conectado a ' + vo + ' volts deja pasar una corriente de ' + cu + ' A. ¿Qué resistencia ofrece ese foco?',
             en: 'A small bulb connected to ' + vo + ' volts lets a current of ' + cu + ' A through. What resistance does that bulb offer?' }),
      options: o, correct: o[0],
      hint: L({ es: 'La resistencia mide cuánto le cuesta a la corriente pasar, y se obtiene repartiendo el voltaje aplicado entre la corriente que logró circular.',

               en: vo + ' volts shared over ' + cu + ' A give ' + re + ' ohms. The bigger the resistance, the less current the same voltage lets through.' })
    };

    }) + '</p>' +
    '<p>' + L({
      es: 'Al frotar dos materiales distintos, una parte de la carga negativa se pasa de uno al otro. El que la recibe queda negativo y el que la pierde queda positivo, siempre en la misma cantidad: frotar no fabrica carga, solo la cambia de lugar. Después manda una sola regla, y las fuerzas actúan a distancia, sin contacto.',
      en: 'When two different materials are rubbed, part of the negative charge passes from one to the other. The one that receives it ends up negative and the one that loses it ends up positive, always by the same amount: rubbing does not make charge, it only moves it. After that a single rule takes over, and the forces act at a distance, with no contact.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es: 'Cargas iguales', en: 'Equal charges' }), L({ es: 'se repelen', en: 'they repel' }), L({ es: 'dos cuerpos negativos, o dos positivos, se empujan a separarse', en: 'two negative bodies, or two positive ones, push each other apart' })) +
      rcard(L({ es: 'Cargas distintas', en: 'Different charges' }), L({ es: 'se atraen', en: 'they attract' }), L({ es: 'un cuerpo positivo y uno negativo se jalan uno al otro', en: 'a positive body and a negative one pull each other' })) +
      rcard(L({ es: 'Distancia', en: 'Distance' }), L({ es: 'cerca, más fuerte', en: 'closer, stronger' }), L({ es: 'la fuerza crece muy rápido al acercar los cuerpos y casi desaparece al alejarlos', en: 'the force grows very fast as the bodies get closer and almost vanishes as they move apart' })) +
    '</div>' +
    '<div class="callout"><p>' + L({
      es: 'En la mesa que sigue, elige el signo de cada esfera y deslízalas para acercarlas o alejarlas. Las flechas y el medidor te dicen en vivo hacia dónde y con cuánta fuerza se jalan.',
      en: 'On the table below, choose the sign of each sphere and slide them closer or farther apart. The arrows and the meter tell you live which way and how strongly they pull.'
    }) + '</p></div>'
  );
  wCarga(rng);
  addProb(mkP1(rng), rng);
  addProb(mkP2(rng), rng);

  /* ══ CONCEPTO 2 ══ */
  sec(
    L({ es: 'Concepto 2', en: 'Concept 2' }),
    L({ es: 'Conductores, aislantes y el circuito cerrado', en: 'Conductors, insulators and the closed circuit' }),
    '<p>' + L({
      es: 'La chispa del suéter dura un instante. Para tener electricidad útil hace falta que las cargas circulen sin parar, y eso solo ocurre en ciertos materiales. En los metales hay cargas libres que pueden viajar por todo el cuerpo del material: son los conductores. En el plástico, el vidrio o la madera seca las cargas están amarradas a sus átomos: son los aislantes.',
      en: 'The spark from the sweater lasts an instant. To have useful electricity the charges must flow without stopping, and that only happens in certain materials. In metals there are free charges that can travel through the whole body of the material: those are conductors. In plastic, glass or dry wood the charges are tied to their atoms: those are insulators.'
    }) + '</p>' +
    '<p>' + L({
      es: 'Un circuito es el camino cerrado por donde circulan esas cargas: una fuente que las empuja, conductores que las llevan y algo que aprovecha su paso. Si el camino se abre en cualquier punto, todo se detiene al instante. Por eso los cables domésticos son de cobre por dentro y de plástico por fuera: el cobre guía la corriente y el plástico la obliga a quedarse ahí.',
      en: 'A circuit is the closed path those charges travel along: a source that pushes them, conductors that carry them and something that takes advantage of their passage. If the path opens at any point, everything stops at once. That is why household cables are copper inside and plastic outside: copper guides the current and plastic forces it to stay there.'
    }) + '</p>' +
    '<div class="callout"><p>' + L({
      es: 'Abajo hay un circuito con un hueco. Cada material que aparece va a ocupar ese hueco: decide antes de probar si dejará circular la carga o no, y el foco te responderá.',
      en: 'Below there is a circuit with a gap. Each material shown will fill that gap: decide before testing whether it will let the charge flow or not, and the bulb will answer you.'
    }) + '</p></div>'
  );
  wCircuito(rng);
  addProb(mkP3(rng), rng);
  addProb(mkP4(rng), rng);

  /* ══ CONCEPTO 3 ══ */
  sec(
    L({ es: 'Concepto 3', en: 'Concept 3' }),
    L({ es: 'Voltaje, corriente y resistencia', en: 'Voltage, current and resistance' }),
    '<p>' + L({
      es: 'Tres cantidades describen lo que pasa en un circuito. El voltaje es el empuje que la fuente da a las cargas y se mide en volts. La corriente es cuánta carga cruza por segundo y se mide en amperes. La resistencia es el estorbo que el material opone a ese paso y se mide en ohms.',
      en: 'Three quantities describe what goes on in a circuit. Voltage is the push the source gives to the charges and is measured in volts. Current is how much charge crosses each second and is measured in amperes. Resistance is the hindrance the material puts up against that flow and is measured in ohms.'
    }) + '</p>' +
    '<p>' + L({
      es: 'Las tres están enlazadas: con la misma resistencia, más voltaje da más corriente; con el mismo voltaje, más resistencia da menos corriente. Un foco viejo brilla porque su filamento resiste mucho y se pone al rojo vivo; un cable de cobre casi no resiste y por eso se mantiene frío.',
      en: 'The three are linked: with the same resistance, more voltage gives more current; with the same voltage, more resistance gives less current. An old bulb glows because its filament resists a lot and gets red hot; a copper wire hardly resists and that is why it stays cool.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es: 'Voltaje', en: 'Voltage' }), L({ es: 'volt (V)', en: 'volt (V)' }), L({ es: 'el empuje que la fuente aplica sobre las cargas del circuito', en: 'the push the source applies on the charges of the circuit' })) +
      rcard(L({ es: 'Corriente', en: 'Current' }), L({ es: 'ampere (A)', en: 'ampere (A)' }), L({ es: 'la carga que cruza un punto del circuito en cada segundo', en: 'the charge crossing a point of the circuit each second' })) +
      rcard(L({ es: 'Resistencia', en: 'Resistance' }), L({ es: 'ohm (Ω)', en: 'ohm (Ω)' }), L({ es: 'lo que el material estorba al paso de esas cargas', en: 'how much the material hinders the passage of those charges' })) +
    '</div>' +
    '<div class="callout"><p>' + L({
      es: 'En el tablero siguiente mueves el voltaje y la resistencia, y el amperímetro y el brillo del foco responden al instante. Se te pedirá alcanzar una corriente exacta: hay varias combinaciones que sirven.',
      en: 'On the panel below you move voltage and resistance, and the ammeter and the brightness of the bulb answer at once. You will be asked to reach an exact current: several combinations work.'
    }) + '</p></div>'
  );
  wOhm(rng);
  addProb(mkP5(rng), rng);
  addProb(mkP6(rng), rng);

  /* ══ CONCEPTO 4 ══ */
  sec(
    L({ es: 'Concepto 4', en: 'Concept 4' }),
    L({ es: 'Lo que la corriente hace y lo que cuesta', en: 'What current does and what it costs' }),
    '<p>' + L({
      es: 'La corriente no se ve, pero sus efectos sí. Al pasar por un conductor lo calienta, y de ahí viven la parrilla, la plancha y el foco de filamento. Al pasar por ciertos materiales produce luz directamente, como en un foco de tipo LED. Y al pasar por una bobina genera efectos magnéticos que hacen girar los motores del ventilador o de la licuadora.',
      en: 'Current cannot be seen, but its effects can. Going through a conductor it heats it, and that is how the hotplate, the iron and the filament bulb live. Going through certain materials it produces light directly, as in an LED bulb. And going through a coil it produces magnetic effects that spin the motors of the fan or the blender.'
    }) + '</p>' +
    '<p>' + L({
      es: 'Cada aparato usa energía a su propio ritmo, y a ese ritmo se le llama potencia y se mide en watts. Un aparato de mucha potencia gasta más en cada segundo, pero el recibo no cobra segundos: cobra kilowatt hora, es decir potencia por tiempo de uso. Por eso un foco pequeño encendido toda la noche puede costar tanto como un aparato grande usado unos minutos.',
      en: 'Each appliance uses energy at its own rate, and that rate is called power and is measured in watts. A high power appliance spends more each second, but the bill does not charge seconds: it charges kilowatt hours, that is power times time of use. That is why a small bulb left on all night can cost as much as a big appliance used for a few minutes.'
    }) + '</p>'
  );
  addProb(mkP7(rng), rng);

  /* ══ CONCEPTO 5 ══ */
  sec(
    L({ es: 'Concepto 5', en: 'Concept 5' }),
    L({ es: 'Usar la electricidad sin salir lastimado', en: 'Using electricity without getting hurt' }),
    '<p>' + L({
      es: 'El cuerpo humano es conductor, sobre todo si está húmedo, así que puede volverse parte de un circuito sin quererlo. Los protocolos de seguridad no son reglas caprichosas: cada uno corta una de las formas en que la corriente llega a donde no debe.',
      en: 'The human body is a conductor, especially when damp, so it can become part of a circuit without meaning to. Safety protocols are not arbitrary rules: each one blocks one of the ways current reaches where it should not.'
    }) + '</p>' +
    '<p>' + L({
      es: 'Desconectar antes de reparar deja el circuito abierto. El aislante de los cables mantiene la corriente dentro. El fusible o el interruptor automático se abren cuando la corriente se pasa del límite. La conexión a tierra le da a una corriente perdida un camino mucho mejor que tu brazo. Y no sobrecargar una extensión evita que un solo cable tenga que llevar la corriente de varios aparatos.',
      en: 'Unplugging before repairing leaves the circuit open. The insulation of the wires keeps the current inside. The fuse or the automatic switch opens when the current goes past the limit. The earth connection gives a stray current a far better path than your arm. And not overloading an extension lead keeps a single cable from having to carry the current of several appliances.'
    }) + '</p>' +
    '<div class="callout"><p>' + L({
      es: 'Revisa la lista que sigue como si fueras la persona encargada de la seguridad del edificio y decide, caso por caso, qué situaciones representan un riesgo real.',
      en: 'Go over the list below as if you were the person in charge of safety in the building and decide, case by case, which situations are a real risk.'
    }) + '</p></div>'
  );
  wSeguridad(rng);
  addProb(mkP8(rng), rng);

  /* ══ CIERRE ══ */
  sec(
    L({ es: 'Cierre', en: 'Closing' }),
    L({ es: 'Todo junto', en: 'Everything together' }),
    '<p>' + L({
      es: 'Lo que sigue mezcla el circuito, la energía y el riesgo en situaciones nuevas.',
      en: 'What comes next mixes the circuit, the energy and the risk in new situations.'
    }) + '</p>'
  );
  addProb(mkP9(rng), rng);
  addProb(mkP10(rng), rng);
}

/* ══ MANIPULATIVO 1 · MESA DE CARGAS ═══════════════════════════════════════
   El alumno elige el signo de cada esfera y las acerca o aleja. El canvas
   dibuja en vivo las flechas de la fuerza y el medidor cambia al instante.
   Tres rondas con objetivos distintos; pistas direccionales y revelado al
   tercer intento fallido.
   ═══════════════════════════════════════════════════════════════════════════ */
function wCarga(rng){
  var host = iw('carga', 'wCarga');
  var DS = shuffle([3, 4, 5, 6, 8], rng).slice(0, 3);
  var KS = shuffle(['rep', 'atr', 'rep', 'atr', 'rep'], rng).slice(0, 3);
  var st = { a: 1, b: 1, d: 7, r: 0, tries: 0, done: false };
  function force(d){ return Math.round(1000 / (d * d)) / 10; }
  function tD(){ return DS[Math.min(st.r, DS.length - 1)]; }
  function tK(){ return KS[Math.min(st.r, KS.length - 1)]; }
  function kind(){ return (st.a === st.b) ? 'rep' : 'atr'; }
  function kindTxt(k){ return (k === 'rep') ? L({ es: 'repulsión', en: 'repulsion' }) : L({ es: 'atracción', en: 'attraction' }); }

  host.innerHTML =
    '<div class="iw-tag">' + L({ es: 'Mesa de cargas', en: 'Charge table' }) + '</div>' +
    '<div class="iw-task iw-sub" id="wCargaTask"></div>' +
    '<div class="iw-cv"><canvas id="wCargaCv"></canvas></div>' +
    '<div class="sgnrow"><span class="sgnlbl">' + L({ es: 'Esfera izquierda', en: 'Left sphere' }) + '</span>' +
      '<button class="sgnbtn" id="wCargaA1" onclick="wCargaSet(\'a\',1)">+</button>' +
      '<button class="sgnbtn" id="wCargaA0" onclick="wCargaSet(\'a\',0)">−</button></div>' +
    '<div class="sgnrow"><span class="sgnlbl">' + L({ es: 'Esfera derecha', en: 'Right sphere' }) + '</span>' +
      '<button class="sgnbtn" id="wCargaB1" onclick="wCargaSet(\'b\',1)">+</button>' +
      '<button class="sgnbtn" id="wCargaB0" onclick="wCargaSet(\'b\',0)">−</button></div>' +
    '<div class="ctrl"><label>' + L({ es: 'Distancia entre centros', en: 'Distance between centres' }) + ': <b id="wCargaDL"></b> cm</label>' +
      '<input type="range" id="wCargaD" min="2" max="10" step="1" value="' + st.d + '" oninput="wCargaIn()"></div>' +
    '<div class="readout">' +
      '<div class="ro"><div class="ro-l">' + L({ es: 'Tipo de fuerza', en: 'Kind of force' }) + '</div><div class="ro-v" id="wCargaK"></div></div>' +
      '<div class="ro"><div class="ro-l">' + L({ es: 'Fuerza', en: 'Force' }) + '</div><div class="ro-v" id="wCargaF"></div></div>' +
      '<div class="ro"><div class="ro-l">' + L({ es: 'Objetivo', en: 'Target' }) + '</div><div class="ro-v" id="wCargaT"></div></div>' +
    '</div>' +
    '<button class="rverify-btn" onclick="wCargaCheck()">' + L({ es: 'Comprobar', en: 'Check' }) + '</button>' +
    '<div class="rfb" id="wCargaFb"></div>';

  function draw(){
    var cv = document.getElementById('wCargaCv');
    if (!cv) return;
    var rect = cv.getBoundingClientRect();
    var dpr = window.devicePixelRatio || 1;
    var W = Math.round(rect.width || 320), H = 170;
    cv.width = W * dpr; cv.height = H * dpr;
    var c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, W, H);
    var mid = W / 2, cy = H / 2 - 6, rad = 21;
    var half = 26 + (st.d - 2) * ((W * 0.34 - 26) / 8);
    var xa = mid - half, xb = mid + half;
    c.strokeStyle = CV('--border'); c.lineWidth = 2;
    c.beginPath(); c.moveTo(14, cy + rad + 20); c.lineTo(W - 14, cy + rad + 20); c.stroke();
    var f = force(st.d), len = Math.min(f, 25) / 25 * 44 + 8;
    var at = (kind() === 'atr');
    function arrow(x0, dir){
      c.strokeStyle = CV('--gold'); c.fillStyle = CV('--gold'); c.lineWidth = 3;
      var x1 = x0 + dir * len;
      c.beginPath(); c.moveTo(x0, cy); c.lineTo(x1, cy); c.stroke();
      c.beginPath(); c.moveTo(x1 + dir * 8, cy); c.lineTo(x1, cy - 6); c.lineTo(x1, cy + 6); c.closePath(); c.fill();
    }
    arrow(xa - rad - 4, at ? 1 : -1);
    arrow(xb + rad + 4, at ? -1 : 1);
    [[xa, st.a], [xb, st.b]].forEach(function(p){
      c.beginPath(); c.arc(p[0], cy, rad, 0, Math.PI * 2);
      c.fillStyle = p[1] === 1 ? CV('--pos') : CV('--neg'); c.fill();
      c.strokeStyle = CV('--border'); c.lineWidth = 2; c.stroke();
      c.fillStyle = CV('--surface');
      c.font = 'bold 22px IBM Plex Sans, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillText(p[1] === 1 ? '+' : '−', p[0], cy + 1);
    });
    c.fillStyle = CV('--text2'); c.font = '12px IBM Plex Sans, sans-serif'; c.textAlign = 'center';
    c.fillText(st.d + ' cm', mid, cy + rad + 36);
    c.textAlign = 'left';
    c.fillText(kindTxt(kind()), 14, 18);
  }
  function paint(){
    document.getElementById('wCargaDL').textContent = st.d;
    document.getElementById('wCargaK').textContent = kindTxt(kind());
    document.getElementById('wCargaF').textContent = num(force(st.d));
    document.getElementById('wCargaT').textContent = st.done ? L({ es: 'libre', en: 'free' }) : (kindTxt(tK()) + ' ' + num(force(tD())));
    document.getElementById('wCargaA1').classList.toggle('on', st.a === 1);
    document.getElementById('wCargaA0').classList.toggle('on', st.a === 0);
    document.getElementById('wCargaB1').classList.toggle('on', st.b === 1);
    document.getElementById('wCargaB0').classList.toggle('on', st.b === 0);
    document.getElementById('wCargaTask').textContent = st.done
      ? L({ es: 'Mesa libre: prueba cualquier combinación de signos y distancias y observa cómo cambia la fuerza.',
            en: 'Free table: try any combination of signs and distances and watch how the force changes.' })
      : L({ es: 'Reto ' + (st.r + 1) + ' de 3: consigue una fuerza de ' + kindTxt(tK()) + ' que marque ' + num(force(tD())) + ' unidades.',
            en: 'Challenge ' + (st.r + 1) + ' of 3: get a force of ' + kindTxt(tK()) + ' reading ' + num(force(tD())) + ' units.' });
    draw();
  }
  window.wCargaSet = function(which, val){
    if (which === 'a') st.a = val; else st.b = val;
    paint();
  };
  window.wCargaIn = function(){
    st.d = parseInt(document.getElementById('wCargaD').value, 10);
    paint();
  };
  window.wCargaCheck = function(){
    var fb = document.getElementById('wCargaFb');
    if (st.done) { fb.textContent = L({ es: 'Fuerza actual: ' + num(force(st.d)) + ' unidades de ' + kindTxt(kind()) + '.',
                                        en: 'Current force: ' + num(force(st.d)) + ' units of ' + kindTxt(kind()) + '.' }); return; }
    var okK = (kind() === tK()), f = force(st.d), tf = force(tD());
    if (okK && Math.abs(f - tf) < 0.05) {
      st.r++; st.tries = 0;
      if (st.r >= DS.length) st.done = true;
      paint();
      fb.innerHTML = '<span class="okfb">🎉 ' + (st.done
        ? L({ es: 'Los tres retos resueltos. Ya manejas el signo y la distancia a voluntad.', en: 'All three challenges solved. You now handle sign and distance at will.' })
        : L({ es: 'Exacto. Signos y distancia quedaron justo como se pedía. Va el siguiente reto.', en: 'Exactly. Signs and distance came out just as asked. Here comes the next challenge.' })) + '</span>';
      return;
    }
    st.tries++;
    if (st.tries >= 3) {
      st.d = tD();
      if (tK() === 'rep') { st.a = 1; st.b = 1; } else { st.a = 1; st.b = 0; }
      document.getElementById('wCargaD').value = st.d;
      var msg = L({ es: 'Con esos signos hay ' + kindTxt(tK()) + ', y a ' + tD() + ' cm la fuerza marca ' + num(tf) + '. Fíjate que al reducir la distancia a la mitad la fuerza se hace cuatro veces mayor.',
                    en: 'With those signs there is ' + kindTxt(tK()) + ', and at ' + tD() + ' cm the force reads ' + num(tf) + '. Notice that halving the distance makes the force four times bigger.' });
      st.r++; st.tries = 0;
      if (st.r >= DS.length) st.done = true;
      paint();
      fb.textContent = msg;
      return;
    }
    if (!okK) {
      fb.textContent = (tK() === 'rep')
        ? L({ es: 'Ahora las esferas se atraen y se pide que se rechacen: ponles el mismo signo a las dos.',
              en: 'Right now the spheres attract and repulsion is asked for: give both of them the same sign.' })
        : L({ es: 'Ahora las esferas se rechazan y se pide que se jalen: ponles signos distintos.',
              en: 'Right now the spheres repel and attraction is asked for: give them different signs.' });
      return;
    }
    fb.textContent = (f < tf)
      ? L({ es: 'El tipo de fuerza ya es el correcto, pero marca ' + num(f) + ' y se pide ' + num(tf) + ': acércalas.',
            en: 'The kind of force is right, but it reads ' + num(f) + ' and ' + num(tf) + ' is asked for: bring them closer.' })
      : L({ es: 'El tipo de fuerza ya es el correcto, pero marca ' + num(f) + ' y se pide ' + num(tf) + ': sepáralas.',
            en: 'The kind of force is right, but it reads ' + num(f) + ' and ' + num(tf) + ' is asked for: move them apart.' });
  };
  paint();
  setTimeout(draw, 200);
  setTimeout(draw, 800);
}

/* ══ MANIPULATIVO 2 · PROBADOR DE MATERIALES ═══════════════════════════════
   Un circuito con un hueco. El alumno predice si el material colocado deja
   circular la carga; el foco del canvas responde y explica. Reintentos con
   pista direccional y revelado al tercer fallo.
   ═══════════════════════════════════════════════════════════════════════════ */
function wCircuito(rng){
  var host = iw('conductores', 'wCircuito');
  var MATS = shuffle([
    { es: 'alambre de cobre', en: 'copper wire', c: 1,
      hs: 'Los metales tienen cargas libres que recorren todo el material.', he: 'Metals have free charges that travel through the whole material.' },
    { es: 'regla de plástico', en: 'plastic ruler', c: 0,
      hs: 'En el plástico las cargas están amarradas a sus átomos y no viajan.', he: 'In plastic the charges are tied to their atoms and do not travel.' },
    { es: 'agua con bastante sal', en: 'water with plenty of salt', c: 1,
      hs: 'La sal disuelta deja partículas con carga libres de moverse por el líquido.', he: 'Dissolved salt leaves charged particles free to move through the liquid.' },
    { es: 'palito de madera seca', en: 'dry wooden stick', c: 0,
      hs: 'La madera seca no ofrece cargas libres; mojada sería otra historia.', he: 'Dry wood offers no free charges; wet it would be another story.' },
    { es: 'mina de grafito del lápiz', en: 'graphite pencil lead', c: 1,
      hs: 'El grafito no es metal, pero también tiene cargas que se desplazan.', he: 'Graphite is not a metal, yet it also has charges that move.' },
    { es: 'liga de hule', en: 'rubber band', c: 0,
      hs: 'El hule se usa justo para cubrir cables y detener la corriente.', he: 'Rubber is used exactly to cover cables and stop the current.' }
  ], rng);
  var st = { i: 0, tries: 0, hits: 0, done: false, lit: null };

  function draw(){
    var cv = document.getElementById('wCircuitoCv');
    if (!cv) return;
    var rect = cv.getBoundingClientRect();
    var dpr = window.devicePixelRatio || 1;
    var W = Math.round(rect.width || 320), H = 170;
    cv.width = W * dpr; cv.height = H * dpr;
    var c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, W, H);
    var x0 = 22, x1 = W - 22, y0 = 30, y1 = H - 32, gy = (y0 + y1) / 2;
    c.strokeStyle = CV('--wire'); c.lineWidth = 4; c.lineJoin = 'round';
    c.beginPath();
    c.moveTo(W / 2 - 34, y0); c.lineTo(x0, y0); c.lineTo(x0, gy - 18);
    c.moveTo(x0, gy + 18); c.lineTo(x0, y1); c.lineTo(W / 2 - 30, y1);
    c.moveTo(W / 2 + 30, y1); c.lineTo(x1, y1); c.lineTo(x1, y0); c.lineTo(W / 2 + 34, y0);
    c.stroke();
    c.fillStyle = CV('--surface2'); c.strokeStyle = CV('--border'); c.lineWidth = 2;
    c.beginPath(); c.rect(W / 2 - 30, y1 - 13, 60, 26); c.fill(); c.stroke();
    c.fillStyle = CV('--text2'); c.font = 'bold 13px IBM Plex Sans, sans-serif';
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText('+   −', W / 2, y1);
    var on = (st.lit === true);
    c.beginPath(); c.arc(W / 2, y0, 17, 0, Math.PI * 2);
    c.fillStyle = on ? CV('--glow') : CV('--surface2'); c.fill();
    c.strokeStyle = on ? CV('--gold') : CV('--border'); c.lineWidth = 2; c.stroke();
    if (on) {
      c.strokeStyle = CV('--gold'); c.lineWidth = 2;
      for (var k = 0; k < 8; k++) {
        var an = k * Math.PI / 4;
        c.beginPath();
        c.moveTo(W / 2 + Math.cos(an) * 22, y0 + Math.sin(an) * 22);
        c.lineTo(W / 2 + Math.cos(an) * 29, y0 + Math.sin(an) * 29);
        c.stroke();
      }
    }
    c.fillStyle = CV('--surface'); c.strokeStyle = CV('--gold'); c.lineWidth = 2;
    c.beginPath(); c.rect(x0 - 9, gy - 16, 18, 32); c.fill(); c.stroke();
    c.fillStyle = CV('--text2'); c.font = '12px IBM Plex Sans, sans-serif'; c.textAlign = 'left';
    var lbl = st.done ? L({ es: 'hueco libre', en: 'gap free' }) : MATS[st.i][LANG];
    c.fillText(lbl, x0 + 16, gy);
    c.textAlign = 'center';
    if (st.lit === false) { c.fillStyle = CV('--text3'); c.fillText(L({ es: 'apagado', en: 'off' }), W / 2, y0 + 40); }
    if (st.lit === true)  { c.fillStyle = CV('--ok');    c.fillText(L({ es: 'encendido', en: 'on' }), W / 2, y0 + 40); }
  }
  function render(){
    if (st.done) {
      host.innerHTML = '<div class="iw-tag">' + L({ es: 'Probador de materiales', en: 'Material tester' }) + '</div>' +
        '<div class="cls-done">🎉 ' + L({ es: 'Probaste los ' + MATS.length + ' materiales. Aciertos a la primera: ' + st.hits + '.',
                                                    en: 'You tested all ' + MATS.length + ' materials. First try hits: ' + st.hits + '.' }) + '</div>';
      return;
    }
    host.innerHTML =
      '<div class="iw-tag">' + L({ es: 'Probador de materiales', en: 'Material tester' }) + '</div>' +
      '<div class="iw-task iw-sub">' + L({ es: 'Vas a colocar cada material en el hueco del circuito. Decide primero qué hará el foco y compruébalo.',
                                           en: 'You will place each material in the gap of the circuit. Decide first what the bulb will do and check it.' }) + '</div>' +
      '<div class="cls-prog">' + (st.i + 1) + ' / ' + MATS.length + '</div>' +
      '<div class="cls-card">' + MATS[st.i][LANG] + '</div>' +
      '<div class="iw-cv"><canvas id="wCircuitoCv"></canvas></div>' +
      '<div class="cls-bins">' +
        '<button class="cls-bin" onclick="wCircuitoPick(1)">' + L({ es: 'Deja pasar la corriente', en: 'Lets the current through' }) + '</button>' +
        '<button class="cls-bin" onclick="wCircuitoPick(0)">' + L({ es: 'No deja pasar la corriente', en: 'Blocks the current' }) + '</button>' +
      '</div>' +
      '<div class="rfb" id="wCircuitoFb"></div>';
    setTimeout(draw, 60);
  }
  window.wCircuitoPick = function(choice){
    if (st.done) return;
    var it = MATS[st.i];
    if (choice === it.c) {
      if (st.tries === 0) st.hits++;
      st.lit = (it.c === 1);
      draw();
      document.getElementById('wCircuitoFb').innerHTML = '<span class="okfb">✓ ' +
        L({ es: (it.c === 1 ? 'El foco enciende. ' : 'El foco sigue apagado. ') + (LANG === 'es' ? it.hs : it.he),
            en: (it.c === 1 ? 'The bulb lights. ' : 'The bulb stays off. ') + (LANG === 'es' ? it.hs : it.he) }) + '</span>';
      setTimeout(function(){
        st.i++; st.tries = 0; st.lit = null;
        if (st.i >= MATS.length) st.done = true;
        render();
      }, 1500);
      return;
    }
    st.tries++;
    var fb = document.getElementById('wCircuitoFb');
    if (st.tries >= 3) {
      st.lit = (it.c === 1);
      draw();
      fb.textContent = L({ es: (it.c === 1 ? 'Sí deja pasar la corriente: el foco enciende. ' : 'No deja pasar la corriente: el foco se queda apagado. ') + (LANG === 'es' ? it.hs : it.he),
                           en: (it.c === 1 ? 'It does let the current through: the bulb lights. ' : 'It does not let the current through: the bulb stays off. ') + (LANG === 'es' ? it.hs : it.he) });
      setTimeout(function(){
        st.i++; st.tries = 0; st.lit = null;
        if (st.i >= MATS.length) st.done = true;
        render();
      }, 2200);
      return;
    }
    fb.textContent = L({ es: 'Todavía no. Pregúntate si dentro de ese material hay cargas que puedan moverse de un extremo al otro.',
                         en: 'Not yet. Ask yourself whether inside that material there are charges able to move from one end to the other.' });
  };
  render();
}

/* ══ MANIPULATIVO 3 · TABLERO DE CORRIENTE ═════════════════════════════════
   Dos deslizadores, voltaje y resistencia, mueven en vivo la aguja del
   amperímetro y el brillo del foco. Tres rondas con corriente objetivo.
   ═══════════════════════════════════════════════════════════════════════════ */
function wOhm(rng){
  var host = iw('ohm', 'wOhm');
  var TG = shuffle([2, 3, 4, 6, 8], rng).slice(0, 3);
  var st = { v: 12, r: 6, ro: 0, tries: 0, done: false };
  function cur(){ return st.v / st.r; }
  function tgt(){ return TG[Math.min(st.ro, TG.length - 1)]; }

  host.innerHTML =
    '<div class="iw-tag">' + L({ es: 'Tablero de corriente', en: 'Current panel' }) + '</div>' +
    '<div class="iw-task iw-sub" id="wOhmTask"></div>' +
    '<div class="iw-cv"><canvas id="wOhmCv"></canvas></div>' +
    '<div class="ctrl"><label>' + L({ es: 'Voltaje de la fuente', en: 'Source voltage' }) + ': <b id="wOhmVL"></b> V</label>' +
      '<input type="range" id="wOhmV" min="3" max="24" step="3" value="' + st.v + '" oninput="wOhmIn()"></div>' +
    '<div class="ctrl"><label>' + L({ es: 'Resistencia conectada', en: 'Connected resistance' }) + ': <b id="wOhmRL"></b> Ω</label>' +
      '<input type="range" id="wOhmR" min="1" max="12" step="1" value="' + st.r + '" oninput="wOhmIn()"></div>' +
    '<div class="readout">' +
      '<div class="ro"><div class="ro-l">' + L({ es: 'Corriente', en: 'Current' }) + '</div><div class="ro-v" id="wOhmI"></div></div>' +
      '<div class="ro"><div class="ro-l">' + L({ es: 'Brillo', en: 'Brightness' }) + '</div><div class="ro-v" id="wOhmB"></div></div>' +
      '<div class="ro"><div class="ro-l">' + L({ es: 'Objetivo', en: 'Target' }) + '</div><div class="ro-v" id="wOhmT"></div></div>' +
    '</div>' +
    '<button class="rverify-btn" onclick="wOhmCheck()">' + L({ es: 'Comprobar', en: 'Check' }) + '</button>' +
    '<div class="rfb" id="wOhmFb"></div>';

  function draw(){
    var cv = document.getElementById('wOhmCv');
    if (!cv) return;
    var rect = cv.getBoundingClientRect();
    var dpr = window.devicePixelRatio || 1;
    var W = Math.round(rect.width || 320), H = 175;
    cv.width = W * dpr; cv.height = H * dpr;
    var c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, W, H);
    var i = cur(), fr = Math.min(i / 12, 1);
    var gx = W * 0.3, gy = H - 26, rr = Math.min(W * 0.24, 72);
    c.strokeStyle = CV('--border'); c.lineWidth = 8;
    c.beginPath(); c.arc(gx, gy, rr, Math.PI, 0); c.stroke();
    c.strokeStyle = CV('--green'); c.lineWidth = 8;
    c.beginPath(); c.arc(gx, gy, rr, Math.PI, Math.PI + Math.PI * fr); c.stroke();
    var an = Math.PI + Math.PI * fr;
    c.strokeStyle = CV('--gold'); c.lineWidth = 3;
    c.beginPath(); c.moveTo(gx, gy); c.lineTo(gx + Math.cos(an) * (rr - 12), gy + Math.sin(an) * (rr - 12)); c.stroke();
    c.fillStyle = CV('--text2'); c.font = '12px IBM Plex Sans, sans-serif'; c.textAlign = 'center';
    c.fillText(num(i) + ' A', gx, gy + 16);
    var bx = W * 0.76, by = H * 0.44, br = Math.min(W * 0.11, 26);
    if (fr > 0) {
      c.strokeStyle = CV('--gold'); c.lineWidth = 2;
      for (var k = 0; k < 10; k++) {
        var a2 = k * Math.PI / 5;
        c.beginPath();
        c.moveTo(bx + Math.cos(a2) * (br + 5), by + Math.sin(a2) * (br + 5));
        c.lineTo(bx + Math.cos(a2) * (br + 5 + 16 * fr), by + Math.sin(a2) * (br + 5 + 16 * fr));
        c.stroke();
      }
    }
    c.beginPath(); c.arc(bx, by, br, 0, Math.PI * 2);
    c.fillStyle = fr > 0.05 ? CV('--glow') : CV('--surface2'); c.fill();
    c.strokeStyle = CV('--border'); c.lineWidth = 2; c.stroke();
    c.fillStyle = CV('--text2'); c.textAlign = 'center';
    c.fillText(st.v + ' V  ·  ' + st.r + ' Ω', bx, H - 14);
  }
  function paint(){
    document.getElementById('wOhmVL').textContent = st.v;
    document.getElementById('wOhmRL').textContent = st.r;
    document.getElementById('wOhmI').textContent = num(cur()) + ' A';
    var b = Math.round(Math.min(cur() / 12, 1) * 100);
    document.getElementById('wOhmB').textContent = b + '%';
    document.getElementById('wOhmT').textContent = st.done ? L({ es: 'libre', en: 'free' }) : (tgt() + ' A');
    document.getElementById('wOhmTask').textContent = st.done
      ? L({ es: 'Tablero libre: mueve los deslizadores y observa qué parejas dan la misma corriente.',
            en: 'Free panel: move the sliders and watch which pairs give the same current.' })
      : L({ es: 'Ronda ' + (st.ro + 1) + ' de 3: ajusta el voltaje y la resistencia hasta que el amperímetro marque ' + tgt() + ' A.',
            en: 'Round ' + (st.ro + 1) + ' of 3: set voltage and resistance until the ammeter reads ' + tgt() + ' A.' });
    draw();
  }
  window.wOhmIn = function(){
    st.v = parseInt(document.getElementById('wOhmV').value, 10);
    st.r = parseInt(document.getElementById('wOhmR').value, 10);
    paint();
  };
  window.wOhmCheck = function(){
    var fb = document.getElementById('wOhmFb');
    if (st.done) { fb.textContent = L({ es: 'Corriente actual: ' + num(cur()) + ' A.', en: 'Current now: ' + num(cur()) + ' A.' }); return; }
    var i = cur(), tg = tgt();
    if (Math.abs(i - tg) < 0.02) {
      st.ro++; st.tries = 0;
      if (st.ro >= TG.length) st.done = true;
      paint();
      fb.innerHTML = '<span class="okfb">🎉 ' + (st.done
        ? L({ es: 'Las tres rondas resueltas. Ya sabes fabricar la corriente que te pidan.', en: 'All three rounds solved. You can now build any current you are asked for.' })
        : L({ es: 'Justo la corriente pedida. Otra pareja de valores habría servido igual.', en: 'Exactly the current asked for. Another pair of values would have worked just as well.' })) + '</span>';
      return;
    }
    st.tries++;
    if (st.tries >= 3) {
      var rr = 3, vv = tg * 3;
      st.v = vv; st.r = rr;
      document.getElementById('wOhmV').value = vv;
      document.getElementById('wOhmR').value = rr;
      var msg = L({ es: 'Con ' + vv + ' V sobre ' + rr + ' Ω el amperímetro marca ' + tg + ' A: el voltaje repartido entre la resistencia da la corriente.',
                    en: 'With ' + vv + ' V across ' + rr + ' Ω the ammeter reads ' + tg + ' A: the voltage shared over the resistance gives the current.' });
      st.ro++; st.tries = 0;
      if (st.ro >= TG.length) st.done = true;
      paint();
      fb.textContent = msg;
      return;
    }
    fb.textContent = (i < tg)
      ? L({ es: 'Marca ' + num(i) + ' A y falta llegar a ' + tg + ' A: sube el voltaje o baja la resistencia.',
            en: 'It reads ' + num(i) + ' A and ' + tg + ' A is still missing: raise the voltage or lower the resistance.' })
      : L({ es: 'Marca ' + num(i) + ' A y se pasa de ' + tg + ' A: baja el voltaje o sube la resistencia.',
            en: 'It reads ' + num(i) + ' A and goes past ' + tg + ' A: lower the voltage or raise the resistance.' });
  };
  paint();
  setTimeout(draw, 200);
  setTimeout(draw, 800);
}

/* ══ MANIPULATIVO 4 · REVISIÓN DE SEGURIDAD ════════════════════════════════
   El alumno clasifica situaciones domésticas en riesgo o práctica segura,
   con pista direccional y explicación al revelar.
   ═══════════════════════════════════════════════════════════════════════════ */
function wSeguridad(rng){
  var host = iw('seguridad', 'wSeguridad');
  var BINS = [L({ es: 'Riesgo eléctrico', en: 'Electrical risk' }), L({ es: 'Práctica segura', en: 'Safe practice' })];
  var ITEMS = shuffle([
    { es: 'Cambiar un foco fundido sin apagar antes el apagador de ese circuito', en: 'Changing a blown bulb without first switching off that circuit', bin: 0,
      ws: 'El casquillo queda con voltaje y el cuerpo puede cerrar el circuito.', we: 'The socket stays live and the body can close the circuit.' },
    { es: 'Cubrir con cinta aislante el empalme de dos cables reparados', en: 'Covering the joint of two repaired wires with insulating tape', bin: 1,
      ws: 'El aislante mantiene la corriente dentro del cable.', we: 'The insulation keeps the current inside the cable.' },
    { es: 'Conectar tres aparatos de mucha potencia en la misma extensión delgada', en: 'Plugging three high power appliances into the same thin extension lead', bin: 0,
      ws: 'Las corrientes se suman en un cable que no fue hecho para tanto.', we: 'The currents add up in a cable that was not made for so much.' },
    { es: 'Desconectar la licuadora de la toma antes de lavar el vaso', en: 'Unplugging the blender from the outlet before washing the jar', bin: 1,
      ws: 'Con el circuito abierto no hay corriente que pueda pasar al agua.', we: 'With the circuit open there is no current that can reach the water.' },
    { es: 'Sustituir el fusible fundido por un alambre grueso para que ya no se funda', en: 'Replacing the blown fuse with a thick wire so it stops melting', bin: 0,
      ws: 'Se quita la protección y el cable de la casa pasa a ser el punto débil.', we: 'The protection is removed and the house wiring becomes the weak point.' },
    { es: 'Revisar que los aparatos grandes estén conectados a una toma con tierra', en: 'Checking that big appliances are plugged into an earthed outlet', bin: 1,
      ws: 'La tierra le ofrece a una corriente perdida un camino mejor que el cuerpo.', we: 'The earth gives a stray current a better path than the body.' }
  ], rng);
  var st = { i: 0, tries: 0, hits: 0, done: false };

  function render(){
    if (st.done) {
      host.innerHTML = '<div class="iw-tag">' + L({ es: 'Revisión de seguridad', en: 'Safety check' }) + '</div>' +
        '<div class="cls-done">🎉 ' + L({ es: 'Revisión terminada. Casos resueltos a la primera: ' + st.hits + ' de ' + ITEMS.length + '.',
                                                    en: 'Check finished. Cases solved on the first try: ' + st.hits + ' of ' + ITEMS.length + '.' }) + '</div>';
      return;
    }
    var it = ITEMS[st.i];
    host.innerHTML =
      '<div class="iw-tag">' + L({ es: 'Revisión de seguridad', en: 'Safety check' }) + '</div>' +
      '<div class="iw-task iw-sub">' + L({ es: 'Lee cada situación de una casa y decide si representa un riesgo o una práctica segura.',
                                           en: 'Read each household situation and decide whether it is a risk or a safe practice.' }) + '</div>' +
      '<div class="cls-prog">' + (st.i + 1) + ' / ' + ITEMS.length + '</div>' +
      '<div class="cls-card">' + it[LANG] + '</div>' +
      '<div class="cls-bins">' + BINS.map(function(b, bi){
        return '<button class="cls-bin" onclick="wSegPick(' + bi + ')">' + b + '</button>';
      }).join('') + '</div>' +
      '<div class="rfb" id="wSegFb"></div>';
  }
  window.wSegPick = function(bi){
    if (st.done) return;
    var it = ITEMS[st.i], fb = document.getElementById('wSegFb');
    if (bi === it.bin) {
      if (st.tries === 0) st.hits++;
      fb.innerHTML = '<span class="okfb">✓ ' + (LANG === 'es' ? it.ws : it.we) + '</span>';
      setTimeout(function(){
        st.i++; st.tries = 0;
        if (st.i >= ITEMS.length) st.done = true;
        render();
      }, 1500);
      return;
    }
    st.tries++;
    if (st.tries >= 3) {
      fb.innerHTML = L({ es: 'Era ' + BINS[it.bin].toLowerCase() + '. ', en: 'It was ' + BINS[it.bin].toLowerCase() + '. ' }) + (LANG === 'es' ? it.ws : it.we);
      setTimeout(function(){
        st.i++; st.tries = 0;
        if (st.i >= ITEMS.length) st.done = true;
        render();
      }, 2200);
      return;
    }
    fb.textContent = L({ es: 'Vuelve a pensarlo: pregúntate si en esa situación la corriente puede llegar al cuerpo o a un cable que no la aguanta.',
                         en: 'Think again: ask yourself whether in that situation the current can reach the body or a cable that cannot take it.' });
  };
  render();
}

</script>
