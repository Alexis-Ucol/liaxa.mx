<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medidas de Dispersión | Facultad de Economía, Universidad de Colima</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS (fallback; runtime applyBranding always wins) ────────── */
:root {
  --green:      #4a7c3f;
  --green-dark: #2d5a27;
  --green-bg:   #eaf0e7;
  --gold:       #c9a84c;
  --gold-bg:    #faf3e0;
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #6aaa5f;
  --green-dark: #8ecf82;
  --green-bg:   #1a281a;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; max-width:42%; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; font-family:inherit; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--green-bg); border:1.5px solid var(--green); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--green-dark); text-align:left; }
#restoreBar strong { color:var(--green-dark); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; font-family:inherit; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; object-fit:contain; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; overflow:hidden; text-overflow:ellipsis; max-width:150px; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; font-family:inherit; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── LANGUAGE TOGGLE ── */
.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); overflow-x:auto; }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH / WIDGET CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; font-family:inherit; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── INTERACTIVE WIDGETS ── */
.iw-h { font-family:'Crimson Pro',serif; font-size:1.1rem; font-weight:700; margin-bottom:.15rem; }
.iw-sub { font-size:.78rem; color:var(--text3); margin-bottom:.9rem; }
.iw-row { display:flex; flex-wrap:wrap; align-items:center; gap:.35rem; margin-bottom:.5rem; padding-bottom:.5rem; border-bottom:1px solid var(--border); }
.iw-var { flex:1 1 170px; font-size:.82rem; color:var(--text2); }
.iw-note { font-size:.78rem; color:var(--text2); margin-top:.7rem; }
.iw-flag { font-size:.8rem; font-weight:600; color:var(--green-dark); background:var(--green-bg); border-radius:8px; padding:.5rem .75rem; margin-top:.7rem; }

/* ── DOT STRIP (dispersion visual) ── */
.dstrip { position:relative; height:58px; background:var(--surface2); border-radius:8px; margin:.6rem 0 .2rem; overflow:hidden; }
.dline { position:absolute; left:2%; right:2%; top:50%; height:2px; background:var(--border); }
.ddot { position:absolute; top:50%; width:13px; height:13px; margin:-6.5px 0 0 -6.5px; border-radius:50%; background:var(--green); opacity:.7; }
.dmean { position:absolute; top:9px; bottom:9px; width:2px; margin-left:-1px; background:var(--gold); }
.dscale { display:flex; justify-content:space-between; font-size:.6rem; color:var(--text3); font-family:'IBM Plex Mono',monospace; margin-bottom:.6rem; }

/* ── CV BARS ── */
.cvrow { margin-bottom:.7rem; }
.cvlab { display:flex; justify-content:space-between; font-size:.75rem; color:var(--text2); margin-bottom:.2rem; }
.cvtrack { height:14px; background:var(--surface2); border-radius:7px; overflow:hidden; }
.cvfill { height:100%; background:var(--green); border-radius:7px; transition:width .25s; }
.cvfill.alt { background:var(--gold); }

/* ── TABLES ── */
.ftwrap { overflow-x:auto; margin:.7rem 0; }
.ftab { width:100%; border-collapse:collapse; font-size:.8rem; min-width:340px; }
.ftab th, .ftab td { border:1px solid var(--border); padding:.35rem .5rem; text-align:center; color:var(--text2); }
.ftab th { background:var(--surface2); color:var(--text3); font-size:.68rem; text-transform:uppercase; letter-spacing:.05em; }
.ftab tr.hl td { background:var(--green-bg); color:var(--green-dark); font-weight:600; }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; font-family:inherit; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); font-family:inherit; }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; font-family:inherit; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; font-family:inherit; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--gold-bg); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; font-family:inherit; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }

/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos { gap: .9rem; }
  .wlogos img { height: 38px; max-width: 40%; }
  .wtitle { font-size: 1.35rem; }
  .stickybar { padding: .5rem .55rem; gap: .4rem; }
  .htitle { display: none; }
  .halexis { display: none; }
  .hsep { display: none; }
  .hlogos img { height: 20px; max-width: 62px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 92px; overflow: hidden; text-overflow: ellipsis; }
  .lang-btn { padding: .26rem .45rem; font-size: .66rem; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .gcrd { padding: .9rem; }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
  .dstrip { height: 48px; }
  .ddot { width: 10px; height: 10px; margin: -5px 0 0 -5px; }
  .dscale { font-size: .52rem; }
}
</style>
</head>
<body>

<!-- ════════════════════ WELCOME ════════════════════ -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <img id="wlogo-left"  src="" alt="Facultad de Economía" style="display:none">
      <div class="wlogsep" id="wlogsep"></div>
      <img id="wlogo-right" src="" alt="Universidad de Colima" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Medidas de Dispersión</div>
    <div class="wcourse" id="wcourse-el">Estadística · Facultad de Economía, Universidad de Colima</div>
    <label class="flabel" for="sName" id="lbl-name-el" data-tx="lbl-name">Nombre completo</label>
    <input class="finput" id="sName" type="text" data-tx-ph="ph-name" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" for="sGroup" id="lbl-group-el" data-tx="lbl-group">Grupo</label>
    <input class="finput" id="sGroup" type="text" data-tx-ph="ph-group" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" data-tx="btn-start" onclick="startLesson()">Comenzar</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreTitle" data-tx="restore-title">Sesión guardada encontrada</strong><br>
      <span id="restoreMsg" data-tx="restore-msg">Puedes continuar donde la dejaste.</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" data-tx="btn-restore" onclick="restoreSession()">Retomar sesión</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" data-tx="btn-dismiss" onclick="dismissRestore()">Empezar de nuevo</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.9rem">
      <svg width="160" height="52" viewBox="0 0 180 52" xmlns="http://www.w3.org/2000/svg">
        <style>
          .lbt { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.1em; fill:var(--green); font-size:28px; }
          .lbl { stroke:var(--gold); stroke-width:2.5; }
          .lba { fill:var(--gold); }
        </style>
        <polyline points="5,40 14,28 24,33 36,14" fill="none" stroke="var(--green)" stroke-width="3"/>
        <circle cx="36" cy="14" r="4.5" class="lba"/>
        <line x1="52" y1="6" x2="52" y2="46" class="lbl"/>
        <text x="64" y="38" class="lbt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- ════════════════════ LESSON ════════════════════ -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <img id="hlogo-left"  src="" alt="Facultad de Economía" style="display:none">
      <img id="hlogo-right" src="" alt="Universidad de Colima" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle" id="htitle-el">Medidas de Dispersión</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg">
        <style>
          .lht { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
          .lhl { stroke:var(--gold); stroke-width:2; }
          .lha { fill:var(--gold); }

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t2 = s ^ (s >>> 16);
    t2 = Math.imul(t2, 0x21f0aaad);
    t2 ^= (t2 >>> 15);
    t2 = Math.imul(t2, 0x735a2d97);
    return ((t2 ^ (t2 >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}
/* shuffles the ES and EN option lists with the SAME permutation */
function shufPair(es, en, correct0, rng) {
  var idx = es.map(function(_, k) { return k; });
  for (var i = idx.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = idx[i]; idx[i] = idx[j]; idx[j] = tmp;
  }
  return {
    es: idx.map(function(k) { return es[k]; }),
    en: idx.map(function(k) { return en[k]; }),
    correctIdx: idx.indexOf(correct0)
  };
}
/* number helpers */
function nf(x) { return String(Math.round(x)).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
function money(x) { return '$' + nf(x); }
function d1(x) { return (Math.round(x * 10) / 10).toFixed(1); }
function d2(x) { return (Math.round(x * 100) / 100).toFixed(2); }
function pc1(x) { return d1(x) + '%'; }
/* builds 4 distinct option strings: correct first, then alternates, then nudges */
function opts4(correct, alts, nudge) {
  var out = [correct], i;
  for (i = 0; i < alts.length && out.length < 4; i++) {
    if (out.indexOf(alts[i]) < 0) out.push(alts[i]);
  }
  var k = 1;
  while (out.length < 4 && k < 80) {
    var c = nudge(k);
    if (out.indexOf(c) < 0) out.push(c);
    k++;
  }
  return out;
}
/* stacked fraction markup */
function frac(n, d) {
  return '<span class="mf-outer"><span class="mf-num">' + n + '</span><span class="mf-den">' + d + '</span></span>';
}
/* descriptive statistics computed from an array */
function stats(arr) {
  var n = arr.length, i, s = 0;
  for (i = 0; i < n; i++) s += arr[i];
  var mean = s / n, ss = 0, sa = 0;
  for (i = 0; i < n; i++) { ss += (arr[i] - mean) * (arr[i] - mean); sa += Math.abs(arr[i] - mean); }
  var mn = arr[0], mx = arr[0];
  for (i = 1; i < n; i++) { if (arr[i] < mn) mn = arr[i]; if (arr[i] > mx) mx = arr[i]; }
  return {
    n: n, sum: s, mean: mean, ss: ss, min: mn, max: mx, range: mx - mn,
    varS: n > 1 ? ss / (n - 1) : 0, varP: ss / n,
    sdS: n > 1 ? Math.sqrt(ss / (n - 1)) : 0, sdP: Math.sqrt(ss / n),
    mad: sa / n
  };
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#2d5a27';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER (two taps to confirm)
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = '<strong>' + (isOk ? t('fb-correct') : t('fb-wrong')) + '</strong> ' + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (!prob || prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = '<strong>' + (isOk ? t('fb-correct') : t('fb-wrong')) + '</strong> ' + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

/* ── WIDGET 1: dispersion comparator ──────────────────────────────────── */
function widgetSpread(D) {
  var el = document.createElement('div');
  el.setAttribute('data-widget', 'spread');
  el.className = 'gcrd section';
  el.id = 'wgSpread';
  var st = { k: 4 };
  var shape = [-3, -2, -1, 0, 1, 2, 3];
  function days() {
    return shape.map(function(z) { return D.m1 + z * st.k; });
  }
  function render() {
    var es = LANG === 'es';
    var v  = days();
    var S  = stats(v);
    var lo = D.m1 - 42, hi = D.m1 + 42;
    var dots = '';
    v.forEach(function(x) {
      var p = 2 + (x - lo) / (hi - lo) * 96;
      dots += '<div class="ddot" style="left:' + d1(p) + '%"></div>';
    });
    var pm = 2 + (D.m1 - lo) / (hi - lo) * 96;
    var note;
    if (st.k === 0) {
      note = es
        ? 'Con el control en cero las siete jornadas venden exactamente lo mismo: el rango y la desviación estándar valen cero, y el promedio describe cada día sin error.'
        : 'With the control at zero the seven days sell exactly the same amount: range and standard deviation are zero, and the average describes every day with no error.';
    } else {
      note = es
        ? 'La media sigue anclada en ' + nf(D.m1) + ' miles de pesos sin importar dónde pongas el control. Lo único que cambia es qué tan lejos caen las jornadas respecto de ese promedio, y eso es justo lo que una medida de dispersión pone en números.'
        : 'The mean stays anchored at ' + nf(D.m1) + ' thousand pesos no matter where you set the control. The only thing that changes is how far the days fall from that average, and that is exactly what a measure of dispersion puts into numbers.';
    }
    el.innerHTML =
      '<div class="iw-h">' + (es ? 'Comparador de dispersión' : 'Dispersion comparator') + '</div>' +
      '<div class="iw-sub">' + (es
        ? 'Siete jornadas de venta de una misma sucursal, siempre con el mismo promedio. Mueve el control y observa qué indicadores se mueven y cuál se queda quieto.'
        : 'Seven sales days from the same branch, always with the same average. Move the control and watch which indicators move and which one stays still.') + '</div>' +
      '<div class="dstrip"><div class="dline"></div><div class="dmean" style="left:' + d1(pm) + '%"></div>' + dots + '</div>' +
      '<div class="dscale"><span>' + nf(lo) + '</span><span>' + nf(D.m1) + '</span><span>' + nf(hi) + '</span></div>' +
      '<div class="cgrid"><div class="cg">' +
        '<label>' + (es ? 'Separación entre jornadas' : 'Spacing between days') + ': <span class="cval" id="spVal">' + st.k + '</span></label>' +
        '<input type="range" id="spSlider" min="0" max="12" step="1" value="' + st.k + '">' +
      '</div><div class="cg">' +
        '<label>' + (es ? 'Jornadas observadas' : 'Days observed') + '</label>' +
        '<div class="mnum ts">' + S.n + '</div>' +
      '</div></div>' +
      '<div class="metrics">' +
        '<div class="metric"><div class="mlbl">' + (es ? 'Media' : 'Mean') + '</div><div class="mnum ts">' + d1(S.mean) + '</div></div>' +
        '<div class="metric"><div class="mlbl">' + (es ? 'Rango' : 'Range') + '</div><div class="mnum ps">' + nf(S.range) + '</div></div>' +
        '<div class="metric"><div class="mlbl">' + (es ? 'Desviación estándar' : 'Standard deviation') + '</div><div class="mnum cs">' + d2(S.sdS) + '</div></div>' +
      '</div>' +
      '<div class="iw-note">' + note + '</div>';
    var sl = el.querySelector('#spSlider');
    sl.addEventListener('input', function() { st.k = parseInt(sl.value, 10); render(); });
  }
  render();
  document.getElementById('lessonBody').appendChild(el);
  WIDGETS.push({ el: el, relabel: render });
}

/* ── WIDGET 2: deviation worksheet ────────────────────────────────────── */
function widgetDeviation(D) {
  var el = document.createElement('div');
  el.setAttribute('data-widget', 'deviation');
  el.className = 'gcrd section';
  el.id = 'wgDeviation';
  var st = { last: D.cost[5] };
  function vals() {
    return [D.cost[0], D.cost[1], D.cost[2], D.cost[3], D.cost[4], st.last];
  }
  function render() {
    var es = LANG === 'es';
    var v = vals(), S = stats(v), i;
    var rows = '', sumDev = 0;
    for (i = 0; i < v.length; i++) {
      var dev = v[i] - S.mean;
      sumDev += dev;
      rows += '<tr' + (i === 5 ? ' class="hl"' : '') + '><td>' + (es ? 'Mes ' : 'Month ') + (i + 1) + '</td><td>' +
        nf(v[i]) + '</td><td>' + d2(dev) + '</td><td>' + d2(dev * dev) + '</td></tr>';
    }
    var h = es
      ? ['Periodo', 'Costo', 'Desviación', 'Desviación al cuadrado']
      : ['Period', 'Cost', 'Deviation', 'Squared deviation'];
    var gap = S.varP > 0 ? (S.varS / S.varP - 1) * 100 : 0;
    el.innerHTML =
      '<div class="iw-h">' + (es ? 'Tablero de desviaciones' : 'Deviation worksheet') + '</div>' +
      '<div class="iw-sub">' + (es
        ? 'Seis meses de costo logístico de un centro de distribución. Mueve el costo del último mes y sigue con la vista la columna de desviaciones, su suma y las dos versiones de la varianza.'
        : 'Six months of logistics cost for a distribution center. Move the last month cost and follow the deviation column, its total and the two versions of the variance.') + '</div>' +
      '<div class="cgrid"><div class="cg">' +
        '<label>' + (es ? 'Costo del mes 6' : 'Month 6 cost') + ': <span class="cval" id="dvVal">' + nf(st.last) + '</span></label>' +
        '<input type="range" id="dvSlider" min="' + D.costLo + '" max="' + D.costHi + '" step="1" value="' + st.last + '">' +
      '</div><div class="cg">' +
        '<label>' + (es ? 'Media del periodo' : 'Mean of the period') + '</label>' +
        '<div class="mnum cs">' + d2(S.mean) + '</div>' +
      '</div></div>' +
      '<div class="ftwrap"><table class="ftab"><tr><th>' + h[0] + '</th><th>' + h[1] + '</th><th>' + h[2] + '</th><th>' + h[3] + '</th></tr>' +
        rows +
        '<tr><td><strong>' + (es ? 'Suma' : 'Total') + '</strong></td><td><strong>' + nf(S.sum) + '</strong></td><td><strong>' +
        d2(Math.abs(sumDev) < 0.0000001 ? 0 : sumDev) + '</strong></td><td><strong>' + d2(S.ss) + '</strong></td></tr>' +
      '</table></div>' +
      '<div class="metrics">' +
        '<div class="metric"><div class="mlbl">' + (es ? 'Varianza muestral' : 'Sample variance') + '</div><div class="mnum cs">' + d2(S.varS) + '</div></div>' +
        '<div class="metric"><div class="mlbl">' + (es ? 'Varianza poblacional' : 'Population variance') + '</div><div class="mnum ps">' + d2(S.varP) + '</div></div>' +
        '<div class="metric"><div class="mlbl">' + (es ? 'Desviación muestral' : 'Sample deviation') + '</div><div class="mnum ts">' + d2(S.sdS) + '</div></div>' +
      '</div>' +
      '<div class="iw-note">' + (es
        ? 'La columna de desviaciones siempre suma cero, porque la media es el punto de equilibrio de los datos. Por eso las desviaciones se elevan al cuadrado antes de promediarlas. Dividir entre 5 en lugar de entre 6 eleva la varianza en ' + d1(gap) + ' por ciento, y esa corrección es la que compensa que la media se estimó con los mismos datos.'
        : 'The deviation column always adds up to zero, because the mean is the balance point of the data. That is why deviations are squared before averaging them. Dividing by 5 instead of by 6 raises the variance by ' + d1(gap) + ' percent, and that correction compensates for the fact that the mean was estimated from the same data.') + '</div>';
    var sl = el.querySelector('#dvSlider');
    sl.addEventListener('input', function() { st.last = parseInt(sl.value, 10); render(); });
  }
  render();
  document.getElementById('lessonBody').appendChild(el);
  WIDGETS.push({ el: el, relabel: render });
}

/* ── WIDGET 3: relative risk comparator ───────────────────────────────── */
function widgetCV(D) {
  var el = document.createElement('div');
  el.setAttribute('data-widget', 'cv');
  el.className = 'gcrd section';
  el.id = 'wgCV';
  var st = { sA: D.sA, sB: D.sB };
  function render() {
    var es = LANG === 'es';
    var cvA = st.sA / D.mA * 100;
    var cvB = st.sB / D.mB * 100;
    var top = Math.max(cvA, cvB, 1);
    var verdict;
    if (Math.abs(cvA - cvB) < 0.05) {
      verdict = es
        ? 'Con estos valores las dos líneas tienen prácticamente el mismo riesgo relativo, aunque en pesos una se mueva mucho más que la otra.'
        : 'With these values both lines carry practically the same relative risk, even though in pesos one of them moves much more than the other.';
    } else if (cvA > cvB) {
      verdict = es
        ? 'Con estos valores la línea Aurora es la más volátil en términos relativos: cada peso de venta esperada trae más incertidumbre que en Bahía.'
        : 'With these values the Aurora line is the more volatile one in relative terms: every peso of expected sales carries more uncertainty than in Bahia.';
    } else {
      verdict = es
        ? 'Con estos valores la línea Bahía es la más volátil en términos relativos, aun cuando su desviación en pesos pueda parecer moderada frente a su tamaño.'
        : 'With these values the Bahia line is the more volatile one in relative terms, even though its deviation in pesos may look moderate against its size.';
    }
    el.innerHTML =
      '<div class="iw-h">' + (es ? 'Comparador de riesgo relativo' : 'Relative risk comparator') + '</div>' +
      '<div class="iw-sub">' + (es
        ? 'Dos líneas de producto con tamaños muy distintos. Ajusta la desviación estándar de cada una y compara la barra de dispersión relativa, no la cifra en pesos.'
        : 'Two product lines of very different size. Adjust the standard deviation of each one and compare the relative dispersion bar, not the figure in pesos.') + '</div>' +
      '<div class="cgrid"><div class="cg">' +
        '<label>' + (es ? 'Desviación de Aurora' : 'Aurora deviation') + ': <span class="cval">' + nf(st.sA) + '</span></label>' +
        '<input type="range" id="cvA" min="5" max="60" step="1" value="' + st.sA + '">' +
      '</div><div class="cg">' +
        '<label>' + (es ? 'Desviación de Bahía' : 'Bahia deviation') + ': <span class="cval">' + nf(st.sB) + '</span></label>' +
        '<input type="range" id="cvB" min="20" max="300" step="5" value="' + st.sB + '">' +
      '</div></div>' +
      '<div class="cvrow"><div class="cvlab"><span>' + (es ? 'Aurora, media ' : 'Aurora, mean ') + nf(D.mA) + '</span><span>' + pc1(cvA) + '</span></div>' +
        '<div class="cvtrack"><div class="cvfill" style="width:' + d1(cvA / top * 100) + '%"></div></div></div>' +
      '<div class="cvrow"><div class="cvlab"><span>' + (es ? 'Bahía, media ' : 'Bahia, mean ') + nf(D.mB) + '</span><span>' + pc1(cvB) + '</span></div>' +
        '<div class="cvtrack"><div class="cvfill alt" style="width:' + d1(cvB / top * 100) + '%"></div></div></div>' +
      '<div class="iw-flag">' + verdict + '</div>' +
      '<div class="iw-note">' + (es
        ? 'Cifras mensuales en miles de pesos. La desviación en pesos de Bahía casi siempre será mayor por el tamaño de la línea; el coeficiente de variación descuenta ese efecto de escala y deja comparables a las dos.'
        : 'Monthly figures in thousands of pesos. The peso deviation of Bahia will almost always be larger because of the size of the line; the coefficient of variation removes that scale effect and makes both comparable.') + '</div>';
    el.querySelector('#cvA').addEventListener('input', function() { st.sA = parseInt(this.value, 10); render(); });
    el.querySelector('#cvB').addEventListener('input', function() { st.sB = parseInt(this.value, 10); render(); });
  }
  render();
  document.getElementById('lessonBody').appendChild(el);
  WIDGETS.push({ el: el, relabel: render });
}

/* ================================================
   BUILD LESSON
   ================================================ */
function buildLesson(rng) {
  var body = document.getElementById('lessonBody');
  body.innerHTML = '';
  problems = []; SECTIONS = []; WIDGETS = [];
  var ri = function(a, b) { return a + Math.floor(rng() * (b - a + 1)); };
  var D = {}, i;

  /* ── Section 1: two branches, daily sales in thousands of pesos ── */
  D.m1 = ri(46, 62);
  D.a  = ri(2, 4);
  D.b  = ri(6, 10);
  D.norte = [D.m1 - 2*D.a, D.m1 - D.a, D.m1, D.m1, D.m1 + D.a, D.m1 + 2*D.a];
  D.sur   = [D.m1 - 3*D.b, D.m1 - D.b, D.m1, D.m1, D.m1 + D.b, D.m1 + 3*D.b];
  D.surDias = shuffle(D.sur, rng);
  var SN = stats(D.norte), SS = stats(D.sur);
  D.rgN = SN.range;
  D.rgS = SS.range;

  /* ── Section 2: six months of logistics cost ── */
  D.lm = ri(28, 46);
  D.p  = ri(2, 4);
  D.q  = ri(5, 7);
  D.r  = ri(9, 12);
  D.cost = [D.lm - D.r, D.lm - D.q, D.lm - D.p, D.lm + D.p, D.lm + D.q, D.lm + D.r];
  D.costLo = D.lm - D.r - 12;
  D.costHi = D.lm + D.r + 12;
  var SC = stats(D.cost);

  /* ── Returns item: eight sampled weeks ── */
  D.wm = ri(52, 74);
  D.w1 = ri(3, 5);
  D.w2 = ri(7, 9);
  D.w3 = ri(11, 14);
  D.w4 = ri(16, 20);
  D.wk = [D.wm - D.w4, D.wm - D.w3, D.wm - D.w2, D.wm - D.w1,
          D.wm + D.w1, D.wm + D.w2, D.wm + D.w3, D.wm + D.w4];
  D.wkDias = shuffle(D.wk, rng);
  var SW = stats(D.wk);

  /* ── Section 3: two product lines ── */
  D.mA = ri(180, 240);
  D.sA = ri(26, 34);
  D.mB = ri(1200, 1800);
  D.sB = ri(72, 108);
  D.cvA = D.sA / D.mA * 100;
  D.cvB = D.sB / D.mB * 100;

  /* ── Section 4: weekly demand, empirical rule ── */
  D.dm = 100 * ri(4, 9);
  D.ds = 10 * ri(3, 7);

  /* ── Supplier item: delivery time in hours ── */
  D.auM = ri(46, 54); D.auS = ri(2, 4);
  D.boM = ri(40, 44); D.boS = ri(9, 13);

  /* ── Profit item: four quarters of operating profit ── */
  D.um = ri(120, 180);
  D.u1 = ri(3, 7);
  D.u2 = ri(10, 16);
  D.q4 = [D.um - D.u2, D.um - D.u1, D.um + D.u1, D.um + D.u2];
  D.q4Ord = shuffle(D.q4, rng);
  var SQ = stats(D.q4);

  /* ── Review item: audited stores ── */
  D.nsh = ri(10, 16);
  D.nsh1 = D.nsh - 1;
  D.chain = 50 * ri(5, 9);

  /* ── Stocking item: safety stock level ── */
  D.pm = 50 * ri(10, 18);
  D.ps = 10 * ri(4, 9);

  /* ════════ SECTION 1 ════════ */
  addSection({
    es: function() { return ''
      + '<div class="stag">Concepto 1</div>'
      + '<h2>Por qué el promedio no alcanza: rango y recorrido de los datos</h2>'
      + '<p>Dos sucursales pueden reportar exactamente la misma venta promedio y significar cosas muy distintas para quien programa turnos, compra inventario o negocia una línea de crédito. El promedio dice dónde está el centro de los datos; no dice nada sobre qué tan lejos del centro caen las observaciones reales. Esa segunda pregunta es la que responden las medidas de dispersión.</p>'
      + '<p>La medida más directa es el <strong>rango</strong>: la distancia entre el valor máximo y el valor mínimo observados. Es inmediata de calcular y de explicar en una junta, y por eso aparece en tableros operativos. Su límite es igual de claro: se apoya solo en dos observaciones, así que un día atípico la dispara sin que el resto del negocio haya cambiado.</p>'
      + '<div class="rules-grid">'
        + '<div class="rcard"><div class="rname">Rango</div><div class="rform">máximo menos mínimo</div><div class="rnote">Amplitud total de lo observado.</div></div>'
        + '<div class="rcard"><div class="rname">Ventaja</div><div class="rform">lectura inmediata</div><div class="rnote">Se comunica sin explicar fórmulas.</div></div>'
        + '<div class="rcard"><div class="rname">Riesgo</div><div class="rform">solo dos datos</div><div class="rnote">Un valor extremo lo domina por completo.</div></div>'
        + '<div class="rcard"><div class="rname">Uso típico</div><div class="rform">control de proceso</div><div class="rnote">Alertas de variación en piso de venta.</div></div>'
      + '</div>'
      + '<div class="callout"><p><strong>Idea central.</strong> Dos conjuntos de datos con la misma media pueden implicar riesgos operativos opuestos. La media ubica el centro; la dispersión mide la incertidumbre alrededor de ese centro, y esa incertidumbre es la que cuesta dinero en inventario, personal y servicio.</p></div>'
      + '<div class="gcrd"><div class="rname">Ejemplo resuelto</div>'
        + '<p>La cadena Grupo Bahía revisó la venta diaria de dos sucursales durante seis jornadas comparables. Las cifras están en miles de pesos.</p>'
        + '<p><strong>Sucursal Norte.</strong> ' + D.norte.join(', ') + '.</p>'
        + '<p><strong>Sucursal Sur.</strong> ' + D.sur.join(', ') + '.</p>'
        + '<p><strong>Paso 1.</strong> Las dos suman ' + nf(SN.sum) + ' miles en seis jornadas, así que ambas tienen la misma venta promedio: ' + nf(SN.mean) + ' miles de pesos por día.</p>'
        + '<p><strong>Paso 2.</strong> En Norte el día más alto fue ' + nf(SN.max) + ' y el más bajo ' + nf(SN.min) + ', de modo que el rango es ' + nf(SN.range) + ' miles.</p>'
        + '<p><strong>Paso 3.</strong> En Sur el día más alto fue ' + nf(SS.max) + ' y el más bajo ' + nf(SS.min) + ', de modo que el rango es ' + nf(SS.range) + ' miles.</p>'
        + '<p><strong>Paso 4.</strong> Con el mismo promedio, Sur exige más inventario de seguridad y más flexibilidad de personal, porque sus jornadas se alejan mucho más del centro. Reportar solo el promedio ocultaría por completo esa diferencia.</p>'
      + '</div>'; },
    en: function() { return ''
      + '<div class="stag">Concept 1</div>'
      + '<h2>Why the average is not enough: range and the spread of the data</h2>'
      + '<p>Two branches can report exactly the same average sales figure and still mean very different things for whoever schedules shifts, buys inventory or negotiates a credit line. The average tells you where the center of the data is; it says nothing about how far the actual observations fall from that center. Measures of dispersion answer that second question.</p>'
      + '<p>The most direct measure is the <strong>range</strong>: the distance between the largest and the smallest observed value. It is immediate to compute and easy to explain in a meeting, which is why it shows up on operating dashboards. Its limitation is just as clear: it rests on only two observations, so a single unusual day inflates it even though nothing else in the business has changed.</p>'
      + '<div class="rules-grid">'
        + '<div class="rcard"><div class="rname">Range</div><div class="rform">maximum minus minimum</div><div class="rnote">Total width of what was observed.</div></div>'
        + '<div class="rcard"><div class="rname">Strength</div><div class="rform">immediate reading</div><div class="rnote">Communicated without explaining formulas.</div></div>'
        + '<div class="rcard"><div class="rname">Weakness</div><div class="rform">only two values</div><div class="rnote">A single extreme value dominates it.</div></div>'

  addSection({
    es: function() { return ''
      + '<div class="stag">Concepto 2</div>'
      + '<h2>Varianza y desviación estándar</h2>'
      + '<p>Si el problema del rango es que ignora casi todos los datos, la solución natural es construir una medida que use todos. El punto de partida es la <strong>desviación</strong> de cada observación respecto de la media. Sumarlas directamente no sirve: las desviaciones positivas y negativas se cancelan y el total siempre da cero, porque la media es justamente el punto de equilibrio del conjunto.</p>'
      + '<p>Por eso cada desviación se eleva al cuadrado antes de promediarla. Ese promedio de cuadrados es la <strong>varianza</strong>. Como queda expresada en unidades al cuadrado, que no se pueden interpretar en una junta, se toma su raíz cuadrada y se obtiene la <strong>desviación estándar</strong>, que vuelve a estar en pesos, unidades o días, igual que los datos originales.</p>'
      + '<div class="rules-grid">'
        + '<div class="rcard"><div class="rname">Varianza poblacional</div><div class="rform">σ² = ' + frac('Σ(x − μ)²', 'N') + '</div><div class="rnote">Cuando se midieron todas las unidades.</div></div>'
        + '<div class="rcard"><div class="rname">Varianza muestral</div><div class="rform">s² = ' + frac('Σ(x − x̄)²', 'n − 1') + '</div><div class="rnote">Cuando los datos son una muestra.</div></div>'
        + '<div class="rcard"><div class="rname">Desviación estándar</div><div class="rform">s = √s²</div><div class="rnote">Regresa a las unidades originales.</div></div>'
        + '<div class="rcard"><div class="rname">Lectura</div><div class="rform">distancia típica</div><div class="rnote">Cuánto se aparta un dato común de la media.</div></div>'
      + '</div>'
      + '<div class="callout"><p><strong>Por qué se divide entre n − 1.</strong> Cuando los datos son una muestra, la media que se usa para calcular las desviaciones también salió de esa misma muestra, así que los datos quedan artificialmente cerca de ella y la suma de cuadrados resulta algo pequeña. Dividir entre n − 1 en lugar de entre n corrige ese sesgo. Si se midió a toda la población, esa corrección no hace falta y se divide entre N.</p></div>'
      + '<div class="gcrd"><div class="rname">Ejemplo resuelto</div>'
        + '<p>Un centro de distribución de Grupo Bahía registró su costo logístico mensual durante seis meses, en miles de pesos: ' + D.cost.join(', ') + '. La dirección lo trata como una muestra del comportamiento del centro para el resto del año.</p>'
        + '<p><strong>Paso 1.</strong> La suma es ' + nf(SC.sum) + ' y hay seis meses, así que la media del periodo es ' + nf(SC.mean) + ' miles de pesos.</p>'
        + '<p><strong>Paso 2.</strong> Cada mes se compara contra esa media. Las desviaciones son ' + D.cost.map(function(x) { return (x - SC.mean); }).join(', ') + ', y su suma da cero, como siempre ocurre.</p>'
        + '<p><strong>Paso 3.</strong> Al elevar cada desviación al cuadrado y sumar se obtiene una suma de cuadrados de ' + d2(SC.ss) + '.</p>'
        + '<p><strong>Paso 4.</strong> Como el periodo se trata como muestra, esa suma se divide entre cinco y la varianza muestral resulta ' + d2(SC.varS) + '.</p>'
        + '<p><strong>Paso 5.</strong> La raíz cuadrada devuelve la desviación estándar: ' + d2(SC.sdS) + ' miles de pesos. La lectura de negocio es que un mes común se aparta unos ' + d2(SC.sdS) + ' miles del costo promedio, y con eso se puede fijar un margen de tolerancia presupuestal.</p>'
      + '</div>'; },
    en: function() { return ''
      + '<div class="stag">Concept 2</div>'
      + '<h2>Variance and standard deviation</h2>'
      + '<p>If the problem with the range is that it ignores almost all the data, the natural fix is to build a measure that uses all of it. The starting point is the <strong>deviation</strong> of each observation from the mean. Adding those deviations directly is useless: positive and negative ones cancel out and the total is always zero, because the mean is precisely the balance point of the set.</p>'
      + '<p>That is why each deviation is squared before averaging. The average of those squares is the <strong>variance</strong>. Since it ends up expressed in squared units, which nobody can interpret in a meeting, we take its square root and obtain the <strong>standard deviation</strong>, which is back in pesos, units or days, just like the original data.</p>'
      + '<div class="rules-grid">'
        + '<div class="rcard"><div class="rname">Population variance</div><div class="rform">σ² = ' + frac('Σ(x − μ)²', 'N') + '</div><div class="rnote">When every unit was measured.</div></div>'
        + '<div class="rcard"><div class="rname">Sample variance</div><div class="rform">s² = ' + frac('Σ(x − x̄)²', 'n − 1') + '</div><div class="rnote">When the data are a sample.</div></div>'
        + '<div class="rcard"><div class="rname">Standard deviation</div><div class="rform">s = √s²</div><div class="rnote">Returns to the original units.</div></div>'
        + '<div class="rcard"><div class="rname">Reading</div><div class="rform">typical distance</div><div class="rnote">How far an ordinary value sits from the mean.</div></div>'
      + '</div>'
      + '<div class="callout"><p><strong>Why we divide by n − 1.</strong> When the data are a sample, the mean used to compute the deviations came from that same sample, so the data sit artificially close to it and the sum of squares turns out slightly too small. Dividing by n − 1 instead of by n corrects that bias. If the whole population was measured, no correction is needed and we divide by N.</p></div>'
      + '<div class="gcrd"><div class="rname">Worked example</div>'
        + '<p>A distribution center of Grupo Bahia recorded its monthly logistics cost over six months, in thousands of pesos: ' + D.cost.join(', ') + '. Management treats it as a sample of how the center behaves for the rest of the year.</p>'

        + '<p><strong>Step 2.</strong> Each month is compared against that mean. The deviations are ' + D.cost.map(function(x) { return (x - SC.mean); }).join(', ') + ', and they add up to zero, as they always do.</p>'
        + '<p><strong>Step 3.</strong> Squaring each deviation and adding gives a sum of squares of ' + d2(SC.ss) + '.</p>'
        + '<p><strong>Step 4.</strong> Since the period is treated as a sample, that sum is divided by five and the sample variance comes out at ' + d2(SC.varS) + '.</p>'

  addSection({
    es: function() { return ''
      + '<div class="stag">Concepto 3</div>'
      + '<h2>Coeficiente de variación: comparar riesgo entre escalas distintas</h2>'
      + '<p>La desviación estándar viene en las unidades de los datos, y eso la vuelve muy legible dentro de un mismo negocio. El problema aparece al comparar dos realidades de tamaño distinto: una línea que vende cientos de miles al mes casi siempre tendrá una desviación en pesos mayor que una línea pequeña, sin que eso signifique que sea más incierta.</p>'
      + '<p>El <strong>coeficiente de variación</strong> resuelve esa comparación al expresar la desviación estándar como porcentaje de la media. Al convertirse en un número sin unidades, permite poner lado a lado líneas de producto, carteras de inversión, sucursales o proveedores medidos en escalas distintas, e incluso en monedas distintas.</p>'
      + '<div class="rules-grid">'
        + '<div class="rcard"><div class="rname">Coeficiente de variación</div><div class="rform">CV = ' + frac('s', 'x̄') + ' × 100</div><div class="rnote">Dispersión relativa, en porcentaje.</div></div>'
        + '<div class="rcard"><div class="rname">Lectura</div><div class="rform">riesgo por peso</div><div class="rnote">Incertidumbre por cada peso esperado.</div></div>'

      + '<div class="callout"><p><strong>Regla de decisión.</strong> Entre dos alternativas con rendimiento esperado parecido, conviene la de menor coeficiente de variación. Si los rendimientos esperados son distintos, el coeficiente indica cuánta incertidumbre se acepta por cada peso esperado, y la elección depende de la tolerancia al riesgo de la empresa.</p></div>'

      + '<h2>Coefficient of variation: comparing risk across different scales</h2>'

      + '<p>The <strong>coefficient of variation</strong> solves that comparison by expressing the standard deviation as a percentage of the mean. Because it becomes a number without units, it lets you place side by side product lines, investment portfolios, branches or suppliers measured on different scales, and even in different currencies.</p>'

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;

  function pdfText(html) {
    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/→/g,'->').replace(/−/g,'-').replace(/²/g,'^2')
      .replace(/³/g,'^3').replace(/×/g,'x').replace(/÷/g,'/')
      .replace(/≠/g,'!=').replace(/≤/g,'<=').replace(/≥/g,'>=')
      .replace(/√/g,'sqrt').replace(/π/g,'pi').replace(/…/g,'...')
      .replace(/\s+/g,' ').trim();
  }

  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,2,'F');
  doc.setFillColor(255,255,255); doc.rect(0,2,PW,26,'F');
  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,28,PW,2,'F');
  doc.setFillColor(pBR,pBG,pBB); doc.rect(0,30,PW,34,'F');

  var logoLeftB64  = SCHOOL.logoLeftB64;
  var logoRightB64 = SCHOOL.logoRightB64;
  try { doc.addImage(logoLeftB64,  logoLeftB64.indexOf('/9j/')  > -1 ? 'JPEG' : 'PNG', M,  5, 20, 20); } catch(e) {}
  try { doc.addImage(logoRightB64, logoRightB64.indexOf('/9j/') > -1 ? 'JPEG' : 'PNG', 62, 6, 40, 17.7); } catch(e) {}

  var lx = PW - M - 36;
  var ly = 10;
  doc.setDrawColor(pBR,pBG,pBB); doc.setLineWidth(0.7);
  doc.lines([[2.57-1.03,4.63-6.17],[4.11-2.57,5.14-4.63],[5.66-4.11,2.57-5.14]], lx+1.03, ly+6.17);
  doc.setFillColor(pAR,pAG,pAB); doc.circle(lx+5.66, ly+2.57, 0.9, 'F');
  doc.setDrawColor(pAR,pAG,pAB); doc.setLineWidth(0.7);
  doc.line(lx+8.23, ly+1.54, lx+8.23, ly+7.2);
  doc.setTextColor(pBR,pBG,pBB); doc.setFontSize(11); doc.setFont('helvetica','bold');
  doc.text('LIAXA', lx+10, ly+6.8);

  doc.setTextColor(240,245,238); doc.setFontSize(17); doc.setFont('helvetica','bold');
  doc.text(pdfText(SCHOOL.guideTitle[LANG]), M, 49);
  doc.setTextColor(200,215,195); doc.setFontSize(8); doc.setFont('helvetica','normal');
  doc.text(dateStr, M, 59);

  doc.setFillColor(237,240,235); doc.roundedRect(M,72,TW,20,3,3,'F');
  doc.setTextColor(130,140,130); doc.setFontSize(8.5); doc.setFont('helvetica','bold');
  doc.text(t('pdf-student'), M+4, 79); doc.text(t('pdf-group'), 130, 79);
  doc.setTextColor(20,24,20); doc.setFontSize(11); doc.setFont('helvetica','bold');
  doc.text(name, M+4, 87); doc.text(group, 130, 87);

  var sc = pct>=70?[26,106,74]:pct>=50?[224,123,26]:[176,48,16];
  doc.setFillColor(255,255,255); doc.roundedRect(M,100,TW,34,4,4,'F');
  doc.setDrawColor(sc[0],sc[1],sc[2]); doc.setLineWidth(0.8);
  doc.roundedRect(M,100,TW,34,4,4,'S');
  doc.setTextColor(sc[0],sc[1],sc[2]); doc.setFontSize(40); doc.setFont('helvetica','bold');
  doc.text(pct+'%', PW/2, 124, {align:'center'});
  doc.setTextColor(130,140,130); doc.setFontSize(8.5); doc.setFont('helvetica','normal');
  doc.text(correctCount+' '+t('pdf-score')+' '+total+' '+t('pdf-items'), PW/2, 131, {align:'center'});

  doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
  doc.setFontSize(7); doc.setFont('helvetica','bold');
  doc.rect(M,142,TW,8,'F'); doc.text(t('pdf-summary'), M+4, 148);
  var sy = 154;
  problems.forEach(function(prob, i) {
    if (sy + 12 > PH - 15) {
      doc.addPage(); sy = 20;
      doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
      doc.setFontSize(7); doc.setFont('helvetica','bold');
      doc.rect(M,sy,TW,8,'F'); doc.text(t('pdf-cont'), M+4, sy+6);
      sy += 12;
    }
    var ok = document.getElementById('pc'+i).classList.contains('ok');
    doc.setFillColor(ok?232:255, ok?240:232, ok?232:228);
    doc.roundedRect(M,sy,TW,10,2,2,'F');
    doc.setFillColor(ok?26:176, ok?106:48, ok?74:16);
    doc.circle(M+6, sy+5, 2.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(7); doc.setFont('helvetica','bold');
    doc.text(ok?'OK':'X', M+4.5, sy+6.5);
    doc.setTextColor(20,24,20); doc.setFontSize(8); doc.setFont('helvetica','normal');
    doc.text(t('pdf-prob')+' '+(i+1)+': '+pdfText(prob.title), M+12, sy+6.5);
    doc.setTextColor(ok?26:176, ok?106:48, ok?74:16);
    doc.text(ok?t('pdf-right'):t('pdf-wrong'), PW-M-24, sy+6.5);
    sy += 12;
  });

  for (var i = 0; i < problems.length; i++) {
    var prob = problems[i];
    doc.addPage();
    var wy = 0;

    doc.setFillColor(pBR,pBG,pBB); doc.rect(0,0,PW,20,'F');
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,3,'F');
    doc.setTextColor(pAR,pAG,pAB); doc.setFontSize(7); doc.setFont('helvetica','normal');
    doc.text(pdfText(SCHOOL.courseName[LANG]) + '  ·  ' + pdfText(SCHOOL.guideTitle[LANG]), M, 10);
    doc.setTextColor(240,245,238); doc.setFontSize(10.5); doc.setFont('helvetica','bold');
    doc.text(t('pdf-prob')+' '+(i+1)+' '+t('pdf-of')+' '+total+'  ·  '+pdfText(prob.title), M, 17);
    wy = 25;

    var qRaw = pdfText(prob.questionText);
    doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var qLines = doc.splitTextToSize(qRaw, TW-10);
    var qBoxH  = 8 + qLines.length*5 + 3;
    doc.setFillColor(237,240,235); doc.roundedRect(M,wy,TW,qBoxH,2,2,'F');
    doc.setTextColor(pBR,pBG,pBB); doc.setFontSize(6.5); doc.setFont('helvetica','bold');
    doc.text(t('pdf-question'), M+4, wy+6);
    doc.setTextColor(20,24,20); doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var qy = wy+12;
    qLines.forEach(function(ln,li){ doc.text(ln, M+4, qy+li*5); });
    wy += qBoxH + 4;

    var isOk   = document.getElementById('pc'+i).classList.contains('ok');
    var chosen = prob.studentChoice != null ? pdfText(prob.options[prob.studentChoice]||'') : '';
    var corr   = pdfText(prob.options[prob.correctIdx]||'');
    var expRaw = pdfText(prob.explanation||'');
    doc.setFontSize(8.5); var chLines = doc.splitTextToSize(t('pdf-you')+' '+chosen, TW-18);
    doc.setFontSize(8);   var coLines = doc.splitTextToSize(t('pdf-ok')+' '+corr, TW-18);
    doc.setFontSize(7.5); var exLines = doc.splitTextToSize(t('pdf-sol')+' '+expRaw, TW-18).slice(0,6);
    var ansBoxH = 8 + chLines.length*5.5 + coLines.length*5 + exLines.length*5 + 6;
    doc.setFillColor(isOk?232:255, isOk?240:232, isOk?232:228);
    doc.roundedRect(M,wy,TW,ansBoxH,2,2,'F');
    doc.setFillColor(isOk?26:176, isOk?106:48, isOk?74:16);
    doc.circle(M+7, wy+8, 3.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(9); doc.setFont('helvetica','bold');
    doc.text(isOk?'OK':'X', M+5.2, wy+10.5);
    var ay = wy+7;
    doc.setTextColor(20,24,20); doc.setFontSize(8.5); doc.setFont('helvetica','bold');
    chLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5.5); });
    ay += chLines.length*5.5 + 3;
    doc.setTextColor(26,106,74); doc.setFontSize(8); doc.setFont('helvetica','normal');
    coLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    ay += coLines.length*5 + 3;
    doc.setTextColor(90,88,80); doc.setFontSize(7.5);
    exLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    wy += ansBoxH + 5;

    if (prob.showWork) {
      doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
      doc.setFontSize(7); doc.setFont('helvetica','bold');
      doc.rect(M,wy,TW,8,'F'); doc.text(t('pdf-work'), M+4, wy+5.5);
      wy += 11;

      var dc = document.getElementById('dc'+i);
      if (dc) {
        try {
          var imgD = dc.toDataURL('image/png');
          var ar   = dc.height / dc.width;
          var iw   = TW;
          var ih   = Math.min(iw * ar, 68);
          doc.addImage(imgD, 'PNG', M, wy, iw, ih);
          wy += ih + 4;
        } catch(e) {}
      }

      var ta = document.getElementById('ta'+i);
      if (ta && ta.value.trim()) {
        if (wy > PH-30) { doc.addPage(); wy = 20; }
        doc.setTextColor(20,24,20); doc.setFontSize(8); doc.setFont('courier','normal');
        var taLines = doc.splitTextToSize(ta.value, TW);
        taLines.slice(0,16).forEach(function(ln) {
          if (wy > PH-15) { doc.addPage(); wy = 20; }
          doc.text(ln, M, wy); wy += 5;
        });
        wy += 2;
      }

      var pp = document.getElementById('pp'+i);
      if (pp && pp.src && pp.src.indexOf('data:') === 0) {
        if (wy > PH-55) { doc.addPage(); wy = 20; }
        try { doc.addImage(pp.src, 'JPEG', M, wy, TW, 68); wy += 72; } catch(e) {}
      }
    }
  }

  var pages = doc.internal.getNumberOfPages();
  for (var p = 1; p <= pages; p++) {
    doc.setPage(p);
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0, PH-3, PW, 3, 'F');
    doc.setTextColor(130,140,130); doc.setFontSize(6.5); doc.setFont('helvetica','normal');
    doc.text(name+'  ·  '+group+'  ·  '+t('pdf-code')+': '+code+'  ·  '+t('pdf-page')+' '+p+'/'+pages,
      PW/2, PH-5, {align:'center'});
  }

  doc.save(SCHOOL.filePrefix + '_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf');
  btn.textContent = t('btn-pdf');
  btn.disabled  = false;
}

/* ================================================
   LOGO INJECTION + INITIAL UI STRINGS
   ================================================ */
document.addEventListener('DOMContentLoaded', function() {
  var wl = document.getElementById('wlogo-left');
  if (wl && SCHOOL.logoLeftB64)  { wl.src = SCHOOL.logoLeftB64;  wl.style.display = 'block'; }
  var wr = document.getElementById('wlogo-right');
  var sep = document.getElementById('wlogsep');
  if (wr && SCHOOL.logoRightB64) { wr.src = SCHOOL.logoRightB64; wr.style.display = 'block'; }
  else { if (wr) wr.style.display = 'none'; if (sep) sep.style.display = 'none'; }
  var hl = document.getElementById('hlogo-left');
  if (hl && SCHOOL.logoLeftB64)  { hl.src = SCHOOL.logoLeftB64;  hl.style.display = 'block'; }
  var hr = document.getElementById('hlogo-right');
  if (hr && SCHOOL.logoRightB64) { hr.src = SCHOOL.logoRightB64; hr.style.display = 'block'; }
  var be = document.getElementById('btn-es'), bn = document.getElementById('btn-en');
  if (be) be.classList.toggle('active', LANG === 'es');
  if (bn) bn.classList.toggle('active', LANG === 'en');
  document.documentElement.setAttribute('lang', LANG);
  applyUIStrings();
});
</script>
</body>
</html>
