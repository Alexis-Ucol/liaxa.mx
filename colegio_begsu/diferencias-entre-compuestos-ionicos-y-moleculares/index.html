/* ══════════════════════════════════════════════════════════════════════════
   buildLesson :: concepto -> manipulativo -> problema, intercalado (Rule 1)
   ══════════════════════════════════════════════════════════════════════════ */
function buildLesson(rng){
  injectGuideCSS();

  /* ── Apertura ── */
  sec(
    L({ es:'Punto de partida', en:'Starting point' }),
    L({ es:'Dos polvos blancos que no se parecen en nada', en:'Two white powders with nothing in common' }),
    '<p>' + L({
      es:'En la cocina hay dos frascos con polvo blanco: uno tiene sal y el otro azúcar. A simple vista son casi iguales, los dos se disuelven en agua y los dos son sólidos a temperatura ambiente. Sin embargo, uno funde hasta los 801 °C y el otro empieza a derretirse antes de los 190 °C; uno vuelve conductora el agua en la que se disuelve y el otro la deja tan aislante como estaba. La diferencia no está en el color: está en cómo se unieron sus átomos.',
      en:'In the kitchen there are two jars with white powder: one holds salt and the other sugar. To the eye they are almost identical, both dissolve in water and both are solid at room temperature. Yet one melts only at 801 °C and the other starts to melt before 190 °C; one turns the water it dissolves in into a conductor and the other leaves it as insulating as it was. The difference is not in the colour: it is in how their atoms joined.'
    }) + '</p>' +
    '<p>' + L({
      es:'En esta guía vas a juntar átomos y ver qué hacen sus electrones, armarás fórmulas equilibrando cargas, encenderás un foco con la disolución correcta y recibirás muestras selladas para identificarlas con las pruebas que tú elijas.',
      en:'In this guide you are going to put atoms together and watch what their electrons do, you will build formulas by balancing charges, you will light a bulb with the right solution and you will get sealed samples to identify with the tests you choose.'
    }) + '</p>' +
    '<div class="gw-lbl">' + L({ es:'Lo que vas a aprender a distinguir', en:'What you will learn to tell apart' }) + '</div>' +
    '<div>' +
      '<span class="gw-chip">' + L({ es:'transferencia de electrones', en:'electron transfer' }) + '</span>' +
      '<span class="gw-chip">' + L({ es:'electrones compartidos', en:'shared electrons' }) + '</span>' +
      '<span class="gw-chip">' + L({ es:'electronegatividad', en:'electronegativity' }) + '</span>' +
      '<span class="gw-chip">' + L({ es:'red iónica', en:'ionic lattice' }) + '</span>' +
      '<span class="gw-chip">' + L({ es:'moléculas', en:'molecules' }) + '</span>' +
      '<span class="gw-chip">' + L({ es:'punto de fusión', en:'melting point' }) + '</span>' +
      '<span class="gw-chip">' + L({ es:'conductividad', en:'conductivity' }) + '</span>' +
      '<span class="gw-chip">' + L({ es:'usos en el cuerpo', en:'uses in the body' }) + '</span>' +
    '</div>'
  );

  /* ══ CONCEPTO 1 ══ */
  var s1 = sec(
    L({ es:'Concepto 1', en:'Concept 1' }),
    L({ es:'Ceder o compartir: la decisión ocurre en la capa externa', en:'Give up or share: the decision happens in the outer shell' }),
    '<p>' + L({
      es:'Cuando dos átomos se encuentran, lo único que está en juego son los electrones de su capa más externa. Un metal del lado izquierdo de la tabla tiene pocos electrones ahí y los sujeta con poca fuerza, así que le sale barato soltarlos. Un no metal del lado derecho está a punto de completar su capa y jala electrones con fuerza. Si se juntan uno de cada zona, los electrones pasan completos del metal al no metal: el metal queda con carga positiva, el no metal con carga negativa y la atracción entre esas cargas opuestas los mantiene unidos. Eso es un compuesto iónico.',
      en:'When two atoms meet, the only thing at stake are the electrons of their outermost shell. A metal from the left side of the table has few electrons there and holds them loosely, so releasing them comes cheap. A nonmetal from the right side is about to complete its shell and pulls electrons hard. If one from each zone comes together, the electrons pass whole from the metal to the nonmetal: the metal is left with positive charge, the nonmetal with negative charge and the attraction between those opposite charges holds them together. That is an ionic compound.'
    }) + '</p>' +
    '<p>' + L({
      es:'Si en cambio se encuentran dos no metales, ninguno logra arrancarle nada al otro: los dos jalan y terminan compartiendo pares de electrones. Ninguno queda cargado y el resultado es una partícula neutra con un número definido de átomos, una molécula. La fuerza con que cada átomo jala los electrones compartidos se mide con la electronegatividad, un número que crece hacia la derecha y hacia arriba de la tabla. Como regla de trabajo, cuando la diferencia entre los dos valores llega a 1.7 o más entre un metal y un no metal, la transferencia gana y el compuesto es iónico; por debajo de eso, los electrones se comparten, a veces de forma pareja y a veces cargada hacia el átomo más electronegativo.',
      en:'If instead two nonmetals meet, neither manages to pull anything off the other: both tug and end up sharing pairs of electrons. Neither is left charged and the result is a neutral particle with a definite number of atoms, a molecule. The strength with which each atom pulls the shared electrons is measured by electronegativity, a number that grows to the right and upwards in the table. As a working rule, when the difference between the two values reaches 1.7 or more between a metal and a nonmetal, transfer wins and the compound is ionic; below that, the electrons are shared, sometimes evenly and sometimes leaning toward the more electronegative atom.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Metal con no metal', en:'Metal with nonmetal' }), L({ es:'transferencia', en:'transfer' }), L({ es:'quedan iones de carga opuesta', en:'opposite charged ions are left' })) +
      rcard(L({ es:'No metal con no metal', en:'Nonmetal with nonmetal' }), L({ es:'compartición', en:'sharing' }), L({ es:'queda una molécula neutra', en:'a neutral molecule is left' })) +
      rcard(L({ es:'Electronegatividad', en:'Electronegativity' }), L({ es:'crece a la derecha', en:'grows to the right' }), L({ es:'mide cuánto jala cada átomo', en:'measures how hard each atom pulls' })) +
      rcard(L({ es:'Umbral práctico', en:'Practical threshold' }), L({ es:'ΔEN 1.7', en:'ΔEN 1.7' }), L({ es:'se lee junto con la zona de la tabla', en:'read together with the zone of the table' })) +
    '</div>' +
    '<div class="callout"><p><strong>' + L({ es:'Ojo: ', en:'Careful: ' }) + '</strong>' + L({
      es:'el número no manda solo. El flúor y el hidrógeno tienen una diferencia de 1.78 y aun así comparten electrones, porque los dos son no metales: la compartición queda muy despareja, pero no hay transferencia ni iones.',
      en:'the number does not rule on its own. Fluorine and hydrogen have a difference of 1.78 and still share electrons, because both are nonmetals: the sharing comes out very lopsided, but there is no transfer and no ions.'
    }) + '</p></div>'
  );
  wEnlace(rng, widgetHost(s1, 'wEnlace', 'enlace'));
  addProblem(rng, mkP1(rng));
  addProblem(rng, mkP2(rng));

  /* ══ CONCEPTO 2 ══ */
  var s2 = sec(
    L({ es:'Concepto 2', en:'Concept 2' }),
    L({ es:'Una red sin moléculas y unas moléculas sin red', en:'A lattice without molecules and molecules without a lattice' }),
    '<p>' + L({
      es:'Dentro de un cristal de sal no existe ninguna pareja de socios. Cada ion sodio está rodeado por seis iones cloruro y cada ion cloruro por seis iones sodio, en una red que se repite en las tres direcciones hasta el borde del grano. Por eso la fórmula NaCl no describe una molécula: dice en qué proporción entran los iones en esa red, y por eso se le llama fórmula unitaria. La proporción sale de una condición estricta: la carga total tiene que ser cero, así que las cargas de los iones deciden cuántos de cada uno hacen falta.',
      en:'Inside a salt crystal there is no pair of partners. Each sodium ion is surrounded by six chloride ions and each chloride ion by six sodium ions, in a lattice that repeats in three directions out to the edge of the grain. That is why the formula NaCl does not describe a molecule: it says in what ratio the ions enter that lattice, and that is why it is called a unit formula. The ratio comes from a strict condition: the total charge has to be zero, so the charges of the ions decide how many of each are needed.'
    }) + '</p>' +
    '<p>' + L({
      es:'En un compuesto molecular ocurre lo contrario. La unidad real sí existe y se puede contar: una molécula de agua tiene exactamente dos átomos de hidrógeno y uno de oxígeno, fuertemente unidos entre sí. Lo que es débil no está dentro de la molécula sino entre una molécula y la siguiente. Un sólido molecular es entonces un montón de partículas completas apiladas, sujetas por fuerzas flojas, mientras que un sólido iónico es una sola estructura continua de cargas alternadas.',
      en:'In a molecular compound the opposite happens. The real unit does exist and can be counted: a water molecule has exactly two hydrogen atoms and one oxygen atom, strongly joined to each other. What is weak is not inside the molecule but between one molecule and the next. A molecular solid is then a pile of complete particles stacked together, held by loose forces, while an ionic solid is a single continuous structure of alternating charges.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Sólido iónico', en:'Ionic solid' }), L({ es:'red continua', en:'continuous lattice' }), L({ es:'cargas alternadas, sin moléculas', en:'alternating charges, no molecules' })) +
      rcard(L({ es:'Fórmula unitaria', en:'Unit formula' }), L({ es:'proporción mínima', en:'smallest ratio' }), L({ es:'la carga total queda en cero', en:'the total charge comes out zero' })) +
      rcard(L({ es:'Sólido molecular', en:'Molecular solid' }), L({ es:'partículas contables', en:'countable particles' }), L({ es:'moléculas apiladas una junto a otra', en:'molecules stacked side by side' })) +
      rcard(L({ es:'Dónde está lo débil', en:'Where the weak part is' }), L({ es:'entre moléculas', en:'between molecules' }), L({ es:'nunca dentro de la molécula', en:'never inside the molecule' })) +
    '</div>' +
    '<div class="callout"><p>' + L({
      es:'Al derretir una vela no rompes ninguna molécula: solo las despegas unas de otras. Al fundir sal, en cambio, hay que desarmar la red entera de iones, y eso cuesta muchísimo más.',
      en:'Melting a candle breaks no molecule: it only unsticks them from one another. Melting salt, on the other hand, means taking apart the whole lattice of ions, and that costs a great deal more.'
    }) + '</p></div>'
  );
  wCargas(rng, widgetHost(s2, 'wCargas', 'cargas'));
  addProblem(rng, mkP3(rng));
  addProblem(rng, mkP4(rng));

  /* ══ CONCEPTO 3 ══ */
  var s3 = sec(
    L({ es:'Concepto 3', en:'Concept 3' }),
    L({ es:'Cuatro pruebas de mesa que los separan', en:'Four bench tests that tell them apart' }),
    '<p>' + L({
      es:'Nadie ve los iones ni las moléculas, pero las dos estructuras dejan huellas distintas en pruebas sencillas. La primera es la temperatura de fusión: los compuestos iónicos suelen fundir por arriba de los 600 °C y muchos moleculares lo hacen por debajo de los 200 °C. La segunda es el comportamiento ante un golpe: el cristal iónico es duro pero frágil y se parte con caras planas, mientras que el sólido molecular es blando y se deforma o se desmorona. La tercera es la solubilidad, que por sí sola no decide nada, porque la sal y el azúcar se disuelven las dos.',
      en:'Nobody sees the ions or the molecules, but the two structures leave different traces in simple tests. The first is the melting temperature: ionic compounds usually melt above 600 °C and many molecular ones do so below 200 °C. The second is behaviour under a blow: the ionic crystal is hard but brittle and splits along flat faces, while the molecular solid is soft and deforms or crumbles. The third is solubility, which on its own decides nothing, because salt and sugar both dissolve.'
    }) + '</p>' +
    '<p>' + L({
      es:'La prueba que más información da es la cuarta: la conductividad eléctrica. Para que pase corriente hace falta que haya partículas con carga y que además puedan moverse. En un sólido iónico las cargas están ahí, pero atrapadas en la red, así que el sólido no conduce; al disolverlo o al fundirlo, los mismos iones quedan libres y la corriente pasa. En un compuesto molecular no hay cargas libres en ningún estado, así que ni disuelto ni fundido enciende el foco. Un solo dato rara vez alcanza: la conclusión firme sale de cruzar dos o tres pruebas.',
      en:'The test that gives the most information is the fourth: electrical conductivity. For current to pass there must be charged particles and they must also be able to move. In an ionic solid the charges are there, but trapped in the lattice, so the solid does not conduct; on dissolving it or melting it, those same ions come free and the current passes. In a molecular compound there are no free charges in any state, so neither dissolved nor molten does it light the bulb. A single result is rarely enough: a firm conclusion comes from crossing two or three tests.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Fusión', en:'Melting' }), L({ es:'alta contra baja', en:'high against low' }), L({ es:'mide qué tan fuerte está sujeta cada partícula', en:'measures how tightly each particle is held' })) +
      rcard(L({ es:'Golpe', en:'Blow' }), L({ es:'frágil contra blando', en:'brittle against soft' }), L({ es:'caras planas o deformación', en:'flat faces or deformation' })) +
      rcard(L({ es:'Solubilidad', en:'Solubility' }), L({ es:'no decide sola', en:'does not decide alone' }), L({ es:'los dos tipos pueden disolverse', en:'both types can dissolve' })) +
      rcard(L({ es:'Conductividad', en:'Conductivity' }), L({ es:'la prueba clave', en:'the key test' }), L({ es:'exige cargas libres en movimiento', en:'demands free charges on the move' })) +
    '</div>' +
    '<div class="callout"><p><strong>' + L({ es:'Ojo: ', en:'Careful: ' }) + '</strong>' + L({
      es:'un sólido iónico que no enciende el foco no es prueba de nada. Sus iones existen, pero están inmóviles. La pregunta correcta no es si hay cargas, sino si esas cargas se pueden mover.',
      en:'an ionic solid that fails to light the bulb proves nothing. Its ions are there, but they are motionless. The right question is not whether there are charges, but whether those charges can move.'
    }) + '</p></div>'
  );
  wCircuito(rng, widgetHost(s3, 'wCircuito', 'circuito'));
  addProblem(rng, mkP5(rng));
  wPruebas(rng, widgetHost(s3, 'wPruebas', 'pruebas'));
  addProblem(rng, mkP6(rng));

  /* ══ CONCEPTO 4 ══ */
  var s4 = sec(
    L({ es:'Concepto 4', en:'Concept 4' }),
    L({ es:'Los mismos dos tipos, dentro y fuera del cuerpo', en:'The same two types, inside and outside the body' }),
    '<p>' + L({
      es:'Tu cuerpo usa los dos tipos al mismo tiempo y para tareas opuestas. Los iones sodio, potasio, calcio y cloruro viajan disueltos en la sangre y en los líquidos de las células: como llevan carga, su movimiento a través de las membranas es lo que produce el impulso nervioso y la contracción de un músculo. Por eso una persona deshidratada recibe suero con sales, y por eso un sobre de rehidratación oral trae cloruro de sodio y cloruro de potasio. En el hueso, en cambio, el fosfato de calcio forma una red iónica rígida y poco soluble que sostiene el peso del esqueleto.',
      en:'Your body uses both types at the same time and for opposite jobs. Sodium, potassium, calcium and chloride ions travel dissolved in the blood and in the fluids of the cells: since they carry charge, their movement across the membranes is what produces the nerve impulse and the contraction of a muscle. That is why a dehydrated person gets saline with salts, and why an oral rehydration sachet contains sodium chloride and potassium chloride. In the bone, on the other hand, calcium phosphate forms a rigid, barely soluble ionic lattice that carries the weight of the skeleton.'
    }) + '</p>' +
    '<p>' + L({
      es:'Los compuestos moleculares hacen el trabajo contrario: agua, glucosa, urea, grasas y vitaminas circulan como partículas neutras completas, entran y salen de las células y se transforman sin liberar cargas. Fuera del cuerpo el reparto se repite. Los recubrimientos de los hornos y las cerámicas resistentes se hacen con óxidos iónicos porque su red aguanta miles de grados; los disolventes de limpieza para electrónica son moleculares porque no dejan residuos con carga; la sal que se esparce sobre el hielo funciona precisamente porque se separa en iones al disolverse.',
      en:'Molecular compounds do the opposite job: water, glucose, urea, fats and vitamins travel as complete neutral particles, go in and out of the cells and are transformed without releasing charges. Outside the body the split repeats itself. Furnace linings and hard ceramics are made with ionic oxides because their lattice withstands thousands of degrees; cleaning solvents for electronics are molecular because they leave no charged residue; the salt spread over ice works precisely because it splits into ions on dissolving.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Iones en el cuerpo', en:'Ions in the body' }), L({ es:'señales y minerales', en:'signals and minerals' }), L({ es:'impulso nervioso, músculo, hueso', en:'nerve impulse, muscle, bone' })) +
      rcard(L({ es:'Moléculas en el cuerpo', en:'Molecules in the body' }), L({ es:'transporte y energía', en:'transport and energy' }), L({ es:'agua, glucosa, urea, vitaminas', en:'water, glucose, urea, vitamins' })) +
      rcard(L({ es:'Uso industrial iónico', en:'Ionic industrial use' }), L({ es:'resiste el calor', en:'stands the heat' }), L({ es:'cerámicas y recubrimientos de horno', en:'ceramics and furnace linings' })) +
      rcard(L({ es:'Uso industrial molecular', en:'Molecular industrial use' }), L({ es:'sin residuo con carga', en:'no charged residue' }), L({ es:'disolventes, combustibles, plásticos', en:'solvents, fuels, plastics' })) +
    '</div>' +
    '<div class="callout"><p>' + L({
      es:'Ninguno de los dos tipos es mejor que el otro: cada aplicación elige el que le sirve. Si hace falta conducir una señal, se buscan iones; si hace falta viajar sin alterar cargas, se buscan moléculas.',
      en:'Neither of the two types is better than the other: each application picks the one that suits it. If a signal has to be carried, ions are wanted; if something has to travel without disturbing charges, molecules are wanted.'
    }) + '</p></div>'
  );
  addProblem(rng, mkP7(rng));
  addProblem(rng, mkP8(rng));
  wCuaderno(rng, widgetHost(s4, 'wCuaderno', 'reflect'));

  /* ══ CIERRE :: sin explicacion previa (Rule 1) ══ */
  sec(
    L({ es:'Para cerrar', en:'To close' }),
    L({ es:'Tú decides', en:'Your call' }),
    '<p>' + L({
      es:'Dos casos nuevos y todo lo que ya sabes leer en ellos.',
      en:'Two new cases and everything you already know how to read in them.'
    }) + '</p>'
  );
  addProblem(rng, mkP9(rng));
  addProblem(rng, mkP10(rng));
}
</script>

<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbykkuJ_apGq3vALIFd4mr3acu81c7K4OKxW-DZ-i52Ceyl3lOanXMdvbS9SIXPrLQBm/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'Diferencias entre Compuestos Iónicos y Moleculares';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
