<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mitos, Leyendas, Corridos y Refranes: Clasificación y Rasgos</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:100px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; text-align:justify; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 76px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Mitos, Leyendas, Corridos y Refranes: Clasificación y Rasgos</div>
    <div class="wcourse" id="wcourse-el">Español · 1° de Secundaria · Creaciones literarias tradicionales y contemporáneas</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Mitos, Leyendas, Corridos y Refranes: Clasificación y Rasgos</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="sbtn" id="dlBtn" onclick="generatePDF()" style="max-width:280px;margin:0 auto;">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   CENTRALIZED SCHOOL CONFIG (Rule 16) — ships UNBRANDED (Rule 11).
   The ONLY rebranding point. build_all.py substitutes these exact fields
   (BRAND_FIELDS / RGB_FIELDS / logo*) downstream; :root/dark stay as fallback.
   Neutral defaults below == the static :root/dark values, so unbranded == no-op.
   ══════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:'#545484', primaryDark:'#202033', primaryBg:'#ececf1',
  accent:'#e43c3c', accentBg:'#fbdfdf',
  darkPrimary:'#6f6f9a', darkPrimaryDark:'#9a9ac0', darkPrimaryBg:'#1b1b2b',

/* ── Drawing palette, derived from the school's colours (Rule 16) ─────────
   slots 1-2 : school primary + accent
   slots 3-4 : the two of black/red/blue/green least similar to the school colours
   Falls back to neutral defaults if SCHOOL colours can't be parsed.
   ───────────────────────────────────────────────────────────────────── */
var DRAW_PALETTE = (function () {
  function hex2rgb(h) {
    h = String(h).replace('#', '');
    if (h.length === 3) { h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2]; }
    return [parseInt(h.substr(0,2),16), parseInt(h.substr(2,2),16), parseInt(h.substr(4,2),16)];
  }
  function dist(a, b) {
    var dr = a[0]-b[0], dg = a[1]-b[1], db = a[2]-b[2];
    return Math.sqrt(2*dr*dr + 4*dg*dg + 3*db*db);
  }
  var COMMON = ['#1a1a16', '#c0392b', '#1d4e89', '#1a7a3a'];  /* black, red, blue, green */
  var schoolRGB;
  try {
    schoolRGB = [hex2rgb(SCHOOL.primary), hex2rgb(SCHOOL.accent)];
  } catch (e) {
    return [SCHOOL.primary, SCHOOL.accent, '#1a1a16', '#1d4e89'];
  }
  var scored = COMMON.map(function (c, idx) {
    var rgb = hex2rgb(c);
    var nearest = Math.min(dist(rgb, schoolRGB[0]), dist(rgb, schoolRGB[1]));
    return { c: c, idx: idx, d: nearest };
  });
  scored.sort(function (a, b) { return b.d - a.d; });      /* farthest first */
  var keep = scored.slice(0, 2);
  keep.sort(function (a, b) { return a.idx - b.idx; });    /* restore visual order */
  return [SCHOOL.primary, SCHOOL.accent, keep[0].c, keep[1].c];
})();

           '" style="background:' + c + '"></div>';
  }).join('');
}

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = DRAW_PALETTE[0];   // matches the first (selected) dot = SCHOOL.primary
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });

}

async function generatePDF() {
  var btn = document.getElementById('dlBtn');
  btn.textContent = 'Generando PDF…';
  btn.disabled = true;

  var jspdf   = window.jspdf;
  var doc     = new jspdf.jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });
  var PW      = 215.9;
  var M       = 18;
  var TW      = PW - M * 2;
  var PH      = doc.internal.pageSize.height;
  var name    = studentData.name;
  var group   = studentData.group;
  var total   = problems.length;
  var pct     = Math.round(correctCount / total * 100);
  var dateStr = new Date().toLocaleString('es-MX', { dateStyle:'long', timeStyle:'short' });

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS — INJECTION BLOCK ─────────────────────────────────────────
  //   Match these RGB values to --green and --gold above.
  //   PRIMARY  → pBR, pBG, pBB
  //   ACCENT   → pAR, pAG, pAB
  // ──────────────────────────────────────────────────────────────────────────
  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;  // PRIMARY (from SCHOOL, Rule 16)
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;   // ACCENT (from SCHOOL, Rule 16)

  function pdfText(html) {
    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/\u2192/g,'->').replace(/\u2212/g,'-').replace(/\u00b2/g,'^2')
      .replace(/\u00b3/g,'^3').replace(/\u00d7/g,'x').replace(/\u00f7/g,'/')
      .replace(/\u2260/g,'!=').replace(/\u2264/g,'<=').replace(/\u2265/g,'>=')
      .replace(/\u221a/g,'sqrt').replace(/\u03c0/g,'pi').replace(/\u2026/g,'...')
      .replace(/\s+/g,' ').trim();

  //   it), so on iPhone/iPad a plain download fails silently. We branch:
  //     • iOS  → native share sheet (→ "Save to Files"); if unavailable, open
  //              the PDF inline so the student can tap Safari's own Share.
  //     • else → <a download> click (works on desktop + Android).
  //   The whole function runs synchronously off the tap (no await above), which
  //   is what lets iOS accept navigator.share(). Do NOT add an await before this.
  // ──────────────────────────────────────────────────────────────────────────
  var _fname   = 'esp1_t04_g01_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf';
  var _pdfBlob = doc.output('blob');

  function _restorePdfBtn(){ btn.innerHTML = '⬇ &nbsp;' + t('btn-pdf'); btn.disabled = false; }
  function _openPdfInline(b){
    var u = URL.createObjectURL(b);
    var w = window.open(u, '_blank');
    if (!w) { window.location.href = u; }   // popup blocked → same tab
    setTimeout(function(){ URL.revokeObjectURL(u); }, 60000);
  }

  // iPadOS 13+ reports as "MacIntel" with a touch screen, so test for that too.
  var _isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
               (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  if (_isIOS) {
    var _pdfFile = new File([_pdfBlob], _fname, { type:'application/pdf' });
    if (navigator.canShare && navigator.canShare({ files:[_pdfFile] })) {
      navigator.share({ files:[_pdfFile], title:_fname })
        .then(_restorePdfBtn)
        .catch(function(e){
          if (e && e.name === 'AbortError') { _restorePdfBtn(); return; } // cancelled
          _openPdfInline(_pdfBlob); _restorePdfBtn();
        });
      return;
    }
    _openPdfInline(_pdfBlob); _restorePdfBtn();   // older iOS: open inline
    return;
  }

  // Desktop + Android: the native download works.
  var _dlUrl = URL.createObjectURL(_pdfBlob);
  var _dlA   = document.createElement('a');
  _dlA.href  = _dlUrl; _dlA.download = _fname;
  document.body.appendChild(_dlA); _dlA.click();
  setTimeout(function(){ document.body.removeChild(_dlA); URL.revokeObjectURL(_dlUrl); }, 200);
  _restorePdfBtn();
}

      qs: {
        p3:{ title:{ es:'Por qué es un mito', en:'Why it is a myth' },
             stmt:{ es:'Vuelve al texto «El agua que faltaba» que aparece arriba. ¿Qué rasgo permite clasificarlo como mito y no como leyenda?',
                    en:'Go back to the text «El agua que faltaba» above. Which feature lets you classify it as a myth and not as a legend?' },
             options:{ es:['Ocurre en un tiempo anterior al mundo que conocemos y explica el origen del manantial','Menciona un cerro que existe de verdad y que la gente del pueblo puede visitar','Lo cuentan personas mayores que aseguran haberlo escuchado desde niñas','Termina con una frase breve sobre cómo conviene comportarse con el agua'],
                       en:['It happens in a time before the world we know and explains the origin of the spring','It mentions a hill that really exists and that the villagers can visit','It is told by older people who claim to have heard it since they were children','It ends with a short sentence about how one should behave with water'] },
             correct:0,
             hint:{ es:'Fíjate en cuándo ocurre lo que se cuenta y en qué queda explicado en el último párrafo.',
                    en:'Notice when what is told happens and what ends up explained in the last paragraph.' },
             expl:{ es:'El mito se sitúa en un tiempo fundador, cuando el mundo todavía se estaba haciendo, y sirve para explicar por qué las cosas son como son: aquí, por qué brota agua de la piedra. Que el cerro exista o que lo cuenten los mayores ocurre igual en las leyendas.',
                    en:'The myth is set in a founding time, when the world was still being made, and it serves to explain why things are as they are: here, why water springs from the rock. That the hill exists or that elders tell it happens in legends too.' } },
        p4:{ title:{ es:'Lo que ancla a la leyenda', en:'What anchors the legend' },
             stmt:{ es:'Vuelve al texto «La campana del Cerro». ¿Qué lo distingue del relato del manantial que leíste antes?',
                    en:'Go back to the text «La campana del Cerro». What sets it apart from the tale of the spring you read before?' },
             options:{ es:['Se ubica en una fecha y un lugar precisos, con personas que se nombran y testigos que la sostienen','Cuenta algo que ninguna persona del pueblo puede confirmar ni desmentir con seguridad','Emplea palabras antiguas que ya casi nadie usa en la conversación de todos los días','Se transmite de boca en boca sin que se sepa quién lo contó por primera vez'],
                       en:['It is set on a precise date and place, with people who are named and witnesses who back it up','It tells something no person in the village can confirm or deny with certainty','It uses old words that almost nobody uses in everyday conversation anymore','It travels by word of mouth without anyone knowing who first told it'] },
             correct:0,
             hint:{ es:'Compara la fecha, el lugar y los nombres propios de este texto con los del relato anterior.',
                    en:'Compare the date, the place and the proper names of this text with those of the previous tale.' },
             expl:{ es:'La leyenda se cuenta como si hubiera pasado aquí, en un año que se puede decir, con personas de nombre y apellido y con alguien que jura haberlo visto u oído. Lo que dicen las dos opciones descartadas, la transmisión oral y la imposibilidad de comprobar, le ocurre también al mito.',
                    en:'The legend is told as if it had happened here, in a year that can be stated, with people who have first and last names and with someone who swears to have seen or heard it. What the two discarded options say, oral transmission and the impossibility of checking, happens to the myth as well.' } },
        p5:{ title:{ es:'La estrofa que cierra', en:'The stanza that closes' },
             stmt:{ es:'En el «Corrido del arriero Casimiro», la última estrofa empieza con «Ya con esta me despido». ¿Qué función cumple esa estrofa dentro del corrido?',
                    en:'In the «Corrido del arriero Casimiro», the last stanza begins with «Ya con esta me despido». What role does that stanza play inside the corrido?' },
             options:{ es:['Cierra el canto y le avisa al público que la historia contada llega a su fin','Anuncia que enseguida se cantará una segunda historia sobre el mismo pueblo','Presenta al personaje principal para que el público sepa de quién se habla','Indica el año y el lugar en que ocurrieron los hechos que se están cantando'],
                       en:['It closes the singing and tells the audience that the story being told reaches its end','It announces that a second story about the same village will be sung next','It introduces the main character so the audience knows who is being spoken of','It states the year and the place where the events being sung took place'] },
             correct:0,
             hint:{ es:'El corrido se canta de una sola vez frente a gente reunida: pregúntate qué necesita oír esa gente cuando el cantante va a callarse.',
                    en:'A corrido is sung in one go before a gathered crowd: ask what those people need to hear when the singer is about to stop.' },
             expl:{ es:'La despedida es una fórmula fija con la que el cantante anuncia el final y agradece la escucha. La fecha y el lugar ya se dieron en la primera estrofa y el personaje se presentó en la segunda, así que a la última solo le queda cerrar.',
                    en:'The farewell is a fixed formula with which the singer announces the ending and thanks the listeners. The date and place were already given in the first stanza and the character was introduced in the second, so the last one is only left to close.' } },
        p8:{ title:{ es:'El refrán que cabe', en:'The refrán that fits' },
             stmt:{ es:'Casimiro apostó delante de todo el pueblo que subiría la campana él solo, y lo repitió durante días. Si un vecino hubiera dudado de él antes de verlo, ¿cuál de estos refranes habría usado?',
                    en:'Casimiro bet in front of the whole village that he would raise the bell by himself, and he repeated it for days. If a neighbour had doubted him before seeing it, which of these refranes would they have used?' },
             options:{ es:['«Del dicho al hecho hay mucho trecho.»','«Camarón que se duerme, se lo lleva la corriente.»','«A río revuelto, ganancia de pescadores.»','«No por mucho madrugar amanece más temprano.»'],
                       en:['«Del dicho al hecho hay mucho trecho.»','«Camarón que se duerme, se lo lleva la corriente.»','«A río revuelto, ganancia de pescadores.»','«No por mucho madrugar amanece más temprano.»'] },
             correct:0,
             hint:{ es:'La duda del vecino no era sobre la altura del campanario, sino sobre la distancia entre lo que Casimiro decía y lo que podía hacer.',
                    en:'The neighbour was not doubting the height of the belfry, but the distance between what Casimiro said and what he could do.' },
             expl:{ es:'Quien duda de una promesa señala exactamente esa distancia: decirlo cuesta poco, hacerlo cuesta. Los otros tres aconsejan sobre el descuido propio, sobre quien saca provecho del desorden ajeno y sobre la prisa, y ninguna de esas situaciones es la del arriero.',
                    en:'Whoever doubts a promise points at exactly that distance: saying it costs little, doing it costs. The other three advise about carelessness, about who profits from the disorder of others and about haste, and none of those situations is that of the muleteer.' } },
        p9:{ title:{ es:'Una pieza más para el cuaderno', en:'One more piece for the notebook' },
             stmt:{ es:'Alguien recogió este fragmento en el mismo pueblo: «Antes de que hubiera caminos, el Viento y la Piedra discutieron por quién guardaría la semilla del primer árbol; de aquella discusión quedaron los remolinos que hoy levantan el polvo en el llano.» ¿En qué grupo lo clasificarías?',
                    en:'Somebody collected this fragment in the same village: «Antes de que hubiera caminos, el Viento y la Piedra discutieron por quién guardaría la semilla del primer árbol; de aquella discusión quedaron los remolinos que hoy levantan el polvo en el llano.» In which group would you classify it?' },
             options:{ es:['Mito, porque ocurre antes del mundo conocido y explica por qué existen los remolinos','Leyenda, porque nombra un llano que se puede visitar a las afueras del pueblo','Corrido, porque cuenta un enfrentamiento entre dos personajes bien definidos','Refrán, porque deja una enseñanza sobre discutir por algo que no es de nadie'],
                       en:['Myth, because it happens before the known world and explains why whirlwinds exist','Legend, because it names a plain that can be visited on the edge of the village','Corrido, because it tells a confrontation between two well defined characters','Refrán, because it leaves a lesson about arguing over something that belongs to nobody'] },
             correct:0,
             hint:{ es:'Revisa dos cosas: cuándo ocurre lo que se cuenta y qué queda explicado en la parte final.',
                    en:'Check two things: when what is told happens and what ends up explained in the final part.' },
             expl:{ es:'El fragmento se sitúa antes de que existieran los caminos, convierte al viento y a la piedra en personajes y termina explicando de dónde salieron los remolinos. Esos tres rasgos juntos definen al mito: no hay verso, ni fecha, ni testigo que lo sostenga.',
                    en:'The fragment is set before roads existed, turns the wind and the stone into characters and ends by explaining where whirlwinds came from. Those three features together define the myth: there is no verse, no date and no witness backing it.' } },
        p10:{ title:{ es:'Cuatro montones en el cuaderno', en:'Four piles in the notebook' },
              stmt:{ es:'Vas a ordenar lo que recogiste en el pueblo: el relato del manantial, la historia de la campana, el corrido del arriero y los refranes de tu abuela. ¿Qué criterio te permite separarlos en cuatro grupos distintos?',
                     en:'You are going to sort what you collected in the village: the tale of the spring, the story of the bell, the corrido of the muleteer and the refranes of your grandmother. Which criterion lets you separate them into four different groups?' },
              options:{ es:['Para qué sirve cada texto y con qué forma lo consigue: explicar un origen, contar un suceso del pueblo, cantar una historia en verso o aconsejar en una sola frase','La edad que tenía la persona que te contó cada uno de los cuatro textos','El número de personajes que llega a aparecer dentro de cada uno de ellos','Si el texto habla del agua del cerro o si habla de algún otro asunto'],
                        en:['What each text is for and with which form it achieves it: explaining an origin, telling a village event, singing a story in verse or advising in a single sentence','The age of the person who told you each one of the four texts','The number of characters that ends up appearing inside each one of them','Whether the text speaks of the hill water or of some other subject'] },
              correct:0,
              hint:{ es:'Los cuatro salieron del mismo pueblo y llegaron a ti de la misma manera, así que el origen no puede ser lo que los separa.',
                     en:'All four came from the same village and reached you the same way, so their origin cannot be what separates them.' },
              expl:{ es:'Como los cuatro se transmiten de boca en boca dentro de la misma comunidad, lo que los distingue no es de dónde vienen sino qué hacen y cómo están hechos. Por eso el mito, la leyenda, el corrido y el refrán forman montones distintos aunque los cuatro hablen del mismo cerro.',
                     en:'Since all four travel by word of mouth inside the same community, what tells them apart is not where they come from but what they do and how they are made. That is why myth, legend, corrido and refrán form different piles even though all four speak of the same hill.' } }

             options:{ es:['Ocurre en un tiempo anterior al mundo que conocemos y explica el origen del maíz','Menciona un valle que existe de verdad y que la gente del pueblo puede recorrer','Lo cuentan personas mayores que aseguran haberlo escuchado desde niñas','Termina con una frase breve sobre cómo conviene tratar a las hormigas'],
                       en:['It happens in a time before the world we know and explains the origin of maize','It mentions a valley that really exists and that the villagers can walk through','It is told by older people who claim to have heard it since they were children','It ends with a short sentence about how one should treat ants'] },
             correct:0,
             hint:{ es:'Fíjate en cuándo ocurre lo que se cuenta y en qué queda explicado en el último párrafo.',
                    en:'Notice when what is told happens and what ends up explained in the last paragraph.' },
             expl:{ es:'El mito se sitúa en un tiempo fundador, cuando el mundo todavía se estaba haciendo, y sirve para explicar por qué las cosas son como son: aquí, de dónde salió el maíz que hoy se come. Que el valle exista o que lo cuenten los mayores ocurre igual en las leyendas.',
                    en:'The myth is set in a founding time, when the world was still being made, and it serves to explain why things are as they are: here, where the maize we eat today came from. That the valley exists or that elders tell it happens in legends too.' } },
        p4:{ title:{ es:'Lo que ancla a la leyenda', en:'What anchors the legend' },
             stmt:{ es:'Vuelve al texto «La señora del vado». ¿Qué lo distingue del relato del maíz que leíste antes?',
                    en:'Go back to the text «La señora del vado». What sets it apart from the tale of the maize you read before?' },
             options:{ es:['Se ubica en una fecha y un lugar precisos, con personas que se nombran y testigos que la sostienen','Cuenta algo que ninguna persona del pueblo puede confirmar ni desmentir con seguridad','Emplea palabras antiguas que ya casi nadie usa en la conversación de todos los días','Se transmite de boca en boca sin que se sepa quién lo contó por primera vez'],
                       en:['It is set on a precise date and place, with people who are named and witnesses who back it up','It tells something no person in the village can confirm or deny with certainty','It uses old words that almost nobody uses in everyday conversation anymore','It travels by word of mouth without anyone knowing who first told it'] },
             correct:0,
             hint:{ es:'Compara la fecha, el lugar y los nombres propios de este texto con los del relato anterior.',
                    en:'Compare the date, the place and the proper names of this text with those of the previous tale.' },
             expl:{ es:'La leyenda se cuenta como si hubiera pasado aquí, en un año que se puede decir, con personas de nombre y apellido y con alguien que jura haberlo visto. Lo que dicen las dos opciones descartadas, la transmisión oral y la imposibilidad de comprobar, le ocurre también al mito.',
                    en:'The legend is told as if it had happened here, in a year that can be stated, with people who have first and last names and with someone who swears to have seen it. What the two discarded options say, oral transmission and the impossibility of checking, happens to the myth as well.' } },
        p5:{ title:{ es:'La estrofa que cierra', en:'The stanza that closes' },
             stmt:{ es:'En el «Corrido de Rosalía Munguía», la última estrofa empieza con «Ya con esta me despido». ¿Qué función cumple esa estrofa dentro del corrido?',
                    en:'In the «Corrido de Rosalía Munguía», the last stanza begins with «Ya con esta me despido». What role does that stanza play inside the corrido?' },
             options:{ es:['Cierra el canto y le avisa al público que la historia contada llega a su fin','Anuncia que enseguida se cantará una segunda historia sobre el mismo río','Presenta al personaje principal para que el público sepa de quién se habla','Indica el año y el lugar en que ocurrieron los hechos que se están cantando'],
                       en:['It closes the singing and tells the audience that the story being told reaches its end','It announces that a second story about the same river will be sung next','It introduces the main character so the audience knows who is being spoken of','It states the year and the place where the events being sung took place'] },
             correct:0,
             hint:{ es:'El corrido se canta de una sola vez frente a gente reunida: pregúntate qué necesita oír esa gente cuando el cantante va a callarse.',
                    en:'A corrido is sung in one go before a gathered crowd: ask what those people need to hear when the singer is about to stop.' },
             expl:{ es:'La despedida es una fórmula fija con la que el cantante anuncia el final y agradece la escucha. La fecha y el lugar ya se dieron en la primera estrofa y el personaje se presentó en la segunda, así que a la última solo le queda cerrar.',
                    en:'The farewell is a fixed formula with which the singer announces the ending and thanks the listeners. The date and place were already given in the first stanza and the character was introduced in the second, so the last one is only left to close.' } },
        p8:{ title:{ es:'El refrán que cabe', en:'The refrán that fits' },
             stmt:{ es:'Cuando el río de Vado Hondo se salió de su cauce, unos cuantos aprovecharon la confusión para llevarse la madera que la corriente había arrimado a la orilla. ¿Cuál de estos refranes describe lo que hicieron?',
                    en:'When the Vado Hondo river overflowed, a few took advantage of the confusion to carry off the timber the current had pushed to the bank. Which of these refranes describes what they did?' },
             options:{ es:['«A río revuelto, ganancia de pescadores.»','«Camarón que se duerme, se lo lleva la corriente.»','«No dejes para mañana lo que puedas hacer hoy.»','«Más vale paso que dure y no trote que canse.»'],
                       en:['«A río revuelto, ganancia de pescadores.»','«Camarón que se duerme, se lo lleva la corriente.»','«No dejes para mañana lo que puedas hacer hoy.»','«Más vale paso que dure y no trote que canse.»'] },
             correct:0,
             hint:{ es:'Tres de los refranes le hablan a quien se descuida o se apura; solo uno habla de quien gana con el desorden ajeno.',
                    en:'Three of the refranes speak to whoever is careless or hasty; only one speaks of whoever gains from the disorder of others.' },
             expl:{ es:'Ese refrán señala a quien obtiene provecho justo cuando todo está revuelto y nadie vigila, que es lo que ocurrió en la creciente. Los otros tres aconsejan sobre el descuido propio, sobre aplazar lo urgente y sobre sostener un ritmo parejo.',
                    en:'That refrán points at whoever profits exactly when everything is stirred up and nobody is watching, which is what happened in the flood. The other three advise about carelessness, about postponing the urgent and about keeping a steady pace.' } },
        p9:{ title:{ es:'Una pieza más para el cuaderno', en:'One more piece for the notebook' },
             stmt:{ es:'Alguien recogió este fragmento en el mismo pueblo: «En aquel tiempo el Río no tenía cauce y andaba suelto por el valle; la Garza le enseñó por dónde caminar a cambio de que le dejara los peces, y desde entonces el agua va derecha y las garzas comen primero.» ¿En qué grupo lo clasificarías?',
                    en:'Somebody collected this fragment in the same village: «En aquel tiempo el Río no tenía cauce y andaba suelto por el valle; la Garza le enseñó por dónde caminar a cambio de que le dejara los peces, y desde entonces el agua va derecha y las garzas comen primero.» In which group would you classify it?' },
             options:{ es:['Mito, porque ocurre antes de que el mundo quedara hecho y explica por qué el río va derecho','Leyenda, porque nombra un valle que existe y que la gente del pueblo recorre a diario','Copla, porque está compuesto de imágenes breves tomadas de la naturaleza','Refrán, porque enseña que todo trato se termina pagando con algo'],
                       en:['Myth, because it happens before the world was finished and explains why the river runs straight','Legend, because it names a valley that exists and that the villagers walk through daily','Copla, because it is made of short images taken from nature','Refrán, because it teaches that every deal ends up being paid for with something'] },
             correct:0,
             hint:{ es:'Revisa dos cosas: cuándo ocurre lo que se cuenta y qué queda explicado en la parte final.',
                    en:'Check two things: when what is told happens and what ends up explained in the final part.' },
             expl:{ es:'El fragmento se sitúa en un tiempo en que el río todavía no tenía cauce, convierte al río y a la garza en personajes y termina explicando por qué el agua corre derecha. Esos tres rasgos juntos definen al mito: no está en verso ni se apoya en fechas o testigos.',
                    en:'The fragment is set in a time when the river still had no bed, turns the river and the heron into characters and ends by explaining why the water runs straight. Those three features together define the myth: it is not in verse and it leans on no dates or witnesses.' } },
        p10:{ title:{ es:'Cuatro montones en el cuaderno', en:'Four piles in the notebook' },
              stmt:{ es:'Vas a ordenar lo que recogiste en el pueblo: el relato del maíz, la historia del vado, el corrido de Rosalía y los refranes de tu abuela. ¿Qué criterio te permite separarlos en cuatro grupos distintos?',
                     en:'You are going to sort what you collected in the village: the tale of the maize, the story of the ford, the corrido of Rosalía and the refranes of your grandmother. Which criterion lets you separate them into four different groups?' },
              options:{ es:['Para qué sirve cada texto y con qué forma lo consigue: explicar un origen, contar un suceso del pueblo, cantar una historia en verso o aconsejar en una sola frase','La edad que tenía la persona que te contó cada uno de los cuatro textos','El número de personajes que llega a aparecer dentro de cada uno de ellos','Si el texto habla del río del pueblo o si habla de algún otro asunto'],
                        en:['What each text is for and with which form it achieves it: explaining an origin, telling a village event, singing a story in verse or advising in a single sentence','The age of the person who told you each one of the four texts','The number of characters that ends up appearing inside each one of them','Whether the text speaks of the village river or of some other subject'] },
              correct:0,
              hint:{ es:'Los cuatro salieron del mismo pueblo y llegaron a ti de la misma manera, así que el origen no puede ser lo que los separa.',
                     en:'All four came from the same village and reached you the same way, so their origin cannot be what separates them.' },
              expl:{ es:'Como los cuatro se transmiten de boca en boca dentro de la misma comunidad, lo que los distingue no es de dónde vienen sino qué hacen y cómo están hechos. Por eso el mito, la leyenda, el corrido y el refrán forman montones distintos aunque los cuatro hablen del mismo río.',
                     en:'Since all four travel by word of mouth inside the same community, what tells them apart is not where they come from but what they do and how they are made. That is why myth, legend, corrido and refrán form different piles even though all four speak of the same river.' } }
      }
    }
  ];

  /* SECTION + CARD BUILDERS */
  function addSection(tag, title, paras, extra) {
    var d = document.createElement('div');
    d.className = 'section';
    d.innerHTML = '<div class="stag">' + tag + '</div><h2>' + title + '</h2>' +
      paras.map(function(p){ return '<p>' + p + '</p>'; }).join('') + (extra || '');
    body.appendChild(d);
    return d;
  }
  function addProblem(v) {
    var opts = Lg(v.options);
    var order = perm(opts.length);
    var p = {
      title: Lg(v.title), questionText: Lg(v.stmt), hint: Lg(v.hint), explanation: Lg(v.expl),
      options: order.map(function(k){ return opts[k]; }), correctIdx: order.indexOf(v.correct),
      showWork: false, studentChoice: null, pendingChoice: null, fn: ''
    };
    problems.push(p);
    buildOneCard(p, problems.length - 1);
  }

  /* INTRO */
  addSection(
    L('Tu misión', 'Your mission'),
    L('Salir a recoger lo que tu pueblo ya sabe de memoria', 'Going out to collect what your town already knows by heart'),
    ES
      ? ['Antes de que existieran los libros, las historias viajaban dentro de la gente. Alguien contaba, otro escuchaba, ese otro volvía a contar y así, de boca en boca, un relato podía cruzar cien años sin que nadie lo escribiera nunca. Todavía funciona igual: el consejo que repite tu abuela, la historia del cerro que asusta a los niños y la canción que los músicos tocan de memoria llegaron hasta ti por ese camino.',
         'En esta guía vas a trabajar como quien recoge y ordena. Vas a leer piezas recogidas en un mismo pueblo, vas a reconocer qué hace cada una y vas a repartirlas en cuatro grupos: mitos, leyendas, corridos y refranes. Al final vas a poder decir por qué cada texto quedó donde quedó.']
      : ['Before books existed, stories travelled inside people. Someone told, someone else listened, that other person told it again and so, mouth to mouth, a tale could cross a hundred years without anyone ever writing it down. It still works that way: the advice your grandmother repeats, the hill story that scares the children and the song the musicians play from memory all reached you along that road.',
         'In this guide you will work like someone who collects and sorts. You will read pieces gathered in one same town, you will recognize what each one does and you will share them out into four groups: myths, legends, corridos and refranes. By the end you will be able to say why each text ended up where it did.']
  );

        '<div class="rcard"><div class="rname">Quién la hizo</div><div class="rform">nadie y todos</div><div class="rnote">No tiene un autor con nombre. Pertenece a la comunidad que la conserva y la sigue contando.</div></div>' +
        '<div class="rcard"><div class="rname">Cómo viaja</div><div class="rform">de boca en boca</div><div class="rnote">Se aprende oyéndola, no leyéndola. Vive en la memoria de quien la cuenta.</div></div>' +
        '<div class="rcard"><div class="rname">Qué le pasa</div><div class="rform">cambia un poco</div><div class="rnote">Cada persona la vuelve a contar a su manera. Por eso hay varias versiones y todas son legítimas.</div></div>' +

        '<div class="rcard"><div class="rname">Who made it</div><div class="rform">nobody and everybody</div><div class="rnote">It has no named author. It belongs to the community that keeps it and goes on telling it.</div></div>' +
        '<div class="rcard"><div class="rname">How it travels</div><div class="rform">mouth to mouth</div><div class="rnote">It is learned by hearing, not by reading. It lives in the memory of whoever tells it.</div></div>' +
        '<div class="rcard"><div class="rname">What happens to it</div><div class="rform">it shifts a little</div><div class="rnote">Each person tells it their own way. That is why several versions exist and all of them are legitimate.</div></div>' +
      '</div>';
  addSection(
    L('Concepto 1', 'Concept 1'),
    L('Qué es una creación literaria tradicional', 'What a traditional literary creation is'),
    ES
      ? ['Hay textos que llegaron a ti impresos, con el nombre de quien los escribió y el año en la primera página. Y hay otros que llegaron por el oído: nadie te dijo quién los inventó porque nadie lo sabe. Esos segundos son las creaciones literarias tradicionales, y su dueño es la comunidad entera.',
         'Como no están fijados en papel, se transforman al repetirse. Dos personas del mismo pueblo cuentan la misma historia y una agrega un detalle que la otra olvidó: a esas diferencias se les llama versiones o variantes, y no son errores. Son la prueba de que el texto sigue vivo y de que todavía hay alguien dispuesto a contarlo.']
      : ['There are texts that reached you printed, with the name of whoever wrote them and the year on the first page. And there are others that reached you through the ear: nobody told you who invented them because nobody knows. Those second ones are traditional literary creations, and their owner is the whole community.',
         'Since they are not fixed on paper, they change as they are repeated. Two people from the same town tell the same story and one adds a detail the other forgot: those differences are called versions or variants, and they are not mistakes. They are proof that the text is still alive and that someone is still willing to tell it.'],
    GRID1
  );

  /* WIDGET 1: how did this text reach you (Mode C, the tap is the answer) */
  (function buildOral(){
    var BINS = ES ? ['Llegó por el oído','Llegó firmado'] : ['It came by ear','It came signed'];
    var ITEMS = [
      { txt:{ es:'Tu abuela te repite el mismo consejo en cinco palabras que ella le oyó a su madre.',
              en:'Your grandmother repeats the same five word advice she heard from her own mother.' }, bin:0,
        why:{ es:'Nadie lo escribió: viaja en la memoria de una generación a la siguiente.',
              en:'Nobody wrote it down: it travels in memory from one generation to the next.' } },
      { txt:{ es:'Una novela que compras en la librería, con el nombre del autor en la portada.',
              en:'A novel you buy at the bookshop, with the author name on the cover.' }, bin:1,
        why:{ es:'Tiene autor, fecha y un texto fijo: si lo reimprimen, dice exactamente lo mismo.',
              en:'It has an author, a date and a fixed text: if it is reprinted, it says exactly the same.' } },
      { txt:{ es:'La historia del cerro que en cada casa del pueblo se cuenta un poco distinta.',
              en:'The hill story that is told a little differently in every house in town.' }, bin:0,
        why:{ es:'Justo esas diferencias delatan la tradición oral: cada boca la acomoda a su manera.',
              en:'Those very differences give away oral tradition: every mouth arranges it its own way.' } },
      { txt:{ es:'Un poema publicado en un libro donde aparece el año en que fue escrito.',
              en:'A poem published in a book where the year it was written appears.' }, bin:1,
        why:{ es:'Está fechado y firmado, así que no depende de que alguien lo recuerde.',
              en:'It is dated and signed, so it does not depend on anyone remembering it.' } },
      { txt:{ es:'La canción que los músicos del pueblo tocan de memoria y nadie sabe quién compuso.',
              en:'The song the town musicians play from memory and nobody knows who composed.' }, bin:0,
        why:{ es:'Sin autor conocido y sostenida por la memoria de quien la toca: es tradición.',
              en:'With no known author and held up by the memory of whoever plays it: it is tradition.' } },
      { txt:{ es:'Un cuento que un escritor de tu ciudad publicó y firmó hace tres años.',
              en:'A story a writer from your city published and signed three years ago.' }, bin:1,
        why:{ es:'Que hable de tu ciudad no lo vuelve tradicional: tiene autor y texto fijo.',
              en:'Speaking about your city does not make it traditional: it has an author and a fixed text.' } }
    ];
    var st = { i:0, seq:perm(ITEMS.length), tries:0, msg:'', done:false };
    var wrap = document.createElement('div');
    wrap.className = 'gw section';
    wrap.setAttribute('data-widget','classify');
    wrap.id = 'wOral';
    function paint(){
      if (st.done) {
        wrap.innerHTML = '<div class="iw-tag">' + L('Sigue el camino del texto','Trace the path of the text') + '</div>' +
          '<div class="cls-done">' + L('Casos revisados: ','Cases reviewed: ') + ITEMS.length + '</div>' +
          '<div class="rfb">' + st.msg + '</div>';
        return;
      }
      var it = ITEMS[st.seq[st.i]];
      wrap.innerHTML =
        '<div class="iw-tag">' + L('Sigue el camino del texto','Trace the path of the text') + '</div>' +
        '<div class="gw-mini">' + L('Lee cada caso y decide por qué camino llegó ese texto hasta quien lo conoce.',
                                    'Read each case and decide along which road that text reached the person who knows it.') + '</div>' +
        '<div class="cls-prog">' + (st.i + 1) + ' / ' + ITEMS.length + '</div>' +
        '<div class="cls-card">' + it.txt[LANG] + '</div>' +
        '<div class="cls-bins">' + BINS.map(function(b, bi){
            return '<button class="cls-bin" onclick="oralPick(' + bi + ')">' + b + '</button>';
          }).join('') + '</div>' +
        '<div class="rfb" id="oralFb">' + st.msg + '</div>';
    }
    window.oralPick = function(bi){
      if (st.done || st.locked) return;
      st.locked = true;
      var _seq = st.seq || null;
      var _it = (typeof ITEMS !== 'undefined' ? ITEMS : IT)[_seq ? _seq[st.i] : st.i];
      var _correct = _it.bin !== undefined ? _it.bin : _it.correct;
      var _isOk = (bi === _correct);
      var _label = typeof BINS !== 'undefined' ? (BINS[_correct] || '') : '';
      var _why = _it.why ? (typeof _it.why === 'object' ? (_it.why[LANG] || '') : _it.why) : '';
      var _msg = _isOk
        ? '<b style="color:var(--ok)">\u2713 ' + _label + '.</b> ' + _why
        : '<b style="color:var(--bad)">\u2717 ' + (LANG==='es'?'Era ':'It was ') + _label + '.</b> ' + _why;
      var _fe = document.getElementById('oralFb');
      if (_fe) _fe.innerHTML = _msg + '<br><button onclick="oralSig()" style="margin-top:.6rem;background:var(--green);color:#fff;border:none;border-radius:8px;padding:.45rem 1.2rem;font-size:.84rem;font-weight:600;cursor:pointer;min-height:44px;font-family:inherit">' + (LANG==='es' ? 'Siguiente →' : 'Next →') + '</button>';
      var _bs = wrap.querySelectorAll('.cls-bin');
      if (_bs) _bs.forEach(function(b, _i){
        b.style.pointerEvents = 'none';
        b.style.opacity = (_i === bi) ? '1' : '0.35';
        if (_i === bi) b.style.borderColor = _isOk ? 'var(--ok)' : 'var(--bad)';
      });
    };
    window.oralSig = function(){
      st.i++;
      st.locked = false;
      if (st.i >= (typeof ITEMS !== 'undefined' ? ITEMS : IT).length) st.done = true;
      paint();
    };
    paint();
    body.appendChild(wrap);
  })();

    { title:{ es:'Para qué las guarda el pueblo', en:'Why the town keeps them' },

             en:'Creations of oral tradition go on being told for whole generations. What do the reasons a town keeps them have in common?' },
      options:{ es:['Le sirven al grupo: explican, advierten, aconsejan o guardan la memoria de algo','Todas fueron premiadas alguna vez y por eso vale la pena repetirlas','Todas están compuestas en verso, y el verso se memoriza más fácil','Todas ocurrieron tal como se cuentan, sin un solo cambio ni adorno'],

      correct:0,
