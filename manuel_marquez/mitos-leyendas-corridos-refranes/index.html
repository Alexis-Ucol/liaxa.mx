      correct:0,
      hint:{ es:'El refrán nombra un camarón, pero tu tío no estaba hablando de camarones.',
             en:'The refrán names a shrimp, but your uncle was not talking about shrimps.' },
      expl:{ es:'Un refrán dice una cosa para señalar otra: el camarón dormido representa a la persona distraída y la corriente, lo que se le va de las manos. Por eso se emplea para aconsejar atención, y no para hablar de animales ni de ríos.',
             en:'A refrán says one thing to point at another: the sleeping shrimp stands for the distracted person and the current for what slips from their hands. That is why it is used to advise attention, and not to speak about animals or rivers.' } },
    { title:{ es:'Lo que aconseja el refrán', en:'What the refrán advises' },
      stmt:{ es:'Alguien promete mucho y cumple poco, y su vecina le responde «Del dicho al hecho hay mucho trecho». ¿Qué le está diciendo?',
             en:'Someone promises a lot and delivers little, and their neighbour answers «Del dicho al hecho hay mucho trecho». What is she telling them?' },
      options:{ es:['Que prometer cuesta poco y que lo difícil viene al momento de cumplir','Que conviene medir bien las distancias antes de salir a un viaje largo','Que hablar de más termina por meter a cualquiera en un problema','Que quien promete algo lo hace siempre de buena voluntad'],
                en:['That promising costs little and the hard part comes when it is time to deliver','That it is wise to measure distances well before setting out on a long trip','That talking too much ends up getting anyone into trouble','That whoever promises something always does it in good faith'] },
      correct:0,
      hint:{ es:'El trecho del refrán no se recorre a pie: piensa entre qué dos cosas está esa distancia.',
             en:'The stretch in the refrán is not walked on foot: think between which two things that distance lies.' },
      expl:{ es:'El trecho no es un camino real: representa la distancia entre decir y hacer. Con esa imagen breve, el refrán advierte que las palabras no equivalen a los hechos, y por eso se dice justo cuando alguien promete de más.',
             en:'The stretch is not a real road: it stands for the distance between saying and doing. With that short image, the refrán warns that words do not equal deeds, and that is why it is said exactly when someone over promises.' } }
  ]));

  addProblem(caso.qs.p8);   /* PROBLEM 8 */

  /* CONCEPT 5 */
  var GRID2 = ES
    ? '<div class="rules-grid">' +
        '<div class="rcard"><div class="rname">Criterio 1</div><div class="rform">cuándo ocurre</div><div class="rnote">Antes del mundo conocido, en una fecha del calendario, o fuera del tiempo porque no cuenta ningún hecho.</div></div>' +
        '<div class="rcard"><div class="rname">Criterio 2</div><div class="rform">quién aparece</div><div class="rnote">Fuerzas de la naturaleza, gente del pueblo con nombre, animales que hablan, o nadie en particular.</div></div>' +
        '<div class="rcard"><div class="rname">Criterio 3</div><div class="rform">cómo está hecho</div><div class="rnote">En prosa, en estrofas con rima, o en una sola frase fija que no admite cambios.</div></div>' +
        '<div class="rcard"><div class="rname">Criterio 4</div><div class="rform">para qué sirve</div><div class="rnote">Explicar un origen, guardar la memoria de un lugar, cantar un suceso o dejar un consejo.</div></div>' +
      '</div>'
    : '<div class="rules-grid">' +
        '<div class="rcard"><div class="rname">Criterion 1</div><div class="rform">when it happens</div><div class="rnote">Before the known world, on a calendar date, or outside time because it tells no event at all.</div></div>' +
        '<div class="rcard"><div class="rname">Criterion 2</div><div class="rform">who appears</div><div class="rnote">Natural forces, named townspeople, talking animals, or nobody in particular.</div></div>' +
        '<div class="rcard"><div class="rname">Criterion 3</div><div class="rform">how it is made</div><div class="rnote">In prose, in rhyming stanzas, or in a single fixed sentence that admits no changes.</div></div>' +
        '<div class="rcard"><div class="rname">Criterion 4</div><div class="rform">what it is for</div><div class="rnote">Explaining an origin, keeping the memory of a place, singing an event or leaving advice.</div></div>' +
      '</div>';
  addSection(
    L('Concepto 5', 'Concept 5'),
    L('Recuperar y clasificar: de la voz al cuaderno', 'Recovering and classifying: from the voice to the notebook'),
    ES
      ? ['Recuperar una creación de la comunidad es escribirla tal como te la dijeron, sin corregirle el habla a quien te la contó. Junto al texto se anota siempre lo mismo: quién lo contó, dónde y cuándo. Esos tres datos convierten un texto suelto en una pieza recogida, y permiten que otra persona vuelva a la misma fuente años después.',
         'Clasificar viene después y es una decisión que se toma con pruebas. Ante cada pieza se revisan cuatro cosas: cuándo ocurre lo que se cuenta, quién aparece, cómo está hecho el texto y para qué sirve. Con esas cuatro respuestas la pieza cae sola en su montón, y si dudas entre dos, la respuesta que más pesa suele ser la última.']
      : ['Recovering a creation of the community means writing it down exactly as it was said to you, without correcting the speech of whoever told it. Alongside the text you always note the same three things: who told it, where and when. Those three facts turn a loose text into a collected piece, and let another person go back to the same source years later.',
         'Classifying comes afterwards and is a decision taken with evidence. For each piece you check four things: when what is told happens, who appears, how the text is made and what it is for. With those four answers the piece falls into its own pile, and if you hesitate between two, the answer that weighs most is usually the last one.'],
    GRID2
  );

  /* WIDGET 5: the four piles, the culminating sort (Mode C) */
  (function buildCuatro(){
    var BINS = ES ? ['Mito','Leyenda','Corrido','Refrán'] : ['Myth','Legend','Corrido','Refrán'];
    var G = caso.cuatro;
    var st = { i:0, seq:perm(G.length), tries:0, msg:'', done:false };
    var wrap = document.createElement('div');
    wrap.className = 'gw section';
    wrap.setAttribute('data-widget','classify');
    wrap.id = 'wCuatro';
    function paint(){
      if (st.done) {
        wrap.innerHTML = '<div class="iw-tag">' + L('Los cuatro montones','The four piles') + '</div>' +
          '<div class="cls-done">' + L('Piezas archivadas: ','Pieces filed: ') + G.length + '</div>' +
          '<div class="rfb">' + st.msg + '</div>';
        return;
      }
      var it = G[st.seq[st.i]];
      wrap.innerHTML =
        '<div class="iw-tag">' + L('Los cuatro montones','The four piles') + '</div>' +
        '<div class="gw-mini">' + L('Todo lo que recogiste en ' + caso.pueblo + ' quedó revuelto sobre la mesa. Manda cada pieza a su montón revisando cuándo ocurre, quién aparece y cómo está hecha.',
                                    'Everything you collected in ' + caso.pueblo + ' ended up mixed on the table. Send each piece to its pile by checking when it happens, who appears and how it is made.') + '</div>' +
        '<div class="cls-prog">' + (st.i + 1) + ' / ' + G.length + '</div>' +
        '<div class="cls-card">' + it.txt + '</div>' +
        '<div class="cls-bins">' + BINS.map(function(b, bi){
            return '<button class="cls-bin" onclick="cuatroPick(' + bi + ')">' + b + '</button>';
          }).join('') + '</div>' +
        '<div class="rfb" id="cuatroFb">' + st.msg + '</div>';
    }
    window.cuatroPick = function(bi){
      if (st.done || st.locked) return;
      st.locked = true;
      var _seq = st.seq || null;
      var _it = (typeof ITEMS !== 'undefined' ? ITEMS : IT)[_seq ? _seq[st.i] : st.i];
      var _correct = _it.bin !== undefined ? _it.bin : _it.correct;
      var _isOk = (bi === _correct);
      var _label = typeof BINS !== 'undefined' ? (BINS[_correct] || '') : '';
      var _why = _it.why ? (typeof _it.why === 'object' ? (_it.why[LANG] || '') : _it.why) : '';
      var _msg = _isOk
        ? '<b style="color:var(--ok)">\u2713 ' + _label + '.</b> ' + _why
        : '<b style="color:var(--bad)">\u2717 ' + (LANG==='es'?'Era ':'It was ') + _label + '.</b> ' + _why;
      var _fe = document.getElementById('cuatroFb');
      if (_fe) _fe.innerHTML = _msg + '<br><button onclick="cuatroSig()" style="margin-top:.6rem;background:var(--green);color:#fff;border:none;border-radius:8px;padding:.45rem 1.2rem;font-size:.84rem;font-weight:600;cursor:pointer;min-height:44px;font-family:inherit">' + (LANG==='es' ? 'Siguiente →' : 'Next →') + '</button>';
      var _bs = wrap.querySelectorAll('.cls-bin');
      if (_bs) _bs.forEach(function(b, _i){
        b.style.pointerEvents = 'none';
        b.style.opacity = (_i === bi) ? '1' : '0.35';
        if (_i === bi) b.style.borderColor = _isOk ? 'var(--ok)' : 'var(--bad)';
      });
    };
    window.cuatroSig = function(){
      st.i++;
      st.locked = false;
      if (st.i >= (typeof ITEMS !== 'undefined' ? ITEMS : IT).length) st.done = true;
      paint();
    };
    paint();
    body.appendChild(wrap);
  })();

  addProblem(caso.qs.p9);   /* PROBLEM 9 */

  /* WIDGET 6: the collector workshop */
  (function buildTaller(){
    var PROMPTS = [
      { es:'Escribe un refrán que hayas oído en tu casa y explica abajo, en un renglón, en qué situación lo dicen y qué aconseja.',
        en:'Write down a refrán you have heard at home and explain below, in one line, in which situation it is said and what it advises.' },
      { es:'Pregunta en tu casa por una historia del lugar donde vives. Anótala en cuatro renglones y escribe al final quién te la contó y dónde.',
        en:'Ask at home for a story about the place where you live. Write it in four lines and note at the end who told it to you and where.' },
      { es:'Elige una de las piezas de esta guía y escribe en qué montón la pondrías, nombrando los dos rasgos del texto que te llevaron a esa decisión.',
        en:'Choose one of the pieces in this guide and write which pile you would put it in, naming the two features of the text that led you to that decision.' },
      { es:'Dibuja el lugar de tu comunidad del que más se cuentan historias y escribe abajo, en un renglón, qué es lo que se cuenta de él.',
        en:'Draw the place in your community that most stories are told about and write below, in one line, what is told about it.' },
      { es:'Inventa la primera estrofa de un corrido sobre algo que haya pasado en tu escuela. Empieza diciendo el año y el lugar, como abren los corridos.',
        en:'Invent the first stanza of a corrido about something that happened at your school. Start by stating the year and the place, the way corridos open.' }
    ];
    var pickP = PROMPTS[Math.floor(rng() * PROMPTS.length)];
    var wrap = document.createElement('div');
    wrap.className = 'gw section';
    wrap.setAttribute('data-widget','reflect');
    wrap.id = 'wTaller';
    wrap.innerHTML =
      '<div class="iw-tag">' + L('Cuaderno de quien recoge','Notebook of the collector') + '</div>' +
      '<div class="gw-mini">' + L('Aquí no hay una sola respuesta correcta: lo que escribas viene de tu comunidad y por eso es tuyo.',
                                  'There is no single right answer here: what you write comes from your community and that is why it is yours.') + '</div>' +
      '<div class="reflect-prompt">' + pickP[LANG] + '</div>' +
      '<div class="wtabs">' +
        '<button class="wtab active" onclick="tallerTab(\'type\',this)">' + t('tab-type') + '</button>' +
        '<button class="wtab" onclick="tallerTab(\'draw\',this)">' + t('tab-draw') + '</button>' +
      '</div>' +
      '<div class="wpanel active" id="taller_type"><textarea class="wtextarea" id="tallerTa" placeholder="' + L('Tu anotación…','Your entry…') + '"></textarea></div>' +
      '<div class="wpanel" id="taller_draw"><div class="cvwrap"><canvas class="dcanvas" id="tallerCv"></canvas>' +
        '<div class="ctoolbar">' +
          '<button class="tbtn2 bpen on">' + t('btn-pen') + '</button>' +
          '<button class="tbtn2 bmarker">' + t('btn-marker') + '</button>' +
          '<button class="tbtn2 beraser">' + t('btn-eraser') + '</button>' +
          drawDotsHTML() +
          '<button class="clrbtn">' + t('btn-clear') + '</button>' +
        '</div></div></div>' +
      '<button class="rverify-btn" style="margin-top:.6rem" onclick="tallerSave()">' + L('Guardar','Save') + '</button>' +
      '<div class="rfb" id="tallerFb"></div>';
    body.appendChild(wrap);
    window.tallerTab = function(which, btn){
      ['type','draw'].forEach(function(x){
        document.getElementById('taller_' + x).classList.toggle('active', x === which);
      });
      wrap.querySelectorAll('.wtab').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      if (which === 'draw') setTimeout(function(){ var c = document.getElementById('tallerCv'); if (c) initCanvas(c); }, 60);
    };
    window.tallerSave = function(){
      document.getElementById('tallerFb').innerHTML = '<b>' + L('Guardado.','Saved.') + '</b> ' + L(
        'Ahora complétalo como lo haría quien recoge: agrega quién te lo dijo, dónde y cuándo. Con esos tres datos tu anotación deja de ser un apunte suelto.',
        'Now complete it the way a collector would: add who told you, where and when. With those three facts your entry stops being a loose note.');
    };
  })();

  addProblem(caso.qs.p10);  /* PROBLEM 10 */
}
</script>

<!-- LIAXA ANALYTICS -->
<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbykkuJ_apGq3vALIFd4mr3acu81c7K4OKxW-DZ-i52Ceyl3lOanXMdvbS9SIXPrLQBm/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'Mitos, Leyendas, Corridos y Refranes: Clasificación y Rasgos';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
