<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Causas de Desigualdad en la Calidad de Vida</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }

/* ── INTERACTIVE WIDGETS ── */
.wgt { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.1rem; margin:1rem 0; }
.wgt-h { font-size:.68rem; letter-spacing:.11em; text-transform:uppercase; color:var(--text3); margin-bottom:.55rem; font-weight:600; }
.wgt-q { font-size:.9rem; font-weight:600; margin-bottom:.6rem; }
.wcase { background:var(--surface2); border-left:4px solid var(--gold); border-radius:0 8px 8px 0; padding:.75rem .9rem; font-size:.88rem; color:var(--text2); margin-bottom:.8rem; }
.wmsg { margin-top:.7rem; font-size:.83rem; padding:.6rem .8rem; border-radius:8px; background:var(--surface2); color:var(--text2); }
.wmsg.ok { background:var(--ok-bg); color:var(--ok); }
.wmsg.warn { background:var(--gold-bg); color:var(--text2); border-left:3px solid var(--gold); }
.wprog { font-size:.72rem; color:var(--text3); margin-top:.5rem; letter-spacing:.04em; }
.wbtn { background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:.45rem .9rem; font-size:.78rem; cursor:pointer; color:var(--text2); margin-top:.65rem; min-height:44px; }
.wbtn:hover { border-color:var(--green); color:var(--green); }
.wrow { display:flex; gap:.5rem; flex-wrap:wrap; }

/* perfil de calidad de vida: fichas que se encienden + medidor */
.dimgrid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:.55rem; }
.dim { background:var(--surface2); border:1.5px solid var(--border); border-radius:10px; padding:.6rem .7rem; font-size:.8rem; cursor:pointer; color:var(--text2); transition:all .15s; min-height:44px; display:flex; flex-direction:column; justify-content:center; }
.dim:hover { border-color:var(--green); }
.dim.on { border-color:var(--green); background:var(--green-bg); color:var(--green-dark); font-weight:600; }
.dim.hit { border-color:var(--ok); background:var(--ok-bg); color:var(--ok); }
.dim.over { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.dimname { font-size:.79rem; }
.dimsub { font-size:.68rem; color:var(--text3); margin-top:.15rem; }
.meter { height:14px; border-radius:8px; background:var(--surface2); border:1px solid var(--border); overflow:hidden; margin-top:.75rem; }
.meterfill { height:100%; background:var(--green); width:0%; transition:width .35s; }
.meterfill.full { background:var(--ok); }

/* clasificador de causas */
.chips { display:flex; flex-wrap:wrap; gap:.45rem; }
.chip { background:var(--surface2); border:1.5px solid var(--border); border-radius:22px; padding:.45rem .9rem; font-size:.8rem; cursor:pointer; color:var(--text2); transition:all .14s; min-height:44px; display:flex; align-items:center; }
.chip:hover { border-color:var(--green); color:var(--green); }
.chip.good { border-color:var(--ok); background:var(--ok-bg); color:var(--ok); }
.chip.miss { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.chip.used { opacity:.4; pointer-events:none; }
.opts2 { display:flex; flex-direction:column; gap:.45rem; margin-top:.6rem; }
.opt2 { background:var(--surface2); border:1.5px solid var(--border); border-radius:8px; padding:.55rem .8rem; font-size:.81rem; cursor:pointer; color:var(--text2); transition:all .14s; min-height:44px; display:flex; align-items:center; }
.opt2:hover { border-color:var(--green); color:var(--green); }
.opt2.miss { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.opt2.good { border-color:var(--ok); background:var(--ok-bg); color:var(--ok); }

/* cadena de causa y efecto */
.chainrow { display:flex; flex-wrap:wrap; align-items:center; gap:.4rem; margin:.7rem 0; min-height:44px; }
.link { background:var(--green-bg); border:1.5px solid var(--green); color:var(--green-dark); border-radius:8px; padding:.42rem .7rem; font-size:.79rem; }
.link.start { background:var(--gold-bg); border-color:var(--gold); color:var(--text); }
.link.ghost { background:var(--surface2); border:1.5px dashed var(--border); color:var(--text3); }
.arw { color:var(--text3); font-weight:700; }

/* comparador de brecha: canvas + control */
.brwrap { border:1px solid var(--border); border-radius:10px; background:var(--surface2); overflow:hidden; margin-bottom:.8rem; }
.brcv { display:block; width:100%; height:240px; }
.ctlrow { display:flex; align-items:center; gap:.7rem; margin-bottom:.6rem; flex-wrap:wrap; }
.ctlrow input[type=range] { flex:1; min-width:180px; accent-color:var(--green); height:32px; }
.ctlval { font-family:'IBM Plex Mono',monospace; font-size:1.05rem; font-weight:600; color:var(--green); min-width:56px; }
.tgt { font-size:.85rem; background:var(--green-bg); border-radius:8px; padding:.55rem .8rem; margin-bottom:.75rem; color:var(--text); }
.tgt strong { color:var(--green-dark); }

/* constructor de la respuesta justa */
.slotgrid { display:grid; gap:.5rem; margin-bottom:.85rem; }
.slot { border:1.5px dashed var(--border); border-radius:8px; padding:.55rem .8rem; font-size:.82rem; color:var(--text3); min-height:44px; display:flex; align-items:center; gap:.6rem; flex-wrap:wrap; }
.slot.filled { border-style:solid; border-color:var(--green); background:var(--green-bg); color:var(--text); }
.slotlbl { font-size:.64rem; text-transform:uppercase; letter-spacing:.09em; color:var(--gold); font-weight:700; flex-shrink:0; }
.frag { background:var(--surface2); border:1.5px solid var(--border); border-radius:8px; padding:.5rem .8rem; font-size:.81rem; cursor:pointer; color:var(--text2); transition:all .14s; min-height:44px; display:flex; align-items:center; }
.frag:hover { border-color:var(--green); color:var(--green); }
.frag.used { opacity:.35; pointer-events:none; }

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Causas de Desigualdad en la Calidad de Vida</div>
    <div class="wcourse" id="wcourse-el">Formación Cívica y Ética · 1° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">

          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }

        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>

        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">

    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->

    </div>

    <div class="hsep"></div>

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');

  if (isOk) correctCount++;

  saveSession();

}

  var TW      = PW - M * 2;
  var PH      = doc.internal.pageSize.height;
  var name    = studentData.name;
  var group   = studentData.group;
  var total   = problems.length;
  var pct     = Math.round(correctCount / total * 100);
  var dateStr = new Date().toLocaleString('es-MX', { dateStyle:'long', timeStyle:'short' });

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS — INJECTION BLOCK ─────────────────────────────────────────
  //   Match these RGB values to --green and --gold above.
  //   PRIMARY  → pBR, pBG, pBB
  //   ACCENT   → pAR, pAG, pAB
  // ──────────────────────────────────────────────────────────────────────────
  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;  // PRIMARY (from SCHOOL, Rule 16)
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;   // ACCENT (from SCHOOL, Rule 16)

  function pdfText(html) {
    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/\u2192/g,'->').replace(/\u2212/g,'-').replace(/\u00b2/g,'^2')
      .replace(/\u00b3/g,'^3').replace(/\u00d7/g,'x').replace(/\u00f7/g,'/')
      .replace(/\u2260/g,'!=').replace(/\u2264/g,'<=').replace(/\u2265/g,'>=')
      .replace(/\u221a/g,'sqrt').replace(/\u03c0/g,'pi').replace(/\u2026/g,'...')
      .replace(/\s+/g,' ').trim();
  }

  // ── PORTADA: orange line / white logo strip / orange line / blue band ──
  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,2,'F');   // top accent line
  doc.setFillColor(255,255,255); doc.rect(0,2,PW,26,'F');                               // white logo strip
  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,28,PW,2,'F');  // bottom accent line
  doc.setFillColor(pBR,pBG,pBB); doc.rect(0,30,PW,34,'F');       // blue header band

  if (SCHOOL.logoLeftB64) {
    var fmtL = SCHOOL.logoLeftB64.indexOf('/9j/') > -1 ? 'JPEG' : 'PNG';
    try { doc.addImage(SCHOOL.logoLeftB64, fmtL, M, 4, 48, 22); } catch(e) {}
  }
  if (SCHOOL.logoRightB64) {
    var fmtR = SCHOOL.logoRightB64.indexOf('/9j/') > -1 ? 'JPEG' : 'PNG';
    try { doc.addImage(SCHOOL.logoRightB64, fmtR, 130, 4, 48, 22); } catch(e) {}
  }

  var lx = PW - M - 36;
  var ly = 10;
  doc.setDrawColor(pBR,pBG,pBB); doc.setLineWidth(0.7);
  doc.lines([[2.57-1.03,4.63-6.17],[4.11-2.57,5.14-4.63],[5.66-4.11,2.57-5.14]], lx+1.03, ly+6.17);
  doc.setFillColor(pAR,pAG,pAB); doc.circle(lx+5.66, ly+2.57, 0.9, 'F');
  doc.setDrawColor(pAR,pAG,pAB); doc.setLineWidth(0.7);
  doc.line(lx+8.23, ly+1.54, lx+8.23, ly+7.2);
  doc.setTextColor(pBR,pBG,pBB); doc.setFontSize(11); doc.setFont('helvetica','bold');
  doc.text('LIAXA', lx+10, ly+6.8);

  // Guide title + date inside the blue band
  doc.setTextColor(232,238,247); doc.setFontSize(19); doc.setFont('helvetica','bold');
  doc.text(t('wtitle'), M, 49);
  doc.setTextColor(150,165,200); doc.setFontSize(8); doc.setFont('helvetica','normal');
  doc.text(dateStr, M, 59);

  // ── Student info card (name + group only — código goes to footer) ──
  doc.setFillColor(237,240,245); doc.roundedRect(M,72,TW,20,3,3,'F');
  doc.setTextColor(130,140,160); doc.setFontSize(8.5); doc.setFont('helvetica','bold');
  doc.text('ALUMNO', M+4, 79); doc.text('GRUPO', 130, 79);
  doc.setTextColor(20,24,32); doc.setFontSize(11); doc.setFont('helvetica','bold');
  doc.text(name, M+4, 87); doc.text(group, 130, 87);

  // ── Score box ──
  var sc = pct>=70?[26,106,74]:pct>=50?[224,123,26]:[176,48,16];
  doc.setFillColor(255,255,255); doc.roundedRect(M,100,TW,34,4,4,'F');
  doc.setDrawColor(sc[0],sc[1],sc[2]); doc.setLineWidth(0.8);
  doc.roundedRect(M,100,TW,34,4,4,'S');
  doc.setTextColor(sc[0],sc[1],sc[2]); doc.setFontSize(40); doc.setFont('helvetica','bold');
  doc.text(pct+'%', PW/2, 124, {align:'center'});
  doc.setTextColor(130,140,160); doc.setFontSize(8.5); doc.setFont('helvetica','normal');
  doc.text(correctCount+' correcta(s) de '+total+' preguntas', PW/2, 131, {align:'center'});

  // ── Problem summary table ──
  doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
  doc.setFontSize(7); doc.setFont('helvetica','bold');
  doc.rect(M,142,TW,8,'F'); doc.text('RESUMEN DE PROBLEMAS', M+4, 148);
  var sy = 154;
  problems.forEach(function(prob, i) {
    if (sy + 12 > PH - 15) {
      doc.addPage(); sy = 20;
      doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
      doc.setFontSize(7); doc.setFont('helvetica','bold');
      doc.rect(M,sy,TW,8,'F'); doc.text('RESUMEN DE PROBLEMAS (continuación)', M+4, sy+6);
      sy += 12;
    }
    var ok = document.getElementById('pc'+i).classList.contains('ok');
    doc.setFillColor(ok?232:255, ok?240:232, ok?232:228);
    doc.roundedRect(M,sy,TW,10,2,2,'F');
    doc.setFillColor(ok?26:176, ok?106:48, ok?74:16);
    doc.circle(M+6, sy+5, 2.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(7); doc.setFont('helvetica','bold');
    doc.text(ok?'✓':'✗', M+4.5, sy+6.5);
    doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('helvetica','normal');
    doc.text('Problema '+(i+1)+': '+pdfText(prob.title), M+12, sy+6.5);
    doc.setTextColor(ok?26:176, ok?106:48, ok?74:16);
    doc.text(ok?'Correcto':'Incorrecto', PW-M-24, sy+6.5);
    sy += 12;
  });

  // ── Per-problem pages ──
  for (var i = 0; i < problems.length; i++) {
    var prob = problems[i];
    doc.addPage();
    var wy = 0;

    doc.setFillColor(pBR,pBG,pBB); doc.rect(0,0,PW,20,'F');
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,3,'F');
    doc.setTextColor(pAR,pAG,pAB); doc.setFontSize(7); doc.setFont('helvetica','normal');
    doc.text(t('wcourse')+'  ·  '+t('wtitle'), M, 10);
    doc.setTextColor(232,238,247); doc.setFontSize(10.5); doc.setFont('helvetica','bold');
    doc.text('Problema '+(i+1)+' de '+total+'  ·  '+pdfText(prob.title), M, 17);
    wy = 25;

    var qRaw = pdfText(prob.questionText);
    doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var qLines = doc.splitTextToSize(qRaw, TW-10);
    var qBoxH  = 8 + qLines.length*5 + 3;
    doc.setFillColor(237,240,245); doc.roundedRect(M,wy,TW,qBoxH,2,2,'F');
    doc.setTextColor(pBR,pBG,pBB); doc.setFontSize(6.5); doc.setFont('helvetica','bold');
    doc.text('PREGUNTA', M+4, wy+6);
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var qy = wy+12;
    qLines.forEach(function(ln,li){ doc.text(ln, M+4, qy+li*5); });
    wy += qBoxH + 4;

    var isOk   = document.getElementById('pc'+i).classList.contains('ok');
    var chosen = prob.studentChoice != null ? pdfText(prob.options[prob.studentChoice]||'-') : '-';
    var corr   = pdfText(prob.options[prob.correctIdx]||'');
    var expRaw = pdfText(prob.explanation||'');
    doc.setFontSize(8.5); var chLines = doc.splitTextToSize('Alumno: '+chosen, TW-18);
    doc.setFontSize(8);   var coLines = doc.splitTextToSize('Correcto: '+corr, TW-18);
    doc.setFontSize(7.5); var exLines = doc.splitTextToSize('Solución: '+expRaw, TW-18).slice(0,4);
    var ansBoxH = 8 + chLines.length*5.5 + coLines.length*5 + exLines.length*5 + 6;
    doc.setFillColor(isOk?232:255, isOk?240:232, isOk?232:228);
    doc.roundedRect(M,wy,TW,ansBoxH,2,2,'F');
    doc.setFillColor(isOk?26:176, isOk?106:48, isOk?74:16);
    doc.circle(M+7, wy+8, 3.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(9); doc.setFont('helvetica','bold');
    doc.text(isOk?'✓':'✗', M+5.2, wy+10.5);
    var ay = wy+7;
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','bold');
    chLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5.5); });
    ay += chLines.length*5.5 + 3;
    doc.setTextColor(26,106,74); doc.setFontSize(8); doc.setFont('helvetica','normal');
    coLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    ay += coLines.length*5 + 3;
    doc.setTextColor(90,85,80); doc.setFontSize(7.5);
    exLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    wy += ansBoxH + 5;

    doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
    doc.setFontSize(7); doc.setFont('helvetica','bold');
    doc.rect(M,wy,TW,8,'F'); doc.text('TRABAJO DEL ALUMNO', M+4, wy+5.5);
    wy += 11;

    var dc = document.getElementById('dc'+i);
    if (dc) {
      try {
        var imgD = dc.toDataURL('image/png');
        var ar   = dc.height / dc.width;
        var iw   = TW;
        var ih   = Math.min(iw * ar, 68);
        doc.addImage(imgD, 'PNG', M, wy, iw, ih);
        wy += ih + 4;
      } catch(e) {}
    }

    var ta = document.getElementById('ta'+i);
    if (ta && ta.value.trim()) {
      if (wy > PH-30) { doc.addPage(); wy = 20; }
      doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('courier','normal');
      var taLines = doc.splitTextToSize(ta.value, TW);
      taLines.slice(0,16).forEach(function(ln) {
        if (wy > PH-15) { doc.addPage(); wy = 20; }
        doc.text(ln, M, wy); wy += 5;
      });
      wy += 2;
    }

    var pp = document.getElementById('pp'+i);
    if (pp && pp.src && pp.src.indexOf('data:') === 0) {
      if (wy > PH-55) { doc.addPage(); wy = 20; }
      try { doc.addImage(pp.src, 'JPEG', M, wy, TW, 68); wy += 72; } catch(e) {}
    }
  }

  // ── Footer on every page ──
  var pages = doc.internal.getNumberOfPages();
  for (var p = 1; p <= pages; p++) {
    doc.setPage(p);
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0, PH-3, PW, 3, 'F');
    doc.setTextColor(130,140,160); doc.setFontSize(6.5); doc.setFont('helvetica','normal');
    doc.text(name+'  ·  '+group+'  ·  Código: '+code+'  ·  Página '+p+'/'+pages,
      PW/2, PH-5, {align:'center'});
  }

  doc.save('fce1_t04_g01_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf');
  btn.innerHTML = '⬇ &nbsp;Descargar Resultados PDF';
  btn.disabled  = false;
}

function S(es, en){ return LANG === 'es' ? es : en; }

function addSection(tag, html){
  var d = document.createElement('div');
  d.className = 'section';
  d.innerHTML = '<div class="stag">' + tag + '</div>' + html;
  document.getElementById('lessonBody').appendChild(d);
  return d;
}

/* Shuffles options (Rule 7) keeping ES/EN aligned, then builds the card inline (Rule 1/5). */
function addProblem(v, rng){
  var n = v.options.es.length, idx = [], k;
  for (k = 0; k < n; k++) idx.push(k);
  for (k = n - 1; k > 0; k--) {
    var j = Math.floor(rng() * (k + 1));
    var tmp = idx[k]; idx[k] = idx[j]; idx[j] = tmp;
  }
  var langOpts = (LANG === 'es') ? v.options.es : v.options.en;
  var prob = {
    title:        v.title[LANG],
    questionText: v.stmt[LANG],
    fn:           v.fn || '',
    hint:         v.hint[LANG],
    explanation:  v.explanation[LANG],
    options:      idx.map(function(o){ return langOpts[o]; }),
    correctIdx:   idx.indexOf(v.correct),
    showWork:     !!v.showWork,
    studentChoice:null, pendingChoice:null
  };
  problems.push(prob);
  buildOneCard(prob, problems.length - 1);
}

/* ================================================
   WIDGET 1 - PERFIL DE CALIDAD DE VIDA
   Tap the conditions a household actually has covered. The meter fills live,
   the message points at what is missing or extra. Three households.
   ================================================ */
var DIM = null;
function dimList(){
  return [
    { n:{ es:'Salud', en:'Health' },              s:{ es:'atención médica al alcance', en:'medical care within reach' } },
    { n:{ es:'Educación', en:'Education' },       s:{ es:'escuela a la que sí se puede llegar', en:'a school you can actually get to' } },
    { n:{ es:'Vivienda', en:'Housing' },          s:{ es:'casa firme y protegida', en:'solid, protected house' } },
    { n:{ es:'Agua limpia', en:'Clean water' },   s:{ es:'abasto regular y drenaje', en:'regular supply and drainage' } },
    { n:{ es:'Ingreso suficiente', en:'Sufficient income' }, s:{ es:'alcanza para comer y vestir', en:'enough to eat and dress' } },
    { n:{ es:'Entorno seguro', en:'Safe surroundings' },     s:{ es:'calles transitables y alumbradas', en:'passable, lit streets' } }
  ];
}
function buildDim(rng){
  var cases = [
    { cov:[2,3,4],
      txt:{ es:'La familia de Nadia vive en una casa de material firme con luz eléctrica y agua entubada todos los días. Los dos adultos tienen empleo con salario fijo que alcanza para comer y vestir. La clínica más cercana está a tres horas de camino y la secundaria más próxima queda en otro municipio, así que Nadia dejó de estudiar. Por las noches la calle no tiene alumbrado y evitan salir.',
            en:'Nadia and her family live in a solidly built house with electricity and piped water every day. Both adults have jobs with a fixed wage that covers food and clothing. The nearest clinic is three hours away and the closest secondary school is in another municipality, so Nadia stopped studying. At night the street has no lighting and they avoid going out.' },
      why:{ es:'Un mismo hogar puede tener resuelta la vivienda y el ingreso, y al mismo tiempo quedar fuera de la salud y de la escuela.',
            en:'One household can have housing and income solved and at the same time be left out of health care and school.' } },
    { cov:[0,1,5],
      txt:{ es:'En la colonia de Emiliano hay primaria y secundaria a diez minutos y un centro de salud que abre todos los días. Las calles están alumbradas y se puede caminar de noche. Su casa recibe agua por pipa dos veces por semana y el techo es de lámina que se filtra en cada lluvia. El ingreso del hogar alcanza solo para dos comidas al día.',
            en:'In Emiliano neighborhood there is a primary and a secondary school ten minutes away and a health center open every day. The streets are lit and you can walk at night. His house gets water by truck twice a week and the roof is sheet metal that leaks in every rain. The household income only covers two meals a day.' },
      why:{ es:'Tener escuela y clínica cerca no compensa una vivienda que se filtra ni un ingreso que no alcanza para comer.',
            en:'Having a school and a clinic nearby does not make up for a leaking house or an income that does not cover food.' } },
    { cov:[1,2,3],
      txt:{ es:'La familia de Rosaura tiene agua entubada todos los días y una casa con piso firme y techo de concreto. En el pueblo hay una telesecundaria a la que asisten los tres hijos. No existe unidad médica y el traslado al hospital toma medio día. El ingreso depende de la cosecha y en temporada baja no alcanza para las tres comidas. En el camino a la escuela no hay alumbrado ni banquetas.',
            en:'Rosaura family has piped water every day and a house with a solid floor and a concrete roof. In the town there is a distance learning secondary school the three children attend. There is no medical unit and the trip to the hospital takes half a day. Income depends on the harvest and in the low season it does not cover three meals. On the way to school there is no lighting and there are no sidewalks.' },
      why:{ es:'Aquí la escuela y el agua están resueltas, pero la salud, el ingreso y el camino seguro no. Casi ningún hogar está cubierto o descubierto por completo.',
            en:'Here school and water are solved, but health, income and a safe route are not. Almost no household is fully covered or fully uncovered.' } }
  ];
  DIM = { dims:dimList(), cases:shuffle(cases, rng), round:0, sel:[false,false,false,false,false,false], tries:0, state:'play', flash:null };
  return '<div class="wgt">' +
      '<div class="wgt-h">' + S('Perfil de calidad de vida','Quality of life profile') + '</div>' +
      '<div class="wgt-q">' + S('Lee el caso y enciende las condiciones que ese hogar sí tiene cubiertas.','Read the case and switch on the conditions that household does have covered.') + '</div>' +
      '<div id="dimBox"></div>' +
    '</div>';
}
function dimStats(){
  var c = DIM.cases[DIM.round], hits = 0, extra = 0, i;
  for (i = 0; i < DIM.dims.length; i++) {
    if (DIM.sel[i]) { if (c.cov.indexOf(i) >= 0) hits++; else extra++; }
  }
  return { c:c, hits:hits, extra:extra, missing:c.cov.length - hits };
}
function dimRender(){
  if (!DIM) return;
  var box = document.getElementById('dimBox');
  if (!box) return;
  var st = dimStats(), c = st.c;
  var grid = DIM.dims.map(function(d, k){
    var cls = 'dim';
    if (DIM.state === 'play') { if (DIM.sel[k]) cls += ' on'; }
    else { if (c.cov.indexOf(k) >= 0) cls += ' hit'; else if (DIM.sel[k]) cls += ' over'; }
    return '<div class="' + cls + '" onclick="dimTap(' + k + ')">' +
             '<div class="dimname">' + d.n[LANG] + '</div>' +
             '<div class="dimsub">' + d.s[LANG] + '</div>' +
           '</div>';
  }).join('');
  var msg, cl = '';
  if (DIM.state === 'ok') {
    msg = S('Así es: ese hogar tiene cubiertas esas tres condiciones y le faltan las otras tres. ',
            'That is it: that household has those three conditions covered and lacks the other three. ') + c.why[LANG];
    cl = ' ok';
  } else if (DIM.state === 'reveal') {
    msg = S('Las cubiertas eran estas tres, marcadas en verde. ','The covered ones were these three, marked in green. ') + c.why[LANG];
    cl = ' warn';
  } else if (DIM.flash) {
    msg = DIM.flash; cl = ' warn';
  } else if (st.extra > 0) {
    msg = S('Encendiste una condición que el caso no describe como cubierta. Vuelve a leerlo y apágala tocándola otra vez.',
            'You switched on a condition the case does not describe as covered. Read it again and switch it off by tapping it once more.');
    cl = ' warn';
  } else if (st.hits === 0) {
    msg = S('Toca las condiciones que este hogar sí tiene resueltas según el caso. Puedes encenderlas y apagarlas las veces que quieras.',
            'Tap the conditions this household does have solved according to the case. You can switch them on and off as many times as you like.');
  } else if (st.missing > 0) {
    msg = S('Llevas ' + st.hits + ' de ' + c.cov.length + '. El caso todavía menciona otra condición cubierta que no has encendido.',
            'You have ' + st.hits + ' of ' + c.cov.length + '. The case still mentions another covered condition you have not switched on.');
  } else {
    msg = S('Ya tienes tres encendidas. Toca Comprobar para confirmar tu lectura del caso.',
            'You have three switched on. Tap Check to confirm your reading of the case.');
  }
  var btns = '';
  if (DIM.state === 'play') btns += '<button class="wbtn" onclick="dimCheck()">' + S('Comprobar','Check') + '</button>';
  if (DIM.state !== 'play' && DIM.round < DIM.cases.length - 1) btns += '<button class="wbtn" onclick="dimNext()">' + S('Otro hogar →','Another household →') + '</button>';
  var pctv = Math.round(st.hits / c.cov.length * 100);
  box.innerHTML =
    '<div class="wcase">' + c.txt[LANG] + '</div>' +
    '<div class="dimgrid">' + grid + '</div>' +
    '<div class="meter"><div class="meterfill' + ((st.missing === 0 && st.extra === 0) ? ' full' : '') + '" style="width:' + pctv + '%"></div></div>' +
    '<div class="wmsg' + cl + '">' + msg + '</div>' +
    '<div class="wrow">' + btns + '</div>' +
    '<div class="wprog">' + S('Hogar ','Household ') + (DIM.round + 1) + ' / ' + DIM.cases.length + '</div>';
}
function dimTap(k){
  if (!DIM || DIM.state !== 'play') return;
  DIM.sel[k] = !DIM.sel[k];
  DIM.flash = null;
  dimRender();
}
function dimCheck(){
  if (!DIM || DIM.state !== 'play') return;
  var st = dimStats();
  if (st.missing === 0 && st.extra === 0) { DIM.state = 'ok'; DIM.flash = null; dimRender(); return; }
  DIM.tries++;
  if (DIM.tries >= 3) {
    DIM.state = 'reveal';
    DIM.sel = DIM.dims.map(function(d, i){ return st.c.cov.indexOf(i) >= 0; });
  } else if (st.extra > 0) {
    DIM.flash = S('Todavía hay una condición encendida que el caso no describe como cubierta. Léelo otra vez y apágala.',
                  'There is still a condition switched on that the case does not describe as covered. Read it again and switch it off.');
  } else {
    DIM.flash = S('Falta al menos una condición que el caso sí describe como cubierta. Búscala en el texto.',
                  'At least one condition the case does describe as covered is missing. Look for it in the text.');
  }
  dimRender();
}
function dimNext(){
  if (!DIM) return;
  DIM.round++; DIM.sel = [false,false,false,false,false,false];
  DIM.tries = 0; DIM.state = 'play'; DIM.flash = null;
  dimRender();
}

function buildCau(rng){

        { ok:false, t:{ es:'La cantidad de personas que vive en cada una de las colonias.', en:'The number of people living in each of the neighborhoods.' },
          why:{ es:'Una red bien planeada se dimensiona según la población. El número por sí solo no explica el corte del servicio.',

      opts:[
        { ok:true,  t:{ es:'El ingreso desigual de los hogares, que determina la alimentación y los materiales disponibles.', en:'The unequal income of the households, which determines food and available materials.' } },
        { ok:false, t:{ es:'La capacidad de cada niña para concentrarse durante la clase.', en:'The ability of each girl to concentrate during class.' },

        { ok:false, t:{ es:'La preferencia de cada familia por la lectura como actividad de tiempo libre.', en:'Each family preference for reading as a free time activity.' },
          why:{ es:'Tener libros en casa depende del ingreso disponible antes que del gusto por leer.',

        { ok:false, t:{ es:'El turno escolar en el que quedó inscrita cada una de las niñas.', en:'The school shift each of the girls was enrolled in.' },
          why:{ es:'El turno organiza el horario. No cambia lo que hay para comer en cada casa.',
                en:'The shift organizes the schedule. It does not change what there is to eat in each home.' } } ] }
  ];
  var chosen = shuffle(rounds, rng).slice(0, 3).map(function(r){
    return { c:r.c, exp:r.exp, opts:shuffle(r.opts, rng) };
  });
  CAU = { rounds:chosen, r:0, tries:0, state:'play', miss:[], last:null };
  return '<div class="wgt">' +
      '<div class="wgt-h">' + S('¿De dónde viene la diferencia?','Where does the difference come from?') + '</div>' +
      '<div class="wgt-q">' + S('Elige la causa de origen, la que ya existía antes de que las personas actuaran.','Choose the origin cause, the one that already existed before the people acted.') + '</div>' +

}
function cauRender(){
  if (!CAU) return;
  var box = document.getElementById('cauBox');
  if (!box) return;
  var r = CAU.rounds[CAU.r];
  var list = r.opts.map(function(o, i){
    var cls = 'opt2';
    if (CAU.miss.indexOf(i) >= 0) cls += ' miss';
    if (CAU.state !== 'play' && o.ok) cls += ' good';
    return '<div class="' + cls + '" onclick="cauPick(' + i + ')">' + o.t[LANG] + '</div>';
  }).join('');
  var msg, cl = '';
  if (CAU.state === 'ok') { msg = S('Esa es la causa de origen. ','That is the origin cause. ') + r.exp[LANG]; cl = ' ok'; }
  else if (CAU.state === 'reveal') { msg = S('La causa de origen está marcada en verde. ','The origin cause is marked in green. ') + r.exp[LANG]; cl = ' warn'; }
  else if (CAU.last) { msg = CAU.last[LANG]; cl = ' warn'; }
  else { msg = S('Pregúntate cuál de las cuatro no depende de lo que hagan las personas del caso.','Ask yourself which of the four does not depend on what the people in the case do.'); }
  var btn = (CAU.state !== 'play' && CAU.r < CAU.rounds.length - 1)
    ? '<button class="wbtn" onclick="cauNext()">' + S('Otro caso →','Another case →') + '</button>' : '';
  box.innerHTML =
    '<div class="wcase">' + r.c[LANG] + '</div>' +
    '<div class="opts2">' + list + '</div>' +
    '<div class="wmsg' + cl + '">' + msg + '</div>' +
    '<div class="wrow">' + btn + '</div>' +
    '<div class="wprog">' + S('Caso ','Case ') + (CAU.r + 1) + ' / ' + CAU.rounds.length + '</div>';
}
function cauPick(i){
  if (!CAU || CAU.state !== 'play') return;
  var o = CAU.rounds[CAU.r].opts[i];
  if (o.ok) { CAU.state = 'ok'; CAU.last = null; }
  else {
    if (CAU.miss.indexOf(i) < 0) CAU.miss.push(i);
    CAU.tries++; CAU.last = o.why;
    if (CAU.tries >= 3) CAU.state = 'reveal';
  }
  cauRender();
}
function cauNext(){
  if (!CAU) return;
  CAU.r++; CAU.tries = 0; CAU.state = 'play'; CAU.miss = []; CAU.last = null;
  cauRender();
}

/* ================================================
   WIDGET 3 - CADENA DE CAUSA Y EFECTO
   Build the chain one link at a time. Undo removes the last link, so the
   student can rebuild it as many times as needed. Reveal on the third miss.
   ================================================ */
var CHN = null;
function buildChain(rng){
  var sets = [
    { start:{ es:'En la localidad no hay secundaria ni transporte hacia el municipio vecino.',
              en:'In the town there is no secondary school and no transport to the neighboring municipality.' },
      steps:[
        { opts:[
          { ok:true,  t:{ es:'Varios adolescentes dejan de estudiar al terminar la primaria.', en:'Several teenagers stop studying once primary school ends.' } },
          { ok:false, t:{ es:'Los adolescentes de la localidad estudian más horas en casa cada día.', en:'The teenagers of the town study more hours at home each day.' },
            why:{ es:'Sin escuela ni transporte, lo primero que cambia es la posibilidad de seguir asistiendo, no las horas de estudio en casa.',
                  en:'With no school and no transport, the first thing that changes is the chance to keep attending, not the study hours at home.' } },
          { ok:false, t:{ es:'El municipio vecino reduce el número de sus escuelas secundarias.', en:'The neighboring municipality reduces the number of its secondary schools.' },
            why:{ es:'Ese sería un cambio en otro lugar. Sigue el efecto sobre las personas de esta localidad.',
                  en:'That would be a change somewhere else. Follow the effect on the people of this town.' } } ] },
        { opts:[
          { ok:true,  t:{ es:'Al llegar a la vida adulta consiguen empleos peor pagados y sin seguridad social.', en:'On reaching adulthood they get worse paid jobs with no social security.' } },
          { ok:false, t:{ es:'Las empresas de la región elevan el salario que ofrecen en la localidad.', en:'The companies of the region raise the wage they offer in the town.' },
            why:{ es:'Con menor escolaridad suele ocurrir lo contrario: el acceso queda limitado a empleos peor pagados.',
                  en:'With less schooling the opposite usually happens: access is limited to worse paid jobs.' } },
          { ok:false, t:{ es:'La localidad recibe de inmediato una escuela secundaria nueva.', en:'The town immediately receives a new secondary school.' },
            why:{ es:'Eso sería un remedio, no un efecto. Sigue la consecuencia de haber dejado de estudiar.',
                  en:'That would be a remedy, not an effect. Follow the consequence of having stopped studying.' } } ] },
        { opts:[
          { ok:true,  t:{ es:'Sus hijas e hijos crecen en hogares con menos ingreso y la desventaja se repite.', en:'Their daughters and sons grow up in lower income homes and the disadvantage repeats.' } },
          { ok:false, t:{ es:'El ingreso del hogar deja de influir en las condiciones de la siguiente generación.', en:'Household income stops influencing the conditions of the next generation.' },
            why:{ es:'Ocurre justo lo contrario: el ingreso del hogar marca con qué condiciones crece la siguiente generación.',
                  en:'The opposite happens: household income shapes the conditions the next generation grows up with.' } },
          { ok:false, t:{ es:'La falta de secundaria en la localidad desaparece por sí sola con el tiempo.', en:'The lack of a secondary school in the town disappears on its own over time.' },
            why:{ es:'Nada en la cadena hace que la escuela aparezca sola. Busca el efecto sobre la siguiente generación.',
                  en:'Nothing in the chain makes a school appear on its own. Look for the effect on the next generation.' } } ] }
      ],
      exp:{ es:'Una condición material del territorio termina afectando la escolaridad, el empleo y el hogar que se forma después.',
            en:'A material condition of the territory ends up affecting schooling, employment and the household formed later.' } },
    { start:{ es:'En el barrio no hay red de drenaje y el agua llega por pipa cada quince días.',
              en:'In the neighborhood there is no drainage network and water arrives by truck every fifteen days.' },
      steps:[
        { opts:[
          { ok:true,  t:{ es:'Las familias almacenan agua durante días en tambos y cubetas.', en:'Families store water for days in drums and buckets.' } },
          { ok:false, t:{ es:'Las familias reducen el uso de agua hasta no necesitar almacenarla.', en:'Families cut water use until they no longer need to store it.' },
            why:{ es:'Con un abasto irregular, lo primero que hace un hogar es guardar agua para los días sin servicio.',
                  en:'With an irregular supply, the first thing a household does is store water for the days without service.' } },
          { ok:false, t:{ es:'El servicio de pipas se vuelve diario en todo el barrio.', en:'The water truck service becomes daily across the neighborhood.' },
            why:{ es:'Eso sería una solución, no una consecuencia. Sigue lo que ocurre dentro de las casas.',
                  en:'That would be a solution, not a consequence. Follow what happens inside the houses.' } } ] },
        { opts:[
          { ok:true,  t:{ es:'Aumentan las infecciones estomacales, sobre todo entre niñas y niños.', en:'Stomach infections increase, especially among girls and boys.' } },
          { ok:false, t:{ es:'Disminuyen las consultas médicas porque el agua guardada se conserva mejor.', en:'Medical visits drop because stored water keeps better.' },
            why:{ es:'El agua almacenada durante días se contamina con facilidad. El efecto va en el otro sentido.',
                  en:'Water stored for days is easily contaminated. The effect goes the other way.' } },
          { ok:false, t:{ es:'Las familias del barrio dejan de usar agua para cocinar.', en:'The families of the neighborhood stop using water for cooking.' },
            why:{ es:'El agua se sigue usando. Lo que cambia es su calidad y el riesgo que implica.',
                  en:'Water keeps being used. What changes is its quality and the risk it carries.' } } ] },
        { opts:[
          { ok:true,  t:{ es:'Se pierden días de escuela y de trabajo, y los gastos del hogar aumentan.', en:'School and work days are lost, and household expenses rise.' } },
          { ok:false, t:{ es:'El barrio recibe una red de drenaje como consecuencia de las infecciones.', en:'The neighborhood receives a drainage network as a consequence of the infections.' },
            why:{ es:'Esa obra depende de una decisión pública. No aparece como efecto automático de enfermarse.',
                  en:'That work depends on a public decision. It does not appear as an automatic effect of getting sick.' } },
          { ok:false, t:{ es:'Las enfermedades dejan de afectar la asistencia a la escuela y al trabajo.', en:'Illnesses stop affecting attendance at school and work.' },
            why:{ es:'Enfermarse con frecuencia se traduce en faltas. Sigue esa consecuencia.',
                  en:'Getting sick often turns into absences. Follow that consequence.' } } ] }
      ],
      exp:{ es:'La falta de un servicio básico no se queda en la tubería: pasa por la salud y termina en la escuela, el trabajo y el gasto del hogar.',
            en:'The lack of a basic service does not stay in the pipes: it passes through health and ends up in school, work and household spending.' } }
  ];
  var st = pick(sets, rng);
  CHN = {
    start:st.start, exp:st.exp,
    steps:st.steps.map(function(s){ return { opts:shuffle(s.opts, rng) }; }),
    i:0, chain:[], tries:0, miss:[], last:null, state:'play'
  };
  return '<div class="wgt">' +
      '<div class="wgt-h">' + S('Cadena de causa y efecto','Cause and effect chain') + '</div>' +
      '<div class="wgt-q">' + S('Arma la cadena eslabón por eslabón. Puedes quitar el último y volver a intentarlo.','Build the chain link by link. You can remove the last one and try again.') + '</div>' +
      '<div id="chnBox"></div>' +
    '</div>';
}
function chnRender(){
  if (!CHN) return;
  var box = document.getElementById('chnBox');
  if (!box) return;
  var row = '<span class="link start">' + CHN.start[LANG] + '</span>';
  CHN.chain.forEach(function(txt){
    row += '<span class="arw">→</span><span class="link">' + txt + '</span>';
  });
  if (CHN.state === 'play') {
    row += '<span class="arw">→</span><span class="link ghost">' + S('¿qué sigue?','what comes next?') + '</span>';
  }
  var list = '';
  if (CHN.state === 'play') {
    list = '<div class="opts2">' + CHN.steps[CHN.i].opts.map(function(o, k){
      var cls = 'opt2' + (CHN.miss.indexOf(k) >= 0 ? ' miss' : '');
      return '<div class="' + cls + '" onclick="chnPick(' + k + ')">' + o.t[LANG] + '</div>';
    }).join('') + '</div>';
  }
  var msg, cl = '';
  if (CHN.state === 'done') { msg = S('Cadena completa. ','Chain complete. ') + CHN.exp[LANG]; cl = ' ok'; }
  else if (CHN.last) { msg = CHN.last; cl = ' warn'; }
  else { msg = S('Elige el eslabón que se desprende directamente del anterior.','Choose the link that follows directly from the previous one.'); }
  var btns = '';
  if (CHN.chain.length > 0) btns += '<button class="wbtn" onclick="chnUndo()">' + S('Quitar el último','Remove the last one') + '</button>';
  if (CHN.chain.length > 0) btns += '<button class="wbtn" onclick="chnReset()">' + S('Empezar de nuevo','Start over') + '</button>';
  box.innerHTML =
    '<div class="chainrow">' + row + '</div>' + list +
    '<div class="wmsg' + cl + '">' + msg + '</div>' +
    '<div class="wrow">' + btns + '</div>' +
    '<div class="wprog">' + S('Eslabones colocados: ','Links placed: ') + CHN.chain.length + ' / ' + CHN.steps.length + '</div>';
}
function chnAdvance(txt, note){
  CHN.chain.push(txt);
  CHN.i++; CHN.tries = 0; CHN.miss = []; CHN.last = note || null;
  if (CHN.i >= CHN.steps.length) CHN.state = 'done';
}
function chnPick(k){
  if (!CHN || CHN.state !== 'play') return;
  var o = CHN.steps[CHN.i].opts[k];
  if (o.ok) { chnAdvance(o.t[LANG], null); chnRender(); return; }
  if (CHN.miss.indexOf(k) < 0) CHN.miss.push(k);
  CHN.tries++; CHN.last = o.why[LANG];
  if (CHN.tries >= 3) {
    var opts = CHN.steps[CHN.i].opts, j, good = opts[0];
    for (j = 0; j < opts.length; j++) if (opts[j].ok) good = opts[j];
    chnAdvance(good.t[LANG], S('Este era el eslabón que seguía. Observa cómo se desprende del anterior.',
                               'This was the next link. Notice how it follows from the previous one.'));
  }
  chnRender();
}
function chnUndo(){
  if (!CHN || CHN.chain.length === 0) return;
  CHN.chain.pop(); CHN.i--; CHN.tries = 0; CHN.miss = []; CHN.last = null; CHN.state = 'play';
  chnRender();
}
function chnReset(){
  if (!CHN) return;
  CHN.chain = []; CHN.i = 0; CHN.tries = 0; CHN.miss = []; CHN.last = null; CHN.state = 'play';
  chnRender();
}

/* ================================================
   WIDGET 4 - CERRAR LA BRECHA
   A slider distributes the public budget between two places. Both bars move
   live; pushing too far reopens the gap on the other side.
   ================================================ */
var BR = null, BR_BOUND = false;
function buildBrecha(rng){
  var pairs = [
    { a:{ es:'Colonia con red de agua, clínica y secundaria', en:'Neighborhood with water network, clinic and secondary school' },
      b:{ es:'Comunidad sin red de agua ni clínica', en:'Community with no water network and no clinic' } },
    { a:{ es:'Municipio urbano con drenaje y hospital', en:'Urban municipality with drainage and hospital' },
      b:{ es:'Municipio rural sin drenaje ni hospital', en:'Rural municipality with no drainage and no hospital' } },
    { a:{ es:'País con cobertura casi total de servicios básicos', en:'Country with nearly full coverage of basic services' },
      b:{ es:'País donde un tercio de los hogares carece de ellos', en:'Country where a third of households lack them' } }
  ];
  BR = { pr:pick(pairs, rng), baseA:62 + Math.floor(rng() * 8), baseB:26 + Math.floor(rng() * 8), p:0, reached:false };
  if (!BR_BOUND) { window.addEventListener('resize', function(){ brDraw(); }); BR_BOUND = true; }
  return '<div class="wgt">' +
      '<div class="wgt-h">' + S('Cerrar la brecha','Closing the gap') + '</div>' +
      '<div class="tgt">' + S('Meta: <strong>deja las dos barras casi a la misma altura</strong> moviendo el reparto del presupuesto público.',
                              'Goal: <strong>leave the two bars at almost the same height</strong> by moving how the public budget is shared.') + '</div>' +
      '<div class="brwrap"><canvas class="brcv" id="brCv"></canvas></div>' +

                                'Share of the budget assigned to the one with fewer services') + '</div>' +

        '<input type="range" id="brSl" min="0" max="100" step="1" value="0" oninput="brIn()">' +
        '<span class="ctlval" id="brVal">0%</span>' +

      '<div id="brMsg"></div>' +

function brVals(){
  var sA = BR.baseA + (100 - BR.p) * 0.25;
  var sB = BR.baseB + BR.p * 0.60;
  if (sA > 100) sA = 100;
  if (sB > 100) sB = 100;
  return { a:sA, b:sB, gap:sA - sB };
}
function brDraw(){
  var cv = document.getElementById('brCv');
  if (!cv || !BR) return;
  var r = cv.getBoundingClientRect();
  if (!r.width) return;
  var dpr = window.devicePixelRatio || 1;
  cv.width = r.width * dpr; cv.height = r.height * dpr;
  var ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  var W = r.width, H = r.height;
  var cs = getComputedStyle(document.documentElement);
  var CG = cs.getPropertyValue('--green').trim() || '#1a4a8a';
  var CA = cs.getPropertyValue('--gold').trim()  || '#c9a84c';
  var CT = cs.getPropertyValue('--text2').trim() || '#4a4640';
  var C3 = cs.getPropertyValue('--text3').trim() || '#7a7468';
  var CB = cs.getPropertyValue('--border').trim()|| '#ddd8cc';
  var v = brVals();
  ctx.clearRect(0, 0, W, H);
  ctx.textAlign = 'left';
  ctx.fillStyle = CT; ctx.font = '600 13px IBM Plex Sans, sans-serif';
  ctx.fillText(S('Servicios básicos disponibles','Basic services available'), 12, 20);
  var top = 34, base = H - 44, span = base - top;
  ctx.strokeStyle = CB; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(10, base + 0.5); ctx.lineTo(W - 10, base + 0.5); ctx.stroke();
  var bw = Math.min(80, (W - 60) / 3);
  var xA = W * 0.28 - bw / 2, xB = W * 0.72 - bw / 2;
  var hA = span * (v.a / 100), hB = span * (v.b / 100);
  ctx.fillStyle = CG; ctx.fillRect(xA, base - hA, bw, hA);
  ctx.fillStyle = CA; ctx.fillRect(xB, base - hB, bw, hB);
  var gapTop = Math.min(base - hA, base - hB), gapBot = Math.max(base - hA, base - hB);
  if (gapBot - gapTop > 3) {
    var gx = W * 0.5;
    ctx.strokeStyle = C3; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(gx, gapTop); ctx.lineTo(gx, gapBot); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(gx - 5, gapTop); ctx.lineTo(gx + 5, gapTop); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(gx - 5, gapBot); ctx.lineTo(gx + 5, gapBot); ctx.stroke();
    ctx.fillStyle = C3; ctx.font = '10px IBM Plex Sans, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(S('brecha','gap'), gx, gapTop - 5);
  }
  ctx.textAlign = 'center';
  ctx.font = '10px IBM Plex Sans, sans-serif';
  function wrapLabel(txt, cx, y){
    var words = txt.split(' '), line = '', out = [];
    words.forEach(function(w){
      var test = line ? line + ' ' + w : w;
      if (ctx.measureText(test).width > bw + 46 && line) { out.push(line); line = w; }
      else line = test;
    });
    if (line) out.push(line);
    out.slice(0, 3).forEach(function(ln, li){ ctx.fillText(ln, cx, y + li * 11); });
  }
  ctx.fillStyle = CT;
  wrapLabel(BR.pr.a[LANG], xA + bw / 2, base + 14);
  wrapLabel(BR.pr.b[LANG], xB + bw / 2, base + 14);
}
function brMsgUpd(){
  var el = document.getElementById('brMsg');
  if (!el || !BR) return;
  var v = brVals(), g = v.gap, msg, cl = '';
  var band = Math.abs(g) > 25 ? S('amplia','wide') : (Math.abs(g) > 6 ? S('moderada','moderate') : S('mínima','minimal'));
  if (g > 6) {
    msg = S('La que tiene menos servicios sigue muy por debajo. Desliza el control hacia la derecha para llevarle más presupuesto.',
            'The one with fewer services is still well below. Slide the control to the right to send it more budget.');
    cl = ' warn';
  } else if (g < -6) {
    msg = S('Te pasaste: ahora la otra quedó atrás y la brecha se abrió del lado contrario. Regresa un poco hacia la izquierda.',
            'You went too far: now the other one fell behind and the gap opened on the opposite side. Come back a little to the left.');
    cl = ' warn';
  } else {
    BR.reached = true;
    msg = S('Las dos barras quedaron casi parejas. Fíjate dónde ocurrió: no fue repartiendo mitad y mitad, sino dando más a la que partía con menos.',
            'The two bars ended up almost even. Notice where that happened: not by splitting it in half, but by giving more to the one that started with less.');
    cl = ' ok';
  }
  el.innerHTML = '<div class="wmsg' + cl + '">' + msg + '</div>' +
    '<div class="wprog">' + S('Brecha actual: ','Current gap: ') + band + '</div>';
}
function brIn(){
  if (!BR) return;
  var sl = document.getElementById('brSl');
  if (sl) BR.p = parseInt(sl.value, 10);
  var lv = document.getElementById('brVal');
  if (lv) lv.textContent = BR.p + '%';
  brDraw(); brMsgUpd();
}

/* ================================================
   WIDGET 5 - CONSTRUCTOR DE UNA RESPUESTA JUSTA

                 en:'Enrollment in the secondary school is free and open to any student in the municipality.' },

            why:{ es:'Esa es la medida que compensa la desventaja. Va en el tercer espacio.', en:'That is the measure that offsets the disadvantage. It goes in the third slot.' } },
      dist:[
        { t:{ es:'Se publica en la entrada la lista de quienes llegan tarde cada semana.', en:'A list of who arrives late each week is posted at the entrance.' },
          why:{ es:'Eso señala a quien ya está en desventaja y no quita el obstáculo. No ocupa ningún espacio.', en:'That singles out whoever is already at a disadvantage and removes no obstacle. It fills no slot.' } },
        { t:{ es:'Se recomienda a cada familia conseguir por su cuenta una bicicleta.', en:'Each family is advised to get hold of a bicycle on its own.' },
          why:{ es:'Trasladar el costo a las familias con menos recursos mantiene la desventaja. No ocupa ningún espacio.', en:'Shifting the cost to the families with fewest resources keeps the disadvantage. It fills no slot.' } },
        { t:{ es:'Se pide a quienes caminan que justifiquen su retraso por escrito.', en:'Those who walk are asked to justify their delay in writing.' },
          why:{ es:'Eso agrega un trámite al problema en lugar de resolverlo. No ocupa ningún espacio.', en:'That adds paperwork to the problem instead of solving it. It fills no slot.' } } ],
      exp:{ es:'La regla abierta y la medida de transporte no compiten: la primera declara la igualdad y la segunda la vuelve efectiva para quien parte en desventaja.',
            en:'The open rule and the transport measure do not compete: the first declares equality and the second makes it effective for whoever starts at a disadvantage.' } },
    { ctx:{ es:'En una escuela, varias tareas se piden en línea. En la parte alta de la colonia no llega la señal de internet.',
            en:'At one school, several assignments are requested online. In the upper part of the neighborhood there is no internet signal.' },
      dis:{ t:{ es:'Varias familias de la parte alta no tienen conexión a internet ni computadora en casa.',
                en:'Several families in the upper part have no internet connection and no computer at home.' },
            why:{ es:'Esa es la desventaja de partida. Colócala en el primer espacio.', en:'That is the starting disadvantage. Place it in the first slot.' } },
      form:{ t:{ es:'El reglamento indica que todos los grupos entregan las mismas tareas en las mismas fechas.',
                 en:'The rules state that all groups hand in the same assignments on the same dates.' },
             why:{ es:'Esa es la regla que trata a todas las personas igual. Va en el segundo espacio.', en:'That is the rule that treats everyone the same. It goes in the second slot.' } },
      sub:{ t:{ es:'La escuela abre la sala de cómputo por las tardes y recibe las tareas también en papel.',
                en:'The school opens the computer room in the afternoons and also accepts assignments on paper.' },
            why:{ es:'Esa es la medida que compensa la desventaja. Va en el tercer espacio.', en:'That is the measure that offsets the disadvantage. It goes in the third slot.' } },
      dist:[
        { t:{ es:'Se descuenta un punto a quien entregue fuera de la plataforma en línea.', en:'One point is deducted from anyone who hands in outside the online platform.' },
          why:{ es:'Castigar la falta de conexión profundiza la desventaja. No ocupa ningún espacio.', en:'Punishing the lack of a connection deepens the disadvantage. It fills no slot.' } },
        { t:{ es:'Se sugiere a esas familias contratar un plan de datos más grande.', en:'Those families are advised to buy a larger data plan.' },
          why:{ es:'Pedir un gasto extra a quien tiene menos no elimina el obstáculo. No ocupa ningún espacio.', en:'Asking for extra spending from those who have less does not remove the obstacle. It fills no slot.' } },
        { t:{ es:'Se recuerda en el salón que entregar a tiempo depende de la organización de cada quien.', en:'The class is reminded that handing in on time depends on how each person organizes.' },
          why:{ es:'El obstáculo no es de organización, es de acceso. No ocupa ningún espacio.', en:'The obstacle is not about organization, it is about access. It fills no slot.' } } ],

  var st = pick(sets, rng);
  var frs = [ { t:st.dis.t, why:st.dis.why, k:0 }, { t:st.form.t, why:st.form.why, k:1 }, { t:st.sub.t, why:st.sub.why, k:2 } ];
  st.dist.forEach(function(d){ frs.push({ t:d.t, why:d.why, k:-1 }); });
  MED = { st:st, frags:shuffle(frs, rng), filled:[null,null,null], i:0, tries:0, used:[], missIdx:-1, last:null, state:'play' };

      '<div class="wgt-h">' + S('Constructor de una respuesta justa','Building a fair response') + '</div>' +
      '<div class="wgt-q">' + S('Coloca las piezas en orden. Algunas no van en ningún espacio.','Place the pieces in order. Some do not belong in any slot.') + '</div>' +

function medLabels(){
  return [
    S('La desventaja de partida','The starting disadvantage'),
    S('La regla que trata igual a todas las personas','The rule that treats everyone the same'),
    S('La medida que compensa la desventaja','The measure that offsets the disadvantage')
  ];
}
function medRender(){
  if (!MED) return;
  var box = document.getElementById('medBox');
  if (!box) return;
  var labels = medLabels();
  var slots = labels.map(function(l, k){
    var f = MED.filled[k];
    return '<div class="slot' + (f ? ' filled' : '') + '">' +
             '<span class="slotlbl">' + l + '</span>' +
             '<span>' + (f ? f : S('vacío','empty')) + '</span>' +
           '</div>';
  }).join('');
  var frags = MED.frags.map(function(f, i){
    var cls = 'frag' + (MED.used.indexOf(i) >= 0 ? ' used' : '') + (MED.missIdx === i ? ' miss' : '');
    return '<div class="' + cls + '" onclick="medTap(' + i + ')">' + f.t[LANG] + '</div>';
  }).join('');
  var msg, cl = '';
  if (MED.state === 'done') { msg = S('Respuesta completa. ','Response complete. ') + MED.st.exp[LANG]; cl = ' ok'; }
  else if (MED.last) { msg = MED.last; cl = ' warn'; }
  else { msg = S('Empieza por nombrar la desventaja. Después la regla general, y al final la medida que la compensa.',
                 'Start by naming the disadvantage. Then the general rule, and last the measure that offsets it.'); }
  var btns = '';
  if (MED.i > 0) btns += '<button class="wbtn" onclick="medUndo()">' + S('Quitar la última','Remove the last one') + '</button>';
  if (MED.i > 0) btns += '<button class="wbtn" onclick="medReset()">' + S('Empezar de nuevo','Start over') + '</button>';
  box.innerHTML =
    '<div class="wcase">' + MED.st.ctx[LANG] + '</div>' +
    '<div class="slotgrid">' + slots + '</div>' +
    '<div class="fraglist">' + frags + '</div>' +
    '<div class="wmsg' + cl + '">' + msg + '</div>' +
    '<div class="wrow">' + btns + '</div>' +
    '<div class="wprog">' + S('Espacios llenos: ','Slots filled: ') + MED.i + ' / 3</div>';
}
function medTap(i){
  if (!MED || MED.state !== 'play') return;
  if (MED.used.indexOf(i) >= 0) return;
  var f = MED.frags[i];
  if (f.k === MED.i) {
    MED.filled[MED.i] = f.t[LANG];
    MED.used.push(i); MED.i++; MED.tries = 0; MED.missIdx = -1; MED.last = null;
    if (MED.i >= 3) MED.state = 'done';
    medRender(); return;
  }
  MED.tries++; MED.missIdx = i; MED.last = f.why[LANG];
  if (MED.tries >= 3) {
    var j, gi = -1;
    for (j = 0; j < MED.frags.length; j++) if (MED.frags[j].k === MED.i && MED.used.indexOf(j) < 0) gi = j;
    if (gi >= 0) {
      MED.filled[MED.i] = MED.frags[gi].t[LANG];
      MED.used.push(gi); MED.i++; MED.tries = 0; MED.missIdx = -1;
      MED.last = S('Esta era la pieza que iba en ese espacio. Observa por qué encaja ahí.',
                   'This was the piece that went in that slot. Notice why it fits there.');
      if (MED.i >= 3) MED.state = 'done';
    }
  }
  medRender();
}
function medUndo(){
  if (!MED || MED.i === 0) return;
  MED.i--; MED.filled[MED.i] = null; MED.used.pop();
  MED.tries = 0; MED.missIdx = -1; MED.last = null; MED.state = 'play';
  medRender();
}
function medReset(){
  if (!MED) return;
  MED.filled = [null,null,null]; MED.i = 0; MED.tries = 0; MED.used = [];
  MED.missIdx = -1; MED.last = null; MED.state = 'play';
  medRender();
}
