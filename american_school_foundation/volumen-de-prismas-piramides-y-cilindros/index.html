<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Volumen de Prismas, Pirámides y Cilindros</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }

/* ── MANIPULATIVES ── */
.mwrap { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.1rem; }
.mcv { display:block; width:100%; height:250px; touch-action:none; background:var(--surface); border:1px solid var(--border); border-radius:8px; }
.mhead { display:flex; justify-content:space-between; align-items:baseline; gap:.6rem; flex-wrap:wrap; margin-bottom:.45rem; }
.mtitle { font-weight:600; font-size:.95rem; }
.mround { font-family:'IBM Plex Mono',monospace; font-size:.68rem; letter-spacing:.09em; text-transform:uppercase; color:var(--gold); font-weight:600; }
.mtask { font-size:.85rem; color:var(--text2); margin-bottom:.6rem; }
.mrow { display:flex; flex-wrap:wrap; gap:.45rem; align-items:center; margin-top:.6rem; }
.mlab { font-size:.72rem; text-transform:uppercase; letter-spacing:.05em; color:var(--text3); min-width:78px; }
.mbtn { background:var(--surface2); border:1.5px solid var(--border); border-radius:8px; padding:.5rem .85rem; font-size:.82rem; cursor:pointer; color:var(--text2); font-family:inherit; min-height:44px; min-width:44px; transition:all .14s; }
.mbtn:hover { border-color:var(--green); color:var(--green); }
.mbtn.go { background:var(--green); color:#fff; border-color:var(--green); }
.mbtn.go:hover { background:var(--green-dark); color:#fff; }
.mbtn.on { background:var(--gold-bg); border-color:var(--gold); color:var(--text); }
.mval { font-family:'IBM Plex Mono',monospace; font-weight:600; color:var(--green); min-width:34px; text-align:center; font-size:1rem; }
.mfb { margin-top:.7rem; padding:.6rem .85rem; border-radius:8px; font-size:.84rem; background:var(--surface2); color:var(--text2); border-left:3px solid var(--border); }
.mfb.good { background:var(--ok-bg); color:var(--ok); border-left-color:var(--ok); }
.mfb.near { background:var(--gold-bg); color:var(--text2); border-left-color:var(--gold); }
.mstat { display:grid; grid-template-columns:repeat(3,1fr); gap:.5rem; margin-top:.7rem; }
.mtile { background:var(--surface2); border-radius:8px; padding:.55rem .35rem; text-align:center; border:1.5px solid var(--border); }
.mtile.hit { border-color:var(--ok); background:var(--ok-bg); }
.mtile .tl { font-size:.62rem; text-transform:uppercase; letter-spacing:.05em; color:var(--text3); }
.mtile .tv { font-family:'IBM Plex Mono',monospace; font-size:.9rem; font-weight:600; color:var(--text); }
.mnote { font-size:.76rem; color:var(--text3); margin-top:.5rem; }
.mhide { display:none; }
.mslide { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-top:.7rem; }
.mslide label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.mslide input[type=range] { width:100%; accent-color:var(--green); height:28px; }
.mchips { display:flex; flex-wrap:wrap; gap:.5rem; margin-top:.7rem; }
.mchip { border:1.5px solid var(--border); border-radius:8px; padding:.55rem .8rem; font-size:.82rem; cursor:pointer; background:var(--surface2); color:var(--text2); min-height:44px; display:flex; align-items:center; }
.mchip.sel { border-color:var(--gold); background:var(--gold-bg); color:var(--text); font-weight:600; }
@media (max-width:600px){
  .mstat { grid-template-columns:1fr 1fr; }
  .mslide { grid-template-columns:1fr; }
  .mcv { height:215px; }
  .mbtn { font-size:.78rem; padding:.45rem .6rem; }
  .mlab { min-width:100%; }
}
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Volumen de Prismas, Pirámides y Cilindros</div>
    <div class="wcourse" id="wcourse-el">Matemáticas · 3° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>

function setLang(l){
  LANG = l;
  try { localStorage.setItem(LANG_KEY, l); } catch(e){}

    document.getElementById('lessonBody').innerHTML = '';
    var res = document.getElementById('s_results'); res.style.display='none'; res.classList.remove('vis');
    buildLesson(seededRng(studentData.name + studentData.group + currentAttempt(studentData.name, studentData.group)));
    var obs = new IntersectionObserver(function(entries){ entries.forEach(function(e){ if(e.isIntersecting) e.target.classList.add('vis'); }); }, { threshold:0.05 });
    document.querySelectorAll('.section').forEach(function(s){ obs.observe(s); });

/* ── Attempt counter + seed (Rule 4): seed = name+group+attempt ── */
function getAttemptKey(name, group){ return 'mat3_t06_g01__att__' + (name+'__'+group).replace(/\s+/g,'_'); }
function nextAttempt(name, group){ var k=getAttemptKey(name,group),n=0; try{n=parseInt(localStorage.getItem(k)||'0',10)||0;}catch(e){} n++; try{localStorage.setItem(k,String(n));}catch(e){} return n; }
function currentAttempt(name, group){ var k=getAttemptKey(name,group); try{return parseInt(localStorage.getItem(k)||'1',10)||1;}catch(e){return 1;} }
/* ================================================
   STATE
   ================================================ */
var studentData   = {};
var problems      = [];

/* ================================================
   SESSION PERSISTENCE  (localStorage)
   ================================================ */
function lsKey() {
  var n = (studentData.name  || '').trim();
  var g = (studentData.group || '').trim();
  return 'mat3_t06_g01__' + (n + '__' + g).replace(/\s+/g, '_');
}

function saveSession() {
  if (!studentData.name) return;
  var drawings = [], texts = [], photos = [];
  problems.forEach(function(p, i) {
    var dc = document.getElementById('dc' + i);
    if (dc && dc.width) {
      var blank = document.createElement('canvas');
      blank.width = dc.width; blank.height = dc.height;
      drawings.push(dc.toDataURL() === blank.toDataURL() ? null : dc.toDataURL('image/png'));
    } else { drawings.push(null); }
    var ta = document.getElementById('ta' + i);
    texts.push(ta ? ta.value : '');
    var pp = document.getElementById('pp' + i);
    photos.push((pp && pp.src && pp.src.indexOf('data:') === 0) ? pp.src : null);
  });
  var state = {
    name: studentData.name, group: studentData.group,
    answeredCount: answeredCount, correctCount: correctCount,
    choices: problems.map(function(p) { return p.studentChoice; }),
    drawings: drawings, texts: texts, photos: photos
  };
  try { localStorage.setItem(lsKey(), JSON.stringify(state)); } catch(e) {}
}

function loadSession(name, group) {
  var key = 'mat3_t06_g01__' + (name + '__' + group).replace(/\s+/g, '_');
  try { var r = localStorage.getItem(key); return r ? JSON.parse(r) : null; } catch(e) { return null; }
}

function restoreSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  var saved = loadSession(name, group);
  if (!saved) return;

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

    doc.text(t('pdf-problem')+' '+(i+1)+': '+pdfText(prob.title), M+12, sy+6.5);
    doc.setTextColor(ok?26:176, ok?106:48, ok?74:16);
    doc.text(ok?t('pdf-ok'):t('pdf-bad'), PW-M-24, sy+6.5);
    sy += 12;
  });

  // ── Per-problem pages ──
  for (var i = 0; i < problems.length; i++) {
    var prob = problems[i];
    doc.addPage();
    var wy = 0;

    doc.setFillColor(pBR,pBG,pBB); doc.rect(0,0,PW,20,'F');
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,3,'F');
    doc.setTextColor(pAR,pAG,pAB); doc.setFontSize(7); doc.setFont('helvetica','normal');
    doc.text(t('wcourse')+'  ·  '+t('wtitle'), M, 10);
    doc.setTextColor(232,238,247); doc.setFontSize(10.5); doc.setFont('helvetica','bold');
    doc.text(t('pdf-problem')+' '+(i+1)+' '+t('pdf-of')+' '+total+'  ·  '+pdfText(prob.title), M, 17);
    wy = 25;

    var qRaw = pdfText(prob.questionText);
    doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var qLines = doc.splitTextToSize(qRaw, TW-10);
    var qBoxH  = 8 + qLines.length*5 + 3;
    doc.setFillColor(237,240,245); doc.roundedRect(M,wy,TW,qBoxH,2,2,'F');
    doc.setTextColor(pBR,pBG,pBB); doc.setFontSize(6.5); doc.setFont('helvetica','bold');
    doc.text(t('pdf-question'), M+4, wy+6);
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var qy = wy+12;
    qLines.forEach(function(ln,li){ doc.text(ln, M+4, qy+li*5); });
    wy += qBoxH + 4;

    var isOk   = document.getElementById('pc'+i).classList.contains('ok');
    var chosen = prob.studentChoice != null ? pdfText(prob.options[prob.studentChoice]||'-') : '-';
    var corr   = pdfText(prob.options[prob.correctIdx]||'');
    var expRaw = pdfText(prob.explanation||'');
    doc.setFontSize(8.5); var chLines = doc.splitTextToSize(t('pdf-chosen')+' '+chosen, TW-18);
    doc.setFontSize(8);   var coLines = doc.splitTextToSize(t('pdf-key')+' '+corr, TW-18);
    doc.setFontSize(7.5); var exLines = doc.splitTextToSize(t('pdf-sol')+' '+expRaw, TW-18).slice(0,4);
    var ansBoxH = 8 + chLines.length*5.5 + coLines.length*5 + exLines.length*5 + 6;
    doc.setFillColor(isOk?232:255, isOk?240:232, isOk?232:228);
    doc.roundedRect(M,wy,TW,ansBoxH,2,2,'F');
    doc.setFillColor(isOk?26:176, isOk?106:48, isOk?74:16);
    doc.circle(M+7, wy+8, 3.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(9); doc.setFont('helvetica','bold');
    doc.text(isOk?'✓':'✗', M+5.2, wy+10.5);
    var ay = wy+7;
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','bold');
    chLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5.5); });
    ay += chLines.length*5.5 + 3;
    doc.setTextColor(26,106,74); doc.setFontSize(8); doc.setFont('helvetica','normal');
    coLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    ay += coLines.length*5 + 3;
    doc.setTextColor(90,85,80); doc.setFontSize(7.5);
    exLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    wy += ansBoxH + 5;

    doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
    doc.setFontSize(7); doc.setFont('helvetica','bold');
    doc.rect(M,wy,TW,8,'F'); doc.text(t('pdf-work'), M+4, wy+5.5);
    wy += 11;

    var dc = document.getElementById('dc'+i);
    if (dc) {
      try {
        var imgD = dc.toDataURL('image/png');
        var ar   = dc.height / dc.width;
        var iw   = TW;
        var ih   = Math.min(iw * ar, 68);
        doc.addImage(imgD, 'PNG', M, wy, iw, ih);
        wy += ih + 4;
      } catch(e) {}
    }

    var ta = document.getElementById('ta'+i);
    if (ta && ta.value.trim()) {
      if (wy > PH-30) { doc.addPage(); wy = 20; }
      doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('courier','normal');
      var taLines = doc.splitTextToSize(ta.value, TW);
      taLines.slice(0,16).forEach(function(ln) {
        if (wy > PH-15) { doc.addPage(); wy = 20; }
        doc.text(ln, M, wy); wy += 5;
      });
      wy += 2;
    }

    var pp = document.getElementById('pp'+i);
    if (pp && pp.src && pp.src.indexOf('data:') === 0) {
      if (wy > PH-55) { doc.addPage(); wy = 20; }
      try { doc.addImage(pp.src, 'JPEG', M, wy, TW, 68); wy += 72; } catch(e) {}
    }
  }

  // ── Footer on every page ──
  var pages = doc.internal.getNumberOfPages();
  for (var p = 1; p <= pages; p++) {
    doc.setPage(p);
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0, PH-3, PW, 3, 'F');
    doc.setTextColor(130,140,160); doc.setFontSize(6.5); doc.setFont('helvetica','normal');
    doc.text(name+'  ·  '+group+'  ·  '+t('pdf-code')+': '+code+'  ·  '+t('pdf-page')+' '+p+'/'+pages,
      PW/2, PH-5, {align:'center'});
  }

  doc.save('mat3_t06_g01_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf');
  btn.innerHTML = '\u2b07 ' + t('btn-pdf');
  btn.disabled  = false;
}

var PIV = 3.1416;
function L(es, en){ return LANG === 'en' ? en : es; }
function cssv(n){ try { return getComputedStyle(document.documentElement).getPropertyValue(n).trim() || '#888'; } catch(e){ return '#888'; } }
function nv(v){ var r = Math.round(v * 100) / 100; return (Math.abs(r - Math.round(r)) < 1e-9) ? String(Math.round(r)) : r.toFixed(2); }
function frac(n, d){ return '<span class="mf-outer"><span class="mf-num">' + n + '</span><span class="mf-den">' + d + '</span></span>'; }
function setTxt(id, v){ var e = document.getElementById(id); if (e) e.textContent = v; }
function setFb(id, msg, cls){ var e = document.getElementById(id); if (!e) return; e.innerHTML = msg; e.className = 'mfb' + (cls ? ' ' + cls : ''); }
function showEl(id, on){ var e = document.getElementById(id); if (e) e.classList.toggle('mhide', !on); }
function addSection(html){
  var d = document.createElement('div');
  d.className = 'section';
  d.innerHTML = html;
  document.getElementById('lessonBody').appendChild(d);
  return d;
}
function addWidget(kind, html){

function shuffleOpts(opts, correct, rng){
  var a = opts.slice();
  for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(rng() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
  return { options: a, correctIdx: a.indexOf(correct) };
}
function pushProb(spec, rng){
  var s = shuffleOpts(spec.options, spec.correct, rng);
  var prob = {
    title: spec.title, questionText: spec.questionText, fn: spec.fn || '',
    hint: spec.hint || '', explanation: spec.explanation || '',
    options: s.options, correctIdx: s.correctIdx, showWork: !!spec.showWork,
    studentChoice: null, pendingChoice: null
  };
  problems.push(prob);
  buildOneCard(prob, problems.length - 1);
}
function cvFit(id){
  var cv = document.getElementById(id);
  if (!cv) return null;
  var dpr = window.devicePixelRatio || 1;
  var r = cv.getBoundingClientRect();
  var w = Math.max(240, Math.round(r.width));
  var h = Math.max(180, Math.round(r.height));
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  var ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  return { ctx: ctx, w: w, h: h };
}
function cvLabel(ctx, txt, x, y, col, align){
  ctx.save();
  ctx.fillStyle = col; ctx.textAlign = align || 'left'; ctx.textBaseline = 'middle';
  ctx.font = '500 11px "IBM Plex Sans", sans-serif';
  ctx.fillText(txt, x, y); ctx.restore();
}

var W1 = null, W2 = null, W3 = null, W4 = null;

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVE 1 : MESA DE CAPAS
   The student builds a stack of unit cubes to hit an exact cube count by
   changing the base (width, depth) and the number of layers. Live count and
   directional feedback ("te faltan 8 cubos"). Three rounds, reveal on 3rd miss.
   ══════════════════════════════════════════════════════════════════════════ */
function w1Build(rng){
  var rounds = [];
  for (var i = 0; i < 3; i++){
    var ta = 2 + Math.floor(rng() * 3), tb = 2 + Math.floor(rng() * 3), th = 2 + Math.floor(rng() * 4);
    rounds.push({ a: ta, b: tb, h: th, target: ta * tb * th });
  }
  W1 = { rounds: rounds, round: 0, tries: 0, done: false, a: 1, b: 1, h: 1 };
}
function w1Cur(){ return W1.rounds[W1.round]; }
function w1Html(){
  function ctl(lbl, key, id){
    return '<div class="mrow"><span class="mlab">' + lbl + '</span>' +
      '<button class="mbtn" onclick="w1Adj(\'' + key + '\',-1)">−</button>' +
      '<span class="mval" id="' + id + '">1</span>' +
      '<button class="mbtn" onclick="w1Adj(\'' + key + '\',1)">+</button></div>';
  }
  return '<div class="mhead"><div class="mtitle">' + L('Mesa de capas', 'Layer table') + '</div>' +
      '<div class="mround" id="w1r"></div></div>' +
    '<div class="mtask" id="w1task"></div>' +
    '<canvas class="mcv" id="w1cv"></canvas>' +
    ctl(L('Ancho', 'Width'), 'a', 'w1a') +
    ctl(L('Fondo', 'Depth'), 'b', 'w1b') +
    ctl(L('Capas', 'Layers'), 'h', 'w1h') +
    '<div class="mstat">' +
      '<div class="mtile" id="w1t1"><div class="tl">' + L('Cubos por capa', 'Cubes per layer') + '</div><div class="tv" id="w1v1">1</div></div>' +
      '<div class="mtile" id="w1t2"><div class="tl">' + L('Capas', 'Layers') + '</div><div class="tv" id="w1v2">1</div></div>' +
      '<div class="mtile" id="w1t3"><div class="tl">' + L('Cubos en total', 'Cubes in total') + '</div><div class="tv" id="w1v3">1</div></div>' +
    '</div>' +
    '<div class="mrow"><button class="mbtn go" onclick="w1Check()">' + L('Comprobar', 'Check') + '</button>' +
      '<button class="mbtn" onclick="w1Reset()">' + L('Deshacer todo', 'Undo all') + '</button></div>' +
    '<div class="mfb" id="w1fb"></div>';
}
function w1Init(){ if (!W1) return; w1Round(); }
function w1Round(){
  if (!W1) return;
  var c = w1Cur();
  setTxt('w1r', L('Reto ', 'Task ') + (W1.round + 1) + L(' de ', ' of ') + W1.rounds.length);
  setTxt('w1task', L('Arma un montón que tenga exactamente ' + c.target + ' cubos. Cambia la base y el número de capas hasta lograrlo.',
                     'Build a pile holding exactly ' + c.target + ' cubes. Change the base and the number of layers until you get there.'));
  W1.a = 1; W1.b = 1; W1.h = 1; W1.tries = 0;
  w1Update();
}
function w1Adj(k, d){
  if (!W1 || W1.done) return;
  W1[k] = Math.max(1, Math.min(6, W1[k] + d));
  w1Update();
}
function w1Reset(){ if (!W1 || W1.done) return; W1.a = 1; W1.b = 1; W1.h = 1; w1Update(); }
function w1Update(){
  if (!W1) return;
  var c = w1Cur(), tot = W1.a * W1.b * W1.h, d = tot - c.target;
  setTxt('w1a', W1.a); setTxt('w1b', W1.b); setTxt('w1h', W1.h);
  setTxt('w1v1', W1.a * W1.b); setTxt('w1v2', W1.h); setTxt('w1v3', tot);
  var t3 = document.getElementById('w1t3'); if (t3) t3.classList.toggle('hit', d === 0);
  if (d === 0) setFb('w1fb', L('El montón tiene justo ' + c.target + ' cubos. Comprueba para cerrar el reto.',
                               'The pile holds exactly ' + c.target + ' cubes. Check to close the task.'), 'near');
  else if (d < 0) setFb('w1fb', L('Te faltan ' + (-d) + ' cubos. Puedes ensanchar la base o apilar más capas.',
                                  'You are short by ' + (-d) + ' cubes. You can widen the base or stack more layers.'), '');
  else setFb('w1fb', L('Te sobran ' + d + ' cubos. Quita capas o haz la base más chica.',
                       'You are over by ' + d + ' cubes. Remove layers or make the base smaller.'), '');
  w1Draw();
}
function w1Check(){
  if (!W1 || W1.done) return;
  var c = w1Cur(), tot = W1.a * W1.b * W1.h;
  if (tot === c.target){
    setFb('w1fb', L('🎉 Justo. Una capa de ' + (W1.a * W1.b) + ' cubos repetida ' + W1.h + ' veces da ' + tot + ' cubos.',
                    '🎉 Spot on. A layer of ' + (W1.a * W1.b) + ' cubes repeated ' + W1.h + ' times gives ' + tot + ' cubes.'), 'good');
    setTimeout(w1Advance, 1200);
    return;
  }
  W1.tries++;
  if (W1.tries >= 3){
    W1.a = c.a; W1.b = c.b; W1.h = c.h;
    setTxt('w1a', W1.a); setTxt('w1b', W1.b); setTxt('w1h', W1.h);
    setTxt('w1v1', c.a * c.b); setTxt('w1v2', c.h); setTxt('w1v3', c.target);
    w1Draw();
    setFb('w1fb', L('Una salida: una base de ' + (c.a * c.b) + ' cubos repetida ' + c.h + ' veces llega a ' + c.target + '. Lo que cabe en una capa multiplicado por el número de capas da el total.',
                    'One way out: a base of ' + (c.a * c.b) + ' cubes repeated ' + c.h + ' times reaches ' + c.target + '. What fits in one layer multiplied by the number of layers gives the total.'), 'near');
    setTimeout(w1Advance, 2000);
    return;
  }
  var tot2 = tot;
  setFb('w1fb', tot2 < c.target
    ? L('Todavía no. Con ' + (W1.a * W1.b) + ' cubos por capa y ' + W1.h + ' capas llegas a ' + tot2 + '. Sube alguna de las dos cantidades.',
        'Not yet. With ' + (W1.a * W1.b) + ' cubes per layer and ' + W1.h + ' layers you reach ' + tot2 + '. Raise one of the two amounts.')
    : L('Todavía no. Con ' + (W1.a * W1.b) + ' cubos por capa y ' + W1.h + ' capas llegas a ' + tot2 + '. Baja alguna de las dos cantidades.',
        'Not yet. With ' + (W1.a * W1.b) + ' cubes per layer and ' + W1.h + ' layers you reach ' + tot2 + '. Lower one of the two amounts.'), '');
}
function w1Advance(){
  if (!W1) return;
  W1.round++;
  if (W1.round >= W1.rounds.length){
    W1.done = true;
    setTxt('w1r', L('Completado', 'Completed'));
    setTxt('w1task', L('Los tres montones quedaron listos. El total de cubos siempre salió de multiplicar una capa por el número de capas.',
                       'The three piles are finished. The total number of cubes always came from multiplying one layer by the number of layers.'));
    setFb('w1fb', L('🎉 Mesa de capas terminada.', '🎉 Layer table finished.'), 'good');
    return;
  }
  w1Round();
}
function w1Draw(){
  var g = cvFit('w1cv'); if (!g || !W1) return;
  var ctx = g.ctx, W = g.w, H = g.h;
  var a = W1.a, b = W1.b, h = W1.h;
  var cell = Math.min(34, (W - 70) / (a + b * 0.5), (H - 60) / (h + b * 0.34));
  if (cell < 9) cell = 9;
  var dx = cell * 0.5, dy = cell * 0.34;
  var tw = a * cell + b * dx, th = h * cell + b * dy;
  var x0 = (W - tw) / 2, y0 = (H - th) / 2 + b * dy;
  var gr = cssv('--green'), grb = cssv('--green-bg'), gd = cssv('--gold'), gdb = cssv('--gold-bg');
  var bd = cssv('--border'), s2 = cssv('--surface2'), t3 = cssv('--text3');
  var i, j, k;
  ctx.beginPath();
  ctx.moveTo(x0, y0); ctx.lineTo(x0 + a * cell, y0);
  ctx.lineTo(x0 + a * cell + b * dx, y0 - b * dy); ctx.lineTo(x0 + b * dx, y0 - b * dy); ctx.closePath();
  ctx.fillStyle = gdb; ctx.fill(); ctx.strokeStyle = gd; ctx.lineWidth = 1.6; ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x0 + a * cell, y0); ctx.lineTo(x0 + a * cell + b * dx, y0 - b * dy);
  ctx.lineTo(x0 + a * cell + b * dx, y0 - b * dy + h * cell); ctx.lineTo(x0 + a * cell, y0 + h * cell); ctx.closePath();
  ctx.fillStyle = s2; ctx.fill(); ctx.strokeStyle = bd; ctx.stroke();
  ctx.beginPath(); ctx.rect(x0, y0, a * cell, h * cell);
  ctx.fillStyle = grb; ctx.fill(); ctx.strokeStyle = gr; ctx.lineWidth = 1.8; ctx.stroke();
  ctx.lineWidth = 0.9; ctx.strokeStyle = gr;
  for (i = 1; i < a; i++){ ctx.beginPath(); ctx.moveTo(x0 + i * cell, y0); ctx.lineTo(x0 + i * cell, y0 + h * cell); ctx.stroke(); }
  for (j = 1; j < h; j++){ ctx.beginPath(); ctx.moveTo(x0, y0 + j * cell); ctx.lineTo(x0 + a * cell, y0 + j * cell); ctx.stroke(); }
  ctx.strokeStyle = gd;
  for (i = 1; i < a; i++){ ctx.beginPath(); ctx.moveTo(x0 + i * cell, y0); ctx.lineTo(x0 + i * cell + b * dx, y0 - b * dy); ctx.stroke(); }
  for (k = 1; k < b; k++){ ctx.beginPath(); ctx.moveTo(x0 + k * dx, y0 - k * dy); ctx.lineTo(x0 + a * cell + k * dx, y0 - k * dy); ctx.stroke(); }
  ctx.strokeStyle = bd;
  for (k = 1; k < b; k++){ ctx.beginPath(); ctx.moveTo(x0 + a * cell + k * dx, y0 - k * dy); ctx.lineTo(x0 + a * cell + k * dx, y0 - k * dy + h * cell); ctx.stroke(); }
  for (j = 1; j < h; j++){ ctx.beginPath(); ctx.moveTo(x0 + a * cell, y0 + j * cell); ctx.lineTo(x0 + a * cell + b * dx, y0 - b * dy + j * cell); ctx.stroke(); }
  cvLabel(ctx, L('una capa: ', 'one layer: ') + (a * b) + L(' cubos', ' cubes'), 10, 16, t3);
  cvLabel(ctx, L('capas apiladas: ', 'stacked layers: ') + h, 10, 32, t3);
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVE 2 : TORNO DEL CILINDRO
   Two sliders (radius, height) redraw a can in real time and update the base
   area and the volume. The student hunts a target volume; the feedback says by
   how much the can is short or over. Three rounds, reveal on the 3rd miss.
   ══════════════════════════════════════════════════════════════════════════ */
function w2Build(rng){
  var rs = [3, 4, 5, 6, 7], hs = [6, 8, 10, 12, 15];
  var rounds = [];
  for (var i = 0; i < 3; i++){
    var tr = rs[Math.floor(rng() * rs.length)], th = hs[Math.floor(rng() * hs.length)];
    rounds.push({ r: tr, h: th, target: PIV * tr * tr * th });
  }
  W2 = { rounds: rounds, round: 0, tries: 0, done: false, r: 2, h: 4 };
}
function w2Cur(){ return W2.rounds[W2.round]; }
function w2Vol(){ return PIV * W2.r * W2.r * W2.h; }
function w2Html(){
  return '<div class="mhead"><div class="mtitle">' + L('Torno de latas', 'Can lathe') + '</div>' +
      '<div class="mround" id="w2r"></div></div>' +
    '<div class="mtask" id="w2task"></div>' +
    '<canvas class="mcv" id="w2cv"></canvas>' +
    '<div class="mslide">' +
      '<div><label>' + L('Radio de la base', 'Base radius') + ': <span class="mval" id="w2rv">2</span> cm</label>' +
        '<input type="range" id="w2rs" min="1" max="12" step="1" value="2" oninput="w2Input()"></div>' +
      '<div><label>' + L('Altura', 'Height') + ': <span class="mval" id="w2hv">4</span> cm</label>' +
        '<input type="range" id="w2hs" min="1" max="20" step="1" value="4" oninput="w2Input()"></div>' +
    '</div>' +
    '<div class="mstat">' +
      '<div class="mtile"><div class="tl">' + L('Área de la base', 'Base area') + '</div><div class="tv" id="w2b">0</div></div>' +
      '<div class="mtile"><div class="tl">' + L('Altura', 'Height') + '</div><div class="tv" id="w2h">0</div></div>' +
      '<div class="mtile" id="w2t3"><div class="tl">' + L('Volumen', 'Volume') + '</div><div class="tv" id="w2v">0</div></div>' +
    '</div>' +
    '<div class="mrow"><button class="mbtn go" onclick="w2Check()">' + L('Comprobar', 'Check') + '</button></div>' +
    '<div class="mfb" id="w2fb"></div>';
}
function w2Init(){ if (!W2) return; w2Round(); }

function w2Check(){

function w2Draw(){

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVE 3 : LOS VACIADOS
   A pointed container (pyramid, then cone) is emptied into a straight one with
   the SAME base and the SAME height. The student predicts how many pourings
   fill it; the drawing shows the level rising, or the spill when it is too many.
   ══════════════════════════════════════════════════════════════════════════ */
function w3Build(rng){
  var order = rng() < 0.5 ? ['piramide', 'cono'] : ['cono', 'piramide'];
  W3 = { order: order, round: 0, tries: 0, pours: 0, done: false, locked: false };
}
function w3Kind(){ return W3.order[Math.min(W3.round, W3.order.length - 1)]; }
function w3Html(){
  var g = [2, 3, 4, 6];
  var btns = g.map(function(n){
    return '<button class="mbtn" onclick="w3Guess(' + n + ')">' + n + L(' vaciados', ' pourings') + '</button>';
  }).join('');
  return '<div class="mhead"><div class="mtitle">' + L('Los vaciados', 'The pourings') + '</div>' +
      '<div class="mround" id="w3r"></div></div>' +
    '<div class="mtask" id="w3task"></div>' +
    '<canvas class="mcv" id="w3cv"></canvas>' +
    '<div class="mrow">' + btns + '</div>' +
    '<div class="mrow"><button class="mbtn" onclick="w3Empty()">' + L('Vaciar el recipiente', 'Empty the container') + '</button></div>' +
    '<div class="mfb" id="w3fb"></div>';
}
function w3Init(){ if (!W3) return; w3Round(); }
function w3Round(){
  if (!W3) return;
  var k = w3Kind();
  setTxt('w3r', L('Reto ', 'Task ') + (W3.round + 1) + L(' de ', ' of ') + W3.order.length);
  setTxt('w3task', k === 'piramide'
    ? L('A la izquierda hay una pirámide llena de arena. A la derecha, un prisma con la misma base y la misma altura. ¿Cuántos vaciados de la pirámide llenan el prisma sin derramar?',
        'On the left there is a pyramid full of sand. On the right, a prism with the same base and the same height. How many pourings from the pyramid fill the prism without spilling?')
    : L('Ahora la arena sale de un cono, y del otro lado hay un cilindro con la misma base y la misma altura. ¿Cuántos vaciados del cono llenan el cilindro sin derramar?',
        'Now the sand comes out of a cone, and on the other side there is a cylinder with the same base and the same height. How many pourings from the cone fill the cylinder without spilling?'));
  W3.pours = 0; W3.tries = 0; W3.locked = false;
  setFb('w3fb', L('Elige cuántos vaciados crees que hacen falta y observa qué pasa con el nivel.',
                  'Choose how many pourings you think are needed and watch what happens to the level.'), '');
  w3Draw();
}
function w3Empty(){ if (!W3 || W3.done || W3.locked) return; W3.pours = 0; w3Draw(); }
function w3Guess(n){
  if (!W3 || W3.done || W3.locked) return;
  W3.pours = n;
  w3Draw();
  if (n === 3){
    W3.locked = true;
    setFb('w3fb', L('🎉 El recipiente queda lleno al ras con tres vaciados. Lo puntiagudo guarda una tercera parte de lo que guarda lo recto de la misma base y la misma altura.',
                    '🎉 The container is filled to the brim with three pourings. The pointed one holds a third of what the straight one of the same base and the same height holds.'), 'good');
    setTimeout(w3Advance, 1800);
    return;
  }
  W3.tries++;
  if (W3.tries >= 3){
    W3.locked = true;
    W3.pours = 3; w3Draw();
    setFb('w3fb', L('Mira el nivel: con tres vaciados llega justo al borde, ni antes ni después. Esa es la relación entre lo puntiagudo y lo recto cuando comparten base y altura.',
                    'Look at the level: with three pourings it reaches exactly the rim, neither before nor after. That is the relation between the pointed one and the straight one when they share base and height.'), 'near');
    setTimeout(w3Advance, 2400);
    return;
  }
  setFb('w3fb', n < 3
    ? L('Con ' + n + ' vaciados el nivel se queda abajo del borde y sigue cabiendo arena. Prueba con más.',
        'With ' + n + ' pourings the level stays below the rim and more sand still fits. Try more.')
    : L('Con ' + n + ' vaciados la arena se derrama por el borde: sobra material. Prueba con menos.',
        'With ' + n + ' pourings the sand spills over the rim: there is material left over. Try fewer.'), '');
}
function w3Advance(){
  if (!W3) return;
  W3.round++;
  if (W3.round >= W3.order.length){
    W3.done = true;
    setTxt('w3r', L('Completado', 'Completed'));
    setTxt('w3task', L('En los dos casos hicieron falta tres vaciados, con base cuadrada o con base redonda.',
                       'In both cases three pourings were needed, with a square base or with a round base.'));
    setFb('w3fb', L('🎉 Vaciados terminados.', '🎉 Pourings finished.'), 'good');
    w3Draw();

  }
  w3Round();
}
function w3Draw(){
  var g = cvFit('w3cv'); if (!g || !W3) return;
  var ctx = g.ctx, W = g.w, H = g.h;
  var k = w3Kind(), round = (k === 'cono');
  var gr = cssv('--green'), grb = cssv('--green-bg'), gd = cssv('--gold'), gdb = cssv('--gold-bg');
  var bd = cssv('--border'), t3 = cssv('--text3'), bad = cssv('--bad');
  var bw = Math.min(90, (W - 70) / 2.6), bh = Math.min(130, H - 78);
  var ry = round ? Math.max(5, bw * 0.22) : 0;
  var baseY = H - 34, topY = baseY - bh;
  var lx = W * 0.27, rx = W * 0.72;
  ctx.lineWidth = 1.8;
  ctx.beginPath();
  ctx.moveTo(lx - bw / 2, baseY); ctx.lineTo(lx, topY); ctx.lineTo(lx + bw / 2, baseY);
  if (round) ctx.ellipse(lx, baseY, bw / 2, ry, 0, 0, Math.PI, true); else ctx.closePath();
  ctx.closePath();
  ctx.fillStyle = gdb; ctx.fill(); ctx.strokeStyle = gd; ctx.stroke();
  if (round){ ctx.beginPath(); ctx.ellipse(lx, baseY, bw / 2, ry, 0, 0, 2 * Math.PI); ctx.strokeStyle = gd; ctx.stroke(); }
  var frac1 = Math.min(W3.pours, 3) / 3;
  var fillTop = baseY - bh * frac1;
  ctx.beginPath(); ctx.rect(rx - bw / 2, fillTop, bw, baseY - fillTop);
  ctx.fillStyle = grb; ctx.fill();
  if (round && frac1 > 0){ ctx.beginPath(); ctx.ellipse(rx, fillTop, bw / 2, ry, 0, 0, 2 * Math.PI); ctx.fillStyle = grb; ctx.fill(); ctx.strokeStyle = gr; ctx.lineWidth = 1.2; ctx.stroke(); }
  ctx.lineWidth = 1.8; ctx.strokeStyle = gr;
  ctx.beginPath();
  ctx.moveTo(rx - bw / 2, topY); ctx.lineTo(rx - bw / 2, baseY);
  ctx.lineTo(rx + bw / 2, baseY); ctx.lineTo(rx + bw / 2, topY);
  ctx.stroke();
  if (round){
    ctx.beginPath(); ctx.ellipse(rx, topY, bw / 2, ry, 0, 0, 2 * Math.PI); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(rx, baseY, bw / 2, ry, 0, 0, Math.PI); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.moveTo(rx - bw / 2, topY); ctx.lineTo(rx + bw / 2, topY); ctx.stroke();

  ctx.setLineDash([]);
  if (W3.pours > 3){
    ctx.beginPath();
    ctx.moveTo(rx - bw / 2, topY); ctx.lineTo(rx - bw / 2 - 14, topY + 22);
    ctx.moveTo(rx + bw / 2, topY); ctx.lineTo(rx + bw / 2 + 14, topY + 22);
    ctx.strokeStyle = bad; ctx.lineWidth = 2.4; ctx.stroke();
    cvLabel(ctx, L('se derrama', 'it spills'), rx, topY - 12, bad, 'center');
  }
  cvLabel(ctx, k === 'piramide' ? L('pirámide', 'pyramid') : L('cono', 'cone'), lx, baseY + 18, t3, 'center');
  cvLabel(ctx, k === 'piramide' ? L('prisma', 'prism') : L('cilindro', 'cylinder'), rx, baseY + 18, t3, 'center');
  cvLabel(ctx, L('vaciados: ', 'pourings: ') + W3.pours, 10, 16, t3);
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVE 4 : EL DESPIECE
   A composite solid is drawn; the student taps the pieces that rebuild it,
   choosing also whether each piece adds material or leaves a hollow.
   Reversible selection, directional feedback, reveal on the 3rd miss.
   ══════════════════════════════════════════════════════════════════════════ */
var W4PIECES = [
  { es: 'Prisma rectangular que se suma', en: 'Rectangular prism that adds up' },
  { es: 'Pirámide que se suma', en: 'Pyramid that adds up' },
  { es: 'Cilindro que se suma', en: 'Cylinder that adds up' },
  { es: 'Cilindro que se resta', en: 'Cylinder that is subtracted' },
  { es: 'Pirámide que se resta', en: 'Pyramid that is subtracted' }
];
function w4Build(rng){
  var figs = [
    { key: 'casa', need: [0, 1] },
    { key: 'perforada', need: [0, 3] },
    { key: 'silo', need: [0, 2] }
  ];
  for (var i = figs.length - 1; i > 0; i--){ var j = Math.floor(rng() * (i + 1)); var t = figs[i]; figs[i] = figs[j]; figs[j] = t; }
  W4 = { figs: figs, round: 0, tries: 0, sel: [], done: false, locked: false };
}
function w4Cur(){ return W4.figs[W4.round]; }
function w4Html(){
  return '<div class="mhead"><div class="mtitle">' + L('El despiece', 'The breakdown') + '</div>' +
      '<div class="mround" id="w4r"></div></div>' +
    '<div class="mtask" id="w4task"></div>' +
    '<canvas class="mcv" id="w4cv"></canvas>' +
    '<div class="mchips" id="w4chips"></div>' +
    '<div class="mrow"><button class="mbtn go" onclick="w4Check()">' + L('Comprobar', 'Check') + '</button>' +
      '<button class="mbtn" onclick="w4Clear()">' + L('Quitar todo', 'Remove all') + '</button></div>' +
    '<div class="mfb" id="w4fb"></div>';
}
function w4Init(){ if (!W4) return; w4Round(); }
function w4Round(){
  if (!W4) return;
  var f = w4Cur();
  setTxt('w4r', L('Reto ', 'Task ') + (W4.round + 1) + L(' de ', ' of ') + W4.figs.length);
  setTxt('w4task', L('Mira la pieza dibujada y elige las partes con las que se puede volver a armar. Sobran opciones.',
                     'Look at the drawn piece and choose the parts it can be rebuilt from. There are options left over.'));
  W4.sel = []; W4.tries = 0; W4.locked = false;
  setFb('w4fb', L('Toca una parte para ponerla y tócala otra vez para quitarla.', 'Tap a part to add it and tap it again to remove it.'), '');
  w4Chips(); w4Draw();
}
function w4Chips(){
  var box = document.getElementById('w4chips'); if (!box || !W4) return;
  box.innerHTML = W4PIECES.map(function(p, i){
    return '<div class="mchip' + (W4.sel.indexOf(i) >= 0 ? ' sel' : '') + '" onclick="w4Tap(' + i + ')">' + p[LANG === 'en' ? 'en' : 'es'] + '</div>';
  }).join('');
}
function w4Tap(i){
  if (!W4 || W4.done || W4.locked) return;
  var k = W4.sel.indexOf(i);
  if (k >= 0) W4.sel.splice(k, 1); else W4.sel.push(i);
  w4Chips();
  setFb('w4fb', L('Llevas ' + W4.sel.length + ' parte(s) puesta(s).', 'You have ' + W4.sel.length + ' part(s) in place.'), '');
}
function w4Clear(){ if (!W4 || W4.done || W4.locked) return; W4.sel = []; w4Chips(); setFb('w4fb', L('Mesa despejada.', 'Table cleared.'), ''); }
function w4Check(){
  if (!W4 || W4.done || W4.locked) return;
  var f = w4Cur();
  var missing = f.need.filter(function(n){ return W4.sel.indexOf(n) < 0; });
  var extra = W4.sel.filter(function(n){ return f.need.indexOf(n) < 0; });
  if (missing.length === 0 && extra.length === 0){
    W4.locked = true;
    setFb('w4fb', L('🎉 Así se arma. El volumen de la pieza sale de juntar los volúmenes de estas partes.',
                    '🎉 That is how it is built. The volume of the piece comes from putting together the volumes of these parts.'), 'good');
    setTimeout(w4Advance, 1500);
    return;
  }
  W4.tries++;
  if (W4.tries >= 3){
    W4.locked = true;
    W4.sel = f.need.slice(); w4Chips();
    setFb('w4fb', L('Estas son las partes. Recorre la pieza de abajo hacia arriba y fíjate si cada forma pone material o deja un hueco.',
                    'These are the parts. Go over the piece from bottom to top and notice whether each shape puts material in or leaves a hollow.'), 'near');
    setTimeout(w4Advance, 2400);
    return;
  }
  var msg;
  if (extra.length > 0 && (extra.indexOf(2) >= 0 && f.need.indexOf(3) >= 0 || extra.indexOf(3) >= 0 && f.need.indexOf(2) >= 0))
    msg = L('La forma que elegiste sí aparece, pero revisa si esa parte pone material o si deja un hueco por dentro.',
            'The shape you chose does appear, but check whether that part puts material in or leaves a hollow inside.');
  else if (missing.length > 0 && extra.length === 0)
    msg = L('Te falta una parte. Vuelve a mirar la pieza de abajo hacia arriba, sin saltarte nada.',
            'You are missing a part. Look at the piece again from bottom to top, without skipping anything.');
  else if (extra.length > 0 && missing.length === 0)
    msg = L('Sobra una parte. Quita la forma que no llegas a ver en el dibujo.',
            'There is a part left over. Remove the shape you cannot actually see in the drawing.');
  else
    msg = L('Todavía no. Una de las partes puestas no está en la pieza y falta otra que sí está.',
            'Not yet. One of the parts you placed is not in the piece and another one that is there is missing.');
  setFb('w4fb', msg, '');
}
function w4Advance(){
  if (!W4) return;
  W4.round++;
  if (W4.round >= W4.figs.length){
    W4.done = true;
    setTxt('w4r', L('Completado', 'Completed'));
    setTxt('w4task', L('Las tres piezas quedaron despiezadas. Una pieza compuesta se mide sumando lo que aporta cada parte y restando lo que se le quitó.',
                       'The three pieces are broken down. A composite piece is measured by adding what each part brings and subtracting what was taken away.'));
    setFb('w4fb', L('🎉 Despiece terminado.', '🎉 Breakdown finished.'), 'good');
    return;
  }
  w4Round();
}
function w4Draw(){
  var g = cvFit('w4cv'); if (!g || !W4) return;
  var ctx = g.ctx, W = g.w, H = g.h, f = w4Cur();
  var gr = cssv('--green'), grb = cssv('--green-bg'), gd = cssv('--gold'), gdb = cssv('--gold-bg');
  var bd = cssv('--border'), t3 = cssv('--text3');
  var cx = W / 2, baseY = H - 30;
  ctx.lineWidth = 1.9;
  if (f.key === 'casa'){
    var bw = Math.min(150, W - 90), bh = Math.min(78, H * 0.34), rh = Math.min(70, H * 0.3);
    var topY = baseY - bh;
    ctx.beginPath(); ctx.rect(cx - bw / 2, topY, bw, bh);
    ctx.fillStyle = grb; ctx.fill(); ctx.strokeStyle = gr; ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx - bw / 2, topY); ctx.lineTo(cx, topY - rh); ctx.lineTo(cx + bw / 2, topY); ctx.closePath();
    ctx.fillStyle = gdb; ctx.fill(); ctx.strokeStyle = gd; ctx.stroke();
    ctx.setLineDash([4, 4]); ctx.strokeStyle = bd; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(cx - bw / 2, topY); ctx.lineTo(cx - bw / 2 + 22, topY - 14);
    ctx.lineTo(cx + bw / 2 + 22, topY - 14); ctx.lineTo(cx + bw / 2, topY); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx, topY - rh); ctx.lineTo(cx + 22, topY - rh - 14); ctx.lineTo(cx + bw / 2 + 22, topY - 14); ctx.stroke();
    ctx.setLineDash([]);
    cvLabel(ctx, L('bodega con techo de punta', 'store with a pointed roof'), cx, baseY + 16, t3, 'center');
  } else if (f.key === 'perforada'){
    var pw = Math.min(160, W - 90), ph = Math.min(96, H * 0.44), ry = Math.max(6, pw * 0.09);
    var ty = baseY - ph;
    ctx.beginPath(); ctx.rect(cx - pw / 2, ty, pw, ph);
    ctx.fillStyle = grb; ctx.fill(); ctx.strokeStyle = gr; ctx.stroke();
    ctx.beginPath(); ctx.ellipse(cx, ty, pw * 0.18, ry, 0, 0, 2 * Math.PI);
    ctx.fillStyle = gdb; ctx.fill(); ctx.strokeStyle = gd; ctx.lineWidth = 1.6; ctx.stroke();
    ctx.setLineDash([5, 4]); ctx.strokeStyle = gd; ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(cx - pw * 0.18, ty); ctx.lineTo(cx - pw * 0.18, baseY);
    ctx.moveTo(cx + pw * 0.18, ty); ctx.lineTo(cx + pw * 0.18, baseY);
    ctx.stroke();
    ctx.beginPath(); ctx.ellipse(cx, baseY, pw * 0.18, ry, 0, 0, Math.PI); ctx.stroke();
    ctx.setLineDash([]);
    cvLabel(ctx, L('bloque agujerado de lado a lado', 'block drilled from side to side'), cx, baseY + 16, t3, 'center');
  } else {
    var sw = Math.min(150, W - 90), sh = Math.min(52, H * 0.24);
    var cw = sw * 0.56, ch = Math.min(80, H * 0.34), cry = Math.max(6, cw * 0.16);
    var by = baseY - sh, cty = by - ch;
    ctx.beginPath(); ctx.rect(cx - sw / 2, by, sw, sh);
    ctx.fillStyle = grb; ctx.fill(); ctx.strokeStyle = gr; ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx - cw / 2, cty); ctx.lineTo(cx - cw / 2, by);
    ctx.ellipse(cx, by, cw / 2, cry, 0, Math.PI, 0, true);
    ctx.lineTo(cx + cw / 2, cty);
    ctx.ellipse(cx, cty, cw / 2, cry, 0, 0, Math.PI, true);
    ctx.closePath();
    ctx.fillStyle = gdb; ctx.fill(); ctx.strokeStyle = gd; ctx.lineWidth = 1.7; ctx.stroke();
    ctx.beginPath(); ctx.ellipse(cx, cty, cw / 2, cry, 0, 0, 2 * Math.PI);
    ctx.fillStyle = gdb; ctx.fill(); ctx.strokeStyle = gd; ctx.stroke();
    cvLabel(ctx, L('silo sobre su plataforma', 'silo on its platform'), cx, baseY + 16, t3, 'center');
  }
}

  w3Build(rng);
  addWidget('vaciado', w3Html());
  setTimeout(w3Init, 90);

      fn: L('alberca = ' + A9 + ' m × ' + B9 + ' m × ' + nv(P9) + ' m · pipa = ' + C9 + ' L · 1 m³ = 1000 L',
            'pool = ' + A9 + ' m × ' + B9 + ' m × ' + nv(P9) + ' m · truck = ' + C9 + ' L · 1 m³ = 1000 L'),
      hint: L('Después de pasar el contenido a litros y repartirlo entre la carga de la pipa, fíjate si el reparto sale entero: un resto, por chico que sea, obliga a un viaje más.',
              'After turning the contents into litres and sharing them out among the truck load, check whether the sharing comes out whole: a remainder, however small, forces one more trip.'),
      explanation: L('La alberca guarda ' + A9 + ' × ' + B9 + ' × ' + nv(P9) + ' = ' + nv(Vm9) + ' m³, o sea ' + nv(Lt9) + ' litros. Al repartirlos: ' + nv(Lt9) + ' ÷ ' + C9 + ' = ' + nv(Lt9 / C9) + ', y como una fracción de viaje no existe hay que subir al entero siguiente, ' + n9 + '.',
                     'The pool holds ' + A9 + ' × ' + B9 + ' × ' + nv(P9) + ' = ' + nv(Vm9) + ' m³, that is ' + nv(Lt9) + ' litres. Sharing them out: ' + nv(Lt9) + ' ÷ ' + C9 + ' = ' + nv(Lt9 / C9) + ', and since a fraction of a trip does not exist you must go up to the next whole number, ' + n9 + '.'),
      options: o9b, correct: o9b[0], showWork: true
    }, rng);
  }

  /* ── graded 10 ── */
  var v10 = Math.floor(rng() * 2);
  if (v10 === 0){
    var g10 = pick([{ s: 12, ap: 10, h: 8 }, { s: 10, ap: 13, h: 12 }, { s: 18, ap: 15, h: 12 }, { s: 16, ap: 17, h: 15 }], rng);
    var V10 = g10.s * g10.s * g10.h / 3;
    var o10 = [nv(V10) + ' cm³', nv(g10.s * g10.s * g10.ap / 3) + ' cm³', nv(g10.s * g10.s * g10.h) + ' cm³', nv(g10.s * g10.s * g10.h / 6) + ' cm³'];
    pushProb({
      title: L('La pirámide de cartón', 'The cardboard pyramid'),
      questionText: L('Una pirámide de base cuadrada tiene lados de ' + g10.s + ' cm. Cada cara es un triángulo cuya altura, medida desde el punto medio de un lado de la base hasta la punta, mide ' + g10.ap + ' cm. Calcula el volumen de la pirámide.',
                      'A pyramid with a square base has sides of ' + g10.s + ' cm. Each face is a triangle whose height, measured from the midpoint of a base side up to the apex, is ' + g10.ap + ' cm. Calculate the volume of the pyramid.'),
      fn: L('lado de la base = ' + g10.s + ' cm · altura de la cara = ' + g10.ap + ' cm',
            'base side = ' + g10.s + ' cm · face height = ' + g10.ap + ' cm'),
      hint: L('El dato que te dan no es la altura de la pirámide, sino la de una cara. Esa altura de la cara, la mitad del lado de la base y la altura de la pirámide forman un triángulo rectángulo, y el teorema de Pitágoras te da la que falta. Después toma la tercera parte de la base por la altura.',
              'The data you are given is not the height of the pyramid, but the height of a face. That face height, half of the base side and the height of the pyramid form a right triangle, and the Pythagorean theorem gives you the missing one. Then take a third of the base times the height.'),
      explanation: L('La mitad del lado mide ' + (g10.s / 2) + ' cm. Por el teorema de Pitágoras, la altura de la pirámide cumple ' + g10.ap + '² = ' + (g10.s / 2) + '² + altura², así que altura² = ' + (g10.ap * g10.ap) + ' − ' + (g10.s * g10.s / 4) + ' = ' + (g10.h * g10.h) + ' y la altura es ' + g10.h + ' cm. La base mide ' + (g10.s * g10.s) + ' cm², de modo que ' + (g10.s * g10.s) + ' × ' + g10.h + ' ÷ 3 = ' + nv(V10) + ' cm³.',
                     'Half of the side is ' + (g10.s / 2) + ' cm. By the Pythagorean theorem, the height of the pyramid satisfies ' + g10.ap + '² = ' + (g10.s / 2) + '² + height², so height² = ' + (g10.ap * g10.ap) + ' − ' + (g10.s * g10.s / 4) + ' = ' + (g10.h * g10.h) + ' and the height is ' + g10.h + ' cm. The base measures ' + (g10.s * g10.s) + ' cm², so ' + (g10.s * g10.s) + ' × ' + g10.h + ' ÷ 3 = ' + nv(V10) + ' cm³.'),
      options: o10, correct: o10[0], showWork: true
    }, rng);
  } else {
    var g10b = pick([{ c1: 5, c2: 12, hy: 13 }, { c1: 8, c2: 15, hy: 17 }, { c1: 9, c2: 12, hy: 15 }, { c1: 7, c2: 24, hy: 25 }], rng);
    var l10 = pick([20, 25, 30], rng);
    var V10b = g10b.c1 * g10b.c2 / 2 * l10;
    var o10b = [nv(V10b) + ' cm³', nv(g10b.c1 * g10b.hy / 2 * l10) + ' cm³', nv(g10b.c1 * g10b.c2 * l10) + ' cm³', nv(V10b / 3) + ' cm³'];
    pushProb({
      title: L('La cuña de madera', 'The wooden wedge'),
      questionText: L('Una cuña de madera es un prisma cuya base es un triángulo rectángulo. De ese triángulo se conocen la hipotenusa, de ' + g10b.hy + ' cm, y uno de los catetos, de ' + g10b.c1 + ' cm. La cuña mide ' + l10 + ' cm de largo. Calcula el volumen de madera que lleva.',
                      'A wooden wedge is a prism whose base is a right triangle. Of that triangle the hypotenuse, ' + g10b.hy + ' cm, and one of the legs, ' + g10b.c1 + ' cm, are known. The wedge is ' + l10 + ' cm long. Calculate the volume of wood it takes.'),
      fn: L('hipotenusa = ' + g10b.hy + ' cm · cateto conocido = ' + g10b.c1 + ' cm · largo = ' + l10 + ' cm',
            'hypotenuse = ' + g10b.hy + ' cm · known leg = ' + g10b.c1 + ' cm · length = ' + l10 + ' cm'),
      hint: L('Para el área del triángulo hacen falta sus dos catetos, y la hipotenusa no es uno de ellos. El teorema de Pitágoras te devuelve el cateto que falta a partir de los dos datos que sí tienes.',
              'For the area of the triangle you need its two legs, and the hypotenuse is not one of them. The Pythagorean theorem gives you back the missing leg from the two data you do have.'),
      explanation: L('Por el teorema de Pitágoras el otro cateto cumple cateto² = ' + (g10b.hy * g10b.hy) + ' − ' + (g10b.c1 * g10b.c1) + ' = ' + (g10b.c2 * g10b.c2) + ', así que mide ' + g10b.c2 + ' cm. El triángulo de la base mide ' + g10b.c1 + ' × ' + g10b.c2 + ' ÷ 2 = ' + nv(g10b.c1 * g10b.c2 / 2) + ' cm², y a lo largo de ' + l10 + ' cm da ' + nv(V10b) + ' cm³.',
                     'By the Pythagorean theorem the other leg satisfies leg² = ' + (g10b.hy * g10b.hy) + ' − ' + (g10b.c1 * g10b.c1) + ' = ' + (g10b.c2 * g10b.c2) + ', so it measures ' + g10b.c2 + ' cm. The triangle of the base measures ' + g10b.c1 + ' × ' + g10b.c2 + ' ÷ 2 = ' + nv(g10b.c1 * g10b.c2 / 2) + ' cm², and along ' + l10 + ' cm it gives ' + nv(V10b) + ' cm³.'),
      options: o10b, correct: o10b[0], showWork: true
    }, rng);
  }
}
</script>

  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
