<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistemas de Ecuaciones: Gráfico y Sustitución</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; text-align: justify; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Sistemas de Ecuaciones: Gráfico y Sustitución</div>
    <div class="wcourse" id="wcourse-el">Matemáticas · 2° de Secundaria · Ecuaciones lineales y cuadráticas</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Sistemas de Ecuaciones: Gráfico y Sustitución</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="sbtn" id="dlBtn" onclick="generatePDF()" style="max-width:280px;margin:0 auto;">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   CENTRALIZED SCHOOL CONFIG (Rule 16) — ships UNBRANDED (Rule 11).
   The ONLY rebranding point. build_all.py substitutes these exact fields
   (BRAND_FIELDS / RGB_FIELDS / logo*) downstream; :root/dark stay as fallback.
   Neutral defaults below == the static :root/dark values, so unbranded == no-op.
   ══════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:'#24240c', primaryDark:'#3f3f14', primaryBg:'#f4f4e9',
  accent:'#fcb40c', accentBg:'#fff4db',
  darkPrimary:'#b4b455', darkPrimaryDark:'#d7d783', darkPrimaryBg:'#343412',

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;

  saveSession();

}

async function generatePDF() {
  var btn = document.getElementById('dlBtn');
  btn.textContent = 'Generando PDF…';
  btn.disabled = true;

  var jspdf   = window.jspdf;
  var doc     = new jspdf.jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });
  var PW      = 215.9;
  var M       = 18;
  var TW      = PW - M * 2;
  var PH      = doc.internal.pageSize.height;
  var name    = studentData.name;
  var group   = studentData.group;
  var total   = problems.length;
  var pct     = Math.round(correctCount / total * 100);
  var dateStr = new Date().toLocaleString('es-MX', { dateStyle:'long', timeStyle:'short' });

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS — INJECTION BLOCK ─────────────────────────────────────────
  //   Match these RGB values to --green and --gold above.
  //   PRIMARY  → pBR, pBG, pBB
  //   ACCENT   → pAR, pAG, pAB
  // ──────────────────────────────────────────────────────────────────────────
  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;  // PRIMARY (from SCHOOL, Rule 16)
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;   // ACCENT (from SCHOOL, Rule 16)

  function pdfText(html) {
    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/\u2192/g,'->').replace(/\u2212/g,'-').replace(/\u00b2/g,'^2')
      .replace(/\u00b3/g,'^3').replace(/\u00d7/g,'x').replace(/\u00f7/g,'/')
      .replace(/\u2260/g,'!=').replace(/\u2264/g,'<=').replace(/\u2265/g,'>=')
      .replace(/\u221a/g,'sqrt').replace(/\u03c0/g,'pi').replace(/\u2026/g,'...')

    // ── SAVE / SHARE — iOS-safe download (LIAXA iOS PDF fix, Rule 12) ─────────
  //   iOS Safari ignores the <a download> attribute, so a plain download fails
  //   silently on iPhone/iPad. iOS -> native share sheet (-> "Save to Files"),
  //   with an inline-open fallback; everything else -> <a download> click.
  //   Runs synchronously off the tap so iOS accepts navigator.share().
  var _fname   = 'mat2_t04_g02_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf';

  function _openPdfInline(b){
    var u = URL.createObjectURL(b);
    var w = window.open(u, '_blank');
    if (!w) { window.location.href = u; }
    setTimeout(function(){ URL.revokeObjectURL(u); }, 60000);
  }

  var _isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
               (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  if (_isIOS) {
    var _pdfFile = new File([_pdfBlob], _fname, { type:'application/pdf' });
    if (navigator.canShare && navigator.canShare({ files:[_pdfFile] })) {
      navigator.share({ files:[_pdfFile], title:_fname })
        .then(_restorePdfBtn)
        .catch(function(e){
          if (e && e.name === 'AbortError') { _restorePdfBtn(); return; }
          _openPdfInline(_pdfBlob); _restorePdfBtn();
        });
      return;
    }
    _openPdfInline(_pdfBlob); _restorePdfBtn();
    return;
  }

  var _dlUrl = URL.createObjectURL(_pdfBlob);
  var _dlA   = document.createElement('a');
  _dlA.href  = _dlUrl; _dlA.download = _fname;
  document.body.appendChild(_dlA); _dlA.click();
  setTimeout(function(){ document.body.removeChild(_dlA); URL.revokeObjectURL(_dlUrl); }, 200);
  _restorePdfBtn();
}

/* ================================================
   buildLesson — OVERRIDE IN EACH GUIDE
   ================================================ */
function buildLesson(rng) {
  var LB = document.getElementById('lessonBody');

  /* ── helpers ─────────────────────────────────────────────────────── */
  function L(o){ if(o===null||o===undefined) return ''; if(typeof o==='string') return o; return (o[LANG]!==undefined ? o[LANG] : o.es); }
  function ri(a,b){ return a + Math.floor(rng()*(b-a+1)); }
  function pk(a){ return a[Math.floor(rng()*a.length)]; }
  function num(n){ return (n<0) ? ('−'+Math.abs(n)) : String(n); }
  function addc(n){ return (n<0) ? (' − '+Math.abs(n)) : (' + '+n); }
  function coefX(a){ return (a===1)?'x':((a===-1)?'−x':(num(a)+'x')); }
  function addY(b){ if(b===0) return ''; var ab=Math.abs(b); return (b<0?' − ':' + ') + (ab===1?'y':(ab+'y')); }
  function eqS(a,b,c){ return coefX(a)+addY(b)+' = '+num(c); }
  function lin(m,k){ return ((m===1)?'x':((m===-1)?'−x':(num(m)+'x'))) + ((k===0)?'':addc(k)); }
  function ymx(m,k){ return 'y = '+lin(m,k); }
  function P(x,y){ return '('+num(x)+', '+num(y)+')'; }
  function frac(n,d){ return '<span class="mf-outer"><span class="mf-num">'+n+'</span><span class="mf-den">'+d+'</span></span>'; }
  function bpar(b,inner){ var ab=Math.abs(b); return (b<0?' − ':' + ')+(ab===1?'':String(ab))+'('+inner+')'; }
  function ev(a,x,b,y){ return num(a)+'('+num(x)+')'+(b<0?' − ':' + ')+Math.abs(b)+'('+num(y)+')'; }
  var SEP = '&nbsp;&nbsp;·&nbsp;&nbsp;';
  function cssv(n){ try { return getComputedStyle(document.documentElement).getPropertyValue(n).trim() || 'transparent'; } catch(e){ return 'transparent'; } }
  function opts4(correct, cands){
    var out=[String(correct)];
    for(var i=0;i<cands.length && out.length<4;i++){ var c=String(cands[i]); if(out.indexOf(c)<0) out.push(c); }
    return out;
  }
  function optsN(correct, cands){
    var out=[correct];
    for(var i=0;i<cands.length && out.length<4;i++){ if(out.indexOf(cands[i])<0) out.push(cands[i]); }
    var d=1;
    while(out.length<4){
      if(out.indexOf(correct+d)<0) out.push(correct+d);
      else if(out.indexOf(correct-d)<0) out.push(correct-d);
      d++;
    }
    return out.map(function(v){ return num(v); });
  }
  function optsP(cx, cy, cands){
    var out=[P(cx,cy)];
    for(var i=0;i<cands.length && out.length<4;i++){ var s=P(cands[i][0],cands[i][1]); if(out.indexOf(s)<0) out.push(s); }
    var d=1;
    while(out.length<4){
      var t1=P(cx+d,cy-d); if(out.indexOf(t1)<0){ out.push(t1); }
      else { var t2=P(cx-d,cy+d); if(out.indexOf(t2)<0) out.push(t2); }
      d++;
    }
    return out;
  }
  function fbSet(id, ok, html){
    var e=document.getElementById(id); if(!e) return;
    e.className='mcfb show'; e.innerHTML=html;
    e.style.background = ok ? 'var(--ok-bg)' : 'var(--gold-bg)';
    e.style.color      = ok ? 'var(--ok)'    : 'var(--text2)';
  }
  function sec(tag,title,html){
    var d=document.createElement('div'); d.className='section';
    d.innerHTML='<div class="stag">'+tag+'</div><h2>'+title+'</h2>'+html;
    LB.appendChild(d); return d;
  }
  function widget(html){
    var d=document.createElement('div'); d.className='section';
    d.innerHTML=html; LB.appendChild(d); return d;
  }
  function addProb(p){
    var so = shuffle(p.options, rng);
    problems.push({
      title:p.title, questionText:p.q, fn:(p.fn||''), hint:p.hint, explanation:p.exp,
      options:so, correctIdx:so.indexOf(p.correct), showWork:!!p.showWork,
      studentChoice:null, pendingChoice:null
    });
    buildOneCard(problems[problems.length-1], problems.length-1);
  }
  var BTN  = 'min-height:44px;min-width:44px;padding:.55rem 1.1rem;border-radius:8px;border:1.5px solid var(--green);background:var(--green);color:#fff;font-family:inherit;font-size:.85rem;font-weight:600;cursor:pointer';
  var BTN2 = 'min-height:44px;min-width:44px;padding:.45rem .9rem;border-radius:8px;border:1.5px solid var(--border);background:var(--surface2);color:var(--text);font-family:inherit;font-size:.9rem;font-weight:600;cursor:pointer';

  /* ── sistema con solución entera única ── */
  function mkSys(lo,hi,cleanB1){
    var p=ri(lo,hi), q=ri(lo,hi);
    var a1=pk([1,2,3,-1,-2]);
    var b1=cleanB1 ? pk([1,-1]) : pk([1,2,-1,-3,3]);
    var a2=pk([1,2,3,-2,4]), b2=pk([2,-1,1,-2,3]);
    var guard=0;
    while(a1*b2-a2*b1===0 && guard<40){ a2=pk([1,2,3,-2,4]); b2=pk([2,-1,1,-2,3]); guard++; }
    if(a1*b2-a2*b1===0){ a2=a1+1; b2=b1-1; }
    return { a1:a1,b1:b1,c1:a1*p+b1*q, a2:a2,b2:b2,c2:a2*p+b2*q, p:p,q:q,
             s1:function(x,y){ return a1*x+b1*y===this.c1; },
             s2:function(x,y){ return a2*x+b2*y===this.c2; },
             txt:function(){ return eqS(a1,b1,this.c1)+SEP+eqS(a2,b2,this.c2); } };
  }

  /* ── plano cartesiano dibujado en canvas ── */
  function gDraw(cv, o){
    if(!cv) return;
    var dpr = window.devicePixelRatio || 1;
    var rect = cv.getBoundingClientRect();
    var W = rect.width || 520, H = o.h || 250, R = o.R || 7;
    cv.width = W*dpr; cv.height = H*dpr;
    var ctx = cv.getContext('2d');
    ctx.setTransform(dpr,0,0,dpr,0,0);
    var sx = W/(2*R), sy = H/(2*R);
    function PX(x){ return W/2 + x*sx; }
    function PY(y){ return H/2 - y*sy; }
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle = cssv('--surface'); ctx.fillRect(0,0,W,H);
    ctx.strokeStyle = cssv('--border'); ctx.lineWidth = 1;
    for(var i=-R;i<=R;i++){
      ctx.beginPath(); ctx.moveTo(PX(i),0); ctx.lineTo(PX(i),H); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0,PY(i)); ctx.lineTo(W,PY(i)); ctx.stroke();
    }
    ctx.strokeStyle = cssv('--text3'); ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(0,PY(0)); ctx.lineTo(W,PY(0)); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(PX(0),0); ctx.lineTo(PX(0),H); ctx.stroke();
    ctx.fillStyle = cssv('--text3'); ctx.font = '10px "IBM Plex Mono", monospace'; ctx.textAlign='center';
    for(i=-R+1;i<=R-1;i+=2){ if(i!==0){ ctx.fillText(String(i), PX(i), PY(0)+13); ctx.fillText(String(i), PX(0)-14, PY(i)+3); } }
    (o.lines||[]).forEach(function(ln){
      ctx.strokeStyle = ln.color; ctx.lineWidth = ln.w||2.6; ctx.setLineDash(ln.dash||[]);
      ctx.beginPath();
      if(Math.abs(ln.b)>1e-9){
        var y1=(ln.c-ln.a*(-R))/ln.b, y2=(ln.c-ln.a*R)/ln.b;
        ctx.moveTo(PX(-R),PY(y1)); ctx.lineTo(PX(R),PY(y2));
      } else {
        var xv=ln.c/ln.a; ctx.moveTo(PX(xv),0); ctx.lineTo(PX(xv),H);
      }
      ctx.stroke(); ctx.setLineDash([]);
    });
    (o.points||[]).forEach(function(pt){
      ctx.fillStyle = pt.color;
      ctx.beginPath(); ctx.arc(PX(pt.x),PY(pt.y),pt.r||6,0,Math.PI*2); ctx.fill();
      if(pt.ring){ ctx.strokeStyle=cssv('--gold'); ctx.lineWidth=2.5; ctx.beginPath(); ctx.arc(PX(pt.x),PY(pt.y),(pt.r||6)+4,0,Math.PI*2); ctx.stroke(); }
      if(pt.label){ ctx.fillStyle=cssv('--text'); ctx.font='11px "IBM Plex Mono", monospace'; ctx.textAlign='left'; ctx.fillText(pt.label, PX(pt.x)+10, PY(pt.y)-9); }
    });
  }

  /* ══════════════════════════════════════════════════════════════════
     SECCIÓN 1 — Dos condiciones al mismo tiempo
     ══════════════════════════════════════════════════════════════════ */
  sec(L({es:'Concepto 1', en:'Concept 1'}),
      L({es:'Un par que cumple dos condiciones', en:'One pair, two conditions'}),
    '<p>'+L({es:'Una sola ecuación con dos incógnitas, como 2x + y = 10, se conforma con demasiada gente: (1, 8), (3, 4) y (5, 0) la cumplen sin problema, y hay infinitos pares más. Por eso una ecuación así no alcanza para identificar un valor concreto de x ni de y.',
             en:'A single equation with two unknowns, like 2x + y = 10, is satisfied far too easily: (1, 8), (3, 4) and (5, 0) all work, and there are infinitely many more pairs. That is why one such equation is not enough to pin down a value for x or for y.'})+'</p>'+
    '<p>'+L({es:'Un <strong>sistema</strong> junta dos ecuaciones y exige que el mismo par (x, y) cumpla las dos a la vez. Ese doble filtro es lo que reduce las infinitas posibilidades, casi siempre, a un único par. Cumplir una sola de las dos ecuaciones no sirve de nada: es como acertar una contraseña de dos campos y equivocarse en el otro.',
             en:'A <strong>system</strong> puts two equations together and demands that the same pair (x, y) satisfy both at once. That double filter is what narrows infinitely many possibilities down to a single pair, almost always. Meeting only one of the two equations counts for nothing: it is like getting one field of a two-field password right and the other wrong.'})+'</p>'+
    '<div class="rules-grid">'+
      '<div class="rcard"><div class="rname">'+L({es:'Incógnitas',en:'Unknowns'})+'</div><div class="rform">x, y</div><div class="rnote">'+L({es:'Dos valores que se buscan juntos.',en:'Two values hunted together.'})+'</div></div>'+
      '<div class="rcard"><div class="rname">'+L({es:'Solución',en:'Solution'})+'</div><div class="rform">(x, y)</div><div class="rnote">'+L({es:'Un par ordenado, no un número suelto.',en:'An ordered pair, not a loose number.'})+'</div></div>'+
      '<div class="rcard"><div class="rname">'+L({es:'Condición',en:'Condition'})+'</div><div class="rform">2 de 2</div><div class="rnote">'+L({es:'Debe cumplir las dos ecuaciones.',en:'It must satisfy both equations.'})+'</div></div>'+
      '<div class="rcard"><div class="rname">'+L({es:'Comprobar',en:'Checking'})+'</div><div class="rform">x → , y →</div><div class="rnote">'+L({es:'Se sustituye y se revisa cada total.',en:'Substitute and check each total.'})+'</div></div>'+
    '</div>'+
    '<div class="callout"><p>'+L({es:'Comprobar es directo: se cambia cada letra por su número y se revisa si el total coincide con el que pide la ecuación. Lo llamativo es que un par puede acertar el primer total con exactitud y fallar el segundo por una unidad, y aun así queda descartado.',
                                  en:'Checking is direct: swap each letter for its number and see whether the total matches what the equation asks for. The striking part is that a pair can hit the first total exactly and miss the second by one unit, and it is discarded all the same.'})+'</p></div>');

  /* ── MANIPULATIVO 1 — Cazador del par que cumple las dos ── */
  var w1R = [ mkSys(-4,4), mkSys(-4,4), mkSys(-4,4) ];
  widget(
    '<div class="stag">'+L({es:'Cazador de pares',en:'Pair hunter'})+'</div>'+
    '<h2>'+L({es:'Rastrea el par que cumple las dos',en:'Track down the pair that meets both'})+'</h2>'+
    '<p>'+L({es:'Mueve el punto con los dos deslizadores. Cada posición que visitas queda marcada en el plano: <strong>verde</strong> si cumple las dos ecuaciones, <strong>dorado</strong> si cumple solo una y gris si no cumple ninguna. Tu rastro va dibujando solo el mapa del sistema. Detente donde creas que está la solución y comprueba.',
             en:'Move the point with the two sliders. Every position you visit stays marked on the plane: <strong>green</strong> if it meets both equations, <strong>gold</strong> if it meets only one, grey if it meets neither. Your trail draws the map of the system by itself. Stop where you think the solution is and check.'})+'</p>'+
    '<div class="gcrd">'+
      '<div id="w1goal" style="font-size:.86rem;color:var(--text2);margin-bottom:.7rem"></div>'+
      '<div class="cvwrap"><canvas id="w1cv" style="display:block;width:100%;height:250px"></canvas></div>'+
      '<div class="cgrid" style="margin-top:.9rem">'+
        '<div class="cg"><label>x = <span class="cval" id="w1xv">0</span></label><input type="range" id="w1x" min="-6" max="6" value="0" step="1"></div>'+
        '<div class="cg"><label>y = <span class="cval" id="w1yv">0</span></label><input type="range" id="w1y" min="-6" max="6" value="0" step="1"></div>'+
      '</div>'+
      '<div class="metrics">'+
        '<div class="metric"><div class="mlbl" id="w1l1">-</div><div class="mnum cs" id="w1e1">-</div></div>'+
        '<div class="metric"><div class="mlbl" id="w1l2">-</div><div class="mnum ps" id="w1e2">-</div></div>'+
        '<div class="metric"><div class="mlbl">'+L({es:'Ecuaciones cumplidas',en:'Equations met'})+'</div><div class="mnum ts" id="w1st">0 / 2</div></div>'+
      '</div>'+
      '<div style="margin-top:.9rem;display:flex;align-items:center;gap:.8rem;flex-wrap:wrap">'+
        '<button id="w1chk" style="'+BTN+'">'+L({es:'Comprobar',en:'Check'})+'</button>'+
        '<span id="w1rd" style="font-size:.78rem;color:var(--text3)"></span>'+
      '</div>'+
      '<div class="mcfb" id="w1fb"></div>'+
    '</div>');

  (function(){
    var r=0, tries=0, trail={}, done=false;
    var cv=document.getElementById('w1cv');
    var sx=document.getElementById('w1x'), sy=document.getElementById('w1y');
    function cur(){ return w1R[r]; }
    function st(){ return { x:parseInt(sx.value,10), y:parseInt(sy.value,10) }; }
    function draw(){
      var s=cur(), c=st(), pts=[];
      Object.keys(trail).forEach(function(k){
        var q=k.split(','), xx=parseInt(q[0],10), yy=parseInt(q[1],10);
        var o1=s.s1(xx,yy), o2=s.s2(xx,yy);
        pts.push({ x:xx, y:yy, r:4, color:(o1&&o2)?cssv('--ok'):((o1||o2)?cssv('--gold'):cssv('--border')) });
      });
      pts.push({ x:c.x, y:c.y, r:7, color:cssv('--green'), ring:true, label:P(c.x,c.y) });
      gDraw(cv, { h:250, R:7, points:pts });
    }
    function upd(){
      var s=cur(), c=st();
      document.getElementById('w1xv').textContent=num(c.x);
      document.getElementById('w1yv').textContent=num(c.y);
      var v1=s.a1*c.x+s.b1*c.y, v2=s.a2*c.x+s.b2*c.y;
      document.getElementById('w1l1').textContent=(coefX(s.a1)+addY(s.b1)).replace(/−/g,'-');
      document.getElementById('w1l2').textContent=(coefX(s.a2)+addY(s.b2)).replace(/−/g,'-');
      document.getElementById('w1e1').textContent=num(v1)+' → '+num(s.c1);
      document.getElementById('w1e2').textContent=num(v2)+' → '+num(s.c2);
      var hit=(v1===s.c1?1:0)+(v2===s.c2?1:0);
      document.getElementById('w1st').textContent=hit+' / 2';
      trail[c.x+','+c.y]=1;
      draw();
    }
    function goal(){
      var s=cur();
      document.getElementById('w1goal').innerHTML=
        '<strong>'+L({es:'Sistema',en:'System'})+':</strong> <span style="font-family:\'IBM Plex Mono\',monospace">'+s.txt()+'</span>';
      document.getElementById('w1rd').textContent=L({es:'Ronda ',en:'Round '})+(r+1)+L({es:' de 3',en:' of 3'});
    }
    function nextRound(){
      r++; tries=0; trail={};
      if(r>=3){
        done=true;
        document.getElementById('w1chk').disabled=true;
        document.getElementById('w1chk').style.opacity='.55';
        document.getElementById('w1rd').textContent=L({es:'3 de 3 completadas',en:'3 of 3 completed'});
        return;
      }
      sx.value=0; sy.value=0; goal(); upd();
    }
    function check(){
      if(done) return;
      var s=cur(), c=st();
      if(c.x===s.p && c.y===s.q){
        fbSet('w1fb', true, L({
          es:'Ese es el par. Las dos ecuaciones quedan satisfechas al mismo tiempo, y por eso '+P(s.p,s.q)+' es la solución del sistema.',
          en:'That is the pair. Both equations come out true at the same time, which is why '+P(s.p,s.q)+' is the solution of the system.'}));
        setTimeout(nextRound, 950);
        return;
      }
      tries++;
      var v1=s.a1*c.x+s.b1*c.y, v2=s.a2*c.x+s.b2*c.y;
      if(tries>=3){
        fbSet('w1fb', false, L({
          es:'El par que cumple las dos es '+P(s.p,s.q)+'. Al sustituirlo: '+ev(s.a1,s.p,s.b1,s.q)+' = '+num(s.c1)+' y '+ev(s.a2,s.p,s.b2,s.q)+' = '+num(s.c2)+'.',
          en:'The pair that meets both is '+P(s.p,s.q)+'. Substituting it: '+ev(s.a1,s.p,s.b1,s.q)+' = '+num(s.c1)+' and '+ev(s.a2,s.p,s.b2,s.q)+' = '+num(s.c2)+'.'}));
        setTimeout(nextRound, 1600);
        return;
      }
      var d1=s.c1-v1, d2=s.c2-v2, msg;
      if(v1===s.c1) msg=L({es:'La primera ya cuadra, pero a la segunda le '+(d2>0?('faltan '+d2):('sobran '+Math.abs(d2)))+'. Muévete a lo largo de tu rastro dorado.',
                           en:'The first one already fits, but the second is '+(d2>0?('short by '+d2):('over by '+Math.abs(d2)))+'. Move along your gold trail.'});
      else if(v2===s.c2) msg=L({es:'La segunda ya cuadra, pero a la primera le '+(d1>0?('faltan '+d1):('sobran '+Math.abs(d1)))+'. Ajusta sin perder ese acierto.',
                                en:'The second one already fits, but the first is '+(d1>0?('short by '+d1):('over by '+Math.abs(d1)))+'. Adjust without losing that hit.'});
      else msg=L({es:'Todavía ninguna cuadra: a la primera le '+(d1>0?('faltan '+d1):('sobran '+Math.abs(d1)))+' y a la segunda le '+(d2>0?('faltan '+d2):('sobran '+Math.abs(d2)))+'.',
                  en:'Neither fits yet: the first is '+(d1>0?('short by '+d1):('over by '+Math.abs(d1)))+' and the second is '+(d2>0?('short by '+d2):('over by '+Math.abs(d2)))+'.'});
      fbSet('w1fb', false, msg);
      sx.value=0; sy.value=0; upd();
    }
    sx.addEventListener('input', upd);
    sy.addEventListener('input', upd);
    document.getElementById('w1chk').addEventListener('click', check);
    goal();
    setTimeout(upd, 70);
  })();

  /* ── PROBLEMA 1 ── */
  (function(){
    var s = mkSys(-4,5);
    if(Math.floor(rng()*2)===0){
      var corr = P(s.p,s.q);
      var cd = [[s.q,s.p],[s.p+1,s.q],[s.p,s.q-2],[s.p-1,s.q+1],[s.p+2,s.q+2],[s.p-2,s.q-1]];
      addProb({
        title: L({es:'El par que pasa el doble filtro', en:'The pair that clears both filters'}),
        q: L({es:'De los cuatro pares ordenados de abajo, solo uno vuelve verdaderas las dos ecuaciones del sistema al mismo tiempo. ¿Cuál es?',
              en:'Of the four ordered pairs below, only one makes both equations of the system true at the same time. Which one is it?'}),
        fn: s.txt(),
        options: optsP(s.p,s.q,cd), correct: corr, showWork:true,
        hint: L({es:'Sustituye cada par en la primera ecuación y descarta los que no den el total pedido. Con los que sobrevivan, repite la prueba en la segunda ecuación.',
                 en:'Substitute each pair into the first equation and discard the ones that do not give the required total. With whatever survives, repeat the test on the second equation.'}),
        exp: L({es:'Con x = '+num(s.p)+' y y = '+num(s.q)+': '+ev(s.a1,s.p,s.b1,s.q)+' = '+num(s.c1)+' y '+ev(s.a2,s.p,s.b2,s.q)+' = '+num(s.c2)+'. Los dos totales coinciden, así que la solución es '+corr+'.',
                en:'With x = '+num(s.p)+' and y = '+num(s.q)+': '+ev(s.a1,s.p,s.b1,s.q)+' = '+num(s.c1)+' and '+ev(s.a2,s.p,s.b2,s.q)+' = '+num(s.c2)+'. Both totals match, so the solution is '+corr+'.'})
      });
    } else {
      var cx = s.p+s.b1, cy = s.q-s.a1;
      var corrB = P(cx,cy);
      var cand = [[s.p,s.q],[s.p+s.b2,s.q-s.a2],[s.p+1,s.q+1],[s.p-1,s.q+2],[s.p+2,s.q-1],[s.p+3,s.q+1],[s.p-2,s.q-2],[s.p+1,s.q-3]];
      var good = [];
      cand.forEach(function(t){
        if(s.s1(t[0],t[1]) && !s.s2(t[0],t[1])) return;
        if(P(t[0],t[1])===corrB) return;
        good.push(t);
      });
      addProb({
        title: L({es:'Acertar la mitad no basta', en:'Half right is not enough'}),
        q: L({es:'Un par que cumple una sola de las dos ecuaciones no es solución del sistema. ¿Cuál de estos pares cumple la primera ecuación pero falla en la segunda?',
              en:'A pair that satisfies only one of the two equations is not a solution of the system. Which of these pairs satisfies the first equation but fails the second?'}),
        fn: s.txt(),
        options: optsP(cx,cy,good), correct: corrB, showWork:true,
        hint: L({es:'Prueba cada par primero en la ecuación de arriba. Los que den el total correcto ahí son los candidatos; entre ellos, busca el que ya no funcione en la de abajo.',
                 en:'Test each pair in the top equation first. The ones that give the right total there are the candidates; among them, look for the one that no longer works in the bottom one.'}),
        exp: L({es:'Con '+corrB+': '+ev(s.a1,cx,s.b1,cy)+' = '+num(s.c1)+', que es justo lo que pide la primera. Pero en la segunda: '+ev(s.a2,cx,s.b2,cy)+' = '+num(s.a2*cx+s.b2*cy)+', y se necesitaba '+num(s.c2)+'. El único par que cumple las dos es '+P(s.p,s.q)+'.',
                en:'With '+corrB+': '+ev(s.a1,cx,s.b1,cy)+' = '+num(s.c1)+', exactly what the first one asks for. But in the second: '+ev(s.a2,cx,s.b2,cy)+' = '+num(s.a2*cx+s.b2*cy)+', and '+num(s.c2)+' was needed. The only pair meeting both is '+P(s.p,s.q)+'.'})
      });
    }
  })();

  /* ── PROBLEMA 2 ── */
  (function(){
    var s = mkSys(-4,5);
    var o = [ L({es:'Cumple las dos ecuaciones, así que es la solución del sistema.', en:'It meets both equations, so it is the solution of the system.'}),
              L({es:'Cumple la primera ecuación, pero no la segunda.', en:'It meets the first equation, but not the second.'}),
              L({es:'Cumple la segunda ecuación, pero no la primera.', en:'It meets the second equation, but not the first.'}),
              L({es:'No cumple ninguna de las dos ecuaciones.', en:'It meets neither of the two equations.'}) ];
    if(Math.floor(rng()*2)===0){
      var caso = pk(['both','first','second','none']);
      var x0,y0,idx;
      if(caso==='both'){ x0=s.p; y0=s.q; idx=0; }
      else if(caso==='first'){ x0=s.p+s.b1; y0=s.q-s.a1; idx=1; }
      else if(caso==='second'){ x0=s.p+s.b2; y0=s.q-s.a2; idx=2; }
      else {
        idx=3; x0=s.p+1; y0=s.q+1;
        var found=false;
        for(var dx=1;dx<=5 && !found;dx++){
          for(var dy=1;dy<=5 && !found;dy++){
            if(!s.s1(s.p+dx,s.q+dy) && !s.s2(s.p+dx,s.q+dy)){ x0=s.p+dx; y0=s.q+dy; found=true; }
          }
        }
      }
      var r1=s.a1*x0+s.b1*y0, r2=s.a2*x0+s.b2*y0;
      addProb({
        title: L({es:'Veredicto de una sustitución', en:'Verdict of a substitution'}),
        q: L({es:'Se sustituye el par '+P(x0,y0)+' en las dos ecuaciones del sistema. ¿Qué ocurre?',
              en:'The pair '+P(x0,y0)+' is substituted into both equations of the system. What happens?'}),
        fn: s.txt(),
        options: o, correct: o[idx], showWork:true,
        hint: L({es:'Calcula por separado el total que da cada ecuación con esos valores y compáralo con el número que aparece a la derecha del signo igual. Después junta los dos veredictos.',
                 en:'Work out separately the total each equation gives with those values and compare it with the number on the right of the equals sign. Then put the two verdicts together.'}),
        exp: L({es:'Primera: '+ev(s.a1,x0,s.b1,y0)+' = '+num(r1)+' (pedía '+num(s.c1)+'). Segunda: '+ev(s.a2,x0,s.b2,y0)+' = '+num(r2)+' (pedía '+num(s.c2)+'). Por eso: '+o[idx],
                en:'First: '+ev(s.a1,x0,s.b1,y0)+' = '+num(r1)+' (it asked for '+num(s.c1)+'). Second: '+ev(s.a2,x0,s.b2,y0)+' = '+num(r2)+' (it asked for '+num(s.c2)+'). Hence: '+o[idx]})
      });
    } else {
      addProb({
        title: L({es:'El total que falta', en:'The missing total'}),
        q: L({es:'Se sabe que '+P(s.p,s.q)+' es la solución del sistema, pero en la segunda ecuación se borró el número de la derecha. ¿Qué número debe ir ahí?',
              en:'It is known that '+P(s.p,s.q)+' is the solution of the system, but the number on the right of the second equation got erased. What number belongs there?'}),
        fn: eqS(s.a1,s.b1,s.c1)+SEP+coefX(s.a2)+addY(s.b2)+' = ?',
        options: optsN(s.c2, [s.c1, s.c2+s.a2, s.c2-s.b2, -s.c2, s.p+s.q]), correct: num(s.c2), showWork:true,
        hint: L({es:'Si ese par es la solución, también tiene que volver verdadera la segunda ecuación. Sustituye sus valores en el lado izquierdo y opera.',
                 en:'If that pair is the solution, it must also make the second equation true. Substitute its values on the left side and work it out.'}),
        exp: L({es:'Al sustituir en el lado izquierdo de la segunda: '+ev(s.a2,s.p,s.b2,s.q)+' = '+num(s.c2)+'. Ese es el número que debe aparecer a la derecha.',
                en:'Substituting into the left side of the second one: '+ev(s.a2,s.p,s.b2,s.q)+' = '+num(s.c2)+'. That is the number that must appear on the right.'})
      });
    }
  })();

  /* ══════════════════════════════════════════════════════════════════
     SECCIÓN 2 — El método gráfico
     ══════════════════════════════════════════════════════════════════ */
  sec(L({es:'Concepto 2', en:'Concept 2'}),
      L({es:'Cada ecuación es una recta', en:'Each equation is a line'}),
    '<p>'+L({es:'Si en una ecuación como 2x + y = 10 se despeja y, queda y = −2x + 10: la forma <strong>y = mx + b</strong>. Escrita así, la ecuación se dibuja de inmediato, porque b dice dónde cruza el eje vertical y m dice cuánto sube o baja al avanzar un paso a la derecha. Todos los pares que la cumplen forman esa recta, ni uno más.',
             en:'If you solve an equation like 2x + y = 10 for y, you get y = −2x + 10: the <strong>y = mx + b</strong> form. Written that way the equation draws itself, because b says where it crosses the vertical axis and m says how much it climbs or drops for one step to the right. Every pair that satisfies it forms that line, and nothing else.'})+'</p>'+
    '<p>'+L({es:'Al graficar las dos ecuaciones de un sistema aparecen dos rectas, y el <strong>punto de corte</strong> es el único par que pertenece a las dos a la vez: justo lo que se buscaba. Pero no siempre hay corte. Si las dos pendientes son iguales y las ordenadas distintas, las rectas corren paralelas y el sistema no tiene solución. Si además las ordenadas coinciden, es la misma recta dibujada dos veces y las soluciones son infinitas.',
             en:'Graphing both equations of a system gives two lines, and the <strong>crossing point</strong> is the only pair that belongs to both at once: exactly what was wanted. But there is not always a crossing. If the two slopes are equal and the intercepts differ, the lines run parallel and the system has no solution. If the intercepts match as well, it is the same line drawn twice and the solutions are infinite.'})+'</p>'+
    '<div class="rules-grid">'+
      '<div class="rcard"><div class="rname">'+L({es:'Pendientes distintas',en:'Different slopes'})+'</div><div class="rform">m₁ ≠ m₂</div><div class="rnote">'+L({es:'Se cortan en un solo punto.',en:'They cross at a single point.'})+'</div></div>'+
      '<div class="rcard"><div class="rname">'+L({es:'Paralelas',en:'Parallel'})+'</div><div class="rform">m₁ = m₂, b₁ ≠ b₂</div><div class="rnote">'+L({es:'Nunca se tocan: sin solución.',en:'They never touch: no solution.'})+'</div></div>'+
      '<div class="rcard"><div class="rname">'+L({es:'Encimadas',en:'Overlapping'})+'</div><div class="rform">m₁ = m₂, b₁ = b₂</div><div class="rnote">'+L({es:'Misma recta: infinitas soluciones.',en:'Same line: infinite solutions.'})+'</div></div>'+
      '<div class="rcard"><div class="rname">'+L({es:'Lectura',en:'Reading it'})+'</div><div class="rform">(x, y)</div><div class="rnote">'+L({es:'Las coordenadas del cruce.',en:'The coordinates of the crossing.'})+'</div></div>'+
    '</div>'+
    '<div class="callout"><p>'+L({es:'La gráfica tiene un límite práctico: si el cruce cae en valores con decimales, leerlo a ojo da un número aproximado y no exacto. Por eso conviene como mapa para ver qué está pasando, y después se confirma con un método algebraico.',
                                  en:'Graphing has a practical limit: if the crossing lands on decimal values, reading it by eye gives an approximate number rather than an exact one. That makes it a great map for seeing what is going on, to be confirmed afterwards with an algebraic method.'})+'</p></div>');

  /* ── MANIPULATIVO 2 — Taller de rectas ── */
  var w2R = [];
  (function(){
    var goals = shuffle(['cross','parallel','same'], rng);
    for(var i=0;i<3;i++){
      var m1=pk([-2,-1,1,2,3]), k1=ri(-4,4), px=pk([-3,-2,-1,1,2,3]), guard=0;
      while(Math.abs(m1*px+k1)>6 && guard<40){ m1=pk([-2,-1,1,2,3]); k1=ri(-4,4); px=pk([-3,-2,-1,1,2,3]); guard++; }
      if(Math.abs(m1*px+k1)>6){ m1=1; k1=1; px=2; }
      w2R.push({ goal:goals[i], m1:m1, k1:k1, px:px, py:m1*px+k1 });
    }
  })();
  widget(
    '<div class="stag">'+L({es:'Taller de rectas',en:'Line workshop'})+'</div>'+
    '<h2>'+L({es:'Coloca la segunda recta donde te pidan',en:'Put the second line where you are asked'})+'</h2>'+
    '<p>'+L({es:'La recta verde ya está fija. La dorada es tuya: los deslizadores cambian su pendiente y su ordenada, y la gráfica se redibuja mientras arrastras. El letrero de abajo te dice en todo momento qué está pasando entre las dos rectas. Consigue lo que pide cada ronda y comprueba.',
             en:'The green line is already fixed. The gold one is yours: the sliders change its slope and its intercept, and the graph redraws as you drag. The readout below tells you at every moment what is happening between the two lines. Achieve what each round asks for and check.'})+'</p>'+
    '<div class="gcrd">'+

  (function(){

      if(c.m!==d.m1){

      document.getElementById('w2f2').textContent=ymx(c.m,c.b).replace(/−/g,'-');

      } else {

  })();

  (function(){

                    : (tipo==='ninguno' ? ('La segunda ecuación tiene los coeficientes de la primera multiplicados por '+num(t)+', pero el número de la derecha sería '+num(t*c1)+' y aparece '+num(c2)+'. Misma inclinación, distinta altura: paralelas.')

  var w3R = [];

      var a=pk([1,2,3,-2]), b=pk([1,2,-1,3]), g=0, q=m*p+k, c=a*p+b*q;

        a=pk([1,2,3,-2]); b=pk([1,2,-1,3]); q=m*p+k; c=a*p+b*q; g++;
      }

        L({es:'un ticket de '+d.n1+' '+L(d.ctx.as)+' y '+d.n2+' '+L(d.ctx.bs)+', y otro de '+d.n3+' '+L(d.ctx.as)+' y '+d.n4+' '+L(d.ctx.bs)+'.',
           en:'one receipt for '+d.n1+' '+L(d.ctx.as)+' and '+d.n2+' '+L(d.ctx.bs)+', and another for '+d.n3+' '+L(d.ctx.as)+' and '+d.n4+' '+L(d.ctx.bs)+'.'});
      document.getElementById('w4t1').textContent=L({es:'Ticket 1: pagó ',en:'Receipt 1: paid '})+d.T1;
      document.getElementById('w4t2').textContent=L({es:'Ticket 2: pagó ',en:'Receipt 2: paid '})+d.T2;
      document.getElementById('w4rd').textContent=L({es:'Ronda ',en:'Round '})+(r+1)+L({es:' de 3',en:' of 3'});
    }
    function nextRound(){
      r++; tries=0;
      if(r>=3){
        done=true;
        var b=document.getElementById('w4chk'); b.disabled=true; b.style.opacity='.55';
        document.getElementById('w4rd').textContent=L({es:'3 de 3 completadas',en:'3 of 3 completed'});
        return;
      }
      pa.value=10; pb.value=5; goal(); upd();
    }
    function check(){
      if(done) return;
      var d=cur(), x=parseInt(pa.value,10), y=parseInt(pb.value,10);
      var v1=d.n1*x+d.n2*y, v2=d.n3*x+d.n4*y;
      if(x===d.A && y===d.B){
        fbSet('w4fb', true, L({es:'Los dos tickets cuadran a la vez. Ese par de precios es la solución del sistema '+d.n1+L(d.ctx.la)+' + '+d.n2+L(d.ctx.lb)+' = '+d.T1+' y '+d.n3+L(d.ctx.la)+' + '+d.n4+L(d.ctx.lb)+' = '+d.T2+'.',
                               en:'Both receipts match at once. That pair of prices is the solution of the system '+d.n1+L(d.ctx.la)+' + '+d.n2+L(d.ctx.lb)+' = '+d.T1+' and '+d.n3+L(d.ctx.la)+' + '+d.n4+L(d.ctx.lb)+' = '+d.T2+'.'}));
        setTimeout(nextRound, 1200);
        return;
      }
      tries++;
      if(tries>=3){
        fbSet('w4fb', false, L({es:'Los precios eran '+d.A+' y '+d.B+'. Comprobación: '+d.n1+'('+d.A+') + '+d.n2+'('+d.B+') = '+d.T1+' y '+d.n3+'('+d.A+') + '+d.n4+'('+d.B+') = '+d.T2+'.',
                                en:'The prices were '+d.A+' and '+d.B+'. Check: '+d.n1+'('+d.A+') + '+d.n2+'('+d.B+') = '+d.T1+' and '+d.n3+'('+d.A+') + '+d.n4+'('+d.B+') = '+d.T2+'.'}));
        setTimeout(nextRound, 2100);
        return;
      }
      var m1 = (v1===d.T1) ? L({es:'el ticket 1 ya cuadra',en:'receipt 1 already matches'}) : (v1<d.T1 ? L({es:'al ticket 1 le faltan '+(d.T1-v1),en:'receipt 1 is short by '+(d.T1-v1)}) : L({es:'el ticket 1 se pasa por '+(v1-d.T1),en:'receipt 1 overshoots by '+(v1-d.T1)}));
      var m2 = (v2===d.T2) ? L({es:'el ticket 2 ya cuadra',en:'receipt 2 already matches'}) : (v2<d.T2 ? L({es:'al ticket 2 le faltan '+(d.T2-v2),en:'receipt 2 is short by '+(d.T2-v2)}) : L({es:'el ticket 2 se pasa por '+(v2-d.T2),en:'receipt 2 overshoots by '+(v2-d.T2)}));
      fbSet('w4fb', false, L({es:'Todavía no: '+m1+' y '+m2+'. Si uno cuadra y el otro no, mueve los dos precios en sentidos contrarios.',
                             en:'Not yet: '+m1+' and '+m2+'. If one matches and the other does not, move the two prices in opposite directions.'}));
      pa.value=10; pb.value=5; upd();
    }
    pa.addEventListener('input', upd);
    pb.addEventListener('input', upd);
    document.getElementById('w4chk').addEventListener('click', check);
    goal(); upd();
  })();

  /* ── PROBLEMA 7 ── */
  (function(){
    var ctx=pk(CTX);
    var n1=ri(2,4), n2=ri(2,3), n3=ri(2,5), n4=ri(2,4), g=0;
    while(n1*n4-n3*n2===0 && g<40){ n3=ri(2,5); n4=ri(2,4); g++; }
    if(n1*n4-n3*n2===0){ n3=n1+1; n4=n2+2; }
    var A=pk([12,15,18,20,25,30]), B=pk([4,5,6,8,10]);
    var T1=n1*A+n2*B, T2=n3*A+n4*B;
    var la=L(ctx.la), lb=L(ctx.lb);
    var sist = n1+la+' + '+n2+lb+' = '+T1+L({es:' y ',en:' and '})+n3+la+' + '+n4+lb+' = '+T2;
    var askA = (Math.floor(rng()*2)===0);
    addProb({
      title: L({es:'Dos compras, dos precios', en:'Two purchases, two prices'}),
      q: askA ? L({es:'En '+L(ctx.place)+', '+n1+' '+L(ctx.as)+' y '+n2+' '+L(ctx.bs)+' cuestan '+T1+' pesos. Otra persona paga '+T2+' pesos por '+n3+' '+L(ctx.as)+' y '+n4+' '+L(ctx.bs)+'. Todos los artículos iguales tienen el mismo precio. ¿Cuánto cuesta un '+L(ctx.a)+'?',
                   en:'At '+L(ctx.place)+', '+n1+' '+L(ctx.as)+' and '+n2+' '+L(ctx.bs)+' cost '+T1+' pesos. Another person pays '+T2+' pesos for '+n3+' '+L(ctx.as)+' and '+n4+' '+L(ctx.bs)+'. All identical items have the same price. How much does one '+L(ctx.a)+' cost?'})
              : L({es:'En '+L(ctx.place)+', '+n1+' '+L(ctx.as)+' y '+n2+' '+L(ctx.bs)+' cuestan '+T1+' pesos. Otra persona paga '+T2+' pesos por '+n3+' '+L(ctx.as)+' y '+n4+' '+L(ctx.bs)+'. Todos los artículos iguales tienen el mismo precio. ¿Cuánto cuesta un '+L(ctx.b)+'?',
                   en:'At '+L(ctx.place)+', '+n1+' '+L(ctx.as)+' and '+n2+' '+L(ctx.bs)+' cost '+T1+' pesos. Another person pays '+T2+' pesos for '+n3+' '+L(ctx.as)+' and '+n4+' '+L(ctx.bs)+'. All identical items have the same price. How much does one '+L(ctx.b)+' cost?'}),
      fn: '',
      options: optsN(askA?A:B, [askA?B:A, A+B, (askA?A:B)+5, (askA?A:B)-3, Math.abs(A-B)]), correct: num(askA?A:B), showWork:true,
      hint: L({es:'Nombra con una letra el precio de cada artículo y convierte cada compra en una ecuación. Luego despeja una letra en la ecuación donde sea más sencillo y llévala a la otra.',
               en:'Name the price of each item with a letter and turn each purchase into an equation. Then solve for one letter in whichever equation is simpler and carry it into the other.'}),
      exp: L({es:'Con '+la+' el precio de un '+L(ctx.a)+' y '+lb+' el de un '+L(ctx.b)+', el sistema es '+sist+'. Al resolverlo por sustitución sale '+(askA?(lb+' = '+B+' y de ahí '+la+' = '+A):(la+' = '+A+' y de ahí '+lb+' = '+B)),
              en:'With '+la+' the price of one '+L(ctx.a)+' and '+lb+' the price of one '+L(ctx.b)+', the system is '+sist+'. Solving it by substitution gives '+(askA?(lb+' = '+B+' and from there '+la+' = '+A):(la+' = '+A+' and from there '+lb+' = '+B))})
    });
  })();

  /* ── PROBLEMA 8 ── */
  (function(){
    var tipo=pk(['ruedas','monedas','entradas']);
    var q, exp, corr, cands, titulo;
    if(tipo==='ruedas'){
      var mot=ri(5,14), aut=ri(6,15), V=mot+aut, R=2*mot+4*aut;
      titulo=L({es:'Vehículos y ruedas', en:'Vehicles and wheels'});
      q=L({es:'En un estacionamiento hay solo motocicletas y automóviles: '+V+' vehículos en total. Si se cuentan las ruedas de todos ellos se llega a '+R+'. Cada motocicleta tiene dos ruedas y cada automóvil cuatro. ¿Cuántos automóviles hay?',
           en:'A parking lot holds only motorcycles and cars: '+V+' vehicles in all. Counting the wheels of every one of them reaches '+R+'. Each motorcycle has two wheels and each car has four. How many cars are there?'});
      corr=aut; cands=[mot, V, aut+2, aut-3, R-V];
      exp=L({es:'Con m motocicletas y a automóviles: m + a = '+V+' y 2m + 4a = '+R+'. Despejando m = '+V+' − a y sustituyendo: 2('+V+' − a) + 4a = '+R+', es decir 2a = '+(R-2*V)+', por lo que a = '+aut,
             en:'With m motorcycles and c cars: m + c = '+V+' and 2m + 4c = '+R+'. Solving m = '+V+' − c and substituting: 2('+V+' − c) + 4c = '+R+', that is 2c = '+(R-2*V)+', so c = '+aut});
    } else if(tipo==='monedas'){
      var c5=ri(6,16), c10=ri(5,15), N=c5+c10, M=5*c5+10*c10;
      titulo=L({es:'Monedas en la alcancía', en:'Coins in the piggy bank'});
      q=L({es:'Una alcancía guarda únicamente monedas de 5 y de 10 pesos: '+N+' monedas que suman '+M+' pesos. ¿Cuántas monedas de 10 pesos hay?',
           en:'A piggy bank holds only 5 and 10 peso coins: '+N+' coins adding up to '+M+' pesos. How many 10 peso coins are there?'});
      corr=c10; cands=[c5, N, c10+3, c10-2, M/5];
      exp=L({es:'Con a monedas de 5 y b monedas de 10: a + b = '+N+' y 5a + 10b = '+M+'. Despejando a = '+N+' − b y sustituyendo: 5('+N+' − b) + 10b = '+M+', es decir 5b = '+(M-5*N)+', por lo que b = '+c10,
             en:'With a five peso coins and b ten peso coins: a + b = '+N+' and 5a + 10b = '+M+'. Solving a = '+N+' − b and substituting: 5('+N+' − b) + 10b = '+M+', that is 5b = '+(M-5*N)+', so b = '+c10});
    } else {
      var ad=ri(9,20), ni=ri(8,20), E=ad+ni, T=40*ad+25*ni;
      titulo=L({es:'Entradas de la función', en:'Tickets for the show'});
      q=L({es:'En una función escolar se vendieron '+E+' entradas y se recaudaron '+T+' pesos. La entrada de adulto costaba 40 pesos y la de estudiante 25 pesos. ¿Cuántas entradas de adulto se vendieron?',
           en:'A school show sold '+E+' tickets and collected '+T+' pesos. An adult ticket cost 40 pesos and a student ticket 25 pesos. How many adult tickets were sold?'});
      corr=ad; cands=[ni, E, ad+4, ad-2, E-ad+1];
      exp=L({es:'Con a entradas de adulto y e de estudiante: a + e = '+E+' y 40a + 25e = '+T+'. Despejando e = '+E+' − a y sustituyendo: 40a + 25('+E+' − a) = '+T+', es decir 15a = '+(T-25*E)+', por lo que a = '+ad,
             en:'With a adult tickets and s student tickets: a + s = '+E+' and 40a + 25s = '+T+'. Solving s = '+E+' − a and substituting: 40a + 25('+E+' − a) = '+T+', that is 15a = '+(T-25*E)+', so a = '+ad});
    }
    addProb({
      title: titulo,
      q: q, fn: '',
      options: optsN(corr, cands), correct: num(corr), showWork:true,
      hint: L({es:'Asigna una letra a cada grupo que se cuenta. Una frase da el total de elementos y la otra el total acumulado; cada una se convierte en una ecuación y el sistema se resuelve por sustitución.',
               en:'Give a letter to each group being counted. One sentence gives the total number of items and the other the accumulated total; each becomes an equation and the system is solved by substitution.'}),
      exp: exp
    });
  })();

  /* ══════════════════════════════════════════════════════════════════
     CIERRE — últimos problemas
     ══════════════════════════════════════════════════════════════════ */
  sec(L({es:'Cierre', en:'Wrap-up'}),
      L({es:'Las dos rutas, un mismo par', en:'Two routes, one same pair'}),
    '<p>'+L({es:'Aquí se juntan la ruta del dibujo y la del álgebra. Cada quien elige por dónde entrar.',
             en:'Here the drawing route and the algebra route come together. Everyone picks their way in.'})+'</p>');

  /* ── PROBLEMA 9 ── */
  (function(){
    var s = mkSys(-4,5,true);
    if(Math.floor(rng()*2)===0){
      var yex = lin(-s.b1*s.a1, s.b1*s.c1);
      var A = s.a2 - s.b2*s.b1*s.a1, B = s.c2 - s.b2*s.b1*s.c1;
      addProb({
        title: L({es:'Resolver y comprobar', en:'Solve and check'}),
        q: L({es:'Encuentra el par que vuelve verdaderas las dos ecuaciones de este sistema. ¿Cuál es?',
              en:'Find the pair that makes both equations of this system true. Which is it?'}),
        fn: s.txt(),
        options: optsP(s.p,s.q,[[s.q,s.p],[s.p+2,s.q-1],[s.p-1,s.q+2],[s.p,s.q-3],[s.p+1,s.q+1]]), correct: P(s.p,s.q), showWork:true,
        hint: L({es:'Elige la ecuación donde una letra queda sola con más facilidad, despéjala y llévala a la otra. Al final comprueba el par en las dos ecuaciones.',
                 en:'Pick the equation where one letter comes out on its own most easily, solve for it and carry it into the other. At the end check the pair in both equations.'}),
        exp: L({es:'Despejando en la primera, y = '+yex+'. Al sustituir en la segunda queda '+num(A)+'x = '+num(B)+', así que x = '+num(s.p)+' y y = '+num(s.q)+'. Comprobación: '+ev(s.a2,s.p,s.b2,s.q)+' = '+num(s.c2)+'.',
                en:'Solving the first one, y = '+yex+'. Substituting into the second leaves '+num(A)+'x = '+num(B)+', so x = '+num(s.p)+' and y = '+num(s.q)+'. Check: '+ev(s.a2,s.p,s.b2,s.q)+' = '+num(s.c2)+'.'})
      });
    } else {
      function sysFor(x,y){
        var a1=pk([1,2,3,-1]), b1=pk([1,-1,2]), a2=pk([2,3,-2,1]), b2=pk([-1,3,1,-2]), g=0;
        while(a1*b2-a2*b1===0 && g<40){ a2=pk([2,3,-2,1]); b2=pk([-1,3,1,-2]); g++; }
        if(a1*b2-a2*b1===0){ a2=a1+2; b2=b1-1; }
        return eqS(a1,b1,a1*x+b1*y)+SEP+eqS(a2,b2,a2*x+b2*y);
      }
      var corr = sysFor(s.p,s.q);
      var alt = (s.p===s.q) ? [s.p+2,s.q+1] : [s.q,s.p];
      var cands = [ sysFor(s.p+1,s.q), sysFor(s.p,s.q-2), sysFor(alt[0],alt[1]), sysFor(s.p-1,s.q+1) ];
      addProb({
        title: L({es:'El sistema que le corresponde', en:'The system it belongs to'}),
        q: L({es:'Solo uno de estos sistemas tiene como solución el par '+P(s.p,s.q)+'. ¿Cuál es?',
              en:'Only one of these systems has the pair '+P(s.p,s.q)+' as its solution. Which one?'}),
        fn: '',
        options: opts4(corr, cands), correct: corr, showWork:true,
        hint: L({es:'No hace falta resolver ninguno: sustituye los dos valores del par en cada sistema y quédate con aquel en el que las dos ecuaciones den el número que aparece a la derecha.',
                 en:'There is no need to solve any of them: substitute both values of the pair into each system and keep the one where both equations give the number shown on the right.'}),
        exp: L({es:'Con x = '+num(s.p)+' y y = '+num(s.q)+', el sistema correcto devuelve los dos totales que muestra a la derecha. En los demás falla al menos una de las ecuaciones, y basta con eso para descartarlos.',
                en:'With x = '+num(s.p)+' and y = '+num(s.q)+', the correct system returns both totals shown on its right. In the others at least one equation fails, and that alone rules them out.'})
      });
    }
  })();

  /* ── PROBLEMA 10 ── */
  (function(){
    if(Math.floor(rng()*2)===0){
      var pb=pk([90,110,120,140]), pc=pk([35,40,45,50]);
      var n1=ri(2,4), n2=ri(2,4), n3=ri(3,6), n4=ri(2,5), g=0;
      while(n1*n4-n3*n2===0 && g<40){ n3=ri(3,6); n4=ri(2,5); g++; }
      if(n1*n4-n3*n2===0){ n3=n1+2; n4=n2+1; }
      var T1=n1*pb+n2*pc, T2=n3*pb+n4*pc;
      var corr = n1+'b + '+n2+'c = '+T1+SEP+n3+'b + '+n4+'c = '+T2;
      var cands = [
        n2+'b + '+n1+'c = '+T1+SEP+n4+'b + '+n3+'c = '+T2,
        n1+'b + '+n2+'c = '+T2+SEP+n3+'b + '+n4+'c = '+T1,
        n1+'b + '+n3+'c = '+T1+SEP+n2+'b + '+n4+'c = '+T2,
        (n1+n2)+'b + '+(n3+n4)+'c = '+T1+SEP+'b + c = '+T2
      ];
      addProb({
        title: L({es:'Del enunciado al sistema', en:'From the wording to the system'}),
        q: L({es:'Una escuela compró '+n1+' balones y '+n2+' cuerdas para saltar y pagó '+T1+' pesos. Semanas después compró '+n3+' balones y '+n4+' cuerdas del mismo tipo y pagó '+T2+' pesos. Si b representa el precio de un balón y c el de una cuerda, ¿cuál sistema representa la situación?',
              en:'A school bought '+n1+' balls and '+n2+' jump ropes and paid '+T1+' pesos. Weeks later it bought '+n3+' balls and '+n4+' ropes of the same kind and paid '+T2+' pesos. If b stands for the price of one ball and c for the price of one rope, which system represents the situation?'}),
        fn: '',
        options: opts4(corr, cands), correct: corr, showWork:false,
        hint: L({es:'Cada compra da una ecuación. En cada una, el número de artículos multiplica al precio de ese mismo artículo, y el resultado es lo que se pagó en esa compra.',
                 en:'Each purchase gives one equation. In each of them the number of items multiplies the price of that same item, and the result is what was paid in that purchase.'}),
        exp: L({es:'La primera compra son '+n1+' balones a b pesos más '+n2+' cuerdas a c pesos, con total '+T1+'. La segunda son '+n3+' balones y '+n4+' cuerdas, con total '+T2+'. Intercambiar los coeficientes o los totales describe compras que no ocurrieron.',
                en:'The first purchase is '+n1+' balls at b pesos plus '+n2+' ropes at c pesos, totalling '+T1+'. The second is '+n3+' balls and '+n4+' ropes, totalling '+T2+'. Swapping the coefficients or the totals describes purchases that never happened.'})
      });
    } else {
      var gal=ri(12,24), con=ri(7,16), TA=gal+con, PT=2*gal+4*con;
      var corrB = 'g + c = '+TA+SEP+'2g + 4c = '+PT;
      var candsB = [
        'g + c = '+PT+SEP+'2g + 4c = '+TA,
        '2g + 4c = '+TA+SEP+'g + c = '+PT,
        '4g + 2c = '+PT+SEP+'g + c = '+TA,
        'g + c = '+TA+SEP+'4g + 2c = '+PT
      ];
      addProb({
        title: L({es:'Animales y patas', en:'Animals and legs'}),
        q: L({es:'En una granja escolar hay gallinas y conejos: '+TA+' animales en total y '+PT+' patas contadas entre todos. Cada gallina tiene dos patas y cada conejo cuatro. Si g representa el número de gallinas y c el de conejos, ¿cuál sistema representa la situación?',
              en:'A school farm has hens and rabbits: '+TA+' animals in all and '+PT+' legs counted among them. Each hen has two legs and each rabbit four. If g stands for the number of hens and c for the number of rabbits, which system represents the situation?'}),
        fn: '',
        options: opts4(corrB, candsB), correct: corrB, showWork:false,
        hint: L({es:'Una ecuación cuenta animales y la otra cuenta patas. Revisa que en cada ecuación las unidades sean las mismas de los dos lados del signo igual.',
                 en:'One equation counts animals and the other counts legs. Check that in each equation the units are the same on both sides of the equals sign.'}),
        exp: L({es:'El conteo de animales da g + c = '+TA+'. El conteo de patas da 2g + 4c = '+PT+', porque cada gallina aporta dos y cada conejo cuatro. Cambiar los totales de lugar mezcla animales con patas y la ecuación pierde sentido.',
                en:'Counting animals gives g + c = '+TA+'. Counting legs gives 2g + 4c = '+PT+', because each hen contributes two and each rabbit four. Swapping the totals mixes animals with legs and the equation stops meaning anything.'})
      });
    }
  })();
}
</script>

<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbykkuJ_apGq3vALIFd4mr3acu81c7K4OKxW-DZ-i52Ceyl3lOanXMdvbS9SIXPrLQBm/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'Sistemas de Ecuaciones: Gráfico y Sustitución';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
