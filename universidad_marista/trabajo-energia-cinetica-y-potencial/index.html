<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trabajo, Energía Cinética y Potencial</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS - INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }

/* ── WIDGET CHROME (concept manipulatives) ── */
.iwbox { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; padding:1.1rem; }
.iw-tag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:700; margin-bottom:.35rem; }
.iw-sub { font-size:.86rem; color:var(--text2); margin-bottom:.75rem; }
.rfb { font-size:.84rem; color:var(--text2); min-height:1.35rem; margin-top:.6rem; line-height:1.5; }
.rfb b { color:var(--green-dark); }
.okmsg { color:var(--ok); font-weight:700; }
.rverify-btn { min-height:44px; padding:.55rem 1.1rem; border:none; border-radius:8px; background:var(--green); color:#fff; font-size:.85rem; font-weight:600; cursor:pointer; font-family:inherit; margin-top:.6rem; }
.rverify-btn:hover { background:var(--green-dark); }
.wprog { font-family:'IBM Plex Mono',monospace; font-size:.7rem; color:var(--text3); letter-spacing:.08em; text-transform:uppercase; margin-bottom:.45rem; }
.wgoal { font-size:.84rem; color:var(--text2); background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.55rem .75rem; margin:.45rem 0 .7rem; }
.wgoal b { color:var(--green-dark); font-family:'IBM Plex Mono',monospace; }

/* ── SLIDER CONTROLS ── */
.ctrl { display:flex; align-items:center; gap:.6rem; margin:.4rem 0; flex-wrap:wrap; }
.ctrl-lbl { font-size:.76rem; color:var(--text3); min-width:104px; }
.ctrl-rng { flex:1; min-width:130px; accent-color:var(--green); height:44px; }
.ctrl-val { font-family:'IBM Plex Mono',monospace; font-weight:700; color:var(--green); min-width:78px; text-align:right; font-size:.92rem; }
.seg { display:flex; flex-wrap:wrap; gap:.4rem; margin:.5rem 0; }
.seg-btn { min-height:44px; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text2); font-size:.78rem; font-weight:600; cursor:pointer; font-family:inherit; padding:.45rem .7rem; }
.seg-btn.on { background:var(--green); color:#fff; border-color:var(--green); }
.seg-btn:hover { border-color:var(--green); }

/* ── READOUTS AND BARS ── */
.readout { text-align:center; font-family:'IBM Plex Mono',monospace; font-size:1.5rem; font-weight:700; margin:.5rem 0 .15rem; color:var(--text); }
.readout.pos { color:var(--ok); }
.readout.neg { color:var(--bad); }
.readout.zero { color:var(--text3); }
.rdlbl { text-align:center; font-size:.68rem; letter-spacing:.1em; text-transform:uppercase; color:var(--text3); }
.sbar { position:relative; height:20px; background:var(--surface2); border-radius:6px; margin:.6rem 0 .2rem; overflow:hidden; }
.sbar-zero { position:absolute; left:50%; top:0; bottom:0; width:2px; background:var(--border); }
.sbar-fill { position:absolute; top:3px; bottom:3px; border-radius:4px; transition:width .2s, left .2s; }
.sbar-fill.pos { background:var(--ok); }
.sbar-fill.neg { background:var(--bad); }
.bars { margin-top:.75rem; }
.bar-row { display:flex; align-items:center; gap:.5rem; margin-bottom:.34rem; }
.bar-name { font-size:.72rem; color:var(--text3); min-width:118px; }
.bar-track { flex:1; background:var(--surface2); border-radius:5px; height:16px; overflow:hidden; min-width:50px; }
.bar-fill { height:100%; border-radius:5px; transition:width .25s; background:var(--green); }
.bar-fill.ec { background:var(--gold); }
.bar-fill.em { background:var(--green-dark); }
.bar-num { font-family:'IBM Plex Mono',monospace; font-size:.74rem; min-width:80px; text-align:right; color:var(--text2); }

/* ── CLASSIFIER ── */
.cls-card { background:var(--surface2); border:1.5px solid var(--border); border-radius:10px; padding:.9rem; text-align:center; font-weight:600; font-size:.9rem; margin:.6rem 0; color:var(--text); }
.cls-bins { display:grid; grid-template-columns:repeat(3,1fr); gap:.5rem; }
.cls-bin { min-height:44px; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.82rem; font-weight:600; cursor:pointer; font-family:inherit; padding:.5rem; }
.cls-bin:hover { border-color:var(--green); color:var(--green); }
.cls-done { font-weight:700; color:var(--ok); text-align:center; padding:.6rem; }

/* ── VERTICAL HEIGHT SCALE ── */
.vscale { position:relative; height:180px; border-left:2px solid var(--border); margin:1.4rem 0 1rem 1.5rem; }
.vs-ref { position:absolute; left:0; right:0; border-top:2px dashed var(--gold); }
.vs-reflbl { position:absolute; right:0; transform:translateY(-1.25rem); font-size:.68rem; color:var(--gold); }
.vs-obj { position:absolute; left:-10px; width:20px; height:20px; border-radius:4px; background:var(--green); }
.vs-objlbl { position:absolute; left:18px; transform:translateY(-.2rem); font-size:.72rem; color:var(--text2); font-family:'IBM Plex Mono',monospace; }
.vs-ground { position:absolute; left:-2px; right:0; bottom:0; border-top:2px solid var(--border); }

/* ── RAMP ── */
.ramp-svg { width:100%; height:auto; display:block; margin:.2rem 0 .4rem; }
.rk-track { stroke:var(--green); stroke-width:3; fill:none; }
.rk-ground { stroke:var(--border); stroke-width:2; }
.rk-cart { fill:var(--gold); }
.rk-drop { stroke:var(--border); stroke-width:1; stroke-dasharray:3 3; }
.rk-txt { fill:var(--text3); font-size:9px; font-family:'IBM Plex Mono',monospace; }

@media (max-width: 600px) {
  .cls-bins { grid-template-columns:1fr; }
  .ctrl-lbl { min-width:82px; font-size:.72rem; }
  .ctrl-val { min-width:64px; font-size:.84rem; }

/* ── Drawing palette, derived from the school's colours (Rule 16) ─────────
   slots 1-2 : school primary + accent
   slots 3-4 : the two of black/red/blue/green least similar to the school colours
   Falls back to neutral defaults if SCHOOL colours can't be parsed.
   ───────────────────────────────────────────────────────────────────── */
var DRAW_PALETTE = (function () {
  function hex2rgb(h) {
    h = String(h).replace('#', '');
    if (h.length === 3) { h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2]; }
    return [parseInt(h.substr(0,2),16), parseInt(h.substr(2,2),16), parseInt(h.substr(4,2),16)];
  }
  function dist(a, b) {
    var dr = a[0]-b[0], dg = a[1]-b[1], db = a[2]-b[2];
    return Math.sqrt(2*dr*dr + 4*dg*dg + 3*db*db);
  }
  var COMMON = ['#1a1a16', '#c0392b', '#1d4e89', '#1a7a3a'];  /* black, red, blue, green */
  var schoolRGB;
  try {
    schoolRGB = [hex2rgb(SCHOOL.primary), hex2rgb(SCHOOL.accent)];
  } catch (e) {
    return [SCHOOL.primary, SCHOOL.accent, '#1a1a16', '#1d4e89'];
  }
  var scored = COMMON.map(function (c, idx) {
    var rgb = hex2rgb(c);
    var nearest = Math.min(dist(rgb, schoolRGB[0]), dist(rgb, schoolRGB[1]));
    return { c: c, idx: idx, d: nearest };
  });
  scored.sort(function (a, b) { return b.d - a.d; });      /* farthest first */
  var keep = scored.slice(0, 2);
  keep.sort(function (a, b) { return a.idx - b.idx; });    /* restore visual order */
  return [SCHOOL.primary, SCHOOL.accent, keep[0].c, keep[1].c];
})();

           '" style="background:' + c + '"></div>';
  }).join('');
}

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = DRAW_PALETTE[0];   // matches the first (selected) dot = SCHOOL.primary
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER - two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm - used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;

}

async function generatePDF() {
  var btn = document.getElementById('dlBtn');
  btn.textContent = 'Generando PDF…';
  btn.disabled = true;

  var jspdf   = window.jspdf;
  var doc     = new jspdf.jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });
  var PW      = 215.9;
  var M       = 18;
  var TW      = PW - M * 2;
  var PH      = doc.internal.pageSize.height;
  var name    = studentData.name;
  var group   = studentData.group;
  var total   = problems.length;
  var pct     = Math.round(correctCount / total * 100);
  var dateStr = new Date().toLocaleString('es-MX', { dateStyle:'long', timeStyle:'short' });

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS - INJECTION BLOCK ─────────────────────────────────────────
  //   Match these RGB values to --green and --gold above.
  //   PRIMARY  → pBR, pBG, pBB

  // ── SAVE / SHARE - iOS-safe download (LIAXA iOS PDF fix, Rule 12) ─────────
  //   iOS Safari ignores the <a download> attribute (and doc.save() relies on
  //   it), so on iPhone/iPad a plain download fails silently. We branch:
  //     • iOS  → native share sheet (→ "Save to Files"); if unavailable, open
  //              the PDF inline so the student can tap Safari's own Share.
  //     • else → <a download> click (works on desktop + Android).
  //   The whole function runs synchronously off the tap (no await above), which
  //   is what lets iOS accept navigator.share(). Do NOT add an await before this.
  // ──────────────────────────────────────────────────────────────────────────
  var _fname   = 'cneyt3_t01_g01_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf';
  var _pdfBlob = doc.output('blob');

  function _restorePdfBtn(){ btn.innerHTML = '⬇ &nbsp;' + t('btn-pdf'); btn.disabled = false; }
  function _openPdfInline(b){
    var u = URL.createObjectURL(b);
    var w = window.open(u, '_blank');
    if (!w) { window.location.href = u; }   // popup blocked → same tab
    setTimeout(function(){ URL.revokeObjectURL(u); }, 60000);
  }

  // iPadOS 13+ reports as "MacIntel" with a touch screen, so test for that too.
  var _isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
               (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  if (_isIOS) {
    var _pdfFile = new File([_pdfBlob], _fname, { type:'application/pdf' });
    if (navigator.canShare && navigator.canShare({ files:[_pdfFile] })) {
      navigator.share({ files:[_pdfFile], title:_fname })
        .then(_restorePdfBtn)
        .catch(function(e){
          if (e && e.name === 'AbortError') { _restorePdfBtn(); return; } // cancelled
          _openPdfInline(_pdfBlob); _restorePdfBtn();
        });
      return;
    }
    _openPdfInline(_pdfBlob); _restorePdfBtn();   // older iOS: open inline
    return;
  }

  // Desktop + Android: the native download works.
  var _dlUrl = URL.createObjectURL(_pdfBlob);
  var _dlA   = document.createElement('a');
  _dlA.href  = _dlUrl; _dlA.download = _fname;
  document.body.appendChild(_dlA); _dlA.click();
  setTimeout(function(){ document.body.removeChild(_dlA); URL.revokeObjectURL(_dlUrl); }, 200);
  _restorePdfBtn();
}

/* ================================================
   buildLesson : content of this guide
   ================================================ */
function buildLesson(rng) {
  var LB = document.getElementById('lessonBody');
  LB.innerHTML = '';
  problems = [];

  var G = 9.8;

  /* ---------------- helpers ---------------- */
  function T(o){
    if (o === undefined || o === null) return '';
    if (typeof o === 'string' || typeof o === 'number') return o;
    if (Object.prototype.toString.call(o) === '[object Array]') return o;
    return (o[LANG] !== undefined ? o[LANG] : o.es);
  }
  function ri(a,b){ return a + Math.floor(rng()*(b-a+1)); }
  function pk(a){ return a[Math.floor(rng()*a.length)]; }
  function shufA(a){
    var b = a.slice(), i, j, t;
    for (i=b.length-1;i>0;i--){ j=Math.floor(rng()*(i+1)); t=b[i]; b[i]=b[j]; b[j]=t; }
    return b;
  }
  function rnd2(x){ return Math.round(x*100)/100; }
  function nf(x){
    var r = rnd2(x);
    if (Math.abs(r) < 1e-9) r = 0;
    return (r < 0 ? '−' : '') + String(Math.abs(r));
  }
  function jf(x){ return nf(x)+' J'; }
  function frac(a,b){
    return '<span class="mf-outer"><span class="mf-num">'+a+'</span><span class="mf-den">'+b+'</span></span>';
  }
  function sec(tag,title,html){
    var d = document.createElement('div');
    d.className = 'section';
    d.innerHTML = '<div class="stag">'+tag+'</div><h2>'+title+'</h2>'+(html||'');
    LB.appendChild(d);
    return d;
  }
  function widget(kind){
    var d = document.createElement('div');
    d.className = kind + 'wrap section';
    d.setAttribute('data-widget', kind);
    d.id = 'w' + kind;
    LB.appendChild(d);
    return d;
  }
  function rcard(name, form, note){
    return '<div class="rcard"><div class="rname">'+name+'</div><div class="rform">'+form+
           '</div><div class="rnote">'+note+'</div></div>';
  }
  function numOpts(correct, wrongs, unit){
    var vals = [rnd2(correct)], i, j, v, dup;
    for (i=0;i<wrongs.length && vals.length<4;i++){
      v = rnd2(wrongs[i]);
      if (!isFinite(v)) continue;
      dup = false;
      for (j=0;j<vals.length;j++) if (Math.abs(vals[j]-v) < 1e-9) dup = true;
      if (!dup) vals.push(v);
    }
    var k = 2, step = (Math.abs(rnd2(correct)) > 1 ? Math.abs(rnd2(correct))*0.31 : 1.7);
    while (vals.length < 4){
      v = rnd2(rnd2(correct) + k*step);
      dup = false;
      for (j=0;j<vals.length;j++) if (Math.abs(vals[j]-v) < 1e-9) dup = true;
      if (!dup) vals.push(v);
      k++;
      if (k > 40) break;
    }
    var strs = vals.map(function(v){ return nf(v)+' '+unit; });
    return { options: strs, correct: strs[0] };
  }
  function addProb(spec){
    var so  = shufA(T(spec.options));
    var cor = T(spec.correct);
    problems.push({
      title: T(spec.title),
      questionText: T(spec.q),
      fn: T(spec.fn) || '',
      hint: T(spec.hint),
      explanation: T(spec.exp),
      options: so,
      correctIdx: so.indexOf(cor),
      showWork: !!spec.showWork,
      studentChoice: null,
      pendingChoice: null
    });
    buildOneCard(problems[problems.length-1], problems.length-1);
  }
  var GDATA = { es:'g = 9.8 m/s²', en:'g = 9.8 m/s²' };

  /* ============================================================
     SEEDED DATA (drawn once, in a fixed order)
     ============================================================ */
  var vb = [];
  (function(){ var i; for (i=0;i<10;i++) vb.push(Math.floor(rng()*2)); })();

  /* widget 1: work meter */
  var W1ANG = [0,60,90,120,180];
  var W1COS = [1,0.5,0,-0.5,-1];
  var w1R = [];
  (function(){
    var guard = 0, seen = {};
    while (w1R.length < 3 && guard < 80){
      guard++;
      var f = 10*ri(2,12), d = ri(2,10), ci = ri(0,4);
      var w = f*d*W1COS[ci];
      if (seen[String(w)]) continue;
      seen[String(w)] = 1;
      w1R.push({ w:w, f:f, d:d, ci:ci });
    }
    while (w1R.length < 3) w1R.push({ w:240, f:60, d:4, ci:0 });
  })();

  /* widget 2: work and kinetic energy balance */
  var w2R = [];
  (function(){
    var i;
    for (i=0;i<3;i++){
      var m  = [2,4,5,10][Math.floor(rng()*4)];
      var v0 = ri(2,5);
      var ec = 0.5*m*v0*v0;
      var f0 = 5*ri(1,8);
      var d0 = 0.5*ri(2,14);
      var s  = (rng() < 0.45) ? -1 : 1;
      if (ec + s*f0*d0 < 5) s = 1;
      w2R.push({ m:m, v0:v0, ec:rnd2(ec), tgt:rnd2(ec + s*f0*d0), f:s*f0, d:d0 });
    }
  })();

  /* widget 3: reference level */
  var w3R = [];
  (function(){
    var DH = shufA([-3,-2,-1.5,1.5,2,3]), i;
    for (i=0;i<3;i++){
      var m = (rng() < 0.5) ? 5 : 10;
      w3R.push({ m:m, dh:DH[i], tgt:rnd2(m*G*DH[i]) });
    }
  })();

  /* widget 4: track */
  var w4R = [];
  (function(){
    var PAIRS = [[2,2.5],[4,2.5],[5,2.5],[10,2.5],[5,1.6],[10,1.6],[5,3.6],[10,3.6],[5,4.9],[10,4.9]];
    var FR = shufA([0.25,0.5,0.75]), i;
    for (i=0;i<3;i++){
      var p = PAIRS[Math.floor(rng()*PAIRS.length)];
      w4R.push({ m:p[0], H:p[1], em:rnd2(p[0]*G*p[1]), fr:FR[i], tgt:rnd2(p[0]*G*p[1]*FR[i]) });
    }
  })();

  /* widget 5: sign classifier */
  var w5SEQ = shufA([0,1,2,3,4,5,6,7]).slice(0,6);

  /* P2 */
  var P2ANG = [60,120,180], P2COS = [0.5,-0.5,-1];
  var p2F = 20*ri(2,6), p2d = ri(3,8), p2ci = ri(0,2);
  var p2c = P2COS[p2ci], p2W = p2F*p2d*p2c;

  /* P3 */
  var p3m = 2*ri(1,6), p3v = ri(3,10), p3Ec = 0.5*p3m*p3v*p3v;

  /* P4 */
  var P4POOL = [[4,3,5,8,4],[2,4,8,8,6],[5,2,6,10,8],[10,3,7,40,5],[6,5,9,28,6],[8,2,6,32,4]];
  var p4 = P4POOL[Math.floor(rng()*P4POOL.length)];
  var p4m = p4[0], p4v0 = p4[1], p4vf = p4[2], p4F = p4[3], p4d = p4[4];
  var p4W = rnd2(0.5*p4m*(p4vf*p4vf - p4v0*p4v0));

  /* P5 */
  var p5m = 5*ri(1,5), p5h = ri(2,6);
  var p5h1 = ri(4,9);
  var p5h2 = p5h1 + ((rng() < 0.5) ? -1 : 1)*ri(2,3);
  if (p5h2 < 1) p5h2 = p5h1 + 2;
  var p5m2 = 5*ri(1,4);

  /* P7 */
  var HV = [[0.4,2.8],[0.9,4.2],[1.6,5.6],[2.5,7],[3.6,8.4],[4.9,9.8]];
  var p7 = HV[Math.floor(rng()*HV.length)];
  var p7h = p7[0], p7v = p7[1];

      var em = R.em*(1 - (st.fric ? 0.35*st.p/100 : 0));

        if (st.i >= 3){ finish(); return; }
        shell();
        document.getElementById('w4fb').innerHTML = T({
          es:'El carro quedó en el punto buscado. La energía cinética que gana es la misma que pierde de energía potencial al bajar.',
          en:'The cart is now at the point looked for. The kinetic energy it gains is the same it loses as potential energy on the way down.'
        });
        return;
      }
      var msg;
      if (st.fric){
        msg = T({es:'En este modo una parte de la energía se transfiere al entorno, así que el balance no llega al valor buscado. Regresa a la pista lisa.',
                 en:'In this mode part of the energy is transferred to the surroundings, so the balance does not reach the value looked for. Go back to the smooth track.'});
      } else if (s.ec < R.tgt){
        msg = T({es:'El carro todavía guarda demasiada energía en forma de altura. Déjalo bajar un poco más.',
                 en:'The cart still stores too much energy as height. Let it come down a little further.'});
      } else {
        msg = T({es:'El carro ya bajó de más y su energía cinética se pasó del valor buscado. Súbelo un poco.',
                 en:'The cart has come down too far and its kinetic energy overshot the value looked for. Raise it a little.'});
      }
      fb.textContent = msg;
    };
    shell();
  })();

  /* ---- P7 ---- */
  (function(){
    var S;
    if (vb[6] === 0){
      var o = numOpts(p7v, [Math.sqrt(G*p7h), 2*G*p7h, G*p7h, p7v/2], 'm/s');
      S = {
        title:{es:'Descenso en pista lisa', en:'Descent on a smooth track'},
        q:{es:'Un carrito se suelta desde el reposo en lo alto de una pista sin fricción, a '+nf(p7h)+' m de altura sobre el punto más bajo del recorrido. Determina la rapidez con la que pasa por ese punto más bajo.',
           en:'A cart is released from rest at the top of a frictionless track, '+nf(p7h)+' m above the lowest point of the route. Determine the speed with which it passes through that lowest point.'},
        fn:GDATA,
        options:{es:o.options, en:o.options}, correct:o.correct,
        hint:{es:'Iguala la energía potencial de la salida con la energía cinética de la llegada; al despejar la rapidez notarás que la masa se cancela.',
              en:'Equate the potential energy at the start with the kinetic energy at the arrival; when solving for the speed you will notice that the mass cancels.'},
        exp:{es:'Al igualar ambas energías se llega a que el cuadrado de la rapidez vale 2 × 9.8 × '+nf(p7h)+' = '+nf(2*G*p7h)+', cuya raíz cuadrada es '+nf(p7v)+' m/s. Quedarse en '+nf(2*G*p7h)+' entrega el cuadrado de la rapidez, y omitir el factor 2 corresponde a un balance en el que solo la mitad de la energía potencial se convierte en movimiento. La masa del carrito no interviene en el resultado.',
             en:'Equating both energies gives that the square of the speed is 2 × 9.8 × '+nf(p7h)+' = '+nf(2*G*p7h)+', whose square root is '+nf(p7v)+' m/s. Stopping at '+nf(2*G*p7h)+' delivers the square of the speed, and dropping the factor 2 corresponds to a balance in which only half of the potential energy turns into motion. The mass of the cart plays no part in the result.'},
        showWork:true };
    } else {
      var o2 = numOpts(p7h, [p7v*p7v/G, p7v*p7v/2, p7v/(2*G), 2*p7v*p7v/G], 'm');
      S = {
        title:{es:'Altura alcanzada', en:'Height reached'},
        q:{es:'Un carrito llega al punto más bajo de una pista sin fricción con una rapidez de '+nf(p7v)+' m/s y enseguida sube por ella hasta detenerse por un instante. Determina la altura que alcanza sobre ese punto más bajo.',
           en:'A cart reaches the lowest point of a frictionless track at '+nf(p7v)+' m/s and then rides up along it until it stops for an instant. Determine the height it reaches above that lowest point.'},
        fn:GDATA,
        options:{es:o2.options, en:o2.options}, correct:o2.correct,
        hint:{es:'Toda la energía cinética de la base se convierte en energía potencial en el punto más alto; despeja de esa igualdad la altura.',
              en:'All the kinetic energy at the bottom turns into potential energy at the highest point; solve that equality for the height.'},
        exp:{es:'El cuadrado de la rapidez vale '+nf(p7v*p7v)+', y al dividirlo entre 2 × 9.8 se obtiene una altura de '+nf(p7h)+' m. Dividir solo entre la gravedad, sin el factor 2, duplica el resultado; la masa del carrito no aparece porque se cancela en los dos lados del balance.',
             en:'The square of the speed is '+nf(p7v*p7v)+', and dividing it by 2 × 9.8 gives a height of '+nf(p7h)+' m. Dividing only by gravity, without the factor 2, doubles the result; the mass of the cart does not appear because it cancels on both sides of the balance.'},
        showWork:true };
    }
    addProb(S);
  })();

  /* ---- P8 ---- */
  (function(){
    var S;
    if (vb[7] === 0){
      var m = p8a[0], h = p8a[1], v = p8a[2];
      var ug = rnd2(m*G*h), ec = rnd2(0.5*m*v*v), wf = rnd2(ec - ug);
      var o = numOpts(wf, [ug - ec, -(ug + ec), -ec, -ug], 'J');
      S = {
        title:{es:'Bajada con fricción', en:'Descent with friction'},
        q:{es:'Una caja de '+m+' kg se desliza desde el reposo por una rampa cuya parte alta está a '+nf(h)+' m sobre la base, y llega a la base con una rapidez de '+v+' m/s. Determina el trabajo que la fricción realiza sobre la caja durante el descenso.',
           en:'A crate of '+m+' kg slides from rest down a ramp whose top is '+nf(h)+' m above the bottom, and reaches the bottom at '+v+' m/s. Determine the work that friction does on the crate during the descent.'},
        fn:GDATA,
        options:{es:o.options, en:o.options}, correct:o.correct,
        hint:{es:'Compara la energía mecánica al inicio con la del final: la fricción se lleva justo la diferencia entre ambas, y el orden de la resta fija el signo.',
              en:'Compare the mechanical energy at the start with the one at the end: friction takes exactly the difference between them, and the order of the subtraction fixes the sign.'},
        exp:{es:'Arriba la caja parte del reposo, así que su energía mecánica es la potencial, '+nf(m)+' × 9.8 × '+nf(h)+' = '+nf(ug)+' J. Abajo toda su energía es cinética, 0.5 × '+nf(m)+' × '+(v*v)+' = '+nf(ec)+' J. La diferencia, '+jf(wf)+', es el trabajo de la fricción: el signo negativo indica que esa energía salió del sistema y calentó las superficies en contacto.',
             en:'At the top the crate starts from rest, so its mechanical energy is the potential one, '+nf(m)+' × 9.8 × '+nf(h)+' = '+nf(ug)+' J. At the bottom all its energy is kinetic, 0.5 × '+nf(m)+' × '+(v*v)+' = '+nf(ec)+' J. The difference, '+jf(wf)+', is the work of friction: the negative sign indicates that this energy left the system and heated the surfaces in contact.'},
        showWork:true };
    } else {
      var m2 = p8b[0], v2 = p8b[1], h2 = p8b[2];
      var ec2 = rnd2(0.5*m2*v2*v2), ug2 = rnd2(m2*G*h2), wf2 = rnd2(ug2 - ec2);
      var o2 = numOpts(wf2, [ec2 - ug2, -(ug2 + ec2), -ug2, -ec2], 'J');
      S = {
        title:{es:'Subida con fricción', en:'Climb with friction'},
        q:{es:'Una caja de '+m2+' kg se lanza hacia arriba por una rampa con una rapidez inicial de '+v2+' m/s y sube hasta quedar en reposo a '+nf(h2)+' m sobre el punto de partida. Determina el trabajo que la fricción realiza sobre la caja durante el ascenso.',
           en:'A crate of '+m2+' kg is launched up a ramp with an initial speed of '+v2+' m/s and rises until it comes to rest '+nf(h2)+' m above the starting point. Determine the work that friction does on the crate during the climb.'},
        fn:GDATA,
        options:{es:o2.options, en:o2.options}, correct:o2.correct,
        hint:{es:'La energía cinética de partida se reparte en dos destinos: la energía potencial ganada y la energía que la fricción retira. Plantea el balance entre los dos estados.',
              en:'The kinetic energy at the start splits into two destinations: the potential energy gained and the energy that friction removes. Set up the balance between the two states.'},
        exp:{es:'La caja arranca con 0.5 × '+nf(m2)+' × '+(v2*v2)+' = '+nf(ec2)+' J y termina en reposo con '+nf(m2)+' × 9.8 × '+nf(h2)+' = '+nf(ug2)+' J de energía potencial. La energía mecánica final menos la inicial da '+jf(wf2)+', que es el trabajo de la fricción. Si la fricción no actuara, la caja subiría más alto y esa diferencia sería nula.',
             en:'The crate starts with 0.5 × '+nf(m2)+' × '+(v2*v2)+' = '+nf(ec2)+' J and ends at rest with '+nf(m2)+' × 9.8 × '+nf(h2)+' = '+nf(ug2)+' J of potential energy. The final mechanical energy minus the initial one gives '+jf(wf2)+', which is the work of friction. If friction did not act, the crate would climb higher and that difference would be zero.'},
        showWork:true };
    }
    addProb(S);
  })();

  /* ============================================================
     CIERRE
     ============================================================ */
  sec(T({es:'Cierre', en:'Wrap-up'}),
      T({es:'Dos situaciones para cerrar', en:'Two situations to close'}),
      '<p>'+T({
        es:'Las dos situaciones siguientes reúnen fuerza, rapidez y altura en un mismo planteamiento.',
        en:'The two situations below bring force, speed and height together in a single setting.'
      })+'</p>');

  /* ---- P9 ---- */
  (function(){
    var V = [
      { title:{es:'Al doble de rapidez', en:'At twice the speed'},
        q:{es:'Dos automóviles idénticos circulan por la misma carretera recta y el segundo lleva el doble de rapidez que el primero. Compara la energía cinética de ambos vehículos.',
           en:'Two identical cars drive along the same straight road and the second one travels at twice the speed of the first. Compare the kinetic energy of the two vehicles.'},
        options:{es:[
          'La del segundo es cuatro veces la del primero, porque la rapidez interviene elevada al cuadrado.',
          'La del segundo es el doble que la del primero, porque su rapidez es exactamente el doble.',
          'La del segundo es ocho veces la del primero, porque también su masa participa en el cálculo.',
          'Es la misma en ambos, porque los dos automóviles tienen exactamente la misma masa.'],
          en:[
          'That of the second is four times that of the first, because the speed enters squared.',
          'That of the second is twice that of the first, because its speed is exactly twice as large.',
          'That of the second is eight times that of the first, because its mass also takes part in the calculation.',
          'It is the same for both, because the two cars have exactly the same mass.']},
        correct:{es:'La del segundo es cuatro veces la del primero, porque la rapidez interviene elevada al cuadrado.',
                 en:'That of the second is four times that of the first, because the speed enters squared.'},
        hint:{es:'Escribe la energía cinética de cada automóvil y sustituye la rapidez del segundo por el doble de la del primero.',
              en:'Write the kinetic energy of each car and replace the speed of the second by twice that of the first.'},
        exp:{es:'Al duplicar la rapidez, el cuadrado que aparece en la energía cinética queda multiplicado por cuatro, mientras que la masa, idéntica en ambos vehículos, no altera la comparación. Por eso el segundo automóvil necesita una distancia de frenado cuatro veces mayor si la fuerza de frenado es la misma.',
             en:'When the speed is doubled, the square appearing in the kinetic energy is multiplied by four, while the mass, identical in both vehicles, does not alter the comparison. That is why the second car needs a braking distance four times longer if the braking force is the same.'} },
      { title:{es:'Subida sin fricción', en:'Climb without friction'},
        q:{es:'Un bloque asciende por un plano inclinado sin fricción y su rapidez disminuye de manera continua hasta que se detiene por un instante. Describe lo que ocurre con su energía mecánica durante ese ascenso.',
           en:'A block climbs a frictionless inclined plane and its speed decreases continuously until it stops for an instant. Describe what happens to its mechanical energy during that climb.'},
        options:{es:[
          'Permanece constante, porque la energía cinética que pierde reaparece como energía potencial gravitatoria.',
          'Disminuye de manera continua, porque el bloque va perdiendo rapidez a lo largo de todo el ascenso.',
          'Aumenta de manera continua, porque el bloque va ganando altura a lo largo de todo el ascenso.',
          'Permanece constante solo hasta la mitad del ascenso, cuando la energía potencial supera a la cinética.'],
          en:[
          'It stays constant, because the kinetic energy it loses reappears as gravitational potential energy.',
          'It decreases continuously, because the block keeps losing speed along the whole climb.',
          'It increases continuously, because the block keeps gaining height along the whole climb.',
          'It stays constant only up to the middle of the climb, when the potential energy exceeds the kinetic one.']},
        correct:{es:'Permanece constante, porque la energía cinética que pierde reaparece como energía potencial gravitatoria.',
                 en:'It stays constant, because the kinetic energy it loses reappears as gravitational potential energy.'},
        hint:{es:'Suma las dos formas de energía en cada instante del ascenso y pregúntate qué fuerzas realizan trabajo sobre el bloque.',
              en:'Add the two forms of energy at each instant of the climb and ask which forces do work on the block.'},
        exp:{es:'En un plano sin fricción la única fuerza que realiza trabajo sobre el bloque es su peso, de modo que la suma de la energía cinética y la potencial se mantiene fija. Fijarse solo en la rapidez lleva a concluir que la energía disminuye, y fijarse solo en la altura lleva a la conclusión contraria; ambas lecturas describen un término del balance, no el balance completo.',
             en:'On a frictionless plane the only force doing work on the block is its weight, so the sum of the kinetic and the potential energy stays fixed. Looking only at the speed leads to the conclusion that the energy decreases, and looking only at the height leads to the opposite conclusion; both readings describe one term of the balance, not the whole balance.'} }
    ][vb[8]];
    addProb({ title:V.title, q:V.q, options:V.options, correct:V.correct, hint:V.hint, exp:V.exp, showWork:false });
  })();

  /* ---- P10 ---- */
  (function(){
    var S;
    if (vb[9] === 0){
      var m = p10a[0], F = p10a[1], f = p10a[2], d = p10a[3], v = p10a[4];
      var wn = rnd2((F-f)*d);
      var o = numOpts(v, [Math.sqrt(2*F*d/m), Math.sqrt(2*(F-f)*d), 2*(F-f)*d/m, (F-f)*d/m], 'm/s');
      S = {
        title:{es:'Empuje contra la fricción', en:'Push against friction'},
        q:{es:'Un bloque de '+m+' kg parte del reposo sobre una superficie horizontal. Una fuerza horizontal constante de '+F+' N lo empuja a lo largo de '+d+' m mientras una fuerza de fricción de '+f+' N se opone a su movimiento. Determina la rapidez del bloque al final de ese tramo.',
           en:'A block of '+m+' kg starts from rest on a horizontal surface. A constant horizontal force of '+F+' N pushes it along '+d+' m while a friction force of '+f+' N opposes its motion. Determine the speed of the block at the end of that stretch.'},
        options:{es:o.options, en:o.options}, correct:o.correct,
        hint:{es:'Calcula por separado el trabajo del empuje y el de la fricción, súmalos con su signo y trata ese resultado como la energía cinética que el bloque adquiere.',
              en:'Compute the work of the push and that of friction separately, add them with their sign, and treat that result as the kinetic energy the block acquires.'},
        exp:{es:'El empuje aporta '+F+' × '+d+' = '+nf(F*d)+' J y la fricción retira '+f+' × '+d+' = '+nf(f*d)+' J, de modo que el trabajo neto vale '+jf(wn)+'. Como el bloque parte del reposo, esa cantidad es su energía cinética final, y al despejar se obtiene una rapidez de '+nf(v)+' m/s. Ignorar la fricción sobrestima la rapidez, porque supone que toda la fuerza aplicada se convierte en movimiento.',
             en:'The push contributes '+F+' × '+d+' = '+nf(F*d)+' J and friction removes '+f+' × '+d+' = '+nf(f*d)+' J, so the net work is '+jf(wn)+'. Since the block starts from rest, that amount is its final kinetic energy, and solving for the speed gives '+nf(v)+' m/s. Ignoring friction overestimates the speed, because it assumes that the whole applied force turns into motion.'},
        showWork:true };
    } else {
      var k = p10b[0], m2 = p10b[1], x = p10b[2], v2 = p10b[3];
      var ue = rnd2(0.5*k*x*x);
      var o2 = numOpts(v2, [k*x*x/m2, x*Math.sqrt(2*k/m2), k*x/m2, Math.sqrt(k/m2)], 'm/s');
      S = {
        title:{es:'Lanzamiento con resorte', en:'Launch with a spring'},
        q:{es:'Un resorte de constante elástica '+k+' N/m se comprime '+nf(x)+' m contra un bloque de '+m2+' kg apoyado en una superficie horizontal sin fricción. Al soltarlo, el resorte impulsa al bloque. Determina la rapidez con la que el bloque se separa del resorte.',
           en:'A spring of elastic constant '+k+' N/m is compressed '+nf(x)+' m against a block of '+m2+' kg resting on a frictionless horizontal surface. When released, the spring drives the block. Determine the speed with which the block leaves the spring.'},
        options:{es:o2.options, en:o2.options}, correct:o2.correct,
        hint:{es:'La energía almacenada en el resorte es la mitad del producto de su constante por el cuadrado de la deformación, y toda ella pasa a energía cinética del bloque.',
              en:'The energy stored in the spring is half the product of its constant by the square of the deformation, and all of it becomes kinetic energy of the block.'},
        exp:{es:'El resorte guarda 0.5 × '+k+' × '+nf(x*x)+' = '+nf(ue)+' J, y sobre una superficie sin fricción esa energía pasa íntegra al bloque. Igualando con su energía cinética se obtiene un cuadrado de la rapidez de '+nf(v2*v2)+', cuya raíz es '+nf(v2)+' m/s. Olvidar la raíz cuadrada o dejar fuera el factor de la mitad conduce a valores mucho mayores.',
             en:'The spring stores 0.5 × '+k+' × '+nf(x*x)+' = '+nf(ue)+' J, and on a frictionless surface all of that energy passes to the block. Equating it with the kinetic energy gives a square of the speed of '+nf(v2*v2)+', whose root is '+nf(v2)+' m/s. Forgetting the square root or leaving out the factor of one half leads to much larger values.'},
        showWork:true };
    }
    addProb(S);
  })();
}
</script>

<!-- LIAXA ANALYTICS -->
<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbykkuJ_apGq3vALIFd4mr3acu81c7K4OKxW-DZ-i52Ceyl3lOanXMdvbS9SIXPrLQBm/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'Trabajo, Energía Cinética y Potencial';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
