        en: ['The first batch is more uniform, since its diameters depart less from the average value',
             'The second batch is more uniform, since its deviation covers a wider interval of diameters',
             'The two batches are equally uniform, since both share the same average diameter',
             'The second batch has a larger average diameter, and that explains its larger deviation']
      },
      ci: 0,
      hint: { es: 'Los dos lotes comparten el centro, de modo que la media no los distingue. Compara la distancia típica de cada lote respecto de ese centro.',
              en: 'Both batches share the same centre, so the mean does not tell them apart. Compare the typical distance of each batch from that centre.' },
      exp: { es: 'Una desviación de 0.05 milímetros significa que los tornillos del primer lote se apartan del promedio alrededor de cinco centésimas, mientras que en el segundo lote la separación típica es unas ocho veces mayor. Uniformidad es desviación pequeña, no promedio alto.',
             en: 'A deviation of 0.05 millimetres means the screws of the first batch depart from the average by around five hundredths, whereas in the second batch the typical separation is about eight times greater. Uniformity means small deviation, not a high average.' },
      showWork: false
    }
  ];
  return pk(rng, vs);
}

function mkP10(rng){
  var med = 8800 + 200 * ri(rng, 0, 6);
  var media = med + 8000 + 500 * ri(rng, 0, 6);
  var moda = med - 1200;
  var vs = [
    {
      title: { es: 'Tres medidas en un informe', en: 'Three measures in one report' },
      q: { es: 'Un informe sobre los ingresos mensuales de una colonia reporta una media de ' + media + ' pesos, una mediana de ' + med + ' pesos y una moda de ' + moda + ' pesos. Determina qué indica la distancia que hay entre la media y la mediana en ese informe.',
           en: 'A report on the monthly incomes of a neighbourhood states a mean of ' + media + ' pesos, a median of ' + med + ' pesos and a mode of ' + moda + ' pesos. Determine what the distance between the mean and the median indicates in that report.' },
      opts: {
        es: ['Que unos pocos ingresos muy altos elevan la media por encima del ingreso central',
             'Que la mayoría de los hogares de la colonia percibe un ingreso cercano a ' + media + ' pesos',
             'Que hubo un error de cálculo, pues la media y la mediana deben coincidir siempre',
             'Que los ingresos se distribuyen de manera simétrica alrededor de ' + med + ' pesos'],
        en: ['That a few very high incomes lift the mean above the central income',
             'That most households in the neighbourhood earn an income close to ' + media + ' pesos',
             'That there was a calculation error, since the mean and the median must always coincide',
             'That the incomes are distributed symmetrically around ' + med + ' pesos']
      },
      ci: 0,
      hint: { es: 'La mediana deja la mitad de los hogares por debajo y la mitad por encima. Pregúntate qué tipo de dato puede empujar la suma total sin cambiar esa posición central.',
              en: 'The median leaves half the households below and half above. Ask yourself which kind of value can push the total sum without changing that central position.' },
      exp: { es: 'La mediana informa que la mitad de los hogares percibe menos de ' + med + ' pesos. Como la media queda muy por encima de ese valor, la suma total está siendo empujada por unos pocos ingresos altos. La moda, todavía menor, confirma que el ingreso más frecuente está lejos del promedio.',
             en: 'The median reports that half the households earn less than ' + med + ' pesos. Since the mean lands well above that value, the total sum is being pushed by a few high incomes. The mode, lower still, confirms that the most frequent income sits far from the average.' },
      showWork: false
    },
    {
      title: { es: 'Un reporte de una sola página', en: 'A single page report' },
      q: { es: 'Una directora debe describir en una sola página el desempeño de un grupo en una prueba, y solo tiene espacio para dos medidas estadísticas. Determina qué par de medidas ofrece la descripción más completa del grupo.',
           en: 'A head teacher must describe the performance of a group on a test in a single page, and has room for only two statistical measures. Determine which pair of measures offers the most complete description of the group.' },
      opts: {
        es: ['Una medida de tendencia central junto con una medida de dispersión, para indicar el nivel típico y qué tan parejo es el grupo',
             'La media y la mediana, para confirmar el nivel típico del grupo mediante dos cálculos distintos',
             'El rango y la desviación estándar, para describir con mayor precisión el nivel alcanzado por el grupo',
             'La moda y el dato mayor, para señalar el resultado más frecuente y el mejor resultado logrado'],
        en: ['A measure of central tendency together with a measure of spread, to state the typical level and how even the group is',
             'The mean and the median, to confirm the typical level of the group through two different calculations',
             'The range and the standard deviation, to describe with greater precision the level the group reached',
             'The mode and the largest value, to point out the most frequent result and the best result achieved']
      },
      ci: 0,
      hint: { es: 'Cada par de medidas responde ciertas preguntas y deja otras abiertas. Revisa si el par elegido responde a la vez dónde está el grupo y qué tan repartido está.',
              en: 'Each pair of measures answers certain questions and leaves others open. Check whether the chosen pair answers at once where the group is and how spread out it is.' },
      exp: { es: 'Dos medidas de centro repiten la misma pregunta y dejan sin responder qué tan disperso es el grupo; dos medidas de dispersión hacen lo contrario y no dicen alrededor de qué valor se organiza. Una de cada tipo cubre las dos preguntas básicas con el espacio disponible.',
             en: 'Two measures of centre repeat the same question and leave unanswered how spread out the group is; two measures of spread do the opposite and never say around which value it is organised. One of each kind covers the two basic questions within the space available.' },
      showWork: false
    }
  ];
  return pk(rng, vs);
}

/* ==========================================================================
   buildLesson :: concepto, manipulativo, problema, alternados (Rule 1)
   ========================================================================== */
function buildLesson(rng){
  injectGuideCSS();
  problems = [];
  answeredCount = 0;
  correctCount = 0;
  var body = document.getElementById('lessonBody');
  body.innerHTML = '';
  var pf = document.getElementById('progFill');
  if (pf) pf.style.width = '0%';

  /* Apertura */
  sec(
    L({ es: 'Punto de partida', en: 'Starting point' }),
    L({ es: 'Un número que pretende hablar por todos', en: 'One number that claims to speak for everyone' }),
    '<p>' + L({
      es: 'Casi cualquier informe reduce cientos de datos a una sola cifra: el promedio de la clase, el ingreso medio de un municipio, el tiempo medio de espera en una clínica. Esa reducción es útil y es inevitable, porque nadie puede leer mil números a la vez. También es riesgosa, porque una cifra sola nunca dice si el grupo que representa está apretado o desperdigado.',
      en: 'Almost any report reduces hundreds of values to a single figure: the class average, the mean income of a district, the average waiting time at a clinic. That reduction is useful and unavoidable, because nobody can read a thousand numbers at once. It is also risky, because a single figure never says whether the group it represents is tightly packed or scattered.'
    }) + '</p>' +
    '<div class="callout"><p><strong>' + L({ es: 'Idea clave: ', en: 'Key idea: ' }) + '</strong>' + L({
      es: 'la estadística descriptiva trabaja con dos preguntas distintas. Dónde está el grupo, que responden las medidas de tendencia central, y qué tan separado está, que responden las medidas de dispersión. Una descripción que solo contesta la primera puede ser exacta y aun así engañosa.',
      en: 'Descriptive statistics works on two different questions. Where the group is, answered by the measures of central tendency, and how spread out it is, answered by the measures of dispersion. A description that answers only the first can be exact and still be misleading.'
    }) + '</p></div>'
  );

  /* CONCEPTO 1 :: la media aritmetica */
  var s1 = sec(
    L({ es: 'Concepto 1', en: 'Concept 1' }),
    L({ es: 'La media aritmética y el punto de equilibrio', en: 'The arithmetic mean and the balance point' }),
    '<p>' + L({
      es: 'La media aritmética de un conjunto de datos numéricos es el cociente entre la suma de todos los datos y la cantidad de datos. Es la medida de tendencia central más usada porque cada dato participa en el resultado: si uno cambia, la media cambia.',
      en: 'The arithmetic mean of a set of numerical data is the quotient between the sum of all the values and how many values there are. It is the most used measure of central tendency because every value takes part in the result: if one changes, the mean changes.'
    }) + '</p>' +
    '<p>' + L({
      es: 'Hay una segunda manera de entenderla, más útil que la fórmula. Coloca los datos sobre una recta numérica: la media es el punto donde la recta quedaría en equilibrio si cada dato pesara lo mismo. Todo lo que un dato se aleja por encima de ese punto queda compensado, unidad por unidad, por lo que otros datos se alejan por debajo. La suma de las distancias por arriba y la suma de las distancias por abajo son iguales, y solo hay un punto de la recta donde eso ocurre.',
      en: 'There is a second way to understand it, more useful than the formula. Place the values on a number line: the mean is the point where the line would balance if every value weighed the same. Whatever one value moves above that point is offset, unit by unit, by how far other values sit below it. The sum of the distances above and the sum of the distances below are equal, and there is only one point on the line where that happens.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es: 'Media aritmética', en: 'Arithmetic mean' }), frac(L({ es: 'suma de los datos', en: 'sum of the values' }), L({ es: 'cantidad de datos', en: 'number of values' })), L({ es: 'usa todos los datos del conjunto', en: 'it uses every value in the set' })) +
      rcard(L({ es: 'Lectura física', en: 'Physical reading' }), L({ es: 'punto de equilibrio', en: 'balance point' }), L({ es: 'lo que sobra arriba iguala lo que falta abajo', en: 'the surplus above equals the shortfall below' })) +
      rcard(L({ es: 'Condición', en: 'Requirement' }), L({ es: 'datos cuantitativos', en: 'quantitative data' }), L({ es: 'solo tiene sentido si los datos se pueden sumar', en: 'it only makes sense if the values can be added' })) +
    '</div>'
  );
  wEquilibrio(rng, widgetHost(s1, 'wEquilibrio', 'balance'));
  addProblem(rng, mkP1(rng));
  addProblem(rng, mkP2(rng));

  /* CONCEPTO 2 :: mediana y moda */
  var s2 = sec(
    L({ es: 'Concepto 2', en: 'Concept 2' }),
    L({ es: 'La mediana y la moda', en: 'The median and the mode' }),
    '<p>' + L({
      es: 'La mediana es el valor que ocupa la posición central cuando los datos se ordenan de menor a mayor. Con una cantidad impar de datos hay una sola posición central y la mediana es el valor que la ocupa; con una cantidad par hay dos posiciones centrales y la mediana es el promedio de esos dos valores. Lo que importa no es el tamaño de los datos sino el lugar que ocupan una vez ordenados.',
      en: 'The median is the value holding the central position once the data is sorted from lowest to highest. With an odd number of values there is a single central position and the median is the value there; with an even number there are two central positions and the median is the average of those two values. What matters is not how large the values are but the place they occupy once sorted.'
    }) + '</p>' +
    '<p>' + L({
      es: 'La moda es el valor que se repite con mayor frecuencia. Un conjunto puede tener una moda, varias o ninguna. Es la única de las tres medidas que funciona con datos cualitativos, es decir con categorías como una carrera elegida o un medio de transporte, porque para señalar la categoría más frecuente no hace falta sumar ni ordenar por tamaño.',
      en: 'The mode is the value that repeats most often. A set may have one mode, several or none. It is the only one of the three measures that works with qualitative data, that is with categories such as a chosen degree or a means of transport, because pointing to the most frequent category requires no addition and no ranking by size.'
    }) + '</p>' +
    '<div class="callout"><p>' + L({
      es: 'Antes de elegir una medida conviene mirar el tipo de dato. Con categorías, solo cabe la moda. Con cantidades, las tres son calculables y la pregunta pasa a ser cuál describe mejor al grupo.',
      en: 'Before choosing a measure it pays to look at the type of data. With categories, only the mode applies. With quantities, all three can be computed and the question becomes which one describes the group better.'
    }) + '</p></div>'
  );
  wOrdena(rng, widgetHost(s2, 'wOrdena', 'order'));
  addProblem(rng, mkP3(rng));
  addProblem(rng, mkP4(rng));

  /* CONCEPTO 3 :: valores atipicos */
  var s3 = sec(
    L({ es: 'Concepto 3', en: 'Concept 3' }),
    L({ es: 'Cuando un solo dato desplaza el promedio', en: 'When a single value shifts the average' }),
    '<p>' + L({
      es: 'Un valor atípico es un dato que se aparta notablemente del resto del conjunto. Como la media se construye a partir de la suma de todos los datos, un valor atípico la arrastra hacia sí con toda su magnitud. La mediana, en cambio, solo atiende a la posición central: cambiar el dato más alto por otro todavía mayor no altera quién ocupa el centro.',
      en: 'An outlier is a value that departs noticeably from the rest of the set. Since the mean is built from the sum of every value, an outlier drags it along with its full magnitude. The median, by contrast, only attends to the central position: replacing the highest value with an even higher one does not alter who occupies the centre.'
    }) + '</p>' +
    '<p>' + L({
      es: 'De ahí una regla práctica de lectura: cuando la media y la mediana de un mismo conjunto se separan mucho, la distribución no es simétrica y conviene sospechar de valores extremos. En informes de ingresos, de precios de vivienda o de tiempos de espera, esa separación es la señal habitual de que unos pocos casos muy grandes están levantando el promedio.',
      en: 'Hence a practical reading rule: when the mean and the median of the same set drift far apart, the distribution is not symmetric and extreme values are worth suspecting. In reports on income, on housing prices or on waiting times, that gap is the usual sign that a few very large cases are lifting the average.'
    }) + '</p>'
  );
  wAtipico(rng, widgetHost(s3, 'wAtipico', 'slider'));
  addProblem(rng, mkP5(rng));

  /* CONCEPTO 4 :: rango y dispersion */
  var s4 = sec(
    L({ es: 'Concepto 4', en: 'Concept 4' }),
    L({ es: 'El rango, la primera medida de dispersión', en: 'The range, the first measure of dispersion' }),
    '<p>' + L({
      es: 'Dos conjuntos pueden compartir exactamente la misma media y describir realidades opuestas. Un grupo donde todos rondan el promedio y otro donde la mitad está muy arriba y la mitad muy abajo tienen el mismo centro y nada más en común. Para distinguirlos hacen falta medidas de dispersión, que responden qué tan separados están los datos entre sí.',
      en: 'Two sets can share exactly the same mean and describe opposite realities. A group where everyone hovers near the average and another where half sit far above and half far below have the same centre and nothing else in common. Telling them apart requires measures of dispersion, which answer how far the values sit from one another.'
    }) + '</p>' +
    '<p>' + L({
      es: 'La más simple es el rango: la diferencia entre el dato mayor y el dato menor. Se calcula en un paso y se lee en las mismas unidades que los datos, lo que lo hace cómodo. Su limitación es que se apoya solo en los dos extremos y no dice nada de cómo se reparten los demás datos, de modo que un único valor atípico basta para inflarlo.',
      en: 'The simplest one is the range: the difference between the largest and the smallest value. It takes one step and is read in the same units as the data, which makes it convenient. Its limitation is that it leans on the two extremes alone and says nothing about how the remaining values are distributed, so a single outlier is enough to inflate it.'
    }) + '</p>'
  );
  wClasifica(rng, widgetHost(s4, 'wClasifica', 'classify'));
  addProblem(rng, mkP6(rng));
  addProblem(rng, mkP7(rng));

  /* CONCEPTO 5 :: desviacion estandar */
  var s5 = sec(
    L({ es: 'Concepto 5', en: 'Concept 5' }),
    L({ es: 'La desviación estándar', en: 'The standard deviation' }),
    '<p>' + L({
      es: 'Si el rango se queda corto porque ignora a la mayoría de los datos, la salida es medir cuánto se aparta cada dato de la media y resumir todas esas distancias en un solo número. A la diferencia entre un dato y la media se le llama desviación. Sumarlas directamente no sirve: las desviaciones positivas y las negativas se cancelan y el total siempre da cero, precisamente porque la media es el punto de equilibrio.',
      en: 'If the range falls short because it ignores most of the data, the way out is to measure how far each value departs from the mean and to summarise all those distances in a single number. The difference between a value and the mean is called a deviation. Adding them directly is useless: positive and negative deviations cancel out and the total is always zero, precisely because the mean is the balance point.'
    }) + '</p>' +
    '<p>' + L({
      es: 'Por eso cada desviación se eleva al cuadrado antes de sumar. El cuadrado elimina los signos y además pesa más a los datos que se alejan mucho. El promedio de esos cuadrados se llama varianza y queda expresado en unidades al cuadrado, lo que dificulta interpretarlo. Al extraer su raíz cuadrada se obtiene la desviación estándar, que vuelve a las unidades originales y se lee como la distancia típica entre un dato cualquiera y la media del conjunto.',
      en: 'That is why each deviation is squared before adding. Squaring removes the signs and also gives more weight to the values sitting far away. The average of those squares is called the variance and it comes out in squared units, which makes it hard to interpret. Taking its square root gives the standard deviation, which returns to the original units and reads as the typical distance between any value and the mean of the set.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es: 'Desviación', en: 'Deviation' }), L({ es: 'dato menos media', en: 'value minus mean' }), L({ es: 'positiva arriba, negativa abajo', en: 'positive above, negative below' })) +
      rcard(L({ es: 'Varianza', en: 'Variance' }), frac(L({ es: 'suma de los cuadrados', en: 'sum of the squares' }), L({ es: 'cantidad de datos', en: 'number of values' })), L({ es: 'queda en unidades al cuadrado', en: 'it stays in squared units' })) +
      rcard(L({ es: 'Desviación estándar', en: 'Standard deviation' }), L({ es: 'raíz cuadrada de la varianza', en: 'square root of the variance' }), L({ es: 'distancia típica a la media', en: 'typical distance to the mean' })) +
    '</div>'
  );
  wDesviacion(rng, widgetHost(s5, 'wDesviacion', 'deviation'));
  addProblem(rng, mkP8(rng));
  addProblem(rng, mkP9(rng));

  /* Cierre :: leer las medidas juntas */
  var s6 = sec(
    L({ es: 'Tu turno', en: 'Your turn' }),
    L({ es: 'Leer las medidas juntas', en: 'Reading the measures together' }),
    '<p>' + L({
      es: 'Ninguna medida decide sola. La media y la mediana leídas juntas revelan si hay valores extremos; la desviación estándar dice si el centro representa de verdad al grupo o si es apenas un punto medio entre realidades muy distintas. Interpretar es justamente eso: decir a qué grupo describen los números y a cuál no.',
      en: 'No single measure decides on its own. The mean and the median read together reveal whether extreme values are present; the standard deviation says whether the centre truly represents the group or is merely a midpoint between very different realities. Interpreting is exactly that: saying which group the numbers describe and which one they do not.'
    }) + '</p>'
  );
  wReflect(rng, widgetHost(s6, 'wReflexion', 'reflect'));

  /* Cierre :: la decision que queda */
  addProblem(rng, mkP10(rng));
}
</script>

<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbyytGUdwxVpgXSHoXM1ISKh036P3GlF1BmF6aVRCR3DLpmtgefG09htw_l5IJW3UwoG/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';

  var openedAt  = Date.now();

    var body = JSON.stringify({school:school,event:ev,module_id:moduleId,
      session_id:sessionId,elapsed_sec:Math.round((Date.now()-openedAt)/1000)});
    if(ev==='module_close'&&navigator.sendBeacon){
      navigator.sendBeacon(GAS_URL,new Blob([body],{type:'application/json'}));
    }else{
      fetch(GAS_URL,{method:'POST',body:body,headers:{'Content-Type':'application/json'},keepalive:true}).catch(function(){});
    }
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
