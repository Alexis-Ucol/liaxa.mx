<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comparar Textos sobre Sociedades Contemporáneas y Comunicación Asertiva</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; text-align:justify; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--gold-bg); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Comparar Textos sobre Sociedades Contemporáneas y Comunicación Asertiva</div>
    <div class="wcourse" id="wcourse-el">Español · 2° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Comparar Textos sobre Sociedades Contemporáneas y Comunicación Asertiva</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="sbtn" id="dlBtn" onclick="generatePDF()" style="max-width:280px;margin:0 auto;">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   CENTRALIZED SCHOOL CONFIG (Rule 16) — ships UNBRANDED (Rule 11).
   The ONLY rebranding point. build_all.py substitutes these exact fields
   (BRAND_FIELDS / RGB_FIELDS / logo*) downstream; :root/dark stay as fallback.
   Neutral defaults below == the static :root/dark values, so unbranded == no-op.
   ══════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:'#0c3c84', primaryDark:'#05224e', primaryBg:'#e5edf7',
  accent:'#fc0c0c', accentBg:'#ffdbdb',
  darkPrimary:'#3575d4', darkPrimaryDark:'#679ff3', darkPrimaryBg:'#061d3f',

/* ── Drawing palette, derived from the school's colours (Rule 16) ─────────
   slots 1-2 : school primary + accent
   slots 3-4 : the two of black/red/blue/green least similar to the school colours
   Falls back to neutral defaults if SCHOOL colours can't be parsed.
   ───────────────────────────────────────────────────────────────────── */
var DRAW_PALETTE = (function () {
  function hex2rgb(h) {
    h = String(h).replace('#', '');
    if (h.length === 3) { h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2]; }
    return [parseInt(h.substr(0,2),16), parseInt(h.substr(2,2),16), parseInt(h.substr(4,2),16)];
  }
  function dist(a, b) {
    var dr = a[0]-b[0], dg = a[1]-b[1], db = a[2]-b[2];
    return Math.sqrt(2*dr*dr + 4*dg*dg + 3*db*db);
  }
  var COMMON = ['#1a1a16', '#c0392b', '#1d4e89', '#1a7a3a'];  /* black, red, blue, green */
  var schoolRGB;
  try {
    schoolRGB = [hex2rgb(SCHOOL.primary), hex2rgb(SCHOOL.accent)];
  } catch (e) {
    return [SCHOOL.primary, SCHOOL.accent, '#1a1a16', '#1d4e89'];
  }
  var scored = COMMON.map(function (c, idx) {
    var rgb = hex2rgb(c);
    var nearest = Math.min(dist(rgb, schoolRGB[0]), dist(rgb, schoolRGB[1]));
    return { c: c, idx: idx, d: nearest };
  });
  scored.sort(function (a, b) { return b.d - a.d; });      /* farthest first */
  var keep = scored.slice(0, 2);
  keep.sort(function (a, b) { return a.idx - b.idx; });    /* restore visual order */
  return [SCHOOL.primary, SCHOOL.accent, keep[0].c, keep[1].c];
})();
function drawDotsHTML() {
  return DRAW_PALETTE.map(function (c, i) {
    return '<div class="cdot' + (i === 0 ? ' sel' : '') + '" data-color="' + c +

  }).join('');
}

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = DRAW_PALETTE[0];   // matches the first (selected) dot = SCHOOL.primary
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;

  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

    '<div class="pbody">' +

      workArea +
      '<button class="hintbtn" id="hintbtn'+i+'" onclick="toggleHint(' + i + ')">'+t('btn-hint')+'</button>' +

async function generatePDF() {
  var btn = document.getElementById('dlBtn');
  btn.textContent = 'Generando PDF…';
  btn.disabled = true;

  var jspdf   = window.jspdf;
  var doc     = new jspdf.jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });
  var PW      = 215.9;
  var M       = 18;
  var TW      = PW - M * 2;
  var PH      = doc.internal.pageSize.height;
  var name    = studentData.name;
  var group   = studentData.group;
  var total   = problems.length;
  var pct     = Math.round(correctCount / total * 100);
  var dateStr = new Date().toLocaleString('es-MX', { dateStyle:'long', timeStyle:'short' });

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS — INJECTION BLOCK ─────────────────────────────────────────
  //   Match these RGB values to --green and --gold above.
  //   PRIMARY  → pBR, pBG, pBB
  //   ACCENT   → pAR, pAG, pAB
  // ──────────────────────────────────────────────────────────────────────────
  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;  // PRIMARY (from SCHOOL, Rule 16)
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;   // ACCENT (from SCHOOL, Rule 16)

  function pdfText(html) {
    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/\u2192/g,'->').replace(/\u2212/g,'-').replace(/\u00b2/g,'^2')
      .replace(/\u00b3/g,'^3').replace(/\u00d7/g,'x').replace(/\u00f7/g,'/')
      .replace(/\u2260/g,'!=').replace(/\u2264/g,'<=').replace(/\u2265/g,'>=')
      .replace(/\u221a/g,'sqrt').replace(/\u03c0/g,'pi').replace(/\u2026/g,'...')
      .replace(/\s+/g,' ').trim();
  }

  // ── PORTADA: orange line / white logo strip / orange line / blue band ──
  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,2,'F');   // top accent line
  doc.setFillColor(255,255,255); doc.rect(0,2,PW,26,'F');                               // white logo strip
  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,28,PW,2,'F');  // bottom accent line
  doc.setFillColor(pBR,pBG,pBB); doc.rect(0,30,PW,34,'F');       // blue header band

  // ── PDF LOGO INJECTION BLOCK ─────────────────────────────────────────────
  //   When injecting logos, replace the two placeholder lines below with:
  //     var logoLeftB64  = 'data:image/png;base64,...';   // from LOGOS_MASTER.HTML
  //     var logoRightB64 = 'data:image/png;base64,...';   // from LOGOS_MASTER.HTML
  //   Then uncomment the two doc.addImage() calls.
  //   Left logo  → Facultad / department logo  (x=M,   y=4,  w=48, h=22)
  //   Right logo → University logo             (x=130, y=4,  w=48, h=22)
  // var logoLeftB64  = '{{LOGO_LEFT_B64}}';
  // var logoRightB64 = '{{LOGO_RIGHT_B64}}';
  // doc.addImage(logoLeftB64,  'PNG', M,   4, 48, 22);
  // doc.addImage(logoRightB64, 'PNG', 130, 4, 48, 22);
  // ─────────────────────────────────────────────────────────────────────────

  // LIAXA logo — right side of white strip
  var lx = PW - M - 36;
  var ly = 10;
  doc.setDrawColor(pBR,pBG,pBB); doc.setLineWidth(0.7);
  doc.lines([[2.57-1.03,4.63-6.17],[4.11-2.57,5.14-4.63],[5.66-4.11,2.57-5.14]], lx+1.03, ly+6.17);
  doc.setFillColor(pAR,pAG,pAB); doc.circle(lx+5.66, ly+2.57, 0.9, 'F');
  doc.setDrawColor(pAR,pAG,pAB); doc.setLineWidth(0.7);
  doc.line(lx+8.23, ly+1.54, lx+8.23, ly+7.2);
  doc.setTextColor(pBR,pBG,pBB); doc.setFontSize(11); doc.setFont('helvetica','bold');
  doc.text('LIAXA', lx+10, ly+6.8);

  // Guide title + date inside the blue band
  doc.setTextColor(232,238,247); doc.setFontSize(19); doc.setFont('helvetica','bold');
  doc.text(t('wtitle'), M, 49);
  doc.setTextColor(150,165,200); doc.setFontSize(8); doc.setFont('helvetica','normal');
  doc.text(dateStr, M, 59);

  // ── Student info card (name + group only — código goes to footer) ──
  doc.setFillColor(237,240,245); doc.roundedRect(M,72,TW,20,3,3,'F');
  doc.setTextColor(130,140,160); doc.setFontSize(8.5); doc.setFont('helvetica','bold');
  doc.text('ALUMNO', M+4, 79); doc.text('GRUPO', 130, 79);
  doc.setTextColor(20,24,32); doc.setFontSize(11); doc.setFont('helvetica','bold');
  doc.text(name, M+4, 87); doc.text(group, 130, 87);

  // ── Score box ──
  var sc = pct>=70?[26,106,74]:pct>=50?[224,123,26]:[176,48,16];
  doc.setFillColor(255,255,255); doc.roundedRect(M,100,TW,34,4,4,'F');
  doc.setDrawColor(sc[0],sc[1],sc[2]); doc.setLineWidth(0.8);
  doc.roundedRect(M,100,TW,34,4,4,'S');
  doc.setTextColor(sc[0],sc[1],sc[2]); doc.setFontSize(40); doc.setFont('helvetica','bold');
  doc.text(pct+'%', PW/2, 124, {align:'center'});
  doc.setTextColor(130,140,160); doc.setFontSize(8.5); doc.setFont('helvetica','normal');
  doc.text(correctCount+' correcta(s) de '+total+' preguntas', PW/2, 131, {align:'center'});

  // ── Problem summary table ──
  doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
  doc.setFontSize(7); doc.setFont('helvetica','bold');
  doc.rect(M,142,TW,8,'F'); doc.text('RESUMEN DE PROBLEMAS', M+4, 148);
  var sy = 154;
  problems.forEach(function(prob, i) {
    if (sy + 12 > PH - 15) {
      doc.addPage(); sy = 20;
      doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
      doc.setFontSize(7); doc.setFont('helvetica','bold');
      doc.rect(M,sy,TW,8,'F'); doc.text('RESUMEN DE PROBLEMAS (continuación)', M+4, sy+6);
      sy += 12;
    }
    var ok = document.getElementById('pc'+i).classList.contains('ok');
    doc.setFillColor(ok?232:255, ok?240:232, ok?232:228);
    doc.roundedRect(M,sy,TW,10,2,2,'F');
    doc.setFillColor(ok?26:176, ok?106:48, ok?74:16);
    doc.circle(M+6, sy+5, 2.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(7); doc.setFont('helvetica','bold');
    doc.text(ok?'✓':'✗', M+4.5, sy+6.5);
    doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('helvetica','normal');
    doc.text('Problema '+(i+1)+': '+pdfText(prob.title), M+12, sy+6.5);
    doc.setTextColor(ok?26:176, ok?106:48, ok?74:16);
    doc.text(ok?'Correcto':'Incorrecto', PW-M-24, sy+6.5);
    sy += 12;
  });

  // ── Per-problem pages ──
  for (var i = 0; i < problems.length; i++) {
    var prob = problems[i];
    doc.addPage();
    var wy = 0;

    doc.setFillColor(pBR,pBG,pBB); doc.rect(0,0,PW,20,'F');
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,3,'F');
    doc.setTextColor(pAR,pAG,pAB); doc.setFontSize(7); doc.setFont('helvetica','normal');
    doc.text(t('wcourse')+'  ·  '+t('wtitle'), M, 10);
    doc.setTextColor(232,238,247); doc.setFontSize(10.5); doc.setFont('helvetica','bold');
    doc.text('Problema '+(i+1)+' de '+total+'  ·  '+pdfText(prob.title), M, 17);
    wy = 25;

    var qRaw = pdfText(prob.questionText);
    doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var qLines = doc.splitTextToSize(qRaw, TW-10);
    var qBoxH  = 8 + qLines.length*5 + 3;
    doc.setFillColor(237,240,245); doc.roundedRect(M,wy,TW,qBoxH,2,2,'F');
    doc.setTextColor(pBR,pBG,pBB); doc.setFontSize(6.5); doc.setFont('helvetica','bold');
    doc.text('PREGUNTA', M+4, wy+6);
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var qy = wy+12;
    qLines.forEach(function(ln,li){ doc.text(ln, M+4, qy+li*5); });
    wy += qBoxH + 4;

    var isOk   = document.getElementById('pc'+i).classList.contains('ok');
    var chosen = prob.studentChoice != null ? pdfText(prob.options[prob.studentChoice]||'-') : '-';
    var corr   = pdfText(prob.options[prob.correctIdx]||'');
    var expRaw = pdfText(prob.explanation||'');
    doc.setFontSize(8.5); var chLines = doc.splitTextToSize('Alumno: '+chosen, TW-18);
    doc.setFontSize(8);   var coLines = doc.splitTextToSize('Correcto: '+corr, TW-18);
    doc.setFontSize(7.5); var exLines = doc.splitTextToSize('Solución: '+expRaw, TW-18).slice(0,4);
    var ansBoxH = 8 + chLines.length*5.5 + coLines.length*5 + exLines.length*5 + 6;
    doc.setFillColor(isOk?232:255, isOk?240:232, isOk?232:228);
    doc.roundedRect(M,wy,TW,ansBoxH,2,2,'F');
    doc.setFillColor(isOk?26:176, isOk?106:48, isOk?74:16);
    doc.circle(M+7, wy+8, 3.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(9); doc.setFont('helvetica','bold');
    doc.text(isOk?'✓':'✗', M+5.2, wy+10.5);
    var ay = wy+7;
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','bold');
    chLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5.5); });
    ay += chLines.length*5.5 + 3;
    doc.setTextColor(26,106,74); doc.setFontSize(8); doc.setFont('helvetica','normal');
    coLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    ay += coLines.length*5 + 3;
    doc.setTextColor(90,85,80); doc.setFontSize(7.5);
    exLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    wy += ansBoxH + 5;

    doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
    doc.setFontSize(7); doc.setFont('helvetica','bold');
    doc.rect(M,wy,TW,8,'F'); doc.text('TRABAJO DEL ALUMNO', M+4, wy+5.5);
    wy += 11;

    var dc = document.getElementById('dc'+i);
    if (dc) {
      try {
        var imgD = dc.toDataURL('image/png');
        var ar   = dc.height / dc.width;
        var iw   = TW;
        var ih   = Math.min(iw * ar, 68);
        doc.addImage(imgD, 'PNG', M, wy, iw, ih);
        wy += ih + 4;
      } catch(e) {}
    }

    var ta = document.getElementById('ta'+i);
    if (ta && ta.value.trim()) {
      if (wy > PH-30) { doc.addPage(); wy = 20; }
      doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('courier','normal');
      var taLines = doc.splitTextToSize(ta.value, TW);
      taLines.slice(0,16).forEach(function(ln) {
        if (wy > PH-15) { doc.addPage(); wy = 20; }
        doc.text(ln, M, wy); wy += 5;
      });
      wy += 2;
    }

    var pp = document.getElementById('pp'+i);
    if (pp && pp.src && pp.src.indexOf('data:') === 0) {
      if (wy > PH-55) { doc.addPage(); wy = 20; }
      try { doc.addImage(pp.src, 'JPEG', M, wy, TW, 68); wy += 72; } catch(e) {}
    }
  }

  // ── Footer on every page ──
  var pages = doc.internal.getNumberOfPages();
  for (var p = 1; p <= pages; p++) {
    doc.setPage(p);
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0, PH-3, PW, 3, 'F');
    doc.setTextColor(130,140,160); doc.setFontSize(6.5); doc.setFont('helvetica','normal');
    doc.text(name+'  ·  '+group+'  ·  Código: '+code+'  ·  Página '+p+'/'+pages,
      PW/2, PH-5, {align:'center'});
  }

  // ── SAVE / SHARE — iOS-safe download (LIAXA iOS PDF fix, Rule 12) ─────────
  //   iOS Safari ignores the <a download> attribute (and doc.save() relies on
  //   it), so on iPhone/iPad a plain download fails silently. We branch:
  //     • iOS  → native share sheet (→ "Save to Files"); if unavailable, open
  //              the PDF inline so the student can tap Safari's own Share.
  //     • else → <a download> click (works on desktop + Android).
  //   The whole function runs synchronously off the tap (no await above), which
  //   is what lets iOS accept navigator.share(). Do NOT add an await before this.
  // ──────────────────────────────────────────────────────────────────────────
  var _fname   = SCHOOL.filePrefix + '_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf';
  var _pdfBlob = doc.output('blob');

  function _restorePdfBtn(){ btn.innerHTML = '⬇ &nbsp;' + t('btn-pdf'); btn.disabled = false; }
  function _openPdfInline(b){
    var u = URL.createObjectURL(b);
    var w = window.open(u, '_blank');
    if (!w) { window.location.href = u; }   // popup blocked → same tab
    setTimeout(function(){ URL.revokeObjectURL(u); }, 60000);
  }

  // iPadOS 13+ reports as "MacIntel" with a touch screen, so test for that too.
  var _isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
               (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  if (_isIOS) {
    var _pdfFile = new File([_pdfBlob], _fname, { type:'application/pdf' });
    if (navigator.canShare && navigator.canShare({ files:[_pdfFile] })) {
      navigator.share({ files:[_pdfFile], title:_fname })
        .then(_restorePdfBtn)
        .catch(function(e){
          if (e && e.name === 'AbortError') { _restorePdfBtn(); return; } // cancelled
          _openPdfInline(_pdfBlob); _restorePdfBtn();
        });
      return;
    }
    _openPdfInline(_pdfBlob); _restorePdfBtn();   // older iOS: open inline
    return;
  }

  // Desktop + Android: the native download works.
  var _dlUrl = URL.createObjectURL(_pdfBlob);
  var _dlA   = document.createElement('a');
  _dlA.href  = _dlUrl; _dlA.download = _fname;
  document.body.appendChild(_dlA); _dlA.click();
  setTimeout(function(){ document.body.removeChild(_dlA); URL.revokeObjectURL(_dlUrl); }, 200);
  _restorePdfBtn();
}

  function textHTML(txt, mode, marks) {
    return txt.lines.map(function (ln) {
      var h = '';
      ln.forEach(function (part) {
        if (typeof part === 'string') { h += part; return; }
        var f = txt.figs[part];
        if (mode === 'hunt') {
          h += '<span class="xchip' + (marks[part] || '') + '" onclick="' + txt.tap + '(' + part + ')">' + f.s + '</span>';
        } else {
          h += '<span class="xmark">' + f.s + '</span>';
        }
      });
      return '<span class="dpara">' + h + '</span>';
    }).join('');
  }
  function textBlock(txt) {

  /* ///////// WIDGET 2 · caza de marcas en los dos textos ///////// */
  function widgetCaza() {
    var pool = [];
    T1.figs.forEach(function (f, i) { pool.push({ t:0, i:i }); });
    T2.figs.forEach(function (f, i) { pool.push({ t:1, i:i }); });
    var order = shuffle(pool, rng).slice(0, 4);
    var st = { r:0, tries:0, marks:[{}, {}], done:false };
    var w = widgetBox('wCaza', 'hunt');
    var TXT = [T1, T2];

    function paint(fb) {
      if (st.done) {
        w.innerHTML =
          '<div class="iw-tag">' + T('Caza de marcas', 'Marker hunt') + '</div>' +
          '<div class="iw-sub">' + T('Recorriste las cuatro marcas de esta ronda dentro de los dos textos.',
                                     'You worked through the four markers of this round inside the two texts.') + '</div>' +
          '<div class="iw-fb">' + (fb || '') + '</div>';
        return;
      }
      var tg = order[st.r], want = TXT[tg.t].figs[tg.i];
      w.innerHTML =
        '<div class="iw-tag">' + T('Caza de marcas', 'Marker hunt') + '</div>' +
        '<div class="iw-sub">' + T('Las expresiones subrayadas de los dos textos se pueden tocar. Busca, en el que sea, la que ',
                                   'The underlined expressions in both texts can be tapped. Find, in either of them, the one that ') +
          L(want.hq) + '.</div>' +
        '<div class="iw-prog">' + (st.r + 1) + ' / ' + order.length + '</div>' +
        '<div class="dtext"><div class="dtitle">' + L(T1.title) + '</div>' + textHTML(T1, 'hunt', st.marks[0]) + '</div>' +
        '<div class="dtext"><div class="dtitle">' + L(T2.title) + '</div>' + textHTML(T2, 'hunt', st.marks[1]) + '</div>' +
        '<div class="iw-fb" id="hnFb">' + (fb || '') + '</div>';
    }
    function advance(fb) {
      st.r++; st.tries = 0; st.marks = [{}, {}];
      if (st.r >= order.length) st.done = true;
      paint(fb);
    }
    function tap(ti, k) {
      if (st.done) return;
      var tg = order[st.r], want = TXT[tg.t].figs[tg.i], got = TXT[ti].figs[k];
      if (ti === tg.t && k === tg.i) {
        st.marks[ti][k] = ' hit';
        advance('<span class="iw-ok">' + CIT(want.s) + ': ' + L(MARCA[want.r].n).toLowerCase() + '. ' +
                T('Aparece en el texto ', 'It appears in text ') + (tg.t === 0 ? 'I' : 'II') +
                T(' porque ese texto ', ' because that text ') +
                (tg.t === 0 ? T('informa y necesita que el lector pueda comprobarlo.', 'informs and needs the reader to be able to check it.')
                            : T('argumenta y necesita ordenar sus razones.', 'argues and needs to order its reasons.')) + '</span>');
        return;
      }
      st.tries++;
      if (st.tries >= 3) {
        st.marks[tg.t][tg.i] = ' rev';
        advance(T('La expresión que buscabas era ', 'The expression you were after was ') + CIT(want.s) +
                T(', en el texto ', ', in text ') + (tg.t === 0 ? 'I' : 'II') + ': ' + L(want.hq) +
                T('. Es ', '. It is ') + L(MARCA[want.r].n).toLowerCase() + '.');
        return;
      }
      st.marks[ti][k] = ' miss';
      paint(T('Esa expresión ', 'That expression ') + L(got.hq) +
            T('. Vuelve a leer: buscas la que ', '. Read again: you are after the one that ') + L(want.hq) + '.');
      st.marks[ti][k] = '';
    }
    window.hnTapA = function (k) { tap(0, k); };
    window.hnTapB = function (k) { tap(1, k); };

  /* ///////// constructor de tarjetas ///////// */
  function addP(spec) {
    var shuffled = shuffle(spec.options, rng);
    var p = {
      title: L(spec.title),
      questionText: L(spec.q),
      fn: '',
      hint: L(spec.hint),
      explanation: L(spec.exp),
      options: shuffled.map(function (o) { return L(o); }),
      correctIdx: shuffled.indexOf(spec.correct),
      showWork: false,
      studentChoice: null,
      pendingChoice: null
    };
    problems.push(p);
    buildOneCard(p, problems.length - 1);
  }

      return {
        title:{ es:'La pieza que falta', en:'The missing piece' },
        q:{ es:'Marisol dice: ' + CIT('La convocatoria se entregó el mismo día de la asamblea. Cuando eso pasa yo llego sin haber leído la propuesta y me cuesta opinar') + '. Determina qué le falta a su intervención para quedar completa.',
            en:'Marisol says: ' + CIT('La convocatoria se entregó el mismo día de la asamblea. Cuando eso pasa yo llego sin haber leído la propuesta y me cuesta opinar') + '. Determine what her intervention lacks in order to be complete.' },
        hint:{ es:'Repasa las cuatro piezas que armaste hace un momento y ve tachando las que ya están en la intervención de Marisol.',
               en:'Go over the four pieces you assembled a moment ago and cross off those that are already in Marisol intervention.' },
        exp:{ es:'Marisol ya tiene el hecho, dicho sin adjetivos, y el efecto que ese hecho tiene en ella. Lo que no dice es qué quiere que pase, y sin eso el comité no tiene nada que aceptar ni que discutir: la intervención se queda en queja. Añadir un reproche o un calificativo no completaría el mensaje, lo desviaría hacia las personas, que es justo lo que ella evitó.',
              en:'Marisol already has the fact, said with no adjectives, and the effect that fact has on her. What she does not say is what she wants to happen, and without that the committee has nothing to accept or dispute: the intervention stays a complaint. Adding a reproach or a grading word would not complete the message, it would divert it towards the people, which is exactly what she avoided.' },
        options:[ c1,
          { es:'Un adjetivo que califique el modo en que trabaja el comité de alumnos.',
            en:'A grading adjective describing the way the student committee works.' },
          { es:'La aclaración de quién tuvo la culpa de que la convocatoria llegara tarde.',
            en:'The clarification of who was to blame for the notice arriving late.' },
          { es:'Un reproche que le haga ver al comité que el asunto es serio.',
            en:'A reproach that makes the committee see that the matter is serious.' } ],
        correct: c1
      };
    }
    var c2 = { es:'Reconoce la preocupación de la otra persona y solo entonces responde, apoyada en un dato del acuerdo.',
               en:'She acknowledges the other person concern and only then answers, leaning on a datum from the agreement.' };
    return {
      title:{ es:'La pieza que falta', en:'The missing piece' },
      q:{ es:'La maestra Nieves dice: ' + CIT('Entiendo que a usted le preocupe el tiempo de clase; aun así, el acta dice que los ensayos serán fuera del horario') + '. Determina qué hace esa intervención antes de contradecir a su interlocutor.',
          en:'Miss Nieves says: ' + CIT('Entiendo que a usted le preocupe el tiempo de clase; aun así, el acta dice que los ensayos serán fuera del horario') + '. Determine what that intervention does before contradicting her interlocutor.' },
      hint:{ es:'Divide la intervención en dos partes por el punto y coma y pregúntate qué hace cada mitad con la persona que está enfrente.',
             en:'Split the intervention in two at the semicolon and ask yourself what each half does with the person opposite.' },
      exp:{ es:'La primera mitad le concede al otro que su preocupación tiene sentido; la segunda la responde con un dato verificable. Ese orden hace que el desacuerdo llegue sin que nadie quede descalificado, y es el mismo movimiento que el texto II hace por escrito con es cierto que y sin embargo. La maestra no cambia de opinión ni deja el asunto abierto: contradice, pero después de reconocer.',
            en:'The first half concedes to the other person that the concern makes sense; the second answers it with a checkable datum. That order makes the disagreement arrive without anybody being dismissed, and it is the same move text II makes in writing with es cierto que and sin embargo. The teacher neither changes her mind nor leaves the matter open: she contradicts, but after acknowledging.' },
      options:[ c2,
        { es:'Cede ante la preocupación de la otra persona y deja el asunto sin resolver.',
          en:'She gives way to the other person concern and leaves the matter unresolved.' },
        { es:'Repite la objeción con otras palabras para que toda la asamblea la escuche.',
          en:'She repeats the objection in other words so that the whole assembly hears it.' },
        { es:'Pide a la otra persona que explique qué parte del guion le preocupa más.',
          en:'She asks the other person to explain which part of the script worries them most.' } ],
      correct: c2
    };
  }

  function q9() {
    if (rng() < 0.5) {
      var c1 = { es:'La convocatoria llegó el mismo día. Necesito leerla antes para poder opinar, así que pido que la próxima se entregue tres días antes.',
                 en:'La convocatoria llegó el mismo día. Necesito leerla antes para poder opinar, así que pido que la próxima se entregue tres días antes.' };
      return {
        title:{ es:'Decir lo mismo de otro modo', en:'Saying the same thing another way' },
        q:{ es:'Don Álvaro quiere sostener su desacuerdo sin acusar a nadie. Determina cuál de estas cuatro versiones conserva el desacuerdo y lo dice de manera asertiva.',
            en:'Don Álvaro wants to hold his disagreement without accusing anybody. Determine which of these four versions keeps the disagreement and states it assertively.' },
        hint:{ es:'Descarta primero las versiones donde el desacuerdo desaparece. De las que queden, elige la que habla del hecho y no de cómo son las personas.',
               en:'First discard the versions where the disagreement disappears. Of those left, choose the one that speaks about the fact and not about what the people are like.' },
        exp:{ es:'Esa versión nombra el hecho, dice cómo afecta a quien habla y termina pidiendo algo concreto, sin decir nada sobre cómo es el comité. Otra de las opciones repite la acusación y hasta añade un pronóstico sobre lo que el comité aceptará; las dos restantes renuncian al desacuerdo, una dándolo por perdido y otra disculpándolo de antemano. Ser asertivo no es suavizar lo que se piensa, es decirlo de manera que se pueda responder.',
              en:'That version names the fact, says how it affects the speaker and ends by asking for something concrete, without saying anything about what the committee is like. Another option repeats the accusation and even adds a forecast about what the committee will accept; the two remaining ones give up the disagreement, one by treating it as lost and the other by excusing it in advance. Being assertive is not softening what you think, it is saying it in a way that can be answered.' },
        options:[ c1,
          { es:'Ustedes ya saben que siempre avisan tarde, y aunque lo diga aquí nunca lo van a aceptar.',
            en:'Ustedes ya saben que siempre avisan tarde, y aunque lo diga aquí nunca lo van a aceptar.' },
          { es:'No importa cuándo llegue la convocatoria, de todos modos mi opinión no cambia nada.',
            en:'No importa cuándo llegue la convocatoria, de todos modos mi opinión no cambia nada.' },
          { es:'Avisaron tarde otra vez, pero seguro tuvieron sus razones y no vale la pena hablarlo.',
            en:'Avisaron tarde otra vez, pero seguro tuvieron sus razones y no vale la pena hablarlo.' } ],
        correct: c1
      };
    }
    var c2 = { es:'¿Me podría explicar qué parte del guion le preocupa más?',
               en:'¿Me podría explicar qué parte del guion le preocupa más?' };
    return {
      title:{ es:'Decir lo mismo de otro modo', en:'Saying the same thing another way' },
      q:{ es:'Una de estas cuatro intervenciones busca entender la postura ajena antes de responderla; las otras tres ya dan por sabido lo que el otro piensa. Determina cuál es.',
          en:'One of these four interventions seeks to understand the other side stance before answering it; the other three take for granted what the other person thinks. Determine which one it is.' },
      hint:{ es:'Fíjate en cuál de las cuatro deja al interlocutor la siguiente palabra en lugar de adjudicarle una intención.',
             en:'Notice which of the four leaves the next word to the interlocutor instead of assigning them an intention.' },
      exp:{ es:'Preguntar qué parte preocupa más deja al otro la siguiente palabra y abre la conversación en lugar de cerrarla. Las otras tres suponen de antemano lo que el interlocutor piensa o quiere, y una pregunta que ya trae la respuesta adentro no busca entender: acusa con signo de interrogación.',
            en:'Asking which part worries them most leaves the next word to the other person and opens the conversation instead of closing it. The other three assume in advance what the interlocutor thinks or wants, and a question that already carries the answer inside is not seeking to understand: it accuses with a question mark.' },
      options:[ c2,
        { es:'¿Verdad que a ustedes no les importa lo que opinen las familias?',
          en:'¿Verdad que a ustedes no les importa lo que opinen las familias?' },
        { es:'¿Para qué preguntan, si de todas maneras ya lo tenían decidido?',
          en:'¿Para qué preguntan, si de todas maneras ya lo tenían decidido?' },
        { es:'¿No les da pena hacernos venir para avisarnos las cosas a última hora?',
          en:'¿No les da pena hacernos venir para avisarnos las cosas a última hora?' } ],
      correct: c2
    };
  }

  function q10() {
    if (rng() < 0.5) {
      var c1 = { es:'Puede separar lo que ocurrió, que es comprobable, de lo que alguien sostiene sobre ello, y juzgar los argumentos con los datos a la mano.',
                 en:'They can separate what happened, which is checkable, from what somebody claims about it, and judge the arguments with the data in hand.' };
      return {
        title:{ es:'Leer los dos y no uno solo', en:'Reading both and not just one' },
        q:{ es:'Determina qué gana quien lee juntos el texto I y el texto II, y no solo uno de los dos.',
            en:'Determine what is gained by reading text I and text II together, and not just one of the two.' },
        hint:{ es:'Piensa qué le faltaría a alguien que solo leyera el artículo de opinión, y qué le faltaría a alguien que solo leyera la nota informativa.',
               en:'Think about what would be missing for somebody who read only the opinion article, and what would be missing for somebody who read only the news report.' },
        exp:{ es:'Los dos textos no se contradicen: uno registra el acuerdo y el otro lo defiende. Leerlos juntos permite comprobar si las razones del artículo se apoyan en los hechos de la nota, que es exactamente lo que hiciste al rastrear el dato de los ensayos. Quien lee solo la nota se queda sin razones para pensar el asunto, y quien lee solo el artículo tiene que aceptar los hechos sin poder revisarlos.',
              en:'The two texts do not contradict each other: one records the agreement and the other defends it. Reading them together makes it possible to check whether the reasons in the article rest on the facts in the report, which is exactly what you did when tracing the datum about the rehearsals. Whoever reads only the report is left without reasons to think the matter through, and whoever reads only the article has to accept the facts without being able to review them.' },
        options:[ c1,
          { es:'Descubre que la nota informativa se equivocó en varios datos y que el artículo los corrige.',
            en:'They discover that the news report got several data wrong and that the article corrects them.' },
          { es:'Obtiene dos versiones opuestas de lo ocurrido y debe decidir cuál de las dos pasó en realidad.',
            en:'They get two opposite versions of what happened and must decide which of the two actually took place.' },
          { es:'Encuentra el mismo contenido dos veces, una vez en lenguaje sencillo y otra en lenguaje difícil.',
            en:'They find the same content twice, once in simple language and once in difficult language.' } ],
        correct: c1
      };
    }
    var c2 = { es:'Que una diferencia entre vecinos se resolvió con datos, con una votación y con palabras que no descalifican a nadie.',
               en:'That a difference between neighbours was settled with data, with a vote and with words that dismiss nobody.' };
    return {
      title:{ es:'Leer los dos y no uno solo', en:'Reading both and not just one' },
      q:{ es:'La asamblea del texto I y la conversación del texto III ocurren en la misma reunión. Determina qué muestran juntas sobre la manera en que se trató el desacuerdo en Villa Progreso.',
          en:'The assembly of text I and the conversation of text III happen at the same meeting. Determine what they show together about the way the disagreement was handled in Villa Progreso.' },
      hint:{ es:'Junta el resultado de la votación con las intervenciones que sí llegaron a la mesa y pregúntate qué tuvieron en común esas intervenciones.',
             en:'Put the result of the vote together with the interventions that did reach the table and ask yourself what those interventions had in common.' },
      exp:{ es:'El texto I muestra que hubo desacuerdo real, porque nueve familias votaron en contra y tres pidieron una aclaración, y que aun así se llegó a un acuerdo. El texto III muestra con qué palabras se llegó: las intervenciones que aportaron algo fueron las que describieron hechos, reconocieron razones ajenas y pidieron cosas concretas. Nadie renunció a su postura y nadie quedó excluido de la conversación.',
            en:'Text I shows that there was real disagreement, because nine families voted against and three asked for a clarification, and that even so an agreement was reached. Text III shows with what words it was reached: the interventions that contributed something were those that described facts, acknowledged other people reasons and asked for concrete things. Nobody gave up their stance and nobody was left out of the conversation.' },
      options:[ c2,
        { es:'Que el desacuerdo se evitó porque las familias en contra prefirieron no hablar en la reunión.',
          en:'That the disagreement was avoided because the families against preferred not to speak at the meeting.' },
        { es:'Que la votación se aplazó hasta que todas las familias estuvieran de acuerdo entre sí.',
          en:'That the vote was postponed until all the families agreed with one another.' },
        { es:'Que el acuerdo se tomó sin discutirlo, porque nadie manifestó objeciones durante la asamblea.',
          en:'That the agreement was reached without discussion, because nobody raised objections during the assembly.' } ],
      correct: c2
    };
  }

  /* ///////// LA LECCIÓN: concepto, manipulativo, problema ///////// */

  sec(T('Punto de partida', 'Starting point'),
      T('Un pueblo, una asamblea, dos textos', 'One town, one assembly, two texts'),
      '<p>' + T('En cualquier sociedad donde conviven lenguas y costumbres distintas aparecen tensiones: alguien propone algo, otro alguien no está de acuerdo, y hay que decidir. Lo interesante es lo que ocurre después, cuando esa tensión llega a los textos. Sobre un mismo hecho se escriben textos que no persiguen lo mismo: unos quieren que el lector se entere de lo que pasó y otros quieren que el lector piense algo sobre lo que pasó. A los primeros se les llama informativos; a los segundos, argumentativos. Ninguno de los dos es más honesto que el otro, y los dos pueden estar bien escritos. Lo que cambia es el trabajo que hacen. Aquí tienes los dos textos que se publicaron en Villa Progreso a raíz de una asamblea escolar: aparecieron en la misma página del boletín, con tres días de diferencia. Las expresiones subrayadas son el material con el que vas a trabajar durante toda la guía, así que conviene volver a ellas cada vez que lo necesites.',
                'In any society where different languages and customs live side by side, tensions appear: somebody proposes something, somebody else disagrees, and a decision has to be made. What is interesting is what happens next, when that tension reaches the texts. About one and the same event, texts are written that do not pursue the same thing: some want the reader to learn what happened and others want the reader to think something about what happened. The first are called informative; the second, argumentative. Neither is more honest than the other, and both can be well written. What changes is the job they do. Here are the two texts published in Villa Progreso following a school assembly: they appeared on the same page of the bulletin, three days apart. The underlined expressions are the material you will work with throughout the guide, so it is worth coming back to them whenever you need to.') + '</p>' +
      textBlock(T1) +
      textBlock(T2) +
      '<div class="callout"><p><strong>' + T('Al leer:', 'While reading:') + '</strong> ' +
        T('en cada afirmación pregúntate si sería la misma escrita por alguien que piensa lo contrario.',
          'at each statement, ask yourself whether it would be the same if written by somebody who thinks the opposite.') + '</p></div>');
  widgetContraste();
  addP(q1());
  addP(q2());

  sec(T('Las marcas del oficio', 'The marks of the trade'),
      T('Seis huellas que delatan a cada texto', 'Six traces that give each text away'),
      '<p>' + T('Para comparar dos textos no basta con decir que uno informa y otro opina: hay que poder señalar dónde se nota. Y se nota en expresiones concretas que se pueden subrayar con el dedo. Un texto que informa está lleno de marcas de atribución, esas fórmulas que dicen de dónde salió cada dato para que cualquiera pueda ir a comprobarlo, y de datos comprobables, que serían los mismos aunque los escribiera otra persona. Un texto que argumenta trae otras: expresiones valorativas que califican lo ocurrido, marcas de postura donde quien escribe se hace responsable, conectores que ordenan las razones entre sí, y llamados a la acción que piden que algo se haga. Estas seis clases son la herramienta con la que se compara. Cuando las tienes en la mano, la diferencia entre los dos textos deja de ser una impresión y pasa a ser algo que puedes demostrar señalando la línea exacta.',
                'To compare two texts it is not enough to say that one informs and the other gives an opinion: you have to be able to point at where it shows. And it shows in concrete expressions you can underline with your finger. A text that informs is full of marks of attribution, those formulas stating where each datum came from so that anybody can go and check it, and of checkable data, which would be the same even if somebody else wrote them. A text that argues carries different ones: evaluative expressions that grade what happened, marks of stance where the writer takes responsibility, connectives that order the reasons among themselves, and calls to action asking for something to be done. These six kinds are the tool you compare with. Once you have them in hand, the difference between the two texts stops being an impression and becomes something you can prove by pointing at the exact line.') + '</p>' +
      '<div class="glosslist">' +
        MKEYS.map(function (k) {
          return '<div class="gloss"><div class="glossn">' + L(MARCA[k].n) + '</div><div class="glossd">' + L(MARCA[k].d) + '</div></div>';
        }).join('') +
      '</div>');
  widgetCaza();
  addP(q3());
  addP(q4());

  sec(T('Hechos y valoraciones', 'Facts and gradings'),
      T('Lo que el archivo guarda y lo que no', 'What the file keeps and what it does not'),
      '<p>' + T('Hay una prueba sencilla para separar un hecho de una valoración, y no depende de si la frase suena seria o de si quien la dice tiene razón. La prueba es esta: imagina que vas a la escuela con el acta de la asamblea y el registro de inscripción en la mano. Si con esos papeles puedes decidir si la afirmación es verdadera o falsa, estás ante un hecho. Si los papeles no alcanzan, porque lo que se afirma depende de cómo alguien juzga las cosas, estás ante una valoración. Conviene entender que una valoración no es una mentira ni un defecto: un texto argumentativo está hecho de valoraciones, y ese es su oficio. El problema aparece cuando una valoración se presenta con el aspecto de un dato, o cuando un lector confunde las dos cosas y termina creyendo que ya comprobó algo que en realidad solo le pareció convincente.',
                'There is a simple test for separating a fact from a grading, and it does not depend on whether the sentence sounds serious or on whether the person saying it is right. The test is this: imagine you go to the school with the assembly minutes and the enrolment register in hand. If with those papers you can decide whether the statement is true or false, you are facing a fact. If the papers are not enough, because what is claimed depends on how somebody judges things, you are facing a grading. It is worth understanding that a grading is not a lie nor a flaw: an argumentative text is made of gradings, and that is its trade. The problem appears when a grading is presented with the look of a datum, or when a reader confuses the two and ends up believing they have checked something that in fact merely struck them as convincing.') + '</p>');
  widgetComprobable();
  addP(q5());
  addP(q6());

  sec(T('Cuando la tensión se habla', 'When the tension is spoken'),
      T('Tres maneras de estar en desacuerdo', 'Three ways of disagreeing'),
      '<p>' + T('Antes de que existieran esos dos textos hubo una reunión, y en la reunión hubo gente que no estaba de acuerdo. Ahí se ve la otra mitad del asunto: no basta con tener razón, hay que poder decirla de manera que llegue. Frente a un desacuerdo caben tres respuestas. Una es callarse y ceder, que parece cortesía y en realidad deja la propia posición fuera de la decisión. Otra es atacar a la persona que tenemos enfrente, que suele sentirse como firmeza y consigue lo contrario, porque el otro deja de pensar en el asunto y se dedica a defenderse. La tercera es decir lo propio con claridad, apuntando al hecho y no a la persona, y dejando la conversación abierta para que el otro pueda responder. A esa tercera se le llama comunicación asertiva, y no significa hablar bonito ni bajar el tono: significa que el desacuerdo llegue completo a la mesa sin expulsar a nadie de ella. Aquí tienes seis intervenciones de aquella reunión, en el orden en que ocurrieron.',
                'Before those two texts existed there was a meeting, and at the meeting there were people who did not agree. That is where the other half of the matter shows: it is not enough to be right, you have to be able to say it in a way that arrives. Faced with a disagreement there are three possible answers. One is to fall silent and give way, which looks like politeness and in fact leaves your own position out of the decision. Another is to attack the person in front of us, which usually feels like firmness and achieves the opposite, because the other person stops thinking about the matter and devotes themselves to self defence. The third is to say your own thing clearly, aiming at the fact and not at the person, and leaving the conversation open so that the other can answer. That third one is called assertive communication, and it does not mean speaking prettily or lowering your tone: it means the disagreement arrives whole at the table without expelling anybody from it. Here are six interventions from that meeting, in the order in which they happened.') + '</p>' +
      turnosBlock() +
      '<div class="glosslist">' +
        TONOS.map(function (b) {
          return '<div class="gloss"><div class="glossn">' + L(b.n) + '</div><div class="glossd">' + L(b.d) + '</div></div>';
        }).join('') +
      '</div>');
  widgetTonos();
  addP(q7());

  sec(T('Las piezas del mensaje', 'The pieces of the message'),
      T('Cuatro partes que vuelven difícil el rechazo', 'Four parts that make rejection hard'),
      '<p>' + T('Una intervención asertiva no se improvisa: tiene partes, y esas partes van en un orden que no es casual. Primero se nombra el hecho, sin adjetivos, porque es lo único que nadie puede negar y sirve de terreno común. Después se dice el efecto que ese hecho tiene en quien habla, en primera persona, porque de lo propio nadie puede decir que es falso. En tercer lugar se reconoce la razón que asiste a la otra parte, y eso desarma la defensa antes de que se levante. Solo al final llega la petición, concreta y realizable, cuando el otro ya se quedó sin motivos para rechazarla. Si la petición se pone al principio suena a exigencia; si el reconocimiento se pone al final suena a consuelo. Es el mismo movimiento que hace por escrito el texto II cuando concede algo con es cierto que antes de limitarlo con sin embargo.',
                'An assertive intervention is not improvised: it has parts, and those parts go in an order that is not accidental. First the fact is named, with no adjectives, because it is the only thing nobody can deny and it serves as common ground. Then comes the effect that fact has on the speaker, in the first person, because nobody can say that what is your own is false. In third place comes acknowledging the reason the other side has, and that disarms the defence before it goes up. Only at the end comes the request, concrete and doable, when the other person has run out of reasons to reject it. If the request is placed first it sounds like a demand; if the acknowledgement is placed last it sounds like consolation. It is the same move text II makes in writing when it concedes something with es cierto que before limiting it with sin embargo.') + '</p>');
  widgetArmar();
  addP(q8());

  sec(T('Herramientas de la asamblea', 'Tools of the assembly'),
      T('Cuatro maneras de sostener lo propio', 'Four ways of holding your own ground'),
      '<p>' + T('Las cuatro piezas se combinan de distintas formas según lo que haga falta en cada momento de una discusión. A veces basta con hablar del efecto que algo tiene en uno, y eso ya evita la acusación. A veces lo que hace falta es reconocer en voz alta la razón del otro antes de contradecirlo, porque quien se siente escuchado escucha. A veces la conversación se destraba con una petición concreta, algo que se pueda cumplir o discutir, en lugar de una queja general. Y a veces la mejor intervención no afirma nada: pregunta, porque quien pregunta todavía no sabe lo que el otro piensa y decide averiguarlo antes de responder. En las intervenciones de la asamblea están las cuatro herramientas, cada una en boca de una persona distinta.',
                'The four pieces combine in different ways according to what is needed at each moment of a discussion. Sometimes it is enough to speak about the effect something has on you, and that already avoids the accusation. Sometimes what is needed is to acknowledge out loud the reason the other person has before contradicting them, because whoever feels heard listens. Sometimes the conversation is unblocked by a concrete request, something that can be met or disputed, instead of a general complaint. And sometimes the best intervention claims nothing: it asks, because whoever asks does not yet know what the other thinks and decides to find out before answering. In the interventions of the assembly all four tools are present, each one in the mouth of a different person.') + '</p>');
  widgetParejas();
  addP(q9());

  sec(T('Cierre', 'Wrap-up'),
      T('Lo que sostiene una sociedad que discute', 'What holds up a society that argues'),
      '<p>' + T('En Villa Progreso nadie cambió de idea porque sí. Nueve familias siguieron pensando que la ceremonia debía hacerse en una sola lengua, y aun así el acuerdo se tomó, se escribió y se publicó, y alguien pudo responderle por escrito a quien no estaba de acuerdo. Eso es lo que hace una sociedad intercultural: no borra las diferencias ni finge que todos piensan igual, sino que les da un lugar donde tramitarse, con datos que cualquiera puede revisar y con palabras que no expulsan a nadie de la conversación. Comparar dos textos sirve exactamente para eso, para saber cuándo te están informando y cuándo te están convenciendo, y para poder participar sabiendo qué tienes enfrente. Antes de la última pregunta, mira los dos textos completos una vez más y quédate con lo que cada uno te dejó.',
                'In Villa Progreso nobody changed their mind for no reason. Nine families went on thinking the ceremony should be held in one language only, and even so the agreement was reached, written down and published, and somebody was able to answer in writing the person who disagreed. That is what an intercultural society does: it neither erases differences nor pretends that everybody thinks alike, but gives them a place where they can be processed, with data anybody can review and with words that expel nobody from the conversation. Comparing two texts serves exactly that purpose, to know when you are being informed and when you are being persuaded, and to be able to take part knowing what you have in front of you. Before the last question, look at the two complete texts once more and keep what each one left you.') + '</p>');
  widgetCuaderno();
  addP(q10());
}
</script>

<!-- LIAXA ANALYTICS -->
<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbykkuJ_apGq3vALIFd4mr3acu81c7K4OKxW-DZ-i52Ceyl3lOanXMdvbS9SIXPrLQBm/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'Comparar Textos sobre Sociedades Contemporáneas y Comunicación Asertiva';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
</body>
