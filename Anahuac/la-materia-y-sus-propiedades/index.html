<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Materia y sus Propiedades</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }

/* ── GUIDE WIDGETS (la materia y sus propiedades) ── */
.iw-tag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.4rem; }
.iw-box { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; padding:1rem; }
.iw-sub { font-size:.88rem; color:var(--text2); margin-bottom:.7rem; }
.rondas { font-family:'IBM Plex Mono',monospace; font-size:.7rem; color:var(--text3); letter-spacing:.08em; text-transform:uppercase; margin-bottom:.45rem; }
.rfb { font-size:.84rem; margin-top:.6rem; min-height:1.35rem; color:var(--text2); }
.rfb b { color:var(--green-dark); }
.okmsg { color:var(--ok); font-weight:700; }
.rverify-btn { background:var(--green); color:#fff; border:none; border-radius:8px; padding:.6rem 1.2rem; font-size:.86rem; font-weight:600; cursor:pointer; min-height:44px; margin-top:.7rem; font-family:inherit; }
.rverify-btn:hover { background:var(--green-dark); }
.goalbar { font-size:.83rem; color:var(--text2); background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.45rem .7rem; margin-bottom:.65rem; }
.gcanvas { display:block; width:100%; height:260px; border:1px solid var(--border); border-radius:8px; background:var(--surface); touch-action:manipulation; }
.krow { display:flex; align-items:center; gap:.6rem; margin-top:.6rem; flex-wrap:wrap; }
.krow input[type=range] { flex:1; min-width:140px; accent-color:var(--green); height:34px; }
.klbl { font-size:.78rem; color:var(--text3); min-width:78px; }
.kval { font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:.92rem; color:var(--green); min-width:56px; text-align:right; }
.readrow { display:grid; grid-template-columns:repeat(3,1fr); gap:.5rem; margin-top:.8rem; }
.readcell { background:var(--surface2); border-radius:8px; padding:.55rem; text-align:center; }
.readlbl { font-size:.64rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.readnum { font-family:'IBM Plex Mono',monospace; font-size:1rem; font-weight:700; color:var(--green-dark); }
.defgrid { display:grid; grid-template-columns:repeat(2,1fr); gap:.6rem; margin:1rem 0; }
.defcell { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.75rem; border-top:3px solid var(--green); }
.defname { font-size:.72rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.25rem; }
.deftxt { font-size:.82rem; color:var(--text2); }
.dgrid { display:grid; grid-template-columns:repeat(4,1fr); gap:.5rem; margin:.9rem 0; }
.dcell { background:var(--surface2); border-radius:8px; padding:.5rem .35rem; text-align:center; }
.dname { font-size:.72rem; color:var(--text3); margin-bottom:.12rem; }
.dval { font-family:'IBM Plex Mono',monospace; font-size:.88rem; font-weight:700; color:var(--green-dark); }
.cls-prog { font-family:'IBM Plex Mono',monospace; font-size:.7rem; color:var(--text3); letter-spacing:.08em; text-transform:uppercase; margin-bottom:.45rem; }
.cls-card { background:var(--surface2); border:1.5px solid var(--border); border-radius:10px; padding:.85rem; text-align:center; font-weight:600; font-size:.9rem; margin:.6rem 0; color:var(--text); }
.cls-bins { display:flex; gap:.5rem; flex-wrap:wrap; }
.cls-bin { flex:1; min-width:112px; min-height:44px; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.85rem; font-weight:600; cursor:pointer; font-family:inherit; padding:.5rem; }
.cls-bin:hover { border-color:var(--green); color:var(--green); }
.cls-done { font-weight:700; color:var(--ok); text-align:center; padding:.6rem; }
.tstbtns { display:flex; flex-direction:column; gap:.45rem; margin:.6rem 0; }
.tstbtn { min-height:44px; text-align:left; padding:.6rem .8rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.85rem; font-family:inherit; cursor:pointer; }
.tstbtn:hover { border-color:var(--green); color:var(--green); }
.tstbtn.used { border-style:dashed; color:var(--text3); }
.tstbtn.good { border-color:var(--ok); color:var(--ok); font-weight:600; }
.loglist { margin-top:.55rem; border-left:3px solid var(--gold); padding-left:.75rem; }
.logitem { font-size:.82rem; color:var(--text2); margin-bottom:.35rem; }
.logitem b { color:var(--green-dark); }
.chiprow { display:flex; flex-wrap:wrap; gap:.5rem; margin-top:.7rem; }
.chip { min-height:44px; padding:.5rem .9rem; border:1.5px solid var(--border); border-radius:20px; background:var(--surface2); color:var(--text); font-size:.85rem; font-weight:600; font-family:inherit; cursor:pointer; }
.chip:hover { border-color:var(--green); color:var(--green); }
.simbtns { display:flex; gap:.45rem; flex-wrap:wrap; margin-top:.7rem; }
.simbtn { min-height:44px; padding:.5rem .85rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.83rem; font-weight:600; font-family:inherit; cursor:pointer; }
.simbtn:hover { border-color:var(--green); color:var(--green); }
.simbtn.rst { color:var(--bad); }
.dataline { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); background:var(--surface2); border-radius:8px; padding:.5rem .7rem; margin:.5rem 0; }
.reflect-prompt { font-size:.92rem; color:var(--text2); margin:.5rem 0 .8rem; }
@media (max-width:600px) {
  .defgrid { grid-template-columns:1fr; }
  .dgrid { grid-template-columns:repeat(2,1fr); }
  .cls-bins { flex-direction:column; }
  .gcanvas { height:240px; }

function setLang(l){

/* ── Attempt counter + seed (Rule 4): seed = name+group+attempt ── */
function getAttemptKey(name, group){ return 'liaxa_cneyt1_t01_g01__att__' + (name+'__'+group).replace(/\s+/g,'_'); }
function nextAttempt(name, group){ var k=getAttemptKey(name,group),n=0; try{n=parseInt(localStorage.getItem(k)||'0',10)||0;}catch(e){} n++; try{localStorage.setItem(k,String(n));}catch(e){} return n; }
function currentAttempt(name, group){ var k=getAttemptKey(name,group); try{return parseInt(localStorage.getItem(k)||'1',10)||1;}catch(e){return 1;} }
/* ================================================
   STATE
   ================================================ */
var studentData   = {};
var problems      = [];

/* ================================================
   SESSION PERSISTENCE  (localStorage)
   ================================================ */
function lsKey() {
  var n = (studentData.name  || '').trim();
  var g = (studentData.group || '').trim();
  return 'liaxa_cneyt1_t01_g01__' + (n + '__' + g).replace(/\s+/g, '_');
}

function saveSession() {
  if (!studentData.name) return;
  var drawings = [], texts = [], photos = [];
  problems.forEach(function(p, i) {
    var dc = document.getElementById('dc' + i);
    if (dc && dc.width) {
      var blank = document.createElement('canvas');
      blank.width = dc.width; blank.height = dc.height;
      drawings.push(dc.toDataURL() === blank.toDataURL() ? null : dc.toDataURL('image/png'));
    } else { drawings.push(null); }
    var ta = document.getElementById('ta' + i);
    texts.push(ta ? ta.value : '');
    var pp = document.getElementById('pp' + i);
    photos.push((pp && pp.src && pp.src.indexOf('data:') === 0) ? pp.src : null);
  });
  var state = {
    name: studentData.name, group: studentData.group,
    answeredCount: answeredCount, correctCount: correctCount,
    choices: problems.map(function(p) { return p.studentChoice; }),
    drawings: drawings, texts: texts, photos: photos
  };
  try { localStorage.setItem(lsKey(), JSON.stringify(state)); } catch(e) {}
}

function loadSession(name, group) {
  var key = 'liaxa_cneyt1_t01_g01__' + (name + '__' + group).replace(/\s+/g, '_');
  try { var r = localStorage.getItem(key); return r ? JSON.parse(r) : null; } catch(e) { return null; }
}

function restoreSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  var saved = loadSession(name, group);
  if (!saved) return;
  document.getElementById('restoreBar').style.display = 'none';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = currentAttempt(name, group);
  buildLesson(seededRng(name + group + att));

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

    doc.text(ok?'✓':'✗', M+4.5, sy+6.5);

  });

  for (var i = 0; i < problems.length; i++) {

    doc.setTextColor(pBR,pBG,pBB); doc.setFontSize(6.5); doc.setFont('helvetica','bold');
    doc.text('PREGUNTA', M+4, wy+6);
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var qy = wy+12;
    qLines.forEach(function(ln,li){ doc.text(ln, M+4, qy+li*5); });
    wy += qBoxH + 4;

    var isOk   = document.getElementById('pc'+i).classList.contains('ok');
    var chosen = prob.studentChoice != null ? pdfText(prob.options[prob.studentChoice]||'-') : '-';
    var corr   = pdfText(prob.options[prob.correctIdx]||'');
    var expRaw = pdfText(prob.explanation||'');
    doc.setFontSize(8.5); var chLines = doc.splitTextToSize('Alumno: '+chosen, TW-18);
    doc.setFontSize(8);   var coLines = doc.splitTextToSize('Correcto: '+corr, TW-18);
    doc.setFontSize(7.5); var exLines = doc.splitTextToSize('Solución: '+expRaw, TW-18).slice(0,4);
    var ansBoxH = 8 + chLines.length*5.5 + coLines.length*5 + exLines.length*5 + 6;
    doc.setFillColor(isOk?232:255, isOk?240:232, isOk?232:228);
    doc.roundedRect(M,wy,TW,ansBoxH,2,2,'F');
    doc.setFillColor(isOk?26:176, isOk?106:48, isOk?74:16);
    doc.circle(M+7, wy+8, 3.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(9); doc.setFont('helvetica','bold');
    doc.text(isOk?'✓':'✗', M+5.2, wy+10.5);
    var ay = wy+7;
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','bold');
    chLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5.5); });
    ay += chLines.length*5.5 + 3;
    doc.setTextColor(26,106,74); doc.setFontSize(8); doc.setFont('helvetica','normal');
    coLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    ay += coLines.length*5 + 3;
    doc.setTextColor(90,85,80); doc.setFontSize(7.5);
    exLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    wy += ansBoxH + 5;

    doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
    doc.setFontSize(7); doc.setFont('helvetica','bold');
    doc.rect(M,wy,TW,8,'F'); doc.text('TRABAJO DEL ALUMNO', M+4, wy+5.5);
    wy += 11;

    var dc = document.getElementById('dc'+i);
    if (dc) {
      try {
        var imgD = dc.toDataURL('image/png');
        var ar   = dc.height / dc.width;
        var iw   = TW;
        var ih   = Math.min(iw * ar, 68);
        doc.addImage(imgD, 'PNG', M, wy, iw, ih);
        wy += ih + 4;
      } catch(e) {}
    }

    var ta = document.getElementById('ta'+i);
    if (ta && ta.value.trim()) {
      if (wy > PH-30) { doc.addPage(); wy = 20; }
      doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('courier','normal');
      var taLines = doc.splitTextToSize(ta.value, TW);
      taLines.slice(0,16).forEach(function(ln) {
        if (wy > PH-15) { doc.addPage(); wy = 20; }
        doc.text(ln, M, wy); wy += 5;
      });
      wy += 2;
    }

    var pp = document.getElementById('pp'+i);
    if (pp && pp.src && pp.src.indexOf('data:') === 0) {
      if (wy > PH-55) { doc.addPage(); wy = 20; }
      try { doc.addImage(pp.src, 'JPEG', M, wy, TW, 68); wy += 72; } catch(e) {}
    }
  }

  // ── Footer on every page ──
  var pages = doc.internal.getNumberOfPages();
  for (var p = 1; p <= pages; p++) {
    doc.setPage(p);
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0, PH-3, PW, 3, 'F');
    doc.setTextColor(130,140,160); doc.setFontSize(6.5); doc.setFont('helvetica','normal');
    doc.text(name+'  ·  '+group+'  ·  Código: '+code+'  ·  Página '+p+'/'+pages,
      PW/2, PH-5, {align:'center'});
  }

  doc.save('cneyt1_t01_g01_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf');
  btn.innerHTML = '⬇ &nbsp;Descargar Resultados PDF';
  btn.disabled  = false;
}

/* ================================================
   buildLesson: La materia y sus propiedades (La Materia y sus Interacciones, Sem 1)
   Interleaved: idea -> manipulativo -> problema(s). Cards built inline.
   ================================================ */
function buildLesson(rng) {
  var LB = document.getElementById('lessonBody');
  LB.innerHTML = '';
  problems = [];

  /* ============================================================
     HELPERS
     ============================================================ */
  function T(o){
    if (o === undefined || o === null) return '';
    if (typeof o === 'string' || typeof o === 'number') return o;
    if (Object.prototype.toString.call(o) === '[object Array]') return o;
    return (o[LANG] !== undefined ? o[LANG] : o.es);
  }
  function ri(a,b){ return a + Math.floor(rng()*(b-a+1)); }
  function shufA(arr){
    var a = arr.slice(), i, j, t;
    for (i=a.length-1;i>0;i--){ j=Math.floor(rng()*(i+1)); t=a[i]; a[i]=a[j]; a[j]=t; }
    return a;
  }
  function sec(tag, title, html){
    var d = document.createElement('div');
    d.className = 'section';
    d.innerHTML = '<div class="stag">'+tag+'</div><h2>'+title+'</h2>'+(html||'');
    LB.appendChild(d);
    return d;
  }
  function widget(kind){
    var d = document.createElement('div');
    d.className = kind + 'wrap section';
    d.setAttribute('data-widget', kind);
    d.id = 'w' + kind;
    LB.appendChild(d);
    return d;
  }
  function cssv(n){
    try { var v = getComputedStyle(document.documentElement).getPropertyValue(n); return v ? v.trim() : ''; }
    catch(e){ return ''; }
  }
  function fitCv(cv){
    var dpr = window.devicePixelRatio || 1;
    var w = cv.clientWidth || 320, h = cv.clientHeight || 250;
    cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr);
    var ctx = cv.getContext('2d');
    ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,w,h);
    return { ctx:ctx, w:w, h:h };
  }
  function fmt1(x){ return (Math.round(x*10)/10).toFixed(1); }
  function fmt2(x){ return (Math.round(x*100)/100).toFixed(2); }
  function uniq4(correct, cands){
    var out = [correct], i;
    for (i=0;i<cands.length && out.length<4;i++){
      if (out.indexOf(cands[i]) < 0) out.push(cands[i]);
    }
    return out;
  }
  function addProb(spec){
    var so  = shufA(T(spec.options));
    var cor = T(spec.correct);
    problems.push({
      title: T(spec.title),
      questionText: T(spec.q),
      fn: '',
      hint: T(spec.hint),
      explanation: T(spec.exp),
      options: so,
      correctIdx: so.indexOf(cor),
      showWork: !!spec.showWork,
      studentChoice: null,
      pendingChoice: null
    });
    buildOneCard(problems[problems.length-1], problems.length-1);
  }

  /* Densidades de referencia, en décimas de g/cm³ */
  var SUB = [
    { es:'Magnesio', en:'Magnesium',  dt:17  },
    { es:'Aluminio', en:'Aluminium',  dt:27  },
    { es:'Titanio',  en:'Titanium',   dt:45  },
    { es:'Zinc',     en:'Zinc',       dt:71  },
    { es:'Hierro',   en:'Iron',       dt:79  },
    { es:'Cobre',    en:'Copper',     dt:89  },
    { es:'Plata',    en:'Silver',     dt:105 },
    { es:'Plomo',    en:'Lead',       dt:113 }
  ];
  function dOf(i){ return SUB[i].dt/10; }

  /* ============================================================
     VALORES CON SEMILLA (se extraen una sola vez, en orden fijo)
     ============================================================ */
  var vP1 = Math.floor(rng()*2), vP2 = Math.floor(rng()*2), vP3 = Math.floor(rng()*2);
  var vP4 = Math.floor(rng()*2), vP6 = Math.floor(rng()*2), vP8 = Math.floor(rng()*2);
  var vP10 = Math.floor(rng()*2);

  /* manipulativo 1: clasificador extensiva / intensiva */
  var clsSeq = shufA([0,1,2,3,4,5,6,7]);

  /* manipulativo 2: mesa de pruebas */
  var tstOff = Math.floor(rng()*2);

  /* manipulativo 3: termómetro y partículas */
  var estR = [], estPts = [], ei, etf, ete;
  for (ei=0; ei<3; ei++){
    etf = ri(10,60); ete = etf + ri(70,120);
    estR.push({ tf:etf, te:ete, lo:etf-60, hi:ete+70, start:etf-40 });
  }
  for (ei=0; ei<28; ei++) estPts.push([rng(), rng()]);

  /* manipulativo 4: laboratorio de densidad */
  var denR = [], di, dsi, dothers;
  var denIdx = shufA([0,1,2,3,4,5,6,7]).slice(0,3);
  for (di=0; di<3; di++){
    dsi = denIdx[di];
    dothers = shufA([0,1,2,3,4,5,6,7].filter(function(k){ return k !== dsi; })).slice(0,3);
    denR.push({
      si: dsi,
      dv: ri(4,9),
      v0: 10*ri(3,6),
      pick: shufA([dsi].concat(dothers))
    });
    denR[di].m = SUB[dsi].dt * denR[di].dv / 10;
  }

  /* P2: dos fragmentos del mismo metal */
  var i2 = Math.floor(rng()*SUB.length);
  var V2a = ri(3,6), V2b = V2a + ri(3,7);
  if (V2b === 2*V2a) V2b = V2b + 1;
  var d2 = dOf(i2), m2a = SUB[i2].dt*V2a/10, m2b = SUB[i2].dt*V2b/10;

  /* P5 y P6: puntos de fusión y ebullición */
  var tf5 = ri(20,60), te5 = tf5 + ri(80,140), t05 = tf5 + ri(10,40);
  var tf6 = ri(15,55), te6 = tf6 + ri(85,145);
  var t06 = vP6 ? te6 + ri(15,45) : tf6 + ri(20,60);

  /* P7: identificación por densidad */
  var i7 = Math.floor(rng()*SUB.length);
  var dv7 = ri(4,9), v7a = 5*ri(4,8), v7b = v7a + dv7;
  var m7 = SUB[i7].dt*dv7/10;
  var o7 = shufA([i7].concat(shufA([0,1,2,3,4,5,6,7].filter(function(k){ return k !== i7; })).slice(0,3)));

  /* P9: masa de una pieza mayor del mismo material */
  var i9 = Math.floor(rng()*SUB.length);
  var V9a = ri(3,7), V9b = V9a + ri(4,9);
  var d9 = dOf(i9), m9a = SUB[i9].dt*V9a/10, m9b = SUB[i9].dt*V9b/10;

  /* P10: dos muestras, misma sustancia o no */
  var iA = Math.floor(rng()*SUB.length);
  var iB = iA, kB;
  var candB = [0,1,2,3,4,5,6,7].filter(function(k){ return Math.abs(SUB[k].dt - SUB[iA].dt) >= 18; });
  kB = candB[Math.floor(rng()*candB.length)];
  if (!vP10) iB = kB;
  var VA = ri(4,8), VB = vP10 ? VA + ri(2,6) : ri(4,8);
  var mA = SUB[iA].dt*VA/10, mB = SUB[iB].dt*VB/10;
  var dA = dOf(iA), dB = dOf(iB);

  /* ============================================================
     IDEA 1
     ============================================================ */
  sec(T({es:'Idea 1', en:'Idea 1'}),
      T({es:'Lo que se mide de una muestra de materia', en:'What gets measured in a sample of matter'}),
      '<p>'+T({
        es:'Se llama materia a todo aquello que tiene masa y ocupa un volumen. Cualquier porción de materia que se lleva al laboratorio recibe el nombre de muestra, y describirla consiste en asignarle valores a sus propiedades: características que pueden medirse con un instrumento u observarse de forma controlada.',
        en:'Matter is anything that has mass and occupies a volume. Any portion of matter brought into the laboratory is called a sample, and describing it means assigning values to its properties: features that can be measured with an instrument or observed under controlled conditions.'
      })+'</p>'+
      '<p>'+T({
        es:'Las propiedades se reparten en dos grupos según cómo responden al tamaño de la muestra. Una propiedad extensiva cambia de valor cuando cambia la cantidad de materia: la masa, el volumen, la longitud y el calor que la muestra absorbe al calentarse pertenecen a este grupo. Una propiedad intensiva conserva su valor aunque la muestra sea grande o pequeña: la densidad, la temperatura de fusión, el color y la conductividad eléctrica son ejemplos.',
        en:'Properties fall into two groups according to how they respond to sample size. An extensive property changes value when the amount of matter changes: mass, volume, length and the heat the sample absorbs on warming belong to this group. An intensive property keeps its value whether the sample is large or small: density, melting temperature, colour and electrical conductivity are examples.'
      })+'</p>'+
      '<p>'+T({
        es:'La distinción tiene una consecuencia práctica inmediata. Para identificar una sustancia desconocida solo sirven sus propiedades intensivas, porque son las únicas que devuelven el mismo valor sin importar cuánto material haya en la mesa. La densidad es el caso más usado: se obtiene dividiendo la masa de la muestra entre el volumen que ocupa, y al duplicar la muestra se duplican masa y volumen, de modo que el cociente permanece intacto.',
        en:'The distinction has an immediate practical consequence. Only intensive properties serve to identify an unknown substance, because they are the only ones returning the same value no matter how much material sits on the bench. Density is the most used case: it comes from dividing the mass of the sample by the volume it occupies, and doubling the sample doubles both mass and volume, so the quotient stays untouched.'
      })+'</p>'+
      '<div class="defgrid">'+
        '<div class="defcell"><div class="defname">'+T({es:'Materia',en:'Matter'})+'</div><div class="deftxt">'+T({es:'Todo lo que posee masa y ocupa un volumen determinado.',en:'Anything that has mass and occupies a definite volume.'})+'</div></div>'+
        '<div class="defcell"><div class="defname">'+T({es:'Propiedad extensiva',en:'Extensive property'})+'</div><div class="deftxt">'+T({es:'Su valor depende de la cantidad de materia de la muestra.',en:'Its value depends on the amount of matter in the sample.'})+'</div></div>'+
        '<div class="defcell"><div class="defname">'+T({es:'Propiedad intensiva',en:'Intensive property'})+'</div><div class="deftxt">'+T({es:'Su valor no cambia al variar la cantidad de materia.',en:'Its value does not change when the amount of matter varies.'})+'</div></div>'+
        '<div class="defcell"><div class="defname">'+T({es:'Densidad',en:'Density'})+'</div><div class="deftxt">'+T({es:'Cociente de la masa de una muestra entre su volumen; es intensiva.',en:'Quotient of the mass of a sample by its volume; it is intensive.'})+'</div></div>'+
      '</div>');

  /* ---- MANIPULATIVO 1: clasificador extensiva / intensiva ---- */
  (function(){
    var wrap = widget('classify');
    var BINS = { es:['Extensiva','Intensiva'], en:['Extensive','Intensive'] };
    var ITEMS = [
      { es:'La masa de una barra de cobre colocada en la balanza',
        en:'The mass of a copper bar placed on the balance', bin:0,
        wes:'Al cortar la barra por la mitad, la balanza marca la mitad: el valor sigue a la cantidad de materia.',
        wen:'Cutting the bar in half makes the balance read half: the value follows the amount of matter.' },
      { es:'La temperatura a la que funde el ácido benzoico puro',
        en:'The temperature at which pure benzoic acid melts', bin:1,
        wes:'Un cristal aislado y un frasco entero funden a la misma temperatura.',
        wen:'A single crystal and a whole jar melt at the same temperature.' },
      { es:'El volumen de agua contenido en un matraz',
        en:'The volume of water held in a flask', bin:0,
        wes:'Vaciar la mitad del matraz cambia el valor medido, aunque el agua sea la misma sustancia.',
        wen:'Pouring out half the flask changes the measured value, even though the water is the same substance.' },
      { es:'La densidad de una lámina de aluminio',
        en:'The density of an aluminium sheet', bin:1,
        wes:'Al recortar la lámina, masa y volumen bajan en la misma proporción y el cociente no se mueve.',
        wen:'Trimming the sheet lowers mass and volume in the same proportion and the quotient does not move.' },
      { es:'La longitud de un alambre de hierro estirado sobre la mesa',
        en:'The length of an iron wire stretched out on the bench', bin:0,
        wes:'Dos tramos del mismo alambre dan lecturas distintas según cuánto alambre se tome.',
        wen:'Two pieces of the same wire give different readings depending on how much wire is taken.' },
      { es:'El color amarillo intenso de una disolución de dicromato',
        en:'The intense yellow colour of a dichromate solution', bin:1,
        wes:'El tono se conserva al pasar la disolución a un frasco más pequeño.',
        wen:'The shade is kept when the solution is transferred to a smaller bottle.' },
      { es:'El calor que absorbe una muestra de agua al pasar de 20 °C a 80 °C',
        en:'The heat a water sample absorbs when going from 20 °C to 80 °C', bin:0,
        wes:'Calentar el doble de agua por el mismo intervalo exige el doble de calor.',
        wen:'Heating twice as much water over the same interval demands twice the heat.' },
      { es:'La conductividad eléctrica del cobre a temperatura ambiente',
        en:'The electrical conductivity of copper at room temperature', bin:1,
        wes:'Un cable corto y uno largo del mismo cobre comparten el mismo valor de conductividad.',
        wen:'A short cable and a long one of the same copper share the same conductivity value.' }
    ];
    var st = { i:0, tries:0, hits:0, done:false, lock:false };

    function render(){
      if (st.done){
        wrap.innerHTML =
          '<div class="iw-tag">'+T({es:'Clasifica la propiedad', en:'Classify the property'})+'</div>'+
          '<div class="iw-box"><div class="cls-done">'+T({es:'Actividad completa: ',en:'Activity complete: '})+st.hits+' / '+ITEMS.length+'</div>'+
          '<div class="rfb">'+T({
            es:'La prueba mental es siempre la misma: parte la muestra a la mitad y pregunta si la medición cambia. Si cambia, la propiedad es extensiva; si no, es intensiva y sirve para identificar la sustancia.',
            en:'The mental test is always the same: cut the sample in half and ask whether the measurement changes. If it changes, the property is extensive; if not, it is intensive and serves to identify the substance.'
          })+'</div></div>';
        return;
      }
      var it = ITEMS[clsSeq[st.i]];
      var bins = T(BINS).map(function(b, bi){
        return '<button class="cls-bin" onclick="clsPick('+bi+')">'+b+'</button>';
      }).join('');
      wrap.innerHTML =
        '<div class="iw-tag">'+T({es:'Clasifica la propiedad', en:'Classify the property'})+'</div>'+
        '<div class="iw-box">'+
          '<div class="iw-sub">'+T({
            es:'Lee cada medición y decide si su valor depende de cuánta materia hay en la muestra.',
            en:'Read each measurement and decide whether its value depends on how much matter is in the sample.'
          })+'</div>'+
          '<div class="cls-prog">'+(st.i+1)+' / '+ITEMS.length+'</div>'+
          '<div class="cls-card">'+T(it)+'</div>'+
          '<div class="cls-bins">'+bins+'</div>'+
          '<div class="rfb" id="clsFb"></div>'+
        '</div>';
    }
    function adv(ms){
      st.lock = true;
      setTimeout(function(){
        st.lock = false; st.tries = 0; st.i++;
        if (st.i >= ITEMS.length) st.done = true;
        render();
      }, ms);
    }
    window.clsPick = function(bi){
      if (st.done || st.lock) return;
      var it = ITEMS[clsSeq[st.i]];
      var fb = document.getElementById('clsFb'); if (!fb) return;
      if (bi === it.bin){
        st.hits++;
        fb.innerHTML = '<span class="okmsg">'+T({es:'Correcto. ',en:'Correct. '})+'</span>'+T({es:it.wes,en:it.wen});
        adv(1500); return;
      }
      st.tries++;
      if (st.tries >= 3){
        fb.innerHTML = T({es:'Era <b>',en:'It was <b>'})+T(BINS)[it.bin]+'</b>. '+T({es:it.wes,en:it.wen});
        adv(2300); return;
      }
      fb.textContent = T({
        es:'Todavía no. Imagina que tomas la mitad de la muestra y repites la medición: el número que obtienes cambia o se queda igual.',
        en:'Not yet. Imagine taking half the sample and repeating the measurement: does the number you get change or stay the same.'
      });
    };
    render();
  })();

  /* ---- P1 ---- */
  (function(){
    var V = [

  /* ---- MANIPULATIVO 3: termómetro y partículas ---- */
  (function(){
    var wrap = widget('estados');
    var st = { r:0, T:estR[0].start, tries:0, done:false, lock:false };
    function R(){ return estR[st.r]; }
    function stOf(T){
      var d = R();
      if (T < d.tf) return 0;
      if (T === d.tf) return 3;
      if (T < d.te) return 1;
      if (T === d.te) return 4;
      return 2;
    }
    function stName(s){
      return [ T({es:'Sólido',en:'Solid'}), T({es:'Líquido',en:'Liquid'}), T({es:'Gaseoso',en:'Gas'}),
               T({es:'Sólido y líquido',en:'Solid and liquid'}), T({es:'Líquido y gaseoso',en:'Liquid and gas'}) ][s];
    }
    function goalTxt(){
      return [ T({es:'Ajusta la temperatura para que la sustancia esté en estado líquido.',
                  en:'Set the temperature so the substance sits in the liquid state.'}),
               T({es:'Ajusta la temperatura al valor exacto en el que coexisten el líquido y el gas.',
                  en:'Set the temperature to the exact value where liquid and gas coexist.'}),
               T({es:'Ajusta la temperatura para que la sustancia sea gas y esté al menos 20 °C por encima de su punto de ebullición.',
                  en:'Set the temperature so the substance is a gas and sits at least 20 °C above its boiling point.'}) ][st.r];
    }
    function meets(T){
      var d = R();
      if (st.r === 0) return T > d.tf && T < d.te;
      if (st.r === 1) return T === d.te;
      return T >= d.te + 20;
    }
    function solution(){
      var d = R();
      if (st.r === 0) return Math.round((d.tf + d.te)/2);
      if (st.r === 1) return d.te;
      return d.te + 35;
    }
    function draw(){
      var cv = document.getElementById('estCv'); if (!cv) return;
      var g = fitCv(cv), ctx = g.ctx, w = g.w, h = g.h, d = R();
      var pad = 14, thW = 34, boxX = pad + thW + 26, boxW = w - boxX - pad;
      var boxY = pad, boxH = h - 2*pad;
      var cP = cssv('--green'), cPD = cssv('--green-dark'), cG = cssv('--gold');
      var cS2 = cssv('--surface2'), cB = cssv('--border'), cT3 = cssv('--text3');
      function yOf(T){ return boxY + boxH - (T - d.lo)/(d.hi - d.lo)*boxH; }
      /* termómetro */
      ctx.fillStyle = cS2; ctx.fillRect(pad, boxY, thW, boxH);
      ctx.strokeStyle = cB; ctx.lineWidth = 1; ctx.strokeRect(pad, boxY, thW, boxH);
      var yT = yOf(st.T);
      ctx.fillStyle = cP; ctx.fillRect(pad, yT, thW, boxY + boxH - yT);
      ctx.strokeStyle = cG; ctx.lineWidth = 2;
      [d.tf, d.te].forEach(function(tv){
        ctx.beginPath(); ctx.moveTo(pad-4, yOf(tv)); ctx.lineTo(pad+thW+16, yOf(tv)); ctx.stroke();
      });
      ctx.fillStyle = cT3; ctx.font = '11px monospace';
      ctx.fillText('Tf ' + d.tf, pad + thW + 20, yOf(d.tf) + 4);
      ctx.fillText('Te ' + d.te, pad + thW + 20, yOf(d.te) + 4);
      /* caja de partículas */
      var s = stOf(st.T);
      var px = boxX + 4, py = boxY + boxH*0.30, pw = boxW - 8, ph = boxH*0.66;
      ctx.strokeStyle = cB; ctx.lineWidth = 1.5; ctx.strokeRect(px, py, pw, ph);
      ctx.fillStyle = cPD;
      var i, cx, cy, cols = 7, rows = 4, gx, gy;
      if (s === 0 || s === 3){
        for (i=0;i<cols*rows;i++){
          gx = i % cols; gy = Math.floor(i/cols);
          cx = px + pw*0.18 + gx*(pw*0.64/(cols-1)) + (estPts[i][0]-0.5)*3;
          cy = py + ph*0.42 + gy*(ph*0.44/(rows-1)) + (estPts[i][1]-0.5)*3;
          ctx.beginPath(); ctx.arc(cx, cy, 4.2, 0, 6.2832); ctx.fill();
        }
      } else if (s === 1 || s === 4){
        for (i=0;i<26;i++){
          cx = px + 10 + estPts[i][0]*(pw-20);
          cy = py + ph*0.42 + estPts[i][1]*(ph*0.52);
          ctx.beginPath(); ctx.arc(cx, cy, 4.2, 0, 6.2832); ctx.fill();
        }
      } else {
        for (i=0;i<22;i++){
          cx = px + 8 + estPts[i][0]*(pw-16);
          cy = py + 8 + estPts[i][1]*(ph-16);
          ctx.beginPath(); ctx.arc(cx, cy, 3.6, 0, 6.2832); ctx.fill();
        }
      }
      ctx.fillStyle = cT3; ctx.font = '12px sans-serif';
      ctx.fillText(stName(s), px + 4, py - 8);
    }
    function readouts(){
      var d = R(), el;
      el = document.getElementById('estTv'); if (el) el.textContent = st.T + ' °C';
      el = document.getElementById('estEst'); if (el) el.textContent = stName(stOf(st.T));
      el = document.getElementById('estDf'); if (el) el.textContent = (st.T - d.tf) + ' °C';
      el = document.getElementById('estDe'); if (el) el.textContent = (st.T - d.te) + ' °C';
    }
    function render(){
      if (st.done){
        wrap.innerHTML =
          '<div class="iw-tag">'+T({es:'Termómetro de estados', en:'State thermometer'})+'</div>'+
          '<div class="iw-box"><div class="cls-done">'+T({es:'Las tres sustancias quedaron ajustadas.',en:'All three substances have been set.'})+'</div>'+
          '<div class="rfb">'+T({
            es:'Los dos valores marcados en el termómetro cortan la escala en tres tramos, y solo cambian si cambia la sustancia. Esa es la razón por la que sirven para identificarla.',
            en:'The two values marked on the thermometer cut the scale into three stretches, and they only change if the substance changes. That is why they serve to identify it.'
          })+'</div></div>';
        return;
      }
      var d = R();
      wrap.innerHTML =
        '<div class="iw-tag">'+T({es:'Termómetro de estados', en:'State thermometer'})+'</div>'+
        '<div class="iw-box">'+
          '<div class="iw-sub">'+T({
            es:'Mueve el control de temperatura y observa cómo se reacomodan las partículas de la muestra al cruzar cada valor marcado.',
            en:'Move the temperature control and watch how the particles of the sample rearrange as each marked value is crossed.'
          })+'</div>'+
          '<div class="rondas">'+T({es:'Sustancia',en:'Substance'})+' '+(st.r+1)+' / 3</div>'+
          '<div class="goalbar">'+goalTxt()+'</div>'+
          '<canvas class="gcanvas" id="estCv"></canvas>'+
          '<div class="krow"><span class="klbl">'+T({es:'Temp.',en:'Temp.'})+'</span>'+
            '<input type="range" min="'+d.lo+'" max="'+d.hi+'" step="1" value="'+st.T+'" oninput="estSet(this.value)">'+
            '<span class="kval" id="estTv">'+st.T+' °C</span></div>'+
          '<div class="readrow">'+
            '<div class="readcell"><div class="readlbl">'+T({es:'Estado',en:'State'})+'</div><div class="readnum" id="estEst">'+stName(stOf(st.T))+'</div></div>'+
            '<div class="readcell"><div class="readlbl">'+T({es:'Respecto a Tf',en:'Relative to Tf'})+'</div><div class="readnum" id="estDf">'+(st.T - d.tf)+' °C</div></div>'+
            '<div class="readcell"><div class="readlbl">'+T({es:'Respecto a Te',en:'Relative to Te'})+'</div><div class="readnum" id="estDe">'+(st.T - d.te)+' °C</div></div>'+
          '</div>'+
          '<button class="rverify-btn" onclick="estChk()">'+T({es:'Verificar',en:'Check'})+'</button>'+
          '<div class="rfb" id="estFb"></div>'+
        '</div>';
      draw();
      setTimeout(draw, 170);
    }
    function adv(ms){
      st.lock = true;
      setTimeout(function(){
        st.lock = false; st.r++; st.tries = 0;
        if (st.r >= estR.length) st.done = true;
        else st.T = estR[st.r].start;
        render();
      }, ms);
    }
    window.estSet = function(v){
      if (st.done || st.lock) return;
      st.T = parseInt(v,10) || 0;
      draw(); readouts();
    };
    window.estChk = function(){
      if (st.done || st.lock) return;
      var fb = document.getElementById('estFb'); if (!fb) return;
      var d = R();
      if (meets(st.T)){
        fb.innerHTML = '<span class="okmsg">'+T({es:'Correcto. ',en:'Correct. '})+'</span>'+
          [ T({es:'Entre los dos valores marcados las partículas se deslizan sin separarse: ese tramo completo corresponde al líquido.',
               en:'Between the two marked values the particles slide without separating: that whole stretch corresponds to the liquid.'}),
            T({es:'En ese valor exacto conviven líquido y gas, y la temperatura deja de subir mientras dura el cambio de estado.',
               en:'At that exact value liquid and gas live together, and the temperature stops rising while the change of state lasts.'}),
            T({es:'Por encima de la ebullición las partículas se dispersan y ocupan todo el recipiente disponible.',
               en:'Above boiling the particles scatter and fill the whole available container.'}) ][st.r];
        adv(2500); return;
      }
      st.tries++;
      if (st.tries >= 3){
        st.T = solution();
        render();
        var fb2 = document.getElementById('estFb'); if (!fb2) return;
        fb2.innerHTML = T({es:'Esta temperatura cumple el objetivo. Observa dónde queda respecto a los dos valores marcados en la escala.',
                           en:'This temperature meets the goal. Notice where it sits relative to the two values marked on the scale.'});
        adv(3400); return;
      }
      var msg;
      if (st.r === 0){
        if (st.T < d.tf) msg = T({es:'Estás ',en:'You are '})+(d.tf - st.T)+T({es:' °C por debajo del punto de fusión: las partículas siguen en posiciones fijas. Sube la temperatura.',
                                                                              en:' °C below the melting point: the particles are still in fixed positions. Raise the temperature.'});
        else if (st.T === d.tf) msg = T({es:'Justo en ese valor coexisten sólido y líquido. Sube un poco más para tener solo líquido.',
                                         en:'At that exact value solid and liquid coexist. Go a little higher to have liquid alone.'});
        else if (st.T === d.te) msg = T({es:'Justo en ese valor coexisten líquido y gas. Baja un poco para quedarte solo en el líquido.',
                                         en:'At that exact value liquid and gas coexist. Come down a little to stay in the liquid alone.'});
        else msg = T({es:'Rebasaste la ebullición por ',en:'You went past boiling by '})+(st.T - d.te)+T({es:' °C y la muestra ya es gas. Baja la temperatura.',
                                                                                                        en:' °C and the sample is already a gas. Lower the temperature.'});
      } else if (st.r === 1){
        if (st.T < d.te) msg = T({es:'Te faltan ',en:'You are short by '})+(d.te - st.T)+T({es:' °C para llegar al valor donde empieza a hervir.',
                                                                                            en:' °C to reach the value where boiling starts.'});
        else msg = T({es:'Te pasaste ',en:'You overshot by '})+(st.T - d.te)+T({es:' °C del valor donde empieza a hervir.',
                                                                                en:' °C past the value where boiling starts.'});
      } else {
        if (st.T <= d.te) msg = T({es:'Todavía no hierve: te faltan ',en:'It is not boiling yet: you are short by '})+(d.te + 20 - st.T)+T({es:' °C para cumplir el margen pedido.',
                                                                                                                                          en:' °C to meet the margin asked for.'});
        else msg = T({es:'Ya es gas, pero el margen sobre la ebullición es de ',en:'It is a gas already, but the margin over boiling is '})+(st.T - d.te)+T({es:' °C. Sube un poco más.',
                                                                                                                                                          en:' °C. Go a little higher.'});
      }
      fb.textContent = msg;
    };
    render();
  })();

  (function(){
    var wrap = widget('densidad');
    var st = { r:0, dipped:false, tries:0, done:false, lock:false };
    function R(){ return denR[st.r]; }
    function draw(){
      var cv = document.getElementById('denCv'); if (!cv) return;
      var g = fitCv(cv), ctx = g.ctx, w = g.w, h = g.h, d = R();
      var cP = cssv('--green'), cPD = cssv('--green-dark'), cG = cssv('--gold');
      var cS2 = cssv('--surface2'), cB = cssv('--border'), cT3 = cssv('--text3');
      var maxV = 100;
      var cw = 88, cx = 30, cy = 16, ch = h - 44;
      function yOf(v){ return cy + ch - (v/maxV)*ch; }
      /* probeta */
      ctx.fillStyle = cS2; ctx.fillRect(cx, cy, cw, ch);
      ctx.strokeStyle = cB; ctx.lineWidth = 1.6; ctx.strokeRect(cx, cy, cw, ch);
      var lvl = d.v0 + (st.dipped ? d.dv : 0);
      ctx.fillStyle = cP; ctx.globalAlpha = 0.35;
      ctx.fillRect(cx, yOf(lvl), cw, cy + ch - yOf(lvl));
      ctx.globalAlpha = 1;
      ctx.strokeStyle = cPD; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(cx, yOf(lvl)); ctx.lineTo(cx+cw, yOf(lvl)); ctx.stroke();
      ctx.strokeStyle = cB; ctx.lineWidth = 1; ctx.fillStyle = cT3; ctx.font = '10px monospace';
      var v;
      for (v=10; v<=maxV; v+=10){
        ctx.beginPath(); ctx.moveTo(cx, yOf(v)); ctx.lineTo(cx+12, yOf(v)); ctx.stroke();
        ctx.fillText(String(v), cx-26, yOf(v)+3);
      }
      /* muestra */
      ctx.fillStyle = cG;
      if (st.dipped){ ctx.fillRect(cx+cw/2-11, yOf(d.v0)-4, 22, 22); }
      else { ctx.fillRect(cx+cw/2-11, cy+4, 22, 22); }
      /* etiquetas */
      ctx.fillStyle = cT3; ctx.font = '12px sans-serif';
      ctx.fillText(T({es:'Nivel: ',en:'Level: '}) + lvl + ' mL', cx + cw + 22, cy + 30);
      ctx.fillText(T({es:'Masa: ',en:'Mass: '}) + fmt1(d.m) + ' g', cx + cw + 22, cy + 52);
      ctx.fillText(st.dipped ? T({es:'Muestra sumergida',en:'Sample immersed'})
                             : T({es:'Muestra fuera del agua',en:'Sample out of the water'}), cx + cw + 22, cy + 74);
      if (st.dipped){
        ctx.fillStyle = cPD;
        ctx.fillText(T({es:'Desplazamiento: ',en:'Displacement: '}) + d.dv + ' mL', cx + cw + 22, cy + 96);
      }
    }
    function render(){
      if (st.done){
        wrap.innerHTML =
          '<div class="iw-tag">'+T({es:'Laboratorio de densidad', en:'Density lab'})+'</div>'+
          '<div class="iw-box"><div class="cls-done">'+T({es:'Las tres muestras quedaron identificadas.',en:'All three samples have been identified.'})+'</div>'+
          '<div class="rfb">'+T({
            es:'Ninguna de las tres muestras se transformó durante la prueba: pesar y medir el volumen desplazado son operaciones que devuelven el material intacto.',
            en:'None of the three samples was transformed during the test: weighing and measuring the displaced volume are operations that give the material back intact.'
          })+'</div></div>';
        return;
      }
      var d = R();
      var chips = d.pick.map(function(si){
        return '<button class="chip" onclick="denPick('+si+')">'+T(SUB[si])+'</button>';
      }).join('');
      wrap.innerHTML =
        '<div class="iw-tag">'+T({es:'Laboratorio de densidad', en:'Density lab'})+'</div>'+
        '<div class="iw-box">'+
          '<div class="iw-sub">'+T({
            es:'Sumerge la muestra en la probeta, lee cuánto sube el nivel del agua y decide de qué metal se trata.',
            en:'Immerse the sample in the cylinder, read how far the water level rises and decide which metal it is.'
          })+'</div>'+
          '<div class="rondas">'+T({es:'Muestra',en:'Sample'})+' '+(st.r+1)+' / 3</div>'+
          '<div class="goalbar">'+T({
            es:'Identifica el metal de la muestra usando la tabla de densidades de referencia.',
            en:'Identify the metal of the sample using the reference density table.'
          })+'</div>'+
          '<canvas class="gcanvas" id="denCv"></canvas>'+
          '<div class="simbtns">'+
            '<button class="simbtn" onclick="denDip(1)">'+T({es:'Sumergir la muestra',en:'Immerse the sample'})+'</button>'+
            '<button class="simbtn rst" onclick="denDip(0)">'+T({es:'Retirar la muestra',en:'Take the sample out'})+'</button>'+
          '</div>'+
          '<div class="chiprow">'+chips+'</div>'+
          '<div class="rfb" id="denFb"></div>'+
        '</div>';
      draw();
      setTimeout(draw, 170);
    }
    function adv(ms){
      st.lock = true;
      setTimeout(function(){
        st.lock = false; st.r++; st.tries = 0; st.dipped = false;
        if (st.r >= denR.length) st.done = true;
        render();
      }, ms);
    }
    window.denDip = function(on){
      if (st.done || st.lock) return;
      st.dipped = !!on;
      draw();
      var fb = document.getElementById('denFb');
      if (fb && !st.dipped) fb.textContent = T({
        es:'La muestra sale de la probeta sin cambiar: el nivel del agua regresa a su lectura inicial.',
        en:'The sample leaves the cylinder unchanged: the water level goes back to its initial reading.'
      });
    };
    window.denPick = function(si){
      if (st.done || st.lock) return;
      var d = R(), fb = document.getElementById('denFb'); if (!fb) return;
      if (!st.dipped){
        fb.textContent = T({
          es:'Todavía no hay volumen que medir. Sumerge la muestra y lee cuánto sube el nivel del agua antes de decidir.',
          en:'There is no volume to measure yet. Immerse the sample and read how far the water level rises before deciding.'
        });
        return;
      }
      var dens = d.m / d.dv;
      if (si === d.si){
        fb.innerHTML = '<span class="okmsg">'+T({es:'Identificado. ',en:'Identified. '})+'</span>'+
          T({es:'La masa entre el volumen desplazado da ',en:'The mass over the displaced volume gives '})+
          fmt1(dens)+T({es:' g/cm³, el valor tabulado de ese metal.',en:' g/cm³, the tabulated value of that metal.'});
        adv(2600); return;
      }
      st.tries++;
      if (st.tries >= 3){
        fb.innerHTML = T({es:'La muestra era ',en:'The sample was '})+'<b>'+T(SUB[d.si])+'</b>. '+
          T({es:'Su cociente es ',en:'Its quotient is '})+fmt1(dens)+T({es:' g/cm³, y ese número no cambia aunque la pieza sea mayor o menor.',
                                                                        en:' g/cm³, and that number does not change however large or small the piece is.'});
        adv(3600); return;
      }
      fb.textContent = T({es:'La muestra desplaza ',en:'The sample displaces '})+d.dv+
        T({es:' mL y pesa ',en:' mL and weighs '})+fmt1(d.m)+
        T({es:' g, de modo que su densidad es ',en:' g, so its density is '})+fmt1(dens)+
        (dOf(si) > dens ? T({es:' g/cm³, menor que la del metal que elegiste: busca uno más ligero para el mismo volumen.',
                             en:' g/cm³, lower than that of the metal you chose: look for a lighter one for the same volume.'})
                        : T({es:' g/cm³, mayor que la del metal que elegiste: busca uno más pesado para el mismo volumen.',
                             en:' g/cm³, higher than that of the metal you chose: look for a heavier one for the same volume.'}));
    };
    render();
  })();
