<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reacciones y Ecuaciones Químicas</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }

/* ── GUIDE WIDGETS (reacciones y ecuaciones químicas) ── */
.iw-tag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.4rem; }
.iw-box { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; padding:1rem; }
.iw-sub { font-size:.88rem; color:var(--text2); margin-bottom:.7rem; }
.rondas { font-family:'IBM Plex Mono',monospace; font-size:.7rem; color:var(--text3); letter-spacing:.08em; text-transform:uppercase; margin-bottom:.45rem; }
.rfb { font-size:.84rem; margin-top:.6rem; min-height:1.35rem; color:var(--text2); }
.rfb b { color:var(--green-dark); }
.okmsg { color:var(--ok); font-weight:700; }
.rverify-btn { background:var(--green); color:#fff; border:none; border-radius:8px; padding:.6rem 1.2rem; font-size:.86rem; font-weight:600; cursor:pointer; min-height:44px; margin-top:.7rem; font-family:inherit; }
.rverify-btn:hover { background:var(--green-dark); }
.goalbar { font-size:.83rem; color:var(--text2); background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.45rem .7rem; margin-bottom:.65rem; }
.defgrid { display:grid; grid-template-columns:repeat(2,1fr); gap:.6rem; margin:1rem 0; }
.defcell { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.75rem; border-top:3px solid var(--green); }
.defname { font-size:.72rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.25rem; }
.deftxt { font-size:.82rem; color:var(--text2); }
.dataline { font-family:'IBM Plex Mono',monospace; font-size:.82rem; color:var(--green-dark); background:var(--surface2); border-radius:8px; padding:.5rem .7rem; margin:.5rem 0; overflow-x:auto; }
.notabox { font-family:'IBM Plex Mono',monospace; font-size:1.15rem; font-weight:700; color:var(--green-dark); text-align:center; margin:.6rem 0; overflow-x:auto; }
.readrow { display:grid; grid-template-columns:repeat(3,1fr); gap:.5rem; margin-top:.8rem; }
.readcell { background:var(--surface2); border-radius:8px; padding:.55rem; text-align:center; }
.readlbl { font-size:.64rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.readnum { font-family:'IBM Plex Mono',monospace; font-size:1rem; font-weight:700; color:var(--green-dark); }
.ctrrow { display:flex; align-items:center; gap:.5rem; margin:.45rem 0; flex-wrap:wrap; justify-content:center; }
.ctrlbl { font-size:.82rem; color:var(--text2); min-width:104px; }
.ctrbtn { width:44px; height:44px; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:1.05rem; font-weight:700; cursor:pointer; font-family:inherit; }
.ctrbtn:hover { border-color:var(--green); color:var(--green); }
.ctrval { font-family:'IBM Plex Mono',monospace; font-size:1.05rem; font-weight:700; color:var(--green-dark); min-width:36px; text-align:center; }
.eqrow { display:flex; flex-wrap:wrap; align-items:flex-start; justify-content:center; gap:.35rem; margin:.7rem 0 .3rem; }
.eqcell { display:flex; flex-direction:column; align-items:center; gap:.3rem; }
.eqsp { font-family:'IBM Plex Mono',monospace; font-size:1rem; font-weight:700; color:var(--green-dark); }
.eqop { font-family:'IBM Plex Mono',monospace; font-size:1.05rem; font-weight:700; color:var(--text3); padding:.15rem .1rem 0; }
.coefbox { display:flex; align-items:center; gap:.2rem; }
.coefbtn { width:44px; height:44px; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:1rem; font-weight:700; cursor:pointer; font-family:inherit; }
.coefbtn:hover { border-color:var(--green); color:var(--green); }
.coefval { font-family:'IBM Plex Mono',monospace; font-size:1rem; font-weight:700; color:var(--green); min-width:26px; text-align:center; }
.attable { margin-top:.85rem; display:flex; flex-direction:column; gap:.35rem; }
.athead { display:grid; grid-template-columns:44px 1fr 1fr; gap:.4rem; font-size:.64rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); }
.atrow { display:grid; grid-template-columns:44px 1fr 1fr; gap:.4rem; align-items:center; }
.atsym { font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:.9rem; color:var(--text2); }
.atside { background:var(--surface2); border-radius:6px; height:28px; position:relative; overflow:hidden; }
.atfill { position:absolute; left:0; top:0; bottom:0; background:var(--green); opacity:.30; }
.atfill.bad { background:var(--gold); opacity:.45; }
.atnum { position:relative; font-family:'IBM Plex Mono',monospace; font-size:.82rem; font-weight:700; padding:0 .45rem; line-height:28px; color:var(--text); }
.krow { display:flex; align-items:center; gap:.6rem; margin-top:.7rem; flex-wrap:wrap; }
.krow input[type=range] { flex:1; min-width:150px; accent-color:var(--green); height:44px; }
.klbl { font-size:.78rem; color:var(--text3); min-width:96px; }
.kval { font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:.95rem; color:var(--green); min-width:52px; text-align:right; }
.cls-prog { font-family:'IBM Plex Mono',monospace; font-size:.7rem; color:var(--text3); letter-spacing:.08em; text-transform:uppercase; margin-bottom:.45rem; }
.cls-card { background:var(--surface2); border:1.5px solid var(--border); border-radius:10px; padding:.85rem; text-align:center; font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:.95rem; margin:.6rem 0; color:var(--green-dark); overflow-x:auto; }
.cls-bins { display:flex; gap:.5rem; flex-wrap:wrap; }
.cls-bin { flex:1; min-width:130px; min-height:44px; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.84rem; font-weight:600; cursor:pointer; font-family:inherit; padding:.5rem; }
.cls-bin:hover { border-color:var(--green); color:var(--green); }
.cls-done { font-weight:700; color:var(--ok); text-align:center; padding:.6rem; }
.reflect-prompt { font-size:.9rem; color:var(--text2); margin:.2rem 0 .8rem; }
@media (max-width:600px) {
  .defgrid { grid-template-columns:1fr; }
  .readrow { grid-template-columns:1fr 1fr; }
  .cls-bins { flex-direction:column; }
  .klbl, .ctrlbl { min-width:78px; }
  .eqsp { font-size:.86rem; }
  .cls-card { font-size:.8rem; }
  .notabox { font-size:1rem; }
  .dataline { font-size:.74rem; }
  .coefbtn { width:40px; height:40px; }
  .athead, .atrow { grid-template-columns:34px 1fr 1fr; }
}
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Reacciones y Ecuaciones Químicas</div>
    <div class="wcourse" id="wcourse-el">La Materia y sus Interacciones · Sem 1</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Reacciones y Ecuaciones Químicas</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="sbtn" id="dlBtn" onclick="generatePDF()" style="max-width:280px;margin:0 auto;">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

function saveSession() {
  if (!studentData.name) return;
  var drawings = [], texts = [], photos = [];
  problems.forEach(function(p, i) {
    var dc = document.getElementById('dc' + i);
    if (dc && dc.width) {
      var blank = document.createElement('canvas');
      blank.width = dc.width; blank.height = dc.height;
      drawings.push(dc.toDataURL() === blank.toDataURL() ? null : dc.toDataURL('image/png'));
    } else { drawings.push(null); }
    var ta = document.getElementById('ta' + i);
    texts.push(ta ? ta.value : '');
    var pp = document.getElementById('pp' + i);
    photos.push((pp && pp.src && pp.src.indexOf('data:') === 0) ? pp.src : null);
  });
  var state = {
    name: studentData.name, group: studentData.group,
    answeredCount: answeredCount, correctCount: correctCount,
    choices: problems.map(function(p) { return p.studentChoice; }),
    drawings: drawings, texts: texts, photos: photos
  };
  try { localStorage.setItem(lsKey(), JSON.stringify(state)); } catch(e) {}
}

function loadSession(name, group) {
  var key = 'liaxa_cneyt1_t04_g01__' + (name + '__' + group).replace(/\s+/g, '_');
  try { var r = localStorage.getItem(key); return r ? JSON.parse(r) : null; } catch(e) { return null; }
}

function restoreSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  var saved = loadSession(name, group);
  if (!saved) return;
  document.getElementById('restoreBar').style.display = 'none';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = currentAttempt(name, group);
  buildLesson(seededRng(name + group + att));
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
  saved.choices.forEach(function(choice, idx) {
    if (choice !== null && choice !== undefined) confirmMC(idx, choice);
  });
  setTimeout(function() {
    if (saved.drawings) {
      saved.drawings.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var dc = document.getElementById('dc' + i);
        if (!dc || !dc.width) return;
        var img = new Image();
        img.onload = function() {
          var dpr = window.devicePixelRatio || 1;
          dc.getContext('2d').drawImage(img, 0, 0, dc.width / dpr, dc.height / dpr);
        };
        img.src = dataUrl;
      });
    }
    if (saved.texts) {
      saved.texts.forEach(function(text, i) {
        if (!text) return;
        var ta = document.getElementById('ta' + i);
        if (ta) ta.value = text;
      });
    }
    if (saved.photos) {
      saved.photos.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var pp = document.getElementById('pp' + i);
        if (!pp) return;
        pp.src = dataUrl; pp.style.display = 'block';
        var pz = document.getElementById('pz' + i);
        if (pz) pz.style.opacity = '0.4';
      });
    }
  }, 300);
}

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

  answeredCount = 0;

  var att = nextAttempt(name, group);
  buildLesson(seededRng(name + group + att));
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS — INJECTION BLOCK ─────────────────────────────────────────
  //   Match these RGB values to --green and --gold above.
  //   PRIMARY  → pBR, pBG, pBB
  //   ACCENT   → pAR, pAG, pAB
  // ──────────────────────────────────────────────────────────────────────────
  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;  // PRIMARY (from SCHOOL, Rule 16)
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;   // ACCENT (from SCHOOL, Rule 16)

  function pdfText(html) {
    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/\u2192/g,'->').replace(/\u2212/g,'-').replace(/\u00b2/g,'^2')
      .replace(/\u00b3/g,'^3').replace(/\u00d7/g,'x').replace(/\u00f7/g,'/')
      .replace(/\u2260/g,'!=').replace(/\u2264/g,'<=').replace(/\u2265/g,'>=')
      .replace(/\u221a/g,'sqrt').replace(/\u03c0/g,'pi').replace(/\u2026/g,'...')
      .replace(/\s+/g,' ').trim();

  // ── PORTADA: orange line / white logo strip / orange line / blue band ──

/* ================================================
   buildLesson — OVERRIDE IN EACH GUIDE
   ================================================ */
function buildLesson(rng) {
  var LB = document.getElementById('lessonBody');
  LB.innerHTML = '';
  problems = [];

  /* ============================================================
     HELPERS
     ============================================================ */
  function T(o){
    if (o === undefined || o === null) return '';
    if (typeof o === 'string' || typeof o === 'number') return o;
    if (Object.prototype.toString.call(o) === '[object Array]') return o;
    return (o[LANG] !== undefined ? o[LANG] : o.es);
  }
  function ri(a,b){ return a + Math.floor(rng()*(b-a+1)); }
  function shufA(arr){
    var a = arr.slice(), i, j, t;
    for (i=a.length-1;i>0;i--){ j=Math.floor(rng()*(i+1)); t=a[i]; a[i]=a[j]; a[j]=t; }
    return a;
  }
  function sec(tag, title, html){
    var d = document.createElement('div');
    d.className = 'section';
    d.innerHTML = '<div class="stag">'+tag+'</div><h2>'+title+'</h2>'+(html||'');
    LB.appendChild(d);
    return d;
  }
  function widget(kind){
    var d = document.createElement('div');
    d.className = kind + 'wrap section';
    d.setAttribute('data-widget', kind);
    d.id = 'w' + kind;
    LB.appendChild(d);
    return d;
  }
  function uniq4(correct, cands){
    var out = [correct], i;
    for (i=0;i<cands.length && out.length<4;i++){
      if (out.indexOf(cands[i]) < 0) out.push(cands[i]);
    }
    var m = String(correct).match(/^(-?\d+)(.*)$/), k = 1;
    while (out.length < 4 && k < 40){
      var extra = m ? (parseInt(m[1],10) + k*3) + m[2] : String(correct) + ' ' + k;
      if (out.indexOf(extra) < 0) out.push(extra);
      k++;
    }
    return out;
  }
  function addProb(spec){
    var so  = shufA(T(spec.options));
    var cor = T(spec.correct);
    problems.push({
      title: T(spec.title),
      questionText: T(spec.q),
      fn: '',
      hint: T(spec.hint),
      explanation: T(spec.exp),
      options: so,
      correctIdx: so.indexOf(cor),
      showWork: !!spec.showWork,
      studentChoice: null,
      pendingChoice: null
    });
    buildOneCard(problems[problems.length-1], problems.length-1);
  }

  /* ============================================================
     DATOS QUÍMICOS
     ============================================================ */
  var COMP = {
    'H₂':{H:2}, 'O₂':{O:2}, 'N₂':{N:2}, 'Cl₂':{Cl:2},
    'H₂O':{H:2,O:1}, 'NH₃':{N:1,H:3}, 'HCl':{H:1,Cl:1},

    'Al':{Al:1}, 'Al₂O₃':{Al:2,O:3}, 'H₂O₂':{H:2,O:2},
    'KClO₃':{K:1,Cl:1,O:3}, 'KCl':{K:1,Cl:1},
    'CaCO₃':{Ca:1,C:1,O:3}, 'CaO':{Ca:1,O:1}, 'CO₂':{C:1,O:2}, 'NaN₃':{Na:1,N:3},
    'CH₄':{C:1,H:4}, 'C₂H₂':{C:2,H:2}, 'C₂H₄':{C:2,H:4}, 'C₂H₆':{C:2,H:6},
    'C₃H₈':{C:3,H:8}, 'C₄H₁₀':{C:4,H:10},
    'Zn':{Zn:1}, 'ZnCl₂':{Zn:1,Cl:2}, 'AlCl₃':{Al:1,Cl:3}, 'MgCl₂':{Mg:1,Cl:2},
    'Fe':{Fe:1}, 'CuSO₄':{Cu:1,S:1,O:4}, 'FeSO₄':{Fe:1,S:1,O:4}, 'Cu':{Cu:1},
    'AgNO₃':{Ag:1,N:1,O:3}, 'AgCl':{Ag:1,Cl:1}, 'NaNO₃':{Na:1,N:1,O:3},
    'BaCl₂':{Ba:1,Cl:2}, 'Na₂SO₄':{Na:2,S:1,O:4}, 'BaSO₄':{Ba:1,S:1,O:4},

  var EL = {

  };
  function elName(k){ return EL[k] ? T(EL[k]) : k; }
  function compDesc(sp){
    var c = COMP[sp], parts = [], k, tot = 0;
    for (k in c){ if (c.hasOwnProperty(k)){ parts.push(c[k]+' '+T({es:'de',en:'of'})+' '+elName(k)); tot += c[k]; } }
    var join = parts.length > 1

  }
  function sideStr(names, cs, off){
    var out = [], i;

  }
  function eqStr(e, cs){ cs = cs || e.c; return sideStr(e.L,cs,0)+' → '+sideStr(e.R,cs,e.L.length); }
  function skelStr(e){ return e.L.join(' + ')+' → '+e.R.join(' + '); }
  function counts(names, cs, off){
    var m = {}, i, k, c;
    for (i=0;i<names.length;i++){
      c = COMP[names[i]];
      for (k in c){ if (c.hasOwnProperty(k)) m[k] = (m[k]||0) + cs[off+i]*c[k]; }
    }
    return m;
  }
  function elemsOf(e){
    var s = [], arr = e.L.concat(e.R), i, k, c;
    for (i=0;i<arr.length;i++){
      c = COMP[arr[i]];
      for (k in c){ if (c.hasOwnProperty(k) && s.indexOf(k) < 0) s.push(k); }

  }
  function gcdArr(a){
    function g(x,y){ return y ? g(y, x % y) : x; }
    var r = a[0], i;

  /* ============================================================

  var vP1 = Math.floor(rng()*2), vP2 = Math.floor(rng()*2), vP3 = Math.floor(rng()*2);

  /* manipulativo 1: contador de átomos */
  var CNT = [
    {sp:'CO₂',   per:3,  el:'O', n:2},
    {sp:'H₂O',   per:3,  el:'H', n:2},
    {sp:'NH₃',   per:4,  el:'H', n:3},
    {sp:'Al₂O₃', per:5,  el:'O', n:3},

  var cntR = [];
  (function(){

      k = ri(2,5);
      cntR.push({ sp:CNT[cntPick[i]].sp, el:CNT[cntPick[i]].el, n:CNT[cntPick[i]].n, k:k, target:k*CNT[cntPick[i]].n });

  /* manipulativo 2: balanza de la ecuación */
  var BAL = [
    {L:['Al','O₂'],        R:['Al₂O₃'],          c:[4,3,2]},

    {L:['CaCl₂','Na₂CO₃'], R:['CaCO₃','NaCl'],   c:[1,1,1,2]},
    {L:['C₂H₄','O₂'],      R:['CO₂','H₂O'],      c:[1,3,2,2]}
  ];
  var balPick = shufA([0,1,2,3,4,5,6,7,8]).slice(0,3);
  var balR = [BAL[balPick[0]], BAL[balPick[1]], BAL[balPick[2]]];

  /* manipulativo 3: clasificador de tipos */

  /* manipulativo 4: escala de proporciones */

  /* P1 */

  /* ============================================================
     IDEA 1
     ============================================================ */
  sec(T({es:'Idea 1', en:'Idea 1'}),
      T({es:'La ecuación química como registro de los átomos',
         en:'The chemical equation as a record of the atoms'}),
      '<p>'+T({
        es:'Una reacción química es un proceso en el que se rompen los enlaces de las sustancias iniciales y se forman enlaces nuevos, de modo que los mismos átomos terminan agrupados en sustancias distintas. Ningún átomo se crea y ninguno desaparece: la transformación reorganiza el material disponible. Esa afirmación, verificada al pesar sistemas cerrados antes y después del cambio, es el punto de partida de todo lo que sigue.',
        en:'A chemical reaction is a process in which the bonds of the starting substances are broken and new bonds are formed, so that the same atoms end up grouped into different substances. No atom is created and none disappears: the transformation reorganises the available material. That claim, verified by weighing closed systems before and after the change, is the starting point for everything that follows.'
      })+'</p>'+
      '<p>'+T({
        es:'La ecuación química es la forma abreviada de registrar ese proceso. A la izquierda de la flecha se escriben los reactivos, las sustancias que se consumen; a la derecha los productos, las sustancias que se obtienen; y la flecha señala el sentido del cambio. Entre paréntesis suele anotarse el estado de agregación de cada sustancia: (s) para sólido, (l) para líquido, (g) para gas y (ac) para una sustancia disuelta en agua.',
        en:'The chemical equation is the shorthand way of recording that process. To the left of the arrow the reactants are written, the substances that are consumed; to the right the products, the substances that are obtained; and the arrow marks the direction of the change. In brackets the physical state of each substance is usually noted: (s) for solid, (l) for liquid, (g) for gas and (aq) for a substance dissolved in water.'
      })+'</p>'+
      '<p>'+T({
        es:'Dentro de la ecuación conviven dos clases de números y confundirlos resulta caro. El subíndice pertenece a la fórmula y declara cuántos átomos de un elemento hay en una sola unidad de esa sustancia; forma parte de su identidad y no se modifica, porque cambiarlo produce una sustancia diferente. El coeficiente se escribe delante de la fórmula completa y declara cuántas unidades de esa sustancia participan; ese es el único número que se ajusta. Para contar átomos de un elemento se multiplica el coeficiente por el subíndice correspondiente, y un coeficiente que no aparece escrito vale uno.',
        en:'Two kinds of numbers live inside the equation and confusing them is expensive. The subscript belongs to the formula and states how many atoms of an element there are in a single unit of that substance; it is part of its identity and it is not modified, because changing it produces a different substance. The coefficient is written in front of the whole formula and states how many units of that substance take part; that is the only number that gets adjusted. To count atoms of an element you multiply the coefficient by the matching subscript, and a coefficient that is not written stands for one.'

  /* ---- MANIPULATIVO 1: contador de átomos ---- */
  (function(){

  (function(){
    var wrap = widget('balanza');
    var st = { r:0, cs:[], tries:0, done:false };
    function eq(){ return balR[st.r]; }
    function reset(){
      var e = eq(), i; st.cs = [];
      for (i=0;i<e.L.length+e.R.length;i++) st.cs.push(1);
      st.tries = 0;
    }
    function head(){ return '<div class="iw-tag">'+T({es:'Balanza de la ecuación', en:'Equation balance'})+'</div>'; }
    function cell(idx, sp){
      return '<div class="eqcell"><div class="eqsp">'+sp+'</div>'+
        '<div class="coefbox">'+
          '<button class="coefbtn" onclick="balStep('+idx+',-1)">−</button>'+
          '<span class="coefval">'+st.cs[idx]+'</span>'+
          '<button class="coefbtn" onclick="balStep('+idx+',1)">+</button>'+
        '</div></div>';
    }
    function gapMsg(){
      var e = eq(), els = elemsOf(e);
      var a = counts(e.L, st.cs, 0), b = counts(e.R, st.cs, e.L.length), i, k, d;
      for (i=0;i<els.length;i++){
        k = els[i]; d = (a[k]||0) - (b[k]||0);
        if (d > 0) return T({es:'Del lado de los productos faltan '+d+' átomos de '+elName(k)+'.',
                             en:'The product side is short by '+d+' atoms of '+elName(k)+'.'});
        if (d < 0) return T({es:'Del lado de los reactivos faltan '+(-d)+' átomos de '+elName(k)+'.',
                             en:'The reactant side is short by '+(-d)+' atoms of '+elName(k)+'.'});
      }
      var g = gcdArr(st.cs);
      if (g > 1) return T({es:'Todos los elementos coinciden, pero los coeficientes se pueden dividir entre '+g+'.',
                           en:'Every element matches, but the coefficients can still be divided by '+g+'.'});
      return T({es:'Los dos lados coinciden en todos los elementos. Comprueba el resultado.',
                en:'Both sides match for every element. Check the result.'});
    }
    function render(){
      if (st.done){
        wrap.innerHTML = head()+'<div class="iw-box"><div class="cls-done">🎉 '+T({
          es:'Tres ecuaciones cerradas. Cada elemento con la misma cuenta de los dos lados y sin divisor común.',
          en:'Three equations closed. Every element with the same count on both sides and no common divisor.'})+'</div></div>';
        return;
      }
      var e = eq(), els = elemsOf(e), i;
      var a = counts(e.L, st.cs, 0), b = counts(e.R, st.cs, e.L.length);
      var cells = [];
      for (i=0;i<e.L.length;i++){ if (i) cells.push('<div class="eqop">+</div>'); cells.push(cell(i, e.L[i])); }
      cells.push('<div class="eqop">→</div>');
      for (i=0;i<e.R.length;i++){ if (i) cells.push('<div class="eqop">+</div>'); cells.push(cell(e.L.length+i, e.R[i])); }
      var rows = els.map(function(k){
        var x = a[k]||0, y = b[k]||0, mx = Math.max(x,y,1), bad = (x !== y);
        return '<div class="atrow"><div class="atsym">'+k+'</div>'+
          '<div class="atside"><div class="atfill'+(bad?' bad':'')+'" style="width:'+Math.round(x/mx*100)+'%"></div><div class="atnum">'+x+'</div></div>'+
          '<div class="atside"><div class="atfill'+(bad?' bad':'')+'" style="width:'+Math.round(y/mx*100)+'%"></div><div class="atnum">'+y+'</div></div></div>';
      }).join('');
      wrap.innerHTML = head()+
        '<div class="iw-box">'+
          '<div class="rondas">'+T({es:'Ronda',en:'Round'})+' '+(st.r+1)+' / 3</div>'+
          '<div class="iw-sub">'+T({
            es:'Sube y baja los coeficientes hasta que las dos barras de cada elemento midan lo mismo. Las fórmulas están fijas.',
            en:'Raise and lower the coefficients until the two bars of every element read the same. The formulas are fixed.'})+'</div>'+
          '<div class="eqrow">'+cells.join('')+'</div>'+
          '<div class="attable">'+
            '<div class="athead"><div></div><div>'+T({es:'Reactivos',en:'Reactants'})+'</div><div>'+T({es:'Productos',en:'Products'})+'</div></div>'+
            rows+
          '</div>'+
          '<div class="rfb">'+gapMsg()+'</div>'+
          '<button class="rverify-btn" onclick="balCheck()">'+T({es:'Comprobar',en:'Check'})+'</button>'+
          '<button class="rverify-btn" onclick="balReset()" style="margin-left:.5rem;background:var(--surface2);color:var(--text2)">'+T({es:'Reiniciar',en:'Reset'})+'</button>'+
          '<div class="rfb" id="balFb"></div>'+
        '</div>';
    }
    window.balStep = function(idx, k){
      if (st.done) return;
      st.cs[idx] = Math.max(1, Math.min(9, st.cs[idx] + k));
      render();
    };
    window.balReset = function(){ if (st.done) return; reset(); render(); };
    window.balCheck = function(){
      if (st.done) return;
      var e = eq(), els = elemsOf(e);
      var a = counts(e.L, st.cs, 0), b = counts(e.R, st.cs, e.L.length);
      var ok = els.every(function(k){ return (a[k]||0) === (b[k]||0); });
      var g = gcdArr(st.cs);
      if (ok && g === 1){
        st.r++;
        if (st.r >= 3){ st.done = true; render(); return; }
        reset(); render();
        document.getElementById('balFb').innerHTML = '<span class="okmsg">✓ '+T({
          es:'Balanceada y en su forma mínima. Va la siguiente.',
          en:'Balanced and in minimal form. Here comes the next one.'})+'</span>';
        return;
      }
      st.tries++;
      if (st.tries >= 3){
        st.cs = e.c.slice(); render();
        document.getElementById('balFb').innerHTML = T({
          es:'Esta es la solución: '+eqStr(e, e.c)+'. Fíjate en el elemento que aparece en una sola sustancia de cada lado: su coeficiente se fija primero y el resto se acomoda después.',
          en:'This is the solution: '+eqStr(e, e.c)+'. Look at the element that appears in a single substance on each side: its coefficient is fixed first and the rest falls into place afterwards.'});
        st.r++;
        if (st.r >= 3) st.done = true; else reset();
        setTimeout(render, 2600);
        return;
      }
      document.getElementById('balFb').textContent = ok
        ? T({es:'Los átomos ya se conservan, pero divide todos los coeficientes entre '+g+' para dejar la forma mínima.',
             en:'The atoms are already conserved, but divide every coefficient by '+g+' to leave the minimal form.'})
        : gapMsg();
    };
    reset();
    render();
  })();

      wrap.innerHTML = head()+
        '<div class="iw-box">'+
          '<div class="rondas">'+T({es:'Ronda',en:'Round'})+' '+(st.r+1)+' / 3</div>'+
          '<div class="iw-sub">'+T({
            es:'Mueve el control para agrandar o achicar la reacción completa. Las cantidades de todas las sustancias se recalculan al instante, en moles.',
            en:'Move the control to scale the whole reaction up or down. The amounts of every substance are recomputed instantly, in moles.'})+'</div>'+
          '<div class="dataline">'+d.s+'</div>'+
          '<div class="goalbar">'+T({es:'Objetivo: obtener exactamente '+target+' mol de '+tg.n,
                                     en:'Target: obtain exactly '+target+' mol of '+tg.n})+'</div>'+
          '<div class="krow">'+
            '<span class="klbl">'+T({es:'Escala',en:'Scale'})+'</span>'+
            '<input type="range" min="0" max="8" step="1" value="'+st.n+'" oninput="proSlide(this.value)">'+
            '<span class="kval" id="proK">× '+st.n+'</span>'+
          '</div>'+
          '<div class="readrow">'+cells+'</div>'+
          '<div class="rfb" id="proLive">'+liveMsg()+'</div>'+
          '<button class="rverify-btn" onclick="proCheck()">'+T({es:'Comprobar',en:'Check'})+'</button>'+
          '<div class="rfb" id="proFb"></div>'+
        '</div>';
    }
    function liveMsg(){
      var rr = cur(), d = rr.d, tg = d.it[d.ti], diff = tg.c*rr.k - tg.c*st.n;
      if (diff === 0) return T({es:'Esa es la escala pedida. Comprueba el resultado.', en:'That is the scale asked for. Check the result.'});
      if (diff > 0) return T({es:'Vas por debajo: faltan '+diff+' mol de '+tg.n+'. Aumenta la escala.',
                              en:'You are below: '+diff+' mol of '+tg.n+' are still missing. Increase the scale.'});
      return T({es:'Te pasaste: sobran '+(-diff)+' mol de '+tg.n+'. Reduce la escala.',
                en:'You went over: there are '+(-diff)+' mol of '+tg.n+' too many. Reduce the scale.'});
    }
    window.proSlide = function(v){
      if (st.done) return;
      st.n = parseInt(v,10) || 0;
      var d = cur().d, i, el;
      for (i=0;i<d.it.length;i++){
        el = document.getElementById('proN'+i);
        if (el) el.textContent = d.it[i].c*st.n;
      }
      el = document.getElementById('proK'); if (el) el.textContent = '× '+st.n;
      el = document.getElementById('proLive'); if (el) el.textContent = liveMsg();
    };
    window.proCheck = function(){
      if (st.done) return;
      var rr = cur(), d = rr.d, tg = d.it[d.ti];
      if (tg.c*st.n === tg.c*rr.k && st.n === rr.k){
        st.r++; st.n = 0; st.tries = 0;
        if (st.r >= 3){ st.done = true; render(); return; }
        render();
        document.getElementById('proFb').innerHTML = '<span class="okmsg">✓ '+T({
          es:'Correcto. Toda la ecuación creció con la misma proporción.',
          en:'Correct. The whole equation grew with the same proportion.'})+'</span>';
        return;
      }
      st.tries++;
      if (st.tries >= 3){
        st.n = rr.k; render();
        document.getElementById('proFb').innerHTML = T({
          es:'Con la escala '+rr.k+' cada coeficiente se multiplica por '+rr.k+', y por eso se obtienen '+(tg.c*rr.k)+' mol de '+tg.n+'.',
          en:'At scale '+rr.k+' every coefficient is multiplied by '+rr.k+', and that is why '+(tg.c*rr.k)+' mol of '+tg.n+' are obtained.'});
        st.r++; st.n = 0; st.tries = 0;
        if (st.r >= 3) st.done = true;
        setTimeout(render, 2400);
        return;
      }
      document.getElementById('proFb').textContent = T({
        es:'Todavía no. El coeficiente de esa sustancia indica cuántos moles se obtienen por cada unidad de escala.',
        en:'Not yet. The coefficient of that substance tells how many moles are obtained per unit of scale.'});
    };
    render();
  })();

  /* ---- P7 ---- */
  (function(){
    var P7 = [
      { eq:'N₂ + 3 H₂ → 2 NH₃', dc:1, tc:2,
        dr:{es:'nitrógeno (N₂)', en:'nitrogen (N₂)'}, tg:{es:'amoniaco (NH₃)', en:'ammonia (NH₃)'} },
      { eq:'N₂ + 3 H₂ → 2 NH₃', dc:3, tc:2,
        dr:{es:'hidrógeno (H₂)', en:'hydrogen (H₂)'}, tg:{es:'amoniaco (NH₃)', en:'ammonia (NH₃)'} },
      { eq:'C₃H₈ + 5 O₂ → 3 CO₂ + 4 H₂O', dc:1, tc:3,
        dr:{es:'propano (C₃H₈)', en:'propane (C₃H₈)'}, tg:{es:'dióxido de carbono (CO₂)', en:'carbon dioxide (CO₂)'} },
      { eq:'2 Al + 6 HCl → 2 AlCl₃ + 3 H₂', dc:6, tc:3,
        dr:{es:'ácido clorhídrico (HCl)', en:'hydrochloric acid (HCl)'}, tg:{es:'hidrógeno (H₂)', en:'hydrogen (H₂)'} },
      { eq:'2 KClO₃ → 2 KCl + 3 O₂', dc:2, tc:3,
        dr:{es:'clorato de potasio (KClO₃)', en:'potassium chlorate (KClO₃)'}, tg:{es:'oxígeno (O₂)', en:'oxygen (O₂)'} }
    ][p7i];
    var U = {es:' mol', en:' mol'};
    var nDr = P7.dc*p7k, nTg = P7.tc*p7k;
    var corA = String(nTg)+T(U), corB = String(nDr)+T(U);
    var ooA = uniq4(corA, [String(nDr)+T(U), String(nDr*P7.tc)+T(U), String(nTg+P7.tc)+T(U), String(nTg*2)+T(U), String(nTg+1)+T(U)]);
    var ooB = uniq4(corB, [String(nTg)+T(U), String(nTg*P7.dc)+T(U), String(nDr+P7.dc)+T(U), String(nDr*2)+T(U), String(nDr+1)+T(U)]);
    var qA = {es:'De acuerdo con la ecuación balanceada '+P7.eq+', determina la cantidad de '+T(P7.tg)+' que se obtiene cuando reaccionan por completo '+nDr+' mol de '+T(P7.dr)+'.',
              en:'According to the balanced equation '+P7.eq+', determine the amount of '+T(P7.tg)+' obtained when '+nDr+' mol of '+T(P7.dr)+' react completely.'};
    var qB = {es:'De acuerdo con la ecuación balanceada '+P7.eq+', determina la cantidad de '+T(P7.dr)+' que debe reaccionar por completo para obtener '+nTg+' mol de '+T(P7.tg)+'.',
              en:'According to the balanced equation '+P7.eq+', determine the amount of '+T(P7.dr)+' that must react completely in order to obtain '+nTg+' mol of '+T(P7.tg)+'.'};
    addProb({
      title:{es:'Leer la proporción de la ecuación', en:'Reading the proportion of the equation'},
      q: (vP7 ? qB : qA),
      options: (vP7 ? ooB : ooA),
      correct: (vP7 ? corB : corA),
      hint:{es:'Escribe la relación entre los dos coeficientes que te interesan como una fracción y multiplica por la cantidad conocida, cuidando cuál de los dos va arriba.',
            en:'Write the relation between the two coefficients you care about as a fraction and multiply by the known amount, taking care which of the two goes on top.'},
      exp:{es:'Los coeficientes fijan la proporción: por cada '+P7.dc+' unidades de '+T(P7.dr)+' intervienen '+P7.tc+' de '+T(P7.tg)+'. Conservando esa relación, '+nDr+' mol de '+T(P7.dr)+' corresponden a '+nTg+' mol de '+T(P7.tg)+'. Invertir la fracción, o repetir la cantidad conocida sin aplicar la relación, produce los demás valores.',
           en:'The coefficients fix the proportion: for every '+P7.dc+' units of '+T(P7.dr)+' there are '+P7.tc+' of '+T(P7.tg)+'. Keeping that relation, '+nDr+' mol of '+T(P7.dr)+' correspond to '+nTg+' mol of '+T(P7.tg)+'. Inverting the fraction, or repeating the known amount without applying the relation, produces the other values.'},
      showWork:true });
  })();

  /* ---- P8 ---- */
  (function(){
    var S8 = [
      { a:{es:'magnesio', en:'magnesium'}, b:{es:'oxígeno', en:'oxygen'}, p:{es:'óxido de magnesio', en:'magnesium oxide'} },
      { a:{es:'sodio', en:'sodium'}, b:{es:'cloro', en:'chlorine'}, p:{es:'cloruro de sodio', en:'sodium chloride'} },
      { a:{es:'hierro', en:'iron'}, b:{es:'azufre', en:'sulfur'}, p:{es:'sulfuro de hierro', en:'iron sulfide'} }
    ][s8i];
    var W = m8p + m8q;
    var corA = String(m8a + m8b), corB = String(m8q);
    var ooA = uniq4(corA, [String(m8b), String(m8a), String(Math.abs(m8b-m8a)), String((m8a+m8b)*2), String(m8a+m8b+m8a)]);
    var ooB = uniq4(corB, [String(m8p), String(W), String(m8p-m8q > 0 ? m8p-m8q : m8p+m8q), String(m8q*2), String(m8q+m8p)]);
    var qA = {es:'En un recipiente cerrado se hacen reaccionar '+m8a+' g de '+T(S8.a)+' con '+m8b+' g de '+T(S8.b)+'. La reacción es completa y al terminar la única sustancia presente es '+T(S8.p)+'. Determina la masa de '+T(S8.p)+' obtenida, en gramos.',
              en:'In a closed vessel '+m8a+' g of '+T(S8.a)+' are made to react with '+m8b+' g of '+T(S8.b)+'. The reaction is complete and at the end the only substance present is '+T(S8.p)+'. Determine the mass of '+T(S8.p)+' obtained, in grams.'};
    var qB = {es:'En un recipiente cerrado se calientan '+W+' g de carbonato de calcio hasta que se descomponen por completo. Al final se recogen '+m8p+' g de óxido de calcio sólido y todo el resto es dióxido de carbono. Determina la masa de dióxido de carbono liberada, en gramos.',
              en:'In a closed vessel '+W+' g of calcium carbonate are heated until they decompose completely. At the end '+m8p+' g of solid calcium oxide are collected and all the rest is carbon dioxide. Determine the mass of carbon dioxide released, in grams.'};
    addProb({
      title:{es:'La masa que entra y la que sale', en:'The mass that goes in and the mass that comes out'},
      q: (vP8 ? qB : qA),
      options: (vP8 ? ooB : ooA),
      correct: (vP8 ? corB : corA),
      hint:{es:'En un recipiente cerrado los átomos solo se reorganizan, así que la masa total antes y después es la misma; plantea esa igualdad y despeja el dato que falta.',
            en:'In a closed vessel the atoms are only rearranged, so the total mass before and after is the same; set up that equality and solve for the missing value.'},
      exp: vP8
        ? {es:'Todo el material que sale del recipiente estaba antes en el carbonato de calcio, de modo que la masa del sólido recogido y la del gas liberado deben sumar la masa inicial. Restando la parte sólida queda '+W+' − '+m8p+' = '+m8q+' gramos de dióxido de carbono.',
           en:'All the material leaving the vessel was previously in the calcium carbonate, so the mass of the collected solid and that of the released gas must add up to the initial mass. Subtracting the solid part leaves '+W+' − '+m8p+' = '+m8q+' grams of carbon dioxide.'}
        : {es:'Los átomos que entran son exactamente los que salen, agrupados de otra forma, así que ninguna masa se pierde ni aparece. La masa del producto es entonces la suma de las masas de los dos reactivos consumidos: '+m8a+' + '+m8b+' = '+(m8a+m8b)+' gramos.',
           en:'The atoms that go in are exactly the ones that come out, grouped differently, so no mass is lost and none appears. The mass of the product is then the sum of the masses of the two reactants consumed: '+m8a+' + '+m8b+' = '+(m8a+m8b)+' grams.'},
      showWork:true });
  })();

  /* ---- MANIPULATIVO 5: reflexión ---- */
  (function(){
    var wrap = widget('reflexiona');
    var PROMPTS = [
      { es:'Explica con tus palabras, y con un ejemplo propio, por qué al balancear se pueden cambiar los coeficientes pero no los subíndices.',
        en:'Explain in your own words, with an example of your own, why coefficients may be changed when balancing but subscripts may not.' },
      { es:'Dibuja con círculos los átomos de cada elemento a los dos lados de una ecuación balanceada que hayas trabajado y señala dónde queda visible la conservación.',
        en:'Draw the atoms of each element with circles on both sides of a balanced equation you have worked with and mark where the conservation becomes visible.' },
      { es:'Un compañero afirma que si una ecuación está balanceada entonces la reacción ocurrirá con seguridad. Escribe tu respuesta y justifícala.',
        en:'A classmate claims that if an equation is balanced then the reaction will certainly happen. Write your answer and justify it.' }
    ];
    var pick = PROMPTS[refPick];
    wrap.innerHTML =
      '<div class="iw-tag">'+T({es:'Cuaderno abierto', en:'Open notebook'})+'</div>'+
      '<div class="iw-box">'+
        '<div class="reflect-prompt">'+T(pick)+'</div>'+
        '<div class="wtabs">'+
          '<button class="wtab active" onclick="refTab(\'type\',this)">⌨️ '+T({es:'Escribir', en:'Write'})+'</button>'+
          '<button class="wtab" onclick="refTab(\'draw\',this)">✏️ '+T({es:'Dibujar', en:'Sketch'})+'</button>'+
        '</div>'+
        '<div class="wpanel active" id="ref_type"><textarea class="wtextarea" id="refTa" placeholder="'+T({es:'Tu respuesta…', en:'Your answer…'})+'"></textarea></div>'+
        '<div class="wpanel" id="ref_draw"><div class="cvwrap">'+
          '<canvas class="dcanvas" id="refCv"></canvas>'+
          '<div class="ctoolbar">'+
            '<button class="tbtn2 bpen on">'+t('btn-pen')+'</button>'+
            '<button class="tbtn2 bmarker">'+t('btn-marker')+'</button>'+
            '<button class="tbtn2 beraser">'+t('btn-eraser')+'</button>'+
            '<div class="cdot sel" data-color="#0f2d5a" style="background:#0f2d5a"></div>'+
            '<div class="cdot"     data-color="#1a1a16" style="background:#1a1a16"></div>'+
            '<div class="cdot"     data-color="#8b2500" style="background:#8b2500"></div>'+
            '<div class="cdot"     data-color="#1d4e89" style="background:#1d4e89"></div>'+
            '<button class="clrbtn">'+t('btn-clear')+'</button>'+
          '</div>'+
        '</div></div>'+
        '<button class="rverify-btn" onclick="refSave()">'+T({es:'Guardar', en:'Save'})+'</button>'+
        '<div class="rfb" id="refFb"></div>'+
      '</div>';
    window.refTab = function(which, btn){
      ['type','draw'].forEach(function(x){
        var el = document.getElementById('ref_'+x);
        if (el) el.classList.toggle('active', x === which);
      });
      wrap.querySelectorAll('.wtab').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      if (which === 'draw') setTimeout(function(){ var c = document.getElementById('refCv'); if (c) initCanvas(c); }, 60);
    };
    window.refSave = function(){
      document.getElementById('refFb').innerHTML = '<span class="okmsg">✓ '+T({
        es:'Guardado. Vuelve a esta idea cuando revises la guía: aquí no hay una sola redacción posible.',
        en:'Saved. Come back to this idea when you review the guide: there is no single possible wording here.'})+'</span>';
    };
  })();

  /* ============================================================
     CIERRE
     ============================================================ */
  sec(T({es:'Cierre', en:'Closing'}),
      T({es:'Dos revisiones finales', en:'Two final reviews'}),
      '<p>'+T({
        es:'Las dos situaciones siguientes llegan como trabajos entregados por otros estudiantes y esperan tu revisión.',
        en:'The two situations below arrive as work handed in by other students and are waiting for your review.'
      })+'</p>');

  /* ---- P9 ---- */
  (function(){
    var V = [
      { q:{es:'Un estudiante entrega 2 Al + 6 HCl → 2 AlCl₃ + 2 H₂ como resultado de su balanceo. Identifica el único cambio que la deja correctamente balanceada sin modificar ninguna fórmula.',
             en:'A student hands in 2 Al + 6 HCl → 2 AlCl₃ + 2 H₂ as the result of their balancing. Identify the single change that leaves it correctly balanced without modifying any formula.'},
        options:{es:[
          'Escribir 3 como coeficiente del hidrógeno molecular.',
          'Escribir 4 como coeficiente del ácido clorhídrico.',
          'Escribir 3 como coeficiente del aluminio metálico.',
          'Escribir 1 como coeficiente del cloruro de aluminio.'],
          en:[
          'Write 3 as the coefficient of molecular hydrogen.',
          'Write 4 as the coefficient of hydrochloric acid.',
          'Write 3 as the coefficient of metallic aluminium.',
          'Write 1 as the coefficient of aluminium chloride.']},
        correct:{es:'Escribir 3 como coeficiente del hidrógeno molecular.',
                 en:'Write 3 as the coefficient of molecular hydrogen.'},
        hint:{es:'Cuenta elemento por elemento los dos lados y localiza cuál es el único que no coincide; después busca el coeficiente que solo afecta a ese elemento.',
              en:'Count both sides element by element and find the only one that does not match; then look for the coefficient that affects that element alone.'},
        exp:{es:'El aluminio ya coincide, con dos átomos de cada lado, y el cloro también, con seis. El hidrógeno es el que falla: entra con seis átomos en 6 HCl y sale con cuatro en 2 H₂. Subir ese coeficiente a 3 da seis átomos de hidrógeno y cierra la cuenta sin tocar ninguna fórmula; cualquier otro cambio desbalancea un elemento que ya estaba resuelto.',
             en:'Aluminium already matches, with two atoms on each side, and so does chlorine, with six. Hydrogen is the one that fails: it goes in with six atoms in 6 HCl and comes out with four in 2 H₂. Raising that coefficient to 3 gives six hydrogen atoms and closes the count without touching any formula; any other change unbalances an element that was already settled.'} },
      { q:{es:'Un estudiante entrega 2 KClO₃ → 2 KCl + 2 O₂ como resultado de su balanceo. Identifica el único cambio que la deja correctamente balanceada sin modificar ninguna fórmula.',
             en:'A student hands in 2 KClO₃ → 2 KCl + 2 O₂ as the result of their balancing. Identify the single change that leaves it correctly balanced without modifying any formula.'},
        options:{es:[
          'Escribir 3 como coeficiente del oxígeno molecular.',
          'Escribir 3 como coeficiente del clorato de potasio.',
          'Escribir 4 como coeficiente del cloruro de potasio.',
          'Escribir 1 como coeficiente del clorato de potasio.'],
          en:[
          'Write 3 as the coefficient of molecular oxygen.',
          'Write 3 as the coefficient of potassium chlorate.',
          'Write 4 as the coefficient of potassium chloride.',
          'Write 1 as the coefficient of potassium chlorate.']},
        correct:{es:'Escribir 3 como coeficiente del oxígeno molecular.',
                 en:'Write 3 as the coefficient of molecular oxygen.'},
        hint:{es:'Cuenta elemento por elemento los dos lados y localiza cuál es el único que no coincide; después busca el coeficiente que solo afecta a ese elemento.',
              en:'Count both sides element by element and find the only one that does not match; then look for the coefficient that affects that element alone.'},
        exp:{es:'El potasio y el cloro ya coinciden, con dos átomos de cada uno en ambos lados. El oxígeno es el que falla: entra con seis átomos en 2 KClO₃ y sale con cuatro en 2 O₂. Subir ese coeficiente a 3 reúne los seis átomos que se necesitan; tocar el clorato o el cloruro rompería la igualdad del potasio y del cloro, que ya estaba resuelta.',
             en:'Potassium and chlorine already match, with two atoms of each on both sides. Oxygen is the one that fails: it goes in with six atoms in 2 KClO₃ and comes out with four in 2 O₂. Raising that coefficient to 3 gathers the six atoms needed; touching the chlorate or the chloride would break the equality of potassium and chlorine, which was already settled.'} }
    ][vP9];
    addProb({ title:{es:'Corregir un balanceo entregado', en:'Correcting a submitted balancing'},
      q:V.q, options:V.options, correct:V.correct, hint:V.hint, exp:V.exp, showWork:false });
  })();

  /* ---- P10 ---- */
  (function(){
    var E10 = [
      { sk:'C₃H₈ + O₂ → CO₂ + H₂O', cs:[1,5,3,4], nl:2 },
      { sk:'C₂H₆ + O₂ → CO₂ + H₂O', cs:[2,7,4,6], nl:2 },
      { sk:'Al + O₂ → Al₂O₃', cs:[4,3,2], nl:2 },
      { sk:'Al + HCl → AlCl₃ + H₂', cs:[2,6,2,3], nl:2 },
      { sk:'CaCl₂ + Na₂CO₃ → CaCO₃ + NaCl', cs:[1,1,1,2], nl:2 }
    ][p10i];
    var all = E10.cs.reduce(function(x,y){ return x+y; }, 0);
    var left = 0, i;
    for (i=0;i<E10.nl;i++) left += E10.cs[i];
    var corA = String(all), corB = String(left);
    var ooA = uniq4(corA, [String(all+1), String(all-1), String(all*2), String(all+2), String(Math.max(1,all-2))]);
    var ooB = uniq4(corB, [String(left+1), String(Math.max(1,left-1)), String(all), String(left*2), String(all-left)]);
    var qA = {es:'Balancea la ecuación '+E10.sk+' con los enteros positivos más pequeños posibles y determina la suma de todos los coeficientes de la ecuación resultante. Un coeficiente que no aparece escrito vale uno.',
              en:'Balance the equation '+E10.sk+' with the smallest possible positive integers and determine the sum of all the coefficients of the resulting equation. A coefficient that is not written stands for one.'};
    var qB = {es:'Balancea la ecuación '+E10.sk+' con los enteros positivos más pequeños posibles y determina la suma de los coeficientes que quedan del lado de los reactivos. Un coeficiente que no aparece escrito vale uno.',
              en:'Balance the equation '+E10.sk+' with the smallest possible positive integers and determine the sum of the coefficients on the reactant side. A coefficient that is not written stands for one.'};
    addProb({
      title:{es:'La cuenta final de coeficientes', en:'The final tally of coefficients'},
      q: (vP10 ? qB : qA),
      options: (vP10 ? ooB : ooA),
      correct: (vP10 ? corB : corA),
      hint:{es:'Balancea primero la ecuación completa, revisa que el conjunto de coeficientes no tenga divisor común y solo entonces suma los que te piden, contando el uno que no se escribe.',
            en:'Balance the whole equation first, check that the set of coefficients has no common divisor and only then add the ones you are asked for, counting the one that is not written.'},
      exp: vP10
        ? {es:'Los coeficientes que balancean la ecuación son '+E10.cs.join(', ')+' en el orden en que aparecen las sustancias, y ese conjunto no admite divisor común. Del lado de los reactivos quedan '+E10.cs.slice(0,E10.nl).join(' + ')+' = '+left+'.',
           en:'The coefficients that balance the equation are '+E10.cs.join(', ')+' in the order in which the substances appear, and that set has no common divisor. On the reactant side this leaves '+E10.cs.slice(0,E10.nl).join(' + ')+' = '+left+'.'}
        : {es:'Los coeficientes que balancean la ecuación son '+E10.cs.join(', ')+' en el orden en que aparecen las sustancias, y ese conjunto no admite divisor común. Sumándolos todos, incluido el que no se escribe, resulta '+E10.cs.join(' + ')+' = '+all+'.',
           en:'The coefficients that balance the equation are '+E10.cs.join(', ')+' in the order in which the substances appear, and that set has no common divisor. Adding them all, including the one that is not written, gives '+E10.cs.join(' + ')+' = '+all+'.'},
      showWork:true });
  })();
}
