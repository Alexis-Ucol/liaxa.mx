<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ecuaciones Ax + B = Cx + D y Modelos Lineales</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Ecuaciones Ax + B = Cx + D y Modelos Lineales</div>
    <div class="wcourse" id="wcourse-el">Matemáticas · 1° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Ecuaciones Ax + B = Cx + D y Modelos Lineales</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="sbtn" id="dlBtn" onclick="generatePDF()" style="max-width:280px;margin:0 auto;">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   CENTRALIZED SCHOOL CONFIG (Rule 16) — ships UNBRANDED (Rule 11).
   The ONLY rebranding point. build_all.py substitutes these exact fields
   (BRAND_FIELDS / RGB_FIELDS / logo*) downstream; :root/dark stay as fallback.
   Neutral defaults below == the static :root/dark values, so unbranded == no-op.
   ══════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:'#84246c', primaryDark:'#431136', primaryBg:'#f5e8f2',
  accent:'#585858', accentBg:'#ededed',
  darkPrimary:'#bb4ea0', darkPrimaryDark:'#dd7dc5', darkPrimaryBg:'#360f2d',

    } else { drawings.push(null); }
    var ta = document.getElementById('ta' + i);
    texts.push(ta ? ta.value : '');
    var pp = document.getElementById('pp' + i);
    photos.push((pp && pp.src && pp.src.indexOf('data:') === 0) ? pp.src : null);
  });

    name: studentData.name, group: studentData.group,
    answeredCount: answeredCount, correctCount: correctCount,

    drawings: drawings, texts: texts, photos: photos
  };
  try { localStorage.setItem(lsKey(), JSON.stringify(state)); } catch(e) {}
}

  document.getElementById('restoreBar').style.display = 'none';

  var att = currentAttempt(name, group);
  buildLesson(seededRng(name + group + att));
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
  saved.choices.forEach(function(choice, idx) {

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

/* ================================================
   buildLesson — OVERRIDE IN EACH GUIDE
   ================================================ */
function buildLesson(rng) {
  var body = document.getElementById('lessonBody');
  body.innerHTML = '';
  problems = [];

  /* ============================================================
     HELPERS
     ============================================================ */
  function T(o){
    if (o === undefined || o === null) return '';
    if (typeof o === 'string' || typeof o === 'number') return o;
    return (o[LANG] !== undefined ? o[LANG] : o.es);
  }
  function ri(a,b){ return a + Math.floor(rng()*(b-a+1)); }
  function shufA(arr){
    var a = arr.slice();
    for (var i=a.length-1;i>0;i--){ var j=Math.floor(rng()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
    return a;
  }
  function frac(n,d){ return '<span class="mf-outer"><span class="mf-num">'+n+'</span><span class="mf-den">'+d+'</span></span>'; }
  function el(id){ return document.getElementById(id); }
  function addSection(html){
    var d = document.createElement('div');
    d.className = 'section';
    d.innerHTML = html;
    body.appendChild(d);
    return d;
  }
  var CHIP = 'padding:.55rem .9rem;min-height:44px;min-width:46px';
  var MONO = 'font-family:\'IBM Plex Mono\',monospace';
  var EQBOX = MONO + ';text-align:center;font-size:1.15rem;font-weight:600;color:var(--green-dark);margin:.35rem 0 .8rem';

  /* sign-aware writing: negatives as subtraction (Rule 13) */
  function num(v){ return v < 0 ? '−' + Math.abs(v) : String(v); }
  function xt(a){ if (a===1) return 'x'; if (a===-1) return '−x'; return num(a)+'x'; }
  function sideS(a,b){
    if (a === 0) return num(b);
    var s = xt(a);
    if (b > 0) s += ' + ' + b;
    else if (b < 0) s += ' − ' + Math.abs(b);
    return s;
  }
  function eqS(a,b,c,d){ return sideS(a,b) + ' = ' + sideS(c,d); }

  /* exactly four distinct integer options, correct one first */
  function optsFrom(correct, cands, positiveOnly){
    var out = [correct], i;
    for (i=0;i<cands.length && out.length<4;i++){
      var v = cands[i];
      if (typeof v !== 'number' || !isFinite(v) || v !== Math.floor(v)) continue;
      if (positiveOnly && v <= 0) continue;
      if (out.indexOf(v) < 0) out.push(v);
    }
    var d = 1;
    while (out.length < 4 && d < 400){
      if ((!positiveOnly || correct+d > 0) && out.indexOf(correct+d) < 0) out.push(correct+d);
      else if ((!positiveOnly || correct-d > 0) && out.indexOf(correct-d) < 0) out.push(correct-d);
      d++;
    }
    return out.slice(0,4).map(function(v){ return num(v); });
  }

  function addProblem(spec){
    var raw = Array.isArray(spec.options) ? spec.options.slice() : T(spec.options).slice();
    var correctVal = raw[spec.correctIdx || 0];
    var order = shufA(raw.map(function(_,i){ return i; }));
    var shuffled = order.map(function(k){ return raw[k]; });
    var p = {
      title: T(spec.title),
      questionText: T(spec.questionText),
      fn: spec.fn || '',
      hint: T(spec.hint),
      explanation: T(spec.explanation),
      options: shuffled,
      correctIdx: shuffled.indexOf(correctVal),
      showWork: !!spec.showWork,
      studentChoice: null,
      pendingChoice: null
    };
    problems.push(p);
    buildOneCard(p, problems.length-1);
  }

  /* ============================================================
     IDEA 1 — la x en los dos miembros
     ============================================================ */
  (function(){
    var x0 = ri(3,8), C = ri(2,4), diff = ri(2,4), A = C+diff, B = ri(3,15), D = diff*x0 + B;
    var val = A*x0 + B;
    var bad = x0 + 1;
    addSection(
      '<div class="stag">' + T({es:'Idea 1', en:'Idea 1'}) + '</div>' +
      '<h2>' + T({es:'Cuando la x aparece en los dos miembros', en:'When x appears on both sides'}) + '</h2>' +
      '<p>' + T({
        es:'En la guía anterior la incógnita vivía en un solo lado del signo igual. Ahora la x puede aparecer en los dos miembros al mismo tiempo. La igualdad sigue significando lo mismo: los dos lados tienen que dar el mismo número.',
        en:'In the previous guide the unknown lived on only one side of the equal sign. Now x can appear on both sides at the same time. The equality still means the same thing: both sides have to give the same number.'
      }) + '</p>' +
      '<p>' + T({
        es:'Cada miembro es una regla distinta para calcular un valor a partir de la x. La solución es el único número que hace que las dos reglas den el mismo resultado. Con cualquier otro valor, un miembro queda por encima del otro.',
        en:'Each side is a different rule for calculating a value from x. The solution is the only number that makes both rules give the same result. With any other value, one side ends up above the other.'
      }) + '</p>' +
      '<div class="rules-grid">' +
        '<div class="rcard"><div class="rname">' + T({es:'Ecuación', en:'Equation'}) + '</div><div class="rform">' + eqS(A,B,C,D) + '</div><div class="rnote">' + T({es:'la x está en los dos miembros', en:'x is on both sides'}) + '</div></div>' +
        '<div class="rcard"><div class="rname">' + T({es:'Primer miembro', en:'First side'}) + '</div><div class="rform">' + sideS(A,B) + '</div><div class="rnote">' + T({es:'lo que está antes del igual', en:'what comes before the equal sign'}) + '</div></div>' +
        '<div class="rcard"><div class="rname">' + T({es:'Segundo miembro', en:'Second side'}) + '</div><div class="rform">' + sideS(C,D) + '</div><div class="rnote">' + T({es:'lo que está después del igual', en:'what comes after the equal sign'}) + '</div></div>' +
        '<div class="rcard"><div class="rname">' + T({es:'Solución', en:'Solution'}) + '</div><div class="rform">x = ' + x0 + '</div><div class="rnote">' + T({es:'iguala los dos miembros', en:'makes both sides equal'}) + '</div></div>' +
        '<div class="rcard"><div class="rname">' + T({es:'Comprobación', en:'Check'}) + '</div><div class="rform">' + val + ' = ' + val + '</div><div class="rnote">' + T({es:'los dos lados dan ' + val, en:'both sides give ' + val}) + '</div></div>' +
        '<div class="rcard"><div class="rname">' + T({es:'Valor que falla', en:'A value that fails'}) + '</div><div class="rform">x = ' + bad + '</div><div class="rnote">' + T({es:'da ' + (A*bad+B) + ' contra ' + (C*bad+D), en:'gives ' + (A*bad+B) + ' against ' + (C*bad+D)}) + '</div></div>' +
      '</div>' +
      '<div class="callout"><p><strong>' + T({es:'Dos precios que se cruzan.', en:'Two prices that cross.'}) + '</strong> ' + T({
        es:'Imagina dos tiendas que cobran distinto: una empieza más barata pero sube rápido y la otra empieza más cara pero sube despacio. Hay un momento exacto en que las dos cobran lo mismo. Ese momento es la solución de una ecuación con x en los dos miembros.',
        en:'Imagine two shops that charge differently: one starts cheaper but rises quickly and the other starts more expensive but rises slowly. There is an exact moment when both charge the same. That moment is the solution of an equation with x on both sides.'
      }) + '</p></div>'
    );
  })();

  /* ============================================================
     ACTIVIDAD 1 — el punto de encuentro (3 rondas)
     ============================================================ */
  (function buildMeet(){
    function mk(){
      var x = ri(3,9), C = ri(1,4), diff = ri(2,4), A = C+diff, B = ri(2,12), D = diff*x + B;
      return { A:A, B:B, C:C, D:D, x:x, max:Math.max(12, x+4) };
    }
    var rounds = [mk(), mk(), mk()];
    var idx = 0, tries = 0, locked = false, v = 0;

    addSection(
      '<div class="stag">' + T({es:'Actividad', en:'Activity'}) + '</div>' +
      '<h2>' + T({es:'Busca el punto de encuentro', en:'Find the meeting point'}) + '</h2>' +
      '<p>' + T({
        es:'Las dos barras miden lo que vale cada miembro de la ecuación. Mueve el control para cambiar la x y observa cómo se estiran. Cuando las dos barras midan exactamente lo mismo habrás encontrado la solución. Puedes moverlo cuantas veces quieras.',
        en:'The two bars measure what each side of the equation is worth. Move the control to change x and watch them stretch. When both bars measure exactly the same you will have found the solution. You can move it as many times as you like.'
      }) + '</p>' +
      '<div class="gcrd">' +
        '<div class="mlbl" id="pe_round"></div>' +
        '<div id="pe_eq" style="' + EQBOX + '"></div>' +
        '<div style="margin:.2rem 0 .7rem">' +
          '<div class="mlbl" id="pe_l1" style="margin-bottom:.2rem"></div>' +
          '<div style="background:var(--surface2);border-radius:6px;height:24px;overflow:hidden;margin-bottom:.6rem"><div id="pe_lb" style="height:100%;width:0;background:var(--green);transition:width .25s"></div></div>' +
          '<div class="mlbl" id="pe_r1" style="margin-bottom:.2rem"></div>' +
          '<div style="background:var(--surface2);border-radius:6px;height:24px;overflow:hidden"><div id="pe_rb" style="height:100%;width:0;background:var(--gold);transition:width .25s"></div></div>' +
        '</div>' +
        '<div class="cgrid">' +
          '<div class="cg"><label id="pe_lbl"></label><input type="range" id="pe_slider" min="0" max="12" value="0" step="1"></div>' +
          '<div class="metrics" style="margin-top:0">' +
            '<div class="metric"><div class="mlbl" id="pe_ml"></div><div class="mnum cs" id="pe_mlv"></div></div>' +
            '<div class="metric"><div class="mlbl" id="pe_mr"></div><div class="mnum ps" id="pe_mrv"></div></div>' +
          '</div>' +
        '</div>' +
        '<div id="pe_fb" style="margin-top:.7rem;font-size:.86rem;color:var(--text2);min-height:2.8rem"></div>' +
        '<div style="display:flex;gap:.5rem;flex-wrap:wrap">' +
          '<button class="mtab" id="pe_check" style="' + CHIP + '">' + T({es:'Comprobar', en:'Check'}) + '</button>' +
          '<button class="mtab" id="pe_next" style="' + CHIP + ';display:none">' + T({es:'Otra pareja', en:'Next pair'}) + '</button>' +
        '</div>' +
      '</div>'
    );

    function render(){
      var r = rounds[idx];
      var L = r.A*v + r.B, R = r.C*v + r.D, mx = Math.max(L, R, 1);
      el('pe_lb').style.width = (L/mx*100) + '%';
      el('pe_rb').style.width = (R/mx*100) + '%';
      el('pe_l1').innerHTML = T({es:'Primer miembro', en:'First side'}) + ': <span class="cval">' + L + '</span>';
      el('pe_r1').innerHTML = T({es:'Segundo miembro', en:'Second side'}) + ': <span class="cval">' + R + '</span>';
      el('pe_lbl').innerHTML = T({es:'Valor de x: ', en:'Value of x: '}) + '<span class="cval">' + v + '</span>';
      el('pe_mlv').textContent = r.A + ' × ' + v + ' + ' + r.B + ' = ' + L;
      el('pe_mrv').textContent = r.C + ' × ' + v + ' + ' + r.D + ' = ' + R;
      if (locked) return;
      if (L < R) el('pe_fb').innerHTML = T({
        es:'Con x = ' + v + ' el segundo miembro va adelante por ' + (R-L) + '. La barra verde crece más rápido: prueba un valor mayor.',
        en:'With x = ' + v + ' the second side is ahead by ' + (R-L) + '. The green bar grows faster: try a larger value.'
      });
      else if (L > R) el('pe_fb').innerHTML = T({
        es:'Con x = ' + v + ' el primer miembro se pasa por ' + (L-R) + '. Retrocede un poco: prueba un valor menor.',
        en:'With x = ' + v + ' the first side goes over by ' + (L-R) + '. Step back a little: try a smaller value.'
      });
      else el('pe_fb').innerHTML = '<strong style="color:var(--ok)">' + T({
        es:'Las dos barras miden ' + L + '. Confirma con el botón.',
        en:'Both bars measure ' + L + '. Confirm with the button.'
      }) + '</strong>';
    }
    function renderRound(){
      var r = rounds[idx];
      locked = false; tries = 0; v = 0;
      el('pe_round').textContent = T({es:'Pareja ', en:'Pair '}) + (idx+1) + T({es:' de 3', en:' of 3'});
      el('pe_eq').textContent = eqS(r.A, r.B, r.C, r.D);
      el('pe_ml').textContent = T({es:'Primer miembro', en:'First side'});
      el('pe_mr').textContent = T({es:'Segundo miembro', en:'Second side'});
      var sl = el('pe_slider');
      sl.max = r.max; sl.value = 0;
      el('pe_check').style.display = 'inline-block';
      el('pe_next').style.display = 'none';
      render();
    }
    function showNext(){
      el('pe_check').style.display = 'none';
      if (idx < rounds.length-1) el('pe_next').style.display = 'inline-block';
      else el('pe_fb').innerHTML += '<br><strong style="color:var(--green-dark)">' + T({es:'Encontraste los tres puntos de encuentro.', en:'You found all three meeting points.'}) + '</strong>';
    }
    el('pe_slider').addEventListener('input', function(){
      if (locked) return;
      v = parseInt(this.value,10) || 0;
      render();
    });
    el('pe_check').addEventListener('click', function(){
      var r = rounds[idx];
      if (v === r.x){
        locked = true;
        el('pe_fb').innerHTML = '<strong style="color:var(--ok)">' + T({
          es:'Punto de encuentro en x = ' + r.x + '. Los dos miembros valen ' + (r.A*r.x + r.B) + '. 🎉',
          en:'Meeting point at x = ' + r.x + '. Both sides are worth ' + (r.A*r.x + r.B) + '. 🎉'
        }) + '</strong>';
        showNext();
        return;
      }
      tries++;
      if (tries >= 3){
        locked = true;
        el('pe_fb').innerHTML = '<span style="color:var(--gold)"><strong>' + T({
          es:'El encuentro ocurre en x = ' + r.x + '. La diferencia entre los términos con x se cierra justo cuando la x vale ' + r.x + ', y los dos miembros dan ' + (r.A*r.x + r.B) + '.',
          en:'The meeting happens at x = ' + r.x + '. The gap between the x terms closes exactly when x is ' + r.x + ', and both sides give ' + (r.A*r.x + r.B) + '.'
        }) + '</strong></span>';
        el('pe_slider').value = r.x; v = r.x; render();
        showNext();
        return;
      }
      el('pe_fb').innerHTML = T({
        es:'Todavía no coinciden. Mira cuál barra es más larga y ajusta el valor de x.',
        en:'They do not match yet. Look at which bar is longer and adjust the value of x.'
      });
    });
    el('pe_next').addEventListener('click', function(){
      if (idx < rounds.length-1){ idx++; renderRound(); }
    });
    renderRound();
  })();

  /* ---------- PROBLEMA 1 ---------- */
  (function(){
    var x0 = ri(3,9), C = ri(2,5), diff = ri(2,4), A = C+diff, B = ri(3,14), D = diff*x0 + B;
    var val = A*x0 + B;
    var vsel = Math.floor(rng()*3), V;
    if (vsel === 0){
      V = {
        title:{es:'El valor que iguala', en:'The value that balances'},
        questionText:{
          es:'¿Qué valor de x deja los dos miembros de esta igualdad con el mismo resultado?',
          en:'Which value of x leaves both sides of this equality with the same result?'

    }
    function showNext(){
      el('pg_check').style.display = 'none';
      if (idx < rounds.length-1) el('pg_next').style.display = 'inline-block';
      else el('pg_fb').innerHTML += '<br><strong style="color:var(--green-dark)">' + T({es:'Completaste las tres mallas.', en:'You completed all three grids.'}) + '</strong>';
    }
    function renderRound(){
      var r = rounds[idx];
      count = 0; misses = 0; done = false;
      el('pg_round').textContent = T({es:'Malla ', en:'Grid '}) + (idx+1) + T({es:' de 3', en:' of 3'});
      el('pg_task').textContent = T({
        es:'Colorea el ' + r.p + '% de la malla. El total vale ' + r.N + ' pesos.',
        en:'Colour ' + r.p + '% of the grid. The total is worth ' + r.N + ' pesos.'
      });
      el('pg_check').style.display = 'inline-block';
      el('pg_next').style.display = 'none';
      paint();
    }
    for (var ci=0;ci<cellEls.length;ci++){
      (function(i){
        cellEls[i].addEventListener('click', function(){
          if (done) return;
          count = (count === i+1) ? i : i+1;
          paint();
        });
      })(ci);
    }
    el('pg_slider').addEventListener('input', function(){
      if (done) return;
      count = parseInt(this.value,10) || 0;
      paint();
    });
    el('pg_clear').addEventListener('click', function(){
      if (done) return;
      count = 0; paint();
    });
    el('pg_check').addEventListener('click', function(){
      var r = rounds[idx];
      if (count === r.p){
        done = true;
        el('pg_fb').innerHTML = '<strong style="color:var(--ok)">' + T({
          es:'El ' + r.p + '% de ' + r.N + ' es ' + (r.N*r.p/100) + ': cada casilla vale ' + (r.N/100) + ' y coloreaste ' + r.p + '. 🎉',
          en:r.p + '% of ' + r.N + ' is ' + (r.N*r.p/100) + ': each square is worth ' + (r.N/100) + ' and you coloured ' + r.p + '. 🎉'
        }) + '</strong>';
        showNext();
        return;
      }
      misses++;
      if (misses >= 3){
        done = true;
        count = r.p;
        for (var i=0;i<cellEls.length;i++) cellEls[i].style.background = (i < count) ? 'var(--green)' : 'var(--surface2)';
        el('pg_slider').value = count;
        el('pg_v1').textContent = count + '%';
        el('pg_v2').textContent = String(r.N*r.p/100);
        el('pg_lbl').innerHTML = T({es:'Casillas coloreadas: ', en:'Coloured squares: '}) + '<span class="cval">' + count + '</span>';
        el('pg_fb').innerHTML = '<span style="color:var(--gold)"><strong>' + T({
          es:'El ' + r.p + '% son ' + r.p + ' casillas de las cien. Como el total es ' + r.N + ', cada casilla vale ' + (r.N/100) + ' y el ' + r.p + '% equivale a ' + (r.N*r.p/100),
          en:r.p + '% is ' + r.p + ' squares out of the hundred. Since the total is ' + r.N + ', each square is worth ' + (r.N/100) + ' and ' + r.p + '% amounts to ' + (r.N*r.p/100)
        }) + '</strong></span>';
        showNext();
        return;
      }
      el('pg_fb').innerHTML = T({
        es:'Todavía no coincide con el ' + r.p + '%. Ajusta las casillas coloreadas y vuelve a comprobar.',
        en:'It does not match ' + r.p + '% yet. Adjust the coloured squares and check again.'
      });
    });
    el('pg_next').addEventListener('click', function(){ if (idx < rounds.length-1){ idx++; renderRound(); } });
    renderRound();
  })();

  /* ---------- PROBLEMA 8 ---------- */
  (function(){
    var N = 20*ri(6,25), p = 5*ri(2,12), part = N*p/100;
    var vsel = Math.floor(rng()*2), V;
    if (vsel === 0){
      V = {
        title:{es:'Porcentaje de una cantidad', en:'Percentage of a quantity'},
        questionText:{
          es:'Calcula el ' + p + '% de ' + N + '.',
          en:'Calculate ' + p + '% of ' + N + '.'
        },
        fn: p + '% de ' + N,
        options: optsFrom(part, [N-part, N*(p+5)/100, Math.round(part/2)], true),
        correctIdx: 0,
        hint:{
          es:'Escribe el porcentaje como una fracción con denominador 100 y multiplícalo por la cantidad.',
          en:'Write the percentage as a fraction with denominator 100 and multiply it by the quantity.'
        },
        explanation:{
          es:'El ' + p + '% de ' + N + ' es ' + N + ' × ' + p + ' ÷ 100 = ' + part,
          en:p + '% of ' + N + ' is ' + N + ' × ' + p + ' ÷ 100 = ' + part
        },
        showWork:true
      };
    } else {
      V = {
        title:{es:'La cantidad que queda', en:'The quantity that remains'},
        questionText:{
          es:'A la cantidad ' + N + ' réstale su ' + p + '%.',
          en:'From the quantity ' + N + ' subtract its ' + p + '%.'
        },
        fn: N + ' − ' + p + '% de ' + N,
        options: optsFrom(N-part, [part, N+part, N - 2*part], true),
        correctIdx: 0,
        hint:{
          es:'Primero obtén la parte que corresponde al porcentaje y después réstala de la cantidad original.',
          en:'First obtain the part matching the percentage and then subtract it from the original quantity.'
        },
        explanation:{
          es:'El ' + p + '% de ' + N + ' es ' + part + ', y al restarlo: ' + N + ' − ' + part + ' = ' + (N-part),
          en:p + '% of ' + N + ' is ' + part + ', and subtracting it: ' + N + ' − ' + part + ' = ' + (N-part)
        },
        showWork:true
      };
    }
    addProblem(V);
  })();

  /* ============================================================
     CIERRE
     ============================================================ */
  addSection(
    '<div class="stag">' + T({es:'Cierre', en:'Wrap-up'}) + '</div>' +
    '<h2>' + T({es:'Situaciones para resolver', en:'Situations to solve'}) + '</h2>' +
    '<p>' + T({
      es:'Las dos situaciones que siguen mezclan lo que trabajaste en esta guía. Lee cada una con calma, decide qué representa la incógnita y usa el espacio de trabajo para ordenar tus pasos.',
      en:'The two situations that follow mix everything you worked on in this guide. Read each one calmly, decide what the unknown stands for and use the work area to organise your steps.'
    }) + '</p>'
  );

  /* ---------- PROBLEMA 9 ---------- */
  (function(){
    var N = 20*ri(10,30), p = 5*ri(2,8), part = N*p/100, vsel = Math.floor(rng()*3), spec;
    if (vsel === 0){
      spec = {
        title:{es:'La mochila en oferta', en:'The backpack on sale'},
        q:{
          es:'Una mochila cuesta ' + N + ' pesos y durante una promoción tiene un descuento del ' + p + '%. ¿Cuánto se paga por la mochila con ese descuento?',
          en:'A backpack costs ' + N + ' pesos and during a promotion it has a ' + p + '% discount. How much is paid for the backpack with that discount?'
        },
        ans: N - part,
        cands: [part, N + part, N - 2*part],
        e:{
          es:'El descuento es el ' + p + '% de ' + N + ', es decir ' + N + ' × ' + p + ' ÷ 100 = ' + part + '. Se paga lo que queda: ' + N + ' − ' + part + ' = ' + (N-part),
          en:'The discount is ' + p + '% of ' + N + ', that is ' + N + ' × ' + p + ' ÷ 100 = ' + part + '. What is paid is the rest: ' + N + ' − ' + part + ' = ' + (N-part)
        }
      };
    } else if (vsel === 1){
      spec = {
        title:{es:'El ahorro de la promoción', en:'The saving from the promotion'},
        q:{
          es:'Una bicicleta usada cuesta ' + N + ' pesos y una tienda anuncia una rebaja del ' + p + '% sobre ese precio. ¿Cuántos pesos se ahorra quien la compra durante la rebaja?',
          en:'A used bicycle costs ' + N + ' pesos and a shop announces a ' + p + '% reduction on that price. How many pesos does someone save by buying it during the sale?'
        },
        ans: part,
        cands: [N - part, N + part, 2*part],
        e:{
          es:'El ahorro es el ' + p + '% del precio: ' + N + ' × ' + p + ' ÷ 100 = ' + part,
          en:'The saving is ' + p + '% of the price: ' + N + ' × ' + p + ' ÷ 100 = ' + part
        }
      };
    } else {
      spec = {
        title:{es:'La cuenta con propina', en:'The bill with a tip'},
        q:{
          es:'La cuenta de una comida familiar es de ' + N + ' pesos y se decide dejar una propina equivalente al ' + p + '% de la cuenta. ¿Cuánto se entrega en total?',
          en:'The bill for a family meal is ' + N + ' pesos and they decide to leave a tip equal to ' + p + '% of the bill. How much is handed over in total?'
        },
        ans: N + part,
        cands: [part, N - part, N + 2*part],
        e:{
          es:'La propina es el ' + p + '% de ' + N + ', es decir ' + N + ' × ' + p + ' ÷ 100 = ' + part + '. En total se entrega ' + N + ' + ' + part + ' = ' + (N+part),
          en:'The tip is ' + p + '% of ' + N + ', that is ' + N + ' × ' + p + ' ÷ 100 = ' + part + '. In total ' + N + ' + ' + part + ' = ' + (N+part) + ' is handed over'
        }
      };
    }
    addProblem({
      title: spec.title,
      questionText: spec.q,
      options: optsFrom(spec.ans, spec.cands, true),
      correctIdx: 0,
      hint:{
        es:'Obtén primero la parte que corresponde al porcentaje y después decide si esa parte se resta, se suma o es la respuesta.',
        en:'First obtain the part matching the percentage and then decide whether that part is subtracted, added or is the answer itself.'
      },
      explanation: spec.e,
      showWork:true
    });
  })();

  /* ---------- PROBLEMA 10 ---------- */
  (function(){
    var total = 20*ri(2,7), p = [25,40,50,60,75][Math.floor(rng()*5)], part = total*p/100;
    var vsel = Math.floor(rng()*3), spec;
    if (vsel === 0){
      spec = {
        title:{es:'El grupo completo', en:'The whole class'},
        q:{
          es:'En un grupo de secundaria, el ' + p + '% de los estudiantes participó en la feria de ciencias y esos estudiantes fueron ' + part + '. ¿Cuántos estudiantes tiene el grupo en total?',
          en:'In a secondary class, ' + p + '% of the students took part in the science fair and those students numbered ' + part + '. How many students does the class have in total?'
        }
      };
    } else if (vsel === 1){
      spec = {
        title:{es:'Los libros de la biblioteca', en:'The library books'},
        q:{
          es:'En una biblioteca escolar, el ' + p + '% de los libros de un estante son de poesía y en ese estante hay ' + part + ' libros de poesía. ¿Cuántos libros tiene el estante en total?',
          en:'In a school library, ' + p + '% of the books on a shelf are poetry books and there are ' + part + ' poetry books on that shelf. How many books does the shelf hold in total?'
        }
      };
    } else {
      spec = {
        title:{es:'La meta de ahorro', en:'The savings goal'},
        q:{
          es:'Una familia lleva ahorrados ' + part + ' pesos para un viaje y esa cantidad representa el ' + p + '% de la meta. ¿De cuántos pesos es la meta completa?',
          en:'A family has saved ' + part + ' pesos for a trip and that amount represents ' + p + '% of the goal. How many pesos is the full goal?'
        }
      };
    }
    addProblem({
      title: spec.title,
      questionText: spec.q,
      options: optsFrom(total, [part*2, total - part, Math.round(part*100/(100-p))], true),
      correctIdx: 0,
      hint:{
        es:'Llama x al total desconocido y escribe la igualdad que dice que el porcentaje de x es la cantidad conocida; después despeja.',
        en:'Call x the unknown total and write the equality saying that the percentage of x is the known quantity; then clear x.'
      },
      explanation:{
        es:'Si x es el total, la situación se escribe como ' + p + ' × x ÷ 100 = ' + part + '. Multiplicando los dos miembros por 100: ' + p + 'x = ' + (part*100) + ', y dividiendo entre ' + p + ': x = ' + total,
        en:'If x is the total, the situation is written as ' + p + ' × x ÷ 100 = ' + part + '. Multiplying both sides by 100: ' + p + 'x = ' + (part*100) + ', and dividing by ' + p + ': x = ' + total
      },
      showWork:true
    });
  })();
}
</script>

<!-- LIAXA ANALYTICS -->
<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbztwM8nSIbA895DNHtDQGU9fYXDiK9QpxSCUjnBwP1XkAZtJ2B2eIUOgGHmZz8wVQSx/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
