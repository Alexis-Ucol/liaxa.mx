<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cambios Económicos y Sociales del Siglo XIX</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS - INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; text-align: justify; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--gold-bg); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Cambios Económicos y Sociales del Siglo XIX</div>
    <div class="wcourse" id="wcourse-el">Historia · 2° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Cambios Económicos y Sociales del Siglo XIX</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="sbtn" id="dlBtn" onclick="generatePDF()" style="max-width:280px;margin:0 auto;">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   CENTRALIZED SCHOOL CONFIG (Rule 16) - ships UNBRANDED (Rule 11).
   The ONLY rebranding point. build_all.py substitutes these exact fields
   (BRAND_FIELDS / RGB_FIELDS / logo*) downstream; :root/dark stay as fallback.
   Neutral defaults below == the static :root/dark values, so unbranded == no-op.
   ══════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:'#243c54', primaryDark:'#182a3b', primaryBg:'#eaeef3',
  accent:'#24549c', accentBg:'#e2ebf8',
  darkPrimary:'#5e85ab', darkPrimaryDark:'#8badce', darkPrimaryBg:'#152331',

/* ── Attempt counter + seed (Rule 4): seed = name+group+attempt ── */
function getAttemptKey(name, group){ return 'his2_t04_g02__att__' + (name+'__'+group).replace(/\s+/g,'_'); }
function nextAttempt(name, group){ var k=getAttemptKey(name,group),n=0; try{n=parseInt(localStorage.getItem(k)||'0',10)||0;}catch(e){} n++; try{localStorage.setItem(k,String(n));}catch(e){} return n; }
function currentAttempt(name, group){ var k=getAttemptKey(name,group); try{return parseInt(localStorage.getItem(k)||'1',10)||1;}catch(e){return 1;} }

var studentData   = {};
var problems      = [];

/* ================================================
   SESSION PERSISTENCE  (localStorage)
   ================================================ */
function lsKey() {
  var n = (studentData.name  || '').trim();
  var g = (studentData.group || '').trim();
  return 'his2_t04_g02__' + (n + '__' + g).replace(/\s+/g, '_');
}

function saveSession() {
  if (!studentData.name) return;
  var drawings = [], texts = [], photos = [];
  problems.forEach(function(p, i) {
    var dc = document.getElementById('dc' + i);
    if (dc && dc.width) {
      var blank = document.createElement('canvas');
      blank.width = dc.width; blank.height = dc.height;
      drawings.push(dc.toDataURL() === blank.toDataURL() ? null : dc.toDataURL('image/png'));
    } else { drawings.push(null); }
    var ta = document.getElementById('ta' + i);
    texts.push(ta ? ta.value : '');
    var pp = document.getElementById('pp' + i);
    photos.push((pp && pp.src && pp.src.indexOf('data:') === 0) ? pp.src : null);
  });
  var state = {
    name: studentData.name, group: studentData.group,
    answeredCount: answeredCount, correctCount: correctCount,
    choices: problems.map(function(p) { return p.studentChoice; }),
    drawings: drawings, texts: texts, photos: photos
  };
  try { localStorage.setItem(lsKey(), JSON.stringify(state)); } catch(e) {}
}

function loadSession(name, group) {
  var key = 'his2_t04_g02__' + (name + '__' + group).replace(/\s+/g, '_');
  try { var r = localStorage.getItem(key); return r ? JSON.parse(r) : null; } catch(e) { return null; }
}

function restoreSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  var saved = loadSession(name, group);
  if (!saved) return;
  document.getElementById('restoreBar').style.display = 'none';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = currentAttempt(name, group);
  buildLesson(seededRng(name + group + att));
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
  saved.choices.forEach(function(choice, idx) {
    if (choice !== null && choice !== undefined) confirmMC(idx, choice);
  });
  setTimeout(function() {
    if (saved.drawings) {
      saved.drawings.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var dc = document.getElementById('dc' + i);
        if (!dc || !dc.width) return;
        var img = new Image();
        img.onload = function() {
          var dpr = window.devicePixelRatio || 1;
          dc.getContext('2d').drawImage(img, 0, 0, dc.width / dpr, dc.height / dpr);
        };
        img.src = dataUrl;
      });
    }
    if (saved.texts) {
      saved.texts.forEach(function(text, i) {
        if (!text) return;
        var ta = document.getElementById('ta' + i);
        if (ta) ta.value = text;
      });
    }
    if (saved.photos) {
      saved.photos.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var pp = document.getElementById('pp' + i);
        if (!pp) return;
        pp.src = dataUrl; pp.style.display = 'block';
        var pz = document.getElementById('pz' + i);
        if (pz) pz.style.opacity = '0.4';
      });
    }
  }, 300);
}

function dismissRestore() {
  document.getElementById('restoreBar').style.display = 'none';
}

function checkForSavedSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  if (!name || !group) { document.getElementById('restoreBar').style.display = 'none'; return; }
  var saved = loadSession(name, group);
  var bar = document.getElementById('restoreBar');
  bar.style.display = (saved && saved.choices && saved.choices.some(function(c){ return c !== null; })) ? 'block' : 'none';
}

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER - two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm - used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  //   with an inline-open fallback; everything else -> <a download> click.
  //   Runs synchronously off the tap so iOS accepts navigator.share().
  var _fname   = 'his2_t04_g02_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf';

    if (!w) { window.location.href = u; }
    setTimeout(function(){ URL.revokeObjectURL(u); }, 60000);
  }

  var _isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
               (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  if (_isIOS) {
    var _pdfFile = new File([_pdfBlob], _fname, { type:'application/pdf' });
    if (navigator.canShare && navigator.canShare({ files:[_pdfFile] })) {
      navigator.share({ files:[_pdfFile], title:_fname })
        .then(_restorePdfBtn)
        .catch(function(e){
          if (e && e.name === 'AbortError') { _restorePdfBtn(); return; }
          _openPdfInline(_pdfBlob); _restorePdfBtn();
        });
      return;
    }
    _openPdfInline(_pdfBlob); _restorePdfBtn();
    return;
  }

  var _dlUrl = URL.createObjectURL(_pdfBlob);

function shuffleIdx(n, rng){ var a=[],i,j,t; for(i=0;i<n;i++) a.push(i); for(i=n-1;i>0;i--){ j=Math.floor(rng()*(i+1)); t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function shuffleOpts(opts, correctIndex, rng){
  var ord = shuffleIdx(opts.length, rng);
  return { options: ord.map(function(k){ return opts[k]; }), correctIdx: ord.indexOf(correctIndex) };
}
function pickVariant(list, rng){ return list[Math.floor(rng()*list.length)]; }
function pickSome(pool, n, rng){
  var rest = pool.slice(), out = [];
  while (out.length < n && rest.length) out.push(rest.splice(Math.floor(rng()*rest.length),1)[0]);
  return out;
}

function tlRound(rng){
  var sel = pickSome(TL_POOL, 4, rng);
  var order = sel.slice().sort(function(a,b){ return a.y - b.y; });
  var chips = pickSome(order, 4, rng);
  return { order: order, chips: chips, placed: [], tries: 0, revealed: false };
}
function tlRender(){
  var m = MANIP.tl, z = document.getElementById('tlZone');
  if (!z) return;
  var r = m.data, h = '';
  h += '<div class="mzstep">' + L({ es:'Tramo ' + (m.round+1) + ' de 3', en:'Stretch ' + (m.round+1) + ' of 3' }) + '</div>';
  h += '<div class="mztitle">' + L({ es:'La línea del tiempo del siglo XIX', en:'The timeline of the 19th century' }) + '</div>';
  h += '<div class="mzq">' + L({ es:'Toca los hechos en el orden en que ocurrieron, del más antiguo al más reciente. La fecha aparece solo cuando el hecho encuentra su lugar.', en:'Tap the events in the order they happened, from the oldest to the most recent. The date appears only when an event finds its place.' }) + '</div>';
  h += '<div class="tlslots">';
  for (var i = 0; i < 4; i++) {
    var p = m.placed[i];
    if (p) {
      h += '<div class="tlslot ' + (p.rev ? 'rev' : 'filled') + '"><div class="tlnum">' + (i+1) + '</div><div>' + L(p.ev) + '</div><div class="tlyear">' + p.ev.y + '</div></div>';
    } else {
      h += '<div class="tlslot"><div class="tlnum">' + (i+1) + '</div><div>' + L({ es:'lugar libre', en:'open place' }) + '</div></div>';
    }
  }
  h += '</div>';
  h += '<div class="tlpool">';
  r.chips.forEach(function(ev, k){
    var used = m.placed.some(function(p){ return p && p.ev === ev; });
    if (used) return;
    h += '<div class="tlchip" id="tlc' + k + '" onclick="tlPick(' + k + ')">' + L(ev) + '</div>';
  });
  h += '</div>';
  h += '<div class="mzfb" id="tlFb">' + m.msg + '</div>';
  h += '<div class="mzrow">';
  if (m.done) {
    h += '<span class="mzread">' + L({ es:'Recorrido completo.', en:'Timeline complete.' }) + '</span>';
  } else if (m.placed.length === 4 || r.revealed) {
    h += '<button class="mzbtn" onclick="tlNext()">' + L({ es:'Siguiente tramo', en:'Next stretch' }) + '</button>';
  } else {
    h += '<button class="mzbtn2" onclick="tlReset()">' + L({ es:'Volver a empezar el tramo', en:'Restart this stretch' }) + '</button>';

function tlPick(k){
  var m = MANIP.tl, r = m.data;
  if (r.revealed || m.placed.length >= 4) return;
  var ev = r.chips[k];
  var expected = r.order[m.placed.length];
  if (ev === expected) {
    m.placed.push({ ev: ev, rev: false });
    if (m.placed.length === 4) {
      m.msg = L({ es:'Los cuatro hechos quedaron en su lugar. El orden cuenta una historia: cada uno abre la puerta del siguiente.', en:'All four events are in place. The order tells a story: each one opens the door to the next.' });
      m.cls = 'ok';
    } else {
      m.msg = L({ es:'Ese es el más antiguo de los que quedaban. Sigue avanzando hacia el presente.', en:'That is the oldest of the ones left. Keep moving toward the present.' });
      m.cls = 'ok';
    }
  } else {
    r.tries++;
    if (r.tries >= 3) {
      r.revealed = true;
      m.placed = r.order.map(function(e){ return { ev: e, rev: true }; });
      m.msg = L({ es:'Este es el orden real del tramo. Fíjate en las fechas: el hecho más antiguo suele explicar por qué ocurrió el siguiente.', en:'This is the real order of the stretch. Look at the dates: the oldest event usually explains why the next one happened.' });

function chRound(rng, used){
  var avail = CH_ROUNDS.filter(function(c, i){ return used.indexOf(i) < 0; });
  var chosen = avail[Math.floor(rng()*avail.length)];
  used.push(CH_ROUNDS.indexOf(chosen));
  return { c: chosen, chips: pickSome(chosen.steps, chosen.steps.length, rng), placed: [], tries: 0, revealed: false };
}
function chRender(){
  var m = MANIP.ch, z = document.getElementById('chZone');
  if (!z) return;
  var r = m.data, h = '';
  h += '<div class="mzstep">' + L({ es:'Cadena ' + (m.round+1) + ' de 2', en:'Chain ' + (m.round+1) + ' of 2' }) + '</div>';
  h += '<div class="mztitle">' + L(r.c.title) + '</div>';
  h += '<div class="mzq">' + L({ es:'Arma la cadena de eslabón en eslabón: primero lo que hizo posible todo lo demás, al final lo que resultó de ello.', en:'Build the chain link by link: first what made everything else possible, last what came out of it.' }) + '</div>';
  h += '<div class="chslots">';
  for (var i = 0; i < r.c.steps.length; i++) {
    var p = r.placed[i];
    if (i) h += '<div class="charrow">↓</div>';
    if (p) h += '<div class="chslot ' + (r.revealed ? 'rev' : 'filled') + '"><div class="chnum">' + (i+1) + '</div><div>' + L(p) + '</div></div>';
    else h += '<div class="chslot"><div class="chnum">' + (i+1) + '</div><div>' + L({ es:'eslabón libre', en:'open link' }) + '</div></div>';
  }
  h += '</div>';
  h += '<div class="chpool">';
  r.chips.forEach(function(st, k){
    if (r.placed.indexOf(st) >= 0) return;
    h += '<div class="chchip" onclick="chPick(' + k + ')">' + L(st) + '</div>';
  });
  h += '</div>';
  h += '<div class="mzfb" id="chFb">' + m.msg + '</div>';
  h += '<div class="mzrow">';
  if (m.done) h += '<span class="mzread">' + L({ es:'Cadenas terminadas.', en:'Chains finished.' }) + '</span>';
  else if (r.revealed || r.placed.length === r.c.steps.length) h += '<button class="mzbtn" onclick="chNext()">' + L({ es:'Siguiente cadena', en:'Next chain' }) + '</button>';
  else h += '<button class="mzbtn2" onclick="chReset()">' + L({ es:'Deshacer la cadena', en:'Undo the chain' }) + '</button>';
  h += '</div>';
  z.innerHTML = h;
  var fb = document.getElementById('chFb');

function chPick(k){
  var m = MANIP.ch, r = m.data;
  if (r.revealed || r.placed.length >= r.c.steps.length) return;
  var st = r.chips[k];
  var expected = r.c.steps[r.placed.length];
  if (st === expected) {
    r.placed.push(st);
    if (r.placed.length === r.c.steps.length) {
      m.msg = L({ es:'Cadena completa. Ninguno de estos hechos se explica solo: cada uno nace del anterior.', en:'Chain complete. None of these events explains itself: each one grows out of the previous one.' });
      m.cls = 'ok';
    } else {
      m.msg = L({ es:'Ese eslabón encaja. Ahora busca lo que ese hecho hizo posible.', en:'That link fits. Now look for what that event made possible.' });

    }

    r.tries++;
    if (r.tries >= 3) {
      r.revealed = true;
      r.placed = r.c.steps.slice();
      m.msg = L({ es:'Esta es la cadena completa. Lee de arriba hacia abajo y verás cómo una decisión abrió la puerta de la siguiente.', en:'This is the whole chain. Read it from top to bottom and you will see how one decision opened the door to the next.' });

      m.cls = 'bad';
    }
  }
  chRender();
}
function chReset(){

  m.msg = L({ es:'Cadena deshecha. Empieza otra vez por la causa inicial.', en:'Chain undone. Start again from the first cause.' });
  m.cls = '';
  chRender();
}
function chNext(){

    return;
  }
  m.data = evBuild(m.round, m.rng);
  m.msg = L({ es:'Nuevo expediente, nueva afirmación por sostener.', en:'New file, a new claim to support.' });
  m.cls = '';
  evRender();
}
function evBuild(idx, rng){
  var base = EV_ROUNDS[idx];
  return { claim: base.claim, items: pickSome(base.items, base.items.length, rng),
           sel: [], tries: 0, revealed: false, solved: false, marked: false };
}

function blRender(){
  var m = MANIP.bl, z = document.getElementById('blZone');
  if (!z) return;
  var eco = m.facts.filter(function(f){ return f.placed === 'eco'; });
  var soc = m.facts.filter(function(f){ return f.placed === 'soc'; });
  var ang = Math.max(-14, Math.min(14, (soc.length - eco.length) * 5));
  var h = '';
  h += '<div class="mztitle">' + L({ es:'La balanza del Porfiriato', en:'The scales of the Porfiriato' }) + '</div>';
  h += '<div class="mzq">' + L({ es:'Toca una evidencia y después el platillo al que pertenece. La viga se inclina hacia el platillo más cargado.', en:'Tap a piece of evidence and then the pan it belongs to. The beam tilts toward the heavier pan.' }) + '</div>';
  h += '<div class="blstage">';
  h += '<div class="blbeam" id="blBeam" style="transform:rotate(' + ang + 'deg)"></div>';
  h += '<div class="blpivot"></div><div class="blpost"></div><div class="blbase"></div>';
  h += '<div class="blpans">';
  [['eco', { es:'Lo que creció', en:'What grew' }, eco, -ang], ['soc', { es:'Lo que no mejoró', en:'What did not improve' }, soc, ang]].forEach(function(p){
    var armed = (m.sel !== null && !m.done) ? ' armed' : '';
    h += '<div class="blpan' + armed + '" onclick="blDrop(\'' + p[0] + '\')" style="transform:translateY(' + (p[3] * 1.5) + 'px)">';
    h += '<div class="blhdr">' + L(p[1]) + '</div>';
    p[2].forEach(function(f){ h += '<div class="bltag">' + L(f) + '</div>'; });
    h += '</div>';
  });
  h += '</div></div>';
  h += '<div class="blpool">';
  var left = 0;
  m.facts.forEach(function(f, k){
    if (f.placed) return;
    left++;
    h += '<div class="blchip' + (m.sel === k ? ' sel' : '') + '" onclick="blSel(' + k + ')">' + L(f) + '</div>';
  });
  if (!left) h += '<div class="bdempty">' + L({ es:'todas las evidencias están en la balanza', en:'every piece of evidence is on the scales' }) + '</div>';
  h += '</div>';
  h += '<div class="mzfb" id="blFb">' + m.msg + '</div>';
  h += '<div class="mzrow"><span class="mzread">' + eco.length + ' / 4 ' + L({ es:'y', en:'and' }) + ' ' + soc.length + ' / 4</span>';
  if (!m.done) h += '<button class="mzbtn2" onclick="blReset()">' + L({ es:'Vaciar la balanza', en:'Empty the scales' }) + '</button>';
  h += '</div>';
  z.innerHTML = h;
  var fb = document.getElementById('blFb');
  if (fb) fb.className = 'mzfb ' + m.cls;
}
function blSel(k){
  var m = MANIP.bl;
  if (m.done) return;
  m.sel = (m.sel === k) ? null : k;
  m.msg = (m.sel === null)
    ? L({ es:'Evidencia soltada.', en:'Evidence released.' })
    : L({ es:'Evidencia en la mano. Ahora toca el platillo que le corresponde.', en:'Evidence in hand. Now tap the pan it belongs to.' });
  m.cls = '';
  blRender();
}
function blDrop(pan){
  var m = MANIP.bl;
  if (m.done || m.sel === null) return;
  var f = m.facts[m.sel];
  if (f.pan === pan) {
    f.placed = pan; m.sel = null;
    var eco = m.facts.filter(function(x){ return x.placed === 'eco'; }).length;
    var soc = m.facts.filter(function(x){ return x.placed === 'soc'; }).length;
    if (eco + soc === m.facts.length) {
      m.done = true;
      m.msg = L({ es:'Los dos platillos quedaron llenos y la viga volvió a nivelarse. Por eso el periodo se interpreta como crecimiento económico acelerado y desigualdad social creciente al mismo tiempo.', en:'Both pans ended up full and the beam leveled out again. That is why the period is read as fast economic growth and growing social inequality at the same time.' });
      m.cls = 'ok';
    } else if (eco > soc) {
      m.msg = L({ es:'La viga se inclina hacia lo que creció. Falta cargar el otro platillo para ver el periodo completo.', en:'The beam tilts toward what grew. The other pan still needs weight to see the whole period.' });
      m.cls = 'warn';
    } else if (soc > eco) {
      m.msg = L({ es:'La viga se inclina hacia lo que no mejoró. Falta cargar el otro platillo para ver el periodo completo.', en:'The beam tilts toward what did not improve. The other pan still needs weight to see the whole period.' });
      m.cls = 'warn';
    } else {
      m.msg = L({ es:'Por ahora la balanza está nivelada: llevas la misma cantidad de evidencias de cada lado.', en:'For now the scales are level: you have the same amount of evidence on each side.' });
      m.cls = 'ok';
    }
  } else {
    m.tries++;
    m.sel = null;
    if (m.tries >= 3) {
      m.facts.forEach(function(x){ if (!x.placed) x.placed = x.pan; });
      m.done = true;
      m.msg = L({ es:'Mira la balanza completa: los datos del tamaño de la economía van de un lado y los de las condiciones de vida del otro. Ambos describen el mismo periodo.', en:'Look at the full scales: the data on the size of the economy sit on one side and the data on living conditions on the other. Both describe the same period.' });
      m.cls = 'warn';
    } else {
      m.msg = L({ es:'Ese platillo no corresponde. Pista: esa evidencia ', en:'That pan does not fit. Clue: that evidence ' }) + L(f.why) + '.';
      m.cls = 'bad';
    }
  }
  blRender();
}
function blReset(){
  var m = MANIP.bl;
  m.facts.forEach(function(f){ f.placed = null; });
  m.sel = null; m.tries = 0;
  m.msg = L({ es:'Balanza vacía y nivelada. Vuelve a repartir las evidencias.', en:'Scales empty and level. Deal the evidence again.' });
  m.cls = '';
  blRender();
}

function useVariant(v, rng){
  var so = shuffleOpts((v.opts[LANG] || v.opts.es).slice(), v.correct, rng);
  var p = { title: L(v.title), questionText: L(v.q), fn: '', hint: L(v.hint),
            explanation: L(v.exp), options: so.options, correctIdx: so.correctIdx,
            showWork: false, studentChoice: null, pendingChoice: null };
  problems.push(p);
  buildOneCard(p, problems.length - 1);
}

   buildLesson - concepto, manipulable, reactivo

function buildLesson(rng) {
  injectManipStyles();

  /* ── INTRODUCCIÓN ───────────────────────────── */
  addSection(
    L({ es:'Punto de partida', en:'Starting point' }),
    L({ es:'Un siglo que se reescribe a sí mismo', en:'A century that rewrites itself' }),
    '<p>' + L({ es:'El siglo XIX mexicano no fue una sucesión de fechas sueltas. Fue un siglo en el que el país discutió, muchas veces con las armas, quién manda, de quién es la tierra, quién registra a las personas y con qué recursos vive el Estado. En esta guía vas a trabajar como historiador: ordenar hechos, distinguir causas de consecuencias, separar una evidencia útil de un dato cierto y comparar el crecimiento de la economía con las condiciones de vida de la gente.', en:'The Mexican 19th century was not a string of loose dates. It was a century in which the country argued, often with weapons, over who rules, who owns the land, who records people and with what resources the State lives. In this guide you will work as a historian: ordering events, telling causes from consequences, separating useful evidence from a merely true fact, and comparing the growth of the economy with the living conditions of people.' }) + '</p>' +
    '<div class="callout"><p><strong>' + L({ es:'Tres preguntas guía: ', en:'Three guiding questions: ' }) + '</strong>' + L({ es:'¿por qué un país recién independizado tardó décadas en tener un gobierno estable?, ¿qué cambió realmente con la Reforma?, ¿cómo puede un mismo periodo ser de progreso económico y de desigualdad social al mismo tiempo?', en:'why did a newly independent country take decades to build a stable government, what really changed with the Reform, and how can one period be one of economic progress and of social inequality at the same time?' }) + '</p></div>'
  );

  /* ── CONCEPTO 1 ─────────────────────────────── */
  addSection(
    L({ es:'Concepto 1', en:'Concept 1' }),
    L({ es:'Un Estado sin dinero y sin autoridad', en:'A State without money and without authority' }),
    '<p>' + L({ es:'Al consumarse la Independencia en 1821, el país heredó minas inundadas, caminos destruidos y una hacienda pública vacía. Los ingresos apenas alcanzaban para el ejército y la administración, así que cada gobierno vivía de préstamos con intereses muy altos. Sin recursos propios, el Estado no podía hacerse obedecer.', en:'When independence was completed in 1821, the country inherited flooded mines, ruined roads and an empty treasury. Income barely covered the army and the administration, so every government lived on loans with very high interest. Without resources of its own, the State could not make itself obeyed.' }) + '</p>' +
    '<p>' + L({ es:'A esa falta de dinero se sumó una discusión que no se cerraba: si el país debía ser una federación de estados con gobierno propio o una república central dirigida desde la capital. Entre 1821 y 1855 la presidencia cambió de manos decenas de veces y quienes tenían tropas propias, los caudillos, terminaron decidiendo quién gobernaba. Antonio López de Santa Anna ocupó el poder en varias ocasiones y en 1853 gobernó ya sin congreso, con el título de Alteza Serenísima, mientras vendía el territorio de La Mesilla para pagar gastos corrientes.', en:'To that shortage of money was added an argument that never closed: whether the country should be a federation of states with their own governments or a central republic run from the capital. Between 1821 and 1855 the presidency changed hands dozens of times, and those with troops of their own, the strongmen, ended up deciding who governed. Antonio López de Santa Anna held power several times and by 1853 governed with no congress, under the title of Serene Highness, while selling the La Mesilla territory to pay running costs.' }) + '</p>' +
    '<p>' + L({ es:'La guerra con Estados Unidos entre 1846 y 1848 mostró el costo de esa debilidad: el Tratado de Guadalupe Hidalgo fijó una frontera nueva y el país perdió más de la mitad del territorio que reclamaba.', en:'The war with the United States between 1846 and 1848 showed the cost of that weakness: the Treaty of Guadalupe Hidalgo set a new border and the country lost more than half of the territory it claimed.' }) + '</p>' +
    '<table class="dtable"><tr><th>' + L({ es:'Rasgo', en:'Feature' }) + '</th><th>' + L({ es:'Cómo se veía en la práctica', en:'How it looked in practice' }) + '</th></tr>' +
    '<tr><td>' + L({ es:'Hacienda pública', en:'Public treasury' }) + '</td><td>' + L({ es:'Ingresos escasos, préstamos caros y ventas de emergencia', en:'Scarce income, expensive loans and emergency sales' }) + '</td></tr>' +
    '<tr><td>' + L({ es:'Autoridad', en:'Authority' }) + '</td><td>' + L({ es:'Jefes militares con tropas propias por encima de las leyes', en:'Military chiefs with their own troops standing above the law' }) + '</td></tr>' +
    '<tr><td>' + L({ es:'Forma de gobierno', en:'Form of government' }) + '</td><td>' + L({ es:'Alternancia entre federalismo y centralismo sin acuerdo duradero', en:'Swings between federalism and centralism with no lasting agreement' }) + '</td></tr></table>' +
    '<div class="mzone" id="tlZone"></div>'
  );
  MANIP.tl = { rng: rng, round: 0, placed: [], done: false, cls: '',
    msg: L({ es:'Empieza por el hecho más antiguo del tramo.', en:'Start with the oldest event in this stretch.' }) };
  MANIP.tl.data = tlRound(rng);
  tlRender();

  useVariant(pickVariant(V1(), rng), rng);
  useVariant(pickVariant(V2(), rng), rng);

  /* ── CONCEPTO 2 ─────────────────────────────── */
  addSection(
    L({ es:'Concepto 2', en:'Concept 2' }),
    L({ es:'Dos proyectos para el mismo país', en:'Two projects for the same country' }),
    '<p>' + L({ es:'Hacia mediados de siglo la disputa dejó de ser solo entre caudillos y se volvió una discusión sobre qué clase de país construir. Los liberales sostenían que debía existir una sola ley para todos los habitantes, que ninguna corporación podía tener tribunales propios ni acumular tierras improductivas, y que la creencia religiosa era asunto de cada persona.', en:'Around the middle of the century the dispute stopped being only between strongmen and turned into an argument about what kind of country to build. Liberals held that there should be one law for all inhabitants, that no corporation could have its own courts or pile up unproductive land, and that religious belief was a matter for each person.' }) + '</p>' +
    '<p>' + L({ es:'Los conservadores respondían que ese orden heredado era justamente lo que sostenía a la sociedad: los fueros del ejército y del clero, las propiedades corporativas y una autoridad central fuerte evitaban el desorden. En su versión más extrema, algunos llegaron a buscar un príncipe europeo que diera estabilidad al país.', en:'Conservatives answered that the inherited order was precisely what held society together: the special courts of the army and the clergy, corporate property and a strong central authority kept disorder away. In its most extreme version, some went as far as looking for a European prince to give the country stability.' }) + '</p>' +
    '<div class="srcbox">' + L({ es:'Cada propuesta política de esos años puede leerse con una sola pregunta: ¿esta medida recorta o protege los privilegios de las corporaciones frente al Estado?', en:'Every political proposal of those years can be read with one question: does this measure cut or protect corporate privileges against the State?' }) + '<span class="srcref">' + L({ es:'Criterio de análisis usado en el aula', en:'Analytical criterion used in class' }) + '</span></div>' +
    '<div class="mzone" id="bdZone"></div>'
  );
  var bdCards = pickSome(BD_LIB, 3, rng).map(function(c){ var o = {}; for (var k in c) o[k] = c[k]; o.side = 'lib'; o.placed = null; return o; })
    .concat(pickSome(BD_CON, 3, rng).map(function(c){ var o = {}; for (var k in c) o[k] = c[k]; o.side = 'con'; o.placed = null; return o; }));
  MANIP.bd = { cards: pickSome(bdCards, bdCards.length, rng), sel: null, tries: 0, done: false, cls: '',
    msg: L({ es:'Toca una propuesta para tomarla.', en:'Tap a proposal to pick it up.' }) };
  bdRender();

  useVariant(pickVariant(V3(), rng), rng);

  /* ── CONCEPTO 3 ─────────────────────────────── */
  addSection(
    L({ es:'Concepto 3', en:'Concept 3' }),
    L({ es:'De Ayutla a las Leyes de Reforma', en:'From Ayutla to the Reform Laws' }),
    '<p>' + L({ es:'En marzo de 1854 un grupo encabezado por Juan Álvarez proclamó en el sur el Plan de Ayutla: desconocía al gobierno de Santa Anna y convocaba a un congreso que diera al país una nueva constitución. Santa Anna dejó el poder en 1855 y llegaron gobiernos liberales que empezaron a legislar de inmediato.', en:'In March 1854 a group led by Juan Álvarez proclaimed the Plan of Ayutla in the south: it rejected the Santa Anna government and called a congress to give the country a new constitution. Santa Anna left power in 1855 and liberal governments came in and began to legislate at once.' }) + '</p>' +
    '<p>' + L({ es:'La Ley Juárez de 1855 quitó los tribunales especiales en asuntos civiles; la Ley Lerdo de 1856 ordenó poner en venta las tierras que las corporaciones civiles y eclesiásticas no trabajaban; la Ley Iglesias de 1857 reguló los cobros parroquiales. Ese mismo año el congreso aprobó la Constitución de 1857, con libertades de imprenta, enseñanza y trabajo.', en:'The Juárez Law of 1855 removed the special courts in civil matters; the Lerdo Law of 1856 ordered the sale of lands that civil and church corporations did not work; the Iglesias Law of 1857 regulated parish fees. That same year congress approved the Constitution of 1857, with freedom of the press, of teaching and of work.' }) + '</p>' +
    '<p>' + L({ es:'El rechazo a esa constitución abrió la Guerra de Reforma. Desde Veracruz, entre 1859 y 1861, el gobierno de Benito Juárez expidió las Leyes de Reforma: nacionalización de los bienes del clero, separación entre la Iglesia y el Estado, matrimonio y registro civiles, secularización de los cementerios y libertad de cultos. Esas leyes no solo resolvieron un conflicto de su tiempo: definieron funciones que el Estado conserva hasta hoy.', en:'Rejection of that constitution opened the War of Reform. From Veracruz, between 1859 and 1861, the government of Benito Juárez issued the Reform Laws: nationalization of church property, separation of Church and State, civil marriage and registry, secularization of cemeteries and freedom of worship. Those laws did not only settle a conflict of their own time: they defined functions the State keeps to this day.' }) + '</p>' +
    '<div class="mzone" id="chZone"></div>'
  );
  MANIP.ch = { rng: rng, round: 0, used: [], done: false, cls: '',
    msg: L({ es:'Empieza por el hecho que hizo posible a los demás.', en:'Start with the event that made the others possible.' }) };
  MANIP.ch.data = chRound(rng, MANIP.ch.used);
  chRender();

  useVariant(pickVariant(V4(), rng), rng);
  useVariant(pickVariant(V5(), rng), rng);

  /* ── CONCEPTO 4 ─────────────────────────────── */
  addSection(
    L({ es:'Concepto 4', en:'Concept 4' }),
    L({ es:'La deuda como puerta de entrada', en:'Debt as an open door' }),
    '<p>' + L({ es:'La Guerra de Reforma terminó a finales de 1860 con el triunfo liberal, pero dejó al país arruinado. En julio de 1861 el gobierno suspendió durante dos años el pago de la deuda con el extranjero. La respuesta no se hizo esperar: en octubre, España, Reino Unido y Francia firmaron la Convención de Londres y enviaron tropas a Veracruz.', en:'The War of Reform ended in late 1860 with a liberal victory, but it left the country ruined. In July 1861 the government suspended payment of the foreign debt for two years. The answer came quickly: in October, Spain, the United Kingdom and France signed the London Convention and sent troops to Veracruz.' }) + '</p>' +
    '<p>' + L({ es:'La búsqueda de apoyo externo no era nueva. Durante la guerra civil el gobierno liberal había negociado el tratado McLane y Ocampo con Estados Unidos, y el conservador había firmado el tratado Mon y Almonte con España: ambos bandos ofrecieron ventajas a una potencia a cambio de reconocimiento y recursos.', en:'The search for outside support was not new. During the civil war the liberal government had negotiated the McLane and Ocampo treaty with the United States, and the conservative side had signed the Mon and Almonte treaty with Spain: both sides offered advantages to a power in exchange for recognition and resources.' }) + '</p>' +
    '<p>' + L({ es:'Tras los acuerdos preliminares de La Soledad, España y Reino Unido retiraron sus tropas. Francia se quedó, avanzó al interior y el 5 de mayo de 1862 fue derrotada en Puebla por el ejército mexicano al mando de Ignacio Zaragoza. Un año más tarde tomó Puebla y ocupó la capital, y en 1864 sostuvo un imperio encabezado por Maximiliano de Habsburgo. La República se restauró en 1867.', en:'After the preliminary La Soledad agreements, Spain and the United Kingdom withdrew their troops. France stayed, advanced inland and on 5 May 1862 was defeated at Puebla by the Mexican army under Ignacio Zaragoza. A year later it took Puebla and occupied the capital, and in 1864 it propped up an empire headed by Maximilian of Habsburg. The Republic was restored in 1867.' }) + '</p>' +
    '<div class="mzone" id="evZone"></div>'
  );
  MANIP.ev = { rng: rng, round: 0, done: false, cls: '',
    msg: L({ es:'Elige tres fichas y revisa el expediente.', en:'Choose three cards and review the file.' }) };
  MANIP.ev.data = evBuild(0, rng);
  evRender();

  useVariant(pickVariant(V6(), rng), rng);
  useVariant(pickVariant(V7(), rng), rng);

  /* ── CONCEPTO 5 ─────────────────────────────── */
  addSection(
    L({ es:'Concepto 5', en:'Concept 5' }),
    L({ es:'República restaurada y Porfiriato', en:'Restored Republic and Porfiriato' }),
    '<p>' + L({ es:'Entre 1867 y 1876 la República restaurada intentó reconstruir el país con la Constitución de 1857 como base: se reorganizó la enseñanza, se tendieron los primeros kilómetros de vía férrea y se buscó reducir el peso del ejército. Fue también un periodo de rebeliones y elecciones disputadas.', en:'Between 1867 and 1876 the restored Republic tried to rebuild the country with the Constitution of 1857 as its basis: schooling was reorganized, the first kilometers of railway were laid and there was an effort to reduce the weight of the army. It was also a period of rebellions and disputed elections.' }) + '</p>' +
    '<p>' + L({ es:'En 1876 Porfirio Díaz llegó al poder con el Plan de Tuxtepec, que reclamaba la no reelección. Con el tiempo se mantuvo en la presidencia hasta 1911 bajo la idea de orden y progreso. Su gobierno atrajo capitales de Estados Unidos, Reino Unido y Francia hacia los ferrocarriles, la minería, el petróleo y la industria textil; la red ferroviaria pasó de unos cuantos cientos a casi veinte mil kilómetros.', en:'In 1876 Porfirio Díaz came to power with the Plan of Tuxtepec, which demanded no reelection. Over time he stayed in the presidency until 1911 under the idea of order and progress. His government drew capital from the United States, the United Kingdom and France into railways, mining, oil and the textile industry; the railway network went from a few hundred to almost twenty thousand kilometers.' }) + '</p>' +
    '<p>' + L({ es:'Al mismo tiempo, las leyes de deslinde permitieron a compañías privadas quedarse con tierras sin título moderno, muchos pueblos perdieron sus tierras comunales y en las haciendas se extendió el peonaje por deudas. La prensa crítica fue perseguida y las huelgas de Cananea en 1906 y de Río Blanco en 1907 fueron reprimidas. Interpretar el periodo exige mirar los dos conjuntos de datos a la vez.', en:'At the same time, the survey laws let private companies take over land without a modern title, many villages lost their communal lands and debt peonage spread on the haciendas. The critical press was persecuted and the strikes of Cananea in 1906 and Río Blanco in 1907 were put down. Interpreting the period requires looking at both sets of data at once.' }) + '</p>' +
    '<div class="mzone" id="blZone"></div>'
  );
  MANIP.bl = { facts: pickSome(BL_FACTS, BL_FACTS.length, rng).map(function(f){ var o = {}; for (var k in f) o[k] = f[k]; o.placed = null; return o; }),
    sel: null, tries: 0, done: false, cls: '',
    msg: L({ es:'Toma una evidencia y colócala en su platillo.', en:'Pick up a piece of evidence and place it on its pan.' }) };
  blRender();

  useVariant(pickVariant(V8(), rng), rng);

  /* ── CIERRE ─────────────────────────────────── */
  addSection(
    L({ es:'Cierre', en:'Closing' }),
    L({ es:'Piensa como historiador', en:'Think like a historian' }),
    '<p>' + L({ es:'Reúne todo lo que trabajaste en esta guía y decide con criterio propio.', en:'Bring together everything you worked on in this guide and decide with your own judgement.' }) + '</p>'
  );

  useVariant(pickVariant(V9(), rng), rng);
  useVariant(pickVariant(V10(), rng), rng);
}
</script>

<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbykkuJ_apGq3vALIFd4mr3acu81c7K4OKxW-DZ-i52Ceyl3lOanXMdvbS9SIXPrLQBm/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'Cambios Económicos y Sociales del Siglo XIX';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
