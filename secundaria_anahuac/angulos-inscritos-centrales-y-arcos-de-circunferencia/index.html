<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ángulos Inscritos, Centrales y Arcos de Circunferencia</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── INTERACTIVE WIDGETS ── */
.iwrap { background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--gold); border-radius:12px; padding:1.1rem 1.1rem 1.2rem; }
.iw-tag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:700; margin-bottom:.4rem; }
.iw-goal { font-size:.92rem; color:var(--text); font-weight:600; margin-bottom:.5rem; }
.iw-sub { font-size:.79rem; color:var(--text3); margin-bottom:.75rem; }
.ivcanvas { display:block; width:100%; height:250px; background:var(--surface); }
.iw-ctrl { display:flex; align-items:center; gap:.6rem; margin:.85rem 0 .5rem; }
.iw-ctrl input[type=range] { flex:1; accent-color:var(--green); min-height:34px; }
.iw-btn { min-width:44px; min-height:44px; border:1.5px solid var(--border); background:var(--surface2); color:var(--text); border-radius:9px; font-size:1.05rem; font-weight:700; cursor:pointer; font-family:inherit; }
.iw-btn:hover { border-color:var(--green); color:var(--green); }
.iw-read { font-family:'IBM Plex Mono',monospace; font-size:.8rem; color:var(--green-dark); background:var(--green-bg); border-radius:8px; padding:.45rem .7rem; text-align:center; }
.rverify-btn { margin-top:.85rem; min-height:44px; padding:.55rem 1.25rem; border:none; border-radius:9px; background:var(--green); color:#fff; font-size:.86rem; font-weight:600; cursor:pointer; font-family:inherit; }
.rverify-btn:hover { background:var(--green-dark); }
.rfb { min-height:1.35rem; margin-top:.6rem; font-size:.85rem; color:var(--text2); }
.tl-list, .tsl-bins, .tsl-chips { display:flex; flex-wrap:wrap; gap:.5rem; margin:.75rem 0; }
.tl-list { flex-direction:column; }
.tl-chip { border:1.5px solid var(--border); border-radius:9px; padding:.5rem .8rem; cursor:pointer; background:var(--surface2); font-size:.83rem; min-height:44px; display:flex; align-items:center; gap:.55rem; color:var(--text); }
.tl-chip.sel { border-color:var(--gold); background:var(--gold-bg); }
.tl-chip.locked { cursor:default; }
.tl-num { font-family:'IBM Plex Mono',monospace; color:var(--text3); font-weight:700; }
.tsl-bin { border:1.5px solid var(--border); border-radius:9px; padding:.5rem .75rem; background:var(--surface2); color:var(--text); cursor:pointer; font-size:.8rem; font-family:inherit; min-height:44px; }
.tsl-bin:hover { border-color:var(--green); color:var(--green); }
.tsl-chip { border:1.5px solid var(--gold); background:var(--gold-bg); color:var(--text); border-radius:20px; padding:.4rem .85rem; font-size:.79rem; cursor:pointer; min-height:38px; display:flex; align-items:center; }
.tsl-chip.fixed { border-color:var(--green); background:var(--green-bg); cursor:default; }
.tsl-sum { font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:.92rem; color:var(--green-dark); text-align:center; margin-top:.45rem; }
.reflect-prompt { font-size:.92rem; color:var(--text2); margin:.4rem 0 .85rem; }
.cls-prog { font-family:'IBM Plex Mono',monospace; font-size:.74rem; color:var(--text3); text-align:center; letter-spacing:.08em; }
.cls-card { border:1.5px solid var(--border); background:var(--surface2); border-radius:10px; padding:.85rem .8rem; text-align:center; font-weight:600; font-size:.88rem; margin:.6rem 0 .2rem; color:var(--text); }
.cls-done { font-weight:700; color:var(--ok); text-align:center; padding:.6rem; font-size:.92rem; }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--gold-bg); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ivcanvas { height: 230px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
  .iwrap { padding: .85rem .8rem 1rem; }
  .tsl-bin { font-size: .76rem; padding: .45rem .6rem; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from the rebrand step -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Ángulos Inscritos, Centrales y Arcos de Circunferencia</div>
    <div class="wcourse" id="wcourse-el">Matemáticas · 2° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 2A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Ángulos Inscritos, Centrales y Arcos de Circunferencia</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>

function nextAttempt(name, group){ var k=getAttemptKey(name,group),n=0; try{n=parseInt(localStorage.getItem(k)||'0',10)||0;}catch(e){} n++; try{localStorage.setItem(k,String(n));}catch(e){} return n; }

function restoreSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  var saved = loadSession(name, group);
  if (!saved) return;
  document.getElementById('restoreBar').style.display = 'none';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = currentAttempt(name, group);
  buildLesson(seededRng(name + group + att));
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
  saved.choices.forEach(function(choice, idx) {
    if (choice !== null && choice !== undefined) confirmMC(idx, choice);
  });
  setTimeout(function() {
    if (saved.drawings) {
      saved.drawings.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var dc = document.getElementById('dc' + i);
        if (!dc || !dc.width) return;

        img.src = dataUrl;
      });
    }
    if (saved.texts) {
      saved.texts.forEach(function(text, i) {
        if (!text) return;
        var ta = document.getElementById('ta' + i);
        if (ta) ta.value = text;
      });
    }
    if (saved.photos) {
      saved.photos.forEach(function(dataUrl, i) {

        pp.src = dataUrl; pp.style.display = 'block';

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  if (!tb) return;
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER: two-tap confirmation (Rule 6)
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm, used by restoreSession and setLang to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');

  saveSession();

}

/* ════════════════════════════════════════════════════════════════════════
   GUIDE CONTENT: circle helpers, manipulatives and buildLesson
   ════════════════════════════════════════════════════════════════════════ */
var WIDGET_REDRAW = [];
window.redrawWidgets = function(){ WIDGET_REDRAW.forEach(function(f){ try { f(); } catch(e){} }); };

function cssVar(n){ var v=''; try { v = getComputedStyle(document.documentElement).getPropertyValue(n); } catch(e){} return (v||'').trim(); }

function addSection(tag, title, html){
  var d = document.createElement('div');
  d.className = 'section';
  d.innerHTML = '<div class="stag">'+tag+'</div><h2>'+title+'</h2>'+html;
  document.getElementById('lessonBody').appendChild(d);
}

function shuffleOpts(opts, correct, rng){
  var a = opts.slice();
  for (var i = a.length-1; i > 0; i--){ var j = Math.floor(rng()*(i+1)); var tmp = a[i]; a[i] = a[j]; a[j] = tmp; }
  return { opts:a, idx:a.indexOf(correct) };
}

function permOf(n, rng){
  var a = []; for (var i=0;i<n;i++) a.push(i);
  for (var k=a.length-1;k>0;k--){ var j=Math.floor(rng()*(k+1)); var tmp=a[k]; a[k]=a[j]; a[j]=tmp; }
  var sorted = true; for (var q=0;q<n;q++) if (a[q]!==q) sorted = false;
  if (sorted){ var s=a[0]; a[0]=a[n-1]; a[n-1]=s; }
  return a;
}

function fitCanvas(cv, hh){
  var dpr = window.devicePixelRatio || 1;
  var w = cv.clientWidth || 320;
  cv.width = Math.round(w*dpr); cv.height = Math.round(hh*dpr);
  var ctx = cv.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return { ctx:ctx, w:w, h:hh };
}

/* point of the circle at a math angle in degrees (y grows downwards on canvas) */
function ptOn(cx, cy, R, deg){
  var r = deg*Math.PI/180;
  return [cx + R*Math.cos(r), cy - R*Math.sin(r)];
}
/* sweep of `span` degrees counterclockwise starting at `aDeg` */
function sweep(ctx, cx, cy, R, aDeg, span){
  ctx.arc(cx, cy, R, -aDeg*Math.PI/180, -(aDeg+span)*Math.PI/180, true);
}

/* ── MANIPULATIVE 1: slide two points and watch the arc and its central angle ── */
function buildArco(rng){
  var es = (LANG === 'es');
  var TG = shuffle([90,120,150,200,240,270], rng).slice(0,3);
  var st = { a:0, b:60, r:0, tries:0, lock:false, done:false };

  var wrap = document.createElement('div');
  wrap.className = 'iwrap arcwrap section';
  wrap.setAttribute('data-widget', 'arco');
  wrap.id = 'arcoW';
  wrap.innerHTML =
    '<div class="iw-tag">'+(es?'Taller de arcos':'Arc workshop')+'</div>'+
    '<div class="iw-goal" id="arcGoal"></div>'+
    '<div class="iw-sub">'+(es
      ? 'Desliza cada punto sobre la circunferencia. El arco pintado va de A hacia B en sentido contrario a las manecillas, y el ángulo del centro se recalcula al instante.'
      : 'Slide each point around the circle. The painted arc runs from A to B counterclockwise, and the angle at the centre is recalculated instantly.')+'</div>'+
    '<div class="cvwrap"><canvas class="ivcanvas" id="arcCv"></canvas></div>'+
    '<div class="iw-ctrl"><span class="tl-num">A</span><input type="range" min="0" max="350" step="10" value="0" id="arcA" oninput="arcSet(0,this.value)"></div>'+
    '<div class="iw-ctrl"><span class="tl-num">B</span><input type="range" min="0" max="350" step="10" value="60" id="arcB" oninput="arcSet(1,this.value)"></div>'+
    '<div class="iw-read" id="arcRead"></div>'+
    '<button class="rverify-btn" onclick="arcCheck()">'+(es?'Verificar':'Check')+'</button>'+
    '<div class="rfb" id="arcFb"></div>';
  document.getElementById('lessonBody').appendChild(wrap);

  function span(){ return ((st.b - st.a) % 360 + 360) % 360; }

  function draw(){
    var cv = document.getElementById('arcCv'); if (!cv) return;
    var f = fitCanvas(cv, cv.clientHeight || 250), ctx = f.ctx, w = f.w, hh = f.h;
    ctx.clearRect(0,0,w,hh);
    var cx = w/2, cy = hh/2, R = Math.min(w,hh)/2 - 30, sp = span();
    ctx.strokeStyle = cssVar('--border'); ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.stroke();
    if (sp > 0){
      ctx.beginPath(); ctx.moveTo(cx,cy); sweep(ctx,cx,cy,R,st.a,sp); ctx.closePath();
      ctx.fillStyle = cssVar('--green-bg'); ctx.fill();
      ctx.strokeStyle = cssVar('--gold'); ctx.lineWidth = 5;
      ctx.beginPath(); sweep(ctx,cx,cy,R,st.a,sp); ctx.stroke();
      ctx.strokeStyle = cssVar('--green-dark'); ctx.lineWidth = 2.5;
      ctx.beginPath(); sweep(ctx,cx,cy,R*0.24,st.a,sp); ctx.stroke();
    }
    var A = ptOn(cx,cy,R,st.a), B = ptOn(cx,cy,R,st.b);
    ctx.strokeStyle = cssVar('--green'); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(A[0],A[1]); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(B[0],B[1]); ctx.stroke();
    ctx.fillStyle = cssVar('--green');
    ctx.beginPath(); ctx.arc(A[0],A[1],4.2,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(B[0],B[1],4.2,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = cssVar('--text');
    ctx.beginPath(); ctx.arc(cx,cy,2.8,0,Math.PI*2); ctx.fill();
    ctx.font = '700 12px IBM Plex Sans, sans-serif'; ctx.textAlign = 'center';
    var LA = ptOn(cx,cy,R+16,st.a), LB = ptOn(cx,cy,R+16,st.b);
    ctx.fillText('A', LA[0], LA[1]+4);
    ctx.fillText('B', LB[0], LB[1]+4);
    ctx.fillStyle = cssVar('--text3');
    ctx.fillText('O', cx, cy+16);
    if (sp > 0){
      var LM = ptOn(cx,cy,R*0.44,st.a+sp/2);
      ctx.fillStyle = cssVar('--gold'); ctx.font = '700 13px IBM Plex Sans, sans-serif';
      ctx.fillText(sp+'°', LM[0], LM[1]+4);
    }
  }
  WIDGET_REDRAW.push(draw);

  function readout(){
    var el = document.getElementById('arcRead'); if (!el) return;
    var sp = span();
    el.textContent = (es ? 'Arco AB: ' : 'Arc AB: ') + sp + '°     ' +
                     (es ? 'ángulo central AOB: ' : 'central angle AOB: ') + sp + '°';
  }
  function goalText(){
    var el = document.getElementById('arcGoal'); if (!el || st.r >= TG.length) return;
    el.textContent = es
      ? 'Reto ' + (st.r+1) + ' de 3: acomoda A y B para que el arco pintado mida ' + TG[st.r] + '°.'
      : 'Challenge ' + (st.r+1) + ' of 3: place A and B so the painted arc measures ' + TG[st.r] + '°.';
  }
  function advance(ms){
    st.lock = true;
    setTimeout(function(){
      st.r++; st.tries = 0;
      var fb = document.getElementById('arcFb');
      if (st.r >= TG.length){
        st.done = true;
        if (fb) fb.innerHTML = '<span style="color:var(--ok);font-weight:700">'+(es
          ? 'Ya lees un arco igual que lees su ángulo del centro.'
          : 'You now read an arc the same way you read its angle at the centre.')+'</span>';
        return;
      }
      st.lock = false;
      if (fb) fb.textContent = '';
      goalText(); draw(); readout();
    }, ms);
  }

  window.arcSet = function(which, v){
    if (st.lock || st.done) return;
    var n = parseInt(v,10) || 0;
    if (which === 0) st.a = n; else st.b = n;
    draw(); readout();
  };
  window.arcCheck = function(){
    if (st.lock || st.done) return;
    var tgt = TG[st.r], sp = span(), fb = document.getElementById('arcFb');
    if (sp === tgt){
      fb.innerHTML = '<span style="color:var(--ok);font-weight:700">🎉 '+(es
        ? 'Exacto: el arco mide ' + sp + '° y el ángulo del centro mide lo mismo.'
        : 'Exactly: the arc measures ' + sp + '° and the angle at the centre measures the same.')+'</span>';
      advance(1500); return;
    }
    st.tries++;
    if (st.tries >= 3){
      st.b = (st.a + tgt) % 360;
      var sl = document.getElementById('arcB'); if (sl) sl.value = st.b;
      draw(); readout();
      fb.textContent = es
        ? 'Así queda un arco de ' + tgt + '°: los dos radios se abren justo esa cantidad. Un arco y su ángulo central se miden con el mismo número.'
        : 'This is how a ' + tgt + '° arc looks: the two radii open exactly that much. An arc and its central angle carry the same number.';
      advance(2800); return;
    }
    fb.textContent = (sp < tgt)
      ? (es ? 'El arco se quedó corto por ' + (tgt-sp) + '°. Aleja B de A en el sentido del arco pintado.'
            : 'The arc is ' + (tgt-sp) + '° short. Move B away from A along the painted arc.')
      : (es ? 'Te pasaste por ' + (sp-tgt) + '°. Regresa un poco el punto B hacia A.'
            : 'You went over by ' + (sp-tgt) + '°. Bring B back a little towards A.');
  };

  goalText();
  setTimeout(function(){ draw(); readout(); }, 70);
}

/* ── MANIPULATIVE 2: move the vertex around and open the arc ── */
function buildInscrito(rng){
  var es = (LANG === 'es');
  var TG = shuffle([25,35,45,55,60,70], rng).slice(0,3);
  var st = { s:60, p:50, r:0, tries:0, movedS:false, movedV:false, lock:false, done:false };
  var A0 = 200;

  var wrap = document.createElement('div');
  wrap.className = 'iwrap inswrap section';
  wrap.setAttribute('data-widget', 'inscrito');
  wrap.id = 'inscritoW';
  wrap.innerHTML =
    '<div class="iw-tag">'+(es?'Vértice viajero':'Travelling vertex')+'</div>'+
    '<div class="iw-goal" id="insGoal"></div>'+
    '<div class="iw-sub">'+(es
      ? 'Un control abre el arco AB y el otro pasea el vértice V por el resto de la circunferencia. Observa cuál de los dos cambia la abertura en V.'
      : 'One control opens arc AB and the other walks vertex V around the rest of the circle. Watch which of the two changes the opening at V.')+'</div>'+
    '<div class="cvwrap"><canvas class="ivcanvas" id="insCv"></canvas></div>'+
    '<div class="iw-ctrl"><span class="tl-num">'+(es?'Arco':'Arc')+'</span><input type="range" min="20" max="200" step="10" value="60" id="insS" oninput="insSetArc(this.value)"></div>'+
    '<div class="iw-ctrl"><span class="tl-num">V</span><input type="range" min="0" max="100" step="1" value="50" id="insV" oninput="insSetV(this.value)"></div>'+
    '<div class="iw-read" id="insRead"></div>'+
    '<button class="rverify-btn" onclick="insCheck()">'+(es?'Verificar':'Check')+'</button>'+
    '<div class="rfb" id="insFb"></div>';
  document.getElementById('lessonBody').appendChild(wrap);

  function vDeg(){ return A0 + st.s + (0.12 + 0.76*(st.p/100)) * (360 - st.s); }

  function draw(){
    var cv = document.getElementById('insCv'); if (!cv) return;
    var f = fitCanvas(cv, cv.clientHeight || 250), ctx = f.ctx, w = f.w, hh = f.h;
    ctx.clearRect(0,0,w,hh);
    var cx = w/2, cy = hh/2, R = Math.min(w,hh)/2 - 30;
    ctx.strokeStyle = cssVar('--border'); ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.stroke();
    var A = ptOn(cx,cy,R,A0), B = ptOn(cx,cy,R,A0+st.s), V = ptOn(cx,cy,R,vDeg());
    ctx.strokeStyle = cssVar('--gold'); ctx.lineWidth = 5;
    ctx.beginPath(); sweep(ctx,cx,cy,R,A0,st.s); ctx.stroke();
    ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(A[0],A[1]); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(B[0],B[1]); ctx.stroke();
    ctx.lineWidth = 2.4;
    ctx.beginPath(); sweep(ctx,cx,cy,R*0.20,A0,st.s); ctx.stroke();
    ctx.strokeStyle = cssVar('--green'); ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.moveTo(V[0],V[1]); ctx.lineTo(A[0],A[1]); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(V[0],V[1]); ctx.lineTo(B[0],B[1]); ctx.stroke();
    var aA = Math.atan2(A[1]-V[1], A[0]-V[0]);
    var aB = Math.atan2(B[1]-V[1], B[0]-V[0]);
    var d = aB - aA;
    while (d <= -Math.PI) d += 2*Math.PI;
    while (d > Math.PI) d -= 2*Math.PI;
    ctx.strokeStyle = cssVar('--green-dark'); ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.arc(V[0],V[1],24,aA,aA+d,d<0); ctx.stroke();
    ctx.fillStyle = cssVar('--green');
    [A,B,V].forEach(function(P){ ctx.beginPath(); ctx.arc(P[0],P[1],4.2,0,Math.PI*2); ctx.fill(); });
    ctx.fillStyle = cssVar('--text');
    ctx.beginPath(); ctx.arc(cx,cy,2.8,0,Math.PI*2); ctx.fill();
    ctx.font = '700 12px IBM Plex Sans, sans-serif'; ctx.textAlign = 'center';
    var LA = ptOn(cx,cy,R+16,A0), LB = ptOn(cx,cy,R+16,A0+st.s), LV = ptOn(cx,cy,R+16,vDeg());
    ctx.fillText('A', LA[0], LA[1]+4);
    ctx.fillText('B', LB[0], LB[1]+4);
    ctx.fillText('V', LV[0], LV[1]+4);
    ctx.fillStyle = cssVar('--text3'); ctx.fillText('O', cx, cy+16);
    var LC = ptOn(cx,cy,R*0.40,A0+st.s/2);
    ctx.fillStyle = cssVar('--gold'); ctx.font = '700 13px IBM Plex Sans, sans-serif';
    ctx.fillText(st.s+'°', LC[0], LC[1]+4);
    ctx.fillStyle = cssVar('--green-dark');
    ctx.fillText((st.s/2)+'°', V[0] + 42*Math.cos(aA+d/2), V[1] + 42*Math.sin(aA+d/2) + 4);
  }
  WIDGET_REDRAW.push(draw);

  function readout(){
    var el = document.getElementById('insRead'); if (!el) return;
    el.textContent = (es ? 'Arco AB: ' : 'Arc AB: ') + st.s + '°     ' +
      (es ? 'central AOB: ' : 'central AOB: ') + st.s + '°     ' +
      (es ? 'inscrito AVB: ' : 'inscribed AVB: ') + (st.s/2) + '°';
  }
  function goalText(){
    var el = document.getElementById('insGoal'); if (!el || st.r >= TG.length) return;
    el.textContent = es
      ? 'Reto ' + (st.r+1) + ' de 3: consigue que el ángulo AVB, el que se abre en el vértice V, mida ' + TG[st.r] + '°.'
      : 'Challenge ' + (st.r+1) + ' of 3: make angle AVB, the one opening at vertex V, measure ' + TG[st.r] + '°.';
  }
  function advance(ms){
    st.lock = true;
    setTimeout(function(){
      st.r++; st.tries = 0; st.movedS = false; st.movedV = false;
      var fb = document.getElementById('insFb');
      if (st.r >= TG.length){
        st.done = true;
        if (fb) fb.innerHTML = '<span style="color:var(--ok);font-weight:700">'+(es
          ? 'Descubierto: el vértice puede pasear, el arco es el que manda.'
          : 'Discovered: the vertex may wander, the arc is what rules.')+'</span>';
        return;
      }
      st.lock = false;
      if (fb) fb.textContent = '';
      goalText(); draw(); readout();
    }, ms);
  }

  window.insSetArc = function(v){
    if (st.lock || st.done) return;
    st.s = parseInt(v,10) || 20; st.movedS = true; draw(); readout();
  };
  window.insSetV = function(v){
    if (st.lock || st.done) return;
    st.p = parseInt(v,10) || 0; st.movedV = true; draw(); readout();
  };
  window.insCheck = function(){
    if (st.lock || st.done) return;
    var tgt = TG[st.r], val = st.s/2, fb = document.getElementById('insFb');
    if (val === tgt){
      fb.innerHTML = '<span style="color:var(--ok);font-weight:700">🎉 '+(es
        ? 'Ahí está: el arco AB mide ' + st.s + '° y en V se abre justo la mitad.'
        : 'There it is: arc AB measures ' + st.s + '° and V opens exactly half of it.')+'</span>';
      advance(1600); return;
    }
    st.tries++;
    if (st.tries >= 3){
      st.s = 2*tgt;
      var sl = document.getElementById('insS'); if (sl) sl.value = st.s;
      draw(); readout();
      fb.textContent = es
        ? 'Con un arco AB de ' + st.s + '° el vértice V se abre ' + tgt + '°, lo pongas donde lo pongas sobre el arco mayor.'
        : 'With an arc AB of ' + st.s + '° vertex V opens ' + tgt + '°, wherever you place it on the major arc.';
      advance(3000); return;
    }
    var nudge = (st.movedV && !st.movedS)
      ? (es ? ' Pasear a V no cambió nada: prueba con el otro control.' : ' Walking V changed nothing: try the other control.')
      : '';
    fb.textContent = ((val < tgt)
      ? (es ? 'La abertura en V todavía es chica: le faltan ' + (tgt-val) + '°. Abre más el arco AB.'
            : 'The opening at V is still small: ' + (tgt-val) + '° short. Open arc AB wider.')
      : (es ? 'La abertura en V se pasó por ' + (val-tgt) + '°. Cierra un poco el arco AB.'
            : 'The opening at V is ' + (val-tgt) + '° too wide. Close arc AB a little.')) + nudge;
    st.movedS = false; st.movedV = false;
  };

  goalText();
  setTimeout(function(){ draw(); readout(); }, 70);
}

            : 'Not yet. Compare the measure of the angle with the arc it spans.');

/* ── graded problem builder: pushes and renders one card inline (Rule 1/5) ── */
function addProblem(rng, spec){
  var sh = shuffleOpts(spec.options, spec.correct, rng);
  problems.push({
    title: spec.title,
    questionText: spec.q,
    fn: '',
    options: sh.opts,
    correctIdx: sh.idx,
    hint: spec.hint,
    explanation: spec.exp,
    showWork: !!spec.showWork,
    studentChoice: null,
    pendingChoice: null
  });
  var idx = problems.length - 1;
  buildOneCard(problems[idx], idx);
}

  addSection(C + '3',
    es ? 'Dos consecuencias que se usan a diario' : 'Two consequences used every day',
    es
    ? '<p>De esa relación entre el borde y el centro salen dos resultados que conviene reconocer de inmediato.</p>'+
      '<p>El primero: si dos vértices distintos se apoyan en la circunferencia y ambos abarcan el mismo arco, sus ángulos son iguales entre sí, porque los dos leen ese mismo arco. El segundo: cuando los extremos del arco son las puntas de un diámetro, el arco abarcado es media circunferencia y el vértice del borde se abre siempre en un ángulo recto.</p>'+
      '<div class="callout"><p><strong>Ojo con el vértice:</strong> todo esto vale solo si el vértice está apoyado en la circunferencia. Si se mete hacia adentro o se sale hacia afuera, la relación de la mitad ya no aplica.</p></div>'
    : '<p>Out of that relation between rim and centre come two results worth recognising at once.</p>'+
      '<p>The first: if two different vertices rest on the circle and both span the same arc, their angles are equal to each other, because both are reading that very same arc. The second: when the ends of the arc are the tips of a diameter, the spanned arc is half the circle and the vertex on the rim always opens into a right angle.</p>'+
      '<div class="callout"><p><strong>Watch the vertex:</strong> all of this holds only while the vertex rests on the circle. If it slips inside or outside, the halving relation no longer applies.</p></div>');

  addSection(C + '4',
    es ? 'Cuatro vértices en el mismo borde' : 'Four vertices on the same rim',
    es
    ? '<p>Cuando los cuatro vértices de un cuadrilátero caen sobre una misma circunferencia, se dice que el cuadrilátero está inscrito en ella. Cada uno de sus ángulos es entonces un ángulo inscrito.</p>'+
      '<p>El ángulo de un vértice abarca los arcos que quedan del lado contrario, y el de su vértice opuesto abarca justo los que sobran. Entre los dos se llevan la vuelta completa de arcos, y como cada uno vale la mitad de lo que abarca, sus medidas terminan repartiéndose media vuelta.</p>'
    : '<p>When the four vertices of a quadrilateral all fall on one circle, the quadrilateral is said to be inscribed in it. Each of its angles is then an inscribed angle.</p>'+
      '<p>The angle at one vertex spans the arcs lying on the far side, and the one at the opposite vertex spans exactly the ones left over. Between them they take the full turn of arcs, and since each is worth half of what it spans, their measures end up sharing a half turn.</p>');

    es
    ? '<p>Los grados de un arco dicen qué parte de la vuelta ocupa, pero no cuánto mide de largo. Dos arcos de 60 grados en circunferencias de distinto tamaño ocupan la misma parte de su vuelta y, aun así, uno se recorre en menos pasos que el otro.</p>'+
      '<p>Para pasar de los grados a la longitud hay que repartir: si conoces cuánto mide la circunferencia completa, al arco le toca la parte de esa longitud que corresponde a sus grados dentro de los 360 de la vuelta.</p>'+
      '<div class="callout"><p><strong>La misma idea de reparto:</strong> primero averiguas qué parte de la vuelta ocupa el arco, y luego le das esa misma parte de la longitud total.</p></div>'

      '<div class="callout"><p><strong>The same sharing idea:</strong> first work out what share of the turn the arc takes up, then give it that same share of the total length.</p></div>');

    { es:{ t:'La fotografía del escenario', q:'Un fotógrafo quiere que el escenario, del extremo A al extremo B, le quepa siempre con la misma abertura en su lente. Para lograrlo camina sobre una circunferencia que pasa por A y por B, siempre por el arco mayor. ¿Qué le ocurre a la abertura conforme camina?',
           o:['Se mantiene igual en todo el arco mayor','Crece conforme se acerca al extremo A','Se hace el doble justo en el punto medio del arco','Se reduce a la mitad al llegar al otro extremo'], a:'Se mantiene igual en todo el arco mayor',
           h:'Mientras camina por el arco mayor, el arco que abarca su lente no cambia.',
           e:'Camine donde camine sobre el arco mayor, su vértice sigue apoyado en la circunferencia y sigue abarcando el mismo arco AB, así que la abertura vale siempre la mitad de ese arco y no cambia.' },
      en:{ t:'The photograph of the stage', q:'A photographer wants the stage, from end A to end B, to always fit with the same opening in the lens. To manage it, the photographer walks along a circle passing through A and B, always on the major arc. What happens to the opening while walking?',
           o:['It stays the same all along the major arc','It grows while getting closer to end A','It doubles right at the midpoint of the arc','It halves upon reaching the other end'], a:'It stays the same all along the major arc',
           h:'While walking on the major arc, the arc caught by the lens does not change.',

    { es:{ t:'El error del arco', q:'Sara dice que en su circunferencia hay un ángulo inscrito de 96 grados que abarca un arco de 48 grados. ¿Dónde está el error de Sara?',
           o:['Invirtió la relación: el arco debería ser el doble, no la mitad','Ningún ángulo inscrito puede pasar de 90 grados','Un arco y su ángulo inscrito siempre miden lo mismo','Los dos datos deberían sumar 180 grados'], a:'Invirtió la relación: el arco debería ser el doble, no la mitad',
           h:'Compara quién queda más abierto, el arco o el vértice apoyado en el borde.',
           e:'Un vértice apoyado en la circunferencia vale la mitad del arco que abarca, así que a un ángulo de 96 grados le corresponde un arco de 96 × 2 = 192 grados. Sara puso los papeles al revés.' },
      en:{ t:'The mistake about the arc', q:'Sara says that on her circle there is an inscribed angle of 96 degrees spanning an arc of 48 degrees. Where is Sara wrong?',
           o:['She flipped the relation: the arc should be twice as much, not half','No inscribed angle can go past 90 degrees','An arc and its inscribed angle always measure the same','The two figures should add up to 180 degrees'], a:'She flipped the relation: the arc should be twice as much, not half',
           h:'Compare which one ends up wider, the arc or the vertex resting on the rim.',
           e:'A vertex resting on the circle is worth half the arc it spans, so an angle of 96 degrees goes with an arc of 96 × 2 = 192 degrees. Sara swapped the roles.' } }
  ];
  var p10 = P10V[Math.floor(rng()*P10V.length)];
  addProblem(rng, { title:p10[LANG].t, q:p10[LANG].q, hint:p10[LANG].h, exp:p10[LANG].e, options:p10[LANG].o, correct:p10[LANG].a, showWork:false });

<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbyjbSUYDHwe-0Hl5GnZC6mP3_iKPYnLqeUgbuhxARkW2-keCAAV6sSg0wYWJnJBhY7lUQ/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var body = JSON.stringify({school:school,event:ev,module_id:moduleId,
      session_id:sessionId,elapsed_sec:Math.round((Date.now()-openedAt)/1000)});
    if(ev==='module_close'&&navigator.sendBeacon){
      navigator.sendBeacon(GAS_URL,new Blob([body],{type:'application/json'}));
    }else{
      fetch(GAS_URL,{method:'POST',body:body,headers:{'Content-Type':'application/json'},keepalive:true}).catch(function(){});
    }
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
