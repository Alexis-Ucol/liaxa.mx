<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Introducción a la Estadística · Semana 1 · Facultad de Economía, Universidad de Colima</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --green:      #4a7c3f;
  --green-dark: #2d5a27;
  --green-bg:   #eaf0e7;
  --gold:       #c9a84c;
  --gold-bg:    #faf3e0;
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #1e7d45;
  --ok-bg:      rgba(30,125,69,.12);
  --bad:        #c0321a;
  --bad-bg:     rgba(192,50,26,.10);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:#18181a; --surface:#242420; --surface2:#2e2e28; --border:#3a3830;
  --text:#e8e4da; --text2:#b0aa9e; --text3:#7a7468; --shadow:0 4px 20px rgba(0,0,0,.35);
  --green:#6aaa5f; --green-dark:#8ecf82; --green-bg:#1a281a;
  --gold:#d4b86a; --gold-bg:#241e0e;
  --ok:#4a9a6f; --ok-bg:rgba(74,154,111,.12);
  --bad:#c05030; --bad-bg:rgba(192,80,48,.10);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'IBM Plex Sans',sans-serif;background:var(--bg);color:var(--text);line-height:1.65}

/* WELCOME */
#welcomeScreen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:1.5rem}
.wcard{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:2.4rem 2rem;width:100%;max-width:460px;text-align:center;border-top:4px solid var(--gold)}
.wlogos{display:flex;justify-content:center;align-items:center;gap:1.4rem;margin-bottom:1.6rem;padding-bottom:1.6rem;border-bottom:1px solid var(--border)}
.wlogos img{height:50px;width:auto;object-fit:contain}
.wlogsep{width:1px;height:40px;background:var(--border);flex-shrink:0}
.wtitle{font-family:'Crimson Pro',serif;font-size:1.65rem;font-weight:700;margin-bottom:.25rem}
.wcourse{font-size:.78rem;color:var(--text3);letter-spacing:.07em;text-transform:uppercase;margin-bottom:1.6rem}
.flabel{display:block;font-size:.75rem;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.3rem;text-align:left}
.finput{width:100%;padding:.7rem .9rem;border:1.5px solid var(--border);border-radius:8px;background:var(--surface2);color:var(--text);font-size:.95rem;font-family:inherit;margin-bottom:.9rem;transition:border-color .18s}
.finput:focus{outline:none;border-color:var(--green)}
.sbtn{width:100%;padding:.85rem;background:var(--green);color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;transition:background .18s}
.sbtn:hover{background:var(--green-dark)}
.serr{min-height:1.2rem;font-size:.82rem;color:var(--bad);margin-top:.4rem}
.wfoot{margin-top:1rem;font-size:.75rem;color:var(--text3)}

/* LESSON */
#lessonScreen{display:none}
.stickybar{position:sticky;top:0;z-index:100;background:var(--surface);border-bottom:1px solid var(--border);padding:.55rem 1.2rem;display:flex;align-items:center;gap:.7rem;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.hlogos{display:flex;gap:.5rem;align-items:center}
.hlogos img{height:26px;width:auto;object-fit:contain}
.hsep{width:1px;height:22px;background:var(--border);flex-shrink:0}
.htitle{font-family:'Crimson Pro',serif;font-size:1rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.hchip{font-size:.7rem;background:var(--green-bg);color:var(--green-dark);padding:.2rem .65rem;border-radius:20px;white-space:nowrap;flex-shrink:0}
.tbtn{background:none;border:1px solid var(--border);border-radius:7px;padding:.28rem .55rem;cursor:pointer;font-size:.82rem;color:var(--text2);flex-shrink:0}
.progbar{height:3px;background:var(--border);position:sticky;top:47px;z-index:99}
.progfill{height:100%;background:var(--green);width:0%;transition:width .4s}
.lang-toggle{display:flex;border:1.5px solid var(--border);border-radius:8px;overflow:hidden;flex-shrink:0}
.lang-btn{padding:.28rem .7rem;font-size:.72rem;font-weight:600;letter-spacing:.06em;cursor:pointer;border:none;background:none;color:var(--text3);font-family:inherit;transition:all .15s}
.lang-btn.active{background:var(--green);color:#fff}

/* CONTENT */
.lbody{max-width:760px;margin:0 auto;padding:2rem 1.2rem 4rem}
.section{opacity:0;transform:translateY(16px);transition:opacity .48s,transform .48s;margin-bottom:2.8rem}
.section.vis{opacity:1;transform:none}
.stag{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:.45rem}
.section h2{font-family:'Crimson Pro',serif;font-size:1.65rem;font-weight:700;margin-bottom:.7rem}
.section p{color:var(--text2);margin-bottom:.8rem}
.callout{background:var(--green-bg);border-left:4px solid var(--green);border-radius:0 10px 10px 0;padding:1rem 1.2rem;margin:1rem 0}
.callout strong{color:var(--green-dark)}
.callout p{margin-bottom:0}

/* RULE CARDS */
.rules-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:.75rem;margin:1.1rem 0}
.rcard{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:.9rem;border-top:3px solid var(--green);overflow-x:auto}
.rname{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);margin-bottom:.35rem}
.rval{font-size:.88rem;color:var(--green-dark);font-weight:600;margin-bottom:.3rem}
.rnote{font-size:.76rem;color:var(--text3)}

/* EXAMPLE BLOCK */
.gcrd{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.3rem;margin:.9rem 0}
.gcrd p{margin-bottom:.5rem}

/* DRAG-DROP */
.dd-pool{display:flex;flex-wrap:wrap;gap:.5rem;padding:.9rem;background:var(--surface2);border-radius:10px;border:2px dashed var(--border);margin:.75rem 0;min-height:52px}
.dd-chip{background:var(--green);color:#fff;border-radius:6px;padding:.32rem .8rem;font-size:.82rem;font-weight:500;cursor:grab;user-select:none;transition:opacity .15s,transform .1s;border:2px solid transparent}
.dd-chip:active{cursor:grabbing;transform:scale(1.06)}
.dd-chip.used{opacity:.3;cursor:default;pointer-events:none}
.dd-chip.gold{background:var(--gold);color:#1a1a00}
.dd-bins{display:grid;gap:.65rem;margin:.75rem 0}
.dd-bins.cols2{grid-template-columns:1fr 1fr}
.dd-bins.cols4{grid-template-columns:repeat(4,1fr)}
.dd-bin{min-height:70px;border-radius:10px;border:2px dashed var(--border);padding:.6rem .8rem;background:var(--surface);transition:background .16s,border-color .16s}
.dd-bin.over{background:var(--green-bg);border-color:var(--green)}
.dd-bin h4{font-size:.72rem;font-weight:600;color:var(--text3);letter-spacing:.06em;text-transform:uppercase;margin-bottom:.45rem;pointer-events:none}
.dd-bin .dd-chip{margin:.2rem .2rem .2rem 0;cursor:default}
.dd-bin .dd-chip.ok-chip{background:var(--ok);border-color:var(--ok)}
.dd-bin .dd-chip.bad-chip{background:var(--bad);border-color:var(--bad)}
.dd-actions{display:flex;gap:.5rem;margin-top:.5rem;flex-wrap:wrap}
.dd-check{background:var(--green);color:#fff;border:none;border-radius:8px;padding:.45rem 1.1rem;font-size:.82rem;font-weight:600;cursor:pointer;font-family:inherit}
.dd-reset{background:none;border:1.5px solid var(--border);color:var(--text2);border-radius:8px;padding:.45rem .9rem;font-size:.82rem;cursor:pointer;font-family:inherit}
.dd-fb{font-size:.82rem;margin-top:.55rem;padding:.55rem .85rem;border-radius:8px;display:none;line-height:1.5}
.dd-fb.show{display:block}
.dd-fb.ok{background:var(--ok-bg);color:var(--ok)}
.dd-fb.bad{background:var(--bad-bg);color:var(--bad)}
.dd-fb.part{background:var(--gold-bg);color:#7a5800}

/* MATCH ACTIVITY (levels) */
.match-grid{display:flex;flex-direction:column;gap:.55rem;margin:.75rem 0}
.match-row{display:flex;align-items:center;gap:.65rem;background:var(--surface);border:1.5px solid var(--border);border-radius:9px;padding:.65rem .9rem;transition:border-color .2s}
.match-row.ok{border-color:var(--ok);background:var(--ok-bg)}
.match-row.bad{border-color:var(--bad);background:var(--bad-bg)}
.match-var{flex:1;font-size:.85rem;font-weight:500;color:var(--text)}
.match-ctx{font-size:.72rem;color:var(--text3);margin-top:.15rem}
.match-sel{border:1.5px solid var(--border);border-radius:7px;padding:.35rem .5rem;font-family:'IBM Plex Sans',sans-serif;font-size:.8rem;background:var(--surface2);color:var(--text);cursor:pointer;min-width:100px}
.match-sel:focus{outline:none;border-color:var(--green)}
.match-sel:disabled{opacity:.7;cursor:default}
.match-icon{font-size:1rem;flex-shrink:0;width:22px;text-align:center}

/* CASE INTEGRADOR */
.case-box{background:var(--gold-bg);border:1.5px solid rgba(201,168,76,.4);border-radius:12px;padding:1.2rem 1.4rem;margin:.85rem 0}
.case-q{font-size:.88rem;color:var(--text2);margin-bottom:.65rem;line-height:1.6}
.case-q strong{color:var(--text)}
.case-input{width:100%;padding:.6rem .85rem;border:1.5px solid var(--border);border-radius:8px;font-family:'IBM Plex Sans',sans-serif;font-size:.85rem;background:var(--surface);color:var(--text);margin-bottom:.45rem;transition:border-color .18s}
.case-input:focus{outline:none;border-color:var(--green)}
.case-reveal{background:var(--green);color:#fff;border:none;border-radius:8px;padding:.45rem 1.1rem;font-size:.82rem;font-weight:600;cursor:pointer;font-family:inherit;margin-top:.3rem}
.case-answer{display:none;margin-top:.65rem;background:var(--green-bg);border-left:4px solid var(--green);border-radius:0 9px 9px 0;padding:.75rem 1rem;font-size:.83rem;color:var(--text2);line-height:1.55}
.case-answer.show{display:block}
.case-answer strong{color:var(--green-dark)}

/* RESULT */
.dlbtn{background:var(--green);color:#fff;border:none;border-radius:10px;padding:.8rem 1.8rem;font-size:.95rem;font-weight:600;cursor:pointer;transition:background .18s}
.dlbtn:hover{background:var(--green-dark)}
.dlbtn:disabled{opacity:.6;cursor:wait}

@media(max-width:600px){
  .wcard{padding:1.6rem 1.1rem}
  .dd-bins.cols2,.dd-bins.cols4{grid-template-columns:1fr 1fr}
  .lbody{padding:1.2rem .7rem 3rem}
  .section h2{font-size:1.3rem}
  .htitle{display:none}
  .lang-btn{padding:.26rem .48rem;font-size:.68rem}
  .match-sel{min-width:85px}
}
</style>
</head>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos">
      <img id="logo-left"  src="" alt="Facultad de Economía" style="display:none">
      <div class="wlogsep" id="wlogsep"></div>
      <img id="logo-right" src="" alt="Universidad de Colima" style="display:none">
    </div>
    <div class="wtitle" id="w-title">Introducción a la Estadística</div>
    <div class="wcourse" id="w-course">Estadística · Semana 1</div>
    <label class="flabel" for="sName" id="lbl-name">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name">
    <label class="flabel" for="sGroup" id="lbl-group">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar</button>
    <div class="serr" id="startErr"></div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.9rem">
      <svg width="160" height="52" viewBox="0 0 180 52" xmlns="http://www.w3.org/2000/svg">
        <style>.lbt{font-family:'Crimson Pro',serif;font-weight:700;letter-spacing:.1em;fill:var(--green);font-size:28px}.lbl{stroke:var(--gold);stroke-width:2.5}.lba{fill:var(--gold)}</style>
        <polyline points="5,40 14,28 24,33 36,14" fill="none" stroke="var(--green)" stroke-width="3"/>
        <circle cx="36" cy="14" r="4.5" class="lba"/>
        <line x1="52" y1="6" x2="52" y2="46" class="lbl"/>
        <text x="64" y="38" class="lbt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <img id="hlogo-left"  src="" alt="Facultad de Economía" style="display:none">
      <img id="hlogo-right" src="" alt="Universidad de Colima" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle" id="h-title">Introducción a la Estadística</div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle">
      <button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button>
      <button class="lang-btn"        id="btn-en" onclick="setLang('en')">EN</button>
    </div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>
  <div class="section" id="s_results" style="display:none">
    <div style="text-align:center;padding:2rem 1rem">
      <button class="dlbtn" id="dlBtn" onclick="generatePDF()">⬇ &nbsp;<span id="pdf-lbl">Descargar resultados en PDF</span></button>
    </div>
  </div>
</div>

// ═══════════════════════════════════════════════════
// SEEDED RNG
// ═══════════════════════════════════════════════════
function seededRng(seed){
  var s=0;
  for(var i=0;i<seed.length;i++) s=(Math.imul(31,s)+seed.charCodeAt(i))|0;
  return function(){
    s=(s+0x9e3779b9)|0;
    var t=s^(s>>>16); t=Math.imul(t,0x21f0aaad);
    t^=(t>>>15); t=Math.imul(t,0x735a2d97);
    return((t^(t>>>15))>>>0)/4294967296;
  };
}
function shuffle(arr,rng){
  var a=arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j=Math.floor(rng()*(i+1));
    var tmp=a[i];a[i]=a[j];a[j]=tmp;
  }
  return a;
}

// ═══════════════════════════════════════════════════
// DRAG-DROP ENGINE
// ═══════════════════════════════════════════════════
var dragging=null, tapping=null;

function chipToPool(chip){
  // Walk up until we find a common ancestor that contains both a dd-bin and a dd-pool,
  // then find the dd-pool sibling
  var el=chip.parentElement;
  while(el){
    var pool=el.querySelector('.dd-pool');
    if(pool){ pool.appendChild(chip); break; }
    el=el.parentElement;
  }
  chip.style.opacity='1';
  chip.classList.remove('used','in-bin');
  chip.style.outline='';
}

function chipToBin(chip,bin){
  bin.appendChild(chip);
  chip.classList.add('in-bin');
  chip.style.opacity='1';
}

// ── Drag ──
function ddStart(chip){
  // If chip is in a bin, drag it back — handled in ddDrop via origin
  dragging=chip; chip.style.opacity='.5';
}
function ddEnd(chip){ chip.style.opacity='1'; }
function ddOver(e,bin){ e.preventDefault(); bin.classList.add('over'); }
function ddLeave(bin){ bin.classList.remove('over'); }
function ddDrop(e,bin){
  e.preventDefault(); bin.classList.remove('over');
  if(!dragging) return;
  chipToBin(dragging,bin);
  dragging=null;
}
// Drop onto pool — returns chip
function poolDrop(e,pool){
  e.preventDefault();
  if(!dragging) return;
  chipToPool(dragging);
  dragging=null;
}

// ── Tap (mobile) ──
function chipTap(chip, e){
  if(e) e.stopPropagation(); // prevent click bubbling to bin
  // If chip is already in a bin → return it to pool on tap
  if(chip.classList.contains('in-bin')){
    if(tapping){ tapping.style.outline=''; tapping=null; }
    chipToPool(chip);
    return;
  }
  // Otherwise select/deselect it
  if(tapping === chip){ tapping.style.outline=''; tapping=null; return; }
  if(tapping){ tapping.style.outline=''; }
  tapping=chip; chip.style.outline='2px solid var(--gold)';
}
function binTap(bin, e){
  if(!tapping) return;
  if(e) e.stopPropagation();
  chipToBin(tapping,bin);
  tapping.style.outline=''; tapping=null;
}

        '<div class="rnote">'+(es?'Las distancias entre valores son iguales, pero el cero no significa "ausencia total".':'Distances between values are equal, but zero does not mean "total absence".')+'<br><em style="font-size:.72rem;color:var(--gold)">'+(es?'Ej: temperatura °C, año calendario':'Ex: temperature °C, calendar year')+'</em></div>'+
      '</div>'+
      '<div class="rcard">'+
        '<div class="rname">4. '+(es?'Razón':'Ratio')+'</div>'+
        '<div class="rval">'+(es?'Distancias + cero real':'Distances + true zero')+'</div>'+
        '<div class="rnote">'+(es?'Como intervalo, pero el cero significa ausencia real. Puedes decir "el doble de".':'Like interval, but zero means true absence. You can say "twice as much".')+'<br><em style="font-size:.72rem;color:var(--gold)">'+(es?'Ej: ventas en $, edad, peso':'Ex: sales in $, age, weight')+'</em></div>'+
      '</div>'+
    '</div>'+
    '<div class="callout">'+
      '<strong>'+(es?'Truco para Intervalo vs. Razón:':'Trick for Interval vs. Ratio:')+'</strong>'+
      '<p>'+(es?
        ' Pregúntate: ¿el cero significa <em>nada</em> de verdad? 0°C no significa nada de calor → <strong>Intervalo</strong>. $0 de ventas sí significa ninguna venta → <strong>Razón</strong>.':
        ' Ask yourself: does zero truly mean <em>nothing</em>? 0°C doesn\'t mean no heat → <strong>Interval</strong>. $0 in sales truly means no sales → <strong>Ratio</strong>.')+'</p>'+
    '</div>';
  lb.appendChild(s3);



  // ─── ACTIVITY 3: Match variables to levels ───
  var matchItemsES=[
    {v:'Código postal del cliente',    ctx:'Registro bancario',            ans:'nominal'},
    {v:'Temperatura de almacén (°C)',  ctx:'Control de calidad',           ans:'intervalo'},
    {v:'Número de quejas por semana',  ctx:'Reporte de servicio',          ans:'discreta'},
    {v:'Satisfacción: Malo/Regular/Bueno/Excelente', ctx:'Encuesta',      ans:'ordinal'},
    {v:'Ingresos mensuales ($)',       ctx:'Base de datos de nómina',      ans:'razon'},
    {v:'Sector industrial',            ctx:'Encuesta empresarial',         ans:'nominal'},
    {v:'Año de fundación de la empresa',ctx:'Directorio corporativo',      ans:'intervalo'},
    {v:'Unidades producidas por turno',ctx:'Reporte de planta',            ans:'discreta'}
  ];
  var matchItemsEN=[
    {v:'Customer postal code',         ctx:'Bank records',                 ans:'nominal'},
    {v:'Warehouse temperature (°C)',   ctx:'Quality control',              ans:'intervalo'},
    {v:'Complaints per week',          ctx:'Service report',               ans:'discreta'},
    {v:'Satisfaction: Poor/Fair/Good/Excellent', ctx:'Survey',            ans:'ordinal'},
    {v:'Monthly income ($)',           ctx:'Payroll database',             ans:'razon'},
    {v:'Industry sector',              ctx:'Business survey',              ans:'nominal'},
    {v:'Year company was founded',     ctx:'Corporate directory',          ans:'intervalo'},
    {v:'Units produced per shift',     ctx:'Plant report',                 ans:'discreta'}
  ];
  var matchItems=shuffle(es?matchItemsES:matchItemsEN,rng).slice(0,6);

  var levelOpts=es?
    '<option value="">—</option><option value="nominal">Nominal</option><option value="ordinal">Ordinal</option><option value="intervalo">Intervalo</option><option value="razon">Razón</option><option value="discreta">Cuant. Discreta</option>':
    '<option value="">—</option><option value="nominal">Nominal</option><option value="ordinal">Ordinal</option><option value="intervalo">Interval</option><option value="razon">Ratio</option><option value="discreta">Quant. Discrete</option>';

  var rows=matchItems.map(function(item,i){
    return '<div class="match-row" id="mr'+i+'">'+
      '<div style="flex:1">'+
        '<div class="match-var">'+item.v+'</div>'+
        '<div class="match-ctx">'+item.ctx+'</div>'+
      '</div>'+
      '<select class="match-sel" id="ms'+i+'" data-ans="'+item.ans+'">'+levelOpts+'</select>'+
      '<div class="match-icon" id="mi'+i+'"></div>'+
    '</div>';
  }).join('');

  var act3m=document.createElement('div');
  act3m.className='section';
  act3m.id='act3';
  act3m.innerHTML=
    '<div class="stag">'+(es?'Actividad 3 de 4':'Activity 3 of 4')+'</div>'+
    '<h2>'+(es?'Clasifica cada variable':'Classify each variable')+'</h2>'+
    '<p>'+(es?
      'Para cada variable, selecciona su nivel de medición correcto en el menú. Cuando termines, presiona Verificar.':
      'For each variable, select its correct level of measurement from the menu. When done, press Check.')+'</p>'+
    '<div class="match-grid" id="match-grid">'+rows+'</div>'+
    '<div class="dd-actions">'+
      '<button class="dd-check" onclick="checkMatch()">'+(es?'✓ Verificar':'✓ Check')+'</button>'+
      '<button class="dd-reset" onclick="resetMatch()">'+(es?'↺ Reiniciar':'↺ Reset')+'</button>'+
    '</div>'+
    '<div class="dd-fb" id="fb3"></div>';
  lb.appendChild(act3m);
  window._matchItems=matchItems;

  // ─── SECTION 4: Caso Integrador ───
  var s4=document.createElement('div');
  s4.className='section';
  // pick a randomised business context
  var contexts=es?[
    {biz:'una cadena de farmacias',study:'la empresa encuestó a 400 clientes para estimar la satisfacción de todos sus clientes a nivel nacional'},
    {biz:'una empresa manufacturera',study:'el gerente revisó la producción exacta de las 12 líneas de ensamblaje del mes pasado'},
    {biz:'un banco regional',study:'a partir de 250 cuentas se estimó el saldo promedio de todos los clientes del banco'}
  ]:[
    {biz:'a pharmacy chain',study:'the company surveyed 400 customers to estimate the satisfaction of all its customers nationwide'},
    {biz:'a manufacturing company',study:'the manager reviewed the exact production of the company\'s 12 assembly lines last month'},
    {biz:'a regional bank',study:'from 250 accounts, the average balance of all bank customers was estimated'}
  ];
  var ctx=contexts[Math.floor(rng()*contexts.length)];
  s4.innerHTML=
    '<div class="stag">'+(es?'Concepto 4 de 4':'Concept 4 of 4')+'</div>'+
    '<h2>'+(es?'Conectando todo':'Connecting everything')+'</h2>'+
    '<p>'+(es?
      'En la práctica, siempre encontrarás los tres conceptos juntos: el tipo de estudio (descriptivo o inferencial), el tipo de variable, y el nivel de medición. Juntos determinan qué análisis es posible y válido.':
      'In practice, you will always find the three concepts together: the type of study (descriptive or inferential), the type of variable, and the level of measurement. Together they determine what analysis is possible and valid.')+'</p>'+
    '<div class="callout">'+
      '<strong>'+(es?'Regla de oro:':'Golden rule:')+'</strong>'+
      '<p>'+(es?
        ' Identifica primero el tipo de estudio → luego las variables involucradas → luego su nivel de medición. Ese orden te dice qué fórmulas y gráficas puedes usar.':
        ' First identify the type of study → then the variables involved → then their level of measurement. That order tells you which formulas and charts you can use.')+'</p>'+
    '</div>';
  lb.appendChild(s4);

  // ─── ACTIVITY 4: Caso Integrador ───
  var act4=document.createElement('div');
  act4.className='section';
  act4.id='act4';
  act4.innerHTML=
    '<div class="stag">'+(es?'Actividad 4 de 4':'Activity 4 of 4')+'</div>'+
    '<h2>'+(es?'Caso integrador':'Integrative case')+'</h2>'+
    '<p>'+(es?
      'Lee el siguiente caso y responde las tres preguntas. Al terminar cada una, presiona "Ver respuesta" para comparar.':
      'Read the following case and answer the three questions. After each one, press "See answer" to compare.')+'</p>'+
    '<div class="case-box">'+
      '<div class="case-q"><strong>'+(es?'Caso:':'Case:')+'</strong> '+
        (es?'En '+ctx.biz+', '+ctx.study+'. Entre los datos recolectados hay: <strong>región de la sucursal</strong>, <strong>número de visitas del cliente al mes</strong>, e <strong>ingresos anuales del cliente</strong>.':
            'At '+ctx.biz+', '+ctx.study+'. Among the collected data: <strong>branch region</strong>, <strong>number of customer visits per month</strong>, and <strong>annual customer income</strong>.')+
      '</div>'+
    '</div>'+

    // Q1
    '<div class="case-box">'+
      '<div class="case-q"><strong>1. </strong>'+(es?'¿Este estudio es descriptivo o inferencial? ¿Por qué?':'Is this study descriptive or inferential? Why?')+'</div>'+
      '<textarea class="case-input" id="ci1" rows="2" placeholder="'+(es?'Escribe tu respuesta...':'Write your answer...')+'"></textarea>'+
      '<button class="case-reveal" onclick="reveal(\'ca1\')">'+(es?'Ver respuesta':'See answer')+'</button>'+
      '<div class="case-answer" id="ca1">'+
        (es?
          '<strong>'+( ctx.study.includes('estimó')||ctx.study.includes('estimated')||ctx.study.includes('encuestó')||ctx.study.includes('surveyed') ? 'Inferencial.' : 'Descriptivo.' )+'</strong> '+
          ( ctx.study.includes('encuestó')||ctx.study.includes('surveyed') ?
            'Se usó una muestra (400 clientes) para concluir algo sobre <em>todos</em> los clientes a nivel nacional. El resultado va más allá del grupo observado.' :
            ctx.study.includes('estimó') || ctx.study.includes('estimated') ?
            'Se usó una muestra (250 cuentas) para estimar algo sobre <em>todos</em> los clientes del banco. El resultado va más allá del grupo observado.' :
            'Se observaron las 12 líneas completas, sin extrapolar a ninguna población mayor. El resultado describe exactamente el grupo medido.' ) :
          '<strong>'+( ctx.study.includes('estimated')||ctx.study.includes('surveyed') ? 'Inferential.' : 'Descriptive.' )+'</strong> '+
          ( ctx.study.includes('surveyed') ?
            'A sample (400 customers) was used to conclude something about <em>all</em> customers nationwide. The result goes beyond the observed group.' :
            ctx.study.includes('estimated') ?
            'A sample (250 accounts) was used to estimate something about <em>all</em> bank customers. The result goes beyond the observed group.' :
            'All 12 lines were observed without extrapolating to a larger population. The result describes exactly the group measured.' ))+
      '</div>'+
    '</div>'+

    // Q2
    '<div class="case-box">'+
      '<div class="case-q"><strong>2. </strong>'+(es?'Clasifica las tres variables (cualitativa, cuantitativa discreta, cuantitativa continua):':'Classify the three variables (qualitative, quantitative discrete, quantitative continuous):')+'</div>'+
      '<textarea class="case-input" id="ci2" rows="3" placeholder="'+(es?'Escribe tu clasificación...':'Write your classification...')+'"></textarea>'+
      '<button class="case-reveal" onclick="reveal(\'ca2\')">'+(es?'Ver respuesta':'See answer')+'</button>'+
      '<div class="case-answer" id="ca2">'+
        '<strong>'+(es?'Región de la sucursal':'Branch region')+'</strong> → '+(es?'Cualitativa':'Qualitative')+' ('+( es?'es una categoría sin valor numérico':'it is a category with no numerical value')+').<br>'+
        '<strong>'+(es?'Número de visitas al mes':'Visits per month')+'</strong> → '+(es?'Cuantitativa discreta':'Quantitative discrete')+' ('+( es?'es un conteo entero; no puede ser 3.7 visitas':'it is a whole number count; cannot be 3.7 visits')+').<br>'+
        '<strong>'+(es?'Ingresos anuales':'Annual income')+'</strong> → '+(es?'Cuantitativa continua':'Quantitative continuous')+' ('+( es?'puede tomar cualquier valor decimal; ej: $42,318.50':'can take any decimal value; ex: $42,318.50')+').'+
      '</div>'+
    '</div>'+

    // Q3
    '<div class="case-box">'+
      '<div class="case-q"><strong>3. </strong>'+(es?'¿Cuál es el nivel de medición de los ingresos anuales? ¿Por qué no es Intervalo?':'What is the level of measurement of annual income? Why is it not Interval?')+'</div>'+
      '<textarea class="case-input" id="ci3" rows="2" placeholder="'+(es?'Escribe tu respuesta...':'Write your answer...')+'"></textarea>'+
      '<button class="case-reveal" onclick="reveal(\'ca3\')">'+(es?'Ver respuesta':'See answer')+'</button>'+
      '<div class="case-answer" id="ca3">'+
        '<strong>'+(es?'Razón.':'Ratio.')+'</strong> '+(es?
          '$0 de ingresos significa ausencia real de ingresos (cero absoluto verdadero). Por eso se puede decir que alguien gana "el doble" que otro. En Intervalo (como temperatura °C) el cero no significa ausencia total, y esa operación no tendría sentido.':
          '$0 in income means a true absence of income (true absolute zero). That is why you can say someone earns "twice as much" as another. In Interval (like °C temperature) zero does not mean total absence, and that operation would not make sense.')+
      '</div>'+
    '</div>';
  lb.appendChild(act4);

  // Mark act4 as done when any reveal is clicked (it's reflective, not scored)
  // Score tracked separately
}

// ═══════════════════════════════════════════════════
// ACTIVITY 1 CHECK
// ═══════════════════════════════════════════════════
function checkDD1(){
  var scenarios=window._sc1;
  var binD=document.getElementById('bin1-D');
  var binI=document.getElementById('bin1-I');
  var correct=0; var total=0;
  var placed={};
  binD.querySelectorAll('.dd-chip').forEach(function(chip){
    var idx=parseInt(chip.dataset.idx);
    placed[idx]='D'; total++;
    var ok=scenarios[idx].ans==='D';
    chip.classList.add(ok?'ok-chip':'bad-chip');
    if(ok) correct++;
  });
  binI.querySelectorAll('.dd-chip').forEach(function(chip){
    var idx=parseInt(chip.dataset.idx);
    placed[idx]='I'; total++;
    var ok=scenarios[idx].ans==='I';
    chip.classList.add(ok?'ok-chip':'bad-chip');
    if(ok) correct++;
  });
  var fb=document.getElementById('fb1');
  var es=LANG==='es';
  if(total<scenarios.length){
    fb.className='dd-fb show part';
    fb.textContent=es?'⚠ Coloca todas las fichas antes de verificar.':'⚠ Place all chips before checking.';
    return;
  }
  if(correct===total){
    fb.className='dd-fb show ok';
    fb.textContent=es?'✓ ¡Perfecto! Todos los escenarios están clasificados correctamente.':'✓ Perfect! All scenarios are correctly classified.';
  } else {
    fb.className='dd-fb show bad';
    fb.textContent=(es?'Obtuviste '+correct+' de '+total+' correctos. Las fichas en rojo están mal clasificadas.':'You got '+correct+' out of '+total+' correct. The red chips are misclassified.');
  }
  activityScores.dd1=correct/total;
  updateProgress();
  document.querySelectorAll('#bin1-D .dd-chip, #bin1-I .dd-chip').forEach(function(c){c.style.pointerEvents='none'; c.style.cursor='default';});
  document.querySelector('#act1 .dd-check').disabled=true;
}
function resetDD1(){
  var pool=document.getElementById('pool1');
  ['bin1-D','bin1-I'].forEach(function(id){
    document.getElementById(id).querySelectorAll('.dd-chip').forEach(function(c){
      c.classList.remove('ok-chip','bad-chip','in-bin');
      c.style.opacity='1'; c.style.pointerEvents=''; c.style.outline='';
      pool.appendChild(c);
    });
  });
  var fb=document.getElementById('fb1'); fb.className='dd-fb';
  var btn=document.querySelector('#act1 .dd-check'); if(btn) btn.disabled=false;
  activityScores.dd1=null; updateProgress();
}

// ═══════════════════════════════════════════════════
// ACTIVITY 2 CHECK (tipos de variables)
// ═══════════════════════════════════════════════════
function checkDD2(){
  var items=window._var2;
  var bins={cual:document.getElementById('bin2-cual'),disc:document.getElementById('bin2-disc'),cont:document.getElementById('bin2-cont')};
  var correct=0; var total=0;
  ['cual','disc','cont'].forEach(function(binKey){
    var bin=bins[binKey];
    bin.querySelectorAll('.dd-chip').forEach(function(chip){
      var idx=parseInt(chip.dataset.idx2);
      total++;
      var ok=items[idx].ans===binKey;
      chip.classList.add(ok?'ok-chip':'bad-chip');
      if(ok) correct++;
    });
  });
  var fb=document.getElementById('fb2');
  var es=LANG==='es';
  if(total<items.length){
    fb.className='dd-fb show part';
    fb.textContent=es?'⚠ Coloca todas las fichas antes de verificar.':'⚠ Place all chips before checking.';
    return;
  }
  if(correct===total){
    fb.className='dd-fb show ok';
    fb.textContent=es?'✓ ¡Perfecto! Todas las variables están en el grupo correcto.':'✓ Perfect! All variables are in the correct group.';
  } else {
    fb.className='dd-fb show bad';
    fb.textContent=(es?'Obtuviste '+correct+' de '+total+' correctos. Las fichas en rojo están en el grupo equivocado.':'You got '+correct+' out of '+total+' correct. Red chips are in the wrong group.');
  }
  activityScores.dd2=correct/total;
  updateProgress();
  ['cual','disc','cont'].forEach(function(k){
    document.getElementById('bin2-'+k).querySelectorAll('.dd-chip').forEach(function(c){c.style.pointerEvents='none'; c.style.cursor='default';});
  });
  document.querySelector('#act2 .dd-check').disabled=true;
}
function resetDD2(){
  var pool=document.getElementById('pool2');
  ['cual','disc','cont'].forEach(function(k){
    document.getElementById('bin2-'+k).querySelectorAll('.dd-chip').forEach(function(c){
      c.classList.remove('ok-chip','bad-chip','in-bin');
      c.style.opacity='1'; c.style.pointerEvents=''; c.style.outline='';
      pool.appendChild(c);
    });
  });
  var fb=document.getElementById('fb2'); fb.className='dd-fb';
  var btn=document.querySelector('#act2 .dd-check'); if(btn) btn.disabled=false;
  activityScores.dd2=null; updateProgress();
}


// ═══════════════════════════════════════════════════
// ACTIVITY 3 CHECK (levels of measurement)
// ═══════════════════════════════════════════════════
function checkMatch(){
  var items=window._matchItems;
  var correct=0;
  var es=LANG==='es';
  items.forEach(function(item,i){
    var sel=document.getElementById('ms'+i);
    var row=document.getElementById('mr'+i);
    var icon=document.getElementById('mi'+i);
    var val=sel.value;
    if(!val){ row.className='match-row'; icon.textContent=''; return; }
    sel.disabled=true;
    var ok=val===item.ans;
    if(ok){ correct++; row.className='match-row ok'; icon.textContent='✓'; }
    else { row.className='match-row bad'; icon.textContent='✗'; }
  });
  var total=items.length;
  var fb=document.getElementById('fb3');
  if(correct===total){
    fb.className='dd-fb show ok';
    fb.textContent=es?'✓ ¡Excelente! Todas las variables están correctamente clasificadas.':'✓ Excellent! All variables are correctly classified.';
  } else {
    fb.className='dd-fb show bad';
    fb.textContent=(es?'Obtuviste '+correct+' de '+total+' correctos. Las filas en rojo tienen el nivel incorrecto.':'You got '+correct+' out of '+total+' correct. Red rows have the wrong level.');
  }
  activityScores.match1=correct/total;
  updateProgress();
  document.querySelector('#act3 .dd-check').disabled=true;
}
function resetMatch(){
  var items=window._matchItems;
  items.forEach(function(item,i){
    var sel=document.getElementById('ms'+i);
    var row=document.getElementById('mr'+i);
    var icon=document.getElementById('mi'+i);
    sel.value=''; sel.disabled=false;
    row.className='match-row'; icon.textContent='';
  });
  var fb=document.getElementById('fb3'); fb.className='dd-fb';
  var btn=document.querySelector('#act3 .dd-check'); if(btn) btn.disabled=false;
  activityScores.match1=null; updateProgress();
}

// ═══════════════════════════════════════════════════
// ACTIVITY 3 REVEAL
// ═══════════════════════════════════════════════════
var revealed=0;
function reveal(id){
  var el=document.getElementById(id);
  el.classList.add('show');
  revealed++;
  if(revealed>=3 && activityScores.case1===null){
    activityScores.case1=1;
    updateProgress();
  }
}

// ═══════════════════════════════════════════════════
// PDF
// ═══════════════════════════════════════════════════
function generatePDF(){
  var btn=document.getElementById('dlBtn');
  var es=LANG==='es';
  btn.textContent=es?'Generando PDF...':'Generating PDF...';
  btn.disabled=true;
  setTimeout(function(){
    var jspdf=window.jspdf;
    var doc=new jspdf.jsPDF({orientation:'portrait',unit:'mm',format:'letter'});
    var PW=215.9,M=18,TW=PW-M*2,y=20;
    var pBR=45,pBG=124,pBB=63;
    // header
    doc.setFillColor(pBR,pBG,pBB); doc.rect(0,0,PW,16,'F');
    doc.setTextColor(255,255,255); doc.setFontSize(11); doc.setFont('helvetica','bold');
    doc.text((es?'Introducción a la Estadística · Semana 1':'Introduction to Statistics · Week 1'),M,11);
    y=24;
    doc.setTextColor(20,24,32); doc.setFontSize(9); doc.setFont('helvetica','normal');
    doc.text((es?'Alumno: ':'Student: ')+studentName+'   '+( es?'Grupo: ':'Group: ')+studentGroup,M,y); y+=6;
    doc.text(new Date().toLocaleDateString(es?'es-MX':'en-US'),M,y); y+=10;
    // scores
    var s1=activityScores.dd1!==null?Math.round(activityScores.dd1*6)+'/6':'-';
    var s2=activityScores.dd2!==null?Math.round(activityScores.dd2*8)+'/8':'-';
    var s3=activityScores.match1!==null?Math.round(activityScores.match1*6)+'/6':'-';
    var s4=activityScores.case1!==null?'3/3':'-';
    doc.setFillColor(237,245,235); doc.roundedRect(M,y,TW,22,3,3,'F');
    doc.setTextColor(pBR,pBG,pBB); doc.setFontSize(8); doc.setFont('helvetica','bold');
    doc.text(es?'RESULTADOS POR ACTIVIDAD':'ACTIVITY RESULTS',M+4,y+7);
    doc.setTextColor(20,24,32); doc.setFont('helvetica','normal');
    doc.text((es?'Act 1 – Descriptiva/Inferencial: ':'Act 1 – Descriptive/Inferential: ')+s1,M+4,y+13);
    doc.text((es?'Act 2 – Tipos de variables: ':'Act 2 – Variable types: ')+s2,M+80,y+13);
    doc.text((es?'Act 3 – Niveles de medición: ':'Act 3 – Levels of measurement: ')+s3,M+4,y+19);
    doc.text((es?'Act 4 – Caso integrador: ':'Act 4 – Integrative case: ')+s4,M+80,y+19);
    y+=28;
    doc.setTextColor(130,140,160); doc.setFontSize(7);
    doc.text('Facultad de Economía · Universidad de Colima · liaxa.mx',PW/2,y,{align:'center'});
    doc.save('estadistica_sem1_'+studentName.replace(/\s+/g,'_')+'.pdf');
    btn.textContent=es?'⬇ Descargar resultados en PDF':'⬇ Download results as PDF';
    btn.disabled=false;
  },200);
}
