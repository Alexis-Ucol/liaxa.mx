<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Funciones Exponenciales · Matemáticas Básicas · Facultad de Economía, Universidad de Colima</title>
<link rel="canonical" href="https://liaxa.mx/facultad_economia/matematicas_basicas/mat_exponencial.html">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS ── fallback only; applyBranding() re-injects from SCHOOL ── */
:root {
  --green:      #4a7c3f;
  --green-dark: #2d5a27;
  --green-bg:   #eaf0e7;
  --gold:       #c9a84c;
  --gold-bg:    #faf3e0;
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #6aaa5f;
  --green-dark: #8ecf82;
  --green-bg:   #1a281a;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--green-bg); color:var(--green-dark); border:1.5px solid var(--green); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; }
#restoreBar strong { color:var(--green-dark); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; object-fit:contain; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; min-width:0; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── LANGUAGE TOGGLE ── */
.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }
.dlist { font-family:'IBM Plex Mono',monospace; font-size:.78rem; color:var(--green-dark); background:var(--surface2); border-radius:8px; padding:.6rem .7rem; margin:.6rem 0; word-break:break-word; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); overflow-x:auto; }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── INTERACTIVE WIDGETS ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.iw-head { display:flex; align-items:baseline; gap:.6rem; margin-bottom:.3rem; flex-wrap:wrap; }
.iw-tag { font-size:.62rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; }
.iw-title { font-family:'Crimson Pro',serif; font-size:1.08rem; font-weight:700; }
.iw-sub { font-size:.8rem; color:var(--text2); margin-bottom:.85rem; }
.iw-read { margin-top:.85rem; background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 8px 8px 0; padding:.7rem .85rem; font-size:.82rem; color:var(--text2); }
.iw-read strong { color:var(--green-dark); }
.iw-expr { font-family:'IBM Plex Mono',monospace; font-size:1rem; text-align:center; padding:.75rem .6rem; background:var(--surface2); border-radius:8px; margin:.5rem 0; color:var(--text); word-break:break-word; }
.iw-expr .ec { color:var(--green-dark); font-weight:600; }
.iw-expr .ev { color:var(--gold); font-weight:600; }
.iw-note { font-size:.74rem; color:var(--text3); text-align:center; margin-top:-.2rem; margin-bottom:.5rem; }

/* ── COORDINATE PLANE ── */
.plane { width:100%; background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:.35rem; margin:.55rem 0 .2rem; }
.plane svg { display:block; width:100%; height:auto; }
.plane text { font-family:'IBM Plex Mono',monospace; }
.plegend { display:flex; flex-wrap:wrap; gap:.9rem; justify-content:center; font-size:.72rem; color:var(--text3); margin-bottom:.4rem; }
.plegend span i { display:inline-block; width:14px; height:3px; border-radius:2px; vertical-align:middle; margin-right:.3rem; font-style:normal; }
.lg-in  { background:var(--green); }
.lg-out { background:var(--gold); }
.verdict { text-align:center; font-size:.84rem; font-weight:600; margin-top:.5rem; }
.v-ok  { color:var(--ok); }
.v-bad { color:var(--bad); }

/* ── CHIPS AND TABS ── */
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.3rem .7rem; font-size:.76rem; cursor:pointer; color:var(--text2); transition:all .14s; font-family:inherit; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--gold-bg); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }

/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos { gap: .9rem; }
  .wlogos img { height: 38px; max-width: 42%; }
  .wtitle { font-size: 1.35rem; }
  .stickybar { padding: .5rem .55rem; gap: .38rem; }
  .htitle { display: none; }
  .halexis { display: none; }
  .hsep { display: none; }
  .hlogos { gap: .3rem; }
  .hlogos img { height: 18px; max-width: 60px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 78px; overflow: hidden; text-overflow: ellipsis; }
  .lang-btn { padding: .26rem .48rem; font-size: .68rem; }
  .lbody { padding: 1.2rem .7rem 3rem; max-width: 100%; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .gcrd { padding: .9rem .75rem; }
  .iw-expr { font-size: .86rem; }
  .plegend { gap: .5rem; font-size: .68rem; }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}
</style>
</head>
<body>

<!-- ════════════════════ WELCOME ════════════════════ -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <img id="logo-left"  src="" alt="Facultad de Economía" style="display:none">
      <div class="wlogsep" id="wlogsep"></div>
      <img id="logo-right" src="" alt="Universidad de Colima" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Funciones Exponenciales</div>
    <div class="wcourse" id="wcourse-el">Matemáticas Básicas</div>
    <label class="flabel" for="sName" id="lbl-name-el">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" for="sGroup" id="lbl-group-el">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar" style="background:var(--green-bg); color:var(--green-dark);">
      <strong id="restoreTitle">Sesión guardada encontrada</strong><br>
      <span id="restoreMsg">¿Deseas continuar donde la dejaste?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Retomar sesión</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Empezar de nuevo</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.9rem">
      <svg width="160" height="52" viewBox="0 0 180 52" xmlns="http://www.w3.org/2000/svg">
        <style>
          .lbt { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.1em; fill:var(--green); font-size:28px; }
          .lbl { stroke:var(--gold); stroke-width:2.5; }
          .lba { fill:var(--gold); }
        </style>
        <polyline points="5,40 14,28 24,33 36,14" fill="none" stroke="var(--green)" stroke-width="3"/>
        <circle cx="36" cy="14" r="4.5" class="lba"/>
        <line x1="52" y1="6" x2="52" y2="46" class="lbl"/>
        <text x="64" y="38" class="lbt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- ════════════════════ LESSON ════════════════════ -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <img id="hlogo-left"  src="" alt="Facultad de Economía" style="display:none">
      <img id="hlogo-right" src="" alt="Universidad de Colima" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle" id="htitle-el">Funciones Exponenciales</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg">
        <style>
          .lht { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
          .lhl { stroke:var(--gold); stroke-width:2; }
          .lha { fill:var(--gold); }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" fill="none" stroke="var(--green)" stroke-width="2"/>
        <circle cx="22" cy="10" r="2.5" class="lha"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lhl"/>
        <text x="42" y="22" class="lht">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle">
      <button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button>
      <button class="lang-btn"        id="btn-en" onclick="setLang('en')">EN</button>

/* ════════════════════════════════════════════════════════════════════════
   ATTEMPT COUNTER + SEEDED RNG
   Fresh numbers on every fresh start; a restored session reuses the seed.
   ════════════════════════════════════════════════════════════════════════ */
function getAttemptKey(name, group) {
  return 'fac_econ_mat__mat_exponencial__att__' + (name + '__' + group).replace(/\s+/g, '_');
}
function nextAttempt(name, group) {
  var k = getAttemptKey(name, group), n = 0;
  try { n = parseInt(localStorage.getItem(k) || '0', 10) || 0; } catch(e) {}
  n++;
  try { localStorage.setItem(k, String(n)); } catch(e) {}
  return n;
}
function currentAttempt(name, group) {
  var k = getAttemptKey(name, group);
  try { return parseInt(localStorage.getItem(k) || '1', 10) || 1; } catch(e) { return 1; }
}
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t2 = s ^ (s >>> 16);
    t2 = Math.imul(t2, 0x21f0aaad);
    t2 ^= (t2 >>> 15);
    t2 = Math.imul(t2, 0x735a2d97);
    return ((t2 ^ (t2 >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}
/* Shuffles the four options once and keeps both language versions aligned.
   The key is always the value handed in first. */
function shuffleOpts(rawEs, rawEn, rng) {
  var p = shuffle([0, 1, 2, 3], rng);
  return {
    es: p.map(function(j) { return rawEs[j]; }),
    en: p.map(function(j) { return rawEn[j]; }),
    correctIdx: p.indexOf(0)
  };
}

/* ════════════════════════════════════════════════════════════════════════
   NUMBER AND EXPRESSION HELPERS
   ════════════════════════════════════════════════════════════════════════ */
function nf(x) {
  var neg = x < 0, v = Math.abs(x);
  var s = (Math.round(v * 100) / 100).toString().split('.');
  s[0] = s[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return (neg ? '−' : '') + s.join('.');
}
function nfD(x, d) {
  var neg = x < 0, v = Math.abs(x);
  var s = v.toFixed(d).split('.');
  s[0] = s[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return (neg ? '−' : '') + s.join('.');
}
function money(v)  { var r = Math.round(v); return (r < 0 ? '−$' : '$') + nf(Math.abs(r)); }
function intN(x)   { return nf(Math.round(x)); }
function dec1(x)   { return nfD(x, 1); }
function dec2(x)   { return nfD(x, 2); }
function pctI(x)   { return intN(x) + '%'; }
function pct1(x)   { return nfD(x, 1) + '%'; }
function frac(a, b) {
  return '<span class="mf-outer"><span class="mf-num">' + a + '</span><span class="mf-den">' + b + '</span></span>';
}
/* Smallest whole number of periods for a factor to reach a target. */
function periodsTo(base, target) {
  var n = 1;
  while (Math.pow(base, n) < target && n < 400) n++;
  return n;
}

function lsKey() {
  var n = (studentData.name || '').trim(), g = (studentData.group || '').trim();
  return 'fac_econ_mat__mat_exponencial__' + (n + '__' + g).replace(/\s+/g, '_');
}
function saveSession() {
  if (!studentData.name) return;
  var drawings = [], texts = [], photos = [];
  problems.forEach(function(p, i) {
    var dc = document.getElementById('dc' + i);
    if (dc && dc.width) {
      var blank = document.createElement('canvas');
      blank.width = dc.width; blank.height = dc.height;
      drawings.push(dc.toDataURL() === blank.toDataURL() ? null : dc.toDataURL('image/png'));
    } else { drawings.push(null); }
    var ta = document.getElementById('ta' + i);
    texts.push(ta ? ta.value : '');
    var pp = document.getElementById('pp' + i);
    photos.push((pp && pp.src && pp.src.indexOf('data:') === 0) ? pp.src : null);
  });
  var state = {
    name: studentData.name, group: studentData.group,
    answeredCount: answeredCount, correctCount: correctCount,
    choices: problems.map(function(p) { return p.studentChoice; }),
    drawings: drawings, texts: texts, photos: photos
  };
  try { localStorage.setItem(lsKey(), JSON.stringify(state)); } catch(e) {}
}
function loadSession(name, group) {
  var key = 'fac_econ_mat__mat_exponencial__' + (name + '__' + group).replace(/\s+/g, '_');
  try { var r = localStorage.getItem(key); return r ? JSON.parse(r) : null; } catch(e) { return null; }
}

function checkForSavedSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  if (!name || !group) { document.getElementById('restoreBar').style.display = 'none'; return; }
  var saved = loadSession(name, group);
  var bar = document.getElementById('restoreBar');
  bar.style.display = (saved && saved.choices && saved.choices.some(function(c) { return c !== null; })) ? 'block' : 'none';
}
function observeSections() {
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
}

  document.getElementById('lessonScreen').style.display  = 'block';

}
function restoreSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  var saved = loadSession(name, group);
  if (!saved) return;
  document.getElementById('restoreBar').style.display = 'none';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = currentAttempt(name, group);
  var rng = seededRng(name + group + att);
  buildLesson(rng);
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  observeSections();
  saved.choices.forEach(function(choice, idx) {
    if (choice !== null && choice !== undefined) confirmMC(idx, choice);
  });
  setTimeout(function() {
    if (saved.drawings) saved.drawings.forEach(function(dataUrl, i) {
      if (!dataUrl) return;
      var dc = document.getElementById('dc' + i);
      if (!dc || !dc.width) return;
      var img = new Image();
      img.onload = function() {
        var dpr = window.devicePixelRatio || 1;
        dc.getContext('2d').drawImage(img, 0, 0, dc.width / dpr, dc.height / dpr);
      };
      img.src = dataUrl;
    });
    if (saved.texts) saved.texts.forEach(function(txt, i) {
      if (!txt) return;
      var ta = document.getElementById('ta' + i);
      if (ta) ta.value = txt;
    });
    if (saved.photos) saved.photos.forEach(function(dataUrl, i) {
      if (!dataUrl) return;
      var pp = document.getElementById('pp' + i);
      if (!pp) return;
      pp.src = dataUrl; pp.style.display = 'block';
      var pz = document.getElementById('pz' + i);
      if (pz) pz.style.opacity = '0.4';
    });
  }, 300);
}

/* ════════════════════════════════════════════════════════════════════════
   CANVAS / TABS / PHOTO / HINT / RESULTS

function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#2d5a27';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e) { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e) { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(p[0], p[1]); ctx.stroke(); lx = p[0]; ly = p[1]; }
  function onUp() { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}
function switchTab(idx, panel, btn) {
  var prefix = 'wp_' + idx + '_';
  document.querySelectorAll('[id^="' + prefix + '"]').forEach(function(p) { p.classList.remove('active'); });
  document.getElementById(prefix + panel).classList.add('active');
  btn.closest('.wtabs').querySelectorAll('.wtab').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
}
function handlePhoto(idx, input) {
  if (!input.files || !input.files[0]) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    var img = document.getElementById('pp' + idx);

/* ════════════════════════════════════════════════════════════════════════
   ANSWER HANDLER · two taps to confirm
   ════════════════════════════════════════════════════════════════════════ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = '<strong>' + (isOk ? t('fb-correct') : t('fb-wrong')) + '</strong> ' + prob.exp;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (!prob || prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = '<strong>' + (isOk ? t('fb-correct') : t('fb-wrong')) + '</strong> ' + prob.exp;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

      '<div style="margin-top:.7rem">' +
        '<div style="font-family:\'IBM Plex Mono\',monospace;font-size:.65rem;letter-spacing:.1em;color:var(--text3);text-transform:uppercase;margin-bottom:.5rem">' + t('lbl-answer') + '</div>' +
        '<div class="mcopts">' + opts + '</div>' +
        '<div class="mcfb" id="fb' + i + '"></div>' +
      '</div>' +
    '</div>';
  document.getElementById('lessonBody').appendChild(card);
  if (prob.showWork) setTimeout(function() { var c = document.getElementById('dc' + i); if (c) initCanvas(c); }, 80);
}

/* ════════════════════════════════════════════════════════════════════════
   SECTION REGISTRY  (concept text is re-rendered on language switch)
   ════════════════════════════════════════════════════════════════════════ */
function addSection(fn) {
  var d = document.createElement('div');
  d.className = 'section';
  d.innerHTML = fn(LANG);
  document.getElementById('lessonBody').appendChild(d);
  sectionDefs.push({ el: d, fn: fn });
}
function applySectionLang() {
  sectionDefs.forEach(function(s) { s.el.innerHTML = s.fn(LANG); });
}

/* ════════════════════════════════════════════════════════════════════════
   ITEM ASSEMBLY
   Each item keeps both languages in i18n. The student always reads one of
   them: q, opts, hint and exp hold the active language and are the only
   fields the cards and the PDF ever touch.
   The runtime gate dumps questionText, options and explanation for external
   review, so those three carry both versions tagged ES and EN. They are an
   audit surface, never rendered anywhere in the guide.
   ════════════════════════════════════════════════════════════════════════ */
function bothTxt(o) {
  return (o.es === o.en) ? o.es : ('[ES] ' + o.es + '\n[EN] ' + o.en);
}
function bothOpts(o) {
  return o.es.map(function(s, i) {
    return (s === o.en[i]) ? s : ('[ES] ' + s + '   [EN] ' + o.en[i]);
  });
}
function mk(i18n, correctIdx, showWork) {
  return {
    i18n: i18n, correctIdx: correctIdx, showWork: showWork,
    title: i18n.title[LANG],
    q:     i18n.q[LANG],
    hint:  i18n.hint[LANG],
    exp:   i18n.exp[LANG],
    opts:  i18n.opts[LANG].slice(),
    questionText: bothTxt(i18n.q),
    explanation:  bothTxt(i18n.exp),
    options:      bothOpts(i18n.opts)
  };
}
function addItem(i18n, correctIdx, showWork) {
  var d = mk(i18n, correctIdx, showWork);
  problems.push({
    i18n: d.i18n, title: d.title, q: d.q, hint: d.hint, exp: d.exp, opts: d.opts,
    questionText: d.questionText, options: d.options, explanation: d.explanation,
    correctIdx: d.correctIdx, showWork: d.showWork,
    studentChoice: null, pendingChoice: null
  });
  buildOneCard(problems[problems.length - 1], problems.length - 1);
}

/* ════════════════════════════════════════════════════════════════════════
   PLANE PRIMITIVES
   The three tools draw on the same kind of plane, so the axes, the grid and
   the scale always look alike and the student reads one picture, not three.
   Colours come from the CSS tokens, so the plane follows the theme.
   ════════════════════════════════════════════════════════════════════════ */
var SVW = 340, SVH = 232, SVL = 46, SVR = 12, SVT = 14, SVB = 30;
function mapX(x, xmin, xmax) { return SVL + (x - xmin) / (xmax - xmin) * (SVW - SVL - SVR); }
function mapY(y, ymin, ymax) { return (SVH - SVB) - (y - ymin) / (ymax - ymin) * (SVH - SVB - SVT); }
function svgNum(v) { return (Math.round(v * 10) / 10).toString(); }
function svgOpen() {
  return '<svg viewBox="0 0 ' + SVW + ' ' + SVH + '" xmlns="http://www.w3.org/2000/svg" role="img">';
}
function gridSvg(xmin, xmax, ymin, ymax, xlab, ylab, xticks, yticks) {
  var s = '', i, gx, gy;
  for (i = 0; i <= 4; i++) {
    gx = xmin + (xmax - xmin) * i / 4;
    s += '<line x1="' + svgNum(mapX(gx, xmin, xmax)) + '" y1="' + SVT + '" x2="' + svgNum(mapX(gx, xmin, xmax)) + '" y2="' + (SVH - SVB) + '" stroke="var(--border)" stroke-width="0.6"/>';
    gy = ymin + (ymax - ymin) * i / 4;
    s += '<line x1="' + SVL + '" y1="' + svgNum(mapY(gy, ymin, ymax)) + '" x2="' + (SVW - SVR) + '" y2="' + svgNum(mapY(gy, ymin, ymax)) + '" stroke="var(--border)" stroke-width="0.6"/>';
  }
  var y0 = mapY(Math.max(ymin, Math.min(ymax, 0)), ymin, ymax);
  var x0 = mapX(Math.max(xmin, Math.min(xmax, 0)), xmin, xmax);
  s += '<line x1="' + SVL + '" y1="' + svgNum(y0) + '" x2="' + (SVW - SVR) + '" y2="' + svgNum(y0) + '" stroke="var(--text3)" stroke-width="1.3"/>';
  s += '<line x1="' + svgNum(x0) + '" y1="' + SVT + '" x2="' + svgNum(x0) + '" y2="' + (SVH - SVB) + '" stroke="var(--text3)" stroke-width="1.3"/>';
  for (i = 0; i < xticks.length; i++) {
    s += '<text x="' + svgNum(mapX(xticks[i].v, xmin, xmax)) + '" y="' + (SVH - SVB + 12) + '" font-size="8" fill="var(--text3)" text-anchor="middle">' + xticks[i].t + '</text>';
  }
  for (i = 0; i < yticks.length; i++) {
    s += '<text x="' + (SVL - 4) + '" y="' + svgNum(mapY(yticks[i].v, ymin, ymax) + 3) + '" font-size="8" fill="var(--text3)" text-anchor="end">' + yticks[i].t + '</text>';
  }
  s += '<text x="' + (SVW - SVR) + '" y="' + (SVH - 4) + '" font-size="8.5" fill="var(--text2)" text-anchor="end">' + xlab + '</text>';
  s += '<text x="2" y="10" font-size="8.5" fill="var(--text2)" text-anchor="start">' + ylab + '</text>';
  return s;
}
/* Samples a function and clips it at the edges of the box, so the part that
   runs off the top never spills over the axis labels. */
function curveSvg(f, xmin, xmax, ymin, ymax, color, width, dash) {
  var N = 120, run = [], segs = [], i, x, y;
  for (i = 0; i <= N; i++) {
    x = xmin + (xmax - xmin) * i / N;
    y = f(x);
    if (isFinite(y) && y >= ymin && y <= ymax) {
      run.push(svgNum(mapX(x, xmin, xmax)) + ',' + svgNum(mapY(y, ymin, ymax)));
    } else {
      if (run.length > 1) segs.push(run);
      run = [];
    }
  }
  if (run.length > 1) segs.push(run);
  return segs.map(function(p) {
    return '<polyline points="' + p.join(' ') + '" fill="none" stroke="' + color + '" stroke-width="' + width + '"' +
           (dash ? ' stroke-dasharray="' + dash + '"' : '') + '/>';
  }).join('');
}
function dotSvg(x, y, xmin, xmax, ymin, ymax, color, r) {
  if (!(x >= xmin && x <= xmax && y >= ymin && y <= ymax)) return '';
  return '<circle cx="' + svgNum(mapX(x, xmin, xmax)) + '" cy="' + svgNum(mapY(y, ymin, ymax)) +
         '" r="' + r + '" fill="' + color + '"/>';
}
function vlineSvg(x, xmin, xmax, ymin, ymax, color) {
  if (!(x >= xmin && x <= xmax)) return '';
  return '<line x1="' + svgNum(mapX(x, xmin, xmax)) + '" y1="' + SVT +
         '" x2="' + svgNum(mapX(x, xmin, xmax)) + '" y2="' + (SVH - SVB) +
         '" stroke="' + color + '" stroke-width="1" stroke-dasharray="3 3"/>';
}
function roundUpTo(v, step) { return Math.ceil(v / step) * step; }
function kLabel(v) { return intN(v / 1000) + ' k'; }

/* ════════════════════════════════════════════════════════════════════════
   WIDGET 1 · sumar contra multiplicar
   Dos talleres arrancan con la misma facturacion. Uno suma un monto fijo
   cada mes y el otro la multiplica por un factor. El alumno mueve el
   porcentaje y el monto fijo y ve en que mes la curva alcanza a la recta.
   ════════════════════════════════════════════════════════════════════════ */
function widgetSumaMulti(S0, g0, F0) {
  var host = document.createElement('div');
  host.className = 'section';
  document.getElementById('lessonBody').appendChild(host);
  var state = { g: g0, F: F0 };
  var XMIN = 0, XMAX = 24, YMIN = 0;

  function render() {
    var es  = LANG === 'es';
    var set = function(id, html) { var e = host.querySelector(id); if (e) e.innerHTML = html; };
    var b   = 1 + state.g / 100;
    var expAt = function(m) { return S0 * Math.pow(b, m); };
    var linAt = function(m) { return S0 + state.F * m; };
    var k = 1;
    while (k <= 24 && expAt(k) <= linAt(k)) k++;
    var e24 = expAt(24), l24 = linAt(24);
    var YMAX = roundUpTo(Math.max(e24, l24) * 1.08, 100000);
    var xt = [{ v: 0, t: '0' }, { v: 6, t: '6' }, { v: 12, t: '12' }, { v: 18, t: '18' }, { v: 24, t: '24' }];
    var yt = [{ v: 0, t: '0' }, { v: YMAX / 2, t: kLabel(YMAX / 2) }, { v: YMAX, t: kLabel(YMAX) }];
    var inner = gridSvg(XMIN, XMAX, YMIN, YMAX,
      es ? 'meses transcurridos' : 'months elapsed',
      es ? 'facturación, $' : 'invoicing, $', xt, yt);
    inner += curveSvg(linAt, XMIN, XMAX, YMIN, YMAX, 'var(--gold)', '2.4');
    inner += curveSvg(expAt, XMIN, XMAX, YMIN, YMAX, 'var(--green)', '2.4');
    if (k <= 24) {
      inner += vlineSvg(k, XMIN, XMAX, YMIN, YMAX, 'var(--text3)');
      inner += dotSvg(k, expAt(k), XMIN, XMAX, YMIN, YMAX, 'var(--text)', '4');
    }
    set('#w1svg', svgOpen() + inner + '</svg>');

    set('#w1gl', pctI(state.g));
    set('#w1fl', money(state.F));
    set('#w1e24', money(e24));
    set('#w1l24', money(l24));
    set('#w1k', k <= 24 ? (es ? 'mes ' : 'month ') + intN(k) : (es ? 'después del mes 24' : 'after month 24'));
    set('#w1eq',
      '<span class="ec">' + money(S0) + (es ? ' hoy' : ' today') + '</span>' +
      '<span style="color:var(--text3)">' + (es ? ' contra ' : ' against ') + '</span>' +
      '<span class="ev">' + money(state.F) + (es ? ' fijos al mes' : ' fixed a month') + '</span>');

    var vd = host.querySelector('#w1verd');
    if (vd) {
      if (k <= 1) {
        vd.className = 'verdict v-ok';
        vd.textContent = es ? 'El porcentaje va adelante desde el primer mes: el aumento inicial ya supera al monto fijo.'
                            : 'The percentage leads from the first month: its opening increase already beats the fixed amount.';
      } else if (k <= 24) {
        vd.className = 'verdict v-ok';
        vd.textContent = es ? 'La recta va adelante al principio, pero la curva la alcanza en el mes ' + intN(k) + ' y ya no la suelta.'
                            : 'The straight line leads at first, but the curve catches it in month ' + intN(k) + ' and never falls behind again.';
      } else {
        vd.className = 'verdict v-bad';
        vd.textContent = es ? 'A dos años la recta sigue adelante, aunque la distancia entre ambas se cierra mes con mes.'
                            : 'At two years the straight line is still ahead, though the gap closes month after month.';
      }
    }

    set('#w1read', (k <= 24)
      ? (es
        ? '<strong>Lectura de negocio:</strong> los dos talleres arrancan en ' + money(S0) + '. El que suma ' + money(state.F) + ' fijos gana esa misma cantidad todos los meses, sin importar qué tan grande sea ya su facturación, y por eso su gráfica es una recta. El que crece ' + pctI(state.g) + ' gana poco al principio, porque ese porcentaje se aplica sobre una base pequeña, pero cada mes la base es mayor y el aumento también. En el mes ' + intN(k) + ' las dos gráficas se cruzan, y a dos años la diferencia ya es de ' + money(e24) + ' contra ' + money(l24) + '. Baja el porcentaje al mínimo y comprueba algo que vale la pena recordar: el cruce se retrasa, pero nunca desaparece. Cualquier crecimiento porcentual sostenido termina rebasando a cualquier suma fija.'
        : '<strong>Business reading:</strong> both workshops start at ' + money(S0) + '. The one adding a fixed ' + money(state.F) + ' earns that same amount every month, no matter how large its invoicing has already grown, and that is why its graph is a straight line. The one growing ' + pctI(state.g) + ' earns little at first, because the percentage lands on a small base, but each month the base is larger and so is the increase. In month ' + intN(k) + ' the two graphs cross, and at two years the gap already reads ' + money(e24) + ' against ' + money(l24) + '. Drop the percentage to its minimum and check something worth remembering: the crossing is delayed, but it never disappears. Any sustained percentage growth ends up overtaking any fixed sum.')
      : (es
        ? '<strong>Lectura de negocio:</strong> con ' + pctI(state.g) + ' mensual y un contrato de ' + money(state.F) + ' fijos, el cruce todavía no ocurre dentro de los dos años que muestra la gráfica: al mes 24 la recta va en ' + money(l24) + ' y la curva en ' + money(e24) + '. Esto no significa que la suma fija sea mejor, sino que el plazo del análisis es corto para este par de cifras. Sube el porcentaje de uno en uno y observa cómo el cruce entra en el cuadro y se recorre hacia la izquierda. En una decisión real, la pregunta no es cuál crece más rápido en abstracto, sino cuál va adelante en el plazo que le importa al dueño.'
        : '<strong>Business reading:</strong> at ' + pctI(state.g) + ' a month against a fixed ' + money(state.F) + ' contract, the crossing has not happened yet inside the two years the graph shows: at month 24 the line reads ' + money(l24) + ' and the curve ' + money(e24) + '. That does not make the fixed sum the better deal, it means the window of the analysis is short for this pair of figures. Raise the percentage one point at a time and watch the crossing enter the box and travel left. In a real decision the question is not which grows faster in the abstract, but which is ahead over the span the owner actually cares about.'));
  }

  function mount() {
    var es = LANG === 'es';
    host.innerHTML =
      '<div class="gcrd" data-widget="sumar-contra-multiplicar">' +
        '<div class="iw-head"><span class="iw-tag">' + (es ? 'Herramienta' : 'Tool') + '</span>' +
        '<span class="iw-title">' + (es ? 'Sumar un monto fijo o multiplicar por un factor' : 'Adding a fixed amount or multiplying by a factor') + '</span></div>' +
        '<div class="iw-sub">' + (es
          ? 'Dos talleres facturan hoy exactamente lo mismo, ' + money(S0) + '. Uno firmó un contrato que le deja un monto fijo adicional cada mes y el otro crece un porcentaje fijo cada mes. La línea dorada es el del contrato y la verde el del porcentaje. Mueve los dos controles y busca el mes del cruce: verás que la recta manda al principio y que la curva la alcanza tarde o temprano. Intenta después dejar el porcentaje en su valor más bajo y el monto fijo en el más alto, y comprueba si el cruce desaparece o solo se aleja.'
          : 'Two workshops invoice exactly the same today, ' + money(S0) + '. One signed a contract that leaves it a fixed extra amount every month and the other grows by a fixed percentage every month. The golden line is the contract and the green one the percentage. Move both controls and hunt for the month of the crossing: the straight line rules at first and the curve catches it sooner or later. Then try leaving the percentage at its lowest setting and the fixed amount at its highest, and check whether the crossing disappears or merely moves further out.') + '</div>' +
        '<div class="iw-expr" id="w1eq"></div>' +
        '<div class="plegend"><span><i class="lg-in"></i>' + (es ? 'crecimiento porcentual' : 'percentage growth') + '</span><span><i class="lg-out"></i>' + (es ? 'monto fijo mensual' : 'fixed monthly amount') + '</span></div>' +
        '<div class="plane" id="w1svg"></div>' +
        '<div class="verdict" id="w1verd"></div>' +
        '<div class="cgrid"><div class="cg">' +
          '<label>' + (es ? 'Crecimiento mensual' : 'Monthly growth') + ': <span class="cval" id="w1gl"></span></label>' +
          '<input type="range" min="1" max="16" step="1" id="w1g" value="' + state.g + '">' +
        '</div><div class="cg">' +
          '<label>' + (es ? 'Monto fijo que suma el otro taller' : 'Fixed amount the other workshop adds') + ': <span class="cval" id="w1fl"></span></label>' +
          '<input type="range" min="2000" max="40000" step="1000" id="w1f" value="' + state.F + '">' +
        '</div></div>' +
        '<div class="metrics">' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Porcentaje al mes 24' : 'Percentage at month 24') + '</div><div class="mnum cs" id="w1e24"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Monto fijo al mes 24' : 'Fixed amount at month 24') + '</div><div class="mnum ps" id="w1l24"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Cruce de las dos gráficas' : 'Crossing of the two graphs') + '</div><div class="mnum ts" id="w1k"></div></div>' +
        '</div>' +
        '<div class="iw-read" id="w1read"></div>' +
      '</div>';
    var gs = host.querySelector('#w1g'), fs = host.querySelector('#w1f');
    gs.addEventListener('input', function() { state.g = parseInt(gs.value, 10); render(); });
    fs.addEventListener('input', function() { state.F = parseInt(fs.value, 10); render(); });
    render();
  }
  widgets.push(mount);
  mount();
}

/* ════════════════════════════════════════════════════════════════════════
   WIDGET 2 · la capitalizacion decide lo que rinde una tasa
   La misma tasa nominal produce montos distintos segun cuantas veces al
   anio se capitalice. El alumno mueve la tasa y el numero de periodos y
   compara el interes compuesto con el interes simple sobre el mismo plazo.
   ════════════════════════════════════════════════════════════════════════ */
function widgetCapitaliza(C, j0, mIdx0) {
  var host = document.createElement('div');
  host.className = 'section';
  document.getElementById('lessonBody').appendChild(host);
  var MLIST = [1, 2, 3, 4, 6, 12];
  var state = { j: j0, mi: mIdx0 };
  var XMIN = 0, XMAX = 10, YMIN = 0;

  function render() {
    var es  = LANG === 'es';
    var set = function(id, html) { var e = host.querySelector(id); if (e) e.innerHTML = html; };
    var m   = MLIST[state.mi];
    var i   = state.j / 100;
    var per = 1 + i / m;
    var comp = function(x) { return C * Math.pow(per, m * x); };
    var simp = function(x) { return C * (1 + i * x); };
    var eff  = (Math.pow(per, m) - 1) * 100;
    var M10  = comp(10), S10 = simp(10);
    var YMAX = roundUpTo(M10 * 1.08, 100000);
    var xt = [{ v: 0, t: '0' }, { v: 2.5, t: '2.5' }, { v: 5, t: '5' }, { v: 7.5, t: '7.5' }, { v: 10, t: '10' }];
    var yt = [{ v: 0, t: '0' }, { v: YMAX / 2, t: kLabel(YMAX / 2) }, { v: YMAX, t: kLabel(YMAX) }];
    var inner = gridSvg(XMIN, XMAX, YMIN, YMAX,
      es ? 'años en la cuenta' : 'years in the account',
      es ? 'saldo, $' : 'balance, $', xt, yt);
    inner += curveSvg(simp, XMIN, XMAX, YMIN, YMAX, 'var(--gold)', '2.4');
    inner += curveSvg(comp, XMIN, XMAX, YMIN, YMAX, 'var(--green)', '2.4');
    inner += dotSvg(10, M10, XMIN, XMAX, YMIN, YMAX, 'var(--text)', '4');
    set('#w2svg', svgOpen() + inner + '</svg>');

    set('#w2jl', pctI(state.j));
    set('#w2ml', intN(m) + (es ? (m === 1 ? ' vez al año' : ' veces al año') : (m === 1 ? ' time a year' : ' times a year')));
    set('#w2eff', pct1(eff));
    set('#w2m10', money(M10));
    set('#w2gap', money(M10 - S10));
    set('#w2eq',
      '<span class="ec">' + pct1(state.j / m) + (es ? ' por periodo' : ' per period') + '</span>' +
      '<span style="color:var(--text3)">' + (es ? ' durante ' : ' over ') + '</span>' +
      '<span class="ev">' + intN(m * 10) + (es ? ' periodos en diez años' : ' periods in ten years') + '</span>');

    var vd = host.querySelector('#w2verd');
    if (vd) {
      if (m === 1) {
        vd.className = 'verdict v-bad';
        vd.textContent = es ? 'Con una sola capitalización al año la tasa efectiva coincide con la nominal: no hay interés sobre interés dentro del año.'
                            : 'With a single capitalisation a year the effective rate matches the nominal one: there is no interest on interest inside the year.';
      } else if (eff - state.j < 0.5) {
        vd.className = 'verdict v-ok';
        vd.textContent = es ? 'La tasa efectiva apenas rebasa a la nominal: con tasas bajas, capitalizar más seguido cambia poco.'
                            : 'The effective rate barely clears the nominal one: at low rates, capitalising more often changes little.';
      } else {
        vd.className = 'verdict v-ok';
        vd.textContent = es ? 'La tasa efectiva quedó ' + pct1(eff - state.j) + ' por encima de la nominal solo por capitalizar más seguido.'
                            : 'The effective rate landed ' + pct1(eff - state.j) + ' above the nominal one purely from capitalising more often.';
      }
    }

    set('#w2read', (es
      ? '<strong>Lectura de negocio:</strong> el taller deposita ' + money(C) + ' a una tasa nominal de ' + pctI(state.j) + ' con ' + intN(m) + (m === 1 ? ' capitalización al año' : ' capitalizaciones al año') + '. Cada periodo paga ' + pct1(state.j / m) + ', y como ese interés se queda en la cuenta, el periodo siguiente lo cobra también. Al cabo de diez años el saldo llega a ' + money(M10) + ', que es ' + money(M10 - S10) + ' más de lo que habría dejado el interés simple de la línea dorada. La tasa que de verdad describe el rendimiento anual es la efectiva, ' + pct1(eff) + ', y no la nominal que aparece en el anuncio. Sube el número de capitalizaciones de uno en uno: la efectiva crece, pero cada salto es más pequeño que el anterior, así que pasar de una a dos capitalizaciones rinde mucho más que pasar de seis a doce.'
      : '<strong>Business reading:</strong> the workshop deposits ' + money(C) + ' at a nominal rate of ' + pctI(state.j) + ' with ' + intN(m) + (m === 1 ? ' capitalisation a year' : ' capitalisations a year') + '. Each period pays ' + pct1(state.j / m) + ', and because that interest stays in the account, the next period earns on it too. After ten years the balance reaches ' + money(M10) + ', which is ' + money(M10 - S10) + ' more than the simple interest of the golden line would have left. The rate that really describes the annual return is the effective one, ' + pct1(eff) + ', not the nominal figure on the advertisement. Raise the number of capitalisations one step at a time: the effective rate climbs, but every jump is smaller than the one before, so moving from one to two capitalisations pays far more than moving from six to twelve.'));
  }

  function mount() {
    var es = LANG === 'es';
    host.innerHTML =
      '<div class="gcrd" data-widget="capitalizacion-y-tasa-efectiva">' +
        '<div class="iw-head"><span class="iw-tag">' + (es ? 'Herramienta' : 'Tool') + '</span>' +
        '<span class="iw-title">' + (es ? 'La misma tasa rinde distinto según se capitalice' : 'The same rate pays differently depending on capitalisation') + '</span></div>' +
        '<div class="iw-sub">' + (es

          : 'The workshop keeps ' + money(C) + ' for ten years. The green line is the balance under compound interest and the golden one what simple interest would leave at the same rate. Hold the rate still and move only the number of capitalisations per year: the nominal rate on the advertisement does not change, but the final balance and the effective rate do. Note how much the effective rate rises going from one to two capitalisations and how much going from six to twelve, then use those two figures to decide whether more frequent capitalisation is worth arguing for.') + '</div>' +

/* ════════════════════════════════════════════════════════════════════════

    set('#w3svg', svgOpen() + inner + '</svg>');

    set('#w3dl', pctI(state.d));

    set('#w3eq',
      '<span class="ec">' + dec2(b) + (es ? ' del valor sobrevive cada año' : ' of the value survives each year') + '</span>' +

                            : 'Declining balance keeps ' + money(vDec - vLin) + ' more than the straight line in this year.';
      } else {

                            : 'In the early years declining balance bites harder: it runs ' + money(vLin - vDec) + ' below the straight line.';
      }
    }

    set('#w3read', (es
      ? '<strong>Lectura de negocio:</strong> la máquina costó ' + money(V0) + ' y pierde ' + pctI(state.d) + ' del valor que le queda cada año, así que sobrevive un factor de ' + dec2(b) + ' anual. Al año ' + intN(state.t) + ' vale ' + money(vDec) + ' por saldo decreciente y ' + money(vLin) + ' por línea recta. Las dos curvas cuentan historias distintas: la recta descuenta siempre la misma cantidad y por eso toca el cero a los ' + dec1(zeroYear) + ' años, mientras que el porcentaje se aplica sobre un valor cada vez menor y la curva se acerca al eje sin alcanzarlo nunca. Sube la pérdida anual al máximo y comprueba que la curva sigue por encima de cero incluso al año 15: por eso una máquina totalmente depreciada en los libros todavía se vende en el mercado de segunda mano.'
      : '<strong>Business reading:</strong> the machine cost ' + money(V0) + ' and loses ' + pctI(state.d) + ' of whatever value it has left each year, so a factor of ' + dec2(b) + ' survives annually. At year ' + intN(state.t) + ' it is worth ' + money(vDec) + ' under declining balance and ' + money(vLin) + ' under the straight line. The two curves tell different stories: the line writes off the same amount every year and therefore touches zero at ' + dec1(zeroYear) + ' years, whereas the percentage applies to an ever smaller value and the curve approaches the axis without ever reaching it. Push the annual loss to its maximum and check that the curve still sits above zero even at year 15: that is why a machine fully written off in the books still fetches a price on the second hand market.'));
  }

  function mount() {
    var es = LANG === 'es';

          : 'A machine worth ' + money(V0) + ' is depreciated in two different ways. The golden line subtracts the same amount every year until nothing is left, and the green curve writes off a percentage of whatever value remains. Move the annual loss and the year you want to inspect, then compare the two dots sitting on the dotted line. Look in particular for the year the golden line touches zero and note how much the machine is still worth on the green curve in that very year: that gap is what an accountant and a buyer of used machinery argue about.') + '</div>' +
        '<div class="iw-expr" id="w3eq"></div>' +
        '<div class="plegend"><span><i class="lg-in"></i>' + (es ? 'saldo decreciente' : 'declining balance') + '</span><span><i class="lg-out"></i>' + (es ? 'línea recta' : 'straight line') + '</span></div>' +
        '<div class="plane" id="w3svg"></div>' +
        '<div class="verdict" id="w3verd"></div>' +
        '<div class="cgrid"><div class="cg">' +
          '<label>' + (es ? 'Pérdida anual de valor' : 'Annual loss of value') + ': <span class="cval" id="w3dl"></span></label>' +
          '<input type="range" min="5" max="40" step="5" id="w3d" value="' + state.d + '">' +
        '</div><div class="cg">' +
          '<label>' + (es ? 'Año que se consulta' : 'Year being inspected') + ': <span class="cval" id="w3tl"></span></label>' +
          '<input type="range" min="1" max="15" step="1" id="w3t" value="' + state.t + '">' +
        '</div></div>' +
        '<div class="metrics">' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Valor por saldo decreciente' : 'Value under declining balance') + '</div><div class="mnum cs" id="w3dec"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Valor por línea recta' : 'Value under straight line') + '</div><div class="mnum ps" id="w3lin"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'La línea recta llega a cero en' : 'The straight line hits zero at') + '</div><div class="mnum ts" id="w3zero"></div></div>' +
        '</div>' +
        '<div class="iw-read" id="w3read"></div>' +
      '</div>';
    var ds = host.querySelector('#w3d'), ts = host.querySelector('#w3t');
    ds.addEventListener('input', function() { state.d = parseInt(ds.value, 10); render(); });
    ts.addEventListener('input', function() { state.t = parseInt(ts.value, 10); render(); });
    render();
  }
  widgets.push(mount);
  mount();
}

/* ════════════════════════════════════════════════════════════════════════
   BUILD LESSON · concepto, herramienta, reactivos, y otra vez
   Todos los numeros salen del rng sembrado, de modo que dos alumnos nunca
   comparten una sola cifra y un mismo alumno nunca repite un intento.
   La guia entera sigue a un negocio: Muebles El Chanal, un taller de
   carpinteria de Colima que surte comedores y cabeceras a hoteles de
   Manzanillo y que acaba de abrir una tienda en linea.
   ════════════════════════════════════════════════════════════════════════ */
function buildLesson(rng) {
  problems = []; sectionDefs = []; widgets = [];
  document.getElementById('lessonBody').innerHTML = '';

  /* ── Concepto 1 · sumar contra multiplicar ── */
  var c1S = pick([120000, 150000, 180000], rng);
  var c1g = pick([6, 8, 10], rng);
  var c1F = c1S * c1g / 100 + pick([3000, 5000], rng);
  var c1b = 1 + c1g / 100;
  var c1m1 = c1S * c1b, c1m2 = c1S * c1b * c1b, c1m3 = c1S * Math.pow(c1b, 3);
  var c1i1 = c1m1 - c1S, c1i2 = c1m2 - c1m1, c1i3 = c1m3 - c1m2;
  var c1L1 = c1S + c1F, c1L3 = c1S + 3 * c1F;
  var c1k = 1;
  while (c1k <= 60 && c1S * Math.pow(c1b, c1k) <= c1S + c1F * c1k) c1k++;
  var c1ek = c1S * Math.pow(c1b, c1k), c1lk = c1S + c1F * c1k;
  var c1e24 = c1S * Math.pow(c1b, 24), c1l24 = c1S + c1F * 24;

  var w1S = pick([120000, 140000, 160000], rng);
  var w1g = pick([4, 6, 8], rng);
  var w1F = pick([12000, 16000, 20000], rng);

  /* ── Reactivo 1 · el contrato fijo contra el porcentaje ── */
  var p1S = pick([120000, 150000, 180000], rng);
  var p1g = pick([6, 8, 10], rng);
  var p1F = p1S * p1g / 100 + pick([3000, 5000], rng);
  var p1b = 1 + p1g / 100;
  var p1inc1 = p1S * p1g / 100;
  var p1k = 1;
  while (p1k <= 60 && p1S * Math.pow(p1b, p1k) <= p1S + p1F * p1k) p1k++;
  var p1ek = p1S * Math.pow(p1b, p1k), p1lk = p1S + p1F * p1k;
  var p1e24 = p1S * Math.pow(p1b, 24), p1l24 = p1S + p1F * 24;

  /* ── Reactivo 2 · la facturacion dentro de varios meses ── */
  var p2S = pick([140000, 160000, 180000], rng);
  var p2g = pick([4, 6, 8], rng);
  var p2n = pick([6, 8, 10], rng);
  var p2b = 1 + p2g / 100;
  var p2c  = p2S * Math.pow(p2b, p2n);
  var p2D1 = p2S * (1 + p2g * p2n / 100);
  var p2D2 = p2S * Math.pow(p2b, p2n - 1);
  var p2D3 = p2S * p2b * (Math.pow(p2b, p2n) - 1) / (p2b - 1);

  /* ── Concepto 2 · interes compuesto ── */
  var c2C = pick([200000, 250000, 300000], rng);
  var c2j = pick([9, 12, 15], rng);
  var c2t = pick([3, 4, 5], rng);
  var c2per = 1 + c2j / 1200;
  var c2M   = c2C * Math.pow(c2per, 12 * c2t);
  var c2S   = c2C * (1 + c2j * c2t / 100);
  var c2eff = (Math.pow(c2per, 12) - 1) * 100;
  var c2y1  = c2C * Math.pow(c2per, 12);
  var c2gap = c2M - c2S;

  var w2C  = pick([180000, 240000, 300000], rng);
  var w2j  = pick([8, 12, 16], rng);
  var w2mi = pick([1, 3, 5], rng);

  /* ── Reactivo 3 · el ahorro para la sierra ── */
  var p3C = pick([200000, 250000, 300000], rng);
  var p3j = pick([9, 12, 15], rng);
  var p3t = pick([3, 4, 5], rng);
  var p3c  = p3C * Math.pow(1 + p3j / 1200, 12 * p3t);
  var p3D1 = p3C * (1 + p3j * p3t / 100);
  var p3D2 = p3C * Math.pow(1 + p3j / 100, p3t);
  var p3D3 = p3C * Math.pow(1 + p3j / 1200, p3t);

  /* ── Reactivo 4 · simple contra compuesto ── */
  var p4C = pick([150000, 200000, 250000], rng);
  var p4i = pick([10, 12, 15], rng);
  var p4t = pick([4, 5, 6], rng);
  var p4comp = p4C * Math.pow(1 + p4i / 100, p4t);
  var p4simp = p4C * (1 + p4i * p4t / 100);
  var p4diff = p4comp - p4simp;
  var p4y1   = p4C * p4i / 100;
  var p4y2   = p4C * (1 + p4i / 100) * p4i / 100;

  /* ═══════════════════════ CONCEPTO 1 ═══════════════════════ */
  addSection(function(L) {
    if (L === 'es') return '' +
      '<div class="stag">Concepto 1</div>' +
      '<h2>Sumar o multiplicar: por qué una exponencial no se parece a una recta</h2>' +
      '<p>Muebles El Chanal es un taller de carpintería de Colima que surte comedores y cabeceras a hoteles de Manzanillo. Este año abrió una tienda en línea y su facturación mensual dejó de moverse como antes. Antes crecía a saltos parejos, cuando entraba un pedido nuevo. Ahora crece un porcentaje más o menos constante cada mes, porque cada cliente satisfecho recomienda el taller a otro. Ese cambio de forma es exactamente la diferencia entre una función lineal y una <strong>función exponencial</strong>.</p>' +
      '<p>Una cantidad crece de forma lineal cuando en cada periodo se le <strong>suma</strong> siempre el mismo monto. Crece de forma exponencial cuando en cada periodo se <strong>multiplica</strong> siempre por el mismo factor. Escrita en su forma general, una función exponencial es f(x) = a · b^x, donde a es el valor con el que arranca la cuenta, es decir el valor cuando x vale cero, y b es la <strong>base</strong>, el factor por el que se multiplica en cada periodo. Para que la expresión tenga sentido se pide que a sea distinto de cero y que b sea positivo y distinto de uno.</p>' +
      '<p>Cuando una cantidad crece a una tasa de r por ciento por periodo, la base es b = 1 + r, con r escrito en decimales. Un crecimiento del 8% mensual da una base de 1.08, y multiplicar por 1.08 equivale a conservar el 100% que ya se tenía y agregarle el 8% nuevo. Si la base es mayor que uno la cantidad crece; si queda entre cero y uno la cantidad se encoge; si vale exactamente uno la cantidad no se mueve.</p>' +
      '<p>La consecuencia práctica es la que sorprende. En una recta el aumento es siempre el mismo número de pesos, mes tras mes. En una exponencial lo que se mantiene fijo es el porcentaje, no el monto, y como cada mes ese porcentaje se calcula sobre una base mayor, el aumento en pesos crece por sí solo. Por eso una exponencial siempre termina rebasando a cualquier recta, por pequeño que sea el porcentaje y por grande que sea la suma fija. La única pregunta que queda abierta es cuándo, y esa pregunta sí depende de los números del caso.</p>' +
      '<div class="rules-grid">' +
        '<div class="rcard"><div class="rname">Forma general</div><div class="rform">f(x) = a · b^x</div><div class="rnote">a es el valor inicial y b la base.</div></div>' +
        '<div class="rcard"><div class="rname">Base de crecimiento</div><div class="rform">b = 1 + r</div><div class="rnote">Con r la tasa del periodo en decimales.</div></div>' +
        '<div class="rcard"><div class="rname">Recta</div><div class="rform">suma constante</div><div class="rnote">El aumento en pesos no cambia nunca.</div></div>' +
        '<div class="rcard"><div class="rname">Exponencial</div><div class="rform">factor constante</div><div class="rnote">El aumento en pesos crece cada periodo.</div></div>' +
      '</div>' +
      '<p><strong>Ejemplo resuelto.</strong> Muebles El Chanal facturó ' + money(c1S) + ' este mes y su facturación crece ' + pctI(c1g) + ' cada mes. Un taller vecino facturó lo mismo y tiene un contrato con un hotel que le suma ' + money(c1F) + ' fijos cada mes. El dueño quiere saber cuál de los dos irá adelante.</p>' +
      '<div class="callout"><p><strong>Paso 1.</strong> El primer mes Muebles El Chanal sube a ' + money(c1m1) + ', un aumento de ' + money(c1i1) + ', mientras que el vecino llega a ' + money(c1L1) + ' con su aumento de ' + money(c1F) + '. El contrato va adelante.<br>' +
      '<strong>Paso 2.</strong> El segundo mes el porcentaje se calcula sobre ' + money(c1m1) + ' y ya no sobre ' + money(c1S) + ', así que el aumento sube a ' + money(c1i2) + '. El del vecino sigue siendo ' + money(c1F) + '.<br>' +
      '<strong>Paso 3.</strong> Al tercer mes el aumento del taller llega a ' + money(c1i3) + ' y la facturación a ' + money(c1m3) + ', contra ' + money(c1L3) + ' del vecino. La distancia se cierra sin que nadie cambie de estrategia.<br>' +
      '<strong>Paso 4.</strong> El cruce ocurre en el mes ' + intN(c1k) + ': ahí Muebles El Chanal alcanza ' + money(c1ek) + ' frente a ' + money(c1lk) + '.<br>' +
      '<strong>Lectura.</strong> A dos años la comparación ya no está cerrada: ' + money(c1e24) + ' contra ' + money(c1l24) + '. El contrato fijo daba tranquilidad al principio y el porcentaje da terreno al final.</p></div>';
    return '' +
      '<div class="stag">Concept 1</div>' +
      '<h2>Adding or multiplying: why an exponential looks nothing like a line</h2>' +
      '<p>Muebles El Chanal is a furniture workshop in Colima that supplies dining sets and headboards to hotels in Manzanillo. This year it opened an online shop and its monthly invoicing stopped moving the way it used to. It used to climb in even jumps, whenever a new order came in. Now it climbs by a roughly constant percentage every month, because every satisfied client recommends the workshop to another. That change of shape is exactly the difference between a linear function and an <strong>exponential function</strong>.</p>' +
      '<p>A quantity grows linearly when the same amount is <strong>added</strong> to it in every period. It grows exponentially when it is <strong>multiplied</strong> by the same factor in every period. Written in its general form, an exponential function is f(x) = a · b^x, where a is the value the count starts from, that is the value when x equals zero, and b is the <strong>base</strong>, the factor it is multiplied by in each period. For the expression to make sense we require a to be different from zero and b to be positive and different from one.</p>' +
      '<p>When a quantity grows at a rate of r per cent per period, the base is b = 1 + r, with r written as a decimal. Growth of 8% a month gives a base of 1.08, and multiplying by 1.08 amounts to keeping the 100% already there and adding the new 8%. If the base is greater than one the quantity grows; if it lands between zero and one the quantity shrinks; if it equals one the quantity does not move at all.</p>' +
      '<p>The practical consequence is the surprising part. On a straight line the increase is always the same number of pesos, month after month. On an exponential what stays fixed is the percentage, not the amount, and since each month that percentage is worked out on a larger base, the increase in pesos grows on its own. That is why an exponential always ends up overtaking any straight line, however small the percentage and however large the fixed sum. The only open question is when, and that one does depend on the figures of the case.</p>' +
      '<div class="rules-grid">' +
        '<div class="rcard"><div class="rname">General form</div><div class="rform">f(x) = a · b^x</div><div class="rnote">a is the starting value and b the base.</div></div>' +

      '<h2>Decrecimiento exponencial: cuando la base queda entre cero y uno</h2>' +
      '<p>No todo lo que se modela con una exponencial crece. Cuando la base b queda entre cero y uno, cada periodo multiplica la cantidad por un número menor que uno y el resultado se encoge. La forma de la función es la misma, f(x) = a · b^x, y solo cambia el tamaño de la base. Si una cantidad pierde d por ciento por periodo, la base es b = 1 − d, otra vez con d en decimales: perder ' + pctI(20) + ' al año significa conservar 0.80 del valor cada año.</p>' +
