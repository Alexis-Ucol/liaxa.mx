<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadenas y Redes Tróficas</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }

/* ── WIDGET CHROME (concept manipulatives) ── */
.iwbox { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; padding:1.1rem; }
.iw-tag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:700; margin-bottom:.35rem; }
.iw-sub { font-size:.86rem; color:var(--text2); margin-bottom:.75rem; }
.rfb { font-size:.84rem; color:var(--text2); min-height:1.35rem; margin-top:.6rem; line-height:1.5; }
.rfb b { color:var(--green-dark); }
.okmsg { color:var(--ok); font-weight:700; }
.badmsg { color:var(--bad); font-weight:600; }
.rverify-btn { min-height:44px; padding:.55rem 1.1rem; border:none; border-radius:8px; background:var(--green); color:#fff; font-size:.85rem; font-weight:600; cursor:pointer; font-family:inherit; margin-top:.6rem; }
.rverify-btn:hover { background:var(--green-dark); }
.rghost-btn { min-height:44px; padding:.55rem 1.1rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text2); font-size:.85rem; font-weight:600; cursor:pointer; font-family:inherit; margin-top:.6rem; margin-left:.4rem; }
.rghost-btn:hover { border-color:var(--green); color:var(--green); }
.wprog { font-family:'IBM Plex Mono',monospace; font-size:.7rem; color:var(--text3); letter-spacing:.08em; text-transform:uppercase; margin-bottom:.45rem; }

/* ── CLASSIFY (trophic level sorter) ── */
.cls-card { background:var(--surface2); border:1.5px solid var(--border); border-radius:10px; padding:.9rem; text-align:center; font-weight:600; font-size:.92rem; margin:.6rem 0; color:var(--text); }
.cls-bins { display:grid; grid-template-columns:1fr 1fr; gap:.5rem; }
.cls-bin { min-height:44px; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.82rem; font-weight:600; cursor:pointer; font-family:inherit; padding:.5rem; }
.cls-bin:hover { border-color:var(--green); color:var(--green); }
.cls-done { font-weight:700; color:var(--ok); text-align:center; padding:.6rem; }

/* ── CHAIN BUILDER ── */
.ch-pool { display:flex; flex-wrap:wrap; gap:.45rem; margin:.5rem 0 .2rem; min-height:46px; }
.ch-chip { min-height:44px; display:flex; align-items:center; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); padding:.4rem .75rem; font-size:.83rem; cursor:pointer; color:var(--text); }
.ch-chip:hover { border-color:var(--green); color:var(--green); }
.ch-slots { display:flex; flex-wrap:wrap; align-items:center; gap:.35rem; margin:.75rem 0 .2rem; }
.ch-slot { min-height:44px; min-width:100px; display:flex; align-items:center; justify-content:center; border:1.5px dashed var(--border); border-radius:8px; background:var(--surface); padding:.4rem .6rem; font-size:.82rem; color:var(--text3); cursor:pointer; text-align:center; }
.ch-slot.full { border-style:solid; border-color:var(--green); color:var(--green-dark); background:var(--green-bg); font-weight:600; }
.ch-slot.bad { border-style:solid; border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.ch-slot.good { border-style:solid; border-color:var(--ok); background:var(--ok-bg); color:var(--ok); font-weight:600; }
.ch-arrow { font-family:'IBM Plex Mono',monospace; color:var(--gold); font-weight:700; font-size:1rem; }

/* ── ENERGY CASCADE ── */
.en-row { display:flex; align-items:center; gap:.6rem; flex-wrap:wrap; margin:.5rem 0; }
.en-lbl { font-size:.78rem; color:var(--text3); min-width:120px; }
.en-slider { flex:1; min-width:140px; accent-color:var(--green); height:44px; }
.en-val { font-family:'IBM Plex Mono',monospace; font-weight:700; color:var(--green); min-width:56px; text-align:right; font-size:.95rem; }
.en-bars { margin-top:.75rem; }
.en-bar { display:flex; align-items:center; gap:.5rem; margin-bottom:.32rem; }
.en-name { font-size:.72rem; color:var(--text3); min-width:112px; }
.en-track { flex:1; background:var(--surface2); border-radius:5px; height:16px; overflow:hidden; min-width:50px; }
.en-fill { height:100%; background:var(--green); border-radius:5px; transition:width .25s; }
.en-fill.top { background:var(--gold); }
.en-num { font-family:'IBM Plex Mono',monospace; font-size:.74rem; min-width:78px; text-align:right; color:var(--text2); }
.en-goal { font-size:.82rem; color:var(--text2); background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.55rem .75rem; margin:.5rem 0; }

/* ── FOOD WEB ── */
.web-svg { width:100%; height:auto; display:block; max-width:100%; }
.web-stats { display:flex; gap:.5rem; flex-wrap:wrap; margin-top:.7rem; }
.web-stat { background:var(--surface2); border-radius:8px; padding:.45rem .7rem; font-size:.76rem; color:var(--text2); }
.web-stat b { font-family:'IBM Plex Mono',monospace; color:var(--green); font-size:.9rem; }

/* ── REFLECT ── */
.reflect-prompt { font-size:.95rem; color:var(--text2); margin:.4rem 0 .85rem; }

/* ── DATA LINE ── */
.dataline { font-family:'IBM Plex Mono',monospace; font-size:.78rem; color:var(--green-dark); background:var(--surface2); border-radius:8px; padding:.55rem .7rem; margin-top:.5rem; overflow-x:auto; }

@media (max-width: 600px) {
  .cls-bins { grid-template-columns:1fr; }
  .en-lbl { min-width:86px; font-size:.72rem; }
  .en-name { min-width:76px; font-size:.66rem; }
  .en-num { min-width:60px; font-size:.68rem; }
  .en-val { min-width:46px; font-size:.86rem; }
  .ch-slot { min-width:80px; font-size:.76rem; }

/* ── Drawing palette, derived from the school's colours (Rule 16) ─────────
   slots 1-2 : school primary + accent
   slots 3-4 : the two of black/red/blue/green least similar to the school colours
   Falls back to neutral defaults if SCHOOL colours can't be parsed.
   ───────────────────────────────────────────────────────────────────── */
var DRAW_PALETTE = (function () {
  function hex2rgb(h) {
    h = String(h).replace('#', '');
    if (h.length === 3) { h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2]; }
    return [parseInt(h.substr(0,2),16), parseInt(h.substr(2,2),16), parseInt(h.substr(4,2),16)];
  }
  function dist(a, b) {
    var dr = a[0]-b[0], dg = a[1]-b[1], db = a[2]-b[2];
    return Math.sqrt(2*dr*dr + 4*dg*dg + 3*db*db);
  }
  var COMMON = ['#1a1a16', '#c0392b', '#1d4e89', '#1a7a3a'];  /* black, red, blue, green */
  var schoolRGB;
  try {
    schoolRGB = [hex2rgb(SCHOOL.primary), hex2rgb(SCHOOL.accent)];
  } catch (e) {
    return [SCHOOL.primary, SCHOOL.accent, '#1a1a16', '#1d4e89'];
  }
  var scored = COMMON.map(function (c, idx) {
    var rgb = hex2rgb(c);
    var nearest = Math.min(dist(rgb, schoolRGB[0]), dist(rgb, schoolRGB[1]));
    return { c: c, idx: idx, d: nearest };
  });
  scored.sort(function (a, b) { return b.d - a.d; });      /* farthest first */
  var keep = scored.slice(0, 2);
  keep.sort(function (a, b) { return a.idx - b.idx; });    /* restore visual order */
  return [SCHOOL.primary, SCHOOL.accent, keep[0].c, keep[1].c];
})();
function drawDotsHTML() {
  return DRAW_PALETTE.map(function (c, i) {
    return '<div class="cdot' + (i === 0 ? ' sel' : '') + '" data-color="' + c +
           '" style="background:' + c + '"></div>';
  }).join('');
}

  var att = currentAttempt(name, group);

  document.getElementById('lessonScreen').style.display  = 'block';

    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
  saved.choices.forEach(function(choice, idx) {

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = DRAW_PALETTE[0];   // matches the first (selected) dot = SCHOOL.primary
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER - two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm - used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');

}

  // ── SAVE / SHARE - iOS-safe download (LIAXA iOS PDF fix, Rule 12) ─────────
  //   iOS Safari ignores the <a download> attribute (and doc.save() relies on
  //   it), so on iPhone/iPad a plain download fails silently. We branch:
  //     • iOS  → native share sheet (→ "Save to Files"); if unavailable, open
  //              the PDF inline so the student can tap Safari's own Share.
  //     • else → <a download> click (works on desktop + Android).
  //   The whole function runs synchronously off the tap (no await above), which
  //   is what lets iOS accept navigator.share(). Do NOT add an await before this.
  // ──────────────────────────────────────────────────────────────────────────
  var _fname   = 'cneyt2b_t03_g01_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf';
  var _pdfBlob = doc.output('blob');

  function _restorePdfBtn(){ btn.innerHTML = '⬇ &nbsp;' + t('btn-pdf'); btn.disabled = false; }
  function _openPdfInline(b){
    var u = URL.createObjectURL(b);
    var w = window.open(u, '_blank');
    if (!w) { window.location.href = u; }   // popup blocked → same tab
    setTimeout(function(){ URL.revokeObjectURL(u); }, 60000);
  }

  // iPadOS 13+ reports as "MacIntel" with a touch screen, so test for that too.
  var _isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
               (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  if (_isIOS) {
    var _pdfFile = new File([_pdfBlob], _fname, { type:'application/pdf' });
    if (navigator.canShare && navigator.canShare({ files:[_pdfFile] })) {
      navigator.share({ files:[_pdfFile], title:_fname })
        .then(_restorePdfBtn)
        .catch(function(e){
          if (e && e.name === 'AbortError') { _restorePdfBtn(); return; } // cancelled
          _openPdfInline(_pdfBlob); _restorePdfBtn();
        });
      return;
    }
    _openPdfInline(_pdfBlob); _restorePdfBtn();   // older iOS: open inline
    return;
  }

  // Desktop + Android: the native download works.
  var _dlUrl = URL.createObjectURL(_pdfBlob);
  var _dlA   = document.createElement('a');
  _dlA.href  = _dlUrl; _dlA.download = _fname;
  document.body.appendChild(_dlA); _dlA.click();
  setTimeout(function(){ document.body.removeChild(_dlA); URL.revokeObjectURL(_dlUrl); }, 200);
  _restorePdfBtn();
}

/* ================================================
   buildLesson - OVERRIDE IN EACH GUIDE
   ================================================ */
function buildLesson(rng) {
  var LB = document.getElementById('lessonBody');
  LB.innerHTML = '';
  problems = [];

  /* ============================================================
     HELPERS
     ============================================================ */
  function T(o){
    if (o === undefined || o === null) return '';
    if (typeof o === 'string' || typeof o === 'number') return o;
    if (Object.prototype.toString.call(o) === '[object Array]') return o;
    return (o[LANG] !== undefined ? o[LANG] : o.es);
  }
  function shufA(arr){
    var a = arr.slice(), i, j, tm;
    for (i = a.length - 1; i > 0; i--){ j = Math.floor(rng()*(i+1)); tm = a[i]; a[i] = a[j]; a[j] = tm; }
    return a;
  }
  function one(pool){ return pool[Math.floor(rng()*pool.length)]; }
  function L(es, en){ return LANG === 'en' ? en : es; }
  function sec(tag, title, html){
    var d = document.createElement('div');
    d.className = 'section';
    d.innerHTML = '<div class="stag">' + tag + '</div><h2>' + title + '</h2>' + (html || '');
    LB.appendChild(d);
    return d;
  }
  function addProb(spec){
    var so  = shufA(T(spec.options));
    var cor = T(spec.correct);
    problems.push({
      title: T(spec.title),
      questionText: T(spec.q),
      fn: '',
      hint: T(spec.hint),
      explanation: T(spec.exp),
      options: so,
      correctIdx: so.indexOf(cor),
      showWork: !!spec.showWork,
      studentChoice: null,
      pendingChoice: null
    });
    buildOneCard(problems[problems.length-1], problems.length-1);
  }
  function widget(kind){
    var d = document.createElement('div');
    d.className = kind + 'wrap section iwbox';
    d.setAttribute('data-widget', kind);
    d.id = 'w' + kind;
    LB.appendChild(d);
    return d;
  }

  /* ============================================================
     SECCIÓN 1 - De dónde viene la energía
     ============================================================ */
  sec(L('Flujo de energía', 'Energy flow'),
      L('De dónde viene la energía de un ecosistema', 'Where an ecosystem gets its energy'),
      '<p>' + L(
        'En un ecosistema la energía entra en una sola dirección. Los organismos fotosintéticos, llamados productores, capturan energía luminosa y la fijan en compuestos orgánicos. A partir de ahí, cada transferencia hacia un consumidor define un nivel trófico: los herbívoros integran el segundo nivel, los depredadores que se alimentan de ellos el tercero, y así sucesivamente.',
        'Energy enters an ecosystem in a single direction. Photosynthetic organisms, called producers, capture light energy and fix it into organic compounds. From there, each transfer to a consumer defines a trophic level: herbivores make up the second level, the predators that feed on them the third, and so on.') + '</p>' +
      '<p>' + L(
        'Los descomponedores, hongos y bacterias, procesan la materia orgánica muerta de todos los niveles y devuelven los nutrientes minerales al suelo y al agua. Por eso la materia circula en ciclos cerrados, mientras que la energía se degrada como calor en cada paso y debe reponerse de forma continua desde el Sol.',
        'Decomposers, fungi and bacteria, process dead organic matter from every level and return mineral nutrients to soil and water. Matter therefore circulates in closed cycles, while energy is degraded as heat at every step and must be resupplied continuously from the Sun.') + '</p>' +
      '<div class="callout"><p><strong>' + L('Idea clave.', 'Key idea.') + '</strong> ' + L(
        'La materia se recicla; la energía se disipa. Ningún ecosistema puede sostenerse sin una entrada externa constante de energía.',
        'Matter is recycled; energy is dissipated. No ecosystem can sustain itself without a constant external energy input.') + '</p></div>');

  /* ---------- WIDGET 1 - clasificador de niveles tróficos ---------- */
  (function buildClassify(){
    var BINS = { es:['Productor','Consumidor primario','Consumidor secundario','Descomponedor'],
                 en:['Producer','Primary consumer','Secondary consumer','Decomposer'] };
    var POOL = [
      { es:'Zacate navajita que fija energía luminosa en azúcares', en:'Blue grama grass fixing light energy into sugars', bin:0,
        wes:'Fabrica su propio alimento a partir de la luz.', wen:'It makes its own food from light.' },
      { es:'Fitoplancton de una laguna costera', en:'Phytoplankton in a coastal lagoon', bin:0,
        wes:'Sostiene toda la red desde la base: es fotosintético.', wen:'It supports the whole web from the base: it is photosynthetic.' },
      { es:'Conejo del desierto que ramonea brotes tiernos', en:'Desert rabbit browsing on tender shoots', bin:1,
        wes:'Come tejido vegetal vivo, así que está un paso sobre el productor.', wen:'It eats living plant tissue, so it sits one step above the producer.' },
      { es:'Saltamontes que consume hojas de zacate', en:'Grasshopper feeding on grass blades', bin:1,
        wes:'Su alimento es un productor.', wen:'Its food is a producer.' },
      { es:'Zooplancton que filtra fitoplancton del agua', en:'Zooplankton filtering phytoplankton from the water', bin:1,
        wes:'Se alimenta directamente del productor acuático.', wen:'It feeds directly on the aquatic producer.' },
      { es:'Serpiente que caza roedores herbívoros', en:'Snake hunting herbivorous rodents', bin:2,
        wes:'Su presa ya es un consumidor primario.', wen:'Its prey is already a primary consumer.' },
      { es:'Lagartija que se alimenta de saltamontes', en:'Lizard feeding on grasshoppers', bin:2,
        wes:'Come un herbívoro, no una planta.', wen:'It eats a herbivore, not a plant.' },
      { es:'Charal que se alimenta de zooplancton', en:'Silverside fish feeding on zooplankton', bin:2,
        wes:'El zooplancton es herbívoro, así que el charal queda un nivel más arriba.', wen:'Zooplankton are herbivores, so the fish sits one level higher.' },
      { es:'Hongo del suelo que degrada la hojarasca acumulada', en:'Soil fungus breaking down accumulated leaf litter', bin:3,
        wes:'Procesa materia orgánica muerta y libera nutrientes minerales.', wen:'It processes dead organic matter and releases mineral nutrients.' },
      { es:'Bacterias que mineralizan los restos de un venado', en:'Bacteria mineralising the remains of a deer', bin:3,
        wes:'Trabajan sobre restos, no sobre presas vivas.', wen:'They work on remains, not on living prey.' }
    ];
    var ITEMS = shufA(POOL).slice(0, 6);
    var st = { i:0, tries:0, correct:0, done:false };
    var w = widget('classify');
    function render(){
      if (st.done){
        w.innerHTML = '<div class="iw-tag">' + L('Ubica el nivel trófico','Place the trophic level') + '</div>' +
          '<div class="cls-done">' + L('Serie completa: ','Series complete: ') + st.correct + ' / ' + ITEMS.length + '</div>' +
          '<div class="rfb">' + L('Fíjate en el criterio que usaste: no es el tamaño ni el grupo del organismo, sino de dónde procede su energía.',
                                   'Notice the criterion you used: not the size or the group of the organism, but where its energy comes from.') + '</div>';
        return;
      }
      var it = ITEMS[st.i];
      w.innerHTML =
        '<div class="iw-tag">' + L('Ubica el nivel trófico','Place the trophic level') + '</div>' +
        '<div class="iw-sub">' + L('Lee el organismo y decide qué lugar ocupa en el flujo de energía.',
                                   'Read the organism and decide where it sits in the energy flow.') + '</div>' +
        '<div class="wprog">' + (st.i+1) + ' / ' + ITEMS.length + '</div>' +
        '<div class="cls-card">' + it[LANG === 'en' ? 'en' : 'es'] + '</div>' +
        '<div class="cls-bins">' + BINS[LANG === 'en' ? 'en' : 'es'].map(function(b, bi){
            return '<button class="cls-bin" onclick="clsPick(' + bi + ')">' + b + '</button>';
          }).join('') + '</div>' +
        '<div class="rfb" id="clsFb"></div>';
    }
    window.clsPick = function(bi){
      if (st.done) return;
      var it = ITEMS[st.i];
      var fb = document.getElementById('clsFb');
      if (bi === it.bin){
        st.correct++; st.tries = 0; st.i++;
        if (st.i >= ITEMS.length) st.done = true;
        render();
        if (!st.done) document.getElementById('clsFb').innerHTML = '<span class="okmsg">' + L('Correcto. Siguiente organismo.','Correct. Next organism.') + '</span>';
        return;
      }
      st.tries++;
      if (st.tries >= 3){
        fb.innerHTML = '<b>' + BINS[LANG === 'en' ? 'en' : 'es'][it.bin] + '.</b> ' + (LANG === 'en' ? it.wen : it.wes);
        st.tries = 0; st.i++;
        if (st.i >= ITEMS.length) st.done = true;
        setTimeout(render, 1600);
        return;
      }
      var dir = (bi > it.bin)
        ? L('Lo colocaste demasiado arriba. Pregúntate de qué se alimenta y en qué nivel está ese alimento.',
            'You placed it too high. Ask yourself what it eats and which level that food belongs to.')
        : L('Lo colocaste demasiado abajo. Pregúntate de qué se alimenta y en qué nivel está ese alimento.',
            'You placed it too low. Ask yourself what it eats and which level that food belongs to.');
      fb.textContent = dir;
    };
    render();
  })();

  /* ---------- PROBLEMA 1 ---------- */
  addProb(one([
    {
      title: { es:'Sin descomponedores', en:'Without decomposers' },
      q: { es:'En un pastizal se aplica durante varios años un fungicida de amplio espectro que elimina a los hongos del suelo y reduce de forma drástica a las bacterias descomponedoras. ¿Qué consecuencia se espera a mediano plazo?',
           en:'A broad spectrum fungicide is applied to a grassland for several years, wiping out soil fungi and drastically reducing decomposer bacteria. What consequence is expected in the medium term?' },
      options: { es:[

        'La energía disponible para los herbívoros aumenta, porque ya no compite con ella la de los descomponedores.',
        'Los niveles superiores se mantienen intactos, porque los descomponedores no intervienen en el ecosistema.'],

  (function buildChain(){
    var POOL = [
      { es:['Nopal','Rata canguro','Serpiente','Halcón'], en:['Prickly pear','Kangaroo rat','Snake','Hawk'],
        hab:{ es:'Matorral xerófilo', en:'Xeric scrubland' } },
      { es:['Fitoplancton','Zooplancton','Charal','Garza'], en:['Phytoplankton','Zooplankton','Silverside fish','Heron'],
        hab:{ es:'Laguna costera', en:'Coastal lagoon' } },
      { es:['Encino','Ratón de campo','Culebra','Halcón cola roja'], en:['Oak','Field mouse','Rat snake','Red tailed hawk'],
        hab:{ es:'Bosque de encino', en:'Oak woodland' } },
      { es:['Hojarasca','Camarón de arroyo','Trucha','Nutria de río'], en:['Leaf litter','Stream shrimp','Trout','River otter'],
        hab:{ es:'Arroyo de montaña', en:'Mountain stream' } },
      { es:['Sargazo','Erizo de mar','Nutria marina','Tiburón blanco'], en:['Kelp','Sea urchin','Sea otter','White shark'],
        hab:{ es:'Bosque de sargazo', en:'Kelp forest' } }
    ];
    var ROUNDS = shufA(POOL).slice(0, 3);
    var st = { r:0, tries:0, slots:[], pool:[], done:false, revealed:false };
    var w = widget('chain');
    function load(){
      var names = ROUNDS[st.r][LANG === 'en' ? 'en' : 'es'];
      st.slots = [null, null, null, null];
      st.pool = shufA(names.map(function(_, i){ return i; }));
      st.tries = 0; st.revealed = false;
    }
    function render(){
      var cur = ROUNDS[st.r];
      var names = cur[LANG === 'en' ? 'en' : 'es'];
      if (st.done){
        w.innerHTML = '<div class="iw-tag">' + L('Arma la cadena','Build the chain') + '</div>' +
          '<div class="cls-done">' + L('Tres cadenas armadas.','Three chains assembled.') + '</div>' +
          '<div class="rfb">' + L('En las tres, la flecha nunca cambió de sentido: siempre va del organismo consumido hacia el que lo consume.',
                                   'In all three, the arrow never changed direction: it always runs from the organism eaten toward the one that eats it.') + '</div>';
        return;
      }
      var slotHtml = '';
      for (var s = 0; s < 4; s++){
        var cls = 'ch-slot' + (st.slots[s] === null ? '' : (st.revealed ? ' good' : ' full'));
        var label = st.slots[s] === null ? L('vacío','empty') : names[st.slots[s]];
        slotHtml += '<div class="' + cls + '" onclick="chFree(' + s + ')">' + label + '</div>';
        if (s < 3) slotHtml += '<span class="ch-arrow">→</span>';
      }
      var poolHtml = st.pool.map(function(idx){
        return '<div class="ch-chip" onclick="chPlace(' + idx + ')">' + names[idx] + '</div>';
      }).join('');
      w.innerHTML =
        '<div class="iw-tag">' + L('Arma la cadena','Build the chain') + '</div>' +
        '<div class="iw-sub">' + L('Coloca los organismos en el orden en que fluye la energía. Toca una pieza colocada para devolverla.',
                                   'Place the organisms in the order the energy flows. Tap a placed piece to send it back.') + '</div>' +
        '<div class="wprog">' + cur.hab[LANG === 'en' ? 'en' : 'es'] + '  ·  ' + (st.r+1) + ' / 3</div>' +
        '<div class="ch-slots">' + slotHtml + '</div>' +
        '<div class="ch-pool">' + (poolHtml || '<span class="iw-sub">' + L('Sin piezas pendientes.','No pieces left.') + '</span>') + '</div>' +
        '<button class="rverify-btn" onclick="chCheck()">' + L('Verificar','Check') + '</button>' +
        '<div class="rfb" id="chFb"></div>';
    }
    window.chPlace = function(idx){
      if (st.done || st.revealed) return;
      var s = st.slots.indexOf(null);
      if (s < 0) return;
      st.slots[s] = idx;
      st.pool = st.pool.filter(function(v){ return v !== idx; });
      render();
    };
    window.chFree = function(s){
      if (st.done || st.revealed) return;
      if (st.slots[s] === null) return;
      st.pool.push(st.slots[s]);
      st.slots[s] = null;
      render();
    };
    window.chCheck = function(){
      if (st.done || st.revealed) return;
      var fb = document.getElementById('chFb');
      if (st.slots.indexOf(null) >= 0){
        fb.textContent = L('Coloca las cuatro piezas antes de verificar.', 'Place all four pieces before checking.');
        return;
      }
      var names = ROUNDS[st.r][LANG === 'en' ? 'en' : 'es'];
      var okAll = st.slots.every(function(v, i){ return v === i; });
      if (okAll){
        st.revealed = true; render();
        document.getElementById('chFb').innerHTML = '<span class="okmsg">' + L('Cadena correcta.','Correct chain.') + '</span> ' +
          L('La energía entra por ' + names[0] + ' y llega a ' + names[3] + ' tras tres transferencias.',
            'Energy enters through ' + names[0] + ' and reaches ' + names[3] + ' after three transfers.');
        setTimeout(function(){ st.r++; if (st.r >= 3){ st.done = true; render(); } else { load(); render(); } }, 1800);
        return;
      }
      st.tries++;
      if (st.tries >= 3){
        st.slots = [0,1,2,3]; st.revealed = true; render();
        document.getElementById('chFb').innerHTML = L('Este es el orden correcto. Cada organismo obtiene su energía del que queda a su izquierda.',
                                                      'This is the correct order. Each organism gets its energy from the one to its left.');
        setTimeout(function(){ st.r++; if (st.r >= 3){ st.done = true; render(); } else { load(); render(); } }, 2400);
        return;
      }
      var bad = 0;
      while (bad < 4 && st.slots[bad] === bad) bad++;
      var placed = names[st.slots[bad]];
      fb.textContent = L('Aún no. Revisa la posición ' + (bad+1) + ': ' + placed + ' no obtiene su energía de lo que colocaste antes.',
                         'Not yet. Check position ' + (bad+1) + ': ' + placed + ' does not get its energy from what you placed before it.');
    };
    load();
    render();
  })();

  (function buildEnergy(){
    var SET = shufA([
      { e1:40000, need:20 },
      { e1:50000, need:16 },
      { e1:64000, need:12 },
      { e1:30000, need:18 }
    ]).slice(0, 3);
    var st = { r:0, k:8, tries:0, done:false, solved:false };
    var w = widget('energy');
    var NAMES = { es:['Productores','Consumidores primarios','Consumidores secundarios','Consumidores terciarios','Consumidores cuaternarios'],
                  en:['Producers','Primary consumers','Secondary consumers','Tertiary consumers','Quaternary consumers'] };
    function target(){ var d = SET[st.r]; return Math.floor(d.e1 * Math.pow(d.need/100, 3)); }
    function levels(){
      var d = SET[st.r], out = [], i, v = d.e1;
      for (i = 0; i < 5; i++){ out.push(v); v = v * st.k / 100; }
      return out;
    }
    function fmt(x){
      var r = x >= 100 ? Math.round(x) : Math.round(x*10)/10;
      return String(r).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    }
    function render(){
      if (st.done){
        w.innerHTML = '<div class="iw-tag">' + L('Cascada de energía','Energy cascade') + '</div>' +
          '<div class="cls-done">' + L('Tres escenarios resueltos.','Three scenarios solved.') + '</div>' +
          '<div class="rfb">' + L('Con eficiencias bajas la cascada se apaga en tres o cuatro escalones; solo eficiencias altas sostienen un depredador tope.',
                                   'With low efficiencies the cascade dies out in three or four steps; only high efficiencies sustain a top predator.') + '</div>';
        return;
      }
      var d = SET[st.r], tg = target();
      var bars = NAMES[LANG === 'en' ? 'en' : 'es'].map(function(nmL, i){
        return '<div class="en-bar"><div class="en-name">' + nmL + '</div>' +
               '<div class="en-track"><div class="en-fill' + (i === 3 ? ' top' : '') + '" id="enF' + i + '"></div></div>' +
               '<div class="en-num" id="enN' + i + '"></div></div>';
      }).join('');
      w.innerHTML =
        '<div class="iw-tag">' + L('Cascada de energía','Energy cascade') + '</div>' +
        '<div class="iw-sub">' + L('Mueve la eficiencia y observa cómo cambia lo que llega a cada nivel, en kJ por metro cuadrado al año.',
                                   'Move the efficiency and watch what reaches each level, in kJ per square metre per year.') + '</div>' +
        '<div class="wprog">' + (st.r+1) + ' / 3</div>' +
        '<div class="en-goal">' + L('Los productores fijan ' + fmt(d.e1) + ' kJ. Ajusta la eficiencia hasta que los consumidores terciarios reciban al menos ' + fmt(tg) + ' kJ.',
                                    'Producers fix ' + fmt(d.e1) + ' kJ. Adjust the efficiency until tertiary consumers receive at least ' + fmt(tg) + ' kJ.') + '</div>' +
        '<div class="en-row"><span class="en-lbl">' + L('Eficiencia','Efficiency') + '</span>' +
          '<input class="en-slider" type="range" min="4" max="25" step="1" value="' + st.k + '" oninput="enSlide(this.value)">' +
          '<span class="en-val" id="enVal">' + st.k + ' %</span></div>' +
        '<div class="en-bars">' + bars + '</div>' +
        '<button class="rverify-btn" onclick="enCheck()">' + L('Confirmar','Confirm') + '</button>' +
        '<div class="rfb" id="enFb"></div>';
      paint();
    }
    function paint(){
      if (st.done) return;
      var lv = levels(), tg = target(), max = lv[0], i, el;
      for (i = 0; i < 5; i++){
        el = document.getElementById('enF' + i);
        if (el) el.style.width = Math.max(0.6, lv[i] / max * 100).toFixed(3) + '%';
        el = document.getElementById('enN' + i);
        if (el) el.textContent = fmt(lv[i]);
      }
      el = document.getElementById('enVal');
      if (el) el.textContent = st.k + ' %';
      var fb = document.getElementById('enFb');
      if (!fb) return;
      var gap = tg - lv[3];
      if (gap <= 0) fb.innerHTML = '<span class="okmsg">' + L('Ya se alcanza la meta. Confirma para pasar al siguiente escenario.',
                                                              'The goal is met. Confirm to move to the next scenario.') + '</span>';
      else fb.textContent = L('Faltan ' + fmt(gap) + ' kJ en el nivel de los consumidores terciarios. Sube la eficiencia.',
                              'Still ' + fmt(gap) + ' kJ short at the tertiary consumer level. Raise the efficiency.');
    }
    window.enSlide = function(v){
      st.k = parseInt(v, 10);
      paint();
    };
    window.enCheck = function(){
      if (st.done) return;
      var lv = levels(), tg = target();
      var fb = document.getElementById('enFb');
      if (lv[3] >= tg){
        st.r++; st.tries = 0; st.k = 8;
        if (st.r >= 3){ st.done = true; render(); return; }
        render();
        document.getElementById('enFb').innerHTML = '<span class="okmsg">' + L('Meta alcanzada. Nuevo escenario.','Goal reached. New scenario.') + '</span>';
        return;
      }
      st.tries++;
      if (st.tries >= 3){
        var need = SET[st.r].need;
        st.k = need; render();
        document.getElementById('enFb').innerHTML = L('Se necesitaba ' + need + ' %. Observa que bajar unos pocos puntos de eficiencia recorta el cuarto nivel en más de la mitad.',
                                                      'It required ' + need + ' %. Notice that dropping efficiency by a few points cuts the fourth level by more than half.');
        setTimeout(function(){ st.r++; st.tries = 0; st.k = 8; if (st.r >= 3){ st.done = true; } render(); }, 2600);
        return;
      }
      fb.textContent = L('Todavía no. Los consumidores terciarios reciben ' + fmt(lv[3]) + ' kJ y la meta es ' + fmt(tg) + ' kJ.',
                         'Not yet. Tertiary consumers receive ' + fmt(lv[3]) + ' kJ and the goal is ' + fmt(tg) + ' kJ.');
    };
    render();
  })();

  /* ---------- WIDGET 4 - red trófica y cascada ---------- */
  (function buildWeb(){
    var SP = [
      { id:'pasto',  es:'Pasto',        en:'Grass',        x:62,  y:212, prey:[] },
      { id:'nopal',  es:'Nopal',        en:'Prickly pear', x:256, y:212, prey:[] },
      { id:'conejo', es:'Conejo',       en:'Rabbit',       x:44,  y:148, prey:['pasto'] },
      { id:'rata',   es:'Rata canguro', en:'Kangaroo rat', x:162, y:148, prey:['nopal','pasto'] },
      { id:'salta',  es:'Saltamontes',  en:'Grasshopper',  x:288, y:148, prey:['pasto'] },
      { id:'serp',   es:'Serpiente',    en:'Snake',        x:100, y:86,  prey:['conejo','salta'] },
      { id:'halcon', es:'Halcón',       en:'Hawk',         x:62,  y:26,  prey:['serp','conejo'] },
      { id:'coyote', es:'Coyote',       en:'Coyote',       x:252, y:60,  prey:['conejo','rata'] }
    ];
    function byId(id){ for (var i = 0; i < SP.length; i++) if (SP[i].id === id) return SP[i]; return null; }
    function cascade(removed){
      var alive = {}, changed = true;
      SP.forEach(function(s){ alive[s.id] = (s.id !== removed); });
      while (changed){
        changed = false;
        SP.forEach(function(s){
          if (!alive[s.id] || s.prey.length === 0) return;
          var fed = false;
          s.prey.forEach(function(p){ if (alive[p]) fed = true; });
          if (!fed){ alive[s.id] = false; changed = true; }
        });
      }
      return alive;
    }
    function impact(id){
      var a = cascade(id), n = 0;
      SP.forEach(function(s){ if (!a[s.id] && s.id !== id) n++; });
      return n;
    }
    var best = { id:null, n:-1 };
    SP.forEach(function(s){ var n = impact(s.id); if (n > best.n){ best = { id:s.id, n:n }; } });
    var st = { removed:null, tries:0, done:false };
    var w = widget('web');
    function nm(s){ return LANG === 'en' ? s.en : s.es; }
    function render(){
      var alive = st.removed ? cascade(st.removed) : null;
      var edges = '', nodes = '';
      SP.forEach(function(s){
        s.prey.forEach(function(pid){
          var p = byId(pid);
          var dim = alive && (!alive[p.id] || !alive[s.id]);
          edges += '<line x1="' + p.x + '" y1="' + (p.y-11) + '" x2="' + s.x + '" y2="' + (s.y+13) + '" ' +
                   'style="stroke:var(--' + (dim ? 'border' : 'green') + ');stroke-width:1.4;opacity:' + (dim ? '.35' : '.75') + '" marker-end="url(#trArrow)"></line>';
        });
      });
      SP.forEach(function(s){
        var dead = alive && !alive[s.id];
        var gone = st.removed === s.id;
        var fill = gone ? 'var(--bad-bg)' : (dead ? 'var(--surface2)' : 'var(--green-bg)');
        var strk = gone ? 'var(--bad)' : (dead ? 'var(--text3)' : 'var(--green)');
        var txt  = gone ? 'var(--bad)' : (dead ? 'var(--text3)' : 'var(--text)');
        nodes += '<g onclick="webTap(' + "'" + s.id + "'" + ')" style="cursor:pointer">' +
          '<rect x="' + (s.x-35) + '" y="' + (s.y-11) + '" width="70" height="24" rx="6" ' +
          'style="fill:' + fill + ';stroke:' + strk + ';stroke-width:1.4' + (dead && !gone ? ';stroke-dasharray:3 2' : '') + '"></rect>' +
          '<text x="' + s.x + '" y="' + (s.y+5) + '" text-anchor="middle" ' +
          'style="fill:' + txt + ';font-size:8.5px;font-family:IBM Plex Sans,sans-serif;font-weight:600">' + nm(s) + '</text></g>';
      });
      var lost = 0;
      if (alive) SP.forEach(function(s){ if (!alive[s.id] && s.id !== st.removed) lost++; });
      w.innerHTML =
        '<div class="iw-tag">' + L('Red trófica del matorral','Scrubland food web') + '</div>' +
        '<div class="iw-sub">' + L('Toca una especie para retirarla de la red y observa qué rutas quedan sin suministro. Busca la especie cuya ausencia deja sin alimento al mayor número de especies.',
                                   'Tap a species to remove it from the web and watch which routes lose their supply. Find the species whose absence leaves the greatest number of species without food.') + '</div>' +
        '<svg class="web-svg" viewBox="0 0 340 236" preserveAspectRatio="xMidYMid meet">' +
          '<defs><marker id="trArrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">' +
          '<path d="M0,0 L6,3 L0,6 z" style="fill:var(--gold)"></path></marker></defs>' +
          edges + nodes +
        '</svg>' +
        '<div class="web-stats">' +
          '<div class="web-stat">' + L('Especie retirada','Species removed') + ': <b>' + (st.removed ? nm(byId(st.removed)) : '-') + '</b></div>' +
          '<div class="web-stat">' + L('Especies sin alimento','Species left unfed') + ': <b>' + (st.removed ? lost : 0) + '</b></div>' +
        '</div>' +
        '<button class="rghost-btn" onclick="webReset()" style="margin-left:0">' + L('Restaurar la red','Restore the web') + '</button>' +
        '<div class="rfb" id="webFb"></div>';
    }
    window.webTap = function(id){
      if (st.done) return;
      st.removed = id;
      render();
      var n = impact(id);
      var fb = document.getElementById('webFb');
      if (n >= best.n){
        st.done = true;
        fb.innerHTML = '<span class="okmsg">' + L('La encontraste.','You found it.') + '</span> ' +
          L('Sin ' + nm(byId(id)) + ', ' + n + ' especies quedan sin ninguna presa disponible: la pérdida se propaga hacia arriba, nivel por nivel.',
            'Without ' + nm(byId(id)) + ', ' + n + ' species are left with no available prey: the loss propagates upward, level by level.');
        return;
      }
      st.tries++;
      if (st.tries >= 3){
        st.removed = best.id; st.done = true; render();
        document.getElementById('webFb').innerHTML =
          L('La especie clave era ' + nm(byId(best.id)) + ': deja sin alimento a ' + best.n + ' especies, porque sostiene varias rutas a la vez.',
            'The key species was ' + nm(byId(best.id)) + ': it leaves ' + best.n + ' species unfed, because it supports several routes at once.');
        return;
      }
      fb.textContent = L('Al retirar ' + nm(byId(id)) + ', ' + n + ' especies quedan sin alimento. Busca una especie de la que dependan varias rutas y que no tenga sustituto.',
                         'Removing ' + nm(byId(id)) + ' leaves ' + n + ' species unfed. Look for a species that several routes depend on and that has no substitute.');
    };
    window.webReset = function(){
      st.removed = null;
      render();
      var fb = document.getElementById('webFb');
      if (fb) fb.textContent = L('Red restaurada. Prueba con otra especie.','Web restored. Try another species.');
    };
    render();
  })();

        'It will have a wide base, because the number of individuals always decreases as levels rise.',
        'It cannot be built, because a numbers pyramid requires at least four trophic levels.'] },
      correct: { es:'Aparecerá invertida, porque cuenta individuos sin tomar en cuenta el tamaño de cada uno.',
                 en:'It will appear inverted, because it counts individuals without regard to the size of each one.' },
      hint: { es:'Pregúntate qué magnitud está midiendo esa pirámide y qué información deja fuera.',
              en:'Ask what quantity that pyramid is measuring and what information it leaves out.' },
      exp: { es:'Un encino concentra una biomasa enorme en un solo individuo, mientras que los herbívoros son miles de individuos diminutos. Al contar individuos, el nivel superior resulta más numeroso; la pirámide de energía del mismo par de niveles sigue teniendo la base ancha.',
             en:'An oak concentrates enormous biomass in a single individual, while the herbivores are thousands of tiny ones. Counting individuals, the upper level comes out more numerous; the energy pyramid for the same pair of levels still has a wide base.' },
      showWork: false
    }
  ]));

  /* ---------- WIDGET 5 - reflexión ---------- */
  (function buildReflect(){
    var PROMPTS = [
      { es:'Elige un ecosistema que conozcas y construye su red trófica con al menos seis organismos. Traza las flechas hacia dónde va la energía y señala qué especie te parece más difícil de sustituir.',
        en:'Choose an ecosystem you know and build its food web with at least six organisms. Draw the arrows where the energy goes and mark the species you think would be hardest to replace.' },
      { es:'Dibuja la misma cadena trófica dos veces: una como pirámide de energía y otra como pirámide de números. Explica por qué no tienen la misma forma.',
        en:'Draw the same food chain twice: once as an energy pyramid and once as a numbers pyramid. Explain why they do not have the same shape.' },
      { es:'Escoge una especie de tu región y explica qué rutas de energía se cortarían si desapareciera. Argumenta cuáles podrían reorganizarse y cuáles no.',
        en:'Pick a species from your region and explain which energy routes would be cut if it disappeared. Argue which ones could reorganise and which could not.' },
      { es:'Compara la cadena de pastoreo y la cadena de detritos de un mismo bosque. Dibuja ambas y estima qué proporción de la energía crees que circula por cada una.',
        en:'Compare the grazing chain and the detritus chain of the same forest. Draw both and estimate what share of the energy you think travels through each.' }
    ];
    var pickP = one(PROMPTS);
    var cvReady = false;
    var w = widget('reflect');
    w.innerHTML =
      '<div class="iw-tag">' + L('Construye y argumenta','Build and argue') + '</div>' +
      '<div class="reflect-prompt">' + pickP[LANG === 'en' ? 'en' : 'es'] + '</div>' +
      '<div class="wtabs">' +
        '<button class="wtab active" onclick="reflectTab(&#39;type&#39;,this)">' + L('⌨️ Escribir','⌨️ Write') + '</button>' +
        '<button class="wtab" onclick="reflectTab(&#39;draw&#39;,this)">' + L('✏️ Dibujar','✏️ Sketch') + '</button>' +
      '</div>' +
      '<div class="wpanel active" id="reflect_type"><textarea class="wtextarea" id="reflectTa" placeholder="' + L('Tu respuesta...','Your answer...') + '"></textarea></div>' +
      '<div class="wpanel" id="reflect_draw"><div class="cvwrap"><canvas class="dcanvas" id="reflectCv"></canvas>' +
        '<div class="ctoolbar"><button class="tbtn2 bpen on">' + t('btn-pen') + '</button>' +
        '<button class="tbtn2 bmarker">' + t('btn-marker') + '</button>' +
        '<button class="tbtn2 beraser">' + t('btn-eraser') + '</button>' +
        drawDotsHTML() + '<button class="clrbtn">' + t('btn-clear') + '</button></div></div></div>' +
      '<button class="rverify-btn" onclick="reflectSave()">' + L('Guardar','Save') + '</button>' +
      '<div class="rfb" id="reflectFb"></div>';
    window.reflectTab = function(which, btn){
      ['type','draw'].forEach(function(k){
        var el = document.getElementById('reflect_' + k);
        if (el) el.classList.toggle('active', k === which);
      });
      w.querySelectorAll('.wtab').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      if (which === 'draw') setTimeout(function(){
        var c = document.getElementById('reflectCv');
        if (c && !cvReady){ cvReady = true; initCanvas(c); }
      }, 60);
    };
    window.reflectSave = function(){
      document.getElementById('reflectFb').innerHTML = '<span class="okmsg">' +
        L('Guardado. Aquí no hay una sola red correcta: lo que cuenta es que cada flecha tenga una justificación.',
          'Saved. There is no single correct web here: what matters is that every arrow has a justification.') + '</span>';
    };
  })();

  /* ============================================================
     BLOQUE FINAL
     ============================================================ */
  sec(L('Integración', 'Synthesis'),
      L('Pon a prueba tu análisis', 'Put your analysis to the test'),
      '<p>' + L('Las dos situaciones siguientes reúnen la lectura de datos y el trazado de rutas que trabajaste a lo largo de la guía.',
                'The two situations below bring together the data reading and the route tracing you worked on throughout the guide.') + '</p>');

  /* ---------- PROBLEMA 9 ---------- */
  addProb(one([
    {
      title: { es:'Lectura de una serie', en:'Reading a data series' },
      q: { es:'En un estuario se midió la energía asimilada, en kJ por metro cuadrado al año, en cuatro niveles: productores 90,000; consumidores primarios 9,000; consumidores secundarios 1,800; consumidores terciarios 180. ¿Entre qué par de niveles consecutivos fue mayor la eficiencia de transferencia?',
           en:'In an estuary the assimilated energy was measured, in kJ per square metre per year, at four levels: producers 90,000; primary consumers 9,000; secondary consumers 1,800; tertiary consumers 180. Between which pair of consecutive levels was the transfer efficiency highest?' },
      options: { es:[
        'Entre los consumidores primarios y los secundarios',
        'Entre los productores y los consumidores primarios',
        'Entre los consumidores secundarios y los terciarios',
        'Fue idéntica entre los tres pares de niveles'],
        en:[
        'Between primary and secondary consumers',
        'Between producers and primary consumers',
        'Between secondary and tertiary consumers',
        'It was identical across the three pairs of levels'] },
      correct: { es:'Entre los consumidores primarios y los secundarios', en:'Between primary and secondary consumers' },
      hint: { es:'Compara cada nivel con el inmediato inferior como una proporción, no como una diferencia.',
              en:'Compare each level with the one immediately below as a proportion, not as a difference.' },
      exp: { es:'De productores a primarios: 9,000 entre 90,000 es 10 %. De primarios a secundarios: 1,800 entre 9,000 es 20 %. De secundarios a terciarios: 180 entre 1,800 es 10 %. El paso más eficiente fue el segundo.',
             en:'Producers to primary: 9,000 out of 90,000 is 10 %. Primary to secondary: 1,800 out of 9,000 is 20 %. Secondary to tertiary: 180 out of 1,800 is 10 %. The second step was the most efficient.' },
      showWork: true
    },
    {
      title: { es:'Lectura de una serie', en:'Reading a data series' },
      q: { es:'En una laguna se midió la energía asimilada, en kJ por metro cuadrado al año, en cuatro niveles: productores 80,000; consumidores primarios 12,000; consumidores secundarios 960; consumidores terciarios 192. ¿Entre qué par de niveles consecutivos fue mayor la eficiencia de transferencia?',
           en:'In a lagoon the assimilated energy was measured, in kJ per square metre per year, at four levels: producers 80,000; primary consumers 12,000; secondary consumers 960; tertiary consumers 192. Between which pair of consecutive levels was the transfer efficiency highest?' },
      options: { es:[
        'Entre los consumidores secundarios y los terciarios',
        'Entre los productores y los consumidores primarios',
        'Entre los consumidores primarios y los secundarios',
        'Fue idéntica entre los tres pares de niveles'],
        en:[
        'Between secondary and tertiary consumers',
        'Between producers and primary consumers',
        'Between primary and secondary consumers',
        'It was identical across the three pairs of levels'] },
      correct: { es:'Entre los consumidores secundarios y los terciarios', en:'Between secondary and tertiary consumers' },
      hint: { es:'Compara cada nivel con el inmediato inferior como una proporción, no como una diferencia.',
              en:'Compare each level with the one immediately below as a proportion, not as a difference.' },
      exp: { es:'De productores a primarios: 12,000 entre 80,000 es 15 %. De primarios a secundarios: 960 entre 12,000 es 8 %. De secundarios a terciarios: 192 entre 960 es 20 %. El paso más eficiente fue el último.',
             en:'Producers to primary: 12,000 out of 80,000 is 15 %. Primary to secondary: 960 out of 12,000 is 8 %. Secondary to tertiary: 192 out of 960 is 20 %. The last step was the most efficient.' },
      showWork: true
    }
  ]));

  /* ---------- PROBLEMA 10 ---------- */
  addProb(one([
    {
      title: { es:'Dos rutas hasta el mismo depredador', en:'Two routes to the same predator' },
      q: { es:'En un pastizal, el halcón recibe energía por dos rutas de la red: pasto, ratón de campo, halcón; y pasto, saltamontes, lagartija, halcón. El pasto fija 60,000 kJ por metro cuadrado al año y cada transferencia conserva el 10 %. ¿Qué ruta aporta más energía al halcón y cuánta?',
           en:'In a grassland, the hawk receives energy through two routes of the web: grass, field mouse, hawk; and grass, grasshopper, lizard, hawk. The grass fixes 60,000 kJ per square metre per year and each transfer retains 10 %. Which route delivers more energy to the hawk, and how much?' },
      options: { es:[
        'La ruta del ratón, con 600 kJ frente a 60 kJ de la otra',
        'La ruta de la lagartija, con 600 kJ frente a 60 kJ de la otra',
        'Ambas aportan lo mismo, 600 kJ cada una',
        'Ambas aportan lo mismo, 60 kJ cada una'],
        en:[
        'The mouse route, with 600 kJ against 60 kJ from the other',
        'The lizard route, with 600 kJ against 60 kJ from the other',
        'Both deliver the same, 600 kJ each',
        'Both deliver the same, 60 kJ each'] },
      correct: { es:'La ruta del ratón, con 600 kJ frente a 60 kJ de la otra', en:'The mouse route, with 600 kJ against 60 kJ from the other' },
      hint: { es:'Cuenta las transferencias de cada ruta; cada eslabón adicional vuelve a recortar la energía que queda.',
              en:'Count the transfers in each route; every extra link cuts the remaining energy again.' },
      exp: { es:'Ruta corta, dos transferencias: 60,000 × 0.10 = 6,000 y 6,000 × 0.10 = 600 kJ. Ruta larga, tres transferencias: 6,000 × 0.10 = 600 y 600 × 0.10 = 60 kJ. La ruta con un eslabón menos entrega diez veces más energía.',
             en:'Short route, two transfers: 60,000 × 0.10 = 6,000 and 6,000 × 0.10 = 600 kJ. Long route, three transfers: 6,000 × 0.10 = 600 and 600 × 0.10 = 60 kJ. The route with one link fewer delivers ten times more energy.' },
      showWork: true
    },
    {
      title: { es:'Dos rutas hasta el mismo depredador', en:'Two routes to the same predator' },
      q: { es:'En una laguna, el pez blanco recibe energía por dos rutas de la red: fitoplancton, zooplancton, pez blanco; y fitoplancton, zooplancton, charal, pez blanco. El fitoplancton fija 90,000 kJ por metro cuadrado al año y cada transferencia conserva el 10 %. ¿Qué ruta aporta más energía al pez blanco y cuánta?',
           en:'In a lagoon, the whitefish receives energy through two routes of the web: phytoplankton, zooplankton, whitefish; and phytoplankton, zooplankton, silverside, whitefish. The phytoplankton fixes 90,000 kJ per square metre per year and each transfer retains 10 %. Which route delivers more energy to the whitefish, and how much?' },
      options: { es:[
        'La ruta sin el charal, con 900 kJ frente a 90 kJ de la otra',
        'La ruta con el charal, con 900 kJ frente a 90 kJ de la otra',
        'Ambas aportan lo mismo, 900 kJ cada una',
        'Ambas aportan lo mismo, 90 kJ cada una'],
        en:[
        'The route without the silverside, with 900 kJ against 90 kJ from the other',
        'The route with the silverside, with 900 kJ against 90 kJ from the other',
        'Both deliver the same, 900 kJ each',
        'Both deliver the same, 90 kJ each'] },
      correct: { es:'La ruta sin el charal, con 900 kJ frente a 90 kJ de la otra', en:'The route without the silverside, with 900 kJ against 90 kJ from the other' },
      hint: { es:'Cuenta las transferencias de cada ruta; cada eslabón adicional vuelve a recortar la energía que queda.',
              en:'Count the transfers in each route; every extra link cuts the remaining energy again.' },
      exp: { es:'Ruta de dos transferencias: 90,000 × 0.10 = 9,000 y 9,000 × 0.10 = 900 kJ. Ruta de tres transferencias: 9,000 × 0.10 = 900 y 900 × 0.10 = 90 kJ. Insertar un eslabón intermedio reduce diez veces lo que llega arriba.',
             en:'Two transfer route: 90,000 × 0.10 = 9,000 and 9,000 × 0.10 = 900 kJ. Three transfer route: 9,000 × 0.10 = 900 and 900 × 0.10 = 90 kJ. Inserting one intermediate link cuts what arrives at the top tenfold.' },
      showWork: true
    }
  ]));
}
</script>

<!-- LIAXA ANALYTICS -->
<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbykkuJ_apGq3vALIFd4mr3acu81c7K4OKxW-DZ-i52Ceyl3lOanXMdvbS9SIXPrLQBm/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'Cadenas y Redes Tróficas';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
