<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vacunas: Importancia y Beneficios Sociales y Económicos</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; text-align: justify; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Vacunas: Importancia y Beneficios Sociales y Económicos</div>
    <div class="wcourse" id="wcourse-el">Biología · 1° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Vacunas: Importancia y Beneficios Sociales y Económicos</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="sbtn" id="dlBtn" onclick="generatePDF()" style="max-width:280px;margin:0 auto;">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   CENTRALIZED SCHOOL CONFIG (Rule 16) — ships UNBRANDED (Rule 11).
   The ONLY rebranding point. build_all.py substitutes these exact fields
   (BRAND_FIELDS / RGB_FIELDS / logo*) downstream; :root/dark stay as fallback.
   Neutral defaults below == the static :root/dark values, so unbranded == no-op.
   ══════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:'#1a3a6b', primaryDark:'#0f2444', primaryBg:'#e8edf5',
  accent:'#c9a84c', accentBg:'#f7f1e3',
  darkPrimary:'#4a78bf', darkPrimaryDark:'#7aa2e0', darkPrimaryBg:'#0e1f38',

/* ── Attempt counter + seed (Rule 4): seed = name+group+attempt ── */
function getAttemptKey(name, group){ return 'bio1_t09_g02__att__' + (name+'__'+group).replace(/\s+/g,'_'); }
function nextAttempt(name, group){ var k=getAttemptKey(name,group),n=0; try{n=parseInt(localStorage.getItem(k)||'0',10)||0;}catch(e){} n++; try{localStorage.setItem(k,String(n));}catch(e){} return n; }
function currentAttempt(name, group){ var k=getAttemptKey(name,group); try{return parseInt(localStorage.getItem(k)||'1',10)||1;}catch(e){return 1;} }
/* ================================================
   STATE
   ================================================ */
var studentData   = {};
var problems      = [];

/* ================================================
   SESSION PERSISTENCE  (localStorage)
   ================================================ */
function lsKey() {
  var n = (studentData.name  || '').trim();
  var g = (studentData.group || '').trim();
  return 'bio1_t09_g02__' + (n + '__' + g).replace(/\s+/g, '_');
}

function saveSession() {
  if (!studentData.name) return;
  var drawings = [], texts = [], photos = [];
  problems.forEach(function(p, i) {
    var dc = document.getElementById('dc' + i);
    if (dc && dc.width) {
      var blank = document.createElement('canvas');
      blank.width = dc.width; blank.height = dc.height;
      drawings.push(dc.toDataURL() === blank.toDataURL() ? null : dc.toDataURL('image/png'));
    } else { drawings.push(null); }
    var ta = document.getElementById('ta' + i);
    texts.push(ta ? ta.value : '');
    var pp = document.getElementById('pp' + i);
    photos.push((pp && pp.src && pp.src.indexOf('data:') === 0) ? pp.src : null);
  });
  var state = {
    name: studentData.name, group: studentData.group,
    answeredCount: answeredCount, correctCount: correctCount,
    choices: problems.map(function(p) { return p.studentChoice; }),
    drawings: drawings, texts: texts, photos: photos
  };
  try { localStorage.setItem(lsKey(), JSON.stringify(state)); } catch(e) {}
}

function loadSession(name, group) {
  var key = 'bio1_t09_g02__' + (name + '__' + group).replace(/\s+/g, '_');
  try { var r = localStorage.getItem(key); return r ? JSON.parse(r) : null; } catch(e) { return null; }
}

function restoreSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  var saved = loadSession(name, group);
  if (!saved) return;
  document.getElementById('restoreBar').style.display = 'none';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = currentAttempt(name, group);
  buildLesson(seededRng(name + group + att));
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
  saved.choices.forEach(function(choice, idx) {
    if (choice !== null && choice !== undefined) confirmMC(idx, choice);
  });
  setTimeout(function() {
    if (saved.drawings) {
      saved.drawings.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var dc = document.getElementById('dc' + i);
        if (!dc || !dc.width) return;
        var img = new Image();
        img.onload = function() {
          var dpr = window.devicePixelRatio || 1;
          dc.getContext('2d').drawImage(img, 0, 0, dc.width / dpr, dc.height / dpr);
        };
        img.src = dataUrl;
      });
    }
    if (saved.texts) {
      saved.texts.forEach(function(text, i) {
        if (!text) return;
        var ta = document.getElementById('ta' + i);
        if (ta) ta.value = text;
      });
    }
    if (saved.photos) {
      saved.photos.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var pp = document.getElementById('pp' + i);
        if (!pp) return;
        pp.src = dataUrl; pp.style.display = 'block';
        var pz = document.getElementById('pz' + i);
        if (pz) pz.style.opacity = '0.4';
      });
    }
  }, 300);
}

function dismissRestore() {
  document.getElementById('restoreBar').style.display = 'none';
}

function checkForSavedSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  if (!name || !group) { document.getElementById('restoreBar').style.display = 'none'; return; }
  var saved = loadSession(name, group);
  var bar = document.getElementById('restoreBar');
  bar.style.display = (saved && saved.choices && saved.choices.some(function(c){ return c !== null; })) ? 'block' : 'none';
}

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

               (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  if (_isIOS) {
    var _pdfFile = new File([_pdfBlob], _fname, { type:'application/pdf' });

function L(o){ return (o && o[LANG] !== undefined) ? o[LANG] : (o ? o.es : ''); }
function ri(rng, a, b){ return a + Math.floor(rng() * (b - a + 1)); }
function pk(rng, a){ return a[Math.floor(rng() * a.length)]; }
function clampn(v, a, b){ return v < a ? a : (v > b ? b : v); }
function perm(n, rng){ var a = [], i; for (i = 0; i < n; i++) a.push(i); return shuffle(a, rng); }

function say(host, cls, msg){
  var e = host.querySelector('.gw-fb');

}

function addProblem(rng, v){
  var idx = problems.length;
  var opts = L(v.opts).slice();

  var prob = {
    title: L(v.title),
    questionText: L(v.q),
    fn: '',
    hint: L(v.hint),
    explanation: L(v.exp),
    options: sh,
    correctIdx: sh.indexOf(correctVal),
    showWork: !!v.showWork,
    studentChoice: null,
    pendingChoice: null
  };
  problems.push(prob);
  buildOneCard(prob, idx);
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 1 :: el calendario de la defensa  (data-widget="defensa")
   El alumno decide en que momento se aplica la vacuna respecto al dia del
   contagio y ve, en el momento, cuantas defensas alcanzo a fabricar el cuerpo
   y cuantos dias termina en cama. El fallo no dice incorrecto: dice hacia
   donde mover la fecha. Al tercer intento revela el momento que funciona.
   ══════════════════════════════════════════════════════════════════════════ */
function wDefensas(rng, host){
  var CASOS = [
    { d:{ es:'sarampión', en:'measles' },   who:{ es:'Marisol', en:'Marisol' } },
    { d:{ es:'tosferina', en:'whooping cough' }, who:{ es:'Damián', en:'Damian' } },
    { d:{ es:'influenza', en:'influenza' }, who:{ es:'Ximena', en:'Ximena' } }
  ];
  var C = pk(rng, CASOS);
  var MOMENTOS = [
    { lab:{ es:'30 días antes', en:'30 days before' }, prot:96,
      nota:{ es:'El cuerpo tuvo un mes entero para fabricar y afinar sus defensas.', en:'The body had a whole month to build and fine tune its defences.' } },
    { lab:{ es:'14 días antes', en:'14 days before' }, prot:84,
      nota:{ es:'Alcanzó a fabricar casi todas sus defensas, pero apenas terminaba cuando llegó el microbio.', en:'It managed to build almost all its defences, but was only just finishing when the microbe arrived.' } },
    { lab:{ es:'2 días antes', en:'2 days before' }, prot:18,
      nota:{ es:'Dos días no alcanzan: el cuerpo apenas empezaba a reconocer el retrato.', en:'Two days are not enough: the body was only starting to recognise the portrait.' } },
    { lab:{ es:'el mismo día', en:'the same day' }, prot:6,
      nota:{ es:'La vacuna y el microbio entraron juntos, así que las defensas llegaron tarde.', en:'The vaccine and the microbe came in together, so the defences arrived late.' } },
    { lab:{ es:'3 días después', en:'3 days later' }, prot:0,
      nota:{ es:'La enfermedad ya iba en camino. Una vacuna no apaga lo que ya empezó.', en:'The illness was already under way. A vaccine does not switch off what has already started.' } }
  ];
  var st = { sel:null, tries:0, done:false };

  function dias(prot){ return Math.round(8 * (1 - prot / 100)); }

  function shell(){
    host.innerHTML =
      '<div class="gw-h iw-tag">' + L({ es:'El calendario de la defensa', en:'The defence calendar' }) + '</div>' +
      '<div class="gw-q">' + L({
        es:C.who.es + ' va a estar el viernes con un primo que tiene ' + L(C.d) + '. ¿Cuándo conviene aplicar la vacuna?',
        en:C.who.en + ' will be with a cousin who has ' + L(C.d) + ' on Friday. When is it best to give the vaccine?'
      }) + '</div>' +
      '<div class="gw-mini iw-sub">' + L({
        es:'Elige un momento y observa cuántas defensas alcanza a tener el cuerpo el día del contagio. Puedes probar todos los que quieras hasta que pase la semana sin un solo día en cama.',
        en:'Pick a moment and watch how many defences the body manages to have on the day of contact. You can try as many as you like until the week goes by without a single day in bed.'
      }) + '</div>' +
      '<div class="gw-grid">' + MOMENTOS.map(function(m, mi){
        return '<button class="gw-tile" data-m="' + mi + '">' + L(m.lab) + '</button>';
      }).join('') + '</div>' +
      '<div class="gw-lbl">' + L({ es:'El día del contagio', en:'On the day of contact' }) + '</div>' +
      '<div class="mr-row"><div class="mr-lab">' + L({ es:'Defensas', en:'Defences' }) + '</div>' +
        '<div class="mr-track"><div class="mr-fill bar-p"></div></div><div class="mr-val val-p">0</div></div>' +
      '<div class="mr-row"><div class="mr-lab">' + L({ es:'Días en cama', en:'Days in bed' }) + '</div>' +
        '<div class="mr-track"><div class="mr-fill hi bar-d"></div></div><div class="mr-val val-d">8</div></div>' +
      '<div class="gw-fb">' + L({ es:'Toca un momento para verlo.', en:'Tap a moment to see it.' }) + '</div>';
    host.querySelectorAll('.gw-tile').forEach(function(b){
      b.addEventListener('click', function(){ elige(parseInt(b.getAttribute('data-m'), 10)); });
    });
    pinta(0, 8);
  }

  function pinta(prot, dd){
    host.querySelector('.bar-p').style.width = prot + '%';
    host.querySelector('.val-p').textContent = prot + '%';
    host.querySelector('.bar-d').style.width = Math.round(dd / 8 * 100) + '%';
    host.querySelector('.val-d').textContent = dd;
  }

  function elige(mi){
    var m = MOMENTOS[mi];
    var dd = dias(m.prot);
    st.sel = mi;
    host.querySelectorAll('.gw-tile').forEach(function(b, bi){ b.classList.toggle('on', bi === mi); });
    pinta(m.prot, dd);
    if (dd === 0){
      st.done = true;
      say(host, 'good', L({
        es:'🎉 Pasó la semana sin un solo día en cama. ' + L(m.nota) + ' Una vacuna no cura: adelanta el trabajo que el cuerpo tardaría dos semanas en hacer.',
        en:'🎉 The week went by without a single day in bed. ' + L(m.nota) + ' A vaccine does not cure: it brings forward work the body would take two weeks to do.'
      }));
      return;
    }
    st.tries++;
    if (st.tries >= 3 && !st.done){
      st.done = true;
      say(host, 'warm', L({
        es:'El único momento que deja cero días en cama es <b>30 días antes</b>. ' + L(m.nota) + ' Fabricar defensas nuevas toma alrededor de dos semanas, así que la vacuna solo sirve si llega antes que el microbio.',
        en:'The only moment that leaves zero days in bed is <b>30 days before</b>. ' + L(m.nota) + ' Building new defences takes about two weeks, so a vaccine only works if it arrives before the microbe.'
      }));
      return;
    }
    say(host, 'miss', L({
      es:'Todavía ' + dd + ' días en cama. ' + L(m.nota) + ' Prueba con más días de anticipación.',
      en:'Still ' + dd + ' days in bed. ' + L(m.nota) + ' Try giving it more days ahead.'
    }));
  }

  shell();
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 2 :: la balanza de los dos riesgos  (data-widget="balanza")
   Un pueblo de 1000 personas. El alumno mueve la cobertura y la balanza se
   inclina en el momento: de un lado los dias perdidos por la enfermedad, del
   otro los dias de molestia por la vacuna. El reto es encontrar la cobertura
   mas baja que deja al pueblo con menos de 120 dias perdidos.
   ══════════════════════════════════════════════════════════════════════════ */
function wBalanza(rng, host){
  var PUEBLOS = [
    { es:'San Andrés', en:'San Andres' },
    { es:'Villa Nueva', en:'Villa Nueva' },
    { es:'El Sauce', en:'El Sauce' }
  ];
  var P = pk(rng, PUEBLOS);
  var META = 120;
  var OBJ = 80;
  var st = { c:0, tries:0, done:false };

  function casos(c){ return Math.round(60 * (1 - c / 100) * (1 - c / 100)); }
  function diasEnf(c){ return 8 * casos(c); }
  function diasVac(c){ return Math.round(1.2 * c); }

  function shell(){
    host.innerHTML =
      '<div class="gw-h iw-tag">' + L({ es:'La balanza de los dos riesgos', en:'The balance of the two risks' }) + '</div>' +
      '<div class="gw-q">' + L({
        es:'En ' + L(P) + ' viven 1000 personas. Encuentra la cobertura más baja que deja al pueblo con menos de 120 días perdidos en total.',
        en:'In ' + L(P) + ' there are 1000 people. Find the lowest coverage that leaves the town with fewer than 120 lost days in total.'
      }) + '</div>' +
      '<div class="gw-mini iw-sub">' + L({
        es:'Cada caso grave de la enfermedad cuesta 8 días en cama. Cada molestia por la vacuna, brazo adolorido o algo de fiebre, cuesta 1 día. Mueve la cobertura y mira hacia dónde se inclina la balanza.',
        en:'Each severe case of the disease costs 8 days in bed. Each vaccine discomfort, a sore arm or a little fever, costs 1 day. Move the coverage and watch which way the balance tips.'
      }) + '</div>' +
      '<div class="bl-stage">' +
        '<div class="bl-beam">' +

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 3 :: ¿que gano el pueblo?  (data-widget="clasifica")
   Sale un resultado de la campana a la vez y el alumno lo manda a social,
   economico o los dos. Al fallar recibe la pregunta que resuelve el caso, no
   un tache. Al tercer intento se revela la caja y sigue el siguiente.
   ══════════════════════════════════════════════════════════════════════════ */
function wBeneficios(rng, host){
  var BINS = [
    { es:'Social', en:'Social' },
    { es:'Económico', en:'Economic' },
    { es:'Los dos', en:'Both' }
  ];
  var POOL = [
    { t:{ es:'Una familia deja de gastar en consultas y medicinas', en:'A family stops spending on visits and medicines' }, b:1,
      k:{ es:'Pregúntate si lo que cambió fue dinero o fue salud.', en:'Ask yourself whether what changed was money or health.' } },
    { t:{ es:'Un bebé demasiado pequeño para vacunarse pasa el invierno sano', en:'A baby too young to be vaccinated goes through the winter healthy' }, b:0,
      k:{ es:'Aquí nadie ahorró un peso: lo que se protegió fue una vida.', en:'Nobody saved a peso here: what was protected was a life.' } },
    { t:{ es:'El hospital tiene camas libres para otras urgencias', en:'The hospital has free beds for other emergencies' }, b:2,
      k:{ es:'Una cama libre atiende a alguien más y además cuesta menos que una ocupada.', en:'A free bed treats somebody else and also costs less than an occupied one.' } },
    { t:{ es:'Una madre no pierde días de sueldo cuidando a un hijo enfermo', en:'A mother loses no days of pay looking after a sick child' }, b:1,
      k:{ es:'Lo que se cuenta aquí son días de trabajo, y los días de trabajo se pagan.', en:'What is counted here is work days, and work days are paid.' } },
    { t:{ es:'Una enfermedad que dejaba secuelas casi desapareció del país', en:'A disease that left lasting damage has almost vanished from the country' }, b:0,
      k:{ es:'Lo que cambió es la vida de la gente, no una cuenta.', en:'What changed is how people live, not an account.' } },
    { t:{ es:'El municipio gastó menos que el año pasado en atender un brote', en:'The town spent less than last year on dealing with an outbreak' }, b:1,
      k:{ es:'La frase habla de gasto, y el gasto se mide en dinero.', en:'The sentence talks about spending, and spending is measured in money.' } },
    { t:{ es:'Los alumnos no perdieron semanas de clase por cuarentena', en:'Students lost no weeks of school to quarantine' }, b:0,
      k:{ es:'Las clases perdidas no se recuperan con dinero.', en:'Lost classes are not recovered with money.' } },
    { t:{ es:'Menos familias se endeudaron para pagar una hospitalización', en:'Fewer families went into debt to pay for a hospital stay' }, b:2,
      k:{ es:'Una deuda es dinero, y una familia endeudada además vive peor.', en:'A debt is money, and an indebted family also lives worse.' } },
    { t:{ es:'Un taller no tuvo que parar por falta de personal', en:'A workshop did not have to stop for lack of staff' }, b:1,
      k:{ es:'Lo que se salvó aquí fue producción.', en:'What was saved here was production.' } },
    { t:{ es:'La gente volvió a las fiestas del pueblo sin miedo al contagio', en:'People went back to the town festivities with no fear of infection' }, b:0,
      k:{ es:'Esto se nota en la vida en común, no en la caja del municipio.', en:'This shows in life together, not in the town treasury.' } }
  ];
  var order = perm(POOL.length, rng).slice(0, 6);
  var st = { i:0, tries:0, hits:0, done:false };

  function cur(){ return POOL[order[st.i]]; }

  function render(){
    if (st.done){
      host.innerHTML =
        '<div class="gw-h iw-tag">' + L({ es:'¿Qué ganó el pueblo?', en:'What did the town gain?' }) + '</div>' +
        '<div class="gw-live">' + L({
          es:'Terminaste con ' + st.hits + ' de ' + order.length + ' al primer intento. La pregunta que separa las cajas es sencilla: si lo que cambió se cuenta en dinero, es económico; si se cuenta en vidas, en clases o en tranquilidad, es social; y muy seguido es las dos cosas a la vez.',
          en:'You finished with ' + st.hits + ' of ' + order.length + ' on the first try. The question that separates the boxes is simple: if what changed is counted in money, it is economic; if it is counted in lives, in classes or in peace of mind, it is social; and very often it is both at once.'
        }) + '</div>';
      return;
    }
    var it = cur();
    host.innerHTML =
      '<div class="gw-h iw-tag">' + L({ es:'¿Qué ganó el pueblo?', en:'What did the town gain?' }) + '</div>' +
      '<div class="cl-prog">' + (st.i + 1) + ' / ' + order.length + '</div>' +
      '<div class="gw-mini iw-sub">' + L({
        es:'Cada tarjeta es un resultado real de una campaña. Mándala a la caja que le toca; si te equivocas puedes volver a mandarla.',
        en:'Each card is a real result of a campaign. Send it to the box where it belongs; if you get it wrong you can send it again.'
      }) + '</div>' +
      '<div class="cl-card">' + L(it.t) + '</div>' +
      '<div class="cl-bins">' + BINS.map(function(b, bi){
        return '<button class="gw-tile" data-b="' + bi + '" style="text-align:center">' + L(b) + '</button>';
      }).join('') + '</div>' +
      '<div class="gw-fb">' + L({ es:'Elige una caja.', en:'Pick a box.' }) + '</div>';
    host.querySelectorAll('.gw-tile').forEach(function(btn){
      btn.addEventListener('click', function(){ manda(parseInt(btn.getAttribute('data-b'), 10)); });
    });
  }

  function avanza(){
    st.i++; st.tries = 0;
    if (st.i >= order.length) st.done = true;
    setTimeout(render, 950);
  }

  function manda(bi){
    var it = cur();
    if (bi === it.b){
      if (st.tries === 0) st.hits++;
      say(host, 'good', '✓ ' + L(BINS[it.b]) + '. ' + L(it.k));
      avanza();
      return;
    }
    st.tries++;
    if (st.tries >= 3){
      say(host, 'warm', L({ es:'Va en <b>', en:'It goes in <b>' }) + L(BINS[it.b]) + '</b>. ' + L(it.k));
      avanza();
      return;
    }
    say(host, 'miss', L({ es:'Todavía no. ', en:'Not yet. ' }) + L(it.k));
  }

  render();
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 4 :: el presupuesto de la campana  (data-widget="presupuesto")
   El alumno decide cuantas dosis compra el municipio y ve en el momento las
   dos cuentas que se mueven en sentidos contrarios: lo que cuesta vacunar y
   lo que cuesta atender a los que enferman. Busca el gasto total mas bajo.
   ══════════════════════════════════════════════════════════════════════════ */
function wPresupuesto(rng, host){
  var N = pk(rng, [600, 750, 900]);
  var DOSIS = 120, ATENCION = 900;
  var BASE = N / 3;
  var PASO = N / 10;
  var OBJ = N * 0.8;
  var MAXG = BASE * ATENCION;
  var st = { v:0, tries:0, done:false };

  function casos(v){ return Math.round(BASE * (1 - v / N) * (1 - v / N)); }
  function gv(v){ return v * DOSIS; }
  function ga(v){ return casos(v) * ATENCION; }

  function shell(){
    host.innerHTML =
      '<div class="gw-h iw-tag">' + L({ es:'El presupuesto de la campaña', en:'The campaign budget' }) + '</div>' +
      '<div class="gw-q">' + L({
        es:'Hay ' + N + ' niños por vacunar. Cada dosis cuesta 120 pesos y atender a un niño enfermo cuesta 900. Encuentra el número de dosis con el que el municipio gasta lo menos posible en total.',
        en:'There are ' + N + ' children to vaccinate. Each dose costs 120 pesos and treating a sick child costs 900. Find the number of doses with which the town spends the least in total.'
      }) + '</div>' +
      '<div class="gw-mini iw-sub">' + L({
        es:'Las dos cuentas se mueven al revés: mientras más dosis compras, más gastas en vacunas y menos en enfermos. Mueve el control y vigila el total.',
        en:'The two accounts move in opposite directions: the more doses you buy, the more you spend on vaccines and the less on sick children. Move the control and watch the total.'
      }) + '</div>' +
      '<div class="gw-lbl">' + L({ es:'Dosis compradas', en:'Doses bought' }) + '</div>' +
      '<div class="gw-num num-v">0</div>' +
      '<input type="range" class="gw-range rng-v" min="0" max="' + N + '" step="' + PASO + '" value="0">' +
      '<div class="mr-row"><div class="mr-lab">' + L({ es:'Vacunas', en:'Vaccines' }) + '</div>' +
        '<div class="mr-track"><div class="mr-fill bar-a"></div></div><div class="mr-val val-a">0</div></div>' +
      '<div class="mr-row"><div class="mr-lab">' + L({ es:'Enfermos', en:'Sick children' }) + '</div>' +
        '<div class="mr-track"><div class="mr-fill hi bar-b"></div></div><div class="mr-val val-b">0</div></div>' +
      '<div class="mr-row"><div class="mr-lab">' + L({ es:'Total', en:'Total' }) + '</div>' +
        '<div class="mr-track"><div class="mr-fill warn bar-t"></div></div><div class="mr-val val-t">0</div></div>' +
      '<div class="gw-row"><button class="gw-btn btn-go">' + L({ es:'Cerrar el presupuesto', en:'Close the budget' }) + '</button></div>' +
      '<div class="gw-fb">' + L({ es:'Mueve el control para ver las tres cuentas.', en:'Move the control to see the three accounts.' }) + '</div>';
    var r = host.querySelector('.rng-v');
    r.addEventListener('input', function(){ st.v = parseInt(r.value, 10); pinta(); });
    host.querySelector('.btn-go').addEventListener('click', revisa);
    pinta();
  }

  function pinta(){
    var a = gv(st.v), b = ga(st.v), tt = a + b;
    host.querySelector('.num-v').textContent = st.v;
    host.querySelector('.val-a').textContent = a;
    host.querySelector('.val-b').textContent = b;
    host.querySelector('.val-t').textContent = tt;
    host.querySelector('.bar-a').style.width = Math.round(clampn(a / MAXG, 0, 1) * 100) + '%';
    host.querySelector('.bar-b').style.width = Math.round(clampn(b / MAXG, 0, 1) * 100) + '%';
    host.querySelector('.bar-t').style.width = Math.round(clampn(tt / MAXG, 0, 1) * 100) + '%';
  }

  function revisa(){
    if (st.done) return;
    var tt = gv(st.v) + ga(st.v);
    if (st.v === OBJ){
      st.done = true;
      say(host, 'good', L({
        es:'🎉 ' + OBJ + ' dosis dejan el total más bajo: ' + tt + ' pesos. Observa una cosa importante: las primeras dosis evitan muchísimos casos y las últimas evitan poquitos, aunque son justo las que protegen a quien no se puede vacunar.',
        en:'🎉 ' + OBJ + ' doses leave the lowest total: ' + tt + ' pesos. Notice something important: the first doses prevent a great many cases and the last ones prevent very few, even though they are exactly the ones protecting whoever cannot be vaccinated.'
      }));
      return;
    }
    st.tries++;
    if (st.tries >= 3){
      st.done = true;
      var r = host.querySelector('.rng-v');
      st.v = OBJ; r.value = OBJ; pinta();
      say(host, 'warm', L({
        es:'El total más bajo está en <b>' + OBJ + ' dosis</b>. Antes de ese punto se gasta de más en enfermos; después, en dosis que ya evitan muy pocos casos.',
        en:'The lowest total is at <b>' + OBJ + ' doses</b>. Before that point too much goes on sick children; after it, on doses that already prevent very few cases.'
      }));
      return;
    }
    if (st.v < OBJ){
      say(host, 'miss', L({
        es:'Total de ' + tt + ' pesos. Lo que más pesa todavía es atender enfermos: compra más dosis.',
        en:'Total of ' + tt + ' pesos. What weighs most is still treating sick children: buy more doses.'
      }));
    } else {
      say(host, 'miss', L({
        es:'Total de ' + tt + ' pesos. Ya casi no quedan enfermos que atender y sigues pagando dosis: prueba con menos.',
        en:'Total of ' + tt + ' pesos. There are hardly any sick children left to treat and you keep paying for doses: try fewer.'
      }));
    }
  }

  shell();
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 5 :: la cadena de frio  (data-widget="cadenafrio")
   Tres paradas entre la fabrica y el brazo. El alumno pone la temperatura de
   cada una y ve, en el momento, cuanta proteccion conserva el lote. Congelar
   arruina tanto como calentar, y eso solo se ve moviendo los controles.
   ══════════════════════════════════════════════════════════════════════════ */
function wFrio(rng, host){
  var PARADAS = [
    { es:'Almacén central', en:'Central store' },
    { es:'Camioneta de reparto', en:'Delivery van' },
    { es:'Refrigerador de la clínica', en:'Clinic fridge' }
  ];
  var st = { t:[ri(rng, 16, 26), ri(rng, 12, 22), ri(rng, -8, -2)], tries:0, done:false };

  function factor(T){
    if (T < 0) return 45;
    if (T < 2) return 85;
    if (T <= 8) return 100;
    if (T <= 15) return 80;
    if (T <= 25) return 55;
    return 25;
  }
  function estado(T){
    if (T < 0) return { c:'bad', s:{ es:'se congeló, el lote se daña', en:'frozen, the batch is damaged' } };
    if (T < 2) return { c:'', s:{ es:'muy cerca del congelamiento', en:'very close to freezing' } };
    if (T <= 8) return { c:'ok', s:{ es:'dentro del rango seguro', en:'inside the safe range' } };
    if (T <= 15) return { c:'', s:{ es:'por encima del rango, empieza a perder efecto', en:'above the range, it starts to lose effect' } };
    return { c:'bad', s:{ es:'demasiado calor, pierde mucho efecto', en:'far too warm, it loses a lot of effect' } };
  }
  function total(){ return Math.round(factor(st.t[0]) * factor(st.t[1]) * factor(st.t[2]) / 10000); }

  function shell(){
    host.innerHTML =
      '<div class="gw-h iw-tag">' + L({ es:'La cadena de frío', en:'The cold chain' }) + '</div>' +
      '<div class="gw-q">' + L({
        es:'El lote pasa por tres paradas antes de llegar al brazo. Consigue que llegue con al menos 90 de protección.',
        en:'The batch goes through three stops before it reaches the arm. Get it to arrive with at least 90 of protection.'
      }) + '</div>' +
      '<div class="gw-mini iw-sub">' + L({
        es:'Pon la temperatura de cada parada y observa cuánta protección conserva el lote. Puedes moverlas todas las veces que quieras.',
        en:'Set the temperature at each stop and watch how much protection the batch keeps. You can move them as many times as you like.'
      }) + '</div>' +
      PARADAS.map(function(p, pi){
        return '<div class="cf-stop">' +
          '<div class="cf-head"><div class="cf-name">' + L(p) + '</div><div class="cf-temp temp-' + pi + '">0 °C</div></div>' +
          '<input type="range" class="gw-range rng-' + pi + '" data-i="' + pi + '" min="-10" max="30" step="1" value="' + st.t[pi] + '">' +
          '<div class="cf-state state-' + pi + '"></div>' +
        '</div>';
      }).join('') +
      '<div class="mr-row"><div class="mr-lab">' + L({ es:'Protección', en:'Protection' }) + '</div>' +
        '<div class="mr-track"><div class="mr-fill bar-p"></div></div><div class="mr-val val-p">0</div></div>' +
      '<div class="gw-row"><button class="gw-btn btn-go">' + L({ es:'Aplicar el lote', en:'Use the batch' }) + '</button></div>' +
      '<div class="gw-fb">' + L({ es:'Mueve las tres temperaturas.', en:'Move the three temperatures.' }) + '</div>';
    host.querySelectorAll('.gw-range').forEach(function(r){
      r.addEventListener('input', function(){
        st.t[parseInt(r.getAttribute('data-i'), 10)] = parseInt(r.value, 10);
        pinta();
      });
    });
    host.querySelector('.btn-go').addEventListener('click', revisa);
    pinta();
  }

  function pinta(){
    st.t.forEach(function(T, i){
      var e = estado(T);
      host.querySelector('.temp-' + i).textContent = T + ' °C';
      var s = host.querySelector('.state-' + i);
      s.className = 'cf-state ' + e.c;
      s.textContent = L(e.s);
    });
    var p = total();
    host.querySelector('.val-p').textContent = p;
    var f = host.querySelector('.bar-p');
    f.style.width = p + '%';
    f.className = 'mr-fill bar-p' + (p >= 90 ? '' : (p >= 60 ? ' warn' : ' hi'));
  }

  function revisa(){
    if (st.done) return;
    var p = total();
    if (p >= 90){
      st.done = true;
      say(host, 'good', L({
        es:'🎉 El lote llega con ' + p + ' de protección y se puede aplicar. La ciencia explica cómo aprende el cuerpo, pero sin refrigeración en las tres paradas ese conocimiento no llega al brazo de nadie.',
        en:'🎉 The batch arrives with ' + p + ' of protection and can be used. Science explains how the body learns, but with no refrigeration at the three stops that knowledge never reaches a single arm.'
      }));
      return;
    }
    st.tries++;
    if (st.tries >= 3){
      st.done = true;
      st.t = [5, 5, 5];
      host.querySelectorAll('.gw-range').forEach(function(r, i){ r.value = st.t[i]; });
      pinta();
      say(host, 'warm', L({
        es:'La franja segura va de 2 a 8 grados en las <b>tres</b> paradas. Congelar arruina el lote igual que calentarlo, y basta que falle una parada para que el resto no sirva de nada.',
        en:'The safe band runs from 2 to 8 degrees at <b>all three</b> stops. Freezing ruins the batch just as much as heating it, and one failed stop is enough for the rest to count for nothing.'
      }));
      return;
    }
    var mal = -1;
    st.t.forEach(function(T, i){ if (mal < 0 && factor(T) < 100) mal = i; });
    say(host, 'miss', L({
      es:'Llega con ' + p + ' de protección. Revisa ' + L(PARADAS[mal]).toLowerCase() + ': ' + L(estado(st.t[mal]).s) + '.',
      en:'It arrives with ' + p + ' of protection. Check the ' + L(PARADAS[mal]).toLowerCase() + ': ' + L(estado(st.t[mal]).s) + '.'
    }));
  }

  shell();
}

/* ══════════════════════════════════════════════════════════════════════════

function wReflect(rng, host){
  var PROMPTS = [
    { es:'Un vecino dice que la campaña es un gasto inútil porque hace años que nadie se enferma de eso en la colonia. Escribe lo que le contestarías usando dos datos que tú pedirías antes de decidir.',
      en:'A neighbour says the campaign is a waste of money because nobody in the neighbourhood has caught that for years. Write what you would answer using two pieces of data you would ask for before deciding.' },
    { es:'Dibuja el camino de una dosis desde la fábrica hasta el brazo de un niño y marca con una cruz los dos puntos donde se puede echar a perder.',

function reflectTab(which, btn){
  ['type', 'draw'].forEach(function(k){
    var el = document.getElementById('reflect_' + k);
    if (el) el.classList.toggle('active', k === which);
  });
  var tabs = btn.closest('.wtabs');
  if (tabs) tabs.querySelectorAll('.wtab').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  if (which === 'draw') setTimeout(function(){
    var c = document.getElementById('reflectCv');
    if (c && !c.width) initCanvas(c);
  }, 60);
}

function reflectSave(){
  var host = document.getElementById('wReflexionW');
  if (!host) return;
  say(host, 'good', L({
    es:'✓ Guardado. Un argumento que se apoya en un dato se puede discutir con cualquiera; uno que se apoya en un rumor, no.',
    en:'✓ Saved. An argument resting on data can be discussed with anybody; one resting on a rumour cannot.'
  }));
}

/* ══════════════════════════════════════════════════════════════════════════
   buildLesson :: concepto -> manipulativo -> problema, sin agrupar
   ══════════════════════════════════════════════════════════════════════════ */
function buildLesson(rng){
  injectGuideCSS();
  problems = [];
  answeredCount = 0;
  correctCount = 0;
  var body = document.getElementById('lessonBody');
  body.innerHTML = '';
  var pf = document.getElementById('progFill');
  if (pf) pf.style.width = '0%';

  /* ── Apertura ── */
  sec(
    L({ es:'Punto de partida', en:'Starting point' }),
    L({ es:'La enfermedad que tu abuela sí vio', en:'The disease your grandmother did see' }),
    '<p>' + L({
      es:'Hay enfermedades que hace sesenta años llenaban salas enteras de hospital con niños de tu edad y que hoy muchos médicos jóvenes no han visto nunca. No se fueron solas ni se aburrieron de nosotros: dejaron de circular porque, año tras año, millones de personas recibieron unas gotas o un piquete en el brazo antes de encontrarse con el microbio.',
      en:'There are diseases that sixty years ago filled whole hospital wards with children your age and that many young doctors today have never seen. They did not leave on their own or get bored of us: they stopped circulating because, year after year, millions of people got a few drops or a jab in the arm before ever meeting the microbe.'
    }) + '</p>' +
    '<p>' + L({
      es:'Eso plantea preguntas que se responden con números y no con opiniones. ¿Cuánto riesgo tiene vacunarse y cuánto tiene no hacerlo? ¿Qué gana una comunidad además de salud? ¿Cuánto cuesta una campaña comparada con lo que cuesta un brote? ¿Y hasta dónde alcanza la tecnología que fabrica y transporta esas dosis?',
      en:'That raises questions answered with numbers rather than opinions. How much risk is there in getting vaccinated and how much in not doing it? What does a community gain besides health? How much does a campaign cost compared with what an outbreak costs? And how far does the technology that makes and moves those doses reach?'
    }) + '</p>' +
    '<div class="callout"><p><strong>' + L({ es:'Lo que vas a hacer: ', en:'What you are going to do: ' }) + '</strong>' + L({
      es:'aquí no vas a leer sobre esas decisiones, las vas a tomar. Vas a elegir la fecha de una vacuna, a inclinar una balanza de riesgos, a cerrar el presupuesto de un municipio y a llevar un lote de dosis por la carretera sin echarlo a perder.',
      en:'here you will not read about those decisions, you will make them. You will choose the date of a vaccine, tip a balance of risks, close the budget of a town and carry a batch of doses down the road without spoiling it.'
    }) + '</p></div>'
  );

  /* ══ CONCEPTO 1 :: el retrato del microbio ══ */
  var s1 = sec(
    L({ es:'Concepto 1', en:'Concept 1' }),
    L({ es:'Un retrato del microbio, entregado a tiempo', en:'A portrait of the microbe, delivered in time' }),
    '<p>' + L({
      es:'Tu cuerpo tiene defensas que aprenden. La primera vez que un microbio entra, tarda entre una y dos semanas en reconocerlo y en fabricar las defensas exactas que lo neutralizan, y en esos días te enfermas. Cuando todo pasa, queda memoria: si el mismo microbio vuelve, la respuesta sale en horas y casi nunca hay enfermedad.',
      en:'Your body has defences that learn. The first time a microbe gets in, it takes one or two weeks to recognise it and to build the exact defences that neutralise it, and during those days you fall ill. When it is all over, memory remains: if the same microbe returns, the response comes out in hours and there is almost never any illness.'
    }) + '</p>' +
    '<p>' + L({
      es:'Una vacuna entrega esa memoria sin pasar por la enfermedad. Lleva un retrato del microbio: una parte suya, o una versión que no puede multiplicarse. Con ese retrato el cuerpo fabrica sus defensas con calma. De ahí salen tres consecuencias que conviene tener claras. La vacuna protege antes del encuentro y no cura lo que ya empezó. Tarda alrededor de dos semanas en hacer efecto. Y algunas necesitan una segunda dosis o un refuerzo, porque la memoria sube más cuando se le muestra el mismo retrato dos veces separadas en el tiempo.',
      en:'A vaccine delivers that memory without going through the disease. It carries a portrait of the microbe: a part of it, or a version that cannot multiply. With that portrait the body builds its defences calmly. Three consequences follow that are worth being clear about. A vaccine protects before the encounter and does not cure what has already started. It takes about two weeks to take effect. And some need a second dose or a booster, because memory rises higher when the same portrait is shown twice, separated in time.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Cuándo sirve', en:'When it works' }), L({ es:'antes del contagio', en:'before the contact' }), L({ es:'no actúa sobre una enfermedad que ya avanza', en:'it does not act on an illness already under way' })) +
      rcard(L({ es:'Cuánto tarda', en:'How long it takes' }), L({ es:'unas dos semanas', en:'about two weeks' }), L({ es:'ese es el tiempo que el cuerpo necesita', en:'that is the time the body needs' })) +
      rcard(L({ es:'Qué contiene', en:'What it contains' }), L({ es:'un retrato, no defensas', en:'a portrait, not defences' }), L({ es:'las defensas las fabrica tu cuerpo', en:'the defences are built by your body' })) +
      rcard(L({ es:'Segunda dosis', en:'Second dose' }), L({ es:'refuerza la memoria', en:'it strengthens memory' }), L({ es:'por eso van separadas en el tiempo', en:'that is why they are spread out in time' })) +
    '</div>'
  );
  wDefensas(rng, widgetHost(s1, 'wDefensasW', 'defensa'));
  addProblem(rng, mkP1(rng));
  addProblem(rng, mkP2(rng));

  /* ══ CONCEPTO 2 :: los dos riesgos ══ */
  var s2 = sec(
    L({ es:'Concepto 2', en:'Concept 2' }),
    L({ es:'Nadie compara un riesgo contra cero', en:'Nobody compares a risk against zero' }),
    '<p>' + L({
      es:'Vacunarse tiene riesgos, y decirlo no es estar en contra: es la única manera de evaluarlos. Lo frecuente es leve y pasajero, como el brazo adolorido o un día de fiebre. Lo grave existe, es muy raro, se vigila y se registra caso por caso. La pregunta útil no es si la vacuna tiene riesgo, porque todo lo tiene, sino contra qué se compara ese riesgo.',
      en:'Getting vaccinated carries risks, and saying so is not being against it: it is the only way to evaluate them. What is common is mild and passing, such as a sore arm or a day of fever. What is serious does exist, is very rare, and is monitored and recorded case by case. The useful question is not whether a vaccine has risk, because everything does, but what that risk is compared against.'
    }) + '</p>' +
    '<p>' + L({
      es:'Se compara con el riesgo de no vacunarse, que es el riesgo de la enfermedad: complicaciones, hospitalización, secuelas que duran años. Para poder compararlos se cuentan los dos con la misma medida, por ejemplo cuántas personas de cada mil terminan siendo atendidas, o cuántos días de vida normal pierde el grupo por cada lado. Anécdotas contra anécdotas no deciden nada; cifras contra cifras sí.',
      en:'It is compared with the risk of not getting vaccinated, which is the risk of the disease: complications, hospital stays, damage that lasts for years. To compare them both are counted with the same measure, for example how many people out of every thousand end up being treated, or how many days of normal life the group loses on each side. Anecdotes against anecdotes decide nothing; figures against figures do.'
    }) + '</p>' +
    '<p>' + L({
      es:'Y hay un tercer dato que casi siempre se olvida. Quien se vacuna y no enferma tampoco contagia, así que sale de la cadena. Cuando muchas personas salen de la cadena, el microbio se queda sin camino hacia quienes no se pueden vacunar: bebés muy pequeños, personas en ciertos tratamientos. Por eso la cuenta del riesgo no termina en el propio brazo.',
      en:'And there is a third piece of data that is almost always forgotten. Whoever is vaccinated and does not fall ill does not pass it on either, so they leave the chain. When many people leave the chain, the microbe is left with no route towards those who cannot be vaccinated: very young babies, people on certain treatments. That is why the risk account does not end at your own arm.'
    }) + '</p>'
  );
  wBalanza(rng, widgetHost(s2, 'wBalanzaW', 'balanza'));
  addProblem(rng, mkP3(rng));

  /* ══ CONCEPTO 3 :: lo social y lo economico ══ */
  var s3 = sec(
    L({ es:'Concepto 3', en:'Concept 3' }),
    L({ es:'Dos maneras de contar lo que se gana', en:'Two ways of counting what is gained' }),
    '<p>' + L({
      es:'Un beneficio social es lo que mejora en la vida de las personas y de la comunidad: gente que no muere ni queda con secuelas, clases que no se interrumpen, bebés protegidos por quienes los rodean, una enfermedad que deja de circular en toda una región. No se anota en pesos y no por eso vale menos.',
      en:'A social benefit is what improves in the life of people and of the community: people who do not die or end up with lasting damage, classes that are not interrupted, babies protected by those around them, a disease that stops circulating in a whole region. It is not written down in pesos and that does not make it worth less.'
    }) + '</p>' +
    '<p>' + L({
      es:'Un beneficio económico es lo que se deja de gastar o lo que se sigue produciendo: consultas, medicinas, camas de hospital, traslados, días de trabajo que nadie pierde, talleres que no paran. Se anota en pesos y por eso aparece en los presupuestos.',
      en:'An economic benefit is what stops being spent or what keeps being produced: visits, medicines, hospital beds, transfers, work days nobody loses, workshops that do not stop. It is written down in pesos and that is why it shows up in budgets.'
    }) + '</p>' +
    '<p>' + L({
      es:'Muchísimos resultados son las dos cosas a la vez, y esa es la parte interesante: una familia que no se endeuda por una hospitalización gana dinero y gana tranquilidad. La misma cuenta corre del lado de los costos. Una campaña cuesta dinero, personal y transporte, y si se comunica mal deja desconfianza, que es un costo social. Evaluar es poner los cuatro montones sobre la mesa, no solo el que conviene.',
      en:'A great many results are both at once, and that is the interesting part: a family that avoids debt from a hospital stay gains money and gains peace of mind. The same accounting runs on the cost side. A campaign costs money, staff and transport, and if it is badly communicated it leaves mistrust, which is a social cost. Evaluating means putting all four piles on the table, not only the convenient one.'
    }) + '</p>'
  );
  wBeneficios(rng, widgetHost(s3, 'wBeneficiosW', 'clasifica'));
  addProblem(rng, mkP4(rng));
  addProblem(rng, mkP5(rng));

  /* ══ CONCEPTO 4 :: la cuenta del municipio ══ */
  var s4 = sec(
    L({ es:'Concepto 4', en:'Concept 4' }),
    L({ es:'La cuenta que decide una campaña', en:'The account that decides a campaign' }),
    '<p>' + L({
      es:'Cuando un municipio decide si hace una campaña, pone dos cantidades una frente a la otra. De un lado, lo que cuesta vacunar: las dosis, el transporte refrigerado, el personal que las aplica. Del otro, lo que costaría el brote que se espera si no se vacuna: consultas, hospitalizaciones, traslados y los días de trabajo que pierden quienes se enferman o cuidan a un enfermo.',
      en:'When a town decides whether to run a campaign, it puts two amounts face to face. On one side, what vaccinating costs: the doses, the refrigerated transport, the staff who give them. On the other, what the expected outbreak would cost if nobody is vaccinated: visits, hospital stays, transfers and the work days lost by those who fall ill or care for someone ill.'
    }) + '</p>' +
    '<p>' + L({
      es:'Casi siempre prevenir sale más barato que atender, pero eso no se afirma, se calcula, y con cifras que alguien midió y publicó. Hay además un detalle que sorprende: las primeras dosis evitan muchísimos casos y las últimas evitan poquísimos, así que el ahorro deja de crecer mucho antes de llegar a la cobertura total. Y aun así se busca la cobertura alta, porque esas últimas dosis son justo las que protegen a quien no puede vacunarse. Ahí la decisión deja de ser solo económica.',
      en:'Preventing is nearly always cheaper than treating, but that is not asserted, it is calculated, and with figures somebody measured and published. There is also a surprising detail: the first doses prevent a great many cases and the last ones prevent very few, so savings stop growing well before full coverage. And high coverage is still the goal, because those last doses are exactly the ones protecting whoever cannot be vaccinated. At that point the decision stops being only economic.'
    }) + '</p>'
  );
  wPresupuesto(rng, widgetHost(s4, 'wPresupuestoW', 'presupuesto'));
  addProblem(rng, mkP6(rng));

  /* ══ CONCEPTO 5 :: alcances y limites ══ */
  var s5 = sec(
    L({ es:'Concepto 5', en:'Concept 5' }),
    L({ es:'Hasta dónde llega, y dónde se detiene', en:'How far it reaches, and where it stops' }),
    '<p>' + L({
      es:'Una vacuna es conocimiento científico y tecnología trabajando juntos. La ciencia explica cómo aprende el cuerpo y cuál pieza del microbio hay que mostrarle. La tecnología convierte eso en millones de dosis iguales, en frascos que aguantan un viaje, en refrigeradores, en camionetas frías y en registros que dicen quién recibió qué y cuándo. Sin la segunda parte, la primera se queda en el laboratorio.',
      en:'A vaccine is scientific knowledge and technology working together. Science explains how the body learns and which piece of the microbe to show it. Technology turns that into millions of identical doses, into vials that survive a journey, into fridges, cold vans and records that say who received what and when. Without the second part, the first stays in the laboratory.'
    }) + '</p>' +
    '<p>' + L({
      es:'Los dos tienen límites, y reconocerlos es parte de entenderlos. No existe vacuna contra todas las enfermedades. Ninguna protege al cien por ciento. Algunas piden refuerzos porque la memoria baja o porque el microbio cambia con los años. Casi todas viajan en un rango de frío estrecho, de 2 a 8 grados, y un lote que se calienta o que se congela se descarta aunque el frasco se vea intacto.',
      en:'Both have limits, and recognising them is part of understanding them. There is no vaccine against every disease. None protects one hundred per cent. Some ask for boosters because memory drops or because the microbe changes over the years. Almost all travel in a narrow cold range, from 2 to 8 degrees, and a batch that warms up or freezes is discarded even if the vial looks intact.'
    }) + '</p>' +
    '<p>' + L({
      es:'Y hay límites que no son técnicos. Una dosis que no llega a una comunidad lejana no falló por la ciencia, sino por el camino, el presupuesto o el personal. Y la información falsa baja la cobertura sin tocar un solo frasco. Por eso una campaña se sostiene con dos cosas a la vez: buena tecnología y buena información.',
      en:'And there are limits that are not technical. A dose that never reaches a distant community did not fail because of science, but because of the road, the budget or the staff. And false information lowers coverage without touching a single vial. That is why a campaign stands on two things at once: good technology and good information.'
    }) + '</p>'
  );
  wFrio(rng, widgetHost(s5, 'wFrioW', 'cadenafrio'));
  addProblem(rng, mkP7(rng));
  addProblem(rng, mkP8(rng));

  /* ══ Cierre :: tu postura y las decisiones que faltan ══ */
  var s6 = sec(
    L({ es:'Cierre', en:'Closing' }),
    L({ es:'Ahora la decisión es tuya', en:'Now the decision is yours' }),
    '<p>' + L({
      es:'Ya moviste la fecha, la balanza, el presupuesto y la temperatura. Con eso alcanza para sostener una postura propia y defenderla con datos.',
      en:'You have already moved the date, the balance, the budget and the temperature. That is enough to hold a position of your own and defend it with data.'
    }) + '</p>'
  );
  wReflect(rng, widgetHost(s6, 'wReflexionW', 'reflect'));
  addProblem(rng, mkP9(rng));
  addProblem(rng, mkP10(rng));
}

</script>

<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbykkuJ_apGq3vALIFd4mr3acu81c7K4OKxW-DZ-i52Ceyl3lOanXMdvbS9SIXPrLQBm/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'Vacunas: Importancia y Beneficios Sociales y Económicos';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
