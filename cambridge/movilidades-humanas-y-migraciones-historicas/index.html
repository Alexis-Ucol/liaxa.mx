<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Movilidades Humanas y Migraciones Históricas</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Movilidades Humanas y Migraciones Históricas</div>
    <div class="wcourse" id="wcourse-el">Historia · 2° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Movilidades Humanas y Migraciones Históricas</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="sbtn" id="dlBtn" onclick="generatePDF()" style="max-width:280px;margin:0 auto;">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   CENTRALIZED SCHOOL CONFIG (Rule 16) — ships UNBRANDED (Rule 11).
   The ONLY rebranding point. build_all.py substitutes these exact fields
   (BRAND_FIELDS / RGB_FIELDS / logo*) downstream; :root/dark stay as fallback.
   Neutral defaults below == the static :root/dark values, so unbranded == no-op.
   ══════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:'#c0202a', primaryDark:'#490a0e', primaryBg:'#f6e7e8',
  accent:'#f5c800', accentBg:'#fff8db',
  darkPrimary:'#c94049', darkPrimaryDark:'#e97179', darkPrimaryBg:'#3b0a0e',

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');

  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');

}

async function generatePDF() {
  var btn = document.getElementById('dlBtn');
  btn.textContent = 'Generando PDF…';
  btn.disabled = true;

  var jspdf   = window.jspdf;
  var doc     = new jspdf.jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });
  var PW      = 215.9;
  var M       = 18;
  var TW      = PW - M * 2;
  var PH      = doc.internal.pageSize.height;
  var name    = studentData.name;
  var group   = studentData.group;
  var total   = problems.length;
  var pct     = Math.round(correctCount / total * 100);
  var dateStr = new Date().toLocaleString('es-MX', { dateStyle:'long', timeStyle:'short' });

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS — INJECTION BLOCK ─────────────────────────────────────────
  //   Match these RGB values to --green and --gold above.
  //   PRIMARY  → pBR, pBG, pBB
  //   ACCENT   → pAR, pAG, pAB
  // ──────────────────────────────────────────────────────────────────────────
  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;  // PRIMARY (from SCHOOL, Rule 16)
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;   // ACCENT (from SCHOOL, Rule 16)

  function pdfText(html) {
    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/\u2192/g,'->').replace(/\u2212/g,'-').replace(/\u00b2/g,'^2')

/* ════════════════════════════════════════════════════════════════════════
   HELPERS DE CONTENIDO
   ════════════════════════════════════════════════════════════════════════ */
function S(es, en){ return LANG === 'es' ? es : en; }
function L(o){ if (o === null || o === undefined) return ''; if (typeof o === 'string') return o; return (o[LANG] !== undefined ? o[LANG] : o.es); }

function shufflePerm(n, rng){
  var a = [], i, j, t;
  for (i = 0; i < n; i++) a.push(i);
  for (i = n - 1; i > 0; i--) { j = Math.floor(rng() * (i + 1)); t = a[i]; a[i] = a[j]; a[j] = t; }
  var sorted = true;
  for (i = 0; i < n; i++) if (a[i] !== i) sorted = false;
  if (sorted && n > 1) { t = a[0]; a[0] = a[1]; a[1] = t; }
  return a;
}
function pickV(list, rng){ return list[Math.floor(rng() * list.length)]; }

function addSection(tag, title, body){
  var d = document.createElement('div');
  d.className = 'section';
  d.innerHTML = '<div class="stag">' + tag + '</div><h2>' + title + '</h2>' + body;
  document.getElementById('lessonBody').appendChild(d);
  return d;
}
function wgtHead(title, sub){
  return '<div class="iw-tag">' + title + '<div class="iw-sub">' + sub + '</div></div>';
}

/* Baraja las opciones (Rule 7) conservando el índice correcto y construye la
   tarjeta inline inmediatamente después del push (Rule 1 / Rule 5). */
function addProblem(v, rng){
  var langOpts = L(v.options), n = langOpts.length, idx = shufflePerm(n, rng);
  var p = {
    title:        L(v.title),
    questionText: L(v.stmt),
    fn:           '',
    hint:         L(v.hint),
    explanation:  L(v.explanation),
    options:      idx.map(function(k){ return langOpts[k]; }),
    correctIdx:   idx.indexOf(v.correct),
    showWork:     !!v.showWork,
    studentChoice: null,
    pendingChoice: null
  };
  problems.push(p);
  buildOneCard(p, problems.length - 1);
}

  EX.fb = (bad.length === 1 ? S('Una pieza no responde la pregunta. ', 'One piece does not answer the question. ')
                            : (bad.length + S(' piezas no responden la pregunta. ', ' pieces do not answer the question. '))) +
          (one ? L(one.w) : '');
  exRender();
}

function ruBuild(rng){
  var set = RU_SETS[Math.floor(rng() * RU_SETS.length)];
  RU = { it:set, qOrd:shufflePerm(set.length, rng), sOrd:shufflePerm(set.length, rng),
         link:[null, null, null, null], sel:null, tries:0, done:false, fb:'', fbk:'' };
  return '<div class="wgt" data-widget="match" id="wRutas">' +
    wgtHead(S('Rutas y motivos', 'Routes and motives'),
            S('Toca un movimiento de población y después la frase que lo nombra. Si cambias de opinión, toca la pareja para deshacerla.',
              'Tap a movement of population and then the phrase that names it. If you change your mind, tap the pair to undo it.')) +
    '<div id="ruBox"></div></div>';
}
function ruRender(){
  var z = document.getElementById('ruBox');
  if (!RU || !z) return;
  var usedBy = {}, i;
  for (i = 0; i < RU.link.length; i++) if (RU.link[i] !== null) usedBy[RU.link[i]] = i;
  var qs = RU.qOrd.map(function(k, pos){
    var cls = 'ru-item' + (RU.done ? ' ok' : (RU.sel === k ? ' sel' : (RU.link[k] !== null ? ' linked' : '')));
    var badge = RU.link[k] !== null ? '<span class="ru-badge">' + (pos + 1) + '</span>'
                                    : '<span class="ru-badge empty">' + (pos + 1) + '</span>';
    return '<div class="' + cls + '" onclick="ruTapQ(' + k + ')">' + badge + '<span>' + L(RU.it[k].q) + '</span></div>';
  }).join('');
  var ss = RU.sOrd.map(function(k){
    var owner = usedBy[k], lbl = '';
    if (owner !== undefined) lbl = String(RU.qOrd.indexOf(owner) + 1);
    var cls = 'ru-item' + (RU.done ? ' ok' : (owner !== undefined ? ' linked' : ''));
    var badge = lbl ? '<span class="ru-badge">' + lbl + '</span>' : '<span class="ru-badge empty">?</span>';
    return '<div class="' + cls + '" onclick="ruTapS(' + k + ')">' + badge + '<span>' + L(RU.it[k].s) + '</span></div>';
  }).join('');
  var linked = RU.link.filter(function(x){ return x !== null; }).length;
  z.innerHTML =
    '<div class="ru-grid">' +
      '<div><div class="ru-lbl">' + S('Movimientos de población', 'Movements of population') + '</div>' + qs + '</div>' +
      '<div><div class="ru-lbl">' + S('Maneras de nombrarlos', 'Ways of naming them') + '</div>' + ss + '</div>' +
    '</div>' +
    '<div class="iw-row"><span class="iw-read">' + linked + '/' + RU.it.length + ' ' + S('emparejados', 'matched') + '</span>' +
      (RU.done ? '' : '<button class="iw-btn" onclick="ruCheck()">' + S('Revisar', 'Check') + '</button>' +
                      '<button class="iw-btn2" onclick="ruClear()">' + S('Deshacer todo', 'Undo all') + '</button>') +
    '</div>' +
    '<div class="iw-fb' + (RU.fbk ? ' ' + RU.fbk : '') + '">' + RU.fb + '</div>';
}
function ruTapQ(k){
  if (!RU || RU.done) return;
  if (RU.link[k] !== null){ RU.link[k] = null; RU.sel = null;
    RU.fb = S('Pareja deshecha. Vuelve a elegir.', 'Pair undone. Choose again.'); RU.fbk = ''; ruRender(); return; }
  RU.sel = (RU.sel === k ? null : k);
  RU.fb = RU.sel === null ? '' : S('Movimiento elegido. Ahora toca la frase que lo describe.',
                                   'Movement selected. Now tap the phrase that describes it.');
  RU.fbk = '';
  ruRender();
}
function ruTapS(k){
  if (!RU || RU.done) return;
  var i;
  for (i = 0; i < RU.link.length; i++) if (RU.link[i] === k){
    RU.link[i] = null; RU.fb = S('Frase liberada.', 'Phrase released.'); RU.fbk = ''; ruRender(); return;
  }
  if (RU.sel === null){
    RU.fb = S('Primero elige un movimiento de la columna izquierda.', 'First choose a movement from the left column.');
    RU.fbk = 'warn'; ruRender(); return;
  }
  RU.link[RU.sel] = k; RU.sel = null; RU.fb = ''; RU.fbk = '';
  ruRender();
}
function ruClear(){
  if (!RU || RU.done) return;
  RU.link = [null, null, null, null]; RU.sel = null; RU.fb = ''; RU.fbk = ''; ruRender();
}
function ruCheck(){
  if (!RU || RU.done) return;
  var i, wrong = [], empty = 0;
  for (i = 0; i < RU.it.length; i++){
    if (RU.link[i] === null) empty++;
    else if (RU.link[i] !== i) wrong.push(i);
  }
  if (empty > 0){
    RU.fbk = 'warn';
    RU.fb = S('Todavía quedan movimientos sin nombre. Ninguna frase se repite.',
              'Some movements still have no name. No phrase is repeated.');
    ruRender(); return;
  }
  if (wrong.length === 0){
    RU.done = true; RU.fbk = 'ok';
    RU.fb = S('🎉 Todo emparejado. Nombrar bien un movimiento no es un adorno: de esa palabra dependen los derechos que se reconocen a quien viaja y la ayuda que puede pedir.',
              '🎉 All matched. Naming a movement well is not an ornament: the rights recognized for whoever travels and the help they can ask for depend on that word.');
    ruRender(); return;
  }
  RU.tries++;
  if (RU.tries >= 3){
    for (i = 0; i < RU.it.length; i++) RU.link[i] = i;
    RU.done = true; RU.fbk = 'warn';
    RU.fb = S('Así queda el emparejamiento. Léelo de arriba abajo y observa las dos preguntas que lo deciden todo: quién tomó la decisión de partir y si hubo una frontera de por medio.',
              'This is how the matching looks. Read it from top to bottom and notice the two questions that decide everything: who took the decision to leave and whether a border was involved.');
    ruRender(); return;
  }
  for (i = 0; i < wrong.length; i++) RU.link[wrong[i]] = null;
  RU.fbk = 'bad';
  RU.fb = (wrong.length === 1 ? S('Una pareja no encaja. ', 'One pair does not fit. ')
                              : (wrong.length + S(' parejas no encajan. ', ' pairs do not fit. '))) + L(RU.it[wrong[0]].g);
  ruRender();
}

/* ════════════════════════════════════════════════════════════════════════
   buildLesson :: concepto, manipulable, problema (Rule 1)
   ════════════════════════════════════════════════════════════════════════ */
function buildLesson(rng) {
  injectGuideStyles();

  /* ══════════ CONCEPTO 1 ══════════ */
  addSection(S('Concepto 1', 'Concept 1'),
    S('Moverse: una constante de la historia', 'Moving: a constant of history'),
    S('<p>Ninguna sociedad ha estado quieta. Las personas se mueven para trabajar, para estudiar, para casarse, para huir de una guerra o de una sequía, y a veces son movidas por la fuerza. A todos esos desplazamientos se les llama movilidades humanas, y la migración es solo una parte de ellas: la que implica cambiar el lugar donde se vive. Quien viaja cada mañana a otro municipio y vuelve a dormir a su casa se mueve, pero no migra.</p>' +
      '<p>Las movilidades se distinguen con tres preguntas. La primera: ¿se cruzó una frontera internacional? Si no, la migración es interna. La segunda: ¿hay regreso previsto? Hay salidas de temporada y salidas definitivas. La tercera, la más delicada: ¿quién tomó la decisión? Quien huye de una persecución o de la violencia no elige, y por eso se habla de salida forzada. Detrás de casi todas ellas actúan dos fuerzas a la vez: algo que aprieta en el lugar de origen y algo que espera en el lugar de destino.</p>',
      '<p>No society has stood still. People move to work, to study, to marry, to flee a war or a drought, and sometimes they are moved by force. All those displacements are called human mobilities, and migration is only one part of them: the part that means changing the place where you live. Whoever travels each morning to another town and comes back to sleep at home is moving, but is not migrating.</p>' +
      '<p>Mobilities are told apart with three questions. The first: was an international border crossed? If not, the migration is internal. The second: is there a planned return? There are seasonal departures and definitive ones. The third, the most delicate: who took the decision? Whoever flees persecution or violence does not choose, and that is why we speak of forced departure. Behind almost all of them two forces act at once: something that squeezes at the place of origin and something that waits at the place of destination.</p>') +
    '<div class="rules-grid">' +
      '<div class="rcard"><div class="rname">' + S('Movilidad interna', 'Internal mobility') + '</div><div class="rform">' + S('sin cruzar frontera', 'no border crossed') + '</div><div class="rnote">' + S('Del campo a la ciudad, de un estado a otro, de la sierra a la costa.', 'From countryside to city, from one state to another, from the mountains to the coast.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Movilidad internacional', 'International mobility') + '</div><div class="rform">' + S('cambia el país', 'the country changes') + '</div><div class="rnote">' + S('Cambian también los papeles, la moneda y a veces el idioma.', 'The documents, the currency and sometimes the language change too.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Salida forzada', 'Forced departure') + '</div><div class="rform">' + S('quedarse no es opción', 'staying is not an option') + '</div><div class="rnote">' + S('Guerra, persecución, violencia o desastre expulsan sin dejar elección.', 'War, persecution, violence or disaster expel without leaving a choice.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Redes de paisanos', 'Networks of fellow villagers') + '</div><div class="rform">' + S('quien llegó antes abre paso', 'the first to arrive opens the way') + '</div><div class="rnote">' + S('Ofrecen alojamiento, contactos y noticias del camino a quien viene detrás.', 'They offer lodging, contacts and news of the road to whoever comes behind.') + '</div></div>' +
    '</div>' +
    caBuild(rng));
  caRender();

  /* ── graded 1 ── */
  addProblem(pickV([
    { title:{ es:'Nombrar la movilidad', en:'Naming the mobility' },
      stmt:{ es:'Dos cosechas seguidas se pierden por la sequía y una familia deja su comunidad. Se instala en una ciudad del mismo país, donde una empresa de construcción contrata personal durante todo el año. ¿Cuál es la mejor descripción de esta movilidad?',
             en:'Two harvests in a row are lost to drought and a family leaves its community. It settles in a city of the same country, where a construction company hires staff all year round. What is the best description of this mobility?' },
      options:{ es:['Una migración interna en la que una condición del origen expulsa y una oportunidad del destino atrae.',
                    'Una migración internacional provocada únicamente por la oferta de empleo del destino.',
                    'Un desplazamiento forzado por persecución política dentro del mismo país.',
                    'Una movilidad temporal de estudio que termina al cerrar el ciclo escolar.'],
                en:['An internal migration in which a condition of the origin expels and an opportunity of the destination attracts.',
                    'An international migration caused only by the job offer of the destination.',
                    'A forced displacement due to political persecution inside the same country.',
                    'A temporary study mobility that ends when the school year closes.'] },
      correct:0,
      hint:{ es:'Revisa dos cosas por separado: si la familia cruzó o no una frontera, y qué está ocurriendo en cada uno de los dos lugares.',
             en:'Check two things separately: whether the family crossed a border or not, and what is happening in each of the two places.' },
      explanation:{ es:'La familia se mueve dentro del mismo país, de modo que la migración es interna. Y actúan dos fuerzas al mismo tiempo: la sequía vuelve insostenible quedarse y el empleo estable vuelve deseable llegar. Casi ninguna partida se explica con una sola de las dos.',
                    en:'The family moves inside the same country, so the migration is internal. And two forces act at once: the drought makes staying unsustainable and the steady job makes arriving desirable. Almost no departure is explained by one of the two alone.' } },
    { title:{ es:'Nombrar la movilidad', en:'Naming the mobility' },
      stmt:{ es:'Un joven viaja cada mañana al municipio vecino para trabajar y regresa a dormir a su casa. Su tía salió del país hace diez años y desde entonces vive en otro continente. ¿Qué distingue una movilidad de la otra?',
             en:'A young man travels each morning to the neighbouring town to work and comes back to sleep at home. His aunt left the country ten years ago and has lived on another continent since then. What tells one mobility from the other?' },
      options:{ es:['La del joven es un traslado cotidiano sin cambio de residencia; la de la tía es un cambio de residencia hacia otro país.',
                    'La del joven es una migración internacional temporal; la de la tía es una migración interna permanente.',
                    'Ninguna de las dos es una movilidad humana, porque en ambos casos el motivo es el trabajo.',
                    'Las dos son salidas forzadas, porque en ambos casos existió una necesidad económica.'],
                en:['That of the young man is a daily journey with no change of residence; that of the aunt is a change of residence to another country.',
                    'That of the young man is a temporary international migration; that of the aunt is a permanent internal migration.',
                    'Neither of the two is a human mobility, because in both cases the reason is work.',
                    'Both are forced departures, because in both cases there was an economic need.'] },
      correct:0,
      hint:{ es:'Pregúntate en cada caso dónde duerme la persona cada noche y si atravesó una frontera.',
             en:'Ask in each case where the person sleeps each night and whether a border was crossed.' },
      explanation:{ es:'No toda movilidad es migración. El viaje diario de ida y vuelta no implica mudarse, mientras que la migración supone cambiar el lugar de residencia; y cuando además se cruza una frontera se llama internacional. Distinguirlas evita contar como migrante a quien solo se desplaza para trabajar.',
                    en:'Not every mobility is migration. The daily round trip does not mean moving house, while migration means changing the place of residence; and when a border is also crossed it is called international. Telling them apart avoids counting as a migrant somebody who only commutes to work.' } }
  ], rng), rng);

  /* ── graded 2 ── */
  addProblem(pickV([
    { title:{ es:'Quien elige y quien no', en:'Who chooses and who does not' },
      stmt:{ es:'En 1939 miles de personas salieron de España al terminar la guerra en su país porque su vida y su libertad corrían peligro. En esos mismos años, otras personas cambiaban de país buscando un salario mejor. ¿Por qué la historia distingue los dos casos aunque en ambos se cruce una frontera?',
             en:'In 1939 thousands of people left Spain at the end of the war in their country because their life and freedom were in danger. In those same years, other people were changing country in search of a better wage. Why does history tell the two cases apart even though a border is crossed in both?' },
      options:{ es:['Porque en el primer caso quedarse ponía en riesgo la vida y en el segundo seguía abierta la opción de no partir.',
                    'Porque solamente en el segundo caso las personas se instalaron de manera permanente en el destino.',
                    'Porque el primer caso ocurrió entre países vecinos y el segundo entre continentes distintos.',
                    'Porque en el primer caso viajaron familias completas y en el segundo únicamente personas solas.'],
                en:['Because in the first case staying put life at risk and in the second the option of not leaving remained open.',
                    'Because only in the second case did people settle permanently at the destination.',
                    'Because the first case happened between neighbouring countries and the second between different continents.',
                    'Because in the first case whole families travelled and in the second only people on their own.'] },
      correct:0,
      hint:{ es:'Compara qué le habría ocurrido a cada persona si hubiera decidido quedarse donde estaba.',
             en:'Compare what would have happened to each person if they had decided to stay where they were.' },
      explanation:{ es:'La diferencia está en el margen de decisión. Quien huye de una persecución sale para sobrevivir, y por eso se habla de salida forzada; quien busca mejores condiciones enfrenta una decisión difícil, pero decisión al fin. Esa distinción no es solo de palabras: de ella dependen las obligaciones del país que recibe.',
                    en:'The difference lies in the margin of decision. Whoever flees persecution leaves in order to survive, and that is why we speak of forced departure; whoever seeks better conditions faces a hard decision, but a decision after all. That distinction is not merely verbal: the duties of the receiving country depend on it.' } },

      stmt:{ es:'Una familia abandona su comunidad porque la violencia hace imposible seguir viviendo ahí, y se instala en otra región del mismo país sin cruzar ninguna frontera. ¿Cómo se nombra esa movilidad y por qué?',

  addSection(S('Concepto 2', 'Concept 2'),
    S('Casi dos siglos de salidas y llegadas', 'Almost two centuries of departures and arrivals'),
    S('<p>Durante la época colonial, millones de personas africanas fueron trasladadas por la fuerza al continente americano y vendidas como esclavas: fue el mayor traslado forzado de la historia y nadie que lo hizo eligió viajar. Muy distinta fue la gran migración que llenó los barcos entre 1850 y 1930, cuando millones de europeas y europeos cruzaron el Atlántico empujados por la falta de tierra y atraídos por la promesa de conseguirla. En la década de 1920 varios países cerraron la puerta con leyes de cuotas y ese flujo se apagó.</p>' +
      '<p>México aparece en esta historia en todas las posiciones a la vez. En 1929, una crisis económica mundial empujó el regreso, muchas veces forzado, de familias mexicanas que vivían en Estados Unidos. En 1939 recibió a miles de personas exiliadas de la guerra civil española, y en los años setenta a quienes huían de las dictaduras del sur del continente. Entre 1942 y 1964 un acuerdo llevó a trabajadores agrícolas mexicanos al norte con contratos temporales, y entre 1940 y 1980 millones de personas dejaron el campo para instalarse en las ciudades industriales del propio país.</p>',
      '<p>During colonial times, millions of African people were transferred by force to the American continent and sold as slaves: it was the largest forced transfer in history and nobody who made it chose to travel. Very different was the great migration that filled the ships between 1850 and 1930, when millions of Europeans crossed the Atlantic pushed by the lack of land and pulled by the promise of getting it. In the nineteen twenties several countries closed the door with quota laws and that flow died down.</p>' +
      '<p>Mexico appears in this history in every position at once. In 1929, a world economic crisis pushed the return, often forced, of Mexican families living in the United States. In 1939 it received thousands of people exiled from the Spanish civil war, and in the nineteen seventies those fleeing the dictatorships of the south of the continent. Between 1942 and 1964 an agreement took Mexican farm workers north under temporary contracts, and between 1940 and 1980 millions of people left the countryside to settle in the industrial cities of their own country.</p>') +
    slBuild(rng));
  slRender();

  addSection(S('Concepto 3', 'Concept 3'),
    S('Familias repartidas en dos lugares', 'Families spread across two places'),
    S('<p>Las decisiones de partir casi nunca se toman a solas. En la mesa de la casa se discute quién va, quién se queda, con qué dinero se paga el viaje y por cuánto tiempo. Y cuando alguien se va, la vida cotidiana se reorganiza: las tareas del campo, de la casa y de la representación ante las autoridades pasan a quienes permanecen, que suelen ser mujeres, personas mayores, niñas y niños. Muchas mujeres empezaron así a administrar dinero y a tomar decisiones que antes no les correspondían.</p>' +
      '<p>El vínculo no se rompe: cambia de forma. Durante décadas viajó en cartas que tardaban semanas, en fotografías que se mandaban para que el ausente viera crecer a los hijos y en envíos de dinero, llamados remesas, que pagaban la comida, la escuela y hasta las fiestas del pueblo. Los noviazgos se sostenían por correspondencia y las bodas se concentraban en los meses de regreso. A las familias que viven así, repartidas entre dos lugares y unidas por esos hilos, se les llama familias transnacionales.</p>',
      '<p>Decisions to leave are almost never taken alone. At the kitchen table the household discusses who goes, who stays, with what money the journey is paid and for how long. And when somebody leaves, daily life is reorganized: the work of the fields, of the house and of dealing with the authorities passes to those who remain, usually women, older people and children. Many women thus began to manage money and to take decisions that had not been theirs before.</p>' +
      '<p>The bond does not break: it changes shape. For decades it travelled in letters that took weeks, in photographs sent so that the absent one could see the children grow, and in transfers of money, called remittances, that paid for food, for school and even for the festivals of the village. Engagements were sustained by correspondence and weddings piled up in the months of return. Families that live like this, spread between two places and joined by those threads, are called transnational families.</p>') +
    exBuild(rng));
  exRender();

  addSection(S('Concepto 4', 'Concept 4'),
    S('Las huellas que deja el viaje', 'The traces the journey leaves'),
    S('<p>Un viaje deja huellas de dos clases. Las primeras son documentos: listas de pasajeros y registros de embarque que anotaban nombre por nombre a quien salía de un puerto; registros de entrada y contratos de trabajo en el país de llegada; actas de matrimonio y de nacimiento que fechan lo que pasó con la familia. Esos papeles prueban hechos verificables, porque para eso los produjo quien los escribió. Los motivos y los afectos, en cambio, viven en las cartas, los diarios y las entrevistas. Quien investiga cruza los dos tipos: unos dan la ruta, los otros dan la razón del viaje.</p>' +
      '<p>Las segundas huellas están en la vida cotidiana. En los barrios donde llegaron familias de un mismo lugar aparecen fondas con la comida de allá, bandas que tocan su música, fiestas dedicadas al santo del pueblo de origen y palabras nuevas en el habla de todos. En el origen, mientras tanto, cambian las casas construidas con lo enviado, los oficios y hasta el calendario de fiestas, que se acomoda a las temporadas de regreso. Toda movilidad transforma por lo menos dos lugares a la vez.</p>',
      '<p>A journey leaves traces of two kinds. The first are documents: passenger lists and embarkation records that wrote down name by name whoever left a port; entry records and work contracts in the country of arrival; marriage and birth certificates that date what happened to the family. Those papers prove verifiable facts, because that is what whoever wrote them produced them for. Motives and affections, by contrast, live in letters, diaries and interviews. A researcher crosses both types: some give the route, the others give the reason for the journey.</p>' +
      '<p>The second traces are in daily life. In the neighbourhoods where families from one same place arrived there appear eating houses with the food of home, bands that play their music, festivals for the patron saint of the village of origin and new words in the speech of everybody. At the origin, meanwhile, the houses built with what was sent, the trades and even the calendar of festivals change, fitting themselves to the seasons of return. Every mobility transforms at least two places at once.</p>') +
    ruBuild(rng));
  ruRender();

             en:'The question asks for a quantity and a destination: look for the paper where somebody wrote down name by name.' },
      explanation:{ es:'Cada fuente responde bien a cierto tipo de pregunta. Los registros portuarios se llevaban precisamente para contar y controlar quién embarcaba y hacia dónde. Las cartas sirven para otra pregunta igual de importante: por qué se fueron y qué sintieron al hacerlo.',
                    en:'Each source answers one kind of question well. Port records were kept precisely to count and control who embarked and towards where. Letters serve another question just as important: why they left and what they felt in doing so.' } },
    { title:{ es:'Tres papeles, tres respuestas', en:'Three papers, three answers' },
      stmt:{ es:'Para estudiar a una familia que migró, un equipo dispone del registro de entrada al país de destino, del contrato de trabajo firmado allá y de un paquete de cartas enviadas a casa. ¿Qué aporta cada documento?',
             en:'To study a family that migrated, a team has the entry record of the country of destination, the work contract signed there and a bundle of letters sent home. What does each document contribute?' },
      options:{ es:['El registro y el contrato prueban la fecha de llegada y el empleo; las cartas explican los motivos y los lazos.',
                    'Las cartas fijan la fecha exacta de entrada y el contrato explica por qué la familia decidió partir.',
                    'Los tres documentos informan lo mismo, de modo que basta con revisar cualquiera de ellos.',
                    'Ninguno permite conocer los motivos de la partida, porque eso no deja huella escrita.'],
                en:['The record and the contract prove the date of arrival and the job; the letters explain the motives and the ties.',
                    'The letters fix the exact date of entry and the contract explains why the family decided to leave.',
                    'The three documents report the same thing, so reviewing any one of them is enough.',
                    'None of them allows the motives of the departure to be known, because that leaves no written trace.'] },
      correct:0,
      hint:{ es:'Para cada papel, pregúntate quién lo escribió y para qué lo necesitaba.',
             en:'For each paper, ask who wrote it and what they needed it for.' },
      explanation:{ es:'Los documentos oficiales fijan hechos verificables porque para eso se produjeron: fechas, nombres, empleos. Los motivos y los afectos aparecen en la correspondencia, escrita entre quienes se querían. Cruzar los dos tipos permite reconstruir a la vez la ruta y la razón del viaje.',
                    en:'Official documents fix verifiable facts because that is what they were produced for: dates, names, jobs. Motives and affections appear in the correspondence, written between people who loved each other. Crossing both types allows the route and the reason of the journey to be reconstructed at once.' } }
  ], rng), rng);

  /* ── graded 8 ── */
  addProblem(pickV([
    { title:{ es:'El barrio que cambia', en:'The neighbourhood that changes' },
      stmt:{ es:'En un barrio de la ciudad al que llegaron muchas familias del mismo pueblo aparecen fondas con la comida de allá, una banda que toca su música y una fiesta anual dedicada al santo del lugar de origen. ¿Qué muestra esto sobre las movilidades humanas?',
             en:'In a city neighbourhood where many families from the same village arrived there appear eating houses with the food of home, a band that plays their music and a yearly festival for the patron saint of the place of origin. What does this show about human mobilities?' },
      options:{ es:['Que quienes migran llevan consigo prácticas cotidianas, las recrean en el destino y con ello transforman también el lugar que los recibe.',
                    'Que la población migrante conserva sus costumbres sin que el lugar de destino cambie en nada.',
                    'Que el barrio ya era así antes de la llegada y por esa razón las familias lo eligieron.',
                    'Que las costumbres del lugar de origen desaparecen apenas la familia se instala en otro sitio.'],
                en:['That those who migrate carry daily practices with them, recreate them at the destination and thereby transform the place that receives them too.',
                    'That the migrant population keeps its customs without the place of destination changing at all.',
                    'That the neighbourhood was already like that before the arrival and for that reason the families chose it.',
                    'That the customs of the place of origin disappear as soon as the family settles somewhere else.'] },
      correct:0,
      hint:{ es:'Compara cómo era el barrio antes y después, y fíjate en quién cambió: solo quien llega, o también el lugar.',
             en:'Compare how the neighbourhood was before and after, and notice who changed: only the newcomers, or the place as well.' },
      explanation:{ es:'La comida, la música y las fiestas viajan con las personas y se instalan en el destino, donde se mezclan con lo que ya había. Por eso el estudio de las movilidades no explica únicamente a quien se va: explica también cómo se transforman los lugares de llegada.',
                    en:'Food, music and festivals travel with people and settle at the destination, where they mix with what was already there. That is why the study of mobilities does not only explain whoever leaves: it also explains how the places of arrival are transformed.' } },
    { title:{ es:'Las dos puntas del viaje', en:'The two ends of the journey' },
      stmt:{ es:'Un compañero sostiene que las movilidades humanas solo cambian la vida de quien se va. ¿Qué argumento corrige mejor esa idea?',
             en:'A classmate holds that human mobilities only change the life of whoever leaves. Which argument best corrects that idea?' },
      options:{ es:['Los dos lugares se transforman: en el origen cambian las familias, los oficios y el calendario; en el destino cambian los barrios, los comercios y el habla.',
                    'La idea es correcta, porque quien se queda continúa exactamente con la misma vida de antes.',
                    'Solo cambia el lugar de destino, ya que el de origen queda igual cuando pierde población.',
                    'Ninguno de los dos lugares cambia, porque la cantidad de personas que migra siempre es pequeña.'],
                en:['Both places are transformed: at the origin the families, the trades and the calendar change; at the destination the neighbourhoods, the shops and the speech change.',
                    'The idea is right, because whoever stays goes on with exactly the same life as before.',
                    'Only the place of destination changes, since the place of origin stays the same when it loses population.',
                    'Neither of the two places changes, because the number of people who migrate is always small.'] },
      correct:0,
      hint:{ es:'Recorre mentalmente las dos puntas del viaje y pregúntate qué es distinto en cada una después de la partida.',
             en:'Run mentally through both ends of the journey and ask what is different at each one after the departure.' },
      explanation:{ es:'En el origen se reorganizan las familias, el trabajo y hasta el calendario de fiestas, que se acomoda a las temporadas de regreso; en el destino aparecen oficios, comercios y costumbres nuevos. Toda movilidad se estudia por lo menos en dos escenarios a la vez.',
                    en:'At the origin the families, the work and even the calendar of festivals are reorganized, fitting the seasons of return; at the destination new trades, shops and customs appear. Every mobility is studied in at least two settings at once.' } }
  ], rng), rng);

  /* ── el cuaderno de viaje ── */
  buildReflect(rng);

  /* ══════════ CIERRE ══════════ */
  /* ── graded 9 ── */
  var P0   = 1000 + 50 * Math.floor(rng() * 7);
  var baja = 200 + 25 * Math.floor(rng() * 5);
  var P1   = P0 - baja;
  var nac  = 200 + 20 * Math.floor(rng() * 5);
  var def  = 90 + 10 * Math.floor(rng() * 4);
  var nat  = nac - def;
  var numA = [String(baja + nat), String(baja), String(nat), String(baja + nac)];
  var numB = [String(P0 + nat), String(P0 + nac), String(P1 + nat), String(P1 + nac)];
  addProblem(pickV([
    { title:{ es:'Contar a quienes faltan', en:'Counting those who are missing' },
      stmt:{ es:'En un pueblo vivían ' + P0 + ' personas en 1950 y ' + P1 + ' personas en 1970. En el registro parroquial de esos veinte años aparecen ' + nac + ' nacimientos y ' + def + ' defunciones. ¿Cuántas personas salieron del pueblo en ese periodo?',
             en:'A village had ' + P0 + ' inhabitants in 1950 and ' + P1 + ' inhabitants in 1970. The parish register of those twenty years shows ' + nac + ' births and ' + def + ' deaths. How many people left the village in that period?' },
      options:{ es:numA, en:numA },
      correct:String(baja + nat),
      showWork:true,
      hint:{ es:'Calcula primero cuánta población perdió el pueblo y después cuánta debió ganar por sí mismo con los nacimientos y las defunciones; las salidas tuvieron que cubrir las dos cosas.',
             en:'Work out first how much population the village lost and then how much it should have gained on its own from births and deaths; the departures had to cover both.' },
      explanation:{ es:'La población bajó ' + baja + ' personas entre las dos fechas. Al mismo tiempo, los nacimientos superaron a las defunciones en ' + nat + ', de modo que sin salidas el pueblo habría crecido. Las salidas tuvieron que cubrir la caída y ese crecimiento: ' + baja + ' + ' + nat + ' = ' + (baja + nat) + '.',
                    en:'The population fell by ' + baja + ' people between the two dates. At the same time, births exceeded deaths by ' + nat + ', so without departures the village would have grown. The departures had to cover the fall and that growth: ' + baja + ' + ' + nat + ' = ' + (baja + nat) + '.' } },
    { title:{ es:'El pueblo que no fue', en:'The village that never was' },
      stmt:{ es:'En un pueblo vivían ' + P0 + ' personas en 1950 y ' + P1 + ' personas en 1970. En el registro parroquial de esos veinte años aparecen ' + nac + ' nacimientos y ' + def + ' defunciones. ¿Cuántas personas habría tenido el pueblo en 1970 si nadie hubiera salido ni llegado?',
             en:'A village had ' + P0 + ' inhabitants in 1950 and ' + P1 + ' inhabitants in 1970. The parish register of those twenty years shows ' + nac + ' births and ' + def + ' deaths. How many inhabitants would the village have had in 1970 if nobody had left or arrived?' },
      options:{ es:numB, en:numB },
      correct:String(P0 + nat),
      showWork:true,
      hint:{ es:'Parte de la población de 1950 y añade únicamente lo que el propio pueblo ganó o perdió por nacimientos y defunciones.',
             en:'Start from the population of 1950 and add only what the village itself gained or lost through births and deaths.' },
      explanation:{ es:'Sin migración, la población de 1970 sería la de 1950 más el crecimiento natural. Los nacimientos superaron a las defunciones en ' + nat + ' personas, así que el pueblo habría llegado a ' + P0 + ' + ' + nat + ' = ' + (P0 + nat) + '. La diferencia con lo que de verdad ocurrió es la medida de lo que la salida de población se llevó.',
                    en:'With no migration, the population of 1970 would be that of 1950 plus the natural growth. Births exceeded deaths by ' + nat + ' people, so the village would have reached ' + P0 + ' + ' + nat + ' = ' + (P0 + nat) + '. The gap with what actually happened is the measure of what the departure of population took away.' } }
  ], rng), rng);

  /* ── graded 10 ── */
  addProblem(pickV([
    { title:{ es:'Por qué se estudian juntas', en:'Why they are studied together' },
      stmt:{ es:'Al terminar el estudio de las movilidades de casi dos siglos, un grupo debe explicar por qué conviene estudiar juntas la historia de las migraciones y la historia de las familias. ¿Cuál es la mejor razón?',
             en:'At the end of the study of almost two centuries of mobilities, a group has to explain why the history of migrations and the history of families should be studied together. What is the best reason?' },
      options:{ es:['Porque las decisiones de partir se toman dentro de las familias y a la vez las transforman, de modo que una cosa no se entiende sin la otra.',
                    'Porque las cifras de migración se obtienen únicamente contando los matrimonios celebrados cada año.',
                    'Porque solo migran las personas que no tienen familia en su lugar de origen.',
                    'Porque la vida familiar únicamente cambia cuando la familia entera se muda al mismo tiempo.'],
                en:['Because decisions to leave are taken inside families and at the same time transform them, so one is not understood without the other.',
                    'Because migration figures are obtained only by counting the marriages celebrated each year.',
                    'Because only people with no family in their place of origin migrate.',
                    'Because family life changes only when the whole family moves at the same time.'] },
      correct:0,
      hint:{ es:'Piensa quién participa en la decisión de una partida y quién carga después con sus consecuencias.',
             en:'Think who takes part in the decision of a departure and who bears its consequences afterwards.' },
      explanation:{ es:'Quien parte casi nunca decide en soledad: en casa se discute quién va, con qué dinero y por cuánto tiempo. Y al producirse la partida cambian las tareas, los afectos y el calendario de la casa. Por eso la historia de las migraciones es también, y al mismo tiempo, una historia de las familias.',
                    en:'Whoever leaves almost never decides alone: at home the household discusses who goes, with what money and for how long. And once the departure happens, the tasks, the affections and the calendar of the house change. That is why the history of migrations is also, and at the same time, a history of families.' } },
    { title:{ es:'Un país en todas las posiciones', en:'A country in every position' },
      stmt:{ es:'Un país recibe población de otros lugares, despide trabajadores hacia el extranjero y ve a millones de sus habitantes moverse del campo a la ciudad, todo dentro de las mismas décadas. ¿Qué conclusión permite sostener esa situación?',
             en:'A country receives population from other places, sees workers off to foreign countries and watches millions of its inhabitants move from countryside to city, all within the same decades. What conclusion does that situation support?' },
      options:{ es:['Que un mismo país puede ser al mismo tiempo lugar de origen, de destino y de tránsito de movilidades distintas.',
                    'Que los países se dividen de forma permanente entre países que expulsan y países que reciben.',
                    'Que las movilidades internas y las internacionales nunca ocurren en el mismo periodo.',
                    'Que la llegada de población extranjera detiene siempre la salida de trabajadores nacionales.'],
                en:['That one and the same country can be at once a place of origin, of destination and of transit for different mobilities.',
                    'That countries are permanently divided between countries that expel and countries that receive.',
                    'That internal and international mobilities never happen in the same period.',
                    'That the arrival of foreign population always stops the departure of national workers.'] },
      correct:0,
      hint:{ es:'Cuenta cuántas direcciones distintas de movimiento aparecen en el mismo periodo.',
             en:'Count how many different directions of movement appear in the same period.' },
      explanation:{ es:'Clasificar a los países en emisores y receptores oculta lo que suele ocurrir: los flujos van en varias direcciones a la vez y cambian de sentido con el tiempo, como se vio cuando una crisis convirtió una salida masiva en un retorno.',
                    en:'Sorting countries into senders and receivers hides what usually happens: flows run in several directions at once and change direction over time, as was seen when a crisis turned a massive departure into a return.' } }
  ], rng), rng);
}
</script>

<!-- LIAXA ANALYTICS -->
<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbzLGV15JRTPs9bbSvHRLfgOXeT9oUExDf1AH546WOwq5tYxXSdhX212OWi_bTJfMGx9/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'Movilidades Humanas y Migraciones Históricas';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
</body>
