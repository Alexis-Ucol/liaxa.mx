    '<div class="gw-h">' + L({ es:'Enciende el mapa de la sismicidad', en:'Light up the seismicity map' }) + '</div>' +
    '<div class="gw-q" data-r="q"></div>' +
    '<div class="gw-mini">' + L({ es:'Toca las regiones que crees que tiemblan seguido. Toca otra vez para apagarlas.', en:'Tap the regions you think shake often. Tap again to switch them off.' }) + '</div>' +
    '<div class="gw-grid" data-r="tiles"></div>' +
    '<div class="gw-num" data-r="num"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Comprobar', en:'Check' }) + '</button></div>' +
    '<div class="gw-fb"></div>';

  var elQ = host.querySelector('[data-r="q"]'),
      elN = host.querySelector('[data-r="num"]'),
      wrap = host.querySelector('[data-r="tiles"]'),
      elK = host.querySelector('[data-r="chk"]');

  function draw(){
    elQ.innerHTML = L({ es:'¿Dónde se concentran los sismos y los volcanes? ', en:'Where are earthquakes and volcanoes concentrated? ' }) + L(R[rd].t);
    var h = '', enc = 0, j;
    for (j = 0; j < items.length; j++){
      if (on[j]) enc++;
      h += '<button class="gw-tile' + (on[j] ? ' on' : '') + (done ? '' : '') + '" data-i="' + j + '"' + (locked || done ? ' disabled' : '') + '>' +
             '<span class="gw-key">' + L(items[j].d.n) + '</span></button>';
    }
    wrap.innerHTML = h;
    elN.textContent = enc + ' ' + L({ es:'regiones encendidas', en:'regions switched on' });
    wrap.querySelectorAll('.gw-tile').forEach(function(b){
      b.addEventListener('click', function(){
        if (locked || done) return;
        var k = parseInt(b.dataset.i, 10);
        on[k] = on[k] ? 0 : 1;
        draw();
      });
    });
  }
  function advance(){
    rd++;
    if (rd >= R.length){
      done = true;
      elK.textContent = L({ es:'Completado', en:'Completed' });
      elK.className = 'gw-btn solved';
      say(host, 'good', L({
        es:'El mapa de los sismos es en realidad el mapa de los bordes de placa. Por eso se puede saber dónde conviene prepararse aunque nadie pueda decir cuándo.',
        en:'The map of earthquakes is really the map of plate boundaries. That is why it is possible to know where to get ready even though nobody can say when.'
      }));
      return;
    }
    locked = false; tries = 0; seed();
    elK.textContent = L({ es:'Comprobar', en:'Check' });
    elK.className = 'gw-btn';
    say(host, '', L({ es:'Cambia el mapa. Enciende otra vez las regiones activas.', en:'The map changes. Switch on the active regions again.' }));
    draw();
  }
  function close(cls, msg){
    locked = true;
    elK.textContent = (rd === R.length - 1) ? L({ es:'Terminar', en:'Finish' }) : L({ es:'Siguiente mapa', en:'Next map' });
    elK.className = 'gw-btn solved';
    draw();
    say(host, cls, msg);
  }
  function check(){
    if (done) return;
    if (locked){ advance(); return; }
    var falta = [], sobra = [], j;
    for (j = 0; j < items.length; j++){
      if (items[j].a && !on[j]) falta.push(j);
      if (!items[j].a && on[j]) sobra.push(j);
    }
    if (!falta.length && !sobra.length){ close('good', L(R[rd].why)); return; }
    tries++;
    if (tries >= 3){
      for (j = 0; j < items.length; j++) on[j] = items[j].a;
      var ej = falta.length ? falta[0] : sobra[0];
      close('warm', L({ es:'Así queda el mapa real. ', en:'This is how the real map looks. ' }) + L(items[ej].d.n) + ': ' + L(items[ej].d.w) + '.');
      return;
    }
    var msg;
    if (sobra.length) msg = L({ es:'Encendiste ', en:'You switched on ' }) + L(items[sobra[0]].d.n) + L({ es:', y esa región está lejos de cualquier borde de placa. Apágala.', en:', and that region is far from any plate boundary. Switch it off.' });
    else msg = L({ es:'Te falta encender ', en:'You still need to switch on ' }) + L(items[falta[0]].d.n) + L({ es:': busca las regiones que tocan un borde de placa.', en:': look for the regions touching a plate boundary.' });
    say(host, 'miss', msg);
    draw();
  }
  elK.addEventListener('click', check);
  say(host, '', L({ es:'Enciende las regiones activas y comprueba.', en:'Switch on the active regions and check.' }));
  draw();
}


/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 5 :: Arma la cadena que termina en un volcán
   ══════════════════════════════════════════════════════════════════════════ */
function w5(rng, host){
  var CH = [
    { t:{ es:'De la placa que se hunde al volcán', en:'From the sinking plate to the volcano' },
      steps:[
        { es:'La placa oceánica de Cocos se acerca a la Norteamericana y se hunde bajo ella.', en:'The oceanic Cocos plate approaches the North American one and sinks beneath it.' },
        { es:'Al descender arrastra agua y sedimentos hacia el interior caliente del planeta.', en:'As it goes down it drags water and sediment towards the hot interior of the planet.' },
        { es:'Con esa agua, la roca del manto se funde antes de lo normal y se forma magma.', en:'With that water, the mantle rock melts sooner than usual and magma forms.' },
        { es:'El magma es menos denso que la roca sólida, asciende por las grietas y llena una cámara.', en:'The magma is less dense than solid rock, rises through cracks and fills a chamber.' },
        { es:'Los gases empujan al magma hasta la superficie y el material se apila en un volcán.', en:'The gases push the magma to the surface and the material piles up into a volcano.' }
      ],
      why:{ es:'La cadena explica por qué los volcanes se alinean: solo aparecen donde una placa se hunde y fabrica magma bajo la superficie.',
            en:'The chain explains why volcanoes line up: they only appear where a plate sinks and manufactures magma below the surface.' } },
    { t:{ es:'El volcán que nació en un campo de cultivo', en:'The volcano born in a field' },
      steps:[
        { es:'Bajo el campo michoacano, el magma encuentra una fractura por donde subir.', en:'Under the Michoacan field, the magma finds a fracture to rise through.' },
        { es:'En febrero de 1943 el suelo se agrieta y empieza a salir ceniza caliente.', en:'In February 1943 the ground cracks open and hot ash starts to come out.' },
        { es:'Los fragmentos y la ceniza caen alrededor de la grieta y forman un cono.', en:'The fragments and the ash fall around the crack and form a cone.' },
        { es:'La lava avanza con lentitud y cubre las tierras de los alrededores.', en:'The lava advances slowly and covers the surrounding land.' },
        { es:'Al cesar la actividad queda un cono de varios cientos de metros de altura.', en:'When the activity stops a cone several hundred metres high is left.' }
      ],
      why:{ es:'El Paricutín permitió ver en directo lo que suele tardar milenios: un volcán nuevo levantándose sobre el arco volcánico del centro del país.',
            en:'Paricutin made it possible to watch live what usually takes millennia: a new volcano rising on the volcanic arc of the centre of the country.' } }
  ];
  var R = shuffle(CH, rng);
  var rd = 0, tries = 0, locked = false, done = false, ord = [], sel = -1;

  function seed(){
    var n = R[rd].steps.length, base = [];
    for (var i = 0; i < n; i++) base.push(i);
    do { ord = shuffle(base, rng); } while (ord[0] === 0 && ord[1] === 1);
    sel = -1;
  }
  seed();

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Arma la cadena en orden', en:'Put the chain in order' }) + '</div>' +
    '<div class="gw-q" data-r="q"></div>' +
    '<div class="gw-mini">' + L({ es:'Toca un paso y luego otro para intercambiarlos. Ordénalos desde lo que ocurre primero.', en:'Tap one step and then another to swap them. Order them starting from what happens first.' }) + '</div>' +
    '<div data-r="list"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Comprobar', en:'Check' }) + '</button></div>' +
    '<div class="gw-fb"></div>';

  var elQ = host.querySelector('[data-r="q"]'),
      list = host.querySelector('[data-r="list"]'),
      elK = host.querySelector('[data-r="chk"]');

  function draw(){
    elQ.innerHTML = L(R[rd].t);
    var h = '';
    for (var i = 0; i < ord.length; i++){
      var cls = 'ch-item' + (sel === i ? ' sel' : '') + ((locked || done) && ord[i] === i ? ' ok' : '');
      h += '<div class="' + cls + '" data-i="' + i + '"><div class="ch-n">' + (i + 1) + '</div><div>' + L(R[rd].steps[ord[i]]) + '</div></div>';
    }
    list.innerHTML = h;
    list.querySelectorAll('.ch-item').forEach(function(el){
      el.addEventListener('click', function(){
        if (locked || done) return;
        var k = parseInt(el.dataset.i, 10);
        if (sel === -1){ sel = k; draw(); return; }
        if (sel === k){ sel = -1; draw(); return; }
        var tmp = ord[sel]; ord[sel] = ord[k]; ord[k] = tmp;
        sel = -1;
        draw();
      });
    });
  }
  function advance(){
    rd++;
    if (rd >= R.length){
      done = true;
      elK.textContent = L({ es:'Completado', en:'Completed' });
      elK.className = 'gw-btn solved';
      say(host, 'good', L({
        es:'Las dos cadenas terminan igual: el magma solo llega a la superficie después de formarse abajo, y por eso los volcanes marcan los bordes activos.',
        en:'Both chains end the same way: magma only reaches the surface after forming below, and that is why volcanoes mark the active boundaries.'
      }));
      return;
    }
    locked = false; tries = 0; seed();
    elK.textContent = L({ es:'Comprobar', en:'Check' });
    elK.className = 'gw-btn';
    say(host, '', L({ es:'Otra cadena. Vuelve a ordenar los pasos.', en:'Another chain. Order the steps again.' }));
    draw();
  }
  function close(cls, msg){
    locked = true;
    elK.textContent = (rd === R.length - 1) ? L({ es:'Terminar', en:'Finish' }) : L({ es:'Siguiente cadena', en:'Next chain' });
    elK.className = 'gw-btn solved';
    draw();
    say(host, cls, msg);
  }
  function check(){
    if (done) return;
    if (locked){ advance(); return; }
    var bad = -1, i;
    for (i = 0; i < ord.length; i++) if (ord[i] !== i){ bad = i; break; }
    if (bad === -1){ close('good', L(R[rd].why)); return; }
    tries++;
    if (tries >= 3){
      for (i = 0; i < ord.length; i++) ord[i] = i;
      close('warm', L({ es:'Este es el orden real. ', en:'This is the real order. ' }) + L(R[rd].why));
      return;
    }
    var bien = 0;
    for (i = 0; i < ord.length; i++) if (ord[i] === i) bien++;
    say(host, 'miss', L({ es:'Tienes ', en:'You have ' }) + bien + L({ es:' pasos en su lugar. El que pusiste en el número ', en:' steps in place. The one you put at number ' }) + (bad + 1) +
      L({ es:' necesita que antes ocurra algo que todavía está más abajo en tu lista.', en:' needs something that is still further down your list to happen first.' }));
    draw();
  }
  elK.addEventListener('click', check);
  say(host, '', L({ es:'Ordena los pasos y comprueba.', en:'Order the steps and check.' }));
  draw();
}


/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 6 :: Modela un relieve con fuerzas internas y externas
   ══════════════════════════════════════════════════════════════════════════ */
function w6(rng, host){
  var AG = [
    { n:{ es:'Lluvia y ríos', en:'Rain and rivers' } },
    { n:{ es:'Viento', en:'Wind' } },
    { n:{ es:'Hielo', en:'Ice' } }
  ];
  var T = [
    { k:'sierra', n:{ es:'una sierra alta y de perfil recortado', en:'a high range with a jagged profile' },
      alt:[62, 100], rug:[58, 100], up:92, ag:0,
      why:{ es:'Una sierra joven aparece cuando las fuerzas internas levantan mucho y los agentes externos todavía no alcanzan a desgastarla. Así se ven las cumbres del Eje Neovolcánico.',
            en:'A young range appears when internal forces lift a great deal and external agents have not yet worn it down. That is how the summits of the volcanic belt look.' } },
    { k:'lomerio', n:{ es:'un lomerío de colinas suaves', en:'a landscape of soft rolling hills' },
      alt:[32, 58], rug:[22, 55], up:72, ag:2,
      why:{ es:'Un lomerío es el punto medio: hubo levantamiento, pero el agua y el viento llevan tiempo redondeando las formas. Las sierras viejas terminan con este perfil.',
            en:'Rolling hills are the middle point: there was uplift, but water and wind have been rounding the shapes for a long time. Old ranges end up with this profile.' } },
    { k:'llanura', n:{ es:'una llanura extensa y casi plana', en:'a wide and almost flat plain' },
      alt:[0, 26], rug:[0, 24], up:45, ag:3,
      why:{ es:'Una llanura es el resultado de millones de años de desgaste y de depósito sin levantamiento nuevo. Las llanuras costeras del Golfo se formaron así.',
            en:'A plain is the result of millions of years of wearing down and depositing with no new uplift. The coastal plains of the Gulf formed that way.' } }
  ];
  var R = shuffle(T, rng);
  var rd = 0, tries = 0, locked = false, done = false;
  var up = ri(rng, 20, 90), ag = [0, 0, 0];
  var base = [];
  for (var bi = 0; bi < 24; bi++) base.push(0.28 + rng() * 0.72);

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Modela el relieve', en:'Shape the relief' }) + '</div>' +
    '<div class="gw-q" data-r="q"></div>' +
    '<div class="gw-mini">' + L({ es:'La barra levanta el terreno desde dentro; los botones encienden los agentes externos que lo desgastan. Pista: levantamiento alto + pocos agentes = sierra alta y recortada; levantamiento bajo + varios agentes = llanura suave.', en:'The bar lifts the ground from within; the buttons switch on the external agents that wear it down. Hint: high uplift + few agents = high jagged range; low uplift + several agents = smooth plain.' }) + '</div>' +
    '<div class="rp" data-r="prof"></div>' +
    '<div class="rp-lbl"><span>' + L({ es:'nivel del mar', en:'sea level' }) + '</span><span data-r="tag"></span></div>' +
    '<div class="gw-lbl">' + L({ es:'Fuerzas internas: levantamiento', en:'Internal forces: uplift' }) + '</div>' +
    '<input class="gw-range" type="range" min="0" max="100" step="1" data-r="sl">' +
    '<div class="gw-lbl">' + L({ es:'Fuerzas externas: agentes que desgastan', en:'External forces: agents that wear down' }) + '</div>' +
    '<div class="gw-row" data-r="ags"></div>' +
    '<div class="metrics">' +
      '<div class="metric"><div class="mlbl">' + L({ es:'Altura media', en:'Mean height' }) + '</div><div class="mnum cs" data-r="m1"></div></div>' +
      '<div class="metric"><div class="mlbl">' + L({ es:'Perfil recortado', en:'Jagged profile' }) + '</div><div class="mnum ps" data-r="m2"></div></div>' +
      '<div class="metric"><div class="mlbl">' + L({ es:'Agentes activos', en:'Active agents' }) + '</div><div class="mnum ts" data-r="m3"></div></div>' +
    '</div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Comprobar', en:'Check' }) + '</button></div>' +
    '<div class="gw-fb"></div>';

  var elQ = host.querySelector('[data-r="q"]'),
      prof = host.querySelector('[data-r="prof"]'),
      elS = host.querySelector('[data-r="sl"]'),
      ags = host.querySelector('[data-r="ags"]'),
      elK = host.querySelector('[data-r="chk"]'),
      elTag = host.querySelector('[data-r="tag"]'),
      m1 = host.querySelector('[data-r="m1"]'),
      m2 = host.querySelector('[data-r="m2"]'),
      m3 = host.querySelector('[data-r="m3"]');

  function nAg(){ return ag[0] + ag[1] + ag[2]; }
  function altura(){ return Math.round(up * (1 - 0.20 * nAg())); }
  function rugo(){ return Math.round(up * Math.max(0, 100 - 30 * nAg()) / 100); }
  function draw(){
    elQ.innerHTML = L({ es:'Consigue ', en:'Produce ' }) + L(R[rd].n) + '.';
    var e = nAg(), s = e / 3, h = '';
    for (var i = 0; i < base.length; i++){
      var v = base[i] * (1 - s) + 0.55 * s;
      var px = 6 + v * (up / 100) * (1 - 0.20 * e) * 118;
      h += '<div class="rp-b" style="height:' + px.toFixed(1) + 'px"></div>';
    }
    prof.innerHTML = h;
    elS.value = up;
    m1.textContent = altura();
    m2.textContent = rugo();
    m3.textContent = e + ' / 3';
    elTag.textContent = L({ es:'levantamiento ', en:'uplift ' }) + up;
    var ah = '';
    for (var j = 0; j < AG.length; j++) ah += '<button class="gw-btn' + (ag[j] ? ' on' : '') + '" data-a="' + j + '"' + (locked || done ? ' disabled' : '') + '>' + L(AG[j].n) + '</button>';
    ags.innerHTML = ah;
    ags.querySelectorAll('.gw-btn').forEach(function(b){
      b.addEventListener('click', function(){
        if (locked || done) return;
        var k = parseInt(b.dataset.a, 10);
        ag[k] = ag[k] ? 0 : 1;
        draw();
      });
    });
  }
  function advance(){
    rd++;
    if (rd >= R.length){
      done = true; elS.disabled = true;
      elK.textContent = L({ es:'Completado', en:'Completed' });
      elK.className = 'gw-btn solved';
      say(host, 'good', L({
        es:'Ya viste la competencia completa: lo que se levanta desde dentro y lo que se desgasta desde fuera. El relieve de cualquier lugar es el marcador de ese partido en un momento dado.',
        en:'You have now seen the whole contest: what is lifted from within and what is worn away from outside. The relief of any place is the scoreboard of that match at a given moment.'
      }));
      return;
    }
    locked = false; tries = 0; up = ri(rng, 20, 90); ag = [0, 0, 0];
    elK.textContent = L({ es:'Comprobar', en:'Check' });
    elK.className = 'gw-btn';
    say(host, '', L({ es:'Nuevo paisaje por conseguir.', en:'A new landscape to produce.' }));
    draw();
  }
  function close(cls, msg){
    locked = true;
    elK.textContent = (rd === R.length - 1) ? L({ es:'Terminar', en:'Finish' }) : L({ es:'Siguiente paisaje', en:'Next landscape' });
    elK.className = 'gw-btn solved';
    draw();
    say(host, cls, msg);
  }
  function check(){
    if (done) return;
    if (locked){ advance(); return; }
    var g = R[rd], a = altura(), r = rugo();
    if (a >= g.alt[0] && a <= g.alt[1] && r >= g.rug[0] && r <= g.rug[1]){ close('good', L(g.why)); return; }
    tries++;
    if (tries >= 3){
      up = g.up; ag = [g.ag > 0 ? 1 : 0, g.ag > 1 ? 1 : 0, g.ag > 2 ? 1 : 0];
      close('warm', L({ es:'Este es un ajuste que lo consigue. ', en:'This is one setting that produces it. ' }) + L(g.why));
      return;
    }
    var msg;
    if (a < g.alt[0]) msg = L({ es:'Tu terreno quedó demasiado bajo. Sube el levantamiento o apaga algún agente externo.', en:'Your ground came out too low. Raise the uplift or switch off an external agent.' });
    else if (a > g.alt[1]) msg = L({ es:'Tu terreno quedó demasiado alto. Baja el levantamiento o enciende más agentes externos.', en:'Your ground came out too high. Lower the uplift or switch on more external agents.' });
    else if (r < g.rug[0]) msg = L({ es:'La altura ya sirve, pero el perfil está demasiado suave: los agentes externos lo están redondeando de más.', en:'The height works now, but the profile is too smooth: the external agents are rounding it too much.' });
    else msg = L({ es:'La altura ya sirve, pero el perfil está demasiado recortado: hace falta que algún agente externo lo desgaste.', en:'The height works now, but the profile is too jagged: some external agent needs to wear it down.' });
    say(host, 'miss', msg);
    draw();
  }
  elS.addEventListener('input', function(){
    if (done || locked){ elS.value = up; return; }
    up = parseInt(elS.value, 10);
    draw();
  });
  elK.addEventListener('click', check);
  say(host, '', L({ es:'Mueve el levantamiento, enciende agentes y comprueba.', en:'Move the uplift, switch on agents and check.' }));
  draw();
}

<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbzLGV15JRTPs9bbSvHRLfgOXeT9oUExDf1AH546WOwq5tYxXSdhX212OWi_bTJfMGx9/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'Dinámica de Placas Tectónicas y Distribución del Relieve';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
