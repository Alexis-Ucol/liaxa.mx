      es:'Cerca del 60 % de tu masa corporal es agua, y no está ahí de adorno. Es el disolvente en el que viajan la glucosa, los iones minerales y los desechos; participa como reactivo en la digestión, cuando una molécula grande se parte al incorporar agua; y es el vehículo que saca calor del cuerpo, porque evaporar sudor cuesta energía y esa energía se toma de tu piel. Nada de esto aporta kcal: el agua no se oxida, no tiene cadenas de carbono e hidrógeno que quemar.',
      en:'Close to 60 % of your body mass is water, and it is not there for decoration. It is the solvent in which glucose, mineral ions and waste travel; it takes part as a reactant in digestion, when a large molecule splits by taking in water; and it is the vehicle that pulls heat out of the body, because evaporating sweat costs energy and that energy is taken from your skin. None of this provides kcal: water is not oxidized, it has no carbon and hydrogen chains to burn.'
    }) + '</p>' +
    '<p>' + L({
      es:'El agua se pierde todo el día por la orina, la respiración y la piel, y ese gasto sube con el calor y con la actividad, cuando el sudor puede llevarse más de un litro por hora de esfuerzo intenso. Si lo que entra no acompaña a lo que sale, el volumen de líquido baja, el riñón concentra la orina y aparecen sed, boca seca, dolor de cabeza y menor rendimiento. Reponer con agua simple potable cierra el balance sin añadir nada más; reponer con bebidas azucaradas cierra el mismo balance de líquido pero suma la energía del azúcar, 4 kcal por gramo, sin traer vitaminas ni minerales.',
      en:'Water is lost all day long through urine, breathing and skin, and that outflow rises with heat and with activity, when sweat can carry off more than a litre per hour of intense effort. If what comes in does not keep up with what goes out, the fluid volume drops, the kidney concentrates the urine and thirst, dry mouth, headache and lower performance appear. Replacing with plain drinking water closes the balance without adding anything else; replacing with sugary drinks closes the same fluid balance but adds the energy of the sugar, 4 kcal per gram, without bringing vitamins or minerals.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Disolvente', en:'Solvent' }), '0 kcal', L({ es:'sin ella las sustancias no se encuentran ni reaccionan', en:'without it substances do not meet or react' })) +
      rcard(L({ es:'Transporte', en:'Transport' }), L({ es:'entra y sale', en:'in and out' }), L({ es:'lleva nutrimentos y retira desechos', en:'it carries nutrients and removes waste' })) +
      rcard(L({ es:'Temperatura', en:'Temperature' }), L({ es:'sudor', en:'sweat' }), L({ es:'evaporarse cuesta energía y enfría la piel', en:'evaporating costs energy and cools the skin' })) +
      rcard(L({ es:'Balance del día', en:'Balance of the day' }), L({ es:'entra = sale', en:'in = out' }), L({ es:'sube con el calor y con la actividad física', en:'it rises with heat and with physical activity' })) +
    '</div>' +
    '<div class="callout"><p>' + L({
      es:'La sed llega cuando el desequilibrio ya empezó. Por eso en un día de calor o de partido se repone antes de tenerla.',
      en:'Thirst arrives when the imbalance has already started. That is why on a hot day or a match day you replace before feeling it.'
    }) + '</p></div>'
  );
  wHidro(rng, widgetHost(s3, 'wHidro', 'hidratacion'));
  addProblem(rng, mkP5(rng));
  addProblem(rng, mkP6(rng));

  /* ══ CONCEPTO 4 ══ */
  var s4 = sec(
    L({ es:'Concepto 4', en:'Concept 4' }),
    L({ es:'El aporte de un alimento se juzga frente a lo que te mueves', en:'The contribution of a food is judged against how much you move' }),
    '<p>' + L({
      es:'El aporte energético de un alimento se calcula con los gramos de su etiqueta: 4 kcal por cada gramo de carbohidrato, 4 por cada gramo de proteína y 9 por cada gramo de lípido. Ese número por sí solo no dice si un alimento sobra o falta; hay que ponerlo frente al gasto de quien lo come. El gasto tiene dos partes: la de reposo, entre 1400 y 1700 kcal al día en un adolescente, que ocurre aunque la persona esté sentada, y la de la actividad física, que se suma minuto a minuto. Una caminata rápida gasta alrededor de 5 kcal por minuto, la bicicleta cerca de 8 y la carrera unas 10.',
      en:'The energy contribution of a food is worked out from the grams on its label: 4 kcal for each gram of carbohydrate, 4 for each gram of protein and 9 for each gram of lipid. That number on its own does not say whether a food is too much or too little; it has to be set against the expenditure of whoever eats it. The expenditure has two parts: the resting one, between 1400 and 1700 kcal a day in a teenager, which happens even while the person is sitting, and the physical activity one, which adds up minute by minute. A brisk walk spends around 5 kcal per minute, cycling close to 8 and running about 10.'
    }) + '</p>' +
    '<p>' + L({
      es:'Comparar lo que entra con lo que sale da el balance de energía: si entra más, el excedente se guarda como reserva de grasa; si entra menos, el cuerpo gasta lo que tenía almacenado; y si las dos cantidades se parecen, el peso se mantiene. Eso permite tomar decisiones concretas: convertir un alimento en minutos de movimiento, o decidir cuánto se come un día de partido frente a un día de escritorio. Pero el balance solo mide cantidad. La calidad se revisa aparte, con las preguntas de los conceptos anteriores: qué vitaminas y minerales trae ese menú y con qué se está reponiendo el agua del día.',
      en:'Comparing what comes in with what goes out gives the energy balance: if more comes in, the surplus is stored as a fat reserve; if less comes in, the body spends what it had stored; and if the two amounts are alike, weight holds steady. That allows concrete decisions: turning a food into minutes of movement, or deciding how much to eat on a match day against a desk day. But the balance only measures quantity. Quality is checked separately, with the questions of the previous concepts: which vitamins and minerals that menu brings and what the water of the day is being replaced with.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Aporte del alimento', en:'Contribution of the food' }), '4 · 4 · 9', L({ es:'kcal por gramo de carbohidrato, proteína y lípido', en:'kcal per gram of carbohydrate, protein and lipid' })) +
      rcard(L({ es:'Gasto en reposo', en:'Resting expenditure' }), '1400 a 1700 kcal', L({ es:'ocurre todo el día, incluso sentado', en:'it happens all day, even sitting down' })) +
      rcard(L({ es:'Actividad física', en:'Physical activity' }), L({ es:'5 · 8 · 10 kcal/min', en:'5 · 8 · 10 kcal/min' }), L({ es:'caminata rápida, bicicleta y carrera', en:'brisk walk, cycling and running' })) +
      rcard(L({ es:'Balance', en:'Balance' }), L({ es:'entra menos sale', en:'in minus out' }), L({ es:'el excedente se guarda, el faltante sale de la reserva', en:'the surplus is stored, the shortfall comes from the reserve' })) +
    '</div>' +
    '<div class="callout"><p>' + L({
      es:'El mismo plato puede sobrar un día y quedarse corto al siguiente. No cambió el alimento: cambió lo que hiciste con él.',
      en:'The same plate can be too much one day and fall short the next. The food did not change: what changed is what you did with it.'
    }) + '</p></div>'
  );
  wMinutos(rng, widgetHost(s4, 'wMinutos', 'actividad'));
  addProblem(rng, mkP7(rng));
  addProblem(rng, mkP8(rng));

  /* ══ CIERRE ══ */
  wCuaderno(rng, widgetHost(null, 'wCuaderno', 'reflect'));
  addProblem(rng, mkP9(rng));
  addProblem(rng, mkP10(rng));
}

</script>

<!-- LIAXA ANALYTICS -->
<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbztwM8nSIbA895DNHtDQGU9fYXDiK9QpxSCUjnBwP1XkAZtJ2B2eIUOgGHmZz8wVQSx/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
