function buildLesson(rng) {
  /*
   * CONCEPT ARC
   * topic        : Pricing Math in Business — Markup, Margin, Discounts, Taxes
   * prerequisite : Basic algebra; ability to multiply and divide decimals.
   * sequence     :
   *   1. How businesses set prices — the markup decision (context-first)
   *   2. Gross margin — reading profitability from the income side
   *   3. Discount strategy — single and compound discounts in retail/supply chain
   *   4. Tax pass-through — how IVA/sales tax flows through the pricing chain
   *   5. Full pricing chain — real business scenarios combining all four
   * why_this_order: Markup is the entry point (businesses price before they sell);
   *   margin requires knowing markup to contrast the two bases; discounts require
   *   understanding the factor structure before composing two reductions; tax is
   *   always last in the chain, so it comes last conceptually.
   */
  var lb = document.getElementById('lessonBody');
  lb.innerHTML = '';
  problems = []; sectionDefs = []; widgets = [];

  /* ── Scenario pools (picked by seed) ── */
  var retailScenarios = [
    {name:'Zara Home', type:'Retail — home goods', icon:'🏠', product:'decorative vase'},
    {name:'TechZone', type:'Retail — electronics', icon:'💻', product:'wireless headphones'},
    {name:'Fresh & Co.', type:'Grocery retail', icon:'🥑', product:'specialty produce pack'},
    {name:'SportMax', type:'Sporting goods', icon:'⚽', product:'running shoes'},
    {name:'Bella Cucina', type:'Restaurant supply', icon:'🍽️', product:'kitchen equipment set'},
  ];
  var restaurantScenarios = [
    {name:'La Palapa', type:'Casual dining', icon:'🌮', product:'signature taco plate'},
    {name:'The Corner Café', type:'Coffee shop', icon:'☕', product:'specialty latte'},
    {name:'Sakura Grill', type:'Japanese restaurant', icon:'🍱', product:'bento box lunch'},
  ];
  var supplyScenarios = [
    {name:'ProBuild Supply', type:'Building materials distributor', icon:'🏗️', product:'lumber bundle'},
    {name:'MediCare Logistics', type:'Medical supply distributor', icon:'🏥', product:'PPE kit'},
    {name:'AgriDirect', type:'Agricultural supply', icon:'🌾', product:'fertilizer pallet'},
  ];

  var sc1 = pick(retailScenarios, rng);
  var sc2 = pick(restaurantScenarios, rng);
  var sc3 = pick(supplyScenarios, rng);

  /* ── Random numbers ── */
  var cost1 = ri(rng,120,980),  rate1 = ri(rng,18,55);
  var cost2 = ri(rng,8,45),     rate2 = ri(rng,200,400);  // restaurant: cost low, markup high
  var cost3 = ri(rng,200,1200), rate3 = ri(rng,15,40);
  var sp1 = cost1*(1+rate1/100), margin1 = (sp1-cost1)/sp1*100;
  var sp2 = cost2*(1+rate2/100), margin2 = (sp2-cost2)/sp2*100;
  var sp3 = cost3*(1+rate3/100), margin3 = (sp3-cost3)/sp3*100;
  var listD = ri(rng,500,2500), d1 = ri(rng,10,25), d2 = ri(rng,5,18);
  var aft1 = listD*(1-d1/100), finalD = aft1*(1-d2/100);
  var equiv = (1-(1-d1/100)*(1-d2/100))*100;
  var preT = ri(rng,300,1400), taxR = 16, totalT = preT*1.16;
  var listFull = ri(rng,800,2500), dFull = ri(rng,10,30), totalFull = listFull*(1-dFull/100)*1.16;

  /* Problem seeds */
  var p1c=ri(rng,150,900),p1r=ri(rng,20,55),p1sp=p1c*(1+p1r/100);
  var p2sp=ri(rng,400,1800),p2c=Math.round(p2sp*(ri(rng,35,65)/100)),p2m=(p2sp-p2c)/p2sp*100;
  var p3sp=ri(rng,600,2000),p3m=ri(rng,22,55),p3c=p3sp*(1-p3m/100);
  var p4c=ri(rng,200,1000),p4r=ri(rng,20,60),p4sp=p4c*(1+p4r/100),p4mg=(p4sp-p4c)/p4sp*100;
  var p5l=ri(rng,500,2500),p5d1=ri(rng,10,25),p5d2=ri(rng,8,20),p5f=p5l*(1-p5d1/100)*(1-p5d2/100);
  var p5eq=(1-(1-p5d1/100)*(1-p5d2/100))*100;
  var p6pre=ri(rng,300,1500),p6tot=p6pre*1.16;
  var p7l=ri(rng,600,2000),p7d=ri(rng,10,30),p7tot=p7l*(1-p7d/100)*1.16;
  var p8tot=ri(rng,600,2200),p8pre=p8tot/1.16;
  var p9c=ri(rng,50,400),p9r=ri(rng,150,350),p9sp=p9c*(1+p9r/100),p9mg=(p9sp-p9c)/p9sp*100;
  var p10l=ri(rng,1000,4000),p10d1=ri(rng,10,20),p10d2=ri(rng,5,15),p10f=p10l*(1-p10d1/100)*(1-p10d2/100)*1.16;

  /* ══════════════════════════════════════════
     SECTION 1 — Markup: How businesses set prices
  ══════════════════════════════════════════ */
  addSection(function(L){

  problems.push({i18n:{title:{es:'Cadena completa: 2 descuentos + IVA',en:'Full chain: 2 discounts + IVA'},q:{es:'Una orden tiene precio de lista <strong>$'+p10l+'</strong>. Descuento comercial: <strong>'+p10d1+'%</strong>. Descuento por volumen: <strong>'+p10d2+'%</strong>. IVA: <strong>16%</strong>. ¿Total a pagar?',en:'An order has a list price of <strong>$'+p10l+'</strong>. Trade discount: <strong>'+p10d1+'%</strong>. Volume discount: <strong>'+p10d2+'%</strong>. IVA: <strong>16%</strong>. What is the total payable?'},hint:{es:'Aplica D1, luego D2, luego IVA. Nunca sumes los descuentos.',en:'Apply D1, then D2, then IVA. Never add the discounts together.'},exp:{es:'$'+p10l+'×'+(1-p10d1/100).toFixed(2)+'×'+(1-p10d2/100).toFixed(2)+'='+'$'+(p10l*(1-p10d1/100)*(1-p10d2/100)).toFixed(2)+' × 1.16 = <strong>$'+p10f.toFixed(2)+'</strong>.',en:'$'+p10l+'×'+(1-p10d1/100).toFixed(2)+'×'+(1-p10d2/100).toFixed(2)+'='+'$'+(p10l*(1-p10d1/100)*(1-p10d2/100)).toFixed(2)+' × 1.16 = <strong>$'+p10f.toFixed(2)+'</strong>.'},opts:{es:o10.es,en:o10.en}},title:'Full chain: 2 discounts + IVA',questionText:'An order has a list price of <strong>$'+p10l+'</strong>. Trade discount: <strong>'+p10d1+'%</strong>. Volume discount: <strong>'+p10d2+'%</strong>. IVA: <strong>16%</strong>. What is the total payable?',options:o10.en,correctIdx:o10.correctIdx,explanation:'$'+p10l+'×'+(1-p10d1/100).toFixed(2)+'×'+(1-p10d2/100).toFixed(2)+'=$'+(p10l*(1-p10d1/100)*(1-p10d2/100)).toFixed(2)+' × 1.16 = <strong>$'+p10f.toFixed(2)+'</strong>.',hint:'D1 → D2 → IVA. Never add discounts.',showWork:true,fn:'',studentChoice:null,pendingChoice:null});
  buildOneCard(problems[problems.length-1],problems.length-1);
}

function generatePDF(){
  var btn=document.getElementById('dlBtn');
  if(!window.jspdf){
    btn.textContent='Cargando PDF...' ;btn.disabled=true;
    var s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
    s.onload=function(){_doPDF();};
    s.onerror=function(){btn.textContent='PDF no disponible sin conexión';btn.disabled=false;};
    document.head.appendChild(s);return;
  }
  _doPDF();
}
function _doPDF(){
  var btn=document.getElementById('dlBtn');
  var name=studentData.name||'',group=studentData.group||'';
  btn.textContent=t('pdf-busy');btn.disabled=true;
  try{
    var jspdf=window.jspdf;var doc=new jspdf.jsPDF({orientation:'portrait',unit:'mm',format:'letter'});
    var PW=215.9,PH=279.4,M=18,TW=PW-M*2,y=0;
    var pBR=SCHOOL.pBR,pBG=SCHOOL.pBG,pBB=SCHOOL.pBB,pAR=SCHOOL.pAR,pAG=SCHOOL.pAG,pAB=SCHOOL.pAB;
    doc.setFillColor(pBR,pBG,pBB);doc.rect(0,0,PW,16,'F');
    doc.setTextColor(255,255,255);doc.setFontSize(11);doc.setFont('helvetica','bold');
    doc.text(SCHOOL.guideTitle[LANG],M,11);y=24;
    doc.setTextColor(20,24,32);doc.setFontSize(9);doc.setFont('helvetica','normal');
    doc.text((LANG==='es'?'Alumno: ':'Student: ')+name+'   '+(LANG==='es'?'Grupo: ':'Group: ')+group,M,y);y+=6;
    doc.text(new Date().toLocaleDateString(LANG==='es'?'es-MX':'en-US'),M,y);y+=10;
    var code=name.split(' ').map(function(w){return w[0]||'';}).join('').toUpperCase()+group.replace(/\s/g,'').toUpperCase();
    doc.setFontSize(14);doc.setFont('helvetica','bold');doc.setTextColor(pBR,pBG,pBB);
    doc.text(correctCount+'/'+problems.length+(LANG==='es'?' correctas':' correct'),PW/2,y+8,{align:'center'});y+=22;
    problems.forEach(function(p,i){
      if(y>PH-45){doc.addPage();y=20;}
      var ok=p.studentChoice===p.correctIdx;
      doc.setFillColor(ok?45:139,ok?106:37,ok?79:0);doc.rect(M,y,TW,7,'F');
      doc.setTextColor(255,255,255);doc.setFontSize(8);doc.setFont('helvetica','bold');
      doc.text((LANG==='es'?'Reactivo ':'Item ')+(i+1)+': '+p.title,M+2,y+5);y+=10;
      doc.setTextColor(20,24,32);doc.setFontSize(7.5);doc.setFont('helvetica','normal');
      var qLines=doc.splitTextToSize(p.questionText.replace(/<[^>]+>/g,''),TW-4);
      qLines.slice(0,3).forEach(function(ln){if(y>PH-15){doc.addPage();y=20;}doc.text(ln,M+2,y);y+=4.5;});
      doc.setTextColor(pBR,pBG,pBB);doc.setFontSize(7);
      var expLines=doc.splitTextToSize((LANG==='es'?'Solución: ':'Solution: ')+p.explanation.replace(/<[^>]+>/g,''),TW-4);
      expLines.slice(0,2).forEach(function(ln){if(y>PH-15){doc.addPage();y=20;}doc.text(ln,M+2,y);y+=4;});
      var dc=document.getElementById('dc'+i);
      if(dc&&dc.width){try{var ar=dc.height/dc.width,iw=TW,ih=Math.min(iw*ar,45);doc.addImage(dc.toDataURL('image/png'),'PNG',M,y,iw,ih);y+=ih+3;}catch(e){}}
      var ta=document.getElementById('ta'+i);
      if(ta&&ta.value.trim()){doc.setTextColor(20,24,32);doc.setFontSize(7.5);doc.setFont('courier','normal');var taLines=doc.splitTextToSize(ta.value,TW);taLines.slice(0,8).forEach(function(ln){if(y>PH-15){doc.addPage();y=20;}doc.text(ln,M,y);y+=4.5;});}
      y+=3;
    });
    var pages=doc.internal.getNumberOfPages();
    for(var pg=1;pg<=pages;pg++){doc.setPage(pg);doc.setFillColor(pAR,pAG,pAB);doc.rect(0,PH-3,PW,3,'F');doc.setTextColor(130,140,160);doc.setFontSize(6.5);doc.setFont('helvetica','normal');doc.text(name+' · '+group+' · '+t('pdf-code')+code+' · '+t('pdf-page')+pg+'/'+pages,PW/2,PH-5,{align:'center'});}
    var _fn=SCHOOL.filePrefix+'_'+name.replace(/\s+/g,'_')+'_'+group.replace(/\s+/g,'_')+'.pdf';
    var _blob=doc.output('blob');
    function _rb(){btn.textContent=t('btn-pdf');btn.disabled=false;}
    function _oi(b){var u=URL.createObjectURL(b);var w=window.open(u,'_blank');if(!w){window.location.href=u;}setTimeout(function(){URL.revokeObjectURL(u);},60000);}
    var _isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
    if(_isIOS){var _file=new File([_blob],_fn,{type:'application/pdf'});if(navigator.canShare&&navigator.canShare({files:[_file]})){navigator.share({files:[_file],title:_fn}).then(_rb).catch(function(e){if(e&&e.name==='AbortError'){_rb();return;}_oi(_blob);_rb();});return;}_oi(_blob);_rb();return;}
    var _u=URL.createObjectURL(_blob);var _a=document.createElement('a');_a.href=_u;_a.download=_fn;document.body.appendChild(_a);_a.click();setTimeout(function(){document.body.removeChild(_a);URL.revokeObjectURL(_u);},200);_rb();
  }catch(err){btn.textContent=t('btn-pdf');btn.disabled=false;}
}
