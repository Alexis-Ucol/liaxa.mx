      o:{ es:['Porque en esos territorios los pueblos vivían mezclados, de modo que cada frontera nueva dejó minorías descontentas dentro de otro Estado.',
              'Porque los nuevos países se negaron a dibujar cualquier frontera y dejaron el territorio sin dividir.',
              'Porque las conferencias de paz decidieron mantener intactos los cuatro imperios anteriores.',
              'Porque en esa región no vivía población suficiente para formar Estados independientes.'],
          en:['Because in those territories peoples lived intermingled, so every new border left discontented minorities inside another state.',
              'Because the new countries refused to draw any border and left the territory undivided.',
              'Because the peace conferences decided to keep the four earlier empires intact.',
              'Because that region did not have enough population to form independent states.'] }, c:0,
      h:{ es:'Imagina una región donde en la misma ciudad conviven familias de tres lenguas distintas y pregúntate dónde trazarías la línea.',
          en:'Picture a region where families of three different languages share the same city, and ask where you would draw the line.' },
      e:{ es:'El principio era claro sobre el papel, pero el mapa real no lo era: en Europa central los pueblos estaban entrelazados y ninguna línea podía separarlos limpiamente. Cada Estado nuevo quedó con minorías dentro y con vecinos que reclamaban territorios, lo que alimentó conflictos posteriores.',
          en:'The principle was clear on paper, but the real map was not: in central Europe peoples were interwoven and no line could separate them cleanly. Every new state was left with minorities inside and with neighbours claiming territory, which fed later conflicts.' } }
  ];
  var v8 = pickVariant(p8v, rng);
  addProblem({ title:L({ es:'Lo que decidió el tratado', en:'What the treaty decided' }), questionText:L(v8.q), options:L(v8.o), correct:v8.c, hint:L(v8.h), explanation:L(v8.e) }, rng);

  /* ══════════════════ CIERRE ══════════════════ */
  addSection(L({ es:'Cierre', en:'Closing' }), L({ es:'Del disparo al mapa nuevo', en:'From the shot to the new map' }),
    L({ es:'<p>Las dos preguntas siguientes recorren todo el proceso que acabas de trabajar.</p>',
          en:'<p>The two questions that follow run across the whole process you have just worked through.</p>' }));

  /* ── graded 9 ── */
  var p9v = [
    { q:{ es:'La Sociedad de Naciones se fundó en 1919 con la idea de que los países resolvieran sus diferencias hablando en lugar de pelear. ¿Qué debilidad se le señala con más frecuencia?',
          en:'The League of Nations was founded in 1919 with the idea that countries would settle their differences by talking instead of fighting. What weakness is most often pointed out?' },
      o:{ es:['Potencias importantes quedaron fuera de ella y no contaba con medios propios para hacer cumplir sus decisiones.',
              'Prohibía a los países firmar cualquier acuerdo comercial entre ellos sin su permiso.',
              'Obligaba a todos sus miembros a mantener ejércitos del mismo tamaño exacto.',
              'Se dedicaba únicamente a asuntos de salud y no admitía discutir temas políticos.'],
          en:['Important powers stayed outside it and it had no means of its own to enforce its decisions.',
              'It forbade countries from signing any trade agreement without its permission.',
              'It required all its members to keep armies of exactly the same size.',
              'It dealt only with health matters and did not allow political questions to be discussed.'] }, c:0,
      h:{ es:'Pregúntate quién se sentaba en la mesa y qué podía hacer ese organismo si un país decidía desobedecerlo.',
          en:'Ask who sat at the table and what that body could do if a country decided to disobey it.' },
      e:{ es:'La idea era nueva y valiosa, pero el organismo nació sin varias de las mayores potencias y sin fuerza propia. Cuando un Estado decidía ignorar sus resoluciones, la Sociedad solo podía recomendar, y eso limitó su capacidad para evitar nuevos conflictos.',
          en:'The idea was new and valuable, but the body was born without several of the greatest powers and with no force of its own. When a state chose to ignore its resolutions, the League could only recommend, and that limited its ability to prevent new conflicts.' } },
    { q:{ es:'En 1917 ocurrieron dos hechos decisivos: una revolución sacó a Rusia del conflicto y Estados Unidos entró en la guerra del lado contrario a Alemania. ¿Qué efecto combinado tuvieron?',
          en:'In 1917 two decisive events took place: a revolution took Russia out of the conflict and the United States entered the war against Germany. What combined effect did they have?' },
      o:{ es:['Alemania pudo trasladar tropas del este al oeste, pero enfrentó los recursos y los soldados estadounidenses, que terminaron inclinando la balanza.',
              'Los dos bandos acordaron un alto al fuego inmediato que se mantuvo hasta la firma de la paz.',
              'La guerra se trasladó por completo al continente americano durante el último año de combates.',
              'Alemania quedó sin enemigos en Europa y ocupó París antes de que terminara ese mismo año.'],
          en:['Germany could move troops from east to west, but faced American resources and soldiers, which finally tipped the balance.',
              'Both sides agreed on an immediate ceasefire that lasted until peace was signed.',
              'The war moved entirely to the American continent during the last year of fighting.',
              'Germany was left with no enemies in Europe and occupied Paris before that year ended.'] }, c:0,
      h:{ es:'Considera qué ganaba Alemania al cerrarse un frente y qué perdía al abrirse un adversario nuevo con enorme capacidad industrial.',
          en:'Consider what Germany gained when one front closed and what it lost when a new opponent with huge industrial capacity appeared.' },
      e:{ es:'La salida rusa liberó divisiones alemanas para una última ofensiva en el oeste, pero llegó tarde: Estados Unidos aportaba dinero, alimentos, armas y soldados frescos a un adversario agotado. Ese contraste decidió el resultado en 1918.',
          en:'The Russian exit freed German divisions for a last offensive in the west, but it came too late: the United States was supplying money, food, weapons and fresh soldiers to an exhausted opponent. That contrast decided the outcome in 1918.' } }
  ];
  var v9 = pickVariant(p9v, rng);
  addProblem({ title:L({ es:'Después del armisticio', en:'After the armistice' }), questionText:L(v9.q), options:L(v9.o), correct:v9.c, hint:L(v9.h), explanation:L(v9.e) }, rng);

  /* ── graded 10 ── */
  var p10v = [
    { q:{ es:'En 1917 el gobierno alemán propuso en secreto una alianza a México y le ofreció apoyo para recuperar territorios perdidos frente a Estados Unidos. El mensaje fue interceptado, el gobierno de Venustiano Carranza no aceptó la propuesta y México se mantuvo neutral. ¿Qué muestra este episodio sobre el conflicto?',
          en:'In 1917 the German government secretly proposed an alliance to Mexico and offered support to recover territories lost to the United States. The message was intercepted, the government of Venustiano Carranza did not accept the proposal and Mexico stayed neutral. What does this episode show about the conflict?' },
      o:{ es:['Que la guerra europea tenía alcance mundial y buscaba arrastrar a países de otros continentes según conviniera a cada bando.',
              'Que México envió tropas al frente occidental y participó en las batallas de 1917 y 1918.',
              'Que Estados Unidos y México firmaron entonces una alianza militar contra Alemania.',
              'Que las decisiones de la guerra se tomaban en el continente americano y no en Europa.'],
          en:['That the European war had worldwide reach and tried to drag in countries from other continents as it suited each side.',
              'That Mexico sent troops to the western front and took part in the battles of 1917 and 1918.',
              'That the United States and Mexico then signed a military alliance against Germany.',
              'That the decisions of the war were taken on the American continent and not in Europe.'] }, c:0,
      h:{ es:'Fíjate en lo que hizo cada gobierno según el texto y no en lo que podría haber pasado si la propuesta hubiera sido aceptada.',
          en:'Focus on what each government actually did according to the text, not on what might have happened if the proposal had been accepted.' },
      e:{ es:'La propuesta buscaba abrir un problema a Estados Unidos en su frontera sur para retrasar su entrada en Europa. México no aceptó y se mantuvo neutral, pero el episodio muestra hasta dónde llegaban las maniobras de una guerra que se llamó mundial con razón.',
          en:'The proposal sought to open a problem for the United States on its southern border in order to delay its entry into Europe. Mexico did not accept and stayed neutral, but the episode shows how far the manoeuvres of a war rightly called world wide could reach.' } },
    { q:{ es:'Muchos libros afirman que el siglo XX de las tensiones comienza con la Primera Guerra Mundial y no con el año 1900. ¿Qué sostiene mejor esa afirmación?',
          en:'Many books state that the twentieth century of tensions begins with the First World War and not with the year 1900. What best supports that claim?' },
      o:{ es:['De ella salieron un mapa europeo nuevo, sociedades transformadas y un acuerdo de paz inestable que preparó el terreno para otro conflicto mundial.',
              'Fue el primer conflicto de la historia en el que participaron más de dos países a la vez.',
              'Con ella terminaron para siempre las guerras entre potencias industriales europeas.',
              'Durante esos años no ocurrió ningún otro cambio político ni social en el mundo.'],
          en:['Out of it came a new European map, transformed societies and an unstable peace settlement that prepared the ground for another world conflict.',
              'It was the first conflict in history in which more than two countries took part at once.',
              'With it, wars between European industrial powers ended for ever.',
              'During those years no other political or social change took place in the world.'] }, c:0,
      h:{ es:'Una afirmación así se sostiene mostrando qué quedó después y qué consecuencias tuvo, no repitiendo cuándo empezó.',
          en:'A claim like this is supported by showing what was left afterwards and what consequences it had, not by repeating when it started.' },
      e:{ es:'La guerra rehízo fronteras, derrumbó imperios, cambió el papel del Estado y de las mujeres en la sociedad y dejó un acuerdo de paz que pocos aceptaban de buena gana. Esa herencia explica buena parte de las tensiones que siguieron en el resto del siglo.',
          en:'The war remade borders, brought down empires, changed the role of the state and of women in society and left a peace settlement that few accepted willingly. That legacy explains much of the tension that followed through the rest of the century.' } }
  ];
  var v10 = pickVariant(p10v, rng);
  addProblem({ title:L({ es:'Una guerra mundial', en:'A world war' }), questionText:L(v10.q), options:L(v10.o), correct:v10.c, hint:L(v10.h), explanation:L(v10.e) }, rng);

<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbykkuJ_apGq3vALIFd4mr3acu81c7K4OKxW-DZ-i52Ceyl3lOanXMdvbS9SIXPrLQBm/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'Causas y Consecuencias de la Primera Guerra Mundial';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
