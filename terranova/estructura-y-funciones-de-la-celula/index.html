/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 1 :: ajusta el microscopio
   El alumno elige ocular y objetivo. El campo de visión responde al momento:
   el objeto crece y se desenfoca según qué tan lejos esté del aumento que hace
   falta. Tres muestras distintas; al tercer intento fallido se revela el par
   de lentes correcto con su razón.
   ══════════════════════════════════════════════════════════════════════════ */
function wScope(rng, host){
  var OCU = [5, 10, 15];
  var OBJ = [4, 10, 40, 100];
  var POOL = [
    { tot:40, obj:{ es:'las celdillas de una laminilla de corcho', en:'the little cells of a slice of cork' },
      nota:{ es:'Con pocos aumentos ya se distinguen las paredes vacías que se dibujaron por primera vez hace más de trescientos años.',
             en:'With few magnifications you can already tell apart the empty walls that were first drawn more than three hundred years ago.' } },
    { tot:100, obj:{ es:'las células de la piel de una cebolla', en:'the cells of an onion skin' },
      nota:{ es:'Aquí se ve el contorno de cada célula y un punto más oscuro en el centro de cada una.',
             en:'Here you see the outline of each cell and a darker dot in the middle of each one.' } },
    { tot:400, obj:{ es:'una bacteria del sarro de los dientes', en:'a bacterium from tooth plaque' },
      nota:{ es:'Una bacteria es muchísimo más pequeña que una célula de cebolla, por eso pide bastantes más aumentos.',
             en:'A bacterium is far smaller than an onion cell, which is why it asks for many more magnifications.' } },
    { tot:600, obj:{ es:'los glóbulos rojos de una gota de sangre', en:'the red blood cells of a drop of blood' },
      nota:{ es:'A este aumento se nota que tienen forma de disco hundido en el centro.',
             en:'At this magnification you can notice they are shaped like a disc sunken in the middle.' } },
    { tot:1000, obj:{ es:'una bacteria diminuta de una gota de agua estancada', en:'a tiny bacterium from a drop of stagnant water' },
      nota:{ es:'Este es casi el límite del microscopio de luz: para ver algo más pequeño, como un virus, hace falta el microscopio electrónico.',
             en:'This is nearly the limit of the light microscope: to see anything smaller, like a virus, an electron microscope is needed.' } }
  ];
  var rounds = shuffle(POOL, rng).slice(0, 3);
  var round = 0, oc = OCU[0], ob = OBJ[0], tries = 0, revealed = false, done = false;

  host.innerHTML =
    '<div class="gw-h iw-tag">' + L({ es:'Ajusta el microscopio', en:'Set up the microscope' }) + '</div>' +
    '<div class="gw-q" data-r="q"></div>' +
    '<div class="gw-mini iw-sub">' + L({
      es:'Elige el ocular y el objetivo, mira cómo responde el campo de visión y presiona Observar cuando creas que la muestra ya se distingue. Puedes cambiar de lente cuantas veces quieras.',
      en:'Choose the eyepiece and the objective, watch how the field of view responds and press Observe when you think the sample can be told apart. You can change lenses as often as you like.'
    }) + '</div>' +
    '<div class="mfield"><div class="mblob" data-r="blob"></div></div>' +
    '<div class="mcap" data-r="cap"></div>' +
    '<div class="gw-tag">' + L({ es:'Ocular', en:'Eyepiece' }) + '</div><div class="gw-row" data-r="oc"></div>' +
    '<div class="gw-tag">' + L({ es:'Objetivo', en:'Objective' }) + '</div><div class="gw-row" data-r="ob"></div>' +
    '<div class="work">' +
      '<span class="gw-tag">' + L({ es:'Aumento total', en:'Total magnification' }) + '</span>' +
      '<span class="workv" data-r="tot"></span>' +
      '<button class="gw-btn" data-r="go">' + L({ es:'Observar', en:'Observe' }) + '</button>' +
      '<button class="gw-btn" data-r="next" style="display:none">' + L({ es:'Siguiente muestra', en:'Next sample' }) + '</button>' +
    '</div>' +
    '<div class="gw-fb"></div>';

  var elQ = host.querySelector('[data-r="q"]'),
      elBlob = host.querySelector('[data-r="blob"]'),
      elCap = host.querySelector('[data-r="cap"]'),
      elOc = host.querySelector('[data-r="oc"]'),
      elOb = host.querySelector('[data-r="ob"]'),
      elTot = host.querySelector('[data-r="tot"]'),
      elGo = host.querySelector('[data-r="go"]'),
      elNext = host.querySelector('[data-r="next"]');

  function target(){ return rounds[round]; }

  function solution(){
    var t = target().tot;
    for (var a = 0; a < OCU.length; a++){
      for (var b = 0; b < OBJ.length; b++){
        if (OCU[a] * OBJ[b] === t) return [OCU[a], OBJ[b]];
      }
    }
    return [OCU[1], OBJ[2]];
  }

  function lensRow(el, vals, cur, set){
    el.innerHTML = vals.map(function(v){
      return '<button class="gw-btn' + (v === cur ? ' on' : '') + '" data-v="' + v + '">' + v + 'x</button>';
    }).join('');
    el.querySelectorAll('.gw-btn').forEach(function(b){
      b.addEventListener('click', function(){
        if (done || revealed) return;
        set(parseInt(b.getAttribute('data-v'), 10));
        render();
      });
    });
  }

  function render(){
    var t = target(), tot = oc * ob, r = tot / t.tot;
    elQ.textContent = L({ es:'Muestra ' + (round + 1) + ' de 3: ', en:'Sample ' + (round + 1) + ' of 3: ' }) + L(t.obj);
    lensRow(elOc, OCU, oc, function(v){ oc = v; });
    lensRow(elOb, OBJ, ob, function(v){ ob = v; });
    elTot.textContent = tot + 'x';
    var size = Math.max(14, Math.min(168, Math.round(24 + r * 96)));
    elBlob.style.width = size + 'px';
    elBlob.style.height = size + 'px';
    var blur = r < 1 ? (1 - r) * 7 : (r - 1) * 5;
    elBlob.style.filter = 'blur(' + Math.min(9, Math.round(blur * 10) / 10) + 'px)';
    if (r < 0.5) elCap.textContent = L({ es:'Con este aumento solo aparece una mancha clara en el centro del campo.', en:'At this magnification only a pale smudge shows up in the middle of the field.' });
    else if (r < 1) elCap.textContent = L({ es:'Ya se adivinan formas, pero los bordes siguen sin definirse.', en:'Shapes can already be guessed, but the edges are still undefined.' });
    else if (r === 1) elCap.textContent = L({ es:'Los bordes están nítidos y la muestra llena bien el campo.', en:'The edges are sharp and the sample fills the field nicely.' });
    else elCap.textContent = L({ es:'Demasiado cerca: el campo se abre borroso y ya no cabe la muestra completa.', en:'Too close: the field opens up blurred and the whole sample no longer fits.' });
    elGo.disabled = done || revealed;
    elNext.style.display = revealed ? 'inline-block' : 'none';
  }

  function nextRound(){
    round++;
    if (round >= rounds.length){
      done = true; revealed = false;
      render();
      elGo.disabled = true;
      say(host, 'good', L({ es:'🎉 Tres muestras observadas. Cada objeto pide su propio aumento, y hay objetos que ninguna lente de luz alcanza.', en:'🎉 Three samples observed. Each object asks for its own magnification, and there are objects no light lens can reach.' }));
      return;
    }
    tries = 0; revealed = false; oc = OCU[0]; ob = OBJ[0];
    render();
    say(host, '', L({ es:'Nueva muestra en la platina. Empieza con poco aumento y sube poco a poco.', en:'A new sample on the stage. Start with low magnification and go up little by little.' }));
  }

  elGo.addEventListener('click', function(){
    if (done || revealed) return;
    var t = target(), tot = oc * ob;
    if (tot === t.tot){
      say(host, 'good', L({ es:'🎉 Enfocado. A ' + tot + ' aumentos se distingue ' + L(t.obj) + '. ', en:'🎉 In focus. At ' + tot + ' magnifications you can tell apart ' + L(t.obj) + '. ' }) + L(t.nota));
      revealed = true; render();
      elNext.style.display = 'inline-block';
      return;
    }
    tries++;
    if (tries >= 3){
      var s = solution();
      oc = s[0]; ob = s[1]; revealed = true; render();
      say(host, 'warm', L({ es:'Con el ocular de ' + s[0] + ' y el objetivo de ' + s[1] + ' se llega a ' + t.tot + ' aumentos, que es lo que pide esta muestra. ', en:'With the ' + s[0] + 'x eyepiece and the ' + s[1] + 'x objective you reach ' + t.tot + ' magnifications, which is what this sample asks for. ' }) + L(t.nota));
      return;
    }
    if (tot < t.tot) say(host, 'miss', L({ es:'A ' + tot + ' aumentos la muestra sigue demasiado pequeña. Cambia una lente para subir el aumento.', en:'At ' + tot + ' magnifications the sample is still too small. Change one lens to raise the magnification.' }));
    else say(host, 'miss', L({ es:'A ' + tot + ' aumentos te pasaste: el campo queda borroso. Baja el aumento con alguna de las dos lentes.', en:'At ' + tot + ' magnifications you went too far: the field turns blurry. Lower the magnification with one of the two lenses.' }));
  });

  elNext.addEventListener('click', nextRound);

  render();
  say(host, '', L({ es:'Primera muestra en la platina. Empieza con poco aumento y sube poco a poco.', en:'First sample on the stage. Start with low magnification and go up little by little.' }));
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 2 :: el portero de la membrana
   Llegan sustancias a la orilla de la célula. El alumno decide qué hace la
   membrana con cada una. El estado de la célula sube o baja al momento y lo
   que entra aparece en el citoplasma. Reversible: el mismo caso vuelve a
   quedar disponible hasta el tercer intento, donde se revela la respuesta.
   ══════════════════════════════════════════════════════════════════════════ */
function wMembrane(rng, host){
  var BINS = [
    { es:'Dejar entrar', en:'Let it in' },
    { es:'Sacar', en:'Push it out' },
    { es:'No dejar pasar', en:'Keep it out' }
  ];
  var POOL = [
    { bin:0, txt:{ es:'Oxígeno disuelto en el agua de alrededor', en:'Oxygen dissolved in the water around' },
      why:{ es:'La célula lo necesita adentro para obtener energía del alimento.', en:'The cell needs it inside to get energy out of food.' } },
    { bin:0, txt:{ es:'Glucosa que hay en el medio', en:'Glucose present in the medium' },
      why:{ es:'Es alimento: en el citoplasma se transforma y da energía.', en:'It is food: in the cytoplasm it is transformed and gives energy.' } },
    { bin:1, txt:{ es:'Dióxido de carbono que sobra adentro', en:'Carbon dioxide left over inside' },
      why:{ es:'Se produjo dentro y acumularlo dañaría a la célula.', en:'It was produced inside and piling it up would harm the cell.' } },
    { bin:1, txt:{ es:'Desechos que quedaron después de usar el alimento', en:'Waste left after using the food' },
      why:{ es:'Ya no sirven adentro y salen al medio por la membrana.', en:'They are of no more use inside and leave to the medium through the membrane.' } },
    { bin:1, txt:{ es:'Agua que sobra en el interior de la célula', en:'Water left over inside the cell' },
      why:{ es:'Si se queda, la célula se hincha; la membrana regula cuánta guarda.', en:'If it stays, the cell swells; the membrane regulates how much it keeps.' } },
    { bin:2, txt:{ es:'Una sustancia tóxica que flota en el medio', en:'A toxic substance floating in the medium' },
      why:{ es:'La membrana puede negarle el paso y así protege el interior.', en:'The membrane can refuse it passage and that protects the inside.' } },
    { bin:2, txt:{ es:'Un grano de tierra que roza la superficie', en:'A grain of soil brushing the surface' },
      why:{ es:'No es alimento ni desecho de la célula: se queda afuera.', en:'It is neither food nor cell waste: it stays outside.' } }
  ];
  var items = shuffle(POOL, rng).slice(0, 5);
  var i = 0, tries = 0, salud = 60, done = false, lock = false, dentro = [];

  host.innerHTML =
    '<div class="gw-h iw-tag">' + L({ es:'El portero de la membrana', en:'The membrane doorkeeper' }) + '</div>' +
    '<div class="gw-mini iw-sub">' + L({
      es:'En cada turno aparece una sustancia que llega a la orilla de la célula. Tú juegas el papel de la membrana y pulsas uno de los tres botones: <b>Dejar entrar</b> (la sustancia entra al citoplasma), <b>Sacar</b> (sale del interior al exterior) o <b>No dejar pasar</b> (se queda fuera). La barra de "Estado de la célula" sube cuando aciertas y baja cuando te equivocas. Lo que hayas dejado entrar aparece en la caja del citoplasma.',
      en:'In each turn a substance arrives at the edge of the cell. You play the role of the membrane and press one of the three buttons: <b>Let it in</b> (the substance enters the cytoplasm), <b>Push it out</b> (it leaves from inside to outside) or <b>Keep it out</b> (it stays outside). The "State of the cell" bar goes up when you are right and down when you are wrong. Whatever you have let in appears in the cytoplasm box.'
    }) + '</div>' +
    '<div class="nlbl">' + L({ es:'Estado de la célula', en:'State of the cell' }) + '</div>' +
    '<div class="mbar"><div class="mbarf" data-r="bar"></div></div>' +
    '<div class="mcell"><div class="nlbl">' + L({ es:'Citoplasma', en:'Cytoplasm' }) + '</div><div class="mcyto" data-r="cyto"></div></div>' +
    '<div class="gw-q" data-r="prog"></div>' +
    '<div class="mitem" data-r="item"></div>' +
    '<div class="gw-row" data-r="bins"></div>' +
    '<div class="gw-fb"></div>';

  var elBar = host.querySelector('[data-r="bar"]'),
      elCyto = host.querySelector('[data-r="cyto"]'),
      elProg = host.querySelector('[data-r="prog"]'),
      elItem = host.querySelector('[data-r="item"]'),
      elBins = host.querySelector('[data-r="bins"]');

  function paintBar(){
    elBar.style.width = salud + '%';
    elBar.className = 'mbarf' + (salud < 50 ? ' low' : '');
  }

  function paintCyto(){
    elCyto.innerHTML = dentro.length
      ? dentro.join(' · ')
      : L({ es:'Por ahora no ha entrado nada nuevo.', en:'So far nothing new has come in.' });
  }

  function dirMsg(correcto, elegido){
    if (correcto === 0 && elegido === 2) return L({ es:'Si dejas afuera lo que alimenta a la célula, el citoplasma se queda sin material para trabajar. Piensa qué hace falta adentro.', en:'If you keep out what feeds the cell, the cytoplasm is left without material to work with. Think about what is needed inside.' });
    if (correcto === 0 && elegido === 1) return L({ es:'Eso no está sobrando adentro: viene de afuera y la célula lo necesita.', en:'That is not left over inside: it comes from outside and the cell needs it.' });
    if (correcto === 1 && elegido === 0) return L({ es:'Eso ya está dentro de la célula y ya no le sirve. Fíjate hacia dónde debería ir.', en:'That is already inside the cell and is of no more use. Look at where it should be heading.' });
    if (correcto === 1 && elegido === 2) return L({ es:'No viene de afuera: se produjo adentro, así que la membrana tiene que dejarlo salir.', en:'It does not come from outside: it was produced inside, so the membrane has to let it out.' });
    if (correcto === 2 && elegido === 0) return L({ es:'Si eso entra, la célula se daña. La membrana no deja pasar todo lo que toca su superficie.', en:'If that gets in, the cell is harmed. The membrane does not let everything that touches its surface through.' });
    return L({ es:'No está adentro para sacarlo: está afuera, tocando la membrana.', en:'It is not inside to be pushed out: it is outside, touching the membrane.' });
  }

  function render(){
    paintBar(); paintCyto();
    if (done){
      elProg.textContent = L({ es:'Turno de guardia terminado', en:'Watch duty finished' });
      elItem.textContent = L({ es:'La membrana decidió cinco veces y el citoplasma recibió lo que hacía falta.', en:'The membrane decided five times and the cytoplasm received what was needed.' });
      elBins.innerHTML = '';
      return;
    }
    var it = items[i];
    elProg.textContent = L({ es:'Caso ' + (i + 1) + ' de ' + items.length, en:'Case ' + (i + 1) + ' of ' + items.length });
    elItem.textContent = L(it.txt);
    elBins.innerHTML = BINS.map(function(b, bi){
      return '<button class="gw-btn" data-b="' + bi + '">' + L(b) + '</button>';
    }).join('');
    elBins.querySelectorAll('.gw-btn').forEach(function(b){
      b.addEventListener('click', function(){ choose(parseInt(b.getAttribute('data-b'), 10)); });
    });
  }

  function advance(){
    i++; tries = 0; lock = false;
    if (i >= items.length){
      done = true; render();
      say(host, 'good', L({ es:'🎉 La membrana decide qué entra, qué sale y qué se queda afuera, y el citoplasma es donde se usa todo lo que entró.', en:'🎉 The membrane decides what comes in, what goes out and what stays outside, and the cytoplasm is where everything that came in gets used.' }));
      return;
    }
    render();
  }

  function choose(bi){
    if (done || lock) return;
    var it = items[i];
    if (bi === it.bin){
      lock = true;
      salud = Math.min(100, salud + 10);
      if (it.bin === 0) dentro.push(L(it.txt));
      say(host, 'good', L({ es:'Buena decisión. ', en:'Good call. ' }) + L(it.why));
      setTimeout(advance, 900);
      render();
      return;
    }
    salud = Math.max(10, salud - 10);
    tries++;
    if (tries >= 3){
      lock = true;
      if (it.bin === 0) dentro.push(L(it.txt));
      salud = Math.min(100, salud + 10);
      say(host, 'warm', L({ es:'Lo que correspondía era: ', en:'What matched here was: ' }) + '<b>' + L(BINS[it.bin]) + '</b>. ' + L(it.why));
      setTimeout(advance, 1600);
      render();
      return;
    }
    say(host, 'miss', dirMsg(it.bin, bi));
    render();
  }

  render();
  say(host, '', L({ es:'La célula está en buen estado. Cuida que siga así.', en:'The cell is in good shape. Keep it that way.' }));
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 3 :: reparte las instrucciones
   El núcleo guarda un número de cromosomas. El alumno copia el material y
   luego mueve el control para repartirlo entre dos células hijas; los dos
   núcleos se dibujan al momento. Se revela la respuesta al tercer intento.
   ══════════════════════════════════════════════════════════════════════════ */
function wNucleus(rng, host){
  var n = pk(rng, [4, 6, 8]);
  var copiado = false, aA = 0, tries = 0, done = false;

  host.innerHTML =
    '<div class="gw-h iw-tag">' + L({ es:'Reparte las instrucciones', en:'Share out the instructions' }) + '</div>' +
    '<div class="gw-mini iw-sub">' + L({
      es:'La célula madre tiene un número de cromosomas. Para dividirse sin perder información tiene que: <b>1) Copiar primero</b> todo el material (pulsa "Copiar el material" — por un momento habrá el doble). <b>2) Repartir</b> los cromosomas entre las dos células hijas usando el control deslizante, hasta que cada una reciba exactamente los mismos que tenía la madre. <b>3) Pulsar "Dividir"</b> cuando el reparto sea justo. Puedes deshacer y volver a empezar cuantas veces quieras.',
      en:'The mother cell has a certain number of chromosomes. To divide without losing information it must: <b>1) Copy first</b> all the material (press "Copy the material" — for a moment there will be double the amount). <b>2) Share out</b> the chromosomes between the two daughter cells using the slider, until each one receives exactly the same number the mother had. <b>3) Press "Divide"</b> when the share-out is even. You can undo and start again as often as you like.'
    }) + '</div>' +
    '<div class="nbox"><div class="nlbl">' + L({ es:'Núcleo de la célula madre', en:'Nucleus of the mother cell' }) + '</div><div data-r="madre"></div><div class="nlbl" data-r="madren"></div></div>' +
    '<div class="gw-row" style="margin-top:.6rem">' +
      '<button class="gw-btn" data-r="copy"></button>' +
      '<button class="gw-btn" data-r="reset">' + L({ es:'Empezar de nuevo', en:'Start again' }) + '</button>' +
    '</div>' +
    '<div class="gw-tag" data-r="slbl"></div>' +
    '<input class="nslide" type="range" min="0" max="1" value="0" data-r="sl">' +
    '<div class="ncells"><div class="ncell" data-r="cA"></div><div class="ncell" data-r="cB"></div></div>' +
    '<div class="gw-row" style="margin-top:.6rem"><button class="gw-btn" data-r="go">' + L({ es:'Dividir', en:'Divide' }) + '</button></div>' +
    '<div class="gw-fb"></div>';

  var elMadre = host.querySelector('[data-r="madre"]'),
      elMadreN = host.querySelector('[data-r="madren"]'),
      elCopy = host.querySelector('[data-r="copy"]'),
      elReset = host.querySelector('[data-r="reset"]'),
      elSlbl = host.querySelector('[data-r="slbl"]'),
      elSl = host.querySelector('[data-r="sl"]'),
      elA = host.querySelector('[data-r="cA"]'),
      elB = host.querySelector('[data-r="cB"]'),
      elGo = host.querySelector('[data-r="go"]');

  function bars(k){
    var out = '';
    for (var j = 0; j < k; j++) out += '<span class="nchr"></span>';
    return out || '<span class="nlbl">' + L({ es:'sin cromosomas', en:'no chromosomes' }) + '</span>';
  }

  function total(){ return copiado ? n * 2 : n; }

  function render(){
    elMadre.innerHTML = bars(total());
    elMadreN.textContent = total() + ' ' + L({ es:'cromosomas', en:'chromosomes' });
    elCopy.textContent = copiado ? L({ es:'Deshacer la copia', en:'Undo the copy' }) : L({ es:'Copiar el material', en:'Copy the material' });
    elCopy.className = 'gw-btn' + (copiado ? ' on' : '');
    elSl.max = String(total());
    if (aA > total()) aA = total();
    elSl.value = String(aA);
    elSlbl.textContent = L({ es:'Cuántos cromosomas van a la célula hija A', en:'How many chromosomes go to daughter cell A' });
    var b = total() - aA;
    elA.innerHTML = '<div class="nlbl">' + L({ es:'Célula hija A', en:'Daughter cell A' }) + '</div>' + bars(aA) + '<div class="nlbl">' + aA + '</div>';
    elB.innerHTML = '<div class="nlbl">' + L({ es:'Célula hija B', en:'Daughter cell B' }) + '</div>' + bars(b) + '<div class="nlbl">' + b + '</div>';
    elA.className = 'ncell' + (done && aA === n ? ' ok' : (aA === 0 ? ' off' : ''));
    elB.className = 'ncell' + (done && b === n ? ' ok' : (b === 0 ? ' off' : ''));
    elGo.disabled = done;
    elCopy.disabled = done;
    elSl.disabled = done;
  }

  function live(){
    if (done) return;
    var b = total() - aA;
    if (!copiado) say(host, '', L({ es:'Tal como está, hay ' + total() + ' cromosomas para dos células hijas. Fíjate con cuántos se quedaría cada una.', en:'As it stands, there are ' + total() + ' chromosomes for two daughter cells. Look at how many each one would keep.' }));
    else if (aA === b) say(host, '', L({ es:'Las dos hijas llevan ' + aA + ' cromosomas cada una. Presiona Dividir cuando estés seguro.', en:'Both daughters carry ' + aA + ' chromosomes each. Press Divide when you are sure.' }));
    else if (aA > b) say(host, '', L({ es:'La hija A lleva ' + aA + ' y la hija B lleva ' + b + '. Mueve el control hacia la izquierda.', en:'Daughter A carries ' + aA + ' and daughter B carries ' + b + '. Move the control to the left.' }));
    else say(host, '', L({ es:'La hija A lleva ' + aA + ' y la hija B lleva ' + b + '. Mueve el control hacia la derecha.', en:'Daughter A carries ' + aA + ' and daughter B carries ' + b + '. Move the control to the right.' }));
  }

  elCopy.addEventListener('click', function(){
    if (done) return;
    copiado = !copiado; aA = 0; render(); live();
  });
  elReset.addEventListener('click', function(){
    if (done) return;
    copiado = false; aA = 0; render(); live();
  });
  elSl.addEventListener('input', function(){
    if (done) return;
    aA = parseInt(elSl.value, 10) || 0; render(); live();
  });
  elGo.addEventListener('click', function(){
    if (done) return;
    var b = total() - aA;
    if (copiado && aA === n && b === n){
      done = true; render();
      say(host, 'good', L({ es:'🎉 Cada célula hija se lleva ' + n + ' cromosomas, los mismos que tenía la madre. Por eso la información completa se hereda en cada división.', en:'🎉 Each daughter cell takes ' + n + ' chromosomes, the same number the mother had. That is why the complete information is inherited at every division.' }));
      return;
    }
    tries++;
    if (tries >= 3){
      copiado = true; aA = n; done = true; render();
      say(host, 'warm', L({ es:'Así queda: primero se copian los ' + n + ' cromosomas y quedan ' + (n * 2) + '; al repartirlos en partes iguales cada hija recibe ' + n + ', igual que la madre.', en:'This is how it goes: first the ' + n + ' chromosomes are copied and there are ' + (n * 2) + '; sharing them in equal parts each daughter receives ' + n + ', the same as the mother.' }));
      return;
    }
    if (!copiado) say(host, 'miss', L({ es:'Sin copiar primero, entre las dos hijas solo hay ' + n + ' cromosomas para repartir y ninguna quedaría completa.', en:'Without copying first, between the two daughters there are only ' + n + ' chromosomes to share and neither would be complete.' }));
    else if (aA !== b) say(host, 'miss', L({ es:'El reparto quedó disparejo: ' + aA + ' y ' + b + '. Una de las dos hijas recibiría instrucciones incompletas.', en:'The share-out came out uneven: ' + aA + ' and ' + b + '. One of the two daughters would receive incomplete instructions.' }));
    else say(host, 'miss', L({ es:'Revisa el número: cada hija debería quedar con los mismos cromosomas que tenía la madre.', en:'Check the number: each daughter should end up with the same chromosomes the mother had.' }));
    render();
  });

  render();
  say(host, '', L({ es:'La célula madre tiene ' + n + ' cromosomas y está por dividirse.', en:'The mother cell has ' + n + ' chromosomes and is about to divide.' }));
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 4 :: la balanza de la manipulación genética
   Cada caso real se coloca en el plato de los beneficios o en el de los
   riesgos; la balanza se inclina al momento según cómo van los dos platos.
   Al tercer intento se coloca sola y se explica por qué.
   ══════════════════════════════════════════════════════════════════════════ */
function wBalance(rng, host){
  var POOL = [
    { side:0, txt:{ es:'Bacterias modificadas fabrican la insulina que usan las personas con diabetes', en:'Modified bacteria make the insulin used by people with diabetes' },
      why:{ es:'Es un beneficio en la salud: hay medicamento suficiente y más barato.', en:'It is a health benefit: there is enough medicine and it is cheaper.' } },
    { side:0, txt:{ es:'Un cultivo modificado resiste una plaga y se pierde menos cosecha', en:'A modified crop resists a pest and less harvest is lost' },
      why:{ es:'Es un beneficio: se produce alimento con menos pérdidas y menos plaguicidas.', en:'It is a benefit: food is produced with fewer losses and fewer pesticides.' } },
    { side:0, txt:{ es:'Se corrige el gen que causa una enfermedad hereditaria en una familia', en:'The gene causing an inherited disease in a family is corrected' },
      why:{ es:'Es un beneficio en la salud, aunque exige revisar cada caso con cuidado.', en:'It is a health benefit, though each case has to be reviewed carefully.' } },
    { side:1, txt:{ es:'La planta modificada se cruza con plantas silvestres del campo vecino', en:'The modified plant crosses with wild plants in the neighbouring field' },
      why:{ es:'Es un riesgo para el medio ambiente: el cambio pasa a plantas que nadie modificó.', en:'It is an environmental risk: the change passes to plants nobody modified.' } },
    { side:1, txt:{ es:'Todavía faltan estudios sobre qué ocurre tras muchos años de consumo', en:'Studies are still missing about what happens after many years of consumption' },
      why:{ es:'Es un riesgo mientras no haya datos: no saber no es lo mismo que estar seguro.', en:'It is a risk while there are no data: not knowing is not the same as being sure.' } },
    { side:1, txt:{ es:'Quienes siembran dependen de una sola empresa para conseguir la semilla', en:'Those who sow depend on a single company to get the seed' },
      why:{ es:'Es un riesgo: quien controla la semilla controla el precio de la cosecha.', en:'It is a risk: whoever controls the seed controls the price of the harvest.' } }
  ];
  var cards = shuffle(POOL, rng).slice(0, 5);
  var i = 0, tries = 0, done = false, lock = false, ben = [], rie = [];

  host.innerHTML =
    '<div class="gw-h iw-tag">' + L({ es:'La balanza de la manipulación genética', en:'The balance of genetic manipulation' }) + '</div>' +
    '<div class="gw-mini iw-sub">' + L({
      es:'Coloca cada caso en el plato que le corresponde y observa hacia dónde se inclina la balanza. Si te equivocas, el caso se queda para volver a intentarlo.',
      en:'Place each case on the pan it belongs to and watch which way the balance tips. If you miss, the case stays for another try.'
    }) + '</div>' +
    '<div class="beam" data-r="beam">' +
      '<div class="pan"><div class="pan-h">' + L({ es:'Beneficios', en:'Benefits' }) + '</div><div data-r="ben"></div></div>' +
      '<div class="pan"><div class="pan-h">' + L({ es:'Riesgos', en:'Risks' }) + '</div><div data-r="rie"></div></div>' +
    '</div>' +
    '<div class="pivot"></div>' +
    '<div class="gw-q" data-r="prog"></div>' +
    '<div class="mitem" data-r="card"></div>' +
    '<div class="gw-row" data-r="btns"></div>' +
    '<div class="gw-fb"></div>';

  var elBeam = host.querySelector('[data-r="beam"]'),
      elBen = host.querySelector('[data-r="ben"]'),
      elRie = host.querySelector('[data-r="rie"]'),
      elProg = host.querySelector('[data-r="prog"]'),
      elCard = host.querySelector('[data-r="card"]'),
      elBtns = host.querySelector('[data-r="btns"]');

  function paintPans(){
    elBen.innerHTML = ben.map(function(t){ return '<span class="pchip">' + t + '</span>'; }).join('') ||
      '<span class="nlbl">' + L({ es:'plato vacío', en:'empty pan' }) + '</span>';
    elRie.innerHTML = rie.map(function(t){ return '<span class="pchip">' + t + '</span>'; }).join('') ||
      '<span class="nlbl">' + L({ es:'plato vacío', en:'empty pan' }) + '</span>';
    var deg = Math.max(-9, Math.min(9, (rie.length - ben.length) * 4));
    elBeam.style.transform = 'rotate(' + deg + 'deg)';
  }

  function render(){
    paintPans();
    if (done){
      elProg.textContent = L({ es:'Balanza completa', en:'Balance complete' });
      elCard.textContent = L({ es:'Los dos platos tienen peso: por eso conviene revisar los dos antes de tomar postura.', en:'Both pans carry weight: that is why it pays to review both before taking a position.' });
      elBtns.innerHTML = '';
      return;
    }
    var c = cards[i];
    elProg.textContent = L({ es:'Caso ' + (i + 1) + ' de ' + cards.length, en:'Case ' + (i + 1) + ' of ' + cards.length });
    elCard.textContent = L(c.txt);
    elBtns.innerHTML =
      '<button class="gw-btn" data-s="0">' + L({ es:'Al plato de beneficios', en:'To the benefits pan' }) + '</button>' +
      '<button class="gw-btn" data-s="1">' + L({ es:'Al plato de riesgos', en:'To the risks pan' }) + '</button>';
    elBtns.querySelectorAll('.gw-btn').forEach(function(b){
      b.addEventListener('click', function(){ place(parseInt(b.getAttribute('data-s'), 10)); });
    });
  }

  function drop(c){
    if (c.side === 0) ben.push(L(c.txt)); else rie.push(L(c.txt));
  }

  function advance(){
    i++; tries = 0; lock = false;
    if (i >= cards.length){
      done = true; render();
      say(host, 'good', L({ es:'🎉 Ningún plato quedó vacío. Una postura sólida se arma mirando los dos y pidiendo datos de cada lado.', en:'🎉 Neither pan was left empty. A solid position is built by looking at both and asking for data from each side.' }));
      return;
    }
    render();
  }

  function place(s){
    if (done || lock) return;
    var c = cards[i];
    if (s === c.side){
      lock = true;
      drop(c);
      say(host, 'good', L(c.why));
      setTimeout(advance, 900);
      render();
      return;
    }
    tries++;
    if (tries >= 3){
      lock = true;
      drop(c);
      say(host, 'warm', L({ es:'Este caso pesa del otro lado. ', en:'This case weighs on the other side. ' }) + L(c.why));
      setTimeout(advance, 1600);
      render();
      return;
    }
    if (c.side === 0) say(host, 'miss', L({ es:'Vuelve a leerlo: ¿quién sale ganando aquí y qué problema queda resuelto?', en:'Read it again: who gains here and what problem gets solved?' }));
    else say(host, 'miss', L({ es:'Vuelve a leerlo: ¿qué podría salir mal, y a quién le tocaría?', en:'Read it again: what could go wrong, and who would it fall on?' }));
    render();
  }

  render();
  say(host, '', L({ es:'La balanza empieza en equilibrio, con los dos platos vacíos.', en:'The balance starts level, with both pans empty.' }));
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 5 :: cuaderno de postura
   Un espacio para escribir o dibujar la propia respuesta, con una consigna
   distinta por intento. La respuesta se guarda y se comenta sin veredicto.
   ══════════════════════════════════════════════════════════════════════════ */
function wReflect(rng, host){
  var PROMPTS = [
    { es:'Escribe una pregunta que te gustaría investigar sobre la manipulación genética y anota qué dato tendrías que encontrar para responderla.',
      en:'Write a question you would like to investigate about genetic manipulation and note what data you would need to find in order to answer it.' },
    { es:'Dibuja una célula con su membrana, su citoplasma y su núcleo, y escribe junto a cada parte qué hace.',
      en:'Draw a cell with its membrane, its cytoplasm and its nucleus, and write next to each part what it does.' },
    { es:'Elige un uso real de la manipulación genética y explica qué beneficio y qué riesgo revisarías antes de defender una postura en un debate.',
      en:'Choose a real use of genetic manipulation and explain what benefit and what risk you would review before defending a position in a debate.' },
    { es:'Compara lo que veía Hooke con su lente y lo que ve hoy quien usa un microscopio electrónico, y escribe qué pregunta nueva se pudo hacer gracias a ese avance.',
      en:'Compare what Hooke saw with his lens and what someone using an electron microscope sees today, and write what new question that advance made possible.' }
  ];
  var p = pk(rng, PROMPTS);

  host.innerHTML =
    '<div class="gw-h iw-tag">' + L({ es:'Cuaderno de postura', en:'Position notebook' }) + '</div>' +
    '<div class="gw-mini iw-sub">' + L({ es:'Responde con tus palabras o con un dibujo. Aquí no hay una sola respuesta buena: importa cómo la sostienes.', en:'Answer in your own words or with a drawing. There is no single good answer here: what matters is how you back it up.' }) + '</div>' +
    '<div class="gw-q">' + L(p) + '</div>' +
    '<div class="wtabs">' +
      '<button class="wtab active" data-t="type">' + t('tab-type') + '</button>' +
      '<button class="wtab" data-t="draw">' + t('tab-draw') + '</button>' +
    '</div>' +
    '<div class="wpanel active" id="wr_type"><textarea class="wtextarea" id="wrTa" placeholder="' + L({ es:'Tu respuesta', en:'Your answer' }) + '"></textarea></div>' +
    '<div class="wpanel" id="wr_draw">' +
      '<div class="cvwrap">' +
        '<canvas class="dcanvas" id="wrCv"></canvas>' +
        '<div class="ctoolbar">' +
          '<button class="tbtn2 bpen on">' + t('btn-pen') + '</button>' +

          '<button class="tbtn2 beraser">' + t('btn-eraser') + '</button>' +

function addProblem(rng, v){

  var prob = {
    title: L(v.title),

    fn: '',
    hint: L(v.hint),
    explanation: L(v.exp),
    options: sh,
    correctIdx: sh.indexOf(correctVal),
    showWork: !!v.showWork,
    studentChoice: null,
    pendingChoice: null
  };
  problems.push(prob);
  buildOneCard(prob, idx);
}

/* ══════════════════════════════════════════════════════════════════════════
   buildLesson
   ══════════════════════════════════════════════════════════════════════════ */
function buildLesson(rng){
  injectGuideCSS();

  /* ── Apertura ── */
  sec(
    L({ es:'Punto de partida', en:'Starting point' }),
    L({ es:'Lo vivo cabe en una caja diminuta', en:'Living things fit inside a tiny box' }),
    '<p>' + L({
      es:'Una hoja de cebolla, la saliva de tu boca y la punta de tu dedo parecen materiales muy distintos, pero si los miras de cerca, y luego más de cerca todavía, los tres terminan en lo mismo: cajitas ordenadas una junto a la otra. Cada cajita es una célula, y en ese espacio pequeñísimo caben todas las tareas de estar vivo: alimentarse, responder a lo que pasa afuera y formar nuevas células.',
      en:'An onion leaf, the saliva in your mouth and the tip of your finger look like very different materials, but if you look closely, and then closer still, all three end up in the same thing: little boxes lined up one next to the other. Each little box is a cell, and in that tiny space fit all the tasks of being alive: feeding, responding to what happens outside and forming new cells.'
    }) + '</p>' +
    '<div class="callout"><p><strong>' + L({ es:'Lo que vas a hacer: ', en:'What you are going to do: ' }) + '</strong>' + L({
      es:'vas a ajustar un microscopio hasta que cada muestra se vea nítida, a decidir qué deja pasar la membrana de una célula, a preparar un núcleo para repartir sus instrucciones entre dos células hijas y a pesar en una balanza los beneficios y los riesgos de cambiar esas instrucciones.',
      en:'you are going to set up a microscope until each sample looks sharp, decide what the membrane of a cell lets through, get a nucleus ready to share out its instructions between two daughter cells and weigh on a balance the benefits and the risks of changing those instructions.'
    }) + '</p></div>'
  );

  /* ══ CONCEPTO 1 ══ */
  var s1 = sec(
    L({ es:'Concepto 1', en:'Concept 1' }),
    L({ es:'Lo que se veía antes y lo que se ve hoy', en:'What used to be seen and what is seen today' }),
    '<p>' + L({
      es:'Nadie sospechaba que existieran las células hasta que alguien miró un material común a través de una lente. Con un instrumento sencillo, hace más de trescientos años, se observó una laminilla de corcho y aparecieron pequeñas celdillas vacías, ordenadas como un panal; a esas cajitas se les llamó células. Poco después, otras lentes de mayor calidad mostraron algo todavía más sorprendente: en una gota de agua estancada se movían seres vivos formados por una sola célula, que nadie había visto jamás.',
      en:'Nobody suspected that cells existed until somebody looked at an everyday material through a lens. With a simple instrument, more than three hundred years ago, a slice of cork was observed and small empty little cells appeared, arranged like a honeycomb; those little boxes were called cells. Soon after, other lenses of better quality showed something even more surprising: in a drop of stagnant water living things made of a single cell were moving about, which nobody had ever seen.'
    }) + '</p>' +
    '<p>' + L({
      es:'El microscopio de luz que usas en la escuela tiene dos lentes que trabajan una después de la otra: el objetivo, que está cerca de la muestra, y el ocular, por donde miras. El aumento total se obtiene multiplicando el aumento del objetivo por el del ocular, y por eso un equipo modesto llega a cientos de aumentos. Aun así, la luz tiene un límite. Los microscopios electrónicos, que no usan luz sino haces de electrones, llegan mucho más lejos: con ellos se vio por dentro a la célula y, por primera vez, a los virus, tan pequeños que ninguna lente de luz los alcanza. Cada instrumento nuevo no solo mostró más detalle: hizo posibles preguntas que antes ni siquiera podían plantearse.',
      en:'The light microscope you use at school has two lenses that work one after the other: the objective, close to the sample, and the eyepiece, which you look through. The total magnification comes from multiplying the magnification of the objective by that of the eyepiece, and that is why a modest setup reaches hundreds of magnifications. Even so, light has a limit. Electron microscopes, which use beams of electrons instead of light, reach much further: with them the inside of the cell was seen and, for the first time, viruses, so small that no light lens can reach them. Each new instrument did not only show more detail: it made possible questions that could not even be asked before.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Lente sencilla', en:'Simple lens' }), L({ es:'decenas de aumentos', en:'tens of magnifications' }), L({ es:'celdillas del corcho', en:'the little cells of cork' })) +
      rcard(L({ es:'Microscopio de luz', en:'Light microscope' }), L({ es:'cientos de aumentos', en:'hundreds of magnifications' }), L({ es:'células vivas y bacterias', en:'living cells and bacteria' })) +
      rcard(L({ es:'Microscopio electrónico', en:'Electron microscope' }), L({ es:'miles de aumentos', en:'thousands of magnifications' }), L({ es:'el interior de la célula y los virus', en:'the inside of the cell and viruses' })) +
      rcard(L({ es:'Aumento total', en:'Total magnification' }), L({ es:'ocular por objetivo', en:'eyepiece times objective' }), L({ es:'las dos lentes trabajan seguidas', en:'the two lenses work in a row' })) +
    '</div>'
  );
  wScope(rng, widgetHost(s1, 'wScope', 'microscope'));
  addProblem(rng, mkP1(rng));
  addProblem(rng, mkP2(rng));

  /* ══ CONCEPTO 2 ══ */
  var s2 = sec(
    L({ es:'Concepto 2', en:'Concept 2' }),
    L({ es:'La membrana decide y el citoplasma trabaja', en:'The membrane decides and the cytoplasm works' }),
    '<p>' + L({
      es:'Toda célula tiene un límite: la membrana celular, una capa finísima que la separa del medio. No es una pared cerrada ni un colador que deje pasar todo. Es un filtro que elige: permite la entrada del oxígeno y de los alimentos disueltos, deja salir los desechos y el agua que sobra, y bloquea sustancias que podrían dañarla. Gracias a ese control, el interior de la célula se mantiene distinto de lo que hay afuera. La membrana también es lo primero que recibe lo que ocurre en el medio, así que participa en la función de relación: por ahí llega la información de un cambio de temperatura o la señal de una célula vecina.',
      en:'Every cell has a boundary: the cell membrane, a very thin layer separating it from the medium. It is neither a closed wall nor a sieve that lets everything through. It is a filter that chooses: it allows in oxygen and dissolved food, lets waste and leftover water out, and blocks substances that could harm it. Thanks to that control, the inside of the cell stays different from what is outside. The membrane is also the first thing to receive what happens in the medium, so it takes part in the function of relation: through it arrives the information about a change in temperature or the signal from a neighbouring cell.'
    }) + '</p>' +
    '<p>' + L({
      es:'Lo que logra entrar cae en el citoplasma, un material espeso que llena a la célula por dentro. Ahí ocurre casi todo el trabajo: los alimentos se transforman y liberan la energía que la célula necesita, y las sustancias se reparten de un extremo a otro. Membrana y citoplasma se reparten así la función de nutrición: una decide qué pasa, el otro usa lo que pasó.',
      en:'Whatever manages to get in falls into the cytoplasm, a thick material that fills the cell inside. Almost all the work happens there: food is transformed and releases the energy the cell needs, and substances are spread from one end to the other. Membrane and cytoplasm share out the function of nutrition in this way: one decides what goes through, the other uses what went through.'
    }) + '</p>'
  );
  wMembrane(rng, widgetHost(s2, 'wMembrana', 'membrane'));
  addProblem(rng, mkP3(rng));
  addProblem(rng, mkP4(rng));

  /* ══ CONCEPTO 3 ══ */
  var s3 = sec(
    L({ es:'Concepto 3', en:'Concept 3' }),
    L({ es:'El núcleo guarda las instrucciones', en:'The nucleus keeps the instructions' }),
    '<p>' + L({
      es:'Casi en el centro de la célula hay un cuerpo redondeado que se distingue bien al microscopio: el núcleo. Adentro está el material que funciona como un instructivo completo de la célula, organizado en cromosomas. Ese instructivo dice cómo se construye cada parte y cómo se hacen las tareas, y solo tiene sentido si se conserva completo.',
      en:'Almost at the centre of the cell there is a rounded body that stands out well under the microscope: the nucleus. Inside is the material that works as a complete instruction booklet for the cell, organised into chromosomes. That booklet says how each part is built and how the tasks are done, and it only makes sense if it is kept complete.'
    }) + '</p>' +
    '<p>' + L({
      es:'El problema de guardar ese instructivo es que cada vez que la célula se reproduce tiene que dar una copia completa a cada célula nueva. Si repartiera el original en dos, cada hija recibiría solo la mitad de las instrucciones y no podría funcionar. Por eso la célula hace algo muy ordenado: primero copia todo el material del núcleo —de modo que por un momento hay el doble— y solo entonces lo reparte en partes iguales. Así cada célula hija recibe un instructivo completo, igual al de la célula madre. En eso consiste la función de reproducción, y de ahí sale también la herencia: los hijos se parecen a sus padres porque reciben copias de ese material, no porque copien lo que ven.',
      en:'The challenge of keeping that instruction booklet is that every time the cell reproduces it has to hand a complete copy to each new cell. If it just split the original in two, each daughter would only get half the instructions and could not function. So the cell does something very orderly: it first copies all the material of the nucleus — so that for a moment there is double the amount — and only then shares it out in equal parts. That way each daughter cell receives a complete booklet, the same as the mother cell. That is what the function of reproduction consists of, and inheritance comes out of it too: children resemble their parents because they receive copies of that material, not because they copy what they see.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Membrana', en:'Membrane' }), L({ es:'nutrición y relación', en:'nutrition and relation' }), L({ es:'decide qué entra y qué sale', en:'decides what comes in and what goes out' })) +
      rcard(L({ es:'Citoplasma', en:'Cytoplasm' }), L({ es:'nutrición', en:'nutrition' }), L({ es:'transforma el alimento y reparte', en:'transforms the food and spreads it' })) +
      rcard(L({ es:'Núcleo', en:'Nucleus' }), L({ es:'reproducción y herencia', en:'reproduction and inheritance' }), L({ es:'guarda y reparte las instrucciones', en:'stores and shares out the instructions' })) +
      rcard(L({ es:'Cromosomas', en:'Chromosomes' }), L({ es:'dentro del núcleo', en:'inside the nucleus' }), L({ es:'se copian antes de cada división', en:'are copied before each division' })) +
    '</div>'
  );
  wNucleus(rng, widgetHost(s3, 'wNucleo', 'nucleus'));
  addProblem(rng, mkP5(rng));
  addProblem(rng, mkP6(rng));

  /* ══ CONCEPTO 4 ══ */
  var s4 = sec(
    L({ es:'Concepto 4', en:'Concept 4' }),
    L({ es:'Cambiar las instrucciones', en:'Changing the instructions' }),
    '<p>' + L({
      es:'Si las instrucciones de un ser vivo están guardadas en el núcleo de sus células, entonces se pueden leer, y desde hace unas décadas también se pueden cambiar o pasar de un ser vivo a otro. A eso se le llama manipulación genética. Con ella hay bacterias que fabrican la insulina que necesitan las personas con diabetes, plantas que resisten una plaga sin tanto plaguicida y tratamientos que corrigen un gen que causa una enfermedad hereditaria.',
      en:'If the instructions of a living thing are stored in the nucleus of its cells, then they can be read, and for some decades now they can also be changed or moved from one living thing to another. That is called genetic manipulation. Thanks to it there are bacteria that make the insulin people with diabetes need, plants that resist a pest without so much pesticide and treatments that correct a gene causing an inherited disease.'
    }) + '</p>' +
    '<p>' + L({
      es:'También hay motivos para tener cuidado. Una planta modificada puede cruzarse con plantas silvestres del campo vecino y llevarles el cambio; de algunos usos todavía faltan estudios de largo plazo; y quien controla la semilla controla el precio de la cosecha. Para participar en esta discusión no basta con estar a favor o en contra: conviene hacer preguntas que se puedan investigar, del tipo qué pasó, dónde, en cuánto tiempo y con qué medición, y buscar datos de los dos lados antes de defender una postura en un debate.',
      en:'There are also reasons to be careful. A modified plant may cross with wild plants in the neighbouring field and carry the change to them; for some uses long term studies are still missing; and whoever controls the seed controls the price of the harvest. To take part in this discussion it is not enough to be for or against: it pays to ask questions that can be investigated, of the kind what happened, where, over how long and with what measurement, and to look for data from both sides before defending a position in a debate.'
    }) + '</p>'
  );
  wBalance(rng, widgetHost(s4, 'wBalanza', 'balance'));
  addProblem(rng, mkP7(rng));
  addProblem(rng, mkP8(rng));
  wReflect(rng, widgetHost(s4, 'wReflexion', 'reflect'));

  /* ══ CIERRE ══ */
  sec(
    L({ es:'Para cerrar', en:'To finish' }),
    L({ es:'Junta el instrumento, la célula y la discusión', en:'Put together the instrument, the cell and the discussion' }),
    '<p>' + L({
      es:'Las siguientes situaciones vienen de un museo, de un salón de clases y de un debate. En cada una hay que decidir qué explica mejor lo que ocurre: el instrumento con el que se observó, la parte de la célula que hace el trabajo o la evidencia que sostiene una postura.',
      en:'The situations below come from a museum, a classroom and a debate. In each one you have to decide what best explains what is happening: the instrument used to observe, the part of the cell doing the work or the evidence that holds up a position.'
    }) + '</p>'
  );
  addProblem(rng, mkP9(rng));
  addProblem(rng, mkP10(rng));
}
</script>

  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}

  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
