      '<div class="stag">Concepto 3</div>' +
      '<h2>Ponerle pesos a la probabilidad</h2>' +
      '<p>Hasta aquí las probabilidades describen proporciones de casos. Una empresa, sin embargo, no decide sobre casos: decide sobre dinero. El puente entre las dos cosas es una idea simple y poderosa. Se listan todos los resultados posibles de una decisión, se le asigna a cada uno su probabilidad y su monto, y se pesa cada monto por su probabilidad. El total se llama <strong>valor esperado</strong>, y es el resultado promedio que dejaría esa decisión si se repitiera muchas veces en las mismas condiciones.</p>' +
      '<p>Dos advertencias que separan a quien entiende el concepto de quien solo lo calcula. La primera es que el valor esperado casi nunca es un resultado posible: un proyecto que gana o pierde nunca deja el promedio de las dos ramas. La segunda es que el promedio se pesa por probabilidad y no por tamaño, así que un escenario espectacular con probabilidad baja aporta poco, mientras que un escenario mediocre pero casi seguro domina el resultado. Sacar el promedio simple de los escenarios, sin pesarlos, es el error más común de todo el tema.</p>' +
      '<p>El valor esperado solo no basta para decidir, y aquí entra el <strong>riesgo</strong>. Dos proyectos pueden tener exactamente el mismo valor esperado y ser negocios completamente distintos: uno entrega esa cifra casi siempre, el otro la entrega en promedio saltando entre una ganancia enorme y una pérdida grave. Lo que separa a uno del otro es la <strong>dispersión</strong> de los resultados alrededor del promedio, que se resume en la desviación estándar. Como esa cifra viene en pesos, proyectos de tamaños distintos no se comparan directamente; para eso se usa el <strong>riesgo por peso esperado</strong>, que divide la dispersión entre el valor esperado y permite poner lado a lado una tienda y una planta.</p>' +
      '<p>Falta una consideración que ninguna fórmula entrega y que decide de verdad. El valor esperado supone repetición: es honesto para una aseguradora con miles de pólizas o para una cadena que abre sucursales cada año. Para una decisión única que puede quebrar a la empresa, la rama mala no es un número en un promedio, es el final del juego. Por eso las empresas compran seguros con valor esperado negativo y por eso limitan la exposición a un solo cliente: se paga un poco de valor esperado a cambio de sobrevivir a la rama mala y poder seguir jugando.</p>' +
      '<div class="rules-grid">' +
        '<div class="rcard"><div class="rname">Valor esperado</div><div class="rform">VE = Σ p · monto</div><div class="rnote">Cada monto pesado por su probabilidad.</div></div>' +
        '<div class="rcard"><div class="rname">Dispersión</div><div class="rform">σ = √Σ p · (monto − VE)²</div><div class="rnote">Qué tan lejos queda un intento suelto.</div></div>' +
        '<div class="rcard"><div class="rname">Riesgo por peso</div><div class="rform">' + frac('σ', 'VE') + '</div><div class="rnote">Compara proyectos de distinto tamaño.</div></div>' +
        '<div class="rcard"><div class="rname">Prima de riesgo</div><div class="rform">VE − opción segura</div><div class="rnote">Lo que paga la incertidumbre.</div></div>' +
      '</div>' +
      '<p><strong>Ejemplo resuelto.</strong> Una cadena de cafeterías evalúa abrir una sucursal en el centro de Colima, con estos escenarios para el primer año:</p>' +
      '<div class="dlist">' + list + '</div>' +
      '<p>La alternativa es remodelar la sucursal actual, que deja ' + money(c3safe) + ' con certeza. El consejo pide una recomendación.</p>' +
      '<div class="callout"><p><strong>Paso 1.</strong> Cada escenario se pesa por su probabilidad: el mercado fuerte aporta ' + money(c3p[0] * c3hi) + ', el normal ' + money(c3p[1] * c3mid) + ' y el débil resta ' + money(c3p[2] * c3lo) + '.<br>' +
      '<strong>Paso 2.</strong> El valor esperado de la sucursal nueva es ' + money(c3ev) + ', contra los ' + money(c3safe) + ' seguros de la remodelación.<br>' +
      '<strong>Paso 3.</strong> La dispersión alrededor de ese promedio es ' + money(c3sd) + ', es decir ' + dec2(c3cv) + ' pesos de riesgo por cada peso esperado, mientras que la remodelación tiene dispersión cero.<br>' +
      '<strong>Paso 4.</strong> La prima que paga la incertidumbre es ' + money(c3ev - c3safe) + ', y hay ' + pct1(c3p[2]) + '% de probabilidad de terminar el año con una pérdida de ' + money(c3lo) + '.<br>' +
      '<strong>Lectura de negocio.</strong> Compara el promedio pesado, ' + money(c3ev) + ', contra el promedio simple de los tres escenarios, que sería ' + money(c3avg) + '. La diferencia es exactamente el peso de las probabilidades, y quien presenta la segunda cifra está tratando como igualmente creíbles tres futuros que no lo son. La recomendación honesta al consejo no es una cifra sino una frase completa: la sucursal gana ' + money(c3ev - c3safe) + ' de valor esperado sobre la remodelación, y ese margen se compra aceptando ' + pct1(c3p[2]) + '% de probabilidad de perder ' + money(c3lo) + '. Si la cadena tiene flujo para absorber ese año malo y piensa abrir varias sucursales, la apuesta es razonable; si esta apertura es única y la pérdida compromete la nómina, la remodelación es la decisión correcta aunque su promedio sea menor.</p></div>';
    return '' +
      '<div class="stag">Concept 3</div>' +
      '<h2>Putting pesos on probability</h2>' +
      '<p>So far probabilities describe proportions of cases. A company, however, does not decide about cases: it decides about money. The bridge between the two is a simple and powerful idea. List every possible result of a decision, give each one its probability and its amount, and weight each amount by its probability. The total is called <strong>expected value</strong>, and it is the average result that decision would leave if it were repeated many times under the same conditions.</p>' +
      '<p>Two warnings separate whoever understands the concept from whoever merely computes it. The first is that expected value is almost never a possible result: a project that either wins or loses never delivers the average of the two branches. The second is that the average is weighted by probability and not by size, so a spectacular scenario with low probability contributes little, while a mediocre but nearly certain scenario dominates the result. Taking the plain average of the scenarios, without weighting them, is the most common error in the whole topic.</p>' +
      '<p>Expected value alone is not enough to decide, and this is where <strong>risk</strong> enters. Two projects can have exactly the same expected value and be completely different businesses: one delivers that figure almost always, the other delivers it on average while jumping between an enormous gain and a serious loss. What separates them is the <strong>spread</strong> of results around the average, summarized by the standard deviation. Since that figure arrives in pesos, projects of different sizes cannot be compared directly; for that you use the <strong>risk per peso expected</strong>, which divides the spread by the expected value and lets you put a shop and a plant side by side.</p>' +
      '<p>One consideration remains that no formula delivers and that really decides. Expected value assumes repetition: it is honest for an insurer with thousands of policies or for a chain that opens branches every year. For a single decision that can break the company, the bad branch is not a number inside an average, it is the end of the game. That is why companies buy insurance with negative expected value and why they cap exposure to any single client: a little expected value is paid away in exchange for surviving the bad branch and being able to keep playing.</p>' +
      '<div class="rules-grid">' +
        '<div class="rcard"><div class="rname">Expected value</div><div class="rform">EV = Σ p · amount</div><div class="rnote">Each amount weighted by its probability.</div></div>' +
        '<div class="rcard"><div class="rname">Spread</div><div class="rform">σ = √Σ p · (amount − EV)²</div><div class="rnote">How far a single attempt lands.</div></div>' +
        '<div class="rcard"><div class="rname">Risk per peso</div><div class="rform">' + frac('σ', 'EV') + '</div><div class="rnote">Compares projects of different size.</div></div>' +
        '<div class="rcard"><div class="rname">Risk premium</div><div class="rform">EV − safe option</div><div class="rnote">What uncertainty is paying.</div></div>' +
      '</div>' +
      '<p><strong>Worked example.</strong> A coffee shop chain is weighing a new branch in downtown Colima, with these scenarios for the first year:</p>' +
      '<div class="dlist">' + list + '</div>' +
      '<p>The alternative is refurbishing the current branch, which returns ' + money(c3safe) + ' with certainty. The board asks for a recommendation.</p>' +
      '<div class="callout"><p><strong>Step 1.</strong> Each scenario is weighted by its probability: the strong market contributes ' + money(c3p[0] * c3hi) + ', the normal one ' + money(c3p[1] * c3mid) + ' and the weak one takes away ' + money(c3p[2] * c3lo) + '.<br>' +
      '<strong>Step 2.</strong> The expected value of the new branch is ' + money(c3ev) + ', against the ' + money(c3safe) + ' certain from the refurbishment.<br>' +
      '<strong>Step 3.</strong> The spread around that average is ' + money(c3sd) + ', that is ' + dec2(c3cv) + ' pesos of risk for every peso expected, while the refurbishment has zero spread.<br>' +
      '<strong>Step 4.</strong> The premium uncertainty is paying is ' + money(c3ev - c3safe) + ', and there is a ' + pct1(c3p[2]) + '% probability of closing the year with a loss of ' + money(c3lo) + '.<br>' +
      '<strong>Business reading.</strong> Compare the weighted average, ' + money(c3ev) + ', against the plain average of the three scenarios, which would be ' + money(c3avg) + '. The difference is exactly the weight of the probabilities, and whoever presents the second figure is treating three futures as equally credible when they are not. The honest recommendation to the board is not a figure but a whole sentence: the branch gains ' + money(c3ev - c3safe) + ' of expected value over the refurbishment, and that margin is bought by accepting a ' + pct1(c3p[2]) + '% probability of losing ' + money(c3lo) + '. If the chain has the cash to absorb that bad year and plans to open several branches, the bet is reasonable; if this opening is a one off and the loss compromises payroll, the refurbishment is the right decision even with the lower average.</p></div>';
  });

  widgetDecisionRisk(w3p, w3hi, w3lo, w3safe);

  /* ── Item 5 ── */
  var p5out = [
    { p: p5p[0], v: p5hi },
    { p: p5p[1], v: p5mid },
    { p: p5p[2], v: -p5lo }
  ];
  var p5ev = expectedValue(p5out);
  var o5 = valOpts(p5ev,
    [(p5hi + p5mid - p5lo) / 3,
     p5p[0] * p5hi + p5p[1] * p5mid,

  var q5i = {
    title: { es: 'El promedio que sí pesa los escenarios', en: 'The average that does weight the scenarios' },
    q: { es: 'Una empresa de software de Colima evalúa lanzar un sistema de punto de venta para restaurantes. El área comercial estima ' + pct1(p5p[0]) + '% de probabilidad de una adopción alta, que dejaría ' + money(p5hi) + ' de utilidad en el primer año; ' + pct1(p5p[1]) + '% de una adopción moderada, con ' + money(p5mid) + '; y ' + pct1(p5p[2]) + '% de que el producto no despegue, con una pérdida de ' + money(p5lo) + '. La dirección quiere saber cuánto dejaría este lanzamiento en promedio si la empresa tomara esta misma decisión muchas veces en las mismas condiciones. ¿Cuál es esa cifra?',
        en: 'A software company in Colima is weighing the launch of a point of sale system for restaurants. The commercial team estimates a ' + pct1(p5p[0]) + '% probability of high adoption, which would leave ' + money(p5hi) + ' of profit in the first year; ' + pct1(p5p[1]) + '% of moderate adoption, with ' + money(p5mid) + '; and ' + pct1(p5p[2]) + '% that the product never takes off, with a loss of ' + money(p5lo) + '. Management wants to know how much this launch would leave on average if the company took this same decision many times under the same conditions. What is that figure?' },
    opts: { es: o5.es, en: o5.en },
    hint: { es: 'Los tres escenarios no son igual de creíbles, así que no pueden entrar con el mismo peso. Trata cada escenario por separado, decide con qué peso entra y recuerda que el escenario malo entra restando.',
            en: 'The three scenarios are not equally credible, so they cannot enter with the same weight. Take each scenario on its own, decide the weight it enters with, and remember that the bad scenario enters as a subtraction.' },
    exp: { es: 'Pesando cada escenario por su probabilidad, la adopción alta aporta ' + money2(p5p[0] * p5hi) + ', la moderada ' + money2(p5p[1] * p5mid) + ' y el fracaso resta ' + money2(p5p[2] * p5lo) + ', lo que deja un valor esperado de ' + money2(p5ev) + '. La opción de ' + money2((p5hi + p5mid - p5lo) / 3) + ' es el promedio simple de los tres montos: trata como igualmente probables tres futuros que no lo son y por eso le da un peso enorme al escenario más optimista. La de ' + money2(p5p[0] * p5hi + p5p[1] * p5mid) + ' ignora la rama mala, el sesgo más frecuente en los comités de proyecto, donde el escenario de fracaso se menciona pero no se resta. Y la de ' + money2(p5p[0] * p5hi + p5p[1] * p5mid + p5p[2] * p5lo) + ' comete el error de signo: suma la pérdida como si fuera una ganancia, de modo que el escenario más desfavorable termina mejorando el resultado del proyecto.',
           en: 'Weighting each scenario by its probability, high adoption contributes ' + money2(p5p[0] * p5hi) + ', moderate adoption ' + money2(p5p[1] * p5mid) + ' and failure takes away ' + money2(p5p[2] * p5lo) + ', which leaves an expected value of ' + money2(p5ev) + '. The option of ' + money2((p5hi + p5mid - p5lo) / 3) + ' is the plain average of the three amounts: it treats three futures as equally likely when they are not and therefore gives enormous weight to the most optimistic one. The one of ' + money2(p5p[0] * p5hi + p5p[1] * p5mid) + ' ignores the bad branch, the most frequent bias in project committees, where the failure scenario is mentioned but never subtracted. And the one of ' + money2(p5p[0] * p5hi + p5p[1] * p5mid + p5p[2] * p5lo) + ' makes the sign error: it adds the loss as if it were a gain, so the least favourable scenario ends up improving the result of the project.' }
  };
  var d5 = mk(q5i, o5.correctIdx, true);
  problems.push({ i18n: d5.i18n, title: d5.title, questionText: d5.questionText, options: d5.options, correctIdx: d5.correctIdx, explanation: d5.explanation, hint: d5.hint, showWork: true, studentChoice: null, pendingChoice: null });
  buildOneCard(problems[problems.length - 1], problems.length - 1);

  /* ── Item 6 ── */
  var o6 = shuffleOpts(
    ['Que las dos opciones dejarían lo mismo en promedio, así que la decisión ya no se toma con el promedio sino preguntando si la empresa sobrevive al peor resultado del contrato grande y cuántas veces podrá repetir esa apuesta.',
     'Que el contrato grande es mejor en cualquier caso, porque su mejor resultado es mucho más alto y el valor esperado de las dos opciones es idéntico.',
     'Que las dos opciones son equivalentes en todo sentido para la empresa, porque tienen el mismo valor esperado y eso resume toda la información relevante.',
     'Que el contrato pequeño es mejor en cualquier caso, porque el riesgo siempre debe evitarse sin importar el valor esperado de las alternativas.'],
    ['That both options would leave the same amount on average, so the decision is no longer taken with the average but by asking whether the company survives the worst result of the large contract and how many times it can repeat that bet.',
     'That the large contract is better in any case, because its best result is far higher and the expected value of the two options is identical.',
     'That the two options are equivalent in every sense for the company, because they share the same expected value and that summarizes all the relevant information.',
     'That the small contract is better in any case, because risk should always be avoided regardless of the expected value of the alternatives.'], rng);
  var q6i = {
    title: { es: 'Mismo promedio, dos negocios distintos', en: 'Same average, two different businesses' },
    q: { es: 'Una constructora de Colima debe elegir entre dos contratos para el próximo año. El contrato pequeño con el municipio deja ' + money(p6ev) + ' de utilidad casi con certeza. El contrato grande con un desarrollador privado deja ' + money(p6ev + p6sw) + ' si la obra se entrega a tiempo y una pérdida de ' + money(p6sw - p6ev) + ' si hay retrasos, y las dos posibilidades son igual de probables. El director financiero calcula el valor esperado de las dos opciones y encuentra que es el mismo. ¿Cuál es la lectura correcta de ese resultado?',
        en: 'A construction company in Colima must choose between two contracts for next year. The small contract with the city council leaves ' + money(p6ev) + ' of profit almost with certainty. The large contract with a private developer leaves ' + money(p6ev + p6sw) + ' if the work is delivered on time and a loss of ' + money(p6sw - p6ev) + ' if there are delays, and the two possibilities are equally likely. The finance director computes the expected value of both options and finds it is the same. What is the correct reading of that result?' },
    opts: { es: o6.es, en: o6.en },
    hint: { es: 'Los dos promedios coinciden, así que el promedio ya no distingue nada. Pregúntate qué le pasa a la constructora el día que el contrato grande sale mal, y si ese día llega, si la empresa sigue existiendo para intentarlo otra vez.',
            en: 'The two averages coincide, so the average no longer tells them apart. Ask what happens to the company on the day the large contract goes badly, and if that day arrives, whether the company still exists to try again.' },
    exp: { es: 'Cuando dos alternativas empatan en valor esperado, el promedio dejó de ser un criterio y lo que decide es la dispersión y la capacidad de absorber la rama mala. El contrato grande entrega ese mismo promedio saltando entre un resultado excelente y una pérdida seria, mientras que el pequeño lo entrega casi siempre. La respuesta que prefiere el contrato grande por su mejor resultado se fija solo en la rama favorable, que es la definición de optimismo mal calibrado: el mejor caso no es un criterio de decisión, es uno de los dos finales. La que los declara equivalentes en todo sentido ignora que una empresa que no puede pagar la pérdida no llega a la siguiente oportunidad, y el promedio supone precisamente muchas repeticiones. Y la que rechaza el riesgo siempre, sin mirar cifras, dejaría a la constructora fuera de todo proyecto de crecimiento: el riesgo se paga, se acota y se compara, no se evita por reflejo.',
           en: 'When two alternatives tie on expected value, the average stops being a criterion and what decides is the spread and the capacity to absorb the bad branch. The large contract delivers that same average by jumping between an excellent result and a serious loss, while the small one delivers it almost always. The answer preferring the large contract for its best result looks only at the favourable branch, which is the definition of badly calibrated optimism: the best case is not a decision criterion, it is one of two endings. The one declaring them equivalent in every sense ignores that a company unable to pay the loss never reaches the next opportunity, and the average assumes precisely many repetitions. And the one rejecting risk always, without looking at figures, would keep the company out of every growth project: risk is priced, capped and compared, not avoided by reflex.' }
  };
  var d6 = mk(q6i, o6.correctIdx, false);
  problems.push({ i18n: d6.i18n, title: d6.title, questionText: d6.questionText, options: d6.options, correctIdx: d6.correctIdx, explanation: d6.explanation, hint: d6.hint, showWork: false, studentChoice: null, pendingChoice: null });
  buildOneCard(problems[problems.length - 1], problems.length - 1);

  /* ═══════════════════════ CONCEPT 4 ═══════════════════════ */
  var c4none = Math.pow(1 - c4d, c4n);
  var c4one  = atLeastOne(c4d, c4n);
  var c4naive = c4d * c4n;

  addSection(function(L) {
    var es = L === 'es';
    if (es) return '' +
      '<div class="stag">Concepto 4</div>' +
      '<h2>El mismo riesgo, repetido muchas veces</h2>' +
      '<p>Un riesgo aislado casi nunca es el problema de una empresa. El problema es el riesgo repetido: no un crédito sino una cartera, no un embarque sino una temporada, no una máquina sino una planta. Y ahí la intuición falla de una manera muy específica y muy costosa: un riesgo que parece despreciable en un caso se vuelve casi seguro cuando el caso se repite lo suficiente.</p>' +
      '<p>La herramienta es la que ya apareció en el primer concepto, el complemento, ahora con toda su fuerza. Preguntar por la probabilidad de que ocurra <strong>al menos un</strong> incumplimiento obliga a contar muchísimos escenarios: que falle uno, que fallen dos, que fallen todos. Preguntar por el escenario contrario, que no falle ninguno, deja un solo camino, y ese sí es fácil de calcular cuando los casos son independientes: se multiplica la probabilidad de que cada uno se comporte bien. La respuesta a la pregunta original es lo que le falta a esa cifra para completar el total.</p>' +
      '<p>Cuidado con dos atajos. El primero es sumar la probabilidad individual tantas veces como casos haya. Con pocos casos parece funcionar, y con muchos entrega resultados imposibles por encima del cien por ciento, lo cual delata el error: esa suma cuenta varias veces los escenarios en los que fallan dos o más. El segundo atajo es más peligroso porque no se nota. Multiplicar exige independencia, y en una cartera real los incumplimientos no son independientes: si la economía local se enfría, muchos clientes fallan a la vez. Suponer independencia cuando no la hay hace ver el riesgo del portafolio mucho más chico de lo que es, que es exactamente el error que estuvo detrás de más de una crisis de crédito.</p>' +
      '<p>Con esto se cierra el recorrido y las piezas se juntan en la decisión que toda empresa acaba tomando: cuánto riesgo retener y cuánto transferir. Una póliza de seguro tiene, casi por definición, valor esperado negativo para quien la compra, porque la aseguradora cobra la pérdida esperada más su gasto y su margen. Comprarla sigue siendo racional cuando la pérdida posible es grande frente al tamaño del negocio, porque lo que se compra no es un promedio favorable sino la certeza de seguir operando. La misma lógica explica diversificar clientes, contratar coberturas de tipo de cambio y no concentrar la producción en una sola planta.</p>' +
      '<div class="rules-grid">' +
        '<div class="rcard"><div class="rname">Ninguno falla</div><div class="rform">(1 − p)ⁿ</div><div class="rnote">Solo si los casos son independientes.</div></div>' +
        '<div class="rcard"><div class="rname">Al menos uno</div><div class="rform">1 − (1 − p)ⁿ</div><div class="rnote">El complemento del caso anterior.</div></div>' +
        '<div class="rcard"><div class="rname">Pérdida esperada</div><div class="rform">p · monto de la pérdida</div><div class="rnote">Lo que cuesta el riesgo cada año.</div></div>' +
        '<div class="rcard"><div class="rname">Costo del seguro</div><div class="rform">prima − pérdida esperada</div><div class="rnote">El precio de dormir tranquilo.</div></div>' +
      '</div>' +
      '<p><strong>Ejemplo resuelto.</strong> Una arrendadora de maquinaria coloca ' + intN(c4n) + ' contratos independientes en distintos giros y ciudades. Cada contrato tiene ' + pct1(c4d) + '% de probabilidad de incumplir en el año.</p>' +
      '<div class="callout"><p><strong>Paso 1.</strong> La pregunta directa, que al menos un contrato falle, obligaría a sumar demasiados escenarios distintos, así que conviene voltearla.<br>' +
      '<strong>Paso 2.</strong> Que un contrato cumpla tiene probabilidad ' + pct1(1 - c4d) + '%, y que cumplan los ' + intN(c4n) + ' es multiplicar esa cifra por sí misma tantas veces como contratos hay: ' + pct1(c4none) + '%.<br>' +
      '<strong>Paso 3.</strong> Por complemento, la probabilidad de que al menos un contrato incumpla es ' + pct1(c4one) + '%.<br>' +
      '<strong>Paso 4.</strong> El atajo de multiplicar la probabilidad individual por el número de contratos habría dado ' + pct1(c4naive) + '%, una cifra distinta que además crece sin límite conforme se agregan contratos.<br>' +
      '<strong>Lectura de negocio.</strong> Un riesgo de ' + pct1(c4d) + '% por contrato suena a nada y sostiene un discurso tranquilizador en el comité, pero repetido ' + intN(c4n) + ' veces se convierte en ' + pct1(c4one) + '% de probabilidad de tener al menos un incumplimiento en el año. Esa es la cifra con la que se dimensiona la reserva, no la individual. Y hay una advertencia final que vale más que la cuenta: todo esto supone contratos independientes. Si la arrendadora coloca sus ' + intN(c4n) + ' contratos en el mismo giro y la misma ciudad, un mal año regional los tumba juntos, y entonces el riesgo real de la cartera es mucho mayor que el que entrega esta multiplicación.</p></div>';
    return '' +
      '<div class="stag">Concept 4</div>' +
      '<h2>The same risk, repeated many times</h2>' +
      '<p>An isolated risk is almost never a company problem. The problem is repeated risk: not one loan but a portfolio, not one shipment but a season, not one machine but a plant. And there intuition fails in a very specific and very costly way: a risk that looks negligible in a single case becomes nearly certain once the case repeats often enough.</p>' +
      '<p>The tool is the one that already appeared in the first concept, the complement, now at full strength. Asking for the probability that <strong>at least one</strong> default happens forces you to count a great many scenarios: one fails, two fail, all of them fail. Asking about the opposite scenario, that none fails, leaves a single path, and that one is easy to compute when the cases are independent: multiply the probability that each behaves well. The answer to the original question is whatever that figure is missing to complete the total.</p>' +
      '<p>Beware of two shortcuts. The first is adding the individual probability as many times as there are cases. With few cases it looks like it works, and with many it delivers impossible results above one hundred percent, which gives the error away: that sum counts several times the scenarios where two or more fail. The second shortcut is more dangerous because it does not show. Multiplying demands independence, and in a real portfolio defaults are not independent: if the local economy cools, many clients fail at once. Assuming independence where there is none makes portfolio risk look far smaller than it is, which is exactly the error behind more than one credit crisis.</p>' +
      '<p>With this the tour closes and the pieces come together in the decision every company ends up making: how much risk to retain and how much to transfer. An insurance policy has, almost by definition, negative expected value for the buyer, because the insurer charges the expected loss plus its own costs and margin. Buying it is still rational when the possible loss is large relative to the size of the business, because what is being bought is not a favourable average but the certainty of staying open. The same logic explains diversifying clients, hedging exchange rates and not concentrating production in a single plant.</p>' +
      '<div class="rules-grid">' +
        '<div class="rcard"><div class="rname">None fails</div><div class="rform">(1 − p)ⁿ</div><div class="rnote">Only if the cases are independent.</div></div>' +
        '<div class="rcard"><div class="rname">At least one</div><div class="rform">1 − (1 − p)ⁿ</div><div class="rnote">The complement of the case above.</div></div>' +
        '<div class="rcard"><div class="rname">Expected loss</div><div class="rform">p · size of the loss</div><div class="rnote">What the risk costs each year.</div></div>' +
        '<div class="rcard"><div class="rname">Cost of insurance</div><div class="rform">premium − expected loss</div><div class="rnote">The price of sleeping well.</div></div>' +
      '</div>' +
      '<p><strong>Worked example.</strong> A machinery leasing company places ' + intN(c4n) + ' independent contracts across different industries and cities. Each contract carries a ' + pct1(c4d) + '% probability of default during the year.</p>' +

      '<strong>Step 3.</strong> By complement, the probability that at least one contract defaults is ' + pct1(c4one) + '%.<br>' +

    if (fb && fb.classList.contains('show')) {
      var isOk = (p.studentChoice === p.correctIdx);
      fb.innerHTML = '<strong>' + (isOk ? t('fb-correct') : t('fb-wrong')) + '</strong> ' + p.explanation;
    }
  });
}
function setLang(l) {
  LANG = l;
  try { localStorage.setItem(LANG_KEY, l); } catch(e) {}
  document.documentElement.setAttribute('lang', l);
  var be = document.getElementById('btn-es'), bn = document.getElementById('btn-en');
  if (be) be.classList.toggle('active', l === 'es');
  if (bn) bn.classList.toggle('active', l === 'en');
  applyUIStrings();
  applySectionLang();
  applyProblemLang();
  widgets.forEach(function(f) { try { f(); } catch(e) {} });
  document.querySelectorAll('#lessonBody .section').forEach(function(s) { s.classList.add('vis'); });
}
(function() {
  try { var stored = localStorage.getItem(LANG_KEY); if (stored === 'es' || stored === 'en') LANG = stored; } catch(e) {}
  document.addEventListener('DOMContentLoaded', function() {
    document.documentElement.setAttribute('lang', LANG);
    var be = document.getElementById('btn-es'), bn = document.getElementById('btn-en');
    if (be) be.classList.toggle('active', LANG === 'es');
    if (bn) bn.classList.toggle('active', LANG === 'en');
    applyUIStrings();
  });
})();

/* ════════════════════════════════════════════════════════════════════════
   PDF
   ════════════════════════════════════════════════════════════════════════ */
async function generatePDF() {
  var btn = document.getElementById('dlBtn');
  btn.textContent = t('pdf-busy');
  btn.disabled = true;

  var jspdf   = window.jspdf;
  var doc     = new jspdf.jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });
  var PW      = 215.9;
  var M       = 18;
  var TW      = PW - M * 2;
  var PH      = doc.internal.pageSize.height;
  var name    = studentData.name;
  var group   = studentData.group;
  var total   = problems.length;
  var pct     = Math.round(correctCount / total * 100);
  var dateStr = new Date().toLocaleString(LANG === 'es' ? 'es-MX' : 'en-US', { dateStyle:'long', timeStyle:'short' });

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;

  function pdfText(html) {
    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/→/g,'->').replace(/−/g,'-').replace(/²/g,'^2')
      .replace(/³/g,'^3').replace(/×/g,'x').replace(/÷/g,'/')
      .replace(/≠/g,'!=').replace(/≤/g,'<=').replace(/≥/g,'>=')
      .replace(/√/g,'sqrt').replace(/π/g,'pi').replace(/…/g,'...')
      .replace(/μ/g,'mu').replace(/σ/g,'sigma').replace(/α/g,'alpha').replace(/β/g,'beta')
      .replace(/Σ/g,'sum').replace(/ⁿ/g,'n')
      .replace(/₀/g,'0').replace(/₁/g,'1').replace(/₂/g,'2').replace(/·/g,'*')
      .replace(/\s+/g,' ').trim();
  }

  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,2,'F');
  doc.setFillColor(255,255,255); doc.rect(0,2,PW,26,'F');
  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,28,PW,2,'F');
  doc.setFillColor(pBR,pBG,pBB); doc.rect(0,30,PW,34,'F');

  var fmtL = SCHOOL.logoLeftB64.indexOf('/9j/') > -1 ? 'JPEG' : 'PNG';
  var fmtR = SCHOOL.logoRightB64.indexOf('/9j/') > -1 ? 'JPEG' : 'PNG';
  try { doc.addImage(SCHOOL.logoLeftB64,  fmtL, M,  4.0, 22, 22); } catch(e) {}
  try { doc.addImage(SCHOOL.logoRightB64, fmtR, 48, 4.5, 48, 21); } catch(e) {}

  var lx = PW - M - 36;
  var ly = 10;
  doc.setDrawColor(pBR,pBG,pBB); doc.setLineWidth(0.7);
  doc.lines([[2.57-1.03,4.63-6.17],[4.11-2.57,5.14-4.63],[5.66-4.11,2.57-5.14]], lx+1.03, ly+6.17);
  doc.setFillColor(pAR,pAG,pAB); doc.circle(lx+5.66, ly+2.57, 0.9, 'F');
  doc.setDrawColor(pAR,pAG,pAB); doc.setLineWidth(0.7);
  doc.line(lx+8.23, ly+1.54, lx+8.23, ly+7.2);
  doc.setTextColor(pBR,pBG,pBB); doc.setFontSize(11); doc.setFont('helvetica','bold');
  doc.text('LIAXA', lx+10, ly+6.8);

  doc.setTextColor(240,244,238); doc.setFontSize(13); doc.setFont('helvetica','bold');
  doc.text(SCHOOL.guideTitle[LANG], M, 49);
  doc.setTextColor(198,214,192); doc.setFontSize(8); doc.setFont('helvetica','normal');
  doc.text(dateStr, M, 59);

  doc.setFillColor(237,240,245); doc.roundedRect(M,72,TW,20,3,3,'F');
  doc.setTextColor(130,140,160); doc.setFontSize(8.5); doc.setFont('helvetica','bold');
  doc.text(t('pdf-student'), M+4, 79); doc.text(t('pdf-group'), 130, 79);
  doc.setTextColor(20,24,32); doc.setFontSize(11); doc.setFont('helvetica','bold');
  doc.text(name, M+4, 87); doc.text(group, 130, 87);

  var sc = pct>=70?[26,106,74]:pct>=50?[224,123,26]:[176,48,16];
  doc.setFillColor(255,255,255); doc.roundedRect(M,100,TW,34,4,4,'F');
  doc.setDrawColor(sc[0],sc[1],sc[2]); doc.setLineWidth(0.8);
  doc.roundedRect(M,100,TW,34,4,4,'S');
  doc.setTextColor(sc[0],sc[1],sc[2]); doc.setFontSize(40); doc.setFont('helvetica','bold');
  doc.text(pct+'%', PW/2, 124, {align:'center'});
  doc.setTextColor(130,140,160); doc.setFontSize(8.5); doc.setFont('helvetica','normal');
  doc.text(correctCount+' '+t('pdf-score')+' '+total+' '+t('pdf-questions'), PW/2, 131, {align:'center'});

  doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
  doc.setFontSize(7); doc.setFont('helvetica','bold');
  doc.rect(M,142,TW,8,'F'); doc.text(t('pdf-summary'), M+4, 148);
  var sy = 154;
  problems.forEach(function(prob, i) {
    if (sy + 12 > PH - 15) {
      doc.addPage(); sy = 20;
      doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
      doc.setFontSize(7); doc.setFont('helvetica','bold');
      doc.rect(M,sy,TW,8,'F'); doc.text(t('pdf-summary2'), M+4, sy+6);
      sy += 12;
    }
    var ok = document.getElementById('pc'+i).classList.contains('ok');
    doc.setFillColor(ok?232:255, ok?240:232, ok?232:228);
    doc.roundedRect(M,sy,TW,10,2,2,'F');
    doc.setFillColor(ok?26:176, ok?106:48, ok?74:16);
    doc.circle(M+6, sy+5, 2.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(7); doc.setFont('helvetica','bold');
    doc.text(ok?'v':'x', M+4.5, sy+6.5);
    doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('helvetica','normal');
    doc.text(t('pdf-item')+' '+(i+1)+': '+pdfText(prob.title), M+12, sy+6.5);
    doc.setTextColor(ok?26:176, ok?106:48, ok?74:16);
    doc.text(ok?t('pdf-ok'):t('pdf-bad'), PW-M-24, sy+6.5);
    sy += 12;
  });

  for (var i = 0; i < problems.length; i++) {
    var prob = problems[i];
    doc.addPage();
    var wy = 0;

    doc.setFillColor(pBR,pBG,pBB); doc.rect(0,0,PW,20,'F');
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,3,'F');
    doc.setTextColor(pAR,pAG,pAB); doc.setFontSize(7); doc.setFont('helvetica','normal');
    doc.text(SCHOOL.courseName[LANG]+'  ·  '+SCHOOL.guideTitle[LANG], M, 10);
    doc.setTextColor(240,244,238); doc.setFontSize(10.5); doc.setFont('helvetica','bold');
    doc.text(t('pdf-item')+' '+(i+1)+' '+t('pdf-of')+' '+total+'  ·  '+pdfText(prob.title), M, 17);
    wy = 25;

    var qRaw = pdfText(prob.questionText);
    doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var qLines = doc.splitTextToSize(qRaw, TW-10);
    var qBoxH  = 8 + qLines.length*5 + 3;
    doc.setFillColor(237,240,245); doc.roundedRect(M,wy,TW,qBoxH,2,2,'F');
    doc.setTextColor(pBR,pBG,pBB); doc.setFontSize(6.5); doc.setFont('helvetica','bold');
    doc.text(t('pdf-question'), M+4, wy+6);
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var qy = wy+12;
    qLines.forEach(function(ln,li){ doc.text(ln, M+4, qy+li*5); });
    wy += qBoxH + 4;

    var isOk   = document.getElementById('pc'+i).classList.contains('ok');
    var chosen = prob.studentChoice != null ? pdfText(prob.options[prob.studentChoice]||'') : '';
    var corr   = pdfText(prob.options[prob.correctIdx]||'');
    var expRaw = pdfText(prob.explanation||'');
    doc.setFontSize(8.5); var chLines = doc.splitTextToSize(t('pdf-yours')+chosen, TW-18);
    doc.setFontSize(8);   var coLines = doc.splitTextToSize(t('pdf-key')+corr, TW-18);
    doc.setFontSize(7.5); var exLines = doc.splitTextToSize(t('pdf-sol')+expRaw, TW-18).slice(0,4);
    var ansBoxH = 8 + chLines.length*5.5 + coLines.length*5 + exLines.length*5 + 6;
    doc.setFillColor(isOk?232:255, isOk?240:232, isOk?232:228);
    doc.roundedRect(M,wy,TW,ansBoxH,2,2,'F');
    doc.setFillColor(isOk?26:176, isOk?106:48, isOk?74:16);
    doc.circle(M+7, wy+8, 3.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(9); doc.setFont('helvetica','bold');
    doc.text(isOk?'v':'x', M+5.2, wy+10.5);
    var ay = wy+7;
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','bold');
    chLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5.5); });
    ay += chLines.length*5.5 + 3;
    doc.setTextColor(26,106,74); doc.setFontSize(8); doc.setFont('helvetica','normal');
    coLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    ay += coLines.length*5 + 3;
    doc.setTextColor(90,85,80); doc.setFontSize(7.5);
    exLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    wy += ansBoxH + 5;

    var dc = document.getElementById('dc'+i);
    if (dc) {
      doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
      doc.setFontSize(7); doc.setFont('helvetica','bold');
      doc.rect(M,wy,TW,8,'F'); doc.text(t('pdf-work'), M+4, wy+5.5);
      wy += 11;
      try {
        var imgD = dc.toDataURL('image/png');
        var ar   = dc.height / dc.width;
        var iw   = TW;
        var ih   = Math.min(iw * ar, 68);
        doc.addImage(imgD, 'PNG', M, wy, iw, ih);
        wy += ih + 4;
      } catch(e) {}
    }

    var ta = document.getElementById('ta'+i);
    if (ta && ta.value.trim()) {
      if (wy > PH-30) { doc.addPage(); wy = 20; }
      doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('courier','normal');
      var taLines = doc.splitTextToSize(ta.value, TW);
      taLines.slice(0,16).forEach(function(ln) {
        if (wy > PH-15) { doc.addPage(); wy = 20; }
        doc.text(ln, M, wy); wy += 5;
      });
      wy += 2;
    }

    var pp = document.getElementById('pp'+i);
    if (pp && pp.src && pp.src.indexOf('data:') === 0) {
      if (wy > PH-55) { doc.addPage(); wy = 20; }
      try { doc.addImage(pp.src, 'JPEG', M, wy, TW, 68); wy += 72; } catch(e) {}
    }
  }

  var pages = doc.internal.getNumberOfPages();
  for (var p = 1; p <= pages; p++) {
    doc.setPage(p);
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0, PH-3, PW, 3, 'F');
    doc.setTextColor(130,140,160); doc.setFontSize(6.5); doc.setFont('helvetica','normal');
    doc.text(name+'  ·  '+group+'  ·  '+t('pdf-code')+code+'  ·  '+t('pdf-page')+p+'/'+pages,
      PW/2, PH-5, {align:'center'});
  }

  var _fn = SCHOOL.filePrefix + '_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf';
  var _pdfBlob = doc.output('blob');
  var _blobUrl = URL.createObjectURL(_pdfBlob);
  var _a = document.createElement('a');
  _a.href = _blobUrl;
  _a.download = _fn;
  document.body.appendChild(_a);
  _a.click();
  setTimeout(function(){ document.body.removeChild(_a); URL.revokeObjectURL(_blobUrl); }, 200);
  btn.textContent = t('btn-pdf');
  btn.disabled  = false;
}
</script>
