<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conflictos Territoriales y sus Implicaciones</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Conflictos Territoriales y sus Implicaciones</div>
    <div class="wcourse" id="wcourse-el">Geografía · 1° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Conflictos Territoriales y sus Implicaciones</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="sbtn" id="dlBtn" onclick="generatePDF()" style="max-width:280px;margin:0 auto;">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   CENTRALIZED SCHOOL CONFIG (Rule 16) — ships UNBRANDED (Rule 11).
   The ONLY rebranding point. build_all.py substitutes these exact fields
   (BRAND_FIELDS / RGB_FIELDS / logo*) downstream; :root/dark stay as fallback.
   Neutral defaults below == the static :root/dark values, so unbranded == no-op.
   ══════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:'#1e1e5c', primaryDark:'#131340', primaryBg:'#e9e9f4',
  accent:'#c0202a', accentBg:'#fae0e2',
  darkPrimary:'#5454b5', darkPrimaryDark:'#8282d7', darkPrimaryBg:'#121234',

    var res = document.getElementById('s_results'); res.style.display='none'; res.classList.remove('vis');

/* ── Attempt counter + seed (Rule 4): seed = name+group+attempt ── */
function getAttemptKey(name, group){ return 'geo1_t08_g02__att__' + (name+'__'+group).replace(/\s+/g,'_'); }
function nextAttempt(name, group){ var k=getAttemptKey(name,group),n=0; try{n=parseInt(localStorage.getItem(k)||'0',10)||0;}catch(e){} n++; try{localStorage.setItem(k,String(n));}catch(e){} return n; }
function currentAttempt(name, group){ var k=getAttemptKey(name,group); try{return parseInt(localStorage.getItem(k)||'1',10)||1;}catch(e){return 1;} }
/* ================================================
   STATE
   ================================================ */
var studentData   = {};
var problems      = [];

/* ================================================
   SESSION PERSISTENCE  (localStorage)
   ================================================ */
function lsKey() {
  var n = (studentData.name  || '').trim();
  var g = (studentData.group || '').trim();
  return 'geo1_t08_g02__' + (n + '__' + g).replace(/\s+/g, '_');
}

function saveSession() {
  if (!studentData.name) return;
  var drawings = [], texts = [], photos = [];
  problems.forEach(function(p, i) {
    var dc = document.getElementById('dc' + i);
    if (dc && dc.width) {
      var blank = document.createElement('canvas');
      blank.width = dc.width; blank.height = dc.height;
      drawings.push(dc.toDataURL() === blank.toDataURL() ? null : dc.toDataURL('image/png'));
    } else { drawings.push(null); }
    var ta = document.getElementById('ta' + i);
    texts.push(ta ? ta.value : '');
    var pp = document.getElementById('pp' + i);
    photos.push((pp && pp.src && pp.src.indexOf('data:') === 0) ? pp.src : null);
  });
  var state = {
    name: studentData.name, group: studentData.group,
    answeredCount: answeredCount, correctCount: correctCount,
    choices: problems.map(function(p) { return p.studentChoice; }),
    drawings: drawings, texts: texts, photos: photos
  };
  try { localStorage.setItem(lsKey(), JSON.stringify(state)); } catch(e) {}
}

function loadSession(name, group) {
  var key = 'geo1_t08_g02__' + (name + '__' + group).replace(/\s+/g, '_');
  try { var r = localStorage.getItem(key); return r ? JSON.parse(r) : null; } catch(e) { return null; }
}

function restoreSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  var saved = loadSession(name, group);
  if (!saved) return;
  document.getElementById('restoreBar').style.display = 'none';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = currentAttempt(name, group);
  buildLesson(seededRng(name + group + att));
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
  saved.choices.forEach(function(choice, idx) {
    if (choice !== null && choice !== undefined) confirmMC(idx, choice);
  });
  setTimeout(function() {
    if (saved.drawings) {
      saved.drawings.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var dc = document.getElementById('dc' + i);
        if (!dc || !dc.width) return;
        var img = new Image();
        img.onload = function() {
          var dpr = window.devicePixelRatio || 1;
          dc.getContext('2d').drawImage(img, 0, 0, dc.width / dpr, dc.height / dpr);
        };
        img.src = dataUrl;
      });
    }
    if (saved.texts) {
      saved.texts.forEach(function(text, i) {
        if (!text) return;
        var ta = document.getElementById('ta' + i);
        if (ta) ta.value = text;
      });
    }
    if (saved.photos) {
      saved.photos.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var pp = document.getElementById('pp' + i);
        if (!pp) return;
        pp.src = dataUrl; pp.style.display = 'block';
        var pz = document.getElementById('pz' + i);
        if (pz) pz.style.opacity = '0.4';
      });
    }
  }, 300);
}

function dismissRestore() {
  document.getElementById('restoreBar').style.display = 'none';
}

function checkForSavedSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  if (!name || !group) { document.getElementById('restoreBar').style.display = 'none'; return; }
  var saved = loadSession(name, group);
  var bar = document.getElementById('restoreBar');
  bar.style.display = (saved && saved.choices && saved.choices.some(function(c){ return c !== null; })) ? 'block' : 'none';
}

var correctCount  = 0;

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS — INJECTION BLOCK ─────────────────────────────────────────
  //   Match these RGB values to --green and --gold above.
  //   PRIMARY  → pBR, pBG, pBB
  //   ACCENT   → pAR, pAG, pAB
  // ──────────────────────────────────────────────────────────────────────────
  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;  // PRIMARY (from SCHOOL, Rule 16)
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;   // ACCENT (from SCHOOL, Rule 16)

    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/\u2192/g,'->').replace(/\u2212/g,'-').replace(/\u00b2/g,'^2')
      .replace(/\u00b3/g,'^3').replace(/\u00d7/g,'x').replace(/\u00f7/g,'/')
      .replace(/\u2260/g,'!=').replace(/\u2264/g,'<=').replace(/\u2265/g,'>=')
      .replace(/\u221a/g,'sqrt').replace(/\u03c0/g,'pi').replace(/\u2026/g,'...')

  // ── PORTADA: orange line / white logo strip / orange line / blue band ──

  //   with an inline-open fallback; everything else -> <a download> click.

  var _fname   = 'geo1_t08_g02_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf';

    var u = URL.createObjectURL(b);

    if (!w) { window.location.href = u; }
    setTimeout(function(){ URL.revokeObjectURL(u); }, 60000);
  }

  var _isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
               (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  if (_isIOS) {
    var _pdfFile = new File([_pdfBlob], _fname, { type:'application/pdf' });
    if (navigator.canShare && navigator.canShare({ files:[_pdfFile] })) {
      navigator.share({ files:[_pdfFile], title:_fname })
        .then(_restorePdfBtn)
        .catch(function(e){
          if (e && e.name === 'AbortError') { _restorePdfBtn(); return; }
          _openPdfInline(_pdfBlob); _restorePdfBtn();
        });
      return;
    }
    _openPdfInline(_pdfBlob); _restorePdfBtn();
    return;
  }

  var _dlUrl = URL.createObjectURL(_pdfBlob);
  var _dlA   = document.createElement('a');
  _dlA.href  = _dlUrl; _dlA.download = _fname;
  document.body.appendChild(_dlA); _dlA.click();

}

/* ══════════════════════════════════════════════════════════════════════════
   GUÍA :: Conflictos territoriales y sus implicaciones.
   Qué es un conflicto territorial y quiénes lo protagonizan, por qué se
   originan (recursos, límites y usos del suelo), qué implicaciones
   ambientales y sociales dejan, cómo escala y por qué vías se atiende, y
   cómo se leen los casos de México y del mundo para poder debatirlos.
   Bilingüe (Rule 10), variantes por semilla (Rule 4), manipulativos marcados
   con data-widget (Part 0).
   ══════════════════════════════════════════════════════════════════════════ */
function L(o){ return (o && o[LANG] !== undefined) ? o[LANG] : (o ? o.es : ''); }
function ri(rng, a, b){ return a + Math.floor(rng() * (b - a + 1)); }
function pk(rng, a){ return a[Math.floor(rng() * a.length)]; }
function permOf(n, rng){
  var a = [], i;
  for (i = 0; i < n; i++) a.push(i);
  for (i = a.length - 1; i > 0; i--){ var j = Math.floor(rng() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}

function say(host, cls, msg){
  var e = host.querySelector('.gw-fb');
  if (!e) return;
  e.className = 'gw-fb' + (cls ? ' ' + cls : '');
  e.innerHTML = msg;
}

function rcard(name, form, note){

function widgetHost(parent, id, kind){

}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 1 :: LA MESA (actor  ->  interés que defiende)
   ══════════════════════════════════════════════════════════════════════════ */
function wActores(rng, host){
  var PAIRS = [
    { a:{ es:'Comunidad dueña de las tierras', en:'Community that owns the land' },
      b:{ es:'Que el monte y el agua sigan siendo suyos y sigan sirviendo', en:'That the woodland and the water stay theirs and keep serving them' },
      cue:{ es:'vive de ese suelo y de esa agua todos los días', en:'lives off that soil and that water every day' } },
    { a:{ es:'Empresa que impulsa la obra', en:'Company promoting the works' },
      b:{ es:'Obtener el permiso para ocupar el terreno y usar el recurso', en:'Getting the permit to occupy the land and use the resource' },
      cue:{ es:'necesita una autorización para poder empezar a construir', en:'needs an authorisation before it can start building' } },
    { a:{ es:'Gobierno del municipio', en:'Municipal government' },
      b:{ es:'Ordenar qué se puede hacer en cada zona del territorio', en:'Deciding what may be done in each zone of the territory' },
      cue:{ es:'es quien define y firma los usos del suelo', en:'is the one that defines and signs off land uses' } },
    { a:{ es:'Autoridad ambiental', en:'Environmental authority' },
      b:{ es:'Vigilar que la obra no dañe el ecosistema de la zona', en:'Making sure the works do not damage the local ecosystem' },
      cue:{ es:'responde por el bosque, el río y las especies, no por el dinero', en:'answers for the forest, the river and the species, not for the money' } },
    { a:{ es:'Personas que riegan río abajo', en:'People who irrigate downstream' },
      b:{ es:'Que el caudal siga llegando hasta sus parcelas cada temporada', en:'That the flow keeps reaching their plots every season' },
      cue:{ es:'está al final del cauce y recibe lo que los demás dejan pasar', en:'is at the end of the channel and receives what the others let through' } }
  ];
  var N = PAIRS.length;
  var st = { left: permOf(N, rng), right: permOf(N, rng), sel: null, done: [], tries: 0 };

  function isDone(i){ return st.done.indexOf(i) >= 0; }

  function render(){
    var leftHtml = st.left.map(function(i){
      var cls = 'mt-chip' + (isDone(i) ? ' done' : (st.sel === i ? ' sel' : ''));
      return '<div class="' + cls + '" data-side="a" data-i="' + i + '">' + L(PAIRS[i].a) + '</div>';
    }).join('');
    var rightHtml = st.right.map(function(i){
      var cls = 'mt-chip' + (isDone(i) ? ' done' : '');
      return '<div class="' + cls + '" data-side="b" data-i="' + i + '">' + L(PAIRS[i].b) + '</div>';
    }).join('');
    host.innerHTML =
      '<div class="gw-h iw-tag">' + L({ es:'La mesa del conflicto', en:'The conflict table' }) + '</div>' +
      '<div class="gw-q">' + L({ es:'¿Quién defiende qué?', en:'Who defends what?' }) + '</div>' +
      '<div class="gw-mini iw-sub">' + L({
        es:'Toca un actor de la izquierda y después el interés que llega a defender. Los pares que aciertes se quedan fijos.',
        en:'Tap an actor on the left and then the interest they come to defend. The pairs you get right stay fixed.'
      }) + '</div>' +
      '<div class="mt-wrap">' +
        '<div class="mt-col"><div class="mt-lbl">' + L({ es:'Actor', en:'Actor' }) + '</div>' + leftHtml + '</div>' +
        '<div class="mt-col"><div class="mt-lbl">' + L({ es:'Interés', en:'Interest' }) + '</div>' + rightHtml + '</div>' +
      '</div>' +
      '<div class="gw-fb"></div>';
    host.querySelectorAll('.mt-chip').forEach(function(el){
      el.addEventListener('click', function(){ tap(el.getAttribute('data-side'), parseInt(el.getAttribute('data-i'), 10)); });
    });
  }

  function finish(){
    say(host, 'good', '🎉 ' + L({
      es:'Mesa completa. Ningún actor llega por capricho: cada uno defiende algo concreto que gana o pierde con la obra, y por eso el conflicto no se resuelve dándole la razón a uno solo.',
      en:'Table complete. No actor comes on a whim: each one defends something concrete that they win or lose with the works, and that is why the conflict is not settled by simply siding with one of them.'
    }));
  }

  function tap(side, i){
    if (isDone(i)) return;
    if (side === 'a'){
      st.sel = (st.sel === i ? null : i);
      var keep = host.querySelector('.gw-fb').innerHTML;
      render();
      if (st.sel !== null){
        say(host, 'warm', L({ es:'Elegiste a ', en:'You picked ' }) + '<b>' + L(PAIRS[st.sel].a) + '</b>. ' +
          L({ es:'Ahora toca el interés que esa parte llega a defender.', en:'Now tap the interest that party comes to defend.' }));
      } else if (keep){ say(host, '', keep); }
      return;
    }
    if (st.sel === null){
      say(host, 'warm', L({
        es:'Primero elige un actor de la columna izquierda: el interés se entiende cuando sabes quién lo carga.',
        en:'Pick an actor from the left column first: an interest makes sense once you know who carries it.'
      }));
      return;
    }
    var chosen = st.sel;
    if (i === chosen){
      st.done.push(chosen); st.sel = null; st.tries = 0;
      render();
      if (st.done.length >= N){ finish(); return; }
      say(host, 'good', '✓ ' + L(PAIRS[chosen].b) + '. ' + L({ es:'Ese actor ', en:'That actor ' }) + L(PAIRS[chosen].cue) + '.');
      return;
    }
    st.tries++;
    if (st.tries >= 3){
      st.done.push(chosen); st.sel = null; st.tries = 0;
      render();
      say(host, 'warm', L({ es:'Le corresponde: ', en:'The right one is: ' }) + '<b>' + L(PAIRS[chosen].b) + '</b>. ' +
        L({ es:'Ese actor ', en:'That actor ' }) + L(PAIRS[chosen].cue) + '.');
      if (st.done.length >= N) finish();
      return;
    }
    say(host, 'miss', L({ es:'Todavía no. Piensa que ese actor ', en:'Not yet. Remember that this actor ' }) +
      L(PAIRS[chosen].cue) + L({ es:', y vuelve a elegir.', en:', and choose again.' }));
  }

  render();
  say(host, '', L({
    es:'Cinco actores llegan a la misma mesa por el mismo territorio.',
    en:'Five actors arrive at the same table over the same territory.'
  }));
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 2 :: REPARTIR LA CUENCA (dos tomas, un caudal, un humedal)
   ══════════════════════════════════════════════════════════════════════════ */
function wCuenca(rng, host){
  var T = 10 * ri(rng, 70, 90);
  var needR = 10 * Math.round(T * 0.034);
  var needC = 10 * Math.round(T * 0.024);
  var needE = 10 * Math.round(T * 0.030);
  var st = { r: needR + 10 * ri(rng, 8, 14), c: needC + 10 * ri(rng, 3, 6), solved: false };

  host.innerHTML =
    '<div class="gw-h iw-tag">' + L({ es:'Repartir la cuenca', en:'Sharing the basin' }) + '</div>' +
    '<div class="gw-q">' + L({ es:'Un río, tres partes que lo esperan', en:'One river, three parties waiting for it' }) + '</div>' +
    '<div class="gw-mini iw-sub">' + L({
      es:'El río trae ' + T + ' hm³ al año. Mueve las dos tomas hasta que las parcelas de riego, la ciudad y el humedal del final queden cubiertos. La marca gris de cada barra es lo que esa parte necesita.',
      en:'The river brings ' + T + ' hm³ a year. Move the two intakes until the irrigated plots, the city and the wetland at the end are all covered. The grey mark on each bar is what that party needs.'
    }) + '</div>' +
    '<div class="cu-row">' +
      '<div class="cu-lbl"><span>' + L({ es:'Toma de riego', en:'Irrigation intake' }) + '</span><span class="cu-val" data-v="r"></span></div>' +
      '<div class="cu-track"><div class="cu-fill" data-b="r"></div><div class="cu-need" data-n="r"></div></div>' +
      '<input class="cu-sld" type="range" data-s="r" min="0" max="' + T + '" step="10" value="' + st.r + '">' +
    '</div>' +
    '<div class="cu-row">' +
      '<div class="cu-lbl"><span>' + L({ es:'Toma de la ciudad', en:'City intake' }) + '</span><span class="cu-val" data-v="c"></span></div>' +
      '<div class="cu-track"><div class="cu-fill alt" data-b="c"></div><div class="cu-need" data-n="c"></div></div>' +
      '<input class="cu-sld" type="range" data-s="c" min="0" max="' + T + '" step="10" value="' + st.c + '">' +
    '</div>' +
    '<div class="cu-row">' +
      '<div class="cu-lbl"><span>' + L({ es:'Lo que llega al humedal', en:'What reaches the wetland' }) + '</span><span class="cu-val" data-v="e"></span></div>' +
      '<div class="cu-track"><div class="cu-fill eco" data-b="e"></div><div class="cu-need" data-n="e"></div></div>' +
    '</div>' +
    '<div class="cu-stats">' +
      '<div class="cu-st"><div class="cu-sl">' + L({ es:'Riego', en:'Irrigation' }) + '</div><div class="cu-sv" data-k="r"></div></div>' +
      '<div class="cu-st"><div class="cu-sl">' + L({ es:'Ciudad', en:'City' }) + '</div><div class="cu-sv" data-k="c"></div></div>' +
      '<div class="cu-st"><div class="cu-sl">' + L({ es:'Humedal', en:'Wetland' }) + '</div><div class="cu-sv" data-k="e"></div></div>' +
    '</div>' +
    '<div class="gw-fb"></div>';

  function w(el, v){ el.style.width = Math.max(0, Math.min(100, v / T * 100)) + '%'; }

  function draw(){
    var e = T - st.r - st.c;
    host.querySelector('[data-v="r"]').textContent = st.r + ' hm³';
    host.querySelector('[data-v="c"]').textContent = st.c + ' hm³';
    host.querySelector('[data-v="e"]').textContent = Math.max(0, e) + ' hm³';
    w(host.querySelector('[data-b="r"]'), st.r);
    w(host.querySelector('[data-b="c"]'), st.c);
    w(host.querySelector('[data-b="e"]'), Math.max(0, e));
    host.querySelector('[data-n="r"]').style.left = (needR / T * 100) + '%';
    host.querySelector('[data-n="c"]').style.left = (needC / T * 100) + '%';
    host.querySelector('[data-n="e"]').style.left = (needE / T * 100) + '%';
    var be = host.querySelector('[data-b="e"]');
    be.className = 'cu-fill ' + (e >= needE ? 'eco' : 'low');
    host.querySelector('[data-k="r"]').className = 'cu-sv ' + (st.r >= needR ? 'hit' : 'off');
    host.querySelector('[data-k="c"]').className = 'cu-sv ' + (st.c >= needC ? 'hit' : 'off');
    host.querySelector('[data-k="e"]').className = 'cu-sv ' + (e >= needE ? 'hit' : 'off');
    host.querySelector('[data-k="r"]').textContent = st.r + ' / ' + needR;
    host.querySelector('[data-k="c"]').textContent = st.c + ' / ' + needC;
    host.querySelector('[data-k="e"]').textContent = Math.max(0, e) + ' / ' + needE;

    if (st.r + st.c > T){
      say(host, 'miss', L({
        es:'Entre las dos tomas estás repartiendo más agua de la que el río trae en todo el año. Baja alguna de las dos.',
        en:'Between the two intakes you are handing out more water than the river brings in a whole year. Lower one of them.'
      }));
      return;
    }
    if (e < needE){
      say(host, 'miss', L({
        es:'Al humedal solo llegan ' + e + ' hm³ y necesita ' + needE + ': le faltan ' + (needE - e) + ' hm³ y se está secando. Baja alguna de las dos tomas.',
        en:'Only ' + e + ' hm³ reach the wetland and it needs ' + needE + ': it is short by ' + (needE - e) + ' hm³ and is drying out. Lower one of the two intakes.'
      }));
      return;
    }
    if (st.r < needR){
      say(host, 'warm', L({
        es:'Las parcelas de riego se quedan cortas por ' + (needR - st.r) + ' hm³. Todavía hay margen: sube esa toma.',
        en:'The irrigated plots fall short by ' + (needR - st.r) + ' hm³. There is still room: raise that intake.'
      }));
      return;
    }
    if (st.c < needC){
      say(host, 'warm', L({
        es:'La ciudad no completa lo que necesita: le faltan ' + (needC - st.c) + ' hm³. Sube su toma sin dejar seco el humedal.',
        en:'The city does not complete what it needs: it is short by ' + (needC - st.c) + ' hm³. Raise its intake without leaving the wetland dry.'
      }));
      return;
    }
    st.solved = true;
    say(host, 'good', '🎉 ' + L({
      es:'Las tres partes quedan cubiertas y todavía sobran ' + (e - needE) + ' hm³ en el cauce. Así se ve un acuerdo de cuenca que aguanta: nadie toma todo y el ecosistema entra en el reparto como una parte más.',
      en:'All three parties are covered and there are still ' + (e - needE) + ' hm³ to spare in the channel. That is what a basin agreement that holds looks like: nobody takes everything and the ecosystem enters the sharing as one more party.'
    }));
  }

  host.querySelectorAll('.cu-sld').forEach(function(sl){
    sl.addEventListener('input', function(){
      st[sl.getAttribute('data-s')] = parseInt(sl.value, 10);
      draw();
    });
  });
  draw();
}

   ══════════════════════════════════════════════════════════════════════════ */
function wImplic(rng, host){

    { es:'Causa del conflicto', en:'Cause of the conflict' },

    { es:'Implicación social', en:'Social implication' }
  ];

    { es:'Un ejido y una empresa reclaman el mismo predio', en:'An ejido and a company claim the same plot', bin:0,
      why:{ es:'Es el punto de partida: dos partes sobre el mismo suelo.', en:'It is the starting point: two parties over the same ground.' } },
    { es:'El arroyo baja con residuos y los peces desaparecen', en:'The stream runs with waste and the fish disappear', bin:1,
      why:{ es:'El daño cae sobre el agua y sobre las especies que vivían en ella.', en:'The damage falls on the water and on the species that lived in it.' } },
    { es:'Treinta familias tienen que mudarse a otra localidad', en:'Thirty families have to move to another town', bin:2,

    { es:'Se talan cien hectáreas de bosque para abrir el camino', en:'A hundred hectares of forest are felled to open the road', bin:1,
      why:{ es:'Se pierde cubierta vegetal, y con ella suelo y refugio de fauna.', en:'Plant cover is lost, and with it soil and shelter for wildlife.' } },
    { es:'Dos municipios no acuerdan dónde termina uno y empieza el otro', en:'Two municipalities do not agree where one ends and the other begins', bin:0,
      why:{ es:'Un límite sin definir es de por sí un origen de disputa.', en:'An undefined boundary is in itself a source of dispute.' } },
    { es:'Las asambleas del pueblo terminan en pleitos entre vecinos', en:'The town assemblies end in quarrels between neighbours', bin:2,
      why:{ es:'Se rompe el tejido de la comunidad, y eso también es un costo.', en:'The fabric of the community breaks, and that is a cost too.' } },
    { es:'El nivel del pozo comunitario baja un poco cada año', en:'The level of the community well drops a little every year', bin:1,
      why:{ es:'El agua subterránea se extrae más rápido de lo que se repone.', en:'Groundwater is taken out faster than it is put back.' } }
  ];
  var st = { seq: permOf(ITEMS.length, rng), i: 0, tries: 0, hits: 0, done: false, busy: false };

  function render(){
    st.busy = false;
    if (st.done){
      host.innerHTML =
        '<div class="gw-h iw-tag">' + L({ es:'Causa o implicación', en:'Cause or implication' }) + '</div>' +
        '<div class="gw-q">' + L({ es:'Tablero terminado', en:'Board finished' }) + '</div>' +
        '<div class="gw-fb good">🎉 ' + L({
          es:'Acertaste ' + st.hits + ' de ' + ITEMS.length + '. Lo que originó el conflicto, lo que le pasó al entorno y lo que le pasó a la gente son tres cosas distintas, y casi siempre aparecen juntas.',
          en:'You got ' + st.hits + ' of ' + ITEMS.length + '. What started the conflict, what happened to the surroundings and what happened to the people are three different things, and they almost always show up together.'
        }) + '</div>';
      return;
    }
    var it = ITEMS[st.seq[st.i]];
    host.innerHTML =
      '<div class="gw-h iw-tag">' + L({ es:'Causa o implicación', en:'Cause or implication' }) + '</div>' +
      '<div class="gw-q">' + L({ es:'¿Dónde va cada hecho?', en:'Where does each fact go?' }) + '</div>' +
      '<div class="gw-mini iw-sub">' + L({
        es:'Lee el hecho y decide si es lo que originó el conflicto, lo que le ocurrió al entorno o lo que le ocurrió a la gente.',
        en:'Read the fact and decide whether it is what started the conflict, what happened to the surroundings or what happened to the people.'
      }) + '</div>' +
      '<div class="cl-prog">' + (st.i + 1) + ' / ' + ITEMS.length + '</div>' +
      '<div class="cl-card">' + L(it) + '</div>' +
      '<div class="cl-bins">' + BINS.map(function(b, bi){
        return '<button class="cl-bin" data-b="' + bi + '">' + L(b) + '</button>';
      }).join('') + '</div>' +
      '<div class="gw-fb"></div>';
    host.querySelectorAll('.cl-bin').forEach(function(btn){
      btn.addEventListener('click', function(){ choose(parseInt(btn.getAttribute('data-b'), 10)); });
    });
  }

  function advance(){
    st.busy = true;
    st.i++; st.tries = 0;
    if (st.i >= ITEMS.length) st.done = true;
    setTimeout(render, 1100);
  }

  function choose(bi){
    if (st.busy || st.done) return;
    var it = ITEMS[st.seq[st.i]];
    if (bi === it.bin){
      st.hits++;

        en:'Not yet: this did not start the conflict, it happened once the conflict already existed. Who or what did it happen to?'

      }));
    }
  }

  render();
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 4 :: LA RUTA DEL CONFLICTO (ordenar)
   ══════════════════════════════════════════════════════════════════════════ */
function wRuta(rng, host){
  var STEPS = [
    { es:'Un grupo de vecinos nota el cambio y muestra su inconformidad', en:'A group of neighbours notices the change and voices discontent' },
    { es:'La comunidad presenta un reclamo por escrito ante la autoridad', en:'The community files a written claim before the authority' },
    { es:'Sin respuesta, el reclamo se hace público y llega a los medios', en:'With no reply, the claim goes public and reaches the media' },
    { es:'Se abre una mesa de diálogo conducida por alguien ajeno al caso', en:'A dialogue table opens, run by someone outside the case' },
    { es:'Se firma un acuerdo con reglas medibles y con fechas de revisión', en:'An agreement is signed with measurable rules and review dates' }
  ];
  var N = STEPS.length;
  var st = { order: permOf(N, rng), sel: null, tries: 0, done: false };
  if (st.order.every(function(v, i){ return v === i; })) { var q = st.order[0]; st.order[0] = st.order[N - 1]; st.order[N - 1] = q; }

  function render(){
    var chips = st.order.map(function(ei, pos){
      var cls = 'tl-chip' + (st.done ? ' locked' : (st.sel === pos ? ' sel' : ''));
      return '<div class="' + cls + '" data-p="' + pos + '"><span class="tl-num">' + (pos + 1) + '</span>' + L(STEPS[ei]) + '</div>';
    }).join('');
    host.innerHTML =
      '<div class="gw-h iw-tag">' + L({ es:'La ruta del conflicto', en:'The route of the conflict' }) + '</div>' +
      '<div class="gw-q">' + L({ es:'Del primer reclamo al acuerdo', en:'From the first claim to the agreement' }) + '</div>' +
      '<div class="gw-mini iw-sub">' + L({
        es:'Ordena los momentos del primero al último. Toca dos tarjetas para intercambiarlas y después verifica.',
        en:'Order the moments from first to last. Tap two cards to swap them and then check.'
      }) + '</div>' +
      '<div class="tl-list">' + chips + '</div>' +
      (st.done ? '' : '<div class="gw-row"><button class="gw-btn" data-r="check">' + L({ es:'Verificar el orden', en:'Check the order' }) + '</button></div>') +
      '<div class="gw-fb"></div>';
    host.querySelectorAll('.tl-chip').forEach(function(el){
      el.addEventListener('click', function(){ tap(parseInt(el.getAttribute('data-p'), 10)); });
    });
    var b = host.querySelector('[data-r="check"]');
    if (b) b.addEventListener('click', check);
  }

  function tap(pos){
    if (st.done) return;
    var msg = host.querySelector('.gw-fb').innerHTML;
    if (st.sel === null) st.sel = pos;
    else if (st.sel === pos) st.sel = null;
    else { var t = st.order[st.sel]; st.order[st.sel] = st.order[pos]; st.order[pos] = t; st.sel = null; }
    render();
    if (msg) say(host, '', msg);
  }

  function check(){
    var ok = st.order.every(function(ei, pos){ return ei === pos; });
    if (ok){
      st.done = true; render();
      say(host, 'good', '🎉 ' + L({
        es:'Ese es el camino. Un conflicto sube de intensidad cuando la vía formal no responde, y baja cuando alguien logra sentar a las dos partes con reglas que se pueden medir.',
        en:'That is the path. A conflict rises in intensity when the formal route gives no answer, and it comes down when someone manages to seat both parties with rules that can be measured.'
      }));
      return;
    }
    st.tries++;
    if (st.tries >= 3){
      st.order = STEPS.map(function(_, i){ return i; });
      st.done = true; render();
      say(host, 'warm', L({
        es:'Este es el orden. Fíjate en que cada momento nace de que el anterior no bastó: el reclamo aparece porque la inconformidad no se atendió, y la mesa se abre porque el conflicto ya no cabía en la oficina.',
        en:'This is the order. Notice that each moment is born because the previous one was not enough: the claim appears because the discontent was not attended to, and the table opens because the conflict no longer fitted inside an office.'
      }));
      return;
    }
    var bad = 0;
    for (var i = 0; i < N; i++){ if (st.order[i] !== i){ bad = i; break; } }
    say(host, 'miss', L({
      es:'Todavía no. Mira la tarjeta número ' + (bad + 1) + ': ¿lo que dice puede pasar antes de lo que está arriba de ella?',
      en:'Not yet. Look at card number ' + (bad + 1) + ': can what it says happen before what is above it?'
    }));
  }

  render();
  say(host, '', L({
    es:'Los cinco momentos están revueltos.',
    en:'The five moments are shuffled.'
  }));
}

}

function buildLesson(rng){
  injectGuideCSS();

  /* ── Apertura ── */
  sec(
    L({ es:'Punto de partida', en:'Starting point' }),
    L({ es:'Dos pueblos, un mismo río', en:'Two towns, one river' }),
    '<p>' + L({
      es:'Imagina un río que baja de la sierra y cruza dos pueblos. En el de arriba levantan un bordo para regar más hectáreas; en el de abajo, un mes después, el agua llega apenas para la mitad de las parcelas. Nadie robó nada y nadie mintió: los dos usan el mismo río, solo que uno lo toca primero. Ahí empieza un conflicto territorial, y lo que sigue depende de si las partes se sientan a hablar o cada quien se defiende como puede.',
      en:'Picture a river coming down from the mountains and crossing two towns. In the upper one they build a weir to irrigate more hectares; in the lower one, a month later, the water barely reaches half the plots. Nobody stole anything and nobody lied: both use the same river, only one touches it first. That is where a territorial conflict begins, and what follows depends on whether the parties sit down to talk or each one defends itself as best it can.'
    }) + '</p>' +
    '<p>' + L({
      es:'Conflictos así hay en todo el mundo y también en México: por el agua de una presa, por el límite entre dos municipios, por un monte, por una mina o por una obra que cambia el uso de un valle entero. En esta guía vas a aprender a reconocerlos, a distinguir qué les pasa al entorno y a las personas cuando se alargan, y a discutirlos con datos en la mano en lugar de con impresiones.',
      en:'Conflicts like this exist all over the world and also in Mexico: over the water of a dam, over the boundary between two municipalities, over a woodland, over a mine or over works that change the use of a whole valley. In this guide you will learn to recognise them, to tell what happens to the surroundings and to people when they drag on, and to discuss them with figures in hand instead of impressions.'
    }) + '</p>' +
    '<div class="callout"><p><strong>' + L({ es:'Lo que vas a hacer: ', en:'What you are going to do: ' }) + '</strong>' + L({
      es:'vas a sentar a cinco actores en una mesa y descubrir qué defiende cada uno, a repartir el caudal de un río hasta que el riego, la ciudad y el humedal queden cubiertos, a separar lo que originó un conflicto de lo que le hizo al entorno y a la gente, a ordenar la ruta que va del primer reclamo al acuerdo firmado, y a proponer una salida para un caso de tu propia localidad.',
      en:'you are going to seat five actors at a table and discover what each one defends, share out the flow of a river until irrigation, the city and the wetland are all covered, separate what started a conflict from what it did to the surroundings and to the people, order the route that runs from the first claim to the signed agreement, and propose a way out for a case in your own locality.'
    }) + '</p></div>'
  );

  /* ══ CONCEPTO 1 ══ */
  var s1 = sec(
    L({ es:'Concepto 1', en:'Concept 1' }),
    L({ es:'Qué es un conflicto territorial y quién lo protagoniza', en:'What a territorial conflict is and who takes part in it' }),
    '<p>' + L({
      es:'Un conflicto territorial es una disputa sostenida entre dos o más actores por el control, el uso o los límites de un mismo territorio, o de los recursos que se encuentran en él. Tiene siempre tres ingredientes: un espacio concreto que se reclama, actores con intereses que no caben juntos, y tiempo. Una discusión de una tarde no alcanza; estos casos se miden en años y a veces en generaciones.',
      en:'A territorial conflict is a sustained dispute between two or more actors over the control, the use or the boundaries of the same territory, or of the resources found in it. It always has three ingredients: a specific space being claimed, actors with interests that do not fit together, and time. A one afternoon argument is not enough; these cases are measured in years and sometimes in generations.'
    }) + '</p>' +
    '<p>' + L({
      es:'Los actores rara vez son dos personas. Suelen ser comunidades y ejidos, empresas, gobiernos municipales o estatales, autoridades ambientales, personas usuarias del agua, y a veces países enteros. Cada uno llega con algo concreto que gana o pierde, y por eso ninguno se convence con un discurso: se convence con condiciones. Entender qué defiende cada parte no es un detalle, es lo que permite ver por qué el conflicto no se resuelve solo.',
      en:'The actors are rarely two individuals. They are usually communities and ejidos, companies, municipal or state governments, environmental authorities, water users, and sometimes whole countries. Each one arrives with something concrete to win or lose, and that is why none of them is convinced by a speech: they are convinced by conditions. Understanding what each side defends is not a detail, it is what lets you see why the conflict does not settle itself.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Territorio', en:'Territory' }), L({ es:'un espacio concreto', en:'a specific space' }), L({ es:'un predio, un cauce, una franja, un monte', en:'a plot, a channel, a strip, a woodland' })) +
      rcard(L({ es:'Actores', en:'Actors' }), L({ es:'dos o más partes', en:'two or more parties' }), L({ es:'comunidades, empresas, gobiernos, países', en:'communities, companies, governments, countries' })) +
      rcard(L({ es:'Intereses', en:'Interests' }), L({ es:'usos que no caben juntos', en:'uses that do not fit together' }), L({ es:'lo que cada parte gana o pierde', en:'what each party wins or loses' })) +
      rcard(L({ es:'Duración', en:'Duration' }), L({ es:'se sostiene en el tiempo', en:'it holds over time' }), L({ es:'no se cierra en una conversación', en:'it does not close in one conversation' })) +
    '</div>'
  );
  wActores(rng, widgetHost(s1, 'w_mesa', 'match'));
  addProblem(rng, mkP1(rng));
  addProblem(rng, mkP2(rng));

  /* ══ CONCEPTO 2 ══ */
  var s2 = sec(
    L({ es:'Concepto 2', en:'Concept 2' }),
    L({ es:'Por qué se originan: recursos, límites y usos del suelo', en:'Why they start: resources, boundaries and land uses' }),
    '<p>' + L({
      es:'Casi todos los conflictos territoriales nacen de una de tres raíces. La primera es un recurso natural que no alcanza para todos los que lo quieren: el agua de un río o de un acuífero, la tierra fértil, el bosque, los minerales, la pesca. La segunda es un límite que no está definido o que las partes no aceptan igual, entre países, entre entidades, entre municipios o entre comunidades vecinas. La tercera son dos usos del suelo que se estorban en el mismo lugar, como una zona agrícola donde se autoriza una fábrica o un fraccionamiento.',
      en:'Almost every territorial conflict grows from one of three roots. The first is a natural resource that is not enough for everyone who wants it: the water of a river or an aquifer, fertile land, forest, minerals, fisheries. The second is a boundary that is undefined or that the parties do not accept in the same way, between countries, between states, between municipalities or between neighbouring communities. The third is two land uses that get in each other way in the same place, such as a farming area where a factory or a housing estate is authorised.'
    }) + '</p>' +
    '<p>' + L({
      es:'El agua es el caso que mejor muestra el problema, porque baja en un solo sentido: quien está río arriba decide, sin proponérselo, cuánto le queda a quien está río abajo. Y no solo compiten las personas. El propio ecosistema necesita un caudal mínimo para seguir vivo, y cuando se reparte todo entre usos humanos, el humedal, el manglar o el lago del final del cauce desaparecen sin que nadie firmara esa decisión.',
      en:'Water is the case that shows the problem best, because it flows one way only: whoever is upstream decides, without meaning to, how much is left for whoever is downstream. And it is not only people who compete. The ecosystem itself needs a minimum flow to stay alive, and when everything is shared out among human uses, the wetland, the mangrove or the lake at the end of the channel disappears without anyone having signed that decision.'
    }) + '</p>'
  );
  wCuenca(rng, widgetHost(s2, 'w_cuenca', 'share'));
  addProblem(rng, mkP3(rng));
  addProblem(rng, mkP4(rng));

  /* ══ CONCEPTO 3 ══ */
  var s3 = sec(
    L({ es:'Concepto 3', en:'Concept 3' }),
    L({ es:'Lo que dejan: implicaciones ambientales y sociales', en:'What they leave behind: environmental and social implications' }),
    '<p>' + L({
      es:'Un conflicto territorial que se alarga deja huella en dos frentes. En el ambiental aparecen la tala y la pérdida de suelo, la contaminación de arroyos y pozos, el descenso de los acuíferos, la desaparición de especies y el cambio del cauce de un río. En el social aparecen el desplazamiento de familias, la pérdida de la actividad de la que vivían, la migración, la ruptura entre vecinos que antes se ayudaban, los daños a la salud y la pérdida de sitios con valor cultural.',
      en:'A territorial conflict that drags on leaves its mark on two fronts. On the environmental one come felling and soil loss, pollution of streams and wells, falling aquifers, the disappearance of species and the shifting of a river channel. On the social one come the displacement of families, the loss of the activity they lived on, migration, the break between neighbours who used to help each other, harm to health and the loss of places with cultural value.'
    }) + '</p>' +
    '<p>' + L({
      es:'Las dos listas parecen separadas, pero están encadenadas: cuando el agua se contamina, lo que se pierde no es solo el arroyo, es el trabajo de quien vivía de él. Y hay un efecto que sorprende: mientras la propiedad está en duda, a nadie le conviene cuidar el territorio, así que el daño se acelera justo durante los años en que el caso sigue abierto. Por eso conviene distinguir siempre tres cosas: qué originó el conflicto, qué le hizo al entorno y qué le hizo a la gente.',
      en:'The two lists look separate, but they are chained together: when water is polluted, what is lost is not only the stream, it is the livelihood of whoever lived off it. And there is a surprising effect: while ownership is in doubt, nobody has any reason to look after the territory, so the damage speeds up precisely during the years the case stays open. That is why it is always worth telling three things apart: what started the conflict, what it did to the surroundings and what it did to the people.'
    }) + '</p>'
  );
  wImplic(rng, widgetHost(s3, 'w_implicaciones', 'classify'));
  addProblem(rng, mkP5(rng));
  addProblem(rng, mkP6(rng));

  /* ══ CONCEPTO 4 ══ */
  var s4 = sec(
    L({ es:'Concepto 4', en:'Concept 4' }),
    L({ es:'Cómo sube de intensidad y por dónde se atiende', en:'How it escalates and where it gets addressed' }),
    '<p>' + L({
      es:'Los conflictos territoriales casi nunca empiezan con un bloqueo. Empiezan con alguien que nota un cambio y lo dice. Si nadie responde, ese malestar se convierte en un reclamo por escrito ante la autoridad; si tampoco hay respuesta, el asunto se hace público y busca ser visible; y solo cuando el costo de ignorarlo se vuelve alto, se abre una mesa. Cada escalón aparece porque el anterior no bastó, y por eso atender temprano cuesta mucho menos que atender tarde.',
      en:'Territorial conflicts almost never begin with a blockade. They begin with someone who notices a change and says so. If nobody answers, that unease becomes a written claim before the authority; if there is still no answer, the matter goes public and seeks visibility; and only when the cost of ignoring it becomes high does a table open. Each step appears because the previous one was not enough, which is why attending early costs far less than attending late.'
    }) + '</p>' +
    '<p>' + L({
      es:'Para bajar la intensidad hay varias vías: el diálogo directo entre las partes, la mediación de alguien ajeno que conduce la conversación sin defender a nadie, la consulta a las comunidades antes de autorizar una obra, la resolución de un tribunal cuando el desacuerdo es legal, y los tratados y comisiones conjuntas cuando el territorio cruza una frontera. Ninguna funciona si el acuerdo no se puede medir ni revisar: lo que dura es lo que trae volúmenes, fechas y una forma de comprobar que se cumple.',
      en:'To bring the intensity down there are several routes: direct dialogue between the parties, mediation by an outsider who runs the conversation without defending anyone, consultation of the communities before a project is authorised, a court ruling when the disagreement is a legal one, and treaties and joint commissions when the territory crosses a border. None of them works if the agreement cannot be measured or reviewed: what lasts is what comes with volumes, dates and a way of checking that it is being met.'
    }) + '</p>' +
    '<div class="rules-grid">' +

    '</div>'
  );
  wRuta(rng, widgetHost(s4, 'w_ruta', 'timeline'));
  addProblem(rng, mkP7(rng));
  addProblem(rng, mkP8(rng));

  /* ══ CONCEPTO 5 ══ */
  var s5 = sec(
    L({ es:'Concepto 5', en:'Concept 5' }),
    L({ es:'En México y en el mundo: cómo se debate un caso', en:'In Mexico and in the world: how a case is debated' }),
    '<p>' + L({
      es:'En México los casos más frecuentes son el reparto del agua de una presa entre distritos de riego y ciudades, los límites entre entidades o entre comunidades que llevan décadas en revisión, la minería en cuencas de las que dependen pueblos enteros, y las grandes obras que cambian el uso de un territorio. En el mundo se repiten los mismos motivos a otra escala: ríos que cruzan fronteras y se reparten por tratado, como los que comparten México y Estados Unidos o los países del Nilo, y zonas marinas donde varios países reclaman las mismas islas y la misma pesca.',
      en:'In Mexico the most frequent cases are the sharing of dam water between irrigation districts and cities, boundaries between states or between communities that have been under review for decades, mining in basins on which whole towns depend, and large projects that change the use of a territory. In the world the same motives repeat at another scale: rivers that cross borders and are shared by treaty, such as those shared by Mexico and the United States or by the Nile countries, and sea areas where several countries claim the same islands and the same fisheries.'

    '<p>' + L({

<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbzLGV15JRTPs9bbSvHRLfgOXeT9oUExDf1AH546WOwq5tYxXSdhX212OWi_bTJfMGx9/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'Conflictos Territoriales y sus Implicaciones';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
