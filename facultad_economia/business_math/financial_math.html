<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Financial Mathematics · Business Math · School of Economics, Universidad de Colima</title>
<link rel="canonical" href="https://liaxa.mx/facultad_economia/business_math/neg_financieras.html">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS ── fallback only; applyBranding() re-injects from SCHOOL ── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;
  --gold-bg:    #faf3e0;
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; object-fit:contain; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; min-width:0; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── LANGUAGE TOGGLE ── */
.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }
.dlist { font-family:'IBM Plex Mono',monospace; font-size:.78rem; color:var(--green-dark); background:var(--surface2); border-radius:8px; padding:.6rem .7rem; margin:.6rem 0; word-break:break-word; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); overflow-x:auto; }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── INTERACTIVE WIDGETS ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.iw-head { display:flex; align-items:baseline; gap:.6rem; margin-bottom:.3rem; flex-wrap:wrap; }
.iw-tag { font-size:.62rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; }
.iw-title { font-family:'Crimson Pro',serif; font-size:1.08rem; font-weight:700; }
.iw-sub { font-size:.8rem; color:var(--text2); margin-bottom:.85rem; }
.iw-canvas { display:block; width:100%; border-radius:8px; background:var(--surface2); }
.iw-read { margin-top:.85rem; background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 8px 8px 0; padding:.7rem .85rem; font-size:.82rem; color:var(--text2); }
.iw-read strong { color:var(--green-dark); }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (widget toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.3rem .7rem; font-size:.76rem; cursor:pointer; color:var(--text2); transition:all .14s; font-family:inherit; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--gold-bg); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }

/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos { gap: .9rem; }
  .wlogos img { height: 38px; max-width: 42%; }
  .wtitle { font-size: 1.35rem; }
  .stickybar { padding: .5rem .55rem; gap: .38rem; }
  .htitle { display: none; }
  .halexis { display: none; }
  .hsep { display: none; }
  .hlogos { gap: .3rem; }
  .hlogos img { height: 18px; max-width: 60px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 78px; overflow: hidden; text-overflow: ellipsis; }
  .lang-btn { padding: .26rem .48rem; font-size: .68rem; }
  .lbody { padding: 1.2rem .7rem 3rem; max-width: 100%; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .gcrd { padding: .9rem .75rem; }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}
</style>
</head>
<body>

<!-- ════════════════════ WELCOME ════════════════════ -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <div style="font-family:'Crimson Pro',serif;font-size:2rem;font-weight:700;letter-spacing:.06em;color:#1a4a8a;line-height:1;letter-spacing:.28em;text-indent:.28em">ALEXIS</div>
    </div>
    <div class="wtitle" id="wtitle-el">Financial Mathematics</div>
    <div class="wcourse" id="wcourse-el">Business Math</div>
    <label class="flabel" for="sName" id="lbl-name-el">Full name</label>
    <input class="finput" id="sName" type="text" placeholder="Your full name" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" for="sGroup" id="lbl-group-el">Group</label>
    <input class="finput" id="sGroup" type="text" placeholder="e.g. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Start</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreTitle">Saved session found</strong><br>
      <span id="restoreMsg">Do you want to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="200" height="48" viewBox="-22 0 160 34" xmlns="http://www.w3.org/2000/svg"><polyline points="4,24 10,18 16,20 22,10" fill="none" stroke="#1a4a8a" stroke-width="2"/><circle cx="22" cy="10" r="2.5" fill="#c9a84c"/><line x1="32" y1="6" x2="32" y2="28" stroke="#c9a84c" stroke-width="2"/><text x="42" y="22" font-family="'Crimson Pro',serif" font-weight="700" letter-spacing="3" fill="#1a4a8a" font-size="16">LIAXA</text></svg>
    </div>
  </div>
</div>

<!-- ════════════════════ LESSON ════════════════════ -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo -->
      <img id="hlogo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle" id="htitle-el">Financial Mathematics</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 120 34" xmlns="http://www.w3.org/2000/svg"><polyline points="4,24 10,18 16,20 22,10" fill="none" stroke="#1a4a8a" stroke-width="2"/><circle cx="22" cy="10" r="2.5" fill="#c9a84c"/><line x1="32" y1="6" x2="32" y2="28" stroke="#c9a84c" stroke-width="2"/><text x="42" y="22" font-family="'Crimson Pro',serif" font-weight="700" letter-spacing="3" fill="#1a4a8a" font-size="16">LIAXA</text></svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle">
      <button class="lang-btn"        id="btn-es" onclick="setLang('es')">ES</button>
      <button class="lang-btn active" id="btn-en" onclick="setLang('en')">EN</button>
    </div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="dlbtn" id="dlBtn" onclick="generatePDF()">Download results as PDF</button>
    </div>
  </div>
</div>

<script>

/* ── Score reporting ─────────────────────────────────────────────────────────
   Sends grade silently to Google Sheet when student finishes.
   Set SCORE_ENDPOINT = '' to disable without breaking anything.
   ──────────────────────────────────────────────────────────────────────────── */
var SCORE_ENDPOINT = 'https://script.google.com/macros/s/AKfycbxSJnnHSGtMSBcK4ggFvfN2DtEdTSK_yn57GA0OgOI1kJqHufnIsr5lOGAJZkQro_8G/exec';
/* ════════════════════════════════════════════════════════════════════════
   SCHOOL CONFIG · edit ONLY this block to rebrand for a different school
   ════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:      '#1a4a8a',
  primaryDark:  '#0f2d5a',
  primaryBg:    '#e8edf5',
  accent:       '#c9a84c',
  accentBg:     '#faf3e0',
  pBR: 26,  pBG: 74,  pBB: 138,
  pAR: 201, pAG: 168, pAB: 76,
  darkPrimary:     '#4a7abf',
  darkPrimaryDark: '#7aaae0',
  darkPrimaryBg:   '#0e1e38',
  darkAccent:      '#d4b86a',
  darkAccentBg:    '#241e0e',
  logoLeftB64:  '',
  logoRightB64: '',

function getAttemptKey(name, group) {
  return 'fac_econ_neg__neg_financieras__att__' + (name + '__' + group).replace(/\s+/g, '_');
}
function nextAttempt(name, group) {
  var k = getAttemptKey(name, group), n = 0;
  try { n = parseInt(localStorage.getItem(k) || '0', 10) || 0; } catch(e) {}
  n++;
  try { localStorage.setItem(k, String(n)); } catch(e) {}
  return n;
}
function currentAttempt(name, group) {
  var k = getAttemptKey(name, group);
  try { return parseInt(localStorage.getItem(k) || '1', 10) || 1; } catch(e) { return 1; }
}
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t2 = s ^ (s >>> 16);
    t2 = Math.imul(t2, 0x21f0aaad);
    t2 ^= (t2 >>> 15);
    t2 = Math.imul(t2, 0x735a2d97);
    return ((t2 ^ (t2 >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}
/* Shuffles the four options once and keeps both language versions aligned. */
function shuffleOpts(rawEs, rawEn, rng) {
  var p = shuffle([0, 1, 2, 3], rng);
  return {
    es: p.map(function(j) { return rawEs[j]; }),
    en: p.map(function(j) { return rawEn[j]; }),
    correctIdx: p.indexOf(0)
  };
}

function nf(x) {
  var neg = x < 0, v = Math.abs(x);
  var s = (Math.round(v * 10) / 10).toString().split('.');
  s[0] = s[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return (neg ? '−' : '') + s.join('.');
}
function nfD(x, d) {
  var neg = x < 0, v = Math.abs(x);
  var s = v.toFixed(d).split('.');
  s[0] = s[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return (neg ? '−' : '') + s.join('.');
}
function money(v)  { return '$' + nf(Math.round(v)); }
function money2(v) { return '$' + nfD(v, 2); }
function dec1(x)   { return x.toFixed(1); }
function dec2(x)   { return x.toFixed(2); }
/* Rate written the way a bank quotes it: 18 and not 18.00, 1.5 and not 1.50. */
function pctS(x) {
  var v = Math.round(x * 1000000) / 10000;
  if (Math.abs(v - Math.round(v)) < 1e-9) return String(Math.round(v));
  return String(Math.round(v * 100) / 100);
}
/* Rate as an option value, always two decimals so four choices stay distinct. */
function pct2(x)   { return (x * 100).toFixed(2) + '%'; }
function intN(x)   { return nf(Math.round(x)); }

/* ── THE MODELS THIS GUIDE RUNS ON ────────────────────────────────────────
   Financial mathematics is the arithmetic of money that carries a date.
   Every routine below moves an amount along the time line, either forward
   with interest or backward with a discount, and nothing may be added to
   anything else until both amounts sit on the same date. */
function fvSimple(P, r, n)    { return P * (1 + r * n); }
function fvCompound(P, i, n)  { return P * Math.pow(1 + i, n); }
function interestEarned(P, i, n) { return fvCompound(P, i, n) - P; }
/* Periodic rate of a nominal annual quote capitalized m times a year. */
function periodRate(j, m)     { return j / m; }
/* What that quote really costs once a full year of capitalizations is done. */
function effRate(j, m)        { return Math.pow(1 + j / m, m) - 1; }
/* The limit no capitalization frequency can beat, however fine it is cut. */
function contRate(j)          { return Math.exp(j) - 1; }
/* Years a balance takes to double, which the rate alone decides. */
function doubleYears(i)       { return Math.log(2) / Math.log(1 + i); }
/* One amount promised for a future date, valued today. */
function pvSingle(F, i, n)    { return F / Math.pow(1 + i, n); }
/* A level stream of n payments, the first one a full period from today. */
function pvAnnuity(A, i, n)   { return i === 0 ? A * n : A * (1 - Math.pow(1 + i, -n)) / i; }
function pmtLoan(P, i, n)     { return i === 0 ? P / n : P * i / (1 - Math.pow(1 + i, -n)); }
/* What is still owed once k payments of the schedule have been made. */
function balanceAfter(P, i, n, k) { return pvAnnuity(pmtLoan(P, i, n), i, Math.max(0, n - k)); }
function totalInterest(P, i, n)   { return pmtLoan(P, i, n) * n - P; }

/* ════════════════════════════════════════════════════════════════════════
   OPTION BUILDERS · the key is always the first value handed in
   ════════════════════════════════════════════════════════════════════════ */
/* Four distinct numbers rendered by fmt, aligned across languages. */
function valOpts(correct, wrongs, fmt, rng) {
  var seen = {}, vals = [];
  function add(v) {
    if (typeof v !== 'number' || !isFinite(v)) return;
    var s = fmt(v);
    if (seen[s]) return;
    seen[s] = 1; vals.push(s);
  }
  add(correct);
  for (var i = 0; i < wrongs.length && vals.length < 4; i++) add(wrongs[i]);
  for (var j = 1; vals.length < 4 && j < 900; j++) {
    add(correct * (1 + j * 0.11 * (j % 2 ? 1 : -1)));
  }
  for (var k = 1; vals.length < 4 && k < 900; k++) add(correct + k * 0.41);
  return shuffleOpts(vals, vals, rng);
}

/* ════════════════════════════════════════════════════════════════════════
   CANVAS / TABS / PHOTO / HINT / RESULTS

function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#2d5a27';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e) { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e) { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(p[0], p[1]); ctx.stroke(); lx = p[0]; ly = p[1]; }
  function onUp() { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}
function switchTab(idx, panel, btn) {

/* ════════════════════════════════════════════════════════════════════════
   ANSWER HANDLER · two taps to confirm
   ════════════════════════════════════════════════════════════════════════ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = '<strong>' + (isOk ? t('fb-correct') : t('fb-wrong')) + '</strong> ' + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (!prob || prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = '<strong>' + (isOk ? t('fb-correct') : t('fb-wrong')) + '</strong> ' + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

/* ════════════════════════════════════════════════════════════════════════
   CANVAS PRIMITIVES FOR THE WIDGETS
   ════════════════════════════════════════════════════════════════════════ */
function fitCanvas(cv, h) {
  var dpr = window.devicePixelRatio || 1;
  var w = Math.max(240, cv.clientWidth || cv.parentNode.clientWidth || 300);
  cv.style.height = h + 'px';
  cv.width  = Math.round(w * dpr);
  cv.height = Math.round(h * dpr);
  var ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  return { ctx: ctx, w: w, h: h };
}
function palette() {
  return {
    green: cssv('--green'), dark: cssv('--green-dark'), tint: cssv('--green-bg'),
    gold: cssv('--gold'), bad: cssv('--bad'), border: cssv('--border'),
    text: cssv('--text'), text2: cssv('--text2'), text3: cssv('--text3')
  };
}
function kindColor(P, kind) {
  if (kind === 'gold') return P.gold;
  if (kind === 'bad')  return P.bad;
  if (kind === 'tint') return P.tint;
  if (kind === 'soft') return P.text3;
  return P.dark;
}
/* Plots any curve given as a function of time or of a rate. A balance that
   grows, a promise that shrinks as its date moves away and a loan balance
   that falls to zero are all the same picture to this routine.
     opts.marks  points worth naming, such as the year a balance doubles
     opts.band   the stretch of the horizontal axis worth highlighting
     opts.hline  a reference amount drawn as a horizontal line
     opts.asym   the limit a curve approaches without reaching
     opts.at     where the student is standing right now                     */
function drawCurveChart(g, xMin, xMax, series, opts) {
  var ctx = g.ctx, P = palette(), W = g.w, H = g.h, i;
  var padL = 56, padR = 12, padT = 18, padB = 28;
  opts = opts || {};
  var fmtY  = opts.fmtY || function(v) { return intN(v); };
  var fmtX  = opts.fmtX || function(v) { return intN(v); };
  var STEPS = 140;
  var yLo = null, yHi = null;
  function note(v) {
    if (typeof v !== 'number' || !isFinite(v)) return;
    if (yLo === null || v < yLo) yLo = v;
    if (yHi === null || v > yHi) yHi = v;
  }
  series.forEach(function(s) {
    for (i = 0; i <= STEPS; i++) note(s.f(xMin + (xMax - xMin) * i / STEPS));
  });
  note(opts.yFloor); note(opts.yCeil);
  if (opts.hline) note(opts.hline.y);
  if (opts.asym)  note(opts.asym.y);
  if (yLo === null) { yLo = 0; yHi = 1; }
  if (yHi - yLo < 1) yHi = yLo + 1;
  var pd = (yHi - yLo) * 0.10;
  yLo -= pd; yHi += pd;
  function X(v) { return padL + (v - xMin) / (xMax - xMin) * (W - padL - padR); }
  function Y(v) { return H - padB - (v - yLo) / (yHi - yLo) * (H - padT - padB); }
  function Yc(v) { return Math.max(padT - 10, Math.min(H - padB + 10, Y(v))); }

  if (opts.band && opts.band.to > opts.band.from) {
    var b1 = X(Math.max(xMin, opts.band.from)), b2 = X(Math.min(xMax, opts.band.to));
    if (b2 > b1) {
      ctx.save();
      ctx.fillStyle = P.tint;
      ctx.fillRect(b1, padT - 8, b2 - b1, H - padB - padT + 8);
      ctx.restore();
    }
  }
  ctx.strokeStyle = P.border; ctx.lineWidth = 1;
  ctx.fillStyle = P.text3; ctx.font = '9px "IBM Plex Mono", monospace';
  for (i = 0; i <= 3; i++) {
    var gv = yLo + (yHi - yLo) * i / 3;
    ctx.beginPath(); ctx.moveTo(padL, Y(gv)); ctx.lineTo(W - padR, Y(gv)); ctx.stroke();
    var gl = fmtY(gv);
    ctx.fillText(gl, Math.max(1, padL - 4 - ctx.measureText(gl).width), Y(gv) + 3);
  }
  if (yLo < 0 && yHi > 0) {
    ctx.save();
    ctx.strokeStyle = P.text3; ctx.lineWidth = 1.4; ctx.setLineDash([3, 3]);
    ctx.beginPath(); ctx.moveTo(padL, Y(0)); ctx.lineTo(W - padR, Y(0)); ctx.stroke();
    ctx.restore();
  }
  if (opts.asym) {
    ctx.save();
    ctx.strokeStyle = P.bad; ctx.lineWidth = 1.3; ctx.setLineDash([5, 4]);
    ctx.beginPath(); ctx.moveTo(padL, Y(opts.asym.y)); ctx.lineTo(W - padR, Y(opts.asym.y)); ctx.stroke();
    ctx.restore();
    if (opts.asym.label) {
      ctx.fillStyle = P.bad; ctx.font = '600 9px "IBM Plex Sans", sans-serif';
      ctx.fillText(opts.asym.label, padL + 4, Math.max(10, Y(opts.asym.y) - 4));
    }
  }
  if (opts.hline) {
    ctx.save();
    ctx.strokeStyle = P.gold; ctx.lineWidth = 1.5; ctx.setLineDash([6, 3]);
    ctx.beginPath(); ctx.moveTo(padL, Y(opts.hline.y)); ctx.lineTo(W - padR, Y(opts.hline.y)); ctx.stroke();
    ctx.restore();
    if (opts.hline.label) {
      ctx.fillStyle = P.gold; ctx.font = '600 9px "IBM Plex Sans", sans-serif';
      var hw = ctx.measureText(opts.hline.label).width;
      ctx.fillText(opts.hline.label, W - padR - hw - 2, Math.max(10, Y(opts.hline.y) - 4));
    }
  }
  series.forEach(function(s) {
    ctx.strokeStyle = kindColor(P, s.kind); ctx.lineWidth = 2.2;
    ctx.beginPath();
    var started = false;
    for (i = 0; i <= STEPS; i++) {
      var xv = xMin + (xMax - xMin) * i / STEPS;
      var yv = s.f(xv);
      if (typeof yv !== 'number' || !isFinite(yv)) { started = false; continue; }
      var px = X(xv), py = Yc(yv);
      if (!started) { ctx.moveTo(px, py); started = true; } else { ctx.lineTo(px, py); }
    }
    ctx.stroke();
  });
  (opts.marks || []).forEach(function(m) {
    if (typeof m.x !== 'number' || !isFinite(m.x) || m.x < xMin || m.x > xMax) return;
    var cx = X(m.x), cy = Yc(m.y);
    ctx.save();
    ctx.strokeStyle = kindColor(P, m.kind || 'gold'); ctx.lineWidth = 1.4; ctx.setLineDash([4, 3]);
    ctx.beginPath(); ctx.moveTo(cx, H - padB); ctx.lineTo(cx, cy); ctx.stroke();
    ctx.restore();
    ctx.fillStyle = kindColor(P, m.kind || 'gold');
    ctx.beginPath(); ctx.arc(cx, cy, 4.2, 0, Math.PI * 2); ctx.fill();
    if (m.label) {
      ctx.font = '600 10px "IBM Plex Sans", sans-serif';
      var mw = ctx.measureText(m.label).width;
      ctx.fillText(m.label, Math.min(Math.max(2, cx - mw / 2), W - mw - 2), Math.max(10, cy - 9));
    }
  });
  if (typeof opts.at === 'number' && opts.at >= xMin && opts.at <= xMax) {
    ctx.save();
    ctx.strokeStyle = P.bad; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(X(opts.at), H - padB); ctx.lineTo(X(opts.at), padT - 6); ctx.stroke();
    ctx.restore();
  }
  ctx.strokeStyle = P.border; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(padL, padT - 8); ctx.lineTo(padL, H - padB); ctx.lineTo(W - padR, H - padB); ctx.stroke();
  ctx.fillStyle = P.text3; ctx.font = '9px "IBM Plex Mono", monospace';
  [xMin, (xMin + xMax) / 2, xMax].forEach(function(v) {
    var lab = fmtX(v), lw = ctx.measureText(lab).width;
    ctx.fillText(lab, Math.min(Math.max(1, X(v) - lw / 2), W - lw - 1), H - padB + 13);
  });
  var legX = padL + 4;
  ctx.font = '600 9.5px "IBM Plex Sans", sans-serif';
  series.forEach(function(s) {
    if (!s.label) return;
    ctx.fillStyle = kindColor(P, s.kind);
    ctx.fillRect(legX, 9, 9, 3);
    ctx.fillText(s.label, legX + 12, 13);
    legX += 12 + ctx.measureText(s.label).width + 12;
  });
  if (opts.xLabel) {
    ctx.fillStyle = P.text3; ctx.font = '9px "IBM Plex Sans", sans-serif';
    var xl = opts.xLabel;
    ctx.fillText(xl, W - padR - ctx.measureText(xl).width, H - 3);
  }
}

/* ════════════════════════════════════════════════════════════════════════
   WIDGET 1 · interest left in the account against interest taken out
   ════════════════════════════════════════════════════════════════════════ */
function widgetInterestGrowth(P0, r0, y0) {
  var host = document.createElement('div');
  host.className = 'section';
  document.getElementById('lessonBody').appendChild(host);
  var state = { view: 'balance', P: P0, r: r0, y: y0, at: Math.max(1, Math.round(y0 / 2)) };
  function mount() {
    var es = LANG === 'es';
    var MODES = [
      { id: 'balance',  es: 'Saldo acumulado', en: 'Balance accumulated' },
      { id: 'interest', es: 'Intereses ganados', en: 'Interest earned' }
    ];
    var tabs = MODES.map(function(m) {
      return '<button class="mtab' + (m.id === state.view ? ' active' : '') + '" data-m="' + m.id + '">' + m[LANG] + '</button>';
    }).join('');
    host.innerHTML =
      '<div class="gcrd" data-widget="interes-simple-contra-interes-compuesto">' +
        '<div class="iw-head"><span class="iw-tag">' + (es ? 'Herramienta' : 'Tool') + '</span>' +
        '<span class="iw-title">' + (es ? 'La misma tasa, dos historias muy distintas' : 'The same rate, two very different stories') + '</span></div>' +
        '<div class="iw-sub">' + (es
          ? 'Dos empresas depositan lo mismo a la misma tasa. La primera retira los intereses cada año y los gasta; la segunda los deja adentro. Mueve el plazo y observa cómo las dos curvas se separan: al principio casi se tocan y después una de ellas se despega sin remedio. Fíjate en dos cosas antes de seguir. La distancia entre ambas no crece de forma pareja, sino cada vez más rápido, porque lo que se reinvierte también empieza a generar intereses. Y la tasa por sí sola decide en qué año se duplica el saldo, sin que importe cuánto se depositó: prueba a mover el monto y verás que ese año no se mueve.'
          : 'Two companies deposit the same amount at the same rate. The first one withdraws the interest every year and spends it; the second leaves it inside. Move the term and watch the two curves separate: at the start they almost touch and later one of them pulls away for good. Notice two things before moving on. The distance between them does not grow evenly but faster and faster, because what is reinvested starts earning interest too. And the rate alone decides the year the balance doubles, no matter how much was deposited: try moving the amount and you will see that year stay put.') + '</div>' +
        '<div class="mtabs">' + tabs + '</div>' +
        '<div class="cgrid"><div class="cg">' +
          '<label>' + (es ? 'Monto depositado hoy' : 'Amount deposited today') + ': <span class="cval" id="g1Pl"></span></label>' +
          '<input type="range" min="20000" max="400000" step="10000" id="g1P" value="' + state.P + '">' +
        '</div><div class="cg">' +
          '<label>' + (es ? 'Tasa anual' : 'Annual rate') + ': <span class="cval" id="g1rl"></span></label>' +
          '<input type="range" min="2" max="24" step="1" id="g1r" value="' + Math.round(state.r * 100) + '">' +
        '</div></div>' +
        '<div class="cgrid"><div class="cg">' +
          '<label>' + (es ? 'Plazo que muestra la gráfica' : 'Term the chart shows') + ': <span class="cval" id="g1yl"></span></label>' +
          '<input type="range" min="3" max="30" step="1" id="g1y" value="' + state.y + '">' +
        '</div><div class="cg">' +
          '<label>' + (es ? 'Año que estás inspeccionando' : 'Year you are inspecting') + ': <span class="cval" id="g1al"></span></label>' +
          '<input type="range" min="1" max="30" step="1" id="g1a" value="' + state.at + '">' +
        '</div></div>' +
        '<canvas class="iw-canvas" id="g1cv"></canvas>' +
        '<div class="dlist" id="g1steps"></div>' +
        '<div class="metrics">' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Saldo con interés compuesto' : 'Balance with compound interest') + '</div><div class="mnum cs" id="g1c"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Saldo con interés simple' : 'Balance with simple interest') + '</div><div class="mnum ps" id="g1s"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Diferencia entre los dos' : 'Difference between the two') + '</div><div class="mnum ts" id="g1d"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Intereses ganados' : 'Interest earned') + '</div><div class="mnum cs" id="g1i"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Año en que se duplica' : 'Year the balance doubles') + '</div><div class="mnum ps" id="g1x"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Cuántas veces creció el depósito' : 'Times the deposit grew') + '</div><div class="mnum ts" id="g1m"></div></div>' +
        '</div>' +
        '<div class="iw-read" id="g1read"></div>' +
      '</div>';
    host.querySelectorAll('.mtab').forEach(function(b) {
      b.addEventListener('click', function() {
        state.view = b.getAttribute('data-m');
        host.querySelectorAll('.mtab').forEach(function(x) { x.classList.remove('active'); });
        b.classList.add('active');
        update();
      });
    });
    host.querySelector('#g1P').addEventListener('input', function() { state.P = parseInt(this.value, 10); update(); });
    host.querySelector('#g1r').addEventListener('input', function() { state.r = parseInt(this.value, 10) / 100; update(); });
    host.querySelector('#g1y').addEventListener('input', function() {
      state.y = parseInt(this.value, 10);
      if (state.at > state.y) { state.at = state.y; host.querySelector('#g1a').value = state.at; }
      update();
    });
    host.querySelector('#g1a').addEventListener('input', function() {
      state.at = Math.min(parseInt(this.value, 10), state.y);
      this.value = state.at;
      update();
    });
    update();
  }
  function update() {
    var es = LANG === 'es';
    var P = state.P, r = state.r, y = state.y, at = Math.min(state.at, y);
    var comp = fvCompound(P, r, at);
    var simp = fvSimple(P, r, at);
    var dbl  = doubleYears(r);
    host.querySelector('#g1Pl').textContent = money(P);
    host.querySelector('#g1rl').textContent = pctS(r) + (es ? ' por ciento' : ' percent');
    host.querySelector('#g1yl').textContent = intN(y) + (es ? ' años' : ' years');
    host.querySelector('#g1al').textContent = intN(at) + (es ? ' años' : ' years');
    host.querySelector('#g1c').textContent  = money(comp);
    host.querySelector('#g1s').textContent  = money(simp);
    host.querySelector('#g1d').textContent  = money(comp - simp);
    host.querySelector('#g1i').textContent  = money(comp - P);
    host.querySelector('#g1x').textContent  = dec1(dbl) + (es ? ' años' : ' years');
    host.querySelector('#g1m').textContent  = dec2(comp / P) + (es ? ' veces' : ' times');
    host.querySelector('#g1steps').textContent = es
      ? 'Con interés simple el depósito gana ' + money(P * r) + ' cada año, siempre lo mismo  ·  ' +
        'con interés compuesto el saldo se multiplica cada año por uno más la tasa  ·  ' +
        'en el año ' + intN(at) + ' esa multiplicación repetida ' + intN(at) + ' veces deja ' + money(comp) + '  ·  ' +
        'la diferencia contra el interés simple es ' + money(comp - simp)
      : 'With simple interest the deposit earns ' + money(P * r) + ' every year, always the same  ·  ' +
        'with compound interest the balance is multiplied each year by one plus the rate  ·  ' +
        'by year ' + intN(at) + ' that multiplication repeated ' + intN(at) + ' times leaves ' + money(comp) + '  ·  ' +
        'the difference against simple interest is ' + money(comp - simp);
    var g = fitCanvas(host.querySelector('#g1cv'), 185);
    if (state.view === 'balance') {
      drawCurveChart(g, 0, y, [
        { f: function(x) { return fvCompound(P, r, x); }, kind: 'green', label: (es ? 'Compuesto' : 'Compound') },
        { f: function(x) { return fvSimple(P, r, x); },   kind: 'gold',  label: (es ? 'Simple' : 'Simple') }
      ], {
        at: at, fmtY: function(v) { return money(v); },
        fmtX: function(v) { return intN(v); },
        hline: { y: 2 * P, label: (es ? 'El doble' : 'Twice the deposit') },
        marks: dbl <= y ? [{ x: dbl, y: 2 * P, label: (es ? 'Se duplica' : 'It doubles'), kind: 'bad' }] : [],
        xLabel: (es ? 'años' : 'years')
      });
    } else {
      drawCurveChart(g, 0, y, [
        { f: function(x) { return fvCompound(P, r, x) - P; }, kind: 'green', label: (es ? 'Intereses compuestos' : 'Compound interest') },
        { f: function(x) { return P * r * x; },               kind: 'gold',  label: (es ? 'Intereses simples' : 'Simple interest') }
      ], {
        at: at, yFloor: 0, fmtY: function(v) { return money(v); },
        fmtX: function(v) { return intN(v); },
        xLabel: (es ? 'años' : 'years')
      });
    }
    host.querySelector('#g1read').innerHTML = es
      ? '<strong>Lectura de negocio:</strong> a ' + pctS(r) + ' por ciento anual, ' + money(P) + ' se convierten en ' + money(comp) + ' al cabo de ' + intN(at) + ' años si los intereses se quedan adentro, contra ' + money(simp) + ' si se retiran cada año. Esos ' + money(comp - simp) + ' de diferencia no salieron de ningún depósito adicional: son los intereses que a su vez ganaron intereses. ' +
        'Aquí conviene fijar tres ideas. La primera es que el interés compuesto no es una tasa distinta sino la misma tasa aplicada sobre un saldo que va cambiando. La segunda es que el año en que el saldo se duplica, ' + dec1(dbl) + ' en este caso, depende solo de la tasa y no del monto, que es la razón por la que un ahorrador pequeño y uno grande tardan exactamente lo mismo en duplicar su dinero. La tercera es que esta misma mecánica trabaja en contra cuando se debe: una deuda que no se paga crece con la curva verde, no con la dorada.'
      : '<strong>Business reading:</strong> at ' + pctS(r) + ' percent a year, ' + money(P) + ' turns into ' + money(comp) + ' after ' + intN(at) + ' years if the interest stays inside, against ' + money(simp) + ' if it is withdrawn every year. Those ' + money(comp - simp) + ' of difference came from no extra deposit at all: they are the interest that in turn earned interest. ' +
        'Three ideas are worth fixing here. The first is that compound interest is not a different rate but the same rate applied to a balance that keeps changing. The second is that the year the balance doubles, ' + dec1(dbl) + ' in this case, depends only on the rate and not on the amount, which is why a small saver and a large one take exactly the same time to double their money. The third is that this same machinery works against you when you owe: a debt left unpaid grows along the green curve, not the golden one.';
  }
  widgets.push(mount);
  mount();
}

/* ════════════════════════════════════════════════════════════════════════
   WIDGET 2 · what a quoted rate really costs once the year is over
   ════════════════════════════════════════════════════════════════════════ */

          : 'A bank advertises an annual rate and then, in small print, says how often it capitalizes it. That second figure changes the real cost and almost never makes the poster. Hold the advertised rate still and move only the frequency: you will see the true cost climb every time the bank charges more often, even though the number on the poster has not moved a single point. Watch where the curve stops as well. However tightly you squeeze the frequency, the cost hugs the red line and does not cross it: there is a ceiling no capitalization can beat, and that ceiling is what the theory calls continuous capitalization.') + '</div>' +
        '<div class="mtabs">' + tabs + '</div>' +
        '<div class="cgrid"><div class="cg">' +
          '<label>' + (es ? 'Tasa anual anunciada' : 'Advertised annual rate') + ': <span class="cval" id="f2jl"></span></label>' +

        '</div><div class="cg">' +
          '<label>' + (es ? 'Veces al año que capitaliza' : 'Times a year it capitalizes') + ': <span class="cval" id="f2ml"></span></label>' +
          '<input type="range" min="0" max="7" step="1" id="f2m" value="' + state.k + '">' +
        '</div></div>' +
        '<div class="cgrid"><div class="cg">' +
          '<label>' + (es ? 'Monto del crédito' : 'Amount of the loan') + ': <span class="cval" id="f2Pl"></span></label>' +
          '<input type="range" min="50000" max="900000" step="25000" id="f2P" value="' + state.P + '">' +
        '</div><div class="cg">' +
          '<label>' + (es ? 'Plazo en años' : 'Term in years') + ': <span class="cval" id="f2yl"></span></label>' +

          '<div class="metric"><div class="mlbl">' + (es ? 'Tasa de cada periodo' : 'Rate of each period') + '</div><div class="mnum cs" id="f2p"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Tasa efectiva anual' : 'Effective annual rate') + '</div><div class="mnum ps" id="f2e"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Puntos arriba de la anunciada' : 'Points above the advertised one') + '</div><div class="mnum ts" id="f2g"></div></div>' +

    host.querySelectorAll('.mtab').forEach(function(b) {

        'el saldo se multiplica ' + intN(m) + ' veces por uno más esa tasa a lo largo del año  ·  ' +
        'al restar el uno queda la tasa efectiva anual, que es ' + pct2(eff) + '  ·  ' +
        'la brecha contra el anuncio es de ' + dec2((eff - j) * 100) + ' puntos'
      : 'The advertised rate of ' + pctS(j) + ' percent is split over ' + intN(m) + ' periods, so each one charges ' + pct2(ip) + '  ·  ' +
        'the balance is multiplied ' + intN(m) + ' times by one plus that rate over the year  ·  ' +
        'taking the one away leaves the effective annual rate, which is ' + pct2(eff) + '  ·  ' +
        'the gap against the poster is ' + dec2((eff - j) * 100) + ' points';
    var g = fitCanvas(host.querySelector('#f2cv'), 185);
    if (state.view === 'rate') {
      drawCurveChart(g, 1, 52, [
        { f: function(x) { return effRate(j, x); }, kind: 'green', label: (es ? 'Tasa efectiva anual' : 'Effective annual rate') }
      ], {
        at: m <= 52 ? m : null,
        fmtY: function(v) { return pct2(v); }, fmtX: function(v) { return intN(v); },
        asym: { y: cont, label: (es ? 'Techo: capitalización continua' : 'Ceiling: continuous capitalization') },
        hline: { y: j, label: (es ? 'Tasa anunciada' : 'Advertised rate') },
        marks: [{ x: m <= 52 ? m : 52, y: eff, label: pct2(eff), kind: 'gold' }],
        xLabel: (es ? 'capitalizaciones al año' : 'capitalizations a year')
      });
    } else {
      drawCurveChart(g, 0, y, [
        { f: function(x) { return P * Math.pow(1 + ip, m * x); }, kind: 'green', label: (es ? 'Con esta frecuencia' : 'At this frequency') },
        { f: function(x) { return P * Math.pow(1 + j, x); },      kind: 'gold',  label: (es ? 'Capitalizando una vez al año' : 'Capitalizing once a year') }
      ], {

        marks: [{ x: y, y: bal, label: money(bal), kind: 'bad' }],
        xLabel: (es ? 'años' : 'years')
      });

      ? '<strong>Lectura de negocio:</strong> el anuncio dice ' + pctS(j) + ' por ciento, pero al capitalizar ' + NAMES[m][LANG] + ' el costo verdadero del año es ' + pct2(eff) + ', o sea ' + dec2((eff - j) * 100) + ' puntos más de lo anunciado. Sobre ' + money(P) + ' a ' + intN(y) + ' años, eso son ' + money(bal - bal1) + ' de más que si el banco capitalizara una sola vez al año. ' +
        'La regla práctica que hay que llevarse cabe en una línea: dos tasas solo se pueden comparar cuando están referidas al mismo periodo. La tasa anunciada, que se llama nominal, es apenas una etiqueta que hay que traducir antes de usarla; la efectiva anual es la que sirve para decidir. Y nota el detalle del techo: pasar de una capitalización mensual a una semanal casi no mueve la cifra, mientras que pasar de anual a mensual sí la mueve, porque la ganancia de capitalizar más seguido se agota rápido contra el límite de ' + pct2(cont) + '.'
      : '<strong>Business reading:</strong> the poster says ' + pctS(j) + ' percent, but capitalizing ' + NAMES[m][LANG] + ' the true cost of the year is ' + pct2(eff) + ', that is ' + dec2((eff - j) * 100) + ' points above what was advertised. On ' + money(P) + ' over ' + intN(y) + ' years, that comes to ' + money(bal - bal1) + ' more than if the bank capitalized once a year. ' +
        'The practical rule worth taking away fits in one line: two rates can only be compared when they refer to the same period. The advertised rate, called nominal, is barely a label that has to be translated before it is used; the effective annual rate is the one that settles a decision. And notice the detail of the ceiling: moving from monthly to weekly capitalization barely shifts the figure, while moving from annual to monthly clearly does, because the gain from capitalizing more often runs out quickly against the limit of ' + pct2(cont) + '.';
  }
  widgets.push(mount);
  mount();
}

/* ════════════════════════════════════════════════════════════════════════
   WIDGET 3 · what a promise for a future date is worth today
   ════════════════════════════════════════════════════════════════════════ */
function widgetPresentValue(F0, r0, n0) {
  var host = document.createElement('div');
  host.className = 'section';
  document.getElementById('lessonBody').appendChild(host);
  var state = { F: F0, r: r0, n: n0, alt: Math.round((r0 + 0.06) * 100) / 100 };
  function mount() {

        '<div class="iw-sub">' + (es
          ? 'Un cliente promete pagar una cantidad fija en el futuro. La cantidad no cambia; lo que cambia es qué tan lejos está la fecha. Mueve el plazo y observa cómo la curva se desploma al principio y luego se aplana: el primer año de espera cuesta mucho más que el décimo. Después mueve la tasa de descuento, que es el rendimiento al que la empresa podría poner ese dinero si lo tuviera hoy, y verás que la misma promesa vale distinto para dos empresas distintas. Esa es la parte que más cuesta aceptar y la más importante: el valor presente no es una propiedad del cheque, es una comparación contra lo que quien lo recibe puede hacer con su dinero.'
          : 'A customer promises to pay a fixed amount in the future. The amount does not change; what changes is how far away the date is. Move the term and watch the curve drop steeply at first and then flatten: the first year of waiting costs far more than the tenth. Then move the discount rate, which is the return the company could earn on that money if it had it today, and you will see the same promise be worth different amounts to two different companies. That is the part hardest to accept and the most important: present value is not a property of the cheque, it is a comparison against what the one receiving it can do with money.') + '</div>' +
        '<div class="cgrid"><div class="cg">' +
          '<label>' + (es ? 'Cantidad prometida' : 'Amount promised') + ': <span class="cval" id="v3Fl"></span></label>' +

        '</div></div>' +
        '<div class="cgrid"><div class="cg">' +
          '<label>' + (es ? 'Tasa de descuento de tu empresa' : 'Discount rate of your company') + ': <span class="cval" id="v3rl"></span></label>' +
          '<input type="range" min="2" max="30" step="1" id="v3r" value="' + Math.round(state.r * 100) + '">' +

        '<div class="dlist" id="v3steps"></div>' +
        '<div class="metrics">' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Valor hoy de la promesa' : 'Value of the promise today') + '</div><div class="mnum cs" id="v3pv"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Lo que cuesta esperar' : 'What the waiting costs') + '</div><div class="mnum ps" id="v3gap"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Porcentaje del monto prometido' : 'Share of the amount promised') + '</div><div class="mnum ts" id="v3sh"></div></div>' +

    host.querySelector('#v3pv2').textContent  = money(pv2);
    host.querySelector('#v3dif').textContent  = money(Math.abs(pv - pv2));
    host.querySelector('#v3half').textContent = dec1(half) + (es ? ' años' : ' years');
    host.querySelector('#v3steps').textContent = es
      ? 'Traer un monto del futuro al presente es deshacer lo que el interés le haría  ·  ' +
        'en lugar de multiplicar por uno más la tasa ' + intN(n) + ' veces, se divide por eso mismo ' + intN(n) + ' veces  ·  ' +
        'con una tasa de ' + pctS(r) + ' por ciento, ' + money(F) + ' dentro de ' + intN(n) + ' años valen ' + money(pv) + ' hoy  ·  ' +
        'la espera cuesta ' + money(F - pv)
      : 'Bringing an amount from the future to today is undoing what interest would do to it  ·  ' +
        'instead of multiplying by one plus the rate ' + intN(n) + ' times, you divide by that same thing ' + intN(n) + ' times  ·  ' +
        'at a rate of ' + pctS(r) + ' percent, ' + money(F) + ' due in ' + intN(n) + ' years is worth ' + money(pv) + ' today  ·  ' +
        'the waiting costs ' + money(F - pv);
    var g = fitCanvas(host.querySelector('#v3cv'), 185);
    drawCurveChart(g, 0, 15, [
      { f: function(x) { return pvSingle(F, r, x); },   kind: 'green', label: (es ? 'A tu tasa' : 'At your rate') },
      { f: function(x) { return pvSingle(F, alt, x); }, kind: 'gold',  label: (es ? 'A la tasa de la otra empresa' : 'At the other company rate') }
    ], {
      at: n, fmtY: function(v) { return money(v); }, fmtX: function(v) { return intN(v); },
      hline: { y: F / 2, label: (es ? 'La mitad' : 'Half') },
      marks: [{ x: n, y: pv, label: money(pv), kind: 'bad' }],
      xLabel: (es ? 'años de espera' : 'years of waiting')
    });
    host.querySelector('#v3read').innerHTML = es
      ? '<strong>Lectura de negocio:</strong> ' + money(F) + ' cobrados dentro de ' + intN(n) + ' años valen hoy ' + money(pv) + ' para una empresa que descuenta al ' + pctS(r) + ' por ciento, es decir el ' + dec1(pv / F * 100) + ' por ciento de la cifra prometida. La espera cuesta ' + money(F - pv) + '. Para la otra empresa, que descuenta al ' + pctS(alt) + ' por ciento, la misma promesa vale ' + money(pv2) + ', una diferencia de ' + money(Math.abs(pv - pv2)) + ' sobre exactamente el mismo papel. ' +
        'De aquí salen dos usos inmediatos. El primero es negociar: si un cliente ofrece pagar después, la pregunta correcta no es cuánto ofrece sino cuánto vale hoy lo que ofrece, y con eso se puede calcular el descuento por pago anticipado que conviene otorgar. El segundo es una advertencia contra un error muy común en reportes: sumar un monto de hoy con uno de dentro de ' + intN(n) + ' años sin descontar el segundo. Son unidades distintas, tanto como sumar pesos con dólares.'
      : '<strong>Business reading:</strong> ' + money(F) + ' collected in ' + intN(n) + ' years is worth ' + money(pv) + ' today to a company discounting at ' + pctS(r) + ' percent, that is ' + dec1(pv / F * 100) + ' percent of the promised figure. The waiting costs ' + money(F - pv) + '. To the other company, discounting at ' + pctS(alt) + ' percent, the same promise is worth ' + money(pv2) + ', a difference of ' + money(Math.abs(pv - pv2)) + ' on exactly the same piece of paper. ' +
        'Two immediate uses come out of this. The first is negotiating: if a customer offers to pay later, the right question is not how much is offered but what the offer is worth today, and from there you can work out the early payment discount worth granting. The second is a warning against a very common error in reports: adding an amount from today to one due in ' + intN(n) + ' years without discounting the second. They are different units, as much as adding pesos to dollars.';
  }
  widgets.push(mount);
  mount();
}

/* ════════════════════════════════════════════════════════════════════════
   WIDGET 4 · where each peso of a loan payment actually goes

function widgetAmortization(P0, j0, n0) {
  var host = document.createElement('div');
  host.className = 'section';
  document.getElementById('lessonBody').appendChild(host);
  var state = { view: 'split', P: P0, j: j0, n: n0, k: Math.max(1, Math.round(n0 / 4)) };
  function mount() {
    var es = LANG === 'es';
    var MODES = [
      { id: 'split',   es: 'Interés y capital de cada pago', en: 'Interest and principal in each payment' },
      { id: 'balance', es: 'Saldo que falta por pagar', en: 'Balance still owed' }
    ];
    var tabs = MODES.map(function(m) {
      return '<button class="mtab' + (m.id === state.view ? ' active' : '') + '" data-m="' + m.id + '">' + m[LANG] + '</button>';
    }).join('');
    host.innerHTML =
      '<div class="gcrd" data-widget="amortizacion-de-un-credito">' +
        '<div class="iw-head"><span class="iw-tag">' + (es ? 'Herramienta' : 'Tool') + '</span>' +
        '<span class="iw-title">' + (es ? 'La mensualidad es una, pero por dentro cambia todos los meses' : 'The payment is one figure, but inside it changes every month') + '</span></div>' +
        '<div class="iw-sub">' + (es
          ? 'Un crédito con mensualidad fija esconde un reparto que se mueve. Cada pago cubre primero el interés que corrió sobre el saldo del mes y solo lo que sobra baja la deuda. Como el saldo va bajando, el interés de cada mes es menor y la parte que abona a capital crece, despacio al principio y muy rápido al final. Mueve el número de pago y sigue las dos curvas: se cruzan en algún punto del plazo. Mueve después el plazo dejando todo lo demás quieto y observa la trampa comercial más cara del crédito al consumo: la mensualidad baja, cosa que se ve, y el interés total sube, cosa que no se ve.'
          : 'A loan with a fixed payment hides a split that keeps moving. Every payment first covers the interest that ran on the balance for the month, and only what is left over brings the debt down. Since the balance keeps falling, the interest of each month is smaller and the part paying off principal grows, slowly at first and very fast at the end. Move the payment number and follow the two curves: they cross somewhere in the term. Then move the term leaving everything else still and watch the most expensive commercial trap in consumer credit: the payment falls, which is visible, and the total interest rises, which is not.') + '</div>' +
        '<div class="mtabs">' + tabs + '</div>' +
        '<div class="cgrid"><div class="cg">' +
          '<label>' + (es ? 'Monto del crédito' : 'Amount of the loan') + ': <span class="cval" id="a4Pl"></span></label>' +
          '<input type="range" min="50000" max="900000" step="25000" id="a4P" value="' + state.P + '">' +
        '</div><div class="cg">' +
          '<label>' + (es ? 'Tasa anual capitalizable cada mes' : 'Annual rate capitalized every month') + ': <span class="cval" id="a4jl"></span></label>' +
          '<input type="range" min="6" max="48" step="1" id="a4j" value="' + Math.round(state.j * 100) + '">' +
        '</div></div>' +
        '<div class="cgrid"><div class="cg">' +
          '<label>' + (es ? 'Plazo en meses' : 'Term in months') + ': <span class="cval" id="a4nl"></span></label>' +
          '<input type="range" min="6" max="72" step="6" id="a4n" value="' + state.n + '">' +
        '</div><div class="cg">' +
          '<label>' + (es ? 'Pago que estás inspeccionando' : 'Payment you are inspecting') + ': <span class="cval" id="a4kl"></span></label>' +
          '<input type="range" min="1" max="72" step="1" id="a4k" value="' + state.k + '">' +
        '</div></div>' +
        '<canvas class="iw-canvas" id="a4cv"></canvas>' +
        '<div class="dlist" id="a4steps"></div>' +
        '<div class="metrics">' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Mensualidad' : 'Monthly payment') + '</div><div class="mnum cs" id="a4pmt"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Interés de ese pago' : 'Interest in that payment') + '</div><div class="mnum ps" id="a4int"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Capital de ese pago' : 'Principal in that payment') + '</div><div class="mnum ts" id="a4cap"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Saldo después de ese pago' : 'Balance after that payment') + '</div><div class="mnum ts" id="a4bal"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Total pagado en el plazo' : 'Total paid over the term') + '</div><div class="mnum cs" id="a4tot"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Intereses totales' : 'Total interest') + '</div><div class="mnum ps" id="a4ti"></div></div>' +
        '</div>' +
        '<div class="iw-read" id="a4read"></div>' +
      '</div>';
    host.querySelectorAll('.mtab').forEach(function(b) {
      b.addEventListener('click', function() {
        state.view = b.getAttribute('data-m');
        host.querySelectorAll('.mtab').forEach(function(x) { x.classList.remove('active'); });
        b.classList.add('active');
        update();
      });
    });
    host.querySelector('#a4P').addEventListener('input', function() { state.P = parseInt(this.value, 10); update(); });
    host.querySelector('#a4j').addEventListener('input', function() { state.j = parseInt(this.value, 10) / 100; update(); });
    host.querySelector('#a4n').addEventListener('input', function() {
      state.n = parseInt(this.value, 10);
      if (state.k > state.n) { state.k = state.n; host.querySelector('#a4k').value = state.k; }
      update();
    });
    host.querySelector('#a4k').addEventListener('input', function() {
      state.k = Math.min(parseInt(this.value, 10), state.n);
      this.value = state.k;
      update();
    });
    update();
  }
  function update() {
    var es = LANG === 'es';
    var P = state.P, j = state.j, n = state.n, k = Math.min(state.k, n);
    var i    = periodRate(j, 12);
    var pmt  = pmtLoan(P, i, n);
    var before = pvAnnuity(pmt, i, n - k + 1);
    var intK = before * i;
    var capK = pmt - intK;
    var bal  = pvAnnuity(pmt, i, n - k);
    var tot  = pmt * n;
    host.querySelector('#a4Pl').textContent = money(P);
    host.querySelector('#a4jl').textContent = pctS(j) + (es ? ' por ciento' : ' percent');
    host.querySelector('#a4nl').textContent = intN(n) + (es ? ' meses' : ' months');
    host.querySelector('#a4kl').textContent = intN(k) + (es ? ' de ' : ' of ') + intN(n);
    host.querySelector('#a4pmt').textContent = money2(pmt);
    host.querySelector('#a4int').textContent = money2(intK);
    host.querySelector('#a4cap').textContent = money2(capK);
    host.querySelector('#a4bal').textContent = money(bal);
    host.querySelector('#a4tot').textContent = money(tot);
    host.querySelector('#a4ti').textContent  = money(tot - P);
    host.querySelector('#a4steps').textContent = es
      ? 'La tasa mensual es la anual repartida entre doce, o sea ' + pct2(i) + '  ·  ' +
        'la mensualidad que liquida ' + money(P) + ' en ' + intN(n) + ' pagos es ' + money2(pmt) + '  ·  ' +
        'en el pago ' + intN(k) + ' el saldo previo es ' + money(before) + ', así que el interés del mes es ' + money2(intK) + '  ·  ' +
        'lo que sobra de la mensualidad, ' + money2(capK) + ', es lo único que baja la deuda'
      : 'The monthly rate is the annual one split over twelve, that is ' + pct2(i) + '  ·  ' +
        'the payment that clears ' + money(P) + ' in ' + intN(n) + ' instalments is ' + money2(pmt) + '  ·  ' +
        'at payment ' + intN(k) + ' the previous balance is ' + money(before) + ', so the interest of the month is ' + money2(intK) + '  ·  ' +
        'what is left of the payment, ' + money2(capK) + ', is the only part that brings the debt down';
    var g = fitCanvas(host.querySelector('#a4cv'), 185);
    if (state.view === 'split') {
      drawCurveChart(g, 1, n, [
        { f: function(x) { return pvAnnuity(pmt, i, n - x + 1) * i; },       kind: 'gold',  label: (es ? 'Interés' : 'Interest') },
        { f: function(x) { return pmt - pvAnnuity(pmt, i, n - x + 1) * i; }, kind: 'green', label: (es ? 'Capital' : 'Principal') }
      ], {
        at: k, yFloor: 0, yCeil: pmt,
        fmtY: function(v) { return money(v); }, fmtX: function(v) { return intN(v); },
        hline: { y: pmt, label: (es ? 'Mensualidad' : 'Payment') },
        xLabel: (es ? 'número de pago' : 'payment number')
      });
    } else {
      drawCurveChart(g, 0, n, [
        { f: function(x) { return pvAnnuity(pmt, i, n - x); }, kind: 'green', label: (es ? 'Saldo' : 'Balance') },
        { f: function(x) { return P * (1 - x / n); },          kind: 'gold',  label: (es ? 'Reparto en partes iguales' : 'Split in equal parts') }
      ], {
        at: k, yFloor: 0,
        fmtY: function(v) { return money(v); }, fmtX: function(v) { return intN(v); },
        marks: [{ x: k, y: bal, label: money(bal), kind: 'bad' }],
        xLabel: (es ? 'pagos hechos' : 'payments made')
      });
    }
    host.querySelector('#a4read').innerHTML = es
      ? '<strong>Lectura de negocio:</strong> con ' + money(P) + ' a ' + intN(n) + ' meses y una tasa anual de ' + pctS(j) + ' por ciento capitalizable cada mes, la mensualidad es ' + money2(pmt) + '. Dentro del pago número ' + intN(k) + ', ' + money2(intK) + ' se van en intereses y solo ' + money2(capK) + ' bajan la deuda, que queda en ' + money(bal) + '. Al final del plazo se habrán entregado ' + money(tot) + ', de los cuales ' + money(tot - P) + ' son intereses. ' +
        'Dos consecuencias prácticas. La primera es que el saldo de un crédito no baja en línea recta, así que descontar de la deuda los pagos ya hechos siempre da una cifra menor a la que el banco pedirá para liquidar: hay que valuar los pagos que faltan. La segunda es cómo se compara una oferta de crédito. Una mensualidad más chica casi nunca significa un crédito más barato; suele significar un plazo más largo, y el plazo es justamente lo que multiplica los intereses.'
      : '<strong>Business reading:</strong> with ' + money(P) + ' over ' + intN(n) + ' months at an annual rate of ' + pctS(j) + ' percent capitalized every month, the payment is ' + money2(pmt) + '. Inside payment number ' + intN(k) + ', ' + money2(intK) + ' goes to interest and only ' + money2(capK) + ' brings the debt down, which lands at ' + money(bal) + '. By the end of the term ' + money(tot) + ' will have been handed over, of which ' + money(tot - P) + ' is interest. ' +
        'Two practical consequences. The first is that the balance of a loan does not fall in a straight line, so subtracting the payments already made from the debt always gives a figure below what the bank will ask to settle: the remaining payments have to be valued. The second is how a credit offer should be compared. A smaller payment almost never means a cheaper loan; it usually means a longer term, and the term is precisely what multiplies the interest.';
  }
  widgets.push(mount);
  mount();
}

  /* Final assessment */
  var p7A = pick([12000, 15000, 20000], rng);         // item 7
  var p7j = pick([0.18, 0.24], rng);
  var p7n = pick([18, 24, 30], rng);
