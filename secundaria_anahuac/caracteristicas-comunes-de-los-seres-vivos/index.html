/* ══════════════════════════════════════════════════════════════════════════
   buildLesson :: concepto -> manipulativo -> problema, alternados (Rule 1)
   ══════════════════════════════════════════════════════════════════════════ */
function buildLesson(rng){
  injectGuideCSS();

  /* ── Apertura ── */
  sec(
    L({ es:'Punto de partida', en:'Starting point' }),
    L({ es:'Un pino, una lombriz y tú', en:'A pine tree, an earthworm and you' }),
    '<p>' + L({
      es:'Un pino de veinte metros, una lombriz que cabe en tu mano y un moho verde en una tortilla olvidada parecen no tener nada que ver entre sí. Y sin embargo, los tres hacen exactamente lo mismo tres veces al día, todos los días de su vida: consiguen materia y energía, se enteran de lo que pasa a su alrededor y responden, y dejan descendencia. Eso es lo que los mete a los tres en la misma lista y deja fuera a una piedra, a un río y a un teléfono.',
      en:'A twenty metre pine, an earthworm that fits in your hand and a green mould on a forgotten tortilla seem to have nothing to do with one another. And yet all three do exactly the same three things every day of their lives: they get matter and energy, they find out what is happening around them and respond, and they leave descendants. That is what puts all three on the same list and leaves out a stone, a river and a phone.'
    }) + '</p>' +
    '<div class="callout"><p><strong>' + L({ es:'Lo que vas a hacer: ', en:'What you are going to do: ' }) + '</strong>' + L({
      es:'vas a repartir estructuras en la función que les toca, a separar quién fabrica su alimento y quién lo toma hecho, a mover una lámpara para ver cómo responde un tallo, a sembrar una parcela antes de que llegue una plaga, a armar tus propios grupos con un criterio y a leer una tabla de rasgos para proponer quién es pariente de quién.',
      en:'You are going to sort structures into the function each one serves, separate who makes their own food from who takes it ready made, move a lamp to see how a stem responds, sow a plot before a pest arrives, build your own groups with a criterion and read a trait table to propose who is related to whom.'
    }) + '</p></div>'
  );

  /* ══ CONCEPTO 1 :: las tres funciones vitales ══ */
  var s1 = sec(
    L({ es:'Concepto 1', en:'Concept 1' }),
    L({ es:'Tres funciones que ningún ser vivo se salta', en:'Three functions no living thing skips' }),
    '<p>' + L({
      es:'Los seres vivos son distintos por fuera y muy parecidos por dentro en lo que necesitan resolver. Todos, sin excepción, cumplen tres funciones. La nutrición es conseguir materia y energía para construir el cuerpo y mantenerlo funcionando. La relación es detectar lo que ocurre alrededor, dentro y fuera del cuerpo, y responder a ello. La reproducción es originar nuevos individuos parecidos, de modo que la especie continúe cuando los individuos actuales ya no estén.',
      en:'Living things are different on the outside and very alike on the inside in terms of what they have to solve. All of them, with no exception, carry out three functions. Nutrition is getting matter and energy to build the body and keep it running. Relation is detecting what is happening around and inside the body, and responding to it. Reproduction is giving rise to new similar individuals, so the species continues when the current individuals are gone.'
    }) + '</p>' +
    '<p>' + L({
      es:'Cada función se sostiene en estructuras especializadas, y ahí es donde los seres vivos se ven distintos. Para nutrirse, una planta tiene raíces y hojas y un lobo tiene dientes e intestino. Para relacionarse, un caracol tiene tentáculos con receptores y un girasol tiene células del tallo que crecen desigual. Para reproducirse, un helecho forma esporas y un pez pone huevos. Estructuras diferentes, misma función. Y esas estructuras no están ahí por casualidad: son rasgos adaptativos, formas que resultaron útiles en el ambiente donde vive cada especie y que favorecen que esa especie sobreviva.',
      en:'Each function rests on specialised structures, and that is where living things look different. To feed itself, a plant has roots and leaves and a wolf has teeth and an intestine. To relate, a snail has tentacles with receptors and a sunflower has stem cells that grow unevenly. To reproduce, a fern forms spores and a fish lays eggs. Different structures, same function. And those structures are not there by chance: they are adaptive traits, forms that turned out useful in the environment where each species lives and that favour the survival of that species.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Nutrición', en:'Nutrition' }), L({ es:'materia y energía', en:'matter and energy' }), L({ es:'raíz, hoja, boca, branquia, intestino', en:'root, leaf, mouth, gill, intestine' })) +
      rcard(L({ es:'Relación', en:'Relation' }), L({ es:'detectar y responder', en:'detect and respond' }), L({ es:'antena, ojo, tentáculo, estoma, nervio', en:'antenna, eye, tentacle, stoma, nerve' })) +
      rcard(L({ es:'Reproducción', en:'Reproduction' }), L({ es:'dejar descendencia', en:'leaving descendants' }), L({ es:'flor, espora, huevo, semilla, yema', en:'flower, spore, egg, seed, bud' })) +
      rcard(L({ es:'Rasgo adaptativo', en:'Adaptive trait' }), L({ es:'forma que sirve donde se vive', en:'a form that works where you live' }), L({ es:'por eso favorece la sobrevivencia', en:'that is why it favours survival' })) +
    '</div>'
  );
  w1(rng, widgetHost(s1, 'w_funciones'));
  addProblem(rng, mkP1(rng));
  addProblem(rng, mkP2(rng));

  /* ══ CONCEPTO 2 :: nutrición ══ */
  var s2 = sec(
    L({ es:'Concepto 2', en:'Concept 2' }),
    L({ es:'Nutrición: fabricar el alimento o tomarlo ya hecho', en:'Nutrition: making food or taking it ready made' }),
    '<p>' + L({
      es:'Todos los seres vivos se nutren, pero no todos consiguen su alimento de la misma manera, y esa diferencia parte el mundo vivo en dos grandes formas de vivir. Unos organismos fabrican su propio alimento a partir de materia sencilla del ambiente: las plantas, las algas y algunas bacterias usan la luz, el agua y el dióxido de carbono del aire para formar sustancias que les sirven de alimento. Se les llama autótrofos, y sus estructuras lo delatan: hojas anchas para recibir luz, raíces que absorben agua y sales del suelo, tallos que sostienen todo eso hacia arriba.',
      en:'Every living thing feeds itself, but not all of them get their food the same way, and that difference splits the living world into two great ways of living. Some organisms make their own food out of simple matter from the environment: plants, algae and some bacteria use light, water and carbon dioxide from the air to form substances that serve them as food. They are called autotrophs, and their structures give them away: broad leaves to receive light, roots that take up water and salts from the soil, stems that hold all that upwards.'
    }) + '</p>' +
    '<p>' + L({
      es:'Los demás no pueden fabricarlo: toman materia que otro ser vivo ya elaboró. Son los heterótrofos, y también se les nota en la estructura. Un gato tiene dientes que cortan y un tubo digestivo que deshace la carne. Una lombriz traga tierra con restos de hojas. Un hongo no traga nada: extiende hilos delgados dentro de la madera muerta y absorbe la materia ya deshecha. Un mosquito tiene un aparato bucal que perfora. Ninguna de esas estructuras aparece en una planta, porque una planta no necesita buscar ni deshacer alimento.',
      en:'The rest cannot make it: they take matter that another living thing already built. They are the heterotrophs, and their structures show it too. A cat has teeth that cut and a digestive tube that breaks down meat. An earthworm swallows soil with leaf remains in it. A fungus swallows nothing: it spreads thin threads inside dead wood and absorbs the already broken down matter. A mosquito has a piercing mouthpart. None of those structures appears in a plant, because a plant does not need to search for food or break it down.'
    }) + '</p>' +
    '<div class="callout"><p>' + L({
      es:'Ojo con una trampa: el color verde suele acompañar a quien fabrica su alimento, pero lo que decide no es el color sino de dónde sale la materia. Un hongo puede parecer una planta pequeña y no lo es, porque vive de materia que otro ser vivo ya formó.',
      en:'Watch out for one trap: green colour usually goes with those that make their own food, but what decides is not the colour, it is where the matter comes from. A fungus can look like a small plant and is not one, because it lives on matter another living thing already formed.'
    }) + '</p></div>'
  );
  w2(rng, widgetHost(s2, 'w_nutricion'));
  addProblem(rng, mkP3(rng));

  /* ══ CONCEPTO 3 :: relación ══ */
  var s3 = sec(
    L({ es:'Concepto 3', en:'Concept 3' }),
    L({ es:'Relación: enterarse de lo que pasa y hacer algo al respecto', en:'Relation: noticing what happens and doing something about it' }),
    '<p>' + L({
      es:'Un ser vivo que no se entera de lo que ocurre a su alrededor dura poco. Por eso todos tienen alguna manera de detectar cambios, que llamamos estímulos, y alguna manera de responder. En los animales esa tarea suele recaer en receptores y en un sistema nervioso: ojos que captan luz, antenas que captan olor, la línea lateral de un pez que capta el movimiento del agua. La respuesta suele verse rápido, porque casi siempre implica moverse.',
      en:'A living thing that does not notice what is going on around it does not last long. That is why they all have some way of detecting changes, which we call stimuli, and some way of responding. In animals that job usually falls to receptors and a nervous system: eyes that catch light, antennae that catch smell, the lateral line of a fish that catches movement in the water. The response is usually quick to see, because it almost always involves moving.'
    }) + '</p>' +
    '<p>' + L({
      es:'Las plantas también se relacionan, aunque no se desplacen. Sus respuestas se ven como cambios de crecimiento o de apertura, y son más lentas: el tallo crece inclinándose hacia donde llega la luz, la raíz crece hacia abajo y hacia donde hay humedad, los estomas de la hoja se cierran cuando hay demasiado calor para no perder agua, y hay flores que se abren de día y se cierran de noche. Que la respuesta sea lenta no la hace menos respuesta: la planta detectó un estímulo y su cuerpo cambió a causa de él.',
      en:'Plants relate too, even though they do not travel. Their responses show up as changes in growth or in opening, and they are slower: the stem grows leaning towards where the light comes from, the root grows downwards and towards moisture, the stomata of the leaf close when it is too hot so as not to lose water, and there are flowers that open by day and close at night. A slow response is still a response: the plant detected a stimulus and its body changed because of it.'
    }) + '</p>'
  );
  w3(rng, widgetHost(s3, 'w_luz'));
  addProblem(rng, mkP4(rng));

  /* ══ CONCEPTO 4 :: reproducción ══ */
  var s4 = sec(
    L({ es:'Concepto 4', en:'Concept 4' }),
    L({ es:'Reproducción: dos caminos y descendientes distintos', en:'Reproduction: two paths and different descendants' }),
    '<p>' + L({
      es:'Ningún individuo dura para siempre, así que una especie solo continúa si sus individuos dejan otros nuevos. Hay dos caminos para lograrlo. En la reproducción asexual participa un solo organismo y los descendientes salen prácticamente idénticos a él: una levadura forma una yema que se desprende, una fresa echa un tallo rastrero que enraíza y forma otra planta, un pedazo de rama de higuera clavado en tierra húmeda se vuelve un árbol completo.',
      en:'No individual lasts forever, so a species only continues if its individuals leave new ones. There are two paths to achieve that. In asexual reproduction a single organism takes part and the descendants come out practically identical to it: a yeast forms a bud that breaks off, a strawberry sends out a creeping stem that roots and forms another plant, a piece of fig branch stuck into damp soil becomes a whole tree.'
    }) + '</p>' +
    '<p>' + L({
      es:'En la reproducción sexual se juntan células de dos progenitores y el descendiente lleva una mezcla nueva: se parece a los dos y no es igual a ninguno. Por eso los hermanos de una camada no son idénticos entre sí. Las estructuras que sostienen este camino son la flor con sus estambres y pistilos en las plantas con flor, y los órganos que producen las células reproductoras en los animales. La diferencia importa: una población de descendientes idénticos responde igual ante cualquier problema nuevo, mientras que una población variada casi siempre tiene individuos que responden mejor y que dejan la siguiente generación.',
      en:'In sexual reproduction cells from two parents come together and the descendant carries a new mixture: it resembles both and is identical to neither. That is why the siblings of a litter are not identical to each other. The structures behind this path are the flower with its stamens and pistils in flowering plants, and the organs that produce reproductive cells in animals. The difference matters: a population of identical descendants responds the same way to any new problem, while a varied population almost always has individuals that respond better and that leave the next generation.'
    }) + '</p>'
  );
  w4(rng, widgetHost(s4, 'w_parcela'));
  addProblem(rng, mkP5(rng));

  /* ══ CONCEPTO 5 :: clasificar por características comunes ══ */
  var s5 = sec(
    L({ es:'Concepto 5', en:'Concept 5' }),
    L({ es:'Clasificar: el criterio decide los grupos', en:'Classifying: the criterion decides the groups' }),
    '<p>' + L({
      es:'Clasificar es agrupar organismos que comparten alguna característica, y sirve para ordenar una diversidad que de otro modo sería inmanejable. Lo primero es elegir el criterio: la manera de nutrirse, la forma de reproducirse, si se desplaza o vive fijo, si tiene semillas o esporas. Elegido el criterio, los grupos salen solos. Y aquí está lo que suele sorprender: los mismos organismos, con criterios distintos, quedan en grupos distintos, y ninguno de los dos repartos está mal.',
      en:'Classifying means grouping organisms that share some characteristic, and it serves to order a diversity that would otherwise be unmanageable. The first step is choosing the criterion: the way of feeding, the way of reproducing, whether it moves or stays fixed, whether it has seeds or spores. Once the criterion is chosen, the groups come out on their own. And here is what usually surprises: the same organisms, with different criteria, end up in different groups, and neither of the two arrangements is wrong.'
    }) + '</p>' +
    '<p>' + L({
      es:'Por eso toda clasificación tiene alcances y limitaciones. Un criterio útil para una pregunta puede ser inútil para otra. Agrupar por ambiente, por ejemplo, deja juntos al tiburón, al delfín y al pulpo porque los tres viven en el mar, y eso sirve para hablar de vida marina, pero no dice nada de cómo se nutren ni de cómo se reproducen, que en esos tres es muy distinto. Un buen trabajo de clasificación dice siempre con qué criterio se armaron los grupos y para qué sirve ese reparto.',
      en:'That is why every classification has a reach and limitations. A criterion that is useful for one question can be useless for another. Grouping by environment, for instance, leaves the shark, the dolphin and the octopus together because all three live in the sea, and that is useful for talking about marine life, but it says nothing about how they feed or how they reproduce, which in those three is very different. Good classification work always says which criterion the groups were built with and what that arrangement is good for.'
    }) + '</p>'
  );
  w5(rng, widgetHost(s5, 'w_criterio'));
  addProblem(rng, mkP6(rng));
  addProblem(rng, mkP7(rng));

  /* ══ CONCEPTO 6 :: hipótesis de parentesco ══ */
  var s6 = sec(
    L({ es:'Concepto 6', en:'Concept 6' }),
    L({ es:'Parentesco: una hipótesis que se pone a prueba', en:'Kinship: a hypothesis that gets tested' }),
    '<p>' + L({
      es:'Cuando dos organismos comparten muchas características, cabe una idea razonable: quizá descienden de un antepasado común, es decir, quizá están emparentados. Eso es una hipótesis, no una conclusión: es una explicación provisional que hay que poner a prueba comparando más características y consultando fuentes confiables, como libros de biología, colecciones de museo o registros de personas que estudian esos grupos.',
      en:'When two organisms share many characteristics, a reasonable idea arises: perhaps they descend from a common ancestor, that is, perhaps they are related. That is a hypothesis, not a conclusion: it is a provisional explanation that has to be tested by comparing more characteristics and consulting reliable sources, such as biology books, museum collections or the records of people who study those groups.'
    }) + '</p>' +
    '<p>' + L({
      es:'Hay una trampa que aparece siempre. Vivir en el mismo ambiente empuja a especies muy lejanas a parecerse por fuera: el tiburón y el delfín tienen cuerpo alargado y aletas porque los dos nadan rápido, no porque sean parientes cercanos. Si en vez del contorno miras las características más profundas, la historia cambia: el delfín respira con pulmones, tiene crías vivas y las alimenta con leche, igual que una vaca y a diferencia del tiburón. Por eso las hipótesis de parentesco se apoyan mejor en características de la nutrición, de la reproducción y de la estructura interna que en la silueta o en el lugar donde vive cada uno.',
      en:'There is one trap that always shows up. Living in the same environment pushes very distant species to look alike on the outside: the shark and the dolphin have a long body and fins because both swim fast, not because they are close relatives. If instead of the outline you look at deeper characteristics, the story changes: the dolphin breathes with lungs, has live young and feeds them milk, just like a cow and unlike the shark. That is why kinship hypotheses rest better on characteristics of nutrition, reproduction and internal structure than on the silhouette or on where each one lives.'
    }) + '</p>'
  );
  w6(rng, widgetHost(s6, 'w_parentesco'));
  addProblem(rng, mkP8(rng));

  /* ══ CIERRE :: sin explicación previa (Rule 1) ══ */
  sec(
    L({ es:'Para cerrar', en:'To close' }),
    L({ es:'Tú decides', en:'Your call' }),
    '<p>' + L({
      es:'Dos situaciones más, con todo lo que ya trabajaste en la mano.',
      en:'Two more situations, with everything you have already worked on in hand.'
    }) + '</p>'
  );
  addProblem(rng, mkP9(rng));
  addProblem(rng, mkP10(rng));
}
/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 1 :: reparte las estructuras en su función vital
   3 rondas, organismo distinto en cada una, reveal a la tercera falla (Rule 8)
   ══════════════════════════════════════════════════════════════════════════ */
function w1(rng, host){
  var FN = [ { es:'Nutrición', en:'Nutrition' }, { es:'Relación', en:'Relation' }, { es:'Reproducción', en:'Reproduction' } ];
  var POOL = [
    { n:{ es:'la carpa del canal', en:'the carp in the canal' }, it:[
      { s:{ es:'boca que atrapa larvas y restos del fondo', en:'mouth that catches larvae and remains from the bottom' }, f:0, w:{ es:'con eso entra materia al cuerpo', en:'that is how matter enters the body' } },
      { s:{ es:'línea lateral que capta el movimiento del agua', en:'lateral line that senses movement in the water' }, f:1, w:{ es:'con eso se entera de lo que pasa afuera', en:'that is how it finds out what happens outside' } },
      { s:{ es:'huevas que quedan pegadas entre las plantas', en:'eggs left stuck among the plants' }, f:2, w:{ es:'de ahí salen individuos nuevos', en:'new individuals come out of that' } }
    ] },
    { n:{ es:'la planta de maíz', en:'the maize plant' }, it:[
      { s:{ es:'raíces que absorben agua y sales del suelo', en:'roots that take up water and salts from the soil' }, f:0, w:{ es:'con eso entra materia al cuerpo', en:'that is how matter enters the body' } },
      { s:{ es:'estomas de la hoja que se cierran con el calor', en:'leaf stomata that close when it gets hot' }, f:1, w:{ es:'eso es una respuesta a un cambio del ambiente', en:'that is a response to a change in the environment' } },
      { s:{ es:'espiga con polen en la punta de la planta', en:'tassel with pollen at the top of the plant' }, f:2, w:{ es:'de ahí salen individuos nuevos', en:'new individuals come out of that' } }
    ] },
    { n:{ es:'la abeja del panal', en:'the bee in the hive' }, it:[
      { s:{ es:'aparato bucal alargado que succiona néctar', en:'long mouthpart that sucks nectar' }, f:0, w:{ es:'con eso entra materia al cuerpo', en:'that is how matter enters the body' } },
      { s:{ es:'antenas que captan olores de las flores', en:'antennae that pick up flower scents' }, f:1, w:{ es:'con eso se entera de lo que pasa afuera', en:'that is how it finds out what happens outside' } },
      { s:{ es:'huevos que la reina deja en las celdas', en:'eggs the queen leaves in the cells' }, f:2, w:{ es:'de ahí salen individuos nuevos', en:'new individuals come out of that' } }
    ] },
    { n:{ es:'el hongo del tronco caído', en:'the fungus on the fallen log' }, it:[
      { s:{ es:'hilos delgados que absorben materia de la madera', en:'thin threads that absorb matter from the wood' }, f:0, w:{ es:'con eso entra materia al cuerpo', en:'that is how matter enters the body' } },
      { s:{ es:'crecimiento dirigido hacia la zona más húmeda', en:'growth aimed at the damper area' }, f:1, w:{ es:'eso es una respuesta a un cambio del ambiente', en:'that is a response to a change in the environment' } },
      { s:{ es:'esporas que se sueltan y viaja con el aire', en:'spores that come loose and travel on the air' }, f:2, w:{ es:'de ahí salen individuos nuevos', en:'new individuals come out of that' } }
    ] },
    { n:{ es:'el caracol del jardín', en:'the garden snail' }, it:[
      { s:{ es:'lengua áspera que raspa la hoja', en:'rough tongue that scrapes the leaf' }, f:0, w:{ es:'con eso entra materia al cuerpo', en:'that is how matter enters the body' } },
      { s:{ es:'tentáculos que se retraen al tocarlos', en:'tentacles that pull back when touched' }, f:1, w:{ es:'con eso se entera de lo que pasa afuera', en:'that is how it finds out what happens outside' } },
      { s:{ es:'huevos enterrados en tierra húmeda', en:'eggs buried in damp soil' }, f:2, w:{ es:'de ahí salen individuos nuevos', en:'new individuals come out of that' } }
    ] }
  ];
  var ORG = shuffle(POOL, rng).slice(0, 3);
  ORG.forEach(function(o){ o.it = shuffle(o.it, rng); });
  var rd = 0, tries = 0, revealed = false, done = false;
  var assign = [-1, -1, -1];

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Reparte las estructuras', en:'Sort the structures' }) + '</div>' +
    '<div class="gw-q" data-r="q"></div>' +
    '<div class="gw-mini">' + L({
      es:'Toca cada estructura las veces que haga falta hasta dejarle la función que cumple. Puedes cambiarla cuantas veces quieras antes de comprobar.',
      en:'Tap each structure as many times as you need until it carries the function it serves. You can change it as often as you like before checking.'
    }) + '</div>' +
    '<div class="fnlg">' +
      '<span><i class="fndot n"></i>' + L(FN[0]) + '</span>' +
      '<span><i class="fndot r"></i>' + L(FN[1]) + '</span>' +
      '<span><i class="fndot d"></i>' + L(FN[2]) + '</span>' +
    '</div>' +
    '<div class="gw-grid" data-r="grid"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Comprobar', en:'Check' }) + '</button></div>' +
    '<div class="gw-fb"></div>';

  var elQ = host.querySelector('[data-r="q"]'),
      elG = host.querySelector('[data-r="grid"]'),
      elK = host.querySelector('[data-r="chk"]');

  function render(){
    var o = ORG[rd];
    elQ.innerHTML = L({
      es:'Ronda ' + (rd + 1) + ' de 3: ' + L(o.n) + '. Deja cada estructura en la función que cumple.',
      en:'Round ' + (rd + 1) + ' of 3: ' + L(o.n) + '. Leave each structure in the function it serves.'
    });
    elG.innerHTML = o.it.map(function(it, i){
      var a = assign[i];
      var cls = a === 0 ? ' fN' : a === 1 ? ' fR' : a === 2 ? ' fD' : '';
      var lbl = a < 0 ? L({ es:'toca para asignar', en:'tap to assign' }) : L(FN[a]);
      return '<button class="gw-tile' + cls + '" data-i="' + i + '"' + ((revealed || done) ? ' disabled' : '') + '>' +
        '<span class="gw-key">' + L(it.s) + '</span><span class="gw-sub">' + lbl + '</span></button>';
    }).join('');
    elG.querySelectorAll('.gw-tile').forEach(function(b){
      b.addEventListener('click', function(){
        var i = parseInt(b.getAttribute('data-i'), 10);
        assign[i] = assign[i] >= 2 ? -1 : assign[i] + 1;
        render();
      });
    });
  }

  function advance(){
    rd++;
    assign = [-1, -1, -1];
    tries = 0; revealed = false;
    if (rd >= 3){
      done = true;
      elK.textContent = L({ es:'Completado', en:'Completed' });
      elK.className = 'gw-btn solved';
      elK.disabled = true;
      say(host, 'good', L({
        es:'Tres organismos que no se parecen en nada y las mismas tres funciones en los tres. Lo que cambia es la estructura: raíz o boca, antena o estoma, huevo o espora.',
        en:'Three organisms that look nothing alike and the same three functions in all three. What changes is the structure: root or mouth, antenna or stoma, egg or spore.'
      }));
      return;
    }
    elK.textContent = L({ es:'Comprobar', en:'Check' });
    elK.className = 'gw-btn';
    say(host, '', L({ es:'Otro organismo, otras estructuras, las mismas tres funciones.', en:'Another organism, other structures, the same three functions.' }));
    render();
  }

  elK.addEventListener('click', function(){
    if (done) return;
    if (revealed){ advance(); return; }
    var o = ORG[rd];
    var pend = assign.indexOf(-1);
    if (pend >= 0){
      say(host, 'warm', L({ es:'Todavía falta una estructura sin función. Tócala hasta darle una.', en:'One structure still has no function. Tap it until it gets one.' }));
      return;
    }
    var wrong = [];
    o.it.forEach(function(it, i){ if (assign[i] !== it.f) wrong.push(i); });
    if (wrong.length === 0){
      say(host, 'good', L({ es:'Las tres quedaron en su lugar.', en:'All three landed in place.' }));
      setTimeout(advance, 700);
      return;
    }
    tries++;
    if (tries >= 3){
      revealed = true;
      o.it.forEach(function(it, i){ assign[i] = it.f; });
      render();
      elK.textContent = L({ es:'Siguiente', en:'Next' });
      say(host, 'miss', L({
        es:'Así queda: ' + o.it.map(function(it){ return L(it.s).split(' ').slice(0, 3).join(' ') + ' va en ' + L(FN[it.f]); }).join('; ') + '.',
        en:'This is how it goes: ' + o.it.map(function(it){ return L(it.s).split(' ').slice(0, 3).join(' ') + ' goes in ' + L(FN[it.f]); }).join('; ') + '.'
      }));
      return;
    }
    var k = wrong[0];
    say(host, 'warm', L({
      es:'Quedaron ' + (3 - wrong.length) + ' de 3 en su lugar. Revisa esta: ' + L(o.it[k].s) + '. Pregúntate qué logra el organismo con ella, porque ' + L(o.it[k].w) + '.',
      en:(3 - wrong.length) + ' of 3 landed in place. Look at this one again: ' + L(o.it[k].s) + '. Ask yourself what the organism achieves with it, because ' + L(o.it[k].w) + '.'
    }));
  });

  render();
  say(host, '', L({ es:'Empieza por la que te parezca más clara.', en:'Start with the one that looks clearest to you.' }));
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 2 :: mesa de nutrición, quién fabrica y quién toma
   Drag-and-drop (mouse + touch) + tap-to-remove from tray. 3 tries max.
   ══════════════════════════════════════════════════════════════════════════ */
function w2(rng, host){
  var POOL = [
    { n:{ es:'maíz', en:'maize' }, a:true,  q:{ es:'usa la luz que reciben sus hojas para formar su propio alimento', en:'it uses the light its leaves receive to form its own food' } },
    { n:{ es:'nopal', en:'prickly pear cactus' }, a:true, q:{ es:'sus pencas verdes reciben luz y con ella forma su alimento', en:'its green pads receive light and with it forms its food' } },
    { n:{ es:'alga del arrecife', en:'reef alga' }, a:true, q:{ es:'vive donde llega la luz al agua y con esa luz forma su alimento', en:'it lives where light reaches the water and with that light forms its food' } },
    { n:{ es:'pino', en:'pine tree' }, a:true, q:{ es:'sus agujas verdes reciben luz y con ella forma su alimento', en:'its green needles receive light and with it forms its food' } },
    { n:{ es:'hongo del tronco', en:'log fungus' }, a:false, q:{ es:'absorbe materia que la madera del árbol ya había formado', en:'it absorbs matter the wood of the tree had already formed' } },
    { n:{ es:'lombriz de tierra', en:'earthworm' }, a:false, q:{ es:'traga tierra con restos de hojas que otra planta formó', en:'it swallows soil with leaf remains another plant formed' } },
    { n:{ es:'gato', en:'cat' }, a:false, q:{ es:'consigue su materia comiendo a otro animal', en:'it gets its matter by eating another animal' } },
    { n:{ es:'abeja', en:'bee' }, a:false, q:{ es:'toma el néctar que la flor ya había fabricado', en:'it takes the nectar the flower had already made' } },
    { n:{ es:'moho del pan', en:'bread mould' }, a:false, q:{ es:'absorbe la materia del pan, que salió del trigo', en:'it absorbs matter from the bread, which came from wheat' } }
  ];
  var ORG = shuffle(POOL, rng).slice(0, 6);
  var side = [-1, -1, -1, -1, -1, -1]; /* -1=pool, 0=tA, 1=tB */
  var tries = 0, done = false;

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Mesa de nutrición', en:'Nutrition table' }) + '</div>' +
    '<div class="gw-q">' + L({
      es:'Arrastra cada organismo a la charola correcta (o tócalo para moverlo). Para devolverlo a la mesa, tócalo en su charola.',
      en:'Drag each organism to the correct tray (or tap it to move it). To return it to the table, tap it in its tray.'
    }) + '</div>' +
    '<div class="gw-mini">' + L({
      es:'Acomódalos como quieras antes de comprobar. Puedes quitarlos de la charola tocándolos.',
      en:'Arrange them however you like before checking. You can remove them from a tray by tapping them.'
    }) + '</div>' +
    '<div class="gw-lbl">' + L({ es:'Todavía en la mesa', en:'Still on the table' }) + '</div>' +
    '<div class="tray-b w2-pool" data-zone="-1" style="min-height:52px;display:flex;flex-wrap:wrap;gap:.3rem;padding:.5rem;align-items:flex-start;"></div>' +
    '<div class="tray" style="margin-top:.5rem;">' +
      '<div class="tray-b hotA" data-zone="0" style="min-height:70px;">' +
        '<div class="tray-t">' + L({ es:'Fabrica su alimento', en:'Makes its own food' }) + '</div>' +
        '<div class="w2-tray-inner" data-zone="0" style="display:flex;flex-wrap:wrap;gap:.3rem;padding:.3rem;min-height:44px;"></div>' +
      '</div>' +
      '<div class="tray-b hotB" data-zone="1" style="min-height:70px;">' +
        '<div class="tray-t">' + L({ es:'Toma alimento ya hecho', en:'Takes food ready made' }) + '</div>' +
        '<div class="w2-tray-inner" data-zone="1" style="display:flex;flex-wrap:wrap;gap:.3rem;padding:.3rem;min-height:44px;"></div>' +
      '</div>' +
    '</div>' +
    '<div class="gw-note" data-r="cnt" style="margin-top:.4rem;"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Comprobar', en:'Check' }) + '</button></div>' +
    '<div class="gw-fb"></div>';

  var elPool = host.querySelector('.w2-pool'),
      elA    = host.querySelector('[data-zone="0"].w2-tray-inner'),
      elB    = host.querySelector('[data-zone="1"].w2-tray-inner'),
      elC    = host.querySelector('[data-r="cnt"]'),
      elK    = host.querySelector('[data-r="chk"]');

  /* ── ghost element for drag ── */
  var ghost = null, dragIdx = -1;

  function makePill(i){
    var btn = document.createElement('button');
    btn.className = 'gw-btn';
    btn.setAttribute('data-i', String(i));
    btn.style.cssText = 'padding:.38rem .65rem;font-size:.82rem;min-height:38px;margin:0;cursor:grab;touch-action:none;user-select:none;';
    btn.textContent = L(ORG[i].n);
    if (done) { btn.disabled = true; return btn; }

    /* ── click / tap: cycle pool→tA→tB→pool or remove from tray ── */
    btn.addEventListener('click', function(e){
      if (dragWasDrag) { dragWasDrag = false; return; }
      var cur = side[i];
      if (cur === -1) {
        /* pool → pick first empty tray or tA */
        side[i] = 0;
      } else {
        /* tray → back to pool (remove) */
        side[i] = -1;
      }
      render();
    });

    /* ── mouse drag ── */
    btn.addEventListener('mousedown', function(e){
      if (done) return;
      e.preventDefault();
      startDrag(i, e.clientX, e.clientY, btn.getBoundingClientRect());
    });

    /* ── touch drag ── */
    btn.addEventListener('touchstart', function(e){
      if (done) return;
      e.preventDefault();
      var t = e.touches[0];
      startDrag(i, t.clientX, t.clientY, btn.getBoundingClientRect());
    }, { passive: false });

    return btn;
  }

  var dragWasDrag = false;

  function startDrag(i, cx, cy, rect){
    dragIdx = i;
    dragWasDrag = false;
    ghost = document.createElement('div');
    ghost.textContent = L(ORG[i].n);
    ghost.style.cssText = 'position:fixed;z-index:9999;pointer-events:none;background:var(--green);color:#fff;border-radius:8px;padding:.38rem .7rem;font-size:.82rem;opacity:.88;white-space:nowrap;';
    ghost.style.left = (cx - rect.width / 2) + 'px';
    ghost.style.top  = (cy - rect.height / 2) + 'px';
    document.body.appendChild(ghost);

    function onMove(ex, ey){
      dragWasDrag = true;
      ghost.style.left = (ex - ghost.offsetWidth / 2) + 'px';
      ghost.style.top  = (ey - ghost.offsetHeight / 2) + 'px';
      /* highlight drop targets */
      [elPool, elA, elB].forEach(function(el){
        var r = el.getBoundingClientRect();
        var hit = ex >= r.left && ex <= r.right && ey >= r.top && ey <= r.bottom;
        el.style.outline = hit ? '2px dashed var(--green)' : '';
      });
    }
    function onUp(ex, ey){
      document.removeEventListener('mousemove', mMove);
      document.removeEventListener('mouseup', mUp);
      document.removeEventListener('touchmove', tMove);
      document.removeEventListener('touchend', tUp);
      if (ghost) { document.body.removeChild(ghost); ghost = null; }
      [elPool, elA, elB].forEach(function(el){ el.style.outline = ''; });
      if (!dragWasDrag) return;
      var zones = [{el: elPool, z:-1}, {el: elA, z:0}, {el: elB, z:1}];
      var dropped = false;
      zones.forEach(function(zn){
        var r = zn.el.getBoundingClientRect();
        if (ex >= r.left && ex <= r.right && ey >= r.top && ey <= r.bottom){
          side[dragIdx] = zn.z;
          dropped = true;
        }
      });
      dragIdx = -1;
      render();
    }
    function mMove(e){ onMove(e.clientX, e.clientY); }
    function mUp(e)  { onUp(e.clientX, e.clientY); }
    function tMove(e){ e.preventDefault(); var t=e.touches[0]; onMove(t.clientX, t.clientY); }
    function tUp(e)  { var t=e.changedTouches[0]; onUp(t.clientX, t.clientY); }
    document.addEventListener('mousemove', mMove);
    document.addEventListener('mouseup',   mUp);
    document.addEventListener('touchmove', tMove, { passive:false });
    document.addEventListener('touchend',  tUp);
  }

  function render(){
    elPool.innerHTML = '';
    elA.innerHTML = '';
    elB.innerHTML = '';
    var hasPool = false;
    ORG.forEach(function(o, i){
      var pill = makePill(i);
      if (side[i] === 0)       { elA.appendChild(pill); }
      else if (side[i] === 1)  { elB.appendChild(pill); }
      else                     { elPool.appendChild(pill); hasPool = true; }
    });
    if (!hasPool) {
      var empty = document.createElement('span');
      empty.className = 'chip';
      empty.textContent = L({ es:'la mesa quedó vacía', en:'the table is empty now' });
      elPool.appendChild(empty);
    }
    var na = side.filter(function(s){ return s === 0; }).length;
    var nb = side.filter(function(s){ return s === 1; }).length;
    elC.textContent = L({
      es:'Fabrican su alimento: ' + na + '. Toman alimento ya hecho: ' + nb + '. Sin decidir: ' + (6 - na - nb) + '.',
      en:'Make their own food: ' + na + '. Take food ready made: ' + nb + '. Undecided: ' + (6 - na - nb) + '.'
    });
  }

  elK.addEventListener('click', function(){
    if (done) return;
    var pend = side.indexOf(-1);
    if (pend >= 0){
      say(host, 'warm', L({ es:'Todavía hay organismos en la mesa. Arrástralos o tócalos para llevarlos a una charola.', en:'There are still organisms on the table. Drag or tap them to move them into a tray.' }));
      return;
    }
    var wrong = [];
    ORG.forEach(function(o, i){ if ((side[i] === 0) !== o.a) wrong.push(i); });
    if (wrong.length === 0){
      done = true;
      elK.textContent = L({ es:'Completado', en:'Completed' });
      elK.className = 'gw-btn solved';
      render();
      say(host, 'good', L({
        es:'Quedó bien repartida. Fíjate en lo que tienen en común los de la izquierda: reciben luz y forman su alimento con materia sencilla. Los de la derecha, sin excepción, dependen de materia que otro ser vivo formó antes.',
        en:'Well sorted. Notice what the ones on the left have in common: they receive light and form their food from simple matter. The ones on the right, without exception, depend on matter another living thing formed first.'
      }));
      return;
    }
    tries++;
    if (tries >= 3){
      done = true;
      ORG.forEach(function(o, i){ side[i] = o.a ? 0 : 1; });
      elK.textContent = L({ es:'Completado', en:'Completed' });
      elK.className = 'gw-btn solved';
      render();
      say(host, 'miss', L({
        es:'Así queda la mesa: ' + ORG.filter(function(o){ return o.a; }).map(function(o){ return L(o.n); }).join(', ') + ' fabrican su alimento; ' + ORG.filter(function(o){ return !o.a; }).map(function(o){ return L(o.n); }).join(', ') + ' toman materia ya formada.',
        en:'This is how the table ends up: ' + ORG.filter(function(o){ return o.a; }).map(function(o){ return L(o.n); }).join(', ') + ' make their own food; ' + ORG.filter(function(o){ return !o.a; }).map(function(o){ return L(o.n); }).join(', ') + ' take matter already formed.'
      }));
      return;
    }
    var k = wrong[0];
    say(host, 'warm', L({
      es:'Hay ' + wrong.length + ' en la charola equivocada. Empieza por revisar ' + L(ORG[k].n) + ': ' + L(ORG[k].q) + '.',
      en:'There are ' + wrong.length + ' in the wrong tray. Start by checking ' + L(ORG[k].n) + ': ' + L(ORG[k].q) + '.'
    }));
  });

  render();
  say(host, '', L({ es:'Seis organismos, dos maneras de conseguir materia.', en:'Six organisms, two ways of getting matter.' }));
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 3 :: la lámpara y el tallo — lámpara arrastrable. 3 rondas.
   ══════════════════════════════════════════════════════════════════════════ */
function w3(rng, host){
  var GOALS = shuffle([
    { k:'left',
      t:{ es:'que el tallo esté inclinado hacia la izquierda', en:'the stem leaning to the left' },
      ok:function(v){ return v <= 35; },
      hint:{ es:'Arrastra la lámpara hacia la izquierda.', en:'Drag the lamp to the left.' } },
    { k:'right',
      t:{ es:'que el tallo esté inclinado hacia la derecha', en:'the stem leaning to the right' },
      ok:function(v){ return v >= 65; },
      hint:{ es:'Arrastra la lámpara hacia la derecha.', en:'Drag the lamp to the right.' } },
    { k:'up',
      t:{ es:'que el tallo crezca derecho hacia arriba', en:'the stem growing straight upwards' },
      ok:function(v){ return v >= 40 && v <= 60; },
      hint:{ es:'Coloca la lámpara justo encima de la planta, al centro.', en:'Place the lamp directly above the plant, centred.' } }
  ], rng);
  var rd = 0, tries = 0, done = false, revealed = false;
  var v = ri(rng, 30, 70);

  /* qualitative description — no numbers, no percentages */
  function stemLabel(ang){
    if (ang === 0) return L({ es:'El tallo está derecho hacia arriba.', en:'The stem is straight up.' });
    var side = ang < 0
      ? L({ es:'a la izquierda', en:'to the left' })
      : L({ es:'a la derecha', en:'to the right' });
    var deg = Math.abs(ang);
    var strength = deg < 8
      ? L({ es:'muy ligeramente inclinado ', en:'very slightly leaning ' })
      : deg < 18
        ? L({ es:'ligeramente inclinado ', en:'slightly leaning ' })
        : deg < 26
          ? L({ es:'bastante inclinado ', en:'noticeably leaning ' })
          : L({ es:'fuertemente inclinado ', en:'strongly leaning ' });
    return L({ es:'El tallo está ', en:'The stem is ' }) + strength + side + '.';
  }

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'La lámpara y el tallo', en:'The lamp and the stem' }) + '</div>' +
    '<div class="gw-q" data-r="q"></div>' +
    '<div class="gw-mini">' + L({
      es:'Arrastra la lámpara 💡 con el dedo o el ratón. El tallo siempre crece hacia donde está la luz. Cuando el tallo quede como se pide, presiona Comprobar.',
      en:'Drag the 💡 lamp with your finger or mouse. The stem always grows toward the light. When the stem looks as asked, press Check.'
    }) + '</div>' +
    '<div class="stage" data-r="stage" style="cursor:grab;touch-action:none;user-select:none;">' +
      '<div class="lamp" data-r="lamp" style="cursor:grab;">💡</div>' +
      '<div class="ray" data-r="ray"></div>' +
      '<div class="stem" data-r="stem"><div class="leafL"></div><div class="leafR"></div><div class="bud"></div></div>' +
      '<div class="soil"></div>' +
    '</div>' +
    '<div class="gw-num" data-r="num" style="margin:.5rem 0 .15rem;font-size:.9rem;font-weight:600;min-height:1.4em;"></div>' +
    '<div class="gw-note" data-r="verd" style="font-size:.76rem;color:var(--text3);margin-bottom:.35rem;"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Comprobar', en:'Check' }) + '</button></div>' +
    '<div class="gw-fb"></div>';

  var elStage = host.querySelector('[data-r="stage"]'),
      elL     = host.querySelector('[data-r="lamp"]'),
      elR     = host.querySelector('[data-r="ray"]'),
      elS     = host.querySelector('[data-r="stem"]'),
      elN     = host.querySelector('[data-r="num"]'),
      elV     = host.querySelector('[data-r="verd"]'),
      elQ     = host.querySelector('[data-r="q"]'),
      elK     = host.querySelector('[data-r="chk"]');

  function setV(clientX){
    var r = elStage.getBoundingClientRect();
    var raw = (clientX - r.left) / r.width * 100;
    v = Math.max(3, Math.min(97, Math.round(raw)));
    render();
  }

  function onDragStart(e){
    if (done || revealed) return;
    e.preventDefault();
    elStage.style.cursor = 'grabbing';
    elL.style.cursor = 'grabbing';
    function onMove(ev){
      var cx = ev.touches ? ev.touches[0].clientX : ev.clientX;
      setV(cx);
    }
    function onUp(){
      elStage.style.cursor = 'grab';
      elL.style.cursor = 'grab';
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      document.removeEventListener('touchmove', onMove);
      document.removeEventListener('touchend', onUp);
    }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
    document.addEventListener('touchmove', onMove, { passive:false });
    document.addEventListener('touchend', onUp);
    var cx0 = e.touches ? e.touches[0].clientX : e.clientX;
    setV(cx0);
  }

  elL.addEventListener('mousedown', onDragStart);
  elL.addEventListener('touchstart', onDragStart, { passive:false });
  elStage.addEventListener('mousedown', onDragStart);
  elStage.addEventListener('touchstart', onDragStart, { passive:false });

  function render(){
    var ang = Math.round((v - 50) * 0.62);
    elL.style.left = 'calc(' + v + '% - 20px)';
    elR.style.left = 'calc(' + v + '% - 1px)';
    elR.style.height = '58px';
    elS.style.transform = 'rotate(' + ang + 'deg)';
    elQ.innerHTML = L({
      es:'Ronda ' + (rd + 1) + ' de 3 — consigue ' + L(GOALS[rd].t) + '.',
      en:'Round ' + (rd + 1) + ' of 3 — get ' + L(GOALS[rd].t) + '.'
    });
    elN.textContent = stemLabel(ang);
    elV.textContent = L({
      es:'El tallo crece más despacio del lado iluminado y más rápido del lado sombreado: por eso se dobla hacia la luz.',
      en:'The stem grows more slowly on the lit side and faster on the shaded side: that is why it bends toward the light.'
    });
  }

  function advance(){
    rd++; tries = 0; revealed = false;
    if (rd >= 3){
      done = true;
      elK.textContent = L({ es:'Completado', en:'Completed' });
      elK.className = 'gw-btn solved';
      elK.disabled = true;
      render();
      say(host, 'good', L({
        es:'La planta no se movió de lugar y aun así respondió tres veces a la posición de la luz. Detectar un cambio y cambiar por él: eso es la función de relación, aunque aquí se vea como crecimiento y no como un salto.',
        en:'The plant did not move from its spot and still responded three times to the position of the light. Detecting a change and changing because of it: that is the function of relation, even if here it looks like growth and not like a leap.'
      }));
      return;
    }
    v = ri(rng, 35, 65);
    elK.textContent = L({ es:'Comprobar', en:'Check' });
    elK.className = 'gw-btn';
    render();
    say(host, '', L({ es:'Nueva instrucción. Arrastra la lámpara.', en:'New instruction. Drag the lamp.' }));
  }

  elK.addEventListener('click', function(){
    if (done) return;
    if (revealed){ advance(); return; }
    if (GOALS[rd].ok(v)){
      say(host, 'good', L({ es:'Eso es: el tallo quedó como se pedía.', en:'That is it: the stem ended up as asked.' }));
      setTimeout(advance, 800);
      return;
    }
    tries++;
    if (tries >= 3){
      revealed = true;
      v = GOALS[rd].k === 'left' ? 10 : GOALS[rd].k === 'right' ? 90 : 50;
      render();
      elK.textContent = L({ es:'Siguiente', en:'Next' });
      say(host, 'miss', L({
        es:'Mira dónde quedó la lámpara: el tallo se inclina hacia donde llega la luz, y queda derecho solo cuando la luz cae desde arriba, centrada sobre la planta.',
        en:'Look where the lamp ended up: the stem leans toward where the light comes from, and stays straight only when the light falls from above, centred over the plant.'
      }));
      return;
    }
    say(host, 'warm', L({
      es:'Todavía no. ' + L(GOALS[rd].hint) + ' Observa cómo cambia el tallo.',
      en:'Not yet. ' + L(GOALS[rd].hint) + ' Watch how the stem changes.'
    }));
  });

  render();
  say(host, '', L({ es:'Arrastra la lámpara de un lado al otro y observa cómo reacciona el tallo.', en:'Drag the lamp from side to side and watch how the stem reacts.' }));
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 4 :: la parcela y la plaga — rediseñado.
   Flujo: (1) siembra 1 variedad → suelta plaga → escribe cuántas quedan
   (2) siembra N variedades → suelta plaga → escribe cuántas quedan
   (3) compara los dos resultados y concluye.
   ══════════════════════════════════════════════════════════════════════════ */
function w4(rng, host){
  /* Each experiment: choose varieties, release pest, fill in survivor count */
  var plaga = ri(rng, 0, 5);
  var phase = 0; /* 0=setup1var, 1=afterPest1, 2=inputCount1, 3=setup multi, 4=afterPestMulti, 5=inputCountMulti, 6=done */
  var multiV = 4; /* number of varieties for second run, chosen by student via slider */
  var hit = false;

  function countSurvivors(v){
    var c = 0;
    for (var i = 0; i < 12; i++) if (i % v !== plaga % v) c++;
    return c;
  }

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'La parcela antes de la plaga', en:'The plot before the pest' }) + '</div>' +
    '<div class="gw-q" data-r="q" style="margin-bottom:.4rem;"></div>' +
    '<div class="gw-mini" data-r="mini" style="margin-bottom:.6rem;"></div>' +
    '<div class="plot" data-r="plot" style="margin-bottom:.5rem;"></div>' +
    '<div data-r="controls"></div>' +
    '<div class="gw-fb"></div>';

  var elQ    = host.querySelector('[data-r="q"]'),
      elMini = host.querySelector('[data-r="mini"]'),
      elPlot = host.querySelector('[data-r="plot"]'),
      elCtrl = host.querySelector('[data-r="controls"]');

  function drawPlot(v, deadMask){
    var html = '';
    for (var i = 0; i < 12; i++){
      var vv = i % v;
      var dead = deadMask && (i % v === plaga % v);
      html += '<div class="plant pv' + vv + (dead ? ' dead' : '') + '">🌱</div>';
    }
    elPlot.innerHTML = html;
  }

  function phase0(){
    /* First run: 1 variety, forced */
    phase = 0; hit = false;
    elQ.innerHTML = L({
      es:'<strong>Experimento 1 de 2:</strong> siembras solo 1 variedad. Todas las plantas son idénticas.',
      en:'<strong>Experiment 1 of 2:</strong> you sow only 1 variety. Every plant is identical.'
    });
    elMini.textContent = L({
      es:'Observa el campo: una sola variedad. Ahora suelta la plaga y ve qué pasa.',
      en:'Look at the field: one single variety. Now release the pest and see what happens.'
    });
    drawPlot(1, false);
    elCtrl.innerHTML =
      '<div class="gw-row"><button class="gw-btn" data-r="go">' +
        L({ es:'🐛 Soltar la plaga', en:'🐛 Release the pest' }) +
      '</button></div>';
    host.querySelector('[data-r="go"]').addEventListener('click', function(){
      hit = true;
      drawPlot(1, true);
      phase1();
    });
  }

  function phase1(){
    /* After pest on 1 variety: all dead → show dramatic message → ask student to count */
    phase = 1;
    var surv = countSurvivors(1); /* always 0 */
    say(host, 'miss', L({
      es:'¡La plaga atacó a la única variedad! Todas las plantas murieron.',
      en:'The pest attacked the only variety! Every plant died.'
    }));
    setTimeout(function(){
      phase = 2;
      elQ.innerHTML = L({
        es:'¿Cuántas plantas quedaron en pie después de la plaga?',

      });
      elMini.textContent = L({
        es:'Mira el campo y escribe el número en el recuadro.',
        en:'Look at the field and write the number in the box.'
      });
      elCtrl.innerHTML =
        '<div style="display:flex;align-items:center;gap:.6rem;margin:.4rem 0;">' +
          '<input type="number" id="w4in1" min="0" max="12" style="width:70px;padding:.5rem;border:1.5px solid var(--border);border-radius:8px;font-size:1.1rem;text-align:center;background:var(--surface);color:var(--text);" placeholder="?">' +
          '<span style="font-size:.88rem;color:var(--text2);">' + L({ es:'plantas de 12', en:'plants out of 12' }) + '</span>' +
        '</div>' +
        '<div class="gw-row"><button class="gw-btn" data-r="chk1">' + L({ es:'Confirmar', en:'Confirm' }) + '</button></div>';
      host.querySelector('[data-r="chk1"]').addEventListener('click', function(){
        var val = parseInt(document.getElementById('w4in1').value, 10);
        if (isNaN(val)){
          say(host, 'warm', L({ es:'Escribe un número antes de confirmar.', en:'Write a number before confirming.' })); return;
        }
        if (val === surv){
          say(host, 'good', L({
            es:'Correcto: quedaron ' + surv + ' plantas. Con una sola variedad, la plaga destruye todo el campo.',

          }));
          setTimeout(phase3, 1200);
        } else {
          say(host, 'warm', L({
            es:'Mira el campo otra vez. ¿Cuántas plantas siguen verdes?',
            en:'Look at the field again. How many plants are still green?'
          }));
        }
      });
    }, 1000);
  }

  function phase3(){
    /* Second run: student picks varieties with slider */
    phase = 3; hit = false; plaga = ri(rng, 0, 5);
    multiV = 3;
    elQ.innerHTML = L({
      es:'<strong>Experimento 2 de 2:</strong> ahora elige cuántas variedades distintas siembras.',
      en:'<strong>Experiment 2 of 2:</strong> now choose how many different varieties you sow.'
    });
    elMini.innerHTML = L({
      es:'Cada color es una variedad distinta. La plaga solo ataca a <em>una</em> variedad. Mueve el deslizador, mira el campo y luego suelta la plaga.',
      en:'Each colour is a different variety. The pest attacks only <em>one</em> variety. Move the slider, watch the field, then release the pest.'
    });
    drawPlot(multiV, false);
    elCtrl.innerHTML =
      '<div class="gw-lbl">' + L({ es:'Variedades que siembras', en:'Varieties you sow' }) + '</div>' +
      '<input class="gw-range" type="range" min="2" max="6" step="1" value="3" data-r="sl2">' +
      '<div class="gw-num" data-r="num2" style="font-size:.85rem;margin:.2rem 0;"></div>' +
      '<div class="gw-row"><button class="gw-btn" data-r="go2">' +
        L({ es:'🐛 Soltar la plaga', en:'🐛 Release the pest' }) +
      '</button></div>';
    var elSl2  = host.querySelector('[data-r="sl2"]'),
        elNum2 = host.querySelector('[data-r="num2"]'),
        elGo2  = host.querySelector('[data-r="go2"]');

    function updateSlider(){
      multiV = parseInt(elSl2.value, 10);
      elNum2.textContent = multiV + ' ' + L({ es:'variedades → colores distintos en el campo', en:'varieties → different colours in the field' });
      drawPlot(multiV, false);
      say(host, '', '');
    }
    elSl2.addEventListener('input', updateSlider);
    updateSlider();

    elGo2.addEventListener('click', function(){
      hit = true;
      drawPlot(multiV, true);
      phase4();
    });
  }

  function phase4(){
    phase = 4;
    var surv = countSurvivors(multiV);
    say(host, surv >= 6 ? 'good' : 'warm', L({
      es:'La plaga atacó a una de las ' + multiV + ' variedades. Mira el campo.',
      en:'The pest attacked one of the ' + multiV + ' varieties. Look at the field.'
    }));
    setTimeout(function(){
      phase = 5;
      elQ.innerHTML = L({
        es:'¿Cuántas plantas quedaron en pie esta vez?',
        en:'How many plants are left standing this time?'
      });
      elMini.textContent = L({
        es:'Mira el campo, cuenta las que siguen verdes y escribe el número.',
        en:'Look at the field, count the ones still green and write the number.'
      });
      elCtrl.innerHTML =
        '<div style="display:flex;align-items:center;gap:.6rem;margin:.4rem 0;">' +
          '<input type="number" id="w4in2" min="0" max="12" style="width:70px;padding:.5rem;border:1.5px solid var(--border);border-radius:8px;font-size:1.1rem;text-align:center;background:var(--surface);color:var(--text);" placeholder="?">' +
          '<span style="font-size:.88rem;color:var(--text2);">' + L({ es:'plantas de 12', en:'plants out of 12' }) + '</span>' +
        '</div>' +
        '<div class="gw-row"><button class="gw-btn" data-r="chk2">' + L({ es:'Confirmar', en:'Confirm' }) + '</button></div>';
      host.querySelector('[data-r="chk2"]').addEventListener('click', function(){
        var val = parseInt(document.getElementById('w4in2').value, 10);
        if (isNaN(val)){
          say(host, 'warm', L({ es:'Escribe un número antes de confirmar.', en:'Write a number before confirming.' })); return;
        }
        if (val === surv){
          phase = 6;
          /* done — show comparison */
          elCtrl.innerHTML = '';
          say(host, 'good', L({
            es:'¡Correcto! Con ' + multiV + ' variedades quedaron ' + surv + ' plantas. Con 1 variedad quedaron 0. ' +
               'La diferencia: la plaga solo reconoce una variedad. Cuantas más variedades distintas hay en el campo, menos daño puede hacer el mismo ataque.',
            en:'Correct! With ' + multiV + ' varieties, ' + surv + ' plants remained. With 1 variety, 0 remained. ' +
               'The difference: the pest recognises only one variety. The more different varieties in the field, the less damage one attack can do.'
          }));
        } else {
          say(host, 'warm', L({
            es:'Cuenta de nuevo: ¿cuántas plantas siguen verdes en el campo?',
            en:'Count again: how many plants are still green in the field?'
          }));
        }
      });
    }, 1000);
  }

  /* kick off */
  phase0();
  say(host, '', L({ es:'Vamos a hacer dos experimentos para ver qué pasa cuando llega una plaga.', en:'We will run two experiments to see what happens when a pest arrives.' }));
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 5 :: Arma los grupos — rediseñado.
   El estudiante decide SÍ/NO para cada organismo y criterio; al verificar
   ve si su clasificación coincide con la correcta y por qué.
   Tres criterios, tres rondas de clasificación.
   ══════════════════════════════════════════════════════════════════════════ */
function w5(rng, host){
  /* Organisms with known traits for each criterion */
  var ORG = [
    { n:{ es:'Maíz',            en:'Maize' },          icon:'🌽' },
    { n:{ es:'Pino',            en:'Pine tree' },       icon:'🌲' },
    { n:{ es:'Hongo del tronco',en:'Log fungus' },      icon:'🍄' },
    { n:{ es:'Gato',            en:'Cat' },             icon:'🐱' },
    { n:{ es:'Alga del arrecife',en:'Reef alga' },      icon:'🌿' },
    { n:{ es:'Pez',             en:'Fish' },            icon:'🐟' }
  ];
  /* Criteria: question, correct yes/no for each organism, explanation */
  var CRIT = [
    {
      q:{ es:'¿Fabrica su propio alimento con la luz?', en:'Does it make its own food using light?' },
      y:[1,1,0,0,1,0],
      exp:{ es:'El maíz, el pino y el alga tienen estructuras que captan la luz (hojas, agujas, células verdes) y con ella forman su alimento. El hongo, el gato y el pez no: toman materia que otros organismos ya formaron.', en:'Maize, pine and alga have structures that catch light (leaves, needles, green cells) and use it to form food. The fungus, cat and fish do not: they take matter already formed by other organisms.' }
    },
    {
      q:{ es:'¿Se desplaza de un lugar a otro por sí solo?', en:'Does it move from place to place on its own?' },
      y:[0,0,0,1,0,1],
      exp:{ es:'El gato y el pez tienen estructuras locomotoras (patas, aletas) que les permiten cambiar de lugar. El maíz, el pino, el hongo y el alga crecen fijos en un punto.', en:'The cat and fish have locomotor structures (legs, fins) that let them change location. Maize, pine, fungus and alga grow fixed in one spot.' }
    },
    {
      q:{ es:'¿Vive dentro del agua?', en:'Does it live in the water?' },
      y:[0,0,0,0,1,1],
      exp:{ es:'El alga del arrecife y el pez viven sumergidos en agua. El maíz, el pino, el hongo y el gato viven en tierra.', en:'The reef alga and fish live submerged in water. Maize, pine, fungus and cat live on land.' }
    },
    {
      q:{ es:'¿Se reproduce por semillas?', en:'Does it reproduce by seeds?' },
      y:[1,1,0,0,0,0],
      exp:{ es:'El maíz y el pino producen semillas. El hongo usa esporas, el pez pone huevos, el gato pare crías y el alga se reproduce por división.', en:'Maize and pine produce seeds. The fungus uses spores, the fish lays eggs, the cat gives birth and the alga reproduces by division.' }
    }
  ];

  /* Pick 3 criteria for 3 rounds */
  var RD_CRIT = shuffle([0,1,2,3], rng).slice(0,3);
  var rd = 0, tries = 0, done = false;
  /* studentAns[orgIdx] = true/false/null for current criterion */
  var studentAns;

  function initAns(){ studentAns = new Array(6).fill(null); }

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Clasifica los organismos', en:'Classify the organisms' }) + '</div>' +
    '<div class="gw-q" data-r="q"></div>' +
    '<div class="gw-mini">' + L({
      es:'Para cada organismo, responde SÍ o NO a la pregunta. Cuando hayas respondido los seis, presiona Verificar para ver si tu clasificación es correcta.',
      en:'For each organism, answer YES or NO to the question. When you have answered all six, press Verify to see if your classification is correct.'
    }) + '</div>' +
    '<div data-r="cards" style="display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin:.6rem 0;"></div>' +
    '<div data-r="result" style="margin:.5rem 0;"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Verificar', en:'Verify' }) + '</button></div>' +
    '<div class="gw-fb"></div>';

  var elQ    = host.querySelector('[data-r="q"]'),
      elCards= host.querySelector('[data-r="cards"]'),
      elRes  = host.querySelector('[data-r="result"]'),
      elK    = host.querySelector('[data-r="chk"]');

  /* Event delegation: yes/no buttons inside cards */
  elCards.addEventListener('click', function(e){
    if (done) return;
    var btn = e.target.closest('[data-org][data-val]');
    if (!btn) return;
    var idx = parseInt(btn.getAttribute('data-org'), 10);
    var val = btn.getAttribute('data-val') === '1';
    studentAns[idx] = val;
    renderCards();
  });

  function renderCards(){
    var crit = CRIT[RD_CRIT[rd]];
    elCards.innerHTML = ORG.map(function(o, i){
      var ans = studentAns[i];
      var yBtn = '<button data-org="' + i + '" data-val="1" style="flex:1;padding:.3rem;border:1.5px solid ' +
        (ans === true ? 'var(--ok)' : 'var(--border)') + ';border-radius:6px;background:' +
        (ans === true ? 'var(--ok-bg)' : 'var(--surface2)') + ';color:' +
        (ans === true ? 'var(--ok)' : 'var(--text2)') + ';font-weight:' + (ans === true ? '700' : '400') +
        ';cursor:pointer;font-size:.8rem;font-family:inherit;">SÍ</button>';
      var nBtn = '<button data-org="' + i + '" data-val="0" style="flex:1;padding:.3rem;border:1.5px solid ' +
        (ans === false ? 'var(--bad)' : 'var(--border)') + ';border-radius:6px;background:' +
        (ans === false ? 'var(--bad-bg)' : 'var(--surface2)') + ';color:' +
        (ans === false ? 'var(--bad)' : 'var(--text2)') + ';font-weight:' + (ans === false ? '700' : '400') +
        ';cursor:pointer;font-size:.8rem;font-family:inherit;">NO</button>';
      var border = ans === null ? 'var(--border)' : ans ? 'var(--ok)' : 'var(--bad)';
      return '<div style="border:1.5px solid ' + border + ';border-radius:10px;padding:.55rem .65rem;background:var(--surface);">' +
        '<div style="font-size:1.4rem;text-align:center;">' + o.icon + '</div>' +
        '<div style="font-size:.78rem;font-weight:600;text-align:center;margin:.2rem 0;">' + L(o.n) + '</div>' +
        '<div style="display:flex;gap:.3rem;margin-top:.3rem;">' + yBtn + nBtn + '</div>' +
        '</div>';
    }).join('');
  }

  function renderResult(correct, crit){
    /* show two columns: Grupo SÍ / Grupo NO based on CORRECT answers */
    var yOrgs = ORG.filter(function(o,i){ return crit.y[i]; }).map(function(o){ return o.icon + ' ' + L(o.n); });
    var nOrgs = ORG.filter(function(o,i){ return !crit.y[i]; }).map(function(o){ return o.icon + ' ' + L(o.n); });
    elRes.innerHTML =
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin:.3rem 0;">' +
        '<div style="background:var(--ok-bg);border:1.5px solid var(--ok);border-radius:8px;padding:.5rem;">' +
          '<div style="font-size:.68rem;font-weight:700;color:var(--ok);text-transform:uppercase;margin-bottom:.3rem;">' + L({ es:'Grupo SÍ', en:'Group YES' }) + '</div>' +
          yOrgs.map(function(s){ return '<div style="font-size:.8rem;">' + s + '</div>'; }).join('') +
        '</div>' +
        '<div style="background:var(--bad-bg);border:1.5px solid var(--bad);border-radius:8px;padding:.5rem;">' +
          '<div style="font-size:.68rem;font-weight:700;color:var(--bad);text-transform:uppercase;margin-bottom:.3rem;">' + L({ es:'Grupo NO', en:'Group NO' }) + '</div>' +
          nOrgs.map(function(s){ return '<div style="font-size:.8rem;">' + s + '</div>'; }).join('') +
        '</div>' +
      '</div>' +
      '<div style="font-size:.79rem;color:var(--text2);margin-top:.3rem;padding:.55rem .7rem;background:var(--surface2);border-radius:8px;">' +
        L(crit.exp) +
      '</div>';
  }

  function render(){
    var crit = CRIT[RD_CRIT[rd]];
    elQ.innerHTML = L({
      es:'Ronda ' + (rd+1) + ' de 3 — <strong>' + L(crit.q) + '</strong>',
      en:'Round ' + (rd+1) + ' of 3 — <strong>' + L(crit.q) + '</strong>'
    });
    elRes.innerHTML = '';
    renderCards();
  }

  function advance(){
    rd++; tries = 0;
    if (rd >= 3){
      done = true;
      elK.textContent = L({ es:'Completado', en:'Completed' });
      elK.className = 'gw-btn solved';
      elK.disabled = true;
      say(host, 'good', L({
        es:'Los mismos seis organismos, tres criterios distintos, tres repartos distintos — todos correctos. Un criterio es una pregunta sobre una característica concreta: la respuesta a esa pregunta decide los grupos, y cada criterio sirve para preguntas distintas.',
        en:'The same six organisms, three different criteria, three different arrangements — all correct. A criterion is a question about one concrete characteristic: the answer decides the groups, and each criterion serves different questions.'
      }));
      return;
    }
    initAns();
    elK.textContent = L({ es:'Verificar', en:'Verify' });
    elK.className = 'gw-btn';
    render();
    say(host, '', L({ es:'Nueva pregunta. Responde SÍ o NO para cada organismo antes de verificar.', en:'New question. Answer YES or NO for each organism before verifying.' }));
  }

  elK.addEventListener('click', function(){
    if (done) return;
    /* check all answered */
    if (studentAns.indexOf(null) >= 0){
      say(host, 'warm', L({
        es:'Todavía hay organismos sin respuesta. Toca SÍ o NO en cada tarjeta.',
        en:'Some organisms still have no answer. Tap YES or NO on each card.'
      }));
      return;
    }
    var crit = CRIT[RD_CRIT[rd]];
    var wrong = ORG.filter(function(o,i){ return !!studentAns[i] !== !!crit.y[i]; });
    if (wrong.length === 0){
      renderResult(true, crit);
      say(host, 'good', L({
        es:'¡Correcto! Todos los organismos quedaron en el grupo correcto.',
        en:'Correct! Every organism ended up in the right group.'
      }));
      setTimeout(advance, 1600);
      return;
    }
    tries++;
    var wrongNames = wrong.map(function(o){ return o.icon + ' ' + L(o.n); }).join(', ');
    if (tries >= 3){
      /* show correct grouping */
      ORG.forEach(function(o,i){ studentAns[i] = !!crit.y[i]; });
      renderCards();
      renderResult(false, crit);
      elK.textContent = L({ es:'Siguiente', en:'Next' });
      say(host, 'miss', L({
        es:'Estos no coincidían: ' + wrongNames + '. Lee la explicación y luego continúa.',
        en:'These did not match: ' + wrongNames + '. Read the explanation and then continue.'
      }));
      elK.onclick = function(){ if (!done){ tries = 99; advance(); } };
      return;
    }
    say(host, 'warm', L({
      es:wrong.length + ' organismo(s) mal clasificado(s): ' + wrongNames + '. Piensa en la pregunta y ajusta tu respuesta.',
      en:wrong.length + ' organism(s) misclassified: ' + wrongNames + '. Think about the question and adjust your answer.'
    }));
  });

  initAns();
  render();
  say(host, '', L({ es:'Lee la pregunta y responde SÍ o NO para cada organismo.', en:'Read the question and answer YES or NO for each organism.' }));
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 6 :: tabla de rasgos — el estudiante llena los ✓ de los
   candidatos y luego decide quién comparte más con el organismo focal.
   Rediseñado: celdas interactivas, conteo visual en tiempo real.
   ══════════════════════════════════════════════════════════════════════════ */
function w6(rng, host){
  /* Deep-copy pool entries so shuffling doesn't mutate originals */
  var POOL = [
    {
      focal:{ es:'delfín', en:'dolphin' },
      tr:[
        { es:'respira aire con pulmones', en:'breathes air with lungs' },
        { es:'alimenta a sus crías con leche', en:'feeds its young with milk' },
        { es:'la cría nace viva (no de huevo)', en:'the young is born live (not from an egg)' },
        { es:'tiene el cuerpo cubierto de plumas', en:'has a body covered in feathers' },
        { es:'tiene cuerpo alargado y aletas para nadar', en:'has a long body and fins for swimming' }
      ],
      f:[1,1,1,0,1],
      c:[
        { n:{ es:'atún', en:'tuna' }, v:[0,0,0,0,1] },
        { n:{ es:'vaca', en:'cow' }, v:[1,1,1,0,0] },
        { n:{ es:'pingüino', en:'penguin' }, v:[1,0,0,1,1] }
      ],
      ok:1,
      why:{ es:'nadar en el mar lo exige el ambiente, y por eso aparece en animales muy lejanos entre sí',

    },
    {
      focal:{ es:'murciélago', en:'bat' },
      tr:[
        { es:'vuela con alas', en:'flies with wings' },
        { es:'alimenta a sus crías con leche', en:'feeds its young with milk' },
        { es:'tiene el cuerpo cubierto de pelo', en:'has a body covered in hair' },
        { es:'pone huevos', en:'lays eggs' },
        { es:'tiene esqueleto interno con huesos', en:'has an internal skeleton with bones' }
      ],
      f:[1,1,1,0,1],
      c:[
        { n:{ es:'golondrina', en:'swallow' }, v:[1,0,0,1,1] },
        { n:{ es:'ratón', en:'mouse' }, v:[0,1,1,0,1] },
        { n:{ es:'mariposa', en:'butterfly' }, v:[1,0,0,1,0] }
      ],
      ok:1,
      why:{ es:'volar apareció por separado en grupos muy distintos, así que compartirlo no basta para proponer parentesco',
            en:'flying appeared separately in very different groups, so sharing it is not enough to propose kinship' }
    },
    {
      focal:{ es:'pingüino', en:'penguin' },
      tr:[
        { es:'tiene el cuerpo cubierto de plumas', en:'has a body covered in feathers' },
        { es:'pone huevos con cascarón', en:'lays eggs with a shell' },
        { es:'pasa gran parte del tiempo nadando', en:'spends much of its time swimming' },
        { es:'alimenta a sus crías con leche', en:'feeds its young with milk' },
        { es:'respira aire con pulmones', en:'breathes air with lungs' }
      ],
      f:[1,1,1,0,1],
      c:[
        { n:{ es:'gaviota', en:'seagull' }, v:[1,1,0,0,1] },
        { n:{ es:'foca', en:'seal' }, v:[0,0,1,1,1] },
        { n:{ es:'atún', en:'tuna' }, v:[0,0,1,0,0] }
      ],
      ok:0,
      why:{ es:'los tres nadan en agua fría porque los tres viven ahí, y ese rasgo no distingue quién viene de quién',
            en:'all three swim in cold water because they all live there, and that trait does not tell who comes from whom' }
    },
    {
      focal:{ es:'maíz', en:'maize' },
      tr:[
        { es:'fabrica su alimento con la luz', en:'makes its food with light' },
        { es:'se reproduce por semillas', en:'reproduces by seeds' },
        { es:'tiene raíz, tallo y hojas', en:'has root, stem and leaves' },
        { es:'se reproduce por esporas', en:'reproduces by spores' },
        { es:'absorbe materia de otro ser vivo ya formada', en:'absorbs matter another living thing already formed' }
      ],
      f:[1,1,1,0,0],
      c:[
        { n:{ es:'pino', en:'pine tree' }, v:[1,1,1,0,0] },
        { n:{ es:'helecho', en:'fern' }, v:[1,0,1,1,0] },
        { n:{ es:'hongo del tronco', en:'log fungus' }, v:[0,0,0,1,1] }
      ],
      ok:0,
      why:{ es:'ser verde y vivir plantado los junta, pero la forma de reproducirse separa a unos de otros',
            en:'being green and living rooted puts them together, but the way of reproducing separates them' }
    }
  ];

  /* Deep-copy each pool entry so mutations don't bleed across rounds */
  var RD = shuffle(POOL, rng).slice(0, 3).map(function(r){
    var order = shuffle([0, 1, 2], rng);
    var nc = order.map(function(k){ return { n: r.c[k].n, v: r.c[k].v.slice() }; });
    return {
      focal: r.focal,
      tr: r.tr,
      f: r.f.slice(),
      c: nc,
      ok: order.indexOf(r.ok),
      why: r.why
    };
  });

  var rd = 0, tries = 0, done = false, revealed = false;
  /* studentV[cIdx][trIdx] = true/false — what the student filled in */
  var studentV;

  function initStudentV(){
    var r = RD[rd];
    studentV = r.c.map(function(){ return new Array(r.tr.length).fill(false); });
  }

  function countShared(r, cIdx, useStudent){
    var n = 0;
    for (var i = 0; i < r.tr.length; i++){
      var cHas = useStudent ? studentV[cIdx][i] : r.c[cIdx].v[i];
      if (r.f[i] && cHas) n++;
    }
    return n;
