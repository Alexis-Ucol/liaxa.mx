<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Los Tres Estados de la Materia: Modelo de Partículas</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; text-align: justify; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:100px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 76px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Los Tres Estados de la Materia: Modelo de Partículas</div>
    <div class="wcourse" id="wcourse-el">Física · 2° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Los Tres Estados de la Materia: Modelo de Partículas</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="sbtn" id="dlBtn" onclick="generatePDF()" style="max-width:280px;margin:0 auto;">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   CENTRALIZED SCHOOL CONFIG (Rule 16) — ships UNBRANDED (Rule 11).
   The ONLY rebranding point. build_all.py substitutes these exact fields
   (BRAND_FIELDS / RGB_FIELDS / logo*) downstream; :root/dark stay as fallback.
   Neutral defaults below == the static :root/dark values, so unbranded == no-op.
   ══════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:'#1a4a8a', primaryDark:'#0c2547', primaryBg:'#e7edf6',
  accent:'#e07b1a', accentBg:'#fbeddf',
  darkPrimary:'#437bc6', darkPrimaryDark:'#74a5e6', darkPrimaryBg:'#0c203a',

  document.getElementById('restoreBar').style.display = 'none';

  var att = currentAttempt(name, group);

  document.getElementById('lessonScreen').style.display  = 'block';

    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
  saved.choices.forEach(function(choice, idx) {

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;

}

      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/\u2192/g,'->').replace(/\u2212/g,'-').replace(/\u00b2/g,'^2')
      .replace(/\u00b3/g,'^3').replace(/\u00d7/g,'x').replace(/\u00f7/g,'/')
      .replace(/\u2260/g,'!=').replace(/\u2264/g,'<=').replace(/\u2265/g,'>=')
      .replace(/\u221a/g,'sqrt').replace(/\u03c0/g,'pi').replace(/\u2026/g,'...')

  // ── PORTADA: orange line / white logo strip / orange line / blue band ──

    doc.setTextColor(255,255,255); doc.setFontSize(7); doc.setFont('helvetica','bold');
    doc.text(ok?'✓':'✗', M+4.5, sy+6.5);
    doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('helvetica','normal');
    doc.text('Problema '+(i+1)+': '+pdfText(prob.title), M+12, sy+6.5);
    doc.setTextColor(ok?26:176, ok?106:48, ok?74:16);
    doc.text(ok?'Correcto':'Incorrecto', PW-M-24, sy+6.5);
    sy += 12;
  });

  // ── Per-problem pages ──
  for (var i = 0; i < problems.length; i++) {
    var prob = problems[i];
    doc.addPage();
    var wy = 0;

    doc.setFillColor(pBR,pBG,pBB); doc.rect(0,0,PW,20,'F');

    doc.setFontSize(7.5); var exLines = doc.splitTextToSize('Solución: '+expRaw, TW-18).slice(0,4);
    var ansBoxH = 8 + chLines.length*5.5 + coLines.length*5 + exLines.length*5 + 6;
    doc.setFillColor(isOk?232:255, isOk?240:232, isOk?232:228);
    doc.roundedRect(M,wy,TW,ansBoxH,2,2,'F');
    doc.setFillColor(isOk?26:176, isOk?106:48, isOk?74:16);
    doc.circle(M+7, wy+8, 3.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(9); doc.setFont('helvetica','bold');
    doc.text(isOk?'✓':'✗', M+5.2, wy+10.5);
    var ay = wy+7;
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','bold');
    chLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5.5); });

    // ── SAVE / SHARE — iOS-safe download (LIAXA iOS PDF fix, Rule 12) ─────────
  //   iOS Safari ignores the <a download> attribute, so a plain download fails
  //   silently on iPhone/iPad. iOS -> native share sheet (-> "Save to Files"),
  //   with an inline-open fallback; everything else -> <a download> click.
  //   Runs synchronously off the tap so iOS accepts navigator.share().
  var _fname   = 'fis2_t04_g01_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf';
  var _pdfBlob = doc.output('blob');

  function _restorePdfBtn(){ btn.innerHTML = '\u2b07 &nbsp;' + t('btn-pdf'); btn.disabled = false; }
  function _openPdfInline(b){
    var u = URL.createObjectURL(b);
    var w = window.open(u, '_blank');
    if (!w) { window.location.href = u; }
    setTimeout(function(){ URL.revokeObjectURL(u); }, 60000);
  }

  var _isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
               (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  if (_isIOS) {
    var _pdfFile = new File([_pdfBlob], _fname, { type:'application/pdf' });
    if (navigator.canShare && navigator.canShare({ files:[_pdfFile] })) {
      navigator.share({ files:[_pdfFile], title:_fname })
        .then(_restorePdfBtn)
        .catch(function(e){
          if (e && e.name === 'AbortError') { _restorePdfBtn(); return; }
          _openPdfInline(_pdfBlob); _restorePdfBtn();
        });
      return;
    }
    _openPdfInline(_pdfBlob); _restorePdfBtn();
    return;
  }

  var _dlUrl = URL.createObjectURL(_pdfBlob);
  var _dlA   = document.createElement('a');
  _dlA.href  = _dlUrl; _dlA.download = _fname;
  document.body.appendChild(_dlA); _dlA.click();
  setTimeout(function(){ document.body.removeChild(_dlA); URL.revokeObjectURL(_dlUrl); }, 200);
  _restorePdfBtn();
}

function sec(tag, title, html){
  var d = document.createElement('div');
  d.className = 'section';
  d.innerHTML = '<div class="stag">' + tag + '</div><h2>' + title + '</h2>' + html;
  document.getElementById('lessonBody').appendChild(d);

}

function widgetHost(parent, id){
  var d = document.createElement('div');
  d.className = 'gw';
  d.id = id;
  parent.appendChild(d);
  return d;
}

function rcard(name, form, note){
  return '<div class="rcard"><div class="rname">' + name + '</div><div class="rform">' + form + '</div><div class="rnote">' + note + '</div></div>';
}

function addProblem(rng, spec){
  var idx = problems.length;
  var correctVal = spec.options[spec.correct];
  var sh = shuffle(spec.options, rng);
  var prob = {
    title: spec.title,
    questionText: spec.q,
    fn: '',
    hint: spec.hint || '',
    explanation: spec.exp || '',
    options: sh,
    correctIdx: sh.indexOf(correctVal),
    showWork: false,
    studentChoice: null,
    pendingChoice: null
  };
  problems.push(prob);
  buildOneCard(prob, idx);
}


/* ══════════════════════════════════════════════════════════════════════════
   buildLesson  ::  concepto -> manipulativo -> problema, alternados (Rule 1)
   ══════════════════════════════════════════════════════════════════════════ */
function buildLesson(rng){
  injectGuideCSS();

  /* ── Apertura ── */
  sec(
    L({ es:'Punto de partida', en:'Starting point' }),
    L({ es:'Un mismo material, tres comportamientos', en:'One same material, three behaviours' }),
    '<p>' + L({
      es:'Un cubo de hielo se puede sostener con la mano y conserva sus esquinas. Si se deja sobre la mesa se vuelve un charco que se extiende y toma la forma de lo que lo rodea. Si ese charco se pone al fuego termina por desaparecer en el aire. En los tres momentos se trata del mismo material: agua.',
      en:'An ice cube can be held in your hand and keeps its corners. If it is left on the table it turns into a puddle that spreads out and takes the shape of whatever surrounds it. If that puddle is put on the flame it ends up vanishing into the air. In all three moments it is the same material: water.'
    }) + '</p>' +
    '<p>' + L({
      es:'Lo que cambia entre esos tres momentos no se ve a simple vista. Para explicarlo hay que imaginar lo que ocurre muy por debajo del tamaño que alcanzan nuestros ojos, y eso es justamente lo que propone el modelo de partículas.',
      en:'What changes between those three moments cannot be seen with the naked eye. To explain it you have to imagine what happens far below the size our eyes can reach, and that is exactly what the particle model proposes.'
    }) + '</p>' +
    '<div class="callout"><p><strong>' + L({ es:'Idea clave: ', en:'Key idea: ' }) + '</strong>' + L({
      es:'el estado de agregación no es una propiedad fija de un material, sino la situación en la que se encuentran sus partículas en ese momento. Cambia la energía y cambia el estado, sin que el material deje de ser el mismo.',
      en:'the state of matter is not a fixed property of a material, but the situation its particles are in at that moment. Change the energy and the state changes, without the material ceasing to be the same.'
    }) + '</p></div>'
  );

  /* ══ CONCEPTO 1 ══ */
  var s1 = sec(
    L({ es:'Concepto 1', en:'Concept 1' }),
    L({ es:'El modelo de partículas', en:'The particle model' }),
    '<p>' + L({
      es:'El modelo de partículas propone tres cosas al mismo tiempo: todo material está formado por partículas muy pequeñas, entre esas partículas hay espacio vacío, y las partículas nunca están completamente quietas. La energía que tienen decide qué tanto se mueven y qué tan lejos logran quedar unas de otras.',
      en:'The particle model proposes three things at once: every material is made of very small particles, between those particles there is empty space, and the particles are never completely still. The energy they have decides how much they move and how far apart they manage to stay.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Estado sólido', en:'Solid state' }), L({ es:'posiciones fijas', en:'fixed positions' }), L({ es:'cada partícula vibra sin abandonar su lugar ni cambiar de vecino', en:'each particle vibrates without leaving its place or changing neighbours' })) +
      rcard(L({ es:'Estado líquido', en:'Liquid state' }), L({ es:'contacto y deslizamiento', en:'contact and sliding' }), L({ es:'las partículas siguen tocándose pero resbalan unas sobre otras', en:'the particles still touch but slide over one another' })) +
      rcard(L({ es:'Estado gaseoso', en:'Gaseous state' }), L({ es:'espacios grandes', en:'large gaps' }), L({ es:'las partículas se alejan mucho y recorren todo el recipiente', en:'the particles move far apart and travel across the whole container' })) +
    '</div>' +
    '<div class="callout"><p>' + L({
      es:'Al pasar de un estado a otro las partículas no crecen, no se encogen, no se destruyen y tampoco aparecen partículas nuevas. La cantidad de partículas es la misma antes y después: lo único que cambia es su acomodo, su rapidez y la distancia que hay entre ellas.',
      en:'When moving from one state to another the particles do not grow, do not shrink, are not destroyed and no new particles appear either. The number of particles is the same before and after: the only things that change are their arrangement, their speed and the distance between them.'
    }) + '</p></div>'
  );
  w1(rng, widgetHost(s1, 'w_box'));
  addProblem(rng, mkP1(rng));
  addProblem(rng, mkP2(rng));

  /* ══ CONCEPTO 2 ══ */
  var s2 = sec(
    L({ es:'Concepto 2', en:'Concept 2' }),
    L({ es:'Qué conserva cada estado: forma y volumen', en:'What each state keeps: shape and volume' }),
    '<p>' + L({
      es:'Del acomodo de las partículas se desprenden dos comportamientos que sí se pueden observar directamente. El primero es si el material conserva su forma propia al cambiar de recipiente. El segundo es si conserva el espacio que ocupa, es decir su volumen.',
      en:'Two directly observable behaviours follow from the arrangement of the particles. The first is whether the material keeps its own shape when it changes container. The second is whether it keeps the space it takes up, that is, its volume.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Sólido', en:'Solid' }), L({ es:'forma y volumen propios', en:'own shape and volume' }), L({ es:'sus partículas no cambian de lugar, así que el bloque se ve igual en cualquier recipiente', en:'its particles do not change place, so the block looks the same in any container' })) +
      rcard(L({ es:'Líquido', en:'Liquid' }), L({ es:'volumen propio, forma prestada', en:'own volume, borrowed shape' }), L({ es:'las partículas resbalan y el material se acomoda, pero siguen en contacto y no se apretujan más', en:'the particles slide and the material settles, but they stay in contact and do not pack any tighter' })) +
      rcard(L({ es:'Gas', en:'Gas' }), L({ es:'ni forma ni volumen propios', en:'neither shape nor volume of its own' }), L({ es:'las partículas se reparten hasta ocupar todo lo que haya disponible', en:'the particles spread out until they take up everything available' })) +
    '</div>' +
    '<div class="callout"><p>' + L({
      es:'De aquí sale también la compresibilidad. Un gas se comprime con facilidad porque entre sus partículas hay mucho espacio vacío que se puede reducir. Un líquido y un sólido casi no se comprimen porque sus partículas ya están en contacto y no queda hueco que quitar.',
      en:'Compressibility comes from here too. A gas is easy to compress because between its particles there is a lot of empty space that can be reduced. A liquid and a solid hardly compress at all because their particles are already in contact and there is no gap left to remove.'
    }) + '</p></div>'
  );
  w2(rng, widgetHost(s2, 'w_vessels'));
  addProblem(rng, mkP3(rng));
  addProblem(rng, mkP4(rng));

  /* ══ CONCEPTO 3 ══ */

  function render(){

    ctx.font = '10px "IBM Plex Sans", sans-serif';
    ctx.textAlign = 'center';
    var vol = Math.min(B[0].w * B[0].h, B[1].w * B[1].h, B[2].w * B[2].h) * 0.4;
    for (k = 0; k < 3; k++){

  function check(){

    en:'Tap a state and the three containers are redrawn at once with the same amount of material.'

  requestAnimationFrame(frame);
}

  function render(){
    if (!fit()) return;
    var i, f;
    ctx.clearRect(0, 0, W, H);
    ctx.strokeStyle = cssv('--border'); ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(PADL, PADT - 6); ctx.lineTo(PADL, H - PADB); ctx.lineTo(W - PADR, H - PADB); ctx.stroke();
    ctx.font = '9px "IBM Plex Mono", monospace';
    ctx.fillStyle = cssv('--text3');
    ctx.textAlign = 'right';
    [SUB.mp, SUB.bp].forEach(function(tv){
      var y = py(tv);
      ctx.fillStyle = cssv('--text3');
      ctx.fillText(String(tv), PADL - 5, y + 3);
      ctx.strokeStyle = cssv('--border');
      ctx.setLineDash([3, 4]); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(PADL, y); ctx.lineTo(W - PADR, y); ctx.stroke();
      ctx.setLineDash([]);
    });
    ctx.textAlign = 'left';
    ctx.font = '10px "IBM Plex Sans", sans-serif';
    ctx.fillText(L({ es:'temperatura (°C)', en:'temperature (°C)' }), 6, PADT - 4);
    ctx.textAlign = 'center';
    ctx.fillText(L({ es:'energía que entra con el tiempo', en:'energy going in over time' }), (PADL + W - PADR) / 2, H - 8);
    ctx.textAlign = 'left';
    for (i = 0; i < SEG.length; i++){
      var on = (i === sel);
      ctx.strokeStyle = on ? cssv('--gold') : cssv('--green');
      ctx.lineWidth = on ? 5 : 2.6;
      ctx.beginPath();
      var first = true;
      for (f = SEG[i].a; f <= SEG[i].b + 0.0001; f += 0.005){
        var X = px(Math.min(f, SEG[i].b)), Y = py(tAt(Math.min(f, SEG[i].b)));
        if (first){ ctx.moveTo(X, Y); first = false; } else ctx.lineTo(X, Y);
      }
      ctx.stroke();
      if (on){
        ctx.fillStyle = cssv('--gold');
        var mf = (SEG[i].a + SEG[i].b) / 2;
        ctx.beginPath(); ctx.arc(px(mf), py(tAt(mf)), 5, 0, 6.2832); ctx.fill();
      }
    }
  }

  function liveTxt(){
    elL.innerHTML = '<strong>' + L({ es:'Tramo ', en:'Stretch ' }) + (sel + 1) + '.</strong> ' + L(SEG[sel].d);
  }

  function segAt(x){
    var f = (x - PADL) / (W - PADL - PADR), i;
    if (f < 0) f = 0;
    if (f > 1) f = 1;
    for (i = 0; i < SEG.length; i++) if (f <= SEG[i].b + 0.0001) return i;
    return 4;
  }

  function drawTask(){
    elT.innerHTML = L(R[rd].t);
    elN.textContent = L({ es:'situación ', en:'situation ' }) + (rd + 1) + L({ es:' de 3', en:' of 3' });
  }

  function advance(){
    rd++;
    if (rd >= 3){
      done = true;
      elC.textContent = L({ es:'Completado', en:'Completed' });
      elC.className = 'gw-btn solved';
      elN.textContent = '';
      say(host, 'good', L({
        es:'Los tramos planos son los cambios de estado y los tramos que suben son calentamientos. La curva de ',
        en:'The flat stretches are the changes of state and the rising stretches are warmings. The curve for '
      }) + L(SUB.n) + L({ es:' se lee siempre así, sin importar cuánto duren los tramos.', en:' is always read this way, no matter how long the stretches last.' }));
      return;
    }
    locked = false; tries = 0;
    elC.textContent = L({ es:'Comprobar', en:'Check' });
    elC.className = 'gw-btn';
    drawTask();
    say(host, '', L({ es:'Nueva situación. Toca los tramos de la curva y lee qué ocurre en cada uno.', en:'New situation. Tap the stretches of the curve and read what happens in each one.' }));
  }

  function close(cls, txt){
    locked = true;
    elC.textContent = rd === 2 ? L({ es:'Terminar', en:'Finish' }) : L({ es:'Siguiente situación', en:'Next situation' });
    elC.className = 'gw-btn solved';
    say(host, cls, txt);
  }

  function check(){
    if (done) return;
    if (locked){ advance(); return; }
    var tgt = R[rd].i;
    if (sel === tgt){
      close('good', L({ es:'Correcto. ', en:'Correct. ' }) + L(SEG[tgt].d));
      return;
    }
    tries++;
    if (tries >= 3){
      sel = tgt; render(); liveTxt();
      close('warm', L({ es:'Este era el tramo. ', en:'This was the stretch. ' }) + L(SEG[tgt].d));
      return;
    }
    var msg;
    if (SEG[sel].rise && !SEG[tgt].rise){
      msg = L({ es:'Ese tramo sube, así que ahí la temperatura sí está cambiando. Busca un tramo horizontal: es donde ocurre un cambio de estado.',
                en:'That stretch rises, so the temperature is changing there. Look for a horizontal stretch: that is where a change of state happens.' });
    } else if (!SEG[sel].rise && SEG[tgt].rise){
      msg = L({ es:'En ese tramo el termómetro no se mueve, así que ahí el material está cambiando de estado. Busca un tramo que suba.',
                en:'In that stretch the thermometer does not move, so the material is changing state there. Look for a stretch that rises.' });
    } else if (!SEG[sel].rise){
      msg = L({ es:'Ese tramo también es plano, pero corresponde al otro cambio de estado. Fíjate a qué temperatura ocurre cada meseta.',
                en:'That stretch is flat too, but it belongs to the other change of state. Look at the temperature at which each plateau happens.' });
    } else {
      msg = L({ es:'Ese tramo también sube, pero ahí el material está en otro estado. Fíjate si va antes o después de cada meseta.',
                en:'That stretch rises too, but the material is in another state there. Look at whether it comes before or after each plateau.' });
    }
    say(host, 'miss', msg);
  }

  function pointer(e){
    if (done || locked) return;
    var r = cv.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    sel = segAt(src.clientX - r.left);
    render(); liveTxt();
  }
  cv.addEventListener('click', pointer);
  cv.addEventListener('touchstart', function(e){ e.preventDefault(); pointer(e); }, { passive:false });
  elC.addEventListener('click', check);

  function loop(){
    if (!document.body.contains(host)) return;
    render();
    requestAnimationFrame(loop);
  }
  drawTask(); liveTxt();
  say(host, '', L({ es:'La curva es de ', en:'The curve is for ' }) + L(SUB.n) +
    L({ es:', calentada a fuego constante desde el estado sólido. Toca cualquier tramo para ver qué hacen sus partículas.',
        en:', heated over a steady flame from the solid state. Tap any stretch to see what its particles are doing.' }));
  requestAnimationFrame(loop);
}


/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 5  ::  Equilibrio termico entre dos bloques
   ══════════════════════════════════════════════════════════════════════════ */
function w5(rng, host){
  var rd = 0, tries = 0, locked = false, done = false;
  var TA = 0, TB = 0, LO = 0, HI = 0, pred = 0, curA = 0, curB = 0, mixing = false;

  function newRound(){
    TA = ri(rng, 62, 92);
    TB = ri(rng, 4, 26);
    LO = TB - 14; HI = TA + 14;
    pred = ri(rng, LO, HI);
    curA = TA; curB = TB; mixing = false;
  }
  newRound();

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Dos bloques que se tocan', en:'Two blocks in contact' }) + '</div>' +
    '<div class="gw-q">' + L({
      es:'Dos bloques iguales del mismo material se van a poner en contacto, aislados de todo lo demás. Coloca el marcador donde crees que quedará la temperatura de los dos al final.',
      en:'Two identical blocks of the same material are about to be put in contact, isolated from everything else. Place the marker where you think the temperature of both will end up.'
    }) + '</div>' +
    '<canvas class="gw-cvs tall" data-r="cvs"></canvas>' +
    '<div class="gw-slab"><span class="gw-cl">' + L({ es:'predicción', en:'prediction' }) + '</span>' +
      '<input type="range" data-r="sl"><span class="gw-val" data-r="pv"></span></div>' +
    '<div class="gw-mini" data-r="live"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Poner en contacto', en:'Put in contact' }) + '</button>' +
      '<span class="gw-val" data-r="cnt"></span></div>' +
    '<div class="gw-fb"></div>';

  var cv = host.querySelector('[data-r="cvs"]'),
      ctx = cv.getContext('2d'),
      elS = host.querySelector('[data-r="sl"]'),
      elP = host.querySelector('[data-r="pv"]'),
      elL = host.querySelector('[data-r="live"]'),
      elC = host.querySelector('[data-r="chk"]'),
      elN = host.querySelector('[data-r="cnt"]');

  var W = 0, H = 0, dpr = window.devicePixelRatio || 1, tm = 0, last = 0;
  var PA = [], PB = [], i;
  for (i = 0; i < 16; i++){ PA.push({ ph:rng() * 6.283 }); PB.push({ ph:rng() * 6.283 }); }

  function syncSlider(){
    elS.min = LO; elS.max = HI; elS.step = 1; elS.value = pred;
    elP.textContent = pred + ' °C';
  }

  function fit(){
    var r = cv.getBoundingClientRect();
    if (!r.width) return false;
    var w = Math.round(r.width), h = Math.round(r.height);
    if (w !== W || h !== H){ W = w; H = h; cv.width = w * dpr; cv.height = h * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
    return true;
  }

  function sx(tv){ return 30 + (tv - LO) / (HI - LO) * (W - 60); }

  function block(x, y, w, h, tv, other, label){
    var hot = tv > other + 0.4, eq = Math.abs(tv - other) <= 0.4;
    ctx.strokeStyle = eq ? cssv('--gold') : (hot ? cssv('--bad') : cssv('--green'));
    ctx.lineWidth = 2.4;
    ctx.strokeRect(x, y, w, h);
    ctx.fillStyle = ctx.strokeStyle;
    var amp = 0.6 + (tv - LO) / (HI - LO) * 3.2, k;
    for (k = 0; k < 16; k++){
      var p = (label === 'A' ? PA : PB)[k];
      var bx = x + 14 + (k % 4) * ((w - 28) / 3) + Math.sin(tm * (2 + amp) + p.ph) * amp;
      var by = y + 14 + Math.floor(k / 4) * ((h - 28) / 3) + Math.cos(tm * (1.8 + amp) + p.ph) * amp;
      ctx.beginPath(); ctx.arc(bx, by, 3.6, 0, 6.2832); ctx.fill();
    }
    ctx.font = '11px "IBM Plex Mono", monospace';
    ctx.textAlign = 'center';
    ctx.fillText(label + ': ' + Math.round(tv) + ' °C', x + w / 2, y - 6);
    ctx.textAlign = 'left';
  }

  function render(){
    if (!fit()) return;
    ctx.clearRect(0, 0, W, H);
    var bw = Math.min((W - 70) / 2, 118), bh = H - 100, y = 26;
    var x1 = W / 2 - bw - 6, x2 = W / 2 + 6;
    block(x1, y, bw, bh, curA, curB, 'A');
    block(x2, y, bw, bh, curB, curA, 'B');
    if (mixing){
      ctx.strokeStyle = cssv('--gold'); ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(W / 2, y + 8); ctx.lineTo(W / 2, y + bh - 8); ctx.stroke();
    }
    var ly = H - 40;
    ctx.strokeStyle = cssv('--border'); ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(30, ly); ctx.lineTo(W - 30, ly); ctx.stroke();
    ctx.font = '9px "IBM Plex Mono", monospace';
    ctx.textAlign = 'center';
    [[curB, 'B'], [curA, 'A']].forEach(function(m){
      var X = sx(m[0]);
      ctx.fillStyle = cssv('--text3');
      ctx.beginPath(); ctx.arc(X, ly, 3.4, 0, 6.2832); ctx.fill();
      ctx.fillText(m[1], X, ly + 13);
    });
    var pxp = sx(pred);
    ctx.fillStyle = cssv('--gold');
    ctx.beginPath();
    ctx.moveTo(pxp, ly - 5); ctx.lineTo(pxp - 6, ly - 15); ctx.lineTo(pxp + 6, ly - 15);
    ctx.closePath(); ctx.fill();
    ctx.fillText(pred + ' °C', pxp, ly - 19);
    ctx.textAlign = 'left';
  }

  function frame(ts){
    if (!document.body.contains(host)) return;
    if (!last) last = ts;
    var dt = Math.min(45, ts - last); last = ts; tm += dt / 1000;
    if (mixing){
      var mid = (TA + TB) / 2;
      curA += (mid - curA) * Math.min(1, dt / 620);
      curB += (mid - curB) * Math.min(1, dt / 620);
    }
    render();
    requestAnimationFrame(frame);
  }

  function liveTxt(){
    var m;
    if (pred >= TA) m = { es:'Tu marcador está en la temperatura del bloque caliente o por encima de ella.', en:'Your marker is at the hot block temperature or above it.' };
    else if (pred <= TB) m = { es:'Tu marcador está en la temperatura del bloque frío o por debajo de ella.', en:'Your marker is at the cold block temperature or below it.' };
    else m = { es:'Tu marcador está entre los dos bloques: A tendría que bajar y B tendría que subir para llegar ahí.', en:'Your marker is between the two blocks: A would have to come down and B would have to come up to reach it.' };
    elL.innerHTML = L(m);
  }

  function advance(){
    rd++;
    if (rd >= 3){
      done = true;
      elC.textContent = L({ es:'Completado', en:'Completed' });
      elC.className = 'gw-btn solved';
      elN.textContent = '';
      say(host, 'good', L({
        es:'En las tres parejas ocurrió lo mismo: la energía viajó del bloque de mayor temperatura al de menor temperatura y se detuvo cuando los dos marcaron lo mismo. Eso es el equilibrio térmico.',
        en:'The same thing happened with all three pairs: energy travelled from the block at higher temperature to the one at lower temperature and stopped when both read the same. That is thermal equilibrium.'
      }));
      return;
    }
    locked = false; tries = 0;
    newRound(); syncSlider(); liveTxt();
    elC.textContent = L({ es:'Poner en contacto', en:'Put in contact' });
    elC.className = 'gw-btn';
    elN.textContent = L({ es:'pareja ', en:'pair ' }) + (rd + 1) + L({ es:' de 3', en:' of 3' });
    say(host, '', L({ es:'Pareja nueva, con otras temperaturas iniciales. Coloca el marcador antes de ponerlos en contacto.', en:'A new pair, with different starting temperatures. Place the marker before putting them in contact.' }));
  }

  function close(cls, txt){
    locked = true; mixing = true;
    elC.textContent = rd === 2 ? L({ es:'Terminar', en:'Finish' }) : L({ es:'Siguiente pareja', en:'Next pair' });
    elC.className = 'gw-btn solved';
    say(host, cls, txt);
  }

  function check(){
    if (done) return;
    if (locked){ advance(); return; }
    if (pred > TB && pred < TA){
      close('good', L({ es:'Bien colocado. La energía sale del bloque A, que estaba a ', en:'Well placed. Energy leaves block A, which was at ' }) + TA +
        L({ es:' °C, y entra al bloque B, que estaba a ', en:' °C, and enters block B, which was at ' }) + TB +
        L({ es:' °C. El intercambio se detiene cuando los dos marcan lo mismo, y eso solo puede ocurrir en un valor intermedio. Como los bloques son iguales, la temperatura final queda a media distancia.',
            en:' °C. The exchange stops when both read the same, and that can only happen at an intermediate value. Since the blocks are identical, the final temperature lands halfway.' }));
      return;
    }
    tries++;
    if (tries >= 3){
      pred = Math.round((TA + TB) / 2); syncSlider(); liveTxt();
      close('warm', L({ es:'La temperatura final tiene que quedar entre ', en:'The final temperature has to land between ' }) + TB +
        L({ es:' °C y ', en:' °C and ' }) + TA +
        L({ es:' °C, porque A solo puede enfriarse y B solo puede calentarse. Con bloques iguales queda justo a media distancia.',
            en:' °C, because A can only cool down and B can only warm up. With identical blocks it lands exactly halfway.' }));
      return;
    }
    var msg;
    if (pred >= TA){
      msg = L({ es:'Ningún bloque puede terminar más caliente que el más caliente al inicio: A solo puede ceder energía, nunca ganarla. Baja el marcador.',
                en:'Neither block can end up hotter than the hottest one at the start: A can only give up energy, never gain it. Lower the marker.' });
    } else {
      msg = L({ es:'Ningún bloque puede terminar más frío que el más frío al inicio: B solo puede recibir energía, nunca perderla. Sube el marcador.',
                en:'Neither block can end up colder than the coldest one at the start: B can only receive energy, never lose it. Raise the marker.' });
    }
    say(host, 'miss', msg);
  }

  elS.addEventListener('input', function(){
    if (done || locked){ elS.value = pred; return; }
    pred = parseInt(elS.value, 10);
    elP.textContent = pred + ' °C';
    liveTxt();
  });
  elC.addEventListener('click', check);

  syncSlider(); liveTxt();
  elN.textContent = L({ es:'pareja 1 de 3', en:'pair 1 of 3' });
  say(host, '', L({
    es:'Mueve el marcador de lado a lado: el texto te dice al instante qué tendría que pasarle a cada bloque para llegar hasta ahí.',
    en:'Move the marker from side to side: the text tells you at once what would have to happen to each block to get there.'
  }));
  requestAnimationFrame(frame);
}


/* ══════════════════════════════════════════════════════════════════════════
   PROBLEMAS GRADUADOS  ::  10 slots, cada uno con su pool de variantes
   (Rule 4: texto, estructura y respuesta correcta definidos por variante)
   ══════════════════════════════════════════════════════════════════════════ */
function build(rng, title, pool){
  var v = pk(rng, pool);
  return {
    title: L(title),
    q: L(v.q),
    hint: L(v.hint),
    exp: L(v.exp),
    options: v.options.map(function(o){ return L(o); }),
    correct: v.correct
  };
}

/* ── 1 ── modelo de partículas: qué cambia al cambiar de estado ── */
function mkP1(rng){
  return build(rng, { es:'Lo que cambia y lo que no', en:'What changes and what does not' }, [
    {
      q:{ es:'Un frasco cerrado guarda una pequeña cantidad de alcohol líquido. Se calienta con cuidado hasta que todo el alcohol se vuelve vapor y el frasco sigue cerrado. ¿Qué explicación del modelo de partículas corresponde a lo que ocurrió adentro?',
          en:'A closed jar holds a small amount of liquid alcohol. It is carefully warmed until all the alcohol becomes vapour and the jar stays closed. Which particle model explanation matches what happened inside?' },
      options:[
        { es:'Las mismas partículas se separaron y ahora se mueven más rápido, sin cambiar de número ni de tamaño', en:'The same particles separated and now move faster, without changing in number or in size' },
        { es:'Cada partícula creció al recibir energía y por eso el material ocupa más espacio que antes', en:'Each particle grew when it received energy and that is why the material takes up more space than before' },
        { es:'Aparecieron partículas nuevas de vapor que no existían mientras el alcohol era líquido', en:'New vapour particles appeared that did not exist while the alcohol was liquid' },
        { es:'Las partículas se rompieron en pedazos más pequeños que se repartieron por todo el frasco', en:'The particles broke into smaller pieces that spread through the whole jar' }
      ],
      correct:0,
      hint:{ es:'El modelo de partículas afirma tres cosas: cuántas partículas hay, cuánto espacio queda entre ellas y qué tan rápido se mueven. Pregúntate cuáles de esas tres puede modificar la energía que entra.',
             en:'The particle model states three things: how many particles there are, how much space is left between them and how fast they move. Ask yourself which of those three the incoming energy can modify.' },
      exp:{ es:'Un cambio de estado reacomoda a las partículas, no las transforma. En el frasco cerrado siguen siendo las mismas partículas de alcohol y siguen siendo la misma cantidad; lo que cambió fue su rapidez y la distancia entre ellas. Ni crecieron, ni se rompieron, ni aparecieron partículas nuevas.',
            en:'A change of state rearranges the particles, it does not transform them. In the closed jar they are still the same alcohol particles and still the same number; what changed was their speed and the distance between them. They did not grow, break, or appear from nowhere.' }
    },
    {
      q:{ es:'Un cubo de hielo se guarda dentro de una bolsa bien cerrada y se deja sobre la mesa hasta que se derrite por completo. ¿Qué explicación del modelo de partículas corresponde a lo que ocurrió dentro de la bolsa?',
          en:'An ice cube is put inside a tightly closed bag and left on the table until it melts completely. Which particle model explanation matches what happened inside the bag?' },
      options:[
        { es:'Las mismas partículas dejaron sus posiciones fijas y ahora resbalan unas sobre otras', en:'The same particles left their fixed positions and now slide over one another' },
        { es:'Las partículas del hielo se rompieron para formar las partículas del agua líquida', en:'The ice particles broke apart to form the liquid water particles' },
        { es:'Las partículas se hicieron más pequeñas y por eso el bloque perdió sus esquinas', en:'The particles became smaller and that is why the block lost its corners' },
        { es:'Una parte de las partículas desapareció y por eso el material dejó de ser rígido', en:'Some of the particles disappeared and that is why the material stopped being rigid' }
      ],
      correct:0,
      hint:{ es:'La bolsa está cerrada, así que nada entró ni salió. Piensa en qué es lo único que la energía recibida puede cambiar en un conjunto de partículas.',
             en:'The bag is closed, so nothing came in or went out. Think about the only thing the energy received can change in a set of particles.' },
      exp:{ es:'El hielo y el agua líquida están hechos de las mismas partículas, en la misma cantidad. Al recibir energía esas partículas vibraron con más fuerza hasta abandonar sus posiciones fijas y empezar a deslizarse, que es justo lo que hace un líquido. Ninguna partícula se rompió, encogió ni desapareció.',
            en:'Ice and liquid water are made of the same particles, in the same number. On receiving energy those particles vibrated harder until they left their fixed positions and started to slide, which is exactly what a liquid does. No particle broke, shrank or disappeared.' }
    }
  ]);
}

/* ── 2 ── movimiento continuo de las partículas ── */
function mkP2(rng){
  return build(rng, { es:'Partículas siempre en movimiento', en:'Particles always on the move' }, [
    {
      q:{ es:'Se destapa un frasco de perfume en una esquina del salón. Al cabo de un rato el olor se percibe en el extremo opuesto, aunque nadie abrió ventanas ni encendió un ventilador. ¿Qué parte del modelo de partículas explica esta observación?',
          en:'A perfume bottle is opened in one corner of the classroom. After a while the smell is noticed at the opposite end, although nobody opened windows or switched on a fan. Which part of the particle model explains this observation?' },
      options:[
        { es:'Las partículas del perfume se mueven por sí solas en todas direcciones y avanzan por los espacios que hay entre las partículas del aire', en:'The perfume particles move on their own in all directions and travel through the spaces between the air particles' },
        { es:'Las partículas del perfume permanecen quietas y son las del aire las que las arrastran hasta el otro extremo', en:'The perfume particles stay still and it is the air particles that drag them to the other end' },
        { es:'El olor viaja como una onda sin que ninguna partícula del perfume salga del frasco', en:'The smell travels as a wave without any perfume particle leaving the bottle' },
        { es:'Las partículas del perfume se hunden hasta el piso y desde ahí recorren el salón sin mezclarse con el aire', en:'The perfume particles sink to the floor and from there cross the room without mixing with the air' }
      ],
      correct:0,
      hint:{ es:'El modelo sostiene que las partículas nunca están quietas y que en un gas quedan grandes espacios vacíos entre ellas. Junta las dos ideas.',
             en:'The model holds that particles are never still and that in a gas there are large empty spaces between them. Put the two ideas together.' },
      exp:{ es:'En un gas las partículas se mueven sin parar, en todas direcciones y con grandes espacios entre ellas. Las partículas de perfume que salen del frasco recorren esos espacios y poco a poco llegan a todos los rincones del salón. No hace falta viento: el movimiento propio de las partículas basta.',
            en:'In a gas the particles move without stopping, in all directions and with large spaces between them. The perfume particles leaving the bottle travel through those spaces and gradually reach every corner of the room. No wind is needed: the particles own movement is enough.' }

        { es:'El agua líquida que se convierte en hielo dentro del congelador', en:'Liquid water turning into ice inside the freezer' },

            en:'In the first case the particles go from fixed positions to being far apart, and to achieve that they need more movement than they had: the material receives energy. In the other three the particles come closer, so the material hands energy to the surroundings.' }

      exp:{ es:'La cuchara estaba a mayor temperatura, así que sus partículas se movían más rápido y en los choques de la frontera le entregaron movimiento a las del agua. La cuchara se enfrió y el agua se calentó, hasta que las partículas de ambas quedaron con la misma rapidez promedio. Lo que se intercambia es energía, no partículas ni frío.',

<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbykkuJ_apGq3vALIFd4mr3acu81c7K4OKxW-DZ-i52Ceyl3lOanXMdvbS9SIXPrLQBm/exec';

  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
