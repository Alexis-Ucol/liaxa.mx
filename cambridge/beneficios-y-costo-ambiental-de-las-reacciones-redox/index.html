<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beneficios y Costo Ambiental de las Reacciones Redox</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Beneficios y Costo Ambiental de las Reacciones Redox</div>
    <div class="wcourse" id="wcourse-el">Química · 3° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Beneficios y Costo Ambiental de las Reacciones Redox</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="sbtn" id="dlBtn" onclick="generatePDF()" style="max-width:280px;margin:0 auto;">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   CENTRALIZED SCHOOL CONFIG (Rule 16) — ships UNBRANDED (Rule 11).
   The ONLY rebranding point. build_all.py substitutes these exact fields
   (BRAND_FIELDS / RGB_FIELDS / logo*) downstream; :root/dark stay as fallback.
   Neutral defaults below == the static :root/dark values, so unbranded == no-op.
   ══════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:'#c0202a', primaryDark:'#490a0e', primaryBg:'#f6e7e8',
  accent:'#f5c800', accentBg:'#fff8db',
  darkPrimary:'#c94049', darkPrimaryDark:'#e97179', darkPrimaryBg:'#3b0a0e',

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);

  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');

}

async function generatePDF() {
  var btn = document.getElementById('dlBtn');
  btn.textContent = 'Generando PDF…';
  btn.disabled = true;

  var jspdf   = window.jspdf;
  var doc     = new jspdf.jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });
  var PW      = 215.9;
  var M       = 18;
  var TW      = PW - M * 2;
  var PH      = doc.internal.pageSize.height;
  var name    = studentData.name;
  var group   = studentData.group;
  var total   = problems.length;
  var pct     = Math.round(correctCount / total * 100);
  var dateStr = new Date().toLocaleString('es-MX', { dateStyle:'long', timeStyle:'short' });

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS — INJECTION BLOCK ─────────────────────────────────────────
  //   Match these RGB values to --green and --gold above.
  //   PRIMARY  → pBR, pBG, pBB
  //   ACCENT   → pAR, pAG, pAB
  // ──────────────────────────────────────────────────────────────────────────
  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;  // PRIMARY (from SCHOOL, Rule 16)
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;   // ACCENT (from SCHOOL, Rule 16)

  function pdfText(html) {
    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/\u2192/g,'->').replace(/\u2212/g,'-').replace(/\u00b2/g,'^2')

/* ══════════════════════════════════════════════════════════════════════════
   GUIA :: qui3_t12_g02 - Beneficios y costo ambiental de las reacciones redox
   El estudiante reconoce reacciones redox en procesos que usa a diario, sigue
   la transferencia de electrones, asigna números de oxidación para detectarla,
   cuantifica el costo de la corrosión, de las pilas y de las combustiones, y
   construye una postura argumentada a favor de la sustentabilidad.
   Bilingüe (Rule 10), variantes por semilla (Rule 4), manipulativos marcados
   con data-widget (Part 0).
   ══════════════════════════════════════════════════════════════════════════ */
function L(o){ return (o && o[LANG] !== undefined) ? o[LANG] : (o ? o.es : ''); }
function vpick(rng, list){ return list[Math.floor(rng() * list.length)]; }
function permOf(n, rng){
  var a = [], i;
  for (i = 0; i < n; i++) a.push(i);
  for (i = a.length - 1; i > 0; i--){ var j = Math.floor(rng() * (i + 1)); var tmp = a[i]; a[i] = a[j]; a[j] = tmp; }
  return a;
}
function nf(x){
  var r = Math.round(x * 100) / 100;
  return String(r);
}
function sgn(n){ return n > 0 ? '+' + n : (n < 0 ? '−' + Math.abs(n) : '0'); }

function rcard(name, form, note){
  return '<div class="rcard"><div class="rname">' + name + '</div><div class="rform">' + form + '</div><div class="rnote">' + note + '</div></div>';
}

function sec(tag, title, html){
  var d = document.createElement('div');
  d.className = 'section';
  d.innerHTML = '<div class="stag">' + tag + '</div><h2>' + title + '</h2>' + html;
  document.getElementById('lessonBody').appendChild(d);
  return d;
}

function widgetHost(parent, id, kind){
  var d = document.createElement('div');
  d.className = 'gw section';
  d.id = id;
  d.setAttribute('data-widget', kind);
  (parent || document.getElementById('lessonBody')).appendChild(d);
  return d;
}

function addProblem(rng, v){
  var idx = problems.length;
  var opts = L(v.opts).slice();
  var correctVal = opts[v.ci];
  var sh = shuffle(opts, rng);
  var prob = {
    title: L(v.title),
    questionText: L(v.q),
    fn: v.fn ? L(v.fn) : '',
    hint: L(v.hint),
    explanation: L(v.exp),
    options: sh,
    correctIdx: sh.indexOf(correctVal),
    showWork: !!v.showWork,
    studentChoice: null,
    pendingChoice: null
  };
  problems.push(prob);
  buildOneCard(prob, idx);
}

      nudge:{ es:'En la herrumbre el oxígeno del aire recibe electrones. Busca al metal que se los entrega y por eso se deshace.',
              en:'In rust the oxygen of the air receives electrons. Look for the metal that hands them over and falls apart because of it.' } },
    { proc:{ es:'La leña de una fogata arde y calienta la noche', en:'Firewood burns and warms the night' },
      sust:{ es:'el carbono de la madera', en:'the carbon in the wood' },
      nudge:{ es:'Al arder, el oxígeno recibe electrones y la madera se convierte en gases y ceniza. Busca el elemento que forma la madera.',
              en:'As it burns, oxygen receives electrons and the wood turns into gases and ash. Look for the element that makes up the wood.' } },
    { proc:{ es:'Una cuchara de cobre queda plateada en una disolución', en:'A copper spoon turns silvery inside a solution' },
      sust:{ es:'el cobre de la cuchara', en:'the copper of the spoon' },
      nudge:{ es:'La plata aparece como sólido porque alguien le dio electrones. Ese alguien es el metal que estaba antes en la cuchara.',
              en:'Silver appears as a solid because someone gave it electrons. That someone is the metal that was in the spoon before.' } }
  ];
  var order = permOf(PAIRS.length, rng);
  var st = { sel:null, link:{}, tries:{}, solved:0, done:false };

  function used(si){
    for (var k in st.link) if (st.link[k] === si) return true;
    return false;
  }
  function render(){
    var left = PAIRS.map(function(p, i){
      var linked = st.link[i] !== undefined;
      var cls = 'mt-chip' + (st.sel === i ? ' sel' : '') + (linked ? ' ok' : '');
      return '<button class="' + cls + '" data-act="l" data-i="' + i + '">' + L(p.proc) +
        (linked ? '<span class="mt-tag">→ ' + L(PAIRS[st.link[i]].sust) + '</span>' : '') + '</button>';
    }).join('');
    var right = order.map(function(si, pos){
      var cls = 'mt-chip' + (used(si) ? ' used' : '');
      return '<button class="' + cls + '" data-act="r" data-i="' + si + '">' + L(PAIRS[si].sust) + '</button>';
    }).join('');
    host.innerHTML =
      '<div class="gw-h">' + L({ es:'Rastro del electrón', en:'Trail of the electron' }) + '</div>' +
      '<div class="gw-sub">' + L({ es:'Toca un proceso y después la sustancia que entrega los electrones en él. Si te equivocas, la unión no se hace y puedes intentar otra vez; toca un proceso ya unido para deshacerlo.',
                                   en:'Tap a process and then the substance that hands over the electrons in it. If you miss, the link is not made and you can try again; tap a linked process to undo it.' }) + '</div>' +
      '<div class="mt-cols"><div class="mt-col">' + left + '</div><div class="mt-col">' + right + '</div></div>' +
      '<div class="gw-prog">' + st.solved + ' / ' + PAIRS.length + '</div>' +
      '<div class="gw-fb" id="ras_fb">' + L({ es:'Cada uno de estos cuatro procesos te da algo útil, y en los cuatro alguien se queda sin electrones.',
                                              en:'Each of these four processes gives you something useful, and in all four somebody ends up without electrons.' }) + '</div>';
  }
  function say(cls, txt){
    var fb = document.getElementById('ras_fb');
    fb.className = 'gw-fb ' + cls;
    fb.innerHTML = txt;
  }
  render();

  host.addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!b || st.done) return;
    var act = b.getAttribute('data-act');
    var i = parseInt(b.getAttribute('data-i'), 10);
    if (act === 'l'){
      if (st.link[i] !== undefined){
        delete st.link[i]; st.solved--; st.sel = null; render();
        say('', L({ es:'Unión deshecha. Puedes volver a intentarlo con otra sustancia.', en:'Link undone. You can try again with another substance.' }));
        return;
      }
      st.sel = (st.sel === i) ? null : i;
      render();
      if (st.sel !== null) say('', L({ es:'Ahora toca la sustancia que se queda sin electrones en ese proceso.', en:'Now tap the substance that ends up without electrons in that process.' }));
      return;
    }
    if (used(i)) return;
    if (st.sel === null){ say('warm', L({ es:'Primero elige un proceso de la columna izquierda.', en:'First choose a process from the left column.' })); return; }
    var li = st.sel;
    if (i === li){
      st.link[li] = i; st.solved++; st.sel = null; render();
      if (st.solved === PAIRS.length){
        st.done = true;
        say('good', '🎉 ' + L({ es:'Los cuatro procesos quedaron unidos. Fíjate en el patrón: en todo lo que te resulta útil hay una sustancia que se oxida entregando electrones y otra que se reduce al recibirlos.',
                                en:'All four processes are linked. Notice the pattern: in everything useful to you there is a substance that is oxidized by handing over electrons and another that is reduced by receiving them.' }));
      } else {
        say('good', '✓ ' + L({ es:'Correcto. Esa sustancia se oxida: pierde electrones y por eso cambia o desaparece.',
                               en:'Correct. That substance is oxidized: it loses electrons and that is why it changes or disappears.' }));
      }
      return;
    }
    st.tries[li] = (st.tries[li] || 0) + 1;
    if (st.tries[li] >= 3){
      st.link[li] = li; st.solved++; st.sel = null; render();
      say('warm', L({ es:'En ese proceso quien entrega los electrones es ', en:'In that process the one handing over the electrons is ' }) +
        '<b>' + L(PAIRS[li].sust) + '</b>. ' + L(PAIRS[li].nudge));
      if (st.solved === PAIRS.length) st.done = true;
      return;
    }
    st.sel = li;
    render();
    say('miss', L({ es:'Esa sustancia no es la que suelta los electrones ahí. ', en:'That substance is not the one releasing electrons there. ' }) + L(PAIRS[li].nudge));
  });
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 2 :: Marcador de oxidación (oxnum)
   Ajusta el número de oxidación hasta que la cuenta del compuesto cierre.
   ══════════════════════════════════════════════════════════════════════════ */
function wNumOx(rng, host){
  var POOL = [
    { f:'Fe<sub>2</sub>O<sub>3</sub>', el:'Fe', n:2, o:3, ans:3,
      ctx:{ es:'la herrumbre que se come una reja', en:'the rust that eats a railing' } },
    { f:'MnO<sub>2</sub>', el:'Mn', n:1, o:2, ans:4,
      ctx:{ es:'el polvo negro del interior de una pila seca', en:'the black powder inside a dry cell' } },
    { f:'SO<sub>2</sub>', el:'S', n:1, o:2, ans:4,
      ctx:{ es:'uno de los gases que salen al quemar carbón', en:'one of the gases released when coal is burned' } },
    { f:'Al<sub>2</sub>O<sub>3</sub>', el:'Al', n:2, o:3, ans:3,
      ctx:{ es:'el mineral del que se saca el aluminio de las latas', en:'the mineral the aluminium of cans is taken from' } },
    { f:'PbO<sub>2</sub>', el:'Pb', n:1, o:2, ans:4,
      ctx:{ es:'una de las placas de la batería de un auto', en:'one of the plates of a car battery' } },
    { f:'N<sub>2</sub>O<sub>5</sub>', el:'N', n:2, o:5, ans:5,
      ctx:{ es:'un óxido que participa en la lluvia ácida', en:'an oxide involved in acid rain' } }
  ];
  var seq = permOf(POOL.length, rng).slice(0, 3);
  var st = { r:0, val:0, tries:0, done:false, locked:false };
  function cur(){ return POOL[seq[st.r]]; }
  function total(){ var c = cur(); return c.n * st.val + c.o * (-2); }
  function render(){
    if (st.done){
      host.innerHTML =
        '<div class="gw-h">' + L({ es:'Marcador de oxidación', en:'Oxidation marker' }) + '</div>' +
        '<div class="gw-fb good">🎉 ' + L({ es:'Tres compuestos etiquetados. Este marcador es el que te va a permitir decidir, en cualquier proceso, quién subió y quién bajó.',
                                            en:'Three compounds labelled. This marker is what will let you decide, in any process, who went up and who went down.' }) + '</div>';
      return;
    }
    var c = cur();
    host.innerHTML =
      '<div class="gw-h">' + L({ es:'Marcador de oxidación', en:'Oxidation marker' }) + '</div>' +
      '<div class="gw-sub">' + L({ es:'Mueve el valor del elemento marcado hasta que la cuenta del compuesto cierre en cero, y comprueba.',
                                   en:'Move the value of the marked element until the count of the compound closes at zero, then check.' }) + '</div>' +
      '<div class="ox-form">' + c.f + '</div>' +
      '<div class="ox-ctx">' + L(c.ctx) + '</div>' +
      '<div class="ox-read"><span>' + c.el + ' × ' + c.n + '</span><span>O × ' + c.o + ' = −2 ' + L({ es:'cada uno', en:'each' }) + '</span></div>' +
      '<div class="ox-ctl">' +
        '<button class="ox-step" data-act="dn">−</button>' +
        '<div class="ox-val" id="ox_val">' + sgn(st.val) + '</div>' +
        '<button class="ox-step" data-act="up">+</button>' +
      '</div>' +
      '<div class="ox-sum" id="ox_sum"></div>' +
      '<div class="gw-row"><button class="gw-btn go" data-act="chk">' + L({ es:'Comprobar', en:'Check' }) + '</button>' +
        '<span class="gw-prog">' + (st.r + 1) + ' / 3</span></div>' +
      '<div class="gw-fb" id="ox_fb">' + L({ es:'El oxígeno ya trae su etiqueta fija. Falta la del otro elemento.', en:'Oxygen already carries its fixed label. The other element is missing its own.' }) + '</div>';
    paint();
  }
  function paint(){
    var s = total();
    var v = document.getElementById('ox_val');
    var sm = document.getElementById('ox_sum');
    if (!v || !sm) return;
    v.textContent = sgn(st.val);
    sm.textContent = L({ es:'Suma del compuesto: ', en:'Compound total: ' }) + sgn(s) + '  ' + L({ es:'(debe cerrar en 0)', en:'(must close at 0)' });
    sm.className = 'ox-sum' + (s === 0 ? ' hit' : '');
  }
  function say(cls, txt){
    var fb = document.getElementById('ox_fb');
    if (!fb) return;
    fb.className = 'gw-fb ' + cls;
    fb.innerHTML = txt;
  }
  render();

  host.addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!b || st.done || st.locked) return;
    var act = b.getAttribute('data-act');
    if (act === 'up'){ if (st.val < 7) st.val++; paint(); return; }
    if (act === 'dn'){ if (st.val > -4) st.val--; paint(); return; }
    if (act !== 'chk') return;
    var c = cur();
    if (st.val === c.ans){
      say('good', '✓ ' + L({ es:'La cuenta cierra: en ' , en:'The count closes: in ' }) + c.f + L({ es:' cada átomo de ' , en:' each atom of ' }) + c.el + L({ es:' vale ', en:' is worth ' }) + sgn(c.ans) + '.');
      advance();
      return;
    }
    st.tries++;
    if (st.tries >= 3){
      st.val = c.ans; paint();
      say('warm', L({ es:'El valor era ', en:'The value was ' }) + '<b>' + sgn(c.ans) + '</b>. ' +
        L({ es:'Los ' + c.o + ' oxígenos aportan ' + sgn(-2 * c.o) + ', así que ' + (c.n === 1 ? 'el átomo' : 'los ' + c.n + ' átomos') + ' de ' + c.el + ' deben aportar ' + sgn(2 * c.o) + ' en total.',
             en:'The ' + c.o + ' oxygens contribute ' + sgn(-2 * c.o) + ', so ' + (c.n === 1 ? 'the atom' : 'the ' + c.n + ' atoms') + ' of ' + c.el + ' must contribute ' + sgn(2 * c.o) + ' in total.' }));
      advance();
      return;
    }
    var s = total();
    say('miss', s < 0
      ? L({ es:'Todavía no. La suma va en ' + sgn(s) + ': el valor de ' + c.el + ' está demasiado abajo, súbelo.',
            en:'Not yet. The total is at ' + sgn(s) + ': the value of ' + c.el + ' is too low, raise it.' })
      : L({ es:'Todavía no. La suma va en ' + sgn(s) + ': el valor de ' + c.el + ' está demasiado arriba, bájalo.',
            en:'Not yet. The total is at ' + sgn(s) + ': the value of ' + c.el + ' is too high, lower it.' }));
  });

  function advance(){
    st.locked = true;
    setTimeout(function(){
      st.locked = false; st.tries = 0; st.val = 0; st.r++;
      if (st.r >= seq.length) st.done = true;
      render();
    }, 1500);
  }
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 3 :: Laboratorio de corrosión (slider)
   Cambia ambiente y protección y mira la pérdida anual de hierro en vivo.
   ══════════════════════════════════════════════════════════════════════════ */
function wCorros(rng, host){
  var META = 10;
  var PROT = [
    { es:'Sin recubrimiento', en:'No coating', f:1 },
    { es:'Pintura', en:'Paint', f:0.35 },
    { es:'Capa de zinc', en:'Zinc coating', f:0.12 }
  ];
  var st = { hum: 40 + Math.floor(rng() * 3) * 20, sal: 20 + Math.floor(rng() * 3) * 20, prot: 0, hit: false };
  function loss(){
    var raw = 40 * (0.4 + st.hum / 100 + 1.2 * st.sal / 100) * PROT[st.prot].f;
    return Math.round(raw * 10) / 10;
  }
  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Laboratorio de corrosión', en:'Corrosion lab' }) + '</div>' +
    '<div class="gw-sub">' + L({ es:'Una reja de hierro de la escuela pierde metal cada año. Prueba ambientes y recubrimientos hasta bajar la pérdida a 10 g al año o menos.',
                                 en:'An iron railing at school loses metal every year. Try environments and coatings until you bring the loss down to 10 g per year or less.' }) + '</div>' +
    '<div class="cor-grid">' +
      '<div><div class="cor-lab"><span>' + L({ es:'Humedad del aire', en:'Air humidity' }) + '</span><b id="cor_hv"></b></div>' +
        '<input class="cor-sl" id="cor_hum" type="range" min="0" max="100" step="10" value="' + st.hum + '"></div>' +
      '<div><div class="cor-lab"><span>' + L({ es:'Sal en el ambiente', en:'Salt in the environment' }) + '</span><b id="cor_sv"></b></div>' +
        '<input class="cor-sl" id="cor_sal" type="range" min="0" max="100" step="10" value="' + st.sal + '"></div>' +
    '</div>' +
    '<div class="gw-lbl">' + L({ es:'Recubrimiento', en:'Coating' }) + '</div>' +
    '<div class="gw-row">' + PROT.map(function(p, i){
      return '<button class="gw-btn" data-p="' + i + '">' + L(p) + '</button>';
    }).join('') + '</div>' +
    '<div class="cor-out" id="cor_out"></div>' +
    '<div class="cor-bar"><div class="cor-fill" id="cor_fill"></div></div>' +
    '<div class="cor-goal">' + L({ es:'meta: 10 g al año', en:'target: 10 g per year' }) + '</div>' +
    '<div class="gw-fb" id="cor_fb"></div>';

  function paint(){
    var v = loss();
    document.getElementById('cor_hv').textContent = st.hum + '%';
    document.getElementById('cor_sv').textContent = st.sal + '%';
    document.getElementById('cor_out').textContent = nf(v) + ' g ' + L({ es:'al año', en:'per year' });
    var fill = document.getElementById('cor_fill');
    fill.style.width = Math.min(100, Math.round(v / 104 * 100)) + '%';
    fill.className = 'cor-fill' + (v <= META ? ' good' : '');
    host.querySelectorAll('[data-p]').forEach(function(b){
      b.classList.toggle('on', parseInt(b.getAttribute('data-p'), 10) === st.prot);
    });
    var fb = document.getElementById('cor_fb');
    if (v <= META){
      st.hit = true;
      fb.className = 'gw-fb good';
      fb.innerHTML = '🎉 ' + L({ es:'A ' + nf(v) + ' g al año la reja aguanta muchos años sin reponerse. El recubrimiento funciona porque impide que el agua y el oxígeno lleguen al hierro, y la capa de zinc además se oxida antes que él.',
                                 en:'At ' + nf(v) + ' g per year the railing lasts many years without being replaced. The coating works because it keeps water and oxygen away from the iron, and the zinc layer is also oxidized before the iron is.' });
    } else if (st.prot === 0){
      fb.className = 'gw-fb miss';
      fb.innerHTML = L({ es:'Vas en ' + nf(v) + ' g al año, muy por arriba de la meta. Con el hierro desnudo el oxígeno le arranca electrones sin obstáculo: prueba una barrera.',
                         en:'You are at ' + nf(v) + ' g per year, well above the target. With bare iron, oxygen pulls electrons away with no obstacle: try a barrier.' });
    } else {
      fb.className = 'gw-fb warm';
      fb.innerHTML = L({ es:'Vas en ' + nf(v) + ' g al año, todavía por arriba de la meta. Te faltan ' + nf(Math.round((v - META) * 10) / 10) + ' g: prueba un recubrimiento más resistente o un ambiente menos húmedo y con menos sal.',
                         en:'You are at ' + nf(v) + ' g per year, still above the target. You are ' + nf(Math.round((v - META) * 10) / 10) + ' g away: try a tougher coating or an environment with less humidity and less salt.' });
    }
  }
  paint();

  host.addEventListener('input', function(e){
    if (e.target.id === 'cor_hum') st.hum = parseInt(e.target.value, 10);
    else if (e.target.id === 'cor_sal') st.sal = parseInt(e.target.value, 10);
    else return;
    paint();
  });
  host.addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('[data-p]') : null;
    if (!b) return;
    st.prot = parseInt(b.getAttribute('data-p'), 10);
    paint();
  });
}

/* ══════════════════════════════════════════════════════════════════════════

  ];

    { es:'Los metales de una pila rota en el tiradero pasan al suelo y al agua', en:'The metals of a broken battery in a dump pass into the soil and the water', bin:1,
      why:{ es:'Es lo que cobra: el daño aparece cuando el producto termina su vida útil.', en:'That is what it charges: the harm appears when the product ends its useful life.' } },

    { es:'La combustión del diésel mueve los camiones que traen alimentos a la ciudad', en:'Burning diesel moves the trucks that bring food into the city', bin:0,
      why:{ es:'Es lo que ganas: la entrega de electrones al oxígeno libera la energía que mueve el motor.', en:'That is what you gain: handing electrons to oxygen releases the energy that moves the engine.' } },
    { es:'Los gases de los motores se quedan en el aire que respira la ciudad', en:'The gases from engines stay in the air the city breathes', bin:1,
      why:{ es:'Es lo que cobra: el mismo proceso que da energía deja productos en el aire.', en:'That is what it charges: the same process that gives energy leaves products in the air.' } },
    { es:'Un taller repara aparatos en vez de tirarlos y comprar otros nuevos', en:'A workshop repairs devices instead of throwing them away and buying new ones', bin:2,
      why:{ es:'No es beneficio ni daño: alarga la vida útil y evita fabricar de nuevo.', en:'It is neither benefit nor harm: it extends useful life and avoids making things again.' } },
    { es:'La corrosión destruye puentes y tuberías que hay que reponer con metal nuevo', en:'Corrosion destroys bridges and pipes that must be replaced with new metal', bin:1,
      why:{ es:'Es lo que cobra: una reacción redox espontánea que nadie pidió.', en:'That is what it charges: a spontaneous redox reaction nobody asked for.' } },
    { es:'Reducir el mineral en un horno entrega el metal de cables y ventanas', en:'Reducing the mineral in a furnace delivers the metal of cables and windows', bin:0,
      why:{ es:'Es lo que ganas: sin esa reducción no habría metales de uso diario.', en:'That is what you gain: without that reduction there would be no everyday metals.' } }
  ];
  var seq = permOf(ITEMS.length, rng).slice(0, 6);
  var st = { i:0, tries:0, correct:0, done:false, locked:false };
  function render(){
    if (st.done){
      host.innerHTML =
        '<div class="gw-h">' + L({ es:'Beneficio, costo o medida', en:'Benefit, cost or measure' }) + '</div>' +
        '<div class="gw-fb good">🎉 ' + L({ es:'Tabla completa: ' + st.correct + ' de ' + seq.length + ' al primer intento. Valorar un proceso es poder poner cada afirmación en su columna sin negar ninguna de las tres.',
                                            en:'Table complete: ' + st.correct + ' out of ' + seq.length + ' on the first try. Weighing up a process means being able to put each statement in its column without denying any of the three.' }) + '</div>';
      return;
    }
    var it = ITEMS[seq[st.i]];
    host.innerHTML =
      '<div class="gw-h">' + L({ es:'Beneficio, costo o medida', en:'Benefit, cost or measure' }) + '</div>' +
      '<div class="gw-sub">' + L({ es:'Decide en qué columna cae cada afirmación sobre los procesos redox que usa tu comunidad.',
                                   en:'Decide which column each statement about the redox processes your community uses falls into.' }) + '</div>' +
      '<div class="gw-prog">' + (st.i + 1) + ' / ' + seq.length + '</div>' +
      '<div class="cl-card">' + L(it) + '</div>' +
      '<div class="cl-bins">' + BINS.map(function(b, bi){
        return '<button class="cl-bin" data-b="' + bi + '">' + L(b) + '</button>';
      }).join('') + '</div>' +
      '<div class="gw-fb" id="cl_fb">' + L({ es:'Pregúntate si esa frase describe algo que ganas, algo que pagas o algo que haces para pagar menos.',
                                             en:'Ask yourself whether that sentence describes something you gain, something you pay or something you do to pay less.' }) + '</div>';
  }
  render();

  host.addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('[data-b]') : null;
    if (!b || st.done || st.locked) return;
    var it = ITEMS[seq[st.i]];
    var bi = parseInt(b.getAttribute('data-b'), 10);
    var fb = document.getElementById('cl_fb');
    if (bi === it.bin){
      if (st.tries === 0) st.correct++;
      fb.className = 'gw-fb good';
      fb.innerHTML = '✓ ' + L(it.why);
      next();
      return;
    }
    st.tries++;
    if (st.tries >= 3){
      fb.className = 'gw-fb warm';
      fb.innerHTML = L({ es:'Iba en ', en:'It belonged in ' }) + '<b>' + L(BINS[it.bin]) + '</b>. ' + L(it.why);
      next();
      return;
    }
    fb.className = 'gw-fb miss';
    fb.innerHTML = bi === 0
      ? L({ es:'Ahí no. ¿Esa frase describe algo que la gente obtiene, o algo que ocurre después y hay que pagar?',

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 5 :: Plan de la escuela (weigh)
   Elige medidas dentro del presupuesto hasta alcanzar la meta de residuo evitado.
   ══════════════════════════════════════════════════════════════════════════ */
function wPlan(rng, host){
  var BUD = 70, META = 85;
  var MEAS = [
    { es:'Contenedor para pilas usadas', en:'Container for used batteries', c:30, k:45 },
    { es:'Galvanizar las rejas del patio', en:'Galvanize the yard railings', c:25, k:30 },
    { es:'Separar el aluminio para reciclarlo', en:'Separate the aluminium for recycling', c:20, k:40 },
    { es:'Cambiar las lámparas por otras de menor consumo', en:'Change the lamps for lower consumption ones', c:35, k:35 },
    { es:'Taller para reparar aparatos', en:'Workshop to repair devices', c:15, k:15 }
  ];
  var order = permOf(MEAS.length, rng);
  var st = { on:{} };
  function totals(){
    var c = 0, k = 0;
    order.forEach(function(mi){ if (st.on[mi]){ c += MEAS[mi].c; k += MEAS[mi].k; } });
    return { c:c, k:k };
  }
  host.innerHTML =
    '<div class="gw-h">' + L({ es:'El plan de tu escuela', en:'Your school plan' }) + '</div>' +
    '<div class="gw-sub">' + L({ es:'Tienes 70 puntos de presupuesto y una meta de 85 kg de residuo evitado al año. Enciende y apaga medidas hasta que las dos cuentas cierren.',
                                 en:'You have 70 budget points and a target of 85 kg of waste avoided per year. Switch measures on and off until both counts close.' }) + '</div>' +
    '<div class="pl-list">' + order.map(function(mi){
      var m = MEAS[mi];
      return '<button class="pl-item" data-m="' + mi + '"><span>' + L(m) + '</span>' +
        '<span class="pl-meta">' + m.c + ' pts · ' + m.k + ' kg</span></button>';
    }).join('') + '</div>' +
    '<div class="pl-bars">' +
      '<div class="pl-num"><span>' + L({ es:'Presupuesto', en:'Budget' }) + '</span><span id="pl_cn"></span></div>' +
      '<div class="pl-bar"><div class="pl-fill" id="pl_cf"></div></div>' +
      '<div class="pl-num"><span>' + L({ es:'Residuo evitado', en:'Waste avoided' }) + '</span><span id="pl_kn"></span></div>' +
      '<div class="pl-bar"><div class="pl-fill" id="pl_kf"></div></div>' +
    '</div>' +
    '<div class="gw-fb" id="pl_fb"></div>';

  function paint(){
    var tt = totals();
    document.getElementById('pl_cn').textContent = tt.c + ' / ' + BUD + ' pts';
    document.getElementById('pl_kn').textContent = tt.k + ' / ' + META + ' kg';
    var cf = document.getElementById('pl_cf'), kf = document.getElementById('pl_kf');
    cf.style.width = Math.min(100, Math.round(tt.c / BUD * 100)) + '%';
    cf.className = 'pl-fill' + (tt.c > BUD ? ' over' : '');
    kf.style.width = Math.min(100, Math.round(tt.k / META * 100)) + '%';
    kf.className = 'pl-fill' + (tt.k >= META ? ' goal' : '');
    host.querySelectorAll('[data-m]').forEach(function(b){
      b.classList.toggle('on', !!st.on[parseInt(b.getAttribute('data-m'), 10)]);
    });
    var fb = document.getElementById('pl_fb');
    if (tt.c > BUD){
      fb.className = 'gw-fb miss';
      fb.innerHTML = L({ es:'Te pasas del presupuesto por ' + (tt.c - BUD) + ' puntos. Apaga una medida cara y busca otra que evite kilos parecidos con menos puntos.',
                         en:'You are ' + (tt.c - BUD) + ' points over budget. Switch off an expensive measure and look for another that avoids similar kilos for fewer points.' });
    } else if (tt.k < META){
      fb.className = 'gw-fb warm';
      fb.innerHTML = L({ es:'Vas en ' + tt.k + ' kg evitados. Te faltan ' + (META - tt.k) + ' kg y te quedan ' + (BUD - tt.c) + ' puntos por usar.',
                         en:'You are at ' + tt.k + ' kg avoided. You need ' + (META - tt.k) + ' kg more and you still have ' + (BUD - tt.c) + ' points to spend.' });
    } else {
      fb.className = 'gw-fb good';
      fb.innerHTML = '🎉 ' + L({ es:'Plan sostenible: ' + tt.k + ' kg evitados con ' + tt.c + ' puntos. Así se ve una postura defendible: no niega el beneficio de los procesos, elige dónde bajar el costo y puede decir cuánto.',
                                 en:'Sustainable plan: ' + tt.k + ' kg avoided with ' + tt.c + ' points. This is what a defensible position looks like: it does not deny the benefit of the processes, it chooses where to lower the cost and it can say how much.' });
    }
  }
  paint();

  host.addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('[data-m]') : null;
    if (!b) return;
    var mi = parseInt(b.getAttribute('data-m'), 10);
    st.on[mi] = !st.on[mi];
    paint();
  });
}

    '<div class="wpanel" id="pos_draw"><div class="cvwrap">' +
      '<canvas class="dcanvas" id="posCv"></canvas>' +

        '<button class="tbtn2 beraser">' + t('btn-eraser') + '</button>' +

  host.addEventListener('click', function(e){

function mkP5(rng){
  var B = [180, 240, 300, 360][Math.floor(rng() * 4)];
  var f = [3, 4, 5][Math.floor(rng() * 3)];
  var y = [2, 3, 4][Math.floor(rng() * 3)];
  var part = { es:{ 3:'la tercera parte', 4:'la cuarta parte', 5:'la quinta parte' }, en:{ 3:'a third', 4:'a quarter', 5:'a fifth' } };
  var prot = B / f;
  var lose = prot * y;
  var saved = (B - prot) * y;
  if (rng() < 0.5){
    return {
      title:{ es:'Reja protegida', en:'Protected railing' },
      q:{ es:'Una reja de hierro sin recubrimiento pierde ' + B + ' g de metal al año por corrosión. Al cubrirla con una capa de zinc, la pérdida anual baja a ' + part.es[f] + '. ¿Cuánto hierro pierde la reja recubierta en ' + y + ' años?',
          en:'An uncoated iron railing loses ' + B + ' g of metal per year to corrosion. When it is covered with a zinc layer, the yearly loss drops to ' + part.en[f] + '. How much iron does the coated railing lose in ' + y + ' years?' },
      opts:{ es:[lose + ' g', (B * y) + ' g', prot + ' g', saved + ' g'],
             en:[lose + ' g', (B * y) + ' g', prot + ' g', saved + ' g'] },
      ci:0,
      hint:{ es:'Obtén primero la pérdida de un solo año con el recubrimiento puesto, y solo después extiéndela a todos los años que pide el problema.',
             en:'First work out the loss of a single year with the coating on, and only then extend it to all the years the problem asks about.' },
      exp:{ es:'Con recubrimiento la reja pierde ' + prot + ' g cada año, y en ' + y + ' años eso da ' + lose + ' g. Los ' + (B * y) + ' g corresponden a la reja desnuda y los ' + prot + ' g a un solo año.',
            en:'With the coating the railing loses ' + prot + ' g each year, and in ' + y + ' years that gives ' + lose + ' g. The ' + (B * y) + ' g belong to the bare railing and the ' + prot + ' g to a single year.' },
      showWork:true };
  }
  return {
    title:{ es:'Hierro que no se pierde', en:'Iron that is not lost' },
    q:{ es:'Una reja de hierro sin recubrimiento pierde ' + B + ' g de metal al año por corrosión. Con una capa de zinc encima, la pérdida anual baja a ' + part.es[f] + '. ¿Cuánto hierro se evita perder en ' + y + ' años gracias al recubrimiento?',
        en:'An uncoated iron railing loses ' + B + ' g of metal per year to corrosion. With a zinc layer on top, the yearly loss drops to ' + part.en[f] + '. How much iron is saved from being lost over ' + y + ' years thanks to the coating?' },
    opts:{ es:[saved + ' g', lose + ' g', (B * y) + ' g', (B - prot) + ' g'],
           en:[saved + ' g', lose + ' g', (B * y) + ' g', (B - prot) + ' g'] },
    ci:0,
    hint:{ es:'Compara lo que se perdería sin protección con lo que se pierde con ella, primero en un año, y después lleva esa diferencia a todos los años.',
           en:'Compare what would be lost without protection with what is lost with it, first over one year, and then carry that difference across all the years.' },
    exp:{ es:'Sin recubrimiento se irían ' + B + ' g al año y con él solo ' + prot + ' g, así que cada año se salvan ' + (B - prot) + ' g. En ' + y + ' años eso suma ' + saved + ' g de hierro que no hubo que reponer.',
          en:'Without the coating ' + B + ' g would go each year and with it only ' + prot + ' g, so ' + (B - prot) + ' g are saved every year. Over ' + y + ' years that adds up to ' + saved + ' g of iron that did not have to be replaced.' },
    showWork:true };
}

function mkP7(rng){
  var a = [14, 15, 16, 18][Math.floor(rng() * 4)];
  var b = 1 + Math.floor(rng() * 3);
  var m = [20, 30, 40, 50][Math.floor(rng() * 4)];
  if (rng() < 0.5){
    var s1 = (a - b) * m;
    return {
      title:{ es:'Energía del reciclaje', en:'Energy of recycling' },
      q:{ es:'Obtener 1 kg de aluminio a partir de su mineral consume ' + a + ' kWh de energía, mientras que obtener 1 kg fundiendo latas ya usadas consume ' + b + ' kWh. Un centro de acopio escolar reúne ' + m + ' kg de latas. ¿Cuánta energía se ahorra al reciclarlas en lugar de sacar esa misma cantidad del mineral?',
          en:'Obtaining 1 kg of aluminium from its mineral uses ' + a + ' kWh of energy, while obtaining 1 kg by melting already used cans uses ' + b + ' kWh. A school collection point gathers ' + m + ' kg of cans. How much energy is saved by recycling them instead of taking the same amount from the mineral?' },
      opts:{ es:[s1 + ' kWh', (a * m) + ' kWh', (b * m) + ' kWh', ((a + b) * m) + ' kWh'],
             en:[s1 + ' kWh', (a * m) + ' kWh', (b * m) + ' kWh', ((a + b) * m) + ' kWh'] },
      ci:0,
      hint:{ es:'El ahorro es la diferencia entre los dos caminos, no el consumo de uno solo. Obtén primero cuánto se ahorra por cada kilogramo.',
             en:'The saving is the difference between the two routes, not the consumption of just one. First work out how much is saved per kilogram.' },
      exp:{ es:'Cada kilogramo reciclado ahorra ' + (a - b) + ' kWh, así que ' + m + ' kg ahorran ' + s1 + ' kWh. Los ' + (a * m) + ' kWh son lo que costaría hacerlo todo desde el mineral, no el ahorro.',
            en:'Each recycled kilogram saves ' + (a - b) + ' kWh, so ' + m + ' kg save ' + s1 + ' kWh. The ' + (a * m) + ' kWh is what doing it all from the mineral would cost, not the saving.' },
      showWork:true };
  }
  var s2 = (a - b) * m * 3;
  return {
    title:{ es:'Ahorro de un trimestre', en:'A term of saving' },
    q:{ es:'Obtener 1 kg de aluminio a partir de su mineral consume ' + a + ' kWh de energía y obtenerlo fundiendo latas usadas consume ' + b + ' kWh. Una escuela recolecta ' + m + ' kg de latas cada mes y las envía a reciclar. ¿Cuánta energía ahorra en 3 meses frente a producir esa misma cantidad desde el mineral?',
        en:'Obtaining 1 kg of aluminium from its mineral uses ' + a + ' kWh of energy and obtaining it by melting used cans uses ' + b + ' kWh. A school collects ' + m + ' kg of cans each month and sends them to be recycled. How much energy does it save in 3 months compared with producing the same amount from the mineral?' },
    opts:{ es:[s2 + ' kWh', ((a - b) * m) + ' kWh', (a * m * 3) + ' kWh', (b * m * 3) + ' kWh'],
           en:[s2 + ' kWh', ((a - b) * m) + ' kWh', (a * m * 3) + ' kWh', (b * m * 3) + ' kWh'] },

    hint:{ es:'Trabaja por partes: primero el ahorro por kilogramo, luego el de un mes y al final el de los tres meses.',

    exp:{ es:'Cada kilogramo ahorra ' + (a - b) + ' kWh, un mes de ' + m + ' kg ahorra ' + ((a - b) * m) + ' kWh y tres meses ahorran ' + s2 + ' kWh. Reciclar no elimina el consumo, lo reduce.',
          en:'Each kilogram saves ' + (a - b) + ' kWh, one month of ' + m + ' kg saves ' + ((a - b) * m) + ' kWh and three months save ' + s2 + ' kWh. Recycling does not remove the consumption, it lowers it.' },
    showWork:true };
}
