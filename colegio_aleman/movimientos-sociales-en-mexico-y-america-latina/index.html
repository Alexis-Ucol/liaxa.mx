    { y:1990, t:['Levantamiento indígena de la CONAIE en Ecuador','Indigenous uprising of CONAIE in Ecuador'] },
    { y:1994, t:['Levantamiento zapatista y demanda de derechos para los pueblos indígenas','Zapatista uprising and demand for Indigenous peoples rights'] },
    { y:2000, t:['Movilización por el agua en Cochabamba, Bolivia','Mobilization for water in Cochabamba, Bolivia'] },
    { y:2001, t:['Reforma constitucional mexicana sobre derechos de los pueblos indígenas','Mexican constitutional reform on Indigenous peoples rights'] },
    { y:2011, t:['Movimiento estudiantil chileno por la educación pública y gratuita','Chilean student movement for free public education'] },
    { y:2019, t:['Reforma mexicana que obliga a repartir por igual las candidaturas entre mujeres y hombres','Mexican reform requiring candidacies to be split equally between women and men'] }
  ];
  var five = shuffle(pool, rng).slice(0,5);
  var sorted = five.slice().sort(function(a,b){ return a.y - b.y; });
  TML = { evs: sorted, cards: shuffle(five, rng), placed:[], tries:0, fin:false, msg:null };
  return '<div class="wgt" id="tmlWgt">' +
    '<div class="wgt-h">' + S('Arma la línea del tiempo','Build the timeline') + '</div>' +
    '<div class="wgt-q">' + S('Toca los hechos del más antiguo al más reciente. El año aparece cuando aciertas.',
                              'Tap the events from the oldest to the most recent. The year appears when you get it right.') + '</div>' +
    '<div id="tmlBody"></div></div>';
}
function tmlRender(){
  var el = document.getElementById('tmlBody'); if (!el || !TML) return;
  var line = TML.placed.map(function(e){
    return '<div class="tslot' + (e.rev ? ' rev' : '') + '"><span class="tyear">' + e.y + '</span>' + L(e.t) + '</div>';
  }).join('');
  if (!line) line = '<div class="wprog">' + L(['La línea está vacía: empieza por el hecho más antiguo.','The line is empty: start with the oldest event.']) + '</div>';
  var cards = TML.cards.map(function(e, i){
    var used = TML.placed.some(function(p){ return p.y === e.y; });
    return '<div class="tcard' + (used ? ' done' : '') + '" onclick="tmlTap(' + i + ')">' + L(e.t) + '</div>';
  }).join('');
  el.innerHTML =
    '<div class="tline">' + line + '</div>' +
    (TML.fin ? '' : '<div class="tcards">' + cards + '</div>') +
    (TML.msg ? '<div class="wmsg ' + TML.msg.cls + '">' + TML.msg.text + '</div>' : '') +
    '<button class="wbtn alt" onclick="tmlReset()">' + L(['Reiniciar','Restart']) + '</button>' +
    '<div class="wprog">' + TML.placed.length + L([' de 5 hechos colocados',' of 5 events placed']) + '</div>';
}
function tmlTap(i){
  if (!TML || TML.fin) return;
  var e = TML.cards[i];
  if (TML.placed.some(function(p){ return p.y === e.y; })) return;
  var next = TML.evs[TML.placed.length];
  if (e.y === next.y) {
    TML.placed.push({ y:e.y, t:e.t, rev:false });
    if (TML.placed.length === TML.evs.length) {
      TML.fin = true;
      TML.msg = { cls:'ok', text: L(['Línea completa. Fíjate en algo: varias demandas aparecen mucho antes que la ley que las reconoce.',
        'Line complete. Notice something: several demands appear long before the law that recognizes them.']) };
    } else {
      TML.msg = { cls:'ok', text: L(['Ese es el siguiente. Sigue buscando el más antiguo de los que quedan.',
        'That is the next one. Keep looking for the oldest of the remaining ones.']) };
    }
  } else {
    TML.tries++;
    if (TML.tries >= 3) {
      TML.placed = TML.evs.map(function(x){ return { y:x.y, t:x.t, rev:true }; });
      TML.fin = true;
      TML.msg = { cls:'warn', text: L(['Esta es la línea completa. Léela de arriba abajo y observa cuánto tarda una demanda en volverse ley.',
        'Here is the full line. Read it from top to bottom and see how long a demand takes to become law.']) };
    } else {
      TML.msg = { cls:'warn', text: (TML.tries === 1
        ? L(['Ese hecho ocurrió después. Entre los que quedan hay uno más antiguo.','That event happened later. Among the remaining ones there is an older one.'])
        : S('Ese hecho ocurrió después. El que sigue sucedió en los años ' + (Math.floor(next.y / 10) * 10) + '.',
            'That event happened later. The next one took place in the ' + (Math.floor(next.y / 10) * 10) + 's.')) };
    }
  }
  tmlRender();
}
function tmlReset(){
  if (!TML) return;
  TML.placed = []; TML.tries = 0; TML.fin = false; TML.msg = null;
  tmlRender();
}

/* ================================================
   WIDGET 4 - CONSTRUCTOR DE LA RUTA DEL CAMBIO
   Demand, collective action and result are chosen from three columns and three
   meters move on every tap. A vague demand caps the durability meter, so the
   student sees why precision comes first. Check names the weakest meter; the
   third miss assembles the strongest route.
   ================================================ */
var RUT = null;
function buildRuta(rng){
  var scen = [
    { txt:['En tu municipio, varias colonias llevan años recibiendo agua solo dos días por semana.',
           'In your town, several neighborhoods have gone years receiving water only two days a week.'],
      a:[ { t:['Que el agua potable llegue todos los días a todas las colonias, con un plan y fechas públicas','That drinking water reach every neighborhood every day, with a public plan and public dates'], v:100 },
          { t:['Que le pongan agua a mi casa lo antes posible','That water be connected to my house as soon as possible'], v:35 },
          { t:['Que alguien haga algo con el problema del agua','That somebody do something about the water problem'], v:20 },
          { t:['Que renuncie la persona encargada de la oficina del agua','That whoever runs the water office resign'], v:45 } ],
      b:[ { t:['Asambleas en cada colonia, firmas de todas las familias y una audiencia pública con el cabildo','Assemblies in each neighborhood, signatures from every family and a public hearing with the town council'], v:100 },
          { t:['Que solo el comité vaya a hablar en privado con una autoridad','Only the committee goes to speak privately with one official'], v:45 },
          { t:['Publicar quejas anónimas y no volver a reunirse','Posting anonymous complaints and never meeting again'], v:25 },
          { t:['Impedir el paso a quien no apoye la protesta','Blocking the way of anyone who does not support the protest'], v:10 } ],
      c:[ { t:['Un acuerdo firmado con obras, presupuesto y un comité vecinal que vigile su cumplimiento','A signed agreement with works, budget and a neighborhood committee watching over compliance'], v:100 },
          { t:['Que manden pipas de agua durante esta semana','That water trucks be sent this week'], v:35 },
          { t:['Que la autoridad prometa en una reunión que lo va a revisar','That the authority promise at a meeting to look into it'], v:20 },
          { t:['Que salga una nota sobre el problema en el periódico local','That a note about the problem appear in the local paper'], v:30 } ] },
    { txt:['En tu comunidad, las y los estudiantes de secundaria caminan dos horas porque no hay transporte, y varias familias ya dejaron de mandarlos.',
           'In your community, secondary students walk two hours because there is no transport, and several families have stopped sending them.'],
      a:[ { t:['Que exista una ruta de transporte escolar gratuita con horario fijo para las tres comunidades','That a free school transport route with a fixed schedule exist for the three communities'], v:100 },
          { t:['Que a mi hermana la lleven a la escuela','That my sister be given a ride to school'], v:30 },
          { t:['Que mejore la educación en el pueblo','That education in the town improve'], v:20 },
          { t:['Que cambien a la dirección de la escuela','That the school leadership be replaced'], v:40 } ],
      b:[ { t:['Reunir a las familias de las tres comunidades, contar cuántos estudiantes caminan y presentarlo ante la autoridad educativa','Bringing the families of the three communities together, counting how many students walk and presenting it to the education authority'], v:100 },
          { t:['Que cada familia mande su queja por separado cuando pueda','Each family sends its complaint separately whenever it can'], v:40 },
          { t:['Esperar a que la autoridad se dé cuenta sola del problema','Waiting for the authority to notice the problem on its own'], v:15 },
          { t:['Cerrar la escuela para que nadie entre hasta que haya respuesta','Closing the school so nobody enters until there is an answer'], v:15 } ],
      c:[ { t:['Una ruta incluida en el presupuesto anual, con reglas de operación publicadas','A route included in the annual budget, with published operating rules'], v:100 },
          { t:['Un camión prestado por unas semanas','A bus lent for a few weeks'], v:30 },
          { t:['Una promesa verbal durante una visita de campaña','A verbal promise during a campaign visit'], v:15 },
          { t:['Una colecta entre las familias para pagar los pasajes de este mes','A collection among families to pay this month fares'], v:35 } ] }
  ];
  RUT = { sc: pick(scen, rng), a:null, b:null, c:null, tries:0, fin:false, msg:null };
  return '<div class="wgt" id="rutWgt">' +
    '<div class="wgt-h">' + S('Arma la ruta del cambio','Build the route to change') + '</div>' +
    '<div class="wgt-q">' + S('Elige una opción de cada columna. Los tres medidores se mueven con cada elección.',
                              'Choose one option from each column. The three meters move with every choice.') + '</div>' +
    '<div id="rutBody"></div></div>';
}
function rutScores(){
  var A = RUT.a === null ? 0 : RUT.sc.a[RUT.a].v;
  var B = RUT.b === null ? 0 : RUT.sc.b[RUT.b].v;
  var C = RUT.c === null ? 0 : RUT.sc.c[RUT.c].v;
  if (A < 80) C = Math.min(C, 60);
  return { cl:A, co:B, du:C };
}
function rutMeter(lbl, v){
  return '<div class="mtr"><div class="mtrlbl"><span>' + lbl + '</span><span>' + v + '</span></div>' +
    '<div class="mtrtrack"><div class="mtrfill' + (v >= 80 ? ' ok' : '') + '" style="width:' + v + '%"></div></div></div>';
}
function rutCol(list, sel, letter){
  return list.map(function(o, i){
    return '<div class="optbox' + (sel === i ? ' sel' : '') + '" onclick="rutPick(\'' + letter + '\',' + i + ')">' + L(o.t) + '</div>';
  }).join('');
}
function rutRender(){
  var el = document.getElementById('rutBody'); if (!el || !RUT) return;
  var s = rutScores();
  var chain = (RUT.a !== null && RUT.b !== null && RUT.c !== null)
    ? '<div class="chain"><b>' + L(['Tu ruta: ','Your route: ']) + '</b>' + L(RUT.sc.a[RUT.a].t) + ' → ' + L(RUT.sc.b[RUT.b].t) + ' → ' + L(RUT.sc.c[RUT.c].t) + '</div>'
    : '';
  el.innerHTML =
    '<div class="wcase">' + L(RUT.sc.txt) + '</div>' +
    '<div class="wcols">' +
      '<div><div class="colh">' + L(['1. La demanda','1. The demand']) + '</div>' + rutCol(RUT.sc.a, RUT.a, 'a') + '</div>' +
      '<div><div class="colh">' + L(['2. La acción colectiva','2. The collective action']) + '</div>' + rutCol(RUT.sc.b, RUT.b, 'b') + '</div>' +
      '<div><div class="colh">' + L(['3. El resultado','3. The result']) + '</div>' + rutCol(RUT.sc.c, RUT.c, 'c') + '</div>' +
    '</div>' +
    '<div style="margin-top:.8rem">' +
      rutMeter(L(['Claridad de la demanda','Clarity of the demand']), s.cl) +
      rutMeter(L(['Fuerza colectiva y pacífica','Collective and peaceful strength']), s.co) +
      rutMeter(L(['Cambio duradero','Lasting change']), s.du) +
    '</div>' + chain +
    (RUT.msg ? '<div class="wmsg ' + RUT.msg.cls + '">' + RUT.msg.text + '</div>' : '') +
    (RUT.fin ? '' :
      '<button class="wbtn" onclick="rutCheck()">' + L(['Comprobar la ruta','Check the route']) + '</button>' +
      '<button class="wbtn alt" onclick="rutReset()">' + L(['Empezar de nuevo','Start over']) + '</button>');
}
function rutPick(col, i){
  if (!RUT || RUT.fin) return;
  RUT[col] = i; RUT.msg = null; rutRender();
}
function rutReset(){
  if (!RUT || RUT.fin) return;
  RUT.a = null; RUT.b = null; RUT.c = null; RUT.msg = null; rutRender();
}
function rutBest(list){ var bi = 0, i; for (i = 1; i < list.length; i++) if (list[i].v > list[bi].v) bi = i; return bi; }
function rutCheck(){
  if (!RUT || RUT.fin) return;
  if (RUT.a === null || RUT.b === null || RUT.c === null) {
    RUT.msg = { cls:'warn', text: L(['Falta elegir en alguna columna: una ruta necesita las tres piezas.',
      'A column is still empty: a route needs all three pieces.']) };
    rutRender(); return;
  }
  var s = rutScores();
  if (s.cl >= 80 && s.co >= 80 && s.du >= 80) {
    RUT.fin = true;
    RUT.msg = { cls:'ok', text: L(['Esa ruta se sostiene: la demanda se puede verificar, la acción incluye a todo el grupo afectado y el resultado queda escrito con presupuesto.',
      'That route holds up: the demand can be verified, the action includes the whole affected group and the result is written down with a budget.']) };
  } else {
    RUT.tries++;
    var worst = 'cl';
    if (s.co < s[worst]) worst = 'co';
    if (s.du < s[worst]) worst = 'du';
    if (RUT.tries >= 3) {
      RUT.a = rutBest(RUT.sc.a); RUT.b = rutBest(RUT.sc.b); RUT.c = rutBest(RUT.sc.c);
      RUT.fin = true;
      RUT.msg = { cls:'warn', text: L(['Esta es la ruta más fuerte de las que había: demanda verificable, acción de todo el grupo y resultado con presupuesto.',
        'This is the strongest route available: a verifiable demand, action by the whole group and a result with a budget.']) };
    } else {
      var m;
      if (worst === 'cl') m = L(['Tu demanda todavía es vaga o personal. Si nadie puede decir si se cumplió, la autoridad tampoco tiene qué responder.',
        'Your demand is still vague or personal. If nobody can tell whether it was met, the authority has nothing to answer either.']);
      else if (worst === 'co') m = L(['Esa acción deja fuera a la mayoría o pasa por encima de otras personas. Un movimiento se sostiene cuando participa el grupo afectado y respeta a quienes no piensan igual.',
        'That action leaves most people out or runs over others. A movement holds up when the affected group takes part and respects those who think differently.']);
      else if (RUT.a !== null && RUT.sc.a[RUT.a].v < 80) m = L(['El resultado no se puede medir mientras la demanda siga siendo vaga. Empieza por afinar la columna 1.',
        'The result cannot be measured while the demand stays vague. Start by sharpening column 1.']);
      else m = L(['Ese resultado alivia hoy, pero el problema regresa la próxima temporada. Busca algo que quede escrito y con presupuesto.',
        'That result helps today, but the problem returns next season. Look for something written down and funded.']);
      RUT.msg = { cls:'warn', text: m };
    }
  }
  rutRender();
}

/* ================================================
   buildLesson — concept, manipulative, problem, interleaved (Rule 1)
   ================================================ */
function buildLesson(rng) {
  problems = []; answeredCount = 0; correctCount = 0;
  document.getElementById('lessonBody').innerHTML = '';

  /* ── CONCEPTO 1 ─────────────────────────────────────────────── */
  addSection(S('CONCEPTO 1','CONCEPT 1'),
    '<h2>' + S('Qué convierte un reclamo en un movimiento social','What turns a complaint into a social movement') + '</h2>' +
    '<p>' + S('Casi todos los derechos que hoy aparecen escritos en la Constitución empezaron siendo un reclamo de personas que no los tenían. Alguien tuvo que decir en voz alta que la situación era injusta, convencer a otras personas y sostener esa exigencia durante años. A esa forma de actuar juntos la llamamos movimiento social.',
              'Almost every right written today in the Constitution began as a claim by people who did not hold it. Somebody had to say out loud that the situation was unjust, convince others and sustain that demand for years. That way of acting together is what we call a social movement.') + '</p>' +
    '<p>' + S('No toda protesta es un movimiento, y no todo grupo organizado lo es. Un movimiento social reúne cuatro rasgos al mismo tiempo: es colectivo, porque participa un grupo y no una persona sola; está organizado, porque reparte tareas y toma acuerdos; se sostiene en el tiempo, porque no se agota en un solo día; y dirige una demanda a quien tiene el poder de resolverla, casi siempre una autoridad pública.',
              'Not every protest is a movement, and not every organized group is one. A social movement brings four traits together at once: it is collective, because a group takes part and not a single person; it is organized, because it shares out tasks and reaches agreements; it lasts over time, because it does not end in a single day; and it aims a demand at whoever has the power to solve it, almost always a public authority.') + '</p>' +
    '<div class="callout"><p><strong>' + S('Movimiento social: ','Social movement: ') + '</strong>' +
      S('grupo organizado de personas que sostiene en el tiempo una demanda pública para cambiar una situación que considera injusta y para que un derecho se reconozca o se cumpla.',
        'an organized group of people that sustains a public demand over time in order to change a situation it considers unjust and to have a right recognized or fulfilled.') + '</p></div>' +
    '<div class="rules-grid">' +
      '<div class="rcard"><div class="rname">' + S('Colectivo','Collective') + '</div><div class="rform">' + S('¿quiénes?','who?') + '</div><div class="rnote">' + S('Muchas personas afectadas por lo mismo.','Many people affected by the same thing.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Organizado','Organized') + '</div><div class="rform">' + S('¿cómo se coordinan?','how do they coordinate?') + '</div><div class="rnote">' + S('Asambleas, comités, acuerdos, tareas.','Assemblies, committees, agreements, tasks.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Sostenido','Sustained') + '</div><div class="rform">' + S('¿cuánto dura?','how long does it last?') + '</div><div class="rnote">' + S('Meses o años, no una sola tarde.','Months or years, not a single afternoon.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Público','Public') + '</div><div class="rform">' + S('¿a quién se dirige?','who is it aimed at?') + '</div><div class="rnote">' + S('A quien puede decidir y cambiar la regla.','At whoever can decide and change the rule.') + '</div></div>' +
    '</div>' +
    buildDetector(rng));
  detRender();

  /* ── PROBLEMA 1 ─────────────────────────────────────────────── */
  addProblem(pick([
    { title:{ es:'Reunión constante, ¿movimiento?', en:'A steady gathering, a movement?' }, showWork:false,
      stmt:{ es:'En una ciudad, un grupo de ciclistas se reúne cada domingo desde hace cinco años para recorrer juntos la avenida principal. Nunca han pedido nada a las autoridades ni buscan cambiar ninguna regla. ¿Por qué esta reunión no se considera un movimiento social?',
             en:'In one city, a group of cyclists has met every Sunday for five years to ride the main avenue together. They have never asked anything of the authorities and do not seek to change any rule. Why is this gathering not considered a social movement?' },
      options:{ es:[
        'Porque, aunque es colectiva, organizada y constante, no dirige ninguna demanda a la autoridad para cambiar algo injusto.',
        'Porque los movimientos sociales existen solo cuando participan miles de personas al mismo tiempo.',
        'Porque se reúnen en la calle y los movimientos sociales se organizan únicamente en espacios cerrados.',
        'Porque llevan cinco años y un movimiento social debe alcanzar sus objetivos en menos tiempo.' ],
        en:[
        'Because, although it is collective, organized and steady, it aims no demand at authority to change something unjust.',
        'Because social movements exist only when thousands of people take part at the same time.',
        'Because they meet in the street and social movements are organized only in closed spaces.',
        'Because they have lasted five years and a social movement must reach its goals in less time.' ] },
      correct:0,
      hint:{ es:'Repasa los cuatro rasgos y busca cuál es el único que le falta a este grupo.',
             en:'Go over the four traits and find the only one this group is missing.' },
      explanation:{ es:'Los ciclistas cumplen tres rasgos: son un grupo, se coordinan y llevan cinco años. Les falta el cuarto, que es exigir a quien puede decidir un cambio frente a una situación injusta. Sin esa demanda pública, la reunión es una actividad compartida y no un movimiento.',
                    en:'The cyclists meet three traits: they are a group, they coordinate and they have lasted five years. They lack the fourth one, which is demanding a change from whoever can decide in the face of an unjust situation. Without that public demand, the gathering is a shared activity and not a movement.' } },
    { title:{ es:'De la inundación a la organización', en:'From the flood to the organization' }, showWork:false,
      stmt:{ es:'Después de una inundación, quienes viven en tres colonias forman comités, se reúnen cada semana durante un año y exigen al gobierno una obra de drenaje que evite que vuelva a ocurrir. ¿Qué convierte esta organización en un movimiento social?',
             en:'After a flood, residents of three neighborhoods form committees, meet every week for a year and demand from the government a drainage project that prevents it from happening again. What turns this organization into a social movement?' },
      options:{ es:[
        'Que un grupo organizado sostiene en el tiempo una demanda dirigida a la autoridad para cambiar una situación que considera injusta.',
        'Que las personas de las tres colonias se ayudaron entre sí durante los días más difíciles de la inundación.',
        'Que la inundación afectó a tres colonias distintas y no solamente a una de ellas.',
        'Que las reuniones se realizaron en la calle y no dentro de una oficina de gobierno.' ],
        en:[
        'That an organized group sustains over time a demand aimed at authority to change a situation it considers unjust.',
        'That people from the three neighborhoods helped each other during the hardest days of the flood.',
        'That the flood affected three different neighborhoods and not only one of them.',
        'That the meetings took place in the street and not inside a government office.' ] },
      correct:0,
      hint:{ es:'Pregunta qué rasgos aparecen juntos aquí y cuál de las opciones los nombra todos, no solo uno.',
             en:'Ask which traits appear together here and which option names all of them, not just one.' },
      explanation:{ es:'La ayuda mutua y el número de colonias son datos del caso, pero por sí solos no bastan. Lo que hace movimiento a este grupo es la suma de los cuatro rasgos: personas afectadas que se organizan, sostienen la exigencia durante un año y la dirigen a la autoridad que puede construir la obra.',
                    en:'Mutual help and the number of neighborhoods are facts of the case, but on their own they are not enough. What makes this group a movement is the sum of the four traits: affected people who organize, sustain the demand for a year and aim it at the authority that can build the project.' } }
  ], rng), rng);

  /* ── PROBLEMA 2 ─────────────────────────────────────────────── */
  addProblem(pick([
    { title:{ es:'Dos formas de pedir lo mismo', en:'Two ways of asking for the same thing' }, showWork:false,
      stmt:{ es:'Dos grupos piden lo mismo: una clínica para su comunidad. El primero entrega un escrito, no vuelve a reunirse y espera. El segundo mantiene reuniones mensuales durante dos años, registra cuántas personas viajan para atenderse y acude a cada sesión pública del cabildo. ¿Por qué el segundo grupo tiene más posibilidades de ser escuchado?',
             en:'Two groups ask for the same thing: a clinic for their community. The first hands in a letter, never meets again and waits. The second holds monthly meetings for two years, records how many people travel to get care and attends every public town council session. Why does the second group stand a better chance of being heard?' },
      options:{ es:[
        'Porque su continuidad y sus registros convierten la petición en un asunto público que la autoridad no puede dar por cerrado.',
        'Porque un escrito entregado una sola vez carece de validez legal ante cualquier autoridad municipal.',
        'Porque las autoridades atienden únicamente a los grupos que llevan más de dos años reuniéndose.',
        'Porque el segundo grupo reúne a más personas que el primero en cada una de sus sesiones.' ],
        en:[
        'Because its continuity and its records turn the request into a public matter the authority cannot treat as closed.',
        'Because a letter handed in only once has no legal validity before any town authority.',
        'Because authorities attend only to groups that have been meeting for more than two years.',
        'Because the second group gathers more people than the first at each of its sessions.' ] },
      correct:0,
      hint:{ es:'Piensa en qué le pasa a una petición que nadie vuelve a mencionar, comparada con una que reaparece cada mes con datos.',
             en:'Think about what happens to a request nobody mentions again, compared with one that reappears every month with data.' },
      explanation:{ es:'Un escrito entregado una vez es válido, pero se archiva y deja de existir para quien decide. La organización sostenida hace lo contrario: vuelve a colocar la demanda en cada sesión pública y la acompaña de evidencia, así que la autoridad tiene que responder algo. Ese es el efecto de la continuidad, no del tamaño del grupo.',
                    en:'A letter handed in once is valid, but it gets filed away and stops existing for whoever decides. Sustained organization does the opposite: it puts the demand back on the table at every public session and backs it with evidence, so the authority has to answer something. That is the effect of continuity, not of group size.' } },
    { title:{ es:'Una organización que no se disuelve', en:'An organization that does not dissolve' }, showWork:false,
      stmt:{ es:'Una asociación de personas con discapacidad lleva ocho años pidiendo rampas y transporte accesible en su ciudad: documenta cada edificio público sin acceso y acompaña a quienes presentan una queja. ¿Qué papel cumple esta organización sostenida en el tiempo?',
             en:'An association of people with disabilities has spent eight years asking for ramps and accessible transport in their city: it documents every public building without access and supports those who file a complaint. What role does this organization sustained over time play?' },
      options:{ es:[
        'Mantiene visible una exigencia que, de otro modo, dependería de la memoria y del esfuerzo aislado de cada persona afectada.',

        'Convierte en ley de manera automática cada una de las quejas que presentan sus integrantes.',

        en:[
        'It keeps visible a demand that would otherwise depend on the memory and isolated effort of each affected person.',
        'It replaces the authorities in the duty to build the ramps of public buildings.',
        'It automatically turns each complaint its members file into law.',
        'It guarantees that no person with a disability will ever file a complaint individually again.' ] },

      hint:{ es:'Compara lo que logra una persona sola que se queja una vez con lo que logra un grupo que registra y acompaña durante años.',
             en:'Compare what one person achieves complaining once with what a group achieves recording and supporting for years.' },
      explanation:{ es:'La asociación no construye rampas ni aprueba leyes, porque eso corresponde a la autoridad. Lo que hace es acumular evidencia y sostener la exigencia para que no se olvide entre una administración y otra. Sin esa continuidad, cada queja individual se pierde y todo vuelve a empezar.',

  addSection(S('CONCEPTO 2','CONCEPT 2'),
    '<h2>' + S('Qué derechos reclaman: económicos, políticos y sociales','Which rights they claim: economic, political and social') + '</h2>' +
    '<p>' + S('Los movimientos no piden cosas sueltas: piden derechos. Conviene distinguir tres grupos. Los derechos económicos tienen que ver con el trabajo y con los medios para vivir de él: salario justo, contrato, tierra para sembrar, organización sindical. Los derechos políticos tienen que ver con decidir: votar, ser electa o electo, reunirse, manifestarse, ser consultado antes de una decisión que te afecta. Los derechos sociales tienen que ver con las condiciones de una vida digna que el Estado debe garantizar: educación, salud, vivienda, agua, alimentación.',
              'Movements do not ask for scattered things: they ask for rights. It helps to tell three groups apart. Economic rights concern work and the means to live from it: fair wages, contracts, land to farm, union organization. Political rights concern deciding: voting, being elected, gathering, demonstrating, being consulted before a decision that affects you. Social rights concern the conditions of a dignified life the State must guarantee: education, health, housing, water, food.') + '</p>' +
    '<p>' + S('La frontera no siempre es tajante y un mismo movimiento suele reclamar en varios grupos a la vez. Quien exige tierra para sembrar reclama un derecho económico, y cuando pide además una escuela en su comunidad reclama uno social. Clasificar la demanda sirve para entender contra qué obstáculo se está luchando y a qué autoridad corresponde responder.',
              'The border is not always sharp and one same movement usually claims in several groups at once. Whoever demands land to farm claims an economic right, and when they also ask for a school in their community they claim a social one. Sorting the demand helps to understand which obstacle is being fought and which authority is supposed to answer.') + '</p>' +
    '<div class="rules-grid">' +
      '<div class="rcard"><div class="rname">' + S('Económicos','Economic') + '</div><div class="rform">' + S('¿de qué vives?','what do you live on?') + '</div><div class="rnote">' + S('Salario, contrato, tierra, sindicato.','Wages, contract, land, union.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Políticos','Political') + '</div><div class="rform">' + S('¿quién decide?','who decides?') + '</div><div class="rnote">' + S('Voto, reunión, manifestación, consulta.','Vote, assembly, demonstration, consultation.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Sociales','Social') + '</div><div class="rform">' + S('¿qué necesitas para vivir con dignidad?','what do you need to live with dignity?') + '</div><div class="rnote">' + S('Educación, salud, vivienda, agua.','Education, health, housing, water.') + '</div></div>' +
    '</div>' +
    buildClasifica(rng));

  addSection(S('CONCEPTO 3','CONCEPT 3'),
    '<h2>' + S('Movimientos que cambiaron a México y a América Latina','Movements that changed Mexico and Latin America') + '</h2>' +
    '<p>' + S('En México, la organización de las mujeres recorrió décadas antes de conseguir algo que hoy parece obvio: los congresos feministas de Yucatán reclamaron derechos desde 1916, y el voto femenino en elecciones federales se reconoció en 1953. El movimiento ferrocarrilero de 1958 peleó por el salario y por elegir a sus dirigentes. El movimiento estudiantil de 1968 exigió libertades políticas y fue reprimido, aunque su reclamo abrió la puerta a la reforma política de 1977, que permitió a más partidos competir. Después del sismo de 1985, quienes perdieron su casa y las costureras de los talleres se organizaron por vivienda y por contratos. El levantamiento zapatista de 1994 colocó los derechos de los pueblos indígenas en el centro del debate nacional, y en 2001 la Constitución se reformó en esa materia.',
              'In Mexico, women organizing took decades before achieving something that today looks obvious: the feminist congresses of Yucatan claimed rights from 1916 on, and the female vote in federal elections was recognized in 1953. The railway movement of 1958 fought for wages and for electing its own leaders. The student movement of 1968 demanded political freedoms and was repressed, though its claim opened the door to the 1977 political reform, which let more parties compete. After the 1985 earthquake, those who lost their homes and the garment workers of the workshops organized for housing and for contracts. The Zapatista uprising of 1994 placed Indigenous peoples rights at the center of national debate, and in 2001 the Constitution was reformed on that matter.') + '</p>' +
    '<p>' + S('En América Latina ocurrió algo parecido. Las Madres de Plaza de Mayo caminan cada semana en Buenos Aires desde 1977 para exigir saber qué pasó con sus hijas e hijos desaparecidos. En Brasil, el Movimiento de Trabajadores Rurales Sin Tierra nació en 1984 para reclamar tierra. En Ecuador, el levantamiento indígena de 1990 exigió el reconocimiento de los pueblos originarios. En Bolivia, la movilización por el agua en Cochabamba, en el año 2000, logró frenar el traspaso del servicio a una empresa privada. En Chile, el movimiento estudiantil que creció entre 2006 y 2011 exigió educación pública y gratuita, y años después el Estado estableció la gratuidad para una parte de quienes estudian.',
              'Something similar happened across Latin America. The Mothers of Plaza de Mayo have walked every week in Buenos Aires since 1977 to demand to know what happened to their missing sons and daughters. In Brazil, the Landless Rural Workers Movement was born in 1984 to claim land. In Ecuador, the Indigenous uprising of 1990 demanded recognition of native peoples. In Bolivia, the water mobilization in Cochabamba, in the year 2000, managed to stop the handover of the service to a private company. In Chile, the student movement that grew between 2006 and 2011 demanded free public education, and years later the State established free tuition for part of those who study.') + '</p>' +
    '<div class="callout"><p><strong>' + S('Un patrón que se repite: ','A pattern that repeats: ') + '</strong>' +
      S('la demanda aparece muchos años antes que la ley que la reconoce. Entre una y otra hay organización sostenida, negociación y desgaste.',
        'the demand appears many years before the law that recognizes it. In between there is sustained organization, negotiation and wear.') + '</p></div>' +
    buildTimeline(rng));
  tmlRender();

  addSection(S('CONCEPTO 4','CONCEPT 4'),
    '<h2>' + S('De la demanda al derecho: qué deja un movimiento','From demand to right: what a movement leaves behind') + '</h2>' +
    '<p>' + S('Un movimiento social usa distintos recursos para hacerse oír: asambleas, marchas, plantones, huelgas, recolección de firmas, iniciativas presentadas ante un congreso, demandas ante tribunales y campañas de información. Todos esos recursos son legítimos mientras sean pacíficos y no anulen los derechos de terceras personas. La elección no es de estilo: cada recurso sirve para un objetivo distinto, y una acción que deja fuera al grupo afectado debilita al propio movimiento.',
              'A social movement uses different resources to make itself heard: assemblies, marches, sit ins, strikes, signature drives, bills presented to a congress, court claims and information campaigns. All those resources are legitimate as long as they are peaceful and do not cancel the rights of others. The choice is not a matter of style: each resource serves a different goal, and an action that leaves the affected group out weakens the movement itself.') + '</p>' +
    '<p>' + S('El resultado también se puede distinguir. Hay respuestas que alivian el momento, como un envío de agua o un apoyo por una vez, y hay resultados que permanecen: una ley nueva, una reforma constitucional, una institución creada para vigilar el cumplimiento, un programa con presupuesto asignado y reglas publicadas. Un movimiento trasciende cuando su demanda queda escrita, con recursos y con alguien que pueda exigir su cumplimiento el año siguiente.',
              'The result can also be told apart. There are answers that ease the moment, like a water delivery or a one time support, and there are results that stay: a new law, a constitutional reform, an institution created to watch over compliance, a program with an assigned budget and published rules. A movement leaves a mark when its demand ends up written down, funded and with somebody able to demand compliance the following year.') + '</p>' +
    '<div class="rules-grid">' +
      '<div class="rcard"><div class="rname">' + S('Demanda clara','Clear demand') + '</div><div class="rform">' + S('¿se puede verificar?','can it be verified?') + '</div><div class="rnote">' + S('Cualquiera puede decir si se cumplió o no.','Anyone can say whether it was met.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Acción pacífica','Peaceful action') + '</div><div class="rform">' + S('¿participa el grupo?','does the group take part?') + '</div><div class="rnote">' + S('Incluye a quienes viven el problema y respeta a los demás.','Includes those living the problem and respects others.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Resultado duradero','Lasting result') + '</div><div class="rform">' + S('¿sobrevive al cambio de gobierno?','does it survive a change of government?') + '</div><div class="rnote">' + S('Ley, presupuesto y reglas publicadas.','Law, budget and published rules.') + '</div></div>' +
    '</div>' +
    buildRuta(rng));
  rutRender();

  /* ── PROBLEMA 7 ─────────────────────────────────────────────── */
  addProblem(pick([
    { title:{ es:'La acción que corresponde', en:'The action that fits' }, showWork:false,
      stmt:{ es:'Un grupo de comunidades quiere que la consulta previa deje de depender de la buena voluntad de cada funcionario y quede establecida como una obligación permanente. ¿Qué acción se dirige mejor a ese objetivo?',
             en:'A group of communities wants prior consultation to stop depending on the goodwill of each official and to be established as a permanent duty. Which action best aims at that goal?' },
      options:{ es:[
        'Documentar los casos, presentar una iniciativa ante el congreso local y acompañarla con audiencias públicas donde las comunidades expongan.',
        'Pedir a cada funcionario en turno que prometa por escrito que sí consultará durante su gestión.',
        'Difundir mensajes anónimos en redes sociales sobre los funcionarios que no consultaron a nadie.',
        'Esperar a la siguiente elección y abstenerse de participar en ella para mostrar inconformidad.' ],
        en:[
        'Documenting the cases, presenting a bill to the local congress and backing it with public hearings where the communities speak.',
        'Asking each official in office to promise in writing that they will consult during their term.',
        'Spreading anonymous messages on social media about the officials who consulted nobody.',
        'Waiting for the next election and abstaining from it to show discontent.' ] },
      correct:0,
      hint:{ es:'Distingue entre lo que depende de una persona en el cargo y lo que queda escrito para quien llegue después.',
             en:'Tell apart what depends on one person in office from what stays written for whoever comes next.' },
      explanation:{ es:'Una promesa personal se acaba cuando esa persona deja el cargo, los mensajes anónimos no obligan a nadie y abstenerse no cambia ninguna norma. Presentar una iniciativa con evidencia y audiencias apunta a que la consulta quede como obligación escrita, que es justo lo que el grupo busca.',
                    en:'A personal promise ends when that person leaves office, anonymous messages bind nobody and abstaining changes no rule. Presenting a bill with evidence and hearings aims at making consultation a written duty, which is exactly what the group is after.' } },
    { title:{ es:'Que el logro no se pierda', en:'So the gain is not lost' }, showWork:false,
      stmt:{ es:'Después de dos años de reuniones, un movimiento consiguió que el gobierno anunciara un programa de becas de transporte para estudiantes de comunidades alejadas. ¿Qué conviene hacer para que ese logro no se pierda cuando cambie la administración?',
             en:'After two years of meetings, a movement got the government to announce a transport grant program for students from remote communities. What should be done so that gain is not lost when the administration changes?' },
      options:{ es:[
        'Conseguir que el programa quede en una regla escrita, con presupuesto asignado y con un mecanismo público para revisar su cumplimiento.',
        'Organizar una celebración pública para agradecer a la autoridad que hizo el anuncio del programa.',
        'Disolver el movimiento, porque la demanda que le dio origen ya fue atendida por el gobierno.',
        'Solicitar que el programa lleve el nombre de la autoridad que lo anunció, para que se recuerde.' ],
        en:[
        'Getting the program written into a rule, with an assigned budget and a public mechanism to review compliance.',
        'Organizing a public celebration to thank the authority that announced the program.',
        'Dissolving the movement, since the demand that gave rise to it has already been met.',
        'Requesting that the program bear the name of the authority that announced it, so it is remembered.' ] },
      correct:0,
      hint:{ es:'Pregúntate qué queda del anuncio cuando la persona que lo hizo ya no está en el cargo.',
             en:'Ask yourself what remains of the announcement once the person who made it is no longer in office.' },
      explanation:{ es:'Un anuncio depende de quien gobierna en ese momento. Si la beca queda en una regla escrita, con dinero asignado y con una forma pública de revisar si se entrega, el programa sobrevive al cambio de administración. Agradecer, disolverse o poner un nombre no protegen nada.',
                    en:'An announcement depends on whoever governs at that moment. If the grant is written into a rule, with money assigned and a public way to check whether it is delivered, the program survives the change of administration. Thanking, dissolving or naming it protects nothing.' } }
  ], rng), rng);

  /* ── PROBLEMA 8 ─────────────────────────────────────────────── */
  addProblem(pick([
    { title:{ es:'Décadas antes de la ley', en:'Decades before the law' }, showWork:false,
      stmt:{ es:'En México, la exigencia de las mujeres organizadas por votar recorrió décadas de congresos, publicaciones, campañas y presión ante el poder legislativo, hasta la reforma que reconoció ese derecho en 1953. ¿Qué relación entre movimiento y ley muestra este proceso?',
             en:'In Mexico, the demand of organized women for the vote crossed decades of congresses, publications, campaigns and pressure on the legislature, until the reform that recognized that right in 1953. What relation between movement and law does this process show?' },
      options:{ es:[
        'Que la ley suele llegar al final de un proceso de organización sostenida, y no antes de que exista quien la exija.',
        'Que la ley cambió porque los congresos de mujeres se realizaron en una sola entidad del país.',
        'Que las leyes se modifican sobre todo cuando quienes gobiernan cambian de opinión sin presión externa.',
        'Que el derecho al voto se reconoció primero en la ley y después las mujeres se organizaron para usarlo.' ],
        en:[
        'That the law usually arrives at the end of a process of sustained organization, and not before someone demands it.',
        'That the law changed because the women congresses took place in a single state of the country.',
        'That laws change above all when those who govern change their minds with no outside pressure.',
        'That the right to vote was recognized in law first and women organized afterwards to use it.' ] },
      correct:0,
      hint:{ es:'Fíjate en qué ocurrió primero, si la organización de las mujeres o el cambio en la ley.',
             en:'Look at what happened first, the organizing of women or the change in the law.' },
      explanation:{ es:'La organización de las mujeres es anterior a la reforma y fue lo que la hizo posible. El caso muestra el orden habitual: primero aparece una demanda sostenida, luego la presión sobre quienes legislan y al final el cambio en la ley. Sin ese trabajo previo, el reconocimiento no se explica.',
                    en:'Women organizing came before the reform and was what made it possible. The case shows the usual order: first a sustained demand appears, then pressure on those who legislate and finally the change in the law. Without that earlier work, the recognition cannot be explained.' } },
    { title:{ es:'De un levantamiento a una reforma', en:'From an uprising to a reform' }, showWork:false,
      stmt:{ es:'El levantamiento zapatista de 1994 colocó los derechos de los pueblos indígenas en el debate nacional; siguieron años de diálogo, movilizaciones y negociación, y en 2001 la Constitución fue reformada en esa materia. ¿Qué muestra esta secuencia?',
             en:'The Zapatista uprising of 1994 placed Indigenous peoples rights in the national debate; years of dialogue, mobilizations and negotiation followed, and in 2001 the Constitution was reformed on that matter. What does this sequence show?' },
      options:{ es:[
        'Que una demanda social puede transformarse en un cambio constitucional cuando se sostiene y se negocia durante años.',
        'Que las reformas constitucionales se aprueban en los días siguientes a cualquier movilización numerosa.',
        'Que el diálogo entre el gobierno y un movimiento vuelve innecesario modificar las leyes existentes.',
        'Que los derechos de los pueblos indígenas se reconocieron sin que ningún movimiento los hubiera reclamado.' ],
        en:[
        'That a social demand can turn into a constitutional change when it is sustained and negotiated for years.',
        'That constitutional reforms are passed in the days following any large mobilization.',
        'That dialogue between the government and a movement makes changing existing laws unnecessary.',
        'That Indigenous peoples rights were recognized without any movement having claimed them.' ] },
      correct:0,
      hint:{ es:'Observa cuánto tiempo pasó entre el levantamiento y la reforma, y qué ocurrió en medio.',
             en:'Look at how much time passed between the uprising and the reform, and what happened in between.' },
      explanation:{ es:'Entre el levantamiento y la reforma hubo varios años de diálogo, movilización y negociación. Ese periodo intermedio es la parte decisiva: sin él, la demanda no habría llegado al texto constitucional. La secuencia muestra que un movimiento puede alcanzar el nivel más alto de la ley, pero no de manera inmediata.',
                    en:'Between the uprising and the reform there were several years of dialogue, mobilization and negotiation. That in between period is the decisive part: without it, the demand would not have reached the constitutional text. The sequence shows a movement can reach the highest level of law, but not immediately.' } }
  ], rng), rng);

  /* ── BLOQUE FINAL ───────────────────────────────────────────── */
  addSection(S('CIERRE','CLOSING'),
    '<h2>' + S('Pon a prueba lo que entendiste','Put what you understood to the test') + '</h2>' +
    '<p>' + S('Las siguientes situaciones cruzan países y épocas distintas. Léelas con calma y decide con base en lo que ya trabajaste.',
              'The following situations cross different countries and periods. Read them calmly and decide based on what you have already worked on.') + '</p>');

  /* ── PROBLEMA 9 ─────────────────────────────────────────────── */
  addProblem(pick([
    { title:{ es:'El agua en dos países', en:'Water in two countries' }, showWork:false,
      stmt:{ es:'En el año 2000, en Cochabamba, Bolivia, una movilización logró frenar el traspaso del servicio de agua a una empresa privada. En México, colonias enteras se organizan para que el agua potable llegue todos los días. ¿Qué tienen en común ambos movimientos?',
             en:'In the year 2000, in Cochabamba, Bolivia, a mobilization managed to stop the handover of the water service to a private company. In Mexico, whole neighborhoods organize so that drinking water arrives every day. What do both movements have in common?' },
      options:{ es:[
        'Que reclaman el acceso al agua como un derecho que el Estado debe garantizar, y no como un servicio que dependa de quién pueda pagarlo.',
        'Que ambos surgieron por decisión de un partido político que buscaba ganar la siguiente elección.',
        'Que en los dos casos la demanda quedó resuelta el mismo día en que comenzó la movilización.',
        'Que los dos exigieron principalmente empleos dentro de las empresas encargadas del agua.' ],
        en:[
        'That they claim access to water as a right the State must guarantee, and not as a service depending on who can pay for it.',
        'That both arose from a decision of a political party seeking to win the next election.',
        'That in both cases the demand was settled the same day the mobilization began.',
        'That both demanded mainly jobs inside the companies in charge of water.' ] },
      correct:0,
      hint:{ es:'Busca qué idea de fondo comparten los dos casos sobre quién debe garantizar el agua.',
             en:'Look for the underlying idea both cases share about who must guarantee water.' },
      explanation:{ es:'Los dos casos parten de la misma idea: el agua es una condición de vida digna y el Estado debe asegurarla para toda la población. Por eso uno rechaza que el servicio quede sujeto a un negocio privado y el otro exige que el suministro llegue a todas las colonias. Las circunstancias cambian, el derecho reclamado es el mismo.',
                    en:'Both cases start from the same idea: water is a condition of a dignified life and the State must secure it for the whole population. That is why one rejects the service being left to a private business and the other demands supply reaching every neighborhood. Circumstances differ, the right claimed is the same.' } },
    { title:{ es:'La tierra en dos países', en:'Land in two countries' }, showWork:false,
      stmt:{ es:'El Movimiento de Trabajadores Rurales Sin Tierra, en Brasil, y las comunidades campesinas que en México exigen tierra y apoyos para sembrar comparten un rasgo de fondo. ¿Cuál es?',
             en:'The Landless Rural Workers Movement, in Brazil, and the farming communities that in Mexico demand land and support to sow share an underlying trait. Which one?' },
      options:{ es:[
        'Que reclaman el acceso a la tierra como la condición para vivir de su propio trabajo, no como una ayuda momentánea.',
        'Que ambos buscan que las familias campesinas se trasladen a las ciudades para conseguir un empleo.',
        'Que los dos movimientos se formaron en el mismo año y coordinan entre sí todas sus decisiones.',
        'Que ambos exigen que el gobierno les entregue alimentos cada mes en lugar de tierra para sembrar.' ],
        en:[
        'That they claim access to land as the condition for living from their own work, not as momentary aid.',
        'That both seek for farming families to move to the cities to find a job.',
        'That both movements were formed in the same year and coordinate all their decisions with each other.',
        'That both demand the government deliver them food each month instead of land to farm.' ] },
      correct:0,
      hint:{ es:'Piensa para qué sirve la tierra en la vida de esas familias y qué diferencia hay entre eso y una despensa.',
             en:'Think about what land is for in those families lives and what difference there is between that and a food package.' },
      explanation:{ es:'En los dos casos la tierra no se pide como una ayuda pasajera sino como el medio para producir e ingresar de manera permanente. Por eso se trata de un derecho económico: sin tierra, esas familias dependen de apoyos que pueden terminarse en cualquier momento.',
                    en:'In both cases land is not requested as passing aid but as the means to produce and earn permanently. That is why it is an economic right: without land, those families depend on supports that can end at any moment.' } }
  ], rng), rng);

  /* ── PROBLEMA 10 ────────────────────────────────────────────── */
  addProblem(pick([
    { title:{ es:'Por qué han sido decisivos', en:'Why they have been decisive' }, showWork:false,
      stmt:{ es:'Se afirma que los movimientos sociales han sido decisivos para ampliar los derechos en México y en América Latina. ¿Cuál es la mejor razón para sostener esa afirmación?',
             en:'It is said that social movements have been decisive in widening rights in Mexico and Latin America. What is the best reason to hold that statement?' },
      options:{ es:[
        'Porque muchos derechos que hoy están en las leyes fueron primero demandas de grupos organizados que no los tenían reconocidos.',
        'Porque los movimientos sociales sustituyen a las instituciones y toman las decisiones en lugar de ellas.',
        'Porque cada movimiento social logra que se apruebe una ley nueva en el mismo año en que aparece.',
        'Porque las leyes se escriben pensando en los grupos que nunca se han organizado para exigir algo.' ],
        en:[
        'Because many rights that today sit in the law were first demands of organized groups that did not hold them.',
        'Because social movements replace institutions and make decisions in their place.',
        'Because every social movement gets a new law passed in the same year it appears.',
        'Because laws are written thinking of the groups that have never organized to demand anything.' ] },
      correct:0,
      hint:{ es:'Recuerda de dónde salieron el voto de las mujeres, los derechos de los pueblos indígenas o la vivienda tras el sismo.',
             en:'Recall where the female vote, Indigenous peoples rights or housing after the earthquake came from.' },
      explanation:{ es:'El voto femenino, el reconocimiento de los pueblos indígenas o la vivienda para damnificados no aparecieron solos en la ley: fueron demandas sostenidas por grupos organizados hasta que se reconocieron. Los movimientos no sustituyen a las instituciones ni obtienen resultados inmediatos, pero sí colocan en la agenda pública lo que faltaba.',
                    en:'The female vote, the recognition of Indigenous peoples or housing for earthquake survivors did not appear in the law on their own: they were demands sustained by organized groups until they were recognized. Movements do not replace institutions or get immediate results, but they do put on the public agenda what was missing.' } },
    { title:{ es:'Un derecho escrito basta', en:'A written right is enough' }, showWork:false,
      stmt:{ es:'Una persona sostiene lo siguiente: “Los derechos ya están en la Constitución, así que los movimientos sociales ya no hacen falta”. ¿Qué argumento responde mejor a esa afirmación?',
             en:'Someone argues the following: “Rights are already in the Constitution, so social movements are no longer needed”. Which argument best answers that statement?' },
      options:{ es:[
        'Que un derecho escrito no se ejerce solo: alguien tiene que exigir que se cumpla, y esa es la tarea de los grupos organizados.',
        'Que la Constitución se modifica cada año y por eso conviene mantener grupos vigilando su redacción.',
        'Que los movimientos sociales solo son necesarios en los países que no cuentan con una Constitución escrita.',
        'Que los derechos escritos pierden validez si no se organiza una manifestación cada cierto tiempo.' ],
        en:[
        'That a written right does not exercise itself: somebody has to demand it be fulfilled, and that is the task of organized groups.',
        'That the Constitution is amended every year and that is why groups should keep watch over its wording.',
        'That social movements are only needed in countries that do not have a written Constitution.',
        'That written rights lose validity if a demonstration is not organized every so often.' ] },
      correct:0,
      hint:{ es:'Distingue entre que un derecho esté reconocido y que las personas puedan ejercerlo todos los días.',
             en:'Tell apart a right being recognized from people being able to exercise it every day.' },
      explanation:{ es:'Que un derecho esté escrito no garantiza que llegue el agua, que haya escuela cerca o que se consulte a una comunidad. La distancia entre el texto y la vida diaria se acorta cuando hay grupos organizados que documentan, exigen y dan seguimiento. Esa es la función que los movimientos siguen cumpliendo.',
                    en:'A right being written down does not guarantee that water arrives, that there is a school nearby or that a community is consulted. The distance between the text and daily life shrinks when organized groups document, demand and follow up. That is the role movements keep playing.' } }
  ], rng), rng);
}
</script>

<!-- LIAXA ANALYTICS -->
<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbzLGV15JRTPs9bbSvHRLfgOXeT9oUExDf1AH546WOwq5tYxXSdhX212OWi_bTJfMGx9/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'Movimientos Sociales en México y América Latina';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
</body>
</html>
