    '<div class="rules-grid">' +
      rcard(L({ es:'Marco de referencia', en:'Frame of reference' }), L({ es:'respecto a qué', en:'relative to what' }), L({ es:'sin él, decir que algo se mueve o está quieto no significa nada', en:'without it, saying something moves or is still means nothing' })) +
      rcard(L({ es:'Distancia recorrida', en:'Distance travelled' }), L({ es:'siempre positiva', en:'always positive' }), L({ es:'suma todo el camino, incluidas las idas y las vueltas', en:'adds the whole path, including trips out and back' })) +
      rcard(L({ es:'Desplazamiento', en:'Displacement' }), L({ es:'con signo', en:'with a sign' }), L({ es:'compara solo el punto final con el de partida y puede valer cero', en:'compares only the end point with the start and can be zero' })) +
    '</div>' +
    '<div class="callout"><p>' + L({
      es:'Un corredor que da una vuelta completa a una pista de 400 m recorre 400 m de camino y termina exactamente donde empezó: su desplazamiento es cero. Las dos medidas describen el mismo viaje y responden preguntas distintas.',
      en:'A runner who completes one lap of a 400 m track covers 400 m of path and finishes exactly where they started: their displacement is zero. The two measures describe the same trip and answer different questions.'
    }) + '</p></div>'
  );
  w1(rng, widgetHost(s1, 'w_pista'));
  addProblem(rng, mkP1(rng));
  addProblem(rng, mkP2(rng));

  /* ══ CONCEPTO 2 ══ */
  var s2 = sec(
    L({ es:'Concepto 2', en:'Concept 2' }),
    L({ es:'Rapidez, velocidad y el movimiento uniforme', en:'Speed, velocity and uniform motion' }),
    '<p>' + L({
      es:'La rapidez indica cuántos metros avanza un cuerpo en cada segundo y se obtiene repartiendo el camino recorrido entre el tiempo empleado. La velocidad añade un dato más: la dirección y el sentido en que ocurre ese avance. Por eso dos ciclistas pueden llevar la misma rapidez y velocidades distintas si van hacia lados opuestos.',
      en:'Speed says how many metres a body covers each second and comes from sharing the path travelled over the time taken. Velocity adds one more piece of information: the direction and sense in which that advance happens. That is why two cyclists can have the same speed and different velocities if they go opposite ways.'
    }) + '</p>' +
    '<p>' + L({
      es:'Cuando un cuerpo se mueve en línea recta y su velocidad no cambia, el movimiento se llama rectilíneo uniforme. Su marca característica es que en intervalos de tiempo iguales avanza distancias iguales, de modo que en una gráfica de posición contra tiempo sus puntos quedan alineados en una recta.',
      en:'When a body moves in a straight line and its velocity does not change, the motion is called uniform straight line motion. Its signature is that in equal time intervals it covers equal distances, so on a position against time graph its points line up along a straight line.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Rapidez', en:'Speed' }), L({ es:'metros por segundo', en:'metres per second' }), L({ es:'solo dice qué tan rápido, no dice hacia dónde', en:'it only says how fast, not which way' })) +
      rcard(L({ es:'Velocidad', en:'Velocity' }), L({ es:'valor y dirección', en:'size and direction' }), L({ es:'cambia si cambia el valor o si cambia la dirección', en:'it changes if the size changes or if the direction changes' })) +
      rcard(L({ es:'Movimiento uniforme', en:'Uniform motion' }), L({ es:'velocidad constante', en:'constant velocity' }), L({ es:'distancias iguales en tiempos iguales, sin aceleración', en:'equal distances in equal times, with no acceleration' })) +
    '</div>' +
    '<div class="callout"><p>' + L({
      es:'Una misma meta se alcanza con muchas parejas de rapidez y tiempo: ir despacio durante mucho rato o ir de prisa durante poco. En el laboratorio de la pista puedes buscar esas parejas y ver que la meta no distingue cuál usaste.',
      en:'The same goal is reached with many pairs of speed and time: going slowly for a long while or fast for a short one. In the track laboratory you can look for those pairs and see that the goal does not care which one you used.'
    }) + '</p></div>'
  );
  w2(rng, widgetHost(s2, 'w_lab'));
  addProblem(rng, mkP3(rng));
  addProblem(rng, mkP4(rng));

  /* ══ CONCEPTO 3 ══ */
  var s3 = sec(
    L({ es:'Concepto 3', en:'Concept 3' }),
    L({ es:'La aceleración y su signo', en:'Acceleration and its sign' }),
    '<p>' + L({
      es:'La aceleración mide qué tanto cambia la velocidad en cada segundo. No dice si un cuerpo va rápido o lento: un camión a 90 kilómetros por hora con el velocímetro fijo tiene aceleración cero, y una bicicleta que apenas arranca sí está acelerando.',
      en:'Acceleration measures how much the velocity changes each second. It does not say whether a body goes fast or slow: a truck at 90 kilometres per hour with a steady speedometer has zero acceleration, and a bicycle that is just pulling away is accelerating.'
    }) + '</p>' +
    '<p>' + L({
      es:'El signo de la aceleración indica hacia dónde apunta ese cambio. Si elegimos como positivo el sentido en el que avanza el cuerpo, ganar velocidad da una aceleración positiva y frenar da una aceleración negativa, porque el cambio apunta en contra del avance. Un valor negativo no significa ir hacia atrás: significa que la velocidad está disminuyendo.',
      en:'The sign of the acceleration shows which way that change points. If we choose the direction the body moves in as positive, gaining velocity gives a positive acceleration and braking gives a negative one, because the change points against the motion. A negative value does not mean going backwards: it means the velocity is decreasing.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Aceleración positiva', en:'Positive acceleration' }), L({ es:'gana velocidad', en:'gains velocity' }), L({ es:'el cambio apunta en el mismo sentido que el movimiento', en:'the change points the same way as the motion' })) +
      rcard(L({ es:'Aceleración negativa', en:'Negative acceleration' }), L({ es:'pierde velocidad', en:'loses velocity' }), L({ es:'el cambio apunta en contra del avance, es el frenado', en:'the change points against the motion, this is braking' })) +
      rcard(L({ es:'Aceleración cero', en:'Zero acceleration' }), L({ es:'velocidad constante', en:'constant velocity' }), L({ es:'ni gana ni pierde, aunque vaya muy rápido', en:'it neither gains nor loses, even at high speed' })) +
    '</div>' +
    '<div class="callout"><p>' + L({
      es:'Una gráfica de velocidad contra tiempo lo cuenta de un vistazo: una línea que sube marca un tramo que gana velocidad, una horizontal marca velocidad constante y una que baja marca un frenado.',
      en:'A velocity against time graph tells it at a glance: a rising line marks a stretch that gains velocity, a flat one marks constant velocity and a falling one marks braking.'
    }) + '</p></div>'
  );
  w3(rng, widgetHost(s3, 'w_graf'));
  addProblem(rng, mkP5(rng));
  addProblem(rng, mkP6(rng));

  /* ══ CONCEPTO 4 ══ */
  var s4 = sec(
    L({ es:'Concepto 4', en:'Concept 4' }),
    L({ es:'Tipos de movimiento según la trayectoria', en:'Types of motion according to the path' }),
    '<p>' + L({
      es:'Los movimientos también se clasifican por la forma del camino que sigue el cuerpo. El rectilíneo recorre una línea recta, como un elevador entre dos pisos. El circular describe una circunferencia alrededor de un centro, como las aspas de un ventilador. El oscilatorio va y viene repitiendo el mismo recorrido alrededor de un punto, como un péndulo o un columpio.',
      en:'Motions are also classified by the shape of the path the body follows. Straight line motion runs along a straight line, like a lift between two floors. Circular motion describes a circle around a centre, like the blades of a fan. Oscillating motion goes back and forth repeating the same path around a point, like a pendulum or a swing.'
    }) + '</p>' +
    '<p>' + L({
      es:'El ondulatorio es distinto de los otros tres: lo que viaja no es la materia sino una perturbación que se transmite, como las olas de un lago o el sonido que llega a tu oído. Además, cualquiera de estos movimientos puede ser uniforme, si la velocidad no cambia, o variado, si cambia. El caso curioso es el circular uniforme: la rapidez se mantiene, pero la dirección se desvía a cada instante, y ese cambio de dirección ya es una aceleración.',
      en:'Wave motion is different from the other three: what travels is not matter but a disturbance that is passed on, like the waves on a lake or the sound reaching your ear. Besides, any of these motions can be uniform, if the velocity does not change, or varied, if it does. The curious case is uniform circular motion: the speed stays the same, but the direction bends at every instant, and that change of direction is already an acceleration.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Rectilíneo', en:'Straight line' }), L({ es:'camino recto', en:'straight path' }), L({ es:'un elevador entre dos pisos, una canica por un pasillo', en:'a lift between two floors, a marble along a corridor' })) +
      rcard(L({ es:'Circular', en:'Circular' }), L({ es:'circunferencia', en:'circle' }), L({ es:'la rueda de la fortuna y las aspas de un ventilador', en:'the ferris wheel and the blades of a fan' })) +
      rcard(L({ es:'Oscilatorio', en:'Oscillating' }), L({ es:'ida y vuelta', en:'back and forth' }), L({ es:'un péndulo, un columpio, una cuerda de guitarra', en:'a pendulum, a swing, a guitar string' })) +
      rcard(L({ es:'Ondulatorio', en:'Wave' }), L({ es:'viaja la perturbación', en:'the disturbance travels' }), L({ es:'las olas de un lago y el sonido en el aire', en:'the waves on a lake and sound in the air' })) +
    '</div>'
  );
  w4(rng, widgetHost(s4, 'w_tipos'));
  addProblem(rng, mkP7(rng));

  /* ══ CONCEPTO 5 ══ */
  var s5 = sec(
    L({ es:'Concepto 5', en:'Concept 5' }),
    L({ es:'Fricción y fuerzas en equilibrio', en:'Friction and balanced forces' }),
    '<p>' + L({
      es:'Cuando dos superficies se tocan aparece la fricción, una fuerza que siempre se opone al deslizamiento o al intento de deslizamiento. Su tamaño depende de qué tan ásperas son las superficies: la misma caja necesita mucho menos empuje sobre loseta pulida que sobre una alfombra gruesa.',
      en:'When two surfaces touch, friction appears, a force that always opposes sliding or the attempt to slide. Its size depends on how rough the surfaces are: the same box needs much less push on polished tiles than on a thick carpet.'
    }) + '</p>' +
    '<p>' + L({
      es:'Se dice que las fuerzas están en equilibrio cuando se compensan entre sí y la fuerza neta vale cero. En ese caso la velocidad no cambia, y eso permite dos situaciones: el cuerpo está quieto y sigue quieto, o el cuerpo se desliza y sigue con la misma velocidad. Mantener un movimiento parejo no exige una fuerza mayor que la fricción, solo una que la iguale.',
      en:'Forces are said to be in equilibrium when they cancel each other and the net force is zero. In that case the velocity does not change, and that allows two situations: the body is still and stays still, or the body slides and keeps the same velocity. Keeping a steady motion does not require a force greater than friction, only one that matches it.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Fricción', en:'Friction' }), L({ es:'se opone al deslizamiento', en:'opposes sliding' }), L({ es:'crece con la aspereza de las superficies en contacto', en:'grows with the roughness of the surfaces in contact' })) +
      rcard(L({ es:'Fuerza neta cero', en:'Zero net force' }), L({ es:'equilibrio', en:'equilibrium' }), L({ es:'reposo o movimiento con la misma velocidad, sin aceleración', en:'rest or motion at the same velocity, with no acceleration' })) +
      rcard(L({ es:'Fuerza neta distinta de cero', en:'Non zero net force' }), L({ es:'aceleración', en:'acceleration' }), L({ es:'la velocidad cambia de valor o de dirección', en:'the velocity changes in size or in direction' })) +
    '</div>' +
    '<div class="callout"><p>' + L({
      es:'Sin fricción no podrías caminar ni frenar una bicicleta, pero con demasiada fricción arrastrar un mueble se vuelve imposible. En la mesa de fuerzas puedes buscar el empuje exacto que deja la fuerza neta en cero sobre cada superficie.',
      en:'Without friction you could not walk or brake a bicycle, but with too much friction dragging a piece of furniture becomes impossible. On the force table you can look for the exact push that leaves the net force at zero on each surface.'
    }) + '</p></div>'
  );
  w5(rng, widgetHost(s5, 'w_fuerzas'));
  addProblem(rng, mkP8(rng));

  /* ══ CIERRE ══ */
  sec(
    L({ es:'Cierre', en:'Closing' }),
    L({ es:'Todo junto', en:'Everything together' }),
    '<p>' + L({
      es:'Las dos escenas que siguen mezclan lo que trabajaste: medir un viaje completo, leer un cambio de velocidad y decidir qué tipo de movimiento hay detrás.',
      en:'The two scenes that follow mix together what you have worked on: measuring a full trip, reading a change of velocity and deciding what type of motion lies behind it.'
    }) + '</p>'
  );
  addProblem(rng, mkP9(rng));
  addProblem(rng, mkP10(rng));
}
</script>

<!-- LIAXA ANALYTICS -->
<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbztwM8nSIbA895DNHtDQGU9fYXDiK9QpxSCUjnBwP1XkAZtJ2B2eIUOgGHmZz8wVQSx/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
</body>
