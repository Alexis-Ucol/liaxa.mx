<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neutralización con Modelo de Arrhenius; Beneficios y Riesgos</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; text-align: justify; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Neutralización con Modelo de Arrhenius; Beneficios y Riesgos</div>
    <div class="wcourse" id="wcourse-el">Química · 3° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Neutralización con Modelo de Arrhenius; Beneficios y Riesgos</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="sbtn" id="dlBtn" onclick="generatePDF()" style="max-width:280px;margin:0 auto;">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   CENTRALIZED SCHOOL CONFIG (Rule 16) — ships UNBRANDED (Rule 11).
   The ONLY rebranding point. build_all.py substitutes these exact fields
   (BRAND_FIELDS / RGB_FIELDS / logo*) downstream; :root/dark stay as fallback.
   Neutral defaults below == the static :root/dark values, so unbranded == no-op.
   ══════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:'#243c54', primaryDark:'#182a3b', primaryBg:'#eaeef3',
  accent:'#24549c', accentBg:'#e2ebf8',
  darkPrimary:'#5e85ab', darkPrimaryDark:'#8badce', darkPrimaryBg:'#152331',

function saveSession() {
  if (!studentData.name) return;
  var drawings = [], texts = [], photos = [];
  problems.forEach(function(p, i) {
    var dc = document.getElementById('dc' + i);
    if (dc && dc.width) {
      var blank = document.createElement('canvas');
      blank.width = dc.width; blank.height = dc.height;
      drawings.push(dc.toDataURL() === blank.toDataURL() ? null : dc.toDataURL('image/png'));
    } else { drawings.push(null); }
    var ta = document.getElementById('ta' + i);
    texts.push(ta ? ta.value : '');
    var pp = document.getElementById('pp' + i);
    photos.push((pp && pp.src && pp.src.indexOf('data:') === 0) ? pp.src : null);
  });
  var state = {
    name: studentData.name, group: studentData.group,
    answeredCount: answeredCount, correctCount: correctCount,
    choices: problems.map(function(p) { return p.studentChoice; }),
    drawings: drawings, texts: texts, photos: photos
  };
  try { localStorage.setItem(lsKey(), JSON.stringify(state)); } catch(e) {}
}

function loadSession(name, group) {
  var key = 'qui3_t11_g02__' + (name + '__' + group).replace(/\s+/g, '_');
  try { var r = localStorage.getItem(key); return r ? JSON.parse(r) : null; } catch(e) { return null; }
}

function restoreSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  var saved = loadSession(name, group);
  if (!saved) return;
  document.getElementById('restoreBar').style.display = 'none';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = currentAttempt(name, group);
  buildLesson(seededRng(name + group + att));
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
  saved.choices.forEach(function(choice, idx) {
    if (choice !== null && choice !== undefined) confirmMC(idx, choice);
  });
  setTimeout(function() {
    if (saved.drawings) {
      saved.drawings.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var dc = document.getElementById('dc' + i);
        if (!dc || !dc.width) return;
        var img = new Image();
        img.onload = function() {
          var dpr = window.devicePixelRatio || 1;
          dc.getContext('2d').drawImage(img, 0, 0, dc.width / dpr, dc.height / dpr);
        };
        img.src = dataUrl;
      });
    }
    if (saved.texts) {
      saved.texts.forEach(function(text, i) {
        if (!text) return;
        var ta = document.getElementById('ta' + i);
        if (ta) ta.value = text;
      });
    }
    if (saved.photos) {
      saved.photos.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var pp = document.getElementById('pp' + i);
        if (!pp) return;
        pp.src = dataUrl; pp.style.display = 'block';
        var pz = document.getElementById('pz' + i);
        if (pz) pz.style.opacity = '0.4';
      });
    }
  }, 300);
}

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

async function generatePDF() {
  var btn = document.getElementById('dlBtn');
  btn.textContent = 'Generando PDF…';
  btn.disabled = true;

  var jspdf   = window.jspdf;
  var doc     = new jspdf.jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });
  var PW      = 215.9;
  var M       = 18;
  var TW      = PW - M * 2;
  var PH      = doc.internal.pageSize.height;
  var name    = studentData.name;
  var group   = studentData.group;
  var total   = problems.length;
  var pct     = Math.round(correctCount / total * 100);
  var dateStr = new Date().toLocaleString('es-MX', { dateStyle:'long', timeStyle:'short' });

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS — INJECTION BLOCK ─────────────────────────────────────────
  //   Match these RGB values to --green and --gold above.
  //   PRIMARY  → pBR, pBG, pBB
  //   ACCENT   → pAR, pAG, pAB
  // ──────────────────────────────────────────────────────────────────────────
  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;  // PRIMARY (from SCHOOL, Rule 16)
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;   // ACCENT (from SCHOOL, Rule 16)

  function pdfText(html) {
    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/\u2192/g,'->').replace(/\u2212/g,'-').replace(/\u00b2/g,'^2')
      .replace(/\u00b3/g,'^3').replace(/\u00d7/g,'x').replace(/\u00f7/g,'/')
      .replace(/\u2260/g,'!=').replace(/\u2264/g,'<=').replace(/\u2265/g,'>=')
      .replace(/\u221a/g,'sqrt').replace(/\u03c0/g,'pi').replace(/\u2026/g,'...')
      .replace(/\s+/g,' ').trim();
  }

  // ── PORTADA: orange line / white logo strip / orange line / blue band ──
  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,2,'F');   // top accent line
  doc.setFillColor(255,255,255); doc.rect(0,2,PW,26,'F');                               // white logo strip
  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,28,PW,2,'F');  // bottom accent line
  doc.setFillColor(pBR,pBG,pBB); doc.rect(0,30,PW,34,'F');       // blue header band

  if (SCHOOL.logoLeftB64) {
    var fmtL = SCHOOL.logoLeftB64.indexOf('/9j/') > -1 ? 'JPEG' : 'PNG';
    try { doc.addImage(SCHOOL.logoLeftB64, fmtL, M, 4, 48, 22); } catch(e) {}
  }
  if (SCHOOL.logoRightB64) {
    var fmtR = SCHOOL.logoRightB64.indexOf('/9j/') > -1 ? 'JPEG' : 'PNG';
    try { doc.addImage(SCHOOL.logoRightB64, fmtR, 130, 4, 48, 22); } catch(e) {}
  }

  var lx = PW - M - 36;
  var ly = 10;
  doc.setDrawColor(pBR,pBG,pBB); doc.setLineWidth(0.7);
  doc.lines([[2.57-1.03,4.63-6.17],[4.11-2.57,5.14-4.63],[5.66-4.11,2.57-5.14]], lx+1.03, ly+6.17);
  doc.setFillColor(pAR,pAG,pAB); doc.circle(lx+5.66, ly+2.57, 0.9, 'F');
  doc.setDrawColor(pAR,pAG,pAB); doc.setLineWidth(0.7);
  doc.line(lx+8.23, ly+1.54, lx+8.23, ly+7.2);
  doc.setTextColor(pBR,pBG,pBB); doc.setFontSize(11); doc.setFont('helvetica','bold');
  doc.text('LIAXA', lx+10, ly+6.8);

  // Guide title + date inside the blue band
  doc.setTextColor(232,238,247); doc.setFontSize(19); doc.setFont('helvetica','bold');
  doc.text(t('wtitle'), M, 49);
  doc.setTextColor(150,165,200); doc.setFontSize(8); doc.setFont('helvetica','normal');
  doc.text(dateStr, M, 59);

  // ── Student info card (name + group only — código goes to footer) ──
  doc.setFillColor(237,240,245); doc.roundedRect(M,72,TW,20,3,3,'F');
  doc.setTextColor(130,140,160); doc.setFontSize(8.5); doc.setFont('helvetica','bold');
  doc.text('ALUMNO', M+4, 79); doc.text('GRUPO', 130, 79);
  doc.setTextColor(20,24,32); doc.setFontSize(11); doc.setFont('helvetica','bold');
  doc.text(name, M+4, 87); doc.text(group, 130, 87);

  // ── Score box ──
  var sc = pct>=70?[26,106,74]:pct>=50?[224,123,26]:[176,48,16];
  doc.setFillColor(255,255,255); doc.roundedRect(M,100,TW,34,4,4,'F');

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 1 :: el vaso de disociación
   Cae una sustancia al agua y el estudiante decide qué iones quedan sueltos.
   Las fichas se encienden y se apagan cuantas veces quiera; el vaso muestra en
   todo momento lo que lleva puesto. La devolución señala qué sobra o qué falta.
   ══════════════════════════════════════════════════════════════════════════ */
var ION_LAB = {
  H:'H<sup>+</sup>', OH:'OH<sup>-</sup>', Na:'Na<sup>+</sup>', K:'K<sup>+</sup>',
  Ca:'Ca<sup>2+</sup>', Cl:'Cl<sup>-</sup>', NO3:'NO<sub>3</sub><sup>-</sup>', SO4:'SO<sub>4</sub><sup>2-</sup>'
};
var ION_NOM = {
  H:{ es:'hidrógeno', en:'hydrogen' }, OH:{ es:'hidróxido', en:'hydroxide' },
  Na:{ es:'sodio', en:'sodium' }, K:{ es:'potasio', en:'potassium' },
  Ca:{ es:'calcio', en:'calcium' }, Cl:{ es:'cloruro', en:'chloride' },
  NO3:{ es:'nitrato', en:'nitrate' }, SO4:{ es:'sulfato', en:'sulfate' }
};
var SUSTANCIAS = [
  { f:'HCl', nom:{ es:'ácido clorhídrico', en:'hydrochloric acid' }, ions:['H','Cl'], tipo:'ac' },
  { f:'HNO<sub>3</sub>', nom:{ es:'ácido nítrico', en:'nitric acid' }, ions:['H','NO3'], tipo:'ac' },
  { f:'H<sub>2</sub>SO<sub>4</sub>', nom:{ es:'ácido sulfúrico', en:'sulfuric acid' }, ions:['H','SO4'], tipo:'ac' },
  { f:'NaOH', nom:{ es:'hidróxido de sodio', en:'sodium hydroxide' }, ions:['Na','OH'], tipo:'ba' },
  { f:'KOH', nom:{ es:'hidróxido de potasio', en:'potassium hydroxide' }, ions:['K','OH'], tipo:'ba' },
  { f:'Ca(OH)<sub>2</sub>', nom:{ es:'hidróxido de calcio', en:'calcium hydroxide' }, ions:['Ca','OH'], tipo:'ba' }
];

function wDisocia(rng, host){
  var acidos = shuffle(SUSTANCIAS.filter(function(s){ return s.tipo === 'ac'; }), rng);
  var bases  = shuffle(SUSTANCIAS.filter(function(s){ return s.tipo === 'ba'; }), rng);
  var tercera = rng() < 0.5 ? acidos[1] : bases[1];
  var RONDAS = shuffle([acidos[0], bases[0], tercera], rng);
  var st = { r:0, sel:[], tries:0, done:false, chips:[] };

  function say(cls, msg){
    var fb = host.querySelector('[data-r="fb"]');
    if (fb){ fb.className = 'gw-fb ' + cls; fb.innerHTML = msg; }
  }

  function paint(){
    host.querySelectorAll('[data-chip]').forEach(function(b){
      var i = parseInt(b.getAttribute('data-chip'), 10);
      b.classList.toggle('sel', st.sel.indexOf(i) !== -1);
    });
    var vaso = host.querySelector('[data-r="vaso"]');
    if (!vaso) return;
    if (!st.sel.length){
      vaso.innerHTML = '<span class="ds-empty">' + L({ es:'El agua sigue sin iones. Toca las fichas para soltarlos.', en:'The water still has no ions. Tap the chips to release them.' }) + '</span>';
      return;
    }
    vaso.innerHTML = st.sel.map(function(i){ return '<span class="ds-ion">' + ION_LAB[st.chips[i]] + '</span>'; }).join('');
  }

  function render(){
    if (st.done){
      host.innerHTML =
        '<div class="gw-h">' + L({ es:'Vaso de disociación', en:'Dissociation glass' }) + '</div>' +
        '<div class="gw-fb good">' + L({
          es:'Recorriste las tres sustancias. La fórmula dice qué iones quedan sueltos, y el ion hidrógeno o el ion hidróxido es el que decide a qué familia pertenece la disolución.',
          en:'You went through the three substances. The formula says which ions are left loose, and the hydrogen ion or the hydroxide ion is what decides which family the solution belongs to.'
        }) + '</div>';
      return;
    }
    var s = RONDAS[st.r];
    var sobrantes = shuffle(Object.keys(ION_LAB).filter(function(k){ return s.ions.indexOf(k) === -1; }), rng).slice(0, 3);
    st.chips = shuffle(s.ions.concat(sobrantes), rng);
    st.sel = [];
    st.tries = 0;
    host.innerHTML =
      '<div class="gw-h">' + L({ es:'Vaso de disociación', en:'Dissociation glass' }) + '</div>' +
      '<div class="gw-mini">' + L({
        es:'Cae la sustancia al agua. Toca las fichas de los iones que quedan sueltos y quítalas si cambias de opinión; después comprueba el vaso.',
        en:'The substance falls into the water. Tap the chips of the ions that are left loose and remove them if you change your mind; then check the glass.'
      }) + '</div>' +
      '<div class="gw-prog">' + (st.r + 1) + ' / ' + RONDAS.length + '</div>' +
      '<div class="ds-bottle">' + L(s.nom) + '  (' + s.f + ')</div>' +
      '<div class="nz-chips">' +
        st.chips.map(function(k, i){ return '<button class="nz-chip" data-chip="' + i + '">' + ION_LAB[k] + '</button>'; }).join('') +
      '</div>' +
      '<div class="gw-lbl">' + L({ es:'Lo que hay disuelto en el vaso', en:'What is dissolved in the glass' }) + '</div>' +
      '<div class="ds-glass" data-r="vaso"></div>' +
      '<div class="gw-row"><button class="gw-btn go" data-act="check">' + L({ es:'Comprobar el vaso', en:'Check the glass' }) + '</button></div>' +
      '<div class="gw-fb" data-r="fb">' + L({ es:'Fíjate en los átomos que aparecen escritos en la fórmula.', en:'Look at the atoms written in the formula.' }) + '</div>';
    paint();
  }

  function revelar(){
    var s = RONDAS[st.r];
    st.sel = [];
    st.chips.forEach(function(k, i){ if (s.ions.indexOf(k) !== -1) st.sel.push(i); });
    paint();
    say('warm', L({ es:'Así queda: ', en:'This is how it ends: ' }) + s.f + ' ' + L({ es:'se separa en ', en:'splits into ' }) +
      L(ION_NOM[s.ions[0]]) + ' ' + L({ es:'y ', en:'and ' }) + L(ION_NOM[s.ions[1]]) + '. ' +
      (s.tipo === 'ac'
        ? L({ es:'Como suelta iones hidrógeno, la disolución es ácida.', en:'Since it releases hydrogen ions, the solution is acidic.' })
        : L({ es:'Como suelta iones hidróxido, la disolución es básica.', en:'Since it releases hydroxide ions, the solution is basic.' })));
    st.r++;
    if (st.r >= RONDAS.length) st.done = true;
    setTimeout(render, 2400);
  }

  function check(){
    var s = RONDAS[st.r];
    var elegidos = st.sel.map(function(i){ return st.chips[i]; });
    if (!elegidos.length){
      say('warm', L({ es:'El vaso está vacío: elige primero los iones que crees que se soltaron.', en:'The glass is empty: first choose the ions you think were released.' }));
      return;
    }
    var sobra = elegidos.filter(function(k){ return s.ions.indexOf(k) === -1; });
    var falta = s.ions.filter(function(k){ return elegidos.indexOf(k) === -1; });
    if (!sobra.length && !falta.length){
      say('good', L({ es:'Correcto: ', en:'Correct: ' }) + s.f + ' ' + L({ es:'suelta ', en:'releases ' }) +
        L(ION_NOM[s.ions[0]]) + ' ' + L({ es:'y ', en:'and ' }) + L(ION_NOM[s.ions[1]]) + '. ' +
        (s.tipo === 'ac'
          ? L({ es:'El ion hidrógeno es el que la vuelve ácida.', en:'The hydrogen ion is what makes it acidic.' })
          : L({ es:'El ion hidróxido es el que la vuelve básica.', en:'The hydroxide ion is what makes it basic.' })));
      st.r++;
      if (st.r >= RONDAS.length) st.done = true;
      setTimeout(render, 1900);
      return;
    }
    st.tries++;
    if (st.tries >= 3){ revelar(); return; }
    var clave = s.tipo === 'ac' ? 'H' : 'OH';
    if (sobra.length){
      say('miss', L({ es:'El ion ', en:'The ' }) + L(ION_NOM[sobra[0]]) + L({ es:' no puede salir de esta sustancia: ese átomo no aparece en la fórmula. Quítalo del vaso.', en:' ion cannot come out of this substance: that atom is not in the formula. Take it out of the glass.' }));
    } else if (falta.indexOf(clave) !== -1){
      say('miss', L({
        es:'Falta en el vaso el ion que decide el comportamiento de esta familia. Sin él, la disolución no sería ni ácida ni básica.',
        en:'The glass is missing the ion that decides the behaviour of this family. Without it, the solution would be neither acidic nor basic.'
      }));
    } else {
      say('miss', L({
        es:'Falta el ion que acompaña al que ya pusiste: la fórmula entera se separa, no solo una de sus partes.',
        en:'The ion that goes with the one you already placed is missing: the whole formula splits, not just one of its parts.'
      }));
    }
  }

  host.addEventListener('click', function(e){
    if (st.done) return;
    var act = e.target.closest ? e.target.closest('[data-act]') : null;
    if (act && act.getAttribute('data-act') === 'check'){ check(); return; }
    var b = e.target.closest ? e.target.closest('[data-chip]') : null;
    if (!b) return;
    var i = parseInt(b.getAttribute('data-chip'), 10);
    var at = st.sel.indexOf(i);
    if (at === -1) st.sel.push(i); else st.sel.splice(at, 1);
    paint();
  });

  render();
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 2 :: la sal que resulta
   Cada mezcla de la izquierda deja una sal distinta. El estudiante toca una
   mezcla y luego la sal que cree que se forma; el par correcto se fija en
   verde y el equivocado explica de dónde viene cada mitad del nombre.
   ══════════════════════════════════════════════════════════════════════════ */
var SALES = [
  { ac:{ es:'ácido clorhídrico', en:'hydrochloric acid', f:'HCl' }, ba:{ es:'hidróxido de sodio', en:'sodium hydroxide', f:'NaOH' },
    ani:'Cl', cat:'Na', sal:{ es:'cloruro de sodio', en:'sodium chloride', f:'NaCl' } },
  { ac:{ es:'ácido clorhídrico', en:'hydrochloric acid', f:'HCl' }, ba:{ es:'hidróxido de calcio', en:'calcium hydroxide', f:'Ca(OH)<sub>2</sub>' },
    ani:'Cl', cat:'Ca', sal:{ es:'cloruro de calcio', en:'calcium chloride', f:'CaCl<sub>2</sub>' } },
  { ac:{ es:'ácido nítrico', en:'nitric acid', f:'HNO<sub>3</sub>' }, ba:{ es:'hidróxido de potasio', en:'potassium hydroxide', f:'KOH' },
    ani:'NO3', cat:'K', sal:{ es:'nitrato de potasio', en:'potassium nitrate', f:'KNO<sub>3</sub>' } },
  { ac:{ es:'ácido nítrico', en:'nitric acid', f:'HNO<sub>3</sub>' }, ba:{ es:'hidróxido de sodio', en:'sodium hydroxide', f:'NaOH' },
    ani:'NO3', cat:'Na', sal:{ es:'nitrato de sodio', en:'sodium nitrate', f:'NaNO<sub>3</sub>' } },
  { ac:{ es:'ácido sulfúrico', en:'sulfuric acid', f:'H<sub>2</sub>SO<sub>4</sub>' }, ba:{ es:'hidróxido de potasio', en:'potassium hydroxide', f:'KOH' },
    ani:'SO4', cat:'K', sal:{ es:'sulfato de potasio', en:'potassium sulfate', f:'K<sub>2</sub>SO<sub>4</sub>' } },
  { ac:{ es:'ácido sulfúrico', en:'sulfuric acid', f:'H<sub>2</sub>SO<sub>4</sub>' }, ba:{ es:'hidróxido de calcio', en:'calcium hydroxide', f:'Ca(OH)<sub>2</sub>' },
    ani:'SO4', cat:'Ca', sal:{ es:'sulfato de calcio', en:'calcium sulfate', f:'CaSO<sub>4</sub>' } }
];

function wEmpareja(rng, host){
  var R = shuffle(SALES, rng).slice(0, 4);
  var DER = shuffle(R.map(function(p, i){ return { i:i, sal:p.sal }; }), rng);
  var st = { sel:null, hechos:[], tries:0, done:false };

  function say(cls, msg){
    var fb = host.querySelector('[data-r="fb"]');
    if (fb){ fb.className = 'gw-fb ' + cls; fb.innerHTML = msg; }
  }

  function render(){
    host.innerHTML =
      '<div class="gw-h">' + L({ es:'La sal que resulta', en:'The salt that results' }) + '</div>' +
      '<div class="gw-mini">' + L({
        es:'Cada mezcla produce agua y una sal distinta. Toca una mezcla de la izquierda y después la sal que le corresponde; si te equivocas puedes volver a intentarlo.',
        en:'Each mixture produces water and a different salt. Tap a mixture on the left and then the salt that matches it; if you get it wrong you can try again.'
      }) + '</div>' +
      '<div class="gw-prog">' + st.hechos.length + ' / ' + R.length + '</div>' +
      '<div class="mt-grid">' +
        '<div class="mt-col">' +
          R.map(function(p, i){
            var tied = st.hechos.indexOf(i) !== -1;
            return '<button class="mt-it' + (tied ? ' tied' : (st.sel === i ? ' sel' : '')) + '" data-l="' + i + '">' +
              L(p.ac) + ' + ' + L(p.ba) + '<span class="mt-f">' + p.ac.f + ' + ' + p.ba.f + '</span></button>';
          }).join('') +
        '</div>' +
        '<div class="mt-col">' +
          DER.map(function(d, j){
            var tied = st.hechos.indexOf(d.i) !== -1;
            return '<button class="mt-it' + (tied ? ' tied' : '') + '" data-d="' + j + '">' +
              L(d.sal) + '<span class="mt-f">' + d.sal.f + '</span></button>';
          }).join('') +
        '</div>' +
      '</div>' +
      '<div class="gw-fb" data-r="fb">' + L({
        es:'La primera palabra del nombre viene del ácido y la segunda del metal de la base.',
        en:'The first word of the name comes from the acid and the second from the metal of the base.'
      }) + '</div>';
    if (st.done){
      say('good', L({
        es:'Las cuatro mezclas quedaron emparejadas. En todas apareció agua, y lo único que cambió fue la sal: el ion que traía el ácido junto al metal que traía la base.',
        en:'The four mixtures are matched. Water appeared in all of them, and the only thing that changed was the salt: the ion the acid brought together with the metal the base brought.'
      }));
    }
  }

  function revelar(){
    st.hechos = R.map(function(_, i){ return i; });
    st.done = true;
    render();
    say('warm', L({
      es:'Así quedan las cuatro parejas. Lee cada sal en voz alta: la primera palabra repite al ion del ácido y la segunda al metal de la base.',
      en:'This is how the four pairs end up. Read each salt aloud: the first word repeats the ion of the acid and the second the metal of the base.'
    }));
  }

  host.addEventListener('click', function(e){
    if (st.done) return;
    var li = e.target.closest ? e.target.closest('[data-l]') : null;
    if (li){
      var i = parseInt(li.getAttribute('data-l'), 10);
      if (st.hechos.indexOf(i) !== -1) return;
      st.sel = (st.sel === i) ? null : i;
      render();
      return;
    }
    var di = e.target.closest ? e.target.closest('[data-d]') : null;
    if (!di) return;
    var j = parseInt(di.getAttribute('data-d'), 10);
    var d = DER[j];
    if (st.hechos.indexOf(d.i) !== -1) return;
    if (st.sel === null){
      say('warm', L({ es:'Elige primero una mezcla de la izquierda.', en:'First choose a mixture on the left.' }));
      return;
    }
    var p = R[st.sel];
    if (d.i === st.sel){
      st.hechos.push(st.sel);
      st.sel = null;
      if (st.hechos.length === R.length) st.done = true;
      render();
      if (!st.done) say('good', L({ es:'Emparejada: ', en:'Matched: ' }) + L(p.sal) + L({ es:' y agua.', en:' and water.' }));
      return;
    }
    st.tries++;
    if (st.tries >= 3){ revelar(); return; }
    var elegida = R[d.i];
    var msg;
    if (elegida.ani !== p.ani){
      msg = L({ es:'Esa sal es un ', en:'That salt is a ' }) + L(ION_NOM[elegida.ani]) +
            L({ es:', pero el ácido de tu mezcla aporta ', en:', but the acid in your mixture provides ' }) + L(ION_NOM[p.ani]) +
            L({ es:'. La primera palabra del nombre la pone el ácido.', en:'. The first word of the name is set by the acid.' });
    } else {
      msg = L({ es:'El ion del ácido sí coincide, pero el metal no: tu mezcla lleva ', en:'The ion of the acid does match, but the metal does not: your mixture carries ' }) +
            L(ION_NOM[p.cat]) + L({ es:' y esa sal lleva ', en:' and that salt carries ' }) + L(ION_NOM[elegida.cat]) +
            L({ es:'. El metal lo pone la base.', en:'. The metal is set by the base.' });
    }
    st.sel = null;
    render();
    say('miss', msg);
  });

  render();
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 3 :: la bureta y el punto de equivalencia
   El estudiante agrega base gota a gota con un deslizador. Las cuentas de
   iones y el color del tubo cambian mientras arrastra, así que ve venir el
   punto de equivalencia antes de fijar la lectura.
   ══════════════════════════════════════════════════════════════════════════ */
var COMBOS = [
  { k:10, ca:2, cb:1 }, { k:10, ca:1, cb:2 }, { k:15, ca:3, cb:1 },
  { k:10, ca:1, cb:3 }, { k:20, ca:2, cb:1 }, { k:20, ca:1, cb:2 }
];

function wTitula(rng, host){
  var R = shuffle(COMBOS, rng).slice(0, 3);
  var st = { r:0, tries:0, done:false, v:0 };

  function datos(){
    var c = R[st.r];
    return { va:c.k * c.cb, ca:c.ca, cb:c.cb, vb:c.k * c.ca, H:c.k * c.ca * c.cb, max:2 * c.k * c.ca };
  }

  function say(cls, msg){
    var fb = host.querySelector('[data-r="fb"]');
    if (fb){ fb.className = 'gw-fb ' + cls; fb.innerHTML = msg; }
  }

  function pintar(){
    var d = datos();
    var oh = st.v * d.cb;
    var liq = host.querySelector('[data-r="liq"]');
    var estado = host.querySelector('[data-r="estado"]');
    var lect = host.querySelector('[data-r="lect"]');
    if (lect){
      lect.innerHTML =
        '<span>' + L({ es:'base agregada: ', en:'base added: ' }) + st.v + ' mL</span>' +
        '<span>' + L({ es:'iones hidróxido: ', en:'hydroxide ions: ' }) + oh + '</span>' +
        '<span>' + L({ es:'iones hidrógeno: ', en:'hydrogen ions: ' }) + d.H + '</span>';
    }
    if (liq) liq.className = 'ti-liq ' + (oh > d.H ? 'c-rosa' : (oh === d.H ? 'c-neu' : 'c-inc'));
    if (estado){
      if (oh < d.H){
        estado.textContent = L({ es:'Sin neutralizar quedan ', en:'Still unneutralized: ' }) + (d.H - oh) +
          L({ es:' unidades de ion hidrógeno: la mezcla sigue ácida.', en:' units of hydrogen ion: the mixture is still acidic.' });
      } else if (oh === d.H){
        estado.textContent = L({ es:'Cada ion hidrógeno encontró un ion hidróxido: aparece el primer rosa que no se va al agitar.', en:'Every hydrogen ion found a hydroxide ion: the first pink that does not fade on shaking appears.' });
      } else {
        estado.textContent = L({ es:'Sobran ', en:'Left over: ' }) + (oh - d.H) +
          L({ es:' unidades de ion hidróxido: la mezcla ya es básica.', en:' units of hydroxide ion: the mixture is basic now.' });
      }
    }
  }

  function render(){
    if (st.done){
      host.innerHTML =
        '<div class="gw-h">' + L({ es:'Gota a gota', en:'Drop by drop' }) + '</div>' +
        '<div class="gw-fb good">' + L({
          es:'Encontraste el punto de equivalencia en las tres mezclas. Nunca fue el mismo volumen: lo que hay que igualar es el número de unidades de ion, y por eso una base más concentrada alcanza con menos mililitros.',
          en:'You found the equivalence point in the three mixtures. It was never the same volume: what has to be matched is the number of ion units, and that is why a more concentrated base needs fewer millilitres.'
        }) + '</div>';
      return;
    }
    var d = datos();
    st.v = 0;
    st.tries = 0;
    host.innerHTML =
      '<div class="gw-h">' + L({ es:'Gota a gota', en:'Drop by drop' }) + '</div>' +
      '<div class="gw-mini">' + L({
        es:'Arrastra para agregar base al vaso y observa las cuentas. Detente donde creas que está el punto de equivalencia y fija la lectura; puedes mover el deslizador cuantas veces quieras.',
        en:'Drag to add base to the glass and watch the counts. Stop where you think the equivalence point is and lock the reading; you can move the slider as many times as you like.'
      }) + '</div>' +
      '<div class="gw-prog">' + (st.r + 1) + ' / ' + R.length + '</div>' +
      '<div class="tr-tank">' +
        L({ es:'En el vaso hay ', en:'In the glass there are ' }) + d.va + L({ es:' mL de ácido y cada mililitro aporta ', en:' mL of acid and each millilitre provides ' }) + d.ca +
        L({ es:' unidades de ion hidrógeno. La base de la bureta aporta ', en:' units of hydrogen ion. The base in the burette provides ' }) + d.cb +
        L({ es:' unidades de ion hidróxido por mililitro.', en:' units of hydroxide ion per millilitre.' }) +
      '</div>' +
      '<div class="ti-stage">' +
        '<div class="ti-tube"><div class="ti-liq c-inc" data-r="liq"></div></div>' +
        '<div class="ti-info">' +
          '<div class="ti-state" data-r="estado"></div>' +
          '<div class="gw-read" data-r="lect"></div>' +
        '</div>' +
      '</div>' +
      '<input class="ti-sl" type="range" min="0" max="' + d.max + '" step="1" value="0" data-r="sl">' +
      '<div class="gw-row"><button class="gw-btn go" data-act="fijar">' + L({ es:'Fijar la lectura', en:'Lock the reading' }) + '</button></div>' +
      '<div class="gw-fb" data-r="fb">' + L({ es:'Cuenta cuántas unidades de ion hidrógeno hay que emparejar.', en:'Count how many units of hydrogen ion have to be paired up.' }) + '</div>';
    var sl = host.querySelector('[data-r="sl"]');
    if (sl) sl.addEventListener('input', function(){ st.v = parseInt(sl.value, 10) || 0; pintar(); });
    pintar();
  }

  function avanzar(ms){
    st.r++;
    if (st.r >= R.length) st.done = true;
    setTimeout(render, ms);
  }

  function fijar(){
    var d = datos();
    if (st.v === d.vb){
      say('good', L({ es:'Punto de equivalencia: ', en:'Equivalence point: ' }) + d.vb +
        L({ es:' mL de base aportan las mismas ', en:' mL of base provide the same ' }) + d.H +
        L({ es:' unidades de ion hidróxido que había de ion hidrógeno. Quedan la sal y el agua.', en:' units of hydroxide ion as there were of hydrogen ion. The salt and the water are left.' }));
      avanzar(2100);
      return;
    }
    st.tries++;
    if (st.tries >= 3){
      st.v = d.vb;
      var sl = host.querySelector('[data-r="sl"]');
      if (sl) sl.value = String(d.vb);
      pintar();
      say('warm', L({ es:'El punto estaba en ', en:'The point was at ' }) + d.vb + L({ es:' mL: había ', en:' mL: there were ' }) + d.H +
        L({ es:' unidades de ion hidrógeno y cada mililitro de base aporta ', en:' units of hydrogen ion and each millilitre of base provides ' }) + d.cb + '.');
      avanzar(2600);
      return;
    }
    var oh = st.v * d.cb;
    if (oh < d.H){
      say('miss', L({ es:'Todavía no: quedan ', en:'Not yet: ' }) + (d.H - oh) +
        L({ es:' unidades de ion hidrógeno sin pareja, así que hace falta más base.', en:' units of hydrogen ion are still unpaired, so more base is needed.' }));
    } else {
      say('miss', L({ es:'Te pasaste: sobran ', en:'You went past: ' }) + (oh - d.H) +
        L({ es:' unidades de ion hidróxido y la mezcla quedó básica. Regresa el deslizador.', en:' units of hydroxide ion are left over and the mixture turned basic. Move the slider back.' }));
    }
  }

  host.addEventListener('click', function(e){
    if (st.done) return;
    var b = e.target.closest ? e.target.closest('[data-act]') : null;
    if (b && b.getAttribute('data-act') === 'fijar') fijar();
  });

  render();
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 4 :: mesa de tratamiento de residuos
   Un tanque de residuo con un pH fuera de norma. El estudiante elige reactivo
   y dosis y ve, antes de verter, dónde quedaría el pH. Verter deja el tanque
   en el nuevo valor, así que siempre puede corregir el rumbo.
   ══════════════════════════════════════════════════════════════════════════ */
var REACTIVOS = [
  { id:'cal', nom:{ es:'cal apagada', en:'slaked lime' }, paso:2 },
  { id:'bic', nom:{ es:'bicarbonato de sodio', en:'baking soda' }, paso:1 },
  { id:'cit', nom:{ es:'ácido cítrico', en:'citric acid' }, paso:-1 },
  { id:'hcl', nom:{ es:'ácido clorhídrico diluido', en:'dilute hydrochloric acid' }, paso:-2 },
  { id:'agua', nom:{ es:'agua', en:'water' }, paso:0 }
];
function phZona(v){ return v <= 3 ? 'za' : (v <= 5 ? 'zb' : (v <= 8 ? 'zn' : (v <= 11 ? 'zc' : 'zd'))); }

function wResiduos(rng, host){
  var R = shuffle([ri(rng, 2, 4), ri(rng, 11, 13)], rng);
  var st = { r:0, v:R[0], sel:'cal', dosis:2, tries:0, done:false };

  function predice(){
    var re = REACTIVOS.filter(function(x){ return x.id === st.sel; })[0];
    if (re.id === 'agua') return st.v < 7 ? Math.min(7, st.v + 1) : Math.max(7, st.v - 1);
    var out = st.v + re.paso * st.dosis;
    return Math.max(0, Math.min(14, out));
  }

  function say(cls, msg){
    var fb = host.querySelector('[data-r="fb"]');
    if (fb){ fb.className = 'gw-fb ' + cls; fb.innerHTML = msg; }
  }

  function pintar(){
    var p = predice();
    host.querySelectorAll('[data-ph]').forEach(function(c){
      var n = parseInt(c.getAttribute('data-ph'), 10);
      c.classList.toggle('now', n === st.v);
      c.classList.toggle('pv', n === p && n !== st.v);
    });
    host.querySelectorAll('[data-re]').forEach(function(b){
      b.classList.toggle('on', b.getAttribute('data-re') === st.sel);
    });
    var t = host.querySelector('[data-r="tank"]');
    if (t) t.innerHTML = L({ es:'Tanque de residuo: pH ', en:'Waste tank: pH ' }) + st.v +
      '<div class="tr-win">' + L({ es:'la norma del vertido pide un pH entre 6 y 8', en:'the discharge rule asks for a pH between 6 and 8' }) + '</div>';
    var pr = host.querySelector('[data-r="prev"]');
    if (pr) pr.textContent = L({ es:'Con esta dosis el pH quedaría en ', en:'With this dose the pH would end at ' }) + p;
    var dl = host.querySelector('[data-r="dl"]');
    if (dl) dl.textContent = L({ es:'dosis: ', en:'dose: ' }) + st.dosis;
  }

  function render(){
    if (st.done){
      host.innerHTML =
        '<div class="gw-h">' + L({ es:'Mesa de tratamiento', en:'Treatment bench' }) + '</div>' +
        '<div class="gw-fb good">' + L({
          es:'Dejaste los dos residuos dentro del intervalo permitido. Un residuo ácido se corrige con una base y uno básico con un ácido, siempre midiendo antes de verter al drenaje.',
          en:'You left both wastes inside the allowed range. An acidic waste is corrected with a base and a basic one with an acid, always measuring before pouring into the drain.'
        }) + '</div>';
      return;
    }
    st.tries = 0;
    var celdas = '';
    for (var n = 0; n <= 14; n++) celdas += '<div class="ph-cell ' + phZona(n) + '" data-ph="' + n + '">' + n + '</div>';
    host.innerHTML =
      '<div class="gw-h">' + L({ es:'Mesa de tratamiento', en:'Treatment bench' }) + '</div>' +
      '<div class="gw-mini">' + L({
        es:'Elige el reactivo y la dosis: el marcador punteado te muestra dónde quedaría el pH antes de verter. Si el vertido no queda en el intervalo, corrige y vuelve a tratar.',
        en:'Choose the reagent and the dose: the dotted marker shows where the pH would end up before you pour. If the discharge is out of range, correct it and treat again.'
      }) + '</div>' +
      '<div class="gw-prog">' + (st.r + 1) + ' / ' + R.length + '</div>' +
      '<div class="tr-tank" data-r="tank"></div>' +
      '<div class="ph-scale">' + celdas + '</div>' +
      '<div class="gw-lbl">' + L({ es:'Reactivo', en:'Reagent' }) + '</div>' +
      '<div class="gw-row">' +
        REACTIVOS.map(function(x){ return '<button class="gw-btn" data-re="' + x.id + '">' + L(x.nom) + '</button>'; }).join('') +
      '</div>' +
      '<div class="gw-lbl" data-r="dl"></div>' +
      '<input class="ti-sl" type="range" min="1" max="5" step="1" value="' + st.dosis + '" data-r="ds">' +
      '<div class="ti-state" data-r="prev"></div>' +
      '<div class="gw-row"><button class="gw-btn go" data-act="verter">' + L({ es:'Verter al tanque', en:'Pour into the tank' }) + '</button></div>' +
      '<div class="gw-fb" data-r="fb">' + L({ es:'Decide primero hacia qué lado tiene que moverse el pH.', en:'First decide which way the pH has to move.' }) + '</div>';
    var ds = host.querySelector('[data-r="ds"]');
    if (ds) ds.addEventListener('input', function(){ st.dosis = parseInt(ds.value, 10) || 1; pintar(); });
    pintar();
  }

  function solucion(){
    if (st.v < 6){
      var d1 = Math.max(1, Math.min(5, Math.round((7 - st.v) / 2)));
      return { re:'cal', dosis:d1 };
    }
    var d2 = Math.max(1, Math.min(5, Math.round((st.v - 7) / 2)));
    return { re:'hcl', dosis:d2 };
  }

  function verter(){
    var antes = st.v;
    var p = predice();
    var re = REACTIVOS.filter(function(x){ return x.id === st.sel; })[0];
    st.v = p;
    pintar();
    if (p >= 6 && p <= 8){
      say('good', L({ es:'Vertido autorizado: el pH pasó de ', en:'Discharge authorized: the pH went from ' }) + antes + L({ es:' a ', en:' to ' }) + p +
        L({ es:'. Los iones en exceso reaccionaron y quedaron una sal y agua.', en:'. The excess ions reacted and a salt and water were left.' }));
      st.r++;
      if (st.r >= R.length) st.done = true;
      else st.v = R[st.r];
      setTimeout(render, 2300);
      return;
    }
    st.tries++;
    if (st.tries >= 3){
      var s = solucion();
      st.sel = s.re; st.dosis = s.dosis;
      var fin = predice();
      st.v = fin;
      pintar();
      say('warm', L({ es:'Desde pH ', en:'From pH ' }) + antes + L({ es:' el camino corto era ', en:' the short way was ' }) + L(REACTIVOS.filter(function(x){ return x.id === s.re; })[0].nom) +
        L({ es:' en dosis ', en:' at dose ' }) + s.dosis + L({ es:', que deja el vertido en pH ', en:', which leaves the discharge at pH ' }) + fin + '.');
      st.r++;
      if (st.r >= R.length) st.done = true;
      else st.v = R[st.r];
      setTimeout(render, 2800);
      return;
    }
    if (re.id === 'agua'){
      say('miss', L({
        es:'El agua reparte los mismos iones en más volumen: mueve el pH una unidad por cada diez veces el volumen y el tanque ya no da para más. Los iones siguen ahí.',
        en:'Water spreads the same ions through more volume: it moves the pH one unit for every tenfold volume and the tank has no room left. The ions are still there.'
      }));
    } else if ((antes < 6 && p < antes) || (antes > 8 && p > antes)){
      say('miss', L({ es:'Vas en la dirección contraria: el pH se alejó todavía más del intervalo. Cambia de familia de reactivo.', en:'You are going the wrong way: the pH moved even further from the range. Change the family of reagent.' }));
    } else if (p < 6){
      say('miss', L({ es:'Se acercó, pero el vertido quedó en pH ', en:'It got closer, but the discharge ended at pH ' }) + p + L({ es:' y sigue del lado ácido: sube la dosis o usa un reactivo más fuerte.', en:' and is still on the acidic side: raise the dose or use a stronger reagent.' }));
    } else {
      say('miss', L({ es:'Te pasaste: el vertido quedó en pH ', en:'You overshot: the discharge ended at pH ' }) + p + L({ es:' y ahora es demasiado básico. Corrige con la otra familia.', en:' and is now too basic. Correct it with the other family.' }));
    }
  }

  host.addEventListener('click', function(e){
    if (st.done) return;
    var r = e.target.closest ? e.target.closest('[data-re]') : null;
    if (r){ st.sel = r.getAttribute('data-re'); pintar(); return; }

    en:'A workshop pours its acidic waste into the stream untreated and the fish of that stretch die.', bin:2 },

    en:'The runoff from a mine leaves the soil so acidic that no vegetation grows.', bin:2 }
];

function wCriterio(rng, host){
  var BINS = [
    { es:'Beneficio', en:'Benefit' },
    { es:'Riesgo a la salud', en:'Risk to health' },
    { es:'Riesgo al ambiente', en:'Risk to the environment' }
  ];
  var ITEMS = shuffle(CRITERIOS, rng).slice(0, 6);
  var st = { i:0, tries:0, aciertos:0, done:false };

  function say(cls, msg){
    var fb = host.querySelector('[data-r="fb"]');
    if (fb){ fb.className = 'gw-fb ' + cls; fb.innerHTML = msg; }
  }

  function render(){
    if (st.done){
      host.innerHTML =
        '<div class="gw-h">' + L({ es:'Mesa de decisiones', en:'Decision bench' }) + '</div>' +
        '<div class="gw-fb good">' + L({
          es:'Clasificaste las seis tarjetas. La misma propiedad que hace útil a una sustancia es la que la vuelve peligrosa fuera de su dosis y de su lugar.',
          en:'You classified the six cards. The same property that makes a substance useful is what makes it dangerous outside its dose and its place.'
        }) + '</div>';
      return;
    }
    host.innerHTML =
      '<div class="gw-h">' + L({ es:'Mesa de decisiones', en:'Decision bench' }) + '</div>' +
      '<div class="gw-mini">' + L({
        es:'Lee la tarjeta y decide en qué columna va. Pregúntate si describe algo que resuelve un problema o algo que provoca un daño, y a quién.',
        en:'Read the card and decide which column it goes in. Ask yourself whether it describes something that solves a problem or something that causes harm, and to whom.'
      }) + '</div>' +
      '<div class="gw-prog">' + (st.i + 1) + ' / ' + ITEMS.length + '</div>' +
      '<div class="cl-card">' + L(ITEMS[st.i]) + '</div>' +
      '<div class="cl-bins">' + BINS.map(function(b, bi){ return '<button class="cl-bin" data-bin="' + bi + '">' + L(b) + '</button>'; }).join('') + '</div>' +
      '<div class="gw-fb" data-r="fb"></div>';
  }

  function siguiente(ms){
    st.i++;
    st.tries = 0;
    if (st.i >= ITEMS.length) st.done = true;
    setTimeout(render, ms);
  }

  host.addEventListener('click', function(e){
    if (st.done) return;
    var b = e.target.closest ? e.target.closest('[data-bin]') : null;
    if (!b) return;
    var bi = parseInt(b.getAttribute('data-bin'), 10);
    var it = ITEMS[st.i];
    if (bi === it.bin){
      st.aciertos++;
      say('good', L({ es:'Así es. ', en:'That is right. ' }) + (it.bin === 0
        ? L({ es:'Resuelve un problema concreto y por eso se usa a propósito.', en:'It solves a concrete problem and that is why it is used on purpose.' })
        : (it.bin === 1
          ? L({ es:'El daño cae sobre una persona que está cerca de la sustancia.', en:'The harm falls on a person who is close to the substance.' })
          : L({ es:'El daño cae sobre el agua, el suelo o los seres vivos de un lugar.', en:'The harm falls on the water, the soil or the living things of a place.' }))));
      siguiente(1500);
      return;
    }
    st.tries++;
    if (st.tries >= 3){
      say('warm', L({ es:'Iba en ', en:'It belonged in ' }) + L(BINS[it.bin]) + '. ' + (it.bin === 0
        ? L({ es:'Es un uso buscado, no una consecuencia no deseada.', en:'It is an intended use, not an unwanted consequence.' })
        : (it.bin === 1
          ? L({ es:'Lo que se daña es el cuerpo de quien maneja o respira la sustancia.', en:'What gets damaged is the body of whoever handles or breathes the substance.' })
          : L({ es:'Lo que se daña es un ecosistema completo, no una persona en particular.', en:'What gets damaged is a whole ecosystem, not one particular person.' }))));
      siguiente(2200);
      return;
    }
    if (it.bin === 0){
      say('miss', L({ es:'Vuelve a leerla: ¿alguien la provoca a propósito para resolver algo?', en:'Read it again: does someone cause it on purpose to solve something?' }));
    } else if (bi === 0){
      say('miss', L({ es:'Aquí hay un daño, no un beneficio. Decide ahora si lo sufre una persona o un ecosistema.', en:'There is harm here, not a benefit. Now decide whether a person or an ecosystem suffers it.' }));
    } else {
      say('miss', L({ es:'Es un riesgo, pero la columna no es esa: fíjate en quién termina expuesto.', en:'It is a risk, but not that column: look at who ends up exposed.' }));
    }
  });

  render();
}

function mkP5(rng){

      q:{ es:'En un vaso hay ' + va + ' mL de una disolución ácida en la que cada mililitro aporta ' + c.ca + ' unidades de ion hidrógeno. Se va a neutralizar con una base en la que cada mililitro aporta ' + c.cb + ' unidades de ion hidróxido. ¿Qué volumen de base hay que agregar para llegar al punto de equivalencia?',

      exp:{ es:'En el vaso hay ' + va + ' por ' + c.ca + ', es decir ' + H + ' unidades de ion hidrógeno. Cada mililitro de base aporta ' + c.cb + ' unidades de ion hidróxido, así que hacen falta ' + H + ' entre ' + c.cb + ', o sea ' + vb + ' mL. Igualar los volúmenes daría ' + va + ' mL y dejaría la mezcla fuera del punto de equivalencia, porque lo que se iguala es el número de unidades de ion, no los mililitros.',

          en:'A team is going to neutralize ' + va + ' mL of an acidic solution that provides ' + c.ca + ' units of hydrogen ion per millilitre, with a base that provides ' + c.cb + ' units of hydroxide ion per millilitre. The team proposes using the same volume of base as of acid. What volume is really needed and why?' },
      opts:{ es:[vb + ' mL, porque lo que hay que igualar es el número de unidades de ion, no los mililitros',
                 va + ' mL, porque la neutralización siempre se logra con volúmenes iguales de los dos',

             en:[vb + ' mL, because what has to be matched is the number of ion units, not the millilitres',

             en:'Count the units of hydrogen ion in the glass and divide them by those provided by each millilitre of base; the millilitres only coincide when the two solutions provide the same per millilitre.' },
      exp:{ es:'Los ' + va + ' mL de ácido llevan ' + H + ' unidades de ion hidrógeno. Como cada mililitro de base aporta ' + c.cb + ' unidades de ion hidróxido, se necesitan ' + vb + ' mL para que cada ion hidrógeno encuentre pareja. La regla del mismo volumen solo funcionaría si las dos disoluciones aportaran lo mismo por mililitro, y aquí no es el caso.',

                 'It is convenient: by neutralizing each other the mixture ends at 7 and cleans twice as much with the same effort',
                 'It makes no difference: mixing two cleaners changes nothing because both are used for the same thing',
                 'It is safe if done quickly: the risk appears only when the mixture stays several hours in the bucket'] },
      ci:0,
      hint:{ es:'La reacción entre un ácido y una base concentrados libera energía y arrastra vapores, y además consume a las dos sustancias que se querían aprovechar.',
             en:'The reaction between a concentrated acid and a concentrated base releases energy and drags vapours along, and it also consumes the two substances that were meant to be used.' },
      exp:{ es:'Los dos productos están en los extremos de la escala y al juntarse reaccionan de golpe: la mezcla se calienta y arrastra vapores irritantes que en un baño sin ventana se concentran alrededor de quien limpia. Además los iones que hacían útil a cada producto quedan convertidos en agua y sal, así que la cubeta pierde su capacidad de limpieza. Es un caso donde el riesgo sube y el beneficio desaparece.',
            en:'The two products are at the ends of the scale and when they come together they react all at once: the mixture heats up and drags irritating vapours that in a bathroom with no window build up around whoever is cleaning. Besides, the ions that made each product useful end up turned into water and salt, so the bucket loses its cleaning power. It is a case where the risk goes up and the benefit disappears.' } }
  ]);
}

          en:'A company discharges into the stream a waste with pH ' + ph + '. Downstream the fish die and the town orders the waste to be treated with lime before any discharge. A neighbour argues that lime only covers the problem up because the waste is still there. Which is the best founded answer?' },
      opts:{ es:['La cal no oculta nada: sus iones hidróxido convierten en agua a los iones hidrógeno del residuo y el resto queda como una sal',

                 'El vecino tiene razón: la cal solo aumenta el volumen del residuo y baja la lectura por dilución',
                 'El vecino tiene razón: la cal cambia el color del agua y el medidor deja de registrar el ácido presente'],
             en:['Lime hides nothing: its hydroxide ions turn the hydrogen ions of the waste into water and the rest is left as a salt',
