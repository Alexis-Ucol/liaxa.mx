    '.bars{display:flex;flex-direction:column;gap:.3rem;margin:.5rem 0 .1rem;}',
    '.barlbl{font-size:.72rem;color:var(--text3);display:flex;justify-content:space-between;}',
    '.bar{height:13px;border-radius:7px;background:var(--surface2);overflow:hidden;border:1px solid var(--border);}',
    '.barf{height:100%;width:50%;transition:width .45s;}',
    '.barf.claro{background:var(--gold);}',
    '.barf.oscuro{background:var(--green);}',
    '.reflect-prompt{font-size:.92rem;color:var(--text);margin:.5rem 0 .7rem;}',
    '.mcopt.pending{background:var(--gold-bg);}',
    '@media (max-width:600px){.gw{padding:.8rem;}.qgrid{grid-template-columns:repeat(3,1fr);}.binrow{grid-template-columns:1fr;}.qc{font-size:.62rem;}}'
  ].join('');
  document.head.appendChild(s);
}

/* ══════════════════════════════════════════════════════════════════════════
   buildLesson :: concepto -> manipulativo -> problema, alternados (Rule 1)
   ══════════════════════════════════════════════════════════════════════════ */
function buildLesson(rng){
  injectGuideCSS();

  /* ── Apertura ── */
  sec(
    L({ es:'Punto de partida', en:'Starting point' }),
    L({ es:'Lo que vive a dos cuadras de aquí', en:'What lives two blocks from here' }),
    '<p>' + L({
      es:'Entre la banqueta y la barda de tu escuela hay más seres vivos de los que caben en una lista rápida: hierbas que nadie sembró, hormigas, arañas, un árbol al que le dicen de tres maneras distintas, tal vez un nido. A esa variedad de seres vivos que comparten un mismo lugar se le llama biodiversidad, y la palabra vale igual para la selva de una postal que para el camellón de tu colonia.',
      en:'Between the sidewalk and your school wall there are more living things than fit in a quick list: herbs nobody planted, ants, spiders, a tree that goes by three different names, maybe a nest. That variety of living things sharing one place is called biodiversity, and the word works just as well for the rainforest on a postcard as for the median strip in your neighbourhood.'
    }) + '</p>' +
    '<div class="callout"><p><strong>' + L({ es:'Lo que vas a hacer: ', en:'What you are going to do: ' }) + '</strong>' + L({
      es:'vas a contar especies en un cuadrante, a mover un cursor por los años para ver en qué momento un arroyo perdió su riqueza, a repartir razones para cuidar la biodiversidad en cuatro clases distintas, a emparejar cada causa de pérdida con la acción que sí la toca, a armar el razonamiento que Darwin y Wallace propusieron y a comprobarlo en un prado con escarabajos que cambian generación tras generación.',
      en:'you are going to count species in a quadrat, move a cursor across the years to see when a stream lost its richness, sort reasons for caring about biodiversity into four different kinds, pair each cause of loss with the action that actually touches it, assemble the reasoning Darwin and Wallace put forward and test it in a meadow with beetles that change generation after generation.'
    }) + '</p></div>'
  );

  /* ══ CONCEPTO 1 ══ */
  var s1 = sec(
    L({ es:'Concepto 1', en:'Concept 1' }),
    L({ es:'Riqueza, abundancia y de dónde sale el dato', en:'Richness, abundance and where the data comes from' }),
    '<p>' + L({
      es:'Para hablar del lugar donde vives con algo más que impresiones hacen falta dos números. El primero es la riqueza: cuántas especies distintas hay. El segundo es la abundancia: cuántos individuos hay de cada especie. Son cosas diferentes y conviene no confundirlas. Un terreno con cien plantas de una sola hierba tiene mucha abundancia y muy poca riqueza; otro con quince plantas de once especies distintas tiene poca abundancia y bastante riqueza.',
      en:'To talk about the place where you live with more than impressions you need two numbers. The first is richness: how many different species there are. The second is abundance: how many individuals there are of each species. They are different things and it pays not to mix them up. A lot with a hundred plants of a single herb has a lot of abundance and very little richness; another with fifteen plants of eleven different species has little abundance and a good deal of richness.'
    }) + '</p>' +
    '<p>' + L({
      es:'Esos números salen de fuentes, y no todas sirven para lo mismo. Las fuentes directas son las que produces tú al observar: recorres un tramo, delimitas un cuadrante, anotas y cuentas. Las fuentes orales son las que guardan las personas: quien lleva cuarenta años en el barrio recuerda pájaros que ya no se ven y sabe en qué mes florecía el árbol de la esquina. Las fuentes escritas, audiovisuales y de Internet reúnen lo que otros registraron: listas de especies, fotografías viejas, videos, portales donde cualquiera sube lo que observó. La fuente directa te dice cómo está el lugar hoy; para saber cómo estaba antes casi siempre hay que ir a las otras.',
      en:'Those numbers come from sources, and not all sources are good for the same thing. Direct sources are the ones you produce by observing: you walk a stretch, mark off a quadrat, write things down and count. Oral sources are the ones people hold: someone who has spent forty years in the neighbourhood remembers birds that are no longer seen and knows in which month the corner tree used to flower. Written, audiovisual and Internet sources gather what others recorded: species lists, old photographs, videos, sites where anyone uploads what they observed. A direct source tells you how the place is today; to know how it was before you almost always have to go to the other kinds.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Riqueza', en:'Richness' }), L({ es:'especies distintas', en:'different species' }), L({ es:'cada nombre cuenta una vez', en:'each name counts once' })) +
      rcard(L({ es:'Abundancia', en:'Abundance' }), L({ es:'individuos de cada una', en:'individuals of each one' }), L({ es:'puede ser alta con poca riqueza', en:'can be high with low richness' })) +
      rcard(L({ es:'Fuente directa', en:'Direct source' }), L({ es:'observar y contar', en:'observe and count' }), L({ es:'habla del presente', en:'speaks about the present' })) +
      rcard(L({ es:'Fuente oral', en:'Oral source' }), L({ es:'lo que la gente recuerda', en:'what people remember' }), L({ es:'alcanza lo que nadie escribió', en:'reaches what nobody wrote down' })) +
    '</div>'
  );
  wQuadrant(rng, widgetHost(s1, 'w_cuadrante', 'quadrant'));
  addProblem(rng, mkP1(rng));
  addProblem(rng, mkP2(rng));

  /* ══ CONCEPTO 2 ══ */
  var s2 = sec(
    L({ es:'Concepto 2', en:'Concept 2' }),
    L({ es:'El estado no se ve en una sola visita', en:'The state does not show up in a single visit' }),
    '<p>' + L({
      es:'Decir en qué estado está la biodiversidad de un lugar no es decir cuántas especies hay: es decir si esa cantidad va subiendo, se mantiene o va bajando. Y eso solo aparece al comparar. Un conteo suelto no tiene con qué compararse, así que no dice nada del estado; dos conteos del mismo tramo, hechos en años distintos, ya cuentan una historia.',
      en:'Saying what state the biodiversity of a place is in is not saying how many species there are: it is saying whether that number is going up, holding steady or going down. And that only shows up by comparing. A single loose count has nothing to compare itself with, so it says nothing about the state; two counts of the same stretch, made in different years, already tell a story.'
    }) + '</p>' +
    '<p>' + L({
      es:'Para que la comparación sea honesta los dos conteos deben parecerse en todo salvo en la fecha: el mismo tramo, la misma temporada del año, el mismo recorrido y el mismo esfuerzo. Si un conteo se hizo en mayo y el otro en diciembre, la diferencia puede venir de las aves que migran y no de una pérdida real. Cuando la comparación está bien hecha, una riqueza que baja año con año es una señal de alarma, y la desaparición de una sola especie del listado marca una fecha que vale la pena investigar.',
      en:'For the comparison to be honest the two counts must be alike in everything except the date: the same stretch, the same season of the year, the same route and the same effort. If one count was made in May and the other in December, the difference may come from birds that migrate and not from a real loss. When the comparison is properly made, a richness that drops year after year is a warning sign, and the disappearance of a single species from the list marks a date worth looking into.'
    }) + '</p>'
  );
  wYears(rng, widgetHost(s2, 'w_anios', 'slider'));
  addProblem(rng, mkP3(rng));

  /* ══ CONCEPTO 3 ══ */
  var s3 = sec(
    L({ es:'Concepto 3', en:'Concept 3' }),
    L({ es:'Cuatro maneras de responder por qué importa', en:'Four ways of answering why it matters' }),
    '<p>' + L({
      es:'Cuando alguien pregunta para qué sirve cuidar el arroyo o el pastizal, hay cuatro clases de respuesta y las cuatro son buenas. La razón biológica se apoya en que las especies sostienen procesos de los que dependen otras especies y también nosotros: quien poliniza, quien hace suelo, quien limpia el agua, quien se come a la plaga. La razón cultural se apoya en que muchas especies están metidas en la comida, en la lengua, en la fiesta y en el remedio de la casa: el maíz, el cempasúchil, el agave, el árbol que le dio nombre al barrio.',
      en:'When someone asks what use it is to look after the stream or the grassland, there are four kinds of answer and all four are good. The biological reason rests on the fact that species sustain processes other species depend on, and so do we: whoever pollinates, whoever makes soil, whoever cleans the water, whoever eats the pest. The cultural reason rests on the fact that many species are woven into food, into language, into the festival and into the household remedy: maize, marigold, agave, the tree that gave the neighbourhood its name.'
    }) + '</p>' +
    '<p>' + L({
      es:'La razón estética se apoya en el disfrute: el valle lleno de flores moradas, el canto de los pájaros al amanecer, el gusto de que un lugar valga la pena. La razón ética es de otro tipo: sostiene que los seres vivos valen por sí mismos aunque no nos sirvan de nada, y que las personas que vengan después tienen derecho a encontrar lo que nosotros encontramos. Fíjate en la diferencia: las tres primeras terminan en algo que ganamos; la ética se sostiene aunque no ganemos nada.',
      en:'The aesthetic reason rests on enjoyment: the valley full of purple flowers, birdsong at dawn, the pleasure of a place being worth something. The ethical reason is of another kind: it holds that living things are worth something in themselves even if they are of no use to us, and that the people who come after have a right to find what we found. Notice the difference: the first three end in something we gain; the ethical one holds even when we gain nothing.'
    }) + '</p>'
  );
  wClassify(rng, widgetHost(s3, 'w_razones', 'classify'));
  addProblem(rng, mkP4(rng));
  addProblem(rng, mkP5(rng));

  /* ══ CONCEPTO 4 ══ */
  var s4 = sec(
    L({ es:'Concepto 4', en:'Concept 4' }),
    L({ es:'Una acción sirve si toca la causa', en:'An action works if it touches the cause' }),
    '<p>' + L({
      es:'Proponer acciones de cuidado es la parte donde una indagación se vuelve útil, y también donde es más fácil equivocarse. Casi todas las acciones que se proponen en una asamblea escolar son buenas en general, pero solo unas cuantas tocan la causa concreta de la pérdida que se detectó en ese lugar. Sembrar árboles en el patio es una buena idea; si lo que está matando a los peces es el aceite que llega de los talleres, sembrar en el patio no cambia nada para esos peces.',
      en:'Proposing actions of care is the part where an inquiry becomes useful, and also where it is easiest to go wrong. Almost every action proposed in a school assembly is good in general, but only a few of them touch the specific cause of the loss detected in that place. Planting trees in the schoolyard is a good idea; if what is killing the fish is the oil arriving from the workshops, planting in the yard changes nothing for those fish.'
    }) + '</p>' +
    '<p>' + L({
      es:'Por eso el orden importa: primero se identifica qué está provocando la pérdida, y hasta entonces se elige la acción. Una acción bien dirigida suele ser modesta y aburrida de contar, porque consiste en quitar aquello que hace el daño o en proteger el sitio mientras se recupera. Además tiene que caber en lo que un grupo puede sostener durante meses, no en lo que suena bien durante una tarde.',
      en:'That is why the order matters: first you identify what is causing the loss, and only then do you choose the action. A well aimed action is usually modest and boring to tell, because it consists of removing what does the damage or protecting the site while it recovers. It also has to fit within what a group can keep up for months, not within what sounds good for one afternoon.'
    }) + '</p>'
  );
  wMatch(rng, widgetHost(s4, 'w_acciones', 'match'));
  addProblem(rng, mkP6(rng));

  /* ══ CONCEPTO 5 ══ */
  var s5 = sec(
    L({ es:'Concepto 5', en:'Concept 5' }),
    L({ es:'Darwin y Wallace: de dónde salió tanta variedad', en:'Darwin and Wallace: where so much variety came from' }),
    '<p>' + L({
      es:'Queda la pregunta grande: por qué hay tantas especies distintas y por qué cada una parece hecha para el lugar donde vive. En el siglo diecinueve dos naturalistas la respondieron por caminos separados. Charles Darwin recorrió durante años las costas de Sudamérica y las islas Galápagos anotando lo que veía; Alfred Russel Wallace hizo lo propio en el Amazonas y en las islas del sudeste de Asia. Sin trabajar juntos llegaron a la misma explicación, y en mil ochocientos cincuenta y ocho la presentaron el mismo día ante la comunidad científica de Londres. Al año siguiente Darwin publicó el libro donde reunió las pruebas.',
      en:'The big question is still there: why are there so many different species and why does each one look made for the place where it lives. In the nineteenth century two naturalists answered it along separate paths. Charles Darwin spent years travelling the coasts of South America and the Galapagos Islands writing down what he saw; Alfred Russel Wallace did the same in the Amazon and in the islands of southeast Asia. Without working together they arrived at the same explanation, and in eighteen fifty eight they presented it on the same day before the scientific community of London. The following year Darwin published the book where he gathered the evidence.'
    }) + '</p>' +
    '<p>' + L({
      es:'La explicación se llama selección natural y se arma con cuatro observaciones encadenadas. Dentro de una población los individuos no son idénticos: hay variación. Parte de esa variación pasa de padres a hijos: se hereda. Nacen más descendientes de los que el lugar puede mantener, así que no todos alcanzan a reproducirse. Y entre ellos, los que llevan la variante que da ventaja en ese ambiente dejan más descendencia. El resultado no ocurre en un individuo, ocurre en la población: generación tras generación cambia la proporción de cada variante, y con suficiente tiempo y aislamiento aparecen especies distintas.',
      en:'The explanation is called natural selection and it is built from four chained observations. Within a population individuals are not identical: there is variation. Part of that variation passes from parents to offspring: it is inherited. More descendants are born than the place can support, so not all of them get to reproduce. And among them, the ones carrying the variant that gives an advantage in that environment leave more offspring. The result does not happen in an individual, it happens in the population: generation after generation the proportion of each variant changes, and with enough time and isolation different species appear.'
    }) + '</p>'
  );
  wSequence(rng, widgetHost(s5, 'w_argumento', 'sequence'));
  wMeadow(rng, widgetHost(s5, 'w_prado', 'simulation'));
  addProblem(rng, mkP7(rng));

  /* ══ CONCEPTO 6 ══ */
  var s6 = sec(
    L({ es:'Concepto 6', en:'Concept 6' }),
    L({ es:'Una explicación que se sigue construyendo', en:'An explanation that is still being built' }),
    '<p>' + L({
      es:'Darwin y Wallace tenían un hueco grande en su explicación: no sabían cómo pasaban las características de una generación a la siguiente. En su tiempo nadie conocía el material hereditario. Décadas después se describió cómo se heredan las características y más tarde se aprendió a comparar el material hereditario de dos especies para medir qué tanto se parecen. Ese hallazgo no tiró la explicación: llenó el hueco y le dio precisión.',
      en:'Darwin and Wallace had a big gap in their explanation: they did not know how characteristics passed from one generation to the next. In their time nobody knew about hereditary material. Decades later it was described how characteristics are inherited, and later still people learned to compare the hereditary material of two species to measure how alike they are. That finding did not knock the explanation down: it filled the gap and made it precise.'
    }) + '</p>' +
    '<p>' + L({
      es:'Así trabaja la ciencia y así conviene mirar tu propia indagación del barrio. Una explicación se sostiene mientras la evidencia la respalde, se ajusta cuando aparece evidencia que no encaja y se cambia por otra cuando ya no alcanza. Los dos naturalistas tampoco pensaban igual en todo, y discutieron entre ellos varios puntos. Nada de eso resta valor a lo que propusieron: muestra que el conocimiento científico no es una lista terminada sino algo que se sigue construyendo.',
      en:'That is how science works and that is how it pays to look at your own inquiry in the neighbourhood. An explanation holds while the evidence backs it, it gets adjusted when evidence appears that does not fit, and it is replaced by another when it is no longer enough. The two naturalists did not think alike about everything either, and they argued with each other over several points. None of that takes value away from what they proposed: it shows that scientific knowledge is not a finished list but something still being built.'
    }) + '</p>'
  );
  wReflect(rng, widgetHost(s6, 'w_reflexion', 'reflect'));
  addProblem(rng, mkP8(rng));

  /* ══ CIERRE :: sin explicación previa (Rule 1) ══ */
  sec(
    L({ es:'Para cerrar', en:'To close' }),
    L({ es:'Tú decides', en:'Your call' }),
    '<p>' + L({
      es:'Dos situaciones más, con todo lo que ya trabajaste en la mano.',
      en:'Two more situations, with everything you have already worked on in hand.'
    }) + '</p>'
  );
  addProblem(rng, mkP9(rng));
  addProblem(rng, mkP10(rng));
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 1 :: el cuadrante  (FIXED: legend + found-tracker)
   Goal is clearer: a legend shows each species name; tapping a cell marks
   ALL of that species and checks it off in the legend. The counter stepper
   now shows "species found so far" progress so students understand the task.
   ══════════════════════════════════════════════════════════════════════════ */
function wQuadrant(rng, host){
  var POOL = [
    { es:'cempasúchil', en:'marigold' },
    { es:'tronadora', en:'trumpetbush' },
    { es:'mezquite', en:'mesquite' },
    { es:'huizache', en:'huizache' },
    { es:'verdolaga', en:'purslane' },
    { es:'nopal', en:'prickly pear' },
    { es:'quelite', en:'wild amaranth' },
    { es:'jarilla', en:'jarilla' }
  ];
  var round = 0, tries = 0, revealed = false, done = false, guess = 1, data = null;
  var foundSet = new Set();   // indices of species the student has tapped at least once

  function buildRound(){
    var k = ri(rng, 4, 6);
    var sp = shuffle(POOL, rng).slice(0, k);
    var cells = [];
    for (var i = 0; i < k; i++) cells.push(i);
    while (cells.length < 16) cells.push(ri(rng, 0, k - 1));
    return { k:k, sp:sp, cells:shuffle(cells, rng) };
  }

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'El cuadrante', en:'The quadrat' }) + '</div>' +
    '<div class="gw-q" data-r="q"></div>' +
    '<div class="gw-mini">' + L({
      es:'<strong>Tu tarea:</strong> cuenta cuántas <em>especies distintas</em> hay en el cuadrante (no cuántos ejemplares en total). Toca cada casilla para ver todos los ejemplares de esa especie marcados a la vez — úsalo para explorar el cuadro y descubrir cuántos nombres distintos aparecen.',
      en:'<strong>Your task:</strong> count how many <em>different species</em> are in the quadrat (not how many specimens in total). Tap any cell to highlight every specimen of that species at once — use this to explore the grid and discover how many different names appear.'
    }) + '</div>' +
    '<div class="q-goal" data-r="goal"></div>' +
    '<div class="q-legend" data-r="legend"></div>' +
    '<div class="qgrid" data-r="grid"></div>' +
    '<div class="gw-read" data-r="read"></div>' +
    '<div class="step">' +
      '<span class="steplbl">' + L({ es:'Especies distintas que propones', en:'Different species you propose' }) + '</span>' +
      '<button class="gw-btn" data-r="minus">−</button>' +
      '<span class="stepv" data-r="val">1</span>' +
      '<button class="gw-btn" data-r="plus">+</button>' +
    '</div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Comprobar', en:'Check' }) + '</button></div>' +
    '<div class="gw-fb"></div>';

  var elQ    = host.querySelector('[data-r="q"]'),
      elGoal = host.querySelector('[data-r="goal"]'),
      elLeg  = host.querySelector('[data-r="legend"]'),
      elG    = host.querySelector('[data-r="grid"]'),
      elR    = host.querySelector('[data-r="read"]'),
      elV    = host.querySelector('[data-r="val"]'),
      elK    = host.querySelector('[data-r="chk"]');

  function render(){
    // Question
    elQ.textContent = L({
      es:'Cuadrante ' + (round + 1) + ' de 3 — ¿cuántas especies distintas hay entre los 16 ejemplares?',
      en:'Quadrat ' + (round + 1) + ' of 3 — how many different species are there among the 16 specimens?'
    });

    // Goal banner
    elGoal.innerHTML =
      '🔍 ' + L({
        es:'Encuentra todos los nombres distintos. Toca casillas hasta explorar todo el cuadro.',
        en:'Find all the different names. Tap cells until you have explored the whole grid.'
      });

    // Legend — one chip per species, turns green when found
    elLeg.innerHTML = data.sp.map(function(sp, si){
      var found = foundSet.has(si);
      return '<span class="q-leg-chip' + (found ? ' found' : '') + '">' +
               '<span class="q-leg-dot"></span>' +
               L(sp) +
               (found ? ' ✓' : '') +
             '</span>';
    }).join('');

    // Grid
    elG.innerHTML = data.cells.map(function(si, ci){
      var cls = 'qc';
      if (foundSet.has(si)) cls += ' found';
      if ((revealed || done)) cls += '';
      return '<button class="' + cls + '" data-c="' + ci + '"' + ((revealed || done) ? ' disabled' : '') + '>' + L(data.sp[si]) + '</button>';
    }).join('');
    elG.querySelectorAll('.qc').forEach(function(b){
      b.addEventListener('click', function(){
        var ci = parseInt(b.getAttribute('data-c'), 10);
        var si = data.cells[ci];
        // Mark all cells of this species in found set
        foundSet.add(si);
        guess = foundSet.size;   // auto-set the stepper to discovered species count
        render();
        // Show how many of this species exist
        var n = data.cells.filter(function(x){ return x === si; }).length;
        elR.innerHTML =
          '<span class="gw-pill">' + L(data.sp[si]) + ': <b>' + n + '</b> ' + L({ es:'ejemplares', en:'specimens' }) + '</span>' +
          '<span class="gw-pill">' + L({ es:'Especies encontradas', en:'Species found' }) + ': <b>' + foundSet.size + '</b></span>';
      });
    });

    elV.textContent = String(guess);
  }

  function nextRound(){
    round++;
    if (round >= 3){
      done = true;
      elK.textContent = L({ es:'Completado', en:'Completed' });
      elK.className = 'gw-btn solved';
      elK.disabled = true;
      render();
      say(host, 'good', L({
        es:'Los tres cuadrantes tenían 16 ejemplares y riquezas distintas. La abundancia no te dice cuántas especies hay: hay que contar nombres, no cuerpos.',
        en:'All three quadrats held 16 specimens and had different richness. Abundance does not tell you how many species there are: you have to count names, not bodies.'
      }));
      return;
    }
    data = buildRound(); guess = 1; foundSet = new Set(); tries = 0; revealed = false;
    elK.textContent = L({ es:'Comprobar', en:'Check' });
    elK.className = 'gw-btn';
    render();
    say(host, '', L({
      es:'Nuevo cuadrante — empieza tocando casillas para descubrir qué especies hay.',
      en:'New quadrat — start tapping cells to discover which species are present.'
    }));
  }

  host.querySelector('[data-r="minus"]').addEventListener('click', function(){
    if (revealed || done) return;
    if (guess > 1) { guess--; elV.textContent = String(guess); }
  });
  host.querySelector('[data-r="plus"]').addEventListener('click', function(){
    if (revealed || done) return;
    if (guess < 16) { guess++; elV.textContent = String(guess); }
  });
  elK.addEventListener('click', function(){
    if (done) return;
    if (revealed){ nextRound(); return; }
    if (guess === data.k){
      say(host, 'good', L({
        es:'Correcto: ' + data.k + ' especies distintas entre los 16 ejemplares.',
        en:'Correct: ' + data.k + ' different species among the 16 specimens.'
      }));
      setTimeout(nextRound, 900);
      return;
    }
    tries++;
    if (tries >= 3){
      revealed = true;
      guess = data.k;
      foundSet = new Set(data.sp.map(function(_, i){ return i; }));
      render();
      elK.textContent = L({ es:'Siguiente', en:'Next' });
      say(host, 'miss', L({
        es:'La riqueza era ' + data.k + '. Los nombres distintos del cuadro son: ' + data.sp.map(function(o){ return L(o); }).join(', ') + '.',
        en:'The richness was ' + data.k + '. The different names in the quadrat are: ' + data.sp.map(function(o){ return L(o); }).join(', ') + '.'
      }));
      return;
    }
    if (guess > data.k){
      say(host, 'warm', L({
        es:'Vas por arriba: el número que propones es mayor que los nombres distintos. Toca todas las casillas que no hayas tocado aún y comprueba si aparece algún nombre nuevo.',
        en:'You are too high: your number is greater than the different names. Tap any cells you haven\'t tried yet and see if a new name appears.'
      }));
    } else {
      say(host, 'warm', L({
        es:'Vas por abajo: hay más nombres de los que encontraste. Toca las casillas que todavía no marcaste — cada una puede revelar una especie nueva.',
        en:'You are too low: there are more names than you found. Tap the cells you haven\'t touched yet — each one may reveal a new species.'
      }));
    }
  });

  data = buildRound();
  render();
  say(host, '', L({
    es:'Toca cualquier casilla para empezar. Todas las casillas de esa misma especie se marcarán juntas y aparecerán en la leyenda. Cuando hayas tocado suficientes para conocer todos los nombres, propón la riqueza.',
    en:'Tap any cell to start. All cells of that same species will light up together and appear in the legend. Once you have tapped enough cells to know all the names, propose the richness.'
  }));
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 2 :: el arroyo, año por año  (REDESIGNED)

   Original problem: slider gave richness number for free — student just dragged
   right until the number dipped. No reading, no reasoning about loss.

   New design: two phases per round.

   PHASE 1 — READ THE RECORD
   The slider is hidden. Instead, the student sees a table of species with their
   last-recorded year. They must study it and then answer: which species was the
   FIRST to disappear (i.e. has the earliest last-year)? They pick from 4
   options. This forces them to actually read the historical record.

   PHASE 2 — FIND THE TIPPING YEAR
   Now the slider appears. Student drags to find the first year richness drops
   below the given threshold. They already know which species goes first, so
   they can reason: "the earliest disappearance is year X, so the drop must
   happen around there." The slider now has meaning — it's confirming what
   they read, not randomly hunting a number.

   Three rounds. After completing both phases per round the student gets
   the ecological punchline: loss is gradual, step by step, not sudden.
   ══════════════════════════════════════════════════════════════════════════ */
function wYears(rng, host){
  var POOL = [
    { es:'martín pescador', en:'kingfisher' },
    { es:'garza blanca', en:'white egret' },
    { es:'rana de árbol', en:'tree frog' },
    { es:'ajolote del canal', en:'canal axolotl' },
    { es:'libélula azul', en:'blue dragonfly' },
    { es:'carpa', en:'carp' },
    { es:'tortuga de río', en:'river turtle' },
    { es:'sapo del cauce', en:'streambed toad' },
    { es:'camarón de río', en:'river shrimp' },
    { es:'chara azul', en:'blue jay' },
    { es:'nutria', en:'otter' },
    { es:'caracol de agua', en:'water snail' }
  ];
  var Y0 = 1995, Y1 = 2025;
  var round = 0, tries = 0, revealed = false, done = false, cur = Y0, data = null;
  var phase = 1;   // 1 = identify first-lost species; 2 = find tipping year
  var p1done = false, p1tries = 0;

  function buildRound(){
    var keep = ri(rng, 4, 6);                          // species that survive to Y1
    var sp = shuffle(POOL, rng).slice(0, 10);          // pick 10 from pool
    var last = [];
    for (var i = 0; i < sp.length; i++){
      last.push(i < keep ? Y1 : ri(rng, 1999, 2022)); // survivors vs. lost
    }
    // Ensure at least 3 species are genuinely lost (different years)
    // Sort lost species so they have distinct years
    var lostIdx = [];
    for (var i2 = 0; i2 < last.length; i2++) if (last[i2] < Y1) lostIdx.push(i2);
    // Give each lost species a unique year
    var usedYrs = {};
    for (var li = 0; li < lostIdx.length; li++){
      var yr;
      do { yr = ri(rng, 1999, 2022); } while (usedYrs[yr]);
      usedYrs[yr] = true;
      last[lostIdx[li]] = yr;
    }
    var target = ri(rng, 8, 9);          // richness threshold
    var ans = Y1;
    for (var y = Y0; y <= Y1; y++){
      var n = 0;
      for (var j = 0; j < last.length; j++) if (last[j] >= y) n++;
      if (n < target){ ans = y; break; }
    }
    // First-lost species = one with smallest last[] value (excluding survivors)
    var firstLostIdx = -1, firstLostYr = Y1 + 1;
    for (var k = 0; k < last.length; k++){
      if (last[k] < Y1 && last[k] < firstLostYr){ firstLostYr = last[k]; firstLostIdx = k; }
    }
    return { sp:sp, last:last, target:target, ans:ans, firstLostIdx:firstLostIdx, firstLostYr:firstLostYr };
  }

  function rich(y){
    var n = 0;
    for (var j = 0; j < data.last.length; j++) if (data.last[j] >= y) n++;
    return n;
  }

  // Build 4 MC options for phase 1: correct + 3 distractors (other lost species or survivors)
  function buildP1Opts(){
    var correct = data.sp[data.firstLostIdx];
    var others = [];
    for (var i = 0; i < data.sp.length; i++){
      if (i !== data.firstLostIdx) others.push(i);
    }
    others = shuffle(others, rng).slice(0, 3);
    var opts = [{ sp: correct, correct: true }];
    for (var o = 0; o < others.length; o++) opts.push({ sp: data.sp[others[o]], correct: false });
    return shuffle(opts, rng);
  }

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'El arroyo, año por año', en:'The stream, year by year' }) + '</div>' +
    '<div class="gw-q" data-r="q"></div>' +
    '<div class="gw-mini" data-r="mini"></div>' +
    // Phase 1: species table + MC question
    '<div data-r="phase1">' +
      '<div class="yr-table" data-r="tbl"></div>' +
      '<div class="gw-q" style="margin-top:.7rem;font-size:.83rem;" data-r="p1q"></div>' +
      '<div class="mcopts" data-r="p1opts"></div>' +
    '</div>' +
    // Phase 2: slider
    '<div data-r="phase2" style="display:none">' +
      '<input class="yr" type="range" data-r="sl" min="' + Y0 + '" max="' + Y1 + '" step="1" value="' + Y0 + '">' +
      '<div class="gw-read" data-r="read"></div>' +
      '<div class="pool" data-r="pool"></div>' +
    '</div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Comprobar', en:'Check' }) + '</button></div>' +
    '<div class="gw-fb"></div>';

  var elQ    = host.querySelector('[data-r="q"]'),
      elMini = host.querySelector('[data-r="mini"]'),
      elPh1  = host.querySelector('[data-r="phase1"]'),
      elPh2  = host.querySelector('[data-r="phase2"]'),
      elTbl  = host.querySelector('[data-r="tbl"]'),
      elP1Q  = host.querySelector('[data-r="p1q"]'),
      elP1O  = host.querySelector('[data-r="p1opts"]'),
      elS    = host.querySelector('[data-r="sl"]'),
      elR    = host.querySelector('[data-r="read"]'),
      elPool = host.querySelector('[data-r="pool"]'),
      elK    = host.querySelector('[data-r="chk"]');

  // CSS for the table (injected once)
  (function(){
    var s = document.createElement('style');
    s.textContent =
      '.yr-table{border:1px solid var(--border);border-radius:9px;overflow:hidden;margin:.4rem 0;}' +
      '.yr-row{display:grid;grid-template-columns:1fr auto;padding:.38rem .7rem;font-size:.78rem;border-bottom:1px solid var(--border);align-items:center;gap:.5rem;}' +
      '.yr-row:last-child{border-bottom:none;}' +
      '.yr-row.lost{background:var(--bad-bg);}' +
      '.yr-row.alive{background:var(--surface);}' +
      '.yr-row.revealed-first{background:var(--gold-bg);border-left:3px solid var(--gold);}' +
      '.yr-badge{font-family:"IBM Plex Mono",monospace;font-size:.72rem;font-weight:700;padding:.15rem .4rem;border-radius:5px;}' +
      '.yr-badge.lost{background:var(--bad-bg);color:var(--bad);}' +
      '.yr-badge.alive{background:var(--ok-bg);color:var(--ok);}' +
      '.yr-hdr{display:grid;grid-template-columns:1fr auto;padding:.32rem .7rem;font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);background:var(--surface2);border-bottom:1px solid var(--border);}';
    document.head.appendChild(s);
  })();

  var p1opts = [];

  function renderTable(showAll){
    // Show table of species + their last year
    // During phase 1: show names but hide years (student must reason)
    // showAll = false during phase1 question, true after phase1 solved/revealed
    var rows = '<div class="yr-hdr"><span>' + L({es:'Especie',en:'Species'}) + '</span><span>' + L({es:'Último registro',en:'Last recorded'}) + '</span></div>';
    for (var i = 0; i < data.sp.length; i++){
      var isLost = data.last[i] < Y1;
      var isFirst = (i === data.firstLostIdx);
      var rowCls = 'yr-row ' + (showAll ? (isLost ? 'lost' : 'alive') : 'alive') + (showAll && isFirst ? ' revealed-first' : '');
      var badge = showAll
        ? ('<span class="yr-badge ' + (isLost ? 'lost' : 'alive') + '">' + (isLost ? data.last[i] : L({es:'presente',en:'present'})) + '</span>')
        : '<span class="yr-badge alive">?</span>';
      rows += '<div class="' + rowCls + '"><span>' + L(data.sp[i]) + '</span>' + badge + '</div>';
    }
    elTbl.innerHTML = rows;
  }

  function renderP1(){
    elQ.textContent = L({
      es:'Tramo ' + (round + 1) + ' de 3 — registro histórico del arroyo',
      en:'Stretch ' + (round + 1) + ' of 3 — historical stream record'
    });
    elMini.innerHTML = L({
      es:'Lee el registro. Los años que aparecen son el <strong>último año en que esa especie fue vista</strong> en este tramo.',
      en:'Read the record. The years shown are the <strong>last year that species was seen</strong> in this stretch.'
    });
    renderTable(true);
    elP1Q.textContent = L({
      es:'¿Cuál fue la primera especie en dejar de registrarse (la que tiene el año más antiguo)?',
      en:'Which species was the first to stop being recorded (the one with the earliest last year)?'
    });
    p1opts = buildP1Opts();
    elP1O.innerHTML = p1opts.map(function(opt, i){
      return '<div class="mcopt" data-oi="' + i + '"><span>' + L(opt.sp) + '</span></div>';
    }).join('');
    elP1O.querySelectorAll('.mcopt').forEach(function(el){
      el.addEventListener('click', function(){
        if (p1done) return;
        var oi = parseInt(el.getAttribute('data-oi'), 10);
        var opt = p1opts[oi];
        p1tries++;
        if (opt.correct){
          p1done = true;
          el.classList.add('sc');
          elP1O.querySelectorAll('.mcopt').forEach(function(e){ e.classList.add('dis'); });
          say(host, 'good', L({
            es:'Correcto: ' + L(opt.sp) + ' fue la primera en desaparecer (' + data.firstLostYr + '). Ahora usa el cursor para encontrar en qué año la riqueza cae por debajo de ' + data.target + ' especies por primera vez.',
            en:'Correct: ' + L(opt.sp) + ' was the first to disappear (' + data.firstLostYr + '). Now use the slider to find the year when richness drops below ' + data.target + ' species for the first time.'
          }));
          // Transition to phase 2
          setTimeout(function(){
            elPh1.style.display = 'none';
            elPh2.style.display = '';
            phase = 2;
            cur = Y0;
            elS.value = String(Y0);
            renderP2();
          }, 1200);
        } else {
          el.classList.add('sw');
          el.classList.add('dis');
          say(host, 'warm', L({
            es:'No es esa. Mira la columna de años: busca el número más pequeño entre las especies que ya no están presentes.',
            en:'Not that one. Look at the year column: find the smallest number among the species no longer present.'
          }));
        }
      });
    });
    elK.textContent = L({es:'Comprobar',en:'Check'});
    elK.className = 'gw-btn';
    elK.style.display = 'none';   // hide Check during phase 1 MC (auto-check on click)
  }

  function renderP2(){
    elQ.textContent = L({
      es:'Ahora: ¿en qué año cae la riqueza por debajo de ' + data.target + ' especies por primera vez?',
      en:'Now: in which year does richness drop below ' + data.target + ' species for the first time?'
    });
    elMini.innerHTML = L({
      es:'Arrastra el cursor. Las especies que ya no existían en ese año se apagan. El recuadro muestra la riqueza en vivo.',
      en:'Drag the slider. Species that no longer existed in that year fade out. The box shows richness live.'
    });
    elK.style.display = '';
    elK.textContent = L({es:'Comprobar año',en:'Check year'});
    elK.className = 'gw-btn';
    renderSlider();
  }

  function renderSlider(){
    elS.value = String(cur);
    elS.disabled = (revealed || done);
    elR.innerHTML =
      '<span class="gw-pill">' + L({ es:'Año', en:'Year' }) + ': <b>' + cur + '</b></span>' +
      '<span class="gw-pill">' + L({ es:'Riqueza', en:'Richness' }) + ': <b>' + rich(cur) + '</b></span>' +
      '<span class="gw-pill">' + L({ es:'Umbral', en:'Threshold' }) + ': < <b>' + data.target + '</b></span>';
    elPool.innerHTML = data.sp.map(function(o, i){
      var gone = data.last[i] < cur;
      return '<span class="chip' + (gone ? ' out' : '') + '" title="' + (gone ? L({es:'desapareció en ',en:'gone since '}) + data.last[i] : L({es:'presente',en:'present'})) + '">' + L(o) + '</span>';
    }).join('');
  }

  function nextRound(){
    round++;
    if (round >= 3){
      done = true;
      elK.textContent = L({ es:'Completado', en:'Completed' });
      elK.className = 'gw-btn solved';
      elK.disabled = true;
      say(host, 'good', L({
        es:'En los tres tramos la riqueza bajó en escalones, no de golpe: primero una especie, luego otra, luego otra. Por eso la comparación entre el registro más antiguo y el de hoy dice mucho más que cualquiera de los dos por separado.',
        en:'In all three stretches richness dropped in steps, not all at once: first one species, then another, then another. That is why comparing the oldest record with today tells far more than either one alone.'
      }));
      return;
    }
    data = buildRound(); cur = Y0; tries = 0; revealed = false;
    phase = 1; p1done = false; p1tries = 0;
    elPh1.style.display = ''; elPh2.style.display = 'none';
    renderP1();
    say(host, '', L({
      es:'Nuevo tramo — lee el registro y encuentra qué especie fue la primera en desaparecer.',
      en:'New stretch — read the record and find which species was the first to disappear.'
    }));
  }

  elS.addEventListener('input', function(){
    if (revealed || done) return;
    cur = parseInt(elS.value, 10);
    renderSlider();
  });

  elK.addEventListener('click', function(){
    if (done) return;
    if (phase !== 2) return;
    if (revealed){ nextRound(); return; }
    if (cur === data.ans){
      say(host, 'good', L({
        es:'Correcto: en ' + data.ans + ' la riqueza cae a ' + rich(data.ans) + ' especies, por debajo de ' + data.target + ' por primera vez. ¿Ves el escalón? Justo ahí una especie deja de aparecer y el número baja de golpe.',
        en:'Correct: in ' + data.ans + ' richness falls to ' + rich(data.ans) + ' species, below ' + data.target + ' for the first time. See the step? Right there a species stops appearing and the count drops sharply.'
      }));
      setTimeout(nextRound, 1000);
      return;
    }
    tries++;
    if (tries >= 3){
      revealed = true;
      cur = data.ans;
      renderSlider();
      elK.textContent = L({ es:'Siguiente', en:'Next' });
      say(host, 'miss', L({
        es:'Era ' + data.ans + '. Busca en el registro la especie con el año más cercano al umbral y el cursor encaja justo ahí.',
        en:'It was ' + data.ans + '. Find in the record the species whose last year is closest to the threshold and the slider fits right there.'
      }));
      return;
    }
    if (rich(cur) >= data.target){
      say(host, 'warm', L({
        es:'En ' + cur + ' todavía hay ' + rich(cur) + ' especies — no ha bajado del umbral todavía. Avanza el cursor.',
        en:'In ' + cur + ' there are still ' + rich(cur) + ' species — not yet below the threshold. Move the slider forward.'
      }));
    } else {
      say(host, 'warm', L({
        es:'En ' + cur + ' ya hay solo ' + rich(cur) + ' especies, que sí es menor que ' + data.target + ', pero ¿fue ese el primer año? Regresa el cursor hasta el escalón exacto.',
        en:'In ' + cur + ' there are only ' + rich(cur) + ' species, which is below ' + data.target + ', but was that the first year? Move the slider back to the exact step.'
      }));
    }
  });

  data = buildRound();
  renderP1();
  say(host, '', L({
    es:'Lee la tabla: muestra el último año en que cada especie fue registrada en este tramo del arroyo.',
    en:'Read the table: it shows the last year each species was recorded in this stretch of the stream.'
  }));
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 3 :: las cuatro razones
   Ocho frases de una asamblea vecinal, cuatro cajones. La frase que se falla
   tres veces se revela con su motivo y el ejercicio avanza (Rule 8).
   ══════════════════════════════════════════════════════════════════════════ */
function wClassify(rng, host){
  var BINS = [
    { es:'Biológica', en:'Biological' },
    { es:'Cultural', en:'Cultural' },
    { es:'Estética', en:'Aesthetic' },
    { es:'Ética', en:'Ethical' }
  ];
  var ITEMS = [
    { es:'Los murciélagos del cerro se comen los insectos que atacan la milpa', en:'The bats on the hill eat the insects that attack the cornfield', bin:0 },
    { es:'El cempasúchil de la ladera se corta cada año para la ofrenda de la casa', en:'The marigold on the hillside is cut every year for the family offering', bin:1 },
    { es:'La gente sube al mirador de madrugada nada más para oír a los pájaros', en:'People climb to the lookout at dawn just to hear the birds', bin:2 },
    { es:'El sapo del canal tiene derecho a seguir existiendo aunque no nos sirva de nada', en:'The canal toad has a right to go on existing even if it is of no use to us', bin:3 },
    { es:'Las raíces del sauce sostienen la orilla y evitan que el talud se derrumbe', en:'The willow roots hold the bank and keep the slope from collapsing', bin:0 },
    { es:'El barrio se llama así por el amate que estaba en la plaza desde hace generaciones', en:'The neighbourhood is named after the fig tree that stood in the square for generations', bin:1 },
    { es:'Quien viene de visita se lleva la imagen del valle cubierto de flores moradas', en:'Visitors take away the image of the valley covered in purple flowers', bin:2 },
    { es:'Secar el humedal le quita a quienes vengan después lo que nosotros sí alcanzamos a ver', en:'Draining the wetland takes from those who come later what we did get to see', bin:3 }
  ];
  var WHY = [
    { es:'toca un proceso natural del que dependen otras especies y también las personas', en:'it touches a natural process other species and people depend on' },
    { es:'habla de un uso heredado, de una fiesta o de un nombre que la gente conserva', en:'it speaks of an inherited use, a festival or a name that people keep' },
    { es:'habla del disfrute de mirar, oír o estar en ese lugar', en:'it speaks of the enjoyment of looking at, listening to or being in that place' },
    { es:'sostiene un valor o un derecho aunque nadie gane nada con ello', en:'it upholds a value or a right even when nobody gains anything from it' }
  ];
  var seq = shuffle(ITEMS.map(function(_, i){ return i; }), rng);
  var i = 0, tries = 0, hits = 0, done = false;

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'La asamblea del barrio', en:'The neighbourhood assembly' }) + '</div>' +
    '<div class="gw-q" data-r="q"></div>' +
    '<div class="gw-mini">' + L({
      es:'Lee la razón que da cada vecino y colócala en el cajón que le corresponde.',
      en:'Read the reason each neighbour gives and put it in the drawer it belongs to.'
    }) + '</div>' +
    '<div class="clscard" data-r="card"></div>' +
    '<div class="binrow" data-r="bins"></div>' +
    '<div class="gw-fb"></div>';

  var elQ = host.querySelector('[data-r="q"]'),
      elC = host.querySelector('[data-r="card"]'),
      elB = host.querySelector('[data-r="bins"]');

  function render(){
    if (done){
      elQ.textContent = L({ es:'Cajones cerrados', en:'Drawers closed' });
      elC.textContent = L({
        es:'Colocaste bien ' + hits + ' de ' + ITEMS.length + ' razones a la primera. Las cuatro clases valen y suelen aparecer juntas en una misma asamblea.',
        en:'You placed ' + hits + ' of ' + ITEMS.length + ' reasons correctly on the first try. All four kinds count and they usually turn up together in one assembly.'
      });
      elB.innerHTML = '';
      return;
    }
    elQ.textContent = L({
      es:'Razón ' + (i + 1) + ' de ' + ITEMS.length,
      en:'Reason ' + (i + 1) + ' of ' + ITEMS.length
    });
    elC.textContent = L(ITEMS[seq[i]]);
    elB.innerHTML = BINS.map(function(b, bi){
      return '<button class="bin" data-b="' + bi + '">' + L(b) + '</button>';
    }).join('');
    elB.querySelectorAll('.bin').forEach(function(btn){
      btn.addEventListener('click', function(){ pick(parseInt(btn.getAttribute('data-b'), 10)); });
    });
  }

  function advance(){
    i++; tries = 0;
    if (i >= ITEMS.length) done = true;
    render();
  }

  function pick(bi){
    var it = ITEMS[seq[i]];
    if (bi === it.bin){
      if (tries === 0) hits++;
      say(host, 'good', L({
        es:'Sí: es una razón ' + L(BINS[it.bin]).toLowerCase() + ' porque ' + L(WHY[it.bin]) + '.',
        en:'Yes: it is a ' + L(BINS[it.bin]).toLowerCase() + ' reason because ' + L(WHY[it.bin]) + '.'
      }));
      setTimeout(advance, 900);
      return;
    }
    tries++;
    if (tries >= 3){
      say(host, 'miss', L({
        es:'Iba en ' + L(BINS[it.bin]) + ', porque ' + L(WHY[it.bin]) + '.',
        en:'It went in ' + L(BINS[it.bin]) + ', because ' + L(WHY[it.bin]) + '.'
      }));
      setTimeout(advance, 1600);
      return;
    }
    say(host, 'warm', L({
      es:'Ahí no: en ese cajón va lo que ' + L(WHY[bi]) + '. Vuelve a leer la frase y pregúntate qué se perdería exactamente.',
      en:'Not there: that drawer holds what ' + L(WHY[bi]) + '. Read the sentence again and ask yourself what exactly would be lost.'
    }));
  }

  render();
  say(host, '', L({
    es:'Ocho vecinos, cuatro maneras distintas de defender lo mismo.',
    en:'Eight neighbours, four different ways of defending the same thing.'
  }));
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 4 :: cada causa con su acción
   Cuatro causas de pérdida y cuatro acciones. Se toca la causa y luego la
   acción; tocar una causa ya emparejada la libera. Reversible, con reveal.
   ══════════════════════════════════════════════════════════════════════════ */
function wMatch(rng, host){
  var PAIRS = [
    { c:{ es:'El agua del arroyo llega con aceite y jabón de los talleres de la avenida', en:'The stream water arrives with oil and soap from the workshops on the avenue' },
      a:{ es:'Acordar con los talleres un punto de acopio del aceite usado y darle seguimiento', en:'Agree with the workshops on a used oil collection point and follow it up' },
      w:{ es:'el aceite sigue entrando al agua', en:'the oil keeps entering the water' } },
    { c:{ es:'Cada temporada se quema el pastizal del lote para limpiarlo de maleza', en:'Every season the grassland on the lot is burned to clear it of weeds' },
      a:{ es:'Acordar con los vecinos una limpieza sin fuego y avisarla antes de cada temporada', en:'Agree with the neighbours on a fire free clearing and announce it before each season' },
      w:{ es:'el fuego vuelve el año que entra', en:'the fire comes back next year' } },
    { c:{ es:'Los perros sueltos del parque alcanzan los nidos de las aves que anidan en el suelo', en:'Loose dogs in the park reach the nests of birds that nest on the ground' },
      a:{ es:'Cercar y señalizar la zona de anidación durante los meses de crianza', en:'Fence and sign the nesting area during the breeding months' },
      w:{ es:'los nidos siguen al alcance', en:'the nests stay within reach' } },
    { c:{ es:'Una planta traída de otra región cubrió la orilla y desplazó a las de la zona', en:'A plant brought from another region covered the bank and pushed out the local ones' },
      a:{ es:'Retirar esa planta a mano y sembrar en su lugar especies de la propia zona', en:'Remove that plant by hand and plant local species in its place' },
      w:{ es:'la planta traída sigue ganando terreno', en:'the introduced plant keeps gaining ground' } }
  ];
  var order = shuffle(PAIRS.map(function(_, i){ return i; }), rng);
  var assign = [-1, -1, -1, -1];
  var sel = -1, tries = 0, done = false, revealed = false;

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Cada causa con su acción', en:'Each cause with its action' }) + '</div>' +
    '<div class="gw-q">' + L({
      es:'Cuatro pérdidas detectadas en el barrio. Elige para cada una la acción que sí toca lo que la provoca.',
      en:'Four losses detected in the neighbourhood. For each one choose the action that actually touches what causes it.'
    }) + '</div>' +
    '<div class="gw-mini">' + L({
      es:'Toca una causa y después una acción. Si te arrepientes, vuelve a tocar la causa para liberarla.',
      en:'Tap a cause and then an action. If you change your mind, tap the cause again to release it.'
    }) + '</div>' +
    '<div class="mtrow" data-r="causes"></div>' +
    '<div class="gw-mini">' + L({ es:'Acciones disponibles', en:'Available actions' }) + '</div>' +
    '<div class="pool" data-r="acts"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Comprobar', en:'Check' }) + '</button></div>' +
    '<div class="gw-fb"></div>';

  var elC = host.querySelector('[data-r="causes"]'),
      elA = host.querySelector('[data-r="acts"]'),
      elK = host.querySelector('[data-r="chk"]');

  function render(){
    elC.innerHTML = PAIRS.map(function(p, ci){
      var cls = 'mtcause' + (sel === ci ? ' sel' : '') + (revealed || done ? ' good' : '');
      var slot = assign[ci] < 0
        ? L({ es:'sin acción asignada', en:'no action assigned yet' })
        : L(PAIRS[assign[ci]].a);
      return '<div class="' + cls + '" data-c="' + ci + '">' + L(p.c) +
        '<span class="mtslot">' + slot + '</span></div>';
    }).join('');
    elA.innerHTML = order.map(function(ai){
      var used = assign.indexOf(ai) >= 0;
      return '<button class="mtact" data-a="' + ai + '"' + (used || revealed || done ? ' disabled' : '') + '>' + L(PAIRS[ai].a) + '</button>';
    }).join('');
    if (revealed || done) return;
    elC.querySelectorAll('.mtcause').forEach(function(d){
      d.addEventListener('click', function(){
        var ci = parseInt(d.getAttribute('data-c'), 10);
        if (assign[ci] >= 0){ assign[ci] = -1; sel = ci; }
        else sel = (sel === ci ? -1 : ci);
        render();
      });
    });
    elA.querySelectorAll('.mtact').forEach(function(b){
      b.addEventListener('click', function(){
        if (sel < 0){
          say(host, 'warm', L({ es:'Primero toca la causa a la que quieres dirigir esa acción.', en:'First tap the cause you want to aim that action at.' }));
          return;
        }
        assign[sel] = parseInt(b.getAttribute('data-a'), 10);
        sel = -1;
        render();
      });
    });
  }

  elK.addEventListener('click', function(){
    if (done) return;
    if (revealed){
      done = true;
      elK.textContent = L({ es:'Completado', en:'Completed' });
      elK.className = 'gw-btn solved';
      elK.disabled = true;
      return;
    }
    if (assign.indexOf(-1) >= 0){
      say(host, 'warm', L({ es:'Falta asignar acción a alguna causa. Ninguna se resuelve sola.', en:'Some cause still has no action. None of them solves itself.' }));
      return;
    }
    var bad = -1;
    for (var ci = 0; ci < PAIRS.length; ci++) if (assign[ci] !== ci){ bad = ci; break; }
    if (bad < 0){
      done = true;
      elK.textContent = L({ es:'Completado', en:'Completed' });
      elK.className = 'gw-btn solved';
      elK.disabled = true;
      render();
      say(host, 'good', L({
        es:'Las cuatro acciones quedaron dirigidas a su causa. Fíjate en el patrón: ninguna es espectacular, todas quitan lo que hace el daño o protegen el sitio mientras se recupera.',
        en:'All four actions ended up aimed at their cause. Notice the pattern: none of them is spectacular, they all remove what does the damage or protect the site while it recovers.'
      }));
      return;
    }
    tries++;
    if (tries >= 3){
      revealed = true;
      for (var k = 0; k < PAIRS.length; k++) assign[k] = k;
      render();
      elK.textContent = L({ es:'Entendido', en:'Got it' });
      say(host, 'miss', L({
        es:'Este es el emparejamiento que toca cada causa. Léelo al revés: si quitas la acción, ' + L(PAIRS[bad].w) + '.',
        en:'This is the pairing that touches each cause. Read it backwards: if you remove the action, ' + L(PAIRS[bad].w) + '.'
      }));
      return;
    }
    assign[bad] = -1;
    render();
    say(host, 'warm', L({
      es:'La acción que pusiste en la primera causa marcada no la resuelve: con ella, ' + L(PAIRS[bad].w) + '. Elige otra para esa causa.',
      en:'The action you put on the first flagged cause does not solve it: with that action, ' + L(PAIRS[bad].w) + '. Choose another one for that cause.'
    }));
  });

  render();
  say(host, '', L({
    es:'Antes de elegir, pregúntate qué es exactamente lo que está provocando la pérdida en cada caso.',
    en:'Before choosing, ask yourself what exactly is causing the loss in each case.'
  }));
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 5 :: arma el argumento  (FIXED: drag-and-drop ordering)
   The five steps of natural selection, scrambled. Drag cards into order.
   Numbers update live as the student rearranges. The hint names the first
   out-of-place step. After 3 wrong checks the correct order is revealed.
   ══════════════════════════════════════════════════════════════════════════ */
function wSequence(rng, host){
  var STEPS = [
    { es:'Dentro de una población los individuos no son idénticos: hay variación', en:'Within a population individuals are not identical: there is variation' },
    { es:'Parte de esa variación pasa de padres a hijos, es decir, se hereda', en:'Part of that variation passes from parents to offspring, that is, it is inherited' },
    { es:'Nacen más descendientes de los que el lugar puede mantener', en:'More descendants are born than the place can support' },
    { es:'Los que llevan la variante ventajosa en ese ambiente dejan más descendencia', en:'Those carrying the advantageous variant in that environment leave more offspring' },
    { es:'Generación tras generación cambia la población y aparecen especies distintas', en:'Generation after generation the population changes and different species appear' }
  ];
  var ord = shuffle(STEPS.map(function(_, i){ return i; }), rng);
  if (ord.every(function(v, i){ return v === i; })){ var t0 = ord[0]; ord[0] = ord[4]; ord[4] = t0; }
  var tries = 0, done = false, dragSrcPos = -1;

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Arma el argumento', en:'Assemble the argument' }) + '</div>' +
    '<div class="gw-q">' + L({
      es:'Ordena los cinco pasos del razonamiento de Darwin y Wallace, del que se observa primero al que resulta al final.',
      en:'Order the five steps of Darwin and Wallace\'s reasoning, from the one observed first to the one that results at the end.'
    }) + '</div>' +
    '<div class="tl-drag-hint">☰ ' + L({
      es:'Arrastra cada paso a la posición correcta. Los números muestran el orden actual.',
      en:'Drag each step to the right position. The numbers show the current order.'
    }) + '</div>' +
    '<div class="tl-list" data-r="list"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Comprobar orden', en:'Check order' }) + '</button></div>' +
    '<div class="gw-fb"></div>';

  var elL = host.querySelector('[data-r="list"]'),
      elK = host.querySelector('[data-r="chk"]');

  function render(){
    elL.innerHTML = ord.map(function(si, pos){
      var cls = 'tl-chip' + (done ? ' locked' : '');
      return '<div class="' + cls + '" draggable="' + (!done) + '" data-p="' + pos + '">' +
               '<span class="tl-num">' + (pos + 1) + '</span>' +
               '<span>' + L(STEPS[si]) + '</span>' +
             '</div>';
    }).join('');

    if (done) return;

    var chips = elL.querySelectorAll('.tl-chip');
    chips.forEach(function(chip){
      chip.addEventListener('dragstart', function(e){
        dragSrcPos = parseInt(chip.getAttribute('data-p'), 10);
        chip.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', String(dragSrcPos));
      });
      chip.addEventListener('dragend', function(){
        chip.classList.remove('dragging');
        elL.querySelectorAll('.tl-chip').forEach(function(c){ c.classList.remove('drag-over'); });
      });
      chip.addEventListener('dragover', function(e){
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        elL.querySelectorAll('.tl-chip').forEach(function(c){ c.classList.remove('drag-over'); });
        chip.classList.add('drag-over');
      });
      chip.addEventListener('dragleave', function(){
        chip.classList.remove('drag-over');
      });
      chip.addEventListener('drop', function(e){
        e.preventDefault();
        chip.classList.remove('drag-over');
        var destPos = parseInt(chip.getAttribute('data-p'), 10);
        if (dragSrcPos === destPos || dragSrcPos < 0) return;
        // Move the dragged item to the destination index
        var moved = ord.splice(dragSrcPos, 1)[0];
        ord.splice(destPos, 0, moved);
        dragSrcPos = -1;
        render();
      });
    });
  }

  elK.addEventListener('click', function(){
    if (done) return;
    if (ord.every(function(si, pos){ return si === pos; })){
      done = true;
      render();
      elK.textContent = L({ es:'Completado', en:'Completed' });
      elK.className = 'gw-btn solved';
      elK.disabled = true;
      say(host, 'good', L({
        es:'Ese es el orden. Cada paso solo tiene sentido si el anterior ya ocurrió: sin variación no hay nada que heredar, y sin herencia la ventaja se pierde con el individuo.',
        en:'That is the order. Each step only makes sense if the previous one already happened: without variation there is nothing to inherit, and without inheritance the advantage dies with the individual.'
      }));
      return;
    }
    tries++;
    if (tries >= 3){
      ord = STEPS.map(function(_, i){ return i; });
      done = true;
      render();
      elK.textContent = L({ es:'Entendido', en:'Got it' });
      elK.className = 'gw-btn solved';
      elK.disabled = true;
      say(host, 'miss', L({
        es:'Este es el orden correcto. Léelo de arriba abajo y verás que cada paso hace posible al siguiente.',
        en:'This is the correct order. Read it from top to bottom and you will see that each step makes the next one possible.'
      }));
      return;
    }
    var bad = 0;
    for (var p = 0; p < ord.length; p++){ if (ord[p] !== p){ bad = p; break; } }
    say(host, 'warm', L({
      es:'Todavía no. El paso en la posición ' + (bad + 1) + ' está fuera de lugar — arrastra ese paso a una posición distinta y pregúntate si lo que dice puede ocurrir antes de lo que pusiste encima.',
      en:'Not yet. The step in position ' + (bad + 1) + ' is out of place — drag it to a different position and ask yourself whether what it says can happen before what you placed above it.'
    }));
  });

  render();
  say(host, '', L({
    es:'Arrastra los pasos hasta que el orden tenga sentido lógico: empieza por lo que cualquiera puede observar en una población hoy, y termina por lo que tarda generaciones en verse.',
    en:'Drag the steps until the order makes logical sense: start with what anyone can observe in a population today, and end with what takes generations to see.'
  }));
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 6 :: el prado  (FIXED: clearer goal + explanation + visual)
   Students had no idea what to do or why. Fixed by:
   1. A bold, explicit goal banner at the top with the target color named.
   2. A "what just happened" explanation after each generation button press.
   3. Beetles shown as distinct emoji squares (🟡 light / 🟫 dark) so the
      difference between variants is immediately visible.
   4. Explicit instruction: choose the ground that MATCHES the goal color.
   ══════════════════════════════════════════════════════════════════════════ */
function wMeadow(rng, host){
  var TOTAL = 24;
  var goalDark = rng() < 0.5;
  var goal = { es: goalDark ? 'oscuros' : 'claros', en: goalDark ? 'dark' : 'light' };
  var goalEmoji = goalDark ? '🟫' : '🟡';
  var ground = 'claro', light = 12, dark = 12, gen = 0, done = false, warned = false;

  // Explain the concept once before interaction
  var intro = L({
    es:'En el prado viven escarabajos de dos colores: <strong>claros 🟡</strong> y <strong>oscuros 🟫</strong>. Las aves cazan primero a los que más contrastan con el suelo. Los que sobreviven se reproducen y sus crías heredan su color — así cambia la proporción generación a generación. Ningún escarabajo cambia de color durante su vida.',
    en:'In the meadow live beetles of two colours: <strong>light 🟡</strong> and <strong>dark 🟫</strong>. Birds catch first the ones that stand out most against the ground. Those that survive reproduce and their offspring inherit their colour — this is how the proportion changes generation by generation. No beetle changes colour during its lifetime.'
  });

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'El prado', en:'The meadow' }) + '</div>' +
    '<div class="callout" style="margin-bottom:.6rem">' + intro + '</div>' +
    '<div class="gw-q" data-r="goal-q"></div>' +
    '<div class="gw-mini">' + L({
      es:'<strong>Cómo lograrlo:</strong> elige un suelo que se parezca al color de tu meta. Los escarabajos que se camuflan sobreviven más, se reproducen más y su variante aumenta. Luego pulsa "Pasar una generación" varias veces y observa cómo cambia la proporción.',
      en:'<strong>How to do it:</strong> choose a ground that matches your target colour. Beetles that blend in survive more, reproduce more, and their variant increases. Then press "Let one generation pass" several times and watch the proportion change.'
    }) + '</div>' +
    '<div class="gw-row">' +
      '<button class="gw-btn on" data-r="gclaro">' + L({ es:'🟡 Suelo claro', en:'🟡 Light ground' }) + '</button>' +
      '<button class="gw-btn" data-r="goscuro">' + L({ es:'🟫 Suelo oscuro', en:'🟫 Dark ground' }) + '</button>' +
    '</div>' +
    '<div style="margin:.5rem 0 .1rem;">' +
      '<div style="font-size:.72rem;color:var(--text3);margin-bottom:.25rem;" data-r="ground-lbl"></div>' +
      '<div class="field claro" data-r="field"></div>' +
    '</div>' +
    '<div class="bars">' +
      '<div class="barlbl"><span data-r="ll"></span></div><div class="bar"><div class="barf claro" data-r="bl"></div></div>' +
      '<div class="barlbl"><span data-r="ld"></span></div><div class="bar"><div class="barf oscuro" data-r="bd"></div></div>' +
    '</div>' +
    '<div class="gw-read" data-r="read"></div>' +
    '<div class="gw-row">' +
      '<button class="gw-btn" data-r="gen">' + L({ es:'Pasar una generación ▶', en:'Let one generation pass ▶' }) + '</button>' +
      '<button class="gw-btn" data-r="rst">' + L({ es:'Reiniciar', en:'Reset' }) + '</button>' +
    '</div>' +
    '<div class="gw-fb"></div>';

  var elGoalQ   = host.querySelector('[data-r="goal-q"]'),
      elGroundL = host.querySelector('[data-r="ground-lbl"]'),
      elF    = host.querySelector('[data-r="field"]'),
      elLL   = host.querySelector('[data-r="ll"]'),
      elLD   = host.querySelector('[data-r="ld"]'),
      elBL   = host.querySelector('[data-r="bl"]'),
      elBD   = host.querySelector('[data-r="bd"]'),
      elR    = host.querySelector('[data-r="read"]'),
      elG    = host.querySelector('[data-r="gen"]'),
      elX    = host.querySelector('[data-r="rst"]'),
      bC     = host.querySelector('[data-r="gclaro"]'),
      bO     = host.querySelector('[data-r="goscuro"]');

  function target(){ return goalDark ? dark : light; }

  function render(){
    // Goal banner
    elGoalQ.innerHTML =
      '<strong>' + goalEmoji + ' ' + L({
        es:'Meta: consigue que al menos 20 de los 24 escarabajos sean ' + L(goal) + '.',
        en:'Goal: get at least 20 of the 24 beetles to be ' + L(goal) + '.'
      }) + '</strong>';

    // Ground label
    elGroundL.textContent = L({
      es:'Suelo actual: ' + (ground === 'claro' ? '🟡 claro' : '🟫 oscuro') +
         ' — sobre este suelo los escarabajos ' + (ground === 'claro' ? 'claros 🟡 se camuflan' : 'oscuros 🟫 se camuflan') + ' y los ' + (ground === 'claro' ? 'oscuros 🟫 se notan' : 'claros 🟡 se notan') + '.',
      en:'Current ground: ' + (ground === 'claro' ? '🟡 light' : '🟫 dark') +
         ' — on this ground ' + (ground === 'claro' ? 'light 🟡 beetles blend in' : 'dark 🟫 beetles blend in') + ' and ' + (ground === 'claro' ? 'dark 🟫 ones stand out' : 'light 🟡 ones stand out') + '.'
    });

    elF.className = 'field ' + ground;
    var bugs = '';
    for (var i = 0; i < light; i++) bugs += '<span class="bug claro" title="' + L({es:'claro',en:'light'}) + '">🟡</span>';
    for (var j = 0; j < dark;  j++) bugs += '<span class="bug oscuro" title="' + L({es:'oscuro',en:'dark'}) + '">🟫</span>';
    elF.innerHTML = bugs;

    elLL.textContent = L({ es:'🟡 Claros: ' + light + ' / ' + TOTAL, en:'🟡 Light: ' + light + ' / ' + TOTAL });
    elLD.textContent = L({ es:'🟫 Oscuros: ' + dark + ' / ' + TOTAL, en:'🟫 Dark: ' + dark + ' / ' + TOTAL });
    elBL.style.width = Math.round(light / TOTAL * 100) + '%';
    elBD.style.width = Math.round(dark  / TOTAL * 100) + '%';

    elR.innerHTML =
      '<span class="gw-pill">' + L({ es:'Generaciones pasadas', en:'Generations passed' }) + ': <b>' + gen + '</b></span>' +
      '<span class="gw-pill">' + goalEmoji + ' ' + L({ es:'Meta', en:'Goal' }) + ': <b>20</b> ' + L(goal) + ' — ' + L({ es:'ahora', en:'now' }) + ': <b>' + target() + '</b></span>';

    bC.className = 'gw-btn' + (ground === 'claro' ? ' on' : '');
    bO.className = 'gw-btn' + (ground === 'oscuro' ? ' on' : '');
    elG.disabled = done;
  }

  function setGround(g){
    if (done) return;
    ground = g; light = 12; dark = 12; gen = 0; warned = false;
    render();
    var camouflaged = (g === 'claro') ? L({es:'claros 🟡',en:'light 🟡'}) : L({es:'oscuros 🟫',en:'dark 🟫'});
    say(host, '', L({
      es:'Suelo cambiado. Ahora los escarabajos <strong>' + camouflaged + '</strong> se camuflan y sobreviven más. Pulsa "Pasar una generación" y observa qué pasa.',
      en:'Ground changed. Now <strong>' + camouflaged + '</strong> beetles blend in and survive more. Press "Let one generation pass" and watch what happens.'
    }));
  }

  bC.addEventListener('click', function(){ setGround('claro'); });
  bO.addEventListener('click', function(){ setGround('oscuro'); });

  elX.addEventListener('click', function(){
    // Reset always works, even after done — student may want to experiment again
    done = false; warned = false;
    light = 12; dark = 12; gen = 0;
    elG.disabled = false;
    render();
    say(host, '', L({ es:'Prado reiniciado: 12 claros 🟡 y 12 oscuros 🟫. Puedes volver a intentarlo.', en:'Meadow reset: 12 light 🟡 and 12 dark 🟫. You can try again.' }));
  });

  elG.addEventListener('click', function(){
    if (done) return;
    var seenLight = (ground === 'oscuro');   // dark ground = light bugs stand out
    var sl = seenLight ? Math.floor(light * 0.6) : light;
    var sd = seenLight ? dark : Math.floor(dark * 0.6);
    var tot = sl + sd;
    if (tot === 0){ return; }
    var prevTarget = target();
    light = Math.round(TOTAL * sl / tot);
    dark = TOTAL - light;
    gen++;
    var nowTarget = target();
    render();

    if (target() >= 20){
      done = true;
      elG.disabled = true;
      say(host, 'good', L({
        es:'¡Meta alcanzada en ' + gen + ' generación' + (gen > 1 ? 'es' : '') + '! Ahora hay ' + target() + ' escarabajos ' + L(goal) + ' de ' + TOTAL + '. Los escarabajos que se camuflaban sobrevivieron más, dejaron más crías de su variante y así cambió la proporción de la población — ninguno cambió de color.',
        en:'Goal reached in ' + gen + ' generation' + (gen > 1 ? 's' : '') + '! There are now ' + target() + ' ' + L(goal) + ' beetles out of ' + TOTAL + '. The beetles that blended in survived more, left more offspring of their variant, and that is how the population proportion changed — none of them changed colour.'
      }));
      return;
    }
    if (target() < prevTarget || target() < 12){
      warned = true;
      say(host, 'warm', L({
        es:'Generación ' + gen + ': los ' + L(goal) + ' bajaron a ' + target() + '. En este suelo, los ' + L(goal) + ' son los que más se notan — las aves los cazan primero. Cambia el suelo a uno del mismo color que tu meta y la selección empujará en la dirección correcta.',
        en:'Generation ' + gen + ': ' + L(goal) + ' beetles dropped to ' + target() + '. On this ground, ' + L(goal) + ' ones stand out most — birds catch them first. Switch the ground to one matching your goal colour and selection will push in the right direction.'
      }));
      return;
    }
    if (gen >= 6 && target() < 20){
      done = true;
      elG.disabled = true;
      say(host, 'miss', L({
        es:'Clave: el suelo tiene que ser del mismo tono que los escarabajos de tu meta para que ellos se camuflen y aumenten. Elige suelo ' + L(goal) + ' y la proporción sube sola en pocas generaciones.',
        en:'Key: the ground must match the colour of your goal beetles so they camouflage and increase. Choose ' + L(goal) + ' ground and the proportion rises by itself in a few generations.'
      }));
      return;
    }
    say(host, warned ? 'warm' : '', L({
      es:'Generación ' + gen + ': ahora hay ' + target() + ' escarabajos ' + L(goal) + ' de ' + TOTAL + ' (+' + (nowTarget - prevTarget) + '). Los que se camuflaban sobrevivieron más y dejaron más crías. Sigue pasando generaciones.',

}

<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbykkuJ_apGq3vALIFd4mr3acu81c7K4OKxW-DZ-i52Ceyl3lOanXMdvbS9SIXPrLQBm/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'Estado de la Biodiversidad Local e Importancia';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
