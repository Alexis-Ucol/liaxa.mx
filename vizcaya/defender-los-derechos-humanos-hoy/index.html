      options:{ es:[
        'La de proteger, porque debe impedir que terceros dañen un derecho aunque el daño no lo cause ella misma.',
        'La de promover, porque no ha organizado campañas que expliquen a la población la importancia de cuidar el río.',
        'La de respetar, porque son sus propias oficinas las que están descargando los residuos en el cauce del río.',
        'Ninguna, porque la responsabilidad recae por completo en la empresa que realiza la descarga de residuos.' ],
        en:[
        'The duty to protect, because it must prevent third parties from harming a right even when it does not cause the harm itself.',
        'The duty to promote, because it has not organized campaigns explaining to the population the importance of caring for the river.',
        'The duty to respect, because its own offices are the ones dumping the waste into the riverbed.',
        'None, because responsibility falls entirely on the company carrying out the dumping.' ] },
      correct:0,
      hint:{ es:'Fíjate en quién causa el daño y en qué se le pide a la autoridad cuando el daño viene de un tercero.',
             en:'Notice who causes the harm and what is asked of the authority when the harm comes from a third party.' },
      explanation:{ es:'Respetar es no dañar con actos propios, y aquí la autoridad no es la que contamina. Proteger es impedir que otras personas o empresas dañen un derecho: al conocer el caso y no actuar, la autoridad incumple justo esa obligación. Promover se refiere a informar y formar, y decir que no hay ninguna obligación deja a la comunidad sin defensa frente a un tercero.',
                    en:'Respecting means not causing harm through your own acts, and here the authority is not the polluter. Protecting means preventing other people or companies from harming a right: knowing about the case and not acting, the authority fails precisely that duty. Promoting refers to informing and educating, and saying there is no duty at all leaves the community defenceless against a third party.' } }
  ], rng), rng);

  /* ── CONCEPTO 5 ─────────────────────────────────────────────── */
  addSection(S('CONCEPTO 5','CONCEPT 5'),
    '<h2>' + S('De la exigencia a la acción','From the demand to the action') + '</h2>' +
    '<p>' + S('Exigir tiene procedimiento. Se nombra el derecho afectado, se escucha a quienes lo viven, se documenta con fechas y cifras, se presenta por escrito ante la autoridad que puede resolver y se da seguimiento hasta comprobar el resultado. Existen además vías formales: la queja ante un organismo público de derechos humanos, las solicitudes de información para saber en qué se gastó el presupuesto y los espacios de participación en la escuela y en la comunidad.',
              'Demanding has a procedure. You name the affected right, listen to those who live it, document with dates and figures, present it in writing before the authority that can resolve it, and follow up until the result is verified. There are also formal routes: the complaint before a public human rights body, information requests to learn how the budget was spent, and spaces for participation at school and in the community.') + '</p>' +
    '<p>' + S('El seguimiento es la parte que más se abandona y la que más decide. Una obra puede quedar construida y bloqueada, un programa puede quedar aprobado y sin dinero, un acuerdo puede quedar firmado y sin fecha. Volver a mirar convierte una promesa en un derecho ejercido.',
              'Follow up is the part most often abandoned and the one that decides the most. A work can end up built and blocked, a program can end up approved and unfunded, an agreement can end up signed with no date. Looking again is what turns a promise into a right exercised.') + '</p>' +
    '<div class="rules-grid">' +
      '<div class="rcard"><div class="rname">' + S('Queja','Complaint') + '</div><div class="rform">' + S('¿ante quién?','before whom?') + '</div><div class="rnote">' + S('El organismo público de derechos humanos.','The public human rights body.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Información','Information') + '</div><div class="rform">' + S('¿en qué se gastó?','what was it spent on?') + '</div><div class="rnote">' + S('Solicitudes que la autoridad debe responder.','Requests the authority has to answer.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Participación','Participation') + '</div><div class="rform">' + S('¿quién decide?','who decides?') + '</div><div class="rnote">' + S('Asambleas, comités, consejos escolares.','Assemblies, committees, school councils.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Seguimiento','Follow up') + '</div><div class="rform">' + S('¿se cumplió?','was it carried out?') + '</div><div class="rnote">' + S('Revisar con fechas y hacerlo público.','Check with dates and make it public.') + '</div></div>' +
    '</div>' +
    buildRuta(rng));
  rutRender();

  /* ── PROBLEMA 9 (numérico) ──────────────────────────────────── */
  var E9 = pick([1200, 1600, 2000], rng);
  var p9 = pick([60, 75], rng);
  var y9 = pick([4, 5], rng);
  var acc9 = E9 * p9 / 100;
  var falt9 = E9 - acc9;
  var n9 = falt9 / y9;
  addProblem({
    title:{ es:'Seguimiento a las paradas accesibles', en:'Following up on accessible bus stops' }, showWork:true,
    stmt:{ es:'Un comité vecinal da seguimiento a un compromiso de accesibilidad. En la ciudad hay ' + E9 + ' paradas de autobús y hoy el ' + p9 + ' por ciento ya está adaptado. El municipio adapta ' + n9 + ' paradas cada año y sostiene ese ritmo. ¿En cuántos años más quedarán adaptadas todas las paradas?',
           en:'A neighborhood committee follows up on an accessibility commitment. The city has ' + E9 + ' bus stops and today ' + p9 + ' per cent are already adapted. The town adapts ' + n9 + ' stops each year and keeps that pace. In how many more years will every stop be adapted?' },
    options:{ es: numOpts(y9, [y9 + 1, y9 + 2, y9 * 2]), en: numOpts(y9, [y9 + 1, y9 + 2, y9 * 2]) },
    correct:0,
    hint:{ es:'Obtén primero cuántas paradas ya están adaptadas, después cuántas faltan, y compara ese resultado con el ritmo anual.',
           en:'First get how many stops are already adapted, then how many are missing, and compare that result with the yearly pace.' },
    explanation:{ es:'Ya están adaptadas ' + E9 + ' × ' + p9 + ' ÷ 100 = ' + acc9 + ' paradas, así que faltan ' + E9 + ' − ' + acc9 + ' = ' + falt9 + '. Al ritmo de ' + n9 + ' por año, el tiempo restante es ' + falt9 + ' ÷ ' + n9 + ' = ' + y9,
                  en:'Already adapted are ' + E9 + ' × ' + p9 + ' ÷ 100 = ' + acc9 + ' stops, so the missing ones are ' + E9 + ' − ' + acc9 + ' = ' + falt9 + '. At a pace of ' + n9 + ' per year, the remaining time is ' + falt9 + ' ÷ ' + n9 + ' = ' + y9 }
  }, rng);

  /* ── PROBLEMA 10 ────────────────────────────────────────────── */
  addProblem(pick([
    { title:{ es:'La propuesta que se sostiene', en:'The proposal that holds up' }, showWork:false,
      stmt:{ es:'En una secundaria, tres estudiantes sordas no siguen nada de lo que se dice en las asambleas y por eso no participan en las decisiones del plantel. El comité estudiantil llevará una propuesta al consejo escolar. ¿Cuál conviene presentar?',
             en:'At a secondary school, three deaf students follow nothing of what is said in assemblies and therefore take no part in school decisions. The student committee will bring a proposal to the school council. Which one should it present?' },
      options:{ es:[
        'Interpretación en lengua de señas en todas las asambleas, con una partida anual, una persona responsable y una revisión cada periodo.',
        'Repartir después de cada asamblea un resumen escrito de los acuerdos para las tres estudiantes sordas.',
        'Pedir a sus compañeras de grupo que les vayan explicando durante la asamblea lo que se está diciendo.',
        'Organizar una campaña de carteles que invite al plantel a tomar en cuenta a las estudiantes sordas.' ],
        en:[
        'Sign language interpretation at every assembly, with an annual budget line, a person in charge and a review each term.',
        'Handing out after each assembly a written summary of the agreements for the three deaf students.',
        'Asking their classmates to explain to them during the assembly what is being said.',
        'Running a poster campaign inviting the school to take the deaf students into account.' ] },
      correct:0,
      hint:{ es:'Compara cada opción con cuatro criterios: si actúa sobre la causa, si permite participar en el momento, si evita depender de la buena voluntad y si puede continuar el próximo ciclo.',
             en:'Compare each option against four criteria: whether it acts on the cause, whether it allows taking part in the moment, whether it avoids depending on goodwill, and whether it can continue next year.' },
      explanation:{ es:'La barrera es de comunicación en tiempo real, y solo la interpretación la quita en el momento en que se decide; la partida y la persona responsable le dan continuidad. El resumen posterior informa pero llega cuando ya se votó, la explicación de las compañeras depende de la buena voluntad y no garantiza nada, y los carteles no cambian el acceso a la asamblea.',
                    en:'The barrier is real time communication, and only interpretation removes it at the moment decisions are made; the budget line and the person in charge give it continuity. The later summary informs but arrives after the vote, the explanation from classmates depends on goodwill and guarantees nothing, and posters do not change access to the assembly.' } },
    { title:{ es:'La propuesta que se sostiene', en:'The proposal that holds up' }, showWork:false,
      stmt:{ es:'En una colonia, las y los adolescentes son la mayoría de quienes usan la cancha, pero ninguna decisión sobre ella pasa por su opinión y el comité vecinal quiere corregirlo. ¿Cuál propuesta conviene presentar?',
             en:'In a neighborhood, teenagers are most of the people who use the sports court, yet no decision about it passes through their opinion, and the neighborhood committee wants to fix that. Which proposal should it present?' },
      options:{ es:[
        'Dos lugares con voz y voto para representantes adolescentes en el comité, con acta pública de cada acuerdo y renovación cada año.',
        'Un buzón de sugerencias en la entrada de la cancha que el comité revisará cuando le sea posible durante el año.',
        'Una reunión anual de convivencia con las y los adolescentes que usan la cancha, sin acuerdos por escrito.',
        'Un grupo de mensajería donde el comité informará las decisiones que ya haya tomado sobre la cancha.' ],
        en:[
        'Two seats with voice and vote for teenage representatives on the committee, with public minutes of every agreement and yearly renewal.',
        'A suggestion box at the court entrance that the committee will review whenever possible during the year.',
        'An annual social gathering with the teenagers who use the court, with no written agreements.',
        'A messaging group where the committee will announce the decisions it has already made about the court.' ] },
      correct:0,
      hint:{ es:'Revisa cuál opción da participación en el momento de decidir y deja constancia verificable de los acuerdos.',
             en:'Check which option gives participation at the moment of deciding and leaves a verifiable record of the agreements.' },
      explanation:{ es:'Participar significa estar cuando se decide, no enterarse después. Los lugares con voz y voto colocan a las y los adolescentes en la decisión, y el acta pública permite dar seguimiento. El buzón sin plazo, la reunión sin acuerdos y el grupo de mensajería informativo dejan la decisión intacta en las mismas manos.',
                    en:'Taking part means being there when the decision is made, not learning about it afterwards. Seats with voice and vote place teenagers inside the decision, and public minutes make follow up possible. The box with no deadline, the gathering with no agreements and the informational messaging group all leave the decision untouched in the same hands.' } }
  ], rng), rng);
}
</script>

<!-- LIAXA ANALYTICS -->
<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbzLGV15JRTPs9bbSvHRLfgOXeT9oUExDf1AH546WOwq5tYxXSdhX212OWi_bTJfMGx9/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'Defender los Derechos Humanos Hoy';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
</body>
</html>
