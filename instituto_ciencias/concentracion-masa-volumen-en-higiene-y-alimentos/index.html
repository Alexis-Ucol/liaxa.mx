<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Concentración en Porcentaje: Masa y Volumen</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; text-align: justify; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Concentración en Porcentaje: Masa y Volumen</div>
    <div class="wcourse" id="wcourse-el">Química · 3° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Concentración en Porcentaje: Masa y Volumen</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="sbtn" id="dlBtn" onclick="generatePDF()" style="max-width:280px;margin:0 auto;">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   CENTRALIZED SCHOOL CONFIG (Rule 16) — ships UNBRANDED (Rule 11).
   The ONLY rebranding point. build_all.py substitutes these exact fields
   (BRAND_FIELDS / RGB_FIELDS / logo*) downstream; :root/dark stay as fallback.
   Neutral defaults below == the static :root/dark values, so unbranded == no-op.
   ══════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:'#cc243c', primaryDark:'#480b14', primaryBg:'#f6e7e9',
  accent:'#fc0c24', accentBg:'#ffdbdf',
  darkPrimary:'#c74255', darkPrimaryDark:'#e87283', darkPrimaryBg:'#3b0b12',

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

  var _fname   = 'qui3_t04_g01_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf';

  function _openPdfInline(b){
    var u = URL.createObjectURL(b);
    var w = window.open(u, '_blank');
    if (!w) { window.location.href = u; }
    setTimeout(function(){ URL.revokeObjectURL(u); }, 60000);
  }

  var _isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
               (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  if (_isIOS) {
    var _pdfFile = new File([_pdfBlob], _fname, { type:'application/pdf' });
    if (navigator.canShare && navigator.canShare({ files:[_pdfFile] })) {
      navigator.share({ files:[_pdfFile], title:_fname })
        .then(_restorePdfBtn)
        .catch(function(e){
          if (e && e.name === 'AbortError') { _restorePdfBtn(); return; }
          _openPdfInline(_pdfBlob); _restorePdfBtn();
        });
      return;
    }
    _openPdfInline(_pdfBlob); _restorePdfBtn();
    return;
  }

  var _dlUrl = URL.createObjectURL(_pdfBlob);
  var _dlA   = document.createElement('a');
  _dlA.href  = _dlUrl; _dlA.download = _fname;
  document.body.appendChild(_dlA); _dlA.click();

function L(o){ return (o && o[LANG] !== undefined) ? o[LANG] : (o ? o.es : ''); }
function ri(rng, a, b){ return a + Math.floor(rng() * (b - a + 1)); }
function pk(rng, a){ return a[Math.floor(rng() * a.length)]; }
function r1(x){ return Math.round(x * 10) / 10; }
function fmt(x){ var v = r1(x); return (Math.round(v) === v) ? String(Math.round(v)) : String(v); }
function frac(n, d){
  return '<span class="mf-outer"><span class="mf-num">' + n + '</span><span class="mf-den">' + d + '</span></span>';
}

/* cuatro opciones numericas distintas, la correcta en la posicion 0 */
function opts4(rng, correct, cands, unit){
  var u = unit || '', c0 = r1(correct);
  var out = [c0], pool = shuffle(cands, rng), i, k = 1, c;
  for (i = 0; i < pool.length && out.length < 4; i++){
    c = r1(pool[i]);
    if (c > 0 && out.indexOf(c) === -1) out.push(c);
  }
  while (out.length < 4){
    c = r1(c0 + k);
    if (c > 0 && out.indexOf(c) === -1) out.push(c);
    k++;
  }
  return out.map(function(x){ return fmt(x) + u; });
}

function addProblem(rng, spec){
  var idx = problems.length;
  var correctVal = spec.options[spec.correct];
  var sh = shuffle(spec.options, rng);
  var prob = {
    title: spec.title,
    questionText: spec.q,
    fn: spec.fn || '',
    hint: spec.hint || '',
    explanation: spec.exp || '',
    options: sh,
    correctIdx: sh.indexOf(correctVal),
    showWork: !!spec.showWork,
    studentChoice: null,
    pendingChoice: null
  };
  problems.push(prob);
  buildOneCard(prob, idx);
}

/* ==========================================================================
   MANIPULATIVO 1 :: banco de preparación
   El vaso, la balanza y la etiqueta responden al instante mientras el alumno
   ajusta el soluto; la masa de la disolución se recalcula sola para que se vea
   que el denominador también crece.
   ========================================================================== */
function w1(rng, host){
  var R = shuffle(PREP, rng).slice(0, 3);
  var rd = 0, tries = 0, locked = false, done = false;
  var p = null, st = null, cur = 0, maxCur = 0, i;
  var pos = [];
  for (i = 0; i < 26; i++) pos.push([6 + Math.floor(rng() * 106), 6 + Math.floor(rng() * 96)]);

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Banco de preparación', en:'Preparation bench' }) + '</div>' +
    '<div class="gw-q" data-r="ttl"></div>' +
    '<div class="gw-mini">' + L({
      es:'Ajusta la cantidad del componente activo y observa cómo se mueven las tres lecturas al mismo tiempo. Detente cuando la etiqueta marque el porcentaje objetivo.',
      en:'Adjust the amount of the active component and watch how the three readings move at the same time. Stop when the label shows the target percentage.'
    }) + '</div>' +
    '<div class="pb-wrap">' +
      '<div class="pb-vessel" data-r="vsl"></div>' +
      '<div class="pb-side">' +
        '<div class="gw-lbl" data-r="ctl"></div>' +
        '<input class="gw-rng" type="range" min="0" max="10" step="1" value="0" data-r="rng">' +
        '<div class="pb-bar"><i data-r="bar" style="width:0%"></i><span class="pb-tick" data-r="tick" style="left:0%"></span></div>' +
        '<div class="pb-note" data-r="tgt"></div>' +
      '</div>' +
    '</div>' +
    '<div class="gw-read" data-r="read"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Comprobar', en:'Check' }) + '</button></div>' +
    '<div class="gw-fb"></div>';

  var elT = host.querySelector('[data-r="ttl"]'),
      elV = host.querySelector('[data-r="vsl"]'),
      elC = host.querySelector('[data-r="ctl"]'),
      elR = host.querySelector('[data-r="rng"]'),
      elBar = host.querySelector('[data-r="bar"]'),
      elTk = host.querySelector('[data-r="tick"]'),
      elG = host.querySelector('[data-r="tgt"]'),
      elD = host.querySelector('[data-r="read"]'),
      elB = host.querySelector('[data-r="chk"]');

  function pct(){ return cur / (cur + st.W) * 100; }
  function maxPct(){ return maxCur / (maxCur + st.W) * 100; }

  function roundData(){
    st = pk(rng, p.sets);
    maxCur = st.s * 2;
    var f = pk(rng, [0.3, 0.45, 0.6, 1.5, 1.7]);
    cur = Math.max(0, Math.min(maxCur, Math.round(st.s * f)));
    if (cur === st.s) cur = Math.max(0, st.s - 3);
    tries = 0; locked = false;
    elR.min = '0'; elR.max = String(maxCur); elR.step = '1'; elR.value = String(cur);
  }

  function draw(){
    var pc = r1(pct()), tot = cur + st.W;
    var nd = Math.round(26 * cur / maxCur);
    var h = 96 + Math.round(26 * cur / maxCur);
    var dots = '';
    for (var k = 0; k < nd; k++){
      dots += '<div class="pb-dot" style="left:' + pos[k][0] + 'px;bottom:' + Math.min(h - 10, pos[k][1]) + 'px"></div>';
    }
    elV.innerHTML = '<div class="pb-liq" style="height:' + h + 'px"></div>' + dots;
    elT.innerHTML = L(p) + '  ·  ' + L({ es:'objetivo ', en:'target ' }) + st.p + ' %';
    elC.innerHTML = L({ es:'Cantidad de ', en:'Amount of ' }) + L(p.comp) + ': <span class="gw-val">' + cur + ' ' + p.unit + '</span>  ·  ' +
      L({ es:'fijo de ', en:'fixed ' }) + L(p.solv) + ': <span class="gw-val">' + st.W + ' ' + p.unit + '</span>';
    elBar.style.width = Math.min(100, pc / maxPct() * 100) + '%';
    elTk.style.left = Math.min(100, st.p / maxPct() * 100) + '%';
    elG.innerHTML = L({ es:'La marca dorada señala el porcentaje que pide la receta.', en:'The gold mark shows the percentage the recipe asks for.' });
    elD.innerHTML =
      '<div class="gw-rd"><div class="k">' + L({ es:'Soluto', en:'Solute' }) + '</div><div class="v">' + cur + '</div></div>' +
      '<div class="gw-rd"><div class="k">' + L({ es:'Disolución', en:'Solution' }) + '</div><div class="v">' + tot + '</div></div>' +
      '<div class="gw-rd"><div class="k">' + L({ es:'Etiqueta', en:'Label' }) + '</div><div class="v">' + fmt(pc) + ' %</div></div>';
    elR.disabled = locked || done;
  }

  function advance(){
    rd++;
    if (rd >= 3){
      done = true;
      elB.textContent = L({ es:'Completado', en:'Completed' });
      elB.className = 'gw-btn solved';
      draw();
      say(host, 'good', L({
        es:'Tres preparaciones listas. Cada vez que agregaste soluto, la masa de la disolución creció con él: por eso el porcentaje sube más despacio de lo que uno esperaría.',
        en:'Three preparations ready. Every time you added solute, the mass of the solution grew with it: that is why the percentage rises more slowly than one would expect.'
      }));
      return;
    }
    p = R[rd];
    roundData();
    elB.textContent = L({ es:'Comprobar', en:'Check' });
    elB.className = 'gw-btn';
    draw();
    say(host, '', L({ es:'Otra receta en el banco. Ajusta su etiqueta.', en:'Another recipe on the bench. Adjust its label.' }));
  }

  function close(cls, txt){
    locked = true;
    elB.textContent = rd === 2 ? L({ es:'Terminar', en:'Finish' }) : L({ es:'Siguiente receta', en:'Next recipe' });
    elB.className = 'gw-btn solved';
    draw();
    say(host, cls, txt);
  }

  function check(){
    if (done) return;
    if (locked){ advance(); return; }
    var d = pct() - st.p;
    if (Math.abs(d) <= 0.2){
      close('good', L({
        es:'Coincide. Con ' + cur + ' ' + p.unit + ' de ' + L(p.comp) + ' la disolución pesa ' + (cur + st.W) + ' ' + p.unit + ', y ' + cur + ' ÷ ' + (cur + st.W) + ' × 100 = ' + st.p + ' %.',
        en:'It matches. With ' + cur + ' ' + p.unit + ' of ' + L(p.comp) + ' the solution weighs ' + (cur + st.W) + ' ' + p.unit + ', and ' + cur + ' ÷ ' + (cur + st.W) + ' × 100 = ' + st.p + ' %.'
      }));
      return;
    }
    tries++;
    if (tries >= 3){
      cur = st.s;
      elR.value = String(cur);
      close('warm', L({
        es:'La cantidad exacta es ' + st.s + ' ' + p.unit + ': con ella la disolución llega a ' + (st.s + st.W) + ' ' + p.unit + ' y la etiqueta marca ' + st.p + ' %.',
        en:'The exact amount is ' + st.s + ' ' + p.unit + ': with it the solution reaches ' + (st.s + st.W) + ' ' + p.unit + ' and the label shows ' + st.p + ' %.'
      }));
      return;
    }
    say(host, 'miss', d > 0
      ? L({ es:'La etiqueta va ' + fmt(r1(d)) + ' puntos arriba del objetivo: retira ' + L(p.comp) + '.',
            en:'The label is ' + fmt(r1(d)) + ' points above the target: take out some ' + L(p.comp) + '.' })
      : L({ es:'Faltan ' + fmt(r1(-d)) + ' puntos para el objetivo: agrega ' + L(p.comp) + '.',
            en:'You are ' + fmt(r1(-d)) + ' points short of the target: add more ' + L(p.comp) + '.' }));
  }

  elR.addEventListener('input', function(){
    if (locked || done) return;
    cur = parseInt(elR.value, 10);
    draw();
    var d = pct() - st.p;
    if (Math.abs(d) <= 0.2){
      say(host, 'warm', L({ es:'La etiqueta ya marca el objetivo. Comprueba para confirmarlo.', en:'The label already shows the target. Check to confirm it.' }));
    } else if (d > 0){
      say(host, '', L({ es:'Vas ' + fmt(r1(d)) + ' puntos de más. Fíjate en que la disolución también pesa más.',
                        en:'You are ' + fmt(r1(d)) + ' points over. Notice that the solution also weighs more.' }));
    } else {
      say(host, '', L({ es:'Vas ' + fmt(r1(-d)) + ' puntos de menos. Fíjate en que la disolución también pesa menos.',
                        en:'You are ' + fmt(r1(-d)) + ' points under. Notice that the solution also weighs less.' }));
    }
  });
  elB.addEventListener('click', check);
  p = R[0];
  roundData();
  draw();
  say(host, '', L({ es:'Mueve el control y observa las tres lecturas al mismo tiempo.', en:'Move the control and watch the three readings at the same time.' }));
}

/* ==========================================================================
   MANIPULATIVO 2 :: arma la fracción
   El alumno coloca cada dato en su lugar dentro de la fracción y ve al momento
   qué porcentaje produce esa elección.
   ========================================================================== */
function w2(rng, host){
  var R = shuffle(FRACC, rng).slice(0, 3);
  var rd = 0, tries = 0, locked = false, done = false;
  var c = null, tiles = [], nSlot = null, dSlot = null;

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Arma la fracción', en:'Build the fraction' }) + '</div>' +
    '<div class="gw-q" data-r="ttl"></div>' +
    '<div class="fx-case" data-r="cas"></div>' +
    '<div class="gw-mini" style="margin-top:.6rem">' + L({
      es:'Toca un número para colocarlo en el hueco de arriba y luego otro para el de abajo. Toca un hueco lleno para vaciarlo y volver a intentarlo.',
      en:'Tap a number to place it in the top gap and then another one for the bottom gap. Tap a filled gap to empty it and try again.'
    }) + '</div>' +
    '<div class="fx-stage">' +
      '<div class="fx-slots">' +
        '<div class="fx-cap">' + L({ es:'arriba', en:'top' }) + '</div>' +
        '<div class="fx-slot" data-r="sn"></div>' +
        '<div class="fx-rule"></div>' +
        '<div class="fx-slot" data-r="sd"></div>' +
        '<div class="fx-cap">' + L({ es:'abajo', en:'bottom' }) + '</div>' +
      '</div>' +
      '<div class="fx-eq" data-r="eq"></div>' +
    '</div>' +
    '<div class="gw-lbl">' + L({ es:'Datos disponibles', en:'Available data' }) + '</div>' +
    '<div class="gw-grid" data-r="pool"></div>' +
    '<div class="fx-read" data-r="read"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Comprobar', en:'Check' }) + '</button></div>' +
    '<div class="gw-fb"></div>';

  var elT = host.querySelector('[data-r="ttl"]'),
      elC = host.querySelector('[data-r="cas"]'),
      elN = host.querySelector('[data-r="sn"]'),
      elDn = host.querySelector('[data-r="sd"]'),
      elE = host.querySelector('[data-r="eq"]'),
      elP = host.querySelector('[data-r="pool"]'),
      elRd = host.querySelector('[data-r="read"]'),
      elB = host.querySelector('[data-r="chk"]');

  function roundData(){
    tiles = shuffle(c.pool, rng);
    nSlot = null; dSlot = null; tries = 0; locked = false;
  }

  function draw(){
    elT.innerHTML = L({ es:'Buscamos el ', en:'We are after the ' }) + L(c.goal);
    elC.innerHTML = L(c.case);
    elN.textContent = nSlot === null ? '?' : String(nSlot);
    elDn.textContent = dSlot === null ? '?' : String(dSlot);
    elN.className = 'fx-slot' + (nSlot === null ? '' : ' full');
    elDn.className = 'fx-slot' + (dSlot === null ? '' : ' full');
    elE.innerHTML = (nSlot !== null && dSlot !== null)
      ? '× 100 = <span class="gw-val">' + fmt(r1(nSlot / dSlot * 100)) + ' %</span>'
      : '× 100 = ?';
    elP.innerHTML = tiles.map(function(v){
      var used = (v === nSlot || v === dSlot);
      return '<button class="gw-tile' + (used ? ' on' : '') + '" data-v="' + v + '"' + ((locked || done) ? ' disabled' : '') + '>' + v + '</button>';
    }).join('');
    elP.querySelectorAll('.gw-tile').forEach(function(b){
      b.addEventListener('click', function(){ place(parseInt(b.dataset.v, 10)); });
    });
    if (nSlot !== null && dSlot !== null){
      elRd.innerHTML = L({ es:'Así se lee: ', en:'This reads as: ' }) + '<strong>' + nSlot + '</strong>' +
        L({ es:' por cada ', en:' out of every ' }) + '<strong>' + dSlot + '</strong>' +
        L({ es:', o sea ', en:', that is ' }) + '<strong>' + fmt(r1(nSlot / dSlot * 100)) + ' ' +
        L({ es:'por cada 100', en:'per 100' }) + '</strong>.';
    } else {
      elRd.innerHTML = L({ es:'Llena los dos huecos para ver el porcentaje que produce tu elección.',
                           en:'Fill both gaps to see the percentage your choice produces.' });
    }
  }

  function place(v){
    if (locked || done) return;
    if (v === nSlot){ nSlot = null; draw(); return; }
    if (v === dSlot){ dSlot = null; draw(); return; }
    if (nSlot === null) nSlot = v;
    else if (dSlot === null) dSlot = v;
    else { dSlot = v; }
    draw();
    if (nSlot !== null && dSlot !== null) live();
  }

  function live(){
    var val = r1(nSlot / dSlot * 100);
    if (nSlot === c.num && dSlot === c.den){
      say(host, 'warm', L({ es:'Esa fracción ya compara el componente con el producto completo. Comprueba para confirmarlo.',
                            en:'That fraction already compares the component with the whole product. Check to confirm it.' }));
    } else if (nSlot === c.den && dSlot === c.num){
      say(host, 'miss', L({ es:'Los papeles están invertidos: arriba va la cantidad del componente y abajo el producto completo.',
                            en:'The roles are swapped: the amount of the component goes on top and the whole product at the bottom.' }));
    } else if (dSlot === 100){
      say(host, 'miss', L({ es:'El 100 no es una medida del envase: aparece al final, al multiplicar, para expresar la proporción por cada 100.',
                            en:'The 100 is not a measurement of the container: it appears at the end, when multiplying, to state the proportion per 100.' }));
    } else {
      say(host, 'miss', L({ es:'Con esa combinación el resultado sería ' + fmt(val) + ' %. Revisa cuál de los dos datos representa el producto terminado.',
                            en:'With that combination the result would be ' + fmt(val) + ' %. Check which of the two figures stands for the finished product.' }));
    }
  }

  function advance(){
    rd++;
    if (rd >= 3){
      done = true;
      elB.textContent = L({ es:'Completado', en:'Completed' });
      elB.className = 'gw-btn solved';
      draw();
      say(host, 'good', L({
        es:'Tres fracciones armadas. Arriba siempre va la cantidad del componente y abajo la del producto terminado, sin importar si se mide en gramos o en mililitros.',
        en:'Three fractions built. The amount of the component always goes on top and the finished product at the bottom, no matter whether it is measured in grams or in millilitres.'
      }));
      return;
    }
    c = R[rd];
    roundData();
    elB.textContent = L({ es:'Comprobar', en:'Check' });
    elB.className = 'gw-btn';
    draw();
    say(host, '', L({ es:'Otro caso en la mesa.', en:'Another case on the table.' }));
  }

  function close(cls, txt){
    locked = true;
    elB.textContent = rd === 2 ? L({ es:'Terminar', en:'Finish' }) : L({ es:'Siguiente caso', en:'Next case' });
    elB.className = 'gw-btn solved';
    draw();
    say(host, cls, txt);
  }

  elB.addEventListener('click', function(){
    if (done) return;
    if (locked){ advance(); return; }
    if (nSlot === null || dSlot === null){
      say(host, 'miss', L({ es:'Faltan datos por colocar en la fracción.', en:'There is still data to place in the fraction.' }));
      return;
    }
    if (nSlot === c.num && dSlot === c.den){
      close('good', L({
        es:'Correcto. Arriba va ' + L(c.numName) + ' y abajo ' + L(c.denName) + ', así que el resultado es ' + c.pct + ' %.',
        en:'Correct. On top goes ' + L(c.numName) + ' and at the bottom ' + L(c.denName) + ', so the result is ' + c.pct + ' %.'
      }));
      return;
    }
    tries++;
    if (tries >= 3){
      nSlot = c.num; dSlot = c.den;
      close('warm', L({
        es:'La fracción correcta es ' + frac(c.num, c.den) + ' y da ' + c.pct + ' %. Recuerda que ' + L(c.trap) + '.',
        en:'The correct fraction is ' + frac(c.num, c.den) + ' and it gives ' + c.pct + ' %. Remember that ' + L(c.trap) + '.'
      }));
      return;
    }
    live();
  });

  c = R[0];
  roundData();
  draw();
  say(host, '', L({ es:'Coloca los datos y observa qué porcentaje produce cada acomodo.',
                    en:'Place the data and watch which percentage each arrangement produces.' }));
}

/* ==========================================================================
   MANIPULATIVO 3 :: escalador de envase
   El porcentaje queda fijo y el envase cambia: el alumno ve que la proporción
   no se mueve mientras la cantidad de componente sí.
   ========================================================================== */
function w3(rng, host){
  var R = shuffle(ESCAL, rng).slice(0, 3);
  var rd = 0, tries = 0, locked = false, done = false;
  var p = null, st = null, V = 0, maxV = 0;

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Escalador de envase', en:'Container scaler' }) + '</div>' +
    '<div class="gw-q" data-r="ttl"></div>' +
    '<div class="gw-mini">' + L({
      es:'La etiqueta no cambia: lo único que se mueve es el tamaño del envase. Encuentra el envase que entrega justo la cantidad pedida del componente activo.',
      en:'The label does not change: the only thing that moves is the container size. Find the container that delivers exactly the requested amount of the active component.'
    }) + '</div>' +
    '<div class="sc-shelf">' +
      '<div><div class="sc-bot" data-r="bot"><div class="sc-fill"></div><div class="sc-act" data-r="act"></div></div>' +
      '<div class="sc-cap" data-r="cap"></div></div>' +
      '<div class="sc-side">' +
        '<div class="gw-lbl" data-r="ctl"></div>' +
        '<input class="gw-rng" type="range" min="0" max="100" step="10" value="0" data-r="rng">' +
        '<div class="pb-note" data-r="tgt"></div>' +
      '</div>' +
    '</div>' +
    '<div class="gw-read" data-r="read"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Comprobar', en:'Check' }) + '</button></div>' +
    '<div class="gw-fb"></div>';

  var elT = host.querySelector('[data-r="ttl"]'),
      elBo = host.querySelector('[data-r="bot"]'),
      elA = host.querySelector('[data-r="act"]'),
      elCp = host.querySelector('[data-r="cap"]'),
      elC = host.querySelector('[data-r="ctl"]'),
      elR = host.querySelector('[data-r="rng"]'),
      elG = host.querySelector('[data-r="tgt"]'),
      elD = host.querySelector('[data-r="read"]'),
      elB = host.querySelector('[data-r="chk"]');

  function unitA(){ return p.mode === 'mv' ? 'g' : 'mL'; }
  function modeName(){
    return p.mode === 'mv'
      ? L({ es:'porcentaje masa sobre volumen', en:'percentage mass over volume' })
      : L({ es:'porcentaje en volumen', en:'percentage by volume' });
  }
  function act(){ return V * st.p / 100; }

  function roundData(){
    st = pk(rng, p.sets);
    maxV = st.V * 2;
    var f = pk(rng, [0.4, 0.6, 1.4, 1.6]);
    V = Math.round(st.V * f / 10) * 10;
    if (V === st.V) V = Math.max(0, st.V - 20);
    tries = 0; locked = false;
    elR.min = '0'; elR.max = String(maxV); elR.step = '10'; elR.value = String(V);
  }

  function draw(){
    var a = act();
    var h = 36 + Math.round(114 * V / maxV);
    elBo.style.height = h + 'px';
    elA.style.height = Math.round(h * st.p / 100) + 'px';
    elCp.innerHTML = V + ' mL';
    elT.innerHTML = L(p) + '  ·  ' + L({ es:'etiqueta fija de ', en:'fixed label of ' }) + st.p + ' % ' +
      L({ es:'de ', en:'of ' }) + L(p.comp);
    elC.innerHTML = L({ es:'Tamaño del envase: ', en:'Container size: ' }) + '<span class="gw-val">' + V + ' mL</span>';
    elG.innerHTML = L({ es:'Se necesitan exactamente ', en:'Exactly ' }) + '<strong>' + st.a + ' ' + unitA() + '</strong>' +
      L({ es:' de ' + L(p.comp) + '.', en:' of ' + L(p.comp) + ' are needed.' });
    elD.innerHTML =
      '<div class="gw-rd"><div class="k">' + L({ es:'Envase', en:'Container' }) + '</div><div class="v">' + V + '</div></div>' +
      '<div class="gw-rd"><div class="k">' + modeName() + '</div><div class="v">' + st.p + ' %</div></div>' +
      '<div class="gw-rd"><div class="k">' + L({ es:'Componente', en:'Component' }) + '</div><div class="v">' + fmt(r1(a)) + ' ' + unitA() + '</div></div>';
    elR.disabled = locked || done;
  }

  function advance(){
    rd++;
    if (rd >= 3){
      done = true;
      elB.textContent = L({ es:'Completado', en:'Completed' });
      elB.className = 'gw-btn solved';
      draw();
      say(host, 'good', L({
        es:'Tres envases resueltos. La concentración se quedó quieta todo el tiempo y aun así la cantidad de componente cambió: por eso la etiqueta y el tamaño del envase se leen juntos.',
        en:'Three containers solved. The concentration stayed still the whole time and the amount of component still changed: that is why the label and the container size are read together.'
      }));
      return;
    }
    p = R[rd];
    roundData();
    elB.textContent = L({ es:'Comprobar', en:'Check' });
    elB.className = 'gw-btn';
    draw();
    say(host, '', L({ es:'Otro producto en el estante.', en:'Another product on the shelf.' }));
  }

  function close(cls, txt){
    locked = true;
    elB.textContent = rd === 2 ? L({ es:'Terminar', en:'Finish' }) : L({ es:'Siguiente producto', en:'Next product' });
    elB.className = 'gw-btn solved';
    draw();
    say(host, cls, txt);
  }

  function check(){
    if (done) return;
    if (locked){ advance(); return; }
    var d = act() - st.a;
    if (Math.abs(d) < 0.05){
      close('good', L({
        es:'Ese es el envase. Con ' + st.V + ' mL al ' + st.p + ' % se obtienen ' + st.a + ' ' + unitA() + ' de ' + L(p.comp) + '.',
        en:'That is the container. With ' + st.V + ' mL at ' + st.p + ' % you get ' + st.a + ' ' + unitA() + ' of ' + L(p.comp) + '.'
      }));
      return;
    }
    tries++;
    if (tries >= 3){
      V = st.V;
      elR.value = String(V);
      close('warm', L({
        es:'El envase que entrega ' + st.a + ' ' + unitA() + ' es el de ' + st.V + ' mL, porque el ' + st.p + ' % de ese volumen da justo esa cantidad.',
        en:'The container that delivers ' + st.a + ' ' + unitA() + ' is the ' + st.V + ' mL one, because ' + st.p + ' % of that volume gives exactly that amount.'
      }));
      return;
    }
    say(host, 'miss', d > 0
      ? L({ es:'Este envase entrega ' + fmt(r1(d)) + ' ' + unitA() + ' de más. Busca uno más pequeño: la etiqueta no se mueve.',
            en:'This container delivers ' + fmt(r1(d)) + ' ' + unitA() + ' too much. Look for a smaller one: the label does not move.' })
      : L({ es:'Este envase se queda ' + fmt(r1(-d)) + ' ' + unitA() + ' corto. Busca uno más grande: la etiqueta no se mueve.',
            en:'This container falls ' + fmt(r1(-d)) + ' ' + unitA() + ' short. Look for a bigger one: the label does not move.' }));
  }

  elR.addEventListener('input', function(){
    if (locked || done) return;
    V = parseInt(elR.value, 10);
    draw();
    var d = act() - st.a;
    if (Math.abs(d) < 0.05){
      say(host, 'warm', L({ es:'Este envase entrega justo lo pedido. Comprueba para confirmarlo.',
                            en:'This container delivers exactly what was asked for. Check to confirm it.' }));
    } else if (d > 0){
      say(host, '', L({ es:'Van ' + fmt(r1(d)) + ' ' + unitA() + ' de más y el porcentaje sigue en ' + st.p + ' %.',
                        en:'That is ' + fmt(r1(d)) + ' ' + unitA() + ' too much and the percentage is still ' + st.p + ' %.' }));
    } else {
      say(host, '', L({ es:'Faltan ' + fmt(r1(-d)) + ' ' + unitA() + ' y el porcentaje sigue en ' + st.p + ' %.',
                        en:'That is ' + fmt(r1(-d)) + ' ' + unitA() + ' short and the percentage is still ' + st.p + ' %.' }));
    }
  });
  elB.addEventListener('click', check);
  p = R[0];
  roundData();
  draw();
  say(host, '', L({ es:'Mueve el control del envase y observa qué se mueve y qué no.',
                    en:'Move the container control and watch what moves and what does not.' }));
}

/* ==========================================================================
   MANIPULATIVO 4 :: mesa de decisión
   Un requisito de uso y varias etiquetas: el alumno selecciona las que cumplen
   y recibe la distancia en puntos de porcentaje de cada elección.
   ========================================================================== */
function w4(rng, host){
  var R = shuffle(CRIT, rng).slice(0, 3);
  var rd = 0, tries = 0, locked = false, done = false;
  var c = null, items = [], sel = [];

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Mesa de decisión', en:'Decision table' }) + '</div>' +
    '<div class="gw-q" data-r="ttl"></div>' +
    '<div class="dm-need" data-r="need"></div>' +
    '<div class="gw-mini" style="margin-top:.6rem">' + L({
      es:'Toca las etiquetas que cumplen el requisito. Puedes elegir más de una y quitar cualquiera tocándola otra vez.',
      en:'Tap the labels that meet the requirement. You may choose more than one and remove any of them by tapping again.'
    }) + '</div>' +
    '<div class="gw-grid wide" data-r="pool"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Comprobar', en:'Check' }) + '</button></div>' +
    '<div class="gw-fb"></div>';

  var elT = host.querySelector('[data-r="ttl"]'),
      elN = host.querySelector('[data-r="need"]'),
      elP = host.querySelector('[data-r="pool"]'),
      elB = host.querySelector('[data-r="chk"]');

  function okItem(it){ return it.v >= c.min && it.v <= c.max; }
  function gap(it){
    if (it.v < c.min) return L({ es:'le faltan ' + fmt(r1(c.min - it.v)) + ' puntos', en:'it is ' + fmt(r1(c.min - it.v)) + ' points short' });
    if (it.v > c.max) return L({ es:'se pasa por ' + fmt(r1(it.v - c.max)) + ' puntos', en:'it goes over by ' + fmt(r1(it.v - c.max)) + ' points' });
    return L({ es:'está dentro del intervalo', en:'it is inside the range' });
  }

  function roundData(){
    items = shuffle(c.items, rng);
    sel = []; tries = 0; locked = false;
  }

  function draw(){
    elT.innerHTML = L(c.name);
    elN.innerHTML = L(c.rule);
    elP.innerHTML = items.map(function(it, k){
      var on = sel.indexOf(k) !== -1;
      var reveal = locked && okItem(it);
      return '<button class="gw-tile' + (on ? ' on' : '') + (reveal && !on ? ' hit' : '') + '" data-k="' + k + '"' +
        ((locked || done) ? ' disabled' : '') + '>' + L(it.n) +
        '<small>' + fmt(it.v) + ' % ' + L(c.prop) + '</small></button>';
    }).join('');
    elP.querySelectorAll('.gw-tile').forEach(function(b){
      b.addEventListener('click', function(){ toggle(parseInt(b.dataset.k, 10)); });
    });
  }

  function toggle(k){
    if (locked || done) return;
    var i = sel.indexOf(k);
    if (i === -1) sel.push(k); else sel.splice(i, 1);
    draw();
    var it = items[k];
    if (i === -1){
      say(host, okItem(it) ? 'warm' : 'miss',
        L(it.n) + L({ es:' declara ', en:' declares ' }) + fmt(it.v) + ' %: ' + gap(it) + '.');
    } else {
      say(host, '', L({ es:'Quitaste ', en:'You removed ' }) + L(it.n) + L({ es:' de la selección.', en:' from the selection.' }));
    }
  }

  function advance(){
    rd++;
    if (rd >= 3){
      done = true;
      elB.textContent = L({ es:'Completado', en:'Completed' });
      elB.className = 'gw-btn solved';
      draw();
      say(host, 'good', L({
        es:'Tres decisiones tomadas. En cada caso el criterio no fue el precio ni el tamaño del envase, sino el número que la etiqueta declara.',
        en:'Three decisions made. In every case the criterion was not the price nor the container size, but the number the label declares.'
      }));
      return;
    }
    c = R[rd];
    roundData();
    elB.textContent = L({ es:'Comprobar', en:'Check' });
    elB.className = 'gw-btn';
    draw();
    say(host, '', L({ es:'Otro requisito sobre la mesa.', en:'Another requirement on the table.' }));
  }

  function close(cls, txt){
    locked = true;
    elB.textContent = rd === 2 ? L({ es:'Terminar', en:'Finish' }) : L({ es:'Siguiente requisito', en:'Next requirement' });
    elB.className = 'gw-btn solved';
    draw();
    say(host, cls, txt);
  }

  elB.addEventListener('click', function(){
    if (done) return;
    if (locked){ advance(); return; }
    var wrong = null, missing = null, k;
    for (k = 0; k < items.length; k++){
      if (sel.indexOf(k) !== -1 && !okItem(items[k])) wrong = items[k];
      if (sel.indexOf(k) === -1 && okItem(items[k])) missing = items[k];
    }
    if (!wrong && !missing){
      var names = items.filter(okItem).map(function(it){ return L(it.n) + ' (' + fmt(it.v) + ' %)'; }).join(', ');
      close('good', L({ es:'Selección exacta: ' + names + '. Esas etiquetas caen dentro de lo que pide el uso.',
                        en:'Exact selection: ' + names + '. Those labels fall inside what the use requires.' }));
      return;
    }
    tries++;
    if (tries >= 3){
      sel = [];
      for (k = 0; k < items.length; k++) if (okItem(items[k])) sel.push(k);
      var nm = items.filter(okItem).map(function(it){ return L(it.n) + ' (' + fmt(it.v) + ' %)'; }).join(', ');
      close('warm', L({ es:'Las etiquetas que cumplen son ' + nm + '. Las demás quedan fuera del intervalo que el uso exige.',
                        en:'The labels that comply are ' + nm + '. The rest fall outside the range the use demands.' }));
      return;
    }
    if (wrong){
      say(host, 'miss', L({ es:'Revisa ' + L(wrong.n) + ': declara ' + fmt(wrong.v) + ' % y ' + gap(wrong) + '.',
                            en:'Check ' + L(wrong.n) + ': it declares ' + fmt(wrong.v) + ' % and ' + gap(wrong) + '.' }));
    } else {
      say(host, 'miss', L({ es:'Falta una etiqueta que sí cumple el requisito. Vuelve a leer los números de las que dejaste fuera.',
                            en:'A label that does meet the requirement is missing. Read again the numbers of the ones you left out.' }));
    }
  });

  c = R[0];
  roundData();
  draw();
  say(host, '', L({ es:'Lee el requisito y toca las etiquetas que lo cumplen.',
                    en:'Read the requirement and tap the labels that meet it.' }));
}

/* ==========================================================================
   LECCIÓN :: concepto, manipulativo y problemas, siempre alternados (Rule 1)

function buildLesson(rng){

      chip(L({ es:'vinagres y conservas', en:'vinegars and preserves' })) +

    '<p>' + L({
      es:'En una disolución, el soluto es el componente que se reparte y el disolvente el que lo recibe. Lo que queda al final, soluto y disolvente juntos, es la disolución, y su masa es la suma de las dos.',
      en:'In a solution, the solute is the component that spreads out and the solvent the one that receives it. What is left at the end, solute and solvent together, is the solution, and its mass is the sum of the two.'

    '<p>' + L({
      es:'El porcentaje en masa compara la masa del soluto con la masa de la disolución completa y se expresa como gramos de soluto en cada 100 g de producto. El error más frecuente es comparar contra el disolvente: quien divide entre el agua obtiene siempre un número mayor que el que la etiqueta declara, porque olvida que el soluto también pesa dentro del frasco.',
      en:'Percentage by mass compares the mass of the solute with the mass of the whole solution and is stated as grams of solute in every 100 g of product. The most frequent mistake is comparing against the solvent: whoever divides by the water always gets a number larger than the one the label declares, because they forget that the solute also weighs inside the bottle.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Soluto', en:'Solute' }), L({ es:'se reparte', en:'spreads out' }), L({ es:'es el componente que se declara', en:'it is the component that gets declared' })) +
      rcard(L({ es:'Disolvente', en:'Solvent' }), L({ es:'recibe al soluto', en:'receives the solute' }), L({ es:'suele ser el más abundante', en:'usually the more abundant one' })) +
      rcard(L({ es:'Disolución', en:'Solution' }), L({ es:'soluto + disolvente', en:'solute + solvent' }), L({ es:'es la referencia del porcentaje', en:'it is the reference of the percentage' })) +
      rcard(L({ es:'Porcentaje en masa', en:'Percentage by mass' }), L({ es:'g en cada 100 g', en:'g in every 100 g' }), L({ es:'alimentos, cremas, polvos', en:'foods, creams, powders' })) +
    '</div>' +
    '<div class="callout"><p>' + L({
      es:'Al agregar más soluto no solo crece la parte de arriba de la comparación: la masa de la disolución crece con ella. Por eso duplicar el soluto nunca duplica exactamente el porcentaje.',
      en:'Adding more solute does not only make the top part of the comparison grow: the mass of the solution grows with it. That is why doubling the solute never exactly doubles the percentage.'
    }) + '</p></div>'
  );
  w1(rng, widgetHost(s1, 'w_banco'));
  addProblem(rng, mkP1(rng));
  addProblem(rng, mkP2(rng));

  /* CONCEPTO 2 ────────────────────────────────────────────────────────── */
  var s2 = sec(
    L({ es:'Concepto 2', en:'Concept 2' }),
    L({ es:'Tres formas de decir la proporción', en:'Three ways of stating the proportion' }),
    '<p>' + L({
      es:'No todos los productos se manejan con la misma magnitud. Un polvo se pesa, un gel se vierte y un jarabe se dosifica con cuchara, así que la etiqueta usa la medida con la que realmente se trabaja el producto.',
      en:'Not all products are handled with the same magnitude. A powder is weighed, a gel is poured and a syrup is dosed with a spoon, so the label uses the measurement with which the product is really handled.'

    '<p>' + L({
      es:'El porcentaje en volumen compara mililitros de componente con mililitros de producto completo, y el porcentaje masa sobre volumen compara gramos de componente con mililitros de disolución. Cambian las unidades, pero la estructura no: arriba la parte, abajo el producto terminado, y al final la comparación se lleva a una base de 100.',

    '<div class="rules-grid">' +

  );
  w2(rng, widgetHost(s2, 'w_fraccion'));
  addProblem(rng, mkP3(rng));
  addProblem(rng, mkP4(rng));

  /* CONCEPTO 3 ────────────────────────────────────────────────────────── */
  var s3 = sec(
    L({ es:'Concepto 3', en:'Concept 3' }),
    L({ es:'La misma etiqueta en envases distintos', en:'The same label in different containers' }),
    '<p>' + L({
      es:'La concentración es una proporción, así que no depende de cuánto producto haya. Dos frascos del mismo gel al 70 %, uno de 60 mL y otro de 500 mL, están igual de concentrados; lo que cambia es cuántos mililitros de alcohol contiene cada uno.',

    '<p>' + L({
      es:'De ahí salen dos preguntas distintas que conviene no mezclar. Cuánto componente recibo depende del porcentaje y del tamaño del envase a la vez. Qué tan intenso es el efecto sobre una superficie o sobre la piel depende solo del porcentaje. Y cuando se agrega disolvente a una disolución, el soluto no desaparece: se reparte en una disolución mayor, así que el porcentaje baja.',
      en:'Two different questions come out of this and it is worth not mixing them. How much component I receive depends on the percentage and the container size at the same time. How intense the effect is on a surface or on the skin depends only on the percentage. And when solvent is added to a solution, the solute does not disappear: it spreads through a larger solution, so the percentage goes down.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Concentración', en:'Concentration' }), L({ es:'proporción', en:'proportion' }), L({ es:'no cambia con el tamaño del envase', en:'does not change with container size' })) +

/* opciones de veredicto: el juicio de cada opción se deduce de su propio número,
   así que la única diferencia real entre ellas es el porcentaje calculado. */
function verdictOpts(pc, alts, yes, no, okFn){
  var out = [ L(okFn(r1(pc)) ? yes : no) + fmt(pc) + ' %' ];
  var seen = [r1(pc)], i, v, k = 1;
  for (i = 0; i < alts.length && out.length < 4; i++){
    v = r1(alts[i]);
    if (v <= 0 || seen.indexOf(v) !== -1) continue;
    seen.push(v);
    out.push(L(okFn(v) ? yes : no) + fmt(v) + ' %');
  }
  while (out.length < 4){
    v = r1(pc + k);
    if (v > 0 && seen.indexOf(v) === -1){ seen.push(v); out.push(L(okFn(v) ? yes : no) + fmt(v) + ' %'); }
    k++;
  }
  return out;
}

                 'The container size, because a larger container always supplies a higher concentration',
                 'The exact position in the list, because that place is equivalent to the percentage of the ingredient',
                 'The total number of ingredients, because a short list indicates a high concentration'] }, ci:0,
      hint:{ es:'El orden de una lista da una comparación entre ingredientes, pero no dice qué proporción del producto ocupa cada uno.',
             en:'The order of a list gives a comparison among ingredients, but it does not say what proportion of the product each one takes up.' },
      exp:{ es:'La lista ordena, pero no cuantifica: solo el porcentaje declarado dice qué proporción del producto corresponde al principio activo, y esa proporción es la que se puede comparar con la de otras marcas. El tamaño del envase y el número de ingredientes no informan de la concentración.',
            en:'The list ranks, but it does not quantify: only the declared percentage says what proportion of the product corresponds to the active ingredient, and that proportion is the one that can be compared with other brands. Container size and the number of ingredients say nothing about concentration.' },
      sw:false }
  ];
  var v = V[Math.floor(rng() * V.length)];
  return { title:L(v.title), q:L(v.q), fn:'', options:L(v.opts), correct:v.ci, hint:L(v.hint), exp:L(v.exp), showWork:v.sw };
}

function mkP10(rng){
  var s = Math.floor(rng() * 3);
  if (s === 0){
    var A = pk(rng, [[250,8,20,230],[300,5,15,285],[400,6,24,376],[200,12,24,176],[500,4,20,480]]);
    var T = A[0], pc = A[1], so = A[2], wa = A[3];
    var good = so + L({ es:' g de sal y ', en:' g of salt and ' }) + wa + L({ es:' g de agua', en:' g of water' });
    var d1 = so + L({ es:' g de sal y ', en:' g of salt and ' }) + T + L({ es:' g de agua', en:' g of water' });
    var d2 = pc + L({ es:' g de sal y ', en:' g of salt and ' }) + (T - pc) + L({ es:' g de agua', en:' g of water' });
    var d3 = (so + 5) + L({ es:' g de sal y ', en:' g of salt and ' }) + (wa - 5) + L({ es:' g de agua', en:' g of water' });
    return {
      title:L({ es:'La preparación del laboratorio', en:'The laboratory preparation' }),
      q:L({ es:'Para una práctica se necesitan ' + T + ' g de una disolución al ' + pc + ' % en masa de sal. ¿Qué cantidades deben pesarse de sal y de agua para prepararla?',
            en:'For a practical session ' + T + ' g of a solution at ' + pc + ' % salt by mass are needed. What amounts of salt and of water must be weighed to prepare it?' }),
      fn:'',
      options:[good, d1, d2, d3],
      correct:0,
      hint:L({ es:'Los ' + T + ' g son la disolución terminada, no el agua: obtén primero la masa de sal y después completa hasta ese total.',
               en:'The ' + T + ' g are the finished solution, not the water: work out the salt mass first and then top up to that total.' }),
      exp:L({ es:'La sal es ' + T + ' × ' + pc + ' ÷ 100 = ' + so + ' g, y como los ' + T + ' g son la disolución completa, el agua es la diferencia: ' + T + ' − ' + so + ' = ' + wa,
              en:'The salt is ' + T + ' × ' + pc + ' ÷ 100 = ' + so + ' g, and since the ' + T + ' g are the whole solution, the water is the difference: ' + T + ' − ' + so + ' = ' + wa }),
      showWork:true
    };
  }
  if (s === 1){
    var B = pk(rng, [[200,10,300,5,7],[100,20,300,8,11],[300,12,200,2,8],[250,8,250,4,6],[400,6,100,16,8]]);
    var m1 = B[0], p1 = B[1], m2 = B[2], p2 = B[3], pf = B[4];
    var s1 = m1 * p1 / 100, s2 = m2 * p2 / 100;
    return {
      title:L({ es:'Las dos jarras que se juntan', en:'The two jugs poured together' }),
      q:L({ es:'Se vacían en un mismo recipiente ' + m1 + ' g de una disolución al ' + p1 + ' % en masa y ' + m2 + ' g de otra al ' + p2 + ' % del mismo soluto. ¿Cuál es el porcentaje en masa de la mezcla final?',
            en:'Into a single container are poured ' + m1 + ' g of a solution at ' + p1 + ' % by mass and ' + m2 + ' g of another at ' + p2 + ' % of the same solute. What is the percentage by mass of the final mixture?' }),
      fn:'',
      options:opts4(rng, pf, [(p1 + p2) / 2, p1, p2, pf + 1], ' %'),
      correct:0,
      hint:L({ es:'Los porcentajes no se suman entre sí. Obtén el soluto que aporta cada disolución, júntalos y compáralos con la masa total del recipiente.',
               en:'Percentages are not added to each other. Work out the solute each solution supplies, put them together and compare with the total mass in the container.' }),
      exp:L({ es:'La primera aporta ' + s1 + ' g de soluto y la segunda ' + s2 + ' g, en total ' + (s1 + s2) + ' g dentro de ' + m1 + ' + ' + m2 + ' = ' + (m1 + m2) + ' g de mezcla, así que ' + (s1 + s2) + ' ÷ ' + (m1 + m2) + ' × 100 = ' + pf,
              en:'The first supplies ' + s1 + ' g of solute and the second ' + s2 + ' g, in total ' + (s1 + s2) + ' g inside ' + m1 + ' + ' + m2 + ' = ' + (m1 + m2) + ' g of mixture, so ' + (s1 + s2) + ' ÷ ' + (m1 + m2) + ' × 100 = ' + pf }),
      showWork:true
    };
  }
  var C = pk(rng, [[600,11,3,22],[450,12,3,18],[800,9,4,18],[600,10,4,15],[750,8,3,20]]);
  var vt = C[0], pc2 = C[1], np = C[2], gp = C[3];
  var tot = vt * pc2 / 100;
  return {
    title:L({ es:'La porción de la botella', en:'The serving from the bottle' }),
    q:L({ es:'Una botella de ' + vt + ' mL de jugo declara ' + pc2 + ' % masa sobre volumen de azúcar, y la porción recomendada equivale a la ' + (np === 3 ? 'tercera' : 'cuarta') + ' parte de la botella. ¿Cuántos gramos de azúcar aporta esa porción?',
          en:'A ' + vt + ' mL bottle of juice declares ' + pc2 + ' % mass over volume of sugar, and the recommended serving is one ' + (np === 3 ? 'third' : 'quarter') + ' of the bottle. How many grams of sugar does that serving supply?' }),
    fn:'',
    options:opts4(rng, gp, [tot, gp * 2, gp / 2, gp + 6], ' g'),
    correct:0,
    hint:L({ es:'Obtén primero el azúcar de la botella completa con el dato de la etiqueta y después reparte esa masa en el número de porciones.',
             en:'First work out the sugar in the whole bottle with the label figure and then divide that mass among the number of servings.' }),
    exp:L({ es:'La botella completa lleva ' + vt + ' × ' + pc2 + ' ÷ 100 = ' + tot + ' g de azúcar, y la porción es una de ' + np + ' partes iguales, así que ' + tot + ' ÷ ' + np + ' = ' + gp,
            en:'The whole bottle carries ' + vt + ' × ' + pc2 + ' ÷ 100 = ' + tot + ' g of sugar, and the serving is one of ' + np + ' equal parts, so ' + tot + ' ÷ ' + np + ' = ' + gp }),
    showWork:true
  };
}
</script>

<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbykkuJ_apGq3vALIFd4mr3acu81c7K4OKxW-DZ-i52Ceyl3lOanXMdvbS9SIXPrLQBm/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';

  var moduleTitle = 'Concentración % Masa/Volumen en Higiene y Alimentos';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
