<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trend Analysis · Business Math · School of Economics, Universidad de Colima</title>
<link rel="canonical" href="https://liaxa.mx/facultad_economia/business_math/neg_tendencias.html">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS ── fallback only; applyBranding() re-injects from SCHOOL ── */
:root {
  --green:      #4a7c3f;
  --green-dark: #2d5a27;
  --green-bg:   #eaf0e7;
  --gold:       #c9a84c;
  --gold-bg:    #faf3e0;
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #6aaa5f;
  --green-dark: #8ecf82;
  --green-bg:   #1a281a;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--green-bg); color:var(--green-dark); border:1.5px solid var(--green); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; }
#restoreBar strong { color:var(--green-dark); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; object-fit:contain; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; min-width:0; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── LANGUAGE TOGGLE ── */
.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }
.dlist { font-family:'IBM Plex Mono',monospace; font-size:.78rem; color:var(--green-dark); background:var(--surface2); border-radius:8px; padding:.6rem .7rem; margin:.6rem 0; word-break:break-word; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); overflow-x:auto; }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── INTERACTIVE WIDGETS ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.iw-head { display:flex; align-items:baseline; gap:.6rem; margin-bottom:.3rem; flex-wrap:wrap; }
.iw-tag { font-size:.62rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; }
.iw-title { font-family:'Crimson Pro',serif; font-size:1.08rem; font-weight:700; }
.iw-sub { font-size:.8rem; color:var(--text2); margin-bottom:.85rem; }
.iw-canvas { display:block; width:100%; border-radius:8px; background:var(--surface2); }
.iw-read { margin-top:.85rem; background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 8px 8px 0; padding:.7rem .85rem; font-size:.82rem; color:var(--text2); }
.iw-read strong { color:var(--green-dark); }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (widget toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.3rem .7rem; font-size:.76rem; cursor:pointer; color:var(--text2); transition:all .14s; font-family:inherit; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--gold-bg); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }

/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos { gap: .9rem; }
  .wlogos img { height: 38px; max-width: 42%; }
  .wtitle { font-size: 1.35rem; }
  .stickybar { padding: .5rem .55rem; gap: .38rem; }
  .htitle { display: none; }
  .halexis { display: none; }
  .hsep { display: none; }
  .hlogos { gap: .3rem; }
  .hlogos img { height: 18px; max-width: 60px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 78px; overflow: hidden; text-overflow: ellipsis; }
  .lang-btn { padding: .26rem .48rem; font-size: .68rem; }
  .lbody { padding: 1.2rem .7rem 3rem; max-width: 100%; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .gcrd { padding: .9rem .75rem; }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}
</style>
</head>
<body>

<!-- ════════════════════ WELCOME ════════════════════ -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <img id="logo-left"  src="" alt="Facultad de Economía" style="display:none">
      <div class="wlogsep" id="wlogsep"></div>
      <img id="logo-right" src="" alt="Universidad de Colima" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Trend Analysis</div>
    <div class="wcourse" id="wcourse-el">Business Math</div>
    <label class="flabel" for="sName" id="lbl-name-el">Full name</label>
    <input class="finput" id="sName" type="text" placeholder="Your full name" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" for="sGroup" id="lbl-group-el">Group</label>
    <input class="finput" id="sGroup" type="text" placeholder="e.g. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Start</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar" style="background:var(--green-bg); color:var(--green-dark);">
      <strong id="restoreTitle">Saved session found</strong><br>
      <span id="restoreMsg">Do you want to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.9rem">
      <svg width="160" height="52" viewBox="0 0 180 52" xmlns="http://www.w3.org/2000/svg">
        <style>
          .lbt { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.1em; fill:var(--green); font-size:28px; }
          .lbl { stroke:var(--gold); stroke-width:2.5; }
          .lba { fill:var(--gold); }
        </style>
        <polyline points="5,40 14,28 24,33 36,14" fill="none" stroke="var(--green)" stroke-width="3"/>
        <circle cx="36" cy="14" r="4.5" class="lba"/>
        <line x1="52" y1="6" x2="52" y2="46" class="lbl"/>
        <text x="64" y="38" class="lbt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- ════════════════════ LESSON ════════════════════ -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <img id="hlogo-left"  src="" alt="Facultad de Economía" style="display:none">
      <img id="hlogo-right" src="" alt="Universidad de Colima" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle" id="htitle-el">Trend Analysis</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg">
        <style>
          .lht { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
          .lhl { stroke:var(--gold); stroke-width:2; }
          .lha { fill:var(--gold); }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" fill="none" stroke="var(--green)" stroke-width="2"/>
        <circle cx="22" cy="10" r="2.5" class="lha"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lhl"/>
        <text x="42" y="22" class="lht">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle">
      <button class="lang-btn"        id="btn-es" onclick="setLang('es')">ES</button>
      <button class="lang-btn active" id="btn-en" onclick="setLang('en')">EN</button>
    </div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="dlbtn" id="dlBtn" onclick="generatePDF()">Download results as PDF</button>
    </div>
  </div>
</div>

<script>
/* ════════════════════════════════════════════════════════════════════════
   SCHOOL CONFIG · edit ONLY this block to rebrand for a different school
   ════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:      '#4a7c3f',
  primaryDark:  '#2d5a27',
  primaryBg:    '#eaf0e7',
  accent:       '#c9a84c',
  accentBg:     '#faf3e0',
  pBR: 74,  pBG: 124, pBB: 63,
  pAR: 201, pAG: 168, pAB: 76,
  darkPrimary:     '#6aaa5f',
  darkPrimaryDark: '#8ecf82',
  darkPrimaryBg:   '#1a281a',

function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t2 = s ^ (s >>> 16);
    t2 = Math.imul(t2, 0x21f0aaad);
    t2 ^= (t2 >>> 15);
    t2 = Math.imul(t2, 0x735a2d97);
    return ((t2 ^ (t2 >>> 15)) >>> 0) / 4294967296;
  };
}

function shuffle(arr, rng) {

    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }

}

}
function nfD(x, d) {

  s[0] = s[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return (neg ? '−' : '') + s.join('.');
}
function money(v)  { return '$' + nf(Math.round(v)); }

function dec1(x)   { return x.toFixed(1); }

/* ── THE MODELS THIS GUIDE RUNS ON ────────────────────────────────────────
   A trend is not a drawing, it is an arithmetic. Every number a business
   reads off a chart of its own history comes from four operations applied
   to the same table: fit a line, measure what the line misses, separate the
   part of the movement that repeats every year, and check whether the
   increments themselves are growing. Everything below is those four. */

/* Least squares fit of y against x. Returns the slope and the level, plus
   the pieces every measure of fit is built from. The slope is the covariation
   of the two columns divided by the variation of time alone. */
function fitLine(pts) {
  var n = pts.length, sx = 0, sy = 0, sxx = 0, sxy = 0, syy = 0, i;
  for (i = 0; i < n; i++) {
    sx += pts[i].x; sy += pts[i].y;
    sxx += pts[i].x * pts[i].x;
    sxy += pts[i].x * pts[i].y;
    syy += pts[i].y * pts[i].y;
  }
  var xbar = sx / n, ybar = sy / n;
  var Sxx = sxx - n * xbar * xbar;
  var Sxy = sxy - n * xbar * ybar;
  var Syy = syy - n * ybar * ybar;
  var b = Sxx !== 0 ? Sxy / Sxx : 0;
  var a = ybar - b * xbar;
  var sse = Math.max(0, Syy - b * Sxy);
  return {
    a: a, b: b, n: n, xbar: xbar, ybar: ybar,
    Sxx: Sxx, Sxy: Sxy, Syy: Syy, sse: sse,
    r2: Syy > 0 ? 1 - sse / Syy : 1,
    se: n > 2 ? Math.sqrt(sse / (n - 2)) : 0
  };
}
function trendAt(fit, x) { return fit.a + fit.b * x; }
/* What any candidate line, not only the best one, leaves unexplained. */
function sseOf(pts, a, b) {
  var s = 0, i, r;
  for (i = 0; i < pts.length; i++) { r = pts[i].y - (a + b * pts[i].x); s += r * r; }
  return s;
}
/* A forecast is least reliable far from the centre of the data. This is the
   half width of the band around a forecast, in standard errors. */
function bandWidth(fit, x) {
  if (!fit.Sxx) return 0;
  return fit.se * Math.sqrt(1 + 1 / fit.n + (x - fit.xbar) * (x - fit.xbar) / fit.Sxx);
}
/* The month the trend first reaches a target level. */
function monthReaching(a, b, target) { return b > 0 ? Math.ceil((target - a) / b) : null; }
/* Seasonality: the ratio of what actually happened to what the trend alone
   would have given, averaged over every appearance of the same season and
   rescaled so the seasons of one year average exactly one. */
function seasonalIndices(pts, period) {
  var fit = fitLine(pts), sums = [], counts = [], i, k, out = [], tot = 0;
  for (i = 0; i < period; i++) { sums.push(0); counts.push(0); }
  for (i = 0; i < pts.length; i++) {
    k = i % period;
    var tv = trendAt(fit, pts[i].x);
    if (tv > 0) { sums[k] += pts[i].y / tv; counts[k]++; }
  }
  for (i = 0; i < period; i++) { out.push(counts[i] ? sums[i] / counts[i] : 1); tot += out[i]; }
  var scale = tot > 0 ? period / tot : 1;
  return out.map(function(v) { return v * scale; });
}
function deseasonalize(value, index) { return index ? value / index : value; }
function reseasonalize(trendValue, index) { return trendValue * index; }
/* Constant percentage growth: the rate that carries the first figure to the
   last one in n steps, and the projection that rate implies. */
function growthRate(v0, vn, n) { return n > 0 && v0 > 0 ? Math.pow(vn / v0, 1 / n) - 1 : 0; }
function growAt(v0, g, n) { return v0 * Math.pow(1 + g, n); }
function doublingPeriods(g) { return g > 0 ? Math.log(2) / Math.log(1 + g) : Infinity; }
/* A moving average trades responsiveness for calm: it estimates the level in
   the middle of its own window, never at the edge. */
function movingAverage(vals, k) {
  var out = [], i, j, s;
  for (i = 0; i + k <= vals.length; i++) {
    s = 0;
    for (j = 0; j < k; j++) s += vals[i + j];
    out.push(s / k);
  }
  return out;
}
/* A six month series whose least squares line is exactly the line it was
   built from: the wobble adds to zero and carries no tilt of its own. */
var WOBBLE6 = [0, 1, -1, 0, -1, 1];
function series6(a, b, d) {
  var pts = [], i;
  for (i = 0; i < 6; i++) pts.push({ x: i + 1, y: a + b * (i + 1) + d * WOBBLE6[i] });
  return pts;
}
function ys(pts) { return pts.map(function(p) { return p.y; }); }
function seriesList(pts, labels) {
  return pts.map(function(p, i) { return labels[i] + ' ' + money(p.y); }).join('   ·   ');
}

/* ════════════════════════════════════════════════════════════════════════
   OPTION BUILDERS · the key is always the first value handed in
   ════════════════════════════════════════════════════════════════════════ */
/* Four distinct numbers rendered by fmt, aligned across languages. */
function valOpts(correct, wrongs, fmt, rng) {
  var seen = {}, vals = [];
  function add(v) {
    if (typeof v !== 'number' || !isFinite(v)) return;
    var s = fmt(v);
    if (seen[s]) return;
    seen[s] = 1; vals.push(s);
  }
  add(correct);
  for (var i = 0; i < wrongs.length && vals.length < 4; i++) add(wrongs[i]);
  for (var j = 1; vals.length < 4 && j < 900; j++) {
    add(correct * (1 + j * 0.12 * (j % 2 ? 1 : -1)));
  }
  for (var k = 1; vals.length < 4 && k < 900; k++) add(correct + k * 0.37);
  return shuffleOpts(vals, vals, rng);
}
/* Four distinct counts, each rendered with the word for the period so the
   option reads as a business answer and not as a bare number. */
function labelledOpts(correct, wrongs, fmtEs, fmtEn, rng) {
  var seen = {}, es = [], en = [];
  function add(v) {
    if (typeof v !== 'number' || !isFinite(v) || v < 1) return;
    var k = Math.round(v);
    if (seen[k]) return;
    seen[k] = 1; es.push(fmtEs(k)); en.push(fmtEn(k));
  }
  add(correct);
  for (var i = 0; i < wrongs.length && es.length < 4; i++) add(wrongs[i]);
  for (var j = 1; es.length < 4 && j < 900; j++) add(Math.round(correct * (1 + j * 0.11 * (j % 2 ? 1 : -1))));
  return shuffleOpts(es, en, rng);
}

function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#2d5a27';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e) { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e) { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(p[0], p[1]); ctx.stroke(); lx = p[0]; ly = p[1]; }
  function onUp() { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}
function switchTab(idx, panel, btn) {
  var prefix = 'wp_' + idx + '_';
  document.querySelectorAll('[id^="' + prefix + '"]').forEach(function(p) { p.classList.remove('active'); });
  document.getElementById(prefix + panel).classList.add('active');
  btn.closest('.wtabs').querySelectorAll('.wtab').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');

/* ════════════════════════════════════════════════════════════════════════
   ANSWER HANDLER · two taps to confirm
   ════════════════════════════════════════════════════════════════════════ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = '<strong>' + (isOk ? t('fb-correct') : t('fb-wrong')) + '</strong> ' + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (!prob || prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = '<strong>' + (isOk ? t('fb-correct') : t('fb-wrong')) + '</strong> ' + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

/* ════════════════════════════════════════════════════════════════════════
   CANVAS PRIMITIVES FOR THE WIDGETS
   ════════════════════════════════════════════════════════════════════════ */
function fitCanvas(cv, h) {
  var dpr = window.devicePixelRatio || 1;
  var w = Math.max(240, cv.clientWidth || cv.parentNode.clientWidth || 300);
  cv.style.height = h + 'px';
  cv.width  = Math.round(w * dpr);
  cv.height = Math.round(h * dpr);
  var ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  return { ctx: ctx, w: w, h: h };
}
function palette() {
  return {
    green: cssv('--green'), dark: cssv('--green-dark'), tint: cssv('--green-bg'),
    gold: cssv('--gold'), bad: cssv('--bad'), border: cssv('--border'),
    text: cssv('--text'), text2: cssv('--text2'), text3: cssv('--text3')
  };
}
function kindColor(P, kind) {
  if (kind === 'gold') return P.gold;
  if (kind === 'bad')  return P.bad;
  if (kind === 'tint') return P.tint;
  if (kind === 'soft') return P.text3;
  if (kind === 'green') return P.green;
  return P.dark;
}
/* One picture serves every idea in this guide, because every idea in this
   guide is the same picture read differently: a cloud of observed periods,
   a line claiming to summarize them, the vertical gaps the line leaves, and
   the widening doubt beyond the last month with data.
     opts.points  the periods actually observed
     opts.lines   any line or curve claimed to describe them
     opts.bars    the vertical gaps between an observation and a line
     opts.cone    the widening band around a forecast
     opts.band    the stretch of time that has no data behind it
     opts.hline   a target or a reference level
     opts.marks   points worth naming                                      */
function drawTrendChart(g, xMin, xMax, opts) {
  var ctx = g.ctx, P = palette(), W = g.w, H = g.h, i;
  var padL = 58, padR = 12, padT = 18, padB = 28;
  opts = opts || {};
  var lines  = opts.lines  || [];
  var points = opts.points || [];
  var bars   = opts.bars   || [];
  var fmtY = opts.fmtY || function(v) { return intN(v); };
  var fmtX = opts.fmtX || function(v) { return intN(v); };
  var STEPS = 130;
  var yLo = null, yHi = null;
  function note(v) {
    if (typeof v !== 'number' || !isFinite(v)) return;
    if (yLo === null || v < yLo) yLo = v;
    if (yHi === null || v > yHi) yHi = v;
  }
  lines.forEach(function(s) {
    for (i = 0; i <= STEPS; i++) note(s.f(xMin + (xMax - xMin) * i / STEPS));
  });
  if (opts.cone) {
    for (i = 0; i <= STEPS; i++) {
      var cx0 = xMin + (xMax - xMin) * i / STEPS;
      note(opts.cone.hi(cx0)); note(opts.cone.lo(cx0));
    }
  }
  points.forEach(function(p) { note(p.y); });
  bars.forEach(function(b) { note(b.y0); note(b.y1); });
  note(opts.yFloor); note(opts.yCeil);
  if (opts.hline) note(opts.hline.y);
  if (yLo === null) { yLo = 0; yHi = 1; }
  if (yHi - yLo < 1) yHi = yLo + 1;
  var pd = (yHi - yLo) * 0.10;
  yLo -= pd; yHi += pd;
  function X(v) { return padL + (v - xMin) / (xMax - xMin) * (W - padL - padR); }
  function Y(v) { return H - padB - (v - yLo) / (yHi - yLo) * (H - padT - padB); }
  function Yc(v) { return Math.max(padT - 10, Math.min(H - padB + 10, Y(v))); }

  /* the stretch of time with no data behind it, painted before everything */
  if (opts.band && opts.band.to > opts.band.from) {
    var b1 = X(Math.max(xMin, opts.band.from)), b2 = X(Math.min(xMax, opts.band.to));
    if (b2 > b1) {
      ctx.save();
      ctx.fillStyle = P.tint;
      ctx.fillRect(b1, padT - 8, b2 - b1, H - padB - padT + 8);
      ctx.restore();
      if (opts.band.label) {
        ctx.fillStyle = P.text3; ctx.font = '600 9px "IBM Plex Sans", sans-serif';
        ctx.fillText(opts.band.label, Math.min(b1 + 4, W - 90), padT + 2);
      }
    }
  }
  /* horizontal guides and the value axis */
  ctx.strokeStyle = P.border; ctx.lineWidth = 1;
  ctx.fillStyle = P.text3; ctx.font = '9px "IBM Plex Mono", monospace';
  for (i = 0; i <= 3; i++) {
    var gv = yLo + (yHi - yLo) * i / 3;
    ctx.beginPath(); ctx.moveTo(padL, Y(gv)); ctx.lineTo(W - padR, Y(gv)); ctx.stroke();
    var gl = fmtY(gv);
    ctx.fillText(gl, Math.max(1, padL - 4 - ctx.measureText(gl).width), Y(gv) + 3);
  }
  /* the zero line matters as soon as a residual chart is on screen */
  if (yLo < 0 && yHi > 0) {
    ctx.save();
    ctx.strokeStyle = P.text3; ctx.lineWidth = 1.4; ctx.setLineDash([3, 3]);
    ctx.beginPath(); ctx.moveTo(padL, Y(0)); ctx.lineTo(W - padR, Y(0)); ctx.stroke();
    ctx.restore();
  }
  /* the widening doubt around a forecast */
  if (opts.cone) {
    ctx.save();
    ctx.globalAlpha = 0.30;
    ctx.fillStyle = kindColor(P, opts.cone.kind || 'gold');
    ctx.beginPath();
    for (i = 0; i <= STEPS; i++) {
      var xu = xMin + (xMax - xMin) * i / STEPS;
      var pu = Yc(opts.cone.hi(xu));
      if (i === 0) ctx.moveTo(X(xu), pu); else ctx.lineTo(X(xu), pu);
    }
    for (i = STEPS; i >= 0; i--) {
      var xd = xMin + (xMax - xMin) * i / STEPS;
      ctx.lineTo(X(xd), Yc(opts.cone.lo(xd)));
    }
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  /* the target or reference level */
  if (opts.hline) {
    ctx.save();
    ctx.strokeStyle = P.gold; ctx.lineWidth = 1.5; ctx.setLineDash([6, 3]);
    ctx.beginPath(); ctx.moveTo(padL, Y(opts.hline.y)); ctx.lineTo(W - padR, Y(opts.hline.y)); ctx.stroke();
    ctx.restore();
    if (opts.hline.label) {
      ctx.fillStyle = P.gold; ctx.font = '600 9px "IBM Plex Sans", sans-serif';
      var hw = ctx.measureText(opts.hline.label).width;
      ctx.fillText(opts.hline.label, W - padR - hw - 2, Math.max(10, Y(opts.hline.y) - 4));
    }
  }
  /* the vertical gaps a line leaves, drawn before the line itself */
  bars.forEach(function(b) {
    ctx.save();
    ctx.strokeStyle = kindColor(P, b.kind || 'bad');
    ctx.lineWidth = b.wide ? 7 : 2;
    ctx.beginPath(); ctx.moveTo(X(b.x), Yc(b.y0)); ctx.lineTo(X(b.x), Yc(b.y1)); ctx.stroke();
    ctx.restore();
  });
  /* the lines claiming to describe the cloud */
  lines.forEach(function(s) {
    ctx.save();
    ctx.strokeStyle = kindColor(P, s.kind); ctx.lineWidth = s.thin ? 1.6 : 2.2;
    if (s.dash) ctx.setLineDash([6, 4]);
    ctx.beginPath();
    var started = false;
    for (i = 0; i <= STEPS; i++) {
      var xv = xMin + (xMax - xMin) * i / STEPS;
      var yv = s.f(xv);
      if (typeof yv !== 'number' || !isFinite(yv)) { started = false; continue; }
      var px = X(xv), py = Yc(yv);
      if (!started) { ctx.moveTo(px, py); started = true; } else { ctx.lineTo(px, py); }
    }
    ctx.stroke();
    ctx.restore();
  });
  /* the periods actually observed */
  points.forEach(function(p) {
    if (p.x < xMin || p.x > xMax) return;
    ctx.fillStyle = kindColor(P, p.kind || 'dark');
    ctx.beginPath(); ctx.arc(X(p.x), Yc(p.y), p.big ? 4.6 : 3.4, 0, Math.PI * 2); ctx.fill();
  });
  /* named points, dropped onto the time axis */
  (opts.marks || []).forEach(function(m) {
    if (typeof m.x !== 'number' || !isFinite(m.x) || m.x < xMin || m.x > xMax) return;
    var cx = X(m.x), cy = Yc(m.y);
    ctx.save();
    ctx.strokeStyle = kindColor(P, m.kind || 'gold'); ctx.lineWidth = 1.4; ctx.setLineDash([4, 3]);
    ctx.beginPath(); ctx.moveTo(cx, H - padB); ctx.lineTo(cx, cy); ctx.stroke();
    ctx.restore();
    ctx.fillStyle = kindColor(P, m.kind || 'gold');
    ctx.beginPath(); ctx.arc(cx, cy, 4.2, 0, Math.PI * 2); ctx.fill();
    if (m.label) {
      ctx.font = '600 10px "IBM Plex Sans", sans-serif';
      var mw = ctx.measureText(m.label).width;
      ctx.fillText(m.label, Math.min(Math.max(2, cx - mw / 2), W - mw - 2), Math.max(10, cy - 9));
    }
  });
  /* axes */
  ctx.strokeStyle = P.border; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(padL, padT - 8); ctx.lineTo(padL, H - padB); ctx.lineTo(W - padR, H - padB); ctx.stroke();
  ctx.fillStyle = P.text3; ctx.font = '9px "IBM Plex Mono", monospace';
  [xMin, (xMin + xMax) / 2, xMax].forEach(function(v) {
    var lab = fmtX(v), lw = ctx.measureText(lab).width;
    ctx.fillText(lab, Math.min(Math.max(1, X(v) - lw / 2), W - lw - 1), H - padB + 13);
  });
  /* legend */
  var legX = padL + 4;
  ctx.font = '600 9.5px "IBM Plex Sans", sans-serif';
  lines.forEach(function(s) {
    if (!s.label) return;
    ctx.fillStyle = kindColor(P, s.kind);
    ctx.fillRect(legX, 9, 9, 3);
    ctx.fillText(s.label, legX + 12, 13);
    legX += 12 + ctx.measureText(s.label).width + 12;
  });
  if (opts.xLabel) {
    ctx.fillStyle = P.text3; ctx.font = '9px "IBM Plex Sans", sans-serif';
    var xl = opts.xLabel;
    ctx.fillText(xl, W - padR - ctx.measureText(xl).width, H - 3);
  }
}
/* A fixed irregularity pattern. It is not random: every student sees the
   same shop, and the same slider always produces the same history. */
var WOB = [0.35, -0.85, 0.55, -0.15, 0.95, -0.65, 0.15, -0.45, 0.75, -0.7,
           0.45, -0.25, -0.9, 0.65, 0.05, -0.55, 0.85, -0.35, 0.25, -0.45,
           0.6, -0.75, 0.4, 0.1];
function widgetSeries(a, b, disp, n) {
  var pts = [], i;
  for (i = 1; i <= n; i++) pts.push({ x: i, y: a + b * i + disp * WOB[(i - 1) % WOB.length] });
  return pts;
}

        host.querySelectorAll('.mtab').forEach(function(x) { x.classList.remove('active'); });
        b.classList.add('active');
        update();
      });
    });
    host.querySelector('#f1gb').addEventListener('input', function() { state.gb = parseInt(this.value, 10); update(); });
    host.querySelector('#f1ga').addEventListener('input', function() { state.ga = parseInt(this.value, 10); update(); });
    host.querySelector('#f1b').addEventListener('input',  function() { state.b  = parseInt(this.value, 10); update(); });
    host.querySelector('#f1d').addEventListener('input',  function() { state.disp = parseInt(this.value, 10); update(); });
    update();
  }
  function update() {
    var es = LANG === 'es';
    var n = 10;
    var pts = widgetSeries(state.a, state.b, state.disp, n);
    var fit = fitLine(pts);
    var mySse = sseOf(pts, state.ga, state.gb);
    var myTyp = Math.sqrt(mySse / n);
    var beTyp = Math.sqrt(fit.sse / n);
    var fc    = trendAt(fit, 14);
    host.querySelector('#f1gbl').textContent = money(state.gb);
    host.querySelector('#f1gal').textContent = money(state.ga);
    host.querySelector('#f1bl').textContent  = money(state.b);
    host.querySelector('#f1dl').textContent  = money(state.disp);
    host.querySelector('#f1me').textContent  = money(myTyp);
    host.querySelector('#f1be').textContent  = money(beTyp);
    host.querySelector('#f1gap').textContent = money(Math.max(0, myTyp - beTyp));
    host.querySelector('#f1bb').textContent  = money(fit.b);
    host.querySelector('#f1ba').textContent  = money(fit.a);
    host.querySelector('#f1fc').textContent  = money(fc);
    host.querySelector('#f1steps').textContent = es
      ? 'Cada mes deja una diferencia entre lo que vendió y lo que tu recta decía  ·  ' +
        'esas diferencias se elevan al cuadrado para que las de arriba no cancelen las de abajo  ·  ' +
        'se suman las diez y se saca la raíz del promedio: ese es el error típico  ·  ' +
        'la mejor recta es la única que deja ese número en su valor más bajo posible, ' + money(beTyp)
      : 'Every month leaves a difference between what it sold and what your line claimed  ·  ' +
        'those differences are squared so that the ones above do not cancel the ones below  ·  ' +
        'the ten are added up and the root of the average is taken: that is the typical miss  ·  ' +
        'the best line is the only one that leaves that number at its lowest possible value, ' + money(beTyp);
    var g = fitCanvas(host.querySelector('#f1cv'), 190);
    var lines = [{ f: function(x) { return state.ga + state.gb * x; }, kind: 'gold',
                   label: (es ? 'Tu recta' : 'Your line') }];
    var bars = [];
    if (state.view === 'miss') {
      pts.forEach(function(p) {
        bars.push({ x: p.x, y0: p.y, y1: state.ga + state.gb * p.x, kind: 'bad' });
      });
    }
    if (state.view === 'both') {
      lines.push({ f: function(x) { return trendAt(fit, x); }, kind: 'green',
                   label: (es ? 'Mínimos cuadrados' : 'Least squares') });
    }
    drawTrendChart(g, 1, 14, {
      points: pts.map(function(p) { return { x: p.x, y: p.y, kind: 'dark' }; }),
      lines: lines, bars: bars,
      band: { from: 10.5, to: 14, label: (es ? 'sin datos' : 'no data') },
      fmtY: function(v) { return money(v); },
      fmtX: function(v) { return (es ? 'mes ' : 'month ') + intN(v); },
      xLabel: (es ? 'meses' : 'months')
    });
    var close = myTyp - beTyp < beTyp * 0.02;
    host.querySelector('#f1read').innerHTML = es
      ? '<strong>Lectura de negocio:</strong> tu recta sube ' + money(state.gb) + ' al mes y arranca en ' + money(state.ga) + ', y con eso se equivoca por ' + money(myTyp) + ' en un mes típico. ' +
        (close
          ? 'Prácticamente diste con la mejor recta posible: ningún otro par de valores deja un error más bajo, y por eso a esa recta se le llama de mínimos cuadrados. '
          : 'La mejor recta sube ' + money(fit.b) + ' al mes desde ' + money(fit.a) + ' y se equivoca solo por ' + money(beTyp) + ', así que tu recta carga ' + money(myTyp - beTyp) + ' de error evitable en cada mes. ') +
        'Lo importante es de dónde salen esos dos números de la mejor recta. No se eligen a ojo ni se toman de dos meses cualesquiera: salen de repartir la covariación entre el tiempo y las ventas entre la variación del tiempo, que es la manera algebraica de encontrar el punto más bajo de una suma de cuadrados. En la práctica esto significa que la pendiente resume los diez meses a la vez y ningún mes suelto la manda. ' +
        'Fíjate también en una trampa de lectura: el arranque de ' + money(fit.a) + ' es el valor de la recta en el mes cero, un mes que nadie observó. Sirve para colocar la recta, no para afirmar que el negocio vendía eso antes de abrir.'
      : '<strong>Business reading:</strong> your line climbs ' + money(state.gb) + ' a month and starts at ' + money(state.ga) + ', and with that it is wrong by ' + money(myTyp) + ' in a typical month. ' +
        (close
          ? 'You practically landed on the best line available: no other pair of values leaves a lower error, and that is why this line is called the least squares line. '
          : 'The best line climbs ' + money(fit.b) + ' a month from ' + money(fit.a) + ' and is wrong by only ' + money(beTyp) + ', so your line carries ' + money(myTyp - beTyp) + ' of avoidable error every month. ') +
        'What matters is where those two numbers of the best line come from. They are not chosen by eye or taken from any two months: they come from dividing the covariation between time and sales by the variation of time alone, which is the algebraic way of finding the lowest point of a sum of squares. In practice this means the slope summarizes all ten months at once and no single month can command it. ' +
        'Notice a reading trap as well: the starting level of ' + money(fit.a) + ' is the value of the line in month zero, a month nobody observed. It serves to place the line, not to claim the business was selling that before it opened.';
  }
  widgets.push(mount);
  mount();
}

/* ════════════════════════════════════════════════════════════════════════
   WIDGET 2 · what the line misses, and how far ahead it can be trusted
   ════════════════════════════════════════════════════════════════════════ */
function widgetForecastBand(a0, b0, disp0) {
  var host = document.createElement('div');
  host.className = 'section';
  document.getElementById('lessonBody').appendChild(host);
  var state = { view: 'cone', a: a0, b: b0, disp: disp0, n: 12, h: 6 };
  function mount() {
    var es = LANG === 'es';
    var MODES = [
      { id: 'cone',  es: 'Pronóstico y su duda', en: 'Forecast and its doubt' },
      { id: 'resid', es: 'Residuos mes por mes', en: 'Residuals month by month' }
    ];
    var tabs = MODES.map(function(m) {
      return '<button class="mtab' + (m.id === state.view ? ' active' : '') + '" data-m="' + m.id + '">' + m[LANG] + '</button>';
    }).join('');
    host.innerHTML =
      '<div class="gcrd" data-widget="residuos-y-horizonte-de-pronostico">' +
        '<div class="iw-head"><span class="iw-tag">' + (es ? 'Herramienta' : 'Tool') + '</span>' +
        '<span class="iw-title">' + (es ? 'Hasta dónde alcanza un pronóstico' : 'How far a forecast reaches') + '</span></div>' +
        '<div class="iw-sub">' + (es
          ? 'La misma recta, ahora juzgada. La primera pestaña la extiende hacia el futuro y pinta alrededor la franja de duda; la segunda muestra los residuos, que son los pesos que cada mes quedó por arriba o por abajo de la recta. Haz tres experimentos y anota lo que ves. Primero alarga el horizonte sin tocar nada más: la franja se abre en abanico, y esa apertura es la razón por la que un pronóstico a dos años no vale lo mismo que uno a dos meses. Segundo, sube la irregularidad del negocio: el porcentaje explicado se desploma aunque la recta siga siendo la misma. Tercero, alarga el historial: con más meses atrás la franja se angosta, porque la recta descansa sobre más evidencia.'
          : 'The same line, now judged. The first tab extends it into the future and paints the band of doubt around it; the second shows the residuals, the pesos by which each month landed above or below the line. Run three experiments and note what you see. First stretch the horizon without touching anything else: the band opens like a fan, and that opening is why a forecast two years out is not worth the same as one two months out. Second, raise the irregularity of the business: the share of movement explained collapses even though the line is the same. Third, lengthen the history: with more months behind it the band narrows, because the line rests on more evidence.') + '</div>' +
        '<div class="mtabs">' + tabs + '</div>' +
        '<div class="cgrid"><div class="cg">' +
          '<label>' + (es ? 'Meses ya observados' : 'Months already observed') + ': <span class="cval" id="f2nl"></span></label>' +
          '<input type="range" min="5" max="24" step="1" id="f2n" value="' + state.n + '">' +
        '</div><div class="cg">' +
          '<label>' + (es ? 'Meses hacia adelante' : 'Months ahead') + ': <span class="cval" id="f2hl"></span></label>' +
          '<input type="range" min="1" max="24" step="1" id="f2h" value="' + state.h + '">' +
        '</div></div>' +
        '<div class="cgrid"><div class="cg">' +
          '<label>' + (es ? 'Qué tan irregulares son los meses' : 'How irregular the months are') + ': <span class="cval" id="f2dl"></span></label>' +
          '<input type="range" min="0" max="60000" step="2500" id="f2d" value="' + state.disp + '">' +
        '</div><div class="cg">' +
          '<label>' + (es ? 'Crecimiento real del negocio' : 'Real growth of the business') + ': <span class="cval" id="f2bl"></span></label>' +
          '<input type="range" min="2000" max="30000" step="1000" id="f2b" value="' + state.b + '">' +
        '</div></div>' +
        '<canvas class="iw-canvas" id="f2cv"></canvas>' +
        '<div class="dlist" id="f2steps"></div>' +
        '<div class="metrics">' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Movimiento explicado' : 'Movement explained') + '</div><div class="mnum cs" id="f2r2"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Error típico de un mes' : 'Typical miss of a month') + '</div><div class="mnum ps" id="f2se"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Residuo más grande' : 'Largest residual') + '</div><div class="mnum ts" id="f2mx"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Pronóstico del horizonte' : 'Forecast at the horizon') + '</div><div class="mnum cs" id="f2fc"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Duda en el último mes con datos' : 'Doubt at the last month with data') + '</div><div class="mnum ts" id="f2d0"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Duda en el horizonte' : 'Doubt at the horizon') + '</div><div class="mnum ps" id="f2dh"></div></div>' +
        '</div>' +
        '<div class="iw-read" id="f2read"></div>' +
      '</div>';
    host.querySelectorAll('.mtab').forEach(function(b) {
      b.addEventListener('click', function() {
        state.view = b.getAttribute('data-m');
        host.querySelectorAll('.mtab').forEach(function(x) { x.classList.remove('active'); });
        b.classList.add('active');
        update();
      });
    });
    host.querySelector('#f2n').addEventListener('input', function() { state.n = parseInt(this.value, 10); update(); });
    host.querySelector('#f2h').addEventListener('input', function() { state.h = parseInt(this.value, 10); update(); });
    host.querySelector('#f2d').addEventListener('input', function() { state.disp = parseInt(this.value, 10); update(); });
    host.querySelector('#f2b').addEventListener('input', function() { state.b = parseInt(this.value, 10); update(); });
    update();
  }
  function update() {
    var es = LANG === 'es';
    var pts = widgetSeries(state.a, state.b, state.disp, state.n);
    var fit = fitLine(pts);
    var target = state.n + state.h;
    var fc = trendAt(fit, target);
    var d0 = 2 * bandWidth(fit, state.n);
    var dh = 2 * bandWidth(fit, target);
    var maxRes = 0, resid = [];
    pts.forEach(function(p) {
      var r = p.y - trendAt(fit, p.x);
      resid.push({ x: p.x, r: r });
      if (Math.abs(r) > Math.abs(maxRes)) maxRes = r;
    });
    host.querySelector('#f2nl').textContent = intN(state.n);
    host.querySelector('#f2hl').textContent = intN(state.h);
    host.querySelector('#f2dl').textContent = money(state.disp);
    host.querySelector('#f2bl').textContent = money(state.b);
    host.querySelector('#f2r2').textContent = pct1(fit.r2) + '%';
    host.querySelector('#f2se').textContent = money(fit.se);
    host.querySelector('#f2mx').textContent = money(maxRes);
    host.querySelector('#f2fc').textContent = money(fc);
    host.querySelector('#f2d0').textContent = money(d0);
    host.querySelector('#f2dh').textContent = money(dh);
    host.querySelector('#f2steps').textContent = es
      ? 'El residuo de un mes es lo que vendió menos lo que la recta decía  ·  ' +
        'la suma de esos residuos al cuadrado, repartida entre los grados de libertad, da el error típico de ' + money(fit.se) + '  ·  ' +
        'el porcentaje explicado compara ese sobrante contra la variación total de las ventas  ·  ' +
        'la franja de duda vale ese error típico ensanchado por la distancia al centro del historial'
      : 'The residual of a month is what it sold minus what the line claimed  ·  ' +
        'the sum of those residuals squared, spread over the degrees of freedom, gives the typical miss of ' + money(fit.se) + '  ·  ' +
        'the share explained compares that leftover against the total variation of sales  ·  ' +
        'the band of doubt is that typical miss widened by the distance from the centre of the history';
    var g = fitCanvas(host.querySelector('#f2cv'), 190);
    if (state.view === 'cone') {
      drawTrendChart(g, 1, target + 1, {
        points: pts.map(function(p) { return { x: p.x, y: p.y, kind: 'dark' }; }),
        lines: [{ f: function(x) { return trendAt(fit, x); }, kind: 'green', label: (es ? 'Tendencia' : 'Trend') }],
        cone: {
          hi: function(x) { return trendAt(fit, x) + 2 * bandWidth(fit, x); },
          lo: function(x) { return trendAt(fit, x) - 2 * bandWidth(fit, x); },
          kind: 'gold'
        },
        band: { from: state.n + 0.5, to: target + 1, label: (es ? 'sin datos' : 'no data') },
        marks: [{ x: target, y: fc, label: money(fc), kind: 'gold' }],
        fmtY: function(v) { return money(v); },
        fmtX: function(v) { return (es ? 'mes ' : 'month ') + intN(v); },
        xLabel: (es ? 'meses' : 'months')
      });
    } else {
      drawTrendChart(g, 1, state.n, {
        bars: resid.map(function(r) { return { x: r.x, y0: 0, y1: r.r, kind: r.r >= 0 ? 'green' : 'bad', wide: true }; }),
        points: resid.map(function(r) { return { x: r.x, y: r.r, kind: r.r >= 0 ? 'green' : 'bad' }; }),
        lines: [{ f: function() { return 0; }, kind: 'soft', thin: true, label: (es ? 'La tendencia' : 'The trend') }],
        hline: { y: fit.se, label: (es ? 'error típico' : 'typical miss') },
        fmtY: function(v) { return money(v); },
        fmtX: function(v) { return (es ? 'mes ' : 'month ') + intN(v); },
        xLabel: (es ? 'residuos en pesos' : 'residuals in pesos')
      });
    }
    var ratio = d0 > 0 ? dh / d0 : 1;
    host.querySelector('#f2read').innerHTML = es
      ? '<strong>Lectura de negocio:</strong> con ' + intN(state.n) + ' meses de historia la recta explica ' + pct1(fit.r2) + '% del movimiento de las ventas y falla por ' + money(fit.se) + ' en un mes típico. El pronóstico para el mes ' + intN(target) + ' es ' + money(fc) + ', pero honestamente hay que entregarlo con una franja de ' + money(dh) + ' de ancho, que es ' + dec1(ratio) + ' veces la franja del último mes con datos. ' +
        'De ahí sale la regla práctica que separa a un analista de una hoja de cálculo: el número que sale de la fórmula es el centro de un rango, no una promesa. Un consejo que pide el pronóstico a un año merece oír también el ancho de la franja, porque una decisión de inventario o de renta cambia según si el margen de error cabe o no en el presupuesto. ' +
        'Cuidado con dos lecturas equivocadas del porcentaje explicado. Un valor alto dice que la recta describe bien los meses que ya ocurrieron, no que el patrón vaya a seguir. Y un valor bajo no siempre significa que la tendencia sea falsa: puede significar que el negocio es ruidoso mes a mes, que es exactamente lo que ves al subir la irregularidad sin cambiar el crecimiento real.'
      : '<strong>Business reading:</strong> with ' + intN(state.n) + ' months of history the line explains ' + pct1(fit.r2) + '% of the movement in sales and misses by ' + money(fit.se) + ' in a typical month. The forecast for month ' + intN(target) + ' is ' + money(fc) + ', but honestly it has to be handed over with a band ' + money(dh) + ' wide, which is ' + dec1(ratio) + ' times the band at the last month with data. ' +
        'Out of that comes the practical rule separating an analyst from a spreadsheet: the number the formula produces is the centre of a range, not a promise. A board asking for the one year forecast deserves to hear the width of the band as well, because an inventory or lease decision changes depending on whether the margin of error fits the budget. ' +
        'Beware two wrong readings of the share explained. A high value says the line describes the months that already happened, not that the pattern will continue. And a low value does not always mean the trend is false: it can mean the business is noisy month to month, which is exactly what you see when you raise the irregularity without changing the real growth.';
  }
  widgets.push(mount);
  mount();
}

/* ════════════════════════════════════════════════════════════════════════
   WIDGET 3 · the part of the movement that repeats every year
   ════════════════════════════════════════════════════════════════════════ */
function widgetSeasonal(A0, B0, swing0) {
  var host = document.createElement('div');
  host.className = 'section';
  document.getElementById('lessonBody').appendChild(host);
  var state = { view: 'obs', A: A0, B: B0, swing: swing0, q: 4, ahead: 3 };
  function mount() {
    var es = LANG === 'es';
    var MODES = [
      { id: 'obs',  es: 'Lo que se vendió', en: 'What was sold' },
      { id: 'des',  es: 'Sin estacionalidad', en: 'With the season removed' }
    ];
    var tabs = MODES.map(function(m) {
      return '<button class="mtab' + (m.id === state.view ? ' active' : '') + '" data-m="' + m.id + '">' + m[LANG] + '</button>';
    }).join('');
    host.innerHTML =
      '<div class="gcrd" data-widget="indice-estacional-y-serie-desestacionalizada">' +
        '<div class="iw-head"><span class="iw-tag">' + (es ? 'Herramienta' : 'Tool') + '</span>' +
        '<span class="iw-title">' + (es ? 'Un trimestre solo se compara contra sí mismo' : 'A quarter can only be compared against itself') + '</span></div>' +
        '<div class="iw-sub">' + (es
          ? 'Una papelería vende mucho más cuando empieza el ciclo escolar y muy poco en el trimestre siguiente, año tras año. La primera pestaña muestra la serie tal como llega al reporte, con sus dientes de sierra; la segunda le quita a cada trimestre su parte estacional y deja ver el movimiento de fondo. Elige un trimestre y observa su índice: arriba de uno significa que ese trimestre siempre corre por encima del nivel del año, abajo de uno que siempre corre por debajo. Sube el tamaño del vaivén y verás algo incómodo: en la serie observada el negocio parece caer y recuperarse cuatro veces al año, mientras la serie desestacionalizada sigue subiendo sin sobresaltos. Las dos son el mismo negocio.'
          : 'A stationery shop sells far more when the school year opens and very little the quarter after, year after year. The first tab shows the series as it reaches the report, with its saw teeth; the second removes from each quarter its seasonal part and lets the underlying movement show. Pick a quarter and look at its index: above one means that quarter always runs above the level of the year, below one that it always runs below. Raise the size of the swing and you will see something uncomfortable: in the observed series the business seems to collapse and recover four times a year, while the deseasonalized series keeps climbing without drama. Both are the same business.') + '</div>' +
        '<div class="mtabs">' + tabs + '</div>' +
        '<div class="cgrid"><div class="cg">' +
          '<label>' + (es ? 'Trimestre que estás mirando' : 'Quarter you are looking at') + ': <span class="cval" id="f3ql"></span></label>' +
          '<input type="range" min="1" max="4" step="1" id="f3q" value="' + state.q + '">' +
        '</div><div class="cg">' +
          '<label>' + (es ? 'Trimestres hacia adelante' : 'Quarters ahead') + ': <span class="cval" id="f3al"></span></label>' +
          '<input type="range" min="1" max="8" step="1" id="f3a" value="' + state.ahead + '">' +
        '</div></div>' +
        '<div class="cgrid"><div class="cg">' +
          '<label>' + (es ? 'Tamaño del vaivén estacional' : 'Size of the seasonal swing') + ': <span class="cval" id="f3sl"></span></label>' +
          '<input type="range" min="0" max="45" step="5" id="f3s" value="' + state.swing + '">' +
        '</div><div class="cg">' +
          '<label>' + (es ? 'Crecimiento de fondo por trimestre' : 'Underlying growth per quarter') + ': <span class="cval" id="f3bl"></span></label>' +
          '<input type="range" min="0" max="90000" step="5000" id="f3b" value="' + state.B + '">' +
        '</div></div>' +
        '<canvas class="iw-canvas" id="f3cv"></canvas>' +
        '<div class="dlist" id="f3steps"></div>' +
        '<div class="metrics">' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Índice del trimestre' : 'Index of the quarter') + '</div><div class="mnum ps" id="f3ix"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Última venta de ese trimestre' : 'Latest sales of that quarter') + '</div><div class="mnum ts" id="f3ob"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Esa venta sin estacionalidad' : 'That figure without the season') + '</div><div class="mnum cs" id="f3de"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Tendencia en el trimestre futuro' : 'Trend at the future quarter') + '</div><div class="mnum ts" id="f3tr"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Pronóstico con estacionalidad' : 'Forecast with the season put back') + '</div><div class="mnum cs" id="f3fc"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Caída aparente contra el trimestre previo' : 'Apparent drop against the previous quarter') + '</div><div class="mnum ps" id="f3dp"></div></div>' +
        '</div>' +
        '<div class="iw-read" id="f3read"></div>' +
      '</div>';
    host.querySelectorAll('.mtab').forEach(function(b) {
      b.addEventListener('click', function() {
        state.view = b.getAttribute('data-m');
        host.querySelectorAll('.mtab').forEach(function(x) { x.classList.remove('active'); });
        b.classList.add('active');
        update();
      });
    });
    host.querySelector('#f3q').addEventListener('input', function() { state.q = parseInt(this.value, 10); update(); });
    host.querySelector('#f3a').addEventListener('input', function() { state.ahead = parseInt(this.value, 10); update(); });
    host.querySelector('#f3s').addEventListener('input', function() { state.swing = parseInt(this.value, 10); update(); });
    host.querySelector('#f3b').addEventListener('input', function() { state.B = parseInt(this.value, 10); update(); });
    update();
  }
  function update() {
    var es = LANG === 'es';
    var n = 12, i;
    var sw = state.swing / 100;
    /* the four seasons of the year, always averaging one */
    var shape = [-0.55, -1, 0.45, 1.1];
    var idx = shape.map(function(s) { return 1 + sw * s; });
    var tot = idx.reduce(function(p, c) { return p + c; }, 0);
    idx = idx.map(function(v) { return v * 4 / tot; });
    var pts = [], des = [];
    for (i = 1; i <= n; i++) {
      var k = (i - 1) % 4;
      var tv = state.A + state.B * i;
      pts.push({ x: i, y: tv * idx[k] });
      des.push({ x: i, y: tv });
    }
    var fit = fitLine(pts);
    var qi   = idx[state.q - 1];
    var last = state.q + 8;                    /* the chosen quarter, third year */
    var obs  = pts[last - 1].y;
    var dese = deseasonalize(obs, qi);
    var future = n + state.ahead;
    var fk = (future - 1) % 4;
    var trendFuture = trendAt(fit, future);
    var fc = reseasonalize(trendFuture, idx[fk]);
    var prev = pts[last - 2] ? pts[last - 2].y : obs;
    var drop = obs - prev;
    host.querySelector('#f3ql').textContent = (es ? 'T' : 'Q') + state.q;
    host.querySelector('#f3al').textContent = intN(state.ahead);
    host.querySelector('#f3sl').textContent = intN(state.swing) + '%';
    host.querySelector('#f3bl').textContent = money(state.B);
    host.querySelector('#f3ix').textContent = dec3(qi);
    host.querySelector('#f3ob').textContent = money(obs);
    host.querySelector('#f3de').textContent = money(dese);
    host.querySelector('#f3tr').textContent = money(trendFuture);
    host.querySelector('#f3fc').textContent = money(fc);
    host.querySelector('#f3dp').textContent = money(drop);
    host.querySelector('#f3steps').textContent = es
      ? 'Se compara cada trimestre contra la tendencia que le tocaba y se promedian esas razones por trimestre  ·  ' +
        'los cuatro índices se reescalan para que promedien exactamente uno  ·  ' +
        'dividir una venta entre su índice la deja desestacionalizada, comparable con cualquier otra  ·  ' +
        'multiplicar la tendencia futura por el índice del trimestre devuelve el pronóstico en pesos de calendario'
      : 'Each quarter is compared against the trend it was due and those ratios are averaged by quarter  ·  ' +
        'the four indices are rescaled so they average exactly one  ·  ' +
        'dividing a figure by its index leaves it deseasonalized, comparable with any other  ·  ' +
        'multiplying the future trend by the index of that quarter returns the forecast in calendar pesos';
    var g = fitCanvas(host.querySelector('#f3cv'), 190);
    var showObs = state.view === 'obs';
    drawTrendChart(g, 1, future + 1, {
      points: (showObs ? pts : des).map(function(p) {
        return { x: p.x, y: p.y, kind: 'dark', big: showObs && p.x === last };
      }),
      lines: [
        { f: function(x) { return trendAt(fit, x); }, kind: 'green', label: (es ? 'Tendencia' : 'Trend') },
        showObs
          ? { f: function(x) { var kk = (Math.round(x) - 1) % 4; return trendAt(fit, x) * idx[(kk + 4) % 4]; },
              kind: 'gold', thin: true, dash: true, label: (es ? 'Con estacionalidad' : 'With the season') }
          : { f: function(x) { return state.A + state.B * x; }, kind: 'gold', thin: true, dash: true,
              label: (es ? 'Nivel de fondo' : 'Underlying level') }
      ],
      band: { from: n + 0.5, to: future + 1, label: (es ? 'sin datos' : 'no data') },
      marks: [{ x: future, y: showObs ? fc : trendFuture, label: money(showObs ? fc : trendFuture), kind: 'gold' }],
      fmtY: function(v) { return money(v); },
      fmtX: function(v) { return (es ? 'trim ' : 'qtr ') + intN(v); },
      xLabel: (es ? 'trimestres' : 'quarters')
    });
    host.querySelector('#f3read').innerHTML = es
      ? '<strong>Lectura de negocio:</strong> el trimestre ' + (es ? 'T' : 'Q') + state.q + ' tiene un índice de ' + dec3(qi) + ', es decir que corre ' + pct1(Math.abs(qi - 1)) + '% ' + (qi >= 1 ? 'arriba' : 'abajo') + ' del nivel del año. Su última cifra observada fue ' + money(obs) + ', que sin estacionalidad equivale a ' + money(dese) + '. Contra el trimestre anterior el reporte muestra un cambio de ' + money(drop) + ', y esa cifra no dice nada por sí sola mientras los dos trimestres tengan índices distintos. ' +
        'Aquí está el error de gestión que este tema previene. Comparar un trimestre contra el inmediato anterior mezcla dos cosas: el crecimiento del negocio y el calendario. Un gerente que celebra el trimestre escolar o que despide gente después de él está reaccionando al calendario. Hay dos maneras correctas de leer el reporte: comparar cada trimestre contra el mismo trimestre del año pasado, o desestacionalizar y comparar contra lo que sea. ' +
        'Y para pronosticar el orden importa: primero se proyecta la tendencia hasta el trimestre que interesa y después se le devuelve el índice, no al revés. El pronóstico de ' + money(fc) + ' que ves arriba es tendencia por índice, y ese es el número que sirve para comprar inventario.'
      : '<strong>Business reading:</strong> quarter Q' + state.q + ' carries an index of ' + dec3(qi) + ', meaning it runs ' + pct1(Math.abs(qi - 1)) + '% ' + (qi >= 1 ? 'above' : 'below') + ' the level of the year. Its latest observed figure was ' + money(obs) + ', which without the season is worth ' + money(dese) + '. Against the previous quarter the report shows a change of ' + money(drop) + ', and that figure says nothing on its own while the two quarters carry different indices. ' +
        'Here is the management error this topic prevents. Comparing a quarter against the one immediately before mixes two things: the growth of the business and the calendar. A manager who celebrates the school quarter or lays people off after it is reacting to the calendar. There are two correct ways to read the report: compare each quarter against the same quarter a year earlier, or deseasonalize and compare against anything. ' +
        'And for forecasting the order matters: first project the trend out to the quarter of interest and only then give it its index back, never the other way round. The forecast of ' + money(fc) + ' you see above is trend times index, and that is the number worth buying inventory on.';
  }
  widgets.push(mount);
  mount();
}

function widgetGrowthShape(v0, g0) {

  function mount() {

          : 'Two businesses start alike and grow alike in the first year. One adds the same number of pesos every year; the other adds the same percentage every year, so its increase in pesos is larger each time. At first they are hard to tell apart, and that is the problem: with three or four years of data a straight line seems to describe both well. Stretch the horizon and watch them separate. Then drop the rate to a modest value and stretch again: the separation takes longer to show but shows up all the same, because it does not depend on the size of the rate but on the shape of the growth.') + '</div>' +
        '<div class="mtabs">' + tabs + '</div>' +
        '<div class="cgrid"><div class="cg">' +
          '<label>' + (es ? 'Crecimiento anual en porcentaje' : 'Annual growth in percent') + ': <span class="cval" id="f4gl"></span></label>' +
          '<input type="range" min="3" max="40" step="1" id="f4g" value="' + Math.round(state.g * 100) + '">' +
        '</div><div class="cg">' +
          '<label>' + (es ? 'Años hacia adelante' : 'Years ahead') + ': <span class="cval" id="f4yl"></span></label>' +
          '<input type="range" min="2" max="20" step="1" id="f4y" value="' + state.years + '">' +
        '</div></div>' +
        '<div class="cgrid"><div class="cg">' +
          '<label>' + (es ? 'Ventas del año de arranque' : 'Sales in the starting year') + ': <span class="cval" id="f4vl"></span></label>' +
          '<input type="range" min="500000" max="6000000" step="100000" id="f4v" value="' + state.v0 + '">' +
        '</div><div class="cg">' +
          '<label>' + (es ? 'Comparar el año' : 'Compare year') + ': <span class="cval" id="f4y2l"></span></label>' +
          '<input type="range" min="2" max="20" step="1" id="f4y2" value="' + state.years + '">' +
        '</div></div>' +
        '<canvas class="iw-canvas" id="f4cv"></canvas>' +
        '<div class="dlist" id="f4steps"></div>' +
        '<div class="metrics">' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Con crecimiento porcentual' : 'Under percentage growth') + '</div><div class="mnum cs" id="f4gp"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Con la recta del primer año' : 'Under the first year line') + '</div><div class="mnum ps" id="f4ln"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Diferencia entre ambas' : 'Difference between them') + '</div><div class="mnum ts" id="f4gap"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'La recta se queda corta en' : 'The line falls short by') + '</div><div class="mnum ts" id="f4pct"></div></div>' +

          '<div class="metric"><div class="mlbl">' + (es ? 'Aumento del último año' : 'Increase in the last year') + '</div><div class="mnum ps" id="f4inc"></div></div>' +

        '<div class="iw-read" id="f4read"></div>' +
      '</div>';
    host.querySelectorAll('.mtab').forEach(function(b) {
      b.addEventListener('click', function() {
        state.view = b.getAttribute('data-m');

        b.classList.add('active');
        update();
      });
    });
    host.querySelector('#f4g').addEventListener('input', function() { state.g = parseInt(this.value, 10) / 100; update(); });
    host.querySelector('#f4y').addEventListener('input', function() {

      host.querySelector('#f4y2').value = state.years;

      host.querySelector('#f4y').value = state.years;
      update();

  }
  function update() {
    var es = LANG === 'es';
    var v0 = state.v0, g = state.g, Y = state.years;
    var step = v0 * g;                        /* the pesos the first year added */
    function geo(x) { return growAt(v0, g, x); }
    function lin(x) { return v0 + step * x; }
    var vg = geo(Y), vl = lin(Y);
    var gap = vg - vl;
    var shortfall = vg > 0 ? gap / vg : 0;
    var dbl = doublingPeriods(g);
    var inc = geo(Y) - geo(Y - 1);

    host.querySelector('#f4db').textContent  = dec1(dbl);
    host.querySelector('#f4inc').textContent = money(inc);

      ? 'Los dos negocios arrancan en ' + money(v0) + ' y el primer año los dos suman ' + money(step) + '  ·  ' +
