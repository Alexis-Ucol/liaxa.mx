  /* ══════════════════ CONCEPTO 3 ══════════════════ */
  addSection(L({ es:'Concepto 3', en:'Concept 3' }), L({ es:'Dos carreras: armas y cohetes', en:'Two races: weapons and rockets' }),
    L({ es:'<p>Si no podían combatir de frente, había que demostrar la superioridad de otro modo. De ahí salieron las dos carreras que marcaron el periodo. La primera fue la carrera armamentista: cada avance de un lado obligaba al otro a responder, y los arsenales pasaron de unas pocas bombas a decenas de miles de ojivas capaces de destruir varias veces todo lo construido por la humanidad.</p>' +
              '<p>La segunda fue la carrera espacial. En 1957 la Unión Soviética puso en órbita el primer satélite artificial; en 1961 envió al primer ser humano al espacio; en 1969 Estados Unidos llevó una misión tripulada a la Luna. Cada hito se anunciaba al mundo como prueba de que un modelo de sociedad producía mejores científicos, mejores escuelas y mejor tecnología que el otro.</p>' +
              '<p>Las dos carreras costaron cantidades gigantescas de dinero durante décadas, y ese dinero salió de algún lado: de impuestos, de deuda y de lo que se dejó de invertir en vivienda, salud o consumo. También dejaron herencias que usamos a diario, como los satélites de comunicaciones y de navegación, los avances en computación y las primeras redes que conectaron computadoras a distancia. Y dejaron algo más: el miedo compartido que empujó a firmar los primeros tratados para limitar las pruebas y el número de armas nucleares.</p>',
          en:'<p>If they could not fight face to face, superiority had to be shown some other way. From that came the two races that marked the period. The first was the arms race: every advance by one side forced the other to answer, and the arsenals went from a few bombs to tens of thousands of warheads able to destroy everything humanity had built several times over.</p>' +
              '<p>The second was the space race. In 1957 the Soviet Union put the first artificial satellite into orbit; in 1961 it sent the first human being into space; in 1969 the United States landed a crewed mission on the Moon. Every milestone was announced to the world as proof that one model of society produced better scientists, better schools and better technology than the other.</p>' +
              '<p>Both races cost gigantic amounts of money over decades, and that money came from somewhere: from taxes, from debt and from what was no longer invested in housing, health or consumer goods. They also left legacies we use daily, such as communication and navigation satellites, advances in computing and the first networks that connected computers at a distance. And they left something else: the shared fear that pushed the first treaties to limit tests and the number of nuclear weapons.</p>' }) +
    '<table class="dtable"><tr><th>' + L({ es:'Año', en:'Year' }) + '</th><th>' + L({ es:'Hito', en:'Milestone' }) + '</th><th>' + L({ es:'Lo que se quiso demostrar', en:'What it was meant to prove' }) + '</th></tr>' +
      '<tr><td>1957</td><td>' + L({ es:'Primer satélite artificial en órbita', en:'First artificial satellite in orbit' }) + '</td><td>' + L({ es:'Que un cohete soviético podía alcanzar cualquier punto del planeta', en:'That a Soviet rocket could reach any point on the planet' }) + '</td></tr>' +
      '<tr><td>1961</td><td>' + L({ es:'Primer ser humano en el espacio', en:'First human being in space' }) + '</td><td>' + L({ es:'Que la ciencia del bloque oriental iba por delante', en:'That the science of the eastern bloc was ahead' }) + '</td></tr>' +
      '<tr><td>1963</td><td>' + L({ es:'Primer tratado que prohíbe pruebas nucleares en la atmósfera', en:'First treaty banning nuclear tests in the atmosphere' }) + '</td><td>' + L({ es:'Que el miedo mutuo también podía producir acuerdos', en:'That mutual fear could also produce agreements' }) + '</td></tr>' +
      '<tr><td>1969</td><td>' + L({ es:'Primera misión tripulada que llega a la Luna', en:'First crewed mission to reach the Moon' }) + '</td><td>' + L({ es:'Que el bloque occidental había recuperado la delantera', en:'That the western bloc had taken back the lead' }) + '</td></tr></table>' +
    '<div class="mzone" id="mzB"></div>');
  mB_render();

  /* ── graded 5 ── */
  var p5v = [
    { q:{ es:'Entre 1949 y 1986 el número de armas nucleares en el mundo pasó de unas pocas decenas a más de sesenta mil. Ninguna de esas armas se utilizó en un conflicto durante todo el periodo. ¿Cómo se explica mejor esa acumulación que nunca se empleó?',
          en:'Between 1949 and 1986 the number of nuclear weapons in the world went from a few dozen to more than sixty thousand. None of those weapons was used in a conflict during the whole period. How is that accumulation that was never used best explained?' },
      o:{ es:['Cada bloque acumulaba para asegurar que podría responder a un ataque, y precisamente esa certeza de respuesta hizo que atacar dejara de tener sentido.',
              'Las armas no se usaron porque ninguno de los dos bloques llegó a desarrollar la tecnología necesaria para lanzarlas.',
              'Un tratado firmado en 1949 prohibía por completo el uso de esas armas y ambos bloques lo respetaron.',
              'Las armas se acumularon como reserva económica, sin ninguna relación con la estrategia militar.'],
          en:['Each bloc accumulated to make sure it could answer an attack, and precisely that certainty of an answer made attacking pointless.',
              'The weapons were not used because neither bloc managed to develop the technology needed to launch them.',
              'A treaty signed in 1949 completely banned the use of those weapons and both blocs respected it.',
              'The weapons were accumulated as an economic reserve, with no relation to military strategy.'] }, c:0,
      h:{ es:'Piensa qué le ocurre a quien dispara primero cuando sabe con certeza que el otro conserva armas suficientes para responder.',
          en:'Think about what happens to whoever shoots first when they know for certain that the other keeps enough weapons to answer.' },
      e:{ es:'A esa situación se le llamó disuasión: se acumulan armas no para usarlas, sino para que el otro no las use. Funcionó en el sentido de que no hubo guerra directa, pero tuvo dos costos enormes. Uno fue económico, porque mantener y renovar esos arsenales consumió presupuestos durante cuarenta años. El otro fue el riesgo permanente de que un error de lectura o una falla técnica desatara lo que nadie quería, algo que estuvo cerca de ocurrir en más de una ocasión.',
          en:'That situation was called deterrence: weapons are accumulated not to be used, but so that the other side does not use them. It worked in the sense that there was no direct war, but it carried two enormous costs. One was economic, because maintaining and renewing those arsenals consumed budgets for forty years. The other was the permanent risk that a misreading or a technical failure would unleash what nobody wanted, something that came close to happening on more than one occasion.' } },
    { q:{ es:'Después de la crisis de los misiles de 1962, los dos gobiernos instalaron una línea de comunicación directa y firmaron en 1963 un tratado que prohibía las pruebas nucleares en la atmósfera. ¿Qué explica que dos gobiernos enfrentados llegaran a esos acuerdos?',
          en:'After the missile crisis of 1962, both governments installed a direct communication line and in 1963 signed a treaty banning nuclear tests in the atmosphere. What explains two opposing governments reaching those agreements?' },
      o:{ es:['Haber estado a punto de una catástrofe que ninguno deseaba les mostró que el riesgo compartido era mayor que la ventaja que cada uno buscaba.',
              'Los dos gobiernos habían abandonado sus diferencias políticas y económicas y pasaron a ser aliados.',
              'Un organismo internacional los obligó a firmar bajo amenaza de sanciones militares.',
              'Los dos habían agotado por completo sus arsenales nucleares durante la crisis.'],
          en:['Having come close to a catastrophe neither wanted showed them that the shared risk was greater than the advantage each was seeking.',
              'Both governments had abandoned their political and economic differences and became allies.',
              'An international body forced them to sign under threat of military sanctions.',
              'Both had completely used up their nuclear arsenals during the crisis.'] }, c:0,
      h:{ es:'Los acuerdos no siempre nacen de la confianza. A veces nacen de haber visto de cerca lo que ninguna de las dos partes quería.',
          en:'Agreements do not always come from trust. Sometimes they come from having seen up close what neither side wanted.' },
      e:{ es:'Los primeros acuerdos de limitación no significaron amistad ni fin de la rivalidad: los arsenales siguieron creciendo durante años. Lo que cambió fue el reconocimiento de un interés común, el de evitar una catástrofe que no distinguiría bloques. De ahí salieron la línea directa entre los dos gobiernos, el tratado de 1963 y, más adelante, los acuerdos de no proliferación y de limitación de armas estratégicas.',
          en:'The first limitation agreements did not mean friendship or the end of the rivalry: the arsenals kept growing for years. What changed was the recognition of a common interest, that of avoiding a catastrophe that would not distinguish between blocs. From there came the direct line between the two governments, the 1963 treaty and, later, the non proliferation and strategic arms limitation agreements.' } }
  ];

  addProblem({ title:L({ es:'Armas que no se dispararon', en:'Weapons that were never fired' }), questionText:L(v5.q), options:L(v5.o), correct:v5.c, hint:L(v5.h), explanation:L(v5.e) }, rng);

  /* ── graded 6 ── */
  var p6v = [
    { q:{ es:'Cuando en 1957 un satélite soviético empezó a girar alrededor de la Tierra, el gobierno estadounidense reaccionó creando una agencia espacial, aumentando el presupuesto científico y reformando la enseñanza de matemáticas y ciencias en sus escuelas. ¿Qué muestra esa reacción sobre la carrera espacial?',
          en:'When in 1957 a Soviet satellite began circling the Earth, the American government reacted by creating a space agency, raising the science budget and reforming the teaching of mathematics and science in its schools. What does that reaction show about the space race?' },
      o:{ es:['Que la competencia no era solo técnica: cada logro se leía como prueba de que un modelo de sociedad entero funcionaba mejor, y obligaba al rival a responder incluso en sus aulas.',
              'Que el gobierno estadounidense buscaba únicamente entretener a su población con noticias espectaculares.',
              'Que los dos países habían acordado repartirse la exploración del espacio en zonas separadas.',
              'Que la exploración espacial no tenía ninguna relación con la rivalidad entre los bloques.'],
          en:['That the competition was not only technical: every achievement was read as proof that an entire model of society worked better, and it forced the rival to answer even in its classrooms.',
              'That the American government only wanted to entertain its population with spectacular news.',
              'That both countries had agreed to divide space exploration into separate zones.',
              'That space exploration had no relation to the rivalry between the blocs.'] }, c:0,
      h:{ es:'Fíjate en dónde reaccionó ese gobierno: no solo en sus laboratorios, también en sus escuelas. Pregúntate qué estaba en juego.',
          en:'Look at where that government reacted: not only in its laboratories, but also in its schools. Ask yourself what was at stake.' },
      e:{ es:'El satélite era pequeño y solo emitía una señal, pero significaba que un cohete soviético podía alcanzar cualquier punto del planeta y que el bloque oriental había llegado primero. La respuesta fue tan política como técnica: una agencia espacial, más dinero para universidades y una reforma educativa. La competencia por el prestigio movió presupuestos, cambió planes de estudio y aceleró la investigación en electrónica y computación.',
          en:'The satellite was small and only emitted a signal, but it meant that a Soviet rocket could reach any point on the planet and that the eastern bloc had arrived first. The answer was as political as it was technical: a space agency, more money for universities and an education reform. The competition for prestige moved budgets, changed curricula and accelerated research in electronics and computing.' } },
    { q:{ es:'Los satélites que hoy permiten ver un mapa en un teléfono, las redes que conectaron por primera vez computadoras a distancia y buena parte de la miniaturización electrónica nacieron de programas financiados durante la rivalidad entre los bloques. ¿Qué idea sobre la relación entre conflicto y tecnología sostiene mejor este hecho?',
          en:'The satellites that today let a phone show a map, the networks that first connected computers at a distance and much of electronic miniaturization were born from programmes funded during the rivalry between the blocs. Which idea about the relation between conflict and technology does this fact best support?' },
      o:{ es:['Que una tecnología puede nacer de una finalidad militar o de prestigio y terminar con usos civiles cotidianos muy distintos de los originales.',
              'Que toda tecnología útil solo puede desarrollarse durante una guerra o una rivalidad entre potencias.',
              'Que esos aparatos se desarrollaron sin ninguna relación con el financiamiento de los gobiernos.',
              'Que las dos superpotencias crearon esas tecnologías con el propósito explícito de mejorar la vida diaria de la población mundial.'],
          en:['That a technology can be born from a military or prestige purpose and end up with everyday civilian uses very different from the original ones.',
              'That every useful technology can only be developed during a war or a rivalry between powers.',
              'That those devices were developed with no relation to government funding.',
              'That the two superpowers created those technologies with the explicit purpose of improving the daily life of the world population.'] }, c:0,
      h:{ es:'Distingue el propósito con el que se financió algo del uso que terminó teniendo décadas después.',
          en:'Distinguish the purpose for which something was funded from the use it ended up having decades later.' },
      e:{ es:'Los satélites de navegación se pensaron para guiar submarinos y misiles; la red que dio origen a internet se diseñó para que la comunicación entre centros de investigación resistiera un ataque; la miniaturización se buscó para que los sistemas cupieran en un cohete. Nada de eso se hizo pensando en la vida cotidiana. Reconocerlo no convierte al conflicto en algo deseable: muestra que el destino de una tecnología depende también de quién la usa después y para qué.',
          en:'Navigation satellites were conceived to guide submarines and missiles; the network that gave rise to the internet was designed so that communication between research centres would survive an attack; miniaturization was pursued so that systems would fit inside a rocket. None of that was done with daily life in mind. Recognizing it does not make conflict desirable: it shows that the fate of a technology also depends on who uses it afterwards and for what.' } }

  /* ══════════════════ CONCEPTO 4 ══════════════════ */
  addSection(L({ es:'Concepto 4', en:'Concept 4' }), L({ es:'El sur del mundo: no alinearse y América Latina', en:'The global south: refusing to align, and Latin America' }),
    L({ es:'<p>No todos aceptaron el reparto. En 1955, en la ciudad indonesia de Bandung, se reunieron delegaciones de veintinueve países de Asia y África, muchos de ellos independizados hacía muy poco. Ahí se formuló una idea que en 1961 dio origen al movimiento de países no alineados: acababan de librarse de un imperio y no querían entrar en una alianza militar que los subordinara de nuevo.</p>' +
              '<p>No alinearse no significaba aislarse ni permanecer indiferente. Significaba comerciar con los dos bloques, negarse a instalar bases militares extranjeras, coordinar posiciones comunes en los organismos internacionales y reclamar precios justos por las materias primas. Fue una postura difícil de sostener: la presión de los bloques llegó de todas formas, con créditos condicionados, asesores militares y apoyo a bandos internos.</p>' +
              '<p>En América Latina la rivalidad se sintió de cerca. El triunfo de la Revolución Cubana en 1959 y su acercamiento posterior a la Unión Soviética hicieron que la región pasara a ocupar un lugar central en los cálculos del bloque occidental. Llegaron programas de ayuda económica, pero también la llamada doctrina de la seguridad nacional, que presentaba a la oposición interna como enemigo a combatir. Varios países vivieron golpes de Estado y gobiernos militares que persiguieron a opositores. El gobierno mexicano, por su parte, mantuvo relaciones con Cuba cuando la mayoría de la región las rompió, apelando al principio de no intervención, mientras dentro del país aplicaba también una política dura contra los movimientos opositores.</p>',
          en:'<p>Not everyone accepted the split. In 1955, in the Indonesian city of Bandung, delegations from twenty nine countries of Asia and Africa met, many of them independent only very recently. There an idea was formulated that in 1961 gave rise to the non aligned movement: they had just freed themselves from an empire and did not want to enter a military alliance that would subordinate them again.</p>' +
              '<p>Not aligning did not mean isolating themselves or staying indifferent. It meant trading with both blocs, refusing to host foreign military bases, coordinating common positions in international bodies and demanding fair prices for raw materials. It was a hard position to sustain: pressure from the blocs arrived anyway, with conditional loans, military advisers and support for internal sides.</p>' +
              '<p>In Latin America the rivalry was felt at close range. The triumph of the Cuban Revolution in 1959 and its later closeness to the Soviet Union made the region move to a central place in the calculations of the western bloc. Economic aid programmes arrived, but so did the so called national security doctrine, which presented internal opposition as an enemy to be fought. Several countries lived through coups and military governments that persecuted opponents. The Mexican government, for its part, kept relations with Cuba when most of the region broke them, appealing to the principle of non intervention, while inside the country it also applied a hard policy against opposition movements.</p>' }) +
    '<div class="srcbox">' + L({ es:'"No queremos formar parte de ningún bloque militar. Queremos la paz y la libertad de decidir nuestro propio camino."', en:'"We do not want to be part of any military bloc. We want peace and the freedom to decide our own path."' }) +
      '<span class="srcref">' + L({ es:'Idea central expresada en las conferencias de países no alineados entre 1955 y 1961.', en:'Central idea expressed at the conferences of non aligned countries between 1955 and 1961.' }) + '</span></div>' +
    '<div class="mzone" id="mzD"></div>');
  mD_render();

  var p7v = [
    { q:{ es:'Un país no alineado de la década de 1960 vendía sus minerales a empresas del bloque occidental, compraba maquinaria agrícola al bloque oriental y votaba en los organismos internacionales según cada tema, sin seguir siempre a un mismo grupo. Un observador de la época lo acusó de no tener principios. ¿Qué respuesta defiende mejor esa política?',
          en:'A non aligned country in the 1960s sold its minerals to firms of the western bloc, bought agricultural machinery from the eastern bloc and voted in international bodies issue by issue, without always following the same group. An observer of the time accused it of having no principles. What answer best defends that policy?' },
      o:{ es:['Mantener relaciones con los dos bloques y decidir tema por tema era justamente la forma de conservar la capacidad de decidir que acababa de conquistar.',
              'El país actuaba sin ninguna orientación y cambiaba de postura al azar en cada votación.',
              'Se trataba de una estrategia para ingresar en secreto a la alianza militar del bloque oriental.',

          en:['Keeping relations with both blocs and deciding issue by issue was precisely the way to preserve the capacity to decide that it had just won.',

              'The foreign policy of that country was defined directly by the foreign mining firms.'] }, c:0,
      h:{ es:'Pregúntate qué habría significado para un país recién independizado firmar una alianza militar permanente con una superpotencia.',
          en:'Ask yourself what signing a permanent military alliance with a superpower would have meant for a newly independent country.' },
      e:{ es:'El no alineamiento no era falta de principios, sino un principio en sí mismo: después de décadas de dominio colonial, esos gobiernos consideraban que entrar en una alianza militar equivalía a cambiar de amo. Comerciar con los dos lados y votar según el tema les daba margen de maniobra. La dificultad fue real: la presión económica y militar de los bloques llegó igual, y varios de esos países terminaron atrapados en conflictos que no habían buscado.',
          en:'Non alignment was not a lack of principles but a principle in itself: after decades of colonial rule, those governments considered that joining a military alliance amounted to changing masters. Trading with both sides and voting issue by issue gave them room to manoeuvre. The difficulty was real: economic and military pressure from the blocs arrived anyway, and several of those countries ended up caught in conflicts they had not sought.' } },
    { q:{ es:'La conferencia de Bandung de 1955 reunió a veintinueve países de Asia y África, la mayoría independizados en la década anterior, para acordar posiciones comunes frente a las dos superpotencias. ¿Por qué esa reunión se considera un momento importante en la historia mundial del siglo XX?',
          en:'The Bandung conference of 1955 brought together twenty nine countries of Asia and Africa, most of them independent in the previous decade, to agree on common positions towards the two superpowers. Why is that meeting considered an important moment in twentieth century world history?' },
      o:{ es:['Por primera vez un conjunto amplio de países del sur del mundo se organizó para hablar con voz propia en un orden internacional que se decidía en dos capitales.',
              'Porque en ella se firmó el tratado que puso fin de manera definitiva a la rivalidad entre los dos bloques.',
              'Porque en ella los países asistentes decidieron incorporarse en conjunto a la alianza militar occidental.',
              'Porque marcó el inicio de la colonización europea de Asia y África.'],
          en:['For the first time a broad group of countries of the global south organized to speak with its own voice in an international order decided in two capitals.',
              'Because the treaty that definitively ended the rivalry between the two blocs was signed there.',
              'Because the attending countries decided there to join the western military alliance together.',
              'Because it marked the beginning of the European colonization of Asia and Africa.'] }, c:0,
      h:{ es:'Piensa en quién tomaba las decisiones internacionales hasta ese momento y en qué cambia cuando decenas de países acuerdan una postura conjunta.',
          en:'Think about who took international decisions until that moment and about what changes when dozens of countries agree on a joint position.' },
      e:{ es:'Bandung no cambió el reparto de poder, pero sí el mapa de quién podía hablar. Países que veinte años antes eran colonias se sentaron a discutir de igual a igual la descolonización, el desarme y el trato económico injusto hacia los productores de materias primas. De ahí salió el movimiento de países no alineados, que en su mejor momento reunió a más de cien Estados y llevó esas demandas a los organismos internacionales.',
          en:'Bandung did not change the distribution of power, but it did change the map of who could speak. Countries that twenty years earlier were colonies sat down to discuss as equals decolonization, disarmament and the unfair economic treatment of raw material producers. From there came the non aligned movement, which at its peak brought together more than a hundred states and carried those demands to international bodies.' } }

  var p8v = [
    { q:{ es:'Después de 1959, el bloque occidental multiplicó en América Latina los programas de ayuda económica y, al mismo tiempo, el entrenamiento de fuerzas militares de la región. En varios países se instalaron gobiernos militares que presentaban a la oposición interna como enemigo interior. ¿Qué explica mejor esa doble política?',
          en:'After 1959 the western bloc multiplied its economic aid programmes in Latin America and, at the same time, the training of the military forces of the region. In several countries military governments were installed that presented internal opposition as an enemy within. What best explains that double policy?' },

          en:'Look at the date on which both measures multiply and at what had just happened in the region.' },
      e:{ es:'La Revolución Cubana convirtió a América Latina en una zona prioritaria para el bloque occidental. La respuesta combinó ayuda económica para reducir el descontento social con apoyo y entrenamiento a las fuerzas armadas de la región. De ahí salió la doctrina de la seguridad nacional, que definía al opositor interno como enemigo. Sus consecuencias fueron muy graves: gobiernos militares, persecución de opositores y una huella profunda en la vida política de varios países durante décadas.',
          en:'The Cuban Revolution turned Latin America into a priority zone for the western bloc. The answer combined economic aid to reduce social discontent with support and training for the armed forces of the region. From there came the national security doctrine, which defined the internal opponent as an enemy. Its consequences were very serious: military governments, persecution of opponents and a deep mark on the political life of several countries for decades.' } },
    { q:{ es:'En 1962 varios gobiernos del continente americano rompieron relaciones con Cuba por presión del bloque occidental. El gobierno mexicano mantuvo las suyas y sostuvo públicamente el principio de no intervención en los asuntos internos de otros países. ¿Qué muestra esa decisión sobre el margen de acción de los países latinoamericanos durante la Guerra Fría?',
          en:'In 1962 several governments of the American continent broke relations with Cuba under pressure from the western bloc. The Mexican government kept its own and publicly upheld the principle of non intervention in the internal affairs of other countries. What does that decision show about the room for action of Latin American countries during the Cold War?' },
      o:{ es:['La presión de los bloques era fuerte, pero un gobierno podía sostener una política exterior propia si la fundaba en principios defendidos de manera pública y constante.',

              'The rivalry between the blocs had no effect at all on the countries of the American continent.',
              'Mexico joined the bloc led by the Soviet Union at that moment.',

          en:'Distinguish between being under pressure and being obliged, and look at the argument with which that government sustained its decision.' },
      e:{ es:'Mantener relaciones con la isla y apelar a la no intervención mostró que existía margen, aunque estrecho, para una posición propia sostenida con argumentos jurídicos. Conviene ver el cuadro completo: ese mismo gobierno aplicó dentro del país una política dura contra los movimientos opositores, en el marco del anticomunismo de la época. Una política exterior autónoma y una política interior restrictiva convivieron durante años.',
          en:'Keeping relations with the island and appealing to non intervention showed that room existed, however narrow, for a position of its own sustained with legal arguments. It is worth seeing the whole picture: that same government applied inside the country a hard policy against opposition movements, within the anticommunism of the period. An autonomous foreign policy and a restrictive domestic policy coexisted for years.' } }

  /* ══════════════════ CONCEPTO 5 ══════════════════ */
  addSection(L({ es:'Concepto 5', en:'Concept 5' }), L({ es:'Lo que quedó después de 1991', en:'What was left after 1991' }),
    L({ es:'<p>Entre 1989 y 1991 el orden bipolar se deshizo con una rapidez que casi nadie había previsto. Cayó el Muro de Berlín, los gobiernos del bloque oriental se derrumbaron uno tras otro, Alemania se reunificó y en diciembre de 1991 la Unión Soviética se disolvió en quince Estados independientes. Durante unos años, Estados Unidos quedó como única superpotencia.</p>' +
              '<p>Los efectos fueron inmediatos en muchos lugares. Varias guerras sostenidas por el apoyo de los bloques terminaron poco después, simplemente porque ese apoyo se retiró. Las economías planificadas se abrieron al mercado, con costos sociales muy altos para millones de personas. El comercio mundial se aceleró y la circulación de mercancías, capitales e información se extendió a regiones antes cerradas.</p>' +
              '<p>Pero la Guerra Fría no se llevó consigo todo lo que había producido. Corea sigue partida. La alianza militar occidental no solo se mantuvo, sino que incorporó países que habían pertenecido al bloque contrario. Los arsenales nucleares no desaparecieron. En varias regiones quedaron armas repartidas durante décadas y sociedades divididas por bandos que se habían armado con apoyo externo. Estudiar los efectos globales de la Guerra Fría es, en buena medida, aprender a reconocer esas huellas en el presente.</p>',
          en:'<p>Between 1989 and 1991 the bipolar order came apart with a speed almost nobody had foreseen. The Berlin Wall fell, the governments of the eastern bloc collapsed one after another, Germany was reunified and in December 1991 the Soviet Union dissolved into fifteen independent states. For a few years the United States was left as the only superpower.</p>' +
              '<p>The effects were immediate in many places. Several wars sustained by the support of the blocs ended shortly afterwards, simply because that support was withdrawn. Planned economies opened up to the market, with very high social costs for millions of people. World trade accelerated and the circulation of goods, capital and information spread to regions previously closed.</p>' +
              '<p>But the Cold War did not take with it everything it had produced. Korea is still split. The western military alliance was not only kept, it took in countries that had belonged to the rival bloc. Nuclear arsenals did not disappear. In several regions weapons handed out over decades were left behind, along with societies divided by sides that had armed themselves with outside support. Studying the global effects of the Cold War is, to a large extent, learning to recognize those traces in the present.</p>' }) +
    '<div class="callout"><p><strong>' + L({ es:'Para observar: ', en:'Something to notice: ' }) + '</strong>' + L({ es:'un proceso histórico no termina el día en que se firma su final. Termina cuando dejan de sentirse sus efectos, y algunos de los efectos de la Guerra Fría siguen operando en el mundo en el que vives.', en:'a historical process does not end on the day its ending is signed. It ends when its effects stop being felt, and some of the effects of the Cold War are still at work in the world you live in.' }) + '</p></div>' +
    '<div class="mzone" id="mzE"></div>');
  mE_render();

    { q:{ es:'Entre 1990 y 1994 terminaron o se redujeron de manera notable varios conflictos armados largos en América Central, África y el sudeste asiático. Muchos de ellos habían durado más de una década. ¿Qué relación con el final de la Guerra Fría explica mejor esa coincidencia?',
          en:'Between 1990 and 1994 several long armed conflicts in Central America, Africa and southeast Asia ended or were notably reduced. Many of them had lasted more than a decade. What relation with the end of the Cold War best explains that coincidence?' },

              'Los organismos internacionales enviaron ejércitos que impusieron la paz por la fuerza en todos esos países al mismo tiempo.',

          en:['With the rivalry gone, the sides stopped receiving the outside funding and weaponry that let them sustain the war, and negotiating became the only way out.',

      h:{ es:'Si un conflicto se alarga porque alguien lo financia, pregúntate qué ocurre el día en que ese financiamiento se acaba.',
          en:'If a conflict drags on because someone funds it, ask yourself what happens the day that funding runs out.' },
      e:{ es:'La misma causa que había prolongado esas guerras explica su final. Cuando el apoyo externo se retiró, los bandos ya no pudieron reponer lo que perdían y la negociación se volvió la salida realista. Entre 1990 y 1996 se firmaron acuerdos de paz en varios de esos países. Eso no borró los daños: quedaron economías destruidas, poblaciones desplazadas y armamento repartido que siguió circulando por años.',
          en:'The same cause that had prolonged those wars explains their end. When outside support was withdrawn, the sides could no longer replace what they lost and negotiation became the realistic way out. Between 1990 and 1996 peace agreements were signed in several of those countries. That did not erase the damage: destroyed economies, displaced populations and distributed weaponry that kept circulating for years were left behind.' } },
    { q:{ es:'En diciembre de 1991 la Unión Soviética se disolvió en quince Estados independientes y su rival quedó como única superpotencia. Algunas voces de la época anunciaron que empezaba una etapa sin grandes conflictos internacionales. ¿Cómo conviene evaluar hoy ese anuncio?',
          en:'In December 1991 the Soviet Union dissolved into fifteen independent states and its rival was left as the only superpower. Some voices of the time announced that an era without major international conflicts was beginning. How should that announcement be assessed today?' },
      o:{ es:['Fue una lectura apresurada: terminó una forma concreta de conflicto, pero enseguida aparecieron guerras y tensiones con otras causas, algunas heredadas del propio periodo bipolar.',
              'Fue una lectura acertada: desde 1991 no ha habido conflictos armados de importancia en ninguna región del mundo.',
              'Fue una lectura acertada, porque todos los arsenales nucleares se desmantelaron en los años siguientes.',
              'Fue una lectura equivocada porque el orden bipolar continuó funcionando exactamente igual después de 1991.'],
          en:['It was a hasty reading: one specific form of conflict ended, but wars and tensions with other causes soon appeared, some inherited from the bipolar period itself.',
              'It was an accurate reading: since 1991 there have been no significant armed conflicts in any region of the world.',
              'It was an accurate reading, because all nuclear arsenals were dismantled in the following years.',
              'It was a mistaken reading because the bipolar order went on working exactly the same after 1991.'] }, c:0,
      h:{ es:'Evalúa un pronóstico del pasado comparándolo con lo que efectivamente ocurrió después, no con lo que se esperaba entonces.',
          en:'Assess a forecast from the past by comparing it with what actually happened afterwards, not with what was expected at the time.' },
      e:{ es:'El fin del orden bipolar cerró una forma de conflicto, la que enfrentaba a dos bloques por el mundo entero, pero no cerró la conflictividad internacional. En los años siguientes hubo guerras en los Balcanes y en varias de las repúblicas surgidas de la disolución soviética, además de conflictos alimentados por el armamento y las divisiones dejadas por el periodo anterior. Evaluar aquel anuncio con lo que sabemos hoy es un ejercicio central del trabajo histórico.',
          en:'The end of the bipolar order closed one form of conflict, the one that set two blocs against each other across the whole world, but it did not close international conflict. In the following years there were wars in the Balkans and in several of the republics that emerged from the Soviet dissolution, as well as conflicts fed by the weaponry and the divisions left by the earlier period. Assessing that announcement with what we know today is a central exercise of historical work.' } }

  var p10v = [
    { q:{ es:'Tienes que sostener ante tu grupo que la Guerra Fría tuvo efectos globales y no solo europeos. Dispones de cuatro afirmaciones. ¿Cuál sirve mejor como argumento, por la evidencia que puede acompañarla?',
          en:'You have to argue before your class that the Cold War had global and not only European effects. You have four statements available. Which works best as an argument, because of the evidence that can accompany it?' },
      o:{ es:['En Asia, África y América hubo países partidos en dos, guerras prolongadas con armamento de los dos bloques y gobiernos cambiados por la fuerza con apoyo externo.',
              'Fue el conflicto más largo de la historia de la humanidad y por eso aparece en todos los libros de texto.',
              'Durante esas décadas no ocurrió en el mundo ningún otro proceso histórico de importancia.',

      h:{ es:'Un buen argumento histórico se sostiene con casos concretos que pueden verificarse, no con afirmaciones generales sobre la importancia del tema.',
          en:'A good historical argument stands on concrete cases that can be verified, not on general claims about how important the topic is.' },
      e:{ es:'La primera afirmación se puede respaldar caso por caso: Corea y Alemania partidas, Vietnam y Afganistán con guerras de años, Guatemala y Chile con gobiernos cambiados por la fuerza, Angola con apoyo externo a bandos contrarios. Las otras tres fallan por razones distintas: una apela a la extensión del tema en lugar de a la evidencia, otra niega hechos comprobados y la última afirma algo falso, porque las dos superpotencias nunca combatieron de manera directa entre ellas.',
          en:'The first statement can be backed case by case: Korea and Germany split, Vietnam and Afghanistan with wars lasting years, Guatemala and Chile with governments changed by force, Angola with outside support for opposing sides. The other three fail for different reasons: one appeals to how big the topic is instead of to evidence, another denies proven facts and the last one asserts something false, because the two superpowers never fought each other directly.' } },
    { q:{ es:'Dos fuentes describen la misma intervención militar de una superpotencia en un país lejano. Un documento oficial de esa superpotencia la presenta como una ayuda solicitada por un gobierno amigo. Un testimonio recogido entre la población del país afectado la describe como una ocupación no deseada. ¿Cómo conviene trabajar con dos fuentes así?',
          en:'Two sources describe the same military intervention by a superpower in a distant country. An official document of that superpower presents it as help requested by a friendly government. A testimony collected among the population of the affected country describes it as an unwanted occupation. How should two such sources be handled?' },
      o:{ es:['Conservar las dos, preguntarse quién habla en cada caso y para quién, y contrastarlas con otras evidencias antes de sacar conclusiones.',

          en:['Keep both, ask who is speaking in each case and for whom, and contrast them with other evidence before drawing conclusions.',

              'Keep only the testimony, because any document produced by a government has no historical value.',
              'Discard both and replace them with what most people think today about that event.'] }, c:0,
      h:{ es:'Pregúntate qué gana cada autor con su versión de los hechos y qué información aporta cada fuente que la otra no puede aportar.',
          en:'Ask yourself what each author gains from their version of events and what information each source provides that the other cannot.' },
      e:{ es:'Las dos fuentes son valiosas, pero por motivos distintos. El documento oficial revela cómo la superpotencia justificaba su intervención ante el mundo y ante su propia población; el testimonio revela cómo se vivió esa intervención en el terreno. Ninguna es neutral, y descartar una de ellas empobrece la explicación. El trabajo consiste en leerlas juntas, junto a otras evidencias como tratados, cifras y documentos de terceros países, y reconstruir a partir de ahí lo ocurrido.',
          en:'Both sources are valuable, but for different reasons. The official document reveals how the superpower justified its intervention before the world and before its own population; the testimony reveals how that intervention was lived on the ground. Neither is neutral, and discarding one of them impoverishes the explanation. The task is to read them together, alongside other evidence such as treaties, figures and documents from third countries, and to reconstruct from there what happened.' } }
  ];
  var v10 = pickVariant(p10v, rng);
  addProblem({ title:L({ es:'Sostener una afirmación con evidencia', en:'Supporting a claim with evidence' }), questionText:L(v10.q), options:L(v10.o), correct:v10.c, hint:L(v10.h), explanation:L(v10.e) }, rng);
}
</script>

<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbykkuJ_apGq3vALIFd4mr3acu81c7K4OKxW-DZ-i52Ceyl3lOanXMdvbS9SIXPrLQBm/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'Efectos Globales de la Guerra Fría';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
