<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prueba de Hipótesis para Proporciones · Estadística · Facultad de Economía, Universidad de Colima</title>
<link rel="canonical" href="https://liaxa.mx/facultad_economia/estadistica/est_hyp_prop.html">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS ── fallback only; applyBranding() re-injects from SCHOOL ── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;
  --gold-bg:    #faf3e0;
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; object-fit:contain; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; min-width:0; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── LANGUAGE TOGGLE ── */
.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }
.dlist { font-family:'IBM Plex Mono',monospace; font-size:.78rem; color:var(--green-dark); background:var(--surface2); border-radius:8px; padding:.6rem .7rem; margin:.6rem 0; word-break:break-word; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); overflow-x:auto; }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── INTERACTIVE WIDGETS ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.iw-head { display:flex; align-items:baseline; gap:.6rem; margin-bottom:.3rem; flex-wrap:wrap; }
.iw-tag { font-size:.62rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; }
.iw-title { font-family:'Crimson Pro',serif; font-size:1.08rem; font-weight:700; }
.iw-sub { font-size:.8rem; color:var(--text2); margin-bottom:.85rem; }
.iw-canvas { display:block; width:100%; border-radius:8px; background:var(--surface2); }
.iw-read { margin-top:.85rem; background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 8px 8px 0; padding:.7rem .85rem; font-size:.82rem; color:var(--text2); }
.iw-read strong { color:var(--green-dark); }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (widget toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.3rem .7rem; font-size:.76rem; cursor:pointer; color:var(--text2); transition:all .14s; font-family:inherit; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--gold-bg); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }

/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos { gap: .9rem; }
  .wlogos img { height: 38px; max-width: 42%; }
  .wtitle { font-size: 1.35rem; }
  .stickybar { padding: .5rem .55rem; gap: .38rem; }
  .htitle { display: none; }
  .halexis { display: none; }
  .hsep { display: none; }
  .hlogos { gap: .3rem; }
  .hlogos img { height: 18px; max-width: 60px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 78px; overflow: hidden; text-overflow: ellipsis; }
  .lang-btn { padding: .26rem .48rem; font-size: .68rem; }
  .lbody { padding: 1.2rem .7rem 3rem; max-width: 100%; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .gcrd { padding: .9rem .75rem; }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}
</style>
</head>
<body>

<!-- ════════════════════ WELCOME ════════════════════ -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <div style="font-family:'Crimson Pro',serif;font-size:2rem;font-weight:700;letter-spacing:.06em;color:#1a4a8a;line-height:1;letter-spacing:.28em;text-indent:.28em">ALEXIS</div>
    </div>
    <div class="wtitle" id="wtitle-el">Prueba de Hipótesis para Proporciones</div>
    <div class="wcourse" id="wcourse-el">Estadística</div>
    <label class="flabel" for="sName" id="lbl-name-el">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" for="sGroup" id="lbl-group-el">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreTitle">Sesión guardada encontrada</strong><br>
      <span id="restoreMsg">¿Deseas continuar donde la dejaste?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Retomar sesión</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Empezar de nuevo</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="200" height="48" viewBox="-22 0 160 34" xmlns="http://www.w3.org/2000/svg"><polyline points="4,24 10,18 16,20 22,10" fill="none" stroke="#1a4a8a" stroke-width="2"/><circle cx="22" cy="10" r="2.5" fill="#c9a84c"/><line x1="32" y1="6" x2="32" y2="28" stroke="#c9a84c" stroke-width="2"/><text x="42" y="22" font-family="'Crimson Pro',serif" font-weight="700" letter-spacing="3" fill="#1a4a8a" font-size="16">LIAXA</text></svg>
    </div>
  </div>
</div>

<!-- ════════════════════ LESSON ════════════════════ -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo -->
      <img id="hlogo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle" id="htitle-el">Prueba de Hipótesis para Proporciones</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 120 34" xmlns="http://www.w3.org/2000/svg"><polyline points="4,24 10,18 16,20 22,10" fill="none" stroke="#1a4a8a" stroke-width="2"/><circle cx="22" cy="10" r="2.5" fill="#c9a84c"/><line x1="32" y1="6" x2="32" y2="28" stroke="#c9a84c" stroke-width="2"/><text x="42" y="22" font-family="'Crimson Pro',serif" font-weight="700" letter-spacing="3" fill="#1a4a8a" font-size="16">LIAXA</text></svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle">
      <button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button>
      <button class="lang-btn"        id="btn-en" onclick="setLang('en')">EN</button>
    </div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="dlbtn" id="dlBtn" onclick="generatePDF()">Descargar resultados en PDF</button>
    </div>
  </div>
</div>

<script>

/* ── Score reporting ─────────────────────────────────────────────────────────
   Sends grade silently to Google Sheet when student finishes.
   Set SCORE_ENDPOINT = '' to disable without breaking anything.
   ──────────────────────────────────────────────────────────────────────────── */
var SCORE_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzIje7cRD7iI77G2-t6LMJEHtvjnwrFOJXsbbLe_4phhI7h9AhjL2HoIil1C-IoEn8T/exec';
/* ════════════════════════════════════════════════════════════════════════
   SCHOOL CONFIG · edit ONLY this block to rebrand for a different school
   ════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:      '#1a4a8a',
  primaryDark:  '#0f2d5a',
  primaryBg:    '#e8edf5',
  accent:       '#c9a84c',
  accentBg:     '#faf3e0',
  pBR: 26,  pBG: 74,  pBB: 138,
  pAR: 201, pAG: 168, pAB: 76,
  darkPrimary:     '#4a7abf',

function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t2 = s ^ (s >>> 16);
    t2 = Math.imul(t2, 0x21f0aaad);
    t2 ^= (t2 >>> 15);
    t2 = Math.imul(t2, 0x735a2d97);
    return ((t2 ^ (t2 >>> 15)) >>> 0) / 4294967296;
  };
}

function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}
/* Shuffles the four options once and keeps both language versions aligned. */
function shuffleOpts(rawEs, rawEn, rng) {
  var p = shuffle([0, 1, 2, 3], rng);

function nf(x) {

}
function nfD(x, d) {

  return (neg ? '−' : '') + s.join('.');
}

function money2(v) { return '$' + nfD(v, 2); }

function dec1(x)   { return x.toFixed(1); }

/* ── NORMAL MODEL · the sampling distribution of a proportion rests on it ── */
function erfc(x) {
  var z = Math.abs(x), tt = 1 / (1 + 0.5 * z);
  var ans = tt * Math.exp(-z * z - 1.26551223 + tt * (1.00002368 + tt * (0.37409196 +
    tt * (0.09678418 + tt * (-0.18628806 + tt * (0.27886807 + tt * (-1.13520398 +
    tt * (1.48851587 + tt * (-0.82215223 + tt * 0.17087277)))))))));
  return x >= 0 ? ans : 2 - ans;
}
function nPdf(z)  { return Math.exp(-0.5 * z * z) / Math.sqrt(2 * Math.PI); }
function nCdf(z)  { return 0.5 * erfc(-z / Math.SQRT2); }
/* Inverse of the standard normal, rational approximation of Acklam. */
function nInv(p) {

  var b = [-5.447609879822406e+01, 1.615858368580409e+02, -1.556989798598866e+02,
           6.680131188771972e+01, -1.328068155288572e+01];
  var c = [-7.784894002430293e-03, -3.223964580411365e-01, -2.400758277161838e+00,
           -2.549732539343734e+00, 4.374664141464968e+00, 2.938163982698783e+00];
  var d = [7.784695709041462e-03, 3.224671290700398e-01, 2.445134137142996e+00,
           3.754408661907416e+00];
  var pl = 0.02425, ph = 1 - pl, q, r;
  if (p < pl) {
    q = Math.sqrt(-2 * Math.log(p));
    return (((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5]) /
           ((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);

  if (p > ph) {
    q = Math.sqrt(-2 * Math.log(1 - p));
    return -(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5]) /
            ((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);
  }
  q = p - 0.5; r = q * q;
  return (((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5]) * q /
         (((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1);
}

/* ── EXACT BINOMIAL · the model the normal curve is only approximating ── */
function lgamma(x) {
  var g = [76.18009172947146, -86.50532032941677, 24.01409824083091,

  var y = x, tmp = x + 5.5, ser = 1.000000000190015;
  tmp -= (x + 0.5) * Math.log(tmp);
  for (var j = 0; j < 6; j++) { y += 1; ser += g[j] / y; }
  return -tmp + Math.log(2.5066282746310005 * ser / x);
}
function lchoose(n, k) { return lgamma(n + 1) - lgamma(k + 1) - lgamma(n - k + 1); }
function binPmf(k, n, p) {
  if (k < 0 || k > n) return 0;
  if (p <= 0) return k === 0 ? 1 : 0;
  if (p >= 1) return k === n ? 1 : 0;
  return Math.exp(lchoose(n, k) + k * Math.log(p) + (n - k) * Math.log(1 - p));
}
function binTailGE(k, n, p) {
  var s = 0, i;
  for (i = Math.max(0, Math.ceil(k)); i <= n; i++) s += binPmf(i, n, p);
  return Math.min(1, Math.max(0, s));
}

/* ── THE MACHINERY OF A TEST FOR A PROPORTION ─────────────────────────────
   The standard error of the test is built with the CLAIMED proportion,
   because the whole computation stands inside the world where the null is
   true. The confidence interval uses the observed proportion instead, and
   that single difference is the only place the two tools part ways. */
function seProp(p0, n)      { return Math.sqrt(p0 * (1 - p0) / n); }
function sePropHat(ph, n)   { return Math.sqrt(ph * (1 - ph) / n); }
function zProp(ph, p0, n)   { return (ph - p0) / seProp(p0, n); }
/* Critical values. One tail leaves the whole risk on one side, two tails split it. */
function zOne(alpha) { return nInv(1 - alpha); }
function zTwo(alpha) { return nInv(1 - alpha / 2); }
/* p values for each direction of the alternative. */
function pRight(z) { return 1 - nCdf(z); }
function pLeft(z)  { return nCdf(z); }
function pTwo(z)   { return 2 * (1 - nCdf(Math.abs(z))); }
/* Sample size that keeps the margin of error of an interval within e. */
function nForMargin(p, e, conf) {
  return Math.ceil(Math.pow(zTwo(1 - conf), 2) * p * (1 - p) / (e * e));
}
/* Sample size that reaches a required power against an alternative p1.
   The power term uses nInv(power) directly, which is POSITIVE for any power
   above one half; zOne() takes a tail area and would flip the sign. */
function nForPowerProp(p0, p1, alpha, power) {
  var num = zOne(alpha) * Math.sqrt(p0 * (1 - p0)) + nInv(power) * Math.sqrt(p1 * (1 - p1));
  return Math.ceil(num * num / Math.pow(p1 - p0, 2));
}
/* Number of successes that lands the sample proportion a chosen number of

function xForOffset(p0, n, off) {

  return Math.max(1, Math.min(n - 1, v));
}
function cssv(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }

/* ════════════════════════════════════════════════════════════════════════
   OPTION BUILDERS · the key is always the first value handed in
   ════════════════════════════════════════════════════════════════════════ */
/* Four distinct numbers rendered by fmt, aligned across languages. */
function valOpts(correct, wrongs, fmt, rng) {
  var seen = {}, vals = [];
  function add(v) {
    if (typeof v !== 'number' || !isFinite(v)) return;
    var s = fmt(v);
    if (seen[s]) return;
    seen[s] = 1; vals.push(s);
  }
  add(correct);
  for (var i = 0; i < wrongs.length && vals.length < 4; i++) add(wrongs[i]);
  for (var j = 1; vals.length < 4 && j < 900; j++) {
    add(correct * (1 + j * 0.12 * (j % 2 ? 1 : -1)));
  }
  for (var k = 1; vals.length < 4 && k < 900; k++) add(correct + k * 0.37);
  return shuffleOpts(vals, vals, rng);
}
function intOpts(correct, wrongs, rng) {
  var seen = {}, vals = [];
  function add(v) {
    if (typeof v !== 'number' || !isFinite(v) || v < 1) return;
    var s = intN(v);
    if (seen[s]) return;
    seen[s] = 1; vals.push(s);
  }
  add(correct);
  for (var i = 0; i < wrongs.length && vals.length < 4; i++) add(wrongs[i]);
  for (var j = 1; vals.length < 4 && j < 900; j++) add(Math.round(correct * (1 + j * 0.13 * (j % 2 ? 1 : -1))));
  return shuffleOpts(vals, vals, rng);
}

function observeSections() {
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
}

function startLesson() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  var err   = document.getElementById('startErr');
  if (!name || !group) { err.textContent = t('err-fields'); return; }
  err.textContent = '';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = nextAttempt(name, group);
  var rng = seededRng(name + group + att);
  buildLesson(rng);
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  observeSections();
}
function restoreSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  var saved = loadSession(name, group);
  if (!saved) return;
  document.getElementById('restoreBar').style.display = 'none';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = currentAttempt(name, group);
  var rng = seededRng(name + group + att);
  buildLesson(rng);
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  observeSections();
  saved.choices.forEach(function(choice, idx) {
    if (choice !== null && choice !== undefined) confirmMC(idx, choice);
  });
  setTimeout(function() {
    if (saved.drawings) saved.drawings.forEach(function(dataUrl, i) {
      if (!dataUrl) return;
      var dc = document.getElementById('dc' + i);
      if (!dc || !dc.width) return;
      var img = new Image();
      img.onload = function() {
        var dpr = window.devicePixelRatio || 1;
        dc.getContext('2d').drawImage(img, 0, 0, dc.width / dpr, dc.height / dpr);
      };
      img.src = dataUrl;
    });
    if (saved.texts) saved.texts.forEach(function(txt, i) {
      if (!txt) return;
      var ta = document.getElementById('ta' + i);
      if (ta) ta.value = txt;
    });
    if (saved.photos) saved.photos.forEach(function(dataUrl, i) {
      if (!dataUrl) return;
      var pp = document.getElementById('pp' + i);
      if (!pp) return;
      pp.src = dataUrl; pp.style.display = 'block';
      var pz = document.getElementById('pz' + i);
      if (pz) pz.style.opacity = '0.4';
    });
  }, 300);
}

function initCanvas(canvas) {

  canvas.height = rect.height * dpr;

  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.strokeStyle = '#2d5a27';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e) { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e) { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(p[0], p[1]); ctx.stroke(); lx = p[0]; ly = p[1]; }
  function onUp() { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}
function switchTab(idx, panel, btn) {

        headers: { 'Content-Type': 'application/json' },

/* ════════════════════════════════════════════════════════════════════════
   ANSWER HANDLER · two taps to confirm
   ════════════════════════════════════════════════════════════════════════ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = '<strong>' + (isOk ? t('fb-correct') : t('fb-wrong')) + '</strong> ' + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (!prob || prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = '<strong>' + (isOk ? t('fb-correct') : t('fb-wrong')) + '</strong> ' + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

/* ════════════════════════════════════════════════════════════════════════
   CANVAS PRIMITIVES FOR THE WIDGETS
   ════════════════════════════════════════════════════════════════════════ */
function fitCanvas(cv, h) {
  var dpr = window.devicePixelRatio || 1;
  var w = Math.max(240, cv.clientWidth || cv.parentNode.clientWidth || 300);
  cv.style.height = h + 'px';
  cv.width  = Math.round(w * dpr);
  cv.height = Math.round(h * dpr);
  var ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  return { ctx: ctx, w: w, h: h };
}
function palette() {
  return {
    green: cssv('--green'), dark: cssv('--green-dark'), tint: cssv('--green-bg'),
    gold: cssv('--gold'), bad: cssv('--bad'), border: cssv('--border'),
    text: cssv('--text'), text2: cssv('--text2'), text3: cssv('--text3')
  };
}
/* Draws one normal density over four standard deviations on each side. Bands
   carry a kind: 0 pale, 1 green for the region where the null survives, 2 gold
   for the rejection region. opts.obs marks the statistic the sample produced. */
function drawCurve(g, mu, sd, bands, opts) {
  var ctx = g.ctx, P = palette(), W = g.w, H = g.h;
  var padL = 12, padR = 12, padT = 16, padB = 22;
  var x0 = mu - 4 * sd, x1 = mu + 4 * sd, i;
  opts = opts || {};
  var fmt = opts.fmt || function(v) { return nf(v); };
  function X(v) { return padL + (v - x0) / (x1 - x0) * (W - padL - padR); }
  var peak = nPdf(0) / sd;
  function Y(d) { return H - padB - d / peak * (H - padT - padB); }
  function dens(v) { return nPdf((v - mu) / sd) / sd; }
  var step = (x1 - x0) / 260;
  (bands || []).forEach(function(b) {
    var a = Math.max(x0, b.a), c = Math.min(x1, b.b), v;
    if (c <= a) return;
    ctx.beginPath();
    ctx.moveTo(X(a), H - padB);
    for (v = a; v <= c; v += step) ctx.lineTo(X(v), Y(dens(v)));
    ctx.lineTo(X(c), Y(dens(c)));
    ctx.lineTo(X(c), H - padB);
    ctx.closePath();
    ctx.fillStyle = b.kind === 2 ? P.gold : b.kind === 1 ? P.green : P.tint;
    ctx.globalAlpha = b.kind === 0 ? 1 : 0.42;
    ctx.fill();
    ctx.globalAlpha = 1;
  });
  ctx.strokeStyle = P.border; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(padL, H - padB); ctx.lineTo(W - padR, H - padB); ctx.stroke();
  ctx.strokeStyle = P.dark; ctx.lineWidth = 2;
  ctx.beginPath();
  for (i = 0; i <= 260; i++) {
    var vv = x0 + i * step;
    if (i === 0) ctx.moveTo(X(vv), Y(dens(vv))); else ctx.lineTo(X(vv), Y(dens(vv)));
  }
  ctx.stroke();
  (opts.marks || []).forEach(function(m) {
    if (m < x0 || m > x1) return;
    ctx.save();
    ctx.strokeStyle = P.gold; ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.moveTo(X(m), H - padB); ctx.lineTo(X(m), Y(dens(m))); ctx.stroke();
    ctx.restore();
  });
  if (typeof opts.obs === 'number' && opts.obs >= x0 && opts.obs <= x1) {
    ctx.save();
    ctx.strokeStyle = P.bad; ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.moveTo(X(opts.obs), H - padB); ctx.lineTo(X(opts.obs), padT - 6); ctx.stroke();
    ctx.fillStyle = P.bad; ctx.font = '600 10px "IBM Plex Sans", sans-serif';
    if (opts.obsLabel) {
      var ow = ctx.measureText(opts.obsLabel).width;
      ctx.fillText(opts.obsLabel, Math.min(Math.max(2, X(opts.obs) - ow / 2), W - ow - 2), H - padB + 21);
    }
    ctx.restore();
  }
  ctx.save();
  ctx.strokeStyle = P.dark; ctx.lineWidth = 1.6; ctx.setLineDash([4, 3]);
  ctx.beginPath(); ctx.moveTo(X(mu), padT - 8); ctx.lineTo(X(mu), H - padB); ctx.stroke();
  ctx.restore();
  if (opts.muLabel) {
    ctx.fillStyle = P.dark; ctx.font = '600 10px "IBM Plex Sans", sans-serif';
    var lw = ctx.measureText(opts.muLabel).width;
    ctx.fillText(opts.muLabel, Math.min(Math.max(2, X(mu) - lw / 2), W - lw - 2), 11);
  }
  ctx.fillStyle = P.text3; ctx.font = '9px "IBM Plex Mono", monospace';
  for (i = -2; i <= 2; i++) {
    var tv = mu + i * sd, lab = fmt(tv), tw = ctx.measureText(lab).width;
    ctx.fillText(lab, Math.min(Math.max(1, X(tv) - tw / 2), W - tw - 1), H - padB + 13);
  }
}
/* Draws the exact binomial distribution of the number of favourable cases as
   bars, with the normal curve that approximates it laid on top. The bars from
   the observed count onward are shaded, so the exact tail and the approximate
   tail can be compared as areas instead of being taken on faith. */
function drawBinomial(g, n, p, xObs, labels) {
  var ctx = g.ctx, P = palette(), W = g.w, H = g.h;
  var padL = 12, padR = 12, padT = 22, padB = 24, k, i;
  var mu = n * p, sd = Math.sqrt(n * p * (1 - p));
  if (sd <= 0) sd = 0.5;
  var lo = Math.max(0, Math.floor(mu - 4 * sd));
  var hi = Math.min(n, Math.ceil(mu + 4 * sd));
  if (hi <= lo) hi = lo + 1;
  var span = hi - lo + 1;
  var peak = nPdf(0) / sd;
  for (k = lo; k <= hi; k++) peak = Math.max(peak, binPmf(k, n, p));
  function X(v) { return padL + (v - lo + 0.5) / span * (W - padL - padR); }
  function Y(d) { return H - padB - d / peak * (H - padT - padB); }
  var bw = (W - padL - padR) / span;
  for (k = lo; k <= hi; k++) {
    var d = binPmf(k, n, p);
    ctx.fillStyle = (k >= xObs) ? P.gold : P.tint;
    ctx.globalAlpha = (k >= xObs) ? 0.75 : 1;
    ctx.fillRect(X(k) - bw * 0.45, Y(d), Math.max(1, bw * 0.9), H - padB - Y(d));
    ctx.globalAlpha = 1;
  }
  ctx.strokeStyle = P.dark; ctx.lineWidth = 2;
  ctx.beginPath();
  for (i = 0; i <= 220; i++) {
    var v = lo - 0.5 + i * span / 220;
    var dd = nPdf((v - mu) / sd) / sd;
    if (i === 0) ctx.moveTo(X(v), Y(dd)); else ctx.lineTo(X(v), Y(dd));
  }
  ctx.stroke();
  ctx.strokeStyle = P.border; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(padL, H - padB); ctx.lineTo(W - padR, H - padB); ctx.stroke();
  ctx.save();
  ctx.strokeStyle = P.bad; ctx.lineWidth = 2.2;
  ctx.beginPath(); ctx.moveTo(X(xObs) - bw * 0.5, H - padB); ctx.lineTo(X(xObs) - bw * 0.5, padT - 12); ctx.stroke();
  ctx.restore();
  ctx.fillStyle = P.text3; ctx.font = '9px "IBM Plex Mono", monospace';
  [lo, Math.round(mu), hi].forEach(function(v) {
    var lab = intN(v), lw = ctx.measureText(lab).width;
    ctx.fillText(lab, Math.min(Math.max(1, X(v) - lw / 2), W - lw - 1), H - padB + 13);
  });
  ctx.fillStyle = P.dark; ctx.font = '600 10px "IBM Plex Sans", sans-serif';
  ctx.fillText(labels.bars, padL + 2, 12);
  ctx.fillStyle = P.bad;
  var rl = labels.obs, rw = ctx.measureText(rl).width;
  ctx.fillText(rl, W - padR - rw - 2, 12);
}
/* Draws a confidence interval as a horizontal bar with the claimed value marked
   on it, so the tie between an interval and a two tailed test is visible. */
function drawIntervalBar(g, lo, hi, center, claim, fmt, labels) {
  var ctx = g.ctx, P = palette(), W = g.w, H = g.h;
  var padL = 14, padR = 14;
  var span = Math.max(hi - lo, Math.abs(claim - center) * 2) * 1.35;
  var a = center - span / 2, b = center + span / 2;
  function X(v) { return padL + (v - a) / (b - a) * (W - padL - padR); }
  var yBar = H * 0.55;
  ctx.strokeStyle = P.border; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(padL, yBar + 26); ctx.lineTo(W - padR, yBar + 26); ctx.stroke();
  ctx.fillStyle = P.green; ctx.globalAlpha = 0.30;
  ctx.fillRect(X(lo), yBar - 13, X(hi) - X(lo), 26);
  ctx.globalAlpha = 1;
  ctx.strokeStyle = P.dark; ctx.lineWidth = 2;
  [lo, hi].forEach(function(v) {
    ctx.beginPath(); ctx.moveTo(X(v), yBar - 15); ctx.lineTo(X(v), yBar + 15); ctx.stroke();
  });
  ctx.beginPath(); ctx.moveTo(X(lo), yBar); ctx.lineTo(X(hi), yBar); ctx.stroke();
  ctx.save();
  ctx.strokeStyle = P.gold; ctx.lineWidth = 1.6; ctx.setLineDash([4, 3]);
  ctx.beginPath(); ctx.moveTo(X(center), yBar - 22); ctx.lineTo(X(center), yBar + 22); ctx.stroke();
  ctx.restore();
  var inside = claim >= lo && claim <= hi;
  ctx.strokeStyle = inside ? P.green : P.bad; ctx.lineWidth = 2.6;
  ctx.beginPath(); ctx.moveTo(X(claim), yBar - 30); ctx.lineTo(X(claim), yBar + 30); ctx.stroke();
  ctx.fillStyle = inside ? P.green : P.bad;
  ctx.beginPath(); ctx.arc(X(claim), yBar - 30, 3.4, 0, Math.PI * 2); ctx.fill();
  ctx.font = '600 10px "IBM Plex Sans", sans-serif';
  var cl = labels.claim, cw = ctx.measureText(cl).width;
  ctx.fillText(cl, Math.min(Math.max(2, X(claim) - cw / 2), W - cw - 2), yBar - 36);
  ctx.fillStyle = P.text3; ctx.font = '9px "IBM Plex Mono", monospace';
  [[lo, X(lo)], [hi, X(hi)], [center, X(center)]].forEach(function(pairv) {
    var lab = fmt(pairv[0]), lw = ctx.measureText(lab).width;
    ctx.fillText(lab, Math.min(Math.max(1, pairv[1] - lw / 2), W - lw - 1), yBar + 40);
  });
  ctx.fillStyle = P.dark; ctx.font = '600 10px "IBM Plex Sans", sans-serif';
  ctx.fillText(labels.band, padL + 2, 14);
}

/* ════════════════════════════════════════════════════════════════════════
   WIDGET 1 · the whole test for a proportion assembled in one place
   ════════════════════════════════════════════════════════════════════════ */
function widgetZProp(p0Pct0, dif0, n0, al0) {
  var host = document.createElement('div');
  host.className = 'section';
  document.getElementById('lessonBody').appendChild(host);
  var state = { tail: 'right', p0: p0Pct0, dif: dif0, n: n0, al: al0 };
  function mount() {
    var es = LANG === 'es';
    var MODES = [
      { id: 'right', es: 'La conversión real es mayor', en: 'The real conversion is higher' },
      { id: 'left',  es: 'La conversión real es menor', en: 'The real conversion is lower' },
      { id: 'two',   es: 'La conversión real cambió',   en: 'The real conversion changed' }
    ];
    var tabs = MODES.map(function(m) {
      return '<button class="mtab' + (m.id === state.tail ? ' active' : '') + '" data-m="' + m.id + '">' + m[LANG] + '</button>';
    }).join('');
    host.innerHTML =
      '<div class="gcrd" data-widget="prueba-z-para-una-proporcion">' +
        '<div class="iw-head"><span class="iw-tag">' + (es ? 'Herramienta' : 'Tool') + '</span>' +
        '<span class="iw-title">' + (es ? 'La prueba completa para una tasa de conversión' : 'The whole test for a conversion rate') + '</span></div>' +
        '<div class="iw-sub">' + (es
          ? 'Una tienda en línea tiene registrada una tasa de conversión y el área comercial revisa una muestra de visitas para ver si la realidad coincide con lo registrado. Elige primero la sospecha que se quiere probar, porque de ahí sale la cola. Después mueve la cifra afirmada, la muestra y el riesgo aceptado, y observa las dos formas de leer el mismo resultado: en la escala z, que es donde la campana sabe responder, y en puntos porcentuales de conversión, que es donde la dirección toma la decisión.'
          : 'An online store has a conversion rate on record and the commercial team reviews a sample of visits to see whether reality matches it. Pick the suspicion to be tested first, because the tail comes from it. Then move the claimed figure, the sample and the accepted risk, and watch the two ways of reading the same result: on the z scale, where the bell knows how to answer, and in percentage points of conversion, where management makes the decision.') + '</div>' +
        '<div class="mtabs">' + tabs + '</div>' +
        '<div class="cgrid"><div class="cg">' +
          '<label>' + (es ? 'Conversión afirmada en por ciento' : 'Claimed conversion in percent') + ': <span class="cval" id="z1pl"></span></label>' +
          '<input type="range" min="5" max="80" step="1" id="z1p" value="' + state.p0 + '">' +
        '</div><div class="cg">' +
          '<label>' + (es ? 'Diferencia observada en puntos porcentuales' : 'Observed difference in percentage points') + ': <span class="cval" id="z1dl"></span></label>' +
          '<input type="range" min="-12" max="12" step="1" id="z1d" value="' + state.dif + '">' +
        '</div></div>' +
        '<div class="cgrid"><div class="cg">' +
          '<label>' + (es ? 'Visitas revisadas' : 'Visits reviewed') + ': <span class="cval" id="z1nl"></span></label>' +
          '<input type="range" min="50" max="1000" step="25" id="z1n" value="' + state.n + '">' +
        '</div><div class="cg">' +
          '<label>' + (es ? 'Nivel de significancia en por ciento' : 'Significance level in percent') + ': <span class="cval" id="z1al"></span></label>' +

        '<div class="metrics">' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Error estándar' : 'Standard error') + '</div><div class="mnum ts" id="z1se"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Conversión observada' : 'Observed conversion') + '</div><div class="mnum ts" id="z1ph"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Estadístico z' : 'z statistic') + '</div><div class="mnum cs" id="z1z"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Valor crítico' : 'Critical value') + '</div><div class="mnum ps" id="z1zc"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Frontera en conversión' : 'Boundary in conversion') + '</div><div class="mnum ps" id="z1cr"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Decisión' : 'Decision') + '</div><div class="mnum cs" id="z1dec"></div></div>' +
        '</div>' +
        '<div class="iw-read" id="z1read"></div>' +
      '</div>';
    host.querySelectorAll('.mtab').forEach(function(b) {
      b.addEventListener('click', function() {
        state.tail = b.getAttribute('data-m');
        host.querySelectorAll('.mtab').forEach(function(x) { x.classList.remove('active'); });
        b.classList.add('active');
        update();
      });
    });
    host.querySelector('#z1p').addEventListener('input', function() { state.p0  = parseInt(this.value, 10); update(); });
    host.querySelector('#z1d').addEventListener('input', function() { state.dif = parseInt(this.value, 10); update(); });
    host.querySelector('#z1n').addEventListener('input', function() { state.n   = parseInt(this.value, 10); update(); });
    host.querySelector('#z1a').addEventListener('input', function() { state.al  = parseInt(this.value, 10); update(); });
    update();
  }
  function update() {
    var es = LANG === 'es';
    var al = state.al / 100;
    var two = state.tail === 'two';
    var p0 = state.p0 / 100;
    var ph = Math.max(0.005, Math.min(0.995, p0 + state.dif / 100));
    var se = seProp(p0, state.n);
    var z  = (ph - p0) / se;
    var zc = two ? zTwo(al) : zOne(al);
    var bands, marks, rejects, critTxt, ruleTxt;
    if (state.tail === 'right') {
      bands = [{ a: -4, b: zc, kind: 1 }, { a: zc, b: 4, kind: 2 }];
      marks = [zc];
      rejects = z > zc;
      critTxt = pct2(p0 + zc * se);
      ruleTxt = 'z > ' + dec3(zc);
    } else if (state.tail === 'left') {
      bands = [{ a: -4, b: -zc, kind: 2 }, { a: -zc, b: 4, kind: 1 }];
      marks = [-zc];
      rejects = z < -zc;
      critTxt = pct2(p0 - zc * se);
      ruleTxt = 'z < −' + dec3(zc);
    } else {
      bands = [{ a: -4, b: -zc, kind: 2 }, { a: -zc, b: zc, kind: 1 }, { a: zc, b: 4, kind: 2 }];
      marks = [-zc, zc];
      rejects = Math.abs(z) > zc;
      critTxt = pct2(p0 - zc * se) + ' / ' + pct2(p0 + zc * se);
      ruleTxt = '|z| > ' + dec3(zc);
    }
    var nOk = state.n * p0 >= 10 && state.n * (1 - p0) >= 10;
    host.querySelector('#z1pl').textContent  = dec1(state.p0);
    host.querySelector('#z1dl').textContent  = dec1(state.dif);
    host.querySelector('#z1nl').textContent  = intN(state.n);
    host.querySelector('#z1al').textContent  = dec1(state.al);
    host.querySelector('#z1se').textContent  = pr(se);
    host.querySelector('#z1ph').textContent  = pct2(ph);
    host.querySelector('#z1z').textContent   = dec3(z);
    host.querySelector('#z1zc').textContent  = (state.tail === 'left' ? '−' : '') + dec3(zc) + (two ? ' / ' + dec3(zc) : '');
    host.querySelector('#z1cr').textContent  = critTxt;
    host.querySelector('#z1dec').textContent = rejects
      ? (es ? 'Se rechaza' : 'Reject')
      : (es ? 'No se rechaza' : 'Do not reject');
    var verdict = rejects
      ? (es ? 'La regla de decisión pide ' + ruleTxt + ' y el estadístico vale ' + dec3(z) + ', así que se rechaza la hipótesis nula: una diferencia de este tamaño es demasiado rara para achacarla al azar del muestreo.'
            : 'The decision rule asks for ' + ruleTxt + ' and the statistic is ' + dec3(z) + ', so the null hypothesis is rejected: a difference this large is too rare to blame on sampling chance.')
      : (es ? 'La regla de decisión pide ' + ruleTxt + ' y el estadístico vale ' + dec3(z) + ', así que no se rechaza la hipótesis nula: una diferencia así de grande es perfectamente posible aunque la cifra registrada sea correcta.'
            : 'The decision rule asks for ' + ruleTxt + ' and the statistic is ' + dec3(z) + ', so the null hypothesis is not rejected: a difference this size is perfectly possible even if the recorded figure is right.');
    host.querySelector('#z1read').innerHTML = (es
      ? '<strong>Lectura de negocio:</strong> ' : '<strong>Business reading:</strong> ') + verdict + (es
      ? ' Con ' + intN(state.n) + ' visitas y una conversión afirmada de ' + dec1(state.p0) + ' por ciento, cada error estándar mide ' + pct2(se) + ' de conversión, y por eso una diferencia de ' + dec1(state.dif) + ' puntos pesa ' + dec3(z) + ' errores estándar. La frontera de la decisión traducida a conversión queda en ' + critTxt + ', que es la cifra que conviene llevar a la junta: nadie discute un estadístico, todos discuten una tasa de conversión. Mueve solo el número de visitas y verás que la diferencia en puntos no se mueve, pero el estadístico sí, porque más información hace más difícil explicar la misma brecha por azar. ' + (nOk ? 'Con estos valores se cumplen las dos condiciones de conteo, así que la campana es una aproximación razonable.' : 'Cuidado: con estos valores el número esperado de casos favorables o desfavorables baja de diez, así que la campana deja de ser una aproximación confiable y el resultado se debería calcular con el modelo binomial exacto.')
      : ' With ' + intN(state.n) + ' visits and a claimed conversion of ' + dec1(state.p0) + ' percent, each standard error measures ' + pct2(se) + ' of conversion, and that is why a difference of ' + dec1(state.dif) + ' points weighs ' + dec3(z) + ' standard errors. The decision boundary translated into conversion sits at ' + critTxt + ', which is the figure worth taking to the meeting: nobody argues about a statistic, everybody argues about a conversion rate. Move only the number of visits and you will see the difference in points stay put while the statistic moves, because more information makes the same gap harder to explain by chance. ' + (nOk ? 'With these values both counting conditions hold, so the bell is a reasonable approximation.' : 'Careful: with these values the expected number of favourable or unfavourable cases drops below ten, so the bell stops being a reliable approximation and the result should be computed with the exact binomial model.'));
    var g = fitCanvas(host.querySelector('#z1cv'), 165);
    drawCurve(g, 0, 1, bands, {
      marks: marks, fmt: function(v) { return dec2(v); },
      obs: Math.max(-3.9, Math.min(3.9, z)),
      obsLabel: (es ? 'Estadístico ' : 'Statistic ') + dec3(z),
      muLabel: (es ? 'Mundo donde la cifra registrada es correcta' : 'World where the recorded figure is right')
    });
  }
  widgets.push(mount);
  mount();
}

/* ════════════════════════════════════════════════════════════════════════
   WIDGET 2 · the p value and the critical value are the same rule
   ════════════════════════════════════════════════════════════════════════ */
function widgetPvalProp(p0, n0, dif0, al0) {
  var host = document.createElement('div');

  function mount() {

      return '<button class="mtab' + (m.id === state.tail ? ' active' : '') + '" data-m="' + m.id + '">' + m[LANG] + '</button>';
    }).join('');
    host.innerHTML =

        '<div class="iw-sub">' + (es
          ? 'Una empresa de telefonía afirma que ' + pct1(p0) + ' por ciento de sus clientes renueva el contrato y el área de retención revisa una muestra de cuentas. El área dorada de la campana es el valor p. Mueve la diferencia observada, la muestra y el nivel de significancia, y compara las dos tarjetas de decisión: la que compara el estadístico contra el valor crítico y la que compara el valor p contra el nivel de significancia. Nunca se contradicen, porque son la misma frontera vista desde dos lados.'
          : 'A telecom company claims that ' + pct1(p0) + ' percent of its customers renew the contract and the retention team reviews a sample of accounts. The gold area under the bell is the p value. Move the observed difference, the sample and the significance level, and compare the two decision cards: the one comparing the statistic against the critical value and the one comparing the p value against the significance level. They never disagree, because they are the same boundary seen from two sides.') + '</div>' +
        '<div class="mtabs">' + tabs + '</div>' +
        '<div class="cgrid"><div class="cg">' +
          '<label>' + (es ? 'Diferencia observada en puntos porcentuales' : 'Observed difference in percentage points') + ': <span class="cval" id="p2dl"></span></label>' +
          '<input type="range" min="0" max="12" step="1" id="p2d" value="' + state.dif + '">' +
        '</div><div class="cg">' +
          '<label>' + (es ? 'Cuentas revisadas' : 'Accounts reviewed') + ': <span class="cval" id="p2nl"></span></label>' +
          '<input type="range" min="100" max="2000" step="50" id="p2n" value="' + state.n + '">' +
        '</div></div>' +
        '<div class="cgrid"><div class="cg">' +
          '<label>' + (es ? 'Nivel de significancia en por ciento' : 'Significance level in percent') + ': <span class="cval" id="p2al"></span></label>' +
          '<input type="range" min="1" max="15" step="1" id="p2a" value="' + state.al + '">' +
        '</div><div class="cg">' +
          '<label>' + (es ? 'Área dorada' : 'Gold area') + '</label>' +
          '<div style="font-size:.74rem;color:var(--text3)">' + (es ? 'Es el valor p, la rareza del resultado si la afirmación fuera cierta' : 'It is the p value, how rare the result is if the claim were true') + '</div>' +
        '</div></div>' +
        '<canvas class="iw-canvas" id="p2cv"></canvas>' +
        '<div class="metrics">' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Estadístico z' : 'z statistic') + '</div><div class="mnum ts" id="p2z"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Valor crítico' : 'Critical value') + '</div><div class="mnum ps" id="p2zc"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Decisión por valor crítico' : 'Decision by critical value') + '</div><div class="mnum cs" id="p2d1"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Valor p' : 'p value') + '</div><div class="mnum ps" id="p2p"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Nivel de significancia' : 'Significance level') + '</div><div class="mnum ts" id="p2a2"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Decisión por valor p' : 'Decision by p value') + '</div><div class="mnum cs" id="p2d2"></div></div>' +
        '</div>' +
        '<div class="iw-read" id="p2read"></div>' +
      '</div>';
    host.querySelectorAll('.mtab').forEach(function(b) {
      b.addEventListener('click', function() {
        state.tail = b.getAttribute('data-m');
        host.querySelectorAll('.mtab').forEach(function(x) { x.classList.remove('active'); });
        b.classList.add('active');
        update();
      });
    });
    host.querySelector('#p2d').addEventListener('input', function() { state.dif = parseInt(this.value, 10); update(); });
    host.querySelector('#p2n').addEventListener('input', function() { state.n   = parseInt(this.value, 10); update(); });
    host.querySelector('#p2a').addEventListener('input', function() { state.al  = parseInt(this.value, 10); update(); });
    update();
  }
  function update() {
    var es = LANG === 'es';
    var al = state.al / 100;
    var two = state.tail === 'two';
    var ph = Math.max(0.005, Math.min(0.995, p0 + state.dif / 100));
    var se = seProp(p0, state.n);
    var z  = (ph - p0) / se;
    var zc = two ? zTwo(al) : zOne(al);
    var p  = two ? pTwo(z) : pRight(z);
    var byCrit = two ? (Math.abs(z) > zc) : (z > zc);
    var byP    = p <= al;
    var bands  = two
      ? [{ a: -4, b: -Math.abs(z), kind: 2 }, { a: -Math.abs(z), b: Math.abs(z), kind: 1 }, { a: Math.abs(z), b: 4, kind: 2 }]
      : [{ a: -4, b: z, kind: 1 }, { a: z, b: 4, kind: 2 }];
    host.querySelector('#p2dl').textContent = dec1(state.dif);
    host.querySelector('#p2nl').textContent = intN(state.n);
    host.querySelector('#p2al').textContent = dec1(state.al);
    host.querySelector('#p2z').textContent  = dec3(z);
    host.querySelector('#p2zc').textContent = dec3(zc);
    host.querySelector('#p2p').textContent  = pr(p);
    host.querySelector('#p2a2').textContent = pr(al);
    host.querySelector('#p2d1').textContent = byCrit
      ? (es ? 'Se rechaza' : 'Reject') : (es ? 'No se rechaza' : 'Do not reject');
    host.querySelector('#p2d2').textContent = byP
      ? (es ? 'Se rechaza' : 'Reject') : (es ? 'No se rechaza' : 'Do not reject');
    var agree = (byCrit === byP);
    host.querySelector('#p2read').innerHTML = es
      ? '<strong>Lectura de negocio:</strong> la renovación observada es ' + pct2(ph) + ' frente a la afirmada de ' + pct1(p0) + ' por ciento. El error estándar bajo la nula vale ' + pr(se) + ', el estadístico ' + dec3(z) + ' y el valor crítico ' + dec3(zc) + '; el valor p vale ' + pr(p) + ' y el nivel de significancia ' + pr(al) + '. ' +
        (byP ? 'Las dos tarjetas rechazan la afirmación de la empresa' : 'Las dos tarjetas dejan viva la afirmación de la empresa') +
        (agree ? ', y siempre coinciden porque el valor crítico es justo el estadístico cuyo valor p vale exactamente ' + pr(al) + '.' : '.') +
        ' La ventaja práctica del valor p es que informa cuánto margen hay: ' +
        (byP ? 'aquí sobra evidencia frente a la exigencia fijada, así que la conclusión aguantaría un nivel de significancia más estricto.' : 'aquí falta evidencia frente a la exigencia fijada, y subir el nivel de significancia para forzar el rechazo sería cambiar las reglas después del partido.') +
        ' Sube ahora las cuentas revisadas sin tocar la diferencia en puntos: el valor p se desploma aunque la brecha en discusión siga siendo la misma, y esa es la razón por la que un resultado significativo no es todavía un resultado importante para el negocio.'
      : '<strong>Business reading:</strong> observed renewal is ' + pct2(ph) + ' against the claimed ' + pct1(p0) + ' percent. The standard error under the null is ' + pr(se) + ', the statistic ' + dec3(z) + ' and the critical value ' + dec3(zc) + '; the p value is ' + pr(p) + ' and the significance level ' + pr(al) + '. ' +
        (byP ? 'Both cards reject the claim of the company' : 'Both cards leave the claim of the company standing') +
        (agree ? ', and they always agree because the critical value is precisely the statistic whose p value equals ' + pr(al) + '.' : '.') +
        ' The practical advantage of the p value is that it reports how much room there is: ' +
        (byP ? 'here the evidence clears the bar that was set, so the conclusion would survive a stricter significance level.' : 'here the evidence falls short of the bar that was set, and raising the significance level to force a rejection would be changing the rules after the game.') +
        ' Now raise the accounts reviewed without touching the difference in points: the p value collapses even though the gap under discussion is the same, and that is why a significant result is not yet an important result for the business.';
    var g = fitCanvas(host.querySelector('#p2cv'), 165);
    drawCurve(g, 0, 1, bands, {
      marks: two ? [-zc, zc] : [zc], fmt: function(v) { return dec2(v); },
      obs: Math.max(-3.9, Math.min(3.9, z)),
      obsLabel: (es ? 'Valor p ' : 'p value ') + pr(p),
      muLabel: (es ? 'Mundo donde la afirmación es cierta' : 'World where the claim is true')
    });
  }
  widgets.push(mount);
  mount();
}

/* ════════════════════════════════════════════════════════════════════════
   WIDGET 3 · what the normal approximation is standing on

function widgetConditions(n0, p0Pct0, dif0) {
  var host = document.createElement('div');
  host.className = 'section';
  document.getElementById('lessonBody').appendChild(host);
  var state = { n: n0, p0: p0Pct0, dif: dif0 };
  function mount() {

    host.innerHTML =
      '<div class="gcrd" data-widget="condiciones-de-la-aproximacion-normal">' +

        '<span class="iw-title">' + (es ? 'Cuándo la campana puede sustituir al conteo' : 'When the bell may replace the count') + '</span></div>' +
        '<div class="iw-sub">' + (es
          ? 'Una financiera revisa expedientes y cuenta cuántos presentan una incidencia. Las barras son la distribución binomial exacta del número de casos, que es el modelo verdadero, y la línea es la campana con la que se aproxima. Mueve la muestra y la proporción afirmada, y compara el valor p exacto contra el aproximado: cuando el número esperado de casos favorables o desfavorables baja de diez, la campana deja de servir y la diferencia entre los dos valores p se vuelve visible.'
          : 'A lender reviews files and counts how many show an incident. The bars are the exact binomial distribution of the number of cases, which is the true model, and the line is the bell used to approximate it. Move the sample and the claimed proportion, and compare the exact p value against the approximate one: when the expected number of favourable or unfavourable cases drops below ten, the bell stops working and the gap between the two p values becomes visible.') + '</div>' +
        '<div class="cgrid"><div class="cg">' +

          '<input type="range" min="15" max="250" step="5" id="c3n" value="' + state.n + '">' +
        '</div><div class="cg">' +
          '<label>' + (es ? 'Proporción afirmada en por ciento' : 'Claimed proportion in percent') + ': <span class="cval" id="c3pl"></span></label>' +
          '<input type="range" min="2" max="50" step="1" id="c3p" value="' + state.p0 + '">' +
        '</div></div>' +
        '<div class="cgrid"><div class="cg">' +
          '<label>' + (es ? 'Exceso observado en puntos porcentuales' : 'Observed excess in percentage points') + ': <span class="cval" id="c3dl"></span></label>' +
          '<input type="range" min="1" max="20" step="1" id="c3d" value="' + state.dif + '">' +
        '</div><div class="cg">' +
          '<label>' + (es ? 'Barras doradas' : 'Gold bars') + '</label>' +
          '<div style="font-size:.74rem;color:var(--text3)">' + (es ? 'Son el valor p exacto: la probabilidad de contar tantos casos o más' : 'They are the exact p value: the probability of counting that many cases or more') + '</div>' +
        '</div></div>' +
        '<canvas class="iw-canvas" id="c3cv"></canvas>' +
        '<div class="metrics">' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Casos esperados' : 'Expected cases') + '</div><div class="mnum ts" id="c3np"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'No casos esperados' : 'Expected non cases') + '</div><div class="mnum ts" id="c3nq"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Condiciones' : 'Conditions') + '</div><div class="mnum cs" id="c3ok"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Casos observados' : 'Observed cases') + '</div><div class="mnum ts" id="c3x"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Valor p exacto' : 'Exact p value') + '</div><div class="mnum ps" id="c3pe"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Valor p aproximado' : 'Approximate p value') + '</div><div class="mnum cs" id="c3pa"></div></div>' +
        '</div>' +
        '<div class="iw-read" id="c3read"></div>' +
      '</div>';
    host.querySelector('#c3n').addEventListener('input', function() { state.n   = parseInt(this.value, 10); update(); });
    host.querySelector('#c3p').addEventListener('input', function() { state.p0  = parseInt(this.value, 10); update(); });
    host.querySelector('#c3d').addEventListener('input', function() { state.dif = parseInt(this.value, 10); update(); });

  function update() {
    var es = LANG === 'es';
    var p0 = state.p0 / 100;
    var n  = state.n;
    var np = n * p0, nq = n * (1 - p0);
    var x  = Math.max(1, Math.min(n, Math.round((p0 + state.dif / 100) * n)));
    var ph = x / n;
    var pExact = binTailGE(x, n, p0);
    var pApprox = pRight((ph - p0) / seProp(p0, n));
    var ok = np >= 10 && nq >= 10;
    var gap = Math.abs(pExact - pApprox);
    host.querySelector('#c3nl').textContent = intN(n);
    host.querySelector('#c3pl').textContent = dec1(state.p0);
    host.querySelector('#c3dl').textContent = dec1(state.dif);
    host.querySelector('#c3np').textContent = dec1(np);
    host.querySelector('#c3nq').textContent = dec1(nq);
    host.querySelector('#c3ok').textContent = ok ? (es ? 'Se cumplen' : 'Met') : (es ? 'No se cumplen' : 'Not met');
    host.querySelector('#c3x').textContent  = intN(x);
    host.querySelector('#c3pe').textContent = pr(pExact);
    host.querySelector('#c3pa').textContent = pr(pApprox);
    host.querySelector('#c3read').innerHTML = es
      ? '<strong>Lectura de negocio:</strong> con ' + intN(n) + ' expedientes y una proporción afirmada de ' + dec1(state.p0) + ' por ciento, se esperan ' + dec1(np) + ' casos y ' + dec1(nq) + ' no casos. ' +
        (ok ? 'Las dos cifras llegan a diez, así que la campana es una aproximación aceptable y el valor p aproximado, ' + pr(pApprox) + ', se puede reportar con tranquilidad frente al exacto de ' + pr(pExact) + '.'
            : 'Alguna de las dos cifras no llega a diez, así que la campana está aproximando una distribución todavía asimétrica: el valor p aproximado da ' + pr(pApprox) + ' mientras el exacto da ' + pr(pExact) + ', y esa brecha de ' + pr(gap) + ' puede mover una decisión de un lado a otro de la frontera.') +
        ' La regla es sencilla: los diez casos y los diez no casos se cuentan con la proporción afirmada, no con la observada, porque toda la prueba se calcula dentro del mundo donde la afirmación es cierta. Baja los expedientes o baja la proporción afirmada y verás cómo las barras se recorren hacia la izquierda y la campana empieza a sobrar por el lado de los valores negativos, que no existen en un conteo.'
      : '<strong>Business reading:</strong> with ' + intN(n) + ' files and a claimed proportion of ' + dec1(state.p0) + ' percent, ' + dec1(np) + ' cases and ' + dec1(nq) + ' non cases are expected. ' +
        (ok ? 'Both figures reach ten, so the bell is an acceptable approximation and the approximate p value, ' + pr(pApprox) + ', can be reported with confidence next to the exact ' + pr(pExact) + '.'
            : 'One of the two figures falls short of ten, so the bell is approximating a distribution that is still skewed: the approximate p value gives ' + pr(pApprox) + ' while the exact one gives ' + pr(pExact) + ', and that gap of ' + pr(gap) + ' can move a decision from one side of the boundary to the other.') +
        ' The rule is simple: the ten cases and the ten non cases are counted with the claimed proportion, not with the observed one, because the whole test is computed inside the world where the claim is true. Lower the files or lower the claimed proportion and you will see the bars slide to the left while the bell starts spilling over into negative values, which do not exist in a count.';
    var g = fitCanvas(host.querySelector('#c3cv'), 170);
    drawBinomial(g, n, p0, x, {
      bars: (es ? 'Binomial exacta' : 'Exact binomial'),
      obs:  (es ? 'Observado ' : 'Observed ') + intN(x)
    });
  }
  widgets.push(mount);
  mount();
}

function widgetIntervalProp(phat, n0, claimPct0, conf0) {
  var host = document.createElement('div');
  host.className = 'section';
  document.getElementById('lessonBody').appendChild(host);
  var loPct = Math.max(1, Math.round(phat * 100) - 12);
  var hiPct = Math.min(99, Math.round(phat * 100) + 12);
  var state = { n: n0, claim: Math.max(loPct, Math.min(hiPct, claimPct0)), conf: conf0 };
  function mount() {
    var es = LANG === 'es';
    host.innerHTML =
      '<div class="gcrd" data-widget="intervalo-y-decision-para-una-proporcion">' +
        '<div class="iw-head"><span class="iw-tag">' + (es ? 'Herramienta' : 'Tool') + '</span>' +
        '<span class="iw-title">' + (es ? 'El intervalo ya contiene la decisión' : 'The interval already holds the decision') + '</span></div>' +
        '<div class="iw-sub">' + (es
          ? 'Una plataforma de pagos observó que ' + pct1(phat) + ' por ciento de los usuarios de su muestra activó una función nueva. La barra verde es el intervalo de confianza para la proporción real y el marcador es la cifra que alguien afirma. Arrastra esa cifra dentro y fuera de la barra y observa la decisión de la prueba de dos colas. Ojo con el detalle fino: el intervalo usa la proporción observada en su error estándar y la prueba usa la afirmada, así que en los casos que caen justo sobre la frontera las dos herramientas pueden separarse por muy poco.'
          : 'A payments platform observed that ' + pct1(phat) + ' percent of the users in its sample switched on a new feature. The green bar is the confidence interval for the true proportion and the marker is the figure somebody claims. Drag that figure inside and outside the bar and watch the decision of the two tailed test. Mind the fine detail: the interval uses the observed proportion in its standard error and the test uses the claimed one, so in cases landing right on the boundary the two tools can part ways by a hair.') + '</div>' +
        '<div class="cgrid"><div class="cg">' +
          '<label>' + (es ? 'Proporción afirmada en por ciento' : 'Claimed proportion in percent') + ': <span class="cval" id="d4cl"></span></label>' +
          '<input type="range" min="' + loPct + '" max="' + hiPct + '" step="1" id="d4c" value="' + state.claim + '">' +
        '</div><div class="cg">' +
          '<label>' + (es ? 'Usuarios en la muestra' : 'Users in the sample') + ': <span class="cval" id="d4nl"></span></label>' +
          '<input type="range" min="50" max="1200" step="25" id="d4n" value="' + state.n + '">' +
        '</div></div>' +
        '<div class="cgrid"><div class="cg">' +
          '<label>' + (es ? 'Nivel de confianza en por ciento' : 'Confidence level in percent') + ': <span class="cval" id="d4fl"></span></label>' +
          '<input type="range" min="80" max="99" step="1" id="d4f" value="' + state.conf + '">' +
        '</div><div class="cg">' +
          '<label>' + (es ? 'Marcador' : 'Marker') + '</label>' +
          '<div style="font-size:.74rem;color:var(--text3)">' + (es ? 'Verde si la afirmación sobrevive, rojo si el intervalo la deja fuera' : 'Green if the claim survives, red if the interval leaves it out') + '</div>' +
        '</div></div>' +
        '<canvas class="iw-canvas" id="d4cv"></canvas>' +
        '<div class="metrics">' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Error estándar del intervalo' : 'Standard error of the interval') + '</div><div class="mnum ts" id="d4se"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Margen de error' : 'Margin of error') + '</div><div class="mnum ts" id="d4me"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Límite inferior' : 'Lower bound') + '</div><div class="mnum cs" id="d4lo"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Límite superior' : 'Upper bound') + '</div><div class="mnum cs" id="d4hi"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Valor p de dos colas' : 'Two tailed p value') + '</div><div class="mnum ps" id="d4p"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Decisión de la prueba' : 'Decision of the test') + '</div><div class="mnum cs" id="d4dec"></div></div>' +
        '</div>' +
        '<div class="iw-read" id="d4read"></div>' +
      '</div>';
    host.querySelector('#d4c').addEventListener('input', function() { state.claim = parseInt(this.value, 10); update(); });
    host.querySelector('#d4n').addEventListener('input', function() { state.n     = parseInt(this.value, 10); update(); });
    host.querySelector('#d4f').addEventListener('input', function() { state.conf  = parseInt(this.value, 10); update(); });
    update();
  }
  function update() {
    var es = LANG === 'es';
    var al = 1 - state.conf / 100;
    var claim = state.claim / 100;
    var seHat = sePropHat(phat, state.n);
    var zc = zTwo(al);
    var me = zc * seHat;
    var loB = phat - me, hiB = phat + me;
    var z = (phat - claim) / seProp(claim, state.n);
    var p = pTwo(z);
    var inside = claim >= loB && claim <= hiB;
    var rejects = p <= al;
    host.querySelector('#d4cl').textContent  = dec1(state.claim);
    host.querySelector('#d4nl').textContent  = intN(state.n);
    host.querySelector('#d4fl').textContent  = intN(state.conf);
    host.querySelector('#d4se').textContent  = pr(seHat);
    host.querySelector('#d4me').textContent  = pct2(me);
    host.querySelector('#d4lo').textContent  = pct2(loB);
    host.querySelector('#d4hi').textContent  = pct2(hiB);
    host.querySelector('#d4p').textContent   = pr(p);
    host.querySelector('#d4dec').textContent = rejects
      ? (es ? 'Se rechaza' : 'Reject') : (es ? 'No se rechaza' : 'Do not reject');
    host.querySelector('#d4read').innerHTML = es
      ? '<strong>Lectura de negocio:</strong> con ' + intN(state.n) + ' usuarios el margen de error al ' + intN(state.conf) + ' por ciento vale ' + pct2(me) + ', así que el intervalo va de ' + pct2(loB) + ' a ' + pct2(hiB) + '. La cifra afirmada, ' + dec1(state.claim) + ' por ciento, queda ' + (inside ? 'dentro' : 'fuera') + ' de ese rango, y la prueba de dos colas con un nivel de significancia de ' + dec1(100 - state.conf) + ' por ciento ' + (rejects ? 'la rechaza' : 'no la rechaza') + ', con un valor p de ' + pr(p) + '. ' + (inside === !rejects ? 'Las dos herramientas coinciden, que es lo habitual.' : 'Aquí las dos herramientas se separan, y ese es justo el caso frontera que conviene conocer: el intervalo mide con la proporción observada y la prueba con la afirmada.') + ' La diferencia de fondo está en lo que aportan a una junta: la prueba entrega un sí o un no, y el intervalo entrega además el rango de proporciones que la evidencia deja en pie, que es lo que se necesita para presupuestar. Angosta la muestra y verás cómo el intervalo se ensancha hasta volver compatible casi cualquier afirmación.'
      : '<strong>Business reading:</strong> with ' + intN(state.n) + ' users the margin of error at ' + intN(state.conf) + ' percent is ' + pct2(me) + ', so the interval runs from ' + pct2(loB) + ' to ' + pct2(hiB) + '. The claimed figure, ' + dec1(state.claim) + ' percent, falls ' + (inside ? 'inside' : 'outside') + ' that range, and the two tailed test at a significance level of ' + dec1(100 - state.conf) + ' percent ' + (rejects ? 'rejects it' : 'does not reject it') + ', with a p value of ' + pr(p) + '. ' + (inside === !rejects ? 'The two tools agree, which is the usual case.' : 'Here the two tools part ways, and that is precisely the boundary case worth knowing: the interval measures with the observed proportion and the test with the claimed one.') + ' The deeper difference is what they bring to a meeting: the test hands over a yes or a no, and the interval also hands over the range of proportions the evidence leaves standing, which is what budgeting needs. Shrink the sample and watch the interval widen until almost any claim becomes compatible with the data.';
    var g = fitCanvas(host.querySelector('#d4cv'), 150);
    drawIntervalBar(g, loB, hiB, phat, claim, function(v) { return pct2(v); }, {
      claim: (es ? 'Afirmación ' : 'Claim ') + dec1(state.claim) + '%',
      band:  (es ? 'Intervalo al ' + intN(state.conf) + ' por ciento' : 'Interval at ' + intN(state.conf) + ' percent')
    });
  }
  widgets.push(mount);
  mount();
}

function frac(a, b) {
