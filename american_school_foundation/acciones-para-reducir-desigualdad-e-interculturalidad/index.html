function cuadTab(which, btn){
  ['type', 'draw'].forEach(function(x){
    var el = document.getElementById('cuad_' + x);
    if (el) el.classList.toggle('active', x === which);
  });
  var wrap = document.getElementById('wCuaderno');
  if (wrap) wrap.querySelectorAll('.wtab').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  if (which === 'draw') setTimeout(function(){
    var c = document.getElementById('cuadCv');
    if (c && !c.width) initCanvas(c);
  }, 60);
}

function cuadSave(){
  var fb = document.getElementById('cuadFb');
  if (!fb) return;
  fb.className = 'wmsg ok';
  fb.innerHTML = S('Guardado. Lo que escribiste aquí es material para la próxima reunión de tu grupo.',
                   'Saved. What you wrote here is material for the next meeting of your class.');
}

/* ================================================
   buildLesson — concepto -> manipulativo -> problema, intercalado (Rule 1)
   C1 brecha y resultado    -> reparto (deslizador) -> P1, P2
   C2 medidas que emparejan -> clasificador         -> P3, P4
   C3 inclusion y ajustes   -> emparejador          -> P5, P6
   C4 interculturalidad     -> constructor          -> P7, P8
   C5 genero y evaluacion   -> cuaderno abierto     -> P9, P10
   ================================================ */
function buildLesson(rng) {
  problems = []; answeredCount = 0; correctCount = 0;
  document.getElementById('lessonBody').innerHTML = '';

  /* ── CONCEPTO 1 ─────────────────────────────────────────────── */
  addSection(S('CONCEPTO 1','CONCEPT 1'),
    '<h2>' + S('La misma regla no siempre da el mismo resultado','The same rule does not always give the same result') + '</h2>' +
    '<p>' + S('Que una regla trate igual a todas las personas es apenas el punto de partida. Esa es la igualdad formal: está escrita, se puede leer y no distingue a nadie. La pregunta que sigue es otra y es la que importa: al final del ciclo, ¿quiénes ejercieron de verdad ese derecho? Cuando dos grupos parten de condiciones distintas, una regla idéntica puede producir resultados muy desiguales sin que su texto diga nada discriminatorio.',
              'A rule treating every person the same is barely the starting point. That is formal equality: it is written, it can be read and it singles out nobody. The next question is a different one, and it is the one that matters: by the end of the year, who actually exercised that right? When two groups start from different conditions, an identical rule can produce very unequal results without its text saying anything discriminatory.') + '</p>' +
    '<p>' + S('La igualdad sustantiva mira ese resultado, y para eso hace falta medir. La brecha es la distancia entre lo que alcanza un grupo y lo que alcanza otro en un mismo derecho, y se expresa en puntos porcentuales. Un dato desagregado, es decir separado por sexo, por comunidad, por lengua o por condición de discapacidad, es lo que hace visible una desigualdad que el promedio general esconde.',
              'Substantive equality looks at that result, and for that you have to measure. A gap is the distance between what one group reaches and what another reaches in the same right, and it is expressed in percentage points. A disaggregated figure, meaning one separated by sex, community, language or disability, is what makes visible an inequality the overall average hides.') + '</p>' +
    '<div class="callout"><p><strong>' + S('Brecha: ','Gap: ') + '</strong>' +
      S('diferencia medible entre dos grupos en el mismo indicador. Si no se mide por separado, no se ve, y lo que no se ve no se corrige.',
        'a measurable difference between two groups on the same indicator. If it is not measured separately it is not seen, and what is not seen does not get corrected.') + '</p></div>' +
    '<div class="rules-grid">' +
      '<div class="rcard"><div class="rname">' + S('Igualdad formal','Formal equality') + '</div><div class="rform">' + S('¿qué dice la regla?','what does the rule say?') + '</div><div class="rnote">' + S('El mismo derecho enunciado para todas y todos.','The same right stated for everyone.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Igualdad sustantiva','Substantive equality') + '</div><div class="rform">' + S('¿quién lo ejerce?','who exercises it?') + '</div><div class="rnote">' + S('El derecho comprobado en el resultado de cada grupo.','The right verified in the result of each group.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Brecha','Gap') + '</div><div class="rform">' + S('¿de cuánto es la distancia?','how wide is the distance?') + '</div><div class="rnote">' + S('La resta entre los dos valores, en puntos porcentuales.','The subtraction between the two values, in percentage points.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Dato desagregado','Disaggregated figure') + '</div><div class="rform">' + S('¿separado por quién?','separated by whom?') + '</div><div class="rnote">' + S('Por sexo, comunidad, lengua o condición de discapacidad.','By sex, community, language or disability.') + '</div></div>' +
    '</div>' +
    buildReparto(rng));
  repRender();

  /* ── PROBLEMA 1 ─────────────────────────────────────────────── */
  addProblem(pick([
    { title:{ es:'Una regla igual, dos resultados', en:'One equal rule, two results' }, showWork:false,
      stmt:{ es:'El reglamento abre el laboratorio de cómputo a todo el estudiantado en el mismo horario, de 5 a 7 de la tarde. Al revisar quién asiste, el comité encuentra que casi ninguna estudiante del turno matutino llega, porque a esa hora cuidan a sus hermanos menores. ¿Qué muestra este caso?',
             en:'The rules open the computer lab to all students in the same time slot, from 5 to 7 in the afternoon. On reviewing who attends, the committee finds that almost no female student from the morning shift arrives, because at that hour they look after their younger siblings. What does this case show?' },
      options:{ es:[
        'Que una regla idéntica para todas y todos puede producir un resultado desigual cuando no considera las condiciones con las que cada grupo llega hasta ella.',
        'Que el reglamento del laboratorio discrimina de manera expresa, porque su texto establece requisitos distintos para las estudiantes y para los estudiantes.',
        'Que la desigualdad se corregirá sola en cuanto las estudiantes se organicen mejor para repartir su tiempo entre las tareas de la escuela y las de su casa.',
        'Que el laboratorio funciona bien, porque el horario está publicado con anticipación y cualquier persona que lo desee puede acudir en el momento indicado.' ],
        en:[
        'That an identical rule for everyone can produce an unequal result when it ignores the conditions each group brings with them to it.',
        'That the lab rules discriminate expressly, because their text sets different requirements for female and for male students.',
        'That the inequality will fix itself as soon as the students organize better to split their time between schoolwork and housework.',
        'That the lab works fine, because the schedule is published in advance and anyone who wishes may show up at the stated time.' ] },
      correct:0,
      hint:{ es:'Compara dos cosas distintas: lo que la regla dice y lo que la regla logra en cada grupo.',
             en:'Compare two different things: what the rule says and what the rule achieves in each group.' },
      explanation:{ es:'La regla es formalmente igual: mismo horario y misma puerta abierta. El resultado no lo es, porque un grupo llega con una carga de cuidados que el horario no consideró. Esa distancia entre la regla igual y el resultado desigual es justo lo que busca corregir la igualdad sustantiva, por ejemplo abriendo un horario dentro de la jornada. El texto no discrimina a nadie, y por eso el problema pasa inadvertido si solo se lee el reglamento.',
                    en:'The rule is formally equal: same hours and same open door. The result is not, because one group arrives with a care load the schedule never considered. That distance between the equal rule and the unequal result is exactly what substantive equality seeks to correct, for instance by opening a slot during school hours. The text discriminates against nobody, and that is why the problem goes unnoticed if you only read the rules.' } },
    { title:{ es:'Una regla igual, dos resultados', en:'One equal rule, two results' }, showWork:false,
      stmt:{ es:'Un municipio anuncia sus becas únicamente en su página de internet y en la oficina de la cabecera, con el mismo plazo para toda la juventud. Al cerrar la convocatoria, ninguna solicitud proviene de las tres comunidades más alejadas, donde casi no hay conexión ni transporte diario. ¿Qué muestra este caso?',
             en:'A town announces its grants only on its website and at the main office, with the same deadline for all young people. When applications close, not one comes from the three most distant communities, where there is almost no connection and no daily transport. What does this case show?' },
      options:{ es:[
        'Que una convocatoria idéntica para toda la juventud puede excluir a un grupo entero cuando el canal por el que se anuncia no llega hasta donde vive ese grupo.',
        'Que el municipio incumplió la ley al publicar la convocatoria, porque toda beca pública debe anunciarse por al menos cinco canales distintos.',
        'Que la juventud de esas comunidades no mostró interés suficiente en el programa, y por eso ninguna persona presentó su solicitud dentro del plazo.',
        'Que la convocatoria fue correcta, porque el plazo fue el mismo para todas las personas y la información estuvo disponible durante todo ese periodo.' ],
        en:[
        'That an identical call for all young people can exclude an entire group when the channel it is announced through does not reach where that group lives.',
        'That the town broke the law in publishing the call, because every public grant must be announced through at least five different channels.',
        'That young people in those communities showed no real interest in the program, and that is why nobody filed an application within the deadline.',
        'That the call was correct, because the deadline was the same for everyone and the information was available throughout that period.' ] },
      correct:0,
      hint:{ es:'Fíjate en el canal del anuncio y pregúntate hasta dónde llega, no en el texto de la convocatoria.',
             en:'Look at the channel of the announcement and ask how far it reaches, not at the text of the call.' },
      explanation:{ es:'El plazo y los requisitos fueron iguales para toda la juventud, pero la información viajó por un canal que no existe en tres comunidades. El resultado es una brecha completa: cero solicitudes de un grupo que sí tenía derecho. Corregirlo no exige cambiar la ley, sino agregar canales que sí lleguen, como el aviso en asamblea o el mensaje impreso. La ausencia de solicitudes es un dato sobre el diseño del anuncio, no sobre el interés de las personas.',
                    en:'The deadline and the requirements were the same for all young people, but the information traveled through a channel that does not exist in three communities. The result is a complete gap: zero applications from a group that did hold the right. Fixing it does not require changing the law, only adding channels that do arrive, such as an announcement in assembly or a printed message. The absence of applications is a figure about the design of the notice, not about the interest of those people.' } }
  ], rng), rng);

  /* ── PROBLEMA 2 ─────────────────────────────────────────────── */
  addProblem(pick([
    { title:{ es:'Dónde está la brecha mayor', en:'Where the widest gap is' }, showWork:true,
      stmt:{ es:'Un plantel comparó a dos grupos de estudiantes con dos indicadores del mismo ciclo. En asistencia regular, un grupo llegó a 92 % y el otro a 88 %. En conclusión del ciclo, el primero llegó a 62 % y el segundo a 41 %. ¿En qué indicador es mayor la brecha y de cuánto es?',
             en:'A school compared two groups of students on two indicators from the same year. In regular attendance, one group reached 92 % and the other 88 %. In completing the year, the first reached 62 % and the second 41 %. On which indicator is the gap wider, and how wide is it?' },
      options:{ es:[
        'En la conclusión del ciclo, con 21 puntos porcentuales de diferencia entre los dos grupos.',
        'En la asistencia regular, con 4 puntos porcentuales de diferencia entre los dos grupos.',
        'En la conclusión del ciclo, con 41 puntos porcentuales de diferencia entre los dos grupos.',
        'En la asistencia regular, con 21 puntos porcentuales de diferencia entre los dos grupos.' ],
        en:[
        'On completing the year, with 21 percentage points of difference between the two groups.',
        'On regular attendance, with 4 percentage points of difference between the two groups.',
        'On completing the year, with 41 percentage points of difference between the two groups.',
        'On regular attendance, with 21 percentage points of difference between the two groups.' ] },
      correct:0,
      hint:{ es:'La brecha de un indicador es la resta entre los dos valores de ese mismo indicador, y se expresa en puntos porcentuales.',
             en:'The gap on an indicator is the subtraction between the two values of that same indicator, expressed in percentage points.' },
      explanation:{ es:'En asistencia la diferencia es de 4 puntos porcentuales, porque 92 menos 88 da 4. En conclusión del ciclo es de 21 puntos, porque 62 menos 41 da 21. La brecha mayor está en la conclusión, y ese contraste dice algo importante: dos grupos pueden asistir casi igual y aun así terminar el ciclo de manera muy distinta, así que lo que los separa no está en la entrada sino en lo que ocurre dentro.',
                    en:'On attendance the difference is 4 percentage points, since 92 minus 88 gives 4. On completing the year it is 21 points, since 62 minus 41 gives 21. The wider gap is on completion, and that contrast says something important: two groups can attend almost equally and still finish the year very differently, so what separates them is not at the entrance but in what happens inside.' } },
    { title:{ es:'Dónde está la brecha mayor', en:'Where the widest gap is' }, showWork:true,
      stmt:{ es:'Un comité levantó datos en dos comunidades de la misma escuela. En contar con un espacio para estudiar en casa, una llegó a 54 % y la otra a 47 %. En contar con conexión a internet, la primera llegó a 78 % y la segunda a 35 %. ¿En qué indicador es mayor la brecha y de cuánto es?',
             en:'A committee gathered figures in two communities from the same school. On having a place to study at home, one reached 54 % and the other 47 %. On having an internet connection, the first reached 78 % and the second 35 %. On which indicator is the gap wider, and how wide is it?' },
      options:{ es:[
        'En la conexión a internet, con 43 puntos porcentuales de diferencia entre las dos comunidades.',
        'En el espacio para estudiar, con 7 puntos porcentuales de diferencia entre las dos comunidades.',
        'En la conexión a internet, con 35 puntos porcentuales de diferencia entre las dos comunidades.',
        'En el espacio para estudiar, con 43 puntos porcentuales de diferencia entre las dos comunidades.' ],
        en:[
        'On the internet connection, with 43 percentage points of difference between the two communities.',
        'On the place to study, with 7 percentage points of difference between the two communities.',
        'On the internet connection, with 35 percentage points of difference between the two communities.',
        'On the place to study, with 43 percentage points of difference between the two communities.' ] },
      correct:0,
      hint:{ es:'Calcula la resta dentro de cada indicador por separado y después compara las dos diferencias.',
             en:'Work out the subtraction inside each indicator separately and then compare the two differences.' },
      explanation:{ es:'En el espacio para estudiar la diferencia es de 7 puntos porcentuales, porque 54 menos 47 da 7. En la conexión a internet es de 43 puntos, porque 78 menos 35 da 43. La brecha mayor está en la conexión, y por eso una tarea que dependa de internet ampliará esa distancia en lugar de reducirla, mientras que el segundo indicador afecta a las dos comunidades de forma parecida.',
                    en:'On the place to study the difference is 7 percentage points, since 54 minus 47 gives 7. On the internet connection it is 43 points, since 78 minus 35 gives 43. The wider gap is on the connection, which is why homework that depends on the internet will widen that distance instead of reducing it, while the second indicator affects both communities in a similar way.' } }
  ], rng), rng);

  /* ── CONCEPTO 2 ─────────────────────────────────────────────── */
  addSection(S('CONCEPTO 2','CONCEPT 2'),
    '<h2>' + S('Medidas que emparejan la cancha','Measures that level the field') + '</h2>' +
    '<p>' + S('Cuando una brecha ya está documentada, declarar otra vez que todas las personas son iguales no la mueve. Lo que la mueve son medidas de nivelación: decisiones que cambian una condición concreta del acceso. Algunas se dirigen a quien enfrenta la desventaja, como reservar lugares por un tiempo definido; otras corrigen el diseño para todo el mundo, como abrir un segundo horario o agregar un canal de aviso.',
              'When a gap is already documented, declaring once again that all people are equal does not move it. What moves it are leveling measures: decisions that change a concrete condition of access. Some are aimed at whoever faces the disadvantage, such as reserving places for a defined period; others fix the design for everyone, such as opening a second time slot or adding an announcement channel.') + '</p>' +
    '<p>' + S('Una medida dirigida a un grupo se sostiene cuando cumple tres condiciones: parte de una desventaja documentada, dura un tiempo definido y se evalúa con un indicador que permite retirarla cuando la brecha se cierre. Sin esas tres, se vuelve discutible con razón. Y hay un tercer tipo de decisión que conviene reconocer a tiempo: la que solo declara buenas intenciones y deja el acceso exactamente igual que antes.',
              'A measure aimed at one group holds up when it meets three conditions: it starts from a documented disadvantage, it lasts a defined period, and it is evaluated with an indicator that allows withdrawing it once the gap closes. Without those three it becomes questionable, and rightly so. And there is a third kind of decision worth recognizing early: the one that only declares good intentions and leaves access exactly as it was.') + '</p>' +
    buildClasifica(rng));
  clsRender();

  /* ── PROBLEMA 3 ─────────────────────────────────────────────── */
  addProblem(pick([
    { title:{ es:'La medida que sí mueve el dato', en:'The measure that does move the figure' }, showWork:false,
      stmt:{ es:'Una escuela documentó que las estudiantes que cuidan a familiares faltan a los talleres de la tarde. El comité debe elegir una sola medida para el periodo que empieza. ¿Cuál reduce la brecha que el diagnóstico señala?',
             en:'A school documented that the students who care for relatives miss the afternoon workshops. The committee has to pick a single measure for the term that is starting. Which one reduces the gap the diagnosis points at?' },
      options:{ es:[
        'Abrir un segundo horario del mismo taller dentro de la jornada escolar y revisar al final del periodo cuántas de ellas lograron asistir.',
        'Dedicar la ceremonia de los lunes a reconocer el esfuerzo de las estudiantes que sí logran llegar a los talleres de la tarde.',
        'Colocar en la entrada un cartel que recuerde que los talleres están abiertos a todas y a todos en igualdad de condiciones.',
        'Pedir a cada estudiante del plantel un compromiso firmado de asistir al taller al menos una vez por semana.' ],
        en:[
        'Opening a second slot of the same workshop during school hours and reviewing at the end of the term how many of them managed to attend.',
        'Devoting the Monday ceremony to recognizing the effort of the students who do manage to reach the afternoon workshops.',
        'Putting a sign at the entrance recalling that the workshops are open to everyone on equal terms.',
        'Asking every student in the school for a signed commitment to attend the workshop at least once a week.' ] },
      correct:0,
      hint:{ es:'Pregúntate cuál de las cuatro cambia la condición que el diagnóstico encontró, y cuál solo habla de ella.',
             en:'Ask which of the four changes the condition the diagnosis found, and which one only talks about it.' },
      explanation:{ es:'El diagnóstico no dice que falte información ni voluntad: dice que a esa hora esas estudiantes están cuidando. Solo la primera medida toca esa condición, y además deja un dato comparable para saber si funcionó. Reconocer a quienes ya asisten premia a quien no tenía el obstáculo, el cartel repite una regla que ya existía, y el compromiso firmado traslada a cada estudiante un problema que no depende de su voluntad.',
                    en:'The diagnosis does not say that information or willingness is missing: it says that at that hour those students are providing care. Only the first measure touches that condition, and it also leaves a comparable figure to tell whether it worked. Recognizing those who already attend rewards whoever never had the obstacle, the sign repeats a rule that already existed, and the signed commitment hands each student a problem that does not depend on their willingness.' } },
    { title:{ es:'La medida que sí mueve el dato', en:'The measure that does move the figure' }, showWork:false,
      stmt:{ es:'Un municipio documentó que ninguna solicitud de beca proviene de las comunidades sin conexión a internet, donde la convocatoria solo se publicó en línea. El cabildo debe elegir una sola medida para la siguiente convocatoria. ¿Cuál reduce la brecha que el diagnóstico señala?',
             en:'A town documented that no grant application comes from the communities with no internet connection, where the call was published only online. The council has to pick a single measure for the next call. Which one reduces the gap the diagnosis points at?' },
      options:{ es:[
        'Anunciar la convocatoria además en asamblea comunitaria y por mensaje impreso, y contar al cierre cuántas solicitudes llegaron de esas comunidades.',
        'Publicar la convocatoria en línea con mayor anticipación y con un diseño más claro para que se entienda mejor en toda la región.',
        'Difundir un mensaje del cabildo a favor de la igualdad de oportunidades entre la juventud del municipio durante el mes de la convocatoria.',
        'Ampliar el plazo de la convocatoria dos semanas más, manteniendo la publicación únicamente en la página de internet del municipio.' ],
        en:[
        'Announcing the call in community assembly and by printed message as well, and counting at the close how many applications came from those communities.',
        'Publishing the call online further in advance and with a clearer design so it is better understood across the region.',
        'Spreading a message from the council in favor of equal opportunity among young people during the month of the call.',
        'Extending the deadline by two more weeks, keeping publication only on the town website.' ] },
      correct:0,
      hint:{ es:'El obstáculo documentado no es el tiempo ni el diseño: es por dónde viaja el aviso.',
             en:'The documented obstacle is neither time nor design: it is the path the notice travels.' },
      explanation:{ es:'Si el aviso viaja solo por internet y esas comunidades no tienen conexión, mejorar el diseño, ampliar el plazo o difundir un mensaje de apoyo deja el problema intacto: la información sigue sin llegar. Agregar canales que sí existen ahí cambia la condición que produce la brecha, y contar las solicitudes recibidas permite comprobar en la siguiente convocatoria si la medida sirvió.',
                    en:'If the notice travels only over the internet and those communities have no connection, improving the design, extending the deadline or spreading a supportive message leaves the problem untouched: the information still does not arrive. Adding channels that do exist there changes the condition producing the gap, and counting the applications received makes it possible to check on the next call whether the measure worked.' } }
  ], rng), rng);

  /* ── PROBLEMA 4 ─────────────────────────────────────────────── */
  addProblem(pick([
    { title:{ es:'Trato distinto, resultado parejo', en:'Different treatment, level result' }, showWork:false,
      stmt:{ es:'Un municipio reserva durante tres ciclos la mitad de las becas de un programa técnico para estudiantes de las comunidades con menor conclusión, y se compromete a revisar ese indicador cada año. En la asamblea alguien objeta que la medida es injusta porque no trata a todas las personas por igual. ¿Qué responde mejor a esa objeción?',
             en:'A town reserves for three years half the grants of a technical program for students from the communities with the lowest completion, and commits to reviewing that indicator every year. In the assembly someone objects that the measure is unfair because it does not treat everyone the same. What is the best answer to that objection?' },
      options:{ es:[
        'Que la medida trata distinto a quienes parten de una desventaja documentada, se aplica por un tiempo definido y se retira cuando el indicador muestre que la brecha se cerró.',
        'Que el municipio puede repartir sus becas con el criterio que decida, porque quien financia un programa no está obligado a justificar cómo lo distribuye.',
        'Que ninguna medida puede ser injusta si beneficia a quienes tienen menos, sin importar con qué datos se sustente ni cuánto tiempo permanezca vigente.',
        'Que el trato igual es siempre preferible, y por eso lo correcto sería repartir las becas entre todas las comunidades del municipio en partes iguales.' ],
        en:[
        'That the measure treats differently those starting from a documented disadvantage, applies for a defined period and is withdrawn once the indicator shows the gap has closed.',
        'That the town may hand out its grants on whatever criterion it decides, because whoever funds a program is not obliged to justify how it is distributed.',
        'That no measure can be unfair if it benefits those who have less, regardless of what figures support it or how long it stays in force.',
        'That equal treatment is always preferable, and therefore the right thing would be to split the grants among all communities of the town in equal parts.' ] },
      correct:0,
      hint:{ es:'Una medida dirigida a un grupo se defiende por tres cosas a la vez: en qué dato se apoya, cuánto dura y cómo se evalúa.',
             en:'A measure aimed at one group is defended by three things at once: what figure backs it, how long it lasts and how it is evaluated.' },
      explanation:{ es:'La objeción confunde trato igual con resultado igual. La reserva de lugares se justifica porque hay una desventaja medida, no por simpatía hacia un grupo, y por eso incluye plazo y evaluación: cuando el indicador se empareje, la medida deja de tener sentido y se retira. Sin dato, sin plazo y sin evaluación la crítica sería válida, y repartir en partes iguales conservaría la distancia que ya existía.',
                    en:'The objection confuses equal treatment with equal result. Reserving places is justified because there is a measured disadvantage, not out of sympathy toward a group, and that is why it includes a deadline and an evaluation: once the indicator levels out, the measure stops making sense and is withdrawn. With no figure, no deadline and no evaluation the criticism would be valid, and splitting in equal parts would preserve the distance that already existed.' } },
    { title:{ es:'Trato distinto, resultado parejo', en:'Different treatment, level result' }, showWork:false,
      stmt:{ es:'Una escuela reparte 60 apoyos de transporte y decide entregar 40 a las comunidades alejadas y 20 al resto, después de comprobar que la asistencia difiere entre ambos grupos. Un padre de familia reclama que el reparto debió ser mitad y mitad. ¿Qué respuesta sostiene mejor la decisión de la escuela?',
             en:'A school hands out 60 transport supports and decides to give 40 to the distant communities and 20 to the rest, after checking that attendance differs between the two groups. A parent complains that the split should have been half and half.  What answer best supports the decision of the school?' },
      options:{ es:[
        'Que un reparto mitad y mitad habría conservado la distancia inicial, y que el reparto desigual se calculó para emparejar la asistencia de los dos grupos.',
        'Que las comunidades alejadas siempre deben recibir más apoyos que el resto, porque enfrentan mayores dificultades en todos los aspectos de la vida escolar.',
        'Que el reparto lo decidió la dirección del plantel y no corresponde a las familias discutir los criterios técnicos con los que se asignan los apoyos.',
        'Que la escuela repartió más apoyos donde hay más estudiantes inscritos, y por eso el resultado final es proporcional al tamaño de cada grupo.' ],
        en:[
        'That a half and half split would have preserved the initial distance, and that the uneven split was worked out to level the attendance of both groups.',
        'That the distant communities must always receive more supports than the rest, because they face greater difficulties in every aspect of school life.',
        'That the split was decided by the school management and it is not for families to discuss the technical criteria by which supports are assigned.',
        'That the school gave more supports where more students are enrolled, so the final result is proportional to the size of each group.' ] },
      correct:0,
      hint:{ es:'Piensa qué habría pasado con la diferencia entre los dos grupos si cada uno recibía 30 apoyos.',
             en:'Think what would have happened to the difference between the two groups if each had received 30 supports.' },
      explanation:{ es:'Repartir por partes iguales suma lo mismo a cada lado y deja la distancia de origen casi intacta. El reparto desigual no es un favor: es el cálculo que iguala el resultado, y se sostiene porque parte de un dato de asistencia comprobado. Decir que un grupo siempre debe recibir más abandona ese dato, apelar a la autoridad no responde a la objeción, y el tamaño del grupo no es el criterio que se usó.',
                    en:'Splitting in equal parts adds the same to each side and leaves the starting distance almost untouched. The uneven split is not a favor: it is the calculation that equalizes the result, and it holds up because it starts from a verified attendance figure. Saying that one group must always receive more abandons that figure, appealing to authority does not answer the objection, and the size of the group is not the criterion that was used.' } }
  ], rng), rng);

  /* ── CONCEPTO 3 ─────────────────────────────────────────────── */
  addSection(S('CONCEPTO 3','CONCEPT 3'),
    '<h2>' + S('Inclusión: cambia el entorno, no la persona','Inclusion: change the setting, not the person') + '</h2>' +
    '<p>' + S('Aceptar a alguien no es lo mismo que incluirlo. Cuando una escuela inscribe a un estudiante y deja el edificio, los horarios y las prácticas tal como estaban, lo que hace es integrarlo: la persona entra y carga sola con la adaptación. La inclusión invierte esa lógica y pregunta qué del entorno está impidiendo participar, para modificarlo. Separar a alguien en un espacio aparte, en cambio, es segregación, aunque se presente como una atención especializada.',
              'Accepting someone is not the same as including them. When a school enrolls a student and leaves the building, the schedules and the practices as they were, what it does is integrate them: the person walks in and carries the adaptation alone. Inclusion reverses that logic and asks what in the setting is preventing participation, in order to modify it. Separating someone into a place apart, by contrast, is segregation, even when it is presented as specialized attention.') + '</p>' +
    '<p>' + S('El nombre técnico de esa modificación es ajuste razonable: un cambio concreto que quita la barrera sin rebajar lo que se espera que la persona aprenda. Las barreras no siempre son escalones. Pueden ser de comunicación, cuando la clase solo existe en una lengua; económicas, cuando participar exige un gasto; de horario, cuando la actividad choca con las tareas de cuidado; y actitudinales, cuando el trato del grupo hace insostenible quedarse.',
              'The technical name for that modification is reasonable accommodation: a concrete change that removes the barrier without lowering what the person is expected to learn. Barriers are not always steps. They can be about communication, when the class exists in only one language; economic, when taking part demands an expense; about schedule, when the activity clashes with care duties; and attitudinal, when the way the group behaves makes staying unsustainable.') + '</p>' +
    '<div class="callout"><p><strong>' + S('Ajuste razonable: ','Reasonable accommodation: ') + '</strong>' +
      S('cambio concreto en el entorno que permite participar en igualdad. No baja el nivel de lo exigido: quita lo que estorbaba.',
        'a concrete change in the setting that allows taking part on equal terms. It does not lower the bar: it removes what was in the way.') + '</p></div>' +
    buildBarreras(rng));
  barRender();

  /* ── PROBLEMA 5 ─────────────────────────────────────────────── */
  addProblem(pick([
    { title:{ es:'El ajuste que corresponde', en:'The right accommodation' }, showWork:false,
      stmt:{ es:'En un grupo hay una estudiante sorda que se comunica en lengua de señas. La clase de historia se imparte hablando y se evalúa con exposiciones orales frente al grupo. La escuela debe decidir qué hará. ¿Qué decisión corresponde a una educación inclusiva?',
             en:'In one class there is a deaf student who communicates in sign language. The history class is taught by speaking and assessed with oral presentations in front of the class. The school has to decide what to do. Which decision matches inclusive education?' },
      options:{ es:[
        'Contar con interpretación en lengua de señas, entregar los materiales por escrito y permitir que presente la evaluación en su lengua, con los mismos contenidos que el resto.',
        'Sentarla en la primera fila para que alcance a ver mejor al profesor y pedir a sus compañeras que le presten sus apuntes al terminar cada clase.',
        'Eximirla de la exposición oral y calificarla únicamente con los trabajos escritos que el resto del grupo entrega durante el periodo.',
        'Ubicarla en un grupo aparte junto con otras personas sordas, donde el ritmo de la clase pueda ajustarse a las necesidades de todas ellas.' ],
        en:[
        'Providing sign language interpreting, handing out the materials in writing and letting her give the assessment in her language, with the same content as the rest.',
        'Seating her in the front row so she can see the teacher better and asking her classmates to lend her their notes at the end of each class.',
        'Exempting her from the oral presentation and grading her only with the written work the rest of the class hands in during the term.',
        'Placing her in a separate group with other deaf people, where the pace of the class can be adjusted to the needs of all of them.' ] },
      correct:0,
      hint:{ es:'Un ajuste razonable quita la barrera y conserva intacto lo que se espera que la estudiante aprenda.',
             en:'A reasonable accommodation removes the barrier and keeps intact what the student is expected to learn.' },
      explanation:{ es:'La barrera es de comunicación, así que el ajuste tiene que actuar sobre la lengua en que ocurre la clase y la evaluación. La primera opción hace eso y mantiene el mismo contenido exigido. Prestar apuntes deja la clase igual y traslada el esfuerzo a sus compañeras. Eximirla de la exposición le rebaja lo aprendido y no quita la barrera. Y mandarla a un grupo aparte es segregación, aunque se presente como una atención más adecuada.',
                    en:'The barrier is about communication, so the accommodation has to act on the language in which the class and the assessment happen. The first option does that and keeps the same required content. Lending notes leaves the class as it was and shifts the effort onto her classmates. Exempting her from the presentation lowers what she learns and does not remove the barrier. And sending her to a separate group is segregation, even when presented as more suitable attention.' } },
    { title:{ es:'El ajuste que corresponde', en:'The right accommodation' }, showWork:false,
      stmt:{ es:'Un estudiante con discapacidad motriz usa silla de ruedas y tiene todas las materias del segundo año programadas en el primer piso, al que solo se llega por escaleras. El acceso tardará un ciclo en construirse. ¿Qué decisión corresponde a una educación inclusiva?',
             en:'A student with a motor disability uses a wheelchair and has every second year subject scheduled on the upper floor, reachable only by stairs. The access will take a year to build. Which decision matches inclusive education?' },
      options:{ es:[
        'Reprogramar esas materias en aulas de la planta baja mientras se construye el acceso, con una fecha comprometida de entrega y revisión.',
        'Organizar turnos de compañeros que lo suban por las escaleras al inicio de cada clase y lo bajen al terminar la jornada escolar.',
        'Inscribirlo en la modalidad a distancia durante ese ciclo para que no dependa del edificio mientras avanza la obra del acceso.',
        'Reducirle la carga de materias a las que sí se imparten en la planta baja y recuperar las restantes cuando la obra quede terminada.' ],
        en:[
        'Rescheduling those subjects in ground floor rooms while the access is built, with a committed date for delivery and review.',
        'Organizing shifts of classmates to carry him up the stairs at the start of each class and down at the end of the school day.',
        'Enrolling him in the distance mode during that year so he does not depend on the building while the access work advances.',
        'Cutting his subject load down to those taught on the ground floor and making up the rest once the work is finished.' ] },
      correct:0,
      hint:{ es:'Pregúntate cuál de las cuatro cambia el entorno y cuáles trasladan el costo al estudiante o a sus compañeros.',
             en:'Ask which of the four changes the setting and which ones shift the cost onto the student or the classmates.' },
      explanation:{ es:'El ajuste razonable actúa sobre el entorno y es inmediato: si el acceso tardará, las clases bajan mientras tanto y el compromiso queda con fecha. Cargarlo por las escaleras lo expone y depende de la buena voluntad diaria de otras personas. Mandarlo a distancia lo saca del grupo, y reducirle materias le recorta el derecho a aprender lo mismo. En los tres casos el edificio se queda igual y el costo lo paga él.',
                    en:'The reasonable accommodation acts on the setting and is immediate: if the access will take time, the classes come downstairs meanwhile and the commitment carries a date. Carrying him up the stairs exposes him and depends on the daily goodwill of other people. Sending him to distance learning takes him out of the group, and cutting his subjects trims his right to learn the same as everyone. In all three the building stays as it was and he pays the cost.' } }
  ], rng), rng);

  /* ── PROBLEMA 6 ─────────────────────────────────────────────── */
  addProblem(pick([
    { title:{ es:'Aceptar no es incluir', en:'Accepting is not including' }, showWork:false,
      stmt:{ es:'Un plantel aceptó inscribir a estudiantes con discapacidad motriz, mantuvo la única rampa hacia la planta baja y programó todas las materias del segundo año en el primer piso. La dirección afirma que ya es una escuela inclusiva porque nadie fue rechazado. ¿Cómo se describe mejor esa situación?',
             en:'A school agreed to enroll students with motor disabilities, kept the single ramp to the ground floor and scheduled every second year subject on the upper floor. The management states it is already an inclusive school because nobody was turned away. How is that situation best described?' },
      options:{ es:[
        'Es integración y no inclusión: se admitió a las personas sin modificar el entorno, así que la barrera sigue decidiendo a qué clases pueden llegar.',
        'Es inclusión plena, porque la escuela abrió la inscripción sin poner ninguna condición adicional a quienes usan silla de ruedas.',
        'Es discriminación directa, porque la dirección decidió de manera expresa impedir el paso de esas estudiantes hacia el primer piso del edificio.',
        'Es una situación provisional sin consecuencias, ya que las materias del segundo año podrán cursarse en cuanto el edificio se renueve por completo.' ],
        en:[
        'It is integration, not inclusion: people were admitted without modifying the setting, so the barrier still decides which classes they can reach.',
        'It is full inclusion, because the school opened enrollment without setting any additional condition for those who use a wheelchair.',
        'It is direct discrimination, because the management expressly decided to block those students from reaching the upper floor of the building.',
        'It is a provisional situation with no consequences, since the second year subjects can be taken as soon as the building is fully renovated.' ] },
      correct:0,
      hint:{ es:'Fíjate en qué cambió cuando llegaron esas estudiantes: ¿el edificio y el horario, o solo la lista de inscripción?',
             en:'Look at what changed when those students arrived: the building and the schedule, or only the enrollment list?' },
      explanation:{ es:'Inscribir sin cambiar nada es integrar: la puerta se abre y la adaptación queda del lado de la persona. Aquí el horario del segundo año, combinado con el acceso, decide a qué clases puede llegar, y ese efecto se produce sin que nadie lo haya decidido de manera expresa, así que no es discriminación directa. Tampoco es provisional, porque durante todo un ciclo hay materias a las que no se puede asistir.',
                    en:'Enrolling without changing anything is integrating: the door opens and the adaptation stays on the side of the person. Here the second year schedule, combined with the access, decides which classes can be reached, and that effect is produced without anyone deciding it expressly, so it is not direct discrimination. Nor is it provisional, because for a whole year there are subjects that cannot be attended.' } },
    { title:{ es:'Aceptar no es incluir', en:'Accepting is not including' }, showWork:false,
      stmt:{ es:'Una escuela recibió a varios estudiantes recién llegados de otro país que hablan poco español y los concentró en un salón aparte, con contenidos más sencillos y sin actividades con el resto del plantel. La dirección lo presenta como una atención adecuada a su nivel. ¿Cómo se describe mejor esa situación?',
             en:'A school took in several students newly arrived from another country who speak little Spanish and gathered them in a separate room, with simpler content and no activities with the rest of the school. The management presents it as attention suited to their level. How is that situation best described?' },
      options:{ es:[
        'Es segregación: se les separó del grupo y se les redujo el contenido, en lugar de acompañarlos en la lengua manteniendo lo que se espera que aprendan.',
        'Es inclusión bien entendida, porque la escuela adaptó el contenido al nivel real con el que esos estudiantes llegaron al plantel.',
        'Es integración, porque los estudiantes fueron aceptados en la escuela y comparten con el resto los espacios comunes durante los recesos.',
        'Es una medida de nivelación temporal, porque busca compensar una desventaja de origen que esos estudiantes traen consigo desde su llegada.' ],
        en:[
        'It is segregation: they were separated from the class and their content was cut, instead of supporting them in language while keeping what they are expected to learn.',
        'It is inclusion properly understood, because the school adapted the content to the real level those students had when they arrived.',
        'It is integration, because the students were accepted into the school and share the common areas with everyone else during breaks.',
        'It is a temporary leveling measure, because it seeks to compensate a disadvantage of origin those students bring with them from their arrival.' ] },
      correct:0,
      hint:{ es:'Separa dos cosas: dónde ocurre la clase y qué se espera que aprendan. Aquí cambiaron las dos.',
             en:'Separate two things: where the class happens and what they are expected to learn. Here both changed.' },
      explanation:{ es:'El acompañamiento en la lengua es necesario, pero puede darse dentro del grupo y sin recortar contenidos. Al apartarlos y bajar lo exigido se produce segregación: la desigualdad de origen se convierte en una trayectoria escolar distinta. Una medida de nivelación agrega apoyo sin quitar contenido, y por eso este arreglo no lo es, aunque se presente como una atención adecuada.',
                    en:'Language support is necessary, but it can be given inside the class and without cutting content. Setting them apart and lowering the bar produces segregation: the disadvantage of origin turns into a different school path. A leveling measure adds support without removing content, which is why this arrangement is not one, even when presented as suitable attention.' } }
  ], rng), rng);

  /* ── CONCEPTO 4 ─────────────────────────────────────────────── */
  addSection(S('CONCEPTO 4','CONCEPT 4'),
    '<h2>' + S('Interculturalidad: una relación entre iguales','Interculturality: a relationship between equals') + '</h2>' +
    '<p>' + S('Que en un mismo lugar convivan varias culturas es un hecho, y se le llama multiculturalidad. La interculturalidad es algo más exigente: es la relación entre ellas en condiciones de igualdad, con intercambio real y con decisiones compartidas. Su contrario más común no es el rechazo abierto, sino la asimilación, que consiste en aceptar a las personas siempre que dejen de lado su lengua y sus formas de vida.',
              'That several cultures live in the same place is a fact, and it is called multiculturality. Interculturality is more demanding: it is the relationship between them on equal terms, with real exchange and shared decisions. Its most common opposite is not open rejection, but assimilation, which means accepting people as long as they set aside their language and their ways of life.') + '</p>' +
    '<p>' + S('También conviene reconocer la folclorización: reducir una cultura a un festival de bailes, comida y vestimenta una vez al año, mientras el resto del calendario su lengua no aparece en ningún aviso y sus hablantes no deciden nada. Una acción intercultural se reconoce por dos rasgos: la otra lengua y los otros saberes tienen lugar en la vida cotidiana, y quienes pertenecen a esa comunidad participan en decidir, no solo en recibir.',
              'It is also worth recognizing folklorization: reducing a culture to a festival of dances, food and dress once a year, while for the rest of the calendar its language appears in no notice and its speakers decide nothing. An intercultural action is recognized by two traits: the other language and the other knowledge have a place in daily life, and those who belong to that community take part in deciding, not only in receiving.') + '</p>' +
    '<div class="rules-grid">' +
      '<div class="rcard"><div class="rname">' + S('Multiculturalidad','Multiculturality') + '</div><div class="rform">' + S('¿quiénes están?','who is here?') + '</div><div class="rnote">' + S('Varias culturas en el mismo lugar, sin relación necesaria.','Several cultures in one place, with no relationship required.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Interculturalidad','Interculturality') + '</div><div class="rform">' + S('¿cómo se relacionan?','how do they relate?') + '</div><div class="rnote">' + S('Intercambio en igualdad y decisiones compartidas.','Exchange on equal terms and shared decisions.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Asimilación','Assimilation') + '</div><div class="rform">' + S('¿quién tiene que cambiar?','who has to change?') + '</div><div class="rnote">' + S('Se acepta a la persona si abandona lo suyo.','The person is accepted if they give up what is theirs.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Folclorización','Folklorization') + '</div><div class="rform">' + S('¿cuántos días al año?','how many days a year?') + '</div><div class="rnote">' + S('La cultura reducida a un evento y a un vestuario.','The culture reduced to an event and a costume.') + '</div></div>' +
    '</div>' +
    buildAccion(rng));
  actRender();

  /* ── PROBLEMA 7 ─────────────────────────────────────────────── */
  addProblem(pick([
    { title:{ es:'Más allá del festival', en:'Beyond the festival' }, showWork:false,
      stmt:{ es:'Una escuela con estudiantes hablantes de una lengua originaria organiza cada año una muestra de bailes, comida y vestimenta de esas comunidades. El resto del ciclo las clases y los avisos ocurren solo en español, y quien habla su lengua en el recreo recibe burlas. ¿Qué le falta a esa escuela para construir una relación intercultural?',
             en:'A school with students who speak an Indigenous language organizes each year a display of dances, food and dress from those communities. The rest of the year classes and notices happen only in Spanish, and whoever speaks their language at break is mocked. What is that school missing in order to build an intercultural relationship?' },
      options:{ es:[
        'Que esa lengua y esos saberes tengan lugar en la vida diaria de la escuela y que sus hablantes participen en las decisiones, no solo en un evento anual.',
        'Que la muestra se realice varias veces al año y con mayor presupuesto, para que toda la comunidad escolar conozca mejor esas tradiciones.',
        'Que se pida a las familias hablantes enseñar su lengua a los demás grupos durante las horas libres que deja el calendario escolar.',
        'Que la escuela ofrezca clases adicionales de español a esas estudiantes para que puedan seguir el ritmo del resto del grupo sin dificultad.' ],
        en:[
        'That the language and that knowledge have a place in the daily life of the school and that its speakers take part in decisions, not only in a yearly event.',
        'That the display be held several times a year and with a larger budget, so the whole school community gets to know those traditions better.',
        'That the families who speak the language be asked to teach it to the other classes during the free hours the school calendar leaves.',

      correct:0,
      hint:{ es:'La interculturalidad se comprueba en la relación cotidiana y en quién decide, no en el número de eventos.',
             en:'Interculturality is verified in the daily relationship and in who decides, not in the number of events.' },
      explanation:{ es:'Un festival anual puede convivir con la burla diaria porque no toca ni la lengua de la clase ni el trato en el recreo: eso es folclorización. Repetirlo más veces amplía el evento, no la relación. Pedir a las familias que enseñen en horas libres traslada el trabajo sin darles voz en las decisiones. Y las clases extra de español, sin nada más, apuntan a la asimilación: la persona se adapta y la escuela sigue igual.',
                    en:'A yearly festival can coexist with daily mockery because it touches neither the language of the class nor the treatment at break: that is folklorization. Repeating it more often expands the event, not the relationship. Asking families to teach in free hours shifts the work without giving them a voice in decisions. And extra Spanish classes, with nothing else, point toward assimilation: the person adapts and the school stays the same.' } },
    { title:{ es:'Más allá del festival', en:'Beyond the festival' }, showWork:false,
      stmt:{ es:'Un centro cultural del municipio dedica una semana al año a las comunidades migrantes que viven ahí, con música y cocina de sus países. Durante el resto del año, sus talleres se anuncian solo en español y ninguna persona migrante forma parte del consejo que decide la programación. ¿Qué le falta a ese centro para construir una relación intercultural?',
             en:'A town cultural center devotes one week a year to the migrant communities living there, with music and cooking from their countries. For the rest of the year its workshops are announced only in Spanish and no migrant person sits on the board that decides the programming. What is that center missing in order to build an intercultural relationship?' },
      options:{ es:[
        'Que esas comunidades participen en decidir la programación de todo el año y que la difusión ocurra también en sus lenguas de manera permanente.',
        'Que la semana dedicada a esas comunidades se extienda a un mes completo y se difunda con mayor anticipación en todo el municipio.',
        'Que el centro invite a esas comunidades a presentar su música en las fiestas patronales y en otros eventos abiertos del calendario local.',
        'Que se ofrezcan cursos de español gratuitos a las personas migrantes para que puedan participar en los talleres que ya existen.' ],
        en:[
        'That those communities take part in deciding the programming for the whole year and that publicity also happen in their languages on a permanent basis.',
        'That the week devoted to those communities be extended to a full month and be publicized further in advance across the town.',
        'That the center invite those communities to perform their music at the local festivities and other open events on the calendar.',
        'That free Spanish courses be offered to migrant people so they can take part in the workshops that already exist.' ] },
      correct:0,
      hint:{ es:'Pregunta quién decide la programación el resto del año, no cuántos días dura el evento.',
             en:'Ask who decides the programming the rest of the year, not how many days the event lasts.' },
      explanation:{ es:'Ampliar el evento o sumar presentaciones mantiene a esas comunidades en el papel de invitadas: aparecen en el escenario y no en la mesa donde se decide. La interculturalidad exige participación en la decisión y presencia de sus lenguas en la comunicación de todo el año. Los cursos de español son útiles, pero por sí solos piden que ellas se adapten mientras el centro conserva su forma de operar.',
                    en:'Expanding the event or adding performances keeps those communities in the role of guests: they appear on stage and not at the table where decisions are made. Interculturality demands taking part in the decision and the presence of their languages in year round communication. Spanish courses are useful, but on their own they ask those communities to adapt while the center keeps operating exactly as before.' } }
  ], rng), rng);

  /* ── PROBLEMA 8 ─────────────────────────────────────────────── */
  addProblem(pick([
    { title:{ es:'Quién decide la acción', en:'Who decides the action' }, showWork:false,
      stmt:{ es:'Un grupo de estudiantes quiere instalar señalización bilingüe en la escuela para que los avisos se lean también en la lengua originaria que hablan varias familias. ¿Qué decisión hace que la acción sea intercultural y no un adorno?',
             en:'A group of students wants to install bilingual signage in the school so that notices can also be read in the Indigenous language several families speak. Which decision makes the action intercultural rather than an ornament?' },

    { title:{ es:'Quién decide la acción', en:'Who decides the action' }, showWork:false,
      stmt:{ es:'Una escuela quiere reducir el abandono de las estudiantes que llegan de comunidades alejadas. El equipo docente ya redactó un plan completo y convoca a esas estudiantes a una reunión. ¿Qué decisión hace que el plan reduzca de verdad la brecha?',
             en:'A school wants to reduce the dropout of students arriving from distant communities. The teaching team has already drafted a complete plan and calls those students to a meeting. Which decision makes the plan actually reduce the gap?' },
      options:{ es:[
        'Reabrir el plan para que ellas señalen qué las hace abandonar y qué cambiarían, y ajustar las medidas con lo que digan antes de ponerlo en marcha.',
        'Presentarles el plan terminado y pedirles que opinen si les parece adecuado, para que el equipo sepa que la propuesta fue bien recibida.',

      correct:0,
      hint:{ es:'Pregúntate en qué momento entra la voz del grupo afectado: antes de decidir o después de decidido.',
             en:'Ask at what moment the voice of the affected group enters: before deciding, or after it is decided.' },
      explanation:{ es:'Participar significa poder cambiar el contenido de la decisión, y para eso la voz tiene que entrar mientras el plan todavía puede modificarse. Opinar sobre un plan cerrado, aplicarlo un ciclo entero antes de preguntar o traer a alguien que lo explique mejor son formas de informar. Además, quienes viven el problema conocen causas que el equipo docente no ve, como el horario del transporte o el costo de un material.',
                    en:'Taking part means being able to change the content of the decision, and for that the voice has to enter while the plan can still be modified. Giving an opinion on a closed plan, applying it for a whole year before asking, or bringing someone in to explain it better are ways of informing. Besides, those who live the problem know causes the teaching team cannot see, such as the transport schedule or the cost of a material.' } }
  ], rng), rng);

  /* ── CONCEPTO 5 ─────────────────────────────────────────────── */
  addSection(S('CONCEPTO 5','CONCEPT 5'),
    '<h2>' + S('Perspectiva de género y la prueba del dato','A gender lens and the test of the figure') + '</h2>' +
    '<p>' + S('Mirar con perspectiva de género es preguntar, ante cualquier actividad, si mujeres y hombres llegan a ella en las mismas condiciones y con qué costo. Casi siempre la respuesta aparece en dos lugares: el tiempo, porque las tareas de cuidado suelen recaer sobre unas más que sobre otros, y el trato dentro del grupo, que decide quién se queda y quién se va aunque el lugar ya estuviera asignado.',
              'Looking with a gender lens means asking, for any activity, whether women and men reach it under the same conditions and at what cost. The answer almost always shows up in two places: time, because care duties tend to fall on some more than on others, and treatment inside the group, which decides who stays and who leaves even when the place had already been assigned.') + '</p>' +
    '<p>' + S('Toda acción se cierra igual: comparando el indicador de antes con el de después, con los datos separados por grupo. Ese cierre distingue entre una acción que funcionó, una que hay que ajustar y una que solo se sintió bien. Y la brecha rara vez se cierra de golpe: lo normal es que baje algunos puntos, y el trabajo consiste en sostener la medida y volver a medir en el periodo siguiente.',
              'Every action closes the same way: by comparing the indicator from before with the one from after, with the figures separated by group. That closing tells apart an action that worked, one that needs adjusting and one that merely felt good. And a gap rarely closes at once: what normally happens is that it falls a few points, and the work consists of sustaining the measure and measuring again in the following period.') + '</p>' +
    '<div class="callout"><p><strong>' + S('La prueba del dato: ','The test of the figure: ') + '</strong>' +
      S('una acción se evalúa comparando el mismo indicador antes y después, y por grupo. Sin ese par de cifras solo hay impresiones.',
        'an action is evaluated by comparing the same indicator before and after, and by group. Without that pair of figures there are only impressions.') + '</p></div>');
  buildCuaderno(rng);

  /* ── PROBLEMA 9 ─────────────────────────────────────────────── */
  addProblem(pick([
    { title:{ es:'Mirar antes de repetir', en:'Looking before repeating' }, showWork:false,
      stmt:{ es:'En el taller de robótica hay 40 lugares y solo 6 los ocupan mujeres. El comité propone repetir la convocatoria con la misma redacción, en los mismos lugares y en el mismo horario de salida. ¿Qué le falta a esa propuesta para tener perspectiva de género?',
             en:'The robotics workshop has 40 places and only 6 are held by women. The committee proposes repeating the call with the same wording, in the same places and at the same dismissal time slot. What is that proposal missing in order to have a gender lens?' },
      options:{ es:[
        'Averiguar primero qué condiciones alejan a las estudiantes del taller, como el horario o el trato dentro del grupo, y actuar sobre ellas antes de volver a convocar.',
        'Cambiar el nombre del taller por uno que resulte más atractivo para las estudiantes y difundirlo con imágenes en las que aparezcan mujeres.',
        'Aceptar que el interés por la robótica se distribuye de manera distinta entre unas y otros, y esperar a que la inscripción se equilibre con el tiempo.',
        'Reservar la mitad de los lugares para mujeres sin revisar el horario ni el trato, y dar por resuelto el problema con esa reserva.' ],
        en:[
        'Finding out first which conditions push the students away from the workshop, such as the schedule or the treatment inside the group, and acting on them before calling again.',
        'Changing the name of the workshop for one that women find more appealing and publicizing it with images in which women appear.',
        'Accepting that interest in robotics is distributed differently between them, and waiting for enrollment to balance out over time.',
        'Reserving half the places for women without reviewing the schedule or the treatment, and considering the problem solved with that reservation.' ] },
      correct:0,
      hint:{ es:'Una convocatoria repetida sin cambiar nada volverá a llegar a las mismas personas que ya podían asistir.',
             en:'A call repeated with nothing changed will reach again the same people who could already attend.' },
      explanation:{ es:'La perspectiva de género empieza por preguntar qué condiciones producen esa diferencia, y en un taller a la hora de salida suelen ser el tiempo de cuidados y el reparto de tareas dentro del grupo. Cambiar el nombre y las imágenes actúa sobre la difusión, no sobre esas condiciones. Esperar supone que se trata de gustos y no de obstáculos. Reservar lugares puede ser parte de la respuesta, pero si el horario y el trato no cambian, esos lugares quedan vacíos o se desocupan a mitad del periodo.',
                    en:'A gender lens begins by asking which conditions produce that difference, and in a workshop at dismissal time they are usually care time and the split of tasks inside the group. Changing the name and the images acts on publicity, not on those conditions. Waiting assumes this is about taste and not about obstacles. Reserving places can be part of the answer, but if the schedule and the treatment do not change, those places stay empty or are given up halfway through the term.' } },
    { title:{ es:'Mirar antes de repetir', en:'Looking before repeating' }, showWork:false,
      stmt:{ es:'Un plantel revisa quién ocupa los cargos de la sociedad de estudiantes y encuentra que las mujeres son mayoría en secretaría y minoría en la presidencia, elección tras elección. La propuesta actual es publicar la convocatoria con más anticipación. ¿Qué le falta a esa propuesta para tener perspectiva de género?',
             en:'A school reviews who holds the posts of the student council and finds that women are a majority in the secretary role and a minority in the presidency, election after election. The current proposal is to publish the call further in advance. What is that proposal missing in order to have a gender lens?' },
      options:{ es:[
        'Revisar qué ocurre durante la campaña y en el reparto de tareas del consejo, y modificar esas reglas antes de la siguiente elección.',
        'Solicitar a cada planilla que incluya al menos una mujer entre sus integrantes y dar por atendido el asunto con ese requisito.',
        'Publicar los resultados de cada elección desglosados por sexo para que la comunidad escolar conozca la composición del consejo.',
        'Confiar en que la diferencia se corregirá conforme más estudiantes conozcan con anticipación la fecha de la convocatoria.' ],
        en:[
        'Reviewing what happens during the campaign and in the split of council tasks, and modifying those rules before the next election.',
        'Requiring each ticket to include at least one woman among its members and considering the matter handled with that requirement.',
        'Publishing the results of each election broken down by sex so the school community knows the composition of the council.',
        'Trusting that the difference will correct itself as more students learn the date of the call in advance.' ] },
      correct:0,
      hint:{ es:'El patrón se repite elección tras elección, así que la causa está en algo que se repite igual cada vez.',
             en:'The pattern repeats election after election, so the cause lies in something that repeats identically each time.' },
      explanation:{ es:'Un resultado que se repite señala una regla que también se repite: cómo se hace campaña, quién habla en los debates, cómo se reparten después las tareas. Publicar antes no toca nada de eso. Desglosar los resultados por sexo sirve para ver la brecha, pero por sí solo no la mueve. Y exigir una mujer por planilla, sin revisar el reparto de cargos, suele reproducir exactamente el mismo lugar que ya venían ocupando.',
                    en:'A result that repeats points to a rule that repeats too: how campaigning is done, who speaks in the debates, how tasks are split afterwards. Publishing earlier touches none of that. Breaking the results down by sex helps to see the gap, but on its own it does not move it. And requiring one woman per ticket, without reviewing how posts are split, usually reproduces exactly the same place they were already occupying.' } }
  ], rng), rng);

  /* ── PROBLEMA 10 ────────────────────────────────────────────── */
  addProblem(pick([
    { title:{ es:'Leer el cierre de la acción', en:'Reading the closing figures' }, showWork:true,
      stmt:{ es:'Antes de la acción, concluía el ciclo 74 % de un grupo y 52 % del otro. Un año después, con la acción funcionando, los valores son 71 % y 62 %. ¿Qué conclusión sostienen esos datos?',
             en:'Before the action, 74 % of one group and 52 % of the other completed the year. One year later, with the action running, the values are 71 % and 62 %. Which conclusion do those figures support?' },
      options:{ es:[
        'La brecha pasó de 22 a 9 puntos porcentuales, así que se redujo 13 puntos y sigue abierta: conviene sostener la acción y volver a medir.',
        'La acción fracasó, porque el primer grupo bajó de 74 a 71 % y ninguna medida debe reducir el resultado de quienes ya lo tenían.',
        'La brecha se cerró por completo, ya que el segundo grupo subió 10 puntos y ese aumento es el mayor de los dos periodos comparados.',
        'Los datos no permiten concluir nada, porque para hablar de una brecha se necesita comparar al menos tres ciclos escolares seguidos.' ],
        en:[
        'The gap went from 22 to 9 percentage points, so it fell 13 points and is still open: the action should be sustained and measured again.',
        'The action failed, because the first group dropped from 74 to 71 % and no measure should reduce the result of those who already had it.',
        'The gap closed completely, since the second group rose 10 points and that increase is the largest of the two periods compared.',
        'The figures allow no conclusion, because talking about a gap requires comparing at least three consecutive school years.' ] },
      correct:0,
      hint:{ es:'Calcula la brecha en cada momento por separado y después compara las dos brechas entre sí.',
             en:'Work out the gap at each moment separately and then compare the two gaps with each other.' },
      explanation:{ es:'Antes la brecha era de 22 puntos porcentuales, porque 74 menos 52 da 22. Después es de 9 puntos, porque 71 menos 62 da 9. La distancia bajó 13 puntos y todavía existe, así que la lectura correcta es continuar y volver a medir. La caída de 3 puntos en el primer grupo merece revisarse, pero no vuelve fallida una acción que acercó a los dos grupos, y una brecha de 9 puntos no es una brecha cerrada.',
                    en:'Before, the gap was 22 percentage points, since 74 minus 52 gives 22. Afterwards it is 9 points, since 71 minus 62 gives 9. The distance fell 13 points and still exists, so the correct reading is to continue and measure again. The drop of 3 points in the first group is worth reviewing, but it does not make failed an action that brought the two groups closer, and a gap of 9 points is not a closed gap.' } },
    { title:{ es:'Leer el cierre de la acción', en:'Reading the closing figures' }, showWork:true,
      stmt:{ es:'Antes de la acción, participaba en el taller 68 % de un grupo y 41 % del otro. Al terminar el periodo, con la acción funcionando, los valores son 66 % y 55 %. ¿Qué conclusión sostienen esos datos?',
             en:'Before the action, 68 % of one group and 41 % of the other took part in the workshop. At the end of the term, with the action running, the values are 66 % and 55 %. Which conclusion do those figures support?' },
      options:{ es:[
        'La brecha pasó de 27 a 11 puntos porcentuales, así que se redujo 16 puntos y sigue abierta: conviene sostener la acción y volver a medir.',
        'La acción no sirvió, porque el segundo grupo continúa por debajo del primero y el objetivo era que ambos alcanzaran el mismo valor.',
        'La brecha se cerró, ya que el segundo grupo subió 14 puntos y esa mejora supera cualquier diferencia que pudiera quedar entre ambos.',
        'Los datos son insuficientes, porque una brecha solo puede analizarse cuando se comparan tres grupos distintos en el mismo periodo.' ],
        en:[
        'The gap went from 27 to 11 percentage points, so it fell 16 points and is still open: the action should be sustained and measured again.',
        'The action was useless, because the second group is still below the first and the objective was for both to reach the same value.',
        'The gap closed, since the second group rose 14 points and that improvement exceeds any difference that might remain between them.',
        'The figures are insufficient, because a gap can only be analyzed when three different groups are compared in the same period.' ] },
      correct:0,
      hint:{ es:'La brecha es la resta dentro de cada momento; el avance es la resta entre las dos brechas.',
             en:'The gap is the subtraction within each moment; the progress is the subtraction between the two gaps.' },
      explanation:{ es:'Al inicio la brecha era de 27 puntos porcentuales, porque 68 menos 41 da 27. Al final es de 11 puntos, porque 66 menos 55 da 11. Bajó 16 puntos y sigue abierta, así que la acción funcionó y todavía no termina. Exigir que ambos valores coincidan en un solo periodo descarta un avance real, y un aumento de 14 puntos en un grupo no cierra por sí solo una distancia que aún se puede medir.',
                    en:'At the start the gap was 27 percentage points, since 68 minus 41 gives 27. At the end it is 11 points, since 66 minus 55 gives 11. It fell 16 points and is still open, so the action worked and is not finished yet. Demanding that both values coincide in a single period discards real progress, and a rise of 14 points in one group does not on its own close a distance that can still be measured.' } }
  ], rng), rng);
}

</script>

<!-- LIAXA ANALYTICS -->
<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbzLGV15JRTPs9bbSvHRLfgOXeT9oUExDf1AH546WOwq5tYxXSdhX212OWi_bTJfMGx9/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'Acciones para Reducir Desigualdad e Interculturalidad';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
