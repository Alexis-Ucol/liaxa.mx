/* ══════════════════════════════════════════════════════════════════════════
   LECCIÓN · concepto, manipulativo, problema, en ese orden y sin agrupar
   ══════════════════════════════════════════════════════════════════════════ */
function buildLesson(rng){

  sec(
    L({ es: 'Punto de partida', en: 'Starting point' }),
    L({ es: 'Un planeta que se calienta se puede medir', en: 'A warming planet can be measured' }),
    '<p>' + L({
      es: 'La temperatura de la Tierra no la decide un termostato. La decide una cuenta muy sencilla entre dos cantidades: la energía que llega del Sol y la energía que el planeta consigue devolver al espacio. Mientras las dos se igualan, la temperatura se sostiene. En cuanto la salida se entorpece, la temperatura sube hasta que la cuenta vuelve a cuadrar, y eso es exactamente lo que está ocurriendo ahora.',
      en: 'The temperature of the Earth is not set by a thermostat. It is set by a very simple count between two amounts: the energy arriving from the Sun and the energy the planet manages to give back to space. As long as the two match, the temperature holds. As soon as the way out gets harder, the temperature rises until the count balances again, and that is exactly what is happening now.'
    }) + '</p>' +
    '<p>' + L({
      es: 'En esta guía vas a cuadrar tú mismo el balance de energía de un planeta, a poner y quitar capas de gases hasta dar con una temperatura pedida, a ordenar la cadena que va del combustible quemado al mar que sube, a clasificar fenómenos extremos por lo que en realidad son y a escribir una hipótesis sobre algo que ocurre en tu propia calle.',
      en: 'In this guide you will balance a planet energy count yourself, add and take away layers of gases until you hit a requested temperature, put in order the chain that runs from burnt fuel to a rising sea, sort extreme events by what they really are, and write a hypothesis about something that happens on your own street.'
    }) + '</p>' +
    '<div class="callout"><p><strong>' + L({ es: 'Idea clave: ', en: 'Key idea: ' }) + '</strong>' + L({
      es: 'el calentamiento global no es que llegue más Sol, sino que sale menos calor, y esa diferencia se acumula año tras año hasta cambiar el clima que ya conocíamos.',
      en: 'global warming is not more Sun arriving, it is less heat leaving, and that difference builds up year after year until it changes the climate we already knew.'
    }) + '</p></div>'
  );

  /* ══ CONCEPTO 1 ══ */
  sec(
    L({ es: 'Concepto 1', en: 'Concept 1' }),
    L({ es: 'Lo que entra, lo que se refleja, lo que sale', en: 'What comes in, what bounces back, what leaves' }),
    '<p>' + L({
      es: 'Del Sol llega energía en forma de luz. Una parte rebota de inmediato en las nubes, en el hielo y en las superficies claras, y se va al espacio sin haber calentado nada. El resto se queda: calienta el aire, el mar y el suelo. Un planeta con mucho hielo y muchas nubes devuelve más y absorbe menos; uno oscuro, con bosques y océanos despejados, absorbe casi todo lo que le llega.',
      en: 'Energy arrives from the Sun as light. Part of it bounces straight off clouds, ice and bright surfaces and leaves for space without warming anything. The rest stays: it warms the air, the sea and the ground. A planet with plenty of ice and clouds sends back more and absorbs less; a dark one, with forests and clear oceans, absorbs almost everything that reaches it.'
    }) + '</p>' +
    '<p>' + L({
      es: 'Todo lo que se absorbe tiene que volver a salir, ahora en forma de calor invisible que la superficie emite hacia arriba día y noche. Si sale tanto como entró, la temperatura se queda quieta. Si sale menos, sobra energía cada día y esa sobra no desaparece: se queda en el aire y sobre todo en el océano, y la temperatura sube.',
      en: 'Everything absorbed has to come out again, now as invisible heat that the surface sends upwards day and night. If as much leaves as came in, the temperature holds still. If less leaves, there is spare energy every day and that spare does not vanish: it stays in the air and above all in the ocean, and the temperature rises.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es: 'Entra', en: 'Comes in' }), L({ es: 'luz del Sol', en: 'sunlight' }), L({ es: 'la misma cantidad de siempre, no ha aumentado en las últimas décadas', en: 'the same amount as always, it has not gone up in recent decades' })) +
      rcard(L({ es: 'Se refleja', en: 'Bounces back' }), L({ es: 'nubes y hielo', en: 'clouds and ice' }), L({ es: 'lo que rebota se marcha sin calentar el planeta', en: 'what bounces off leaves without warming the planet' })) +
      rcard(L({ es: 'Sale', en: 'Leaves' }), L({ es: 'calor invisible', en: 'invisible heat' }), L({ es: 'es la única vía de salida y es la que hoy está entorpecida', en: 'it is the only way out and it is the one now being blocked' })) +
    '</div>' +
    '<div class="callout"><p>' + L({
      es: 'En el tablero de abajo mueves la energía que llega y la parte que se refleja. La flecha de salida y el número de energía absorbida responden al instante: se te pedirá una cantidad concreta y tendrás que encontrar la combinación que la consigue.',
      en: 'On the board below you move the energy that arrives and the share that bounces back. The outgoing arrow and the absorbed energy figure respond at once: you will be asked for a definite amount and you will have to find the combination that gets it.'
    }) + '</p></div>'
  );
  wBalance(rng);
  addProb(mkP1(rng), rng);
  addProb(mkP2(rng), rng);

  /* ══ CONCEPTO 2 ══ */
  sec(
    L({ es: 'Concepto 2', en: 'Concept 2' }),
    L({ es: 'La manta que devuelve el calor', en: 'The blanket that sends heat back' }),
    '<p>' + L({
      es: 'El aire está hecho sobre todo de nitrógeno y oxígeno, y a esos dos el calor que sube del suelo les resulta indiferente: lo dejan pasar. Pero hay gases minoritarios, como el vapor de agua, el dióxido de carbono y el metano, que sí lo absorben. Al absorberlo se calientan y vuelven a emitirlo en todas direcciones, también hacia abajo. Ese calor devuelto llega otra vez a la superficie y la mantiene más caliente de lo que estaría con un cielo transparente.',
      en: 'Air is made mostly of nitrogen and oxygen, and those two are indifferent to the heat rising from the ground: they let it through. But there are minor gases, such as water vapour, carbon dioxide and methane, that do take it in. On taking it in they warm up and send it out again in all directions, downwards too. That returned heat reaches the surface once more and keeps it warmer than it would be under a clear sky.'
    }) + '</p>' +
    '<p>' + L({
      es: 'Ese efecto no es un accidente ni una avería: sin él la temperatura media de la Tierra rondaría los 18 grados bajo cero y el agua líquida sería imposible. Con él, la media real es de unos 15 grados sobre cero. La diferencia, unos 33 grados, es lo que aporta esa manta de gases. El problema aparece cuando la manta se engrosa: cuanto más gas de este tipo hay, menos calor consigue escapar y más sube la temperatura.',
      en: 'That effect is not an accident nor a fault: without it the mean temperature of the Earth would be around 18 degrees below zero and liquid water would be impossible. With it, the real mean is about 15 degrees above zero. The difference, some 33 degrees, is what that blanket of gases adds. The trouble comes when the blanket thickens: the more gas of this kind there is, the less heat manages to escape and the higher the temperature climbs.'
    }) + '</p>' +
    '<div class="callout"><p>' + L({
      es: 'Abajo puedes poner y quitar capas de gases sobre un planeta. Verás cuántas flechas de calor consiguen escapar, cuántas regresan al suelo y qué temperatura media resulta. Se te pedirán tres temperaturas distintas.',
      en: 'Below you can add and take away layers of gases over a planet. You will see how many heat arrows manage to escape, how many come back to the ground and what mean temperature results. You will be asked for three different temperatures.'
    }) + '</p></div>'
  );
  wManta(rng);
  addProb(mkP3(rng), rng);
  addProb(mkP4(rng), rng);

  /* ══ CONCEPTO 3 ══ */
  sec(
    L({ es: 'Concepto 3', en: 'Concept 3' }),
    L({ es: 'De un efecto natural a un planeta más caliente', en: 'From a natural effect to a hotter planet' }),
    '<p>' + L({
      es: 'Desde que se generalizó la quema de carbón, petróleo y gas, y desde que se talaron bosques enteros, la cantidad de dióxido de carbono en el aire dejó de ser estable. Pasó de unas 280 partes por millón a más de 420 en poco más de dos siglos, y el metano y otros gases siguieron el mismo camino. Estas cifras no se estiman: se miden en observatorios que toman muestras de aire todos los días.',
      en: 'Since the burning of coal, oil and gas became widespread, and since whole forests were cut down, the amount of carbon dioxide in the air stopped being steady. It went from about 280 parts per million to more than 420 in a little over two centuries, and methane and other gases followed the same path. These figures are not estimated: they are measured at observatories that take air samples every day.'
    }) + '</p>' +
    '<p>' + L({
      es: 'La consecuencia es la esperada por el balance del primer concepto: la salida de calor se entorpeció y la temperatura media de la superficie subió alrededor de 1.2 grados respecto a la de hace siglo y medio. Parece poco dicho así, pero es un promedio de todo el planeta y de todo el año, y detrás de él hay glaciares que retroceden, un nivel del mar que sube y estaciones que ya no llegan cuando solían.',
      en: 'The consequence is the one the balance of the first concept leads to: the way out for heat got harder and the mean surface temperature rose by about 1.2 degrees compared with a century and a half ago. It sounds small put that way, but it is an average over the whole planet and the whole year, and behind it there are glaciers pulling back, a sea level rising and seasons that no longer arrive when they used to.'
    }) + '</p>' +
    '<div class="callout"><p>' + L({
      es: 'Los cinco eslabones de abajo están revueltos. Ordénalos del primero al último tocando dos para intercambiarlos, y comprueba si la cadena que armaste es la que de verdad conecta el combustible quemado con el mar que sube.',
      en: 'The five links below are jumbled. Put them in order from first to last by tapping two to swap them, and check whether the chain you built is the one that really connects burnt fuel with a rising sea.'
    }) + '</p></div>'
  );
  wCadena(rng);
  addProb(mkP5(rng), rng);
  addProb(mkP6(rng), rng);

  /* ══ CONCEPTO 4 ══ */
  sec(
    L({ es: 'Concepto 4', en: 'Concept 4' }),
    L({ es: 'Cuando el clima se sale de lo acostumbrado', en: 'When the weather steps outside the usual' }),
    '<p>' + L({
      es: 'Un grado y pico de más no reparte el calor por igual: corre las temperaturas de todos los días hacia arriba, y con ello lo que antes era un día excepcional pasa a repetirse varias veces por temporada. Por eso las olas de calor son hoy más frecuentes, más largas y más intensas, y por eso las noches en las ciudades ya no se refrescan como antes.',
      en: 'A degree and a bit more does not spread the heat evenly: it shifts the temperatures of every day upwards, and with that what used to be an exceptional day comes to repeat several times a season. That is why heat waves are now more frequent, longer and fiercer, and why nights in cities no longer cool down the way they did.'
    }) + '</p>' +
    '<p>' + L({
      es: 'Con la lluvia ocurre algo parecido y a primera vista contradictorio. El aire más caliente admite más vapor de agua, alrededor de 7 por ciento más por cada grado, así que cuando por fin llueve, llueve con más agua encima y los aguaceros descargan más en menos tiempo. Al mismo tiempo, el mismo calor evapora antes la humedad del suelo, así que entre lluvia y lluvia las sequías se hacen más duras. Más agua de golpe y más seco en medio, las dos cosas a la vez.',
      en: 'Something similar and at first sight contradictory happens with rain. Warmer air takes in more water vapour, about 7 per cent more per degree, so when it finally rains, it rains with more water overhead and the downpours dump more in less time. At the same time, that same heat dries the moisture out of the ground sooner, so between one rain and the next the droughts get harder. More water all at once and drier in between, both at the same time.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es: 'Ola de calor', en: 'Heat wave' }), L({ es: 'días seguidos', en: 'days in a row' }), L({ es: 'temperaturas altas sostenidas, con noches que ya no refrescan', en: 'high temperatures held for days, with nights that no longer cool' })) +
      rcard(L({ es: 'Lluvia torrencial', en: 'Torrential rain' }), L({ es: 'todo de golpe', en: 'all at once' }), L({ es: 'mucha agua en muy poco tiempo, más de la que el suelo puede tragar', en: 'a lot of water in very little time, more than the ground can take' })) +
      rcard(L({ es: 'Sequía', en: 'Drought' }), L({ es: 'semanas sin agua', en: 'weeks with no water' }), L({ es: 'la lluvia falta y el calor evapora lo poco que queda', en: 'the rain fails and the heat evaporates the little that is left' })) +
    '</div>' +
    '<div class="callout"><p>' + L({
      es: 'Abajo aparecen situaciones reales una por una. Decide de qué fenómeno se trata en cada caso: la pista que te devuelve el tablero apunta a lo que distingue a uno de otro.',
      en: 'Below, real situations appear one at a time. Decide which event each one is: the hint the board gives back points to what tells one from another.'
    }) + '</p></div>'
  );
  wClasifica(rng);
  addProb(mkP7(rng), rng);
  addProb(mkP8(rng), rng);

  /* ══ CONCEPTO 5 ══ */
  sec(
    L({ es: 'Concepto 5', en: 'Concept 5' }),
    L({ es: 'Pasar de la sospecha a la hipótesis', en: 'From a hunch to a hypothesis' }),
    '<p>' + L({
      es: 'Notar que hace más calor que antes no es todavía ciencia: es una impresión, y las impresiones fallan. El paso siguiente es convertirla en una hipótesis, es decir, en una afirmación concreta que relacione algo que cambia con algo que se puede medir, y que se moje prediciendo un resultado. Su virtud no es sonar convincente, sino que pueda salir mal: si los datos la contradicen, se abandona.',
      en: 'Noticing that it is hotter than before is not yet science: it is an impression, and impressions fail. The next step is to turn it into a hypothesis, that is, into a definite statement relating something that changes with something that can be measured, and one that sticks its neck out by predicting a result. Its merit is not sounding convincing, but being able to turn out wrong: if the data contradict it, it is dropped.'
    }) + '</p>' +
    '<p>' + L({
      es: 'Una buena hipótesis sobre el clima nombra lo que se va a comparar, dice qué instrumento decidirá la cuestión y no se apoya en recuerdos. Comparar dos calles con termómetros iguales, o cruzar la lluvia por hora con la temperatura del día, son maneras de ponerla a prueba. Y hace falta insistir: un año caluroso no confirma nada por sí solo, porque el clima se juzga con series largas, no con episodios sueltos.',
      en: 'A good hypothesis about climate names what is going to be compared, says which instrument will settle the matter and does not rest on memories. Comparing two streets with matching thermometers, or crossing rainfall per hour with the temperature of the day, are ways of putting it to the test. And it needs saying: one hot year confirms nothing on its own, because climate is judged with long series, not with single episodes.'
    }) + '</p>' +
    '<div class="callout"><p>' + L({
      es: 'Abajo tienes un caso de tu entorno. Escribe o dibuja tu propia hipótesis: nombra lo que compararías, qué medirías y qué esperarías encontrar si tu idea fuera acertada.',
      en: 'Below you have a case from your own surroundings. Write or sketch your own hypothesis: name what you would compare, what you would measure and what you would expect to find if your idea were right.'
    }) + '</p></div>'
  );
  wHipotesis(rng);
  addProb(mkP9(rng), rng);

  /* ══ CIERRE ══ */
  sec(
    L({ es: 'Cierre', en: 'Closing' }),
    L({ es: 'La cuenta que sí está en nuestras manos', en: 'The count that is in our hands' }),
    '<p>' + L({
      es: 'La parte del balance que podemos mover es la de los gases que añadimos, y esa se mide en cifras tan concretas como el recibo de la luz de una escuela o el inventario de emisiones de un municipio.',
      en: 'The part of the balance we can move is the gases we add, and that is measured in figures as definite as the power bill of a school or the emissions inventory of a town.'
    }) + '</p>'
  );
  addProb(mkP10(rng), rng);
}

/* ══ MANIPULATIVO 1 · BALANCE DE ENERGÍA ═══════════════════════════════════
   El alumno mueve la energía que llega y el porcentaje que se refleja. Las
   flechas y la barra responden al instante. Tres encargos, pista direccional
   y revelado de una combinación válida al tercer intento.
   ═══════════════════════════════════════════════════════════════════════════ */
function wBalance(rng){
  var host = iw('balance', 'wBalW');
  var TG = shuffle([180, 200, 240, 270, 300], rng).slice(0, 3);
  var SOL = { 180: [200, 10], 200: [400, 50], 240: [300, 20], 270: [300, 10], 300: [400, 25] };
  var st = { s: 300, r: 30, i: 0, tries: 0, done: false };
  function refl(){ return Math.round(st.s * st.r / 100); }
  function absr(){ return st.s - refl(); }
  function tgt(){ return TG[Math.min(st.i, TG.length - 1)]; }

  host.innerHTML =
    '<div class="iw-tag">' + L({ es: 'Balance de energía', en: 'Energy balance' }) + '</div>' +
    '<div class="iw-sub" id="wBalTask"></div>' +
    '<div class="iw-cv"><canvas id="wBalCv"></canvas></div>' +
    '<div class="ctrl"><label>' + L({ es: 'Energía solar que llega', en: 'Solar energy arriving' }) + ': <b id="wBalSL"></b> ' +
      L({ es: 'unidades', en: 'units' }) + '</label>' +
      '<input type="range" id="wBalS" min="200" max="400" step="20" value="300" oninput="wBalIn()"></div>' +
    '<div class="ctrl"><label>' + L({ es: 'Parte que se refleja al espacio', en: 'Share bounced back to space' }) + ': <b id="wBalRL"></b> %</label>' +
      '<input type="range" id="wBalR" min="0" max="50" step="5" value="30" oninput="wBalIn()"></div>' +
    '<div class="readout">' +
      '<div class="ro"><div class="ro-l">' + L({ es: 'Llega', en: 'Arrives' }) + '</div><div class="ro-v" id="wBalV1"></div></div>' +
      '<div class="ro"><div class="ro-l">' + L({ es: 'Se refleja', en: 'Bounces off' }) + '</div><div class="ro-v" id="wBalV2"></div></div>' +
      '<div class="ro"><div class="ro-l">' + L({ es: 'Se absorbe', en: 'Absorbed' }) + '</div><div class="ro-v" id="wBalV3"></div></div>' +
    '</div>' +
    '<button class="rverify-btn" onclick="wBalCheck()">' + L({ es: 'Comprobar', en: 'Check' }) + '</button>' +
    '<div class="rfb" id="wBalFb"></div>';

  function arrow(c, x, y0, y1, w){
    c.lineWidth = w;
    c.beginPath(); c.moveTo(x, y0); c.lineTo(x, y1); c.stroke();
    var d = y1 > y0 ? 1 : -1;
    c.beginPath();
    c.moveTo(x, y1);
    c.lineTo(x - 5, y1 - 7 * d);
    c.lineTo(x + 5, y1 - 7 * d);
    c.closePath(); c.fill();
  }
  function draw(){
    var cv = document.getElementById('wBalCv'); if (!cv) return;
    var rect = cv.getBoundingClientRect();
    var dpr = window.devicePixelRatio || 1;
    var W = Math.round(rect.width || 320), H = 210;
    cv.width = W * dpr; cv.height = H * dpr;
    var c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, W, H);

    c.fillStyle = CV('--green-bg'); c.fillRect(0, 0, W, 150);
    c.fillStyle = CV('--green'); c.fillRect(0, 150, W, 60);

    c.strokeStyle = CV('--gold'); c.fillStyle = CV('--gold');
    arrow(c, W * 0.25, 12, 142, Math.max(2, st.s / 60));
    c.strokeStyle = CV('--text3'); c.fillStyle = CV('--text3');
    arrow(c, W * 0.55, 142, 12, Math.max(1.5, refl() / 40));
    c.strokeStyle = CV('--bad'); c.fillStyle = CV('--bad');
    arrow(c, W * 0.8, 142, 60, Math.max(1.5, absr() / 60));

    c.font = '10px IBM Plex Sans, sans-serif'; c.textAlign = 'center';
    c.fillStyle = CV('--text2');
    c.fillText(L({ es: 'llega', en: 'in' }), W * 0.25, 160);
    c.fillText(L({ es: 'se refleja', en: 'reflected' }), W * 0.55, 160);
    c.fillText(L({ es: 'se absorbe', en: 'absorbed' }), W * 0.8, 160);

    var bx = 20, bw = W - 40, by = 178;
    c.fillStyle = CV('--surface'); c.fillRect(bx, by, bw, 14);
    c.strokeStyle = CV('--border'); c.lineWidth = 1; c.strokeRect(bx, by, bw, 14);
    c.fillStyle = CV('--gold'); c.fillRect(bx, by, bw * Math.min(1, absr() / 400), 14);
    if (!st.done){
      var tx = bx + bw * Math.min(1, tgt() / 400);
      c.strokeStyle = CV('--bad'); c.lineWidth = 2;
      c.beginPath(); c.moveTo(tx, by - 6); c.lineTo(tx, by + 20); c.stroke();
      c.fillStyle = CV('--bad'); c.textAlign = 'center';
      c.fillText(L({ es: 'pedido', en: 'asked' }), tx, by - 9);
    }
  }
  function paint(){
    document.getElementById('wBalSL').textContent = st.s;
    document.getElementById('wBalRL').textContent = st.r;
    document.getElementById('wBalV1').textContent = st.s;
    document.getElementById('wBalV2').textContent = refl();
    document.getElementById('wBalV3').textContent = absr();
    document.getElementById('wBalTask').textContent = st.done
      ? L({ es: 'Tablero libre: deja fija la energía que llega y sube el reflejo; verás que un planeta más blanco absorbe menos sin que el Sol cambie nada.',
            en: 'Free board: keep the arriving energy fixed and raise the reflection; you will see that a whiter planet absorbs less without the Sun changing a thing.' })
      : L({ es: 'Encargo ' + (st.i + 1) + ' de 3: ajusta las dos barras hasta que el planeta absorba exactamente ' + tgt() + ' unidades.',
            en: 'Task ' + (st.i + 1) + ' of 3: adjust the two sliders until the planet absorbs exactly ' + tgt() + ' units.' });
    draw();
  }
  window.wBalIn = function(){
    st.s = parseInt(document.getElementById('wBalS').value, 10);
    st.r = parseInt(document.getElementById('wBalR').value, 10);
    paint();
  };
  window.wBalCheck = function(){
    var fb = document.getElementById('wBalFb');
    if (st.done){
      fb.textContent = L({ es: 'Ahora mismo llegan ' + st.s + ' unidades, se reflejan ' + refl() + ' y quedan absorbidas ' + absr() + '.',
                           en: 'Right now ' + st.s + ' units arrive, ' + refl() + ' bounce off and ' + absr() + ' are absorbed.' });
      return;
    }
    var T = tgt(), a = absr();
    if (a === T){
      st.i++; st.tries = 0;
      if (st.i >= TG.length) st.done = true;
      paint();
      document.getElementById('wBalFb').innerHTML = '<span class="okfb">🎉 ' + (st.done
        ? L({ es: 'Los tres encargos resueltos. La misma energía absorbida se consigue con muchas parejas distintas, y siempre por la misma cuenta.',
              en: 'All three tasks solved. The same absorbed energy can be reached with many different pairs, and always by the same count.' })
        : L({ es: 'Exacto. Fíjate en que llegar a esa cifra no exige un Sol distinto: basta con cambiar cuánto se refleja.',
              en: 'Exactly. Notice that reaching that figure does not need a different Sun: changing how much bounces off is enough.' })) + '</span>';
      return;
    }
    st.tries++;
    if (st.tries >= 3){
      var s = SOL[T];
      st.s = s[0]; st.r = s[1];
      document.getElementById('wBalS').value = st.s;
      document.getElementById('wBalR').value = st.r;
      var msg = L({ es: 'Con ' + st.s + ' unidades llegando y ' + st.r + ' por ciento reflejado quedan absorbidas ' + T + ': lo que se refleja nunca llega a calentar el planeta.',
                    en: 'With ' + st.s + ' units arriving and ' + st.r + ' per cent reflected, ' + T + ' are absorbed: what bounces off never gets to warm the planet.' });
      st.i++; st.tries = 0;
      if (st.i >= TG.length) st.done = true;
      paint();
      fb.textContent = msg;
      return;
    }
    fb.textContent = (a < T)
      ? L({ es: 'Se absorben ' + a + ', por debajo de lo pedido: sube la energía que llega o baja la parte que se refleja.',
            en: 'It absorbs ' + a + ', under what was asked: raise the arriving energy or lower the share that bounces off.' })
      : L({ es: 'Se absorben ' + a + ', por encima de lo pedido: baja la energía que llega o aumenta la parte que se refleja.',
            en: 'It absorbs ' + a + ', over what was asked: lower the arriving energy or raise the share that bounces off.' });
  };
  paint();
  setTimeout(draw, 200);
  setTimeout(draw, 800);
}

/* ══ MANIPULATIVO 2 · CAPAS DE GASES ═══════════════════════════════════════
   El alumno pone y quita capas y ve cuántas flechas de calor escapan, cuántas
   vuelven al suelo y qué temperatura media resulta. Tres temperaturas pedidas.
   ═══════════════════════════════════════════════════════════════════════════ */
function wManta(rng){
  var host = iw('capas', 'wMntW');
  var TG = shuffle([-7, 4, 15, 26], rng).slice(0, 3);
  var st = { n: 0, i: 0, tries: 0, done: false };
  function temp(n){ return -18 + 11 * n; }
  function esc(n){ return 100 - 20 * n; }
  function tgt(){ return TG[Math.min(st.i, TG.length - 1)]; }
  function tstr(v){ return (v < 0 ? '−' + Math.abs(v) : String(v)) + ' °C'; }

  host.innerHTML =
    '<div class="iw-tag">' + L({ es: 'Capas de gases', en: 'Layers of gases' }) + '</div>' +
    '<div class="iw-sub" id="wMntTask"></div>' +
    '<div class="iw-cv"><canvas id="wMntCv"></canvas></div>' +
    '<div class="wbtns">' +
      '<button class="wbtn" onclick="wMntAdd(1)">' + L({ es: 'Añadir capa', en: 'Add layer' }) + '</button>' +
      '<button class="wbtn" onclick="wMntAdd(-1)">' + L({ es: 'Quitar capa', en: 'Remove layer' }) + '</button>' +
    '</div>' +
    '<div class="readout">' +
      '<div class="ro"><div class="ro-l">' + L({ es: 'Capas', en: 'Layers' }) + '</div><div class="ro-v" id="wMntV1"></div></div>' +
      '<div class="ro"><div class="ro-l">' + L({ es: 'Calor que escapa', en: 'Heat escaping' }) + '</div><div class="ro-v" id="wMntV2"></div></div>' +
      '<div class="ro"><div class="ro-l">' + L({ es: 'Temperatura media', en: 'Mean temperature' }) + '</div><div class="ro-v" id="wMntV3"></div></div>' +
    '</div>' +
    '<button class="rverify-btn" onclick="wMntCheck()">' + L({ es: 'Comprobar', en: 'Check' }) + '</button>' +
    '<div class="rfb" id="wMntFb"></div>';

  function draw(){
    var cv = document.getElementById('wMntCv'); if (!cv) return;
    var rect = cv.getBoundingClientRect();
    var dpr = window.devicePixelRatio || 1;
    var W = Math.round(rect.width || 320), H = 200;
    cv.width = W * dpr; cv.height = H * dpr;
    var c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, W, H);

    c.fillStyle = CV('--green-bg'); c.fillRect(0, 0, W, 172);
    c.fillStyle = CV('--green'); c.fillRect(0, 172, W, 28);

    var k;
    for (k = 0; k < st.n; k++){
      var y = 140 - k * 30;
      c.fillStyle = CV('--gold-bg'); c.fillRect(10, y - 9, W - 20, 18);
      c.strokeStyle = CV('--gold'); c.lineWidth = 1.5;
      c.setLineDash([6, 4]); c.strokeRect(10, y - 9, W - 20, 18); c.setLineDash([]);
      c.fillStyle = CV('--gold'); c.font = '10px IBM Plex Sans, sans-serif'; c.textAlign = 'left';
      c.fillText(L({ es: 'gases', en: 'gases' }), 16, y + 4);
    }
    var escN = Math.max(1, Math.round(esc(st.n) / 20));
    c.strokeStyle = CV('--bad'); c.fillStyle = CV('--bad'); c.lineWidth = 2;
    for (k = 0; k < escN; k++){
      var x = 60 + k * ((W - 100) / 5);
      c.beginPath(); c.moveTo(x, 170); c.lineTo(x, 8); c.stroke();
      c.beginPath(); c.moveTo(x, 8); c.lineTo(x - 4, 15); c.lineTo(x + 4, 15); c.closePath(); c.fill();
    }
    if (st.n > 0){
      c.strokeStyle = CV('--green-dark'); c.fillStyle = CV('--green-dark');
      for (k = 0; k < st.n; k++){
        var xb = W - 45 - k * 22;
        c.beginPath(); c.moveTo(xb, 140 - k * 30); c.lineTo(xb, 168); c.stroke();
        c.beginPath(); c.moveTo(xb, 170); c.lineTo(xb - 4, 163); c.lineTo(xb + 4, 163); c.closePath(); c.fill();
      }
      c.font = '10px IBM Plex Sans, sans-serif'; c.textAlign = 'right';
      c.fillText(L({ es: 'calor devuelto', en: 'heat returned' }), W - 12, 186);
    }
    c.fillStyle = CV('--text3'); c.font = '10px IBM Plex Sans, sans-serif'; c.textAlign = 'left';
    c.fillText(L({ es: 'calor que escapa', en: 'heat escaping' }), 14, 186);
  }
  function paint(){
    document.getElementById('wMntV1').textContent = st.n;
    document.getElementById('wMntV2').textContent = esc(st.n) + ' / 100';
    document.getElementById('wMntV3').textContent = tstr(temp(st.n));
    document.getElementById('wMntTask').textContent = st.done
      ? L({ es: 'Tablero libre: quita todas las capas y vuelve a ponerlas, y observa que el Sol entrega siempre lo mismo mientras la temperatura cambia.',
            en: 'Free board: take all the layers away and put them back, and notice that the Sun delivers the same all along while the temperature changes.' })
      : L({ es: 'Encargo ' + (st.i + 1) + ' de 3: pon o quita capas hasta que la temperatura media sea ' + tstr(tgt()) + '.',
            en: 'Task ' + (st.i + 1) + ' of 3: add or remove layers until the mean temperature is ' + tstr(tgt()) + '.' });
    draw();
  }
  window.wMntAdd = function(k){
    st.n = Math.max(0, Math.min(4, st.n + k));
    paint();
  };
  window.wMntCheck = function(){
    var fb = document.getElementById('wMntFb');
    if (st.done){
      fb.textContent = L({ es: 'Con ' + st.n + ' capas escapan ' + esc(st.n) + ' de cada 100 unidades de calor y la media queda en ' + tstr(temp(st.n)) + '.',
                           en: 'With ' + st.n + ' layers, ' + esc(st.n) + ' out of every 100 units of heat escape and the mean sits at ' + tstr(temp(st.n)) + '.' });
      return;
    }
    var T = tgt();
    if (temp(st.n) === T){
      st.i++; st.tries = 0;
      if (st.i >= TG.length) st.done = true;
      paint();
      document.getElementById('wMntFb').innerHTML = '<span class="okfb">🎉 ' + (st.done
        ? L({ es: 'Los tres encargos resueltos. Cada capa que añades retiene más calor y sube la media, sin que llegue ni una pizca más de luz solar.',
              en: 'All three tasks solved. Each layer you add holds back more heat and raises the mean, without a scrap more sunlight arriving.' })
        : L({ es: 'Esa es. Cuenta cuántas flechas escapan ahora y compáralo con las que escapaban antes.',
              en: 'That is the one. Count how many arrows escape now and compare it with the ones that escaped before.' })) + '</span>';
      return;
    }
    st.tries++;
    if (st.tries >= 3){
      st.n = (T + 18) / 11;
      var msg = L({ es: 'Hacen falta ' + st.n + ' capas: cada una devuelve al suelo una parte del calor y sube la media 11 grados.',
                    en: st.n + ' layers are needed: each one sends part of the heat back to the ground and lifts the mean by 11 degrees.' });
      st.i++; st.tries = 0;
      if (st.i >= TG.length) st.done = true;
      paint();
      fb.textContent = msg;
      return;
    }
    fb.textContent = (temp(st.n) < T)
      ? L({ es: 'La media va en ' + tstr(temp(st.n)) + ', todavía por debajo: escapa demasiado calor, hace falta más manta.',
            en: 'The mean is at ' + tstr(temp(st.n)) + ', still below: too much heat escapes, more blanket is needed.' })
      : L({ es: 'La media va en ' + tstr(temp(st.n)) + ', por encima de lo pedido: se está reteniendo de más, quita manta.',
            en: 'The mean is at ' + tstr(temp(st.n)) + ', above what was asked: too much is being held back, take blanket away.' });
  };
  paint();
  setTimeout(draw, 200);
  setTimeout(draw, 800);
}

/* ══ MANIPULATIVO 3 · LA CADENA DEL CALENTAMIENTO ══════════════════════════
   Cinco eslabones revueltos; el alumno toca dos para intercambiarlos hasta
   dejar la cadena en orden. Pista sobre el primer eslabón mal puesto y
   revelado del orden completo al tercer intento.
   ═══════════════════════════════════════════════════════════════════════════ */
function wCadena(rng){
  var host = iw('cadena', 'wCadW');
  var EV = [
    { es: 'Se queman carbón, petróleo y gas en autos, fábricas y termoeléctricas', en: 'Coal, oil and gas are burnt in cars, factories and power plants' },
    { es: 'La cantidad de dióxido de carbono en el aire aumenta año con año', en: 'The amount of carbon dioxide in the air goes up year after year' },
    { es: 'Una parte mayor del calor que sale del suelo se queda retenida', en: 'A bigger share of the heat leaving the ground stays held back' },
    { es: 'La temperatura media de la superficie del planeta sube', en: 'The mean temperature of the surface of the planet rises' },
    { es: 'Los glaciares retroceden y el nivel del mar sube', en: 'Glaciers pull back and the sea level rises' }
  ];
  var st = { ord: permOf(EV.length, rng), sel: null, tries: 0, done: false };
  if (st.ord.every(function(e, i){ return e === i; })) st.ord.reverse();

  function render(){
    var chips = st.ord.map(function(ei, pos){
      var cls = 'tl-chip' + (st.sel === pos ? ' sel' : '') + (st.done ? ' locked' : '');
      return '<div class="' + cls + '" onclick="wCadTap(' + pos + ')"><span class="tl-num">' + (pos + 1) + '</span> ' + EV[ei][LANG] + '</div>';
    }).join('');
    host.innerHTML =
      '<div class="iw-tag">' + L({ es: 'La cadena del calentamiento', en: 'The warming chain' }) + '</div>' +
      '<div class="iw-sub">' + L({ es: 'Ordena los eslabones del primero al último. Toca dos para intercambiarlos.',
                                    en: 'Put the links in order from first to last. Tap two to swap them.' }) + '</div>' +
      '<div class="tl-list">' + chips + '</div>' +
      (st.done ? '' : '<button class="rverify-btn" onclick="wCadCheck()">' + L({ es: 'Comprobar', en: 'Check' }) + '</button>') +
      '<div class="rfb" id="wCadFb"></div>';
  }
  window.wCadTap = function(pos){
    if (st.done) return;
    if (st.sel === null) st.sel = pos;
    else if (st.sel === pos) st.sel = null;
    else { var t = st.ord[st.sel]; st.ord[st.sel] = st.ord[pos]; st.ord[pos] = t; st.sel = null; }
    render();
  };
  window.wCadCheck = function(){
    var ok = st.ord.every(function(ei, pos){ return ei === pos; });
    if (ok){
      st.done = true; render();
      document.getElementById('wCadFb').innerHTML = '<span class="okfb">🎉 ' +
        L({ es: 'Cadena correcta. Cada eslabón es la causa del siguiente, y por eso el último se mide en centímetros de mar.',
            en: 'Correct chain. Each link is the cause of the next, and that is why the last one is measured in centimetres of sea.' }) + '</span>';
      return;
    }
    st.tries++;
    if (st.tries >= 3){
      st.ord = EV.map(function(_, i){ return i; });
      st.done = true; render();
      document.getElementById('wCadFb').textContent =
        L({ es: 'Este es el orden. Léelo de arriba abajo preguntándote cada vez: esto que acaba de pasar, ¿qué hace posible lo siguiente?',
            en: 'This is the order. Read it from top to bottom asking yourself each time: what has just happened, what does it make possible next?' });
      return;
    }
    var bad = 0;
    for (var i = 0; i < st.ord.length; i++){ if (st.ord[i] !== i){ bad = i; break; } }
    document.getElementById('wCadFb').textContent =
      L({ es: 'Todavía no. Mira el eslabón número ' + (bad + 1) + ': ¿algo de la lista tiene que ocurrir antes que él?',
          en: 'Not yet. Look at link number ' + (bad + 1) + ': does anything on the list have to happen before it?' });
  };
  render();
}

/* ══ MANIPULATIVO 4 · CLASIFICAR FENÓMENOS EXTREMOS ════════════════════════
   Situaciones reales, una por una, a repartir en tres cajones. Pista que
   señala el rasgo distintivo y revelado al tercer intento de cada situación.
   ═══════════════════════════════════════════════════════════════════════════ */
function wClasifica(rng){
  var BINS = [
    L({ es: 'Ola de calor', en: 'Heat wave' }),
    L({ es: 'Lluvia torrencial', en: 'Torrential rain' }),
    L({ es: 'Sequía', en: 'Drought' })
  ];
  var ITEMS = [
    { es: 'Cinco noches seguidas en que la temperatura no baja de 28 grados', en: 'Five nights in a row when the temperature does not drop below 28 degrees', bin: 0 },
    { es: 'En dos horas cae el agua que suele caer en un mes entero', en: 'In two hours the water that usually falls in a whole month comes down', bin: 1 },
    { es: 'Tres semanas sin una sola gota y las presas por debajo de la mitad', en: 'Three weeks without a single drop and the reservoirs below half', bin: 2 },
    { es: 'Los hospitales se llenan de golpes de calor durante la tarde más calurosa del año', en: 'Hospitals fill with heat stroke cases during the hottest afternoon of the year', bin: 0 },
    { es: 'Un río se desborda tras una tormenta que descarga sin parar toda la noche', en: 'A river bursts its banks after a storm that pours down all night', bin: 1 },
    { es: 'El suelo agrietado y la cosecha perdida tras meses de lluvias que no llegaron', en: 'Cracked ground and a lost harvest after months of rains that never came', bin: 2 }
  ];
  var host = iw('clasifica', 'wClsW');
  var st = { seq: permOf(ITEMS.length, rng), i: 0, tries: 0, aciertos: 0, done: false };

  function render(){
    if (st.done){
      host.innerHTML = '<div class="iw-tag">' + L({ es: 'Clasifica lo que ocurre', en: 'Sort what happens' }) + '</div>' +
        '<div class="iw-sub">' + L({ es: 'Situaciones repartidas. Lo que distingue a una de otra no es la gravedad, sino qué se mide en cada caso: grados sostenidos, agua por hora o agua ausente.',
                                      en: 'Situations sorted. What tells one from another is not how serious it is, but what gets measured in each case: degrees held for days, water per hour or water missing.' }) + '</div>' +
        '<div class="cls-done">🎉 ' + st.aciertos + ' / ' + ITEMS.length + '</div>';
      return;
    }
    var it = ITEMS[st.seq[st.i]];
    host.innerHTML =
      '<div class="iw-tag">' + L({ es: 'Clasifica lo que ocurre', en: 'Sort what happens' }) + '</div>' +
      '<div class="iw-sub">' + L({ es: 'Lee la situación y elige el fenómeno que le corresponde.', en: 'Read the situation and choose the event it belongs to.' }) + '</div>' +
      '<div class="cls-prog">' + (st.i + 1) + ' / ' + ITEMS.length + '</div>' +
      '<div class="cls-card">' + it[LANG] + '</div>' +
      '<div class="wbtns">' + BINS.map(function(b, bi){
        return '<button class="wbtn" onclick="wClsPick(' + bi + ')">' + b + '</button>';
      }).join('') + '</div>' +
      '<div class="rfb" id="wClsFb"></div>';
  }
  function avanzar(){
    st.tries = 0; st.i++;
    if (st.i >= ITEMS.length) st.done = true;
  }
  window.wClsPick = function(bi){
    var it = ITEMS[st.seq[st.i]];
    var fb = document.getElementById('wClsFb');
    if (bi === it.bin){
      st.aciertos++;
      avanzar(); render();
      if (!st.done) document.getElementById('wClsFb').innerHTML = '<span class="okfb">' +
        L({ es: 'Correcto. Siguiente situación.', en: 'Right. Next situation.' }) + '</span>';
      return;
    }
    st.tries++;
    if (st.tries >= 3){
      var msg = L({ es: 'Era ' + BINS[it.bin] + '. Pregúntate siempre qué se mide: días calurosos seguidos, agua caída en pocas horas o agua que lleva semanas sin caer.',
                    en: 'It was ' + BINS[it.bin] + '. Always ask what gets measured: hot days in a row, water fallen in a few hours or water that has not fallen for weeks.' });
      avanzar(); render();
      var f2 = document.getElementById('wClsFb');
      if (f2) f2.textContent = msg;
      return;
    }
    fb.textContent = (it.bin === 0)
      ? L({ es: 'Vuelve a intentar: fíjate en si lo que se repite son días y noches calurosos o si el asunto es el agua.',
            en: 'Try again: look at whether what repeats is hot days and nights or whether the matter is water.' })
      : (it.bin === 1)
        ? L({ es: 'Vuelve a intentar: fíjate en cuánta agua cae y en qué tan poco tiempo lo hace.',
              en: 'Try again: look at how much water falls and in how little time it does so.' })
        : L({ es: 'Vuelve a intentar: fíjate en cuánto tiempo lleva faltando el agua.',
              en: 'Try again: look at how long the water has been missing.' });
  };
  render();
}

/* ══ MANIPULATIVO 5 · ESCRIBE TU HIPÓTESIS ═════════════════════════════════
   Un caso del entorno del alumno, elegido por la semilla. Se responde
   escribiendo o dibujando, y la respuesta se guarda sin veredicto.
   ═══════════════════════════════════════════════════════════════════════════ */
function wHipotesis(rng){
  var PR = [
    { es: 'En tu localidad, ¿qué zona crees que se queda más caliente al anochecer y por qué? Escribe una hipótesis que diga qué compararías, con qué la medirías y qué esperarías encontrar.',
      en: 'In your area, which zone do you think stays warmest at nightfall and why? Write a hypothesis saying what you would compare, what you would measure it with and what you would expect to find.' },
    { es: 'Piensa en los aguaceros de los últimos años en tu ciudad. Escribe una hipótesis sobre cómo se relacionan con la temperatura de esos días y di qué registros te harían falta para ponerla a prueba.',
      en: 'Think about the downpours of the last few years in your city. Write a hypothesis about how they relate to the temperature of those days and say which records you would need to put it to the test.' },
    { es: 'Dibuja o describe el recorrido de la energía solar en un patio con árboles y en otro de puro cemento, y escribe una hipótesis sobre cuál de los dos estará más caliente a las seis de la tarde.',
      en: 'Sketch or describe the path of solar energy in a yard with trees and in another of bare concrete, and write a hypothesis about which of the two will be hotter at six in the afternoon.' },
    { es: 'Alguien dice que un invierno frío desmiente el calentamiento global. Escribe una hipótesis y di qué datos, y de cuántos años, harían falta para decidir quién tiene razón.',
      en: 'Someone says that a cold winter disproves global warming. Write a hypothesis and say what data, and from how many years, would be needed to settle who is right.' }
  ];
  var p = PR[Math.floor(rng() * PR.length)];
  var host = iw('reflect', 'wHipW');
  host.innerHTML =
    '<div class="iw-tag">' + L({ es: 'Escribe tu hipótesis', en: 'Write your hypothesis' }) + '</div>' +
    '<div class="iw-sub">' + L(p) + '</div>' +
    '<div class="wtabs">' +
      '<button class="wtab active" onclick="wHipTab(\'type\',this)">' + t('tab-type') + '</button>' +
      '<button class="wtab" onclick="wHipTab(\'draw\',this)">' + t('tab-draw') + '</button>' +
    '</div>' +
    '<div class="wpanel active" id="wHip_type"><textarea class="wtextarea" id="wHipTa" placeholder="' + L({ es: 'Mi hipótesis es que...', en: 'My hypothesis is that...' }) + '"></textarea></div>' +
    '<div class="wpanel" id="wHip_draw">' +
      '<div class="cvwrap">' +
        '<canvas class="dcanvas" id="wHipCv"></canvas>' +
        '<div class="ctoolbar">' +
          '<button class="tbtn2 bpen on">' + t('btn-pen') + '</button>' +
          '<button class="tbtn2 bmarker">' + t('btn-marker') + '</button>' +
          '<button class="tbtn2 beraser">' + t('btn-eraser') + '</button>' +
          '<div class="cdot sel" data-color="#0f2d5a" style="background:#0f2d5a"></div>' +
          '<div class="cdot" data-color="#1a1a16" style="background:#1a1a16"></div>' +
          '<div class="cdot" data-color="#8b2500" style="background:#8b2500"></div>' +
          '<div class="cdot" data-color="#1d4e89" style="background:#1d4e89"></div>' +
          '<button class="clrbtn">' + t('btn-clear') + '</button>' +
        '</div>' +
      '</div>' +
    '</div>' +
    '<button class="rverify-btn" onclick="wHipSave()">' + L({ es: 'Guardar', en: 'Save' }) + '</button>' +
    '<div class="rfb" id="wHipFb"></div>';

  window.wHipTab = function(which, btn){
    ['type', 'draw'].forEach(function(k){
      var el = document.getElementById('wHip_' + k);
      if (el) el.classList.toggle('active', k === which);
    });
    host.querySelectorAll('.wtab').forEach(function(b){ b.classList.remove('active'); });
    btn.classList.add('active');
    if (which === 'draw') setTimeout(function(){
      var c = document.getElementById('wHipCv');
      if (c && !c.dataset.ready){ c.dataset.ready = '1'; initCanvas(c); }
    }, 60);
  };
  window.wHipSave = function(){
    var ta = document.getElementById('wHipTa');
    var largo = ta && ta.value.trim().length;
    document.getElementById('wHipFb').innerHTML = '<span class="okfb">✓ ' + (largo > 40
      ? L({ es: 'Guardada. Fíjate si tu hipótesis dice ya qué se mide y con qué se compara: eso es lo que la vuelve comprobable.',
            en: 'Saved. Check whether your hypothesis already says what is measured and what it is compared with: that is what makes it testable.' })
      : L({ es: 'Guardada. Puedes ampliarla: añade qué medirías y con qué compararías esa medida.',
            en: 'Saved. You can extend it: add what you would measure and what you would compare that measurement with.' })) + '</span>';
  };
}

</script>
