<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Métodos de Separación de Mezclas</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }

/* ── LAB WIDGETS (topic manipulatives) ── */
.labtitle { font-family:'Crimson Pro',serif; font-size:1.05rem; font-weight:700; margin-bottom:.15rem; }
.labsub { font-size:.79rem; color:var(--text3); margin-bottom:.7rem; }
.wcanvas { display:block; width:100%; height:220px; border:1px solid var(--border); border-radius:10px; background:var(--surface2); touch-action:none; }
.fbline { margin-top:.6rem; font-size:.83rem; min-height:1.35rem; color:var(--text2); }
.fbline.good { color:var(--ok); font-weight:600; }
.fbline.warn { color:var(--gold); }
.fbline.bad  { color:var(--bad); }
.tally { font-size:.72rem; letter-spacing:.06em; text-transform:uppercase; color:var(--text3); margin-top:.55rem; }
.qprompt { font-size:.86rem; font-weight:600; margin:.75rem 0 .4rem; }
.slrow { margin:.7rem 0 .2rem; }
.slrow label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.slrow input[type=range] { width:100%; accent-color:var(--green); min-height:28px; }
.chiprow { display:flex; gap:.4rem; flex-wrap:wrap; margin-bottom:.6rem; }
.samplename { font-family:'IBM Plex Mono',monospace; font-size:.82rem; color:var(--green-dark); font-weight:500; margin-bottom:.4rem; }
.revealbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.6rem .8rem; font-size:.82rem; color:var(--text2); margin-top:.6rem; }
.revealbox.show { display:block; }
.legend { display:flex; gap:.8rem; flex-wrap:wrap; font-size:.72rem; color:var(--text3); margin-top:.5rem; }
.lgdot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:.3rem; vertical-align:middle; }
@media (max-width:600px){ .wcanvas { height:200px; } .mtab { min-height:34px; } }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Métodos de Separación de Mezclas</div>
    <div class="wcourse" id="wcourse-el">Química · 3° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Métodos de Separación de Mezclas</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>

function getAttemptKey(name, group){ return 'qui3_t03_g02__att__' + (name+'__'+group).replace(/\s+/g,'_'); }
function nextAttempt(name, group){ var k=getAttemptKey(name,group),n=0; try{n=parseInt(localStorage.getItem(k)||'0',10)||0;}catch(e){} n++; try{localStorage.setItem(k,String(n));}catch(e){} return n; }
function currentAttempt(name, group){ var k=getAttemptKey(name,group); try{return parseInt(localStorage.getItem(k)||'1',10)||1;}catch(e){return 1;} }

function saveSession() {
  if (!studentData.name) return;
  var drawings = [], texts = [], photos = [];
  problems.forEach(function(p, i) {
    var dc = document.getElementById('dc' + i);
    if (dc && dc.width) {
      var blank = document.createElement('canvas');
      blank.width = dc.width; blank.height = dc.height;
      drawings.push(dc.toDataURL() === blank.toDataURL() ? null : dc.toDataURL('image/png'));
    } else { drawings.push(null); }
    var ta = document.getElementById('ta' + i);
    texts.push(ta ? ta.value : '');
    var pp = document.getElementById('pp' + i);
    photos.push((pp && pp.src && pp.src.indexOf('data:') === 0) ? pp.src : null);
  });
  var state = {

}

function restoreSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  var saved = loadSession(name, group);
  if (!saved) return;
  document.getElementById('restoreBar').style.display = 'none';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = currentAttempt(name, group);
  buildLesson(seededRng(name + group + att));
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
  saved.choices.forEach(function(choice, idx) {
    if (choice !== null && choice !== undefined) confirmMC(idx, choice);
  });
  setTimeout(function() {
    if (saved.drawings) {
      saved.drawings.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var dc = document.getElementById('dc' + i);
        if (!dc || !dc.width) return;
        var img = new Image();

          var dpr = window.devicePixelRatio || 1;
          dc.getContext('2d').drawImage(img, 0, 0, dc.width / dpr, dc.height / dpr);
        };
        img.src = dataUrl;
      });
    }
    if (saved.texts) {
      saved.texts.forEach(function(text, i) {
        if (!text) return;
        var ta = document.getElementById('ta' + i);
        if (ta) ta.value = text;
      });
    }
    if (saved.photos) {
      saved.photos.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var pp = document.getElementById('pp' + i);
        if (!pp) return;
        pp.src = dataUrl; pp.style.display = 'block';
        var pz = document.getElementById('pz' + i);
        if (pz) pz.style.opacity = '0.4';
      });
    }
  }, 300);
}

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

/* ================================================
   CONTENT HELPERS (bilingual resolution, shuffling, DOM builders)
   ================================================ */
function L(o){
  if (o === null || o === undefined) return '';
  if (typeof o === 'string' || typeof o === 'number') return o;
  return (o[LANG] !== undefined) ? o[LANG] : o.es;
}
function shuffleArr(a, rng){
  var c = a.slice();
  for (var i=c.length-1;i>0;i--){ var j=Math.floor(rng()*(i+1)); var t=c[i]; c[i]=c[j]; c[j]=t; }
  return c;
}
function shuffleOpts(opts, ci, rng){
  var pairs = opts.map(function(o,i){ return { o:o, i:i }; });
  for (var k=pairs.length-1;k>0;k--){ var j=Math.floor(rng()*(k+1)); var t=pairs[k]; pairs[k]=pairs[j]; pairs[j]=t; }
  var out=[], idx=0;
  pairs.forEach(function(e,n){ out.push(e.o); if (e.i===ci) idx=n; });
  return { options:out, idx:idx };
}
function probObj(v, rng){
  var sh = shuffleOpts(L(v.opts), v.ci, rng);
  return { title:L(v.title), questionText:L(v.stmt), fn:v.fn||'', showWork:!!v.sw,
           hint:L(v.hint), explanation:L(v.exp), options:sh.options, correctIdx:sh.idx };
}
function cssv(name){
  try { var v = getComputedStyle(document.documentElement).getPropertyValue(name); return (v||'').trim() || 'gray'; }
  catch(e){ return 'gray'; }
}
function elt(tag, cls, html){
  var d = document.createElement(tag);
  if (cls) d.className = cls;
  if (html !== undefined) d.innerHTML = html;
  return d;
}
function addSection(tag, title, bodyHtml){
  var s = elt('div','section','<div class="stag">'+tag+'</div><h2>'+title+'</h2>'+bodyHtml);
  document.getElementById('lessonBody').appendChild(s);
  return s;
}
function labCard(host, title, sub, inner){
  var c = elt('div','gcrd','<div class="labtitle">'+title+'</div><div class="labsub">'+sub+'</div>'+(inner||''));
  host.appendChild(c);
  return c;
}

/* ── WIDGET 1: lupa clasificadora (homogénea / heterogénea) ── */
function widgetLupa(rng, host){
  var SAMPLES = [
    { name:{es:'Agua de mar ya filtrada', en:'Seawater, already filtered'}, homo:true,
      why:{es:'La sal está disuelta en el agua: por más aumento que uses, el campo se ve parejo. Es una disolución, una sola fase.',
           en:'The salt is dissolved in the water: no matter the zoom, the field looks even. It is a solution, a single phase.'} },
    { name:{es:'Aderezo de aceite y vinagre recién agitado', en:'Freshly shaken oil and vinegar dressing'}, homo:false,
      why:{es:'Al aumentar aparecen gotas de aceite dentro del vinagre: el aceite es la fase dispersa y el vinagre la fase dispersante.',
           en:'Zooming in shows oil droplets inside the vinegar: the oil is the dispersed phase and the vinegar the dispersing phase.'} },
    { name:{es:'Acero inoxidable pulido', en:'Polished stainless steel'}, homo:true,
      why:{es:'Es una aleación: hierro, cromo y níquel quedaron repartidos de manera uniforme, sin zonas distinguibles.',
           en:'It is an alloy: iron, chromium and nickel ended up evenly spread, with no distinguishable zones.'} },
    { name:{es:'Gelatina con trozos de durazno', en:'Gelatin with peach pieces'}, homo:false,
      why:{es:'Los trozos de fruta se ven como zonas separadas del gel que los rodea: hay más de una fase.',
           en:'The fruit pieces show up as zones separate from the gel around them: there is more than one phase.'} },
    { name:{es:'Aire limpio dentro de un frasco', en:'Clean air inside a jar'}, homo:true,
      why:{es:'Nitrógeno, oxígeno y otros gases están mezclados molécula con molécula: ninguna superficie los separa.',
           en:'Nitrogen, oxygen and other gases are mixed molecule by molecule: no surface separates them.'} },
    { name:{es:'Agua de lluvia con arena en suspensión', en:'Rainwater with suspended sand'}, homo:false,
      why:{es:'Los granos de arena siguen enteros dentro del agua: se ven como partículas sueltas, no disueltas.',
           en:'The sand grains stay whole inside the water: they look like loose particles, not dissolved ones.'} }
  ];
  var rounds = shuffleArr(SAMPLES, rng).slice(0,4);
  var blobs = rounds.map(function(){
    var a=[]; for (var i=0;i<16;i++){ a.push({ x:0.08+rng()*0.84, y:0.08+rng()*0.84, r:0.45+rng()*0.7 }); } return a;
  });
  var ri=0, tries=0, solved=0, done=false;
  var card = labCard(host,
    L({es:'Lupa clasificadora', en:'Sorting magnifier'}),
    L({es:'Sube el aumento y observa el campo antes de decidir cómo es la muestra.',
       en:'Raise the zoom and watch the field before deciding what the sample is.'}),
    '<div class="samplename" id="lpName"></div>'+
    '<canvas class="wcanvas" id="lpCv"></canvas>'+
    '<div class="slrow"><label id="lpZlbl"></label><input type="range" id="lpZ" min="1" max="12" value="1"></div>'+
    '<div class="qprompt" id="lpQ"></div>'+
    '<div class="mtabs"><button class="mtab" id="lpHo"></button><button class="mtab" id="lpHe"></button></div>'+
    '<div class="fbline" id="lpFb"></div><div class="revealbox" id="lpRv"></div><div class="tally" id="lpTa"></div>');
  function q(sel){ return card.querySelector(sel); }
  function draw(){
    var cv = q('#lpCv'); if (!cv) return;
    var w = cv.clientWidth || 320, h = cv.clientHeight || 210, dpr = window.devicePixelRatio || 1;
    cv.width = w*dpr; cv.height = h*dpr;
    var ctx = cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,w,h);
    var z = parseInt(q('#lpZ').value,10) || 1;
    var idx = Math.min(ri, rounds.length-1);
    var s = rounds[idx], bl = blobs[idx];
    var cx=w/2, cy=h/2, R=Math.min(w,h)*0.42;
    ctx.save();
    ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.clip();
    ctx.fillStyle = CV_FLUID; ctx.fillRect(cx-R,cy-R,2*R,2*R);
    if (s.homo){
      ctx.fillStyle = CV_SPECK;
      for (var i=0;i<260;i++){
        var a=((i*37)%101)/101, b=((i*61)%97)/97;
        ctx.fillRect(cx-R+a*2*R, cy-R+b*2*R, 1.3, 1.3);
      }
    } else {
      ctx.fillStyle = CV_FLUID2;
      bl.forEach(function(p){
        ctx.beginPath(); ctx.arc(cx-R+p.x*2*R, cy-R+p.y*2*R, p.r*z*1.5, 0, Math.PI*2); ctx.fill();
      });
    }
    ctx.restore();
    ctx.strokeStyle = cssv('--green'); ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.stroke();
    ctx.fillStyle = cssv('--text3'); ctx.font = '11px "IBM Plex Sans", sans-serif';
    ctx.fillText(L({es:'aumento',en:'zoom'})+' x'+z, 8, 15);
  }
  function tally(){
    q('#lpTa').textContent = L({es:'Muestras resueltas: ',en:'Samples solved: '}) + solved + ' / ' + rounds.length;
  }
  function renderRound(){
    if (ri >= rounds.length){
      done = true;
      q('#lpName').textContent = L({es:'Recorrido completo', en:'Full run complete'});
      q('#lpFb').className = 'fbline good';
      q('#lpFb').textContent = L({es:'Ya distingues una sola fase de varias fases con la vista.',
                                  en:'You can now tell one phase from several phases by eye.'});
      tally(); return;
    }
    q('#lpName').textContent = L(rounds[ri].name);
    q('#lpZ').value = 1;
    q('#lpFb').textContent = ''; q('#lpFb').className = 'fbline';
    q('#lpRv').className = 'revealbox'; q('#lpRv').innerHTML = '';
    tries = 0; tally(); draw();
  }
  function answer(saysHomo){
    if (done || ri >= rounds.length) return;
    var s = rounds[ri], fb = q('#lpFb');
    var z = parseInt(q('#lpZ').value,10) || 1;
    if (saysHomo === s.homo){
      solved++; ri++;
      fb.className = 'fbline good';
      fb.textContent = L({es:'Bien: ',en:'Right: '}) + L(s.why);
      tally(); setTimeout(renderRound, 1600); return;
    }
    tries++;
    if (tries >= 3){
      var rv = q('#lpRv'); rv.className = 'revealbox show';
      rv.innerHTML = '<strong>'+ L(s.homo ? {es:'Era homogénea.',en:'It was homogeneous.'} : {es:'Era heterogénea.',en:'It was heterogeneous.'}) +'</strong> ' + L(s.why);
      ri++; setTimeout(renderRound, 2600); return;
    }
    fb.className = 'fbline warn';
    if (s.homo){
      fb.textContent = z < 8
        ? L({es:'Antes de decidir, lleva el aumento al máximo: si el campo sigue parejo, no hay dos fases que ver.',
             en:'Before deciding, push the zoom to the top: if the field stays even, there are no two phases to see.'})
        : L({es:'Estás en el aumento máximo y el campo se ve parejo, sin zonas distintas. Vuelve a elegir.',
             en:'You are at maximum zoom and the field looks even, with no distinct zones. Choose again.'});
    } else {
      fb.textContent = z < 8
        ? L({es:'Sube el aumento: hay detalles que no se distinguen con poca amplificación.',
             en:'Raise the zoom: some details do not show up at low magnification.'})
        : L({es:'Con este aumento ya se distinguen manchas separadas del líquido de fondo. Vuelve a elegir.',
             en:'At this zoom you can already tell separate patches from the background liquid. Choose again.'});
    }
  }
  q('#lpZlbl').textContent = L({es:'Aumento de la lupa', en:'Magnifier zoom'});
  q('#lpQ').textContent   = L({es:'¿Cómo es esta muestra?', en:'What is this sample like?'});
  q('#lpHo').textContent  = L({es:'Homogénea', en:'Homogeneous'});
  q('#lpHe').textContent  = L({es:'Heterogénea', en:'Heterogeneous'});
  q('#lpZ').addEventListener('input', draw);
  q('#lpHo').addEventListener('click', function(){ answer(true); });
  q('#lpHe').addEventListener('click', function(){ answer(false); });
  renderRound();
  setTimeout(draw, 120);
}

        c.beginPath(); c.arc(x+7+((i*11)%(bw-14)), y+bh-5-((i*5)%Math.max(5,lh-6)), 1.9, 0, Math.PI*2); c.fill();
      }
    }
  }
  function scene(mk, ok, t){
    var s = ctx2(); if (!s) return;
    var c=s.c, w=s.w, h=s.h;
    var txt = cssv('--text2');
    c.strokeStyle = CV_GLASS;
    if (mk === 'filtracion'){
      c.beginPath(); c.moveTo(w*0.20,28); c.lineTo(w*0.46,28); c.lineTo(w*0.33,78); c.closePath(); c.stroke();
      c.fillStyle = ok ? CV_SOLID : CV_FLUID2;
      c.beginPath(); c.moveTo(w*0.24,36); c.lineTo(w*0.42,36); c.lineTo(w*0.33,62); c.closePath(); c.fill();
      c.strokeStyle = CV_GLASS; c.beginPath(); c.moveTo(w*0.33,78); c.lineTo(w*0.33,96); c.stroke();
      c.fillStyle = CV_FLUID;
      for (var d=0;d<3;d++){
        var dy = 96 + ((t*70 + d*18) % 44);
        c.beginPath(); c.arc(w*0.33, dy, 2.6, 0, Math.PI*2); c.fill();
      }
      beaker(c, w*0.20, 142, w*0.26, 52, 0.15+0.6*t, CV_FLUID, ok ? 0 : 6);
      c.fillStyle = txt; c.fillText(L(LB.paper), w*0.50, 44);
      c.fillText(L(ok ? LB.done : LB.same), w*0.50, 172);
    } else if (mk === 'decantacion'){
      c.strokeRect(w*0.22, 26, w*0.20, 80);
      c.fillStyle = CV_FLUID2; c.fillRect(w*0.22+1.5, 28, w*0.20-3, 30);
      var bot = 44*(1-t);
      c.fillStyle = ok ? CV_FLUID : CV_FLUID2;
      if (bot > 1) c.fillRect(w*0.22+1.5, 104-bot, w*0.20-3, bot);
      c.strokeStyle = CV_GLASS; c.beginPath(); c.moveTo(w*0.32,106); c.lineTo(w*0.32,120); c.stroke();
      beaker(c, w*0.20, 142, w*0.26, 52, 0.12+0.55*t, ok ? CV_FLUID : CV_FLUID2, ok ? 0 : 5);
      c.fillStyle = txt; c.fillText(L(LB.mix), w*0.46, 44);
      c.fillText(L(ok ? LB.done : LB.same), w*0.50, 172);
    } else if (mk === 'evaporacion'){
      var lev = 0.75*(1-t);
      beaker(c, w*0.18, 60, w*0.32, 60, lev, CV_FLUID, ok ? Math.round(10*t) : 4);
      c.fillStyle = CV_HOT;
      for (var f=0;f<5;f++){
        c.beginPath(); c.moveTo(w*0.20+f*10, 132); c.lineTo(w*0.23+f*10, 122); c.lineTo(w*0.26+f*10, 132); c.fill();
      }
      c.fillStyle = CV_SPECK;
      for (var v=0;v<6;v++){
        var vy = 56 - ((t*60 + v*10) % 42);
        c.beginPath(); c.arc(w*0.24+v*12, vy, 2.2, 0, Math.PI*2); c.fill();
      }
      c.fillStyle = txt; c.fillText(L(LB.vapor), w*0.56, 30); c.fillText(L(LB.heat), w*0.20, 148);
      c.fillText(L(ok ? LB.done : LB.same), w*0.56, 108);
    } else if (mk === 'sublimacion'){
      c.strokeStyle = CV_GLASS; c.beginPath(); c.moveTo(w*0.16,34); c.lineTo(w*0.52,34); c.stroke();
      c.fillStyle = CV_VAPOR;
      if (ok) c.fillRect(w*0.22, 26, w*0.24*t, 6);
      for (var g=0;g<7;g++){
        var gy = 110 - ((t*80 + g*12) % 70);
        c.beginPath(); c.arc(w*0.22+g*11, gy, 2.3, 0, Math.PI*2); c.fill();
      }
      beaker(c, w*0.18, 118, w*0.32, 46, 0.5, ok ? CV_SOLID : CV_VAPOR, 8);
      c.fillStyle = CV_HOT;
      for (var f2=0;f2<5;f2++){
        c.beginPath(); c.moveTo(w*0.20+f2*11, 176); c.lineTo(w*0.235+f2*11, 166); c.lineTo(w*0.27+f2*11, 176); c.fill();
      }
      c.fillStyle = txt; c.fillText(L(LB.lid), w*0.56, 32); c.fillText(L(LB.heat), w*0.20, 190);
      c.fillText(L(ok ? LB.done : LB.same), w*0.56, 140);
    } else {
      c.strokeStyle = CV_GLASS; c.strokeRect(w*0.30, 24, w*0.16, 150);
      c.fillStyle = CV_FLUID; c.fillRect(w*0.30+1.5, 158, w*0.16-3, 14);
      var front = 130*t;
      c.strokeStyle = CV_SPECK; c.beginPath();
      c.moveTo(w*0.30, 158-front); c.lineTo(w*0.46, 158-front); c.stroke();
      var aff = ok ? [0.85,0.55,0.25] : [0.5,0.5,0.5];
      for (var p=0;p<3;p++){
        c.fillStyle = CV_PIG[p];
        c.beginPath(); c.arc(w*0.38, 152 - front*aff[p], 5.2, 0, Math.PI*2); c.fill();
      }
      c.fillStyle = txt; c.fillText(L(LB.front), w*0.50, 158-front);
      c.fillText(L(ok ? LB.done : LB.same), w*0.50, 60);
    }
  }
  function animate(mk, ok){
    lastK = mk; lastOk = ok;
    var t0 = null;
    function step(ts){
      if (!card.isConnected) return;
      if (t0 === null) t0 = ts;
      var t = Math.min(1, (ts - t0)/1200);
      scene(mk, ok, t);
      if (t < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }
  function tally(){
    q('#msTa').textContent = L({es:'Mezclas resueltas: ',en:'Mixtures solved: '}) + solved + ' / ' + rounds.length;
  }
  function renderRound(){
    if (ri >= rounds.length){
      done = true;
      q('#msName').textContent = L({es:'Mesa despejada', en:'Bench cleared'});
      q('#msFb').className = 'fbline good';
      q('#msFb').textContent = L({es:'Cada método aprovechó una propiedad física distinta de la mezcla.',
                                  en:'Each method took advantage of a different physical property of the mixture.'});
      tally(); return;
    }
    q('#msName').textContent = L(rounds[ri].name);
    q('#msFb').textContent = ''; q('#msFb').className = 'fbline';
    q('#msRv').className = 'revealbox'; q('#msRv').innerHTML = '';
    tries = 0; tally(); scene('filtracion', false, 0);
  }
  function choose(k){
    if (done || ri >= rounds.length) return;
    var mix = rounds[ri], fb = q('#msFb');
    var m = METHODS.filter(function(x){ return x.k===k; })[0];
    if (k === mix.k){
      solved++; ri++;
      animate(k, true);
      fb.className = 'fbline good';
      fb.textContent = L(m.act) + ' ' + L(mix.win);
      tally(); setTimeout(renderRound, 2000); return;
    }
    animate(k, false);
    tries++;
    if (tries >= 3){
      var good = METHODS.filter(function(x){ return x.k===mix.k; })[0];
      var rv = q('#msRv'); rv.className = 'revealbox show';
      rv.innerHTML = '<strong>'+L(good.name)+'.</strong> ' + L(mix.win);
      ri++; setTimeout(renderRound, 2800); return;
    }
    fb.className = 'fbline warn';
    fb.textContent = L(m.act) + ' ' +
      L({es:'La mezcla salió igual. Fíjate en que aquí ', en:'The mixture came out unchanged. Notice that here '}) +
      L(mix.prop) + '.';
  }
  q('#msQ').textContent = L({es:'¿Qué montaje pones en la mesa?', en:'Which setup do you put on the bench?'});
  q('#msBtns').querySelectorAll('.mtab').forEach(function(b){
    b.addEventListener('click', function(){ choose(b.getAttribute('data-k')); });
  });
  renderRound();
  setTimeout(function(){ scene('filtracion', false, 0); }, 120);
}

/* ── WIDGET 3: columna con termómetro (punto de ebullición) ── */
function widgetDestila(rng, host){
  var PAIRS = [
    { a:{es:'alcohol',en:'alcohol'}, abp:78, b:{es:'agua',en:'water'}, bbp:100 },
    { a:{es:'acetona',en:'acetone'}, abp:56, b:{es:'agua',en:'water'}, bbp:100 }
  ];
  var rounds = shuffleArr(PAIRS, rng);
  var ri=0, tries=0, solved=0, done=false, col=0;
  var card = labCard(host,
    L({es:'Columna con termómetro', en:'Column with thermometer'}),
    L({es:'Mueve la temperatura y observa qué llega al colector.',
       en:'Move the temperature and watch what reaches the collector.'}),
    '<div class="samplename" id="dsName"></div>'+
    '<canvas class="wcanvas" id="dsCv"></canvas>'+
    '<div class="slrow"><label id="dsLbl"></label><input type="range" id="dsT" min="20" max="115" value="20"></div>'+
    '<div class="metrics">'+
      '<div class="metric"><div class="mlbl" id="dsM1l"></div><div class="mnum ts" id="dsM1"></div></div>'+
      '<div class="metric"><div class="mlbl" id="dsM2l"></div><div class="mnum cs" id="dsM2"></div></div>'+
      '<div class="metric"><div class="mlbl" id="dsM3l"></div><div class="mnum ps" id="dsM3"></div></div>'+
    '</div>'+
    '<div class="qprompt" id="dsQ"></div>'+
    '<div class="mtabs"><button class="mtab" id="dsGo"></button></div>'+
    '<div class="fbline" id="dsFb"></div><div class="revealbox" id="dsRv"></div><div class="tally" id="dsTa"></div>');
  function q(sel){ return card.querySelector(sel); }
  function pr(){ return rounds[Math.min(ri, rounds.length-1)]; }
  function temp(){ return parseInt(q('#dsT').value,10) || 20; }
  function state(){
    var p = pr(), t = temp();
    if (t < p.abp) return 0;
    if (t < p.bbp) return 1;
    return 2;
  }
  function draw(ts){
    if (!card.isConnected) return;
    var cv = q('#dsCv'); if (!cv) return;
    var w = cv.clientWidth || 320, h = cv.clientHeight || 210, dpr = window.devicePixelRatio || 1;
    cv.width = w*dpr; cv.height = h*dpr;
    var c = cv.getContext('2d'); c.setTransform(dpr,0,0,dpr,0,0); c.clearRect(0,0,w,h);
    c.lineWidth = 2; c.font = '10.5px "IBM Plex Sans", sans-serif';
    var t = temp(), st = state(), p = pr(), txt = cssv('--text2');
    if (st > 0) col = Math.min(0.72, col + 0.004);
    /* matraz */
    c.strokeStyle = CV_GLASS; c.strokeRect(w*0.10, 96, w*0.26, 68);
    c.fillStyle = CV_FLUID; c.fillRect(w*0.10+1.5, 120, w*0.26-3, 42);
    /* llama */
    c.fillStyle = st > 0 ? CV_HOT : CV_GLASS;
    for (var f=0;f<4;f++){
      c.beginPath(); c.moveTo(w*0.13+f*13, 180); c.lineTo(w*0.165+f*13, 168); c.lineTo(w*0.20+f*13, 180); c.fill();
    }
    /* tubo */
    c.strokeStyle = CV_GLASS;
    c.beginPath(); c.moveTo(w*0.23, 96); c.lineTo(w*0.23, 56); c.lineTo(w*0.72, 56); c.lineTo(w*0.72, 108); c.stroke();
    /* vapor */
    if (st > 0){
      c.fillStyle = st === 1 ? CV_VAPOR : CV_SPECK;
      for (var v=0;v<6;v++){
        var vx = w*0.23 + ((ts/16 + v*40) % (w*0.49));
        c.beginPath(); c.arc(vx, 50, 2.4, 0, Math.PI*2); c.fill();
      }
    }
    /* colector */
    c.strokeStyle = CV_GLASS; c.strokeRect(w*0.60, 112, w*0.24, 52);
    if (col > 0.02){
      c.fillStyle = st === 2 ? CV_SPECK : CV_FLUID2;
      c.fillRect(w*0.60+1.5, 164-52*col, w*0.24-3, 52*col-1.5);
    }
    /* termómetro */
    c.strokeStyle = CV_GLASS; c.strokeRect(w*0.90, 40, 12, 124);
    var fr = (t-20)/95;
    c.fillStyle = t >= p.abp ? CV_HOT : CV_FLUID;
    c.fillRect(w*0.90+2, 162-120*fr, 8, 120*fr);
    c.fillStyle = txt;
    c.fillText(t + ' °C', w*0.78, 34);
    c.fillText(L({es:'colector',en:'collector'}), w*0.60, 176);
    c.fillText(L({es:'matraz',en:'flask'}), w*0.10, 176);
    requestAnimationFrame(draw);
  }
  function refresh(){
    var p = pr(), t = temp(), st = state();
    q('#dsM1').textContent = t + ' °C';
    q('#dsM2').textContent = st === 0 ? L({es:'nada hierve',en:'nothing boils'})
                          : st === 1 ? L(p.a) : L({es:'los dos',en:'both'});
    q('#dsM3').textContent = st === 0 ? L({es:'vacío',en:'empty'})
                          : st === 1 ? L(p.a) : L({es:'mezcla',en:'mixture'});
    var fb = q('#dsFb');
    if (st === 0){
      fb.className = 'fbline';
      fb.textContent = L({es:'Todavía nada hierve, así que nada llega al colector. Sube la temperatura.',
                          en:'Nothing boils yet, so nothing reaches the collector. Raise the temperature.'});
    } else if (st === 1){
      fb.className = 'fbline warn';
      fb.textContent = L({es:'Solo hierve el componente de punto de ebullición más bajo: el colector recibe ',
                          en:'Only the component with the lower boiling point boils: the collector receives '}) + L(p.a) + '.';
    } else {
      fb.className = 'fbline bad';
      fb.textContent = L({es:'Pasaste el punto de ebullición del agua: ahora hierven los dos y el destilado sale mezclado. Baja la temperatura.',
                          en:'You went past the boiling point of water: now both boil and the distillate comes out mixed. Lower the temperature.'});
    }
  }
  function tally(){
    q('#dsTa').textContent = L({es:'Destilados limpios: ',en:'Clean distillates: '}) + solved + ' / ' + rounds.length;
  }
  function renderRound(){
    col = 0;
    if (ri >= rounds.length){
      done = true;
      q('#dsName').textContent = L({es:'Recorrido completo', en:'Full run complete'});
      q('#dsFb').className = 'fbline good';
      q('#dsFb').textContent = L({es:'Con la temperatura justa se recoge un solo componente a la vez.',
                                  en:'With the right temperature you collect a single component at a time.'});
      tally(); return;
    }
    var p = rounds[ri];
    q('#dsName').textContent = L({es:'En el matraz: ',en:'In the flask: '}) + L(p.a) + ' (' + p.abp + ' °C) ' +
      L({es:'y ',en:'and '}) + L(p.b) + ' (' + p.bbp + ' °C)';
    q('#dsT').value = 20;
    q('#dsRv').className = 'revealbox'; q('#dsRv').innerHTML = '';
    tries = 0; tally(); refresh();
  }
  function check(){
    if (done || ri >= rounds.length) return;
    var p = rounds[ri], st = state();
    if (st === 1){
      solved++; ri++;
      q('#dsFb').className = 'fbline good';
      q('#dsFb').textContent = L({es:'Destilado limpio: recogiste ',en:'Clean distillate: you collected '}) + L(p.a) +
        L({es:' sin arrastrar ',en:' without carrying over '}) + L(p.b) + '.';
      tally(); setTimeout(renderRound, 2000); return;
    }
    tries++;
    if (tries >= 3){
      var rv = q('#dsRv'); rv.className = 'revealbox show';
      rv.innerHTML = '<strong>'+ L({es:'Intervalo útil: ',en:'Useful range: '}) + p.abp + ' °C ' +
        L({es:'a',en:'to'}) + ' ' + (p.bbp-1) + ' °C.</strong> ' +
        L({es:'Ahí hierve solo ',en:'There only '}) + L(p.a) + L({es:'.',en:' boils.'});
      ri++; setTimeout(renderRound, 3000); return;
    }
    refresh();
  }
  q('#dsLbl').textContent = L({es:'Temperatura del matraz', en:'Flask temperature'});
  q('#dsM1l').textContent = L({es:'Temperatura', en:'Temperature'});
  q('#dsM2l').textContent = L({es:'Hierve', en:'Boiling'});
  q('#dsM3l').textContent = L({es:'En el colector', en:'In the collector'});
  q('#dsQ').textContent   = L({es:'Ajusta la temperatura para recoger un solo componente.',
                               en:'Set the temperature to collect a single component.'});
  q('#dsGo').textContent  = L({es:'Recoger el destilado', en:'Collect the distillate'});
  q('#dsT').addEventListener('input', function(){ col = 0; refresh(); });
  q('#dsGo').addEventListener('click', check);
  renderRound();
  requestAnimationFrame(draw);
}

/* ── WIDGET 4: cromatografía en papel (afinidad por el disolvente) ── */
function widgetCroma(rng, host){
  var NAMES = [ {es:'amarillo',en:'yellow'}, {es:'azul',en:'blue'}, {es:'rojo',en:'red'} ];
  var rounds = [0,1,2].map(function(){ return shuffleArr([0.88,0.56,0.26], rng); });
  var ri=0, tries=0, solved=0, done=false;
  var btns = NAMES.map(function(n,i){ return '<button class="mtab" data-p="'+i+'">'+L(n)+'</button>'; }).join('');
  var card = labCard(host,
    L({es:'Tira de cromatografía', en:'Chromatography strip'}),
    L({es:'Deja subir el disolvente y compara hasta dónde llega cada pigmento.',
       en:'Let the solvent climb and compare how far each pigment travels.'}),
    '<canvas class="wcanvas" id="crCv"></canvas>'+
    '<div class="slrow"><label id="crLbl"></label><input type="range" id="crF" min="0" max="100" value="0"></div>'+
    '<div class="qprompt" id="crQ"></div>'+
    '<div class="mtabs" id="crBtns">'+btns+'</div>'+
    '<div class="fbline" id="crFb"></div><div class="revealbox" id="crRv"></div><div class="tally" id="crTa"></div>');
  function q(sel){ return card.querySelector(sel); }
  function front(){ return (parseInt(q('#crF').value,10) || 0)/100; }
  function aff(){ return rounds[Math.min(ri, rounds.length-1)]; }
  function best(){
    var a = aff(), bi = 0;
    for (var i=1;i<3;i++) if (a[i] > a[bi]) bi = i;
    return bi;
  }
  function draw(){
    var cv = q('#crCv'); if (!cv) return;
    var w = cv.clientWidth || 320, h = cv.clientHeight || 210, dpr = window.devicePixelRatio || 1;
    cv.width = w*dpr; cv.height = h*dpr;
    var c = cv.getContext('2d'); c.setTransform(dpr,0,0,dpr,0,0); c.clearRect(0,0,w,h);
    c.lineWidth = 2; c.font = '11px "IBM Plex Sans", sans-serif';
    var base = h-26, top = 22, run = base - top, fr = front(), a = aff();
    c.strokeStyle = CV_GLASS; c.strokeRect(w*0.26, top-8, w*0.20, run+22);
    c.fillStyle = CV_FLUID; c.fillRect(w*0.26+1.5, base, w*0.20-3, 14);
    c.strokeStyle = CV_SPECK;
    c.beginPath(); c.moveTo(w*0.26, base - run*fr); c.lineTo(w*0.46, base - run*fr); c.stroke();
    c.fillStyle = cssv('--text3');
    c.fillText(L({es:'frente del disolvente',en:'solvent front'}), w*0.50, base - run*fr + 4);
    for (var p=0;p<3;p++){
      var y = base - 6 - run*fr*a[p];
      c.fillStyle = CV_PIG[p];
      c.beginPath(); c.ellipse(w*0.36, y, 9, 5.5, 0, 0, Math.PI*2); c.fill();
      c.fillText(L(NAMES[p]), w*0.05, y + 4);
    }
    c.fillStyle = cssv('--text3');
    c.fillText(L({es:'línea de salida',en:'start line'}), w*0.50, base - 2);
  }
  function tally(){
    q('#crTa').textContent = L({es:'Tiras leídas: ',en:'Strips read: '}) + solved + ' / ' + rounds.length;
  }
  function renderRound(){
    if (ri >= rounds.length){
      done = true;
      q('#crFb').className = 'fbline good';
      q('#crFb').textContent = L({es:'La altura de cada mancha depende de su afinidad por el disolvente y por el papel.',
                                  en:'The height of each patch depends on its affinity for the solvent and for the paper.'});
      tally(); return;
    }
    q('#crF').value = 0;
    q('#crFb').textContent = ''; q('#crFb').className = 'fbline';
    q('#crRv').className = 'revealbox'; q('#crRv').innerHTML = '';
    tries = 0; tally(); draw();
  }
  function choose(p){
    if (done || ri >= rounds.length) return;
    var fb = q('#crFb'), fr = front(), bi = best();
    if (fr < 0.35){
      fb.className = 'fbline warn';
      fb.textContent = L({es:'Con tan poco avance del disolvente las manchas casi coinciden: deja subir más antes de comparar.',
                          en:'With so little solvent climb the patches nearly overlap: let it rise further before comparing.'});
      draw(); return;
    }
    if (p === bi){
      solved++; ri++;
      fb.className = 'fbline good';
      fb.textContent = L({es:'El pigmento ',en:'The '}) + L(NAMES[p]) +
        L({es:' llegó más alto: el disolvente lo arrastra mejor y se pega menos al papel.',
           en:' pigment travelled highest: the solvent carries it better and it clings less to the paper.'});
      tally(); setTimeout(renderRound, 2000); return;
    }
    tries++;
    if (tries >= 3){
      var rv = q('#crRv'); rv.className = 'revealbox show';
      rv.innerHTML = '<strong>'+L(NAMES[bi])+'.</strong> ' +
        L({es:'Es la mancha más alejada de la línea de salida.', en:'It is the patch farthest from the start line.'});
      ri++; setTimeout(renderRound, 2800); return;
    }
    fb.className = 'fbline bad';
    fb.textContent = L({es:'El pigmento ',en:'The '}) + L(NAMES[p]) +
      L({es:' quedó por debajo de otro. Compara la distancia desde la línea de salida.',
         en:' pigment ended up below another one. Compare the distance from the start line.'});
  }
  q('#crLbl').textContent = L({es:'Avance del disolvente', en:'Solvent climb'});
  q('#crQ').textContent   = L({es:'¿Cuál pigmento arrastra más lejos el disolvente?', en:'Which pigment does the solvent carry farthest?'});
  q('#crF').addEventListener('input', draw);
  q('#crBtns').querySelectorAll('.mtab').forEach(function(b){
    b.addEventListener('click', function(){ choose(parseInt(b.getAttribute('data-p'),10)); });
  });
  renderRound();
  setTimeout(draw, 120);
}

/* ── WIDGET 5: mezclador de concentración (porcentaje en masa) ── */

      '<div class="cg slrow"><label id="mzSl"></label><input type="range" id="mzS" min="2" max="60" value="10"></div>'+
      '<div class="cg slrow"><label id="mzWl"></label><input type="range" id="mzW" min="40" max="300" value="190"></div>'+
    '</div>'+
    '<div class="metrics">'+
      '<div class="metric"><div class="mlbl" id="mzM1l"></div><div class="mnum ts" id="mzM1"></div></div>'+
      '<div class="metric"><div class="mlbl" id="mzM2l"></div><div class="mnum cs" id="mzM2"></div></div>'+
      '<div class="metric"><div class="mlbl" id="mzM3l"></div><div class="mnum ps" id="mzM3"></div></div>'+
    '</div>'+
    '<div class="qprompt" id="mzQ"></div>'+
    '<div class="mtabs"><button class="mtab" id="mzGo"></button></div>'+
    '<div class="fbline" id="mzFb"></div><div class="revealbox" id="mzRv"></div><div class="tally" id="mzTa"></div>');
  function q(sel){ return card.querySelector(sel); }
  function sol(){ return parseInt(q('#mzS').value,10) || 2; }
  function wat(){ return parseInt(q('#mzW').value,10) || 40; }
  function pct(){ return sol()*100/(sol()+wat()); }
  function draw(){
    var cv = q('#mzCv'); if (!cv) return;
    var w = cv.clientWidth || 320, h = cv.clientHeight || 210, dpr = window.devicePixelRatio || 1;
    cv.width = w*dpr; cv.height = h*dpr;
    var c = cv.getContext('2d'); c.setTransform(dpr,0,0,dpr,0,0); c.clearRect(0,0,w,h);
    c.lineWidth = 2; c.font = '11px "IBM Plex Sans", sans-serif';
    var total = sol()+wat(), p = pct();
    var bx = w*0.30, bw = w*0.40, by = 26, bh = h-70;
    c.strokeStyle = CV_GLASS; c.strokeRect(bx, by, bw, bh);
    var lev = Math.min(0.94, 0.18 + total/420);
    var lh = bh*lev;
    c.fillStyle = 'rgba(60,110,170,' + (0.16 + Math.min(0.74, p/34)).toFixed(2) + ')';
    c.fillRect(bx+1.5, by+bh-lh, bw-3, lh-1.5);
    c.fillStyle = CV_SOLID;
    var dots = Math.round(sol()/3);
    for (var i=0;i<dots;i++){
      var dx = bx + 8 + ((i*17)%(bw-16));
      var dy = by + bh - 8 - ((i*11)%Math.max(8, lh-10));
      c.beginPath(); c.arc(dx, dy, 2.1, 0, Math.PI*2); c.fill();
    }
    c.fillStyle = cssv('--text2');
    c.fillText(p.toFixed(1) + ' %', bx + bw + 10, by + bh - lh + 4);
    c.fillText(total + ' g', bx + bw + 10, by + bh);
    var tg = targets[Math.min(ri, targets.length-1)];
    c.fillStyle = cssv('--gold');
    c.fillText(L({es:'meta: ',en:'target: '}) + tg + ' %', 8, 18);
  }
  function tally(){
    q('#mzTa').textContent = L({es:'Metas alcanzadas: ',en:'Targets reached: '}) + solved + ' / ' + targets.length;
  }
  function refresh(){
    var p = pct(), tg = targets[Math.min(ri, targets.length-1)];
    q('#mzM1').textContent = sol() + ' g';
    q('#mzM2').textContent = (sol()+wat()) + ' g';
    q('#mzM3').textContent = p.toFixed(1) + ' %';
    var fb = q('#mzFb'), d = p - tg;
    if (done){ draw(); return; }
    if (Math.abs(d) <= 0.3){
      fb.className = 'fbline good';
      fb.textContent = L({es:'Estás en la meta: confirma la mezcla.', en:'You are on target: confirm the mixture.'});
    } else if (d < 0){
      fb.className = 'fbline warn';
      fb.textContent = L({es:'Te faltan ',en:'You are '}) + Math.abs(d).toFixed(1) +
        L({es:' puntos: agrega soluto o quita agua.', en:' points short: add solute or remove water.'});
    } else {
      fb.className = 'fbline warn';
      fb.textContent = L({es:'Te pasaste por ',en:'You are over by '}) + d.toFixed(1) +
        L({es:' puntos: quita soluto o agrega agua.', en:' points: remove solute or add water.'});
    }
    draw();
  }
  function renderRound(){
    if (ri >= targets.length){
      done = true;
      q('#mzQ').textContent = L({es:'Tres mezclas ajustadas.', en:'Three mixtures adjusted.'});
      q('#mzFb').className = 'fbline good';
      q('#mzFb').textContent = L({es:'El porcentaje depende de la masa del soluto y de la masa total, no solo del soluto.',
                                  en:'The percentage depends on the solute mass and the total mass, not on the solute alone.'});
      tally(); draw(); return;
    }
    q('#mzQ').textContent = L({es:'Consigue una disolución al ',en:'Reach a solution at '}) + targets[ri] +
      L({es:' % en masa.',en:' % by mass.'});
    q('#mzRv').className = 'revealbox'; q('#mzRv').innerHTML = '';
    tries = 0; tally(); refresh();
  }
  function check(){
    if (done || ri >= targets.length) return;
    var tg = targets[ri], p = pct();
    if (Math.abs(p - tg) <= 0.3){
      solved++; ri++;
      q('#mzFb').className = 'fbline good';
      q('#mzFb').textContent = L({es:'Mezcla lista: ',en:'Mixture ready: '}) + sol() + ' g ' +
        L({es:'de soluto en ',en:'of solute in '}) + (sol()+wat()) + ' g ' +
        L({es:'de disolución.',en:'of solution.'});
      tally(); setTimeout(renderRound, 2000); return;
    }
    tries++;
    if (tries >= 3){
      var w2 = Math.round(sol()*100/tg) - sol();
      var rv = q('#mzRv'); rv.className = 'revealbox show';
      rv.innerHTML = '<strong>'+ sol() + ' g ' + L({es:'de soluto con ',en:'of solute with '}) + w2 + ' g ' +
        L({es:'de agua.',en:'of water.'}) + '</strong> ' +
        L({es:'Así la masa total deja al soluto en la meta.', en:'That total mass puts the solute right on target.'});
      ri++; setTimeout(renderRound, 3000); return;
    }
    refresh();
  }
  q('#mzSl').textContent  = L({es:'Masa de soluto (g)', en:'Solute mass (g)'});
  q('#mzWl').textContent  = L({es:'Masa de agua (g)', en:'Water mass (g)'});
  q('#mzM1l').textContent = L({es:'Soluto', en:'Solute'});
  q('#mzM2l').textContent = L({es:'Masa total', en:'Total mass'});
  q('#mzM3l').textContent = L({es:'En masa', en:'By mass'});
  q('#mzGo').textContent  = L({es:'Confirmar mezcla', en:'Confirm mixture'});
  q('#mzS').addEventListener('input', refresh);
  q('#mzW').addEventListener('input', refresh);
  q('#mzGo').addEventListener('click', check);
  renderRound();
  setTimeout(draw, 120);
}

  document.getElementById('progFill').style.width = '0%';
}
</script>

<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbyytGUdwxVpgXSHoXM1ISKh036P3GlF1BmF6aVRCR3DLpmtgefG09htw_l5IJW3UwoG/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var body = JSON.stringify({school:school,event:ev,module_id:moduleId,
      session_id:sessionId,elapsed_sec:Math.round((Date.now()-openedAt)/1000)});
    if(ev==='module_close'&&navigator.sendBeacon){
      navigator.sendBeacon(GAS_URL,new Blob([body],{type:'application/json'}));
    }else{
      fetch(GAS_URL,{method:'POST',body:body,headers:{'Content-Type':'application/json'},keepalive:true}).catch(function(){});
    }
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
