/* ══ MANIPULATIVO 1 · TANQUE DE DENSIDAD ═══════════════════════════════════
   Dos deslizadores (masa y volumen) mueven en vivo la densidad del cubo y la
   altura a la que se acomoda en el agua. Tres rondas con objetivos distintos;
   la pista es direccional y al tercer intento se revela una combinación válida.
   ═══════════════════════════════════════════════════════════════════════════ */
function wDensity(rng){
  var host = iw('density', 'wDens');
  var TG = shuffle([0.5, 0.6, 0.75, 0.8, 0.9], rng).slice(0, 3);
  var st = { r: 0, m: 320, v: 400, tries: 0, done: false };
  function tgt(){ return TG[Math.min(st.r, TG.length - 1)]; }
  function dens(){ return st.m / st.v; }

  host.innerHTML =
    '<div class="iw-tag">' + L({ es: 'Tanque de densidad', en: 'Density tank' }) + '</div>' +
    '<div class="iw-task" id="wDensTask"></div>' +
    '<div class="iw-cv"><canvas id="wDensCv"></canvas></div>' +
    '<div class="ctrl"><label>' + L({ es: 'Masa del cubo', en: 'Cube mass' }) + ': <b id="wDensML"></b> g</label>' +
      '<input type="range" id="wDensM" min="50" max="800" step="10" value="' + st.m + '" oninput="wDensIn()"></div>' +
    '<div class="ctrl"><label>' + L({ es: 'Volumen del cubo', en: 'Cube volume' }) + ': <b id="wDensVL"></b> cm³</label>' +
      '<input type="range" id="wDensV" min="100" max="800" step="10" value="' + st.v + '" oninput="wDensIn()"></div>' +
    '<div class="readout">' +
      '<div class="ro"><div class="ro-l">' + L({ es: 'Densidad', en: 'Density' }) + '</div><div class="ro-v" id="wDensD"></div></div>' +
      '<div class="ro"><div class="ro-l">' + L({ es: 'Bajo el agua', en: 'Under water' }) + '</div><div class="ro-v" id="wDensF"></div></div>' +
      '<div class="ro"><div class="ro-l">' + L({ es: 'Objetivo', en: 'Target' }) + '</div><div class="ro-v" id="wDensT"></div></div>' +
    '</div>' +
    '<button class="rverify-btn" onclick="wDensCheck()">' + L({ es: 'Comprobar', en: 'Check' }) + '</button>' +
    '<div class="rfb" id="wDensFb"></div>';

  function draw(){
    var cv = document.getElementById('wDensCv');
    if (!cv) return;
    var rect = cv.getBoundingClientRect();
    var dpr = window.devicePixelRatio || 1;
    var W = Math.round(rect.width || 320), H = 190;
    cv.width = W * dpr; cv.height = H * dpr;
    var c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, W, H);
    var tx = 12, tw = W - 24, ty = 14, th = H - 34, wl = ty + th * 0.26;
    c.fillStyle = CV('--wtr'); c.fillRect(tx, wl, tw, ty + th - wl);
    c.strokeStyle = CV('--wtr2'); c.lineWidth = 2;
    c.beginPath(); c.moveTo(tx, wl); c.lineTo(tx + tw, wl); c.stroke();
    c.strokeStyle = CV('--border'); c.lineWidth = 2; c.strokeRect(tx, ty, tw, th);
    var d = dens(), side = 56, f = Math.min(d, 1);
    var cx = tx + tw / 2 - side / 2;
    var top = (d >= 1) ? (ty + th - side - 3) : (wl - side * (1 - f));
    c.fillStyle = CV('--obj'); c.fillRect(cx, top, side, side);
    c.strokeStyle = CV('--obj2'); c.lineWidth = 2; c.strokeRect(cx, top, side, side);
    c.fillStyle = CV('--text2');
    c.font = '12px IBM Plex Sans, sans-serif';
    c.fillText(num(d) + ' g/cm³', cx + side + 10, top + side / 2);
    c.fillText(L({ es: 'agua 1 g/cm³', en: 'water 1 g/cm³' }), tx + 6, H - 8);
  }
  function paint(){
    document.getElementById('wDensML').textContent = st.m;
    document.getElementById('wDensVL').textContent = st.v;
    var d = dens();
    document.getElementById('wDensD').textContent = num(d);
    document.getElementById('wDensF').textContent = (d >= 1) ? L({ es: 'se hunde', en: 'it sinks' }) : (Math.round(d * 100) + '%');
    document.getElementById('wDensT').textContent = st.done ? L({ es: 'listo', en: 'done' }) : (Math.round(tgt() * 100) + '%');
    document.getElementById('wDensTask').textContent = st.done
      ? L({ es: 'Tanque libre: mueve los deslizadores y comprueba cualquier densidad que se te ocurra.', en: 'Free tank: move the sliders and try any density you can think of.' })
      : L({ es: 'Ronda ' + (st.r + 1) + ' de 3: ajusta la masa y el volumen para que el cubo flote con el ' + Math.round(tgt() * 100) + '% de su volumen bajo el agua.',
            en: 'Round ' + (st.r + 1) + ' of 3: set the mass and the volume so the cube floats with ' + Math.round(tgt() * 100) + '% of its volume under water.' });
    draw();
  }
  window.wDensIn = function(){
    st.m = parseInt(document.getElementById('wDensM').value, 10);
    st.v = parseInt(document.getElementById('wDensV').value, 10);
    paint();
  };
  window.wDensCheck = function(){
    var fb = document.getElementById('wDensFb');
    if (st.done) { fb.textContent = L({ es: 'Densidad actual: ' + num(dens()) + ' g/cm³.', en: 'Current density: ' + num(dens()) + ' g/cm³.' }); return; }
    var d = dens(), tg = tgt();
    if (Math.abs(d - tg) <= 0.02) {
      st.r++; st.tries = 0;
      if (st.r >= TG.length) st.done = true;
      paint();
      fb.innerHTML = '<span class="okfb">🎉 ' + (st.done
        ? L({ es: '¡Las tres rondas resueltas! Ya sabes fabricar la densidad que quieras.', en: 'All three rounds solved! You can build any density you want now.' })
        : L({ es: '¡Exacto! El cubo se acomodó justo donde debía. Va otra ronda.', en: 'Exactly! The cube settled right where it should. Here comes another round.' })) + '</span>';
      return;
    }
    st.tries++;
    if (st.tries >= 3) {
      var mm = Math.round(tg * 400);
      st.m = mm; st.v = 400; st.tries = 0;
      document.getElementById('wDensM').value = mm;
      document.getElementById('wDensV').value = 400;
      st.r++;
      if (st.r >= TG.length) st.done = true;
      paint();
      fb.textContent = L({ es: 'Con ' + mm + ' g en 400 cm³ la densidad es ' + num(tg) + ' g/cm³, que es justo lo pedido: la parte sumergida repite la densidad del cubo comparada con la del agua.',
                           en: 'With ' + mm + ' g in 400 cm³ the density is ' + num(tg) + ' g/cm³, exactly what was asked: the submerged part repeats the cube density compared with that of water.' });
      return;
    }
    fb.textContent = (d > tg)
      ? L({ es: 'Se hunde más de lo pedido. Quítale masa o dale más volumen.', en: 'It sits deeper than asked. Take mass away or give it more volume.' })
      : L({ es: 'Se queda más alto de lo pedido. Súbele masa o quítale volumen.', en: 'It sits higher than asked. Add mass or take volume away.' });
  };
  paint();
  setTimeout(draw, 200);
  setTimeout(draw, 800);
}

/* ══ MANIPULATIVO 2 · DINAMÓMETRO Y PROBETA ════════════════════════════════
   Un deslizador hunde el bloque; el nivel del agua sube, el empuje crece y la
   marca del dinamómetro baja en vivo. Tres rondas con lecturas objetivo.
   ═══════════════════════════════════════════════════════════════════════════ */
function wBuoy(rng){
  var host = iw('buoyancy', 'wBuo');
  var VOL = pick([4, 5, 6], rng);
  var WGT = VOL * 10 + pick([20, 30, 40], rng);
  var PC = shuffle([20, 40, 50, 60, 80, 100], rng).slice(0, 3);
  var st = { r: 0, p: 0, tries: 0, done: false };
  function subVol(){ return VOL * st.p / 100; }
  function push(){ return subVol() * 10; }
  function read(){ return WGT - push(); }
  function target(){ return WGT - VOL * PC[Math.min(st.r, PC.length - 1)] / 10; }

  host.innerHTML =
    '<div class="iw-tag">' + L({ es: 'Dinamómetro y probeta', en: 'Spring scale and jar' }) + '</div>' +
    '<div class="iw-task" id="wBuoTask"></div>' +
    '<div class="iw-cv"><canvas id="wBuoCv"></canvas></div>' +
    '<div class="ctrl"><label>' + L({ es: 'Parte del bloque metida en el agua', en: 'Part of the block put into the water' }) + ': <b id="wBuoPL"></b>%</label>' +
      '<input type="range" id="wBuoP" min="0" max="100" step="5" value="0" oninput="wBuoIn()"></div>' +
    '<div class="readout">' +
      '<div class="ro"><div class="ro-l">' + L({ es: 'Agua desalojada', en: 'Water displaced' }) + '</div><div class="ro-v" id="wBuoV"></div></div>' +
      '<div class="ro"><div class="ro-l">' + L({ es: 'Empuje', en: 'Push' }) + '</div><div class="ro-v" id="wBuoE"></div></div>' +
      '<div class="ro"><div class="ro-l">' + L({ es: 'Dinamómetro', en: 'Scale' }) + '</div><div class="ro-v" id="wBuoR"></div></div>' +
    '</div>' +
    '<button class="rverify-btn" onclick="wBuoCheck()">' + L({ es: 'Comprobar', en: 'Check' }) + '</button>' +
    '<div class="rfb" id="wBuoFb"></div>';

  function draw(){
    var cv = document.getElementById('wBuoCv');
    if (!cv) return;
    var rect = cv.getBoundingClientRect();
    var dpr = window.devicePixelRatio || 1;
    var W = Math.round(rect.width || 320), H = 200;
    cv.width = W * dpr; cv.height = H * dpr;
    var c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, W, H);
    var jx = W * 0.42, jw = Math.min(W * 0.5, 190), jy = 46, jh = H - 62;
    var base = jy + jh, wl = base - jh * (0.42 + 0.32 * st.p / 100);
    c.fillStyle = CV('--wtr'); c.fillRect(jx, wl, jw, base - wl);
    c.strokeStyle = CV('--border'); c.lineWidth = 2; c.strokeRect(jx, jy, jw, jh);
    var side = 46, bx = jx + jw / 2 - side / 2;
    var btop = wl - side * (1 - st.p / 100);
    c.strokeStyle = CV('--text3'); c.lineWidth = 1.5;
    c.beginPath(); c.moveTo(bx + side / 2, 30); c.lineTo(bx + side / 2, btop); c.stroke();
    c.fillStyle = CV('--obj'); c.fillRect(bx, btop, side, side);
    c.strokeStyle = CV('--obj2'); c.lineWidth = 2; c.strokeRect(bx, btop, side, side);
    c.fillStyle = CV('--green'); c.fillRect(10, 14, 96, 34);
    c.fillStyle = CV('--surface');
    c.font = 'bold 15px IBM Plex Mono, monospace';
    c.fillText(num(read()) + ' N', 22, 36);
    c.fillStyle = CV('--text2');
    c.font = '11px IBM Plex Sans, sans-serif';
    c.fillText(L({ es: 'peso en el aire: ' + WGT + ' N', en: 'weight in air: ' + WGT + ' N' }), 10, 62);
    c.fillText(L({ es: 'bloque de ' + VOL + ' litros', en: 'block of ' + VOL + ' litres' }), 10, 78);
  }
  function paint(){
    document.getElementById('wBuoPL').textContent = st.p;
    document.getElementById('wBuoV').textContent = num(subVol()) + ' L';
    document.getElementById('wBuoE').textContent = num(push()) + ' N';
    document.getElementById('wBuoR').textContent = num(read()) + ' N';
    document.getElementById('wBuoTask').textContent = st.done
      ? L({ es: 'Aparato libre: hunde el bloque cuanto quieras y compara el empuje con la marca del dinamómetro.', en: 'Free device: sink the block as much as you like and compare the push with the scale reading.' })
      : L({ es: 'Ronda ' + (st.r + 1) + ' de 3: hunde el bloque hasta que el dinamómetro marque ' + num(target()) + ' N.',
            en: 'Round ' + (st.r + 1) + ' of 3: sink the block until the scale reads ' + num(target()) + ' N.' });
    draw();
  }
  window.wBuoIn = function(){
    st.p = parseInt(document.getElementById('wBuoP').value, 10);
    paint();
  };
  window.wBuoCheck = function(){
    var fb = document.getElementById('wBuoFb');
    if (st.done) { fb.textContent = L({ es: 'Marca actual: ' + num(read()) + ' N con ' + num(push()) + ' N de empuje.', en: 'Current reading: ' + num(read()) + ' N with a push of ' + num(push()) + ' N.' }); return; }
    var tg = target();
    if (Math.abs(read() - tg) < 0.6) {
      st.r++; st.tries = 0;
      if (st.r >= PC.length) st.done = true;
      paint();
      fb.innerHTML = '<span class="okfb">🎉 ' + (st.done
        ? L({ es: '¡Tres lecturas clavadas! El agua desalojada manda sobre la marca.', en: 'Three readings nailed! The displaced water rules the reading.' })
        : L({ es: '¡Esa es la marca! Cada litro que entra al agua resta 10 N. Va otra ronda.', en: 'That is the reading! Each litre going into the water takes 10 N off. Here comes another round.' })) + '</span>';
      return;
    }
    st.tries++;
    if (st.tries >= 3) {
      var need = Math.round((WGT - tg) / 10 / VOL * 100);
      st.p = need; st.tries = 0;
      document.getElementById('wBuoP').value = need;
      st.r++;
      if (st.r >= PC.length) st.done = true;
      paint();
      fb.textContent = L({ es: 'Con el ' + need + '% del bloque dentro, el agua desalojada aporta ' + num(WGT - tg) + ' N de empuje y la marca baja de ' + WGT + ' N a ' + num(tg) + ' N.',
                           en: 'With ' + need + '% of the block inside, the displaced water gives ' + num(WGT - tg) + ' N of push and the reading drops from ' + WGT + ' N to ' + num(tg) + ' N.' });
      return;
    }
    fb.textContent = (read() > tg)
      ? L({ es: 'La marca está alta: falta empuje, hunde más el bloque.', en: 'The reading is high: not enough push, sink the block deeper.' })
      : L({ es: 'La marca está baja: sobra empuje, saca un poco el bloque.', en: 'The reading is low: too much push, lift the block a little.' });
  };
  paint();
  setTimeout(draw, 200);
  setTimeout(draw, 800);
}

/* ══ MANIPULATIVO 3 · ¿FLOTA O SE HUNDE? ═══════════════════════════════════
   Objeto y líquido con sus densidades; el estudiante decide. Cada error
   devuelve una pista que compara las dos densidades; al tercer intento se
   revela y avanza al siguiente caso.
   ═══════════════════════════════════════════════════════════════════════════ */
function wSort(rng){
  var host = iw('classify', 'wSort');
  var BINS = [L({ es: 'Flota', en: 'It floats' }), L({ es: 'Se hunde', en: 'It sinks' })];
  var ITEMS = [
    { es: 'Cubo de hielo (0.92 g/cm³) en agua (1 g/cm³)', en: 'Ice cube (0.92 g/cm³) in water (1 g/cm³)', bin: 0 },
    { es: 'Canica de vidrio (2.5 g/cm³) en agua (1 g/cm³)', en: 'Glass marble (2.5 g/cm³) in water (1 g/cm³)', bin: 1 },
    { es: 'Tapón de corcho (0.24 g/cm³) en aceite (0.92 g/cm³)', en: 'Cork stopper (0.24 g/cm³) in oil (0.92 g/cm³)', bin: 0 },
    { es: 'Huevo fresco (1.03 g/cm³) en agua (1 g/cm³)', en: 'Fresh egg (1.03 g/cm³) in water (1 g/cm³)', bin: 1 },
    { es: 'Huevo fresco (1.03 g/cm³) en agua muy salada (1.15 g/cm³)', en: 'Fresh egg (1.03 g/cm³) in very salty water (1.15 g/cm³)', bin: 0 },
    { es: 'Tornillo de acero (7.8 g/cm³) en glicerina (1.26 g/cm³)', en: 'Steel screw (7.8 g/cm³) in glycerine (1.26 g/cm³)', bin: 1 },
    { es: 'Vela de parafina (0.9 g/cm³) en glicerina (1.26 g/cm³)', en: 'Paraffin candle (0.9 g/cm³) in glycerine (1.26 g/cm³)', bin: 0 }
  ];
  var seq = shuffle([0, 1, 2, 3, 4, 5, 6], rng).slice(0, 6);
  var st = { i: 0, tries: 0, hits: 0, done: false };

  function render(){
    if (st.done) {
      host.innerHTML = '<div class="iw-tag">' + L({ es: '¿Flota o se hunde?', en: 'Floats or sinks?' }) + '</div>' +
        '<div class="cls-done">🎉 ' + L({ es: 'Terminaste los seis casos con ' + st.hits + ' aciertos directos.', en: 'You finished the six cases with ' + st.hits + ' straight hits.' }) + '</div>';
      return;
    }
    var it = ITEMS[seq[st.i]];
    host.innerHTML =
      '<div class="iw-tag">' + L({ es: '¿Flota o se hunde?', en: 'Floats or sinks?' }) + '</div>' +
      '<div class="iw-task">' + L({ es: 'Caso ' + (st.i + 1) + ' de 6: compara las dos densidades y decide.', en: 'Case ' + (st.i + 1) + ' of 6: compare the two densities and decide.' }) + '</div>' +
      '<div class="cls-card">' + it[LANG] + '</div>' +
      '<div class="cls-bins">' +
        '<button class="cls-bin" onclick="wSortPick(0)">' + BINS[0] + '</button>' +
        '<button class="cls-bin" onclick="wSortPick(1)">' + BINS[1] + '</button>' +
      '</div>' +
      '<div class="rfb" id="wSortFb"></div>';
  }
  window.wSortPick = function(b){
    var it = ITEMS[seq[st.i]];
    if (b === it.bin) {
      if (st.tries === 0) st.hits++;
      st.tries = 0; st.i++;
      if (st.i >= 6) st.done = true;
      render();
      if (!st.done) document.getElementById('wSortFb').innerHTML = '<span class="okfb">✓ ' + L({ es: 'Correcto, sigue el siguiente caso.', en: 'Right, on to the next case.' }) + '</span>';
      return;
    }
    st.tries++;
    var fb = document.getElementById('wSortFb');
    if (st.tries >= 3) {
      fb.innerHTML = L({ es: 'Era <b>' + BINS[it.bin] + '</b>. ', en: 'It was <b>' + BINS[it.bin] + '</b>. ' }) +
        L({ es: 'El objeto se queda arriba solo cuando su densidad es menor que la del líquido.', en: 'The object stays up only when its density is below that of the liquid.' });
      st.tries = 0; st.i++;
      if (st.i >= 6) st.done = true;
      setTimeout(render, 1600);
      return;
    }
    fb.textContent = L({ es: 'Todavía no. Lee otra vez los dos números: ¿cuál densidad es mayor, la del objeto o la del líquido?',
                         en: 'Not yet. Read the two numbers again: which density is bigger, the object or the liquid?' });
  };
  render();
}

/* ══ MANIPULATIVO 4 · CARGA LA BARCAZA ═════════════════════════════════════
   El deslizador de carga hunde el casco en vivo; el porcentaje sumergido y el
   agua desalojada se actualizan y la barcaza se hunde al pasar del límite.
   Tres rondas con líneas de flotación objetivo.
   ═══════════════════════════════════════════════════════════════════════════ */
function wCargo(rng){
  var host = iw('cargo', 'wCar');
  var EMPTY = pick([400, 600, 800], rng);
  var CAP = pick([2000, 2400, 3000], rng);
  var TG = shuffle([60, 75, 90], rng);
  var st = { r: 0, c: 0, tries: 0, done: false };
  function total(){ return EMPTY + st.c; }
  function pctSub(){ return total() / CAP * 100; }
  function goal(){ return CAP * TG[Math.min(st.r, TG.length - 1)] / 100 - EMPTY; }

  host.innerHTML =
    '<div class="iw-tag">' + L({ es: 'Carga la barcaza', en: 'Load the barge' }) + '</div>' +
    '<div class="iw-task" id="wCarTask"></div>' +
    '<div class="iw-cv"><canvas id="wCarCv"></canvas></div>' +
    '<div class="ctrl"><label>' + L({ es: 'Carga a bordo', en: 'Load on board' }) + ': <b id="wCarCL"></b> kg</label>' +
      '<input type="range" id="wCarC" min="0" max="' + CAP + '" step="20" value="0" oninput="wCarIn()"></div>' +
    '<div class="readout">' +
      '<div class="ro"><div class="ro-l">' + L({ es: 'Masa total', en: 'Total mass' }) + '</div><div class="ro-v" id="wCarT"></div></div>' +
      '<div class="ro"><div class="ro-l">' + L({ es: 'Agua desalojada', en: 'Water displaced' }) + '</div><div class="ro-v" id="wCarW"></div></div>' +
      '<div class="ro"><div class="ro-l">' + L({ es: 'Casco sumergido', en: 'Hull under water' }) + '</div><div class="ro-v" id="wCarP"></div></div>' +
    '</div>' +
    '<button class="rverify-btn" onclick="wCarCheck()">' + L({ es: 'Comprobar', en: 'Check' }) + '</button>' +
    '<div class="rfb" id="wCarFb"></div>';

  function draw(){
    var cv = document.getElementById('wCarCv');
    if (!cv) return;
    var rect = cv.getBoundingClientRect();
    var dpr = window.devicePixelRatio || 1;
    var W = Math.round(rect.width || 320), H = 180;
    cv.width = W * dpr; cv.height = H * dpr;
    var c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, W, H);
    var wl = 78, hullW = Math.min(W * 0.62, 220), hullH = 62;
    var p = Math.min(pctSub(), 120) / 100;
    var hx = W / 2 - hullW / 2, hy = wl - hullH * (1 - p);
    c.fillStyle = CV('--obj2');
    c.beginPath();
    c.moveTo(hx, hy); c.lineTo(hx + hullW, hy);
    c.lineTo(hx + hullW - 18, hy + hullH); c.lineTo(hx + 18, hy + hullH);
    c.closePath(); c.fill();
    c.fillStyle = CV('--wtr');
    c.globalAlpha = 0.72;
    c.fillRect(0, wl, W, H - wl);
    c.globalAlpha = 1;
    c.strokeStyle = CV('--wtr2'); c.lineWidth = 2;
    c.beginPath(); c.moveTo(0, wl); c.lineTo(W, wl); c.stroke();
    c.fillStyle = CV('--text2');
    c.font = '12px IBM Plex Sans, sans-serif';
    c.fillText(L({ es: 'casco vacío: ' + EMPTY + ' kg', en: 'empty hull: ' + EMPTY + ' kg' }), 10, 18);
    c.fillText(L({ es: 'desaloja como máximo ' + CAP + ' litros', en: 'displaces at most ' + CAP + ' litres' }), 10, 34);
    if (pctSub() > 100) {
      c.fillStyle = CV('--bad');
      c.font = 'bold 13px IBM Plex Sans, sans-serif';
      c.fillText(L({ es: 'el agua entra por la borda', en: 'water comes over the side' }), 10, H - 10);
    }
  }
  function paint(){
    document.getElementById('wCarCL').textContent = st.c;
    document.getElementById('wCarT').textContent = total() + ' kg';
    document.getElementById('wCarW').textContent = Math.min(total(), CAP) + ' L';
    document.getElementById('wCarP').textContent = Math.round(pctSub()) + '%';
    document.getElementById('wCarTask').textContent = st.done
      ? L({ es: 'Barcaza libre: sube y baja carga y observa la línea de flotación.', en: 'Free barge: add and remove load and watch the waterline.' })
      : L({ es: 'Ronda ' + (st.r + 1) + ' de 3: deja el casco sumergido justo al ' + TG[Math.min(st.r, TG.length - 1)] + '%.',
            en: 'Round ' + (st.r + 1) + ' of 3: leave the hull submerged at exactly ' + TG[Math.min(st.r, TG.length - 1)] + '%.' });
    draw();
  }
  window.wCarIn = function(){
    st.c = parseInt(document.getElementById('wCarC').value, 10);
    paint();
  };
  window.wCarCheck = function(){
    var fb = document.getElementById('wCarFb');
    if (st.done) { fb.textContent = L({ es: 'Con ' + st.c + ' kg de carga el casco va al ' + Math.round(pctSub()) + '%.', en: 'With ' + st.c + ' kg of load the hull sits at ' + Math.round(pctSub()) + '%.' }); return; }
    var g = goal();
    if (Math.abs(st.c - g) <= 30) {
      st.r++; st.tries = 0;
      if (st.r >= TG.length) st.done = true;
      paint();
      fb.innerHTML = '<span class="okfb">🎉 ' + (st.done
        ? L({ es: '¡Tres líneas de flotación clavadas! El agua desalojada siempre iguala a la masa total.', en: 'Three waterlines nailed! The displaced water always matches the total mass.' })
        : L({ es: '¡Justo ahí! La barcaza desaloja el agua que necesita para sostener ese peso. Va otra ronda.', en: 'Right there! The barge displaces the water it needs to hold that weight. Here comes another round.' })) + '</span>';
      return;
    }
    st.tries++;
    if (st.tries >= 3) {
      st.c = Math.round(g / 20) * 20;
      document.getElementById('wCarC').value = st.c;
      st.tries = 0; st.r++;
      if (st.r >= TG.length) st.done = true;
      paint();
      fb.textContent = L({ es: 'Con esa carga la masa total llega a ' + total() + ' kg, y para sostenerla el casco desaloja ' + total() + ' litros de agua, la fracción pedida de su capacidad.',
                           en: 'With that load the total mass reaches ' + total() + ' kg, and to hold it the hull displaces ' + total() + ' litres of water, the asked fraction of its capacity.' });
      return;
    }
    fb.textContent = (st.c > g)
      ? L({ es: 'Se hundió de más: la masa total pide más agua desalojada de la pedida. Baja carga.', en: 'It went too deep: the total mass asks for more displaced water than needed. Take load off.' })
      : L({ es: 'Va muy alta: el casco desaloja menos agua de la pedida. Sube más carga.', en: 'It sits too high: the hull displaces less water than needed. Add more load.' });
  };
  paint();
  setTimeout(draw, 200);
  setTimeout(draw, 800);
}

</script>

(function(){

    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
