<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Microscopía y Manipulación Genética</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Microscopía y Manipulación Genética</div>
    <div class="wcourse" id="wcourse-el">Biología · 1° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Microscopía y Manipulación Genética</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="sbtn" id="dlBtn" onclick="generatePDF()" style="max-width:280px;margin:0 auto;">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   CENTRALIZED SCHOOL CONFIG (Rule 16) — ships UNBRANDED (Rule 11).
   The ONLY rebranding point. build_all.py substitutes these exact fields
   (BRAND_FIELDS / RGB_FIELDS / logo*) downstream; :root/dark stay as fallback.
   Neutral defaults below == the static :root/dark values, so unbranded == no-op.
   ══════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:'#0c0c84', primaryDark:'#05054e', primaryBg:'#e5e5f7',
  accent:'#0c840c', accentBg:'#defcde',
  darkPrimary:'#3535d4', darkPrimaryDark:'#6767f3', darkPrimaryBg:'#06063f',

    var res = document.getElementById('s_results'); res.style.display='none'; res.classList.remove('vis');
    buildLesson(seededRng(studentData.name + studentData.group + currentAttempt(studentData.name, studentData.group)));
    var obs = new IntersectionObserver(function(entries){ entries.forEach(function(e){ if(e.isIntersecting) e.target.classList.add('vis'); }); }, { threshold:0.05 });
    document.querySelectorAll('.section').forEach(function(s){ obs.observe(s); });
    prev.forEach(function(ch, idx){ if(ch!==null && ch!==undefined) confirmMC(idx, ch); });
    if (answeredCount === problems.length && problems.length > 0) {
      res.style.display='block'; setTimeout(function(){ res.classList.add('vis'); }, 50);
    }

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);

  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');

}

  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  //   Match these RGB values to --green and --gold above.

    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/\u2192/g,'->').replace(/\u2212/g,'-').replace(/\u00b2/g,'^2')
      .replace(/\u00b3/g,'^3').replace(/\u00d7/g,'x').replace(/\u00f7/g,'/')
      .replace(/\u2260/g,'!=').replace(/\u2264/g,'<=').replace(/\u2265/g,'>=')
      .replace(/\u221a/g,'sqrt').replace(/\u03c0/g,'pi').replace(/\u2026/g,'...')
      .replace(/\s+/g,' ').trim();
  }

  // ── PORTADA: orange line / white logo strip / orange line / blue band ──
  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,2,'F');   // top accent line
  doc.setFillColor(255,255,255); doc.rect(0,2,PW,26,'F');                               // white logo strip

  doc.lines([[2.57-1.03,4.63-6.17],[4.11-2.57,5.14-4.63],[5.66-4.11,2.57-5.14]], lx+1.03, ly+6.17);

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 1 :: la ruta de la observacion
   Seis momentos de la historia del microscopio, revueltos por la semilla. El
   alumno toca dos tarjetas para intercambiarlas y la numeracion se reacomoda
   al instante. Al verificar recibe una pista direccional sobre la primera
   tarjeta fuera de lugar; al tercer intento se acomoda sola y se explica el
   hilo que une un instrumento con la observacion siguiente.
   ══════════════════════════════════════════════════════════════════════════ */
function wRuta(rng, host){
  var EV = [
    { es:'Se pulen las primeras lentes y se arma un microscopio sencillo',
      en:'The first lenses are polished and a simple microscope is put together' },
    { es:'Se mira una laminilla de corcho y se dibujan celdillas vacías',
      en:'A slice of cork is looked at and empty little cells are drawn' },
    { es:'En una gota de agua estancada se ven seres vivos de una sola célula',
      en:'In a drop of stagnant water living things made of a single cell are seen' },
    { es:'Se propone que todo ser vivo está formado por células',
      en:'It is proposed that every living thing is made of cells' },
    { es:'Un haz de electrones muestra el interior de la célula',
      en:'A beam of electrons shows the inside of the cell' },
    { es:'Se obtienen las primeras imágenes de un virus',
      en:'The first images of a virus are obtained' }
  ];
  var ord = shuffle(EV.map(function(_, i){ return i; }), rng);
  if (ord.every(function(v, i){ return v === i; })) { var sw = ord[0]; ord[0] = ord[1]; ord[1] = sw; }
  var sel = null, tries = 0, done = false;

  host.innerHTML =
    '<div class="gw-h iw-tag">' + L({ es:'Ordena la ruta de la observación', en:'Order the observation route' }) + '</div>' +
    '<div class="gw-mini iw-sub">' + L({
      es:'Toca dos tarjetas para intercambiarlas y deja los sucesos del más antiguo al más reciente. Puedes moverlas cuantas veces quieras y verificar cuando quieras.',
      en:'Tap two cards to swap them and leave the events running from the oldest to the most recent. You can move them as often as you like and check whenever you like.'
    }) + '</div>' +
    '<div class="tlrow" data-r="list"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="go">' + L({ es:'Verificar el orden', en:'Check the order' }) + '</button></div>' +
    '<div class="gw-fb"></div>';

  var list = host.querySelector('[data-r="list"]');
  var go = host.querySelector('[data-r="go"]');

  function render(){
    list.innerHTML = ord.map(function(ei, pos){
      return '<div class="tlchip' + (sel === pos ? ' sel' : '') + (done ? ' lock' : '') + '" data-p="' + pos + '">' +
        '<span class="tlnum">' + (pos + 1) + '</span>' + L(EV[ei]) + '</div>';
    }).join('');
    Array.prototype.forEach.call(list.querySelectorAll('.tlchip'), function(c){
      c.addEventListener('click', function(){ tap(parseInt(c.getAttribute('data-p'), 10)); });
    });
  }

  function tap(p){
    if (done) return;
    if (sel === null) sel = p;
    else if (sel === p) sel = null;
    else { var tmp = ord[sel]; ord[sel] = ord[p]; ord[p] = tmp; sel = null; }
    render();
  }

  go.addEventListener('click', function(){
    if (done) return;
    var bad = -1;
    for (var i = 0; i < ord.length; i++){ if (ord[i] !== i){ bad = i; break; } }
    if (bad === -1){
      done = true; render();
      say(host, 'good', L({
        es:'Orden correcto. Cada instrumento hizo posible la observación siguiente: sin la lente no hay celdillas, sin lentes mejores no hay seres de una sola célula y sin electrones no hay virus a la vista.',
        en:'Correct order. Each instrument made the next observation possible: with no lens there are no little cells, with no better lenses there are no single celled beings and with no electrons there is no virus in sight.'
      }));
      return;
    }
    tries++;
    if (tries >= 3){
      ord = EV.map(function(_, i){ return i; });
      done = true; sel = null; render();
      say(host, 'warm', L({
        es:'Este es el orden. Fíjate en el hilo: primero aparece el instrumento y después la observación que ese instrumento vuelve posible. Los virus cierran la ruta porque necesitaron el mayor alcance de todos.',
        en:'This is the order. Look at the thread: first the instrument appears and then the observation that instrument makes possible. Viruses close the route because they needed the greatest reach of all.'
      }));
      return;
    }
    var later = ord[bad] > bad;
    say(host, 'miss', L({
      es:'Todavía no. La tarjeta que ocupa el lugar ' + (bad + 1) + ' sucedió ' + (later ? 'después' : 'antes') + ' de lo que corresponde ahí: muévela hacia ' + (later ? 'abajo' : 'arriba') + '.',
      en:'Not yet. The card sitting in place ' + (bad + 1) + ' happened ' + (later ? 'later' : 'earlier') + ' than what belongs there: move it ' + (later ? 'down' : 'up') + '.'
    }));
  });

  render();
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 2 :: la regla de los tamanos
   Cinco muestras y tres instrumentos. El alumno decide con que se alcanza a
   ver cada una y la marca de la regla se desliza al instante hasta la zona
   que eligio. Si falla, la retroalimentacion dice hacia donde moverse; al
   acertar la marca salta al tamano real y aparece la medida. Tres intentos
   por muestra antes de revelarla.
   ══════════════════════════════════════════════════════════════════════════ */
function wEscala(rng, host){
  var BINS = [
    { es:'Ojo sin ayuda', en:'Unaided eye', c:86 },
    { es:'Microscopio de luz', en:'Light microscope', c:52 },
    { es:'Microscopio electrónico', en:'Electron microscope', c:16 }
  ];
  var POOL = [
    [ { es:'Un grano de sal de mesa', en:'A grain of table salt', mm:'0.3 mm', pos:82 },
      { es:'La cabeza de un alfiler', en:'The head of a pin', mm:'1 mm', pos:94 } ],
    [ { es:'Una célula de la piel de una cebolla', en:'A cell from an onion skin', mm:'0.05 mm', pos:68 },
      { es:'Un glóbulo rojo de una gota de sangre', en:'A red blood cell from a drop of blood', mm:'0.007 mm', pos:54 },
      { es:'Una bacteria del yogur', en:'A bacterium from yoghurt', mm:'0.002 mm', pos:40 } ],
    [ { es:'Un virus de la gripe', en:'A flu virus', mm:'0.0001 mm', pos:20 },
      { es:'El detalle del interior de una célula', en:'The detail of the inside of a cell', mm:'0.00005 mm', pos:9 } ]
  ];
  var b0 = shuffle(POOL[0], rng), b1 = shuffle(POOL[1], rng), b2 = shuffle(POOL[2], rng);
  var items = shuffle([
    { d:b0[0], bin:0 },
    { d:b1[0], bin:1 }, { d:b1[1], bin:1 },
    { d:b2[0], bin:2 }, { d:b2[1], bin:2 }
  ], rng);

  var i = 0, tries = 0, hits = 0, done = false;

  host.innerHTML =
    '<div class="gw-h iw-tag">' + L({ es:'La regla de los tamaños', en:'The ruler of sizes' }) + '</div>' +
    '<div class="gw-mini iw-sub">' + L({
      es:'Decide con qué se alcanza a ver cada muestra. La marca de la regla se mueve a la zona que elijas, así que puedes probar y ver de inmediato si te acerca o te aleja.',
      en:'Decide what each sample can be seen with. The mark on the ruler moves to the zone you choose, so you can try and see at once whether it brings you closer or takes you further.'
    }) + '</div>' +
    '<div class="gw-prog" data-r="prog"></div>' +
    '<div class="escard" data-r="card"></div>' +
    '<div class="esbar">' +
      '<div class="eszone" style="left:0%;width:32%">' + L({ es:'Más pequeño', en:'Smaller' }) + '</div>' +
      '<div class="eszone mid" style="left:32%;width:40%">' + L({ es:'Intermedio', en:'In between' }) + '</div>' +
      '<div class="eszone" style="left:72%;width:28%">' + L({ es:'Más grande', en:'Larger' }) + '</div>' +
      '<div class="esmark" data-r="mark" style="left:50%"></div>' +
    '</div>' +
    '<div class="essize" data-r="size"></div>' +
    '<div class="gw-tag">' + L({ es:'Con qué se alcanza a ver', en:'What it can be seen with' }) + '</div>' +
    '<div class="gw-row" data-r="bins"></div>' +
    '<div class="gw-fb"></div>';

  var elProg = host.querySelector('[data-r="prog"]');
  var elCard = host.querySelector('[data-r="card"]');
  var elMark = host.querySelector('[data-r="mark"]');
  var elSize = host.querySelector('[data-r="size"]');
  var elBins = host.querySelector('[data-r="bins"]');

  function render(){
    if (done){
      elProg.textContent = '';
      elCard.textContent = L({ es:'Regla completa', en:'Ruler complete' });
      elBins.innerHTML = '';
      return;
    }
    elProg.textContent = L({ es:'Muestra ', en:'Sample ' }) + (i + 1) + ' / ' + items.length;
    elCard.textContent = L(items[i].d);
    elSize.textContent = '';
    elBins.innerHTML = BINS.map(function(b, bi){
      return '<button class="gw-btn" data-b="' + bi + '">' + L(b) + '</button>';
    }).join('');
    Array.prototype.forEach.call(elBins.querySelectorAll('.gw-btn'), function(btn){
      btn.addEventListener('click', function(){ choose(parseInt(btn.getAttribute('data-b'), 10)); });
    });
  }

  function advance(){
    i++; tries = 0;
    if (i >= items.length){
      done = true; render();
      say(host, 'good', L({
        es:'Terminaste la regla con ' + hits + ' de ' + items.length + ' a la primera. Lo que decide el instrumento no es el gusto de quien observa: es el tamaño de la muestra.',
        en:'You finished the ruler with ' + hits + ' out of ' + items.length + ' on the first try. What decides the instrument is not the taste of whoever observes: it is the size of the sample.'
      }));
    } else render();
  }

  function choose(bi){
    if (done) return;
    var it = items[i];
    elMark.style.left = BINS[bi].c + '%';
    if (bi === it.bin){
      if (tries === 0) hits++;
      elMark.style.left = it.d.pos + '%';
      elSize.textContent = it.d.mm;
      say(host, 'good', L({
        es:'Correcto. Mide alrededor de ' + it.d.mm + ', justo dentro del alcance de ese instrumento.',
        en:'Correct. It measures around ' + it.d.mm + ', right within the reach of that instrument.'
      }));
      setTimeout(advance, 1100);
      return;
    }
    tries++;
    if (tries >= 3){
      elMark.style.left = it.d.pos + '%';
      elSize.textContent = it.d.mm;
      say(host, 'warm', L({
        es:'Mide alrededor de ' + it.d.mm + ', así que se alcanza con esto: ' + L(BINS[it.bin]) + '.',
        en:'It measures around ' + it.d.mm + ', so it is reached with this: ' + L(BINS[it.bin]) + '.'
      }));
      setTimeout(advance, 1600);
      return;
    }
    var necesitaMas = bi < it.bin;
    say(host, 'miss', L({
      es:'Todavía no. Esta muestra es ' + (necesitaMas ? 'más pequeña de lo que ese instrumento alcanza: prueba con uno de mayor alcance.' : 'más grande de lo que hace falta: con un instrumento de menor alcance ya se ve.'),
      en:'Not yet. This sample is ' + (necesitaMas ? 'smaller than what that instrument reaches: try one with greater reach.' : 'larger than needed: an instrument with less reach already shows it.')
    }));
  }

  render();
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 3 :: quien hace el trabajo
   Un dibujo de celula con tres zonas. Aparece una tarea y el alumno toca la
   parte que la realiza; el dibujo enciende esa parte en el momento. Las
   pistas apuntan al lugar de la celula donde ocurre la tarea, no a la
   respuesta. Al tercer intento se enciende la parte correcta con su razon.
   ══════════════════════════════════════════════════════════════════════════ */
function wPartes(rng, host){
  var PARTS = [
    { es:'Membrana', en:'Membrane', k:'mem' },
    { es:'Citoplasma', en:'Cytoplasm', k:'cyt' },
    { es:'Núcleo', en:'Nucleus', k:'nuc' }
  ];
  var JOBS = [
    [ { es:'Deja entrar el oxígeno y el alimento disuelto y saca los desechos',
        en:'Lets in oxygen and dissolved food and takes waste out' },
      { es:'Es lo primero que recibe una señal del medio, como un cambio de temperatura',
        en:'It is the first to receive a signal from the medium, such as a change in temperature' } ],
    [ { es:'Ahí se transforma el alimento y se libera la energía que la célula usa',
        en:'There the food is transformed and the energy the cell uses is released' },
      { es:'Reparte las sustancias de un extremo a otro del interior',
        en:'Spreads substances from one end of the inside to the other' } ],
    [ { es:'Guarda los cromosomas, donde están las instrucciones de la célula',
        en:'Keeps the chromosomes, where the instructions of the cell are' },
      { es:'Copia las instrucciones y las reparte cuando se forman dos células nuevas',
        en:'Copies the instructions and shares them out when two new cells are formed' } ]
  ];
  var NUDGE = [
    { es:'Eso ocurre en el límite de la célula, donde toca lo que la rodea.',
      en:'That happens at the boundary of the cell, where it touches what surrounds it.' },
    { es:'Eso ocurre en el material espeso que llena todo el interior.',
      en:'That happens in the thick material that fills the whole inside.' },
    { es:'Eso ocurre en el cuerpo redondeado del centro, el que guarda lo que se hereda.',
      en:'That happens in the rounded body at the centre, the one that keeps what is inherited.' }
  ];
  var picks = JOBS.map(function(g, gi){
    var k = Math.floor(rng() * g.length);
    return { j:g[k], p:gi, k:k };
  });
  var extraG = Math.floor(rng() * JOBS.length);
  var rounds = shuffle(picks.concat([
    { j: JOBS[extraG][1 - picks[extraG].k], p: extraG }
  ]), rng);

  var i = 0, tries = 0, hits = 0, done = false;

  host.innerHTML =
    '<div class="gw-h iw-tag">' + L({ es:'Quién hace el trabajo', en:'Who does the work' }) + '</div>' +
    '<div class="gw-mini iw-sub">' + L({
      es:'Toca la parte de la célula que realiza la tarea que aparece. El dibujo enciende la parte que elijas, así que puedes probar y ver hacia dónde estás apuntando.',
      en:'Tap the part of the cell that carries out the task shown. The drawing lights up the part you choose, so you can try and see where you are pointing.'
    }) + '</div>' +
    '<div class="gw-prog" data-r="prog"></div>' +
    '<div class="cellfig" data-r="fig"><div class="cellnuc"></div></div>' +
    '<div class="jobcard" data-r="job"></div>' +
    '<div class="gw-row" data-r="parts"></div>' +
    '<div class="gw-fb"></div>';

  var elProg = host.querySelector('[data-r="prog"]');
  var elFig = host.querySelector('[data-r="fig"]');
  var elJob = host.querySelector('[data-r="job"]');
  var elParts = host.querySelector('[data-r="parts"]');

  function light(k){ elFig.className = 'cellfig' + (k ? ' ' + k : ''); }

  function render(){
    if (done){
      elProg.textContent = '';
      elJob.textContent = L({ es:'Célula completa', en:'Cell complete' });
      elParts.innerHTML = '';
      light('');
      return;
    }
    elProg.textContent = L({ es:'Tarea ', en:'Task ' }) + (i + 1) + ' / ' + rounds.length;
    elJob.textContent = L(rounds[i].j);
    light('');
    elParts.innerHTML = PARTS.map(function(p, pi){
      return '<button class="gw-btn" data-p="' + pi + '">' + L(p) + '</button>';
    }).join('');
    Array.prototype.forEach.call(elParts.querySelectorAll('.gw-btn'), function(btn){
      btn.addEventListener('click', function(){ choose(parseInt(btn.getAttribute('data-p'), 10)); });
    });
  }

  function advance(){
    i++; tries = 0;
    if (i >= rounds.length){
      done = true; render();
      say(host, 'good', L({
        es:'Cerraste la célula con ' + hits + ' de ' + rounds.length + ' a la primera. Tres partes, tres trabajos distintos, y entre las tres sostienen la vida de una sola célula.',
        en:'You closed the cell with ' + hits + ' out of ' + rounds.length + ' on the first try. Three parts, three different jobs, and between the three they hold up the life of a single cell.'
      }));
    } else render();
  }

  function choose(pi){
    if (done) return;
    var r = rounds[i];
    light(PARTS[pi].k);
    if (pi === r.p){
      if (tries === 0) hits++;
      say(host, 'good', L({ es:'Así es. Esa parte es la responsable de esa tarea.', en:'That is right. That part is responsible for that task.' }));
      setTimeout(advance, 1000);
      return;
    }
    tries++;
    if (tries >= 3){
      light(PARTS[r.p].k);
      say(host, 'warm', L({
        es:'La tarea corresponde a esta parte: ' + L(PARTS[r.p]) + '. ' + L(NUDGE[r.p]),
        en:'The task belongs to this part: ' + L(PARTS[r.p]) + '. ' + L(NUDGE[r.p])
      }));
      setTimeout(advance, 1700);
      return;
    }
    say(host, 'miss', L({ es:'Ahí no. ' + L(NUDGE[r.p]), en:'Not there. ' + L(NUDGE[r.p]) }));
  }

  render();
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 4 :: el tablero de la discusion
   Cuatro casillas: beneficio o riesgo, en la salud o en el medio ambiente.
   Cada caso se coloca con un toque y queda a la vista dentro de su casilla,
   de modo que el tablero se va llenando. Si una de las dos decisiones esta
   bien y la otra no, la retroalimentacion lo dice: eso empuja hacia la
   casilla correcta sin regalarla.
   ══════════════════════════════════════════════════════════════════════════ */
function wTablero(rng, host){
  var CASES = [
    [ { es:'Unas bacterias fabrican la insulina que necesitan las personas con diabetes',
        en:'Some bacteria make the insulin people with diabetes need', ben:1, amb:0, k:{ es:'Bacterias que fabrican insulina', en:'Bacteria that make insulin' } },
      { es:'Un tratamiento corrige el gen que causa una enfermedad hereditaria',
        en:'A treatment corrects the gene that causes an inherited disease', ben:1, amb:0, k:{ es:'Tratamiento que corrige un gen', en:'Treatment that corrects a gene' } } ],
    [ { es:'Un cultivo resiste una plaga y en ese campo se aplican menos plaguicidas',
        en:'A crop resists a pest and fewer pesticides are applied in that field', ben:1, amb:1, k:{ es:'Menos plaguicidas en el campo', en:'Fewer pesticides in the field' } },
      { es:'Una planta modificada crece en suelo pobre y sujeta la tierra de una ladera',
        en:'A modified plant grows in poor soil and holds the earth of a hillside', ben:1, amb:1, k:{ es:'Planta que sujeta la ladera', en:'Plant that holds the hillside' } } ],
    [ { es:'Una proteína nueva de un alimento provoca alergia en algunas personas',
        en:'A new protein in a food causes an allergy in some people', ben:0, amb:0, k:{ es:'Alergia por una proteína nueva', en:'Allergy from a new protein' } },
      { es:'Faltan estudios de varios años sobre el consumo diario de cierto alimento',
        en:'Studies of several years are missing on the daily eating of a certain food', ben:0, amb:0, k:{ es:'Faltan estudios de largo plazo', en:'Long term studies are missing' } } ],
    [ { es:'El polen del cultivo modificado llega al campo vecino y cruza con plantas silvestres',
        en:'Pollen from the modified crop reaches the neighbouring field and crosses with wild plants', ben:0, amb:1, k:{ es:'El polen cruza con plantas silvestres', en:'Pollen crosses with wild plants' } },
      { es:'Los insectos de la plaga dejan de morir con ese cultivo después de varias temporadas',
        en:'The pest insects stop dying with that crop after several seasons', ben:0, amb:1, k:{ es:'La plaga deja de morir', en:'The pest stops dying' } } ]
  ];
  var cards = shuffle(CASES.map(function(g){ return pk(rng, g); }), rng);
  var ROWS = [ { es:'Riesgo', en:'Risk' }, { es:'Beneficio', en:'Benefit' } ];
  var COLS = [ { es:'Salud', en:'Health' }, { es:'Ambiente', en:'Environment' } ];
  var placed = [[[], []], [[], []]];
  var i = 0, tries = 0, hits = 0, done = false;

  host.innerHTML =
    '<div class="gw-h iw-tag">' + L({ es:'El tablero de la discusión', en:'The discussion board' }) + '</div>' +
    '<div class="gw-mini iw-sub">' + L({
      es:'Coloca cada caso en su casilla: primero decide si ayuda o si hay que vigilarlo, y después en qué ámbito ocurre. El tablero se llena con lo que vas colocando.',
      en:'Place each case in its square: first decide whether it helps or has to be watched, and then in which area it happens. The board fills up with what you place.'
    }) + '</div>' +
    '<div class="gw-prog" data-r="prog"></div>' +
    '<div class="jobcard" data-r="card"></div>' +
    '<div class="mxgrid" data-r="grid"></div>' +
    '<div class="gw-fb"></div>';

  var elProg = host.querySelector('[data-r="prog"]');
  var elCard = host.querySelector('[data-r="card"]');
  var elGrid = host.querySelector('[data-r="grid"]');

  function chips(r, c){
    return placed[r][c].map(function(txt){ return '<span class="mxchip">' + txt + '</span>'; }).join('');
  }

  function render(){
    elProg.textContent = done ? '' : L({ es:'Caso ', en:'Case ' }) + (i + 1) + ' / ' + cards.length;
    elCard.textContent = done ? L({ es:'Tablero completo', en:'Board complete' }) : L(cards[i]);
    var html = '<div class="mxh"></div><div class="mxh">' + L(COLS[0]) + '</div><div class="mxh">' + L(COLS[1]) + '</div>';
    for (var r = 1; r >= 0; r--){
      html += '<div class="mxh">' + L(ROWS[r]) + '</div>';
      for (var c = 0; c < 2; c++){
        html += '<div class="mxcell' + (placed[r][c].length ? ' lit' : '') + '" data-r2="' + r + '" data-c="' + c + '">' + chips(r, c) + '</div>';
      }
    }
    elGrid.innerHTML = html;
    if (done) return;
    Array.prototype.forEach.call(elGrid.querySelectorAll('.mxcell'), function(cell){
      cell.addEventListener('click', function(){
        choose(parseInt(cell.getAttribute('data-r2'), 10), parseInt(cell.getAttribute('data-c'), 10));
      });
    });
  }

  function advance(){
    i++; tries = 0;
    if (i >= cards.length){
      done = true; render();
      say(host, 'good', L({
        es:'Tablero completo con ' + hits + ' de ' + cards.length + ' a la primera. Ni todo es beneficio ni todo es riesgo: por eso una postura se arma caso por caso y con datos de los dos lados.',
        en:'Board complete with ' + hits + ' out of ' + cards.length + ' on the first try. Not everything is a benefit and not everything is a risk: that is why a position is built case by case and with data from both sides.'
      }));
    } else render();
  }

  function choose(r, c){
    if (done) return;
    var cd = cards[i];
    if (r === cd.ben && c === cd.amb){
      if (tries === 0) hits++;
      placed[r][c].push(L(cd.k));
      say(host, 'good', L({ es:'En su lugar. Queda registrado en el tablero.', en:'In its place. It is recorded on the board.' }));
      setTimeout(advance, 950);
      return;
    }
    tries++;
    if (tries >= 3){
      placed[cd.ben][cd.amb].push(L(cd.k));
      say(host, 'warm', L({
        es:'Su casilla es ' + L(ROWS[cd.ben]) + ' en ' + L(COLS[cd.amb]) + '. Pregunta siempre dos cosas: si el hecho ayuda o hay que vigilarlo, y a quién afecta.',
        en:'Its square is ' + L(ROWS[cd.ben]) + ' in ' + L(COLS[cd.amb]) + '. Always ask two things: whether the fact helps or has to be watched, and who it affects.'
      }));
      setTimeout(advance, 1700);
      return;
    }
    var okFila = (r === cd.ben), okCol = (c === cd.amb);
    var msgEs = okFila ? 'Acertaste la fila, pero no el ámbito: fíjate en quién resulta afectado, una persona o el entorno.'
      : (okCol ? 'Acertaste el ámbito, pero no la fila: pregúntate si eso ayuda o si hay que vigilarlo.'
               : 'Ninguna de las dos por ahora. Decide primero si ayuda o hay que vigilarlo, y después a quién afecta.');
    var msgEn = okFila ? 'You got the row right, but not the area: look at who ends up affected, a person or the surroundings.'
      : (okCol ? 'You got the area right, but not the row: ask yourself whether it helps or has to be watched.'
               : 'Neither of the two for now. First decide whether it helps or has to be watched, and then who it affects.');
    say(host, 'miss', L({ es:msgEs, en:msgEn }));
  }

  render();
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 5 :: arma una pregunta que se pueda investigar
   Cuatro bandejas de piezas. La pregunta se escribe sola en la pantalla
   conforme el alumno elige, asi que lee de inmediato lo que esta armando.
   Al verificar, la retroalimentacion senala la primera pieza que impide
   investigar la pregunta y por que. Al tercer intento se arma la version
   investigable y se explica pieza por pieza.
   ══════════════════════════════════════════════════════════════════════════ */

          { es:'Qué tan moderno es el maíz modificado', en:'How modern modified maize is', ok:0 } ],
        [ { es:'en la parcela sembrada con maíz modificado', en:'in the plot sown with modified maize', ok:1 },
          { es:'en el campo en general', en:'in the countryside in general', ok:0 },
          { es:'en algún lugar del país', en:'somewhere in the country', ok:0 } ],
        [ { es:'comparado con una parcela vecina de maíz común', en:'compared with a neighbouring plot of ordinary maize', ok:1 },
          { es:'sin comparar con ninguna otra parcela', en:'without comparing with any other plot', ok:0 },
          { es:'comparado con lo que se dice en internet', en:'compared with what is said on the internet', ok:0 } ],
        [ { es:'durante cuatro semanas, contando dos veces por semana', en:'over four weeks, counting twice a week', ok:1 },
          { es:'durante el tiempo que se pueda', en:'for as long as possible', ok:0 },
          { es:'una sola tarde, cuando pasemos por ahí', en:'one single afternoon, when we happen to pass by', ok:0 } ]
      ]
    },
    {
      tema:{ es:'un alimento modificado y las reacciones alérgicas', en:'a modified food and allergic reactions' },
      trays:[
        [ { es:'Cuántas personas presentan una reacción alérgica', en:'How many people show an allergic reaction', ok:1 },
          { es:'Si ese alimento es peligroso', en:'Whether that food is dangerous', ok:0 },
          { es:'Qué tan natural resulta ese alimento', en:'How natural that food turns out to be', ok:0 } ],
        [ { es:'entre quienes comieron el alimento modificado', en:'among those who ate the modified food', ok:1 },
          { es:'entre la gente en general', en:'among people in general', ok:0 },
          { es:'entre quienes vieron una noticia del tema', en:'among those who saw a news item on the subject', ok:0 } ],
        [ { es:'comparado con un grupo que comió el alimento común', en:'compared with a group that ate the ordinary food', ok:1 },
          { es:'sin comparar con ningún otro grupo', en:'without comparing with any other group', ok:0 },
          { es:'comparado con lo que se comía hace cien años', en:'compared with what was eaten a hundred years ago', ok:0 } ],
        [ { es:'durante seis meses de seguimiento', en:'over six months of follow up', ok:1 },
          { es:'durante un rato', en:'for a while', ok:0 },
          { es:'solo el día de la prueba', en:'only on the day of the test', ok:0 } ]
      ]
    }
  ];
  var WHY = [
    { es:'La primera pieza tiene que ser algo que se pueda contar o medir, no una opinión.',
      en:'The first piece has to be something that can be counted or measured, not an opinion.' },
    { es:'Hace falta decir en quién o dónde se observa: sin eso nadie puede repetir la observación.',
      en:'You have to say in whom or where it is observed: without that nobody can repeat the observation.' },
    { es:'Sin un grupo de comparación no se sabe a qué atribuir el resultado.',
      en:'Without a comparison group there is no way to know what to attribute the result to.' },
    { es:'Hay que fijar cuánto dura la observación y cada cuándo se registra.',
      en:'You have to set how long the observation lasts and how often it is recorded.' }
  ];
  var LBL = [
    { es:'Qué se cuenta o se mide', en:'What is counted or measured' },
    { es:'En quién o dónde', en:'In whom or where' },
    { es:'Comparado con qué', en:'Compared with what' },
    { es:'Durante cuánto tiempo', en:'For how long' }
  ];
  var sc = pk(rng, SC);
  var trays = sc.trays.map(function(tr){ return shuffle(tr, rng); });
  var choice = [null, null, null, null];
  var tries = 0, done = false;

  host.innerHTML =
    '<div class="gw-h iw-tag">' + L({ es:'Arma una pregunta que se pueda investigar', en:'Build a question that can be investigated' }) + '</div>' +
    '<div class="gw-mini iw-sub">' + L({
      es:'Elige una pieza de cada bandeja sobre ' + L(sc.tema) + '. La pregunta se escribe sola mientras eliges, y puedes cambiar de pieza cuantas veces quieras.',
      en:'Choose one piece from each tray about ' + L(sc.tema) + '. The question writes itself as you choose, and you can change pieces as often as you like.'
    }) + '</div>' +
    '<div class="qout" data-r="out"></div>' +
    '<div data-r="trays"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="go">' + L({ es:'Revisar mi pregunta', en:'Review my question' }) + '</button></div>' +
    '<div class="gw-fb"></div>';

  var elOut = host.querySelector('[data-r="out"]');
  var elTrays = host.querySelector('[data-r="trays"]');

  function sentence(){
    var partes = choice.map(function(ci, ti){ return ci === null ? null : L(trays[ti][ci]); });
    if (partes[0] === null) return L({
      es:'Elige una pieza de cada bandeja y tu pregunta irá apareciendo aquí.',
      en:'Choose one piece from each tray and your question will appear here.' });
    var txt = partes.filter(function(p){ return p !== null; }).join(' ');
    var full = partes.every(function(p){ return p !== null; });
    if (LANG === 'es') return '¿' + txt + (full ? '?' : ' ...');
    return txt + (full ? '?' : ' ...');
  }

  function render(){
    elOut.innerHTML = sentence();
    elTrays.innerHTML = trays.map(function(tr, ti){
      return '<div class="qtray"><div class="gw-tag">' + L(LBL[ti]) + '</div>' +
        tr.map(function(chip, ci){
          return '<span class="qchip' + (choice[ti] === ci ? ' on' : '') + '" data-t="' + ti + '" data-c="' + ci + '">' + L(chip) + '</span>';
        }).join('') + '</div>';
    }).join('');
    if (done) return;
    Array.prototype.forEach.call(elTrays.querySelectorAll('.qchip'), function(ch){
      ch.addEventListener('click', function(){
        var ti = parseInt(ch.getAttribute('data-t'), 10), ci = parseInt(ch.getAttribute('data-c'), 10);
        choice[ti] = (choice[ti] === ci) ? null : ci;
        render();
      });
    });
  }

  host.querySelector('[data-r="go"]').addEventListener('click', function(){
    if (done) return;
    var falta = -1;
    for (var ti = 0; ti < trays.length; ti++){
      if (choice[ti] === null){ falta = ti; break; }
    }
    if (falta >= 0){
      say(host, 'miss', L({
        es:'Falta la pieza de esta bandeja: ' + L(LBL[falta]) + '. ' + L(WHY[falta]),
        en:'The piece from this tray is missing: ' + L(LBL[falta]) + '. ' + L(WHY[falta])
      }));
      return;
    }
    var mala = -1;
    for (var t2 = 0; t2 < trays.length; t2++){
      if (!trays[t2][choice[t2]].ok){ mala = t2; break; }
    }
    if (mala === -1){
      done = true; render();
      say(host, 'good', L({
        es:'Esa pregunta sí se puede investigar: dice qué se cuenta, dónde, contra qué se compara y durante cuánto tiempo. Con una así se recogen datos y se puede sostener una postura en un debate.',
        en:'That question can indeed be investigated: it says what is counted, where, against what it is compared and for how long. With one like that data can be gathered and a position can be held up in a debate.'
      }));
      return;
    }
    tries++;
    if (tries >= 3){
      trays.forEach(function(tr, ti){
        tr.forEach(function(chip, ci){ if (chip.ok) choice[ti] = ci; });
      });
      done = true; render();
      say(host, 'warm', L({
        es:'Así queda armada. Cada pieza aporta algo: una medida que se puede contar, un lugar concreto, un grupo de comparación y un tiempo definido. Si falta una, la respuesta ya no se sostiene con datos.',
        en:'This is how it ends up built. Each piece contributes something: a measure that can be counted, a concrete place, a comparison group and a set period. If one is missing, the answer no longer holds up with data.'
      }));
      return;
    }
    say(host, 'miss', L({
      es:'La pieza de la bandeja ' + L(LBL[mala]) + ' deja la pregunta sin salida. ' + L(WHY[mala]),
      en:'The piece from the tray ' + L(LBL[mala]) + ' leaves the question with no way out. ' + L(WHY[mala])
    }));
  });

  render();
}

function addProblem(rng, v){
  var idx = problems.length;
  var opts = L(v.opts).slice();
  var correctVal = opts[v.ci];
  var sh = shuffle(opts, rng);
  var prob = {
    title: L(v.title),
    questionText: L(v.q),
    fn: '',
    hint: L(v.hint),
    explanation: L(v.exp),
    options: sh,
    correctIdx: sh.indexOf(correctVal),
    showWork: !!v.showWork,
    studentChoice: null,
    pendingChoice: null
  };
  problems.push(prob);
  buildOneCard(prob, idx);
}

function buildLesson(rng){
  injectGuideCSS();

  /* ── Apertura ── */
  sec(
    L({ es:'Punto de partida', en:'Starting point' }),
    L({ es:'Lo que nadie podía ver', en:'What nobody could see' }),
    '<p>' + L({
      es:'Durante casi toda la historia humana, lo pequeño fue un territorio cerrado. Nadie sabía que una gota de agua de charco está habitada, que una hoja está hecha de cajitas ordenadas o que una enfermedad puede venir de algo demasiado pequeño para verse. Todo eso cambió cuando alguien puso una lente entre su ojo y un pedazo de corcho. Desde entonces, cada vez que el instrumento mejoró apareció un mundo nuevo y, con él, preguntas que antes ni siquiera se podían formular.',
      en:'For almost all of human history, the small was closed territory. Nobody knew that a drop of puddle water is inhabited, that a leaf is made of orderly little boxes or that a disease can come from something too small to be seen. All that changed when somebody put a lens between their eye and a piece of cork. Since then, every time the instrument improved a new world appeared and, with it, questions that could not even be asked before.'
    }) + '</p>' +
    '<p>' + L({
      es:'Ese camino no terminó en la observación. Al ver el interior de la célula se supo dónde están guardadas las instrucciones de lo vivo, y al saber dónde están se abrió la posibilidad de leerlas y de cambiarlas. Ahí empieza una discusión que ya no es solo de laboratorio: es de salud, de campo y de decisiones que se toman entre todos.',
      en:'That road did not end in observation. Seeing the inside of the cell revealed where the instructions of living things are kept, and knowing where they are opened up the possibility of reading them and changing them. That is where a discussion begins that is no longer only about the laboratory: it is about health, about farming and about decisions taken among everyone.'
    }) + '</p>' +
    '<div class="callout"><p><strong>' + L({ es:'Lo que vas a hacer: ', en:'What you are going to do: ' }) + '</strong>' + L({
      es:'vas a ordenar la ruta de los descubrimientos, a decidir con qué instrumento se alcanza cada muestra, a repartir el trabajo entre las partes de una célula, a colocar casos reales en un tablero de beneficios y riesgos y a armar, pieza por pieza, una pregunta que sí se pueda investigar.',
      en:'you are going to order the route of the discoveries, decide which instrument reaches each sample, share out the work among the parts of a cell, place real cases on a board of benefits and risks and build, piece by piece, a question that really can be investigated.'
    }) + '</p></div>'
  );

  /* ══ CONCEPTO 1 ══ */
  var s1 = sec(
    L({ es:'Concepto 1', en:'Concept 1' }),
    L({ es:'Cada instrumento abrió una puerta', en:'Each instrument opened a door' }),
    '<p>' + L({
      es:'Hace más de trescientos años, con lentes pulidas a mano, alguien miró una laminilla de corcho y dibujó unas celdillas vacías ordenadas como un panal. Aquel dibujo fue el primer retrato de lo que hoy llamamos células, aunque en el corcho seco solo quedaban las paredes. Poco después, otras lentes de mejor calidad mostraron algo que nadie esperaba: en una gota de agua estancada se movían seres vivos formados por una sola célula. Con el paso de las décadas, al observar tejidos de plantas y de animales, se llegó a una idea que ordenó toda la biología: todo ser vivo está formado por células.',
      en:'More than three hundred years ago, with hand polished lenses, somebody looked at a slice of cork and drew empty little cells arranged like a honeycomb. That drawing was the first portrait of what today we call cells, even though in the dry cork only the walls were left. Soon after, other lenses of better quality showed something nobody expected: in a drop of stagnant water living things made of a single cell were moving. As the decades passed, observing plant and animal tissues, an idea was reached that put the whole of biology in order: every living thing is made of cells.'
    }) + '</p>' +
    '<p>' + L({
      es:'La observación siguió dependiendo del aparato. Con los microscopios de luz se distinguieron las bacterias y se relacionaron con varias enfermedades, pero había un escalón que la luz no podía bajar. Ese escalón lo bajó el microscopio electrónico, que en lugar de luz usa haces de electrones: con él se vio por dentro de la célula y, por primera vez, se obtuvieron imágenes de los virus. Conviene fijarse en el orden de los hechos, porque cada instrumento hizo posible la observación siguiente y no al revés.',
      en:'Observation went on depending on the device. With light microscopes bacteria were told apart and linked with several diseases, but there was a step that light could not go down. That step was taken by the electron microscope, which uses beams of electrons instead of light: with it the inside of the cell was seen and, for the first time, images of viruses were obtained. It is worth looking at the order of the facts, because each instrument made the next observation possible and not the other way round.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Lente sencilla', en:'Simple lens' }), L({ es:'decenas de aumentos', en:'tens of magnifications' }), L({ es:'las celdillas vacías del corcho', en:'the empty little cells of cork' })) +
      rcard(L({ es:'Microscopio de luz', en:'Light microscope' }), L({ es:'cientos de aumentos', en:'hundreds of magnifications' }), L({ es:'células vivas y bacterias', en:'living cells and bacteria' })) +
      rcard(L({ es:'Microscopio electrónico', en:'Electron microscope' }), L({ es:'miles de aumentos', en:'thousands of magnifications' }), L({ es:'el interior de la célula y los virus', en:'the inside of the cell and viruses' })) +
      rcard(L({ es:'Teoría celular', en:'Cell theory' }), L({ es:'una idea que ordena', en:'an idea that puts things in order' }), L({ es:'todo ser vivo está formado por células', en:'every living thing is made of cells' })) +
    '</div>'
  );
  wRuta(rng, widgetHost(s1, 'wRuta', 'timeline'));
  addProblem(rng, mkP1(rng));
  addProblem(rng, mkP2(rng));

  /* ══ CONCEPTO 2 ══ */
  var s2 = sec(
    L({ es:'Concepto 2', en:'Concept 2' }),
    L({ es:'Agrandar no es lo mismo que distinguir', en:'Enlarging is not the same as telling apart' }),
    '<p>' + L({
      es:'El microscopio de la escuela tiene dos lentes que trabajan una después de la otra: el objetivo, que queda cerca de la muestra, y el ocular, por donde miras. El aumento total se obtiene multiplicando el aumento del ocular por el del objetivo, y por eso un equipo modesto llega a varios cientos de aumentos con solo girar el revólver.',
      en:'The school microscope has two lenses that work one after the other: the objective, which sits close to the sample, and the eyepiece, which you look through. The total magnification is obtained by multiplying the magnification of the eyepiece by that of the objective, and that is why a modest setup reaches several hundred magnifications just by turning the nosepiece.'
    }) + '</p>' +
    '<p>' + L({
      es:'Pero un aparato hace dos cosas distintas. Una es agrandar: mostrar la imagen más grande. La otra es distinguir detalles: mostrar como dos cosas separadas lo que de verdad está separado. Cuando un microscopio llega a su detalle más fino, seguir agrandando solo estira una imagen borrosa; por eso hay un tamaño mínimo para cada instrumento. El ojo sin ayuda alcanza cosas de alrededor de un décimo de milímetro, el microscopio de luz llega hasta células y bacterias, y por debajo de eso, donde están los virus y el detalle fino del interior celular, solo entra el microscopio electrónico.',
      en:'But a device does two different things. One is to enlarge: to show the image bigger. The other is to tell detail apart: to show as two separate things what really is separate. When a microscope reaches its finest detail, going on enlarging only stretches a blurry image; that is why there is a smallest size for each instrument. The unaided eye reaches things around a tenth of a millimetre, the light microscope reaches cells and bacteria, and below that, where viruses and the fine detail of the cell interior are, only the electron microscope gets in.'
    }) + '</p>'
  );
  wEscala(rng, widgetHost(s2, 'wEscala', 'classify'));
  addProblem(rng, mkP3(rng));
  addProblem(rng, mkP4(rng));

  /* ══ CONCEPTO 3 ══ */
  var s3 = sec(
    L({ es:'Concepto 3', en:'Concept 3' }),
    L({ es:'Lo que el microscopio encontró dentro', en:'What the microscope found inside' }),
    '<p>' + L({
      es:'Cuando los instrumentos mejoraron, la célula dejó de ser una cajita vacía. Apareció primero su límite, la membrana, una capa finísima que la separa del medio y que funciona como un filtro que elige: deja entrar el oxígeno y el alimento disuelto, deja salir los desechos y el agua que sobra, y bloquea lo que podría dañarla. Además es lo primero que recibe una señal de afuera, así que participa tanto en la nutrición como en la relación con el medio.',
      en:'When instruments improved, the cell stopped being an empty little box. First its boundary appeared, the membrane, a very thin layer that separates it from the medium and works as a filter that chooses: it lets in oxygen and dissolved food, lets waste and leftover water out, and blocks what could harm it. It is also the first to receive a signal from outside, so it takes part both in nutrition and in relation with the medium.'
    }) + '</p>' +
    '<p>' + L({
      es:'Dentro se distinguió el citoplasma, el material espeso que llena la célula y donde ocurre casi todo el trabajo: ahí se transforma el alimento, se libera la energía y se reparten las sustancias de un extremo a otro. Y cerca del centro se vio un cuerpo redondeado y más oscuro: el núcleo, que guarda los cromosomas. Ese material funciona como un instructivo completo de la célula, y antes de que una célula forme dos nuevas se copia entero y se reparte en partes iguales. De ahí salen la reproducción y la herencia. Un fragmento de ese instructivo, el que corresponde a una característica, es lo que llamamos gen.',
      en:'Inside, the cytoplasm was told apart, the thick material that fills the cell and where almost all the work happens: there food is transformed, energy is released and substances are spread from one end to the other. And near the centre a rounded and darker body was seen: the nucleus, which keeps the chromosomes. That material works as a complete instruction booklet for the cell, and before a cell forms two new ones it is copied whole and shared out in equal parts. From there come reproduction and inheritance. A piece of that booklet, the one matching a characteristic, is what we call a gene.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Membrana', en:'Membrane' }), L({ es:'nutrición y relación', en:'nutrition and relation' }), L({ es:'decide qué entra y qué sale', en:'decides what comes in and what goes out' })) +
      rcard(L({ es:'Citoplasma', en:'Cytoplasm' }), L({ es:'nutrición', en:'nutrition' }), L({ es:'transforma el alimento y lo reparte', en:'transforms the food and spreads it' })) +
      rcard(L({ es:'Núcleo', en:'Nucleus' }), L({ es:'reproducción y herencia', en:'reproduction and inheritance' }), L({ es:'guarda y reparte las instrucciones', en:'keeps and shares out the instructions' })) +
      rcard(L({ es:'Gen', en:'Gene' }), L({ es:'un fragmento del instructivo', en:'a piece of the booklet' }), L({ es:'corresponde a una característica', en:'matches one characteristic' })) +
    '</div>'
  );
  wPartes(rng, widgetHost(s3, 'wPartes', 'match'));
  addProblem(rng, mkP5(rng));

  /* ══ CONCEPTO 4 ══ */
  var s4 = sec(
    L({ es:'Concepto 4', en:'Concept 4' }),
    L({ es:'Leer las instrucciones y cambiarlas', en:'Reading the instructions and changing them' }),
    '<p>' + L({
      es:'Si las instrucciones de un ser vivo están guardadas en el núcleo de sus células, entonces se pueden leer, y desde hace unas décadas también se pueden cambiar o trasladar de un ser vivo a otro. A eso se le llama manipulación genética. Gracias a ella hay bacterias que fabrican la insulina que necesitan las personas con diabetes, cultivos que resisten una plaga con menos plaguicida y tratamientos que corrigen un gen que causa una enfermedad hereditaria.',
      en:'If the instructions of a living thing are kept in the nucleus of its cells, then they can be read, and for some decades now they can also be changed or moved from one living thing to another. That is called genetic manipulation. Thanks to it there are bacteria that make the insulin people with diabetes need, crops that resist a pest with less pesticide and treatments that correct a gene causing an inherited disease.'
    }) + '</p>' +
    '<p>' + L({
      es:'También hay motivos para vigilar. Una planta modificada puede cruzarse por medio del polen con plantas del campo vecino y llevarles el cambio; una proteína nueva en un alimento puede provocar alergia en algunas personas; una plaga puede dejar de morir después de varias temporadas con el mismo cultivo; y de varios usos aún faltan estudios de largo plazo. Beneficios y riesgos no se reparten de forma pareja: unos ocurren en el ámbito de la salud y otros en el del medio ambiente, y conviene separarlos para no discutir todo revuelto.',
      en:'There are also reasons to watch. A modified plant can cross through pollen with plants of the neighbouring field and carry the change to them; a new protein in a food can cause an allergy in some people; a pest can stop dying after several seasons with the same crop; and for several uses long term studies are still missing. Benefits and risks are not shared out evenly: some happen in the area of health and others in that of the environment, and it is worth separating them so as not to argue about everything mixed together.'
    }) + '</p>'
  );
  wTablero(rng, widgetHost(s4, 'wTablero', 'matrix'));
  addProblem(rng, mkP6(rng));
  addProblem(rng, mkP7(rng));

  /* ══ CONCEPTO 5 ══ */
  var s5 = sec(
    L({ es:'Concepto 5', en:'Concept 5' }),
    L({ es:'Preguntar bien para poder debatir', en:'Asking well in order to be able to debate' }),
    '<p>' + L({
      es:'En una discusión sobre manipulación genética es fácil quedarse en estar a favor o en contra. Una pregunta que se puede investigar es distinta: nombra algo que se cuenta o se mide, dice en quién o dónde se observa, incluye un grupo de comparación y fija durante cuánto tiempo se recogen los datos. Con esas cuatro piezas se puede salir a tomar datos y volver con una respuesta; sin ellas, la conversación se queda en opiniones.',
      en:'In a discussion about genetic manipulation it is easy to stop at being for or against. A question that can be investigated is different: it names something that is counted or measured, says in whom or where it is observed, includes a comparison group and sets for how long the data are gathered. With those four pieces you can go out and gather data and come back with an answer; without them, the conversation stays at opinions.'
    }) + '</p>' +
    '<p>' + L({
      es:'Contrastar explicaciones es el paso siguiente. Cuando dos equipos sostienen cosas contrarias sobre el mismo caso, lo que decide no es quién habla con más seguridad, sino qué evidencia trae cada uno: qué se midió, en cuántos casos, dónde y por cuánto tiempo. Y una advertencia útil para cualquier debate: que hasta hoy no se haya reportado un daño no significa que se haya descartado, porque quizá se estudió poco tiempo o en pocos lugares.',
      en:'Contrasting explanations is the next step. When two teams hold opposite things about the same case, what decides is not who speaks with more confidence, but what evidence each one brings: what was measured, in how many cases, where and for how long. And a useful warning for any debate: the fact that no harm has been reported so far does not mean it has been ruled out, because perhaps it was studied for a short time or in few places.'
    }) + '</p>'
  );
  wPregunta(rng, widgetHost(s5, 'wPregunta', 'question'));
  addProblem(rng, mkP8(rng));
  wReflexion(rng, widgetHost(s5, 'wReflexion', 'reflect'));

  /* ══ CIERRE ══ */
  sec(
    L({ es:'Para cerrar', en:'To finish' }),
    L({ es:'Del instrumento a la decisión', en:'From the instrument to the decision' }),
    '<p>' + L({
      es:'Las dos situaciones siguientes vienen de una ficha técnica y de un debate escolar. En cada una hay que decidir con números o con evidencia, que son las dos formas en que este tema se sostiene.',
      en:'The next two situations come from a technical sheet and from a school debate. In each one a decision has to be made with numbers or with evidence, which are the two ways this subject holds up.'
    }) + '</p>'
  );
  addProblem(rng, mkP9(rng));
  addProblem(rng, mkP10(rng));
}
</script>

<!-- LIAXA ANALYTICS -->
<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbyjbSUYDHwe-0Hl5GnZC6mP3_iKPYnLqeUgbuhxARkW2-keCAAV6sSg0wYWJnJBhY7lUQ/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var body = JSON.stringify({school:school,event:ev,module_id:moduleId,
      session_id:sessionId,elapsed_sec:Math.round((Date.now()-openedAt)/1000)});
    if(ev==='module_close'&&navigator.sendBeacon){
      navigator.sendBeacon(GAS_URL,new Blob([body],{type:'application/json'}));
    }else{
      fetch(GAS_URL,{method:'POST',body:body,headers:{'Content-Type':'application/json'},keepalive:true}).catch(function(){});
    }
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
</body>
