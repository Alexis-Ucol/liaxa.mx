<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cost Optimization · Business Math · School of Economics, Universidad de Colima</title>
<link rel="canonical" href="https://liaxa.mx/facultad_economia/business_math/neg_opt_costos.html">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS ── fallback only; applyBranding() re-injects from SCHOOL ── */
:root {
  --green:      #4a7c3f;
  --green-dark: #2d5a27;
  --green-bg:   #eaf0e7;
  --gold:       #c9a84c;
  --gold-bg:    #faf3e0;
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #6aaa5f;
  --green-dark: #8ecf82;
  --green-bg:   #1a281a;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--green-bg); color:var(--green-dark); border:1.5px solid var(--green); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; }
#restoreBar strong { color:var(--green-dark); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; object-fit:contain; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; min-width:0; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── LANGUAGE TOGGLE ── */
.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }
.dlist { font-family:'IBM Plex Mono',monospace; font-size:.78rem; color:var(--green-dark); background:var(--surface2); border-radius:8px; padding:.6rem .7rem; margin:.6rem 0; word-break:break-word; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); overflow-x:auto; }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── INTERACTIVE WIDGETS ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.iw-head { display:flex; align-items:baseline; gap:.6rem; margin-bottom:.3rem; flex-wrap:wrap; }
.iw-tag { font-size:.62rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; }
.iw-title { font-family:'Crimson Pro',serif; font-size:1.08rem; font-weight:700; }
.iw-sub { font-size:.8rem; color:var(--text2); margin-bottom:.85rem; }
.iw-canvas { display:block; width:100%; border-radius:8px; background:var(--surface2); }
.iw-read { margin-top:.85rem; background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 8px 8px 0; padding:.7rem .85rem; font-size:.82rem; color:var(--text2); }
.iw-read strong { color:var(--green-dark); }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (widget toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.3rem .7rem; font-size:.76rem; cursor:pointer; color:var(--text2); transition:all .14s; font-family:inherit; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--gold-bg); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }

/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos { gap: .9rem; }
  .wlogos img { height: 38px; max-width: 42%; }
  .wtitle { font-size: 1.35rem; }
  .stickybar { padding: .5rem .55rem; gap: .38rem; }
  .htitle { display: none; }
  .halexis { display: none; }
  .hsep { display: none; }
  .hlogos { gap: .3rem; }
  .hlogos img { height: 18px; max-width: 60px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 78px; overflow: hidden; text-overflow: ellipsis; }
  .lang-btn { padding: .26rem .48rem; font-size: .68rem; }
  .lbody { padding: 1.2rem .7rem 3rem; max-width: 100%; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .gcrd { padding: .9rem .75rem; }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}
</style>
</head>
<body>

<!-- ════════════════════ WELCOME ════════════════════ -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <img id="logo-left"  src="" alt="Facultad de Economía" style="display:none">
      <div class="wlogsep" id="wlogsep"></div>
      <img id="logo-right" src="" alt="Universidad de Colima" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Cost Optimization</div>
    <div class="wcourse" id="wcourse-el">Business Math</div>
    <label class="flabel" for="sName" id="lbl-name-el">Full name</label>
    <input class="finput" id="sName" type="text" placeholder="Your full name" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" for="sGroup" id="lbl-group-el">Group</label>
    <input class="finput" id="sGroup" type="text" placeholder="e.g. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Start</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar" style="background:var(--green-bg); color:var(--green-dark);">
      <strong id="restoreTitle">Saved session found</strong><br>
      <span id="restoreMsg">Do you want to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.9rem">
      <svg width="160" height="52" viewBox="0 0 180 52" xmlns="http://www.w3.org/2000/svg">
        <style>
          .lbt { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.1em; fill:var(--green); font-size:28px; }
          .lbl { stroke:var(--gold); stroke-width:2.5; }
          .lba { fill:var(--gold); }
        </style>
        <polyline points="5,40 14,28 24,33 36,14" fill="none" stroke="var(--green)" stroke-width="3"/>
        <circle cx="36" cy="14" r="4.5" class="lba"/>
        <line x1="52" y1="6" x2="52" y2="46" class="lbl"/>
        <text x="64" y="38" class="lbt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- ════════════════════ LESSON ════════════════════ -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <img id="hlogo-left"  src="" alt="Facultad de Economía" style="display:none">
      <img id="hlogo-right" src="" alt="Universidad de Colima" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle" id="htitle-el">Cost Optimization</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg">
        <style>
          .lht { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
          .lhl { stroke:var(--gold); stroke-width:2; }
          .lha { fill:var(--gold); }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" fill="none" stroke="var(--green)" stroke-width="2"/>
        <circle cx="22" cy="10" r="2.5" class="lha"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lhl"/>
        <text x="42" y="22" class="lht">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle">
      <button class="lang-btn"        id="btn-es" onclick="setLang('es')">ES</button>
      <button class="lang-btn active" id="btn-en" onclick="setLang('en')">EN</button>
    </div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="dlbtn" id="dlBtn" onclick="generatePDF()">Download results as PDF</button>
    </div>
  </div>
</div>

<script>
/* ════════════════════════════════════════════════════════════════════════
   SCHOOL CONFIG · edit ONLY this block to rebrand for a different school
   ════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:      '#4a7c3f',
  primaryDark:  '#2d5a27',
  primaryBg:    '#eaf0e7',
  accent:       '#c9a84c',
  accentBg:     '#faf3e0',
  pBR: 74,  pBG: 124, pBB: 63,
  pAR: 201, pAG: 168, pAB: 76,
  darkPrimary:     '#6aaa5f',
  darkPrimaryDark: '#8ecf82',
  darkPrimaryBg:   '#1a281a',

function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t2 = s ^ (s >>> 16);
    t2 = Math.imul(t2, 0x21f0aaad);
    t2 ^= (t2 >>> 15);
    t2 = Math.imul(t2, 0x735a2d97);
    return ((t2 ^ (t2 >>> 15)) >>> 0) / 4294967296;

}

function shuffle(arr, rng) {

    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;

}

/* ── THE MODELS THIS GUIDE RUNS ON ────────────────────────────────────────
   Optimising a cost never means making a cost as small as possible. Every
   cost worth optimising is really two costs pulling in opposite directions,
   so that pushing one down pushes the other up. The quantity that matters
   is the one where the sum of the two stops falling, and it is almost never
   the quantity that makes either one alone the smallest.                   */

/* ── Cost structure of a plant ──
   Fixed cost stays put while output grows, so it is spread thinner every
   unit. The variable cost per unit does not stay flat: past a point overtime,
   rush freight and crowded machines make each extra unit dearer than the one
   before, which is the term w carries here. */
function totalCost(F, v, w, q)  { return F + v * q + w * q * q; }
function unitCost(F, v, w, q)   { return q <= 0 ? null : F / q + v + w * q; }
/* What one more unit adds to total cost. */
function marginalCost(v, w, q)  { return v + 2 * w * q; }
/* Unit cost stops falling exactly where the fixed cost spread over one more
   unit no longer covers the congestion that unit causes. */
function optVolume(F, w)        { return Math.sqrt(F / w); }
function minUnitCost(F, v, w)   { return v + 2 * Math.sqrt(F * w); }
function fixedShare(F, q)       { return q <= 0 ? null : F / q; }

/* ── Two cost structures compared ──
   Buying from outside carries no fixed cost and a high price per unit;
   producing in house carries a fixed cost and a lower cost per unit. */
function buyCost(p, q)          { return p * q; }
function makeCost(F, v, q)      { return F + v * q; }
/* The volume at which the two structures cost the same. */
function indiffVolume(F, p, v)  { return p <= v ? null : F / (p - v); }

/* ── Ordering and holding ──
   Ordering in large lots means few orders and a big average stock; ordering
   in small lots means a small stock and many orders. The two costs move
   against each other. */
function orderingCost(D, S, Q)  { return Q <= 0 ? null : D / Q * S; }
function holdingCost(H, Q)      { return Q / 2 * H; }
function relevantCost(D, S, H, Q) { return orderingCost(D, S, Q) + holdingCost(H, Q); }
function eoq(D, S, H)           { return Math.sqrt(2 * D * S / H); }
/* At the optimum the two costs are equal, so the total is twice either one. */
function eoqCost(D, S, H)       { return Math.sqrt(2 * D * S * H); }
function ordersPerYear(D, Q)    { return Q <= 0 ? null : D / Q; }
/* How much dearer a lot size is than the best one, as a multiple of the best.
   The curve through this function is famously flat: being well off the
   optimum costs surprisingly little. */
function costIndex(Q, Qs)       { return Q <= 0 ? null : 0.5 * (Q / Qs + Qs / Q); }

/* A verdict written as a word rather than a sign. */
function cheaperTxt(v, es) {
  if (Math.abs(v) < 0.5) return es ? 'igual' : 'level';
  if (es) return v > 0 ? 'producir' : 'comprar';
  return v > 0 ? 'make' : 'buy';
}
function savingTxt(v, es) {
  var m = money(Math.abs(v));
  if (es) return m + (v >= 0 ? ' a favor' : ' en contra');
  return m + (v >= 0 ? ' in favour' : ' against');
}

/* ════════════════════════════════════════════════════════════════════════
   OPTION BUILDERS · the key is always the first value handed in
   ════════════════════════════════════════════════════════════════════════ */
/* Four distinct numbers, each rendered once per language and kept aligned.
   The key is always the first value handed in. */
function valOpts2(correct, wrongs, fmtEs, fmtEn, rng) {
  var seen = {}, vals = [];
  function add(v) {
    if (typeof v !== 'number' || !isFinite(v)) return;
    var s = fmtEn(v);
    if (seen[s]) return;
    seen[s] = 1; vals.push(v);
  }
  add(correct);
  for (var i = 0; i < wrongs.length && vals.length < 4; i++) add(wrongs[i]);
  for (var j = 1; vals.length < 4 && j < 900; j++) {
    add(correct * (1 + j * 0.11 * (j % 2 ? 1 : -1)));
  }
  for (var k = 1; vals.length < 4 && k < 900; k++) add(correct + k * 0.41);
  return shuffleOpts(vals.map(fmtEs), vals.map(fmtEn), rng);
}
function valOpts(correct, wrongs, fmt, rng) {
  return valOpts2(correct, wrongs, fmt, fmt, rng);
}

function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#2d5a27';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e) { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e) { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(p[0], p[1]); ctx.stroke(); lx = p[0]; ly = p[1]; }
  function onUp() { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ════════════════════════════════════════════════════════════════════════
   ANSWER HANDLER · two taps to confirm
   ════════════════════════════════════════════════════════════════════════ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = '<strong>' + (isOk ? t('fb-correct') : t('fb-wrong')) + '</strong> ' + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (!prob || prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = '<strong>' + (isOk ? t('fb-correct') : t('fb-wrong')) + '</strong> ' + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

/* ════════════════════════════════════════════════════════════════════════
   CANVAS PRIMITIVES FOR THE WIDGETS
   ════════════════════════════════════════════════════════════════════════ */
function fitCanvas(cv, h) {
  var dpr = window.devicePixelRatio || 1;
  var w = Math.max(240, cv.clientWidth || cv.parentNode.clientWidth || 300);
  cv.style.height = h + 'px';
  cv.width  = Math.round(w * dpr);
  cv.height = Math.round(h * dpr);
  var ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  return { ctx: ctx, w: w, h: h };
}
function palette() {
  return {
    green: cssv('--green'), dark: cssv('--green-dark'), tint: cssv('--green-bg'),
    gold: cssv('--gold'), bad: cssv('--bad'), border: cssv('--border'),
    text: cssv('--text'), text2: cssv('--text2'), text3: cssv('--text3')
  };
}
function kindColor(P, kind) {
  if (kind === 'gold') return P.gold;
  if (kind === 'bad')  return P.bad;
  if (kind === 'tint') return P.tint;
  if (kind === 'soft') return P.text3;
  return P.dark;
}
/* Plots any curve given as a function of a quantity. A cost that falls as
   volume grows, a cost that rises with it and the sum of the two are all the
   same picture to this routine.
     opts.marks  points worth naming, such as the lot size that costs least
     opts.band   the stretch of the horizontal axis worth highlighting
     opts.hline  a reference amount drawn as a horizontal line
     opts.at     where the firm is standing right now                       */
function drawCurveChart(g, xMin, xMax, series, opts) {
  var ctx = g.ctx, P = palette(), W = g.w, H = g.h, i;
  var padL = 56, padR = 12, padT = 18, padB = 28;
  opts = opts || {};
  var fmtY  = opts.fmtY || function(v) { return intN(v); };
  var fmtX  = opts.fmtX || function(v) { return intN(v); };
  var STEPS = 140;
  var yLo = null, yHi = null;
  function note(v) {
    if (typeof v !== 'number' || !isFinite(v)) return;
    if (yLo === null || v < yLo) yLo = v;
    if (yHi === null || v > yHi) yHi = v;
  }
  series.forEach(function(s) {
    for (i = 0; i <= STEPS; i++) note(s.f(xMin + (xMax - xMin) * i / STEPS));
  });
  note(opts.yFloor); note(opts.yCeil);
  if (opts.hline) note(opts.hline.y);
  if (opts.asym)  note(opts.asym.y);
  if (yLo === null) { yLo = 0; yHi = 1; }
  if (yHi - yLo < 1) yHi = yLo + 1;
  var pd = (yHi - yLo) * 0.10;
  yLo -= pd; yHi += pd;
  function X(v) { return padL + (v - xMin) / (xMax - xMin) * (W - padL - padR); }
  function Y(v) { return H - padB - (v - yLo) / (yHi - yLo) * (H - padT - padB); }
  function Yc(v) { return Math.max(padT - 10, Math.min(H - padB + 10, Y(v))); }

  if (opts.band && opts.band.to > opts.band.from) {
    var b1 = X(Math.max(xMin, opts.band.from)), b2 = X(Math.min(xMax, opts.band.to));
    if (b2 > b1) {
      ctx.save();
      ctx.fillStyle = P.tint;
      ctx.fillRect(b1, padT - 8, b2 - b1, H - padB - padT + 8);
      ctx.restore();
    }
  }
  ctx.strokeStyle = P.border; ctx.lineWidth = 1;
  ctx.fillStyle = P.text3; ctx.font = '9px "IBM Plex Mono", monospace';
  for (i = 0; i <= 3; i++) {
    var gv = yLo + (yHi - yLo) * i / 3;
    ctx.beginPath(); ctx.moveTo(padL, Y(gv)); ctx.lineTo(W - padR, Y(gv)); ctx.stroke();
    var gl = fmtY(gv);
    ctx.fillText(gl, Math.max(1, padL - 4 - ctx.measureText(gl).width), Y(gv) + 3);
  }
  if (yLo < 0 && yHi > 0) {
    ctx.save();
    ctx.strokeStyle = P.text3; ctx.lineWidth = 1.4; ctx.setLineDash([3, 3]);
    ctx.beginPath(); ctx.moveTo(padL, Y(0)); ctx.lineTo(W - padR, Y(0)); ctx.stroke();
    ctx.restore();
  }
  if (opts.asym) {
    ctx.save();
    ctx.strokeStyle = P.bad; ctx.lineWidth = 1.3; ctx.setLineDash([5, 4]);
    ctx.beginPath(); ctx.moveTo(padL, Y(opts.asym.y)); ctx.lineTo(W - padR, Y(opts.asym.y)); ctx.stroke();
    ctx.restore();
    if (opts.asym.label) {
      ctx.fillStyle = P.bad; ctx.font = '600 9px "IBM Plex Sans", sans-serif';
      ctx.fillText(opts.asym.label, padL + 4, Math.max(10, Y(opts.asym.y) - 4));
    }
  }
  if (opts.hline) {
    ctx.save();
    ctx.strokeStyle = P.gold; ctx.lineWidth = 1.5; ctx.setLineDash([6, 3]);
    ctx.beginPath(); ctx.moveTo(padL, Y(opts.hline.y)); ctx.lineTo(W - padR, Y(opts.hline.y)); ctx.stroke();
    ctx.restore();
    if (opts.hline.label) {
      ctx.fillStyle = P.gold; ctx.font = '600 9px "IBM Plex Sans", sans-serif';
      var hw = ctx.measureText(opts.hline.label).width;
      ctx.fillText(opts.hline.label, W - padR - hw - 2, Math.max(10, Y(opts.hline.y) - 4));
    }
  }
  series.forEach(function(s) {
    ctx.strokeStyle = kindColor(P, s.kind); ctx.lineWidth = 2.2;
    ctx.beginPath();
    var started = false;
    for (i = 0; i <= STEPS; i++) {
      var xv = xMin + (xMax - xMin) * i / STEPS;
      var yv = s.f(xv);
      if (typeof yv !== 'number' || !isFinite(yv)) { started = false; continue; }
      var px = X(xv), py = Yc(yv);
      if (!started) { ctx.moveTo(px, py); started = true; } else { ctx.lineTo(px, py); }
    }
    ctx.stroke();
  });
  (opts.marks || []).forEach(function(m) {
    if (typeof m.x !== 'number' || !isFinite(m.x) || m.x < xMin || m.x > xMax) return;
    var cx = X(m.x), cy = Yc(m.y);
    ctx.save();
    ctx.strokeStyle = kindColor(P, m.kind || 'gold'); ctx.lineWidth = 1.4; ctx.setLineDash([4, 3]);
    ctx.beginPath(); ctx.moveTo(cx, H - padB); ctx.lineTo(cx, cy); ctx.stroke();
    ctx.restore();
    ctx.fillStyle = kindColor(P, m.kind || 'gold');
    ctx.beginPath(); ctx.arc(cx, cy, 4.2, 0, Math.PI * 2); ctx.fill();
    if (m.label) {
      ctx.font = '600 10px "IBM Plex Sans", sans-serif';
      var mw = ctx.measureText(m.label).width;
      ctx.fillText(m.label, Math.min(Math.max(2, cx - mw / 2), W - mw - 2), Math.max(10, cy - 9));
    }
  });
  if (typeof opts.at === 'number' && opts.at >= xMin && opts.at <= xMax) {
    ctx.save();
    ctx.strokeStyle = P.bad; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(X(opts.at), H - padB); ctx.lineTo(X(opts.at), padT - 6); ctx.stroke();
    ctx.restore();
  }
  ctx.strokeStyle = P.border; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(padL, padT - 8); ctx.lineTo(padL, H - padB); ctx.lineTo(W - padR, H - padB); ctx.stroke();
  ctx.fillStyle = P.text3; ctx.font = '9px "IBM Plex Mono", monospace';
  [xMin, (xMin + xMax) / 2, xMax].forEach(function(v) {
    var lab = fmtX(v), lw = ctx.measureText(lab).width;
    ctx.fillText(lab, Math.min(Math.max(1, X(v) - lw / 2), W - lw - 1), H - padB + 13);
  });
  var legX = padL + 4;
  ctx.font = '600 9.5px "IBM Plex Sans", sans-serif';
  series.forEach(function(s) {
    if (!s.label) return;
    ctx.fillStyle = kindColor(P, s.kind);
    ctx.fillRect(legX, 9, 9, 3);
    ctx.fillText(s.label, legX + 12, 13);
    legX += 12 + ctx.measureText(s.label).width + 12;
  });
  if (opts.xLabel) {
    ctx.fillStyle = P.text3; ctx.font = '9px "IBM Plex Sans", sans-serif';
    var xl = opts.xLabel;
    ctx.fillText(xl, W - padR - ctx.measureText(xl).width, H - 3);
  }
}

/* ════════════════════════════════════════════════════════════════════════
   WIDGET 1 · the two halves of a unit cost, and where they stop fighting
   ════════════════════════════════════════════════════════════════════════ */
function widgetUnitCost(F0, v0, w0, q0) {
  var host = document.createElement('div');
  host.className = 'section';
  document.getElementById('lessonBody').appendChild(host);
  var state = { view: 'unit', F: F0, v: v0, w: w0, q: q0 };
  function mount() {
    var es = LANG === 'es';
    var MODES = [
      { id: 'unit',  es: 'Costo de cada unidad', en: 'What each unit costs' },
      { id: 'total', es: 'Costo total del mes', en: 'Total cost for the month' }
    ];
    var tabs = MODES.map(function(m) {
      return '<button class="mtab' + (m.id === state.view ? ' active' : '') + '" data-m="' + m.id + '">' + m[LANG] + '</button>';
    }).join('');
    host.innerHTML =
      '<div class="gcrd" data-widget="estructura-de-costos-y-costo-unitario">' +
        '<div class="iw-head"><span class="iw-tag">' + (es ? 'Herramienta' : 'Tool') + '</span>' +
        '<span class="iw-title">' + (es ? 'Por qué producir de más también encarece' : 'Why making too much also costs more') + '</span></div>' +
        '<div class="iw-sub">' + (es
          ? 'Empieza con la primera vista, que es la que importa. La curva verde es lo que le cuesta a la empresa cada unidad que sale del taller, y no baja para siempre: cae, toca fondo y vuelve a subir. Las dos líneas delgadas explican por qué. Una es el costo fijo repartido entre las unidades del mes, que se adelgaza conforme el volumen crece. La otra es el sobrecosto de apretar el taller, tiempo extra y fletes urgentes, que engorda conforme el volumen crece. La curva verde es la suma de ambas, y su punto más bajo está donde las dos se cruzan, ni antes ni después. Mueve el volumen con el último control y observa la línea roja acercarse al fondo. Prueba luego algo que parece contradictorio: sube el costo fijo y verás que el volumen que conviene aumenta, porque un costo fijo más grande merece repartirse entre más unidades. Sube en cambio el sobrecosto por apretar el taller y el volumen que conviene se reduce. La segunda vista muestra la misma historia en pesos totales, donde la curva solo sube y por eso engaña a quien busca ahí el volumen que conviene.'
          : 'Start with the first view, which is the one that matters. The green curve is what each unit leaving the workshop costs the company, and it does not fall forever: it drops, touches bottom and climbs again. The two thin lines explain why. One is the fixed cost shared out among the units made that month, which thins as volume grows. The other is the premium for pushing the workshop, overtime and rush freight, which thickens as volume grows. The green curve is the sum of the two, and its lowest point sits exactly where they cross, neither before nor after. Move the volume with the last control and watch the red line approach the bottom. Then try something that looks contradictory: raise the fixed cost and the volume worth running goes up, because a larger fixed cost deserves to be shared among more units. Raise the premium for pushing the workshop instead and the volume worth running comes down. The second view tells the same story in total pesos, where the curve only ever rises, which is why anyone looking there for the right volume is misled.') + '</div>' +
        '<div class="mtabs">' + tabs + '</div>' +
        '<div class="cgrid"><div class="cg">' +
          '<label>' + (es ? 'Costo fijo del mes' : 'Fixed cost for the month') + ': <span class="cval" id="u1Fl"></span></label>' +
          '<input type="range" min="40000" max="500000" step="10000" id="u1F" value="' + state.F + '">' +
        '</div><div class="cg">' +
          '<label>' + (es ? 'Costo variable base por unidad' : 'Base variable cost per unit') + ': <span class="cval" id="u1vl"></span></label>' +
          '<input type="range" min="60" max="260" step="10" id="u1v" value="' + state.v + '">' +
        '</div></div>' +
        '<div class="cgrid"><div class="cg">' +
          '<label>' + (es ? 'Sobrecosto por apretar el taller' : 'Premium for pushing the workshop') + ': <span class="cval" id="u1wl"></span></label>' +
          '<input type="range" min="1" max="6" step="1" id="u1w" value="' + state.w + '">' +
        '</div><div class="cg">' +
          '<label>' + (es ? 'Unidades que se harán este mes' : 'Units to be made this month') + ': <span class="cval" id="u1ql"></span></label>' +
          '<input type="range" min="60" max="900" step="10" id="u1q" value="' + state.q + '">' +
        '</div></div>' +
        '<canvas class="iw-canvas" id="u1cv"></canvas>' +
        '<div class="dlist" id="u1steps"></div>' +
        '<div class="metrics">' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Costo de cada unidad ahora' : 'Cost of each unit now') + '</div><div class="mnum cs" id="u1ac"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Volumen de costo unitario mínimo' : 'Volume with the lowest unit cost') + '</div><div class="mnum ps" id="u1qs"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Ese costo unitario mínimo' : 'That lowest unit cost') + '</div><div class="mnum ts" id="u1min"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Costo fijo repartido por unidad' : 'Fixed cost shared out per unit') + '</div><div class="mnum ts" id="u1fs"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Sobrecosto por unidad al ritmo actual' : 'Premium per unit at this pace') + '</div><div class="mnum ts" id="u1cg"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Lo que cuesta la unidad siguiente' : 'What the next unit costs') + '</div><div class="mnum cs" id="u1mc"></div></div>' +
        '</div>' +
        '<div class="iw-read" id="u1read"></div>' +
      '</div>';
    host.querySelectorAll('.mtab').forEach(function(b) {
      b.addEventListener('click', function() {
        state.view = b.getAttribute('data-m');
        host.querySelectorAll('.mtab').forEach(function(x) { x.classList.remove('active'); });
        b.classList.add('active');
        update();
      });
    });
    host.querySelector('#u1F').addEventListener('input', function() { state.F = parseInt(this.value, 10); update(); });
    host.querySelector('#u1v').addEventListener('input', function() { state.v = parseInt(this.value, 10); update(); });
    host.querySelector('#u1w').addEventListener('input', function() { state.w = parseInt(this.value, 10); update(); });
    host.querySelector('#u1q').addEventListener('input', function() { state.q = parseInt(this.value, 10); update(); });
    update();
  }
  function update() {
    var es = LANG === 'es';
    var F = state.F, v = state.v, w = state.w, q = state.q;
    var qs  = optVolume(F, w);
    var acq = unitCost(F, v, w, q);
    var acm = minUnitCost(F, v, w);
    host.querySelector('#u1Fl').textContent = money(F);
    host.querySelector('#u1vl').textContent = money(v);
    host.querySelector('#u1wl').textContent = money(w) + (es ? ' por unidad adicional' : ' per extra unit');
    host.querySelector('#u1ql').textContent = es ? unitsEs(q) : unitsEn(q);
    host.querySelector('#u1ac').textContent  = money2(acq);
    host.querySelector('#u1qs').textContent  = es ? unitsEs(Math.round(qs)) : unitsEn(Math.round(qs));
    host.querySelector('#u1min').textContent = money2(acm);
    host.querySelector('#u1fs').textContent  = money2(fixedShare(F, q));
    host.querySelector('#u1cg').textContent  = money2(w * q);
    host.querySelector('#u1mc').textContent  = money2(marginalCost(v, w, q));
    host.querySelector('#u1steps').textContent = es
      ? 'A ' + unitsEs(q) + ' el costo fijo se reparte en ' + money2(fixedShare(F, q)) + ' por unidad  ·  ' +
        'el sobrecosto por apretar el taller pone ' + money2(w * q) + ' más  ·  ' +
        'con el costo variable base de ' + money(v) + ' cada unidad sale en ' + money2(acq) + '  ·  ' +
        'el mínimo posible es ' + money2(acm) + ' y se alcanza en ' + unitsEs(Math.round(qs))
      : 'At ' + unitsEn(q) + ' the fixed cost is shared out at ' + money2(fixedShare(F, q)) + ' a unit  ·  ' +
        'the premium for pushing the workshop adds ' + money2(w * q) + ' more  ·  ' +
        'with the base variable cost of ' + money(v) + ' each unit comes to ' + money2(acq) + '  ·  ' +
        'the lowest possible is ' + money2(acm) + ' and it is reached at ' + unitsEn(Math.round(qs));
    var g = fitCanvas(host.querySelector('#u1cv'), 185);
    if (state.view === 'unit') {
      drawCurveChart(g, 60, 900, [
        { f: function(x) { return unitCost(F, v, w, x); }, kind: 'green', label: (es ? 'Costo por unidad' : 'Cost per unit') },
        { f: function(x) { return fixedShare(F, x); }, kind: 'soft', label: (es ? 'Fijo repartido' : 'Fixed shared out') },
        { f: function(x) { return w * x; }, kind: 'gold', label: (es ? 'Sobrecosto' : 'Premium') }
      ], {
        at: q, yFloor: 0, fmtY: function(y) { return money(y); }, fmtX: function(x) { return intN(x); },
        marks: (qs >= 60 && qs <= 900) ? [{ x: qs, y: acm, label: money(acm), kind: 'bad' }] : [],
        xLabel: (es ? 'unidades del mes' : 'units in the month')
      });
    } else {
      drawCurveChart(g, 60, 900, [
        { f: function(x) { return totalCost(F, v, w, x); }, kind: 'green', label: (es ? 'Costo total' : 'Total cost') },
        { f: function() { return F; }, kind: 'soft', label: (es ? 'Parte fija' : 'Fixed part') }
      ], {
        at: q, yFloor: 0, fmtY: function(y) { return money(y); }, fmtX: function(x) { return intN(x); },
        marks: (qs >= 60 && qs <= 900) ? [{ x: qs, y: totalCost(F, v, w, qs), label: (es ? 'costo unitario mínimo' : 'lowest unit cost'), kind: 'bad' }] : [],
        xLabel: (es ? 'unidades del mes' : 'units in the month')
      });
    }

        (Math.abs(q - qs) < 15

          : (q < qs

            : 'Como el taller trabaja por encima de ese punto, el tiempo extra ya pesa más que el ahorro de repartir el fijo: producir más encarece cada unidad, y aceptar todavía más pedidos al mismo precio reduce el margen en vez de aumentarlo.')) +
        ' Conviene fijarse en dos cosas que esta herramienta deja ver y que la intuición suele negar. La primera es que el volumen de costo unitario mínimo no depende del costo variable base: mueve ese control y la curva sube o baja entera sin que el fondo se recorra de lugar. La segunda es que en el fondo de la curva el costo de la unidad siguiente y el costo promedio coinciden, que es la forma exacta de saber que ya no queda nada por ganar moviendo el volumen.'
      : '<strong>Business reading:</strong> with a fixed cost of ' + money(F) + ' a month, the company currently makes ' + unitsEn(q) + ' and each one costs ' + money2(acq) + '. The lowest unit cost this workshop can reach is ' + money2(acm) + ', and it comes from making ' + unitsEn(Math.round(qs)) + '. ' +
        (Math.abs(q - qs) < 15
          ? 'The workshop is practically at its best point, so any move in volume, up or down, will make each unit dearer.'
          : (q < qs
            ? 'Since the workshop is running below that point, there is fixed cost left unshared: raising volume makes each unit cheaper, and that is the financial reason to chase more orders even when the price does not change.'
            : 'Since the workshop is running above that point, overtime already outweighs the saving from sharing the fixed cost: making more raises the cost of every unit, and taking on still more orders at the same price shrinks the margin rather than growing it.')) +
        ' Two things this tool shows that intuition usually denies are worth noting. The first is that the volume with the lowest unit cost does not depend on the base variable cost: move that control and the whole curve rises or falls without the bottom shifting sideways. The second is that at the bottom of the curve the cost of the next unit and the average cost are the same figure, which is the exact way to know there is nothing left to gain by moving the volume.';
  }
  widgets.push(mount);
  mount();
}

/* ════════════════════════════════════════════════════════════════════════

function widgetMakeBuy(p0, F0, v0, q0) {

        '<div class="iw-head"><span class="iw-tag">' + (es ? 'Herramienta' : 'Tool') + '</span>' +
        '<span class="iw-title">' + (es ? 'Comprar afuera o producir adentro' : 'Buy outside or make inside') + '</span></div>' +
        '<div class="iw-sub">' + (es
          ? 'Dos rectas cuentan la misma decisión. La dorada es comprarle a un proveedor: arranca en cero, porque quien no compra nada no paga nada, y sube rápido porque cada pieza se paga completa. La verde es producir adentro: arranca alta, porque la renta y el sueldo del supervisor se pagan aunque no se produzca una sola pieza, y sube despacio porque cada pieza cuesta menos. Al arrancar en distinto lugar y subir a distinto ritmo, las dos rectas se cruzan una sola vez, y ese cruce es el volumen de indiferencia: por debajo conviene comprar y por encima conviene producir. Mueve el volumen con el último control y verás el veredicto cambiar en el instante exacto en que la línea roja pasa el cruce. Prueba después a subir la renta del taller y observa cómo el cruce se recorre hacia la derecha: cuanto más pesado es el compromiso fijo, más volumen hace falta para justificarlo. La segunda vista muestra lo mismo por unidad, y ahí se aprecia que la recta dorada es plana, porque al proveedor le da igual el volumen, mientras que la verde cae sin parar sin llegar nunca a tocar el costo variable.'
          : 'Two straight lines tell the same decision. The gold one is buying from a supplier: it starts at zero, because a company that buys nothing pays nothing, and it climbs fast because every piece is paid for in full. The green one is making the part in house: it starts high, because the rent and the supervisor salary are paid even if not a single piece is made, and it climbs slowly because each piece costs less. Starting in different places and climbing at different speeds, the two lines cross exactly once, and that crossing is the indifference volume: below it buying is cheaper and above it making is cheaper. Move the volume with the last control and watch the verdict change at the exact moment the red line passes the crossing. Then try raising the workshop rent and watch the crossing slide to the right: the heavier the fixed commitment, the more volume is needed to justify it. The second view shows the same thing per unit, where the gold line is flat, because the supplier does not care about volume, while the green one falls without ever quite reaching the variable cost.') + '</div>' +
        '<div class="mtabs">' + tabs + '</div>' +
        '<div class="cgrid"><div class="cg">' +
          '<label>' + (es ? 'Precio del proveedor por pieza' : 'Supplier price per piece') + ': <span class="cval" id="m2pl"></span></label>' +
          '<input type="range" min="120" max="320" step="10" id="m2p" value="' + state.p + '">' +
        '</div><div class="cg">' +
          '<label>' + (es ? 'Costo fijo anual de producir adentro' : 'Annual fixed cost of making inside') + ': <span class="cval" id="m2Fl"></span></label>' +
          '<input type="range" min="40000" max="400000" step="10000" id="m2F" value="' + state.F + '">' +
        '</div></div>' +
        '<div class="cgrid"><div class="cg">' +
          '<label>' + (es ? 'Costo variable propio por pieza' : 'Own variable cost per piece') + ': <span class="cval" id="m2vl"></span></label>' +

        '<canvas class="iw-canvas" id="m2cv"></canvas>' +
        '<div class="dlist" id="m2steps"></div>' +

      ? 'Comprar ' + piecesEs(q) + ' cuesta ' + money(cb) + '  ·  ' +
        'producirlas cuesta ' + money(F) + ' de costo fijo más ' + money(v * q) + ' de costo variable, o sea ' + money(cm) + '  ·  ' +
        'cada pieza producida ahorra ' + money(p - v) + ' frente al proveedor  ·  ' +
        'ese ahorro cubre el costo fijo a partir de ' + (ind === null ? 'ningún volumen' : piecesEs(Math.round(ind)))
      : 'Buying ' + piecesEn(q) + ' costs ' + money(cb) + '  ·  ' +
        'making them costs ' + money(F) + ' of fixed cost plus ' + money(v * q) + ' of variable cost, that is ' + money(cm) + '  ·  ' +
        'each piece made saves ' + money(p - v) + ' against the supplier  ·  ' +
        'that saving covers the fixed cost from ' + (ind === null ? 'no volume at all' : piecesEn(Math.round(ind))) + ' onwards';
    var g = fitCanvas(host.querySelector('#m2cv'), 185);
    if (state.view === 'total') {
      drawCurveChart(g, 200, 4000, [
        { f: function(x) { return buyCost(p, x); }, kind: 'gold', label: (es ? 'Comprar' : 'Buy') },
        { f: function(x) { return makeCost(F, v, x); }, kind: 'green', label: (es ? 'Producir' : 'Make') }
      ], {
        at: q, yFloor: 0, fmtY: function(y) { return money(y); }, fmtX: function(x) { return intN(x); },
        marks: (ind !== null && ind >= 200 && ind <= 4000) ? [{ x: ind, y: buyCost(p, ind), label: intN(ind), kind: 'bad' }] : [],
        xLabel: (es ? 'piezas al año' : 'pieces a year')
      });
    } else {
      drawCurveChart(g, 200, 4000, [
        { f: function() { return p; }, kind: 'gold', label: (es ? 'Comprar' : 'Buy') },
        { f: function(x) { return makeCost(F, v, x) / x; }, kind: 'green', label: (es ? 'Producir' : 'Make') },
        { f: function() { return v; }, kind: 'soft', label: (es ? 'Variable propio' : 'Own variable') }
      ], {
        at: q, yFloor: 0, fmtY: function(y) { return money(y); }, fmtX: function(x) { return intN(x); },
        marks: (ind !== null && ind >= 200 && ind <= 4000) ? [{ x: ind, y: p, label: intN(ind), kind: 'bad' }] : [],
        xLabel: (es ? 'piezas al año' : 'pieces a year')
      });
    }
    host.querySelector('#m2read').innerHTML = es
      ? '<strong>Lectura de negocio:</strong> producir adentro compromete ' + money(F) + ' al año que se pagan haya o no producción, y a cambio baja el costo de cada pieza de ' + money(p) + ' a ' + money(v) + ', es decir ' + money(p - v) + ' de ahorro por pieza. ' +
        (ind === null
          ? 'Con estos números el costo propio por pieza no es menor que el del proveedor, así que el compromiso fijo no se recupera con ningún volumen y comprar es la única opción sensata.'
          : 'Ese ahorro por pieza tiene que cubrir el costo fijo antes de convertirse en ganancia, y eso ocurre a partir de ' + piecesEs(Math.round(ind)) + '. Al volumen actual de ' + piecesEs(q) + ' conviene ' + (dif > 0 ? 'producir, con un ahorro de ' + money(dif) : 'comprar, porque producir costaría ' + money(-dif) + ' más') + '.') +
        ' Antes de llevar esta cuenta a una junta hacen falta dos advertencias. La primera es que el volumen de indiferencia es una frontera, no una recomendación: si la demanda real ronda esa cifra, la decisión es frágil y basta un mal trimestre para que se vuelva equivocada. La segunda es que el costo fijo de producir rara vez desaparece el día que la empresa se arrepiente, mientras que el proveedor se cancela con un correo, y esa diferencia de reversibilidad no aparece en ninguna de las dos rectas.'
      : '<strong>Business reading:</strong> making the part in house commits ' + money(F) + ' a year that is paid whether or not anything is produced, and in exchange it cuts the cost of each piece from ' + money(p) + ' to ' + money(v) + ', a saving of ' + money(p - v) + ' a piece. ' +
        (ind === null
          ? 'With these figures the own cost per piece is not below what the supplier charges, so the fixed commitment is never recovered at any volume and buying is the only sensible option.'
          : 'That saving per piece has to cover the fixed cost before it turns into a gain, and that happens from ' + piecesEn(Math.round(ind)) + ' onwards. At the current volume of ' + piecesEn(q) + ' the right move is to ' + (dif > 0 ? 'make, with a saving of ' + money(dif) : 'buy, because making would cost ' + money(-dif) + ' more') + '.') +

  }
  widgets.push(mount);
  mount();
}

          : 'The first view has three curves and they are best read one at a time. The gold one is what placing orders costs over a year: if the company orders in small lots it has to order many times, so that curve is enormous on the left and collapses as the lot grows. The grey one is what holding stock costs: ordering in big lots fills the warehouse, so that line climbs without stopping. The green one is the sum, which is the only thing the company actually pays, and it is shaped like a bowl. Move the lot control and watch the red line travel across that bowl: to the left ordering dominates, to the right the warehouse dominates, and the bottom sits exactly where the first two curves cross. That crossing is neither an accident nor a numerical coincidence: at the optimum the company spends the same on ordering as on holding. The second view answers a question that is almost always answered wrongly. If demand for the year quadruples, should the company order four times as much? The curve says no, and its shape explains why.') + '</div>' +

        at: Q, yFloor: 0, fmtY: function(y) { return money(y); }, fmtX: function(x) { return intN(x); },
        marks: (qs >= 50 && qs <= 1600) ? [{ x: qs, y: cmin, label: money(cmin), kind: 'bad' }] : [],

    } else {

      ], {
        at: D, yFloor: 0, fmtY: function(y) { return intN(y); }, fmtX: function(x) { return intN(x); },

    }
    host.querySelector('#e3read').innerHTML = es
      ? '<strong>Lectura de negocio:</strong> la empresa necesita ' + unitsEs(D) + ' al año. Pidiendo de ' + unitsEs(Q) + ' en ' + unitsEs(Q) + ' gasta ' + money(cnow) + ' entre pedidos y bodega, mientras que el lote de ' + unitsEs(Math.round(qs)) + ' deja esa cuenta en ' + money(cmin) + ', ' +
        (cnow - cmin < 1 ? 'que es justo donde ya está.' : 'es decir ' + money(cnow - cmin) + ' menos al año sin cambiar de proveedor, sin negociar precio y sin vender una pieza más.') +
        ' En el óptimo la empresa gasta ' + money(cmin / 2) + ' en pedir y otros tantos en guardar, y esa igualdad es la firma del punto mínimo. Vale la pena separar bien las dos cifras que alimentan la cuenta, porque son las que se estiman mal en la práctica. El costo de pedir no es el precio de la mercancía sino el trabajo administrativo de la orden, la recepción y la revisión de la factura, y no cambia porque el pedido sea grande. El costo de guardar tampoco es solo la renta de la bodega: incluye el seguro, la merma y sobre todo el dinero inmovilizado en el inventario, que suele ser la parte más grande y la que casi nadie anota.'
      : '<strong>Business reading:</strong> the company needs ' + unitsEn(D) + ' a year. Ordering ' + unitsEn(Q) + ' at a time it spends ' + money(cnow) + ' between orders and warehouse, while a lot of ' + unitsEn(Math.round(qs)) + ' leaves that bill at ' + money(cmin) + ', ' +
        (cnow - cmin < 1 ? 'which is exactly where it already stands.' : 'that is ' + money(cnow - cmin) + ' less a year without changing supplier, without negotiating a price and without selling one extra piece.') +
        ' At the optimum the company spends ' + money(cmin / 2) + ' on ordering and the same again on holding, and that equality is the signature of the lowest point. It is worth separating the two figures that feed the calculation, because they are the ones estimated badly in practice. The cost of ordering is not the price of the goods but the administrative work of the order, the receiving and the checking of the invoice, and it does not change because the order is large. Nor is the cost of holding just the warehouse rent: it takes in insurance, spoilage and above all the money locked up in the stock, which is usually the largest part and the one almost nobody writes down.';
  }
  widgets.push(mount);
  mount();
}

  var p10dF = p10w * p10q * p10q + p10k;

  /* ═══════════════════════ CONCEPT 1 ═══════════════════════ */
  var c1min  = minUnitCost(c1F, c1v, c1w);
  var c1half = c1q / 2;
  var c1dbl  = c1q * 2;
  var c1ach  = unitCost(c1F, c1v, c1w, c1half);

  var c1tot  = totalCost(c1F, c1v, c1w, c1q);

  addSection(function(L) {
    var es = L === 'es';
    if (es) return '' +
      '<div class="stag">Concepto 1</div>' +
      '<h2>Optimizar un costo no es hacerlo pequeño</h2>' +
      '<p>Conviene empezar desmontando la idea con la que casi todo el mundo llega al tema. Optimizar un costo no significa reducirlo hasta donde se pueda, porque el costo más pequeño que una empresa puede tener es el de no operar, y ese no le sirve a nadie. Un costo se optimiza cuando se le pone en relación con lo que produce, y la forma habitual de hacerlo es preguntar cuánto cuesta cada unidad. Esa pregunta tiene una respuesta que sorprende a quien la ve por primera vez: el costo por unidad no baja indefinidamente conforme la empresa produce más.</p>' +
      '<p>La razón es que dentro de un costo unitario conviven dos fuerzas de signo contrario. La primera es el <strong>costo fijo</strong>, que se paga completo produzca la empresa mucho o poco, y que por lo tanto se reparte cada vez más delgado conforme el volumen crece. La renta del local, el sueldo del supervisor y el seguro no aumentan porque el taller trabaje más, así que cada unidad adicional carga con una porción menor de ellos. Esta fuerza empuja el costo unitario hacia abajo, y es la que todo el mundo tiene presente.</p>' +
      '<p>La segunda fuerza es la que suele olvidarse. El <strong>costo variable por unidad</strong> no se queda quieto: pasado cierto ritmo, el taller necesita tiempo extra, contrata gente con menos experiencia, paga fletes urgentes y sus máquinas empiezan a estorbarse. Cada unidad extra se vuelve más cara que la anterior, y ese encarecimiento no afecta solo a la última unidad sino al costo promedio de toda la corrida. Esta fuerza empuja el costo unitario hacia arriba, y crece justamente cuando la primera se está agotando.</p>' +
      '<p>El resultado es una curva en forma de valle. Mientras el ahorro por repartir el costo fijo pesa más que el encarecimiento por apretar el taller, el costo unitario baja; cuando el segundo supera al primero, sube. Entre las dos etapas hay un volumen exacto donde el costo unitario toca su punto más bajo, y ese es el volumen que optimiza el costo. Ahí ocurre además algo que vale la pena reconocer, porque es la manera de verificar el resultado sin fórmulas: en ese punto lo que cuesta producir <strong>una unidad más</strong> es exactamente igual al costo promedio de todas. Mientras la siguiente unidad cueste menos que el promedio, seguir produciendo abarata; en cuanto cueste más, seguir produciendo encarece.</p>' +
      '<div class="rules-grid">' +
        '<div class="rcard"><div class="rname">Costo total del periodo</div><div class="rform">C = F + v·q + w·q<sup>2</sup></div><div class="rnote">Lo fijo, lo variable y el sobrecosto de apretar.</div></div>' +
        '<div class="rcard"><div class="rname">Costo de cada unidad</div><div class="rform">' + frac('F', 'q') + ' + v + w·q</div><div class="rnote">Una parte baja y la otra sube.</div></div>' +
        '<div class="rcard"><div class="rname">Volumen que lo minimiza</div><div class="rform">q = √( F ÷ w )</div><div class="rnote">Donde las dos partes se igualan.</div></div>' +
        '<div class="rcard"><div class="rname">Señal de que ya llegaste</div><div class="rform">costo de la siguiente = promedio</div><div class="rnote">Sirve para verificar sin derivar.</div></div>' +
      '</div>' +
      '<p><strong>Ejemplo resuelto.</strong> Un taller de muebles en Colima paga ' + money(c1F) + ' al mes de renta, sueldos de planta y seguros, produzca lo que produzca. La madera, los herrajes y la mano de obra directa de cada mesa parten de ' + money(c1v) + ', pero el jefe de producción midió algo más: por cada mesa que se agrega al programa del mes, el costo de mano de obra de <em>todas</em> las mesas sube ' + money(c1w) + ', porque el taller se aprieta y aparece tiempo extra. La pregunta del dueño es cuántas mesas conviene programar.</p>' +
      '<div class="callout"><p><strong>Paso 1.</strong> Si el taller hiciera ' + unitsEs(c1half) + ', el costo fijo se repartiría en ' + money2(fixedShare(c1F, c1half)) + ' por mesa y el sobrecosto sería de apenas ' + money2(c1w * c1half) + ', para un costo unitario de ' + money2(c1ach) + '.<br>' +
      '<strong>Paso 2.</strong> Si en cambio hiciera ' + unitsEs(c1dbl) + ', el costo fijo bajaría a ' + money2(fixedShare(c1F, c1dbl)) + ' por mesa, pero el sobrecosto subiría a ' + money2(c1w * c1dbl) + ', y el costo unitario volvería a ser ' + money2(c1acd) + '. Vale la pena detenerse aquí: el doble y la mitad del volumen dan el mismo costo por mesa, lo cual solo tiene sentido si entre los dos hay un fondo.<br>' +
      '<strong>Paso 3.</strong> Ese fondo está en ' + unitsEs(c1q) + ', donde el costo fijo repartido y el sobrecosto valen lo mismo, ' + money2(c1w * c1q) + ' cada uno, y el costo por mesa llega a su mínimo de ' + money2(c1min) + '. El costo total del mes es entonces ' + money(c1tot) + '.<br>' +
      '<strong>Paso 4.</strong> La verificación sin fórmulas: a ese volumen, producir una mesa más cuesta ' + money2(marginalCost(c1v, c1w, c1q)) + ', que es exactamente el costo promedio. Ni abarata ni encarece, y por eso el taller ya no tiene nada que ganar moviéndose.<br>' +
      '<strong>Lectura de negocio.</strong> El taller debe programar ' + unitsEs(c1q) + ' al mes. Dos consecuencias que el dueño debe tener claras. La primera es que aceptar pedidos por encima de ese volumen al mismo precio reduce el margen en lugar de aumentarlo, aunque la factura crezca. La segunda es que ' + money2(c1min) + ' es el piso de este taller, no del negocio: para bajarlo hay que mover el costo fijo o el sobrecosto por apretar, es decir cambiar el taller, no el programa de producción.</p></div>';
    return '' +
      '<div class="stag">Concept 1</div>' +
      '<h2>Optimising a cost is not the same as making it small</h2>' +
      '<p>It is worth starting by taking apart the idea almost everyone brings to this topic. Optimising a cost does not mean cutting it as far as it will go, because the smallest cost a company can have is the cost of not operating, and that one is no use to anybody. A cost is optimised when it is set against what it produces, and the usual way of doing that is to ask what each unit costs. That question has an answer that surprises anyone meeting it for the first time: cost per unit does not fall forever as the company makes more.</p>' +
      '<p>The reason is that two opposing forces live inside a unit cost. The first is <strong>fixed cost</strong>, paid in full whether the company makes much or little, and therefore shared ever more thinly as volume grows. The rent, the supervisor salary and the insurance do not rise because the workshop works harder, so each extra unit carries a smaller slice of them. This force pushes unit cost down, and it is the one everybody has in mind.</p>' +
      '<p>The second force is the one usually forgotten. <strong>Variable cost per unit</strong> does not stay still: past a certain pace the workshop needs overtime, hires less experienced people, pays for rush freight and its machines start getting in each other way. Every extra unit becomes dearer than the one before, and that increase does not fall on the last unit alone but on the average cost of the whole run. This force pushes unit cost up, and it grows precisely as the first one is running out.</p>' +
      '<p>The result is a curve shaped like a valley. While the saving from sharing the fixed cost outweighs the premium for pushing the workshop, unit cost falls; once the second beats the first, it rises. Between the two stages sits one exact volume where unit cost touches its lowest point, and that is the volume that optimises the cost. Something else happens there that is worth recognising, because it is how the result can be checked without formulas: at that point what it costs to make <strong>one more unit</strong> is exactly equal to the average cost of all of them. While the next unit costs less than the average, carrying on makes things cheaper; the moment it costs more, carrying on makes them dearer.</p>' +
      '<div class="rules-grid">' +
        '<div class="rcard"><div class="rname">Total cost for the period</div><div class="rform">C = F + v·q + w·q<sup>2</sup></div><div class="rnote">The fixed, the variable and the premium.</div></div>' +
        '<div class="rcard"><div class="rname">Cost of each unit</div><div class="rform">' + frac('F', 'q') + ' + v + w·q</div><div class="rnote">One part falls and the other rises.</div></div>' +
        '<div class="rcard"><div class="rname">Volume that minimises it</div><div class="rform">q = √( F ÷ w )</div><div class="rnote">Where the two parts come level.</div></div>' +
        '<div class="rcard"><div class="rname">Sign that you have arrived</div><div class="rform">cost of the next = average</div><div class="rnote">A check that needs no calculus.</div></div>' +
      '</div>' +
      '<p><strong>Worked example.</strong> A furniture workshop in Colima pays ' + money(c1F) + ' a month in rent, permanent wages and insurance, whatever it makes. The timber, fittings and direct labour of each table start at ' + money(c1v) + ', but the production manager measured something more: for every table added to the schedule for the month, the labour cost of <em>all</em> the tables rises by ' + money(c1w) + ', because the workshop tightens up and overtime appears. What the owner wants to know is how many tables to schedule.</p>' +
      '<div class="callout"><p><strong>Step 1.</strong> If the workshop made ' + unitsEn(c1half) + ', the fixed cost would be shared out at ' + money2(fixedShare(c1F, c1half)) + ' a table and the premium would be only ' + money2(c1w * c1half) + ', for a unit cost of ' + money2(c1ach) + '.<br>' +
      '<strong>Step 2.</strong> If it made ' + unitsEn(c1dbl) + ' instead, the fixed cost would drop to ' + money2(fixedShare(c1F, c1dbl)) + ' a table, but the premium would climb to ' + money2(c1w * c1dbl) + ', and the unit cost would be ' + money2(c1acd) + ' again. It is worth pausing here: double and half the volume give the same cost per table, which only makes sense if there is a bottom between them.<br>' +
      '<strong>Step 3.</strong> That bottom sits at ' + unitsEn(c1q) + ', where the shared fixed cost and the premium are worth the same, ' + money2(c1w * c1q) + ' each, and the cost per table reaches its lowest point of ' + money2(c1min) + '. Total cost for the month is then ' + money(c1tot) + '.<br>' +
      '<strong>Step 4.</strong> The check that needs no formula: at that volume, making one more table costs ' + money2(marginalCost(c1v, c1w, c1q)) + ', which is exactly the average cost. It neither lowers nor raises it, and that is why the workshop has nothing left to gain by moving.<br>' +
      '<strong>Business reading.</strong> The workshop should schedule ' + unitsEn(c1q) + ' a month. Two consequences the owner needs to be clear about. The first is that taking orders above that volume at the same price shrinks the margin rather than growing it, even though the invoice gets bigger. The second is that ' + money2(c1min) + ' is the floor of this workshop and not of the business: lowering it means moving the fixed cost or the premium for pushing, which means changing the workshop rather than the production schedule.</p></div>';

        en: 'A chair factory in Villa de Álvarez pays ' + money(p1F) + ' a month in rent, office wages and insurance, whatever it makes. The materials and direct labour of each chair start at ' + money(p1v) + '. The plant manager also confirmed that for every chair added to the schedule for the month, the labour cost of all the chairs in the run rises by ' + money(p1w) + ', because overtime appears and temporary staff are hired. Management wants to set the monthly schedule so that each chair comes out as cheap as possible. How many chairs should be scheduled?' },
    opts: { es: o1.es, en: o1.en },

  var o2 = shuffleOpts(
    ['Que la afirmación es falsa a partir de cierto volumen, porque el ahorro de repartir el costo fijo se va agotando mientras el sobrecosto de apretar la planta crece, y en cuanto el segundo supera al primero cada unidad adicional encarece a todas las demás.',

  var q2i = {
    title: { es: 'La regla del gerente de producción', en: 'The rule the production manager lives by' },
    q: { es: 'En la junta mensual de una planta de alimentos en Tecomán, el gerente de producción defiende una regla que aplica desde hace años: mientras haya materia prima, siempre conviene producir el máximo posible, porque así el costo fijo se reparte entre más unidades y el costo unitario baja. El área financiera revisó los últimos doce meses y encontró que los meses de mayor producción no fueron los de menor costo por unidad, sino que el costo por unidad primero bajó y después volvió a subir. ¿Qué debe concluir el comité sobre la regla del gerente?',
        en: 'At the monthly meeting of a food plant in Tecomán, the production manager defends a rule he has applied for years: as long as there is raw material, it always pays to produce the maximum possible, because that way the fixed cost is shared among more units and unit cost falls. The finance team reviewed the last twelve months and found that the months of highest output were not the months of lowest cost per unit; instead cost per unit first fell and then rose again. What should the committee conclude about the rule?' },
    opts: { es: o2.es, en: o2.en },
    hint: { es: 'La regla del gerente solo mira una de las dos fuerzas que forman el costo unitario. Pregúntate qué le pasa a la otra cuando la planta trabaja al límite: turnos extra, personal eventual, mantenimiento aplazado. Fíjate además en que los datos financieros ya describen la forma de la curva, así que la respuesta tiene que ser compatible con lo que se observó.',

    exp: { es: 'Lo que el área financiera observó es la forma normal de un costo unitario: baja mientras el reparto del costo fijo manda y sube cuando el sobrecosto de apretar la planta toma el control. La regla del gerente sería correcta si el costo variable por unidad fuera constante, pero deja de serlo en cuanto aparecen tiempo extra, personal sin experiencia y fletes urgentes, y ese encarecimiento no se queda en la última unidad sino que sube el promedio de toda la corrida. La opción que da por buena la regla ignora precisamente esa segunda fuerza. La que apela a la capacidad instalada confunde un tope físico con un punto económico: el costo por unidad empieza a subir mucho antes de que la planta se llene, en cuanto producir una unidad más cuesta más que el promedio. Y la que pide el precio de venta cambia de pregunta: el precio determina si conviene vender, no cuál es el volumen que hace mínimo el costo unitario.',

  addSection(function(L) {
