                 'Se forman 48 g de óxido de magnesio, porque solo el metal permanece como sólido al final.'],
             en:['80 g of magnesium oxide form, because the total mass does not change even though energy is released.',
                 '80 g of magnesium oxide form and besides the total mass increases because of the heat released.',
                 'Less than 80 g form, because part of the mass turned into the heat released.',
                 '48 g of magnesium oxide form, because only the metal stays as a solid at the end.'] },
      ci:0,
      hint:{ es:'El recipiente está sellado y el único producto es el óxido, así que toda la materia que entró tiene que seguir ahí bajo esa forma. El calor no se pesa.',
             en:'The container is sealed and the only product is the oxide, so all the matter that went in has to still be there in that form. Heat is not weighed.' },
      exp:{ es:'Los 48 g de metal y los 32 g de gas suman 80 g, y en un recipiente sellado esa masa no puede cambiar: los 80 g quedan como óxido de magnesio. La energía que calentó el recipiente venía de las uniones químicas y no le resta ni le suma gramos a la balanza.',
            en:'The 48 g of metal and the 32 g of gas add up to 80 g, and in a sealed container that mass cannot change: the 80 g stay as magnesium oxide. The energy that heated the container came from the chemical joins and it neither subtracts nor adds grams on the scale.' } }
  ]);
}

/* ══════════════════════════════════════════════════════════════════════════
   BUILD LESSON - concepto, manipulativo, problema, en ese orden y repetido
   ══════════════════════════════════════════════════════════════════════════ */
function buildLesson(rng){
  injectGuideCSS();

  sec(
    L({ es:'Punto de partida', en:'Starting point' }),
    L({ es:'Una receta larga o cuatro símbolos', en:'A long recipe or four symbols' }),
    '<p>' + L({
      es:'Describir con palabras lo que pasa cuando el gas de la estufa arde toma varias líneas: hay que decir qué había, qué se necesitó del aire, qué quedó y en qué estado. La química hace lo mismo en una sola renglón, con fórmulas, una flecha y unos cuantos números. Esa escritura corta se llama ecuación química y no es un adorno: obliga a decir exactamente cuántos átomos de cada elemento entran y cuántos salen.',
      en:'Describing in words what happens when the stove gas burns takes several lines: you have to say what was there, what was needed from the air, what was left and in what state. Chemistry does the same in a single line, with formulas, an arrow and a few numbers. That short writing is called a chemical equation and it is not decoration: it forces you to say exactly how many atoms of each element go in and how many come out.'
    }) + '</p>' +
    '<p>' + L({
      es:'En esta guía vas a traducir escenas de la vida diaria a ecuaciones, vas a distinguir los dos tipos de números que aparecen en ellas, vas a ajustar ecuaciones sin inventar ni destruir un solo átomo, vas a comprobar con una balanza que la masa total no cambia y vas a escribir la energía del lado que le corresponde según la reacción caliente o enfríe lo que tiene cerca.',
      en:'In this guide you will translate everyday scenes into equations, tell apart the two kinds of numbers that appear in them, balance equations without inventing or destroying a single atom, check with a balance that the total mass does not change, and write the energy on the side it belongs to depending on whether the reaction heats or cools what is near it.'
    }) + '</p>' +
    '<div class="gw-lbl">' + L({ es:'Lo que vas a poder hacer', en:'What you will be able to do' }) + '</div>' +
    '<div>' +
      '<span class="gw-chip">' + L({ es:'reactivos y productos', en:'reactants and products' }) + '</span>' +
      '<span class="gw-chip">' + L({ es:'escribir la ecuación', en:'writing the equation' }) + '</span>' +
      '<span class="gw-chip">' + L({ es:'subíndice y coeficiente', en:'subscript and coefficient' }) + '</span>' +
      '<span class="gw-chip">' + L({ es:'conteo de átomos', en:'atom count' }) + '</span>' +
      '<span class="gw-chip">' + L({ es:'ajustar por tanteo', en:'balancing by trial' }) + '</span>' +
      '<span class="gw-chip">' + L({ es:'conservación de la masa', en:'conservation of mass' }) + '</span>' +
      '<span class="gw-chip">' + L({ es:'recipiente abierto o cerrado', en:'open or closed container' }) + '</span>' +
      '<span class="gw-chip">' + L({ es:'energía en la ecuación', en:'energy in the equation' }) + '</span>' +
    '</div>'
  );

  /* ══ CONCEPTO 1 ══ */
  var s1 = sec(
    L({ es:'Concepto 1', en:'Concept 1' }),
    L({ es:'Qué dice cada parte de una ecuación química', en:'What each part of a chemical equation says' }),
    '<p>' + L({
      es:'Una ecuación química tiene tres zonas. A la izquierda van los reactivos, que son las sustancias que ya existían antes del cambio. A la derecha van los productos, que son las que aparecen durante el cambio. Entre ambas hay una flecha que no significa igual, sino se transforma en, y por eso se lee siempre en un solo sentido. Cada sustancia se escribe con su fórmula, y muchas veces lleva a un lado una letra entre paréntesis que indica en qué estado participa: sólido, líquido, gas o disuelto en agua.',
      en:'A chemical equation has three zones. On the left go the reactants, the substances that already existed before the change. On the right go the products, the ones that appear during the change. Between them there is an arrow that does not mean equals, but turns into, and that is why it is always read in one direction. Each substance is written with its formula, and it often carries a letter in brackets beside it showing in which state it takes part: solid, liquid, gas or dissolved in water.'
    }) + '</p>' +
    '<p>' + L({
      es:'Colocar bien las sustancias es la primera decisión, y no siempre es obvia. El oxígeno del aire es un reactivo aunque nadie lo haya puesto a propósito, y un gas que se escapa sigue siendo un producto aunque ya no se vea. La prueba es sencilla: si podías tener esa sustancia en las manos antes de que empezara el cambio, va a la izquierda; si solo apareció durante el cambio, va a la derecha.',
      en:'Placing the substances correctly is the first decision, and it is not always obvious. The oxygen of the air is a reactant even if nobody put it there on purpose, and a gas that escapes is still a product even if it can no longer be seen. The test is simple: if you could hold that substance in your hands before the change started, it goes on the left; if it only appeared during the change, it goes on the right.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Reactivos', en:'Reactants' }), L({ es:'lado izquierdo', en:'left side' }), L({ es:'lo que ya existía antes de que empezara el cambio', en:'what already existed before the change started' })) +
      rcard(L({ es:'Flecha', en:'Arrow' }), L({ es:'se transforma en', en:'turns into' }), L({ es:'marca el sentido del cambio y no es un signo de igual', en:'it marks the direction of the change and is not an equals sign' })) +
      rcard(L({ es:'Productos', en:'Products' }), L({ es:'lado derecho', en:'right side' }), L({ es:'lo que aparece mientras ocurre la reacción', en:'what appears while the reaction happens' })) +
      rcard(L({ es:'Estado', en:'State' }), L({ es:'letra entre paréntesis', en:'letter in brackets' }), L({ es:'sólido, líquido, gas o disuelto en agua', en:'solid, liquid, gas or dissolved in water' })) +
    '</div>'
  );
  wArmar(rng, widgetHost(s1, 'wArmar', 'armar'));
  addProblem(rng, mkP1(rng));
  addProblem(rng, mkP2(rng));

  /* ══ CONCEPTO 2 ══ */
  var s2 = sec(
    L({ es:'Concepto 2', en:'Concept 2' }),
    L({ es:'Dos números que parecen iguales y no lo son', en:'Two numbers that look alike and are not' }),
    '<p>' + L({
      es:'Dentro de una ecuación hay dos clases de números. El pequeño que va abajo, pegado a un símbolo, se llama subíndice y dice cuántos átomos de ese elemento forman una sola unidad de la sustancia. El grande que va adelante de toda la fórmula se llama coeficiente y dice cuántas unidades iguales de esa sustancia participan. Cambiar el pequeño convierte la sustancia en otra distinta; cambiar el grande solo cuenta repeticiones.',
      en:'Inside an equation there are two kinds of numbers. The small one below, stuck to a symbol, is called a subscript and it says how many atoms of that element make up one single unit of the substance. The large one in front of the whole formula is called a coefficient and it says how many identical units of that substance take part. Changing the small one turns the substance into a different one; changing the large one only counts repetitions.'
    }) + '</p>' +
    '<p>' + L({
      es:'De ahí sale la manera de contar átomos en un término: el coeficiente multiplica a todos los subíndices que le siguen. En 3 ' + fm('H2O') + ' hay tres unidades de agua, y cada una trae dos hidrógenos y un oxígeno, así que en total hay seis hidrógenos y tres oxígenos. Ese conteo es la herramienta con la que después se decide si una ecuación está bien escrita o no.',
      en:'From that comes the way to count atoms in a term: the coefficient multiplies every subscript that follows it. In 3 ' + fm('H2O') + ' there are three units of water, and each one brings two hydrogens and one oxygen, so in total there are six hydrogens and three oxygens. That count is the tool that later decides whether an equation is properly written or not.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Subíndice', en:'Subscript' }), L({ es:'número pequeño abajo', en:'small number below' }), L({ es:'define de qué está hecha una unidad de la sustancia', en:'it defines what one unit of the substance is made of' })) +
      rcard(L({ es:'Coeficiente', en:'Coefficient' }), L({ es:'número grande adelante', en:'large number in front' }), L({ es:'cuenta unidades iguales y multiplica toda la fórmula', en:'it counts identical units and multiplies the whole formula' })) +
      rcard(L({ es:'Contar átomos', en:'Counting atoms' }), L({ es:'uno multiplica al otro', en:'one multiplies the other' }), L({ es:'el número de adelante por el de abajo, elemento por elemento', en:'the number in front times the one below, element by element' })) +
      rcard(L({ es:'Ojo', en:'Careful' }), L({ es:'agua y agua oxigenada', en:'water and peroxide' }), L({ es:'se distinguen por un solo número pequeño y no son lo mismo', en:'they differ by a single small number and are not the same' })) +
    '</div>'
  );
  wMultiplicador(rng, widgetHost(s2, 'wMult', 'conteo'));
  addProblem(rng, mkP3(rng));
  addProblem(rng, mkP4(rng));

  /* ══ CONCEPTO 3 ══ */
  var s3 = sec(
    L({ es:'Concepto 3', en:'Concept 3' }),
    L({ es:'Ajustar una ecuación sin inventar átomos', en:'Balancing an equation without inventing atoms' }),
    '<p>' + L({
      es:'Una ecuación está ajustada cuando cada elemento aparece la misma cantidad de veces de los dos lados de la flecha. Como los átomos no se crean ni se destruyen, esa condición no es un capricho: es la única manera de que la ecuación describa algo que de verdad pueda ocurrir. Y solo hay una herramienta permitida para lograrlo, los coeficientes, porque las fórmulas son un dato del experimento y no se pueden retocar.',
      en:'An equation is balanced when each element appears the same number of times on both sides of the arrow. Since atoms are neither created nor destroyed, that condition is not a whim: it is the only way for the equation to describe something that could really happen. And there is only one allowed tool to achieve it, the coefficients, because the formulas are a fact of the experiment and cannot be retouched.'
    }) + '</p>' +
    '<p>' + L({
      es:'El método más usado es el tanteo ordenado. Conviene empezar por el elemento que aparece en menos fórmulas, seguir con los metales, dejar el hidrógeno y el oxígeno para el final porque suelen estar repartidos en varias sustancias, y volver a contar todo cada vez que se mueve un número. Al terminar se revisa que los coeficientes sean los más pequeños posibles: si todos se pueden dividir entre el mismo número, la ecuación todavía se puede simplificar.',
      en:'The most used method is orderly trial. It helps to start with the element that appears in the fewest formulas, continue with the metals, leave hydrogen and oxygen for the end because they are usually spread over several substances, and recount everything each time a number is moved. At the end you check that the coefficients are the smallest possible: if they can all be divided by the same number, the equation can still be simplified.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Regla única', en:'Single rule' }), L({ es:'solo coeficientes', en:'coefficients only' }), L({ es:'los números pequeños de las fórmulas nunca se tocan', en:'the small numbers of the formulas are never touched' })) +
      rcard(L({ es:'Por dónde empezar', en:'Where to start' }), L({ es:'lo menos repartido', en:'the least spread out' }), L({ es:'el elemento que aparece en menos fórmulas', en:'the element that appears in the fewest formulas' })) +
      rcard(L({ es:'Para el final', en:'For the end' }), L({ es:'hidrógeno y oxígeno', en:'hydrogen and oxygen' }), L({ es:'suelen estar repartidos en varias sustancias a la vez', en:'they are usually spread over several substances at once' })) +
      rcard(L({ es:'Revisión', en:'Check' }), L({ es:'números mínimos', en:'smallest numbers' }), L({ es:'si todos se dividen entre lo mismo, aún se simplifica', en:'if they all divide by the same, it still simplifies' })) +
    '</div>'
  );
  wMesaAjuste(rng, widgetHost(s3, 'wMesa', 'balance'));
  addProblem(rng, mkP5(rng));
  addProblem(rng, mkP6(rng));

  /* ══ CONCEPTO 4 ══ */
  var s4 = sec(
    L({ es:'Concepto 4', en:'Concept 4' }),
    L({ es:'La ley de la conservación de la materia', en:'The law of conservation of matter' }),
    '<p>' + L({
      es:'Cuando una reacción ocurre en un recipiente cerrado y se pesa todo antes y después, la masa total resulta idéntica. Esa regularidad se conoce como ley de la conservación de la materia y explica por qué una ecuación tiene que quedar ajustada: los mismos átomos que había al principio están al final, solo que unidos de otra manera. Si no se pierde ningún átomo, tampoco se pierde masa.',
      en:'When a reaction happens in a closed container and everything is weighed before and after, the total mass turns out identical. That regularity is known as the law of conservation of matter and it explains why an equation has to end up balanced: the same atoms that were there at the start are there at the end, only joined in another way. If no atom is lost, no mass is lost either.'
    }) + '</p>' +
    '<p>' + L({
      es:'La ley parece fallar cuando el recipiente está abierto, y ahí está la trampa. La leña que arde deja cenizas más ligeras porque una parte de los productos se fue al aire como gas; el clavo que se oxida gana masa porque incorpora oxígeno que estaba en el aire. En los dos casos la cuenta cierra si se pesa todo lo que entra y todo lo que sale, gases incluidos. La balanza no miente: solo pesa lo que está sobre ella.',
      en:'The law seems to fail when the container is open, and that is where the trap lies. Firewood that burns leaves lighter ashes because part of the products went into the air as gas; the nail that rusts gains mass because it takes in oxygen that was in the air. In both cases the accounting closes if everything that goes in and everything that comes out is weighed, gases included. The scale does not lie: it only weighs what is on it.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Recipiente cerrado', en:'Closed container' }), L({ es:'masa constante', en:'constant mass' }), L({ es:'lo que pesaba antes pesa igual al terminar', en:'what it weighed before weighs the same at the end' })) +
      rcard(L({ es:'Recipiente abierto', en:'Open container' }), L({ es:'gases que escapan', en:'gases that escape' }), L({ es:'la balanza marca menos, pero nada se destruyó', en:'the scale reads less, but nothing was destroyed' })) +
      rcard(L({ es:'Oxidación al aire', en:'Rusting in air' }), L({ es:'masa que aumenta', en:'mass that increases' }), L({ es:'el sólido incorpora oxígeno que estaba en el aire', en:'the solid takes in oxygen that was in the air' })) +
      rcard(L({ es:'Ecuación ajustada', en:'Balanced equation' }), L({ es:'la ley por escrito', en:'the law in writing' }), L({ es:'la misma cuenta de cada elemento de los dos lados', en:'the same count of each element on both sides' })) +
    '</div>'
  );
  wLavoisier(rng, widgetHost(s4, 'wLav', 'masa'));
  addProblem(rng, mkP7(rng));
  addProblem(rng, mkP8(rng));

  /* ══ CONCEPTO 5 ══ */
  var s5 = sec(
    L({ es:'Concepto 5', en:'Concept 5' }),
    L({ es:'La energía también se escribe en la ecuación', en:'Energy is written in the equation too' }),
    '<p>' + L({
      es:'Junto con la materia, en toda reacción se mueve energía. Romper las uniones de los reactivos cuesta energía y formar las de los productos la libera, y el balance entre esas dos cantidades decide el sentido del intercambio. Si sobra, sale hacia el entorno y todo lo cercano se calienta: la reacción es exotérmica y la energía se escribe junto a los productos. Si falta, la reacción la toma de fuera y el entorno se enfría: es endotérmica y la energía se escribe junto a los reactivos.',
      en:'Along with matter, energy moves in every reaction. Breaking the joins of the reactants costs energy and forming those of the products releases it, and the balance between those two amounts decides the direction of the exchange. If there is a surplus, it goes out to the surroundings and everything nearby heats up: the reaction is exothermic and the energy is written next to the products. If there is a shortfall, the reaction takes it from outside and the surroundings cool down: it is endothermic and the energy is written next to the reactants.'
    }) + '</p>' +
    '<p>' + L({
      es:'Ese intercambio es lo que se aprovecha todos los días. La cocina, el transporte y la calefacción funcionan con reacciones que entregan energía; las compresas frías, la cocción de los alimentos y la fotosíntesis funcionan con reacciones que la necesitan. Y la energía tampoco se crea ni se destruye: solo pasa de las uniones químicas al entorno, o del entorno a las uniones químicas, sin quitarle ni agregarle un gramo a la balanza.',
      en:'That exchange is what gets used every day. Cooking, transport and heating run on reactions that hand energy over; cold packs, the cooking of food and photosynthesis run on reactions that need it. And energy is not created or destroyed either: it only passes from the chemical joins to the surroundings, or from the surroundings to the chemical joins, without taking or adding a single gram on the scale.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Exotérmica', en:'Exothermic' }), L({ es:'energía con los productos', en:'energy with the products' }), L({ es:'el entorno se calienta: combustión, cal viva con agua', en:'the surroundings heat up: burning, quicklime with water' })) +
      rcard(L({ es:'Endotérmica', en:'Endothermic' }), L({ es:'energía con los reactivos', en:'energy with the reactants' }), L({ es:'el entorno se enfría: compresas frías, fotosíntesis', en:'the surroundings cool down: cold packs, photosynthesis' })) +
      rcard(L({ es:'Dónde se guarda', en:'Where it is stored' }), L({ es:'en las uniones', en:'in the joins' }), L({ es:'romperlas cuesta energía y formarlas la libera', en:'breaking them costs energy and forming them releases it' })) +
      rcard(L({ es:'En la balanza', en:'On the scale' }), L({ es:'no pesa', en:'it does not weigh' }), L({ es:'el calor entra y sale sin cambiar la masa total', en:'heat comes and goes without changing the total mass' })) +
    '</div>'
  );
  wEnergia(rng, widgetHost(s5, 'wEner', 'energia'));
  addProblem(rng, mkP9(rng));

  /* ══ CIERRE ══ */
  wCuaderno(rng, widgetHost(null, 'wCuad', 'reflect'));
  addProblem(rng, mkP10(rng));
}
</script>

<!-- LIAXA ANALYTICS -->
<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbykkuJ_apGq3vALIFd4mr3acu81c7K4OKxW-DZ-i52Ceyl3lOanXMdvbS9SIXPrLQBm/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'Ecuaciones Químicas y Ley de Conservación de la Materia';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
