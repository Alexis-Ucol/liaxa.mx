/* ══════════════════════════════════════════════════════════════════════════
   buildLesson
   ══════════════════════════════════════════════════════════════════════════ */
function buildLesson(rng){
  injectGuideCSS();

  /* ── Apertura ── */
  sec(
    L({ es:'Punto de partida', en:'Starting point' }),
    L({ es:'Nadie vive solo en un ecosistema', en:'Nobody lives alone in an ecosystem' }),
    '<p>' + L({
      es:'En el patio de tu escuela hay más vida de la que parece. Las hierbas que salen entre las baldosas se estiran hacia el mismo pedazo de sol; las hormigas y los pájaros buscan las mismas migas; el árbol del fondo da fruto solo si algún insecto pasó antes por sus flores. Ninguno de esos seres vivos decide lo que hace el otro y, sin embargo, lo que le pasa a uno se nota en los demás.',
      en:'There is more life in your school yard than it looks. The weeds coming up between the tiles stretch towards the same patch of sun; ants and birds go after the same crumbs; the tree at the back only bears fruit if some insect passed by its flowers first. None of those living things decides what the other does and yet what happens to one shows up in the rest.'
    }) + '</p>' +
    '<div class="callout"><p><strong>' + L({ es:'Lo que vas a hacer: ', en:'What you are going to do: ' }) + '</strong>' + L({
      es:'vas a estirar una población hasta el límite que aguanta su recurso, a ponerle signo a cada participante de una relación para descubrir cómo se llama, a repartir el alimento entre dos animales para que quepan en el mismo lugar y a seguir el efecto de un cambio hasta poblaciones que nadie tocó.',
      en:'you are going to stretch a population to the limit its resource can take, to give each participant of a relationship a sign so as to discover its name, to divide food between two animals so both fit in the same place, and to follow the effect of a change out to populations nobody touched.'
    }) + '</p></div>'
  );

  /* ══ CONCEPTO 1 ══ */
  var s1 = sec(
    L({ es:'Concepto 1', en:'Concept 1' }),
    L({ es:'El recurso se acaba, y ahí empieza la competencia', en:'The resource runs out, and that is where competition begins' }),
    '<p>' + L({
      es:'Todo lugar ofrece una cantidad limitada de lo que los seres vivos necesitan: agua, luz, alimento, espacio, huecos donde anidar o esconderse. A cada una de esas cosas se le llama recurso. Mientras la población es pequeña el recurso alcanza y cada individuo toma lo suyo sin problema. Pero el recurso no crece al mismo ritmo que la población, y llega un momento en que ya no da para todos. Ahí aparece la competencia: dos o más seres vivos necesitan el mismo recurso limitado y lo que se lleva uno deja de estar disponible para el otro.',
      en:'Every place offers a limited amount of what living things need: water, light, food, space, holes to nest or hide in. Each of those things is called a resource. While the population is small the resource is enough and each individual takes its share without trouble. But the resource does not grow at the same rate as the population, and a moment comes when there is no longer enough for everybody. That is when competition appears: two or more living things need the same limited resource and what one takes is no longer available to the other.'
    }) + '</p>' +
    '<p>' + L({
      es:'La competencia no necesita peleas ni encuentros. Ocurre entre individuos de la misma especie, que es el caso más duro porque todos necesitan exactamente lo mismo, y también entre especies distintas que comparten algún recurso. Su efecto se ve en el cuerpo y en el número: los individuos se ven más flacos o más pequeños, dejan menos crías y algunos se van a buscar otro sitio. Por eso cada lugar sostiene solo hasta cierta cantidad de individuos de una población, y ni uno más.',
      en:'Competition needs no fights and no encounters. It happens between individuals of the same species, which is the hardest case because they all need exactly the same things, and also between different species sharing some resource. Its effect shows in the body and in the numbers: individuals look thinner or smaller, they leave fewer young and some leave to look for another place. That is why each place supports only up to a certain number of individuals of a population, and not one more.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Recurso', en:'Resource' }), L({ es:'siempre limitado', en:'always limited' }), L({ es:'agua, luz, alimento, espacio, refugio', en:'water, light, food, space, shelter' })) +
      rcard(L({ es:'Competencia', en:'Competition' }), L({ es:'lo mismo, y poco', en:'the same thing, and little of it' }), L({ es:'no hace falta contacto entre ellos', en:'no contact between them is needed' })) +
      rcard(L({ es:'Dentro de la especie', en:'Within the species' }), L({ es:'la más intensa', en:'the most intense' }), L({ es:'todos necesitan exactamente lo mismo', en:'they all need exactly the same' })) +
      rcard(L({ es:'Límite del lugar', en:'Limit of the place' }), L({ es:'hasta cierta población', en:'up to a certain population' }), L({ es:'pasado ese punto, a cada uno le toca menos', en:'past that point, each one gets less' })) +
    '</div>'
  );
  wReparto(rng, widgetHost(s1, 'w_reparto', 'reparto'));
  addProblem(rng, mkP1(rng));
  addProblem(rng, mkP2(rng));

  /* ══ CONCEPTO 2 ══ */
  var s2 = sec(
    L({ es:'Concepto 2', en:'Concept 2' }),
    L({ es:'Ponle signo a cada quien y sabrás qué relación es', en:'Give each one a sign and you will know which relationship it is' }),
    '<p>' + L({
      es:'La competencia es solo una de las maneras en que dos poblaciones se afectan. Para nombrar cualquier relación hay un camino que siempre sirve: preguntar qué le pasa a cada participante cuando la relación ocurre. Si termina con algo que necesitaba, gana y le corresponde un signo positivo; si termina con algo menos, pierde y le toca un signo negativo; si sigue igual que antes, su signo es cero. Con ese par de signos la relación queda nombrada.',
      en:'Competition is only one of the ways two populations affect each other. To name any relationship there is a route that always works: ask what happens to each participant when the relationship occurs. If it ends up with something it needed, it gains and gets a positive sign; if it ends up with something less, it loses and gets a negative sign; if it is just as before, its sign is zero. With that pair of signs the relationship is named.'
    }) + '</p>' +
    '<p>' + L({
      es:'Cuando los dos ganan, la relación es mutualismo, como la abeja y la flor. Cuando uno gana y el otro pierde hay dos casos que conviene separar: en la depredación el que come acaba con su presa de una vez, como el coyote con la liebre; en el parasitismo el que se alimenta vive sobre el otro o dentro de él mucho tiempo y le conviene que siga vivo, como la garrapata con el venado. Cuando uno gana y al otro no le pasa nada es comensalismo, como la orquídea sobre la rama del encino. Y cuando los dos pierden, porque los dos querían el mismo recurso, la relación es competencia.',
      en:'When both gain, the relationship is mutualism, like the bee and the flower. When one gains and the other loses there are two cases worth separating: in predation the eater finishes its prey in one go, like the coyote with the hare; in parasitism the feeder lives on or inside the other for a long time and benefits from it staying alive, like the tick with the deer. When one gains and nothing happens to the other it is commensalism, like the orchid on the oak branch. And when both lose, because both wanted the same resource, the relationship is competition.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Mutualismo', en:'Mutualism' }), L({ es:'gana y gana', en:'gains and gains' }), L({ es:'abeja y flor, ardilla y encino', en:'bee and flower, squirrel and oak' })) +
      rcard(L({ es:'Depredación', en:'Predation' }), L({ es:'gana y pierde, de golpe', en:'gains and loses, at once' }), L({ es:'la presa muere en el encuentro', en:'the prey dies in the encounter' })) +
      rcard(L({ es:'Parasitismo', en:'Parasitism' }), L({ es:'gana y pierde, poco a poco', en:'gains and loses, little by little' }), L({ es:'al parásito le conviene que siga vivo', en:'the parasite benefits from it staying alive' })) +
      rcard(L({ es:'Comensalismo', en:'Commensalism' }), L({ es:'gana y queda igual', en:'gains and stays the same' }), L({ es:'uno aprovecha, el otro ni se entera', en:'one takes advantage, the other does not notice' })) +
    '</div>'
  );
  wSignos(rng, widgetHost(s2, 'w_signos', 'signos'));
  addProblem(rng, mkP3(rng));
  addProblem(rng, mkP4(rng));

  /* ══ CONCEPTO 3 ══ */
  var s3 = sec(
    L({ es:'Concepto 3', en:'Concept 3' }),
    L({ es:'Repartirse el lugar en vez de estorbarse', en:'Sharing out the place instead of getting in the way' }),
    '<p>' + L({
      es:'Cada especie tiene un modo propio de vivir en su lugar: qué come, a qué hora sale, dónde busca, en qué parte del árbol se mueve, dónde se refugia. A ese conjunto se le llama nicho. Cuando comparas los nichos de dos especies que viven juntas puedes ver cuánto se encima uno sobre el otro, y a eso se le llama traslape. Un traslape grande significa que se disputan casi todo; un traslape pequeño significa que casi no se estorban.',
      en:'Each species has its own way of living in its place: what it eats, when it comes out, where it searches, which part of the tree it moves in, where it shelters. That whole set is called its niche. When you compare the niches of two species living together you can see how much one sits on top of the other, and that is called overlap. A large overlap means they dispute nearly everything; a small overlap means they hardly get in the way of each other.'
    }) + '</p>' +
    '<p>' + L({
      es:'Si dos especies usan exactamente los mismos recursos, de la misma manera y al mismo tiempo, la competencia es tan fuerte que una acaba desplazada del lugar. Lo que se observa en el campo casi siempre es lo otro: un reparto. Un pájaro busca semillas en el suelo y otro en las ramas altas; una lagartija caza de día y otra al atardecer; una especie se queda con las semillas grandes y otra con las pequeñas. Al repartirse el recurso el traslape baja y las dos caben en el mismo sitio. Por eso la competencia, más que destruir, acomoda: reparte a las especies sobre los recursos del lugar.',
      en:'If two species use exactly the same resources, in the same way and at the same time, competition is so strong that one ends up displaced from the place. What is almost always observed in the field is the other thing: a sharing out. One bird looks for seeds on the ground and another in the high branches; one lizard hunts by day and another at dusk; one species keeps the large seeds and another the small ones. By sharing out the resource the overlap drops and both fit in the same place. That is why competition, rather than destroying, arranges: it spreads species over the resources of the place.'
    }) + '</p>'
  );
  wNicho(rng, widgetHost(s3, 'w_nicho', 'nicho'));
  addProblem(rng, mkP5(rng));
  addProblem(rng, mkP6(rng));

  /* ══ CONCEPTO 4 ══ */
  var s4 = sec(
    L({ es:'Concepto 4', en:'Concept 4' }),
    L({ es:'La interdependencia sostiene y regula al ecosistema', en:'Interdependence supports and regulates the ecosystem' }),
    '<p>' + L({
      es:'No todo lo que une a dos poblaciones es una disputa. Muchas dependen unas de otras para funcionar: la planta necesita al insecto que traslada su polen para producir semillas; el encino necesita a la ardilla que entierra bellotas lejos del árbol madre; el pasto necesita que el herbívoro no se lo acabe, algo de lo que se encarga el depredador. Eso es interdependencia: lo que le ocurre a una población se nota en otras, incluso en las que nunca la tocan.',
      en:'Not everything that links two populations is a dispute. Many depend on each other in order to work: the plant needs the insect that moves its pollen in order to produce seeds; the oak needs the squirrel that buries acorns far from the parent tree; the grass needs the herbivore not to finish it off, something the predator sees to. That is interdependence: what happens to one population shows up in others, even in those that never touch it.'
    }) + '</p>' +
    '<p>' + L({
      es:'De esas relaciones sale algo notable: el ecosistema se regula solo. Cuando hay muchas presas los depredadores encuentran alimento y aumentan; con más depredadores las presas bajan; con menos presas los depredadores también bajan y las presas se recuperan. Nadie dirige ese vaivén. Por lo mismo, cuando se rompe un vínculo el efecto no se queda quieto: se corre por el ecosistema y llega a poblaciones que nadie tocó. Anticiparlo se hace igual que leer una red, un paso a la vez.',
      en:'Something remarkable comes out of those relationships: the ecosystem regulates itself. When there are many prey the predators find food and increase; with more predators the prey drop; with fewer prey the predators drop too and the prey recover. Nobody directs that swing. For the same reason, when a link is broken the effect does not stay put: it travels through the ecosystem and reaches populations nobody touched. Anticipating it works just like reading a web, one step at a time.'
    }) + '</p>'
  );
  wMirada(rng, widgetHost(s4, 'w_mirada', 'reflect'));
  addProblem(rng, mkP7(rng));

  /* ══ CIERRE ══ */
  sec(
    L({ es:'Para cerrar', en:'To finish' }),
    L({ es:'Situaciones para leer con las cuatro herramientas', en:'Situations to read with the four tools' }),
    '<p>' + L({
      es:'Las siguientes situaciones vienen de presas, ranchos, parcelas y jardines. En cada una hay que decidir con qué herramienta se lee mejor: el límite que pone el recurso, los signos de la relación, el traslape entre dos nichos o el efecto que se corre por el ecosistema.',
      en:'The situations below come from reservoirs, ranches, plots and gardens. In each one you have to decide which tool reads it best: the limit the resource sets, the signs of the relationship, the overlap between two niches or the effect that travels through the ecosystem.'

<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbzLGV15JRTPs9bbSvHRLfgOXeT9oUExDf1AH546WOwq5tYxXSdhX212OWi_bTJfMGx9/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'Competencia e Interdependencia en Ecosistemas';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
