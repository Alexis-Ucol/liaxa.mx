<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liaxa · Admin Analytics</title>
<style>
/* ── TOKENS ── */
:root {
  --bg:        #f6f5f0;
  --surface:   #ffffff;
  --border:    #e2ddd4;
  --text:      #18180f;
  --text2:     #52504a;
  --text3:     #9a9690;
  --navy:      #1B2B52;
  --navy-mid:  #2a3d6e;
  --gold:      #E8A020;
  --gold-bg:   #fef7eb;
  --ok:        #2d6a4f;
  --ok-bg:     rgba(45,106,79,.10);
  --shadow:    0 2px 12px rgba(0,0,0,.08);
  --radius:    10px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh; }

/* ── LOGIN SCREEN ── */
#login-screen {
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh; background: var(--navy);
}
.login-card {
  background: var(--surface); border-radius: var(--radius);
  padding: 2.5rem 2rem; width: 100%; max-width: 360px;
  box-shadow: 0 20px 60px rgba(0,0,0,.3);
  text-align: center;
}
.login-logo { margin-bottom: 1.5rem; }
.login-card h1 { font-size: 1.1rem; color: var(--text2); margin-bottom: 1.5rem; font-weight: 500; }
.login-card input {
  width: 100%; padding: .75rem 1rem; border: 1.5px solid var(--border);
  border-radius: 7px; font-size: 1rem; margin-bottom: 1rem;
  outline: none; transition: border-color .2s;
}
.login-card input:focus { border-color: var(--navy); }
.login-card button {
  width: 100%; padding: .8rem; background: var(--navy); color: #fff;
  border: none; border-radius: 7px; font-size: 1rem; cursor: pointer;
  font-weight: 600; transition: background .2s;
}
.login-card button:hover { background: var(--navy-mid); }
.login-error { color: #c0392b; font-size: .85rem; margin-top: .5rem; display: none; }

/* ── MAIN APP ── */
#app { display: none; }

/* ── TOPBAR ── */
.topbar {
  background: var(--navy); color: #fff;
  display: flex; align-items: center; justify-content: space-between;
  padding: .75rem 2rem; position: sticky; top: 0; z-index: 100;
  box-shadow: 0 2px 12px rgba(0,0,0,.15);
}
.topbar-brand { display: flex; align-items: center; gap: .75rem; }
.topbar-brand span { font-weight: 700; font-size: 1.05rem; letter-spacing: .04em; }
.topbar-sub { font-size: .78rem; opacity: .65; }
.topbar-right { display: flex; align-items: center; gap: 1rem; }
.btn-refresh {
  background: rgba(255,255,255,.12); color: #fff; border: none;
  padding: .4rem .9rem; border-radius: 6px; cursor: pointer; font-size: .85rem;
  transition: background .2s;
}
.btn-refresh:hover { background: rgba(255,255,255,.22); }
.btn-refresh:disabled { opacity: .5; cursor: default; }
.last-updated { font-size: .75rem; opacity: .6; }

/* ── LAYOUT ── */
.container { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem; }

/* ── STAT CARDS ── */
.stat-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 1rem; margin-bottom: 2rem;
}
.stat-card {
  background: var(--surface); border-radius: var(--radius);
  padding: 1.25rem 1.5rem; box-shadow: var(--shadow);
  border-left: 4px solid var(--navy);
}
.stat-card.gold { border-left-color: var(--gold); }
.stat-card.ok   { border-left-color: var(--ok); }
.stat-label { font-size: .73rem; text-transform: uppercase; letter-spacing: .1em; color: var(--text3); margin-bottom: .25rem; }
.stat-value { font-size: 2rem; font-weight: 700; color: var(--navy); line-height: 1; }
.stat-card.gold .stat-value { color: #b07a10; }
.stat-card.ok   .stat-value { color: var(--ok); }

/* ── SECTION HEADERS ── */
.section-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 1rem;
}
.section-title { font-size: 1rem; font-weight: 700; color: var(--navy); }

/* ── SCHOOL SELECTOR ── */
.school-selector {
  display: flex; align-items: center; gap: .75rem; margin-bottom: 2rem;
  background: var(--surface); border-radius: var(--radius);
  padding: 1rem 1.5rem; box-shadow: var(--shadow);
}
.school-selector label { font-size: .85rem; color: var(--text2); font-weight: 600; white-space: nowrap; }
.school-selector select {
  flex: 1; padding: .5rem .75rem; border: 1.5px solid var(--border);
  border-radius: 6px; font-size: .95rem; background: var(--bg);
  outline: none; cursor: pointer;
}
.school-selector select:focus { border-color: var(--navy); }

/* ── TABLE ── */
.table-wrap {
  background: var(--surface); border-radius: var(--radius);
  box-shadow: var(--shadow); overflow: hidden; margin-bottom: 2rem;
}
table { width: 100%; border-collapse: collapse; font-size: .88rem; }
thead tr { background: var(--navy); color: #fff; }
thead th { padding: .75rem 1rem; text-align: left; font-weight: 600; font-size: .78rem; letter-spacing: .06em; text-transform: uppercase; }
tbody tr { border-bottom: 1px solid var(--border); transition: background .15s; }
tbody tr:last-child { border-bottom: none; }
tbody tr:hover { background: var(--gold-bg); }
tbody td { padding: .7rem 1rem; color: var(--text2); }
tbody td:first-child { font-weight: 600; color: var(--text); }
.badge {
  display: inline-block; padding: .18rem .55rem;
  border-radius: 20px; font-size: .75rem; font-weight: 600;
}
.badge-ok   { background: var(--ok-bg);  color: var(--ok); }
.badge-gold { background: var(--gold-bg); color: #8a5c00; }

/* ── MODULE DETAIL PANEL ── */
.detail-panel {
  background: var(--surface); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 1.5rem; margin-bottom: 2rem;
}
.detail-panel h2 { font-size: 1rem; font-weight: 700; color: var(--navy); margin-bottom: 1rem; }
.portal-dates {
  display: flex; flex-wrap: wrap; gap: .4rem; margin-bottom: 1.25rem;
}
.date-chip {
  background: var(--gold-bg); color: #8a5c00; font-size: .75rem;
  font-weight: 600; padding: .2rem .6rem; border-radius: 20px;
}

/* ── LOADING / EMPTY ── */
.loading { text-align: center; padding: 3rem; color: var(--text3); font-size: .9rem; }
.empty   { text-align: center; padding: 2rem; color: var(--text3); font-size: .85rem; }

/* ── FOOTER ── */
.footer { text-align: center; padding: 2rem; color: var(--text3); font-size: .78rem; }

/* ── RESPONSIVE ── */
@media (max-width: 600px) {
  .container { padding: 1rem; }
  .topbar { padding: .75rem 1rem; }
  thead th:nth-child(4), tbody td:nth-child(4),
  thead th:nth-child(5), tbody td:nth-child(5) { display: none; }
}
</style>
</head>
<body>

<!-- ══ LOGIN ══════════════════════════════════════════════════════════════ -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">
      <!-- Liaxa logo inline SVG -->
      <svg width="140" height="36" viewBox="0 0 200 52" xmlns="http://www.w3.org/2000/svg">
        <polyline points="0,40 16,24 30,32 48,8" fill="none" stroke="#1B2B52" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="48" cy="8" r="6" fill="#E8A020"/>
        <text x="62" y="38" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#1B2B52" letter-spacing="2">LIAXA</text>
      </svg>
    </div>
    <h1>Panel de Analytics</h1>
    <input type="password" id="pwd-input" placeholder="Contraseña" autocomplete="current-password">
    <button onclick="tryLogin()">Entrar</button>
    <div class="login-error" id="login-error">Contraseña incorrecta.</div>
  </div>
</div>

<!-- ══ APP ════════════════════════════════════════════════════════════════ -->
<div id="app">
  <div class="topbar">
    <div class="topbar-brand">
      <svg width="90" height="24" viewBox="0 0 200 52" xmlns="http://www.w3.org/2000/svg">
        <polyline points="0,40 16,24 30,32 48,8" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="48" cy="8" r="6" fill="#E8A020"/>
        <text x="62" y="38" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#fff" letter-spacing="2">LIAXA</text>
      </svg>
      <div>
        <div style="font-size:.7rem;opacity:.6;letter-spacing:.08em;text-transform:uppercase;">Analytics</div>
      </div>
    </div>
    <div class="topbar-right">
      <span class="last-updated" id="last-updated"></span>
      <button class="btn-refresh" id="btn-refresh" onclick="loadAll()">↻ Actualizar</button>
    </div>
  </div>

  <div class="container">

    <!-- Global stats -->
    <div class="stat-grid" id="stat-grid">
      <div class="stat-card"><div class="stat-label">Escuelas activas</div><div class="stat-value" id="s-schools">—</div></div>
      <div class="stat-card gold"><div class="stat-label">Visitas al portal</div><div class="stat-value" id="s-portals">—</div></div>
      <div class="stat-card"><div class="stat-label">Sesiones de módulo</div><div class="stat-value" id="s-sessions">—</div></div>
      <div class="stat-card ok"><div class="stat-label">Tiempo promedio</div><div class="stat-value" id="s-avgtime">—</div></div>
    </div>

    <!-- Summary table -->
    <div class="section-header">
      <div class="section-title">Resumen por escuela</div>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Escuela</th>
            <th>Visitas portal</th>
            <th>Sesiones módulo</th>
            <th>Módulos distintos</th>
            <th>Tiempo prom.</th>
            <th>Último acceso</th>
          </tr>
        </thead>
        <tbody id="summary-tbody">
          <tr><td colspan="6" class="loading">Cargando datos…</td></tr>
        </tbody>
      </table>
    </div>

    <!-- School drill-down -->
    <div class="school-selector">
      <label>Ver detalle de escuela:</label>
      <select id="school-select" onchange="loadSchoolDetail(this.value)">
        <option value="">— Selecciona una escuela —</option>
      </select>
    </div>

    <div id="detail-container"></div>

  </div>
  <div class="footer">Liaxa Analytics · uso interno</div>
</div>

<script>
// ══════════════════════════════════════════════════════════════════════════
// CONFIG — replace with your deployed GAS Web App URL
// ══════════════════════════════════════════════════════════════════════════
var GAS_URL  = 'https://script.google.com/macros/s/AKfycbzLGV15JRTPs9bbSvHRLfgOXeT9oUExDf1AH546WOwq5tYxXSdhX212OWi_bTJfMGx9/exec';
// Simple password — change this to whatever you want
// This is client-side only, which is fine: the GAS data is read-only aggregated stats,
// not sensitive personal data. The password just keeps casual visitors out.
var PASSWORD = 'cuyutlan';

// ── Login ──────────────────────────────────────────────────────────────────
function tryLogin() {
  var val = document.getElementById('pwd-input').value;
  if (val === PASSWORD) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    sessionStorage.setItem('lx_auth', '1');
    loadAll();
  } else {
    document.getElementById('login-error').style.display = 'block';
  }
}
document.getElementById('pwd-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') tryLogin();
});
// Auto-login if already authenticated this session
if (sessionStorage.getItem('lx_auth') === '1') {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
}

// ── Data loading ───────────────────────────────────────────────────────────
function loadAll() {
  var btn = document.getElementById('btn-refresh');
  btn.disabled = true;
  btn.textContent = '…';

  fetch(GAS_URL + '?action=summary')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      renderSummary(data);
      return fetch(GAS_URL + '?action=schools');
    })
    .then(function(r) { return r.json(); })
    .then(function(schools) {
      populateSchoolSelect(schools);
      document.getElementById('last-updated').textContent =
        'Actualizado: ' + new Date().toLocaleTimeString('es-MX');
      btn.disabled = false;
      btn.textContent = '↻ Actualizar';
    })
    .catch(function(err) {
      console.error(err);
      btn.disabled = false;
      btn.textContent = '↻ Actualizar';
      document.getElementById('summary-tbody').innerHTML =
        '<tr><td colspan="6" class="empty">Error al cargar datos. Verifica la URL del GAS endpoint.</td></tr>';
    });
}

function renderSummary(rows) {
  // Global stats
  var totalPortals  = rows.reduce(function(a, r) { return a + r.portal_loads; }, 0);
  var totalSessions = rows.reduce(function(a, r) { return a + r.module_sessions; }, 0);
  var allTimes      = rows.map(function(r) { return r.avg_time_sec; }).filter(Boolean);
  var globalAvg     = allTimes.length
    ? Math.round(allTimes.reduce(function(a, b) { return a + b; }, 0) / allTimes.length)
    : 0;

  document.getElementById('s-schools').textContent  = rows.length;
  document.getElementById('s-portals').textContent  = totalPortals;
  document.getElementById('s-sessions').textContent = totalSessions;
  document.getElementById('s-avgtime').textContent  = fmtTime(globalAvg);

  // Table
  if (!rows.length) {
    document.getElementById('summary-tbody').innerHTML =
      '<tr><td colspan="6" class="empty">Sin datos todavía.</td></tr>';
    return;
  }
  var html = rows.map(function(r) {
    return '<tr onclick="loadSchoolDetail(\'' + r.school + '\')" style="cursor:pointer">' +
      '<td>' + r.school + '</td>' +
      '<td><span class="badge badge-gold">' + r.portal_loads + '</span></td>' +
      '<td>' + r.module_sessions + '</td>' +
      '<td>' + r.modules_used + '</td>' +
      '<td>' + fmtTime(r.avg_time_sec) + '</td>' +
      '<td>' + (r.last_seen || '—') + '</td>' +
      '</tr>';
  }).join('');
  document.getElementById('summary-tbody').innerHTML = html;
}

function populateSchoolSelect(schools) {
  var sel = document.getElementById('school-select');
  var current = sel.value;
  sel.innerHTML = '<option value="">— Selecciona una escuela —</option>';
  schools.forEach(function(s) {
    var opt = document.createElement('option');
    opt.value = s; opt.textContent = s;
    if (s === current) opt.selected = true;
    sel.appendChild(opt);
  });
}

function loadSchoolDetail(school) {
  if (!school) {
    document.getElementById('detail-container').innerHTML = '';
    return;
  }
  // Sync the dropdown
  document.getElementById('school-select').value = school;
  document.getElementById('detail-container').innerHTML =
    '<div class="loading">Cargando detalle de ' + school + '…</div>';

  fetch(GAS_URL + '?action=school&school=' + encodeURIComponent(school))
    .then(function(r) { return r.json(); })
    .then(renderSchoolDetail)
    .catch(function() {
      document.getElementById('detail-container').innerHTML =
        '<div class="empty">Error al cargar el detalle.</div>';
    });
}

function renderSchoolDetail(data) {
  var portalHtml = '';
  if (data.portal_dates && data.portal_dates.length) {
    // Count by date
    var byDate = {};
    data.portal_dates.forEach(function(d) { byDate[d] = (byDate[d] || 0) + 1; });
    var chips = Object.keys(byDate).sort().map(function(d) {
      return '<span class="date-chip">' + d + ' ×' + byDate[d] + '</span>';
    }).join('');
    portalHtml = '<div style="margin-bottom:.5rem;font-size:.82rem;color:var(--text3);font-weight:600;">VISITAS AL PORTAL</div>' +
      '<div class="portal-dates">' + chips + '</div>';
  }

  var modulesHtml = '';
  if (data.modules && data.modules.length) {
    var rows = data.modules.map(function(m) {
      return '<tr>' +
        '<td>' + m.module_id + '</td>' +
        '<td><span class="badge badge-ok">' + m.session_count + '</span></td>' +
        '<td>' + fmtTime(m.avg_time_sec) + '</td>' +
        '<td>' + m.active_days + '</td>' +
        '<td>' + (m.last_used || '—') + '</td>' +
        '</tr>';
    }).join('');
    modulesHtml =
      '<div style="margin-bottom:.5rem;font-size:.82rem;color:var(--text3);font-weight:600;">MÓDULOS</div>' +
      '<div class="table-wrap"><table>' +
      '<thead><tr><th>Módulo</th><th>Sesiones</th><th>Tiempo prom.</th><th>Días activo</th><th>Último uso</th></tr></thead>' +
      '<tbody>' + rows + '</tbody></table></div>';
  } else {
    modulesHtml = '<div class="empty">Sin actividad en módulos todavía.</div>';
  }

  document.getElementById('detail-container').innerHTML =
    '<div class="detail-panel">' +
    '<h2>Detalle: ' + data.school + '</h2>' +
    portalHtml +
    modulesHtml +
    '</div>';
}

// ── Helpers ────────────────────────────────────────────────────────────────
function fmtTime(sec) {
  if (!sec) return '—';
  if (sec < 60)   return sec + 's';
  var m = Math.floor(sec / 60);
  var s = sec % 60;
  return m + 'm' + (s ? ' ' + s + 's' : '');
}

// Auto-load if already logged in
if (sessionStorage.getItem('lx_auth') === '1') loadAll();
</script>
</body>
</html>
