<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El conjunto Q: números racionales y sus propiedades</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; text-align:justify; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }

/* ── WIDGETS DE ESTA GUÍA (signo, conjunto Q, recta y densidad) ── */
.mf-slash { display:none; }
.iw-tag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.4rem; }
.iw-box { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; padding:1rem; }
.iw-instr { font-size:.87rem; color:var(--text2); margin-bottom:.7rem; }
.rondas { font-family:'IBM Plex Mono',monospace; font-size:.7rem; color:var(--text3); letter-spacing:.08em; text-transform:uppercase; margin-bottom:.45rem; }
.goalbar { font-size:.85rem; color:var(--text2); background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.5rem .75rem; margin-bottom:.65rem; }
.goalbar b { color:var(--green-dark); }
.rfb { font-size:.84rem; margin-top:.6rem; min-height:1.35rem; color:var(--text2); }
.rfb b { color:var(--green-dark); }
.okmsg { color:var(--ok); font-weight:700; }
.wdone { font-weight:700; color:var(--ok); text-align:center; padding:.7rem; font-size:.95rem; }
.rverify-btn { background:var(--green); color:#fff; border:none; border-radius:8px; padding:.6rem 1.2rem; font-size:.86rem; font-weight:600; cursor:pointer; min-height:44px; margin-top:.7rem; font-family:inherit; }
.rverify-btn:hover { background:var(--green-dark); }
.livelbl { margin-top:.55rem; font-size:.88rem; color:var(--text2); }
.livelbl b { color:var(--green-dark); font-family:'IBM Plex Mono',monospace; }
.krow { display:flex; align-items:center; gap:.6rem; margin-top:.55rem; flex-wrap:wrap; }
.krow input[type=range] { flex:1; min-width:130px; accent-color:var(--green); height:36px; }
.klbl { font-size:.78rem; color:var(--text3); min-width:62px; }
.kval { font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:1rem; color:var(--green); min-width:44px; text-align:right; }
.gcanvas { display:block; width:100%; height:210px; border:1px solid var(--border); border-radius:8px; background:var(--surface); touch-action:manipulation; }
.vcanvas { height:290px; }
.tapcanvas { cursor:pointer; }
.chiprow { display:flex; flex-wrap:wrap; gap:.45rem; margin:.6rem 0 .2rem; }
.chip { border:1.5px solid var(--border); border-radius:10px; padding:.4rem .85rem; font-size:.9rem; background:var(--surface2); color:var(--text2); cursor:pointer; user-select:none; min-height:44px; display:inline-flex; align-items:center; gap:.4rem; }
.chip.on { background:var(--green-bg); border-color:var(--green); color:var(--green-dark); font-weight:600; }
.chip.lock { cursor:default; }
.chipnum { font-family:'IBM Plex Mono',monospace; font-size:.72rem; color:var(--text3); }
.numcard { display:block; text-align:center; font-size:1.5rem; font-weight:700; color:var(--green-dark); background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:.8rem; margin:.6rem 0; }
.binrow { display:flex; gap:.5rem; flex-wrap:wrap; }
.binbtn { flex:1 1 44%; min-height:52px; border:1.5px solid var(--border); border-radius:10px; background:var(--surface2); color:var(--text2); font-family:inherit; font-size:.84rem; font-weight:600; cursor:pointer; padding:.5rem .6rem; }
.binbtn:hover { border-color:var(--green); background:var(--green-bg); color:var(--green-dark); }
.defgrid { display:grid; grid-template-columns:repeat(2,1fr); gap:.6rem; margin:1rem 0; }
.defcell { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.75rem; border-top:3px solid var(--green); }
.defname { font-size:.72rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.25rem; }
.deftxt { font-size:.82rem; color:var(--text2); }
.qdata { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:.5rem .7rem; margin:.5rem 0 .2rem; font-size:.86rem; color:var(--text2); }
.qdata b { color:var(--green-dark); font-family:'IBM Plex Mono',monospace; }
@media (max-width: 600px) {
  .defgrid { grid-template-columns:1fr; }
  .gcanvas { height:195px; }
  .vcanvas { height:270px; }
  .klbl { min-width:52px; font-size:.74rem; }
  .chip { font-size:.86rem; padding:.35rem .7rem; }
  .binbtn { flex:1 1 100%; }
  .numcard { font-size:1.3rem; }
}
.pcrd.ok  { border-left:4px solid var(--ok); }
.pcrd.bad { border-left:4px solid var(--bad); background:var(--bad-bg); }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">El conjunto Q: números racionales y sus propiedades</div>
    <div class="wcourse" id="wcourse-el">Matemáticas · 1° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>

/* ── Drawing palette, derived from the school's colours (Rule 16) ─────────
   slots 1-2 : school primary + accent
   slots 3-4 : the two of black/red/blue/green least similar to the school colours
   Falls back to neutral defaults if SCHOOL colours can't be parsed.
   ───────────────────────────────────────────────────────────────────── */
var DRAW_PALETTE = (function () {
  function hex2rgb(h) {
    h = String(h).replace('#', '');
    if (h.length === 3) { h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2]; }
    return [parseInt(h.substr(0,2),16), parseInt(h.substr(2,2),16), parseInt(h.substr(4,2),16)];
  }
  function dist(a, b) {
    var dr = a[0]-b[0], dg = a[1]-b[1], db = a[2]-b[2];
    return Math.sqrt(2*dr*dr + 4*dg*dg + 3*db*db);
  }
  var COMMON = ['#1a1a16', '#c0392b', '#1d4e89', '#1a7a3a'];  /* black, red, blue, green */
  var schoolRGB;
  try {
    schoolRGB = [hex2rgb(SCHOOL.primary), hex2rgb(SCHOOL.accent)];
  } catch (e) {
    return [SCHOOL.primary, SCHOOL.accent, '#1a1a16', '#1d4e89'];
  }
  var scored = COMMON.map(function (c, idx) {
    var rgb = hex2rgb(c);
    var nearest = Math.min(dist(rgb, schoolRGB[0]), dist(rgb, schoolRGB[1]));
    return { c: c, idx: idx, d: nearest };
  });
  scored.sort(function (a, b) { return b.d - a.d; });      /* farthest first */

  return [SCHOOL.primary, SCHOOL.accent, keep[0].c, keep[1].c];
})();

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = DRAW_PALETTE[0];   // matches the first (selected) dot = SCHOOL.primary
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;

  saveSession();

}

  //   iOS Safari ignores the <a download> attribute (and doc.save() relies on
  //   it), so on iPhone/iPad a plain download fails silently. We branch:
  //     • iOS  → native share sheet (→ "Save to Files"); if unavailable, open
  //              the PDF inline so the student can tap Safari's own Share.
  //     • else → <a download> click (works on desktop + Android).
  //   The whole function runs synchronously off the tap (no await above), which
  //   is what lets iOS accept navigator.share(). Do NOT add an await before this.
  // ──────────────────────────────────────────────────────────────────────────
  var _fname   = 'mat1_t02_rac_conjunto_q_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf';
  var _pdfBlob = doc.output('blob');

  function _restorePdfBtn(){ btn.innerHTML = '⬇ &nbsp;' + t('btn-pdf'); btn.disabled = false; }
  function _openPdfInline(b){
    var u = URL.createObjectURL(b);
    var w = window.open(u, '_blank');
    if (!w) { window.location.href = u; }   // popup blocked → same tab
    setTimeout(function(){ URL.revokeObjectURL(u); }, 60000);
  }

  // iPadOS 13+ reports as "MacIntel" with a touch screen, so test for that too.
  var _isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
               (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  if (_isIOS) {
    var _pdfFile = new File([_pdfBlob], _fname, { type:'application/pdf' });
    if (navigator.canShare && navigator.canShare({ files:[_pdfFile] })) {
      navigator.share({ files:[_pdfFile], title:_fname })
        .then(_restorePdfBtn)
        .catch(function(e){
          if (e && e.name === 'AbortError') { _restorePdfBtn(); return; } // cancelled
          _openPdfInline(_pdfBlob); _restorePdfBtn();
        });
      return;
    }
    _openPdfInline(_pdfBlob); _restorePdfBtn();   // older iOS: open inline
    return;
  }

  // Desktop + Android: the native download works.
  var _dlUrl = URL.createObjectURL(_pdfBlob);
  var _dlA   = document.createElement('a');
  _dlA.href  = _dlUrl; _dlA.download = _fname;
  document.body.appendChild(_dlA); _dlA.click();
  setTimeout(function(){ document.body.removeChild(_dlA); URL.revokeObjectURL(_dlUrl); }, 200);
  _restorePdfBtn();
}

/* ================================================
   buildLesson - OVERRIDE IN EACH GUIDE
   ================================================ */
function buildLesson(rng) {
  /*
   * CONCEPT ARC
   * topic      : El conjunto Q: números racionales y sus propiedades
   * prerequisite: El estudiante ya ubica naturales, fracciones sencillas y decimales en la
   *               recta numérica, y sabe leer una fracción como una división.
   * sequence   : 1. Por qué hacen falta los números con signo: medidas que se toman desde un
   *                 punto de referencia y avanzan hacia los dos lados de él (los enteros).
   *              2. Entre dos enteros viven fracciones y decimales, y los tres tipos de
   *                 escritura se pueden poner como cociente de dos enteros: el conjunto Q.
   *              3. Comparar y ordenar racionales con signo por el lugar que ocupan en la
   *                 recta numérica: a la izquierda está el menor.
   *              4. Densidad: entre dos racionales distintos siempre queda otro racional.
   * why_this_order: El signo (1) es lo que permite reunir en un mismo conjunto a los enteros
   *                 negativos con las fracciones y los decimales (2); solo cuando el conjunto
   *                 está reunido tiene sentido acomodarlo en la recta (3); y la densidad (4)
   *                 es una pregunta sobre ese orden ya construido: qué hay entre dos lugares.
   */

  var LB = document.getElementById('lessonBody');
  LB.innerHTML = '';
  problems = [];

  /* ============================================================
     HELPERS
     ============================================================ */
  function T(o){
    if (o === undefined || o === null) return '';
    if (typeof o === 'string' || typeof o === 'number') return o;
    if (Object.prototype.toString.call(o) === '[object Array]') return o;
    return (o[LANG] !== undefined ? o[LANG] : o.es);
  }
  function ri(a,b){ return a + Math.floor(rng()*(b-a+1)); }
  function shufA(arr){
    var a = arr.slice(), i, j, t;
    for (i=a.length-1;i>0;i--){ j=Math.floor(rng()*(i+1)); t=a[i]; a[i]=a[j]; a[j]=t; }
    return a;
  }
  /* signo menos tipográfico (Regla 9B/13) */
  function mn(x){ return String(x).replace('-', '−'); }
  /* fracción con marcado .mf-* ; el separador queda oculto y solo sirve al exportar */
  function fr(n, d, neg){
    return (neg ? '−' : '') +
      '<span class="mf-outer"><span class="mf-num">'+n+'</span>'+
      '<span class="mf-slash">/</span><span class="mf-den">'+d+'</span></span>';
  }
  function sec(tag, title, html){
    var d = document.createElement('div');
    d.className = 'section';
    d.innerHTML = '<div class="stag">'+tag+'</div><h2>'+title+'</h2>'+(html||'');
    LB.appendChild(d);
    return d;
  }
  function widget(kind){
    var d = document.createElement('div');
    d.className = kind + 'wrap section';
    d.setAttribute('data-widget', kind);
    d.id = 'w' + kind;
    LB.appendChild(d);
    return d;
  }
  function cssv(n){
    try { var v = getComputedStyle(document.documentElement).getPropertyValue(n); return v ? v.trim() : ''; }
    catch(e){ return ''; }
  }
  function fitCv(cv){
    var dpr = window.devicePixelRatio || 1;
    var w = cv.clientWidth || 330;
    var h = cv.clientHeight || 210;
    cv.width  = Math.round(w*dpr);
    cv.height = Math.round(h*dpr);
    var ctx = cv.getContext('2d');
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,w,h);
    return { ctx:ctx, w:w, h:h };
  }
  /* cuatro opciones numéricas distintas */
  function opt4(correct, cands){
    var out = [String(correct)], i, v, k = 1;
    for (i=0;i<cands.length && out.length<4;i++){
      v = cands[i];
      if (v === null || v === undefined) continue;
      v = String(v);
      if (out.indexOf(v) === -1) out.push(v);
    }
    while (out.length < 4){
      v = String(Number(correct) + k);
      if (out.indexOf(v) === -1) out.push(v);
      k++;
    }
    return out;
  }
  function addProb(spec){
    var so  = shufA(T(spec.options));
    var cor = String(T(spec.correct));
    problems.push({
      title: T(spec.title),
      questionText: T(spec.q),
      fn: '',
      hint: T(spec.hint),
      explanation: T(spec.exp),
      options: so,
      correctIdx: so.indexOf(cor),
      showWork: !!spec.showWork,
      studentChoice: null,
      pendingChoice: null
    });
    buildOneCard(problems[problems.length-1], problems.length-1);
  }

  /* ============================================================
     VALORES SEMBRADOS (se sortean una sola vez, en orden fijo)
     ============================================================ */
  var v1 = ri(0,1), v2 = ri(0,1), v6 = ri(0,1), v8 = ri(0,1), v9 = ri(0,1), v10 = ri(0,1);

  var pE  = ri(2,5);                       /* niveles que baja el elevador */
  var pG  = ri(2,5)*10, pT = pG + ri(1,4)*10, pD = pT - pG;   /* cuenta con deuda */
  var pN  = ri(3,9);                       /* magnitud de las situaciones del problema 2 */
  var p3N = ri(3,9);                       /* el número del problema 3 */
  var p4I = ri(2,4);                       /* cuántos enteros trae la lista del problema 4 */
  var p6a = ri(1,4), p6b = p6a + ri(2,5), p6c = ri(1,5);
  var p7m = ri(5,8), p7n = ri(1,3);
  var p7D = ['0.5','1.5','2.5'][ri(0,2)];
  var p8m = ri(5,9), p8n = ri(1,4);
  var p9k = ri(1,8), p9j = ri(1,8);
  var p10t = ri(1,8);

  /* rondas del medidor: dos situaciones bajo cero y una por arriba, en orden sorteado */
  var SIT_NEG = [
    { es:'La temperatura de un congelador llega a V grados bajo cero.',
      en:'The temperature inside a freezer reaches V degrees below zero.',
      un:{es:'grados',en:'degrees'}, dir:{es:'por debajo del cero',en:'below zero'} },
    { es:'El estacionamiento del edificio está V pisos abajo de la planta baja.',

    { es:'Un buzo trabaja a V metros bajo el nivel del mar.',
      en:'A diver works V meters below sea level.',
      un:{es:'metros',en:'meters'}, dir:{es:'por debajo del nivel del mar',en:'below sea level'} },
    { es:'Una cuenta queda con una deuda de V pesos.',
      en:'An account is left with a debt of V pesos.',
      un:{es:'pesos',en:'pesos'}, dir:{es:'del lado de lo que se debe',en:'on the side of what is owed'} }
  ];
  var SIT_POS = [
    { es:'Un dron se mantiene V metros arriba del suelo.',
      en:'A drone hovers V meters above the ground.',
      un:{es:'metros',en:'meters'}, dir:{es:'por arriba del suelo',en:'above the ground'} },
    { es:'El mirador está V pisos arriba de la planta baja.',
      en:'The lookout is V floors above the ground floor.',
      un:{es:'pisos',en:'floors'}, dir:{es:'por arriba de la planta baja',en:'above the ground floor'} },

        ctx.strokeStyle = (v === 0) ? cssv('--text3') : cssv('--border');
        ctx.lineWidth = (v === 0) ? 2 : 1;
        ctx.beginPath(); ctx.moveTo(x, yAx-6); ctx.lineTo(x, yAx+6); ctx.stroke();

             en:'Zero was put first and the negatives were also flipped: the smallest of all is '+mn(-p8m)+'.'},
    hint:{es:'Recorre la recta de izquierda a derecha y anota lo que vas encontrando; el cero no es el primero que aparece.',
          en:'Walk the line from left to right and write down what you find; zero is not the first thing you meet.'},
    exp:{es:'De izquierda a derecha aparecen '+mn(-p8m)+', luego '+mn(-p8n)+' y después el 0, así que hay dos fallas: el cero es mayor que los dos negativos y '+mn(-p8m)+' es menor que '+mn(-p8n)+', no al revés.',
         en:'From left to right you meet '+mn(-p8m)+', then '+mn(-p8n)+' and then 0, so there are two faults: zero is greater than both negatives, and '+mn(-p8m)+' is smaller than '+mn(-p8n)+', not the other way around.'},
    showWork:false
  });

  /* ============================================================
     IDEA 4
     ============================================================ */
  sec(T({es:'Idea 4', en:'Idea 4'}),
      T({es:'Siempre cabe otro: la densidad de Q', en:'There is always room for one more: the density of Q'}),
      '<p>'+T({
        es:'Si cada racional ocupa un lugar de la recta y ya sabemos ordenarlos, queda una pregunta natural: ¿la recta se llena de puntos separados, como pasa con los enteros, o siempre queda espacio en medio? Con los enteros la respuesta es clara, porque entre 3 y 4 no hay ningún otro entero. Con los racionales la respuesta es distinta.',
        en:'If every rational takes a place on the line and we already know how to order them, a natural question appears: does the line fill up with separate points, as happens with integers, or is there always room in between? With integers the answer is clear, because between 3 and 4 there is no other integer. With rationals the answer is different.'
      })+'</p>'+
      '<p>'+T({
        es:'Toma dos racionales distintos, tan cercanos como quieras. Siempre se puede encontrar otro entre ellos: basta con buscar el punto que queda a la mitad, o con escribirlos usando una cifra decimal más y elegir uno intermedio. Y con el número nuevo se puede repetir la búsqueda, sin que el proceso termine nunca. Esa propiedad se llama densidad: entre dos racionales distintos hay otro racional y, por lo tanto, una cantidad infinita de ellos.',
        en:'Take two different rationals, as close together as you like. You can always find another one between them: just look for the point halfway across, or write them with one more decimal place and pick an intermediate one. And with the new number the search can start again, in a process that never ends. That property is called density: between two different rationals there is another rational and therefore an infinite amount of them.'
      })+'</p>'+
      '<div class="callout"><p>'+T({
        es:'<strong>Los enteros no son densos y los racionales sí.</strong> Por eso tiene sentido hablar del entero que sigue después del 3, pero no del racional que sigue después de 0.3: cualquier candidato deja huecos por delante.',
        en:'<strong>Integers are not dense and rationals are.</strong> That is why it makes sense to speak of the integer that comes after 3, but not of the rational that comes after 0.3: any candidate leaves gaps ahead of it.'
      })+'</p></div>');

  /* ---- MANIPULATIVO 4: la lupa ---- */
  (function(){
    var wrap = widget('lupa');
    var st = { r:0, mark:null, tries:0, busy:false, done:false };
    function cur(){ return LRD[st.r]; }
    function fmtU(u, d){
      var s = (u/10000).toFixed(d);
      if (s.charAt(0) === '-') s = '−' + s.slice(1);
      return s;
    }
    function draw(){
      var cv = document.getElementById('lpCv'); if (!cv) return;
      var R = cur(), g = fitCv(cv), ctx = g.ctx, W = g.w, H = g.h;
      var padL = 20, padR = 20, yAx = Math.round(H*0.42);
      function X(u){ return padL + (u - R.lo)/R.w*(W - padL - padR); }
      ctx.strokeStyle = cssv('--text3'); ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(padL, yAx); ctx.lineTo(W-padR, yAx); ctx.stroke();
      /* zona entre los dos números buscados */
      ctx.fillStyle = cssv('--gold-bg');
      ctx.fillRect(X(R.a), yAx-13, X(R.b)-X(R.a), 26);
      ctx.font = '9px "IBM Plex Mono", monospace';
      ctx.textAlign = 'center';
      var i, u, x;
      for (i=0;i<=10;i++){
        u = R.lo + i*R.step; x = X(u);
        ctx.strokeStyle = cssv('--border'); ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(x, yAx-8); ctx.lineTo(x, yAx+8); ctx.stroke();
        ctx.fillStyle = cssv('--text3'); ctx.textBaseline = 'top';
        ctx.fillText(fmtU(u, R.dec), x, yAx + 12 + (i % 2)*13);
      }
      /* los dos extremos del hueco */
      [R.a, R.b].forEach(function(u){
        var xx = X(u);
        ctx.strokeStyle = cssv('--gold'); ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.moveTo(xx, yAx-13); ctx.lineTo(xx, yAx+13); ctx.stroke();
        ctx.fillStyle = cssv('--gold'); ctx.textBaseline = 'bottom';
        ctx.font = '10px "IBM Plex Mono", monospace';
        ctx.fillText(fmtU(u, R.dec), xx, yAx - 16);
      });
      if (st.mark !== null){
        var xm = X(st.mark);
        ctx.fillStyle = cssv('--green');
        ctx.beginPath(); ctx.arc(xm, yAx, 5.5, 0, 6.2832); ctx.fill();
        ctx.textBaseline = 'bottom'; ctx.font = '11px "IBM Plex Mono", monospace';
        ctx.fillText(fmtU(st.mark, R.dec + 1), xm, yAx - 30);
      }
    }
    function render(){
      var R = cur();
      wrap.innerHTML =
        '<div class="iw-tag">'+T({es:'La lupa', en:'The magnifier'})+'</div>'+
        '<div class="iw-box">'+
          '<div class="rondas">'+T({es:'Acercamiento ', en:'Zoom '})+(st.r+1)+T({es:' de 3', en:' of 3'})+'</div>'+
          '<div class="goalbar">'+T({es:'Encuentra un número que quede entre ', en:'Find a number that lies between '})+
            '<b>'+fmtU(R.a, R.dec)+'</b>'+T({es:' y ', en:' and '})+'<b>'+fmtU(R.b, R.dec)+'</b></div>'+
          '<div class="iw-instr iw-sub">'+T({
            es:'Toca la recta para colocar tu punto dentro de la franja dorada. Puedes moverlo las veces que quieras y después comprobar.',
            en:'Tap the line to place your point inside the golden band. You can move it as many times as you want and then check.'
          })+'</div>'+
          '<canvas class="gcanvas tapcanvas" id="lpCv"></canvas>'+
          '<div class="livelbl">'+T({es:'Tu punto: ', en:'Your point: '})+'<b id="lpVal">'+
            (st.mark === null ? '?' : fmtU(st.mark, R.dec + 1))+'</b></div>'+
          '<button class="rverify-btn" onclick="lpChk()">'+T({es:'Comprobar', en:'Check'})+'</button>'+
          '<div class="rfb" id="lpFb"></div>'+
        '</div>';
      var cv = document.getElementById('lpCv');
      if (cv) cv.addEventListener('click', function(ev){
        if (st.busy || st.done) return;
        var R2 = cur(), rect = cv.getBoundingClientRect();
        var padL = 20, padR = 20, w = rect.width;
        var frac = (ev.clientX - rect.left - padL)/(w - padL - padR);
        if (frac < 0) frac = 0; if (frac > 1) frac = 1;
        var u = R2.lo + frac*R2.w;
        st.mark = Math.round(u/R2.snap)*R2.snap;
        var e = document.getElementById('lpVal');
        if (e) e.textContent = fmtU(st.mark, R2.dec + 1);
        draw();
      });
      draw();
      setTimeout(draw, 60);
    }
    function finish(){
      st.done = true;
      wrap.innerHTML =
        '<div class="iw-tag">'+T({es:'La lupa', en:'The magnifier'})+'</div>'+
        '<div class="iw-box"><div class="wdone">✓ '+T({
          es:'Tres acercamientos y el hueco nunca se cerró: entre dos racionales siempre queda otro.',
          en:'Three zooms and the gap never closed: between two rationals there is always another one.'
        })+'</div></div>';
    }
    function next(){
      st.busy = false; st.r++;
      if (st.r >= 3){ finish(); return; }
      st.mark = null; st.tries = 0; render();
    }
    window.lpChk = function(){
      if (st.busy || st.done) return;
      var R = cur(), fb = document.getElementById('lpFb');
      if (st.mark === null){
        if (fb) fb.textContent = T({
          es:'Primero toca la recta para colocar tu punto dentro de la franja dorada.',
          en:'First tap the line to place your point inside the golden band.'
        });
        return;
      }
      if (st.mark > R.a && st.mark < R.b){
        st.busy = true;
        if (fb) fb.innerHTML = '<span class="okmsg">✓ '+T({
          es:fmtU(st.mark, R.dec+1)+' queda a la derecha de '+fmtU(R.a, R.dec)+' y a la izquierda de '+fmtU(R.b, R.dec)+', así que está entre los dos. Y el hueco no se acabó: la lupa puede acercarse otra vez.',
          en:fmtU(st.mark, R.dec+1)+' lies to the right of '+fmtU(R.a, R.dec)+' and to the left of '+fmtU(R.b, R.dec)+', so it sits between them. And the gap is not gone: the magnifier can zoom in again.'
        })+'</span>';
        setTimeout(next, 2000);
        return;
      }
      st.tries++;
      if (st.tries >= 3){
        st.busy = true;
        st.mark = Math.round(((R.a + R.b)/2)/R.snap)*R.snap;
        render();
        var f2 = document.getElementById('lpFb');
        if (f2) f2.innerHTML = T({
          es:'Un punto que siempre funciona es el de en medio: '+fmtU(st.mark, R.dec+1)+' queda justo a la mitad entre los dos, y con una cifra decimal más siempre alcanza.',
          en:'One point that always works is the middle one: '+fmtU(st.mark, R.dec+1)+' lands exactly halfway between them, and one more decimal place is always enough.'
        });
        setTimeout(next, 2800);
        return;
      }
      if (st.mark <= R.a){
        if (fb) fb.textContent = T({
          es:'Tu punto quedó en '+fmtU(R.a, R.dec)+' o antes. El hueco está a la derecha de ese número: muévete un poco hacia allá.',
          en:'Your point landed at '+fmtU(R.a, R.dec)+' or before. The gap is to the right of that number: move a little that way.'
        });
      } else {
        if (fb) fb.textContent = T({
          es:'Tu punto se pasó de '+fmtU(R.b, R.dec)+'. El hueco está a la izquierda de ese número: regresa un poco.',
          en:'Your point went past '+fmtU(R.b, R.dec)+'. The gap is to the left of that number: come back a little.'
        });
      }
    };
    render();
  })();

  /* ---- PROBLEMA 9 ---- */
  addProb(v9 === 0 ? {
    title:{es:'Un número en medio', en:'A number in between'},
    q:{es:'¿Cuál de estos números queda entre '+mn('-0.'+(p9k+1))+' y '+mn('-0.'+p9k)+' en la recta numérica?',
       en:'Which of these numbers lies between '+mn('-0.'+(p9k+1))+' and '+mn('-0.'+p9k)+' on the number line?'},
    options:[ mn('-0.'+p9k+'5'), mn('-0.'+(p9k+1)+'5'), mn('-0.'+(p9k-1)+'5'), '0.'+p9k+'5' ],
    correct: mn('-0.'+p9k+'5'),
    hint:{es:'Escribe los tres números con la misma cantidad de cifras decimales y ubícalos: el buscado va a la derecha del menor y a la izquierda del mayor.',
          en:'Write the three numbers with the same number of decimal places and place them: the one you want goes to the right of the smaller and to the left of the greater.'},
    exp:{es:mn('-0.'+p9k+'5')+' está a la derecha de '+mn('-0.'+(p9k+1))+' y a la izquierda de '+mn('-0.'+p9k)+', así que cae justo en el hueco. '+mn('-0.'+(p9k+1)+'5')+' se pasa hacia la izquierda, '+mn('-0.'+(p9k-1)+'5')+' se pasa hacia la derecha y el positivo queda del otro lado del cero.',
         en:mn('-0.'+p9k+'5')+' lies to the right of '+mn('-0.'+(p9k+1))+' and to the left of '+mn('-0.'+p9k)+', so it falls right in the gap. '+mn('-0.'+(p9k+1)+'5')+' overshoots to the left, '+mn('-0.'+(p9k-1)+'5')+' overshoots to the right and the positive one lands on the other side of zero.'},
    showWork:true
  } : {
    title:{es:'Un número en medio', en:'A number in between'},
    q:{es:'¿Cuál de estos números queda entre 0.'+p9j+' y 0.'+p9j+'1 en la recta numérica?',
       en:'Which of these numbers lies between 0.'+p9j+' and 0.'+p9j+'1 on the number line?'},
    options:[ '0.'+p9j+'05', '0.'+p9j+'2', '0.'+(p9j+1), '0.0'+p9j ],
    correct: '0.'+p9j+'05',
    hint:{es:'Cuando dos números se diferencian en una centésima, hay que buscar el punto intermedio usando una cifra decimal más.',
          en:'When two numbers differ by one hundredth, look for the middle point using one more decimal place.'},
    exp:{es:'0.'+p9j+'05 tiene una milésima más que 0.'+p9j+' y una menos que 0.'+p9j+'1, así que cae dentro del hueco. 0.'+p9j+'2 y 0.'+(p9j+1)+' se pasan hacia la derecha, y 0.0'+p9j+' se queda muy a la izquierda porque es diez veces más pequeño.',
         en:'0.'+p9j+'05 has one more thousandth than 0.'+p9j+' and one less than 0.'+p9j+'1, so it falls inside the gap. 0.'+p9j+'2 and 0.'+(p9j+1)+' overshoot to the right, and 0.0'+p9j+' stays far to the left because it is ten times smaller.'},
    showWork:true
  });

  /* ---- PROBLEMA 10 ---- */
  addProb(v10 === 0 ? {
    title:{es:'Cuántos caben', en:'How many fit'},
    q:{es:'Entre los números 0.'+p10t+' y 0.'+(p10t+1)+', ¿cuántos números racionales hay?',
       en:'Between the numbers 0.'+p10t+' and 0.'+(p10t+1)+', how many rational numbers are there?'},
    options:{
      es:['Una cantidad infinita.',
          'Exactamente nueve, los que se escriben con dos cifras decimales.',
          'Solo uno, el que queda justo a la mitad.',
          'Ninguno, porque son dos décimas seguidas.'],
      en:['An infinite amount.',
          'Exactly nine, the ones written with two decimal places.',
          'Only one, the one lying exactly halfway.',
          'None, because they are two consecutive tenths.']
    },
    correct:{es:'Una cantidad infinita.', en:'An infinite amount.'},
    hint:{es:'Después de encontrar uno, vuelve a preguntar lo mismo con ese número nuevo y el extremo más cercano.',
          en:'After finding one, ask the same question again using that new number and the nearest endpoint.'},
    exp:{es:'Con dos cifras decimales ya aparecen nueve números, pero al usar tres cifras aparecen más, y el proceso nunca se detiene. Esa es la densidad de Q: entre dos racionales distintos siempre queda otro, así que hay una cantidad infinita.',
         en:'With two decimal places nine numbers already appear, but with three decimal places more show up, and the process never stops. That is the density of Q: between two different rationals there is always another one, so there is an infinite amount.'},
    showWork:false
  } : {
    title:{es:'Cuántos caben', en:'How many fit'},
    q:{es:'¿Cuál de estas afirmaciones sobre los números racionales es verdadera?',
       en:'Which of these statements about rational numbers is true?'},
    options:{
      es:['Entre dos racionales distintos siempre se puede encontrar otro racional.',
          'Cada racional tiene un racional siguiente, igual que cada entero tiene un entero siguiente.',
          'Entre dos racionales solo se puede encontrar otro cuando los dos son positivos.',
          'Entre dos racionales que se diferencian en una décima ya no cabe ningún otro.'],
      en:['Between two different rationals another rational can always be found.',
          'Each rational has a next rational, just as each integer has a next integer.',
          'Between two rationals another one can be found only when both are positive.',
          'Between two rationals that differ by one tenth no other one fits.']
    },
    correct:{es:'Entre dos racionales distintos siempre se puede encontrar otro racional.',
             en:'Between two different rationals another rational can always be found.'},
    hint:{es:'Prueba cada afirmación con un ejemplo tuyo, y recuerda que el punto de en medio siempre se puede calcular.',
          en:'Test each statement with an example of your own, and remember that the middle point can always be worked out.'},
    exp:{es:'El punto que queda a la mitad de dos racionales siempre es racional, y eso funciona con negativos igual que con positivos, y con huecos tan pequeños como se quiera. Por eso no existe el racional siguiente: cualquier candidato deja otros por delante.',
         en:'The point halfway between two rationals is always rational, and that works with negatives just as with positives, and with gaps as small as you like. That is why there is no next rational: any candidate leaves others ahead of it.'},
    showWork:false
  });
}
</script>

<!-- LIAXA ANALYTICS -->
<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbykkuJ_apGq3vALIFd4mr3acu81c7K4OKxW-DZ-i52Ceyl3lOanXMdvbS9SIXPrLQBm/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'El conjunto Q: números racionales y sus propiedades';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
