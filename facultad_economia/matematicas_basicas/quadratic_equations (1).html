      hint: { es: 'El punto de equilibrio existe solo mientras la ecuación P = 0 tenga solución real. Escribe el discriminante en términos de F y pregunta hasta dónde se mantiene sin ser negativo.',
              en: 'Break-even exists only while the equation P = 0 has a real solution. Write the discriminant in terms of F and ask how far it stays non-negative.' },
      exp: { es: 'Para P = 0: a = ' + nstr(-a) + ', b = ' + b + ', c = ' + MINUS + 'F, así que D = ' + (b * b) + ' ' + MINUS + ' ' + (4 * a) + 'F. Hay solución mientras D ≥ 0, es decir mientras F ≤ ' + (b * b) + ' ÷ ' + (4 * a) + ' = ' + nstr(F0) + '. Con F = ' + nstr(F0) + ' queda un solo punto de equilibrio.',
             en: 'For P = 0: a = ' + nstr(-a) + ', b = ' + b + ', c = ' + MINUS + 'F, so D = ' + (b * b) + ' ' + MINUS + ' ' + (4 * a) + 'F. A solution exists while D ≥ 0, that is while F ≤ ' + (b * b) + ' ÷ ' + (4 * a) + ' = ' + nstr(F0) + '. At F = ' + nstr(F0) + ' a single break-even point remains.' },
      opts: { es: o, en: o }, showWork: true
    });
  })();

  /* ══════════════════ FINAL ASSESSMENT ══════════════════ */
  addSection(function() {
    return L({
      es: '<div class="stag">Evaluación final</div><h2>De la historia a la decisión</h2><p>Cuatro problemas que recorren todo el camino. Esta vez no hay guía: elige tú el método.</p>',
      en: '<div class="stag">Final assessment</div><h2>From the story to the decision</h2><p>Four problems that cover the whole path. No guidance this time: choose the method yourself.</p>'
    });
  });

  /* ── P7 · revenue target, full solve (gated, multi-step) ── */
  (function() {
    var S = pick([
      { es: 'Una operadora turística en Manzanillo vende', en: 'A tour operator in Manzanillo sells', ues: 'recorridos en kayak', uen: 'kayak tours' },
      { es: 'Una escuela de cocina vende', en: 'A cooking school sells', ues: 'talleres', uen: 'workshops' },
      { es: 'Un estudio de fotografía vende', en: 'A photography studio sells', ues: 'sesiones', uen: 'sessions' }
    ], rng);
    var k = pick([2, 3, 4], rng), x1 = pick([100, 150, 200, 250], rng), x2 = x1 + pick([100, 200], rng), N = k * (x1 + x2), T = k * x1 * x2;
    var o = distinct4(x1, [x2, x1 + x2, (x1 + x2) / 2, x2 - x1, x1 + 50], function(v) { return '$' + nstr(v); });
    addProb({
      title: { es: 'Una meta de ingreso', en: 'A revenue target' },
      q: { es: S.es + ' ' + mx(N + ' ' + MINUS + ' ' + k + 'x') + ' ' + S.ues + ' al mes cuando el precio es de $x. Para cubrir los costos de la temporada necesita un ingreso mensual de exactamente ' + money(T) + '. ¿Cuál es el menor precio que lo consigue?',
           en: S.en + ' ' + mx(N + ' ' + MINUS + ' ' + k + 'x') + ' ' + S.uen + ' per month when the price is $x. To cover the costs of the season it needs a monthly revenue of exactly ' + money(T) + '. What is the lowest price that achieves it?' },
      hint: { es: 'Escribe el ingreso como precio por unidades vendidas e iguálalo a la meta. Lleva la ecuación a la forma estándar y simplifícala antes de resolver. Aparecerán dos precios.',
              en: 'Write revenue as price times units sold and set it equal to the target. Take the equation to standard form and simplify it before solving. Two prices will appear.' },
      exp: { es: 'x(' + N + ' ' + MINUS + ' ' + k + 'x) = ' + T + ' da ' + poly(k, -N, T) + ' = 0. Al dividir entre ' + k + ': ' + poly(1, -(x1 + x2), x1 * x2) + ' = 0, es decir (x ' + MINUS + ' ' + x1 + ')(x ' + MINUS + ' ' + x2 + ') = 0. Tanto $' + x1 + ' como $' + x2 + ' alcanzan la meta; el menor precio es $' + x1 + '.',
             en: 'x(' + N + ' ' + MINUS + ' ' + k + 'x) = ' + T + ' gives ' + poly(k, -N, T) + ' = 0. Dividing by ' + k + ': ' + poly(1, -(x1 + x2), x1 * x2) + ' = 0, that is (x ' + MINUS + ' ' + x1 + ')(x ' + MINUS + ' ' + x2 + ') = 0. Both $' + x1 + ' and $' + x2 + ' reach the target; the lowest price is $' + x1 + '.' },
      opts: { es: o, en: o }, showWork: true
    });
  })();

  /* ── P8 · where is the profit? (interpretation, no work area) ── */
  (function() {
    var S = pick([
      { es: 'una panadería', en: 'a bakery' },
      { es: 'una fábrica de velas', en: 'a candle factory' },
      { es: 'un taller de serigrafía', en: 'a screen-printing shop' }
    ], rng);
    var r = rint(rng, 3, 5), s = rint(rng, r + 4, 13), mid = rint(rng, r + 1, s - 1), B = r + s, C = r * s;
    var Pm = -mid * mid + B * mid - C;
    var vals = distinct4(mid * 100, [(r - 1) * 100, (s + 2) * 100, r * 100, (s + 1) * 100, (r - 2) * 100], function(v) { return String(v); });
    addProb({
      title: { es: '¿Dónde está la utilidad?', en: 'Where is the profit?' },
      q: { es: 'Para ' + S.es + ', la utilidad es ' + mx('P = ' + poly(-1, B, -C)) + ' (x en cientos de unidades), y al resolver P = 0 se obtiene x = ' + r + ' y x = ' + s + '. ¿Con cuál de estos niveles de producción obtiene utilidad?',
           en: 'For ' + S.en + ', profit is ' + mx('P = ' + poly(-1, B, -C)) + ' (x in hundreds of units), and solving P = 0 gives x = ' + r + ' and x = ' + s + '. At which of these production levels does it earn a profit?' },
      hint: { es: 'Los puntos de equilibrio dividen el eje de producción en tres zonas. Prueba un valor de x en una zona para ver el signo de P.',
              en: 'The break-even points split the production axis into three zones. Test one value of x in a zone to see the sign of P.' },
      exp: { es: 'Con coeficiente negativo en el término cuadrático, la utilidad es positiva solo entre los puntos de equilibrio, de ' + thou(r * 100) + ' a ' + thou(s * 100) + ' unidades. Con ' + thou(mid * 100) + ' unidades (x = ' + mid + '), P = ' + Pm + '. Con ' + thou(r * 100) + ' unidades la utilidad es exactamente cero.',
             en: 'With a negative coefficient on the squared term, profit is positive only between the break-even points, from ' + thou(r * 100) + ' to ' + thou(s * 100) + ' units. At ' + thou(mid * 100) + ' units (x = ' + mid + '), P = ' + Pm + '. At ' + thou(r * 100) + ' units profit is exactly zero.' },
      opts: { es: vals.map(function(v) { return thou(Number(v)) + ' unidades'; }), en: vals.map(function(v) { return thou(Number(v)) + ' units'; }) },
      showWork: false
    });
  })();

  /* ── P9 · market equilibrium, reject the negative root (gated) ── */
  (function() {
    var S = pick([{ es: 'mango', en: 'mango' }, { es: 'limón', en: 'lime' }, { es: 'papaya', en: 'papaya' }], rng);
    var r = rint(rng, 2, 6), B = rint(rng, 1, 3), C = rint(rng, 1, 4), s = r + B + C, E = rint(rng, 4, 12), A = E + r * s;
    var o = distinct4(r, [s, s - r, r + s, r * s, r + 1], function(v) { return 'x = ' + nstr(v); });
    addProb({
      title: { es: 'Equilibrio de mercado', en: 'Market equilibrium' },
      q: { es: 'En un mercado regional de ' + S.es + ', la demanda es ' + mx('p = ' + poly(0, -B, A)) + ' y la oferta es ' + mx('p = ' + poly(1, C, E)) + ', donde x es la cantidad en miles de toneladas y p el precio por kilogramo, en pesos. ¿Cuál es la cantidad de equilibrio?',
           en: 'In a regional ' + S.en + ' market, demand is ' + mx('p = ' + poly(0, -B, A)) + ' and supply is ' + mx('p = ' + poly(1, C, E)) + ', where x is the quantity in thousands of tonnes and p is the price per kilogram, in pesos. What is the equilibrium quantity?' },
      hint: { es: 'En el equilibrio, la oferta es igual a la demanda. Iguala las dos expresiones, lleva el resultado a la forma estándar y pregunta cuál solución puede ser una cantidad.',
              en: 'At equilibrium, supply equals demand. Set the two expressions equal, take the result to standard form, and ask which solution can be a quantity.' },
      exp: { es: 'Al igualar: ' + poly(1, C, E) + ' = ' + poly(0, -B, A) + ', que en forma estándar es ' + poly(1, B + C, -r * s) + ' = 0, es decir (x ' + MINUS + ' ' + r + ')(x + ' + s + ') = 0. Las soluciones son x = ' + r + ' y x = ' + nstr(-s) + '. Una cantidad no puede ser negativa: el equilibrio está en x = ' + r + ' mil toneladas.',
             en: 'Setting them equal: ' + poly(1, C, E) + ' = ' + poly(0, -B, A) + ', which in standard form is ' + poly(1, B + C, -r * s) + ' = 0, that is (x ' + MINUS + ' ' + r + ')(x + ' + s + ') = 0. The solutions are x = ' + r + ' and x = ' + nstr(-s) + '. A quantity cannot be negative: equilibrium is at x = ' + r + ' thousand tonnes.' },
      opts: { es: o, en: o }, showWork: true
    });
  })();

  /* ── P10 · reporting the discriminant (interpretation, structural variants) ── */
  (function() {
    var city = pick(['Tepic', 'Zamora', 'Uruapan', 'Ciudad Guzmán'], rng), v = Math.floor(rng() * 3), b, c, D, oEs, oEn, eEs, eEn;
    var T = {
      none: ['Nunca llega al equilibrio y pierde dinero en todos los niveles.', 'It never breaks even and loses money at every level.'],
      one:  ['Llega al equilibrio en un nivel y nunca obtiene utilidad.', 'It breaks even at one level and never earns a profit.'],
      two:  ['Llega al equilibrio en dos niveles y gana entre ellos.', 'It breaks even at two levels and profits between them.'],
      x1:   ['Nunca llega al equilibrio y gana dinero en todos los niveles.', 'It never breaks even and earns a profit at every level.'],
      x2:   ['Llega al equilibrio en dos niveles y gana fuera de ellos.', 'It breaks even at two levels and profits outside them.'],
      x3:   ['Llega al equilibrio en un nivel y gana a partir de él.', 'It breaks even at one level and profits beyond it.']
    }, keys;
    if (v === 0) {
      b = pick([6, 8, 10, 12], rng); c = b * b / 4 + rint(rng, 1, 6); keys = ['none', 'x1', 'one', 'two'];
      eEs = 'D es negativo: P = 0 no tiene solución real, así que la utilidad nunca llega a cero. Como el coeficiente del término cuadrático es negativo, la utilidad se mantiene por debajo de cero en todos los niveles.';
      eEn = 'D is negative: P = 0 has no real solution, so profit never reaches zero. Because the coefficient of the squared term is negative, profit stays below zero at every level.';
    } else if (v === 1) {
      b = pick([6, 8, 10, 12], rng); c = b * b / 4; keys = ['one', 'x3', 'none', 'two'];
      eEs = 'D es cero: P = 0 tiene una sola solución, x = ' + (b / 2) + '. Ahí la utilidad toca el cero; en cualquier otro nivel es negativa, porque el coeficiente del término cuadrático es negativo.';
      eEn = 'D is zero: P = 0 has a single solution, x = ' + (b / 2) + '. Profit touches zero there; at any other level it is negative, because the coefficient of the squared term is negative.';
    } else {
      var r = rint(rng, 2, 4), s = rint(rng, r + 2, 9); b = r + s; c = r * s; keys = ['two', 'x2', 'one', 'none'];
      eEs = 'D es positivo: P = 0 tiene dos soluciones, x = ' + r + ' y x = ' + s + '. Como el coeficiente del término cuadrático es negativo, la utilidad es positiva solo entre esos dos niveles.';
      eEn = 'D is positive: P = 0 has two solutions, x = ' + r + ' and x = ' + s + '. Because the coefficient of the squared term is negative, profit is positive only between those two levels.';
    }
    D = b * b - 4 * c;
    oEs = keys.map(function(k) { return T[k][0]; }); oEn = keys.map(function(k) { return T[k][1]; });
    addProb({
      title: { es: 'El reporte del discriminante', en: 'Reporting the discriminant' },
      q: { es: 'En la sucursal ' + city + ', la utilidad es ' + mx('P = ' + poly(-1, b, -c)) + ' y la ecuación P = 0 tiene discriminante D = ' + nstr(D) + '. ¿Qué reporte a la dirección es correcto?',
           en: 'For the ' + city + ' branch, profit is ' + mx('P = ' + poly(-1, b, -c)) + ' and the equation P = 0 has discriminant D = ' + nstr(D) + '. Which report to management is accurate?' },
      hint: { es: 'El signo de D indica cuántas veces la utilidad llega a cero. El coeficiente negativo del término cuadrático indica de qué lado del cero se mantiene.',
              en: 'The sign of D tells how many times profit reaches zero. The negative coefficient of the squared term tells on which side of zero it stays.' },
      exp: { es: eEs, en: eEn },
      opts: { es: oEs, en: oEn }, showWork: false
    });
  })();
}

/* ════════════════════════════════════════════════════════════════════════
   SESSION PERSISTENCE HOOKS  (Rule 17; pagehide + visibilitychange for iOS Safari)
   ════════════════════════════════════════════════════════════════════════ */
window.addEventListener('beforeunload', saveSession);
window.addEventListener('pagehide', saveSession);
document.addEventListener('visibilitychange', function() { if (document.hidden) saveSession(); });
</script>
