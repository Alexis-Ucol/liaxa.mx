<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clasificación de Organismos y Parentesco</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Clasificación de Organismos y Parentesco</div>
    <div class="wcourse" id="wcourse-el">Biología · 1° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Clasificación de Organismos y Parentesco</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="sbtn" id="dlBtn" onclick="generatePDF()" style="max-width:280px;margin:0 auto;">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   CENTRALIZED SCHOOL CONFIG (Rule 16) — ships UNBRANDED (Rule 11).
   The ONLY rebranding point. build_all.py substitutes these exact fields
   (BRAND_FIELDS / RGB_FIELDS / logo*) downstream; :root/dark stay as fallback.
   Neutral defaults below == the static :root/dark values, so unbranded == no-op.
   ══════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:'#2d3194', primaryDark:'#121441', primaryBg:'#e9e9f4',
  accent:'#c9a84c', accentBg:'#f7f1e3',
  darkPrimary:'#5256b8', darkPrimaryDark:'#8084da', darkPrimaryBg:'#111235',

function getAttemptKey(name, group){ return 'bio1_t05_g02__att__' + (name+'__'+group).replace(/\s+/g,'_'); }

function lsKey() {

function saveSession() {
  if (!studentData.name) return;
  var drawings = [], texts = [], photos = [];
  problems.forEach(function(p, i) {
    var dc = document.getElementById('dc' + i);
    if (dc && dc.width) {
      var blank = document.createElement('canvas');
      blank.width = dc.width; blank.height = dc.height;
      drawings.push(dc.toDataURL() === blank.toDataURL() ? null : dc.toDataURL('image/png'));
    } else { drawings.push(null); }
    var ta = document.getElementById('ta' + i);
    texts.push(ta ? ta.value : '');
    var pp = document.getElementById('pp' + i);
    photos.push((pp && pp.src && pp.src.indexOf('data:') === 0) ? pp.src : null);
  });
  var state = {
    name: studentData.name, group: studentData.group,
    answeredCount: answeredCount, correctCount: correctCount,
    choices: problems.map(function(p) { return p.studentChoice; }),
    drawings: drawings, texts: texts, photos: photos
  };
  try { localStorage.setItem(lsKey(), JSON.stringify(state)); } catch(e) {}
}

function loadSession(name, group) {
  var key = 'bio1_t05_g02__' + (name + '__' + group).replace(/\s+/g, '_');
  try { var r = localStorage.getItem(key); return r ? JSON.parse(r) : null; } catch(e) { return null; }
}

function restoreSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  var saved = loadSession(name, group);
  if (!saved) return;
  document.getElementById('restoreBar').style.display = 'none';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = currentAttempt(name, group);
  buildLesson(seededRng(name + group + att));
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
  saved.choices.forEach(function(choice, idx) {
    if (choice !== null && choice !== undefined) confirmMC(idx, choice);
  });
  setTimeout(function() {
    if (saved.drawings) {
      saved.drawings.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var dc = document.getElementById('dc' + i);
        if (!dc || !dc.width) return;
        var img = new Image();
        img.onload = function() {
          var dpr = window.devicePixelRatio || 1;
          dc.getContext('2d').drawImage(img, 0, 0, dc.width / dpr, dc.height / dpr);
        };
        img.src = dataUrl;
      });
    }
    if (saved.texts) {
      saved.texts.forEach(function(text, i) {
        if (!text) return;
        var ta = document.getElementById('ta' + i);
        if (ta) ta.value = text;
      });
    }
    if (saved.photos) {
      saved.photos.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var pp = document.getElementById('pp' + i);
        if (!pp) return;
        pp.src = dataUrl; pp.style.display = 'block';
        var pz = document.getElementById('pz' + i);
        if (pz) pz.style.opacity = '0.4';
      });
    }
  }, 300);
}

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

  document.getElementById('studentChip').textContent = name + ' · ' + group;

    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

async function generatePDF() {
  var btn = document.getElementById('dlBtn');
  btn.textContent = 'Generando PDF…';
  btn.disabled = true;

  var jspdf   = window.jspdf;
  var doc     = new jspdf.jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });
  var PW      = 215.9;
  var M       = 18;
  var TW      = PW - M * 2;
  var PH      = doc.internal.pageSize.height;
  var name    = studentData.name;
  var group   = studentData.group;
  var total   = problems.length;
  var pct     = Math.round(correctCount / total * 100);
  var dateStr = new Date().toLocaleString('es-MX', { dateStyle:'long', timeStyle:'short' });

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS — INJECTION BLOCK ─────────────────────────────────────────
  //   Match these RGB values to --green and --gold above.
  //   PRIMARY  → pBR, pBG, pBB
  //   ACCENT   → pAR, pAG, pAB
  // ──────────────────────────────────────────────────────────────────────────
  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;  // PRIMARY (from SCHOOL, Rule 16)
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;   // ACCENT (from SCHOOL, Rule 16)

  function pdfText(html) {
    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/\u2192/g,'->').replace(/\u2212/g,'-').replace(/\u00b2/g,'^2')
      .replace(/\u00b3/g,'^3').replace(/\u00d7/g,'x').replace(/\u00f7/g,'/')
      .replace(/\u2260/g,'!=').replace(/\u2264/g,'<=').replace(/\u2265/g,'>=')
      .replace(/\u221a/g,'sqrt').replace(/\u03c0/g,'pi').replace(/\u2026/g,'...')
      .replace(/\s+/g,' ').trim();
  }

  // ── PORTADA: orange line / white logo strip / orange line / blue band ──
  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,2,'F');   // top accent line
  doc.setFillColor(255,255,255); doc.rect(0,2,PW,26,'F');                               // white logo strip
  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,28,PW,2,'F');  // bottom accent line
  doc.setFillColor(pBR,pBG,pBB); doc.rect(0,30,PW,34,'F');       // blue header band

  if (SCHOOL.logoLeftB64) {
    var fmtL = SCHOOL.logoLeftB64.indexOf('/9j/') > -1 ? 'JPEG' : 'PNG';
    try { doc.addImage(SCHOOL.logoLeftB64, fmtL, M, 4, 48, 22); } catch(e) {}
  }
  if (SCHOOL.logoRightB64) {
    var fmtR = SCHOOL.logoRightB64.indexOf('/9j/') > -1 ? 'JPEG' : 'PNG';
    try { doc.addImage(SCHOOL.logoRightB64, fmtR, 130, 4, 48, 22); } catch(e) {}
  }

  var lx = PW - M - 36;
  var ly = 10;
  doc.setDrawColor(pBR,pBG,pBB); doc.setLineWidth(0.7);
  doc.lines([[2.57-1.03,4.63-6.17],[4.11-2.57,5.14-4.63],[5.66-4.11,2.57-5.14]], lx+1.03, ly+6.17);
  doc.setFillColor(pAR,pAG,pAB); doc.circle(lx+5.66, ly+2.57, 0.9, 'F');
  doc.setDrawColor(pAR,pAG,pAB); doc.setLineWidth(0.7);
  doc.line(lx+8.23, ly+1.54, lx+8.23, ly+7.2);
  doc.setTextColor(pBR,pBG,pBB); doc.setFontSize(11); doc.setFont('helvetica','bold');
  doc.text('LIAXA', lx+10, ly+6.8);

  // Guide title + date inside the blue band
  doc.setTextColor(232,238,247); doc.setFontSize(19); doc.setFont('helvetica','bold');
  doc.text(t('wtitle'), M, 49);
  doc.setTextColor(150,165,200); doc.setFontSize(8); doc.setFont('helvetica','normal');
  doc.text(dateStr, M, 59);

  // ── Student info card (name + group only — código goes to footer) ──
  doc.setFillColor(237,240,245); doc.roundedRect(M,72,TW,20,3,3,'F');
  doc.setTextColor(130,140,160); doc.setFontSize(8.5); doc.setFont('helvetica','bold');
  doc.text('ALUMNO', M+4, 79); doc.text('GRUPO', 130, 79);
  doc.setTextColor(20,24,32); doc.setFontSize(11); doc.setFont('helvetica','bold');
  doc.text(name, M+4, 87); doc.text(group, 130, 87);

  // ── Score box ──
  var sc = pct>=70?[26,106,74]:pct>=50?[224,123,26]:[176,48,16];

    }

    var pp = document.getElementById('pp'+i);
    if (pp && pp.src && pp.src.indexOf('data:') === 0) {
      if (wy > PH-55) { doc.addPage(); wy = 20; }
      try { doc.addImage(pp.src, 'JPEG', M, wy, TW, 68); wy += 72; } catch(e) {}
    }
  }

  // ── Footer on every page ──
  var pages = doc.internal.getNumberOfPages();
  for (var p = 1; p <= pages; p++) {
    doc.setPage(p);
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0, PH-3, PW, 3, 'F');
    doc.setTextColor(130,140,160); doc.setFontSize(6.5); doc.setFont('helvetica','normal');
    doc.text(name+'  ·  '+group+'  ·  Código: '+code+'  ·  Página '+p+'/'+pages,
      PW/2, PH-5, {align:'center'});
  }

  doc.save('bio1_t05_g02_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf');
  btn.innerHTML = '⬇ &nbsp;Descargar Resultados PDF';
  btn.disabled  = false;
}

function L(o){ return (o && o[LANG] !== undefined) ? o[LANG] : (o ? o.es : ''); }
function ri(rng, a, b){ return a + Math.floor(rng() * (b - a + 1)); }
function pk(rng, a){ return a[Math.floor(rng() * a.length)]; }

function mcSpec(v){
  return { title:L(v.title), q:L(v.q), fn:'', options:L(v.opts), correct:(v.ci||0), hint:L(v.hint), exp:L(v.exp), showWork:false };
}

function say(host, cls, msg){
  var e = host.querySelector('.gw-fb');
  if (!e) return;
  e.className = 'gw-fb' + (cls ? ' ' + cls : '');
  e.innerHTML = msg;
}

function rcard(name, form, note){
  return '<div class="rcard"><div class="rname">' + name + '</div><div class="rform">' + form + '</div><div class="rnote">' + note + '</div></div>';
}

function sec(tag, title, html){
  var d = document.createElement('div');
  d.className = 'section';
  d.innerHTML = '<div class="stag">' + tag + '</div><h2>' + title + '</h2>' + html;
  document.getElementById('lessonBody').appendChild(d);
  return d;
}

function widgetHost(parent, id){
  var d = document.createElement('div');
  d.className = 'gw';
  d.id = id;
  parent.appendChild(d);
  return d;
}

function addProblem(rng, spec){
  var idx = problems.length;
  var correctVal = spec.options[spec.correct];
  var sh = shuffle(spec.options, rng);
  var prob = {
    title: spec.title,
    questionText: spec.q,
    fn: spec.fn || '',
    hint: spec.hint || '',
    explanation: spec.exp || '',
    options: sh,
    correctIdx: sh.indexOf(correctVal),
    showWork: !!spec.showWork,
    studentChoice: null,
    pendingChoice: null
  };
  problems.push(prob);
  buildOneCard(prob, idx);
}

/* ══════════════════════════════════════════════════════════════════════════
   buildLesson :: concepto -> manipulativo -> problema, alternados (Rule 1)
   ══════════════════════════════════════════════════════════════════════════ */
function buildLesson(rng){
  injectGuideCSS();

  /* ── Apertura ── */
  sec(
    L({ es:'Punto de partida', en:'Starting point' }),
    L({ es:'Un cajón con doscientas cosas vivas', en:'A drawer with two hundred living things' }),
    '<p>' + L({
      es:'Imagina que llega al laboratorio de tu escuela una caja con doscientos organismos recolectados en un día de campo: hierbas, insectos, hongos, caracoles, algas del arroyo. Nadie puede estudiarlos así, uno por uno y sin orden. Lo primero que hace cualquier persona que trabaja con seres vivos es lo mismo que harías tú con doscientas canciones o doscientas fotos: repartirlas en grupos. Y en cuanto empiezas a repartir aparece la pregunta que sostiene toda esta guía: ¿repartir según qué?',
      en:'Imagine a box arriving at your school lab with two hundred organisms collected on a field day: herbs, insects, fungi, snails, algae from the stream. Nobody can study them like that, one by one and with no order. The first thing anyone who works with living things does is exactly what you would do with two hundred songs or two hundred photos: sort them into groups. And as soon as you start sorting, the question that holds this whole guide together shows up: sort them according to what?'
    }) + '</p>' +
    '<div class="callout"><p><strong>' + L({ es:'Lo que vas a hacer: ', en:'What you are going to do: ' }) + '</strong>' + L({
      es:'vas a repartir los mismos seis organismos tres veces con criterios distintos, a recorrer una clave que identifica un organismo con preguntas encadenadas, a combinar rasgos hasta dejar exactamente el grupo que se te pide, a poner a prueba hasta dónde llega un reparto, a medir cuántas características comparten dos organismos y a decidir qué hacer con una hipótesis cuando la fuente que consultas dice otra cosa.',
      en:'you are going to sort the same six organisms three times with different criteria, walk a key that identifies an organism through chained questions, combine traits until exactly the requested group is left, test how far an arrangement reaches, measure how many characteristics two organisms share and decide what to do with a hypothesis when the source you consult says something else.'
    }) + '</p></div>'
  );

  /* ══ CONCEPTO 1 :: el criterio decide los grupos ══ */
  var s1 = sec(
    L({ es:'Concepto 1', en:'Concept 1' }),
    L({ es:'Clasificar empieza por elegir un criterio', en:'Classifying starts by choosing a criterion' }),
    '<p>' + L({
      es:'Clasificar es repartir organismos en grupos según una característica que comparten. Esa característica elegida se llama criterio, y es la decisión más importante de todo el proceso, porque los grupos no existen antes de ella: aparecen cuando alguien decide en qué fijarse. Si el criterio es la forma de obtener materia y energía, quedan juntos los que fabrican su alimento y separados los que lo toman ya formado. Si el criterio es el ambiente donde viven, quedan juntos los del agua y separados los de tierra firme.',
      en:'Classifying means sorting organisms into groups according to a characteristic they share. That chosen characteristic is called the criterion, and it is the most important decision in the whole process, because the groups do not exist before it: they appear when someone decides what to look at. If the criterion is the way of getting matter and energy, those that make their own food end up together and those that take it ready formed end up apart. If the criterion is the environment where they live, the water ones end up together and the dry land ones apart.'
    }) + '</p>' +
    '<p>' + L({
      es:'De ahí sale un resultado que sorprende la primera vez: los mismos organismos, repartidos con criterios distintos, caen en grupos distintos, y ninguno de los dos repartos está equivocado. Una lechuga y un alga verde quedan juntas bajo el criterio de nutrición y separadas bajo el criterio de ambiente. Por eso, cuando alguien presenta una clasificación, lo primero que hay que preguntar no es si está bien, sino con qué criterio se armó.',
      en:'From there comes a result that surprises you the first time: the same organisms, sorted with different criteria, fall into different groups, and neither of the two arrangements is wrong. A lettuce and a green alga end up together under the nutrition criterion and apart under the environment criterion. That is why, when someone presents a classification, the first thing to ask is not whether it is right, but which criterion it was built with.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Criterio', en:'Criterion' }), L({ es:'la característica elegida', en:'the chosen characteristic' }), L({ es:'sin él no hay grupos', en:'without it there are no groups' })) +
      rcard(L({ es:'Nutrición', en:'Nutrition' }), L({ es:'fabrica o toma el alimento', en:'makes or takes its food' }), L({ es:'separa plantas y algas de animales y hongos', en:'splits plants and algae from animals and fungi' })) +
      rcard(L({ es:'Ambiente', en:'Environment' }), L({ es:'agua o tierra firme', en:'water or dry land' }), L({ es:'junta organismos muy distintos entre sí', en:'puts very different organisms together' })) +
      rcard(L({ es:'Desplazamiento', en:'Movement' }), L({ es:'se mueve de lugar o vive fijo', en:'moves about or lives fixed' }), L({ es:'deja fijos a plantas, algas y hongos', en:'leaves plants, algae and fungi fixed' })) +
    '</div>'
  );
  w1(rng, widgetHost(s1, 'w_criterios'));
  addProblem(rng, mkP1(rng));
  addProblem(rng, mkP2(rng));

  /* ══ CONCEPTO 2 :: clave dicotómica ══ */
  var s2 = sec(
    L({ es:'Concepto 2', en:'Concept 2' }),
    L({ es:'Preguntas encadenadas: la clave dicotómica', en:'Chained questions: the dichotomous key' }),
    '<p>' + L({
      es:'Cuando hay que identificar un organismo desconocido, aplicar un criterio a la vez es lento. Por eso quienes trabajan en el campo usan una clave dicotómica: una cadena de preguntas que solo admiten dos salidas, sí o no. Cada respuesta descarta la mitad de las posibilidades y manda a otra pregunta, hasta llegar a un nombre. La primera pregunta suele ser la que parte el conjunto en dos mitades grandes, por ejemplo si el organismo fabrica su propio alimento; las últimas afinan detalles, como si el cuerpo tiene patas articuladas.',
      en:'When an unknown organism has to be identified, applying one criterion at a time is slow. That is why people who work in the field use a dichotomous key: a chain of questions that allow only two exits, yes or no. Each answer rules out half of the possibilities and sends you on to another question, until you reach a name. The first question is usually the one that splits the set into two large halves, for instance whether the organism makes its own food; the last ones fine tune details, such as whether the body has jointed legs.'
    }) + '</p>' +
    '<p>' + L({
      es:'Una clave sirve solo si sus preguntas se pueden contestar mirando el organismo y si la respuesta es la misma para cualquier persona que lo mire. Preguntar si es bonito o si es común no sirve, porque cada quien contestaría distinto. Preguntar si tiene semillas, si vive fijo o si su cuerpo está cubierto de pelo sí sirve, porque cualquiera que observe llegará a la misma respuesta.',
      en:'A key only works if its questions can be answered by looking at the organism and if the answer is the same for anyone who looks. Asking whether it is pretty or whether it is common is useless, because each person would answer differently. Asking whether it has seeds, whether it lives fixed or whether its body is covered in fur does work, because anyone observing will reach the same answer.'
    }) + '</p>'
  );
  w2(rng, widgetHost(s2, 'w_clave'));
  addProblem(rng, mkP3(rng));

  /* ══ CONCEPTO 3 :: combinar criterios de nutrición y reproducción ══ */
  var s3 = sec(
    L({ es:'Concepto 3', en:'Concept 3' }),
    L({ es:'Dos criterios juntos afinan el grupo', en:'Two criteria together sharpen the group' }),
    '<p>' + L({
      es:'Un solo criterio deja grupos enormes. Dentro de los que toman su alimento ya formado caben una hormiga, un tiburón y un moho, que se parecen en poco más. Por eso los repartos útiles combinan varios criterios a la vez, y los que más se usan son los de nutrición y reproducción, porque tocan funciones que todo ser vivo cumple y que dejan huella en estructuras visibles.',
      en:'A single criterion leaves enormous groups. Among those that take their food ready formed you can fit an ant, a shark and a mould, which have little else in common. That is why useful arrangements combine several criteria at once, and the most used are nutrition and reproduction, because they touch functions that every living thing carries out and that leave a mark on visible structures.'
    }) + '</p>' +
    '<p>' + L({
      es:'En la reproducción hay dos grandes rutas. En la asexual participa un solo progenitor y los nuevos individuos salen prácticamente idénticos a él: la levadura forma una yema que se desprende, la fresa echa un tallo rastrero que enraíza, el moho suelta esporas. En la sexual se juntan células de dos progenitores y el descendiente lleva una mezcla nueva, por eso no es igual a ninguno de los dos. Sumar este criterio al de nutrición parte cada grupo grande en subgrupos mucho más parecidos entre sí.',
      en:'In reproduction there are two large routes. In the asexual one a single parent takes part and the new individuals come out practically identical to it: yeast forms a bud that breaks off, the strawberry sends out a creeping stem that roots, the mould releases spores. In the sexual one cells from two parents come together and the descendant carries a new mixture, which is why it is identical to neither. Adding this criterion to the nutrition one splits each large group into subgroups that are much more alike.'
    }) + '</p>'
  );
  w3(rng, widgetHost(s3, 'w_filtro'));
  addProblem(rng, mkP4(rng));

  /* ══ CONCEPTO 4 :: alcances y limitaciones ══ */
  var s4 = sec(
    L({ es:'Concepto 4', en:'Concept 4' }),
    L({ es:'Hasta dónde llega un reparto', en:'How far an arrangement reaches' }),
    '<p>' + L({
      es:'Toda clasificación responde bien unas preguntas y calla ante otras: eso son sus alcances y sus limitaciones. Un reparto por ambiente deja juntos al tiburón, al delfín y al pulpo, y sirve muy bien para hablar de quién comparte el mar y qué problemas enfrenta ahí. Ese mismo reparto no dice nada de cómo se nutre cada uno, ni de cómo se reproducen, que en esos tres es muy diferente.',
      en:'Every classification answers some questions well and stays silent before others: those are its reach and its limitations. An arrangement by environment leaves the shark, the dolphin and the octopus together, and works very well for talking about who shares the sea and what problems they face there. That same arrangement says nothing about how each one feeds, nor about how they reproduce, which in those three is very different.'
    }) + '</p>' +
    '<p>' + L({
      es:'Reconocer límites no es un defecto del trabajo, es parte de hacerlo bien. Una clasificación por si el organismo vuela junta a un murciélago, una mariposa y un gorrión, y es muy útil para estudiar cómo se sostiene un cuerpo en el aire; sería un error usarla para afirmar que los tres provienen de un mismo antepasado, porque el criterio no fue elegido para eso. Antes de sacar una conclusión conviene preguntar si el criterio que armó los grupos tiene algo que ver con la pregunta que se quiere responder.',
      en:'Recognising limits is not a flaw in the work, it is part of doing it well. A classification by whether the organism flies puts together a bat, a butterfly and a sparrow, and it is very useful for studying how a body holds itself in the air; it would be a mistake to use it to claim that all three come from a single ancestor, because the criterion was not chosen for that. Before drawing a conclusion it helps to ask whether the criterion that built the groups has anything to do with the question you want to answer.'
    }) + '</p>'
  );
  w4(rng, widgetHost(s4, 'w_alcance'));
  addProblem(rng, mkP5(rng));
  addProblem(rng, mkP6(rng));

  /* ══ CONCEPTO 5 :: hipótesis de parentesco ══ */
  var s5 = sec(
    L({ es:'Concepto 5', en:'Concept 5' }),
    L({ es:'De las características compartidas a una hipótesis', en:'From shared characteristics to a hypothesis' }),
    '<p>' + L({
      es:'Cuando dos organismos comparten muchas características, y sobre todo características que tienen que ver con la nutrición, la reproducción y la estructura del cuerpo, cabe proponer una idea razonable: quizá descienden de un mismo antepasado, es decir, quizá están emparentados. Eso es una hipótesis: una explicación provisional que se propone para ponerla a prueba, no una respuesta cerrada.',
      en:'When two organisms share many characteristics, and above all characteristics that have to do with nutrition, reproduction and body structure, a reasonable idea can be put forward: perhaps they descend from a single ancestor, that is, perhaps they are related. That is a hypothesis: a provisional explanation put forward to be tested, not a closed answer.'
    }) + '</p>' +
    '<p>' + L({
      es:'No todas las características pesan lo mismo. Compartir el ambiente pesa poco, porque el mar y el aire empujan a cuerpos muy distintos hacia formas parecidas. Compartir la manera de alimentar a las crías, el tipo de cubierta del cuerpo o la forma de respirar pesa mucho más, porque son características que se heredan y que no cambia el simple hecho de vivir en el mismo lugar. Por eso una hipótesis de parentesco se apoya en varias características profundas coincidiendo a la vez, no en una sola semejanza vistosa.',
      en:'Not all characteristics carry the same weight. Sharing the environment carries little, because the sea and the air push very different bodies towards similar shapes. Sharing the way the young are fed, the type of body covering or the way of breathing carries far more, because those are inherited characteristics that are not changed by the mere fact of living in the same place. That is why a kinship hypothesis rests on several deep characteristics coinciding at once, not on a single showy resemblance.'
    }) + '</p>'
  );
  w5(rng, widgetHost(s5, 'w_parecido'));
  addProblem(rng, mkP7(rng));

  /* ══ CONCEPTO 6 :: contrastar con fuentes ══ */
  var s6 = sec(
    L({ es:'Concepto 6', en:'Concept 6' }),
    L({ es:'La hipótesis se contrasta, no se defiende', en:'A hypothesis gets tested, not defended' }),
    '<p>' + L({
      es:'Una hipótesis de parentesco no se queda como está: se lleva a las fuentes. Libros de biología, colecciones de un museo, guías de campo y registros de quienes estudian esos grupos aportan características que no se pueden ver a simple vista, como la estructura interna del cuerpo o el parecido del material hereditario. Con esa información la hipótesis puede quedar sostenida, puede necesitar un ajuste o puede caerse por completo.',
      en:'A kinship hypothesis does not stay as it is: it is taken to the sources. Biology books, museum collections, field guides and the records of those who study those groups provide characteristics that cannot be seen with the naked eye, such as the internal structure of the body or the resemblance of hereditary material. With that information the hypothesis may end up supported, may need an adjustment or may fall apart completely.'
    }) + '</p>' +
    '<p>' + L({
      es:'Que una hipótesis se caiga no significa que el trabajo estuvo mal hecho. El caso clásico es el del delfín y el tiburón: cuerpo alargado, aletas, misma manera de nadar, y sin embargo el delfín respira con pulmones, tiene crías vivas y las alimenta con leche, igual que una vaca y a diferencia del tiburón. Quien propuso el parentesco a partir de la silueta hizo bien en proponerlo y hace mejor en cambiarlo cuando las fuentes muestran características que no encajan.',
      en:'A hypothesis falling apart does not mean the work was badly done. The classic case is the dolphin and the shark: long body, fins, the same way of swimming, and yet the dolphin breathes with lungs, has live young and feeds them milk, just like a cow and unlike the shark. Whoever proposed kinship from the silhouette did well to propose it and does better to change it when the sources show characteristics that do not fit.'
    }) + '</p>'
  );
  w6(rng, widgetHost(s6, 'w_fuentes'));
  addProblem(rng, mkP8(rng));

  /* ══ CIERRE :: sin explicación previa (Rule 1) ══ */
  sec(
    L({ es:'Para cerrar', en:'To close' }),
    L({ es:'Tú decides', en:'Your call' }),
    '<p>' + L({
      es:'Dos situaciones más, con todo lo que ya trabajaste en la mano.',
      en:'Two more situations, with everything you have already worked on in hand.'
    }) + '</p>'
  );
  addProblem(rng, mkP9(rng));
  addProblem(rng, mkP10(rng));
}
/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 1 :: la mesa de criterios
   Los mismos seis organismos, tres criterios distintos, tres repartos
   distintos. Reversible (toca para cambiar de grupo), pista direccional,
   reveal a la tercera falla (Rule 8).
   ══════════════════════════════════════════════════════════════════════════ */
function w1(rng, host){
  var SETS = [
    [
      { n:{ es:'planta de maíz', en:'maize plant' },            amb:1, nut:0, mov:1 },
      { n:{ es:'alga verde del arroyo', en:'green stream alga' }, amb:0, nut:0, mov:1 },
      { n:{ es:'lenteja de agua', en:'duckweed' },              amb:0, nut:0, mov:1 },
      { n:{ es:'carpa del canal', en:'carp in the canal' },     amb:0, nut:1, mov:0 },
      { n:{ es:'lombriz de tierra', en:'earthworm' },           amb:1, nut:1, mov:0 },
      { n:{ es:'hongo del tronco caído', en:'fungus on the fallen log' }, amb:1, nut:1, mov:1 }
    ],
    [
      { n:{ es:'nopal del patio', en:'prickly pear in the yard' }, amb:1, nut:0, mov:1 },
      { n:{ es:'alga del estanque', en:'pond alga' },            amb:0, nut:0, mov:1 },
      { n:{ es:'planta acuática de acuario', en:'aquarium water plant' }, amb:0, nut:0, mov:1 },
      { n:{ es:'camarón de río', en:'river shrimp' },            amb:0, nut:1, mov:0 },
      { n:{ es:'hormiga del jardín', en:'garden ant' },          amb:1, nut:1, mov:0 },
      { n:{ es:'moho del pan olvidado', en:'mould on forgotten bread' }, amb:1, nut:1, mov:1 }
    ]
  ];
  var CRITS = [
    { k:'nut',
      c:{ es:'cómo obtiene la materia y la energía', en:'how it gets matter and energy' },
      a:{ es:'fabrica su propio alimento', en:'makes its own food' },
      b:{ es:'toma alimento ya formado', en:'takes food already formed' },
      w:{ es:'pregúntate si necesita a otro ser vivo para conseguir materia', en:'ask yourself whether it needs another living thing to get matter' } },
    { k:'amb',
      c:{ es:'el ambiente donde vive', en:'the environment where it lives' },
      a:{ es:'vive en el agua', en:'lives in water' },
      b:{ es:'vive en tierra firme', en:'lives on dry land' },
      w:{ es:'pregúntate dónde tendrías que ir a buscarlo', en:'ask yourself where you would have to go to look for it' } },
    { k:'mov',
      c:{ es:'si cambia de lugar por sí mismo', en:'whether it moves about by itself' },
      a:{ es:'se desplaza', en:'moves about' },
      b:{ es:'vive fijo o a la deriva', en:'lives fixed or adrift' },
      w:{ es:'pregúntate si puede irse a otro sitio cuando algo le molesta', en:'ask yourself whether it can leave for another place when something bothers it' } }
  ];
  var SET = shuffle(pk(rng, SETS), rng);
  var ORDER = shuffle(CRITS, rng);
  var rd = 0, tries = 0, revealed = false, done = false;
  var assign = [-1,-1,-1,-1,-1,-1];

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'La mesa de criterios', en:'The criterion table' }) + '</div>' +
    '<div class="gw-q" data-r="q"></div>' +
    '<div class="gw-mini">' + L({
      es:'Toca cada organismo para moverlo de grupo. Puedes cambiarlo las veces que quieras antes de comprobar.',
      en:'Tap each organism to move it between groups. You can change it as often as you like before checking.'
    }) + '</div>' +
    '<div class="lgd" data-r="lgd"></div>' +
    '<div class="gw-grid" data-r="grid"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Comprobar', en:'Check' }) + '</button></div>' +
    '<div class="gw-fb"></div>';

  var elQ = host.querySelector('[data-r="q"]'),
      elL = host.querySelector('[data-r="lgd"]'),
      elG = host.querySelector('[data-r="grid"]'),
      elK = host.querySelector('[data-r="chk"]');

  function cr(){ return ORDER[rd]; }
  function want(i){ return SET[i][cr().k]; }

  function render(){
    var c = cr();
    elQ.innerHTML = L({
      es:'Reparto ' + (rd + 1) + ' de 3. Criterio: ' + L(c.c) + '.',
      en:'Arrangement ' + (rd + 1) + ' of 3. Criterion: ' + L(c.c) + '.'
    });
    elL.innerHTML =
      '<span><i class="lgdot a"></i>' + L(c.a) + '</span>' +
      '<span><i class="lgdot b"></i>' + L(c.b) + '</span>';
    elG.innerHTML = SET.map(function(o, i){
      var a = assign[i];
      var cls = a === 0 ? ' gA' : a === 1 ? ' gB' : '';
      var lbl = a < 0 ? L({ es:'sin grupo', en:'no group yet' }) : (a === 0 ? L(c.a) : L(c.b));
      return '<button class="gw-tile' + cls + '" data-i="' + i + '"' + ((revealed || done) ? ' disabled' : '') + '>' +
        '<span class="gw-key">' + L(o.n) + '</span><span class="gw-sub">' + lbl + '</span></button>';
    }).join('');
    elG.querySelectorAll('.gw-tile').forEach(function(b){
      b.addEventListener('click', function(){
        var i = parseInt(b.getAttribute('data-i'), 10);
        assign[i] = assign[i] >= 1 ? -1 : assign[i] + 1;
        render();
      });
    });
  }

  function advance(){
    rd++;
    assign = [-1,-1,-1,-1,-1,-1];
    tries = 0; revealed = false;
    if (rd >= 3){
      done = true;
      elK.textContent = L({ es:'Completado', en:'Completed' });
      elK.className = 'gw-btn solved';
      elK.disabled = true;
      say(host, 'good', L({
        es:'Los seis organismos no se movieron de la mesa y, aun así, quedaron en tres repartos completamente distintos. Ninguno de los tres está equivocado: cada uno responde una pregunta diferente.',
        en:'The six organisms never left the table and even so they ended up in three completely different arrangements. None of the three is wrong: each one answers a different question.'
      }));
      return;
    }
    elK.textContent = L({ es:'Comprobar', en:'Check' });
    elK.className = 'gw-btn';
    render();
    say(host, '', L({
      es:'Mismos organismos, otro criterio. Fíjate si alguno cambia de compañeros.',
      en:'Same organisms, another criterion. Notice whether any of them changes partners.'
    }));
  }

  elK.addEventListener('click', function(){
    if (done) return;
    if (revealed){ advance(); return; }
    var c = cr();
    if (assign.indexOf(-1) >= 0){
      say(host, 'warm', L({
        es:'Todavía hay organismos sin grupo. Tócalos hasta dejarlos en uno de los dos.',
        en:'Some organisms still have no group. Tap them until they sit in one of the two.'
      }));
      return;
    }
    var wrong = [];
    SET.forEach(function(o, i){ if (assign[i] !== want(i)) wrong.push(i); });
    if (wrong.length === 0){
      say(host, 'good', L({ es:'Reparto correcto con ese criterio.', en:'Correct arrangement with that criterion.' }));
      setTimeout(advance, 750);
      return;
    }
    tries++;
    if (tries >= 3){
      revealed = true;
      SET.forEach(function(o, i){ assign[i] = want(i); });
      render();
      elK.textContent = L({ es:'Siguiente', en:'Next' });
      var ga = SET.filter(function(o){ return o[c.k] === 0; }).map(function(o){ return L(o.n); }).join(', ');
      var gb = SET.filter(function(o){ return o[c.k] === 1; }).map(function(o){ return L(o.n); }).join(', ');
      say(host, 'miss', L({
        es:'Así queda con ese criterio. ' + L(c.a) + ': ' + ga + '. ' + L(c.b) + ': ' + gb + '.',
        en:'This is how it goes with that criterion. ' + L(c.a) + ': ' + ga + '. ' + L(c.b) + ': ' + gb + '.'
      }));
      return;
    }
    var k = wrong[0];
    say(host, 'warm', L({
      es:'Quedaron ' + (6 - wrong.length) + ' de 6 en su lugar. Vuelve a ver este: ' + L(SET[k].n) + '. Para este criterio, ' + L(c.w) + '.',
      en:(6 - wrong.length) + ' of 6 landed in place. Look again at this one: ' + L(SET[k].n) + '. For this criterion, ' + L(c.w) + '.'
    }));
  });

  render();
  say(host, '', L({ es:'Empieza por el organismo que te parezca más claro.', en:'Start with the organism that looks clearest to you.' }));
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 2 :: recorre la clave dicotómica
   El estudiante contesta sí o no en cada nodo; el camino se dibuja en vivo.
   Rama equivocada: pista direccional y vuelta al mismo paso (reversible).
   Tercera falla en la ronda: se muestra la respuesta correcta de ese paso.
   ══════════════════════════════════════════════════════════════════════════ */
function w2(rng, host){
  var KEY = {
    q:{ es:'¿Fabrica su propio alimento?', en:'Does it make its own food?' },
    y:{ q:{ es:'¿Forma semillas?', en:'Does it form seeds?' },
        y:{ leaf:{ es:'planta de maíz', en:'maize plant' } },
        n:{ q:{ es:'¿Vive dentro del agua?', en:'Does it live in water?' },
            y:{ leaf:{ es:'alga verde', en:'green alga' } },
            n:{ leaf:{ es:'musgo del muro', en:'moss on the wall' } } } },
    n:{ q:{ es:'¿Se desplaza por sí mismo?', en:'Does it move about by itself?' },
        y:{ q:{ es:'¿Tiene patas articuladas?', en:'Does it have jointed legs?' },
            y:{ leaf:{ es:'hormiga del jardín', en:'garden ant' } },
            n:{ leaf:{ es:'lombriz de tierra', en:'earthworm' } } },
        n:{ leaf:{ es:'hongo del tronco', en:'fungus on the log' } } }
  };
  var TARGETS = [
    { name:{ es:'planta de maíz', en:'maize plant' }, path:['y','y'],
      clue:{ es:'una hierba alta de milpa, con hojas largas y una mazorca con granos', en:'a tall milpa herb, with long leaves and a cob full of grains' } },
    { name:{ es:'alga verde', en:'green alga' }, path:['y','n','y'],
      clue:{ es:'un filamento verde que flota pegado a una piedra del arroyo', en:'a green filament floating stuck to a stone in the stream' } },
    { name:{ es:'musgo del muro', en:'moss on the wall' }, path:['y','n','n'],
      clue:{ es:'una alfombra verde y baja sobre un muro húmedo, sin flores ni granos', en:'a low green carpet on a damp wall, with no flowers and no grains' } },
    { name:{ es:'hongo del tronco', en:'fungus on the log' }, path:['n','n'],
      clue:{ es:'una repisa color café pegada a madera muerta, que absorbe materia de ella', en:'a brown shelf stuck to dead wood, absorbing matter from it' } },
    { name:{ es:'hormiga del jardín', en:'garden ant' }, path:['n','y','y'],
      clue:{ es:'un animal pequeño que carga migas hasta su nido y camina con seis patas', en:'a small animal that carries crumbs to its nest and walks on six legs' } },
    { name:{ es:'lombriz de tierra', en:'earthworm' }, path:['n','y','n'],
      clue:{ es:'un cuerpo alargado y blando que traga tierra con restos de hoja y avanza sin patas', en:'a long soft body that swallows soil with leaf remains and moves without legs' } }
  ];
  var HINTS = {
    'y':{ es:'los que fabrican su alimento no dependen de materia formada por otro ser vivo', en:'those that make their own food do not depend on matter formed by another living thing' },
    'n':{ es:'los que toman alimento ya formado dependen de otro ser vivo', en:'those that take food already formed depend on another living thing' }
  };
  var ROUNDS = shuffle(TARGETS, rng).slice(0, 3);
  var rd = 0, step = 0, tries = 0, done = false, node = KEY;

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Recorre la clave', en:'Walk the key' }) + '</div>' +
    '<div class="gw-q" data-r="q"></div>' +
    '<div class="keypath" data-r="path"></div>' +
    '<div class="kq" data-r="kq"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="yes">' + L({ es:'Sí', en:'Yes' }) + '</button>' +
      '<button class="gw-btn" data-r="no">' + L({ es:'No', en:'No' }) + '</button>' +
      '<button class="gw-btn" data-r="back">' + L({ es:'Volver al inicio', en:'Back to the start' }) + '</button></div>' +
    '<div class="gw-fb"></div>';

  var elQ = host.querySelector('[data-r="q"]'),
      elP = host.querySelector('[data-r="path"]'),
      elK = host.querySelector('[data-r="kq"]'),
      bY  = host.querySelector('[data-r="yes"]'),
      bN  = host.querySelector('[data-r="no"]'),
      bB  = host.querySelector('[data-r="back"]');
  var taken = [];

  function tgt(){ return ROUNDS[rd]; }

  function render(){
    var t = tgt();
    elQ.innerHTML = L({
      es:'Muestra ' + (rd + 1) + ' de 3: ' + L(t.clue) + '.',
      en:'Sample ' + (rd + 1) + ' of 3: ' + L(t.clue) + '.'
    });
    elP.innerHTML = taken.length ? taken.map(function(p){
      return '<span class="kstep' + (p.a === 'n' ? ' no' : '') + '">' + L(p.q) + ' ' +
        (p.a === 'y' ? L({ es:'sí', en:'yes' }) : L({ es:'no', en:'no' })) + '</span>';
    }).join('') : '<span class="kstep no">' + L({ es:'sin pasos todavía', en:'no steps yet' }) + '</span>';
    if (node.leaf){
      elK.innerHTML = '<span class="kleaf">' + L({ es:'La clave llega a: ', en:'The key arrives at: ' }) + L(node.leaf) + '</span>';
      bY.disabled = true; bN.disabled = true;
    } else {
      elK.innerHTML = L(node.q);
      bY.disabled = done; bN.disabled = done;
    }
  }

  function reset(){
    node = KEY; step = 0; taken = [];
    render();
  }

  function advance(){
    rd++;
    if (rd >= 3){
      done = true;
      bY.disabled = true; bN.disabled = true; bB.disabled = true;
      bB.className = 'gw-btn solved';
      bB.textContent = L({ es:'Completado', en:'Completed' });
      say(host, 'good', L({
        es:'Tres organismos identificados con la misma cadena de preguntas. Fíjate en algo: ninguna pregunta de la clave pedía una opinión, todas se contestan mirando el organismo.',
        en:'Three organisms identified with the same chain of questions. Notice something: no question in the key asked for an opinion, they are all answered by looking at the organism.'
      }));
      return;
    }
    tries = 0;
    reset();
    say(host, '', L({ es:'Otra muestra sobre la mesa. Empieza de nuevo por la primera pregunta.', en:'Another sample on the table. Start again from the first question.' }));
  }

  function answer(a){
    if (done || node.leaf) return;
    var t = tgt();
    var qtxt = node.q;
    if (a === t.path[step]){
      taken.push({ q:qtxt, a:a });
      node = node[a]; step++;
      render();
      if (node.leaf){
        if (L(node.leaf) === L(t.name)){
          say(host, 'good', L({
            es:'La clave llegó al organismo de la muestra en ' + step + ' pasos.',
            en:'The key reached the organism in the sample in ' + step + ' steps.'
          }));
          setTimeout(advance, 900);
        }
      } else {
        say(host, '', L({
          es:'Esa rama sigue viva. Quedan menos posibilidades que antes.',
          en:'That branch is still alive. Fewer possibilities are left than before.'
        }));
      }
      return;
    }
    tries++;
    if (tries >= 3){
      var good = t.path[step];
      taken.push({ q:qtxt, a:good });
      node = node[good]; step++;
      render();
      say(host, 'miss', L({
        es:'En este paso la respuesta era ' + (good === 'y' ? 'sí' : 'no') + ' y la clave avanza sola. Recuerda que ' + L(HINTS[t.path[0]]) + '.',
        en:'At this step the answer was ' + (good === 'y' ? 'yes' : 'no') + ' and the key moves on by itself. Remember that ' + L(HINTS[t.path[0]]) + '.'
      }));
      tries = 0;
      if (node.leaf && L(node.leaf) === L(t.name)) setTimeout(advance, 1400);
      return;
    }
    var wrongBranch = node[a];
    var ex = wrongBranch.leaf ? L(wrongBranch.leaf) : L({ es:'organismos de otra rama', en:'organisms from another branch' });
    say(host, 'warm', L({
      es:'Esa salida lleva hacia ' + ex + ', y la muestra que tienes no es eso. Vuelve a leer la muestra antes de contestar.',
      en:'That exit leads towards ' + ex + ', and the sample you have is not that. Read the sample again before answering.'
    }));
  }

  bY.addEventListener('click', function(){ answer('y'); });
  bN.addEventListener('click', function(){ answer('n'); });
  bB.addEventListener('click', function(){
    if (done) return;
    reset();
    say(host, '', L({ es:'De vuelta al primer paso. Puedes recorrer la clave cuantas veces quieras.', en:'Back to the first step. You can walk the key as many times as you like.' }));
  });

  render();
  say(host, '', L({ es:'Lee la muestra y contesta la primera pregunta.', en:'Read the sample and answer the first question.' }));
}
