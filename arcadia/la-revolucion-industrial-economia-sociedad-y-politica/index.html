<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Revolución Industrial: Economía, Sociedad y Política</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; text-align: justify; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">La Revolución Industrial: Economía, Sociedad y Política</div>
    <div class="wcourse" id="wcourse-el">Historia · 2° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">La Revolución Industrial: Economía, Sociedad y Política</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="sbtn" id="dlBtn" onclick="generatePDF()" style="max-width:280px;margin:0 auto;">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   CENTRALIZED SCHOOL CONFIG (Rule 16) — ships UNBRANDED (Rule 11).
   The ONLY rebranding point. build_all.py substitutes these exact fields
   (BRAND_FIELDS / RGB_FIELDS / logo*) downstream; :root/dark stay as fallback.
   Neutral defaults below == the static :root/dark values, so unbranded == no-op.
   ══════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:'#0c0c24', primaryDark:'#14143f', primaryBg:'#e9e9f4',
  accent:'#243c6c', accentBg:'#e4eaf6',
  darkPrimary:'#5555b4', darkPrimaryDark:'#8383d7', darkPrimaryBg:'#121234',

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);

  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');

}

async function generatePDF() {
  var btn = document.getElementById('dlBtn');
  btn.textContent = 'Generando PDF…';
  btn.disabled = true;

  var jspdf   = window.jspdf;
  var doc     = new jspdf.jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });
  var PW      = 215.9;
  var M       = 18;
  var TW      = PW - M * 2;
  var PH      = doc.internal.pageSize.height;
  var name    = studentData.name;
  var group   = studentData.group;
  var total   = problems.length;
  var pct     = Math.round(correctCount / total * 100);
  var dateStr = new Date().toLocaleString('es-MX', { dateStyle:'long', timeStyle:'short' });

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS — INJECTION BLOCK ─────────────────────────────────────────
  //   Match these RGB values to --green and --gold above.
  //   PRIMARY  → pBR, pBG, pBB
  //   ACCENT   → pAR, pAG, pAB
  // ──────────────────────────────────────────────────────────────────────────
  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;  // PRIMARY (from SCHOOL, Rule 16)
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;   // ACCENT (from SCHOOL, Rule 16)

  function pdfText(html) {
    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/\u2192/g,'->').replace(/\u2212/g,'-').replace(/\u00b2/g,'^2')

  //   iOS Safari ignores the <a download> attribute, so a plain download fails
  //   silently on iPhone/iPad. iOS -> native share sheet (-> "Save to Files"),
  //   with an inline-open fallback; everything else -> <a download> click.
  //   Runs synchronously off the tap so iOS accepts navigator.share().
  var _fname   = 'his2_t04_g01_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf';
  var _pdfBlob = doc.output('blob');

  function _restorePdfBtn(){ btn.innerHTML = '\u2b07 &nbsp;' + t('btn-pdf'); btn.disabled = false; }
  function _openPdfInline(b){
    var u = URL.createObjectURL(b);
    var w = window.open(u, '_blank');
    if (!w) { window.location.href = u; }
    setTimeout(function(){ URL.revokeObjectURL(u); }, 60000);
  }

  var _isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
               (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  if (_isIOS) {
    var _pdfFile = new File([_pdfBlob], _fname, { type:'application/pdf' });
    if (navigator.canShare && navigator.canShare({ files:[_pdfFile] })) {
      navigator.share({ files:[_pdfFile], title:_fname })
        .then(_restorePdfBtn)
        .catch(function(e){
          if (e && e.name === 'AbortError') { _restorePdfBtn(); return; }
          _openPdfInline(_pdfBlob); _restorePdfBtn();
        });
      return;
    }
    _openPdfInline(_pdfBlob); _restorePdfBtn();
    return;
  }

  var _dlUrl = URL.createObjectURL(_pdfBlob);
  var _dlA   = document.createElement('a');
  _dlA.href  = _dlUrl; _dlA.download = _fname;
  document.body.appendChild(_dlA); _dlA.click();
  setTimeout(function(){ document.body.removeChild(_dlA); URL.revokeObjectURL(_dlUrl); }, 200);
  _restorePdfBtn();
}

var MANIP = {};
function L(o){ if(o===null||o===undefined) return ''; if(typeof o==='string') return o; return (o[LANG]!==undefined ? o[LANG] : o.es); }
function shuffleIdx(n, rng){ var a=[],i,j,t; for(i=0;i<n;i++) a.push(i); for(i=n-1;i>0;i--){ j=Math.floor(rng()*(i+1)); t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function shuffleOpts(opts, correctIndex, rng){
  var ord = shuffleIdx(opts.length, rng);
  return { options: ord.map(function(k){ return opts[k]; }), correctIdx: ord.indexOf(correctIndex) };
}
function addProblem(spec, rng){
  var so = shuffleOpts(spec.options, spec.correct, rng);
  var p = { title: spec.title, questionText: spec.questionText, fn: '', hint: spec.hint || '',
            explanation: spec.explanation || '', options: so.options, correctIdx: so.correctIdx,
            showWork: !!spec.showWork, studentChoice: null, pendingChoice: null };
  problems.push(p);
  buildOneCard(p, problems.length - 1);
}
function addSection(tag, title, body){
  var d = document.createElement('div');
  d.className = 'section';
  d.innerHTML = '<div class="stag">' + tag + '</div><h2>' + title + '</h2>' + body;
  document.getElementById('lessonBody').appendChild(d);
  return d;
}

/* ════════ MANIPULABLE B :: arma la cadena ════════

var CHAINS = [

      { es:'Los trabajadores se juntan en sociedades de socorro mutuo para ayudarse.', en:'Workers join mutual aid societies to help one another.' },

      { es:'Se aprueban leyes fabriles que limitan la jornada y protegen a los menores.', en:'Factory laws are passed that limit the working day and protect minors.' }
    ] }
];
function mB_build(rng){
  var c = CHAINS[Math.floor(rng() * CHAINS.length)];
  var ord = shuffleIdx(c.links.length, rng);
  MANIP.B = { chain:c, pool:ord.slice(), slots:[null,null,null,null,null], sel:null,
              mark:{}, lock:[false,false,false,false,false], tries:0, done:false, fb:'', fbk:'' };

function mB_render(){
  var B = MANIP.B, z = document.getElementById('mzB');
  if (!B || !z) return;
  var pool = '', i;
  for (i = 0; i < B.pool.length; i++){
    pool += '<div class="chchip' + (B.sel === B.pool[i] ? ' sel' : '') + '" onclick="mB_take(' + B.pool[i] + ')">' + L(B.chain.links[B.pool[i]]) + '</div>';
  }
  if (!pool) pool = '<div class="tempty">' + L({ es:'no quedan eslabones sueltos', en:'no loose links left' }) + '</div>';
  var slots = '';
  for (i = 0; i < 5; i++){
    var v = B.slots[i];
    var cls = 'chslot' + (v !== null ? ' filled' : '') + (B.mark[i] ? ' ' + B.mark[i] : '');
    var txt = v !== null ? L(B.chain.links[v]) : L({ es:'toca aquí para colocar el eslabón elegido', en:'tap here to place the chosen link' });
    slots += '<div class="' + cls + '" onclick="mB_drop(' + i + ')"><div class="chnum">' + (i + 1) + '</div><div>' + txt + '</div></div>';
    if (i < 4) slots += '<div class="charrow">↓</div>';
  }
  z.innerHTML =
    '<div class="mztitle">' + L({ es:'Arma la cadena: ', en:'Build the chain: ' }) + L(B.chain.name) + '</div>' +
    '<div class="mzq">' + L({ es:'Toca un eslabón y después el lugar donde crees que va. Puedes sacarlo de nuevo tocando su casilla.',
                              en:'Tap a link and then the place where you think it goes. You can take it out again by tapping its box.' }) + '</div>' +
    '<div class="chpool">' + pool + '</div>' +

                   '<button class="mzbtn2" onclick="mB_clear()">' + L({ es:'Deshacer todo', en:'Undo all' }) + '</button></div>') +
    '<div class="mzfb' + (B.fbk ? ' ' + B.fbk : '') + '">' + B.fb + '</div>';
}
function mB_take(k){
  var B = MANIP.B; if (!B || B.done) return;
  B.sel = (B.sel === k) ? null : k;
  B.fb = B.sel === null ? '' : L({ es:'Eslabón tomado. Ahora elige su lugar en la cadena.', en:'Link picked up. Now choose its place in the chain.' });
  B.fbk = ''; mB_render();
}
function mB_drop(i){
  var B = MANIP.B; if (!B || B.done || B.lock[i]) return;
  if (B.slots[i] !== null && B.sel === null){
    B.pool.push(B.slots[i]); B.slots[i] = null; B.mark = {};
    B.fb = L({ es:'Eslabón devuelto al montón.', en:'Link returned to the pile.' }); B.fbk = '';
    mB_render(); return;
  }
  if (B.sel === null){ B.fb = L({ es:'Primero toca uno de los eslabones sueltos.', en:'First tap one of the loose links.' }); B.fbk = ''; mB_render(); return; }
  if (B.slots[i] !== null) B.pool.push(B.slots[i]);
  var p = B.pool.indexOf(B.sel); if (p >= 0) B.pool.splice(p, 1);
  B.slots[i] = B.sel; B.sel = null; B.mark = {};
  B.fb = L({ es:'Colocado. Sigue armando la cadena.', en:'Placed. Keep building the chain.' }); B.fbk = '';
  mB_render();
}
function mB_clear(){
  var B = MANIP.B, i; if (!B || B.done) return;
  for (i = 0; i < 5; i++){ if (B.slots[i] !== null && !B.lock[i]){ B.pool.push(B.slots[i]); B.slots[i] = null; } }
  B.sel = null; B.mark = {}; B.fb = ''; B.fbk = ''; mB_render();
}
function mB_check(){
  var B = MANIP.B, i, wrong = 0, empty = 0;
  if (!B || B.done) return;
  for (i = 0; i < 5; i++) if (B.slots[i] === null) empty++;
  if (empty){ B.fbk = 'bad'; B.fb = L({ es:'Faltan eslabones por colocar: ', en:'Links still to place: ' }) + empty + '.'; mB_render(); return; }
  B.mark = {};
  for (i = 0; i < 5; i++){
    if (B.slots[i] === i){ B.mark[i] = 'ok'; B.lock[i] = true; }
    else { B.mark[i] = 'bad'; wrong++; }
  }
  if (wrong === 0){
    B.done = true; B.fbk = 'ok';
    B.fb = L({ es:'Cadena completa. Ningún eslabón funciona solo: cada paso vuelve posible el siguiente, y por eso la industrialización avanzó como un proceso encadenado y no como un invento aislado.',
               en:'Chain complete. No link works alone: each step makes the next one possible, and that is why industrialization advanced as a chained process and not as an isolated invention.' });
  } else {
    B.tries++;
    if (B.tries >= 3){
      for (i = 0; i < 5; i++){ B.slots[i] = i; B.mark[i] = 'ok'; B.lock[i] = true; }
      B.pool = []; B.done = true; B.fbk = 'warn';
      B.fb = L({ es:'Así queda la cadena: cada eslabón crea el problema o la posibilidad que explica al siguiente.',
                 en:'This is how the chain stands: each link creates the problem or the possibility that explains the next one.' });
    } else {
      B.fbk = 'bad';
      B.fb = L({ es:'Hay ', en:'There are ' }) + wrong + L({ es:' eslabones fuera de sitio. Los verdes ya quedaron fijos: pregúntate cuál de los rojos es causa del otro.',
                                                             en:' links out of place. The green ones are fixed now: ask yourself which of the red ones causes the other.' });
      for (i = 0; i < 5; i++){ if (!B.lock[i] && B.slots[i] !== null){ B.pool.push(B.slots[i]); B.slots[i] = null; } }
    }
  }
  mB_render();
}

  if (!C || C.done) return;
  C.mark = {};
  for (i = 0; i < C.cards.length; i++){
    if (CH3[C.cards[i]].c === C.cur[i]){ C.mark[i] = 'ok'; C.lock[i] = true; }
    else { C.mark[i] = 'bad'; wrong++; }
  }
  if (wrong === 0){
    C.done = true; C.fbk = 'ok';
    C.fb = L({ es:'Mesa completa. Las tres columnas se alimentan entre sí: la fábrica cambia el empleo, el empleo cambia la ciudad y la ciudad acaba llevando sus demandas al parlamento.',
               en:'Table complete. The three columns feed one another: the factory changes employment, employment changes the city, and the city ends up carrying its demands to parliament.' });
  } else {
    C.tries++;
    if (C.tries >= 3){
      for (i = 0; i < C.cards.length; i++){ C.cur[i] = CH3[C.cards[i]].c; C.mark[i] = 'ok'; C.lock[i] = true; }
      C.done = true; C.fbk = 'warn';
      C.fb = L({ es:'Así queda la mesa: producción y capital a la izquierda, formas de vida en medio, leyes y derechos a la derecha.',
                 en:'This is how the table stands: production and capital on the left, ways of life in the middle, laws and rights on the right.' });
    } else {
      C.fbk = 'bad';
      C.fb = L({ es:'Quedan ', en:'Still misplaced: ' }) + wrong + L({ es:' fichas en la columna equivocada. Las rojas se pueden seguir moviendo.',
                                                                      en:' cards in the wrong column. The red ones can still be moved.' });
    }
  }
  mC_render();
}

    L({ es:'<p>Durante siglos, casi todo lo que la gente usaba salía de manos humanas: un tejedor hilaba y tejía en su casa, con su propio telar, ayudado por la fuerza del agua, del viento o de los animales. Hacia 1760 esa forma de producir empezó a cambiar en Gran Bretaña, y el cambio fue tan profundo que se le llama Revolución Industrial. No fue un solo invento ni un solo año: fue un proceso de varias décadas en el que se transformaron la energía, las máquinas, el lugar de trabajo y hasta la manera de medir el tiempo.</p>' +
              '<p>Gran Bretaña reunía condiciones poco frecuentes. Había mejorado sus cosechas, así que menos campesinos alimentaban a más gente y sobraban brazos para otros oficios. Tenía carbón y hierro cerca de la costa, una red de canales y puertos que abarataba el traslado, bancos dispuestos a prestar y un imperio comercial que compraba tejidos y vendía algodón. Sobre esa base aparecieron las máquinas: hiladoras de varios husos, el telar mecánico y, sobre todo, la máquina de vapor que James Watt perfeccionó a partir de 1769.</p>' +
              '<p>Con el vapor cambió el lugar donde se producía. La energía dejó de depender de un río de corriente fuerte y pasó a depender del carbón, que se podía llevar a cualquier parte. Nació entonces el sistema fabril: un edificio donde se concentran las máquinas, decenas o cientos de trabajadores entran a la misma hora, cada uno repite una operación sencilla del proceso y una dirección vigila el ritmo. El artesano dueño de su oficio y de su tiempo dio paso al obrero que vende su jornada por un salario.</p>' +
              '<div class="rules-grid">' +
                '<div class="rcard"><div class="rname">Energía</div><div class="rform">Carbón y vapor</div><div class="rnote">sustituyen al agua y a los animales</div></div>' +
                '<div class="rcard"><div class="rname">Máquinas</div><div class="rform">Hilado y tejido</div><div class="rnote">la industria textil abre el camino</div></div>' +
                '<div class="rcard"><div class="rname">Organización</div><div class="rform">Sistema fabril</div><div class="rnote">tareas divididas y horario fijo</div></div>' +
                '<div class="rcard"><div class="rname">Punto de partida</div><div class="rform">Gran Bretaña</div><div class="rnote">carbón, capitales, canales y mercados</div></div>' +
              '</div>' +
              '<div class="callout"><p><strong>Una revolución sin batallas.</strong> Nadie tomó un palacio, pero en dos generaciones cambiaron el trabajo, el paisaje y la vida diaria de millones de personas.</p></div>',
          en:'<p>For centuries, almost everything people used came out of human hands: a weaver spun and wove at home, with a loom of their own, helped by the force of water, wind or animals. Around 1760 that way of producing began to change in Great Britain, and the change was so deep that it is called the Industrial Revolution. It was not one invention or one year: it was a process of several decades in which energy, machines, the workplace and even the way of measuring time were transformed.</p>' +
              '<p>Great Britain brought together uncommon conditions. It had improved its harvests, so fewer peasants fed more people and there were spare hands for other trades. It had coal and iron near the coast, a network of canals and ports that made transport cheap, banks willing to lend and a trading empire that bought cloth and sold cotton. On that base the machines appeared: spinning machines with several spindles, the power loom and, above all, the steam engine that James Watt improved from 1769 onward.</p>' +
              '<p>With steam, the place of production changed. Energy no longer depended on a fast flowing river and came to depend on coal, which could be carried anywhere. The factory system was born: a building where the machines are gathered, dozens or hundreds of workers come in at the same hour, each one repeats a simple operation of the process and a management watches the pace. The artisan who owned a trade and a schedule gave way to the worker who sells a working day for a wage.</p>' +

                      en:'In a weavers workshop of 1750, each artisan worked at home, with a hand loom of their own and at the pace they chose. In a cotton mill of 1820, two hundred people came in at the same hour to a building where a single steam engine drove every spindle. What feature of the second case makes it a different system and not merely a bigger workshop?' }),

  addSection(L({ es:'Concepto 2', en:'Concept 2' }), L({ es:'El vapor sale de la fábrica', en:'Steam leaves the factory' }),
    L({ es:'<p>Mientras el vapor movía husos y telares, alguien tuvo una idea sencilla y enorme: montar ese motor sobre ruedas. Las primeras locomotivas arrastraban carbón en las minas; en 1830 se inauguró entre Liverpool y Manchester la primera línea de ferrocarril de pasajeros movida por vapor, y en pocas décadas las vías cruzaron Europa, América del Norte y buena parte del mundo. Los barcos de vapor hicieron lo mismo en los mares y el telégrafo eléctrico separó por primera vez el viaje de un mensaje del viaje de una persona.</p>' +
              '<p>Las consecuencias fueron mayores que la velocidad. Con transporte barato, una fábrica podía traer algodón de otro continente y vender su tela a mil kilómetros de distancia: nacieron mercados nacionales y mundiales, y con ellos la competencia entre regiones. Las ciudades crecieron donde se cruzaban las vías, la gente migró más lejos y hasta la hora se unificó, porque un tren no puede salir a una hora distinta en cada pueblo.</p>' +
              '<p>Hacia 1870 comenzó una segunda etapa. Un nuevo procedimiento abarató el acero, la electricidad empezó a mover motores y a iluminar calles, el petróleo alimentó el motor de explosión y la química creó colorantes, abonos y medicinas. Estas industrias exigían laboratorios, escuelas técnicas y grandes inversiones, y en ese terreno Alemania y Estados Unidos avanzaron más rápido que Gran Bretaña. La producción en serie hizo el resto: piezas iguales, montaje encadenado y precios más bajos.</p>' +
              '<table class="dtable"><tr><th></th><th>' + L({ es:'Primera etapa', en:'First stage' }) + '</th><th>' + L({ es:'Segunda etapa', en:'Second stage' }) + '</th></tr>' +
                '<tr><td>' + L({ es:'Energía', en:'Energy' }) + '</td><td>' + L({ es:'carbón y vapor', en:'coal and steam' }) + '</td><td>' + L({ es:'electricidad y petróleo', en:'electricity and oil' }) + '</td></tr>' +
                '<tr><td>' + L({ es:'Materiales', en:'Materials' }) + '</td><td>' + L({ es:'hierro y algodón', en:'iron and cotton' }) + '</td><td>' + L({ es:'acero y productos químicos', en:'steel and chemicals' }) + '</td></tr>' +
                '<tr><td>' + L({ es:'Países que encabezan', en:'Leading countries' }) + '</td><td>' + L({ es:'Gran Bretaña', en:'Great Britain' }) + '</td><td>' + L({ es:'Alemania y Estados Unidos', en:'Germany and the United States' }) + '</td></tr></table>' +
              '<div class="callout"><p><strong>El ferrocarril no solo acortó distancias: cambió lo que era posible producir y vender.</strong> Una fábrica sin mercado lejano no tiene razón para crecer.</p></div>',
          en:'<p>While steam was driving spindles and looms, someone had a simple and enormous idea: to mount that engine on wheels. The first locomotives hauled coal at the mines; in 1830 the first steam driven passenger railway line opened between Liverpool and Manchester, and within a few decades the tracks crossed Europe, North America and much of the world. Steamships did the same at sea and the electric telegraph separated, for the first time, the journey of a message from the journey of a person.</p>' +
              '<p>The consequences went beyond speed. With cheap transport, a factory could bring cotton from another continent and sell its cloth a thousand kilometres away: national and world markets were born, and with them competition between regions. Cities grew where the lines crossed, people migrated further and even the hour was unified, because a train cannot leave at a different time in every town.</p>' +
              '<p>Around 1870 a second stage began. A new process made steel cheap, electricity started to drive motors and light streets, oil fed the combustion engine and chemistry created dyes, fertilizers and medicines. These industries demanded laboratories, technical schools and large investment, and on that ground Germany and the United States moved faster than Great Britain. Mass production did the rest: identical parts, chained assembly and lower prices.</p>' +
              '<table class="dtable"><tr><th></th><th>First stage</th><th>Second stage</th></tr>' +
                '<tr><td>Energy</td><td>coal and steam</td><td>electricity and oil</td></tr>' +
                '<tr><td>Materials</td><td>iron and cotton</td><td>steel and chemicals</td></tr>' +
                '<tr><td>Leading countries</td><td>Great Britain</td><td>Germany and the United States</td></tr></table>' +
              '<div class="callout"><p><strong>The railway did not only shorten distances: it changed what could be produced and sold.</strong> A factory with no distant market has no reason to grow.</p></div>' }));

  addSection(L({ es:'Concepto 3', en:'Concept 3' }), L({ es:'Ciudades nuevas, sociedad nueva', en:'New cities, a new society' }),
    L({ es:'<p>La fábrica atrajo gente y la gente construyó ciudades. Manchester pasó de ser una villa a convertirse en una capital del algodón en menos de dos generaciones, y lo mismo ocurrió en las cuencas carboníferas de Bélgica, Alemania o el norte de Francia. La población salía del campo por dos motivos que empujaban en el mismo sentido: en la aldea ya no había tierra ni empleo para todos, y en la ciudad había un salario esperando cada semana.</p>' +
              '<p>El crecimiento fue más rápido que las viviendas y los servicios. Barrios enteros se levantaron sin agua entubada ni drenaje, y las epidemias, sobre todo las de cólera, golpearon con dureza a los vecindarios más apretados. La respuesta llegó despacio y por la vía de la salud pública: comisiones que estudiaron las condiciones de vida, redes de agua limpia, drenaje, recolección de basura y reglamentos de construcción. Fue la primera vez que muchos gobiernos aceptaron que la salud de la población era asunto suyo.</p>' +
              '<p>También cambió el mapa social. En lugar de estamentos heredados aparecieron grupos definidos por su lugar en la producción: la burguesía industrial, dueña de fábricas y capitales, y una clase trabajadora que vendía su jornada por un salario, sin ser dueña ni de las máquinas ni del producto. Las jornadas iniciales eran larguísimas y en muchas fábricas trabajaban niñas y niños de pocos años. A partir de la década de 1830 los parlamentos empezaron a poner límites: edad mínima para entrar a la fábrica, tope de horas para menores y mujeres, inspectores encargados de vigilar el cumplimiento y, más tarde, escuelas obligatorias.</p>' +
              '<div class="rules-grid">' +
                '<div class="rcard"><div class="rname">Ciudad</div><div class="rform">Crecimiento acelerado</div><div class="rnote">llega antes la gente que el drenaje</div></div>' +
                '<div class="rcard"><div class="rname">Salud</div><div class="rform">Agua y drenaje</div><div class="rnote">primeras leyes de salud pública</div></div>' +
                '<div class="rcard"><div class="rname">Grupos</div><div class="rform">Burguesía y obreros</div><div class="rnote">definidos por el lugar en la producción</div></div>' +
                '<div class="rcard"><div class="rname">Ley</div><div class="rform">Leyes fabriles</div><div class="rnote">edad mínima, horas e inspectores</div></div>' +
              '</div>' +
              '<div class="srcbox">Una comisión británica que visitó las villas fabriles a mediados del siglo informó que las calles carecían de drenaje, que varias familias compartían una sola habitación y que la enfermedad avanzaba más rápido donde faltaba agua limpia.<span class="srcref">Resumen de los informes sanitarios que dieron origen a las primeras leyes de salud pública.</span></div>' +
              '<div class="callout"><p><strong>La misma ciudad producía riqueza y problemas nuevos.</strong> De esa tensión salieron el agua entubada, el drenaje, la jornada limitada y la escuela obligatoria.</p></div>',
          en:'<p>The factory drew people in and people built cities. Manchester went from a town to a capital of cotton in less than two generations, and the same happened in the coal basins of Belgium, Germany or northern France. People left the countryside for two reasons that pushed in the same direction: in the village there was no longer land or work for everyone, and in the city a wage was waiting each week.</p>' +
              '<p>Growth ran ahead of housing and services. Whole districts went up with no piped water and no drainage, and epidemics, above all cholera, struck the most crowded neighbourhoods hard. The answer came slowly and through public health: commissions that studied living conditions, clean water networks, drainage, rubbish collection and building regulations. It was the first time many governments accepted that the health of the population was their business.</p>' +
              '<p>The social map changed too. In place of inherited estates there appeared groups defined by their position in production: the industrial middle class, owner of factories and capital, and a working class that sold its working day for a wage, owning neither the machines nor the product. The early working days were enormous and in many factories young girls and boys worked. From the 1830s parliaments began to set limits: a minimum age to enter the factory, a cap on hours for minors and women, inspectors in charge of enforcement and, later, compulsory schooling.</p>' +
              '<div class="rules-grid">' +
                '<div class="rcard"><div class="rname">City</div><div class="rform">Runaway growth</div><div class="rnote">people arrive before the drainage</div></div>' +
                '<div class="rcard"><div class="rname">Health</div><div class="rform">Water and drainage</div><div class="rnote">first public health laws</div></div>' +
                '<div class="rcard"><div class="rname">Groups</div><div class="rform">Owners and workers</div><div class="rnote">defined by their place in production</div></div>' +
                '<div class="rcard"><div class="rname">Law</div><div class="rform">Factory laws</div><div class="rnote">minimum age, hours and inspectors</div></div>' +

  addSection(L({ es:'Concepto 4', en:'Concept 4' }), L({ es:'Respuestas ante la fábrica', en:'Answers to the factory' }),
    L({ es:'<p>Ante los mismos hechos, el siglo XIX ensayó respuestas muy distintas. El liberalismo económico, inspirado en Adam Smith, sostenía que el Estado debía intervenir lo menos posible: si cada quien buscaba su beneficio, la competencia ordenaría precios, salarios y producción. Desde esa idea se defendió la libertad de contratación y se miraron con desconfianza las leyes que limitaban la jornada.</p>' +
              '<p>El socialismo partió del diagnóstico contrario. Autores como Karl Marx y Friedrich Engels, que publicaron el Manifiesto Comunista en 1848, sostuvieron que la desigualdad no era un accidente sino el resultado de que unos pocos fueran dueños de las fábricas mientras la mayoría solo tenía su trabajo para vender; proponían, por lo tanto, cambiar el régimen de propiedad. Otros socialistas, llamados utópicos, ensayaron comunidades y cooperativas de producción.</p>' +
              '<p>Mientras las ideas discutían, los trabajadores se organizaban. Primero fueron sociedades de socorro mutuo, cajas comunes para sostener al compañero enfermo; después sindicatos que negociaban salarios y horarios en conjunto y que durante años estuvieron prohibidos; más tarde, partidos que llevaron esas demandas al parlamento. En Gran Bretaña el cartismo pidió el voto para todos los varones adultos, y hubo también quienes, como los luditas, culparon a las máquinas de la pérdida de su empleo y las destruyeron. De ese largo debate salieron las leyes fabriles, el derecho a asociarse y la ampliación del sufragio.</p>' +
              '<div class="callout"><p><strong>Ninguna respuesta fue automática.</strong> Cada derecho laboral que hoy parece obvio se discutió, se peleó y se escribió en una ley.</p></div>',
          en:'<p>Faced with the same facts, the nineteenth century tried out very different answers. Economic liberalism, inspired by Adam Smith, held that the state should intervene as little as possible: if everyone pursued their own benefit, competition would order prices, wages and production. From that idea freedom of contract was defended and laws limiting the working day were viewed with suspicion.</p>' +
              '<p>Socialism started from the opposite diagnosis. Authors such as Karl Marx and Friedrich Engels, who published the Communist Manifesto in 1848, argued that inequality was not an accident but the result of a few owning the factories while the majority had only their labour to sell; they therefore proposed changing the system of property. Other socialists, called utopians, tried out communities and producer cooperatives.</p>' +
              '<p>While the ideas argued, the workers organized. First came mutual aid societies, common funds to support a sick workmate; then unions that bargained over wages and hours together and that were banned for years; later, parties that carried those demands into parliament. In Great Britain, Chartism asked for the vote for all adult men, and there were also those, such as the Luddites, who blamed the machines for the loss of their jobs and destroyed them. Out of that long debate came the factory laws, the right of association and the widening of the vote.</p>' +
              '<div class="callout"><p><strong>No answer was automatic.</strong> Every labour right that looks obvious today was argued over, fought for and written into a law.</p></div>' }));

  addSection(L({ es:'Concepto 5', en:'Concept 5' }), L({ es:'La política de un mundo conectado', en:'The politics of a connected world' }),
    L({ es:'<p>La industria también reordenó la política. A lo largo del siglo XIX se extendieron los estados con constitución, parlamento y derechos escritos, y el derecho al voto, reservado al principio a los propietarios, se fue ampliando a más varones adultos bajo la presión de una población obrera numerosa y organizada. Al mismo tiempo, la idea de nación movilizó a millones de personas y condujo a la unificación de Italia en 1861 y de Alemania en 1871.</p>' +
              '<p>Hacia el final del siglo, las potencias industriales necesitaban materias primas baratas y mercados donde colocar su producción. Esa necesidad, sumada a su ventaja técnica y militar, impulsó el imperialismo: entre 1880 y 1914 se repartieron entre unos pocos países casi todo el continente africano y buena parte de Asia. El mundo quedó conectado por vapores, telégrafos y ferrocarriles, pero conectado de manera desigual.</p>' +
              '<p>México y América Latina participaron en ese mundo desde el otro extremo de la cadena: exportaban minerales y productos agrícolas y compraban manufacturas europeas y estadounidenses. En la segunda mitad del siglo se tendieron aquí miles de kilómetros de vías, financiadas en gran parte con capital extranjero y trazadas para llevar la producción de las minas y las haciendas hasta los puertos y la frontera norte. Hubo crecimiento económico y ciudades transformadas, pero los beneficios se repartieron de manera muy despareja.</p>' +
              '<div class="rules-grid">' +
                '<div class="rcard"><div class="rname">Estado</div><div class="rform">Constitución y voto</div><div class="rnote">el sufragio se amplía por presión social</div></div>' +
                '<div class="rcard"><div class="rname">Nación</div><div class="rform">Italia y Alemania</div><div class="rnote">unificaciones de 1861 y 1871</div></div>' +
                '<div class="rcard"><div class="rname">Imperialismo</div><div class="rform">Materias primas</div><div class="rnote">y mercados para la producción</div></div>' +
                '<div class="rcard"><div class="rname">México</div><div class="rform">Vías hacia los puertos</div><div class="rnote">exportar minerales, importar manufacturas</div></div>' +
              '</div>' +
              '<div class="callout"><p><strong>Industrializarse o comprar lo industrializado.</strong> El lugar que cada región ocupó en esa cadena marcó su economía durante más de un siglo.</p></div>',
          en:'<p>Industry reordered politics as well. Through the nineteenth century states with a constitution, a parliament and written rights spread, and the right to vote, at first reserved for property owners, was widened to more adult men under pressure from a numerous and organized working population. At the same time, the idea of the nation mobilized millions of people and led to the unification of Italy in 1861 and of Germany in 1871.</p>' +
              '<p>Towards the end of the century, the industrial powers needed cheap raw materials and markets in which to place their output. That need, added to their technical and military advantage, drove imperialism: between 1880 and 1914 almost the whole African continent and much of Asia were divided among a few countries. The world was left connected by steamers, telegraphs and railways, but connected unequally.</p>' +
              '<p>Mexico and Latin America took part in that world from the other end of the chain: they exported minerals and farm produce and bought European and United States manufactures. In the second half of the century thousands of kilometres of track were laid here, financed largely with foreign capital and drawn to carry the output of the mines and the great estates to the ports and the northern border. There was economic growth and there were transformed cities, but the benefits were shared out very unevenly.</p>' +
              '<div class="rules-grid">' +
                '<div class="rcard"><div class="rname">State</div><div class="rform">Constitution and vote</div><div class="rnote">suffrage widens under social pressure</div></div>' +

  addSection(L({ es:'Cierre', en:'Closing' }), L({ es:'Piensa como historiador', en:'Think like a historian' }),
    L({ es:'<p>Las dos últimas preguntas no traen explicación previa: te toca a ti reunir lo que trabajaste sobre economía, sociedad y política del siglo XIX.</p>',
        en:'<p>The last two questions come with no explanation before them: it is up to you to bring together what you worked on about the economy, society and politics of the nineteenth century.</p>' }));

  /* ── PROBLEMA 9 ── */
  addProblem(v9 === 0 ? {
    title: L({ es:'Un trazado que dice mucho', en:'A layout that says a lot' }),
    questionText: L({ es:'Entre 1870 y 1910 México tendió miles de kilómetros de vías férreas. Casi todas unían las zonas mineras y las haciendas de exportación con los puertos y con la frontera norte, y muy pocas conectaban entre sí a las regiones del interior. ¿Qué muestra ese trazado sobre el lugar de México en la economía mundial de la época?',
                      en:'Between 1870 and 1910 Mexico laid thousands of kilometres of railway. Almost all of them joined the mining zones and the export estates with the ports and the northern border, and very few connected the inland regions to one another. What does that layout show about the place of Mexico in the world economy of the time?' }),
    hint: L({ es:'Sigue el recorrido de las vías: pregúntate qué salía del país y qué entraba por esos mismos rieles.',
              en:'Follow the route of the tracks: ask yourself what was leaving the country and what was coming in along those same rails.' }),
    explanation: L({ es:'Un trazado que apunta a los puertos y a la frontera está pensado para sacar materias primas y meter manufacturas. Muestra una economía integrada al mundo como proveedora de materias primas y compradora de productos industriales, y por lo tanto dependiente de precios e inversiones que se decidían fuera.',
                     en:'A layout that points to the ports and the border is designed to take raw materials out and bring manufactures in. It shows an economy joined to the world as a supplier of raw materials and a buyer of industrial goods, and therefore dependent on prices and investment decided elsewhere.' }),
    options: [ L({ es:'Que se integró como proveedor de materias primas y comprador de manufacturas, con las decisiones clave tomadas fuera del país', en:'That it joined in as a supplier of raw materials and a buyer of manufactures, with the key decisions taken outside the country' }),
               L({ es:'Que había alcanzado a las potencias industriales y exportaba maquinaria por sus puertos del golfo', en:'That it had caught up with the industrial powers and exported machinery through its gulf ports' }),
               L({ es:'Que la red buscaba sobre todo comunicar entre sí a los pueblos del centro del país', en:'That the network was above all meant to link the towns of the centre of the country to one another' }),
               L({ es:'Que el ferrocarril se construyó únicamente para trasladar pasajeros entre las principales ciudades', en:'That the railway was built only to move passengers between the main cities' }) ],
    correct: 0, showWork: false
  } : {
    title: L({ es:'Crecer no es lo mismo que repartir', en:'Growing is not the same as sharing' }),
    questionText: L({ es:'Un equipo revisa datos de las últimas décadas del siglo XIX en México: las exportaciones mineras y agrícolas crecieron con fuerza y se modernizaron varias ciudades, mientras muchas comunidades campesinas perdieron tierras y los salarios de los trabajadores rurales avanzaron muy poco. ¿Qué interpretación se sostiene mejor con ese conjunto de datos?',
                      en:'A team reviews data from the last decades of the nineteenth century in Mexico: mining and farm exports grew strongly and several cities were modernized, while many peasant communities lost land and the wages of rural workers rose very little. What interpretation is best supported by that set of data?' }),
    hint: L({ es:'Fíjate en que los datos apuntan en dos direcciones distintas: una cosa creció y otra no mejoró.',
              en:'Notice that the data point in two different directions: one thing grew and another did not improve.' }),
    explanation: L({ es:'Los datos muestran crecimiento económico y modernización junto con un reparto muy desigual de sus beneficios. Afirmar solo una de las dos cosas dejaría fuera evidencia que está sobre la mesa, y esa tensión es clave para entender los conflictos sociales que vinieron después.',
                     en:'The data show economic growth and modernization together with a very unequal sharing of the benefits. Claiming only one of the two would leave out evidence that is on the table, and that tension is key to understanding the social conflicts that came afterwards.' }),
    options: [ L({ es:'Que hubo crecimiento económico y modernización, pero sus beneficios se repartieron de manera muy desigual', en:'That there was economic growth and modernization, but its benefits were shared out very unequally' }),
               L({ es:'Que no hubo crecimiento económico alguno, porque los salarios rurales no mejoraron en ese periodo', en:'That there was no economic growth at all, because rural wages did not improve in that period' }),
               L({ es:'Que el crecimiento benefició por igual a todos los grupos, pues las exportaciones aumentaron mucho', en:'That the growth benefited every group equally, since exports rose a great deal' }),
               L({ es:'Que los datos se contradicen entre sí, de modo que no permiten sostener ninguna interpretación', en:'That the data contradict one another, so they allow no interpretation at all' }) ],
    correct: 0, showWork: false
  }, rng);

  /* ── PROBLEMA 10 ── */
  addProblem(v10 === 0 ? {
    title: L({ es:'Herencias que siguen vivas', en:'Legacies still alive' }),
    questionText: L({ es:'Muchas cosas del mundo actual tienen su origen en los conflictos y acuerdos del siglo XIX industrial. ¿Cuál de las siguientes es una herencia directa de aquel proceso que sigue organizando el trabajo de hoy?',
                      en:'Many things in the world today have their origin in the conflicts and agreements of the industrial nineteenth century. Which of the following is a direct legacy of that process that still organizes work today?' }),
    hint: L({ es:'Piensa en qué se ganó con las leyes fabriles y con el reconocimiento de las organizaciones de trabajadores.',
              en:'Think about what was won with the factory laws and with the recognition of workers organizations.' }),
    explanation: L({ es:'La jornada laboral limitada por ley y el derecho de los trabajadores a organizarse nacieron de aquellas leyes fabriles y de aquellas luchas, y siguen siendo hoy la base de la legislación del trabajo. Las otras opciones describen instituciones anteriores o desaparecidas.',
                     en:'The working day limited by law and the right of workers to organize were born of those factory laws and struggles, and they remain today the base of labour legislation. The other options describe earlier or vanished institutions.' }),
    options: [ L({ es:'La jornada laboral limitada por ley y el derecho de los trabajadores a organizarse', en:'The working day limited by law and the right of workers to organize' }),
               L({ es:'La organización de cada oficio en gremios que deciden quién puede ejercerlo', en:'The organization of each trade in guilds that decide who may practise it' }),
               L({ es:'El pago del diezmo sobre la cosecha anual de cada familia campesina', en:'The payment of a tithe on the yearly harvest of each peasant family' }),
               L({ es:'La dependencia de la rueda hidráulica para poner en marcha las máquinas de una fábrica', en:'Dependence on the water wheel to set the machines of a factory going' }) ],
    correct: 0, showWork: false
  } : {
    title: L({ es:'El criterio del historiador', en:'The criterion of the historian' }),
    questionText: L({ es:'Un equipo debe decidir, con un solo criterio, si una región del siglo XIX estaba industrializada o no. Discuten cuatro posibilidades y tienen que quedarse con la más útil para responder esa pregunta. ¿Cuál conviene elegir?',
                      en:'A team has to decide, using a single criterion, whether a region of the nineteenth century was industrialized or not. They discuss four possibilities and must keep the one most useful for answering that question. Which one should they choose?' }),
    hint: L({ es:'Vuelve a la definición del proceso: qué cambia realmente cuando una región se industrializa.',
              en:'Go back to the definition of the process: what really changes when a region industrializes.' }),
    explanation: L({ es:'La industrialización se reconoce sobre todo en el traslado del trabajo desde el campo hacia una producción movida por energía mecánica. Los otros criterios describen rasgos que también existían en regiones sin industria, así que no permiten distinguirlas.',
                     en:'Industrialization is recognized above all in the shift of work from the countryside to production driven by mechanical energy. The other criteria describe features that also existed in regions without industry, so they do not tell them apart.' }),
    options: [ L({ es:'Qué proporción de su población trabajaba en producción movida por energía mecánica en lugar de en el campo', en:'What share of its population worked in production driven by mechanical energy instead of in farming' }),
               L({ es:'Cuántos habitantes tenía la ciudad más grande de esa región en el año estudiado', en:'How many inhabitants the largest city of that region had in the year studied' }),
               L({ es:'Cuántos años llevaba su gobierno sin cambiar de manos durante el siglo XIX', en:'How many years its government had gone without changing hands during the nineteenth century' }),
               L({ es:'Cuántos puertos abiertos al comercio internacional poseía en sus costas', en:'How many ports open to international trade it had on its coasts' }) ],
    correct: 0, showWork: false
  }, rng);

}
</script>

<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbykkuJ_apGq3vALIFd4mr3acu81c7K4OKxW-DZ-i52Ceyl3lOanXMdvbS9SIXPrLQBm/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'La Revolución Industrial: Economía, Sociedad y Política';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
