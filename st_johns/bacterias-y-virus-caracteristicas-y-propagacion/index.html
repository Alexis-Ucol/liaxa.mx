      q:{ es:'Una niña vacunada contra el sarampión se contagia de influenza ese mismo invierno. ¿Qué muestra este hecho sobre los alcances de las vacunas?',
          en:'A girl vaccinated against measles catches influenza that same winter. What does this fact show about how far vaccines reach?' },
      opts:{ es:['Cada vacuna entrena al cuerpo para reconocer un microbio en particular, no a todos a la vez',
                 'Las vacunas dejan de funcionar cuando la persona se contagia de otra enfermedad',
                 'Solo las enfermedades causadas por bacterias tienen una vacuna disponible',
                 'La vacuna del sarampión falló, y por eso la niña se contagió de influenza'],
             en:['Each vaccine trains the body to recognise one particular microbe, not all of them at once',
                 'Vaccines stop working when the person catches another disease',
                 'Only diseases caused by bacteria have a vaccine available',
                 'The measles vaccine failed, and that is why the girl caught influenza'] },
      ci:0, showWork:false,
      hint:{ es:'Piensa qué es exactamente lo que el cuerpo aprende a reconocer cuando recibe una vacuna.',
             en:'Think about what exactly the body learns to recognise when it receives a vaccine.' },
      exp:{ es:'Una vacuna le muestra al cuerpo una pieza de un microbio concreto para que fabrique defensas contra ese microbio. Esas defensas no reconocen a otro distinto, así que la del sarampión no protege de la influenza. No hubo falla ni interferencia entre vacunas, y hay vacunas tanto contra virus como contra bacterias.',
            en:'A vaccine shows the body a piece of one specific microbe so that it builds defences against that microbe. Those defences do not recognise a different one, so the measles vaccine does not protect against influenza. There was no failure and no interference between vaccines, and there are vaccines against both viruses and bacteria.' }
    },
    {
      title:{ es:'El refrigerador descompuesto', en:'The broken refrigerator' },
      q:{ es:'Las vacunas de un centro de salud deben mantenerse frías desde la fábrica hasta el brazo del niño. Una tarde el refrigerador se descompone y todo el lote se descarta sin aplicarlo. ¿Qué muestra este hecho?',
          en:'The vaccines at a health centre must be kept cold from the factory to the arm of the child. One afternoon the refrigerator breaks down and the whole batch is discarded without being used. What does this fact show?' },
      opts:{ es:['Que el beneficio de una vacuna depende también de la tecnología y la organización que la llevan hasta la persona',
                 'Que las vacunas que necesitan frío son menos seguras que las demás',
                 'Que descartar el lote fue un error, porque una vacuna tibia protege igual',
                 'Que el refrigerador es lo que produce las defensas dentro del cuerpo'],
             en:['That the benefit of a vaccine also depends on the technology and the organisation that carry it to the person',
                 'That vaccines needing cold storage are less safe than the others',
                 'That discarding the batch was a mistake, because a warm vaccine protects just the same',
                 'That the refrigerator is what produces the defences inside the body'] },
      ci:0, showWork:false,
      hint:{ es:'La vacuna sola no basta: piensa en todo lo que tuvo que funcionar para que llegue en condiciones.',
             en:'The vaccine on its own is not enough: think of everything that had to work for it to arrive in good condition.' },
      exp:{ es:'El conocimiento científico que hace posible una vacuna necesita, para servir de algo, una cadena de refrigeración, transporte y personal que la aplique. Ahí están a la vez su alcance y su límite. Descartar el lote es lo correcto, porque una vacuna que perdió el frío puede dejar de funcionar, y quien fabrica las defensas es el cuerpo, no el equipo.',
            en:'The scientific knowledge that makes a vaccine possible needs, in order to be of any use, a chain of refrigeration, transport and staff to administer it. That is both its reach and its limit. Discarding the batch is the right call, because a vaccine that lost the cold chain may stop working, and the one that builds the defences is the body, not the equipment.' }
    }
  ];
  return pk(rng, vs);
}

/* ══════════════════════════════════════════════════════════════════════════
   buildLesson :: concepto, manipulativo, problema, alternados (Rule 1)
   ══════════════════════════════════════════════════════════════════════════ */
function buildLesson(rng){
  injectGuideCSS();
  problems = [];
  answeredCount = 0;
  correctCount = 0;
  var body = document.getElementById('lessonBody');
  body.innerHTML = '';
  var pf = document.getElementById('progFill');
  if (pf) pf.style.width = '0%';

  /* ── Apertura ── */
  sec(
    L({ es:'Punto de partida', en:'Starting point' }),
    L({ es:'Un estornudo el lunes, medio salón enfermo el viernes', en:'One sneeze on Monday, half the class ill by Friday' }),
    '<p>' + L({
      es:'El lunes falta una persona del grupo. El viernes faltan catorce. Nadie hizo nada raro: fueron a clase, compartieron el mismo aire, tomaron agua del mismo bebedero, abrieron la misma puerta. Lo que se movió entre ellos es tan pequeño que no cabe en la punta de un alfiler, y aun así alcanzó para vaciar medio salón en cinco días.',
      en:'On Monday one person is missing from the group. By Friday fourteen are. Nobody did anything strange: they went to class, shared the same air, drank from the same fountain, opened the same door. What moved between them is so small that it does not fit on the tip of a pin, and even so it was enough to empty half a classroom in five days.'
    }) + '</p>' +
    '<div class="callout"><p><strong>' + L({ es:'Idea clave: ', en:'Key idea: ' }) + '</strong>' + L({
      es:'las bacterias y los virus no son lo mismo, no se combaten igual y no se propagan por magia. Siguen un camino que se puede describir, contar y cortar. En esta guía vas a operar ese camino por dentro: vas a decidir cuántas personas alcanza un contagio, vas a armar una hipótesis y vas a mover la cobertura de vacunación de un vecindario hasta ver qué ocurre.',
      en:'Bacteria and viruses are not the same thing, are not fought the same way and do not spread by magic. They follow a route that can be described, counted and cut. In this guide you are going to operate that route from the inside: you will decide how many people an infection reaches, you will build a hypothesis and you will move the vaccination coverage of a neighbourhood until you see what happens.'
    }) + '</p></div>'
  );

  /* ══ CONCEPTO 1 :: qué es cada uno ══ */
  var s1 = sec(
    L({ es:'Concepto 1', en:'Concept 1' }),
    L({ es:'Una célula diminuta y algo que ni siquiera llega a célula', en:'A tiny cell and something that does not even reach being a cell' }),
    '<p>' + L({
      es:'Una bacteria es un ser vivo formado por una sola célula. Tiene su membrana, casi siempre una pared que la protege, y su material genético suelto adentro, sin un núcleo que lo encierre. Se alimenta, crece y se reproduce sola: cuando tiene alimento y calor se parte en dos, y cada mitad vuelve a partirse. Algunas causan enfermedad, como las de la infección de garganta o las de la diarrea, pero la mayoría no: hay bacterias en el yogur, en el queso y miles de millones en tu propio intestino ayudándote a digerir.',
      en:'A bacterium is a living thing made of a single cell. It has its membrane, almost always a wall that protects it, and its genetic material loose inside, with no nucleus enclosing it. It feeds, grows and reproduces on its own: given food and warmth it splits in two, and each half splits again. Some cause disease, such as those behind a throat infection or diarrhoea, but most do not: there are bacteria in yoghurt, in cheese and billions of them in your own gut helping you digest.'
    }) + '</p>' +
    '<p>' + L({
      es:'Un virus es otra cosa. No es una célula: es material genético envuelto en una cápsula de proteína, y nada más. No se alimenta, no crece y no puede hacer copias de sí mismo. Para reproducirse tiene que entrar en una célula viva y usar la maquinaria de esa célula como si fuera suya. Por eso, fuera de un cuerpo, un virus no hace nada. Y por eso un antibiótico, que ataca partes propias de una célula bacteriana, no le hace absolutamente nada a un virus.',
      en:'A virus is another matter. It is not a cell: it is genetic material wrapped in a protein capsule, and nothing more. It does not feed, does not grow and cannot make copies of itself. To reproduce it has to get into a living cell and use the machinery of that cell as though it were its own. That is why, outside a body, a virus does nothing. And that is why an antibiotic, which attacks parts belonging to a bacterial cell, does absolutely nothing to a virus.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Bacteria', en:'Bacterium' }), L({ es:'una célula', en:'one cell' }), L({ es:'se reproduce sola, se parte en dos', en:'reproduces alone, splits in two' })) +
      rcard(L({ es:'Virus', en:'Virus' }), L({ es:'no es célula', en:'not a cell' }), L({ es:'necesita entrar en una célula viva', en:'needs to get into a living cell' })) +
      rcard(L({ es:'Tamaño', en:'Size' }), L({ es:'el virus es mucho menor', en:'the virus is far smaller' }), L({ es:'unas cien veces más pequeño', en:'about a hundred times smaller' })) +
      rcard(L({ es:'Antibiótico', en:'Antibiotic' }), L({ es:'sirve contra bacterias', en:'works on bacteria' }), L({ es:'no tiene efecto sobre un virus', en:'has no effect on a virus' })) +
    '</div>'
  );
  wClasifica(rng, widgetHost(s1, 'wClasificaW', 'classify'));
  addProblem(rng, mkP1(rng));
  addProblem(rng, mkP2(rng));

  /* ══ CONCEPTO 2 :: la cadena de contagio ══ */
  var s2 = sec(
    L({ es:'Concepto 2', en:'Concept 2' }),
    L({ es:'El camino que recorre un microbio', en:'The route a microbe travels' }),
    '<p>' + L({
      es:'Una enfermedad infecciosa es la que provoca un microbio que puede pasar de un cuerpo a otro. Ese paso nunca es un salto: es un recorrido con eslabones. Primero hay alguien o algo donde el microbio vive, que suele ser una persona o un animal enfermo. Después el microbio sale de ahí, en las gotitas de una tos, en las manos, en las heces. Luego viaja por un camino: el aire de un salón cerrado, el agua del bebedero, un alimento, una manija. Al final entra en otra persona por la nariz, la boca, los ojos o una herida, y ahí empieza otra vez.',
      en:'An infectious disease is one caused by a microbe that can pass from one body to another. That passing is never a jump: it is a route with links. First there is someone or something where the microbe lives, usually a sick person or animal. Then the microbe leaves, in the droplets of a cough, on hands, in faeces. Next it travels along a route: the air of a closed classroom, the water in a fountain, a food, a door handle. Finally it enters another person through the nose, the mouth, the eyes or a wound, and there it starts again.'
    }) + '</p>' +
    '<p>' + L({
      es:'Verlo así cambia todo, porque una cadena se rompe por cualquiera de sus eslabones. No hace falta atacar al microbio para detener un brote: basta con quitarle el camino. Cerrar un bebedero contaminado, lavarse las manos, ventilar el salón, cubrirse al toser o quedarse en casa cortan eslabones distintos, y cada uno detiene el recorrido en un punto diferente.',
      en:'Seeing it this way changes everything, because a chain breaks at any of its links. You do not need to attack the microbe to stop an outbreak: it is enough to take away its route. Closing a contaminated fountain, washing hands, airing the classroom, covering a cough or staying home cut different links, and each one stops the route at a different point.'
    }) + '</p>'
  );
  wCadena(rng, widgetHost(s2, 'wCadenaW', 'timeline'));
  addProblem(rng, mkP3(rng));

  /* ══ CONCEPTO 3 :: por qué tan rápido ══ */
  var s3 = sec(
    L({ es:'Concepto 3', en:'Concept 3' }),
    L({ es:'Por qué medio salón, y no dos personas', en:'Why half a class, and not two people' }),
    '<p>' + L({
      es:'Que exista un camino todavía no explica la velocidad. Lo que la explica es que el contagio no suma: multiplica. Si cada persona enferma alcanza a dos, esas dos alcanzan a cuatro, esas cuatro a ocho. La cuenta crece por rondas y en pocas rondas se dispara, aunque en cada paso individual no parezca gran cosa.',
      en:'Having a route still does not explain the speed. What explains it is that infection does not add up: it multiplies. If each sick person reaches two, those two reach four, those four reach eight. The count grows in rounds and within a few rounds it takes off, even though each individual step does not look like much.'
    }) + '</p>' +
    '<p>' + L({
      es:'A eso se le suman tres cosas. La primera es que muchos microbios se multiplican dentro del cuerpo a una velocidad enorme: hay bacterias que se parten en dos cada veinte minutos. La segunda es que buena parte del contagio ocurre antes de que aparezcan los síntomas, cuando la persona todavía se siente bien y sigue con su vida normal. La tercera es el entorno: un salón cerrado, un transporte lleno o un bebedero compartido multiplican los contactos de cada persona.',
      en:'Three things add to that. The first is that many microbes multiply inside the body at an enormous rate: there are bacteria that split in two every twenty minutes. The second is that a good part of the spreading happens before symptoms appear, while the person still feels fine and carries on as normal. The third is the setting: a closed classroom, a crowded bus or a shared drinking fountain multiply the contacts each person has.'
    }) + '</p>' +
    '<div class="callout"><p>' + L({
      es:'De ahí sale la consecuencia que más cuesta creer: bajar en uno solo el número de personas que cada enfermo alcanza no reduce el brote un poco, lo reduce muchísimo, porque esa resta se repite en cada ronda.',
      en:'From this comes the consequence hardest to believe: lowering by just one the number of people each sick person reaches does not shrink the outbreak a little, it shrinks it enormously, because that subtraction repeats in every round.'
    }) + '</p></div>'
  );
  wPropaga(rng, widgetHost(s3, 'wPropagaW', 'contagio'));
  addProblem(rng, mkP4(rng));
  addProblem(rng, mkP5(rng));

  /* ══ CONCEPTO 4 :: hipótesis y evidencia ══ */
  var s4 = sec(
    L({ es:'Concepto 4', en:'Concept 4' }),
    L({ es:'De la sospecha a algo que se puede comprobar', en:'From a hunch to something you can check' }),
    '<p>' + L({
      es:'Cuando un brote aparece, lo primero que surge son sospechas: fue el agua, fue el salón cerrado, fue que nadie se lava las manos. Una sospecha se vuelve útil cuando se convierte en hipótesis, es decir, en una respuesta propuesta que enlaza dos cosas que se pueden observar y contar. Suele escribirse así: si ocurre esto, entonces esperaría observar aquello.',
      en:'When an outbreak appears, the first thing that comes up is hunches: it was the water, it was the closed classroom, it was that nobody washes their hands. A hunch becomes useful when it turns into a hypothesis, that is, a proposed answer linking two things that can be observed and counted. It is usually written like this: if this happens, then I would expect to observe that.'
    }) + '</p>' +
    '<p>' + L({
      es:'No todo lo que suena razonable sirve. Una pregunta no es una hipótesis. Una opinión sobre lo desagradable que es la enfermedad tampoco. Una propuesta de qué debería hacerse tampoco. Y una causa que no se puede medir ni cambiar, como la mala suerte, deja la hipótesis sin manera de ponerse a prueba.',
      en:'Not everything that sounds reasonable will do. A question is not a hypothesis. An opinion about how unpleasant the illness is will not do either. Nor will a proposal about what ought to be done. And a cause that cannot be measured or changed, such as bad luck, leaves the hypothesis with no way of being tested.'
    }) + '</p>' +
    '<p>' + L({
      es:'El segundo paso es contrastarla. Eso significa buscar el dato que la sostiene o la tumba, y compararlo con lo que reportan fuentes con sustento científico: instituciones de salud, hospitales, laboratorios que publican lo que midieron y cómo lo midieron. Un mensaje reenviado no es una fuente, aunque venga de alguien de confianza, y una experiencia propia sin grupo de comparación no alcanza para concluir.',
      en:'The second step is checking it. That means looking for the data that holds it up or knocks it down, and comparing it with what scientifically grounded sources report: health institutions, hospitals, laboratories that publish what they measured and how they measured it. A forwarded message is not a source, even coming from somebody you trust, and your own experience with no comparison group is not enough to conclude anything.'
    }) + '</p>'
  );
  wHipotesis(rng, widgetHost(s4, 'wHipotesisW', 'hipotesis'));
  addProblem(rng, mkP6(rng));
  addProblem(rng, mkP7(rng));

  /* ══ CONCEPTO 5 :: las vacunas ══ */
  var s5 = sec(
    L({ es:'Concepto 5', en:'Concept 5' }),
    L({ es:'Un ensayo antes de la función', en:'A rehearsal before the performance' }),
    '<p>' + L({
      es:'Tu cuerpo tiene un sistema de defensa que aprende. Cuando un microbio entra por primera vez, tarda días en reconocerlo y en fabricar las defensas que lo neutralizan, y en esos días te enfermas. Una vacuna adelanta ese aprendizaje: le presenta al cuerpo una pieza del microbio, o una versión debilitada que no puede causar la enfermedad, y el cuerpo fabrica sus defensas con calma, sin brote de por medio. Cuando después llega el microbio verdadero, las defensas ya están listas.',
      en:'Your body has a defence system that learns. When a microbe gets in for the first time, it takes days to recognise it and to build the defences that neutralise it, and during those days you fall ill. A vaccine brings that learning forward: it shows the body a piece of the microbe, or a weakened version that cannot cause the disease, and the body builds its defences calmly, with no outbreak involved. When the real microbe arrives later, the defences are ready.'
    }) + '</p>' +
    '<p>' + L({
      es:'La vacuna hace además algo que no se ve en la persona vacunada: corta la cadena. Quien no se enferma tampoco contagia, así que deja de ser un eslabón. Y ahí aparece lo importante para la comunidad. Siempre hay personas que no se pueden vacunar, como los bebés muy pequeños o quienes están recibiendo ciertos tratamientos. Cuando la cobertura es alta, esas personas quedan rodeadas de eslabones rotos y el microbio no encuentra camino para llegar hasta ellas. A eso se le llama protección de la comunidad, y por eso vacunarse no es solo una decisión personal.',
      en:'A vaccine also does something you cannot see in the vaccinated person: it cuts the chain. Whoever does not fall ill does not pass it on either, so they stop being a link. And that is where what matters for the community appears. There are always people who cannot be vaccinated, such as very young babies or those on certain treatments. When coverage is high, those people end up surrounded by broken links and the microbe finds no route to reach them. That is called community protection, and it is why getting vaccinated is not only a personal decision.'
    }) + '</p>'
  );
  wCobertura(rng, widgetHost(s5, 'wCoberturaW', 'vacuna'));
  addProblem(rng, mkP8(rng));

  /* ══ CONCEPTO 6 :: beneficios, costos y límites ══ */
  var s6 = sec(
    L({ es:'Concepto 6', en:'Concept 6' }),
    L({ es:'Lo que gana la comunidad y lo que cuesta', en:'What the community gains and what it costs' }),
    '<p>' + L({
      es:'Una campaña de vacunación se decide poniendo los dos lados sobre la mesa. Del lado de los beneficios están las personas que no enferman, los días de escuela y de trabajo que nadie pierde, las camas de hospital que quedan libres y las enfermedades que casi desaparecieron de un país. Del lado de los costos está el dinero de producir, transportar y aplicar cada dosis, y también los efectos leves y pasajeros que pueden aparecer, como dolor en el brazo o algo de fiebre por un día.',
      en:'A vaccination campaign is decided by putting both sides on the table. On the benefits side are the people who do not fall ill, the school and work days nobody loses, the hospital beds left free and the diseases that have almost disappeared from a country. On the costs side is the money to produce, transport and administer each dose, and also the mild, passing effects that may appear, such as a sore arm or a little fever for a day.'
    }) + '</p>' +
    '<p>' + L({
      es:'El conocimiento científico y la tecnología van juntos, y los dos tienen límites. Una vacuna protege contra un microbio en particular y no contra todos. Algunas hay que renovarlas porque el virus cambia con los años. Y ninguna sirve si no llega en condiciones: casi todas necesitan mantenerse frías desde la fábrica hasta el brazo, y si se rompe esa cadena de frío el lote se descarta. Evaluar una campaña es mirar todo eso con números y decidir con ellos, no con un rumor.',
      en:'Scientific knowledge and technology go together, and both have limits. A vaccine protects against one particular microbe and not against all of them. Some have to be renewed because the virus changes over the years. And none is any use if it does not arrive in good condition: almost all must be kept cold from the factory to the arm, and if that cold chain breaks the batch is discarded. Evaluating a campaign means looking at all of that with numbers and deciding with them, not with a rumour.'
    }) + '</p>'
  );
  wReflect(rng, widgetHost(s6, 'wReflexion', 'reflect'));

  /* ══ Cierre :: las preguntas que quedan ══ */
  addProblem(rng, mkP9(rng));
  addProblem(rng, mkP10(rng));
}
</script>

<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbykkuJ_apGq3vALIFd4mr3acu81c7K4OKxW-DZ-i52Ceyl3lOanXMdvbS9SIXPrLQBm/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'Bacterias y Virus: Características y Propagación';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
