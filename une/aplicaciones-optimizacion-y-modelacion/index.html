<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aplicaciones: Optimización y Modelación</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Aplicaciones: Optimización y Modelación</div>
    <div class="wcourse" id="wcourse-el">Pensamiento Matemático III · Cálculo · Sem 3</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Aplicaciones: Optimización y Modelación</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="sbtn" id="dlBtn" onclick="generatePDF()" style="max-width:280px;margin:0 auto;">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   CENTRALIZED SCHOOL CONFIG (Rule 16) — ships UNBRANDED (Rule 11).
   The ONLY rebranding point. build_all.py substitutes these exact fields
   (BRAND_FIELDS / RGB_FIELDS / logo*) downstream; :root/dark stay as fallback.
   Neutral defaults below == the static :root/dark values, so unbranded == no-op.
   ══════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:'#24246c', primaryDark:'#14143f', primaryBg:'#e9e9f4',
  accent:'#e42424', accentBg:'#fbdfdf',
  darkPrimary:'#5555b4', darkPrimaryDark:'#8383d7', darkPrimaryBg:'#121234',

function getAttemptKey(name, group){ return 'pm3_t06_g01__att__' + (name+'__'+group).replace(/\s+/g,'_'); }

function lsKey() {
  var n = (studentData.name  || '').trim();
  var g = (studentData.group || '').trim();
  return 'pm3_t06_g01__' + (n + '__' + g).replace(/\s+/g, '_');

function saveSession() {
  if (!studentData.name) return;
  var drawings = [], texts = [], photos = [];
  problems.forEach(function(p, i) {
    var dc = document.getElementById('dc' + i);
    if (dc && dc.width) {
      var blank = document.createElement('canvas');
      blank.width = dc.width; blank.height = dc.height;
      drawings.push(dc.toDataURL() === blank.toDataURL() ? null : dc.toDataURL('image/png'));
    } else { drawings.push(null); }
    var ta = document.getElementById('ta' + i);
    texts.push(ta ? ta.value : '');
    var pp = document.getElementById('pp' + i);
    photos.push((pp && pp.src && pp.src.indexOf('data:') === 0) ? pp.src : null);
  });
  var state = {
    name: studentData.name, group: studentData.group,
    answeredCount: answeredCount, correctCount: correctCount,
    choices: problems.map(function(p) { return p.studentChoice; }),
    drawings: drawings, texts: texts, photos: photos
  };
  try { localStorage.setItem(lsKey(), JSON.stringify(state)); } catch(e) {}
}

function loadSession(name, group) {
  var key = 'pm3_t06_g01__' + (name + '__' + group).replace(/\s+/g, '_');
  try { var r = localStorage.getItem(key); return r ? JSON.parse(r) : null; } catch(e) { return null; }
}

function restoreSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  var saved = loadSession(name, group);
  if (!saved) return;
  document.getElementById('restoreBar').style.display = 'none';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = currentAttempt(name, group);
  buildLesson(seededRng(name + group + att));
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
  saved.choices.forEach(function(choice, idx) {
    if (choice !== null && choice !== undefined) confirmMC(idx, choice);
  });
  setTimeout(function() {
    if (saved.drawings) {
      saved.drawings.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var dc = document.getElementById('dc' + i);
        if (!dc || !dc.width) return;
        var img = new Image();
        img.onload = function() {
          var dpr = window.devicePixelRatio || 1;
          dc.getContext('2d').drawImage(img, 0, 0, dc.width / dpr, dc.height / dpr);
        };
        img.src = dataUrl;
      });
    }
    if (saved.texts) {
      saved.texts.forEach(function(text, i) {
        if (!text) return;
        var ta = document.getElementById('ta' + i);
        if (ta) ta.value = text;
      });
    }
    if (saved.photos) {
      saved.photos.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var pp = document.getElementById('pp' + i);
        if (!pp) return;
        pp.src = dataUrl; pp.style.display = 'block';
        var pz = document.getElementById('pz' + i);
        if (pz) pz.style.opacity = '0.4';
      });
    }
  }, 300);
}

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

async function generatePDF() {
  var btn = document.getElementById('dlBtn');

  var jspdf   = window.jspdf;
  var doc     = new jspdf.jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });
  var PW      = 215.9;
  var M       = 18;
  var TW      = PW - M * 2;
  var PH      = doc.internal.pageSize.height;
  var name    = studentData.name;
  var group   = studentData.group;
  var total   = problems.length;
  var pct     = Math.round(correctCount / total * 100);
  var dateStr = new Date().toLocaleString('es-MX', { dateStyle:'long', timeStyle:'short' });

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS — INJECTION BLOCK ─────────────────────────────────────────
  //   Match these RGB values to --green and --gold above.
  //   PRIMARY  → pBR, pBG, pBB
  //   ACCENT   → pAR, pAG, pAB
  // ──────────────────────────────────────────────────────────────────────────
  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;  // PRIMARY (from SCHOOL, Rule 16)
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;   // ACCENT (from SCHOOL, Rule 16)

  function pdfText(html) {
    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/\u2192/g,'->').replace(/\u2212/g,'-').replace(/\u00b2/g,'^2')
      .replace(/\u00b3/g,'^3').replace(/\u00d7/g,'x').replace(/\u00f7/g,'/')
      .replace(/\u2260/g,'!=').replace(/\u2264/g,'<=').replace(/\u2265/g,'>=')
      .replace(/\u221a/g,'sqrt').replace(/\u03c0/g,'pi').replace(/\u2026/g,'...')
      .replace(/\s+/g,' ').trim();
  }

  // ── PORTADA: orange line / white logo strip / orange line / blue band ──
  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,2,'F');   // top accent line
  doc.setFillColor(255,255,255); doc.rect(0,2,PW,26,'F');                               // white logo strip
  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,28,PW,2,'F');  // bottom accent line
  doc.setFillColor(pBR,pBG,pBB); doc.rect(0,30,PW,34,'F');       // blue header band

  // ── PDF LOGO INJECTION BLOCK ─────────────────────────────────────────────
  //   When injecting logos, replace the two placeholder lines below with:
  //     var logoLeftB64  = 'data:image/png;base64,...';   // from LOGOS_MASTER.HTML
  //     var logoRightB64 = 'data:image/png;base64,...';   // from LOGOS_MASTER.HTML

  doc.lines([[2.57-1.03,4.63-6.17],[4.11-2.57,5.14-4.63],[5.66-4.11,2.57-5.14]], lx+1.03, ly+6.17);

    exLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    wy += ansBoxH + 5;

    doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
    doc.setFontSize(7); doc.setFont('helvetica','bold');
    doc.rect(M,wy,TW,8,'F'); doc.text('TRABAJO DEL ALUMNO', M+4, wy+5.5);
    wy += 11;

    var dc = document.getElementById('dc'+i);
    if (dc) {
      try {
        var imgD = dc.toDataURL('image/png');
        var ar   = dc.height / dc.width;
        var iw   = TW;
        var ih   = Math.min(iw * ar, 68);
        doc.addImage(imgD, 'PNG', M, wy, iw, ih);
        wy += ih + 4;
      } catch(e) {}
    }

    var ta = document.getElementById('ta'+i);
    if (ta && ta.value.trim()) {
      if (wy > PH-30) { doc.addPage(); wy = 20; }
      doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('courier','normal');
      var taLines = doc.splitTextToSize(ta.value, TW);
      taLines.slice(0,16).forEach(function(ln) {
        if (wy > PH-15) { doc.addPage(); wy = 20; }
        doc.text(ln, M, wy); wy += 5;
      });
      wy += 2;
    }

    var pp = document.getElementById('pp'+i);
    if (pp && pp.src && pp.src.indexOf('data:') === 0) {
      if (wy > PH-55) { doc.addPage(); wy = 20; }
      try { doc.addImage(pp.src, 'JPEG', M, wy, TW, 68); wy += 72; } catch(e) {}
    }
  }

  // ── Footer on every page ──
  var pages = doc.internal.getNumberOfPages();
  for (var p = 1; p <= pages; p++) {
    doc.setPage(p);
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0, PH-3, PW, 3, 'F');
    doc.setTextColor(130,140,160); doc.setFontSize(6.5); doc.setFont('helvetica','normal');
    doc.text(name+'  ·  '+group+'  ·  Código: '+code+'  ·  Página '+p+'/'+pages,
      PW/2, PH-5, {align:'center'});
  }

  var _fn = 'pm3_t06_g01_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf';
  var _pdfBlob = doc.output('blob');
  var _blobUrl = URL.createObjectURL(_pdfBlob);
  var _a = document.createElement('a');
  _a.href = _blobUrl;
  _a.download = _fn;
  document.body.appendChild(_a);
  _a.click();
  setTimeout(function(){ document.body.removeChild(_a); URL.revokeObjectURL(_blobUrl); }, 200);
  btn.innerHTML = '⬇  ' + t('btn-pdf');
  btn.disabled  = false;
}

/* ================================================
   buildLesson — OVERRIDE IN EACH GUIDE
   ================================================ */
function buildLesson(rng) {
  var body = document.getElementById('lessonBody');
  body.innerHTML = '';
  problems = [];
  var ES = (LANG === 'es');

  function T(es, en) { return ES ? es : en; }
  function frac(n, d) {
    return '<span class="mf-outer"><span class="mf-num">' + n + '</span><span class="mf-den">' + d + '</span></span>';
  }
  function iv(n) { return n < 0 ? '−' + (-n) : '' + n; }
  function fmt1(v) {
    var s = (Math.round(v * 10) / 10).toFixed(1);
    return s.charAt(0) === '-' ? '−' + s.slice(1) : s;
  }
  function cssVar(n) {
    var v = getComputedStyle(document.documentElement).getPropertyValue(n);
    return v ? v.trim() : '';
  }
  function addSection(tagEs, tagEn, titleEs, titleEn, htmlEs, htmlEn) {
    var d = document.createElement('div');
    d.className = 'section';
    d.innerHTML = '<div class="stag">' + T(tagEs, tagEn) + '</div>' +
      '<h2>' + T(titleEs, titleEn) + '</h2>' + T(htmlEs, htmlEn);
    body.appendChild(d);
  }
  function shuffleOpts(opts) {
    var order = shuffle([0, 1, 2, 3], rng), out = [], ci = 0;
    for (var i = 0; i < 4; i++) { out.push(opts[order[i]]); if (order[i] === 0) ci = i; }
    return { opts: out, correctIdx: ci };
  }
  function addProblem(spec) {
    var sh = shuffleOpts(spec.options);
    var i = problems.length;
    problems.push({
      title: spec.title,
      questionText: spec.q,
      fn: spec.fn || '',
      hint: spec.hint,
      explanation: spec.exp,
      options: sh.opts,
      correctIdx: sh.correctIdx,
      showWork: !!spec.showWork,
      studentChoice: null,
      pendingChoice: null
    });
    buildOneCard(problems[i], i);
  }

  /* ============ interactive laboratory 1: horizontal tangent ============ */
  function buildTangentLab() {
    var rounds = [], i;
    for (i = 0; i < 3; i++) {
      var v = Math.floor(rng() * 7) - 3;
      var sg = rng() < 0.5 ? 1 : -1;
      var hh0 = Math.floor(rng() * 7) - 3;
      var st0 = v + (rng() < 0.5 ? -4 : 4);
      if (st0 > 6) st0 = 6;
      if (st0 < -6) st0 = -6;
      rounds.push({ v: v, s: sg, h: hh0, start: st0 });
    }
    var W = { r: 0, tries: 0, x: rounds[0].start, done: false };
    var wrap = document.createElement('div');
    wrap.className = 'gcrd section';
    wrap.id = 'w1';
    wrap.setAttribute('data-widget', 'tangente');
    body.appendChild(wrap);

    function cur() { return rounds[Math.min(W.r, 2)]; }
    function fy(d, x) { return d.s * (x - d.v) * (x - d.v) / 2 + d.h; }
    function fp(d, x) { return d.s * (x - d.v); }

    function draw() {
      var cv = document.getElementById('w1cv');
      if (!cv) return;
      var rct = cv.getBoundingClientRect();
      var w = rct.width, hgt = rct.height;
      if (!w || !hgt) return;
      var dpr = window.devicePixelRatio || 1;
      cv.width = w * dpr; cv.height = hgt * dpr;
      var ctx = cv.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      var d = cur(), k, lo = 1e9, hi = -1e9, yy;
      for (k = 0; k <= 120; k++) { yy = fy(d, -6 + 12 * k / 120); if (yy < lo) lo = yy; if (yy > hi) hi = yy; }
      var pad = (hi - lo) * 0.16 + 1; lo -= pad; hi += pad;
      function px(x) { return (x + 6) / 12 * (w - 26) + 13; }
      function py(y) { return hgt - 12 - (y - lo) / (hi - lo) * (hgt - 24); }
      ctx.fillStyle = cssVar('--surface');
      ctx.fillRect(0, 0, w, hgt);
      ctx.strokeStyle = cssVar('--border');
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (k = -6; k <= 6; k += 2) { ctx.moveTo(px(k), 5); ctx.lineTo(px(k), hgt - 5); }
      if (lo < 0 && hi > 0) { ctx.moveTo(8, py(0)); ctx.lineTo(w - 8, py(0)); }
      ctx.stroke();
      ctx.strokeStyle = cssVar('--green');
      ctx.lineWidth = 2.4;
      ctx.beginPath();
      for (k = 0; k <= 170; k++) {
        var xv = -6 + 12 * k / 170;
        if (k === 0) ctx.moveTo(px(xv), py(fy(d, xv))); else ctx.lineTo(px(xv), py(fy(d, xv)));
      }
      ctx.stroke();
      var m = fp(d, W.x), y0 = fy(d, W.x);
      ctx.strokeStyle = cssVar('--gold');
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(px(W.x - 2.6), py(y0 - m * 2.6));
      ctx.lineTo(px(W.x + 2.6), py(y0 + m * 2.6));
      ctx.stroke();
      ctx.fillStyle = cssVar('--green-dark');
      ctx.beginPath();
      ctx.arc(px(W.x), py(y0), 5, 0, 6.2832);
      ctx.fill();
    }

    function shell() {
      wrap.innerHTML =
        '<div class="stag iw-tag">' + T('Laboratorio de la tangente', 'Tangent lab') + '</div>' +
        '<div class="iw-sub" style="font-size:.87rem;color:var(--text2);margin-bottom:.75rem">' +
        T('Curva ' + (Math.min(W.r, 2) + 1) + ' de 3. Desliza el punto y observa cómo se inclina la recta tangente. Detente donde la pendiente marque cero y fija ese lugar.',
          'Curve ' + (Math.min(W.r, 2) + 1) + ' of 3. Slide the point and watch how the tangent line tilts. Stop where the slope reads zero and lock that spot.') +
        '</div>' +
        '<div class="cvwrap"><canvas class="dcanvas" id="w1cv" style="cursor:default"></canvas></div>' +
        '<div class="cgrid" style="margin-top:.75rem"><div class="cg">' +
        '<label>' + T('Posición sobre la curva', 'Position along the curve') + ': <span class="cval" id="w1xv"></span></label>' +
        '<input type="range" id="w1s" min="-6" max="6" step="0.5" value="' + W.x + '" oninput="w1Move(this.value)">' +
        '</div></div>' +
        '<div class="metrics">' +
        '<div class="metric"><div class="mlbl">' + T('Altura', 'Height') + '</div><div class="mnum ts" id="w1h"></div></div>' +
        '<div class="metric"><div class="mlbl">' + T('Pendiente', 'Slope') + '</div><div class="mnum ps" id="w1m"></div></div>' +
        '<div class="metric"><div class="mlbl">' + T('Curva', 'Curve') + '</div><div class="mnum ts" id="w1r"></div></div>' +
        '</div>' +
        '<button class="hintbtn" style="margin-top:.85rem;min-height:44px" onclick="w1Mark()">' +
        T('Fijar este punto', 'Lock this point') + '</button>' +
        '<div id="w1fb" style="font-size:.85rem;margin-top:.45rem;color:var(--text2);min-height:1.3rem"></div>';
      update();
      setTimeout(draw, 140);
    }

    function update() {
      var d = cur(), m = fp(d, W.x);
      var e1 = document.getElementById('w1xv'); if (e1) e1.textContent = 'x = ' + fmt1(W.x);
      var e2 = document.getElementById('w1h'); if (e2) e2.textContent = fmt1(fy(d, W.x));
      var e3 = document.getElementById('w1m');
      if (e3) { e3.textContent = fmt1(m); e3.className = 'mnum ' + (Math.abs(m) < 0.001 ? 'cs' : 'ps'); }
      var e4 = document.getElementById('w1r'); if (e4) e4.textContent = (Math.min(W.r, 2) + 1) + '/3';
      var sl = document.getElementById('w1s'); if (sl && sl.value !== String(W.x)) sl.value = W.x;
      draw();
    }
    function say(msg, good) {
      var fb = document.getElementById('w1fb');
      if (fb) fb.innerHTML = good ? '<span style="color:var(--ok);font-weight:600">' + msg + '</span>' : msg;
    }

    window.w1Move = function (val) { if (W.done) return; W.x = parseFloat(val); update(); };
    window.w1Mark = function () {
      if (W.done) return;
      var d = cur();
      if (Math.abs(W.x - d.v) < 0.26) {
        W.r++; W.tries = 0;
        if (W.r >= 3) {
          W.done = true; update();
          say(T('Las tres curvas quedaron resueltas. La tangente horizontal siempre señaló el punto crítico.',
                'All three curves are solved. The horizontal tangent always pointed at the critical point.'), true);
          return;
        }
        W.x = rounds[W.r].start; shell();
        say(T('Pendiente cero localizada. Aquí tienes otra curva.', 'Zero slope located. Here is another curve.'), true);
        return;
      }
      W.tries++;
      if (W.tries >= 3) {
        W.x = d.v; update();
        say(T('La pendiente se anula en x = ' + iv(d.v) + '. Ahí la tangente queda horizontal y el modelo deja de crecer o de decrecer.',
              'The slope vanishes at x = ' + iv(d.v) + '. There the tangent turns horizontal and the model stops rising or falling.'), false);
        W.r++; W.tries = 0;
        if (W.r >= 3) { W.done = true; return; }
        setTimeout(function () { W.x = rounds[W.r].start; shell(); }, 1900);
        return;
      }
      var dir = (W.x < d.v) ? T('a la derecha', 'to the right') : T('a la izquierda', 'to the left');
      say(T('Todavía no. La pendiente vale ' + fmt1(fp(d, W.x)) + ', así que la tangente sigue inclinada: muévete ' + dir + '.',
            'Not yet. The slope reads ' + fmt1(fp(d, W.x)) + ', so the tangent is still tilted: move ' + dir + '.'), false);
    };
    shell();
  }

  /* ============ interactive laboratory 2: sort the critical points ============ */
  function buildClassifier() {
    var p = 2 + Math.floor(rng() * 5);
    var q = 4 + 2 * Math.floor(rng() * 4);
    var BINS = [T('Máximo local', 'Local maximum'), T('Mínimo local', 'Local minimum')];
    var ITEMS = [
      { t: T('f′(' + p + ') = 0 y f″(' + p + ') = −' + q, 'f′(' + p + ') = 0 and f″(' + p + ') = −' + q), bin: 0 },
      { t: T('g′(' + (p + 3) + ') = 0 y g″(' + (p + 3) + ') = ' + (q + 2), 'g′(' + (p + 3) + ') = 0 and g″(' + (p + 3) + ') = ' + (q + 2)), bin: 1 },
      { t: T('La tangente es horizontal en x = ' + (p + 1) + ' y ahí la curva abre hacia abajo', 'The tangent is horizontal at x = ' + (p + 1) + ' and the curve opens downward there'), bin: 0 },
      { t: T('El costo deja de bajar y empieza a subir en x = ' + (p + 2), 'Cost stops falling and starts rising at x = ' + (p + 2)), bin: 1 },
      { t: T('La utilidad deja de subir y empieza a bajar en x = ' + (p + 4), 'Profit stops rising and starts falling at x = ' + (p + 4)), bin: 0 }
    ];
    var seq = shuffle([0, 1, 2, 3, 4], rng);
    var S = { i: 0, tries: 0, hits: 0, done: false };
    var wrap = document.createElement('div');
    wrap.className = 'gcrd section';
    wrap.id = 'w2';
    wrap.setAttribute('data-widget', 'classify');
    body.appendChild(wrap);

    function render() {
      var head =
        '<div class="stag iw-tag">' + T('Mesa de clasificación', 'Sorting table') + '</div>' +
        '<div class="iw-sub" style="font-size:.87rem;color:var(--text2);margin-bottom:.75rem">' +
        T('Lee cada evidencia y colócala en la caja que le corresponde.', 'Read each piece of evidence and drop it in the box it belongs to.') + '</div>';
      if (S.done) {
        wrap.innerHTML = head + '<div style="text-align:center;font-weight:700;color:var(--ok);padding:.7rem">' +
          T('Mesa completa: ' + S.hits + ' de ' + ITEMS.length + ' clasificadas a la primera.',
            'Table complete: ' + S.hits + ' of ' + ITEMS.length + ' sorted on the first try.') + '</div>';
        return;
      }
      var it = ITEMS[seq[S.i]];
      wrap.innerHTML = head +
        '<div style="font-family:\'IBM Plex Mono\',monospace;font-size:.7rem;letter-spacing:.08em;color:var(--text3);margin-bottom:.35rem">' +
        (S.i + 1) + ' / ' + ITEMS.length + '</div>' +
        '<div class="pstmt" style="text-align:center;font-weight:600">' + it.t + '</div>' +
        '<div class="mtabs" style="margin-top:.8rem">' +
        '<button class="mtab" style="min-height:44px;flex:1" onclick="w2Pick(0)">' + BINS[0] + '</button>' +
        '<button class="mtab" style="min-height:44px;flex:1" onclick="w2Pick(1)">' + BINS[1] + '</button>' +
        '</div>' +
        '<div id="w2fb" style="font-size:.85rem;margin-top:.45rem;color:var(--text2);min-height:1.3rem"></div>';
    }
    function advance() {
      S.i++; S.tries = 0;
      if (S.i >= ITEMS.length) S.done = true;
      render();
    }
    window.w2Pick = function (b) {
      if (S.done) return;
      var it = ITEMS[seq[S.i]];
      var fb = document.getElementById('w2fb');
      if (b === it.bin) {
        if (S.tries === 0) S.hits++;
        advance();
        var f2 = document.getElementById('w2fb');
        if (f2) f2.innerHTML = '<span style="color:var(--ok);font-weight:600">' +
          T('Bien clasificada. Sigue la siguiente.', 'Well sorted. On to the next one.') + '</span>';
        return;
      }
      S.tries++;
      if (S.tries >= 3) {
        var right = BINS[it.bin];
        advance();
        var f3 = document.getElementById('w2fb');
        if (f3) f3.innerHTML = T('Esa evidencia describe un <b>' + right + '</b>: cuando la curva abre hacia abajo la tangente horizontal corona el modelo, y cuando abre hacia arriba lo hunde.',
                                 'That evidence describes a <b>' + right + '</b>: when the curve opens downward the horizontal tangent crowns the model, and when it opens upward it sinks it.');
        return;
      }
      if (fb) fb.textContent = T('Inténtalo otra vez: pregúntate si el modelo viene subiendo y se detiene, o viene bajando y se detiene.',
                                 'Try again: ask whether the model was rising and stopped, or falling and stopped.');
    };
    render();
  }

  /* ============ interactive laboratory 3: the fence against a wall ============ */
  function buildCorral(totalFence) {
    var opt = totalFence / 4;
    var maxY = totalFence / 2 - 1;
    var C = { y: (rng() < 0.5 ? 2 : maxY - 1), tries: 0, done: false };
    var wrap = document.createElement('div');
    wrap.className = 'gcrd section';
    wrap.id = 'w3';
    wrap.setAttribute('data-widget', 'corral');
    body.appendChild(wrap);

    function draw() {
      var cv = document.getElementById('w3cv');
      if (!cv) return;
      var rct = cv.getBoundingClientRect();
      var w = rct.width, hgt = rct.height;
      if (!w || !hgt) return;
      var dpr = window.devicePixelRatio || 1;
      cv.width = w * dpr; cv.height = hgt * dpr;
      var ctx = cv.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = cssVar('--surface');
      ctx.fillRect(0, 0, w, hgt);
      var x = totalFence - 2 * C.y;
      var sc = Math.min((w - 40) / totalFence, (hgt - 46) / (totalFence / 2));
      var rw = x * sc, rh = C.y * sc;
      var x0 = (w - rw) / 2, y0 = 26;
      ctx.strokeStyle = cssVar('--text3');
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(x0 - 18, y0); ctx.lineTo(x0 + rw + 18, y0);
      ctx.stroke();
      ctx.fillStyle = cssVar('--green-bg');
      ctx.fillRect(x0, y0, rw, rh);
      ctx.strokeStyle = cssVar('--green');
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(x0, y0); ctx.lineTo(x0, y0 + rh);
      ctx.lineTo(x0 + rw, y0 + rh); ctx.lineTo(x0 + rw, y0);
      ctx.stroke();
      ctx.fillStyle = cssVar('--text3');
      ctx.font = '11px sans-serif';
      ctx.fillText(T('muro', 'wall'), x0 - 12, y0 - 8);
      ctx.fillStyle = cssVar('--text2');
      ctx.fillText('x = ' + x, x0 + rw / 2 - 14, y0 + rh + 15);
      ctx.fillText('y = ' + C.y, x0 - 4 + rw + 6, y0 + rh / 2);
    }
    function shell() {
      wrap.innerHTML =
        '<div class="stag iw-tag">' + T('Constructor de corral', 'Pen builder') + '</div>' +
        '<div class="iw-sub" style="font-size:.87rem;color:var(--text2);margin-bottom:.75rem">' +
        T('Tienes ' + totalFence + ' m de malla y un muro que cubre un lado completo. Estira o encoge el lado y hasta que el área encerrada sea la mayor posible, y fija las medidas.',
          'You have ' + totalFence + ' m of fencing and a wall covering one whole side. Stretch or shrink side y until the enclosed area is as large as possible, then lock the measurements.') + '</div>' +
        '<div class="cvwrap"><canvas class="dcanvas" id="w3cv" style="cursor:default"></canvas></div>' +
        '<div class="cgrid" style="margin-top:.75rem"><div class="cg">' +
        '<label>' + T('Lado perpendicular al muro', 'Side perpendicular to the wall') + ': <span class="cval" id="w3yv"></span></label>' +
        '<input type="range" id="w3s" min="1" max="' + maxY + '" step="1" value="' + C.y + '" oninput="w3Move(this.value)">' +
        '</div></div>' +
        '<div class="metrics">' +
        '<div class="metric"><div class="mlbl">' + T('Lado x', 'Side x') + '</div><div class="mnum ts" id="w3x"></div></div>' +
        '<div class="metric"><div class="mlbl">' + T('Lado y', 'Side y') + '</div><div class="mnum ts" id="w3y"></div></div>' +
        '<div class="metric"><div class="mlbl">' + T('Área', 'Area') + '</div><div class="mnum cs" id="w3a"></div></div>' +
        '</div>' +
        '<button class="hintbtn" style="margin-top:.85rem;min-height:44px" onclick="w3Fix()">' +
        T('Fijar las medidas', 'Lock the measurements') + '</button>' +
        '<div id="w3fb" style="font-size:.85rem;margin-top:.45rem;color:var(--text2);min-height:1.3rem"></div>';
      update();
      setTimeout(draw, 140);
    }
    function update() {
      var x = totalFence - 2 * C.y;
      var e = document.getElementById('w3yv'); if (e) e.textContent = 'y = ' + C.y + ' m';
      e = document.getElementById('w3x'); if (e) e.textContent = x + ' m';
      e = document.getElementById('w3y'); if (e) e.textContent = C.y + ' m';
      e = document.getElementById('w3a'); if (e) e.textContent = (x * C.y) + ' m²';
      var sl = document.getElementById('w3s'); if (sl && sl.value !== String(C.y)) sl.value = C.y;
      draw();
    }
    function say(msg, good) {
      var fb = document.getElementById('w3fb');
      if (fb) fb.innerHTML = good ? '<span style="color:var(--ok);font-weight:600">' + msg + '</span>' : msg;
    }
    window.w3Move = function (val) { if (C.done) return; C.y = parseInt(val, 10); update(); };
    window.w3Fix = function () {
      if (C.done) return;
      if (C.y === opt) {
        C.done = true; update();
        say(T('Área máxima: ' + (opt * 2 * opt) + ' m². Con el muro cubriendo un lado, el reparto ganador da al lado paralelo el doble que al perpendicular.',
              'Maximum area: ' + (opt * 2 * opt) + ' m². With the wall covering one side, the winning split gives the parallel side twice the perpendicular one.'), true);
        return;
      }
      C.tries++;
      if (C.tries >= 3) {
        C.y = opt; C.done = true; update();

        return;
      }
      var grow = (C.y < opt);
      say(T('Área actual: ' + ((totalFence - 2 * C.y) * C.y) + ' m². Todavía puede crecer si haces el lado y ' + (grow ? 'más largo' : 'más corto') + '.',

    };

  }

  function buildCostBars() {
    var nb = [3, 4, 5, 6][Math.floor(rng() * 4)];

    wrap.className = 'gcrd section';
    wrap.id = 'w4';
    wrap.setAttribute('data-widget', 'costo');

    function render() {
      var bars = '', i;
      for (i = 1; i <= 10; i++) {
        var v = vals[i - 1];
        var hp = 26 + Math.round(96 * v / top);
        var isSel = (B.sel === i);
        var col = B.done && i === nb ? 'var(--ok)' : (isSel ? 'var(--gold)' : 'var(--green)');
        bars += '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:.2rem;cursor:pointer;min-height:44px" onclick="w4Pick(' + i + ')">' +
          '<div style="font-family:\'IBM Plex Mono\',monospace;font-size:.6rem;color:var(--text3)">' + (Math.round(v * 10) / 10) + '</div>' +
          '<div style="width:100%;height:' + hp + 'px;background:' + col + ';border-radius:4px 4px 0 0"></div>' +
          '<div style="font-size:.68rem;color:var(--text2)">' + i + '</div>' +
        '</div>';
      }
      wrap.innerHTML =
        '<div class="stag iw-tag">' + T('Tablero de costo promedio', 'Average cost board') + '</div>' +
        '<div class="iw-sub" style="font-size:.87rem;color:var(--text2);margin-bottom:.75rem">' +
        T('Cada barra es el costo promedio por unidad cuando se fabrican x lotes. Toca la barra donde ese costo toca su punto más bajo.',
          'Each bar is the average cost per unit when x batches are made. Tap the bar where that cost hits its lowest point.') + '</div>' +
        '<div style="display:flex;align-items:flex-end;gap:.25rem;padding:.5rem .2rem;background:var(--surface2);border-radius:8px">' + bars + '</div>' +
        '<div style="font-size:.7rem;color:var(--text3);text-align:center;margin-top:.3rem">' + T('lotes producidos', 'batches produced') + '</div>' +
        '<div id="w4fb" style="font-size:.85rem;margin-top:.5rem;color:var(--text2);min-height:1.3rem"></div>';
    }
    window.w4Pick = function (i) {
      if (B.done) return;
      B.sel = i;
      render();

        B.done = true; render();
        var f0 = document.getElementById('w4fb');
        if (f0) f0.innerHTML = '<span style="color:var(--ok);font-weight:600">' +
          T('Ese es el fondo del tablero: con ' + nb + ' lotes cada unidad sale a ' + (2 * nb + fx0) + ' en promedio.',
            'That is the floor of the board: with ' + nb + ' batches each unit averages ' + (2 * nb + fx0) + '.') + '</span>';
        return;
      }
      B.tries++;
      if (B.tries >= 3) {
        B.sel = nb; B.done = true; render();
        var f1 = document.getElementById('w4fb');
        if (f1) f1.innerHTML = T('El punto más bajo está en ' + nb + ' lotes. A la izquierda el costo fijo se reparte entre muy pocas unidades, y a la derecha la producción se encarece.',

      if (fb) fb.textContent = (i < nb)
        ? T('Esa barra todavía es alta. Hacia la derecha el promedio sigue bajando.', 'That bar is still tall. To the right the average keeps falling.')

    render();

    options: [mx4 + T(' mil pesos', ' thousand pesos'), (a4 * k4 * k4 + c4) + T(' mil pesos', ' thousand pesos'), (2 * a4 * k4 * k4 - c4) + T(' mil pesos', ' thousand pesos'), k4 + T(' mil pesos', ' thousand pesos')],
    hint: T('El valor crítico dice dónde ocurre el máximo. Para saber cuánto vale hay que sustituirlo en la función objetivo.',
            'The critical value says where the maximum happens. To know how large it is you must substitute it into the objective function.'),
    exp: T('El valor crítico x = ' + k4 + ' indica la cantidad de lotes, no la utilidad. Al sustituirlo en U se obtiene ' + mx4 + ' mil pesos.',
           'The critical value x = ' + k4 + ' gives the number of batches, not the profit. Substituting it into U yields ' + mx4 + ' thousand pesos.'),
    showWork: true
  });

  /* ============ concept 3 ============ */
  addSection(
    'Concepto 3 · Del enunciado al modelo', 'Concept 3 · From the statement to the model',
    'Función objetivo, condición y dominio',
    'Objective function, condition and domain',
    '<p>Modelar es traducir. Primero se nombra la cantidad que se quiere optimizar y se escribe como <b>función objetivo</b>. Casi siempre aparece con dos variables, y entonces entra la <b>condición del enunciado</b>: la relación fija que las liga, sea un perímetro disponible, un volumen exigido o un presupuesto cerrado. Esa condición permite despejar una variable y dejar la función objetivo en términos de una sola.</p>' +
    '<p>Falta un paso que se olvida con frecuencia: fijar el <b>dominio</b>. Ninguna medida real puede ser negativa, y a veces el problema recorta todavía más el intervalo. Cuando el dominio es un intervalo cerrado, el valor óptimo puede caer en un valor crítico o directamente en uno de los extremos, así que conviene comparar los dos.</p>',
    '<p>Modeling is translating. First you name the quantity to be optimized and write it as the <b>objective function</b>. It almost always shows up with two variables, and that is when the <b>condition from the statement</b> steps in: the fixed relation that ties them together, whether an available perimeter, a required volume or a closed budget. That condition lets you solve for one variable and leave the objective function in terms of a single one.</p>' +
    '<p>One step is often forgotten: fixing the <b>domain</b>. No real measurement can be negative, and sometimes the problem trims the interval even further. When the domain is a closed interval, the optimal value may land at a critical value or straight at one of the endpoints, so it pays to compare both.</p>'
  );
  buildCorral(P5);

  addProblem(vr[4] === 0 ? {
    title: T('El corral más amplio', 'The widest pen'),
    q: T('Se dispone de ' + P5 + ' m de malla para cercar un terreno rectangular. Uno de los lados se apoya en un muro y no lleva malla. ¿Cuál es la mayor área que puede cercarse?',
         'There are ' + P5 + ' m of fencing available to enclose a rectangular plot. One of the sides rests against a wall and needs no fencing. What is the largest area that can be enclosed?'),
    options: [(2 * L5 * L5) + ' m²', (L5 * L5 + L5 * L5 / 2) + ' m²', (L5 * L5) + ' m²', (4 * L5 * L5) + ' m²'],
    hint: T('Llama y al lado perpendicular al muro. El lado paralelo mide entonces ' + P5 + ' − 2y. Escribe el área en términos de y y deriva.',
            'Call y the side perpendicular to the wall. The parallel side then measures ' + P5 + ' − 2y. Write the area in terms of y and differentiate.'),
    exp: T('A(y) = y(' + P5 + ' − 2y). Su derivada A′(y) = ' + P5 + ' − 4y se anula en y = ' + L5 + ', el lado paralelo mide ' + (2 * L5) + ' m y el área máxima es ' + (2 * L5 * L5) + ' m².',
           'A(y) = y(' + P5 + ' − 2y). Its derivative A′(y) = ' + P5 + ' − 4y vanishes at y = ' + L5 + ', the parallel side measures ' + (2 * L5) + ' m and the maximum area is ' + (2 * L5 * L5) + ' m².'),
    showWork: true
  } : {
    title: T('El producto más grande', 'The largest product'),
    q: T('Dos números positivos suman ' + (2 * s5) + '. ¿Cuál es el mayor producto que pueden formar?',
         'Two positive numbers add up to ' + (2 * s5) + '. What is the largest product they can form?'),
    options: [String(s5 * s5), String(2 * s5 * s5), String(s5), String(4 * s5 * s5)],
    hint: T('Llama x a uno de los números y escribe el otro con la condición del enunciado. Después deriva el producto.',
            'Call one of the numbers x and write the other using the condition from the statement. Then differentiate the product.'),
    exp: T('Si un número es x, el otro es ' + (2 * s5) + ' − x y el producto es P(x) = x(' + (2 * s5) + ' − x). Su derivada P′(x) = ' + (2 * s5) + ' − 2x se anula en x = ' + s5 + ', así que el producto máximo es ' + s5 + ' por ' + s5 + ' = ' + (s5 * s5) + '.',
           'If one number is x, the other is ' + (2 * s5) + ' − x and the product is P(x) = x(' + (2 * s5) + ' − x). Its derivative P′(x) = ' + (2 * s5) + ' − 2x vanishes at x = ' + s5 + ', so the largest product is ' + s5 + ' times ' + s5 + ' = ' + (s5 * s5) + '.'),
    showWork: true
  });

  addProblem(vr[5] === 0 ? {
    title: T('El recorte que conviene', 'The cut that pays off'),
    q: T('De una lámina cuadrada de ' + s6 + ' cm de lado se recortan cuadrados iguales en las cuatro esquinas y se doblan las pestañas para formar una caja sin tapa. ¿Qué medida debe tener el lado del recorte para que el volumen sea máximo?',
         'From a square sheet ' + s6 + ' cm on each side, equal squares are cut from the four corners and the flaps are folded up to form an open box. What length must the cut side have for the volume to be a maximum?'),
    options: [(s6 / 6) + ' cm', (s6 / 4) + ' cm', (s6 / 3) + ' cm', (s6 / 2) + ' cm'],
    hint: T('Si el recorte mide x, la base queda de ' + s6 + ' − 2x por lado y la altura es x. Escribe el volumen como producto y deriva.',
            'If the cut measures x, the base is ' + s6 + ' − 2x on each side and the height is x. Write the volume as a product and differentiate.'),
    exp: T('V(x) = x(' + s6 + ' − 2x)². Su derivada se factoriza como (' + s6 + ' − 2x)(' + s6 + ' − 6x) y la única solución con sentido físico es x = ' + (s6 / 6) + ' cm.',
           'V(x) = x(' + s6 + ' − 2x)². Its derivative factors as (' + s6 + ' − 2x)(' + s6 + ' − 6x) and the only physically meaningful solution is x = ' + (s6 / 6) + ' cm.'),
    showWork: true
  } : {
    title: T('La caja más grande', 'The largest box'),
    q: T('De una lámina cuadrada de ' + s6 + ' cm de lado se recortan cuadrados iguales en las esquinas para armar una caja sin tapa. ¿Cuál es el volumen máximo que puede alcanzar la caja?',
         'From a square sheet ' + s6 + ' cm on each side, equal squares are cut from the corners to build an open box. What is the largest volume the box can reach?'),
    options: [(2 * s6 * s6 * s6 / 27) + ' cm³', (s6 * s6 * s6 / 16) + ' cm³', (25 * s6 * s6 * s6 / 216) + ' cm³', (s6 * s6 * s6 / 24) + ' cm³'],
    hint: T('Escribe el volumen en términos del recorte x, localiza el valor crítico válido y sustitúyelo en el volumen.',
            'Write the volume in terms of the cut x, locate the valid critical value and substitute it back into the volume.'),
    exp: T('El recorte óptimo mide ' + (s6 / 6) + ' cm, la base queda de ' + (s6 - s6 / 3) + ' cm por lado y el volumen resulta ' + (2 * s6 * s6 * s6 / 27) + ' cm³.',
           'The optimal cut measures ' + (s6 / 6) + ' cm, the base is ' + (s6 - s6 / 3) + ' cm on each side and the volume comes out as ' + (2 * s6 * s6 * s6 / 27) + ' cm³.'),
    showWork: true
  });

  /* ============ concept 4 ============ */
  addSection(
    'Concepto 4 · Costo promedio', 'Concept 4 · Average cost',
    'Cuánto cuesta cada unidad, no cuánto cuesta todo',
    'What each unit costs, not what everything costs',
    '<p>Para decidir si conviene crecer, una empresa no mira el costo total sino el <b>costo promedio por unidad</b>: el costo total repartido entre las unidades producidas, es decir Cm(x) = ' + frac('C(x)', 'x') + '.</p>' +
    '<p>Ese promedio casi siempre baja al principio, porque el costo fijo se reparte entre más unidades, y vuelve a subir cuando la producción se satura. El punto donde deja de bajar es un mínimo, y se localiza con el mismo procedimiento de siempre: derivar el promedio y buscar dónde se anula.</p>',
    '<p>To decide whether growing pays off, a company does not look at total cost but at the <b>average cost per unit</b>: the total cost shared among the units produced, that is Cm(x) = ' + frac('C(x)', 'x') + '.</p>' +
    '<p>That average almost always falls at first, because the fixed cost is spread over more units, and rises again once production saturates. The point where it stops falling is a minimum, and it is located with the usual procedure: differentiate the average and find where it vanishes.</p>'
  );
  buildCostBars();

  addProblem(vr[6] === 0 ? {
    title: T('Producción de costo promedio mínimo', 'Production at minimum average cost'),
    q: T('El costo total de producir x lotes es C(x) = 4x² + ' + b7 + 'x + ' + (4 * n7 * n7) + ', medido en miles de pesos. ¿Cuántos lotes hacen mínimo el costo promedio por lote?',
         'The total cost of producing x batches is C(x) = 4x² + ' + b7 + 'x + ' + (4 * n7 * n7) + ', measured in thousands of pesos. How many batches make the average cost per batch a minimum?'),
    options: [n7 + T(' lotes', ' batches'), (2 * n7) + T(' lotes', ' batches'), (n7 * n7) + T(' lotes', ' batches'), (4 * n7) + T(' lotes', ' batches')],
    hint: T('Divide el costo total entre x para obtener el costo promedio, simplifica cada término y deriva la expresión resultante.',
            'Divide the total cost by x to obtain the average cost, simplify each term and differentiate the resulting expression.'),
    exp: T('Cm(x) = 4x + ' + b7 + ' + ' + (4 * n7 * n7) + '/x. Su derivada 4 − ' + (4 * n7 * n7) + '/x² se anula cuando x² = ' + (n7 * n7) + ', es decir con ' + n7 + ' lotes.',
           'Cm(x) = 4x + ' + b7 + ' + ' + (4 * n7 * n7) + '/x. Its derivative 4 − ' + (4 * n7 * n7) + '/x² vanishes when x² = ' + (n7 * n7) + ', that is with ' + n7 + ' batches.'),
    showWork: true
  } : {
    title: T('El costo promedio más bajo', 'The lowest average cost'),
    q: T('El costo total de producir x lotes es C(x) = 4x² + ' + b7 + 'x + ' + (4 * n7 * n7) + ', medido en miles de pesos. ¿Cuál es el costo promedio por lote más bajo que puede alcanzarse?',
         'The total cost of producing x batches is C(x) = 4x² + ' + b7 + 'x + ' + (4 * n7 * n7) + ', measured in thousands of pesos. What is the lowest average cost per batch that can be reached?'),
    options: [(8 * n7 + b7) + T(' mil pesos', ' thousand pesos'), (4 * n7 + b7) + T(' mil pesos', ' thousand pesos'), (8 * n7) + T(' mil pesos', ' thousand pesos'), (4 * n7 * n7 + b7) + T(' mil pesos', ' thousand pesos')],
    hint: T('Obtén el costo promedio, localiza el valor de x que lo minimiza y sustituye ese valor en el promedio.',
            'Obtain the average cost, locate the value of x that minimizes it and substitute that value back into the average.'),
    exp: T('Cm(x) = 4x + ' + b7 + ' + ' + (4 * n7 * n7) + '/x se minimiza con ' + n7 + ' lotes, y al sustituir se obtiene ' + (8 * n7 + b7) + ' mil pesos por lote.',
           'Cm(x) = 4x + ' + b7 + ' + ' + (4 * n7 * n7) + '/x is minimized with ' + n7 + ' batches, and substituting gives ' + (8 * n7 + b7) + ' thousand pesos per batch.'),
    showWork: true
  });

  /* ============ concept 5 ============ */
  addSection(
    'Concepto 5 · Ingreso y demanda', 'Concept 5 · Revenue and demand',
    'El precio que más dinero deja',
    'The price that brings in the most money',
    '<p>En un modelo de mercado el precio y la cantidad vendida jalan en sentidos contrarios: al subir el precio, la demanda cae. Si la demanda se describe con una función q(p), el <b>ingreso</b> es el producto R(p) = p q(p), y ese producto es la función objetivo.</p>' +
    '<p>Un precio demasiado bajo vende mucho pero deja poco por unidad; uno demasiado alto casi no vende. Entre esos dos extremos hay un precio donde el ingreso alcanza su cima, y la derivada lo localiza sin necesidad de probar precio por precio.</p>',
    '<p>In a market model, price and quantity sold pull in opposite directions: as the price rises, demand falls. If demand is described by a function q(p), the <b>revenue</b> is the product R(p) = p q(p), and that product is the objective function.</p>' +
    '<p>A price that is too low sells a lot but leaves little per unit; one that is too high barely sells. Between those two extremes there is a price where revenue peaks, and the derivative locates it without testing price after price.</p>'
  );
  buildModelDesk();

  addProblem(vr[7] === 0 ? {
    title: T('El precio que maximiza el ingreso', 'The price that maximizes revenue'),
    q: T('Un taller estima que si el precio de un servicio es p pesos, la cantidad de servicios vendidos al mes es q = ' + M8 + ' − ' + N8 + 'p. ¿Qué precio hace máximo el ingreso mensual?',
         'A workshop estimates that if the price of a service is p pesos, the number of services sold per month is q = ' + M8 + ' − ' + N8 + 'p. What price makes the monthly revenue a maximum?'),
    options: [k8 + ' pesos', (2 * k8) + ' pesos', (N8 * k8) + ' pesos', (N8 * k8 / 2) + ' pesos'],
    hint: T('El ingreso es el producto del precio por la cantidad vendida. Escríbelo como función de p, desarrolla el producto y deriva.',
            'Revenue is price times quantity sold. Write it as a function of p, expand the product and differentiate.'),
    exp: T('R(p) = p(' + M8 + ' − ' + N8 + 'p) = ' + M8 + 'p − ' + N8 + 'p². Su derivada ' + M8 + ' − ' + (2 * N8) + 'p se anula en p = ' + k8 + ' pesos.',
           'R(p) = p(' + M8 + ' − ' + N8 + 'p) = ' + M8 + 'p − ' + N8 + 'p². Its derivative ' + M8 + ' − ' + (2 * N8) + 'p vanishes at p = ' + k8 + ' pesos.'),
    showWork: true
  } : {
    title: T('El ingreso mensual máximo', 'The maximum monthly revenue'),
    q: T('Un taller estima que si el precio de un servicio es p pesos, la cantidad de servicios vendidos al mes es q = ' + M8 + ' − ' + N8 + 'p. ¿Cuál es el ingreso mensual máximo que puede alcanzar?',
         'A workshop estimates that if the price of a service is p pesos, the number of services sold per month is q = ' + M8 + ' − ' + N8 + 'p. What is the largest monthly revenue it can reach?'),
    options: [(N8 * k8 * k8) + ' pesos', (2 * N8 * k8 * k8) + ' pesos', (N8 * k8 * k8 / 2) + ' pesos', (k8 * k8) + ' pesos'],
    hint: T('Escribe el ingreso como función del precio, localiza el precio que lo maximiza y sustitúyelo en el ingreso.',
            'Write revenue as a function of price, locate the price that maximizes it and substitute it back into revenue.'),
    exp: T('R(p) = ' + M8 + 'p − ' + N8 + 'p² alcanza su cima en p = ' + k8 + ' pesos, donde se venden ' + (N8 * k8) + ' servicios, de modo que el ingreso es ' + (N8 * k8 * k8) + ' pesos.',
           'R(p) = ' + M8 + 'p − ' + N8 + 'p² peaks at p = ' + k8 + ' pesos, where ' + (N8 * k8) + ' services are sold, so the revenue is ' + (N8 * k8 * k8) + ' pesos.'),
    showWork: true
  });

  /* ============ closing block ============ */
  addSection(
    'Cierre', 'Wrap-up',
    'Dos situaciones de principio a fin',
    'Two situations from start to finish',
    '<p>Las dos siguientes se resuelven completas: leer la situación, armar el modelo y decidir dónde vive el óptimo.</p>',
    '<p>The next two are solved end to end: read the situation, build the model and decide where the optimum lives.</p>'
  );

  addProblem(vr[8] === 0 ? {
    title: T('Vuelo con permiso limitado', 'Flight with a limited permit'),
    q: T('Un dron de reparto sube siguiendo el modelo h(t) = −2t² + ' + (4 * a9) + 't, con h en metros y t en minutos. El permiso de vuelo autoriza únicamente los primeros ' + t9 + ' minutos. ¿En qué instante del intervalo autorizado la altura es máxima?',
         'A delivery drone climbs according to the model h(t) = −2t² + ' + (4 * a9) + 't, with h in metres and t in minutes. The flight permit authorizes only the first ' + t9 + ' minutes. At what instant of the authorized interval is the height a maximum?'),
    options: ['t = ' + t9 + ' min', 't = ' + a9 + ' min', 't = 0 min', 't = ' + (2 * a9) + ' min'],
    hint: T('Localiza el valor crítico y compáralo con el intervalo permitido. Si queda fuera, revisa los extremos del intervalo.',
            'Locate the critical value and compare it with the allowed interval. If it falls outside, check the endpoints of the interval.'),
    exp: T('h′(t) = −4t + ' + (4 * a9) + ' se anula en t = ' + a9 + ', fuera del intervalo autorizado. Dentro de ese intervalo la altura solo crece, así que el máximo ocurre en el extremo t = ' + t9 + ' min.',
           'h′(t) = −4t + ' + (4 * a9) + ' vanishes at t = ' + a9 + ', outside the authorized interval. Inside that interval the height only rises, so the maximum happens at the endpoint t = ' + t9 + ' min.'),
    showWork: true
  } : {
    title: T('Altura máxima autorizada', 'Maximum authorized height'),
    q: T('Un dron de reparto sube siguiendo el modelo h(t) = −2t² + ' + (4 * a9) + 't, con h en metros y t en minutos. El permiso de vuelo autoriza únicamente los primeros ' + t9 + ' minutos. ¿Cuál es la altura máxima que alcanza dentro del intervalo autorizado?',
         'A delivery drone climbs according to the model h(t) = −2t² + ' + (4 * a9) + 't, with h in metres and t in minutes. The flight permit authorizes only the first ' + t9 + ' minutes. What is the greatest height it reaches within the authorized interval?'),
    options: [(4 * a9 * t9 - 2 * t9 * t9) + ' m', (2 * a9 * a9) + ' m', (4 * a9 * t9 + 2 * t9 * t9) + ' m', '0 m'],
    hint: T('Revisa si el valor crítico cae dentro del intervalo. Si no cae, evalúa la altura en los extremos del intervalo y compara.',
            'Check whether the critical value falls inside the interval. If it does not, evaluate the height at the endpoints and compare.'),
    exp: T('h′(t) = −4t + ' + (4 * a9) + ' se anula en t = ' + a9 + ', fuera del intervalo. Como la altura solo crece ahí, el máximo está en t = ' + t9 + ', donde h vale ' + (4 * a9 * t9 - 2 * t9 * t9) + ' m.',
           'h′(t) = −4t + ' + (4 * a9) + ' vanishes at t = ' + a9 + ', outside the interval. Since the height only rises there, the maximum sits at t = ' + t9 + ', where h equals ' + (4 * a9 * t9 - 2 * t9 * t9) + ' m.'),
    showWork: true
  });

  addProblem(vr[9] === 0 ? {
    title: T('El papel de la condición', 'The role of the condition'),
    q: T('En un problema de modelación aparecen dos variables ligadas por una condición del enunciado. ¿Para qué sirve esa condición?',
         'In a modeling problem two variables appear tied together by a condition from the statement. What is that condition for?'),
    options: [
      T('Para expresar la función objetivo en términos de una sola variable', 'To express the objective function in terms of a single variable'),
      T('Para fijar el valor máximo que puede alcanzar la función objetivo', 'To fix the maximum value the objective function can reach'),
      T('Para asegurar que la derivada de la función objetivo sea positiva', 'To guarantee that the derivative of the objective function is positive'),
      T('Para sustituir la derivada por la razón de cambio promedio', 'To replace the derivative with the average rate of change')
    ],
    hint: T('Piensa en qué obstáculo impide derivar una expresión que todavía tiene dos variables.',
            'Think about what obstacle prevents differentiating an expression that still carries two variables.'),
    exp: T('La condición liga las variables y permite despejar una de ellas. Al sustituirla, la función objetivo queda con una sola variable y ya puede derivarse.',
           'The condition ties the variables together and lets you solve for one of them. After substituting, the objective function is left with a single variable and can finally be differentiated.'),
    showWork: false
  } : {
    title: T('Máximo absoluto en un intervalo cerrado', 'Absolute maximum on a closed interval'),
    q: T('Un modelo derivable se estudia sobre un intervalo cerrado. Además de los valores críticos, ¿qué debe revisarse para hallar el máximo absoluto?',
         'A differentiable model is studied over a closed interval. Besides the critical values, what must be checked to find the absolute maximum?'),
    options: [
      T('El valor del modelo en los extremos del intervalo', 'The value of the model at the endpoints of the interval'),
      T('Los puntos donde la segunda derivada vale cero', 'The points where the second derivative equals zero'),
      T('Los valores donde el modelo se anula', 'The values where the model equals zero'),
      T('Los puntos donde la pendiente alcanza su valor más alto', 'The points where the slope reaches its highest value')
    ],
    hint: T('Un modelo puede seguir creciendo hasta el último instante permitido sin que la derivada llegue a anularse.',
            'A model can keep growing until the very last allowed instant without the derivative ever vanishing.'),
    exp: T('En un intervalo cerrado el máximo absoluto puede caer en un valor crítico o directamente en un extremo, así que se evalúa el modelo en ambos y se compara.',
           'On a closed interval the absolute maximum may land at a critical value or straight at an endpoint, so the model is evaluated at both and compared.'),
    showWork: false
  });
}

  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});

})();
