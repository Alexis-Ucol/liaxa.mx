    elK.textContent = L({ es:'Comprobar la ficha', en:'Check the record' });
    elK.className = 'gw-btn';
    say(host, '', L({ es:'Otra planta del herbario. Completa su ficha.', en:'Another plant from the herbarium. Complete its record.' }));
    draw();
  }
  function close(cls, msg){
    locked = true;
    elK.textContent = rd === 2 ? L({ es:'Terminar', en:'Finish' }) : L({ es:'Siguiente planta', en:'Next plant' });
    elK.className = 'gw-btn solved';
    draw();
    say(host, cls, msg);
  }
  function check(){
    if (done) return;
    if (locked){ advance(); return; }
    if (firstWrong() === -1){
      close('good', L({
        es:'Ficha correcta. Con estos tres datos, el conocimiento se puede transmitir sin que se deforme en el camino.',
        en:'Correct record. With these three pieces of data the knowledge can be passed on without getting distorted along the way.'
      }));
      return;
    }
    tries++;
    if (tries >= 3){
      cur = R[rd].a.slice();
      close('warm', L({ es:'Esta es la ficha correcta de la planta.', en:'This is the correct record for the plant.' }));
      return;
    }
    var w = firstWrong();
    say(host, 'miss', L({
      es:'Revisa el renglón ' + String.fromCharCode(8220) + L(ROWS[w].t) + String.fromCharCode(8221) + ': ' + L(R[rd].h[w]) + '.',
      en:'Check the row ' + String.fromCharCode(8220) + L(ROWS[w].t) + String.fromCharCode(8221) + ': ' + L(R[rd].h[w]) + '.'
    }));
    draw();
  }

  elR.addEventListener('click', function(ev){
    var b = ev.target.closest('[data-row]');
    if (!b || locked || done) return;
    var i = parseInt(b.getAttribute('data-row'), 10);
    cur[i] = (cur[i] + 1) % ROWS[i].o.length;
    draw();
  });
  elK.addEventListener('click', check);
  seed();
  say(host, '', L({ es:'Arma la ficha renglón por renglón y comprueba.', en:'Build the record row by row and check.' }));
  draw();
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 5 :: El bosque de la comunidad
   ══════════════════════════════════════════════════════════════════════════ */
function w5(rng, host){
  var R = shuffle([10, 15, 20, 25, 30], rng).slice(0, 3);
  var rd = 0, tries = 0, locked = false, done = false, cut = 0;

  function sim(c){
    var st = 100, out = [100];
    for (var y = 0; y < 5; y++){
      st = st + R[rd] - c;
      if (st > 100) st = 100;
      if (st < 0) st = 0;
      out.push(st);
    }
    return out;
  }

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'El bosque de la comunidad', en:'The forest of the community' }) + '</div>' +
    '<div class="gw-q" data-r="q"></div>' +
    '<div class="gw-mini">' + L({ es:'Mueve la barra y observa cómo queda el bosque después de cinco años.', en:'Move the bar and watch how the forest looks after five years.' }) + '</div>' +
    '<div class="forest" data-r="for"></div>' +
    '<div class="gw-num" data-r="num"></div>' +
    '<input class="gw-range" type="range" min="0" max="40" step="1" data-r="sl">' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Fijar la regla', en:'Set the rule' }) + '</button></div>' +
    '<div class="gw-fb"></div>';

  var elQ = host.querySelector('[data-r="q"]'),
      elF = host.querySelector('[data-r="for"]'),
      elN = host.querySelector('[data-r="num"]'),
      elS = host.querySelector('[data-r="sl"]'),
      elK = host.querySelector('[data-r="chk"]');

  function draw(){
    elQ.innerHTML = L({
      es:'Este bosque repone ' + R[rd] + ' árboles cada año. ¿Cuántos puede aprovechar la comunidad al año sin adelgazarlo?',
      en:'This forest replaces ' + R[rd] + ' trees every year. How many can the community harvest per year without thinning it out?'
    });
    elS.value = cut;
    elN.textContent = cut + ' ' + L({ es:'árboles al año', en:'trees per year' });
    var s = sim(cut);
    elF.innerHTML = s.map(function(v, y){
      return '<div class="forest-y"><div class="forest-b' + (v < 60 ? ' low' : '') + '" style="height:' + Math.max(2, v) + '%"></div>' +
             '<div class="forest-l">' + (y === 0 ? L({ es:'hoy', en:'now' }) : ('a' + y)) + '</div></div>';
    }).join('');
  }
  function advance(){
    rd++;
    if (rd >= 3){
      done = true; elS.disabled = true;
      elK.textContent = L({ es:'Completado', en:'Completed' });
      elK.className = 'gw-btn solved';
      say(host, 'good', L({
        es:'La regla es siempre la misma, cambie el bosque que cambie: se aprovecha hasta lo que el bosque logra reponer. Esa cuenta es la que sostiene el manejo comunitario desde hace generaciones.',
        en:'The rule is always the same, whatever the forest: you harvest up to what the forest manages to replace. That is the calculation that has held community management together for generations.'
      }));
      return;
    }
    locked = false; tries = 0; cut = ri(rng, 0, 40);
    elK.textContent = L({ es:'Fijar la regla', en:'Set the rule' });
    elK.className = 'gw-btn';
    say(host, '', L({ es:'Otro bosque, con otro ritmo de crecimiento. Vuelve a fijar la regla.', en:'Another forest, with another growth rate. Set the rule again.' }));
    draw();
  }
  function close(cls, msg){
    locked = true;
    elK.textContent = rd === 2 ? L({ es:'Terminar', en:'Finish' }) : L({ es:'Siguiente bosque', en:'Next forest' });
    elK.className = 'gw-btn solved';
    draw();
    say(host, cls, msg);
  }
  function check(){
    if (done) return;
    if (locked){ advance(); return; }
    var d = cut - R[rd];
    if (d === 0){
      close('good', L({
        es:'Justo en el punto: se saca lo mismo que el bosque repone, así que dentro de cinco años sigue igual de completo y la comunidad sigue teniendo madera.',
        en:'Right on the point: as much is taken as the forest replaces, so in five years it is just as full and the community still has timber.'
      }));
      return;
    }
    tries++;
    if (tries >= 3){
      cut = R[rd];
      close('warm', L({
        es:'Este es el aprovechamiento que el bosque aguanta: el mismo número de árboles que logra reponer cada año.',
        en:'This is the harvest the forest can take: the same number of trees it manages to replace each year.'
      }));
      return;
    }
    var s = sim(cut), fin = Math.round(s[5]);
    if (d > 0){
      say(host, 'miss', L({
        es:'Se está sacando más de lo que crece: en cinco años el bosque baja a ' + fin + ' de cada 100. Mueve la barra hacia la izquierda.',
        en:'More is being taken than grows: in five years the forest drops to ' + fin + ' out of every 100. Move the bar to the left.'
      }));
    } else {
      say(host, 'miss', L({
        es:'El bosque no sufre, pero se está dejando sin aprovechar madera que sí se repone y la comunidad se queda sin ese ingreso. Mueve la barra hacia la derecha.',
        en:'The forest is not suffering, but timber that does grow back is being left unused and the community loses that income. Move the bar to the right.'
      }));
    }
    draw();
  }

  elS.addEventListener('input', function(){
    if (done || locked){ elS.value = cut; return; }
    cut = parseInt(elS.value, 10);
    draw();
  });
  elK.addEventListener('click', check);
  cut = ri(rng, 0, 40);
  say(host, '', L({ es:'Ajusta el aprovechamiento y fija la regla cuando el bosque se mantenga.', en:'Adjust the harvest and set the rule when the forest holds up.' }));
  draw();
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 6 :: La red y la temporada
   ══════════════════════════════════════════════════════════════════════════ */
function w6(rng, host){
  var MALLAS = [
    { t:{ es:'Malla cerrada', en:'Tight mesh' }, s:{ es:'atrapa hasta los peces más chicos', en:'catches even the smallest fish' }, g:0.78 },
    { t:{ es:'Malla mediana', en:'Medium mesh' }, s:{ es:'deja pasar solo a los más pequeños', en:'lets only the smallest ones through' }, g:0.95 },
    { t:{ es:'Malla amplia', en:'Wide mesh' }, s:{ es:'los peces jóvenes escapan y llegan a reproducirse', en:'young fish escape and get to reproduce' }, g:1.08 }
  ];
  var malla = ri(rng, 0, 1), veda = false, tries = 0, done = false;

  function sim(){
    var p = 100, out = [100];
    var f = MALLAS[malla].g * (veda ? 1.28 : 1.02);
    for (var s = 0; s < 4; s++){
      p = p * f;
      if (p > 150) p = 150;
      if (p < 4) p = 4;
      out.push(p);
    }
    return out;
  }

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'La red y la temporada', en:'The net and the season' }) + '</div>' +
    '<div class="gw-q">' + L({ es:'Deja la laguna en condiciones de seguir dando pesca temporada tras temporada', en:'Leave the lagoon able to keep giving a catch season after season' }) + '</div>' +
    '<div class="gw-mini">' + L({ es:'Cambia la red y decide qué hacer en los meses en que los peces se reproducen. Las barras responden al instante.', en:'Change the net and decide what to do in the months when the fish reproduce. The bars respond right away.' }) + '</div>' +
    '<div class="gw-lbl">' + L({ es:'Red que se usa', en:'Net in use' }) + '</div>' +
    '<div class="gw-grid" data-r="mallas"></div>' +
    '<div class="gw-lbl">' + L({ es:'Meses de reproducción', en:'Breeding months' }) + '</div>' +
    '<div class="gw-grid" data-r="veda"></div>' +
    '<div class="pond" data-r="pond"></div>' +
    '<div class="gw-num" data-r="num"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Comprobar el acuerdo', en:'Check the agreement' }) + '</button></div>' +
    '<div class="gw-fb"></div>';

  var elM = host.querySelector('[data-r="mallas"]'),
      elV = host.querySelector('[data-r="veda"]'),
      elP = host.querySelector('[data-r="pond"]'),
      elN = host.querySelector('[data-r="num"]'),
      elK = host.querySelector('[data-r="chk"]');

  function draw(){
    elM.innerHTML = MALLAS.map(function(m, i){
      return '<button class="gw-tile' + (malla === i ? ' on' : '') + '" data-m="' + i + '"' + (done ? ' disabled' : '') +
             '><span class="gw-key">' + L(m.t) + '</span><span class="gw-sub">' + L(m.s) + '</span></button>';
    }).join('');
    elV.innerHTML = [true, false].map(function(v){
      return '<button class="gw-tile' + (veda === v ? ' on' : '') + '" data-v="' + (v ? 1 : 0) + '"' + (done ? ' disabled' : '') +
             '><span class="gw-key">' + L(v ? { es:'Se suspende la pesca', en:'Fishing is suspended' } : { es:'Se pesca igual', en:'Fishing goes on' }) +
             '</span><span class="gw-sub">' + L(v ? { es:'la laguna descansa esos meses', en:'the lagoon rests those months' } : { es:'se captura también a los que van a desovar', en:'the ones about to spawn are caught too' }) + '</span></button>';
    }).join('');
    var s = sim();
    elP.innerHTML = s.map(function(v, y){
      return '<div class="pond-y"><div class="pond-b' + (v < 80 ? ' low' : '') + '" style="height:' + Math.max(3, Math.min(100, v / 1.5)) + '%"></div>' +
             '<div class="pond-l">' + (y === 0 ? L({ es:'hoy', en:'now' }) : ('t' + y)) + '</div></div>';
    }).join('');
    var fin = Math.round(s[4]);
    elN.textContent = L({ es:'Población tras cuatro temporadas: ', en:'Population after four seasons: ' }) + fin + ' / 100';
  }
  function finish(cls, msg){
    done = true;
    elK.textContent = L({ es:'Completado', en:'Completed' });
    elK.className = 'gw-btn solved';
    draw();
    say(host, cls, msg);
  }
  function check(){
    if (done) return;
    if (malla === 2 && veda){
      finish('good', L({
        es:'Ese es el acuerdo que sostiene la pesca: la red deja escapar a los jóvenes para que alcancen a reproducirse y la captura se detiene mientras desovan. La población sube y la comunidad sigue pescando el año que viene.',
        en:'That is the agreement that sustains fishing: the net lets the young ones escape so they can reproduce and the catch stops while they spawn. The population rises and the community keeps fishing next year.'
      }));
      return;
    }
    tries++;
    if (tries >= 3){
      malla = 2; veda = true;
      finish('warm', L({
        es:'Este es el acuerdo que usan las comunidades pesqueras: malla amplia y alto a la captura en los meses de reproducción.',
        en:'This is the agreement fishing communities use: a wide mesh and a stop to the catch in the breeding months.'
      }));
      return;
    }
    if (!veda && malla !== 2){
      say(host, 'miss', L({
        es:'Con esa red se llevan a los peces antes de que crezcan, y encima se pesca justo cuando iban a desovar. Cambia las dos cosas y vuelve a comprobar.',
        en:'That net takes the fish before they grow, and on top of that fishing happens right when they were going to spawn. Change both and check again.'
      }));
    } else if (!veda){
      say(host, 'miss', L({
        es:'La red ya deja escapar a los jóvenes, pero se sigue pescando en los meses en que los peces se reproducen. Ahí está la fuga.',
        en:'The net already lets the young ones escape, but fishing continues in the months when the fish reproduce. That is where the loss is.'
      }));
    } else {
      say(host, 'miss', L({
        es:'Respetar los meses de reproducción ayuda, pero esa red todavía atrapa peces que no han llegado a reproducirse ni una vez. Prueba con una malla más amplia.',
        en:'Respecting the breeding months helps, but that net still catches fish that have not reproduced even once. Try a wider mesh.'
      }));
    }
    draw();
  }

  elM.addEventListener('click', function(ev){
    var b = ev.target.closest('[data-m]');
    if (!b || done) return;
    malla = parseInt(b.getAttribute('data-m'), 10);
    draw();
    say(host, '', L({ es:'Red cambiada. Mira la altura de las barras.', en:'Net changed. Look at the height of the bars.' }));
  });
  elV.addEventListener('click', function(ev){
    var b = ev.target.closest('[data-v]');
    if (!b || done) return;
    veda = b.getAttribute('data-v') === '1';
    draw();
    say(host, '', L({ es:'Decisión tomada para los meses de reproducción.', en:'Decision made for the breeding months.' }));
  });
  elK.addEventListener('click', check);
  say(host, '', L({ es:'Prueba combinaciones hasta que la laguna crezca y comprueba.', en:'Try combinations until the lagoon grows and check.' }));
  draw();
}

                 'Because otherwise the research would take longer to get its results published',
                 'Because the plants of the territory can only be studied during certain months of the year'] }, ci:0,
      hint:{ es:'Pregúntate de quién es el conocimiento y qué pasa con él si se usa sin contar con quien lo creó.',
             en:'Ask yourself whose knowledge it is and what happens to it if it is used without involving those who created it.' },
      exp:{ es:'El saber pertenece a la comunidad que lo construyó durante generaciones. Reconocerla y hacerla parte del trabajo evita que el conocimiento se use sin permiso y hace que la propia comunidad siga sosteniéndolo.',
            en:'The knowledge belongs to the community that built it over generations. Acknowledging it and making it part of the work prevents the knowledge from being used without permission and lets the community itself keep sustaining it.' } },
    { title:{ es:'El aporte al ecosistema local', en:'The contribution to the local ecosystem' },
      q:{ es:'Al cerrar el estudio del tema, un grupo debe explicar cuál es el aporte principal de los saberes de los pueblos originarios al cuidado del ecosistema donde viven. ¿Cuál de estas explicaciones es la más adecuada?',
          en:'On closing the study of the topic, a group has to explain what the main contribution of indigenous peoples knowledge is to caring for the ecosystem where they live. Which of these explanations fits best?' },
      opts:{ es:['Son prácticas ajustadas a ese lugar y probadas durante generaciones, que permiten aprovecharlo sin agotarlo',
                 'Son reglas idénticas para cualquier ecosistema del mundo, lo que facilita aplicarlas en cualquier región',
                 'Son técnicas que evitan por completo tocar el ecosistema y lo dejan sin ningún tipo de aprovechamiento',
                 'Son métodos recientes que vinieron a sustituir a las formas de manejo que ya existían en la zona'],
             en:['They are practices fitted to that place and tested over generations, which allow it to be used without exhausting it',
                 'They are rules identical for any ecosystem in the world, which makes them easy to apply in any region',
                 'They are techniques that completely avoid touching the ecosystem and leave it with no use at all',
                 'They are recent methods that came to replace the forms of management that already existed in the area'] }, ci:0,
      hint:{ es:'Recuerda cómo se construyeron estos saberes: en un lugar concreto y durante mucho tiempo.',
             en:'Remember how this knowledge was built: in one specific place and over a long time.' },
      exp:{ es:'La milpa, el manejo del bosque, la veda y el pastoreo por turnos comparten lo mismo: nacieron de observar ese ecosistema en particular y de ajustarse a su ritmo, de modo que la gente vive de él sin dejarlo sin recursos.',
            en:'The milpa, forest management, the closed season and rotational herding all share the same thing: they were born from observing that particular ecosystem and fitting its pace, so that people live from it without leaving it without resources.' } }
  ];
  return mcSpec(pk(rng, V));
}
</script>
