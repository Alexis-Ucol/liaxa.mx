<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ecuaciones Químicas y Ley de Conservación de la Materia</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:100px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 76px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Ecuaciones Químicas y Ley de Conservación de la Materia</div>
    <div class="wcourse" id="wcourse-el">Química · 3° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Ecuaciones Químicas y Ley de Conservación de la Materia</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="sbtn" id="dlBtn" onclick="generatePDF()" style="max-width:280px;margin:0 auto;">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   CENTRALIZED SCHOOL CONFIG (Rule 16) — ships UNBRANDED (Rule 11).
   The ONLY rebranding point. build_all.py substitutes these exact fields
   (BRAND_FIELDS / RGB_FIELDS / logo*) downstream; :root/dark stay as fallback.
   Neutral defaults below == the static :root/dark values, so unbranded == no-op.
   ══════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:'#1a4a8a', primaryDark:'#0c2547', primaryBg:'#e7edf6',
  accent:'#e07b1a', accentBg:'#fbeddf',
  darkPrimary:'#437bc6', darkPrimaryDark:'#74a5e6', darkPrimaryBg:'#0c203a',

  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
  saved.choices.forEach(function(choice, idx) {

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);

  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');

}

   GUIA :: qui3_t10_g02 - Ecuaciones químicas y ley de la conservación de la
   materia. Cómo se traduce una reacción del entorno al lenguaje de las
   ecuaciones, qué dicen los subíndices y los coeficientes, cómo se ajusta una
   ecuación sin inventar ni destruir átomos, por qué la masa total se conserva
   aunque el recipiente esté abierto, y cómo se escribe la energía de las
   reacciones exotérmicas y endotérmicas dentro de la propia ecuación.
   Bilingüe (Rule 10), variantes por semilla (Rule 4), manipulativos marcados
   con data-widget (Part 0).
   ══════════════════════════════════════════════════════════════════════════ */
function L(o){ return (o && o[LANG] !== undefined) ? o[LANG] : (o ? o.es : ''); }
function vpick(rng, list){ return list[Math.floor(rng() * list.length)]; }
function ri(rng, a, b){ return a + Math.floor(rng() * (b - a + 1)); }
function distinctNums(vals){
  var out = [];
  for (var i = 0; i < vals.length; i++){
    var v = vals[i];
    while (out.indexOf(v) !== -1) v = v + 1;
    out.push(v);
  }
  return out;
}
function gramos(n){ return n + ' g'; }
function fm(s){ return String(s).replace(/([A-Za-z\)])(\d+)/g, '$1<sub>$2</sub>'); }
function gcd2(a, b){ while (b){ var t = a % b; a = b; b = t; } return a; }
function gcdList(list){ var g = list[0]; for (var i = 1; i < list.length; i++) g = gcd2(g, list[i]); return g; }
function joinPlus(arr){ return arr.join(' <span class="eq-op">+</span> '); }

function rcard(name, form, note){
  return '<div class="rcard"><div class="rname">' + name + '</div><div class="rform">' + form + '</div><div class="rnote">' + note + '</div></div>';
}

function sec(tag, title, html){
  var d = document.createElement('div');
  d.className = 'section';
  d.innerHTML = '<div class="stag">' + tag + '</div><h2>' + title + '</h2>' + html;
  document.getElementById('lessonBody').appendChild(d);
  return d;
}

function widgetHost(parent, id, kind){
  var d = document.createElement('div');
  d.className = 'gw section';
  d.id = id;
  d.setAttribute('data-widget', kind);
  (parent || document.getElementById('lessonBody')).appendChild(d);
  return d;
}

function addProblem(rng, v){
  var idx = problems.length;
  var opts = L(v.opts).slice();
  var correctVal = opts[v.ci];
  var sh = shuffle(opts, rng);
  var prob = {
    title: L(v.title),
    questionText: L(v.q),
    fn: v.fn ? L(v.fn) : '',
    hint: L(v.hint),
    explanation: L(v.exp),
    options: sh,
    correctIdx: sh.indexOf(correctVal),
    showWork: !!v.showWork,
    studentChoice: null,
    pendingChoice: null
  };
  problems.push(prob);
  buildOneCard(prob, idx);
}

            { f:'NH3', side:1, n:{ es:'el amoniaco', en:'ammonia' } } ] }
];

function wArmar(rng, host){
  var ROUNDS = shuffle(ESCENAS_EQ, rng).slice(0, 3);
  var st = { r:0, tries:0, pos:[], done:false, revealed:false };

  function reset(){
    var it = ROUNDS[st.r].items;
    st.pos = it.map(function(){ return -1; });
    st.tries = 0; st.revealed = false;
  }

  function preview(){
    var it = ROUNDS[st.r].items;
    var lf = [], rt = [];
    for (var i = 0; i < it.length; i++){
      if (st.pos[i] === 0) lf.push('<span>' + fm(it[i].f) + '</span>');
      if (st.pos[i] === 1) rt.push('<span>' + fm(it[i].f) + '</span>');
    }
    var hole = '<span class="eq-hole">' + L({ es:'sin colocar', en:'not placed yet' }) + '</span>';
    return '<div class="eq-line">' + (lf.length ? joinPlus(lf) : hole) +
           '<span class="eq-ar">&#8594;</span>' + (rt.length ? joinPlus(rt) : hole) + '</div>';
  }

  function render(){
    if (st.done){
      host.innerHTML =
        '<div class="gw-h iw-tag">' + L({ es:'Arma la ecuación', en:'Build the equation' }) + '</div>' +
        '<div class="gw-fb good">' + L({
          es:'Armaste las tres escenas. La pregunta que resolvió cada una fue siempre la misma: esta sustancia ya existía antes del cambio o apareció durante el cambio.',
          en:'You built the three scenes. The question that solved each one was always the same: did this substance already exist before the change or did it appear during the change.'
        }) + '</div>';
      return;
    }
    var R = ROUNDS[st.r];
    var chips = R.items.map(function(it, i){
      var cls = 'ar-chip' + (st.pos[i] === 0 ? ' lft' : (st.pos[i] === 1 ? ' rgt' : ''));
      var tag = st.pos[i] === 0 ? L({ es:'antes de la flecha', en:'before the arrow' })
              : st.pos[i] === 1 ? L({ es:'después de la flecha', en:'after the arrow' })
              : L({ es:'toca para colocar', en:'tap to place' });
      return '<button class="' + cls + '" data-act="chip:' + i + '"><span class="ar-tagl">' + tag + '</span>' + fm(it.f) + '</button>';
    }).join('');
    host.innerHTML =
      '<div class="gw-h iw-tag">' + L({ es:'Arma la ecuación', en:'Build the equation' }) + '</div>' +
      '<div class="gw-mini iw-sub">' + L({
        es:'Lee la escena y coloca cada fórmula del lado que le toca. Cada toque la manda a la izquierda de la flecha, luego a la derecha y luego la regresa. La ecuación de arriba se rearma mientras decides.',
        en:'Read the scene and place each formula on the side it belongs to. Each tap sends it to the left of the arrow, then to the right and then back. The equation above rebuilds while you decide.'
      }) + '</div>' +
      '<div class="gw-prog">' + (st.r + 1) + ' / ' + ROUNDS.length + '</div>' +
      preview() +
      '<div class="gw-case">' + L(R.txt) + '</div>' +
      '<div class="ar-chips">' + chips + '</div>' +
      '<div class="gw-row"><button class="gw-btn go" data-act="check">' + L({ es:'Verificar', en:'Check' }) + '</button></div>' +
      '<div class="gw-fb" data-r="fb">' + L({
        es:'Pregúntate por cada fórmula: ¿la tenía en las manos antes de que empezara el cambio?',
        en:'Ask yourself about each formula: did I have it in my hands before the change started?'
      }) + '</div>';
  }

  function say(cls, msg){
    var fb = host.querySelector('[data-r="fb"]');
    if (fb){ fb.className = 'gw-fb ' + cls; fb.innerHTML = msg; }
  }

  function advance(){
    st.r++;
    if (st.r >= ROUNDS.length){ st.done = true; setTimeout(render, 1500); return; }
    reset();
    setTimeout(render, 1500);
  }

  host.addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!b || st.done || st.revealed) return;
    var act = b.getAttribute('data-act');
    if (act.indexOf('chip:') === 0){
      var i = parseInt(act.split(':')[1], 10);
      st.pos[i] = st.pos[i] === -1 ? 0 : (st.pos[i] === 0 ? 1 : -1);
      render();
      return;
    }
    if (act !== 'check') return;
    var R = ROUNDS[st.r];
    var missing = st.pos.indexOf(-1);
    if (missing !== -1){
      say('warm', L({ es:'Todavía hay fórmulas fuera de la ecuación. Falta colocar ', en:'There are still formulas outside the equation. Still to place: ' }) + fm(R.items[missing].f) + '.');
      return;
    }
    var bad = -1;
    for (var i = 0; i < R.items.length; i++){ if (st.pos[i] !== R.items[i].side){ bad = i; break; } }
    if (bad === -1){
      st.revealed = true;
      say('good', L({ es:'Así queda: las sustancias de partida a la izquierda y las que se forman a la derecha. Todavía le faltan los coeficientes, y de eso te encargas más adelante.',
                      en:'That is how it goes: the starting substances on the left and the ones that form on the right. It still needs its coefficients, and you will take care of that later.' }));
      advance();
      return;
    }
    st.tries++;
    if (st.tries >= 3){
      st.revealed = true;
      for (var k = 0; k < R.items.length; k++) st.pos[k] = R.items[k].side;
      render();
      say('warm', L({ es:'Así se arma. Lo que existía antes del cambio va a la izquierda y lo que aparece durante el cambio va a la derecha.',
                      en:'This is how it is built. What existed before the change goes on the left and what appears during the change goes on the right.' }));
      advance();
      return;
    }
    var it = R.items[bad];
    if (it.side === 1){
      say('miss', L({ es:'Revisa ', en:'Look again at ' }) + fm(it.f) + L({
        es:'. En la escena, ' + L(it.n) + ' no estaba antes de que empezara el cambio: se formó durante la reacción, así que va del otro lado de la flecha.',
        en:'. In the scene, ' + L(it.n) + ' was not there before the change started: it formed during the reaction, so it goes on the other side of the arrow.'
      }));
    } else {
      say('miss', L({ es:'Revisa ', en:'Look again at ' }) + fm(it.f) + L({
        es:'. En la escena, ' + L(it.n) + ' ya estaba antes de que empezara el cambio, así que va del otro lado de la flecha.',
        en:'. In the scene, ' + L(it.n) + ' was already there before the change started, so it goes on the other side of the arrow.'
      }));
    }
  });

  reset();
  render();
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 2 :: multiplicador de fórmulas
   El estudiante sube y baja el coeficiente que va delante de una fórmula. La
   bandeja dibuja tantas unidades como marca el coeficiente y el contador de
   átomos del elemento pedido se actualiza en cada toque, con un aviso que dice
   si va corto o si se pasó. A la tercera verificación fallida se acomoda solo.
   ══════════════════════════════════════════════════════════════════════════ */
var MOLECULAS = [
  { f:'H2O',   a:{ H:2, O:1 } },
  { f:'CO2',   a:{ C:1, O:2 } },
  { f:'NH3',   a:{ N:1, H:3 } },
  { f:'Al2O3', a:{ Al:2, O:3 } },
  { f:'H2SO4', a:{ H:2, S:1, O:4 } },
  { f:'C3H8',  a:{ C:3, H:8 } },
  { f:'Fe2O3', a:{ Fe:2, O:3 } }
];

function wMultiplicador(rng, host){
  var pool = shuffle(MOLECULAS, rng).slice(0, 3);
  var ROUNDS = pool.map(function(m){
    var els = Object.keys(m.a).filter(function(k){ return m.a[k] >= 2; });
    if (!els.length) els = Object.keys(m.a);
    var el = els[Math.floor(rng() * els.length)];
    var k = ri(rng, 2, 5);
    return { m:m, el:el, per:m.a[el], goal:k * m.a[el], sol:k };
  });
  var st = { r:0, c:1, tries:0, done:false, lock:false };

  function have(){ return st.c * ROUNDS[st.r].per; }

  function tray(){
    var R = ROUNDS[st.r];
    if (st.c === 0) return '<div class="ct-tray"><span class="ct-empty">' + L({ es:'La bandeja está vacía: sube el coeficiente.', en:'The tray is empty: raise the coefficient.' }) + '</span></div>';
    var out = '';
    for (var i = 0; i < st.c; i++) out += '<span class="ct-mol">' + fm(R.m.f) + '</span>';
    return '<div class="ct-tray">' + out + '</div>';
  }

  function render(){
    if (st.done){
      host.innerHTML =
        '<div class="gw-h iw-tag">' + L({ es:'Multiplicador de fórmulas', en:'Formula multiplier' }) + '</div>' +
        '<div class="gw-fb good">' + L({
          es:'Listo. El número grande de adelante multiplica a todos los átomos de la fórmula, y el número pequeño de abajo dice cuántos hay en una sola unidad.',
          en:'Done. The large number in front multiplies every atom of the formula, and the small number below says how many there are in one single unit.'
        }) + '</div>';
      return;
    }
    var R = ROUNDS[st.r];
    host.innerHTML =
      '<div class="gw-h iw-tag">' + L({ es:'Multiplicador de fórmulas', en:'Formula multiplier' }) + '</div>' +
      '<div class="gw-mini iw-sub">' + L({
        es:'Mueve el número grande de adelante y observa la bandeja: cada unidad que agregas trae consigo todos sus átomos. Detente cuando el contador marque justo lo que se pide.',
        en:'Move the large number in front and watch the tray: every unit you add brings all its atoms with it. Stop when the counter shows exactly what is asked.'
      }) + '</div>' +
      '<div class="gw-prog">' + (st.r + 1) + ' / ' + ROUNDS.length + '</div>' +
      '<div class="gw-case">' + L({ es:'Consigue exactamente ', en:'Get exactly ' }) + '<b>' + R.goal + ' ' +
        L({ es:'átomos de ', en:'atoms of ' }) + R.el + '</b>' + L({ es:' usando únicamente unidades de ', en:' using only units of ' }) + fm(R.m.f) + '.</div>' +
      '<div class="gw-row">' +
        '<button class="st-btn" data-act="dec">&#8722;</button>' +
        '<span class="st-val">' + st.c + '</span>' +
        '<button class="st-btn" data-act="inc">+</button>' +
        '<span class="ct-mol">' + fm(R.m.f) + '</span>' +
      '</div>' +
      tray() +
      '<div class="ct-read"><span>' + L({ es:'átomos de ', en:'atoms of ' }) + R.el + '</span><span class="ct-big">' + have() + '</span></div>' +
      '<div class="gw-row"><button class="gw-btn go" data-act="check">' + L({ es:'Verificar', en:'Check' }) + '</button></div>' +
      '<div class="gw-fb" data-r="fb"></div>';
    nudge();
  }

  function say(cls, msg){
    var fb = host.querySelector('[data-r="fb"]');
    if (fb){ fb.className = 'gw-fb ' + cls; fb.innerHTML = msg; }
  }

  function nudge(){
    var R = ROUNDS[st.r], h = have();
    if (h === R.goal) say('good', L({ es:'El contador ya marca ', en:'The counter already shows ' }) + R.goal + L({ es:'. Verifica para confirmarlo.', en:'. Check to confirm it.' }));
    else if (h < R.goal) say('', L({ es:'Vas en ', en:'You are at ' }) + h + L({ es:' y necesitas ', en:' and you need ' }) + R.goal + L({ es:'. Te faltan ', en:'. You are short by ' }) + (R.goal - h) + L({ es:' átomos.', en:' atoms.' }));
    else say('warm', L({ es:'Vas en ', en:'You are at ' }) + h + L({ es:' y necesitas ', en:' and you need ' }) + R.goal + L({ es:'. Te pasaste por ', en:'. You went over by ' }) + (h - R.goal) + L({ es:' átomos.', en:' atoms.' }));
  }

  host.addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!b || st.done || st.lock) return;
    var act = b.getAttribute('data-act');
    if (act === 'inc'){ if (st.c < 9) st.c++; render(); return; }
    if (act === 'dec'){ if (st.c > 0) st.c--; render(); return; }
    if (act !== 'check') return;
    var R = ROUNDS[st.r];
    if (have() === R.goal){
      st.lock = true;
      say('good', L({ es:'Correcto: ', en:'Correct: ' }) + st.c + ' &#215; ' + R.per + ' = ' + R.goal + L({
        es:' átomos de ' + R.el + '. Una sola unidad aporta ' + R.per + ', y el coeficiente repite esa aportación.',
        en:' atoms of ' + R.el + '. A single unit brings ' + R.per + ', and the coefficient repeats that contribution.'
      }));
    } else {
      st.tries++;
      if (st.tries < 3){ nudge(); return; }
      st.lock = true; st.c = R.sol;
      render();
      st.lock = true;
      say('warm', L({ es:'Este era el coeficiente: ', en:'This was the coefficient: ' }) + R.sol + '. ' +
        L({ es:'Cada unidad de ', en:'Each unit of ' }) + fm(R.m.f) + L({ es:' aporta ' + R.per + ' átomos de ' + R.el + '.', en:' brings ' + R.per + ' atoms of ' + R.el + '.' }));
    }
    setTimeout(function(){
      st.r++; st.c = 1; st.tries = 0; st.lock = false;
      if (st.r >= ROUNDS.length) st.done = true;
      render();
    }, 1900);
  });

  render();
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 3 :: mesa de ajuste
   La ecuación aparece con un contador delante de cada fórmula. Cada toque sube
   o baja un coeficiente y la tabla de abajo recalcula, elemento por elemento,
   cuántos átomos hay de cada lado y marca los que ya coinciden. La verificación
   nombra el primer elemento desigual y hacia qué lado hace falta. A la tercera
   se acomoda sola.
   ══════════════════════════════════════════════════════════════════════════ */
var ECUACIONES = [
  { L:[{ f:'Fe', a:{ Fe:1 } }, { f:'O2', a:{ O:2 } }], R:[{ f:'Fe2O3', a:{ Fe:2, O:3 } }], sol:[4,3,2] },
  { L:[{ f:'H2', a:{ H:2 } }, { f:'O2', a:{ O:2 } }], R:[{ f:'H2O', a:{ H:2, O:1 } }], sol:[2,1,2] },
  { L:[{ f:'N2', a:{ N:2 } }, { f:'H2', a:{ H:2 } }], R:[{ f:'NH3', a:{ N:1, H:3 } }], sol:[1,3,2] },
  { L:[{ f:'Mg', a:{ Mg:1 } }, { f:'O2', a:{ O:2 } }], R:[{ f:'MgO', a:{ Mg:1, O:1 } }], sol:[2,1,2] },
  { L:[{ f:'CH4', a:{ C:1, H:4 } }, { f:'O2', a:{ O:2 } }], R:[{ f:'CO2', a:{ C:1, O:2 } }, { f:'H2O', a:{ H:2, O:1 } }], sol:[1,2,1,2] },
  { L:[{ f:'Al', a:{ Al:1 } }, { f:'O2', a:{ O:2 } }], R:[{ f:'Al2O3', a:{ Al:2, O:3 } }], sol:[4,3,2] }
];

function wMesaAjuste(rng, host){
  var ROUNDS = shuffle(ECUACIONES, rng).slice(0, 3);
  var st = { r:0, c:[], tries:0, done:false, lock:false };

  function terms(){ return ROUNDS[st.r].L.concat(ROUNDS[st.r].R); }
  function reset(){ st.c = terms().map(function(){ return 1; }); st.tries = 0; }

  function elements(){
    var E = ROUNDS[st.r], out = [];
    terms().forEach(function(t){ Object.keys(t.a).forEach(function(k){ if (out.indexOf(k) === -1) out.push(k); }); });
    return out;
  }

  function side(which){
    var E = ROUNDS[st.r], off = which === 0 ? 0 : E.L.length;
    var list = which === 0 ? E.L : E.R, acc = {};
    list.forEach(function(t, i){
      Object.keys(t.a).forEach(function(k){ acc[k] = (acc[k] || 0) + st.c[off + i] * t.a[k]; });
    });
    return acc;
  }

  function eqLine(){
    var E = ROUNDS[st.r];
    function grp(list, off){
      return list.map(function(t, i){
        var gi = off + i;
        return '<span class="bx-sp"><button class="bx-step" data-act="dn:' + gi + '">&#8722;</button>' +
               '<span class="bx-n">' + st.c[gi] + '</span>' +
               '<button class="bx-step" data-act="up:' + gi + '">+</button>' +
               '<span class="bx-f">' + fm(t.f) + '</span></span>';
      });
    }
    return '<div class="eq-line">' + joinPlus(grp(E.L, 0)) + '<span class="eq-ar">&#8594;</span>' + joinPlus(grp(E.R, E.L.length)) + '</div>';
  }

  function table(){
    var lf = side(0), rt = side(1);
    return elements().map(function(k){
      var a = lf[k] || 0, b = rt[k] || 0, ok = a === b;
      return '<div class="bx-row"><span class="bx-el">' + k + '</span>' +
             '<span class="bx-cnt' + (ok ? '' : ' hi') + '">' + a + ' ' + L({ es:'izq', en:'left' }) + '</span>' +
             '<span class="bx-cnt' + (ok ? '' : ' hi') + '">' + b + ' ' + L({ es:'der', en:'right' }) + '</span>' +
             '<span class="bx-mk ' + (ok ? 'ok' : 'no') + '">' + (ok ? '&#10003;' : '&#8800;') + '</span></div>';
    }).join('');
  }

  function render(){
    if (st.done){
      host.innerHTML =
        '<div class="gw-h iw-tag">' + L({ es:'Mesa de ajuste', en:'Balancing table' }) + '</div>' +
        '<div class="gw-fb good">' + L({
          es:'Ajustaste tres ecuaciones sin tocar una sola fórmula. Ese es el trato: los números grandes se mueven, los pequeños nunca.',
          en:'You balanced three equations without touching a single formula. That is the deal: the large numbers move, the small ones never do.'
        }) + '</div>';
      return;
    }
    host.innerHTML =
      '<div class="gw-h iw-tag">' + L({ es:'Mesa de ajuste', en:'Balancing table' }) + '</div>' +
      '<div class="gw-mini iw-sub">' + L({
        es:'Sube o baja los números grandes de adelante y mira la tabla: te dice cuántos átomos de cada elemento hay de cada lado en ese momento. Las fórmulas no se tocan.',
        en:'Raise or lower the large numbers in front and watch the table: it tells you how many atoms of each element are on each side at that moment. The formulas are not to be touched.'
      }) + '</div>' +
      '<div class="gw-prog">' + (st.r + 1) + ' / ' + ROUNDS.length + '</div>' +
      eqLine() +
      '<div class="gw-lbl">' + L({ es:'Conteo de átomos', en:'Atom count' }) + '</div>' +
      table() +
      '<div class="gw-row"><button class="gw-btn go" data-act="check">' + L({ es:'Verificar', en:'Check' }) + '</button>' +
      '<button class="gw-btn" data-act="reset">' + L({ es:'Volver a 1', en:'Back to 1' }) + '</button></div>' +
      '<div class="gw-fb" data-r="fb">' + L({
        es:'Empieza por el elemento que aparece en menos fórmulas y deja el oxígeno para el final.',
        en:'Start with the element that appears in the fewest formulas and leave oxygen for last.'
      }) + '</div>';
  }

  function say(cls, msg){
    var fb = host.querySelector('[data-r="fb"]');
    if (fb){ fb.className = 'gw-fb ' + cls; fb.innerHTML = msg; }
  }

  host.addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!b || st.done || st.lock) return;
    var act = b.getAttribute('data-act');
    if (act.indexOf('up:') === 0 || act.indexOf('dn:') === 0){
      var gi = parseInt(act.split(':')[1], 10);
      if (act.indexOf('up:') === 0){ if (st.c[gi] < 12) st.c[gi]++; }
      else { if (st.c[gi] > 1) st.c[gi]--; }
      render();
      return;
    }
    if (act === 'reset'){ st.c = terms().map(function(){ return 1; }); render(); return; }
    if (act !== 'check') return;
    var lf = side(0), rt = side(1), els = elements(), bad = null;
    for (var i = 0; i < els.length; i++){ if ((lf[els[i]] || 0) !== (rt[els[i]] || 0)){ bad = els[i]; break; } }
    if (bad === null){
      var g = gcdList(st.c);
      if (g > 1){
        say('warm', L({ es:'Los dos lados ya tienen los mismos átomos, pero todos los coeficientes se pueden dividir entre ', en:'Both sides already have the same atoms, but every coefficient can be divided by ' }) + g +
          L({ es:'. La ecuación se escribe con los números más pequeños posibles.', en:'. The equation is written with the smallest possible numbers.' }));
        return;
      }
      st.lock = true;
      say('good', L({ es:'Ajustada. Cada elemento aparece la misma cantidad de veces de los dos lados, y ni un átomo se inventó ni se perdió.',
                      en:'Balanced. Each element appears the same number of times on both sides, and not one atom was invented or lost.' }));
    } else {
      st.tries++;
      if (st.tries < 3){
        var falta = (lf[bad] || 0) > (rt[bad] || 0)
          ? L({ es:' faltan del lado derecho', en:' are missing on the right side' })
          : L({ es:' faltan del lado izquierdo', en:' are missing on the left side' });
        var dif = Math.abs((lf[bad] || 0) - (rt[bad] || 0));
        say('miss', L({ es:'Todavía no. Mira el ', en:'Not yet. Look at ' }) + bad + ': ' + dif + L({ es:' átomos', en:' atoms' }) + falta + '.');
        return;
      }
      st.lock = true;
      st.c = ROUNDS[st.r].sol.slice();
      render();
      st.lock = true;
      say('warm', L({ es:'Así queda ajustada. Compara la tabla con la que tenías y fíjate en qué momento se desacomodó el conteo.',
                      en:'This is how it ends up balanced. Compare the table with the one you had and notice when the count went off.' }));
    }
    setTimeout(function(){
      st.r++;
      if (st.r >= ROUNDS.length){ st.done = true; st.lock = false; render(); return; }
      reset(); st.lock = false; render();
    }, 2100);
  });

  reset();
  render();
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 4 :: balanza de Lavoisier
   Un frasco sellado con las masas de lo que entró y de lo que salió, salvo una
   que falta. El estudiante la ajusta de gramo en gramo o de cinco en cinco; la
   viga se inclina en tiempo real hacia el lado más pesado y el marcador dice
   cuántos gramos sobran o faltan. A la tercera verificación se muestra el valor.
   ══════════════════════════════════════════════════════════════════════════ */
function wLavoisier(rng, host){
  var CASOS = [
    { pre:{ es:'Dentro de un frasco sellado se queman virutas de magnesio con el oxígeno que había adentro.',
            en:'Inside a sealed jar, magnesium shavings are burned with the oxygen that was inside.' },
      izq:[{ n:{ es:'magnesio', en:'magnesium' } }, { n:{ es:'oxígeno', en:'oxygen' } }],
      der:[{ n:{ es:'óxido de magnesio', en:'magnesium oxide' } }] },
    { pre:{ es:'Dentro de un frasco sellado se calienta piedra caliza hasta que se descompone por completo.',
            en:'Inside a sealed jar, limestone is heated until it fully breaks down.' },
      izq:[{ n:{ es:'piedra caliza', en:'limestone' } }],
      der:[{ n:{ es:'cal viva', en:'quicklime' } }, { n:{ es:'dióxido de carbono', en:'carbon dioxide' } }] },
    { pre:{ es:'Dentro de un frasco sellado se mezcla bicarbonato con vinagre y todo el gas queda atrapado.',
            en:'Inside a sealed jar, baking soda is mixed with vinegar and all the gas stays trapped.' },
      izq:[{ n:{ es:'bicarbonato', en:'baking soda' } }, { n:{ es:'vinagre', en:'vinegar' } }],
      der:[{ n:{ es:'disolución final', en:'final solution' } }, { n:{ es:'gas atrapado', en:'trapped gas' } }] }
  ];
  var ROUNDS = shuffle(CASOS, rng).slice(0, 3).map(function(c){
    var vals, hidden;
    if (c.izq.length === 2){
      var a = ri(rng, 12, 30), b = ri(rng, 8, 24);
      vals = { izq:[a, b], der:[a + b] };
      hidden = { lado:'der', i:0 };
    } else {
      var m = ri(rng, 40, 80), s = ri(rng, 15, 30);
      vals = { izq:[m], der:[s, m - s] };
      hidden = { lado:'der', i:1 };
    }
    if (c.der.length === 2 && c.izq.length === 2){
      var x = ri(rng, 14, 28), y = ri(rng, 10, 26), z = ri(rng, 6, 18);
      vals = { izq:[x, y], der:[x + y - z, z] };
      hidden = { lado:'der', i:1 };
    }
    return { c:c, vals:vals, hidden:hidden, sol:vals[hidden.lado][hidden.i] };
  });
  var st = { r:0, g:1, tries:0, done:false, lock:false };

  function shown(lado, i){
    var R = ROUNDS[st.r];
    if (R.hidden.lado === lado && R.hidden.i === i) return st.g;
    return R.vals[lado][i];
  }
  function total(lado){
    var R = ROUNDS[st.r], s = 0;
    for (var i = 0; i < R.vals[lado].length; i++) s += shown(lado, i);
    return s;
  }

  function listado(lado, labels){
    var R = ROUNDS[st.r];
    return labels.map(function(it, i){
      var isH = (R.hidden.lado === lado && R.hidden.i === i);
      return '<div class="bm-read"><span>' + L(it.n) + '</span><span>' + (isH ? '<b>' + shown(lado, i) + ' g</b>' : shown(lado, i) + ' g') + '</span></div>';
    }).join('');
  }

  function render(){
    if (st.done){
      host.innerHTML =
        '<div class="gw-h iw-tag">' + L({ es:'Balanza de Lavoisier', en:'Lavoisier balance' }) + '</div>' +
        '<div class="gw-fb good">' + L({
          es:'En los tres frascos sellados la balanza quedó en equilibrio. Nada se perdió: la materia solo se reacomodó adentro del frasco.',
          en:'In all three sealed jars the balance ended level. Nothing was lost: matter only rearranged inside the jar.'
        }) + '</div>';
      return;
    }
    var R = ROUNDS[st.r];
    var d = total('izq') - total('der');
    var ang = Math.max(-11, Math.min(11, d * 1.6));
    host.innerHTML =
      '<div class="gw-h iw-tag">' + L({ es:'Balanza de Lavoisier', en:'Lavoisier balance' }) + '</div>' +
      '<div class="gw-mini iw-sub">' + L({
        es:'Falta una masa. Ajústala y observa la viga: se inclina hacia el lado que pesa más y solo queda horizontal cuando las dos cuentas coinciden.',
        en:'One mass is missing. Adjust it and watch the beam: it tips towards the heavier side and only stays level when both counts match.'
      }) + '</div>' +
      '<div class="gw-prog">' + (st.r + 1) + ' / ' + ROUNDS.length + '</div>' +
      '<div class="gw-case">' + L(R.c.pre) + '</div>' +
      '<div class="bm-stage"><div class="bm-post"></div>' +
        '<div class="bm-beam" style="transform:rotate(' + ang + 'deg)"><div class="bm-pan lf"></div><div class="bm-pan rt"></div></div></div>' +
      '<div class="gw-lbl">' + L({ es:'Antes de la flecha', en:'Before the arrow' }) + '</div>' + listado('izq', R.c.izq) +
      '<div class="gw-lbl">' + L({ es:'Después de la flecha', en:'After the arrow' }) + '</div>' + listado('der', R.c.der) +
      '<div class="bm-delta">' + total('izq') + ' g &#8226; ' + total('der') + ' g</div>' +
      '<div class="gw-row">' +
        '<button class="st-btn" data-act="m5">&#8722;5</button>' +
        '<button class="st-btn" data-act="m1">&#8722;1</button>' +
        '<span class="st-val">' + st.g + ' g</span>' +
        '<button class="st-btn" data-act="p1">+1</button>' +
        '<button class="st-btn" data-act="p5">+5</button>' +
      '</div>' +
      '<div class="gw-row"><button class="gw-btn go" data-act="check">' + L({ es:'Verificar', en:'Check' }) + '</button></div>' +
      '<div class="gw-fb" data-r="fb">' + (d === 0
        ? L({ es:'La viga está horizontal: las dos cuentas coinciden.', en:'The beam is level: both counts match.' })
        : (d > 0
          ? L({ es:'La viga cae del lado izquierdo: del lado derecho faltan ', en:'The beam drops on the left: the right side is short by ' }) + Math.abs(d) + ' g.'
          : L({ es:'La viga cae del lado derecho: ahí sobran ', en:'The beam drops on the right: there are ' }) + Math.abs(d) + L({ es:' g.', en:' g too many there.' }))) +
      '</div>';
  }

  function say(cls, msg){
    var fb = host.querySelector('[data-r="fb"]');
    if (fb){ fb.className = 'gw-fb ' + cls; fb.innerHTML = msg; }
  }

  host.addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!b || st.done || st.lock) return;
    var act = b.getAttribute('data-act');
    if (act === 'p1'){ st.g = Math.min(160, st.g + 1); render(); return; }
    if (act === 'm1'){ st.g = Math.max(0, st.g - 1); render(); return; }
    if (act === 'p5'){ st.g = Math.min(160, st.g + 5); render(); return; }
    if (act === 'm5'){ st.g = Math.max(0, st.g - 5); render(); return; }
    if (act !== 'check') return;
    var R = ROUNDS[st.r];
    if (st.g === R.sol){
      st.lock = true;
      say('good', L({ es:'Equilibrada. En un frasco sellado la masa total del final es la misma que la del principio, así que la pieza que faltaba solo podía valer ', en:'Level. In a sealed jar the total mass at the end is the same as at the start, so the missing piece could only be worth ' }) + R.sol + ' g.');
    } else {
      st.tries++;
      if (st.tries < 3){
        var d2 = total('izq') - total('der');
        say('miss', d2 > 0
          ? L({ es:'Todavía no. La viga sigue cayendo del lado izquierdo: sube la masa que falta.', en:'Not yet. The beam still drops on the left: raise the missing mass.' })
          : L({ es:'Todavía no. La viga sigue cayendo del lado derecho: baja la masa que falta.', en:'Not yet. The beam still drops on the right: lower the missing mass.' }));
        return;
      }
      st.lock = true; st.g = R.sol;
      render();
      st.lock = true;
      say('warm', L({ es:'Era ', en:'It was ' }) + R.sol + L({ es:' g. Con el frasco sellado, lo que entra y lo que sale tienen que sumar lo mismo.', en:' g. With the jar sealed, what goes in and what comes out have to add up to the same.' }));
    }
    setTimeout(function(){
      st.r++; st.g = 1; st.tries = 0; st.lock = false;
      if (st.r >= ROUNDS.length) st.done = true;
      render();
    }, 2100);
  });

  render();
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 5 :: dónde va la energía
   El estudiante coloca el término energía a un lado o al otro de la flecha. La
   ecuación se reescribe y el termómetro se mueve de inmediato para mostrar la
   consecuencia de esa decisión: sube si la energía sale hacia el entorno y baja
   si la reacción tiene que tomarla. Después compara con lo que dice el caso.
   ══════════════════════════════════════════════════════════════════════════ */
var CASOS_ENERGIA = [
  { txt:{ es:'Al encender la estufa, la olla y el aire alrededor se calientan mientras el gas arde.',
          en:'When the stove is lit, the pot and the air around it heat up while the gas burns.' },
    eqL:['CH4','2 O2'], eqR:['CO2','2 H2O'], side:1 },
  { txt:{ es:'Una planta usa la luz del Sol para formar azúcares a partir de dióxido de carbono y agua.',
          en:'A plant uses sunlight to build sugars out of carbon dioxide and water.' },
    eqL:['6 CO2','6 H2O'], eqR:['C6H12O6','6 O2'], side:0 },
  { txt:{ es:'Al mezclar cal viva con agua, la cubeta se calienta tanto que no se puede sostener.',
          en:'When quicklime is mixed with water, the bucket heats up so much that you cannot hold it.' },
    eqL:['CaO','H2O'], eqR:['Ca(OH)2'], side:1 },
  { txt:{ es:'La piedra caliza solo se descompone mientras el horno la mantiene al rojo vivo.',
          en:'Limestone only breaks down while the kiln keeps it red hot.' },
    eqL:['CaCO3'], eqR:['CaO','CO2'], side:0 },
  { txt:{ es:'Al mezclar bicarbonato con vinagre, el vaso se enfría y la temperatura baja varios grados.',
          en:'When baking soda is mixed with vinegar, the glass cools and the temperature drops several degrees.' },
    eqL:['NaHCO3','CH3COOH'], eqR:['CH3COONa','H2O','CO2'], side:0 }
];

function wEnergia(rng, host){
  var ROUNDS = shuffle(CASOS_ENERGIA, rng).slice(0, 3);
  var st = { r:0, pick:null, tries:0, done:false, lock:false };

  function eqLine(){
    var R = ROUNDS[st.r];
    var lf = R.eqL.map(function(x){ return '<span>' + fm(x) + '</span>'; });
    var rt = R.eqR.map(function(x){ return '<span>' + fm(x) + '</span>'; });
    var en = '<span class="eq-en">' + L({ es:'energía', en:'energy' }) + '</span>';
    if (st.pick === 0) lf = lf.concat([en]);
    if (st.pick === 1) rt = rt.concat([en]);
    return '<div class="eq-line">' + joinPlus(lf) + '<span class="eq-ar">&#8594;</span>' + joinPlus(rt) + '</div>';
  }

  function termo(){
    var h = st.pick === null ? 50 : (st.pick === 1 ? 86 : 16);
    var cls = st.pick === null ? '' : (st.pick === 1 ? ' up' : ' down');
    var note = st.pick === null
      ? L({ es:'Coloca la energía y el termómetro mostrará qué le pasaría al entorno.', en:'Place the energy and the thermometer will show what would happen to the surroundings.' })
      : (st.pick === 1
        ? L({ es:'Con la energía del lado de los productos, la reacción la entrega y el entorno se calienta.', en:'With the energy on the products side, the reaction hands it over and the surroundings heat up.' })
        : L({ es:'Con la energía del lado de los reactivos, la reacción la necesita y la toma del entorno, que se enfría.', en:'With the energy on the reactants side, the reaction needs it and takes it from the surroundings, which cool down.' }));
    return '<div class="th-wrap"><div class="th-tube"><div class="th-mid"></div><div class="th-merc' + cls + '" style="height:' + h + '%"></div></div>' +
           '<div class="th-note">' + note + '</div></div>';
  }

  function render(){
    if (st.done){
      host.innerHTML =
        '<div class="gw-h iw-tag">' + L({ es:'Dónde va la energía', en:'Where the energy goes' }) + '</div>' +
        '<div class="gw-fb good">' + L({
          es:'Ya puedes leer el intercambio en la propia ecuación: si la energía está escrita con los productos, la reacción calienta; si está escrita con los reactivos, enfría lo que la rodea.',
          en:'You can now read the exchange in the equation itself: if the energy is written with the products, the reaction heats; if it is written with the reactants, it cools its surroundings.'
        }) + '</div>';
      return;
    }
    var R = ROUNDS[st.r];
    host.innerHTML =
      '<div class="gw-h iw-tag">' + L({ es:'Dónde va la energía', en:'Where the energy goes' }) + '</div>' +
      '<div class="gw-mini iw-sub">' + L({
        es:'Lee el caso y decide de qué lado de la flecha se escribe la energía. La ecuación y el termómetro responden al instante para que veas la consecuencia antes de verificar.',
        en:'Read the case and decide on which side of the arrow the energy is written. The equation and the thermometer respond instantly so you can see the consequence before checking.'
      }) + '</div>' +
      '<div class="gw-prog">' + (st.r + 1) + ' / ' + ROUNDS.length + '</div>' +
      '<div class="gw-case">' + L(R.txt) + '</div>' +
      eqLine() + termo() +
      '<div class="gw-row">' +
        '<button class="gw-btn' + (st.pick === 0 ? ' pick' : '') + '" data-act="s0">' + L({ es:'Con los reactivos', en:'With the reactants' }) + '</button>' +
        '<button class="gw-btn' + (st.pick === 1 ? ' pick' : '') + '" data-act="s1">' + L({ es:'Con los productos', en:'With the products' }) + '</button>' +
      '</div>' +
      '<div class="gw-row"><button class="gw-btn go" data-act="check">' + L({ es:'Verificar', en:'Check' }) + '</button></div>' +
      '<div class="gw-fb" data-r="fb"></div>';
  }

  function say(cls, msg){
    var fb = host.querySelector('[data-r="fb"]');
    if (fb){ fb.className = 'gw-fb ' + cls; fb.innerHTML = msg; }
  }

  host.addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!b || st.done || st.lock) return;
    var act = b.getAttribute('data-act');
    if (act === 's0'){ st.pick = 0; render(); return; }
    if (act === 's1'){ st.pick = 1; render(); return; }
    if (act !== 'check') return;
    var R = ROUNDS[st.r];
    if (st.pick === null){
      say('warm', L({ es:'Primero coloca la energía de algún lado de la flecha.', en:'First place the energy on one side of the arrow.' }));
      return;
    }
    if (st.pick === R.side){
      st.lock = true;
      say('good', R.side === 1
        ? L({ es:'Correcto. La reacción entrega energía al entorno, así que la energía se escribe junto a los productos: es exotérmica.',
              en:'Correct. The reaction hands energy over to the surroundings, so the energy is written next to the products: it is exothermic.' })
        : L({ es:'Correcto. La reacción necesita energía para ocurrir, así que la energía se escribe junto a los reactivos: es endotérmica.',
              en:'Correct. The reaction needs energy to happen, so the energy is written next to the reactants: it is endothermic.' }));
    } else {
      st.tries++;
      if (st.tries < 3){
        say('miss', st.pick === 1
          ? L({ es:'Mira el termómetro: lo dejaste subiendo, o sea entregando calor. Vuelve a leer el caso y fíjate si el entorno se calienta o si hace falta calentarlo para que ocurra.',
                en:'Look at the thermometer: you left it rising, that is handing out heat. Read the case again and check whether the surroundings heat up or whether they need heating for it to happen.' })
          : L({ es:'Mira el termómetro: lo dejaste bajando, o sea tomando calor. Vuelve a leer el caso y fíjate si el entorno se enfría o si más bien se calienta solo.',
                en:'Look at the thermometer: you left it dropping, that is taking heat in. Read the case again and check whether the surroundings cool down or rather heat up on their own.' }));
        return;
      }
      st.lock = true; st.pick = R.side;
      render();
      st.lock = true;
      say('warm', R.side === 1
        ? L({ es:'Aquí la energía va con los productos: el entorno se calienta porque la reacción se la entrega.', en:'Here the energy goes with the products: the surroundings heat up because the reaction hands it over.' })
        : L({ es:'Aquí la energía va con los reactivos: la reacción no ocurre si nadie le da esa energía.', en:'Here the energy goes with the reactants: the reaction does not happen unless someone gives it that energy.' }));
    }
    setTimeout(function(){
      st.r++; st.pick = null; st.tries = 0; st.lock = false;
      if (st.r >= ROUNDS.length) st.done = true;
      render();
    }, 2100);
  });

  render();
}

      '<div class="ctoolbar">' +
        '<button class="tbtn2 bpen on">' + t('btn-pen') + '</button>' +
        '<button class="tbtn2 bmarker">' + t('btn-marker') + '</button>' +
        '<button class="tbtn2 beraser">' + t('btn-eraser') + '</button>' +
        '<div class="cdot sel" data-color="#0f2d5a" style="background:#0f2d5a"></div>' +
        '<div class="cdot" data-color="#1a1a16" style="background:#1a1a16"></div>' +
        '<div class="cdot" data-color="#8b2500" style="background:#8b2500"></div>' +
        '<div class="cdot" data-color="#1d4e89" style="background:#1d4e89"></div>' +
        '<button class="clrbtn">' + t('btn-clear') + '</button>' +
      '</div>' +
    '</div></div>' +
    '<div class="gw-row"><button class="gw-btn go" data-act="save">' + L({ es:'Guardar en el cuaderno', en:'Save to the notebook' }) + '</button></div>' +
    '<div class="gw-fb" data-r="fb"></div>';

  host.addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!b) return;
    var act = b.getAttribute('data-act');
    if (act === 'ttype' || act === 'tdraw'){
      var which = act === 'ttype' ? 'type' : 'draw';
      ['type', 'draw'].forEach(function(k){
        var el = document.getElementById('cua_' + k);
        if (el) el.classList.toggle('active', k === which);

      host.querySelectorAll('.wtab').forEach(function(x){ x.classList.remove('active'); });
      b.classList.add('active');
      if (which === 'draw') setTimeout(function(){
        var c = document.getElementById('cuaCv');
        if (c && !c.width) initCanvas(c);

  });
}

function mkP3(rng){
  var esp = vpick(rng, [
    { f:'Al2O3', el:'O',  per:3, oel:'Al', oper:2 },
    { f:'Fe2O3', el:'O',  per:3, oel:'Fe', oper:2 },
    { f:'H2SO4', el:'O',  per:4, oel:'H',  oper:2 },
    { f:'C3H8',  el:'H',  per:8, oel:'C',  oper:3 },
    { f:'CO2',   el:'O',  per:2, oel:'C',  oper:1 }
  ]);
  var k = ri(rng, 3, 6);
  var A = vpick(rng, [0, 1]);
  if (A === 0){
    var corr = k * esp.per;
    var vals = distinctNums([corr, k + esp.per, esp.per, k * esp.oper]);
    return {
      title:{ es:'Cuenta lo que trae el término', en:'Count what the term brings' },
      showWork:true,
      q:{ es:'Dentro de una ecuación aparece el término ' + k + ' ' + fm(esp.f) + '. ¿Cuántos átomos de ' + esp.el + ' hay en total en ese término?',
          en:'Inside an equation the term ' + k + ' ' + fm(esp.f) + ' appears. How many atoms of ' + esp.el + ' are there in total in that term?' },
      opts:{ es:vals.map(function(v){ return v + ' átomos'; }), en:vals.map(function(v){ return v + ' atoms'; }) },
      ci:0,
      hint:{ es:'El número pequeño de abajo dice cuántos átomos de ese elemento trae una sola unidad, y el número grande de adelante dice cuántas unidades iguales hay. Uno multiplica al otro.',
             en:'The small number below says how many atoms of that element one single unit brings, and the large number in front says how many identical units there are. One multiplies the other.' },
      exp:{ es:'Una sola unidad de ' + fm(esp.f) + ' trae ' + esp.per + ' átomos de ' + esp.el + ', y el término tiene ' + k + ' unidades iguales. Entonces son ' + k + ' por ' + esp.per + ', es decir ' + corr + ' átomos de ' + esp.el + '.',
            en:'A single unit of ' + fm(esp.f) + ' brings ' + esp.per + ' atoms of ' + esp.el + ', and the term has ' + k + ' identical units. So it is ' + k + ' times ' + esp.per + ', that is ' + corr + ' atoms of ' + esp.el + '.' } };
  }
  var meta = k * esp.per;
  var vals2 = distinctNums([k, meta, esp.per, k + 2]);
  return {
    title:{ es:'El número que hace falta adelante', en:'The number needed in front' },
    showWork:true,
    q:{ es:'Se quiere escribir un término con la fórmula ' + fm(esp.f) + ' que contenga exactamente ' + meta + ' átomos de ' + esp.el + '. ¿Qué número grande hay que poner delante de la fórmula?',
        en:'A term with the formula ' + fm(esp.f) + ' is wanted that contains exactly ' + meta + ' atoms of ' + esp.el + '. Which large number has to be put in front of the formula?' },
    opts:{ es:vals2.map(function(v){ return 'el coeficiente ' + v; }), en:vals2.map(function(v){ return 'coefficient ' + v; }) },
    ci:0,
    hint:{ es:'Averigua primero cuántos átomos de ese elemento trae una sola unidad de la fórmula, y después piensa cuántas unidades iguales hacen falta para llegar a la cantidad pedida.',
           en:'First work out how many atoms of that element one single unit of the formula brings, and then think how many identical units are needed to reach the amount asked for.' },
    exp:{ es:'Cada unidad de ' + fm(esp.f) + ' aporta ' + esp.per + ' átomos de ' + esp.el + '. Para juntar ' + meta + ' hacen falta ' + k + ' unidades, porque ' + k + ' por ' + esp.per + ' da ' + meta + '. El coeficiente correcto es ' + k + ', no la cantidad total de átomos.',
          en:'Each unit of ' + fm(esp.f) + ' contributes ' + esp.per + ' atoms of ' + esp.el + '. To gather ' + meta + ' you need ' + k + ' units, because ' + k + ' times ' + esp.per + ' gives ' + meta + '. The right coefficient is ' + k + ', not the total number of atoms.' } };
}

function mkP7(rng){
  var A = vpick(rng, [0, 1]);
  if (A === 0){
    var m = ri(rng, 45, 90);
    var s = ri(rng, 18, 34);
    var gas = m - s;
    var vals = distinctNums([gas, m + s, m, s]);
    return {
      title:{ es:'Lo que se fue como gas', en:'What left as a gas' },
      showWork:true,
      q:{ es:'Dentro de un recipiente sellado se calientan ' + m + ' g de piedra caliza hasta que se descompone por completo. Al final quedan ' + s + ' g de cal viva sólida y el resto es un gas que no pudo salir. ¿Qué masa tiene ese gas?',
          en:'Inside a sealed container, ' + m + ' g of limestone are heated until it fully breaks down. At the end there are ' + s + ' g of solid quicklime and the rest is a gas that could not get out. What mass does that gas have?' },
      opts:{ es:vals.map(gramos), en:vals.map(gramos) },
      ci:0,
      hint:{ es:'El recipiente está sellado, así que la masa total del final tiene que ser igual a la del principio. Todo lo que ya no es sólido sigue adentro en forma de gas.',
             en:'The container is sealed, so the total mass at the end has to equal the one at the start. Everything that is no longer solid is still inside as a gas.' },
      exp:{ es:'Entraron ' + m + ' g y esa cantidad no puede cambiar dentro de un recipiente sellado. Si la cal viva se lleva ' + s + ' g, al gas le corresponde lo que sobra: ' + m + ' g menos ' + s + ' g, o sea ' + gramos(gas) + '.',
            en:'In went ' + m + ' g and that amount cannot change inside a sealed container. If the quicklime takes ' + s + ' g, the gas gets what is left over: ' + m + ' g minus ' + s + ' g, that is ' + gramos(gas) + '.' } };
  }
  var mg = ri(rng, 24, 48);
  var oxi = ri(rng, 14, 32);
  var prod = mg + oxi;
  var vals2 = distinctNums([oxi, prod, mg, prod + mg]);
  return {
    title:{ es:'El oxígeno que se combinó', en:'The oxygen that combined' },
    showWork:true,
    q:{ es:'Dentro de un frasco sellado se queman ' + mg + ' g de magnesio con el oxígeno que había adentro, y al final se recogen ' + prod + ' g de óxido de magnesio como único producto. ¿Qué masa de oxígeno se combinó con el magnesio?',
        en:'Inside a sealed jar, ' + mg + ' g of magnesium are burned with the oxygen that was inside, and at the end ' + prod + ' g of magnesium oxide are collected as the only product. What mass of oxygen combined with the magnesium?' },
    opts:{ es:vals2.map(gramos), en:vals2.map(gramos) },
    ci:0,
    hint:{ es:'El producto se formó con todo el magnesio y con el oxígeno que se le unió, y en un frasco sellado nada entra ni sale. Compara la masa del producto con la del metal que había al inicio.',
           en:'The product formed with all the magnesium and with the oxygen that joined it, and in a sealed jar nothing goes in or out. Compare the mass of the product with that of the metal there was at the start.' },
    exp:{ es:'El óxido de magnesio pesa ' + prod + ' g y de esa masa ' + mg + ' g vienen del metal, así que el oxígeno aportó ' + prod + ' g menos ' + mg + ' g, es decir ' + gramos(oxi) + '. Ese aumento de masa del sólido es justo la masa del gas que dejó de estar suelto en el frasco.',
          en:'The magnesium oxide weighs ' + prod + ' g and of that mass ' + mg + ' g come from the metal, so the oxygen contributed ' + prod + ' g minus ' + mg + ' g, that is ' + gramos(oxi) + '. That gain in mass of the solid is exactly the mass of the gas that stopped being loose in the jar.' } };
}
