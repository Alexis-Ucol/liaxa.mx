      rcard(L({ es:'Si faltan', en:'If they are missing' }), L({ es:'el proceso falla', en:'the process fails' }), L({ es:'anemia, huesos blandos, encías que sangran', en:'anaemia, soft bones, bleeding gums' })) +
    '</div>' +
    '<div class="callout"><p><strong>' + L({ es:'Ojo: ', en:'Careful: ' }) + '</strong>' + L({
      es:'una bebida puede presumir vitaminas y minerales y seguir siendo, en energía, casi puro azúcar. Lo que aporta cada nutrimento se revisa por separado.',
      en:'a drink can boast vitamins and minerals and still be, in energy terms, almost pure sugar. What each nutrient provides is checked separately.'
    }) + '</p></div>'
  );
  wConsultorio(rng, widgetHost(s3, 'wConsultorio', 'consultorio'));
  addProblem(rng, mkP5(rng));
  addProblem(rng, mkP6(rng));

  /* ══ CONCEPTO 4 ══ */
  var s4 = sec(
    L({ es:'Concepto 4', en:'Concept 4' }),
    L({ es:'Lo que entra contra lo que se mueve', en:'What comes in against how much you move' }),
    '<p>' + L({
      es:'La energía no se crea ni se destruye, y con la de los alimentos pasa lo mismo: la que entra y no se gasta tiene que quedarse en algún lado. Por eso el aporte energético de un menú nunca se juzga solo, sino frente al gasto de quien lo come. Ese gasto tiene dos partes. La primera es el gasto en reposo, la energía que el cuerpo consume solo en mantenerse vivo, con el corazón latiendo, el cerebro trabajando y la temperatura estable; en un adolescente ronda entre 1400 y 1700 kcal al día y ocurre aunque la persona esté sentada. La segunda es la actividad física, que se suma minuto a minuto: caminar rápido gasta alrededor de 5 kcal por minuto, andar en bicicleta cerca de 8 y correr unas 10.',
      en:'Energy is neither created nor destroyed, and with the energy of food it works the same way: what comes in and is not spent has to stay somewhere. That is why the energy contribution of a menu is never judged on its own, but against the expenditure of whoever eats it. That expenditure has two parts. The first is the resting expenditure, the energy the body consumes just staying alive, with the heart beating, the brain working and the temperature steady; in a teenager it runs between 1400 and 1700 kcal a day and it happens even while the person is sitting. The second is physical activity, which adds up minute by minute: brisk walking spends around 5 kcal per minute, cycling close to 8 and running about 10.'
    }) + '</p>' +
    '<p>' + L({
      es:'La comparación entre lo que entra y lo que sale se llama balance de energía. Si entra más de lo que se gasta, el excedente se guarda como reserva de grasa; si entra menos, el cuerpo cubre la diferencia gastando sus reservas; y si las dos cantidades se parecen, el peso se mantiene. Pero la cantidad no lo es todo: también importa de dónde viene esa energía. Se recomienda que alrededor de la mitad venga de carbohidratos, cerca de una cuarta parte de lípidos y el resto de proteínas, y que el menú incluya frutas, verduras y agua simple para cubrir lo que no aporta energía. Un menú puede tener las kcal exactas y aun así fallar si todas vienen del mismo lado.',
      en:'The comparison between what comes in and what goes out is called energy balance. If more comes in than is spent, the excess is stored as a fat reserve; if less comes in, the body covers the difference by spending its reserves; and if the two amounts are alike, weight holds steady. But quantity is not everything: where that energy comes from matters too. It is recommended that around half comes from carbohydrates, close to a quarter from lipids and the rest from proteins, and that the menu includes fruit, vegetables and plain water to cover what provides no energy. A menu can have the exact kcal and still fail if they all come from the same side.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Gasto en reposo', en:'Resting expenditure' }), L({ es:'siempre presente', en:'always there' }), L({ es:'corazón, cerebro, riñones, temperatura', en:'heart, brain, kidneys, temperature' })) +
      rcard(L({ es:'Actividad física', en:'Physical activity' }), L({ es:'kcal por minuto', en:'kcal per minute' }), L({ es:'se suma según el tiempo y la intensidad', en:'it adds up with time and intensity' })) +
      rcard(L({ es:'Entra más de lo que sale', en:'More in than out' }), L({ es:'reserva', en:'reserve' }), L({ es:'el excedente se almacena como grasa', en:'the excess is stored as fat' })) +
      rcard(L({ es:'Entra menos de lo que sale', en:'Less in than out' }), L({ es:'se gasta la reserva', en:'the reserve is spent' }), L({ es:'el cuerpo recurre a lo almacenado', en:'the body turns to what is stored' })) +
    '</div>' +
    '<div class="callout"><p>' + L({
      es:'Dos personas del mismo tamaño pueden necesitar cantidades muy distintas de energía el mismo día. La diferencia no está en el alimento, está en cuánto se movieron.',
      en:'Two people of the same size can need very different amounts of energy on the same day. The difference is not in the food, it is in how much they moved.'
    }) + '</p></div>'
  );
  wBalance(rng, widgetHost(s4, 'wBalance', 'balance'));
  addProblem(rng, mkP7(rng));
  addProblem(rng, mkP8(rng));

  /* ══ CIERRE ══ */
  wCuaderno(rng, widgetHost(null, 'wCuaderno', 'reflect'));
  addProblem(rng, mkP9(rng));
  addProblem(rng, mkP10(rng));
}
</script>

<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbwoSl0opNALX7IT8O9tk7xZoPU9LbrYvZ-n_p9u3R-pUlwi-rVTTfnYRaiKngnsY1QV/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
