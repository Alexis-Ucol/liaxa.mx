<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Degradación y Contaminación en la Comunidad</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:75px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 57px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Degradación y Contaminación en la Comunidad</div>
    <div class="wcourse" id="wcourse-el">Química · 3° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Degradación y Contaminación en la Comunidad</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="sbtn" id="dlBtn" onclick="generatePDF()" style="max-width:280px;margin:0 auto;">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   CENTRALIZED SCHOOL CONFIG (Rule 16) — ships UNBRANDED (Rule 11).
   The ONLY rebranding point. build_all.py substitutes these exact fields
   (BRAND_FIELDS / RGB_FIELDS / logo*) downstream; :root/dark stay as fallback.
   Neutral defaults below == the static :root/dark values, so unbranded == no-op.
   ══════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:'#243c54', primaryDark:'#182a3b', primaryBg:'#eaeef3',
  accent:'#e4243c', accentBg:'#fbdfe2',
  darkPrimary:'#5e85ab', darkPrimaryDark:'#8badce', darkPrimaryBg:'#152331',

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

  //   silently on iPhone/iPad. iOS -> native share sheet (-> "Save to Files"),
  //   with an inline-open fallback; everything else -> <a download> click.

  var _fname   = 'qui3_t05_g01_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf';

  function _openPdfInline(b){
    var u = URL.createObjectURL(b);
    var w = window.open(u, '_blank');
    if (!w) { window.location.href = u; }
    setTimeout(function(){ URL.revokeObjectURL(u); }, 60000);
  }

  var _isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
               (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  if (_isIOS) {
    var _pdfFile = new File([_pdfBlob], _fname, { type:'application/pdf' });
    if (navigator.canShare && navigator.canShare({ files:[_pdfFile] })) {
      navigator.share({ files:[_pdfFile], title:_fname })
        .then(_restorePdfBtn)
        .catch(function(e){
          if (e && e.name === 'AbortError') { _restorePdfBtn(); return; }
          _openPdfInline(_pdfBlob); _restorePdfBtn();
        });
      return;
    }
    _openPdfInline(_pdfBlob); _restorePdfBtn();
    return;
  }

  var _dlUrl = URL.createObjectURL(_pdfBlob);
  var _dlA   = document.createElement('a');
  _dlA.href  = _dlUrl; _dlA.download = _fname;
  document.body.appendChild(_dlA); _dlA.click();
  setTimeout(function(){ document.body.removeChild(_dlA); URL.revokeObjectURL(_dlUrl); }, 200);
  _restorePdfBtn();
}

function opts4(rng, correct, cands, unit){
  var u = unit || '', c0 = r1(correct);
  var out = [c0], pool = shuffle(cands, rng), i, k = 1, c;
  for (i = 0; i < pool.length && out.length < 4; i++){
    c = r1(pool[i]);
    if (c > 0 && out.indexOf(c) === -1) out.push(c);
  }
  while (out.length < 4){
    c = r1(c0 + k);
    if (c > 0 && out.indexOf(c) === -1) out.push(c);
    k++;
  }
  return out.map(function(x){ return fmt(x) + u; });
}

function addProblem(rng, spec){
  var idx = problems.length;
  var correctVal = spec.options[spec.correct];
  var sh = shuffle(spec.options, rng);
  var prob = {
    title: spec.title,
    questionText: spec.q,
    fn: spec.fn || '',
    hint: spec.hint || '',
    explanation: spec.exp || '',
    options: sh,
    correctIdx: sh.indexOf(correctVal),
    showWork: !!spec.showWork,
    studentChoice: null,
    pendingChoice: null
  };
  problems.push(prob);
  buildOneCard(prob, idx);
}

      en:'To move from complaint to diagnosis a shared language is needed: naming which substance was introduced, which part of the environment it entered, in what amount it appears and against which reference it is compared. This guide works on that language and ends where the real work begins, in the design of a project the community can sustain.'

      es:'La degradación ambiental es la pérdida de calidad de un lugar: el suelo que se queda sin cubierta vegetal y se erosiona, el arroyo que se azolva, el terreno que ya no sostiene los cultivos que sostenía. La contaminación es un caso particular de degradación: alguien introduce una sustancia ajena, o eleva la cantidad de una que ya existía, hasta un nivel que altera el funcionamiento del sitio.',
      en:'Environmental degradation is the loss of quality of a place: soil left without plant cover that erodes, a stream that fills with sediment, land that no longer supports the crops it used to support. Pollution is a particular case of degradation: somebody introduces a foreign substance, or raises the amount of one that already existed, to a level that alters how the site works.'
    }) + '</p>' +
    '<p>' + L({
      es:'La diferencia importa porque cambia la respuesta. Ante la erosión se restituye la cubierta; ante una sustancia introducida hay que cortar la fuente. Y ninguna sustancia se queda quieta donde cayó: el aire deposita partículas sobre el suelo, el suelo filtra líquidos hacia el agua subterránea, el agua de riego devuelve al suelo lo que traía disuelto. Indagar una problemática local es seguir esa ruta.',
      en:'The difference matters because it changes the answer. Against erosion you restore the cover; against an introduced substance you have to cut off the source. And no substance stays still where it fell: air deposits particles on soil, soil filters liquids down to groundwater, irrigation water returns to the soil whatever it carried dissolved. Investigating a local problem means following that route.'

      en:'Pollutants act in tiny amounts compared with the sample that contains them, so percentages become awkward for writing them down. That is why parts per million are used: how many parts of the pollutant there are in every million parts of the sample. One part per million is like one grain inside a million identical grains.'

      en:'In water the practical equivalence is direct, because one litre of water has a mass close to a million milligrams: one milligram of substance per litre corresponds to one part per million. In soil the reference is the mass of the dry sample, and one milligram per kilogram also corresponds to one part per million. In air, on the other hand, the comparison is made between volumes of gas, not between masses.'

   El alumno arma la ruta del contaminante tocando compartimentos; la escena de
   tres capas responde al instante y la retroalimentación empuja hacia el eslabón
   que falta en lugar de dar un veredicto.
   ========================================================================== */
function w1(rng, host){
  var R = shuffle(ROUTES, rng).slice(0, 3);
  var rd = 0, tries = 0, locked = false, done = false;
  var c = null, sa = null, sb = null;
  var keys = ['aire', 'agua', 'suelo'];

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Rastreador de rutas', en:'Route tracker' }) + '</div>' +
    '<div class="gw-q">' + L({ es:'Sigue la sustancia de un compartimento al siguiente', en:'Follow the substance from one compartment to the next' }) + '</div>' +
    '<div class="gw-case" data-r="cas"></div>' +
    '<div class="gw-mini" style="margin-top:.6rem">' + L({
      es:'Toca un compartimento para colocarlo en el primer hueco y otro para el segundo. Toca un hueco lleno para vaciarlo y volver a intentarlo.',
      en:'Tap a compartment to place it in the first gap and another one for the second. Tap a filled gap to empty it and try again.'
    }) + '</div>' +
    '<div class="rt-scene">' +
      '<div class="rt-band" data-b="aire">' + L(COMP.aire) + '<span class="rt-tag" data-t="aire"></span></div>' +
      '<div class="rt-band" data-b="agua">' + L(COMP.agua) + '<span class="rt-tag" data-t="agua"></span></div>' +
      '<div class="rt-band" data-b="suelo">' + L(COMP.suelo) + '<span class="rt-tag" data-t="suelo"></span></div>' +
    '</div>' +
    '<div class="rt-slots">' +
      '<div><div class="rt-cap">' + L({ es:'Entra en', en:'Enters' }) + '</div><div class="rt-slot" data-s="a"></div></div>' +
      '<div class="rt-arrow">&#8594;</div>' +
      '<div><div class="rt-cap">' + L({ es:'Termina en', en:'Ends up in' }) + '</div><div class="rt-slot" data-s="b"></div></div>' +
    '</div>' +
    '<div class="gw-lbl">' + L({ es:'Compartimentos', en:'Compartments' }) + '</div>' +
    '<div class="gw-grid" data-r="tiles"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Comprobar', en:'Check' }) + '</button></div>' +
    '<div class="gw-fb"></div>';

  var elCase = host.querySelector('[data-r="cas"]'),
      elTiles = host.querySelector('[data-r="tiles"]'),
      elBtn = host.querySelector('[data-r="chk"]'),
      slotA = host.querySelector('[data-s="a"]'),
      slotB = host.querySelector('[data-s="b"]');

  function label(k){ return k ? L(COMP[k]) : L({ es:'toca aquí', en:'tap here' }); }

  function draw(){
    elCase.innerHTML = L(c.act);
    slotA.textContent = label(sa);
    slotB.textContent = label(sb);
    slotA.className = 'rt-slot' + (sa ? ' full' : '');
    slotB.className = 'rt-slot' + (sb ? ' full' : '');
    keys.forEach(function(k){
      var band = host.querySelector('[data-b="' + k + '"]');
      var tag = host.querySelector('[data-t="' + k + '"]');
      band.className = 'rt-band' + (sa === k ? ' inA' : '') + (sb === k ? ' inB' : '');
      tag.textContent = (sa === k && sb === k) ? L({ es:'entrada y destino', en:'entry and destination' })
        : sa === k ? L({ es:'entrada', en:'entry' })
        : sb === k ? L({ es:'destino', en:'destination' }) : '';
    });
    elTiles.innerHTML = keys.map(function(k){
      return '<button class="gw-tile' + ((sa === k || sb === k) ? ' on' : '') + '" data-k="' + k + '"' +
        ((locked || done) ? ' disabled' : '') + '>' + L(COMP[k]) + '</button>';
    }).join('');
    elTiles.querySelectorAll('.gw-tile').forEach(function(b){
      b.addEventListener('click', function(){ place(b.getAttribute('data-k')); });
    });
  }

  function live(){
    if (!sa && !sb){ say(host, '', L({ es:'Lee la situación y decide por dónde entra la sustancia.', en:'Read the situation and decide where the substance enters.' })); return; }
    if (sa && !sb){
      say(host, '', L({ es:'Dices que entra por el ' + L(COMP[sa]).toLowerCase() + '. Ahora sigue el recorrido: ¿dónde se queda después?',
                        en:'You say it enters through the ' + L(COMP[sa]).toLowerCase() + '. Now follow the path: where does it stay afterwards?' }));
      return;
    }
    if (sa && sb){
      say(host, 'warm', L({ es:'Tu ruta dice: entra por el ' + L(COMP[sa]).toLowerCase() + ' y termina en el ' + L(COMP[sb]).toLowerCase() + '. Comprueba para ver si el recorrido se sostiene.',
                            en:'Your route says: it enters through the ' + L(COMP[sa]).toLowerCase() + ' and ends up in the ' + L(COMP[sb]).toLowerCase() + '. Check to see whether the path holds.' }));
    }
  }

  function place(k){
    if (locked || done) return;
    if (!sa) sa = k; else if (!sb) sb = k; else { sa = k; sb = null; }
    draw(); live();
  }

  slotA.addEventListener('click', function(){ if (locked || done) return; sa = null; draw(); live(); });
  slotB.addEventListener('click', function(){ if (locked || done) return; sb = null; draw(); live(); });

  function close(cls, txt){
    locked = true;
    elBtn.textContent = rd === 2 ? L({ es:'Terminar', en:'Finish' }) : L({ es:'Siguiente caso', en:'Next case' });
    elBtn.className = 'gw-btn solved';
    draw();
    say(host, cls, txt);
  }

  function advance(){
    rd++;
    if (rd >= 3){
      done = true;
      elBtn.textContent = L({ es:'Completado', en:'Completed' });
      elBtn.className = 'gw-btn solved';
      draw();
      say(host, 'good', L({
        es:'Tres rutas seguidas hasta el final. En ninguna se quedó la sustancia donde entró: por eso el diagnóstico de la comunidad revisa aire, agua y suelo aunque la queja hable de uno solo.',
        en:'Three routes followed to the end. In none of them did the substance stay where it entered: that is why a community diagnosis checks air, water and soil even when the complaint mentions only one.'
      }));
      return;
    }
    c = R[rd]; sa = null; sb = null; tries = 0; locked = false;
    elBtn.textContent = L({ es:'Comprobar', en:'Check' });
    elBtn.className = 'gw-btn';
    draw();
    say(host, '', L({ es:'Otro caso del recorrido por la comunidad.', en:'Another case from the walk around the community.' }));
  }

  function check(){
    if (done) return;
    if (locked){ advance(); return; }
    if (!sa || !sb){ say(host, 'warm', L({ es:'Falta completar la ruta: hay que decir por dónde entra y dónde termina.', en:'The route is not complete: you have to say where it enters and where it ends up.' })); return; }
    if (sa === c.a && sb === c.b){
      close('good', L({ es:'Ruta correcta. ' + L(c.why), en:'Correct route. ' + L(c.why) }));
      return;
    }
    tries++;
    if (tries >= 3){
      sa = c.a; sb = c.b;
      close('warm', L({ es:'La ruta era ' + L(COMP[c.a]).toLowerCase() + ' hacia ' + L(COMP[c.b]).toLowerCase() + '. ' + L(c.why),
                        en:'The route was ' + L(COMP[c.a]).toLowerCase() + ' to ' + L(COMP[c.b]).toLowerCase() + '. ' + L(c.why) }));
      return;
    }
    if (sa !== c.a){
      sa = null; sb = null; draw();
      say(host, 'miss', L({ es:'Todavía no es el punto de entrada. Fíjate en dónde cae o se libera la sustancia en el primer momento, antes de moverse.',
                            en:'That is not the entry point yet. Look at where the substance falls or is released in the first moment, before it moves.' }));
      return;
    }
    sb = null; draw();
    say(host, 'miss', L({ es:'La entrada está bien; el destino todavía no. Piensa qué mueve la sustancia desde ahí: la lluvia, el viento, la infiltración o el riego.',
                          en:'The entry is right; the destination is not yet. Think about what moves the substance from there: rain, wind, infiltration or irrigation.' }));
  }

  elBtn.addEventListener('click', check);
  c = R[0];
  draw();
  say(host, '', L({ es:'Lee la situación y arma la ruta con dos toques.', en:'Read the situation and build the route with two taps.' }));
}

/* ==========================================================================
   MANIPULATIVO 2 :: traductor de partes por millón
   La muestra, la masa del contaminante y la lectura en ppm se recalculan a cada
   movimiento del control, con una marca dorada en el valor objetivo.
   ========================================================================== */
function w2(rng, host){
  var R = shuffle(PPMC, rng).slice(0, 3);
  var rd = 0, tries = 0, locked = false, done = false;
  var c = null, cur = 0, maxMg = 0, i;
  var pos = [];
  for (i = 0; i < 28; i++) pos.push([6 + Math.floor(rng() * 100), 6 + Math.floor(rng() * 88)]);

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Traductor de partes por millón', en:'Parts per million translator' }) + '</div>' +
    '<div class="gw-q" data-r="ttl"></div>' +
    '<div class="gw-mini">' + L({
      es:'Mueve el control y observa cómo cambia la lectura del laboratorio. Detente cuando la lectura coincida con el valor que pide el reporte.',
      en:'Move the control and watch how the laboratory reading changes. Stop when the reading matches the value the report asks for.'
    }) + '</div>' +
    '<div class="cv-wrap">' +
      '<div class="cv-jar" data-r="jar"></div>' +
      '<div class="cv-side">' +
        '<div class="gw-lbl" data-r="ctl"></div>' +
        '<input class="gw-rng" type="range" min="0" max="10" step="1" value="0" data-r="rng">' +
        '<div class="cv-bar"><i data-r="bar" style="width:0%"></i><span class="cv-tick" data-r="tick" style="left:0%"></span></div>' +
        '<div class="cv-note" data-r="note"></div>' +
      '</div>' +
    '</div>' +
    '<div class="gw-read" data-r="read"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Comprobar', en:'Check' }) + '</button></div>' +
    '<div class="gw-fb"></div>';

  var elT = host.querySelector('[data-r="ttl"]'),
      elJ = host.querySelector('[data-r="jar"]'),
      elC = host.querySelector('[data-r="ctl"]'),
      elR = host.querySelector('[data-r="rng"]'),
      elBar = host.querySelector('[data-r="bar"]'),
      elTk = host.querySelector('[data-r="tick"]'),
      elN = host.querySelector('[data-r="note"]'),
      elD = host.querySelector('[data-r="read"]'),
      elB = host.querySelector('[data-r="chk"]');

  function ppm(){ return cur / c.size; }
  function target(){ return c.p * c.size; }

  function roundData(){
    maxMg = target() * 2;
    var f = pk(rng, [0.25, 0.4, 0.5, 1.5, 1.75]);
    cur = Math.round(target() * f / c.step) * c.step;
    if (cur === target()) cur = Math.max(0, target() - c.step);
    tries = 0; locked = false;
    elR.min = '0'; elR.max = String(maxMg); elR.step = String(c.step); elR.value = String(cur);
  }

  function draw(){
    var nd = Math.round(28 * cur / maxMg);
    var dots = '';
    for (var k = 0; k < nd; k++){
      dots += '<div class="cv-dot" style="left:' + pos[k][0] + 'px;bottom:' + pos[k][1] + 'px"></div>';
    }
    elJ.innerHTML = '<div class="' + (c.med === 'agua' ? 'cv-liq' : 'cv-soil') + '"></div>' + dots;
    elT.innerHTML = L(c.place) + '  ·  ' + L({ es:'lectura pedida ', en:'requested reading ' }) + c.p + ' ppm ' +
      L({ es:'de ', en:'of ' }) + L(c.sub);
    elC.innerHTML = L({ es:'Masa de ', en:'Mass of ' }) + L(c.sub) + ': <span class="gw-val">' + cur + ' ' + c.su + '</span>  ·  ' +
      L({ es:'muestra fija de ', en:'fixed sample of ' }) + '<span class="gw-val">' + c.size + ' ' + c.unit + '</span>';
    elBar.style.width = Math.min(100, cur / maxMg * 100) + '%';
    elTk.style.left = Math.min(100, target() / maxMg * 100) + '%';
    elN.innerHTML = c.med === 'agua'
      ? L({ es:'La marca dorada señala la lectura pedida. En agua, 1 mg por litro se informa como 1 ppm.',
            en:'The gold mark shows the requested reading. In water, 1 mg per litre is reported as 1 ppm.' })
      : L({ es:'La marca dorada señala la lectura pedida. En suelo, 1 mg por kilogramo se informa como 1 ppm.',
            en:'The gold mark shows the requested reading. In soil, 1 mg per kilogram is reported as 1 ppm.' });
    elD.innerHTML =
      '<div class="gw-rd"><div class="k">' + L({ es:'Contaminante', en:'Pollutant' }) + '</div><div class="v">' + cur + ' ' + c.su + '</div></div>' +
      '<div class="gw-rd"><div class="k">' + L({ es:'Muestra', en:'Sample' }) + '</div><div class="v">' + c.size + ' ' + c.unit + '</div></div>' +
      '<div class="gw-rd"><div class="k">' + L({ es:'Lectura', en:'Reading' }) + '</div><div class="v">' + fmt(ppm()) + ' ppm</div></div>';
    elR.disabled = locked || done;
  }

  function close(cls, txt){
    locked = true;
    elB.textContent = rd === 2 ? L({ es:'Terminar', en:'Finish' }) : L({ es:'Siguiente muestra', en:'Next sample' });
    elB.className = 'gw-btn solved';
    draw();
    say(host, cls, txt);
  }

  function advance(){
    rd++;
    if (rd >= 3){
      done = true;
      elB.textContent = L({ es:'Completado', en:'Completed' });
      elB.className = 'gw-btn solved';
      draw();
      say(host, 'good', L({
        es:'Tres muestras traducidas. La lectura en partes por millón nunca depende solo de la masa del contaminante: depende de con cuánta muestra se compara.',
        en:'Three samples translated. The reading in parts per million never depends on the mass of the pollutant alone: it depends on how much sample it is compared with.'
      }));
      return;
    }
    c = R[rd];
    roundData();
    elB.textContent = L({ es:'Comprobar', en:'Check' });
    elB.className = 'gw-btn';
    draw();
    say(host, '', L({ es:'Llega otra muestra al laboratorio.', en:'Another sample arrives at the laboratory.' }));
  }

  function check(){
    if (done) return;
    if (locked){ advance(); return; }
    var d = ppm() - c.p;
    if (Math.abs(d) < 0.001){
      close('good', L({
        es:'Coincide. Con ' + cur + ' ' + c.su + ' repartidos en ' + c.size + ' ' + c.unit + ' de muestra, cada ' + (c.med === 'agua' ? 'litro' : 'kilogramo') + ' lleva ' + fmt(ppm()) + ' ' + c.su + ', es decir ' + c.p + ' ppm.',
        en:'It matches. With ' + cur + ' ' + c.su + ' spread through ' + c.size + ' ' + c.unit + ' of sample, each ' + (c.med === 'agua' ? 'litre' : 'kilogram') + ' carries ' + fmt(ppm()) + ' ' + c.su + ', that is ' + c.p + ' ppm.'
      }));
      return;
    }
    tries++;
    if (tries >= 3){
      cur = target();
      elR.value = String(cur);
      close('warm', L({
        es:'La masa que produce esa lectura es ' + target() + ' ' + c.su + ': repartida en ' + c.size + ' ' + c.unit + ' deja ' + c.p + ' ' + c.su + ' en cada ' + (c.med === 'agua' ? 'litro' : 'kilogramo') + '.',
        en:'The mass that produces that reading is ' + target() + ' ' + c.su + ': spread through ' + c.size + ' ' + c.unit + ' it leaves ' + c.p + ' ' + c.su + ' in each ' + (c.med === 'agua' ? 'litre' : 'kilogram') + '.'
      }));
      return;
    }
    say(host, 'miss', d > 0
      ? L({ es:'La lectura va ' + fmt(d) + ' ppm arriba de lo pedido: quita contaminante de la muestra.',
            en:'The reading is ' + fmt(d) + ' ppm above the request: take pollutant out of the sample.' })
      : L({ es:'Faltan ' + fmt(-d) + ' ppm para la lectura pedida: agrega contaminante a la muestra.',
            en:'You are ' + fmt(-d) + ' ppm short of the requested reading: add pollutant to the sample.' }));
  }

  elR.addEventListener('input', function(){
    if (locked || done) return;
    cur = parseInt(elR.value, 10);
    draw();
    var d = ppm() - c.p;
    if (Math.abs(d) < 0.001){
      say(host, 'warm', L({ es:'La lectura ya marca el valor pedido. Comprueba para confirmarlo.', en:'The reading already shows the requested value. Check to confirm it.' }));
    } else if (d > 0){
      say(host, '', L({ es:'Vas ' + fmt(d) + ' ppm de más. La muestra no cambió de tamaño, solo el contenido.',
                        en:'You are ' + fmt(d) + ' ppm over. The sample did not change size, only its content.' }));
    } else {
      say(host, '', L({ es:'Vas ' + fmt(-d) + ' ppm de menos. La muestra no cambió de tamaño, solo el contenido.',
                        en:'You are ' + fmt(-d) + ' ppm under. The sample did not change size, only its content.' }));
    }
  });
  elB.addEventListener('click', check);
  c = R[0];
  roundData();
  draw();
  say(host, '', L({ es:'Mueve el control y observa las tres lecturas al mismo tiempo.', en:'Move the control and watch the three readings at the same time.' }));
}

/* ==========================================================================
   MANIPULATIVO 3 :: tablero de monitoreo
   Cada estación se marca o se desmarca con un toque; la barra y la línea dorada
   de la referencia muestran al instante qué tan lejos está cada lectura.
   ========================================================================== */
function w3(rng, host){
  var R = shuffle(MON, rng).slice(0, 3);
  var rd = 0, tries = 0, locked = false, done = false;
  var c = null, marks = [];

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Tablero de monitoreo', en:'Monitoring board' }) + '</div>' +
    '<div class="gw-q" data-r="ttl"></div>' +
    '<div class="gw-mini">' + L({
      es:'Toca cada estación que rebase el valor de referencia. Toca otra vez para quitar la marca.',
      en:'Tap every station that goes above the reference value. Tap again to remove the mark.'
    }) + '</div>' +
    '<div class="mb-head"><span data-r="use"></span><span data-r="lim"></span></div>' +
    '<div data-r="rows"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Comprobar', en:'Check' }) + '</button></div>' +
    '<div class="gw-fb"></div>';

  var elT = host.querySelector('[data-r="ttl"]'),
      elU = host.querySelector('[data-r="use"]'),
      elL = host.querySelector('[data-r="lim"]'),
      elR = host.querySelector('[data-r="rows"]'),
      elB = host.querySelector('[data-r="chk"]');

  function over(i){ return c.rows[i].v > c.limit; }

  function draw(reveal){
    elT.innerHTML = L(c.sub);
    elU.innerHTML = L({ es:'Uso: ', en:'Use: ' }) + L(c.use);
    elL.innerHTML = L({ es:'Referencia: ', en:'Reference: ' }) + '<span class="gw-val">' + fmt(c.limit) + c.unit + '</span>';
    elR.innerHTML = c.rows.map(function(r, i){
      var cls = 'mb-row' + (reveal ? (over(i) ? ' good' : '') : (marks[i] ? ' mark' : ''));
      var w = Math.min(100, r.v / c.scale * 100);
      var lw = Math.min(100, c.limit / c.scale * 100);
      return '<div class="' + cls + '" data-i="' + i + '">' +
          '<div><div class="mb-name">' + L(r.n) + '</div>' +
            '<div class="mb-track"><span class="mb-fill" style="width:' + w + '%"></span><span class="mb-lim" style="left:' + lw + '%"></span></div>' +
          '</div>' +
          '<div class="mb-val">' + fmt(r.v) + c.unit +
            '<span class="mb-st">' + (reveal ? (over(i) ? L({ es:'rebasa', en:'above' }) : L({ es:'cumple', en:'within' }))
              : (marks[i] ? L({ es:'marcada', en:'marked' }) : L({ es:'sin marca', en:'unmarked' }))) + '</span>' +
          '</div>' +
        '</div>';
    }).join('');
    if (!locked && !done){
      elR.querySelectorAll('.mb-row').forEach(function(row){
        row.addEventListener('click', function(){ toggle(parseInt(row.getAttribute('data-i'), 10)); });
      });
    }
  }

  function live(){
    var n = marks.filter(Boolean).length;
    if (n === 0){ say(host, '', L({ es:'Compara cada lectura con la línea dorada de la referencia antes de marcar.', en:'Compare each reading with the gold reference line before marking.' })); return; }
    say(host, '', L({ es:'Llevas ' + n + ' estación(es) marcada(s). Revisa las que quedan cerca de la línea antes de comprobar.',
                      en:'You have ' + n + ' station(s) marked. Check the ones that sit close to the line before confirming.' }));
  }

  function toggle(i){
    if (locked || done) return;
    marks[i] = !marks[i];
    draw(false); live();
  }

  function close(cls, txt, reveal){
    locked = true;
    elB.textContent = rd === 2 ? L({ es:'Terminar', en:'Finish' }) : L({ es:'Siguiente tablero', en:'Next board' });
    elB.className = 'gw-btn solved';
    draw(reveal);
    say(host, cls, txt);
  }

  function advance(){
    rd++;
    if (rd >= 3){
      done = true;
      elB.textContent = L({ es:'Completado', en:'Completed' });
      elB.className = 'gw-btn solved';
      draw(true);
      say(host, 'good', L({
        es:'Tres tableros ordenados. Ninguna lectura se calificó por sí sola: cada una se comparó con la referencia del uso que se le da a ese sitio.',
        en:'Three boards sorted out. No reading was judged on its own: each one was compared with the reference for the use given to that site.'
      }));
      return;
    }
    c = R[rd]; marks = c.rows.map(function(){ return false; });
    tries = 0; locked = false;
    elB.textContent = L({ es:'Comprobar', en:'Check' });
    elB.className = 'gw-btn';
    draw(false);
    say(host, '', L({ es:'Llega otra tanda de mediciones al expediente.', en:'Another batch of measurements arrives for the file.' }));
  }

  function check(){
    if (done) return;
    if (locked){ advance(); return; }
    var missing = [], extra = [], i;
    for (i = 0; i < c.rows.length; i++){
      if (over(i) && !marks[i]) missing.push(i);
      if (!over(i) && marks[i]) extra.push(i);
    }
    if (!missing.length && !extra.length){
      close('good', L({
        es:'Tablero correcto. Las estaciones marcadas superan ' + fmt(c.limit) + c.unit + ', que es la referencia para ' + L(c.use) + '.',
        en:'Board correct. The marked stations go above ' + fmt(c.limit) + c.unit + ', which is the reference for ' + L(c.use) + '.'
      }), true);
      return;
    }
    tries++;
    if (tries >= 3){
      close('warm', L({
        es:'Así queda el tablero: rebasan la referencia las estaciones con lectura mayor que ' + fmt(c.limit) + c.unit + ', sin importar qué tan cerca estén de ella.',
        en:'This is how the board ends up: the stations above the reference are those reading more than ' + fmt(c.limit) + c.unit + ', no matter how close to it they sit.'
      }), true);
      return;
    }
    if (extra.length){
      var e = c.rows[extra[0]];
      marks[extra[0]] = false;
      draw(false);
      say(host, 'miss', L({
        es:L(e.n) + ' mide ' + fmt(e.v) + c.unit + ' y la referencia es ' + fmt(c.limit) + c.unit + ': está por debajo, así que le quité la marca. Revisa las demás con el mismo criterio.',
        en:L(e.n) + ' reads ' + fmt(e.v) + c.unit + ' and the reference is ' + fmt(c.limit) + c.unit + ': it is below, so I removed its mark. Review the others with the same criterion.'
      }));
      return;
    }
    say(host, 'miss', L({
      es:'Falta(n) ' + missing.length + ' estación(es) por marcar. Busca las barras que pasan la línea dorada, aunque la pasen por poco.',
      en:missing.length + ' station(s) are still unmarked. Look for the bars that cross the gold line, even if they cross it barely.'
    }));
  }

  elB.addEventListener('click', check);
  c = R[0]; marks = c.rows.map(function(){ return false; });
  draw(false);
  say(host, '', L({ es:'Compara cada barra con la línea dorada y marca las que la rebasen.', en:'Compare each bar with the gold line and mark the ones that cross it.' }));
}

/* ==========================================================================
   MANIPULATIVO 4 :: cadena de causa y efecto
   Los eslabones se colocan y se retiran con un toque; al comprobar, la respuesta
   señala el eslabón que no corresponde a su papel en la cadena.
   ========================================================================== */
function w4(rng, host){
  var R = shuffle(CHAINS, rng).slice(0, 3);
  var rd = 0, tries = 0, locked = false, done = false;
  var c = null, pool = [], slots = [null, null, null, null];
  var ROLE = [
    { es:'Fuente', en:'Source' },
    { es:'Ruta', en:'Route' },
    { es:'Dónde se queda', en:'Where it stays' },
    { es:'Consecuencia', en:'Consequence' }
  ];

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Cadena de causa y efecto', en:'Cause and effect chain' }) + '</div>' +
    '<div class="gw-q" data-r="ttl"></div>' +
    '<div class="gw-case" data-r="cas"></div>' +
    '<div class="gw-mini" style="margin-top:.6rem">' + L({
      es:'Toca un enunciado para colocarlo en el siguiente eslabón vacío. Toca un eslabón lleno para devolver el enunciado a la lista.',
      en:'Tap a statement to place it in the next empty link. Tap a filled link to send the statement back to the list.'
    }) + '</div>' +
    '<div class="ch-chain" data-r="chain"></div>' +
    '<div class="ch-step">' + L({ es:'Enunciados por colocar', en:'Statements to place' }) + '</div>' +
    '<div class="gw-grid wide" data-r="pool"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Comprobar', en:'Check' }) + '</button></div>' +
    '<div class="gw-fb"></div>';

  var elT = host.querySelector('[data-r="ttl"]'),
      elCase = host.querySelector('[data-r="cas"]'),
      elCh = host.querySelector('[data-r="chain"]'),
      elP = host.querySelector('[data-r="pool"]'),
      elB = host.querySelector('[data-r="chk"]');

  function draw(mark){
    elT.innerHTML = L({ es:'Ordena el recorrido que va de la fuente a la consecuencia', en:'Put in order the path that goes from the source to the consequence' });
    elCase.innerHTML = L(c.case);
    elCh.innerHTML = slots.map(function(v, i){
      var cls = 'ch-slot' + (v !== null ? ' full' : '');
      if (mark && v !== null) cls += (v === i ? ' ok' : ' bad');
      return '<div class="' + cls + '" data-i="' + i + '">' +
        '<span class="ch-n">' + (i + 1) + '</span>' +
        '<span>' + (v !== null ? L(c.steps[v]) : L(ROLE[i]) + ': ' + L({ es:'toca un enunciado', en:'tap a statement' })) + '</span></div>';
    }).join('');
    elP.innerHTML = pool.map(function(v){
      return '<button class="gw-tile" data-v="' + v + '"' + ((locked || done) ? ' disabled' : '') + '>' + L(c.steps[v]) + '</button>';
    }).join('');
    if (!locked && !done){
      elCh.querySelectorAll('.ch-slot').forEach(function(s){
        s.addEventListener('click', function(){ pull(parseInt(s.getAttribute('data-i'), 10)); });
      });
      elP.querySelectorAll('.gw-tile').forEach(function(b){
        b.addEventListener('click', function(){ push(parseInt(b.getAttribute('data-v'), 10)); });
      });
    }
  }

  function live(){
    var n = slots.filter(function(v){ return v !== null; }).length;
    if (n === 0){ say(host, '', L({ es:'Empieza por la fuente: el enunciado que dice quién libera la sustancia.', en:'Start with the source: the statement that says who releases the substance.' })); return; }
    if (n < 4){ say(host, '', L({ es:'Llevas ' + n + ' de 4 eslabones. Sigue el recorrido en el orden en que ocurren las cosas.',
                                  en:'You have ' + n + ' of 4 links. Follow the path in the order in which things happen.' })); return; }
    say(host, 'warm', L({ es:'La cadena está completa. Comprueba para ver si cada eslabón hace lo que le toca.',
                          en:'The chain is complete. Check to see whether each link does what it should.' }));
  }

  function push(v){
    if (locked || done) return;
    var i = slots.indexOf(null);
    if (i === -1) return;
    slots[i] = v;
    pool = pool.filter(function(x){ return x !== v; });
    draw(false); live();
  }

  function pull(i){
    if (locked || done) return;
    if (slots[i] === null) return;
    pool.push(slots[i]);
    pool.sort(function(a, b){ return a - b; });
    slots[i] = null;
    draw(false); live();
  }

  function close(cls, txt, mark){
    locked = true;
    elB.textContent = rd === 2 ? L({ es:'Terminar', en:'Finish' }) : L({ es:'Siguiente cadena', en:'Next chain' });
    elB.className = 'gw-btn solved';
    draw(mark);
    say(host, cls, txt);
  }

  function reset(){
    pool = [0, 1, 2, 3];
    slots = [null, null, null, null];
    pool = shuffle(pool, rng);
  }

  function advance(){
    rd++;
    if (rd >= 3){
      done = true;
      elB.textContent = L({ es:'Completado', en:'Completed' });
      elB.className = 'gw-btn solved';
      draw(true);
      say(host, 'good', L({
        es:'Tres cadenas completas. En las tres, la acción que resuelve de verdad está en el primer eslabón: lo demás ya ocurrió.',
        en:'Three complete chains. In all three, the action that really solves things sits in the first link: everything else has already happened.'
      }));
      return;
    }
    c = R[rd]; reset(); tries = 0; locked = false;
    elB.textContent = L({ es:'Comprobar', en:'Check' });
    elB.className = 'gw-btn';
    draw(false);
    say(host, '', L({ es:'Otro expediente por ordenar.', en:'Another file to put in order.' }));
  }

  function check(){
    if (done) return;
    if (locked){ advance(); return; }
    if (slots.indexOf(null) !== -1){ say(host, 'warm', L({ es:'La cadena todavía tiene eslabones vacíos.', en:'The chain still has empty links.' })); return; }
    var bad = -1, i;
    for (i = 0; i < 4; i++){ if (slots[i] !== i){ bad = i; break; } }
    if (bad === -1){
      close('good', L({
        es:'Cadena correcta. La fuente libera, la ruta transporta, el sitio de acumulación retiene y solo al final aparece la consecuencia.',
        en:'Correct chain. The source releases, the route carries, the place of accumulation holds and only at the end does the consequence appear.'
      }), true);
      return;
    }
    tries++;
    if (tries >= 3){
      slots = [0, 1, 2, 3]; pool = [];
      close('warm', L({
        es:'Así queda la cadena de este caso. Cada eslabón responde a una pregunta distinta: quién libera, cómo viaja, dónde se queda y a quién afecta.',
        en:'This is how the chain of this case ends up. Each link answers a different question: who releases, how it travels, where it stays and whom it affects.'
      }), true);
      return;
    }
    var back = slots[bad];
    slots[bad] = null;
    pool.push(back); pool.sort(function(a, b){ return a - b; });
    draw(false);
    var tip = bad === 0 ? L({ es:'El primer eslabón nombra la práctica que libera la sustancia, no sus efectos.', en:'The first link names the practice that releases the substance, not its effects.' })
      : bad === 1 ? L({ es:'El segundo eslabón explica cómo se mueve la sustancia: lluvia, viento, corriente o infiltración.', en:'The second link explains how the substance moves: rain, wind, current or infiltration.' })
      : bad === 2 ? L({ es:'El tercer eslabón dice dónde se queda retenida antes de afectar a alguien.', en:'The third link says where it stays held before affecting anyone.' })
      : L({ es:'El último eslabón describe a quién o a qué termina afectando.', en:'The last link describes whom or what it ends up affecting.' });
    say(host, 'miss', L({ es:'El eslabón ' + (bad + 1) + ' todavía no corresponde. ' + tip, en:'Link ' + (bad + 1) + ' does not fit yet. ' + tip }));
  }

  elB.addEventListener('click', check);
  c = R[0]; reset();
  draw(false);
  say(host, '', L({ es:'Coloca los cuatro enunciados en el orden en que ocurren.', en:'Place the four statements in the order in which they happen.' }));
}

/* ==========================================================================
   MANIPULATIVO 5 :: mesa del proyecto comunitario
   Cada propuesta enciende sus tres indicadores al tocarla; el alumno explora y
   elige la que cumple los tres al mismo tiempo.
   ========================================================================== */
function w5(rng, host){
  var R = shuffle(PROJ, rng).slice(0, 3);
  var rd = 0, tries = 0, locked = false, done = false;
  var c = null, acts = [], sel = -1, seen = [];

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Mesa del proyecto', en:'Project table' }) + '</div>' +
    '<div class="gw-q">' + L({ es:'Elige la acción que cumple los tres indicadores', en:'Choose the action that meets the three indicators' }) + '</div>' +
    '<div class="gw-case" data-r="cas"></div>' +
    '<div class="gw-mini" style="margin-top:.6rem">' + L({
      es:'Toca una propuesta para revisarla: se encienden sus tres indicadores. Toca otra cuando quieras cambiar de opinión.',
      en:'Tap a proposal to review it: its three indicators light up. Tap another one whenever you want to change your mind.'
    }) + '</div>' +
    '<div class="gw-grid wide" data-r="acts" style="margin-top:.7rem"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Elegir esta acción', en:'Choose this action' }) + '</button></div>' +
    '<div class="gw-fb"></div>';

  var elCase = host.querySelector('[data-r="cas"]'),
      elA = host.querySelector('[data-r="acts"]'),
      elB = host.querySelector('[data-r="chk"]');

  var LB = { p:{ es:'Previene en la fuente', en:'Prevents at the source' },
             f:{ es:'Factible', en:'Feasible' },
             s:{ es:'Sostenible', en:'Sustainable' } };

  function lamps(a){
    return ['p', 'f', 's'].map(function(k){
      return '<span class="pj-lamp ' + (a[k] ? 'yes' : 'no') + '">' + L(LB[k]) + '</span>';
    }).join('');
  }

  function draw(reveal){
    elCase.innerHTML = '<strong>' + L({ es:'Diagnóstico: ', en:'Diagnosis: ' }) + '</strong>' + L(c.diag);
    elA.innerHTML = acts.map(function(a, i){
      var cls = 'pj-card' + (sel === i ? ' on' : '') + (reveal && a.p && a.f && a.s ? ' ok' : '');
      return '<div class="' + cls + '" data-i="' + i + '">' +
        '<div class="pj-txt">' + L(a.t) + '</div>' +
        ((seen[i] || reveal) ? '<div class="pj-lamps">' + lamps(a) + '</div>' : '') +
        '</div>';
    }).join('');
    if (!locked && !done){
      elA.querySelectorAll('.pj-card').forEach(function(card){
        card.addEventListener('click', function(){ tap(parseInt(card.getAttribute('data-i'), 10)); });
      });
    }
  }

  function tap(i){
    if (locked || done) return;
    sel = i; seen[i] = true;
    draw(false);
    var a = acts[i];
    if (a.p && a.f && a.s){
      say(host, 'warm', L({ es:'Esta propuesta enciende los tres indicadores. Si te convence, elígela.',
                            en:'This proposal lights up the three indicators. If it convinces you, choose it.' }));
      return;
    }
    var falta = !a.p ? L({ es:'no actúa sobre la fuente, solo sobre lo que ya se liberó', en:'it does not act on the source, only on what was already released' })
      : !a.f ? L({ es:'no es factible con los recursos que hay ahora', en:'it is not feasible with the resources available now' })
      : L({ es:'no se sostiene una vez que pase el entusiasmo inicial', en:'it does not hold up once the initial enthusiasm passes' });
    say(host, '', L({ es:'Revisa el indicador apagado: ' + falta + '. Prueba otra propuesta.',
                      en:'Look at the indicator that is off: ' + falta + '. Try another proposal.' }));
  }

  function close(cls, txt){
    locked = true;
    elB.textContent = rd === 2 ? L({ es:'Terminar', en:'Finish' }) : L({ es:'Siguiente diagnóstico', en:'Next diagnosis' });
    elB.className = 'gw-btn solved';
    draw(true);
    say(host, cls, txt);
  }

  function advance(){
    rd++;
    if (rd >= 3){
      done = true;
      elB.textContent = L({ es:'Completado', en:'Completed' });
      elB.className = 'gw-btn solved';
      draw(true);
      say(host, 'good', L({
        es:'Tres proyectos armados. En los tres la acción elegida corta el problema en su origen y la comunidad puede sostenerla con lo que ya tiene.',
        en:'Three projects put together. In all three the chosen action cuts the problem at its origin and the community can keep it going with what it already has.'
      }));
      return;
    }
    c = R[rd]; acts = shuffle(c.acts, rng); sel = -1; seen = acts.map(function(){ return false; });
    tries = 0; locked = false;
    elB.textContent = L({ es:'Elegir esta acción', en:'Choose this action' });
    elB.className = 'gw-btn';
    draw(false);
    say(host, '', L({ es:'Otro diagnóstico llega a la mesa.', en:'Another diagnosis arrives at the table.' }));
  }

  function check(){
    if (done) return;
    if (locked){ advance(); return; }
    if (sel === -1){ say(host, 'warm', L({ es:'Todavía no hay ninguna propuesta seleccionada.', en:'No proposal has been selected yet.' })); return; }
    var a = acts[sel];
    if (a.p && a.f && a.s){
      close('good', L({
        es:'Buena elección. Actúa en la fuente, se puede hacer con lo que hay y sigue funcionando con el tiempo, que son los tres filtros de un proyecto comunitario.',
        en:'Good choice. It acts at the source, it can be done with what is available and it keeps working over time, which are the three filters of a community project.'
      }));
      return;
    }
    tries++;
    if (tries >= 3){
      close('warm', L({
        es:'La propuesta marcada es la única que enciende los tres indicadores. Las demás fallan en al menos uno, y ese hueco es el que hace que el problema regrese.',
        en:'The highlighted proposal is the only one that lights up all three indicators. The others fail in at least one, and that gap is what makes the problem come back.'
      }));
      return;
    }
    var falta = !a.p ? L({ es:'esta acción atiende lo que ya se liberó, no lo que sigue liberándose', en:'this action deals with what was already released, not with what keeps being released' })
      : !a.f ? L({ es:'esta acción pide recursos que la comunidad no tiene ahora', en:'this action asks for resources the community does not have now' })
      : L({ es:'esta acción depende de que alguien la repita a diario sin apoyo', en:'this action depends on somebody repeating it daily with no support' });
    say(host, 'miss', L({ es:'Todavía no. ' + falta + '. Busca la que encienda los tres indicadores.',
                          en:'Not yet. ' + falta + '. Look for the one that lights up all three indicators.' }));
  }

  elB.addEventListener('click', check);
  c = R[0]; acts = shuffle(c.acts, rng); seen = acts.map(function(){ return false; });
  draw(false);
  say(host, '', L({ es:'Revisa las propuestas una por una antes de decidir.', en:'Review the proposals one by one before deciding.' }));
}

function fromVariants(rng, V){
  var v = V[Math.floor(rng() * V.length)];
  return { title:L(v.title), q:L(v.q), fn:'', options:L(v.opts), correct:v.ci, hint:L(v.hint), exp:L(v.exp), showWork:false };
}

function mkP4(rng){
  var s = Math.floor(rng() * 3);
  if (s === 0){
    var A = pk(rng, [[12, 4, 3], [10, 5, 2], [18, 6, 3], [20, 4, 5], [24, 8, 3], [15, 3, 5]]);
    var m = A[0], V = A[1], v = A[2];
    return {
      title:L({ es:'La muestra del pozo', en:'The sample from the well' }),
      q:L({ es:'El laboratorio analizó una muestra de ' + V + ' L de agua del pozo comunitario y encontró en ella ' + m + ' mg de nitratos. ¿Qué concentración debe anotarse en el expediente del proyecto?',
            en:'The laboratory analysed a sample of ' + V + ' L of water from the community well and found ' + m + ' mg of nitrates in it. What concentration should be recorded in the project file?' }),
      fn:'',
      options:opts4(rng, v, [v * 2, v / 2, m - V, m + V], ' ppm'),
      correct:0,
      hint:L({ es:'En agua la lectura se informa por cada litro de muestra, y 1 mg por litro corresponde a 1 ppm.',
               en:'In water the reading is reported per litre of sample, and 1 mg per litre corresponds to 1 ppm.' }),
      exp:L({ es:'Los ' + m + ' mg están repartidos en ' + V + ' L, así que en cada litro hay ' + m + ' ÷ ' + V + ' = ' + v + ' mg, y en agua eso se informa como ' + v + ' ppm. Resultado: = ' + v,
              en:'The ' + m + ' mg are spread through ' + V + ' L, so in each litre there are ' + m + ' ÷ ' + V + ' = ' + v + ' mg, and in water that is reported as ' + v + ' ppm. Result: = ' + v }),
      showWork:true
    };
  }
  if (s === 1){
    var B = pk(rng, [[50, 10, 5], [80, 20, 4], [36, 6, 6], [45, 9, 5], [120, 15, 8]]);
    var mb = B[0], M = B[1], vb = B[2];
    return {
      title:L({ es:'El suelo del patio', en:'The soil of the yard' }),
      q:L({ es:'Se secaron y analizaron ' + M + ' kg de suelo del patio de la escuela y se hallaron ' + mb + ' mg de plomo en esa muestra. ¿Qué concentración corresponde anotar en el expediente?',
            en:'A sample of ' + M + ' kg of soil from the school yard was dried and analysed, and ' + mb + ' mg of lead were found in it. What concentration should be recorded in the file?' }),
      fn:'',
      options:opts4(rng, vb, [vb * 2, vb / 2, mb - M, mb / 2], ' ppm'),
      correct:0,
      hint:L({ es:'En suelo la lectura se informa por cada kilogramo de muestra seca, y 1 mg por kilogramo corresponde a 1 ppm.',
               en:'In soil the reading is reported per kilogram of dry sample, and 1 mg per kilogram corresponds to 1 ppm.' }),
      exp:L({ es:'Los ' + mb + ' mg están repartidos en ' + M + ' kg, así que cada kilogramo lleva ' + mb + ' ÷ ' + M + ' = ' + vb + ' mg, es decir ' + vb + ' ppm. Resultado: = ' + vb,
              en:'The ' + mb + ' mg are spread through ' + M + ' kg, so each kilogram carries ' + mb + ' ÷ ' + M + ' = ' + vb + ' mg, that is ' + vb + ' ppm. Result: = ' + vb }),
      showWork:true
    };
  }
  var C = pk(rng, [[2, 20, 40], [3, 10, 30], [2, 5, 10], [4, 10, 40], [3, 20, 60]]);
  var p = C[0], Vc = C[1], mc = C[2];
  return {
    title:L({ es:'El garrafón de la escuela', en:'The water jug at school' }),
    q:L({ es:'El reporte del agua que llega a la escuela indica ' + p + ' ppm de fluoruros. ¿Cuántos miligramos de fluoruros contiene un garrafón de ' + Vc + ' L de esa misma agua?',
          en:'The report of the water that arrives at the school indicates ' + p + ' ppm of fluorides. How many milligrams of fluorides does a ' + Vc + ' L jug of that same water contain?' }),
    fn:'',
    options:opts4(rng, mc, [p + Vc, mc / 2, Vc / p, mc * 2], ' mg'),
    correct:0,
    hint:L({ es:'Cada litro de esa agua lleva la misma cantidad; el garrafón tiene varios litros de la misma agua.',
             en:'Every litre of that water carries the same amount; the jug holds several litres of the same water.' }),
    exp:L({ es:'Cada litro contiene ' + p + ' mg, y el garrafón tiene ' + Vc + ' L, así que ' + p + ' × ' + Vc + ' = ' + mc + ' mg. Resultado: = ' + mc,
            en:'Each litre contains ' + p + ' mg, and the jug holds ' + Vc + ' L, so ' + p + ' × ' + Vc + ' = ' + mc + ' mg. Result: = ' + mc }),
    showWork:true
  };
}

function mkP6(rng){
  function verdictOpts(v, R, mistake){
    var up = { es:' ppm, por arriba de la referencia', en:' ppm, above the reference' };
    var inn = { es:' ppm, dentro de la referencia', en:' ppm, within the reference' };
    function tag(x){ return L(x > R ? up : inn); }
    function opp(x){ return L(x > R ? inn : up); }
    return [ fmt(v) + tag(v), fmt(v) + opp(v), fmt(v / 2) + tag(v / 2), fmt(mistake) + tag(mistake) ];
  }
  var s = Math.floor(rng() * 3);
  if (s === 0){
    var A = pk(rng, [[25, 2, 10, 12.5], [18, 6, 10, 3], [60, 4, 10, 15], [24, 8, 5, 3], [44, 4, 10, 11]]);
    var m = A[0], V = A[1], R = A[2], v = A[3];
    return {
      title:L({ es:'La toma de la escuela', en:'The school water intake' }),
      q:L({ es:'De la toma de la escuela se analizaron ' + V + ' L de agua y el laboratorio encontró ' + m + ' mg de nitratos en esa muestra. La referencia para agua de bebida es ' + R + ' ppm. ¿Qué debe concluir el equipo?',
            en:'From the school intake, ' + V + ' L of water were analysed and the laboratory found ' + m + ' mg of nitrates in that sample. The reference for drinking water is ' + R + ' ppm. What should the team conclude?' }),
      fn:'',
      options:L({ es:verdictOpts(v, R, m), en:verdictOpts(v, R, m) }),
      correct:0,
      hint:L({ es:'Primero lleva la cantidad hallada a la lectura por litro; solo entonces la comparación con la referencia tiene sentido.',
               en:'First take the amount found to a reading per litre; only then does the comparison with the reference make sense.' }),
      exp:L({ es:'Los ' + m + ' mg repartidos en ' + V + ' L dan ' + m + ' ÷ ' + V + ' = ' + v + ' mg por litro, es decir ' + v + ' ppm, que se compara con los ' + R + ' ppm de la referencia. Resultado: = ' + v,
              en:'The ' + m + ' mg spread through ' + V + ' L give ' + m + ' ÷ ' + V + ' = ' + v + ' mg per litre, that is ' + v + ' ppm, which is compared with the ' + R + ' ppm of the reference. Result: = ' + v }),
      showWork:true
    };
  }
  if (s === 1){
    var B = pk(rng, [[900, 3, 400, 300], [2400, 4, 400, 600], [1500, 5, 200, 300], [800, 4, 400, 200], [1800, 3, 400, 600]]);
    var mb = B[0], M = B[1], Rb = B[2], vb = B[3];
    return {
      title:L({ es:'El área de juegos', en:'The play area' }),
      q:L({ es:'Se analizaron ' + M + ' kg de suelo del área de juegos y se hallaron ' + mb + ' mg de plomo en la muestra. La referencia para suelo de áreas de juego es ' + Rb + ' ppm. ¿Qué debe concluir el equipo?',
            en:'A sample of ' + M + ' kg of soil from the play area was analysed and ' + mb + ' mg of lead were found in it. The reference for soil in play areas is ' + Rb + ' ppm. What should the team conclude?' }),
      fn:'',
      options:L({ es:verdictOpts(vb, Rb, mb), en:verdictOpts(vb, Rb, mb) }),
      correct:0,
      hint:L({ es:'La referencia está expresada por kilogramo de suelo, así que la muestra completa debe llevarse a esa base antes de comparar.',
               en:'The reference is expressed per kilogram of soil, so the whole sample has to be taken to that base before comparing.' }),
      exp:L({ es:'Los ' + mb + ' mg repartidos en ' + M + ' kg dan ' + mb + ' ÷ ' + M + ' = ' + vb + ' mg por kilogramo, es decir ' + vb + ' ppm frente a los ' + Rb + ' ppm de la referencia. Resultado: = ' + vb,
              en:'The ' + mb + ' mg spread through ' + M + ' kg give ' + mb + ' ÷ ' + M + ' = ' + vb + ' mg per kilogram, that is ' + vb + ' ppm against the ' + Rb + ' ppm of the reference. Result: = ' + vb }),
      showWork:true
    };
  }
  var C = pk(rng, [[20, 1000, 20], [5, 500, 10], [12, 1200, 10], [30, 1500, 20], [8, 400, 20]]);
  var g = C[0], Lt = C[1], vc = C[2];
  return {
    title:L({ es:'El tinaco de la escuela', en:'The water tank at school' }),
    q:L({ es:'Por un descuido cayeron ' + g + ' g de una sustancia soluble en el tinaco escolar, que contiene ' + Lt + ' L de agua, y la sustancia quedó repartida de manera uniforme. ¿Qué concentración se registraría en el agua del tinaco?',
          en:'By accident, ' + g + ' g of a soluble substance fell into the school water tank, which holds ' + Lt + ' L of water, and the substance spread out evenly. What concentration would be recorded in the tank water?' }),
    fn:'',
    options:opts4(rng, vc, [vc * 2, vc / 2, g / Lt, g + Lt / 100], ' ppm'),
    correct:0,
    hint:L({ es:'La lectura en partes por millón se construye con miligramos por litro, así que conviene expresar primero la masa en esa unidad.',
             en:'The reading in parts per million is built with milligrams per litre, so it helps to express the mass in that unit first.' }),
    exp:L({ es:'Los ' + g + ' g equivalen a ' + (g * 1000) + ' mg, y repartidos en ' + Lt + ' L dan ' + (g * 1000) + ' ÷ ' + Lt + ' = ' + vc + ' mg por litro, es decir ' + vc + ' ppm. Resultado: = ' + vc,
            en:'The ' + g + ' g are equivalent to ' + (g * 1000) + ' mg, and spread through ' + Lt + ' L they give ' + (g * 1000) + ' ÷ ' + Lt + ' = ' + vc + ' mg per litre, that is ' + vc + ' ppm. Result: = ' + vc }),
    showWork:true
  };
}

<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbzLGV15JRTPs9bbSvHRLfgOXeT9oUExDf1AH546WOwq5tYxXSdhX212OWi_bTJfMGx9/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'Degradación y Contaminación en la Comunidad';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
