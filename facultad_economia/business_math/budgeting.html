<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Budgeting · Business Math · School of Economics, Universidad de Colima</title>
<link rel="canonical" href="https://liaxa.mx/facultad_economia/business_math/neg_presupuestos.html">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS ── fallback only; applyBranding() re-injects from SCHOOL ── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;
  --gold-bg:    #faf3e0;
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; object-fit:contain; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; min-width:0; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── LANGUAGE TOGGLE ── */
.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }
.dlist { font-family:'IBM Plex Mono',monospace; font-size:.78rem; color:var(--green-dark); background:var(--surface2); border-radius:8px; padding:.6rem .7rem; margin:.6rem 0; word-break:break-word; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); overflow-x:auto; }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── INTERACTIVE WIDGETS ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.iw-head { display:flex; align-items:baseline; gap:.6rem; margin-bottom:.3rem; flex-wrap:wrap; }
.iw-tag { font-size:.62rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; }
.iw-title { font-family:'Crimson Pro',serif; font-size:1.08rem; font-weight:700; }
.iw-sub { font-size:.8rem; color:var(--text2); margin-bottom:.85rem; }
.iw-canvas { display:block; width:100%; border-radius:8px; background:var(--surface2); }
.iw-read { margin-top:.85rem; background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 8px 8px 0; padding:.7rem .85rem; font-size:.82rem; color:var(--text2); }
.iw-read strong { color:var(--green-dark); }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (widget toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.3rem .7rem; font-size:.76rem; cursor:pointer; color:var(--text2); transition:all .14s; font-family:inherit; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--gold-bg); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }

/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos { gap: .9rem; }
  .wlogos img { height: 38px; max-width: 42%; }
  .wtitle { font-size: 1.35rem; }
  .stickybar { padding: .5rem .55rem; gap: .38rem; }
  .htitle { display: none; }
  .halexis { display: none; }
  .hsep { display: none; }
  .hlogos { gap: .3rem; }
  .hlogos img { height: 18px; max-width: 60px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 78px; overflow: hidden; text-overflow: ellipsis; }
  .lang-btn { padding: .26rem .48rem; font-size: .68rem; }
  .lbody { padding: 1.2rem .7rem 3rem; max-width: 100%; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .gcrd { padding: .9rem .75rem; }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}
</style>
</head>
<body>

<!-- ════════════════════ WELCOME ════════════════════ -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <div style="font-family:'Crimson Pro',serif;font-size:2rem;font-weight:700;letter-spacing:.06em;color:var(--green);line-height:1">ALEXIS</div>
    </div>
    </div>
    <div class="wtitle" id="wtitle-el">Budgeting</div>
    <div class="wcourse" id="wcourse-el">Business Math</div>
    <label class="flabel" for="sName" id="lbl-name-el">Full name</label>
    <input class="finput" id="sName" type="text" placeholder="Your full name" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" for="sGroup" id="lbl-group-el">Group</label>
    <input class="finput" id="sGroup" type="text" placeholder="e.g. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Start</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreTitle">Saved session found</strong><br>
      <span id="restoreMsg">Do you want to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- ════════════════════ LESSON ════════════════════ -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo -->
      <img id="hlogo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle" id="htitle-el">Budgeting</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle">
      <button class="lang-btn"        id="btn-es" onclick="setLang('es')">ES</button>
      <button class="lang-btn active" id="btn-en" onclick="setLang('en')">EN</button>
    </div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="dlbtn" id="dlBtn" onclick="generatePDF()">Download results as PDF</button>
    </div>
  </div>
</div>

<script>
/* ════════════════════════════════════════════════════════════════════════
   SCHOOL CONFIG · edit ONLY this block to rebrand for a different school
   ════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:      '#1a4a8a',
  primaryDark:  '#0f2d5a',
  primaryBg:    '#e8edf5',
  accent:       '#c9a84c',
  accentBg:     '#faf3e0',
  pBR: 26,  pBG: 74,  pBB: 138,
  pAR: 201, pAG: 168, pAB: 76,
  darkPrimary:     '#4a7abf',
  darkPrimaryDark: '#7aaae0',

/* ════════════════════════════════════════════════════════════════════════
   ATTEMPT COUNTER + SEEDED RNG
   ════════════════════════════════════════════════════════════════════════ */
function getAttemptKey(name, group) {
  return 'fac_econ_neg__neg_presupuestos__att__' + (name + '__' + group).replace(/\s+/g, '_');
}
function nextAttempt(name, group) {
  var k = getAttemptKey(name, group), n = 0;
  try { n = parseInt(localStorage.getItem(k) || '0', 10) || 0; } catch(e) {}
  n++;
  try { localStorage.setItem(k, String(n)); } catch(e) {}
  return n;
}
function currentAttempt(name, group) {
  var k = getAttemptKey(name, group);
  try { return parseInt(localStorage.getItem(k) || '1', 10) || 1; } catch(e) { return 1; }
}
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t2 = s ^ (s >>> 16);
    t2 = Math.imul(t2, 0x21f0aaad);
    t2 ^= (t2 >>> 15);
    t2 = Math.imul(t2, 0x735a2d97);
    return ((t2 ^ (t2 >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}
/* Shuffles the four options once and keeps both language versions aligned. */
function shuffleOpts(rawEs, rawEn, rng) {
  var p = shuffle([0, 1, 2, 3], rng);
  return {
    es: p.map(function(j) { return rawEs[j]; }),
    en: p.map(function(j) { return rawEn[j]; }),
    correctIdx: p.indexOf(0)
  };
}

/* ════════════════════════════════════════════════════════════════════════
   NUMBER HELPERS
   ════════════════════════════════════════════════════════════════════════ */
function nf(x) {
  var neg = x < 0, v = Math.abs(x);
  var s = (Math.round(v * 10) / 10).toString().split('.');
  s[0] = s[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return (neg ? '−' : '') + s.join('.');
}
function nfD(x, d) {
  var neg = x < 0, v = Math.abs(x);
  var s = v.toFixed(d).split('.');
  s[0] = s[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return (neg ? '−' : '') + s.join('.');
}
function money(v)  { return '$' + nf(Math.round(v)); }
function money2(v) { return '$' + nfD(v, 2); }
function dec1(x)   { return x.toFixed(1); }
function dec2(x)   { return x.toFixed(2); }
/* Percentage written the way a policy states it: 25 and not 25.00. */
function pctS(x) {
  var v = Math.round(x * 1000000) / 10000;
  if (Math.abs(v - Math.round(v)) < 1e-9) return String(Math.round(v));
  return String(Math.round(v * 100) / 100);
}
function pct1(x)   { return (x * 100).toFixed(1) + '%'; }
function pct2(x)   { return (x * 100).toFixed(2) + '%'; }
function intN(x)   { return nf(Math.round(x)); }
function cssv(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }

/* A variance is never printed with a sign. It is printed as a magnitude plus
   the word the accounting report would use, which is how a budget committee
   reads it and which keeps a minus out of every currency figure. */
function varEs(v) { return money(Math.abs(v)) + (v >= 0 ? ' desfavorable' : ' favorable'); }
function varEn(v) { return money(Math.abs(v)) + (v >= 0 ? ' unfavourable' : ' favourable'); }
function varWordEs(v) { return v >= 0 ? 'desfavorable' : 'favorable'; }
function varWordEn(v) { return v >= 0 ? 'unfavourable' : 'favourable'; }

/* ── THE MODELS THIS GUIDE RUNS ON ────────────────────────────────────────
   A budget is a plan written in units and pesos before the period starts,
   and then a yardstick once the period is over. Every routine below belongs
   to one of the two halves: building the plan, or comparing it against what
   actually happened. */
/* Units the plant has to make: what will be sold, plus the stock the policy
   wants left at the close, less the stock already on the floor. */
function unitsToProduce(sell, endInv, begInv) { return sell + endInv - begInv; }
/* Same arithmetic one level down, in kilograms of raw material. */
function materialsToBuy(usage, endInv, begInv) { return usage + endInv - begInv; }
/* Cash actually collected in a month when credit sales are collected over
   three months in the proportions a, b and the remainder. */
function cashCollected(s0, s1, s2, a, b, c) { return a * s0 + b * s1 + c * s2; }
/* Cost the budget would have authorised for the volume actually reached. */
function flexBudget(F, v, units) { return F + v * units; }
/* The part of the gap explained by making more or fewer units than planned. */
function volumeVariance(v, actUnits, budUnits) { return v * (actUnits - budUnits); }
/* The part of the gap that belongs to whoever runs the department. */
function spendingVariance(actual, F, v, actUnits) { return actual - flexBudget(F, v, actUnits); }
function contribMargin(p, v) { return p - v; }
function breakevenUnits(F, p, v) { return F / (p - v); }
function targetUnits(F, T, p, v) { return (F + T) / (p - v); }
function marginOfSafety(planUnits, beUnits) { return planUnits > 0 ? (planUnits - beUnits) / planUnits : 0; }
function opProfit(p, v, F, units) { return (p - v) * units - F; }

/* ════════════════════════════════════════════════════════════════════════
   OPTION BUILDERS · the key is always the first value handed in
   ════════════════════════════════════════════════════════════════════════ */
/* Four distinct numbers rendered by fmt, identical in both languages. */
function valOpts(correct, wrongs, fmt, rng) {
  var seen = {}, vals = [];
  function add(v) {
    if (typeof v !== 'number' || !isFinite(v)) return;
    var s = fmt(v);
    if (seen[s]) return;
    seen[s] = 1; vals.push(s);
  }
  add(correct);
  for (var i = 0; i < wrongs.length && vals.length < 4; i++) add(wrongs[i]);
  for (var j = 1; vals.length < 4 && j < 900; j++) {
    add(correct * (1 + j * 0.11 * (j % 2 ? 1 : -1)));
  }
  for (var k = 1; vals.length < 4 && k < 900; k++) add(correct + k * 0.41);
  return shuffleOpts(vals, vals, rng);
}
/* Same builder for figures that carry a word, such as a unit name or the
   favourable and unfavourable labels. The number is identical in the two
   languages and only the word around it changes. */
function valOptsL(correct, wrongs, fmtEs, fmtEn, rng) {
  var seen = {}, ves = [], ven = [];
  function add(v) {
    if (typeof v !== 'number' || !isFinite(v)) return;
    var s = fmtEs(v);
    if (seen[s]) return;
    seen[s] = 1; ves.push(s); ven.push(fmtEn(v));
  }
  add(correct);
  for (var i = 0; i < wrongs.length && ves.length < 4; i++) add(wrongs[i]);
  for (var j = 1; ves.length < 4 && j < 900; j++) {
    add(correct * (1 + j * 0.13 * (j % 2 ? 1 : -1)));
  }
  for (var k = 1; ves.length < 4 && k < 900; k++) add(correct + k * 7);
  return shuffleOpts(ves, ven, rng);
}

/* ════════════════════════════════════════════════════════════════════════
   CANVAS / TABS / PHOTO / HINT / RESULTS

function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#2d5a27';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e) { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e) { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(p[0], p[1]); ctx.stroke(); lx = p[0]; ly = p[1]; }
  function onUp() { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}
function switchTab(idx, panel, btn) {

  document.querySelectorAll('[id^="' + prefix + '"]').forEach(function(p) { p.classList.remove('active'); });

   ANSWER HANDLER · two taps to confirm
   ════════════════════════════════════════════════════════════════════════ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = '<strong>' + (isOk ? t('fb-correct') : t('fb-wrong')) + '</strong> ' + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (!prob || prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = '<strong>' + (isOk ? t('fb-correct') : t('fb-wrong')) + '</strong> ' + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

/* ════════════════════════════════════════════════════════════════════════
   CANVAS PRIMITIVES FOR THE WIDGETS
   ════════════════════════════════════════════════════════════════════════ */
function fitCanvas(cv, h) {
  var dpr = window.devicePixelRatio || 1;
  var w = Math.max(240, cv.clientWidth || cv.parentNode.clientWidth || 300);
  cv.style.height = h + 'px';
  cv.width  = Math.round(w * dpr);
  cv.height = Math.round(h * dpr);
  var ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  return { ctx: ctx, w: w, h: h };
}
function palette() {
  return {
    green: cssv('--green'), dark: cssv('--green-dark'), tint: cssv('--green-bg'),
    gold: cssv('--gold'), bad: cssv('--bad'), border: cssv('--border'),
    text: cssv('--text'), text2: cssv('--text2'), text3: cssv('--text3')
  };
}
function kindColor(P, kind) {
  if (kind === 'gold') return P.gold;
  if (kind === 'bad')  return P.bad;
  if (kind === 'tint') return P.tint;
  if (kind === 'soft') return P.text3;
  return P.dark;
}
/* Plots any budget line given as a function of a quantity or of a month. A
   sales plan, a production plan, a cash balance falling toward a floor and a
   cost line rising with volume are all the same picture to this routine.
     opts.marks  points worth naming, such as the breakeven volume
     opts.band   the stretch of the horizontal axis worth highlighting
     opts.hline  a reference amount drawn as a horizontal line
     opts.asym   a limit a curve approaches without reaching
     opts.at     where the student is standing right now                     */
function drawCurveChart(g, xMin, xMax, series, opts) {
  var ctx = g.ctx, P = palette(), W = g.w, H = g.h, i;
  var padL = 56, padR = 12, padT = 18, padB = 28;
  opts = opts || {};
  var fmtY  = opts.fmtY || function(v) { return intN(v); };
  var fmtX  = opts.fmtX || function(v) { return intN(v); };
  var STEPS = 140;
  var yLo = null, yHi = null;
  function note(v) {
    if (typeof v !== 'number' || !isFinite(v)) return;
    if (yLo === null || v < yLo) yLo = v;
    if (yHi === null || v > yHi) yHi = v;
  }
  series.forEach(function(s) {
    for (i = 0; i <= STEPS; i++) note(s.f(xMin + (xMax - xMin) * i / STEPS));
  });
  note(opts.yFloor); note(opts.yCeil);
  if (opts.hline) note(opts.hline.y);
  if (opts.asym)  note(opts.asym.y);
  if (yLo === null) { yLo = 0; yHi = 1; }
  if (yHi - yLo < 1) yHi = yLo + 1;
  var pd = (yHi - yLo) * 0.10;
  yLo -= pd; yHi += pd;
  function X(v) { return padL + (v - xMin) / (xMax - xMin) * (W - padL - padR); }
  function Y(v) { return H - padB - (v - yLo) / (yHi - yLo) * (H - padT - padB); }
  function Yc(v) { return Math.max(padT - 10, Math.min(H - padB + 10, Y(v))); }

  if (opts.band && opts.band.to > opts.band.from) {
    var b1 = X(Math.max(xMin, opts.band.from)), b2 = X(Math.min(xMax, opts.band.to));
    if (b2 > b1) {
      ctx.save();
      ctx.fillStyle = P.tint;
      ctx.fillRect(b1, padT - 8, b2 - b1, H - padB - padT + 8);
      ctx.restore();
    }
  }
  ctx.strokeStyle = P.border; ctx.lineWidth = 1;
  ctx.fillStyle = P.text3; ctx.font = '9px "IBM Plex Mono", monospace';
  for (i = 0; i <= 3; i++) {
    var gv = yLo + (yHi - yLo) * i / 3;
    ctx.beginPath(); ctx.moveTo(padL, Y(gv)); ctx.lineTo(W - padR, Y(gv)); ctx.stroke();
    var gl = fmtY(gv);
    ctx.fillText(gl, Math.max(1, padL - 4 - ctx.measureText(gl).width), Y(gv) + 3);
  }
  if (yLo < 0 && yHi > 0) {
    ctx.save();
    ctx.strokeStyle = P.text3; ctx.lineWidth = 1.4; ctx.setLineDash([3, 3]);
    ctx.beginPath(); ctx.moveTo(padL, Y(0)); ctx.lineTo(W - padR, Y(0)); ctx.stroke();
    ctx.restore();
  }
  if (opts.asym) {
    ctx.save();
    ctx.strokeStyle = P.bad; ctx.lineWidth = 1.3; ctx.setLineDash([5, 4]);
    ctx.beginPath(); ctx.moveTo(padL, Y(opts.asym.y)); ctx.lineTo(W - padR, Y(opts.asym.y)); ctx.stroke();
    ctx.restore();
    if (opts.asym.label) {
      ctx.fillStyle = P.bad; ctx.font = '600 9px "IBM Plex Sans", sans-serif';
      ctx.fillText(opts.asym.label, padL + 4, Math.max(10, Y(opts.asym.y) - 4));
    }
  }
  if (opts.hline) {
    ctx.save();
    ctx.strokeStyle = P.gold; ctx.lineWidth = 1.5; ctx.setLineDash([6, 3]);
    ctx.beginPath(); ctx.moveTo(padL, Y(opts.hline.y)); ctx.lineTo(W - padR, Y(opts.hline.y)); ctx.stroke();
    ctx.restore();
    if (opts.hline.label) {
      ctx.fillStyle = P.gold; ctx.font = '600 9px "IBM Plex Sans", sans-serif';
      var hw = ctx.measureText(opts.hline.label).width;
      ctx.fillText(opts.hline.label, W - padR - hw - 2, Math.max(10, Y(opts.hline.y) - 4));
    }
  }
  series.forEach(function(s) {
    ctx.strokeStyle = kindColor(P, s.kind); ctx.lineWidth = 2.2;
    ctx.beginPath();
    var started = false;
    for (i = 0; i <= STEPS; i++) {
      var xv = xMin + (xMax - xMin) * i / STEPS;
      var yv = s.f(xv);
      if (typeof yv !== 'number' || !isFinite(yv)) { started = false; continue; }
      var px = X(xv), py = Yc(yv);
      if (!started) { ctx.moveTo(px, py); started = true; } else { ctx.lineTo(px, py); }
    }
    ctx.stroke();
  });
  (opts.marks || []).forEach(function(m) {
    if (typeof m.x !== 'number' || !isFinite(m.x) || m.x < xMin || m.x > xMax) return;
    var cx = X(m.x), cy = Yc(m.y);
    ctx.save();
    ctx.strokeStyle = kindColor(P, m.kind || 'gold'); ctx.lineWidth = 1.4; ctx.setLineDash([4, 3]);
    ctx.beginPath(); ctx.moveTo(cx, H - padB); ctx.lineTo(cx, cy); ctx.stroke();
    ctx.restore();
    ctx.fillStyle = kindColor(P, m.kind || 'gold');
    ctx.beginPath(); ctx.arc(cx, cy, 4.2, 0, Math.PI * 2); ctx.fill();
    if (m.label) {
      ctx.font = '600 10px "IBM Plex Sans", sans-serif';
      var mw = ctx.measureText(m.label).width;
      ctx.fillText(m.label, Math.min(Math.max(2, cx - mw / 2), W - mw - 2), Math.max(10, cy - 9));
    }
  });
  if (typeof opts.at === 'number' && opts.at >= xMin && opts.at <= xMax) {
    ctx.save();
    ctx.strokeStyle = P.bad; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(X(opts.at), H - padB); ctx.lineTo(X(opts.at), padT - 6); ctx.stroke();
    ctx.restore();
  }
  ctx.strokeStyle = P.border; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(padL, padT - 8); ctx.lineTo(padL, H - padB); ctx.lineTo(W - padR, H - padB); ctx.stroke();
  ctx.fillStyle = P.text3; ctx.font = '9px "IBM Plex Mono", monospace';
  [xMin, (xMin + xMax) / 2, xMax].forEach(function(v) {
    var lab = fmtX(v), lw = ctx.measureText(lab).width;
    ctx.fillText(lab, Math.min(Math.max(1, X(v) - lw / 2), W - lw - 1), H - padB + 13);
  });
  var legX = padL + 4;
  ctx.font = '600 9.5px "IBM Plex Sans", sans-serif';
  series.forEach(function(s) {
    if (!s.label) return;
    ctx.fillStyle = kindColor(P, s.kind);
    ctx.fillRect(legX, 9, 9, 3);
    ctx.fillText(s.label, legX + 12, 13);
    legX += 12 + ctx.measureText(s.label).width + 12;
  });
  if (opts.xLabel) {
    ctx.fillStyle = P.text3; ctx.font = '9px "IBM Plex Sans", sans-serif';
    var xl = opts.xLabel;
    ctx.fillText(xl, W - padR - ctx.measureText(xl).width, H - 3);
  }
}

/* ════════════════════════════════════════════════════════════════════════
   WIDGET 1 · why the plant almost never makes exactly what is sold
   ════════════════════════════════════════════════════════════════════════ */
function widgetProductionBudget(U0, g0, pol0) {
  var host = document.createElement('div');
  host.className = 'section';
  document.getElementById('lessonBody').appendChild(host);
  var state = { view: 'units', U: U0, g: g0, pol: pol0, q: 2 };
  function sales(q)  { return state.U * Math.pow(1 + state.g, q - 1); }
  function endInv(q) { return state.pol * sales(q + 1); }
  function begInv(q) { return state.pol * sales(q); }
  function prod(q)   { return unitsToProduce(sales(q), endInv(q), begInv(q)); }
  function mount() {
    var es = LANG === 'es';
    var MODES = [
      { id: 'units', es: 'Ventas contra producción', en: 'Sales against production' },
      { id: 'inv',   es: 'Inventario al abrir y al cerrar', en: 'Stock at the open and at the close' }
    ];
    var tabs = MODES.map(function(m) {
      return '<button class="mtab' + (m.id === state.view ? ' active' : '') + '" data-m="' + m.id + '">' + m[LANG] + '</button>';
    }).join('');
    host.innerHTML =
      '<div class="gcrd" data-widget="presupuesto-de-produccion-e-inventario">' +
        '<div class="iw-head"><span class="iw-tag">' + (es ? 'Herramienta' : 'Tool') + '</span>' +
        '<span class="iw-title">' + (es ? 'La planta casi nunca fabrica lo que se vende' : 'The plant almost never makes what is sold') + '</span></div>' +
        '<div class="iw-sub">' + (es
          ? 'El presupuesto de producción no copia al de ventas: lo corrige por la política de inventarios. Deja la política quieta y mueve solamente el crecimiento trimestral. Cuando el plan sube, la línea de producción se despega por encima de la de ventas, porque además de surtir el trimestre hay que dejar en almacén una existencia mayor para el trimestre siguiente. Baja el crecimiento por debajo de cero y verás lo contrario: la planta fabrica menos de lo que vende y la diferencia sale del almacén. Después mueve el porcentaje de la política y observa que no cambia el sentido del efecto, solo su tamaño: la política multiplica la brecha que abre el crecimiento, y por eso una empresa que crece rápido con una política generosa termina financiando mucho inventario sin haberlo decidido de forma explícita.'
          : 'The production budget does not copy the sales budget: it corrects it for the inventory policy. Hold the policy still and move only the quarterly growth. When the plan rises, the production line pulls above the sales line, because on top of supplying the quarter the warehouse has to be left with a larger stock for the quarter that follows. Take the growth below zero and you will see the opposite: the plant makes less than it sells and the difference comes out of the warehouse. Then move the policy percentage and notice that it does not change the direction of the effect, only its size: the policy multiplies the gap that growth opens, which is why a fast growing company with a generous policy ends up financing a great deal of stock without ever deciding to.') + '</div>' +
        '<div class="mtabs">' + tabs + '</div>' +
        '<div class="cgrid"><div class="cg">' +
          '<label>' + (es ? 'Unidades que se venderán en el primer trimestre' : 'Units to be sold in the first quarter') + ': <span class="cval" id="p1Ul"></span></label>' +
          '<input type="range" min="2000" max="12000" step="500" id="p1U" value="' + state.U + '">' +
        '</div><div class="cg">' +
          '<label>' + (es ? 'Crecimiento de las ventas cada trimestre' : 'Growth of sales each quarter') + ': <span class="cval" id="p1gl"></span></label>' +
          '<input type="range" min="-10" max="20" step="1" id="p1g" value="' + Math.round(state.g * 100) + '">' +
        '</div></div>' +
        '<div class="cgrid"><div class="cg">' +
          '<label>' + (es ? 'Política de inventario final' : 'Closing stock policy') + ': <span class="cval" id="p1pl"></span></label>' +
          '<input type="range" min="10" max="40" step="5" id="p1p" value="' + Math.round(state.pol * 100) + '">' +
        '</div><div class="cg">' +
          '<label>' + (es ? 'Trimestre que estás inspeccionando' : 'Quarter you are inspecting') + ': <span class="cval" id="p1ql"></span></label>' +
          '<input type="range" min="1" max="4" step="1" id="p1q" value="' + state.q + '">' +
        '</div></div>' +
        '<canvas class="iw-canvas" id="p1cv"></canvas>' +
        '<div class="dlist" id="p1steps"></div>' +
        '<div class="metrics">' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Unidades por vender' : 'Units to be sold') + '</div><div class="mnum cs" id="p1s"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Existencia que pide la política' : 'Stock the policy asks for') + '</div><div class="mnum ps" id="p1e"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Existencia con la que se abre' : 'Stock the period opens with') + '</div><div class="mnum ts" id="p1b"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Unidades por producir' : 'Units to produce') + '</div><div class="mnum cs" id="p1r"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Diferencia contra las ventas' : 'Difference against sales') + '</div><div class="mnum ps" id="p1d"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Producción como parte de las ventas' : 'Production as a share of sales') + '</div><div class="mnum ts" id="p1x"></div></div>' +
        '</div>' +
        '<div class="iw-read" id="p1read"></div>' +
      '</div>';
    host.querySelectorAll('.mtab').forEach(function(b) {
      b.addEventListener('click', function() {
        state.view = b.getAttribute('data-m');
        host.querySelectorAll('.mtab').forEach(function(x) { x.classList.remove('active'); });
        b.classList.add('active');
        update();
      });
    });
    host.querySelector('#p1U').addEventListener('input', function() { state.U = parseInt(this.value, 10); update(); });
    host.querySelector('#p1g').addEventListener('input', function() { state.g = parseInt(this.value, 10) / 100; update(); });
    host.querySelector('#p1p').addEventListener('input', function() { state.pol = parseInt(this.value, 10) / 100; update(); });
    host.querySelector('#p1q').addEventListener('input', function() { state.q = parseInt(this.value, 10); update(); });
    update();
  }
  function update() {
    var es = LANG === 'es';
    var q = state.q;
    var sq = sales(q), eq = endInv(q), bq = begInv(q), pq = prod(q);
    host.querySelector('#p1Ul').textContent = intN(state.U) + (es ? ' unidades' : ' units');
    host.querySelector('#p1gl').textContent = pctS(state.g) + (es ? ' por ciento' : ' percent');
    host.querySelector('#p1pl').textContent = pctS(state.pol) + (es ? ' por ciento' : ' percent');
    host.querySelector('#p1ql').textContent = (es ? 'trimestre ' : 'quarter ') + intN(q);
    host.querySelector('#p1s').textContent = intN(sq);
    host.querySelector('#p1e').textContent = intN(eq);
    host.querySelector('#p1b').textContent = intN(bq);
    host.querySelector('#p1r').textContent = intN(pq);
    host.querySelector('#p1d').textContent = intN(Math.abs(pq - sq)) + (pq >= sq ? (es ? ' de más' : ' more') : (es ? ' de menos' : ' fewer'));
    host.querySelector('#p1x').textContent = pct1(sq !== 0 ? pq / sq : 0);
    host.querySelector('#p1steps').textContent = es
      ? 'En el trimestre ' + intN(q) + ' hay que surtir ' + intN(sq) + ' unidades de venta  ·  ' +
        'la política pide cerrar con ' + intN(eq) + ' unidades en almacén  ·  ' +
        'el periodo abre con ' + intN(bq) + ' unidades ya fabricadas  ·  ' +
        'lo que la planta tiene que producir son ' + intN(pq) + ' unidades'
      : 'In quarter ' + intN(q) + ' the plan has to supply ' + intN(sq) + ' units of sales  ·  ' +
        'the policy asks to close with ' + intN(eq) + ' units in the warehouse  ·  ' +
        'the period opens with ' + intN(bq) + ' units already made  ·  ' +
        'what the plant has to produce is ' + intN(pq) + ' units';
    var g = fitCanvas(host.querySelector('#p1cv'), 185);
    if (state.view === 'units') {
      drawCurveChart(g, 1, 4, [
        { f: function(x) { return prod(x); },  kind: 'green', label: (es ? 'Producción' : 'Production') },
        { f: function(x) { return sales(x); }, kind: 'gold',  label: (es ? 'Ventas' : 'Sales') }
      ], {
        at: q, yFloor: 0,
        fmtY: function(v) { return intN(v); }, fmtX: function(v) { return intN(v); },
        marks: [{ x: q, y: prod(q), label: intN(prod(q)), kind: 'bad' }],
        xLabel: (es ? 'trimestre' : 'quarter')
      });
    } else {
      drawCurveChart(g, 1, 4, [
        { f: function(x) { return endInv(x); }, kind: 'green', label: (es ? 'Existencia al cerrar' : 'Stock at the close') },
        { f: function(x) { return begInv(x); }, kind: 'gold',  label: (es ? 'Existencia al abrir' : 'Stock at the open') }
      ], {
        at: q, yFloor: 0,
        fmtY: function(v) { return intN(v); }, fmtX: function(v) { return intN(v); },
        xLabel: (es ? 'trimestre' : 'quarter')
      });
    }
    var extra = pq - sq;
    host.querySelector('#p1read').innerHTML = es
      ? '<strong>Lectura de negocio:</strong> en el trimestre ' + intN(q) + ' el plan vende ' + intN(sq) + ' unidades y la planta tiene que fabricar ' + intN(pq) + ', es decir ' + intN(Math.abs(extra)) + ' unidades ' + (extra >= 0 ? 'por encima' : 'por debajo') + ' de la venta. Esa diferencia no es un error de captura: es la política de inventarios trabajando. ' +
        'Conviene fijar tres ideas. La primera es que el presupuesto de producción se construye hacia atrás desde el de ventas y nunca al revés, porque es la demanda la que manda sobre la planta. La segunda es que la existencia final de un trimestre es la existencia inicial del siguiente, de modo que los cuatro trimestres quedan encadenados y no se pueden presupuestar por separado. La tercera es que cada unidad de esa diferencia cuesta dinero mucho antes de venderse: se paga material, mano de obra y espacio de almacén en el trimestre en que se fabrica, mientras que el ingreso llega hasta el siguiente. Por eso una política de inventario alta es una decisión de tesorería tanto como de operaciones.'
      : '<strong>Business reading:</strong> in quarter ' + intN(q) + ' the plan sells ' + intN(sq) + ' units and the plant has to make ' + intN(pq) + ', that is ' + intN(Math.abs(extra)) + ' units ' + (extra >= 0 ? 'above' : 'below') + ' the sales figure. That difference is not a typing error: it is the inventory policy at work. ' +
        'Three ideas are worth fixing. The first is that the production budget is built backwards from the sales budget and never the other way round, because demand is what governs the plant. The second is that the closing stock of one quarter is the opening stock of the next, so the four quarters are chained together and cannot be budgeted separately. The third is that every unit of that difference costs money long before it is sold: material, labour and warehouse space are paid in the quarter it is made, while the revenue arrives in the following one. That is why a high inventory policy is a treasury decision as much as an operations one.';
  }
  widgets.push(mount);
  mount();
}

/* ════════════════════════════════════════════════════════════════════════
   WIDGET 2 · the month the plan is profitable and the bank is needed anyway
   ════════════════════════════════════════════════════════════════════════ */
function widgetCashBudget(S0, a0, b0, min0) {
  var host = document.createElement('div');
  host.className = 'section';
  document.getElementById('lessonBody').appendChild(host);
  var G = 0.10, DR = 0.68, FXR = 0.26, BEGR = 0.30, M = 6;
  var state = { view: 'balance', S: S0, a: a0, b: b0, min: min0 };
  function tail()       { return Math.max(0, 1 - state.a - state.b); }
  function salesAt(m)   { return m < 1 ? state.S : state.S * Math.pow(1 + G, m - 1); }
  function rec(m)       { return cashCollected(salesAt(m), salesAt(m - 1), salesAt(m - 2), state.a, state.b, tail()); }
  function dis(m)       { return DR * salesAt(m + 1) + FXR * state.S; }
  function endBal(m)    { var b = BEGR * state.S; for (var k = 1; k <= m; k++) b += rec(k) - dis(k); return b; }
  function tightest()   {
    var best = 1, bv = endBal(1);
    for (var m = 2; m <= M; m++) { var v = endBal(m); if (v < bv) { bv = v; best = m; } }
    return { m: best, bal: bv };
  }
  function creditLine() {
    var need = 0;
    for (var m = 1; m <= M; m++) need = Math.max(need, state.min - endBal(m));
    return Math.max(0, need);
  }
  function mount() {
    var es = LANG === 'es';
    var MODES = [
      { id: 'balance', es: 'Saldo de caja contra el mínimo', en: 'Cash balance against the floor' },
      { id: 'flow',    es: 'Entradas contra salidas', en: 'Money in against money out' }
    ];
    var tabs = MODES.map(function(m) {
      return '<button class="mtab' + (m.id === state.view ? ' active' : '') + '" data-m="' + m.id + '">' + m[LANG] + '</button>';
    }).join('');
    host.innerHTML =
      '<div class="gcrd" data-widget="presupuesto-de-efectivo-y-cobranza">' +
        '<div class="iw-head"><span class="iw-tag">' + (es ? 'Herramienta' : 'Tool') + '</span>' +
        '<span class="iw-title">' + (es ? 'Seis meses rentables y aun así un pedido al banco' : 'Six profitable months and a request to the bank anyway') + '</span></div>' +
        '<div class="iw-sub">' + (es
          ? 'Esta empresa vende a crédito, cobra una parte en el mes de la venta y el resto en los dos meses siguientes, y compra un mes antes de vender. Todos los meses del plan dejan utilidad. Mueve el porcentaje que se cobra dentro del mismo mes y observa el saldo de caja: cuando la cobranza se hace lenta, la línea verde se hunde por debajo del piso dorado aunque la utilidad no haya cambiado ni un peso. Ese hueco es lo que financia la línea de crédito. Prueba también a subir el saldo mínimo de operación y verás que la línea que hay que negociar crece sin que el negocio haya empeorado: el mínimo es una decisión de política, no un resultado. Lo que esta herramienta enseña es que la utilidad y el efectivo son dos calendarios distintos del mismo negocio.'
          : 'This company sells on credit, collects part of it in the month of the sale and the rest over the two following months, and buys a month before it sells. Every month of the plan shows a profit. Move the share collected within the month of sale and watch the cash balance: when collection slows down, the green line sinks below the golden floor even though profit has not changed by a single peso. That hole is what the credit line finances. Try raising the minimum operating balance as well and you will see the line to be negotiated grow without the business having got any worse: the floor is a policy decision, not a result. What this tool teaches is that profit and cash are two different calendars of the same business.') + '</div>' +
        '<div class="mtabs">' + tabs + '</div>' +
        '<div class="cgrid"><div class="cg">' +
          '<label>' + (es ? 'Ventas del primer mes' : 'Sales of the first month') + ': <span class="cval" id="c2Sl"></span></label>' +
          '<input type="range" min="400000" max="1600000" step="50000" id="c2S" value="' + state.S + '">' +
        '</div><div class="cg">' +
          '<label>' + (es ? 'Se cobra en el mes de la venta' : 'Collected in the month of the sale') + ': <span class="cval" id="c2al"></span></label>' +
          '<input type="range" min="10" max="60" step="5" id="c2a" value="' + Math.round(state.a * 100) + '">' +
        '</div></div>' +
        '<div class="cgrid"><div class="cg">' +
          '<label>' + (es ? 'Se cobra al mes siguiente' : 'Collected the following month') + ': <span class="cval" id="c2bl"></span></label>' +
          '<input type="range" min="15" max="60" step="5" id="c2b" value="' + Math.round(state.b * 100) + '">' +
        '</div><div class="cg">' +
          '<label>' + (es ? 'Saldo mínimo de operación' : 'Minimum operating balance') + ': <span class="cval" id="c2ml"></span></label>' +
          '<input type="range" min="50000" max="600000" step="25000" id="c2m" value="' + state.min + '">' +
        '</div></div>' +
        '<canvas class="iw-canvas" id="c2cv"></canvas>' +
        '<div class="dlist" id="c2steps"></div>' +
        '<div class="metrics">' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Se cobra dos meses después' : 'Collected two months later') + '</div><div class="mnum cs" id="c2t"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Cobranza de los seis meses' : 'Collections over the six months') + '</div><div class="mnum ps" id="c2r"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Pagos de los seis meses' : 'Payments over the six months') + '</div><div class="mnum ts" id="c2d"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Mes más apretado' : 'Tightest month') + '</div><div class="mnum ts" id="c2w"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Saldo en ese mes' : 'Balance in that month') + '</div><div class="mnum cs" id="c2lb"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Línea de crédito necesaria' : 'Credit line needed') + '</div><div class="mnum ps" id="c2cl"></div></div>' +
        '</div>' +
        '<div class="iw-read" id="c2read"></div>' +
      '</div>';
    host.querySelectorAll('.mtab').forEach(function(b) {
      b.addEventListener('click', function() {
        state.view = b.getAttribute('data-m');
        host.querySelectorAll('.mtab').forEach(function(x) { x.classList.remove('active'); });
        b.classList.add('active');
        update();
      });
    });
    host.querySelector('#c2S').addEventListener('input', function() { state.S = parseInt(this.value, 10); update(); });
    host.querySelector('#c2a').addEventListener('input', function() {
      state.a = parseInt(this.value, 10) / 100;
      if (state.a + state.b > 0.95) { state.b = 0.95 - state.a; host.querySelector('#c2b').value = Math.round(state.b * 100); }
      update();
    });
    host.querySelector('#c2b').addEventListener('input', function() {
      state.b = parseInt(this.value, 10) / 100;
      if (state.a + state.b > 0.95) { state.b = 0.95 - state.a; this.value = Math.round(state.b * 100); }
      update();
    });
    host.querySelector('#c2m').addEventListener('input', function() { state.min = parseInt(this.value, 10); update(); });
    update();
  }
  function update() {
    var es = LANG === 'es';
    var tot = 0, totd = 0, m;
    for (m = 1; m <= M; m++) { tot += rec(m); totd += dis(m); }
    var tg = tightest(), cl = creditLine();
    host.querySelector('#c2Sl').textContent = money(state.S);
    host.querySelector('#c2al').textContent = pctS(state.a) + (es ? ' por ciento' : ' percent');
    host.querySelector('#c2bl').textContent = pctS(state.b) + (es ? ' por ciento' : ' percent');
    host.querySelector('#c2ml').textContent = money(state.min);
    host.querySelector('#c2t').textContent  = pctS(tail()) + (es ? ' por ciento' : ' percent');
    host.querySelector('#c2r').textContent  = money(tot);
    host.querySelector('#c2d').textContent  = money(totd);
    host.querySelector('#c2w').textContent  = (es ? 'mes ' : 'month ') + intN(tg.m);
    host.querySelector('#c2lb').textContent = money(tg.bal);
    host.querySelector('#c2cl').textContent = money(cl);
    host.querySelector('#c2steps').textContent = es
      ? 'La cobranza de un mes junta tres ventas distintas: ' + pctS(state.a) + ' por ciento de la del mes, ' + pctS(state.b) + ' por ciento de la del mes anterior y ' + pctS(tail()) + ' por ciento de la de hace dos meses  ·  ' +
        'los pagos del mes corresponden a la compra que surtirá la venta del mes siguiente  ·  ' +
        'el saldo de cada mes es el del mes anterior más lo cobrado menos lo pagado  ·  ' +
        'la línea de crédito es lo que falta para no bajar del mínimo en el peor mes'
      : 'The collection of one month brings together three different sales: ' + pctS(state.a) + ' percent of the sale of the month, ' + pctS(state.b) + ' percent of the previous month and ' + pctS(tail()) + ' percent of the one two months back  ·  ' +
        'the payments of the month belong to the purchase that will supply next month sales  ·  ' +
        'the balance of each month is the previous one plus what is collected less what is paid  ·  ' +
        'the credit line is what is missing to stay above the floor in the worst month';
    var g = fitCanvas(host.querySelector('#c2cv'), 185);
    var step = function(x) { return Math.max(1, Math.min(M, Math.round(x))); };
    if (state.view === 'balance') {
      drawCurveChart(g, 1, M, [
        { f: function(x) { return endBal(step(x)); }, kind: 'green', label: (es ? 'Saldo al cierre del mes' : 'Balance at the close of the month') }
      ], {
        at: tg.m,
        fmtY: function(v) { return money(v); }, fmtX: function(v) { return intN(v); },
        hline: { y: state.min, label: (es ? 'Saldo mínimo' : 'Minimum balance') },
        marks: [{ x: tg.m, y: tg.bal, label: money(tg.bal), kind: 'bad' }],
        xLabel: (es ? 'mes del plan' : 'month of the plan')
      });
    } else {
      drawCurveChart(g, 1, M, [
        { f: function(x) { return rec(step(x)); }, kind: 'green', label: (es ? 'Cobranza' : 'Collections') },
        { f: function(x) { return dis(step(x)); }, kind: 'gold',  label: (es ? 'Pagos' : 'Payments') }
      ], {
        at: tg.m, yFloor: 0,
        fmtY: function(v) { return money(v); }, fmtX: function(v) { return intN(v); },
        xLabel: (es ? 'mes del plan' : 'month of the plan')
      });
    }
    var short = cl > 0;
    host.querySelector('#c2read').innerHTML = es
      ? '<strong>Lectura de negocio:</strong> con ' + pctS(state.a) + ' por ciento cobrado dentro del mes, el plan junta ' + money(tot) + ' de cobranza contra ' + money(totd) + ' de pagos en los seis meses. El mes más apretado es el ' + intN(tg.m) + ', con un saldo de ' + money(tg.bal) + '. ' +
        (short
          ? 'Como el mínimo de operación es ' + money(state.min) + ', hay que negociar una línea de crédito de ' + money(cl) + ' antes de que empiece el periodo, no cuando el hueco aparezca.'
          : 'Como el saldo se mantiene por encima del mínimo de ' + money(state.min) + ' en los seis meses, el plan se financia solo y la línea de crédito puede quedarse sin usar.') + ' ' +
        'Dos usos inmediatos. El primero es que el presupuesto de efectivo se negocia antes, no después: un banco presta con calma en agosto lo que cobra caro en diciembre. El segundo es que casi todas las palancas para cerrar el hueco están en la propia empresa y no en el banco, porque el saldo mejora si se cobra más rápido, si se pacta pagar a los proveedores más tarde o si se modera el ritmo al que crece el plan. Un plan de crecimiento agresivo consume caja precisamente cuando parece que va mejor.'
      : '<strong>Business reading:</strong> with ' + pctS(state.a) + ' percent collected within the month, the plan gathers ' + money(tot) + ' of collections against ' + money(totd) + ' of payments over the six months. The tightest month is month ' + intN(tg.m) + ', with a balance of ' + money(tg.bal) + '. ' +
        (short
          ? 'Since the operating floor is ' + money(state.min) + ', a credit line of ' + money(cl) + ' has to be negotiated before the period starts, not when the hole shows up.'
          : 'Since the balance stays above the floor of ' + money(state.min) + ' in all six months, the plan finances itself and the credit line can go unused.') + ' ' +
        'Two immediate uses. The first is that a cash budget is negotiated in advance and not afterwards: a bank lends calmly in August what it charges dearly for in December. The second is that nearly every lever for closing the hole sits inside the company rather than at the bank, because the balance improves if collection is faster, if suppliers are paid later by agreement, or if the pace of the plan is moderated. An aggressive growth plan eats cash precisely when it looks like it is going well.';
  }
  widgets.push(mount);
  mount();
}

/* ════════════════════════════════════════════════════════════════════════
   WIDGET 3 · the budget the volume actually reached would have authorised
   ════════════════════════════════════════════════════════════════════════ */
function widgetFlexibleBudget(F0, v0, Ub0, Ua0) {
  var host = document.createElement('div');
  host.className = 'section';
  document.getElementById('lessonBody').appendChild(host);
  var state = { view: 'cost', F: F0, v: v0, va: Math.round(v0 * 1.08), Ub: Ub0, Ua: Ua0 };
  function staticCost() { return flexBudget(state.F, state.v, state.Ub); }
  function flexCost()   { return flexBudget(state.F, state.v, state.Ua); }
  function actualCost() { return flexBudget(state.F, state.va, state.Ua); }
  function volVar()     { return volumeVariance(state.v, state.Ua, state.Ub); }
  function spVar()      { return spendingVariance(actualCost(), state.F, state.v, state.Ua); }
  function totVar()     { return actualCost() - staticCost(); }
  function mount() {
    var es = LANG === 'es';
    var MODES = [
      { id: 'cost', es: 'Costo total contra volumen', en: 'Total cost against volume' },
      { id: 'unit', es: 'Costo por unidad', en: 'Cost per unit' }
    ];
    var tabs = MODES.map(function(m) {
      return '<button class="mtab' + (m.id === state.view ? ' active' : '') + '" data-m="' + m.id + '">' + m[LANG] + '</button>';
    }).join('');
    host.innerHTML =
      '<div class="gcrd" data-widget="presupuesto-flexible-y-variaciones">' +
        '<div class="iw-head"><span class="iw-tag">' + (es ? 'Herramienta' : 'Tool') + '</span>' +
        '<span class="iw-title">' + (es ? 'El presupuesto original es un punto, no una línea' : 'The original budget is a point, not a line') + '</span></div>' +
        '<div class="iw-sub">' + (es
          ? 'La línea verde es lo que el presupuesto habría autorizado para cada volumen posible; la marca dorada es el único volumen que se aprobó al principio. Mueve las unidades reales dejando quietos los costos y observa lo que pasa: la variación contra el presupuesto original cambia sola, sin que nadie haya gastado mejor ni peor. Esa parte es la variación por volumen y no dice nada sobre la gestión. Ahora regresa las unidades a su lugar y mueve el costo variable real: ahora sí se separan las dos líneas, y esa separación es la variación en gasto, que es la que sí tiene dueño. Mira también la vista de costo por unidad y entenderás por qué comparar el costo unitario de dos meses con volúmenes distintos es una trampa: el costo fijo repartido entre más unidades baja el promedio aunque nadie haya hecho nada distinto.'
          : 'The green line is what the budget would have authorised for every possible volume; the golden mark is the single volume approved at the start. Move the actual units while leaving the costs alone and watch what happens: the variance against the original budget moves on its own, without anybody having spent better or worse. That part is the volume variance and it says nothing about management. Now put the units back and move the actual variable cost: this time the two lines separate, and that separation is the spending variance, which does have an owner. Look at the cost per unit view as well and you will see why comparing the unit cost of two months with different volumes is a trap: the fixed cost spread over more units pulls the average down even when nobody has done anything differently.') + '</div>' +
        '<div class="mtabs">' + tabs + '</div>' +
        '<div class="cgrid"><div class="cg">' +
          '<label>' + (es ? 'Unidades presupuestadas' : 'Budgeted units') + ': <span class="cval" id="f3ubl"></span></label>' +
          '<input type="range" min="4000" max="20000" step="500" id="f3ub" value="' + state.Ub + '">' +
        '</div><div class="cg">' +
          '<label>' + (es ? 'Unidades realmente producidas' : 'Units actually produced') + ': <span class="cval" id="f3ual"></span></label>' +
          '<input type="range" min="4000" max="20000" step="500" id="f3ua" value="' + state.Ua + '">' +
        '</div></div>' +
        '<div class="cgrid"><div class="cg">' +
          '<label>' + (es ? 'Costo variable presupuestado por unidad' : 'Budgeted variable cost per unit') + ': <span class="cval" id="f3vl"></span></label>' +
          '<input type="range" min="30" max="160" step="5" id="f3v" value="' + state.v + '">' +
        '</div><div class="cg">' +
          '<label>' + (es ? 'Costo variable real por unidad' : 'Actual variable cost per unit') + ': <span class="cval" id="f3val"></span></label>' +
          '<input type="range" min="30" max="200" step="5" id="f3va" value="' + state.va + '">' +
        '</div></div>' +
        '<canvas class="iw-canvas" id="f3cv"></canvas>' +
        '<div class="dlist" id="f3steps"></div>' +
        '<div class="metrics">' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Presupuesto original' : 'Original budget') + '</div><div class="mnum cs" id="f3st"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Presupuesto flexible' : 'Flexible budget') + '</div><div class="mnum ps" id="f3fx"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Costo real' : 'Actual cost') + '</div><div class="mnum ts" id="f3ac"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Variación por volumen' : 'Volume variance') + '</div><div class="mnum ts" id="f3vv"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Variación en gasto' : 'Spending variance') + '</div><div class="mnum cs" id="f3sv"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Variación total' : 'Total variance') + '</div><div class="mnum ps" id="f3tv"></div></div>' +
        '</div>' +
        '<div class="iw-read" id="f3read"></div>' +
      '</div>';
    host.querySelectorAll('.mtab').forEach(function(b) {
      b.addEventListener('click', function() {
        state.view = b.getAttribute('data-m');
        host.querySelectorAll('.mtab').forEach(function(x) { x.classList.remove('active'); });
        b.classList.add('active');
        update();
      });
    });
    host.querySelector('#f3ub').addEventListener('input', function() { state.Ub = parseInt(this.value, 10); update(); });
    host.querySelector('#f3ua').addEventListener('input', function() { state.Ua = parseInt(this.value, 10); update(); });
    host.querySelector('#f3v').addEventListener('input',  function() { state.v  = parseInt(this.value, 10); update(); });
    host.querySelector('#f3va').addEventListener('input', function() { state.va = parseInt(this.value, 10); update(); });
    update();
  }
  function update() {
    var es = LANG === 'es';
    var vw = es ? varEs : varEn;
    host.querySelector('#f3ubl').textContent = intN(state.Ub) + (es ? ' unidades' : ' units');
    host.querySelector('#f3ual').textContent = intN(state.Ua) + (es ? ' unidades' : ' units');
    host.querySelector('#f3vl').textContent  = money(state.v);
    host.querySelector('#f3val').textContent = money(state.va);
    host.querySelector('#f3st').textContent  = money(staticCost());
    host.querySelector('#f3fx').textContent  = money(flexCost());
    host.querySelector('#f3ac').textContent  = money(actualCost());
    host.querySelector('#f3vv').textContent  = vw(volVar());
    host.querySelector('#f3sv').textContent  = vw(spVar());
    host.querySelector('#f3tv').textContent  = vw(totVar());
    host.querySelector('#f3steps').textContent = es
      ? 'El presupuesto original autorizó ' + money(staticCost()) + ' para ' + intN(state.Ub) + ' unidades  ·  ' +
        'para las ' + intN(state.Ua) + ' unidades que sí se hicieron habría autorizado ' + money(flexCost()) + '  ·  ' +
        'el costo real fue ' + money(actualCost()) + '  ·  ' +
        'la diferencia entre los dos presupuestos es volumen y la diferencia contra el real es gasto'
      : 'The original budget authorised ' + money(staticCost()) + ' for ' + intN(state.Ub) + ' units  ·  ' +

        xLabel: (es ? 'unidades' : 'units')
      });
    } else {
      drawCurveChart(g, Math.max(500, xMax * 0.12), xMax, [
        { f: function(u) { return flexBudget(state.F, state.v, u) / u; },  kind: 'green', label: (es ? 'Costo unitario presupuestado' : 'Budgeted cost per unit') },
        { f: function(u) { return flexBudget(state.F, state.va, u) / u; }, kind: 'gold',  label: (es ? 'Costo unitario real' : 'Actual cost per unit') }
      ], {
        at: state.Ua,
        fmtY: function(v) { return money(v); }, fmtX: function(v) { return intN(v); },
        asym: { y: state.v, label: (es ? 'Piso: solo el costo variable' : 'Floor: the variable cost alone') },
        xLabel: (es ? 'unidades' : 'units')

    var ww = es ? varWordEs : varWordEn;
    host.querySelector('#f3read').innerHTML = es
      ? '<strong>Lectura de negocio:</strong> el reporte que llega a la dirección suele traer una sola cifra, la variación total de ' + vw(totVar()) + ', y esa cifra mezcla dos cosas que no se parecen. La parte de volumen, ' + vw(volVar()) + ', apareció porque se produjeron ' + intN(Math.abs(state.Ua - state.Ub)) + ' unidades ' + (state.Ua >= state.Ub ? 'más' : 'menos') + ' de las presupuestadas, y de eso responde ventas o la planeación de la demanda, no el jefe de planta. La parte de gasto, ' + vw(spVar()) + ', es la única que mide si cada unidad costó lo que debía costar. ' +
        'De aquí sale la regla de oro del control presupuestal: antes de juzgar a nadie, hay que flexibilizar el presupuesto al volumen que realmente ocurrió. Y hay que hacerlo bien, porque el error más común consiste en escalar también el costo fijo. El costo fijo de ' + money(state.F) + ' no se mueve cuando cambian las unidades, y multiplicarlo por la razón de volúmenes inventa una autorización que nunca existió y convierte una variación ' + ww(spVar()) + ' en cualquier otra cosa.'
      : '<strong>Business reading:</strong> the report that reaches the board usually carries a single figure, the total variance of ' + vw(totVar()) + ', and that figure mixes two things that have nothing in common. The volume part, ' + vw(volVar()) + ', appeared because ' + intN(Math.abs(state.Ua - state.Ub)) + ' units ' + (state.Ua >= state.Ub ? 'more' : 'fewer') + ' than budgeted were produced, and that belongs to sales or to demand planning, not to the plant manager. The spending part, ' + vw(spVar()) + ', is the only one measuring whether each unit cost what it was supposed to cost. ' +
        'From this comes the golden rule of budget control: before judging anybody, flex the budget to the volume that actually happened. And it has to be done properly, because the most common error is to scale the fixed cost as well. The fixed cost of ' + money(state.F) + ' does not move when the units change, and multiplying it by the ratio of volumes invents an authorisation that never existed and turns a ' + ww(spVar()) + ' variance into something else entirely.';
  }
  widgets.push(mount);
  mount();
}

          : 'Management asks for a profit and the budget has to translate it into something that can be sold. Move the target and watch the mark of the required volume slide while the breakeven point stays where it was: breakeven depends on the fixed cost and the margin, not on the ambition of the year. Then move the variable cost per unit closer to the price and you will see what is genuinely frightening in a budget: as the contribution margin narrows, both marks travel to the right together, faster and faster, because each unit contributes less towards covering the same amount. The green band between the two marks is the margin of safety, that is how much the plan can miss before the budget stops being a target and turns into a loss.') + '</div>' +

          '<div class="metric"><div class="mlbl">' + (es ? 'Margen de contribución unitario' : 'Contribution margin per unit') + '</div><div class="mnum cs" id="t4cm"></div></div>' +

      '<p>Un presupuesto es un plan de operación escrito en unidades y en pesos antes de que el periodo empiece. No es un pronóstico y tampoco es un deseo: es un compromiso con cifras que después servirá para medir lo que ocurrió. Todo el edificio se construye en un orden fijo, y ese orden importa más que cualquier fórmula. La primera pieza es siempre el <strong>presupuesto de ventas</strong>, porque es la demanda la que decide cuánto hay que fabricar, cuánto material hay que comprar y cuánta gente hay que contratar. Presupuestar en el orden contrario, partiendo de lo que la planta puede producir, es la forma más común de acumular inventario que nadie pidió.</p>' +
      '<p>La segunda pieza es el <strong>presupuesto de producción</strong>, y aquí aparece la primera sorpresa del tema: casi nunca coincide con el de ventas. La planta tiene que surtir lo que se venderá en el periodo y además dejar en almacén la existencia que la política de inventarios exige para el periodo siguiente, pero ya cuenta con lo que quedó del periodo anterior. Las unidades por producir son entonces las que se venderán, más la existencia final que se desea, menos la existencia inicial con la que se abre.</p>' +
      '<p>La política de inventario final suele expresarse como un porcentaje de las ventas del periodo que viene, y esa redacción tiene una consecuencia que conviene ver con calma. Si el plan de ventas crece, la existencia que hay que dejar es mayor que la que se recibió, de modo que la producción queda por encima de las ventas. Si el plan decrece, ocurre lo contrario y la planta fabrica menos de lo que vende porque el almacén aporta la diferencia. La política no cambia el sentido del negocio, pero sí amplifica lo que el crecimiento ya venía haciendo.</p>' +
      '<p>Hay un detalle de construcción que vale más que muchas fórmulas: la existencia final de un periodo es la existencia inicial del siguiente. Los periodos quedan encadenados y por eso un presupuesto trimestral no se puede armar tomando cada trimestre por separado. Ese encadenamiento es también el que obliga a presupuestar un trimestre más allá del horizonte que se quiere planear, porque para cerrar el último trimestre hace falta conocer las ventas del que sigue.</p>' +
      '<div class="rules-grid">' +
        '<div class="rcard"><div class="rname">Presupuesto de ventas</div><div class="rform">Ingreso = V · precio</div><div class="rnote">La primera pieza y la que manda.</div></div>' +

    return '' +
