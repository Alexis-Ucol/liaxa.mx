<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fórmulas para Perímetro y Área de Polígonos y Círculo</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }

/* ── WIDGETS DE ESTA GUÍA (perímetro y área) ── */
.iw-tag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.4rem; }
.iw-box { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; padding:1rem; }
.iw-sub { font-size:.88rem; color:var(--text2); margin-bottom:.7rem; }
.rondas { font-family:'IBM Plex Mono',monospace; font-size:.7rem; color:var(--text3); letter-spacing:.08em; text-transform:uppercase; margin-bottom:.45rem; }
.rfb { font-size:.84rem; margin-top:.6rem; min-height:1.35rem; color:var(--text2); }
.rfb b { color:var(--green-dark); }
.okmsg { color:var(--ok); font-weight:700; }
.rverify-btn { background:var(--green); color:#fff; border:none; border-radius:8px; padding:.6rem 1.2rem; font-size:.86rem; font-weight:600; cursor:pointer; min-height:44px; margin-top:.7rem; font-family:inherit; }
.rverify-btn:hover { background:var(--green-dark); }
.goalbar { font-size:.83rem; color:var(--text2); background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.45rem .7rem; margin-bottom:.65rem; }
.gcanvas { display:block; width:100%; height:250px; border:1px solid var(--border); border-radius:8px; background:var(--surface); touch-action:manipulation; cursor:pointer; }
.krow { display:flex; align-items:center; gap:.6rem; margin-top:.7rem; flex-wrap:wrap; }
.krow input[type=range] { flex:1; min-width:130px; accent-color:var(--green); height:34px; }
.klbl { font-size:.78rem; color:var(--text3); min-width:84px; }
.kval { font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:.95rem; color:var(--green); min-width:52px; text-align:right; }
.livelbl { margin-top:.55rem; font-size:.88rem; color:var(--text2); }
.livelbl b { color:var(--green-dark); }
.statline { margin-top:.35rem; font-size:.84rem; color:var(--text3); }
.defgrid { display:grid; grid-template-columns:repeat(2,1fr); gap:.6rem; margin:1rem 0; }
.defcell { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.75rem; border-top:3px solid var(--green); }
.defname { font-size:.72rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.25rem; }
.deftxt { font-size:.82rem; color:var(--text2); }
.stepslist { margin:.9rem 0 0; padding-left:1.1rem; }
.stepslist li { font-size:.86rem; color:var(--text2); margin-bottom:.35rem; }
@media (max-width: 600px) {
  .defgrid { grid-template-columns:1fr; }
  .gcanvas { height:230px; }
  .klbl { min-width:66px; font-size:.74rem; }
}
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Fórmulas para Perímetro y Área de Polígonos y Círculo</div>
    <div class="wcourse" id="wcourse-el">Matemáticas · 1° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Fórmulas para Perímetro y Área de Polígonos y Círculo</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">

/* ── Attempt counter + seed (Rule 4): seed = name+group+attempt ── */
function getAttemptKey(name, group){ return 'liaxa_mat1_t11_g02__att__' + (name+'__'+group).replace(/\s+/g,'_'); }
function nextAttempt(name, group){ var k=getAttemptKey(name,group),n=0; try{n=parseInt(localStorage.getItem(k)||'0',10)||0;}catch(e){} n++; try{localStorage.setItem(k,String(n));}catch(e){} return n; }
function currentAttempt(name, group){ var k=getAttemptKey(name,group); try{return parseInt(localStorage.getItem(k)||'1',10)||1;}catch(e){return 1;} }

var studentData   = {};
var problems      = [];

/* ================================================
   SESSION PERSISTENCE  (localStorage)
   ================================================ */
function lsKey() {
  var n = (studentData.name  || '').trim();
  var g = (studentData.group || '').trim();
  return 'liaxa_mat1_t11_g02__' + (n + '__' + g).replace(/\s+/g, '_');
}

function saveSession() {
  if (!studentData.name) return;
  var drawings = [], texts = [], photos = [];
  problems.forEach(function(p, i) {
    var dc = document.getElementById('dc' + i);
    if (dc && dc.width) {
      var blank = document.createElement('canvas');
      blank.width = dc.width; blank.height = dc.height;
      drawings.push(dc.toDataURL() === blank.toDataURL() ? null : dc.toDataURL('image/png'));
    } else { drawings.push(null); }
    var ta = document.getElementById('ta' + i);
    texts.push(ta ? ta.value : '');
    var pp = document.getElementById('pp' + i);
    photos.push((pp && pp.src && pp.src.indexOf('data:') === 0) ? pp.src : null);
  });
  var state = {
    name: studentData.name, group: studentData.group,
    answeredCount: answeredCount, correctCount: correctCount,
    choices: problems.map(function(p) { return p.studentChoice; }),
    drawings: drawings, texts: texts, photos: photos
  };
  try { localStorage.setItem(lsKey(), JSON.stringify(state)); } catch(e) {}
}

function loadSession(name, group) {
  var key = 'liaxa_mat1_t11_g02__' + (name + '__' + group).replace(/\s+/g, '_');
  try { var r = localStorage.getItem(key); return r ? JSON.parse(r) : null; } catch(e) { return null; }
}

function restoreSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  var saved = loadSession(name, group);
  if (!saved) return;
  document.getElementById('restoreBar').style.display = 'none';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = currentAttempt(name, group);
  buildLesson(seededRng(name + group + att));
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
  saved.choices.forEach(function(choice, idx) {
    if (choice !== null && choice !== undefined) confirmMC(idx, choice);
  });
  setTimeout(function() {
    if (saved.drawings) {
      saved.drawings.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var dc = document.getElementById('dc' + i);
        if (!dc || !dc.width) return;
        var img = new Image();
        img.onload = function() {
          var dpr = window.devicePixelRatio || 1;
          dc.getContext('2d').drawImage(img, 0, 0, dc.width / dpr, dc.height / dpr);
        };
        img.src = dataUrl;
      });
    }
    if (saved.texts) {
      saved.texts.forEach(function(text, i) {
        if (!text) return;
        var ta = document.getElementById('ta' + i);
        if (ta) ta.value = text;
      });
    }
    if (saved.photos) {
      saved.photos.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var pp = document.getElementById('pp' + i);
        if (!pp) return;
        pp.src = dataUrl; pp.style.display = 'block';
        var pz = document.getElementById('pz' + i);
        if (pz) pz.style.opacity = '0.4';
      });
    }
  }, 300);
}

function dismissRestore() {
  document.getElementById('restoreBar').style.display = 'none';
}

function checkForSavedSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  if (!name || !group) { document.getElementById('restoreBar').style.display = 'none'; return; }
  var saved = loadSession(name, group);
  var bar = document.getElementById('restoreBar');
  bar.style.display = (saved && saved.choices && saved.choices.some(function(c){ return c !== null; })) ? 'block' : 'none';
}

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS — INJECTION BLOCK ─────────────────────────────────────────

      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/\u2192/g,'->').replace(/\u2212/g,'-').replace(/\u00b2/g,'^2')
      .replace(/\u00b3/g,'^3').replace(/\u00d7/g,'x').replace(/\u00f7/g,'/')

    doc.setTextColor(26,106,74); doc.setFontSize(8); doc.setFont('helvetica','normal');
    coLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    ay += coLines.length*5 + 3;
    doc.setTextColor(90,85,80); doc.setFontSize(7.5);
    exLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    wy += ansBoxH + 5;

    doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
    doc.setFontSize(7); doc.setFont('helvetica','bold');
    doc.rect(M,wy,TW,8,'F'); doc.text('TRABAJO DEL ALUMNO', M+4, wy+5.5);
    wy += 11;

    var dc = document.getElementById('dc'+i);
    if (dc) {
      try {
        var imgD = dc.toDataURL('image/png');
        var ar   = dc.height / dc.width;
        var iw   = TW;
        var ih   = Math.min(iw * ar, 68);
        doc.addImage(imgD, 'PNG', M, wy, iw, ih);
        wy += ih + 4;
      } catch(e) {}
    }

    var ta = document.getElementById('ta'+i);
    if (ta && ta.value.trim()) {
      if (wy > PH-30) { doc.addPage(); wy = 20; }
      doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('courier','normal');
      var taLines = doc.splitTextToSize(ta.value, TW);
      taLines.slice(0,16).forEach(function(ln) {
        if (wy > PH-15) { doc.addPage(); wy = 20; }
        doc.text(ln, M, wy); wy += 5;
      });
      wy += 2;
    }

    var pp = document.getElementById('pp'+i);
    if (pp && pp.src && pp.src.indexOf('data:') === 0) {
      if (wy > PH-55) { doc.addPage(); wy = 20; }
      try { doc.addImage(pp.src, 'JPEG', M, wy, TW, 68); wy += 72; } catch(e) {}
    }
  }

  // ── Footer on every page ──
  var pages = doc.internal.getNumberOfPages();
  for (var p = 1; p <= pages; p++) {
    doc.setPage(p);
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0, PH-3, PW, 3, 'F');
    doc.setTextColor(130,140,160); doc.setFontSize(6.5); doc.setFont('helvetica','normal');
    doc.text(name+'  ·  '+group+'  ·  Código: '+code+'  ·  Página '+p+'/'+pages,
      PW/2, PH-5, {align:'center'});
  }

  doc.save('mat1_t11_g02_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf');
  btn.innerHTML = '⬇ &nbsp;Descargar Resultados PDF';
  btn.disabled  = false;
}

/* ================================================
   buildLesson — OVERRIDE IN EACH GUIDE
   ================================================ */
function buildLesson(rng) {
  var LB = document.getElementById('lessonBody');
  LB.innerHTML = '';
  problems = [];

  /* ============================================================
     HELPERS
     ============================================================ */
  function T(o){
    if (o === undefined || o === null) return '';
    if (typeof o === 'string' || typeof o === 'number') return o;
    if (Object.prototype.toString.call(o) === '[object Array]') return o;
    return (o[LANG] !== undefined ? o[LANG] : o.es);
  }
  function ri(a,b){ return a + Math.floor(rng()*(b-a+1)); }
  function shufA(arr){
    var a = arr.slice(), i, j, t;
    for (i=a.length-1;i>0;i--){ j=Math.floor(rng()*(i+1)); t=a[i]; a[i]=a[j]; a[j]=t; }
    return a;
  }
  function sec(tag, title, html){
    var d = document.createElement('div');
    d.className = 'section';
    d.innerHTML = '<div class="stag">'+tag+'</div><h2>'+title+'</h2>'+(html||'');
    LB.appendChild(d);
    return d;
  }
  function widget(kind){
    var d = document.createElement('div');
    d.className = kind + 'wrap section';
    d.setAttribute('data-widget', kind);
    d.id = 'w' + kind;
    LB.appendChild(d);
    return d;
  }
  function cssv(n){
    try { var v = getComputedStyle(document.documentElement).getPropertyValue(n); return v ? v.trim() : ''; }
    catch(e){ return ''; }
  }
  function fitCv(cv){
    var dpr = window.devicePixelRatio || 1;
    var w = cv.clientWidth || 330;
    var h = cv.clientHeight || 250;
    cv.width  = Math.round(w*dpr);
    cv.height = Math.round(h*dpr);
    var ctx = cv.getContext('2d');
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,w,h);
    return { ctx:ctx, w:w, h:h };
  }
  function fmt(x){
    var r = Math.round(x*100)/100;
    return (Math.abs(r - Math.round(r)) < 1e-9) ? String(Math.round(r)) : String(r);
  }
  function mf(n,d){
    return '<span class="mf-outer"><span class="mf-num">'+n+'</span><span class="mf-den">'+d+'</span></span>';
  }
  function opts4(correct, cands){
    var out = [String(correct)], i, s;
    for (i=0;i<cands.length && out.length<4;i++){
      s = String(cands[i]);
      if (out.indexOf(s) === -1 && s !== 'NaN') out.push(s);
    }
    var k = 1;
    while (out.length < 4){
      s = fmt(Number(correct) + k);
      if (out.indexOf(s) === -1) out.push(s);
      s = fmt(Number(correct) - k);
      if (out.length < 4 && out.indexOf(s) === -1 && Number(correct) - k > 0) out.push(s);
      k++;
    }
    return out;
  }
  function addProb(spec){
    var so  = shufA(T(spec.options));
    var cor = T(spec.correct);
    problems.push({
      title: T(spec.title),
      questionText: T(spec.q),
      fn: '',
      hint: T(spec.hint),
      explanation: T(spec.exp),
      options: so,
      correctIdx: so.indexOf(cor),
      showWork: !!spec.showWork,
      studentChoice: null,
      pendingChoice: null
    });
    buildOneCard(problems[problems.length-1], problems.length-1);
  }
  var POLY = {
    es:['','','','triángulo','cuadrado','pentágono','hexágono','heptágono','octágono','eneágono','decágono'],
    en:['','','','triangle','square','pentagon','hexagon','heptagon','octagon','nonagon','decagon']
  };
  function polyName(n){ return (POLY[LANG] || POLY.es)[n] || POLY.es[n]; }

  /* ============================================================
     VALORES SEMBRADOS (en orden fijo, para que el idioma no altere el seed)
     ============================================================ */
  var v1=Math.floor(rng()*2), v2=Math.floor(rng()*2), v3=Math.floor(rng()*2), v4=Math.floor(rng()*2), v5=Math.floor(rng()*2);
  var v6=Math.floor(rng()*2), v7=Math.floor(rng()*2), v8=Math.floor(rng()*2), v9=Math.floor(rng()*2), v10=Math.floor(rng()*2);

  var b1 = ri(7,12), h1 = 2*ri(2,3);
  var A1 = b1*h1, Pe1 = 2*(b1+h1);

  var b2 = ri(4,9), h2 = ri(3,8);
  var A2 = b2*h2, Pe2 = 2*(b2+h2);

  var W3 = ri(8,11), H3 = ri(6,9), w3 = ri(2,4), hh3 = ri(2,3);
  var A3 = W3*H3 - w3*hh3;
  var sq3 = ri(3,5), A3b = W3*H3 + sq3*sq3;

  var s4 = [ri(6,9), ri(11,14), ri(4,5), ri(16,19), ri(21,24)];
  var S4 = s4[0]+s4[1]+s4[2]+s4[3]+s4[4];

  var b5 = 2*ri(3,7), h5 = ri(4,9), A5 = b5*h5/2;

  var n6 = ri(5,8), l6 = ri(4,9), Pe6 = n6*l6;

  var n7 = [5,6,8][Math.floor(rng()*3)], l7 = 2*ri(3,6), a7 = ri(4,9);
  var Pe7 = n7*l7, A7 = Pe7*a7/2;

  var d8 = 2*ri(3,10), r8 = d8/2, C8 = 3.14*d8;

  var r9 = ri(3,10), A9 = 3.14*r9*r9;

  var b10 = 2*ri(3,5), h10 = ri(3,7), l10 = h10 + ri(2,4);
  var A10 = b10*h10, Pe10 = 2*(b10+l10);

  /* ============================================================
     IDEA 1
     ============================================================ */
  sec(T({es:'Idea 1', en:'Idea 1'}),
      T({es:'Dos preguntas distintas sobre una misma figura', en:'Two different questions about the same figure'}),
      '<p>'+T({
        es:'De cualquier figura plana se pueden preguntar dos cosas muy distintas. La primera es cuánto mide su borde, o sea el camino que recorrerías si le dieras la vuelta completa caminando por la orilla. Ese número se llama perímetro y se mide en unidades de longitud: centímetros, metros, pasos.',
        en:'About any flat figure you can ask two very different things. The first is how long its border is, that is, the path you would walk if you went all the way around along the edge. That number is called the perimeter and it is measured in units of length: centimetres, metres, steps.'
      })+'</p>'+
      '<p>'+T({
        es:'La segunda es cuánta superficie cubre por dentro. Para contestarla se elige un cuadrito de una unidad por lado y se cuenta cuántos de esos cuadritos caben adentro sin huecos ni encimados. Ese conteo es el área y por eso se mide en unidades cuadradas. En un rectángulo el conteo se vuelve rápido: cada fila tiene tantos cuadritos como mide la base, y hay tantas filas como mide la altura.',
        en:'The second is how much surface it covers inside. To answer that you choose a little square one unit on each side and count how many of those little squares fit inside with no gaps and no overlaps. That count is the area, and that is why it is measured in square units. In a rectangle the counting becomes quick: each row holds as many little squares as the base measures, and there are as many rows as the height measures.'
      })+'</p>'+
      '<div class="rules-grid">'+
        '<div class="rcard"><div class="rname">'+T({es:'Perímetro del rectángulo',en:'Perimeter of a rectangle'})+'</div><div class="rform">P = 2 × (b + a)</div><div class="rnote">'+T({es:'Se recorren dos bases y dos alturas.',en:'Two bases and two heights are walked.'})+'</div></div>'+
        '<div class="rcard"><div class="rname">'+T({es:'Área del rectángulo',en:'Area of a rectangle'})+'</div><div class="rform">A = b × a</div><div class="rnote">'+T({es:'Filas iguales de cuadritos, una por cada unidad de altura.',en:'Equal rows of little squares, one per unit of height.'})+'</div></div>'+
        '<div class="rcard"><div class="rname">'+T({es:'Unidades',en:'Units'})+'</div><div class="rform">cm  ·  cm²</div><div class="rnote">'+T({es:'El borde va en unidades simples, la superficie en unidades cuadradas.',en:'The border goes in simple units, the surface in square units.'})+'</div></div>'+
        '<div class="rcard"><div class="rname">'+T({es:'Cuidado',en:'Watch out'})+'</div><div class="rform">P ≠ A</div><div class="rnote">'+T({es:'Dos figuras con el mismo perímetro pueden cubrir superficies muy distintas.',en:'Two figures with the same perimeter can cover very different surfaces.'})+'</div></div>'+
      '</div>');

  /* ---- MANIPULATIVO 1: constructor de rectángulos en cuadrícula ---- */
  (function(){
    var MAXB = 12, MAXH = 8;
    var G = [
      { k:'a', v: ri(3,6)*ri(3,5) },
      { k:'p', v: 2*(ri(4,9)+ri(2,7)) },
      { k:'a', v: ri(4,8)*ri(2,4) }
    ];
    var st = { r:0, tries:0, done:false, b:3, h:2 };
    var wrap = widget('rect');
    wrap.innerHTML =
      '<div class="iw-tag">'+T({es:'Constructor de rectángulos',en:'Rectangle builder'})+'</div>'+
      '<div class="iw-box">'+
        '<div class="iw-sub">'+T({
          es:'Mueve las barras para cambiar la base y la altura. El contorno dorado es el perímetro y los cuadritos verdes son el área.',
          en:'Move the sliders to change the base and the height. The gold outline is the perimeter and the green squares are the area.'})+'</div>'+
        '<div class="rondas" id="rcRound"></div>'+
        '<div class="goalbar" id="rcGoal"></div>'+
        '<canvas class="gcanvas" id="rcCv"></canvas>'+
        '<div class="krow"><span class="klbl">'+T({es:'Base',en:'Base'})+'</span><input type="range" id="rcB" min="1" max="'+MAXB+'" value="3"><span class="kval" id="rcBv">3</span></div>'+
        '<div class="krow"><span class="klbl">'+T({es:'Altura',en:'Height'})+'</span><input type="range" id="rcH" min="1" max="'+MAXH+'" value="2"><span class="kval" id="rcHv">2</span></div>'+
        '<div class="livelbl" id="rcLive"></div>'+
        '<button class="rverify-btn" id="rcBtn">'+T({es:'Comprobar',en:'Check'})+'</button>'+
        '<div class="rfb" id="rcFb"></div>'+
      '</div>';
    var cv = document.getElementById('rcCv');
    var sb = document.getElementById('rcB'), sh = document.getElementById('rcH');
    function goalTxt(){
      var g = G[st.r];
      return g.k === 'a'
        ? T({es:'Meta: arma un rectángulo cuya área sea ', en:'Goal: build a rectangle whose area is '})+g.v+T({es:' u².', en:' sq units.'})
        : T({es:'Meta: arma un rectángulo cuyo perímetro sea ', en:'Goal: build a rectangle whose perimeter is '})+g.v+T({es:' u.', en:' units.'});
    }
    function draw(){
      var g = fitCv(cv), i, j;
      var cell = Math.min((g.w-28)/MAXB, (g.h-28)/MAXH);
      var ox = 14, oy = g.h - 14 - MAXH*cell, ctx = g.ctx;
      ctx.strokeStyle = cssv('--border'); ctx.lineWidth = 1;
      for (i=0;i<=MAXB;i++){ ctx.beginPath(); ctx.moveTo(ox+i*cell, oy); ctx.lineTo(ox+i*cell, oy+MAXH*cell); ctx.stroke(); }
      for (j=0;j<=MAXH;j++){ ctx.beginPath(); ctx.moveTo(ox, oy+j*cell); ctx.lineTo(ox+MAXB*cell, oy+j*cell); ctx.stroke(); }
      ctx.fillStyle = cssv('--green-bg');
      ctx.fillRect(ox, oy+(MAXH-st.h)*cell, st.b*cell, st.h*cell);
      ctx.strokeStyle = cssv('--green'); ctx.lineWidth = 1;
      for (i=0;i<st.b;i++) for (j=0;j<st.h;j++) ctx.strokeRect(ox+i*cell, oy+(MAXH-j-1)*cell, cell, cell);
      ctx.strokeStyle = cssv('--gold'); ctx.lineWidth = 3;
      ctx.strokeRect(ox, oy+(MAXH-st.h)*cell, st.b*cell, st.h*cell);
    }
    function live(){
      var A = st.b*st.h, P = 2*(st.b+st.h);
      document.getElementById('rcBv').textContent = st.b;
      document.getElementById('rcHv').textContent = st.h;
      document.getElementById('rcLive').innerHTML =
        T({es:'Perímetro: <b>',en:'Perimeter: <b>'})+P+T({es:' u</b>  ·  Área: <b>',en:' units</b>  ·  Area: <b>'})+A+T({es:' u²</b>',en:' sq units</b>'});
      if (st.done || st.r >= G.length) return;
      var g = G[st.r], cur = (g.k==='a') ? A : P;
      if (cur !== g.v) {
        document.getElementById('rcFb').textContent = (cur < g.v)
          ? T({es:'Vas en '+cur+' y la meta es '+g.v+': la figura se queda corta.', en:'You are at '+cur+' and the goal is '+g.v+': the figure falls short.'})
          : T({es:'Vas en '+cur+' y la meta es '+g.v+': la figura se pasó.', en:'You are at '+cur+' and the goal is '+g.v+': the figure went over.'});
      }
    }
    function solve(g){
      var b, h;
      for (b=1;b<=MAXB;b++) for (h=1;h<=MAXH;h++) if ((g.k==='a' ? b*h : 2*(b+h)) === g.v) return { b:b, h:h };
      return null;
    }
    function setRound(){
      document.getElementById('rcRound').textContent = T({es:'Ronda ',en:'Round '})+(st.r+1)+T({es:' de 3',en:' of 3'});
      document.getElementById('rcGoal').textContent = goalTxt();
      document.getElementById('rcFb').textContent = '';
      st.tries = 0; draw(); live();
    }
    function finish(){
      st.done = true;
      document.getElementById('rcRound').textContent = T({es:'Listo',en:'Done'});
      document.getElementById('rcGoal').textContent = T({es:'Las tres metas están hechas. Sigue moviendo las barras si quieres seguir explorando.', en:'The three goals are done. Keep moving the sliders if you want to keep exploring.'});
      document.getElementById('rcFb').innerHTML = '<span class="okmsg">🎉 '+T({es:'El borde y la superficie no crecen al mismo ritmo: ya lo comprobaste tres veces.', en:'The border and the surface do not grow at the same rate: you have now checked it three times.'})+'</span>';
    }
    sb.addEventListener('input', function(){ st.b = parseInt(sb.value,10); draw(); live(); });
    sh.addEventListener('input', function(){ st.h = parseInt(sh.value,10); draw(); live(); });
    document.getElementById('rcBtn').addEventListener('click', function(){
      if (st.done) return;
      var g = G[st.r], cur = (g.k==='a') ? st.b*st.h : 2*(st.b+st.h), fb = document.getElementById('rcFb');
      if (cur === g.v) {
        st.r++;
        if (st.r >= 3) { finish(); return; }
        fb.innerHTML = '<span class="okmsg">✓ '+T({es:'¡Meta lograda! Va la siguiente.',en:'Goal reached! Here comes the next one.'})+'</span>';
        setTimeout(setRound, 900);
        return;
      }
      st.tries++;
      if (st.tries >= 3) {
        var s = solve(g);
        if (s) { st.b = s.b; st.h = s.h; sb.value = s.b; sh.value = s.h; draw(); live(); }
        fb.innerHTML = T({
          es:'Una figura que cumple la meta es la de base <b>'+(s?s.b:'')+'</b> y altura <b>'+(s?s.h:'')+'</b>. Mírala armada en la cuadrícula.',
          en:'One figure that meets the goal has base <b>'+(s?s.b:'')+'</b> and height <b>'+(s?s.h:'')+'</b>. Look at it built on the grid.'});
        st.r++;
        if (st.r >= 3) { st.done = true; setTimeout(finish, 1700); return; }
        setTimeout(setRound, 1800);
        return;
      }
      fb.textContent = (cur < g.v)
        ? T({es:'Todavía no: vas en '+cur+' y necesitas '+g.v+'. Estira la figura.', en:'Not yet: you are at '+cur+' and you need '+g.v+'. Stretch the figure.'})
        : T({es:'Todavía no: vas en '+cur+' y necesitas '+g.v+'. Encógela un poco.', en:'Not yet: you are at '+cur+' and you need '+g.v+'. Shrink it a bit.'});
    });
    setRound();
  })();

  /* ---- PROBLEMA 1 ---- */
  addProb(v1 === 0 ? {
    title:{es:'El piso del patio', en:'The yard floor'},
    q:{es:'Un patio rectangular mide '+b1+' m de largo y '+h1+' m de ancho. Se va a cubrir todo el piso con loseta. ¿Cuántos metros cuadrados de loseta se necesitan?',
       en:'A rectangular yard is '+b1+' m long and '+h1+' m wide. The whole floor will be covered with tile. How many square metres of tile are needed?'},
    hint:{es:'Piensa en filas de losetas de 1 m por 1 m: cada fila tiene tantas losetas como el largo, y hay tantas filas como el ancho.',
          en:'Think of rows of 1 m by 1 m tiles: each row holds as many tiles as the length, and there are as many rows as the width.'},
    exp:{es:'El piso se llena con '+h1+' filas de '+b1+' losetas cada una, así que se multiplican las dos medidas: '+b1+' × '+h1+' = '+A1+' m².',
         en:'The floor is filled with '+h1+' rows of '+b1+' tiles each, so the two measurements are multiplied: '+b1+' × '+h1+' = '+A1+' m².'},
    options: opts4(A1, [Pe1, b1+h1, A1/2, A1+b1]),
    correct: String(A1), showWork:true
  } : {
    title:{es:'La cerca del patio', en:'The yard fence'},
    q:{es:'Un patio rectangular mide '+b1+' m de largo y '+h1+' m de ancho. Se va a poner una cerca que rodee el patio completo. ¿Cuántos metros de cerca se necesitan?',
       en:'A rectangular yard is '+b1+' m long and '+h1+' m wide. A fence will be put around the whole yard. How many metres of fence are needed?'},
    hint:{es:'La cerca camina por la orilla: pasa por el largo, el ancho, otra vez el largo y otra vez el ancho.',
          en:'The fence walks along the edge: it goes along the length, the width, the length again and the width again.'},
    exp:{es:'La cerca recorre los cuatro lados del patio: '+b1+' + '+h1+' + '+b1+' + '+h1+' = '+Pe1+' m.',
         en:'The fence runs along the four sides of the yard: '+b1+' + '+h1+' + '+b1+' + '+h1+' = '+Pe1+' m.'},
    options: opts4(Pe1, [b1+h1, A1, 2*b1+h1, b1+2*h1]),
    correct: String(Pe1), showWork:true
  });

  /* ---- PROBLEMA 2 ---- */
  addProb(v2 === 0 ? {
    title:{es:'La medida que falta', en:'The missing measurement'},
    q:{es:'Un mosaico rectangular tiene un área de '+A2+' cm² y su base mide '+b2+' cm. ¿Cuánto mide su altura?',
       en:'A rectangular tile has an area of '+A2+' cm² and its base measures '+b2+' cm. How tall is it?'},
    hint:{es:'La altura dice cuántas filas de cuadritos hay. Si conoces el total de cuadritos y cuántos hay por fila, la división te da el número de filas.',
          en:'The height tells how many rows of little squares there are. If you know the total number of little squares and how many there are per row, division gives you the number of rows.'},
    exp:{es:'Cada fila tiene '+b2+' cuadritos, así que se reparte el área entre la base: '+A2+' entre '+b2+' = '+h2+' cm.',
         en:'Each row holds '+b2+' little squares, so the area is shared among the base: '+A2+' divided by '+b2+' = '+h2+' cm.'},
    options: opts4(h2, [A2-b2, b2, 2*h2, h2+b2]),
    correct: String(h2), showWork:true
  } : {
    title:{es:'La medida que falta', en:'The missing measurement'},
    q:{es:'Un mosaico rectangular tiene un perímetro de '+Pe2+' cm y su base mide '+b2+' cm. ¿Cuánto mide su altura?',
       en:'A rectangular tile has a perimeter of '+Pe2+' cm and its base measures '+b2+' cm. How tall is it?'},

      '<p>'+T({
        es:'El círculo no tiene lados que sumar, así que su contorno necesita otra idea. Si tomas cualquier círculo, mides el borde con un hilo y luego mides el diámetro, el hilo siempre cabe un poco más de tres veces sobre el diámetro. Y ese poco más es exactamente el mismo en un plato, en una moneda y en una alberca gigante. A ese número fijo se le llama pi, se escribe π y para trabajar suele usarse el valor aproximado 3.14.',
        en:'A circle has no sides to add, so its border needs another idea. If you take any circle, measure the border with a string and then measure the diameter, the string always fits a little more than three times along the diameter. And that little bit more is exactly the same on a plate, on a coin and in a giant pool. That fixed number is called pi, it is written π and for calculations the approximate value 3.14 is normally used.'
      })+'</p>'+
      '<p>'+T({
        es:'La superficie del círculo se descubre parecido al polígono regular: si lo partes en muchísimas rebanadas delgadas y las acomodas alternadas, la figura se endereza y se parece cada vez más a un rectángulo cuya base es la mitad del contorno y cuya altura es el radio. De ahí sale que el área se obtiene multiplicando π por el radio dos veces. Ojo con el dato que te dan: el radio llega del centro al borde, el diámetro cruza el círculo completo y mide el doble.',
        en:'The surface of the circle is discovered in a similar way to the regular polygon: if you split it into very many thin slices and lay them out alternately, the figure straightens out and looks more and more like a rectangle whose base is half of the border and whose height is the radius. From there the area comes out as π multiplied by the radius twice. Watch the data you are given: the radius goes from the centre to the border, the diameter crosses the whole circle and measures twice as much.'
      })+'</p>'+
      '<div class="rules-grid">'+
        '<div class="rcard"><div class="rname">'+T({es:'Circunferencia',en:'Circumference'})+'</div><div class="rform">C = π × d</div><div class="rnote">'+T({es:'El contorno mide π veces el diámetro.',en:'The border measures π times the diameter.'})+'</div></div>'+
        '<div class="rcard"><div class="rname">'+T({es:'Con el radio',en:'Using the radius'})+'</div><div class="rform">C = 2 × π × r</div><div class="rnote">'+T({es:'El diámetro es el doble del radio.',en:'The diameter is twice the radius.'})+'</div></div>'+
        '<div class="rcard"><div class="rname">'+T({es:'Área del círculo',en:'Area of a circle'})+'</div><div class="rform">A = π × r × r</div><div class="rnote">'+T({es:'Rebanadas acomodadas como rectángulo.',en:'Slices laid out as a rectangle.'})+'</div></div>'+
        '<div class="rcard"><div class="rname">'+T({es:'Valor de π',en:'Value of π'})+'</div><div class="rform">π ≈ 3.14</div><div class="rnote">'+T({es:'Un poco más de tres diámetros, en cualquier círculo.',en:'A little more than three diameters, in any circle.'})+'</div></div>'+
      '</div>');

  /* ---- MANIPULATIVO 5: desenrolla la circunferencia ---- */
  (function(){
    var CG = [];
    (function(){
      var t1 = ri(2,9), t2 = ri(2,9), t3 = ri(2,9);
      CG = [ { k:'c', v: 6.28*t1 }, { k:'a', v: 3.14*t2*t2 }, { k:'c', v: 6.28*t3 } ];
    })();
    var st = { r:0, tries:0, done:false, rad:3 };
    var wrap = widget('circulo');
    wrap.innerHTML =
      '<div class="iw-tag">'+T({es:'Desenrolla la circunferencia',en:'Unroll the circumference'})+'</div>'+
      '<div class="iw-box">'+
        '<div class="iw-sub">'+T({
          es:'Cambia el radio y mira la barra de abajo: es el contorno del círculo estirado en línea recta, marcado con diámetros. Cuenta cuántos diámetros caben.',
          en:'Change the radius and look at the bar below: it is the border of the circle stretched out straight, marked off in diameters. Count how many diameters fit.'})+'</div>'+
        '<div class="rondas" id="ciRound"></div>'+
        '<div class="goalbar" id="ciGoal"></div>'+
        '<canvas class="gcanvas" id="ciCv"></canvas>'+
        '<div class="krow"><span class="klbl">'+T({es:'Radio',en:'Radius'})+'</span><input type="range" id="ciR" min="1" max="10" value="3"><span class="kval" id="ciRv">3</span></div>'+
        '<div class="livelbl" id="ciLive"></div>'+
        '<div class="statline" id="ciNote"></div>'+
        '<button class="rverify-btn" id="ciBtn">'+T({es:'Comprobar',en:'Check'})+'</button>'+
        '<div class="rfb" id="ciFb"></div>'+
      '</div>';
    var cv = document.getElementById('ciCv');
    var sr = document.getElementById('ciR');
    function circ(){ return 6.28*st.rad; }
    function ar(){ return 3.14*st.rad*st.rad; }
    function draw(){
      var g = fitCv(cv), ctx = g.ctx, i;
      var Rp = Math.min(7.5*st.rad, g.h*0.30);
      var cx = g.w/2, cy = g.h*0.36;
      ctx.fillStyle = cssv('--green-bg');
      ctx.beginPath(); ctx.arc(cx, cy, Rp, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = cssv('--green'); ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(cx, cy, Rp, 0, Math.PI*2); ctx.stroke();
      ctx.strokeStyle = cssv('--gold'); ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx+Rp, cy); ctx.stroke();
      ctx.fillStyle = cssv('--green-dark');
      ctx.beginPath(); ctx.arc(cx, cy, 3.5, 0, Math.PI*2); ctx.fill();
      var total = 6.28*Rp;
      var s = Math.min(1, (g.w-30)/total);
      var unit = 2*Rp*s, x0 = (g.w - total*s)/2, y0 = g.h - 34;
      ctx.strokeStyle = cssv('--border'); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x0, y0+16); ctx.lineTo(x0+total*s, y0+16); ctx.stroke();
      ctx.strokeStyle = cssv('--green'); ctx.lineWidth = 8;
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x0+total*s, y0); ctx.stroke();
      ctx.strokeStyle = cssv('--gold'); ctx.lineWidth = 2;
      for (i=0;i<=3;i++){
        var x = x0 + i*unit;
        if (x > x0 + total*s + 1) break;
        ctx.beginPath(); ctx.moveTo(x, y0-9); ctx.lineTo(x, y0+9); ctx.stroke();
      }
      ctx.fillStyle = cssv('--text3');
      ctx.font = '600 11px "IBM Plex Sans", sans-serif';
      ctx.textAlign = 'center';
      for (i=0;i<3;i++) ctx.fillText((i+1)+' d', x0 + i*unit + unit/2, y0+26);
    }
    function live(){
      document.getElementById('ciRv').textContent = st.rad;
      document.getElementById('ciLive').innerHTML =
        T({es:'Radio: <b>',en:'Radius: <b>'})+st.rad+T({es:' u</b>  ·  Diámetro: <b>',en:' units</b>  ·  Diameter: <b>'})+(2*st.rad)+
        T({es:' u</b>  ·  Contorno: <b>≈ ',en:' units</b>  ·  Border: <b>≈ '})+fmt(circ())+T({es:' u</b>',en:' units</b>'});
      document.getElementById('ciNote').textContent = T({
        es:'La barra mide 3 diámetros completos y sobra un pedacito: el área de este círculo es ≈ '+fmt(ar())+' u².',
        en:'The bar holds 3 whole diameters and a small piece is left over: the area of this circle is ≈ '+fmt(ar())+' sq units.'});
      if (st.done || st.r >= CG.length) return;
      var g = CG[st.r], cur = (g.k==='c') ? circ() : ar(), fb = document.getElementById('ciFb');
      if (Math.abs(cur - g.v) > 0.005) {
        fb.textContent = T({es:'Vas en '+fmt(cur)+' y la meta es '+fmt(g.v)+'.', en:'You are at '+fmt(cur)+' and the goal is '+fmt(g.v)+'.'});
      }
    }
    function solve(g){
      var r;
      for (r=1;r<=10;r++) if (Math.abs((g.k==='c' ? 6.28*r : 3.14*r*r) - g.v) < 0.005) return r;
      return null;
    }
    function setRound(){
      var g = CG[st.r];
      document.getElementById('ciRound').textContent = T({es:'Ronda ',en:'Round '})+(st.r+1)+T({es:' de 3',en:' of 3'});
      document.getElementById('ciGoal').textContent = (g.k==='c')
        ? T({es:'Meta: ajusta el radio hasta que el contorno mida ',en:'Goal: adjust the radius until the border measures '})+fmt(g.v)+T({es:' u.',en:' units.'})
        : T({es:'Meta: ajusta el radio hasta que el área mida ',en:'Goal: adjust the radius until the area measures '})+fmt(g.v)+T({es:' u².',en:' sq units.'});
      document.getElementById('ciFb').textContent = '';
      st.tries = 0; draw(); live();
    }
    function finish(){
      st.done = true;
      document.getElementById('ciRound').textContent = T({es:'Listo',en:'Done'});
      document.getElementById('ciGoal').textContent = T({es:'Tres metas hechas. El contorno crece parejo con el radio, el área crece mucho más rápido.', en:'Three goals done. The border grows evenly with the radius, the area grows much faster.'});
      document.getElementById('ciFb').innerHTML = '<span class="okmsg">🎉 '+T({es:'Sea cual sea el radio, el contorno siempre mide poco más de tres diámetros.', en:'Whatever the radius, the border always measures a little more than three diameters.'})+'</span>';
    }
    sr.addEventListener('input', function(){ st.rad = parseInt(sr.value,10); draw(); live(); });
    document.getElementById('ciBtn').addEventListener('click', function(){
      if (st.done) return;
      var g = CG[st.r], cur = (g.k==='c') ? circ() : ar(), fb = document.getElementById('ciFb');
      if (Math.abs(cur - g.v) < 0.005) {
        st.r++;
        if (st.r >= 3) { finish(); return; }
        fb.innerHTML = '<span class="okmsg">✓ '+T({es:'¡Ese es el radio! Va la siguiente meta.',en:'That is the radius! Here comes the next goal.'})+'</span>';
        setTimeout(setRound, 900);
        return;
      }
      st.tries++;
      if (st.tries >= 3) {
        var s = solve(g);
        if (s) { st.rad = s; sr.value = s; draw(); live(); }
        fb.innerHTML = T({es:'El radio que cumple la meta es <b>'+(s||'')+' u</b>.', en:'The radius that meets the goal is <b>'+(s||'')+' units</b>.'});
        st.r++;
        if (st.r >= 3) { st.done = true; setTimeout(finish, 1800); return; }
        setTimeout(setRound, 1900);
        return;
      }
      fb.textContent = (cur < g.v)
        ? T({es:'Todavía no: '+fmt(cur)+' se queda abajo de '+fmt(g.v)+'. Agranda el radio.', en:'Not yet: '+fmt(cur)+' stays below '+fmt(g.v)+'. Make the radius bigger.'})
        : T({es:'Todavía no: '+fmt(cur)+' se pasa de '+fmt(g.v)+'. Achica el radio.', en:'Not yet: '+fmt(cur)+' goes past '+fmt(g.v)+'. Make the radius smaller.'});
    });
    setRound();
  })();

  /* ---- PROBLEMA 8 ---- */
  addProb(v8 === 0 ? {
    title:{es:'La rueda de la bicicleta', en:'The bicycle wheel'},
    q:{es:'Una rueda tiene un diámetro de '+d8+' cm. Si se toma π ≈ 3.14, ¿cuánto mide el contorno completo de la rueda?',
       en:'A wheel has a diameter of '+d8+' cm. Taking π ≈ 3.14, how long is the whole border of the wheel?'},
    hint:{es:'El contorno de cualquier círculo mide π veces su diámetro, un poco más de tres diámetros.',
          en:'The border of any circle measures π times its diameter, a little more than three diameters.'},
    exp:{es:'El contorno es π veces el diámetro: 3.14 × '+d8+' = '+fmt(C8)+' cm.',
         en:'The border is π times the diameter: 3.14 × '+d8+' = '+fmt(C8)+' cm.'},
    options: opts4(fmt(C8), [fmt(6.28*d8), fmt(3.14*r8), fmt(3.14*r8*r8), fmt(2*d8)]),
    correct: fmt(C8), showWork:true
  } : {
    title:{es:'La rueda de la bicicleta', en:'The bicycle wheel'},
    q:{es:'Una rueda tiene un radio de '+r8+' cm. Si se toma π ≈ 3.14, ¿cuánto mide el contorno completo de la rueda?',
       en:'A wheel has a radius of '+r8+' cm. Taking π ≈ 3.14, how long is the whole border of the wheel?'},
    hint:{es:'El dato que entra en el contorno es el diámetro, y el diámetro es el doble del radio.',
          en:'The measurement that goes into the border is the diameter, and the diameter is twice the radius.'},
    exp:{es:'El diámetro mide el doble del radio, o sea '+d8+' cm, y el contorno es π veces el diámetro: 3.14 × '+d8+' = '+fmt(C8)+' cm.',
         en:'The diameter is twice the radius, that is '+d8+' cm, and the border is π times the diameter: 3.14 × '+d8+' = '+fmt(C8)+' cm.'},
    options: opts4(fmt(C8), [fmt(3.14*r8), fmt(3.14*r8*r8), fmt(6.28*d8), fmt(2*r8)]),
    correct: fmt(C8), showWork:true
  });

  /* ---- PROBLEMA 9 ---- */
  addProb(v9 === 0 ? {
    title:{es:'La mesa redonda', en:'The round table'},
    q:{es:'Una mesa redonda tiene un radio de '+r9+' cm. Si se toma π ≈ 3.14, ¿cuál es el área de su superficie en centímetros cuadrados?',
       en:'A round table has a radius of '+r9+' cm. Taking π ≈ 3.14, what is the area of its surface in square centimetres?'},
    hint:{es:'La superficie de un círculo se obtiene multiplicando π por el radio dos veces, no por el contorno.',
          en:'The surface of a circle is obtained by multiplying π by the radius twice, not by the border.'},
    exp:{es:'Primero el radio por sí mismo, '+r9+' × '+r9+' = '+(r9*r9)+', y después 3.14 × '+(r9*r9)+' = '+fmt(A9)+' cm².',
         en:'First the radius times itself, '+r9+' × '+r9+' = '+(r9*r9)+', and then 3.14 × '+(r9*r9)+' = '+fmt(A9)+' cm².'},
    options: opts4(fmt(A9), [fmt(6.28*r9), fmt(3.14*4*r9*r9), fmt(3.14*2*r9*r9), fmt(3.14*r9)]),
    correct: fmt(A9), showWork:true
  } : {
    title:{es:'La mesa redonda', en:'The round table'},
    q:{es:'Una mesa redonda tiene un diámetro de '+(2*r9)+' cm. Si se toma π ≈ 3.14, ¿cuál es el área de su superficie en centímetros cuadrados?',
       en:'A round table has a diameter of '+(2*r9)+' cm. Taking π ≈ 3.14, what is the area of its surface in square centimetres?'},
    hint:{es:'La superficie trabaja con el radio, y el radio es la mitad del diámetro.',
          en:'The surface works with the radius, and the radius is half of the diameter.'},
    exp:{es:'El radio es la mitad del diámetro, o sea '+r9+' cm. Entonces '+r9+' × '+r9+' = '+(r9*r9)+' y 3.14 × '+(r9*r9)+' = '+fmt(A9)+' cm².',
         en:'The radius is half of the diameter, that is '+r9+' cm. So '+r9+' × '+r9+' = '+(r9*r9)+' and 3.14 × '+(r9*r9)+' = '+fmt(A9)+' cm².'},
    options: opts4(fmt(A9), [fmt(3.14*4*r9*r9), fmt(6.28*r9), fmt(6.28*2*r9), fmt(3.14*2*r9*r9)]),
    correct: fmt(A9), showWork:true
  });

  /* ---- PROBLEMA 10 ---- */
  addProb(v10 === 0 ? {
    title:{es:'El papalote', en:'The kite'},
    q:{es:'Un papalote tiene forma de paralelogramo. Su base mide '+b10+' cm, su altura mide '+h10+' cm y su lado inclinado mide '+l10+' cm. ¿Cuál es el área del papalote en centímetros cuadrados?',
       en:'A kite has the shape of a parallelogram. Its base measures '+b10+' cm, its height measures '+h10+' cm and its slanted side measures '+l10+' cm. What is the area of the kite in square centimetres?'},
    hint:{es:'Corta el triángulo de un extremo y pégalo del otro lado: queda un rectángulo con la misma base y la misma altura. El lado inclinado no entra aquí.',
          en:'Cut the triangle off one end and paste it on the other side: you get a rectangle with the same base and the same height. The slanted side does not come in here.'},
    exp:{es:'Enderezado, el papalote es un rectángulo de base '+b10+' y altura '+h10+': '+b10+' × '+h10+' = '+A10+' cm².',
         en:'Straightened out, the kite is a rectangle with base '+b10+' and height '+h10+': '+b10+' × '+h10+' = '+A10+' cm².'},
    options: opts4(A10, [b10*l10, Pe10, A10/2, b10+h10]),
    correct: String(A10), showWork:true
  } : {
    title:{es:'El papalote', en:'The kite'},
    q:{es:'Un papalote tiene forma de paralelogramo. Su base mide '+b10+' cm, su altura mide '+h10+' cm y su lado inclinado mide '+l10+' cm. Se le quiere poner un hilo que recorra toda la orilla. ¿Cuántos centímetros de hilo se necesitan?',
       en:'A kite has the shape of a parallelogram. Its base measures '+b10+' cm, its height measures '+h10+' cm and its slanted side measures '+l10+' cm. A string is going to run all around its edge. How many centimetres of string are needed?'},
    hint:{es:'La orilla pasa por dos bases y dos lados inclinados. La altura se queda por dentro de la figura.',
          en:'The edge goes along two bases and two slanted sides. The height stays inside the figure.'},
    exp:{es:'La orilla recorre los cuatro lados: '+b10+' + '+l10+' + '+b10+' + '+l10+' = '+Pe10+' cm.',
         en:'The edge runs along the four sides: '+b10+' + '+l10+' + '+b10+' + '+l10+' = '+Pe10+' cm.'},
    options: opts4(Pe10, [2*(b10+h10), b10+l10, A10, b10+l10+h10]),
    correct: String(Pe10), showWork:true
  });
}
</script>

<!-- LIAXA ANALYTICS -->
<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbykkuJ_apGq3vALIFd4mr3acu81c7K4OKxW-DZ-i52Ceyl3lOanXMdvbS9SIXPrLQBm/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'Fórmulas para Perímetro y Área de Polígonos y Círculo';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
