<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Funciones Reales</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Funciones Reales</div>
    <div class="wcourse" id="wcourse-el">Pensamiento Matemático III · Sem 3</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Funciones Reales</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="sbtn" id="dlBtn" onclick="generatePDF()" style="max-width:280px;margin:0 auto;">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   CENTRALIZED SCHOOL CONFIG (Rule 16) — ships UNBRANDED (Rule 11).
   The ONLY rebranding point. build_all.py substitutes these exact fields
   (BRAND_FIELDS / RGB_FIELDS / logo*) downstream; :root/dark stay as fallback.
   Neutral defaults below == the static :root/dark values, so unbranded == no-op.
   ══════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:'#0c3c6c', primaryDark:'#072a4c', primaryBg:'#e6eef7',
  accent:'#ccb49c', accentBg:'#f3ede7',
  darkPrimary:'#3885d1', darkPrimaryDark:'#6aadf0', darkPrimaryBg:'#08233e',

function setLang(l){

    document.getElementById('lessonBody').innerHTML = '';
    var res = document.getElementById('s_results'); res.style.display='none'; res.classList.remove('vis');
    buildLesson(seededRng(studentData.name + studentData.group + currentAttempt(studentData.name, studentData.group)));

function getAttemptKey(name, group){ return 'pm3_t02_g01__att__' + (name+'__'+group).replace(/\s+/g,'_'); }
function nextAttempt(name, group){ var k=getAttemptKey(name,group),n=0; try{n=parseInt(localStorage.getItem(k)||'0',10)||0;}catch(e){} n++; try{localStorage.setItem(k,String(n));}catch(e){} return n; }
function currentAttempt(name, group){ var k=getAttemptKey(name,group); try{return parseInt(localStorage.getItem(k)||'1',10)||1;}catch(e){return 1;} }

/* ================================================
   SESSION PERSISTENCE  (localStorage)
   ================================================ */
function lsKey() {
  var n = (studentData.name  || '').trim();
  var g = (studentData.group || '').trim();
  return 'pm3_t02_g01__' + (n + '__' + g).replace(/\s+/g, '_');
}

function saveSession() {
  if (!studentData.name) return;
  var drawings = [], texts = [], photos = [];
  problems.forEach(function(p, i) {
    var dc = document.getElementById('dc' + i);
    if (dc && dc.width) {
      var blank = document.createElement('canvas');
      blank.width = dc.width; blank.height = dc.height;
      drawings.push(dc.toDataURL() === blank.toDataURL() ? null : dc.toDataURL('image/png'));
    } else { drawings.push(null); }
    var ta = document.getElementById('ta' + i);
    texts.push(ta ? ta.value : '');
    var pp = document.getElementById('pp' + i);
    photos.push((pp && pp.src && pp.src.indexOf('data:') === 0) ? pp.src : null);
  });
  var state = {
    name: studentData.name, group: studentData.group,
    answeredCount: answeredCount, correctCount: correctCount,
    choices: problems.map(function(p) { return p.studentChoice; }),
    drawings: drawings, texts: texts, photos: photos
  };
  try { localStorage.setItem(lsKey(), JSON.stringify(state)); } catch(e) {}
}

function loadSession(name, group) {
  var key = 'pm3_t02_g01__' + (name + '__' + group).replace(/\s+/g, '_');
  try { var r = localStorage.getItem(key); return r ? JSON.parse(r) : null; } catch(e) { return null; }
}

function restoreSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  var saved = loadSession(name, group);
  if (!saved) return;
  document.getElementById('restoreBar').style.display = 'none';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = currentAttempt(name, group);
  buildLesson(seededRng(name + group + att));
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
  saved.choices.forEach(function(choice, idx) {
    if (choice !== null && choice !== undefined) confirmMC(idx, choice);
  });
  setTimeout(function() {
    if (saved.drawings) {
      saved.drawings.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var dc = document.getElementById('dc' + i);
        if (!dc || !dc.width) return;
        var img = new Image();
        img.onload = function() {
          var dpr = window.devicePixelRatio || 1;
          dc.getContext('2d').drawImage(img, 0, 0, dc.width / dpr, dc.height / dpr);
        };
        img.src = dataUrl;
      });
    }
    if (saved.texts) {
      saved.texts.forEach(function(text, i) {
        if (!text) return;
        var ta = document.getElementById('ta' + i);
        if (ta) ta.value = text;
      });
    }
    if (saved.photos) {
      saved.photos.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var pp = document.getElementById('pp' + i);
        if (!pp) return;
        pp.src = dataUrl; pp.style.display = 'block';
        var pz = document.getElementById('pz' + i);
        if (pz) pz.style.opacity = '0.4';
      });
    }
  }, 300);
}

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

async function generatePDF() {
  var btn = document.getElementById('dlBtn');
  btn.textContent = 'Generando PDF…';
  btn.disabled = true;

  var jspdf   = window.jspdf;
  var doc     = new jspdf.jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });
  var PW      = 215.9;
  var M       = 18;
  var TW      = PW - M * 2;
  var PH      = doc.internal.pageSize.height;
  var name    = studentData.name;
  var group   = studentData.group;
  var total   = problems.length;
  var pct     = Math.round(correctCount / total * 100);
  var dateStr = new Date().toLocaleString('es-MX', { dateStyle:'long', timeStyle:'short' });

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS — INJECTION BLOCK ─────────────────────────────────────────
  //   Match these RGB values to --green and --gold above.
  //   PRIMARY  → pBR, pBG, pBB
  //   ACCENT   → pAR, pAG, pAB
  // ──────────────────────────────────────────────────────────────────────────
  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;  // PRIMARY (from SCHOOL, Rule 16)
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;   // ACCENT (from SCHOOL, Rule 16)

  function pdfText(html) {
    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/\u2192/g,'->').replace(/\u2212/g,'-').replace(/\u00b2/g,'^2')
      .replace(/\u00b3/g,'^3').replace(/\u00d7/g,'x').replace(/\u00f7/g,'/')
      .replace(/\u2260/g,'!=').replace(/\u2264/g,'<=').replace(/\u2265/g,'>=')
      .replace(/\u221a/g,'sqrt').replace(/\u03c0/g,'pi').replace(/\u2026/g,'...')
      .replace(/\s+/g,' ').trim();
  }

  // ── PORTADA: orange line / white logo strip / orange line / blue band ──
  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,2,'F');   // top accent line
  doc.setFillColor(255,255,255); doc.rect(0,2,PW,26,'F');                               // white logo strip
  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,28,PW,2,'F');  // bottom accent line
  doc.setFillColor(pBR,pBG,pBB); doc.rect(0,30,PW,34,'F');       // blue header band

  // ── PDF LOGO INJECTION BLOCK ─────────────────────────────────────────────
  //   When injecting logos, replace the two placeholder lines below with:
  //     var logoLeftB64  = 'data:image/png;base64,...';   // from LOGOS_MASTER.HTML
  //     var logoRightB64 = 'data:image/png;base64,...';   // from LOGOS_MASTER.HTML
  //   Then uncomment the two doc.addImage() calls.
  //   Left logo  → Facultad / department logo  (x=M,   y=4,  w=48, h=22)
  //   Right logo → University logo             (x=130, y=4,  w=48, h=22)
  // var logoLeftB64  = '{{LOGO_LEFT_B64}}';
  // var logoRightB64 = '{{LOGO_RIGHT_B64}}';
  // doc.addImage(logoLeftB64,  'PNG', M,   4, 48, 22);
  // doc.addImage(logoRightB64, 'PNG', 130, 4, 48, 22);
  // ─────────────────────────────────────────────────────────────────────────

  // LIAXA logo — right side of white strip
  var lx = PW - M - 36;
  var ly = 10;
  doc.setDrawColor(pBR,pBG,pBB); doc.setLineWidth(0.7);
  doc.lines([[2.57-1.03,4.63-6.17],[4.11-2.57,5.14-4.63],[5.66-4.11,2.57-5.14]], lx+1.03, ly+6.17);
  doc.setFillColor(pAR,pAG,pAB); doc.circle(lx+5.66, ly+2.57, 0.9, 'F');
  doc.setDrawColor(pAR,pAG,pAB); doc.setLineWidth(0.7);
  doc.line(lx+8.23, ly+1.54, lx+8.23, ly+7.2);
  doc.setTextColor(pBR,pBG,pBB); doc.setFontSize(11); doc.setFont('helvetica','bold');
  doc.text('LIAXA', lx+10, ly+6.8);

  // Guide title + date inside the blue band
  doc.setTextColor(232,238,247); doc.setFontSize(19); doc.setFont('helvetica','bold');
  doc.text(t('wtitle'), M, 49);

function L(o){ return (o && o[LANG] !== undefined) ? o[LANG] : (o ? o.es : ''); }
function pk(rng, a){ return a[Math.floor(rng() * a.length)]; }
function cssv(n){ var v = getComputedStyle(document.documentElement).getPropertyValue(n); return (v || '').trim() || '#000000'; }

var MIN = '−';
var SQ  = '²';
function sg(v){ return (v < 0) ? (MIN + Math.abs(v)) : ('' + v); }
function frac(n, d){
  return '<span class="mf-outer"><span class="mf-num">' + n + '</span><span class="mf-den">' + d + '</span></span>';
}
/* regla lineal ax + b con el signo escrito como resta (Rule 13) */
function linex(a, b){
  var s = (a === 1) ? 'x' : ((a === -1) ? (MIN + 'x') : (sg(a) + 'x'));
  if (b > 0) s += ' + ' + b;
  else if (b < 0) s += ' ' + MIN + ' ' + Math.abs(b);
  return s;
}
/* forma de vértice a(x - h)^2 + k */
function vform(a, h, k){
  var s = (a === 1) ? '' : ((a === -1) ? MIN : sg(a));
  var inner = (h === 0) ? 'x' + SQ : '(x' + (h > 0 ? (' ' + MIN + ' ' + h) : (' + ' + Math.abs(h))) + ')' + SQ;
  s += inner;
  if (k > 0) s += ' + ' + k;
  else if (k < 0) s += ' ' + MIN + ' ' + Math.abs(k);
  return s;
}
/* forma desarrollada x^2 + bx + c con los signos escritos como resta */
function quadStd(b, c){
  var s = 'x' + SQ;
  if (b > 0) s += ' + ' + (b === 1 ? '' : b) + 'x';
  else if (b < 0) s += ' ' + MIN + ' ' + (b === -1 ? '' : Math.abs(b)) + 'x';
  if (c > 0) s += ' + ' + c;
  else if (c < 0) s += ' ' + MIN + ' ' + Math.abs(c);
  return s;
}

var GW_DRAWS = [];
function fitCanvas(c){
  var dpr = window.devicePixelRatio || 1;
  var w = c.clientWidth || 320;
  var h = c.clientHeight || 236;
  if (c.width !== Math.round(w * dpr) || c.height !== Math.round(h * dpr)) {
    c.width = Math.round(w * dpr); c.height = Math.round(h * dpr);
  }
  var ctx = c.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  return { ctx: ctx, w: w, h: h };
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 1 :: MAQUINA DE FUNCIONES
   Una regla fija procesa la entrada. El alumno mueve la entrada y ve la
   salida moverse en la barra al mismo tiempo; la marca dorada es la salida
   buscada. La retroalimentación dice si conviene una entrada mayor o menor,
   y con pendiente negativa la dirección se invierte.
   ══════════════════════════════════════════════════════════════════════════ */
function wMachine(rng, host){
  var POOL = [
    { a:2, b:-5, x0:3 }, { a:3, b:-4, x0:2 }, { a:-2, b:7, x0:4 },
    { a:3, b:2, x0:-3 }, { a:-3, b:1, x0:2 }, { a:4, b:-6, x0:3 },
    { a:2, b:6, x0:-4 }, { a:-2, b:-3, x0:5 }
  ];
  var RS = shuffle(POOL, rng).slice(0, 3);
  var r = 0, tries = 0, done = false, x = 0;

  host.innerHTML =
    '<div class="gw-h iw-tag">' + L({ es:'Máquina de funciones', en:'Function machine' }) + '<span class="gw-tag" id="mqTag"></span></div>' +
    '<div class="gw-q" id="mqQ"></div>' +
    '<div class="gw-mini iw-sub">' + L({
      es:'Mueve la entrada y observa la salida en el mismo instante. La marca dorada de la barra es la salida que se busca.',
      en:'Move the input and watch the output at the same instant. The gold mark on the bar is the output being sought.'
    }) + '</div>' +
    '<canvas class="gw-cvs" id="mqC"></canvas>' +
    '<div class="gw-slab"><span class="gw-cl">' + L({ es:'Entrada x', en:'Input x' }) + '</span><input type="range" id="mqX" min="-6" max="6" step="1" value="0"><span class="gw-sv" id="mqXv">0</span></div>' +
    '<div class="gw-out">' +
      '<div class="gw-cell"><div class="gw-cn">' + L({ es:'Entrada', en:'Input' }) + '</div><div class="gw-cv" id="mqA">0</div></div>' +
      '<div class="gw-cell"><div class="gw-cn">' + L({ es:'Salida', en:'Output' }) + '</div><div class="gw-cv" id="mqB">0</div></div>' +
      '<div class="gw-cell"><div class="gw-cn">' + L({ es:'Salida buscada', en:'Wanted output' }) + '</div><div class="gw-cv" id="mqT">0</div></div>' +
    '</div>' +
    '<div class="gw-row"><button class="gw-btn" id="mqK">' + L({ es:'Comprobar', en:'Check' }) + '</button></div>' +
    '<div class="gw-fb"></div>';

  var cv = host.querySelector('#mqC');
  function R(){ return RS[r]; }
  function f(v){ return R().a * v + R().b; }
  function goal(){ return f(R().x0); }

  function draw(){
    var g = fitCanvas(cv), ctx = g.ctx, W = g.w, H = g.h;
    var bw = Math.min(176, W * 0.46), bh = 66;
    var bx = (W - bw) / 2, by = 34;
    ctx.font = '11px "IBM Plex Sans", sans-serif';
    ctx.textAlign = 'center';
    // caja de la regla
    ctx.fillStyle = cssv('--green-bg');
    ctx.fillRect(bx, by, bw, bh);
    ctx.strokeStyle = cssv('--green'); ctx.lineWidth = 2;
    ctx.strokeRect(bx, by, bw, bh);
    ctx.fillStyle = cssv('--green-dark');
    ctx.font = '13px "IBM Plex Mono", monospace';
    ctx.fillText('f(x) = ' + linex(R().a, R().b), bx + bw / 2, by + bh / 2 + 5);
    ctx.font = '11px "IBM Plex Sans", sans-serif';
    ctx.fillStyle = cssv('--text3');
    ctx.fillText(L({ es:'regla fija', en:'fixed rule' }), bx + bw / 2, by - 8);
    // entrada y salida
    arrowR(ctx, 12, by + bh / 2, bx - 6, cssv('--gold'));
    arrowR(ctx, bx + bw + 6, by + bh / 2, W - 12, cssv('--green'));
    ctx.fillStyle = cssv('--gold');
    ctx.fillText('x = ' + sg(x), (bx + 12) / 2, by + bh / 2 - 10);
    ctx.fillStyle = cssv('--green');
    ctx.fillText('f(x) = ' + sg(f(x)), (bx + bw + W) / 2, by + bh / 2 - 10);
    // barra de salidas posibles
    var lo = Math.min(f(-6), f(6)), hi = Math.max(f(-6), f(6));
    var barY = H - 52, barX = 20, barW = W - 40;
    ctx.fillStyle = cssv('--surface');
    ctx.fillRect(barX, barY, barW, 16);
    ctx.strokeStyle = cssv('--border'); ctx.lineWidth = 1;
    ctx.strokeRect(barX, barY, barW, 16);
    function px(v){ return barX + barW * ((v - lo) / (hi - lo)); }
    // meta
    if (!done) {
      ctx.strokeStyle = cssv('--gold'); ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(px(goal()), barY - 7); ctx.lineTo(px(goal()), barY + 23); ctx.stroke();
      ctx.fillStyle = cssv('--gold');
      ctx.fillText(sg(goal()), px(goal()), barY - 11);
    }
    // salida actual
    ctx.fillStyle = cssv('--green');
    ctx.beginPath(); ctx.arc(px(f(x)), barY + 8, 7, 0, 6.284); ctx.fill();
    ctx.fillStyle = cssv('--text3');
    ctx.textAlign = 'left';
    ctx.fillText(L({ es:'salidas posibles', en:'possible outputs' }), barX, barY + 34);
    ctx.textAlign = 'right';
    ctx.fillText(sg(hi), barX + barW, barY + 34);
    ctx.textAlign = 'center';
  }
  regDraw(draw);

  function live(){
    host.querySelector('#mqXv').textContent = sg(x);
    host.querySelector('#mqA').textContent = sg(x);
    host.querySelector('#mqB').textContent = sg(f(x));
    host.querySelector('#mqT').textContent = done ? '-' : sg(goal());
    draw();
    if (done) return;
    var out = f(x), tg = goal();
    if (out === tg) {
      say(host, 'good', L({
        es:'La salida coincide con la buscada. Confirma con el botón.',
        en:'The output matches the one sought. Confirm with the button.'
      }));
      return;
    }
    var bigger = ((out < tg) === (R().a > 0));
    say(host, 'warm', L({
      es:'La salida va en ' + sg(out) + ' y se busca ' + sg(tg) + '. Prueba una entrada ' + (bigger ? 'mayor' : 'menor') + ' y vigila hacia dónde corre el punto verde.',
      en:'The output is at ' + sg(out) + ' and ' + sg(tg) + ' is wanted. Try a ' + (bigger ? 'larger' : 'smaller') + ' input and watch which way the green dot runs.'
    }));
  }
  function showRound(){
    tries = 0;
    host.querySelector('#mqTag').textContent = L({ es:'Ronda ', en:'Round ' }) + (r + 1) + '/3';
    host.querySelector('#mqQ').innerHTML = L({
      es:'Con la regla <span class="gw-cv">f(x) = ' + linex(R().a, R().b) + '</span>, encuentra la entrada que produce la salida <span class="gw-cv">' + sg(goal()) + '</span>.',
      en:'With the rule <span class="gw-cv">f(x) = ' + linex(R().a, R().b) + '</span>, find the input that produces the output <span class="gw-cv">' + sg(goal()) + '</span>.'
    });
    live();
  }
  function nextRound(){
    r++;
    if (r >= 3) {
      done = true;
      host.querySelector('#mqTag').textContent = L({ es:'Máquina dominada', en:'Machine mastered' });
      host.querySelector('#mqK').disabled = true;
      host.querySelector('#mqK').classList.add('solved');
      draw();
      say(host, 'good', L({
        es:'Una regla lineal recorre sus salidas en un solo sentido: si el coeficiente de x es positivo, subir la entrada sube la salida, y si es negativo la baja. Por eso cada salida viene de una sola entrada.',
        en:'A linear rule runs through its outputs in a single direction: if the coefficient of x is positive, raising the input raises the output, and if it is negative it lowers it. That is why each output comes from a single input.'
      }));
      return;
    }
    showRound();
  }
  host.querySelector('#mqX').oninput = function(){ x = parseInt(this.value, 10); live(); };
  host.querySelector('#mqK').onclick = function(){
    if (done) return;
    if (f(x) === goal()) {
      say(host, 'good', L({
        es:'Correcto: al entrar ' + sg(x) + ', la regla devuelve ' + sg(goal()) + '.',
        en:'Correct: with ' + sg(x) + ' going in, the rule returns ' + sg(goal()) + '.'
      }));
      setTimeout(nextRound, 1100);
      return;
    }
    tries++;
    if (tries >= 3) {
      x = R().x0;
      host.querySelector('#mqX').value = String(x);
      draw();
      say(host, 'miss', L({
        es:'La entrada era ' + sg(R().x0) + ': el producto por ' + sg(R().a) + ' y la suma de ' + sg(R().b) + ' dejan justo ' + sg(goal()) + '.',
        en:'The input was ' + sg(R().x0) + ': the product by ' + sg(R().a) + ' and adding ' + sg(R().b) + ' land exactly on ' + sg(goal()) + '.'
      }));
      setTimeout(nextRound, 3000);
      return;
    }
    live();
  };
  showRound();
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 2 :: FILTRO DE DOMINIO
   Cada valor candidato es una ficha que el alumno deja pasar o bloquea. La
   recta numérica se redibuja en cada toque: punto lleno si el valor entra,
   círculo tachado si la regla no puede procesarlo. Es reversible y la pista
   señala el primer valor mal clasificado sin decir la respuesta completa.
   ══════════════════════════════════════════════════════════════════════════ */
function wDomain(rng, host){
  var CH = [-3, -2, -1, 0, 1, 2, 3];
  var c1 = pk(rng, [2, 3]);
  var c2 = pk(rng, [-2, -1, 1, 2]);
  var c3 = pk(rng, [2, 3]);
  var RS = [
    {
      expr: 'f(x) = ' + frac('x + 5', 'x ' + MIN + ' ' + c1),
      ok: function(v){ return v !== c1; },
      ask: { es:'¿Qué valores puede procesar esta regla?', en:'Which values can this rule process?' },
      look: { es:'el denominador', en:'the denominator' },
      why: {
        es:'El denominador se anula en x = ' + c1 + ' y una división entre cero no está definida. Todos los demás valores entran sin problema, incluido el que anula el numerador.',
        en:'The denominator vanishes at x = ' + c1 + ' and a division by zero is not defined. Every other value goes in with no trouble, including the one that makes the numerator zero.'
      }
    },
    {
      expr: 'g(x) = ' + '√' + '(x ' + (c2 >= 0 ? (MIN + ' ' + c2) : ('+ ' + Math.abs(c2))) + ')',
      ok: function(v){ return v >= c2; },
      ask: { es:'¿Qué valores puede procesar esta regla?', en:'Which values can this rule process?' },
      look: { es:'lo que queda dentro de la raíz', en:'what is left inside the root' },
      why: {
        es:'Dentro de una raíz cuadrada real no cabe una cantidad negativa. El radicando vale cero justo en x = ' + sg(c2) + ' y es positivo de ahí en adelante, así que ese valor sí pertenece al dominio y todos los menores quedan fuera.',
        en:'A real square root cannot hold a negative quantity. The radicand is zero exactly at x = ' + sg(c2) + ' and positive from there on, so that value does belong to the domain and every smaller one is left out.'
      }
    },
    {
      expr: 'h(x) = ' + frac('x + 1', '(x ' + MIN + ' ' + c3 + ')(x + ' + c3 + ')'),
      ok: function(v){ return v !== c3 && v !== -c3; },
      ask: { es:'¿Qué valores puede procesar esta regla?', en:'Which values can this rule process?' },
      look: { es:'los dos factores del denominador', en:'the two factors of the denominator' },
      why: {
        es:'Basta con que uno de los dos factores valga cero para que el cociente se rompa, y eso ocurre en x = ' + c3 + ' y en x = ' + MIN + c3 + '. El dominio es todo número real salvo esos dos.',
        en:'It is enough for one of the two factors to be zero for the quotient to break, and that happens at x = ' + c3 + ' and at x = ' + MIN + c3 + '. The domain is every real number except those two.'
      }
    }
  ];
  var r = 0, tries = 0, done = false;
  var state = CH.map(function(){ return true; });

  host.innerHTML =
    '<div class="gw-h iw-tag">' + L({ es:'Filtro de dominio', en:'Domain filter' }) + '<span class="gw-tag" id="dmTag"></span></div>' +
    '<div class="gw-q" id="dmQ"></div>' +
    '<div class="gw-mini iw-sub">' + L({
      es:'Toca una ficha para bloquear el valor y tócala otra vez para dejarlo pasar. La recta numérica responde en cada toque.',
      en:'Tap a chip to block the value and tap it again to let it through. The number line responds on every tap.'
    }) + '</div>' +
    '<canvas class="gw-cvs" id="dmC" style="height:150px"></canvas>' +
    '<div class="gw-row" id="dmChips"></div>' +
    '<div class="gw-row"><button class="gw-btn" id="dmK">' + L({ es:'Comprobar', en:'Check' }) + '</button></div>' +
    '<div class="gw-fb"></div>';

  var cv = host.querySelector('#dmC');
  function draw(){
    var g = fitCanvas(cv), ctx = g.ctx, W = g.w, H = g.h;
    var y = H * 0.55, mx = 26, lw = W - mx * 2;
    ctx.strokeStyle = cssv('--text3'); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(mx - 12, y); ctx.lineTo(W - mx + 12, y); ctx.stroke();
    ctx.font = '11px "IBM Plex Mono", monospace';
    ctx.textAlign = 'center';
    for (var i = 0; i < CH.length; i++){
      var px = mx + lw * (i / (CH.length - 1));
      ctx.strokeStyle = cssv('--border'); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(px, y - 6); ctx.lineTo(px, y + 6); ctx.stroke();
      ctx.fillStyle = cssv('--text3');
      ctx.fillText(sg(CH[i]), px, y + 24);
      if (state[i]) {
        ctx.fillStyle = cssv('--green');
        ctx.beginPath(); ctx.arc(px, y - 20, 8, 0, 6.284); ctx.fill();
      } else {
        ctx.strokeStyle = cssv('--bad'); ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(px, y - 20, 8, 0, 6.284); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(px - 5, y - 25); ctx.lineTo(px + 5, y - 15);
        ctx.moveTo(px + 5, y - 25); ctx.lineTo(px - 5, y - 15); ctx.stroke();
      }
    }
    ctx.textAlign = 'left';
    ctx.fillStyle = cssv('--text3');
    ctx.font = '11px "IBM Plex Sans", sans-serif';
    ctx.fillText(L({ es:'punto lleno: el valor entra al dominio', en:'filled dot: the value enters the domain' }), 8, 18);
  }
  regDraw(draw);

  function chips(){
    var h = '';
    for (var i = 0; i < CH.length; i++){
      h += '<button class="gw-btn' + (state[i] ? '' : ' out') + '" data-i="' + i + '">' + sg(CH[i]) + '</button>';
    }
    host.querySelector('#dmChips').innerHTML = h;
    host.querySelector('#dmChips').querySelectorAll('.gw-btn').forEach(function(b){
      b.onclick = function(){
        if (done) return;
        var i = parseInt(b.getAttribute('data-i'), 10);
        state[i] = !state[i];
        chips(); draw();
        say(host, '', L({
          es:'Sigue ajustando: cada ficha bloqueada dice que la regla no puede trabajar con ese número.',
          en:'Keep adjusting: every blocked chip says the rule cannot work with that number.'
        }));
      };
    });
  }
  function showRound(){
    tries = 0;
    state = CH.map(function(){ return true; });
    host.querySelector('#dmTag').textContent = L({ es:'Regla ', en:'Rule ' }) + (r + 1) + '/3';
    host.querySelector('#dmQ').innerHTML = '<span class="gw-expr">' + RS[r].expr + '</span><br>' + L(RS[r].ask);
    chips(); draw();
    say(host, '', L({
      es:'Todas las fichas empiezan abiertas. Bloquea las que la regla no pueda procesar.',
      en:'Every chip starts open. Block the ones the rule cannot process.'
    }));
  }
  function nextRound(){
    r++;
    if (r >= RS.length){
      done = true;
      host.querySelector('#dmTag').textContent = L({ es:'Filtro dominado', en:'Filter mastered' });
      host.querySelector('#dmK').disabled = true;
      host.querySelector('#dmK').classList.add('solved');
      say(host, 'good', L({
        es:'Solo dos cosas dejan a un número fuera del dominio de estas reglas: un denominador que se anula y un radicando negativo. Todo lo demás pasa.',
        en:'Only two things leave a number outside the domain of these rules: a denominator that vanishes and a negative radicand. Everything else goes through.'
      }));
      return;
    }
    showRound();
  }
  host.querySelector('#dmK').onclick = function(){
    if (done) return;
    var bad = -1;
    for (var i = 0; i < CH.length; i++){
      if (state[i] !== RS[r].ok(CH[i])) { bad = i; break; }
    }
    if (bad < 0){
      say(host, 'good', L({
        es:'Filtro correcto. ' + RS[r].why.es,
        en:'Correct filter. ' + RS[r].why.en
      }));
      setTimeout(nextRound, 2200);
      return;
    }
    tries++;
    if (tries >= 3){
      state = CH.map(function(v){ return RS[r].ok(v); });
      chips(); draw();
      say(host, 'miss', L(RS[r].why));
      setTimeout(nextRound, 3200);
      return;
    }
    say(host, 'warm', L({
      es:'Revisa el valor x = ' + sg(CH[bad]) + ': sustitúyelo y mira qué pasa con ' + RS[r].look.es + '.',
      en:'Check the value x = ' + sg(CH[bad]) + ': substitute it and see what happens with ' + RS[r].look.en + '.'
    }));
  };
  showRound();
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 3 :: TRADUCTOR DE REGISTROS
   Cuatro tablas y cuatro reglas, barajadas por separado. El alumno toca una
   tabla, toca una regla y la pareja queda formada; puede deshacerla cuando
   quiera. La pista apunta a las diferencias de la tabla mal emparejada.
   ══════════════════════════════════════════════════════════════════════════ */
function wMatch(rng, host){
  var XS = [0, 1, 2, 3];
  var SETS = [
    { rule: 'f(x) = ' + linex(3, -4), vals: [-4, -1, 2, 5] },
    { rule: 'f(x) = x' + SQ + ' + 1', vals: [1, 2, 5, 10] },
    { rule: 'f(x) = 6 ' + MIN + ' 2x', vals: [6, 4, 2, 0] },
    { rule: 'f(x) = x' + SQ + ' ' + MIN + ' 2x', vals: [0, -1, 0, 3] }
  ];
  var ord = shuffle([0, 1, 2, 3], rng);
  var rord = shuffle([0, 1, 2, 3], rng);
  var pair = [null, null, null, null];
  var sel = null, tries = 0, done = false;

  host.innerHTML =
    '<div class="gw-h iw-tag">' + L({ es:'Traductor de registros', en:'Register translator' }) + '<span class="gw-tag" id="mmTag"></span></div>' +
    '<div class="gw-q">' + L({
      es:'Cada tabla viene de una de las reglas. Empareja las cuatro.',
      en:'Each table comes from one of the rules. Match all four.'
    }) + '</div>' +
    '<div class="gw-mini iw-sub">' + L({
      es:'Toca una tabla y después una regla para unirlas. Si vuelves a tocar una tabla ya unida, la pareja se deshace.',
      en:'Tap a table and then a rule to join them. Tapping a joined table again breaks the pair.'
    }) + '</div>' +
    '<div class="mm-grid"><div class="mm-col" id="mmL"></div><div class="mm-col" id="mmR"></div></div>' +
    '<div class="gw-row"><button class="gw-btn" id="mmK">' + L({ es:'Comprobar', en:'Check' }) + '</button></div>' +
    '<div class="gw-fb"></div>';

  function render(){
    var lh = '<div class="mm-hd">' + L({ es:'Registro tabular', en:'Table register' }) + '</div>';
    for (var d = 0; d < 4; d++){
      var s = SETS[ord[d]];
      var cls = 'mm-item' + (sel === d ? ' sel' : '') + (pair[d] !== null ? (done ? ' right' : ' tied') : '');
      lh += '<div class="' + cls + '" data-d="' + d + '">' + valTable(XS, s.vals) +
            '<div class="mm-note">' + (pair[d] === null ? L({ es:'sin pareja', en:'unpaired' }) : SETS[rord[pair[d]]].rule) + '</div></div>';
    }
    host.querySelector('#mmL').innerHTML = lh;
    var rh = '<div class="mm-hd">' + L({ es:'Registro algebraico', en:'Algebraic register' }) + '</div>';
    for (var q = 0; q < 4; q++){
      var used = pair.indexOf(q) >= 0;
      rh += '<div class="mm-item' + (used ? ' tied' : '') + '" data-q="' + q + '"><div class="mm-rule">' + SETS[rord[q]].rule + '</div></div>';
    }
    host.querySelector('#mmR').innerHTML = rh;
    host.querySelector('#mmL').querySelectorAll('.mm-item').forEach(function(el){
      el.onclick = function(){
        if (done) return;
        var d = parseInt(el.getAttribute('data-d'), 10);
        if (pair[d] !== null) { pair[d] = null; sel = d; }
        else sel = (sel === d ? null : d);
        render();
      };
    });
    host.querySelector('#mmR').querySelectorAll('.mm-item').forEach(function(el){
      el.onclick = function(){
        if (done) return;
        var q = parseInt(el.getAttribute('data-q'), 10);
        if (sel === null){
          say(host, 'warm', L({ es:'Primero toca la tabla que quieres unir con esa regla.', en:'First tap the table you want to join to that rule.' }));
          return;
        }
        for (var d = 0; d < 4; d++) if (pair[d] === q) pair[d] = null;
        pair[sel] = q; sel = null;
        render();
        say(host, '', L({ es:'Pareja formada. Puedes deshacerla tocando la tabla otra vez.', en:'Pair formed. You can undo it by tapping the table again.' }));
      };
    });
  }
  function diffNote(idx){
    var v = SETS[idx].vals;
    var d1 = v[1] - v[0], d2 = v[2] - v[1], d3 = v[3] - v[2];
    if (d1 === d2 && d2 === d3){
      return L({
        es:'esa tabla cambia siempre ' + sg(d1) + ' cuando x sube una unidad, así que viene de una regla lineal con ese mismo coeficiente',
        en:'that table always changes by ' + sg(d1) + ' when x rises one unit, so it comes from a linear rule with that same coefficient'
      });
    }
    return L({
      es:'esa tabla cambia ' + sg(d1) + ', luego ' + sg(d2) + ' y luego ' + sg(d3) + ': como los saltos no son iguales, no puede venir de una regla lineal',
      en:'that table changes by ' + sg(d1) + ', then ' + sg(d2) + ' and then ' + sg(d3) + ': since the jumps are not equal, it cannot come from a linear rule'
    });
  }
  host.querySelector('#mmK').onclick = function(){
    if (done) return;
    var falta = pair.some(function(p){ return p === null; });
    if (falta){
      say(host, 'warm', L({ es:'Aún quedan tablas sin regla. Completa las cuatro parejas.', en:'Some tables still have no rule. Complete all four pairs.' }));
      return;
    }
    var bad = -1;
    for (var d = 0; d < 4; d++) if (rord[pair[d]] !== ord[d]) { bad = d; break; }
    if (bad < 0){
      done = true; render();
      host.querySelector('#mmK').disabled = true;
      host.querySelector('#mmK').classList.add('solved');
      host.querySelector('#mmTag').textContent = L({ es:'Registros unidos', en:'Registers joined' });
      say(host, 'good', L({
        es:'Las cuatro tablas y las cuatro reglas describen la misma correspondencia en dos lenguajes distintos. Las diferencias constantes delatan a las lineales; las que crecen delatan a las cuadráticas.',
        en:'The four tables and the four rules describe the same correspondence in two different languages. Constant differences give away the linear ones; growing differences give away the quadratic ones.'
      }));
      return;
    }
    tries++;
    if (tries >= 3){
      for (var e = 0; e < 4; e++) pair[e] = rord.indexOf(ord[e]);
      done = true; render();
      host.querySelector('#mmK').disabled = true;
      host.querySelector('#mmK').classList.add('solved');
      host.querySelector('#mmTag').textContent = L({ es:'Registros unidos', en:'Registers joined' });
      say(host, 'miss', L({
        es:'Estas son las parejas correctas. Para decidir, evalúa la regla en x = 0 y compárala con la primera casilla de la tabla, y después mira si los saltos entre casillas son iguales.',
        en:'These are the correct pairs. To decide, evaluate the rule at x = 0 and compare it with the first cell of the table, then look at whether the jumps between cells are equal.'
      }));
      return;
    }
    say(host, 'warm', L({
      es:'Una pareja no encaja: revisa la tabla que empieza en ' + sg(SETS[ord[bad]].vals[0]) + ', porque ' + diffNote(ord[bad]) + '.',
      en:'One pair does not fit: check the table that starts at ' + sg(SETS[ord[bad]].vals[0]) + ', because ' + diffNote(ord[bad]) + '.'
    }));
  };
  render();
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 4 :: AJUSTA LA PARABOLA
   La curva dorada es el objetivo; la verde es la del alumno y se redibuja en
   cada movimiento de los controles. La retroalimentación no dice el valor:
   dice hacia dónde mover el vértice y si la abertura va al lado contrario.
   ══════════════════════════════════════════════════════════════════════════ */
function wPara(rng, host){
  var TG = [
    { a:1, h:2, k:-3 }, { a:-1, h:-2, k:2 }, { a:2, h:1, k:1 },
    { a:-2, h:3, k:-1 }, { a:1, h:-3, k:-2 }, { a:-1, h:1, k:3 }
  ];
  var RS = shuffle(TG, rng).slice(0, 2);
  var a = 1, h = 0, k = 0, r = 0, tries = 0, done = false;

  host.innerHTML =
    '<div class="gw-h iw-tag">' + L({ es:'Ajusta la parábola', en:'Tune the parabola' }) + '<span class="gw-tag" id="pbTag"></span></div>' +
    '<div class="gw-q" id="pbQ"></div>' +
    '<div class="gw-mini iw-sub">' + L({
      es:'Mueve los tres controles hasta que tu parábola verde caiga exactamente sobre la dorada. Cada cambio se dibuja al instante.',
      en:'Move the three controls until your green parabola lands exactly on the gold one. Every change is drawn at once.'
    }) + '</div>' +
    '<canvas class="gw-cvs" id="pbC" style="height:270px"></canvas>' +

    '<div class="gw-slab"><span class="gw-cl">' + L({ es:'Vértice en y', en:'Vertex at y' }) + '</span><input type="range" id="pbK" min="-4" max="4" step="1" value="0"><span class="gw-sv" id="pbKv">0</span></div>' +

    '<div class="gw-fb"></div>';

  var cv = host.querySelector('#pbC');
  function T(){ return RS[r]; }
  function abtns(){
    var vals = [-2, -1, 1, 2], hh = '';
    hh += '<span class="gw-cl">' + L({ es:'Abertura a', en:'Opening a' }) + '</span>';
    for (var i = 0; i < vals.length; i++){
      hh += '<button class="gw-btn' + (a === vals[i] ? ' on' : '') + '" data-a="' + vals[i] + '">' + sg(vals[i]) + '</button>';
    }

      b.onclick = function(){ if (done) return; a = parseInt(b.getAttribute('data-a'), 10); abtns(); live(); };
    });
  }
  function draw(){
    var g = fitCanvas(cv), ctx = g.ctx, W = g.w, H = g.h;
    var X0 = W / 2, Y0 = H / 2, ux = W / 13, uy = H / 17;
    function PX(v){ return X0 + v * ux; }
    function PY(v){ return Y0 - v * uy; }
    ctx.strokeStyle = cssv('--border'); ctx.lineWidth = 1;
    for (var i = -6; i <= 6; i++){ ctx.beginPath(); ctx.moveTo(PX(i), 0); ctx.lineTo(PX(i), H); ctx.stroke(); }
    for (var j = -8; j <= 8; j++){ ctx.beginPath(); ctx.moveTo(0, PY(j)); ctx.lineTo(W, PY(j)); ctx.stroke(); }
    ctx.strokeStyle = cssv('--text3'); ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(0, PY(0)); ctx.lineTo(W, PY(0)); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(PX(0), 0); ctx.lineTo(PX(0), H); ctx.stroke();
    function curve(pa, ph, pkv, color, wdt){
      ctx.strokeStyle = color; ctx.lineWidth = wdt;
      ctx.beginPath();
      var started = false;
      for (var px = 0; px <= W; px += 2){
        var xv = (px - X0) / ux;
        var yv = pa * (xv - ph) * (xv - ph) + pkv;
        var py = PY(yv);
        if (py < -60 || py > H + 60){ started = false; continue; }
        if (!started){ ctx.moveTo(px, py); started = true; } else ctx.lineTo(px, py);
      }
      ctx.stroke();
      ctx.fillStyle = color;
      ctx.beginPath(); ctx.arc(PX(ph), PY(pkv), 5, 0, 6.284); ctx.fill();
    }
    curve(T().a, T().h, T().k, cssv('--gold'), 4);
    curve(a, h, k, cssv('--green'), 2.4);
    ctx.font = '11px "IBM Plex Sans", sans-serif';
    ctx.fillStyle = cssv('--gold'); ctx.textAlign = 'left';
    ctx.fillText(L({ es:'objetivo', en:'target' }), 8, 16);
    ctx.fillStyle = cssv('--green');
    ctx.fillText(L({ es:'la tuya', en:'yours' }), 8, 32);
  }

    var m;

        : L({ es:'La forma es correcta pero tu curva es más cerrada que la dorada: baja el tamaño de la abertura.', en:'The shape is right but your curve is narrower than the gold one: lower the size of the opening.' });
    } else if (h !== t.h){

        en:'The opening already matches. The vertex has to move ' + Math.abs(t.h - h) + ' unit(s) to the ' + (t.h > h ? 'right' : 'left') + '.'
      });
    } else {
      m = L({
        es:'El vértice está en la columna correcta. Ahora debe ' + (t.k > k ? 'subir' : 'bajar') + ' ' + Math.abs(t.k - k) + ' unidad(es).',
        en:'The vertex is in the right column. Now it has to move ' + (t.k > k ? 'up' : 'down') + ' by ' + Math.abs(t.k - k) + ' unit(s).'
      });
    }
    say(host, 'warm', m);
  }
  function showRound(){
    tries = 0;
    a = 1; h = 0; k = 0;
    host.querySelector('#pbH').value = '0';
    host.querySelector('#pbK').value = '0';
    host.querySelector('#pbTag').textContent = L({ es:'Curva ', en:'Curve ' }) + (r + 1) + '/2';
    host.querySelector('#pbQ').innerHTML = L({
      es:'Coloca tu parábola verde encima de la dorada y descubre qué regla la describe.',
      en:'Place your green parabola on top of the gold one and find out which rule describes it.'
    });

  }
  function nextRound(){
    r++;
    if (r >= RS.length){
      done = true;
      host.querySelector('#pbTag').textContent = L({ es:'Parábolas dominadas', en:'Parabolas mastered' });
      host.querySelector('#pbK2').disabled = true;
      host.querySelector('#pbK2').classList.add('solved');
      say(host, 'good', L({
        es:'Los tres controles son los tres datos que la forma de vértice guarda: el signo y el tamaño de la abertura, y las dos coordenadas del vértice.',
        en:'The three controls are the three pieces of data the vertex form keeps: the sign and the size of the opening, and the two coordinates of the vertex.'
      }));
      return;
    }

  }
  host.querySelector('#pbH').oninput = function(){ if (done) return; h = parseInt(this.value, 10); live(); };
  host.querySelector('#pbK').oninput = function(){ if (done) return; k = parseInt(this.value, 10); live(); };

        en:'It matches: f(x) = ' + vform(t.a, t.h, t.k) + ', with vertex at ' + pairTxt(t.h, t.k) + '.'
      }));

      draw();

        es:'La curva dorada era f(x) = ' + vform(t.a, t.h, t.k) + '. Dentro del paréntesis el número aparece con el signo cambiado respecto a la posición del vértice, y el término de afuera es la altura del vértice.',
        en:'The gold curve was f(x) = ' + vform(t.a, t.h, t.k) + '. Inside the bracket the number appears with the sign flipped compared with the position of the vertex, and the outside term is the height of the vertex.'
      }));
      setTimeout(nextRound, 3600);
      return;
    }

/* ══════════════════════════════════════════════════════════════════════════
   PROBLEMAS  ::  cada ranura guarda dos variantes de estructura distinta y
   la semilla elige cuál aparece en este intento (Rule 4).
   ══════════════════════════════════════════════════════════════════════════ */
function mkP1(rng){
  if (pk(rng, [0, 1]) === 0){
    var c = pk(rng, [[3,5,4],[4,3,5],[2,7,6],[5,4,3],[3,8,5]]);
    var a = c[0], b = c[1], v = c[2], res = a * v - b;
    return {
      showWork: true,
      title: L({ es:'La regla en acción', en:'The rule in action' }),
      q: L({
        es:'La regla de una función real es f(x) = ' + linex(a, -b) + '. ¿Qué valor devuelve la función cuando entra x = ' + v + '?',
        en:'The rule of a real function is f(x) = ' + linex(a, -b) + '. What value does the function return when x = ' + v + ' goes in?'
      }),
      options: [ sg(res), sg(a * v + b), sg(a * (v - b)), sg(a * v) ],
      correct: 0,
      hint: L({
        es:'Coloca el valor de entrada en cada lugar donde aparece x y respeta la jerarquía: primero el producto, después la resta.',
        en:'Place the input value everywhere x appears and respect the order of operations: the product first, the subtraction afterwards.'
      }),
      exp: L({
        es:'El producto vale ' + (a * v) + ' y al quitarle ' + b + ' queda ' + sg(res) + '. Restar antes de multiplicar daría ' + sg(a * (v - b)) + ', que es otra función distinta. Por eso f(' + v + ') = ' + sg(res) + '.',
        en:'The product is ' + (a * v) + ' and taking away ' + b + ' leaves ' + sg(res) + '. Subtracting before multiplying would give ' + sg(a * (v - b)) + ', which is a different function. That is why f(' + v + ') = ' + sg(res) + '.'
      })
    };
  }
  var d = pk(rng, [[2,6,7],[3,6,5],[2,4,6],[4,4,3]]);
  var a2 = d[0], b2 = d[1], x0 = d[2], sal = a2 * x0 - b2;
  return {
    showWork: true,
    title: L({ es:'De regreso a la entrada', en:'Back to the input' }),
    q: L({
      es:'Una función real está dada por f(x) = ' + linex(a2, -b2) + '. ¿Qué valor de entrada produce la salida ' + sal + '?',
      en:'A real function is given by f(x) = ' + linex(a2, -b2) + '. Which input value produces the output ' + sal + '?'
    }),
    options: [ sg(x0), sg((sal - b2) / a2), sg(sal - b2), sg(sal + b2) ],
    correct: 0,
    hint: L({
      es:'Deshaz la regla en el orden inverso: primero recupera el valor que tenía el producto antes de la resta y después reparte ese producto.',
      en:'Undo the rule in reverse order: first recover the value the product had before the subtraction and then share that product out.'
    }),
    exp: L({
      es:'Antes de restar ' + b2 + ', el producto debía valer ' + (sal + b2) + '. Ese producto repartido entre ' + a2 + ' deja x = ' + x0 + '.',
      en:'Before subtracting ' + b2 + ', the product had to be ' + (sal + b2) + '. That product shared out among ' + a2 + ' leaves x = ' + x0 + '.'
    })
  };
}

      L({ es:'Sí es la gráfica de una función, siempre que x = ' + xv + ' quede fuera de su dominio', en:'It is the graph of a function, provided x = ' + xv + ' is left out of its domain' }),
      L({ es:'No es la gráfica de una función, porque una función no admite salidas negativas', en:'It is not the graph of a function, because a function does not admit negative outputs' })
    ],

    }),

      en:'The two cuts say the same input has two outputs assigned, ' + MIN + '1 and 5, and that breaks the single image condition. Removing that value from the domain fixes nothing, because the curve still has those two points, and negative outputs are perfectly valid in a function.'
    })
  };
}

function mkP3(rng){

      })
    };
  }

    }),
    options: [
      L({ es:'Todos los números reales con x ' + '≥' + ' ' + c2, en:'All real numbers with x ' + '≥' + ' ' + c2 }),
      L({ es:'Todos los números reales con x > ' + c2, en:'All real numbers with x > ' + c2 }),
      L({ es:'Todos los números reales con x ' + '≤' + ' ' + c2, en:'All real numbers with x ' + '≤' + ' ' + c2 }),
      L({ es:'Todos los números reales excepto x = ' + c2, en:'All real numbers except x = ' + c2 })
