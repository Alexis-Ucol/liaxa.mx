<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sucesiones Aritméticas de Números</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

/* ── MANIPULATIVES ── */
.mexpr { font-family:'IBM Plex Mono',monospace; font-size:1.12rem; font-weight:600; color:var(--green-dark); background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:.75rem .8rem; text-align:center; overflow-x:auto; white-space:nowrap; }
.mexpr.big { font-size:1.24rem; }
.mstage { font-size:.7rem; letter-spacing:.09em; text-transform:uppercase; color:var(--text3); margin-bottom:.45rem; }
.mgoal { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; color:var(--text); background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.5rem .75rem; margin-bottom:.6rem; overflow-x:auto; white-space:nowrap; }
.mrow { display:flex; gap:.45rem; flex-wrap:wrap; align-items:center; margin-top:.65rem; }
.mbtn { background:var(--surface2); border:1.5px solid var(--border); border-radius:8px; padding:.5rem .8rem; font-size:.83rem; cursor:pointer; color:var(--text); font-family:inherit; min-height:44px; text-align:left; }
.mbtn:hover { border-color:var(--green); background:var(--green-bg); }
.mbtn.on { background:var(--green); color:var(--green-bg); border-color:var(--green); }
.mbtn.done { background:var(--ok-bg); border-color:var(--ok); color:var(--ok); }
.mbtn.miss { background:var(--bad-bg); border-color:var(--bad); color:var(--bad); }
.mbtn.mono { font-family:'IBM Plex Mono',monospace; font-size:.92rem; font-weight:600; }
.mfb { margin-top:.7rem; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.6rem .8rem; font-size:.82rem; color:var(--text2); min-height:2.6rem; }
.mfb.good { background:var(--ok-bg); border-left-color:var(--ok); color:var(--ok); }
.mfb.warn { background:var(--bad-bg); border-left-color:var(--bad); color:var(--bad); }
.mcanvas { display:block; width:100%; height:158px; touch-action:manipulation; cursor:pointer; border:1px solid var(--border); border-radius:8px; background:var(--surface); }
.mtrack { font-size:.72rem; color:var(--text3); margin-top:.5rem; letter-spacing:.03em; }
.trow { display:flex; gap:.4rem; margin-top:.7rem; overflow-x:auto; padding-bottom:.2rem; }
.tcell { flex:1 1 0; min-width:60px; background:var(--surface2); border:1.5px solid var(--border); border-radius:8px; padding:.4rem .25rem; text-align:center; }
.tcell.hit { border-color:var(--ok); background:var(--ok-bg); }
.tcell.over { border-color:var(--bad); background:var(--bad-bg); }
.tcell.under { border-color:var(--gold); background:var(--gold-bg); }
.tn { font-size:.62rem; text-transform:uppercase; letter-spacing:.07em; color:var(--text3); }
.tv { font-family:'IBM Plex Mono',monospace; font-size:.92rem; font-weight:600; color:var(--text); }
.tu { font-family:'IBM Plex Mono',monospace; font-size:.78rem; color:var(--text2); }
.seqrow { display:flex; gap:.4rem; flex-wrap:wrap; align-items:center; margin:.2rem 0 .1rem; }
.scell { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; background:var(--surface2); border:1.5px solid var(--border); border-radius:8px; padding:.5rem .7rem; min-width:52px; text-align:center; color:var(--text); }
.scell.hole { border-style:dashed; border-color:var(--gold); color:var(--gold); background:var(--gold-bg); }
.scell.fixed { border-color:var(--ok); background:var(--ok-bg); color:var(--ok); }
.sdiff { font-size:.7rem; color:var(--text3); font-family:'IBM Plex Mono',monospace; }
.bins { display:grid; grid-template-columns:1fr 1fr; gap:.55rem; margin-top:.7rem; }
@media(max-width:500px){ .bins { grid-template-columns:1fr; } }
.bin { border:1.5px dashed var(--border); border-radius:10px; padding:.7rem .6rem; text-align:center; cursor:pointer; font-size:.83rem; color:var(--text2); min-height:52px; }
.bin:hover { border-color:var(--green); background:var(--green-bg); color:var(--green-dark); }
.bin.pickok { border-style:solid; border-color:var(--ok); background:var(--ok-bg); color:var(--ok); }
.bin.pickno { border-style:solid; border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Sucesiones Aritméticas de Números</div>
    <div class="wcourse" id="wcourse-el">Matemáticas · 1° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);

  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');

}

async function generatePDF() {
  var btn = document.getElementById('dlBtn');
  btn.textContent = 'Generando PDF…';
  btn.disabled = true;

  var jspdf   = window.jspdf;
  var doc     = new jspdf.jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });
  var PW      = 215.9;
  var M       = 18;
  var TW      = PW - M * 2;
  var PH      = doc.internal.pageSize.height;
  var name    = studentData.name;
  var group   = studentData.group;
  var total   = problems.length;
  var pct     = Math.round(correctCount / total * 100);
  var dateStr = new Date().toLocaleString('es-MX', { dateStyle:'long', timeStyle:'short' });

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS — INJECTION BLOCK ─────────────────────────────────────────
  //   Match these RGB values to --green and --gold above.

               (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  if (_isIOS) {
    var _pdfFile = new File([_pdfBlob], _fname, { type:'application/pdf' });

function L(o){ if(o===null||o===undefined) return ''; if(typeof o!=='object') return String(o); return (o[LANG]!==undefined?o[LANG]:o.es); }
function numStr(n){ return n<0 ? '−'+Math.abs(n) : String(n); }
function signStr(n){ return n<0 ? '− '+Math.abs(n) : '+ '+n; }
function cssVar(n){ try { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); } catch(e){ return ''; } }
function shuffleOpts(opts, correct, rng){ var a=shuffle(opts,rng); return { options:a, correctIdx:a.indexOf(correct) }; }
function mkNums(correct, cands){
  var out=[correct], i;
  for(i=0;i<cands.length && out.length<4;i++){ if(out.indexOf(cands[i])<0) out.push(cands[i]); }
  var d=1;
  while(out.length<4){
    if(out.indexOf(correct+d)<0) out.push(correct+d);
    if(out.length<4 && out.indexOf(correct-d)<0) out.push(correct-d);
    d++;
  }
  return out;
}
function numOptions(correct, cands, unit){
  var u = unit||'';
  return { options: mkNums(correct,cands).map(function(v){ return numStr(v)+u; }), correct: numStr(correct)+u };
}
function uniq4(list){
  var out=[], i;
  for(i=0;i<list.length;i++){ if(out.indexOf(list[i])<0) out.push(list[i]); if(out.length===4) break; }
  return out;
}
function ruleStr(d,b){ return numStr(d)+'n' + (b>0 ? ' + '+b : (b<0 ? ' − '+Math.abs(b) : '')); }
function seqTerms(a1,d,k){ var s=[],i; for(i=0;i<k;i++) s.push(a1+i*d); return s; }
function seqList(a1,d,k){ return seqTerms(a1,d,k).map(numStr).join(', ')+', …'; }
function evalStr(d,k,b){ return d+' × '+k+(b!==0?' '+signStr(b):'')+' = '+(d*k+b); }
function addSection(html){
  var d=document.createElement('div'); d.className='section'; d.innerHTML=html;
  document.getElementById('lessonBody').appendChild(d); return d;
}
function addProblem(rng, cfg){
  var so = shuffleOpts(cfg.options, cfg.correct, rng);
  problems.push({ title:cfg.title, questionText:cfg.questionText, fn:cfg.fn||'', hint:cfg.hint,
    explanation:cfg.explanation, options:so.options, correctIdx:so.correctIdx,
    showWork:!!cfg.showWork, studentChoice:null, pendingChoice:null });
  buildOneCard(problems[problems.length-1], problems.length-1);
}
function subRng(rng, tag){ return seededRng(tag + Math.floor(rng()*1000000)); }
function setFb(id, txt, kind){
  var e=document.getElementById(id); if(!e) return;
  e.innerHTML = txt; e.className = 'mfb' + (kind?(' '+kind):'');
}
function roundTxt(r){ return L({es:'Ronda ',en:'Round '})+r+L({es:' de 3',en:' of 3'}); }
function fitCanvas(c){
  var dpr=window.devicePixelRatio||1, rect=c.getBoundingClientRect();
  if(rect.width<10) return null;
  c.width=rect.width*dpr; c.height=rect.height*dpr;
  var ctx=c.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,rect.width,rect.height);
  return { ctx:ctx, W:rect.width, H:rect.height };
}

/* ═════════ WIDGET 1: fábrica de sucesiones ═════════ */
var W1 = { round:0, tries:0, a1:0, d:0, done:false, rng:null };
function w1New(){
  var r=W1.rng; if(!r) return;
  var d=(r()<0.42?-1:1)*(2+Math.floor(r()*4));
  var a1=-6+Math.floor(r()*15);
  W1.a1=a1; W1.d=d; W1.tries=0;
  var sa=document.getElementById('w1a'), sd=document.getElementById('w1d');
  if(!sa||!sd) return;
  sa.value='0'; sd.value='1';
  document.getElementById('w1goal').textContent=L({es:'Fila objetivo: ',en:'Target row: '})+seqList(a1,d,5);
  document.getElementById('w1round').textContent=roundTxt(W1.round+1);
  setFb('w1fb', L({es:'Mueve los dos controles hasta que tu fila coincida término a término con la fila objetivo.',
                   en:'Move both controls until your row matches the target row term by term.'}), '');
  w1Live();
}
function w1Live(){
  var sa=document.getElementById('w1a'), sd=document.getElementById('w1d');
  if(!sa||!sd) return;
  var ca=parseInt(sa.value,10), cd=parseInt(sd.value,10), i;
  document.getElementById('w1aval').textContent=numStr(ca);
  document.getElementById('w1dval').textContent=numStr(cd);
  document.getElementById('w1mine').textContent=seqList(ca,cd,5);
  var mine=seqTerms(ca,cd,5), goal=seqTerms(W1.a1,W1.d,5), h='';
  for(i=0;i<5;i++){
    var cls = mine[i]===goal[i] ? 'hit' : (mine[i]>goal[i] ? 'over' : 'under');
    var mark = mine[i]===goal[i] ? '✓' : (mine[i]>goal[i] ? '▲' : '▼');
    h+='<div class="tcell '+cls+'"><div class="tn">n = '+(i+1)+'</div><div class="tv">'+numStr(mine[i])+'</div><div class="tu">'+mark+'</div></div>';
  }
  document.getElementById('w1table').innerHTML=h;
  w1Draw(mine, goal);
}
function w1Draw(mine, goal){
  var c=document.getElementById('w1canvas'); if(!c) return;
  var f=fitCanvas(c); if(!f) return;
  var ctx=f.ctx, W=f.W, H=f.H, i;
  var all=mine.concat(goal);
  var lo=Math.min.apply(null,all), hi=Math.max.apply(null,all);
  if(hi-lo<8){ var mid=(hi+lo)/2; lo=Math.round(mid-4); hi=Math.round(mid+4); }
  var pad=Math.max(1,Math.round((hi-lo)*0.08)); lo-=pad; hi+=pad;
  function X(v){ return 24+(v-lo)/(hi-lo)*(W-48); }
  var y=H*0.55;
  ctx.strokeStyle=cssVar('--border'); ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(12,y); ctx.lineTo(W-12,y); ctx.stroke();
  if(lo<0 && hi>0){
    ctx.strokeStyle=cssVar('--text3'); ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(X(0),y-30); ctx.lineTo(X(0),y+30); ctx.stroke();
    ctx.fillStyle=cssVar('--text3'); ctx.font='10px "IBM Plex Mono", monospace'; ctx.textAlign='center';
    ctx.fillText('0', X(0), y+44);
  }
  ctx.font='11px "IBM Plex Mono", monospace'; ctx.textAlign='center';
  for(i=0;i<goal.length;i++){
    ctx.strokeStyle=cssVar('--gold'); ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(X(goal[i]), y-15, 6, 0, 6.2832); ctx.stroke();
    ctx.fillStyle=cssVar('--gold'); ctx.fillText(numStr(goal[i]), X(goal[i]), y-27);
  }
  for(i=0;i<mine.length;i++){
    ctx.fillStyle = (mine[i]===goal[i]) ? cssVar('--ok') : cssVar('--green');
    ctx.beginPath(); ctx.arc(X(mine[i]), y+15, 5, 0, 6.2832); ctx.fill();
    ctx.fillStyle = (mine[i]===goal[i]) ? cssVar('--ok') : cssVar('--text2');
    ctx.fillText(numStr(mine[i]), X(mine[i]), y+34);
  }
  ctx.fillStyle=cssVar('--text3'); ctx.font='10px "IBM Plex Sans", sans-serif'; ctx.textAlign='left';
  ctx.fillText(L({es:'aros: fila objetivo',en:'rings: target row'}), 12, 14);
  ctx.fillText(L({es:'puntos: tu fila',en:'dots: your row'}), 12, H-6);
}
function w1Check(){
  if(W1.done) return;
  var ca=parseInt(document.getElementById('w1a').value,10), cd=parseInt(document.getElementById('w1d').value,10);
  if(ca===W1.a1 && cd===W1.d){
    setFb('w1fb', L({es:'Fila armada. Empieza en '+numStr(W1.a1)+' y avanza de '+numStr(W1.d)+' en '+numStr(W1.d)+' hasta el final. 🎉',
                     en:'Row built. It starts at '+numStr(W1.a1)+' and moves by '+numStr(W1.d)+' at every step. 🎉'}), 'good');
    w1Next(); return;
  }
  W1.tries++;
  if(W1.tries>=3){
    document.getElementById('w1a').value=String(W1.a1);
    document.getElementById('w1d').value=String(W1.d);
    w1Live();
    setFb('w1fb', L({es:'Así queda: el primer término vale '+numStr(W1.a1)+' y el paso vale '+numStr(W1.d)+'. Observa cómo la fila cuadra completa.',
                     en:'Here it is: the first term is '+numStr(W1.a1)+' and the step is '+numStr(W1.d)+'. Notice how the whole row lines up.'}), 'warn');
    w1Next(); return;
  }
  var msg;
  if(ca!==W1.a1){
    msg = ca<W1.a1
      ? L({es:'Tu fila arranca demasiado abajo: sube el primer término hasta que el punto se meta dentro del primer aro.',
           en:'Your row starts too low: raise the first term until the dot lands inside the first ring.'})
      : L({es:'Tu fila arranca demasiado arriba: baja el primer término hasta que el punto se meta dentro del primer aro.',
           en:'Your row starts too high: lower the first term until the dot lands inside the first ring.'});
  } else if((cd>0)!==(W1.d>0)){
    msg = W1.d<0
      ? L({es:'El arranque ya coincide, pero la fila objetivo baja y la tuya sube: el paso tiene que ser negativo.',
           en:'The start already matches, but the target row goes down while yours goes up: the step must be negative.'})
      : L({es:'El arranque ya coincide, pero la fila objetivo sube y la tuya baja: el paso tiene que ser positivo.',
           en:'The start already matches, but the target row goes up while yours goes down: the step must be positive.'});
  } else {
    msg = Math.abs(cd)>Math.abs(W1.d)
      ? L({es:'Buen arranque, pero tus saltos son demasiado grandes: tus puntos se separan más que los aros.',
           en:'Good start, but your jumps are too big: your dots spread out more than the rings.'})
      : L({es:'Buen arranque, pero tus saltos son demasiado pequeños: tus puntos se quedan cortos frente a los aros.',
           en:'Good start, but your jumps are too small: your dots fall short of the rings.'});
  }
  setFb('w1fb', msg, 'warn');
}
function w1Next(){
  W1.round++;
  if(W1.round>=3){
    W1.done=true;
    var e=document.getElementById('w1round');
    if(e) e.textContent=L({es:'Tres filas armadas.',en:'Three rows built.'});
    return;
  }
  setTimeout(w1New, 1300);
}

/* ═════════ WIDGET 2: recta de saltos ═════════ */
var W2 = { round:0, tries:0, a1:0, d:0, T:0, pick:null, lo:0, hi:0, reveal:false, done:false, rng:null };
function w2New(){
  var r=W2.rng; if(!r) return;
  var d=(r()<0.4?-1:1)*(2+Math.floor(r()*5));
  var a1=-4+Math.floor(r()*14);
  W2.a1=a1; W2.d=d; W2.T=a1+3*d; W2.tries=0; W2.pick=null; W2.reveal=false;
  var g=document.getElementById('w2goal'); if(!g) return;
  g.textContent=L({es:'Sucesión: ',en:'Sequence: '})+numStr(a1)+', '+numStr(a1+d)+', '+numStr(a1+2*d)+', ?';
  document.getElementById('w2val').textContent='?';
  document.getElementById('w2round').textContent=roundTxt(W2.round+1);
  setFb('w2fb', L({es:'Toca la recta en el lugar donde debe caer el término que sigue y confirma tu salto.',
                   en:'Tap the line where the next term must land and confirm your jump.'}), '');
  w2Draw();
}
function w2Draw(){
  var c=document.getElementById('w2canvas'); if(!c) return;
  var f=fitCanvas(c); if(!f) return;
  var ctx=f.ctx, W=f.W, H=f.H, v, i;
  var known=[W2.a1, W2.a1+W2.d, W2.a1+2*W2.d];
  var all=known.concat([W2.T]);
  var lo=Math.min.apply(null,all)-Math.abs(W2.d)*2;
  var hi=Math.max.apply(null,all)+Math.abs(W2.d)*2;
  W2.lo=lo; W2.hi=hi;
  function X(u){ return 24+(u-lo)/(hi-lo)*(W-48); }
  var y=H*0.52;
  ctx.strokeStyle=cssVar('--border'); ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(12,y); ctx.lineTo(W-12,y); ctx.stroke();
  var lab=(hi-lo)<=26?5:10;
  ctx.font='10px "IBM Plex Mono", monospace'; ctx.textAlign='center';
  for(v=Math.ceil(lo); v<=hi; v++){
    var big=(v%lab===0);
    ctx.strokeStyle=cssVar(big?'--text3':'--border'); ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(X(v), y-(big?6:3)); ctx.lineTo(X(v), y+(big?6:3)); ctx.stroke();
    if(big){ ctx.fillStyle=cssVar('--text3'); ctx.fillText(numStr(v), X(v), y+19); }
  }
  ctx.font='11px "IBM Plex Mono", monospace';
  for(i=0;i<known.length;i++){
    ctx.fillStyle=cssVar('--green');
    ctx.beginPath(); ctx.arc(X(known[i]), y-16, 6, 0, 6.2832); ctx.fill();
    ctx.fillStyle=cssVar('--green-dark'); ctx.fillText(numStr(known[i]), X(known[i]), y-28);
  }
  if(W2.reveal){
    ctx.strokeStyle=cssVar('--ok'); ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.arc(X(W2.T), y-16, 8, 0, 6.2832); ctx.stroke();
    ctx.fillStyle=cssVar('--ok'); ctx.fillText(numStr(W2.T), X(W2.T), y-31);
  }
  if(W2.pick!==null){
    var px=X(W2.pick);
    ctx.strokeStyle=cssVar('--gold'); ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(px, y+8); ctx.lineTo(px, y+30); ctx.stroke();
    ctx.fillStyle=cssVar('--gold');
    ctx.beginPath(); ctx.arc(px, y+34, 5, 0, 6.2832); ctx.fill();
    ctx.fillText(numStr(W2.pick), px, y+50);
  }
}
function w2Tap(ev){
  if(W2.done) return;
  var c=document.getElementById('w2canvas'); if(!c) return;
  var r=c.getBoundingClientRect();
  var src=(ev.touches && ev.touches[0]) ? ev.touches[0] : ev;
  var x=src.clientX-r.left;
  var v=Math.round(W2.lo + (x-24)/(r.width-48)*(W2.hi-W2.lo));
  if(v<W2.lo) v=W2.lo; if(v>W2.hi) v=W2.hi;
  W2.pick=v;
  document.getElementById('w2val').textContent=numStr(v);
  w2Draw();
}
function w2Check(){
  if(W2.done) return;
  if(W2.pick===null){
    setFb('w2fb', L({es:'Primero toca la recta para colocar tu marca.',en:'First tap the line to place your mark.'}), 'warn');
    return;
  }
  if(W2.pick===W2.T){
    W2.reveal=true; w2Draw();
    setFb('w2fb', L({es:'Justo ahí. El salto entre términos vecinos mide '+numStr(W2.d)+', así que después de '+numStr(W2.a1+2*W2.d)+' viene '+numStr(W2.T)+'. 🎉',
                     en:'Right there. The jump between neighbouring terms is '+numStr(W2.d)+', so after '+numStr(W2.a1+2*W2.d)+' comes '+numStr(W2.T)+'. 🎉'}), 'good');
    w2Next(); return;
  }
  W2.tries++;
  if(W2.tries>=3){
    W2.reveal=true; w2Draw();
    setFb('w2fb', L({es:'El aro verde marca el lugar: de '+numStr(W2.a1+2*W2.d)+' se avanza '+numStr(W2.d)+' y se llega a '+numStr(W2.T)+'.',
                     en:'The green ring marks the spot: from '+numStr(W2.a1+2*W2.d)+' you move '+numStr(W2.d)+' and reach '+numStr(W2.T)+'.'}), 'warn');
    w2Next(); return;
  }
  var diff=W2.pick-W2.T;
  setFb('w2fb', L({es:'Tu marca quedó '+Math.abs(diff)+' unidades a la '+(diff>0?'derecha':'izquierda')+' del lugar correcto. Mide con los dedos el salto que separa a dos términos vecinos y repítelo una vez más.',
                   en:'Your mark landed '+Math.abs(diff)+' units to the '+(diff>0?'right':'left')+' of the right spot. Measure the jump between two neighbouring terms and repeat it once more.'}), 'warn');
}
function w2Next(){
  W2.round++;
  if(W2.round>=3){
    W2.done=true;
    var e=document.getElementById('w2round');
    if(e) e.textContent=L({es:'Tres saltos colocados.',en:'Three jumps placed.'});
    return;
  }
  setTimeout(w2New, 1400);
}

/* ═════════ WIDGET 3: armador de reglas ═════════ */
var W3 = { round:0, tries:0, a1:0, d:0, b:0, cd:null, cb:null, done:false, rng:null };
function w3New(){
  var r=W3.rng; if(!r) return;
  var d=2+Math.floor(r()*5);
  if(r()<0.3) d=-d;
  var a1=(d>0? 1+Math.floor(r()*10) : 12+Math.floor(r()*8));
  W3.d=d; W3.a1=a1; W3.b=a1-d; W3.cd=null; W3.cb=null; W3.tries=0;
  var box=document.getElementById('w3dchips'); if(!box) return;
  var dvals=shuffle([d, d+1, d-1, -d], r);
  var bvals=shuffle([W3.b, W3.b+d, W3.b-d, W3.b+1], r);
  var h='', i;
  for(i=0;i<dvals.length;i++) h+='<button class="mbtn mono" id="w3d'+i+'" onclick="w3Pick(\'d\','+dvals[i]+','+i+')">'+numStr(dvals[i])+'n</button>';
  box.innerHTML=h;
  h='';
  for(i=0;i<bvals.length;i++) h+='<button class="mbtn mono" id="w3b'+i+'" onclick="w3Pick(\'b\','+bvals[i]+','+i+')">'+signStr(bvals[i])+'</button>';
  document.getElementById('w3bchips').innerHTML=h;
  document.getElementById('w3goal').textContent=L({es:'Sucesión: ',en:'Sequence: '})+seqList(a1,d,5);
  document.getElementById('w3round').textContent=roundTxt(W3.round+1);
  setFb('w3fb', L({es:'Elige una pieza de cada renglón y observa qué números produce tu regla en la tabla.',
                   en:'Pick one piece from each row and watch what numbers your rule produces in the table.'}), '');
  w3Live();
}
function w3Pick(kind, val, idx){
  if(W3.done) return;
  var pre = kind==='d' ? 'w3d' : 'w3b';
  var i;
  for(i=0;i<4;i++){ var e=document.getElementById(pre+i); if(e) e.classList.remove('on'); }
  var sel=document.getElementById(pre+idx); if(sel) sel.classList.add('on');
  if(kind==='d') W3.cd=val; else W3.cb=val;
  w3Live();
}
function w3Live(){
  var goal=seqTerms(W3.a1, W3.d, 4), i, h='';
  var expr='a(n) = ' + (W3.cd===null?'?n':numStr(W3.cd)+'n') + ' ' + (W3.cb===null?'?':signStr(W3.cb));
  var re=document.getElementById('w3rule'); if(re) re.textContent=expr;
  for(i=1;i<=4;i++){
    var val = (W3.cd===null||W3.cb===null) ? null : W3.cd*i+W3.cb;
    var cls='', mark='?';
    if(val!==null){
      cls = val===goal[i-1] ? 'hit' : (val>goal[i-1] ? 'over' : 'under');
      mark = val===goal[i-1] ? '✓' : (val>goal[i-1] ? '▲' : '▼');
    }
    h+='<div class="tcell '+cls+'"><div class="tn">n = '+i+'</div><div class="tv">'+(val===null?'?':numStr(val))+'</div><div class="tu">'+mark+' '+numStr(goal[i-1])+'</div></div>';
  }
  document.getElementById('w3table').innerHTML=h;
}
function w3Check(){
  if(W3.done) return;
  if(W3.cd===null||W3.cb===null){
    setFb('w3fb', L({es:'Falta elegir una pieza: necesitas la que multiplica a n y la que se suma o se resta.',
                     en:'One piece is missing: you need the one multiplying n and the one added or subtracted.'}), 'warn');
    return;
  }
  if(W3.cd===W3.d && W3.cb===W3.b){
    setFb('w3fb', L({es:'Regla lista: a(n) = '+ruleStr(W3.d,W3.b)+' devuelve la sucesión completa. 🎉',
                     en:'Rule ready: a(n) = '+ruleStr(W3.d,W3.b)+' returns the whole sequence. 🎉'}), 'good');
    w3Next(); return;
  }
  W3.tries++;
  if(W3.tries>=3){
    W3.cd=W3.d; W3.cb=W3.b; w3Live();
    setFb('w3fb', L({es:'La regla que cuadra es a(n) = '+ruleStr(W3.d,W3.b)+': el número que multiplica a n es el paso de la sucesión y el otro acomoda la altura.',
                     en:'The rule that fits is a(n) = '+ruleStr(W3.d,W3.b)+': the number multiplying n is the step of the sequence and the other one sets the height.'}), 'warn');
    w3Next(); return;
  }
  var my1=W3.cd+W3.cb, msg;
  if(my1!==W3.a1){
    msg = L({es:'En la posición 1 tu regla da '+numStr(my1)+' y la sucesión empieza en '+numStr(W3.a1)+': mueve la pieza que se suma o se resta.',
             en:'At position 1 your rule gives '+numStr(my1)+' while the sequence starts at '+numStr(W3.a1)+': change the piece that is added or subtracted.'});
  } else {
    msg = L({es:'El primer valor coincide, pero tu regla avanza de '+numStr(W3.cd)+' en '+numStr(W3.cd)+' y la sucesión avanza de '+numStr(W3.d)+' en '+numStr(W3.d)+': cambia la pieza que multiplica a n.',
             en:'The first value matches, but your rule moves by '+numStr(W3.cd)+' each step while the sequence moves by '+numStr(W3.d)+': change the piece multiplying n.'});
  }
  setFb('w3fb', msg, 'warn');
}
function w3Next(){
  W3.round++;
  if(W3.round>=3){
    W3.done=true;
    var e=document.getElementById('w3round');
    if(e) e.textContent=L({es:'Tres reglas armadas.',en:'Three rules built.'});
    return;
  }
  setTimeout(w3New, 1400);
}

/* ═════════ WIDGET 4: aparece o no aparece ═════════ */
var W4 = { round:0, tries:0, d:0, b:0, T:0, k:0, belongs:false, done:false, rng:null };
function w4New(){
  var r=W4.rng; if(!r) return;
  var d=2+Math.floor(r()*5);
  var b=-4+Math.floor(r()*11);
  var k=4+Math.floor(r()*9);
  var belongs=(r()<0.5);
  var T=d*k+b;
  if(!belongs) T+=1+Math.floor(r()*(d-1));
  W4.d=d; W4.b=b; W4.k=k; W4.T=T; W4.belongs=belongs; W4.tries=0;
  var e=document.getElementById('w4rule'); if(!e) return;
  e.textContent='a(n) = '+ruleStr(d,b);
  document.getElementById('w4cand').textContent=L({es:'Número en juego: ',en:'Number in play: '})+numStr(T);
  document.getElementById('w4round').textContent=roundTxt(W4.round+1);
  ['w4yes','w4no'].forEach(function(id){ var x=document.getElementById(id); if(x) x.className='bin'; });
  setFb('w4fb', L({es:'Decide si ese número puede salir de la regla y toca la caja que corresponda.',
                   en:'Decide whether that number can come out of the rule and tap the matching box.'}), '');
}
function w4Bin(choice){
  if(W4.done) return;
  var ok = ((choice===1) === W4.belongs);
  var id = choice===1 ? 'w4yes' : 'w4no';
  var el = document.getElementById(id);
  if(ok){
    if(el) el.className='bin pickok';
    var txt = W4.belongs
      ? L({es:'Correcto: '+evalStr(W4.d,W4.k,W4.b)+', así que ese número ocupa la posición '+W4.k+'. 🎉',
           en:'Correct: '+evalStr(W4.d,W4.k,W4.b)+', so that number sits at position '+W4.k+'. 🎉'})
      : L({es:'Correcto: la sucesión salta de '+numStr(W4.d*Math.floor((W4.T-W4.b)/W4.d)+W4.b)+' a '+numStr(W4.d*(Math.floor((W4.T-W4.b)/W4.d)+1)+W4.b)+' y '+numStr(W4.T)+' se queda en medio, sin posición. 🎉',
           en:'Correct: the sequence jumps from '+numStr(W4.d*Math.floor((W4.T-W4.b)/W4.d)+W4.b)+' to '+numStr(W4.d*(Math.floor((W4.T-W4.b)/W4.d)+1)+W4.b)+' and '+numStr(W4.T)+' stays in between, with no position. 🎉'});
    setFb('w4fb', txt, 'good');
    w4Next(); return;
  }
  if(el) el.className='bin pickno';
  W4.tries++;
  if(W4.tries>=3){
    var rv = W4.belongs
      ? L({es:'Sí sale de la regla: '+evalStr(W4.d,W4.k,W4.b)+', y su posición es '+W4.k+'.',
           en:'It does come out of the rule: '+evalStr(W4.d,W4.k,W4.b)+', and its position is '+W4.k+'.'})
      : L({es:'No sale de la regla: entre '+numStr(W4.d*Math.floor((W4.T-W4.b)/W4.d)+W4.b)+' y '+numStr(W4.d*(Math.floor((W4.T-W4.b)/W4.d)+1)+W4.b)+' no hay ningún término intermedio.',
           en:'It does not come out of the rule: between '+numStr(W4.d*Math.floor((W4.T-W4.b)/W4.d)+W4.b)+' and '+numStr(W4.d*(Math.floor((W4.T-W4.b)/W4.d)+1)+W4.b)+' there is no term in between.'});
    setFb('w4fb', rv, 'warn');
    w4Next(); return;
  }
  var p=Math.floor((W4.T-W4.b)/W4.d);
  var hintTxt = W4.belongs
    ? L({es:'Vuelve a intentarlo: quita a '+numStr(W4.T)+' lo que la regla suma o resta y reparte lo que queda entre '+W4.d+'; fíjate si el reparto sale exacto.',
         en:'Try again: take away from '+numStr(W4.T)+' what the rule adds or subtracts and split the rest by '+W4.d+'; check whether that split comes out exact.'})
    : L({es:'Vuelve a intentarlo: la sucesión pasa por '+numStr(W4.d*p+W4.b)+' y luego por '+numStr(W4.d*(p+1)+W4.b)+'. Revisa si '+numStr(W4.T)+' cae justo en uno de esos escalones.',
         en:'Try again: the sequence passes through '+numStr(W4.d*p+W4.b)+' and then through '+numStr(W4.d*(p+1)+W4.b)+'. Check whether '+numStr(W4.T)+' lands exactly on one of those steps.'});
  setFb('w4fb', hintTxt, 'warn');
  setTimeout(function(){ var x=document.getElementById(id); if(x && x.className==='bin pickno') x.className='bin'; }, 700);
}
function w4Next(){
  W4.round++;
  if(W4.round>=3){
    W4.done=true;
    var e=document.getElementById('w4round');
    if(e) e.textContent=L({es:'Tres números revisados.',en:'Three numbers checked.'});
    return;
  }
  setTimeout(w4New, 1500);
}

    '<p>'+L({es:'Una sucesión aritmética no contiene todos los números: avanza a escalones y deja huecos entre ellos. Para saber si cierto número pertenece a la fila conviene deshacer la regla, es decir, quitar lo que se suma o se resta y repartir lo que queda entre el salto.',
             en:'An arithmetic sequence does not contain every number: it advances in steps and leaves gaps between them. To know whether a given number belongs to the row it helps to undo the rule, that is, remove what is added or subtracted and split what remains by the jump.'})+'</p>'+
    '<p>'+L({es:'Si el reparto sale exacto, el número aparece y ese resultado es su posición. Si sobra algo, el número se quedó entre dos escalones y no forma parte de la sucesión, por cerca que esté.',
             en:'If that split comes out exact, the number shows up and the result is its position. If something is left over, the number fell between two steps and is not part of the sequence, no matter how close it is.'})+'</p>'
  );

  addSection(
    '<div class="gcrd">'+
      '<div class="mstage">'+L({es:'Aduana de la sucesión',en:'Sequence checkpoint'})+'</div>'+
      '<div class="mexpr big" id="w4rule">a(n) = ?</div>'+
      '<div class="mgoal" id="w4cand" style="margin-top:.7rem"></div>'+
      '<div class="bins">'+
        '<div class="bin" id="w4yes" onclick="w4Bin(1)">'+L({es:'Sí aparece en la sucesión',en:'It does appear in the sequence'})+'</div>'+
        '<div class="bin" id="w4no" onclick="w4Bin(0)">'+L({es:'No aparece en la sucesión',en:'It does not appear in the sequence'})+'</div>'+
      '</div>'+
      '<div class="mfb" id="w4fb"></div>'+
      '<div class="mtrack" id="w4round"></div>'+
    '</div>'
  );
  W4 = { round:0, tries:0, d:0, b:0, T:0, k:0, belongs:false, done:false, rng:subRng(rng,'w4') };
  setTimeout(function(){ w4New(); }, 220);

  /* ─── P7 ─── */
  (function(){
    var cfg, v=Math.floor(rng()*2);
    if(v===0){
      var d=3+Math.floor(rng()*5), b=1+Math.floor(rng()*7), k=9+Math.floor(rng()*6);
      var T=d*k+b;
      var right=L({es:'Sí, ocupa la posición '+k, en:'Yes, it sits at position '+k});
      var opts=uniq4([right,
        L({es:'Sí, ocupa la posición '+(k+1), en:'Yes, it sits at position '+(k+1)}),
        L({es:'Sí, ocupa la posición '+(k-1), en:'Yes, it sits at position '+(k-1)}),
        L({es:'No, ningún término de la sucesión vale '+T, en:'No, no term of the sequence is worth '+T})]);
      cfg={
        title:L({es:'Un número en la puerta',en:'A number at the door'}),
        questionText:L({es:'¿El número '+T+' aparece en la sucesión que produce esta regla?',
                        en:'Does the number '+T+' appear in the sequence produced by this rule?'}),
        fn:'a(n) = '+ruleStr(d,b),
        hint:L({es:'Quita al número lo que la regla suma y reparte lo que queda entre lo que multiplica a n; si el reparto es exacto, ese resultado es la posición.',
                en:'Take away from the number what the rule adds and split the rest by what multiplies n; if the split is exact, that result is the position.'}),
        explanation:L({es:'Al quitar '+b+' quedan '+(T-b)+', y '+(T-b)+' ÷ '+d+' = '+k+' sin sobrantes, así que el número aparece: '+evalStr(d,k,b),
                       en:'Removing '+b+' leaves '+(T-b)+', and '+(T-b)+' ÷ '+d+' = '+k+' with nothing left over, so the number appears: '+evalStr(d,k,b)}),
        options:opts, correct:right, showWork:false
      };
    } else {
      var d2=4+Math.floor(rng()*4), b2=1+Math.floor(rng()*6), p=8+Math.floor(rng()*6);
      var off=1+Math.floor(rng()*(d2-1));
      var T2=d2*p+b2+off;
      var right2=L({es:'No, ningún término de la sucesión vale '+T2, en:'No, no term of the sequence is worth '+T2});
      var opts2=uniq4([right2,
        L({es:'Sí, ocupa la posición '+p, en:'Yes, it sits at position '+p}),
        L({es:'Sí, ocupa la posición '+(p+1), en:'Yes, it sits at position '+(p+1)}),
        L({es:'Sí, ocupa la posición '+(p+2), en:'Yes, it sits at position '+(p+2)})]);
      cfg={
        title:L({es:'Un número que toca la puerta',en:'A number knocking at the door'}),
        questionText:L({es:'¿El número '+T2+' aparece en la sucesión que produce esta regla?',
                        en:'Does the number '+T2+' appear in the sequence produced by this rule?'}),
        fn:'a(n) = '+ruleStr(d2,b2),
        hint:L({es:'Quita al número lo que la regla suma y reparte lo que queda entre lo que multiplica a n; si sobra algo, el número cayó entre dos términos.',
                en:'Take away from the number what the rule adds and split the rest by what multiplies n; if something is left over, the number fell between two terms.'}),
        explanation:L({es:'Al quitar '+b2+' quedan '+(T2-b2)+', y ese resultado no se reparte exacto entre '+d2+': la sucesión pasa de '+(d2*p+b2)+' a '+(d2*(p+1)+b2)+' y deja fuera a '+T2,
                       en:'Removing '+b2+' leaves '+(T2-b2)+', and that result does not split exactly by '+d2+': the sequence goes from '+(d2*p+b2)+' to '+(d2*(p+1)+b2)+' and leaves '+T2+' out'}),
        options:opts2, correct:right2, showWork:false
      };
    }
    addProblem(rng,cfg);
  })();

  /* ─── CIERRE ─── */
  addSection(
    '<div class="stag">'+L({es:'Cierre',en:'Closing'})+'</div>'+
    '<h2>'+L({es:'Todo junto',en:'All together'})+'</h2>'+
    '<p>'+L({es:'Las siguientes situaciones mezclan filas de números, posiciones lejanas y expresiones con n.',
             en:'The situations below mix rows of numbers, distant positions and expressions with n.'})+'</p>'
  );

  /* ─── P8 ─── */
  (function(){
    var cfg, v=Math.floor(rng()*2);
    if(v===0){
      var a1=-12+Math.floor(rng()*8), d=4+Math.floor(rng()*5), k=20;
      var ans=a1+(k-1)*d;
      var o=numOptions(ans,[a1+k*d, a1+(k-2)*d, k*d, ans+d]);
      cfg={
        title:L({es:'Hasta la posición veinte',en:'All the way to position twenty'}),
        questionText:L({es:'Calcula el término que ocupa la posición 20 en esta sucesión.',
                        en:'Calculate the term at position 20 in this sequence.'}),
        fn:seqList(a1,d,5),
        hint:L({es:'Cuenta los saltos que hay entre la posición 1 y la posición 20, multiplícalos por el tamaño del salto y suma el primer término.',
                en:'Count the jumps between position 1 and position 20, multiply them by the size of the jump and add the first term.'}),
        explanation:L({es:'Son 19 saltos de '+d+' desde '+numStr(a1)+': '+numStr(a1)+' + 19 × '+d+' = '+numStr(ans),
                       en:'There are 19 jumps of '+d+' from '+numStr(a1)+': '+numStr(a1)+' + 19 × '+d+' = '+numStr(ans)}),
        options:o.options, correct:o.correct, showWork:true
      };
    } else {
      var d2=5+Math.floor(rng()*4), b2=-(3+Math.floor(rng()*7)), k2=14+Math.floor(rng()*6);
      var ans2=d2*k2+b2;
      var o2=numOptions(ans2,[d2*(k2-1)+b2, d2*k2-b2, d2*k2, d2*(k2+1)+b2]);
      cfg={
        title:L({es:'Evaluar sin dibujar la fila',en:'Evaluating without drawing the row'}),
        questionText:L({es:'Calcula el término que ocupa la posición '+k2+' en la sucesión definida por esta regla.',
                        en:'Calculate the term at position '+k2+' in the sequence defined by this rule.'}),
        fn:'a(n) = '+ruleStr(d2,b2),
        hint:L({es:'Sustituye la posición en el lugar de n y resuelve primero la multiplicación antes de quitar lo que se resta.',
                en:'Substitute the position in place of n and solve the multiplication first before removing what is subtracted.'}),
        explanation:L({es:'Se sustituye n = '+k2+': '+evalStr(d2,k2,b2),
                       en:'Substituting n = '+k2+': '+evalStr(d2,k2,b2)}),
        options:o2.options, correct:o2.correct, showWork:true
      };
    }
    addProblem(rng,cfg);
  })();

  /* ─── P9 ─── */
  (function(){
    var cfg, v=Math.floor(rng()*2);
    if(v===0){
      var a1=12+Math.floor(rng()*8), d=3+Math.floor(rng()*4), k=11+Math.floor(rng()*5);
      var ans=a1+(k-1)*d;
      var o=numOptions(ans,[a1+k*d, a1+(k-2)*d, k*d, a1+d]);
      cfg={
        title:L({es:'Las filas del auditorio',en:'The rows of the auditorium'}),
        questionText:L({es:'La primera fila de un auditorio tiene '+a1+' asientos y cada fila siguiente tiene '+d+' asientos más que la anterior. ¿Cuántos asientos tiene la fila número '+k+'?',
                        en:'The first row of an auditorium has '+a1+' seats and each following row has '+d+' seats more than the previous one. How many seats does row number '+k+' have?'}),
        fn:'',
        hint:L({es:'Cuenta cuántas veces se agregan asientos al pasar de la primera fila a la fila pedida; ese conteo queda uno abajo del número de la fila.',
                en:'Count how many times seats are added when going from the first row to the requested one; that count is one below the row number.'}),
        explanation:L({es:'De la fila 1 a la fila '+k+' hay '+(k-1)+' aumentos de '+d+' asientos: '+a1+' + '+(k-1)+' × '+d+' = '+ans,
                       en:'From row 1 to row '+k+' there are '+(k-1)+' increases of '+d+' seats: '+a1+' + '+(k-1)+' × '+d+' = '+ans}),
        options:o.options, correct:o.correct, showWork:true
      };
    } else {
      var v0=200+10*Math.floor(rng()*8), r0=12+Math.floor(rng()*9), h=7+Math.floor(rng()*6);
      var ans2=v0-h*r0;
      var o2=numOptions(ans2,[v0-(h-1)*r0, v0-(h+1)*r0, h*r0, v0-r0]);
      cfg={
        title:L({es:'El tinaco que se vacía',en:'The tank that empties'}),
        questionText:L({es:'Un tinaco tiene '+v0+' litros de agua y de él salen '+r0+' litros cada hora, siempre la misma cantidad. ¿Cuántos litros quedarán después de '+h+' horas?',
                        en:'A water tank holds '+v0+' litres and '+r0+' litres leave it every hour, always the same amount. How many litres will be left after '+h+' hours?'}),
        fn:'',
        hint:L({es:'Calcula cuánta agua sale en total durante ese tiempo y quítasela a la cantidad que había al principio.',
                en:'Work out how much water leaves in total during that time and take it away from the amount there was at the start.'}),
        explanation:L({es:'En '+h+' horas salen '+h+' × '+r0+' = '+(h*r0)+' litros de los '+v0+' iniciales: '+v0+' − '+(h*r0)+' = '+ans2,
                       en:'In '+h+' hours '+h+' × '+r0+' = '+(h*r0)+' litres leave out of the initial '+v0+': '+v0+' − '+(h*r0)+' = '+ans2}),
        options:o2.options, correct:o2.correct, showWork:true
      };
    }
    addProblem(rng,cfg);
  })();

  /* ─── P10 ─── */
  (function(){
    var cfg, v=Math.floor(rng()*2);
    if(v===0){
      var d=3+Math.floor(rng()*5), b=-4+Math.floor(rng()*10), a1=d+b;
      var right=seqList(a1,d,4);
      var opts=uniq4([right, seqList(b,d,4), seqList(a1,d+1,4), seqList(a1+1,d,4), seqList(a1,d-1,4)]);
      cfg={
        title:L({es:'La fila que produce la regla',en:'The row the rule produces'}),
        questionText:L({es:'¿Cuál de estas sucesiones es la que genera esta regla?',
                        en:'Which of these sequences is the one this rule generates?'}),
        fn:'a(n) = '+ruleStr(d,b),
        hint:L({es:'Evalúa la regla en las posiciones 1, 2 y 3, y compara los tres resultados con el inicio de cada opción.',
                en:'Evaluate the rule at positions 1, 2 and 3, and compare the three results with the beginning of each option.'}),
        explanation:L({es:'Al evaluar las primeras posiciones: '+evalStr(d,1,b)+', '+evalStr(d,2,b)+' y '+evalStr(d,3,b),
                       en:'Evaluating the first positions: '+evalStr(d,1,b)+', '+evalStr(d,2,b)+' and '+evalStr(d,3,b)}),
        options:opts, correct:right, showWork:false
      };
    } else {
      var a2=2+Math.floor(rng()*7), d2=4+Math.floor(rng()*5);
      var right2=seqTerms(a2,d2,4).map(numStr).join(', ')+', …';
      var g1=a2+1;
      var badA=[g1, g1*2, g1*4, g1*8].join(', ')+', …';
      var badB=[a2, a2+2, a2+5, a2+9].join(', ')+', …';
      var badC=[a2+1, a2+4, a2+9, a2+16].join(', ')+', …';
      var opts2=uniq4([right2, badA, badB, badC]);
      cfg={
        title:L({es:'Cuál de todas es aritmética',en:'Which one of them is arithmetic'}),
        questionText:L({es:'¿Cuál de estas sucesiones tiene progresión aritmética?',
                        en:'Which of these sequences has an arithmetic progression?'}),
        fn:'',
        hint:L({es:'Resta cada término del que le sigue en las cuatro opciones; solo una mantiene el mismo resultado en todas sus restas.',
                en:'Subtract each term from the next one in the four options; only one keeps the same result in all of its subtractions.'}),
        explanation:L({es:'En la fila que empieza en '+a2+' todas las restas entre términos vecinos dan lo mismo: '+(a2+d2)+' − '+a2+' = '+d2+' y '+(a2+2*d2)+' − '+(a2+d2)+' = '+d2,
                       en:'In the row starting at '+a2+' every subtraction between neighbouring terms gives the same value: '+(a2+d2)+' − '+a2+' = '+d2+' and '+(a2+2*d2)+' − '+(a2+d2)+' = '+d2}),
        options:opts2, correct:right2, showWork:false
      };
    }
    addProblem(rng,cfg);
  })();
}
</script>

<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbzLGV15JRTPs9bbSvHRLfgOXeT9oUExDf1AH546WOwq5tYxXSdhX212OWi_bTJfMGx9/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'Sucesiones Aritméticas de Números';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
