<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modelos con Ecuaciones Proporcionales</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
  .gcanvas { height: 215px; }
  .ptable { font-size: .78rem; }
  .ptable th, .ptable td { padding: .35rem .15rem; }
  .stepbtn { width: 42px; height: 44px; }
  .stepval { min-width: 40px; font-size: .88rem; }
  .chip { min-width: 44px; font-size: .88rem; padding: .45rem .6rem; }
  .eqline { font-size: 1rem; }
  .macnode { min-width: 62px; padding: .5rem .55rem; }
  .iw-box { padding: .7rem; }
}

/* ── INTERACTIVE WIDGETS ── */
.iw-tag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.4rem; }
.iw-box { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; padding:1rem; }
.iw-instr { font-size:.88rem; color:var(--text2); margin-bottom:.7rem; }
.iw-sit { font-size:.9rem; color:var(--text); background:var(--surface2); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.6rem .8rem; margin:.5rem 0; }
.rfb { font-size:.84rem; margin-top:.6rem; min-height:1.35rem; color:var(--text2); }
.rfb b { color:var(--green-dark); }
.rverify-btn { background:var(--green); color:#fff; border:none; border-radius:8px; padding:.6rem 1.2rem; font-size:.86rem; font-weight:600; cursor:pointer; min-height:44px; margin-top:.7rem; font-family:inherit; }
.rverify-btn:hover { background:var(--green-dark); }
.rondas { font-family:'IBM Plex Mono',monospace; font-size:.7rem; color:var(--text3); letter-spacing:.08em; text-transform:uppercase; margin-bottom:.45rem; }
.ptable { width:100%; border-collapse:collapse; font-family:'IBM Plex Mono',monospace; font-size:.86rem; }
.ptable th, .ptable td { border:1px solid var(--border); padding:.4rem .25rem; text-align:center; }
.ptable th { background:var(--surface2); font-weight:600; color:var(--text3); font-size:.68rem; text-transform:uppercase; letter-spacing:.05em; }
.ptable tr.hit td { background:var(--ok-bg); color:var(--ok); }
.eqline { font-family:'IBM Plex Mono',monospace; font-size:1.15rem; font-weight:700; text-align:center; padding:.7rem .5rem; background:var(--surface2); border-radius:10px; margin:.6rem 0; color:var(--green-dark); }
.eqslot { display:inline-block; min-width:34px; border-bottom:2px solid var(--gold); color:var(--gold); }
.chiplbl { font-size:.7rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-top:.5rem; }
.chiprow { display:flex; flex-wrap:wrap; gap:.45rem; margin:.35rem 0 .2rem; }
.chip { border:1.5px solid var(--border); border-radius:8px; padding:.5rem .75rem; cursor:pointer; background:var(--surface2); font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; min-width:48px; min-height:44px; display:flex; align-items:center; justify-content:center; color:var(--text); }
.chip:hover { border-color:var(--green); color:var(--green); }
.chip.sel { border-color:var(--gold); background:var(--gold-bg); color:var(--green-dark); }
.macflow { display:flex; align-items:center; justify-content:center; gap:.45rem; flex-wrap:wrap; margin:.8rem 0 .4rem; }
.macnode { border:1.5px solid var(--border); border-radius:10px; padding:.6rem .8rem; background:var(--surface2); text-align:center; min-width:76px; }
.macnode.out { border-color:var(--green); background:var(--green-bg); }
.macnode.goal { border-color:var(--gold); background:var(--gold-bg); }
.macval { font-family:'IBM Plex Mono',monospace; font-size:1.05rem; font-weight:700; color:var(--green-dark); }
.maclbl { font-size:.64rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); }
.macop { font-family:'IBM Plex Mono',monospace; font-weight:700; color:var(--gold); font-size:1rem; }
.stepper { display:inline-flex; align-items:center; gap:.3rem; }
.stepbtn { width:44px; height:44px; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:1.05rem; font-weight:700; cursor:pointer; font-family:inherit; }
.stepbtn:hover { border-color:var(--green); color:var(--green); }
.stepval { font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:.95rem; min-width:46px; text-align:center; color:var(--green); }
.gcanvas { display:block; width:100%; height:250px; border:1px solid var(--border); border-radius:8px; background:var(--surface); }
.krow { display:flex; align-items:center; gap:.6rem; margin-top:.7rem; flex-wrap:wrap; }
.krow input[type=range] { flex:1; min-width:150px; accent-color:var(--green); height:32px; }
.klbl { font-size:.75rem; color:var(--text3); }
.cls-done { font-weight:700; color:var(--ok); text-align:center; padding:.7rem; }
.reflect-prompt { font-size:.92rem; color:var(--text2); margin:.4rem 0 .7rem; }

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Modelos con Ecuaciones Proporcionales</div>
    <div class="wcourse" id="wcourse-el">Matemáticas · 1° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>

function saveSession() {

  var drawings = [], texts = [], photos = [];
  problems.forEach(function(p, i) {
    var dc = document.getElementById('dc' + i);
    if (dc && dc.width) {
      var blank = document.createElement('canvas');
      blank.width = dc.width; blank.height = dc.height;
      drawings.push(dc.toDataURL() === blank.toDataURL() ? null : dc.toDataURL('image/png'));
    } else { drawings.push(null); }
    var ta = document.getElementById('ta' + i);
    texts.push(ta ? ta.value : '');
    var pp = document.getElementById('pp' + i);
    photos.push((pp && pp.src && pp.src.indexOf('data:') === 0) ? pp.src : null);
  });
  var state = {
    name: studentData.name, group: studentData.group,
    answeredCount: answeredCount, correctCount: correctCount,
    choices: problems.map(function(p) { return p.studentChoice; }),
    drawings: drawings, texts: texts, photos: photos
  };
  try { localStorage.setItem(lsKey(), JSON.stringify(state)); } catch(e) {}
}

function loadSession(name, group) {
  var key = 'liaxa_mat1_t07_g02__' + (name + '__' + group).replace(/\s+/g, '_');

function restoreSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  var saved = loadSession(name, group);
  if (!saved) return;
  document.getElementById('restoreBar').style.display = 'none';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = currentAttempt(name, group);
  buildLesson(seededRng(name + group + att));
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
  saved.choices.forEach(function(choice, idx) {
    if (choice !== null && choice !== undefined) confirmMC(idx, choice);
  });
  setTimeout(function() {
    if (saved.drawings) {
      saved.drawings.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var dc = document.getElementById('dc' + i);
        if (!dc || !dc.width) return;
        var img = new Image();

          var dpr = window.devicePixelRatio || 1;
          dc.getContext('2d').drawImage(img, 0, 0, dc.width / dpr, dc.height / dpr);
        };
        img.src = dataUrl;
      });
    }
    if (saved.texts) {
      saved.texts.forEach(function(text, i) {
        if (!text) return;
        var ta = document.getElementById('ta' + i);
        if (ta) ta.value = text;
      });
    }
    if (saved.photos) {
      saved.photos.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var pp = document.getElementById('pp' + i);
        if (!pp) return;
        pp.src = dataUrl; pp.style.display = 'block';
        var pz = document.getElementById('pz' + i);
        if (pz) pz.style.opacity = '0.4';
      });
    }
  }, 300);
}

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

/* ================================================
   buildLesson — OVERRIDE IN EACH GUIDE
   ================================================ */
function buildLesson(rng) {
  var LB = document.getElementById('lessonBody');
  LB.innerHTML = '';
  problems = [];

  /* ============================================================
     HELPERS
     ============================================================ */
  function T(o){
    if (o === undefined || o === null) return '';
    if (typeof o === 'string' || typeof o === 'number') return o;
    return (o[LANG] !== undefined ? o[LANG] : o.es);
  }
  function ri(a,b){ return a + Math.floor(rng()*(b-a+1)); }
  function pickOne(arr){ return arr[Math.floor(rng()*arr.length)]; }
  function shufA(arr){
    var a = arr.slice();
    for (var i=a.length-1;i>0;i--){ var j=Math.floor(rng()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
    return a;
  }
  function ns(v){ return v < 0 ? '−' + Math.abs(v) : String(v); }
  function eqk(k){ return 'y = ' + ns(k) + 'x'; }
  function sec(tag, title, html){
    var d = document.createElement('div');
    d.className = 'section';
    d.innerHTML = '<div class="stag">'+tag+'</div><h2>'+title+'</h2>'+(html||'');
    LB.appendChild(d);
    return d;
  }
  function widget(kind){
    var d = document.createElement('div');
    d.className = kind + 'wrap section';
    d.setAttribute('data-widget', kind);
    LB.appendChild(d);
    return d;
  }
  function cssv(n){
    try { var v = getComputedStyle(document.documentElement).getPropertyValue(n); return v ? v.trim() : ''; }
    catch(e){ return ''; }
  }
  function fourNums(correct, cands, allowNeg){
    var out = [correct], i, v;
    for (i=0;i<cands.length && out.length<4;i++){
      v = cands[i];
      if (typeof v !== 'number' || !isFinite(v) || v !== Math.floor(v) || v === 0) continue;
      if (!allowNeg && v < 1) continue;
      if (out.indexOf(v) < 0) out.push(v);
    }
    var d = 1;
    while (out.length < 4 && d < 400){
      v = correct + d;
      if (v !== 0 && (allowNeg || v > 0) && out.indexOf(v) < 0) out.push(v);
      else { v = correct - d; if (v !== 0 && (allowNeg || v > 0) && out.indexOf(v) < 0) out.push(v); }
      d++;
    }
    return out;
  }
  function numOpts(correct, cands, allowNeg){ return fourNums(correct, cands, allowNeg).map(ns); }
  function addProb(spec){
    var so = shufA(spec.options);
    problems.push({
      title: T(spec.title),
      questionText: T(spec.q),
      fn: '',
      hint: T(spec.hint),
      explanation: T(spec.exp),
      options: so,
      correctIdx: so.indexOf(spec.correct),
      showWork: !!spec.showWork,
      studentChoice: null,
      pendingChoice: null
    });
    buildOneCard(problems[problems.length-1], problems.length-1);
  }

  /* ============================================================
     IDEA 1: una situación cabe en una ecuación
     ============================================================ */
  var kd = ri(3,8);
  var demoRows = '';
  for (var di=1; di<=4; di++) demoRows += '<tr><td>'+di+'</td><td>'+(kd*di)+'</td><td>'+kd+'</td></tr>';
  sec(T({es:'Idea 1', en:'Idea 1'}),
      T({es:'Una situación cabe en una ecuación', en:'A situation fits inside one equation'}),
      '<p>'+T({
        es:'Cuando dos cantidades cambian juntas y la razón entre ellas se mantiene, toda la situación se guarda en un solo renglón: y = kx. La letra x guarda la cantidad que tú decides, la letra y guarda la cantidad que resulta y el número k dice cuánto aporta cada unidad de x.',
        en:'When two quantities change together and the ratio between them stays the same, the whole situation is stored in a single line: y = kx. The letter x holds the quantity you decide, the letter y holds the quantity that results and the number k tells how much each unit of x contributes.'
      })+'</p>'+
      '<p>'+T({
        es:'Modelar es encontrar ese número a partir de los datos y escribirlo junto a la x. Una vez escrita, la ecuación responde preguntas que los datos originales nunca mencionaron.',
        en:'Modelling means finding that number from the data and writing it next to the x. Once written, the equation answers questions the original data never mentioned.'
      })+'</p>'+
      '<div class="iw-box"><table class="ptable"><thead><tr><th>x</th><th>y</th><th>'+
        T({es:'por cada unidad de x', en:'for each unit of x'})+'</th></tr></thead><tbody>'+demoRows+'</tbody></table></div>'+
      '<div class="callout"><p>'+T({
        es:'La tercera columna repite el mismo número en todos los renglones. Ese número repetido es justo el que se escribe junto a la x en la ecuación de la situación.',
        en:'The third column repeats the same number in every row. That repeated number is exactly the one written next to the x in the equation of the situation.'
      })+'</p></div>');

  /* ---- WIDGET: arma el modelo ---- */
  (function(){
    var wrap = widget('armar');
    var POS = [
      { sign:1,
        mk:function(x0,y0){ return {
          es:'Una caja de colores trae siempre la misma cantidad de crayones: con '+x0+' cajas se juntan '+y0+' crayones.',
          en:'A box of colours always holds the same number of crayons: with '+x0+' boxes you gather '+y0+' crayons.' }; },
        lbl:{ es:'y son los crayones, x son las cajas', en:'y is the crayons, x is the boxes' } },
      { sign:1,
        mk:function(x0,y0){ return {
          es:'Una bicicleta avanza siempre lo mismo por vuelta de pedal: en '+x0+' vueltas avanzó '+y0+' metros.',
          en:'A bicycle moves the same distance on every pedal turn: in '+x0+' turns it moved '+y0+' metres.' }; },
        lbl:{ es:'y son los metros, x son las vueltas', en:'y is the metres, x is the turns' } },
      { sign:1,
        mk:function(x0,y0){ return {
          es:'Un puesto vende aguas frescas al mismo precio cada vaso: por '+x0+' vasos se pagaron '+y0+' pesos.',
          en:'A stand sells fruit drinks at the same price per glass: for '+x0+' glasses you paid '+y0+' pesos.' }; },
        lbl:{ es:'y son los pesos, x son los vasos', en:'y is the pesos, x is the glasses' } }
    ];
    var NEG = [
      { sign:-1,
        mk:function(x0,y0){ return {
          es:'Un globo aerostático desciende lo mismo cada minuto: en '+x0+' minutos su altura cambió '+ns(-y0)+' metros.',
          en:'A hot air balloon descends the same amount every minute: in '+x0+' minutes its height changed by '+ns(-y0)+' metres.' }; },
        lbl:{ es:'y es el cambio de altura, x son los minutos', en:'y is the height change, x is the minutes' } },
      { sign:-1,
        mk:function(x0,y0){ return {
          es:'Una cámara fría enfría lo mismo cada hora: en '+x0+' horas la temperatura cambió '+ns(-y0)+' grados.',
          en:'A cold room cools by the same amount every hour: in '+x0+' hours the temperature changed by '+ns(-y0)+' degrees.' }; },
        lbl:{ es:'y es el cambio de temperatura, x son las horas', en:'y is the temperature change, x is the hours' } },
      { sign:-1,
        mk:function(x0,y0){ return {
          es:'Un tinaco pierde la misma cantidad de agua cada hora: en '+x0+' horas el nivel cambió '+ns(-y0)+' litros.',
          en:'A water tank loses the same amount of water every hour: in '+x0+' hours the level changed by '+ns(-y0)+' litres.' }; },
        lbl:{ es:'y es el cambio del nivel, x son las horas', en:'y is the level change, x is the hours' } }
    ];
    var sp = shufA(POS), sn = shufA(NEG);
    var order = [sp[0], sn[0], sp[1]];
    var st = { round:0, tries:0, done:false, lock:false, sign:0, num:0, data:null };
    function build(sit){
      var mag = ri(3,9), x0 = ri(3,6), y0 = mag*x0;
      var nums = [mag], deltas = [1,-1,2,3,-2,4], i, v;
      for (i=0;i<deltas.length && nums.length<6;i++){
        v = mag + deltas[i];
        if (v > 0 && nums.indexOf(v) < 0) nums.push(v);
      }
      return { sit:sit, k:mag*sit.sign, mag:mag, x0:x0, y0:y0, nums:shufA(nums) };
    }
    function myK(){ return (st.sign === 0 || st.num === 0) ? null : st.sign*st.num; }
    function preview(){
      var d = st.data, m = myK();
      if (m === null) return T({es:'Elige un signo y un número para ver qué predice tu ecuación.', en:'Choose a sign and a number to see what your equation predicts.'});
      return T({es:'Con tu ecuación, si x vale '+d.x0+' entonces y vale '+ns(m*d.x0)+'. La situación dice '+ns(d.k*d.x0)+'.',
                en:'With your equation, if x is '+d.x0+' then y is '+ns(m*d.x0)+'. The situation says '+ns(d.k*d.x0)+'.'});
    }
    function render(msg){
      if (st.done){
        wrap.innerHTML =
          '<div class="iw-tag">'+T({es:'Arma el modelo', en:'Build the model'})+'</div>'+
          '<div class="cls-done">'+T({es:'Las tres situaciones ya tienen su ecuación.', en:'All three situations now have their equation.'})+'</div>';
        return;
      }
      var d = st.data, i;
      var signTxt = (st.sign === 0) ? '<span class="eqslot">?</span>' : (st.sign < 0 ? '−' : '');
      var numTxt  = (st.num === 0) ? '<span class="eqslot">?</span>' : String(st.num);
      var sChips =
        '<div class="chip'+(st.sign === 1 ? ' sel' : '')+'" onclick="arSign(1)">+</div>'+
        '<div class="chip'+(st.sign === -1 ? ' sel' : '')+'" onclick="arSign(-1)">−</div>';
      var nChips = '';
      for (i=0;i<d.nums.length;i++){
        nChips += '<div class="chip'+(st.num === d.nums[i] ? ' sel' : '')+'" onclick="arNum('+d.nums[i]+')">'+d.nums[i]+'</div>';
      }
      wrap.innerHTML =
        '<div class="iw-tag">'+T({es:'Arma el modelo', en:'Build the model'})+'</div>'+
        '<div class="rondas">'+T({es:'Situación', en:'Situation'})+' '+(st.round+1)+' / 3</div>'+
        '<div class="iw-instr">'+T({
          es:'Lee la situación y decide: ¿y crece o baja? Eso te da el signo. ¿Cuánto cambia y por cada unidad de x? Eso te da el número. Elige ambos y pulsa <strong>Comprobar</strong>.',
          en:'Read the situation and decide: does y grow or go down? That gives you the sign. How much does y change per unit of x? That gives the number. Choose both and press <strong>Check</strong>.'
        })+'</div>'+
        '<div class="iw-sit">'+T(d.sit.mk(d.x0, d.y0))+'<br><span class="maclbl">'+T(d.sit.lbl)+'</span></div>'+
        '<div class="eqline">y = '+signTxt+numTxt+'x</div>'+
        '<div class="chiplbl">'+T({es:'1. Elige el signo (¿y sube o baja?)', en:'1. Choose the sign (does y rise or fall?)'})+'</div><div class="chiprow">'+sChips+'</div>'+
        '<div class="chiplbl">'+T({es:'2. Elige el número (cambio por unidad de x)', en:'2. Choose the number (change per unit of x)'})+'</div><div class="chiprow">'+nChips+'</div>'+
        '<button class="rverify-btn" onclick="arCheck()">'+T({es:'Comprobar', en:'Check'})+'</button>'+
        '<div class="rfb" id="arFb">'+(msg||'')+'</div>';
    }
    function advance(delay, msg){
      st.round++; st.lock = true;
      setTimeout(function(){
        st.lock = false;
        if (st.round >= 3){ st.done = true; render(''); return; }
        st.tries = 0; st.sign = 0; st.num = 0; st.data = build(order[st.round]);
        render(msg);
      }, delay);
    }
    window.arSign = function(s){ if (st.done || st.lock) return; st.sign = (st.sign === s ? 0 : s); render(''); };
    window.arNum  = function(n){ if (st.done || st.lock) return; st.num  = (st.num === n ? 0 : n); render(''); };
    window.arCheck = function(){
      if (st.done || st.lock) return;
      var d = st.data, m = myK(), fb = document.getElementById('arFb');
      if (m === null){
        fb.innerHTML = T({es:'Falta elegir el signo o el número.', en:'The sign or the number is still missing.'});
        return;
      }
      if (m === d.k){
        render('<b>'+T({es:'La ecuación coincide con la situación.', en:'The equation matches the situation.'})+'</b>');
        advance(1300, T({es:'Correcto. Ahora esta otra situación.', en:'Correct. Now this other situation.'}));
        return;
      }
      st.tries++;
      if (st.tries >= 3){
        st.sign = (d.k < 0 ? -1 : 1); st.num = d.mag;
        render('<b>'+T({es:'La ecuación de esta situación es ', en:'The equation of this situation is '})+eqk(d.k)+'.</b>');
        advance(2100, T({es:'Vamos con otra situación.', en:'Here comes another situation.'}));
        return;
      }
      var wrongSign = (m < 0) !== (d.k < 0);
      var msg;
      if (wrongSign){
        msg = (d.k < 0)
          ? T({es:'El signo no es el correcto: y disminuye en esta situación, así que el signo debe ser negativo.', en:'The sign is not right: y decreases in this situation, so the sign must be negative.'})
          : T({es:'El signo no es el correcto: y crece en esta situación, así que el signo debe ser positivo.', en:'The sign is not right: y grows in this situation, so the sign must be positive.'});
      } else if (Math.abs(m) < d.mag){
        msg = T({es:'El número es demasiado pequeño. Divide y entre x para encontrar cuánto cambia y por unidad.', en:'The number is too small. Divide y by x to find how much y changes per unit.'});
      } else {
        msg = T({es:'El número es demasiado grande. Divide y entre x para encontrar cuánto cambia y por unidad.', en:'The number is too large. Divide y by x to find how much y changes per unit.'});
      }
      render(msg);
    };
    st.data = build(order[0]);
    render('');
  })();

  /* ---- PROBLEMA 1 ---- */
  (function(){
    var k1 = ri(3,9);
    var x1 = ri(4,8); if (x1 === k1) x1 = (k1 >= 6 ? k1 - 2 : k1 + 2);
    var y1 = k1*x1;
    var V = [
      { q:{ es:'Una llave vierte la misma cantidad de agua cada minuto: en '+x1+' minutos ha vertido '+y1+' litros. ¿Cuál ecuación relaciona los litros y con los minutos x?',
            en:'A tap pours the same amount of water every minute: in '+x1+' minutes it has poured '+y1+' litres. Which equation relates the litres y to the minutes x?' },

      var cv = document.getElementById('bzCv');

      var dpr = window.devicePixelRatio || 1;
      var w = cv.clientWidth || 320, h = cv.clientHeight || 250;
      cv.width = w*dpr; cv.height = h*dpr;
      var ctx = cv.getContext('2d');
      ctx.setTransform(dpr,0,0,dpr,0,0);
      ctx.clearRect(0,0,w,h);
      var topY = 24, botY = h - 14, DMAX = 90, i, yy;
      function PY(d){ return topY + (Math.abs(d)/DMAX)*(botY - topY); }
      ctx.font = '10px monospace';
      ctx.lineWidth = 1;
      for (i=0;i<=DMAX;i+=15){
        yy = PY(-i);
        ctx.strokeStyle = cssv('--border');
        ctx.beginPath(); ctx.moveTo(44, yy); ctx.lineTo(w-10, yy); ctx.stroke();
        ctx.fillStyle = cssv('--text3');

        exp:{ es:'Cada minuto la profundidad cambia '+ns(-k5)+' metros. En '+x5+' minutos ese cambio se toma '+x5+' veces, de modo que y = '+ns(y5)+'.',
              en:'Every minute the depth changes by '+ns(-k5)+' metres. In '+x5+' minutes that change is taken '+x5+' times, so y = '+ns(y5)+'.' } },
      { q:{ es:'Una alberca se vacía a ritmo constante y el cambio de su nivel en centímetros sigue el modelo '+eqk(-k5)+', donde x son las horas. Un alumno anotó '+(k5*x5)+' sin signo. ¿Qué valor toma y a las '+x5+' horas?',
            en:'A pool empties at a steady rate and the change of its level in centimetres follows the model '+eqk(-k5)+', where x is the hours. A student wrote down '+(k5*x5)+' with no sign. What value does y take at hour '+x5+'?' },
        exp:{ es:'El tamaño del cambio es correcto, pero el nivel baja y por eso el resultado lleva signo negativo: en '+x5+' horas el cambio se toma '+x5+' veces y queda y = '+ns(y5)+'.',
              en:'The size of the change is right, but the level goes down and that is why the result carries a negative sign: in '+x5+' hours the change is taken '+x5+' times and gives y = '+ns(y5)+'.' } }
    ];
    var v = pickOne(V);
    addProb({
      title:{ es:'El valor acumulado', en:'The accumulated value' },
      q:v.q, exp:v.exp, showWork:true,
      hint:{ es:'Toma el valor que corresponde a una unidad de x tantas veces como indica el dato, y conserva la dirección del cambio en el resultado.',
             en:'Take the value for one unit of x as many times as the data says, and keep the direction of the change in the result.' },
      options:numOpts(y5, [-y5, y5 + k5, y5 - k5, -(k5 + x5)], true),
      correct:ns(y5)
    });
  })();

  /* ---- PROBLEMA 6 ---- */
  (function(){
    var k6 = ri(2,6);
    var V = [
      { q:{ es:'La temperatura de una cámara fría baja '+k6+' grados cada hora. Si y guarda el cambio de temperatura y x las horas, ¿cuál ecuación modela la situación?',
            en:'The temperature of a cold room drops '+k6+' degrees every hour. If y holds the temperature change and x the hours, which equation models the situation?' },
        exp:{ es:'Cada hora el cambio vale '+ns(-k6)+' grados y ese valor por unidad es el que acompaña a la x. El signo negativo indica que y disminuye mientras x aumenta, así que el modelo es '+eqk(-k6)+'.',
              en:'Every hour the change is '+ns(-k6)+' degrees and that value per unit is the one next to the x. The negative sign shows that y decreases while x increases, so the model is '+eqk(-k6)+'.' } },
      { q:{ es:'De un tinaco se sacan '+k6+' litros cada minuto. Si y guarda el cambio del nivel de agua y x los minutos, ¿cuál ecuación modela la situación?',
            en:'A water tank has '+k6+' litres taken out every minute. If y holds the change of the water level and x the minutes, which equation models the situation?' },
        exp:{ es:'Cada minuto el cambio vale '+ns(-k6)+' litros y ese valor por unidad es el que acompaña a la x. El signo negativo indica que y disminuye mientras x aumenta, así que el modelo es '+eqk(-k6)+'.',
              en:'Every minute the change is '+ns(-k6)+' litres and that value per unit is the one next to the x. The negative sign shows that y decreases while x increases, so the model is '+eqk(-k6)+'.' } }
    ];
    var v = pickOne(V);
    addProb({
      title:{ es:'El modelo del descenso', en:'The model of the drop' },
      q:v.q, exp:v.exp, showWork:false,
      hint:{ es:'Fíjate en el tamaño del cambio por unidad y en si y sube o baja cuando x aumenta; lo segundo decide el signo.',
             en:'Look at the size of the change per unit and at whether y rises or falls when x increases; the second one decides the sign.' },
      options:[eqk(-k6), eqk(k6), 'y = x − '+k6, 'y = '+k6+' − x'],
      correct:eqk(-k6)
    });
  })();

  /* ============================================================
     IDEA 4: dos modelos frente a frente
     ============================================================ */
  sec(T({es:'Idea 4', en:'Idea 4'}),
      T({es:'Dos modelos frente a frente', en:'Two models side by side'}),
      '<p>'+T({
        es:'Cuando dos situaciones se modelan con ecuaciones proporcionales, compararlas se reduce a comparar los números que acompañan a la x. El mayor crece más rápido y su ventaja se abre más conforme x avanza.',
        en:'When two situations are modelled by proportional equations, comparing them comes down to comparing the numbers next to the x. The larger one grows faster and its lead widens as x moves on.'
      })+'</p>'+
      '<p>'+T({
        es:'Para una misma cantidad de x, cada modelo entrega su propio valor de y. La diferencia entre esos dos valores también aumenta al mismo ritmo, porque cada unidad de x abre la brecha siempre lo mismo.',
        en:'For the same amount of x, each model delivers its own value of y. The difference between those two values also grows at the same rate, because every unit of x opens the gap by the same amount.'
      })+'</p>');

  /* ---- WIDGET: reflexiona ---- */
  (function(){
    var kR = ri(4,9), kR2 = ri(2,3), kR3 = ri(3,7);
    var PR = [
      { es:'Escribe una situación de tu vida diaria que se modele con la ecuación '+eqk(kR)+' y explica qué guarda cada letra.',
        en:'Write a situation from your daily life modelled by the equation '+eqk(kR)+' and explain what each letter holds.' },
      { es:'Los modelos '+eqk(kR)+' y '+eqk(kR2)+' describen dos cobros distintos. Inventa una situación para cada uno y explica cuál crece más rápido y por qué.',
        en:'The models '+eqk(kR)+' and '+eqk(kR2)+' describe two different charges. Invent a situation for each one and explain which grows faster and why.' },
      { es:'Explica con tus palabras qué cambia en una situación cuando el número que acompaña a la x lleva signo negativo, como en '+eqk(-kR3)+', y da un ejemplo.',
        en:'Explain in your own words what changes in a situation when the number next to the x carries a negative sign, as in '+eqk(-kR3)+', and give an example.' }
    ];
    var pk = PR[Math.floor(rng()*PR.length)];
    var wrap = widget('reflect');
    wrap.innerHTML =
      '<div class="iw-tag">'+T({es:'Escribe tu idea', en:'Write your idea'})+'</div>'+
      '<div class="reflect-prompt">'+T(pk)+'</div>'+
      '<textarea class="wtextarea" id="reflectTa" placeholder="'+T({es:'Tu respuesta...', en:'Your answer...'})+'"></textarea>'+
      '<button class="rverify-btn" onclick="reflectSave()">'+T({es:'Guardar', en:'Save'})+'</button>'+
      '<div class="rfb" id="reflectFb"></div>';
    window.reflectSave = function(){
      var el = document.getElementById('reflectTa');
      var n = el ? el.value.trim().length : 0;
      var fb = document.getElementById('reflectFb');
      if (!fb) return;
      fb.innerHTML = (n === 0)
        ? T({es:'Anota aunque sea una idea corta; después puedes ampliarla.', en:'Jot down even a short idea; you can widen it later.'})
        : '<b>'+T({es:'Guardado. Aquí no hay una sola redacción posible, lo valioso es que la situación y la ecuación digan lo mismo.', en:'Saved. There is no single possible wording here, what matters is that the situation and the equation say the same thing.'})+'</b>';
    };
  })();

  /* ---- PROBLEMA 7 ---- */
  (function(){
    var ka = ri(8,12), kb = ri(3,6), n7 = ri(5,9);
    var dif = (ka - kb)*n7, tot = (ka + kb)*n7;
    var V = [
      { q:{ es:'El taller A borda playeras con el modelo '+eqk(ka)+' y el taller B con el modelo '+eqk(kb)+', donde x es el número de playeras y y el cobro en pesos. ¿Cuántos pesos más cobra el taller A que el taller B por '+n7+' playeras?',
            en:'Workshop A embroiders shirts with the model '+eqk(ka)+' and workshop B with the model '+eqk(kb)+', where x is the number of shirts and y the charge in pesos. How many pesos more does workshop A charge than workshop B for '+n7+' shirts?' },
        correct:dif,
        cands:[ka - kb, ka*n7, kb*n7, dif + n7],
        exp:{ es:'El taller A cobra '+(ka*n7)+' pesos y el taller B cobra '+(kb*n7)+' pesos por esa cantidad de playeras. La distancia entre los dos cobros es '+(ka*n7)+' − '+(kb*n7)+' = '+dif+'.',
              en:'Workshop A charges '+(ka*n7)+' pesos and workshop B charges '+(kb*n7)+' pesos for that number of shirts. The distance between the two charges is '+(ka*n7)+' − '+(kb*n7)+' = '+dif+'.' } },
      { q:{ es:'El taller A borda playeras con el modelo '+eqk(ka)+' y el taller B con el modelo '+eqk(kb)+', donde x es el número de playeras y y el cobro en pesos. Si cada taller borda '+n7+' playeras, ¿cuántos pesos se pagan en total entre los dos?',
            en:'Workshop A embroiders shirts with the model '+eqk(ka)+' and workshop B with the model '+eqk(kb)+', where x is the number of shirts and y the charge in pesos. If each workshop embroiders '+n7+' shirts, how many pesos are paid in total between the two?' },
        correct:tot,
        cands:[ka*n7, kb*n7, ka + kb, tot - n7],
        exp:{ es:'El taller A cobra '+(ka*n7)+' pesos y el taller B cobra '+(kb*n7)+' pesos. Al juntar los dos cobros se paga '+(ka*n7)+' + '+(kb*n7)+' = '+tot+'.',
              en:'Workshop A charges '+(ka*n7)+' pesos and workshop B charges '+(kb*n7)+' pesos. Putting the two charges together you pay '+(ka*n7)+' + '+(kb*n7)+' = '+tot+'.' } }
    ];
    var v = pickOne(V);
    addProb({
      title:{ es:'Dos talleres, dos modelos', en:'Two workshops, two models' },
      q:v.q, exp:v.exp, showWork:true,
      hint:{ es:'Usa cada modelo por separado para la misma cantidad de playeras y después trabaja con los dos resultados.',
             en:'Use each model separately for the same number of shirts and then work with the two results.' },
      options:numOpts(v.correct, v.cands, false),
      correct:ns(v.correct)
    });
  })();

  /* ============================================================
     CIERRE
     ============================================================ */
  sec(T({es:'Cierre', en:'Wrap-up'}),
      T({es:'Ponlo a prueba', en:'Put it to the test'}),
      '<p>'+T({
        es:'Las siguientes situaciones llegan sin pistas previas. Decide en cada una qué representa la x, qué representa la y y qué número las une.',
        en:'The next situations arrive with no clues in front of them. Decide in each one what x represents, what y represents and which number joins them.'
      })+'</p>');

  /* ---- PROBLEMA 8 ---- */
  (function(){
    var k8 = ri(4,9);
    var t1 = ri(2,3), t2 = t1 + ri(2,3), t3 = t2 + ri(2,4);
    var tbl = '<table class="ptable" style="margin-top:.6rem"><thead><tr><th>x</th><th>y</th></tr></thead><tbody>'+
      '<tr><td> '+t1+'</td><td> '+(k8*t1)+'</td></tr>'+
      '<tr><td> '+t2+'</td><td> '+(k8*t2)+'</td></tr>'+
      '<tr><td> '+t3+'</td><td> '+(k8*t3)+'</td></tr>'+
      '</tbody></table>';
    var diag = '<div class="eqline" style="margin-top:.6rem">'+t1+' → '+(k8*t1)+' , '+t2+' → '+(k8*t2)+' , '+t3+' → '+(k8*t3)+'</div>';
    var V = [
      { q:{ es:'La tabla reúne los datos de una situación proporcional. ¿Cuál ecuación la modela?'+tbl,
            en:'The table gathers the data of a proportional situation. Which equation models it?'+tbl },
        exp:{ es:'En cada renglón, el valor de y repartido entre el valor de x deja '+k8+'. Ese número por unidad es el que acompaña a la x, así que el modelo es '+eqk(k8)+'.',
              en:'In every row, the value of y split by the value of x leaves '+k8+'. That number per unit is the one next to the x, so the model is '+eqk(k8)+'.' } },
      { q:{ es:'El diagrama muestra cómo cada valor de x se transforma en un valor de y. ¿Cuál ecuación modela esa transformación?'+diag,
            en:'The diagram shows how each value of x turns into a value of y. Which equation models that transformation?'+diag },
        exp:{ es:'Cada flecha multiplica por '+k8+', porque el valor de llegada repartido entre el valor de salida deja siempre '+k8+'. Por eso el modelo es '+eqk(k8)+'.',
              en:'Every arrow multiplies by '+k8+', because the arrival value split by the starting value always leaves '+k8+'. That is why the model is '+eqk(k8)+'.' } }
    ];
    var v = pickOne(V);
    addProb({
      title:{ es:'Del registro a la ecuación', en:'From the record to the equation' },
      q:v.q, exp:v.exp, showWork:false,
      hint:{ es:'Compara cada valor de y con el valor de x que le toca; el número que se repite en todas las parejas es el que buscas.',
             en:'Compare each value of y with the value of x that goes with it; the number that repeats in every pair is the one you want.' },
      options:[eqk(k8), 'y = '+(k8*t1)+'x', 'y = x + '+(t1*(k8-1)), 'y = '+(k8+1)+'x'],
      correct:eqk(k8)
    });
  })();

  /* ---- PROBLEMA 9 ---- */
  (function(){
    var k9 = ri(4,8), x9 = ri(5,9), y9 = -k9*x9;
    var V = [
      { q:{ es:'Un montacargas baja a ritmo constante y el cambio de su altura sigue el modelo '+eqk(-k9)+', donde y son metros y x los segundos. ¿En qué valor de x el cambio de altura llega a '+ns(y9)+' metros?',
            en:'A freight lift goes down at a steady rate and the change of its height follows the model '+eqk(-k9)+', where y is metres and x is seconds. At which value of x does the height change reach '+ns(y9)+' metres?' },
        exp:{ es:'Cada segundo la altura cambia '+ns(-k9)+' metros. Al repartir los '+(k9*x9)+' metros de bajada en partes de '+k9+' metros se forman '+x9+' partes, así que x = '+x9+'.',
              en:'Every second the height changes by '+ns(-k9)+' metres. Splitting the '+(k9*x9)+' metres of descent into parts of '+k9+' metres makes '+x9+' parts, so x = '+x9+'.' } },
      { q:{ es:'Una bodega se enfría a ritmo constante y el cambio de su temperatura sigue el modelo '+eqk(-k9)+', donde y son grados y x las horas. ¿En qué valor de x el cambio de temperatura llega a '+ns(y9)+' grados?',
            en:'A warehouse cools at a steady rate and the change of its temperature follows the model '+eqk(-k9)+', where y is degrees and x is hours. At which value of x does the temperature change reach '+ns(y9)+' degrees?' },
        exp:{ es:'Cada hora la temperatura cambia '+ns(-k9)+' grados. Al repartir los '+(k9*x9)+' grados de bajada en partes de '+k9+' grados se forman '+x9+' partes, así que x = '+x9+'.',
              en:'Every hour the temperature changes by '+ns(-k9)+' degrees. Splitting the '+(k9*x9)+' degrees of drop into parts of '+k9+' degrees makes '+x9+' parts, so x = '+x9+'.' } }
    ];
    var v = pickOne(V);
    addProb({
      title:{ es:'Hasta dónde llega el descenso', en:'How far the descent goes' },
      q:v.q, exp:v.exp, showWork:true,
      hint:{ es:'El signo ya te dice la dirección; para el valor de x basta con ver cuántas veces cabe el cambio de una unidad en el cambio total.',
             en:'The sign already gives you the direction; for the value of x it is enough to see how many times the change of one unit fits into the whole change.' },
      options:numOpts(x9, [x9 + 1, x9 - 1, k9, k9 + x9], false),
      correct:ns(x9)
    });
  })();

  /* ---- PROBLEMA 10 ---- */
  (function(){
    var kA = ri(9,14), xA = ri(3,5), yA = kA*xA, xB = ri(11,16), yB = kA*xB;
    var V = [
      { q:{ es:'Una fotocopiadora saca el mismo número de copias cada minuto: en '+xA+' minutos sacó '+yA+' copias. Con ese mismo ritmo, ¿cuántas copias sacará en '+xB+' minutos?',
            en:'A photocopier makes the same number of copies every minute: in '+xA+' minutes it made '+yA+' copies. At that same rate, how many copies will it make in '+xB+' minutes?' },
        correct:yB,
        cands:[yA + (xB - xA), yB - kA, yB + kA, yA + yA],
        exp:{ es:'Cada minuto salen '+kA+' copias, porque '+yA+' repartido en '+xA+' partes iguales da '+kA+'. El modelo es '+eqk(kA)+' y al poner x = '+xB+' resulta y = '+yB+'.',
              en:'Every minute '+kA+' copies come out, because '+yA+' split into '+xA+' equal parts gives '+kA+'. The model is '+eqk(kA)+' and putting x = '+xB+' gives y = '+yB+'.' } },
      { q:{ es:'Una fotocopiadora saca el mismo número de copias cada minuto: en '+xA+' minutos sacó '+yA+' copias. Con ese mismo ritmo, ¿cuántos minutos necesita para sacar '+yB+' copias?',
            en:'A photocopier makes the same number of copies every minute: in '+xA+' minutes it made '+yA+' copies. At that same rate, how many minutes does it need to make '+yB+' copies?' },
        correct:xB,
        cands:[xB + 1, xB - 1, kA, xA + xA],
        exp:{ es:'Cada minuto salen '+kA+' copias, porque '+yA+' repartido en '+xA+' partes iguales da '+kA+'. El modelo es '+eqk(kA)+' y al repartir '+yB+' copias en partes de '+kA+' copias se forman '+xB+' partes, así que x = '+xB+'.',
              en:'Every minute '+kA+' copies come out, because '+yA+' split into '+xA+' equal parts gives '+kA+'. The model is '+eqk(kA)+' and splitting '+yB+' copies into parts of '+kA+' copies makes '+xB+' parts, so x = '+xB+'.' } }
    ];
    var v = pickOne(V);
    addProb({
      title:{ es:'La copiadora sin descanso', en:'The copier that never stops' },
      q:v.q, exp:v.exp, showWork:true,
      hint:{ es:'Los datos que te dan sirven para escribir primero el modelo; ya escrito, la pregunta se responde con una sola operación.',
             en:'The data you are given serve to write the model first; once written, the question is answered with a single operation.' },
      options:numOpts(v.correct, v.cands, false),
      correct:ns(v.correct)
    });
  })();
}
</script>

<!-- LIAXA ANALYTICS -->
<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbyjbSUYDHwe-0Hl5GnZC6mP3_iKPYnLqeUgbuhxARkW2-keCAAV6sSg0wYWJnJBhY7lUQ/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var body = JSON.stringify({school:school,event:ev,module_id:moduleId,
      session_id:sessionId,elapsed_sec:Math.round((Date.now()-openedAt)/1000)});
    if(ev==='module_close'&&navigator.sendBeacon){
      navigator.sendBeacon(GAS_URL,new Blob([body],{type:'application/json'}));
    }else{
      fetch(GAS_URL,{method:'POST',body:body,headers:{'Content-Type':'application/json'},keepalive:true}).catch(function(){});
    }
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
</body>
