<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medidas de Dispersión · ALEXIS</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono&family=Crimson+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --green:#1a4a8a;--green-dark:#0f2d5a;--green-bg:#e8edf5;
  --gold:#c9a84c;--gold-bg:#faf3e0;
  --bg:#f8f6f1;--surface:#ffffff;--surface2:#f0ede6;--border:#ddd8cc;
  --text:#1a1a16;--text2:#4a4640;--text3:#7a7468;
  --ok:#1e7d45;--ok-bg:rgba(30,125,69,.12);
  --bad:#c0321a;--bad-bg:rgba(192,50,26,.10);
  --shadow:0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"]{
  --bg:#18181a;--surface:#242420;--surface2:#2e2e28;--border:#3a3830;
  --text:#e8e4da;--text2:#b0aa9e;--text3:#7a7468;--shadow:0 4px 20px rgba(0,0,0,.35);
  --green:#4a8adf;--green-dark:#7aaae0;--green-bg:#0e1e38;
  --gold:#d4b86a;--gold-bg:#241e0e;
  --ok:#4a9a6f;--ok-bg:rgba(74,154,111,.12);
  --bad:#c05030;--bad-bg:rgba(192,80,48,.10);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'IBM Plex Sans',sans-serif;background:var(--bg);color:var(--text);line-height:1.65}
#welcomeScreen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:1.5rem}
.wcard{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:2.4rem 2rem;width:100%;max-width:460px;text-align:center;border-top:4px solid var(--gold)}
.wlogos{display:flex;justify-content:center;align-items:center;gap:1.4rem;margin-bottom:1.6rem;padding-bottom:1.6rem;border-bottom:1px solid var(--border)}
.wtitle{font-family:'Crimson Pro',serif;font-size:1.65rem;font-weight:700;margin-bottom:.25rem}
.wcourse{font-size:.78rem;color:var(--text3);letter-spacing:.07em;text-transform:uppercase;margin-bottom:1.6rem}
.flabel{display:block;font-size:.75rem;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.3rem;text-align:left}
.finput{width:100%;padding:.7rem .9rem;border:1.5px solid var(--border);border-radius:8px;background:var(--surface2);color:var(--text);font-size:.95rem;font-family:inherit;margin-bottom:.9rem;transition:border-color .18s}
.finput:focus{outline:none;border-color:var(--green)}
.sbtn{width:100%;padding:.85rem;background:var(--green);color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;transition:background .18s}
.sbtn:hover{background:var(--green-dark)}
.serr{min-height:1.2rem;font-size:.82rem;color:var(--bad);margin-top:.4rem}
.wfoot{margin-top:1rem;font-size:.75rem;color:var(--text3)}
#restoreBar{display:none;margin-top:.9rem;background:var(--gold-bg);border:1.5px solid rgba(201,168,76,.4);border-radius:10px;padding:.85rem 1rem;text-align:left;font-size:.82rem}
#restoreBar strong{color:#7a5800}
.rbar-btns{display:flex;gap:.5rem;margin-top:.6rem}
.rbtn{padding:.4rem .9rem;border-radius:7px;font-size:.8rem;font-weight:600;cursor:pointer;font-family:inherit;border:none}
.rbtn-yes{background:var(--green);color:#fff}
.rbtn-no{background:none;border:1.5px solid var(--border)!important;color:var(--text2)}
#lessonScreen{display:none}
.stickybar{position:sticky;top:0;z-index:100;background:var(--surface);border-bottom:1px solid var(--border);padding:.55rem 1.2rem;display:flex;align-items:center;gap:.7rem;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.hlogos{display:flex;gap:.5rem;align-items:center}
.hsep{width:1px;height:22px;background:var(--border);flex-shrink:0}
.htitle{font-family:'Crimson Pro',serif;font-size:1rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.halexis{flex:1;display:flex;justify-content:center;align-items:center}
.hchip{font-size:.7rem;background:var(--green-bg);color:var(--green-dark);padding:.2rem .65rem;border-radius:20px;white-space:nowrap;flex-shrink:0}
.tbtn{background:none;border:1px solid var(--border);border-radius:7px;padding:.28rem .55rem;cursor:pointer;font-size:.82rem;color:var(--text2);flex-shrink:0}
.progbar{height:3px;background:var(--border);position:sticky;top:47px;z-index:99}
.progfill{height:100%;background:var(--green);width:0%;transition:width .4s}
.lang-toggle{display:flex;border:1.5px solid var(--border);border-radius:8px;overflow:hidden;flex-shrink:0}
.lang-btn{padding:.28rem .7rem;font-size:.72rem;font-weight:600;letter-spacing:.06em;cursor:pointer;border:none;background:none;color:var(--text3);font-family:inherit;transition:all .15s}
.lang-btn.active{background:var(--green);color:#fff}
.lbody{max-width:780px;margin:0 auto;padding:2rem 1.2rem 4rem}
.section{opacity:0;transform:translateY(16px);transition:opacity .48s,transform .48s;margin-bottom:2.8rem}
.section.vis{opacity:1;transform:none}
.stag{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:.45rem}
.section h2{font-family:'Crimson Pro',serif;font-size:1.65rem;font-weight:700;margin-bottom:.7rem}
.section p{color:var(--text2);margin-bottom:.8rem}
.callout{background:var(--green-bg);border-left:4px solid var(--green);border-radius:0 10px 10px 0;padding:1rem 1.2rem;margin:1rem 0}
.callout strong{color:var(--green-dark)}
.callout p{margin-bottom:0}
.gold-callout{background:var(--gold-bg);border-left:4px solid var(--gold);border-radius:0 10px 10px 0;padding:1rem 1.2rem;margin:1rem 0}
.gold-callout strong{color:#7a5800}
.gcrd{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.3rem;margin:.9rem 0}
.gcrd p{margin-bottom:.5rem}
.rules-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:.75rem;margin:1.1rem 0}
.rcard{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:.9rem;border-top:3px solid var(--green);overflow-x:auto}
.rname{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);margin-bottom:.35rem}
.rval{font-size:.88rem;color:var(--green-dark);font-weight:600;margin-bottom:.3rem}
.rnote{font-size:.76rem;color:var(--text3)}
.dd-actions{display:flex;gap:.5rem;margin-top:.5rem;flex-wrap:wrap}
.dd-check{background:var(--green);color:#fff;border:none;border-radius:8px;padding:.45rem 1.1rem;font-size:.82rem;font-weight:600;cursor:pointer;font-family:inherit}
.dd-reset{background:none;border:1.5px solid var(--border);color:var(--text2);border-radius:8px;padding:.45rem .9rem;font-size:.82rem;cursor:pointer;font-family:inherit}
.dd-fb{font-size:.82rem;margin-top:.55rem;padding:.55rem .85rem;border-radius:8px;display:none;line-height:1.5}
.dd-fb.show{display:block}
.dd-fb.ok{background:var(--ok-bg);color:var(--ok)}
.dd-fb.bad{background:var(--bad-bg);color:var(--bad)}
.dd-fb.part{background:var(--gold-bg);color:#7a5800}
.freq-table{width:100%;border-collapse:collapse;font-size:.83rem;margin:.75rem 0}
.freq-table th{background:var(--green);color:#fff;padding:.4rem .7rem;text-align:center;font-weight:600}
.freq-table td{padding:.38rem .7rem;border-bottom:1px solid var(--border);text-align:center;font-family:'IBM Plex Mono',monospace}
.freq-table tr:last-child td{border-bottom:none;font-weight:700;background:var(--surface2)}
.freq-input{width:80px;padding:.28rem .4rem;border:1.5px solid var(--border);border-radius:5px;font-family:'IBM Plex Mono',monospace;font-size:.82rem;text-align:center;background:var(--surface2);color:var(--text);transition:border-color .18s}
.freq-input:focus{outline:none;border-color:var(--green)}
.freq-input.ok-cell{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.freq-input.bad-cell{border-color:var(--bad);background:var(--bad-bg)}
.prob-card{background:var(--surface);border:1.5px solid var(--border);border-radius:14px;padding:1.3rem 1.4rem;margin:1.1rem 0;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.prob-label{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:.55rem}
.prob-q{font-size:.92rem;color:var(--text);margin-bottom:.75rem;line-height:1.6;font-weight:500}
.prob-opts{display:grid;gap:.42rem}
.prob-opt{text-align:left;padding:.7rem .9rem;border:1.5px solid var(--border);border-radius:9px;background:var(--surface2);color:var(--text);font-size:.85rem;cursor:pointer;font-family:inherit;transition:border-color .15s,background .15s;line-height:1.45}
.prob-opt:hover:not(:disabled){border-color:var(--green);background:var(--green-bg)}
.prob-opt:disabled{cursor:default}
.prob-opt.selected{border-color:var(--green);background:var(--green-bg);font-weight:500}
.prob-opt.correct{border-color:var(--ok);background:var(--ok-bg);font-weight:600}
.prob-opt.wrong{border-color:var(--bad);background:var(--bad-bg);opacity:.75}
.prob-confirm{display:none}
.prob-fb{font-size:.81rem;margin-top:.55rem;padding:.55rem .85rem;border-radius:8px;display:none;line-height:1.5}
.prob-fb.show{display:block}
.prob-fb.ok{background:var(--ok-bg);color:var(--ok)}
.prob-fb.bad{background:var(--bad-bg);color:var(--bad)}
.show-work{background:var(--surface2);border-radius:8px;padding:.65rem .9rem;margin-bottom:.6rem;font-size:.8rem;color:var(--text3);border:1px dashed var(--border)}
.slider-container{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1.4rem;margin:1rem 0}
.slider-row{display:flex;align-items:center;gap:.7rem;margin-bottom:.6rem}
.slider-row label{font-size:.78rem;color:var(--text3);white-space:nowrap;min-width:80px}
.slider-row input[type=range]{flex:1;accent-color:var(--green)}
.slider-val{font-size:.82rem;font-family:'IBM Plex Mono',monospace;color:var(--green-dark);min-width:60px;text-align:right;font-weight:600}
.dot-plot-container{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1.4rem;margin:1rem 0}
.cv-table{width:100%;border-collapse:collapse;font-size:.84rem;margin:.75rem 0}
.cv-table th{background:var(--green);color:#fff;padding:.42rem .7rem;text-align:left;font-weight:600}
.cv-table td{padding:.4rem .7rem;border-bottom:1px solid var(--border);vertical-align:middle}
.cv-table tr:nth-child(even) td{background:var(--surface2)}
.cv-num{font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--green-dark)}
.cv-input{width:72px;padding:.28rem .4rem;border:1.5px solid var(--border);border-radius:5px;font-family:'IBM Plex Mono',monospace;font-size:.82rem;text-align:center;background:var(--surface2);color:var(--text)}
.cv-input.ok-cell{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.cv-input.bad-cell{border-color:var(--bad);background:var(--bad-bg)}
.cv-radio-group{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.4rem}
.cv-radio-btn{padding:.3rem .75rem;border:1.5px solid var(--border);border-radius:20px;font-size:.78rem;cursor:pointer;font-family:inherit;background:var(--surface2);color:var(--text2);font-weight:500;transition:all .16s}
.cv-radio-btn.selected{background:var(--green);color:#fff;border-color:var(--green)}
.cv-radio-btn.correct{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.cv-radio-btn.wrong{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.formula-box{background:var(--surface2);border-radius:8px;padding:.8rem 1.1rem;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:.95rem;color:var(--green-dark);margin:.6rem 0;letter-spacing:.02em}
.case-box{background:var(--gold-bg);border:1.5px solid rgba(201,168,76,.4);border-radius:12px;padding:1.2rem 1.4rem;margin:.85rem 0}
.case-q{font-size:.88rem;color:var(--text2);margin-bottom:.65rem;line-height:1.6}
.case-q strong{color:var(--text)}
.case-input{width:100%;padding:.6rem .85rem;border:1.5px solid var(--border);border-radius:8px;font-family:'IBM Plex Sans',sans-serif;font-size:.85rem;background:var(--surface);color:var(--text);margin-bottom:.45rem;transition:border-color .18s;resize:vertical}
.case-input:focus{outline:none;border-color:var(--green)}
.case-reveal{background:var(--green);color:#fff;border:none;border-radius:8px;padding:.45rem 1.1rem;font-size:.82rem;font-weight:600;cursor:pointer;font-family:inherit}
.case-answer{display:none;margin-top:.65rem;background:var(--green-bg);border-left:4px solid var(--green);border-radius:0 9px 9px 0;padding:.75rem 1rem;font-size:.83rem;color:var(--text2);line-height:1.55}
.case-answer.show{display:block}
.case-answer strong{color:var(--green-dark)}
.dlbtn{background:var(--green);color:#fff;border:none;border-radius:10px;padding:.8rem 1.8rem;font-size:.95rem;font-weight:600;cursor:pointer;transition:background .18s}
.dlbtn:hover{background:var(--green-dark)}
.dlbtn:disabled{opacity:.6;cursor:wait}
@media(max-width:600px){
  .wcard{padding:1.6rem 1.1rem}.lbody{padding:1.2rem .7rem 3rem}
  .section h2{font-size:1.3rem}.htitle{display:none}
  .lang-btn{padding:.26rem .48rem;font-size:.68rem}
  .rules-grid{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos">
      <div style="font-family:'Crimson Pro',serif;font-size:2rem;font-weight:700;color:var(--green);line-height:1;letter-spacing:.28em;text-indent:.28em">ALEXIS</div>
    </div>
    <div class="wtitle" id="w-title">Medidas de Dispersión</div>
    <div class="wcourse" id="w-course">Estadística · Semana 3</div>
    <label class="flabel" for="sName" id="lbl-name">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" for="sGroup" id="lbl-group">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">&#128194; Sesión guardada encontrada</strong><br>
      <span id="restoreSub">¿Deseas continuar donde la dejaste?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" onclick="restoreSession()">Retomar sesión</button>
        <button class="rbtn rbtn-no" onclick="dismissRestore()">Empezar de nuevo</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg">
        <style>.lw-l{stroke:var(--green);stroke-width:2;fill:none}.lw-a{fill:var(--gold)}.lw-b{stroke:var(--gold);stroke-width:2}.lw-t{font-family:'Crimson Pro',serif;font-weight:700;letter-spacing:.08em;fill:var(--green);font-size:16px}</style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-l"/><circle cx="22" cy="10" r="2.5" class="lw-a"/><line x1="32" y1="6" x2="32" y2="28" class="lw-b"/><text x="42" y="22" class="lw-t">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos"><img id="hlogo-left" src="" alt="" style="display:none"></div>
    <div class="hsep"></div>
    <div class="htitle" id="h-title">Medidas de Dispersión</div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg">
        <style>.lh-l{stroke:var(--green);stroke-width:2;fill:none}.lh-a{fill:var(--gold)}.lh-b{stroke:var(--gold);stroke-width:2}.lh-t{font-family:'Crimson Pro',serif;font-weight:700;letter-spacing:.08em;fill:var(--green);font-size:16px}</style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-l"/><circle cx="22" cy="10" r="2.5" class="lh-a"/><line x1="32" y1="6" x2="32" y2="28" class="lh-b"/><text x="42" y="22" class="lh-t">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip">s · d</div>
    <div class="lang-toggle">
      <button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button>
      <button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button>
    </div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>
  <div class="section" id="s_results" style="display:none">
    <div style="text-align:center;padding:2rem 1rem">
      <button class="dlbtn" id="dlBtn" onclick="generatePDF()">&#11015; &nbsp;<span id="pdf-lbl">Descargar resultados en PDF</span></button>
    </div>
  </div>
</div>

<script>
'use strict';
// ═══ BILINGUAL ═══
var LANG='es';
var SCHOOL={
  primary:'#1a4a8a',primaryDark:'#0f2d5a',primaryBg:'#e8edf5',
  accent:'#c9a84c',accentBg:'#faf3e0',
  pBR:26,pBG:74,pBB:138,pAR:201,pAG:168,pAB:76,
  logoLeftB64:'',logoRightB64:'',
  guideTitle:{'es':'Medidas de Dispersión','en':'Measures of Dispersion'},
  courseName:{'es':'Estadística','en':'Statistics'},
  filePrefix:'medidas_dispersion'
};
var TX={
  es:{'w-title':'Medidas de Dispersión','w-course':'Estadística · Semana 3','lbl-name':'Nombre completo','lbl-group':'Grupo','startBtn':'Comenzar','startErr':'Por favor llena ambos campos.','h-title':'Medidas de Dispersión','pdf-lbl':'Descargar resultados en PDF','ph-name':'Tu nombre completo','ph-group':'ej. 3A',
    'btn-pdf':'Descargar resultados en PDF','pdf-busy':'Generando PDF...',
    'pdf-student':'ALUMNO','pdf-group':'GRUPO','pdf-score':'correcta(s) de','pdf-questions':'preguntas',
    'pdf-summary':'RESUMEN DE REACTIVOS','pdf-summary2':'RESUMEN DE REACTIVOS (continuación)',
    'pdf-item':'Reactivo','pdf-of':'de','pdf-ok':'Correcto','pdf-bad':'Incorrecto',
    'pdf-question':'PREGUNTA','pdf-work':'TRABAJO DEL ALUMNO',
    'pdf-yours':'Alumno: ','pdf-key':'Correcto: ','pdf-sol':'Solución: ',
    'pdf-code':'Código: ','pdf-page':'Página '},
  en:{'w-title':'Measures of Dispersion','w-course':'Statistics · Week 3','lbl-name':'Full name','lbl-group':'Group','startBtn':'Start','startErr':'Please fill in both fields.','h-title':'Measures of Dispersion','pdf-lbl':'Download results as PDF','ph-name':'Your full name','ph-group':'e.g. 3A',
    'btn-pdf':'Download results as PDF','pdf-busy':'Generating PDF...',
    'pdf-student':'STUDENT','pdf-group':'GROUP','pdf-score':'correct out of','pdf-questions':'questions',
    'pdf-summary':'ITEM SUMMARY','pdf-summary2':'ITEM SUMMARY (continued)',
    'pdf-item':'Item','pdf-of':'of','pdf-ok':'Correct','pdf-bad':'Incorrect',
    'pdf-question':'QUESTION','pdf-work':'STUDENT WORK',
    'pdf-yours':'Student: ','pdf-key':'Correct: ','pdf-sol':'Solution: ',
    'pdf-code':'Code: ','pdf-page':'Page '}
};
function t(k){return(TX[LANG]&&TX[LANG][k])||TX.es[k]||k;}
function applyLang(){
  ['w-title','w-course','lbl-name','lbl-group','h-title','pdf-lbl'].forEach(function(id){var el=document.getElementById(id);if(el)el.textContent=t(id);});
  var sb=document.getElementById('startBtn');if(sb)sb.textContent=t('startBtn');
  var sn=document.getElementById('sName');if(sn)sn.placeholder=t('ph-name');
  var sg=document.getElementById('sGroup');if(sg)sg.placeholder=t('ph-group');
  document.getElementById('btn-es').classList.toggle('active',LANG==='es');
  document.getElementById('btn-en').classList.toggle('active',LANG==='en');
  if(lessonBuilt)rebuildLesson();
}
function setLang(l){LANG=l;applyLang();}

// ═══ THEME ═══
function toggleTheme(){
  var next=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',next);
  document.getElementById('themeBtn').textContent=next==='dark'?'☀️':'🌙';
  if(lessonBuilt){drawDotPlot();drawSliderCanvas();}
}

// ═══ STATE ═══
var studentName='',studentGroup='',lessonBuilt=false;
var problems=[];
var scores={};
var totalProblems=10;
var _rng=null;
var LS_PREFIX='dispersion3';
var dotPlotState={companyA:[],companyB:[],dragging:null,dragPt:null,locked:false,minV:0,maxV:0,target:0};
var varianceTableVerified=false;
var cvRoundsDone=0;
var cvScenariosData=[];
var cvSelected={};
var sliderMeanG=70,sliderSDG=10;

function lsKey(){return LS_PREFIX+'__'+(studentName+'__'+studentGroup).replace(/\s+/g,'_');}
function attKey(){return lsKey()+'__att';}
function currentAttempt(){try{var v=localStorage.getItem(attKey());return v?parseInt(v):0;}catch(e){return 0;}}
function nextAttempt(){var n=currentAttempt()+1;try{localStorage.setItem(attKey(),n);}catch(e){}return n;}
function makeRng(att){return seededRng(studentName+studentGroup+'disp3_'+att);}

function saveSession(){
  if(!studentName)return;

// ═══ SEEDED RNG ═══
function seededRng(seed){
  var s=0;for(var i=0;i<seed.length;i++)s=(Math.imul(31,s)+seed.charCodeAt(i))|0;
  return function(){
    s=(s+0x9e3779b9)|0;var t=s^(s>>>16);t=Math.imul(t,0x21f0aaad);
    t^=(t>>>15);t=Math.imul(t,0x735a2d97);return((t^(t>>>15))>>>0)/4294967296;
  };
}
function rInt(rng,lo,hi){return lo+Math.floor(rng()*(hi-lo+1));}
function rFloat(rng,lo,hi,dec){return parseFloat((lo+rng()*(hi-lo)).toFixed(dec||1));}
function shuffle(arr,rng){
  var a=arr.slice();
  for(var i=a.length-1;i>0;i--){var j=Math.floor(rng()*(i+1));var tmp=a[i];a[i]=a[j];a[j]=tmp;}
  return a;
}
function shuffleOpts(opts,ans,rng){
  var indexed=opts.map(function(o,i){return{o:o,correct:(i===ans)};});
  var shuf=shuffle(indexed,rng);
  var newAns=shuf.findIndex(function(x){return x.correct;});
  return{opts:shuf.map(function(x){return x.o;}),ans:newAns};
}

    entries.forEach(function(e){if(e.isIntersecting)e.target.classList.add('vis');});
  },{threshold:0.05});
  document.querySelectorAll('.section').forEach(function(s){obs.observe(s);});
}

var _pendingConfirm={};
function buildOneCard(prob,lb){
  scores[prob.id]=null;
  var card=document.createElement('div');
  card.className='section prob-card';card.id='card_'+prob.id;
  var optsHtml='';
  prob.opts.forEach(function(o,i){
    optsHtml+='<button class="prob-opt" id="po_'+prob.id+'_'+i+'" onclick="selectOpt(\''+prob.id+'\','+i+')">'+o+'</button>';
  });
  var swHtml='';
  if(prob.showWork){
    swHtml='<div class="show-work" id="sw_'+prob.id+'"><strong>'+(LANG==='es'?'Área de trabajo:':'Work area:')+'</strong><br>'+prob.workHint+'</div>';
  }
  card.innerHTML=
    '<div class="prob-label">'+(LANG==='es'?'Problema':'Problem')+' '+(problems.indexOf(prob)+1)+'</div>'+
    '<div class="prob-q">'+prob.q+'</div>'+swHtml+
    '<div class="prob-opts">'+optsHtml+'</div>'+
    '<div class="prob-fb" id="pfb_'+prob.id+'"></div>';
  lb.appendChild(card);
}
function selectOpt(probId,idx){
  if(scores[probId]!==null)return;
  var prob=problems.find(function(p){return p.id===probId;});if(!prob)return;
  // Second tap on same option confirms immediately — no separate button needed
  if(_pendingConfirm[probId]===idx){ confirmOpt(probId); return; }
  // First tap: highlight the selection
  prob.opts.forEach(function(o,i){var btn=document.getElementById('po_'+probId+'_'+i);if(btn)btn.classList.toggle('selected',i===idx);});
  _pendingConfirm[probId]=idx;
}
function confirmOpt(probId){
  if(scores[probId]!==null)return;
  var idx=_pendingConfirm[probId];if(idx===undefined)return;
  var prob=problems.find(function(p){return p.id===probId;});if(!prob)return;
  var correct=(idx===prob.ans);scores[probId]=correct?1:0;
  prob.opts.forEach(function(o,i){
    var btn=document.getElementById('po_'+probId+'_'+i);if(!btn)return;
    btn.disabled=true;btn.classList.remove('selected');
    if(i===prob.ans)btn.classList.add('correct');else if(i===idx)btn.classList.add('wrong');
  });
  var fb=document.getElementById('pfb_'+probId);
  if(fb){
    fb.className='prob-fb show '+(correct?'ok':'bad');
    fb.innerHTML=correct?'<strong>'+(LANG==='es'?'✓ Correcto.':'✓ Correct.')+'</strong> '+prob.fbOk:'<strong>'+(LANG==='es'?'Incorrecto.':'Incorrect.')+'</strong> '+prob.fbBad;
  }
  updateProgress();
}

  // ── WIDGET 4: CV comparator ──

    opts:p8r.opts,ans:p8r.ans,showWork:true,
    workHint:es?'Calcula CV = (s / x̄) × 100% para cada proceso. El mayor CV indica mayor variabilidad relativa.':'Compute CV = (s / x̄) × 100% for each process. The higher CV indicates greater relative variability.',

  var p9ren=['The range, because it is the best-known indicator and uses all data.','The standard deviation, because it is in the same units as bonuses and describes the typical variation in a comprehensible way.','The coefficient of variation, because it is always the most precise measure.','The variance, because squaring amplifies differences and makes them more visible.'];
  var p9r=shuffleOpts(es?p9raw:p9ren,1,rng);
  problems.push({id:'p9',q:es?'Una empresa quiere comunicar a sus empleados qué tan variables son los bonos anuales dentro de cada departamento. ¿Qué medida de dispersión es más adecuada para este propósito?':'A company wants to communicate to its employees how variable annual bonuses are within each department. Which dispersion measure is most appropriate for this purpose?',
    opts:p9r.opts,ans:p9r.ans,showWork:false,

  var pd10=[rInt(rng,10,20),rInt(rng,10,20),rInt(rng,10,20),rInt(rng,10,20),rInt(rng,10,20)];
  var m10=pd10.reduce(function(a,b){return a+b;},0)/5;

  var sd10=Math.sqrt(var10);
  var cv10=parseFloat((sd10/m10*100).toFixed(1));
  var w10a=parseFloat((cv10+rFloat(rng,4,10,1)).toFixed(1));

    fbBad:es?'Verifica cada paso: ¿dividiste s² entre 4? ¿tomaste la raíz? ¿dividiste s entre x̄ y multiplicaste por 100?':'Verify each step: did you divide s² by 4? Take the square root? Divide s by x̄ and multiply by 100?'});

  buildOneCard(problems[problems.length-3],lb);
  buildOneCard(problems[problems.length-2],lb);
  buildOneCard(problems[problems.length-1],lb);
}

// ═══ WIDGET 1: DOT PLOT ═══
function initDotPlot(target){
  var minV=target-12000,maxV=target+12000;
  dotPlotState.minV=minV;dotPlotState.maxV=maxV;dotPlotState.target=target;
  dotPlotState.companyA=[];dotPlotState.companyB=[];
  // Start balls piled at far left (2) and far right (3) — students must move them
  var startLeft=minV, startRight=maxV;
  dotPlotState.companyA=[startLeft,startLeft,startRight,startRight,startRight];
  dotPlotState.companyB=[startLeft,startLeft,startRight,startRight,startRight];
  drawDotPlot();
  var canvas=document.getElementById('dotPlotCanvas');
  if(!canvas)return;
  canvas.addEventListener('mousedown',dotDown);
  canvas.addEventListener('mousemove',dotMove);
  canvas.addEventListener('mouseup',dotUp);
  canvas.addEventListener('mouseleave',dotUp);
  canvas.addEventListener('touchstart',dotTStart,{passive:false});
  canvas.addEventListener('touchmove',dotTMove,{passive:false});
  canvas.addEventListener('touchend',dotUp);
}
function scaleX(canvas,clientX){
  var r=canvas.getBoundingClientRect();return(clientX-r.left)*(canvas.width/r.width);
}
function scaleY(canvas,clientY){
  var r=canvas.getBoundingClientRect();return(clientY-r.top)*(canvas.height/r.height);
}
function vToX(canvas,v){
  var lm=60,rm=20;
  return lm+(v-dotPlotState.minV)/(dotPlotState.maxV-dotPlotState.minV)*(canvas.width-lm-rm);
}
function xToV(canvas,px){
  var lm=60,rm=20;
  var t=(px-lm)/(canvas.width-lm-rm);
  var v=dotPlotState.minV+t*(dotPlotState.maxV-dotPlotState.minV);
  return Math.round(v/500)*500;
}
function findDrag(canvas,px,py){
  var rows=[{k:'companyA',y:70},{k:'companyB',y:190}];
  for(var r=0;r<rows.length;r++){
    var arr=dotPlotState[rows[r].k];
    for(var i=0;i<arr.length;i++){
      var dx=px-vToX(canvas,arr[i]),dy=py-rows[r].y;
      if(dx*dx+dy*dy<196){dotPlotState.dragging=rows[r].k;dotPlotState.dragPt=i;return;}
    }
  }
}
function dotDown(e){if(dotPlotState.locked)return;var c=this;findDrag(c,scaleX(c,e.clientX),scaleY(c,e.clientY));}
function dotMove(e){
  if(!dotPlotState.dragging||dotPlotState.locked)return;
  var c=document.getElementById('dotPlotCanvas');
  var v=xToV(c,scaleX(c,e.clientX));
  v=Math.max(dotPlotState.minV,Math.min(dotPlotState.maxV,v));
  dotPlotState[dotPlotState.dragging][dotPlotState.dragPt]=v;drawDotPlot();
}
function dotUp(){dotPlotState.dragging=null;dotPlotState.dragPt=null;}
function dotTStart(e){if(dotPlotState.locked)return;e.preventDefault();var c=this;var t=e.touches[0];findDrag(c,scaleX(c,t.clientX),scaleY(c,t.clientY));}
function dotTMove(e){
  if(!dotPlotState.dragging||dotPlotState.locked)return;e.preventDefault();
  var c=document.getElementById('dotPlotCanvas');var t=e.touches[0];
  var v=xToV(c,scaleX(c,t.clientX));
  v=Math.max(dotPlotState.minV,Math.min(dotPlotState.maxV,v));
  dotPlotState[dotPlotState.dragging][dotPlotState.dragPt]=v;drawDotPlot();
}
function drawDotPlot(){
  var canvas=document.getElementById('dotPlotCanvas');if(!canvas)return;
  var ctx=canvas.getContext('2d');
  var W=canvas.width,H=canvas.height;
  var isDark=document.documentElement.getAttribute('data-theme')==='dark';
  var lm=60,rm=20;
  ctx.fillStyle=isDark?'#242420':'#ffffff';ctx.fillRect(0,0,W,H);

  // Axes
  ctx.strokeStyle=isDark?'#3a3830':'#ddd8cc';ctx.lineWidth=1;
  [70,190].forEach(function(y){ctx.beginPath();ctx.moveTo(lm,y+30);ctx.lineTo(W-rm,y+30);ctx.stroke();});

  // Ticks + labels
  var minV=dotPlotState.minV,maxV=dotPlotState.maxV,target=dotPlotState.target;
  for(var v=minV;v<=maxV;v+=2000){
    var x=lm+(v-minV)/(maxV-minV)*(W-lm-rm);
    [70,190].forEach(function(y){ctx.beginPath();ctx.moveTo(x,y+28);ctx.lineTo(x,y+34);ctx.stroke();});
    if(v===minV||v===target||v===maxV){
      ctx.fillStyle=isDark?'#7a7468':'#7a7468';ctx.font='10px IBM Plex Mono';ctx.textAlign='center';
      ctx.fillText('$'+(v/1000)+'k',x,H-4);
    }
  }

  // Mean line
  var mx=lm+(target-minV)/(maxV-minV)*(W-lm-rm);
  ctx.save();ctx.strokeStyle='rgba(201,168,76,.75)';ctx.lineWidth=1.5;ctx.setLineDash([4,3]);
  ctx.beginPath();ctx.moveTo(mx,10);ctx.lineTo(mx,H-20);ctx.stroke();ctx.restore();
  ctx.fillStyle='#7a5800';ctx.font='bold 10px IBM Plex Sans';ctx.textAlign='center';
  ctx.fillText(LANG==='es'?'Media':'Mean',mx,13);

  // Row labels
  ctx.textAlign='right';
  ctx.fillStyle=isDark?'#4a8adf':'#1a4a8a';ctx.font='bold 11px IBM Plex Sans';ctx.fillText('A',lm-6,74);
  ctx.fillStyle=isDark?'#d4b86a':'#c9a84c';ctx.fillText('B',lm-6,194);

  // Dots
  var clr={companyA:{f:isDark?'#4a8adf':'#1a4a8a',s:'#0f2d5a'},companyB:{f:isDark?'#d4b86a':'#c9a84c',s:'#7a5800'}};
  [{k:'companyA',y:70},{k:'companyB',y:190}].forEach(function(r){
    dotPlotState[r.k].forEach(function(v){
      var x=lm+(v-minV)/(maxV-minV)*(W-lm-rm);
      ctx.beginPath();ctx.arc(x,r.y,10,0,2*Math.PI);
      ctx.fillStyle=clr[r.k].f;ctx.fill();
      ctx.strokeStyle=clr[r.k].s;ctx.lineWidth=2;ctx.stroke();
    });
  });

  // Update mean labels
  var mA=dotPlotState.companyA.reduce(function(a,b){return a+b;},0)/5;
  var mB=dotPlotState.companyB.reduce(function(a,b){return a+b;},0)/5;
  var eA=document.getElementById('dpMeanA'),eB=document.getElementById('dpMeanB');
  if(eA)eA.textContent='$'+Math.round(mA).toLocaleString('es-MX');
  if(eB)eB.textContent='$'+Math.round(mB).toLocaleString('es-MX');
}

function checkVarianceTable(){
  var es=LANG==='es';var fb=document.getElementById('fb-vt');
  var allOk=true,allFilled=true;
  for(var i=0;i<6;i++){
    ['vtd_','vtsq_'].forEach(function(pre){
      var el=document.getElementById(pre+i);if(!el)return;
      var ans=parseFloat(el.getAttribute('data-ans'));
      var val=parseFloat(el.value);
      if(isNaN(val)){allFilled=false;return;}
      var ok=Math.abs(val-ans)<0.15;
      el.className='freq-input'+(ok?' ok-cell':' bad-cell');
      if(!ok)allOk=false;
    });
  }
  ['vtsum','vtsqsum','vtvar','vtvarfinal'].forEach(function(id){
    var el=document.getElementById(id);if(!el)return;
    var ans=parseFloat(el.getAttribute('data-ans'));

    el.className='freq-input'+(ok?' ok-cell':' bad-cell');
    if(!ok)allOk=false;
  });
  if(!allFilled){fb.className='dd-fb show part';fb.textContent=(es?'⚠ Ingresa todos los valores antes de verificar.':'⚠ Enter all values before checking.');return;}

    varianceTableVerified=true;fb.className='dd-fb show ok';
    fb.innerHTML='<strong>'+(es?'✓ Tabla completa y correcta.':'✓ Table complete and correct.')+'</strong> '+(es?'Nota que la suma de las desviaciones siempre es 0, y que dividiste entre n − 1 = 5 (no entre 6).':'Note that the sum of deviations is always 0, and that you divided by n − 1 = 5 (not 6).');

  }
}

function drawSliderCanvas(){updateSliderWidget();}
function updateSliderWidget(){
  var sl=document.getElementById('gradeSlider');if(!sl)return;
  var val=parseInt(sl.value);
  document.getElementById('gradeVal').textContent=val;
  var mean=sliderMeanG,sd=sliderSDG;
  var canvas=document.getElementById('sliderCanvas');if(!canvas)return;
  var ctx=canvas.getContext('2d');
  var W=canvas.width,H=canvas.height;
  var isDark=document.documentElement.getAttribute('data-theme')==='dark';
  var lm=40,rm=20;
  var xMin=Math.max(0,mean-4*sd),xMax=Math.min(100,mean+4*sd);
  function vx(v){return lm+(v-xMin)/(xMax-xMin)*(W-lm-rm);}
  ctx.fillStyle=isDark?'#2e2e28':'#f0ede6';ctx.fillRect(0,0,W,H);
  // Bands
  var bands=[
    {lo:mean-3*sd,hi:mean+3*sd,c:isDark?'rgba(74,138,223,.08)':'rgba(26,74,138,.06)'},
    {lo:mean-2*sd,hi:mean+2*sd,c:isDark?'rgba(74,138,223,.13)':'rgba(26,74,138,.11)'},
    {lo:mean-sd,hi:mean+sd,c:isDark?'rgba(74,138,223,.22)':'rgba(26,74,138,.17)'}
  ];
  bands.forEach(function(b){
    var x1=vx(Math.max(b.lo,xMin)),x2=vx(Math.min(b.hi,xMax));
    ctx.fillStyle=b.c;ctx.fillRect(x1,20,x2-x1,70);
  });
  // Axis
  ctx.strokeStyle=isDark?'#3a3830':'#ddd8cc';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(lm,90);ctx.lineTo(W-rm,90);ctx.stroke();
  // SD ticks
  [-3,-2,-1,0,1,2,3].forEach(function(n){
    var v=mean+n*sd;if(v<xMin||v>xMax)return;
    var x=vx(v);
    ctx.strokeStyle=isDark?'#3a3830':'#ddd8cc';ctx.lineWidth=n===0?2:1;
    ctx.beginPath();ctx.moveTo(x,20);ctx.lineTo(x,92);ctx.stroke();
    ctx.fillStyle=isDark?'#b0aa9e':'#7a7468';ctx.font='9px IBM Plex Mono';ctx.textAlign='center';
    ctx.fillText(n===0?'x̄':(n>0?'+':'')+n+'s',x,H-2);
  });
  // Grade dot
  if(val>=xMin&&val<=xMax){
    var gx=vx(val);
    ctx.beginPath();ctx.arc(gx,55,8,0,2*Math.PI);
    ctx.fillStyle=isDark?'#d4b86a':'#c9a84c';ctx.fill();
    ctx.fillStyle='#1a1a16';ctx.font='bold 9px IBM Plex Mono';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(val,gx,55);ctx.textBaseline='alphabetic';
  }
  // Interp
  var devs=(val-mean)/sd;
  var label,color;
  var es=LANG==='es';
  if(devs>2){label=es?'Excepcional (> 2σ sobre la media)':'Exceptional (> 2σ above the mean)';color=isDark?'#d4b86a':'#7a5800';}
  else if(devs>1){label=es?'Por encima del rango típico (1σ – 2σ)':'Above the typical range (1σ – 2σ)';color=isDark?'#4a9a6f':'#1e7d45';}
  else if(devs>=0){label=es?'Dentro del rango típico (0 – 1σ sobre la media)':'Within the typical range (0 – 1σ above mean)';color=isDark?'#4a8adf':'#1a4a8a';}
  else if(devs>-1){label=es?'Dentro del rango típico (0 – 1σ bajo la media)':'Within the typical range (0 – 1σ below mean)';color=isDark?'#4a8adf':'#1a4a8a';}
  else if(devs>-2){label=es?'Por debajo del rango típico (−2σ a −1σ)':'Below the typical range (−2σ to −1σ)';color=isDark?'#c05030':'#c0321a';}
  else{label=es?'Muy por debajo de la media (< −2σ)':'Far below the mean (< −2σ)';color=isDark?'#c05030':'#c0321a';}
  var box=document.getElementById('sliderInterpBox');
  if(box){
    box.innerHTML='<span style="font-weight:600;color:'+color+'">'+label+'</span>'+
      '<span style="font-family:\'IBM Plex Mono\',monospace;font-size:.79rem;color:var(--text3);margin-left:.8rem">'+
        (es?'Cal: ':'Score: ')+val+' | '+(es?'Media: ':'Mean: ')+mean+' | ('+val+'−'+mean+') / '+sd+' = '+devs.toFixed(2)+'σ'+
      '</span>';
  }
}

function buildCVScenarios(rng,es){
  var names=[
    {a:es?'Planta Norte':'North Plant',b:es?'Planta Sur':'South Plant',v:es?'Producción diaria (unidades)':'Daily output (units)'},
    {a:es?'Fondo Renta Fija':'Fixed Income Fund',b:es?'Fondo de Acciones':'Equity Fund',v:es?'Rendimiento mensual (%)':'Monthly return (%)'},
    {a:es?'Sucursal Centro':'Downtown Branch',b:es?'Sucursal Periferia':'Suburban Branch',v:es?'Ticket promedio ($)':'Average ticket ($)'}
  ];
  var out=[];
  for(var i=0;i<3;i++){
    var mA=(rInt(rng,20,50))*10,sA=(rInt(rng,3,12))*10;
    var mB=(rInt(rng,20,50))*10,sB=(rInt(rng,3,12))*10;
    var cvA=parseFloat((sA/mA*100).toFixed(1));
    var cvB=parseFloat((sB/mB*100).toFixed(1));
    out.push({nameA:names[i].a,nameB:names[i].b,varLabel:names[i].v,mA:mA,sA:sA,cvA:cvA,mB:mB,sB:sB,cvB:cvB,more:cvA>cvB?'A':'B'});
  }
  return out;
}

function pickCV(round,choice){
  cvSelected[round]=choice;
  ['A','B'].forEach(function(c){
    var b=document.getElementById('cvb'+c+'_'+round);
    if(b)b.classList.toggle('selected',c===choice);
  });
}
function checkCV(round){
  var es=LANG==='es';var fb=document.getElementById('fb-cv-'+round);
  var sc=cvScenariosData[round];
  var inA=document.getElementById('cvA_'+round),inB=document.getElementById('cvB_'+round);
  var vA=parseFloat(inA.value),vB=parseFloat(inB.value);
  if(isNaN(vA)||isNaN(vB)||!cvSelected[round]){
    fb.className='dd-fb show part';fb.textContent=(es?'⚠ Ingresa ambos CV y selecciona cuál es más variable.':'⚠ Enter both CVs and select which is more variable.');return;
  }
  var okA=Math.abs(vA-sc.cvA)<0.2,okB=Math.abs(vB-sc.cvB)<0.2;
  inA.className='cv-input'+(okA?' ok-cell':' bad-cell');
  inB.className='cv-input'+(okB?' ok-cell':' bad-cell');
  var pickOk=cvSelected[round]===sc.more;
  if(okA&&okB&&pickOk){
    fb.className='dd-fb show ok';
    fb.textContent=(es?'✓ Correcto. CV_'+sc.nameA+' = '+sc.cvA+'%, CV_'+sc.nameB+' = '+sc.cvB+'%.':'✓ Correct. CV_'+sc.nameA+' = '+sc.cvA+'%, CV_'+sc.nameB+' = '+sc.cvB+'%.');
    var ins=document.getElementById('cvins_'+round),insT=document.getElementById('cvins-t_'+round);
    if(ins){ins.style.display='block';insT.textContent=(es?'La diferencia de '+Math.abs(sc.cvA-sc.cvB).toFixed(1)+'% en el CV indica una variabilidad relativa distinta entre ambos conjuntos. A mayor CV, mayor riesgo operativo relativo y menor previsibilidad.':'The '+Math.abs(sc.cvA-sc.cvB).toFixed(1)+'% CV difference indicates different relative variability. Higher CV means greater relative operational risk and lower predictability.');}
    document.getElementById('cvchk_'+round).disabled=true;inA.disabled=true;inB.disabled=true;
    ['A','B'].forEach(function(c){
      var b=document.getElementById('cvb'+c+'_'+round);
      if(b){b.disabled=true;if(c===sc.more)b.classList.add('correct');else b.classList.remove('selected');}
    });
    cvRoundsDone++;
    if(cvRoundsDone===3){
      var ff=document.getElementById('fb-cv-final');
      if(ff){ff.className='dd-fb show ok';ff.innerHTML='<strong>'+(es?'✓ Las tres rondas completadas.':'✓ All three rounds completed.')+'</strong> '+(es?'El coeficiente de variación es la herramienta correcta para comparar dispersión entre variables de diferente escala o nivel.':'The coefficient of variation is the correct tool for comparing dispersion across variables of different scale or level.');}
    }
  }else{
    fb.className='dd-fb show bad';
    fb.textContent=(es?'Revisa los valores en rojo. Recuerda: CV = (s / x̄) × 100%.':'Check red values. Remember: CV = (s / x̄) × 100%.');
  }
}

}

        /* correct answer is always prob.opts[prob.ans] */
      }
      var corrText=prob.opts&&prob.opts[prob.ans]?pdfText(prob.opts[prob.ans]):'';
      var expRaw=pdfText(isOk?prob.fbOk:prob.fbBad);

      /* rebuild chosenText properly from DOM */
      chosenText='';
      if(prob.opts){
        for(var oi2=0;oi2<prob.opts.length;oi2++){
          var oEl=document.getElementById('po_'+prob.id+'_'+oi2);
          if(oEl&&(oEl.classList.contains('wrong')||(oEl.classList.contains('correct')&&isOk))){
            chosenText=pdfText(prob.opts[oi2]||oEl.textContent||''  );break;
          }
        }
      }

      doc.setFontSize(8.5);var chLines=doc.splitTextToSize(t('pdf-yours')+chosenText,TW-18);
      doc.setFontSize(8);  var coLines=doc.splitTextToSize(t('pdf-key')+corrText,TW-18);
      doc.setFontSize(7.5);var exLines=doc.splitTextToSize(t('pdf-sol')+expRaw,TW-18).slice(0,4);
      var ansBoxH=8+chLines.length*5.5+coLines.length*5+exLines.length*5+6;
      doc.setFillColor(isOk?232:255,isOk?240:232,isOk?232:228);
      doc.roundedRect(M,wy,TW,ansBoxH,2,2,'F');
      doc.setFillColor(isOk?26:176,isOk?106:48,isOk?74:16);
      doc.circle(M+7,wy+8,3.5,'F');
      doc.setTextColor(255,255,255);doc.setFontSize(9);doc.setFont('helvetica','bold');
      doc.text(isOk?'v':'x',M+5.2,wy+10.5);
      var ay=wy+7;
      doc.setTextColor(20,24,32);doc.setFontSize(8.5);doc.setFont('helvetica','bold');
      chLines.forEach(function(ln,li){doc.text(ln,M+14,ay+li*5.5);});
      ay+=chLines.length*5.5+3;
      doc.setTextColor(26,106,74);doc.setFontSize(8);doc.setFont('helvetica','normal');
      coLines.forEach(function(ln,li){doc.text(ln,M+14,ay+li*5);});
      ay+=coLines.length*5+3;
      doc.setTextColor(90,85,80);doc.setFontSize(7.5);
      exLines.forEach(function(ln,li){doc.text(ln,M+14,ay+li*5);});
      wy+=ansBoxH+5;
    });

    /* ── Footer on every page ── */
    var pages=doc.internal.getNumberOfPages();
    for(var pg=1;pg<=pages;pg++){
      doc.setPage(pg);
      doc.setFillColor(pAR,pAG,pAB);doc.rect(0,PH-3,PW,3,'F');
      doc.setTextColor(130,140,160);doc.setFontSize(6.5);doc.setFont('helvetica','normal');
      doc.text(name+'  \xb7  '+group+'  \xb7  '+t('pdf-code')+code+'  \xb7  '+t('pdf-page')+pg+'/'+pages,PW/2,PH-5,{align:'center'});
    }

    /* ── Delivery ── */
    var _fn=SCHOOL.filePrefix+'_'+name.replace(/\s+/g,'_')+'_'+group.replace(/\s+/g,'_')+'.pdf';
    var _blob=doc.output('blob');
    var _isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
    if(_isIOS){
      var _file=new File([_blob],_fn,{type:'application/pdf'});
      if(navigator.canShare&&navigator.canShare({files:[_file]})){
        navigator.share({files:[_file],title:_fn}).then(function(){_rb();}).catch(function(e){if(e&&e.name==='AbortError'){_rb();return;}_oi(_blob);_rb();});
        return;
      }
      _oi(_blob);_rb();return;
    }
    var _u=URL.createObjectURL(_blob);
    var _a=document.createElement('a');_a.href=_u;_a.download=_fn;
    document.body.appendChild(_a);_a.click();
    setTimeout(function(){document.body.removeChild(_a);URL.revokeObjectURL(_u);},200);
    _rb();
  }catch(err){console.error(err);_rb();}
}
</script>
