<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lenguaje Común y Lenguaje Algebraico</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Lenguaje Común y Lenguaje Algebraico</div>
    <div class="wcourse" id="wcourse-el">Matemáticas · 1° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Lenguaje Común y Lenguaje Algebraico</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="sbtn" id="dlBtn" onclick="generatePDF()" style="max-width:280px;margin:0 auto;">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   CENTRALIZED SCHOOL CONFIG (Rule 16) — ships UNBRANDED (Rule 11).
   The ONLY rebranding point. build_all.py substitutes these exact fields
   (BRAND_FIELDS / RGB_FIELDS / logo*) downstream; :root/dark stay as fallback.
   Neutral defaults below == the static :root/dark values, so unbranded == no-op.
   ══════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:'#cc243c', primaryDark:'#480b14', primaryBg:'#f6e7e9',
  accent:'#fc0c24', accentBg:'#ffdbdf',
  darkPrimary:'#c74255', darkPrimaryDark:'#e87283', darkPrimaryBg:'#3b0b12',

function getAttemptKey(name, group){ return 'liaxa_mat1_t05_g01__att__' + (name+'__'+group).replace(/\s+/g,'_'); }
function nextAttempt(name, group){ var k=getAttemptKey(name,group),n=0; try{n=parseInt(localStorage.getItem(k)||'0',10)||0;}catch(e){} n++; try{localStorage.setItem(k,String(n));}catch(e){} return n; }
function currentAttempt(name, group){ var k=getAttemptKey(name,group); try{return parseInt(localStorage.getItem(k)||'1',10)||1;}catch(e){return 1;} }

function saveSession() {
  if (!studentData.name) return;
  var drawings = [], texts = [], photos = [];

    var dc = document.getElementById('dc' + i);
    if (dc && dc.width) {
      var blank = document.createElement('canvas');
      blank.width = dc.width; blank.height = dc.height;

    var ta = document.getElementById('ta' + i);

  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

      doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
      doc.setFontSize(7); doc.setFont('helvetica','bold');
      doc.rect(M,sy,TW,8,'F'); doc.text('RESUMEN DE PROBLEMAS (continuación)', M+4, sy+6);
      sy += 12;
    }
    var ok = document.getElementById('pc'+i).classList.contains('ok');
    doc.setFillColor(ok?232:255, ok?240:232, ok?232:228);
    doc.roundedRect(M,sy,TW,10,2,2,'F');
    doc.setFillColor(ok?26:176, ok?106:48, ok?74:16);
    doc.circle(M+6, sy+5, 2.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(7); doc.setFont('helvetica','bold');
    doc.text(ok?'✓':'✗', M+4.5, sy+6.5);
    doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('helvetica','normal');
    doc.text('Problema '+(i+1)+': '+pdfText(prob.title), M+12, sy+6.5);
    doc.setTextColor(ok?26:176, ok?106:48, ok?74:16);
    doc.text(ok?'Correcto':'Incorrecto', PW-M-24, sy+6.5);
    sy += 12;
  });

  // ── Per-problem pages ──
  for (var i = 0; i < problems.length; i++) {
    var prob = problems[i];
    doc.addPage();
    var wy = 0;

    doc.setFillColor(pBR,pBG,pBB); doc.rect(0,0,PW,20,'F');
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,3,'F');
    doc.setTextColor(pAR,pAG,pAB); doc.setFontSize(7); doc.setFont('helvetica','normal');
    doc.text(t('wcourse')+'  ·  '+t('wtitle'), M, 10);
    doc.setTextColor(232,238,247); doc.setFontSize(10.5); doc.setFont('helvetica','bold');
    doc.text('Problema '+(i+1)+' de '+total+'  ·  '+pdfText(prob.title), M, 17);
    wy = 25;

    var qRaw = pdfText(prob.questionText);
    doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var qLines = doc.splitTextToSize(qRaw, TW-10);
    var qBoxH  = 8 + qLines.length*5 + 3;
    doc.setFillColor(237,240,245); doc.roundedRect(M,wy,TW,qBoxH,2,2,'F');
    doc.setTextColor(pBR,pBG,pBB); doc.setFontSize(6.5); doc.setFont('helvetica','bold');
    doc.text('PREGUNTA', M+4, wy+6);
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var qy = wy+12;
    qLines.forEach(function(ln,li){ doc.text(ln, M+4, qy+li*5); });
    wy += qBoxH + 4;

    var isOk   = document.getElementById('pc'+i).classList.contains('ok');
    var chosen = prob.studentChoice != null ? pdfText(prob.options[prob.studentChoice]||'-') : '-';
    var corr   = pdfText(prob.options[prob.correctIdx]||'');
    var expRaw = pdfText(prob.explanation||'');
    doc.setFontSize(8.5); var chLines = doc.splitTextToSize('Alumno: '+chosen, TW-18);
    doc.setFontSize(8);   var coLines = doc.splitTextToSize('Correcto: '+corr, TW-18);
    doc.setFontSize(7.5); var exLines = doc.splitTextToSize('Solución: '+expRaw, TW-18).slice(0,4);
    var ansBoxH = 8 + chLines.length*5.5 + coLines.length*5 + exLines.length*5 + 6;
    doc.setFillColor(isOk?232:255, isOk?240:232, isOk?232:228);
    doc.roundedRect(M,wy,TW,ansBoxH,2,2,'F');
    doc.setFillColor(isOk?26:176, isOk?106:48, isOk?74:16);
    doc.circle(M+7, wy+8, 3.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(9); doc.setFont('helvetica','bold');
    doc.text(isOk?'✓':'✗', M+5.2, wy+10.5);
    var ay = wy+7;
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','bold');
    chLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5.5); });
    ay += chLines.length*5.5 + 3;
    doc.setTextColor(26,106,74); doc.setFontSize(8); doc.setFont('helvetica','normal');
    coLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    ay += coLines.length*5 + 3;
    doc.setTextColor(90,85,80); doc.setFontSize(7.5);
    exLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    wy += ansBoxH + 5;

    doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
    doc.setFontSize(7); doc.setFont('helvetica','bold');
    doc.rect(M,wy,TW,8,'F'); doc.text('TRABAJO DEL ALUMNO', M+4, wy+5.5);
    wy += 11;

    var dc = document.getElementById('dc'+i);
    if (dc) {
      try {
        var imgD = dc.toDataURL('image/png');
        var ar   = dc.height / dc.width;
        var iw   = TW;
        var ih   = Math.min(iw * ar, 68);
        doc.addImage(imgD, 'PNG', M, wy, iw, ih);
        wy += ih + 4;
      } catch(e) {}
    }

    var ta = document.getElementById('ta'+i);
    if (ta && ta.value.trim()) {
      if (wy > PH-30) { doc.addPage(); wy = 20; }
      doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('courier','normal');
      var taLines = doc.splitTextToSize(ta.value, TW);
      taLines.slice(0,16).forEach(function(ln) {
        if (wy > PH-15) { doc.addPage(); wy = 20; }
        doc.text(ln, M, wy); wy += 5;
      });
      wy += 2;
    }

    var pp = document.getElementById('pp'+i);
    if (pp && pp.src && pp.src.indexOf('data:') === 0) {
      if (wy > PH-55) { doc.addPage(); wy = 20; }
      try { doc.addImage(pp.src, 'JPEG', M, wy, TW, 68); wy += 72; } catch(e) {}
    }
  }

  // ── Footer on every page ──
  var pages = doc.internal.getNumberOfPages();
  for (var p = 1; p <= pages; p++) {
    doc.setPage(p);
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0, PH-3, PW, 3, 'F');
    doc.setTextColor(130,140,160); doc.setFontSize(6.5); doc.setFont('helvetica','normal');
    doc.text(name+'  ·  '+group+'  ·  Código: '+code+'  ·  Página '+p+'/'+pages,
      PW/2, PH-5, {align:'center'});
  }

  doc.save('mat1_t05_g01_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf');
  btn.innerHTML = '⬇ &nbsp;Descargar Resultados PDF';
  btn.disabled  = false;
}

/* ================================================
   buildLesson — OVERRIDE IN EACH GUIDE
   ================================================ */
function buildLesson(rng) {
  var body = document.getElementById('lessonBody');
  body.innerHTML = '';
  problems = [];

  /* ============================================================
     HELPERS
     ============================================================ */
  function T(o){
    if (o === undefined || o === null) return '';
    if (typeof o === 'string' || typeof o === 'number') return o;
    return (o[LANG] !== undefined ? o[LANG] : o.es);
  }
  function ri(a,b){ return a + Math.floor(rng()*(b-a+1)); }
  function shufA(arr){
    var a = arr.slice();
    for (var i=a.length-1;i>0;i--){ var j=Math.floor(rng()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
    return a;
  }
  function frac(n,d){ return '<span class="mf-outer"><span class="mf-num">'+n+'</span><span class="mf-den">'+d+'</span></span>'; }
  function term(coef, letter, cons){
    var s = (coef === 1 ? '' : coef) + letter;
    if (cons > 0) s += ' + ' + cons;
    else if (cons < 0) s += ' − ' + Math.abs(cons);
    return s;
  }
  function cvar(name){
    try { var v = getComputedStyle(document.documentElement).getPropertyValue(name); return v ? v.trim() : ''; }
    catch(e){ return ''; }
  }
  function el(id){ return document.getElementById(id); }
  function addSection(html){
    var d = document.createElement('div');
    d.className = 'section';
    d.innerHTML = html;
    body.appendChild(d);
    return d;
  }
  var CHIP = 'padding:.55rem .9rem;min-height:44px;min-width:46px';
  function numOpts(correct, cands){
    var out = [correct], i;
    for (i=0;i<cands.length && out.length<4;i++){
      var v = cands[i];
      if (v > 0 && out.indexOf(v) < 0) out.push(v);
    }
    var extra = [correct+1, correct-1, correct+10, correct+2, correct-2, correct+5, correct+20, correct+3];
    for (i=0;i<extra.length && out.length<4;i++){
      if (extra[i] > 0 && out.indexOf(extra[i]) < 0) out.push(extra[i]);
    }
    return out;
  }
  function addProblem(spec){
    var raw = Array.isArray(spec.options) ? spec.options.slice() : T(spec.options).slice();
    var correctVal = raw[spec.correctIdx];
    var order = shufA(raw.map(function(_,i){ return i; }));
    var shuffled = order.map(function(k){ return raw[k]; });
    var p = {
      title: T(spec.title),
      questionText: T(spec.questionText),
      fn: spec.fn || '',
      hint: T(spec.hint),
      explanation: T(spec.explanation),
      options: shuffled,
      correctIdx: shuffled.indexOf(correctVal),
      showWork: !!spec.showWork,
      studentChoice: null,
      pendingChoice: null
    };
    problems.push(p);
    buildOneCard(p, problems.length-1);
  }

  /* ============================================================
     CONCEPTO 1
     ============================================================ */
  addSection(
    '<div class="stag">' + T({es:'Idea 1', en:'Idea 1'}) + '</div>' +
    '<h2>' + T({es:'De las palabras a los símbolos', en:'From words to symbols'}) + '</h2>' +
    '<p>' + T({
      es:'Cuando una cantidad todavía no se conoce, la escribimos con una letra. Esa letra se llama literal y puede tomar distintos valores. Si el número desconocido es uno solo, casi siempre lo escribimos como n.',
      en:'When a quantity is still unknown, we write it with a letter. That letter is called a variable and it can take different values. If there is a single unknown number, we usually write it as n.'
    }) + '</p>' +
    '<p>' + T({
      es:'Con esa literal y los signos de las operaciones podemos escribir en pocos símbolos lo que una frase dice con muchas palabras. A esa forma de escribir se le llama lenguaje algebraico, y a la frase hablada, lenguaje común.',
      en:'With that variable and the operation signs we can write in a few symbols what a sentence says in many words. That way of writing is called algebraic language, and the spoken sentence is everyday language.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      '<div class="rcard"><div class="rname">' + T({es:'Aumentado en, suma de', en:'Increased by, sum of'}) + '</div><div class="rform">n + 4</div><div class="rnote">' + T({es:'agrega una cantidad', en:'adds a quantity'}) + '</div></div>' +
      '<div class="rcard"><div class="rname">' + T({es:'Disminuido en, menos que', en:'Decreased by, less than'}) + '</div><div class="rform">n − 4</div><div class="rnote">' + T({es:'quita una cantidad', en:'takes a quantity away'}) + '</div></div>' +
      '<div class="rcard"><div class="rname">' + T({es:'El doble, el triple', en:'Twice, three times'}) + '</div><div class="rform">2n, 3n</div><div class="rnote">' + T({es:'el número se repite', en:'the number repeats'}) + '</div></div>' +
      '<div class="rcard"><div class="rname">' + T({es:'La mitad de', en:'Half of'}) + '</div><div class="rform">' + frac('n','2') + '</div><div class="rnote">' + T({es:'se reparte en dos partes', en:'split into two parts'}) + '</div></div>' +
      '<div class="rcard"><div class="rname">' + T({es:'El producto de 5 por', en:'The product of 5 and'}) + '</div><div class="rform">5n</div><div class="rnote">' + T({es:'el 5 es el coeficiente', en:'5 is the coefficient'}) + '</div></div>' +
      '<div class="rcard"><div class="rname">' + T({es:'El doble de la suma', en:'Twice the sum'}) + '</div><div class="rform">2(n + 4)</div><div class="rnote">' + T({es:'primero suma, luego duplica', en:'add first, then double'}) + '</div></div>' +
    '</div>' +
    '<div class="callout"><p><strong>' + T({es:'El orden importa.', en:'Order matters.'}) + '</strong> ' + T({
      es:'"5 menos que un número" se escribe n − 5, porque al número se le quitan 5. En cambio "5 menos un número" se escribe 5 − n. Cambia el orden y cambia el significado.',
      en:'"5 less than a number" is written n − 5, because 5 is taken away from the number. But "5 minus a number" is written 5 − n. Change the order and the meaning changes.'
    }) + '</p></div>'
  );

  /* ============================================================
     MANIPULATIVO 1 — arma la expresión (3 rondas)
     ============================================================ */
  (function buildTranslator(){
    var TERMS = [
      { expr:'n',  coef:1, txt:{es:'un número', en:'a number'} },
      { expr:'2n', coef:2, txt:{es:'el doble de un número', en:'twice a number'} },
      { expr:'3n', coef:3, txt:{es:'el triple de un número', en:'three times a number'} },
      { expr:'5n', coef:5, txt:{es:'cinco veces un número', en:'five times a number'} }
    ];
    var OPS = [
      { sym:'+', word:{es:'aumentado en', en:'increased by'} },
      { sym:'−', word:{es:'disminuido en', en:'decreased by'} }
    ];
    function makeRound(){
      var t = TERMS[Math.floor(rng()*TERMS.length)];
      var o = OPS[Math.floor(rng()*OPS.length)];
      var num = ri(2,12);
      var nums = [num];
      var guard = 0;
      while (nums.length < 4 && guard < 60){
        var c = ri(2,15);
        if (nums.indexOf(c) < 0) nums.push(c);
        guard++;
      }
      return { term:t, op:o, num:num, nums:shufA(nums) };
    }
    var rounds = [makeRound(), makeRound(), makeRound()];
    var idx = 0, tries = 0, locked = false;
    var sel = { term:null, op:null, num:null };

    addSection(
      '<div class="stag">' + T({es:'Actividad', en:'Activity'}) + '</div>' +
      '<h2>' + T({es:'Arma la expresión', en:'Build the expression'}) + '</h2>' +
      '<p>' + T({
        es:'Lee la frase y toca las piezas para armar la expresión que le corresponde. Puedes cambiar cualquier pieza las veces que quieras antes de comprobar.',
        en:'Read the sentence and tap the pieces to build the matching expression. You can change any piece as many times as you want before checking.'
      }) + '</p>' +
      '<div class="gcrd">' +
        '<div class="mlbl" id="tr_round"></div>' +
        '<div id="tr_phrase" style="font-size:1.05rem;font-weight:600;margin:.35rem 0 .9rem;color:var(--green-dark)"></div>' +
        '<div id="tr_bank"></div>' +
        '<div id="tr_prev" style="background:var(--surface2);border-radius:8px;padding:.75rem;margin-top:.9rem;text-align:center;font-family:\'IBM Plex Mono\',monospace;font-size:1.15rem;color:var(--text)"></div>' +
        '<div id="tr_fb" style="margin-top:.7rem;font-size:.86rem;color:var(--text2);min-height:2.4rem"></div>' +
        '<div style="display:flex;gap:.5rem;flex-wrap:wrap">' +
          '<button class="mtab" id="tr_check" style="' + CHIP + '">' + T({es:'Comprobar', en:'Check'}) + '</button>' +
          '<button class="mtab" id="tr_next" style="' + CHIP + ';display:none">' + T({es:'Siguiente frase', en:'Next sentence'}) + '</button>' +
        '</div>' +
      '</div>'
    );

    function phraseOf(r){ return T(r.term.txt) + ' ' + T(r.op.word) + ' ' + r.num; }
    function renderPrev(){
      var a = (sel.term !== null) ? TERMS[sel.term].expr : '___';
      var b = (sel.op !== null) ? OPS[sel.op].sym : '?';
      var c = (sel.num !== null) ? sel.num : '__';
      el('tr_prev').innerHTML = T({es:'Tu expresión: ', en:'Your expression: '}) + '<strong>' + a + ' ' + b + ' ' + c + '</strong>';
    }
    function renderBank(){
      var r = rounds[idx], h = '';
      h += '<div class="mlbl">' + T({es:'Parte con la literal', en:'Part with the variable'}) + '</div><div class="mtabs">';
      TERMS.forEach(function(tm,i){
        h += '<button class="mtab' + (sel.term===i?' active':'') + '" style="' + CHIP + '" data-k="term" data-v="' + i + '">' + tm.expr + '</button>';
      });
      h += '</div>';
      h += '<div class="mlbl">' + T({es:'Operación', en:'Operation'}) + '</div><div class="mtabs">';
      OPS.forEach(function(op,i){
        h += '<button class="mtab' + (sel.op===i?' active':'') + '" style="' + CHIP + '" data-k="op" data-v="' + i + '">' + op.sym + '</button>';
      });
      h += '</div>';
      h += '<div class="mlbl">' + T({es:'Número', en:'Number'}) + '</div><div class="mtabs">';
      r.nums.forEach(function(nv){
        h += '<button class="mtab' + (sel.num===nv?' active':'') + '" style="' + CHIP + '" data-k="num" data-v="' + nv + '">' + nv + '</button>';
      });
      h += '</div>';
      el('tr_bank').innerHTML = h;
      el('tr_bank').querySelectorAll('.mtab').forEach(function(b){
        b.addEventListener('click', function(){
          if (locked) return;
          sel[b.getAttribute('data-k')] = parseInt(b.getAttribute('data-v'),10);
          renderBank(); renderPrev();
        });
      });
    }
    function renderRound(){
      var r = rounds[idx];
      el('tr_round').textContent = T({es:'Frase ', en:'Sentence '}) + (idx+1) + T({es:' de 3', en:' of 3'});
      el('tr_phrase').textContent = '"' + phraseOf(r) + '"';
      el('tr_fb').innerHTML = '';
      el('tr_next').style.display = 'none';
      el('tr_check').style.display = 'inline-block';
      renderBank(); renderPrev();
    }
    function showNext(){
      el('tr_check').style.display = 'none';
      if (idx < rounds.length-1) el('tr_next').style.display = 'inline-block';
      else el('tr_fb').innerHTML += '<br><strong style="color:var(--green-dark)">' + T({es:'Ya tradujiste las tres frases.', en:'You have translated all three sentences.'}) + '</strong>';
    }
    function reveal(){
      var r = rounds[idx];
      el('tr_fb').innerHTML = '<span style="color:var(--gold)"><strong>' + T({es:'La expresión correcta es ', en:'The correct expression is '}) + r.term.expr + ' ' + r.op.sym + ' ' + r.num + '.</strong> ' +
        T({es:'"' + T(r.term.txt) + '" se escribe ' + r.term.expr + ', y "' + T(r.op.word) + ' ' + r.num + '" ' + (r.op.sym==='+' ? 'agrega ' : 'quita ') + r.num + '.',
           en:'"' + T(r.term.txt) + '" is written ' + r.term.expr + ', and "' + T(r.op.word) + ' ' + r.num + '" ' + (r.op.sym==='+' ? 'adds ' : 'takes away ') + r.num + '.'}) + '</span>';
      showNext();
    }
    function check(){
      var r = rounds[idx];
      if (sel.term === null || sel.op === null || sel.num === null){
        el('tr_fb').innerHTML = T({es:'Elige una pieza de cada fila para completar tu expresión.', en:'Pick one piece from each row to complete your expression.'});
        return;
      }
      var okT = TERMS[sel.term].expr === r.term.expr;
      var okO = OPS[sel.op].sym === r.op.sym;
      var okN = sel.num === r.num;
      if (okT && okO && okN){
        locked = true;
        el('tr_fb').innerHTML = '<strong style="color:var(--ok)">' + T({es:'¡Exacto! ' + r.term.expr + ' ' + r.op.sym + ' ' + r.num + ' dice lo mismo que la frase. 🎉', en:'Exactly! ' + r.term.expr + ' ' + r.op.sym + ' ' + r.num + ' says the same as the sentence. 🎉'}) + '</strong>';
        showNext();
        return;
      }
      tries++;
      if (tries >= 3){ locked = true; reveal(); return; }
      var msgs = [];
      if (!okT){
        msgs.push(TERMS[sel.term].coef < r.term.coef
          ? T({es:'Tu parte con la literal toma el número menos veces de las que pide la frase.', en:'Your variable part takes the number fewer times than the sentence asks for.'})
          : T({es:'Tu parte con la literal toma el número más veces de las que pide la frase.', en:'Your variable part takes the number more times than the sentence asks for.'}));
      }
      if (!okO){
        msgs.push(r.op.sym === '+'
          ? T({es:'La frase agrega una cantidad, y tu signo la quita.', en:'The sentence adds a quantity, and your sign takes it away.'})
          : T({es:'La frase quita una cantidad, y tu signo la agrega.', en:'The sentence takes a quantity away, and your sign adds it.'}));
      }
      if (!okN){
        msgs.push(sel.num < r.num
          ? T({es:'El número que elegiste es menor que el que aparece en la frase.', en:'The number you picked is smaller than the one in the sentence.'})
          : T({es:'El número que elegiste es mayor que el que aparece en la frase.', en:'The number you picked is larger than the one in the sentence.'}));
      }
      if (!okT) sel.term = null;
      if (!okO) sel.op = null;
      if (!okN) sel.num = null;
      renderBank(); renderPrev();
      el('tr_fb').innerHTML = msgs.join(' ');
    }
    el('tr_check').addEventListener('click', check);
    el('tr_next').addEventListener('click', function(){
      idx++; tries = 0; locked = false;
      sel = { term:null, op:null, num:null };
      renderRound();
    });
    renderRound();
  })();

  /* ---------- PROBLEMA 1 ---------- */
  (function(){
    var v = Math.floor(rng()*2);
    if (v === 0){
      var c = ri(3,9);
      addProblem({
        title:{es:'De la frase a la expresión', en:'From sentence to expression'},
        questionText:{
          es:'Escribe con símbolos la frase: "el doble de un número aumentado en ' + c + '". Usa n para el número desconocido. ¿Cuál expresión le corresponde?',
          en:'Write the sentence "twice a number increased by ' + c + '" using symbols. Use n for the unknown number. Which expression matches it?'
        },
        options:['2n + ' + c, '2(n + ' + c + ')', 'n + ' + (2*c), '2n − ' + c],
        correctIdx:0,
        hint:{es:'Traduce por partes: primero lo que se hace con el número y después lo que indica la palabra que sigue.', en:'Translate piece by piece: first what happens to the number, then what the next word signals.'},
        explanation:{

  (function buildMatcher(){
    function pairOf(type, k){
      if (type === 'sum') return { phrase:{es:'la suma de un número y ' + k, en:'the sum of a number and ' + k}, expr:'n + ' + k, coef:1, op:'+', num:k };
      if (type === 'dif') return { phrase:{es:'un número disminuido en ' + k, en:'a number decreased by ' + k}, expr:'n − ' + k, coef:1, op:'−', num:k };
      if (type === 'dob') return { phrase:{es:'el doble de un número', en:'twice a number'}, expr:'2n', coef:2, op:'', num:0 };
      if (type === 'tri') return { phrase:{es:'el triple de un número aumentado en ' + k, en:'three times a number increased by ' + k}, expr:'3n + ' + k, coef:3, op:'+', num:k };
      if (type === 'mit') return { phrase:{es:'la mitad de un número', en:'half of a number'}, expr:frac('n','2'), coef:0.5, op:'', num:0 };
      if (type === 'inv') return { phrase:{es:k + ' menos un número', en:k + ' minus a number'}, expr:k + ' − n', coef:-1, op:'−', num:k };
      return { phrase:{es:'el producto de ' + k + ' por un número', en:'the product of ' + k + ' and a number'}, expr:k + 'n', coef:k, op:'', num:0 };
    }
    var types = shufA(['sum','dif','dob','tri','mit','inv','pro']).slice(0,4);
    var nums = shufA([3,4,5,6,7,8,9]).slice(0,4);
    var pairs = types.map(function(tp,i){ var p = pairOf(tp, nums[i]); p.id = i; return p; });
    var leftOrder = shufA(pairs.map(function(p){ return p.id; }));
    var rightOrder = shufA(pairs.map(function(p){ return p.id; }));
    var selLeft = null, matched = [], tryCount = {};

    addSection(
      '<div class="stag">' + T({es:'Actividad', en:'Activity'}) + '</div>' +
      '<h2>' + T({es:'Une cada frase con su expresión', en:'Match each sentence to its expression'}) + '</h2>' +
      '<p>' + T({
        es:'Toca una frase de la izquierda y luego la expresión de la derecha que dice lo mismo. Si no coinciden, la pareja se suelta y puedes volver a intentarlo.',
        en:'Tap a sentence on the left and then the expression on the right that says the same thing. If they do not match, the pair is released and you can try again.'
      }) + '</p>' +
      '<div class="gcrd">' +
        '<div class="mlbl" id="mt_count"></div>' +
        '<div class="cgrid" style="margin-top:.6rem">' +
          '<div id="mt_left"></div>' +
          '<div id="mt_right"></div>' +
        '</div>' +
        '<div id="mt_fb" style="margin-top:.5rem;font-size:.86rem;color:var(--text2);min-height:2.2rem"></div>' +
      '</div>'
    );

    var OKSTY = 'border-color:var(--ok);background:var(--ok-bg);color:var(--ok)';
    function byId(id){ for (var i=0;i<pairs.length;i++) if (pairs[i].id === id) return pairs[i]; return null; }
    function render(){
      var hl = '', hr = '';
      leftOrder.forEach(function(id){
        var p = byId(id), done = matched.indexOf(id) >= 0;
        hl += '<div class="mcopt' + (selLeft===id?' pending':'') + '" data-id="' + id + '" data-side="l" style="margin-bottom:.45rem;' + (done?OKSTY:'') + '">' + T(p.phrase) + '</div>';
      });
      rightOrder.forEach(function(id){
        var p = byId(id), done = matched.indexOf(id) >= 0;
        hr += '<div class="mcopt" data-id="' + id + '" data-side="r" style="margin-bottom:.45rem;justify-content:center;font-family:\'IBM Plex Mono\',monospace;' + (done?OKSTY:'') + '">' + p.expr + '</div>';
      });
      el('mt_left').innerHTML = hl;
      el('mt_right').innerHTML = hr;
      el('mt_count').textContent = T({es:'Parejas formadas: ', en:'Pairs made: '}) + matched.length + ' / 4';
      el('mt_left').querySelectorAll('.mcopt').forEach(bind);
      el('mt_right').querySelectorAll('.mcopt').forEach(bind);
    }
    function bind(node){
      node.addEventListener('click', function(){
        var id = parseInt(node.getAttribute('data-id'), 10);
        var side = node.getAttribute('data-side');
        if (matched.indexOf(id) >= 0) return;
        if (side === 'l'){
          selLeft = (selLeft === id) ? null : id;
          el('mt_fb').innerHTML = selLeft === null ? '' : T({es:'Ahora busca la expresión que dice lo mismo.', en:'Now look for the expression that says the same thing.'});
          render();
          return;

          es:'La suma es (x + ' + c2 + ') + (x + ' + c2 + ') + ' + b2 + '. Las dos x forman 2x y los números forman ' + K2 + ', así que el perímetro es 2x + ' + K2 + '.',
          en:'The sum is (x + ' + c2 + ') + (x + ' + c2 + ') + ' + b2 + '. The two x make 2x and the numbers make ' + K2 + ', so the perimeter is 2x + ' + K2 + '.'
        },
        showWork:true
      });
    }
  })();

  /* ---------- PROBLEMA 8 ---------- */
  (function(){
    var v = Math.floor(rng()*2);
    if (v === 0){
      var L = ri(6,15);
      var P = 4*L;
      addProblem({
        title:{es:'Del símbolo al número', en:'From symbol to number'},
        questionText:{es:'Dada la regla P = 4L para el perímetro de un cuadrado, calcula P cuando L = ' + L + ' cm.', en:'Given the rule P = 4L for the perimeter of a square, work out P when L = ' + L + ' cm.'},
        fn: 'P = 4L   ·   L = ' + L,
        options: numOpts(P, [L+4, 2*L, L*L]).map(function(n){ return n + ' cm'; }),
        correctIdx:0,
        hint:{es:'Reemplaza la literal por el valor que te dan y resuelve la operación que quedó indicada.', en:'Replace the variable with the value you are given and carry out the operation that remains.'},
        explanation:{
          es:'Sustituye L = ' + L + ': P = 4(' + L + ') = ' + P + ' cm',
          en:'Substitute L = ' + L + ': P = 4(' + L + ') = ' + P + ' cm'
        },
        showWork:true
      });
    } else {
      var aa = ri(5,14), bb = ri(3,12);
      var P2 = 2*aa + 2*bb;
      addProblem({
        title:{es:'Del símbolo al número', en:'From symbol to number'},
        questionText:{es:'Dada la regla P = 2a + 2b para el perímetro de un rectángulo, calcula P cuando a = ' + aa + ' cm y b = ' + bb + ' cm.', en:'Given the rule P = 2a + 2b for the perimeter of a rectangle, work out P when a = ' + aa + ' cm and b = ' + bb + ' cm.'},
        fn: 'P = 2a + 2b   ·   a = ' + aa + ',  b = ' + bb,
        options: numOpts(P2, [aa+bb, 2*aa+bb, aa*bb]).map(function(n){ return n + ' cm'; }),
        correctIdx:0,
        hint:{es:'Cada literal se reemplaza por su propio valor antes de sumar los dos resultados.', en:'Each variable is replaced by its own value before the two results are added.'},
        explanation:{
          es:'Sustituye a = ' + aa + ' y b = ' + bb + ': P = 2(' + aa + ') + 2(' + bb + ') = ' + (2*aa) + ' + ' + (2*bb) + ' = ' + P2 + ' cm',
          en:'Substitute a = ' + aa + ' and b = ' + bb + ': P = 2(' + aa + ') + 2(' + bb + ') = ' + (2*aa) + ' + ' + (2*bb) + ' = ' + P2 + ' cm'
        },
        showWork:true
      });
    }
  })();

  /* ============================================================
     CIERRE
     ============================================================ */
  addSection(
    '<div class="stag">' + T({es:'Cierre', en:'Wrap-up'}) + '</div>' +
    '<h2>' + T({es:'Dos situaciones más', en:'Two more situations'}) + '</h2>'
  );

  /* ---------- PROBLEMA 9 ---------- */
  (function(){
    var v = Math.floor(rng()*2);
    if (v === 0){
      var c = ri(2,8);
      var K = 2*c;
      addProblem({
        title:{es:'El jardín rectangular', en:'The rectangular garden'},
        questionText:{
          es:'Un jardín rectangular tiene un lado que mide x metros y el otro lado mide ' + c + ' metros más que ese. ¿Qué expresión representa el perímetro del jardín?',
          en:'A rectangular garden has one side measuring x metres and the other side measures ' + c + ' metres more than that one. Which expression represents the perimeter of the garden?'
        },
        options:['4x + ' + K, '2x + ' + K, '4x + ' + c, '2x + ' + c],
        correctIdx:0,
        hint:{es:'Escribe primero cuánto mide cada uno de los cuatro lados y luego reúne las partes iguales.', en:'First write how long each of the four sides is and then gather the equal parts.'},
        explanation:{
          es:'Los lados miden x, x + ' + c + ', x y x + ' + c + '. Al sumarlos, las cuatro x forman 4x y los números forman ' + K + ', así que el perímetro es 4x + ' + K + '.',
          en:'The sides measure x, x + ' + c + ', x and x + ' + c + '. Adding them, the four x make 4x and the numbers make ' + K + ', so the perimeter is 4x + ' + K + '.'
        },
        showWork:true
      });
    } else {
      var c2 = ri(2,7);
      var K2 = 4*c2;
      addProblem({
        title:{es:'La malla del terreno', en:'The fence around the plot'},
        questionText:{
          es:'Un terreno cuadrado tiene lados que miden x + ' + c2 + ' metros. Se quiere rodear el terreno completo con malla. ¿Qué expresión representa la cantidad de malla necesaria?',
          en:'A square plot has sides measuring x + ' + c2 + ' metres. The whole plot is going to be surrounded with fencing. Which expression represents the amount of fencing needed?'
        },
        options:['4x + ' + K2, '4x + ' + c2, 'x + ' + K2, '2x + ' + (2*c2)],
        correctIdx:0,
        hint:{es:'Recuerda cuántos lados iguales tiene un cuadrado antes de reunir las partes iguales de la suma.', en:'Remember how many equal sides a square has before gathering the equal parts of the sum.'},
        explanation:{
          es:'Se suman los cuatro lados: (x + ' + c2 + ') cuatro veces. Las cuatro x forman 4x y los números forman ' + K2 + ', así que la malla necesaria es 4x + ' + K2 + '.',
          en:'The four sides are added: (x + ' + c2 + ') four times. The four x make 4x and the numbers make ' + K2 + ', so the fencing needed is 4x + ' + K2 + '.'
        },
        showWork:true
      });
    }
  })();

  /* ---------- PROBLEMA 10 ---------- */
  (function(){
    var v = Math.floor(rng()*2);
    if (v === 0){
      var a = ri(3,7), b = ri(2,9), n0 = ri(3,10);
      var V = a*n0 - b;
      addProblem({
        title:{es:'Encuentra el valor de n', en:'Find the value of n'},
        questionText:{es:'Dada la expresión ' + a + 'n − ' + b + ', ¿para qué valor de n la expresión vale ' + V + '?', en:'Given the expression ' + a + 'n − ' + b + ', for which value of n is the expression equal to ' + V + '?'},
        fn: a + 'n − ' + b + '   ·   ' + T({es:'resultado', en:'result'}) + ' = ' + V,
        options: numOpts(n0, [n0+1, n0-1, V-a]).map(String),
        correctIdx:0,
        hint:{es:'Puedes probar valores en la expresión y comparar el resultado con el número que se busca.', en:'You can try values in the expression and compare the result with the number you are looking for.'},
        explanation:{
          es:'Con n = ' + n0 + ': ' + a + '(' + n0 + ') − ' + b + ' = ' + (a*n0) + ' − ' + b + ' = ' + V,
          en:'With n = ' + n0 + ': ' + a + '(' + n0 + ') − ' + b + ' = ' + (a*n0) + ' − ' + b + ' = ' + V
        },
        showWork:true
      });
    } else {
      var c = ri(3,9);
      addProblem({
        title:{es:'El paréntesis decide', en:'The parentheses decide'},
        questionText:{
          es:'¿Qué expresión representa la frase "el doble de la suma de un número y ' + c + '"? Usa n para el número desconocido.',
          en:'Which expression represents the sentence "twice the sum of a number and ' + c + '"? Use n for the unknown number.'
        },
        options:['2(n + ' + c + ')', '2n + ' + c, 'n + ' + (2*c), '2 + n + ' + c],
        correctIdx:0,
        hint:{es:'Fíjate en qué se duplica: si lo que se duplica es una suma completa, esa suma necesita quedar agrupada.', en:'Notice what gets doubled: if a whole sum is what gets doubled, that sum needs to stay grouped.'},
        explanation:{
          es:'La frase dice que primero se suma el número con ' + c + ' y ese total se duplica, por eso la suma se agrupa: 2(n + ' + c + ').',
          en:'The sentence says the number is added to ' + c + ' first and that total is doubled, so the sum is grouped: 2(n + ' + c + ').'
        },
        showWork:false
      });
    }
  })();
}
</script>

<script>
(function(){

  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
