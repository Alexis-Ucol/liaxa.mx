        'el porcentual multiplica cada año por ' + dec2(1 + g) + ', así que su suma anual crece con el negocio  ·  ' +
        'en el año ' + intN(Y) + ' la distancia entre las dos trayectorias ya es de ' + money(gap)
      : 'Both businesses start at ' + money(v0) + ' and in the first year both add ' + money(step) + '  ·  ' +
        'the line repeats that same addition every year  ·  ' +
        'the percentage path multiplies each year by ' + dec2(1 + g) + ', so its yearly addition grows with the business  ·  ' +
        'by year ' + intN(Y) + ' the distance between the two paths is already ' + money(gap);
    var gg = fitCanvas(host.querySelector('#f4cv'), 190);
    if (state.view === 'paths') {
      drawTrendChart(gg, 0, Y, {
        lines: [
          { f: geo, kind: 'green', label: (es ? 'Porcentaje constante' : 'Constant percentage') },
          { f: lin, kind: 'gold', dash: true, label: (es ? 'Recta del primer año' : 'First year line') }
        ],
        marks: [{ x: Y, y: vg, label: money(vg), kind: 'green' }],
        fmtY: function(v) { return money(v); },
        fmtX: function(v) { return (es ? 'año ' : 'year ') + intN(v); },
        xLabel: (es ? 'años' : 'years')
      });
    } else {
      drawTrendChart(gg, 0, Y, {
        lines: [{ f: function(x) { return geo(x) - lin(x); }, kind: 'bad',
                  label: (es ? 'Lo que la recta deja fuera' : 'What the line leaves out') }],
        bars: [{ x: Y, y0: 0, y1: gap, kind: 'bad', wide: true }],
        marks: [{ x: Y, y: gap, label: money(gap), kind: 'bad' }],
        fmtY: function(v) { return money(v); },
        fmtX: function(v) { return (es ? 'año ' : 'year ') + intN(v); },
        xLabel: (es ? 'años' : 'years')
      });
    }
    host.querySelector('#f4read').innerHTML = es
      ? '<strong>Lectura de negocio:</strong> creciendo ' + intN(g * 100) + '% al año, las ventas del año ' + intN(Y) + ' llegan a ' + money(vg) + ', mientras que la recta que copió el aumento del primer año se queda en ' + money(vl) + '. La diferencia es ' + money(gap) + ', o sea que la recta subestima en ' + pct1(shortfall) + '%. A esa tasa el negocio duplica ventas cada ' + dec1(dbl) + ' años, y el aumento del último año por sí solo vale ' + money(inc) + ', muy por encima de los ' + money(step) + ' del primero. ' +
        'La decisión práctica es cuál de las dos formas usar, y hay una prueba sencilla que se hace con la tabla de datos en la mano. Si las diferencias entre años consecutivos son parecidas, la recta es la herramienta correcta. Si lo parecido son las razones, es decir si cada año es un múltiplo estable del anterior, entonces el modelo es porcentual y la recta va a subestimar cada vez más. ' +
        'Una advertencia para el otro lado: ninguna tasa alta se sostiene para siempre, porque el mercado se satura. Proyectar veinte años a un porcentaje constante produce cifras que ninguna empresa ha logrado. La forma correcta a corto plazo puede ser una fantasía a largo plazo, y esa es la razón de fondo por la que un pronóstico siempre viene con un horizonte pegado.'
      : '<strong>Business reading:</strong> growing ' + intN(g * 100) + '% a year, sales in year ' + intN(Y) + ' reach ' + money(vg) + ', while the line that copied the first year increase stops at ' + money(vl) + '. The difference is ' + money(gap) + ', that is, the line underestimates by ' + pct1(shortfall) + '%. At that rate the business doubles its sales every ' + dec1(dbl) + ' years, and the increase of the final year alone is worth ' + money(inc) + ', far above the ' + money(step) + ' of the first. ' +
        'The practical decision is which of the two shapes to use, and there is a simple test you run with the data table in front of you. If the differences between consecutive years are similar, the straight line is the right tool. If what is similar are the ratios, that is, if each year is a stable multiple of the one before, then the model is a percentage one and the line will underestimate more and more. ' +
        'A warning in the other direction: no high rate holds forever, because markets saturate. Projecting twenty years at a constant percentage produces figures no company has ever reached. The right shape in the short run can be a fantasy in the long run, and that is the deep reason a forecast always comes with a horizon attached.';
  }
  widgets.push(mount);
  mount();
}

function buildLesson(rng) {
  problems = []; sectionDefs = []; widgets = [];
  document.getElementById('lessonBody').innerHTML = '';

  /* ── every number in the guide comes from the seeded rng ── */
  /* Concept 1: a straight line fitted to a history of monthly sales */
  var c1a  = pick([180000, 210000, 240000], rng);      // level the line starts from
  var c1b  = pick([9000, 12000, 15000], rng);          // pesos the line climbs each month
  var c1d  = pick([5000, 8000, 10000], rng);           // how irregular the months are
  var w1a  = pick([160000, 200000, 240000], rng);      // widget 1 opening state
  var w1b  = pick([8000, 12000, 16000], rng);
  var w1d  = pick([10000, 20000, 30000], rng);
  var p1a  = pick([150000, 180000, 195000], rng);      // item 1
  var p1b  = pick([8000, 11000, 14000], rng);
  var p1d  = pick([5000, 7500, 10000], rng);
  var p2a  = pick([120000, 145000, 170000], rng);      // item 2
  var p2b  = pick([6000, 9000, 12000], rng);
  var p2d  = pick([8000, 12000, 16000], rng);

  /* Concept 2: how much the line explains and how far it reaches */
  var c2a  = pick([320000, 380000, 440000], rng);
  var c2b  = pick([14000, 18000, 22000], rng);
  var c2d  = pick([12000, 16000, 20000], rng);
  var w2a  = pick([240000, 300000, 360000], rng);      // widget 2 opening state
  var w2b  = pick([6000, 10000, 14000], rng);
  var w2d  = pick([15000, 25000, 35000], rng);
  var p3A  = pick([420000, 560000, 680000], rng);      // item 3
  var p3b  = pick([9000, 12000, 16000], rng);
  var p3g  = pick([24000, 31000, 38000], rng);         // how far above the trend that month landed
  var p4n  = pick([8, 9, 10], rng);                    // item 4
  var p4r2 = pick([0.94, 0.96, 0.97], rng);
  var p4h  = pick([36, 48, 60], rng);

  /* ═══════════════════════ CONCEPT 1 ═══════════════════════ */
  var c1pts  = series6(c1a, c1b, c1d);
  var c1fit  = fitLine(c1pts);
  var c1y1   = c1pts[0].y, c1y6 = c1pts[5].y;
  var c1two  = (c1y6 - c1y1) / 5;
  var c1f9   = c1a + 9 * c1b;
  var c1f12  = c1a + 12 * c1b;

  addSection(function(L) {
    var es = L === 'es';
    var list = seriesList(c1pts, monthLabels(es));
    if (es) return '' +
      '<div class="stag">Concepto 1</div>' +
      '<h2>Una recta que resume seis meses de caja</h2>' +
      '<p>Toda empresa guarda una columna con lo que vendió cada periodo. Esa columna sube y baja por dos razones distintas que conviene separar desde el principio: hay un movimiento de fondo, sostenido, que responde a que el negocio crece o se encoge, y hay un ruido de calendario, clima, promociones y suerte que empuja cada mes por encima o por debajo de ese movimiento. La <strong>tendencia</strong> es el primero de los dos. Analizar tendencias no es adivinar el futuro, es separar la señal del ruido con una regla que cualquiera pueda repetir y auditar.</p>' +
      '<p>La regla que usa el mundo de los negocios es la <strong>recta de mínimos cuadrados</strong>. Se propone una recta con dos piezas: un nivel de arranque y un aumento por periodo. Para cada mes observado se mide la distancia vertical entre el dato y la recta, esa distancia se eleva al cuadrado y se suman todas. El cuadrado hace dos cosas a la vez: impide que un mes por arriba cancele a otro por abajo, y castiga más los errores grandes que los chicos. De todas las rectas imaginables se elige la única que deja esa suma en su valor mínimo, y de ahí viene el nombre.</p>' +
      '<p>Las dos piezas de la recta se leen en el idioma del negocio, no en el del álgebra. El <strong>aumento por periodo</strong>, la pendiente, es el dato que se lleva a una junta: son los pesos que el negocio suma cada mes cuando se ignora el ruido. El <strong>nivel de arranque</strong>, la ordenada, es el valor de la recta en el periodo cero, y ahí hay que tener cuidado, porque el periodo cero casi nunca es un mes que alguien haya vivido. Sirve para colocar la recta a la altura correcta, no para afirmar cuánto vendía la empresa antes de existir.</p>' +
      '<p>Con las dos piezas se puede <strong>proyectar</strong>: se sustituye un periodo futuro y la recta entrega una cifra. Ese es el pronóstico de tendencia, la base de casi todo presupuesto anual. Vale la pena decir desde ahora lo que ese número supone, porque el supuesto es fuerte: que el movimiento de fondo observado hasta hoy sigue igual mañana. Si abre un competidor, si cambia el precio o si el mercado se satura, la recta seguirá entregando cifras impecables sobre un mundo que dejó de existir. Medir qué tan bien describe la recta lo que ya pasó, y hasta dónde alcanza lo que promete, es el tema del siguiente concepto.</p>' +
      '<div class="rules-grid">' +
        '<div class="rcard"><div class="rname">Recta de tendencia</div><div class="rform">V = a + b·t</div><div class="rnote">Nivel de arranque más aumento por periodo.</div></div>' +
        '<div class="rcard"><div class="rname">Pendiente</div><div class="rform">b = ' + frac('Σ(t − tm)(V − Vm)', 'Σ(t − tm)²') + '</div><div class="rnote">tm y Vm son los promedios de las dos columnas.</div></div>' +
        '<div class="rcard"><div class="rname">Nivel</div><div class="rform">a = Vm − b·tm</div><div class="rnote">La recta pasa por el punto promedio.</div></div>' +
        '<div class="rcard"><div class="rname">Pronóstico</div><div class="rform">V = a + b·(periodo)</div><div class="rnote">Sustituir un periodo que aún no ocurre.</div></div>' +
      '</div>' +

      '<div class="stag">Concept 1</div>' +
      '<h2>A straight line that summarizes six months of takings</h2>' +
      '<p>Every company keeps a column with what it sold each period. That column rises and falls for two different reasons worth separating from the start: there is an underlying, sustained movement that comes from the business growing or shrinking, and there is a noise of calendar, weather, promotions and luck that pushes each month above or below that movement. The <strong>trend</strong> is the first of the two. Analysing trends is not guessing the future, it is separating signal from noise with a rule anybody can repeat and audit.</p>' +

      '<div class="stag">Concepto 2</div>' +
      '<h2>Qué tan buena es la recta y hasta dónde alcanza</h2>' +
      '<p>Una recta siempre sale. Se le puede ajustar una recta a la temperatura de Colima contra el número de bodas en Manzanillo y el programa entregará una pendiente sin protestar. Por eso el ajuste no termina cuando aparecen los dos números: falta juzgarlos. La materia prima de ese juicio son los <strong>residuos</strong>, la diferencia entre lo que cada mes vendió realmente y lo que la recta decía que iba a vender. Un residuo positivo es un mes que superó a su tendencia; uno negativo, un mes que se quedó corto.</p>' +
      '<p>Los residuos se resumen en dos cifras que toda hoja de cálculo entrega y casi nadie interpreta. La primera es el <strong>error típico</strong>: en pesos, por cuánto se equivoca la recta en un mes cualquiera. Es la más útil de las dos porque viene en la misma unidad que el negocio y se compara directamente contra un margen o un presupuesto. La segunda es el <strong>porcentaje explicado</strong>, que compara la variación que la recta no logró explicar contra la variación total de las ventas. Vale entre cero y uno: cerca de uno la recta describe casi todo el movimiento observado, cerca de cero el negocio se mueve por razones que el tiempo no captura.</p>' +
      '<p>Hay dos lecturas equivocadas del porcentaje explicado que cuestan dinero. La primera es tomarlo como licencia para pronosticar lejos: describe lo bien que la recta se acomoda a los meses que ya ocurrieron, no la probabilidad de que el patrón continúe. La segunda es descartar una tendencia real por un porcentaje bajo: un negocio con meses muy irregulares puede tener una tendencia perfectamente sólida y un porcentaje explicado modesto, porque hay mucho ruido alrededor de una señal que sí existe.</p>' +

      '<div class="stag">Concept 2</div>' +
      '<h2>How good the line is and how far it reaches</h2>' +
      '<p>A line always comes out. You can fit a line to the temperature in Colima against the number of weddings in Manzanillo and the software will hand you a slope without complaint. That is why the fit does not end when the two numbers appear: they still have to be judged. The raw material of that judgement are the <strong>residuals</strong>, the difference between what each month actually sold and what the line said it would sell. A positive residual is a month that beat its trend; a negative one, a month that fell short.</p>' +

      '<p>There are two wrong readings of the share explained that cost money. The first is taking it as a licence to forecast far out: it describes how well the line accommodates the months that already happened, not the probability that the pattern continues. The second is discarding a real trend because the share is low: a business with very irregular months can have a perfectly solid trend and a modest share explained, because there is a lot of noise around a signal that genuinely exists.</p>' +

      '<h2>La parte del movimiento que se repite cada año</h2>' +
      '<p>Hay negocios en los que la recta de tendencia, por buena que sea, deja residuos enormes y con un patrón inconfundible: los mismos trimestres siempre quedan por arriba y los mismos siempre por abajo. Eso no es ruido, es <strong>estacionalidad</strong>, un movimiento que se repite con el calendario porque el ciclo escolar, las vacaciones, las lluvias o el aguinaldo vuelven cada año en las mismas fechas. Mientras esa parte no se separe, ningún reporte trimestral se puede leer, porque cada cifra mezcla dos cosas que se mueven por razones distintas.</p>' +
      '<p>La herramienta estándar es el <strong>índice estacional</strong>, un número por temporada que dice cuánto corre esa temporada por encima o por debajo del nivel del año. Se construye comparando cada periodo observado contra la tendencia que le tocaba, promediando esas razones por temporada y reescalando los índices para que la suma de las cuatro estaciones dé exactamente cuatro, es decir para que promedien uno. Un índice de 1.2 significa que ese trimestre corre veinte por ciento arriba del nivel del año; uno de 0.8, veinte por ciento abajo.</p>' +

      '<h2>The part of the movement that repeats every year</h2>' +

      '<h2>Cuando los aumentos también crecen</h2>' +
      '<p>La recta supone algo muy concreto sobre el negocio: que cada periodo suma la misma cantidad de pesos que el anterior. Para una tienda madura en un mercado estable ese supuesto es razonable. Para una empresa joven, una franquicia en expansión o un producto que se está popularizando, no lo es: ahí lo que se mantiene estable no es el aumento en pesos sino el <strong>aumento en porcentaje</strong>, y un porcentaje constante aplicado sobre una base que crece produce aumentos cada vez más grandes.</p>' +
      '<p>Distinguir las dos formas no requiere ninguna teoría, solo dos columnas al lado de los datos. Se calculan las <strong>diferencias</strong> entre periodos consecutivos y también las <strong>razones</strong>, es decir cada periodo dividido entre el anterior. Si las diferencias se parecen entre sí, el modelo es la recta. Si las que se parecen son las razones, el modelo es porcentual. Esa prueba de treinta segundos evita el error más silencioso del análisis de tendencias, porque una recta ajustada a datos que crecen en porcentaje entrega un buen porcentaje explicado y aun así se equivoca cada vez más conforme se aleja.</p>' +
      '<p>Cuando el modelo es porcentual, la cifra que resume la historia es la <strong>tasa media de crecimiento</strong>: aquella que, aplicada de manera constante, lleva del primer valor al último en el número de periodos observados. No es el promedio de los crecimientos anuales, es la raíz correspondiente de la razón entre el último valor y el primero, precisamente porque los crecimientos se multiplican en lugar de sumarse. De ella salen dos números que un consejo entiende de inmediato: la proyección para un año futuro y el <strong>tiempo de duplicación</strong>, los años que tarda el negocio en valer el doble si la tasa se sostiene.</p>' +

        en: 'A toy retailer with branches in Colima and Villa de Álvarez projected its deseasonalized trend and found that for the fourth quarter of next year the underlying level of the business reaches ' + money(p8T) + '. Its seasonal indices, estimated over four years of history, are ' + dec2(p8i) + ' for the fourth quarter and ' + dec2(p8o) + ' for the first. The purchasing department needs the sales figure that should appear in the plan for that quarter, in calendar pesos. What is it?' },
    opts: { es: o8.es, en: o8.en },

  buildOneCard(problems[problems.length - 1], problems.length - 1);

  /* ── Item 9 ── */
  var p9 = pick(GROWTH, rng);
  var p9v = [], p9k;

  var o9 = shuffleOpts(
    ['Que en esta serie lo estable son los cocientes y no las diferencias, así que la recta tiene la forma equivocada: sus residuos quedan negativos en los años de en medio y positivos en los extremos, y más allá del último dato se queda corta cada año que pasa.',
     'Que la recta está bien planteada y el único ajuste necesario es reportar el pronóstico en miles de pesos, porque la serie tiene cifras demasiado grandes para una recta.',

    ['That in this series what is stable are the quotients and not the differences, so the straight line is the wrong shape: its residuals come out negative in the middle years and positive at the ends, and beyond the last figure it falls short with every year that passes.',

  var q9i = {
    title: { es: 'La recta que se va quedando atrás', en: 'The line that keeps falling behind' },
    q: { es: 'Una empresa de software administrativo con sede en Colima reportó estas ventas anuales: año 0, ' + money(p9v[0]) + '; año 1, ' + money(p9v[1]) + '; año 2, ' + money(p9v[2]) + '; año 3, ' + money(p9v[3]) + '; año 4, ' + money(p9v[4]) + '. Un analista ajustó una recta de mínimos cuadrados a esos cinco años, obtuvo un porcentaje explicado muy alto y con esa recta proyectó las ventas de los próximos seis años para sustentar una solicitud de inversión. ¿Cuál es la falla de fondo de ese trabajo?',
        en: 'A business software company based in Colima reported these annual sales: year 0, ' + money(p9v[0]) + '; year 1, ' + money(p9v[1]) + '; year 2, ' + money(p9v[2]) + '; year 3, ' + money(p9v[3]) + '; year 4, ' + money(p9v[4]) + '. An analyst fitted a least squares line to those five years, obtained a very high share explained and used that line to project sales for the next six years in support of an investment request. What is the substantive flaw in that work?' },
    opts: { es: o9.es, en: o9.en },
    hint: { es: 'Haz la prueba de forma antes de juzgar el ajuste. Escribe las diferencias entre años consecutivos y después los cocientes. Si las diferencias crecen sin parar, ninguna recta puede seguirlas, por bueno que parezca su porcentaje explicado dentro del rango observado.',
            en: 'Run the shape test before judging the fit. Write down the differences between consecutive years and then the quotients. If the differences keep growing, no straight line can follow them, however good its share explained looks inside the observed range.' },
    exp: { es: 'Cada año de esta serie es ' + dec2(1 + p9.g) + ' veces el anterior, así que las diferencias en pesos crecen año con año, desde ' + money(p9v[1] - p9v[0]) + ' hasta ' + money(p9v[4] - p9v[3]) + '. Una recta obligada a repetir siempre el mismo aumento solo puede acomodarse a una curva creciente pasando por arriba en el centro y por abajo en los extremos, y ese patrón curvo en los residuos es la señal que un porcentaje explicado alto no revela. Fuera del rango observado la brecha se agranda cada año, de modo que la solicitud de inversión estaría subestimando el negocio precisamente en los años que pretende financiar. La opción de reportar en miles cambia la presentación y no el modelo. La que dice que la recta sobrestima invierte el sentido del error: con crecimiento porcentual los aumentos en pesos son cada vez mayores, no menores, así que la recta se queda corta. Y la de la estacionalidad no aplica: una serie anual ya contiene un ciclo completo de calendario, y por eso la estacionalidad se estudia en datos trimestrales o mensuales.',
           en: 'Each year of this series is ' + dec2(1 + p9.g) + ' times the one before, so the differences in pesos grow year after year, from ' + money(p9v[1] - p9v[0]) + ' to ' + money(p9v[4] - p9v[3]) + '. A line forced to repeat the same increase forever can only accommodate a rising curve by passing above it in the centre and below it at the ends, and that curved pattern in the residuals is the signal a high share explained does not reveal. Outside the observed range the gap widens every year, so the investment request would be understating the business precisely in the years it seeks to finance. The option about reporting in thousands changes the presentation and not the model. The one claiming the line overstates reverses the direction of the error: with percentage growth the peso increases get larger, not smaller, so the line falls short. And the seasonality one does not apply: an annual series already contains a full calendar cycle, which is why seasonality is studied on quarterly or monthly data.' }

  var d9 = mk(q9i, o9.correctIdx, false);

  var p10a = pick([220000, 250000, 280000], rng);

        en: 'A convenience store in Colima recorded these monthly sales: ' + seriesList(p10pts, monthLabels(false)) + '. The months jump around because of promotions and public holidays, so the analyst decides to smooth the series with a three month moving average in order to see the underlying level. The committee asks her for the value of that moving average computed over the three most recent months. How much is it?' },

  set('dlBtn',        t('btn-pdf'));

  var lr = document.getElementById('logo-right');  if (lr) lr.alt = SCHOOL.logoRightAlt;
}
/* Rebuilds the visible text of every card without touching the numbers. */
function applyProblemLang() {
  problems.forEach(function(p, i) {
    var card = document.getElementById('pc' + i);
    if (!card || !p.i18n) return;
    p.title        = p.i18n.title[LANG];
    p.questionText = p.i18n.q[LANG];
    p.hint         = p.i18n.hint[LANG];
    p.explanation  = p.i18n.exp[LANG];
    p.options      = p.i18n.opts[LANG].slice();
    var ti = card.querySelector('.ptitle'); if (ti) ti.textContent = p.title;
    var st = card.querySelector('.pstmt');  if (st) st.innerHTML = p.questionText;
    var hb = card.querySelector('.hintbox'); if (hb) hb.innerHTML = p.hint;
    var hbtn = card.querySelector('.hintbtn'); if (hbtn) hbtn.textContent = t('btn-hint');
    card.querySelectorAll('.mcopt').forEach(function(o, oi) {
      if (p.options[oi] !== undefined) o.innerHTML = p.options[oi];
    });
    var tabs = card.querySelectorAll('.wtab');
    if (tabs.length === 3) {
      tabs[0].textContent = t('tab-draw');
      tabs[1].textContent = t('tab-type');
      tabs[2].textContent = t('tab-photo');
    }
    var tools = card.querySelectorAll('.tbtn2');
    if (tools.length === 3) {
      tools[0].textContent = t('tool-pen');
      tools[1].textContent = t('tool-mark');
      tools[2].textContent = t('tool-erase');
    }
    var clr = card.querySelector('.clrbtn'); if (clr) clr.textContent = t('tool-clear');
    var ta  = card.querySelector('.wtextarea'); if (ta) ta.placeholder = t('ph-work');
    var pzt = card.querySelector('.pztxt'); if (pzt) pzt.textContent = t('ph-photo');
    var lab = card.querySelector('.pbody > div:last-child > div:first-child');
    if (lab) lab.textContent = t('lbl-answer');
    var fb = card.querySelector('.mcfb');
    if (fb && fb.classList.contains('show')) {
      var isOk = (p.studentChoice === p.correctIdx);
      fb.innerHTML = '<strong>' + (isOk ? t('fb-correct') : t('fb-wrong')) + '</strong> ' + p.explanation;
    }
  });
}
function setLang(l) {
  LANG = l;
  try { localStorage.setItem(LANG_KEY, l); } catch(e) {}
  document.documentElement.setAttribute('lang', l);
  var be = document.getElementById('btn-es'), bn = document.getElementById('btn-en');
  if (be) be.classList.toggle('active', l === 'es');
  if (bn) bn.classList.toggle('active', l === 'en');
  applyUIStrings();
  applySectionLang();
  applyProblemLang();
  widgets.forEach(function(f) { try { f(); } catch(e) {} });
  document.querySelectorAll('#lessonBody .section').forEach(function(s) { s.classList.add('vis'); });
}
(function() {
  try { var stored = localStorage.getItem(LANG_KEY); if (stored === 'es' || stored === 'en') LANG = stored; } catch(e) {}
  document.addEventListener('DOMContentLoaded', function() {
    document.documentElement.setAttribute('lang', LANG);
    var be = document.getElementById('btn-es'), bn = document.getElementById('btn-en');
    if (be) be.classList.toggle('active', LANG === 'es');
    if (bn) bn.classList.toggle('active', LANG === 'en');
    applyUIStrings();
  });
})();

      doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
      doc.setFontSize(7); doc.setFont('helvetica','bold');
      doc.rect(M,sy,TW,8,'F'); doc.text(t('pdf-summary2'), M+4, sy+6);
      sy += 12;
    }
    var ok = document.getElementById('pc'+i).classList.contains('ok');
    doc.setFillColor(ok?232:255, ok?240:232, ok?232:228);
    doc.roundedRect(M,sy,TW,10,2,2,'F');
    doc.setFillColor(ok?26:176, ok?106:48, ok?74:16);
    doc.circle(M+6, sy+5, 2.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(7); doc.setFont('helvetica','bold');
    doc.text(ok?'v':'x', M+4.5, sy+6.5);
    doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('helvetica','normal');
    doc.text(t('pdf-item')+' '+(i+1)+': '+pdfText(prob.title), M+12, sy+6.5);
    doc.setTextColor(ok?26:176, ok?106:48, ok?74:16);
    doc.text(ok?t('pdf-ok'):t('pdf-bad'), PW-M-24, sy+6.5);
    sy += 12;
  });

  for (var i = 0; i < problems.length; i++) {
    var prob = problems[i];
    doc.addPage();
    var wy = 0;

    doc.setFillColor(pBR,pBG,pBB); doc.rect(0,0,PW,20,'F');
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,3,'F');
    doc.setTextColor(pAR,pAG,pAB); doc.setFontSize(7); doc.setFont('helvetica','normal');
    doc.text(SCHOOL.courseName[LANG]+'  ·  '+SCHOOL.guideTitle[LANG], M, 10);
    doc.setTextColor(240,244,238); doc.setFontSize(10.5); doc.setFont('helvetica','bold');
    doc.text(t('pdf-item')+' '+(i+1)+' '+t('pdf-of')+' '+total+'  ·  '+pdfText(prob.title), M, 17);
    wy = 25;

    var qRaw = pdfText(prob.questionText);
    doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var qLines = doc.splitTextToSize(qRaw, TW-10);
    var qBoxH  = 8 + qLines.length*5 + 3;
    doc.setFillColor(237,240,245); doc.roundedRect(M,wy,TW,qBoxH,2,2,'F');
    doc.setTextColor(pBR,pBG,pBB); doc.setFontSize(6.5); doc.setFont('helvetica','bold');
    doc.text(t('pdf-question'), M+4, wy+6);
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var qy = wy+12;
    qLines.forEach(function(ln,li){ doc.text(ln, M+4, qy+li*5); });
    wy += qBoxH + 4;

    var isOk   = document.getElementById('pc'+i).classList.contains('ok');
    var chosen = prob.studentChoice != null ? pdfText(prob.options[prob.studentChoice]||'') : '';
    var corr   = pdfText(prob.options[prob.correctIdx]||'');
    var expRaw = pdfText(prob.explanation||'');
    doc.setFontSize(8.5); var chLines = doc.splitTextToSize(t('pdf-yours')+chosen, TW-18);
    doc.setFontSize(8);   var coLines = doc.splitTextToSize(t('pdf-key')+corr, TW-18);
    doc.setFontSize(7.5); var exLines = doc.splitTextToSize(t('pdf-sol')+expRaw, TW-18).slice(0,4);
    var ansBoxH = 8 + chLines.length*5.5 + coLines.length*5 + exLines.length*5 + 6;
    doc.setFillColor(isOk?232:255, isOk?240:232, isOk?232:228);
    doc.roundedRect(M,wy,TW,ansBoxH,2,2,'F');
    doc.setFillColor(isOk?26:176, isOk?106:48, isOk?74:16);
    doc.circle(M+7, wy+8, 3.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(9); doc.setFont('helvetica','bold');
    doc.text(isOk?'v':'x', M+5.2, wy+10.5);
    var ay = wy+7;
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','bold');
    chLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5.5); });
    ay += chLines.length*5.5 + 3;
    doc.setTextColor(26,106,74); doc.setFontSize(8); doc.setFont('helvetica','normal');
    coLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    ay += coLines.length*5 + 3;
    doc.setTextColor(90,85,80); doc.setFontSize(7.5);
    exLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    wy += ansBoxH + 5;

    var dc = document.getElementById('dc'+i);
    if (dc) {
      doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
      doc.setFontSize(7); doc.setFont('helvetica','bold');
      doc.rect(M,wy,TW,8,'F'); doc.text(t('pdf-work'), M+4, wy+5.5);
      wy += 11;
      try {
        var imgD = dc.toDataURL('image/png');
        var ar   = dc.height / dc.width;
        var iw   = TW;
        var ih   = Math.min(iw * ar, 68);
        doc.addImage(imgD, 'PNG', M, wy, iw, ih);
        wy += ih + 4;
      } catch(e) {}
    }

    var ta = document.getElementById('ta'+i);
    if (ta && ta.value.trim()) {
      if (wy > PH-30) { doc.addPage(); wy = 20; }
      doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('courier','normal');
      var taLines = doc.splitTextToSize(ta.value, TW);
      taLines.slice(0,16).forEach(function(ln) {
        if (wy > PH-15) { doc.addPage(); wy = 20; }
        doc.text(ln, M, wy); wy += 5;
      });
      wy += 2;
    }

    var pp = document.getElementById('pp'+i);
    if (pp && pp.src && pp.src.indexOf('data:') === 0) {
      if (wy > PH-55) { doc.addPage(); wy = 20; }
      try { doc.addImage(pp.src, 'JPEG', M, wy, TW, 68); wy += 72; } catch(e) {}
    }
  }

  var pages = doc.internal.getNumberOfPages();
  for (var p = 1; p <= pages; p++) {
    doc.setPage(p);
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0, PH-3, PW, 3, 'F');
    doc.setTextColor(130,140,160); doc.setFontSize(6.5); doc.setFont('helvetica','normal');
    doc.text(name+'  ·  '+group+'  ·  '+t('pdf-code')+code+'  ·  '+t('pdf-page')+p+'/'+pages,
      PW/2, PH-5, {align:'center'});
  }

  var _fn = SCHOOL.filePrefix + '_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf';
  var _pdfBlob = doc.output('blob');
  var _blobUrl = URL.createObjectURL(_pdfBlob);
  var _a = document.createElement('a');
  _a.href = _blobUrl;
  _a.download = _fn;
  document.body.appendChild(_a);
  _a.click();
  setTimeout(function(){ document.body.removeChild(_a); URL.revokeObjectURL(_blobUrl); }, 200);
  btn.textContent = t('btn-pdf');
  btn.disabled  = false;
}
</script>
</body>
</html>
