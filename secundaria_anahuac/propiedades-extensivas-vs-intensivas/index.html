<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Propiedades Extensivas vs Intensivas</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Propiedades Extensivas vs Intensivas</div>
    <div class="wcourse" id="wcourse-el">Química · Tercero de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Propiedades Extensivas vs Intensivas</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="sbtn" id="dlBtn" onclick="generatePDF()" style="max-width:280px;margin:0 auto;">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   CENTRALIZED SCHOOL CONFIG (Rule 16) — ships UNBRANDED (Rule 11).
   The ONLY rebranding point. build_all.py substitutes these exact fields
   (BRAND_FIELDS / RGB_FIELDS / logo*) downstream; :root/dark stay as fallback.
   Neutral defaults below == the static :root/dark values, so unbranded == no-op.
   ══════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:'#1a4a8a', primaryDark:'#0c2547', primaryBg:'#e7edf6',
  accent:'#e07b1a', accentBg:'#fbeddf',
  darkPrimary:'#437bc6', darkPrimaryDark:'#74a5e6', darkPrimaryBg:'#0c203a',

  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);

  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');

}

function L(o){ return (o && o[LANG] !== undefined) ? o[LANG] : (o ? o.es : ''); }
function ri(rng, a, b){ return a + Math.floor(rng() * (b - a + 1)); }
function pk(rng, a){ return a[Math.floor(rng() * a.length)]; }
function nums(a){ var i, o = []; for (i = 0; i < a.length; i++) o.push(String(a[i])); return o; }
function r1(x){ return Math.round(x * 10) / 10; }
function fmt(x){ var v = r1(x); return (Math.round(v) === v) ? String(Math.round(v)) : String(v); }

/* cuatro opciones numericas distintas, la correcta en la posicion 0 */
function opts4(rng, correct, cands){
  var out = [correct], pool = shuffle(cands, rng), i, k = 1;
  for (i = 0; i < pool.length && out.length < 4; i++){
    if (pool[i] > 0 && out.indexOf(pool[i]) === -1) out.push(pool[i]);
  }
  while (out.length < 4){
    if ((correct + k) > 0 && out.indexOf(correct + k) === -1) out.push(correct + k);
    k++;
  }
  return nums(out);
}

function addProblem(rng, spec){
  var idx = problems.length;
  var correctVal = spec.options[spec.correct];
  var sh = shuffle(spec.options, rng);
  var prob = {
    title: spec.title,
    questionText: spec.q,
    fn: spec.fn || '',
    hint: spec.hint || '',
    explanation: spec.exp || '',
    options: sh,
    correctIdx: sh.indexOf(correctVal),
    showWork: !!spec.showWork,
    studentChoice: null,
    pendingChoice: null
  };
  problems.push(prob);
  buildOneCard(prob, idx);
}

/* ==========================================================================
   MANIPULATIVO 1 :: divide la muestra y observa que numeros se mueven
   ========================================================================== */
function w1(rng, host){
  var R = shuffle(SUS, rng).slice(0, 3);
  var V0 = 60;
  var CUTS = [
    { f:1,      es:'Muestra completa',   en:'Whole sample' },
    { f:0.5,    es:'Cortar a la mitad',  en:'Cut in half' },
    { f:1 / 3,  es:'Cortar en tres',     en:'Cut in three' },
    { f:2,      es:'Duplicar la muestra',en:'Double the sample' }
  ];
  var KEY = ['ext', 'ext', 'int', 'int', 'int'];
  var rd = 0, tries = 0, locked = false, done = false, cut = 0, tag = ['', '', '', '', ''];

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Divide la muestra', en:'Divide the sample' }) + '</div>' +
    '<div class="gw-q" data-r="ttl"></div>' +
    '<div class="gw-mini">' + L({
      es:'Cambia la cantidad de muestra y observa la columna de la derecha. Después marca cada renglón como Depende de la cantidad o No depende.',
      en:'Change the amount of sample and watch the right hand column. Then mark each row as Depends on the amount or Does not depend.'
    }) + '</div>' +
    '<div class="gw-grid" data-r="cuts"></div>' +
    '<div class="gw-lbl">' + L({ es:'Muestra completa  →  muestra actual', en:'Whole sample  →  current sample' }) + '</div>' +
    '<div data-r="rows"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Comprobar', en:'Check' }) + '</button><span class="gw-val" data-r="live"></span></div>' +
    '<div class="gw-fb"></div>';

  var elT = host.querySelector('[data-r="ttl"]'),
      elC = host.querySelector('[data-r="cuts"]'),
      elR = host.querySelector('[data-r="rows"]'),
      elB = host.querySelector('[data-r="chk"]'),
      elL = host.querySelector('[data-r="live"]');

  function label(x){
    if (x === 'ext') return L({ es:'Depende de la cantidad', en:'Depends on the amount' });
    if (x === 'int') return L({ es:'No depende', en:'Does not depend' });
    return L({ es:'Sin marcar', en:'Not marked' });
  }

  function vals(s, v){
    return [
      fmt(s.d * v) + ' g',
      fmt(v) + ' cm³',
      fmt(s.d) + ' g/cm³',
      fmt(s.mp) + ' °C',
      L(s.col)
    ];
  }

  function draw(){
    var s = R[rd], v = V0 * CUTS[cut].f;
    var a = vals(s, V0), b = vals(s, v);
    var NAM = [
      L({ es:'Masa', en:'Mass' }),
      L({ es:'Volumen', en:'Volume' }),
      L({ es:'Densidad', en:'Density' }),
      L({ es:'Temperatura de fusión', en:'Melting temperature' }),
      L({ es:'Color', en:'Colour' })
    ];
    elT.innerHTML = L({ es:'Muestra de ', en:'Sample of ' }) + L(s).toLowerCase();
    elC.innerHTML = CUTS.map(function(c, i){
      return '<button class="gw-tile' + (cut === i ? ' on' : '') + '" data-c="' + i + '"' + (done ? ' disabled' : '') + '>' + L(c) + '</button>';
    }).join('');
    elR.innerHTML = NAM.map(function(n, i){
      var moved = a[i] !== b[i];
      return '<div class="gw-tr' + (cut === 0 ? '' : (moved ? ' moved' : ' still')) + '">' +
        '<span class="gw-tn">' + n + '</span>' +
        '<span class="gw-v0">' + a[i] + '</span>' +
        '<span class="gw-v1">' + b[i] + '</span>' +
        '<button class="gw-tag' + (tag[i] ? ' on' : '') + '" data-i="' + i + '"' + (locked ? ' disabled' : '') + '>' + label(tag[i]) + '</button>' +
        '</div>';
    }).join('');
    elL.innerHTML = L({ es:'Ahora la muestra ocupa ', en:'The sample now takes up ' }) + fmt(v) + ' cm³';
  }

  function advance(){
    rd++;
    if (rd >= 3){
      done = true;
      elB.textContent = L({ es:'Completado', en:'Completed' });
      elB.className = 'gw-btn solved';
      draw();
      say(host, 'good', L({
        es:'Tres muestras revisadas. La masa y el volumen se reparten al cortar; la densidad, la temperatura de fusión y el color se quedan quietos por más que cambie la cantidad.',
        en:'Three samples reviewed. Mass and volume are shared out when you cut; density, melting temperature and colour stay put no matter how the amount changes.'
      }));
      return;
    }
    locked = false; tries = 0; cut = 0; tag = ['', '', '', '', ''];
    elB.textContent = L({ es:'Comprobar', en:'Check' });
    elB.className = 'gw-btn';
    draw();
    say(host, '', L({ es:'Nueva muestra. Vuelve a cortarla y marca cada renglón.', en:'New sample. Cut it again and mark every row.' }));
  }

  function reveal(){
    locked = true;
    tag = KEY.slice();
    elB.textContent = rd === 2 ? L({ es:'Terminar', en:'Finish' }) : L({ es:'Siguiente muestra', en:'Next sample' });
    elB.className = 'gw-btn solved';
    draw();
  }

  function check(){
    if (done) return;
    if (locked){ advance(); return; }
    var s = R[rd], i, bad = -1;
    for (i = 0; i < 5; i++){ if (tag[i] !== KEY[i]){ bad = i; break; } }
    if (bad === -1){
      locked = true;
      elB.textContent = rd === 2 ? L({ es:'Terminar', en:'Finish' }) : L({ es:'Siguiente muestra', en:'Next sample' });
      elB.className = 'gw-btn solved';
      draw();
      say(host, 'good', L({
        es:'Los cinco renglones quedaron bien. Solo los dos primeros se movieron al cambiar la cantidad de ' + L(s).toLowerCase() + '.',
        en:'All five rows are right. Only the first two moved when the amount of ' + L(s).toLowerCase() + ' changed.'
      }));
      return;
    }
    tries++;
    if (tries >= 3){
      reveal();
      say(host, 'warm', L({
        es:'Así queda la tabla: masa y volumen dependen de la cantidad, densidad, temperatura de fusión y color no.',
        en:'This is how the table looks: mass and volume depend on the amount, density, melting temperature and colour do not.'
      }));
      return;
    }
    if (cut === 0){
      say(host, 'warm', L({
        es:'Todavía tienes la muestra completa. Córtala o duplícala primero y fíjate en qué números se mueven.',
        en:'You still have the whole sample. Cut it or double it first and watch which numbers move.'
      }));
      return;
    }
    var a = vals(s, V0), b = vals(s, V0 * CUTS[cut].f);
    if (KEY[bad] === 'ext'){
      say(host, 'miss', L({
        es:'Mira ese renglón: pasó de ' + a[bad] + ' a ' + b[bad] + ' cuando cambiaste la cantidad. Ese número sí responde al tamaño de la muestra.',
        en:'Look at that row: it went from ' + a[bad] + ' to ' + b[bad] + ' when you changed the amount. That number does respond to the size of the sample.'
      }));
    } else {
      say(host, 'miss', L({
        es:'Ese renglón sigue marcando ' + b[bad] + ' con la muestra completa y con el trozo. Si el número no se mueve, no depende de la cantidad.',
        en:'That row still reads ' + b[bad] + ' with the whole sample and with the piece. If the number does not move, it does not depend on the amount.'
      }));
    }
  }

  elC.addEventListener('click', function(ev){
    var b = ev.target.closest('[data-c]');
    if (!b || done) return;
    cut = parseInt(b.getAttribute('data-c'), 10);
    draw();
  });
  elR.addEventListener('click', function(ev){
    var b = ev.target.closest('[data-i]');
    if (!b || locked || done) return;
    var i = parseInt(b.getAttribute('data-i'), 10);
    tag[i] = tag[i] === '' ? 'ext' : (tag[i] === 'ext' ? 'int' : '');
    draw();
  });
  elB.addEventListener('click', check);
  draw();
  say(host, '', L({ es:'Empieza por cortar la muestra y observa la columna de la derecha.', en:'Start by cutting the sample and watch the right hand column.' }));
}

/* ==========================================================================
   MANIPULATIVO 2 :: laboratorio de identificacion por densidad
   ========================================================================== */
function w2(rng, host){
  var R = shuffle(SUS, rng).slice(0, 3);
  var VOLS = [20, 25, 30, 40, 50];
  var rd = 0, tries = 0, locked = false, done = false;
  var gotM = false, gotV = false, sel = '', vol = 0, mass = 0;

  var TOOLS = [
    { k:'bal', es:'Balanza',  en:'Balance' },
    { k:'pro', es:'Probeta con agua', en:'Graduated cylinder with water' },
    { k:'ter', es:'Termómetro', en:'Thermometer' },
    { k:'cro', es:'Cronómetro', en:'Stopwatch' }
  ];

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Laboratorio de identificación', en:'Identification laboratory' }) + '</div>' +
    '<div class="gw-q" data-r="ttl"></div>' +
    '<div class="gw-mini">' + L({
      es:'Toca los instrumentos para tomar datos de la muestra sin etiqueta y después decide de qué material es.',
      en:'Tap the instruments to collect data from the unlabelled sample and then decide which material it is.'
    }) + '</div>' +
    '<div class="gw-grid" data-r="tools"></div>' +
    '<div class="gw-read" data-r="read"></div>' +
    '<div class="gw-lbl">' + L({ es:'Materiales de referencia', en:'Reference materials' }) + '</div>' +
    '<div class="gw-grid" data-r="subs"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Identificar', en:'Identify' }) + '</button></div>' +
    '<div class="gw-fb"></div>';

  var elT = host.querySelector('[data-r="ttl"]'),
      elI = host.querySelector('[data-r="tools"]'),
      elD = host.querySelector('[data-r="read"]'),
      elS = host.querySelector('[data-r="subs"]'),
      elB = host.querySelector('[data-r="chk"]');

  function roundData(){
    vol = pk(rng, VOLS);
    mass = r1(R[rd].d * vol);
    gotM = false; gotV = false; sel = ''; tries = 0; locked = false;
  }

  function dens(){ return (gotM && gotV) ? r1(mass / vol) : null; }

  function draw(){
    elT.innerHTML = L({ es:'Muestra sin etiqueta número ', en:'Unlabelled sample number ' }) + (rd + 1);
    elI.innerHTML = TOOLS.map(function(o){
      var used = (o.k === 'bal' && gotM) || (o.k === 'pro' && gotV);
      return '<button class="gw-tile' + (used ? ' on' : '') + '" data-k="' + o.k + '"' + (done ? ' disabled' : '') + '>' + L(o) + '</button>';
    }).join('');
    var d = dens();
    elD.innerHTML =
      '<div class="gw-rd"><div class="k">' + L({ es:'Masa', en:'Mass' }) + '</div><div class="v">' + (gotM ? fmt(mass) + ' g' : '?') + '</div></div>' +
      '<div class="gw-rd"><div class="k">' + L({ es:'Volumen', en:'Volume' }) + '</div><div class="v">' + (gotV ? fmt(vol) + ' cm³' : '?') + '</div></div>' +
      '<div class="gw-rd"><div class="k">' + L({ es:'Densidad', en:'Density' }) + '</div><div class="v">' + (d === null ? '?' : fmt(d) + ' g/cm³') + '</div></div>';
    elS.innerHTML = SUS.map(function(o){
      return '<button class="gw-tile' + (sel === o.k ? ' on' : '') + '" data-s="' + o.k + '"' + (locked || done ? ' disabled' : '') + '>' + L(o) + '<small>' + fmt(o.d) + ' g/cm³</small></button>';
    }).join('');
  }

  function advance(){
    rd++;
    if (rd >= 3){
      done = true;
      elB.textContent = L({ es:'Completado', en:'Completed' });
      elB.className = 'gw-btn solved';
      draw();
      say(host, 'good', L({
        es:'Tres muestras identificadas. Una balanza sola no distingue materiales; junto con la probeta sí, porque el cociente entre masa y volumen es distinto para cada sustancia.',
        en:'Three samples identified. A balance alone does not tell materials apart; together with the cylinder it does, because the ratio of mass to volume is different for each substance.'
      }));
      return;
    }
    roundData();
    elB.textContent = L({ es:'Identificar', en:'Identify' });
    elB.className = 'gw-btn';
    draw();
    say(host, '', L({ es:'Llega otra muestra sin etiqueta. Vuelve a medir.', en:'Another unlabelled sample arrives. Measure again.' }));
  }

  function close(cls, txt){
    locked = true;
    elB.textContent = rd === 2 ? L({ es:'Terminar', en:'Finish' }) : L({ es:'Siguiente muestra', en:'Next sample' });
    elB.className = 'gw-btn solved';
    draw();
    say(host, cls, txt);
  }

  function check(){
    if (done) return;
    if (locked){ advance(); return; }
    var d = dens(), tgt = R[rd], i, chosen = null;
    if (d === null){
      say(host, 'warm', L({
        es:'Te falta una medición. Sin masa y sin volumen no aparece el dato que identifica al material.',
        en:'A measurement is missing. Without mass and volume the figure that identifies the material does not appear.'
      }));
      return;
    }
    if (!sel){
      say(host, 'warm', L({ es:'Ya tienes el dato. Ahora elige un material de la lista de referencia.', en:'You have the figure now. Choose a material from the reference list.' }));
      return;
    }
    for (i = 0; i < SUS.length; i++) if (SUS[i].k === sel) chosen = SUS[i];
    if (chosen.k === tgt.k){
      close('good', L({
        es:'Correcto: ' + fmt(mass) + ' g repartidos en ' + fmt(vol) + ' cm³ dan ' + fmt(d) + ' g/cm³, el valor del ' + L(tgt).toLowerCase() + '.',
        en:'Correct: ' + fmt(mass) + ' g spread over ' + fmt(vol) + ' cm³ give ' + fmt(d) + ' g/cm³, the value for ' + L(tgt).toLowerCase() + '.'
      }));
      return;
    }
    tries++;
    if (tries >= 3){
      sel = tgt.k;
      close('warm', L({
        es:'La muestra era de ' + L(tgt).toLowerCase() + ': su densidad de referencia es ' + fmt(tgt.d) + ' g/cm³ y el dato medido fue ' + fmt(d) + ' g/cm³.',
        en:'The sample was ' + L(tgt).toLowerCase() + ': its reference density is ' + fmt(tgt.d) + ' g/cm³ and the measured figure was ' + fmt(d) + ' g/cm³.'
      }));
      return;
    }
    if (d > chosen.d){
      say(host, 'miss', L({
        es:'Tu dato medido, ' + fmt(d) + ' g/cm³, es mayor que el del ' + L(chosen).toLowerCase() + '. Busca un material más denso en la lista.',
        en:'Your measured figure, ' + fmt(d) + ' g/cm³, is larger than that of ' + L(chosen).toLowerCase() + '. Look for a denser material in the list.'
      }));
    } else {
      say(host, 'miss', L({
        es:'Tu dato medido, ' + fmt(d) + ' g/cm³, es menor que el del ' + L(chosen).toLowerCase() + '. Busca un material menos denso en la lista.',
        en:'Your measured figure, ' + fmt(d) + ' g/cm³, is smaller than that of ' + L(chosen).toLowerCase() + '. Look for a less dense material in the list.'
      }));
    }
  }

  elI.addEventListener('click', function(ev){
    var b = ev.target.closest('[data-k]');
    if (!b || done) return;
    var k = b.getAttribute('data-k');
    if (k === 'bal'){
      gotM = true; draw();
      say(host, '', L({ es:'La balanza marca ' + fmt(mass) + ' g.', en:'The balance reads ' + fmt(mass) + ' g.' }));
    } else if (k === 'pro'){
      gotV = true; draw();
      say(host, '', L({ es:'Al sumergir la muestra el agua sube ' + fmt(vol) + ' cm³: ese es su volumen.', en:'When the sample is submerged the water rises ' + fmt(vol) + ' cm³: that is its volume.' }));
    } else if (k === 'ter'){
      say(host, 'warm', L({
        es:'El termómetro marca la temperatura del laboratorio, la misma para todas las muestras. Ese dato no distingue un material de otro.',
        en:'The thermometer shows the laboratory temperature, the same for every sample. That figure does not tell one material from another.'
      }));
    } else {
      say(host, 'warm', L({
        es:'El cronómetro mide tiempo. Aquí no hay nada que dure más por ser de un material o de otro.',
        en:'The stopwatch measures time. Nothing here lasts longer for being one material or another.'
      }));
    }
  });
  elS.addEventListener('click', function(ev){
    var b = ev.target.closest('[data-s]');
    if (!b || locked || done) return;
    sel = b.getAttribute('data-s');
    draw();
  });
  elB.addEventListener('click', check);
  roundData();
  draw();
  say(host, '', L({ es:'Toma los datos que necesites antes de decidir.', en:'Collect the data you need before deciding.' }));
}

/* ==========================================================================
   MANIPULATIVO 3 :: arma la hipotesis con piezas

function w3(rng, host){
  var CASES = [
    { act:{ es:'corto en dos partes iguales un terrón de azúcar', en:'I cut a sugar cube into two equal parts' },
      prop:{ es:'la masa de cada parte', en:'the mass of each part' }, ch:1, kind:'ext',

      why:{ es:'Al juntar, masa y volumen crecen en la misma proporción, así que la densidad se mantiene: es intensiva.',
            en:'When pouring together, mass and volume grow in the same proportion, so density holds: it is intensive.' } },
    { act:{ es:'tomo una sola gota de un frasco de alcohol', en:'I take a single drop from a bottle of alcohol' },
      prop:{ es:'la temperatura de ebullición', en:'the boiling temperature' }, ch:0, kind:'int',
      why:{ es:'La gota hierve a la misma temperatura que el frasco lleno: esa propiedad no depende de la cantidad.',

    { act:{ es:'lleno hasta el borde una probeta que estaba a la mitad', en:'I fill to the brim a cylinder that was half full' },
      prop:{ es:'el volumen del líquido', en:'the volume of the liquid' }, ch:1, kind:'ext',
      why:{ es:'El volumen mide cuánto espacio ocupa la muestra, así que crece con la cantidad: es extensiva.',

    { act:{ es:'parto por la mitad una barra de plomo', en:'I break a lead bar in half' },
      prop:{ es:'la temperatura de fusión', en:'the melting temperature' }, ch:0, kind:'int',

  var rd = 0, tries = 0, locked = false, done = false, ch = -1, kd = '';

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Arma la hipótesis', en:'Build the hypothesis' }) + '</div>' +
    '<div class="gw-mini">' + L({

    '<div class="gw-sent" data-r="sent"></div>' +
    '<div class="gw-lbl">' + L({ es:'Qué le pasa a la propiedad', en:'What happens to the property' }) + '</div>' +
    '<div class="gw-grid" data-r="ch"></div>' +
    '<div class="gw-lbl">' + L({ es:'Cómo se llama esa propiedad', en:'What that property is called' }) + '</div>' +
    '<div class="gw-grid" data-r="kd"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Comprobar', en:'Check' }) + '</button></div>' +
    '<div class="gw-fb"></div>';

  var elS = host.querySelector('[data-r="sent"]'),

      elK = host.querySelector('[data-r="kd"]'),

  function blank(txt){ return '<span class="gw-bl">' + txt + '</span>'; }

  function draw(){

    var p2 = kd === '' ? blank(L({ es:'(elige)', en:'(choose)' })) : '<b>' + L(kd === 'ext' ? KD[0] : KD[1]) + '</b>';
    elS.innerHTML =

    elC.innerHTML = CH.map(function(o, i){

    }).join('');
    elK.innerHTML = KD.map(function(o){
      return '<button class="gw-tile' + (kd === o.k ? ' on' : '') + '" data-k="' + o.k + '"' + (locked || done ? ' disabled' : '') + '>' + L(o) + '</button>';

  function check(){

    if (locked){ advance(); return; }
    var c = R[rd];
    if (ch === -1 || kd === ''){
      say(host, 'warm', L({ es:'Aún falta una pieza de la frase.', en:'A piece of the sentence is still missing.' }));
      return;
    }
    if (ch === c.ch && kd === c.kind){ close('good', L(c.why)); return; }
    tries++;
    if (tries >= 3){
      ch = c.ch; kd = c.kind;
      close('warm', L({ es:'Así queda la hipótesis. ', en:'This is how the hypothesis reads. ' }) + L(c.why));
      return;
    }
    if (ch === c.ch){
      say(host, 'miss', L({
        es:'La primera parte concuerda con lo que pasaría. Revisa el nombre: si el valor responde a la cantidad de materia, no puede llamarse igual que si no responde.',

      }));

      say(host, 'miss', L({
        es:'El nombre está bien elegido, pero la frase se contradice: revisa qué le pasa a la propiedad cuando cambia la cantidad.',
        en:'The name is well chosen, but the sentence contradicts itself: check what happens to the property when the amount changes.'
      }));
    } else {
      say(host, 'miss', L({
        es:'Imagina la situación con números: pregúntate si ese valor se repartiría, se sumaría o se quedaría igual.',
        en:'Picture the situation with numbers: ask yourself whether that value would be shared out, added up or stay the same.'
      }));
    }
  }

  elC.addEventListener('click', function(ev){
    var b = ev.target.closest('[data-c]');
    if (!b || locked || done) return;
    ch = parseInt(b.getAttribute('data-c'), 10);
    draw();
  });
  elK.addEventListener('click', function(ev){
    var b = ev.target.closest('[data-k]');
    if (!b || locked || done) return;
    kd = b.getAttribute('data-k');
    draw();
  });
  elB.addEventListener('click', check);
  draw();
  say(host, '', L({ es:'Completa la frase y compruébala.', en:'Complete the sentence and check it.' }));
}

/* ==========================================================================
   MANIPULATIVO 4 :: equilibra la balanza cambiando el volumen
   ========================================================================== */
function w4(rng, host){
  var rd = 0, tries = 0, locked = false, done = false;
  var A = null, B = null, vB = 0, vA = 0, tgt = 0;

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Equilibra la balanza', en:'Balance the scale' }) + '</div>' +
    '<div class="gw-q" data-r="ttl"></div>' +
    '<div class="gw-mini">' + L({
      es:'Mueve el control para cambiar el volumen del lado izquierdo hasta que los dos platos queden parejos, con menos de 2 g de diferencia.',
      en:'Move the control to change the volume on the left side until both pans are level, with less than 2 g of difference.'
    }) + '</div>' +
    '<div class="gw-bal">' +
      '<div class="gw-post"></div><div class="gw-base"></div>' +
      '<div class="gw-beam" data-r="beam">' +
        '<div class="gw-pan lft"><div class="gw-pd"></div><div class="gw-pl" data-r="pl"></div></div>' +
        '<div class="gw-pan rgt"><div class="gw-pd"></div><div class="gw-pl" data-r="pr"></div></div>' +
      '</div>' +
    '</div>' +
    '<input class="gw-rng" type="range" min="4" max="120" step="1" value="40" data-r="rng">' +
    '<div class="gw-read" data-r="read"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Comprobar', en:'Check' }) + '</button></div>' +
    '<div class="gw-fb"></div>';

  var elT = host.querySelector('[data-r="ttl"]'),
      elBm = host.querySelector('[data-r="beam"]'),
      elPl = host.querySelector('[data-r="pl"]'),
      elPr = host.querySelector('[data-r="pr"]'),
      elRg = host.querySelector('[data-r="rng"]'),
      elRd = host.querySelector('[data-r="read"]'),
      elB = host.querySelector('[data-r="chk"]');

  function roundData(){
    var i = 0, ok = false;
    while (i < 60 && !ok){
      var sh = shuffle(SUS, rng);
      A = sh[0]; B = sh[1];
      vB = ri(rng, 18, 70);
      tgt = r1(B.d * vB / A.d);
      ok = (A.k !== B.k && tgt >= 8 && tgt <= 116);
      i++;
    }
    vA = ri(rng, 8, 110);
    tries = 0; locked = false;
    elRg.value = String(vA);
  }

  function mA(){ return r1(A.d * vA); }
  function mB(){ return r1(B.d * vB); }

  function draw(){
    var a = mA(), b = mB(), diff = a - b;
    var ang = Math.max(-9, Math.min(9, (b - a) / Math.max(b, 1) * 9));
    elT.innerHTML = L({ es:'Izquierda: ', en:'Left: ' }) + L(A).toLowerCase() + L({ es:'  ·  derecha: ', en:'  ·  right: ' }) + L(B).toLowerCase();
    elBm.style.transform = 'rotate(' + fmt(ang) + 'deg)';
    elPl.innerHTML = L(A) + '<br>' + fmt(vA) + ' cm³';
    elPr.innerHTML = L(B) + '<br>' + fmt(vB) + ' cm³';
    elRd.innerHTML =
      '<div class="gw-rd"><div class="k">' + L({ es:'Masa izquierda', en:'Left mass' }) + '</div><div class="v">' + fmt(a) + ' g</div></div>' +
      '<div class="gw-rd"><div class="k">' + L({ es:'Masa derecha', en:'Right mass' }) + '</div><div class="v">' + fmt(b) + ' g</div></div>' +
      '<div class="gw-rd"><div class="k">' + L({ es:'Diferencia', en:'Difference' }) + '</div><div class="v">' + fmt(Math.abs(diff)) + ' g</div></div>';
    elRg.disabled = locked || done;
  }

  function advance(){
    rd++;
    if (rd >= 3){
      done = true;
      elB.textContent = L({ es:'Completado', en:'Completed' });
      elB.className = 'gw-btn solved';
      draw();
      say(host, 'good', L({
        es:'Tres equilibrios logrados. Dos materiales distintos igualan su masa con volúmenes distintos, y quien manda en esa relación es la densidad de cada uno.',
        en:'Three balances achieved. Two different materials match their mass with different volumes, and what rules that relation is the density of each one.'
      }));
      return;
    }
    roundData();
    elB.textContent = L({ es:'Comprobar', en:'Check' });
    elB.className = 'gw-btn';
    draw();
    say(host, '', L({ es:'Otra pareja de materiales. Vuelve a equilibrar.', en:'Another pair of materials. Balance it again.' }));
  }

  function check(){
    if (done) return;
    if (locked){ advance(); return; }
    var diff = mA() - mB();
    if (Math.abs(diff) < 2){
      locked = true;
      elB.textContent = rd === 2 ? L({ es:'Terminar', en:'Finish' }) : L({ es:'Siguiente pareja', en:'Next pair' });
      elB.className = 'gw-btn solved';
      draw();
      say(host, 'good', L({
        es:'Equilibrada. Con ' + fmt(vA) + ' cm³ de ' + L(A).toLowerCase() + ' se iguala la masa de ' + fmt(vB) + ' cm³ de ' + L(B).toLowerCase() + ', porque cada material carga distinta masa en cada centímetro cúbico.',
        en:'Balanced. With ' + fmt(vA) + ' cm³ of ' + L(A).toLowerCase() + ' you match the mass of ' + fmt(vB) + ' cm³ of ' + L(B).toLowerCase() + ', because each material carries a different mass in every cubic centimetre.'
      }));
      return;
    }
    tries++;
    if (tries >= 3){
      vA = Math.round(tgt);
      elRg.value = String(vA);
      locked = true;
      elB.textContent = rd === 2 ? L({ es:'Terminar', en:'Finish' }) : L({ es:'Siguiente pareja', en:'Next pair' });
      elB.className = 'gw-btn solved';
      draw();
      say(host, 'warm', L({
        es:'El punto de equilibrio está cerca de ' + fmt(Math.round(tgt)) + ' cm³ de ' + L(A).toLowerCase() + '. Fíjate en cuál de los dos materiales necesita más volumen para la misma masa.',
        en:'The balance point is near ' + fmt(Math.round(tgt)) + ' cm³ of ' + L(A).toLowerCase() + '. Notice which of the two materials needs more volume for the same mass.'
      }));
      return;
    }
    say(host, 'miss', diff > 0
      ? L({ es:'El plato izquierdo baja por ' + fmt(Math.abs(diff)) + ' g de más. Reduce el volumen de la izquierda.', en:'The left pan drops by an extra ' + fmt(Math.abs(diff)) + ' g. Reduce the volume on the left.' })
      : L({ es:'El plato derecho baja por ' + fmt(Math.abs(diff)) + ' g de más. Aumenta el volumen de la izquierda.', en:'The right pan drops by an extra ' + fmt(Math.abs(diff)) + ' g. Increase the volume on the left.' }));
  }

  elRg.addEventListener('input', function(){
    if (locked || done) return;
    vA = parseInt(elRg.value, 10);
    draw();
    var diff = mA() - mB();
    if (Math.abs(diff) < 2){
      say(host, 'warm', L({ es:'Los platos se ven parejos. Comprueba para confirmarlo.', en:'The pans look level. Check to confirm it.' }));
    } else if (diff > 0){
      say(host, '', L({ es:'La izquierda pesa ' + fmt(Math.abs(diff)) + ' g de más.', en:'The left side weighs ' + fmt(Math.abs(diff)) + ' g more.' }));
    } else {
      say(host, '', L({ es:'La derecha pesa ' + fmt(Math.abs(diff)) + ' g de más.', en:'The right side weighs ' + fmt(Math.abs(diff)) + ' g more.' }));
    }
  });
  elB.addEventListener('click', check);
  roundData();
  draw();
  say(host, '', L({ es:'Mueve el control y observa cómo se inclina la balanza.', en:'Move the control and watch how the scale tips.' }));
}

    L({ es:'De la sospecha a la hipótesis', en:'From a hunch to a hypothesis' }),
    '<p>' + L({
      es:'En ciencia una sospecha se vuelve útil cuando se escribe como hipótesis: una afirmación que anticipa qué pasará y que puede resultar falsa al medirla. La forma más práctica es decir qué se va a cambiar, qué se va a observar y qué se espera del resultado.',
      en:'In science a hunch becomes useful when it is written as a hypothesis: a statement that anticipates what will happen and that can turn out false when measured. The most practical form is to say what will be changed, what will be observed and what is expected of the result.'

    '<div class="callout"><p>' + L({
      es:'Para distinguir propiedades, lo que se cambia siempre es la cantidad de muestra y lo que se observa es el valor de la propiedad. Si el valor se mueve, la hipótesis apuntaba a una propiedad extensiva; si se queda quieto, a una intensiva.',
      en:'To tell properties apart, what is changed is always the amount of sample and what is observed is the value of the property. If the value moves, the hypothesis pointed at an extensive property; if it stays put, at an intensive one.'
    }) + '</p></div>'
  );

  addProblem(rng, mkP5(rng));

    '<p>' + L({
      es:'Ningún instrumento por sí solo dice qué sustancia tienes enfrente. La balanza sola informa masa, y dos materiales muy distintos pueden marcar lo mismo si se toman en cantidades convenientes. La identificación aparece cuando se combinan mediciones hasta obtener una propiedad intensiva.',
      en:'No instrument on its own tells you which substance you have in front of you. The balance alone reports mass, and two very different materials can read the same if convenient amounts are taken. Identification appears when measurements are combined until an intensive property is obtained.'
    }) + '</p>' +
    '<div class="rules-grid">' +

      rcard(L({ es:'Termómetro', en:'Thermometer' }), L({ es:'fusión y ebullición', en:'melting and boiling' }), L({ es:'dato intensivo', en:'intensive figure' })) +

  /* CIERRE */

    L({ es:'Todo junto', en:'All together' }),
    '<p>' + L({
      es:'Las dos últimas situaciones mezclan lo que se reparte, lo que se conserva y lo que se concluye después de medir. Anota tus pasos antes de elegir.',
      en:'The last two situations mix what is shared out, what is kept and what is concluded after measuring. Write down your steps before choosing.'
    }) + '</p>'
  );

}

      opts:{ es:['La densidad del azúcar','La masa del contenido','El volumen que ocupa','El número de cucharadas que rinde'],

      opts:{ es:['El volumen que ocupa','La densidad del jabón','El color del jabón','La temperatura a la que se funde'],
             en:['The volume it takes up','The density of the soap','The colour of the soap','The temperature at which it melts'] }, ci:0,
      hint:{ es:'Solo una de las cuatro cambia según qué tanto material tomaste de la barra.',
             en:'Only one of the four changes according to how much material you took from the bar.' },

            en:'Cutting shares out the material and the piece takes up less space, so the volume changes. Density, colour and melting temperature remain those of the substance.' } },
    { title:{ es:'Agua del mismo garrafón', en:'Water from the same jug' },

  ];
  var v = V[Math.floor(rng() * V.length)];
  return { title:L(v.title), q:L(v.q), fn:'', options:L(v.opts), correct:v.ci, hint:L(v.hint), exp:L(v.exp), showWork:false };

function mkP2(rng){
  var s = Math.floor(rng() * 3);
  if (s === 0){
    var base = 10 * ri(rng, 5, 12);
    var k = pk(rng, [3, 4, 5]);
    var M = base * k;
    return {
      title:L({ es:'El lingote cortado', en:'The cut ingot' }),
      q:L({ es:'Un lingote de latón con masa de ' + M + ' g se corta en ' + k + ' trozos iguales. ¿Cuántos gramos de masa tiene cada trozo?',
            en:'A brass ingot with a mass of ' + M + ' g is cut into ' + k + ' equal pieces. How many grams of mass does each piece have?' }),
      fn:'',
      options:opts4(rng, base, [M, M / 2, base / 2, M - base]),
      correct:0,
      hint:L({ es:'La masa es extensiva: se reparte por igual entre los trozos, así que hay que repartir el total entre el número de trozos.',
               en:'Mass is extensive: it is shared equally among the pieces, so the total must be shared among the number of pieces.' }),
      exp:L({ es:'La masa se reparte al cortar porque es una propiedad extensiva, mientras que la densidad del latón sigue igual en cada trozo. Reparto: ' + M + ' ÷ ' + k + ' = ' + base,

  if (s === 1){
    var b = 10 * ri(rng, 4, 11);

      exp:L({ es:'La masa es extensiva y se acumula al juntar las muestras, aunque la densidad del metal no cambie: ' + n + ' × ' + b + ' = ' + tot,

      showWork:true

    fn:'',
    options:opts4(rng, tot3, [P, 2 * P, 4 * P, P + P / 2]),
    correct:0,
    hint:L({ es:'La masa se repartió en tres partes iguales, así que la barra completa contiene tres veces la masa del trozo.',
             en:'The mass was shared into three equal parts, so the whole bar holds three times the mass of the piece.' }),
    exp:L({ es:'Como la masa es extensiva, la barra reúne las tres partes iguales: 3 × ' + P + ' = ' + tot3,
            en:'Since mass is extensive, the bar gathers the three equal parts: 3 × ' + P + ' = ' + tot3 }),
    showWork:true

    q:L({ es:'Se vacían dos vasos de agua, los dos a ' + T + ' °C, dentro de una misma jarra. ¿Cuántos grados Celsius marca el termómetro en la jarra?',
          en:'Two glasses of water, both at ' + T + ' °C, are emptied into one jug. How many degrees Celsius does the thermometer read in the jug?' }),
    fn:'',
    options:opts4(rng, T, cands),
    correct:0,
    hint:L({ es:'Al juntar se suman las propiedades extensivas. La temperatura no es una de ellas.',
             en:'Putting together adds up extensive properties. Temperature is not one of them.' }),
    exp:L({ es:'El volumen y la masa se suman al juntar el agua, pero la temperatura es intensiva y no se acumula: la jarra queda igual que los vasos = ' + T,
            en:'Volume and mass add up when the water is combined, but temperature is intensive and does not build up: the jug stays the same as the glasses = ' + T }),
    showWork:true
  };
}
