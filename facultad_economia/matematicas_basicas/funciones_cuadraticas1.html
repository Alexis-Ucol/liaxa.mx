/* ════════════════════════════════════════════════════════════════════════
   WIDGET 3 · Feature sorter (MODE C · the tap is the submission)
   ════════════════════════════════════════════════════════════════════════ */
function wSort(host, items) {
  var CATS = [
    { k: 'max',  t: B('Maximum (vertex)', 'Máximo (vértice)') },
    { k: 'min',  t: B('Minimum (vertex)', 'Mínimo (vértice)') },
    { k: 'zero', t: B('Zero', 'Cero') },
    { k: 'init', t: B('Initial value', 'Valor inicial') }
  ];
  var st = WSTATE.classify || (WSTATE.classify = { i: 0, tries: 0, phase: 'ask', fb: null, wrong: {}, done: false });
  var tok = 0;
  function catName(k) { var c = CATS.filter(function(z) { return z.k === k; })[0]; return L(c.t); }
  function step(withCheckpoint) {
    if (withCheckpoint) checkpoint('feature-sorter', st.i, 'round');
    st.i++; st.tries = 0; st.wrong = {}; st.phase = 'ask'; st.fb = null;
    if (st.i >= items.length) st.done = true;
  }
  if (st.phase === 'shown') step(false);   /* session restored during the pause after an answer */
  function later(ms) {
    var mine = ++tok;
    setTimeout(function() {
      if (mine !== tok || st.phase !== 'shown') return;
      step(true); saveSession(); render();
      if (st.done) applyLocks();
    }, ms);
  }
  function render() {
    if (st.done) {
      host.innerHTML =
        '<div class="iw-head"><span class="iw-tag">' + L(B('Complete', 'Completa')) + '</span><span class="iw-title">' + L(B('Feature sorter', 'Clasificador de rasgos')) + '</span></div>' +
        '<div class="iw-fb good">' + L(B(
          '✓ You sorted ' + items.length + ' cases. Direction, vertex, zeros and initial value are the four readings an analyst takes from any quadratic model.',
          '✓ Clasificaste ' + items.length + ' casos. Dirección, vértice, ceros y valor inicial son las cuatro lecturas que un analista hace de cualquier modelo cuadrático.')) + '</div>';
      return;
    }
    var it = items[st.i];
    host.innerHTML =
      '<div class="iw-head"><span class="iw-tag">' + L(B('Case', 'Caso')) + ' ' + (st.i + 1) + '/' + items.length + '</span>' +
        '<span class="iw-title">' + L(B('Feature sorter', 'Clasificador de rasgos')) + '</span></div>' +
      '<div class="iw-sub">' + L(B('Read the case and tap the feature of the parabola it describes.', 'Lee el caso y toca el rasgo de la parábola que describe.')) + '</div>' +
      '<div class="scenario-box">' + L(it.t) + '</div>' +
      '<div class="shape-grid">' + CATS.map(function(c) {
        var cls = 'shape-btn', dis = '';
        if (st.phase === 'shown') { dis = ' disabled'; if (c.k === it.k) cls += ' shape-correct'; }
        else if (st.wrong[c.k]) { cls += ' shape-wrong'; dis = ' disabled'; }
        return '<button class="' + cls + '" data-k="' + c.k + '"' + dis + '>' + L(c.t) + '</button>';
      }).join('') + '</div>' +
      '<div class="iw-fb"></div>';
    if (st.fb) {
      var m = st.fb.id === 'why' ? '✓ ' + L(it.why)
            : st.fb.id === 'reveal' ? L(B('The feature is <strong>' + catName(it.k) + '</strong>. ', 'El rasgo es <strong>' + catName(it.k) + '</strong>. ')) + L(it.why)
            : L(it.hint);
      say(host, st.fb.cls, m);
    }
    host.querySelectorAll('.shape-btn').forEach(function(btn) {
      btn.onclick = function() {
        if (st.phase !== 'ask') return;
        var k = btn.getAttribute('data-k');
        if (k === it.k) { st.phase = 'shown'; st.fb = { cls: 'good', id: 'why' }; render(); later(2600); return; }
        st.tries++; st.wrong[k] = 1;
        if (st.tries >= 3) { st.phase = 'shown'; st.fb = { cls: 'warm', id: 'reveal' }; render(); later(4500); return; }
        st.fb = { cls: 'miss', id: 'hint' };
        render();
      };
    });
  }
  widgets.push(render); render();
}

/* ════════════════════════════════════════════════════════════════════════
   WIDGET 4 · Summit finder (MODE B · calculate, then Check)
   ════════════════════════════════════════════════════════════════════════ */
function wSummit(host, rounds) {
  var st = WSTATE.vertex || (WSTATE.vertex = { i: 0, x: '', r: '', tries: 0, phase: 'input', fb: null, lastX: null, rev: false, done: false });
  var animT = 1, animId = 0;
  function cur() { return rounds[Math.min(st.i, rounds.length - 1)]; }
  function msg(id) {
    var cs = cur().cs, lx = st.lastX;
    if (id === 'empty') return L(B('Enter both values before checking.', 'Escribe ambos valores antes de verificar.'));
    if (id === 'low') return L(B(
      'At ' + MN(lx) + ' revenue is still rising, so the summit is at a higher price. Recheck the values of a and b that you used in the vertex formula.',
      'En ' + MN(lx) + ' el ingreso todavía sube, así que la cima está en un precio más alto. Revisa los valores de a y b que usaste en la fórmula del vértice.'));
    if (id === 'high') return L(B(
      'At ' + MN(lx) + ' revenue is already falling, so the summit is at a lower price. Check whether you divided by 2a and not only by a.',
      'En ' + MN(lx) + ' el ingreso ya va bajando, así que la cima está en un precio más bajo. Revisa si dividiste entre 2a y no solo entre a.'));
    if (id === 'rv') return L(B(
      'Your price is at the summit. Now evaluate the revenue function at that price, taking care to square before you multiply.',
      'Tu precio está en la cima. Ahora evalúa la función de ingreso en ese precio, cuidando elevar al cuadrado antes de multiplicar.'));
    if (id === 'reveal') return L(B(
      'With a = −' + cs.n + ' and b = ' + N(cs.m) + ', the vertex is at ' + VX + ' = ' + frac('−' + N(cs.m), '2(−' + cs.n + ')') + ' = ' + cs.xr + ', and R(' + cs.xr + ') = ' + MN(cs.rmax) + '. Follow each step before you continue.',
      'Con a = −' + cs.n + ' y b = ' + N(cs.m) + ', el vértice está en ' + VX + ' = ' + frac('−' + N(cs.m), '2(−' + cs.n + ')') + ' = ' + cs.xr + ', y R(' + cs.xr + ') = ' + MN(cs.rmax) + '. Sigue cada paso antes de continuar.'));
    if (id === 'done') return L(B(
      '✓ Three summits reached. The vertex formula found each best price exactly, with no table and no trial and error.',
      '✓ Tres cimas alcanzadas. La fórmula del vértice encontró cada mejor precio de forma exacta, sin tabla y sin prueba y error.'));
    return L(B(
      '✓ Correct. At ' + MN(cs.xr) + ' the business sells ' + N(cs.m - cs.n * cs.xr) + ' units and earns ' + MN(cs.rmax) + '. Any other price, higher or lower, earns less.',
      '✓ Correcto. En ' + MN(cs.xr) + ' el negocio vende ' + N(cs.m - cs.n * cs.xr) + ' unidades e ingresa ' + MN(cs.rmax) + '. Cualquier otro precio, más alto o más bajo, deja menos.'));
  }
  function draw() {
    var cv = host.querySelector('.sm-cv'); if (!cv) return;
    var cs = cur().cs, solved = (st.phase === 'solved' || st.done);
    function R(x) { return x * (cs.m - cs.n * x); }
    var ys = niceStep(cs.rmax * 1.25, 4), y1 = Math.ceil(cs.rmax * 1.2 / ys) * ys;
    var f = plotFrame(cv, 210, { x0: 0, x1: cs.xmax, xs: xStepFor(cs.xmax, cv), y0: 0, y1: y1, ys: ys, noY: !solved,
      xl: L(B('price', 'precio')), yl: L(B('revenue', 'ingreso')) });
    var ctx = f.ctx, P = f.P;
    if (solved) {
      ctx.strokeStyle = P.green; ctx.lineWidth = 2.5;
      curve(f, R, 0, cs.xmax * animT);
      if (animT >= 1) {
        drawFlag(ctx, f.px(cs.xr), f.py(cs.rmax), P.gold);
        ctx.fillStyle = P.text; ctx.font = '600 11px "IBM Plex Sans", sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(MN(cs.rmax), f.px(cs.xr), f.py(cs.rmax) - 27);
      }
      return;
    }
    if (st.lastX !== null && st.lastX > 0 && st.lastX < cs.xmax) {
      var w = cs.xmax * 0.09, xa = Math.max(0, st.lastX - w), xb = Math.min(cs.xmax, st.lastX + w);
      ctx.strokeStyle = P.green; ctx.lineWidth = 2.5; curve(f, R, xa, xb);
      drawFlag(ctx, f.px(st.lastX), f.py(R(st.lastX)), P.text3);
    } else {
      ctx.fillStyle = P.border; ctx.font = '700 46px "Crimson Pro", serif'; ctx.textAlign = 'center';
      ctx.fillText('?', f.W / 2, f.H / 2 + 6);
    }
  }
  function animate() {
    var mine = ++animId, t0 = null;
    animT = 0;
    function frame(ts) {
      if (mine !== animId) return;
      if (t0 === null) t0 = ts;
      animT = Math.min(1, (ts - t0) / 700);
      draw();
      if (animT < 1) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }
  function render() {
    animId++; animT = 1;
    if (st.done) {
      host.innerHTML =
        '<div class="iw-head"><span class="iw-tag">' + L(B('Complete', 'Completa')) + '</span><span class="iw-title">' + L(B('Summit finder', 'Busca la cima')) + '</span></div>' +
        '<canvas class="iw-canvas sm-cv"></canvas><div class="iw-fb good">' + msg('done') + '</div>';
      draw(); return;
    }
    var rd = cur(), cs = rd.cs, sc = rd.sc, solved = st.phase === 'solved';
    var box = rd.given
      ? L(B(cap(sc.who.en) + ' models its monthly revenue from ' + sc.unit.en + ' as a function of the price ' + VX + ':',
            cap(sc.who.es) + ' modela su ingreso mensual por ' + sc.unit.es + ' en función del precio ' + VX + ':')) +
        '<span class="eq">R(' + VX + ') = ' + quad(-cs.n, cs.m, 0, VX) + '</span>'
      : L(B(cap(sc.who.en) + ' sells ' + VQ + ' ' + sc.unit.en + ' per month at a price of ' + VX + ' pesos. Build the revenue function first:',
            cap(sc.who.es) + ' vende ' + VQ + ' ' + sc.unit.es + ' al mes a un precio de ' + VX + ' pesos. Construye primero la función de ingreso:')) +
        '<span class="eq">' + VQ + ' = ' + N(cs.m) + ' − ' + cs.n + VX + '</span>';
    function fld(cls, label, val, ans) {
      return '<div class="fld"><label>' + label + '</label>' + (solved
        ? '<div class="fld-val' + (st.rev ? ' ft-rev' : '') + '">' + ans + '</div>'
        : '<input class="ft-inp ' + cls + '" type="text" inputmode="numeric" autocomplete="off" placeholder="?" value="' + val + '">') + '</div>';
    }
    host.innerHTML =
      '<div class="iw-head"><span class="iw-tag">' + L(B('Round', 'Ronda')) + ' ' + (st.i + 1) + '/' + rounds.length + '</span>' +
        '<span class="iw-title">' + L(B('Summit finder', 'Busca la cima')) + '</span></div>' +
      '<div class="iw-sub">' + L(B(
        'Calculate the price that maximizes revenue and the maximum revenue, then check. A correct answer plants your flag on the summit of the curve.',
        'Calcula el precio que maximiza el ingreso y el ingreso máximo, y verifica. Una respuesta correcta planta tu bandera en la cima de la curva.')) + '</div>' +
      '<div class="scenario-box">' + box + '</div>' +
      '<div class="fld-grid">' +
        fld('sm-x', L(B('Best price ($)', 'Mejor precio ($)')), st.x, MN(cs.xr)) +
        fld('sm-r', L(B('Maximum revenue ($)', 'Ingreso máximo ($)')), st.r, MN(cs.rmax)) +
      '</div>' +
      '<canvas class="iw-canvas sm-cv"></canvas>' +
      (solved
        ? '<button class="verify-btn next sm-next">' + (st.i === rounds.length - 1 ? L(B('Finish', 'Terminar')) : L(B('Next round', 'Siguiente ronda'))) + '</button>'
        : '<button class="verify-btn sm-check">' + L(B('Check', 'Verificar')) + '</button>') +
      '<div class="iw-fb"></div>';
    if (st.fb) say(host, st.fb.cls, msg(st.fb.id));
    var ix = host.querySelector('.sm-x'), ir = host.querySelector('.sm-r');
    if (ix) ix.addEventListener('input', function() { st.x = ix.value; });
    if (ir) ir.addEventListener('input', function() { st.r = ir.value; });
    var bc = host.querySelector('.sm-check'), bn = host.querySelector('.sm-next');
    if (bc) bc.onclick = verify;
    if (bn) bn.onclick = next;
    draw();
  }
  function verify() {
    var cs = cur().cs, x = numVal(st.x), r = numVal(st.r);
    if (x === null || r === null) { st.fb = { cls: 'warm', id: 'empty' }; render(); return; }
    st.lastX = x;
    if (x === cs.xr && r === cs.rmax) { st.phase = 'solved'; st.rev = false; st.fb = { cls: 'good', id: 'ok' }; render(); animate(); return; }
    st.tries++;
    if (st.tries >= 3) { st.phase = 'solved'; st.rev = true; st.fb = { cls: 'warm', id: 'reveal' }; render(); animate(); return; }
    st.fb = { cls: 'miss', id: x < cs.xr ? 'low' : x > cs.xr ? 'high' : 'rv' };
    render();
    var ix = host.querySelector('.sm-x'), ir = host.querySelector('.sm-r');
    if (ix) ix.classList.add(x === cs.xr ? 'ft-ok' : 'ft-bad');
    if (ir && x === cs.xr) ir.classList.add('ft-bad');
  }
  function next() {
    checkpoint('summit-finder', st.i, 'round');
    st.i++; st.x = ''; st.r = ''; st.tries = 0; st.phase = 'input'; st.fb = null; st.lastX = null; st.rev = false;
    if (st.i >= rounds.length) st.done = true;
    saveSession();
    render();
    if (st.done) applyLocks();
  }
  widgets.push(render); wdraws.push(draw); render();
}

/* ════════════════════════════════════════════════════════════════════════
   WIDGET 5 · Profit zone (MODE B · calculate, then Check)
   ════════════════════════════════════════════════════════════════════════ */
function wZone(host, rounds) {
  var st = WSTATE.zone || (WSTATE.zone = { i: 0, v: { lo: '', hi: '', best: '', pmax: '' }, tries: 0, phase: 'input', fb: null, bad: {}, rev: false, done: false });
  function cur() { return rounds[Math.min(st.i, rounds.length - 1)]; }
  function Pf(pc, x) { return -pc.n * (x - pc.r1) * (x - pc.r2); }
  function msg(id) {
    var rd = cur(), pc = rd.pc;
    if (id === 'empty') return L(B('Enter every value the round asks for before checking.', 'Escribe todos los valores que pide la ronda antes de verificar.'));
    if (id === 'be') {
      var w = st.fb.w, pv = Pf(pc, w);
      return L(B(
        'At ' + MN(w) + ' the profit is ' + MN(pv) + ', not $0. A break-even price makes P(' + VX + ') = 0: solve that quadratic equation.',
        'En ' + MN(w) + ' la utilidad es ' + MN(pv) + ', no $0. Un precio de equilibrio hace que P(' + VX + ') = 0: resuelve esa ecuación cuadrática.'));
    }
    if (id === 'best') return L(B(
      'The break-even prices are right. The best price is the vertex, and the vertex of a parabola lies halfway between its zeros.',
      'Los precios de equilibrio son correctos. El mejor precio es el vértice, y el vértice de una parábola está a la mitad entre sus ceros.'));
    if (id === 'pmax') return L(B(
      'Everything is right except the maximum profit. Evaluate P at the best price, taking care with the negative first term.',
      'Todo es correcto excepto la utilidad máxima. Evalúa P en el mejor precio, cuidando el primer término negativo.'));
    if (id === 'reveal') return L(B(
      'Dividing P(' + VX + ') = 0 by −' + pc.n + ' gives ' + quad(1, -(pc.r1 + pc.r2), pc.r1 * pc.r2, VX) + ' = 0, so ' + VX + ' = ' + pc.r1 + ' or ' + VX + ' = ' + pc.r2 + '. The vertex is halfway, at ' + VX + ' = ' + pc.xp + ', where P = ' + MN(pc.pmax) + '.',
      'Al dividir P(' + VX + ') = 0 entre −' + pc.n + ' queda ' + quad(1, -(pc.r1 + pc.r2), pc.r1 * pc.r2, VX) + ' = 0, así que ' + VX + ' = ' + pc.r1 + ' o ' + VX + ' = ' + pc.r2 + '. El vértice está a la mitad, en ' + VX + ' = ' + pc.xp + ', donde P = ' + MN(pc.pmax) + '.'));
    if (id === 'done') return L(B(
      '✓ Three profit zones mapped. The zeros of the profit function mark where the business stops losing money, and the vertex between them marks where it earns the most.',
      '✓ Tres zonas de utilidad trazadas. Los ceros de la función de utilidad marcan dónde el negocio deja de perder dinero, y el vértice entre ellos marca dónde gana más.'));
    if (rd.ask.indexOf('pmax') !== -1) return L(B(
      '✓ Correct. The best price is ' + MN(pc.xp) + ' and it earns ' + MN(pc.pmax) + ' per month, the top of the profit curve.',
      '✓ Correcto. El mejor precio es ' + MN(pc.xp) + ' y deja ' + MN(pc.pmax) + ' al mes, la cima de la curva de utilidad.'));
    if (rd.ask.indexOf('best') !== -1) return L(B(
      '✓ Correct. The vertex sits halfway between the break-even prices, at ' + MN(pc.xp) + '.',
      '✓ Correcto. El vértice está a la mitad entre los precios de equilibrio, en ' + MN(pc.xp) + '.'));
    return L(B(
      '✓ Correct. Below ' + MN(pc.r1) + ' the margin is too thin to cover the fixed costs, and above ' + MN(pc.r2) + ' too few customers remain. Profit is positive only between them.',
      '✓ Correcto. Debajo de ' + MN(pc.r1) + ' el margen no alcanza a cubrir los costos fijos, y arriba de ' + MN(pc.r2) + ' quedan muy pocos clientes. La utilidad es positiva solo entre ambos.'));
  }
  function draw() {
    var cv = host.querySelector('.zn-cv'); if (!cv) return;
    var rd = cur(), pc = rd.pc, solved = (st.phase === 'solved' || st.done);
    var f, ctx, P;
    if (!solved) {
      f = plotFrame(cv, 130, { x0: 0, x1: pc.xmax, xs: xStepFor(pc.xmax, cv), y0: -1, y1: 1, ys: 1, noY: true, xl: L(B('price', 'precio')) });
      ctx = f.ctx; P = f.P;
      var lo = numVal(st.v.lo), hi = numVal(st.v.hi);
      if (lo !== null && hi !== null && lo !== hi) {
        var a = Math.max(0, Math.min(lo, hi)), b = Math.min(pc.xmax, Math.max(lo, hi));
        ctx.fillStyle = P.tint; ctx.fillRect(f.px(a), f.tp + 8, f.px(b) - f.px(a), f.py(0) - f.tp - 8);
        ctx.strokeStyle = P.green; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(f.px(a), f.tp + 8); ctx.lineTo(f.px(a), f.py(0)); ctx.moveTo(f.px(b), f.tp + 8); ctx.lineTo(f.px(b), f.py(0)); ctx.stroke();
        if (f.px(b) - f.px(a) > 76) {
          ctx.fillStyle = P.dark; ctx.font = '600 11px "IBM Plex Sans", sans-serif'; ctx.textAlign = 'center';
          ctx.fillText(L(B('profit zone?', '¿zona de utilidad?')), (f.px(a) + f.px(b)) / 2, f.tp + 34);
        }
      }
      return;
    }
    var x0 = Math.max(0, pc.r1 - 20), x1 = pc.r2 + 20, ys = niceStep(pc.pmax * 1.9, 5);
    var y1 = Math.ceil(pc.pmax * 1.15 / ys) * ys, y0 = -Math.ceil(pc.pmax * 0.5 / ys) * ys;
    f = plotFrame(cv, 230, { x0: x0, x1: x1, xs: xStepFor(x1 - x0, cv), y0: y0, y1: y1, ys: ys,
      xl: L(B('price', 'precio')), yl: L(B('profit', 'utilidad')) });
    ctx = f.ctx; P = f.P;
    function Pv(x) { return Pf(pc, x); }
    ctx.save();
    ctx.beginPath(); ctx.rect(f.ox, f.tp, f.W - f.ox - f.rp, f.oy - f.tp); ctx.clip();
    ctx.fillStyle = P.tint;
    ctx.beginPath(); ctx.moveTo(f.px(pc.r1), f.py(0));
    for (var k = 0; k <= 60; k++) { var xx = pc.r1 + (pc.r2 - pc.r1) * k / 60; ctx.lineTo(f.px(xx), f.py(Pv(xx))); }
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = P.green; ctx.lineWidth = 2.5; curve(f, Pv, x0, x1);
    ctx.restore();
    ctx.fillStyle = P.bad;
    [pc.r1, pc.r2].forEach(function(z) { ctx.beginPath(); ctx.arc(f.px(z), f.py(0), 5, 0, Math.PI * 2); ctx.fill(); });
    if (rd.ask.indexOf('best') !== -1 || st.done) {
      drawFlag(ctx, f.px(pc.xp), f.py(pc.pmax), P.gold);
      if (rd.ask.indexOf('pmax') !== -1) {
        ctx.fillStyle = P.text; ctx.font = '600 11px "IBM Plex Sans", sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(MN(pc.pmax), f.px(pc.xp), f.py(pc.pmax) - 27);
      }
    }
  }
  var LBL = {
    lo: B('Lower break-even price ($)', 'Precio de equilibrio menor ($)'),
    hi: B('Upper break-even price ($)', 'Precio de equilibrio mayor ($)'),
    best: B('Profit-maximizing price ($)', 'Precio que maximiza la utilidad ($)'),
    pmax: B('Maximum profit ($)', 'Utilidad máxima ($)')
  };
  function render() {
    if (st.done) {
      host.innerHTML =
        '<div class="iw-head"><span class="iw-tag">' + L(B('Complete', 'Completa')) + '</span><span class="iw-title">' + L(B('Profit zone', 'Zona de utilidad')) + '</span></div>' +
        '<canvas class="iw-canvas zn-cv"></canvas><div class="iw-fb good">' + msg('done') + '</div>';
      draw(); return;
    }
    var rd = cur(), pc = rd.pc, sc = rd.sc, solved = st.phase === 'solved';
    var ans = { lo: MN(pc.r1), hi: MN(pc.r2), best: MN(pc.xp), pmax: MN(pc.pmax) };
    var task = rd.ask.length === 2
      ? B('Find the two break-even prices.', 'Encuentra los dos precios de equilibrio.')
      : rd.ask.length === 3
        ? B('Find the two break-even prices and the price that maximizes profit.', 'Encuentra los dos precios de equilibrio y el precio que maximiza la utilidad.')
        : B('Find the break-even prices, the profit-maximizing price and the maximum profit.', 'Encuentra los precios de equilibrio, el precio que maximiza la utilidad y la utilidad máxima.');
    host.innerHTML =
      '<div class="iw-head"><span class="iw-tag">' + L(B('Round', 'Ronda')) + ' ' + (st.i + 1) + '/' + rounds.length + '</span>' +
        '<span class="iw-title">' + L(B('Profit zone', 'Zona de utilidad')) + '</span></div>' +
      '<div class="iw-sub">' + L(task) + ' ' + L(B(
        'The band on the price line shows the zone you are proposing. A correct answer reveals the profit curve.',
        'La banda sobre la recta de precios muestra la zona que propones. Una respuesta correcta revela la curva de utilidad.')) + '</div>' +
      '<div class="scenario-box">' + L(B(
        'Monthly profit of ' + sc.who.en + ' as a function of the price ' + VX + ' of its ' + sc.unit.en + ':',
        'Utilidad mensual de ' + sc.who.es + ' en función del precio ' + VX + ' de sus ' + sc.unit.es + ':')) +
        '<span class="eq">P(' + VX + ') = ' + quad(-pc.n, pc.pb, pc.pc, VX) + '</span></div>' +
      '<div class="fld-grid">' + rd.ask.map(function(k) {
        return '<div class="fld"><label>' + L(LBL[k]) + '</label>' + (solved
          ? '<div class="fld-val' + (st.rev ? ' ft-rev' : '') + '">' + ans[k] + '</div>'
          : '<input class="ft-inp zn-in' + (st.bad[k] === 1 ? ' ft-bad' : st.bad[k] === 0 ? ' ft-ok' : '') + '" data-k="' + k + '" type="text" inputmode="numeric" autocomplete="off" placeholder="?" value="' + st.v[k] + '">') + '</div>';
      }).join('') + '</div>' +
      '<canvas class="iw-canvas zn-cv"></canvas>' +
      (solved
        ? '<button class="verify-btn next zn-next">' + (st.i === rounds.length - 1 ? L(B('Finish', 'Terminar')) : L(B('Next round', 'Siguiente ronda'))) + '</button>'
        : '<button class="verify-btn zn-check">' + L(B('Check', 'Verificar')) + '</button>') +
      '<div class="iw-fb"></div>';
    if (st.fb) say(host, st.fb.cls, msg(st.fb.id));

        inp.classList.remove('ft-bad'); inp.classList.remove('ft-ok');
        draw();   /* the band is the mechanism; no verdict is given while typing */
      });

  function verify() {
    var rd = cur(), pc = rd.pc, v = {}, missing = false;

    st.bad = {};
    if (missing) { st.fb = { cls: 'warm', id: 'empty' }; render(); return; }
    var a = Math.min(v.lo, v.hi), b = Math.max(v.lo, v.hi);
    var loOk = (a === pc.r1), hiOk = (b === pc.r2);
    var bestOk = rd.ask.indexOf('best') === -1 || v.best === pc.xp;
    var pmOk = rd.ask.indexOf('pmax') === -1 || v.pmax === pc.pmax;
    if (loOk && hiOk && bestOk && pmOk) { st.phase = 'solved'; st.rev = false; st.fb = { cls: 'good', id: 'ok' }; render(); return; }
    st.tries++;
    if (st.tries >= 3) { st.phase = 'solved'; st.rev = true; st.fb = { cls: 'warm', id: 'reveal' }; render(); return; }
    var loKey = v.lo <= v.hi ? 'lo' : 'hi', hiKey = v.lo <= v.hi ? 'hi' : 'lo';
    st.bad[loKey] = loOk ? 0 : 1; st.bad[hiKey] = hiOk ? 0 : 1;
    if (!loOk || !hiOk) st.fb = { cls: 'miss', id: 'be', w: (!loOk ? a : b) };
    else {
      if (rd.ask.indexOf('best') !== -1) st.bad.best = bestOk ? 0 : 1;
      if (rd.ask.indexOf('pmax') !== -1 && bestOk) st.bad.pmax = pmOk ? 0 : 1;
      st.fb = { cls: 'miss', id: !bestOk ? 'best' : 'pmax' };
    }
    render();
  }
  function next() {
    checkpoint('profit-zone', st.i, 'round');
    st.i++; st.v = { lo: '', hi: '', best: '', pmax: '' }; st.tries = 0; st.phase = 'input'; st.fb = null; st.bad = {}; st.rev = false;
    if (st.i >= rounds.length) st.done = true;
    saveSession();
    render();
    if (st.done) applyLocks();
  }
  widgets.push(render); wdraws.push(draw); render();
}

/* ════════════════════════════════════════════════════════════════════════
   buildLesson(rng)
   ════════════════════════════════════════════════════════════════════════ */
function buildLesson(rng) {
  /*
   * CONCEPT ARC
   * topic        : Quadratic Functions in Business (Business Mathematics)
   * prerequisite : The student can evaluate a linear function and solve a quadratic
   *                equation by factoring or with the quadratic formula.
   * sequence     : 1. Revenue = price × quantity; with a linear demand rule, revenue rises,
   *                   peaks and falls (the parabola is discovered before it is named)
   *                2. The features of the parabola and what each one means in business:
   *                   direction, vertex, zeros, initial value
   *                3. The vertex formula x = −b/(2a): the exact revenue-maximizing price
   *                4. Profit = revenue − cost: break-even prices are the zeros, the best
   *                   price is the vertex, and it is not the revenue-maximizing price
   * why_this_order: the shape must be built by hand (1) before its features can be named (2);
   *                the formula (3) only makes sense once the vertex has a meaning, and profit (4)
   *                reuses zeros and vertex on a function the student must first assemble.
   *
   * time_audit   : (Part 0-T constants unchanged; x1.2 applied to every C1, C2 and S)
   *   reading   ~810w / 90 + 1 try-first (build P(x) on paper)             = 11.0m
   *   W revenue-lab     60s + 3 missions x 40s              (Mode A)        =  3.0m
   *   W revenue-table   60s + R40 + 3 x [R10 C1 C2]      = 100 + 3x124      =  7.9m
   *   W feature-sorter  60s + 6 x [R25 K T]              = 60 + 6x60        =  7.0m
   *   W summit-finder   60s + [R30 2C2] + 2 x [R30 C1 2C2] = 60+174+2x216   = 11.1m
   *   W profit-zone     60s + [R30 2C2] + [R30 2C2 C1] + [R30 2C2 C1 C2]
   *                     = 60 + 174 + 216 + 288                              = 12.3m
   *   P1 [R30 C1 K T] 107s   P2 [R30 2K T] 85s        P3 gated [R30 C2] 142s
   *   P4 [R30 K C1 T] 107s   P5 gated [R35 C2] 147s   P6 [R35 2K T] 90s
   *   P7 gated [R40 S 2C2 C1] 374s   P8 [R40 3K T] 115s
   *   P9 gated [R30 2C2 K] 234s      P10 gated [R30 C2] 142s   = 1543s      = 25.7m
   *   slack (welcome, interface, PDF)                                       =  5.0m
   *   TOTAL 83.0m  (target 75-85, hard window 70-90; heavy rounds 0/6)
   *   first pass was 94m: applied Step 4 in order (table 4 -> 3 rounds, P5 without
   *   the setup step, which is practised in the try-first example instead)
   */
  var scn = shuffle(SCN, rng);
  var dAll = shuffle(allDemand(), rng), dI = 0;
  function nextD() { return dAll[dI++ % dAll.length]; }
  var pAll = shuffle(allProfit(), rng);
  /* Running case of the session: profit at the revenue-maximizing price must stay positive */
  var mainIdx = 0;
  for (var z = 0; z < pAll.length; z++) { if (pAll[z].r2 - pAll[z].r1 > pAll[z].c) { mainIdx = z; break; } }
  var MC = pAll.splice(mainIdx, 1)[0], pI = 0;
  function nextP() { return pAll[pI++ % pAll.length]; }
  var S0 = scn[0];
  var mR = quad(-MC.n, MC.m, 0, VX);                         /* revenue of the running case */
  var mP = quad(-MC.n, MC.pb, MC.pc, VX);                    /* profit of the running case  */
  function mQ(x) { return MC.m - MC.n * x; }

  /* ───────────────────────── CONCEPT 1 ───────────────────────── */
  addSection(function(l) {
    var E = (l === 'en'), who = S0.who[l], unit = S0.unit[l];
    return '<div class="stag">' + (E ? 'Concept 1' : 'Concepto 1') + '</div>' +
      '<h2>' + (E ? 'A price decision draws a curve' : 'Una decisión de precio dibuja una curva') + '</h2>' +
      '<p>' + (E
        ? 'Every price pulls in two opposite directions. A higher price earns more on each sale, but fewer customers buy. <strong>Revenue</strong> combines both effects: revenue = price × quantity sold.'
        : 'Todo precio actúa en dos sentidos opuestos. Un precio más alto deja más dinero por cada venta, pero compran menos clientes. El <strong>ingreso</strong> combina ambos efectos: ingreso = precio × cantidad vendida.') + '</p>' +
      '<p>' + (E
        ? 'Market research for ' + who + ' gives the demand rule below, where ' + VX + ' is the price in pesos and ' + VQ + ' is the number of ' + unit + ' sold per month.'
        : 'Un estudio de mercado para ' + who + ' da la siguiente regla de demanda, donde ' + VX + ' es el precio en pesos y ' + VQ + ' es el número de ' + unit + ' que se venden al mes.') + '</p>' +
      '<div class="eqline">' + VQ + ' = ' + N(MC.m) + ' − ' + MC.n + VX + '</div>' +
      '<p>' + (E
        ? 'Each extra peso in the price loses ' + MC.n + ' sales. So which price brings in the most money?'
        : 'Cada peso adicional en el precio hace perder ' + MC.n + ' ventas. Entonces, ¿qué precio deja más dinero?') + '</p>' +
      '<div class="callout"><p>' + (E
        ? '<strong>Worked example.</strong> At ' + VX + ' = 10: ' + VQ + ' = ' + N(MC.m) + ' − ' + MC.n + '(10) = ' + N(mQ(10)) + ' ' + unit + ', so revenue is 10 × ' + N(mQ(10)) + ' = ' + MN(10 * mQ(10)) + '. At ' + VX + ' = 20: ' + VQ + ' = ' + N(mQ(20)) + ', so revenue is 20 × ' + N(mQ(20)) + ' = ' + MN(20 * mQ(20)) + '. The higher price sold less and still earned more. Does that keep working if the price keeps rising?'
        : '<strong>Ejemplo resuelto.</strong> Con ' + VX + ' = 10: ' + VQ + ' = ' + N(MC.m) + ' − ' + MC.n + '(10) = ' + N(mQ(10)) + ' ' + unit + ', así que el ingreso es 10 × ' + N(mQ(10)) + ' = ' + MN(10 * mQ(10)) + '. Con ' + VX + ' = 20: ' + VQ + ' = ' + N(mQ(20)) + ', así que el ingreso es 20 × ' + N(mQ(20)) + ' = ' + MN(20 * mQ(20)) + '. El precio más alto vendió menos y aun así dejó más dinero. ¿Seguirá pasando si el precio sigue subiendo?') + '</p></div>';
  });

  wLab(widgetHost('revenue-lab', 'lab'), MC, S0);
  wTable(widgetHost('revenue-table', 'table'), nextD(), scn[1]);

  /* P1 · build the revenue function (algebraic bridge from the table) */
  (function() {
    var d = nextD(), sc = scn[2];
    var o = [quadT(-d.n, d.m, 0, 'x'), N(d.m) + 'x − ' + d.n + 'x', quadT(-d.n, 0, d.m, 'x'), quadT(d.m, -d.n, 0, 'x')]
      .map(function(s) { return 'R(x) = ' + s; });
    addProb({
      title: B('Building the revenue function', 'Construir la función de ingreso'),
      q: B(cap(sc.who.en) + ' sells ' + VQ + ' = ' + N(d.m) + ' − ' + d.n + VX + ' ' + sc.unit.en + ' per month, where ' + VX + ' is the price in pesos. Which function gives its monthly revenue?',
           cap(sc.who.es) + ' vende ' + VQ + ' = ' + N(d.m) + ' − ' + d.n + VX + ' ' + sc.unit.es + ' al mes, donde ' + VX + ' es el precio en pesos. ¿Qué función da su ingreso mensual?'),
      hint: B('Revenue multiplies the price by the quantity. Replace the quantity with the demand rule before you multiply.',
              'El ingreso multiplica el precio por la cantidad. Sustituye la cantidad por la regla de demanda antes de multiplicar.'),
      exp: B('R(' + VX + ') = ' + VX + ' · ' + VQ + ' = ' + VX + '(' + N(d.m) + ' − ' + d.n + VX + ') = ' + N(d.m) + VX + ' − ' + d.n + VX + '<sup>2</sup>, which in standard form is ' + quad(-d.n, d.m, 0, VX) + '. The price multiplies both terms of the demand rule.',
             'R(' + VX + ') = ' + VX + ' · ' + VQ + ' = ' + VX + '(' + N(d.m) + ' − ' + d.n + VX + ') = ' + N(d.m) + VX + ' − ' + d.n + VX + '<sup>2</sup>, que en forma estándar es ' + quad(-d.n, d.m, 0, VX) + '. El precio multiplica a los dos términos de la regla de demanda.'),
      optsEn: o, optsEs: o, showWork: false
    }, rng);
  })();

  /* ───────────────────────── CONCEPT 2 ───────────────────────── */
  addSection(function(l) {
    var E = (l === 'en'), who = S0.who[l];
    function card(name, form, note) { return '<div class="rcard"><div class="rname">' + name + '</div><div class="rform">' + form + '</div><div class="rnote">' + note + '</div></div>'; }
    return '<div class="stag">' + (E ? 'Concept 2' : 'Concepto 2') + '</div>' +
      '<h2>' + (E ? 'Reading a parabola like an analyst' : 'Leer una parábola como analista') + '</h2>' +
      '<p>' + (E
        ? 'The table showed revenue rising, peaking and falling in a symmetric pattern. Because that pattern comes from a quadratic function, its features have standard names, and each one answers a business question.'
        : 'La tabla mostró un ingreso que sube, llega a un pico y baja con un patrón simétrico. Como ese patrón viene de una función cuadrática, sus rasgos tienen nombres estándar, y cada uno responde una pregunta de negocio.') + '</p>' +
      '<p>' + (E
        ? 'Multiplying the price by the demand rule of ' + who + ' gives its revenue function:'
        : 'Al multiplicar el precio por la regla de demanda de ' + who + ' se obtiene su función de ingreso:') + '</p>' +
      '<div class="eqline">R(' + VX + ') = ' + VX + '(' + N(MC.m) + ' − ' + MC.n + VX + ') = ' + mR + '</div>' +
      '<p>' + (E
        ? 'Any function of the form f(' + VX + ') = a' + VX + '<sup>2</sup> + b' + VX + ' + c, with a ≠ 0, is a <strong>quadratic function</strong>, and its graph is a parabola with four features:'
        : 'Toda función de la forma f(' + VX + ') = a' + VX + '<sup>2</sup> + b' + VX + ' + c, con a ≠ 0, es una <strong>función cuadrática</strong>, y su gráfica es una parábola con cuatro rasgos:') + '</p>' +
      '<div class="rules-grid two">' +
        card(E ? 'Direction' : 'Dirección', E ? 'sign of a' : 'signo de a', E
          ? 'If a is negative, the curve opens downward and has a maximum. If a is positive, it opens upward and has a minimum.'
          : 'Si a es negativa, la curva abre hacia abajo y tiene un máximo. Si a es positiva, abre hacia arriba y tiene un mínimo.') +
        card(E ? 'Vertex' : 'Vértice', E ? 'turning point' : 'punto de retorno', E
          ? 'The highest or lowest output: the best revenue, the best profit, the lowest cost.'
          : 'El resultado más alto o más bajo: el mejor ingreso, la mejor utilidad, el menor costo.') +
        card(E ? 'Zeros' : 'Ceros', 'f(' + VX + ') = 0', E
          ? 'Inputs whose output is 0. For a profit function they are the break-even points.'
          : 'Entradas cuyo resultado es 0. En una función de utilidad son los puntos de equilibrio.') +
        card(E ? 'Initial value' : 'Valor inicial', 'f(0) = c', E
          ? 'The output when the input is 0.'
          : 'El resultado cuando la entrada es 0.') +
      '</div>' +
      '<div class="callout"><p>' + (E
        ? '<strong>Worked example.</strong> In R(' + VX + ') = ' + mR + ', a = −' + MC.n + ' is negative, so the parabola opens downward and revenue has a maximum. Solving ' + VX + '(' + N(MC.m) + ' − ' + MC.n + VX + ') = 0 gives the zeros ' + VX + ' = 0, where the product is free, and ' + VX + ' = ' + MC.xmax + ', where the price is so high that nobody buys. The vertex lies exactly halfway between them, at ' + VX + ' = ' + MC.xr + ': the peak that the Revenue lab displayed.'
        : '<strong>Ejemplo resuelto.</strong> En R(' + VX + ') = ' + mR + ', a = −' + MC.n + ' es negativa, así que la parábola abre hacia abajo y el ingreso tiene un máximo. Al resolver ' + VX + '(' + N(MC.m) + ' − ' + MC.n + VX + ') = 0 se obtienen los ceros ' + VX + ' = 0, donde el producto se regala, y ' + VX + ' = ' + MC.xmax + ', donde el precio es tan alto que nadie compra. El vértice está exactamente a la mitad entre ambos, en ' + VX + ' = ' + MC.xr + ': el pico que mostró el Laboratorio de ingresos.') + '</p></div>';
  });

  /* Feature sorter items (seeded numbers, one per feature guaranteed) */
  (function() {
    var d1 = nextD(), d2 = nextD();
    var ca = pick([2, 3, 4, 5], rng), cq = pick([20, 30, 40], rng), cb = 2 * ca * cq, cc = ca * cq * cq + pick([600, 900, 1200], rng);
    var pa = pick([2, 3, 4], rng), pbq = pick([120, 180, 240], rng), pF = pick([800, 1000, 1500], rng);
    var hEq = B('Look at the sign of the squared term: it decides whether the curve opens upward or downward.',
                'Observa el signo del término cuadrático: decide si la curva abre hacia arriba o hacia abajo.');
    var hDesc = B('Decide what is described: an input whose output is 0, the output when the input is 0, or a highest or lowest output.',
                  'Decide qué se describe: una entrada cuyo resultado es 0, el resultado cuando la entrada es 0, o un resultado máximo o mínimo.');
    var pool = {
      max: [
        { t: B('The price at which the monthly profit of a company is as high as it can be.', 'El precio en el que la utilidad mensual de una empresa es la más alta posible.'),
          why: B('A highest possible output is the vertex of a parabola that opens downward: a maximum.', 'Un resultado lo más alto posible es el vértice de una parábola que abre hacia abajo: un máximo.'), hint: hDesc },
        { t: B('The turning point of the revenue model R(' + VX + ') = ' + quad(-d1.n, d1.m, 0, VX) + '.', 'El punto de retorno del modelo de ingreso R(' + VX + ') = ' + quad(-d1.n, d1.m, 0, VX) + '.'),
          why: B('The coefficient of ' + VX + '<sup>2</sup> is negative (−' + d1.n + '), so the parabola opens downward and its vertex is the highest revenue.', 'El coeficiente de ' + VX + '<sup>2</sup> es negativo (−' + d1.n + '), así que la parábola abre hacia abajo y su vértice es el ingreso más alto.'), hint: hEq }
      ],
      min: [
        { t: B('The turning point of the daily cost model C(' + VQ + ') = ' + quad(ca, -cb, cc, VQ) + '.', 'El punto de retorno del modelo de costo diario C(' + VQ + ') = ' + quad(ca, -cb, cc, VQ) + '.'),
          why: B('The coefficient of ' + VQ + '<sup>2</sup> is positive (' + ca + '), so the parabola opens upward and its vertex is the lowest cost.', 'El coeficiente de ' + VQ + '<sup>2</sup> es positivo (' + ca + '), así que la parábola abre hacia arriba y su vértice es el costo más bajo.'), hint: hEq },
        { t: B('The production level at which the cost per day is the lowest possible.', 'El nivel de producción en el que el costo por día es el más bajo posible.'),
          why: B('A lowest possible output is the vertex of a parabola that opens upward: a minimum.', 'Un resultado lo más bajo posible es el vértice de una parábola que abre hacia arriba: un mínimo.'), hint: hDesc }
      ],
      zero: [
        { t: B('The price at which revenue exactly covers total cost, so the profit is $0.', 'El precio en el que el ingreso cubre exactamente el costo total, así que la utilidad es $0.'),
          why: B('A profit of 0 is a zero of the profit function, which in business is called a break-even point.', 'Una utilidad de 0 es un cero de la función de utilidad, que en los negocios se llama punto de equilibrio.'), hint: hDesc },
        { t: B('In the revenue model R(' + VX + ') = ' + quad(-d2.n, d2.m, 0, VX) + ', the price ' + VX + ' = ' + d2.xmax + '.', 'En el modelo de ingreso R(' + VX + ') = ' + quad(-d2.n, d2.m, 0, VX) + ', el precio ' + VX + ' = ' + d2.xmax + '.'),
          why: B('R(' + d2.xmax + ') = 0: at that price no units are sold, so it is a zero of the function.', 'R(' + d2.xmax + ') = 0: a ese precio no se vende ninguna unidad, así que es un cero de la función.'),
          hint: B('Evaluate the function at that price and see what the output is.', 'Evalúa la función en ese precio y observa cuál es el resultado.') },
        { t: B('The two production levels at which a factory neither earns nor loses money.', 'Los dos niveles de producción en los que una fábrica ni gana ni pierde dinero.'),
          why: B('Neither earning nor losing means a profit of 0: those levels are the zeros of the profit function.', 'Ni ganar ni perder significa una utilidad de 0: esos niveles son los ceros de la función de utilidad.'), hint: hDesc }
      ],
      init: [
        { t: B('In the profit model P(' + VQ + ') = ' + quad(-pa, pbq, -pF, VQ) + ', where ' + VQ + ' is the number of units sold, the number −' + N(pF) + '.', 'En el modelo de utilidad P(' + VQ + ') = ' + quad(-pa, pbq, -pF, VQ) + ', donde ' + VQ + ' es el número de unidades vendidas, el número −' + N(pF) + '.'),
          why: B('P(0) = −' + N(pF) + ': with zero units sold the firm still pays its fixed costs. The constant term is the initial value.', 'P(0) = −' + N(pF) + ': con cero unidades vendidas la empresa igual paga sus costos fijos. El término constante es el valor inicial.'),
          hint: B('Substitute 0 for the input and see which term survives.', 'Sustituye 0 en la entrada y observa qué término sobrevive.') },
        { t: B('The loss that a workshop records in a month in which it produces zero units.', 'La pérdida que registra un taller en un mes en el que produce cero unidades.'),
          why: B('An output when the input is 0 is the initial value of the function, its constant term.', 'Un resultado cuando la entrada es 0 es el valor inicial de la función, su término constante.'), hint: hDesc }
      ]
    };
    var chosen = [], rest = [];
    ['max', 'min', 'zero', 'init'].forEach(function(k) {
      var arr = shuffle(pool[k], rng);
      arr.forEach(function(it, j) { it.k = k; (j === 0 ? chosen : rest).push(it); });
    });
    rest = shuffle(rest, rng);
    while (chosen.length < 6 && rest.length) chosen.push(rest.shift());
    wSort(widgetHost('feature-sorter', 'classify'), shuffle(chosen, rng));
  })();

  /* P2 · interpretation (two structural variants; the seed picks one) */
  (function() {
    var d = nextD(), sc = scn[3], v = Math.floor(rng() * 2);
    var ca = pick([2, 3, 4, 5], rng), cq = pick([20, 30, 40, 50], rng), cb = 2 * ca * cq, cc = ca * cq * cq + pick([700, 1100, 1400], rng);
    if (v === 0) {
      addProb({
        title: B('Reading a zero', 'Leer un cero'),
        q: B('The monthly revenue of ' + sc.who.en + ' is R(' + VX + ') = ' + quad(-d.n, d.m, 0, VX) + ', where ' + VX + ' is the price in pesos. Its zeros are ' + VX + ' = 0 and ' + VX + ' = ' + d.xmax + '. What does the zero at ' + VX + ' = ' + d.xmax + ' tell the manager?',
             'El ingreso mensual de ' + sc.who.es + ' es R(' + VX + ') = ' + quad(-d.n, d.m, 0, VX) + ', donde ' + VX + ' es el precio en pesos. Sus ceros son ' + VX + ' = 0 y ' + VX + ' = ' + d.xmax + '. ¿Qué le dice al gerente el cero en ' + VX + ' = ' + d.xmax + '?'),
        hint: B('A zero is an input whose output is 0. Think about what makes revenue 0 when the price is not 0.',
                'Un cero es una entrada cuyo resultado es 0. Piensa qué hace que el ingreso sea 0 cuando el precio no es 0.'),
        exp: B('R(' + d.xmax + ') = 0 with a positive price means that the quantity sold is 0: at ' + MN(d.xmax) + ' demand disappears. The maximum is at the vertex, halfway between the zeros, at ' + MN(d.xr) + '.',
               'R(' + d.xmax + ') = 0 con un precio positivo significa que la cantidad vendida es 0: en ' + MN(d.xmax) + ' la demanda desaparece. El máximo está en el vértice, a la mitad entre los ceros, en ' + MN(d.xr) + '.'),
        optsEn: ['At that price no units are sold', 'At that price revenue is the highest', 'At that price revenue equals total cost', 'At that price demand is the highest'],
        optsEs: ['A ese precio no se vende ninguna unidad', 'A ese precio el ingreso es el más alto', 'A ese precio el ingreso iguala al costo total', 'A ese precio la demanda es la más alta'],
        showWork: false
      }, rng);
    } else {
      addProb({
        title: B('Reading the direction', 'Leer la dirección'),
        q: B('An analyst models the monthly cost of ' + sc.who.en + ' as C(' + VQ + ') = ' + quad(ca, -cb, cc, VQ) + ', where ' + VQ + ' is the number of units produced. What does the positive coefficient of ' + VQ + '<sup>2</sup> guarantee?',
             'Un analista modela el costo mensual de ' + sc.who.es + ' como C(' + VQ + ') = ' + quad(ca, -cb, cc, VQ) + ', donde ' + VQ + ' es el número de unidades producidas. ¿Qué garantiza el coeficiente positivo de ' + VQ + '<sup>2</sup>?'),
        hint: B('The sign of the squared term fixes the direction in which the parabola opens.',
                'El signo del término cuadrático fija la dirección en la que abre la parábola.'),
        exp: B('A positive coefficient of ' + VQ + '<sup>2</sup> makes the parabola open upward, so its vertex is the lowest point: the cost has a minimum, here at ' + VQ + ' = ' + cq + ' units.',
               'Un coeficiente positivo de ' + VQ + '<sup>2</sup> hace que la parábola abra hacia arriba, así que su vértice es el punto más bajo: el costo tiene un mínimo, aquí en ' + VQ + ' = ' + cq + ' unidades.'),
        optsEn: ['The cost has a lowest value at the vertex', 'The cost has a highest value at the vertex', 'The cost is equal to zero at the vertex', 'The cost falls forever as output grows'],
        optsEs: ['El costo tiene un valor mínimo en el vértice', 'El costo tiene un valor máximo en el vértice', 'El costo es igual a cero en el vértice', 'El costo baja sin fin al crecer la producción'],
        showWork: false
      }, rng);
    }
  })();

  /* ───────────────────────── CONCEPT 3 ───────────────────────── */
  addSection(function(l) {
    var E = (l === 'en'), who = S0.who[l];
    return '<div class="stag">' + (E ? 'Concept 3' : 'Concepto 3') + '</div>' +
      '<h2>' + (E ? 'The vertex formula: the best price without a table' : 'La fórmula del vértice: el mejor precio sin tabla') + '</h2>' +
      '<p>' + (E
        ? 'A table only tests the prices you choose, and the best price may fall between two of them. Because a parabola is symmetric, its vertex can be located exactly from the coefficients.'
        : 'Una tabla solo prueba los precios que eliges, y el mejor precio puede caer entre dos de ellos. Como una parábola es simétrica, su vértice se puede ubicar de forma exacta a partir de los coeficientes.') + '</p>' +
      '<p>' + (E
        ? 'For f(' + VX + ') = a' + VX + '<sup>2</sup> + b' + VX + ' + c, the vertex is at the input'
        : 'Para f(' + VX + ') = a' + VX + '<sup>2</sup> + b' + VX + ' + c, el vértice está en la entrada') + '</p>' +
      '<div class="eqline">' + VX + ' = ' + frac('−b', '2a') + '</div>' +
      '<p>' + (E
        ? 'Substituting that input into the function gives the maximum or minimum value itself.'
        : 'Al sustituir esa entrada en la función se obtiene el valor máximo o mínimo.') + '</p>' +
      '<p>' + (E
        ? '<strong>Why it works.</strong> Without the constant, a' + VX + '<sup>2</sup> + b' + VX + ' = ' + VX + '(a' + VX + ' + b) has zeros at ' + VX + ' = 0 and ' + VX + ' = ' + frac('−b', 'a') + ', and the vertex lies halfway between them. The constant c only moves the whole curve up or down, so it changes how high the vertex is, not where it is.'

      q: B('The daily production cost of ' + shop.en + ' is C(' + VQ + ') = ' + quad(a, -b, c0, VQ) + ' pesos, where ' + VQ + ' is the number of units produced per day. What production level gives the lowest daily cost?',
           'El costo diario de producción de ' + shop.es + ' es C(' + VQ + ') = ' + quad(a, -b, c0, VQ) + ' pesos, donde ' + VQ + ' es el número de unidades producidas por día. ¿Qué nivel de producción da el menor costo diario?'),
      hint: B('The same formula locates the vertex whichever way the parabola opens. Watch the sign of b.',
              'La misma fórmula ubica el vértice sin importar hacia dónde abra la parábola. Cuida el signo de b.'),
      exp: B('Here a = ' + a + ' is positive, so the vertex is a minimum: ' + VQ + ' = ' + frac('−(−' + N(b) + ')', '2(' + a + ')') + ' = ' + qs + ' units. The lowest daily cost is C(' + qs + ') = ' + MN(cmin) + '.',
             'Aquí a = ' + a + ' es positiva, así que el vértice es un mínimo: ' + VQ + ' = ' + frac('−(−' + N(b) + ')', '2(' + a + ')') + ' = ' + qs + ' unidades. El menor costo diario es C(' + qs + ') = ' + MN(cmin) + '.'),
      optsEn: vals.map(function(v) { return N(v) + ' units'; }),
      optsEs: vals.map(function(v) { return N(v) + ' unidades'; }),
      showWork: true
    }, rng);
  })();
}
