<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diversidad Cultural: Pueblos Originarios y Grupos Urbanos</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; text-align: justify; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Diversidad Cultural: Pueblos Originarios y Grupos Urbanos</div>
    <div class="wcourse" id="wcourse-el">Geografía · 1° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Diversidad Cultural: Pueblos Originarios y Grupos Urbanos</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="sbtn" id="dlBtn" onclick="generatePDF()" style="max-width:280px;margin:0 auto;">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   CENTRALIZED SCHOOL CONFIG (Rule 16) — ships UNBRANDED (Rule 11).
   The ONLY rebranding point. build_all.py substitutes these exact fields
   (BRAND_FIELDS / RGB_FIELDS / logo*) downstream; :root/dark stay as fallback.
   Neutral defaults below == the static :root/dark values, so unbranded == no-op.
   ══════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:'#24240c', primaryDark:'#3f3f14', primaryBg:'#f4f4e9',
  accent:'#fcb40c', accentBg:'#fff4db',
  darkPrimary:'#b4b455', darkPrimaryDark:'#d7d783', darkPrimaryBg:'#343412',

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);

  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');

}

async function generatePDF() {
  var btn = document.getElementById('dlBtn');
  btn.textContent = 'Generando PDF…';
  btn.disabled = true;

  var jspdf   = window.jspdf;
  var doc     = new jspdf.jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });
  var PW      = 215.9;
  var M       = 18;
  var TW      = PW - M * 2;
  var PH      = doc.internal.pageSize.height;
  var name    = studentData.name;
  var group   = studentData.group;
  var total   = problems.length;
  var pct     = Math.round(correctCount / total * 100);
  var dateStr = new Date().toLocaleString('es-MX', { dateStyle:'long', timeStyle:'short' });

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS — INJECTION BLOCK ─────────────────────────────────────────
  //   Match these RGB values to --green and --gold above.
  //   PRIMARY  → pBR, pBG, pBB
  //   ACCENT   → pAR, pAG, pAB
  // ──────────────────────────────────────────────────────────────────────────
  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;  // PRIMARY (from SCHOOL, Rule 16)
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;   // ACCENT (from SCHOOL, Rule 16)

  function pdfText(html) {
    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/\u2192/g,'->').replace(/\u2212/g,'-').replace(/\u00b2/g,'^2')
      .replace(/\u00b3/g,'^3').replace(/\u00d7/g,'x').replace(/\u00f7/g,'/')
      .replace(/\u2260/g,'!=').replace(/\u2264/g,'<=').replace(/\u2265/g,'>=')
      .replace(/\u221a/g,'sqrt').replace(/\u03c0/g,'pi').replace(/\u2026/g,'...')
      .replace(/\s+/g,' ').trim();

    var u = URL.createObjectURL(b);
    var w = window.open(u, '_blank');
    if (!w) { window.location.href = u; }
    setTimeout(function(){ URL.revokeObjectURL(u); }, 60000);
  }

  var _isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
               (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  if (_isIOS) {
    var _pdfFile = new File([_pdfBlob], _fname, { type:'application/pdf' });
    if (navigator.canShare && navigator.canShare({ files:[_pdfFile] })) {
      navigator.share({ files:[_pdfFile], title:_fname })
        .then(_restorePdfBtn)
        .catch(function(e){
          if (e && e.name === 'AbortError') { _restorePdfBtn(); return; }
          _openPdfInline(_pdfBlob); _restorePdfBtn();
        });
      return;
    }
    _openPdfInline(_pdfBlob); _restorePdfBtn();
    return;
  }

  var _dlUrl = URL.createObjectURL(_pdfBlob);
  var _dlA   = document.createElement('a');
  _dlA.href  = _dlUrl; _dlA.download = _fname;
  document.body.appendChild(_dlA); _dlA.click();
  setTimeout(function(){ document.body.removeChild(_dlA); URL.revokeObjectURL(_dlUrl); }, 200);
  _restorePdfBtn();
}

function L(o){ return (o && o[LANG] !== undefined) ? o[LANG] : (o ? o.es : ''); }
function ri(rng, a, b){ return a + Math.floor(rng() * (b - a + 1)); }
function pk(rng, a){ return a[Math.floor(rng() * a.length)]; }
function permOf(n, rng){
  var a = [], i;
  for (i = 0; i < n; i++) a.push(i);
  for (i = a.length - 1; i > 0; i--){ var j = Math.floor(rng() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}

    { n:{ es:'Pueblo otomí', en:'Otomí people' }, r:1,
      cue:{ es:'Su lengua es el hñähñu y viven en valles altos cercanos a las ciudades más grandes del país.',
            en:'Their language is Hñähñu and they live in high valleys close to the biggest cities of the country.' },
      why:{ es:'Están en Hidalgo, Querétaro y el Estado de México.', en:'They are in Hidalgo, Querétaro and the State of Mexico.' } },
    { n:{ es:'Pueblo purépecha', en:'Purépecha people' }, r:1,
      cue:{ es:'Viven alrededor de un lago rodeado de volcanes y son conocidos por su trabajo en cobre y en madera.',
            en:'They live around a lake ringed by volcanoes and are known for their work in copper and wood.' },
      why:{ es:'Su territorio rodea el lago de Pátzcuaro, en Michoacán.', en:'Their territory surrounds Lake Pátzcuaro, in Michoacán.' } },
    { n:{ es:'Pueblo zapoteco', en:'Zapotec people' }, r:2,
      cue:{ es:'Habitan valles y un istmo estrecho donde el viento sopla con mucha fuerza casi todo el año.',
            en:'They live in valleys and a narrow isthmus where the wind blows very strongly nearly all year.' },
      why:{ es:'Viven en los valles y el istmo de Oaxaca.', en:'They live in the valleys and the isthmus of Oaxaca.' } },
    { n:{ es:'Pueblo tsotsil', en:'Tsotsil people' }, r:2,
      cue:{ es:'Viven en montañas frías y neblinosas muy cerca de la frontera con Guatemala.',
            en:'They live in cold, misty mountains very close to the border with Guatemala.' },
      why:{ es:'Su territorio son los Altos de Chiapas.', en:'Their territory is the Highlands of Chiapas.' } },
    { n:{ es:'Pueblo mixteco', en:'Mixtec people' }, r:2,
      cue:{ es:'Se llaman a sí mismos pueblo de la lluvia y viven en una región de cerros erosionados.',
            en:'They call themselves the people of the rain and live in a region of eroded hills.' },
      why:{ es:'La Mixteca abarca partes de Oaxaca, Guerrero y Puebla.', en:'La Mixteca covers parts of Oaxaca, Guerrero and Puebla.' } },
    { n:{ es:'Pueblo maya', en:'Maya people' }, r:3,
      cue:{ es:'Su territorio es una planicie de piedra caliza sin ríos en la superficie, donde el agua se guarda en cenotes.',
            en:'Their territory is a limestone plain with no rivers on the surface, where water is kept in cenotes.' },
      why:{ es:'Viven en Yucatán, Campeche y Quintana Roo.', en:'They live in Yucatán, Campeche and Quintana Roo.' } }
  ];
  var st = { seq: permOf(ITEMS.length, rng), i: 0, tries: 0, hits: 0, done: false, busy: false };

  function dirHint(g, c){
    if (c === 3) return L({ es:'Más hacia el oriente: ese pueblo vive en una península rodeada de mar por tres lados.',
                            en:'Further east: that people lives on a peninsula surrounded by sea on three sides.' });
    if (g === 3) return L({ es:'No es la península. Regresa a tierra adentro y vuelve a leer el paisaje que describe la tarjeta.',
                            en:'It is not the peninsula. Go back inland and read again the landscape the card describes.' });
    return g < c ? L({ es:'Más al sur de donde señalaste.', en:'Further south than where you pointed.' })
                 : L({ es:'Más al norte de donde señalaste.', en:'Further north than where you pointed.' });
  }

  function render(){
    st.busy = false;
    if (st.done){
      host.innerHTML =
        '<div class="gw-h iw-tag">' + L({ es:'El mapa de las lenguas', en:'The map of languages' }) + '</div>' +
        '<div class="gw-q">' + L({ es:'Mapa completo', en:'Map complete' }) + '</div>' +
        '<div class="gw-fb good">🎉 ' + L({
          es:'Ubicaste ' + st.hits + ' de ' + ITEMS.length + '. Fíjate en dónde quedaron: hay pueblos originarios en el norte, en el centro, en el sur y en la península. No viven en una sola esquina del país ni desaparecieron con el tiempo.',
          en:'You placed ' + st.hits + ' of ' + ITEMS.length + '. Look at where they ended up: there are original peoples in the north, the centre, the south and the peninsula. They do not live in one corner of the country and they did not vanish with time.'
        }) + '</div>';
      return;
    }
    var it = ITEMS[st.seq[st.i]];
    host.innerHTML =
      '<div class="gw-h iw-tag">' + L({ es:'El mapa de las lenguas', en:'The map of languages' }) + '</div>' +
      '<div class="gw-q">' + L({ es:'¿En qué región del país vive cada pueblo?', en:'In which region of the country does each people live?' }) + '</div>' +
      '<div class="gw-mini iw-sub">' + L({
        es:'La tarjeta no dice el estado: dice el paisaje. Léelo y señala la región. Si te equivocas, el mapa te dice hacia dónde moverte.',
        en:'The card does not name the state: it describes the landscape. Read it and point to the region. If you miss, the map tells you which way to move.'
      }) + '</div>' +
      '<div class="mp-prog">' + (st.i + 1) + ' / ' + ITEMS.length + '</div>' +
      '<div class="mp-card"><div class="mp-name">' + L(it.n) + '</div><div class="mp-cue">' + L(it.cue) + '</div></div>' +
      '<div class="mp-regs">' + REGS.map(function(r, i){
        return '<button class="mp-reg" data-r="' + i + '">' + L(r) + '</button>';
      }).join('') + '</div>' +
      '<div class="gw-fb"></div>';
    host.querySelectorAll('.mp-reg').forEach(function(b){
      b.addEventListener('click', function(){ choose(parseInt(b.getAttribute('data-r'), 10)); });
    });
  }

  function advance(){
    st.busy = true;
    st.i++; st.tries = 0;
    if (st.i >= ITEMS.length) st.done = true;
    setTimeout(render, 1300);
  }

  function choose(g){
    if (st.busy || st.done) return;
    var it = ITEMS[st.seq[st.i]];
    if (g === it.r){
      st.hits++;
      var b = host.querySelector('[data-r="' + g + '"]');
      if (b) b.className = 'mp-reg hit';
      say(host, 'good', '✓ ' + L(it.why));
      advance();
      return;
    }
    st.tries++;
    if (st.tries >= 3){
      say(host, 'warm', L({ es:'Va en ', en:'It goes in ' }) + '<b>' + L(REGS[it.r]) + '</b>. ' + L(it.why));
      advance();
      return;
    }
    say(host, 'miss', dirHint(g, it.r));
  }

  render();
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 2 :: EL RETRATO DEL MUNICIPIO (armar las cuatro voces)
   ══════════════════════════════════════════════════════════════════════════ */
function wRetrato(rng, host){
  var GRUPOS = [
    { es:'Pueblos originarios', en:'Original peoples' },
    { es:'Comunidades afromexicanas', en:'Afro-Mexican communities' },
    { es:'Personas migrantes', en:'People who migrated' },
    { es:'Grupos urbanos', en:'Urban groups' }
  ];
  var TILES = [
    { es:'La asamblea de la comunidad nahua decide en su lengua quién cuidará el monte este año', en:'The assembly of the Nahua community decides in its own language who will look after the woodland this year', g:0,
      why:{ es:'Un pueblo originario con lengua y forma propia de decidir en común.', en:'An original people with its own language and its own way of deciding together.' } },
    { es:'Las familias afromexicanas de la costa ensayan la danza de los diablos para la fiesta del pueblo', en:'The Afro-Mexican families of the coast rehearse the dance of the devils for the town festival', g:1,
      why:{ es:'Una comunidad afromexicana con historia y fiesta propias.', en:'An Afro-Mexican community with its own history and its own festival.' } },
    { es:'Una familia que llegó de otro estado abrió una cocina y enseñó a preparar los guisos de su tierra', en:'A family that arrived from another state opened a kitchen and taught people to cook the dishes of their homeland', g:2,
      why:{ es:'Quien llega también construye el lugar al que llega.', en:'Whoever arrives also builds the place they arrive at.' } },
    { es:'Un colectivo de jóvenes patinadores pintó un mural en la barda de la unidad deportiva', en:'A collective of young skaters painted a mural on the wall of the sports centre', g:3,
      why:{ es:'Un grupo urbano que comparte una práctica y una forma de expresarse.', en:'An urban group that shares a practice and a way of expressing itself.' } },
    { es:'Todos los vecinos hablan la misma lengua y así se evitan los malentendidos del barrio', en:'All the neighbours speak the same language and that way misunderstandings in the barrio are avoided', g:-1,
      why:{ es:'Esta frase no retrata a la comunidad: la imagina pareja borrando a quienes hablan otra lengua.', en:'This sentence does not portray the community: it imagines it uniform by erasing those who speak another language.' } },
    { es:'Las costumbres antiguas solo sirven para las fotografías de la fiesta y para los libros', en:'Old customs are only good for festival photographs and for books', g:-1,
      why:{ es:'Convierte en adorno lo que hoy sigue vivo en las comunidades.', en:'It turns into decoration what is still alive in the communities today.' } },
    { es:'Quien llega de fuera debe dejar sus costumbres para que el barrio lo acepte', en:'Whoever arrives from elsewhere should drop their customs so the barrio accepts them', g:-1,
      why:{ es:'Pone una condición para pertenecer, y eso es justamente lo contrario de reconocer.', en:'It sets a condition for belonging, and that is exactly the opposite of recognising.' } },
    { es:'Los grupos de jóvenes de la ciudad son un estorbo para la convivencia del barrio', en:'Groups of young people in the city are a nuisance for life in the barrio', g:-1,
      why:{ es:'Juzga a un grupo entero antes de conocer lo que hace.', en:'It judges a whole group before knowing what it does.' } }
  ];
  var ord = permOf(TILES.length, rng);
  var st = { sel: TILES.map(function(){ return false; }), tries: 0, done: false };

  function covered(){
    var c = [false, false, false, false];
    TILES.forEach(function(tt, i){ if (st.sel[i] && tt.g >= 0) c[tt.g] = true; });
    return c;
  }

  function render(){
    var cov = covered();
    var grid = ord.map(function(i){
      var cls = 'rt-tile';
      if (st.done) cls += (TILES[i].g >= 0 ? ' good' : ' bad');
      else if (st.sel[i]) cls += ' on';
      return '<button class="' + cls + '" data-i="' + i + '">' + L(TILES[i]) + '</button>';
    }).join('');
    var slots = GRUPOS.map(function(g, gi){
      return '<div class="rt-slot' + (cov[gi] ? ' on' : '') + '">' + (cov[gi] ? '✓ ' : '') + L(g) + '</div>';
    }).join('');
    host.innerHTML =
      '<div class="gw-h iw-tag">' + L({ es:'El retrato del municipio', en:'The portrait of the municipality' }) + '</div>' +
      '<div class="gw-q">' + L({ es:'Arma un retrato donde quepan todas las voces', en:'Build a portrait where every voice fits' }) + '</div>' +
      '<div class="gw-mini iw-sub">' + L({
        es:'Elige las tarjetas que sí retratan a la gente que vive aquí. Abajo se van encendiendo las voces que ya quedaron dentro. Puedes marcar y desmarcar cuantas veces quieras antes de verificar.',
        en:'Pick the cards that really portray the people who live here. Below, the voices already included light up. You can mark and unmark as many times as you like before checking.'
      }) + '</div>' +
      '<div class="rt-grid">' + grid + '</div>' +
      '<div class="rt-meter">' + slots + '</div>' +
      (st.done ? '' : '<div class="gw-row"><button class="gw-btn" data-r="check">' + L({ es:'Verificar el retrato', en:'Check the portrait' }) + '</button></div>') +
      '<div class="gw-fb"></div>';
    host.querySelectorAll('.rt-tile').forEach(function(el){
      el.addEventListener('click', function(){ toggle(parseInt(el.getAttribute('data-i'), 10)); });
    });
    var b = host.querySelector('[data-r="check"]');
    if (b) b.addEventListener('click', check);
  }

  function toggle(i){
    if (st.done) return;
    st.sel[i] = !st.sel[i];
    var cov = covered(), faltan = 0, gi;
    for (gi = 0; gi < 4; gi++) if (!cov[gi]) faltan++;
    render();
    if (st.sel[i] && TILES[i].g >= 0){
      say(host, 'warm', L({ es:'Entra la voz de ', en:'In comes the voice of ' }) + '<b>' + L(GRUPOS[TILES[i].g]) + '</b>. ' +
        (faltan > 0 ? L({ es:'Faltan ' + faltan + ' por aparecer en el retrato.', en:'There are still ' + faltan + ' to appear in the portrait.' })
                    : L({ es:'Ya están las cuatro: ahora revisa que no hayas dejado dentro alguna tarjeta que niega la diversidad.',
                          en:'All four are in: now check that you have not left in a card that denies diversity.' })));
    } else if (st.sel[i]){
      say(host, 'miss', L({
        es:'Lee otra vez esa tarjeta: ¿describe a alguien que vive aquí, o pone una condición para poder pertenecer?',
        en:'Read that card again: does it describe someone who lives here, or does it set a condition for belonging?'
      }));
    }
  }

  function check(){
    var cov = covered(), sobra = -1, i;
    for (i = 0; i < TILES.length; i++){ if (st.sel[i] && TILES[i].g < 0){ sobra = i; break; } }
    var faltan = [];
    for (i = 0; i < 4; i++) if (!cov[i]) faltan.push(i);
    if (sobra < 0 && faltan.length === 0){
      st.done = true; render();
      say(host, 'good', '🎉 ' + L({
        es:'Retrato armado. Un municipio pluricultural no es el que consigue que todos se parezcan: es el que reconoce que su pueblo originario, sus familias afromexicanas, quienes llegaron de otro lugar y sus grupos urbanos habitan juntos el mismo territorio.',
        en:'Portrait assembled. A pluricultural municipality is not one that gets everyone to look alike: it is one that recognises that its original people, its Afro-Mexican families, those who arrived from elsewhere and its urban groups inhabit the same territory together.'
      }));
      return;
    }
    st.tries++;
    if (st.tries >= 3){
      st.done = true; render();
      say(host, 'warm', L({
        es:'Estas cuatro retratan a la gente del municipio y las otras cuatro no: ponen condiciones, juzgan a un grupo entero o imaginan que todos son iguales.',
        en:'These four portray the people of the municipality and the other four do not: they set conditions, judge a whole group or imagine that everyone is the same.'
      }));
      return;
    }
    if (sobra >= 0){
      say(host, 'miss', L({ es:'Quita la que dice ', en:'Take out the one that says ' }) + '<b>' + L(TILES[sobra]) + '</b>. ' + L(TILES[sobra].why));
      return;
    }
    say(host, 'miss', L({ es:'Todavía falta la voz de ', en:'You are still missing the voice of ' }) + '<b>' + L(GRUPOS[faltan[0]]) + '</b>. ' +
      L({ es:'Busca en el tablero una tarjeta donde ese grupo esté haciendo algo en el municipio.',
          en:'Look on the board for a card where that group is doing something in the municipality.' }));
  }

  render();
  say(host, '', L({
    es:'Ocho tarjetas sobre el mismo municipio. Cuatro retratan a su gente y cuatro la borran.',
    en:'Eight cards about the same municipality. Four portray its people and four erase them.'
  }));
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 3 :: LA HERENCIA COMPARTIDA (aporte  ->  quién lo trajo)
   ══════════════════════════════════════════════════════════════════════════ */
function wHerencia(rng, host){
  var PAIRS = [
    { a:{ es:'Las palabras chocolate, aguacate y tianguis que usas todos los días', en:'The words chocolate, aguacate and tianguis that you use every day' },
      b:{ es:'El náhuatl, lengua de pueblos originarios del centro del país', en:'Nahuatl, language of original peoples of the centre of the country' },
      cue:{ es:'entraron al español desde una lengua originaria y hoy nadie las siente ajenas', en:'entered Spanish from an original language and today nobody feels they are foreign' } },
    { a:{ es:'La palabra cenote, con la que se nombra un pozo natural de agua', en:'The word cenote, used to name a natural water well' },
      b:{ es:'El maya, lengua de la península de Yucatán', en:'Maya, language of the Yucatán Peninsula' },
      cue:{ es:'nombra un paisaje que solo existe en esa región y por eso se tomó de ahí', en:'names a landscape that only exists in that region, which is why it was taken from there' } },
    { a:{ es:'La danza de los diablos que se baila en la Costa Chica', en:'The dance of the devils performed on the Costa Chica' },
      b:{ es:'Las comunidades afromexicanas de Guerrero y Oaxaca', en:'The Afro-Mexican communities of Guerrero and Oaxaca' },
      cue:{ es:'es fiesta viva de esas comunidades y no un recuerdo de museo', en:'is a living festival of those communities and not a museum memory' } },
    { a:{ es:'Los tacos árabes que se venden en las calles de Puebla', en:'The tacos árabes sold in the streets of Puebla' },
      b:{ es:'Familias migrantes llegadas hace cien años desde el Líbano', en:'Migrant families who arrived a hundred years ago from Lebanon' },
      cue:{ es:'nació cuando una cocina de fuera se mezcló con los ingredientes de aquí', en:'was born when a kitchen from elsewhere mixed with the ingredients from here' } },
    { a:{ es:'El mural pintado con aerosol en la barda de la secundaria', en:'The mural painted with spray on the wall of the secondary school' },
      b:{ es:'Colectivos juveniles de arte urbano', en:'Youth collectives of urban art' },
      cue:{ es:'es una forma de expresión que nació en las ciudades y sigue creándose hoy', en:'is a form of expression born in cities and still being created today' } }
  ];
  var N = PAIRS.length;
  var st = { left: permOf(N, rng), right: permOf(N, rng), sel: null, done: [], tries: 0 };

  function isDone(i){ return st.done.indexOf(i) >= 0; }

  function render(){
    var leftHtml = st.left.map(function(i){
      var cls = 'mt-chip' + (isDone(i) ? ' done' : (st.sel === i ? ' sel' : ''));
      return '<div class="' + cls + '" data-side="a" data-i="' + i + '">' + L(PAIRS[i].a) + '</div>';
    }).join('');
    var rightHtml = st.right.map(function(i){
      var cls = 'mt-chip' + (isDone(i) ? ' done' : '');
      return '<div class="' + cls + '" data-side="b" data-i="' + i + '">' + L(PAIRS[i].b) + '</div>';
    }).join('');
    host.innerHTML =
      '<div class="gw-h iw-tag">' + L({ es:'La herencia compartida', en:'The shared inheritance' }) + '</div>' +
      '<div class="gw-q">' + L({ es:'¿De quién viene cada cosa que usas o que ves?', en:'Where does each thing you use or see come from?' }) + '</div>' +
      '<div class="gw-mini iw-sub">' + L({
        es:'Toca algo de la izquierda y después el grupo que lo aportó. Los pares que aciertes se quedan fijos.',
        en:'Tap something on the left and then the group that contributed it. The pairs you get right stay fixed.'
      }) + '</div>' +
      '<div class="mt-wrap">' +
        '<div class="mt-col"><div class="mt-lbl">' + L({ es:'Lo que hay en tu vida diaria', en:'What there is in your daily life' }) + '</div>' + leftHtml + '</div>' +
        '<div class="mt-col"><div class="mt-lbl">' + L({ es:'Quién lo aportó', en:'Who contributed it' }) + '</div>' + rightHtml + '</div>' +
      '</div>' +
      '<div class="gw-fb"></div>';
    host.querySelectorAll('.mt-chip').forEach(function(el){
      el.addEventListener('click', function(){ tap(el.getAttribute('data-side'), parseInt(el.getAttribute('data-i'), 10)); });
    });
  }

  function finish(){
    say(host, 'good', '🎉 ' + L({
      es:'Herencia completa. Nada de esto vino de un solo lugar: la lengua que hablas, lo que comes y lo que ves en la calle se armó con lo que aportaron pueblos originarios, comunidades afromexicanas, familias migrantes y jóvenes de la ciudad.',
      en:'Inheritance complete. None of this came from one single place: the language you speak, what you eat and what you see in the street were built with what original peoples, Afro-Mexican communities, migrant families and young people in the city contributed.'
    }));
  }

  function tap(side, i){
    if (isDone(i)) return;
    if (side === 'a'){
      st.sel = (st.sel === i ? null : i);
      var keep = host.querySelector('.gw-fb').innerHTML;
      render();
      if (st.sel !== null){
        say(host, 'warm', L({ es:'Elegiste ', en:'You picked ' }) + '<b>' + L(PAIRS[st.sel].a) + '</b>. ' +
          L({ es:'Ahora toca el grupo del que proviene.', en:'Now tap the group it comes from.' }));
      } else if (keep){ say(host, '', keep); }
      return;
    }
    if (st.sel === null){
      say(host, 'warm', L({
        es:'Primero elige algo de la izquierda: la pregunta es de dónde viene, así que necesitas saber de qué estamos hablando.',
        en:'Pick something on the left first: the question is where it comes from, so you need to know what we are talking about.'
      }));
      return;
    }
    var chosen = st.sel;
    if (i === chosen){
      st.done.push(chosen); st.sel = null; st.tries = 0;
      render();
      if (st.done.length >= N){ finish(); return; }
      say(host, 'good', '✓ ' + L({ es:'Eso ', en:'That ' }) + L(PAIRS[chosen].cue) + '.');
      return;
    }
    st.tries++;
    if (st.tries >= 3){
      st.done.push(chosen); st.sel = null; st.tries = 0;
      render();
      say(host, 'warm', L({ es:'Le corresponde: ', en:'The right one is: ' }) + '<b>' + L(PAIRS[chosen].b) + '</b>. ' +
        L({ es:'Eso ', en:'That ' }) + L(PAIRS[chosen].cue) + '.');
      if (st.done.length >= N) finish();
      return;
    }
    say(host, 'miss', L({ es:'Todavía no. Eso ', en:'Not yet. That ' }) + L(PAIRS[chosen].cue) +
      L({ es:', vuelve a elegir.', en:', choose again.' }));
  }

  render();
  say(host, '', L({
    es:'Cinco cosas de todos los días y cinco grupos, revueltos.',
    en:'Five everyday things and five groups, shuffled.'
  }));
}

/* ══════════════════════════════════════════════════════════════════════════

function wSemaforo(rng, host){
  var SC = [
    { s:{ es:'En el salón, un compañero imita el acento de una alumna que llegó de otra región y varios se ríen.',

    { s:{ es:'Alguien dice en la escuela que hablar una lengua originaria en el recreo suena mal y que mejor no lo hagan.',

      o:[ { t:{ es:'Ofrecerte a repasar con él y pedir a la maestra materiales en las dos lenguas', en:'Offer to go over the lessons with him and ask the teacher for materials in both languages' }, d:2,
            f:{ es:'Así puede seguir la clase sin tener que renunciar a la lengua de su casa.', en:'That way he can follow the class without having to give up the language of his home.' } },
          { t:{ es:'Sentarlo hasta atrás para que su ritmo no atrase al resto del grupo', en:'Seat him at the back so his pace does not slow the rest of the group down' }, d:-2,

            f:{ es:'Mientras tanto pierde meses de clase, y eso ya es una desigualdad.', en:'Meanwhile he loses months of class, and that is already an inequality.' } } ] }
  ];
  var order = permOf(SC.length, rng).slice(0, 4);
  var st = { i: 0, tries: 0, level: 5, busy: false, done: false, perm: null };

  function bar(){
    var cls = st.level >= 7 ? '' : (st.level >= 4 ? ' mid' : ' low');
    return '<div class="sm-bar">' +
      '<div class="sm-lbl"><span>' + L({ es:'Convivencia del grupo', en:'How the group gets along' }) + '</span>' +
      '<span class="sm-val">' + st.level + ' / 10</span></div>' +
      '<div class="sm-track"><div class="sm-fill' + cls + '" style="width:' + (st.level * 10) + '%"></div></div></div>';
  }

  function render(){
    st.busy = false;
    if (st.done){
      var cierre = st.level >= 8
        ? L({ es:'Terminaste con el medidor arriba. En cada escena elegiste nombrar lo que pasaba y quedarte del lado de quien se estaba quedando fuera.',
              en:'You finished with the meter high. In each scene you chose to name what was happening and to stand with whoever was being left out.' })
        : (st.level >= 4
          ? L({ es:'Terminaste a media tabla. Fíjate en las escenas donde elegiste esperar: nadie salió lastimado por ti, pero la situación se quedó igual que como empezó.',
                en:'You finished mid table. Look at the scenes where you chose to wait: nobody was hurt by you, but the situation stayed exactly as it started.' })
          : L({ es:'El medidor terminó abajo. Vuelve a leer las respuestas que elegiste: varias piden a la persona señalada que se esconda, en lugar de pedir que dejen de señalarla.',
                en:'The meter ended low. Read again the answers you chose: several ask the person singled out to hide, instead of asking the others to stop singling them out.' }));
      host.innerHTML =
        '<div class="gw-h iw-tag">' + L({ es:'El medidor de la convivencia', en:'The meter of getting along' }) + '</div>' +
        '<div class="gw-q">' + L({ es:'Cuatro escenas, cuatro decisiones', en:'Four scenes, four decisions' }) + '</div>' +
        bar() +
        '<div class="gw-fb good">🎉 ' + cierre + '</div>';
      return;
    }
    var sc = SC[order[st.i]];
    if (!st.perm) st.perm = permOf(sc.o.length, rng);
    host.innerHTML =
      '<div class="gw-h iw-tag">' + L({ es:'El medidor de la convivencia', en:'The meter of getting along' }) + '</div>' +
      '<div class="gw-q">' + L({ es:'¿Qué haces tú en esta escena?', en:'What do you do in this scene?' }) + '</div>' +
      '<div class="gw-mini iw-sub">' + L({
        es:'Elige una respuesta y mira cómo se mueve el medidor. Si el medidor baja, puedes volver a elegir en la misma escena.',
        en:'Choose an answer and watch the meter move. If the meter goes down, you can choose again in the same scene.'
      }) + '</div>' +
      '<div class="mp-prog">' + (st.i + 1) + ' / ' + order.length + '</div>' +
      '<div class="sm-scene">' + L(sc.s) + '</div>' +
      '<div class="sm-opts">' + st.perm.map(function(oi){
        return '<button class="sm-opt" data-o="' + oi + '">' + L(sc.o[oi].t) + '</button>';
      }).join('') + '</div>' +
      bar() +
      '<div class="gw-fb"></div>';
    host.querySelectorAll('.sm-opt').forEach(function(b){
      b.addEventListener('click', function(){ pick(parseInt(b.getAttribute('data-o'), 10)); });
    });
  }

  function advance(){
    st.busy = true;
    st.i++; st.tries = 0; st.perm = null;
    if (st.i >= order.length) st.done = true;
    setTimeout(render, 1500);
  }

  function pick(oi){
    if (st.busy || st.done) return;
    var sc = SC[order[st.i]];
    var op = sc.o[oi];
    st.level = Math.max(0, Math.min(10, st.level + op.d));
    var fbHtml = (op.d > 0 ? '✓ ' : '') + L(op.f);
    var cls = op.d > 0 ? 'good' : (op.d < 0 ? 'miss' : 'warm');
    render();
    say(host, cls, fbHtml);
    if (op.d > 0){ advance(); return; }
    st.tries++;
    if (st.tries >= 3){
      var best = 0, k;
      for (k = 0; k < sc.o.length; k++) if (sc.o[k].d > sc.o[best].d) best = k;
      say(host, 'warm', L({ es:'La respuesta que sostiene la convivencia es: ', en:'The answer that holds things together is: ' }) +
        '<b>' + L(sc.o[best].t) + '</b>. ' + L(sc.o[best].f));
      advance();
      return;
    }
    say(host, cls, fbHtml + ' ' + L({ es:'Prueba otra respuesta para esta misma escena.', en:'Try another answer for this same scene.' }));
  }

  render();
  say(host, '', L({
    es:'El medidor empieza a la mitad. Cada decisión lo mueve.',
    en:'The meter starts halfway. Every decision moves it.'
  }));
}

function addProblem(rng, v){
  var idx = problems.length;
  var opts = L(v.opts).slice();
  var correctVal = opts[v.ci];
  var sh = shuffle(opts, rng);
  var prob = {
    title: L(v.title),
    questionText: L(v.q),
    fn: '',
    hint: L(v.hint),
    explanation: L(v.exp),
    options: sh,
    correctIdx: sh.indexOf(correctVal),
    showWork: !!v.showWork,
    studentChoice: null,
    pendingChoice: null
  };
  problems.push(prob);
  buildOneCard(prob, idx);
}
