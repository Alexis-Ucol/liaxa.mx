function mkP7(rng){
  var C = 1000 * ri(rng, 12, 25), pl = pk(rng, [3, 4]);
  var a = ri(rng, 13, 20) / 100, b = a - pk(rng, [1, 2, 4, 6]) / 100;
  var MA = montoSimple(C, a, pl), MB = montoComp(C, b, pl);
  if (Math.abs(MA - MB) < C * 0.006){ b = b - 0.02; MB = montoComp(C, b, pl); }
  var barato = (MA < MB) ? 'A' : 'B', caro = (MA < MB) ? 'B' : 'A';
  var dif = Math.abs(MA - MB);
  var difFalsa = Math.abs(MA - montoSimple(C, b, pl));
  if (Math.abs(difFalsa - dif) < dif * 0.08) difFalsa = dif * 1.4 + 90;
  if (ri(rng, 1, 2) === 1){
    return {
      title:{ es:'Dos planes para el mismo equipo', en:'Two plans for the same equipment' },
      q:{ es:'Un taller compra maquinaria por ' + money(C) + ' a ' + anios(pl) + '. El plan A cobra interés simple de ' + pct1(a) + ' anual y el plan B cobra interés compuesto de ' + pct1(b) + ' anual ' + freqPhrase(1) + '. ¿Qué plan resulta más barato y por cuánto?',
          en:'A workshop buys machinery for ' + money(C) + ' over ' + anios(pl) + '. Plan A charges simple interest of ' + pct1(a) + ' per year and plan B charges compound interest of ' + pct1(b) + ' per year ' + freqPhrase(1) + '. Which plan works out cheaper and by how much?' },
      hint:{ es:'No se comparan las tasas, se comparan los montos finales: M = C(1 + i · t) para el plan simple y M = C(1 + i)^n para el compuesto. La diferencia es la resta de los dos montos.',
             en:'You do not compare the rates, you compare the final amounts: M = C(1 + i · t) for the simple plan and M = C(1 + i)^n for the compound one. The difference is the subtraction of the two amounts.' },
      exp:{ es:'Plan A: ' + money(MA) + '. Plan B: ' + money(MB) + '. El plan ' + barato + ' es más barato por ' + money(dif) + '. Una tasa menor no garantiza pagar menos: depende también de cómo se capitalice y del plazo.',
            en:'Plan A: ' + money(MA) + '. Plan B: ' + money(MB) + '. Plan ' + barato + ' is cheaper by ' + money(dif) + '. A lower rate does not guarantee paying less: it also depends on how it compounds and on the term.' },
      opts:{ es: [planTxt(barato, dif, false), planTxt(caro, dif, false), planTxt(barato, difFalsa, false), planTxt(caro, difFalsa, false)],
             en: [planTxt(barato, dif, false), planTxt(caro, dif, false), planTxt(barato, difFalsa, false), planTxt(caro, difFalsa, false)] },
      ci: 0, showWork: true
    };
  }
  var menor = Math.min(MA, MB), mayor = Math.max(MA, MB);
  return {
    title:{ es:'El total que se termina pagando', en:'The total that ends up being paid' },
    q:{ es:'Para financiar ' + money(C) + ' a ' + anios(pl) + ', el plan A aplica interés simple de ' + pct1(a) + ' anual y el plan B interés compuesto de ' + pct1(b) + ' anual ' + freqPhrase(1) + '. ¿Cuánto se paga en total si se elige el plan más conveniente?',
        en:'To finance ' + money(C) + ' over ' + anios(pl) + ', plan A applies simple interest of ' + pct1(a) + ' per year and plan B compound interest of ' + pct1(b) + ' per year ' + freqPhrase(1) + '. How much is paid in total if the more convenient plan is chosen?' },
    hint:{ es:'Se calculan los dos montos, M = C(1 + i · t) y M = C(1 + i)^n, y se elige el menor: ese es el total que se desembolsa.',
           en:'Work out both amounts, M = C(1 + i · t) and M = C(1 + i)^n, and pick the smaller one: that is the total paid out.' },
    exp:{ es:'Plan A: ' + money(MA) + '. Plan B: ' + money(MB) + '. Conviene el plan ' + barato + ', con un desembolso total de ' + money(menor) + '.',
          en:'Plan A: ' + money(MA) + '. Plan B: ' + money(MB) + '. Plan ' + barato + ' is preferable, with a total outlay of ' + money(menor) + '.' },
    opts: optsFrom([menor, mayor, montoSimple(C, b, pl), montoComp(C, a, pl)], money, Math.max(60, C * 0.014)),
    ci: 0, showWork: true
  };
}

function mkP8(rng){
  var C = 1000 * ri(rng, 15, 30), pl = ri(rng, 3, 5);
  var iA = ri(rng, 90, 130) / 1000;
  var iB = iA + pk(rng, [0.002, 0.005, 0.008]);
  var MA = montoComp(C, iA, pl, 12), MB = montoComp(C, iB, pl, 1);
  if (Math.abs(MA - MB) < C * 0.004){ iB = iB + 0.006; MB = montoComp(C, iB, pl, 1); }
  var gana = (MA > MB) ? 'A' : 'B', pierde = (MA > MB) ? 'B' : 'A';
  var dif = Math.abs(MA - MB);
  var difFalsa = Math.abs(montoComp(C, iA, pl, 1) - MB);
  if (Math.abs(difFalsa - dif) < dif * 0.08) difFalsa = dif * 1.5 + 120;
  if (ri(rng, 1, 2) === 1){
    return {
      title:{ es:'Dos cuentas de inversión', en:'Two investment accounts' },
      q:{ es:'Se colocan ' + money(C) + ' durante ' + anios(pl) + '. La opción A ofrece ' + pct1(iA) + ' anual ' + freqPhrase(12) + ' y la opción B ofrece ' + pct1(iB) + ' anual ' + freqPhrase(1) + '. ¿Cuál entrega más al final y por cuánto?',
          en:'An amount of ' + money(C) + ' is placed for ' + anios(pl) + '. Option A offers ' + pct1(iA) + ' per year ' + freqPhrase(12) + ' and option B offers ' + pct1(iB) + ' per year ' + freqPhrase(1) + '. Which one delivers more at the end and by how much?' },
      hint:{ es:'Se lleva cada opción a su monto final con M = C(1 + i/m)^(m · t), usando m = 12 en una y m = 1 en la otra, y se restan. También se pueden comparar sus tasas efectivas anuales.',
             en:'Take each option to its final amount with M = C(1 + i/m)^(m · t), using m = 12 in one and m = 1 in the other, and subtract. You can also compare their effective annual rates.' },
      exp:{ es:'Opción A: ' + money(MA) + ' (tasa efectiva ' + pctv(tasaEfectiva(iA, 12)) + '). Opción B: ' + money(MB) + ' (tasa efectiva ' + pctv(iB) + '). Gana la opción ' + gana + ' por ' + money(dif) + '.',
            en:'Option A: ' + money(MA) + ' (effective rate ' + pctv(tasaEfectiva(iA, 12)) + '). Option B: ' + money(MB) + ' (effective rate ' + pctv(iB) + '). Option ' + gana + ' wins by ' + money(dif) + '.' },
      opts:{ es: [planTxt(gana, dif, true), planTxt(pierde, dif, true), planTxt(gana, difFalsa, true), planTxt(pierde, difFalsa, true)],
             en: [planTxt(gana, dif, true), planTxt(pierde, dif, true), planTxt(gana, difFalsa, true), planTxt(pierde, difFalsa, true)] },
      ci: 0, showWork: true
    };
  }
  var mejor = Math.max(MA, MB), peor = Math.min(MA, MB);
  return {
    title:{ es:'Dónde termina el dinero', en:'Where the money ends up' },
    q:{ es:'Un ahorro de ' + money(C) + ' se deja ' + anios(pl) + '. La opción A paga ' + pct1(iA) + ' anual ' + freqPhrase(12) + ' y la opción B paga ' + pct1(iB) + ' anual ' + freqPhrase(1) + '. ¿Cuánto dinero hay al final en la opción que rinde más?',
        en:'A saving of ' + money(C) + ' is left for ' + anios(pl) + '. Option A pays ' + pct1(iA) + ' per year ' + freqPhrase(12) + ' and option B pays ' + pct1(iB) + ' per year ' + freqPhrase(1) + '. How much money is there at the end in the option that yields more?' },
    hint:{ es:'Cada opción se evalúa con M = C(1 + i/m)^(m · t) y se conserva el monto mayor. La tasa anunciada más alta no siempre gana.',
           en:'Evaluate each option with M = C(1 + i/m)^(m · t) and keep the larger amount. The higher advertised rate does not always win.' },
    exp:{ es:'Opción A: ' + money(MA) + '. Opción B: ' + money(MB) + '. Rinde más la opción ' + gana + ', que termina con ' + money(mejor) + '.',
          en:'Option A: ' + money(MA) + '. Option B: ' + money(MB) + '. Option ' + gana + ' yields more, ending with ' + money(mejor) + '.' },
    opts: optsFrom([mejor, peor, montoComp(C, iA, pl, 1), montoSimple(C, iB, pl)], money, Math.max(70, C * 0.012)),
    ci: 0, showWork: true
  };
}

function mkP9(rng){
  if (ri(rng, 1, 2) === 1){
    return {
      title:{ es:'Un solo periodo', en:'A single period' },
      q:{ es:'Dos depósitos idénticos se colocan durante un año exacto a la misma tasa anual. Uno gana interés simple y el otro interés compuesto ' + freqPhrase(1) + '. ¿Qué relación hay entre los dos montos finales?',
          en:'Two identical deposits are placed for exactly one year at the same annual rate. One earns simple interest and the other compound interest ' + freqPhrase(1) + '. What is the relationship between the two final amounts?' },
      hint:{ es:'Pregúntate cuántas veces alcanzan a reinvertirse los intereses en ese plazo. El interés compuesto se separa del simple cuando ya hay intereses previos sobre los que calcular.',
             en:'Ask yourself how many times the interest manages to be reinvested over that term. Compound interest pulls away from simple interest only once there is earlier interest to calculate on.' },
      exp:{ es:'Son iguales. Con una sola capitalización, C(1 + i · 1) y C(1 + i)^1 son la misma expresión: los intereses no llegan a reinvertirse ni una vez. La ventaja del compuesto aparece a partir del segundo periodo.',
            en:'They are equal. With a single compounding period, C(1 + i · 1) and C(1 + i)^1 are the same expression: the interest never gets reinvested even once. The advantage of compounding appears from the second period onwards.' },
      opts:{ es: ['Los dos montos son exactamente iguales, porque en un solo periodo los intereses aún no se reinvierten',
                  'El monto compuesto es mayor, porque el interés compuesto siempre crece más rápido que el simple',
                  'El monto simple es mayor, porque el compuesto descuenta la reinversión de los intereses',
                  'Depende del capital: con capitales grandes gana el compuesto y con capitales pequeños el simple'],
             en: ['The two amounts are exactly equal, because in a single period the interest is not yet reinvested',
                  'The compound amount is larger, because compound interest always grows faster than simple interest',
                  'The simple amount is larger, because compounding discounts the reinvestment of the interest',
                  'It depends on the capital: with large capitals compounding wins and with small ones simple interest does'] },
      ci: 0, showWork: false
    };
  }
  return {
    title:{ es:'La misma tasa anunciada', en:'The same advertised rate' },
    q:{ es:'Dos créditos tienen el mismo capital, el mismo plazo y la misma tasa nominal anual, pero uno capitaliza cada mes y el otro una sola vez al año. ¿Qué ocurre con lo que se termina pagando?',
        en:'Two loans have the same capital, the same term and the same nominal annual rate, but one compounds every month and the other just once a year. What happens with the amount finally paid?' },
    hint:{ es:'Compara las tasas efectivas anuales de los dos créditos. Capitalizar más seguido reparte la misma tasa nominal en periodos más cortos, pero cada uno se aplica sobre un saldo distinto.',
           en:'Compare the effective annual rates of the two loans. Compounding more often splits the same nominal rate into shorter periods, but each one applies to a different balance.' },
    exp:{ es:'Paga más el que capitaliza cada mes: su tasa efectiva anual es mayor porque los intereses se incorporan al saldo antes y empiezan a generar intereses ellos mismos. La tasa nominal por sí sola no basta para comparar.',
          en:'The one compounding every month pays more: its effective annual rate is higher because the interest joins the balance sooner and starts generating interest itself. The nominal rate on its own is not enough for a comparison.' },
    opts:{ es: ['Paga más el que capitaliza cada mes, porque sus intereses empiezan a generar intereses antes',
                'Paga más el que capitaliza una vez al año, porque acumula los intereses en un solo cobro grande',
                'Los dos pagan lo mismo, porque la tasa nominal anual es idéntica en ambos créditos',
                'Los dos pagan lo mismo, porque el número de periodos y la tasa de cada periodo se compensan'],
           en: ['The monthly compounding one pays more, because its interest starts generating interest sooner',
                'The yearly compounding one pays more, because it piles the interest into a single large charge',
                'Both pay the same, because the nominal annual rate is identical in both loans',
                'Both pay the same, because the number of periods and the rate of each period cancel out'] },
    ci: 0, showWork: false
  };
}

function mkP10(rng){
  var i = ri(rng, 6, 14) / 100, n = ri(rng, 3, 6);
  var meta = 5000 * ri(rng, 4, 14);
  var C = meta / Math.pow(1 + i, n);
  if (ri(rng, 1, 2) === 1){
    return {
      title:{ es:'Cuánto hay que depositar hoy', en:'How much to deposit today' },
      q:{ es:'Una familia quiere tener ' + money(meta) + ' dentro de ' + anios(n) + ' para la inscripción de la universidad. El banco paga ' + pct1(i) + ' anual con interés compuesto ' + freqPhrase(1) + '. ¿Cuánto debe depositar hoy en un solo pago?',
          en:'A family wants to have ' + money(meta) + ' in ' + anios(n) + ' for a university enrolment. The bank pays ' + pct1(i) + ' per year with compound interest ' + freqPhrase(1) + '. How much should they deposit today in a single payment?' },
      hint:{ es:'Es la operación inversa del monto: si M = C(1 + i)^n, entonces C = M / (1 + i)^n. Se divide entre el factor de crecimiento, no se multiplica.',
             en:'It is the inverse operation of the amount: if M = C(1 + i)^n, then C = M / (1 + i)^n. You divide by the growth factor, you do not multiply.' },
      exp:{ es:'C = ' + num0(meta) + ' / (1 + ' + (i).toFixed(2) + ')^' + n + ' = ' + money(C) + '. Comprobación: ese capital crece hasta ' + money(montoComp(C, i, n)) + ' en ' + anios(n) + '.',
            en:'C = ' + num0(meta) + ' / (1 + ' + (i).toFixed(2) + ')^' + n + ' = ' + money(C) + '. Check: that capital grows to ' + money(montoComp(C, i, n)) + ' in ' + anios(n) + '.' },
      opts: optsFrom([C, meta / (1 + i * n), meta / (1 + i), meta - meta * i * n], money, Math.max(80, meta * 0.012)),
      ci: 0, showWork: true
    };
  }
  var C2 = 5000 * ri(rng, 3, 10);
  var M2 = 1000 * Math.round(C2 * Math.pow(1 + i, n) / 1000);
  var iReal = Math.pow(M2 / C2, 1 / n) - 1;
  return {
    title:{ es:'Qué tasa lo hizo posible', en:'What rate made it possible' },
    q:{ es:'Una inversión de ' + money(C2) + ' se convirtió en ' + money(M2) + ' después de ' + anios(n) + ' con interés compuesto ' + freqPhrase(1) + '. ¿Qué tasa anual se aplicó?',
        en:'An investment of ' + money(C2) + ' turned into ' + money(M2) + ' after ' + anios(n) + ' with compound interest ' + freqPhrase(1) + '. What annual rate was applied?' },
    hint:{ es:'De M = C(1 + i)^n se despeja la tasa con una raíz de índice n: i = (M/C)^(1/n) − 1. Dividir el crecimiento total entre los años daría una tasa simple, no compuesta.',
           en:'From M = C(1 + i)^n the rate is isolated with an nth root: i = (M/C)^(1/n) − 1. Dividing the total growth by the years would give a simple rate, not a compound one.' },
    exp:{ es:'M/C = ' + (M2 / C2).toFixed(4) + '. La raíz de índice ' + n + ' da ' + Math.pow(M2 / C2, 1 / n).toFixed(5) + ', y al restar 1 queda ' + pctv(iReal) + ' anual.',
          en:'M/C = ' + (M2 / C2).toFixed(4) + '. The ' + n + 'th root gives ' + Math.pow(M2 / C2, 1 / n).toFixed(5) + ', and subtracting 1 leaves ' + pctv(iReal) + ' per year.' },
    opts: optsFrom([iReal, (M2 / C2 - 1) / n, M2 / C2 - 1, (M2 - C2) / (M2 * n)], pctv, 0.0055),
    ci: 0, showWork: true
  };
}

/* ══════════════════════════════════════════════════════════════════════════
   buildLesson :: concepto, manipulativo, problema, alternados (Rule 1)
   ══════════════════════════════════════════════════════════════════════════ */
function buildLesson(rng){
  injectGuideCSS();
  problems = [];
  answeredCount = 0;
  correctCount = 0;
  var body = document.getElementById('lessonBody');
  body.innerHTML = '';
  var pf = document.getElementById('progFill');
  if (pf) pf.style.width = '0%';

  /* ── Apertura ── */
  sec(
    L({ es:'Punto de partida', en:'Starting point' }),
    L({ es:'El dinero tiene fecha', en:'Money carries a date' }),
    '<p>' + L({
      es:'Mil pesos hoy y mil pesos dentro de tres años no son la misma cosa, aunque el billete se vea igual. Entre una fecha y otra hay algo que se cobra: el precio de usar dinero ajeno durante un tiempo. Ese precio se llama interés, y toda la matemática financiera consiste en calcularlo bien para poder decidir con números y no con la impresión que deja un anuncio.',
      en:'A thousand pesos today and a thousand pesos in three years are not the same thing, even if the note looks identical. Between one date and the other something gets charged: the price of using somebody else money for a while. That price is called interest, and the whole of financial mathematics consists of working it out properly in order to decide with numbers rather than with the impression an advert leaves.'
    }) + '</p>' +
    '<div class="callout"><p><strong>' + L({ es:'Idea clave: ', en:'Key idea: ' }) + '</strong>' + L({
      es:'una tasa no dice por sí sola cuánto se paga. Faltan tres datos que la acompañan siempre: sobre qué capital se aplica, durante cuánto tiempo y cada cuánto los intereses se suman al capital. En esta guía vas a mover esos tres datos y ver cómo cambia el resultado.',
      en:'A rate does not tell you on its own how much gets paid. Three pieces of data always come with it: what capital it applies to, for how long, and how often the interest joins the capital. In this guide you are going to move those three and watch how the result changes.'
    }) + '</p></div>'
  );

  /* ══ CONCEPTO 1 :: interés simple ══ */
  var s1 = sec(
    L({ es:'Concepto 1', en:'Concept 1' }),
    L({ es:'Interés simple: la misma franja cada año', en:'Simple interest: the same band every year' }),
    '<p>' + L({
      es:'En el régimen de interés simple, los intereses se calculan siempre sobre el capital inicial, sin importar cuántos periodos hayan pasado. Si se prestan 10 000 pesos al 12% anual, cada año se generan 1 200 pesos y nada más: los intereses del primer año no participan en el cálculo del segundo. El capital es la cantidad que se presta o se invierte, la tasa es la fracción de ese capital que se cobra por periodo, y el tiempo se mide en la misma unidad que la tasa.',
      en:'Under simple interest, interest is always worked out on the initial capital, no matter how many periods have gone by. If 10,000 pesos are lent at 12% per year, each year generates 1,200 pesos and nothing else: the first year interest plays no part in the second year calculation. The capital is the amount lent or invested, the rate is the fraction of that capital charged per period, and time is measured in the same unit as the rate.'
    }) + '</p>' +
    '<p>' + L({
      es:'Por eso el crecimiento es lineal: el monto sube en línea recta y el interés total es proporcional al tiempo. Una consecuencia práctica es que la tasa y el plazo son intercambiables. La mitad de la tasa durante el doble de tiempo produce exactamente el mismo interés. La condición que nunca se puede saltar es que la tasa y el tiempo hablen la misma unidad: una tasa anual pide años, una tasa mensual pide meses.',
      en:'That is why the growth is linear: the amount rises in a straight line and the total interest is proportional to time. One practical consequence is that rate and term are interchangeable. Half the rate for twice the time produces exactly the same interest. The condition that can never be skipped is that rate and time speak the same unit: an annual rate asks for years, a monthly rate asks for months.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Capital', en:'Capital' }), 'C', L({ es:'lo que se presta o se invierte al inicio', en:'what is lent or invested at the start' })) +
      rcard(L({ es:'Tasa', en:'Rate' }), 'i', L({ es:'en decimal: 12% anual es i = 0.12', en:'in decimal form: 12% per year is i = 0.12' })) +
      rcard(L({ es:'Interés simple', en:'Simple interest' }), 'I = C · i · t', L({ es:'siempre sobre el capital inicial', en:'always on the initial capital' })) +
      rcard(L({ es:'Monto', en:'Amount' }), 'M = C(1 + i · t)', L({ es:'capital más intereses', en:'capital plus interest' })) +
    '</div>'
  );
  wSimple(rng, widgetHost(s1, 'wBoxSimple', 'simple'));
  addProblem(rng, mkP1(rng));
  addProblem(rng, mkP2(rng));

  /* ══ CONCEPTO 2 :: interés compuesto ══ */
  var s2 = sec(
    L({ es:'Concepto 2', en:'Concept 2' }),
    L({ es:'Interés compuesto: los intereses se ponen a trabajar', en:'Compound interest: the interest goes to work' }),
    '<p>' + L({
      es:'En el régimen de interés compuesto, al terminar cada periodo los intereses se suman al capital y en el periodo siguiente el cálculo se hace sobre esa cantidad ya aumentada. El capital deja de ser un número fijo y se convierte en una base que crece. Multiplicar por el factor (1 + i) una vez por periodo lleva directamente a la fórmula del monto compuesto.',
      en:'Under compound interest, at the end of each period the interest is added to the capital and in the next period the calculation is made on that already increased amount. The capital stops being a fixed number and becomes a base that grows. Multiplying by the factor (1 + i) once per period leads straight to the compound amount formula.'
    }) + '</p>' +
    '<p>' + L({
      es:'La diferencia con el interés simple no está en la fórmula sino en la forma de la curva. El simple suma, el compuesto multiplica. Al principio la distancia entre los dos montos es casi imperceptible y resulta fácil ignorarla, pero cada periodo la base sobre la que se calcula es mayor que la anterior, de modo que la brecha se abre cada vez más rápido. Ese comportamiento es la razón por la que un plazo largo cambia por completo el resultado de una deuda o de un ahorro.',
      en:'The difference from simple interest is not in the formula but in the shape of the curve. Simple interest adds, compound interest multiplies. At first the distance between the two amounts is almost imperceptible and easy to ignore, but each period the base it is calculated on is larger than the one before, so the gap opens faster and faster. That behaviour is why a long term completely changes the outcome of a debt or of a saving.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Factor', en:'Factor' }), '(1 + i)', L({ es:'multiplica una vez por periodo', en:'multiplies once per period' })) +
      rcard(L({ es:'Monto compuesto', en:'Compound amount' }), 'M = C(1 + i)ⁿ', L({ es:'n es el número de capitalizaciones', en:'n is the number of compounding periods' })) +
      rcard(L({ es:'Interés', en:'Interest' }), 'I = M − C', L({ es:'no se calcula directo, sale del monto', en:'not direct, it comes out of the amount' })) +
      rcard(L({ es:'Crecimiento', en:'Growth' }), L({ es:'multiplicativo', en:'multiplicative' }), L({ es:'la brecha con el simple se acelera', en:'the gap with simple interest speeds up' })) +
    '</div>'
  );
  wCrece(rng, widgetHost(s2, 'wBoxCrece', 'crecimiento'));
  addProblem(rng, mkP3(rng));
  addProblem(rng, mkP4(rng));

  /* ══ CONCEPTO 3 :: capitalización y tasa efectiva ══ */
  var s3 = sec(
    L({ es:'Concepto 3', en:'Concept 3' }),
    L({ es:'Cada cuánto se capitaliza, y la tasa que no se anuncia', en:'How often it compounds, and the rate nobody advertises' }),
    '<p>' + L({
      es:'Casi ningún contrato capitaliza una sola vez al año. La tasa que aparece en el anuncio es una tasa nominal anual, y junto a ella viene la frecuencia de capitalización: cada mes, cada trimestre, cada día. La tasa nominal se reparte entre los periodos del año, de manera que a cada periodo le toca i dividida entre m, y el exponente ya no cuenta años sino periodos completos, m multiplicado por t.',
      en:'Almost no contract compounds just once a year. The rate in the advert is a nominal annual rate, and alongside it comes the compounding frequency: every month, every quarter, every day. The nominal rate is split among the periods of the year, so each period gets i divided by m, and the exponent no longer counts years but whole periods, m times t.'
    }) + '</p>' +
    '<p>' + L({
      es:'Repartir la tasa en pedazos más pequeños no es neutral, porque cada pedazo se aplica sobre un saldo que ya creció. Dos contratos con la misma tasa nominal terminan en montos distintos si capitalizan con distinta frecuencia. Para comparar sin caer en la trampa existe la tasa efectiva anual, que responde a una sola pregunta: en un año completo, ¿en cuánto se convierte un peso? Esa es la cifra que permite poner dos ofertas lado a lado.',
      en:'Splitting the rate into smaller pieces is not neutral, because each piece applies to a balance that has already grown. Two contracts with the same nominal rate end up at different amounts if they compound at different frequencies. To compare without falling into the trap there is the effective annual rate, which answers a single question: over a full year, what does one peso turn into? That is the figure that lets you set two offers side by side.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Tasa por periodo', en:'Rate per period' }), 'i / m', L({ es:'m capitalizaciones por año', en:'m compounding periods per year' })) +
      rcard(L({ es:'Periodos totales', en:'Total periods' }), 'm · t', L({ es:'el exponente cuenta periodos', en:'the exponent counts periods' })) +
      rcard(L({ es:'Monto', en:'Amount' }), 'M = C(1 + i/m)^(m·t)', L({ es:'el caso general del compuesto', en:'the general compound case' })) +
      rcard(L({ es:'Tasa efectiva anual', en:'Effective annual rate' }), 'iₑ = (1 + i/m)^m − 1', L({ es:'la cifra con la que sí se compara', en:'the figure that really compares' })) +
    '</div>'
  );
  wCapitaliza(rng, widgetHost(s3, 'wBoxCapitaliza', 'capitaliza'));
  addProblem(rng, mkP5(rng));
  addProblem(rng, mkP6(rng));

  /* ══ CONCEPTO 4 :: comparar opciones ══ */
  var s4 = sec(
    L({ es:'Concepto 4', en:'Concept 4' }),
    L({ es:'Comparar dos ofertas sin dejarse llevar por la tasa', en:'Comparing two offers without being led by the rate' }),
    '<p>' + L({
      es:'Comparar opciones financieras exige llevarlas a un terreno común. Dos ofertas solo se pueden enfrentar si se evalúan con el mismo capital, en la misma fecha y con la misma medida. Las dos medidas que sirven son el monto final, es decir el total que se recibe o se desembolsa, y la tasa efectiva anual, que resume el costo real de un año. Comparar tasas nominales sueltas, en cambio, lleva a conclusiones equivocadas con frecuencia.',
      en:'Comparing financial options demands bringing them onto common ground. Two offers can only be set against each other if they are evaluated with the same capital, on the same date and with the same measure. The two measures that work are the final amount, that is the total received or paid out, and the effective annual rate, which sums up the real cost of one year. Comparing loose nominal rates, by contrast, frequently leads to wrong conclusions.'
    }) + '</p>' +
    '<p>' + L({
      es:'Por eso una tasa más baja puede salir más cara y una más alta puede salir más barata: el régimen, la frecuencia de capitalización y el plazo pesan tanto como el número anunciado. La pregunta que resuelve la comparación no es cuál tasa suena mejor, sino cuánto dinero queda en la mano al final.',
      en:'That is why a lower rate can turn out dearer and a higher one cheaper: the regime, the compounding frequency and the term weigh as much as the advertised number. The question that settles the comparison is not which rate sounds better, but how much money is left in hand at the end.'
    }) + '</p>' +
    '<div class="callout"><p>' + L({
      es:'Dos ofertas se comparan igualando el terreno: mismo capital, mismo plazo y una sola medida, el monto final o la tasa efectiva anual. Todo lo demás es publicidad.',
      en:'Two offers are compared by levelling the ground: same capital, same term and a single measure, the final amount or the effective annual rate. Everything else is advertising.'
    }) + '</p></div>'
  );
  wIguala(rng, widgetHost(s4, 'wBoxIguala', 'compara'));
  addProblem(rng, mkP7(rng));
  addProblem(rng, mkP8(rng));

  /* ══ Cierre :: tu decisión ══ */
  var s5 = sec(
    L({ es:'Tu turno', en:'Your turn' }),
    L({ es:'De la fórmula a la decisión', en:'From the formula to the decision' }),
    '<p>' + L({
      es:'Todo lo anterior sirve para una sola cosa: decidir con datos en la mano. Una promoción de meses sin intereses, un enganche, un crédito para un coche o una cuenta de ahorro se vuelven comparables en cuanto se traducen a capital, tasa, plazo y frecuencia de capitalización.',
      en:'All of the above serves one purpose: deciding with data in hand. A no interest instalment offer, a down payment, a car loan or a savings account become comparable as soon as they are translated into capital, rate, term and compounding frequency.'
    }) + '</p>'
  );
  wReflect(rng, widgetHost(s5, 'wReflexion', 'reflect'));

  addProblem(rng, mkP9(rng));
  addProblem(rng, mkP10(rng));
}
</script>

<!-- LIAXA ANALYTICS -->
<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbyytGUdwxVpgXSHoXM1ISKh036P3GlF1BmF6aVRCR3DLpmtgefG09htw_l5IJW3UwoG/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var body = JSON.stringify({school:school,event:ev,module_id:moduleId,
      session_id:sessionId,elapsed_sec:Math.round((Date.now()-openedAt)/1000)});
    if(ev==='module_close'&&navigator.sendBeacon){
      navigator.sendBeacon(GAS_URL,new Blob([body],{type:'application/json'}));
    }else{
      fetch(GAS_URL,{method:'POST',body:body,headers:{'Content-Type':'application/json'},keepalive:true}).catch(function(){});
    }
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
