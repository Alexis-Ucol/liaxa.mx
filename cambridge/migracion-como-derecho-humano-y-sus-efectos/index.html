<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Migración como Derecho Humano y sus Efectos</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

/* ── INTERACTIVE WIDGETS ── */
.wgt { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.1rem; margin:1rem 0; }
.wgt-h { font-size:.68rem; letter-spacing:.11em; text-transform:uppercase; color:var(--text3); margin-bottom:.55rem; font-weight:600; }
.wgt-q { font-size:.9rem; font-weight:600; margin-bottom:.6rem; }
.wtask { background:var(--green-bg); border-radius:8px; padding:.55rem .8rem; font-size:.85rem; color:var(--text); margin-bottom:.75rem; }
.wtask strong { color:var(--green-dark); }
.wmsg { margin-top:.7rem; font-size:.83rem; padding:.6rem .8rem; border-radius:8px; background:var(--surface2); color:var(--text2); }
.wmsg.ok { background:var(--ok-bg); color:var(--ok); }
.wmsg.warn { background:var(--gold-bg); color:var(--text2); border-left:3px solid var(--gold); }
.wprog { font-size:.72rem; color:var(--text3); margin-top:.5rem; letter-spacing:.04em; }
.wbtn { background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:.5rem 1rem; font-size:.8rem; cursor:pointer; color:var(--text2); margin-top:.65rem; min-height:44px; }
.wbtn:hover { border-color:var(--green); color:var(--green); }

/* simulador de crecimiento + pirámide (canvas) */
.cvbox { border:1px solid var(--border); border-radius:10px; background:var(--surface2); overflow:hidden; margin-bottom:.8rem; }
.wcv { display:block; width:100%; height:auto; }
.srow { display:flex; align-items:center; gap:.7rem; margin-bottom:.5rem; flex-wrap:wrap; }
.slbl { font-size:.76rem; color:var(--text3); min-width:118px; }
.srow input[type=range] { flex:1; min-width:150px; accent-color:var(--green); height:32px; }
.sval { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; color:var(--green); min-width:62px; text-align:right; }
.readout { display:grid; grid-template-columns:repeat(3,1fr); gap:.5rem; margin-top:.7rem; }
.rout { background:var(--surface2); border-radius:8px; padding:.55rem; text-align:center; }
.rlbl { font-size:.63rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); }
.rnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; color:var(--green); }

/* cuadrícula de densidad */
.dgrid { display:grid; grid-template-columns:repeat(4,1fr); gap:.35rem; max-width:300px; margin:.6rem auto .3rem; }
.dcell { aspect-ratio:1/1; border:1.5px solid var(--border); border-radius:7px; background:var(--surface2); cursor:pointer; display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono',monospace; font-size:.78rem; color:var(--text3); min-height:44px; transition:all .13s; }
.dcell:hover { border-color:var(--green); }
.dcell.l1 { background:var(--green-bg); color:var(--green-dark); border-color:var(--green); }
.dcell.l2 { background:var(--gold-bg); color:var(--text); border-color:var(--gold); }
.dcell.l3 { background:var(--gold); color:var(--surface); border-color:var(--gold); font-weight:700; }
.dnote { font-size:.72rem; color:var(--text3); text-align:center; margin-bottom:.5rem; }

/* clasificador */
.cls-card { border:1.5px solid var(--border); border-radius:9px; background:var(--surface2); padding:.7rem .85rem; font-size:.86rem; font-weight:600; text-align:center; margin:.6rem 0; }
.cls-bins { display:flex; flex-wrap:wrap; gap:.5rem; }
.cls-bin { flex:1; min-width:130px; min-height:44px; border:1.5px solid var(--border); border-radius:9px; background:var(--surface); padding:.55rem .8rem; font-size:.84rem; font-family:inherit; color:var(--text2); cursor:pointer; transition:all .14s; }
.cls-bin:hover { border-color:var(--green); color:var(--green); }

/* etiquetador de casos */
.tag-case { border:1.5px solid var(--border); border-radius:9px; background:var(--surface2); padding:.7rem .85rem; font-size:.86rem; text-align:center; margin:.6rem 0; }
.tag-row { display:flex; flex-wrap:wrap; align-items:center; gap:.45rem; margin-bottom:.5rem; }
.tag-lbl { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); min-width:96px; }
.tag-chip { border:1.5px solid var(--border); border-radius:22px; background:var(--surface); color:var(--text2); padding:.5rem .95rem; font-size:.83rem; font-family:inherit; cursor:pointer; min-height:44px; transition:all .14s; }
.tag-chip:hover { border-color:var(--green); color:var(--green); }
.tag-chip.sel { border-color:var(--gold); background:var(--gold-bg); color:var(--text); font-weight:600; }

/* reflexión */
.reflect-prompt { font-size:.92rem; margin:.5rem 0 .8rem; color:var(--text2); }

@media (max-width:600px){
  .readout { grid-template-columns:repeat(3,1fr); gap:.35rem; }
  .rnum { font-size:.85rem; }
  .slbl { min-width:100px; font-size:.72rem; }
  .dgrid { max-width:100%; }
  .tag-lbl { min-width:100%; }
  .tag-chip { flex:1; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Migración como Derecho Humano y sus Efectos</div>
    <div class="wcourse" id="wcourse-el">Geografía · 1° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>

/* ── Attempt counter + seed (Rule 4): seed = name+group+attempt ── */
function getAttemptKey(name, group){ return 'geo1_t06_g02__att__' + (name+'__'+group).replace(/\s+/g,'_'); }
function nextAttempt(name, group){ var k=getAttemptKey(name,group),n=0; try{n=parseInt(localStorage.getItem(k)||'0',10)||0;}catch(e){} n++; try{localStorage.setItem(k,String(n));}catch(e){} return n; }
function currentAttempt(name, group){ var k=getAttemptKey(name,group); try{return parseInt(localStorage.getItem(k)||'1',10)||1;}catch(e){return 1;} }

var studentData   = {};
var problems      = [];

/* ================================================
   SESSION PERSISTENCE  (localStorage)
   ================================================ */
function lsKey() {
  var n = (studentData.name  || '').trim();
  var g = (studentData.group || '').trim();
  return 'geo1_t06_g02__' + (n + '__' + g).replace(/\s+/g, '_');
}

function saveSession() {
  if (!studentData.name) return;
  var drawings = [], texts = [], photos = [];
  problems.forEach(function(p, i) {
    var dc = document.getElementById('dc' + i);
    if (dc && dc.width) {
      var blank = document.createElement('canvas');
      blank.width = dc.width; blank.height = dc.height;
      drawings.push(dc.toDataURL() === blank.toDataURL() ? null : dc.toDataURL('image/png'));
    } else { drawings.push(null); }
    var ta = document.getElementById('ta' + i);
    texts.push(ta ? ta.value : '');
    var pp = document.getElementById('pp' + i);
    photos.push((pp && pp.src && pp.src.indexOf('data:') === 0) ? pp.src : null);
  });
  var state = {
    name: studentData.name, group: studentData.group,
    answeredCount: answeredCount, correctCount: correctCount,
    choices: problems.map(function(p) { return p.studentChoice; }),
    drawings: drawings, texts: texts, photos: photos
  };
  try { localStorage.setItem(lsKey(), JSON.stringify(state)); } catch(e) {}
}

function loadSession(name, group) {
  var key = 'geo1_t06_g02__' + (name + '__' + group).replace(/\s+/g, '_');
  try { var r = localStorage.getItem(key); return r ? JSON.parse(r) : null; } catch(e) { return null; }
}

function restoreSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  var saved = loadSession(name, group);
  if (!saved) return;
  document.getElementById('restoreBar').style.display = 'none';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = currentAttempt(name, group);
  buildLesson(seededRng(name + group + att));
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
  saved.choices.forEach(function(choice, idx) {
    if (choice !== null && choice !== undefined) confirmMC(idx, choice);
  });
  setTimeout(function() {
    if (saved.drawings) {
      saved.drawings.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var dc = document.getElementById('dc' + i);
        if (!dc || !dc.width) return;
        var img = new Image();
        img.onload = function() {
          var dpr = window.devicePixelRatio || 1;
          dc.getContext('2d').drawImage(img, 0, 0, dc.width / dpr, dc.height / dpr);
        };
        img.src = dataUrl;
      });
    }
    if (saved.texts) {
      saved.texts.forEach(function(text, i) {
        if (!text) return;
        var ta = document.getElementById('ta' + i);
        if (ta) ta.value = text;
      });
    }
    if (saved.photos) {
      saved.photos.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var pp = document.getElementById('pp' + i);
        if (!pp) return;
        pp.src = dataUrl; pp.style.display = 'block';
        var pz = document.getElementById('pz' + i);
        if (pz) pz.style.opacity = '0.4';
      });
    }
  }, 300);
}

function dismissRestore() {
  document.getElementById('restoreBar').style.display = 'none';
}

function checkForSavedSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  if (!name || !group) { document.getElementById('restoreBar').style.display = 'none'; return; }
  var saved = loadSession(name, group);
  var bar = document.getElementById('restoreBar');
  bar.style.display = (saved && saved.choices && saved.choices.some(function(c){ return c !== null; })) ? 'block' : 'none';
}

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

async function generatePDF() {
  var btn = document.getElementById('dlBtn');
  btn.textContent = 'Generando PDF…';
  btn.disabled = true;

  var jspdf   = window.jspdf;
  var doc     = new jspdf.jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });
  var PW      = 215.9;
  var M       = 18;
  var TW      = PW - M * 2;
  var PH      = doc.internal.pageSize.height;
  var name    = studentData.name;
  var group   = studentData.group;
  var total   = problems.length;
  var pct     = Math.round(correctCount / total * 100);
  var dateStr = new Date().toLocaleString('es-MX', { dateStyle:'long', timeStyle:'short' });

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS — INJECTION BLOCK ─────────────────────────────────────────
  //   Match these RGB values to --green and --gold above.
  //   PRIMARY  → pBR, pBG, pBB
  //   ACCENT   → pAR, pAG, pAB
  // ──────────────────────────────────────────────────────────────────────────
  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;  // PRIMARY (from SCHOOL, Rule 16)
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;   // ACCENT (from SCHOOL, Rule 16)

  function pdfText(html) {
    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/\u2192/g,'->').replace(/\u2212/g,'-').replace(/\u00b2/g,'^2')
      .replace(/\u00b3/g,'^3').replace(/\u00d7/g,'x').replace(/\u00f7/g,'/')
      .replace(/\u2260/g,'!=').replace(/\u2264/g,'<=').replace(/\u2265/g,'>=')
      .replace(/\u221a/g,'sqrt').replace(/\u03c0/g,'pi').replace(/\u2026/g,'...')
      .replace(/\s+/g,' ').trim();
  }

  // ── PORTADA: orange line / white logo strip / orange line / blue band ──
  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,2,'F');   // top accent line
  doc.setFillColor(255,255,255); doc.rect(0,2,PW,26,'F');                               // white logo strip

  var lx = PW - M - 36;

    wy += ansBoxH + 5;

    doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
    doc.setFontSize(7); doc.setFont('helvetica','bold');
    doc.rect(M,wy,TW,8,'F'); doc.text('TRABAJO DEL ALUMNO', M+4, wy+5.5);
    wy += 11;

    var dc = document.getElementById('dc'+i);
    if (dc) {
      try {
        var imgD = dc.toDataURL('image/png');
        var ar   = dc.height / dc.width;
        var iw   = TW;
        var ih   = Math.min(iw * ar, 68);
        doc.addImage(imgD, 'PNG', M, wy, iw, ih);
        wy += ih + 4;
      } catch(e) {}
    }

    var ta = document.getElementById('ta'+i);
    if (ta && ta.value.trim()) {
      if (wy > PH-30) { doc.addPage(); wy = 20; }
      doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('courier','normal');
      var taLines = doc.splitTextToSize(ta.value, TW);
      taLines.slice(0,16).forEach(function(ln) {
        if (wy > PH-15) { doc.addPage(); wy = 20; }
        doc.text(ln, M, wy); wy += 5;
      });
      wy += 2;
    }

    var pp = document.getElementById('pp'+i);
    if (pp && pp.src && pp.src.indexOf('data:') === 0) {
      if (wy > PH-55) { doc.addPage(); wy = 20; }
      try { doc.addImage(pp.src, 'JPEG', M, wy, TW, 68); wy += 72; } catch(e) {}
    }
  }

  // ── Footer on every page ──
  var pages = doc.internal.getNumberOfPages();
  for (var p = 1; p <= pages; p++) {
    doc.setPage(p);
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0, PH-3, PW, 3, 'F');
    doc.setTextColor(130,140,160); doc.setFontSize(6.5); doc.setFont('helvetica','normal');
    doc.text(name+'  ·  '+group+'  ·  Código: '+code+'  ·  Página '+p+'/'+pages,
      PW/2, PH-5, {align:'center'});
  }

  doc.save('geo1_t06_g02_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf');
  btn.innerHTML = '⬇ &nbsp;Descargar Resultados PDF';
  btn.disabled  = false;
}

function S(es, en){ return LANG === 'es' ? es : en; }

function addSection(tag, html){

function cvar(name, fb){
  try { var v = getComputedStyle(document.documentElement).getPropertyValue(name); return (v && v.trim()) || fb; }
  catch(e){ return fb; }
}

function fmtN(n){ return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
function signed(n){ return n < 0 ? '−' + Math.abs(n) : String(n); }

/* Shuffles options (Rule 7) keeping ES/EN aligned, then builds the card inline (Rule 1/5). */
function addProblem(v, rng){
  var n = v.options.es.length, idx = [], k;
  for (k = 0; k < n; k++) idx.push(k);
  for (k = n - 1; k > 0; k--) {
    var j = Math.floor(rng() * (k + 1));
    var tmp = idx[k]; idx[k] = idx[j]; idx[j] = tmp;
  }
  var langOpts = (LANG === 'es') ? v.options.es : v.options.en;
  var prob = {
    title:        v.title[LANG],
    questionText: v.stmt[LANG],
    fn:           v.fn || '',
    hint:         v.hint[LANG],
    explanation:  v.explanation[LANG],
    options:      idx.map(function(o){ return langOpts[o]; }),
    correctIdx:   idx.indexOf(v.correct),
    showWork:     !!v.showWork,
    studentChoice:null, pendingChoice:null
  };
  problems.push(prob);
  buildOneCard(prob, problems.length - 1);
}
/* ================================================
   WIDGET 1 - ESCENAS DE DERECHOS
   Six real scenes. Each tap sorts one scene into "se respeta" or "se vulnera";
   the message points at what to look for, and the answer surfaces on the third miss.
   ================================================ */
var RTS = null;
function buildRights(rng){
  var ITEMS = [
    { es:'Una clínica atiende a un niño que llegó de otro país aunque su familia no tenga papeles en regla.',
      en:'A clinic treats a boy who arrived from another country even though his family has no papers in order.', bin:0 },
    { es:'Un patrón le guarda el pasaporte a una trabajadora extranjera para que no pueda dejar el empleo.',
      en:'An employer keeps a foreign worker passport so that she cannot leave the job.', bin:1 },
    { es:'Una secundaria inscribe a una alumna que llegó de otro estado a mitad del ciclo escolar.',
      en:'A secondary school enrolls a student who arrived from another state in the middle of the school year.', bin:0 },
    { es:'En un retén se impide salir del municipio a quienes no traen una carta firmada por la autoridad local.',
      en:'At a checkpoint, people without a letter signed by the local authority are stopped from leaving the municipality.', bin:1 },
    { es:'Una mujer que vivió seis años fuera del país vuelve a entrar sin necesidad de un permiso especial.',
      en:'A woman who lived six years abroad comes back in without needing a special permit.', bin:0 },
    { es:'Un casero sube al doble la renta a una familia recién llegada por hablar una lengua distinta.',
      en:'A landlord doubles the rent for a newly arrived family because they speak a different language.', bin:1 }
  ];
  RTS = { items:ITEMS, seq: shuffle([0,1,2,3,4,5], rng), i:0, tries:0, correct:0, done:false, lock:false };
  return addWidget('rights',
    '<div class="wgt">' +
      '<div class="wgt-h">' + S('Escenas de la vida diaria','Scenes from daily life') + '</div>' +
      '<div id="rtsBox"></div>' +
    '</div>');
}
function rtsBins(){ return S(['Se respeta el derecho','Se vulnera el derecho'], ['The right is respected','The right is violated']); }
function rtsRender(msg, cls){
  if (!RTS) return;
  var box = document.getElementById('rtsBox');
  if (!box) return;
  var BINS = rtsBins();
  if (RTS.done) {
    box.innerHTML = '<div class="wmsg ok">' + S('Escenas revisadas: ','Scenes reviewed: ') + RTS.correct + ' / ' + RTS.items.length + '. ' +
      S('En todas la pregunta fue la misma: ¿la persona puede moverse y conservar lo que ya tenía, o alguien se lo quita por venir de otro lugar?',
        'In all of them the question was the same: can the person move and keep what they already had, or does someone take it away because they come from somewhere else?') + '</div>';
    return;
  }
  var it = RTS.items[RTS.seq[RTS.i]];
  var deflt = S('Lee la escena y decide qué pasa ahí con el derecho a moverse y con los derechos que lo acompañan.',
                'Read the scene and decide what happens there with the right to move and the rights that come with it.');
  box.innerHTML =
    '<div class="wprog">' + (RTS.i + 1) + ' / ' + RTS.items.length + '</div>' +
    '<div class="cls-card">' + it[LANG] + '</div>' +
    '<div class="cls-bins">' +
      '<button class="cls-bin" onclick="rtsPick(0)">' + BINS[0] + '</button>' +
      '<button class="cls-bin" onclick="rtsPick(1)">' + BINS[1] + '</button>' +
    '</div>' +
    '<div class="wmsg' + (cls ? ' ' + cls : '') + '">' + (msg || deflt) + '</div>';
}
function rtsPick(bi){
  if (!RTS || RTS.done || RTS.lock) return;
  var it = RTS.items[RTS.seq[RTS.i]];
  var BINS = rtsBins();
  if (bi === it.bin) {
    RTS.correct++; RTS.tries = 0; RTS.i++;
    if (RTS.i >= RTS.items.length) RTS.done = true;
    rtsRender(S('Así es. Pasa a la siguiente escena.','That is it. Move on to the next scene.'), 'ok');
    return;
  }
  RTS.tries++;
  if (RTS.tries >= 3) {
    RTS.tries = 0; RTS.i++; RTS.lock = true;
    if (RTS.i >= RTS.items.length) RTS.done = true;
    rtsRender(S('Era <b>' + BINS[it.bin] + '</b>. Fíjate en quién decide: si la persona se mueve y sigue teniendo escuela, salud y trato digno, el derecho está en pie.',
                'It was <b>' + BINS[it.bin] + '</b>. Look at who decides: if the person moves and still has school, health care and dignified treatment, the right is standing.'), 'warn');
    setTimeout(function(){ if (RTS) { RTS.lock = false; rtsRender(); } }, 1600);
    return;
  }
  rtsRender(S('Todavía no. Pregúntate si alguien le está quitando algo a esa persona por venir de otro lugar.',
              'Not yet. Ask yourself whether someone is taking something away from that person for coming from somewhere else.'), 'warn');
}

/* ================================================
   WIDGET 2 - ETIQUETADOR DE CASOS
   Two rows of tags over the same case. Tags can be changed as many times as
   the student wants before checking; the message says WHICH row is off.
   ================================================ */
var TAG = null;
function buildTagger(rng){
  var CASES = [
    { es:'Marta deja su comunidad en Oaxaca y se instala en Nuevo León para estudiar la preparatoria y quedarse a vivir ahí.',
      en:'Marta leaves her community in Oaxaca and settles in Nuevo Leon to study high school and stay living there.', a:0, b:0 },
    { es:'Una familia sale de su país rumbo al país vecino porque un grupo armado la amenazó y ya no puede volver a su casa.',
      en:'A family leaves its country for the neighbouring country because an armed group threatened them and they can no longer go back home.', a:1, b:1 },
    { es:'Después de que el río se desbordó, trescientas familias dejan su colonia y se mudan a otro municipio del mismo estado.',
      en:'After the river overflowed, three hundred families leave their neighbourhood and move to another municipality in the same state.', a:0, b:1 },
    { es:'Un ingeniero acepta un contrato de tres años en una empresa de Alemania y se muda con su familia.',
      en:'An engineer accepts a three year contract at a company in Germany and moves there with his family.', a:1, b:0 },
    { es:'Cientos de personas abandonan su comunidad porque el pozo se secó y ya no hay con qué regar la milpa; se van a la capital del estado.',
      en:'Hundreds of people abandon their community because the well dried up and there is no water for the cornfield; they leave for the state capital.', a:0, b:1 }
  ];
  TAG = { cases:CASES, order: shuffle([0,1,2,3,4], rng).slice(0,3), round:0, a:null, b:null, tries:0, done:false, lock:false };
  return addWidget('tagger',
    '<div class="wgt">' +
      '<div class="wgt-h">' + S('Ponle etiquetas al caso','Put labels on the case') + '</div>' +
      '<div id="tagBox"></div>' +
    '</div>');
}
function tagRows(){
  return [ S(['Interna','Internacional'], ['Internal','International']),
           S(['Voluntaria','Forzada'],   ['Voluntary','Forced']) ];
}
function tagSet(axis, v){
  if (!TAG || TAG.done || TAG.lock) return;
  if (axis === 0) TAG.a = (TAG.a === v ? null : v); else TAG.b = (TAG.b === v ? null : v);
  tagRender();
}
function tagRender(msg, cls){
  if (!TAG) return;
  var box = document.getElementById('tagBox');
  if (!box) return;
  var R = tagRows();
  if (TAG.done) {
    box.innerHTML = '<div class="wmsg ok">' +
      S('Tres casos etiquetados. Las dos preguntas sirven siempre: ¿se cruza o no una frontera de país?, ¿la persona eligió irse o algo la empujó?',
        'Three cases labelled. The two questions always work: is a country border crossed or not? Did the person choose to leave or was she pushed out?') + '</div>';
    return;
  }
  var c = TAG.cases[TAG.order[TAG.round]];
  var deflt = S('Elige una etiqueta en cada fila. Puedes cambiarlas las veces que quieras antes de comprobar.',
                'Pick one label in each row. You can change them as many times as you want before checking.');
  function row(axis, labels){
    return '<div class="tag-row"><div class="tag-lbl">' + (axis === 0 ? S('¿A dónde?','Where to?') : S('¿Por qué?','Why?')) + '</div>' +
      labels.map(function(lb, k){
        var on = (axis === 0 ? TAG.a : TAG.b) === k;
        return '<button class="tag-chip' + (on ? ' sel' : '') + '" onclick="tagSet(' + axis + ',' + k + ')">' + lb + '</button>';
      }).join('') + '</div>';
  }
  box.innerHTML =
    '<div class="wprog">' + (TAG.round + 1) + ' / 3</div>' +
    '<div class="tag-case">' + c[LANG] + '</div>' +
    row(0, R[0]) + row(1, R[1]) +
    '<button class="wbtn" onclick="tagCheck()">' + S('Comprobar','Check') + '</button>' +
    '<div class="wmsg' + (cls ? ' ' + cls : '') + '">' + (msg || deflt) + '</div>';
}
function tagCheck(){
  if (!TAG || TAG.done || TAG.lock) return;
  var c = TAG.cases[TAG.order[TAG.round]];
  var R = tagRows();
  if (TAG.a === null || TAG.b === null) {
    tagRender(S('Falta una etiqueta. Marca una opción en cada fila y vuelve a comprobar.',
                'One label is missing. Mark one option in each row and check again.'), 'warn');
    return;
  }
  var okA = (TAG.a === c.a), okB = (TAG.b === c.b);
  if (okA && okB) {
    TAG.round++; TAG.tries = 0; TAG.a = null; TAG.b = null;
    if (TAG.round >= 3) TAG.done = true;
    tagRender(S('Las dos etiquetas quedaron bien. Va el siguiente caso.','Both labels are right. Here comes the next case.'), 'ok');
    return;
  }
  TAG.tries++;
  if (TAG.tries >= 3) {
    TAG.a = c.a; TAG.b = c.b; TAG.lock = true;
    tagRender(S('Este caso es <b>' + R[0][c.a] + '</b> y <b>' + R[1][c.b] + '</b>. Mira las etiquetas marcadas y compáralas con lo que decía la escena.',
                'This case is <b>' + R[0][c.a] + '</b> and <b>' + R[1][c.b] + '</b>. Look at the marked labels and compare them with what the scene said.'), 'warn');
    setTimeout(function(){
      if (!TAG) return;
      TAG.lock = false; TAG.round++; TAG.tries = 0; TAG.a = null; TAG.b = null;
      if (TAG.round >= 3) TAG.done = true;
      tagRender();
    }, 2400);
    return;
  }
  var m;
  if (!okA && !okB) m = S('Las dos fallan. Revisa primero si el movimiento se queda dentro del país y luego quién tomó la decisión de salir.',
                          'Both are off. First check whether the move stays inside the country, then who made the decision to leave.');
  else if (!okA)    m = S('La segunda etiqueta va bien. En la primera fíjate si se cruza o no la frontera de un país.',
                          'The second label is fine. For the first one, check whether a country border is crossed or not.');
  else              m = S('La primera etiqueta va bien. En la segunda fíjate si la persona eligió irse o si algo la obligó a salir.',
                          'The first label is fine. For the second one, check whether the person chose to leave or something forced her out.');
  tagRender(m, 'warn');
}

/* ================================================
   WIDGET 3 - MAPA DE FLUJOS
   Two places, two live flows. The arrows change thickness while the student
   moves the bars and the population of each place is recalculated on the spot.
   ================================================ */
var FL = null;
function buildFlow(rng){
  var sets = [ [600, -300, 0], [750, -450, 150], [500, -200, 350] ];
  FL = { ab:800, ba:500, round:0, tries:0, done:false, goals: shuffle(pick(sets, rng), rng), popA:8000, popB:25000 };
  return addWidget('flowmap',
    '<div class="wgt">' +
      '<div class="wgt-h">' + S('Mapa de flujos','Flow map') + '</div>' +
      '<div id="flBox"></div>' +
    '</div>');
}
function flSetAb(v){ if (!FL || FL.done) return; FL.ab = parseInt(v,10); flRender(); }
function flSetBa(v){ if (!FL || FL.done) return; FL.ba = parseInt(v,10); flRender(); }
function flRender(msg, cls){
  if (!FL) return;
  var box = document.getElementById('flBox');
  if (!box) return;
  var sal = FL.ab - FL.ba;
  var goal = FL.goals[Math.min(FL.round, FL.goals.length - 1)];
  var task = FL.done
    ? S('Las tres metas quedaron atrás. Sigue moviendo las barras y observa cómo cambian las dos flechas.',
        'The three targets are behind you. Keep moving the bars and watch how both arrows change.')
    : S('Meta ' + (FL.round + 1) + ' de 3: deja a Ciudad Río con un saldo migratorio de <strong>' + signed(goal) + ' personas</strong> en el año.',
        'Target ' + (FL.round + 1) + ' of 3: leave Ciudad Rio with a net migration of <strong>' + signed(goal) + ' people</strong> for the year.');
  var deflt = S('San Miguel es un pueblo de 8 000 habitantes y Ciudad Río una ciudad de 25 000. Mueve las barras y mira hacia dónde engorda cada flecha.',
                'San Miguel is a town of 8 000 inhabitants and Ciudad Rio a city of 25 000. Move the bars and watch which arrow gets thicker.');
  box.innerHTML =
    '<div class="wtask">' + task + '</div>' +
    '<div class="cvbox"><canvas class="wcv" id="flCv" width="600" height="230"></canvas></div>' +
    '<div class="srow"><div class="slbl">' + S('Salen de San Miguel','Leaving San Miguel') + '</div>' +
      '<input type="range" min="0" max="2000" step="50" value="' + FL.ab + '" oninput="flSetAb(this.value)">' +
      '<div class="sval">' + fmtN(FL.ab) + '</div></div>' +
    '<div class="srow"><div class="slbl">' + S('Salen de Ciudad Río','Leaving Ciudad Rio') + '</div>' +
      '<input type="range" min="0" max="2000" step="50" value="' + FL.ba + '" oninput="flSetBa(this.value)">' +
      '<div class="sval">' + fmtN(FL.ba) + '</div></div>' +
    '<div class="readout">' +
      '<div class="rout"><div class="rlbl">' + S('Saldo San Miguel','Net San Miguel') + '</div><div class="rnum">' + signed(-sal) + '</div></div>' +
      '<div class="rout"><div class="rlbl">' + S('Saldo Ciudad Río','Net Ciudad Rio') + '</div><div class="rnum">' + signed(sal) + '</div></div>' +
      '<div class="rout"><div class="rlbl">' + S('Se movieron','People moved') + '</div><div class="rnum">' + fmtN(FL.ab + FL.ba) + '</div></div>' +
    '</div>' +
    (FL.done ? '' : '<button class="wbtn" onclick="flCheck()">' + S('Comprobar','Check') + '</button>') +
    '<div class="wmsg' + (cls ? ' ' + cls : '') + '">' + (msg || deflt) + '</div>';
  flDraw();
}
function flArrow(ctx, x1, x2, y, w, color, label){
  var dir = x2 > x1 ? 1 : -1;
  ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = w;
  ctx.beginPath(); ctx.moveTo(x1, y); ctx.lineTo(x2 - dir * 16, y); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x2, y);
  ctx.lineTo(x2 - dir * 18, y - 8 - w / 2);
  ctx.lineTo(x2 - dir * 18, y + 8 + w / 2);
  ctx.closePath(); ctx.fill();
  ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText(label, (x1 + x2) / 2, y - 10 - w / 2);
}
function flDraw(){
  var cv = document.getElementById('flCv');
  if (!cv || !cv.getContext) return;
  var ctx = cv.getContext('2d');
  var W = cv.width, H = cv.height;
  var surf = cvar('--surface2', '#f0ede6');
  var body = cvar('--surface', '#ffffff');
  var line = cvar('--green', '#1a4a8a');
  var accent = cvar('--gold', '#c9a84c');
  var txt = cvar('--text3', '#7a7468');
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = surf; ctx.fillRect(0, 0, W, H);
  var pA = FL.popA - FL.ab + FL.ba;
  var pB = FL.popB + FL.ab - FL.ba;
  var xA = 92, xB = W - 92, cy = H / 2;
  var rA = 24 + 46 * pA / (pA + pB);
  var rB = 24 + 46 * pB / (pA + pB);
  ctx.lineWidth = 3;
  ctx.fillStyle = body; ctx.strokeStyle = line;
  ctx.beginPath(); ctx.arc(xA, cy, rA, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(xB, cy, rB, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = txt; ctx.textAlign = 'center'; ctx.font = 'bold 13px sans-serif';
  ctx.fillText('San Miguel', xA, 20);
  ctx.fillText(S('Ciudad Río','Ciudad Rio'), xB, 20);
  ctx.font = '12px sans-serif';
  ctx.fillText(fmtN(pA) + S(' hab.',' inh.'), xA, H - 10);
  ctx.fillText(fmtN(pB) + S(' hab.',' inh.'), xB, H - 10);
  flArrow(ctx, xA + rA + 6, xB - rB - 6, cy - 34, 2 + FL.ab / 160, line, fmtN(FL.ab));
  flArrow(ctx, xB - rB - 6, xA + rA + 6, cy + 46, 2 + FL.ba / 160, accent, fmtN(FL.ba));
}
function flCheck(){
  if (!FL || FL.done) return;
  var goal = FL.goals[FL.round];
  var sal = FL.ab - FL.ba;
  if (sal === goal) {
    FL.round++; FL.tries = 0;
    if (FL.round >= FL.goals.length) {
      FL.done = true;
      flRender(S('Las tres metas cumplidas. Un mismo saldo se puede lograr con flujos grandes o pequeños: lo que decide si un lugar atrae o expulsa es la distancia entre las dos flechas.',
                 'All three targets met. The same net figure can come from big or small flows: what decides whether a place attracts or expels is the distance between the two arrows.'), 'ok');
    } else {
      flRender(S('Meta lograda. Ahora ve por la siguiente.','Target reached. Now go for the next one.'), 'ok');
    }
    return;
  }
  FL.tries++;
  if (FL.tries >= 3) {
    var ab2 = 1000, ba2 = 1000 - goal;
    FL.ab = ab2; FL.ba = ba2; FL.round++; FL.tries = 0;
    if (FL.round >= FL.goals.length) FL.done = true;
    flRender(S('Una combinación que cumple esa meta es ' + fmtN(ab2) + ' saliendo de San Miguel y ' + fmtN(ba2) + ' saliendo de Ciudad Río. Lo que cuenta es la resta entre las dos flechas.',
               'One combination that meets that target is ' + fmtN(ab2) + ' leaving San Miguel and ' + fmtN(ba2) + ' leaving Ciudad Rio. What counts is the subtraction between the two arrows.'), 'warn');
    return;
  }
  var dif = goal - sal;
  var m = dif > 0
    ? S('Ciudad Río va en ' + signed(sal) + ' y la meta es ' + signed(goal) + '. Faltan ' + fmtN(Math.abs(dif)) + ' personas: engorda la flecha que llega o adelgaza la que sale.',

   town receives in a year grows against the target bar on every move.

var RM = null;
function buildRemesas(rng){
  var sets = [ [3600000, 1440000, 7200000], [2880000, 5400000, 1800000] ];
  RM = { per:100, mon:1000, round:0, tries:0, done:false, goals: shuffle(pick(sets, rng), rng) };
  return addWidget('remesas',
    '<div class="wgt">' +
      '<div class="wgt-h">' + S('Contador de remesas','Remittance counter') + '</div>' +
      '<div id="rmBox"></div>' +
    '</div>');
}
function rmSetPer(v){ if (!RM || RM.done) return; RM.per = parseInt(v,10); rmRender(); }
function rmSetMon(v){ if (!RM || RM.done) return; RM.mon = parseInt(v,10); rmRender(); }
function rmYear(){ return RM.per * RM.mon * 12; }
function rmRender(msg, cls){
  if (!RM) return;
  var box = document.getElementById('rmBox');
  if (!box) return;
  var goal = RM.goals[Math.min(RM.round, RM.goals.length - 1)];
  var task = RM.done
    ? S('Las tres metas quedaron atrás. Sigue moviendo las barras: pocas personas que envían mucho y muchas que envían poco pueden dar lo mismo.',
        'The three targets are behind you. Keep moving the bars: a few people sending a lot and many sending a little can add up to the same.')
    : S('Meta ' + (RM.round + 1) + ' de 3: haz que el pueblo reciba <strong>' + fmtN(goal) + ' pesos al año</strong>.',
        'Target ' + (RM.round + 1) + ' of 3: make the town receive <strong>' + fmtN(goal) + ' pesos a year</strong>.');
  var deflt = S('Cada barra es una parte del envío: cuántas personas mandan dinero y cuánto manda cada una al mes.',
                'Each bar is one part of the sending: how many people send money and how much each one sends per month.');
  box.innerHTML =
    '<div class="wtask">' + task + '</div>' +
    '<div class="cvbox"><canvas class="wcv" id="rmCv" width="600" height="170"></canvas></div>' +
    '<div class="srow"><div class="slbl">' + S('Personas que envían','People who send') + '</div>' +
      '<input type="range" min="0" max="500" step="10" value="' + RM.per + '" oninput="rmSetPer(this.value)">' +
      '<div class="sval">' + fmtN(RM.per) + '</div></div>' +
    '<div class="srow"><div class="slbl">' + S('Pesos al mes cada una','Pesos a month each') + '</div>' +
      '<input type="range" min="0" max="3000" step="100" value="' + RM.mon + '" oninput="rmSetMon(this.value)">' +
      '<div class="sval">' + fmtN(RM.mon) + '</div></div>' +
    '<div class="readout">' +
      '<div class="rout"><div class="rlbl">' + S('Al mes','Per month') + '</div><div class="rnum">' + fmtN(RM.per * RM.mon) + '</div></div>' +
      '<div class="rout"><div class="rlbl">' + S('Al año','Per year') + '</div><div class="rnum">' + fmtN(rmYear()) + '</div></div>' +
      '<div class="rout"><div class="rlbl">' + S('Meta','Target') + '</div><div class="rnum">' + fmtN(goal) + '</div></div>' +
    '</div>' +
    (RM.done ? '' : '<button class="wbtn" onclick="rmCheck()">' + S('Comprobar','Check') + '</button>') +
    '<div class="wmsg' + (cls ? ' ' + cls : '') + '">' + (msg || deflt) + '</div>';
  rmDraw();
}
function rmDraw(){
  var cv = document.getElementById('rmCv');
  if (!cv || !cv.getContext) return;
  var ctx = cv.getContext('2d');
  var W = cv.width, H = cv.height;
  var surf = cvar('--surface2', '#f0ede6');
  var line = cvar('--green', '#1a4a8a');
  var accent = cvar('--gold', '#c9a84c');
  var txt = cvar('--text3', '#7a7468');
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = surf; ctx.fillRect(0, 0, W, H);
  var goal = RM.goals[Math.min(RM.round, RM.goals.length - 1)];
  var cur = rmYear();
  var mx = Math.max(goal, cur, 1) * 1.15;
  var L = 26, R = W - 130, span = R - L;
  ctx.font = '12px sans-serif'; ctx.textAlign = 'left';
  ctx.fillStyle = txt;
  ctx.fillText(S('Lo que llega al pueblo en un año','What reaches the town in one year'), L, 22);
  ctx.fillText(S('Meta','Target'), L, 106);
  ctx.fillStyle = line;
  ctx.fillRect(L, 32, Math.max(2, span * cur / mx), 34);
  ctx.fillStyle = accent;
  ctx.fillRect(L, 116, Math.max(2, span * goal / mx), 34);
  ctx.font = 'bold 13px sans-serif';
  ctx.fillStyle = line;
  ctx.fillText(fmtN(cur), L + Math.max(2, span * cur / mx) + 8, 54);
  ctx.fillStyle = accent;
  ctx.fillText(fmtN(goal), L + Math.max(2, span * goal / mx) + 8, 138);
}
function rmCombo(goal){
  var monthly = goal / 12;
  for (var p = 10; p <= 500; p += 10) {
    var m = monthly / p;
    if (m === Math.round(m) && m % 100 === 0 && m <= 3000 && m > 0) return [p, m];
  }
  return [100, 1000];
}
function rmCheck(){
  if (!RM || RM.done) return;
  var goal = RM.goals[RM.round];
  var cur = rmYear();
  if (cur === goal) {
    RM.round++; RM.tries = 0;
    if (RM.round >= RM.goals.length) {
      RM.done = true;
      rmRender(S('Las tres metas cumplidas. Ese dinero llega cada mes a casas concretas: paga comida, uniformes, medicinas o el techo nuevo.',
                 'All three targets met. That money reaches concrete homes every month: it pays for food, uniforms, medicine or a new roof.'), 'ok');
    } else {
      rmRender(S('Meta lograda. Ahora ve por la siguiente.','Target reached. Now go for the next one.'), 'ok');
    }
    return;
  }
  RM.tries++;
  if (RM.tries >= 3) {
    var c = rmCombo(goal);
    RM.per = c[0]; RM.mon = c[1]; RM.round++; RM.tries = 0;
    if (RM.round >= RM.goals.length) RM.done = true;
    rmRender(S('Una combinación que llega a esa meta es ' + fmtN(c[0]) + ' personas enviando ' + fmtN(c[1]) + ' pesos al mes: eso da ' + fmtN(c[0] * c[1]) + ' cada mes y doce veces esa cantidad en el año.',
               'One combination that reaches that target is ' + fmtN(c[0]) + ' people sending ' + fmtN(c[1]) + ' pesos a month: that gives ' + fmtN(c[0] * c[1]) + ' each month and twelve times that amount in the year.'), 'warn');
    return;
  }
  var m2 = cur < goal
    ? S('El pueblo recibe ' + fmtN(cur) + ' al año y la meta es ' + fmtN(goal) + '. Falta dinero: sube alguna de las dos barras.',
        'The town receives ' + fmtN(cur) + ' a year and the target is ' + fmtN(goal) + '. Money is missing: raise one of the two bars.')
    : S('El pueblo recibe ' + fmtN(cur) + ' al año y la meta es ' + fmtN(goal) + '. Se pasa: baja alguna de las dos barras.',
        'The town receives ' + fmtN(cur) + ' a year and the target is ' + fmtN(goal) + '. It goes over: lower one of the two bars.');
  rmRender(m2, 'warn');
}

var EFF = null;
function buildEffects(rng){

    { es:'En el mercado aparecen puestos con comida, música y palabras de otras regiones.',

    { es:'Varias escuelas cierran grupos porque cada año hay menos niñas y niños inscritos.',

    { es:'Las empresas encuentran más trabajadores disponibles y abren nuevos turnos.',

  ];
  EFF = { items:ITEMS, seq: shuffle([0,1,2,3,4,5], rng), i:0, tries:0, correct:0, done:false, lock:false };
  return addWidget('effects',

function effBins(){ return S(['Lugar de salida','Lugar de llegada'], ['Place of departure','Place of arrival']); }
function effRender(msg, cls){
  if (!EFF) return;
  var box = document.getElementById('effBox');
  if (!box) return;
  var BINS = effBins();
  if (EFF.done) {
    box.innerHTML = '<div class="wmsg ok">' + S('Efectos colocados: ','Effects placed: ') + EFF.correct + ' / ' + EFF.items.length + '. ' +
      S('Una sola migración deja huella en los dos extremos al mismo tiempo, y no siempre del mismo signo.',
        'A single migration leaves a mark at both ends at the same time, and not always of the same sign.') + '</div>';
    return;
  }
  var it = EFF.items[EFF.seq[EFF.i]];

                'Read the effect and decide at which end of the flow it shows up.');
  box.innerHTML =
    '<div class="wprog">' + (EFF.i + 1) + ' / ' + EFF.items.length + '</div>' +
    '<div class="cls-card">' + it[LANG] + '</div>' +
    '<div class="cls-bins">' +
      '<button class="cls-bin" onclick="effPick(0)">' + BINS[0] + '</button>' +
      '<button class="cls-bin" onclick="effPick(1)">' + BINS[1] + '</button>' +
    '</div>' +
    '<div class="wmsg' + (cls ? ' ' + cls : '') + '">' + (msg || deflt) + '</div>';
}
function effPick(bi){
  if (!EFF || EFF.done || EFF.lock) return;
  var it = EFF.items[EFF.seq[EFF.i]];
  var BINS = effBins();
  if (bi === it.bin) {
    EFF.correct++; EFF.tries = 0; EFF.i++;
    if (EFF.i >= EFF.items.length) EFF.done = true;
    effRender(S('Correcto. Sigue con el siguiente efecto.','Correct. On to the next effect.'), 'ok');
    return;
  }
  EFF.tries++;
  if (EFF.tries >= 3) {
    EFF.tries = 0; EFF.i++; EFF.lock = true;
    if (EFF.i >= EFF.items.length) EFF.done = true;
    effRender(S('Era <b>' + BINS[it.bin] + '</b>. Pregúntate si ahí sobra gente que llegó o si falta gente que se fue.',
                'It was <b>' + BINS[it.bin] + '</b>. Ask yourself whether there are extra people who arrived or missing people who left.'), 'warn');
    setTimeout(function(){ if (EFF) { EFF.lock = false; effRender(); } }, 1600);
    return;
  }
  effRender(S('Todavía no. ¿Ese efecto se siente donde la gente se fue o donde la gente llegó?',
              'Not yet. Is that effect felt where people left or where people arrived?'), 'warn');
}

function reflectTab(which, btn){
  ['type','draw'].forEach(function(k){
    var el = document.getElementById('reflect_' + k);
    if (el) el.classList.toggle('active', k === which);
  });
  var tabs = btn.closest('.wtabs');
  if (tabs) tabs.querySelectorAll('.wtab').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  if (which === 'draw') setTimeout(function(){
    var c = document.getElementById('reflectCv');
    if (c && !c.width) initCanvas(c);

      hint:{ es:'Pregúntate qué necesita cada persona que llega y qué puede aportar al llegar.',
             en:'Ask yourself what each arriving person needs and what they can contribute on arrival.' },
      explanation:{ es:'Sesenta mil personas nuevas necesitan techo, agua y transporte, y al mismo tiempo ofrecen su trabajo a las empresas de la ciudad. Las otras tres opciones describen lo que pasa en el lugar del que la gente se va, no en el que la recibe.',
                    en:'Sixty thousand new people need shelter, water and transport, and at the same time they offer their labour to the companies of the city. The other three options describe what happens in the place people leave, not in the one receiving them.' } }
  ], rng), rng);

  buildReflect(rng);

  /* ── CIERRE ─────────────────────────────────────────────────── */
  addSection(S('CIERRE','CLOSING'),
    '<h2>' + S('Dos situaciones para cerrar','Two situations to close with') + '</h2>' +
    '<p>' + S('Aquí van dos casos nuevos: uno pide leer los números de dos ciudades y el otro pide decidir qué hacer con lo que ya sabes.',
              'Here are two new cases: one asks you to read the numbers of two cities and the other asks you to decide what to do with what you already know.') + '</p>');

  /* ── PROBLEMA 9 ─────────────────────────────────────────────── */
  addProblem(pick([
    { title:{ es:'Dos ciudades del mismo tamaño', en:'Two cities of the same size' }, showWork:true,
      stmt:{ es:'En un mismo año, a la ciudad A llegaron 12 000 personas y salieron 4 500; a la ciudad B llegaron 5 000 y salieron 9 000. Las dos tienen 200 000 habitantes. ¿Qué enunciado describe correctamente lo ocurrido?',
             en:'In the same year, 12 000 people arrived in city A and 4 500 left; 5 000 arrived in city B and 9 000 left. Both have 200 000 inhabitants. Which statement correctly describes what happened?' },
      options:{ es:[
        'A tuvo un saldo de +7 500 y es lugar de atracción; B tuvo un saldo de 4 000 menos y es lugar de expulsión.',
        'A tuvo un saldo de +16 500 y es lugar de atracción; B tuvo un saldo de +14 000 y también lo es.',
        'A tuvo un saldo de 7 500 menos y es lugar de expulsión; B tuvo un saldo de +4 000 y es lugar de atracción.',
        'Las dos tuvieron el mismo saldo, porque en total se movió la misma cantidad de personas.' ],
        en:[
        'A had a net figure of +7 500 and is a place of attraction; B had a net figure of 4 000 fewer and is a place of expulsion.',
        'A had a net figure of +16 500 and is a place of attraction; B had +14 000 and is one too.',
        'A had a net figure of 7 500 fewer and is a place of expulsion; B had +4 000 and is a place of attraction.',
        'Both had the same net figure, because in total the same number of people moved.' ] },
      correct:0,
      hint:{ es:'Trabaja cada ciudad por separado y recuerda qué pregunta contesta la resta y cuál la suma.',
             en:'Work on each city separately and remember which question the subtraction answers and which one the sum answers.' },
      explanation:{ es:'En A, 12 000 − 4 500 deja +7 500, así que gana habitantes y atrae. En B, 5 000 − 9 000 deja 4 000 menos, así que pierde habitantes y expulsa. Las cifras de 16 500 y 14 000 son sumas: dicen cuánta gente se movió, no si la ciudad ganó o perdió, y esos totales tampoco son iguales entre sí.',
                    en:'In A, 12 000 − 4 500 leaves +7 500, so it gains inhabitants and attracts. In B, 5 000 − 9 000 leaves 4 000 fewer, so it loses inhabitants and expels. The 16 500 and 14 000 figures are sums: they say how many people moved, not whether the city gained or lost, and those totals are not equal to each other either.' } },
    { title:{ es:'Dos ciudades del mismo tamaño', en:'Two cities of the same size' }, showWork:true,
      stmt:{ es:'En un mismo año, a la ciudad A llegaron 9 000 personas y salieron 3 200; a la ciudad B llegaron 2 400 y salieron 6 900. Las dos tienen 150 000 habitantes. ¿Qué enunciado describe correctamente lo ocurrido?',
             en:'In the same year, 9 000 people arrived in city A and 3 200 left; 2 400 arrived in city B and 6 900 left. Both have 150 000 inhabitants. Which statement correctly describes what happened?' },
      options:{ es:[
        'A tuvo un saldo de +5 800 y es lugar de atracción; B tuvo un saldo de 4 500 menos y es lugar de expulsión.',
        'A tuvo un saldo de +12 200 y es lugar de atracción; B tuvo un saldo de +9 300 y también lo es.',
        'A tuvo un saldo de 5 800 menos y es lugar de expulsión; B tuvo un saldo de +4 500 y es lugar de atracción.',
        'Las dos tuvieron el mismo saldo, porque en total se movió la misma cantidad de personas.' ],
        en:[
        'A had a net figure of +5 800 and is a place of attraction; B had a net figure of 4 500 fewer and is a place of expulsion.',
        'A had a net figure of +12 200 and is a place of attraction; B had +9 300 and is one too.',
        'A had a net figure of 5 800 fewer and is a place of expulsion; B had +4 500 and is a place of attraction.',
        'Both had the same net figure, because in total the same number of people moved.' ] },
      correct:0,
      hint:{ es:'Trabaja cada ciudad por separado y recuerda qué pregunta contesta la resta y cuál la suma.',
             en:'Work on each city separately and remember which question the subtraction answers and which one the sum answers.' },
      explanation:{ es:'En A, 9 000 − 3 200 deja +5 800, así que gana habitantes y atrae. En B, 2 400 − 6 900 deja 4 500 menos, así que pierde habitantes y expulsa. Las cifras de 12 200 y 9 300 son sumas: cuentan a toda la gente que se movió y además no coinciden entre sí.',
                    en:'In A, 9 000 − 3 200 leaves +5 800, so it gains inhabitants and attracts. In B, 2 400 − 6 900 leaves 4 500 fewer, so it loses inhabitants and expels. The 12 200 and 9 300 figures are sums: they count everyone who moved and they do not even match each other.' } }
  ], rng), rng);

  /* ── PROBLEMA 10 ────────────────────────────────────────────── */
  addProblem(pick([
    { title:{ es:'Una decisión del ayuntamiento', en:'A decision by the town council' }, showWork:false,
      stmt:{ es:'Un ayuntamiento recibe cada año a familias que llegan de otras entidades a trabajar. Quiere responder a esa llegada sin vulnerar derechos. ¿Cuál medida cumple las dos cosas?',
             en:'A town council receives families arriving from other states to work every year. It wants to respond to that arrival without violating rights. Which measure meets both aims?' },
      options:{ es:[
        'Ampliar cupos en escuelas y clínicas e inscribir a niñas y niños sin exigir comprobantes del lugar de origen.',
        'Autorizar la estancia únicamente a quienes lleguen con un contrato de trabajo ya firmado.',
        'Cobrar una cuota de entrada a cada familia que llega para pagar los servicios que va a usar.',
        'Concentrar a las familias que llegan en una sola colonia alejada de los servicios del centro.' ],
        en:[
        'Expand places in schools and clinics and enroll children without demanding proof of their place of origin.',
        'Authorise the stay only for those arriving with a work contract already signed.',
        'Charge an entry fee to each arriving family to pay for the services it will use.',
        'Concentrate the arriving families in a single neighbourhood far from the services downtown.' ] },
      correct:0,
      hint:{ es:'Revisa cada medida dos veces: primero si respeta el derecho a moverse y después si atiende lo que la llegada provoca.',
             en:'Check each measure twice: first whether it respects the right to move and then whether it addresses what the arrival causes.' },
      explanation:{ es:'Ampliar servicios responde al efecto real de la llegada, e inscribir sin comprobantes mantiene en pie el derecho a la educación. Las otras tres ponen condiciones, cobros o separaciones que limitan la movilidad y, además, no resuelven la presión sobre los servicios.',
                    en:'Expanding services responds to the real effect of the arrival, and enrolling without proof keeps the right to education standing. The other three set conditions, charges or separations that limit mobility and, on top of that, do not solve the pressure on services.' } },
    { title:{ es:'Una decisión de la escuela', en:'A decision by the school' }, showWork:false,
      stmt:{ es:'A una secundaria llegan cada año estudiantes de otras entidades y de otros países. La dirección quiere aprovechar esa llegada sin discriminar a nadie. ¿Cuál medida cumple las dos cosas?',
             en:'A secondary school receives students from other states and other countries every year. The principal wants to make the most of that arrival without discriminating against anyone. Which measure meets both aims?' },
      options:{ es:[
        'Llevar al salón las lenguas, las comidas y las historias de las familias que llegan, y admitir a todas por igual.',
        'Abrir un grupo aparte para quienes llegan, hasta que se acostumbren a la forma de trabajo del plantel.',
        'Pedir a las familias que llegan una carta de recomendación de su escuela anterior antes de inscribir.',
        'Aplicar un examen de cultura local y admitir solo a quienes lo aprueben en el primer intento.' ],
        en:[
        'Bring the languages, food and stories of the arriving families into the classroom, and admit them all equally.',
        'Open a separate group for newcomers until they get used to how the school works.',
        'Ask the arriving families for a recommendation letter from their previous school before enrolling.',
        'Apply a local culture exam and admit only those who pass it on the first attempt.' ] },
      correct:0,
      hint:{ es:'Revisa cada medida dos veces: primero si respeta el derecho a estudiar y después si aprovecha lo que la llegada trae.',
             en:'Check each measure twice: first whether it respects the right to study and then whether it makes use of what the arrival brings.' },
      explanation:{ es:'Llevar al salón lo que traen las familias convierte la llegada en algo que suma para todo el grupo, y admitir por igual sostiene el derecho a estudiar. Separar en otro grupo, pedir cartas o aplicar un examen de cultura local levantan barreras que dependen del origen de la persona.',
                    en:'Bringing what the families carry into the classroom turns the arrival into something that adds for the whole group, and admitting everyone equally upholds the right to study. Separating newcomers, demanding letters or applying a local culture exam raise barriers that depend on where the person comes from.' } }
  ], rng), rng);
}
</script>
</body>
</html>
