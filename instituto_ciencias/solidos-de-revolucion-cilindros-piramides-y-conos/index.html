<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sólidos de Revolución: Cilindros, Pirámides y Conos</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }

/* ── MANIPULATIVES ── */
.mcv { display:block; width:100%; height:270px; touch-action:none; background:var(--surface); }
.mrow { display:flex; flex-wrap:wrap; gap:.5rem; align-items:center; margin-top:.7rem; }
.mbtn { background:var(--surface2); border:1.5px solid var(--border); border-radius:8px; padding:.55rem .9rem; font-size:.82rem; cursor:pointer; color:var(--text2); font-family:inherit; min-height:44px; transition:all .14s; }
.mbtn:hover { border-color:var(--green); color:var(--green); }
.mbtn.on { background:var(--green-bg); border-color:var(--green); color:var(--green-dark); font-weight:600; }
.mbtn.go { background:var(--green); color:#fff; border-color:var(--green); }
.mbtn.go:hover { background:var(--green-dark); color:#fff; }
.mfb { margin-top:.7rem; padding:.6rem .85rem; border-radius:8px; font-size:.84rem; background:var(--surface2); color:var(--text2); border-left:3px solid var(--border); }
.mfb.good { background:var(--ok-bg); color:var(--ok); border-left-color:var(--ok); }
.mfb.near { background:var(--gold-bg); color:var(--text2); border-left-color:var(--gold); }
.mstat { display:grid; grid-template-columns:repeat(3,1fr); gap:.5rem; margin-top:.7rem; }
.mtile { background:var(--surface2); border-radius:8px; padding:.55rem .35rem; text-align:center; border:1.5px solid var(--border); }
.mtile.hit { border-color:var(--ok); background:var(--ok-bg); }
.mtile .tl { font-size:.62rem; text-transform:uppercase; letter-spacing:.05em; color:var(--text3); }
.mtile .tv { font-family:'IBM Plex Mono',monospace; font-size:.9rem; font-weight:600; color:var(--text); }
.mhead { display:flex; justify-content:space-between; align-items:baseline; gap:.6rem; flex-wrap:wrap; margin-bottom:.4rem; }
.mtitle { font-weight:600; font-size:.95rem; }
.mround { font-family:'IBM Plex Mono',monospace; font-size:.68rem; letter-spacing:.09em; text-transform:uppercase; color:var(--gold); font-weight:600; }
.mgoal { background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.55rem .8rem; font-size:.85rem; color:var(--text2); margin-bottom:.6rem; }
.mnote { font-size:.76rem; color:var(--text3); margin-top:.5rem; }
.mpieces { display:grid; grid-template-columns:repeat(auto-fit,minmax(168px,1fr)); gap:.5rem; margin-top:.7rem; }
.mpiece { display:flex; align-items:center; gap:.35rem; background:var(--surface2); border:1.5px solid var(--border); border-radius:8px; padding:.25rem .35rem; }
.mpiece.has { border-color:var(--green); }
.mpname { font-size:.76rem; color:var(--text2); flex:1; }
.mpcount { font-family:'IBM Plex Mono',monospace; font-size:.9rem; font-weight:600; color:var(--green-dark); min-width:1.4rem; text-align:center; }
.mpbtn { min-width:44px; min-height:44px; border-radius:8px; border:1.5px solid var(--border); background:var(--surface); color:var(--text2); font-size:1rem; font-weight:600; cursor:pointer; font-family:inherit; }
.mpbtn:hover { border-color:var(--green); color:var(--green); }
@media (max-width:600px){ .mstat { grid-template-columns:1fr 1fr; } .mcv { height:240px; } .mbtn { font-size:.78rem; padding:.5rem .6rem; } .mpieces { grid-template-columns:1fr; } }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Sólidos de Revolución: Cilindros, Pirámides y Conos</div>
    <div class="wcourse" id="wcourse-el">Matemáticas · 3° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');

}

async function generatePDF() {
  var btn = document.getElementById('dlBtn');
  btn.textContent = 'Generando PDF…';
  btn.disabled = true;

  var jspdf   = window.jspdf;
  var doc     = new jspdf.jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });
  var PW      = 215.9;
  var M       = 18;
  var TW      = PW - M * 2;
  var PH      = doc.internal.pageSize.height;
  var name    = studentData.name;
  var group   = studentData.group;
  var total   = problems.length;
  var pct     = Math.round(correctCount / total * 100);
  var dateStr = new Date().toLocaleString('es-MX', { dateStyle:'long', timeStyle:'short' });

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS — INJECTION BLOCK ─────────────────────────────────────────
  //   Match these RGB values to --green and --gold above.
  //   PRIMARY  → pBR, pBG, pBB
  //   ACCENT   → pAR, pAG, pAB
  // ──────────────────────────────────────────────────────────────────────────
  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;  // PRIMARY (from SCHOOL, Rule 16)
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;   // ACCENT (from SCHOOL, Rule 16)

  function pdfText(html) {
    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')

/* ---------- small helpers ---------- */
function L(es, en){ return LANG === 'en' ? en : es; }
function cssv(n){ try { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); } catch(e){ return ''; } }
function num(v){ var r = Math.round(v * 100) / 100; return String(r); }
function d2(v){ return (Math.round(v * 100) / 100).toFixed(2); }
function frac(n, d){ return '<span class="mf-outer"><span class="mf-num">' + n + '</span><span class="mf-den">' + d + '</span></span>'; }
function addSection(html){
  var d = document.createElement('div');
  d.className = 'section';
  d.innerHTML = html;

  return d;

function shuffleOpts(opts, correct, rng){
  var a = opts.slice();
  for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(rng() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
  return { options: a, correctIdx: a.indexOf(correct) };
}
function pushProb(spec, rng){
  var s = shuffleOpts(spec.options, spec.correct, rng);
  var prob = {
    title: spec.title, questionText: spec.questionText, fn: spec.fn || '',
    hint: spec.hint || '', explanation: spec.explanation || '',
    options: s.options, correctIdx: s.correctIdx, showWork: !!spec.showWork,
    studentChoice: null, pendingChoice: null
  };
  problems.push(prob);
  buildOneCard(prob, problems.length - 1);
}

/* ---------- canvas helpers ---------- */
function cvFit(id){
  var cv = document.getElementById(id);
  if (!cv) return null;
  var dpr = window.devicePixelRatio || 1;
  var r = cv.getBoundingClientRect();
  var w = Math.max(240, Math.round(r.width));
  var h = Math.max(190, Math.round(r.height));
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  var ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  return { ctx: ctx, w: w, h: h };
}
function cvText(ctx, txt, x, y, col, align, size, bold){
  ctx.save();
  ctx.fillStyle = col; ctx.textAlign = align || 'left'; ctx.textBaseline = 'middle';
  ctx.font = (bold ? '600 ' : '500 ') + (size || 12) + 'px "IBM Plex Sans", sans-serif';
  ctx.fillText(txt, x, y);
  ctx.restore();
}
function polyPath(ctx, pts, col, width, fill, dash){
  ctx.save();
  ctx.beginPath();
  pts.forEach(function(p, i){ if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); });
  ctx.closePath();
  if (fill){ ctx.fillStyle = fill; ctx.fill(); }
  if (dash) ctx.setLineDash([5, 4]);
  ctx.strokeStyle = col; ctx.lineWidth = width || 2; ctx.stroke();
  ctx.restore();
}
function ellip(ctx, cx, cy, rx, ry, col, fill, dash, width){
  ctx.save();
  ctx.beginPath(); ctx.ellipse(cx, cy, Math.max(0.5, rx), Math.max(0.5, ry), 0, 0, Math.PI * 2);
  if (fill){ ctx.fillStyle = fill; ctx.fill(); }
  if (dash) ctx.setLineDash([5, 4]);
  ctx.strokeStyle = col; ctx.lineWidth = width || 1.8; ctx.stroke();
  ctx.restore();
}
function segLine(ctx, x1, y1, x2, y2, col, width, dash){
  ctx.save();
  if (dash) ctx.setLineDash([5, 4]);
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
  ctx.strokeStyle = col; ctx.lineWidth = width || 1.6; ctx.stroke();
  ctx.restore();
}
function setFb(id, txt, cls){
  var e = document.getElementById(id);
  if (!e) return;
  e.innerHTML = txt;
  e.className = 'mfb' + (cls ? ' ' + cls : '');
}

var M1 = null, M2 = null, M3 = null, M4 = null;

/* ================================================
   MANIPULATIVE 1 : Taller del torno
   The student chooses a plane profile; the canvas immediately shows the
   solid that profile sweeps out when it spins around the axis. Three
   rounds, each with a different target solid.
   ================================================ */
var M1_SOLID = { rect:'cil', tri:'cono', semi:'esf', trap:'tronco' };
var M1_PROF  = { cil:'rect', cono:'tri', esf:'semi', tronco:'trap' };
function m1ProfName(p){
  if (p === 'rect') return L('Rectángulo', 'Rectangle');
  if (p === 'tri')  return L('Triángulo rectángulo', 'Right triangle');
  if (p === 'semi') return L('Semicírculo', 'Semicircle');
  return L('Trapecio rectángulo', 'Right trapezoid');
}
function m1SolidName(s){
  if (s === 'cil')  return L('un cilindro', 'a cylinder');
  if (s === 'cono') return L('un cono', 'a cone');
  if (s === 'esf')  return L('una esfera', 'a sphere');
  return L('un tronco de cono', 'a truncated cone');
}
function m1Clue(s){
  if (s === 'cil')  return L('El objetivo se mantiene a la misma distancia del eje en toda su altura.', 'The target stays at the same distance from the axis all along its height.');
  if (s === 'cono') return L('El objetivo se estrecha hasta tocar el eje en un solo punto.', 'The target narrows until it touches the axis at a single point.');
  if (s === 'esf')  return L('El objetivo no tiene ninguna cara plana: su contorno es curvo de extremo a extremo.', 'The target has no flat face at all: its outline is curved from end to end.');
  return L('El objetivo se estrecha, pero se queda con dos bases planas de distinto tamaño.', 'The target narrows, but keeps two flat bases of different size.');
}
function m1Html(){
  return '<div class="gcrd">' +
    '<div class="mhead"><div class="mtitle">' + L('Taller del torno', 'Lathe workshop') + '</div><div class="mround" id="m1r"></div></div>' +
    '<div class="mgoal" id="m1goal"></div>' +
    '<canvas class="mcv" id="m1cv"></canvas>' +
    '<div class="mrow" id="m1btns"></div>' +
    '<div class="mrow"><button class="mbtn go" id="m1go" onclick="m1Check()">' + L('Girar el perfil', 'Spin the profile') + '</button></div>' +
    '<div class="mfb" id="m1fb"></div>' +
    '<div class="mnote">' + L('El eje punteado es la recta fija; el perfil siempre se apoya en ella.', 'The dashed axis is the fixed line; the profile always rests on it.') + '</div>' +
  '</div>';
}
function m1Build(rng){
  M1 = { rounds: shuffle(['cono', 'cil', 'tronco', 'esf'], rng).slice(0, 3), i: 0, tries: 0, sel: 'rect', done: false };
}
function m1Init(){
  var box = document.getElementById('m1btns');
  if (!box || !M1) return;
  box.innerHTML = ['rect', 'tri', 'semi', 'trap'].map(function(p){
    return '<button class="mbtn" id="m1b_' + p + '" onclick="m1Pick(\'' + p + '\')">' + m1ProfName(p) + '</button>';
  }).join('');
  m1Render();
  setFb('m1fb', L('Elige un perfil y observa el cuerpo que barre al girar.', 'Choose a profile and watch the solid it sweeps out as it spins.'), '');
}
function m1Render(){
  if (!M1) return;
  var r = document.getElementById('m1r'), g = document.getElementById('m1goal');
  if (!r || !g) return;
  if (M1.done){
    r.textContent = L('Completo', 'Complete');
    g.innerHTML = L('Ya generaste los tres cuerpos. Sigue probando perfiles si quieres.', 'You have generated all three solids. Keep trying profiles if you want.');
  } else {
    var want = M1.rounds[M1.i];
    r.textContent = L('Ronda ', 'Round ') + (M1.i + 1) + '/3';
    g.innerHTML = L('Objetivo: genera <strong>' + m1SolidName(want) + '</strong>.', 'Goal: generate <strong>' + m1SolidName(want) + '</strong>.');
  }
  ['rect', 'tri', 'semi', 'trap'].forEach(function(p){
    var b = document.getElementById('m1b_' + p);
    if (b) b.classList.toggle('on', p === M1.sel);
  });
  m1Draw();
}
function m1Pick(p){
  if (!M1) return;
  M1.sel = p;
  setFb('m1fb', L('Con este perfil barres ' + m1SolidName(M1_SOLID[p]) + '.', 'With this profile you sweep out ' + m1SolidName(M1_SOLID[p]) + '.'), '');
  m1Render();
}
function m1Check(){
  if (!M1 || M1.done) return;
  var want = M1.rounds[M1.i], got = M1_SOLID[M1.sel];
  if (got === want){
    setFb('m1fb', L('¡Exacto! ' + m1ProfName(M1.sel) + ' apoyado en el eje barre ' + m1SolidName(want) + '. 🎉', 'Exactly. A ' + m1ProfName(M1.sel).toLowerCase() + ' resting on the axis sweeps out ' + m1SolidName(want) + '. 🎉'), 'good');
    M1.i++; M1.tries = 0;
    if (M1.i >= M1.rounds.length){ M1.done = true; setTimeout(function(){ m1Render(); setFb('m1fb', L('Los tres cuerpos salieron del mismo movimiento: girar una figura plana alrededor de un eje.', 'All three solids came from the same movement: spinning a plane figure around an axis.'), 'good'); }, 900); }
    else setTimeout(m1Render, 900);
    return;
  }
  M1.tries++;
  if (M1.tries >= 3){
    M1.sel = M1_PROF[want];
    setFb('m1fb', L('El perfil que lo genera es: ' + m1ProfName(M1.sel) + '. Al girar, cada punto describe una circunferencia y su distancia al eje se vuelve un radio.', 'The profile that generates it is: ' + m1ProfName(M1.sel) + '. As it spins, every point traces a circle and its distance to the axis becomes a radius.'), 'near');
    M1.i++; M1.tries = 0;
    if (M1.i >= M1.rounds.length) M1.done = true;
    setTimeout(m1Render, 1400);
    m1Draw();
    return;
  }
  setFb('m1fb', L('Obtuviste ' + m1SolidName(got) + '. ' + m1Clue(want), 'You got ' + m1SolidName(got) + '. ' + m1Clue(want)), 'near');
}
function m1Draw(){
  var c = cvFit('m1cv');
  if (!c || !M1) return;
  var ctx = c.ctx, w = c.w, h = c.h;
  var gr = cssv('--green'), gd = cssv('--green-dark'), go = cssv('--gold'), tx = cssv('--text3'), bd = cssv('--border'), gbg = cssv('--green-bg');
  segLine(ctx, w / 2, 16, w / 2, h - 12, bd, 1, false);
  cvText(ctx, L('Figura que gira', 'Figure that spins'), 12, 14, tx, 'left', 11, true);
  cvText(ctx, L('Cuerpo generado', 'Generated solid'), w - 12, 14, tx, 'right', 11, true);
  var ax = w * 0.14, yTop = 46, yBot = h - 34, pw = Math.min(84, w * 0.24);
  segLine(ctx, ax, 30, ax, h - 20, go, 1.5, true);
  cvText(ctx, L('eje', 'axis'), ax, h - 11, go, 'center', 10, false);
  var p = M1.sel, pts = null;
  if (p === 'rect') pts = [{x:ax,y:yTop},{x:ax+pw,y:yTop},{x:ax+pw,y:yBot},{x:ax,y:yBot}];
  if (p === 'tri')  pts = [{x:ax,y:yTop},{x:ax,y:yBot},{x:ax+pw,y:yBot}];
  if (p === 'trap') pts = [{x:ax,y:yTop},{x:ax+pw*0.45,y:yTop},{x:ax+pw,y:yBot},{x:ax,y:yBot}];
  if (pts) polyPath(ctx, pts, gd, 2.2, gbg, false);
  if (p === 'semi'){
    ctx.save();
    ctx.beginPath();
    ctx.arc(ax, (yTop + yBot) / 2, (yBot - yTop) / 2, -Math.PI / 2, Math.PI / 2);
    ctx.closePath();
    ctx.fillStyle = gbg; ctx.fill();
    ctx.strokeStyle = gd; ctx.lineWidth = 2.2; ctx.stroke();
    ctx.restore();
  }
  ctx.save(); ctx.globalAlpha = 0.45;
  segLine(ctx, ax + pw + 6, (yTop + yBot) / 2, ax + pw + 26, (yTop + yBot) / 2, go, 1.6, false);
  ctx.restore();
  cvText(ctx, '↻', ax + pw + 30, (yTop + yBot) / 2, go, 'left', 15, true);
  var kind = M1_SOLID[p];
  var cx = w * 0.5 + w * 0.25, cy = (yTop + yBot) / 2;
  var rad = Math.min(w * 0.15, 60), hg = (yBot - yTop) * 0.86, ry = rad * 0.30;
  if (kind === 'cil'){
    polyPath(ctx, [{x:cx-rad,y:cy-hg/2},{x:cx+rad,y:cy-hg/2},{x:cx+rad,y:cy+hg/2},{x:cx-rad,y:cy+hg/2}], gr, 0, gbg, false);
    ellip(ctx, cx, cy + hg / 2, rad, ry, gr, gbg, false, 2);
    segLine(ctx, cx - rad, cy - hg / 2, cx - rad, cy + hg / 2, gr, 2, false);
    segLine(ctx, cx + rad, cy - hg / 2, cx + rad, cy + hg / 2, gr, 2, false);
    ellip(ctx, cx, cy - hg / 2, rad, ry, gr, gbg, false, 2);
  } else if (kind === 'cono'){
    polyPath(ctx, [{x:cx,y:cy-hg/2},{x:cx+rad,y:cy+hg/2},{x:cx-rad,y:cy+hg/2}], gr, 0, gbg, false);
    ellip(ctx, cx, cy + hg / 2, rad, ry, gr, gbg, false, 2);
    segLine(ctx, cx - rad, cy + hg / 2, cx, cy - hg / 2, gr, 2, false);
    segLine(ctx, cx + rad, cy + hg / 2, cx, cy - hg / 2, gr, 2, false);
  } else if (kind === 'esf'){
    var rr = Math.min(rad, hg / 2);
    ellip(ctx, cx, cy, rr, rr, gr, gbg, false, 2);
    ellip(ctx, cx, cy, rr, rr * 0.30, gr, '', true, 1.4);
  } else {
    var rt = rad * 0.5;
    polyPath(ctx, [{x:cx-rt,y:cy-hg/2},{x:cx+rt,y:cy-hg/2},{x:cx+rad,y:cy+hg/2},{x:cx-rad,y:cy+hg/2}], gr, 0, gbg, false);
    ellip(ctx, cx, cy + hg / 2, rad, ry, gr, gbg, false, 2);
    segLine(ctx, cx - rt, cy - hg / 2, cx - rad, cy + hg / 2, gr, 2, false);
    segLine(ctx, cx + rt, cy - hg / 2, cx + rad, cy + hg / 2, gr, 2, false);
    ellip(ctx, cx, cy - hg / 2, rt, rt * 0.30, gr, gbg, false, 2);
  }
  cvText(ctx, m1SolidName(kind), cx, cy + hg / 2 + 24, gd, 'center', 12, true);
}

/* ================================================
   MANIPULATIVE 2 : Abre el cono
   The lateral surface of a cone is a circular sector. The student opens
   or closes the sector angle and sees, in real time, the circle its
   curved edge would close into, next to the base circle it must match.
   ================================================ */
var M2_ROUNDS = [ {g:12, rt:4}, {g:15, rt:5}, {g:18, rt:6}, {g:10, rt:4}, {g:20, rt:8}, {g:24, rt:9} ];
function m2Html(){

    '<div class="mhead"><div class="mtitle">' + L('Abre el cono', 'Open the cone') + '</div><div class="mround" id="m2r"></div></div>' +

      '<label>' + L('Ángulo del sector: ', 'Sector angle: ') + '<span class="cval" id="m2av">120°</span></label>' +

      '<div class="mtile" id="m2t2"><div class="tl">' + L('Contorno de la base', 'Base outline') + '</div><div class="tv" id="m2v2">0</div></div>' +
      '<div class="mtile" id="m2t3"><div class="tl">' + L('Radio que se obtiene', 'Radius obtained') + '</div><div class="tv" id="m2v3">0</div></div>' +
    '</div>' +
    '<div class="mrow"><button class="mbtn go" onclick="m2Check()">' + L('Enrollar el sector', 'Roll up the sector') + '</button></div>' +
    '<div class="mfb" id="m2fb"></div>' +
  '</div>';
}
function m2Build(rng){
  M2 = { rounds: shuffle(M2_ROUNDS, rng).slice(0, 3), i: 0, tries: 0, ang: 120, done: false };
}
function m2Init(){
  if (!M2) return;
  m2Render();
  setFb('m2fb', L('Mueve el ángulo y observa cómo cambia el círculo que se forma al enrollar.', 'Move the angle and watch the circle formed when it rolls up change.'), '');
}
function m2Cur(){ return M2.rounds[M2.i] || M2.rounds[M2.rounds.length - 1]; }
function m2Radius(){ return m2Cur().g * M2.ang / 360; }
function m2Render(){
  if (!M2) return;
  var r = document.getElementById('m2r'), g = document.getElementById('m2goal'), sl = document.getElementById('m2ang');
  if (!r || !g) return;
  var cur = m2Cur();
  if (M2.done){
    r.textContent = L('Completo', 'Complete');
    g.innerHTML = L('Cerraste los tres conos. El borde curvo del sector siempre tiene que medir lo mismo que el contorno de la base.', 'You closed all three cones. The curved edge of the sector always has to measure the same as the base outline.');
  } else {
    r.textContent = L('Ronda ', 'Round ') + (M2.i + 1) + '/3';
    g.innerHTML = L('Objetivo: el sector mide ' + cur.g + ' cm de radio. Ábrelo hasta que se enrolle justo sobre una base de <strong>' + cur.rt + ' cm</strong> de radio.', 'Goal: the sector has a radius of ' + cur.g + ' cm. Open it until it rolls up exactly onto a base of radius <strong>' + cur.rt + ' cm</strong>.');
  }
  if (sl) sl.value = String(M2.ang);
  m2Update();
}
function m2Slide(){
  if (!M2 || M2.done) return;
  var sl = document.getElementById('m2ang');
  M2.ang = parseInt(sl.value, 10);
  m2Update();
  var cur = m2Cur(), r = m2Radius(), dif = r - cur.rt;
  if (Math.abs(dif) <= 0.03) setFb('m2fb', L('El borde curvo coincide con el contorno de la base. Enróllalo.', 'The curved edge matches the base outline. Roll it up.'), 'good');
  else if (dif < 0) setFb('m2fb', L('El círculo que se forma queda ' + num(Math.abs(dif)) + ' cm corto: abre más el sector.', 'The circle formed falls ' + num(Math.abs(dif)) + ' cm short: open the sector wider.'), 'near');
  else setFb('m2fb', L('El círculo que se forma se pasa por ' + num(dif) + ' cm: cierra un poco el sector.', 'The circle formed overshoots by ' + num(dif) + ' cm: close the sector a little.'), 'near');
}
function m2Update(){
  if (!M2) return;
  var cur = m2Cur(), r = m2Radius();
  var av = document.getElementById('m2av');
  if (av) av.textContent = M2.ang + '°';
  var e1 = document.getElementById('m2v1'), e2 = document.getElementById('m2v2'), e3 = document.getElementById('m2v3');
  if (e1) e1.textContent = d2(2 * 3.14 * cur.g * M2.ang / 360) + ' cm';
  if (e2) e2.textContent = d2(2 * 3.14 * cur.rt) + ' cm';
  if (e3) e3.textContent = num(r) + ' cm';
  var hit = Math.abs(r - cur.rt) <= 0.03;
  ['m2t1', 'm2t2', 'm2t3'].forEach(function(id){ var t = document.getElementById(id); if (t) t.classList.toggle('hit', hit); });
  m2Draw();
}
function m2Draw(){
  var c = cvFit('m2cv');
  if (!c || !M2) return;
  var ctx = c.ctx, w = c.w, h = c.h;
  var gr = cssv('--green'), gd = cssv('--green-dark'), go = cssv('--gold'), tx = cssv('--text3'), bd = cssv('--border'), gbg = cssv('--green-bg'), gobg = cssv('--gold-bg');
  segLine(ctx, w / 2, 16, w / 2, h - 12, bd, 1, false);
  cvText(ctx, L('Superficie lateral extendida', 'Lateral surface unrolled'), 12, 14, tx, 'left', 11, true);
  cvText(ctx, L('Base del cono', 'Base of the cone'), w - 12, 14, tx, 'right', 11, true);
  var cur = m2Cur(), r = m2Radius();
  var scale = Math.min((w * 0.5 - 46) / cur.g, (h - 62) / cur.g);
  var cx = w * 0.06 + 16, cy = h * 0.55, R = cur.g * scale;
  var a0 = -Math.PI / 2, a1 = a0 + M2.ang * Math.PI / 180;
  ctx.save();
  ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, R, a0, a1); ctx.closePath();
  ctx.fillStyle = gbg; ctx.fill(); ctx.strokeStyle = gd; ctx.lineWidth = 2; ctx.stroke();
  ctx.restore();
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, R, a0, a1);
  ctx.strokeStyle = go; ctx.lineWidth = 3.4; ctx.stroke();
  ctx.restore();
  cvText(ctx, cur.g + ' cm', cx + R * 0.42, cy - 8, gd, 'center', 11, true);
  cvText(ctx, M2.ang + '°', cx + 12, cy + 12, gd, 'left', 11, true);
  var bx = w * 0.75, by = h * 0.55;
  var bscale = Math.min((w * 0.5 - 50) / (cur.rt * 1.7), (h - 70) / (cur.rt * 2.2));
  var rt = cur.rt * bscale, rr = r * bscale;
  ellip(ctx, bx, by, rt, rt, go, gobg, true, 2);
  ellip(ctx, bx, by, rr, rr, gd, '', false, 2.6);
  cvText(ctx, L('meta ', 'target ') + cur.rt + ' cm', bx, by + rt + 16, go, 'center', 11, true);
  cvText(ctx, num(r) + ' cm', bx, by - rt - 14, gd, 'center', 11, true);
}
function m2Check(){
  if (!M2 || M2.done) return;
  var cur = m2Cur(), r = m2Radius();
  if (Math.abs(r - cur.rt) <= 0.03){
    setFb('m2fb', L('¡Cerró perfecto! Con ' + M2.ang + '° el borde curvo mide ' + d2(2 * 3.14 * cur.rt) + ' cm, igual que el contorno de la base. 🎉', 'A perfect fit. At ' + M2.ang + '° the curved edge measures ' + d2(2 * 3.14 * cur.rt) + ' cm, the same as the base outline. 🎉'), 'good');
    M2.i++; M2.tries = 0; M2.ang = 120;
    if (M2.i >= M2.rounds.length) M2.done = true;
    setTimeout(m2Render, 1100);
    return;
  }
  M2.tries++;
  if (M2.tries >= 3){
    M2.ang = Math.round(360 * cur.rt / cur.g);
    setFb('m2fb', L('El ángulo que cierra es ' + M2.ang + '°: el sector se queda con la fracción ' + cur.rt + '/' + cur.g + ' de la circunferencia completa, porque el borde curvo tiene que medir lo mismo que el contorno de la base.', 'The angle that closes it is ' + M2.ang + '°: the sector keeps the fraction ' + cur.rt + '/' + cur.g + ' of the full circle, because the curved edge has to measure the same as the base outline.'), 'near');
    M2.i++; M2.tries = 0;
    if (M2.i >= M2.rounds.length) M2.done = true;
    m2Update();
    setTimeout(function(){ M2.ang = 120; m2Render(); }, 1900);
    return;
  }
  var dif = r - cur.rt;
  setFb('m2fb', L('Todavía no cierra: el círculo que se forma tiene ' + num(r) + ' cm de radio y ' + (dif < 0 ? 'necesitas más borde curvo.' : 'te sobra borde curvo.'), 'It does not close yet: the circle formed has a radius of ' + num(r) + ' cm and ' + (dif < 0 ? 'you need more curved edge.' : 'you have curved edge to spare.')), 'near');
}

/* ================================================
   MANIPULATIVE 3 : Corte paralelo del cono
   Dragging the cutting plane up and down shows the two similar triangles
   and the radius of the circle of the cut, recomputed in real time.
   ================================================ */
var M3_ROUNDS = [ {H:12, R:9, rt:3}, {H:15, R:10, rt:4}, {H:12, R:8, rt:2}, {H:20, R:15, rt:6}, {H:18, R:12, rt:4} ];
function m3Html(){
  return '<div class="gcrd">' +
    '<div class="mhead"><div class="mtitle">' + L('Corte paralelo', 'Parallel cut') + '</div><div class="mround" id="m3r"></div></div>' +
    '<div class="mgoal" id="m3goal"></div>' +
    '<canvas class="mcv" id="m3cv"></canvas>' +
    '<div class="mstat">' +
      '<div class="mtile" id="m3t1"><div class="tl">' + L('Desde el vértice', 'From the apex') + '</div><div class="tv" id="m3v1">0</div></div>' +
      '<div class="mtile" id="m3t2"><div class="tl">' + L('Radio del corte', 'Radius of the cut') + '</div><div class="tv" id="m3v2">0</div></div>' +
      '<div class="mtile" id="m3t3"><div class="tl">' + L('Razón', 'Ratio') + '</div><div class="tv" id="m3v3">0</div></div>' +
    '</div>' +
    '<div class="mrow">' +
      '<button class="mbtn" onclick="m3Nudge(-0.5)">▲ ' + L('Subir', 'Up') + '</button>' +
      '<button class="mbtn" onclick="m3Nudge(0.5)">▼ ' + L('Bajar', 'Down') + '</button>' +
      '<button class="mbtn go" onclick="m3Check()">' + L('Fijar el corte', 'Fix the cut') + '</button>' +
    '</div>' +
    '<div class="mfb" id="m3fb"></div>' +
    '<div class="mnote">' + L('También puedes arrastrar directamente sobre el dibujo.', 'You can also drag directly on the drawing.') + '</div>' +
  '</div>';
}
function m3Build(rng){
  var rs = shuffle(M3_ROUNDS, rng).slice(0, 3);
  M3 = { rounds: rs, i: 0, tries: 0, d: rs[0].H / 2, done: false, drag: false, yA: 40, yB: 200 };
}
function m3Cur(){ return M3.rounds[M3.i] || M3.rounds[M3.rounds.length - 1]; }
function m3Rad(){ var c = m3Cur(); return c.R * M3.d / c.H; }
function m3Init(){
  var cv = document.getElementById('m3cv');
  if (!cv || !M3) return;
  var handler = function(e){
    if (!M3 || M3.done) return;
    if (e.cancelable) e.preventDefault();
    var rect = cv.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    var y = src.clientY - rect.top;
    var cur = m3Cur();
    var t = (y - M3.yA) / Math.max(1, (M3.yB - M3.yA));
    var d = t * cur.H;
    d = Math.max(0.5, Math.min(cur.H - 0.2, Math.round(d * 10) / 10));
    M3.d = d;
    m3Update(true);
  };
  cv.addEventListener('mousedown', function(e){ M3.drag = true; handler(e); });
  cv.addEventListener('mousemove', function(e){ if (M3.drag) handler(e); });
  window.addEventListener('mouseup', function(){ if (M3) M3.drag = false; });
  cv.addEventListener('touchstart', handler, { passive:false });
  cv.addEventListener('touchmove',  handler, { passive:false });
  m3Render();
  setFb('m3fb', L('Arrastra el corte y observa cómo cambia el radio del círculo.', 'Drag the cut and watch the radius of the circle change.'), '');
}
function m3Render(){
  if (!M3) return;
  var r = document.getElementById('m3r'), g = document.getElementById('m3goal');
  if (!r || !g) return;
  var cur = m3Cur();
  if (M3.done){
    r.textContent = L('Completo', 'Complete');
    g.innerHTML = L('En los tres cortes el radio quedó en la misma proporción que la altura: los triángulos son semejantes.', 'In all three cuts the radius kept the same proportion as the height: the triangles are similar.');
  } else {
    r.textContent = L('Ronda ', 'Round ') + (M3.i + 1) + '/3';
    g.innerHTML = L('Objetivo: el cono mide ' + cur.H + ' cm de altura y ' + cur.R + ' cm de radio. Coloca el corte donde el círculo tenga <strong>' + cur.rt + ' cm</strong> de radio.', 'Goal: the cone is ' + cur.H + ' cm tall with a radius of ' + cur.R + ' cm. Place the cut where the circle has a radius of <strong>' + cur.rt + ' cm</strong>.');
  }
  m3Update(false);
}
function m3Nudge(dd){
  if (!M3 || M3.done) return;
  var cur = m3Cur();
  M3.d = Math.max(0.5, Math.min(cur.H - 0.2, Math.round((M3.d + dd) * 10) / 10));
  m3Update(true);
}
function m3Update(live){
  if (!M3) return;
  var cur = m3Cur(), r = m3Rad();
  var e1 = document.getElementById('m3v1'), e2 = document.getElementById('m3v2'), e3 = document.getElementById('m3v3');
  if (e1) e1.textContent = num(M3.d) + ' cm';
  if (e2) e2.textContent = num(r) + ' cm';
  if (e3) e3.textContent = num(Math.round(M3.d / cur.H * 100) / 100);
  var hit = Math.abs(r - cur.rt) <= 0.05;
  ['m3t1', 'm3t2', 'm3t3'].forEach(function(id){ var t = document.getElementById(id); if (t) t.classList.toggle('hit', hit); });
  m3Draw();
  if (live && !M3.done){
    var dif = r - cur.rt;
    if (Math.abs(dif) <= 0.05) setFb('m3fb', L('Ese es el radio buscado. Fija el corte.', 'That is the radius you were after. Fix the cut.'), 'good');
    else if (dif < 0) setFb('m3fb', L('El círculo es ' + num(Math.abs(dif)) + ' cm más chico de lo pedido: baja el corte.', 'The circle is ' + num(Math.abs(dif)) + ' cm smaller than asked: move the cut down.'), 'near');
    else setFb('m3fb', L('El círculo es ' + num(dif) + ' cm más grande de lo pedido: sube el corte.', 'The circle is ' + num(dif) + ' cm bigger than asked: move the cut up.'), 'near');
  }
}
function m3Draw(){
  var c = cvFit('m3cv');
  if (!c || !M3) return;
  var ctx = c.ctx, w = c.w, h = c.h;
  var gr = cssv('--green'), gd = cssv('--green-dark'), go = cssv('--gold'), tx = cssv('--text3'), bd = cssv('--border'), gbg = cssv('--green-bg'), gobg = cssv('--gold-bg');
  var cur = m3Cur();
  var yA = 34, yB = h - 44, cx = w * 0.42;
  M3.yA = yA; M3.yB = yB;
  var Rpx = Math.min(w * 0.30, 108);
  var r = m3Rad(), rpx = Rpx * (r / cur.R);
  var yc = yA + (yB - yA) * (M3.d / cur.H);
  polyPath(ctx, [{x:cx,y:yA},{x:cx+Rpx,y:yB},{x:cx-Rpx,y:yB}], gd, 2.2, gbg, false);
  ellip(ctx, cx, yB, Rpx, Rpx * 0.20, gd, '', true, 1.4);
  segLine(ctx, cx, yA, cx, yB, bd, 1.2, true);
  ctx.save();
  ctx.beginPath(); ctx.moveTo(cx, yA); ctx.lineTo(cx + rpx, yc); ctx.lineTo(cx - rpx, yc); ctx.closePath();
  ctx.fillStyle = gobg; ctx.fill();
  ctx.restore();
  segLine(ctx, cx - rpx, yc, cx + rpx, yc, go, 3, false);
  ellip(ctx, cx, yc, rpx, Math.max(2, rpx * 0.20), go, '', false, 1.6);
  cvText(ctx, num(r) + ' cm', cx + rpx + 8, yc, go, 'left', 11, true);
  cvText(ctx, num(M3.d) + ' cm', cx - 8, (yA + yc) / 2, tx, 'right', 11, false);
  cvText(ctx, cur.H + ' cm', cx - 8, (yc + yB) / 2 + 6, tx, 'right', 11, false);
  cvText(ctx, cur.R + ' cm', cx + Rpx * 0.5, yB + 16, gd, 'center', 11, true);
  cvText(ctx, L('vértice', 'apex'), cx, yA - 14, gd, 'center', 11, true);
  cvText(ctx, L('altura total', 'total height'), cx - 8, yB - 8, tx, 'right', 10, false);
}
function m3Check(){
  if (!M3 || M3.done) return;
  var cur = m3Cur(), r = m3Rad();
  if (Math.abs(r - cur.rt) <= 0.05){
    setFb('m3fb', L('¡Justo! A ' + num(M3.d) + ' cm del vértice el radio es ' + cur.rt + ' cm: ' + cur.rt + ' es a ' + cur.R + ' como ' + num(M3.d) + ' es a ' + cur.H + '. 🎉', 'Spot on. At ' + num(M3.d) + ' cm from the apex the radius is ' + cur.rt + ' cm: ' + cur.rt + ' is to ' + cur.R + ' as ' + num(M3.d) + ' is to ' + cur.H + '. 🎉'), 'good');
    M3.i++; M3.tries = 0;
    if (M3.i >= M3.rounds.length) M3.done = true;
    else M3.d = m3Cur().H / 2;
    setTimeout(m3Render, 1200);
    return;
  }
  M3.tries++;
  if (M3.tries >= 3){
    M3.d = Math.round(cur.H * cur.rt / cur.R * 10) / 10;
    setFb('m3fb', L('El corte va a ' + num(M3.d) + ' cm del vértice: el triángulo pequeño y el grande son semejantes, así que el radio y la altura se reducen en la misma razón.', 'The cut goes ' + num(M3.d) + ' cm from the apex: the small and the large triangle are similar, so radius and height shrink in the same ratio.'), 'near');
    M3.i++; M3.tries = 0;
    if (M3.i >= M3.rounds.length) M3.done = true;
    m3Update(false);
    setTimeout(function(){ if (!M3.done) M3.d = m3Cur().H / 2; m3Render(); }, 2000);
    return;
  }
  var dif = r - cur.rt;
  setFb('m3fb', L('Aún no: el círculo mide ' + num(r) + ' cm de radio, ' + (dif < 0 ? 'necesitas alejar el corte del vértice.' : 'necesitas acercar el corte al vértice.'), 'Not yet: the circle has a radius of ' + num(r) + ' cm, ' + (dif < 0 ? 'move the cut further from the apex.' : 'move the cut closer to the apex.')), 'near');
}

/* ================================================
   MANIPULATIVE 4 : Bandeja de piezas
   The student adds and removes flat pieces until the tray holds exactly
   the net of the requested solid. The tray redraws with every tap.
   ================================================ */
var M4_KEYS = ['circ', 'rect', 'sect', 'tri', 'cuad'];
var M4_TARGETS = [
  { id:'cil',  need:{circ:2, rect:1, sect:0, tri:0, cuad:0} },
  { id:'cono', need:{circ:1, rect:0, sect:1, tri:0, cuad:0} },
  { id:'pirC', need:{circ:0, rect:0, sect:0, tri:4, cuad:1} },
  { id:'pirT', need:{circ:0, rect:0, sect:0, tri:4, cuad:0} }
];
function m4PieceName(k){
  if (k === 'circ') return L('Círculo', 'Circle');
  if (k === 'rect') return L('Rectángulo', 'Rectangle');
  if (k === 'sect') return L('Sector circular', 'Circular sector');
  if (k === 'tri')  return L('Triángulo isósceles', 'Isosceles triangle');
  return L('Cuadrado', 'Square');
}
function m4SolidName(id){
  if (id === 'cil')  return L('un cilindro recto cerrado', 'a closed right cylinder');
  if (id === 'cono') return L('un cono cerrado', 'a closed cone');
  if (id === 'pirC') return L('una pirámide recta de base cuadrada', 'a right pyramid with a square base');
  return L('una pirámide recta de base triangular', 'a right pyramid with a triangular base');
}
function m4Html(){
  return '<div class="gcrd">' +
    '<div class="mhead"><div class="mtitle">' + L('Bandeja de piezas', 'Piece tray') + '</div><div class="mround" id="m4r"></div></div>' +
    '<div class="mgoal" id="m4goal"></div>' +
    '<canvas class="mcv" id="m4cv"></canvas>' +
    '<div class="mpieces" id="m4pieces"></div>' +
    '<div class="mrow">' +
      '<button class="mbtn" onclick="m4Clear()">' + L('Vaciar la bandeja', 'Empty the tray') + '</button>' +
      '<button class="mbtn go" onclick="m4Check()">' + L('Doblar y armar', 'Fold and build') + '</button>' +
    '</div>' +
    '<div class="mfb" id="m4fb"></div>' +
  '</div>';
}
function m4Build(rng){
  M4 = { rounds: shuffle(M4_TARGETS, rng).slice(0, 3), i: 0, tries: 0, done: false,
         bag: {circ:0, rect:0, sect:0, tri:0, cuad:0} };
}
function m4Cur(){ return M4.rounds[M4.i] || M4.rounds[M4.rounds.length - 1]; }
function m4Init(){
  var box = document.getElementById('m4pieces');
  if (!box || !M4) return;
  box.innerHTML = M4_KEYS.map(function(k){
    return '<div class="mpiece" id="m4p_' + k + '">' +
      '<button class="mpbtn" onclick="m4Add(\'' + k + '\',-1)">−</button>' +
      '<span class="mpname">' + m4PieceName(k) + '</span>' +
      '<span class="mpcount" id="m4c_' + k + '">0</span>' +
      '<button class="mpbtn" onclick="m4Add(\'' + k + '\',1)">+</button>' +
    '</div>';
  }).join('');
  m4Render();
  setFb('m4fb', L('Pon en la bandeja las piezas planas que, dobladas, cubren toda la superficie.', 'Put in the tray the flat pieces that, once folded, cover the whole surface.'), '');
}
function m4Render(){
  if (!M4) return;
  var r = document.getElementById('m4r'), g = document.getElementById('m4goal');
  if (!r || !g) return;
  if (M4.done){
    r.textContent = L('Completo', 'Complete');
    g.innerHTML = L('Armaste los tres cuerpos. Cada cara del cuerpo aparece una sola vez en su desarrollo.', 'You built all three solids. Every face of the solid shows up exactly once in its net.');
  } else {
    r.textContent = L('Ronda ', 'Round ') + (M4.i + 1) + '/3';
    g.innerHTML = L('Objetivo: junta el desarrollo plano de <strong>' + m4SolidName(m4Cur().id) + '</strong>.', 'Goal: gather the net of <strong>' + m4SolidName(m4Cur().id) + '</strong>.');
  }
  M4_KEYS.forEach(function(k){
    var c = document.getElementById('m4c_' + k), p = document.getElementById('m4p_' + k);
    if (c) c.textContent = String(M4.bag[k]);
    if (p) p.classList.toggle('has', M4.bag[k] > 0);
  });
  m4Draw();
}
function m4Add(k, d){
  if (!M4 || M4.done) return;
  M4.bag[k] = Math.max(0, Math.min(6, M4.bag[k] + d));
  var tot = M4_KEYS.reduce(function(s, kk){ return s + M4.bag[kk]; }, 0);
  setFb('m4fb', L('Llevas ' + tot + ' pieza(s) en la bandeja.', 'You have ' + tot + ' piece(s) in the tray.'), '');
  m4Render();
}
function m4Clear(){
  if (!M4 || M4.done) return;
  M4_KEYS.forEach(function(k){ M4.bag[k] = 0; });
  setFb('m4fb', L('Bandeja vacía. Empieza de nuevo cuando quieras.', 'Empty tray. Start again whenever you like.'), '');
  m4Render();
}
function m4DrawPiece(ctx, k, x, y, s, col, fill){
  if (k === 'circ'){ ellip(ctx, x, y, s * 0.44, s * 0.44, col, fill, false, 2); return; }
  if (k === 'rect'){ polyPath(ctx, [{x:x-s*0.5,y:y-s*0.30},{x:x+s*0.5,y:y-s*0.30},{x:x+s*0.5,y:y+s*0.30},{x:x-s*0.5,y:y+s*0.30}], col, 2, fill, false); return; }
  if (k === 'cuad'){ polyPath(ctx, [{x:x-s*0.38,y:y-s*0.38},{x:x+s*0.38,y:y-s*0.38},{x:x+s*0.38,y:y+s*0.38},{x:x-s*0.38,y:y+s*0.38}], col, 2, fill, false); return; }
  if (k === 'tri'){ polyPath(ctx, [{x:x,y:y-s*0.44},{x:x+s*0.40,y:y+s*0.38},{x:x-s*0.40,y:y+s*0.38}], col, 2, fill, false); return; }
  ctx.save();
  ctx.beginPath(); ctx.moveTo(x - s * 0.10, y - s * 0.30);
  ctx.arc(x - s * 0.10, y - s * 0.30, s * 0.78, Math.PI * 0.18, Math.PI * 0.62);
  ctx.closePath();
  ctx.fillStyle = fill; ctx.fill();
  ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.stroke();
  ctx.restore();
}
function m4Draw(){
  var c = cvFit('m4cv');
  if (!c || !M4) return;
  var ctx = c.ctx, w = c.w, h = c.h;
  var gd = cssv('--green-dark'), go = cssv('--gold'), tx = cssv('--text3'), bd = cssv('--border'), gbg = cssv('--green-bg');
  cvText(ctx, L('Bandeja', 'Tray'), 12, 14, tx, 'left', 11, true);
  ctx.save(); ctx.setLineDash([6, 5]); ctx.strokeStyle = bd; ctx.lineWidth = 1.4;
  ctx.strokeRect(10, 24, w - 20, h - 34); ctx.restore();
  var list = [];
  M4_KEYS.forEach(function(k){ for (var i = 0; i < M4.bag[k]; i++) list.push(k); });
  if (!list.length){
    cvText(ctx, L('La bandeja está vacía', 'The tray is empty'), w / 2, h / 2, tx, 'center', 12, false);
    return;
  }
  var cols = Math.min(4, list.length), rows = Math.ceil(list.length / cols);
  var cw = (w - 30) / cols, ch = (h - 48) / rows;
  var s = Math.min(cw, ch) * 0.88;
  list.forEach(function(k, i){
    var cxp = 15 + cw * (i % cols) + cw / 2;
    var cyp = 32 + ch * Math.floor(i / cols) + ch / 2;
    m4DrawPiece(ctx, k, cxp, cyp, s, gd, gbg);
  });
}
function m4Check(){
  if (!M4 || M4.done) return;
  var need = m4Cur().need, miss = null, extra = null;
  M4_KEYS.forEach(function(k){
    if (M4.bag[k] < need[k] && miss === null) miss = { k: k, n: need[k] - M4.bag[k] };
    if (M4.bag[k] > need[k] && extra === null) extra = { k: k, n: M4.bag[k] - need[k] };
  });
  if (!miss && !extra){
    setFb('m4fb', L('¡Se armó! Ese es el desarrollo de ' + m4SolidName(m4Cur().id) + '. 🎉', 'It builds. That is the net of ' + m4SolidName(m4Cur().id) + '. 🎉'), 'good');
    M4.i++; M4.tries = 0;
    M4_KEYS.forEach(function(k){ M4.bag[k] = 0; });
    if (M4.i >= M4.rounds.length) M4.done = true;
    setTimeout(m4Render, 1100);
    return;
  }
  M4.tries++;
  if (M4.tries >= 3){
    var txt = M4_KEYS.filter(function(k){ return need[k] > 0; }).map(function(k){ return need[k] + ' ' + m4PieceName(k).toLowerCase(); }).join(' + ');
    M4_KEYS.forEach(function(k){ M4.bag[k] = need[k]; });
    setFb('m4fb', L('El desarrollo de ' + m4SolidName(m4Cur().id) + ' es: ' + txt + '.', 'The net of ' + m4SolidName(m4Cur().id) + ' is: ' + txt + '.'), 'near');
    M4.i++; M4.tries = 0;
    if (M4.i >= M4.rounds.length) M4.done = true;
    m4Draw();
    setTimeout(function(){ M4_KEYS.forEach(function(k){ M4.bag[k] = 0; }); m4Render(); }, 2100);
    return;
  }
  var msg;
  if (miss) msg = L('Todavía falta cubrir una parte: te faltan ' + miss.n + ' ' + m4PieceName(miss.k).toLowerCase() + '.', 'A part is still uncovered: you are missing ' + miss.n + ' ' + m4PieceName(miss.k).toLowerCase() + '.');
  else msg = L('Al doblar quedan piezas encimadas: te sobran ' + extra.n + ' ' + m4PieceName(extra.k).toLowerCase() + '.', 'When folded some pieces overlap: you have ' + extra.n + ' ' + m4PieceName(extra.k).toLowerCase() + ' to spare.');
  setFb('m4fb', msg, 'near');
}

/* ================================================
   buildLesson — concepts, manipulatives and the 10 graded problems,
   interleaved and appended inline.
   ================================================ */

  problems = [];
  M1 = M2 = M3 = M4 = null;
  document.getElementById('lessonBody').innerHTML = '';

  /* ───────── INTRO ───────── */
  addSection(
    '<div class="stag">' + L('Matemáticas · 3° de Secundaria', 'Mathematics · 3° de Secundaria') + '</div>' +

    '<p>' + L('Una lata de aluminio, un cono de nieve y una carpa de circo nacieron dos veces: primero como una figura plana y después como un cuerpo. Unas se formaron girando la figura sobre un eje, como en un torno de alfarero; otras se armaron doblando un recorte de papel.',
              'An aluminium can, an ice cream cone and a circus tent were born twice: first as a plane figure and then as a solid. Some were formed by spinning the figure around an axis, like on a potter wheel; others were built by folding a paper cut-out.') + '</p>' +
    '<p>' + L('En esta guía vas a hacer girar perfiles hasta obtener el cuerpo que se te pide, vas a abrir un cono hasta que su recorte cierre exacto y vas a cortar conos para ver aparecer triángulos semejantes.',
              'In this guide you will spin profiles until you get the solid you are asked for, open a cone until its cut-out closes exactly, and slice cones to watch similar triangles appear.') + '</p>'
  );

  /* ───────── CONCEPTO 1 : generación por revolución ───────── */
  addSection(
    '<div class="stag">' + L('Generación de cuerpos', 'Generating solids') + '</div>' +
    '<h2>' + L('Una figura plana que da la vuelta', 'A plane figure that goes all the way around') + '</h2>' +
    '<p>' + L('Cuando una figura plana gira una vuelta completa alrededor de una recta fija, llamada eje, cada uno de sus puntos describe una circunferencia. La figura barre un cuerpo que se ve igual desde cualquier dirección: un sólido de revolución.',
              'When a plane figure spins one full turn around a fixed line, called the axis, each of its points traces a circle. The figure sweeps out a solid that looks the same from every direction: a solid of revolution.') + '</p>' +
    '<p>' + L('Dos detalles deciden qué cuerpo sale. Primero, la parte de la figura que se apoya en el eje no se mueve y marca la altura. Segundo, la distancia de cada punto al eje se convierte en un radio, y el punto más lejano traza la circunferencia más grande.',
              'Two details decide which solid comes out. First, the part of the figure resting on the axis does not move and sets the height. Second, the distance from each point to the axis becomes a radius, and the farthest point traces the largest circle.') + '</p>' +
    '<div class="rules-grid">' +
      '<div class="rcard"><div class="rname">' + L('Eje de giro', 'Axis of rotation') + '</div><div class="rform">' + L('recta fija', 'fixed line') + '</div><div class="rnote">' + L('Lo que se apoya en el eje se queda quieto durante toda la vuelta.', 'Whatever rests on the axis stays still through the whole turn.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + L('Radio', 'Radius') + '</div><div class="rform">' + L('distancia al eje', 'distance to the axis') + '</div><div class="rnote">' + L('Cada punto gira a su propia distancia y forma su propia circunferencia.', 'Each point turns at its own distance and forms its own circle.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + L('Vuelta completa', 'Full turn') + '</div><div class="rform">360°</div><div class="rnote">' + L('Con menos de una vuelta la superficie no llega a cerrarse.', 'With less than one full turn the surface does not close up.') + '</div></div>' +
    '</div>' +
    '<div class="callout"><p><strong>' + L('Señal inconfundible.', 'An unmistakable sign.') + '</strong> ' +
      L('Si cortas un sólido de revolución con un plano perpendicular al eje, la sección siempre es un círculo.',
        'If you cut a solid of revolution with a plane perpendicular to the axis, the section is always a circle.') + '</p></div>' +
    '<p>' + L('Prueba perfiles en el torno hasta obtener el cuerpo que se te pide y verás cuál es el rasgo del perfil que manda en cada caso.',
              'Try profiles on the lathe until you get the solid you are asked for and you will see which feature of the profile is in charge each time.') + '</p>' +
    m1Html()
  );
  m1Build(rng);
  setTimeout(m1Init, 90);

  /* ── Problema 1 ── */
  var v1 = Math.floor(rng() * 2), s1;
  if (v1 === 0){
    var a1 = pick([8, 9, 12, 15], rng), b1 = pick([3, 4, 5, 6], rng);

      L('Un cono de radio ' + a1 + ' cm y altura ' + b1 + ' cm', 'A cone with radius ' + a1 + ' cm and height ' + b1 + ' cm'),
      L('Un cilindro de radio ' + b1 + ' cm y altura ' + a1 + ' cm', 'A cylinder with radius ' + b1 + ' cm and height ' + a1 + ' cm'),

    ];
    s1 = {
      title: L('Del giro al cuerpo', 'From the spin to the solid'),
      questionText: L('Un triángulo rectángulo tiene catetos de ' + a1 + ' cm y ' + b1 + ' cm. La figura da una vuelta completa alrededor de la recta que contiene al cateto de ' + a1 + ' cm. ¿Qué cuerpo se genera y con qué medidas?',
                      'A right triangle has legs of ' + a1 + ' cm and ' + b1 + ' cm. The figure makes one full turn around the line containing the ' + a1 + ' cm leg. Which solid is generated and with what measurements?'),
      hint: L('Fíjate en cuál de los dos catetos no se mueve durante el giro y cuál es el que barre el círculo.',
              'Look at which of the two legs does not move during the turn and which one sweeps the circle.'),
      explanation: L('El cateto de ' + a1 + ' cm está sobre el eje, no se mueve y funciona como altura. El cateto de ' + b1 + ' cm es la distancia de la figura al eje, así que barre el círculo de la base: se genera un cono de radio ' + b1 + ' cm y altura ' + a1 + ' cm.',
                     'The ' + a1 + ' cm leg lies on the axis, does not move and acts as the height. The ' + b1 + ' cm leg is the distance from the figure to the axis, so it sweeps the base circle: a cone with radius ' + b1 + ' cm and height ' + a1 + ' cm is generated.'),
      options: o1, correct: o1[0], showWork: false
    };
  } else {
    var p1 = pick([3, 4, 5, 6], rng), q1 = pick([8, 9, 10, 12], rng);
    var o1b = [
      L('Un cilindro de radio ' + p1 + ' cm y altura ' + q1 + ' cm', 'A cylinder with radius ' + p1 + ' cm and height ' + q1 + ' cm'),
      L('Un cilindro de radio ' + q1 + ' cm y altura ' + p1 + ' cm', 'A cylinder with radius ' + q1 + ' cm and height ' + p1 + ' cm'),
      L('Un cono de radio ' + p1 + ' cm y altura ' + q1 + ' cm', 'A cone with radius ' + p1 + ' cm and height ' + q1 + ' cm'),
      L('Un cilindro de radio ' + p1 + ' cm y altura ' + (2 * q1) + ' cm', 'A cylinder with radius ' + p1 + ' cm and height ' + (2 * q1) + ' cm')
    ];
    s1 = {
      title: L('Del giro al cuerpo', 'From the spin to the solid'),
      questionText: L('Un rectángulo mide ' + p1 + ' cm por ' + q1 + ' cm y da una vuelta completa alrededor de la recta que contiene a su lado de ' + q1 + ' cm. ¿Qué cuerpo se genera y con qué medidas?',
                      'A rectangle measures ' + p1 + ' cm by ' + q1 + ' cm and makes one full turn around the line containing its ' + q1 + ' cm side. Which solid is generated and with what measurements?'),

              'The side resting on the axis stays still; the opposite side is the one travelling farthest from the axis.'),
      explanation: L('El lado de ' + q1 + ' cm está sobre el eje y da la altura. El lado de ' + p1 + ' cm es la distancia constante al eje, así que es el radio: se genera un cilindro de radio ' + p1 + ' cm y altura ' + q1 + ' cm.',

      options: o1b, correct: o1b[0], showWork: false
    };
  }
  pushProb(s1, rng);

  /* ── Problema 2 ── */
  var v2 = Math.floor(rng() * 2), s2;
  if (v2 === 0){
    var pr2 = pick([[3, 8], [6, 5], [3, 10], [9, 4], [5, 6]], rng), r2 = pr2[0], h2 = pr2[1];
    var vc = 3.14 * r2 * r2 * h2 / 3;
    var o2 = [ d2(vc) + ' cm³', d2(3 * vc) + ' cm³', d2(4 * vc) + ' cm³', d2(3.14 * h2 * h2 * r2 / 3) + ' cm³' ];
    s2 = {
      title: L('El volumen del cuerpo barrido', 'The volume of the swept solid'),
      questionText: L('Un triángulo rectángulo de catetos ' + r2 + ' cm y ' + h2 + ' cm gira una vuelta completa alrededor del cateto de ' + h2 + ' cm. Calcula el volumen del cuerpo generado usando π ≈ 3.14.',
                      'A right triangle with legs ' + r2 + ' cm and ' + h2 + ' cm turns once around the ' + h2 + ' cm leg. Work out the volume of the solid generated using π ≈ 3.14.'),

              'First identify the radius and the height of the cone. The volume of a cone is one third of the volume of the cylinder with the same base and height: V = π · r² · h ÷ 3.'),
      explanation: L('El cuerpo es un cono de radio ' + r2 + ' cm y altura ' + h2 + ' cm. V = 3.14 · ' + r2 + '² · ' + h2 + ' ÷ 3 = 3.14 · ' + (r2 * r2 * h2) + ' ÷ 3 = ' + d2(vc) + ' cm³.',
                     'The solid is a cone with radius ' + r2 + ' cm and height ' + h2 + ' cm. V = 3.14 · ' + r2 + '² · ' + h2 + ' ÷ 3 = 3.14 · ' + (r2 * r2 * h2) + ' ÷ 3 = ' + d2(vc) + ' cm³.'),
      options: o2, correct: o2[0], showWork: true
    };
  } else {
    var pr2b = pick([[4, 7], [5, 6], [3, 9], [6, 5]], rng), r2b = pr2b[0], h2b = pr2b[1];
    var vcl = 3.14 * r2b * r2b * h2b;
    var o2b = [ d2(vcl) + ' cm³', d2(vcl / 3) + ' cm³', d2(4 * vcl) + ' cm³', d2(3.14 * r2b * h2b * h2b) + ' cm³' ];

      title: L('El volumen del cuerpo barrido', 'The volume of the swept solid'),
      questionText: L('Un rectángulo de ' + r2b + ' cm por ' + h2b + ' cm gira una vuelta completa alrededor de su lado de ' + h2b + ' cm. Calcula el volumen del cuerpo generado usando π ≈ 3.14.',
                      'A rectangle measuring ' + r2b + ' cm by ' + h2b + ' cm turns once around its ' + h2b + ' cm side. Work out the volume of the solid generated using π ≈ 3.14.'),
      hint: L('Identifica el radio y la altura del cilindro. Su volumen es el área del círculo de la base multiplicada por la altura: V = π · r² · h.',

      explanation: L('El cuerpo es un cilindro de radio ' + r2b + ' cm y altura ' + h2b + ' cm. V = 3.14 · ' + r2b + '² · ' + h2b + ' = 3.14 · ' + (r2b * r2b * h2b) + ' = ' + d2(vcl) + ' cm³.',
                     'The solid is a cylinder with radius ' + r2b + ' cm and height ' + h2b + ' cm. V = 3.14 · ' + r2b + '² · ' + h2b + ' = 3.14 · ' + (r2b * r2b * h2b) + ' = ' + d2(vcl) + ' cm³.'),
      options: o2b, correct: o2b[0], showWork: true
    };
  }
  pushProb(s2, rng);

  /* ───────── CONCEPTO 2 : desarrollos planos ───────── */
  addSection(
    '<div class="stag">' + L('Del cuerpo al papel', 'From solid to paper') + '</div>' +
    '<h2>' + L('Desarrollos planos', 'Plane nets') + '</h2>' +
    '<p>' + L('Corta la superficie de un cuerpo por algunas de sus aristas y extiéndela sobre la mesa, sin estirarla y sin encimar nada. Lo que queda es su desarrollo plano: todas las caras aparecen, cada una una sola vez y con su tamaño real.',
              'Cut the surface of a solid along some of its edges and lay it flat on the table, without stretching it and without overlapping anything. What is left is its plane net: every face appears, each one only once and at its real size.') + '</p>' +
    '<p>' + L('Un desarrollo es una lista de piezas, pero también es un plano de fabricación: sumando las áreas de las piezas obtienes el área total del cuerpo, y midiendo una pieza sabes cuánto mide esa parte del cuerpo.',
              'A net is a list of pieces, but it is also a manufacturing plan: adding the areas of the pieces gives the total area of the solid, and measuring one piece tells you how big that part of the solid is.') + '</p>' +
    '<div class="callout"><p><strong>' + L('El desarrollo conserva las medidas.', 'The net keeps the measurements.') + '</strong> ' +
