<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jerarquía de Operaciones con Números con Signo</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }

/* ── MANIPULATIVES ── */
.mstage { font-size:.7rem; letter-spacing:.09em; text-transform:uppercase; color:var(--text3); margin-bottom:.45rem; }
.mlabel { font-size:.82rem; color:var(--text2); margin-bottom:.55rem; }
.mexpr { font-family:'IBM Plex Mono',monospace; font-size:1.1rem; font-weight:600; color:var(--green-dark); background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:.75rem .8rem; text-align:center; overflow-x:auto; white-space:nowrap; }
.mexpr.big { font-size:1.22rem; }
.mrow { display:flex; gap:.45rem; flex-wrap:wrap; align-items:center; margin-top:.65rem; }
.mbtn { background:var(--surface2); border:1.5px solid var(--border); border-radius:8px; padding:.5rem .8rem; font-size:.83rem; cursor:pointer; color:var(--text); font-family:inherit; min-height:44px; text-align:left; }
.mbtn:hover { border-color:var(--green); background:var(--green-bg); }
.mbtn.on { background:var(--green); color:var(--green-bg); border-color:var(--green); }
.mbtn.mono { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mbtn.wide { flex:1; min-width:135px; text-align:center; }
.mfb { margin-top:.7rem; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.6rem .8rem; font-size:.82rem; color:var(--text2); min-height:2.6rem; }
.mfb.good { background:var(--ok-bg); border-left-color:var(--ok); color:var(--ok); }
.mfb.warn { background:var(--bad-bg); border-left-color:var(--bad); color:var(--bad); }
.mcanvas { display:block; width:100%; height:160px; touch-action:none; }
.mtrack { font-size:.72rem; color:var(--text3); margin-top:.5rem; letter-spacing:.03em; }
.eqbox { display:grid; grid-template-columns:1fr 1fr; gap:.5rem; align-items:stretch; margin-top:.7rem; }
@media(max-width:520px){ .eqbox { grid-template-columns:1fr; } }
.eqside { background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:.6rem .5rem; text-align:center; font-family:'IBM Plex Mono',monospace; font-size:.84rem; color:var(--text2); }
.eqside b { display:block; font-size:1.08rem; color:var(--green-dark); margin-top:.25rem; }
.mtiles { display:flex; gap:.3rem; flex-wrap:wrap; align-items:center; justify-content:center; margin:.2rem 0; }
.mtile { font-family:'IBM Plex Mono',monospace; font-size:1rem; font-weight:600; background:var(--surface2); border:1.5px solid var(--border); border-radius:8px; min-width:44px; min-height:44px; display:inline-flex; align-items:center; justify-content:center; color:var(--green-dark); padding:0 .5rem; }
.mtile.hot { border-color:var(--ok); background:var(--ok-bg); color:var(--ok); }
.mtile.op { color:var(--gold); border-style:dashed; cursor:pointer; font-family:inherit; font-size:1.05rem; }
.mtile.op:hover { background:var(--gold-bg); border-color:var(--gold); }
.mtile.par { border:none; background:none; color:var(--text3); font-size:1.35rem; min-width:12px; padding:0; }
.mstep { display:flex; gap:.5rem; align-items:center; margin-top:.55rem; font-size:.8rem; color:var(--text2); flex-wrap:wrap; }
.mstep .mbtn { min-height:40px; padding:.35rem .7rem; }
.mval { font-family:'IBM Plex Mono',monospace; font-weight:700; color:var(--green); font-size:1rem; min-width:2.4rem; text-align:center; }
.mchain { display:flex; align-items:center; justify-content:center; gap:.4rem; flex-wrap:wrap; margin-top:.7rem; }
.mnode { background:var(--surface2); border:1.5px solid var(--border); border-radius:10px; padding:.45rem .7rem; font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; color:var(--green-dark); min-width:52px; text-align:center; }
.mnode.goal { border-color:var(--gold); background:var(--gold-bg); color:var(--gold); }
.mgear { background:var(--green-bg); border:1.5px solid var(--green); border-radius:10px; padding:.45rem .7rem; font-family:'IBM Plex Mono',monospace; font-size:.9rem; color:var(--green-dark); }
.marrow { color:var(--text3); font-size:1.1rem; }
.bwrap { position:relative; height:118px; margin-top:.8rem; }
.bbeam { position:absolute; left:8%; width:84%; top:56px; height:6px; background:var(--green); border-radius:3px; transform-origin:50% 50%; transition:transform .35s ease; }
.bpost { position:absolute; left:50%; top:56px; width:6px; height:52px; margin-left:-3px; background:var(--border); border-radius:3px; }
.bbase { position:absolute; left:34%; width:32%; top:106px; height:6px; background:var(--border); border-radius:3px; }
.bpan { position:absolute; top:8px; width:86px; margin-left:-43px; padding:.3rem .2rem; border:1.5px solid var(--border); border-radius:9px; background:var(--surface2); font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:700; color:var(--green-dark); text-align:center; transition:transform .35s ease; }
.bpan.pl { left:12%; }
.bpan.pr { left:88%; }
.mgrid2 { display:grid; grid-template-columns:1fr 1fr; gap:.6rem; margin-top:.6rem; }
@media(max-width:520px){ .mgrid2 { grid-template-columns:1fr; } }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Jerarquía de Operaciones con Números con Signo</div>

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });

  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');

}

async function generatePDF() {
  var btn = document.getElementById('dlBtn');
  btn.textContent = 'Generando PDF…';
  btn.disabled = true;

  var jspdf   = window.jspdf;
  var doc     = new jspdf.jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });
  var PW      = 215.9;
  var M       = 18;
  var TW      = PW - M * 2;
  var PH      = doc.internal.pageSize.height;
  var name    = studentData.name;
  var group   = studentData.group;
  var total   = problems.length;
  var pct     = Math.round(correctCount / total * 100);
  var dateStr = new Date().toLocaleString('es-MX', { dateStyle:'long', timeStyle:'short' });

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS — INJECTION BLOCK ─────────────────────────────────────────
  //   Match these RGB values to --green and --gold above.
  //   PRIMARY  → pBR, pBG, pBB
  //   ACCENT   → pAR, pAG, pAB
  // ──────────────────────────────────────────────────────────────────────────
  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;  // PRIMARY (from SCHOOL, Rule 16)
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;   // ACCENT (from SCHOOL, Rule 16)

  function pdfText(html) {
    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/\u2192/g,'->').replace(/\u2212/g,'-').replace(/\u00b2/g,'^2')
      .replace(/\u00b3/g,'^3').replace(/\u00d7/g,'x').replace(/\u00f7/g,'/')
      .replace(/\u2260/g,'!=').replace(/\u2264/g,'<=').replace(/\u2265/g,'>=')
      .replace(/\u221a/g,'sqrt').replace(/\u03c0/g,'pi').replace(/\u2026/g,'...')
      .replace(/\s+/g,' ').trim();

/* ══════════════════════════════════════════════════════════════════════════
   GUIDE CONTENT: mat1_t03_g03
   Jerarquía de Operaciones con Números con Signo · 1° de Secundaria
   Operaciones y sus relaciones inversas · números con signo
   ══════════════════════════════════════════════════════════════════════════ */
function L(o){ if(o===null||o===undefined) return ''; if(typeof o!=='object') return String(o); return (o[LANG]!==undefined?o[LANG]:o.es); }
function numStr(n){ return n<0 ? '−'+Math.abs(n) : String(n); }
function par(n){ return n<0 ? '(−'+Math.abs(n)+')' : String(n); }
function addT(n){ return n<0 ? ' − '+Math.abs(n) : ' + '+n; }
function ri(r,a,b){ return a + Math.floor(r()*(b-a+1)); }
function cssVar(n){ try { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); } catch(e){ return ''; } }
function shuffleOpts(opts, correct, rng){ var a=shuffle(opts,rng); return { options:a, correctIdx:a.indexOf(correct) }; }
function mkNums(correct, cands){
  var out=[correct], i;
  for(i=0;i<cands.length && out.length<4;i++){ if(out.indexOf(cands[i])<0) out.push(cands[i]); }
  var d=1;
  while(out.length<4){
    if(out.indexOf(correct+d)<0) out.push(correct+d);
    if(out.length<4 && out.indexOf(correct-d)<0) out.push(correct-d);
    d++;
  }
  return out;
}
function numOptions(correct, cands){
  return { options: mkNums(correct,cands).map(function(v){ return numStr(v); }), correct: numStr(correct) };
}
function txtOptions(correct, others){ return { options:[correct].concat(others), correct:correct }; }
function addSection(html){
  var d=document.createElement('div'); d.className='section'; d.innerHTML=html;
  document.getElementById('lessonBody').appendChild(d); return d;
}
function addProblem(rng, cfg){
  var so = shuffleOpts(cfg.options, cfg.correct, rng);
  problems.push({ title:cfg.title, questionText:cfg.questionText, fn:cfg.fn||'', hint:cfg.hint,
    explanation:cfg.explanation, options:so.options, correctIdx:so.correctIdx,
    showWork:!!cfg.showWork, studentChoice:null, pendingChoice:null });
  buildOneCard(problems[problems.length-1], problems.length-1);
}
function subRng(rng, tag){ return seededRng(tag + Math.floor(rng()*1000000)); }
function setFb(id, txt, kind){ var e=document.getElementById(id); if(!e) return; e.innerHTML=txt; e.className='mfb'+(kind?(' '+kind):''); }
function actv(btn){ var row=btn.parentNode.querySelectorAll('.mbtn'), i; for(i=0;i<row.length;i++) row[i].classList.remove('on'); btn.classList.add('on'); }

/* ═════════ W1 · la recta con dos saltos ═════════ */
var W1 = { s:0, m1:0, m2:0, target:0, round:0, tries:0, done:false, rng:null };
function w1New(){
  var r=W1.rng, t;
  W1.s = ri(r,-9,9);
  do { t = ri(r,-12,12); } while (t===W1.s || Math.abs(t-W1.s)>14);
  W1.target=t; W1.m1=0; W1.m2=0; W1.tries=0;
  w1Render();
}
function w1Adj(which,d){
  if(W1.done) return;
  if(which===1) W1.m1=Math.max(-9,Math.min(9,W1.m1+d));
  else W1.m2=Math.max(-9,Math.min(9,W1.m2+d));
  w1Render();
}
function w1Pos(){ return W1.s+W1.m1+W1.m2; }
function w1Render(){
  var e=document.getElementById('w1expr');
  if(e) e.innerHTML = numStr(W1.s)+addT(W1.m1)+addT(W1.m2)+' = '+numStr(w1Pos());
  var g=document.getElementById('w1goal');
  if(g) g.innerHTML = L({es:'Sale de ',en:'Starts at '})+'<b>'+numStr(W1.s)+'</b>'+L({es:' y la bandera está en ',en:' and the flag is at '})+'<b>'+numStr(W1.target)+'</b>';
  var rd=document.getElementById('w1round');
  if(rd) rd.textContent = L({es:'Recta ',en:'Line '})+Math.min(W1.round+1,3)+' / 3';
  var d = W1.target - w1Pos();
  if(!W1.done){
    if(d===0) setFb('w1fb', L({es:'La ficha cayó justo en la bandera.',en:'The token landed right on the flag.'}), 'good');
    else setFb('w1fb', L({ es:'La ficha quedó a '+Math.abs(d)+' unidades de la bandera, hacia la '+(d>0?'izquierda':'derecha')+'.',
                           en:'The token is '+Math.abs(d)+' units to the '+(d>0?'left':'right')+' of the flag.' }));
  }
  w1Draw();
}
function w1Draw(){
  var cv=document.getElementById('w1cv'); if(!cv) return;
  var dpr=window.devicePixelRatio||1, rc=cv.getBoundingClientRect();
  if(!rc.width) return;
  cv.width=rc.width*dpr; cv.height=rc.height*dpr;
  var ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
  var W=rc.width, H=rc.height, pad=16, MIN=-15, MAX=15, y=H-38;
  function X(v){ var q=Math.max(MIN,Math.min(MAX,v)); return pad+(q-MIN)*(W-2*pad)/(MAX-MIN); }
  var kBorder=cssVar('--border')||'#cccccc';
  var kTxt=cssVar('--text3')||'#777777';
  var kMain=cssVar('--green')||'#1a4a8a';
  var kAcc=cssVar('--gold')||'#c9a84c';
  ctx.clearRect(0,0,W,H);
  ctx.strokeStyle=kBorder; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(pad,y); ctx.lineTo(W-pad,y); ctx.stroke();
  ctx.font='10px IBM Plex Mono, monospace'; ctx.textAlign='center';
  for(var v=MIN;v<=MAX;v++){
    var x=X(v), big=(v%5===0);
    ctx.strokeStyle=kBorder; ctx.beginPath();
    ctx.moveTo(x,y-(big?7:4)); ctx.lineTo(x,y+(big?7:4)); ctx.stroke();
    if(big){ ctx.fillStyle=kTxt; ctx.fillText(numStr(v), x, y+21); }
  }
  var xt=X(W1.target);
  ctx.strokeStyle=kAcc; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(xt,y); ctx.lineTo(xt,y-48); ctx.stroke();
  ctx.fillStyle=kAcc; ctx.beginPath();
  ctx.moveTo(xt,y-48); ctx.lineTo(xt+17,y-42); ctx.lineTo(xt,y-36); ctx.closePath(); ctx.fill();
  var p0=W1.s, p1=W1.s+W1.m1, p2=p1+W1.m2;
  function arc(from,to,h,col){
    if(from===to) return;
    ctx.strokeStyle=col; ctx.lineWidth=2.2;
    ctx.beginPath(); ctx.moveTo(X(from),y-2);
    ctx.quadraticCurveTo((X(from)+X(to))/2, y-h, X(to), y-3); ctx.stroke();
    var dir=(to>from)?1:-1;
    ctx.fillStyle=col; ctx.beginPath();
    ctx.moveTo(X(to),y-1); ctx.lineTo(X(to)-dir*7,y-9); ctx.lineTo(X(to)-dir*7,y+4); ctx.closePath(); ctx.fill();
  }
  arc(p0,p1,36,kMain); arc(p1,p2,58,kAcc);
  ctx.fillStyle=kMain; ctx.beginPath(); ctx.arc(X(p0),y,4,0,6.2832); ctx.fill();
  ctx.fillStyle=kMain; ctx.beginPath(); ctx.arc(X(p2),y,7,0,6.2832); ctx.fill();
}
function w1Check(){
  if(W1.done) return;
  if(w1Pos()===W1.target){
    W1.round++;
    if(W1.round>=3){ W1.done=true; setFb('w1fb', L({es:'Tres rectas seguidas: ya lees los signos como movimientos. 🎉',en:'Three lines in a row: you read signs as movements now. 🎉'}),'good'); w1Draw(); return; }
    setFb('w1fb', L({es:'¡Bandera alcanzada! Va otra recta.',en:'Flag reached! Here comes another line.'}),'good');
    setTimeout(w1New, 950); return;
  }
  W1.tries++;
  if(W1.tries>=3){
    var need=W1.target-W1.s;
    var a1=Math.max(-9,Math.min(9,need)), a2=need-a1;
    W1.m1=a1; W1.m2=a2;
    setFb('w1fb', L({ es:'La distancia total entre la ficha y la bandera es '+numStr(need)+'. Un camino posible: '+numStr(a1)+' y después '+numStr(a2)+'.',
                      en:'The whole distance from token to flag is '+numStr(need)+'. One possible path: '+numStr(a1)+' then '+numStr(a2)+'.' }),'warn');
    W1.round++;
    if(W1.round>=3){ W1.done=true; w1Draw(); return; }
    setTimeout(w1New, 2200); return;
  }
  var d=W1.target-w1Pos();
  setFb('w1fb', L({ es:'Todavía no. Te sobra '+Math.abs(d)+' hacia la '+(d>0?'izquierda':'derecha')+': ajusta un salto.',
                    en:'Not yet. You are off by '+Math.abs(d)+' to the '+(d>0?'left':'right')+': adjust one jump.' }),'warn');
}

/* ═════════ W2 · máquina y su operación inversa ═════════ */
var W2 = { k:-3, b:4, x:0, sol:0, target:0, round:0, tries:0, done:false, rng:null };
function w2New(){
  var r=W2.rng;
  W2.k = pick([-4,-3,-2,2,3], r);
  W2.b = pick([-9,-7,-5,-4,4,5,7,9], r);
  W2.sol = ri(r,-6,6);
  W2.target = W2.k*W2.sol + W2.b;
  W2.x = 0; W2.tries = 0;
  w2Render();
}
function w2Adj(d){ if(W2.done) return; W2.x=Math.max(-12,Math.min(12,W2.x+d)); w2Render(); }
function w2Out(){ return W2.k*W2.x + W2.b; }
function w2Render(){
  var n=document.getElementById('w2in'); if(n) n.textContent=numStr(W2.x);
  var g1=document.getElementById('w2g1'); if(g1) g1.textContent='× '+par(W2.k);
  var g2=document.getElementById('w2g2'); if(g2) g2.textContent=(W2.b<0?'− '+Math.abs(W2.b):'+ '+W2.b);
  var mid=document.getElementById('w2mid'); if(mid) mid.textContent=numStr(W2.k*W2.x);
  var out=document.getElementById('w2out'); if(out) out.textContent=numStr(w2Out());
  var tg=document.getElementById('w2goal'); if(tg) tg.textContent=numStr(W2.target);
  var rd=document.getElementById('w2round'); if(rd) rd.textContent=L({es:'Máquina ',en:'Machine '})+Math.min(W2.round+1,3)+' / 3';
  if(W2.done) return;
  var d=w2Out()-W2.target;
  if(d===0) setFb('w2fb', L({es:'La salida coincide con la meta. Toca Comprobar.',en:'The output matches the goal. Tap Check.'}),'good');
  else {
    var tip = (W2.k<0)
      ? L({es:' Ojo: el factor es negativo, así que subir la entrada baja la salida.',en:' Careful: the factor is negative, so raising the input lowers the output.'})
      : L({es:' El factor es positivo, así que subir la entrada sube la salida.',en:' The factor is positive, so raising the input raises the output.'});
    setFb('w2fb', L({ es:'La salida está '+Math.abs(d)+' unidades por '+(d>0?'arriba':'abajo')+' de la meta.',
                      en:'The output is '+Math.abs(d)+' units '+(d>0?'above':'below')+' the goal.' })+tip);
  }
}
function w2Check(){
  if(W2.done) return;
  if(w2Out()===W2.target){
    var inv = L({es:'Comprobación al revés: (',en:'Backwards check: ('})+numStr(W2.target)+addT(-W2.b)+') ÷ '+par(W2.k)+' = '+numStr(W2.sol);
    W2.round++;
    if(W2.round>=3){ W2.done=true; setFb('w2fb', inv+L({es:'. Tres máquinas desarmadas. 🎉',en:'. Three machines cracked. 🎉'}),'good'); return; }
    setFb('w2fb', inv+L({es:'. Dividir deshace multiplicar y restar deshace sumar.',en:'. Dividing undoes multiplying and subtracting undoes adding.'}),'good');
    setTimeout(w2New, 1700); return;
  }
  W2.tries++;
  if(W2.tries>=3){
    W2.x=W2.sol;
    setFb('w2fb', L({es:'La entrada era ',en:'The input was '})+numStr(W2.sol)+L({es:'. Se halla al revés: (',en:'. You find it backwards: ('})+numStr(W2.target)+addT(-W2.b)+') ÷ '+par(W2.k)+' = '+numStr(W2.sol),'warn');
    W2.round++;
    if(W2.round>=3){ W2.done=true; w2Render(); return; }
    setTimeout(w2New, 2400); return;
  }
  var d=w2Out()-W2.target;
  setFb('w2fb', L({ es:'Todavía no. Te pasaste '+Math.abs(d)+' unidades por '+(d>0?'arriba':'abajo')+'; mueve la entrada.',
                    en:'Not yet. You are '+Math.abs(d)+' units '+(d>0?'above':'below')+'; move the input.' }),'warn');
}

/* ═════════ W3 · ¿qué operación se resuelve primero? ═════════ */
var W3 = { toks:[], rounds:[], round:0, tries:0, done:false };
function w3N(v){ return {t:'n',v:v}; }
function w3O(v){ return {t:'o',v:v}; }
function w3P(v){ return {t:'p',v:v}; }
function w3Build(r){
  var out=[];
  var a=-ri(r,2,9), b=ri(r,2,7), c=ri(r,2,6), d=ri(r,3,9);
  out.push([w3N(a),w3O('+'),w3N(b),w3O('×'),w3N(c),w3O('−'),w3N(d)]);
  var e=ri(r,2,6), f=ri(r,8,14), g=ri(r,2,5), h=ri(r,3,9);
  out.push([w3P('('),w3N(e),w3O('−'),w3N(f),w3P(')'),w3O('×'),w3N(g),w3O('+'),w3N(h)]);
  var c2=pick([2,3,4],r), d2=c2*ri(r,2,5), a2=-ri(r,3,10), b2=ri(r,2,6), e2=ri(r,2,5);
  out.push([w3N(a2),w3O('−'),w3N(d2),w3O('÷'),w3N(c2),w3O('+'),w3N(b2),w3O('×'),w3N(e2)]);
  W3.rounds=out; W3.round=0; W3.tries=0; W3.done=false;
  W3.toks=w3Copy(W3.rounds[0]);
}
function w3Copy(a){ return a.map(function(k){ return {t:k.t,v:k.v}; }); }
function w3Zone(toks){
  var open=-1, close=-1, i;
  for(i=0;i<toks.length;i++){
    if(toks[i].t==='p'&&toks[i].v==='(') open=i;
    if(toks[i].t==='p'&&toks[i].v===')'&&open>=0){ close=i; break; }
  }
  if(open>=0&&close>=0) return [open+1, close-1, true];
  return [0, toks.length-1, false];
}
function w3Next(toks){
  var z=w3Zone(toks), i;
  for(i=z[0];i<=z[1];i++) if(toks[i].t==='o'&&(toks[i].v==='×'||toks[i].v==='÷')) return i;
  for(i=z[0];i<=z[1];i++) if(toks[i].t==='o') return i;
  return -1;
}
function w3Apply(i){
  var a=W3.toks[i-1].v, op=W3.toks[i].v, b=W3.toks[i+1].v, v;
  if(op==='+') v=a+b; else if(op==='−') v=a-b; else if(op==='×') v=a*b; else v=Math.round(a/b);
  W3.toks.splice(i-1,3,w3N(v));
  var z=w3Zone(W3.toks);
  if(z[2] && z[0]===z[1] && W3.toks[z[0]].t==='n'){
    W3.toks.splice(z[1]+1,1); W3.toks.splice(z[0]-1,1);
  }
  return v;
}
function w3RenderTiles(){
  var box=document.getElementById('w3tiles'); if(!box) return;
  var html='', i, k;
  for(i=0;i<W3.toks.length;i++){
    k=W3.toks[i];
    if(k.t==='n') html+='<span class="mtile">'+numStr(k.v)+'</span>';
    else if(k.t==='p') html+='<span class="mtile par">'+k.v+'</span>';
    else html+='<span class="mtile op" onclick="w3Tap('+i+')">'+k.v+'</span>';
  }
  box.innerHTML=html;
  var rd=document.getElementById('w3round');
  if(rd) rd.textContent=L({es:'Expresión ',en:'Expression '})+Math.min(W3.round+1,3)+' / 3';
}
function w3Tap(i){
  if(W3.done) return;
  if(W3.toks.length===1) return;
  var good=w3Next(W3.toks);
  if(i===good){
    var op=W3.toks[i].v, v=w3Apply(i);
    W3.tries=0;
    w3RenderTiles();
    if(W3.toks.length===1){
      setFb('w3fb', L({es:'Todo resuelto: el valor es ',en:'All solved: the value is '})+'<b>'+numStr(W3.toks[0].v)+'</b>','good');
      W3.round++;
      if(W3.round>=3){ W3.done=true; setFb('w3fb', L({es:'Tres expresiones desarmadas en el orden correcto. 🎉',en:'Three expressions taken apart in the right order. 🎉'}),'good'); return; }
      setTimeout(function(){ W3.toks=w3Copy(W3.rounds[W3.round]); W3.tries=0; w3RenderTiles(); setFb('w3fb', L({es:'Nueva expresión: elige la primera operación.',en:'New expression: choose the first operation.'})); }, 1500);
      return;
    }
    setFb('w3fb', L({es:'Correcto: esa era la primera. Ahora quedan ',en:'Right: that one went first. Now '})+(W3.toks.filter(function(k){return k.t==='o';}).length)+L({es:' operaciones.',en:' operations are left.'}),'good');
    return;
  }
  W3.tries++;
  var z=w3Zone(W3.toks), why;
  if(z[2] && (i<z[0]||i>z[1])) why=L({es:'Lo que está dentro del paréntesis se resuelve antes que nada.',en:'Whatever sits inside the parentheses is solved before anything else.'});
  else if(W3.toks[i].v==='+'||W3.toks[i].v==='−') why=L({es:'Todavía hay una multiplicación o una división esperando, y esas van antes.',en:'There is still a multiplication or division waiting, and those go first.'});
  else why=L({es:'Cuando dos operaciones son del mismo nivel, se resuelven de izquierda a derecha.',en:'When two operations are on the same level, they go left to right.'});
  if(W3.tries>=3){
    var opv=W3.toks[good].v, av=W3.toks[good-1].v, bv=W3.toks[good+1].v, res=w3Apply(good);
    W3.tries=0; w3RenderTiles();
    setFb('w3fb', why+L({es:' Iba ',en:' The step was '})+numStr(av)+' '+opv+' '+numStr(bv)+' = '+numStr(res),'warn');
    if(W3.toks.length===1){
      W3.round++;
      if(W3.round>=3){ W3.done=true; return; }
      setTimeout(function(){ W3.toks=w3Copy(W3.rounds[W3.round]); w3RenderTiles(); setFb('w3fb', L({es:'Nueva expresión: elige la primera operación.',en:'New expression: choose the first operation.'})); }, 1800);
    }
    return;
  }
  setFb('w3fb', why,'warn');
}
function w3Reset(){
  if(W3.done) return;
  W3.toks=w3Copy(W3.rounds[Math.min(W3.round,2)]); W3.tries=0; w3RenderTiles();
  setFb('w3fb', L({es:'Expresión restaurada. Vuelve a elegir la primera operación.',en:'Expression restored. Pick the first operation again.'}));
}

/* ═════════ W4 · balanza de propiedades ═════════ */
var W4 = { a:-3, b:5, c:4, test:'sum', moves:0, found:false };
function w4Set(k,v){ W4[k]=parseInt(v,10); W4.moves++; w4Render(); }
function w4Test(t,btn){ W4.test=t; W4.moves=0; W4.found=false; actv(btn); w4Render(); }
function w4Sides(){
  var a=W4.a,b=W4.b,c=W4.c;
  if(W4.test==='sum') return { lt:numStr(a)+addT(b), lv:a+b, rt:numStr(b)+addT(a), rv:b+a };
  if(W4.test==='res') return { lt:numStr(a)+' − '+par(b), lv:a-b, rt:numStr(b)+' − '+par(a), rv:b-a };
  if(W4.test==='aso') return { lt:'('+numStr(a)+addT(b)+')'+addT(c), lv:(a+b)+c, rt:numStr(a)+' + ('+numStr(b)+addT(c)+')', rv:a+(b+c) };
  return { lt:numStr(a)+' × ('+numStr(b)+addT(c)+')', lv:a*(b+c), rt:numStr(a)+' × '+par(b)+' + '+numStr(a)+' × '+par(c), rv:a*b+a*c };
}
function w4Render(){
  var s=w4Sides();
  var lb=document.getElementById('w4left'), rb=document.getElementById('w4right');
  if(lb) lb.innerHTML=s.lt+'<b>'+numStr(s.lv)+'</b>';
  if(rb) rb.innerHTML=s.rt+'<b>'+numStr(s.rv)+'</b>';
  var pl=document.getElementById('w4pl'), pr=document.getElementById('w4pr'), bm=document.getElementById('w4beam');
  var diff=s.lv-s.rv, dy=Math.max(-24,Math.min(24,diff*3));
  if(bm) bm.style.transform='rotate('+(dy/2.2)+'deg)';
  if(pl){ pl.style.transform='translateY('+dy+'px)'; pl.textContent=numStr(s.lv); }
  if(pr){ pr.style.transform='translateY('+(-dy)+'px)'; pr.textContent=numStr(s.rv); }
  ['a','b','c'].forEach(function(k){
    var e=document.getElementById('w4v'+k); if(e) e.textContent=numStr(W4[k]);
  });
  var cwrap=document.getElementById('w4cwrap');
  if(cwrap) cwrap.style.display=(W4.test==='sum'||W4.test==='res')?'none':'block';
  if(W4.test==='res'){
    if(diff!==0){ W4.found=true; setFb('w4fb', L({es:'Lo lograste: la balanza se inclinó. Al voltear una resta el resultado cambia de signo, así que el orden sí importa.',en:'You did it: the beam tipped. Flipping a subtraction changes the sign of the result, so order does matter.'}),'good'); }
    else setFb('w4fb', L({es:'Con estos valores los dos lados coinciden. Sigue moviendo hasta desequilibrarla.',en:'With these values both sides match. Keep moving until it tips.'}));
    return;
  }
  if(diff!==0){ setFb('w4fb', L({es:'La balanza se inclinó, revisa los valores.',en:'The beam tipped, check the values.'}),'warn'); return; }
  if(W4.moves>=5) setFb('w4fb', L({es:'Llevas '+W4.moves+' combinaciones y la balanza no se mueve: esta propiedad se cumple con cualquier número con signo.',en:'You have tried '+W4.moves+' combinations and the beam never moves: this property holds for any signed number.'}),'good');
  else setFb('w4fb', L({es:'Equilibrada con estos valores. Prueba con negativos a ver si consigues romperla.',en:'Balanced with these values. Try negatives and see if you can break it.'}));
}

/* ═════════ W5 · coloca los paréntesis y llega a la meta ═════════ */
var W5 = { a:-4, b:5, c:3, d:7, p1:false, p2:false, target:0, round:0, tries:0, done:false, rng:null };
function w5Val(p1,p2){
  var a=W5.a,b=W5.b,c=W5.c,d=W5.d;
  if(p1&&p2) return (a+b)*(c-d);
  if(p1) return (a+b)*c-d;
  if(p2) return a+b*(c-d);
  return a+b*c-d;
}
function w5New(){
  var r=W5.rng, tries=0, ch;
  do {
    W5.a=-ri(r,2,8); W5.b=ri(r,2,7); W5.c=ri(r,2,6); W5.d=ri(r,3,9);
    ch=pick([[true,false],[false,true],[true,true]], r);
    tries++;
  } while (w5Val(ch[0],ch[1])===w5Val(false,false) && tries<25);
  W5.target=w5Val(ch[0],ch[1]);
  W5.p1=false; W5.p2=false; W5.tries=0;
  w5Render();
}
function w5Toggle(which,btn){
  if(W5.done) return;
  if(which===1) W5.p1=!W5.p1; else W5.p2=!W5.p2;
  btn.classList.toggle('on');
  w5Render();
}
function w5Expr(){
  var lf = W5.p1 ? '('+numStr(W5.a)+addT(W5.b)+')' : numStr(W5.a)+addT(W5.b);
  var rt = W5.p2 ? '('+W5.c+' − '+W5.d+')' : W5.c+' − '+W5.d;
  return lf+' × '+rt;
}
function w5Render(){
  var v=w5Val(W5.p1,W5.p2);
  var e=document.getElementById('w5expr'); if(e) e.innerHTML=w5Expr()+' = '+numStr(v);
  var g=document.getElementById('w5goal'); if(g) g.textContent=numStr(W5.target);
  var rd=document.getElementById('w5round'); if(rd) rd.textContent=L({es:'Meta ',en:'Goal '})+Math.min(W5.round+1,3)+' / 3';
  var b1=document.getElementById('w5b1'), b2=document.getElementById('w5b2');
  if(b1) b1.classList.toggle('on', W5.p1);
  if(b2) b2.classList.toggle('on', W5.p2);
  if(W5.done) return;
  var d=v-W5.target;
  if(d===0) setFb('w5fb', L({es:'Esa combinación da justo la meta. Toca Comprobar.',en:'That combination hits the goal. Tap Check.'}),'good');
  else setFb('w5fb', L({ es:'Vas '+Math.abs(d)+' '+(d>0?'por arriba':'por abajo')+' de la meta. Cambia dónde agrupas.',
                         en:'You are '+Math.abs(d)+' '+(d>0?'above':'below')+' the goal. Change where you group.' }));
}
function w5Check(){
  if(W5.done) return;
  if(w5Val(W5.p1,W5.p2)===W5.target){
    W5.round++;
    if(W5.round>=3){ W5.done=true; setFb('w5fb', L({es:'Tres metas: los paréntesis mandan sobre la jerarquía normal. 🎉',en:'Three goals: parentheses outrank the normal order. 🎉'}),'good'); return; }
    setFb('w5fb', L({es:'¡Meta alcanzada! Los mismos números, otro agrupamiento, otro resultado.',en:'Goal reached! Same numbers, different grouping, different result.'}),'good');
    setTimeout(w5New, 1500); return;
  }
  W5.tries++;
  if(W5.tries>=3){
    var cfgs=[[false,false],[true,false],[false,true],[true,true]], i, hit=null;
    for(i=0;i<4;i++) if(w5Val(cfgs[i][0],cfgs[i][1])===W5.target){ hit=cfgs[i]; break; }
    if(hit){ W5.p1=hit[0]; W5.p2=hit[1]; }
    setFb('w5fb', L({es:'Así se llega: ',en:'This is the way: '})+w5Expr()+' = '+numStr(W5.target),'warn');
    W5.round++;
    if(W5.round>=3){ W5.done=true; w5Render(); return; }
    setTimeout(w5New, 2400); return;
  }
  var d=w5Val(W5.p1,W5.p2)-W5.target;
  setFb('w5fb', L({ es:'Todavía no: te faltan '+Math.abs(d)+' unidades '+(d>0?'hacia abajo':'hacia arriba')+'.',
                    en:'Not yet: you are '+Math.abs(d)+' units '+(d>0?'too high':'too low')+'.' }),'warn');
}

/* ══════════════════════════════════════════════════════════════════════════
   BUILD LESSON
   ══════════════════════════════════════════════════════════════════════════ */
function buildLesson(rng) {

             en:'A signed number carries two pieces of information at once: how big it is and which way it points. On the number line zero is the starting point, positives sit to the right and negatives to the left.'})+'</p>'+

      '<div class="mstage" id="w1round">'+L({es:'Recta 1 / 3',en:'Line 1 / 3'})+'</div>'+
      '<div class="mlabel" id="w1goal"></div>'+
      '<div class="cvwrap"><canvas class="mcanvas" id="w1cv"></canvas></div>'+
      '<div class="mexpr" id="w1expr" style="margin-top:.6rem"></div>'+
      '<div class="mstep"><span>'+L({es:'Salto 1',en:'Jump 1'})+'</span>'+

      '<div class="mfb" id="w1fb"></div>'+

  (function(){

      explanation:L({es:'Se avanza en orden, de izquierda a derecha: '+expr+' = '+numStr(res),

  /* ───────── PROBLEMA 2 ───────── */
  (function(){

    if(v===0){

            en:'A diver is working '+d+' metres below the sea surface. She rises '+s+' metres to check a buoy and then descends '+b+' metres more. If the water surface is zero, which signed number is her final position?'});
      ex=L({es:'Bajo la superficie es negativo, subir suma y descender resta: '+numStr(-d)+' + '+s+' − '+b+' = '+numStr(res),
            en:'Below the surface is negative, rising adds and descending subtracts: '+numStr(-d)+' + '+s+' − '+b+' = '+numStr(res)});

      title:L({es:'Posición final con signo',en:'Final signed position'}),
      questionText:qt, showWork:true, options:o.options, correct:o.correct,
      hint:L({es:'Escribe la posición inicial como número con signo y aplica cada movimiento en el orden en que ocurre.',
              en:'Write the starting position as a signed number and apply each movement in the order it happens.'}),

    });
  })();

           en:'Multiply '+numStr(m)+' by '+x+' and add to it the product of '+numStr(m)+' and '+y}),
        L({es:'Multiplicar '+numStr(m)+' por '+x+' y al resultado restarle únicamente '+y,
           en:'Multiply '+numStr(m)+' by '+x+' and subtract only '+y+' from it'}),
        L({es:'Sumar '+x+' y '+y+' y multiplicar ese total por '+numStr(m),
           en:'Add '+x+' and '+y+' and multiply that total by '+numStr(m)})
      ]);
      qt=L({es:'Al calcular '+numStr(m)+' × ('+x+' − '+y+'), ¿cuál procedimiento distinto da exactamente el mismo resultado?',
            en:'When working out '+numStr(m)+' × ('+x+' − '+y+'), which different procedure gives exactly the same result?'});
      ex=L({es:'El factor se reparte entre las dos partes conservando la resta: '+numStr(m)+' × '+x+' menos '+numStr(m)+' × '+y+' da el mismo valor que multiplicar por la diferencia.',
            en:'The factor is shared between both parts keeping the subtraction: '+numStr(m)+' × '+x+' minus '+numStr(m)+' × '+y+' gives the same value as multiplying by the difference.'});
      hint=L({es:'Reparte el factor entre cada parte del paréntesis y conserva la operación que había dentro.',
              en:'Share the factor with each part inside the parentheses and keep the operation that was in there.'});
    }
    addProblem(rng,{
      title:L({es:'Propiedades puestas a prueba',en:'Properties put to the test'}),
      questionText:qt, showWork:false, options:opts.options, correct:opts.correct,
      hint:hint, explanation:ex
    });
  })();

  /* ───────── CIERRE ───────── */
  addSection(
    '<div class="stag">'+L({es:'Cierre',en:'Wrap up'})+'</div>'+
    '<h2>'+L({es:'Todo junto',en:'Everything together'})+'</h2>'
  );

  /* ───────── PROBLEMA 9 ───────── */
  (function(){
    var v = Math.floor(rng()*2), qt, ex, res, cands;
    if(v===0){
      var base=ri(rng,18,30)*10, n=ri(rng,3,5), cg=ri(rng,5,9)*10, dep=ri(rng,6,12)*5;
      res=base-n*cg+dep;
      qt=L({es:'La cuenta de una cooperativa escolar tiene '+base+' pesos. Se aplican '+n+' cargos de '+cg+' pesos cada uno y después entra un depósito de '+dep+' pesos. ¿Cuál es el saldo final de la cuenta, en pesos?',
            en:'A school co-op account holds '+base+' pesos. Then '+n+' charges of '+cg+' pesos each are applied and afterwards a deposit of '+dep+' pesos comes in. What is the final balance of the account, in pesos?'});
      ex=L({es:'Primero el producto de los cargos y luego las sumas y restas: '+base+' − '+n+' × '+cg+' + '+dep+' = '+numStr(res),
            en:'The product of the charges first and then the additions and subtractions: '+base+' − '+n+' × '+cg+' + '+dep+' = '+numStr(res)});
      cands=[base-n*cg-dep, base+n*cg-dep, base-cg+dep];
    } else {
      var lt=ri(rng,15,22)*10, k=ri(rng,4,6), cub=ri(rng,12,18), add=ri(rng,4,9)*10;
      res=lt-k*cub+add;
      qt=L({es:'Un tinaco tiene '+lt+' litros de agua. Se sacan '+k+' cubetas de '+cub+' litros cada una y después se agregan '+add+' litros con una manguera. ¿Cuántos litros quedan en el tinaco?',
            en:'A water tank holds '+lt+' litres. Then '+k+' buckets of '+cub+' litres each are taken out and afterwards '+add+' litres are added with a hose. How many litres are left in the tank?'});
      ex=L({es:'Primero el producto de las cubetas y luego las sumas y restas: '+lt+' − '+k+' × '+cub+' + '+add+' = '+numStr(res),
            en:'The product of the buckets first and then the additions and subtractions: '+lt+' − '+k+' × '+cub+' + '+add+' = '+numStr(res)});
      cands=[lt-k*cub-add, lt+k*cub-add, lt-cub+add];
    }
    var o=numOptions(res,cands);
    addProblem(rng,{
      title:L({es:'Varios movimientos en una cuenta',en:'Several moves in one account'}),
      questionText:qt, showWork:true, options:o.options, correct:o.correct,
      hint:L({es:'Junta primero lo que se repite en una sola multiplicación y después aplica los cambios en el orden en que ocurren.',
              en:'First gather whatever repeats into a single multiplication and then apply the changes in the order they happen.'}),
      explanation:ex
    });
  })();

  /* ───────── PROBLEMA 10 ───────── */
  (function(){
    var v = Math.floor(rng()*2), res, expr, cands;
    if(v===0){
      var c=pick([2,4,5],rng), k=ri(rng,2,6), w=c*k, d=ri(rng,2,5), e=ri(rng,2,6);
      res=w/c-d*e; expr='−'+w+' ÷ (−'+c+') + '+d+' × (−'+e+')';
      cands=[-(w/c)-d*e, w/c+d*e, -(w/c)+d*e];
    } else {
      var c2=pick([2,3],rng), s=-ri(rng,2,6)*c2, b2=ri(rng,3,7), a2=s-b2, m2=ri(rng,2,5);
      res=s*m2/c2; expr='['+numStr(a2)+' + '+b2+'] × '+m2+' ÷ '+c2;
      cands=[-res, res-m2, Math.round(a2+b2*m2/c2)];
    }
    cands=cands.map(function(x){ return Math.round(x); });
    var o=numOptions(res,cands);
    addProblem(rng,{
      title:L({es:'Agrupación, signos y turnos',en:'Grouping, signs and turns'}),
      questionText:L({es:'Calcula el resultado de la siguiente operación.',en:'Work out the result of the operation below.'}),
      fn:expr, showWork:true, options:o.options, correct:o.correct,
      hint:L({es:'Resuelve lo agrupado, luego los productos y cocientes de izquierda a derecha, y hasta el final las sumas y restas.',
              en:'Solve what is grouped, then products and quotients left to right, and only at the end the additions and subtractions.'}),
      explanation:L({es:'Siguiendo el turno completo con la regla de los signos: '+expr+' = '+numStr(res),
                     en:'Following the full order with the sign rule: '+expr+' = '+numStr(res)})
    });
  })();
}
</script>
