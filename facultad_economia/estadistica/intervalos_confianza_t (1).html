      '<div class="iw-sub">' + L(B(
        'For ' + sc.who.en + ', the true mean ' + sc.m.en + ' is μ = ' + F(MU, sc.dec) + (sc.cur ? ' pesos' : ' ' + sc.u.en) + ', but pretend nobody knows it. Each click draws random samples and builds two 95% intervals from every one: the gold one treats s as if it were σ (uses z* = 1.96) and the blue one uses t. A bar turns red when it misses μ. Reach 100 samples with each of the four sample sizes.',
        'Para ' + sc.who.es + ', la media real de la variable «' + sc.m.es + '» es μ = ' + F(MU, sc.dec) + (sc.cur ? ' pesos' : ' ' + sc.u.es) + ', pero imagina que nadie la conoce. Cada clic saca muestras aleatorias y construye dos intervalos de 95% con cada una: el dorado trata a s como si fuera σ (usa z* = 1.96) y el azul usa t. Una barra se vuelve roja cuando no captura a μ. Llega a 100 muestras con cada uno de los cuatro tamaños.')) + '</div>' +
      '<div class="chips">' + SIZES.map(function(n) { return '<span class="chip chip-n' + n + '"></span>'; }).join('') + '</div>' +
      '<div class="shape-grid four size-tabs">' + SIZES.map(function(n) {
        return '<button class="shape-btn sz-btn" data-n="' + n + '">n = ' + n + '</button>'; }).join('') + '</div>' +
      '<div class="legend"><span><i class="lz"></i>' + L(B('z with s', 'z con s')) + '</span><span><i class="lt"></i>t</span><span><i class="lm"></i>' + L(B('misses μ', 'no captura a μ')) + '</span></div>' +
      '<canvas class="iw-canvas sim-cv"></canvas>' +
      '<div class="iw-sub" style="margin:.3rem 0 0">' + L(B('The last 14 samples are shown. Each sample has two bars: gold above, blue below.', 'Se muestran las últimas 14 muestras. Cada muestra tiene dos barras: la dorada arriba, la azul abajo.')) + '</div>' +
      '<div class="btn-row"><button class="verify-btn add1">' + L(B('+1 sample', '+1 muestra')) + '</button>' +
        '<button class="verify-btn alt add50">' + L(B('+50 samples', '+50 muestras')) + '</button></div>' +
      '<table class="ft-table cov-table"><thead><tr><th>' + L(B('Sample size', 'Tamaño de muestra')) + '</th><th>' + L(B('Samples', 'Muestras')) + '</th>' +
        '<th>' + L(B('z with s captured μ', 'z con s capturó a μ')) + '</th><th>' + L(B('t captured μ', 't capturó a μ')) + '</th></tr></thead><tbody>' +
        SIZES.map(function(n) { return '<tr class="cov-' + n + '"></tr>'; }).join('') + '</tbody></table>' +
      '<div class="metrics" style="grid-template-columns:repeat(2,1fr)"><div class="metric"><div class="mlbl">' + L(B('Samples drawn', 'Muestras sacadas')) + '</div><div class="mnum ts sim-tot"></div></div>' +
        '<div class="metric"><div class="mlbl">' + L(B('Promised coverage', 'Cobertura prometida')) + '</div><div class="mnum cs">95%</div></div></div>' +
      '<div class="iw-read"></div>';
    host.querySelectorAll('.sz-btn').forEach(function(b) {
      b.addEventListener('click', function() { st.n = +b.getAttribute('data-n'); saveSession(); refresh(); });
    });
    host.querySelector('.add1').addEventListener('click', function() { addSamples(1); });
    host.querySelector('.add50').addEventListener('click', function() { addSamples(50); });
    refresh();
  }
  widgets.push(render); wdraws.push(draw); render();
}

/* ════════════════════════════════════════════════════════════════════════
   WIDGET 2 · t curves (MODE A · exploration, no Check button)
   ════════════════════════════════════════════════════════════════════════ */
function wCurves(host) {
  var st = WSTATE.curves || (WSTATE.curves = { df: 10, seen: {}, lo: 0, hi: 0, find: 0, done: false });
  function mark() {
    st.seen[st.df] = 1;
    if (st.df <= 3) st.lo = 1;
    if (st.df >= 25) st.hi = 1;
    if (st.df === 19 && st.seen[18]) st.find = 1;
  }
  function draw() {
    var cv = host.querySelector('.cu-cv'); if (!cv) return;
    var g = fitCanvas(cv, 230), ctx = g.ctx, W = g.w, H = g.h, P = palette();
    var ox = 14, oy = H - 28, tp = 14, rp = 14, xmin = -5, xmax = 5, ymax = 0.42;
    function px(x) { return ox + (x - xmin) / (xmax - xmin) * (W - ox - rp); }
    function py(y) { return oy - y / ymax * (oy - tp); }
    var df = st.df, ts = tCrit(df, 95), x, i;
    ctx.font = '10px "IBM Plex Sans", sans-serif'; ctx.textAlign = 'center';
    for (x = -5; x <= 5; x++) {
      ctx.strokeStyle = P.border; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(px(x), tp); ctx.lineTo(px(x), oy + 3); ctx.stroke();
      ctx.fillStyle = P.text3; ctx.fillText(String(x).replace('-', '−'), px(x), oy + 15);
    }
    /* tails of the t curve beyond ±1.96 */
    ctx.fillStyle = P.bad; ctx.globalAlpha = 0.28;
    [[-5, -1.96], [1.96, 5]].forEach(function(seg) {
      ctx.beginPath(); ctx.moveTo(px(seg[0]), py(0));
      for (i = 0; i <= 40; i++) { x = seg[0] + (seg[1] - seg[0]) * i / 40; ctx.lineTo(px(x), py(tPdf(x, df))); }
      ctx.lineTo(px(seg[1]), py(0)); ctx.closePath(); ctx.fill();
    });
    ctx.globalAlpha = 1;
    ctx.strokeStyle = P.text2; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(W - rp, oy); ctx.stroke();
    /* normal */
    ctx.strokeStyle = P.text3; ctx.lineWidth = 2; ctx.setLineDash([5, 4]); ctx.beginPath();
    for (i = 0; i <= 120; i++) { x = xmin + (xmax - xmin) * i / 120; if (i === 0) ctx.moveTo(px(x), py(nPdf(x))); else ctx.lineTo(px(x), py(nPdf(x))); }
    ctx.stroke(); ctx.setLineDash([]);
    /* t */
    ctx.strokeStyle = P.green; ctx.lineWidth = 2.6; ctx.beginPath();
    for (i = 0; i <= 120; i++) { x = xmin + (xmax - xmin) * i / 120; if (i === 0) ctx.moveTo(px(x), py(tPdf(x, df))); else ctx.lineTo(px(x), py(tPdf(x, df))); }
    ctx.stroke();
    /* ±1.96 and ±t* markers */
    ctx.lineWidth = 1.2; ctx.strokeStyle = P.bad; ctx.setLineDash([3, 3]);
    [-1.96, 1.96].forEach(function(v) { ctx.beginPath(); ctx.moveTo(px(v), tp); ctx.lineTo(px(v), oy); ctx.stroke(); });
    ctx.setLineDash([]);
    if (ts <= 5) {
      ctx.strokeStyle = P.gold; ctx.lineWidth = 2.2;
      [-ts, ts].forEach(function(v) { ctx.beginPath(); ctx.moveTo(px(v), tp + 6); ctx.lineTo(px(v), oy); ctx.stroke(); });
      ctx.fillStyle = P.gold; ctx.font = '600 10px "IBM Plex Sans", sans-serif';
      ctx.fillText('t* = ' + F(ts, 3), px(ts), tp + 2);
    } else {
      ctx.fillStyle = P.gold; ctx.font = '600 10px "IBM Plex Sans", sans-serif'; ctx.textAlign = 'right';
      ctx.fillText('t* = ' + F(ts, 2) + ' →', W - rp, tp + 8);
    }
  }
  function refresh() {
    var q = host.querySelector.bind(host), df = st.df;
    q('.cu-df').textContent = df;
    q('.cu-ts').textContent = F(tCrit(df, 95), 3);
    q('.cu-tail').textContent = F(tTailOut(1.96, df) * 100, 1) + '%';
    q('.chip-lo').classList.toggle('on', !!st.lo);
    q('.chip-hi').classList.toggle('on', !!st.hi);
    q('.chip-fd').classList.toggle('on', !!st.find);
    q('.iw-read').style.display = st.done ? 'block' : 'none';
    draw();
  }
  function setDf(v) {
    st.df = Math.max(1, Math.min(30, Math.round(v)));
    mark();
    if (!st.done && st.lo && st.hi && st.find) {
      st.done = true; checkpoint('t-curves', 0, 'round'); saveSession(); applyLocks();
    }
    refresh();
  }
  function render() {
    host.innerHTML =
      '<div class="iw-head"><span class="iw-tag">' + L(B('Exploration', 'Exploración')) + '</span>' +
        '<span class="iw-title">' + L(B('t curve explorer', 'Explorador de curvas t')) + '</span></div>' +
      '<div class="iw-sub">' + L(B(
        'The dashed grey curve is the normal distribution. The blue curve is the t distribution for the degrees of freedom you choose. The red areas are the tails beyond ±1.96, and the gold lines mark ±t*, the value that captures the central 95%. Complete the three missions.',
        'La curva gris punteada es la distribución normal. La curva azul es la distribución t con los grados de libertad que elijas. Las áreas rojas son las colas más allá de ±1.96 y las líneas doradas marcan ±t*, el valor que captura el 95% central. Completa las tres misiones.')) + '</div>' +
      '<div class="chips">' +
        '<span class="chip chip-lo">' + L(B('1 · Go to 3 df or fewer', '1 · Ve a 3 gl o menos')) + '</span>' +
        '<span class="chip chip-hi">' + L(B('2 · Go to 25 df or more', '2 · Ve a 25 gl o más')) + '</span>' +
        '<span class="chip chip-fd">' + L(B('3 · Find the smallest df whose t* is below 2.10', '3 · Encuentra los gl más pequeños cuyo t* sea menor que 2.10')) + '</span>' +
      '</div>' +
      '<canvas class="iw-canvas cu-cv"></canvas>' +
      '<div class="slide-row">' +
        '<button class="nudge-btn" data-d="-1" aria-label="−1">−</button>' +
        '<input type="range" class="cu-slider" min="1" max="30" step="1" value="' + st.df + '" aria-label="df">' +
        '<button class="nudge-btn" data-d="1" aria-label="+1">+</button>' +
      '</div>' +
      '<div class="metrics">' +
        '<div class="metric"><div class="mlbl">' + L(B('Degrees of freedom', 'Grados de libertad')) + '</div><div class="mnum ts cu-df"></div></div>' +
        '<div class="metric"><div class="mlbl">t* (95%)</div><div class="mnum ps cu-ts"></div></div>' +
        '<div class="metric"><div class="mlbl">' + L(B('Area beyond ±1.96', 'Área más allá de ±1.96')) + '</div><div class="mnum cs cu-tail"></div></div>' +
      '</div>' +
      '<div class="iw-read">' + L(B(
        '<strong>Missions complete.</strong> With few degrees of freedom the tails are heavy (with 1 df, 30% of the area lies beyond ±1.96) and t* is far larger than 1.96. As the degrees of freedom grow, the t curve settles onto the normal curve and t* approaches 1.960. That extra width at small n is the price of not knowing σ.',
        '<strong>Misiones completas.</strong> Con pocos grados de libertad las colas son pesadas (con 1 gl, el 30% del área queda más allá de ±1.96) y t* es mucho mayor que 1.96. Al crecer los grados de libertad, la curva t se asienta sobre la normal y t* se acerca a 1.960. Ese ancho extra con n pequeña es el precio de no conocer σ.')) + '</div>';
    var sl = host.querySelector('.cu-slider');
    sl.addEventListener('input', function() { setDf(+sl.value); });
    host.querySelectorAll('.nudge-btn').forEach(function(b) {
      b.addEventListener('click', function() { setDf(st.df + (+b.getAttribute('data-d'))); sl.value = st.df; });
    });
    mark(); refresh();
  }
  widgets.push(render); wdraws.push(draw); render();
}

/* Scenario sentence for a sample summary */
function caseTxt(cs, l) {
  var sc = cs.sc;
  if (l === 'en') return 'For ' + sc.who.en + ', the variable is ' + sc.m.en + '. A random sample of ' + VN + ' = ' + cs.n +
    ' gave ' + VX + ' = ' + fv(cs.xbar, sc, 'en') + ' and ' + VS + ' = ' + fv(cs.s, sc, 'en', 1) + '.';
  return 'Para ' + sc.who.es + ', la variable es «' + sc.m.es + '». Una muestra aleatoria de ' + VN + ' = ' + cs.n +
    ' dio ' + VX + ' = ' + fv(cs.xbar, sc, 'es') + ' y ' + VS + ' = ' + fv(cs.s, sc, 'es', 1) + '.';
}
function near(v, target, tol) { return v !== null && Math.abs(v - target) <= tol; }

/* ════════════════════════════════════════════════════════════════════════
   WIDGET 3 · Table reader (MODE B · one lookup per round, Check button)
   ════════════════════════════════════════════════════════════════════════ */
function wTableReader(host, rounds) {
  var st = WSTATE.table || (WSTATE.table = { i: 0, v: { df: '', row: '', ts: '' }, tries: 0, phase: 'input', fb: null, bad: {}, done: false });
  function R() { return rounds[Math.min(st.i, rounds.length - 1)]; }
  function info() {
    var r = R(), df = r.n - 1, row = ttRow(df).df;
    return { n: r.n, conf: r.conf, df: df, row: row, missing: row !== df, ts: tCrit(df, r.conf) };
  }
  function msg(id) {
    var o = info();
    if (id === 'empty') return L(B('Fill in every box of the round before checking.', 'Llena todas las casillas de la ronda antes de verificar.'));
    if (id === 'df') return L(B('Check the degrees of freedom: for a single mean, df = ' + VN + ' − 1.', 'Revisa los grados de libertad: para una sola media, gl = ' + VN + ' − 1.'));
    if (id === 'dfn') return L(B('You used ' + VN + ' itself. One degree of freedom is spent on estimating the mean, so df = ' + VN + ' − 1.', 'Usaste ' + VN + ' tal cual. Un grado de libertad se gasta en estimar la media, así que gl = ' + VN + ' − 1.'));
    if (id === 'row') return L(B('The table has no row for ' + o.df + ' df. Use the printed row with the nearest SMALLER number of degrees of freedom.', 'La tabla no tiene fila para ' + o.df + ' gl. Usa la fila impresa con el número de grados de libertad MÁS CERCANO POR DEBAJO.'));
    if (id === 'rowup') return L(B('That row has MORE degrees of freedom than you have. Go to the nearest row below: it gives a slightly larger t*, which keeps the interval honest.', 'Esa fila tiene MÁS grados de libertad de los que tienes. Ve a la fila más cercana por debajo: da un t* un poco mayor, y eso mantiene honesto al intervalo.'));
    if (id === 'col') return L(B('That number is in the right row but in another column. Find the column headed ' + confTxt(o.conf) + ' in the first header row.', 'Ese número está en la fila correcta pero en otra columna. Busca la columna con el encabezado ' + confTxt(o.conf) + ' en la primera fila de encabezados.'));
    if (id === 'z') return L(B('That is z*, from the last row. With σ unknown you need the row of your degrees of freedom.', 'Ese es z*, de la última fila. Si σ es desconocida necesitas la fila de tus grados de libertad.'));
    if (id === 'ts') return L(B('Check t*: go to row ' + (o.missing ? o.row : 'df') + ' and move across to the ' + confTxt(o.conf) + ' column.', 'Revisa t*: ve a la fila ' + (o.missing ? o.row : 'gl') + ' y avanza hasta la columna de ' + confTxt(o.conf) + '.'));
    if (id === 'reveal') return L(B(
      'The answer: df = ' + o.n + ' − 1 = ' + o.df + (o.missing ? ', which is not printed, so you use row ' + o.row : '') + '; in the ' + confTxt(o.conf) + ' column, t* = ' + F(o.ts, 3) + '. The cell is highlighted in the table.',
      'La respuesta: gl = ' + o.n + ' − 1 = ' + o.df + (o.missing ? ', que no aparece, así que se usa la fila ' + o.row : '') + '; en la columna de ' + confTxt(o.conf) + ', t* = ' + F(o.ts, 3) + '. La celda quedó resaltada en la tabla.'));
    if (id === 'done') return L(B(
      '✓ Three lookups done. Remember the two moves: df = n − 1, and if that row is missing, drop to the nearest row below.',
      '✓ Tres búsquedas hechas. Recuerda los dos movimientos: gl = n − 1 y, si esa fila no aparece, baja a la fila más cercana por debajo.'));
    var z = zCrit(o.conf), more = Math.round((o.ts / z - 1) * 100);
    return L(B(
      '✓ Correct: t* = ' + F(o.ts, 3) + '. The normal value for ' + confTxt(o.conf) + ' is z* = ' + F(z, 3) + ', so with ' + o.n + ' observations the interval must be about ' + more + '% wider.' + (o.missing ? ' Using row ' + o.row + ' instead of ' + o.df + ' makes it a hair wider still: the safe side.' : ''),
      '✓ Correcto: t* = ' + F(o.ts, 3) + '. El valor normal para ' + confTxt(o.conf) + ' es z* = ' + F(z, 3) + ', así que con ' + o.n + ' observaciones el intervalo debe ser alrededor de ' + more + '% más ancho.' + (o.missing ? ' Usar la fila ' + o.row + ' en lugar de ' + o.df + ' lo hace apenas un poco más ancho: el lado seguro.' : '')));
  }
  function render() {
    var o = info(), tag = st.done ? L(B('Complete', 'Completa')) : L(B('Lookup', 'Búsqueda')) + ' ' + (st.i + 1) + '/' + rounds.length;
    var body = '';
    if (!st.done) {
      var solved = st.phase === 'solved';
      function fld(k, lab) {
        var cls = 'ft-inp' + (st.bad[k] === 1 ? ' ft-bad' : st.bad[k] === 0 ? ' ft-ok' : '');
        return '<div class="fld"><label>' + lab + '</label>' + (solved
          ? '<div class="fld-val">' + (k === 'df' ? o.df : k === 'row' ? o.row : F(o.ts, 3)) + '</div>'
          : '<input class="' + cls + ' tr-' + k + '" type="text" inputmode="decimal" autocomplete="off" placeholder="?" value="' + st.v[k] + '">') + '</div>';
      }
      body = '<div class="scenario-box">' + L(B(
          'A random sample has <strong>' + VN + ' = ' + o.n + '</strong> observations and you want a <strong>' + confTxt(o.conf) + '</strong> confidence interval for the mean (σ unknown).',
          'Una muestra aleatoria tiene <strong>' + VN + ' = ' + o.n + '</strong> observaciones y quieres un intervalo de confianza de <strong>' + confTxt(o.conf) + '</strong> para la media (σ desconocida).')) + '</div>' +
        '<div class="fld-grid">' + fld('df', L(B('Degrees of freedom (df)', 'Grados de libertad (gl)'))) +
          (o.missing ? fld('row', L(B('Row of the table you use', 'Fila de la tabla que usas'))) : '') +
          fld('ts', L(B('Critical value t*', 'Valor crítico t*'))) + '</div>' +
        (solved ? '<button class="verify-btn next tr-next">' + (st.i === rounds.length - 1 ? L(B('Finish', 'Terminar')) : L(B('Next lookup', 'Siguiente búsqueda'))) + '</button>'
                : '<button class="verify-btn tr-check">' + L(B('Check', 'Verificar')) + '</button>');
    }
    host.innerHTML =
      '<div class="iw-head"><span class="iw-tag">' + tag + '</span><span class="iw-title">' + L(B('Reading the t table', 'Lectura de la tabla t')) + '</span></div>' +
      '<div class="iw-sub">' + L(B(
        'Use the table below (or the «t table» button at the top, which is there for the rest of the guide). Type the degrees of freedom and the critical value t*. When the degrees of freedom are not printed, also say which row you used.',
        'Usa la tabla de abajo (o el botón «Tabla t» de arriba, que estará disponible el resto de la guía). Escribe los grados de libertad y el valor crítico t*. Cuando los grados de libertad no aparezcan impresos, indica también qué fila usaste.')) + '</div>' +
      body + '<div class="iw-fb"></div>' +
      '<div class="tt-embed">' + ttHTML() + '</div>';
    if (st.fb) say(host, st.fb.cls, msg(st.fb.id));
    ttBind(host);
    if (!st.done && st.phase === 'solved') ttMark(host, o.df, o.conf);
    ['df', 'row', 'ts'].forEach(function(k) {
      var e = host.querySelector('.tr-' + k);
      if (e) e.addEventListener('input', function() { st.v[k] = e.value; });
    });
    var bc = host.querySelector('.tr-check'), bn = host.querySelector('.tr-next');
    if (bc) bc.onclick = verify;
    if (bn) bn.onclick = next;
  }
  function verify() {
    var o = info(), df = numVal(st.v.df), row = numVal(st.v.row), ts = numVal(st.v.ts);
    if (df === null || ts === null || (o.missing && row === null)) { st.fb = { cls: 'warm', id: 'empty' }; render(); return; }
    var okDf = df === o.df, okRow = !o.missing || row === o.row, okTs = near(ts, o.ts, 0.0015);
    st.bad = { df: okDf ? 0 : 1, ts: okTs ? 0 : 1 };
    if (o.missing) st.bad.row = okRow ? 0 : 1;
    if (okDf && okRow && okTs) { st.phase = 'solved'; st.fb = { cls: 'good', id: 'ok' }; st.bad = {}; render(); return; }
    st.tries++;
    if (st.tries >= 3) { st.phase = 'solved'; st.bad = {}; st.fb = { cls: 'warm', id: 'reveal' }; render(); return; }
    var id;
    if (!okDf) id = (df === o.n ? 'dfn' : 'df');
    else if (!okRow) id = (row > o.df ? 'rowup' : 'row');
    else {
      var c = confCol(o.conf), rr = ttRow(o.df);
      if (near(ts, zCrit(o.conf), 0.0005)) id = 'z';
      else if (rr.v.some(function(v, j) { return j !== c && near(ts, parseFloat(v), 0.0005); })) id = 'col';
      else id = 'ts';
    }
    st.fb = { cls: 'miss', id: id };
    render();
  }
  function next() {
    checkpoint('table-reader', st.i, 'round');
    st.i++; st.v = { df: '', row: '', ts: '' }; st.tries = 0; st.phase = 'input'; st.fb = null; st.bad = {};
    if (st.i >= rounds.length) { st.done = true; st.fb = { cls: 'good', id: 'done' }; }
    saveSession(); render();
    if (st.done) applyLocks();
  }
  widgets.push(render); render();
}

/* ════════════════════════════════════════════════════════════════════════
   WIDGET 4 · Interval builder (MODE B · calculate, then Check; less is given each round)
   ════════════════════════════════════════════════════════════════════════ */
function wBuilder(host, cases) {
  var KEYS = ['df', 'ts', 'se', 'me', 'lo', 'hi'];
  var GIVEN = [{ df: 1, ts: 1 }, { df: 1 }, {}];
  var st = WSTATE.builder || (WSTATE.builder = { i: 0, v: {}, tries: 0, phase: 'input', fb: null, bad: {}, done: false });
  function C() { return cases[Math.min(st.i, cases.length - 1)]; }
  function G() { return GIVEN[Math.min(st.i, GIVEN.length - 1)]; }
  function val(k) { var c = C(); return { df: c.df, ts: c.ts, se: c.se, me: c.me, lo: c.lo, hi: c.hi }[k]; }
  function show(k) {
    var c = C(), sc = c.sc;
    if (k === 'df') return String(c.df);
    if (k === 'ts') return F(c.ts, 3);
    if (k === 'se') return F(c.se, 2);
    if (k === 'me') return F(c.me, 2);
    return F(val(k), 1);
  }
  function ok(k, v) {
    var c = C();
    if (v === null) return false;
    if (k === 'df') return v === c.df;
    if (k === 'ts') return near(v, c.ts, 0.002);
    if (k === 'se') return near(v, c.se, 0.02 * c.se + 0.005);
    if (k === 'me') return near(v, c.me, 0.02 * c.me + 0.005);
    return near(v, val(k), 0.02 * c.me + 0.03);
  }
  function label(k) {
    return {
      df: L(B('df = n − 1', 'gl = n − 1')),
      ts: L(B('t* (table)', 't* (tabla)')),
      se: L(B('Standard error s/√n', 'Error estándar s/√n')),
      me: L(B('Margin of error t*·SE', 'Margen de error t*·EE')),
      lo: L(B('Lower limit', 'Límite inferior')),
      hi: L(B('Upper limit', 'Límite superior'))
    }[k];
  }
  function msg(id) {
    var c = C(), sc = c.sc;
    if (id === 'empty') return L(B('Fill in every open box before checking.', 'Llena todas las casillas abiertas antes de verificar.'));
    var M = {
      df:  B('Check df: it is n − 1.', 'Revisa gl: es n − 1.'),
      dfn: B('You used n. The degrees of freedom are n − 1.', 'Usaste n. Los grados de libertad son n − 1.'),
      ts:  B('Check t*: row df, column ' + confTxt(c.conf) + '.', 'Revisa t*: fila gl, columna ' + confTxt(c.conf) + '.'),
      tz:  B('That is z*. Since σ is unknown, the critical value comes from the t row of your degrees of freedom.', 'Ese es z*. Como σ es desconocida, el valor crítico sale de la fila t de tus grados de libertad.'),
      se:  B('Check the standard error: divide s by the square root of n.', 'Revisa el error estándar: divide s entre la raíz cuadrada de n.'),
      ses: B('You used s itself. The standard error is s divided by √n = ' + F(Math.sqrt(c.n), Number.isInteger(Math.sqrt(c.n)) ? 0 : 3) + '.', 'Usaste s tal cual. El error estándar es s dividida entre √n = ' + F(Math.sqrt(c.n), Number.isInteger(Math.sqrt(c.n)) ? 0 : 3) + '.'),
      sen: B('You divided by n. The standard error divides by √n, not by n.', 'Dividiste entre n. El error estándar divide entre √n, no entre n.'),
      me:  B('Check the margin of error: multiply t* by the standard error.', 'Revisa el margen de error: multiplica t* por el error estándar.'),
      mez: B('That margin uses 1.96 or another z value. Multiply by t* instead.', 'Ese margen usa 1.96 u otro valor z. Multiplica por t*.'),
      mes: B('You multiplied t* by s. Multiply it by the standard error.', 'Multiplicaste t* por s. Multiplícalo por el error estándar.'),
      lim: B('Check the limits: ' + VX + ' − ME and ' + VX + ' + ME.', 'Revisa los límites: ' + VX + ' − ME y ' + VX + ' + ME.')
    };
    if (M[id]) return L(M[id]);
    if (id === 'reveal') return L(B(
      'The solution: df = ' + c.df + ', t* = ' + F(c.ts, 3) + ', SE = ' + F(c.s, 1) + '/√' + c.n + ' = ' + F(c.se, 2) + ', ME = ' + F(c.ts, 3) + ' × ' + F(c.se, 2) + ' = ' + F(c.me, 2) + ', limits ' + F(c.xbar, sc.dec) + ' ± ' + F(c.me, 2) + '. Follow each step before you continue.',
      'La solución: gl = ' + c.df + ', t* = ' + F(c.ts, 3) + ', EE = ' + F(c.s, 1) + '/√' + c.n + ' = ' + F(c.se, 2) + ', ME = ' + F(c.ts, 3) + ' × ' + F(c.se, 2) + ' = ' + F(c.me, 2) + ', límites ' + F(c.xbar, sc.dec) + ' ± ' + F(c.me, 2) + '. Sigue cada paso antes de continuar.'));
    if (id === 'done') return L(B(
      '✓ Three intervals built. The recipe never changes: df, t*, standard error, margin, limits.',
      '✓ Tres intervalos construidos. La receta nunca cambia: gl, t*, error estándar, margen, límites.'));
    return L(B(
      '✓ Correct. Interpretation: we are ' + confTxt(c.conf) + ' confident that the mean ' + sc.m.en + ' for ' + sc.who.en + ' is between ' + F(c.lo, 1) + ' and ' + F(c.hi, 1) + (sc.cur ? ' pesos' : ' ' + sc.u.en) + '.',
      '✓ Correcto. Interpretación: tenemos ' + confTxt(c.conf) + ' de confianza en que la media de «' + sc.m.es + '» para ' + sc.who.es + ' está entre ' + F(c.lo, 1) + ' y ' + F(c.hi, 1) + (sc.cur ? ' pesos' : ' ' + sc.u.es) + '.'));
  }
  function render() {
    var c = C(), g = G(), tag = st.done ? L(B('Complete', 'Completo')) : L(B('Interval', 'Intervalo')) + ' ' + (st.i + 1) + '/' + cases.length;
    var body = '';
    if (!st.done) {
      var solved = st.phase === 'solved';
      body = '<div class="scenario-box">' + caseTxt(c, LANG) + ' ' + L(B('Build the ' + confTxt(c.conf) + ' confidence interval for μ.', 'Construye el intervalo de confianza de ' + confTxt(c.conf) + ' para μ.')) + '</div>' +
        '<div class="src-line">' + VX + ' ± ' + VT + '* · ' + frac(VS, sqN(VN)) + '</div>' +
        '<div class="fld-grid">' + KEYS.map(function(k) {
          var inner;
          if (g[k] || solved) inner = '<div class="fld-val' + (g[k] ? ' sm' : '') + '">' + show(k) + '</div>';
          else {
            var cls = 'ft-inp' + (st.bad[k] === 1 ? ' ft-bad' : st.bad[k] === 0 ? ' ft-ok' : '');
            inner = '<input class="' + cls + ' bd-' + k + '" type="text" inputmode="decimal" autocomplete="off" placeholder="?" value="' + (st.v[k] || '') + '">';
          }
          return '<div class="fld"><label>' + label(k) + (g[k] ? ' · ' + L(B('given', 'dado')) : '') + '</label>' + inner + '</div>';
        }).join('') + '</div>' +
        '<div class="iw-sub" style="margin:.2rem 0 0">' + L(B('Round the standard error and the margin to 2 decimals and the limits to 1 decimal.', 'Redondea el error estándar y el margen a 2 decimales y los límites a 1 decimal.')) + '</div>' +
        (solved ? '<button class="verify-btn next bd-next">' + (st.i === cases.length - 1 ? L(B('Finish', 'Terminar')) : L(B('Next interval', 'Siguiente intervalo'))) + '</button>'
                : '<button class="verify-btn bd-check">' + L(B('Check', 'Verificar')) + '</button>');
    }
    host.innerHTML =
      '<div class="iw-head"><span class="iw-tag">' + tag + '</span><span class="iw-title">' + L(B('Interval builder', 'Constructor de intervalos')) + '</span></div>' +
      '<div class="iw-sub">' + L(B(
        'Three cases, and each one gives you less help: first df and t* are given, then only df, and finally nothing. Use the «t table» button whenever you need it.',
        'Tres casos, y cada uno te da menos ayuda: primero se dan gl y t*, después solo gl y al final nada. Usa el botón «Tabla t» cuando lo necesites.')) + '</div>' +
      body + '<div class="iw-fb"></div>';
    if (st.fb) say(host, st.fb.cls, msg(st.fb.id));
    KEYS.forEach(function(k) {
      var e = host.querySelector('.bd-' + k);
      if (e) e.addEventListener('input', function() { st.v[k] = e.value; });
    });
    var bc = host.querySelector('.bd-check'), bn = host.querySelector('.bd-next');
    if (bc) bc.onclick = verify;
    if (bn) bn.onclick = next;
  }
  function verify() {
    var c = C(), g = G(), open = KEYS.filter(function(k) { return !g[k]; }), v = {};
    open.forEach(function(k) { v[k] = numVal(st.v[k]); });
    if (open.some(function(k) { return v[k] === null; })) { st.fb = { cls: 'warm', id: 'empty' }; render(); return; }
    st.bad = {};
    var first = null;
    open.forEach(function(k) { var good = ok(k, v[k]); st.bad[k] = good ? 0 : 1; if (!good && !first) first = k; });
    if (!first) { st.phase = 'solved'; st.bad = {}; st.fb = { cls: 'good', id: 'ok' }; render(); return; }
    st.tries++;
    if (st.tries >= 3) { st.phase = 'solved'; st.bad = {}; st.fb = { cls: 'warm', id: 'reveal' }; render(); return; }
    var x = v[first], id;
    if (first === 'df') id = (x === c.n ? 'dfn' : 'df');
    else if (first === 'ts') id = (near(x, zCrit(c.conf), 0.002) ? 'tz' : 'ts');
    else if (first === 'se') id = near(x, c.s, 0.02 * c.s) ? 'ses' : near(x, c.s / c.n, 0.02 * c.s / c.n + 0.005) ? 'sen' : 'se';
    else if (first === 'me') id = near(x, zCrit(c.conf) * c.se, 0.01 * c.se) ? 'mez' : near(x, c.ts * c.s, 0.02 * c.ts * c.s) ? 'mes' : 'me';
    else id = 'lim';
    st.fb = { cls: 'miss', id: id };
    render();
  }
  function next() {
    checkpoint('interval-builder', st.i, 'round');
    st.i++; st.v = {}; st.tries = 0; st.phase = 'input'; st.fb = null; st.bad = {};
    if (st.i >= cases.length) { st.done = true; st.fb = { cls: 'good', id: 'done' }; }
    saveSession(); render();
    if (st.done) applyLocks();
  }
  widgets.push(render); render();
}

/* ════════════════════════════════════════════════════════════════════════
   WIDGET 5 · Method chooser (MODE C · the tap is the submission)
   ════════════════════════════════════════════════════════════════════════ */
function wMethod(host, items) {
  var CATS = [
    { k: 't',  t: B('t interval', 'Intervalo t') },
    { k: 'z',  t: B('z interval', 'Intervalo z') },
    { k: 'no', t: B('Neither: a condition fails', 'Ninguno: falla una condición') }
  ];
  var st = WSTATE.method || (WSTATE.method = { i: 0, tries: 0, phase: 'ask', fb: null, wrong: {}, done: false });
  var tok = 0;
  function catName(k) { return L(CATS.filter(function(z) { return z.k === k; })[0].t); }
  function step(withCheckpoint) {
    if (withCheckpoint) checkpoint('method-chooser', st.i, 'round');
    st.i++; st.tries = 0; st.wrong = {}; st.phase = 'ask'; st.fb = null;
    if (st.i >= items.length) st.done = true;
  }
  if (st.phase === 'shown') step(false);
  function later(ms) {
    var mine = ++tok;
    setTimeout(function() {
      if (mine !== tok || st.phase !== 'shown') return;
      step(true); saveSession(); render();
      if (st.done) applyLocks();
    }, ms);
  }
  function render() {
    if (st.done) {
      host.innerHTML =
        '<div class="iw-head"><span class="iw-tag">' + L(B('Complete', 'Completo')) + '</span><span class="iw-title">' + L(B('Method chooser', 'Selector de método')) + '</span></div>' +
        '<div class="iw-fb good">' + L(B(
          '✓ ' + items.length + ' cases decided. Three questions settle it every time: Is σ known? Is the sample random? With a small n, does the data look roughly normal, without strong skew or outliers?',
          '✓ ' + items.length + ' casos decididos. Tres preguntas lo resuelven siempre: ¿se conoce σ? ¿la muestra es aleatoria? Con n pequeña, ¿los datos se ven aproximadamente normales, sin sesgo fuerte ni valores atípicos?')) + '</div>';
      return;
    }
    var it = items[st.i];
    host.innerHTML =
      '<div class="iw-head"><span class="iw-tag">' + L(B('Case', 'Caso')) + ' ' + (st.i + 1) + '/' + items.length + '</span>' +
        '<span class="iw-title">' + L(B('Method chooser', 'Selector de método')) + '</span></div>' +
      '<div class="iw-sub">' + L(B('Read the case and tap the method an analyst should use to estimate the mean.', 'Lee el caso y toca el método que un analista debe usar para estimar la media.')) + '</div>' +
      '<div class="scenario-box">' + L(it.t) + '</div>' +
      '<div class="shape-grid three">' + CATS.map(function(c) {
        var cls = 'shape-btn', dis = '';
        if (st.phase === 'shown') { dis = ' disabled'; if (c.k === it.k) cls += ' shape-correct'; }
        else if (st.wrong[c.k]) { cls += ' shape-wrong'; dis = ' disabled'; }
        return '<button class="' + cls + '" data-k="' + c.k + '"' + dis + '>' + L(c.t) + '</button>';
      }).join('') + '</div>' +
      '<div class="iw-fb"></div>';
    if (st.fb) {
      var m = st.fb.id === 'why' ? '✓ ' + L(it.why)
            : st.fb.id === 'reveal' ? L(B('The right choice is <strong>' + catName(it.k) + '</strong>. ', 'La elección correcta es <strong>' + catName(it.k) + '</strong>. ')) + L(it.why)
            : L(it.hint);
      say(host, st.fb.cls, m);
    }
    host.querySelectorAll('.shape-btn').forEach(function(btn) {
      btn.onclick = function() {
        if (st.phase !== 'ask') return;
        var k = btn.getAttribute('data-k');
        if (k === it.k) { st.phase = 'shown'; st.fb = { cls: 'good', id: 'why' }; render(); later(3200); return; }
        st.tries++; st.wrong[k] = 1;
        if (st.tries >= 2) { st.phase = 'shown'; st.fb = { cls: 'warm', id: 'reveal' }; render(); later(5000); return; }
        st.fb = { cls: 'miss', id: 'hint' };
        render();
      };
    });
  }
  widgets.push(render); render();
}

/* ════════════════════════════════════════════════════════════════════════
   buildLesson(rng)
   ════════════════════════════════════════════════════════════════════════ */
function buildLesson(rng) {
  /*
   * CONCEPT ARC
   * topic        : Confidence intervals for the mean with small samples (Statistics)
   * prerequisite : The student knows the z interval x̄ ± z*·σ/√n, the sample mean and the
   *                sample standard deviation s, and what a confidence level is.
   * sequence     : 1. Why replacing σ by s and keeping z* fails when n is small
   *                   (seen in a coverage simulation before any new formula appears)
   *                2. The t distribution: df = n − 1, heavier tails, convergence to the normal;
   *                   how to read the t table, including the missing-row rule
   *                3. The t interval x̄ ± t*·s/√n built step by step (df, t*, SE, ME, limits)
   *                4. Choosing between t, z or neither (σ known? random? shape?), the correct
   *                   meaning of the confidence level, and what changes the width
   * why_this_order: the failure (1) motivates the new distribution (2); the table must be
   *                readable before an interval can be built (3); judging when the method
   *                applies and what it means (4) needs the full procedure in hand.
   *
   * time_audit   : (Part 0-T constants unchanged; x1.2 applied to every C1, C2 and S)
   *   reading   ~1050w (ES) / 90 + 1 try-first (build an interval on paper)  = 13.7m
   *   W cover-sim        60s + 4 missions x [T 2T R15]        (Mode A)      =  5.0m
   *   W t-curves         60s + 3 missions x 40s               (Mode A)      =  3.0m
   *   W table-reader     60s + R30 + [R10 C1 2K] + 2 x [R10 2C1 3K]
   *                      = 90 + 92 + 2x154                                  =  8.2m
   *   W interval-builder 60s + R30 + [R20 3C1 4K] + [R20 4C1 5K] + [R20 4C1 6K]
   *                      = 90 + 226 + 288 + 308                             = 15.2m
   *   W method-chooser   60s + 5 x [R25 K T]                  (Mode C)      =  6.0m
   *   P1 [R30 2K T] 85s        P2 [R30 C1 K T] 107s     P3 [R30 2C1 T] 129s
   *   P4 [R45 2K T] 100s       P5 gated [R40 4C1] 248s  P6 gated [R40 S] 188s
   *   P7 [R40 2K T] 95s        P8 [R40 2C1 K T] 159s
   *   P9 gated [R40 5C1] 290s  P10 gated [R50 4C1 K T] 293s = 1694s       = 28.2m
   *   slack (welcome, interface, t-table popup, PDF)                        =  5.0m
   *   TOTAL 84.3m  (target 75-85, hard window 70-90; heavy rounds 1/6: builder round 3)
   *   first pass was 91m: applied Step 4 in order (simulator +25 -> +50 per click,
   *   table reader 4 -> 3 lookups, P4 margin calculation -> conceptual width item,
   *   method chooser 6 -> 5 cases).
   */
  var scn = shuffle(SC, rng);
  var S0 = scn[0];
  function caseOn(list, o, cond) {           /* first scenario in list that yields a case meeting cond */
    for (var a = 0; a < 6; a++) {
      for (var i = 0; i < list.length; i++) {
        var c;
        try { c = mkCase(rng, list[i], o); } catch (e) { continue; }
        if (!cond || cond(c)) return c;
      }
    }
    throw new Error('caseOn failed');
  }
  function oneTailCol(conf) { return { 90: 80, 95: 90, 99: 98 }[conf]; }
  function iv(lo, hi, sc) { return { en: ivTxt(lo, hi, sc, 'en'), es: ivTxt(lo, hi, sc, 'es') }; }
  function uniq(arr) { return arr.every(function(v, i) { return arr.indexOf(v) === i; }); }

  /* ───────────────────────── CONCEPT 1 ───────────────────────── */
  addSection(function(l) {
    var E = (l === 'en');
    return '<div class="stag">' + (E ? 'Concept 1' : 'Concepto 1') + '</div>' +
      '<h2>' + (E ? 'The problem: unknown σ and few data' : 'El problema: σ desconocida y pocos datos') + '</h2>' +
      '<p>' + (E
        ? 'A confidence interval for a mean always has the same shape: estimate ± margin of error. When the population standard deviation σ is known, the interval is'
        : 'Un intervalo de confianza para una media siempre tiene la misma forma: estimación ± margen de error. Cuando se conoce la desviación estándar poblacional σ, el intervalo es') + '</p>' +
      '<div class="eqline">' + VX + ' ± <i>z</i>* · ' + frac('σ', sqN(VN)) + '</div>' +
      '<p>' + (E
        ? 'In business σ is almost never known. All you have is the standard deviation of your own sample, ' + VS + '. The temptation is to put ' + VS + ' in place of σ and keep using z*. With large samples that works, because ' + VS + ' lands very close to σ. With small samples it does not: ' + VS + ' changes a lot from one sample to the next and is sometimes much smaller than σ. Those intervals come out too narrow and fail more often than they promise.'
        : 'En los negocios casi nunca se conoce σ. Lo único que tienes es la desviación estándar de tu propia muestra, ' + VS + '. La tentación es poner ' + VS + ' en lugar de σ y seguir usando z*. Con muestras grandes funciona, porque ' + VS + ' queda muy cerca de σ. Con muestras pequeñas no: ' + VS + ' cambia mucho de una muestra a otra y a veces sale bastante menor que σ. Esos intervalos salen demasiado angostos y fallan más veces de lo que prometen.') + '</p>' +
      '<div class="callout"><p>' + (E
        ? '<strong>A bit of history.</strong> In the early 1900s William Sealy Gosset worked for the Guinness brewery in Dublin and had to draw conclusions from very few batches. He found the right distribution for that situation and published it in 1908 under the pen name «Student». That is why it is called Student\'s t distribution.'
        : '<strong>Un poco de historia.</strong> A principios del siglo XX, William Sealy Gosset trabajaba en la cervecería Guinness, en Dublín, y tenía que sacar conclusiones con muy pocos lotes. Encontró la distribución correcta para esa situación y la publicó en 1908 con el seudónimo «Student». Por eso se llama distribución t de Student.') + '</p></div>' +
      '<div class="callout"><p>' + (E
        ? '<strong>Worked example.</strong> A delivery app times 5 deliveries: ' + VX + ' = 34 min and ' + VS + ' = 6 min. The standard error is ' + VS + '/√' + VN + ' = 6/√5 = 2.68 min. With z* = 1.96 the interval would be 34 ± 5.26, from 28.7 to 39.3 min. With the t value you will learn to read in this guide, t* = 2.776, it is 34 ± 7.45, from 26.6 to 41.4 min. Is that extra width worth it? The simulator answers.'
        : '<strong>Ejemplo resuelto.</strong> Una app de reparto cronometra 5 entregas: ' + VX + ' = 34 min y ' + VS + ' = 6 min. El error estándar es ' + VS + '/√' + VN + ' = 6/√5 = 2.68 min. Con z* = 1.96 el intervalo sería 34 ± 5.26, de 28.7 a 39.3 min. Con el valor t que aprenderás a leer en esta guía, t* = 2.776, queda 34 ± 7.45, de 26.6 a 41.4 min. ¿Vale la pena ese ancho extra? El simulador responde.') + '</p></div>';
  });

  wSim(widgetHost('cover-sim', 'sim'), S0);

  /* P1 · why the z-with-s interval under-covers */
  addProb({
    title: B('Why the shortcut fails', 'Por qué falla el atajo'),
    q: B('In the simulator, with ' + VN + ' = 4 the gold interval (z* = 1.96 with ' + VS + ' in place of σ) missed μ far more often than 5% of the time. What is the main reason?',
         'En el simulador, con ' + VN + ' = 4 el intervalo dorado (z* = 1.96 con ' + VS + ' en lugar de σ) falló en capturar a μ mucho más del 5% de las veces. ¿Cuál es la razón principal?'),
    hint: B('Both intervals used the same sample mean. Think about what else goes into the margin of error and how stable it is with only 4 data.',
            'Los dos intervalos usaron la misma media muestral. Piensa qué más entra en el margen de error y qué tan estable es con solo 4 datos.'),
    exp: B('Both intervals are centred on the same ' + VX + ', so the centre is not the problem. With 4 data, ' + VS + ' jumps around and often falls below σ; 1.96 does not account for that, so many intervals are too narrow. The t distribution uses a larger critical value that pays for this extra uncertainty.',
           'Los dos intervalos están centrados en la misma ' + VX + ', así que el centro no es el problema. Con 4 datos, ' + VS + ' brinca mucho y con frecuencia queda por debajo de σ; 1.96 no toma eso en cuenta, así que muchos intervalos salen demasiado angostos. La distribución t usa un valor crítico mayor que paga esa incertidumbre extra.'),
    optsEn: ['With 4 data, s is unstable and often too small, so the intervals come out too narrow',
             'The sample mean is a biased estimate of μ whenever the sample contains very few data',
             'The true mean μ shifts from one sample to the next when the samples are very small',
             'Samples of size 4 are never truly random, so no interval built from them can be trusted'],
    optsEs: ['Con 4 datos, s es inestable y a menudo sale pequeña, así que los intervalos quedan angostos',
             'La media muestral es un estimador sesgado de μ siempre que la muestra tiene muy pocos datos',
             'La media real μ se mueve de una muestra a otra cuando las muestras son muy pequeñas',
             'Las muestras de tamaño 4 nunca son realmente aleatorias, así que ningún intervalo es confiable'],
    showWork: false
  }, rng);

  /* ───────────────────────── CONCEPT 2 ───────────────────────── */
  addSection(function(l) {
    var E = (l === 'en');
    function card(name, form, note) { return '<div class="rcard"><div class="rname">' + name + '</div><div class="rform">' + form + '</div><div class="rnote">' + note + '</div></div>'; }
    return '<div class="stag">' + (E ? 'Concept 2' : 'Concepto 2') + '</div>' +
      '<h2>' + (E ? 'The t distribution and how to read its table' : 'La distribución t y cómo leer su tabla') + '</h2>' +
      '<p>' + (E
        ? 'The t distribution looks like the standard normal: bell-shaped, symmetric and centred at 0. The difference is in the tails, which are heavier, because the t distribution accounts for the extra uncertainty of estimating σ with ' + VS + '.'
        : 'La distribución t se parece a la normal estándar: tiene forma de campana, es simétrica y está centrada en 0. La diferencia está en las colas, que son más pesadas, porque la distribución t toma en cuenta la incertidumbre adicional de estimar σ con ' + VS + '.') + '</p>' +
      '<p>' + (E
        ? 'There is not one t curve but a family, and each member is identified by its <strong>degrees of freedom</strong> (df). For the mean of one sample, df = ' + VN + ' − 1. The more degrees of freedom, the closer the t curve is to the normal.'
        : 'No hay una sola curva t, sino una familia, y cada curva se identifica por sus <strong>grados de libertad</strong> (gl). Para la media de una muestra, gl = ' + VN + ' − 1. Entre más grados de libertad, más se parece la curva t a la normal.') + '</p>' +
      '<div class="rules-grid">' +
        card(E ? 'Degrees of freedom' : 'Grados de libertad', E ? 'df = n − 1' : 'gl = n − 1', E ? 'With n = 12 data, df = 11.' : 'Con n = 12 datos, gl = 11.') +
        card(E ? 'Critical value' : 'Valor crítico', 't*', E ? 'Leaves the confidence level in the centre of the curve. It comes from the table.' : 'Deja el nivel de confianza en el centro de la curva. Sale de la tabla.') +

    var hSig = B('Start with σ: is it really known, or only estimated from the sample?', 'Empieza por σ: ¿se conoce de verdad o solo se estima con la muestra?');
    var hCond = B('Before choosing a formula, check how the sample was obtained and what the data look like.', 'Antes de elegir fórmula, revisa cómo se obtuvo la muestra y cómo se ven los datos.');
    var n1 = ri(rng, 8, 14), n2 = ri(rng, 36, 60), n3 = ri(rng, 6, 12), n4 = ri(rng, 10, 20), n6 = ri(rng, 12, 20);
    var m5 = mid(sE), d5 = sdv(sE), lo5 = m5 - d5, hi5 = m5 + d5, out5 = m5 + 6 * d5;
    var items = [
      { k: 't', t: B('For ' + sA.who.en + ', an analyst records ' + sA.m.en + ' in a random sample of ' + n1 + ' cases. The dot plot is roughly symmetric with no outliers, and σ is unknown.',
                     'Para ' + sA.who.es + ', un analista registra «' + sA.m.es + '» en una muestra aleatoria de ' + n1 + ' casos. El diagrama de puntos es aproximadamente simétrico, sin valores atípicos, y σ es desconocida.'),
        why: B('σ is unknown, the sample is random and the data look roughly normal: t interval with df = ' + (n1 - 1) + '.', 'σ es desconocida, la muestra es aleatoria y los datos se ven aproximadamente normales: intervalo t con gl = ' + (n1 - 1) + '.'), hint: hSig },
      { k: 't', t: B('A random sample of ' + n2 + ' values of ' + sB.m.en + ' at ' + sB.who.en + ' has a moderately skewed histogram. Only the sample standard deviation s is available.',
                     'Una muestra aleatoria de ' + n2 + ' valores de «' + sB.m.es + '» de ' + sB.who.es + ' tiene un histograma con sesgo moderado. Solo se cuenta con la desviación estándar muestral s.'),
        why: B('σ is unknown, so the method is t, even with ' + n2 + ' data. With that many observations moderate skew is acceptable, and t* is very close to z*.', 'σ es desconocida, así que el método es t, aun con ' + n2 + ' datos. Con tantas observaciones el sesgo moderado es aceptable, y t* queda muy cerca de z*.'),
        hint: B('A large sample does not make σ known. What do you actually have?', 'Una muestra grande no hace que σ se conozca. ¿Qué tienes en realidad?') },
      { k: 'z', t: B('For ' + sC.who.en + ', years of process records establish σ = ' + val(sdv(sC), sC, 'en') + ' for ' + sC.m.en + ', and the process has not changed. A random sample of ' + n3 + ' cases looks roughly normal.',
                     'Para ' + sC.who.es + ', años de registros del proceso establecen σ = ' + val(sdv(sC), sC, 'es') + ' para «' + sC.m.es + '», y el proceso no ha cambiado. Una muestra aleatoria de ' + n3 + ' casos se ve aproximadamente normal.'),
        why: B('σ is known from long experience with an unchanged process, so the critical value comes from the normal distribution: z interval, even with a small sample.', 'σ se conoce por larga experiencia con un proceso que no ha cambiado, así que el valor crítico sale de la normal: intervalo z, aun con muestra pequeña.'),
        hint: B('The sample is small, but read again what is said about σ.', 'La muestra es pequeña, pero vuelve a leer lo que se dice de σ.') },
      { k: 'no', t: B('For ' + sE.who.en + ', 7 random measurements of ' + sE.m.en + ': six fall between ' + val(lo5, sE, 'en') + ' and ' + val(hi5, sE, 'en') + ', and one is ' + val(out5, sE, 'en') + '. σ is unknown.',
                      'Para ' + sE.who.es + ', 7 mediciones aleatorias de «' + sE.m.es + '»: seis caen entre ' + val(lo5, sE, 'es') + ' y ' + val(hi5, sE, 'es') + ', y una vale ' + val(out5, sE, 'es') + '. σ es desconocida.'),
        why: B('With only 7 data, one strong outlier drags ' + VX + ' and inflates s, so the t interval is not reliable. Investigate that value before estimating anything.', 'Con solo 7 datos, un valor atípico fuerte arrastra a ' + VX + ' e infla a s, así que el intervalo t no es confiable. Investiga ese valor antes de estimar nada.'), hint: hCond },
      { k: 'no', t: B('The ' + n6 + ' values of ' + sF.m.en + ' at ' + sF.who.en + ' come from the customers who chose to answer a survey right after filing a complaint. σ is unknown.',
                      'Los ' + n6 + ' valores de «' + sF.m.es + '» de ' + sF.who.es + ' vienen de los clientes que decidieron contestar una encuesta justo después de presentar una queja. σ es desconocida.'),
        why: B('The sample is not random: customers who complained and volunteered are not representative, and no formula fixes that bias.', 'La muestra no es aleatoria: los clientes que se quejaron y se ofrecieron a contestar no son representativos, y ninguna fórmula corrige ese sesgo.'), hint: hCond }
    ];
    wMethod(widgetHost('method-chooser', 'method'), shuffle(items, rng));
  })();

  /* P7 · interpretation */
  (function() {
    var c = caseOn([scn[11], scn[12], scn[13]], { ns: [8, 10, 12, 15], confs: [90, 95, 99], exactSE: false });
    var sc = c.sc, a = F(c.lo, 1), b = F(c.hi, 1), cf = confTxt(c.conf);
    var ue = sc.cur ? ' pesos' : ' ' + sc.u.en, us = sc.cur ? ' pesos' : ' ' + sc.u.es;
    addProb({
      title: B('What the interval says', 'Qué dice el intervalo'),
      q: B('From a random sample, an analyst at ' + sc.who.en + ' reports a ' + cf + ' confidence interval for the mean ' + sc.m.en + ' from ' + a + ' to ' + b + ue + '. Which statement is correct?',
           'Con una muestra aleatoria, un analista de ' + sc.who.es + ' reporta un intervalo de confianza de ' + cf + ' para la media de «' + sc.m.es + '» de ' + a + ' a ' + b + us + '. ¿Qué afirmación es correcta?'),
      hint: B('The interval estimates one fixed number about the whole population. Individual cases and the sample mean are something else.',
              'El intervalo estima un número fijo de toda la población. Los casos individuales y la media muestral son otra cosa.'),
      exp: B('The confidence is about the method capturing the population mean μ. It says nothing about ' + cf + ' of individual cases, the sample mean is already known (it is the centre), and other samples would produce their own intervals.',
             'La confianza se refiere a que el método capture la media poblacional μ. No dice nada sobre el ' + cf + ' de los casos individuales, la media muestral ya se conoce (es el centro) y otras muestras producirían sus propios intervalos.'),
      optsEn: ['We are ' + cf + ' confident that the population mean is between ' + a + ' and ' + b,
               cf + ' of the individual cases in the population are between ' + a + ' and ' + b,
               'There is a ' + cf + ' chance that the sample mean is between ' + a + ' and ' + b,
               cf + ' of future samples will have a mean between ' + a + ' and ' + b],
      optsEs: ['Tenemos ' + cf + ' de confianza en que la media poblacional está entre ' + a + ' y ' + b,
               'El ' + cf + ' de los casos individuales de la población está entre ' + a + ' y ' + b,
               'Hay una probabilidad de ' + cf + ' de que la media muestral esté entre ' + a + ' y ' + b,
               'El ' + cf + ' de las muestras futuras tendrá una media entre ' + a + ' y ' + b],
      showWork: false
    }, rng);
  })();

  /* ───────────────────────── FINAL ───────────────────────── */
  addSection(function(l) {
    var E = (l === 'en');
    return '<div class="stag">' + (E ? 'Final assessment' : 'Evaluación final') + '</div>' +
      '<h2>' + (E ? 'Estimate like an analyst' : 'Estima como analista') + '</h2>' +
      '<p>' + (E ? 'Three decisions with no guidance from the text. Each one counts toward your result. Keep the «t table» button at hand.' : 'Tres decisiones sin guía del texto. Cada una cuenta para tu resultado. Ten a la mano el botón «Tabla t».') + '</p>';
  });

  /* P8 · sample size effect */
  (function() {
    var pr = pick([[4, 16], [9, 25]], rng), conf = pick([90, 95], rng), sc = scn[12];
    var m1 = tCrit(pr[0] - 1, conf) / Math.sqrt(pr[0]), m2 = tCrit(pr[1] - 1, conf) / Math.sqrt(pr[1]);
    var ratio = m1 / m2, sq = Math.sqrt(pr[1] / pr[0]), nr = pr[1] / pr[0];
    var r = [F(ratio, 1), F(sq, 1), F(nr, 1)];
    addProb({
      title: B('More data, narrower interval', 'Más datos, intervalo más angosto'),
      q: B('An analyst at ' + sc.who.en + ' built a ' + confTxt(conf) + ' t interval for the mean ' + sc.m.en + ' with ' + VN + ' = ' + pr[0] + '. She will repeat the study with ' + VN + ' = ' + pr[1] + '. If ' + VS + ' turns out the same, about how many times smaller will the margin of error be?',
           'Una analista de ' + sc.who.es + ' construyó un intervalo t de ' + confTxt(conf) + ' para la media de «' + sc.m.es + '» con ' + VN + ' = ' + pr[0] + '. Repetirá el estudio con ' + VN + ' = ' + pr[1] + '. Si ' + VS + ' sale igual, ¿aproximadamente cuántas veces más pequeño será el margen de error?'),
      hint: B('Write ME = t* · s/√n for both sample sizes. Both t* and √n change.', 'Escribe ME = t* · s/√n para los dos tamaños de muestra. Cambian tanto t* como √n.'),
      exp: B('ME₁ = ' + F(tCrit(pr[0] - 1, conf), 3) + ' · s/' + Math.sqrt(pr[0]) + ' = ' + F(m1, 3) + 's and ME₂ = ' + F(tCrit(pr[1] - 1, conf), 3) + ' · s/' + Math.sqrt(pr[1]) + ' = ' + F(m2, 3) + 's. The ratio is ' + F(ratio, 2) + ': √n alone would give ' + F(sq, 1) + ', and the smaller t* adds the rest.',
             'ME₁ = ' + F(tCrit(pr[0] - 1, conf), 3) + ' · s/' + Math.sqrt(pr[0]) + ' = ' + F(m1, 3) + 's y ME₂ = ' + F(tCrit(pr[1] - 1, conf), 3) + ' · s/' + Math.sqrt(pr[1]) + ' = ' + F(m2, 3) + 's. El cociente es ' + F(ratio, 2) + ': √n por sí sola daría ' + F(sq, 1) + ', y el t* más pequeño aporta el resto.'),
      optsEn: ['About ' + r[0] + ' times smaller', 'About ' + r[1] + ' times smaller', 'About ' + r[2] + ' times smaller', 'About the same size as before'],
      optsEs: ['Unas ' + r[0] + ' veces más pequeño', 'Unas ' + r[1] + ' veces más pequeño', 'Unas ' + r[2] + ' veces más pequeño', 'Más o menos del mismo tamaño'],
      showWork: false, dbg: { ratio: ratio }
    }, rng);
  })();

  /* P9 · interval with a missing row (gated) */
  (function() {
    function opts(c) {
      var t1 = tCrit(c.df, oneTailCol(c.conf));
      return [[c.lo, c.hi], [c.xbar - t1 * c.se, c.xbar + t1 * c.se], [c.xbar - c.ts * c.s / c.n, c.xbar + c.ts * c.s / c.n], [c.xbar - c.ts * c.s, c.xbar + c.ts * c.s]];
    }
    var c = caseOn([scn[13], scn[14], scn[10], scn[11]], { ns: [36, 49, 64], confs: [90, 95, 99], exactSE: true }, function(c) {
      var o = opts(c);
      return o.every(function(p) { return p[0] > 0; }) && uniq(o.map(function(p) { return ivTxt(p[0], p[1], c.sc, 'en'); }));
    });
    var sc = c.sc, o = opts(c), row = ttRow(c.df).df;
    addProb({
      title: B('A larger sample', 'Una muestra más grande'),
      q: B(caseTxt(c, 'en') + ' σ is unknown. Which is the ' + confTxt(c.conf) + ' confidence interval for μ?',
           caseTxt(c, 'es') + ' σ es desconocida. ¿Cuál es el intervalo de confianza de ' + confTxt(c.conf) + ' para μ?'),
      hint: B('Check whether your degrees of freedom appear in the table before you read t*.', 'Revisa si tus grados de libertad aparecen en la tabla antes de leer t*.'),
      exp: B('df = ' + c.df + ' is not printed, so use row ' + row + ': t* = ' + F(c.ts, 3) + '. SE = ' + F(c.s, 1) + '/√' + c.n + ' = ' + F(c.se, 2) + ', ME = ' + F(c.me, 2) + ', limits ' + F(c.xbar, sc.dec) + ' ± ' + F(c.me, 2) + '.',
             'gl = ' + c.df + ' no aparece, así que se usa la fila ' + row + ': t* = ' + F(c.ts, 3) + '. EE = ' + F(c.s, 1) + '/√' + c.n + ' = ' + F(c.se, 2) + ', ME = ' + F(c.me, 2) + ', límites ' + F(c.xbar, sc.dec) + ' ± ' + F(c.me, 2) + '.'),
      optsEn: o.map(function(p) { return ivTxt(p[0], p[1], sc, 'en'); }),
      optsEs: o.map(function(p) { return ivTxt(p[0], p[1], sc, 'es'); }),
      showWork: true, dbg: { lo: c.lo, hi: c.hi }
    }, rng);
  })();

  /* P10 · a claim tested with the interval (gated). The claim sits between the z limit and the t limit. */
  (function() {
    var mu0, zH, t9;
    var c = caseOn([scn[14], scn[15], scn[16], scn[17], scn[1]], { ns: [5, 6, 7, 8], confs: [95], exactSE: false }, function(c) {
      zH = c.xbar + 1.96 * c.se; t9 = tCrit(c.df, 90);
      if (c.hi - zH < 0.6) return false;
      mu0 = r1((zH + c.hi) / 2);
      if (mu0 - zH < 0.2 || c.hi - mu0 < 0.2) return false;
      if (Math.abs(c.xbar + t9 * c.se - zH) < 0.15 || Math.abs(c.xbar + t9 * c.se - mu0) < 0.15) return false;
      return c.xbar - 1.96 * c.se > 0;
    });
    var sc = c.sc, ints = [[c.lo, c.hi], [c.xbar - 1.96 * c.se, zH], [c.lo, c.hi], [c.xbar - t9 * c.se, c.xbar + t9 * c.se]];
    function inside(p) { return p[0] <= mu0 && mu0 <= p[1]; }
    var verd = [inside(ints[0]), inside(ints[1]), !inside(ints[2]), inside(ints[3])];
    var mE = sc.cur ? '$' + F(mu0, 1) : F(mu0, 1) + ' ' + sc.u.en, mS = sc.cur ? '$' + F(mu0, 1) : F(mu0, 1) + ' ' + sc.u.es;
    function opt(p, v, l) {
      return ivTxt(p[0], p[1], sc, l) + (l === 'en' ? (v ? '; the claim is plausible' : '; the data contradict the claim') : (v ? '; la afirmación es plausible' : '; los datos contradicen la afirmación'));
    }
    addProb({
      title: B('Checking a claim', 'Revisar una afirmación'),
      q: B('The provider of ' + sc.who.en + ' claims that the mean ' + sc.m.en + ' is ' + mE + '. ' + caseTxt(c, 'en') + ' Build the 95% confidence interval for μ. What do you conclude about the claim?',
           'El proveedor de ' + sc.who.es + ' afirma que la media de «' + sc.m.es + '» es ' + mS + '. ' + caseTxt(c, 'es') + ' Construye el intervalo de confianza de 95% para μ. ¿Qué concluyes sobre la afirmación?'),
      hint: B('Build the t interval first (σ is unknown), then check whether the claimed value lies inside it.', 'Construye primero el intervalo t (σ es desconocida) y después revisa si el valor afirmado queda dentro.'),
      exp: B('df = ' + c.df + ', t* = ' + F(c.ts, 3) + ', SE = ' + F(c.se, 3) + ', ME = ' + F(c.me, 2) + ': the interval goes from ' + F(c.lo, 1) + ' to ' + F(c.hi, 1) + ', and ' + F(mu0, 1) + ' is inside, so the claim is plausible. The z shortcut ends at ' + F(zH, 1) + ' and would wrongly reject it: with ' + c.n + ' data that mistake changes the decision.',
             'gl = ' + c.df + ', t* = ' + F(c.ts, 3) + ', EE = ' + F(c.se, 3) + ', ME = ' + F(c.me, 2) + ': el intervalo va de ' + F(c.lo, 1) + ' a ' + F(c.hi, 1) + ', y ' + F(mu0, 1) + ' queda dentro, así que la afirmación es plausible. El atajo con z termina en ' + F(zH, 1) + ' y la rechazaría por error: con ' + c.n + ' datos ese error cambia la decisión.'),
      optsEn: ints.map(function(p, i) { return opt(p, verd[i], 'en'); }),
      optsEs: ints.map(function(p, i) { return opt(p, verd[i], 'es'); }),
      showWork: true, dbg: { lo: c.lo, hi: c.hi, mu0: mu0, zH: zH }
    }, rng);
  })();
}

</script>
</body>
