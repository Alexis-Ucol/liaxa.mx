/* ════════ WIDGET 1 - máquina de divisibilidad ════════ */
function buildDivMachine(rng){
  var ES=(LANG==='es');
  var DIVS=[2,3,4,5,6,9,10];
  var TIP={
    2: ES?'la última cifra debe ser par':'the last digit must be even',
    3: ES?'la suma de sus cifras debe ser múltiplo de 3':'its digit sum must be a multiple of 3',
    4: ES?'sus dos últimas cifras deben formar un múltiplo de 4':'its last two digits must form a multiple of 4',
    5: ES?'debe terminar en 0 o en 5':'it must end in 0 or 5',
    6: ES?'debe pasar a la vez la prueba del 2 y la del 3':'it must pass the test for 2 and the test for 3',
    9: ES?'la suma de sus cifras debe ser múltiplo de 9':'its digit sum must be a multiple of 9',
    10: ES?'debe terminar en 0':'it must end in 0'
  };
  function newN(){
    for(var t=0;t<300;t++){
      var n=ri(rng,124,986), c=0;
      for(var i=0;i<DIVS.length;i++) if(n%DIVS[i]===0) c++;
      if(c>=2&&c<=4) return n;
    }
    return 468;
  }
  var st={ round:0, n:newN(), sel:{}, tries:0, reveal:false, done:false, msg:'' };
  var wrap=document.createElement('div');
  wrap.className='iw section'; wrap.setAttribute('data-widget','divcheck'); wrap.id='divW';
  function tag(){ return '<div class="iw-tag">'+(ES?'Máquina de divisibilidad':'Divisibility machine')+'</div>'; }
  function render(){
    if(st.done){
      wrap.innerHTML=tag()+'<div class="rfb" style="color:var(--ok);font-weight:700">🎉 '+
        (ES?'Tres números analizados sin hacer una sola división.':'Three numbers analysed without doing a single division.')+'</div>';
      return;
    }
    var chips=DIVS.map(function(d){
      var cls='dchip'+(st.sel[d]?' on':'');
      if(st.reveal) cls+=(st.n%d===0?' good':(st.sel[d]?' miss':''))+' lock';
      return '<div class="'+cls+'" onclick="divTap('+d+')">'+d+'</div>';
    }).join('');
    wrap.innerHTML=tag()+
      '<div class="iw-round">'+(ES?'Número':'Number')+' '+(st.round+1)+' / 3</div>'+
      '<div class="iw-instr">'+(ES?'Enciende cada número que divida exactamente al de abajo. Puedes apagarlos y volver a encenderlos las veces que quieras.'
                                  :'Switch on every number that divides the one below exactly. You can switch them off and on as many times as you like.')+'</div>'+
      '<div class="iw-big">'+st.n+'</div>'+
      '<div class="chiprow">'+chips+'</div>'+
      (st.reveal?'':'<button class="rverify-btn" onclick="divCheck()">'+(ES?'Comprobar':'Check')+'</button>')+
      '<div class="rfb" id="divFb">'+st.msg+'</div>';
  }
  function nextRound(delay){
    setTimeout(function(){
      st.round++;
      if(st.round>=3){ st.done=true; render(); return; }
      st.n=newN(); st.sel={}; st.tries=0; st.reveal=false; st.msg=''; render();
    }, delay);
  }
  window.divTap=function(d){
    if(st.reveal||st.done) return;
    st.sel[d]=!st.sel[d];
    var on=DIVS.filter(function(x){ return st.sel[x]; });
    st.msg=(ES?'Encendidos: ':'Switched on: ')+(on.length?on.join(', '):(ES?'ninguno todavía':'none yet'));
    render();
  };
  window.divCheck=function(){
    if(st.reveal||st.done) return;
    var wrong=null, missed=null;
    DIVS.forEach(function(d){
      var isD=(st.n%d===0);
      if(st.sel[d]&&!isD&&wrong===null) wrong=d;
      if(!st.sel[d]&&isD&&missed===null) missed=d;
    });
    if(wrong===null&&missed===null){
      st.msg='<span style="color:var(--ok);font-weight:700">✓ '+(ES?'Justo ese es el juego completo de divisores de '+st.n+'.':'That is exactly the full set of divisors of '+st.n+'.')+'</span>';
      render(); nextRound(1500); return;
    }
    st.tries++;
    if(st.tries>=3){
      st.reveal=true;
      st.msg=(ES?'Los divisores de '+st.n+' en esta lista son: ':'The divisors of '+st.n+' in this list are: ')+
             DIVS.filter(function(d){ return st.n%d===0; }).join(', ')+'.';
      render(); nextRound(2800); return;
    }
    if(wrong!==null) st.msg=(ES?'Apaga el '+wrong+': para pasar esa prueba, '+TIP[wrong]+'.'
                               :'Switch off '+wrong+': to pass that test, '+TIP[wrong]+'.');
    else st.msg=(ES?'Falta encender uno. Mira el '+missed+': '+TIP[missed]+'.'
                   :'One is still off. Look at '+missed+': '+TIP[missed]+'.');
    render();
  };
  render();
  document.getElementById('lessonBody').appendChild(wrap);
}

/* ════════ WIDGET 2 - árbol de factores primos ════════ */
function buildFactorTree(rng){
  var ES=(LANG==='es');
  var PR=[2,3,5,7,11,13];
  function newN(){
    for(var t=0;t<300;t++){
      var k=ri(rng,2,3), n=1;
      for(var i=0;i<k;i++) n*=PR[ri(rng,0,4)];
      if(n>=60&&n<=420&&!isPrime(n)) return n;
    }
    return 180;
  }
  var st={ round:0, n:newN(), left:0, chips:[], tries:0, done:false, msg:'' };
  st.left=st.n;
  var wrap=document.createElement('div');
  wrap.className='iw section'; wrap.setAttribute('data-widget','factortree'); wrap.id='ftW';
  function tag(){ return '<div class="iw-tag">'+(ES?'Árbol de factores':'Factor tree')+'</div>'; }
  function render(){
    if(st.done){
      wrap.innerHTML=tag()+'<div class="rfb" style="color:var(--ok);font-weight:700">🎉 '+
        (ES?'Dos árboles completos. Cada número compuesto tiene una sola torre de primos.'
           :'Two complete trees. Every composite number has one single tower of primes.')+'</div>';
      return;
    }
    var toks=st.chips.map(function(p){ return '<span class="ftok">'+p+'</span>'; }).join('<span class="ftimes">×</span>');
    if(st.left>1) toks+=(st.chips.length?'<span class="ftimes">×</span>':'')+'<span class="ftok rest">'+st.left+'</span>';
    var btns=PR.map(function(p){ return '<div class="dchip" onclick="ftTap('+p+')">'+p+'</div>'; }).join('');
    wrap.innerHTML=tag()+
      '<div class="iw-round">'+(ES?'Árbol':'Tree')+' '+(st.round+1)+' / 2</div>'+
      '<div class="iw-instr">'+(ES?'Toca un primo para arrancarlo del número. Sigue hasta que no quede nada más que primos.'
                                  :'Tap a prime to pull it out of the number. Keep going until nothing but primes is left.')+'</div>'+
      '<div class="iw-big">'+st.n+'</div>'+
      '<div class="ftree">'+toks+'</div>'+
      '<div class="chiprow">'+btns+'</div>'+
      '<button class="rghost-btn" style="margin-left:0" onclick="ftReset()">'+(ES?'Empezar de nuevo':'Start over')+'</button>'+
      '<div class="rfb" id="ftFb">'+st.msg+'</div>';
  }
  function nextRound(delay){
    setTimeout(function(){
      st.round++;
      if(st.round>=2){ st.done=true; render(); return; }
      st.n=newN(); st.left=st.n; st.chips=[]; st.tries=0; st.msg=''; render();
    }, delay);
  }
  window.ftReset=function(){ if(st.done) return; st.chips=[]; st.left=st.n; st.msg=(ES?'Árbol vacío otra vez. Prueba otro camino.':'Empty tree again. Try another path.'); render(); };
  window.ftTap=function(p){
    if(st.done) return;
    if(st.left%p===0){
      st.chips.push(p); st.left=st.left/p;
      if(st.left===1){
        st.msg='<span style="color:var(--ok);font-weight:700">✓ '+st.n+' = '+facStr(st.n)+'</span>';
        render(); nextRound(1900); return;
      }
      st.msg=(ES?'Sí, '+p+' divide. Ahora te enfrentas a '+st.left+'.':'Yes, '+p+' divides. Now you are facing '+st.left+'.');
      render(); return;
    }
    st.tries++;
    if(st.tries>=3){
      st.chips=pfac(st.n); st.left=1;
      st.msg=(ES?'Mira el árbol terminado: ':'Look at the finished tree: ')+st.n+' = '+facStr(st.n)+'.';
      render(); nextRound(3000); return;
    }
    var pista;
    if(st.left%2===0) pista=(ES?st.left+' es par, así que el 2 sí entra.':st.left+' is even, so 2 does go in.');
    else if(dsum(st.left)%3===0) pista=(ES?'las cifras de '+st.left+' suman '+dsum(st.left)+'.':'the digits of '+st.left+' add up to '+dsum(st.left)+'.');
    else if(st.left%5===0) pista=(ES?st.left+' termina en 0 o en 5.':st.left+' ends in 0 or 5.');
    else pista=(ES?st.left+' es impar y sus cifras no suman múltiplo de 3, así que sube a primos mayores.'
                  :st.left+' is odd and its digits do not add to a multiple of 3, so move up to larger primes.');
    st.msg=(ES?p+' no cabe en '+st.left+': ':p+' does not fit into '+st.left+': ')+pista;
    render();
  };
  render();
  document.getElementById('lessonBody').appendChild(wrap);
}
/* ════════ WIDGET 3 - buscador del divisor común ════════ */
function buildGcdSlider(rng){
  var ES=(LANG==='es');
  function newPair(){
    for(var t=0;t<400;t++){
      var g=[4,6,8,9,12][ri(rng,0,4)], m=ri(rng,2,9), n=ri(rng,2,9);
      if(m===n||gcd2(m,n)!==1) continue;
      var a=g*m, b=g*n;
      if(a>=24&&b>=24&&a<=180&&b<=180) return [a,b,g];
    }
    return [48,36,12];
  }
  var st={ round:0, p:newPair(), d:1, tries:0, done:false, msg:'' };
  var wrap=document.createElement('div');
  wrap.className='iw section'; wrap.setAttribute('data-widget','gcdslider'); wrap.id='gcdW';
  function tag(){ return '<div class="iw-tag">'+(ES?'Buscador de divisores comunes':'Common divisor finder')+'</div>'; }
  function bar(x,d,cls){
    var r=x%d, full=x-r;
    return '<div class="glbl">'+x+'</div><div class="gbar"><div class="gline">'+
      '<div class="gfill '+cls+'" style="width:'+(full/x*100).toFixed(2)+'%"></div>'+
      (r>0?'<div class="gfill rem" style="width:'+(r/x*100).toFixed(2)+'%"></div>':'')+
      '</div></div>'+
      '<div class="glbl">'+(r===0?(ES?'cabe '+(x/d)+' veces exactas':'fits '+(x/d)+' times exactly')
                               :(ES?'caben '+Math.floor(x/d)+' y sobran '+r:Math.floor(x/d)+' fit and '+r+' is left over'))+'</div>';
  }
  function render(){
    if(st.done){
      wrap.innerHTML=tag()+'<div class="rfb" style="color:var(--ok);font-weight:700">🎉 '+
        (ES?'Encontraste el mayor divisor común en los dos casos.':'You found the greatest common divisor in both cases.')+'</div>';
      return;
    }
    var a=st.p[0], b=st.p[1], mx=Math.min(a,b);
    wrap.innerHTML=tag()+
      '<div class="iw-round">'+(ES?'Pareja':'Pair')+' '+(st.round+1)+' / 2</div>'+
      '<div class="iw-instr">'+(ES?'Mueve el deslizador. La parte roja es lo que sobra. Detente en el valor más grande que no deje nada rojo en ninguna de las dos barras.'
                                  :'Move the slider. The red part is what is left over. Stop at the largest value that leaves no red on either bar.')+'</div>'+
      '<div class="slrow"><input type="range" min="1" max="'+mx+'" value="'+st.d+'" oninput="gcdSlide(this.value)"><div class="slval">'+st.d+'</div></div>'+
      bar(a,st.d,'')+bar(b,st.d,'')+
      '<button class="rverify-btn" onclick="gcdCheck()">'+(ES?'Este es el mayor':'This is the greatest')+'</button>'+
      '<div class="rfb" id="gcdFb">'+st.msg+'</div>';
  }
  function nextRound(delay){
    setTimeout(function(){
      st.round++;
      if(st.round>=2){ st.done=true; render(); return; }
      st.p=newPair(); st.d=1; st.tries=0; st.msg=''; render();
    }, delay);
  }
  window.gcdSlide=function(v){
    st.d=parseInt(v,10);
    var a=st.p[0], b=st.p[1], oa=(a%st.d===0), ob=(b%st.d===0);
    st.msg=(oa&&ob)?(ES?st.d+' parte a los dos sin sobrantes.':st.d+' splits both with nothing left over.')
                   :(ES?st.d+' deja sobrantes en '+(!oa?a:b)+'.':st.d+' leaves a remainder in '+(!oa?a:b)+'.');
    render();
  };
  window.gcdCheck=function(){
    if(st.done) return;
    var a=st.p[0], b=st.p[1], g=st.p[2], d=st.d;
    if(d===g){
      st.msg='<span style="color:var(--ok);font-weight:700">✓ '+(ES?d+' es el mayor que parte a '+a+' y a '+b+' sin sobrantes.'
                                                                  :d+' is the largest that splits '+a+' and '+b+' with nothing left over.')+'</span>';
      render(); nextRound(1800); return;
    }
    st.tries++;
    if(st.tries>=3){
      st.d=g;
      st.msg=(ES?'Observa: con '+g+' las dos barras quedan limpias y ningún valor mayor lo logra.'
                :'Look: with '+g+' both bars come out clean, and no larger value does that.');
      render(); nextRound(3000); return;
    }
    if(a%d!==0||b%d!==0) st.msg=(ES?'Todavía hay rojo en '+(a%d!==0?a:b)+'. Un divisor común debe dejar limpias las dos barras.'
                                   :'There is still red on '+(a%d!==0?a:b)+'. A common divisor must leave both bars clean.');
    else st.msg=(ES?d+' sí parte a los dos, pero hay uno más grande que también lo hace. Sube el deslizador.'
                   :d+' does split both, but a larger one does too. Push the slider up.');
    render();
  };
  render();
  document.getElementById('lessonBody').appendChild(wrap);
}

/* ════════ WIDGET 4 - saltos en la recta numérica ════════ */
function buildLcmLine(rng){
  var ES=(LANG==='es');
  function newPair(){
    for(var t=0;t<400;t++){
      var a=ri(rng,3,8), b=ri(rng,4,9);
      if(a===b) continue;
      var l=lcm2(a,b);
      if(l>=12&&l<=36) return [Math.min(a,b),Math.max(a,b),l];
    }
    return [4,6,12];
  }
  var st={ round:0, p:newPair(), tries:0, done:false, msg:'', pickPos:null, show:false };
  var wrap=document.createElement('div');
  wrap.className='iw section'; wrap.setAttribute('data-widget','lcmline'); wrap.id='lcmW';
  function tag(){ return '<div class="iw-tag">'+(ES?'Saltos en la recta':'Hops on the line')+'</div>'; }
  function render(){
    if(st.done){
      wrap.innerHTML=tag()+'<div class="rfb" style="color:var(--ok);font-weight:700">🎉 '+
        (ES?'Los dos saltadores se encontraron donde tenían que encontrarse.':'The two hoppers met exactly where they had to meet.')+'</div>';
      return;
    }
    var a=st.p[0], b=st.p[1], l=st.p[2], top=Math.min(l+Math.max(a,b), 44);
    var cells='';
    for(var i=0;i<=top;i++){
      var cls='ncell';
      if(st.pickPos===i) cls+=(i===l?' picked':' pickw');
      if(st.show&&i===l) cls+=' hitAB';
      cells+='<div class="'+cls+'" onclick="lcmTap('+i+')">'+
        '<div class="hopA" style="color:var(--green)">'+(i>0&&i%a===0?'●':'')+'</div>'+
        '<div class="hopB" style="color:var(--gold)">'+(i>0&&i%b===0?'▲':'')+'</div>'+
        '<div>'+i+'</div></div>';
    }
    wrap.innerHTML=tag()+
      '<div class="iw-round">'+(ES?'Ronda':'Round')+' '+(st.round+1)+' / 2</div>'+
      '<div class="iw-instr">'+(ES?'Un saltador avanza de '+a+' en '+a+' (●) y el otro de '+b+' en '+b+' (▲). Los dos salen del 0. Toca la casilla donde se encuentran por primera vez.'
                                  :'One hopper moves '+a+' at a time (●) and the other '+b+' at a time (▲). Both start at 0. Tap the square where they first meet.')+'</div>'+
      '<div class="nlwrap"><div class="nline">'+cells+'</div></div>'+
      '<div class="legend"><span style="color:var(--green)">● '+(ES?'saltos de ':'hops of ')+a+'</span><span style="color:var(--gold)">▲ '+(ES?'saltos de ':'hops of ')+b+'</span></div>'+
      '<div class="rfb" id="lcmFb">'+st.msg+'</div>';
  }
  function nextRound(delay){
    setTimeout(function(){
      st.round++;
      if(st.round>=2){ st.done=true; render(); return; }
      st.p=newPair(); st.tries=0; st.msg=''; st.pickPos=null; st.show=false; render();
    }, delay);
  }
  window.lcmTap=function(i){
    if(st.done||st.show) return;
    var a=st.p[0], b=st.p[1], l=st.p[2];
    st.pickPos=i;
    if(i===l){
      st.msg='<span style="color:var(--ok);font-weight:700">✓ '+(ES?'Ahí caen los dos por primera vez: '+l+'.':'That is where both first land: '+l+'.')+'</span>';
      render(); nextRound(1800); return;
    }
    st.tries++;
    if(st.tries>=3){
      st.show=true; st.pickPos=null;
      st.msg=(ES?'El primer encuentro es '+l+': ahí coinciden ● y ▲.':'The first meeting point is '+l+': ● and ▲ land together there.');
      render(); nextRound(3000); return;
    }
    if(i===0) st.msg=(ES?'Los dos salen del 0; buscamos el primer encuentro después de la salida.':'Both start at 0; we want the first meeting after the start.');
    else if(i%a===0&&i%b===0) st.msg=(ES?'Ahí sí coinciden, pero se habían encontrado antes. Regresa a la izquierda.':'They do meet there, but they had met earlier. Move back to the left.');
    else if(i%a===0) st.msg=(ES?'En '+i+' solo cae ●. Al ▲ le falta llegar.':'Only ● lands on '+i+'. The ▲ does not reach it.');
    else if(i%b===0) st.msg=(ES?'En '+i+' solo cae ▲. El ● pasa de largo.':'Only ▲ lands on '+i+'. The ● skips past it.');
    else st.msg=(ES?'En '+i+' no cae ninguno de los dos.':'Neither hopper lands on '+i+'.');
    render();
  };
  render();
  document.getElementById('lessonBody').appendChild(wrap);
}

/* ════════ LESSON ════════ */
function buildLesson(rng) {
  var ES=(LANG==='es');
  function L(es,en){ return ES?es:en; }
  var CRIT={
    2: L('la última cifra es par','the last digit is even'),
    3: L('la suma de sus cifras es múltiplo de 3','its digit sum is a multiple of 3'),
    4: L('sus dos últimas cifras forman un múltiplo de 4','its last two digits form a multiple of 4'),
    5: L('termina en 0 o en 5','it ends in 0 or 5'),
    6: L('pasa la prueba del 2 y la del 3','it passes the test for 2 and the one for 3'),
    9: L('la suma de sus cifras es múltiplo de 9','its digit sum is a multiple of 9'),
    10: L('termina en 0','it ends in 0')
  };

  /* ── Concepto 1 ── */
  addSection(L('Concepto 1','Concept 1'), L('Divisibilidad: decidir sin dividir','Divisibility: deciding without dividing'),
    '<p>'+L('Decir que 138 es divisible entre 3 significa que al repartirlo en grupos de 3 no sobra nada. Para saberlo no hace falta hacer la división: cada divisor deja una huella visible en las cifras del número.',
            'Saying that 138 is divisible by 3 means that splitting it into groups of 3 leaves nothing over. You do not need to do the division to know: each divisor leaves a visible trace in the digits of the number.')+'</p>'+
    '<div class="rules-grid">'+
      [2,3,4,5,6,9,10].map(function(d){
        return '<div class="rcard"><div class="rname">'+L('divisible entre ','divisible by ')+d+'</div>'+
               '<div class="rform">'+CRIT[d]+'</div>'+
               '<div class="rnote">'+L('ejemplo: ','example: ')+({2:'138',3:'138',4:'116',5:'145',6:'138',9:'153',10:'150'})[d]+'</div></div>';
      }).join('')+
    '</div>'+
    '<div class="callout"><p>'+L('Un residuo distinto de cero significa que el reparto no es exacto. Los criterios solo cambian el trabajo de dividir por el de mirar cifras.',
                                 'A remainder other than zero means the sharing is not exact. The tests simply swap the work of dividing for the work of looking at digits.')+'</p></div>');
  buildDivMachine(rng);

  /* ── P1 ── */
  var DIVS=[2,3,4,5,6,9,10];
  if(rng()<0.5){
    var n1=468, D1=[], N1=[];
    for(var t1=0;t1<500;t1++){
      n1=ri(rng,112,988); D1=[]; N1=[];
      DIVS.forEach(function(d){ (n1%d===0?D1:N1).push(d); });
      if(D1.length>=1&&N1.length>=3) break;
    }
    var c1=D1[Math.floor(rng()*D1.length)];
    var ds1=shuffle(N1,rng).slice(0,3);
    addProblem({ title:L('La prueba rápida','The quick test'), showWork:false,
      q:L('Tienes el número '+n1+'. ¿Cuál de estos números lo divide sin dejar residuo?',
          'You are given the number '+n1+'. Which of these divides it with no remainder?'),
      opts:fourOpts(c1, ds1), correct:c1,
      hint:L('Revisa la última cifra y también la suma de todas las cifras antes de decidir.',
             'Check the last digit and also the sum of all the digits before deciding.'),
      exp:L(n1+' es divisible entre '+c1+' porque '+CRIT[c1]+'. Los otros tres dejan residuo.',
            n1+' is divisible by '+c1+' because '+CRIT[c1]+'. The other three leave a remainder.') }, rng);
  } else {
    var base=ri(rng,40,300);
    var m3=[3*base, 3*(base+7), 3*(base+15)];
    var odd1=3*(base+11)+ (rng()<0.5?1:2);
    var opts1=m3.map(String); opts1.push(String(odd1));
    addProblem({ title:L('El intruso','The odd one out'), showWork:false,
      q:L('Cuatro números pasaron por la caja registradora. ¿Cuál de ellos NO es divisible entre 3?',
          'Four numbers went through the cash register. Which one is NOT divisible by 3?'),
      opts:opts1, correct:odd1,
      hint:L('Suma las cifras de cada número y observa cuál de esas sumas no llega a un múltiplo de 3.',
             'Add up the digits of each number and see which of those sums is not a multiple of 3.'),
      exp:L('Las cifras de '+odd1+' suman '+dsum(odd1)+', que no es múltiplo de 3. En los otros tres la suma sí lo es.',
            'The digits of '+odd1+' add up to '+dsum(odd1)+', which is not a multiple of 3. In the other three the sum is.') }, rng);
  }

  /* ── P2 ── */
  if(rng()<0.5){
    var a2=ri(rng,1,9), c2=ri(rng,0,9), guard=0;
    while((a2+c2)%9===0&&guard<20){ c2=ri(rng,0,9); guard++; }
    if((a2+c2)%9===0) a2=(a2===9?8:a2+1);
    var x2=9-((a2+c2)%9);
    var cand2=[(x2+1)%10,(x2+3)%10,(x2+5)%10,(x2+7)%10,(x2+2)%10].filter(function(v){ return v!==x2; });
    addProblem({ title:L('La cifra que falta','The missing digit'), showWork:false,
      q:L('Al número '+a2+'&#9633;'+c2+' se le borró la cifra de en medio. ¿Qué cifra debe ir en el recuadro para que el número sea divisible entre 9?',
          'The middle digit of '+a2+'&#9633;'+c2+' was erased. Which digit belongs in the box so that the number is divisible by 9?'),
      opts:fourOpts(x2, cand2), correct:x2,
      hint:L('Un número es divisible entre 9 cuando la suma de sus cifras es múltiplo de 9: suma las dos cifras visibles y mira cuánto le falta.',
             'A number is divisible by 9 when its digit sum is a multiple of 9: add the two visible digits and see how much is missing.'),
      exp:L('Las cifras visibles suman '+(a2+c2)+'. Para llegar a '+(a2+c2+x2)+', que sí es múltiplo de 9, falta '+x2+'.',
            'The visible digits add up to '+(a2+c2)+'. To reach '+(a2+c2+x2)+', which is a multiple of 9, '+x2+' is missing.') }, rng);
  } else {
    var k2=ri(rng,3,27), n36=36*k2;
    var d4=4*ri(rng,26,60); while(d4%9===0||d4===n36) d4+=4;
    var d9=9*ri(rng,12,26); while(d9%4===0||d9===n36) d9+=9;
    var d6=6*ri(rng,18,40); while(d6%4===0||d6%9===0||d6===n36) d6+=6;
    addProblem({ title:L('Doble condición','Double condition'), showWork:false,
      q:L('¿Cuál de estos números cumple al mismo tiempo con ser divisible entre 4 y entre 9?',
          'Which of these numbers is divisible by 4 and by 9 at the same time?'),
      opts:[String(n36),String(d4),String(d9),String(d6)], correct:n36,
      hint:L('Aplica las dos pruebas por separado a cada número: primero las dos últimas cifras, después la suma de todas.',
             'Apply the two tests separately to each number: first the last two digits, then the sum of all of them.'),
      exp:L(n36+' pasa las dos pruebas: sus dos últimas cifras forman un múltiplo de 4 y sus cifras suman '+dsum(n36)+'. Cada uno de los otros pasa solo una prueba.',
            n36+' passes both tests: its last two digits form a multiple of 4 and its digits add up to '+dsum(n36)+'. Each of the others passes only one test.') }, rng);
  }

  /* ── Concepto 2 ── */
  addSection(L('Concepto 2','Concept 2'), L('Primos: las piezas que ya no se parten','Primes: the pieces that cannot be split'),
    '<p>'+L('Un número primo tiene exactamente dos divisores: el 1 y él mismo. Un número compuesto tiene más, así que siempre se puede partir en piezas más chicas. El 1 no es primo ni compuesto porque solo tiene un divisor.',
            'A prime number has exactly two divisors: 1 and itself. A composite number has more, so it can always be broken into smaller pieces. The number 1 is neither prime nor composite because it has only one divisor.')+'</p>'+
    '<div class="callout"><p><strong>'+L('Lo importante','The key idea')+':</strong> '+
      L('cada número compuesto se escribe como producto de primos de una sola forma, sin importar por dónde empieces a partirlo. Esa lista de primos es su huella digital, y de ella salen el MCD y el MCM.',
        'every composite number can be written as a product of primes in one single way, no matter where you start breaking it up. That list of primes is its fingerprint, and both the GCD and the LCM come out of it.')+'</p></div>');
  buildFactorTree(rng);

  /* ── P3 ── */
  var PRIMES=[53,59,61,67,71,73,79,83,89,97,101,103,107,109,113,127,131,137,139,149];
  var COMPS=[51,57,87,91,111,117,119,121,133,143,147,161,169,187,203,209];
  if(rng()<0.5){
    var pr3=pick(PRIMES,rng), cs3=shuffle(COMPS,rng).slice(0,3);
    addProblem({ title:L('Indivisible','Unbreakable'), showWork:false,
      q:L('¿Cuál de estos cuatro números es primo?','Which of these four numbers is prime?'),
      opts:[String(pr3)].concat(cs3.map(String)), correct:pr3,
      hint:L('Un número es primo si ningún primo menor o igual a su raíz cuadrada lo divide: basta probar con 2, 3, 5, 7, 11 y 13.',
             'A number is prime if no prime up to its square root divides it: testing 2, 3, 5, 7, 11 and 13 is enough.'),
      exp:L(pr3+' no se deja dividir por ningún primo pequeño. En cambio '+cs3[0]+' = '+facStr(cs3[0])+', '+cs3[1]+' = '+facStr(cs3[1])+' y '+cs3[2]+' = '+facStr(cs3[2])+'.',
            pr3+' is not divisible by any small prime. By contrast '+cs3[0]+' = '+facStr(cs3[0])+', '+cs3[1]+' = '+facStr(cs3[1])+' and '+cs3[2]+' = '+facStr(cs3[2])+'.') }, rng);
  } else {
    var cp3=pick(COMPS,rng), ps3=shuffle(PRIMES,rng).slice(0,3);
    addProblem({ title:L('Se puede partir','It can be split'), showWork:false,
      q:L('¿Cuál de estos cuatro números es compuesto?','Which of these four numbers is composite?'),
      opts:[String(cp3)].concat(ps3.map(String)), correct:cp3,
      hint:L('Busca un divisor distinto de 1 y del propio número probando los primos pequeños en orden.',
             'Look for a divisor other than 1 and the number itself by testing the small primes in order.'),
      exp:L(cp3+' = '+facStr(cp3)+', así que tiene más de dos divisores. Los otros tres solo se dividen entre 1 y ellos mismos.',
            cp3+' = '+facStr(cp3)+', so it has more than two divisors. The other three are divisible only by 1 and themselves.') }, rng);
  }

  /* ── P4 ── */
  var n4=1, guard4=0;
  do { n4=Math.pow(2,ri(rng,1,4))*Math.pow(3,ri(rng,0,2))*Math.pow(5,ri(rng,0,1))*Math.pow(7,rng()<0.3?1:0); guard4++; }
  while((n4<90||n4>700||expMap(n4).length<2)&&guard4<60);
  if(n4<90||n4>700||expMap(n4).length<2) n4=360;
  var m4=expMap(n4), cands4=[];
  m4.forEach(function(pair,idx){
    var cl=m4.map(function(x){ return [x[0],x[1]]; }); cl[idx][1]+=1; cands4.push(mapStr(cl));
  });
  var swap4=m4.map(function(x){ return [x[0],x[1]]; });
  swap4[swap4.length-1]=[[2,3,5,7,11,13].filter(function(p){ return !m4.some(function(x){ return x[0]===p; }); })[0]||11, swap4[swap4.length-1][1]];
  cands4.push(mapStr(swap4));
  var sw4=m4.map(function(x){ return [x[0],x[1]]; });
  if(sw4[0][1]!==sw4[sw4.length-1][1]){
    var tmp4=sw4[0][1]; sw4[0][1]=sw4[sw4.length-1][1]; sw4[sw4.length-1][1]=tmp4;
  } else { sw4[0][1]+=2; }
  cands4.push(mapStr(sw4));
  addProblem({ title:L('La huella de un número','A number fingerprint'), showWork:true,
    q:L('Escribe '+n4+' como producto de números primos y elige la descomposición que le corresponde.',
        'Write '+n4+' as a product of prime numbers and choose the decomposition that matches it.'),
    opts:[facStr(n4)].concat(shuffle(cands4,rng).slice(0,3)), correct:facStr(n4),
    hint:L('Divide entre el primo más pequeño que quepa, repite con el resultado y anota cuántas veces usaste cada primo.',
           'Divide by the smallest prime that fits, repeat with the result, and record how many times you used each prime.'),
    exp:L(n4+' = '+facStr(n4)+'. Si multiplicas los factores de las otras opciones no obtienes '+n4+'.',
          n4+' = '+facStr(n4)+'. Multiplying the factors of the other options does not give '+n4+'.') }, rng);

  /* ── Concepto 3 ── */
  addSection(L('Concepto 3','Concept 3'), L('Máximo común divisor: la pieza más grande que le sirve a los dos','Greatest common divisor: the largest piece that fits both'),
    '<p>'+L('Dos números comparten varios divisores. El máximo común divisor es el más grande de esos divisores compartidos, y es el que aparece cuando algo debe repartirse en partes iguales sin que sobre nada.',
            'Two numbers share several divisors. The greatest common divisor is the largest of those shared divisors, and it is the one that shows up whenever something must be split into equal parts with nothing left over.')+'</p>'+
    '<div class="callout"><p>'+L('En la descomposición en primos, el MCD junta solo los primos que aparecen en ambos números, cada uno con el exponente más pequeño de los dos.',
                                 'In the prime decomposition, the GCD gathers only the primes that appear in both numbers, each with the smaller of the two exponents.')+'</p></div>');
  buildGcdSlider(rng);

  /* ── P5 ── */
  var g5=[6,8,9,12,14,15,18][ri(rng,0,6)], m5=ri(rng,2,9), k5=ri(rng,2,9), gd5=0;
  while(m5===k5||gcd2(m5,k5)!==1){ m5=ri(rng,2,9); k5=ri(rng,2,9); if(++gd5>60){ m5=2; k5=3; break; } }
  var a5=g5*m5, b5=g5*k5;
  var cands5=[commonMaxExp(a5,b5), Math.abs(a5-b5), Math.min(a5,b5), lcm2(a5,b5), g5*2, Math.floor(g5/2)]
    .filter(function(v){ return v!==g5&&v>1; });
  if(rng()<0.5){
    addProblem({ title:L('El divisor más grande','The largest divisor'), showWork:true,
      q:L('Calcula el máximo común divisor de '+a5+' y '+b5+'.','Work out the greatest common divisor of '+a5+' and '+b5+'.'),
      opts:fourOpts(g5, cands5), correct:g5,
      hint:L('Descompón los dos números en primos y toma solo los primos comunes, cada uno con el exponente menor.',
             'Break both numbers into primes and keep only the common primes, each with the smaller exponent.'),
      exp:L(a5+' = '+facStr(a5)+' y '+b5+' = '+facStr(b5)+', de modo que el MCD es '+g5+'.',
            a5+' = '+facStr(a5)+' and '+b5+' = '+facStr(b5)+', so the GCD is '+g5+'.') }, rng);
  } else {
    var wrong5=cands5[0];
    addProblem({ title:L('Revisa el cálculo','Check the calculation'), showWork:true,
      q:L('Un compañero afirma que el máximo común divisor de '+a5+' y '+b5+' es '+wrong5+'. ¿Cuál es el valor correcto?',
          'A classmate claims that the greatest common divisor of '+a5+' and '+b5+' is '+wrong5+'. What is the correct value?'),
      opts:fourOpts(g5, cands5), correct:g5,
      hint:L('Comprueba que el candidato divida a los dos números y, si lo hace, busca todavía uno mayor que también los divida.',
             'Check that the candidate divides both numbers, and if it does, look for an even larger one that also divides them.'),
      exp:L(a5+' = '+facStr(a5)+' y '+b5+' = '+facStr(b5)+'. El mayor divisor compartido es '+g5+'.',
            a5+' = '+facStr(a5)+' and '+b5+' = '+facStr(b5)+'. The largest shared divisor is '+g5+'.') }, rng);
  }

  /* ── P6 ── */
  var g6=[8,12,15,16,18,24][ri(rng,0,5)], m6=ri(rng,3,9), k6=ri(rng,3,9), gd6=0;
  while(m6===k6||gcd2(m6,k6)!==1){ m6=ri(rng,3,9); k6=ri(rng,3,9); if(++gd6>60){ m6=3; k6=4; break; } }
  var a6=g6*m6, b6=g6*k6;
  if(rng()<0.5){
    addProblem({ title:L('Cortes sin desperdicio','Cuts with no waste'), showWork:true,
      q:L('En un taller hay dos rollos de listón, uno de '+a6+' cm y otro de '+b6+' cm. Se quieren cortar tramos iguales, lo más largos posible, sin que sobre listón de ninguno de los dos rollos. ¿Cuánto mide cada tramo?',
          'A workshop has two ribbon rolls, one '+a6+' cm long and the other '+b6+' cm long. They want to cut equal pieces, as long as possible, with no ribbon left over from either roll. How long is each piece?'),
      opts:fourOpts(g6, [commonMaxExp(a6,b6), Math.abs(a6-b6), Math.floor(g6/2), lcm2(a6,b6), g6*2].filter(function(v){ return v!==g6&&v>1; })),
      correct:g6, fn:L('Longitud en centímetros','Length in centimetres'),
      hint:L('La medida del tramo debe dividir a las dos longitudes, y entre todas esas medidas te piden la mayor.',
             'The piece length must divide both lengths, and among all those lengths you are asked for the largest.'),
      exp:L('Como '+a6+' = '+facStr(a6)+' y '+b6+' = '+facStr(b6)+', el tramo mayor posible mide '+g6+' cm.',
            'Since '+a6+' = '+facStr(a6)+' and '+b6+' = '+facStr(b6)+', the longest possible piece is '+g6+' cm.') }, rng);
  } else {
    var tot6=m6+k6;
    addProblem({ title:L('Cuántos tramos salen','How many pieces come out'), showWork:true,
      q:L('Dos cables miden '+a6+' cm y '+b6+' cm. Se cortan en tramos iguales del mayor tamaño posible sin que sobre nada. ¿Cuántos tramos se obtienen en total entre los dos cables?',
          'Two cables measure '+a6+' cm and '+b6+' cm. They are cut into equal pieces of the largest possible size with nothing left over. How many pieces are obtained in total from the two cables?'),
      opts:fourOpts(tot6, [m6, k6, g6, m6*k6, tot6+1].filter(function(v){ return v!==tot6&&v>0; })),
      correct:tot6,
      hint:L('Primero encuentra la medida del tramo, después divide cada cable entre esa medida y suma los resultados.',
             'First find the piece length, then divide each cable by that length and add the results.'),
      exp:L('El tramo mayor mide '+g6+' cm: '+a6+' da '+m6+' tramos y '+b6+' da '+k6+', en total '+tot6+'.',
            'The longest piece is '+g6+' cm: '+a6+' gives '+m6+' pieces and '+b6+' gives '+k6+', so '+tot6+' in total.') }, rng);
  }

  /* ── Concepto 4 ── */
  addSection(L('Concepto 4','Concept 4'), L('Mínimo común múltiplo: el primer reencuentro','Least common multiple: the first reunion'),
    '<p>'+L('Los múltiplos de dos números avanzan a distinto ritmo, pero tarde o temprano coinciden. El mínimo común múltiplo es la primera coincidencia después del cero, y aparece cuando dos ciclos que empiezan juntos deben volver a empezar juntos.',
            'The multiples of two numbers advance at different rates, but sooner or later they coincide. The least common multiple is the first coincidence after zero, and it shows up when two cycles that start together must start together again.')+'</p>'+
    '<div class="callout"><p>'+L('Con la descomposición en primos el MCM toma todos los primos que aparecen en cualquiera de los dos números, cada uno con el exponente más grande. Además, MCD por MCM siempre da el producto de los dos números.',
                                 'With the prime decomposition, the LCM takes every prime that appears in either number, each with the larger exponent. On top of that, GCD times LCM always equals the product of the two numbers.')+'</p></div>');
  buildLcmLine(rng);

  /* ── P7 ── */
  var g7=[2,3,4,6][ri(rng,0,3)], m7=ri(rng,3,9), k7=ri(rng,3,9), gd7=0;
  while(m7===k7||gcd2(m7,k7)!==1){ m7=ri(rng,3,9); k7=ri(rng,3,9); if(++gd7>60){ m7=3; k7=5; break; } }
  var a7=g7*m7, b7=g7*k7, l7=lcm2(a7,b7);
  addProblem({ title:L('El primer múltiplo compartido','The first shared multiple'), showWork:true,
    q:L('Calcula el mínimo común múltiplo de '+a7+' y '+b7+'.','Work out the least common multiple of '+a7+' and '+b7+'.'),
    opts:fourOpts(l7, [a7*b7, l7*2, Math.floor(l7/2), g7*a7, a7+b7].filter(function(v){ return v!==l7&&v>0; })),
    correct:l7,
    hint:L('Toma todos los primos que aparezcan en cualquiera de los dos, cada uno con su exponente mayor, o divide el producto entre el máximo común divisor.',
           'Take every prime that appears in either number, each with its larger exponent, or divide the product by the greatest common divisor.'),
    exp:L(a7+' = '+facStr(a7)+' y '+b7+' = '+facStr(b7)+', así que el MCM es '+l7+'. Su producto '+(a7*b7)+' es un múltiplo común, pero no el menor.',
          a7+' = '+facStr(a7)+' and '+b7+' = '+facStr(b7)+', so the LCM is '+l7+'. Their product '+(a7*b7)+' is a common multiple, but not the least one.') }, rng);

  /* ── Cierre ── */
  addSection(L('Cierre','Wrap-up'), L('Ponlo todo junto','Put it all together'),
    '<p>'+L('Las siguientes situaciones no dicen qué herramienta usar. Decídelo tú a partir de lo que se pregunta.',
            'The following situations do not say which tool to use. Decide that yourself from what is being asked.')+'</p>');

  /* ── P8 ── */
  var a8=[6,8,9,10,12,14,15][ri(rng,0,6)], b8=[8,9,10,12,15,18,20][ri(rng,0,6)], gd8=0;
  while(a8===b8||lcm2(a8,b8)>200){ b8=[8,9,10,12,15,18,20][ri(rng,0,6)]; if(++gd8>40){ b8=(a8===12?18:12); break; } }
  var l8=lcm2(a8,b8);
  if(rng()<0.5){
    addProblem({ title:L('Vuelven a salir juntos','Leaving together again'), showWork:true,
      q:L('Dos rutas de transporte salen de la misma terminal a las 6:00 en punto. Una sale cada '+a8+' minutos y la otra cada '+b8+' minutos. ¿Cuántos minutos después de las 6:00 vuelven a salir las dos al mismo tiempo?',
          'Two transport routes leave the same terminal at exactly 6:00. One leaves every '+a8+' minutes and the other every '+b8+' minutes. How many minutes after 6:00 do both leave at the same time again?'),
      opts:fourOpts(l8, [a8*b8, a8+b8, gcd2(a8,b8), Math.floor(l8/2), l8*2].filter(function(v){ return v!==l8&&v>0; })),
      correct:l8, fn:L('Tiempo en minutos','Time in minutes'),
      hint:L('Busca el primer número que sea múltiplo de los dos intervalos a la vez.',
             'Look for the first number that is a multiple of both intervals at once.'),
      exp:L('El primer momento compartido es '+l8+' minutos, porque '+l8+' es múltiplo de '+a8+' y de '+b8+' y ningún número menor lo es.',
            'The first shared moment is '+l8+' minutes, because '+l8+' is a multiple of '+a8+' and of '+b8+' and no smaller number is.') }, rng);
  } else {
    var veces8=ri(rng,3,5), seg8=l8*veces8+ri(rng,0,Math.max(0,l8-1));
    addProblem({ title:L('Cuántas coincidencias','How many coincidences'), showWork:true,
      q:L('Dos letreros luminosos se encienden al mismo tiempo al abrir la tienda. Uno se enciende cada '+a8+' segundos y el otro cada '+b8+' segundos. Sin contar el encendido inicial, ¿cuántas veces se encienden juntos durante los primeros '+seg8+' segundos?',
          'Two light signs switch on at the same time when the shop opens. One switches on every '+a8+' seconds and the other every '+b8+' seconds. Not counting the initial switch-on, how many times do they light up together during the first '+seg8+' seconds?'),
      opts:fourOpts(veces8, [veces8+1, Math.max(1,veces8-1), l8, Math.floor(seg8/a8), veces8+2].filter(function(v){ return v!==veces8&&v>0; })),
      correct:veces8, fn:L('Número de coincidencias','Number of coincidences'),
      hint:L('Encuentra cada cuántos segundos coinciden y después cuenta cuántas veces cabe ese lapso en el tiempo total.',
             'Find how often they coincide and then count how many times that gap fits into the total time.'),
      exp:L('Coinciden cada '+l8+' segundos, y en '+seg8+' segundos eso ocurre '+veces8+' veces.',
            'They coincide every '+l8+' seconds, and in '+seg8+' seconds that happens '+veces8+' times.') }, rng);
  }

  /* ── P9 ── */
  var g9=[4,6,8,9,12][ri(rng,0,4)], m9=ri(rng,2,9), k9=ri(rng,2,9), gd9=0;
  while(m9===k9||gcd2(m9,k9)!==1){ m9=ri(rng,2,9); k9=ri(rng,2,9); if(++gd9>60){ m9=2; k9=5; break; } }
  var a9=g9*m9, b9=g9*k9, prod9=a9*b9, l9=lcm2(a9,b9);
  if(rng()<0.5){
    addProblem({ title:L('Del producto al múltiplo','From the product to the multiple'), showWork:true,
      q:L('De dos números se sabe que su producto es '+prod9+' y que su máximo común divisor es '+g9+'. ¿Cuál es su mínimo común múltiplo?',
          'Two numbers are known to have product '+prod9+' and greatest common divisor '+g9+'. What is their least common multiple?'),
      opts:fourOpts(l9, [prod9, Math.floor(prod9/(g9*g9)), l9*2, Math.floor(l9/2), prod9-g9].filter(function(v){ return v!==l9&&v>0; })),
      correct:l9,
      hint:L('El producto de dos números siempre es igual al producto de su máximo común divisor por su mínimo común múltiplo.',
             'The product of two numbers always equals their greatest common divisor times their least common multiple.'),
      exp:L('De '+prod9+' = '+g9+' × MCM se obtiene MCM = '+l9+'.',
            'From '+prod9+' = '+g9+' × LCM we get LCM = '+l9+'.') }, rng);
  } else {
    addProblem({ title:L('Del múltiplo al producto','From the multiple to the product'), showWork:true,
      q:L('Dos números tienen mínimo común múltiplo '+l9+' y máximo común divisor '+g9+'. ¿Cuánto vale el producto de esos dos números?',
          'Two numbers have least common multiple '+l9+' and greatest common divisor '+g9+'. What is the product of those two numbers?'),
      opts:fourOpts(prod9, [l9+g9, l9*2, Math.floor(l9/g9), prod9*2, l9-g9].filter(function(v){ return v!==prod9&&v>0; })),
      correct:prod9,
      hint:L('El máximo común divisor multiplicado por el mínimo común múltiplo devuelve siempre el producto de los dos números.',
             'The greatest common divisor multiplied by the least common multiple always gives back the product of the two numbers.'),
      exp:L(g9+' × '+l9+' = '+prod9+', que es el producto buscado.',
            g9+' × '+l9+' = '+prod9+', which is the product asked for.') }, rng);
  }

  /* ── P10 ── */
  if(rng()<0.5){
    var cop=[[8,15],[9,16],[14,15],[10,21],[12,25],[9,20],[16,21],[15,22]][ri(rng,0,7)];
    var noncop=[[12,18],[14,21],[16,20],[15,24],[18,27],[20,30],[21,28],[24,36]];
    var nc=shuffle(noncop,rng).slice(0,3);
    var fmt=function(p){ return p[0]+L(' y ',' and ')+p[1]; };
    addProblem({ title:L('Sin nada en común','Nothing in common'), showWork:false,
      q:L('¿Cuál de estas parejas de números tiene al 1 como único divisor común?',
          'Which of these pairs of numbers has 1 as its only common divisor?'),
      opts:[fmt(cop)].concat(nc.map(fmt)), correct:fmt(cop),
      hint:L('Descompón cada pareja en primos y observa cuál de ellas no comparte ningún primo.',
             'Break each pair into primes and see which one shares no prime at all.'),
      exp:L(cop[0]+' = '+facStr(cop[0])+' y '+cop[1]+' = '+facStr(cop[1])+': no comparten ningún primo, así que su máximo común divisor es 1. Las demás parejas comparten al menos un factor.',
            cop[0]+' = '+facStr(cop[0])+' and '+cop[1]+' = '+facStr(cop[1])+': they share no prime, so their greatest common divisor is 1. The other pairs share at least one factor.') }, rng);
  } else {
    var e10=ri(rng,2,3), f10=ri(rng,1,2), q10=[5,7,11][ri(rng,0,2)];
    var n10=Math.pow(2,e10)*Math.pow(3,f10)*q10;
    var bad10=Math.pow(2,e10+1);
    var good10=[Math.pow(2,e10), 2*Math.pow(3,f10), 2*q10];
    addProblem({ title:L('Quién no cabe','Which one does not fit'), showWork:false,
      q:L('El número '+n10+' se descompone como '+facStr(n10)+'. ¿Cuál de estos números NO es divisor de '+n10+'?',
          'The number '+n10+' decomposes as '+facStr(n10)+'. Which of these numbers is NOT a divisor of '+n10+'?'),
      opts:[String(bad10)].concat(good10.map(String)), correct:bad10,
      hint:L('Un divisor solo puede usar los primos de la descomposición y nunca con un exponente mayor al que aparece ahí.',
             'A divisor can only use the primes in the decomposition, and never with an exponent larger than the one shown there.'),
      exp:L(bad10+' = 2'+sup(e10+1)+', pero en '+n10+' el 2 aparece solo '+e10+' veces, así que no cabe. Los otros tres sí se forman con los primos disponibles.',
            bad10+' = 2'+sup(e10+1)+', but in '+n10+' the 2 appears only '+e10+' times, so it does not fit. The other three are built from the available primes.') }, rng);
  }
}
</script>

<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbzLGV15JRTPs9bbSvHRLfgOXeT9oUExDf1AH546WOwq5tYxXSdhX212OWi_bTJfMGx9/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'Divisibilidad, Números Primos, MCD y MCM';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
