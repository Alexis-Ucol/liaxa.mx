<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Probabilidad Frecuencial y Teórica</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }

/* ── GUIDE WIDGETS (probabilidad frecuencial y teorica) ── */
.iw-tag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.4rem; }
.iw-box { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; padding:1rem; }
.iw-sub { font-size:.88rem; color:var(--text2); margin-bottom:.7rem; }
.rondas { font-family:'IBM Plex Mono',monospace; font-size:.7rem; color:var(--text3); letter-spacing:.08em; text-transform:uppercase; margin-bottom:.45rem; }
.rfb { font-size:.84rem; margin-top:.6rem; min-height:1.35rem; color:var(--text2); }
.rfb b { color:var(--green-dark); }
.okmsg { color:var(--ok); font-weight:700; }
.rverify-btn { background:var(--green); color:#fff; border:none; border-radius:8px; padding:.6rem 1.2rem; font-size:.86rem; font-weight:600; cursor:pointer; min-height:44px; margin-top:.7rem; font-family:inherit; }
.rverify-btn:hover { background:var(--green-dark); }
.goalbar { font-size:.83rem; color:var(--text2); background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.45rem .7rem; margin-bottom:.65rem; }
.gcanvas { display:block; width:100%; height:250px; border:1px solid var(--border); border-radius:8px; background:var(--surface); touch-action:manipulation; }
.krow { display:flex; align-items:center; gap:.6rem; margin-top:.5rem; flex-wrap:wrap; }
.krow input[type=range] { flex:1; min-width:130px; accent-color:var(--green); height:34px; }
.klbl { font-size:.78rem; color:var(--text3); min-width:52px; }
.kval { font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:.92rem; color:var(--green); min-width:38px; text-align:right; }
.readrow { display:grid; grid-template-columns:repeat(3,1fr); gap:.5rem; margin-top:.8rem; }
.readcell { background:var(--surface2); border-radius:8px; padding:.55rem; text-align:center; }
.readlbl { font-size:.64rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.readnum { font-family:'IBM Plex Mono',monospace; font-size:1rem; font-weight:700; color:var(--green-dark); }
.statline { margin-top:.5rem; font-size:.84rem; color:var(--text3); }
.defgrid { display:grid; grid-template-columns:repeat(2,1fr); gap:.6rem; margin:1rem 0; }
.defcell { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.75rem; border-top:3px solid var(--green); }
.defname { font-size:.72rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.25rem; }
.deftxt { font-size:.82rem; color:var(--text2); }
.cls-prog { font-family:'IBM Plex Mono',monospace; font-size:.7rem; color:var(--text3); letter-spacing:.08em; text-transform:uppercase; margin-bottom:.45rem; }
.cls-card { background:var(--surface2); border:1.5px solid var(--border); border-radius:10px; padding:.85rem; text-align:center; font-weight:600; font-size:.9rem; margin:.6rem 0; color:var(--text); }
.cls-bins { display:flex; gap:.5rem; flex-wrap:wrap; }
.cls-bin { flex:1; min-width:104px; min-height:44px; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.85rem; font-weight:600; cursor:pointer; font-family:inherit; padding:.5rem; }
.cls-bin:hover { border-color:var(--green); color:var(--green); }
.cls-done { font-weight:700; color:var(--ok); text-align:center; padding:.6rem; }
.simbtns { display:flex; gap:.45rem; flex-wrap:wrap; margin-top:.7rem; }
.simbtn { min-height:44px; padding:.5rem .85rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.83rem; font-weight:600; font-family:inherit; cursor:pointer; }
.simbtn:hover { border-color:var(--green); color:var(--green); }
.simbtn.rst { color:var(--bad); }
.dataline { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); background:var(--surface2); border-radius:8px; padding:.5rem .7rem; margin:.5rem 0; }
.reflect-prompt { font-size:.92rem; color:var(--text2); margin:.5rem 0 .8rem; }
/* ── URNA / DADO / ESTIMADOR (widgets de esta guia) ── */
.tokrow { display:flex; flex-wrap:wrap; gap:.4rem; margin:.75rem 0; justify-content:center; }
.tok { width:44px; height:44px; min-width:44px; border-radius:50%; border:2px solid var(--border); background:var(--surface2); color:var(--text2); font-family:'IBM Plex Mono',monospace; font-size:.74rem; font-weight:700; cursor:pointer; padding:0; }
.tok.az { background:var(--green); border-color:var(--green-dark); color:var(--surface); }
.tok.do { background:var(--gold); border-color:var(--gold); color:var(--text); }
.tok.lk { cursor:default; }
.pbar { display:flex; height:18px; border-radius:9px; overflow:hidden; border:1px solid var(--border); margin-top:.55rem; }
.pseg-a { background:var(--green); }
.pseg-b { background:var(--gold); }
.metaline { display:flex; align-items:center; justify-content:center; gap:.6rem; flex-wrap:wrap; font-size:.86rem; color:var(--text2); margin-top:.6rem; }
.metaline b { color:var(--green-dark); font-family:'IBM Plex Mono',monospace; }
.estrow { display:flex; align-items:center; gap:.55rem; flex-wrap:wrap; margin-top:.75rem; }
.estrow input[type=range] { flex:1; min-width:150px; accent-color:var(--green); height:34px; }
.eslbl { font-size:.78rem; color:var(--text3); }
.esval { font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:1rem; color:var(--green); min-width:36px; text-align:right; }
.bagline { text-align:center; font-size:1.9rem; line-height:1.25; margin:.3rem 0 .1rem; }
@media (max-width:600px) {
  .defgrid { grid-template-columns:1fr; }

<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Probabilidad Frecuencial y Teórica</div>
    <div class="wcourse" id="wcourse-el">Pensamiento Matemático I · Sem 1</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Probabilidad Frecuencial y Teórica</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="sbtn" id="dlBtn" onclick="generatePDF()" style="max-width:280px;margin:0 auto;">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

function setLang(l){

    document.getElementById('lessonBody').innerHTML = '';
    var res = document.getElementById('s_results'); res.style.display='none'; res.classList.remove('vis');
    buildLesson(seededRng(studentData.name + studentData.group + currentAttempt(studentData.name, studentData.group)));

/* ── Attempt counter + seed (Rule 4): seed = name+group+attempt ── */
function getAttemptKey(name, group){ return 'liaxa_pm1_t02_g01__att__' + (name+'__'+group).replace(/\s+/g,'_'); }
function nextAttempt(name, group){ var k=getAttemptKey(name,group),n=0; try{n=parseInt(localStorage.getItem(k)||'0',10)||0;}catch(e){} n++; try{localStorage.setItem(k,String(n));}catch(e){} return n; }
function currentAttempt(name, group){ var k=getAttemptKey(name,group); try{return parseInt(localStorage.getItem(k)||'1',10)||1;}catch(e){return 1;} }
/* ================================================
   STATE
   ================================================ */
var studentData   = {};
var problems      = [];

/* ================================================
   SESSION PERSISTENCE  (localStorage)
   ================================================ */
function lsKey() {
  var n = (studentData.name  || '').trim();
  var g = (studentData.group || '').trim();
  return 'liaxa_pm1_t02_g01__' + (n + '__' + g).replace(/\s+/g, '_');
}

function saveSession() {
  if (!studentData.name) return;
  var drawings = [], texts = [], photos = [];
  problems.forEach(function(p, i) {
    var dc = document.getElementById('dc' + i);
    if (dc && dc.width) {
      var blank = document.createElement('canvas');
      blank.width = dc.width; blank.height = dc.height;
      drawings.push(dc.toDataURL() === blank.toDataURL() ? null : dc.toDataURL('image/png'));
    } else { drawings.push(null); }
    var ta = document.getElementById('ta' + i);
    texts.push(ta ? ta.value : '');
    var pp = document.getElementById('pp' + i);
    photos.push((pp && pp.src && pp.src.indexOf('data:') === 0) ? pp.src : null);
  });
  var state = {
    name: studentData.name, group: studentData.group,
    answeredCount: answeredCount, correctCount: correctCount,
    choices: problems.map(function(p) { return p.studentChoice; }),
    drawings: drawings, texts: texts, photos: photos
  };
  try { localStorage.setItem(lsKey(), JSON.stringify(state)); } catch(e) {}
}

function loadSession(name, group) {
  var key = 'liaxa_pm1_t02_g01__' + (name + '__' + group).replace(/\s+/g, '_');
  try { var r = localStorage.getItem(key); return r ? JSON.parse(r) : null; } catch(e) { return null; }
}

function restoreSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  var saved = loadSession(name, group);
  if (!saved) return;
  document.getElementById('restoreBar').style.display = 'none';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = currentAttempt(name, group);
  buildLesson(seededRng(name + group + att));
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
  saved.choices.forEach(function(choice, idx) {
    if (choice !== null && choice !== undefined) confirmMC(idx, choice);
  });
  setTimeout(function() {
    if (saved.drawings) {
      saved.drawings.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var dc = document.getElementById('dc' + i);
        if (!dc || !dc.width) return;
        var img = new Image();
        img.onload = function() {
          var dpr = window.devicePixelRatio || 1;
          dc.getContext('2d').drawImage(img, 0, 0, dc.width / dpr, dc.height / dpr);
        };
        img.src = dataUrl;
      });
    }
    if (saved.texts) {
      saved.texts.forEach(function(text, i) {
        if (!text) return;
        var ta = document.getElementById('ta' + i);
        if (ta) ta.value = text;
      });
    }
    if (saved.photos) {
      saved.photos.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var pp = document.getElementById('pp' + i);
        if (!pp) return;
        pp.src = dataUrl; pp.style.display = 'block';
        var pz = document.getElementById('pz' + i);
        if (pz) pz.style.opacity = '0.4';
      });
    }
  }, 300);
}

function dismissRestore() {
  document.getElementById('restoreBar').style.display = 'none';
}

function checkForSavedSession() {
  var name  = document.getElementById('sName').value.trim();

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS — INJECTION BLOCK ─────────────────────────────────────────
  //   Match these RGB values to --green and --gold above.
  //   PRIMARY  → pBR, pBG, pBB
  //   ACCENT   → pAR, pAG, pAB

    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/\u2192/g,'->').replace(/\u2212/g,'-').replace(/\u00b2/g,'^2')
      .replace(/\u00b3/g,'^3').replace(/\u00d7/g,'x').replace(/\u00f7/g,'/')
      .replace(/\u2260/g,'!=').replace(/\u2264/g,'<=').replace(/\u2265/g,'>=')

      doc.rect(M,sy,TW,8,'F'); doc.text('RESUMEN DE PROBLEMAS (continuación)', M+4, sy+6);
      sy += 12;
    }
    var ok = document.getElementById('pc'+i).classList.contains('ok');
    doc.setFillColor(ok?232:255, ok?240:232, ok?232:228);
    doc.roundedRect(M,sy,TW,10,2,2,'F');
    doc.setFillColor(ok?26:176, ok?106:48, ok?74:16);
    doc.circle(M+6, sy+5, 2.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(7); doc.setFont('helvetica','bold');
    doc.text(ok?'✓':'✗', M+4.5, sy+6.5);
    doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('helvetica','normal');

    doc.setTextColor(ok?26:176, ok?106:48, ok?74:16);
    doc.text(ok?'Correcto':'Incorrecto', PW-M-24, sy+6.5);
    sy += 12;
  });

  // ── Per-problem pages ──
  for (var i = 0; i < problems.length; i++) {
    var prob = problems[i];
    doc.addPage();
    var wy = 0;

    doc.setFillColor(pBR,pBG,pBB); doc.rect(0,0,PW,20,'F');
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,3,'F');
    doc.setTextColor(pAR,pAG,pAB); doc.setFontSize(7); doc.setFont('helvetica','normal');
    doc.text(t('wcourse')+'  ·  '+t('wtitle'), M, 10);
    doc.setTextColor(232,238,247); doc.setFontSize(10.5); doc.setFont('helvetica','bold');
    doc.text('Problema '+(i+1)+' de '+total+'  ·  '+pdfText(prob.title), M, 17);
    wy = 25;

    var qRaw = pdfText(prob.questionText);
    doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var qLines = doc.splitTextToSize(qRaw, TW-10);
    var qBoxH  = 8 + qLines.length*5 + 3;
    doc.setFillColor(237,240,245); doc.roundedRect(M,wy,TW,qBoxH,2,2,'F');
    doc.setTextColor(pBR,pBG,pBB); doc.setFontSize(6.5); doc.setFont('helvetica','bold');
    doc.text('PREGUNTA', M+4, wy+6);
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var qy = wy+12;
    qLines.forEach(function(ln,li){ doc.text(ln, M+4, qy+li*5); });
    wy += qBoxH + 4;

    var isOk   = document.getElementById('pc'+i).classList.contains('ok');
    var chosen = prob.studentChoice != null ? pdfText(prob.options[prob.studentChoice]||'-') : '-';
    var corr   = pdfText(prob.options[prob.correctIdx]||'');
    var expRaw = pdfText(prob.explanation||'');
    doc.setFontSize(8.5); var chLines = doc.splitTextToSize('Alumno: '+chosen, TW-18);
    doc.setFontSize(8);   var coLines = doc.splitTextToSize('Correcto: '+corr, TW-18);
    doc.setFontSize(7.5); var exLines = doc.splitTextToSize('Solución: '+expRaw, TW-18).slice(0,4);
    var ansBoxH = 8 + chLines.length*5.5 + coLines.length*5 + exLines.length*5 + 6;
    doc.setFillColor(isOk?232:255, isOk?240:232, isOk?232:228);
    doc.roundedRect(M,wy,TW,ansBoxH,2,2,'F');
    doc.setFillColor(isOk?26:176, isOk?106:48, isOk?74:16);
    doc.circle(M+7, wy+8, 3.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(9); doc.setFont('helvetica','bold');
    doc.text(isOk?'✓':'✗', M+5.2, wy+10.5);
    var ay = wy+7;
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','bold');
    chLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5.5); });
    ay += chLines.length*5.5 + 3;
    doc.setTextColor(26,106,74); doc.setFontSize(8); doc.setFont('helvetica','normal');
    coLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    ay += coLines.length*5 + 3;
    doc.setTextColor(90,85,80); doc.setFontSize(7.5);
    exLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    wy += ansBoxH + 5;

    doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
    doc.setFontSize(7); doc.setFont('helvetica','bold');
    doc.rect(M,wy,TW,8,'F'); doc.text('TRABAJO DEL ALUMNO', M+4, wy+5.5);
    wy += 11;

    var dc = document.getElementById('dc'+i);
    if (dc) {
      try {
        var imgD = dc.toDataURL('image/png');
        var ar   = dc.height / dc.width;
        var iw   = TW;
        var ih   = Math.min(iw * ar, 68);
        doc.addImage(imgD, 'PNG', M, wy, iw, ih);
        wy += ih + 4;
      } catch(e) {}
    }

    var ta = document.getElementById('ta'+i);
    if (ta && ta.value.trim()) {
      if (wy > PH-30) { doc.addPage(); wy = 20; }
      doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('courier','normal');
      var taLines = doc.splitTextToSize(ta.value, TW);
      taLines.slice(0,16).forEach(function(ln) {
        if (wy > PH-15) { doc.addPage(); wy = 20; }
        doc.text(ln, M, wy); wy += 5;
      });
      wy += 2;
    }

    var pp = document.getElementById('pp'+i);
    if (pp && pp.src && pp.src.indexOf('data:') === 0) {
      if (wy > PH-55) { doc.addPage(); wy = 20; }
      try { doc.addImage(pp.src, 'JPEG', M, wy, TW, 68); wy += 72; } catch(e) {}
    }
  }

  // ── Footer on every page ──
  var pages = doc.internal.getNumberOfPages();
  for (var p = 1; p <= pages; p++) {
    doc.setPage(p);
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0, PH-3, PW, 3, 'F');
    doc.setTextColor(130,140,160); doc.setFontSize(6.5); doc.setFont('helvetica','normal');
    doc.text(name+'  ·  '+group+'  ·  Código: '+code+'  ·  Página '+p+'/'+pages,
      PW/2, PH-5, {align:'center'});
  }

  doc.save('pm1_t02_g01_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf');
  btn.innerHTML = '⬇ &nbsp;Descargar Resultados PDF';

}

/* ================================================
   buildLesson — OVERRIDE IN EACH GUIDE
   ================================================ */
/* ================================================
   buildLesson: Probabilidad frecuencial y teorica (Pensamiento Matematico I, Sem 1)
   Interleaved: idea -> manipulativo -> problema(s). Cards built inline.
   ================================================ */
function buildLesson(rng) {
  var LB = document.getElementById('lessonBody');
  LB.innerHTML = '';
  problems = [];

  /* ============================================================
     HELPERS
     ============================================================ */
  function T(o){
    if (o === undefined || o === null) return '';
    if (typeof o === 'string' || typeof o === 'number') return o;
    if (Object.prototype.toString.call(o) === '[object Array]') return o;
    return (o[LANG] !== undefined ? o[LANG] : o.es);
  }
  function ri(a,b){ return a + Math.floor(rng()*(b-a+1)); }
  function shufA(arr){
    var a = arr.slice(), i, j, t;
    for (i=a.length-1;i>0;i--){ j=Math.floor(rng()*(i+1)); t=a[i]; a[i]=a[j]; a[j]=t; }
    return a;
  }
  function sec(tag, title, html){
    var d = document.createElement('div');
    d.className = 'section';
    d.innerHTML = '<div class="stag">'+tag+'</div><h2>'+title+'</h2>'+(html||'');
    LB.appendChild(d);
    return d;
  }
  function widget(kind){
    var d = document.createElement('div');
    d.className = kind + 'wrap section';
    d.setAttribute('data-widget', kind);
    d.id = 'w' + kind;
    LB.appendChild(d);
    return d;
  }
  function cssv(n){
    try { var v = getComputedStyle(document.documentElement).getPropertyValue(n); return v ? v.trim() : ''; }
    catch(e){ return ''; }
  }
  function fitCv(cv){
    var dpr = window.devicePixelRatio || 1;
    var w = cv.clientWidth || 320, h = cv.clientHeight || 240;
    cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr);
    var ctx = cv.getContext('2d');
    ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,w,h);
    return { ctx:ctx, w:w, h:h };
  }
  function fmt1(x){ return (Math.round(x*10)/10).toFixed(1); }
  function fmt2(x){ return (Math.round(x*100)/100).toFixed(2); }
  function fmt3(x){ return (Math.round(x*1000)/1000).toFixed(3); }
  function mf(n,d){
    return '<span class="mf-outer"><span class="mf-num">'+n+'</span><span class="mf-den">'+d+'</span></span>';
  }
  function opts4(correct, cands){
    var out = [String(correct)], i, s;
    for (i=0;i<cands.length && out.length<4;i++){
      s = String(cands[i]);
      if (out.indexOf(s) < 0) out.push(s);
    }
    var txt = String(correct), dec = txt.indexOf('.') >= 0 ? (txt.split('.')[1] || '').length : 0;
    var base = parseFloat(txt), step = dec ? Math.pow(10,-dec) : 1, k = 1;
    while (out.length < 4 && !isNaN(base) && k < 60){
      s = dec ? (base + k*step).toFixed(dec) : String(base + k);
      if (out.indexOf(s) < 0) out.push(s);
      k++;
    }
    return out;
  }
  function addProb(spec){
    var so  = shufA(T(spec.options));
    var cor = T(spec.correct);
    problems.push({
      title: T(spec.title),
      questionText: T(spec.q),
      fn: '',
      hint: T(spec.hint),
      explanation: T(spec.exp),
      options: so,
      correctIdx: so.indexOf(cor),
      showWork: !!spec.showWork,
      studentChoice: null,
      pendingChoice: null
    });
    buildOneCard(problems[problems.length-1], problems.length-1);
  }

  /* ============================================================
     VALORES CON SEMILLA (se extraen una sola vez, en orden fijo)
     ============================================================ */
  var v1 = Math.floor(rng()*2), v2 = Math.floor(rng()*2), v3 = Math.floor(rng()*2);
  var v5 = Math.floor(rng()*2), v7 = Math.floor(rng()*2), v10 = Math.floor(rng()*2);

  /* manipulativo 1: tres rondas de urna */
  var m1Ns = shufA([8,10,12]);
  var m1 = [];
  (function(){
    var i, j, N, k, a;
    for (i=0;i<3;i++){
      N = m1Ns[i]; k = ri(2, N-2); a = [];
      for (j=0;j<N;j++) a.push(rng() < 0.5 ? 1 : 0);
      m1.push({ N:N, k:k, start:a });
    }
  })();

  /* manipulativo 2 y 3: semillas de simulacion */
  var dSeed = Math.floor(rng()*1000000);
  var eSeed = Math.floor(rng()*1000000);
  var m3 = [{ A:ri(5,9) }, { A:ri(10,15) }, { A:ri(6,14) }];

  /* P1: urna de 20 fichas */
  var p1v = ri(3,6), p1a = ri(6,9), p1r = 20 - p1v - p1a;

  /* P2: ruleta de sectores iguales */
  var p2s = (rng() < 0.5 ? 8 : 10);
  var p2t = ri(3, p2s-3);
  var p2fav = [], p2i;
  for (p2i=1;p2i<=p2s;p2i++){
    if (v2 === 0){ if (p2i % 3 === 0) p2fav.push(p2i); }
    else { if (p2i > p2t) p2fav.push(p2i); }
  }
  var p2m = p2fav.length;

  /* P3: registro de una tachuela o una corcholata */
  var p3n = 100*ri(2,5), p3pct = ri(15,45), p3k = p3n*p3pct/100;

  /* P6: de la muestra al lote */
  var p6n = 100*ri(2,5), p6q = ri(4,12), p6N = 500*ri(4,10);
  var p6ans = p6N*p6q/100, p6mu = p6n*p6q/100;

  /* P4: lectura de una discrepancia */
  var p4g = 20*ri(3,6), p4d = ri(4,9)/100;

  /* P9: distancia entre las dos probabilidades */
  var p9s = [4,5,10][Math.floor(rng()*3)];
  var p9teo = 1/p9s, p9d = ri(3,8)/100;
  var p9sg = (rng() < 0.5 ? 1 : -1);
  if (p9teo - p9d < 0.03) p9sg = 1;
  var p9fr = p9teo + p9sg*p9d, p9k = Math.round(p9fr*200);

  /* P5: conteo esperado en una serie */
  var p5N = 60*ri(3,8);
  var p5ans = (v5 === 0 ? p5N/3 : p5N/2);

  /* P8: suma de dos dados */
  var p8i = Math.floor(rng()*5);
  var p8s = [5,6,7,8,9][p8i], p8c = [4,5,6,5,4][p8i];

  /* P10: observado frente a esperado */
  var p10n = 300*ri(2,4), p10e = p10n/6, p10x = ri(18,55), p10o = p10e + p10x;

  /* ============================================================
     IDEA 1
     ============================================================ */
  sec(T({es:'Idea 1', en:'Idea 1'}),
      T({es:'La probabilidad teórica de un evento', en:'The theoretical probability of an event'}),
      '<p>'+T({
        es:'Un experimento aleatorio es un procedimiento que puede repetirse bajo las mismas condiciones y cuyo resultado individual no se conoce de antemano, aunque el conjunto de todos los resultados posibles sí se conoce. Ese conjunto recibe el nombre de espacio muestral, y un evento es cualquier subconjunto suyo: puede reunir un solo resultado o varios a la vez.',
        en:'A random experiment is a procedure that can be repeated under the same conditions and whose individual outcome is not known in advance, even though the set of all possible outcomes is known. That set is called the sample space, and an event is any subset of it: it may gather a single outcome or several at once.'
      })+'</p>'+
      '<p>'+T({
        es:'Cuando el espacio muestral es finito y existen razones de simetría o de composición para suponer que todos los resultados son igualmente probables, la probabilidad teórica del evento se obtiene comparando los resultados que lo favorecen con el total de resultados posibles.',
        en:'When the sample space is finite and there are reasons of symmetry or of known composition to assume that all outcomes are equally likely, the theoretical probability of the event comes from comparing the outcomes that favour it with the total number of possible outcomes.'
      })+'</p>'+
      '<div class="dataline">P(A) = '+mf(T({es:'casos favorables a A', en:'outcomes favourable to A'}), T({es:'casos posibles', en:'possible outcomes'}))+'</div>'+
      '<p>'+T({
        es:'El valor obtenido nunca sale del intervalo que va de 0 a 1: vale 0 para un evento imposible y 1 para uno seguro, y la probabilidad del evento contrario se obtiene restando P(A) de 1. Todo esto se calcula sin realizar el experimento ni una sola vez, porque proviene del modelo y no de los datos. Su validez depende por completo de que la equiprobabilidad supuesta sea razonable: si los sectores de una ruleta tienen distinto tamaño, contar casos deja de describir el fenómeno.',
        en:'The resulting value never leaves the interval from 0 to 1: it is 0 for an impossible event and 1 for a certain one, and the probability of the opposite event comes from subtracting P(A) from 1. All of this is computed without running the experiment even once, because it comes from the model and not from data. Its validity depends entirely on the assumed equal likelihood being reasonable: if the sectors of a spinner have different sizes, counting outcomes stops describing the phenomenon.'
      })+'</p>'+
      '<div class="defgrid">'+
        '<div class="defcell"><div class="defname">'+T({es:'Experimento aleatorio',en:'Random experiment'})+'</div><div class="deftxt">'+T({es:'Procedimiento repetible cuyo resultado individual no se anticipa.',en:'Repeatable procedure whose individual outcome cannot be anticipated.'})+'</div></div>'+
        '<div class="defcell"><div class="defname">'+T({es:'Espacio muestral',en:'Sample space'})+'</div><div class="deftxt">'+T({es:'Conjunto de todos los resultados posibles del experimento.',en:'The set of every possible outcome of the experiment.'})+'</div></div>'+
        '<div class="defcell"><div class="defname">'+T({es:'Evento',en:'Event'})+'</div><div class="deftxt">'+T({es:'Subconjunto del espacio muestral cuya probabilidad interesa.',en:'A subset of the sample space whose probability is of interest.'})+'</div></div>'+
        '<div class="defcell"><div class="defname">'+T({es:'Equiprobabilidad',en:'Equal likelihood'})+'</div><div class="deftxt">'+T({es:'Supuesto de que ningún resultado del espacio muestral está favorecido.',en:'The assumption that no outcome of the sample space is favoured.'})+'</div></div>'+
      '</div>');

  /* ---- MANIPULATIVO 1: arma la urna ---- */
  (function(){
    var wrap = widget('urna');
    var st = { r:0, toks:[], tries:0, done:false, lock:false };

    function countAz(){ var i, c=0; for (i=0;i<st.toks.length;i++) c += st.toks[i]; return c; }
    function loadRound(){
      var R = m1[st.r];
      st.toks = R.start.slice();
      st.tries = 0;
      if (countAz() === R.k) st.toks[0] = st.toks[0] ? 0 : 1;
    }
    function render(){
      if (st.done){
        wrap.innerHTML =
          '<div class="iw-tag">'+T({es:'Arma la urna', en:'Build the urn'})+'</div>'+
          '<div class="iw-box"><div class="cls-done">'+T({es:'Actividad completa', en:'Activity complete'})+'</div>'+
          '<div class="rfb">'+T({
            es:'Composiciones muy distintas pueden dar la misma probabilidad teórica: lo que decide el valor es la razón entre fichas azules y fichas totales, no la cantidad de fichas.',
            en:'Very different compositions can give the same theoretical probability: what decides the value is the ratio of blue tokens to total tokens, not how many tokens there are.'
          })+'</div></div>';
        return;
      }
      var R = m1[st.r], N = R.N, c = countAz(), i, toks = '';
      for (i=0;i<N;i++) toks += '<button class="tok '+(st.toks[i] ? 'az' : 'do')+'" onclick="urTap('+i+')">'+(i+1)+'</button>';
      wrap.innerHTML =
        '<div class="iw-tag">'+T({es:'Arma la urna', en:'Build the urn'})+'</div>'+
        '<div class="iw-box">'+
          '<div class="iw-sub">'+T({
            es:'Toca una ficha para cambiar su color. La urna se llena con las fichas que dejes en azul y las que dejes en dorado.',
            en:'Tap a token to change its colour. The urn is made up of the tokens you leave blue and the ones you leave gold.'
          })+'</div>'+
          '<div class="rondas">'+T({es:'Ronda ',en:'Round '})+(st.r+1)+' / 3</div>'+
          '<div class="goalbar">'+T({es:'Meta: que la probabilidad teórica de extraer una ficha azul sea ',en:'Goal: make the theoretical probability of drawing a blue token equal to '})+
            mf(R.k, N)+' = <b>'+fmt3(R.k/N)+'</b></div>'+
          '<div class="tokrow">'+toks+'</div>'+
          '<div class="pbar"><div class="pseg-a" style="width:'+(100*c/N)+'%"></div><div class="pseg-b" style="width:'+(100*(N-c)/N)+'%"></div></div>'+
          '<div class="metaline">'+T({es:'Tu urna: ',en:'Your urn: '})+mf(c, N)+' = <b>'+fmt3(c/N)+'</b></div>'+
          '<button class="rverify-btn" onclick="urChk()">'+T({es:'Verificar',en:'Check'})+'</button>'+
          '<div class="rfb" id="urFb"></div>'+
        '</div>';
    }
    function adv(ms){
      st.lock = true;
      setTimeout(function(){
        st.lock = false; st.r++;
        if (st.r >= m1.length){ st.done = true; render(); return; }
        loadRound(); render();
      }, ms);
    }
    window.urTap = function(i){
      if (st.done || st.lock) return;
      st.toks[i] = st.toks[i] ? 0 : 1;
      render();
    };
    window.urChk = function(){
      if (st.done || st.lock) return;
      var R = m1[st.r], c = countAz(), fb = document.getElementById('urFb');
      if (!fb) return;
      if (c === R.k){
        fb.innerHTML = '<span class="okmsg">'+T({es:'Correcto. ',en:'Correct. '})+'</span>'+
          T({es:'Dejaste '+c+' fichas azules entre '+R.N+', así que la probabilidad teórica de extraer azul es '+fmt3(c/R.N)+'.',
             en:'You left '+c+' blue tokens out of '+R.N+', so the theoretical probability of drawing blue is '+fmt3(c/R.N)+'.'});
        adv(1700); return;
      }
      st.tries++;
      if (st.tries >= 3){
        var j;
        for (j=0;j<R.N;j++) st.toks[j] = (j < R.k) ? 1 : 0;
        render();
        var fb2 = document.getElementById('urFb');
        if (fb2) fb2.innerHTML = T({
          es:'Esta es una urna que cumple la meta: '+R.k+' fichas azules entre '+R.N+'. El numerador cuenta los casos favorables y el denominador cuenta todas las fichas de la urna.',
          en:'This is an urn that meets the goal: '+R.k+' blue tokens out of '+R.N+'. The numerator counts the favourable outcomes and the denominator counts every token in the urn.'
        });
        adv(2600); return;
      }
      var d = R.k - c;
      fb.textContent = T({
        es:'Tu urna da '+fmt3(c/R.N)+' y la meta es '+fmt3(R.k/R.N)+'. '+(d > 0
            ? ('Pasa '+d+' ficha dorada al color azul.')
            : ('Pasa '+(-d)+' ficha azul al color dorado.')),
        en:'Your urn gives '+fmt3(c/R.N)+' and the goal is '+fmt3(R.k/R.N)+'. '+(d > 0
            ? ('Turn '+d+' gold token into a blue one.')
            : ('Turn '+(-d)+' blue token into a gold one.'))
      });
    };
    loadRound(); render();
  })();

  /* ---- P1 ---- */
  (function(){
    var cor = (v1 === 0) ? (20-p1v)/20 : (p1a+p1v)/20;
    var oo = opts4(fmt2(cor), [fmt2(p1v/20), fmt2(p1a/20), fmt2(p1r/20), fmt2(1-cor), fmt2((p1v+p1r)/20),
                               fmt2((p1a+p1v)/20), fmt2((p1a+p1r)/20), fmt2((20-p1a)/20)]);
    addProb({

            en:'First count how many tokens the urn holds and then how many of them satisfy the condition of the event; the theoretical probability compares the second amount with the first, like this '+mf(T({es:'favorables',en:'favourable'}), T({es:'posibles',en:'possible'}))+'.'},

  /* ---- MANIPULATIVO 2: registro de lanzamientos de un dado ---- */
  (function(){
    var wrap = widget('dado');
    var resets = 0, srng = seededRng('dd'+dSeed);
    var st = { n:0, c:[0,0,0,0,0,0], tries:0, done:false };

    function roll(b){
      var i, f;
      for (i=0;i<b;i++){
        f = Math.floor(srng()*6); if (f > 5) f = 5;
        st.n++; st.c[f]++;
      }
    }
    function worst(){
      var i, m = -1, w = 0, d;
      for (i=0;i<6;i++){ d = Math.abs(st.c[i]/st.n - 1/6); if (d > m){ m = d; w = i; } }
      return { face:w+1, dev:m, fr:st.c[w]/st.n };
    }
    function draw(){
      var cv = document.getElementById('ddCv'); if (!cv) return;
      var g = fitCv(cv), ctx = g.ctx, w = g.w, h = g.h;
      var x0 = 14, x1 = w-10, yt = 18, yb = h-26;
      var col = cssv('--green'), acc = cssv('--gold'), bd = cssv('--border'), sub = cssv('--text3'), dk = cssv('--green-dark');
      var i, bw = (x1-x0)/6, exp = st.n/6;
      var top = Math.max(1, Math.max.apply(null, st.c), exp) * 1.35;
      ctx.strokeStyle = bd; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x0, yb); ctx.lineTo(x1, yb); ctx.stroke();
      for (i=0;i<6;i++){
        var bh = (yb-yt)*(st.c[i]/top);
        ctx.fillStyle = col;
        ctx.fillRect(x0 + i*bw + bw*0.17, yb-bh, bw*0.66, bh);
        ctx.fillStyle = sub; ctx.textAlign = 'center';
        ctx.font = '500 11px "IBM Plex Mono", monospace';
        ctx.fillText(String(i+1), x0 + i*bw + bw/2, yb+15);
        if (st.n){
          ctx.fillStyle = dk; ctx.font = '600 9px "IBM Plex Mono", monospace';
          ctx.fillText(fmt3(st.c[i]/st.n), x0 + i*bw + bw/2, yb-bh-5);
        }
      }
      if (st.n){
        var ye = yb - (yb-yt)*(exp/top);
        ctx.strokeStyle = acc; ctx.lineWidth = 2; ctx.setLineDash([5,4]);
        ctx.beginPath(); ctx.moveTo(x0, ye); ctx.lineTo(x1, ye); ctx.stroke(); ctx.setLineDash([]);
        ctx.fillStyle = acc; ctx.textAlign = 'left'; ctx.font = '600 10px "IBM Plex Sans", sans-serif';
        ctx.fillText(T({es:'conteo esperado ',en:'expected count '})+fmt1(exp), x0+6, ye-6);
      }
      ctx.fillStyle = sub; ctx.textAlign = 'right'; ctx.font = '500 10px "IBM Plex Mono", monospace';
      ctx.fillText('n = '+st.n, x1, yt);
    }
    function read(){
      var e = document.getElementById('ddN'); if (e) e.textContent = String(st.n);
      var wt = st.n ? worst() : null;
      e = document.getElementById('ddW'); if (e) e.textContent = wt ? String(wt.face) : '-';
      e = document.getElementById('ddD'); if (e) e.textContent = wt ? fmt3(wt.dev) : '-';
      e = document.getElementById('ddStat');
      if (e) e.textContent = st.n === 0
        ? T({es:'Todavía no hay lanzamientos registrados.', en:'No throws recorded yet.'})
        : T({es:'El modelo teórico asigna 0.167 a cada cara; la cara '+wt.face+' va en '+fmt3(wt.fr)+'.',
             en:'The theoretical model assigns 0.167 to every face; face '+wt.face+' sits at '+fmt3(wt.fr)+'.'});
    }
    function render(){
      wrap.innerHTML =
        '<div class="iw-tag">'+T({es:'Registro de un dado', en:'Die record'})+'</div>'+
        '<div class="iw-box">'+
          '<div class="iw-sub">'+T({
            es:'Lanza el dado por tandas y observa cómo se acomodan las seis frecuencias relativas frente al conteo que anticipa el modelo.',
            en:'Throw the die in batches and watch how the six relative frequencies settle against the count the model anticipates.'
          })+'</div>'+
          '<div class="goalbar">'+T({
            es:'Meta: dejar las seis frecuencias relativas a menos de 0.03 de 0.167, con al menos 300 lanzamientos acumulados.',
            en:'Goal: leave the six relative frequencies within 0.03 of 0.167, with at least 300 accumulated throws.'
          })+'</div>'+
          '<canvas class="gcanvas" id="ddCv"></canvas>'+
          '<div class="simbtns">'+
            '<button class="simbtn" onclick="ddRun(1)">+1</button>'+
            '<button class="simbtn" onclick="ddRun(20)">+20</button>'+
            '<button class="simbtn" onclick="ddRun(100)">+100</button>'+
            '<button class="simbtn rst" onclick="ddReset()">'+T({es:'Reiniciar',en:'Reset'})+'</button>'+
          '</div>'+
          '<div class="readrow">'+
            '<div class="readcell"><div class="readlbl">'+T({es:'Lanzamientos',en:'Throws'})+'</div><div class="readnum" id="ddN">'+st.n+'</div></div>'+
            '<div class="readcell"><div class="readlbl">'+T({es:'Cara más lejana',en:'Farthest face'})+'</div><div class="readnum" id="ddW">-</div></div>'+
            '<div class="readcell"><div class="readlbl">'+T({es:'Distancia',en:'Distance'})+'</div><div class="readnum" id="ddD">-</div></div>'+
          '</div>'+
          '<div class="statline" id="ddStat"></div>'+
          '<button class="rverify-btn" onclick="ddChk()">'+T({es:'Verificar',en:'Check'})+'</button>'+
          '<div class="rfb" id="ddFb"></div>'+
        '</div>';
      draw(); read();
      setTimeout(draw, 160);
    }
    window.ddRun = function(b){
      if (st.done) return;
      roll(b); draw(); read();
    };
    window.ddReset = function(){
      if (st.done) return;
      resets++;
      srng = seededRng('dd'+dSeed+'r'+resets);
      st.n = 0; st.c = [0,0,0,0,0,0]; st.tries = 0;
      draw(); read();
      var fb = document.getElementById('ddFb');
      if (fb) fb.textContent = T({es:'Registro vacío otra vez. Empieza con lanzamientos sueltos y observa qué tan desparejas quedan las barras al principio.',
                                  en:'Empty record again. Start with single throws and watch how uneven the bars look at the beginning.'});
    };
    window.ddChk = function(){
      if (st.done) return;
      var fb = document.getElementById('ddFb'); if (!fb) return;
      if (st.n === 0){
        fb.textContent = T({es:'Necesitas lanzar al menos una vez para tener una frecuencia relativa que comparar.',
                            en:'You need at least one throw before there is a relative frequency to compare.'});
        return;
      }
      var wt = worst();
      if (st.n >= 300 && wt.dev <= 0.03){
        st.done = true;
        fb.innerHTML = '<span class="okmsg">'+T({
          es:'Meta lograda. Ninguna cara se aparta más de 0.03 del valor teórico: con muchos lanzamientos la evidencia acumulada respalda el modelo de dado equilibrado.',
          en:'Goal reached. No face strays more than 0.03 from the theoretical value: with many throws the accumulated evidence backs the balanced die model.'
        })+'</span>';
        return;
      }
      st.tries++;
      if (st.tries >= 3){
        roll(3000); draw(); read();
        st.done = true;
        var wt2 = worst();
        fb.innerHTML = T({
          es:'Se agregaron 3000 lanzamientos de golpe: ahora la cara más lejana está a '+fmt3(wt2.dev)+' de 0.167. Las diferencias grandes del principio no venían del dado, venían del tamaño de la muestra.',
          en:'A batch of 3000 throws was added: now the farthest face sits '+fmt3(wt2.dev)+' away from 0.167. The large differences at the start did not come from the die, they came from the size of the sample.'
        });
        return;
      }
      fb.textContent = st.n < 300
        ? T({es:'Con '+st.n+' lanzamientos la cara '+wt.face+' está a '+fmt3(wt.dev)+' del valor teórico. Acumula más lanzamientos antes de juzgar al dado.',
             en:'With '+st.n+' throws face '+wt.face+' sits '+fmt3(wt.dev)+' away from the theoretical value. Pile up more throws before judging the die.'})
        : T({es:'Ya llevas '+st.n+' lanzamientos, pero la cara '+wt.face+' sigue a '+fmt3(wt.dev)+' de 0.167. Sigue lanzando y observa si esa distancia se reduce.',
             en:'You already have '+st.n+' throws, yet face '+wt.face+' is still '+fmt3(wt.dev)+' from 0.167. Keep throwing and watch whether that distance shrinks.'});
    };
    render();
  })();

  /* ---- P3 ---- */
  (function(){
    var cor = p3pct/100;

      options:{es:oo, en:oo}, correct:String(p6ans),

           en:'If conditions do not change, the estimated proportion carries over to the whole batch. The expected count is '+p6N+' × '+fmt2(p6q/100)+' = '+p6ans+'. The '+p6mu+' parts in the sample are the data that produced the estimate, not the answer for the batch.'},

  sec(T({es:'Idea 3', en:'Idea 3'}),

        en:'As the number of repetitions grows, the relative frequency of an event stops jumping around and moves towards the value the theoretical model assigns to it. That behaviour is known as the law of large numbers and it is the reason an estimate built from many repetitions turns out to be reliable, even though each individual outcome remains unpredictable.'

      stat();
    }
    function stat(){
      var e = document.getElementById('esStat');
      if (e) e.textContent = T({
        es:'Tu elección implica una probabilidad de '+fmt3(st.guess/20)+' para extraer azul.',
        en:'Your choice implies a probability of '+fmt3(st.guess/20)+' for drawing blue.'
      });
    }
    function adv(ms){
      st.lock = true;
      setTimeout(function(){
        st.lock = false; st.r++;
        if (st.r >= m3.length){ st.done = true; render(); return; }
        st.n = 0; st.k = 0; st.tries = 0; st.guess = 10;
        render();
      }, ms);
    }
    window.esSlide = function(v){
      if (st.done || st.lock) return;
      st.guess = parseInt(v,10) || 0;
      var e = document.getElementById('esG'); if (e) e.textContent = String(st.guess);
      stat();
    };
    window.esRun = function(b){
      if (st.done || st.lock) return;
      var i; for (i=0;i<b;i++) drawOnce();
      var e = document.getElementById('esN'); if (e) e.textContent = String(st.n);
      e = document.getElementById('esK'); if (e) e.textContent = String(st.k);
      e = document.getElementById('esF'); if (e) e.textContent = fmt3(frv());
    };
    window.esChk = function(){
      if (st.done || st.lock) return;

      if (st.n < 30){
        fb.textContent = T({
          es:'Llevas '+st.n+' extracciones y la evidencia todavía es débil. Acumula al menos 30 antes de decidir.',
          en:'You have '+st.n+' draws so far and the evidence is still weak. Pile up at least 30 before deciding.'
        });
        return;
      }
      if (Math.abs(st.guess - A) <= 2){
        fb.innerHTML = '<span class="okmsg">'+T({es:'Buena estimación. ',en:'Good estimate. '})+'</span>'+
          T({es:'La bolsa tenía '+A+' fichas azules, es decir una probabilidad real de '+fmt3(A/20)+', y tu registro daba '+fmt3(frv())+'.',
             en:'The bag held '+A+' blue tokens, that is a true probability of '+fmt3(A/20)+', and your record gave '+fmt3(frv())+'.'});
        adv(2200); return;
      }
      st.tries++;
      if (st.tries >= 3){
        fb.innerHTML = T({
          es:'La bolsa tenía '+A+' fichas azules. Con '+st.n+' extracciones tu frecuencia relativa fue '+fmt3(frv())+', y al multiplicarla por las 20 fichas apunta a '+Math.round(frv()*20)+' azules.',
          en:'The bag held '+A+' blue tokens. With '+st.n+' draws your relative frequency was '+fmt3(frv())+', and multiplying it by the 20 tokens points to '+Math.round(frv()*20)+' blue ones.'
        });
        adv(2800); return;
      }
      fb.textContent = st.guess/20 > frv()
        ? T({es:'Tu elección implica '+fmt3(st.guess/20)+' y el registro va en '+fmt3(frv())+'. Baja el número de fichas azules o extrae más para afinar la evidencia.',
             en:'Your choice implies '+fmt3(st.guess/20)+' while the record sits at '+fmt3(frv())+'. Lower the number of blue tokens or draw more to sharpen the evidence.'})
        : T({es:'Tu elección implica '+fmt3(st.guess/20)+' y el registro va en '+fmt3(frv())+'. Sube el número de fichas azules o extrae más para afinar la evidencia.',
             en:'Your choice implies '+fmt3(st.guess/20)+' while the record sits at '+fmt3(frv())+'. Raise the number of blue tokens or draw more to sharpen the evidence.'});
    };
    render();
  })();

  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
</body>
</html>
