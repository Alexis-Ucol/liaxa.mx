<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ciclos Biogeoquímicos</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS - INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }

/* ── WIDGET CHROME (concept manipulatives) ── */
.iwbox { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; padding:1.1rem; }
.iw-tag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:700; margin-bottom:.35rem; }
.iw-sub { font-size:.86rem; color:var(--text2); margin-bottom:.75rem; }
.rfb { font-size:.84rem; color:var(--text2); min-height:1.35rem; margin-top:.6rem; line-height:1.5; }
.rfb b { color:var(--green-dark); }
.okmsg { color:var(--ok); font-weight:700; }
.badmsg { color:var(--bad); font-weight:600; }
.rverify-btn { min-height:44px; padding:.55rem 1.1rem; border:none; border-radius:8px; background:var(--green); color:#fff; font-size:.85rem; font-weight:600; cursor:pointer; font-family:inherit; margin-top:.6rem; }
.rverify-btn:hover { background:var(--green-dark); }
.wprog { font-family:'IBM Plex Mono',monospace; font-size:.7rem; color:var(--text3); letter-spacing:.08em; text-transform:uppercase; margin-bottom:.45rem; }
.dataline { font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); background:var(--surface2); border-radius:8px; padding:.55rem .7rem; margin:.5rem 0; overflow-x:auto; }
.cls-card { background:var(--surface2); border:1.5px solid var(--border); border-radius:10px; padding:.9rem; text-align:center; font-weight:600; font-size:.92rem; margin:.6rem 0; color:var(--text); }
.cls-bins { display:grid; grid-template-columns:1fr 1fr; gap:.5rem; }
.cls-bin { min-height:44px; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.82rem; font-weight:600; cursor:pointer; font-family:inherit; padding:.5rem; }
.cls-bin:hover { border-color:var(--green); color:var(--green); }
.cls-done { font-weight:700; color:var(--ok); text-align:center; padding:.6rem; }

/* ── RESERVOIR BALANCE + CATCHMENT SPLIT (sliders and bars) ── */
.bal-row { display:flex; align-items:center; gap:.6rem; flex-wrap:wrap; margin:.7rem 0 .2rem; }
.bal-lbl { font-size:.76rem; color:var(--text3); min-width:150px; flex:1 1 150px; }
.bal-slider { flex:2 1 160px; min-width:150px; accent-color:var(--green); height:44px; }
.bal-val { font-family:'IBM Plex Mono',monospace; font-weight:700; color:var(--green); min-width:52px; text-align:right; font-size:.98rem; }
.bal-bars { margin-top:.7rem; }
.bal-bar { display:flex; align-items:center; gap:.5rem; margin-bottom:.34rem; }
.bal-name { font-size:.72rem; color:var(--text3); min-width:124px; }
.bal-track { flex:1; background:var(--surface2); border-radius:5px; height:16px; overflow:hidden; min-width:50px; }
.bal-fill { display:block; height:100%; width:0%; background:var(--green); border-radius:5px; transition:width .22s; }
.bal-fill.out { background:var(--gold); }
.bal-fill.alt { background:var(--green-dark); }
.bal-num { font-family:'IBM Plex Mono',monospace; font-size:.75rem; min-width:56px; text-align:right; color:var(--text2); }
.bal-metrics { display:grid; grid-template-columns:1fr 1fr; gap:.5rem; margin-top:.7rem; }
.bal-metric { background:var(--surface2); border-radius:8px; padding:.5rem .6rem; text-align:center; }
.bal-mlbl { display:block; font-size:.64rem; text-transform:uppercase; letter-spacing:.07em; color:var(--text3); }
.bal-mval { display:block; font-family:'IBM Plex Mono',monospace; font-size:1rem; font-weight:700; color:var(--green); }

/* ── CARBON ROUTE SEQUENCER ── */
.seq-slots { display:flex; flex-direction:column; align-items:stretch; gap:.15rem; margin:.7rem 0 .3rem; }
.seq-slot { min-height:46px; display:flex; align-items:center; gap:.55rem; border:1.5px dashed var(--border); border-radius:9px; background:var(--surface); padding:.5rem .7rem; font-size:.82rem; color:var(--text3); cursor:pointer; }
.seq-slot.full { border-style:solid; border-color:var(--green); background:var(--green-bg); color:var(--green-dark); font-weight:600; }
.seq-slot.good { border-style:solid; border-color:var(--ok); background:var(--ok-bg); color:var(--ok); }
.seq-step { font-family:'IBM Plex Mono',monospace; font-weight:700; color:var(--gold); flex-shrink:0; }
.seq-arrow { display:block; text-align:center; color:var(--gold); font-size:.9rem; line-height:1; }
.seq-pool { display:flex; flex-wrap:wrap; gap:.45rem; margin:.6rem 0 .2rem; min-height:46px; }
.seq-chip { min-height:44px; display:flex; align-items:center; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); padding:.42rem .7rem; font-size:.8rem; cursor:pointer; color:var(--text); }
.seq-chip:hover { border-color:var(--green); color:var(--green); }
.seq-empty { font-size:.78rem; color:var(--text3); }

/* ── REFLECT ── */
.reflect-prompt { font-size:.95rem; color:var(--text2); margin:.4rem 0 .85rem; }

.mcopt.pending { border-color:var(--gold); background:var(--gold-bg); }

@media (max-width: 600px) {
  .iwbox { padding:.8rem; }
  .cls-bins { grid-template-columns:1fr; }
  .bal-lbl { min-width:100%; font-size:.72rem; }
  .bal-name { min-width:88px; font-size:.66rem; }
  .bal-num { min-width:46px; font-size:.68rem; }
  .bal-val { min-width:44px; font-size:.88rem; }
  .seq-chip, .seq-slot { font-size:.76rem; }
  .dataline { font-size:.7rem; }
}
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->

/* ── Drawing palette, derived from the school's colours (Rule 16) ─────────
   slots 1-2 : school primary + accent
   slots 3-4 : the two of black/red/blue/green least similar to the school colours
   Falls back to neutral defaults if SCHOOL colours can't be parsed.
   ───────────────────────────────────────────────────────────────────── */
var DRAW_PALETTE = (function () {
  function hex2rgb(h) {
    h = String(h).replace('#', '');
    if (h.length === 3) { h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2]; }
    return [parseInt(h.substr(0,2),16), parseInt(h.substr(2,2),16), parseInt(h.substr(4,2),16)];
  }
  function dist(a, b) {
    var dr = a[0]-b[0], dg = a[1]-b[1], db = a[2]-b[2];
    return Math.sqrt(2*dr*dr + 4*dg*dg + 3*db*db);
  }
  var COMMON = ['#1a1a16', '#c0392b', '#1d4e89', '#1a7a3a'];  /* black, red, blue, green */
  var schoolRGB;
  try {
    schoolRGB = [hex2rgb(SCHOOL.primary), hex2rgb(SCHOOL.accent)];
  } catch (e) {
    return [SCHOOL.primary, SCHOOL.accent, '#1a1a16', '#1d4e89'];
  }
  var scored = COMMON.map(function (c, idx) {
    var rgb = hex2rgb(c);
    var nearest = Math.min(dist(rgb, schoolRGB[0]), dist(rgb, schoolRGB[1]));
    return { c: c, idx: idx, d: nearest };
  });
  scored.sort(function (a, b) { return b.d - a.d; });      /* farthest first */
  var keep = scored.slice(0, 2);
  keep.sort(function (a, b) { return a.idx - b.idx; });    /* restore visual order */
  return [SCHOOL.primary, SCHOOL.accent, keep[0].c, keep[1].c];
})();
function drawDotsHTML() {
  return DRAW_PALETTE.map(function (c, i) {
    return '<div class="cdot' + (i === 0 ? ' sel' : '') + '" data-color="' + c +
           '" style="background:' + c + '"></div>';
  }).join('');
}

/* ── Attempt counter + seed (Rule 4): seed = name+group+attempt ── */
function getAttemptKey(name, group){ return 'liaxa_cneyt2b_t04_g01__att__' + (name+'__'+group).replace(/\s+/g,'_'); }
function nextAttempt(name, group){ var k=getAttemptKey(name,group),n=0; try{n=parseInt(localStorage.getItem(k)||'0',10)||0;}catch(e){} n++; try{localStorage.setItem(k,String(n));}catch(e){} return n; }
function currentAttempt(name, group){ var k=getAttemptKey(name,group); try{return parseInt(localStorage.getItem(k)||'1',10)||1;}catch(e){return 1;} }

var studentData   = {};
var problems      = [];

/* ================================================
   SESSION PERSISTENCE  (localStorage)
   ================================================ */
function lsKey() {
  var n = (studentData.name  || '').trim();
  var g = (studentData.group || '').trim();
  return 'liaxa_cneyt2b_t04_g01__' + (n + '__' + g).replace(/\s+/g, '_');
}

function saveSession() {
  if (!studentData.name) return;
  var drawings = [], texts = [], photos = [];
  problems.forEach(function(p, i) {
    var dc = document.getElementById('dc' + i);
    if (dc && dc.width) {
      var blank = document.createElement('canvas');
      blank.width = dc.width; blank.height = dc.height;
      drawings.push(dc.toDataURL() === blank.toDataURL() ? null : dc.toDataURL('image/png'));
    } else { drawings.push(null); }
    var ta = document.getElementById('ta' + i);
    texts.push(ta ? ta.value : '');
    var pp = document.getElementById('pp' + i);
    photos.push((pp && pp.src && pp.src.indexOf('data:') === 0) ? pp.src : null);
  });
  var state = {
    name: studentData.name, group: studentData.group,
    answeredCount: answeredCount, correctCount: correctCount,
    choices: problems.map(function(p) { return p.studentChoice; }),
    drawings: drawings, texts: texts, photos: photos
  };
  try { localStorage.setItem(lsKey(), JSON.stringify(state)); } catch(e) {}
}

function loadSession(name, group) {
  var key = 'liaxa_cneyt2b_t04_g01__' + (name + '__' + group).replace(/\s+/g, '_');
  try { var r = localStorage.getItem(key); return r ? JSON.parse(r) : null; } catch(e) { return null; }
}

function restoreSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  var saved = loadSession(name, group);
  if (!saved) return;
  document.getElementById('restoreBar').style.display = 'none';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = currentAttempt(name, group);
  buildLesson(seededRng(name + group + att));
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
  saved.choices.forEach(function(choice, idx) {
    if (choice !== null && choice !== undefined) confirmMC(idx, choice);
  });
  setTimeout(function() {
    if (saved.drawings) {
      saved.drawings.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var dc = document.getElementById('dc' + i);
        if (!dc || !dc.width) return;
        var img = new Image();
        img.onload = function() {
          var dpr = window.devicePixelRatio || 1;
          dc.getContext('2d').drawImage(img, 0, 0, dc.width / dpr, dc.height / dpr);
        };
        img.src = dataUrl;
      });
    }
    if (saved.texts) {
      saved.texts.forEach(function(text, i) {
        if (!text) return;
        var ta = document.getElementById('ta' + i);
        if (ta) ta.value = text;
      });
    }
    if (saved.photos) {
      saved.photos.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var pp = document.getElementById('pp' + i);
        if (!pp) return;
        pp.src = dataUrl; pp.style.display = 'block';
        var pz = document.getElementById('pz' + i);
        if (pz) pz.style.opacity = '0.4';
      });
    }
  }, 300);
}

function dismissRestore() {
  document.getElementById('restoreBar').style.display = 'none';
}

function checkForSavedSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  if (!name || !group) { document.getElementById('restoreBar').style.display = 'none'; return; }
  var saved = loadSession(name, group);
  var bar = document.getElementById('restoreBar');

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = DRAW_PALETTE[0];   // matches the first (selected) dot = SCHOOL.primary
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER - two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm - used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

    doc.setFontSize(8);   var coLines = doc.splitTextToSize('Correcto: '+corr, TW-18);
    doc.setFontSize(7.5); var exLines = doc.splitTextToSize('Solución: '+expRaw, TW-18).slice(0,4);
    var ansBoxH = 8 + chLines.length*5.5 + coLines.length*5 + exLines.length*5 + 6;
    doc.setFillColor(isOk?232:255, isOk?240:232, isOk?232:228);
    doc.roundedRect(M,wy,TW,ansBoxH,2,2,'F');
    doc.setFillColor(isOk?26:176, isOk?106:48, isOk?74:16);
    doc.circle(M+7, wy+8, 3.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(9); doc.setFont('helvetica','bold');
    doc.text(isOk?'✓':'✗', M+5.2, wy+10.5);
    var ay = wy+7;
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','bold');
    chLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5.5); });
    ay += chLines.length*5.5 + 3;
    doc.setTextColor(26,106,74); doc.setFontSize(8); doc.setFont('helvetica','normal');
    coLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    ay += coLines.length*5 + 3;
    doc.setTextColor(90,85,80); doc.setFontSize(7.5);
    exLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    wy += ansBoxH + 5;

    doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
    doc.setFontSize(7); doc.setFont('helvetica','bold');
    doc.rect(M,wy,TW,8,'F'); doc.text('TRABAJO DEL ALUMNO', M+4, wy+5.5);
    wy += 11;

    var dc = document.getElementById('dc'+i);
    if (dc) {
      try {
        var imgD = dc.toDataURL('image/png');
        var ar   = dc.height / dc.width;
        var iw   = TW;
        var ih   = Math.min(iw * ar, 68);
        doc.addImage(imgD, 'PNG', M, wy, iw, ih);
        wy += ih + 4;
      } catch(e) {}
    }

    var ta = document.getElementById('ta'+i);
    if (ta && ta.value.trim()) {
      if (wy > PH-30) { doc.addPage(); wy = 20; }
      doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('courier','normal');
      var taLines = doc.splitTextToSize(ta.value, TW);
      taLines.slice(0,16).forEach(function(ln) {
        if (wy > PH-15) { doc.addPage(); wy = 20; }
        doc.text(ln, M, wy); wy += 5;
      });
      wy += 2;
    }

    var pp = document.getElementById('pp'+i);
    if (pp && pp.src && pp.src.indexOf('data:') === 0) {
      if (wy > PH-55) { doc.addPage(); wy = 20; }
      try { doc.addImage(pp.src, 'JPEG', M, wy, TW, 68); wy += 72; } catch(e) {}
    }
  }

  // ── Footer on every page ──
  var pages = doc.internal.getNumberOfPages();
  for (var p = 1; p <= pages; p++) {
    doc.setPage(p);
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0, PH-3, PW, 3, 'F');
    doc.setTextColor(130,140,160); doc.setFontSize(6.5); doc.setFont('helvetica','normal');
    doc.text(name+'  ·  '+group+'  ·  Código: '+code+'  ·  Página '+p+'/'+pages,
      PW/2, PH-5, {align:'center'});
  }

  // ── SAVE / SHARE - iOS-safe download (LIAXA iOS PDF fix, Rule 12) ─────────
  //   iOS Safari ignores the <a download> attribute (and doc.save() relies on
  //   it), so on iPhone/iPad a plain download fails silently. We branch:
  //     • iOS  → native share sheet (→ "Save to Files"); if unavailable, open
  //              the PDF inline so the student can tap Safari's own Share.
  //     • else → <a download> click (works on desktop + Android).
  //   The whole function runs synchronously off the tap (no await above), which
  //   is what lets iOS accept navigator.share(). Do NOT add an await before this.
  // ──────────────────────────────────────────────────────────────────────────
  var _fname   = 'cneyt2b_t04_g01_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf';
  var _pdfBlob = doc.output('blob');

  function _restorePdfBtn(){ btn.innerHTML = '⬇ &nbsp;' + t('btn-pdf'); btn.disabled = false; }
  function _openPdfInline(b){
    var u = URL.createObjectURL(b);
    var w = window.open(u, '_blank');
    if (!w) { window.location.href = u; }   // popup blocked → same tab
    setTimeout(function(){ URL.revokeObjectURL(u); }, 60000);
  }

  // iPadOS 13+ reports as "MacIntel" with a touch screen, so test for that too.
  var _isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
               (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  if (_isIOS) {
    var _pdfFile = new File([_pdfBlob], _fname, { type:'application/pdf' });
    if (navigator.canShare && navigator.canShare({ files:[_pdfFile] })) {
      navigator.share({ files:[_pdfFile], title:_fname })
        .then(_restorePdfBtn)
        .catch(function(e){
          if (e && e.name === 'AbortError') { _restorePdfBtn(); return; } // cancelled
          _openPdfInline(_pdfBlob); _restorePdfBtn();
        });
      return;
    }
    _openPdfInline(_pdfBlob); _restorePdfBtn();   // older iOS: open inline
    return;
  }

  // Desktop + Android: the native download works.
  var _dlUrl = URL.createObjectURL(_pdfBlob);
  var _dlA   = document.createElement('a');
  _dlA.href  = _dlUrl; _dlA.download = _fname;
  document.body.appendChild(_dlA); _dlA.click();
  setTimeout(function(){ document.body.removeChild(_dlA); URL.revokeObjectURL(_dlUrl); }, 200);
  _restorePdfBtn();
}

/* ================================================
   buildLesson - OVERRIDE IN EACH GUIDE
   ================================================ */
function buildLesson(rng) {
  var LB = document.getElementById('lessonBody');
  LB.innerHTML = '';
  problems = [];

  /* ============================================================
     HELPERS
     ============================================================ */
  function T(o){
    if (o === undefined || o === null) return '';
    if (typeof o === 'string' || typeof o === 'number') return o;
    if (Object.prototype.toString.call(o) === '[object Array]') return o;
    return (o[LANG] !== undefined ? o[LANG] : o.es);
  }
  function L(es, en){ return LANG === 'en' ? en : es; }
  function shufA(arr){
    var a = arr.slice(), i, j, tm;
    for (i = a.length - 1; i > 0; i--){ j = Math.floor(rng()*(i+1)); tm = a[i]; a[i] = a[j]; a[j] = tm; }
    return a;
  }
  function one(pool){ return pool[Math.floor(rng()*pool.length)]; }
  function ri(lo, hi){ return lo + Math.floor(rng()*(hi - lo + 1)); }
  function f1(x){ return (Math.round(x*10)/10).toFixed(1); }
  function fmtN(x){ return String(Math.round(x)).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
  function sec(tag, title, html){
    var d = document.createElement('div');
    d.className = 'section';
    d.innerHTML = '<div class="stag">' + tag + '</div><h2>' + title + '</h2>' + (html || '');
    LB.appendChild(d);
    return d;
  }
  function addProb(spec){
    var so  = shufA(T(spec.options));
    var cor = T(spec.correct);
    problems.push({
      title: T(spec.title),
      questionText: T(spec.q),
      fn: '',
      hint: T(spec.hint),
      explanation: T(spec.exp),
      options: so,
      correctIdx: so.indexOf(cor),
      showWork: !!spec.showWork,
      studentChoice: null,
      pendingChoice: null
    });
    buildOneCard(problems[problems.length-1], problems.length-1);
  }
  function widget(kind){
    var d = document.createElement('div');
    d.className = kind + 'wrap section iwbox';
    d.setAttribute('data-widget', kind);
    d.id = 'w' + kind;
    LB.appendChild(d);
    return d;
  }

  /* ============================================================
     SECCION 1 - Reservorios, flujos y tiempo de residencia
     ============================================================ */
  sec(L('Ciclos biogeoquímicos', 'Biogeochemical cycles'),
      L('Reservorios, flujos y tiempo de residencia', 'Reservoirs, fluxes and residence time'),
      '<p>' + L(
        'Un ciclo biogeoquímico describe el recorrido de un elemento entre los grandes compartimentos del planeta: atmósfera, hidrosfera, litosfera y biosfera. Cada compartimento funciona como un reservorio que guarda una cantidad medible del elemento, y cada proceso que lo traslada de un reservorio a otro constituye un flujo, expresado como masa por unidad de tiempo.',
        'A biogeochemical cycle describes the path an element follows among the major compartments of the planet: atmosphere, hydrosphere, lithosphere and biosphere. Each compartment works as a reservoir holding a measurable amount of the element, and every process that moves it from one reservoir to another is a flux, expressed as mass per unit of time.') + '</p>' +
      '<p>' + L(
        'Cuando las entradas igualan a las salidas, el reservorio se encuentra en estado estacionario: su contenido permanece constante aunque el material siga circulando sin detenerse. El cociente entre el contenido del reservorio y el flujo que lo abandona define el tiempo de residencia, es decir la permanencia media de un átomo en ese compartimento. Un mismo elemento puede residir unos días en la atmósfera y decenas de millones de años en una roca sedimentaria.',
        'When inputs equal outputs the reservoir is in steady state: its content stays constant even though material keeps circulating without pause. The ratio between the reservoir content and the flux leaving it defines the residence time, that is, the average time an atom stays in that compartment. The same element may reside a few days in the atmosphere and tens of millions of years inside a sedimentary rock.') + '</p>' +
      '<div class="callout"><p><strong>' + L('Idea clave.', 'Key idea.') + '</strong> ' + L(
        'La materia no se crea ni se destruye: se redistribuye. Un desequilibrio sostenido entre entradas y salidas no hace desaparecer al elemento, lo acumula en otro reservorio.',
        'Matter is neither created nor destroyed: it is redistributed. A sustained imbalance between inputs and outputs does not make the element disappear, it accumulates it somewhere else.') + '</p></div>');

  /* ---------- WIDGET 1 - balance de un reservorio ---------- */
  (function buildBalance(){
    var ROUNDS = [
      { name:{ es:'Carbono de la atmósfera', en:'Carbon in the atmosphere' },
        unit:{ es:'Pg de C', en:'Pg of C' },
        flux:{ es:'Pg de C al año', en:'Pg of C per year' },
        inn:{ es:'Entradas: respiración, descomposición y combustión', en:'Inputs: respiration, decomposition and combustion' },
        outl:{ es:'Salidas: fotosíntesis y absorción oceánica', en:'Outputs: photosynthesis and ocean uptake' },
        res: 800 + 10*ri(0,10), flow: 210 + 5*ri(0,6) },
      { name:{ es:'Nitrógeno mineral de un suelo agrícola', en:'Mineral nitrogen in an agricultural soil' },
        unit:{ es:'kg de N por hectárea', en:'kg of N per hectare' },
        flux:{ es:'kg de N por hectárea al año', en:'kg of N per hectare per year' },
        inn:{ es:'Entradas: fijación biológica y fertilización', en:'Inputs: biological fixation and fertiliser' },
        outl:{ es:'Salidas: cosecha, lixiviación y desnitrificación', en:'Outputs: harvest, leaching and denitrification' },
        res: 3000 + 100*ri(0,10), flow: 120 + 10*ri(0,6) },
      { name:{ es:'Agua almacenada en un lago', en:'Water stored in a lake' },
        unit:{ es:'hm³', en:'hm³' },
        flux:{ es:'hm³ al año', en:'hm³ per year' },
        inn:{ es:'Entradas: lluvia directa y afluentes', en:'Inputs: direct rainfall and tributaries' },
        outl:{ es:'Salidas: desagüe y evaporación', en:'Outputs: outflow and evaporation' },
        res: 400 + 20*ri(0,10), flow: 90 + 5*ri(0,8) }
    ];
    var offs = [ (rng() < 0.5 ? -1 : 1) * (18 + ri(0,12)),
                 (rng() < 0.5 ? -1 : 1) * (18 + ri(0,12)),
                 (rng() < 0.5 ? -1 : 1) * (18 + ri(0,12)) ];
    var st = { i:0, out:0, tries:0, solved:false, done:false };
    var w = widget('balance');
    function R(){ return ROUNDS[st.i]; }
    function tag(){ return '<div class="iw-tag">' + L('Balance de un reservorio','Reservoir balance') + '</div>'; }

    function paint(){
      var r = R(), neto = r.flow - st.out, mx = r.flow + 45;
      document.getElementById('balVal').textContent = st.out;
      document.getElementById('balOutNum').textContent = st.out;
      document.getElementById('balFillIn').style.width  = Math.min(100, r.flow/mx*100) + '%';
      document.getElementById('balFillOut').style.width = Math.min(100, st.out/mx*100) + '%';
      document.getElementById('balNeto').textContent = (neto > 0 ? '+' : '') + neto;
      document.getElementById('balRes').textContent  = st.out > 0 ? f1(r.res/st.out) : '0';
      if (st.solved) return;
      var fb = document.getElementById('balFb');
      if (neto > 0) fb.innerHTML = L('El reservorio gana ' + neto + ' ' + T(r.flux) + ': las salidas todavía no compensan a las entradas.',
                                     'The reservoir gains ' + neto + ' ' + T(r.flux) + ': outputs do not yet match inputs.');
      else if (neto < 0) fb.innerHTML = L('El reservorio pierde ' + Math.abs(neto) + ' ' + T(r.flux) + ': las salidas superan a las entradas.',
                                          'The reservoir loses ' + Math.abs(neto) + ' ' + T(r.flux) + ': outputs exceed inputs.');
      else fb.innerHTML = L('Entradas y salidas coinciden. Comprueba el resultado.',
                            'Inputs and outputs match. Check the result.');
    }

    function shell(){
      var r = R();
      w.innerHTML = tag() +
        '<div class="iw-sub">' + L('Mueve el control hasta que el reservorio deje de ganar y de perder materia.',
                                   'Move the control until the reservoir stops gaining and losing matter.') + '</div>' +
        '<div class="wprog">' + L('Escenario ','Scenario ') + (st.i+1) + ' / ' + ROUNDS.length + '</div>' +
        '<div class="cls-card">' + T(r.name) + '</div>' +
        '<div class="dataline">' + L('Contenido: ','Content: ') + fmtN(r.res) + ' ' + T(r.unit) +
          '  ·  ' + T(r.inn) + ' = ' + r.flow + ' ' + T(r.flux) + '</div>' +
        '<div class="bal-row"><span class="bal-lbl">' + T(r.outl) + '</span>' +
          '<input class="bal-slider" id="balSl" type="range" min="' + (r.flow-45) + '" max="' + (r.flow+45) + '" step="1" value="' + st.out + '" oninput="balSlide(this.value)">' +
          '<span class="bal-val" id="balVal">' + st.out + '</span></div>' +
        '<div class="bal-bars">' +
          '<div class="bal-bar"><span class="bal-name">' + L('Entradas','Inputs') + '</span><span class="bal-track"><span class="bal-fill in" id="balFillIn"></span></span><span class="bal-num">' + r.flow + '</span></div>' +
          '<div class="bal-bar"><span class="bal-name">' + L('Salidas','Outputs') + '</span><span class="bal-track"><span class="bal-fill out" id="balFillOut"></span></span><span class="bal-num" id="balOutNum">' + st.out + '</span></div>' +
        '</div>' +
        '<div class="bal-metrics">' +
          '<div class="bal-metric"><span class="bal-mlbl">' + L('Cambio anual','Yearly change') + '</span><span class="bal-mval" id="balNeto"></span></div>' +
          '<div class="bal-metric"><span class="bal-mlbl">' + L('Residencia (años)','Residence (years)') + '</span><span class="bal-mval" id="balRes"></span></div>' +
        '</div>' +
        '<div class="rfb" id="balFb"></div>' +
        '<button class="rverify-btn" id="balBtn">' + L('Comprobar','Check') + '</button>';
      document.getElementById('balBtn').onclick = check;
      paint();
    }

    function done(){
      w.innerHTML = tag() +
        '<div class="cls-done">' + L('Tres reservorios equilibrados','Three reservoirs balanced') + '</div>' +
        '<div class="rfb">' + L('En los tres casos la condición fue la misma: salida igual a entrada. Lo que cambia entre un ciclo y otro es el tiempo de residencia, porque depende de qué tan grande es el reservorio frente al flujo que lo atraviesa.',
                                'In all three cases the condition was the same: output equal to input. What changes from one cycle to another is the residence time, because it depends on how large the reservoir is compared with the flux passing through it.') + '</div>';
    }

    function next(){
      st.i++;
      if (st.i >= ROUNDS.length) { st.done = true; done(); return; }
      st.out = ROUNDS[st.i].flow + offs[st.i];
      st.tries = 0; st.solved = false;
      shell();
    }

    function check(){
      var r = R(), neto = r.flow - st.out, fb = document.getElementById('balFb'), btn = document.getElementById('balBtn');
      if (Math.abs(neto) <= 1){
        st.solved = true;
        fb.innerHTML = '<span class="okmsg">' + L('Estado estacionario. Con esa salida, cada átomo permanece en promedio ' + f1(r.res/st.out) + ' años en el reservorio.',
                                                  'Steady state. With that output, each atom stays on average ' + f1(r.res/st.out) + ' years in the reservoir.') + '</span>';
        btn.textContent = (st.i === ROUNDS.length-1) ? L('Terminar','Finish') : L('Siguiente escenario','Next scenario');
        btn.onclick = next;
        return;
      }
      st.tries++;
      if (st.tries >= 3){
        st.out = r.flow;
        document.getElementById('balSl').value = st.out;
        st.solved = true;
        paint();
        fb.innerHTML = L('El equilibrio se alcanza cuando la salida iguala a la entrada: ' + r.flow + ' ' + T(r.flux) + '. La residencia queda en ' + f1(r.res/r.flow) + ' años.',
                         'Balance is reached when the output equals the input: ' + r.flow + ' ' + T(r.flux) + '. Residence time works out to ' + f1(r.res/r.flow) + ' years.');
        btn.textContent = (st.i === ROUNDS.length-1) ? L('Terminar','Finish') : L('Siguiente escenario','Next scenario');
        btn.onclick = next;
        return;
      }
      fb.innerHTML = '<span class="badmsg">' + (neto > 0
        ? L('Todavía se acumula. Aumenta la salida hasta que el cambio anual llegue a cero.',
            'It is still accumulating. Increase the output until the yearly change reaches zero.')
        : L('Ahora se vacía. Reduce la salida hasta que el cambio anual llegue a cero.',
            'Now it is draining. Reduce the output until the yearly change reaches zero.')) + '</span>';
    }

    window.balSlide = function(v){ var el = document.getElementById('balSl'); if (!el) return; if (st.solved || st.done) { el.value = st.out; return; } st.out = parseInt(v,10); paint(); };
    st.out = ROUNDS[0].flow + offs[0];
    shell();
  })();

  /* ---------- PROBLEMA 1 ---------- */
  (function(){
    var lam  = 24 + ri(0,4);
    var prec = 960 + 20*ri(0,4);
    var dias = Math.round(365*lam/prec);
    var inv  = Math.round(prec/lam);
    var Rlag = 3600 + 200*ri(0,5);
    var Ein  = 500 + 20*ri(0,5);
    var Sout = Ein - (100 + 10*ri(0,4));
    var acc  = Ein - Sout;
    addProb(one([
      {
        title: { es:'Agua en el aire', en:'Water in the air' },
        showWork: true,
        q: { es:'El vapor de agua contenido en la atmósfera equivale a una lámina de ' + lam + ' mm repartida sobre toda la superficie terrestre, y la precipitación global retira cada año una lámina de ' + fmtN(prec) + ' mm. ¿Cuánto tiempo permanece en promedio una molécula de agua en la atmósfera?',
             en:'The water vapour held in the atmosphere is equivalent to a layer of ' + lam + ' mm spread over the whole surface of the Earth, and global precipitation removes a layer of ' + fmtN(prec) + ' mm every year. How long does a water molecule stay in the atmosphere on average?' },
        options: { es:['Cerca de ' + dias + ' días','Cerca de ' + inv + ' años','Cerca de ' + inv + ' días','Cerca de ' + lam + ' semanas'],
                   en:['About ' + dias + ' days','About ' + inv + ' years','About ' + inv + ' days','About ' + lam + ' weeks'] },
        correct: { es:'Cerca de ' + dias + ' días', en:'About ' + dias + ' days' },
        hint: { es:'Divide lo que está almacenado entre el flujo que lo retira cada año y convierte después esa fracción de año a días.',
                en:'Divide what is stored by the flux that removes it each year, then convert that fraction of a year into days.' },
        exp: { es:'Tiempo de residencia = contenido / flujo de salida = ' + lam + ' mm entre ' + fmtN(prec) + ' mm al año, es decir ' + (Math.round(lam/prec*1000)/1000) + ' años, que equivalen a unos ' + dias + ' días. Por eso el vapor atmosférico se renueva por completo decenas de veces al año.',
               en:'Residence time = content / output flux = ' + lam + ' mm divided by ' + fmtN(prec) + ' mm per year, that is ' + (Math.round(lam/prec*1000)/1000) + ' years, roughly ' + dias + ' days. This is why atmospheric vapour is renewed completely dozens of times a year.' }
      },
      {
        title: { es:'Nitrógeno que se acumula', en:'Nitrogen building up' },
        showWork: true,
        q: { es:'Un lago contiene ' + fmtN(Rlag) + ' toneladas de nitrógeno disuelto. Cada año recibe ' + Ein + ' toneladas desde la cuenca agrícola que lo rodea y su desagüe exporta ' + Sout + ' toneladas. Si el patrón se mantiene, ¿en cuántos años su contenido de nitrógeno habrá aumentado un 10%?',
             en:'A lake holds ' + fmtN(Rlag) + ' tonnes of dissolved nitrogen. Each year it receives ' + Ein + ' tonnes from the surrounding farmland and its outlet exports ' + Sout + ' tonnes. If the pattern holds, in how many years will its nitrogen content have risen by 10%?' },
        options: { es:[f1(0.1*Rlag/acc) + ' años', f1(0.1*Rlag/Ein) + ' años', f1(0.1*Rlag/Sout) + ' años', f1(Rlag/acc) + ' años'],
                   en:[f1(0.1*Rlag/acc) + ' years', f1(0.1*Rlag/Ein) + ' years', f1(0.1*Rlag/Sout) + ' years', f1(Rlag/acc) + ' years'] },
        correct: { es:f1(0.1*Rlag/acc) + ' años', en:f1(0.1*Rlag/acc) + ' years' },
        hint: { es:'Lo que decide la acumulación no es cada flujo por separado, sino la diferencia entre lo que entra y lo que sale cada año.',
                en:'What drives the build up is not each flux on its own, but the difference between what comes in and what leaves each year.' },
        exp: { es:'Acumulación anual = ' + Ein + ' menos ' + Sout + ' = ' + acc + ' toneladas. El 10% del reservorio son ' + f1(0.1*Rlag) + ' toneladas, así que el tiempo necesario es ' + f1(0.1*Rlag) + ' entre ' + acc + ' = ' + f1(0.1*Rlag/acc) + ' años.',
               en:'Yearly build up = ' + Ein + ' minus ' + Sout + ' = ' + acc + ' tonnes. Ten per cent of the reservoir is ' + f1(0.1*Rlag) + ' tonnes, so the time needed is ' + f1(0.1*Rlag) + ' divided by ' + acc + ' = ' + f1(0.1*Rlag/acc) + ' years.' }
      }
    ]));
  })();

  /* ============================================================
     SECCION 2 - Ciclo del carbono
     ============================================================ */

  (function buildRoute(){

      { title:{ es:'De la atmósfera al suelo y de vuelta', en:'From the atmosphere to the soil and back' },
        steps:[
          { es:'Fotosíntesis de un encino: el CO2 del aire queda fijado en glucosa', en:'Photosynthesis in an oak: CO2 from the air is fixed into glucose' },
          { es:'Herbivoría: el carbono pasa a los tejidos de un venado', en:'Herbivory: the carbon moves into the tissues of a deer' },
          { es:'Muerte del venado: sus restos se incorporan a la materia orgánica del suelo', en:'Death of the deer: its remains join the organic matter of the soil' },
          { es:'Respiración de hongos y bacterias: el carbono vuelve al aire como CO2', en:'Respiration of fungi and bacteria: the carbon returns to the air as CO2' }
        ],
        decoys:[
          { es:'Combustión de carbón mineral en una central térmica', en:'Combustion of coal in a power station' },
          { es:'Precipitación de carbonato de calcio en el fondo marino', en:'Precipitation of calcium carbonate on the sea floor' }
        ],
        why:{ es:'Todo el recorrido ocurre en la vía rápida: el mismo átomo puede volver a la atmósfera en pocos años.',
              en:'The whole route runs along the fast track: the same atom can return to the atmosphere within a few years.' } },
      { title:{ es:'De la biosfera al yacimiento', en:'From the biosphere to the deposit' },
        steps:[
          { es:'Fotosíntesis del fitoplancton en la superficie del mar', en:'Photosynthesis of phytoplankton at the sea surface' },
          { es:'Muerte y hundimiento de la materia orgánica en un fondo sin oxígeno', en:'Death and sinking of organic matter into an oxygen free sea floor' },
          { es:'Sepultamiento bajo sedimentos y transformación en hidrocarburo durante millones de años', en:'Burial under sediment and transformation into hydrocarbon over millions of years' },
          { es:'Extracción y combustión del hidrocarburo en un motor', en:'Extraction and combustion of the hydrocarbon in an engine' }
        ],
        decoys:[
          { es:'Herbivoría de un saltamontes sobre hojas de zacate', en:'A grasshopper feeding on grass blades' },
          { es:'Amonificación de restos vegetales en el suelo', en:'Ammonification of plant remains in the soil' }
        ],
        why:{ es:'El almacenamiento tomó millones de años y la liberación tomó minutos: esa asimetría define la alteración humana del ciclo.',
              en:'Storage took millions of years and release took minutes: that asymmetry defines the human alteration of the cycle.' } },
      { title:{ es:'Del aire a la roca caliza', en:'From the air to limestone' },
        steps:[
          { es:'Disolución del CO2 atmosférico en el agua superficial del océano', en:'Dissolution of atmospheric CO2 into surface ocean water' },
          { es:'Fotosíntesis del fitoplancton y formación de conchas de carbonato', en:'Phytoplankton photosynthesis and formation of carbonate shells' },
          { es:'Hundimiento de restos y conchas hacia el fondo marino', en:'Sinking of remains and shells towards the sea floor' },
          { es:'Compactación de los sedimentos y formación de roca caliza', en:'Compaction of the sediment and formation of limestone' }
        ],
        decoys:[
          { es:'Combustión de gas natural en una estufa', en:'Combustion of natural gas in a stove' },
          { es:'Fijación de nitrógeno por bacterias del género Rhizobium', en:'Nitrogen fixation by bacteria of the genus Rhizobium' }
        ],
        why:{ es:'Este recorrido termina en el reservorio más lento del ciclo: el carbono puede permanecer ahí decenas de millones de años.',
              en:'This route ends in the slowest reservoir of the cycle: carbon can stay there for tens of millions of years.' } }
    ];
    var RT = one(ROUTES);
    var CHIPS = shufA(
      RT.steps.map(function(s,i){ return { txt:s, pos:i }; })
      .concat(RT.decoys.map(function(s){ return { txt:s, pos:-1 }; }))
    );
    var st = { slots:[null,null,null,null], tries:0, done:false };
    var w = widget('sequence');

    function render(){
      var pool = CHIPS.map(function(c, ci){
        if (st.slots.indexOf(ci) !== -1) return '';
        return '<div class="seq-chip" onclick="seqTap(' + ci + ')">' + T(c.txt) + '</div>';
      }).join('');
      var slots = st.slots.map(function(ci, p){
        var cls = 'seq-slot' + (ci === null ? '' : ' full') + (st.done ? ' good' : '');
        var txt = ci === null ? L('Paso ','Step ') + (p+1) : T(CHIPS[ci].txt);
        return '<div class="' + cls + '" onclick="seqSlot(' + p + ')"><span class="seq-step">' + (p+1) + '</span>' + txt + '</div>';
      }).join('<span class="seq-arrow">&#8595;</span>');
      w.innerHTML =
        '<div class="iw-tag">' + L('Ruta de un átomo de carbono','Route of a carbon atom') + '</div>' +
        '<div class="iw-sub">' + L('Coloca en orden los cuatro procesos que llevan al átomo por este recorrido. Toca un paso ya colocado para devolverlo.',
                                   'Place the four processes that carry the atom along this route in order. Tap a placed step to send it back.') + '</div>' +
        '<div class="cls-card">' + T(RT.title) + '</div>' +
        '<div class="seq-slots">' + slots + '</div>' +
        '<div class="seq-pool">' + (pool.replace(/\s+/g,'') === '' ? '<span class="seq-empty">' + L('Ya colocaste todos los procesos disponibles.','You have placed every available process.') + '</span>' : pool) + '</div>' +
        '<div class="rfb" id="seqFb"></div>' +
        (st.done ? '' : '<button class="rverify-btn" id="seqBtn">' + L('Verificar la ruta','Check the route') + '</button>');
      var b = document.getElementById('seqBtn');
      if (b) b.onclick = check;
    }

    function check(){
      var fb = document.getElementById('seqFb');
      if (st.slots.indexOf(null) !== -1){
        fb.innerHTML = '<span class="badmsg">' + L('Faltan pasos por colocar: la ruta necesita los cuatro.',
                                                   'Some steps are still missing: the route needs all four.') + '</span>';
        return;
      }
      var okAll = st.slots.every(function(ci, p){ return CHIPS[ci].pos === p; });
      if (okAll){
        st.done = true; render();
        document.getElementById('seqFb').innerHTML = '<span class="okmsg">' + L('Ruta correcta. ','Correct route. ') + '</span>' + T(RT.why);
        return;
      }
      st.tries++;
      if (st.tries >= 3){
        st.slots = [0,1,2,3].map(function(p){
          for (var ci = 0; ci < CHIPS.length; ci++) if (CHIPS[ci].pos === p) return ci;
          return null;
        });
        st.done = true; render();
        document.getElementById('seqFb').innerHTML = L('Esta es la ruta completa. ','This is the full route. ') + T(RT.why);
        return;
      }
      var bad = 0;
      for (var p = 0; p < 4; p++){ if (CHIPS[st.slots[p]].pos !== p) { bad = p; break; } }
      fb.innerHTML = '<span class="badmsg">' + L('El paso ' + (bad+1) + ' no encaja todavía. Pregúntate en qué reservorio queda el carbono al terminar el paso anterior y qué proceso puede sacarlo de ahí.',
                                                 'Step ' + (bad+1) + ' does not fit yet. Ask yourself which reservoir the carbon sits in once the previous step ends, and which process can move it out of there.') + '</span>';
    }

    window.seqTap = function(ci){
      if (st.done) return;
      if (st.slots.indexOf(ci) !== -1) return;
      var empty = st.slots.indexOf(null);
      if (empty === -1) return;
      st.slots[empty] = ci;
      render();
    };
    window.seqSlot = function(p){
      if (st.done) return;
      if (st.slots[p] === null) return;
      st.slots[p] = null;
      render();
    };
    render();
  })();

                     'Compare the form that goes in with the one that comes out: ammonium, nitrate, or nitrogen inside a living body.');
      fb.innerHTML = '<span class="badmsg">' + nudge + '</span>';
    };
    render();
  })();

  (function buildHydro(){
    var CUENCAS = [
      { name:{ es:'Cuenca forestal de montaña', en:'Forested mountain catchment' }, p:900 + 50*ri(0,4), etf:0.58 },
      { name:{ es:'Cuenca agrícola de valle', en:'Farmed valley catchment' },       p:700 + 50*ri(0,4), etf:0.62 },
      { name:{ es:'Cuenca urbanizada de ladera', en:'Urbanised hillside catchment' }, p:800 + 50*ri(0,4), etf:0.40 }
    ];
    var ROUNDS = CUENCAS.map(function(c){
      var et = Math.round(c.p*c.etf/10)*10;
      var inf = 10*ri(6, 16);
      if (c.p - et - inf < 60) inf = 60;
      return { name:c.name, p:c.p, et:et, inf:inf, q:c.p - et - inf };
    });
    var st = { i:0, inf:0, tries:0, solved:false, done:false };
    var w = widget('slider');
    function R(){ return ROUNDS[st.i]; }
    function tag(){ return '<div class="iw-tag">' + L('Reparto de la lluvia','Splitting the rainfall') + '</div>'; }

    function paint(){
      var r = R(), q = r.p - r.et - st.inf, mx = r.p;
      document.getElementById('hydVal').textContent = st.inf;
      document.getElementById('hydInfNum').textContent = st.inf;
      document.getElementById('hydQNum').textContent = q;
      document.getElementById('hydFillEt').style.width  = Math.max(0, Math.min(100, r.et/mx*100)) + '%';
      document.getElementById('hydFillInf').style.width = Math.max(0, Math.min(100, st.inf/mx*100)) + '%';
      document.getElementById('hydFillQ').style.width   = Math.max(0, Math.min(100, q/mx*100)) + '%';
      if (st.solved) return;
      var fb = document.getElementById('hydFb'), d = q - r.q;
      if (d === 0) fb.innerHTML = L('La escorrentía calculada coincide con el aforo. Comprueba el resultado.',
                                    'The calculated runoff matches the gauge reading. Check the result.');
      else if (d > 0) fb.innerHTML = L('Tu reparto envía ' + d + ' mm de más al río.',
                                       'Your split sends ' + d + ' mm too much to the river.');
      else fb.innerHTML = L('Tu reparto envía ' + Math.abs(d) + ' mm de menos al río.',
                            'Your split sends ' + Math.abs(d) + ' mm too little to the river.');
    }

    function shell(){
      var r = R();
      w.innerHTML = tag() +
        '<div class="iw-sub">' + L('La lluvia solo tiene tres destinos. Ajusta la recarga del acuífero hasta que la escorrentía que resulta coincida con la que midió el aforo del río.',
                                   'Rainfall has only three destinations. Adjust the aquifer recharge until the runoff that follows matches the reading of the river gauge.') + '</div>' +
        '<div class="wprog">' + L('Cuenca ','Catchment ') + (st.i+1) + ' / ' + ROUNDS.length + '</div>' +
        '<div class="cls-card">' + T(r.name) + '</div>' +
        '<div class="dataline">' + L('Precipitación: ','Precipitation: ') + r.p + ' mm  ·  ' + L('Evapotranspiración medida: ','Measured evapotranspiration: ') + r.et + ' mm  ·  ' + L('Aforo del río: ','River gauge: ') + r.q + ' mm</div>' +
        '<div class="bal-row"><span class="bal-lbl">' + L('Recarga del acuífero','Aquifer recharge') + '</span>' +
          '<input class="bal-slider" id="hydSl" type="range" min="0" max="' + (r.p - r.et) + '" step="5" value="' + st.inf + '" oninput="hydSlide(this.value)">' +
          '<span class="bal-val" id="hydVal">' + st.inf + '</span></div>' +
        '<div class="bal-bars">' +
          '<div class="bal-bar"><span class="bal-name">' + L('Evapotranspiración','Evapotranspiration') + '</span><span class="bal-track"><span class="bal-fill alt" id="hydFillEt"></span></span><span class="bal-num">' + r.et + '</span></div>' +
          '<div class="bal-bar"><span class="bal-name">' + L('Infiltración','Infiltration') + '</span><span class="bal-track"><span class="bal-fill in" id="hydFillInf"></span></span><span class="bal-num" id="hydInfNum">' + st.inf + '</span></div>' +
          '<div class="bal-bar"><span class="bal-name">' + L('Escorrentía','Runoff') + '</span><span class="bal-track"><span class="bal-fill out" id="hydFillQ"></span></span><span class="bal-num" id="hydQNum">0</span></div>' +
        '</div>' +
        '<div class="rfb" id="hydFb"></div>' +
        '<button class="rverify-btn" id="hydBtn">' + L('Comprobar','Check') + '</button>';
      document.getElementById('hydBtn').onclick = check;
      paint();
    }

    function done(){
      w.innerHTML = tag() +
        '<div class="cls-done">' + L('Tres cuencas cerradas','Three catchments closed') + '</div>' +
        '<div class="rfb">' + L('Con la misma lluvia, el reparto cambia según la cubierta vegetal y la permeabilidad del terreno: donde la evapotranspiración y la infiltración bajan, la escorrentía sube.',
                                'With the same rainfall the split changes with plant cover and ground permeability: where evapotranspiration and infiltration fall, runoff rises.') + '</div>';
    }

    function next(){
      st.i++;
      if (st.i >= ROUNDS.length) { st.done = true; done(); return; }
      st.inf = 0; st.tries = 0; st.solved = false;
      shell();
    }

    function check(){
      var r = R(), q = r.p - r.et - st.inf, fb = document.getElementById('hydFb'), btn = document.getElementById('hydBtn');
      if (q === r.q){
        st.solved = true;
        fb.innerHTML = '<span class="okmsg">' + L('Balance cerrado: ' + r.et + ' mm de evapotranspiración, ' + st.inf + ' mm de recarga y ' + r.q + ' mm de escorrentía suman los ' + r.p + ' mm de lluvia.',
                                                  'Balance closed: ' + r.et + ' mm of evapotranspiration, ' + st.inf + ' mm of recharge and ' + r.q + ' mm of runoff add up to the ' + r.p + ' mm of rainfall.') + '</span>';
        btn.textContent = (st.i === ROUNDS.length-1) ? L('Terminar','Finish') : L('Siguiente cuenca','Next catchment');
        btn.onclick = next;
        return;
      }
      st.tries++;
      if (st.tries >= 3){
        st.inf = r.inf;
        document.getElementById('hydSl').value = st.inf;
        st.solved = true;
        paint();
        fb.innerHTML = L('La recarga que cierra el balance es de ' + r.inf + ' mm: ' + r.p + ' mm de lluvia menos ' + r.et + ' mm de evapotranspiración menos ' + r.inf + ' mm de infiltración dejan los ' + r.q + ' mm que midió el aforo.',
                         'The recharge that closes the balance is ' + r.inf + ' mm: ' + r.p + ' mm of rain minus ' + r.et + ' mm of evapotranspiration minus ' + r.inf + ' mm of infiltration leaves the ' + r.q + ' mm the gauge recorded.');
        btn.textContent = (st.i === ROUNDS.length-1) ? L('Terminar','Finish') : L('Siguiente cuenca','Next catchment');
        btn.onclick = next;
        return;
      }
      fb.innerHTML = '<span class="badmsg">' + (q > r.q
        ? L('Sobra agua en el río: si aumentas la recarga, la escorrentía baja en la misma medida.',
            'There is too much water in the river: if you raise the recharge, runoff falls by the same amount.')
        : L('Falta agua en el río: si reduces la recarga, la escorrentía sube en la misma medida.',
            'There is too little water in the river: if you lower the recharge, runoff rises by the same amount.')) + '</span>';
    }

    window.hydSlide = function(v){ var el = document.getElementById('hydSl'); if (!el) return; if (st.solved || st.done) { el.value = st.inf; return; } st.inf = parseInt(v,10); paint(); };
    shell();
  })();

  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbykkuJ_apGq3vALIFd4mr3acu81c7K4OKxW-DZ-i52Ceyl3lOanXMdvbS9SIXPrLQBm/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'Ciclos Biogeoquímicos';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
</body>
</html>
