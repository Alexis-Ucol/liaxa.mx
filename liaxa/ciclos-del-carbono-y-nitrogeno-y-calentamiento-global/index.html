      es:'vas a nivelar una balanza entre lo que entra y lo que sale del aire, a adelgazar la manta de gases de una casa cambiando sus prácticas, a acomodar el camino completo del nitrógeno y a buscar la dosis de fertilizante que alimenta al cultivo sin llegar al agua.',
      en:'you are going to level a balance between what goes into the air and what comes out of it, to thin the blanket of gases over a house by changing its habits, to arrange the whole path of nitrogen and to look for the fertiliser dose that feeds the crop without reaching the water.'
    }) + '</p></div>'
  );

  /* ══ CONCEPTO 1 ══ */
  var s1 = sec(
    L({ es:'Concepto 1', en:'Concept 1' }),
    L({ es:'El carbono da vueltas, y el aire lleva el saldo', en:'Carbon goes round, and the air keeps the balance' }),
    '<p>' + L({
      es:'El carbono es el material con el que están hechos los seres vivos: la madera del árbol, el músculo del animal, la cáscara del huevo. Ese carbono viaja por el aire en forma de dióxido de carbono. Las plantas lo toman de ahí y con la luz del sol lo convierten en alimento; al comer, los animales lo pasan a su propio cuerpo. La respiración de plantas, animales y descomponedores devuelve una parte al aire, y lo que queda en los restos vuelve al suelo. A ese ir y venir se le llama ciclo del carbono, y el mar participa en él absorbiendo y soltando enormes cantidades.',
      en:'Carbon is the material living things are made of: the wood of the tree, the muscle of the animal, the shell of the egg. That carbon travels through the air as carbon dioxide. Plants take it from there and with sunlight turn it into food; by eating, animals pass it into their own bodies. The breathing of plants, animals and decomposers returns part of it to the air, and what stays in the remains goes back to the soil. That coming and going is called the carbon cycle, and the sea takes part in it by absorbing and releasing huge amounts.'
    }) + '</p>' +
    '<p>' + L({
      es:'La cantidad de dióxido de carbono del aire se queda igual mientras lo que entra y lo que sale se parezcan. Hay carbono que quedó fuera del ciclo durante millones de años: el de restos enterrados que se volvieron carbón, petróleo y gas. Al sacarlo y quemarlo, ese carbono viejo entra al aire de golpe, y las plantas y el mar no alcanzan a retirarlo al mismo ritmo. Talar bosques empuja en la misma dirección, porque quita justo a los que retiraban carbono. Por eso el saldo del aire lleva más de un siglo subiendo.',
      en:'The amount of carbon dioxide in the air stays the same while what goes in and what comes out match. Some carbon stayed out of the cycle for millions of years: the carbon of buried remains that turned into coal, oil and gas. Taking it out and burning it puts that old carbon into the air all at once, and plants and the sea cannot remove it at the same rate. Clearing forests pushes in the same direction, because it removes the very things that were taking carbon out. That is why the balance of the air has been rising for more than a century.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Fotosíntesis', en:'Photosynthesis' }), L({ es:'saca carbono del aire', en:'takes carbon out of the air' }), L({ es:'la planta lo guarda como alimento y como madera', en:'the plant stores it as food and as wood' })) +
      rcard(L({ es:'Respiración', en:'Breathing' }), L({ es:'devuelve carbono al aire', en:'returns carbon to the air' }), L({ es:'plantas, animales y descomponedores', en:'plants, animals and decomposers' })) +
      rcard(L({ es:'Carbón, petróleo y gas', en:'Coal, oil and gas' }), L({ es:'carbono guardado', en:'stored carbon' }), L({ es:'estuvo enterrado millones de años y vuelve al quemarlo', en:'buried for millions of years, back when burned' })) +
      rcard(L({ es:'Saldo del aire', en:'Balance of the air' }), L({ es:'entradas frente a salidas', en:'inputs against outputs' }), L({ es:'si no empatan, el aire acumula', en:'if they do not match, the air accumulates' })) +
    '</div>'
  );
  wBalanza(rng, widgetHost(s1, 'w_balanza', 'balanza'));
  addProblem(rng, mkP1(rng));
  addProblem(rng, mkP2(rng));

  /* ══ CONCEPTO 2 ══ */
  var s2 = sec(
    L({ es:'Concepto 2', en:'Concept 2' }),
    L({ es:'Una manta que se está volviendo gruesa', en:'A blanket that is getting thick' }),
    '<p>' + L({
      es:'El sol calienta el suelo y el suelo devuelve ese calor hacia arriba. Algunos gases del aire, como el vapor de agua, el dióxido de carbono y el metano, retienen parte de ese calor de salida y lo mantienen abajo. Funcionan como una manta, y sin ella la Tierra sería un lugar helado. El problema no es la manta, es su grosor: cuantos más de esos gases hay, más calor se queda y la temperatura promedio del planeta sube. A ese aumento sostenido se le llama calentamiento global.',
      en:'The sun warms the ground and the ground sends that heat back upwards. Some gases in the air, such as water vapour, carbon dioxide and methane, hold part of that outgoing heat and keep it below. They work like a blanket, and without it the Earth would be a freezing place. The problem is not the blanket, it is its thickness: the more of those gases there are, the more heat stays and the average temperature of the planet rises. That sustained increase is called global warming.'
    }) + '</p>' +
    '<p>' + L({
      es:'La manta engorda por cosas que se hacen todos los días: moverse en vehículos que queman gasolina o diésel, usar electricidad generada quemando combustible, producir comida que después se tira, mandar basura orgánica a un relleno sanitario donde se pudre sin aire y suelta metano. Cada una de esas prácticas de consumo se puede medir en kilogramos de gases al año, y por eso se pueden comparar entre sí. El calor extra no se queda en el termómetro: cambia las lluvias, alarga las sequías, calienta el mar y castiga a quien trabaja al aire libre o vive donde el agua ya escaseaba.',
      en:'The blanket thickens because of things done every day: travelling in vehicles that burn petrol or diesel, using electricity generated by burning fuel, producing food that is later thrown away, sending organic waste to a landfill where it rots without air and releases methane. Each of those consumption habits can be measured in kilograms of gases a year, and that is why they can be compared with one another. The extra heat does not stay in the thermometer: it changes the rains, lengthens the droughts, warms the sea and hits hardest those who work outdoors or live where water was already scarce.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Efecto invernadero', en:'Greenhouse effect' }), L({ es:'calor que no se escapa', en:'heat that does not escape' }), L({ es:'sin él la Tierra sería un sitio helado', en:'without it the Earth would be freezing' })) +
      rcard(L({ es:'Gases que retienen', en:'Gases that hold heat' }), L({ es:'dióxido de carbono y metano', en:'carbon dioxide and methane' }), L({ es:'también vapor de agua y óxido nitroso', en:'also water vapour and nitrous oxide' })) +
      rcard(L({ es:'Grosor de la manta', en:'Thickness of the blanket' }), L({ es:'más gases, más calor', en:'more gases, more heat' }), L({ es:'la temperatura promedio sube', en:'the average temperature rises' })) +
      rcard(L({ es:'Huella de una práctica', en:'Footprint of a habit' }), L({ es:'kilogramos al año', en:'kilograms a year' }), L({ es:'medirla permite comparar y elegir', en:'measuring it allows comparing and choosing' })) +
    '</div>'
  );
  wManta(rng, widgetHost(s2, 'w_manta', 'manta'));
  addProblem(rng, mkP3(rng));
  addProblem(rng, mkP4(rng));

  /* ══ CONCEPTO 3 ══ */
  var s3 = sec(
    L({ es:'Concepto 3', en:'Concept 3' }),
    L({ es:'Nitrógeno de sobra en el aire, y aun así falta', en:'Nitrogen to spare in the air, and still not enough' }),
    '<p>' + L({
      es:'Casi cuatro de cada cinco bocanadas de aire son nitrógeno, y con él se arman las proteínas de todos los seres vivos. Aun así ninguna planta puede usarlo tal como viene: en el aire sus dos partes están unidas con tanta fuerza que la raíz no las separa. El trabajo lo hacen bacterias que viven en el suelo y en las raíces de plantas como el frijol y el chícharo: rompen esa unión y dejan el nitrógeno en una forma que la planta sí absorbe. A ese paso se le llama fijación, y sin él el ciclo no arranca.',
      en:'Nearly four out of every five breaths of air are nitrogen, and proteins of every living thing are built with it. Even so, no plant can use it as it comes: in the air its two parts are joined so strongly that the root cannot separate them. The work is done by bacteria living in the soil and in the roots of plants such as beans and peas: they break that bond and leave the nitrogen in a form the plant does absorb. That step is called fixation, and without it the cycle does not start.'
    }) + '</p>' +
    '<p>' + L({
      es:'De la planta el nitrógeno pasa al animal que la come, y de los restos y desechos regresa al suelo cuando los descomponedores hacen lo suyo. Otras bacterias cierran la vuelta devolviendo nitrógeno al aire. Hace poco más de un siglo se aprendió a hacer en una fábrica lo que hacían solo las bacterias, y así nacieron los fertilizantes. Hoy entra al suelo mucho más nitrógeno aprovechable del que entraba antes, y la parte que la planta no alcanza a tomar no desaparece: se lava con la lluvia hacia arroyos, lagunas y agua subterránea, o sale al aire como óxido nitroso, otro gas que engrosa la manta.',
      en:'From the plant the nitrogen passes to the animal that eats it, and from remains and waste it returns to the soil when decomposers do their work. Other bacteria close the loop by returning nitrogen to the air. A little over a century ago people learned to do in a factory what only bacteria did, and so fertilisers were born. Today far more usable nitrogen enters the soil than before, and the part the plant does not manage to take does not disappear: it washes with the rain into streams, lagoons and groundwater, or leaves into the air as nitrous oxide, another gas that thickens the blanket.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Nitrógeno del aire', en:'Nitrogen of the air' }), L({ es:'abundante pero cerrado', en:'plentiful but locked' }), L({ es:'ninguna planta lo toma tal como viene', en:'no plant takes it as it comes' })) +
      rcard(L({ es:'Fijación', en:'Fixation' }), L({ es:'trabajo de bacterias', en:'the work of bacteria' }), L({ es:'lo dejan en la forma que la raíz absorbe', en:'they leave it in the form the root absorbs' })) +
      rcard(L({ es:'Descomposición', en:'Decomposition' }), L({ es:'los restos lo devuelven', en:'remains give it back' }), L({ es:'el suelo vuelve a tener nitrógeno disponible', en:'the soil has available nitrogen again' })) +
      rcard(L({ es:'Fertilizante', en:'Fertiliser' }), L({ es:'entrada hecha en fábrica', en:'an input made in a factory' }), L({ es:'mete más del que el cultivo alcanza a tomar', en:'adds more than the crop can take' })) +
    '</div>'
  );
  wCiclo(rng, widgetHost(s3, 'w_ciclo', 'ciclo'));
  addProblem(rng, mkP5(rng));
  addProblem(rng, mkP6(rng));

  /* ══ CONCEPTO 4 ══ */
  var s4 = sec(
    L({ es:'Concepto 4', en:'Concept 4' }),
    L({ es:'Lo que sobra termina en el agua, en el aire y en la salud', en:'What is left over ends in the water, the air and our health' }),
    '<p>' + L({
      es:'Una planta tiene un límite: por más nitrógeno que reciba, no crece de más. Pasado ese punto la cosecha ya no sube y el sobrante queda suelto en el suelo, a la espera de la primera lluvia. Parte se filtra hacia el agua subterránea de los pozos y parte corre hacia arroyos y lagunas. Ahí funciona como alimento para las algas, que se multiplican y ponen el agua verde; cuando esas algas mueren, los descomponedores gastan el oxígeno del agua para deshacerlas y los peces se quedan sin poder respirar.',
      en:'A plant has a limit: however much nitrogen it receives, it does not grow beyond it. Past that point the harvest no longer rises and the surplus stays loose in the soil, waiting for the first rain. Part filters down to the groundwater of the wells and part runs off into streams and lagoons. There it works as food for algae, which multiply and turn the water green; when those algae die, decomposers use up the oxygen of the water to break them down and the fish are left unable to breathe.'
    }) + '</p>' +
    '<p>' + L({
      es:'El asunto no se queda en el agua. Del suelo con nitrógeno de sobra sale óxido nitroso, un gas que retiene calor con mucha más fuerza que el dióxido de carbono, así que la agricultura empuja también el calentamiento. Y llega a la salud de las personas: el agua de pozo con demasiados nitratos es peligrosa, sobre todo para los bebés, y el aire de las ciudades con mucho tránsito carga partículas que dañan los pulmones. Ajustar la dosis a lo que el cultivo aprovecha atiende las tres cosas a la vez.',
      en:'The matter does not stay in the water. Soil with nitrogen to spare gives off nitrous oxide, a gas that holds heat far more strongly than carbon dioxide, so farming pushes warming along too. And it reaches the health of people: well water with too much nitrate is dangerous, above all for babies, and the air of cities with heavy traffic carries particles that damage the lungs. Adjusting the dose to what the crop uses deals with all three at once.'
    }) + '</p>'
  );
  wDosis(rng, widgetHost(s4, 'w_dosis', 'dosis'));
  addProblem(rng, mkP7(rng));

  /* ══ CONCEPTO 5 ══ */
  var s5 = sec(
    L({ es:'Concepto 5', en:'Concept 5' }),
    L({ es:'Cada cosa que consumes trae su propio rastro', en:'Everything you consume carries its own trail' }),
    '<p>' + L({
      es:'Detrás de cada cosa que se compra hay un camino: un suelo al que se le puso fertilizante, un motor que quemó combustible para sembrarla, un camión que la trajo, un refrigerador que la mantuvo fría. Ese camino deja rastro en los dos ciclos. Y cuando la comida termina en la basura, el rastro crece dos veces: se pierde todo lo que costó producirla y, al pudrirse sin aire en el relleno sanitario, suelta metano.',
      en:'Behind everything that is bought there is a journey: a soil that received fertiliser, an engine that burned fuel to sow it, a lorry that brought it, a fridge that kept it cold. That journey leaves a trail in both cycles. And when food ends up in the bin, the trail grows twice over: everything it cost to produce is lost and, rotting without air in the landfill, it releases methane.'
    }) + '</p>' +
    '<p>' + L({
      es:'Leer una práctica de consumo es seguir ese rastro hasta el aire, el suelo o el agua, y ponerle números cuando se pueda. Así se ve por qué separar la basura orgánica para hacer composta, comprar lo que de verdad se va a comer, compartir el viaje en coche o ajustar el fertilizante no son gestos sueltos: cada uno corta un pedazo del rastro en un punto distinto de los ciclos.',
      en:'Reading a consumption habit means following that trail to the air, the soil or the water, and putting numbers on it where possible. That is how you see why separating organic waste for compost, buying what will really be eaten, sharing a car journey or adjusting the fertiliser are not loose gestures: each one cuts a piece of the trail at a different point of the cycles.'
    }) + '</p>'
  );
  wRastro(rng, widgetHost(s5, 'w_rastro', 'reflect'));
  addProblem(rng, mkP8(rng));

  /* ══ CIERRE ══ */
  sec(
    L({ es:'Para cerrar', en:'To finish' }),
    L({ es:'Decisiones que se leen con los dos ciclos', en:'Decisions read through both cycles' }),
    '<p>' + L({
      es:'Las siguientes situaciones vienen de casas, escuelas y valles agrícolas. En cada una hay que decidir qué ciclo se está moviendo, hacia dónde va lo que sobra y qué se espera que pase después.',
      en:'The situations below come from homes, schools and farming valleys. In each one you have to decide which cycle is being moved, where the surplus is going and what is expected to happen next.'
    }) + '</p>'
  );
  addProblem(rng, mkP9(rng));
  addProblem(rng, mkP10(rng));
}
</script>

<!-- LIAXA ANALYTICS -->
<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbztwM8nSIbA895DNHtDQGU9fYXDiK9QpxSCUjnBwP1XkAZtJ2B2eIUOgGHmZz8wVQSx/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
