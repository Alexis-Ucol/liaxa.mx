<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Electrones de Valencia y Diagramas de Lewis</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:100px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 76px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Electrones de Valencia y Diagramas de Lewis</div>
    <div class="wcourse" id="wcourse-el">Química · 3° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Electrones de Valencia y Diagramas de Lewis</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="sbtn" id="dlBtn" onclick="generatePDF()" style="max-width:280px;margin:0 auto;">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   CENTRALIZED SCHOOL CONFIG (Rule 16) — ships UNBRANDED (Rule 11).
   The ONLY rebranding point. build_all.py substitutes these exact fields
   (BRAND_FIELDS / RGB_FIELDS / logo*) downstream; :root/dark stay as fallback.
   Neutral defaults below == the static :root/dark values, so unbranded == no-op.
   ══════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:'#545484', primaryDark:'#202033', primaryBg:'#ececf1',
  accent:'#e43c3c', accentBg:'#fbdfdf',
  darkPrimary:'#6f6f9a', darkPrimaryDark:'#9a9ac0', darkPrimaryBg:'#1b1b2b',

    prev.forEach(function(ch, idx){ if(ch!==null && ch!==undefined) confirmMC(idx, ch); });
    if (answeredCount === problems.length && problems.length > 0) {

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {

}

function addProblem(rng, v){
  var idx = problems.length;
  var opts = (v.opts instanceof Array) ? v.opts.slice() : L(v.opts).slice();
  var correctVal = opts[v.ci];
  var sh = shuffle(opts, rng);
  var prob = {
    title: L(v.title),
    questionText: L(v.q),
    fn: '',
    hint: L(v.hint),
    explanation: L(v.exp),
    options: sh,
    correctIdx: sh.indexOf(correctVal),
    showWork: !!v.showWork,
    studentChoice: null,
    pendingChoice: null
  };
  problems.push(prob);
  buildOneCard(prob, idx);
}

  { s:'Ar', z:18, g:18, p:3, sh:[2,8,8],   es:'argón',     en:'argon'      },

];
function elBy(sym){ for (var i = 0; i < ELS.length; i++) if (ELS[i].s === sym) return ELS[i]; return null; }
function nameOf(e){ return L({ es:e.es, en:e.en }); }
function valOf(e){ return e.s === 'He' ? 2 : (e.g <= 2 ? e.g : e.g - 10); }
function coreOf(e){ return e.z - valOf(e); }
function pairsOf(v){ return v > 4 ? v - 4 : 0; }
function loneOf(v){ return v - 2 * pairsOf(v); }
function needOf(v){ return 8 - v; }
function grpOfVal(v){ return v <= 2 ? v : v + 10; }
function ordinal(n){
  var es = ['', 'primera', 'segunda', 'tercera', 'cuarta'];
  var en = ['', 'first', 'second', 'third', 'fourth'];
  return L({ es:es[n], en:en[n] });
}
function numPool(correct, cands){
  var out = [String(correct)], i;
  for (i = 0; i < cands.length && out.length < 4; i++){
    var c = cands[i];
    if (typeof c !== 'number' || !isFinite(c) || c < 0) continue;
    var s = String(c);
    if (out.indexOf(s) < 0) out.push(s);
  }
  var k = 1;
  while (out.length < 4){
    var s2 = String(correct + k);
    if (out.indexOf(s2) < 0) out.push(s2);
    k++;
  }
  return out;
}
function chargeTxt(n, sign){
  if (n === 0) return L({ es:'neutro', en:'neutral' });
  return n + (sign === '+' ? '+' : '−');
}
function dotTxt(n){ return n + ' ' + L({ es:(n === 1 ? 'punto' : 'puntos'), en:(n === 1 ? 'dot' : 'dots') }); }
function pairTxt(n){ return n + ' ' + L({ es:(n === 1 ? 'par' : 'pares'), en:(n === 1 ? 'pair' : 'pairs') }); }
function loneTxt(n){ return n + ' ' + L({ es:(n === 1 ? 'punto solo' : 'puntos solos'), en:(n === 1 ? 'single dot' : 'single dots') }); }
function elecTxt(n){ return n + ' ' + L({ es:(n === 1 ? 'electrón' : 'electrones'), en:(n === 1 ? 'electron' : 'electrons') }); }
function shList(e){
  var a = e.sh.slice(), last = a.pop();
  return a.length ? a.join(', ') + L({ es:' y ', en:' and ' }) + last : String(last);
}
function pairPhrase(v){
  var pr = pairsOf(v), lo = loneOf(v);
  if (pr === 0) return loneTxt(lo) + L({ es:' y ningún par', en:' and no pairs' });
  return pairTxt(pr) + L({ es:' y ', en:' and ' }) + loneTxt(lo);
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 1 :: el repartidor de capas
   El alumno reparte los electrones del atomo capa por capa. Los lugares se
   encienden al instante, la capa mas externa ocupada se resalta sola y el
   contador de la orilla cambia con cada toque.
   ══════════════════════════════════════════════════════════════════════════ */
function wShells(rng, host){
  var POOL = ['Li','B','C','N','O','F','Na','Mg','Al','Si','P','S','Cl','K','Ca'];
  var CAP = [2, 8, 8, 2];
  var seq = shuffle(POOL, rng).slice(0, 3);
  var round = 0, tries = 0, done = false;
  var tgt = elBy(seq[0]);
  var st = [0, 0, 0, 0];

  function total(){ return st[0] + st[1] + st[2] + st[3]; }
  function outer(){ var k = -1, i; for (i = 0; i < 4; i++) if (st[i] > 0) k = i; return k; }
  function want(){ var w = [0,0,0,0], i; for (i = 0; i < tgt.sh.length; i++) w[i] = tgt.sh[i]; return w; }
  function gapAt(){
    var i, last = outer();
    for (i = 0; i < last; i++) if (st[i] < CAP[i]) return i;
    return -1;
  }

  function slots(i){
    var out = '', j;
    for (j = 0; j < CAP[i]; j++) out += '<div class="shslot' + (j < st[i] ? ' on' : '') + '"></div>';
    return out;
  }
  function row(i){
    var isOuter = (outer() === i);
    return '<div class="shrow' + (isOuter ? ' outer' : '') + '">' +
      '<div class="shlbl">' + L({ es:'Capa ', en:'Shell ' }) + (i + 1) + ' <span style="color:var(--text3)">(' + CAP[i] + ')</span></div>' +
      '<button class="iw-btn" data-i="' + i + '" data-d="-1">−</button>' +
      '<div class="shcnt">' + st[i] + '</div>' +
      '<button class="iw-btn" data-i="' + i + '" data-d="1">+</button>' +
      '<div class="shslots">' + slots(i) + '</div>' +
    '</div>';
  }

  function render(){
    var k = outer();
    host.innerHTML =
      '<div class="iw-tag">' + L({ es:'Repartidor de capas', en:'Shell distributor' }) + '</div>' +
      '<div class="iw-sub">' + L({ es:'Reparte los ', en:'Share out the ' }) + tgt.z +
        L({ es:' electrones de un átomo neutro de ', en:' electrons of a neutral atom of ' }) + nameOf(tgt) + '.</div>' +
      '<div class="iw-mini">' + L({ es:'Átomo ', en:'Atom ' }) + (round + 1) +
        L({ es:' de 3. Cada capa tiene lugares contados y se llena de adentro hacia afuera.', en:' of 3. Each shell has counted places and fills from the inside out.' }) + '</div>' +
      row(0) + row(1) + row(2) + row(3) +
      '<div style="margin-top:.6rem">' +
        '<span class="iw-pill">' + L({ es:'colocados', en:'placed' }) + ': <b>' + total() + ' / ' + tgt.z + '</b></span>' +
        '<span class="iw-pill">' + L({ es:'en la orilla', en:'on the edge' }) + ': <b>' + (k < 0 ? 0 : st[k]) + '</b></span>' +
      '</div>' +
      '<div class="iw-row">' +
        (done ? '' : '<button class="iw-btn go" data-a="ck">' + L({ es:'Comprobar', en:'Check' }) + '</button>') +
        (done ? '' : '<button class="iw-btn" data-a="rs">' + L({ es:'Vaciar capas', en:'Empty shells' }) + '</button>') +
      '</div>' +
      '<div class="iw-fb"></div>';
    wire();
  }

  function live(){
    var g = gapAt();
    if (g >= 0){
      say(host, '', L({ es:'La capa ', en:'Shell ' }) + (g + 1) + L({ es:' todavía tiene ', en:' still has ' }) + (CAP[g] - st[g]) +
        L({ es:' lugares libres: no se abre una capa nueva antes de llenarla.', en:' free places: a new shell does not open before that one is full.' }));
      return;
    }
    if (total() < tgt.z){
      say(host, '', L({ es:'Te faltan ', en:'You still have ' }) + (tgt.z - total()) + L({ es:' electrones por repartir.', en:' electrons left to share out.' }));
      return;
    }
    if (total() > tgt.z){
      say(host, 'warm', L({ es:'Colocaste ', en:'You placed ' }) + (total() - tgt.z) + L({ es:' electrones de más para este átomo.', en:' electrons too many for this atom.' }));
      return;
    }
    say(host, 'warm', L({ es:'Ya repartiste todos. Mira cuántos quedaron en la capa resaltada y comprueba.', en:'You shared them all out. Look at how many are left in the highlighted shell and check.' }));
  }

  function reveal(){
    st = want();
    done = (round === 2);
    render();
    var v = valOf(tgt);
    say(host, 'warm', L({ es:'Así queda: ', en:'This is how it ends up: ' }) + tgt.sh.join(' · ') +
      L({ es:'. Las capas internas se llenan primero y a la orilla le tocan ', en:'. The inner shells fill first and the edge gets ' }) + v +
      L({ es:' electrones, que son los de valencia.', en:' electrons, which are the valence ones.' }));
    setTimeout(next, 2400);
  }

  function next(){
    round++;
    if (round >= 3){
      done = true; render();
      say(host, 'good', L({ es:'🎉 Tres repartos. En los tres, lo que decide la química es el último número de la fila.', en:'🎉 Three distributions. In all three, what decides the chemistry is the last number of the row.' }));
      return;
    }
    tries = 0; tgt = elBy(seq[round]); st = [0, 0, 0, 0];
    render();
    say(host, '', L({ es:'Átomo nuevo. Empieza por la capa más cercana al núcleo.', en:'New atom. Start with the shell closest to the nucleus.' }));
  }

  function check(){
    var w = want(), i, ok = true;
    for (i = 0; i < 4; i++) if (st[i] !== w[i]) ok = false;
    if (ok){
      var v = valOf(tgt);
      say(host, 'good', '🎉 ' + nameOf(tgt) + L({ es:' repartido: ', en:' shared out: ' }) + tgt.sh.join(' · ') +
        L({ es:'. En la orilla quedaron ', en:'. On the edge there are ' }) + v + L({ es:' electrones de valencia.', en:' valence electrons.' }));
      setTimeout(next, 1800);
      return;
    }
    tries++;
    if (tries >= 3){ reveal(); return; }
    var g = gapAt();
    if (g >= 0){
      say(host, 'miss', L({ es:'Hay electrones afuera mientras la capa ', en:'There are electrons outside while shell ' }) + (g + 1) +
        L({ es:' sigue con lugares libres. Llénala antes de seguir.', en:' still has free places. Fill it before moving on.' }));
      return;
    }
    if (total() !== tgt.z){ live(); return; }
    say(host, 'miss', L({ es:'El total está bien, pero el reparto no. Revisa cuántos lugares admite cada capa antes de pasar a la siguiente.', en:'The total is right, but the distribution is not. Check how many places each shell takes before moving to the next.' }));
  }

  function wire(){
    on(host, '[data-i]', 'click', function(){
      if (done) return;
      var i = parseInt(this.getAttribute('data-i'), 10), d = parseInt(this.getAttribute('data-d'), 10);
      st[i] = Math.max(0, Math.min(CAP[i], st[i] + d));
      render(); live();
    });
    on(host, '[data-a="ck"]', 'click', check);
    on(host, '[data-a="rs"]', 'click', function(){
      st = [0, 0, 0, 0]; render();
      say(host, '', L({ es:'Capas vacías. Vuelve a repartir cuando quieras.', en:'Empty shells. Share them out again whenever you like.' }));
    });
  }

  render();
  say(host, '', L({ es:'Toca los botones y observa cómo se encienden los lugares de cada capa.', en:'Tap the buttons and watch the places of each shell light up.' }));
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 2 :: cazador de columnas
   Se pide una cantidad de electrones de valencia y el alumno la busca
   tocando casillas en una tabla periodica reducida. Cada toque se puede
   deshacer y cada error dice hacia que lado moverse.
   ══════════════════════════════════════════════════════════════════════════ */
function wTable(rng, host){
  var GRID = [
    ['H', '', '', '', '', '', '', 'He'],
    ['Li', 'Be', 'B', 'C', 'N', 'O', 'F', 'Ne'],
    ['Na', 'Mg', 'Al', 'Si', 'P', 'S', 'Cl', 'Ar'],
    ['K', 'Ca', '', '', '', '', '', '']
  ];
  var COLS = [1, 2, 13, 14, 15, 16, 17, 18];
  var seq = shuffle([1, 3, 4, 5, 6, 7], rng).slice(0, 3);
  var round = 0, tries = 0, done = false;
  var V = seq[0];
  var sel = {};

  function wanted(){
    var out = [], r, c;
    for (r = 0; r < GRID.length; r++) for (c = 0; c < 8; c++){
      var s = GRID[r][c];
      if (s && valOf(elBy(s)) === V) out.push(s);
    }
    return out;
  }
  function selected(){ var out = [], k; for (k in sel) if (sel[k]) out.push(k); return out; }

  function render(){
    var head = '', body = '', r, c, i;
    for (i = 0; i < 8; i++) head += '<div class="phead">' + COLS[i] + '</div>';
    for (r = 0; r < GRID.length; r++){
      for (c = 0; c < 8; c++){
        var s = GRID[r][c];
        if (!s){ body += '<div class="pcell void"></div>'; continue; }
        var e = elBy(s);
        var cls = 'pcell' + (sel[s] ? (done ? ' hit' : ' sel') : '');
        body += '<button class="' + cls + '" data-s="' + s + '">' + s + '<small>' + e.z + '</small></button>';
      }
    }
    host.innerHTML =
      '<div class="iw-tag">' + L({ es:'Cazador de columnas', en:'Column hunter' }) + '</div>' +
      '<div class="iw-sub">' + L({ es:'Enciende todos los elementos con ', en:'Light up every element with ' }) + V +
        L({ es:' electrones de valencia.', en:' valence electrons.' }) + '</div>' +
      '<div class="iw-mini">' + L({ es:'Ronda ', en:'Round ' }) + (round + 1) +
        L({ es:' de 3. Toca para encender y vuelve a tocar para apagar.', en:' of 3. Tap to switch on and tap again to switch off.' }) + '</div>' +
      '<div class="ptab' + (done ? ' locked' : '') + '">' + head + body + '</div>' +
      '<div style="margin-top:.4rem"><span class="iw-pill">' + L({ es:'encendidos', en:'switched on' }) + ': <b>' + selected().length + '</b></span></div>' +
      '<div class="iw-row">' +
        (done ? '' : '<button class="iw-btn go" data-a="ck">' + L({ es:'Comprobar', en:'Check' }) + '</button>') +
        (done ? '' : '<button class="iw-btn" data-a="rs">' + L({ es:'Apagar todo', en:'Switch all off' }) + '</button>') +
      '</div>' +
      '<div class="iw-fb"></div>';
    wire();
  }

  function reveal(){
    var w = wanted(), i;
    sel = {};
    for (i = 0; i < w.length; i++) sel[w[i]] = true;
    done = (round === 2);
    render();
    say(host, 'warm', L({ es:'Todos estaban en la misma columna, la del grupo ', en:'They were all in the same column, the one of group ' }) + grpOfVal(V) +
      L({ es:'. La columna es la que fija cuántos electrones quedan en la orilla, sin importar cuántas capas tenga el átomo.', en:'. The column is what fixes how many electrons stay on the edge, no matter how many shells the atom has.' }));
    setTimeout(next, 2600);
  }

  function next(){
    round++;
    if (round >= 3){
      done = true; render();
      say(host, 'good', L({ es:'🎉 Tres cacerías. Ya puedes leer la valencia de un elemento representativo sin contar sus capas.', en:'🎉 Three hunts. You can now read the valence of a representative element without counting its shells.' }));
      return;
    }
    tries = 0; V = seq[round]; sel = {};
    render();
    say(host, '', L({ es:'Objetivo nuevo. Busca la columna antes de tocar.', en:'New target. Look for the column before tapping.' }));
  }

  function check(){
    var w = wanted(), s = selected(), i;
    var extra = [], missing = [];
    for (i = 0; i < s.length; i++) if (w.indexOf(s[i]) < 0) extra.push(s[i]);
    for (i = 0; i < w.length; i++) if (s.indexOf(w[i]) < 0) missing.push(w[i]);
    if (!extra.length && !missing.length){
      say(host, 'good', '🎉 ' + L({ es:'Columna completa: ', en:'Full column: ' }) + w.join(', ') +
        L({ es:'. Todos pertenecen al grupo ', en:'. They all belong to group ' }) + grpOfVal(V) + '.');
      setTimeout(next, 1900);
      return;
    }
    tries++;
    if (tries >= 3){ reveal(); return; }
    if (extra.length){
      var e = elBy(extra[0]), ve = valOf(e);
      say(host, 'miss', L({ es:'El ', en:'The ' }) + nameOf(e) + L({ es:' está en el grupo ', en:' is in group ' }) + e.g +
        L({ es:' y su orilla tiene ', en:' and its edge has ' }) + ve + L({ es:' electrones. ', en:' electrons. ' }) +
        (ve < V ? L({ es:'Muévete hacia la derecha.', en:'Move to the right.' }) : L({ es:'Muévete hacia la izquierda.', en:'Move to the left.' })));
      return;
    }
    var m = elBy(missing[0]);
    say(host, 'miss', L({ es:'Vas bien, pero falta al menos uno: recorre la misma columna hacia abajo, hasta el periodo ', en:'You are on track, but at least one is missing: run down the same column, as far as period ' }) + m.p + '.');
  }

  function wire(){
    on(host, '[data-s]', 'click', function(){
      if (done) return;
      var s = this.getAttribute('data-s');
      sel[s] = !sel[s];
      render();
      var n = selected().length;
      say(host, '', n === 0
        ? L({ es:'Tabla apagada. Empieza por la columna que creas.', en:'Table switched off. Start with the column you think is right.' })
        : L({ es:'Llevas ', en:'You have ' }) + n + L({ es:' casillas encendidas. Puedes apagarlas si cambias de idea.', en:' boxes switched on. You can switch them off if you change your mind.' }));
    });
    on(host, '[data-a="ck"]', 'click', check);
    on(host, '[data-a="rs"]', 'click', function(){
      sel = {}; render();
      say(host, '', L({ es:'Todo apagado. Vuelve a intentarlo.', en:'All switched off. Try again.' }));
    });
  }

  render();
  say(host, '', L({ es:'Toca las casillas que creas y comprueba cuando estés listo.', en:'Tap the boxes you think are right and check when you are ready.' }));
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 3 :: el dibujante de Lewis
   El alumno enciende puntos alrededor del simbolo. El contador de pares y
   de puntos solitarios cambia en el momento, y el aviso dice si conviene
   repartir antes de emparejar.
   ══════════════════════════════════════════════════════════════════════════ */
function wLewis(rng, host){
  var POOL = ['B', 'C', 'N', 'O', 'F', 'Na', 'Mg', 'Al', 'Si', 'P', 'S', 'Cl'];
  var SLOT = [[104,8],[192,64],[104,144],[16,64],[132,8],[192,100],[132,144],[16,100]];
  var seq = shuffle(POOL, rng).slice(0, 3);
  var round = 0, tries = 0, done = false;
  var tgt = elBy(seq[0]);
  var dots = [false, false, false, false, false, false, false, false];

  function count(){ var n = 0, i; for (i = 0; i < 8; i++) if (dots[i]) n++; return n; }
  function sideInfo(){
    var used = 0, full = 0, j;
    for (j = 0; j < 4; j++){
      var c = (dots[j] ? 1 : 0) + (dots[j + 4] ? 1 : 0);
      if (c > 0) used++;
      if (c === 2) full++;
    }
    return { used:used, full:full };
  }

  function render(){
    var d = '', i, si = sideInfo();
    for (i = 0; i < 8; i++){
      d += '<div class="lwd' + (dots[i] ? ' on' : '') + '" data-d="' + i + '" style="left:' + SLOT[i][0] + 'px;top:' + SLOT[i][1] + 'px"></div>';
    }
    host.innerHTML =
      '<div class="iw-tag">' + L({ es:'Dibujante de Lewis', en:'Lewis drawer' }) + '</div>' +
      '<div class="iw-sub">' + L({ es:'Dibuja el diagrama de ', en:'Draw the diagram of ' }) + nameOf(tgt) +
        L({ es:', del grupo ', en:', from group ' }) + tgt.g + '.</div>' +
      '<div class="iw-mini">' + L({ es:'Diagrama ', en:'Diagram ' }) + (round + 1) +
        L({ es:' de 3. Toca una posición para encender o apagar un punto.', en:' of 3. Tap a position to switch a dot on or off.' }) + '</div>' +
      '<div class="lw' + (done ? ' locked' : '') + '"><div class="lwsym">' + tgt.s + '</div>' + d + '</div>' +
      '<div>' +
        '<span class="iw-pill">' + L({ es:'puntos', en:'dots' }) + ': <b>' + count() + '</b></span>' +
        '<span class="iw-pill">' + L({ es:'pares', en:'pairs' }) + ': <b>' + si.full + '</b></span>' +
        '<span class="iw-pill">' + L({ es:'lados ocupados', en:'sides taken' }) + ': <b>' + si.used + '</b></span>' +
      '</div>' +
      '<div class="iw-row">' +
        (done ? '' : '<button class="iw-btn go" data-a="ck">' + L({ es:'Comprobar', en:'Check' }) + '</button>') +
        (done ? '' : '<button class="iw-btn" data-a="rs">' + L({ es:'Borrar puntos', en:'Clear dots' }) + '</button>') +
      '</div>' +
      '<div class="iw-fb"></div>';
    wire();
  }

  function live(){
    var v = valOf(tgt), c = count();
    if (c < v){ say(host, '', L({ es:'Faltan ', en:'Missing ' }) + (v - c) + L({ es:' puntos para este elemento.', en:' dots for this element.' })); return; }
    if (c > v){ say(host, 'warm', L({ es:'Sobran ', en:'There are ' }) + (c - v) + L({ es:' puntos: cuenta otra vez su columna.', en:' dots too many: count its column again.' })); return; }
    say(host, 'warm', L({ es:'Ese es el número de puntos. Ahora revisa cómo quedaron repartidos entre los cuatro lados.', en:'That is the number of dots. Now check how they are spread between the four sides.' }));
  }

  function reveal(){
    var v = valOf(tgt), i;
    for (i = 0; i < 8; i++) dots[i] = (i < v);
    done = (round === 2);
    render();
    say(host, 'warm', nameOf(tgt) + L({ es:' pertenece al grupo ', en:' belongs to group ' }) + tgt.g + L({ es:', así que lleva ', en:', so it carries ' }) + v +
      L({ es:' puntos: primero uno en cada lado y solo después se forman los pares, aquí ', en:' dots: first one on each side and only afterwards the pairs form, here ' }) +
      pairPhrase(v) + '.');
    setTimeout(next, 2600);
  }

  function next(){
    round++;
    if (round >= 3){
      done = true; render();
      say(host, 'good', L({ es:'🎉 Tres diagramas. Los puntos solos son los que buscan pareja en otro átomo.', en:'🎉 Three diagrams. The single dots are the ones looking for a partner in another atom.' }));
      return;
    }
    tries = 0; tgt = elBy(seq[round]); dots = [false, false, false, false, false, false, false, false];
    render();
    say(host, '', L({ es:'Elemento nuevo. Fíjate en su columna antes de tocar.', en:'New element. Look at its column before tapping.' }));
  }

  function check(){
    var v = valOf(tgt), si = sideInfo(), c = count();
    if (c === v && si.used === Math.min(v, 4) && si.full === pairsOf(v)){
      say(host, 'good', '🎉 ' + tgt.s + L({ es:' con ', en:' with ' }) + dotTxt(v) + ': ' + pairPhrase(v) + '.');
      setTimeout(next, 1900);
      return;
    }
    tries++;
    if (tries >= 3){ reveal(); return; }
    if (c !== v){ live(); return; }
    if (si.used < Math.min(v, 4)){
      say(host, 'miss', L({ es:'Son los puntos correctos, pero un lado quedó vacío mientras otro ya tiene pareja. Reparte primero, empareja después.', en:'The dots are right, but one side is empty while another already has a pair. Spread them first, pair them afterwards.' }));
      return;
    }
    say(host, 'miss', L({ es:'Son los puntos correctos, pero los pares no coinciden: con ', en:'The dots are right, but the pairs do not match: with ' }) + dotTxt(v) +
      L({ es:' deben quedar ', en:' there should be ' }) + pairTxt(pairsOf(v)) + '.');
  }

  function wire(){
    on(host, '[data-d]', 'click', function(){
      if (done) return;
      var i = parseInt(this.getAttribute('data-d'), 10);
      dots[i] = !dots[i];
      render(); live();
    });
    on(host, '[data-a="ck"]', 'click', check);
    on(host, '[data-a="rs"]', 'click', function(){
      dots = [false, false, false, false, false, false, false, false]; render();
      say(host, '', L({ es:'Símbolo limpio. Coloca los puntos otra vez.', en:'Clean symbol. Place the dots again.' }));
    });
  }

  render();
  say(host, '', L({ es:'Enciende tantos puntos como electrones tenga la orilla del átomo.', en:'Switch on as many dots as the edge of the atom has electrons.' }));
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 4 :: la mesa de intercambio
   El alumno cede o gana electrones de uno en uno. La orilla se llena o se
   vacia a la vista y la carga se recalcula en cada toque, asi que el camino
   corto se descubre moviendo.
   ══════════════════════════════════════════════════════════════════════════ */
function wOctet(rng, host){
  var POOL = ['Li', 'Na', 'K', 'Mg', 'Ca', 'Al', 'N', 'P', 'O', 'S', 'F', 'Cl'];
  var seq = shuffle(POOL, rng).slice(0, 3);
  var round = 0, tries = 0, done = false;
  var tgt = elBy(seq[0]);
  var dir = '', n = 0;

  function best(){
    var v = valOf(tgt);
    return v <= 3 ? { dir:'give', n:v } : { dir:'take', n:needOf(v) };
  }
  function edge(){
    var v = valOf(tgt);
    if (dir === 'give') return v - n;
    if (dir === 'take') return v + n;
    return v;
  }
  function complete(){
    var v = valOf(tgt);
    if (dir === 'give') return n === v;
    if (dir === 'take') return v + n === 8;
    return false;
  }
  function boxes(){
    var out = '', i, v = valOf(tgt), e = edge();
    for (i = 0; i < 8; i++){
      var cls = 'octb';
      if (dir === 'take' && i >= v && i < e) cls += ' won';
      else if (i < e) cls += ' on';
      out += '<div class="' + cls + '"></div>';
    }
    return out;
  }

  function render(){
    var v = valOf(tgt);
    host.innerHTML =
      '<div class="iw-tag">' + L({ es:'Mesa de intercambio', en:'Trading table' }) + '</div>' +
      '<div class="iw-sub">' + L({ es:'Deja completa la capa externa de ', en:'Leave the outer shell of ' }) + nameOf(tgt) +
        L({ es:' moviendo la menor cantidad de electrones.', en:' complete by moving the fewest electrons.' }) + '</div>' +
      '<div class="iw-mini">' + L({ es:'Átomo ', en:'Atom ' }) + (round + 1) + L({ es:' de 3. Está en el grupo ', en:' of 3. It is in group ' }) + tgt.g +
        L({ es:'. Los ocho recuadros son los lugares de una capa completa.', en:'. The eight boxes are the places of a complete shell.' }) + '</div>' +
      '<div class="octrow">' + boxes() + '</div>' +
      '<div>' +
        '<span class="iw-pill">' + L({ es:'en la orilla', en:'on the edge' }) + ': <b>' + edge() + '</b></span>' +
        '<span class="iw-pill">' + L({ es:'movidos', en:'moved' }) + ': <b>' + n + '</b></span>' +
        '<span class="iw-pill">' + L({ es:'carga', en:'charge' }) + ': <b>' + chargeTxt(n, dir === 'give' ? '+' : '-') + '</b></span>' +
      '</div>' +
      '<div class="iw-row">' +
        (done ? '' : '<button class="iw-btn" data-m="give">' + L({ es:'Ceder uno', en:'Give one' }) + '</button>') +
        (done ? '' : '<button class="iw-btn" data-m="take">' + L({ es:'Ganar uno', en:'Take one' }) + '</button>') +
        (done ? '' : '<button class="iw-btn go" data-a="ck">' + L({ es:'Comprobar', en:'Check' }) + '</button>') +
        (done ? '' : '<button class="iw-btn" data-a="rs">' + L({ es:'Devolver todo', en:'Put it all back' }) + '</button>') +
      '</div>' +
      '<div class="iw-fb"></div>';
    wire();
    return v;
  }

  function live(){
    var v = valOf(tgt);
    if (dir === ''){ say(host, '', L({ es:'Todavía no mueves nada: la orilla tiene ', en:'You have not moved anything yet: the edge has ' }) + v + L({ es:' electrones.', en:' electrons.' })); return; }
    if (dir === 'give'){
      if (n < v){ say(host, '', L({ es:'Quedan ', en:'There are ' }) + (v - n) + L({ es:' electrones en la orilla; la capa de abajo aún no queda al descubierto.', en:' electrons left on the edge; the shell below is not exposed yet.' })); return; }
      say(host, 'warm', L({ es:'La orilla quedó vacía y la capa de abajo, que ya estaba llena, pasa a ser la externa. Comprueba.', en:'The edge is empty and the shell below, already full, becomes the outer one. Check it.' }));
      return;
    }
    if (v + n < 8){ say(host, '', L({ es:'Ahora hay ', en:'Now there are ' }) + (v + n) + L({ es:' en la orilla; faltan ', en:' on the edge; ' }) + (8 - v - n) + L({ es:' para llenarla.', en:' more would fill it.' })); return; }
    say(host, 'warm', L({ es:'Los ocho lugares están ocupados. Comprueba tu jugada.', en:'The eight places are taken. Check your move.' }));
  }

  function reveal(){
    var b = best();
    dir = b.dir; n = b.n;
    done = (round === 2);
    render();
    var v = valOf(tgt);
    say(host, 'warm', nameOf(tgt) + L({ es:' tiene ', en:' has ' }) + v + L({ es:' electrones en la orilla, así que el camino corto es ', en:' electrons on the edge, so the short path is to ' }) +
      (b.dir === 'give' ? L({ es:'cederlos y quedar con carga ', en:'give them away and end with charge ' }) : L({ es:'ganar los que faltan y quedar con carga ', en:'take the missing ones and end with charge ' })) +
      chargeTxt(b.n, b.dir === 'give' ? '+' : '-') + '.');
    setTimeout(next, 2600);
  }

  function next(){
    round++;
    if (round >= 3){
      done = true; render();
      say(host, 'good', L({ es:'🎉 Tres intercambios. La cantidad de electrones movidos es justo la carga que le queda al átomo.', en:'🎉 Three trades. The number of electrons moved is exactly the charge the atom is left with.' }));
      return;
    }
    tries = 0; tgt = elBy(seq[round]); dir = ''; n = 0;
    render();
    say(host, '', L({ es:'Átomo nuevo. Cuenta su orilla antes de mover.', en:'New atom. Count its edge before moving.' }));
  }

  function check(){
    var b = best(), v = valOf(tgt);
    if (complete() && dir === b.dir && n === b.n){
      say(host, 'good', '🎉 ' + nameOf(tgt) + L({ es:': camino corto con ', en:': short path with ' }) + n + L({ es:' electrones movidos y carga ', en:' electrons moved and charge ' }) +
        chargeTxt(n, dir === 'give' ? '+' : '-') + '.');
      setTimeout(next, 1900);
      return;
    }
    tries++;
    if (tries >= 3){ reveal(); return; }
    if (complete()){
      say(host, 'miss', L({ es:'La capa sí queda completa, pero moviste ', en:'The shell does end up complete, but you moved ' }) + n +
        L({ es:' electrones y hay un camino más corto. Compara cuántos hay en la orilla con cuántos faltan para ocho.', en:' electrons and there is a shorter path. Compare how many are on the edge with how many are missing to reach eight.' }));
      return;
    }
    if (dir === ''){
      say(host, 'miss', L({ es:'Todavía no mueves nada y la orilla tiene ', en:'You have not moved anything and the edge has ' }) + v +
        L({ es:' electrones: así no queda completa.', en:' electrons: it is not complete like that.' }));
      return;
    }
    live();
  }

  function wire(){
    on(host, '[data-m]', 'click', function(){
      if (done) return;
      var m = this.getAttribute('data-m'), v = valOf(tgt);
      if (dir !== m){ dir = m; n = 0; }
      n = Math.min(m === 'give' ? v : needOf(v), n + 1);
      render(); live();
    });
    on(host, '[data-a="ck"]', 'click', check);
    on(host, '[data-a="rs"]', 'click', function(){
      dir = ''; n = 0; render();
      say(host, '', L({ es:'Átomo neutro otra vez. Prueba el otro camino si quieres.', en:'Neutral atom again. Try the other path if you like.' }));
    });
  }

  render();
  say(host, '', L({ es:'Mueve electrones de uno en uno y observa la orilla y la carga.', en:'Move electrons one at a time and watch the edge and the charge.' }));
}

      rcard(L({ es:'Capas 2 y 3', en:'Shells 2 and 3' }), L({ es:'8 lugares', en:'8 places' }), L({ es:'en los primeros veinte elementos', en:'in the first twenty elements' })) +
      rcard(L({ es:'Valencia', en:'Valence' }), L({ es:'última capa ocupada', en:'last occupied shell' }), L({ es:'es la que toca a los demás átomos', en:'it is the one that touches other atoms' })) +
      rcard(L({ es:'Electrones internos', en:'Inner electrons' }), L({ es:'capas cubiertas', en:'covered shells' }), L({ es:'quedan fuera de la reacción', en:'they stay out of the reaction' })) +
    '</div>' +
    '<div class="callout"><p><strong>' + L({ es:'Ojo: ', en:'Careful: ' }) + '</strong>' + L({
      es:'tener muchos electrones no significa tener muchos electrones de valencia. El total lo dice el número atómico; la orilla la dice el final del reparto.',
      en:'having many electrons does not mean having many valence electrons. The total is given by the atomic number; the edge is given by the end of the distribution.'
    }) + '</p></div>'
  );
  wShells(rng, widgetHost(s1, 'wCapas', 'shells'));
  addProblem(rng, mkP1(rng));
  addProblem(rng, mkP2(rng));

  /* ══ CONCEPTO 2 ══ */
  var s2 = sec(
    L({ es:'Concepto 2', en:'Concept 2' }),
    L({ es:'No hace falta repartir: la columna ya trae la respuesta', en:'No need to share out: the column already carries the answer' }),
    '<p>' + L({
      es:'Repartir capa por capa funciona, pero es lento. La tabla periódica ya guarda ese trabajo hecho: los elementos representativos de una misma columna terminan siempre con la misma cantidad de electrones en la orilla, y por eso reaccionan de forma parecida aunque unos tengan dos capas y otros cuatro. La columna se llama grupo y la fila se llama periodo.',
      en:'Sharing out shell by shell works, but it is slow. The periodic table already keeps that work done: the representative elements of one same column always end with the same amount of electrons on the edge, and that is why they react in a similar way even though some have two shells and others four.  The column is called group and the row is called period.'
    }) + '</p>' +
    '<p>' + L({
      es:'La lectura es directa: en los grupos 1 y 2 los electrones de valencia son el número del grupo, y del grupo 13 en adelante son el número del grupo menos diez, porque en medio de la tabla se cuelan diez columnas del bloque central. Así, el grupo 16 deja 6 electrones en la orilla y el grupo 17 deja 7. El periodo, por su parte, no dice cuántos electrones hay afuera sino cuántas capas se abrieron.',
      en:'The reading is direct: in groups 1 and 2 the valence electrons are the group number, and from group 13 onwards they are the group number minus ten, because ten columns of the central block slip in through the middle of the table. So group 16 leaves 6 electrons on the edge and group 17 leaves 7. The period, for its part, does not say how many electrons are outside but how many shells were opened.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Grupos 1 y 2', en:'Groups 1 and 2' }), L({ es:'valencia = grupo', en:'valence = group' }), L({ es:'1 o 2 electrones en la orilla', en:'1 or 2 electrons on the edge' })) +
      rcard(L({ es:'Grupos 13 a 18', en:'Groups 13 to 18' }), L({ es:'valencia = grupo − 10', en:'valence = group − 10' }), L({ es:'de 3 a 8 electrones en la orilla', en:'from 3 to 8 electrons on the edge' })) +
      rcard(L({ es:'Periodo', en:'Period' }), L({ es:'capas ocupadas', en:'occupied shells' }), L({ es:'no cambia la valencia', en:'it does not change the valence' })) +
      rcard(L({ es:'Columna', en:'Column' }), L({ es:'mismo comportamiento', en:'same behaviour' }), L({ es:'de arriba abajo en todo el grupo', en:'top to bottom in the whole group' })) +
    '</div>'
  );
  wTable(rng, widgetHost(s2, 'wTabla', 'periodic'));
  addProblem(rng, mkP3(rng));
  addProblem(rng, mkP4(rng));

  /* ══ CONCEPTO 3 ══ */
  var s3 = sec(
    L({ es:'Concepto 3', en:'Concept 3' }),
    L({ es:'Lewis: el símbolo, cuatro lados y los puntos justos', en:'Lewis: the symbol, four sides and exactly the right dots' }),
    '<p>' + L({
      es:'El diagrama de Lewis es la forma más corta de anotar la orilla de un átomo: se escribe el símbolo del elemento y se dibujan alrededor tantos puntos como electrones de valencia tenga. Nada más. Los electrones internos no aparecen, el núcleo tampoco y el número de capas queda fuera del dibujo.',
      en:'The Lewis diagram is the shortest way of writing down the edge of an atom: the symbol of the element is written and as many dots as it has valence electrons are drawn around it. Nothing else. The inner electrons do not appear, neither does the nucleus and the number of shells stays out of the drawing.'
    }) + '</p>' +
    '<p>' + L({
      es:'El símbolo tiene cuatro lados disponibles y los puntos se acomodan de uno en uno: primero un punto en cada lado y solo cuando ya no quedan lados libres se empiezan a formar parejas. Ese detalle no es un capricho de dibujo. Los puntos que quedan sin pareja son los que buscan compañía en otro átomo, así que contarlos anticipa con cuántos átomos se va a unir. Un elemento con siete puntos deja tres parejas y un punto solo; uno con cuatro puntos deja cuatro puntos solos y ninguna pareja.',
      en:'The symbol has four sides available and the dots are arranged one at a time: first one dot on each side and only when no free sides are left do pairs start to form. That detail is not a drawing whim. The dots left without a partner are the ones looking for company in another atom, so counting them anticipates how many atoms it will join. An element with seven dots leaves three pairs and one single dot; one with four dots leaves four single dots and no pairs.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Puntos', en:'Dots' }), L({ es:'igual a la valencia', en:'equal to the valence' }), L({ es:'se leen de la columna', en:'they are read from the column' })) +
      rcard(L({ es:'Cuatro lados', en:'Four sides' }), L({ es:'uno por lado primero', en:'one per side first' }), L({ es:'las parejas se forman al final', en:'pairs form at the end' })) +
      rcard(L({ es:'Puntos solos', en:'Single dots' }), L({ es:'buscan pareja', en:'they look for a partner' }), L({ es:'anticipan las uniones del átomo', en:'they anticipate the joins of the atom' })) +
      rcard(L({ es:'Ocho puntos', en:'Eight dots' }), L({ es:'cuatro parejas', en:'four pairs' }), L({ es:'ningún punto disponible', en:'no dot available' })) +
    '</div>'
  );
  wLewis(rng, widgetHost(s3, 'wLewisD', 'lewis'));
  addProblem(rng, mkP5(rng));
  addProblem(rng, mkP6(rng));

  /* ══ CONCEPTO 4 ══ */
  var s4 = sec(
    L({ es:'Concepto 4', en:'Concept 4' }),
    L({ es:'Ocho es la meta: ceder, ganar o compartir', en:'Eight is the goal: give, take or share' }),
    '<p>' + L({
      es:'Los gases nobles casi no reaccionan y su diagrama explica por qué: llegan con ocho puntos alrededor del símbolo, es decir, con la capa externa llena. Los demás átomos se comportan como si buscaran ese mismo final, y tienen tres caminos para conseguirlo: ceder los pocos electrones que les sobran, ganar los pocos que les faltan o compartir puntos con otro átomo.',
      en:'Noble gases hardly react and their diagram explains why: they arrive with eight dots around the symbol, that is, with the outer shell full. The other atoms behave as if they were looking for that same ending, and they have three paths to get it: give away the few electrons they have left over, take the few they are missing or share dots with another atom.'
    }) + '</p>' +
    '<p>' + L({
      es:'Cuál camino toma cada átomo depende de qué le sale más barato, y eso se ve en el diagrama. Un átomo con uno o dos puntos suelta esos puntos y deja al descubierto una capa que ya estaba llena; uno con seis o siete prefiere jalar los que le faltan. Al ceder electrones el átomo pierde carga negativa y queda positivo; al ganarlos queda negativo, y en ambos casos el número de electrones movidos es exactamente el valor de la carga. Cuando ninguno de los dos quiere soltar, comparten: cada punto solo se junta con el punto solo de otro átomo.',
      en:'Which path each atom takes depends on what comes cheaper, and that is seen in the diagram. An atom with one or two dots releases those dots and leaves exposed a shell that was already full; one with six or seven prefers to pull in the ones it is missing. On giving away electrons the atom loses negative charge and ends up positive; on taking them it ends up negative, and in both cases the number of electrons moved is exactly the value of the charge. When neither of the two wants to let go, they share: each single dot joins the single dot of another atom.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Uno o dos puntos', en:'One or two dots' }), L({ es:'los cede', en:'it gives them away' }), L({ es:'queda con carga positiva', en:'it ends up with positive charge' })) +
      rcard(L({ es:'Seis o siete puntos', en:'Six or seven dots' }), L({ es:'gana los que faltan', en:'it takes the missing ones' }), L({ es:'queda con carga negativa', en:'it ends up with negative charge' })) +
      rcard(L({ es:'Carga', en:'Charge' }), L({ es:'electrones movidos', en:'electrons moved' }), L({ es:'los protones no cambian', en:'the protons do not change' })) +
      rcard(L({ es:'Compartir', en:'Sharing' }), L({ es:'punto solo con punto solo', en:'single dot with single dot' }), L({ es:'ninguno de los dos cede del todo', en:'neither of the two gives in completely' })) +
    '</div>'
  );
  wOctet(rng, widgetHost(s4, 'wOcteto', 'octet'));
  addProblem(rng, mkP7(rng));
  wReflect(rng, widgetHost(s4, 'wCuaderno', 'reflect'));

  /* ══ CIERRE :: sin explicacion previa (Rule 1) ══ */
  sec(
    L({ es:'Para cerrar', en:'To close' }),
    L({ es:'Tú decides', en:'Your call' }),
    '<p>' + L({
      es:'Un símbolo, unos cuantos puntos y todo lo que ya sabes leer en ellos.',
      en:'One symbol, a few dots and everything you already know how to read in them.'
    }) + '</p>'
  );
  addProblem(rng, mkP8(rng));
  addProblem(rng, mkP9(rng));
  addProblem(rng, mkP10(rng));
}
</script>

<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbykkuJ_apGq3vALIFd4mr3acu81c7K4OKxW-DZ-i52Ceyl3lOanXMdvbS9SIXPrLQBm/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'Electrones de Valencia y Diagramas de Lewis';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
