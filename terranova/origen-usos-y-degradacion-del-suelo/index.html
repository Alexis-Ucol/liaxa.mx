<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Origen, Usos y Degradación del Suelo</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; text-align: justify; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Origen, Usos y Degradación del Suelo</div>
    <div class="wcourse" id="wcourse-el">Geografía · 1° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Origen, Usos y Degradación del Suelo</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="sbtn" id="dlBtn" onclick="generatePDF()" style="max-width:280px;margin:0 auto;">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   CENTRALIZED SCHOOL CONFIG (Rule 16) — ships UNBRANDED (Rule 11).
   The ONLY rebranding point. build_all.py substitutes these exact fields
   (BRAND_FIELDS / RGB_FIELDS / logo*) downstream; :root/dark stay as fallback.
   Neutral defaults below == the static :root/dark values, so unbranded == no-op.
   ══════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:'#243c54', primaryDark:'#182a3b', primaryBg:'#eaeef3',
  accent:'#24549c', accentBg:'#e2ebf8',
  darkPrimary:'#5e85ab', darkPrimaryDark:'#8badce', darkPrimaryBg:'#152331',

function lsKey() {

function saveSession() {
  if (!studentData.name) return;
  var drawings = [], texts = [], photos = [];
  problems.forEach(function(p, i) {
    var dc = document.getElementById('dc' + i);
    if (dc && dc.width) {
      var blank = document.createElement('canvas');
      blank.width = dc.width; blank.height = dc.height;
      drawings.push(dc.toDataURL() === blank.toDataURL() ? null : dc.toDataURL('image/png'));
    } else { drawings.push(null); }
    var ta = document.getElementById('ta' + i);
    texts.push(ta ? ta.value : '');
    var pp = document.getElementById('pp' + i);
    photos.push((pp && pp.src && pp.src.indexOf('data:') === 0) ? pp.src : null);
  });
  var state = {
    name: studentData.name, group: studentData.group,
    answeredCount: answeredCount, correctCount: correctCount,
    choices: problems.map(function(p) { return p.studentChoice; }),
    drawings: drawings, texts: texts, photos: photos
  };
  try { localStorage.setItem(lsKey(), JSON.stringify(state)); } catch(e) {}
}

function loadSession(name, group) {
  var key = 'geo1_t10_g01__' + (name + '__' + group).replace(/\s+/g, '_');
  try { var r = localStorage.getItem(key); return r ? JSON.parse(r) : null; } catch(e) { return null; }
}

function restoreSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  var saved = loadSession(name, group);
  if (!saved) return;
  document.getElementById('restoreBar').style.display = 'none';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = currentAttempt(name, group);
  buildLesson(seededRng(name + group + att));
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
  saved.choices.forEach(function(choice, idx) {
    if (choice !== null && choice !== undefined) confirmMC(idx, choice);
  });
  setTimeout(function() {
    if (saved.drawings) {
      saved.drawings.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var dc = document.getElementById('dc' + i);
        if (!dc || !dc.width) return;
        var img = new Image();
        img.onload = function() {
          var dpr = window.devicePixelRatio || 1;
          dc.getContext('2d').drawImage(img, 0, 0, dc.width / dpr, dc.height / dpr);
        };
        img.src = dataUrl;
      });
    }
    if (saved.texts) {
      saved.texts.forEach(function(text, i) {
        if (!text) return;
        var ta = document.getElementById('ta' + i);
        if (ta) ta.value = text;
      });
    }
    if (saved.photos) {
      saved.photos.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var pp = document.getElementById('pp' + i);
        if (!pp) return;
        pp.src = dataUrl; pp.style.display = 'block';
        var pz = document.getElementById('pz' + i);
        if (pz) pz.style.opacity = '0.4';
      });
    }
  }, 300);
}

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function startLesson() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  var err   = document.getElementById('startErr');
  if (!name || !group) { err.textContent = t('fillboth'); return; }
  err.textContent = '';
  studentData = { name: name, group: group };
  answeredCount = 0;
  correctCount  = 0;
  var att = nextAttempt(name, group);
  buildLesson(seededRng(name + group + att));
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

   ================================================ */
async function generatePDF() {
  var btn = document.getElementById('dlBtn');
  btn.textContent = 'Generando PDF…';
  btn.disabled = true;

  var jspdf   = window.jspdf;
  var doc     = new jspdf.jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });
  var PW      = 215.9;
  var M       = 18;
  var TW      = PW - M * 2;
  var PH      = doc.internal.pageSize.height;
  var name    = studentData.name;
  var group   = studentData.group;
  var total   = problems.length;
  var pct     = Math.round(correctCount / total * 100);
  var dateStr = new Date().toLocaleString('es-MX', { dateStyle:'long', timeStyle:'short' });

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS — INJECTION BLOCK ─────────────────────────────────────────
  //   Match these RGB values to --green and --gold above.
  //   PRIMARY  → pBR, pBG, pBB
  //   ACCENT   → pAR, pAG, pAB
  // ──────────────────────────────────────────────────────────────────────────
  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;  // PRIMARY (from SCHOOL, Rule 16)
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;   // ACCENT (from SCHOOL, Rule 16)

  function pdfText(html) {
    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/\u2192/g,'->').replace(/\u2212/g,'-').replace(/\u00b2/g,'^2')
      .replace(/\u00b3/g,'^3').replace(/\u00d7/g,'x').replace(/\u00f7/g,'/')
      .replace(/\u2260/g,'!=').replace(/\u2264/g,'<=').replace(/\u2265/g,'>=')
      .replace(/\u221a/g,'sqrt').replace(/\u03c0/g,'pi').replace(/\u2026/g,'...')
      .replace(/\s+/g,' ').trim();
  }

  // ── PORTADA: orange line / white logo strip / orange line / blue band ──
  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,2,'F');   // top accent line
  doc.setFillColor(255,255,255); doc.rect(0,2,PW,26,'F');                               // white logo strip
  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,28,PW,2,'F');  // bottom accent line
  doc.setFillColor(pBR,pBG,pBB); doc.rect(0,30,PW,34,'F');       // blue header band

  if (SCHOOL.logoLeftB64) {
    var fmtL = SCHOOL.logoLeftB64.indexOf('/9j/') > -1 ? 'JPEG' : 'PNG';
    try { doc.addImage(SCHOOL.logoLeftB64, fmtL, M, 4, 48, 22); } catch(e) {}
  }
  if (SCHOOL.logoRightB64) {
    var fmtR = SCHOOL.logoRightB64.indexOf('/9j/') > -1 ? 'JPEG' : 'PNG';
    try { doc.addImage(SCHOOL.logoRightB64, fmtR, 130, 4, 48, 22); } catch(e) {}
  }

  var lx = PW - M - 36;
  var ly = 10;
  doc.setDrawColor(pBR,pBG,pBB); doc.setLineWidth(0.7);
  doc.lines([[2.57-1.03,4.63-6.17],[4.11-2.57,5.14-4.63],[5.66-4.11,2.57-5.14]], lx+1.03, ly+6.17);
  doc.setFillColor(pAR,pAG,pAB); doc.circle(lx+5.66, ly+2.57, 0.9, 'F');
  doc.setDrawColor(pAR,pAG,pAB); doc.setLineWidth(0.7);
  doc.line(lx+8.23, ly+1.54, lx+8.23, ly+7.2);
  doc.setTextColor(pBR,pBG,pBB); doc.setFontSize(11); doc.setFont('helvetica','bold');
  doc.text('LIAXA', lx+10, ly+6.8);

  // Guide title + date inside the blue band
  doc.setTextColor(232,238,247); doc.setFontSize(19); doc.setFont('helvetica','bold');
  doc.text(t('wtitle'), M, 49);
  doc.setTextColor(150,165,200); doc.setFontSize(8); doc.setFont('helvetica','normal');
  doc.text(dateStr, M, 59);

  // ── Student info card (name + group only — código goes to footer) ──
  doc.setFillColor(237,240,245); doc.roundedRect(M,72,TW,20,3,3,'F');
  doc.setTextColor(130,140,160); doc.setFontSize(8.5); doc.setFont('helvetica','bold');
  doc.text('ALUMNO', M+4, 79); doc.text('GRUPO', 130, 79);
  doc.setTextColor(20,24,32); doc.setFontSize(11); doc.setFont('helvetica','bold');
  doc.text(name, M+4, 87); doc.text(group, 130, 87);

  // ── Score box ──
  var sc = pct>=70?[26,106,74]:pct>=50?[224,123,26]:[176,48,16];
  doc.setFillColor(255,255,255); doc.roundedRect(M,100,TW,34,4,4,'F');
  doc.setDrawColor(sc[0],sc[1],sc[2]); doc.setLineWidth(0.8);
  doc.roundedRect(M,100,TW,34,4,4,'S');
  doc.setTextColor(sc[0],sc[1],sc[2]); doc.setFontSize(40); doc.setFont('helvetica','bold');
  doc.text(pct+'%', PW/2, 124, {align:'center'});
  doc.setTextColor(130,140,160); doc.setFontSize(8.5); doc.setFont('helvetica','normal');
  doc.text(correctCount+' correcta(s) de '+total+' preguntas', PW/2, 131, {align:'center'});

  // ── Problem summary table ──
  doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
  doc.setFontSize(7); doc.setFont('helvetica','bold');
  doc.rect(M,142,TW,8,'F'); doc.text('RESUMEN DE PROBLEMAS', M+4, 148);
  var sy = 154;
  problems.forEach(function(prob, i) {
    if (sy + 12 > PH - 15) {
      doc.addPage(); sy = 20;
      doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
      doc.setFontSize(7); doc.setFont('helvetica','bold');
      doc.rect(M,sy,TW,8,'F'); doc.text('RESUMEN DE PROBLEMAS (continuación)', M+4, sy+6);
      sy += 12;
    }
    var ok = document.getElementById('pc'+i).classList.contains('ok');
    doc.setFillColor(ok?232:255, ok?240:232, ok?232:228);
    doc.roundedRect(M,sy,TW,10,2,2,'F');
    doc.setFillColor(ok?26:176, ok?106:48, ok?74:16);
    doc.circle(M+6, sy+5, 2.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(7); doc.setFont('helvetica','bold');
    doc.text(ok?'✓':'✗', M+4.5, sy+6.5);
    doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('helvetica','normal');
    doc.text('Problema '+(i+1)+': '+pdfText(prob.title), M+12, sy+6.5);
    doc.setTextColor(ok?26:176, ok?106:48, ok?74:16);
    doc.text(ok?'Correcto':'Incorrecto', PW-M-24, sy+6.5);
    sy += 12;
  });

  // ── Per-problem pages ──
  for (var i = 0; i < problems.length; i++) {
    var prob = problems[i];
    doc.addPage();
    var wy = 0;

    doc.setFillColor(pBR,pBG,pBB); doc.rect(0,0,PW,20,'F');
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,3,'F');
    doc.setTextColor(pAR,pAG,pAB); doc.setFontSize(7); doc.setFont('helvetica','normal');
    doc.text(t('wcourse')+'  ·  '+t('wtitle'), M, 10);
    doc.setTextColor(232,238,247); doc.setFontSize(10.5); doc.setFont('helvetica','bold');
    doc.text('Problema '+(i+1)+' de '+total+'  ·  '+pdfText(prob.title), M, 17);
    wy = 25;

    var qRaw = pdfText(prob.questionText);
    doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var qLines = doc.splitTextToSize(qRaw, TW-10);
    var qBoxH  = 8 + qLines.length*5 + 3;
    doc.setFillColor(237,240,245); doc.roundedRect(M,wy,TW,qBoxH,2,2,'F');
    doc.setTextColor(pBR,pBG,pBB); doc.setFontSize(6.5); doc.setFont('helvetica','bold');
    doc.text('PREGUNTA', M+4, wy+6);
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var qy = wy+12;
    qLines.forEach(function(ln,li){ doc.text(ln, M+4, qy+li*5); });
    wy += qBoxH + 4;

    var isOk   = document.getElementById('pc'+i).classList.contains('ok');
    var chosen = prob.studentChoice != null ? pdfText(prob.options[prob.studentChoice]||'-') : '-';
    var corr   = pdfText(prob.options[prob.correctIdx]||'');
    var expRaw = pdfText(prob.explanation||'');
    doc.setFontSize(8.5); var chLines = doc.splitTextToSize('Alumno: '+chosen, TW-18);
    doc.setFontSize(8);   var coLines = doc.splitTextToSize('Correcto: '+corr, TW-18);
    doc.setFontSize(7.5); var exLines = doc.splitTextToSize('Solución: '+expRaw, TW-18).slice(0,4);
    var ansBoxH = 8 + chLines.length*5.5 + coLines.length*5 + exLines.length*5 + 6;
    doc.setFillColor(isOk?232:255, isOk?240:232, isOk?232:228);
    doc.roundedRect(M,wy,TW,ansBoxH,2,2,'F');
    doc.setFillColor(isOk?26:176, isOk?106:48, isOk?74:16);
    doc.circle(M+7, wy+8, 3.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(9); doc.setFont('helvetica','bold');
    doc.text(isOk?'✓':'✗', M+5.2, wy+10.5);
    var ay = wy+7;
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','bold');
    chLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5.5); });
    ay += chLines.length*5.5 + 3;
    doc.setTextColor(26,106,74); doc.setFontSize(8); doc.setFont('helvetica','normal');
    coLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    ay += coLines.length*5 + 3;
    doc.setTextColor(90,85,80); doc.setFontSize(7.5);
    exLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    wy += ansBoxH + 5;

    doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
    doc.setFontSize(7); doc.setFont('helvetica','bold');
    doc.rect(M,wy,TW,8,'F'); doc.text('TRABAJO DEL ALUMNO', M+4, wy+5.5);
    wy += 11;

    var dc = document.getElementById('dc'+i);
    if (dc) {
      try {
        var imgD = dc.toDataURL('image/png');
        var ar   = dc.height / dc.width;
        var iw   = TW;
        var ih   = Math.min(iw * ar, 68);
        doc.addImage(imgD, 'PNG', M, wy, iw, ih);
        wy += ih + 4;
      } catch(e) {}
    }

      var taLines = doc.splitTextToSize(ta.value, TW);

    // ── SAVE / SHARE — iOS-safe download (LIAXA iOS PDF fix, Rule 12) ─────────
  //   iOS Safari ignores the <a download> attribute, so a plain download fails
  //   silently on iPhone/iPad. iOS -> native share sheet (-> "Save to Files"),
  //   with an inline-open fallback; everything else -> <a download> click.
  //   Runs synchronously off the tap so iOS accepts navigator.share().
  var _fname   = 'geo1_t10_g01_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf';
  var _pdfBlob = doc.output('blob');

  function _restorePdfBtn(){ btn.innerHTML = '\u2b07 &nbsp;' + t('btn-pdf'); btn.disabled = false; }
  function _openPdfInline(b){
    var u = URL.createObjectURL(b);

    if (!w) { window.location.href = u; }
    setTimeout(function(){ URL.revokeObjectURL(u); }, 60000);
  }

  var _isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
               (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  if (_isIOS) {
    var _pdfFile = new File([_pdfBlob], _fname, { type:'application/pdf' });
    if (navigator.canShare && navigator.canShare({ files:[_pdfFile] })) {
      navigator.share({ files:[_pdfFile], title:_fname })
        .then(_restorePdfBtn)
        .catch(function(e){
          if (e && e.name === 'AbortError') { _restorePdfBtn(); return; }
          _openPdfInline(_pdfBlob); _restorePdfBtn();
        });

    _openPdfInline(_pdfBlob); _restorePdfBtn();

   GUÍA :: Origen, usos y degradación del suelo.
   Cómo nace el suelo a partir de la roca y de los seres vivos, para qué lo usa
   una comunidad, qué le ocurre cuando se le pide más de lo que aguanta, cómo se
   enlaza con el clima que está cambiando, y qué acción puede sostener un grupo
   de estudiantes con datos en la mano.
   Bilingüe (Rule 10), variantes por semilla (Rule 4), manipulativos marcados
   con data-widget (Part 0).
   ══════════════════════════════════════════════════════════════════════════ */
function L(o){ return (o && o[LANG] !== undefined) ? o[LANG] : (o ? o.es : ''); }
function ri(rng, a, b){ return a + Math.floor(rng() * (b - a + 1)); }
function pk(rng, a){ return a[Math.floor(rng() * a.length)]; }
function permOf(n, rng){
  var a = [], i;
  for (i = 0; i < n; i++) a.push(i);
  for (i = a.length - 1; i > 0; i--){ var j = Math.floor(rng() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}

function say(host, cls, msg){
  var e = host.querySelector('.gw-fb');
  if (!e) return;
  e.className = 'gw-fb' + (cls ? ' ' + cls : '');
  e.innerHTML = msg;
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 1 :: DE LA ROCA AL SUELO (ordenar la formación)
   ══════════════════════════════════════════════════════════════════════════ */
function wRoca(rng, host){
  var STEPS = [
    { es:'La roca queda expuesta al aire, al agua de lluvia y a los cambios de temperatura', en:'The rock is left exposed to the air, to rainwater and to changes in temperature' },
    { es:'La roca se agrieta y se parte en fragmentos cada vez más pequeños', en:'The rock cracks and breaks into smaller and smaller fragments' },
    { es:'Musgos y líquenes se instalan sobre los fragmentos y los siguen desgastando', en:'Mosses and lichens settle on the fragments and go on wearing them down' },
    { es:'Los restos de esas plantas se acumulan y forman materia orgánica', en:'The remains of those plants pile up and form organic matter' },
    { es:'Lombrices, raíces y bacterias mezclan la materia orgánica con los fragmentos minerales', en:'Worms, roots and bacteria mix the organic matter with the mineral fragments' },
    { es:'El terreno queda con capas distintas: la más viva arriba y la roca madre hasta abajo', en:'The ground ends up with different layers: the most alive on top and the parent rock at the bottom' }
  ];
  var N = STEPS.length;
  var st = { order: permOf(N, rng), sel: null, tries: 0, done: false };
  if (st.order.every(function(v, i){ return v === i; })) { var q = st.order[0]; st.order[0] = st.order[N - 1]; st.order[N - 1] = q; }

  function render(){
    var chips = st.order.map(function(ei, pos){
      var cls = 'tl-chip' + (st.done ? ' locked' : (st.sel === pos ? ' sel' : ''));
      return '<div class="' + cls + '" data-p="' + pos + '"><span class="tl-num">' + (pos + 1) + '</span>' + L(STEPS[ei]) + '</div>';
    }).join('');
    host.innerHTML =
      '<div class="gw-h iw-tag">' + L({ es:'De la roca al suelo', en:'From rock to soil' }) + '</div>' +
      '<div class="gw-q">' + L({ es:'¿En qué orden aparece el suelo sobre una roca desnuda?', en:'In what order does soil appear on top of bare rock?' }) + '</div>' +
      '<div class="gw-mini iw-sub">' + L({
        es:'Ordena los pasos del primero al último. Toca dos tarjetas para intercambiarlas y después verifica.',
        en:'Order the steps from first to last. Tap two cards to swap them and then check.'
      }) + '</div>' +
      '<div class="tl-list">' + chips + '</div>' +
      (st.done ? '' : '<div class="gw-row"><button class="gw-btn" data-r="check">' + L({ es:'Verificar el orden', en:'Check the order' }) + '</button></div>') +
      '<div class="gw-fb"></div>';
    host.querySelectorAll('.tl-chip').forEach(function(el){
      el.addEventListener('click', function(){ tap(parseInt(el.getAttribute('data-p'), 10)); });
    });
    var b = host.querySelector('[data-r="check"]');
    if (b) b.addEventListener('click', check);
  }

  function tap(pos){
    if (st.done) return;
    var msg = host.querySelector('.gw-fb').innerHTML;
    if (st.sel === null) st.sel = pos;
    else if (st.sel === pos) st.sel = null;
    else { var t = st.order[st.sel]; st.order[st.sel] = st.order[pos]; st.order[pos] = t; st.sel = null; }
    render();
    if (msg) say(host, '', msg);
  }

  function check(){
    var ok = st.order.every(function(ei, pos){ return ei === pos; });
    if (ok){
      st.done = true; render();
      say(host, 'good', '🎉 ' + L({
        es:'Ese es el orden. Fíjate en lo que pasó: primero se rompe la roca y hasta el final aparece la parte viva. Por eso un suelo con su capa oscura arriba no se improvisa, es el resultado de cientos de años de trabajo del agua, del aire y de los seres vivos.',
        en:'That is the order. Notice what happened: first the rock breaks and only at the end does the living part appear. That is why soil with its dark top layer cannot be improvised, it is the result of hundreds of years of work by water, air and living things.'
      }));
      return;
    }
    st.tries++;
    if (st.tries >= 3){
      st.order = STEPS.map(function(_, i){ return i; });
      st.done = true; render();
      say(host, 'warm', L({
        es:'Este es el orden. Cada paso solo puede ocurrir si el anterior ya ocurrió: sin fragmentos no hay dónde se agarren los musgos, y sin restos de plantas no hay materia orgánica que mezclar.',
        en:'This is the order. Each step can only happen if the previous one already happened: with no fragments there is nothing for the mosses to hold on to, and with no plant remains there is no organic matter to mix in.'
      }));
      return;
    }
    var bad = 0;
    for (var i = 0; i < N; i++){ if (st.order[i] !== i){ bad = i; break; } }
    say(host, 'miss', L({
      es:'Todavía no. Mira la tarjeta número ' + (bad + 1) + ': ¿lo que dice puede ocurrir antes de lo que está arriba de ella?',
      en:'Not yet. Look at card number ' + (bad + 1) + ': can what it says happen before what is above it?'
    }));
  }

  render();
  say(host, '', L({
    es:'Los seis pasos están revueltos.',
    en:'The six steps are shuffled.'
  }));
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 2 :: EL MAPA DE USOS (clasificar en cuatro usos del suelo)
   ══════════════════════════════════════════════════════════════════════════ */
function wUsos(rng, host){
  var BINS = [
    { es:'Agrícola', en:'Farming' },
    { es:'Ganadero', en:'Livestock' },
    { es:'Forestal', en:'Forestry' },
    { es:'Urbano', en:'Urban' }
  ];
  var ITEMS = [
    { es:'Se abren los surcos para sembrar maíz y frijol antes de la temporada de lluvias', en:'Furrows are opened to sow maize and beans before the rainy season', bin:0,
      why:{ es:'Lo que se obtiene del terreno es una cosecha, y para eso hay que remover y sembrar.', en:'What is obtained from the ground is a harvest, and for that you have to break the ground and sow.' } },
    { es:'Un potrero cercado donde pastan veinte vacas durante todo el año', en:'A fenced paddock where twenty cows graze all year round', bin:1,
      why:{ es:'El terreno se destina a alimentar animales, no a levantar una cosecha.', en:'The ground is given over to feeding animals, not to raising a crop.' } },
    { es:'Se aprovechan por temporadas la madera y la resina de un bosque de pinos y se vuelve a plantar', en:'Timber and resin from a pine forest are used by seasons and replanting is done', bin:2,
      why:{ es:'Se aprovecha el árbol y se mantiene el bosque en pie: ese es el uso forestal.', en:'The tree is used and the forest is kept standing: that is forestry use.' } },
    { es:'Se traza una calle y se conectan las tomas de agua de un fraccionamiento nuevo', en:'A street is laid out and the water connections of a new housing estate are made', bin:3,
      why:{ es:'El suelo queda debajo de calles y construcciones, cubierto y sin producir.', en:'The soil ends up beneath streets and buildings, covered over and not producing.' } },
    { es:'Un huerto de hortalizas regado por goteo en la orilla del pueblo', en:'A vegetable garden watered by drip irrigation on the edge of the town', bin:0,
      why:{ es:'También aquí el terreno se trabaja para dar alimento de cultivo.', en:'Here too the ground is worked to give a food crop.' } },
    { es:'Se siembra pasto para los borregos y su paso se rota entre dos terrenos', en:'Grass is sown for the sheep and their grazing is rotated between two plots', bin:1,
      why:{ es:'El pasto no se cosecha para las personas: sostiene al rebaño.', en:'The grass is not harvested for people: it supports the flock.' } },
    { es:'Se plantan árboles de la región en una ladera para recuperar la cubierta y frenar el agua', en:'Trees of the region are planted on a slope to bring back the cover and slow the water', bin:2,
      why:{ es:'Devolver la cubierta de árboles a un terreno también es un uso forestal.', en:'Bringing tree cover back to a piece of land is also a forestry use.' } },
    { es:'Se nivela un terreno para levantar una bodega y el estacionamiento de los camiones', en:'A plot is levelled to put up a warehouse and the lorry car park', bin:3,
      why:{ es:'La superficie queda sellada: el agua ya no se infiltra por ahí.', en:'The surface ends up sealed: water no longer soaks in there.' } }
  ];
  var st = { seq: permOf(ITEMS.length, rng), i: 0, tries: 0, hits: 0, done: false, busy: false };

  function render(){
    st.busy = false;
    if (st.done){
      host.innerHTML =
        '<div class="gw-h iw-tag">' + L({ es:'El mapa de usos', en:'The map of uses' }) + '</div>' +
        '<div class="gw-q">' + L({ es:'Mapa terminado', en:'Map finished' }) + '</div>' +
        '<div class="gw-fb good">🎉 ' + L({
          es:'Acertaste ' + st.hits + ' de ' + ITEMS.length + '. Para saber el uso de un terreno no preguntes cómo se ve, pregunta qué se le pide: una cosecha, alimento para animales, madera y cubierta, o superficie para construir.',
          en:'You got ' + st.hits + ' of ' + ITEMS.length + '. To know the use of a plot do not ask how it looks, ask what is being asked of it: a harvest, food for animals, timber and cover, or surface to build on.'
        }) + '</div>';
      return;
    }
    var it = ITEMS[st.seq[st.i]];
    host.innerHTML =
      '<div class="gw-h iw-tag">' + L({ es:'El mapa de usos', en:'The map of uses' }) + '</div>' +
      '<div class="gw-q">' + L({ es:'¿A qué uso del suelo corresponde cada terreno?', en:'Which soil use does each plot belong to?' }) + '</div>' +
      '<div class="gw-mini iw-sub">' + L({
        es:'Lee lo que ocurre en el terreno y decide qué se le está pidiendo al suelo.',
        en:'Read what happens on the plot and decide what is being asked of the soil.'
      }) + '</div>' +
      '<div class="cl-prog">' + (st.i + 1) + ' / ' + ITEMS.length + '</div>' +
      '<div class="cl-card">' + L(it) + '</div>' +
      '<div class="cl-bins">' + BINS.map(function(b, bi){
        return '<button class="cl-bin" data-b="' + bi + '">' + L(b) + '</button>';
      }).join('') + '</div>' +
      '<div class="gw-fb"></div>';
    host.querySelectorAll('.cl-bin').forEach(function(btn){
      btn.addEventListener('click', function(){ choose(parseInt(btn.getAttribute('data-b'), 10)); });
    });
  }

  function advance(){
    st.busy = true;
    st.i++; st.tries = 0;
    if (st.i >= ITEMS.length) st.done = true;
    setTimeout(render, 1200);
  }

  function choose(bi){
    if (st.busy || st.done) return;
    var it = ITEMS[st.seq[st.i]];
    if (bi === it.bin){
      st.hits++;
      say(host, 'good', '✓ ' + L(it.why));
      advance();
      return;
    }
    st.tries++;
    if (st.tries >= 3){
      say(host, 'warm', L({ es:'Es uso ', en:'It is ' }) + '<b>' + L(BINS[it.bin]) + '</b>. ' + L(it.why));
      advance();
      return;
    }
    var nudge;
    if (bi === 0) nudge = { es:'Todavía no. ¿De verdad se levanta una cosecha en ese terreno?', en:'Not yet. Is a harvest really taken from that plot?' };
    else if (bi === 1) nudge = { es:'Todavía no. ¿Hay animales comiendo ahí, o el terreno da otra cosa?', en:'Not yet. Are there animals eating there, or does the plot give something else?' };
    else if (bi === 2) nudge = { es:'Todavía no. ¿El terreno queda con árboles en pie al final?', en:'Not yet. Does the plot end up with trees standing on it?' };
    else nudge = { es:'Todavía no. ¿El suelo queda cubierto por construcciones o sigue descubierto?', en:'Not yet. Does the soil end up covered by buildings or is it still open?' };
    say(host, 'miss', L(nudge));
  }

  render();
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 3 :: LA PARCELA CANSADA (práctica  ->  daño que produce)
   ══════════════════════════════════════════════════════════════════════════ */
function wDanio(rng, host){
  var PAIRS = [
    { a:{ es:'Trazar los surcos de la ladera bajando en línea recta con la pendiente', en:'Laying the furrows of the slope straight down with the gradient' },
      b:{ es:'El agua de lluvia corre rápido por el surco y se lleva la capa fértil de arriba', en:'Rainwater runs fast along the furrow and carries away the fertile top layer' },
      cue:{ es:'abre un camino recto por donde el agua baja sin freno', en:'opens a straight path for the water to run down unchecked' } },
    { a:{ es:'Dejar el terreno desnudo entre una cosecha y la siguiente siembra', en:'Leaving the ground bare between one harvest and the next sowing' },
      b:{ es:'El viento levanta las partículas sueltas y se lleva el suelo seco', en:'The wind lifts the loose particles and carries the dry soil away' },
      cue:{ es:'deja la superficie sin nada que la sujete cuando sopla el viento', en:'leaves the surface with nothing holding it when the wind blows' } },
    { a:{ es:'Regar en exceso en una zona calurosa sin salida para el agua sobrante', en:'Watering too much in a hot area with no way out for the leftover water' },
      b:{ es:'Al evaporarse el agua quedan sales en la superficie y las plantas crecen mal', en:'As the water evaporates salts are left on the surface and plants grow badly' },
      cue:{ es:'mete al terreno más agua de la que puede salir, y el agua se va dejando lo que traía', en:'puts more water into the ground than can leave, and the water goes leaving behind what it carried' } },
    { a:{ es:'Pasar maquinaria pesada una y otra vez sobre el mismo terreno húmedo', en:'Driving heavy machinery over and over across the same wet plot' },
      b:{ es:'El suelo se aprieta, el agua ya no se infiltra y las raíces no avanzan', en:'The soil is pressed tight, water no longer soaks in and roots cannot advance' },
      cue:{ es:'aplasta los huecos por donde entraban el aire y el agua', en:'crushes the gaps through which air and water used to enter' } },
    { a:{ es:'Meter en el potrero más animales de los que la hierba alcanza a sostener', en:'Putting more animals in the paddock than the grass can support' },
      b:{ es:'La hierba no logra rebrotar y el terreno queda descubierto y pisoteado', en:'The grass cannot grow back and the ground is left bare and trampled' },
      cue:{ es:'consume la hierba más rápido de lo que la hierba se repone', en:'eats the grass faster than the grass grows back' } }
  ];
  var N = PAIRS.length;
  var st = { left: permOf(N, rng), right: permOf(N, rng), sel: null, done: [], tries: 0 };

  function isDone(i){ return st.done.indexOf(i) >= 0; }

  function render(){
    var leftHtml = st.left.map(function(i){
      var cls = 'mt-chip' + (isDone(i) ? ' done' : (st.sel === i ? ' sel' : ''));
      return '<div class="' + cls + '" data-side="a" data-i="' + i + '">' + L(PAIRS[i].a) + '</div>';
    }).join('');
    var rightHtml = st.right.map(function(i){
      var cls = 'mt-chip' + (isDone(i) ? ' done' : '');
      return '<div class="' + cls + '" data-side="b" data-i="' + i + '">' + L(PAIRS[i].b) + '</div>';
    }).join('');
    host.innerHTML =
      '<div class="gw-h iw-tag">' + L({ es:'La parcela cansada', en:'The tired plot' }) + '</div>' +
      '<div class="gw-q">' + L({ es:'¿Qué le hace al suelo cada una de estas prácticas?', en:'What does each of these practices do to the soil?' }) + '</div>' +
      '<div class="gw-mini iw-sub">' + L({
        es:'Toca una práctica de la izquierda y después el daño que produce. Los pares que aciertes se quedan fijos.',
        en:'Tap a practice on the left and then the damage it produces. The pairs you get right stay fixed.'
      }) + '</div>' +
      '<div class="mt-wrap">' +
        '<div class="mt-col"><div class="mt-lbl">' + L({ es:'Lo que se hace', en:'What is done' }) + '</div>' + leftHtml + '</div>' +
        '<div class="mt-col"><div class="mt-lbl">' + L({ es:'Lo que le pasa al suelo', en:'What happens to the soil' }) + '</div>' + rightHtml + '</div>' +
      '</div>' +
      '<div class="gw-fb"></div>';
    host.querySelectorAll('.mt-chip').forEach(function(el){
      el.addEventListener('click', function(){ tap(el.getAttribute('data-side'), parseInt(el.getAttribute('data-i'), 10)); });
    });
  }

  function finish(){
    say(host, 'good', '🎉 ' + L({
      es:'Parcela revisada. Ninguna de estas prácticas fue hecha con mala intención: todas buscaban producir más o más rápido. La degradación aparece cuando se le pide al suelo más de lo que alcanza a reponer.',
      en:'Plot reviewed. None of these practices was done with bad intent: all of them were after more or faster production. Degradation appears when more is asked of the soil than it manages to replace.'
    }));
  }

  function tap(side, i){
    if (isDone(i)) return;
    if (side === 'a'){
      st.sel = (st.sel === i ? null : i);
      var keep = host.querySelector('.gw-fb').innerHTML;
      render();
      if (st.sel !== null){
        say(host, 'warm', L({ es:'Elegiste ', en:'You picked ' }) + '<b>' + L(PAIRS[st.sel].a) + '</b>. ' +
          L({ es:'Ahora toca lo que eso le hace al suelo.', en:'Now tap what that does to the soil.' }));
      } else if (keep){ say(host, '', keep); }
      return;
    }
    if (st.sel === null){
      say(host, 'warm', L({
        es:'Primero elige una práctica de la izquierda: el daño se entiende cuando sabes qué lo provocó.',
        en:'Pick a practice on the left first: the damage makes sense once you know what caused it.'
      }));
      return;
    }
    var chosen = st.sel;
    if (i === chosen){
      st.done.push(chosen); st.sel = null; st.tries = 0;
      render();
      if (st.done.length >= N){ finish(); return; }
      say(host, 'good', '✓ ' + L({ es:'Esa práctica ', en:'That practice ' }) + L(PAIRS[chosen].cue) + '.');
      return;
    }
    st.tries++;
    if (st.tries >= 3){
      st.done.push(chosen); st.sel = null; st.tries = 0;
      render();
      say(host, 'warm', L({ es:'Le corresponde: ', en:'The right one is: ' }) + '<b>' + L(PAIRS[chosen].b) + '</b>. ' +
        L({ es:'Esa práctica ', en:'That practice ' }) + L(PAIRS[chosen].cue) + '.');
      if (st.done.length >= N) finish();
      return;
    }
    say(host, 'miss', L({ es:'Todavía no. Esa práctica ', en:'Not yet. That practice ' }) +
      L(PAIRS[chosen].cue) + L({ es:', vuelve a elegir.', en:', choose again.' }));
  }

  render();
  say(host, '', L({
    es:'Cinco prácticas comunes y cinco daños, revueltos.',
    en:'Five common practices and five kinds of damage, shuffled.'
  }));
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 4 :: EL TABLERO DEL CLIMA (marcar lo que sí calienta el planeta)
   ══════════════════════════════════════════════════════════════════════════ */
function wClima(rng, host){
  var TILES = [
    { es:'Quemar carbón, petróleo y gas para producir electricidad y mover vehículos', en:'Burning coal, oil and gas to produce electricity and move vehicles', ok:true,
      why:{ es:'Es la fuente principal del dióxido de carbono que se acumula en el aire.', en:'It is the main source of the carbon dioxide that builds up in the air.' } },
    { es:'Desmontar y quemar bosques para abrir terrenos de cultivo o potreros', en:'Clearing and burning forests to open crop fields or paddocks', ok:true,
      why:{ es:'El carbono guardado en los árboles y en el suelo termina en el aire.', en:'The carbon stored in the trees and in the soil ends up in the air.' } },
    { es:'Dejar que la basura se pudra amontonada sin ningún manejo', en:'Letting rubbish rot in piles with no management at all', ok:true,
      why:{ es:'Al pudrirse sin aire libera metano, otro gas de efecto invernadero.', en:'Rotting without air releases methane, another greenhouse gas.' } },
    { es:'Cultivar y criar ganado en superficies cada vez más grandes de tierra desmontada', en:'Farming and raising cattle on ever larger areas of cleared land', ok:true,
      why:{ es:'Cada hectárea desmontada suma emisiones y resta suelo que guardaba carbono.', en:'Every cleared hectare adds emissions and removes soil that was storing carbon.' } },
    { es:'El paso de las estaciones a lo largo del año', en:'The passing of the seasons through the year', ok:false,
      why:{ es:'Las estaciones se repiten cada año desde siempre: no explican una subida sostenida.', en:'The seasons have repeated every year forever: they do not explain a sustained rise.' } },
    { es:'Que un día de esta semana haga más calor que el mismo día del año pasado', en:'That one day this week is hotter than the same day last year', ok:false,
      why:{ es:'Eso es el estado del tiempo de un día; el clima se mide en promedios de muchos años.', en:'That is the weather of one day; climate is measured in averages over many years.' } },
    { es:'El plástico que flota en el mar y llega hasta las playas', en:'The plastic floating in the sea and washing up on the beaches', ok:false,
      why:{ es:'Es un problema grave de contaminación, pero no es un gas que retenga calor.', en:'It is a serious pollution problem, but it is not a gas that traps heat.' } },
    { es:'El adelgazamiento de la capa de ozono sobre las zonas polares', en:'The thinning of the ozone layer over the polar regions', ok:false,
      why:{ es:'Ese daño deja pasar más radiación ultravioleta, que es otro asunto distinto.', en:'That damage lets more ultraviolet radiation through, which is a different matter.' } }
  ];
  var ord = permOf(TILES.length, rng);
  var st = { sel: TILES.map(function(){ return false; }), tries: 0, done: false };

  function render(){
    var grid = ord.map(function(i){
      var cls = 'bd-tile';
      if (st.done) cls += TILES[i].ok ? ' good' : ' bad';
      else if (st.sel[i]) cls += ' on';
      return '<button class="' + cls + '" data-i="' + i + '">' + L(TILES[i]) + '</button>';
    }).join('');
    host.innerHTML =
      '<div class="gw-h iw-tag">' + L({ es:'El tablero del clima', en:'The climate board' }) + '</div>' +
      '<div class="gw-q">' + L({ es:'¿Cuáles sí aumentan los gases que calientan el planeta?', en:'Which ones really increase the gases that warm the planet?' }) + '</div>' +
      '<div class="gw-mini iw-sub">' + L({
        es:'Marca solo las tarjetas que agregan gases de efecto invernadero al aire. Puedes marcar y desmarcar las veces que quieras antes de verificar.',
        en:'Mark only the cards that add greenhouse gases to the air. You can mark and unmark as many times as you like before checking.'
      }) + '</div>' +
      '<div class="bd-grid">' + grid + '</div>' +
      (st.done ? '' : '<div class="gw-row"><button class="gw-btn" data-r="check">' + L({ es:'Verificar el tablero', en:'Check the board' }) + '</button></div>') +
      '<div class="gw-fb"></div>';
    host.querySelectorAll('.bd-tile').forEach(function(el){
      el.addEventListener('click', function(){ toggle(parseInt(el.getAttribute('data-i'), 10)); });
    });
    var b = host.querySelector('[data-r="check"]');
    if (b) b.addEventListener('click', check);
  }

  function toggle(i){
    if (st.done) return;
    var msg = host.querySelector('.gw-fb').innerHTML;
    st.sel[i] = !st.sel[i];
    render();
    if (msg) say(host, '', msg);
  }

  function check(){
    var extra = [], falta = [];
    TILES.forEach(function(tt, i){
      if (st.sel[i] && !tt.ok) extra.push(i);
      if (!st.sel[i] && tt.ok) falta.push(i);
    });
    if (extra.length === 0 && falta.length === 0){
      st.done = true; render();
      say(host, 'good', '🎉 ' + L({
        es:'Tablero resuelto. Las cuatro que marcaste tienen algo en común: todas sacan carbono que estaba guardado bajo tierra o en los seres vivos y lo mandan al aire. Las otras cuatro son problemas reales o hechos normales, pero no son la causa del calentamiento.',
        en:'Board solved. The four you marked have something in common: all of them take carbon that was stored underground or in living things and send it into the air. The other four are real problems or normal facts, but they are not the cause of the warming.'
      }));
      return;
    }
    st.tries++;
    if (st.tries >= 3){
      st.done = true; render();
      say(host, 'warm', L({
        es:'Estas son las cuatro que sí agregan gases de efecto invernadero. Las otras cuatro confunden el estado del tiempo con el clima, o mezclan el calentamiento con otros daños ambientales que tienen causas distintas.',
        en:'These are the four that really add greenhouse gases. The other four confuse weather with climate, or mix up the warming with other environmental damage that has different causes.'
      }));
      return;
    }
    if (extra.length){
      say(host, 'miss', L({ es:'Revisa la que dice ', en:'Look again at the one that says ' }) + '<b>' + L(TILES[extra[0]]) + '</b>. ' +
        L({ es:'¿Esa tarjeta suma gases al aire, o es otra cosa?', en:'Does that card add gases to the air, or is it something else?' }));
      return;
    }
    say(host, 'miss', L({
      es:'Te falta al menos una. Busca la que saca carbono de donde estaba guardado y lo suelta al aire.',
      en:'You are missing at least one. Look for the one that takes carbon out of where it was stored and lets it into the air.'
    }));
  }

  render();
  say(host, '', L({
    es:'Ocho tarjetas: cuatro suman gases de efecto invernadero y cuatro no.',
    en:'Eight cards: four add greenhouse gases and four do not.'
  }));
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 5 :: EL PLAN DE LA PARCELA (repartir jornadas, cubrir dos metas)
   ══════════════════════════════════════════════════════════════════════════ */
function wParcela(rng, host){
  var xm = ri(rng, 3, 5);
  var ym = ri(rng, 2, 4);
  var T  = xm + ym + ri(rng, 1, 2);
  var r  = ri(rng, 8, 12);
  var f  = ri(rng, 4, 7);
  var R  = xm * r;
  var F  = ym * f;
  var st = { x: 1, y: 1 };

  host.innerHTML =
    '<div class="gw-h iw-tag">' + L({ es:'El plan de la parcela', en:'The plot plan' }) + '</div>' +
    '<div class="gw-q">' + L({ es:'Dos metas, ' + T + ' jornadas y una sola ladera', en:'Two goals, ' + T + ' work sessions and a single slope' }) + '</div>' +
    '<div class="gw-mini iw-sub">' + L({
      es:'El grupo dispone de ' + T + ' jornadas este mes. Cada jornada de barreras vivas protege ' + r + ' metros de ladera y cada jornada de composta alcanza para abonar ' + f + ' surcos del huerto. Mueve las barras hasta cubrir las dos metas sin pasarte de las jornadas disponibles.',
      en:'The group has ' + T + ' work sessions this month. Each session of living barriers protects ' + r + ' metres of slope and each composting session is enough to feed ' + f + ' furrows of the garden. Move the bars until both goals are covered without going over the sessions available.'
    }) + '</div>' +
    '<div class="pl-row">' +
      '<div class="pl-lbl"><span>' + L({ es:'Jornadas de barreras vivas en la ladera', en:'Sessions of living barriers on the slope' }) + '</span><span class="pl-val" data-v="x"></span></div>' +
      '<div class="pl-track"><div class="pl-fill" data-b="x"></div></div>' +
      '<input class="pl-sld" type="range" data-s="x" min="0" max="' + T + '" step="1" value="' + st.x + '">' +
    '</div>' +
    '<div class="pl-row">' +
      '<div class="pl-lbl"><span>' + L({ es:'Jornadas de composta para el huerto', en:'Composting sessions for the garden' }) + '</span><span class="pl-val" data-v="y"></span></div>' +
      '<div class="pl-track"><div class="pl-fill alt" data-b="y"></div></div>' +
      '<input class="pl-sld" type="range" data-s="y" min="0" max="' + T + '" step="1" value="' + st.y + '">' +
    '</div>' +
    '<div class="pl-stats">' +
      '<div class="pl-st"><div class="pl-sl">' + L({ es:'Jornadas usadas', en:'Sessions used' }) + '</div><div class="pl-sv" data-k="t"></div></div>' +
      '<div class="pl-st"><div class="pl-sl">' + L({ es:'Metros protegidos', en:'Metres protected' }) + '</div><div class="pl-sv" data-k="r"></div></div>' +
      '<div class="pl-st"><div class="pl-sl">' + L({ es:'Surcos abonados', en:'Furrows fed' }) + '</div><div class="pl-sv" data-k="f"></div></div>' +
    '</div>' +
    '<div class="gw-fb"></div>';

  function draw(){
    var used = st.x + st.y, met = st.x * r, sur = st.y * f;
    host.querySelector('[data-v="x"]').textContent = st.x;
    host.querySelector('[data-v="y"]').textContent = st.y;
    host.querySelector('[data-b="x"]').style.width = (st.x / T * 100) + '%';
    host.querySelector('[data-b="y"]').style.width = (st.y / T * 100) + '%';
    host.querySelector('[data-k="t"]').textContent = used + ' / ' + T;
    host.querySelector('[data-k="r"]').textContent = met + ' / ' + R;
    host.querySelector('[data-k="f"]').textContent = sur + ' / ' + F;
    host.querySelector('[data-k="t"]').className = 'pl-sv ' + (used <= T ? 'hit' : 'miss');
    host.querySelector('[data-k="r"]').className = 'pl-sv ' + (met >= R ? 'hit' : 'miss');
    host.querySelector('[data-k="f"]').className = 'pl-sv ' + (sur >= F ? 'hit' : 'miss');
    host.querySelector('[data-b="x"]').className = 'pl-fill' + (used > T ? ' off' : '');
    host.querySelector('[data-b="y"]').className = 'pl-fill alt' + (used > T ? ' off' : '');

    if (used > T){
      say(host, 'miss', L({
        es:'Estás comprometiendo ' + used + ' jornadas y el grupo solo tiene ' + T + '. Un plan que nadie puede cumplir se cae en la primera semana: baja alguna de las dos barras.',
        en:'You are committing ' + used + ' sessions and the group only has ' + T + '. A plan nobody can carry out collapses in the first week: lower one of the two bars.'
      }));
      return;
    }
    if (met < R){
      say(host, 'warm', L({
        es:'A la ladera le faltan ' + (R - met) + ' metros por proteger. Todavía te quedan jornadas libres: sube la barra de barreras vivas.',
        en:'The slope still has ' + (R - met) + ' metres left to protect. You still have free sessions: raise the living barriers bar.'
      }));
      return;
    }
    if (sur < F){
      say(host, 'warm', L({
        es:'Faltan ' + (F - sur) + ' surcos por abonar. Sube la barra de composta sin pasarte de las ' + T + ' jornadas.',
        en:'There are still ' + (F - sur) + ' furrows to feed. Raise the composting bar without going over the ' + T + ' sessions.'
      }));
      return;
    }
    say(host, 'good', '🎉 ' + L({
      es:'Plan armado: cubres las dos metas y te sobran ' + (T - used) + ' jornadas. Fíjate en lo que hiciste: la composta devuelve al suelo la materia orgánica que ya se había ido, y las barreras evitan que se vaya la que todavía queda. Un plan que solo repara vuelve a empezar cada año.',
      en:'Plan ready: you cover both goals and have ' + (T - used) + ' sessions to spare. Notice what you did: the compost gives back to the soil the organic matter already lost, and the barriers keep what is still there from leaving. A plan that only repairs starts over every year.'
    }));
  }

  host.querySelectorAll('.pl-sld').forEach(function(sl){
    sl.addEventListener('input', function(){
      st[sl.getAttribute('data-s')] = parseInt(sl.value, 10);
      draw();
    });
  });
  draw();
}

          '<button class="tbtn2 bmarker">' + t('btn-marker') + '</button>' +
          '<button class="tbtn2 beraser">' + t('btn-eraser') + '</button>' +
          '<div class="cdot sel" data-color="#0f2d5a" style="background:#0f2d5a"></div>' +
          '<div class="cdot" data-color="#1a1a16" style="background:#1a1a16"></div>' +
          '<div class="cdot" data-color="#8b2500" style="background:#8b2500"></div>' +

    '<div class="gw-row"><button class="gw-btn" data-r="save">' + L({ es:'Guardar mi postura', en:'Save my stand' }) + '</button></div>' +
    '<div class="gw-fb"></div>';

  var tt = host.querySelector('[data-r="tt"]'), td = host.querySelector('[data-r="td"]');
  var cvReady = false;
  function showPanel(which){
    ['type','draw'].forEach(function(k){
      var el = document.getElementById('rf_' + k);
      if (el) el.classList.toggle('active', k === which);
    });
    tt.classList.toggle('active', which === 'type');
    td.classList.toggle('active', which === 'draw');
    if (which === 'draw' && !cvReady) setTimeout(function(){
      var c = document.getElementById('rfCv');
      if (c){ cvReady = true; initCanvas(c); }
    }, 60);
  }
  tt.addEventListener('click', function(){ showPanel('type'); });
  td.addEventListener('click', function(){ showPanel('draw'); });

  host.querySelector('[data-r="save"]').addEventListener('click', function(){
    say(host, 'good', '✓ ' + L({
      es:'Guardado. Aquí no hay una sola respuesta buena: lo que vale es que tu postura se apoye en algo que se pueda mostrar y no solo en lo que a ti te parece.',
      en:'Saved. There is no single right answer here: what counts is that your stand rests on something you can show and not only on what seems true to you.'
    }));
  });

  say(host, '', L({
    es:'Puedes escribir, dibujar, o las dos cosas.',
    en:'You can write, sketch, or do both.'
  }));
}

function addProblem(rng, v){
  var idx = problems.length;
  var opts = L(v.opts).slice();
  var correctVal = opts[v.ci];
  var sh = shuffle(opts, rng);
  var prob = {
    title: L(v.title),
    questionText: L(v.q),
    fn: '',
    hint: L(v.hint),
    explanation: L(v.exp),
    options: sh,
    correctIdx: sh.indexOf(correctVal),
    showWork: !!v.showWork,
    studentChoice: null,
    pendingChoice: null
  };
  problems.push(prob);
  buildOneCard(prob, idx);
}
