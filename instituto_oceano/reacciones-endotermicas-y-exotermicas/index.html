                 'Less mass than at the start, because part of the matter turned into the heat that left.',
                 'More mass than at the start, because the jar absorbed heat from the room while cooling.',
                 'Less mass than at the start, because the reaction used up part of the reactants to heat itself.'] },
      ci:0,
      hint:{ es:'Cuenta por separado dos cosas que viajan distinto: los átomos, que siguen atrapados en el frasco sellado, y la energía, que sí puede cruzar el vidrio.',
            en:'Count separately two things that travel differently: the atoms, which are still trapped in the sealed jar, and the energy, which can indeed cross the glass.' },
      exp:{ es:'En el frasco sellado no entra ni sale un solo átomo, así que la masa total no cambia: los mismos átomos quedaron unidos de otra manera. Lo único que cruzó el vidrio fue energía, y la energía que se transfiere en estas reacciones no aparece en la balanza.',
            en:'In the sealed jar not a single atom goes in or out, so the total mass does not change: the same atoms ended up joined in another way. The only thing that crossed the glass was energy, and the energy transferred in these reactions does not show up on the scale.' } },

    { title:{ es:'El cerillo y la fogata', en:'The match and the bonfire' },
      showWork:false,
      q:{ es:'Para encender una fogata hace falta acercarle un cerillo, y aun así la fogata suelta durante horas muchísimo más calor del que aportó ese cerillo. ¿Cómo se explica eso?',
          en:'To light a bonfire a match has to be brought near, and even so the bonfire gives off far more heat for hours than that match provided. How is that explained?' },
      opts:{ es:['La reacción necesita un empujón inicial para comenzar, pero después entrega mucha más energía de la que recibió.',
                 'La reacción es endotérmica mientras dura el cerillo y se vuelve exotérmica cuando la leña ya está prendida.',
                 'El cerillo crea la energía que después se reparte, y la leña solo sirve para que ese calor dure más tiempo.',
                 'La leña tenía calor guardado desde antes y el cerillo únicamente abre la salida para que ese calor escape.'],
             en:['The reaction needs an initial push to begin, but afterwards it hands over far more energy than it received.',
                 'The reaction is endothermic while the match lasts and becomes exothermic once the firewood is alight.',
                 'The match creates the energy that is then shared out, and the firewood only serves to make that heat last longer.',
                 'The firewood had heat stored beforehand and the match only opens the way out for that heat to escape.'] },
      ci:0,
      hint:{ es:'Separa el empujón que pone en marcha el cambio del saldo total de energía, y recuerda que la energía no se fabrica de la nada.',
             en:'Separate the push that sets the change in motion from the total energy balance, and remember that energy is not manufactured out of nothing.' },
      exp:{ es:'El cerillo solo aporta la energía mínima para iniciar la combustión; una vez encendida, la leña y el oxígeno forman uniones más estables y el saldo sale hacia el entorno durante horas. La energía tampoco estaba ahí como calor: estaba guardada en las uniones de la madera y del oxígeno.',
            en:'The match only provides the minimum energy to start the burning; once alight, the wood and the oxygen form more stable joins and the balance goes out to the surroundings for hours. Nor was the energy sitting there as heat: it was stored in the joins of the wood and the oxygen.' } }
  ]);
}

/* ══════════════════════════════════════════════════════════════════════════
   BUILD LESSON - concepto, manipulativo, problema, intercalados (Rule 1)
   ══════════════════════════════════════════════════════════════════════════ */
function buildLesson(rng){
  injectGuideCSS();

  sec(
    L({ es:'Punto de partida', en:'Starting point' }),
    L({ es:'Lo que el termómetro alcanza a contar', en:'What the thermometer manages to tell' }),
    '<p>' + L({
      es:'Cuando dos sustancias reaccionan no solo cambia lo que hay dentro del vaso: casi siempre cambia también la temperatura de todo lo que está alrededor. Hay mezclas que se calientan hasta quemar sin que nadie les acerque fuego, y otras que se enfrían tanto que el vidrio se cubre de escarcha en pleno mediodía. Ese detalle, que parece un efecto secundario, es una de las cosas más útiles que se pueden saber de una reacción.',
      en:'When two substances react, it is not only what is inside the glass that changes: almost always the temperature of everything around changes too. There are mixtures that heat up enough to burn without anybody bringing fire near, and others that cool down so much that the glass gets covered in frost at midday. That detail, which looks like a side effect, is one of the most useful things you can know about a reaction.'
    }) + '</p>' +
    '<p>' + L({
      es:'En esta guía vas a predecir hacia dónde viaja la energía en escenas de laboratorio y de casa, vas a separar los casos que entregan calor de los que lo piden prestado, vas a escribir la energía dentro de la ecuación en el lado que le toca, vas a hacer la cuenta entre romper y formar uniones y vas a construir el perfil de energía de una reacción.',
      en:'In this guide you will predict which way the energy travels in scenes from the lab and from home, you will separate the cases that hand out heat from the ones that borrow it, you will write the energy inside the equation on the side it belongs to, you will do the tally between breaking and forming joins, and you will build the energy profile of a reaction.'
    }) + '</p>' +
    '<div class="gw-lbl">' + L({ es:'Lo que vas a poder hacer', en:'What you will be able to do' }) + '</div>' +
    '<div>' +
      '<span class="gw-chip">' + L({ es:'sistema y entorno', en:'system and surroundings' }) + '</span>' +
      '<span class="gw-chip">' + L({ es:'leer el termómetro', en:'reading the thermometer' }) + '</span>' +
      '<span class="gw-chip">' + L({ es:'exotérmicas', en:'exothermic' }) + '</span>' +
      '<span class="gw-chip">' + L({ es:'endotérmicas', en:'endothermic' }) + '</span>' +
      '<span class="gw-chip">' + L({ es:'energía en la ecuación', en:'energy in the equation' }) + '</span>' +
      '<span class="gw-chip">' + L({ es:'romper y formar uniones', en:'breaking and forming joins' }) + '</span>' +
      '<span class="gw-chip">' + L({ es:'perfil de energía', en:'energy profile' }) + '</span>' +
      '<span class="gw-chip">' + L({ es:'usos en la vida diaria', en:'uses in daily life' }) + '</span>' +
    '</div>'
  );

  /* ══ CONCEPTO 1 ══ */
  var s1 = sec(
    L({ es:'Concepto 1', en:'Concept 1' }),
    L({ es:'El sistema, el entorno y el viaje de la energía', en:'The system, the surroundings and the journey of the energy' }),
    '<p>' + L({
      es:'Para hablar de energía en una reacción conviene partir el mundo en dos. El sistema es lo que reacciona: las sustancias que están cambiando. El entorno es todo lo demás que puede recibir o entregar calor: el agua del vaso, el vidrio, el aire, la mesa, tu mano. Esa separación resuelve la confusión más común, porque el termómetro casi nunca está metido en el sistema: está en el entorno, y lo que marca es lo que le pasó al entorno.',
      en:'To talk about energy in a reaction it helps to split the world in two. The system is what reacts: the substances that are changing. The surroundings are everything else that can receive or hand over heat: the water in the glass, the glass itself, the air, the bench, your hand. That split settles the most common confusion, because the thermometer is almost never inside the system: it is in the surroundings, and what it reads is what happened to the surroundings.'
    }) + '</p>' +
    '<p>' + L({
      es:'Con esa idea, la lectura se vuelve directa. Si el entorno se calienta es porque recibió energía, y la única fuente disponible era el sistema. Si el entorno se enfría es porque entregó energía, y quien se la llevó fue el sistema. En ningún caso la energía se fabrica ni se pierde: cambia de lugar, igual que los átomos cambian de vecino sin dejar de existir.',
      en:'With that idea, the reading becomes direct. If the surroundings heat up it is because they received energy, and the only source available was the system. If the surroundings cool down it is because they handed energy over, and the one that took it was the system. In no case is energy manufactured or lost: it changes place, just as atoms change neighbours without ever ceasing to exist.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Sistema', en:'System' }), L({ es:'lo que reacciona', en:'what reacts' }), L({ es:'las sustancias que están cambiando dentro del recipiente', en:'the substances that are changing inside the container' })) +
      rcard(L({ es:'Entorno', en:'Surroundings' }), L({ es:'todo lo demás', en:'everything else' }), L({ es:'el agua, el vidrio, el aire y la mano que toca el vaso', en:'the water, the glass, the air and the hand touching it' })) +
      rcard(L({ es:'Termómetro', en:'Thermometer' }), L({ es:'mide el entorno', en:'it measures the surroundings' }), L({ es:'sube si el entorno recibió energía y baja si la entregó', en:'it rises if the surroundings received energy and drops if they gave it up' })) +
      rcard(L({ es:'La energía', en:'The energy' }), L({ es:'cambia de lugar', en:'it changes place' }), L({ es:'no se fabrica ni se destruye durante la reacción', en:'it is not manufactured or destroyed during the reaction' })) +
    '</div>'
  );
  wTermometro(rng, widgetHost(s1, 'wTermo', 'termometro'));
  addProblem(rng, mkP1(rng));

  /* ══ CONCEPTO 2 ══ */
  var s2 = sec(
    L({ es:'Concepto 2', en:'Concept 2' }),
    L({ es:'Las que entregan y las que piden prestado', en:'The ones that hand over and the ones that borrow' }),
    '<p>' + L({
      es:'Según hacia dónde viaje la energía, las reacciones se reparten en dos familias con nombre propio. Una reacción exotérmica es la que entrega energía al entorno: lo cercano se calienta y el cambio continúa por su cuenta una vez iniciado. Una reacción endotérmica es la que toma energía del entorno: lo cercano se enfría, o bien alguien tiene que mantener encendida una fuente de calor, de luz o de corriente para que el cambio no se detenga.',
      en:'Depending on which way the energy travels, reactions fall into two families with names of their own. An exothermic reaction is one that hands energy to the surroundings: nearby things heat up and the change carries on by itself once started. An endothermic reaction is one that takes energy from the surroundings: nearby things cool down, or else somebody has to keep a source of heat, light or current running so that the change does not stop.'
    }) + '</p>' +
    '<p>' + L({
      es:'Dos confusiones se repiten mucho y vale la pena desarmarlas. La primera es creer que si una reacción necesita un cerillo o una chispa para arrancar entonces es endotérmica; no lo es, porque ese empujón inicial es minúsculo comparado con todo lo que la reacción devuelve después. La segunda es hablar de frío y caliente como si describieran a la reacción: describen al entorno, que es lo único que se puede tocar y medir.',
      en:'Two confusions come up a lot and it is worth taking them apart. The first is believing that if a reaction needs a match or a spark to get going then it is endothermic; it is not, because that initial push is tiny compared with everything the reaction gives back afterwards. The second is talking about cold and hot as if they described the reaction: they describe the surroundings, which are the only thing you can touch and measure.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Exotérmica', en:'Exothermic' }), L({ es:'entrega energía', en:'hands energy over' }), L({ es:'combustión, oxidación del hierro, cal viva con agua', en:'burning, iron rusting, quicklime with water' })) +
      rcard(L({ es:'Endotérmica', en:'Endothermic' }), L({ es:'toma energía', en:'takes energy in' }), L({ es:'fotosíntesis, hornos de cal, compresas instantáneas', en:'photosynthesis, lime kilns, instant packs' })) +
      rcard(L({ es:'Prueba rápida', en:'Quick test' }), L({ es:'quita la fuente', en:'remove the source' }), L({ es:'si al quitarla el cambio se detiene, la energía entraba', en:'if the change stops when you remove it, energy was going in' })) +
      rcard(L({ es:'Cuidado', en:'Careful' }), L({ es:'arrancar no es alimentar', en:'starting is not feeding' }), L({ es:'una chispa inicial no vuelve endotérmica a la reacción', en:'an initial spark does not make the reaction endothermic' })) +
    '</div>'
  );
  wClasifica(rng, widgetHost(s2, 'wClas', 'clasifica'));
  addProblem(rng, mkP2(rng));
  addProblem(rng, mkP3(rng));

  /* ══ CONCEPTO 3 ══ */
  var s3 = sec(
    L({ es:'Concepto 3', en:'Concept 3' }),
    L({ es:'La energía escrita dentro de la ecuación', en:'The energy written inside the equation' }),
    '<p>' + L({
      es:'La energía cabe en la propia ecuación como si fuera una sustancia más, y su lugar no es decorativo. Si la reacción la entrega, se escribe junto a los productos, porque es algo que sale del cambio. Si la reacción la necesita, se escribe junto a los reactivos, porque es algo que hay que aportar junto con las sustancias de partida. Colocada así, la ecuación deja de describir solo qué se transforma y empieza a describir también qué se siente alrededor.',
      en:'Energy fits into the equation itself as if it were one more substance, and its place is not decorative. If the reaction hands it over, it is written next to the products, because it is something that comes out of the change. If the reaction needs it, it is written next to the reactants, because it is something that has to be supplied together with the starting substances. Placed like that, the equation stops describing only what transforms and starts describing what is felt around it too.'
    }) + '</p>' +
    '<p>' + L({
      es:'El caso más claro de esta escritura es un par de reacciones que van al revés una de la otra. La fotosíntesis lleva la energía del lado de los reactivos, porque necesita la luz del Sol para guardar esa energía dentro de la glucosa. La respiración celular lleva la misma energía del lado de los productos, porque libera lo que estaba guardado en la glucosa. Leer de qué lado quedó la palabra energía alcanza para saber qué esperar del entorno.',
      en:'The clearest case of this writing is a pair of reactions that run opposite to each other. Photosynthesis carries the energy on the reactants side, because it needs sunlight to store that energy inside the glucose. Cellular respiration carries the same energy on the products side, because it releases what was stored in the glucose. Reading which side the word energy ended up on is enough to know what to expect from the surroundings.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Con los productos', en:'With the products' }), L({ es:'la reacción la entrega', en:'the reaction hands it over' }), L({ es:'lo cercano se calienta sin que nadie lo caliente', en:'nearby things heat up without anybody heating them' })) +
      rcard(L({ es:'Con los reactivos', en:'With the reactants' }), L({ es:'la reacción la consume', en:'the reaction consumes it' }), L({ es:'el cambio se detiene si se corta el aporte', en:'the change stops if the supply is cut off' })) +
      rcard(L({ es:'Fotosíntesis', en:'Photosynthesis' }), L({ es:'la guarda', en:'it stores it' }), L({ es:'la luz del Sol termina dentro de la glucosa', en:'sunlight ends up inside the glucose' })) +
      rcard(L({ es:'Respiración', en:'Respiration' }), L({ es:'la devuelve', en:'it gives it back' }), L({ es:'saca de la glucosa el calor que sostiene tu cuerpo', en:'it draws from glucose the heat that sustains your body' })) +
    '</div>'
  );
  wUne(rng, widgetHost(s3, 'wUne', 'match'));
  addProblem(rng, mkP4(rng));
  addProblem(rng, mkP5(rng));

  /* ══ CONCEPTO 4 ══ */
  var s4 = sec(
    L({ es:'Concepto 4', en:'Concept 4' }),
    L({ es:'La cuenta entre romper y formar', en:'The tally between breaking and forming' }),
    '<p>' + L({
      es:'Debajo del calor que se siente hay una cuenta muy sencilla. Separar los átomos de los reactivos siempre cuesta energía, sin excepción, y unir los átomos en los productos siempre la devuelve. El resultado de la reacción depende de cuál de las dos cantidades sea mayor: si al formar se devuelve más de lo que costó romper, sobra energía y ese sobrante sale al entorno; si se devuelve menos, falta energía y la reacción la toma de fuera.',
      en:'Underneath the heat you feel there is a very simple tally. Pulling apart the atoms of the reactants always costs energy, without exception, and joining the atoms into the products always gives it back. The outcome of the reaction depends on which of the two amounts is larger: if forming gives back more than breaking cost, energy is left over and that surplus goes out to the surroundings; if it gives back less, energy is missing and the reaction takes it from outside.'
    }) + '</p>' +
    '<p>' + L({
      es:'Esa cuenta se dibuja en un diagrama de dos niveles, llamado perfil de energía. El nivel de abajo o de arriba indica cuánta energía guardan las sustancias, y lo que importa no es la altura de cada nivel sino la distancia entre los dos. Cuando los productos quedan por debajo de los reactivos, la reacción entregó esa diferencia; cuando quedan por encima, la tuvo que pedir prestada. Dibujar el perfil equivale a hacer la resta.',
      en:'That tally is drawn in a two level diagram, called an energy profile. The lower or upper level shows how much energy the substances store, and what matters is not the height of each level but the distance between the two. When the products end up below the reactants, the reaction handed that difference over; when they end up above, it had to borrow it. Drawing the profile is the same as doing the subtraction.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Romper', en:'Breaking' }), L({ es:'siempre cuesta', en:'always costs' }), L({ es:'hay que invertir energía para separar los átomos', en:'energy has to be invested to pull atoms apart' })) +
      rcard(L({ es:'Formar', en:'Forming' }), L({ es:'siempre devuelve', en:'always gives back' }), L({ es:'al unirse los átomos se recupera energía', en:'when atoms join, energy is recovered' })) +
      rcard(L({ es:'El saldo', en:'The balance' }), L({ es:'la diferencia manda', en:'the difference decides' }), L({ es:'lo que sobra sale y lo que falta se toma del entorno', en:'the surplus goes out and the shortfall is taken from outside' })) +
      rcard(L({ es:'Perfil', en:'Profile' }), L({ es:'dos niveles', en:'two levels' }), L({ es:'la distancia entre ellos es la energía intercambiada', en:'the distance between them is the energy exchanged' })) +
    '</div>'
  );
  wPerfil(rng, widgetHost(s4, 'wPerf', 'perfil'));
  addProblem(rng, mkP6(rng));
  addProblem(rng, mkP7(rng));

  /* ══ CONCEPTO 5 ══ */
  var s5 = sec(
    L({ es:'Concepto 5', en:'Concept 5' }),
    L({ es:'Para qué sirve saber hacia dónde va la energía', en:'What knowing which way the energy goes is good for' }),
    '<p>' + L({
      es:'Casi todo lo que usas a diario descansa en alguna de las dos familias. Las reacciones que entregan energía mueven el transporte, calientan la comida, sueldan metales y hacen funcionar los calentadores de manos que se activan con el aire. Las que la piden prestada permiten enfriar un golpe con una compresa, obtener cal en un horno, separar el hidrógeno del agua y, sobre todo, guardar la energía del Sol dentro de los alimentos.',
      en:'Almost everything you use every day rests on one of the two families. Reactions that hand energy over move transport, heat food, weld metals and run the hand warmers that switch on with the air. The ones that borrow it make it possible to cool a knock with a pack, obtain lime in a kiln, separate hydrogen from water and, above all, store the energy of the Sun inside food.'
    }) + '</p>' +
    '<p>' + L({
      es:'Saber de qué familia es una reacción también sirve para decidir y para cuidar. Un combustible se elige por la energía que entrega y por lo que deja en el aire al quemarse; una reacción muy exotérmica se controla para que no libere todo su calor de golpe; y el calor que sale de una fábrica se puede aprovechar en lugar de tirarlo. En todos los casos la energía solo cambia de lugar, y decidir bien es decidir a dónde queremos que vaya.',
      en:'Knowing which family a reaction belongs to is also useful for deciding and for taking care. A fuel is chosen for the energy it hands over and for what it leaves in the air when burned; a strongly exothermic reaction is kept under control so it does not release all its heat at once; and the heat leaving a factory can be put to use instead of thrown away. In every case the energy only changes place, and deciding well means deciding where we want it to go.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Calentar', en:'Heating' }), L({ es:'reacciones que entregan', en:'reactions that hand over' }), L({ es:'combustibles, calentadores de manos, soldadura', en:'fuels, hand warmers, welding' })) +
      rcard(L({ es:'Enfriar', en:'Cooling' }), L({ es:'reacciones que toman', en:'reactions that take in' }), L({ es:'compresas instantáneas para una hinchazón', en:'instant packs for a swelling' })) +
      rcard(L({ es:'Producir', en:'Producing' }), L({ es:'energía que se aporta', en:'energy that is supplied' }), L({ es:'cal en el horno e hidrógeno a partir del agua', en:'lime in the kiln and hydrogen from water' })) +
      rcard(L({ es:'Cuidar', en:'Taking care' }), L({ es:'decidir a dónde va', en:'deciding where it goes' }), L({ es:'controlar el calor liberado y lo que deja en el aire', en:'controlling the heat released and what it leaves in the air' })) +
    '</div>'
  );
  wCuaderno(rng, widgetHost(s5, 'wCuad', 'reflect'));
  addProblem(rng, mkP8(rng));

  /* ══ CIERRE ══ */
  addProblem(rng, mkP9(rng));
  addProblem(rng, mkP10(rng));
}

</script>

<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbzLGV15JRTPs9bbSvHRLfgOXeT9oUExDf1AH546WOwq5tYxXSdhX212OWi_bTJfMGx9/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'Reacciones Endotérmicas y Exotérmicas';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
