<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Guerra Fría: Origen y Desarrollo</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">La Guerra Fría: Origen y Desarrollo</div>
    <div class="wcourse" id="wcourse-el">Historia · 2° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">La Guerra Fría: Origen y Desarrollo</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="sbtn" id="dlBtn" onclick="generatePDF()" style="max-width:280px;margin:0 auto;">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   CENTRALIZED SCHOOL CONFIG (Rule 16) — ships UNBRANDED (Rule 11).
   The ONLY rebranding point. build_all.py substitutes these exact fields
   (BRAND_FIELDS / RGB_FIELDS / logo*) downstream; :root/dark stay as fallback.
   Neutral defaults below == the static :root/dark values, so unbranded == no-op.
   ══════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:'#0c6cb4', primaryDark:'#032f50', primaryBg:'#e5f0f8',
  accent:'#9ccce4', accentBg:'#e3f0f7',
  darkPrimary:'#3191d8', darkPrimaryDark:'#64b7f6', darkPrimaryBg:'#052741',

function setLang(l){

/* ── Attempt counter + seed (Rule 4): seed = name+group+attempt ── */
function getAttemptKey(name, group){ return 'his2_t05_g03__att__' + (name+'__'+group).replace(/\s+/g,'_'); }
function nextAttempt(name, group){ var k=getAttemptKey(name,group),n=0; try{n=parseInt(localStorage.getItem(k)||'0',10)||0;}catch(e){} n++; try{localStorage.setItem(k,String(n));}catch(e){} return n; }
function currentAttempt(name, group){ var k=getAttemptKey(name,group); try{return parseInt(localStorage.getItem(k)||'1',10)||1;}catch(e){return 1;} }
/* ================================================
   STATE
   ================================================ */
var studentData   = {};
var problems      = [];

/* ================================================
   SESSION PERSISTENCE  (localStorage)
   ================================================ */
function lsKey() {
  var n = (studentData.name  || '').trim();
  var g = (studentData.group || '').trim();
  return 'his2_t05_g03__' + (n + '__' + g).replace(/\s+/g, '_');
}

function saveSession() {
  if (!studentData.name) return;
  var drawings = [], texts = [], photos = [];
  problems.forEach(function(p, i) {
    var dc = document.getElementById('dc' + i);
    if (dc && dc.width) {
      var blank = document.createElement('canvas');
      blank.width = dc.width; blank.height = dc.height;
      drawings.push(dc.toDataURL() === blank.toDataURL() ? null : dc.toDataURL('image/png'));
    } else { drawings.push(null); }
    var ta = document.getElementById('ta' + i);
    texts.push(ta ? ta.value : '');
    var pp = document.getElementById('pp' + i);
    photos.push((pp && pp.src && pp.src.indexOf('data:') === 0) ? pp.src : null);
  });
  var state = {
    name: studentData.name, group: studentData.group,
    answeredCount: answeredCount, correctCount: correctCount,
    choices: problems.map(function(p) { return p.studentChoice; }),
    drawings: drawings, texts: texts, photos: photos
  };
  try { localStorage.setItem(lsKey(), JSON.stringify(state)); } catch(e) {}
}

function loadSession(name, group) {
  var key = 'his2_t05_g03__' + (name + '__' + group).replace(/\s+/g, '_');
  try { var r = localStorage.getItem(key); return r ? JSON.parse(r) : null; } catch(e) { return null; }
}

function restoreSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  var saved = loadSession(name, group);
  if (!saved) return;
  document.getElementById('restoreBar').style.display = 'none';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = currentAttempt(name, group);
  buildLesson(seededRng(name + group + att));
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
  saved.choices.forEach(function(choice, idx) {
    if (choice !== null && choice !== undefined) confirmMC(idx, choice);
  });
  setTimeout(function() {
    if (saved.drawings) {
      saved.drawings.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var dc = document.getElementById('dc' + i);
        if (!dc || !dc.width) return;
        var img = new Image();
        img.onload = function() {
          var dpr = window.devicePixelRatio || 1;
          dc.getContext('2d').drawImage(img, 0, 0, dc.width / dpr, dc.height / dpr);
        };
        img.src = dataUrl;
      });
    }
    if (saved.texts) {
      saved.texts.forEach(function(text, i) {
        if (!text) return;
        var ta = document.getElementById('ta' + i);
        if (ta) ta.value = text;
      });
    }
    if (saved.photos) {
      saved.photos.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var pp = document.getElementById('pp' + i);
        if (!pp) return;
        pp.src = dataUrl; pp.style.display = 'block';
        var pz = document.getElementById('pz' + i);
        if (pz) pz.style.opacity = '0.4';
      });
    }
  }, 300);
}

function dismissRestore() {
  document.getElementById('restoreBar').style.display = 'none';
}

function checkForSavedSession() {
  var name  = document.getElementById('sName').value.trim();

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

async function generatePDF() {
  var btn = document.getElementById('dlBtn');
  btn.textContent = 'Generando PDF…';
  btn.disabled = true;

  var jspdf   = window.jspdf;
  var doc     = new jspdf.jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });
  var PW      = 215.9;
  var M       = 18;
  var TW      = PW - M * 2;
  var PH      = doc.internal.pageSize.height;
  var name    = studentData.name;
  var group   = studentData.group;
  var total   = problems.length;
  var pct     = Math.round(correctCount / total * 100);
  var dateStr = new Date().toLocaleString('es-MX', { dateStyle:'long', timeStyle:'short' });

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS — INJECTION BLOCK ─────────────────────────────────────────
  //   Match these RGB values to --green and --gold above.
  //   PRIMARY  → pBR, pBG, pBB
  //   ACCENT   → pAR, pAG, pAB
  // ──────────────────────────────────────────────────────────────────────────
  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;  // PRIMARY (from SCHOOL, Rule 16)
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;   // ACCENT (from SCHOOL, Rule 16)

  function pdfText(html) {
    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/\u2192/g,'->').replace(/\u2212/g,'-').replace(/\u00b2/g,'^2')
      .replace(/\u00b3/g,'^3').replace(/\u00d7/g,'x').replace(/\u00f7/g,'/')
      .replace(/\u2260/g,'!=').replace(/\u2264/g,'<=').replace(/\u2265/g,'>=')
      .replace(/\u221a/g,'sqrt').replace(/\u03c0/g,'pi').replace(/\u2026/g,'...')
      .replace(/\s+/g,' ').trim();
  }

  // ── PORTADA: orange line / white logo strip / orange line / blue band ──
  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,2,'F');   // top accent line
  doc.setFillColor(255,255,255); doc.rect(0,2,PW,26,'F');                               // white logo strip
  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,28,PW,2,'F');  // bottom accent line
  doc.setFillColor(pBR,pBG,pBB); doc.rect(0,30,PW,34,'F');       // blue header band

  if (SCHOOL.logoLeftB64) {
    var fmtL = SCHOOL.logoLeftB64.indexOf('/9j/') > -1 ? 'JPEG' : 'PNG';
    try { doc.addImage(SCHOOL.logoLeftB64, fmtL, M, 4, 48, 22); } catch(e) {}
  }
  if (SCHOOL.logoRightB64) {
    var fmtR = SCHOOL.logoRightB64.indexOf('/9j/') > -1 ? 'JPEG' : 'PNG';
    try { doc.addImage(SCHOOL.logoRightB64, fmtR, 130, 4, 48, 22); } catch(e) {}
  }

  var lx = PW - M - 36;
  var ly = 10;
  doc.setDrawColor(pBR,pBG,pBB); doc.setLineWidth(0.7);
  doc.lines([[2.57-1.03,4.63-6.17],[4.11-2.57,5.14-4.63],[5.66-4.11,2.57-5.14]], lx+1.03, ly+6.17);
  doc.setFillColor(pAR,pAG,pAB); doc.circle(lx+5.66, ly+2.57, 0.9, 'F');
  doc.setDrawColor(pAR,pAG,pAB); doc.setLineWidth(0.7);
  doc.line(lx+8.23, ly+1.54, lx+8.23, ly+7.2);
  doc.setTextColor(pBR,pBG,pBB); doc.setFontSize(11); doc.setFont('helvetica','bold');
  doc.text('LIAXA', lx+10, ly+6.8);

  // Guide title + date inside the blue band
  doc.setTextColor(232,238,247); doc.setFontSize(19); doc.setFont('helvetica','bold');
  doc.text(t('wtitle'), M, 49);
  doc.setTextColor(150,165,200); doc.setFontSize(8); doc.setFont('helvetica','normal');
  doc.text(dateStr, M, 59);

  // ── Student info card (name + group only — código goes to footer) ──
  doc.setFillColor(237,240,245); doc.roundedRect(M,72,TW,20,3,3,'F');
  doc.setTextColor(130,140,160); doc.setFontSize(8.5); doc.setFont('helvetica','bold');
  doc.text('ALUMNO', M+4, 79); doc.text('GRUPO', 130, 79);
  doc.setTextColor(20,24,32); doc.setFontSize(11); doc.setFont('helvetica','bold');
  doc.text(name, M+4, 87); doc.text(group, 130, 87);

  // ── Score box ──
  var sc = pct>=70?[26,106,74]:pct>=50?[224,123,26]:[176,48,16];
  doc.setFillColor(255,255,255); doc.roundedRect(M,100,TW,34,4,4,'F');
  doc.setDrawColor(sc[0],sc[1],sc[2]); doc.setLineWidth(0.8);
  doc.roundedRect(M,100,TW,34,4,4,'S');
  doc.setTextColor(sc[0],sc[1],sc[2]); doc.setFontSize(40); doc.setFont('helvetica','bold');

  doc.text(correctCount+' correcta(s) de '+total+' preguntas', PW/2, 131, {align:'center'});

  doc.setFontSize(7); doc.setFont('helvetica','bold');
  doc.rect(M,142,TW,8,'F'); doc.text('RESUMEN DE PROBLEMAS', M+4, 148);
  var sy = 154;
  problems.forEach(function(prob, i) {

      doc.rect(M,sy,TW,8,'F'); doc.text('RESUMEN DE PROBLEMAS (continuación)', M+4, sy+6);
      sy += 12;

    var ok = document.getElementById('pc'+i).classList.contains('ok');

    doc.roundedRect(M,sy,TW,10,2,2,'F');
    doc.setFillColor(ok?26:176, ok?106:48, ok?74:16);
    doc.circle(M+6, sy+5, 2.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(7); doc.setFont('helvetica','bold');
    doc.text(ok?'✓':'✗', M+4.5, sy+6.5);
    doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('helvetica','normal');
    doc.text('Problema '+(i+1)+': '+pdfText(prob.title), M+12, sy+6.5);
    doc.setTextColor(ok?26:176, ok?106:48, ok?74:16);
    doc.text(ok?'Correcto':'Incorrecto', PW-M-24, sy+6.5);
    sy += 12;
  });

  // ── Per-problem pages ──
  for (var i = 0; i < problems.length; i++) {
    var prob = problems[i];
    doc.addPage();
    var wy = 0;

    doc.setFillColor(pBR,pBG,pBB); doc.rect(0,0,PW,20,'F');
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,3,'F');
    doc.setTextColor(pAR,pAG,pAB); doc.setFontSize(7); doc.setFont('helvetica','normal');
    doc.text(t('wcourse')+'  ·  '+t('wtitle'), M, 10);
    doc.setTextColor(232,238,247); doc.setFontSize(10.5); doc.setFont('helvetica','bold');
    doc.text('Problema '+(i+1)+' de '+total+'  ·  '+pdfText(prob.title), M, 17);
    wy = 25;

    var qRaw = pdfText(prob.questionText);
    doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var qLines = doc.splitTextToSize(qRaw, TW-10);
    var qBoxH  = 8 + qLines.length*5 + 3;
    doc.setFillColor(237,240,245); doc.roundedRect(M,wy,TW,qBoxH,2,2,'F');
    doc.setTextColor(pBR,pBG,pBB); doc.setFontSize(6.5); doc.setFont('helvetica','bold');
    doc.text('PREGUNTA', M+4, wy+6);
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var qy = wy+12;
    qLines.forEach(function(ln,li){ doc.text(ln, M+4, qy+li*5); });
    wy += qBoxH + 4;

    var isOk   = document.getElementById('pc'+i).classList.contains('ok');
    var chosen = prob.studentChoice != null ? pdfText(prob.options[prob.studentChoice]||'-') : '-';
    var corr   = pdfText(prob.options[prob.correctIdx]||'');
    var expRaw = pdfText(prob.explanation||'');
    doc.setFontSize(8.5); var chLines = doc.splitTextToSize('Alumno: '+chosen, TW-18);
    doc.setFontSize(8);   var coLines = doc.splitTextToSize('Correcto: '+corr, TW-18);
    doc.setFontSize(7.5); var exLines = doc.splitTextToSize('Solución: '+expRaw, TW-18).slice(0,4);
    var ansBoxH = 8 + chLines.length*5.5 + coLines.length*5 + exLines.length*5 + 6;
    doc.setFillColor(isOk?232:255, isOk?240:232, isOk?232:228);
    doc.roundedRect(M,wy,TW,ansBoxH,2,2,'F');
    doc.setFillColor(isOk?26:176, isOk?106:48, isOk?74:16);
    doc.circle(M+7, wy+8, 3.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(9); doc.setFont('helvetica','bold');
    doc.text(isOk?'✓':'✗', M+5.2, wy+10.5);
    var ay = wy+7;
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','bold');
    chLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5.5); });
    ay += chLines.length*5.5 + 3;
    doc.setTextColor(26,106,74); doc.setFontSize(8); doc.setFont('helvetica','normal');
    coLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    ay += coLines.length*5 + 3;
    doc.setTextColor(90,85,80); doc.setFontSize(7.5);
    exLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    wy += ansBoxH + 5;

    doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
    doc.setFontSize(7); doc.setFont('helvetica','bold');
    doc.rect(M,wy,TW,8,'F'); doc.text('TRABAJO DEL ALUMNO', M+4, wy+5.5);
    wy += 11;

    var dc = document.getElementById('dc'+i);
    if (dc) {
      try {
        var imgD = dc.toDataURL('image/png');
        var ar   = dc.height / dc.width;
        var iw   = TW;
        var ih   = Math.min(iw * ar, 68);
        doc.addImage(imgD, 'PNG', M, wy, iw, ih);
        wy += ih + 4;
      } catch(e) {}
    }

    var ta = document.getElementById('ta'+i);
    if (ta && ta.value.trim()) {
      if (wy > PH-30) { doc.addPage(); wy = 20; }
      doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('courier','normal');
      var taLines = doc.splitTextToSize(ta.value, TW);
      taLines.slice(0,16).forEach(function(ln) {
        if (wy > PH-15) { doc.addPage(); wy = 20; }
        doc.text(ln, M, wy); wy += 5;
      });
      wy += 2;
    }

    var pp = document.getElementById('pp'+i);
    if (pp && pp.src && pp.src.indexOf('data:') === 0) {
      if (wy > PH-55) { doc.addPage(); wy = 20; }
      try { doc.addImage(pp.src, 'JPEG', M, wy, TW, 68); wy += 72; } catch(e) {}
    }
  }

  // ── Footer on every page ──
  var pages = doc.internal.getNumberOfPages();
  for (var p = 1; p <= pages; p++) {
    doc.setPage(p);
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0, PH-3, PW, 3, 'F');
    doc.setTextColor(130,140,160); doc.setFontSize(6.5); doc.setFont('helvetica','normal');
    doc.text(name+'  ·  '+group+'  ·  Código: '+code+'  ·  Página '+p+'/'+pages,
      PW/2, PH-5, {align:'center'});
  }

  doc.save('his2_t05_g03_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf');
  btn.innerHTML = '⬇ &nbsp;Descargar Resultados PDF';
  btn.disabled  = false;
}

var MANIP = {};
function L(o){ if(o===null||o===undefined) return ''; if(typeof o==='string') return o; return (o[LANG]!==undefined ? o[LANG] : o.es); }
function shuffleIdx(n, rng){ var a=[],i,j,t; for(i=0;i<n;i++) a.push(i); for(i=n-1;i>0;i--){ j=Math.floor(rng()*(i+1)); t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function shuffleOpts(opts, correctIndex, rng){
  var ord = shuffleIdx(opts.length, rng);
  return { options: ord.map(function(k){ return opts[k]; }), correctIdx: ord.indexOf(correctIndex) };
}
function pickVariant(list, rng){ return list[Math.floor(rng()*list.length)]; }
function addProblem(spec, rng){
  var so = shuffleOpts(spec.options, spec.correct, rng);
  var p = { title: spec.title, questionText: spec.questionText, fn: '', hint: spec.hint || '',
            explanation: spec.explanation || '', options: so.options, correctIdx: so.correctIdx,
            showWork: false, studentChoice: null, pendingChoice: null };
  problems.push(p);
  buildOneCard(p, problems.length - 1);
}

           '<div class="dcline">' + L({ es:'Lo que ocurrió en realidad: el gobierno estadounidense estudió las opciones en secreto, anunció una cuarentena naval en lugar de un ataque, respondió al mensaje conciliador y se comprometió a no invadir la isla. Los misiles soviéticos salieron de Cuba y, meses después, los misiles estadounidenses salieron discretamente de Turquía. Enseguida se instaló una línea de comunicación directa entre los dos gobiernos.',
                                        en:'What actually happened: the American government studied the options in secret, announced a naval quarantine instead of an attack, answered the conciliatory message and pledged not to invade the island. The Soviet missiles left Cuba and, months later, the American missiles quietly left Turkey. Soon afterwards a direct communication line was set up between the two governments.' }) + '</div>';
  }
  z.innerHTML =
    '<div class="mztitle">' + L({ es:'Trece días en la sala de decisiones', en:'Thirteen days in the decision room' }) + '</div>' +
    '<div class="mzq">' + L({ es:'Te sientas donde se decidió en octubre de 1962. Cada elección mueve el medidor de tensión y deja una consecuencia escrita. Puedes rehacer el recorrido las veces que quieras.', en:'You sit where the decisions were taken in October 1962. Each choice moves the tension meter and leaves a written consequence. You can redo the run as many times as you like.' }) + '</div>' +
    body +
    '<div class="dcgauge"><div class="dcfill' + cls + '" style="width:' + tn + '%"></div></div>' +
    '<div class="dsnum"><span>' + L({ es:'tensión internacional', en:'international tension' }) + '</span><span class="mzread">' + tn + '/100</span></div>' +
    '<div class="dclog">' + D.log.map(function(x){ return '<div class="dcline">' + x + '</div>'; }).join('') + '</div>' +
    '<div class="mzrow"><button class="mzbtn2" onclick="mD_reset()">' + L({ es:'Volver al primer día', en:'Back to the first day' }) + '</button></div>';
}
function mD_choose(oi){
  var D = MANIP.D; if (!D || D.done) return;
  var o = CRISIS[D.step].o[oi];
  D.tension = Math.max(0, Math.min(100, D.tension + o.d));
  D.log.push('<strong>' + L(o.t) + '</strong><br>' + L(o.r));
  D.step++;
  if (D.step >= CRISIS.length) D.done = true;
  mD_render();
}
function mD_reset(){
  var D = MANIP.D; if (!D) return;
  D.step = 0; D.tension = 52; D.log = []; D.done = false;
  mD_render();
}

/* ════════ MANIPULABLE E :: derriba el muro ════════
   Ocho bloques sostienen el muro; solo cinco son factores reales de su
   caída. Cada toque acertado baja la altura del muro. */
var BRICKS = [
  { ok:1, t:{ es:'La economía soviética llevaba años estancada y no lograba sostener a la vez el gasto militar y el nivel de vida de su población.', en:'The Soviet economy had been stagnant for years and could not sustain both military spending and the living standards of its population.' } },
  { ok:1, t:{ es:'El dirigente soviético impulsó reformas económicas y una mayor apertura a la crítica pública dentro del país.', en:'The Soviet leader pushed economic reforms and a greater openness to public criticism inside the country.' } },
  { ok:1, t:{ es:'Moscú dejó de sostener por la fuerza a los gobiernos aliados de Europa del Este cuando estos enfrentaron protestas.', en:'Moscow stopped propping up allied governments in eastern Europe by force when they faced protests.' } },
  { ok:1, t:{ es:'Durante 1989 crecieron las manifestaciones y las salidas masivas de personas desde la República Democrática Alemana.', en:'During 1989 demonstrations grew and huge numbers of people left the German Democratic Republic.' } },
  { ok:1, t:{ es:'Hungría abrió su frontera con Austria y dejó un camino de salida hacia el bloque occidental.', en:'Hungary opened its border with Austria and left an escape route towards the western bloc.' } },
  { ok:0, t:{ es:'Estados Unidos declaró la guerra a la Unión Soviética y sus tropas tomaron Berlín en 1989.', en:'The United States declared war on the Soviet Union and its troops took Berlin in 1989.' },
    g:{ es:'Ese bloque no cae: en toda la Guerra Fría las dos superpotencias nunca combatieron de forma directa entre ellas.', en:'That block does not fall: in the whole Cold War the two superpowers never fought each other directly.' } },
  { ok:0, t:{ es:'Las Naciones Unidas ordenaron demoler el muro y enviaron tropas internacionales a Berlín.', en:'The United Nations ordered the wall demolished and sent international troops to Berlin.' },
    g:{ es:'Ese bloque no cae: el muro se abrió por decisión del propio gobierno que lo había levantado, presionado desde dentro.', en:'That block does not fall: the wall was opened by a decision of the very government that had built it, under pressure from within.' } },
  { ok:0, t:{ es:'La flota del bloque oriental fue derrotada en una gran batalla naval en el mar Báltico.', en:'The fleet of the eastern bloc was defeated in a great naval battle in the Baltic Sea.' },
    g:{ es:'Ese bloque no cae: el final del bloque oriental no se decidió en ninguna batalla, sino en calles, fronteras y presupuestos.', en:'That block does not fall: the end of the eastern bloc was not decided in any battle, but in streets, borders and budgets.' } }
];
function mE_build(rng){
  MANIP.E = { ord: shuffleIdx(BRICKS.length, rng), gone:{}, stuck:{}, wrong:0, done:false, fb:'', fbk:'' };
}
function mE_render(){
  var E = MANIP.E, z = document.getElementById('mzE');
  if (!E || !z) return;
  var removed = 0, i;
  for (i=0;i<BRICKS.length;i++) if (E.gone[i]) removed++;
  var bricks = E.ord.map(function(k){
    var cls = E.gone[k] ? ' gone' : (E.stuck[k] ? ' stuck' : '');
    if (E.done && BRICKS[k].ok && !E.gone[k]) cls = ' shown';
    return '<div class="wbrick' + cls + '" onclick="mE_tap(' + k + ')">' + L(BRICKS[k].t) + '</div>';
  }).join('');
  var height = Math.round((5 - Math.min(removed,5)) / 5 * 100);
  z.innerHTML =
    '<div class="mztitle">' + L({ es:'Derriba el muro: quita los bloques que de verdad lo tiraron', en:'Bring the wall down: remove the blocks that really toppled it' }) + '</div>' +
    '<div class="mzq">' + L({ es:'Ocho bloques sostienen el muro, pero solo cinco explican su caída. Toca los que sí lo derribaron y observa cómo baja la altura.', en:'Eight blocks hold up the wall, but only five explain its fall. Tap the ones that really brought it down and watch the height drop.' }) + '</div>' +
    '<div class="wgrid">' + bricks + '</div>' +
    '<div class="wmeter"><div class="wfill" style="width:' + height + '%"></div></div>' +
    '<div class="dsnum"><span>' + L({ es:'altura que queda del muro', en:'wall height still standing' }) + '</span><span class="mzread">' + Math.min(removed,5) + '/5 ' + L({ es:'bloques retirados', en:'blocks removed' }) + '</span></div>' +
    '<div class="mzfb' + (E.fbk ? ' ' + E.fbk : '') + '">' + E.fb + '</div>';
}
function mE_tap(k){
  var E = MANIP.E; if (!E || E.done || E.gone[k]) return;
  if (BRICKS[k].ok){
    E.gone[k] = 1; E.stuck = {};
    var removed = 0, i;
    for (i=0;i<BRICKS.length;i++) if (E.gone[i]) removed++;
    if (removed >= 5){
      E.done = true; E.fbk = 'ok';
      E.fb = L({ es:'El muro cae. Ninguno de esos bloques por sí solo habría bastado: una economía agotada, un gobierno que decidió no reprimir, vecinos que abrieron la frontera y una población que salió a la calle actuaron a la vez. El 9 de noviembre de 1989 los pasos se abrieron y dos años después la Unión Soviética había dejado de existir.',
                 en:'The wall falls. None of those blocks alone would have been enough: an exhausted economy, a government that chose not to repress, neighbours who opened the border and a population that took to the streets all acted at once. On 9 November 1989 the crossings opened and two years later the Soviet Union had ceased to exist.' });
    } else {
      E.fbk = 'warn';
      E.fb = L({ es:'El muro pierde altura. Quedan ', en:'The wall loses height. ' }) + (5 - removed) + L({ es:' bloques que también lo sostenían.', en:' blocks that also held it up are still there.' });
    }
    mE_render(); return;
  }
  E.wrong++;
  E.stuck = {}; E.stuck[k] = 1;
  if (E.wrong >= 3){
    E.done = true; E.fbk = 'warn';
    E.fb = L({ es:'Quedan marcados los cinco bloques reales: una economía sin margen, las reformas y el retiro del apoyo desde Moscú, las protestas y las salidas masivas de 1989, y la frontera húngara abierta. El muro no cayó por una guerra, sino porque dejó de haber quien lo sostuviera.',
               en:'The five real blocks are now marked: an economy with no margin, the reforms and the withdrawal of support from Moscow, the protests and the mass departures of 1989, and the open Hungarian border. The wall did not fall because of a war, but because there was no longer anyone holding it up.' });
  } else {
    E.fbk = 'bad';
    E.fb = L(BRICKS[k].g);
  }
  mE_render();
}

/* ================================================
   buildLesson
   ================================================ */
function buildLesson(rng) {
  injectManipStyles();
  MANIP = {};
  mA_build(rng); mB_build(rng); mC_build(rng); mD_build(rng); mE_build(rng);

  /* ══════════════════ CONCEPTO 1 ══════════════════ */
  addSection(L({ es:'Concepto 1', en:'Concept 1' }), L({ es:'De aliados a rivales', en:'From allies to rivals' }),
    L({ es:'<p>En mayo de 1945, cuando terminó la guerra en Europa, los soldados estadounidenses y soviéticos se saludaron a orillas del río Elba. Habían combatido contra el mismo enemigo y en las fotografías aparecen abrazados. Dos años después, sus gobiernos se acusaban mutuamente de querer dominar el mundo. Lo que los unía era un enemigo común, no un proyecto compartido: en cuanto ese enemigo desapareció, quedaron frente a frente dos maneras opuestas de organizar la vida en sociedad.</p>' +
              '<p>Estados Unidos defendía la economía de mercado, la propiedad privada y las elecciones con varios partidos. La Unión Soviética defendía la economía planificada por el Estado, la propiedad colectiva de las fábricas y la tierra, y el gobierno de un partido único. Cada uno estaba convencido de que su modelo era mejor para toda la humanidad, y cada uno salió de la guerra con un ejército enorme y con territorio bajo su control.</p>' +
              '<p>En 1947 el gobierno estadounidense anunció que apoyaría a los pueblos que resistieran la presión soviética, una política que se conoció como contención, y ofreció una gran ayuda económica para reconstruir Europa occidental. La Unión Soviética prohibió a los países de su zona aceptar esa ayuda y organizó su propio sistema de cooperación. Europa quedó partida por lo que un discurso célebre llamó un telón de acero. A esa confrontación permanente, sostenida durante más de cuarenta años sin que las dos potencias llegaran a combatir de forma directa, se le llamó Guerra Fría.</p>',
          en:'<p>In May 1945, when the war in Europe ended, American and Soviet soldiers greeted each other on the banks of the river Elbe. They had fought the same enemy and in the photographs they appear embracing. Two years later their governments were accusing each other of wanting to dominate the world. What united them was a common enemy, not a shared project: as soon as that enemy disappeared, two opposite ways of organizing life in society stood face to face.</p>' +
              '<p>The United States defended the market economy, private property and elections with several parties. The Soviet Union defended the state planned economy, collective ownership of factories and land, and government by a single party. Each was convinced its model was better for all humanity, and each came out of the war with a huge army and with territory under its control.</p>' +
              '<p>In 1947 the American government announced it would support peoples who resisted Soviet pressure, a policy known as containment, and offered large economic aid to rebuild western Europe. The Soviet Union forbade the countries in its zone from accepting that aid and organized its own cooperation system. Europe was split by what a famous speech called an iron curtain. That permanent confrontation, kept up for more than forty years without the two powers ever fighting each other directly, was called the Cold War.</p>' }) +
    '<div class="rules-grid">' +
      '<div class="rcard"><div class="rname">' + L({ es:'Superpotencia', en:'Superpower' }) + '</div><div class="rform">' + L({ es:'poder de alcance mundial', en:'power of worldwide reach' }) + '</div><div class="rnote">' + L({ es:'Un Estado capaz de influir en cualquier región del planeta con su ejército, su dinero y sus ideas.', en:'A state able to influence any region of the planet with its army, its money and its ideas.' }) + '</div></div>' +
      '<div class="rcard"><div class="rname">' + L({ es:'Bloque', en:'Bloc' }) + '</div><div class="rform">' + L({ es:'países alineados', en:'aligned countries' }) + '</div><div class="rnote">' + L({ es:'Conjunto de países unidos a una superpotencia por alianzas, economía y modelo político.', en:'A group of countries tied to a superpower by alliances, economy and political model.' }) + '</div></div>' +
      '<div class="rcard"><div class="rname">' + L({ es:'Contención', en:'Containment' }) + '</div><div class="rform">' + L({ es:'frenar la expansión', en:'stop the expansion' }) + '</div><div class="rnote">' + L({ es:'Política de impedir que el bloque contrario sume nuevos países a su influencia.', en:'A policy of preventing the rival bloc from adding new countries to its influence.' }) + '</div></div>' +
      '<div class="rcard"><div class="rname">' + L({ es:'Orden bipolar', en:'Bipolar order' }) + '</div><div class="rform">' + L({ es:'dos centros', en:'two centres' }) + '</div><div class="rnote">' + L({ es:'Casi todos los conflictos del mundo se leían desde uno de los dos polos de poder.', en:'Almost every conflict in the world was read from one of the two poles of power.' }) + '</div></div>' +
    '</div>' +
    '<div class="mzone" id="mzA"></div>');
  mA_render();

  /* ── graded 1 ── */
  var p1v = [
    { q:{ es:'Entre 1947 y 1991 Estados Unidos y la Unión Soviética financiaron ejércitos ajenos, compitieron en armamento, se espiaron y se acusaron ante el mundo, pero sus tropas nunca se enfrentaron en un campo de batalla. ¿Qué rasgo de ese enfrentamiento explica el nombre de Guerra Fría?',
          en:'Between 1947 and 1991 the United States and the Soviet Union funded other countries armies, competed in weaponry, spied on each other and accused each other before the world, but their troops never met on a battlefield. What feature of that confrontation explains the name Cold War?' },
      o:{ es:['Fue una confrontación permanente librada por medios políticos, económicos y militares indirectos, sin combate abierto entre las dos superpotencias.',
              'Fue un periodo de paz completa en el que ninguna región del mundo vivió conflictos armados.',
              'Fue una guerra breve que se resolvió con un tratado firmado por las dos superpotencias en 1947.',
              'Fue un enfrentamiento en el que las dos superpotencias combatieron directamente, pero solo en regiones de clima frío.'],
          en:['It was a permanent confrontation waged by political, economic and indirect military means, with no open combat between the two superpowers.',
              'It was a period of complete peace in which no region of the world lived through armed conflict.',
              'It was a short war settled by a treaty signed by the two superpowers in 1947.',
              'It was a confrontation in which the two superpowers fought directly, but only in cold climate regions.'] }, c:0,
      h:{ es:'Compara lo que las dos potencias sí hicieron durante esos años con lo único que nunca llegaron a hacer entre ellas.',
          en:'Compare what the two powers did during those years with the one thing they never did to each other.' },
      e:{ es:'La expresión no habla de temperatura ni de tranquilidad. Nombra un choque constante librado con alianzas, propaganda, ayuda económica, espionaje y apoyo a bandos en guerras ajenas. Hubo conflictos muy violentos en varios continentes, pero los ejércitos de las dos superpotencias evitaron enfrentarse de forma directa, porque las dos tenían armas nucleares.',
          en:'The expression is not about temperature or calm. It names a constant clash waged with alliances, propaganda, economic aid, espionage and support for sides in other countries wars. There were very violent conflicts on several continents, but the armies of the two superpowers avoided fighting each other directly, because both held nuclear weapons.' } },
    { q:{ es:'Durante la Segunda Guerra Mundial, Estados Unidos y la Unión Soviética fueron aliados contra el mismo enemigo. Menos de tres años después de la victoria encabezaban bloques rivales. ¿Qué explica mejor esa ruptura?',
          en:'During the Second World War the United States and the Soviet Union were allies against the same enemy. Less than three years after victory they led rival blocs. What best explains that break?' },
      o:{ es:['Compartían un enemigo pero no un proyecto: cada uno defendía un modelo político y económico distinto y buscaba asegurar zonas de influencia en la Europa liberada.',
              'Ninguno de los dos países había participado realmente en la guerra y por eso desconfiaban del otro.',
              'Los dos gobiernos tenían el mismo modelo económico y competían por vender los mismos productos en Asia.',
              'La ruptura se debió a un desacuerdo sobre el reparto de las colonias africanas ocurrido en 1946.'],
          en:['They shared an enemy but not a project: each defended a different political and economic model and sought to secure zones of influence in liberated Europe.',
              'Neither country had really taken part in the war and that is why they distrusted each other.',
              'Both governments had the same economic model and competed to sell the same products in Asia.',
              'The break was caused by a disagreement over the division of the African colonies in 1946.'] }, c:0,
      h:{ es:'Pregúntate qué los mantenía juntos mientras duró la guerra y si eso seguía existiendo una vez derrotado el enemigo común.',
          en:'Ask what held them together while the war lasted and whether that still existed once the common enemy was defeated.' },
      e:{ es:'La alianza fue una alianza de circunstancia. Derrotado el enemigo común, quedaron dos Estados vencedores con ejércitos enormes, con territorios ocupados y con proyectos de sociedad incompatibles. Cada uno vio en la presencia del otro una amenaza, y las decisiones que tomó para protegerse confirmaron los temores del contrario.',
          en:'The alliance was one of circumstance. Once the common enemy was beaten, two victorious states were left with huge armies, occupied territories and incompatible visions of society. Each saw the presence of the other as a threat, and the decisions each took to protect itself confirmed the fears of the other.' } }
  ];
  var v1 = pickVariant(p1v, rng);
  addProblem({ title:L({ es:'Una guerra sin combate directo', en:'A war without direct combat' }), questionText:L(v1.q), options:L(v1.o), correct:v1.c, hint:L(v1.h), explanation:L(v1.e) }, rng);

  /* ── graded 2 ── */
  var p2v = [
    { q:{ es:'En 1947 el gobierno estadounidense anunció que ayudaría a los pueblos que resistieran la presión soviética y poco después ofreció una enorme ayuda económica para reconstruir las ciudades y las fábricas de Europa occidental. ¿Qué buscaba con esa combinación de decisiones?',
          en:'In 1947 the American government announced it would help peoples who resisted Soviet pressure and shortly afterwards offered enormous economic aid to rebuild the cities and factories of western Europe. What was it seeking with that combination of decisions?' },
      o:{ es:['Frenar la influencia soviética levantando economías que, hundidas en la miseria, podían inclinarse hacia el modelo del bloque contrario.',
              'Devolver a Alemania los territorios coloniales que había perdido al terminar la guerra.',
              'Convencer a la Unión Soviética de sumarse a la alianza militar que se firmaría en 1949.',
              'Sustituir a las Naciones Unidas por un organismo dirigido desde las capitales de Europa occidental.'],
          en:['To slow Soviet influence by lifting up economies that, sunk in poverty, might lean towards the model of the rival bloc.',
              'To return to Germany the colonial territories it had lost at the end of the war.',
              'To persuade the Soviet Union to join the military alliance that would be signed in 1949.',
              'To replace the United Nations with a body run from the capitals of western Europe.'] }, c:0,
      h:{ es:'Relaciona el estado en que quedaron las ciudades europeas después de 1945 con el atractivo que podía tener allí una propuesta de cambio radical.',
          en:'Connect the state European cities were left in after 1945 with the appeal a proposal for radical change could have there.' },
      e:{ es:'La contención partía de una idea sencilla: donde hay hambre y ruinas, las propuestas de cambio profundo ganan seguidores. Al financiar la reconstrucción, Estados Unidos ganaba socios estables, mercados para sus productos y gobiernos alineados, y al mismo tiempo reducía el atractivo del modelo soviético. Moscú lo leyó igual y prohibió a su bloque aceptar un solo dólar de esa ayuda.',
          en:'Containment rested on a simple idea: where there is hunger and rubble, proposals for deep change win followers. By funding reconstruction, the United States gained stable partners, markets for its goods and aligned governments, while lowering the appeal of the Soviet model. Moscow read it the same way and forbade its bloc from accepting a single dollar of that aid.' } },
    { q:{ es:'La Unión Soviética prohibió a los países de su zona de influencia aceptar la ayuda económica estadounidense, pese a que varios de ellos tenían ciudades destruidas, y organizó en su lugar un sistema propio de cooperación entre economías socialistas. ¿Qué muestra esa decisión?',
          en:'The Soviet Union forbade the countries in its zone of influence from accepting American economic aid, even though several of them had destroyed cities, and instead organized its own cooperation system among socialist economies. What does that decision show?' },
      o:{ es:['Que la ayuda económica no era neutral: aceptarla significaba entrar en la órbita política del bloque rival.',
              'Que los países de Europa oriental habían quedado intactos y no tenían nada que reconstruir.',
              'Que la Unión Soviética disponía de más recursos que Estados Unidos para reconstruir el continente entero.',
              'Que las dos superpotencias habían acordado repartirse por igual el costo de la reconstrucción europea.'],
          en:['That economic aid was not neutral: accepting it meant entering the political orbit of the rival bloc.',
              'That the countries of eastern Europe had been left untouched and had nothing to rebuild.',
              'That the Soviet Union had more resources than the United States to rebuild the whole continent.',
              'That the two superpowers had agreed to share equally the cost of European reconstruction.'] }, c:0,
      h:{ es:'Fíjate en que se rechazó un dinero que hacía mucha falta y pregúntate qué se recibía junto con ese dinero.',
          en:'Notice that badly needed money was turned down and ask what came along with that money.' },
      e:{ es:'Quien recibe ayuda acepta también condiciones, asesores y vínculos comerciales duraderos. Moscú prefirió ciudades reconstruidas más despacio antes que gobiernos aliados atados a la economía del bloque contrario. La decisión endureció la división: desde entonces Europa tuvo dos sistemas económicos que casi no comerciaban entre sí.',
          en:'Whoever receives aid also accepts conditions, advisers and lasting trade ties. Moscow preferred cities rebuilt more slowly to allied governments bound to the economy of the rival bloc. The decision hardened the division: from then on Europe had two economic systems that barely traded with each other.' } }
  ];
  var v2 = pickVariant(p2v, rng);
  addProblem({ title:L({ es:'Ayuda y contención', en:'Aid and containment' }), questionText:L(v2.q), options:L(v2.o), correct:v2.c, hint:L(v2.h), explanation:L(v2.e) }, rng);

  /* ══════════════════ CONCEPTO 2 ══════════════════ */
  addSection(L({ es:'Concepto 2', en:'Concept 2' }), L({ es:'El equilibrio del terror', en:'The balance of terror' }),
    L({ es:'<p>En 1945 solo un país tenía la bomba atómica. En 1949 la Unión Soviética probó la suya y el tablero cambió por completo. A partir de entonces, cada avance de un bando obligaba al otro a responder: bombas más potentes, cohetes capaces de cruzar continentes en minutos, submarinos que podían disparar desde debajo del mar. A esa competencia sin final se le llamó carrera armamentista.</p>' +
              '<p>La consecuencia fue paradójica. Cuantas más armas acumulaban, menos podían usarlas: quien disparara primero recibiría la respuesta antes de que sus propios misiles llegaran al destino. Nadie podía ganar. Los analistas de la época llamaron a esa situación equilibrio del terror, y explica por qué dos potencias enfrentadas durante cuarenta años nunca se declararon la guerra.</p>' +
              '<p>La rivalidad se desplazó entonces a otros terrenos. En 1949 se firmó la alianza militar del bloque occidental y en 1955 la del bloque oriental, de modo que casi toda Europa quedó cubierta por compromisos de defensa mutua. También compitieron en el espacio: en 1957 la Unión Soviética puso en órbita el primer satélite artificial y en 1969 Estados Unidos llevó una tripulación a la Luna. Cada logro se anunciaba al mundo entero como prueba de que un sistema funcionaba mejor que el otro.</p>',
          en:'<p>In 1945 only one country had the atomic bomb. In 1949 the Soviet Union tested its own and the board changed completely. From then on, every advance by one side forced the other to answer: more powerful bombs, rockets able to cross continents in minutes, submarines that could fire from under the sea. That endless competition was called the arms race.</p>' +
              '<p>The consequence was paradoxical. The more weapons they piled up, the less they could use them: whoever fired first would receive the answer before their own missiles reached their target. Nobody could win. Analysts of the time called that situation the balance of terror, and it explains why two powers at odds for forty years never declared war on each other.</p>' +
              '<p>The rivalry then moved to other ground. In 1949 the military alliance of the western bloc was signed and in 1955 that of the eastern bloc, so almost all of Europe was covered by mutual defence commitments. They also competed in space: in 1957 the Soviet Union put the first artificial satellite into orbit and in 1969 the United States landed a crew on the Moon. Every achievement was announced to the whole world as proof that one system worked better than the other.</p>' }) +
    '<div class="callout"><p><strong>' + L({ es:'Fíjate: ', en:'Notice: ' }) + '</strong>' + L({ es:'los mismos cohetes que ponían satélites en órbita podían transportar ojivas nucleares. La carrera espacial y la carrera armamentista eran, en buena medida, la misma competencia con dos caras.', en:'the same rockets that put satellites into orbit could carry nuclear warheads. The space race and the arms race were, to a large extent, one competition with two faces.' }) + '</p></div>' +

  addSection(L({ es:'Concepto 3', en:'Concept 3' }), L({ es:'Berlín, Corea y una línea que se podía cruzar a pie', en:'Berlin, Korea and a line you could cross on foot' }),
    L({ es:'<p>Alemania perdió la guerra y quedó ocupada por los vencedores. Su capital, Berlín, quedó dentro de la zona soviética, pero también repartida entre los cuatro ocupantes. En 1948 la Unión Soviética cerró los accesos terrestres a la parte occidental de la ciudad para obligar a los occidentales a marcharse. La respuesta no fue un ataque, sino un puente aéreo: durante casi un año, miles de vuelos llevaron alimentos y carbón a una ciudad rodeada. Nadie disparó y el bloqueo se levantó. En 1949 nacieron dos Estados alemanes distintos.</p>' +
              '<p>La misma lógica se repitió en Asia. En 1950 el ejército del norte de Corea, respaldado por el bloque soviético, invadió el sur, que recibió el apoyo de tropas enviadas bajo bandera de las Naciones Unidas y encabezadas por Estados Unidos. Tres años de combates dejaron cientos de miles de muertos y una frontera casi idéntica a la del inicio. Ninguna superpotencia declaró la guerra a la otra.</p>' +
              '<p>Berlín siguió siendo el punto más frágil del mundo. Cientos de miles de personas cruzaban desde la parte oriental hacia la occidental, muchas de ellas jóvenes con estudios. En agosto de 1961, el gobierno de la parte oriental levantó en pocos días un muro que partió calles, plazas y familias. Ese muro se volvió el símbolo más visible de la división: en cualquier otro lugar la frontera entre los dos mundos era una línea en un mapa; allí era un bloque de concreto en medio de una ciudad.</p>',
          en:'<p>Germany lost the war and was occupied by the victors. Its capital, Berlin, lay inside the Soviet zone but was also divided among the four occupiers. In 1948 the Soviet Union closed the land routes into the western part of the city to force the westerners to leave. The answer was not an attack but an airlift: for almost a year, thousands of flights carried food and coal to a surrounded city. Nobody fired and the blockade was lifted. In 1949 two separate German states were born.</p>' +
              '<p>The same logic repeated in Asia. In 1950 the army of northern Korea, backed by the Soviet bloc, invaded the south, which received support from troops sent under the United Nations flag and led by the United States. Three years of fighting left hundreds of thousands dead and a border almost identical to the one at the start. Neither superpower declared war on the other.</p>' +
              '<p>Berlin remained the most fragile point in the world. Hundreds of thousands of people crossed from the eastern part to the western one, many of them young and educated. In August 1961 the government of the eastern part raised, in a few days, a wall that cut through streets, squares and families. That wall became the most visible symbol of the division: anywhere else the border between the two worlds was a line on a map; there it was a block of concrete in the middle of a city.</p>' }) +
    '<table class="dtable"><tr><th>' + L({ es:'Episodio', en:'Episode' }) + '</th><th>' + L({ es:'Cómo se enfrentaron', en:'How they clashed' }) + '</th></tr>' +
      '<tr><td>' + L({ es:'Bloqueo de Berlín', en:'Berlin blockade' }) + '</td><td>' + L({ es:'presión sobre los accesos y abastecimiento por aire, sin abrir fuego', en:'pressure on the access routes and supply by air, without opening fire' }) + '</td></tr>' +
      '<tr><td>' + L({ es:'Guerra de Corea', en:'Korean War' }) + '</td><td>' + L({ es:'ejércitos locales apoyados con armas, dinero y asesores de cada bloque', en:'local armies backed with weapons, money and advisers from each bloc' }) + '</td></tr>' +
      '<tr><td>' + L({ es:'Muro de Berlín', en:'Berlin Wall' }) + '</td><td>' + L({ es:'control de la frontera hacia dentro, para impedir la salida de población', en:'control of the border from within, to stop the population leaving' }) + '</td></tr></table>' +
    '<div class="mzone" id="mzC"></div>');

      e:{ es:'El bloqueo buscaba expulsar a los occidentales sin disparar; el puente aéreo respondió sin cruzar la línea del disparo. Cada bando midió al otro y ninguno quiso pagar el costo de empezar una guerra por una ciudad. El bloqueo se levantó en 1949 y ese mismo año la división se volvió permanente con la creación de dos Estados alemanes.',
          en:'The blockade sought to push the westerners out without firing; the airlift answered without crossing the line of fire. Each side measured the other and neither wanted to pay the cost of starting a war over a city. The blockade was lifted in 1949 and that same year the division became permanent with the creation of two German states.' } },
    { q:{ es:'En 1950 el ejército del norte de Corea, respaldado por el bloque soviético, invadió el sur, que recibió tropas enviadas bajo bandera de las Naciones Unidas. Tres años después la frontera quedó casi donde estaba al inicio. ¿Qué muestra ese conflicto sobre la Guerra Fría?',

      o:{ es:['Que la rivalidad entre los bloques se descargaba en guerras muy violentas dentro de terceros países, aunque las superpotencias no se declararan la guerra entre sí.',

      h:{ es:'Fíjate en quiénes combatieron sobre el terreno y en quiénes pusieron las armas, el dinero y los asesores.',

      e:{ es:'Corea fue el primer gran conflicto armado de la Guerra Fría, y su forma se repetiría después: dos bandos locales sostenidos por bloques rivales, un costo humano altísimo y una situación final parecida a la inicial. La península quedó dividida y el enfrentamiento entre las superpotencias siguió sin declararse nunca de forma directa.',
          en:'Korea was the first great armed conflict of the Cold War, and its shape would repeat later: two local sides sustained by rival blocs, a very high human cost and a final situation similar to the initial one. The peninsula stayed divided and the confrontation between the superpowers continued without ever being declared directly.' } }

  addSection(L({ es:'Concepto 4', en:'Concept 4' }), L({ es:'Guerras ajenas y trece días de octubre', en:'Other countries wars and thirteen days in October' }),
    L({ es:'<p>Si las superpotencias no podían atacarse, la disputa se trasladaba a los demás. En Corea, en Vietnam, en Angola, en Afganistán y en varios países de América Latina, cada bloque envió armas, dinero, asesores y propaganda para sostener al bando que le convenía. A esos conflictos se les llama guerras por delegación: quien decidía estaba lejos, quien moría estaba en el terreno.</p>' +
              '<p>El momento más peligroso llegó en octubre de 1962. Después de la revolución cubana de 1959, la isla se había acercado a la Unión Soviética, que instaló allí rampas para misiles capaces de alcanzar territorio estadounidense en pocos minutos. Cuando los aviones de reconocimiento las fotografiaron, el gobierno de Estados Unidos tuvo que decidir en secreto, y muy rápido, qué hacer.</p>' +
              '<p>Durante trece días el mundo estuvo más cerca que nunca de una guerra nuclear. La salida no fue militar: se anunció un bloqueo naval que no disparaba, se respondió al mensaje más conciliador que llegó de Moscú, se prometió no invadir la isla y, de forma discreta, se retiraron misiles estadounidenses instalados cerca de la frontera soviética. Enseguida se instaló una línea de comunicación directa entre los dos gobiernos y comenzaron los primeros acuerdos para limitar los arsenales, un periodo que se conoció como distensión.</p>',
          en:'<p>If the superpowers could not attack each other, the dispute moved to everyone else. In Korea, in Vietnam, in Angola, in Afghanistan and in several Latin American countries, each bloc sent weapons, money, advisers and propaganda to sustain the side that suited it. Those conflicts are called proxy wars: whoever decided was far away, whoever died was on the ground.</p>' +
              '<p>The most dangerous moment came in October 1962. After the Cuban revolution of 1959, the island had drawn close to the Soviet Union, which installed launch sites there for missiles able to reach American territory in a few minutes. When reconnaissance planes photographed them, the United States government had to decide in secret, and very fast, what to do.</p>' +
              '<p>For thirteen days the world was closer than ever to a nuclear war. The way out was not military: a naval blockade that did not fire was announced, the more conciliatory message from Moscow was answered, a pledge not to invade the island was given and, quietly, American missiles stationed near the Soviet border were withdrawn. A direct communication line between the two governments was set up soon afterwards and the first agreements to limit the arsenals began, a period known as detente.</p>' }) +
    '<div class="callout"><p><strong>' + L({ es:'Fíjate: ', en:'Notice: ' }) + '</strong>' + L({ es:'ninguno de los dos gobiernos salió de octubre de 1962 como vencedor absoluto. Los dos retiraron armas y los dos evitaron aparecer derrotados ante su propia población. Esa fue, justamente, la condición para que la crisis terminara sin disparos.', en:'neither government came out of October 1962 as an outright winner. Both withdrew weapons and both avoided looking defeated before their own population. That was precisely the condition for the crisis to end without shots.' }) + '</p></div>' +
    '<div class="mzone" id="mzD"></div>');
  mD_render();
