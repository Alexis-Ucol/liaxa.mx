<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comparación y Ordenamiento de Fracciones — Matemáticas 1°</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a3a6b;   /* PRIMARY      */
  --green-dark: #0f2244;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; text-align: justify; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:100px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--text); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--gold-bg); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }

/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 72px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}
/* ── LANGUAGE TOGGLE ── */
.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
/* ── MATH FRACTIONS (ensure present) ── */
</style>
</head>
<body>

<!-- ════════════════════ WELCOME ════════════════════ -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institución" style="display:none">
    </div>
    <div class="wtitle" id="wt-title">Comparación de Fracciones</div>
    <div class="wcourse" id="wt-course">Matemáticas · 1° Secundaria</div>
    <label class="flabel" for="sName" id="lbl-name-el">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" for="sGroup" id="lbl-group-el">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 1A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Sesión guardada encontrada</strong><br>
      <span id="restoreBody">¿Deseas continuar donde la dejaste?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Retomar sesión</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Empezar de nuevo</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.9rem">
      <!-- ── LIAXA FOOTER SVG ──────────────────────────────────────────────────
           When branding for an institution, replace the two hex color values
           below with the institution's PRIMARY and ACCENT colors respectively.
           PRIMARY  → stroke/fill on the chart line and LIAXA text
           ACCENT   → fill on the dot and stroke on the vertical bar
           ──────────────────────────────────────────────────────────────────── -->
      <svg width="160" height="52" viewBox="0 0 180 52" xmlns="http://www.w3.org/2000/svg">
        <style>
          .lbt { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.1em; fill:var(--green); font-size:28px; }
          .lbl { stroke:var(--gold); stroke-width:2.5; }
          .lba { fill:var(--gold); }
        </style>
        <polyline points="5,40 14,28 24,33 36,14" fill="none" stroke="var(--green)" stroke-width="3"/>
        <circle cx="36" cy="14" r="4.5" class="lba"/>
        <line x1="52" y1="6" x2="52" y2="46" class="lbl"/>
        <text x="64" y="38" class="lbt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- ════════════════════ LESSON ════════════════════ -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO_LEFT: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="hlogo-left"  src="" alt="Institución" style="display:none">
      <!-- LOGO_RIGHT: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="hlogo-right" src="" alt="Institución" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle" id="ht-title">Comparación de Fracciones</div>
    <div class="hsep"></div>
    <div class="halexis">
      <!-- ── LIAXA HEADER SVG — same color tokens as footer ── -->
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg">
        <style>
          .lht { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
          .lhl { stroke:var(--gold); stroke-width:2; }
          .lha { fill:var(--gold); }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" fill="none" stroke="var(--green)" stroke-width="2"/>
        <circle cx="22" cy="10" r="2.5" class="lha"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lhl"/>
        <text x="42" y="22" class="lht">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
    <div class="lang-toggle">
      <button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button>
      <button class="lang-btn"        id="btn-en" onclick="setLang('en')">EN</button>
    </div>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="dlbtn" id="dlBtn" onclick="generatePDF()">⬇ &nbsp;Descargar Resultados PDF</button>
    </div>
  </div>
</div>

<script>
/* ════════════════════════════════════════════════════════════════════════
   SCHOOL CONFIG — editar SOLO este bloque para rebrandear
   ════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:         '#24240c',
  primaryDark:     '#3f3f14',
  primaryBg:       '#f4f4e9',
  accent:          '#fcb40c',
  accentBg:        '#fff4db',
  pBR: 36,  pBG: 36,  pBB: 12,
  pAR: 252, pAG: 180, pAB: 12,
  darkPrimary:     '#b4b455',
  darkPrimaryDark: '#d7d783',
  darkPrimaryBg:   '#343412',

  r.setProperty('--green',      SCHOOL.primary);
  r.setProperty('--green-dark', SCHOOL.primaryDark);
  r.setProperty('--green-bg',   SCHOOL.primaryBg);

/* ── Drawing palette, derived from the school's colours ──────────────────
   slots 1-2 : school primary + accent
   slots 3-4 : the two of black/red/blue least similar to the school colours
   ───────────────────────────────────────────────────────────────────── */
var DRAW_PALETTE = (function () {
  function hex2rgb(h) {
    h = String(h).replace('#', '');
    if (h.length === 3) { h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2]; }
    return [parseInt(h.substr(0,2),16), parseInt(h.substr(2,2),16), parseInt(h.substr(4,2),16)];
  }
  function dist(a, b) {
    var dr = a[0]-b[0], dg = a[1]-b[1], db = a[2]-b[2];
    return Math.sqrt(2*dr*dr + 4*dg*dg + 3*db*db);
  }
  var COMMON = ['#1a1a16', '#c0392b', '#1d4e89'];   /* black, red, blue */
  var schoolRGB;
  try {
    schoolRGB = [hex2rgb(SCHOOL.primary), hex2rgb(SCHOOL.accent)];
  } catch (e) {
    return [SCHOOL.primary, SCHOOL.accent, '#1a1a16', '#1d4e89'];
  }
  var scored = COMMON.map(function (c, idx) {
    var rgb = hex2rgb(c);
    var nearest = Math.min(dist(rgb, schoolRGB[0]), dist(rgb, schoolRGB[1]));
    return { c: c, idx: idx, d: nearest };
  });
  scored.sort(function (a, b) { return b.d - a.d; });      /* farthest first */
  var keep = scored.slice(0, 2);
  keep.sort(function (a, b) { return a.idx - b.idx; });    /* restore visual order */
  return [SCHOOL.primary, SCHOOL.accent, keep[0].c, keep[1].c];
})();

function drawDotsHTML() {
  return DRAW_PALETTE.map(function (c, i) {
    return '<div class="cdot' + (i === 0 ? ' sel' : '') + '" data-color="' + c +
           '" style="background:' + c + '"></div>';
  }).join('');
}

/* ── ATTEMPT COUNTER ── */
function getAttKey(name,group){ return 'mat1_fracc_comp__att__'+(name+'__'+group).replace(/\s+/g,'_'); }
function nextAttempt(name,group){
  var k=getAttKey(name,group),n=0;
  try{ n=parseInt(localStorage.getItem(k)||'0',10)||0; }catch(e){}
  n++; try{ localStorage.setItem(k,String(n)); }catch(e){} return n;
}
function currentAttempt(name,group){
  var k=getAttKey(name,group);
  try{ return parseInt(localStorage.getItem(k)||'1',10)||1; }catch(e){ return 1; }
}

/* ── SEEDED RNG ── */
function seededRng(seed) {
  var s=0;
  for(var i=0;i<seed.length;i++) s=(Math.imul(31,s)+seed.charCodeAt(i))|0;
  return function(){
    s=(s+0x9e3779b9)|0; var t=s^(s>>>16);
    t=Math.imul(t,0x21f0aaad); t^=(t>>>15);
    t=Math.imul(t,0x735a2d97); return((t^(t>>>15))>>>0)/4294967296;
  };
}
function shuffleOpts(opts,correct,rng){
  var arr=opts.slice();
  for(var i=arr.length-1;i>0;i--){ var j=Math.floor(rng()*(i+1)),tmp=arr[i]; arr[i]=arr[j]; arr[j]=tmp; }
  return { opts:arr, correctIdx:arr.indexOf(correct) };
}

function lsKey(){
  var n=(studentData.name||'').trim(), g=(studentData.group||'').trim();
  return 'mat1_fracc_oper__'+(n+'__'+g).replace(/\s+/g,'_');
}
function saveSession(){
  if(!studentData.name) return;
  var drawings=[],texts=[],photos=[];
  problems.forEach(function(p,i){
    var dc=document.getElementById('dc'+i);
    if(dc&&dc.width){ var bl=document.createElement('canvas'); bl.width=dc.width; bl.height=dc.height;
      drawings.push(dc.toDataURL()===bl.toDataURL()?null:dc.toDataURL('image/png')); }
    else drawings.push(null);
    var ta=document.getElementById('ta'+i); texts.push(ta?ta.value:'');
    var pp=document.getElementById('pp'+i);
    photos.push((pp&&pp.src&&pp.src.indexOf('data:')===0)?pp.src:null);
  });
  try{ localStorage.setItem(lsKey(),JSON.stringify({
    name:studentData.name,group:studentData.group,
    answeredCount:answeredCount,correctCount:correctCount,
    choices:problems.map(function(p){return p.studentChoice;}),
    drawings:drawings,texts:texts,photos:photos
  })); }catch(e){}
}
function loadSession(name,group){
  var key='mat1_fracc_comp__'+(name+'__'+group).replace(/\s+/g,'_');
  try{ var r=localStorage.getItem(key); return r?JSON.parse(r):null; }catch(e){ return null; }
}

/* ── CANVAS ── */
function initCanvas(canvas){
  var dpr=window.devicePixelRatio||1, rect=canvas.getBoundingClientRect();
  canvas.width=rect.width*dpr; canvas.height=rect.height*dpr;
  var ctx=canvas.getContext('2d');
  ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.scale(dpr,dpr); ctx.strokeStyle= SCHOOL.primaryDark; ctx.lineWidth=2; ctx.lineCap='round'; ctx.lineJoin='round';
  var drawing=false,lx=0,ly=0, tb=canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e){ var r=canvas.getBoundingClientRect(),src=e.touches?e.touches[0]:e; return[src.clientX-r.left,src.clientY-r.top]; }
  function onDown(e){ e.preventDefault(); drawing=true; var p=getPos(e); lx=p[0]; ly=p[1]; }
  function onMove(e){ e.preventDefault(); if(!drawing) return; var p=getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp(){ drawing=false; saveSession(); }
  canvas.addEventListener('mousedown',onDown,{passive:false}); canvas.addEventListener('mousemove',onMove,{passive:false});
  canvas.addEventListener('mouseup',onUp); canvas.addEventListener('mouseleave',onUp);
  canvas.addEventListener('touchstart',onDown,{passive:false}); canvas.addEventListener('touchmove',onMove,{passive:false});
  canvas.addEventListener('touchend',onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn){
    btn.addEventListener('click',function(){
      tb.querySelectorAll('.tbtn2').forEach(function(b){ b.classList.remove('on'); }); btn.classList.add('on');
      ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
      if(btn.classList.contains('bpen')) ctx.lineWidth=2;
      if(btn.classList.contains('bmarker')){ ctx.lineWidth=10; ctx.globalAlpha=0.45; }
      if(btn.classList.contains('beraser')){ ctx.globalCompositeOperation='destination-out'; ctx.lineWidth=20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot){
    dot.addEventListener('click',function(){
      tb.querySelectorAll('.cdot').forEach(function(d){ d.classList.remove('sel'); }); dot.classList.add('sel');
      ctx.strokeStyle=dot.dataset.color; ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b){ b.classList.remove('on'); }); tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click',function(){ var dpr=window.devicePixelRatio||1; ctx.clearRect(0,0,canvas.width/dpr,canvas.height/dpr); });
}

/* ── TWO-TAP MC HANDLER ── */
function handleMC(probIdx,chosenIdx){
  var prob=problems[probIdx]; if(prob.studentChoice!==null) return;
  var opts=document.querySelectorAll('#pc'+probIdx+' .mcopt');
  if(prob.pendingChoice===chosenIdx){
    prob.studentChoice=chosenIdx; prob.pendingChoice=null;
    var isOk=(chosenIdx===prob.correctIdx);
    opts.forEach(function(o){ o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o,i){
      if(i===prob.correctIdx) o.classList.add('rc');
      if(i===chosenIdx&&isOk) o.classList.add('sc');
      if(i===chosenIdx&&!isOk) o.classList.add('sw');
    });
    var fb=document.getElementById('fb'+probIdx);
    fb.innerHTML='<strong>'+(isOk?t('fb-correct'):t('fb-wrong'))+'</strong> '+prob.explanation;
    fb.className='mcfb show '+(isOk?'fbok':'fbbad');
    document.getElementById('pc'+probIdx).classList.add(isOk?'ok':'bad');
    if(isOk) correctCount++; answeredCount++;
    document.getElementById('progFill').style.width=(answeredCount/problems.length*100)+'%';
    saveSession(); if(answeredCount===problems.length) setTimeout(showResults,700); return;
  }
  prob.pendingChoice=chosenIdx;
  opts.forEach(function(o){ o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}
function confirmMC(probIdx,chosenIdx){
  var prob=problems[probIdx]; if(prob.studentChoice!==null) return;
  var opts=document.querySelectorAll('#pc'+probIdx+' .mcopt');
  prob.studentChoice=chosenIdx; prob.pendingChoice=null;
  var isOk=(chosenIdx===prob.correctIdx);
  opts.forEach(function(o){ o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o,i){
    if(i===prob.correctIdx) o.classList.add('rc');
    if(i===chosenIdx&&isOk) o.classList.add('sc');
    if(i===chosenIdx&&!isOk) o.classList.add('sw');
  });
  var fb=document.getElementById('fb'+probIdx);
  fb.innerHTML='<strong>'+(isOk?t('fb-correct'):t('fb-wrong'))+'</strong> '+prob.explanation;
  fb.className='mcfb show '+(isOk?'fbok':'fbbad');
  document.getElementById('pc'+probIdx).classList.add(isOk?'ok':'bad');
  if(isOk) correctCount++; answeredCount++;
  document.getElementById('progFill').style.width=(answeredCount/problems.length*100)+'%';
  saveSession(); if(answeredCount===problems.length) setTimeout(showResults,700);
}

/* ── FRACTION HELPER ── */
function frac(n,d){ return '<span class="mf-outer"><span class="mf-num">'+n+'</span><span class="mf-den">'+d+'</span></span>'; }
function gcd(a,b){ a=Math.abs(a); b=Math.abs(b); while(b){ var t=b; b=a%b; a=t; } return a; }
function lcm(a,b){ return Math.abs(a*b)/gcd(a,b); }
function simplify(n,d){ var g=gcd(n,d); return [n/g,d/g]; }
/* mixed number display: whole + fraction */
function mixed(w,n,d){
  if(n===0) return '<strong>'+w+'</strong>';
  return '<strong>'+w+'</strong>&thinsp;'+frac(n,d);
}

/* ════════════════════════════════════════════════════════════════════════
   BUILD LESSON
   ════════════════════════════════════════════════════════════════════════ */
function buildLesson(rng){
  var lb=document.getElementById('lessonBody');
  lb.innerHTML=''; problems=[];

  /* ══ SECTION 1: Comparar con mismo denominador ══ */
  var s1=document.createElement('div'); s1.className='section';
  s1.innerHTML= LANG==='es' ? `
    <div class="stag">Sección 1 · Concepto</div>
    <h2>Comparar fracciones con el mismo denominador</h2>
    <p>Cuando dos fracciones tienen el <strong>mismo denominador</strong>, basta comparar los numeradores: la fracción con el numerador mayor es la mayor.</p>
    <div class="callout"><strong>Regla:</strong> Si d es igual, entonces ${frac('a','d')} &lt; ${frac('b','d')} cuando a &lt; b.</div>

/* ── Stepper (Section 2) ── */
var s2current = 0;
var s2stepsData = [];

function s2Step(dir) {
  s2current = Math.max(0, Math.min(s2stepsData.length - 1, s2current + dir));
  var step = s2stepsData[s2current];
  if (!step) return;
  var lbl = document.getElementById('s2steplabel');
  var cnt = document.getElementById('s2stepcontent');
  var pgr = document.getElementById('s2steppager');
  var prv = document.getElementById('s2prevbtn');
  var nxt = document.getElementById('s2nextbtn');
  if (lbl) lbl.textContent = step.label;
  if (cnt) cnt.innerHTML = step.html;
  if (pgr) pgr.textContent = (s2current + 1) + ' / ' + s2stepsData.length;
  if (prv) prv.style.visibility = s2current === 0 ? 'hidden' : 'visible';
  if (nxt) {
    if (s2current === s2stepsData.length - 1) {
      nxt.textContent = LANG === 'es' ? '✓ Listo' : '✓ Done';
      nxt.style.background = 'var(--ok)';
      nxt.disabled = true;
    } else {
      nxt.textContent = LANG === 'es' ? 'Siguiente paso →' : 'Next step →';
      nxt.style.background = 'var(--green)';
      nxt.disabled = false;
    }
  }
}

/* ── Section 3 drag-to-order ── */
var s3CorrectStr = '';
var s3DragItem = null;
var s3TouchItem = null;
var s3TouchClone = null;

function s3DragStart(e) { s3DragItem = e.currentTarget; e.dataTransfer.effectAllowed = 'move'; }

function s3Drop(e) {
  e.preventDefault();
  if (!s3DragItem) return;
  /* detect which zone received the drop */
  var target = e.currentTarget;
  var isDropZone = target.id === 's3-drop-area';
  var ph = document.getElementById('s3-placeholder');
  if (isDropZone) {
    if (ph) ph.style.display = 'none';
    target.appendChild(s3DragItem);
  } else {
    /* returning to the chips tray */
    target.appendChild(s3DragItem);
    /* show placeholder again if drop area is now empty */
    var dropArea = document.getElementById('s3-drop-area');
    if (dropArea && !dropArea.querySelector('[data-frac]') && ph) ph.style.display = '';
  }
  s3DragItem = null;
}

var symPending = {};   /* tracks pending selection per row: { rowIdx: btn } */

function symSelect(btn, chosen, correct, idx) {
  var btnGroup = btn.parentElement;
  /* if already answered, ignore */
  if (btn.disabled) return;
  /* if this exact button is already selected (pending), confirm it now */
  if (symPending[idx] === btn) {
    symConfirm(btn, chosen, correct, idx);
    return;
  }
  /* clear any previous selection in this row */
  btnGroup.querySelectorAll('button').forEach(function(b) {
    b.style.background = 'var(--surface)';
    b.style.borderColor = 'var(--border)';
    b.style.color = 'var(--text)';
    b.style.fontWeight = '700';
  });
  /* highlight selected button in gold */
  btn.style.background = 'var(--gold-bg)';
  btn.style.borderColor = 'var(--gold)';
  btn.style.color = 'var(--gold)';
  btn.style.fontWeight = '800';
  symPending[idx] = btn;
  /* auto-confirm after 800ms */
  clearTimeout(btn._symTimer);
  btn._symTimer = setTimeout(function() {
    if (symPending[idx] === btn) symConfirm(btn, chosen, correct, idx);
  }, 800);
}

function symConfirm(btn, chosen, correct, idx) {
  symPending[idx] = null;
  var btnGroup = btn.parentElement;
  /* use textContent for comparison — always gives the plain decoded character */
  var isCorrect = (chosen === correct);
  btnGroup.querySelectorAll('button').forEach(function(b) {
    b.disabled = true;
    b.style.opacity = '.45';
    b.style.fontWeight = '700';
    if (isCorrect && b.textContent === correct) {
      /* correct answer: show green */
      b.style.background = '#c8f0d8';
      b.style.borderColor = 'var(--ok)';
      b.style.color = '#1a5c38';
      b.style.opacity = '1';
    }
    if (!isCorrect && b.textContent === chosen) {
      /* wrong answer: show only the chosen button in red, no green reveal */
      b.style.background = '#fad4cc';
      b.style.borderColor = 'var(--bad)';
      b.style.color = '#7a1a00';
      b.style.opacity = '1';
    }
  });
  var spanEl = document.getElementById('sym-fb-' + idx);
  if (spanEl) {
    spanEl.innerHTML = chosen === correct
      ? '<span style="color:var(--ok)">✓</span>'
      : '<span style="color:var(--bad)">✗ → ' + correct + '</span>';
  }
}

function s3TouchStart(e) {
  s3TouchItem = e.currentTarget;
  var r = s3TouchItem.getBoundingClientRect();
  s3TouchClone = s3TouchItem.cloneNode(true);
  s3TouchClone.style.cssText = 'position:fixed;opacity:.75;pointer-events:none;z-index:9999;width:'+r.width+'px;top:'+r.top+'px;left:'+r.left+'px';
  document.body.appendChild(s3TouchClone);
}
function s3TouchMove(e) {
  e.preventDefault();
  if (!s3TouchClone) return;
  var t = e.touches[0];
  s3TouchClone.style.top = (t.clientY - 20) + 'px';
  s3TouchClone.style.left = (t.clientX - 30) + 'px';
}
function s3TouchEnd(e) {
  if (s3TouchClone) { document.body.removeChild(s3TouchClone); s3TouchClone = null; }
  if (!s3TouchItem) return;
  var t = e.changedTouches[0];
  var dropArea = document.getElementById('s3-drop-area');
  var chipsArea = document.getElementById('s3-chips');
  var ph = document.getElementById('s3-placeholder');
  function inBounds(el) {
    var r = el.getBoundingClientRect();
    return t.clientX >= r.left && t.clientX <= r.right && t.clientY >= r.top && t.clientY <= r.bottom;
  }
  if (dropArea && inBounds(dropArea)) {
    if (ph) ph.style.display = 'none';
    dropArea.appendChild(s3TouchItem);
  } else if (chipsArea && inBounds(chipsArea)) {
    chipsArea.appendChild(s3TouchItem);
    if (dropArea && !dropArea.querySelector('[data-frac]') && ph) ph.style.display = '';
  }
  /* if dropped outside both zones, leave chip where it is (no move) */
  s3TouchItem = null;
}

function s3CheckOrder() {
  var drop = document.getElementById('s3-drop-area');
  var fb = document.getElementById('s3-feedback');
  if (!drop || !fb) return;
  var chips = drop.querySelectorAll('[data-frac]');
  if (chips.length < 3) {
    fb.innerHTML = '<span style="color:var(--bad)">' + (LANG==='es'?'Arrastra todas las fracciones al área.':'Drag all fractions to the area.') + '</span>';
    return;
  }
  var placed = Array.from(chips).map(function(c){ return c.dataset.frac; }).join(',');
  var isOk = (placed === s3CorrectStr);
  fb.innerHTML = isOk
    ? '<span style="color:var(--ok)">✓ ' + (LANG==='es'?'¡Correcto! Orden perfecto.':'Correct! Perfect order.') + '</span>'
    : '<span style="color:var(--bad)">✗ ' + (LANG==='es'?'No es el orden correcto. Inténtalo de nuevo.':'Not quite right. Try again.') + '</span>';
  if (isOk) document.getElementById('s3-check-btn').style.background = 'var(--ok)';
}

var actCorrectOrder = '';
var actDispFracs = [];
var actDragEl = null;

function actDragStart(e) { actDragEl = e.currentTarget; e.dataTransfer.effectAllowed = 'move'; }

function actDrop(e) {

function actResetOrder() {
  var zone = document.getElementById('act-drop-zone');
  var chips2 = document.getElementById('act-chips');

  zone.querySelectorAll('[data-frac]').forEach(function(c){ chips2.appendChild(c); });
  if (ph) ph.style.display = '';
  if (result) result.innerHTML = '';

    // ── SAVE / SHARE — iOS-safe download (LIAXA iOS PDF fix, Rule 12) ─────────
  //   iOS Safari ignores the <a download> attribute, so a plain download fails
  //   silently on iPhone/iPad. iOS -> native share sheet (-> "Save to Files"),
  //   with an inline-open fallback; everything else -> <a download> click.
  //   Runs synchronously off the tap so iOS accepts navigator.share().
  var _fname   = SCHOOL.filePrefix + '_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf';
  var _pdfBlob = doc.output('blob');

  function _restorePdfBtn(){ btn.innerHTML = '\u2b07 &nbsp;' + t('btn-pdf'); btn.disabled = false; }
  function _openPdfInline(b){
    var u = URL.createObjectURL(b);
    var w = window.open(u, '_blank');
    if (!w) { window.location.href = u; }
    setTimeout(function(){ URL.revokeObjectURL(u); }, 60000);
  }

  var _isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
               (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  if (_isIOS) {
    var _pdfFile = new File([_pdfBlob], _fname, { type:'application/pdf' });
    if (navigator.canShare && navigator.canShare({ files:[_pdfFile] })) {
      navigator.share({ files:[_pdfFile], title:_fname })
        .then(_restorePdfBtn)
        .catch(function(e){
          if (e && e.name === 'AbortError') { _restorePdfBtn(); return; }
          _openPdfInline(_pdfBlob); _restorePdfBtn();
        });
      return;
    }
    _openPdfInline(_pdfBlob); _restorePdfBtn();
    return;
  }

  var _dlUrl = URL.createObjectURL(_pdfBlob);
  var _dlA   = document.createElement('a');
  _dlA.href  = _dlUrl; _dlA.download = _fname;
  document.body.appendChild(_dlA); _dlA.click();
  setTimeout(function(){ document.body.removeChild(_dlA); URL.revokeObjectURL(_dlUrl); }, 200);
  _restorePdfBtn();
}


/* ════════════════════════════════════════════════════════════════════════
   GLOBAL STATE FOR INTERACTIVE ELEMENTS
   (must be global so onclick attributes in injected HTML can reach them)
   ════════════════════════════════════════════════════════════════════════ */

/* ── Stepper (Section 2) ── */
var s2current = 0;
var s2stepsData = [];

function s2Step(dir) {
  s2current = Math.max(0, Math.min(s2stepsData.length - 1, s2current + dir));
  var step = s2stepsData[s2current];
  if (!step) return;
  var lbl = document.getElementById('s2steplabel');
  var cnt = document.getElementById('s2stepcontent');
  var pgr = document.getElementById('s2steppager');
  var prv = document.getElementById('s2prevbtn');
  var nxt = document.getElementById('s2nextbtn');
  if (lbl) lbl.textContent = step.label;
  if (cnt) cnt.innerHTML = step.html;
  if (pgr) pgr.textContent = (s2current + 1) + ' / ' + s2stepsData.length;
  if (prv) prv.style.visibility = s2current === 0 ? 'hidden' : 'visible';
  if (nxt) {
    if (s2current === s2stepsData.length - 1) {
      nxt.textContent = LANG === 'es' ? '✓ Listo' : '✓ Done';
      nxt.style.background = 'var(--ok)';
      nxt.disabled = true;
    } else {
      nxt.textContent = LANG === 'es' ? 'Siguiente paso →' : 'Next step →';
      nxt.style.background = 'var(--green)';
      nxt.disabled = false;
    }
  }
}

/* ── LCM Activity ── */
var actPairs = [
  {d1:2,d2:3,lc:6,  wrong:[4,9,12]},
  {d1:3,d2:4,lc:12, wrong:[7,6,24]},
  {d1:4,d2:6,lc:12, wrong:[10,8,24]},
  {d1:2,d2:5,lc:10, wrong:[7,3,15]},
  {d1:3,d2:5,lc:15, wrong:[8,10,6]},
  {d1:4,d2:5,lc:20, wrong:[9,10,8]},
  {d1:3,d2:8,lc:24, wrong:[11,12,16]},
  {d1:5,d2:6,lc:30, wrong:[11,15,12]},
  {d1:2,d2:7,lc:14, wrong:[5,9,21]},
  {d1:6,d2:9,lc:18, wrong:[15,27,12]}
];
var actScore = 0, actTotal = 5, actRound = 0, actDone = false;
var actPool = [];

function actShuffleOpts(pair) {
  var opts = [pair.lc, pair.wrong[0], pair.wrong[1], pair.wrong[2]];
  for (var i = opts.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1)), t = opts[i];
    opts[i] = opts[j]; opts[j] = t;
  }
  return opts;
}

function actRender() {
  var box = document.getElementById('act-box'); if (!box) return;
  if (actRound >= actTotal) {
    actDone = true;
    box.innerHTML =
      '<div style="text-align:center;padding:1.5rem 1rem">' +
      '<div style="font-size:2.5rem;margin-bottom:.5rem">' + (actScore >= 4 ? '🏆' : actScore >= 3 ? '🎯' : '💪') + '</div>' +
      '<div style="font-size:1.3rem;font-weight:700;margin-bottom:.4rem">' +
        (LANG === 'es' ? '¡Terminaste!' : 'All done!') + '</div>' +
      '<div style="color:var(--text2);margin-bottom:1rem">' +
        (LANG === 'es' ? 'Puntaje: ' + actScore + ' de ' + actTotal : 'Score: ' + actScore + ' of ' + actTotal) + '</div>' +
      '<button onclick="actReset()" style="padding:.55rem 1.4rem;background:var(--green);color:#fff;border:none;border-radius:8px;font-size:.9rem;font-weight:600;cursor:pointer">' +
        (LANG === 'es' ? 'Jugar de nuevo' : 'Play again') + '</button></div>';
    return;
  }
  var pair = actPool[actRound];
  var opts = actShuffleOpts(pair);
  var pips = '';
  for (var pi = 0; pi < actTotal; pi++)
    pips += '<span style="width:10px;height:10px;border-radius:50%;background:' + (pi < actRound ? 'var(--green)' : 'var(--border)') + ';display:inline-block;margin:0 3px"></span>';
  box.innerHTML =
    '<div style="text-align:center;margin-bottom:.3rem">' + pips + '</div>' +
    '<p style="text-align:center;font-size:.8rem;color:var(--text3);margin-bottom:.9rem">' +
      (LANG === 'es' ? 'Pregunta ' + (actRound + 1) + ' de ' + actTotal : 'Question ' + (actRound + 1) + ' of ' + actTotal) + '</p>' +
    '<p style="text-align:center;font-size:1rem;margin-bottom:.3rem">' +
      (LANG === 'es' ? '¿Cuál es el <strong>mcm</strong> de:' : 'What is the <strong>lcm</strong> of:') + '</p>' +
    '<div style="text-align:center;font-size:1.9rem;font-weight:700;margin:.5rem 0 1rem">' +
      frac('□', pair.d1) + ' <span style="font-size:1.3rem;font-weight:400;color:var(--text2)">&nbsp;' + (LANG === 'es' ? 'y' : 'and') + '&nbsp;</span> ' + frac('□', pair.d2) +
    '</div>' +
    '<div id="act-opts" style="display:grid;grid-template-columns:1fr 1fr;gap:.55rem">' +
      opts.map(function(o) {
        return '<button onclick="actPick(' + o + ',' + pair.lc + ')" style="padding:.75rem;border-radius:9px;border:1.5px solid var(--border);background:var(--surface);font-size:1.25rem;font-weight:700;cursor:pointer;transition:all .15s;color:var(--text)">' + o + '</button>';
      }).join('') +
    '</div>' +
    '<div id="act-fb" style="min-height:1.4rem;margin-top:.7rem;text-align:center;font-size:.88rem;font-weight:600"></div>';
}

function actPick(chosen, correct) {
  var btns = document.querySelectorAll('#act-opts button');
  btns.forEach(function(b) { b.style.pointerEvents = 'none'; });
  var isOk = (chosen === correct);
  if (isOk) actScore++;
  btns.forEach(function(b) {
    var v = parseInt(b.textContent);
    if (v === correct) { b.style.background = 'var(--ok-bg)'; b.style.borderColor = 'var(--ok)'; b.style.color = 'var(--ok)'; }
    if (v === chosen && !isOk) { b.style.background = 'var(--bad-bg)'; b.style.borderColor = 'var(--bad)'; b.style.color = 'var(--bad)'; }
  });
  var pair = actPool[actRound];
  document.getElementById('act-fb').innerHTML = isOk
    ? '<span style="color:var(--ok)">✓ ' + (LANG === 'es' ? '¡Correcto! mcm(' + pair.d1 + ',' + pair.d2 + ') = ' + correct : 'Correct! lcm(' + pair.d1 + ',' + pair.d2 + ') = ' + correct) + '</span>'
    : '<span style="color:var(--bad)">✗ ' + (LANG === 'es' ? 'No. mcm(' + pair.d1 + ',' + pair.d2 + ') = ' + correct : 'No. lcm(' + pair.d1 + ',' + pair.d2 + ') = ' + correct) + '</span>';
  actRound++;
  setTimeout(actRender, 1100);
}

function actReset() {
  actScore = 0; actRound = 0; actDone = false;
  for (var ai = actPool.length - 1; ai > 0; ai--) {
    var aj = Math.floor(Math.random() * (ai + 1)), at = actPool[ai];
    actPool[ai] = actPool[aj]; actPool[aj] = at;
  }
  actRender();
}

<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbykkuJ_apGq3vALIFd4mr3acu81c7K4OKxW-DZ-i52Ceyl3lOanXMdvbS9SIXPrLQBm/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'Comparación y Ordenamiento de Fracciones';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
