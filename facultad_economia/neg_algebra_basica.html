<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Basic Algebra for Business · Business Math · School of Economics, Universidad de Colima</title>
<link rel="canonical" href="https://liaxa.mx/facultad_economia/business_math/neg_algebra_basica.html">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS ── fallback only; applyBranding() re-injects from SCHOOL ── */
:root {
  --green:      #4a7c3f;
  --green-dark: #2d5a27;
  --green-bg:   #eaf0e7;
  --gold:       #c9a84c;
  --gold-bg:    #faf3e0;
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #6aaa5f;
  --green-dark: #8ecf82;
  --green-bg:   #1a281a;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--green-bg); color:var(--green-dark); border:1.5px solid var(--green); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; }
#restoreBar strong { color:var(--green-dark); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; object-fit:contain; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; min-width:0; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── LANGUAGE TOGGLE ── */
.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }
.dlist { font-family:'IBM Plex Mono',monospace; font-size:.78rem; color:var(--green-dark); background:var(--surface2); border-radius:8px; padding:.6rem .7rem; margin:.6rem 0; word-break:break-word; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); overflow-x:auto; }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── INTERACTIVE WIDGETS ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.iw-head { display:flex; align-items:baseline; gap:.6rem; margin-bottom:.3rem; flex-wrap:wrap; }
.iw-tag { font-size:.62rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; }
.iw-title { font-family:'Crimson Pro',serif; font-size:1.08rem; font-weight:700; }
.iw-sub { font-size:.8rem; color:var(--text2); margin-bottom:.85rem; }
.iw-canvas { display:block; width:100%; border-radius:8px; background:var(--surface2); }
.iw-read { margin-top:.85rem; background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 8px 8px 0; padding:.7rem .85rem; font-size:.82rem; color:var(--text2); }
.iw-read strong { color:var(--green-dark); }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (widget toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.3rem .7rem; font-size:.76rem; cursor:pointer; color:var(--text2); transition:all .14s; font-family:inherit; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--gold-bg); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }

/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos { gap: .9rem; }
  .wlogos img { height: 38px; max-width: 42%; }
  .wtitle { font-size: 1.35rem; }
  .stickybar { padding: .5rem .55rem; gap: .38rem; }
  .htitle { display: none; }
  .halexis { display: none; }
  .hsep { display: none; }
  .hlogos { gap: .3rem; }
  .hlogos img { height: 18px; max-width: 60px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 78px; overflow: hidden; text-overflow: ellipsis; }
  .lang-btn { padding: .26rem .48rem; font-size: .68rem; }
  .lbody { padding: 1.2rem .7rem 3rem; max-width: 100%; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .gcrd { padding: .9rem .75rem; }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}
</style>
</head>
<body>

<!-- ════════════════════ WELCOME ════════════════════ -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <img id="logo-left"  src="" alt="Facultad de Economía" style="display:none">
      <div class="wlogsep" id="wlogsep"></div>
      <img id="logo-right" src="" alt="Universidad de Colima" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Basic Algebra for Business</div>
    <div class="wcourse" id="wcourse-el">Business Math</div>
    <label class="flabel" for="sName" id="lbl-name-el">Full name</label>
    <input class="finput" id="sName" type="text" placeholder="Your full name" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" for="sGroup" id="lbl-group-el">Group</label>
    <input class="finput" id="sGroup" type="text" placeholder="e.g. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Start</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar" style="background:var(--green-bg); color:var(--green-dark);">
      <strong id="restoreTitle">Saved session found</strong><br>
      <span id="restoreMsg">Do you want to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.9rem">
      <svg width="160" height="52" viewBox="0 0 180 52" xmlns="http://www.w3.org/2000/svg">
        <style>
          .lbt { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.1em; fill:var(--green); font-size:28px; }
          .lbl { stroke:var(--gold); stroke-width:2.5; }
          .lba { fill:var(--gold); }
        </style>
        <polyline points="5,40 14,28 24,33 36,14" fill="none" stroke="var(--green)" stroke-width="3"/>
        <circle cx="36" cy="14" r="4.5" class="lba"/>
        <line x1="52" y1="6" x2="52" y2="46" class="lbl"/>
        <text x="64" y="38" class="lbt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- ════════════════════ LESSON ════════════════════ -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <img id="hlogo-left"  src="" alt="Facultad de Economía" style="display:none">
      <img id="hlogo-right" src="" alt="Universidad de Colima" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle" id="htitle-el">Basic Algebra for Business</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg">
        <style>
          .lht { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
          .lhl { stroke:var(--gold); stroke-width:2; }
          .lha { fill:var(--gold); }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" fill="none" stroke="var(--green)" stroke-width="2"/>
        <circle cx="22" cy="10" r="2.5" class="lha"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lhl"/>
        <text x="42" y="22" class="lht">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle">
      <button class="lang-btn"        id="btn-es" onclick="setLang('es')">ES</button>
      <button class="lang-btn active" id="btn-en" onclick="setLang('en')">EN</button>
    </div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="dlbtn" id="dlBtn" onclick="generatePDF()">Download results as PDF</button>
    </div>
  </div>
</div>

<script>
/* ════════════════════════════════════════════════════════════════════════
   SCHOOL CONFIG · edit ONLY this block to rebrand for a different school
   ════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:      '#4a7c3f',
  primaryDark:  '#2d5a27',
  primaryBg:    '#eaf0e7',
  accent:       '#c9a84c',
  accentBg:     '#faf3e0',
  pBR: 74,  pBG: 124, pBB: 63,
  pAR: 201, pAG: 168, pAB: 76,
  darkPrimary:     '#6aaa5f',
  darkPrimaryDark: '#8ecf82',
  darkPrimaryBg:   '#1a281a',

function getAttemptKey(name, group) {

}
function nextAttempt(name, group) {

  try { n = parseInt(localStorage.getItem(k) || '0', 10) || 0; } catch(e) {}
  n++;

  return n;
}
function currentAttempt(name, group) {
  var k = getAttemptKey(name, group);
  try { return parseInt(localStorage.getItem(k) || '1', 10) || 1; } catch(e) { return 1; }

function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t2 = s ^ (s >>> 16);
    t2 = Math.imul(t2, 0x21f0aaad);
    t2 ^= (t2 >>> 15);
    t2 = Math.imul(t2, 0x735a2d97);
    return ((t2 ^ (t2 >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}
/* Shuffles the four options once and keeps both language versions aligned. */
function shuffleOpts(rawEs, rawEn, rng) {
  var p = shuffle([0, 1, 2, 3], rng);
  return {
    es: p.map(function(j) { return rawEs[j]; }),
    en: p.map(function(j) { return rawEn[j]; }),
    correctIdx: p.indexOf(0)
  };
}

function nf(x) {
  var neg = x < 0, v = Math.abs(x);
  var s = (Math.round(v * 10) / 10).toString().split('.');
  s[0] = s[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return (neg ? '−' : '') + s.join('.');
}
function nfD(x, d) {
  var neg = x < 0, v = Math.abs(x);
  var s = v.toFixed(d).split('.');
  s[0] = s[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return (neg ? '−' : '') + s.join('.');
}
function money(v)  { return '$' + nf(Math.round(v)); }
function money2(v) { return '$' + nfD(v, 2); }
function dec1(x)   { return x.toFixed(1); }
function dec2(x)   { return x.toFixed(2); }
function dec3(x)   { return x.toFixed(3); }
/* Percentage with one decimal, identical in both languages. */
function pct1(x)   { return (Math.round(x * 1000) / 10).toFixed(1); }
/* Percentage with two decimals, used for option values. */
function pct2(x)   { return (x * 100).toFixed(2) + '%'; }
function intN(x)   { return nf(Math.round(x)); }

/* ── THE LINEAR MODEL OF A BUSINESS ───────────────────────────────────────
   Every figure in this guide rests on three symbols: the block of cost that
   does not move with volume, the cost each extra unit drags along, and the
   price each unit is sold at. Everything else is algebra performed on them. */
function totalCost(F, v, q)   { return F + v * q; }
function revenue(p, q)        { return p * q; }
function profit(F, v, p, q)   { return (p - v) * q - F; }
function unitMargin(p, v)     { return p - v; }
/* Units needed to cover the fixed block. Units are whole, so the figure that
   a business can act on is the next whole unit above the exact solution. */
function breakEvenUnits(F, p, v) { return Math.ceil(F / (p - v)); }
function unitsForProfit(F, p, v, U) { return Math.ceil((F + U) / (p - v)); }
/* Price that delivers a target profit at a chosen volume. */
function priceForProfit(F, v, q, U) { return (U + F) / q + v; }
/* A rate applied over cost and the same rate applied over price are two
   different animals, and the gap between them is where margins get lost. */
function priceFromMarkup(c, m) { return c * (1 + m); }
function priceFromMargin(c, g) { return c / (1 - g); }
function markupToMargin(m)     { return m / (1 + m); }
function marginToMarkup(g)     { return g / (1 - g); }
/* Volume at which two cost structures charge the same amount. */
function indifferenceUnits(F1, v1, F2, v2) { return (F1 - F2) / (v2 - v1); }

/* ════════════════════════════════════════════════════════════════════════
   OPTION BUILDERS · the key is always the first value handed in
   ════════════════════════════════════════════════════════════════════════ */
/* Four distinct numbers rendered by fmt, aligned across languages. */
function valOpts(correct, wrongs, fmt, rng) {
  var seen = {}, vals = [];
  function add(v) {
    if (typeof v !== 'number' || !isFinite(v)) return;
    var s = fmt(v);
    if (seen[s]) return;
    seen[s] = 1; vals.push(s);
  }
  add(correct);
  for (var i = 0; i < wrongs.length && vals.length < 4; i++) add(wrongs[i]);
  for (var j = 1; vals.length < 4 && j < 900; j++) {
    add(correct * (1 + j * 0.12 * (j % 2 ? 1 : -1)));
  }
  for (var k = 1; vals.length < 4 && k < 900; k++) add(correct + k * 0.37);
  return shuffleOpts(vals, vals, rng);
}
function intOpts(correct, wrongs, rng) {
  var seen = {}, vals = [];
  function add(v) {
    if (typeof v !== 'number' || !isFinite(v) || v < 1) return;
    var s = intN(v);
    if (seen[s]) return;
    seen[s] = 1; vals.push(s);
  }
  add(correct);
  for (var i = 0; i < wrongs.length && vals.length < 4; i++) add(wrongs[i]);
  for (var j = 1; vals.length < 4 && j < 900; j++) add(Math.round(correct * (1 + j * 0.13 * (j % 2 ? 1 : -1))));
  return shuffleOpts(vals, vals, rng);
}

   CANVAS / TABS / PHOTO / HINT / RESULTS

function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#2d5a27';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e) { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e) { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(p[0], p[1]); ctx.stroke(); lx = p[0]; ly = p[1]; }
  function onUp() { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ════════════════════════════════════════════════════════════════════════
   ANSWER HANDLER · two taps to confirm
   ════════════════════════════════════════════════════════════════════════ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = '<strong>' + (isOk ? t('fb-correct') : t('fb-wrong')) + '</strong> ' + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (!prob || prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = '<strong>' + (isOk ? t('fb-correct') : t('fb-wrong')) + '</strong> ' + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

function buildOneCard(prob, i) {
  var opts = prob.options.map(function(opt, oi) {
    return '<div class="mcopt" onclick="handleMC(' + i + ',' + oi + ')">' + opt + '</div>';
  }).join('');
  var work = '';

    work =
      '<div style="margin-bottom:.85rem">' +
        '<div class="wtabs">' +

/* ════════════════════════════════════════════════════════════════════════
   CANVAS PRIMITIVES FOR THE WIDGETS
   ════════════════════════════════════════════════════════════════════════ */
function fitCanvas(cv, h) {
  var dpr = window.devicePixelRatio || 1;
  var w = Math.max(240, cv.clientWidth || cv.parentNode.clientWidth || 300);
  cv.style.height = h + 'px';
  cv.width  = Math.round(w * dpr);
  cv.height = Math.round(h * dpr);
  var ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  return { ctx: ctx, w: w, h: h };
}
function palette() {
  return {
    green: cssv('--green'), dark: cssv('--green-dark'), tint: cssv('--green-bg'),
    gold: cssv('--gold'), bad: cssv('--bad'), border: cssv('--border'),
    text: cssv('--text'), text2: cssv('--text2'), text3: cssv('--text3')
  };
}
function kindColor(P, kind) {
  if (kind === 'gold') return P.gold;
  if (kind === 'bad')  return P.bad;
  if (kind === 'tint') return P.tint;
  return P.dark;
}
/* Plots straight lines of the form value = b0 + b1 · units over a range of
   units. Business models of this course are all of that shape, so one routine
   serves the cost line, the revenue line, the profit line and a rival plan.
   opts.cross marks the units where two of the lines meet, which is the whole
   point of a break even figure and of an indifference figure alike. */
function drawLinesChart(g, xMax, series, opts) {
  var ctx = g.ctx, P = palette(), W = g.w, H = g.h, i;
  var padL = 52, padR = 12, padT = 18, padB = 28;
  opts = opts || {};
  var fmtY = opts.fmtY || function(v) { return intN(v); };
  var fmtX = opts.fmtX || function(v) { return intN(v); };
  var yLo = 0, yHi = 0;
  series.forEach(function(s) {
    yLo = Math.min(yLo, s.b0, s.b0 + s.b1 * xMax);
    yHi = Math.max(yHi, s.b0, s.b0 + s.b1 * xMax);
  });
  if (yHi - yLo < 1) yHi = yLo + 1;
  var pad = (yHi - yLo) * 0.10;
  yLo -= pad; yHi += pad;
  function X(v) { return padL + v / xMax * (W - padL - padR); }
  function Y(v) { return H - padB - (v - yLo) / (yHi - yLo) * (H - padT - padB); }

  /* horizontal guides and the value axis */
  ctx.strokeStyle = P.border; ctx.lineWidth = 1;
  ctx.fillStyle = P.text3; ctx.font = '9px "IBM Plex Mono", monospace';
  for (i = 0; i <= 3; i++) {
    var gv = yLo + (yHi - yLo) * i / 3;
    ctx.beginPath(); ctx.moveTo(padL, Y(gv)); ctx.lineTo(W - padR, Y(gv)); ctx.stroke();
    var gl = fmtY(gv);
    ctx.fillText(gl, Math.max(1, padL - 4 - ctx.measureText(gl).width), Y(gv) + 3);
  }
  /* the zero line matters when a profit line is on screen */
  if (yLo < 0 && yHi > 0) {
    ctx.save();
    ctx.strokeStyle = P.text3; ctx.lineWidth = 1.4; ctx.setLineDash([3, 3]);
    ctx.beginPath(); ctx.moveTo(padL, Y(0)); ctx.lineTo(W - padR, Y(0)); ctx.stroke();
    ctx.restore();
  }
  /* the lines themselves */
  series.forEach(function(s) {
    ctx.strokeStyle = kindColor(P, s.kind); ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.moveTo(X(0), Y(s.b0)); ctx.lineTo(X(xMax), Y(s.b0 + s.b1 * xMax)); ctx.stroke();
  });
  /* the crossing point, dropped onto both axes */
  if (opts.cross && opts.cross.x >= 0 && opts.cross.x <= xMax) {
    var cx = X(opts.cross.x), cy = Y(opts.cross.y);
    ctx.save();
    ctx.strokeStyle = P.gold; ctx.lineWidth = 1.5; ctx.setLineDash([4, 3]);
    ctx.beginPath(); ctx.moveTo(cx, H - padB); ctx.lineTo(cx, cy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(padL, cy); ctx.lineTo(cx, cy); ctx.stroke();
    ctx.restore();
    ctx.fillStyle = P.gold;
    ctx.beginPath(); ctx.arc(cx, cy, 4.2, 0, Math.PI * 2); ctx.fill();
    if (opts.cross.label) {
      ctx.font = '600 10px "IBM Plex Sans", sans-serif';
      var cw = ctx.measureText(opts.cross.label).width;
      ctx.fillText(opts.cross.label, Math.min(Math.max(2, cx - cw / 2), W - cw - 2), Math.max(10, cy - 9));
    }
  }
  /* the volume the student is standing on right now */
  if (typeof opts.at === 'number' && opts.at >= 0 && opts.at <= xMax) {
    ctx.save();
    ctx.strokeStyle = P.bad; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(X(opts.at), H - padB); ctx.lineTo(X(opts.at), padT - 6); ctx.stroke();
    ctx.restore();
  }
  /* axes */
  ctx.strokeStyle = P.border; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(padL, padT - 8); ctx.lineTo(padL, H - padB); ctx.lineTo(W - padR, H - padB); ctx.stroke();
  ctx.fillStyle = P.text3; ctx.font = '9px "IBM Plex Mono", monospace';
  [0, xMax / 2, xMax].forEach(function(v) {
    var lab = fmtX(v), lw = ctx.measureText(lab).width;
    ctx.fillText(lab, Math.min(Math.max(1, X(v) - lw / 2), W - lw - 1), H - padB + 13);
  });
  /* legend */
  var legX = padL + 4;
  ctx.font = '600 9.5px "IBM Plex Sans", sans-serif';
  series.forEach(function(s) {
    if (!s.label) return;
    ctx.fillStyle = kindColor(P, s.kind);
    ctx.fillRect(legX, 9, 9, 3);
    ctx.fillText(s.label, legX + 12, 13);
    legX += 12 + ctx.measureText(s.label).width + 12;
  });
  if (opts.xLabel) {
    ctx.fillStyle = P.text3; ctx.font = '9px "IBM Plex Sans", sans-serif';
    var xl = opts.xLabel;
    ctx.fillText(xl, W - padR - ctx.measureText(xl).width, H - 3);
  }
}
/* Draws horizontal bars split into stacked pieces. Used to put a cost block
   and a margin block side by side, so a rate applied over cost and the same
   rate applied over price can be compared as lengths instead of as words. */
function drawStackBars(g, rows, opts) {
  var ctx = g.ctx, P = palette(), W = g.w, H = g.h;
  opts = opts || {};
  var fmt = opts.fmt || function(v) { return intN(v); };
  var padL = 10, padR = 10, padT = 8;
  var maxTotal = 0;
  rows.forEach(function(r) {
    var s = 0;
    r.parts.forEach(function(p) { s += p.v; });
    maxTotal = Math.max(maxTotal, s);
  });
  if (maxTotal <= 0) maxTotal = 1;
  var rowH = (H - padT) / rows.length;
  var barH = Math.min(30, rowH * 0.42);
  rows.forEach(function(r, ri) {
    var top = padT + ri * rowH;
    ctx.fillStyle = P.text2; ctx.font = '600 10px "IBM Plex Sans", sans-serif';
    ctx.fillText(r.label, padL, top + 11);
    var x = padL, yBar = top + 17;
    r.parts.forEach(function(p) {
      var wpx = p.v / maxTotal * (W - padL - padR);
      ctx.fillStyle = kindColor(P, p.kind);
      ctx.globalAlpha = p.kind === 'tint' ? 1 : 0.85;
      ctx.fillRect(x, yBar, Math.max(1, wpx), barH);
      ctx.globalAlpha = 1;
      if (p.tag && wpx > 46) {
        ctx.fillStyle = p.kind === 'tint' ? P.dark : '#ffffff';
        ctx.font = '600 9px "IBM Plex Mono", monospace';
        ctx.fillText(p.tag, x + 5, yBar + barH / 2 + 3);
      }
      x += wpx;
    });
    ctx.strokeStyle = P.border; ctx.lineWidth = 1;
    ctx.strokeRect(padL, yBar, x - padL, barH);
    ctx.fillStyle = P.text; ctx.font = '600 10px "IBM Plex Mono", monospace';
    var tot = fmt(r.total);
    ctx.fillText(tot, Math.min(x + 5, W - padR - ctx.measureText(tot).width), yBar + barH / 2 + 4);
    if (r.note) {
      ctx.fillStyle = P.text3; ctx.font = '9px "IBM Plex Sans", sans-serif';
      ctx.fillText(r.note, padL, yBar + barH + 12);
    }
  });
}

/* ════════════════════════════════════════════════════════════════════════
   WIDGET 1 · the three symbols that describe a whole operation
   ════════════════════════════════════════════════════════════════════════ */
function widgetLinearModel(F0, v0, p0, q0) {
  var host = document.createElement('div');
  host.className = 'section';
  document.getElementById('lessonBody').appendChild(host);
  var state = { view: 'both', F: F0, v: v0, p: p0, q: q0 };
  function mount() {
    var es = LANG === 'es';
    var MODES = [
      { id: 'both',   es: 'Ingreso y costo',  en: 'Revenue and cost' },
      { id: 'profit', es: 'Utilidad',         en: 'Profit' }
    ];
    var tabs = MODES.map(function(m) {
      return '<button class="mtab' + (m.id === state.view ? ' active' : '') + '" data-m="' + m.id + '">' + m[LANG] + '</button>';
    }).join('');
    host.innerHTML =
      '<div class="gcrd" data-widget="modelo-lineal-de-costo-e-ingreso">' +
        '<div class="iw-head"><span class="iw-tag">' + (es ? 'Herramienta' : 'Tool') + '</span>' +
        '<span class="iw-title">' + (es ? 'Un taller descrito con tres letras' : 'A workshop described with three letters') + '</span></div>' +
        '<div class="iw-sub">' + (es
          ? 'Un taller renta un local, paga nómina y compra materiales. Mueve las tres piezas del modelo y observa cómo se acomodan las dos rectas. La de costo arranca arriba de cero porque la renta se paga aunque no se produzca nada, y la de ingreso arranca en cero porque sin ventas no entra dinero. Cambia a la vista de utilidad y verás la misma información resumida en una sola recta: su pendiente es el margen que deja cada unidad y el punto donde cruza el cero es la cantidad que hay que vender para dejar de perder.'
          : 'A workshop rents a place, meets a payroll and buys materials. Move the three pieces of the model and watch the two lines settle. The cost line starts above zero because the rent is paid even when nothing is produced, and the revenue line starts at zero because no sales means no money coming in. Switch to the profit view and the same information appears as a single line: its slope is the margin each unit leaves and the point where it crosses zero is the quantity that has to be sold to stop losing money.') + '</div>' +
        '<div class="mtabs">' + tabs + '</div>' +
        '<div class="cgrid"><div class="cg">' +
          '<label>' + (es ? 'Costo fijo mensual en pesos' : 'Monthly fixed cost in pesos') + ': <span class="cval" id="m1Fl"></span></label>' +
          '<input type="range" min="5000" max="60000" step="2500" id="m1F" value="' + state.F + '">' +
        '</div><div class="cg">' +
          '<label>' + (es ? 'Costo variable por unidad' : 'Variable cost per unit') + ': <span class="cval" id="m1vl"></span></label>' +
          '<input type="range" min="40" max="220" step="5" id="m1v" value="' + state.v + '">' +
        '</div></div>' +
        '<div class="cgrid"><div class="cg">' +
          '<label>' + (es ? 'Precio de venta por unidad' : 'Selling price per unit') + ': <span class="cval" id="m1pl"></span></label>' +
          '<input type="range" min="60" max="420" step="5" id="m1p" value="' + state.p + '">' +
        '</div><div class="cg">' +
          '<label>' + (es ? 'Unidades vendidas en el mes' : 'Units sold in the month') + ': <span class="cval" id="m1ql"></span></label>' +
          '<input type="range" min="0" max="600" step="10" id="m1q" value="' + state.q + '">' +
        '</div></div>' +
        '<canvas class="iw-canvas" id="m1cv"></canvas>' +
        '<div class="metrics">' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Margen por unidad' : 'Margin per unit') + '</div><div class="mnum cs" id="m1cm"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Ingreso del mes' : 'Revenue of the month') + '</div><div class="mnum ps" id="m1r"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Costo total del mes' : 'Total cost of the month') + '</div><div class="mnum ts" id="m1c"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Utilidad del mes' : 'Profit of the month') + '</div><div class="mnum cs" id="m1u"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Unidades de equilibrio' : 'Break even units') + '</div><div class="mnum ps" id="m1be"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Expresión del costo' : 'Cost expression') + '</div><div class="mnum ts" id="m1ex"></div></div>' +
        '</div>' +
        '<div class="iw-read" id="m1read"></div>' +
      '</div>';
    host.querySelectorAll('.mtab').forEach(function(b) {
      b.addEventListener('click', function() {
        state.view = b.getAttribute('data-m');
        host.querySelectorAll('.mtab').forEach(function(x) { x.classList.remove('active'); });
        b.classList.add('active');
        update();
      });
    });
    host.querySelector('#m1F').addEventListener('input', function() { state.F = parseInt(this.value, 10); update(); });
    host.querySelector('#m1v').addEventListener('input', function() { state.v = parseInt(this.value, 10); update(); });
    host.querySelector('#m1p').addEventListener('input', function() { state.p = parseInt(this.value, 10); update(); });
    host.querySelector('#m1q').addEventListener('input', function() { state.q = parseInt(this.value, 10); update(); });
    update();
  }
  function update() {
    var es = LANG === 'es';
    var F = state.F, v = state.v, p = state.p, q = state.q;
    var cm = unitMargin(p, v);
    var R  = revenue(p, q);
    var C  = totalCost(F, v, q);
    var U  = R - C;
    var viable = cm > 0;
    var be = viable ? breakEvenUnits(F, p, v) : null;
    var xMax = 600;
    host.querySelector('#m1Fl').textContent = money(F);
    host.querySelector('#m1vl').textContent = money(v);
    host.querySelector('#m1pl').textContent = money(p);
    host.querySelector('#m1ql').textContent = intN(q);
    host.querySelector('#m1cm').textContent = money(cm);
    host.querySelector('#m1r').textContent  = money(R);
    host.querySelector('#m1c').textContent  = money(C);
    host.querySelector('#m1u').textContent  = money(U);
    host.querySelector('#m1be').textContent = viable ? intN(be) : (es ? 'No existe' : 'None');
    host.querySelector('#m1ex').textContent = money(F) + ' + ' + money(v) + 'q';
    var g = fitCanvas(host.querySelector('#m1cv'), 180);
    if (state.view === 'both') {
      drawLinesChart(g, xMax, [
        { b0: F, b1: v, kind: 'green', label: (es ? 'Costo total' : 'Total cost') },
        { b0: 0, b1: p, kind: 'gold',  label: (es ? 'Ingreso' : 'Revenue') }
      ], {
        at: q, fmtY: function(val) { return money(val); },
        cross: viable ? { x: F / cm, y: p * (F / cm), label: (es ? 'Equilibrio' : 'Break even') } : null,
        xLabel: (es ? 'unidades' : 'units')
      });
    } else {
      drawLinesChart(g, xMax, [
        { b0: -F, b1: cm, kind: 'green', label: (es ? 'Utilidad' : 'Profit') }
      ], {
        at: q, fmtY: function(val) { return money(val); },
        cross: viable ? { x: F / cm, y: 0, label: (es ? 'Utilidad cero' : 'Zero profit') } : null,
        xLabel: (es ? 'unidades' : 'units')
      });
    }
    host.querySelector('#m1read').innerHTML = es
      ? '<strong>Lectura de negocio:</strong> con una renta de ' + money(F) + ' al mes, ' + money(v) + ' de material por unidad y un precio de ' + money(p) + ', cada unidad vendida deja ' + money(cm) + ' libres para pagar la renta. ' +
        (viable
          ? 'Esa es la razón por la que el equilibrio está en ' + intN(be) + ' unidades: es el número de veces que hay que juntar ' + money(cm) + ' hasta cubrir ' + money(F) + '. Al nivel actual de ' + intN(q) + ' unidades, el ingreso es ' + money(R) + ', el costo total ' + money(C) + ' y la utilidad ' + money(U) + '. '
          : 'Con el precio por debajo del costo variable el margen es negativo, así que vender más aumenta la pérdida y no existe un punto de equilibrio: primero hay que corregir el precio o el costo unitario. ') +
        'Fíjate en un detalle que se le escapa a mucha gente: subir el precio mueve la pendiente de la recta de ingreso, mientras que subir la renta solo levanta la recta de costo sin inclinarla. Son dos palancas distintas y no se sustituyen entre sí.'
      : '<strong>Business reading:</strong> with a rent of ' + money(F) + ' a month, ' + money(v) + ' of materials per unit and a price of ' + money(p) + ', every unit sold leaves ' + money(cm) + ' free to pay the rent. ' +
        (viable
          ? 'That is why break even sits at ' + intN(be) + ' units: it is the number of times ' + money(cm) + ' has to be collected to cover ' + money(F) + '. At the current level of ' + intN(q) + ' units, revenue is ' + money(R) + ', total cost is ' + money(C) + ' and profit is ' + money(U) + '. '
          : 'With the price below the variable cost the margin is negative, so selling more deepens the loss and no break even point exists: the price or the unit cost has to be fixed first. ') +
        'Notice a detail many people miss: raising the price tilts the revenue line, while raising the rent only lifts the cost line without tilting it. They are two different levers and one does not stand in for the other.';
  }
  widgets.push(mount);
  mount();
}

/* ════════════════════════════════════════════════════════════════════════
   WIDGET 2 · solving an equation is balancing two sides
   ════════════════════════════════════════════════════════════════════════ */
function widgetBalance(F0, v0, p0, q0) {
  var host = document.createElement('div');
  host.className = 'section';
  document.getElementById('lessonBody').appendChild(host);
  var state = { F: F0, v: v0, p: p0, q: q0 };
  function mount() {
    var es = LANG === 'es';
    host.innerHTML =
      '<div class="gcrd" data-widget="balanza-del-punto-de-equilibrio">' +
        '<div class="iw-head"><span class="iw-tag">' + (es ? 'Herramienta' : 'Tool') + '</span>' +
        '<span class="iw-title">' + (es ? 'Buscar a mano lo que el álgebra encuentra de un golpe' : 'Hunting by hand for what algebra finds in one move') + '</span></div>' +
        '<div class="iw-sub">' + (es
          ? 'Una cafetería quiere saber cuántas tazas debe vender al mes para dejar de perder. La barra dorada es lo que entra y la barra verde es lo que sale, dividida en el bloque fijo que no se mueve y el bloque variable que crece con cada taza. Mueve las tazas hasta emparejar las dos barras: eso es resolver la ecuación por tanteo. Después mira los pasos algebraicos de abajo, que llegan al mismo número sin probar valores, y compara cuánto trabajo te ahorra despejar.'
          : 'A coffee shop wants to know how many cups it has to sell in a month to stop losing money. The gold bar is what comes in and the green bar is what goes out, split into the fixed block that does not move and the variable block that grows with every cup. Move the cups until the two bars match: that is solving the equation by trial. Then look at the algebraic steps below, which reach the same figure without trying values, and compare how much work isolating the unknown saves you.') + '</div>' +
        '<div class="cgrid"><div class="cg">' +
          '<label>' + (es ? 'Costo fijo mensual en pesos' : 'Monthly fixed cost in pesos') + ': <span class="cval" id="b2Fl"></span></label>' +
          '<input type="range" min="10000" max="80000" step="2000" id="b2F" value="' + state.F + '">' +
        '</div><div class="cg">' +

          '<div class="metric"><div class="mlbl">' + (es ? 'Costo total' : 'Total cost') + '</div><div class="mnum ts" id="b2c"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Diferencia' : 'Gap') + '</div><div class="mnum cs" id="b2gap"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Margen por taza' : 'Margin per cup') + '</div><div class="mnum cs" id="b2cm"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Tazas de equilibrio' : 'Break even cups') + '</div><div class="mnum ps" id="b2be"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Ingreso de equilibrio' : 'Break even revenue') + '</div><div class="mnum ts" id="b2ber"></div></div>' +
        '</div>' +

    host.querySelector('#b2F').addEventListener('input', function() { state.F = parseInt(this.value, 10); update(); });
    host.querySelector('#b2v').addEventListener('input', function() { state.v = parseInt(this.value, 10); update(); });
    host.querySelector('#b2p').addEventListener('input', function() { state.p = parseInt(this.value, 10); update(); });
    host.querySelector('#b2q').addEventListener('input', function() { state.q = parseInt(this.value, 10); update(); });
    update();
  }
  function update() {
    var es = LANG === 'es';
    var F = state.F, v = state.v, p = state.p, q = state.q;
    var cm = unitMargin(p, v);
    var R = revenue(p, q), C = totalCost(F, v, q);
    var gap = R - C;
    var viable = cm > 0;
    var beExact = viable ? F / cm : null;
    var be = viable ? Math.ceil(beExact) : null;
    host.querySelector('#b2Fl').textContent = money(F);
    host.querySelector('#b2vl').textContent = money(v);
    host.querySelector('#b2pl').textContent = money(p);
    host.querySelector('#b2ql').textContent = intN(q);
    host.querySelector('#b2r').textContent  = money(R);
    host.querySelector('#b2c').textContent  = money(C);
    host.querySelector('#b2gap').textContent = money(gap);
    host.querySelector('#b2cm').textContent = money(cm);
    host.querySelector('#b2be').textContent = viable ? intN(be) : (es ? 'No existe' : 'None');
    host.querySelector('#b2ber').textContent = viable ? money(be * p) : (es ? 'No existe' : 'None');
    host.querySelector('#b2steps').textContent = viable
      ? (es ? 'Se plantea: ' : 'Set up: ') + money(p) + 'q = ' + money(F) + ' + ' + money(v) + 'q  ·  ' +
        (es ? 'se resta ' : 'subtract ') + money(v) + 'q ' + (es ? 'de los dos lados: ' : 'from both sides: ') + money(cm) + 'q = ' + money(F) + '  ·  ' +
        (es ? 'se divide entre ' : 'divide by ') + money(cm) + ': q = ' + dec1(beExact) + '  ·  ' +
        (es ? 'se redondea hacia arriba: ' : 'round up: ') + intN(be) + (es ? ' tazas' : ' cups')
      : (es ? 'Con el precio por debajo del costo variable la ecuación no tiene solución con sentido: el término en q queda negativo de los dos lados y ninguna cantidad de tazas empareja las barras.'
            : 'With the price below the variable cost the equation has no meaningful solution: the term in q stays negative on both sides and no quantity of cups makes the bars match.');
    var g = fitCanvas(host.querySelector('#b2cv'), 150);
    drawStackBars(g, [
      { label: (es ? 'Entra: precio por tazas' : 'In: price times cups'),
        parts: [{ v: R, kind: 'gold', tag: money(p) + ' x ' + intN(q) }],
        total: R,
        note: (es ? 'Una sola pieza, proporcional a las tazas' : 'A single piece, proportional to the cups') },
      { label: (es ? 'Sale: costo fijo y costo variable' : 'Out: fixed cost and variable cost'),
        parts: [{ v: F, kind: 'tint', tag: money(F) }, { v: v * q, kind: 'green', tag: money(v) + ' x ' + intN(q) }],
        total: C,
        note: (es ? 'Dos piezas: una no se mueve y la otra crece con las tazas' : 'Two pieces: one does not move and the other grows with the cups') }
    ], { fmt: function(val) { return money(val); } });
    var near = Math.abs(gap) <= Math.max(1, p);
    host.querySelector('#b2read').innerHTML = es
      ? '<strong>Lectura de negocio:</strong> con ' + intN(q) + ' tazas entran ' + money(R) + ' y salen ' + money(C) + ', así que la diferencia es ' + money(gap) + '. ' +
        (viable
          ? (near ? 'Estás prácticamente sobre el punto de equilibrio, que el álgebra sitúa en ' + intN(be) + ' tazas. '
                  : (gap > 0 ? 'Ya pasaste el punto de equilibrio de ' + intN(be) + ' tazas, y cada taza adicional agrega ' + money(cm) + ' de utilidad. '
                             : 'Todavía no llegas al punto de equilibrio de ' + intN(be) + ' tazas, y te faltan ' + intN(Math.max(0, be - q)) + ' para cubrir el bloque fijo. ')) +
            'El detalle que conviene guardar es por qué la división funciona: el bloque fijo de ' + money(F) + ' no se reparte entre las tazas por conveniencia, se reparte porque el álgebra factorizó la q de los dos términos que la contenían y dejó el margen ' + money(cm) + ' multiplicando. Redondear hacia arriba no es un adorno: con ' + intN(be) + ' tazas menos una todavía hay pérdida, porque las tazas se venden enteras.'
          : 'Mientras el precio no supere el costo variable, mover el volumen no arregla nada: la barra verde crece más rápido que la dorada y la brecha se abre en lugar de cerrarse.')
      : '<strong>Business reading:</strong> with ' + intN(q) + ' cups, ' + money(R) + ' comes in and ' + money(C) + ' goes out, so the gap is ' + money(gap) + '. ' +
        (viable
          ? (near ? 'You are practically standing on the break even point, which algebra places at ' + intN(be) + ' cups. '
                  : (gap > 0 ? 'You are already past the break even point of ' + intN(be) + ' cups, and every extra cup adds ' + money(cm) + ' of profit. '
                             : 'You have not reached the break even point of ' + intN(be) + ' cups yet, and you are ' + intN(Math.max(0, be - q)) + ' short of covering the fixed block. ')) +
            'The detail worth keeping is why the division works: the fixed block of ' + money(F) + ' is not spread over the cups out of convenience, it is spread because the algebra factored the q out of the two terms that carried it and left the margin ' + money(cm) + ' multiplying. Rounding up is not decoration: at one cup below ' + intN(be) + ' there is still a loss, because cups are sold whole.'
          : 'As long as the price does not clear the variable cost, moving the volume fixes nothing: the green bar grows faster than the gold one and the gap widens instead of closing.');
  }
  widgets.push(mount);
  mount();
}

/* ════════════════════════════════════════════════════════════════════════
   WIDGET 3 · the same percentage over two different bases
   ════════════════════════════════════════════════════════════════════════ */
function widgetMarkupMargin(c0, r0) {
  var host = document.createElement('div');
  host.className = 'section';
  document.getElementById('lessonBody').appendChild(host);
  var state = { base: 'cost', c: c0, r: r0 };
  function mount() {
    var es = LANG === 'es';
    var MODES = [
      { id: 'cost',  es: 'El porcentaje se aplica sobre el costo',  en: 'The percentage is applied over cost' },
      { id: 'price', es: 'El porcentaje se aplica sobre el precio', en: 'The percentage is applied over price' }
    ];
    var tabs = MODES.map(function(m) {
      return '<button class="mtab' + (m.id === state.base ? ' active' : '') + '" data-m="' + m.id + '">' + m[LANG] + '</button>';
    }).join('');
    host.innerHTML =
      '<div class="gcrd" data-widget="margen-sobre-costo-contra-margen-sobre-precio">' +
        '<div class="iw-head"><span class="iw-tag">' + (es ? 'Herramienta' : 'Tool') + '</span>' +
        '<span class="iw-title">' + (es ? 'Treinta por ciento no siempre vale lo mismo' : 'Thirty percent is not always worth the same') + '</span></div>' +
        '<div class="iw-sub">' + (es
          ? 'Una distribuidora compra un artículo y le quiere ganar un porcentaje. La pregunta que decide el resultado es sobre qué cifra se calcula ese porcentaje. Elige la base, mueve el costo y la tasa, y compara las dos barras: la parte gris es lo que costó y la parte dorada es la ganancia. Verás que la misma tasa produce dos precios distintos, y que la diferencia entre ambos crece rápido conforme la tasa sube. Es el error de aritmética que más margen se lleva por delante en un negocio comercial.'
          : 'A distributor buys an item and wants to make a percentage on it. The question that settles the result is which figure that percentage is computed on. Choose the base, move the cost and the rate, and compare the two bars: the grey part is what it cost and the gold part is the gain. You will see the same rate produce two different prices, and the gap between them grow fast as the rate rises. It is the arithmetic slip that eats the most margin in a trading business.') + '</div>' +
        '<div class="mtabs">' + tabs + '</div>' +
        '<div class="cgrid"><div class="cg">' +
          '<label>' + (es ? 'Costo de compra en pesos' : 'Purchase cost in pesos') + ': <span class="cval" id="k3cl"></span></label>' +
          '<input type="range" min="100" max="1500" step="20" id="k3c" value="' + state.c + '">' +
        '</div><div class="cg">' +
          '<label>' + (es ? 'Tasa deseada en por ciento' : 'Desired rate in percent') + ': <span class="cval" id="k3rl"></span></label>' +
          '<input type="range" min="5" max="65" step="1" id="k3r" value="' + state.r + '">' +
        '</div></div>' +
        '<canvas class="iw-canvas" id="k3cv"></canvas>' +
        '<div class="metrics">' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Precio pedido' : 'Price you asked for') + '</div><div class="mnum cs" id="k3pr"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Ganancia por pieza' : 'Gain per piece') + '</div><div class="mnum ps" id="k3gn"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Margen sobre precio' : 'Margin on price') + '</div><div class="mnum ts" id="k3mg"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Margen sobre costo' : 'Markup on cost') + '</div><div class="mnum ts" id="k3mk"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Precio con la otra base' : 'Price with the other base') + '</div><div class="mnum ps" id="k3ot"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Diferencia de precio' : 'Price difference') + '</div><div class="mnum cs" id="k3df"></div></div>' +
        '</div>' +
        '<div class="iw-read" id="k3read"></div>' +
      '</div>';
    host.querySelectorAll('.mtab').forEach(function(b) {
      b.addEventListener('click', function() {
        state.base = b.getAttribute('data-m');
        host.querySelectorAll('.mtab').forEach(function(x) { x.classList.remove('active'); });
        b.classList.add('active');
        update();
      });
    });
    host.querySelector('#k3c').addEventListener('input', function() { state.c = parseInt(this.value, 10); update(); });
    host.querySelector('#k3r').addEventListener('input', function() { state.r = parseInt(this.value, 10); update(); });
    update();
  }
  function update() {
    var es = LANG === 'es';
    var c = state.c, r = state.r / 100;

    var pPrice = priceFromMargin(c, r);
    var chosen = state.base === 'cost' ? pCost : pPrice;
    var other  = state.base === 'cost' ? pPrice : pCost;
    var gain   = chosen - c;
    var realMargin = gain / chosen;
    var realMarkup = gain / c;
    host.querySelector('#k3cl').textContent = money(c);
    host.querySelector('#k3rl').textContent = dec1(state.r);
    host.querySelector('#k3pr').textContent = money2(chosen);
    host.querySelector('#k3gn').textContent = money2(gain);
    host.querySelector('#k3mg').textContent = pct2(realMargin);
    host.querySelector('#k3mk').textContent = pct2(realMarkup);
    host.querySelector('#k3ot').textContent = money2(other);

        parts: [{ v: c, kind: 'tint', tag: money(c) }, { v: pCost - c, kind: 'gold', tag: dec1(state.r) + '% ' + (es ? 'del costo' : 'of cost') }],
        total: pCost,
        note: (es ? 'La parte dorada se mide contra la gris' : 'The gold part is measured against the grey one') },
      { label: (es ? 'Tasa sobre el precio: el precio es el entero' : 'Rate over price: price is the whole'),
        parts: [{ v: c, kind: 'tint', tag: money(c) }, { v: pPrice - c, kind: 'gold', tag: dec1(state.r) + '% ' + (es ? 'del precio' : 'of price') }],
        total: pPrice,
        note: (es ? 'La parte dorada se mide contra la barra completa' : 'The gold part is measured against the whole bar') }
    ], { fmt: function(val) { return money2(val); } });

      ? '<strong>Lectura de negocio:</strong> el artículo costó ' + money(c) + ' y pediste ' + dec1(state.r) + ' por ciento ' + (state.base === 'cost' ? 'sobre el costo, de modo que el precio queda en ' + money2(pCost) + '.' : 'sobre el precio, de modo que el precio queda en ' + money2(pPrice) + '.') +
        ' Con ese precio la ganancia por pieza es ' + money2(gain) + ', que representa ' + pct2(realMargin) + ' del precio y ' + pct2(realMarkup) + ' del costo. Las dos cifras describen la misma operación, solo cambia contra qué se comparan. Si en lugar de esa base hubieras usado la otra, el precio habría sido ' + money2(other) + ', una diferencia de ' + money2(Math.abs(other - chosen)) + ' por pieza. ' +
        'El álgebra detrás es corta y vale la pena verla completa: pedir la tasa sobre el costo es multiplicar, precio igual a costo por uno más la tasa; pedirla sobre el precio obliga a despejar, porque la incógnita aparece en los dos lados, y al agrupar queda precio igual a costo entre uno menos la tasa. Multiplicar en el segundo caso es el error clásico, y cuesta exactamente esos ' + money2(Math.abs(pPrice - pCost)) + ' por pieza. Multiplícalo por el volumen de un mes y verás por qué a los compradores les importa tanto la palabra que se usa en la negociación.'
      : '<strong>Business reading:</strong> the item cost ' + money(c) + ' and you asked for ' + dec1(state.r) + ' percent ' + (state.base === 'cost' ? 'over cost, so the price lands at ' + money2(pCost) + '.' : 'over price, so the price lands at ' + money2(pPrice) + '.') +
        ' At that price the gain per piece is ' + money2(gain) + ', which is ' + pct2(realMargin) + ' of the price and ' + pct2(realMarkup) + ' of the cost. Both figures describe the same deal, only the yardstick changes. Had you used the other base instead, the price would have been ' + money2(other) + ', a difference of ' + money2(Math.abs(other - chosen)) + ' per piece. ' +
        'The algebra behind it is short and worth seeing in full: asking for the rate over cost is a multiplication, price equals cost times one plus the rate; asking for it over price forces you to isolate, because the unknown shows up on both sides, and collecting terms leaves price equals cost divided by one minus the rate. Multiplying in the second case is the classic slip, and it costs exactly those ' + money2(Math.abs(pPrice - pCost)) + ' per piece. Multiply that by a month of volume and you will see why buyers care so much about the word used in the negotiation.';
  }
  widgets.push(mount);
  mount();
}

/* ════════════════════════════════════════════════════════════════════════
   WIDGET 4 · two equations, one crossing, one decision

function widgetTwoPlans(F1_0, v1_0, F2_0, v2_0) {
  var host = document.createElement('div');
  host.className = 'section';
  document.getElementById('lessonBody').appendChild(host);
  var state = { F1: F1_0, v1: v1_0, F2: F2_0, v2: v2_0 };
  function mount() {
    var es = LANG === 'es';
    host.innerHTML =
      '<div class="gcrd" data-widget="sistema-de-dos-rectas-y-punto-de-indiferencia">' +

        '<span class="iw-title">' + (es ? 'Dos proveedores y una sola cifra que los separa' : 'Two suppliers and a single figure between them') + '</span></div>' +
        '<div class="iw-sub">' + (es
          ? 'Una empresa de reparto compara dos contratos de paquetería. El primero cobra una renta mensual alta y poco por envío; el segundo casi no cobra renta pero cada envío sale caro. Cada contrato es una ecuación y las dos juntas forman un sistema. Mueve las cuatro cifras y observa el cruce: a la izquierda conviene un contrato y a la derecha el otro. Si dejas las dos tarifas por envío iguales, las rectas se vuelven paralelas y el cruce desaparece, que es exactamente lo que el álgebra avisa cuando una división queda entre cero.'
          : 'A delivery company compares two courier contracts. The first charges a high monthly fee and little per shipment; the second charges almost no fee but each shipment is expensive. Each contract is an equation and together they form a system. Move the four figures and watch the crossing: to its left one contract wins and to its right the other one does. If you set both per shipment rates equal, the lines turn parallel and the crossing disappears, which is exactly what the algebra warns about when a division ends up over zero.') + '</div>' +
        '<div class="cgrid"><div class="cg">' +
          '<label>' + (es ? 'Contrato A, renta mensual' : 'Contract A, monthly fee') + ': <span class="cval" id="s4F1l"></span></label>' +
          '<input type="range" min="0" max="12000" step="250" id="s4F1" value="' + state.F1 + '">' +

          '<input type="range" min="5" max="80" step="1" id="s4v1" value="' + state.v1 + '">' +

        '<div class="cgrid"><div class="cg">' +

          '<input type="range" min="0" max="12000" step="250" id="s4F2" value="' + state.F2 + '">' +
        '</div><div class="cg">' +
          '<label>' + (es ? 'Contrato B, costo por envío' : 'Contract B, cost per shipment') + ': <span class="cval" id="s4v2l"></span></label>' +
          '<input type="range" min="5" max="80" step="1" id="s4v2" value="' + state.v2 + '">' +
        '</div></div>' +
        '<canvas class="iw-canvas" id="s4cv"></canvas>' +
        '<div class="metrics">' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Envíos de indiferencia' : 'Indifference shipments') + '</div><div class="mnum cs" id="s4q"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Costo en ese punto' : 'Cost at that point') + '</div><div class="mnum ps" id="s4y"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Conviene por debajo' : 'Cheaper below') + '</div><div class="mnum ts" id="s4lo"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Conviene por arriba' : 'Cheaper above') + '</div><div class="mnum ts" id="s4hi"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Diferencia de rentas' : 'Fee difference') + '</div><div class="mnum ts" id="s4df"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Diferencia por envío' : 'Per shipment difference') + '</div><div class="mnum ts" id="s4dv"></div></div>' +
        '</div>' +
        '<div class="iw-read" id="s4read"></div>' +
      '</div>';
    host.querySelector('#s4F1').addEventListener('input', function() { state.F1 = parseInt(this.value, 10); update(); });

  function update() {

      { b0: F1, b1: v1, kind: 'green', label: (es ? 'Contrato A' : 'Contract A') },
      { b0: F2, b1: v2, kind: 'gold',  label: (es ? 'Contrato B' : 'Contract B') }
    ], {
      fmtY: function(val) { return money(val); },
      cross: valid && qStar <= xMax ? { x: qStar, y: yStar, label: (es ? 'Indiferencia' : 'Indifference') } : null,
      xLabel: (es ? 'envíos al mes' : 'shipments a month')

  }
  widgets.push(mount);

}

      '<p>Un negocio se describe con números que cambian: las unidades que se venden este mes no son las del mes pasado, y el costo de la materia prima se mueve con el proveedor. Cuando una cantidad puede tomar distintos valores, se le asigna una letra y se le llama <strong>variable</strong>. Cuando esa cantidad está fija durante el periodo que se analiza, se le llama constante o parámetro. Escribir un negocio con letras no es un adorno académico: es lo que permite responder preguntas sobre escenarios que todavía no ocurrieron.</p>' +

      '<h2>Despejar: del modelo a la cifra que se decide</h2>' +
      '<p>Una expresión describe; una <strong>ecuación</strong> afirma que dos expresiones valen lo mismo. Resolverla es encontrar los valores de la incógnita que hacen verdadera esa afirmación, y el método descansa en una idea sencilla: si dos cosas son iguales y se les hace exactamente lo mismo a las dos, siguen siendo iguales. Sumar, restar, multiplicar o dividir de los dos lados por la misma cantidad son operaciones que conservan la igualdad, con una sola prohibición, dividir entre cero.</p>' +
      '<p>La estrategia para despejar es siempre la misma. Primero se juntan de un lado todos los términos que llevan la incógnita y del otro todos los que no la llevan. Después se factoriza la incógnita, es decir se saca como factor común del grupo que la contiene. Al final se divide entre el coeficiente que quedó acompañándola. Cada paso deshace una operación con su inversa, y por eso conviene identificarlas: la resta deshace una suma y la división deshace una multiplicación.</p>' +
      '<p>La aplicación que da nombre a medio curso es el <strong>punto de equilibrio</strong>: la cantidad en la que el ingreso iguala al costo total y la utilidad vale cero. Al plantear que el precio por la cantidad es igual al costo fijo más el costo variable por la cantidad, aparecen términos con la incógnita en los dos lados. Al pasarlos juntos y factorizar, el coeficiente que queda es precisamente el margen de contribución, y la solución resulta ser el costo fijo dividido entre ese margen.</p>' +

      '<div class="stag">Concept 2</div>' +
      '<h2>Isolating the unknown: from the model to the figure you decide on</h2>' +
      '<p>An expression describes; an <strong>equation</strong> claims that two expressions are worth the same. Solving it means finding the values of the unknown that make the claim true, and the method rests on a simple idea: if two things are equal and you do exactly the same to both, they stay equal. Adding, subtracting, multiplying or dividing both sides by the same quantity are operations that preserve equality, with a single prohibition, dividing by zero.</p>' +
      '<p>The strategy for isolating is always the same. First gather on one side every term carrying the unknown and on the other every term that does not. Then factor the unknown, that is take it out as a common factor of the group that contains it. Finally divide by the coefficient left beside it. Each step undoes an operation with its inverse, which is why they are worth naming: subtraction undoes addition and division undoes multiplication.</p>' +
      '<p>The application that gives half this course its name is the <strong>break even point</strong>: the quantity at which revenue equals total cost and profit is zero. Setting price times quantity equal to fixed cost plus variable cost times quantity puts terms with the unknown on both sides. Bringing them together and factoring leaves a coefficient that is precisely the contribution margin, and the solution turns out to be the fixed cost divided by that margin.</p>' +
      '<p>One detail separates whoever solves equations from whoever solves business questions: interpretation. Units are sold whole, so a result with decimals is always rounded up, because at the unit below there is still a loss. It is also worth translating the result into pesos by multiplying it by the price, since a director rarely sets targets in pieces and almost always in sales. And the solution has to make sense: if the unit margin is negative, the division returns a negative figure, and what the algebra is saying is that no volume can save that product.</p>' +

    if (es) return '' +
      '<div class="stag">Concepto 3</div>' +
      '<h2>Despejar cualquier letra y el porcentaje que engaña</h2>' +
      '<p>Hasta aquí la incógnita fue siempre la cantidad, pero una fórmula de negocio se puede resolver para cualquiera de sus letras y ahí gana toda su utilidad. A eso se le llama <strong>ecuación literal</strong>: se despeja usando exactamente las mismas reglas de antes, solo que en lugar de números se arrastran símbolos. La ventaja práctica es enorme, porque la fórmula despejada se convierte en una herramienta reutilizable en cualquier hoja de cálculo.</p>' +
      '<p>De la fórmula de la utilidad salen tres preguntas que un área comercial hace todo el tiempo. Cuántas unidades hacen falta para alcanzar una utilidad objetivo, que se responde sumando esa utilidad al costo fijo antes de dividir entre el margen, porque la meta se comporta igual que un costo fijo más que hay que cubrir. Qué precio hace falta para lograr esa utilidad con un volumen dado, que se responde despejando el precio. Y cuánto costo fijo tolera el negocio sin dejar de ganar, que se despeja igual de rápido.</p>' +
      '<p>La segunda mitad de este tema son los <strong>porcentajes</strong>, que no son un capítulo aparte sino álgebra escrita en otro dialecto. Aumentar una cantidad en una tasa es multiplicarla por uno más esa tasa, y descontarla es multiplicarla por uno menos la tasa. Lo importante es que un porcentaje siempre se calcula contra una base, y cambiar de base cambia el resultado aunque la tasa se lea igual.</p>' +
      '<p>Ahí vive la trampa que más dinero cuesta en el comercio. Un <strong>margen sobre costo</strong> toma el costo como el entero, de modo que el precio es el costo multiplicado por uno más la tasa. Un <strong>margen sobre precio</strong> toma el precio como el entero, y como el precio es justamente lo que se busca, la incógnita aparece en los dos lados y hay que despejar: al agrupar, el precio resulta ser el costo dividido entre uno menos la tasa. Multiplicar donde había que dividir es el error clásico, y el hueco entre ambos resultados crece rápido conforme sube la tasa.</p>' +

        '<div class="rcard"><div class="rname">Precio meta</div><div class="rform">p = ' + frac('U + F', 'q') + ' + v</div><div class="rnote">Despejado de la misma fórmula.</div></div>' +
        '<div class="rcard"><div class="rname">Sobre costo</div><div class="rform">precio = c·(1 + m)</div><div class="rnote">El costo es la base.</div></div>' +

      '</div>' +
      '<p><strong>Ejemplo resuelto.</strong> Una distribuidora de refacciones compra una pieza en ' + money(c3c) + ' y su política comercial pide un margen bruto de ' + pct1(c3g) + ' por ciento sobre el precio de venta. El gerente de compras teclea el costo, lo multiplica por uno más la tasa y anuncia el precio.</p>' +
      '<div class="callout"><p><strong>Paso 1.</strong> Lo que pide la política es que la ganancia represente ' + pct1(c3g) + ' por ciento del precio, no del costo. Es decir, el precio menos ' + money(c3c) + ' debe ser igual a ' + pct1(c3g) + ' por ciento del propio precio.<br>' +
      '<strong>Paso 2.</strong> La incógnita aparece en los dos lados, así que se agrupa: el precio menos su fracción de ' + pct1(c3g) + ' por ciento deja el precio multiplicado por ' + dec2(1 - c3g) + '.<br>' +
