<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sucesiones Aritméticas de Figuras</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

/* ── MANIPULATIVES ── */
.mexpr { font-family:'IBM Plex Mono',monospace; font-size:1.12rem; font-weight:600; color:var(--green-dark); background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:.75rem .8rem; text-align:center; overflow-x:auto; white-space:nowrap; }
.mexpr.big { font-size:1.24rem; }
.mstage { font-size:.7rem; letter-spacing:.09em; text-transform:uppercase; color:var(--text3); margin-bottom:.45rem; }
.mrow { display:flex; gap:.45rem; flex-wrap:wrap; align-items:center; margin-top:.65rem; }
.mbtn { background:var(--surface2); border:1.5px solid var(--border); border-radius:8px; padding:.5rem .8rem; font-size:.83rem; cursor:pointer; color:var(--text); font-family:inherit; min-height:44px; text-align:left; }
.mbtn:hover { border-color:var(--green); background:var(--green-bg); }
.mbtn.on { background:var(--green); color:var(--green-bg); border-color:var(--green); }
.mbtn.done { background:var(--ok-bg); border-color:var(--ok); color:var(--ok); }
.mbtn.miss { background:var(--bad-bg); border-color:var(--bad); color:var(--bad); }
.mbtn.mono { font-family:'IBM Plex Mono',monospace; font-size:.92rem; font-weight:600; }
.mfb { margin-top:.7rem; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.6rem .8rem; font-size:.82rem; color:var(--text2); min-height:2.6rem; }
.mfb.good { background:var(--ok-bg); border-left-color:var(--ok); color:var(--ok); }
.mfb.warn { background:var(--bad-bg); border-left-color:var(--bad); color:var(--bad); }
.mcanvas { display:block; width:100%; height:150px; }
.mtrack { font-size:.72rem; color:var(--text3); margin-top:.5rem; letter-spacing:.03em; }
.trow { display:flex; gap:.4rem; margin-top:.7rem; overflow-x:auto; padding-bottom:.2rem; }
.tcell { flex:1 1 0; min-width:62px; background:var(--surface2); border:1.5px solid var(--border); border-radius:8px; padding:.4rem .25rem; text-align:center; }
.tcell.hit { border-color:var(--ok); background:var(--ok-bg); }
.tcell.over { border-color:var(--bad); background:var(--bad-bg); }
.tcell.under { border-color:var(--gold); background:var(--gold-bg); }
.tn { font-size:.62rem; text-transform:uppercase; letter-spacing:.07em; color:var(--text3); }
.tv { font-family:'IBM Plex Mono',monospace; font-size:.92rem; font-weight:600; color:var(--text); }
.tu { font-family:'IBM Plex Mono',monospace; font-size:.82rem; color:var(--text2); }
.seqrow { display:flex; gap:.4rem; flex-wrap:wrap; align-items:center; margin:.2rem 0 .1rem; }
.scell { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; background:var(--surface2); border:1.5px solid var(--border); border-radius:8px; padding:.5rem .7rem; min-width:52px; text-align:center; color:var(--text); }
.scell.hole { border-style:dashed; border-color:var(--gold); color:var(--gold); background:var(--gold-bg); }
.scell.fixed { border-color:var(--ok); background:var(--ok-bg); color:var(--ok); }
.sdiff { font-size:.7rem; color:var(--text3); font-family:'IBM Plex Mono',monospace; }
.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Sucesiones Aritméticas de Figuras</div>
    <div class="wcourse" id="wcourse-el">Matemáticas · 1° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');

}

async function generatePDF() {
  var btn = document.getElementById('dlBtn');
  btn.textContent = 'Generando PDF…';
  btn.disabled = true;

  var jspdf   = window.jspdf;
  var doc     = new jspdf.jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });
  var PW      = 215.9;
  var M       = 18;
  var TW      = PW - M * 2;
  var PH      = doc.internal.pageSize.height;
  var name    = studentData.name;
  var group   = studentData.group;
  var total   = problems.length;
  var pct     = Math.round(correctCount / total * 100);
  var dateStr = new Date().toLocaleString('es-MX', { dateStyle:'long', timeStyle:'short' });

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS — INJECTION BLOCK ─────────────────────────────────────────
  //   Match these RGB values to --green and --gold above.
  //   PRIMARY  → pBR, pBG, pBB
  //   ACCENT   → pAR, pAG, pAB
  // ──────────────────────────────────────────────────────────────────────────
  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;  // PRIMARY (from SCHOOL, Rule 16)
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;   // ACCENT (from SCHOOL, Rule 16)

  function pdfText(html) {
    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')

function L(o){ if(o===null||o===undefined) return ''; if(typeof o!=='object') return String(o); return (o[LANG]!==undefined?o[LANG]:o.es); }
function numStr(n){ return n<0 ? '−'+Math.abs(n) : String(n); }
function cssVar(n){ try { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); } catch(e){ return ''; } }
function shuffleOpts(opts, correct, rng){ var a=shuffle(opts,rng); return { options:a, correctIdx:a.indexOf(correct) }; }
function mkNums(correct, cands){
  var out=[correct], i;
  for(i=0;i<cands.length && out.length<4;i++){ if(out.indexOf(cands[i])<0) out.push(cands[i]); }
  var d=1;
  while(out.length<4){
    if(out.indexOf(correct+d)<0) out.push(correct+d);
    if(out.length<4 && out.indexOf(correct-d)<0) out.push(correct-d);
    d++;
  }
  return out;
}
function numOptions(correct, cands, unit){
  var u = unit||'';
  return { options: mkNums(correct,cands).map(function(v){ return numStr(v)+u; }), correct: numStr(correct)+u };
}
function uniq4(list){
  var out=[], i;
  for(i=0;i<list.length;i++){ if(out.indexOf(list[i])<0) out.push(list[i]); if(out.length===4) break; }
  return out;
}
function ruleStr(d,b){ return d+'n' + (b>0 ? ' + '+b : (b<0 ? ' − '+Math.abs(b) : '')); }
function seqList(a1,d,k){ var s=[],i; for(i=0;i<k;i++) s.push(numStr(a1+i*d)); return s.join(', ')+', …'; }
function addSection(html){
  var d=document.createElement('div'); d.className='section'; d.innerHTML=html;
  document.getElementById('lessonBody').appendChild(d); return d;
}
function addProblem(rng, cfg){
  var so = shuffleOpts(cfg.options, cfg.correct, rng);
  problems.push({ title:cfg.title, questionText:cfg.questionText, fn:cfg.fn||'', hint:cfg.hint,
    explanation:cfg.explanation, options:so.options, correctIdx:so.correctIdx,
    showWork:!!cfg.showWork, studentChoice:null, pendingChoice:null });
  buildOneCard(problems[problems.length-1], problems.length-1);
}
function subRng(rng, tag){ return seededRng(tag + Math.floor(rng()*1000000)); }
function setFb(id, txt, kind){
  var e=document.getElementById(id); if(!e) return;
  e.innerHTML = txt; e.className = 'mfb' + (kind?(' '+kind):'');
}
function fitCanvas(c){
  var dpr=window.devicePixelRatio||1, rect=c.getBoundingClientRect();
  if(rect.width<10) return null;
  c.width=rect.width*dpr; c.height=rect.height*dpr;
  var ctx=c.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,rect.width,rect.height);
  return { ctx:ctx, W:rect.width, H:rect.height };
}

/* ═════════ WIDGET 1: constructor de figuras ═════════ */
var W1 = { round:0, tries:0, a1:0, d:0, gpos:0, goal:0, n:1, done:false, rng:null };
function w1Count(){ return W1.a1 + (W1.n-1)*W1.d; }
function w1NewRound(){
  var r = W1.rng;
  W1.a1 = 2 + Math.floor(r()*4);
  W1.d  = 2 + Math.floor(r()*4);
  W1.gpos = 4 + Math.floor(r()*4);
  W1.goal = W1.a1 + (W1.gpos-1)*W1.d;
  W1.n = 1; W1.tries = 0;
  var s=document.getElementById('w1slider'); if(s) s.value = 1;
  w1Render();
  setFb('w1fb', L({
    es:'La figura 1 se arma con <b>'+W1.a1+'</b> cuadros y cada figura siguiente agrega <b>'+W1.d+'</b> cuadros. Mueve el deslizador hasta la figura que tenga exactamente <b>'+W1.goal+'</b> cuadros.',
    en:'Figure 1 is built with <b>'+W1.a1+'</b> squares and each following figure adds <b>'+W1.d+'</b> squares. Move the slider to the figure that has exactly <b>'+W1.goal+'</b> squares.'}));
}
function w1Draw(){
  var c=document.getElementById('w1canvas'); if(!c) return;
  var s=fitCanvas(c); if(!s) return;
  var ctx=s.ctx, W=s.W, H=s.H;
  var total=w1Count();
  var cols=10, size=Math.floor((W-24)/cols)-3;
  if(size>22) size=22; if(size<9) size=9;
  var gap=3, rows=Math.ceil(total/cols);
  var y0=Math.max(8,(H-rows*(size+gap))/2), x0=12;
  var cGreen=cssVar('--green')||'#1a4a8a', cGold=cssVar('--gold')||'#c9a84c', cBd=cssVar('--border')||'#ddd8cc';
  for(var i=0;i<total;i++){
    var rw=Math.floor(i/cols), q=i%cols;
    var x=x0+q*(size+gap), y=y0+rw*(size+gap);
    var grp = i<W1.a1 ? -1 : Math.floor((i-W1.a1)/W1.d);
    ctx.fillStyle = grp<0 ? cGreen : cGold;
    ctx.globalAlpha = grp<0 ? 1 : (grp%2===0 ? 0.92 : 0.55);
    ctx.fillRect(x,y,size,size);
    ctx.globalAlpha = 1;
    ctx.strokeStyle = cBd; ctx.lineWidth=1;
    ctx.strokeRect(x+0.5,y+0.5,size-1,size-1);
  }
}
function w1Render(){
  var p=document.getElementById('w1pos'); if(p) p.textContent=String(W1.n);
  var c=document.getElementById('w1cnt'); if(c) c.textContent=String(w1Count());
  var g=document.getElementById('w1goal'); if(g) g.textContent=String(W1.goal);
  var t=document.getElementById('w1round');
  if(t) t.textContent = W1.done ? '' : L({es:'Ronda '+(Math.min(W1.round,2)+1)+' de 3', en:'Round '+(Math.min(W1.round,2)+1)+' of 3'});
  w1Draw();
}
function w1Slide(){
  if(W1.done) return;
  var s=document.getElementById('w1slider'); if(!s) return;
  W1.n = parseInt(s.value,10)||1;
  w1Render();
  var diff = W1.goal - w1Count();
  if(diff===0){
    setFb('w1fb', L({es:'Esa figura tiene justo <b>'+W1.goal+'</b> cuadros. Confírmala.', en:'That figure has exactly <b>'+W1.goal+'</b> squares. Confirm it.'}), 'good');
  } else if(diff>0){
    setFb('w1fb', L({es:'Te faltan <b>'+diff+'</b> cuadros para llegar a '+W1.goal+'. Cada figura que avanzas suma '+W1.d+'.',
                     en:'You are <b>'+diff+'</b> squares short of '+W1.goal+'. Every figure you move forward adds '+W1.d+'.'}));
  } else {
    setFb('w1fb', L({es:'Te pasaste por <b>'+Math.abs(diff)+'</b> cuadros. Regresa hacia figuras anteriores.',
                     en:'You went <b>'+Math.abs(diff)+'</b> squares too far. Move back toward earlier figures.'}));
  }
}
function w1Advance(){
  W1.round++;
  if(W1.round>=3){
    W1.done=true;
    setFb('w1fb', L({es:'Tres figuras construidas. El primer bloque nunca cambia y los grupos que se agregan son siempre del mismo tamaño: por eso basta la posición para saber cuántos cuadros hay.',
                     en:'Three figures built. The first block never changes and the groups added are always the same size: that is why the position alone tells you how many squares there are.'}), 'good');
    var t=document.getElementById('w1round'); if(t) t.textContent='';
    return;
  }
  setTimeout(w1NewRound, 900);
}
function w1Check(){
  if(W1.done) return;
  if(w1Count()===W1.goal){
    setFb('w1fb', L({es:'Correcto: la figura '+W1.gpos+' tiene '+W1.a1+' cuadros del inicio más '+(W1.gpos-1)+' grupos de '+W1.d+'.',
                     en:'Correct: figure '+W1.gpos+' has the '+W1.a1+' starting squares plus '+(W1.gpos-1)+' groups of '+W1.d+'.'}), 'good');
    w1Advance(); return;
  }
  W1.tries++;
  if(W1.tries>=3){
    W1.n = W1.gpos;
    var s=document.getElementById('w1slider'); if(s) s.value=W1.gpos;
    w1Render();
    setFb('w1fb', L({es:'La figura buscada era la '+W1.gpos+': '+W1.a1+' + '+(W1.gpos-1)+' × '+W1.d+' = '+W1.goal+' cuadros.',
                     en:'The figure you needed was number '+W1.gpos+': '+W1.a1+' + '+(W1.gpos-1)+' × '+W1.d+' = '+W1.goal+' squares.'}), 'warn');
    w1Advance(); return;
  }
  var diff = W1.goal - w1Count();
  setFb('w1fb', L({es:'Esa figura tiene '+w1Count()+' cuadros. '+(diff>0?'Faltan '+diff+', avanza a una posición mayor.':'Sobran '+Math.abs(diff)+', retrocede una o dos posiciones.'),
                   en:'That figure has '+w1Count()+' squares. '+(diff>0?'You need '+diff+' more, move to a later position.':'That is '+Math.abs(diff)+' too many, step back one or two positions.')}), 'warn');
}

/* ═════════ WIDGET 2: máquina de la regla ═════════ */
var W2 = { round:0, tries:0, d:0, b:0, md:1, mb:0, done:false, rng:null };
function w2NewRound(){
  var r=W2.rng;
  W2.d = 2 + Math.floor(r()*5);
  var a1 = 2 + Math.floor(r()*7);
  if(a1===W2.d) a1++;
  W2.b = a1 - W2.d;
  W2.md = 1; W2.mb = 0; W2.tries = 0;
  var sd=document.getElementById('w2d'); if(sd) sd.value=1;
  var sb=document.getElementById('w2b'); if(sb) sb.value=0;
  w2Render();
  setFb('w2fb', L({es:'La fila de arriba es la sucesión que debes producir. Ajusta los dos controles hasta que tu fila de abajo la copie término por término.',
                   en:'The top row is the sequence you must produce. Adjust the two controls until your bottom row copies it term by term.'}));
}
function w2T(n){ return W2.d*n + W2.b; }
function w2M(n){ return W2.md*n + W2.mb; }
function w2Render(){
  var box=document.getElementById('w2table');
  if(box){
    var h='';
    for(var n=1;n<=5;n++){
      var tv=w2T(n), mv=w2M(n);
      var cls = mv===tv ? 'hit' : (mv>tv ? 'over' : 'under');
      h += '<div class="tcell '+cls+'"><div class="tn">n = '+n+'</div><div class="tv">'+numStr(tv)+'</div><div class="tu">'+numStr(mv)+'</div></div>';
    }
    box.innerHTML=h;
  }
  var e=document.getElementById('w2rule'); if(e) e.textContent='a(n) = '+ruleStr(W2.md,W2.mb);
  var dv=document.getElementById('w2dval'); if(dv) dv.textContent=String(W2.md);
  var bv=document.getElementById('w2bval'); if(bv) bv.textContent=numStr(W2.mb);
  var rd=document.getElementById('w2round');
  if(rd) rd.textContent = W2.done ? '' : L({es:'Ronda '+(Math.min(W2.round,2)+1)+' de 3', en:'Round '+(Math.min(W2.round,2)+1)+' of 3'});
}
function w2Slide(){
  if(W2.done) return;
  var sd=document.getElementById('w2d'), sb=document.getElementById('w2b');
  if(sd) W2.md=parseInt(sd.value,10);
  if(sb) W2.mb=parseInt(sb.value,10);
  w2Render();
  if(W2.md===W2.d && W2.mb===W2.b){
    setFb('w2fb', L({es:'Los cinco términos coinciden. Confirma tu regla.', en:'All five terms match. Confirm your rule.'}), 'good');
  } else if(W2.md<W2.d){
    setFb('w2fb', L({es:'Tu sucesión crece demasiado despacio: entre un término y el siguiente avanzas '+W2.md+' y la sucesión de arriba avanza más. Sube el multiplicador.',
                     en:'Your sequence grows too slowly: you move '+W2.md+' from one term to the next and the top sequence moves more. Raise the multiplier.'}));
  } else if(W2.md>W2.d){
    setFb('w2fb', L({es:'Tu sucesión se dispara: cada paso avanza '+W2.md+' y eso separa tus términos de los de arriba. Baja el multiplicador.',
                     en:'Your sequence shoots up: each step moves '+W2.md+' and that pulls your terms away from the top ones. Lower the multiplier.'}));
  } else {
    var g = w2M(1)-w2T(1);
    setFb('w2fb', L({es:'El ritmo ya es el correcto, pero toda tu sucesión está '+Math.abs(g)+' '+(g>0?'unidades por encima':'unidades por debajo')+'. Mueve el segundo control.',
                     en:'The pace is right now, but your whole sequence sits '+Math.abs(g)+' '+(g>0?'units above':'units below')+'. Move the second control.'}));
  }
}
function w2Advance(){
  W2.round++;
  if(W2.round>=3){
    W2.done=true;
    setFb('w2fb', L({es:'Tres reglas encontradas. El multiplicador de n siempre resultó ser la diferencia constante, y el otro número acomoda la sucesión en su altura correcta.',
                     en:'Three rules found. The multiplier of n always turned out to be the constant difference, and the other number sets the sequence at its correct height.'}), 'good');
    var rd=document.getElementById('w2round'); if(rd) rd.textContent='';
    return;
  }
  setTimeout(w2NewRound, 950);
}
function w2Check(){
  if(W2.done) return;
  if(W2.md===W2.d && W2.mb===W2.b){
    setFb('w2fb', L({es:'Regla correcta: a(n) = '+ruleStr(W2.d,W2.b)+'.', en:'Correct rule: a(n) = '+ruleStr(W2.d,W2.b)+'.'}), 'good');
    w2Advance(); return;
  }
  W2.tries++;
  if(W2.tries>=3){
    W2.md=W2.d; W2.mb=W2.b;
    var sd=document.getElementById('w2d'), sb=document.getElementById('w2b');
    if(sd) sd.value=W2.d; if(sb) sb.value=W2.b;
    w2Render();
    setFb('w2fb', L({es:'La regla era a(n) = '+ruleStr(W2.d,W2.b)+', porque la sucesión avanza de '+W2.d+' en '+W2.d+' y en la posición 1 vale '+w2T(1)+'.',
                     en:'The rule was a(n) = '+ruleStr(W2.d,W2.b)+', because the sequence moves in steps of '+W2.d+' and at position 1 it is worth '+w2T(1)+'.'}), 'warn');
    w2Advance(); return;
  }
  var miss=0;
  for(var n=1;n<=5;n++) if(w2M(n)!==w2T(n)) miss++;
  setFb('w2fb', L({es:'Todavía no: '+miss+' de los 5 términos no coinciden. Fíjate primero en cuánto avanza la sucesión de un término al siguiente.',
                   en:'Not yet: '+miss+' of the 5 terms do not match. Look first at how much the sequence advances from one term to the next.'}), 'warn');
}

/* ═════════ WIDGET 3: cazador del término faltante ═════════ */
var W3 = { round:0, tries:0, a1:0, d:0, hole:0, terms:[], opts:[], filled:false, done:false, rng:null };
function w3NewRound(){
  var r=W3.rng, i;
  W3.d = 3 + Math.floor(r()*6);
  W3.a1 = 2 + Math.floor(r()*9);
  W3.terms=[]; for(i=0;i<6;i++) W3.terms.push(W3.a1+i*W3.d);
  W3.hole = 1 + Math.floor(r()*4);
  var ans = W3.terms[W3.hole];
  W3.opts = shuffle(uniq4([ans, ans+W3.d, ans-W3.d, ans+1, ans-1, ans+2]), r);
  W3.tries=0; W3.filled=false;
  w3Render();
  setFb('w3fb', L({es:'Falta un término. Toca el número que mantiene iguales todas las diferencias de la fila.',
                   en:'One term is missing. Tap the number that keeps every difference in the row equal.'}));
}
function w3Render(){
  var box=document.getElementById('w3seq');
  if(box){
    var h='', i;
    for(i=0;i<W3.terms.length;i++){
      if(i===W3.hole && !W3.filled) h += '<div class="scell hole">?</div>';
      else h += '<div class="scell'+(i===W3.hole?' fixed':'')+'">'+numStr(W3.terms[i])+'</div>';
    }
    box.innerHTML=h;
  }
  var chips=document.getElementById('w3chips');
  if(chips){
    var c='', j;
    for(j=0;j<W3.opts.length;j++) c += '<button class="mbtn mono" id="w3c'+j+'" onclick="w3Tap('+j+')">'+numStr(W3.opts[j])+'</button>';
    chips.innerHTML = W3.filled ? '' : c;
  }
  var rd=document.getElementById('w3round');
  if(rd) rd.textContent = W3.done ? '' : L({es:'Ronda '+(Math.min(W3.round,2)+1)+' de 3', en:'Round '+(Math.min(W3.round,2)+1)+' of 3'});
}
function w3Advance(){
  W3.round++;
  if(W3.round>=3){
    W3.done=true;
    setFb('w3fb', L({es:'Tres huecos resueltos. Un solo número mantiene constante la diferencia, y por eso una sucesión aritmética queda determinada por su primer término y su diferencia.',
                     en:'Three gaps solved. Only one number keeps the difference constant, and that is why an arithmetic sequence is fixed by its first term and its difference.'}), 'good');
    var rd=document.getElementById('w3round'); if(rd) rd.textContent='';
    return;
  }
  setTimeout(w3NewRound, 950);
}
function w3Tap(i){
  if(W3.done||W3.filled) return;
  var v=W3.opts[i], ans=W3.terms[W3.hole];
  var prev=W3.terms[W3.hole-1], next=W3.terms[W3.hole+1];
  if(v===ans){
    W3.filled=true; w3Render();
    setFb('w3fb', L({es:'Encaja: '+numStr(v)+' − '+numStr(prev)+' = '+W3.d+' y '+numStr(next)+' − '+numStr(v)+' = '+W3.d+'.',
                     en:'It fits: '+numStr(v)+' − '+numStr(prev)+' = '+W3.d+' and '+numStr(next)+' − '+numStr(v)+' = '+W3.d+'.'}), 'good');
    w3Advance(); return;
  }
  var btn=document.getElementById('w3c'+i); if(btn) btn.className='mbtn mono miss';
  W3.tries++;
  if(W3.tries>=3){
    W3.filled=true; w3Render();
    setFb('w3fb', L({es:'El término faltante era '+numStr(ans)+', porque '+numStr(prev)+' + '+W3.d+' = '+numStr(ans)+'.',
                     en:'The missing term was '+numStr(ans)+', because '+numStr(prev)+' + '+W3.d+' = '+numStr(ans)+'.'}), 'warn');
    w3Advance(); return;
  }
  setFb('w3fb', L({es:'Con '+numStr(v)+' la diferencia hacia atrás sería '+numStr(v-prev)+' y hacia adelante '+numStr(next-v)+', y esas dos deben ser iguales. Prueba otro número.',
                   en:'With '+numStr(v)+' the difference backwards would be '+numStr(v-prev)+' and forwards '+numStr(next-v)+', and those two must be equal. Try another number.'}), 'warn');
}

/* ═════════ WIDGET 4: cinta de pertenencia ═════════ */
var W4 = { round:0, tries:0, d:0, b:0, opts:[], ans:0, mark:null, done:false, rng:null };
function w4Term(n){ return W4.d*n + W4.b; }
function w4NewRound(){
  var r=W4.rng, j;
  W4.d = 3 + Math.floor(r()*5);
  var a1 = 2 + Math.floor(r()*6);
  W4.b = a1 - W4.d;
  var k = 3 + Math.floor(r()*5);
  W4.ans = w4Term(k);
  var pool=[W4.ans+1, W4.ans-1, W4.ans+2, W4.ans-2, W4.ans+W4.d-1, W4.ans-W4.d+1];
  var o=[W4.ans];
  for(j=0;j<pool.length && o.length<4;j++){
    var v=pool[j];
    if(o.indexOf(v)<0 && v>0 && ((v-W4.b)%W4.d)!==0) o.push(v);
  }
  W4.opts = shuffle(o, r);
  W4.mark=null; W4.tries=0;
  w4Render();
  setFb('w4fb', L({es:'La cinta marca los términos de la sucesión a(n) = '+ruleStr(W4.d,W4.b)+'. Toca el número que cae justo sobre una de las marcas.',
                   en:'The strip marks the terms of the sequence a(n) = '+ruleStr(W4.d,W4.b)+'. Tap the number that lands exactly on one of the marks.'}));
}
function w4Draw(){
  var c=document.getElementById('w4canvas'); if(!c) return;
  var s=fitCanvas(c); if(!s) return;
  var ctx=s.ctx, W=s.W, H=s.H;
  var t1=w4Term(1), t8=w4Term(8), pad=20, y=H*0.58;
  function X(v){ return pad + (v-t1)/(t8-t1)*(W-2*pad); }
  var cGreen=cssVar('--green')||'#1a4a8a', cGold=cssVar('--gold')||'#c9a84c',
      cBd=cssVar('--border')||'#ddd8cc', cTx=cssVar('--text3')||'#7a7468',
      cOk=cssVar('--ok')||'#2d6a4f', cBad=cssVar('--bad')||'#8b2500';
  ctx.strokeStyle=cBd; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(pad-8,y); ctx.lineTo(W-pad+8,y); ctx.stroke();
  ctx.font='10px "IBM Plex Mono", monospace'; ctx.textAlign='center';
  for(var n=1;n<=8;n++){
    var v=w4Term(n), x=X(v);
    ctx.fillStyle=cGreen; ctx.beginPath(); ctx.arc(x,y,4,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=cTx; ctx.fillText(numStr(v), x, y+16);
    ctx.fillStyle=cGold; ctx.fillText('n'+n, x, y-10);
  }
  if(W4.mark!==null){
    var mv=W4.mark, mx=X(mv), on=((mv-W4.b)%W4.d)===0;
    ctx.fillStyle = on?cOk:cBad;
    ctx.beginPath(); ctx.moveTo(mx,y-4); ctx.lineTo(mx-7,y-22); ctx.lineTo(mx+7,y-22); ctx.closePath(); ctx.fill();
    ctx.font='11px "IBM Plex Mono", monospace';
    ctx.fillText(numStr(mv), mx, y-26);
  }
}
function w4Render(){
  var chips=document.getElementById('w4chips');
  if(chips){
    var h='', j;
    for(j=0;j<W4.opts.length;j++) h += '<button class="mbtn mono" id="w4c'+j+'" onclick="w4Tap('+j+')">'+numStr(W4.opts[j])+'</button>';
    chips.innerHTML = W4.done ? '' : h;
  }
  var e=document.getElementById('w4rule'); if(e) e.textContent='a(n) = '+ruleStr(W4.d,W4.b);
  var rd=document.getElementById('w4round');
  if(rd) rd.textContent = W4.done ? '' : L({es:'Ronda '+(Math.min(W4.round,2)+1)+' de 3', en:'Round '+(Math.min(W4.round,2)+1)+' of 3'});
  w4Draw();
}
function w4Advance(){
  W4.round++;
  if(W4.round>=3){
    W4.done=true; w4Render();
    setFb('w4fb', L({es:'Tres cintas revisadas. Un número pertenece a la sucesión solo si cae exactamente sobre una marca, es decir, si al quitarle el término independiente el resto se reparte en pasos completos.',
                     en:'Three strips checked. A number belongs to the sequence only if it lands exactly on a mark, that is, if after removing the independent term the rest splits into whole steps.'}), 'good');
    return;
  }
  setTimeout(w4NewRound, 950);
}
function w4Tap(i){
  if(W4.done) return;
  var v=W4.opts[i];
  W4.mark=v; w4Draw();
  if(v===W4.ans){
    var pos=(v-W4.b)/W4.d;
    setFb('w4fb', L({es:numStr(v)+' cae sobre una marca: ocupa la posición '+pos+' de la sucesión.',
                     en:numStr(v)+' lands on a mark: it sits at position '+pos+' of the sequence.'}), 'good');
    w4Advance(); return;
  }
  var btn=document.getElementById('w4c'+i); if(btn) btn.className='mbtn mono miss';
  var lo=Math.floor((v-W4.b)/W4.d), hi=lo+1;
  W4.tries++;
  if(W4.tries>=3){
    W4.mark=W4.ans; w4Draw();
    setFb('w4fb', L({es:'El número de la sucesión era '+numStr(W4.ans)+', en la posición '+((W4.ans-W4.b)/W4.d)+'.',
                     en:'The number in the sequence was '+numStr(W4.ans)+', at position '+((W4.ans-W4.b)/W4.d)+'.'}), 'warn');
    w4Advance(); return;
  }
  setFb('w4fb', L({es:numStr(v)+' queda entre las marcas '+numStr(w4Term(lo))+' y '+numStr(w4Term(hi))+', sin tocar ninguna. Busca un número que caiga justo encima.',
                   en:numStr(v)+' falls between the marks '+numStr(w4Term(lo))+' and '+numStr(w4Term(hi))+' without touching either. Look for a number that lands right on top.'}), 'warn');
}

/* ══════════════════════════════════════════════════════════════════════════

  /* ─── P1 ─── */
  (function(){

                        en:'What is the constant difference between each term of this sequence and the next one?'}),

             en:'The following situations mix everything above: recognizing when a constant difference is present, reading what each piece of a rule means and working with sequences that decrease instead of growing.'})+'</p>'
  );

  /* ─── P8 ─── */
  (function(){
    var cfg, v=Math.floor(rng()*2);
    var x=2+Math.floor(rng()*3);
    if(v===0){
      var a=3+Math.floor(rng()*5), d1=4+Math.floor(rng()*4);
      var a2=6+Math.floor(rng()*6), d2=5+Math.floor(rng()*3);
      var a3=1+Math.floor(rng()*4), d3=6+Math.floor(rng()*4);
      var bad=x+', '+(2*x)+', '+(4*x)+', '+(8*x)+', …';
      var opts=uniq4([bad, seqList(a,d1,4), seqList(a2,d2,4), seqList(a3,d3,4)]);
      cfg={
        title:L({es:'La que no encaja',en:'The one that does not fit'}),
        questionText:L({es:'¿Cuál de estas sucesiones no tiene una diferencia constante entre términos vecinos?',
                        en:'Which of these sequences does not have a constant difference between neighbouring terms?'}),
        fn:'',
        hint:L({es:'Resta cada término del siguiente en las cuatro listas y compara los resultados dentro de cada una.',
                en:'Subtract each term from the next one in the four lists and compare the results within each list.'}),
        explanation:L({es:'En esa lista cada término es el doble del anterior, así que el avance crece: '+(2*x)+' − '+x+' = '+x+', pero '+(4*x)+' − '+(2*x)+' = '+(2*x),
                       en:'In that list each term is double the previous one, so the advance grows: '+(2*x)+' − '+x+' = '+x+', but '+(4*x)+' − '+(2*x)+' = '+(2*x)}),
        options:opts, correct:bad, showWork:false
      };
    } else {
      var b1=4+Math.floor(rng()*6), dd=5+Math.floor(rng()*4);
      var good=seqList(b1,dd,4);
      var c1=2+Math.floor(rng()*3);
      var bad1=c1+', '+(3*c1)+', '+(9*c1)+', '+(27*c1)+', …';
      var s0=1+Math.floor(rng()*3);
      var bad2=s0+', '+(s0+2)+', '+(s0+5)+', '+(s0+9)+', …';
      var bad3=(1+Math.floor(rng()*2))+', 4, 9, 16, …';
      var opts2=uniq4([good, bad1, bad2, bad3]);
      cfg={
        title:L({es:'La que avanza parejo',en:'The one that advances evenly'}),
        questionText:L({es:'¿Cuál de estas sucesiones avanza siempre con la misma diferencia?',
                        en:'Which of these sequences always advances with the same difference?'}),
        fn:'',
        hint:L({es:'Anota el avance de cada paso en las cuatro listas; solo una repite el mismo número en todos sus pasos.',
                en:'Write the advance of every step in the four lists; only one repeats the same number in all its steps.'}),
        explanation:L({es:'En esa lista todos los pasos avanzan lo mismo: '+(b1+dd)+' − '+b1+' = '+dd+' y '+(b1+2*dd)+' − '+(b1+dd)+' = '+dd,
                       en:'In that list every step advances the same: '+(b1+dd)+' − '+b1+' = '+dd+' and '+(b1+2*dd)+' − '+(b1+dd)+' = '+dd}),
        options:opts2, correct:good, showWork:false
      };
    }
    addProblem(rng,cfg);
  })();

  /* ─── P9 ─── */
  (function(){
    var cfg, v=Math.floor(rng()*2);
    if(v===0){
      var d=3+Math.floor(rng()*5), b=2+Math.floor(rng()*7);
      var esO=['La cantidad que se suma para pasar de un término al siguiente',
               'El valor del primer término de la sucesión',
               'El valor del término anterior al primero de la sucesión',
               'El número de términos que forman la sucesión'];
      var enO=['The amount added to move from one term to the next',
               'The value of the first term of the sequence',
               'The value of the term before the first one of the sequence',
               'The number of terms that make up the sequence'];
      var arr=(LANG==='en')?enO:esO;
      cfg={
        title:L({es:'Qué dice el multiplicador',en:'What the multiplier says'}),
        questionText:L({es:'En esta regla, ¿qué representa el número '+d+' que multiplica a n?',
                        en:'In this rule, what does the number '+d+' multiplying n represent?'}),
        fn:'a(n) = '+ruleStr(d,b),
        hint:L({es:'Compara dos términos vecinos que produce la regla, por ejemplo los de las posiciones 1 y 2, y observa en cuánto se separan.',
                en:'Compare two neighbouring terms produced by the rule, for instance those at positions 1 and 2, and see how far apart they are.'}),
        explanation:L({es:'La posición 1 da '+(d+b)+' y la posición 2 da '+(2*d+b)+'; la separación entre términos vecinos es siempre '+(2*d+b)+' − '+(d+b)+' = '+d,
                       en:'Position 1 gives '+(d+b)+' and position 2 gives '+(2*d+b)+'; the gap between neighbouring terms is always '+(2*d+b)+' − '+(d+b)+' = '+d}),
        options:arr, correct:arr[0], showWork:false
      };
    } else {
      var d2=4+Math.floor(rng()*5), b2=-(2+Math.floor(rng()*6));
      var ans=d2+b2;
      var o=numOptions(ans,[d2-b2, d2, Math.abs(b2), 2*d2+b2]);
      cfg={
        title:L({es:'El arranque de la regla',en:'Where the rule starts'}),
        questionText:L({es:'Calcula el primer término de la sucesión que produce esta regla.',
                        en:'Calculate the first term of the sequence produced by this rule.'}),
        fn:'a(n) = '+ruleStr(d2,b2),
        hint:L({es:'El primer término corresponde a la posición más pequeña que puede tomar n en una sucesión.',
                en:'The first term matches the smallest position n can take in a sequence.'}),
        explanation:L({es:'El primer término corresponde a n = 1: '+d2+' × 1 − '+Math.abs(b2)+' = '+ans,
                       en:'The first term matches n = 1: '+d2+' × 1 − '+Math.abs(b2)+' = '+ans}),
        options:o.options, correct:o.correct, showWork:true
      };
    }
    addProblem(rng,cfg);
  })();

  /* ─── P10 ─── */
  (function(){
    var cfg, v=Math.floor(rng()*2), i;
    if(v===0){
      var a1=60+5*Math.floor(rng()*7), d=3+Math.floor(rng()*3), k=8+Math.floor(rng()*3);
      var ans=a1-(k-1)*d;
      var lst=[]; for(i=0;i<4;i++) lst.push(String(a1-i*d));
      var o=numOptions(ans,[a1-k*d, a1-(k-2)*d, a1+(k-1)*d]);
      cfg={
        title:L({es:'Una sucesión que baja',en:'A sequence that goes down'}),
        questionText:L({es:'Calcula el término que ocupa la posición '+k+' en esta sucesión.',
                        en:'Calculate the term at position '+k+' in this sequence.'}),
        fn:lst.join(', ')+', …',
        hint:L({es:'Aquí la diferencia constante se resta en lugar de sumarse, y el número de pasos sigue siendo uno menos que la posición.',
                en:'Here the constant difference is subtracted instead of added, and the number of steps is still one less than the position.'}),
        explanation:L({es:'De la posición 1 a la posición '+k+' hay '+(k-1)+' pasos que restan '+d+' cada uno: '+a1+' − '+(k-1)+' × '+d+' = '+ans,
                       en:'From position 1 to position '+k+' there are '+(k-1)+' steps subtracting '+d+' each: '+a1+' − '+(k-1)+' × '+d+' = '+ans}),
        options:o.options, correct:o.correct, showWork:true
      };
    } else {
      var d2=3+Math.floor(rng()*4), a2=40+Math.floor(rng()*15), c=a2+d2;
      var lst2=[]; for(i=0;i<4;i++) lst2.push(String(a2-i*d2));
      var correct=c+' − '+d2+'n';
      var opts=uniq4([correct, a2+' − '+d2+'n', c+' − '+(d2+1)+'n', (c+d2)+' − '+d2+'n', (c-1)+' − '+d2+'n']);
      cfg={
        title:L({es:'La regla que va en reversa',en:'The rule that runs backwards'}),
        questionText:L({es:'¿Cuál expresión permite calcular el término que ocupa la posición n en esta sucesión?',
                        en:'Which expression lets you calculate the term at position n in this sequence?'}),
        fn:lst2.join(', ')+', …',
        hint:L({es:'Cuando la sucesión disminuye, la parte que contiene a n se resta; ajusta el otro número para que la posición 1 devuelva el primer término.',
                en:'When the sequence decreases, the part containing n is subtracted; adjust the other number so position 1 returns the first term.'}),
        explanation:L({es:'La sucesión baja de '+d2+' en '+d2+', así que '+d2+'n aparece restando; comprobando en la posición 1: '+c+' − '+d2+' × 1 = '+a2,
                       en:'The sequence goes down in steps of '+d2+', so '+d2+'n appears subtracted; checking at position 1: '+c+' − '+d2+' × 1 = '+a2}),
        options:opts, correct:correct, showWork:false
      };
    }
    addProblem(rng,cfg);
  })();
}
</script>

<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbzLGV15JRTPs9bbSvHRLfgOXeT9oUExDf1AH546WOwq5tYxXSdhX212OWi_bTJfMGx9/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'Sucesiones Aritméticas de Figuras';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
