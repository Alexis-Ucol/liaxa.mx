      }),
      exp: L({
        es:'Lo que entra a h es el tiempo, y el llenado solo ocurre desde el instante inicial hasta el minuto ' + tt + '. Fuera de ese intervalo la situación ya no describe nada, aunque la regla algebraica pudiera seguir calculando, y la altura es lo que sale de la función, no lo que entra.',
        en:'What goes into h is the time, and the filling only happens from the initial instant to minute ' + tt + '. Outside that interval the situation no longer describes anything, even if the algebraic rule could keep computing, and the height is what comes out of the function, not what goes in.'
      })
    };
  }
  var kk = pk(rng, [1, 2, 3]);
  var p = pk(rng, [2, 3]);
  return {
    showWork: true,
    title: L({ es:'Tres puntos y cuatro reglas', en:'Three points and four rules' }),
    q: L({
      es:'La gráfica de una función pasa por los puntos (' + MIN + p + ', ' + (p * p + kk) + '), (0, ' + kk + ') y (' + p + ', ' + (p * p + kk) + '), y nunca toca el eje horizontal. ¿Cuál de estas reglas puede corresponder a esa gráfica?',
      en:'The graph of a function passes through the points (' + MIN + p + ', ' + (p * p + kk) + '), (0, ' + kk + ') and (' + p + ', ' + (p * p + kk) + '), and never touches the horizontal axis. Which of these rules can match that graph?'
    }),
    options: [
      'f(x) = x' + SQ + ' + ' + kk,
      'f(x) = ' + linex(p, kk),
      'f(x) = x' + SQ + ' ' + MIN + ' ' + kk,
      'f(x) = ' + kk + ' ' + MIN + ' x' + SQ
    ],
    correct: 0,
    hint: L({
      es:'Prueba cada regla en las tres entradas dadas y descarta en cuanto una salida no coincida. Fíjate también en que dos entradas opuestas comparten salida.',
      en:'Test each rule at the three given inputs and discard as soon as one output disagrees. Notice too that two opposite inputs share an output.'
    }),
    exp: L({
      es:'Que las entradas ' + MIN + p + ' y ' + p + ' den la misma salida descarta cualquier regla lineal, porque una recta nunca repite salida. De las tres reglas cuadráticas, solo la primera pasa por (0, ' + kk + ') y se mantiene siempre por encima del eje horizontal.',
      en:'The inputs ' + MIN + p + ' and ' + p + ' giving the same output rules out any linear rule, because a straight line never repeats an output. Of the three quadratic rules, only the first passes through (0, ' + kk + ') and stays above the horizontal axis at all times.'
    })
  };
}

/* ══════════════════════════════════════════════════════════════════════════
   BUILD LESSON :: concepto -> manipulativo -> problema
   ══════════════════════════════════════════════════════════════════════════ */
function buildLesson(rng){
  injectGuideCSS();
  GW_DRAWS = [];

  /* ── Apertura ── */
  sec(
    L({ es:'Punto de partida', en:'Starting point' }),
    L({ es:'Una entrada, una salida, cuatro maneras de contarlo', en:'One input, one output, four ways of telling it' }),
    '<p>' + L({
      es:'El precio que marca una bomba de gasolina depende de los litros que ya pasaron. La altura del agua en un tinaco depende del minuto en que se mire. En los dos casos hay una cantidad que se elige y otra que queda determinada por ella, sin margen de duda. Esa dependencia sin ambigüedad es lo que en matemáticas se llama función.',
      en:'The price shown by a petrol pump depends on the litres that have already gone through. The height of the water in a tank depends on the minute at which you look. In both cases there is a quantity that is chosen and another that is determined by it, with no room for doubt. That unambiguous dependence is what mathematics calls a function.'
    }) + '</p>' +
    '<p>' + L({
      es:'En esta guía vas a operar una máquina que aplica una regla fija, vas a bloquear los valores que una regla no puede procesar, vas a unir tablas con expresiones algebraicas y vas a colocar una parábola encima de otra hasta que coincidan. Todo eso prepara el terreno del cálculo, donde lo que se estudia ya no es un valor aislado sino cómo cambia una función.',
      en:'In this guide you will operate a machine that applies a fixed rule, you will block the values a rule cannot process, you will join tables with algebraic expressions and you will place one parabola on top of another until they coincide. All of that prepares the ground for calculus, where what is studied is no longer an isolated value but how a function changes.'
    }) + '</p>' +
    '<div class="callout"><p><strong>' + L({ es:'Idea clave: ', en:'Key idea: ' }) + '</strong>' + L({
      es:'una función real es una regla que asigna a cada número admisible un solo resultado. Las cuatro representaciones que verás, verbal, tabular, gráfica y algebraica, hablan siempre de la misma correspondencia y cada una muestra algo que las otras esconden.',
      en:'a real function is a rule that assigns to each admissible number exactly one result. The four representations you will see, verbal, tabular, graphical and algebraic, always speak of the same correspondence and each one shows something the others hide.'
    }) + '</p></div>'
  );

  /* ══ CONCEPTO 1 ══ */
  var s1 = sec(
    L({ es:'Concepto 1', en:'Concept 1' }),
    L({ es:'La regla y la imagen única', en:'The rule and the single image' }),
    '<p>' + L({
      es:'Una función real f toma un número x del conjunto de entradas admisibles y le asigna un número f(x). La notación se lee como el valor que f devuelve para esa entrada, y el orden importa: x es la variable independiente porque se elige libremente, mientras que f(x) es la dependiente porque queda fijada por la regla.',
      en:'A real function f takes a number x from the set of admissible inputs and assigns to it a number f(x). The notation reads as the value f returns for that input, and the order matters: x is the independent variable because it is chosen freely, while f(x) is the dependent one because it is fixed by the rule.'
    }) + '</p>' +
    '<p>' + L({
      es:'La condición que distingue a una función de cualquier otra correspondencia es la unicidad: una misma entrada no puede tener dos salidas. Nada impide, en cambio, que dos entradas distintas compartan la misma salida. En una gráfica esa condición se comprueba con la recta vertical: si alguna vertical corta la curva en más de un punto, la curva no representa una función.',
      en:'The condition that tells a function apart from any other correspondence is uniqueness: one and the same input cannot have two outputs. Nothing prevents, on the other hand, two different inputs from sharing the same output. On a graph that condition is tested with the vertical line: if any vertical cuts the curve at more than one point, the curve does not represent a function.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Variable independiente', en:'Independent variable' }), 'x', L({ es:'el valor que se elige y entra a la regla', en:'the value that is chosen and goes into the rule' })) +
      rcard(L({ es:'Variable dependiente', en:'Dependent variable' }), 'f(x)', L({ es:'el resultado que la regla devuelve', en:'the result the rule returns' })) +
      rcard(L({ es:'Unicidad', en:'Uniqueness' }), L({ es:'una salida por entrada', en:'one output per input' }), L({ es:'dos entradas sí pueden compartir salida', en:'two inputs may share an output' })) +
      rcard(L({ es:'Prueba vertical', en:'Vertical test' }), L({ es:'un corte como máximo', en:'one cut at most' }), L({ es:'se aplica sobre el registro gráfico', en:'applied on the graphical register' })) +
    '</div>' +
    '<div class="callout"><p>' + L({
      es:'En la máquina que sigue la regla está fija y la entrada la eliges tú. Antes de buscar la salida pedida, mueve la entrada de extremo a extremo y observa en qué sentido corre el punto verde.',
      en:'In the machine below the rule is fixed and the input is yours to choose. Before hunting for the requested output, move the input from end to end and watch which way the green dot runs.'
    }) + '</p></div>'
  );
  wMachine(rng, widgetHost(s1, 'wMach', 'machine'));
  addProblem(rng, mkP1(rng));
  addProblem(rng, mkP2(rng));

  /* ══ CONCEPTO 2 ══ */
  var s2 = sec(
    L({ es:'Concepto 2', en:'Concept 2' }),
    L({ es:'Dominio y rango: qué entra y qué sale', en:'Domain and range: what goes in and what comes out' }),
    '<p>' + L({
      es:'El dominio es el conjunto de entradas que la regla puede procesar y el rango es el conjunto de salidas que llega a producir. Cuando una función se define solo con su expresión algebraica, se toma como dominio el mayor conjunto de números reales para el que la expresión tiene sentido, y eso se llama dominio natural.',
      en:'The domain is the set of inputs the rule can process and the range is the set of outputs it manages to produce. When a function is defined only by its algebraic expression, the domain taken is the largest set of real numbers for which the expression makes sense, and that is called the natural domain.'
    }) + '</p>' +
    '<p>' + L({
      es:'Dos situaciones dejan valores fuera. Un cociente pierde sentido donde el denominador se anula, porque no existe la división entre cero. Una raíz cuadrada real pierde sentido donde el radicando es negativo, aunque el valor que lo deja en cero sí pertenece al dominio. Cuando la función modela una situación concreta, el contexto puede recortar todavía más ese conjunto.',
      en:'Two situations leave values out. A quotient loses its meaning where the denominator vanishes, because division by zero does not exist. A real square root loses its meaning where the radicand is negative, although the value leaving it at zero does belong to the domain. When the function models a concrete situation, the context can trim that set even further.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Dominio', en:'Domain' }), L({ es:'entradas admisibles', en:'admissible inputs' }), L({ es:'se lee sobre el eje horizontal', en:'read on the horizontal axis' })) +
      rcard(L({ es:'Rango', en:'Range' }), L({ es:'salidas alcanzadas', en:'outputs reached' }), L({ es:'se lee sobre el eje vertical', en:'read on the vertical axis' })) +
      rcard(L({ es:'Cociente', en:'Quotient' }), L({ es:'denominador distinto de cero', en:'denominator other than zero' }), L({ es:'el numerador no restringe nada', en:'the numerator restricts nothing' })) +
      rcard(L({ es:'Raíz cuadrada', en:'Square root' }), L({ es:'radicando no negativo', en:'radicand not negative' }), L({ es:'el extremo sí pertenece al dominio', en:'the endpoint does belong to the domain' })) +
    '</div>' +
    '<div class="callout"><p>' + L({
      es:'En el filtro que sigue cada ficha es un candidato a entrar. Sustituye mentalmente el valor en la regla antes de bloquearlo, y fíjate en cuántas fichas caen de golpe cuando aparece una raíz.',
      en:'In the filter below each chip is a candidate for entry. Substitute the value into the rule in your head before blocking it, and notice how many chips fall at once when a root appears.'
    }) + '</p></div>'
  );
  wDomain(rng, widgetHost(s2, 'wDom', 'domain'));
  addProblem(rng, mkP3(rng));
  addProblem(rng, mkP4(rng));

  /* ══ CONCEPTO 3 ══ */
  var s3 = sec(
    L({ es:'Concepto 3', en:'Concept 3' }),
    L({ es:'La misma función en cuatro registros', en:'The same function in four registers' }),
    '<p>' + L({
      es:'Una función se puede presentar con palabras, con una tabla de valores, con una gráfica o con una expresión algebraica. Los cuatro registros describen la misma correspondencia, pero no muestran lo mismo: la tabla exhibe casos concretos, la gráfica revela la forma global, la expresión permite calcular cualquier caso y el enunciado verbal explica de dónde viene la relación.',
      en:'A function can be presented with words, with a table of values, with a graph or with an algebraic expression. The four registers describe the same correspondence, but they do not show the same thing: the table exhibits specific cases, the graph reveals the global shape, the expression allows any case to be computed and the verbal statement explains where the relation comes from.'
    }) + '</p>' +
    '<p>' + L({
      es:'Pasar de un registro a otro es la maniobra central de este curso. De una tabla con entradas separadas por una unidad se reconoce una función lineal cuando las diferencias entre salidas consecutivas se mantienen constantes; si esas diferencias cambian, la relación no puede ser lineal. La salida que corresponde a la entrada cero es el término independiente y aparece en la gráfica como el corte con el eje vertical.',
      en:'Moving from one register to another is the central manoeuvre of this course. From a table with inputs one unit apart, a linear function is recognised when the differences between consecutive outputs stay constant; if those differences change, the relation cannot be linear. The output for the input zero is the independent term and appears on the graph as the cut with the vertical axis.'
    }) + '</p>' +
    '<div class="callout"><p>' + L({
      es:'En el traductor que sigue tienes cuatro tablas y cuatro expresiones. Empieza por comparar la primera casilla de cada tabla y deja para el final las dos que se parecen entre sí.',
      en:'In the translator below you have four tables and four expressions. Start by comparing the first cell of each table and leave the two that resemble each other for last.'
    }) + '</p></div>'
  );
  wMatch(rng, widgetHost(s3, 'wMat', 'match'));
  addProblem(rng, mkP5(rng));
  addProblem(rng, mkP6(rng));

  /* ══ CONCEPTO 4 ══ */
  var s4 = sec(
    L({ es:'Concepto 4', en:'Concept 4' }),
    L({ es:'La función cuadrática y su forma de vértice', en:'The quadratic function and its vertex form' }),
    '<p>' + L({
      es:'Cuando la variable aparece elevada al cuadrado, la gráfica deja de ser recta y se convierte en una parábola. Escrita como f(x) = a(x ' + MIN + ' h)' + SQ + ' + k, la expresión entrega de golpe tres datos: el signo de a dice hacia dónde abren las ramas, el tamaño de a dice qué tan cerrada es la curva, y el par (h, k) es el vértice.',
      en:'When the variable appears squared, the graph stops being straight and becomes a parabola. Written as f(x) = a(x ' + MIN + ' h)' + SQ + ' + k, the expression delivers three pieces of data at once: the sign of a says which way the branches open, the size of a says how narrow the curve is, and the pair (h, k) is the vertex.'
    }) + '</p>' +
    '<p>' + L({
      es:'El vértice es el punto extremo: mínimo si la parábola abre hacia arriba y máximo si abre hacia abajo, y su altura es justamente el extremo del rango. Además la curva es simétrica respecto a la vertical que pasa por el vértice, de modo que dos entradas situadas a la misma distancia de esa recta producen exactamente la misma salida. En la forma desarrollada esos datos están presentes, pero hay que despejarlos.',
      en:'The vertex is the extreme point: a minimum if the parabola opens upwards and a maximum if it opens downwards, and its height is precisely the end of the range. The curve is also symmetric about the vertical through the vertex, so two inputs at the same distance from that line produce exactly the same output. In the expanded form those data are present, but they have to be extracted.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Signo de a', en:'Sign of a' }), L({ es:'arriba o abajo', en:'up or down' }), L({ es:'decide si el vértice es mínimo o máximo', en:'decides whether the vertex is a minimum or a maximum' })) +
      rcard(L({ es:'Tamaño de a', en:'Size of a' }), L({ es:'abertura', en:'opening' }), L({ es:'a mayor tamaño, curva más cerrada', en:'the larger the size, the narrower the curve' })) +
      rcard(L({ es:'Vértice', en:'Vertex' }), '(h, k)', L({ es:'dentro del paréntesis el signo aparece cambiado', en:'inside the bracket the sign appears flipped' })) +
      rcard(L({ es:'Eje de simetría', en:'Axis of symmetry' }), L({ es:'vertical por el vértice', en:'vertical through the vertex' }), L({ es:'dos entradas simétricas dan la misma salida', en:'two symmetric inputs give the same output' })) +
    '</div>' +
    '<div class="callout"><p>' + L({
      es:'En el ajuste que sigue la curva dorada es el objetivo. Mueve un solo control a la vez y observa cuál de ellos desplaza el vértice y cuál cambia la abertura sin moverlo.',
      en:'In the tuning below the gold curve is the target. Move one control at a time and watch which of them shifts the vertex and which changes the opening without moving it.'
    }) + '</p></div>'
  );
  wPara(rng, widgetHost(s4, 'wPar', 'parabola'));
  addProblem(rng, mkP7(rng));
  addProblem(rng, mkP8(rng));

  /* ══ CONCEPTO 5 ══ */
  sec(
    L({ es:'Concepto 5', en:'Concept 5' }),
    L({ es:'Funciones definidas por partes', en:'Functions defined piecewise' }),
    '<p>' + L({
      es:'No toda función se describe con una sola expresión. Una tarifa que cambia después de cierto consumo, o un trayecto que primero acelera y luego mantiene la velocidad, se modelan repartiendo el dominio en tramos y dando una regla para cada tramo. La función sigue siendo una sola y sigue asignando una única salida a cada entrada.',
      en:'Not every function is described by a single expression. A tariff that changes after a certain consumption, or a journey that first accelerates and then holds its speed, are modelled by splitting the domain into pieces and giving a rule for each piece. The function is still one function and still assigns a single output to each input.'
    }) + '</p>' +
    '<p>' + L({
      es:'Al evaluar, el primer paso no es calcular sino decidir en qué tramo cae la entrada, y ahí las desigualdades hay que leerlas con cuidado. Un símbolo estricto deja el extremo fuera de su tramo, mientras que uno que admite la igualdad lo incluye. El valor de frontera pertenece a un solo tramo, y ese detalle es el que decide el resultado.',
      en:'When evaluating, the first step is not to calculate but to decide which piece the input falls into, and there the inequalities have to be read carefully. A strict symbol leaves the endpoint out of its piece, while one that admits equality includes it. The boundary value belongs to a single piece, and that detail is what decides the result.'
    }) + '</p>'
  );
  addProblem(rng, mkP9(rng));

  /* ══ CIERRE ══ */
  var s6 = sec(
    L({ es:'Cierre', en:'Closing' }),
    L({ es:'Leer una función completa', en:'Reading a whole function' }),
    '<p>' + L({
      es:'Analizar una función real es responder siempre las mismas preguntas: qué entradas admite, qué salidas alcanza, cómo se ve su gráfica y qué representa cada número de su expresión. Cuando la función modela una situación, hay una pregunta más, y es la que suele decidir el resultado: qué entradas tienen sentido en ese contexto, aunque la expresión algebraica pudiera aceptar muchas otras.',
      en:'Analysing a real function means answering the same questions every time: which inputs it admits, which outputs it reaches, how its graph looks and what each number of its expression represents. When the function models a situation, there is one more question, and it is usually the one that decides the result: which inputs make sense in that context, even if the algebraic expression could accept many others.'
    }) + '</p>'
  );
  wReflect(rng, widgetHost(s6, 'wRef', 'reflect'));
  addProblem(rng, mkP10(rng));
}
</script>

    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
