<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comparación de Conjuntos de Datos mediante Medidas Estadísticas</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Comparación de Conjuntos de Datos mediante Medidas Estadísticas</div>
    <div class="wcourse" id="wcourse-el">Matemáticas · 3° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Comparación de Conjuntos de Datos mediante Medidas Estadísticas</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="sbtn" id="dlBtn" onclick="generatePDF()" style="max-width:280px;margin:0 auto;">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   CENTRALIZED SCHOOL CONFIG (Rule 16) — ships UNBRANDED (Rule 11).
   The ONLY rebranding point. build_all.py substitutes these exact fields
   (BRAND_FIELDS / RGB_FIELDS / logo*) downstream; :root/dark stay as fallback.
   Neutral defaults below == the static :root/dark values, so unbranded == no-op.
   ══════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:'#cc243c', primaryDark:'#480b14', primaryBg:'#f6e7e9',
  accent:'#fc0c24', accentBg:'#ffdbdf',
  darkPrimary:'#c74255', darkPrimaryDark:'#e87283', darkPrimaryBg:'#3b0b12',

  document.getElementById('restoreBar').style.display = 'none';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = currentAttempt(name, group);
  buildLesson(seededRng(name + group + att));
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
  saved.choices.forEach(function(choice, idx) {

    if (saved.texts) {
      saved.texts.forEach(function(text, i) {

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

    doc.setFontSize(7.5); var exLines = doc.splitTextToSize('Solución: '+expRaw, TW-18).slice(0,4);
    var ansBoxH = 8 + chLines.length*5.5 + coLines.length*5 + exLines.length*5 + 6;

  // ── Footer on every page ──

  for (var p = 1; p <= pages; p++) {

    doc.setFillColor(pAR,pAG,pAB); doc.rect(0, PH-3, PW, 3, 'F');
    doc.setTextColor(130,140,160); doc.setFontSize(6.5); doc.setFont('helvetica','normal');
    doc.text(name+'  ·  '+group+'  ·  Código: '+code+'  ·  Página '+p+'/'+pages,

  doc.save('mat3_t09_g01_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf');
  btn.innerHTML = '⬇ &nbsp;Descargar Resultados PDF';

/* ================================================
   buildLesson — OVERRIDE IN EACH GUIDE
   ================================================ */
function buildLesson(rng) {
  var ES   = (LANG === 'es');
  var host = document.getElementById('lessonBody');
  problems.length = 0;
  host.innerHTML = '';
  injectWidgetCSS();

  /* ───────── micro helpers ───────── */
  function T(a, b) { return ES ? a : b; }
  function R(lo, hi) { return lo + Math.floor(rng() * (hi - lo + 1)); }
  function sm(a) { var s = 0, i; for (i = 0; i < a.length; i++) s += a[i]; return s; }
  function mn(a) { return sm(a) / a.length; }
  function srt(a) { return a.slice().sort(function (x, y) { return x - y; }); }
  function med(a) { var s = srt(a), n = s.length; return n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2; }
  function moda(a) { var c = {}, best = a[0], bc = 0, i; for (i = 0; i < a.length; i++) { c[a[i]] = (c[a[i]] || 0) + 1; } for (i = 0; i < a.length; i++) { if (c[a[i]] > bc) { bc = c[a[i]]; best = a[i]; } } return best; }
  function rgo(a) { return Math.max.apply(null, a) - Math.min.apply(null, a); }
  function dsv(a) { var m = mn(a), s = 0, i; for (i = 0; i < a.length; i++) { s += Math.abs(a[i] - m); } return s / a.length; }
  function rd(x) { return Math.round(x * 100) / 100; }
  function fmt(x) { var v = rd(x); var s = String(v === 0 ? 0 : v); return s.charAt(0) === '-' ? '−' + s.slice(1) : s; }
  function lst(a) { return a.map(fmt).join(', '); }
  function frac(n, d) { return ' <span class="mf-outer"><span class="mf-num">' + n + '</span><span class="mf-den">' + d + '</span></span> '; }
  function metric(l, v, c) { return '<div class="metric"><div class="mlbl">' + l + '</div><div class="mnum ' + (c || '') + '">' + v + '</div></div>'; }
  function rcard(n, f, note) { return '<div class="rcard"><div class="rname">' + n + '</div><div class="rform">' + f + '</div><div class="rnote">' + note + '</div></div>'; }

  function sec(tag, title, html) {
    var d = document.createElement('div');
    d.className = 'section';
    d.innerHTML = '<div class="stag">' + tag + '</div><h2>' + title + '</h2>' + html;
    host.appendChild(d);
  }
  function widgetBox(id, kind) {
    var w = document.createElement('div');
    w.className = 'iwcard section';
    w.id = id;
    w.setAttribute('data-widget', kind);
    host.appendChild(w);
    return w;
  }
  function injectWidgetCSS() {
    if (document.getElementById('lxWidgetCss')) return;
    var s = document.createElement('style');
    s.id = 'lxWidgetCss';
    s.textContent =
      '.iwcard{background:var(--surface);border:1.5px solid var(--border);border-radius:12px;padding:1.1rem;overflow-wrap:break-word}' +
      '.iw-tag{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:.4rem}' +
      '.iw-sub{font-size:.86rem;color:var(--text2);margin-bottom:.8rem}' +
      '.iw-fb{font-size:.84rem;margin-top:.75rem;min-height:1.4rem;color:var(--text2)}' +
      '.iw-ok{color:var(--ok);font-weight:700}' +
      '.dotline{position:relative;height:76px;margin:.7rem 0 3.1rem;border-bottom:2px solid var(--border)}' +
      '.dotpt{position:absolute;width:14px;height:14px;border-radius:50%;background:var(--green);transform:translateX(-50%);transition:left .2s}' +
      '.dotpt.alt{background:var(--gold)}' +
      '.axlbl{position:absolute;top:100%;margin-top:.2rem;font-size:.66rem;color:var(--text3);transform:translateX(-50%);font-family:"IBM Plex Mono",monospace}' +
      '.fulc{position:absolute;bottom:-10px;width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:12px solid var(--gold);transform:translateX(-50%);transition:left .2s}' +
      '.fulclbl{position:absolute;bottom:-32px;font-size:.68rem;font-weight:700;color:var(--gold);transform:translateX(-50%);white-space:nowrap;transition:left .2s}' +
      '.vrow{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center;margin:.9rem 0}' +
      '.vchip{display:flex;flex-direction:column;align-items:center;gap:.25rem;background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:.35rem}' +
      '.vnum{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:.95rem}' +
      '.vbtn{width:46px;height:32px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text2);cursor:pointer;font-size:.95rem;font-family:inherit}' +
      '.dchips{display:flex;flex-wrap:wrap;gap:.45rem;margin:.8rem 0}' +
      '.dchip{min-width:54px;min-height:44px;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--border);border-radius:9px;background:var(--surface2);font-family:"IBM Plex Mono",monospace;font-size:.9rem;cursor:pointer;transition:all .14s}' +
      '.dchip.sel{border-color:var(--gold);background:var(--gold-bg)}' +
      '.dchip.mid{border-color:var(--ok);background:var(--ok-bg);color:var(--ok);font-weight:700}' +
      '.binrow{display:flex;flex-wrap:wrap;gap:.45rem;margin:.8rem 0}' +
      '.binbtn{min-height:44px;border:1.5px solid var(--border);border-radius:9px;background:var(--surface2);color:var(--text2);padding:.45rem .8rem;font-size:.82rem;font-family:inherit;cursor:pointer}' +
      '.binbtn:hover{border-color:var(--green);color:var(--green)}' +
      '.clscard{background:var(--green-bg);border-radius:10px;padding:.9rem;text-align:center;font-weight:600;font-size:.92rem;margin:.7rem 0}' +
      '.wprog{font-family:"IBM Plex Mono",monospace;font-size:.72rem;color:var(--text3);text-align:right}' +
      '.sldbox{margin:.9rem 0}' +
      '.sldbox input[type=range]{width:100%;accent-color:var(--green);height:34px}' +
      '.iwcard .rbtn{min-height:44px}' +
      '.iwcard .metrics{margin-top:.6rem}';
    document.head.appendChild(s);
  }
  function opts4(correct, cands) {
    var out = [fmt(Math.round(correct))], i, s;
    for (i = 0; i < cands.length && out.length < 4; i++) {
      s = fmt(Math.round(cands[i]));
      if (out.indexOf(s) < 0) out.push(s);
    }
    var d = 1;
    while (out.length < 4 && d < 80) {
      s = fmt(Math.round(correct) + d);
      if (out.indexOf(s) < 0) out.push(s);
      if (out.length < 4) {
        s = fmt(Math.round(correct) - d);
        if (out.indexOf(s) < 0) out.push(s);
      }
      d++;
    }
    return { options: out, correct: out[0] };
  }
  function addP(spec) {
    var shuffled = shuffle(spec.options, rng);
    var p = {
      title: spec.title,
      questionText: spec.q,
      fn: spec.fn || '',
      hint: spec.hint || '',
      explanation: spec.exp || '',
      options: shuffled,
      correctIdx: shuffled.indexOf(spec.correct),
      showWork: !!spec.showWork,
      studentChoice: null,
      pendingChoice: null
    };
    problems.push(p);
    buildOneCard(p, problems.length - 1);
  }

  /* ───────── data builders ───────── */
  function set5(lo, hi) {                       /* 5 enteros cuya media es entera */
    var a = [], i, last;
    for (i = 0; i < 4; i++) a.push(R(lo, hi));
    last = R(lo, hi);
    last += (5 - ((sm(a) + last) % 5)) % 5;
    if (last > hi) last -= 5;
    a.push(last);
    return a;
  }
  var TIGHT = [[-4, -1, 0, 1, 4], [-3, -2, 0, 2, 3]];                      /* desviación media 2 */
  var WIDE  = [[-6, -4, 0, 4, 6], [-8, -2, 0, 2, 8], [-7, -3, 0, 3, 7]];   /* desviación media 4 */
  var HUGE  = [[-9, -6, 0, 6, 9]];                                         /* desviación media 6 */
  function fromDev(m, dev) { return shuffle(dev.map(function (d) { return m + d; }), rng); }

  /* ═════════ WIDGET 1: balanza de la media ═════════ */
  function widgetBalance() {
    var v = [], i;
    for (i = 0; i < 5; i++) v.push(R(5, 17));
    var tgt = Math.round(mn(v)) + (rng() < 0.5 ? 2 : -2);
    if (tgt < 7) tgt = 7;
    if (tgt > 15) tgt = 15;
    var LO = 0, HI = 24;
    var st = { v: v, tries: 0, done: false };
    var w = widgetBox('wBalance', 'balance');
    function pos(x) { var p = (x - LO) / (HI - LO) * 100; return Math.max(3, Math.min(97, p)); }
    function sol() {
      var need = 5 * tgt - (st.v[0] + st.v[1] + st.v[2] + st.v[3]), c, b, r, o, j;
      if (need >= 1 && need <= HI) { c = st.v.slice(); c[4] = need; return c; }
      b = Math.floor(tgt); r = 5 * tgt - b * 5; o = [b, b, b, b, b];
      for (j = 0; j < r; j++) o[j] += 1;
      return o;
    }
    function render() {
      var m = mn(st.v), i2, dots = '', ctrl = '', fb;
      for (i2 = 0; i2 < st.v.length; i2++) {
        dots += '<div class="dotpt" style="left:' + pos(st.v[i2]) + '%;bottom:' + (5 + i2 * 12) + 'px"></div>';
        ctrl += '<div class="vchip"><button class="vbtn" onclick="wbStep(' + i2 + ',1)">+</button>' +
                '<span class="vnum">' + st.v[i2] + '</span>' +
                '<button class="vbtn" onclick="wbStep(' + i2 + ',-1)">−</button></div>';
      }
      var axis = '<div class="axlbl" style="left:' + pos(LO) + '%">' + LO + '</div>' +
                 '<div class="axlbl" style="left:' + pos(12) + '%">12</div>' +
                 '<div class="axlbl" style="left:' + pos(HI) + '%">' + HI + '</div>';
      if (Math.abs(m - tgt) < 1e-9) {
        fb = '<span class="iw-ok">' + T('Equilibrada: el punto de apoyo cayó justo en ' + tgt + '.', 'Balanced: the pivot landed right on ' + tgt + '.') + '</span>';
      } else if (m > tgt) {
        fb = T('El punto de apoyo quedó a la derecha de ' + tgt + '. Baja alguno de los datos.', 'The pivot sits to the right of ' + tgt + '. Lower one of the values.');
      } else {
        fb = T('El punto de apoyo quedó a la izquierda de ' + tgt + '. Sube alguno de los datos.', 'The pivot sits to the left of ' + tgt + '. Raise one of the values.');
      }
      w.innerHTML =
        '<div class="iw-tag">' + T('Balanza de datos', 'Data balance') + '</div>' +
        '<div class="iw-sub">' + T('Cada punto es un dato y el triángulo es el punto de apoyo de la balanza. Mueve los datos hasta que ese punto quede exactamente en ' + tgt + '.', 'Each dot is a value and the triangle is the balance pivot. Move the values until that pivot sits exactly on ' + tgt + '.') + '</div>' +
        '<div class="dotline">' + dots + axis +
          '<div class="fulc" style="left:' + pos(m) + '%"></div>' +
          '<div class="fulclbl" style="left:' + pos(m) + '%">' + T('media ', 'mean ') + fmt(m) + '</div>' +
        '</div>' +
        '<div class="vrow">' + ctrl + '</div>' +
        '<div class="metrics">' + metric(T('Media', 'Mean'), fmt(m), 'cs') + metric(T('Objetivo', 'Target'), tgt, 'ps') + metric(T('Suma', 'Total'), sm(st.v), 'ts') + '</div>' +
        '<div style="margin-top:.9rem"><button class="rbtn rbtn-yes" onclick="wbCheck()">' + T('Verificar', 'Check') + '</button></div>' +
        '<div class="iw-fb" id="wbFb">' + fb + '</div>';
    }
    window.wbStep = function (idx, d) {
      if (st.done) return;
      var nv = st.v[idx] + d;
      if (nv < 1 || nv > HI) return;
      st.v[idx] = nv;
      render();
    };
    window.wbCheck = function () {
      if (st.done) return;
      var m = mn(st.v);
      if (Math.abs(m - tgt) < 1e-9) {
        st.done = true; render();
        document.getElementById('wbFb').innerHTML = '<span class="iw-ok">' +
          T('Lo lograste. La suma vale ' + sm(st.v) + ' y al repartirla entre 5 datos la media es ' + tgt + '.',
            'You did it. The total is ' + sm(st.v) + ' and shared among 5 values the mean is ' + tgt + '.') + '</span>';
        return;
      }
      st.tries++;
      if (st.tries >= 3) {
        st.v = sol(); st.done = true; render();
        document.getElementById('wbFb').innerHTML =
          T('Así queda equilibrada: con 5 datos y media ' + tgt + ', la suma tiene que valer ' + (5 * tgt) + '.',
            'Here is the balanced setup: with 5 values and mean ' + tgt + ', the total has to be ' + (5 * tgt) + '.');
        return;
      }
      render();
    };
    render();
  }

  /* ═════════ WIDGET 2: ordenar para hallar la mediana ═════════ */
  function widgetMedian() {
    var base = [], i;
    for (i = 0; i < 8; i++) base.push(R(12, 46));
    var st = { a: shuffle(base, rng), sel: null, tries: 0, done: false };
    var w = widgetBox('wMedian', 'order');
    function sorted(x) { var k; for (k = 1; k < x.length; k++) { if (x[k] < x[k - 1]) return false; } return true; }
    function firstBad(x) { var k; for (k = 1; k < x.length; k++) { if (x[k] < x[k - 1]) return k; } return 1; }
    if (sorted(st.a)) st.a.reverse();
    function render(msg) {
      var ok = sorted(st.a), i2, chips = '', fb;
      for (i2 = 0; i2 < st.a.length; i2++) {
        chips += '<div class="dchip' + (st.sel === i2 ? ' sel' : '') + (ok && (i2 === 3 || i2 === 4) ? ' mid' : '') +
                 '" onclick="wmTap(' + i2 + ')">' + st.a[i2] + '</div>';
      }
      fb = msg || (ok
        ? '<span class="iw-ok">' + T('Ya está ordenado. Los dos datos centrales son ' + st.a[3] + ' y ' + st.a[4] + ', y su promedio marca la mediana.',
                                     'It is sorted now. The two central values are ' + st.a[3] + ' and ' + st.a[4] + ', and their average marks the median.') + '</span>'
        : T('Aún hay datos fuera de lugar: mira la casilla ' + (firstBad(st.a) + 1) + ', guarda un valor menor que el de su izquierda.',
            'Some values are still out of place: look at slot ' + (firstBad(st.a) + 1) + ', it holds a value smaller than the one on its left.'));
      w.innerHTML =
        '<div class="iw-tag">' + T('Ordena y encuentra el centro', 'Sort and find the center') + '</div>' +
        '<div class="iw-sub">' + T('Toca dos casillas para intercambiarlas y deja los ocho tiempos de menor a mayor. El centro se ilumina solo cuando la fila queda en orden.',

        '<div class="dchips">' + chips + '</div>' +

                                  metric(T('Menor', 'Lowest'), Math.min.apply(null, st.a), 'ts') +

    window.wmTap = function (i2) {

      if (st.done) return;

                                          'Correct. With eight values the center falls between the fourth and the fifth, and the median is ' + fmt((st.a[3] + st.a[4]) / 2) + '.') + '</span>');

  /* ═════════ WIDGET 3: deslizador de dispersión ═════════ */
  function widgetSpread() {
    var m = R(10, 16);
    var dev = [-3, -1, 0, 1, 3];
    var kt = 2 + Math.floor(rng() * 4);
    var st = { k: 1, tries: 0, done: false };
    var w = widgetBox('wSpread', 'slider');
    var LO = m - 16, HI = m + 16;
    function pos(x) { var p = (x - LO) / (HI - LO) * 100; return Math.max(3, Math.min(97, p)); }
    function mk(k) { return dev.map(function (d) { return m + k * d; }); }
    var target = rd(1.6 * kt);
    w.innerHTML =
      '<div class="iw-tag">' + T('Estira la dispersión', 'Stretch the spread') + '</div>' +
      '<div class="iw-sub">' + T('Los puntos verdes son el conjunto A y los dorados el conjunto B. Los dos guardan la misma media: mueve el control hasta que la desviación media de B valga ' + fmt(target) + '.',
                                 'The green dots are set A and the gold ones set B. Both keep the same mean: move the control until the mean deviation of B is ' + fmt(target) + '.') + '</div>' +
      '<div class="dotline" id="wsDots"></div>' +
      '<div class="sldbox"><input type="range" min="1" max="5" step="1" value="1" oninput="wsSet(this.value)" id="wsRange"></div>' +
      '<div class="metrics" id="wsM"></div>' +
      '<div style="margin-top:.9rem"><button class="rbtn rbtn-yes" onclick="wsCheck()">' + T('Verificar', 'Check') + '</button></div>' +
      '<div class="iw-fb" id="wsFb"></div>';
    function paint(msg) {
      var A = mk(1), B = mk(st.k), i2, dots = '', dB = dsv(B), fb;
      for (i2 = 0; i2 < 5; i2++) dots += '<div class="dotpt" style="left:' + pos(A[i2]) + '%;bottom:8px"></div>';
      for (i2 = 0; i2 < 5; i2++) dots += '<div class="dotpt alt" style="left:' + pos(B[i2]) + '%;bottom:38px"></div>';
      dots += '<div class="axlbl" style="left:' + pos(m) + '%">' + T('media ', 'mean ') + m + '</div>';
      document.getElementById('wsDots').innerHTML = dots;
      document.getElementById('wsM').innerHTML =
        metric(T('Media de A', 'Mean of A'), m, 'cs') +
        metric(T('Media de B', 'Mean of B'), m, 'ps') +
        metric(T('Objetivo', 'Target'), fmt(target), 'ts') +
        metric(T('Desv. media A', 'Mean dev. A'), fmt(dsv(A)), 'cs') +
        metric(T('Desv. media B', 'Mean dev. B'), fmt(dB), 'ps') +
        metric(T('Rango de B', 'Range of B'), rgo(B), 'ts');
      if (msg) { document.getElementById('wsFb').innerHTML = msg; return; }
      if (Math.abs(dB - target) < 1e-9) {
        fb = '<span class="iw-ok">' + T('Justo ahí: B se aparta de su media exactamente ' + fmt(target) + ' en promedio.',
                                        'Right there: B sits exactly ' + fmt(target) + ' away from its mean on average.') + '</span>';
      } else if (dB > target) {
        fb = T('B quedó más disperso de lo pedido. Los puntos dorados están demasiado abiertos: cierra el control.',
               'B ended up more spread out than asked. The gold dots are too far apart: close the control.');
      } else {
        fb = T('B quedó más apretado de lo pedido. Los puntos dorados están demasiado juntos: abre el control.',
               'B ended up tighter than asked. The gold dots are too close together: open the control.');
      }
      document.getElementById('wsFb').innerHTML = fb;
    }
    window.wsSet = function (val) {
      if (st.done) return;
      st.k = parseInt(val, 10);
      paint('');
    };
    window.wsCheck = function () {
      if (st.done) return;
      var dB = dsv(mk(st.k));
      if (Math.abs(dB - target) < 1e-9) {
        st.done = true;
        paint('<span class="iw-ok">' + T('Correcto. La media no se movió ni un paso, pero el rango pasó de ' + rgo(mk(1)) + ' a ' + rgo(mk(st.k)) + ': dos conjuntos con el mismo centro pueden ser muy distintos.',
                                         'Correct. The mean never moved a step, yet the range went from ' + rgo(mk(1)) + ' to ' + rgo(mk(st.k)) + ': two sets with the same center can be very different.') + '</span>');
        return;
      }
      st.tries++;
      if (st.tries >= 3) {
        st.k = kt; st.done = true;
        document.getElementById('wsRange').value = kt;
        paint(T('Esta es la posición buscada: cada dato de B se aparta de la media ' + fmt(target) + ' en promedio, mientras que A solo se aparta ' + fmt(dsv(mk(1))) + '.',
                'This is the position we were after: each value of B sits ' + fmt(target) + ' from the mean on average, while A sits only ' + fmt(dsv(mk(1))) + ' away.'));
        return;
      }
      paint('');
    };
    paint('');
  }

  function p3() {
    var a = [], b = [], i, o, t;
    for (i = 0; i < 7; i++) a.push(R(28, 58));
    if (rng() < 0.5) {
      o = opts4(med(a), [mn(a), srt(a)[2], srt(a)[4], rgo(a)]);

  function p4() {
    var pool, c, d, arr, o;
    if (rng() < 0.5) {
      pool = shuffle([21, 22, 23, 24, 25, 26, 27, 28], rng);
      c = pool[0]; d = pool[1];
      arr = shuffle([c, c, c, d, d, pool[2], pool[3], pool[4]], rng);
      o = opts4(c, [med(arr), mn(arr), d, Math.max.apply(null, arr)]);
      return {
        title: T('Lo que más se vende', 'What sells most'), showWork: false,
        q: T('Una zapatería anotó el número de calzado de cada par vendido durante la mañana. Determina la moda del conjunto.',

        fn: 'A = {' + lst(arr) + '}',
        hint: T('Cuenta cuántas veces aparece cada número y quédate con el que se repite más veces.',

    }
    function build7(coincide) {
      var cc = R(19, 21), lows = shuffle([13, 14, 15, 16, 17], rng), highs = shuffle([24, 25, 26, 27, 28], rng);
      return shuffle(coincide ? [cc, cc, cc, lows[0], lows[1], highs[0], highs[1]]
                              : [cc, cc, cc, highs[0], highs[1], highs[2], highs[3]], rng);

  function p5() {

        title: T('Inviernos comparados', 'Winters compared'), showWork: true,

      '<p>' + T('Comparar dos grupos de datos casi nunca se resuelve con un solo número. Hacen falta dos miradas: dónde se ubica el centro de cada conjunto y qué tan parejos quedan los datos alrededor de ese centro.',
                'Comparing two groups of data is almost never settled by a single number. You need two views: where the center of each set sits, and how evenly the values gather around that center.') + '</p>' +
      '<div class="callout"><p>' + T('<strong>La media</strong> reparte el total en partes iguales entre todos los datos. Se comporta como el punto de apoyo de una balanza: si un dato se aleja hacia la derecha, el punto de apoyo se corre hacia ese lado.',
                                     '<strong>The mean</strong> shares the total equally among every value. It behaves like the pivot of a balance beam: when one value drifts to the right, the pivot slides that way.') + '</p></div>' +
      '<div class="rules-grid">' +
        rcard(T('Media', 'Mean'), 'x̄ = ' + frac(T('suma de los datos', 'sum of the values'), T('cantidad de datos', 'number of values')),
              T('Usa todos los datos, por eso un valor extremo la mueve.', 'It uses every value, which is why an extreme one moves it.')) +
        rcard(T('Suma total', 'Total'), T('suma = x̄ × n', 'total = x̄ × n'),
              T('Si conoces la media y cuántos datos hay, recuperas el total.', 'Knowing the mean and how many values there are gives the total back.')) +
      '</div>');
  widgetBalance();
  addP(p1());
  addP(p2());

  sec(T('Concepto 2', 'Concept 2'),
      T('El centro que resiste', 'The center that resists'),
      '<p>' + T('La mediana es el valor que queda en el centro cuando ordenas los datos de menor a mayor. Con una cantidad impar de datos hay un único centro; con una cantidad par, la mediana es el promedio de los dos datos centrales. La moda es el valor que más veces se repite.',
                'The median is the value left in the middle once you sort the data from lowest to highest. With an odd number of values there is a single center; with an even number, the median is the average of the two central values. The mode is the value that repeats the most.') + '</p>' +
      '<div class="callout"><p>' + T('Un dato muy alejado del resto arrastra a la media, pero apenas mueve a la mediana. Por eso, cuando comparas dos conjuntos y uno tiene un valor extremo, conviene mirar las dos medidas antes de decidir.',
                                     'A value far away from the rest drags the mean along, yet it barely moves the median. That is why, when two sets are compared and one holds an extreme value, it pays to read both measures before deciding.') + '</p></div>' +
      '<div class="rules-grid">' +
        rcard(T('Mediana', 'Median'), T('centro de la lista ordenada', 'center of the sorted list'),
              T('Con cantidad par se promedian los dos datos del centro.', 'With an even count the two middle values are averaged.')) +
        rcard(T('Moda', 'Mode'), T('el valor más repetido', 'the most repeated value'),
              T('Puede no existir, o haber más de una en un mismo conjunto.', 'It may not exist, or a set may hold more than one.')) +
      '</div>');
  widgetMedian();
  addP(p3());
  addP(p4());

  sec(T('Concepto 3', 'Concept 3'),
      T('Qué tan parejos son los datos', 'How even the values are'),
      '<p>' + T('Dos conjuntos pueden tener la misma media y aun así ser muy distintos: uno con datos apretados alrededor del centro y otro con datos muy abiertos. Las medidas de dispersión son las que retratan esa diferencia.',
                'Two sets can share the same mean and still be very different: one with values packed around the center and another with values thrown wide open. Dispersion measures are the ones that portray that difference.') + '</p>' +
      '<div class="callout"><p>' + T('El rango es rápido de obtener, pero solo mira dos datos: el mayor y el menor. La desviación media mira a todos, porque promedia la distancia de cada dato a la media del conjunto.',
                                     'The range is quick to get, but it looks at only two values: the highest and the lowest. The mean deviation looks at all of them, since it averages the distance from each value to the mean of the set.') + '</p></div>' +
      '<div class="rules-grid">' +
        rcard(T('Rango', 'Range'), T('rango = mayor − menor', 'range = highest − lowest'),
              T('Un solo dato extremo lo dispara por completo.', 'A single extreme value blows it up entirely.')) +
        rcard(T('Desviación media', 'Mean deviation'), 'DM = ' + frac(T('suma de distancias a la media', 'sum of distances to the mean'), T('cantidad de datos', 'number of values')),
              T('Mientras menor sea, más parejo es el conjunto.', 'The smaller it is, the more even the set.')) +
      '</div>');
  widgetSpread();
  addP(p5());
  addP(p6());

  sec(T('Concepto 4', 'Concept 4'),
      T('Decidir con las dos miradas', 'Deciding with both views'),
      '<p>' + T('Al comparar dos conjuntos, la medida que manda depende del criterio de la decisión. Si buscas resultados parejos y predecibles, pesa más la dispersión menor. Si buscas el mejor resultado típico, pesa más el centro mayor. Y si en el conjunto hay un dato extremo, la mediana retrata mejor al grupo que la media.',
                'When two sets are compared, the measure that rules depends on the criterion behind the decision. If you are after even, predictable results, the lower spread weighs more. If you are after the better typical result, the higher center weighs more. And if the set holds an extreme value, the median portrays the group better than the mean.') + '</p>' +
      '<div class="callout"><p>' + T('Una decisión bien argumentada nombra la medida que usó y explica por qué esa medida responde a lo que se necesita.',
                                     'A well argued decision names the measure it used and explains why that measure answers what is needed.') + '</p></div>');
  widgetClassify();
  widgetReflect();
  addP(p7());

  sec(T('Cierre', 'Wrap-up'),
      T('Casos para decidir', 'Cases to decide'),
      '<p>' + T('Resuelve los siguientes casos con lo que ya construiste.', 'Work through the following cases with what you have already built.') + '</p>');
  addP(p8());
  addP(p9());
  addP(p10());
}
</script>

<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbzLGV15JRTPs9bbSvHRLfgOXeT9oUExDf1AH546WOwq5tYxXSdhX212OWi_bTJfMGx9/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'Comparación de Conjuntos de Datos mediante Medidas Estadísticas';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
