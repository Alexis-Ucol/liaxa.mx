<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conversiones entre Múltiplos y Submúltiplos</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; text-align: justify; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Conversiones entre Múltiplos y Submúltiplos</div>
    <div class="wcourse" id="wcourse-el">Física · Segundo de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Conversiones entre Múltiplos y Submúltiplos</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="sbtn" id="dlBtn" onclick="generatePDF()" style="max-width:280px;margin:0 auto;">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   CENTRALIZED SCHOOL CONFIG (Rule 16) — ships UNBRANDED (Rule 11).
   The ONLY rebranding point. build_all.py substitutes these exact fields
   (BRAND_FIELDS / RGB_FIELDS / logo*) downstream; :root/dark stay as fallback.
   Neutral defaults below == the static :root/dark values, so unbranded == no-op.
   ══════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:'#cc243c', primaryDark:'#480b14', primaryBg:'#f6e7e9',
  accent:'#fc0c24', accentBg:'#ffdbdf',
  darkPrimary:'#c74255', darkPrimaryDark:'#e87283', darkPrimaryBg:'#3b0b12',

function saveSession() {

  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

    var u = URL.createObjectURL(b);

    if (!w) { window.location.href = u; }
    setTimeout(function(){ URL.revokeObjectURL(u); }, 60000);
  }

  var _isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
               (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  if (_isIOS) {
    var _pdfFile = new File([_pdfBlob], _fname, { type:'application/pdf' });
    if (navigator.canShare && navigator.canShare({ files:[_pdfFile] })) {
      navigator.share({ files:[_pdfFile], title:_fname })
        .then(_restorePdfBtn)
        .catch(function(e){
          if (e && e.name === 'AbortError') { _restorePdfBtn(); return; }
          _openPdfInline(_pdfBlob); _restorePdfBtn();
        });

    _openPdfInline(_pdfBlob); _restorePdfBtn();

  var _dlUrl = URL.createObjectURL(_pdfBlob);

  _dlA.href  = _dlUrl; _dlA.download = _fname;

  _restorePdfBtn();
}

/* devuelve 4 opciones distintas con la correcta en la posicion 0 */
function opts4(correct, cands){
  var out = [correct], i, k = 1;
  for (i = 0; i < cands.length && out.length < 4; i++){
    if (cands[i] === null || cands[i] === undefined) continue;
    if (out.indexOf(cands[i]) === -1) out.push(cands[i]);
  }
  while (out.length < 4){
    var alt = correct + k * 10;
    if (out.indexOf(alt) === -1) out.push(alt);
    k++;
  }
  return out;
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 1 :: clasificador de etiquetas
   Cada toque cambia el lado de la etiqueta y el conteo se actualiza al vuelo.
   ══════════════════════════════════════════════════════════════════════════ */
function wSort(rng, host){
  var pool = [
    { t:{es:'500 mg de paracetamol', en:'500 mg of paracetamol'}, k:'sub',  p:{es:'mili', en:'milli'} },
    { t:{es:'5 km de carrera', en:'a 5 km race'},                 k:'mult', p:{es:'kilo', en:'kilo'} },
    { t:{es:'30 cL de jugo', en:'30 cL of juice'},                k:'sub',  p:{es:'centi', en:'centi'} },
    { t:{es:'2 hL en la cisterna', en:'2 hL in the cistern'},     k:'mult', p:{es:'hecto', en:'hecto'} },
    { t:{es:'8 dm de tubo', en:'8 dm of pipe'},                   k:'sub',  p:{es:'deci', en:'deci'} },
    { t:{es:'12 dam de cuerda', en:'12 dam of rope'},             k:'mult', p:{es:'deca', en:'deca'} },
    { t:{es:'250 mL de leche', en:'250 mL of milk'},              k:'sub',  p:{es:'mili', en:'milli'} },
    { t:{es:'3 kg de arroz', en:'3 kg of rice'},                  k:'mult', p:{es:'kilo', en:'kilo'} }
  ];
  var items = shuffle(pool, rng).slice(0, 6);
  var st = items.map(function(){ return ''; });
  var tries = 0, closed = false;

  host.innerHTML =
    '<div class="gwh">' + L({es:'Clasificador de etiquetas', en:'Label sorter'}) + '</div>' +
    '<div class="gwtask">' + L({
      es:'Toca cada etiqueta hasta dejarla del lado que le toca: <b>múltiplo</b> si el prefijo agranda la unidad, <b>submúltiplo</b> si la achica.',
      en:'Tap each label until it sits on the right side: <b>multiple</b> if the prefix makes the unit bigger, <b>submultiple</b> if it makes it smaller.'
    }) + '</div>' +
    '<div class="chips" id="' + host.id + '_c"></div>' +
    '<div class="tally" id="' + host.id + '_t"></div>' +
    '<button class="gbtn" id="' + host.id + '_b">' + L({es:'Revisar la mesa', en:'Check the table'}) + '</button>' +
    '<div class="gmsg" id="' + host.id + '_m">' + L({es:'Todavía no colocas ninguna etiqueta.', en:'You have not placed any label yet.'}) + '</div>';

  var cw = document.getElementById(host.id + '_c');
  var tw = document.getElementById(host.id + '_t');
  var mw = document.getElementById(host.id + '_m');
  var bw = document.getElementById(host.id + '_b');

  function lbl(s){
    if (s === 'mult') return L({es:'agranda la unidad', en:'makes the unit bigger'});
    if (s === 'sub')  return L({es:'achica la unidad', en:'makes the unit smaller'});
    return L({es:'toca para colocar', en:'tap to place'});
  }
  function draw(){
    cw.innerHTML = '';
    items.forEach(function(it, i){
      var d = document.createElement('div');
      d.className = 'chip' + (st[i] ? ' ' + st[i] : '');
      d.innerHTML = '<span><strong>' + L(it.t) + '</strong></span><span class="cst">' + lbl(st[i]) + '</span>';
      if (!closed) d.addEventListener('click', function(){
        st[i] = (st[i] === '') ? 'mult' : (st[i] === 'mult' ? 'sub' : '');
        draw();
      });
      cw.appendChild(d);
    });
    var nm = 0, ns = 0;
    st.forEach(function(v){ if (v === 'mult') nm++; if (v === 'sub') ns++; });
    tw.textContent = L({es:'Múltiplos: ', en:'Multiples: '}) + nm + ' · ' +
                     L({es:'Submúltiplos: ', en:'Submultiples: '}) + ns + ' · ' +
                     L({es:'Sin colocar: ', en:'Unplaced: '}) + (items.length - nm - ns);
  }
  draw();

  bw.addEventListener('click', function(){
    if (closed) return;
    var wrong = [];
    items.forEach(function(it, i){ if (st[i] !== it.k) wrong.push(i); });
    if (wrong.length === 0){
      closed = true; draw();
      mw.className = 'gmsg ok';
      mw.innerHTML = L({
        es:'Las seis quedaron en su lugar. Kilo, hecto y deca empujan la unidad hacia arriba; deci, centi y mili la parten en pedazos.',
        en:'All six landed in place. Kilo, hecto and deca push the unit upwards; deci, centi and milli break it into pieces.'
      });
      bw.disabled = true;
      return;
    }
    tries++;
    if (tries >= 3){
      closed = true;
      items.forEach(function(it, i){ st[i] = it.k; });
      draw();
      mw.className = 'gmsg bad';
      mw.innerHTML = L({
        es:'Así quedan colocadas. La regla corta: kilo, hecto y deca multiplican la unidad; deci, centi y mili la dividen.',
        en:'This is how they line up. Short rule: kilo, hecto and deca multiply the unit; deci, centi and milli divide it.'
      });
      bw.disabled = true;
      return;
    }
    var i0 = wrong[0];
    mw.className = 'gmsg bad';
    mw.innerHTML = L({
      es:'Quedan ' + wrong.length + ' fuera de lugar. Empieza por el prefijo ' + L(items[i0].p) + ': ',
      en:'There are ' + wrong.length + ' out of place. Start with the prefix ' + L(items[i0].p) + ': '
    }) + (items[i0].k === 'mult'
      ? L({es:'junta varias unidades en una sola pieza.', en:'it bundles several units into one piece.'})
      : L({es:'parte la unidad en pedazos más chicos.', en:'it splits the unit into smaller pieces.'}));
    draw();
  });
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 2 :: escalera de prefijos, 3 rondas con números nuevos
   El valor se transforma en vivo con cada escalón y el mensaje dice
   hacia donde se movio el punto decimal.
   ══════════════════════════════════════════════════════════════════════════ */
var FAM = {
  len: { u:[['km',3],['hm',2],['dam',1],['m',0],['dm',-1],['cm',-2],['mm',-3]], n:{es:'longitud', en:'length'} },
  vol: { u:[['kL',3],['hL',2],['daL',1],['L',0],['dL',-1],['cL',-2],['mL',-3]], n:{es:'capacidad', en:'capacity'} },
  mas: { u:[['kg',3],['hg',2],['dag',1],['g',0],['dg',-1],['cg',-2],['mg',-3]], n:{es:'masa', en:'mass'} }
};
function wLadder(rng, host){
  var keys = ['len', 'vol', 'mas'];
  var round = 0, miss = 0, cur = 0, data = null, closed = false;

  function build(){
    var f = FAM[keys[Math.floor(rng() * 3)]];
    var a = ri(rng, 0, 6), b = ri(rng, 0, 6);
    while (b === a) b = ri(rng, 0, 6);
    return { f: f, start: a, target: b, val: ri(rng, 11, 98) / 10 };
  }
  function valAt(i){
    return parseFloat((data.val * Math.pow(10, data.f.u[data.start][1] - data.f.u[i][1])).toPrecision(12));
  }

  host.innerHTML =
    '<div class="gwh">' + L({es:'Escalera de prefijos', en:'Prefix ladder'}) + '</div>' +
    '<div class="gwtask" id="' + host.id + '_q"></div>' +
    '<div class="ladder" id="' + host.id + '_l"></div>' +
    '<div class="lnav">' +
      '<button class="gbtn alt" id="' + host.id + '_up">' + L({es:'subir a la unidad mayor', en:'step up to the bigger unit'}) + '</button>' +
      '<button class="gbtn alt" id="' + host.id + '_dn">' + L({es:'bajar a la unidad menor', en:'step down to the smaller unit'}) + '</button>' +
    '</div>' +
    '<div class="gmsg" id="' + host.id + '_m"></div>' +
    '<div class="gprog" id="' + host.id + '_p"></div>';

  var qw = document.getElementById(host.id + '_q');
  var lw = document.getElementById(host.id + '_l');
  var mw = document.getElementById(host.id + '_m');
  var pw = document.getElementById(host.id + '_p');
  var up = document.getElementById(host.id + '_up');
  var dn = document.getElementById(host.id + '_dn');

  function draw(){
    lw.innerHTML = data.f.u.map(function(u, i){
      var cls = 'lrow' + (i === cur ? ' cur' : '') + (i === data.target ? ' tgt' : '');
      var v = (i === cur) ? fmt(valAt(i)) : (i === data.target ? '?' : '');
      var tag = (i === data.target) ? L({es:'destino', en:'target'}) : (i === cur ? L({es:'aquí estás', en:'you are here'}) : '');
      return '<div class="' + cls + '"><span class="lu">' + u[0] + '</span><span class="lv">' + v + '</span><span class="ltag">' + tag + '</span></div>';
    }).join('');
    pw.textContent = L({es:'Reto ', en:'Challenge '}) + Math.min(round + 1, 3) + L({es:' de 3', en:' of 3'});
  }
  function render(){
    qw.innerHTML = L({
      es:'Lleva la medida de <b>' + fmt(data.val) + ' ' + data.f.u[data.start][0] + '</b> hasta la fila de <b>' + data.f.u[data.target][0] + '</b>, un escalón a la vez.',
      en:'Move the measurement of <b>' + fmt(data.val) + ' ' + data.f.u[data.start][0] + '</b> to the <b>' + data.f.u[data.target][0] + '</b> row, one step at a time.'
    });
    mw.className = 'gmsg';
    mw.innerHTML = L({es:'Cada escalón vale diez. Observa el número mientras te mueves.', en:'Every step is worth ten. Watch the number as you move.'});
    draw();
  }
  function nextRound(){
    round++;
    if (round >= 3){
      closed = true;
      up.disabled = true; dn.disabled = true;
      mw.className = 'gmsg ok';
      mw.innerHTML = L({
        es:'Tres retos completos. Bajar un escalón multiplica el número por diez, subir uno lo divide entre diez.',
        en:'Three challenges done. Stepping down multiplies the number by ten, stepping up divides it by ten.'
      });
      pw.textContent = L({es:'Recorrido terminado', en:'Run finished'});
      return;
    }
    data = build(); cur = data.start; miss = 0;
    render();
  }
  function move(dir){
    if (closed) return;
    var ni = cur + dir;
    if (ni < 0 || ni > 6){
      mw.className = 'gmsg bad';
      mw.innerHTML = L({es:'Ese es el extremo de la escalera, no hay más escalones por ese lado.', en:'That is the end of the ladder, there are no more steps on that side.'});
      return;
    }
    var before = Math.abs(cur - data.target);
    var after = Math.abs(ni - data.target);
    var from = data.f.u[cur][0], to = data.f.u[ni][0];
    cur = ni;
    draw();
    if (cur === data.target){
      mw.className = 'gmsg ok';
      mw.innerHTML = L({
        es:'Llegaste: ' + fmt(data.val) + ' ' + data.f.u[data.start][0] + ' = ' + fmt(valAt(cur)) + ' ' + to + '.',
        en:'You made it: ' + fmt(data.val) + ' ' + data.f.u[data.start][0] + ' = ' + fmt(valAt(cur)) + ' ' + to + '.'
      });
      setTimeout(function(){ if (document.body.contains(host)) nextRound(); }, 1300);
      return;
    }
    if (after > before){
      miss++;
      if (miss >= 3){
        cur = data.target; draw();
        mw.className = 'gmsg bad';
        mw.innerHTML = L({
          es:'Te la dejo puesta: ' + fmt(data.val) + ' ' + data.f.u[data.start][0] + ' = ' + fmt(valAt(cur)) + ' ' + data.f.u[data.target][0] + '. El destino estaba hacia ' + (data.target > data.start ? 'abajo' : 'arriba') + '.',
          en:'Here it is: ' + fmt(data.val) + ' ' + data.f.u[data.start][0] + ' = ' + fmt(valAt(cur)) + ' ' + data.f.u[data.target][0] + '. The target was ' + (data.target > data.start ? 'downwards' : 'upwards') + '.'
        });
        setTimeout(function(){ if (document.body.contains(host)) nextRound(); }, 1600);
        return;
      }
      mw.className = 'gmsg bad';
      mw.innerHTML = L({
        es:'Te alejaste del destino. La fila de ' + data.f.u[data.target][0] + ' está hacia ' + (data.target > cur ? 'abajo' : 'arriba') + '.',
        en:'You moved away from the target. The ' + data.f.u[data.target][0] + ' row is ' + (data.target > cur ? 'downwards' : 'upwards') + '.'
      });
      return;
    }
    mw.className = 'gmsg';
    mw.innerHTML = (dir > 0)
      ? L({ es:'De ' + from + ' a ' + to + ': la unidad se hizo diez veces más chica, así que el número se multiplicó por diez y ahora marca ' + fmt(valAt(cur)) + '.',
            en:'From ' + from + ' to ' + to + ': the unit became ten times smaller, so the number was multiplied by ten and now reads ' + fmt(valAt(cur)) + '.' })
      : L({ es:'De ' + from + ' a ' + to + ': la unidad se hizo diez veces más grande, así que el número se dividió entre diez y ahora marca ' + fmt(valAt(cur)) + '.',
            en:'From ' + from + ' to ' + to + ': the unit became ten times bigger, so the number was divided by ten and now reads ' + fmt(valAt(cur)) + '.' });
  }
  up.addEventListener('click', function(){ move(-1); });
  dn.addEventListener('click', function(){ move(1); });

  data = build(); cur = data.start;
  render();
}


/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 3 :: constructor del factor de conversión
   El estudiante arma la fracción y la unidad que sobrevive se recalcula
   en cuanto toca cualquiera de las dos piezas.
   ══════════════════════════════════════════════════════════════════════════ */
function wFactor(rng, host){
  var bank = [
    { v: ri(rng, 12, 89) * 100, from:'mg', to:'g',  k:1000, nf:{es:'gramos', en:'grams'} },
    { v: ri(rng, 12, 89) * 100, from:'mL', to:'L',  k:1000, nf:{es:'litros', en:'litres'} },
    { v: ri(rng, 12, 89) * 10,  from:'cm', to:'m',  k:100,  nf:{es:'metros', en:'metres'} }
  ];
  var d = bank[Math.floor(rng() * bank.length)];
  var A = '1 ' + d.to;
  var B = d.k + ' ' + d.from;
  var num = null, den = null, tries = 0, closed = false;

  host.innerHTML =
    '<div class="gwh">' + L({es:'Constructor del factor', en:'Factor builder'}) + '</div>' +
    '<div class="gwtask">' + L({
      es:'Hay que expresar <b>' + d.v + ' ' + d.from + '</b> en ' + L(d.nf) + '. Arma la fracción que vale uno y observa qué unidad queda viva.',
      en:'You need to express <b>' + d.v + ' ' + d.from + '</b> in ' + L(d.nf) + '. Build the fraction that is worth one and watch which unit stays alive.'
    }) + '</div>' +
    '<div class="flbl">' + L({es:'arriba', en:'top'}) + '</div>' +
    '<div class="fbank" id="' + host.id + '_n"></div>' +
    '<div class="flbl">' + L({es:'abajo', en:'bottom'}) + '</div>' +
    '<div class="fbank" id="' + host.id + '_d"></div>' +
    '<div class="frow" id="' + host.id + '_r"></div>' +
    '<button class="gbtn" id="' + host.id + '_b">' + L({es:'Comprobar el factor', en:'Check the factor'}) + '</button>' +
    '<div class="gmsg" id="' + host.id + '_m">' + L({es:'Elige una pieza arriba y otra abajo.', en:'Pick one piece on top and one at the bottom.'}) + '</div>';

  var nw = document.getElementById(host.id + '_n');
  var dw = document.getElementById(host.id + '_d');
  var rw = document.getElementById(host.id + '_r');
  var mw = document.getElementById(host.id + '_m');
  var bw = document.getElementById(host.id + '_b');

  function bankRow(el, cur, set){
    el.innerHTML = '';
    [A, B].forEach(function(txt){
      var o = document.createElement('div');
      o.className = 'fopt' + (cur === txt ? ' sel' : '');
      o.textContent = txt;
      if (!closed) o.addEventListener('click', function(){ set(txt); paint(); });
      el.appendChild(o);
    });
  }
  function survivor(){
    if (!num || !den) return null;
    if (num === den) return 'one';
    if (den === B && num === A) return 'ok';
    return 'bad';
  }
  function paint(){
    bankRow(nw, num, function(t){ num = t; });
    bankRow(dw, den, function(t){ den = t; });
    var frac = (num && den) ? mf(num, den) : mf('?', '?');
    var sv = survivor(), txt;
    if (sv === null) txt = L({es:'faltan piezas', en:'pieces missing'});
    else if (sv === 'one') txt = L({es:'las dos piezas son iguales: se cancelan y el dato sigue en ' + d.from, en:'both pieces are the same: they cancel and the value stays in ' + d.from});
    else if (sv === 'ok') txt = L({es:'sobrevive ' + d.to, en:d.to + ' survives'});
    else txt = d.from + ' · ' + d.from + ' / ' + d.to;
    rw.innerHTML = '<span>' + d.v + ' ' + d.from + '</span><span>×</span>' + frac +
      '<span class="fsurv">' + L({es:'unidad viva: ', en:'live unit: '}) + txt + '</span>';
  }
  paint();

  bw.addEventListener('click', function(){
    if (closed) return;
    var sv = survivor();
    if (sv === null){
      mw.className = 'gmsg bad';
      mw.innerHTML = L({es:'Todavía falta elegir una pieza.', en:'One piece is still missing.'});
      return;
    }
    if (sv === 'ok'){
      closed = true; paint(); bw.disabled = true;
      mw.className = 'gmsg ok';
      mw.innerHTML = L({
        es:'Los ' + d.from + ' quedaron arriba y abajo, se cancelan: ' + d.v + ' ' + d.from + ' ÷ ' + d.k + ' = ' + fmt(d.v / d.k) + ' ' + d.to + '.',
        en:'The ' + d.from + ' appear top and bottom, so they cancel: ' + d.v + ' ' + d.from + ' ÷ ' + d.k + ' = ' + fmt(d.v / d.k) + ' ' + d.to + '.'
      });
      return;
    }
    tries++;
    if (tries >= 3){
      num = A; den = B; closed = true; paint(); bw.disabled = true;
      mw.className = 'gmsg bad';
      mw.innerHTML = L({
        es:'Así queda armada: ' + d.v + ' ' + d.from + ' × ' + A + ' entre ' + B + ' = ' + fmt(d.v / d.k) + ' ' + d.to + '.',
        en:'This is how it is built: ' + d.v + ' ' + d.from + ' × ' + A + ' over ' + B + ' = ' + fmt(d.v / d.k) + ' ' + d.to + '.'
      });
      return;
    }
    mw.className = 'gmsg bad';
    mw.innerHTML = (sv === 'one')
      ? L({ es:'Con dos piezas iguales el factor no hace nada. Una de ellas tiene que traer los ' + d.from + '.',
            en:'With two identical pieces the factor does nothing. One of them has to carry the ' + d.from + '.' })
      : L({ es:'Mira la unidad viva: quedaron ' + d.from + ' arriba y abajo no hay con qué cancelarlos. Los ' + d.from + ' van abajo.',
            en:'Look at the live unit: ' + d.from + ' ended up on top with nothing below to cancel them. The ' + d.from + ' go at the bottom.' });
    paint();
  });
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 4 :: regla graduada
   La marca se arrastra sobre una regla en centímetros mientras el objetivo
   viene dado en otra unidad. La lectura se actualiza en cada movimiento.
   ══════════════════════════════════════════════════════════════════════════ */
function wRuler(rng, host){
  var MAXMM = 150;
  var round = 0, tries = 0, target = 0, unit = 'mm', pos = 20, closed = false;

  host.innerHTML =
    '<div class="gwh">' + L({es:'Regla graduada', en:'Graduated ruler'}) + '</div>' +
    '<div class="gwtask" id="' + host.id + '_q"></div>' +
    '<div class="rulwrap"><canvas class="rulcv" id="' + host.id + '_cv"></canvas></div>' +
    '<div class="rread">' +
      '<div class="rr"><div class="rrl">' + L({es:'lectura de la regla', en:'ruler reading'}) + '</div><div class="rrv" id="' + host.id + '_v1">0 cm</div></div>' +
      '<div class="rr"><div class="rrl">' + L({es:'objetivo', en:'target'}) + '</div><div class="rrv" id="' + host.id + '_v2"></div></div>' +
    '</div>' +
    '<button class="gbtn" id="' + host.id + '_b">' + L({es:'Comprobar la marca', en:'Check the mark'}) + '</button>' +
    '<div class="gmsg" id="' + host.id + '_m"></div>' +
    '<div class="gprog" id="' + host.id + '_p"></div>';

  var cv = document.getElementById(host.id + '_cv');
  var qw = document.getElementById(host.id + '_q');
  var v1 = document.getElementById(host.id + '_v1');
  var v2 = document.getElementById(host.id + '_v2');
  var mw = document.getElementById(host.id + '_m');
  var pw = document.getElementById(host.id + '_p');
  var bw = document.getElementById(host.id + '_b');
  var ctx = cv.getContext('2d');
  var W = 0, H = 0, PAD = 22;

  function size(){
    var dpr = window.devicePixelRatio || 1;
    var r = cv.getBoundingClientRect();
    if (!r.width) return false;
    cv.width = Math.round(r.width * dpr);
    cv.height = Math.round(r.height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    W = r.width; H = r.height;
    return true;
  }
  function xOf(mm){ return PAD + (W - 2 * PAD) * mm / MAXMM; }
  function mmOf(x){ return Math.max(0, Math.min(MAXMM, Math.round((x - PAD) / (W - 2 * PAD) * MAXMM))); }

  function draw(){
    if (!W) return;
    var cBg = cssv('--surface2'), cLine = cssv('--text3'), cTxt = cssv('--text2'),
        cMark = cssv('--green'), cAcc = cssv('--gold'), cBody = cssv('--surface');
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = cBg; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = cBody; ctx.fillRect(PAD - 8, 18, W - 2 * PAD + 16, 62);
    ctx.strokeStyle = cLine; ctx.lineWidth = 1;
    ctx.strokeRect(PAD - 8, 18, W - 2 * PAD + 16, 62);
    var i;
    for (i = 0; i <= MAXMM; i++){
      var x = xOf(i), len = (i % 10 === 0) ? 26 : (i % 5 === 0 ? 16 : 9);
      ctx.beginPath();
      ctx.moveTo(x, 18); ctx.lineTo(x, 18 + len);
      ctx.strokeStyle = cLine; ctx.lineWidth = (i % 10 === 0) ? 1.4 : 0.8;
      ctx.stroke();
      if (i % 10 === 0){
        ctx.fillStyle = cTxt; ctx.font = '10px IBM Plex Sans, sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(String(i / 10), x, 58);
      }
    }
    ctx.fillStyle = cTxt; ctx.font = '9px IBM Plex Sans, sans-serif'; ctx.textAlign = 'left';
    ctx.fillText('cm', PAD - 6, 76);
    var mx = xOf(pos);
    ctx.strokeStyle = cMark; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(mx, 14); ctx.lineTo(mx, 88); ctx.stroke();
    ctx.fillStyle = cAcc;
    ctx.beginPath(); ctx.moveTo(mx, 88); ctx.lineTo(mx - 7, 102); ctx.lineTo(mx + 7, 102); ctx.closePath(); ctx.fill();
  }
  function readout(){
    v1.textContent = fmt(pos / 10) + ' cm';
    v2.textContent = (unit === 'mm') ? target + ' mm' : fmt(target / 1000) + ' m';
  }
  function newRound(){
    target = ri(rng, 22, 146);
    unit = (rng() < 0.5) ? 'mm' : 'm';
    pos = ri(rng, 5, 30);
    tries = 0;
    qw.innerHTML = L({
      es:'Coloca la marca en <b>' + ((unit === 'mm') ? target + ' mm' : fmt(target / 1000) + ' m') + '</b>. La regla está graduada en centímetros.',
      en:'Place the mark at <b>' + ((unit === 'mm') ? target + ' mm' : fmt(target / 1000) + ' m') + '</b>. The ruler is graduated in centimetres.'
    });
    mw.className = 'gmsg';
    mw.innerHTML = L({es:'Arrastra la marca sobre la regla.', en:'Drag the mark along the ruler.'});
    pw.textContent = L({es:'Medición ', en:'Measurement '}) + Math.min(round + 1, 3) + L({es:' de 3', en:' of 3'});
    readout(); draw();
  }
  function advance(){
    round++;
    if (round >= 3){
      closed = true; bw.disabled = true;
      mw.className = 'gmsg ok';
      mw.innerHTML = L({
        es:'Tres mediciones listas. Un centímetro de la regla son diez milímetros, y mil milímetros hacen un metro.',
        en:'Three measurements done. One centimetre on the ruler is ten millimetres, and a thousand millimetres make a metre.'
      });
      pw.textContent = L({es:'Serie terminada', en:'Series finished'});
      return;
    }
    newRound();
  }
  function setFromEvent(e){
    if (closed) return;
    var r = cv.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    pos = mmOf(src.clientX - r.left);
    readout(); draw();
  }
  var dragging = false;
  cv.addEventListener('mousedown', function(e){ e.preventDefault(); dragging = true; setFromEvent(e); });
  cv.addEventListener('mousemove', function(e){ if (dragging){ e.preventDefault(); setFromEvent(e); } });
  cv.addEventListener('mouseup', function(){ dragging = false; });
  cv.addEventListener('mouseleave', function(){ dragging = false; });
  cv.addEventListener('touchstart', function(e){ e.preventDefault(); dragging = true; setFromEvent(e); }, { passive:false });
  cv.addEventListener('touchmove', function(e){ if (dragging){ e.preventDefault(); setFromEvent(e); } }, { passive:false });
  cv.addEventListener('touchend', function(){ dragging = false; });

  bw.addEventListener('click', function(){
    if (closed) return;
    var diff = pos - target;
    if (Math.abs(diff) <= 1){
      mw.className = 'gmsg ok';
      mw.innerHTML = L({
        es:'Justo ahí: ' + fmt(target / 1000) + ' m = ' + fmt(target / 10) + ' cm = ' + target + ' mm.',
        en:'Right there: ' + fmt(target / 1000) + ' m = ' + fmt(target / 10) + ' cm = ' + target + ' mm.'
      });
      setTimeout(function(){ if (document.body.contains(host)) advance(); }, 1300);
      return;
    }
    tries++;
    if (tries >= 3){
      pos = target; readout(); draw();
      mw.className = 'gmsg bad';
      mw.innerHTML = L({
        es:'La marca iba en ' + fmt(target / 10) + ' cm, porque ' + fmt(target / 1000) + ' m son ' + target + ' mm.',
        en:'The mark belonged at ' + fmt(target / 10) + ' cm, because ' + fmt(target / 1000) + ' m is ' + target + ' mm.'
      });
      setTimeout(function(){ if (document.body.contains(host)) advance(); }, 1600);
      return;
    }
    mw.className = 'gmsg bad';
    mw.innerHTML = L({
      es:'Tu marca dice ' + fmt(pos / 10) + ' cm, es decir ' + pos + ' mm. Te ' + (diff < 0 ? 'faltan ' : 'sobran ') + Math.abs(diff) + ' mm.',
      en:'Your mark reads ' + fmt(pos / 10) + ' cm, that is ' + pos + ' mm. You are ' + Math.abs(diff) + ' mm ' + (diff < 0 ? 'short.' : 'over.')
    });
  });

  setTimeout(function(){ if (size()) { newRound(); } }, 90);
  var onRz = function(){ if (size()) draw(); };
  window.addEventListener('resize', onRz);
  var mo = new MutationObserver(function(){ draw(); });
  mo.observe(document.documentElement, { attributes:true, attributeFilter:['data-theme'] });
  GUIDE_CLEANUP.push(function(){ window.removeEventListener('resize', onRz); mo.disconnect(); });
}


/* ══════════════════════════════════════════════════════════════════════════
   PROBLEMAS GRADUADOS :: cada ranura guarda dos variantes estructurales y
   la semilla decide cuál aparece. Los números salen siempre de rng.
   ══════════════════════════════════════════════════════════════════════════ */

/* 1 · leer una etiqueta con prefijo */
function mkP1(rng){

  if (rng() < 0.5){
    return {
      title: L({es:'Leer una etiqueta', en:'Reading a label'}),
      q: L({ es:'Una caja de tabletas indica que cada tableta contiene ' + w + ' mg de sustancia activa. ¿Qué afirmación describe correctamente esa medida?',
             en:'A box of tablets states that each tablet contains ' + w + ' mg of active substance. Which statement correctly describes that measurement?' }),
      options: [
        L({es:'Cada tableta tiene menos de un gramo, porque mili señala la milésima parte de la unidad', en:'Each tablet holds less than one gram, because milli marks a thousandth of the unit'}),
        L({es:'Cada tableta tiene más de un gramo, porque mili señala mil veces la unidad', en:'Each tablet holds more than one gram, because milli marks a thousand times the unit'}),
        L({es:'Cada tableta tiene menos de un gramo, porque mili señala la centésima parte de la unidad', en:'Each tablet holds less than one gram, because milli marks a hundredth of the unit'}),
        L({es:'Cada tableta tiene más de un gramo, porque mili señala cien veces la unidad', en:'Each tablet holds more than one gram, because milli marks a hundred times the unit'})
      ],
      correct: 0, showWork: false,
      hint: L({es:'Sitúa el prefijo respecto a la unidad base: los que están por debajo de ella la parten, los que están por encima la juntan.', en:'Place the prefix relative to the base unit: those below it split the unit, those above it bundle it.'}),
      exp: L({ es:'Mili vale una milésima, así que 1 mg equivale a 0.001 g. Entonces ' + w + ' mg = ' + w + ' ÷ 1000 g = ' + fmt(w / 1000) + ' g, una masa menor que un gramo.',
               en:'Milli is worth a thousandth, so 1 mg equals 0.001 g. Then ' + w + ' mg = ' + w + ' ÷ 1000 g = ' + fmt(w / 1000) + ' g, a mass smaller than one gram.' })
    };
  }
  return {
    title: L({es:'Leer una etiqueta', en:'Reading a label'}),
    q: L({ es:'El tanque del laboratorio está marcado con ' + v + ' hL de capacidad. ¿Qué afirmación describe correctamente esa medida?',
           en:'The laboratory tank is marked with a capacity of ' + v + ' hL. Which statement correctly describes that measurement?' }),
    options: [
      L({es:'El tanque guarda más de un litro, porque hecto señala cien veces la unidad', en:'The tank holds more than one litre, because hecto marks a hundred times the unit'}),

    exp: L({ es:'El volumen pedido en mililitros es ' + fmt(totM / 1000) + ' × 1000 = ' + totM + ' mL. Repartido entre la capacidad de cada frasco: ' + totM + ' ÷ ' + packM + ' = ' + n,
             en:'The volume needed in millilitres is ' + fmt(totM / 1000) + ' × 1000 = ' + totM + ' mL. Shared out by the capacity of each flask: ' + totM + ' ÷ ' + packM + ' = ' + n })
  };
}


/* ══════════════════════════════════════════════════════════════════════════
   buildLesson :: concepto -> manipulativo -> problema, alternados
   ══════════════════════════════════════════════════════════════════════════ */
function buildLesson(rng){
  GUIDE_CLEANUP.forEach(function(f){ try { f(); } catch(e){} });
  GUIDE_CLEANUP = [];
  injectGuideCSS();

  /* ── Apertura ── */
  sec(
    L({es:'Punto de partida', en:'Starting point'}),
    L({es:'La misma medida, escrita de varias maneras', en:'The same measurement, written in several ways'}),
    '<p>' + L({
      es:'Una botella dice 1.5 L, la caja de tabletas dice 500 mg, la carrera del domingo se anuncia con 5 km y la cisterna del laboratorio guarda 2 hL. Las cuatro etiquetas usan la misma idea: una unidad conocida acompañada de una palabra corta que la agranda o la achica.',
      en:'A bottle says 1.5 L, the box of tablets says 500 mg, Sunday race is announced as 5 km and the laboratory cistern holds 2 hL. All four labels use the same idea: a familiar unit with a short word in front that makes it bigger or smaller.'
    }) + '</p>' +
    '<div class="callout"><p><strong>' + L({es:'Idea clave: ', en:'Key idea: '}) + '</strong>' + L({
      es:'convertir no cambia lo que se midió, solo cambia el número y el nombre con que se escribe. La tableta pesa exactamente lo mismo si la etiqueta dice 500 mg que si dice 0.5 g.',
      en:'converting does not change what was measured, it only changes the number and the name used to write it. The tablet weighs exactly the same whether the label says 500 mg or 0.5 g.'
    }) + '</p></div>'
  );

  /* ══ CONCEPTO 1 ══ */
  var s1 = sec(
    L({es:'Concepto 1', en:'Concept 1'}),
    L({es:'Lo que agrega un prefijo', en:'What a prefix adds'}),
    '<p>' + L({
      es:'Un prefijo es una palabra corta que se coloca delante de la unidad y le fija un factor de diez. Los que agrandan la unidad se llaman múltiplos y los que la achican se llaman submúltiplos. La magnitud sigue siendo la misma: kilo, deci o mili no convierten el metro en otra cosa, solo indican de qué tamaño es el paquete que se está contando.',
      en:'A prefix is a short word placed in front of the unit that fixes a factor of ten for it. Those that make the unit bigger are called multiples and those that make it smaller are called submultiples. The quantity stays the same: kilo, deci or milli do not turn the metre into something else, they only state the size of the package being counted.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard('kilo (k)',  '× 1000', L({es:'mil unidades en una', en:'a thousand units in one'})) +
      rcard('hecto (h)', '× 100',  L({es:'cien unidades en una', en:'a hundred units in one'})) +
      rcard('deca (da)', '× 10',   L({es:'diez unidades en una', en:'ten units in one'})) +
      rcard('deci (d)',  '÷ 10',   L({es:'la décima parte', en:'a tenth of the unit'})) +
      rcard('centi (c)', '÷ 100',  L({es:'la centésima parte', en:'a hundredth of the unit'})) +
      rcard('mili (m)',  '÷ 1000', L({es:'la milésima parte', en:'a thousandth of the unit'})) +
    '</div>' +
    '<div class="callout"><p>' + L({
      es:'La familia es más grande de lo que parece: mega (M) vale un millón de unidades y micro (µ) vale una millonésima. Aparecen al hablar de la potencia de una central eléctrica o del grosor de una lámina, y siguen exactamente la misma lógica de potencias de diez.',
      en:'The family is larger than it looks: mega (M) is worth a million units and micro (µ) is worth a millionth. They show up when talking about the output of a power station or the thickness of a metal sheet, and they follow exactly the same logic of powers of ten.'
    }) + '</p></div>'
  );
  wSort(rng, wHost(s1, 'w_sort'));
  addProblem(rng, mkP1(rng));
  addProblem(rng, mkP2(rng));

  /* ══ CONCEPTO 2 ══ */
  var s2 = sec(
    L({es:'Concepto 2', en:'Concept 2'}),
    L({es:'Cada escalón vale diez', en:'Every step is worth ten'}),
    '<p>' + L({
      es:'Las unidades vecinas de la escalera se llevan un factor de diez. Al bajar hacia una unidad más pequeña se necesitan más piezas para cubrir lo mismo, así que el número crece. Al subir hacia una unidad más grande se necesitan menos piezas y el número se achica. Contar los escalones dice cuántos lugares recorre el punto decimal.',
      en:'Neighbouring units on the ladder differ by a factor of ten. Stepping down towards a smaller unit means more pieces are needed to cover the same thing, so the number grows. Stepping up towards a bigger unit means fewer pieces are needed and the number shrinks. Counting the steps tells you how many places the decimal point travels.'
    }) + '</p>' +
    '<div class="callout"><p>' + L({
      es:'Comprobación rápida antes de dar por buena una conversión: si la unidad de llegada es más pequeña que la de partida, el resultado tiene que salir con un número mayor. Si sale menor, la conversión se hizo al revés.',
      en:'A quick check before accepting a conversion: if the arriving unit is smaller than the starting one, the result has to come out with a bigger number. If it comes out smaller, the conversion was done the wrong way round.'
    }) + '</p></div>'
  );
  wLadder(rng, wHost(s2, 'w_ladder'));
  addProblem(rng, mkP3(rng));
  addProblem(rng, mkP4(rng));

  /* ══ CONCEPTO 3 ══ */
  var s3 = sec(
    L({es:'Concepto 3', en:'Concept 3'}),
    L({es:'Un factor que vale uno', en:'A factor worth one'}),
    '<p>' + L({
      es:'Contar escalones funciona, pero existe una herramienta que nunca se equivoca de dirección: una fracción formada por dos cantidades iguales, como 1000 g y 1 kg. Al valer uno, multiplicar por ella no altera la medida. La unidad que se quiere eliminar se coloca abajo y la unidad que se quiere obtener se coloca arriba.',
      en:'Counting steps works, but there is a tool that never gets the direction wrong: a fraction made of two equal amounts, such as 1000 g and 1 kg. Since it is worth one, multiplying by it does not alter the measurement. The unit to be removed goes at the bottom and the unit to be obtained goes on top.'
    }) + '</p>' +
    '<div class="gcrd"><div class="frow"><span>2.4 kg</span><span>×</span>' + mf('1000 g', '1 kg') + '<span>=</span><span class="fsurv">2400 g</span></div></div>' +
    '<div class="callout"><p>' + L({
      es:'La pista está en las unidades: la que aparece arriba y abajo se cancela, y la que sobrevive es la del resultado. Si sobrevive la unidad equivocada, la fracción está al revés.',
      en:'The clue is in the units: the one appearing top and bottom cancels out, and the one that survives is the unit of the result. If the wrong unit survives, the fraction is upside down.'
    }) + '</p></div>'
  );
  wFactor(rng, wHost(s3, 'w_factor'));
  addProblem(rng, mkP5(rng));
  addProblem(rng, mkP6(rng));

  /* ══ CONCEPTO 4 ══ */
  var s4 = sec(
    L({es:'Concepto 4', en:'Concept 4'}),
    L({es:'Instrumentos y medidas partidas en dos', en:'Instruments and measurements split in two'}),
    '<p>' + L({
      es:'Cada instrumento trae su propia escala: la regla escolar está graduada en centímetros y milímetros, la probeta en mililitros, la báscula de cocina en gramos. Leer bien el instrumento es la mitad del trabajo; la otra mitad es escribir esa lectura en la unidad que pide el problema. Además, muchas medidas llegan partidas en dos unidades distintas, como un trayecto de 2 km y 350 m, y hay que reunirlas en una sola antes de operar.',
      en:'Every instrument carries its own scale: the school ruler is graduated in centimetres and millimetres, the measuring cylinder in millilitres, the kitchen scale in grams. Reading the instrument properly is half the work; the other half is writing that reading in the unit the problem asks for. On top of that, many measurements arrive split into two different units, such as a trip of 2 km and 350 m, and they have to be gathered into a single one before operating.'
    }) + '</p>' +
    '<div class="callout"><p>' + L({
      es:'Cuando las unidades quedan lejos en la escalera conviene avanzar por etapas: de microgramos a miligramos y de miligramos a gramos, en lugar de saltar de una sola vez y perder la cuenta de los ceros.',
      en:'When the units sit far apart on the ladder it pays to advance in stages: from micrograms to milligrams and from milligrams to grams, instead of jumping all at once and losing count of the zeros.'
    }) + '</p></div>'
  );
  wRuler(rng, wHost(s4, 'w_ruler'));
  addProblem(rng, mkP7(rng));

  /* ══ CIERRE ══ */
  sec(
    L({es:'Cierre', en:'Closing'}),
    L({es:'Tres medidas del mundo real', en:'Three measurements from the real world'}),
    '<p>' + L({
      es:'Las siguientes tres situaciones mezclan prefijos grandes, prefijos pequeños e instrumentos.',
      en:'The next three situations mix large prefixes, small prefixes and instruments.'
    }) + '</p>'
  );
  addProblem(rng, mkP8(rng));
  addProblem(rng, mkP9(rng));
  addProblem(rng, mkP10(rng));
}

</script>

<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbzLGV15JRTPs9bbSvHRLfgOXeT9oUExDf1AH546WOwq5tYxXSdhX212OWi_bTJfMGx9/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'Conversiones entre Múltiplos y Submúltiplos';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
