    options: o5, correct: o5[0], showWork: true
  }, rng);

  /*  CONCEPTO 4 : CRITERIOS DE SEMEJANZA  */
  addSection(
    '<div class="stag">' + L('Criterios de semejanza', 'Similarity criteria') + '</div>' +
    '<h2>' + L('Con dos ángulos ya basta', 'Two angles are already enough') + '</h2>' +
    '<p>' + L('Para la semejanza los criterios son más generosos que para la congruencia, porque el tamaño deja de importar.',
              'For similarity the criteria are more generous than for congruence, because size stops mattering.') + '</p>' +
    '<div class="rules-grid">' +
      '<div class="rcard"><div class="rname">' + L('Ángulo, ángulo', 'Angle, angle') + '</div><div class="rform">AA</div><div class="rnote">' + L('Dos ángulos correspondientes iguales. El tercero se acomoda solo.', 'Two corresponding angles equal. The third one follows on its own.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + L('Lado, ángulo, lado', 'Side, angle, side') + '</div><div class="rform">' + L('LAL', 'SAS') + '</div><div class="rnote">' + L('Un ángulo igual entre dos lados proporcionales.', 'One equal angle between two proportional sides.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + L('Lado, lado, lado', 'Side, side, side') + '</div><div class="rform">' + L('LLL', 'SSS') + '</div><div class="rnote">' + L('Los tres pares de lados en la misma razón.', 'The three pairs of sides in the same ratio.') + '</div></div>' +
    '</div>' +
    '<p>' + L('El criterio AA funciona porque los tres ángulos de un triángulo suman 180°: si dos coinciden, el tercero no tiene otra opción. Por eso los triángulos rectángulos que comparten un ángulo agudo siempre son semejantes.',
              'The AA criterion works because the three angles of a triangle add up to 180°: if two of them match, the third has no other option. That is why right triangles sharing an acute angle are always similar.') + '</p>'
  );

  /* ── Problema 6 ── */
  var p6v = Math.floor(rng() * 2);
  if (p6v === 0){
    var ag = pick([[40, 75], [50, 62], [48, 57]], rng);
    var oth = 180 - ag[0] - ag[1];
    var o6 = [
      L('El criterio AA: dos ángulos correspondientes iguales', 'The AA criterion: two corresponding angles equal'),
      L('El criterio LAL de semejanza: un ángulo igual entre lados proporcionales', 'The SAS similarity criterion: an equal angle between proportional sides'),
      L('El criterio LLL de semejanza: los tres lados proporcionales', 'The SSS similarity criterion: the three sides proportional'),
      L('Nada: con esos datos no se puede afirmar que sean semejantes', 'Nothing: with that data you cannot state that they are similar')
    ];
    pushProb({
      title: L('Decidir con ángulos', 'Deciding with angles'),
      questionText: L('En el triángulo ABC el ángulo A mide ' + ag[0] + '° y el ángulo B mide ' + ag[1] + '°. En el triángulo MNP el ángulo M mide ' + ag[0] + '° y el ángulo P mide ' + oth + '°. ¿Qué permite afirmar que ABC y MNP son semejantes?',
                      'In triangle ABC angle A measures ' + ag[0] + '° and angle B measures ' + ag[1] + '°. In triangle MNP angle M measures ' + ag[0] + '° and angle P measures ' + oth + '°. What allows you to state that ABC and MNP are similar?'),
      hint: L('Completa los ángulos que faltan en cada triángulo antes de comparar; los tres ángulos interiores siempre suman lo mismo.',
              'Fill in the missing angles in each triangle before comparing; the three interior angles always add up to the same amount.'),
      explanation: L('En MNP el ángulo N mide 180 − ' + ag[0] + ' − ' + oth + ' = ' + ag[1] + '°. Así A y M coinciden y B y N también: dos pares de ángulos iguales, es decir el criterio AA.',
                     'In MNP angle N measures 180 − ' + ag[0] + ' − ' + oth + ' = ' + ag[1] + '°. So A matches M and B matches N: two pairs of equal angles, that is the AA criterion.'),
      options: o6, correct: o6[0], showWork: false
    }, rng);
  } else {
    var pr6 = pick([[[6,8,10],[9,12,15],1.5],[[4,6,8],[10,15,20],2.5],[[5,7,9],[10,14,18],2]], rng);
    var s1 = pr6[0], s2 = pr6[1];
    var o6b = [
      L('El criterio LLL de semejanza: los tres lados proporcionales', 'The SSS similarity criterion: the three sides proportional'),
      L('El criterio AA: dos ángulos correspondientes iguales', 'The AA criterion: two corresponding angles equal'),
      L('El criterio LAL de semejanza: un ángulo igual entre lados proporcionales', 'The SAS similarity criterion: an equal angle between proportional sides'),
      L('Nada: los lados no guardan la misma razón', 'Nothing: the sides do not keep the same ratio')
    ];
    pushProb({
      title: L('Decidir con lados', 'Deciding with sides'),
      questionText: L('El triángulo ABC tiene lados de ' + s1[0] + ' cm, ' + s1[1] + ' cm y ' + s1[2] + ' cm. El triángulo DEF tiene lados de ' + s2[0] + ' cm, ' + s2[1] + ' cm y ' + s2[2] + ' cm. ¿Qué permite afirmar que ABC y DEF son semejantes?',
                      'Triangle ABC has sides of ' + s1[0] + ' cm, ' + s1[1] + ' cm and ' + s1[2] + ' cm. Triangle DEF has sides of ' + s2[0] + ' cm, ' + s2[1] + ' cm and ' + s2[2] + ' cm. What allows you to state that ABC and DEF are similar?'),
      hint: L('Ordena los lados de menor a mayor en cada triángulo y compara pareja por pareja; busca si aparece siempre el mismo número.',
              'Sort the sides from smallest to largest in each triangle and compare them pair by pair; look for the same number appearing every time.'),
      explanation: L('Al dividir cada pareja se obtiene ' + frac(s2[0], s1[0]) + ' = ' + frac(s2[1], s1[1]) + ' = ' + frac(s2[2], s1[2]) + ' = ' + nf(pr6[2]) + '. Los tres cocientes coinciden, así que se cumple el criterio LLL de semejanza.',
                     'Dividing each pair gives ' + frac(s2[0], s1[0]) + ' = ' + frac(s2[1], s1[1]) + ' = ' + frac(s2[2], s1[2]) + ' = ' + nf(pr6[2]) + '. The three quotients agree, so the SSS similarity criterion holds.'),
      options: o6b, correct: o6b[0], showWork: false
    }, rng);
  }

  /* ── Problema 7 ── */
  var t7 = pick([[8, 12, 6], [10, 15, 6], [6, 9, 12]], rng);
  var a7 = t7[0], d7 = t7[1], b7 = t7[2], ef7 = b7 * d7 / a7;
  var p7v = Math.floor(rng() * 2);
  if (p7v === 0){
    var o7 = [nf(ef7) + ' cm', nf(b7 + (d7 - a7)) + ' cm', nf(b7 * a7 / d7) + ' cm', nf(d7 + b7) + ' cm'];
    pushProb({
      title: L('El lado que falta', 'The missing side'),
      questionText: L('Los triángulos ABC y DEF son semejantes con la correspondencia A↔D, B↔E, C↔F. Se sabe que AB = ' + a7 + ' cm, DE = ' + d7 + ' cm y BC = ' + b7 + ' cm. ¿Cuánto mide EF?',
                      'Triangles ABC and DEF are similar with the correspondence A↔D, B↔E, C↔F. It is known that AB = ' + a7 + ' cm, DE = ' + d7 + ' cm and BC = ' + b7 + ' cm. How long is EF?'),
      hint: L('Con la pareja de lados que conoces completa puedes obtener la razón, y esa misma razón se aplica a cualquier otra pareja correspondiente.',
              'The pair of sides you know completely gives you the ratio, and that same ratio applies to any other corresponding pair.'),
      explanation: L('La razón es ' + frac(d7, a7) + ' = ' + nf(d7 / a7) + '. Entonces EF = ' + nf(d7 / a7) + ' × ' + b7 + ' = ' + nf(ef7) + ' cm.',
                     'The ratio is ' + frac(d7, a7) + ' = ' + nf(d7 / a7) + '. Then EF = ' + nf(d7 / a7) + ' × ' + b7 + ' = ' + nf(ef7) + ' cm.'),
      options: o7, correct: o7[0], showWork: true
    }, rng);
  } else {
    var o7b = [nf(ef7), nf(b7 + (d7 - a7)), nf(b7 * a7 / d7), nf(d7 + b7)];
    pushProb({
      title: L('Resolver la proporción', 'Solving the proportion'),
      questionText: L('Calcula el valor de x en la proporción: ', 'Work out the value of x in the proportion: ') +
                     frac('x', b7) + ' = ' + frac(d7, a7),
      hint: L('Multiplica en cruz los términos de la proporción y despeja la incógnita dividiendo entre el número que la acompaña.',
              'Cross multiply the terms of the proportion and isolate the unknown by dividing by the number next to it.'),
      explanation: L('Multiplicando en cruz: x × ' + a7 + ' = ' + b7 + ' × ' + d7 + ', o sea x = ' + frac(b7 * d7, a7) + ' = ' + nf(ef7) + '.',
                     'Cross multiplying: x × ' + a7 + ' = ' + b7 + ' × ' + d7 + ', that is x = ' + frac(b7 * d7, a7) + ' = ' + nf(ef7) + '.'),
      options: o7b, correct: o7b[0], showWork: true
    }, rng);
  }

  /*  CONCEPTO 5 : TALES  */
  addSection(
    '<div class="stag">' + L('Paralelas y proporciones', 'Parallels and proportions') + '</div>' +
    '<h2>' + L('Una paralela que corta y reparte', 'A parallel line that cuts and shares out') + '</h2>' +
    '<p>' + L('Si en el triángulo ABC tomas un punto D sobre AB y un punto E sobre AC de modo que DE quede paralelo a BC, el triángulo ADE resulta semejante al ABC: comparten el ángulo A y, al ser DE paralelo a BC, los ángulos que se forman en D y en B son iguales.',
              'If in triangle ABC you take a point D on AB and a point E on AC so that DE is parallel to BC, triangle ADE turns out similar to ABC: they share angle A and, since DE is parallel to BC, the angles formed at D and at B are equal.') + '</p>' +
    '<div class="callout"><p><strong>' + L('El reparto proporcional.', 'The proportional split.') + '</strong> ' +
      L('Esa semejanza obliga a que los dos lados queden cortados en la misma razón: ' + frac('AD', 'DB') + ' = ' + frac('AE', 'EC') + '.',
        'That similarity forces both sides to be cut in the same ratio: ' + frac('AD', 'DB') + ' = ' + frac('AE', 'EC') + '.') + '</p></div>' +
    '<p>' + L('Cuando las dos razones no coinciden, la igualdad se rompe. La balanza te lo enseña: el platillo con la razón más grande se va hacia abajo.',
              'When the two ratios do not match, the equality breaks. The balance shows it: the pan with the larger ratio drops.') + '</p>' +
    m4Html()
  );
  m4Build(rng);
  setTimeout(m4Init, 90);

  /* ── Problema 8 ── */
  var t8 = pick([[6, 9, 12], [4, 8, 6], [6, 10, 15]], rng);
  var p8 = t8[0], q8 = t8[1], r8 = t8[2];
  var p8v = Math.floor(rng() * 2);
  if (p8v === 0){
    var ec8 = q8 * r8 / p8;
    var o8 = [nf(ec8) + ' cm', nf(r8 + q8 - p8) + ' cm', nf(p8 * r8 / q8) + ' cm', nf(ec8 + q8 - p8) + ' cm'];
    pushProb({
      title: L('Repartir el otro lado', 'Sharing out the other side'),
      questionText: L('En el triángulo ABC se traza el segmento DE paralelo al lado BC, con D sobre AB y E sobre AC. Se sabe que AD = ' + p8 + ' cm, DB = ' + q8 + ' cm y AE = ' + r8 + ' cm. ¿Cuánto mide EC?',
                      'In triangle ABC the segment DE is drawn parallel to side BC, with D on AB and E on AC. It is known that AD = ' + p8 + ' cm, DB = ' + q8 + ' cm and AE = ' + r8 + ' cm. How long is EC?'),
      hint: L('Escribe la igualdad entre las dos razones en que quedan partidos los lados y despeja la medida desconocida multiplicando en cruz.',
              'Write the equality between the two ratios into which the sides are split and isolate the unknown length by cross multiplying.'),
      explanation: L('Se cumple ' + frac('AD', 'DB') + ' = ' + frac('AE', 'EC') + ', es decir ' + frac(p8, q8) + ' = ' + frac(r8, 'EC') + '. Multiplicando en cruz: EC = ' + frac(q8 + ' × ' + r8, p8) + ' = ' + nf(ec8) + ' cm.',
                     'We have ' + frac('AD', 'DB') + ' = ' + frac('AE', 'EC') + ', that is ' + frac(p8, q8) + ' = ' + frac(r8, 'EC') + '. Cross multiplying: EC = ' + frac(q8 + ' × ' + r8, p8) + ' = ' + nf(ec8) + ' cm.'),
      options: o8, correct: o8[0], showWork: true
    }, rng);
  } else {
    var m8 = p8 + q8, ac8 = r8 * m8 / p8, ec8b = q8 * r8 / p8;
    var o8b = [nf(ac8) + ' cm', nf(ec8b) + ' cm', nf(ac8 - p8) + ' cm', nf(m8 * r8 / q8) + ' cm'];
    pushProb({
      title: L('Del trozo al lado completo', 'From the piece to the whole side'),
      questionText: L('En el triángulo ABC se traza el segmento DE paralelo al lado BC, con D sobre AB y E sobre AC. Se sabe que AD = ' + p8 + ' cm, AB = ' + m8 + ' cm y AE = ' + r8 + ' cm. ¿Cuánto mide AC?',
                      'In triangle ABC the segment DE is drawn parallel to side BC, with D on AB and E on AC. It is known that AD = ' + p8 + ' cm, AB = ' + m8 + ' cm and AE = ' + r8 + ' cm. How long is AC?'),
      hint: L('Aquí conviene comparar cada trozo con el lado completo del que forma parte, porque los triángulos ADE y ABC son semejantes.',
              'Here it helps to compare each piece with the whole side it belongs to, because triangles ADE and ABC are similar.'),
      explanation: L('Como ADE ~ ABC, se cumple ' + frac('AD', 'AB') + ' = ' + frac('AE', 'AC') + ', es decir ' + frac(p8, m8) + ' = ' + frac(r8, 'AC') + '. Entonces AC = ' + frac(m8 + ' × ' + r8, p8) + ' = ' + nf(ac8) + ' cm.',
                     'Since ADE ~ ABC, we have ' + frac('AD', 'AB') + ' = ' + frac('AE', 'AC') + ', that is ' + frac(p8, m8) + ' = ' + frac(r8, 'AC') + '. Then AC = ' + frac(m8 + ' × ' + r8, p8) + ' = ' + nf(ac8) + ' cm.'),
      options: o8b, correct: o8b[0], showWork: true
    }, rng);
  }

  /*  CIERRE  */
  addSection(
    '<div class="stag">' + L('Para cerrar', 'To finish') + '</div>' +
    '<h2>' + L('Dos situaciones más', 'Two more situations') + '</h2>'
  );

  /* ── Problema 9 ── */
  var p9v = Math.floor(rng() * 2);
  if (p9v === 0){
    var pr9 = pick([[1.5, 24], [2, 22], [3, 15]], rng);
    var k9 = pr9[0], per9 = pr9[1], big9 = k9 * per9;
    var o9 = [nf(big9) + ' cm', nf(k9 * k9 * per9) + ' cm', nf(per9 / k9) + ' cm', nf(per9 * (k9 + 1)) + ' cm'];
    pushProb({
      title: L('Perímetros de figuras semejantes', 'Perimeters of similar figures'),
      questionText: L('Dos triángulos son semejantes y la razón del mayor respecto del menor es ' + nf(k9) + '. El perímetro del triángulo menor es ' + per9 + ' cm. ¿Cuánto mide el perímetro del triángulo mayor?',
                      'Two triangles are similar and the ratio of the larger to the smaller is ' + nf(k9) + '. The perimeter of the smaller triangle is ' + per9 + ' cm. What is the perimeter of the larger triangle?'),
      hint: L('El perímetro es una suma de longitudes, y cada longitud se ve afectada exactamente igual por la razón. Cuidado con confundirlo con lo que pasa en las áreas.',
              'The perimeter is a sum of lengths, and every length is affected in exactly the same way by the ratio. Be careful not to confuse it with what happens to areas.'),
      explanation: L('Cada lado del mayor es ' + nf(k9) + ' veces el correspondiente del menor, así que la suma de los tres también: ' + nf(k9) + ' × ' + per9 + ' = ' + nf(big9) + ' cm.',
                     'Each side of the larger one is ' + nf(k9) + ' times its counterpart in the smaller one, so the sum of the three behaves the same way: ' + nf(k9) + ' × ' + per9 + ' = ' + nf(big9) + ' cm.'),
      options: o9, correct: o9[0], showWork: true
    }, rng);
  } else {
    var pr9b = pick([[2, 15], [3, 8], [2, 18]], rng);
    var k9b = pr9b[0], ar9 = pr9b[1], bigA = k9b * k9b * ar9;
    var o9b = [nf(bigA) + ' cm²', nf(k9b * ar9) + ' cm²', nf(ar9 + k9b * k9b) + ' cm²', nf(ar9 * (1 + k9b)) + ' cm²'];
    pushProb({
      title: L('Áreas de figuras semejantes', 'Areas of similar figures'),
      questionText: L('Dos triángulos son semejantes y la razón del mayor respecto del menor es ' + k9b + '. El área del triángulo menor es ' + ar9 + ' cm². ¿Cuál es el área del triángulo mayor?',
                      'Two triangles are similar and the ratio of the larger to the smaller is ' + k9b + '. The area of the smaller triangle is ' + ar9 + ' cm². What is the area of the larger triangle?'),
      hint: L('Un área depende de dos medidas que crecen a la vez, la base y la altura, y las dos quedan multiplicadas por la razón.',
              'An area depends on two measurements that grow at the same time, the base and the height, and both get multiplied by the ratio.'),
      explanation: L('La base y la altura se multiplican cada una por ' + k9b + ', así que el área se multiplica por ' + k9b + ' × ' + k9b + ' = ' + (k9b * k9b) + '. Entonces ' + (k9b * k9b) + ' × ' + ar9 + ' = ' + nf(bigA) + ' cm².',
                     'The base and the height are each multiplied by ' + k9b + ', so the area is multiplied by ' + k9b + ' × ' + k9b + ' = ' + (k9b * k9b) + '. Then ' + (k9b * k9b) + ' × ' + ar9 + ' = ' + nf(bigA) + ' cm².'),
      options: o9b, correct: o9b[0], showWork: true
    }, rng);
  }

  /* ── Problema 10 ── */
  var pl = pick([[4, 12, [4, 6, 7]], [3, 12, [3, 5, 6]], [3, 15, [3, 4, 6]]], rng);
  var pc = pl[0], pm = pl[1], sides = pl[2];
  var fct = pm / pc;
  var planPer = sides[0] + sides[1] + sides[2];
  var realPer = planPer * fct;
  var o10 = [nf(realPer) + ' m', nf((sides[0] + sides[1]) * fct) + ' m', nf(planPer) + ' m', nf(planPer * fct * fct) + ' m'];
  pushProb({
    title: L('Del plano al terreno', 'From the plan to the land'),
    questionText: L('En el plano de un terreno triangular, un lado dibujado de ' + pc + ' cm corresponde a ' + pm + ' m reales. Los tres lados del terreno aparecen en el plano con ' + sides[0] + ' cm, ' + sides[1] + ' cm y ' + sides[2] + ' cm. La familia quiere cercar todo el contorno del terreno. ¿Cuántos metros de cerca necesita?',
                    'On the plan of a triangular plot, a drawn side of ' + pc + ' cm corresponds to ' + pm + ' real metres. The three sides of the plot appear on the plan as ' + sides[0] + ' cm, ' + sides[1] + ' cm and ' + sides[2] + ' cm. The family wants to fence the whole outline of the plot. How many metres of fence do they need?'),
    hint: L('El plano y el terreno son figuras semejantes: primero averigua cuántos metros reales representa cada centímetro dibujado y después aplica ese valor a todo el contorno.',
            'The plan and the plot are similar figures: first work out how many real metres each drawn centimetre stands for, and then apply that value to the whole outline.'),
    explanation: L('Cada centímetro del plano vale ' + frac(pm, pc) + ' = ' + nf(fct) + ' m. El contorno dibujado mide ' + sides[0] + ' + ' + sides[1] + ' + ' + sides[2] + ' = ' + planPer + ' cm, así que la cerca es ' + planPer + ' × ' + nf(fct) + ' = ' + nf(realPer) + ' m.',
                   'Each centimetre on the plan stands for ' + frac(pm, pc) + ' = ' + nf(fct) + ' m. The drawn outline measures ' + sides[0] + ' + ' + sides[1] + ' + ' + sides[2] + ' = ' + planPer + ' cm, so the fence is ' + planPer + ' × ' + nf(fct) + ' = ' + nf(realPer) + ' m.'),
    options: o10, correct: o10[0], showWork: true
  }, rng);
}
</script>

<!-- LIAXA ANALYTICS -->
<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbz210eFtEC9kduZdp_1O9aPwr3-z0tob2zILE8PxXj-Ms6tT3F9VIgH7mRpKwVluogp/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
</body>
