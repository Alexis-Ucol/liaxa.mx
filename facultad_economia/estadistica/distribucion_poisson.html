<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Distribución de Poisson: contar eventos en el tiempo y el espacio · Estadística</title>
<link rel="canonical" href="https://liaxa.mx/facultad_economia/distribucion_poisson.html">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS ── fallback only; applyBranding() re-injects from SCHOOL ── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;
  --gold-bg:    #faf3e0;
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;   /* dark-mode PRIMARY (overridden by applyBranding) */
  --green-dark: #7aaae0;   /* dark-mode PRIMARY dark */
  --green-bg:   #0e1e38;   /* dark-mode PRIMARY tint */
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; object-fit:contain; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; min-width:0; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── LANGUAGE TOGGLE ── */
.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }
.dlist { font-family:'IBM Plex Mono',monospace; font-size:.78rem; color:var(--green-dark); background:var(--surface2); border-radius:8px; padding:.6rem .7rem; margin:.6rem 0; word-break:break-word; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); overflow-x:auto; }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── INTERACTIVE WIDGETS ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.iw-head { display:flex; align-items:baseline; gap:.6rem; margin-bottom:.3rem; flex-wrap:wrap; }
.iw-tag { font-size:.62rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; }
.iw-title { font-family:'Crimson Pro',serif; font-size:1.08rem; font-weight:700; }
.iw-sub { font-size:.8rem; color:var(--text2); margin-bottom:.85rem; }
.iw-canvas { display:block; width:100%; border-radius:8px; background:var(--surface2); }
.iw-read { margin-top:.85rem; background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 8px 8px 0; padding:.7rem .85rem; font-size:.82rem; color:var(--text2); }
.iw-read strong { color:var(--green-dark); }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (widget toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.3rem .7rem; font-size:.76rem; cursor:pointer; color:var(--text2); transition:all .14s; font-family:inherit; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--gold-bg); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }

/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos { gap: .9rem; }
  .wlogos img { height: 38px; max-width: 42%; }
  .wtitle { font-size: 1.35rem; }
  .stickybar { padding: .5rem .55rem; gap: .38rem; }
  .htitle { display: none; }
  .halexis { display: none; }
  .hsep { display: none; }
  .hlogos { gap: .3rem; }
  .hlogos img { height: 18px; max-width: 60px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 78px; overflow: hidden; text-overflow: ellipsis; }
  .lang-btn { padding: .26rem .48rem; font-size: .68rem; }
  .lbody { padding: 1.2rem .7rem 3rem; max-width: 100%; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .gcrd { padding: .9rem .75rem; }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}
/* ── Poisson guide: worked examples, tables, widget controls ── */
.wex{background:var(--surface2);border:1px solid var(--border);border-left:4px solid var(--gold);border-radius:0 10px 10px 0;padding:.9rem 1.1rem;margin:1rem 0}
.wex-t{font-family:'Crimson Pro',serif;font-weight:700;font-size:1.05rem;margin-bottom:.4rem;color:var(--green-dark)}
.wex p{margin-bottom:.55rem}
.pz-tbl{overflow-x:auto;margin:.6rem 0;-webkit-overflow-scrolling:touch}
.ptable,.pz-tbl table{border-collapse:collapse;width:100%;font-size:.82rem;min-width:260px}
.ptable th,.ptable td,.pz-tbl th,.pz-tbl td{border:1px solid var(--border);padding:.35rem .5rem;text-align:center}
.ptable th,.pz-tbl th{background:var(--green-bg);color:var(--green-dark);font-weight:600}
.pz-scn{background:var(--surface2);border-radius:8px;padding:.8rem .9rem;margin:.6rem 0;font-size:.92rem}
.pz-row{display:flex;flex-wrap:wrap;gap:.5rem;margin:.6rem 0}
.pz-btn{font:inherit;font-size:.85rem;padding:.5rem .9rem;border:1.5px solid var(--border);background:var(--surface);color:var(--text);border-radius:8px;cursor:pointer;min-height:40px}
.pz-btn:hover{border-color:var(--green)}
.pz-btn.on{background:var(--green);color:#fff;border-color:var(--green)}
.pz-btn.pz-ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.pz-btn.pz-bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.pz-inputs{display:flex;flex-wrap:wrap;gap:.7rem;margin:.6rem 0}
.pz-field{display:flex;flex-direction:column;gap:.2rem;font-size:.78rem;color:var(--text2)}
.pz-inp{font:inherit;padding:.45rem .6rem;border:1.5px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);width:9rem;font-size:.9rem}
.pz-inp.ok{border-color:var(--ok);background:var(--ok-bg)}
.pz-inp.bad{border-color:var(--bad);background:var(--bad-bg)}
.pz-chips{display:flex;flex-wrap:wrap;gap:.35rem;margin:.6rem 0}
.pz-chip{min-width:36px;min-height:36px;border:1.5px solid var(--border);background:var(--surface);color:var(--text);border-radius:8px;cursor:pointer;font:inherit;font-size:.85rem}
.pz-chip.on{background:var(--gold);border-color:var(--gold);color:#1a1a16;font-weight:700}
.pz-legend{font-size:.75rem;color:var(--text2);margin:.4rem 0}
.pz-ms{list-style:none;margin:.5rem 0 .8rem;padding:0;font-size:.82rem}
.pz-m{padding:.3rem .5rem;border-radius:6px;color:var(--text2);margin-bottom:.2rem}
.pz-m.done{background:var(--ok-bg);color:var(--text)}
.pz-chk{font-size:1rem;margin-right:.3rem}
.pz-mc{font-weight:600;font-size:.78rem;margin-top:.3rem;color:var(--green-dark)}
.verify-btn{background:var(--green);color:#fff;border:none;border-radius:8px;padding:.55rem 1.2rem;font:inherit;font-size:.85rem;font-weight:600;cursor:pointer;margin:.3rem .3rem .3rem 0}
.verify-btn:hover{background:var(--green-dark)}
.verify-btn:disabled{opacity:.5;cursor:default}
.be-row{display:flex;align-items:center;gap:.8rem;margin:.6rem 0}
.be-lbl{font-weight:600;font-size:.9rem;white-space:nowrap}
.cval{color:var(--green-dark)}
.be-cell{background:var(--surface2);border-radius:8px;padding:.5rem .7rem;text-align:center}
.be-clbl{font-size:.7rem;color:var(--text3)}
.be-cval{font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--green-dark)}
.iw-fb{margin-top:.7rem;font-size:.85rem;padding:.6rem .8rem;border-radius:8px;background:var(--surface2);border-left:4px solid var(--border);color:var(--text)}
.iw-fb:empty{display:none}
.iw-fb.good{background:var(--ok-bg);border-left-color:var(--ok)}
.iw-fb.miss,.iw-fb.bad{background:var(--bad-bg);border-left-color:var(--bad)}
.iw-fb.warm{background:var(--gold-bg);border-left-color:var(--gold)}
.wnudge{font-size:.8rem;color:var(--bad);margin:.3rem 0;min-height:0}
.wnudge:empty{display:none}
.metric .mlbl{text-transform:none;letter-spacing:.02em}
.pz-tbl th:first-child{white-space:nowrap}
.pz-form{font-size:1.15rem;text-align:center;margin:.8rem 0;padding:.9rem .5rem;background:var(--surface2);border-radius:10px;overflow-x:auto}

/* ════════════════════════════════════════════════════════════════════════
   ATTEMPT COUNTER + SEEDED RNG
   nextAttempt()    → fresh start: increments counter, new numbers each time
   currentAttempt() → session restore: reads without incrementing, same numbers
   ════════════════════════════════════════════════════════════════════════ */
function getAttemptKey(name, group) {
  return 'liaxa_fac_poisson__att__' + (name + '__' + group).replace(/\s+/g, '_');
}
function nextAttempt(name, group) {
  var k = getAttemptKey(name, group), n = 0;
  try { n = parseInt(localStorage.getItem(k) || '0', 10) || 0; } catch(e) {}
  n++;
  try { localStorage.setItem(k, String(n)); } catch(e) {}
  return n;
}
function currentAttempt(name, group) {
  var k = getAttemptKey(name, group);
  try { return parseInt(localStorage.getItem(k) || '1', 10) || 1; } catch(e) { return 1; }
}
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t2 = s ^ (s >>> 16);
    t2 = Math.imul(t2, 0x21f0aaad);
    t2 ^= (t2 >>> 15);
    t2 = Math.imul(t2, 0x735a2d97);
    return ((t2 ^ (t2 >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}
/* Shuffles four options once; keeps both language versions aligned.
   Index 0 of rawEs/rawEn must always be the correct answer. */
function shuffleOpts(rawEs, rawEn, rng) {
  var p = shuffle([0, 1, 2, 3], rng);
  return {
    es: p.map(function(j) { return rawEs[j]; }),
    en: p.map(function(j) { return rawEn[j]; }),
    correctIdx: p.indexOf(0)
  };
}

/* ════════════════════════════════════════════════════════════════════════
   SESSION PERSISTENCE
   ════════════════════════════════════════════════════════════════════════ */
function lsKey() {
  var n = (studentData.name || '').trim(), g = (studentData.group || '').trim();
  return 'liaxa_fac_poisson__' + (n + '__' + g).replace(/\s+/g, '_');
}
function saveSession() {
  if (!studentData.name) return;
  var drawings = [], texts = [], photos = [];
  problems.forEach(function(p, i) {
    var dc = document.getElementById('dc' + i);
    if (dc && dc.width) {
      var blank = document.createElement('canvas');
      blank.width = dc.width; blank.height = dc.height;
      drawings.push(dc.toDataURL() === blank.toDataURL() ? null : dc.toDataURL('image/png'));
    } else { drawings.push(null); }
    var ta = document.getElementById('ta' + i);
    texts.push(ta ? ta.value : '');
    var pp = document.getElementById('pp' + i);
    photos.push((pp && pp.src && pp.src.indexOf('data:') === 0) ? pp.src : null);
  });
  var state = {
    name: studentData.name, group: studentData.group,
    answeredCount: answeredCount, correctCount: correctCount,
    choices: problems.map(function(p) { return p.studentChoice; }),
    drawings: drawings, texts: texts, photos: photos
  };
  try { localStorage.setItem(lsKey(), JSON.stringify(state)); } catch(e) {}
}
function loadSession(name, group) {
  var key = 'liaxa_fac_poisson__' + (name + '__' + group).replace(/\s+/g, '_');
  try { var r = localStorage.getItem(key); return r ? JSON.parse(r) : null; } catch(e) { return null; }
}
function dismissRestore() { document.getElementById('restoreBar').style.display = 'none'; }
function checkForSavedSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  if (!name || !group) { document.getElementById('restoreBar').style.display = 'none'; return; }
  var saved = loadSession(name, group);
  var bar = document.getElementById('restoreBar');
  bar.style.display = (saved && saved.choices && saved.choices.some(function(c) { return c !== null; })) ? 'block' : 'none';
}
function observeSections() {
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
}

/* ════════════════════════════════════════════════════════════════════════
   START / RESTORE

function startLesson() {

  if (!name || !group) { err.textContent = t('err-fields'); return; }

  document.getElementById('lessonScreen').style.display  = 'block';

  document.getElementById('studentChip').textContent = name + ' · ' + group;
  observeSections();
}
function restoreSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  var saved = loadSession(name, group);
  if (!saved) return;
  document.getElementById('restoreBar').style.display = 'none';
  studentData = { name: name, group: group, startTs: Date.now() };
  answeredCount = 0; correctCount = 0;
  var att = currentAttempt(name, group);
  var rng = seededRng(name + group + att);
  buildLesson(rng);
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  setTimeout(redrawAll, 60);
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  observeSections();
  saved.choices.forEach(function(choice, idx) {
    if (choice !== null && choice !== undefined) confirmMC(idx, choice);
  });
  setTimeout(function() {
    if (saved.drawings) saved.drawings.forEach(function(dataUrl, i) {
      if (!dataUrl) return;
      var dc = document.getElementById('dc' + i);
      if (!dc || !dc.width) return;
      var img = new Image();
      img.onload = function() {
        var dpr = window.devicePixelRatio || 1;
        dc.getContext('2d').drawImage(img, 0, 0, dc.width / dpr, dc.height / dpr);
      };
      img.src = dataUrl;
    });
    if (saved.texts) saved.texts.forEach(function(txt, i) {
      if (!txt) return;
      var ta = document.getElementById('ta' + i);
      if (ta) ta.value = txt;
    });
    if (saved.photos) saved.photos.forEach(function(dataUrl, i) {
      if (!dataUrl) return;
      var pp = document.getElementById('pp' + i);
      if (!pp) return;
      pp.src = dataUrl; pp.style.display = 'block';
      var pz = document.getElementById('pz' + i);
      if (pz) pz.style.opacity = '0.4';
    });
  }, 300);
}

/* ════════════════════════════════════════════════════════════════════════
   CANVAS
   ════════════════════════════════════════════════════════════════════════ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = SCHOOL.primary;
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e) { e.preventDefault(); canvas.dataset.inked = '1'; drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e) { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(p[0], p[1]); ctx.stroke(); lx = p[0]; ly = p[1]; }
  function onUp() { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr); canvas.dataset.inked = '0';
  });
}

/* ════════════════════════════════════════════════════════════════════════
   TABS / PHOTO / HINT
   ════════════════════════════════════════════════════════════════════════ */
function switchTab(idx, panel, btn) {
  var prefix = 'wp_' + idx + '_';
  document.querySelectorAll('[id^="' + prefix + '"]').forEach(function(p) { p.classList.remove('active'); });
  document.getElementById(prefix + panel).classList.add('active');
  btn.closest('.wtabs').querySelectorAll('.wtab').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
}
function handlePhoto(idx, input) {
  if (!input.files || !input.files[0]) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    var img = document.getElementById('pp' + idx);
    img.src = e.target.result;
    img.style.display = 'block';
    document.getElementById('pz' + idx).style.opacity = '0.4';
    saveSession();
  };
  reader.readAsDataURL(input.files[0]);
}
function toggleHint(idx) { document.getElementById('hint' + idx).classList.toggle('show'); }

/* ════════════════════════════════════════════════════════════════════════
   ANSWER HANDLER · two taps to confirm
   First tap  → highlights in gold (pending).
   Second tap → confirms, shows feedback, saves.
   ════════════════════════════════════════════════════════════════════════ */
function hasWork(i) {
  var dc = document.getElementById('dc' + i);
  var ta = document.getElementById('ta' + i);
  var pp = document.getElementById('pp' + i);
  var drawn = dc && dc.dataset.inked === '1';
  var typed = ta && ta.value.trim().length >= 15;
  var photo = pp && pp.src && pp.src.indexOf('data:') === 0;
  return !!(drawn || typed || photo);
}
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var nd = document.getElementById('nudge' + probIdx);
  if (prob.showWork && !hasWork(probIdx)) { if (nd) nd.textContent = t('nudge'); return; }
  if (nd) nd.textContent = '';
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = '<strong>' + (isOk ? t('fb-correct') : t('fb-wrong')) + '</strong> ' + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}
/* Direct confirm — used by restoreSession to skip the two-tap requirement. */
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (!prob || prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = '<strong>' + (isOk ? t('fb-correct') : t('fb-wrong')) + '</strong> ' + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

/* ════════════════════════════════════════════════════════════════════════
   CANVAS PRIMITIVES FOR INTERACTIVE WIDGETS
   fitCanvas(cv, heightPx) → { ctx, w, h }
   palette()               → color map from current CSS vars
   cssv(name)              → read a CSS variable
   ════════════════════════════════════════════════════════════════════════ */
function cssv(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function fitCanvas(cv, h) {
  var dpr = window.devicePixelRatio || 1;
  var w = Math.max(240, cv.clientWidth || cv.parentNode.clientWidth || 300);
  cv.style.height = h + 'px';
  cv.width  = Math.round(w * dpr);
  cv.height = Math.round(h * dpr);
  var ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  return { ctx: ctx, w: w, h: h };
}
function palette() {
  return {
    green: cssv('--green'), dark: cssv('--green-dark'), tint: cssv('--green-bg'),
    gold: cssv('--gold'), bad: cssv('--bad'), border: cssv('--border'),
    text: cssv('--text'), text2: cssv('--text2'), text3: cssv('--text3')
  };
}

function applyUIStrings() {

function applyProblemLang() {
  problems.forEach(function(p, i) {
    var card = document.getElementById('pc' + i);
    if (!card || !p.i18n) return;
    p.title        = p.i18n.title[LANG];
    p.questionText = p.i18n.q[LANG];
    p.hint         = p.i18n.hint[LANG];
    p.explanation  = p.i18n.exp[LANG];
    p.options      = p.i18n.opts[LANG].slice();
    var ti = card.querySelector('.ptitle'); if (ti) ti.textContent = p.title;
    var st = card.querySelector('.pstmt');
    if (st) st.innerHTML = p.questionText + '<span class="pfn">' + (p.fn || '') + '</span>';
    var hb = card.querySelector('.hintbox'); if (hb) hb.innerHTML = p.hint;
    var hbtn = card.querySelector('.hintbtn'); if (hbtn) hbtn.textContent = t('btn-hint');
    card.querySelectorAll('.mcopt').forEach(function(o, oi) {
      if (p.options[oi] !== undefined) o.innerHTML = p.options[oi];
    });
    var tabs = card.querySelectorAll('.wtab');
    if (tabs.length === 3) {
      tabs[0].textContent = t('tab-draw');
      tabs[1].textContent = t('tab-type');
      tabs[2].textContent = t('tab-photo');
    }
    var tools = card.querySelectorAll('.tbtn2');
    if (tools.length === 3) {
      tools[0].textContent = t('tool-pen');
      tools[1].textContent = t('tool-mark');
      tools[2].textContent = t('tool-erase');
    }
    var clr = card.querySelector('.clrbtn'); if (clr) clr.textContent = t('tool-clear');
    var ta  = card.querySelector('.wtextarea'); if (ta) ta.placeholder = t('ph-work');
    var pzt = card.querySelector('.pztxt'); if (pzt) pzt.textContent = t('ph-photo');
    var lab = card.querySelector('.pbody > div:last-child > div:first-child');
    if (lab) lab.textContent = t('lbl-answer');
    var fb = card.querySelector('.mcfb');
    if (fb && fb.classList.contains('show')) {
      var isOk = (p.studentChoice === p.correctIdx);
      fb.innerHTML = '<strong>' + (isOk ? t('fb-correct') : t('fb-wrong')) + '</strong> ' + p.explanation;
    }
  });
}
function setLang(l) {
  LANG = l;
  try { localStorage.setItem(LANG_KEY, l); } catch(e) {}
  document.documentElement.setAttribute('lang', l);
  var be = document.getElementById('btn-es'), bn = document.getElementById('btn-en');
  if (be) be.classList.toggle('active', l === 'es');
  if (bn) bn.classList.toggle('active', l === 'en');
  applyUIStrings();
  applySectionLang();
  applyProblemLang();
  widgets.forEach(function(f) { try { f(); } catch(e) {} });
  document.querySelectorAll('#lessonBody .section').forEach(function(s) { s.classList.add('vis'); });
}
(function() {
  try { var stored = localStorage.getItem(LANG_KEY); if (stored === 'es' || stored === 'en') LANG = stored; } catch(e) {}
  document.addEventListener('DOMContentLoaded', function() {
    document.documentElement.setAttribute('lang', LANG);

    if (be) be.classList.toggle('active', LANG === 'es');

  });
})();

/* ════════════════════════════════════════════════════════════════════════
   PDF GENERATION
   · Synchronous (NOT async) — jsPDF is fully synchronous, and declaring
     this function async breaks Safari's user-gesture chain on iOS/iPadOS,
     causing the Share Sheet / window.open to be silently blocked.
   · iOS/iPadOS: uses navigator.share() → Share Sheet → "Save to Files".
     Falls back to window.open(blob) if Web Share API unavailable.
   · Desktop / Android: standard <a download> click.
   · All text strings go through t() for bilingual support.
   · Colors come from SCHOOL.pBR/pBG/pBB (primary) and pAR/pAG/pAB (accent).
   ════════════════════════════════════════════════════════════════════════ */
function generatePDF() {
  var btn = document.getElementById('dlBtn');
  btn.textContent = t('pdf-busy');
  btn.disabled = true;

  try {
  var jspdf = window.jspdf;
  var doc   = new jspdf.jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });
  var PW    = 215.9, M = 18, TW = PW - M * 2;
  var PH    = doc.internal.pageSize.height;
  var name  = studentData.name, group = studentData.group;
  var total = problems.length;
  var pct   = Math.round(correctCount / total * 100);
  var dateStr = new Date().toLocaleString(LANG === 'es' ? 'es-MX' : 'en-US', { dateStyle:'long', timeStyle:'short' });

  /* Verification code — unique per student+score+date */
  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;

  function pdfText(html) {
    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/→/g,'->').replace(/−/g,'-').replace(/²/g,'^2').replace(/³/g,'^3')
      .replace(/×/g,'x').replace(/÷/g,'/').replace(/≠/g,'!=').replace(/≤/g,'<=')
      .replace(/≥/g,'>=').replace(/√/g,'sqrt').replace(/π/g,'pi').replace(/…/g,'...')
      .replace(/\s+/g,' ').trim();
  }

  /* ── Cover page ── */
  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,2,'F');
  doc.setFillColor(255,255,255); doc.rect(0,2,PW,26,'F');
  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,28,PW,2,'F');
  doc.setFillColor(pBR,pBG,pBB); doc.rect(0,30,PW,34,'F');

  /* Institution logos */
  if (SCHOOL.logoLeftB64) {
    var fmtL = SCHOOL.logoLeftB64.indexOf('/9j/') > -1 ? 'JPEG' : 'PNG';
    try { doc.addImage(SCHOOL.logoLeftB64,  fmtL, M,  4.0, 22, 22); } catch(e) {}
  }
  if (SCHOOL.logoRightB64) {
    var fmtR = SCHOOL.logoRightB64.indexOf('/9j/') > -1 ? 'JPEG' : 'PNG';
    try { doc.addImage(SCHOOL.logoRightB64, fmtR, 48, 4.5, 48, 21); } catch(e) {}
  }

  /* LIAXA mark — always LIAXA brand blue + gold, never school colors */
  var lx = PW - M - 36, ly = 10;
  doc.setDrawColor(26,74,138); doc.setLineWidth(0.7);
  doc.lines([[2.57-1.03,4.63-6.17],[4.11-2.57,5.14-4.63],[5.66-4.11,2.57-5.14]], lx+1.03, ly+6.17);
  doc.setFillColor(201,168,76); doc.circle(lx+5.66, ly+2.57, 0.9, 'F');
  doc.setDrawColor(201,168,76); doc.setLineWidth(0.7);
  doc.line(lx+8.23, ly+1.54, lx+8.23, ly+7.2);
  doc.setTextColor(26,74,138); doc.setFontSize(11); doc.setFont('helvetica','bold');
  doc.text('LIAXA', lx+10, ly+6.8);

  /* Title band */
  doc.setTextColor(240,244,238); doc.setFontSize(15); doc.setFont('helvetica','bold');
  doc.text(SCHOOL.guideTitle[LANG], M, 49);
  doc.setTextColor(198,214,192); doc.setFontSize(8); doc.setFont('helvetica','normal');
  doc.text(dateStr, M, 59);

  /* Student card */
  doc.setFillColor(237,240,245); doc.roundedRect(M,72,TW,20,3,3,'F');
  doc.setTextColor(130,140,160); doc.setFontSize(8.5); doc.setFont('helvetica','bold');
  doc.text(t('pdf-student'), M+4, 79); doc.text(t('pdf-group'), 130, 79);
  doc.setTextColor(20,24,32); doc.setFontSize(11); doc.setFont('helvetica','bold');
  doc.text(name, M+4, 87); doc.text(group, 130, 87);

  /* Score box */
  var sc = pct>=70?[26,106,74]:pct>=50?[224,123,26]:[176,48,16];
  doc.setFillColor(255,255,255); doc.roundedRect(M,100,TW,34,4,4,'F');
  doc.setDrawColor(sc[0],sc[1],sc[2]); doc.setLineWidth(0.8);
  doc.roundedRect(M,100,TW,34,4,4,'S');
  doc.setTextColor(sc[0],sc[1],sc[2]); doc.setFontSize(40); doc.setFont('helvetica','bold');
  doc.text(pct+'%', PW/2, 124, {align:'center'});
  doc.setTextColor(130,140,160); doc.setFontSize(8.5); doc.setFont('helvetica','normal');
  doc.text(correctCount+' '+t('pdf-score')+' '+total+' '+t('pdf-questions'), PW/2, 131, {align:'center'});

  /* Summary bar */
  doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
  doc.setFontSize(7); doc.setFont('helvetica','bold');
  doc.rect(M,142,TW,8,'F'); doc.text(t('pdf-summary'), M+4, 148);
  var sy = 154;
  problems.forEach(function(prob, i) {
    if (sy + 12 > PH - 15) {
      doc.addPage(); sy = 20;
      doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
      doc.setFontSize(7); doc.setFont('helvetica','bold');
      doc.rect(M,sy,TW,8,'F'); doc.text(t('pdf-summary2'), M+4, sy+6); sy += 12;
    }
    var ok = document.getElementById('pc'+i).classList.contains('ok');
    doc.setFillColor(ok?232:255, ok?240:232, ok?232:228);
    doc.roundedRect(M,sy,TW,10,2,2,'F');
    doc.setFillColor(ok?26:176, ok?106:48, ok?74:16);

     cause window.open / navigator.share to be silently blocked on iOS.

     iOS/iPadOS strategy (in order of preference):
       1. navigator.share({ files }) → native Share Sheet → "Save to Files"
       2. window.open(blobUrl, '_blank') → opens PDF inline in Safari
       3. location.href = blobUrl → same-tab fallback if popup is blocked

     Desktop / Android: standard <a download> click.
     ──────────────────────────────────────────────────────────────────────── */
  var _fn   = SCHOOL.filePrefix + '_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf';
  var _blob = doc.output('blob');

  function _restoreBtn() { btn.textContent = t('btn-pdf'); btn.disabled = false; }
  function _openInline(b) {
    var u = URL.createObjectURL(b);
    var w = window.open(u, '_blank');
    if (!w) { window.location.href = u; }          // popup blocked → same tab
    setTimeout(function(){ URL.revokeObjectURL(u); }, 60000);
  }

  /* iPadOS 13+ reports platform === 'MacIntel' with touch support */
  var _isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
               (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  if (_isIOS) {
    /* Prefer Web Share API with file — triggers "Save to Files" natively */
    var _file = new File([_blob], _fn, { type: 'application/pdf' });
    if (navigator.canShare && navigator.canShare({ files: [_file] })) {
      navigator.share({ files: [_file], title: _fn })
        .then(_restoreBtn)
        .catch(function(e) {
          if (e && e.name === 'AbortError') { _restoreBtn(); return; } /* user cancelled */
          _openInline(_blob); _restoreBtn();
        });
      return;   /* button state restored inside the promise callbacks above */
    }
    /* Older iOS without Web Share API — open blob inline */
    _openInline(_blob);
    _restoreBtn();
    return;
  }

  /* Desktop + Android — standard anchor-download */
  var _dlUrl = URL.createObjectURL(_blob);
  var _dlA   = document.createElement('a');
  _dlA.href  = _dlUrl; _dlA.download = _fn;
  document.body.appendChild(_dlA); _dlA.click();
  setTimeout(function(){ document.body.removeChild(_dlA); URL.revokeObjectURL(_dlUrl); }, 200);
  _restoreBtn();

  } catch (err) {
    btn.textContent = t('btn-pdf');
    btn.disabled = false;
  }
}

function lnFact(n){var s=0;for(var i=2;i<=n;i++)s+=Math.log(i);return s;}
function pmf(l,k){if(k<0)return 0;return Math.exp(-l+(k>0?k*Math.log(l):0)-lnFact(k));}
function cdf(l,k){if(k<0)return 0;var s=0;for(var i=0;i<=k;i++)s+=pmf(l,i);return Math.min(1,s);}
function binomPmf(n,p,k){var lc=0;for(var i=1;i<=k;i++)lc+=Math.log((n-k+i)/i);return Math.exp(lc+k*Math.log(p)+(n-k)*Math.log(1-p));}
function poisSample(l,rng){var Lm=Math.exp(-l),k=0,p=1;do{k++;p*=rng();}while(p>Lm);return k-1;}
function fx(x,d){return Number(x).toFixed(d);}
function pc(x,d){return (x*100).toFixed(d===undefined?1:d)+'%';}
function clean(x){return String(+Number(x).toFixed(2));}
function rint(rng,a,b){return a+Math.floor(rng()*(b-a+1));}
function fr(n,d){return '<span class="mf-outer"><span class="mf-num">'+n+'</span><span class="mf-den">'+d+'</span></span>';}
function num(v){return parseFloat(String(v).replace(',','.'));}
function meanOf(a){var s=0;a.forEach(function(x){s+=x;});return s/a.length;}
function svar(a){var m=meanOf(a),s=0;a.forEach(function(x){s+=(x-m)*(x-m);});return s/(a.length-1);}
function pvar(a){var m=meanOf(a),s=0;a.forEach(function(x){s+=(x-m)*(x-m);});return s/a.length;}
function sumOf(a){var s=0;a.forEach(function(x){s+=x;});return s;}

/* Four distinct options; vals[0] = correct; never perturbs the correct value.
   Guards exact duplicates AND near-duplicates (within 2 %) */
function distinctN(vals,fmtFn,lo,hi){
  var outV=[],outS=[];
  for(var i=0;i<vals.length;i++){
    var v=vals[i],s=fmtFn(v),tries=0;
    function dup(vv,ss){
      if(outS.indexOf(ss)!==-1)return true;
      for(var j=0;j<outV.length;j++){if(Math.abs(vv-outV[j])<=0.02*Math.max(Math.abs(outV[j]),1e-9))return true;}
      return false;
    }
    while(i>0&&dup(v,s)&&tries<60){
      tries++;
      var mag=1+0.06*Math.ceil(tries/2);
      v=(tries%2)?vals[i]*mag:vals[i]/mag;
      if(hi!==undefined&&v>hi)v=vals[i]/mag;
      if(lo!==undefined&&v<lo)v=vals[i]*mag;
      s=fmtFn(v);
    }
    outV.push(v);outS.push(s);
  }
  return outS;
}

/* Bar chart of the Poisson pmf. o: {h,kmax,sel,hi,mean,sd,sim,normal}. Returns geometry. */
function niceStep(x){var c=[0.005,0.01,0.02,0.025,0.05,0.1,0.2,0.25,0.5,1];for(var i=0;i<c.length;i++)if(c[i]>=x)return c[i];return 1;}
function tickFmt(v,step){return step>=0.1?v.toFixed(1):(step>=0.01?v.toFixed(2):v.toFixed(3));}
function drawBars(cv,lam,o){
  o=o||{};
  var kmax=(o.kmax!==undefined)?o.kmax:Math.min(40,Math.ceil(lam+5*Math.sqrt(lam)+3));
  var g=fitCanvas(cv,o.h||200),ctx=g.ctx,W=g.w,H=g.h,P=palette();
  var ox=56,oy=H-30,rp=10,tp=12,n=kmax+1,bw=(W-ox-rp)/n,k,v;
  var vals=[],ymax=0.001;
  for(k=0;k<=kmax;k++){v=pmf(lam,k);vals.push(v);if(v>ymax)ymax=v;if(o.sim&&o.sim[k]>ymax)ymax=o.sim[k];}
  var step=niceStep(ymax/4),top=Math.ceil(ymax/step-1e-9)*step;
  function py(y){return oy-(y/top)*(oy-tp);}
  function px(x){return ox+x*bw;}
  ctx.font='10px IBM Plex Sans,sans-serif';
  for(var t=0;t<=top+1e-9;t+=step){
    ctx.strokeStyle=P.border;ctx.lineWidth=.7;ctx.beginPath();ctx.moveTo(ox,py(t));ctx.lineTo(W-rp,py(t));ctx.stroke();
    ctx.fillStyle=P.text3;ctx.textAlign='right';ctx.fillText(tickFmt(t,step),ox-5,py(t)+3);
  }
  if(o.sd){
    var a=Math.max(0,lam-Math.sqrt(lam)),b=lam+Math.sqrt(lam);
    ctx.fillStyle=P.tint;ctx.fillRect(px(a)+bw/2,tp,(b-a)*bw,oy-tp);
  }
  for(k=0;k<=kmax;k++){
    var on=(o.sel&&o.sel[k])||(o.hi&&o.hi.indexOf(k)!==-1);
    ctx.fillStyle=on?P.gold:P.green;
    var y=py(vals[k]);
    ctx.fillRect(px(k)+bw*0.1,y,bw*0.8,oy-y);
    ctx.fillStyle=P.text3;ctx.textAlign='center';ctx.font=(bw<17?'9px':'10px')+' IBM Plex Sans,sans-serif';
    ctx.fillText(k,px(k)+bw/2,oy+13);
  }
  ctx.strokeStyle=P.text3;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(ox,tp);ctx.lineTo(ox,oy);ctx.lineTo(W-rp,oy);ctx.stroke();
  if(o.normal){
    ctx.strokeStyle=P.text;ctx.lineWidth=1.6;ctx.beginPath();
    var sg=Math.sqrt(lam),first=true;
    for(var x=0;x<=kmax;x+=0.2){
      var d=(x-lam)/sg,yv=Math.exp(-0.5*d*d)/(sg*Math.sqrt(2*Math.PI));
      var X=px(x)+bw/2,Y=py(Math.min(yv,top));
      if(first){ctx.moveTo(X,Y);first=false;}else ctx.lineTo(X,Y);
    }
    ctx.stroke();
  }
  if(o.mean){
    ctx.setLineDash([4,3]);ctx.strokeStyle=P.bad;ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(px(lam)+bw/2,tp);ctx.lineTo(px(lam)+bw/2,oy);ctx.stroke();ctx.setLineDash([]);
  }
  if(o.sim){
    for(k=0;k<=kmax;k++){
      if(o.sim[k]>0){ctx.fillStyle=P.gold;ctx.strokeStyle=P.text;ctx.lineWidth=1;
        ctx.beginPath();ctx.arc(px(k)+bw/2,py(o.sim[k]),3.6,0,Math.PI*2);ctx.fill();ctx.stroke();}
    }
  }
  ctx.fillStyle=P.text3;ctx.font='10px IBM Plex Sans,sans-serif';ctx.textAlign='center';
  ctx.fillText('k',ox+(W-ox-rp)/2,H-3);
  ctx.save();ctx.translate(11,(tp+oy)/2);ctx.rotate(-Math.PI/2);ctx.fillText('P(X = k)',0,0);ctx.restore();
  cv._g={ox:ox,bw:bw,kmax:kmax};
  return cv._g;
}

function drawDots(cv,data){

    ctx.fillStyle=P.text3;ctx.fillText(v,x,oy+16);

/* Dispersion data generator. kind: 'ok' | 'over' | 'under' */
function genDisp(kind,n,rng){
  var mu=rint(rng,3,7),tries=0,data,m,v,D=0,i;
  while(tries<800){
    tries++;data=[];
    if(kind==='ok'){for(i=0;i<n;i++)data.push(poisSample(mu,rng));}
    else if(kind==='over'){
      var lo=Math.max(1,mu*0.4),hi=mu*1.9;
      for(i=0;i<n;i++)data.push(poisSample(i%2===0?lo:hi,rng));
      data=shuffle(data,rng);
    }else{for(i=0;i<n;i++)data.push(mu+rint(rng,-1,1));}
    m=meanOf(data);v=svar(data);if(m<=0)continue;D=v/m;
    if(kind==='ok'&&D>=0.65&&D<=1.5)break;
    if(kind==='over'&&D>=2.3)break;
    if(kind==='under'&&D<=0.4&&v>0)break;
  }
  return {data:data,mean:m,s2:v,D:D,kind:kind,mu:mu};
}

/* ══════════════════════════════════════════════════════════════════════════
   WIDGET 5 · Lambda adjustment  (Mode B · 12 rounds · t and λ)
   ══════════════════════════════════════════════════════════════════════════ */
function wLam(rng,host){
  var SEQ=['hh','hm','dd','hm','dh','wd','mh','sp','q15','s1','hm','s2'],pool={_s:[],_p:[]};
  var R=SEQ.map(function(ty){return lamRound(rng,ty,pool);}),NR=R.length;
  var st={i:0,tries:0,done:false,ok:false,tv:'',lv:'',fb:null};
  function render(){
    var head='<div class="iw-head"><span class="iw-tag">'+L({es:'Ronda',en:'Round'})+' '+Math.min(st.i+1,NR)+'/'+NR+'</span><span class="iw-title">'+L({es:'Ajuste de λ a la ventana',en:'Adjusting λ to the window'})+'</span></div>';
    if(st.done){
      host.innerHTML=head+'<div class="iw-fb good">✓ '+L({es:'Completaste las '+NR+' rondas. En todas hiciste lo mismo: expresar la ventana en la unidad de la tasa (t) y multiplicar λ = r × t. Cuando la ventana equivale a una unidad de la tasa, t = 1 y λ no cambia.',en:'You completed all '+NR+' rounds. In every one you did the same thing: express the window in the unit of the rate (t) and multiply λ = r × t. When the window equals one unit of the rate, t = 1 and λ does not change.'})+'</div>';
      return;
    }
    var q=R[st.i],rs=rateSent(q),wt=winTxt(q);
    host.innerHTML=head+
      '<div class="iw-sub">'+L({es:'Paso 1: escribe t, la ventana medida en la unidad de la tasa (puedes usar fracciones como 1/3 o decimales). Paso 2: calcula λ = r × t.',en:'Step 1: enter t, the window measured in the unit of the rate (you may use fractions like 1/3 or decimals). Step 2: compute λ = r × t.'})+'</div>'+
      '<div class="pz-scn">'+L(rs)+' '+L({es:'Se estudia la ventana <strong>'+wtxt(q.wv,q.wk).es+'</strong>.',en:'The window under study is <strong>'+wtxt(q.wv,q.wk).en+'</strong>.'})+'</div>'+
      '<div class="pz-legend">'+L({es:'La tasa está dada '+RU[q.rk].es+': la unidad es el/la '+RU[q.rk].u.es+'.',en:'The rate is given '+RU[q.rk].en+': the unit is the '+RU[q.rk].u.en+'.'})+'</div>'+
      '<div class="pz-inputs">'+
        '<div class="pz-field"><label>t</label><input class="pz-inp" data-f="t" type="text" inputmode="decimal" autocomplete="off" value="'+st.tv+'"'+(st.ok?' disabled':'')+'></div>'+
        '<div class="pz-field"><label>λ = r × t</label><input class="pz-inp" data-f="l" type="text" inputmode="decimal" autocomplete="off" value="'+st.lv+'"'+(st.ok?' disabled':'')+'></div>'+
      '</div>'+
      '<button class="verify-btn" data-a="vfy"'+(st.ok?' disabled':'')+'>'+L({es:'Verificar',en:'Check'})+'</button> '+
      (st.ok?'<button class="verify-btn" data-a="next">'+L({es:(st.i+1>=NR?'Terminar':'Siguiente ronda'),en:(st.i+1>=NR?'Finish':'Next round')})+'</button>':'')+
      '<div class="iw-fb"></div>';
    restoreFb(host,st);
    host.querySelectorAll('.pz-inp').forEach(function(inp){inp.oninput=function(){st[inp.getAttribute('data-f')==='t'?'tv':'lv']=inp.value;inp.classList.remove('ok','bad');};});

    var ttol=Math.max(0.006,0.004*q.t),tOK=Math.abs(tv-q.t)<=ttol,ltol=0.03*Math.max(1,q.lam),lOK=Math.abs(lv-q.lam)<=ltol;
    var it=host.querySelector('[data-f="t"]'),il=host.querySelector('[data-f="l"]');
    it.classList.toggle('ok',tOK);it.classList.toggle('bad',!tOK);il.classList.toggle('ok',lOK);il.classList.toggle('bad',!lOK);
    var why=tWhy(q);
    if(tOK&&lOK){
      st.ok=true;
      sayB(host,st,'good','✓ Correcto. '+why.es+' Entonces λ = '+clean(q.r)+' × '+clean(q.t)+' = <strong>'+clean(q.lam)+'</strong>.','✓ Correct. '+why.en+' So λ = '+clean(q.r)+' × '+clean(q.t)+' = <strong>'+clean(q.lam)+'</strong>.');
      render();return;
    }
    st.tries++;var es,en;
    if(!tOK){
      if(q.f!==1&&Math.abs(tv-q.wv)<=Math.max(0.006,0.004*q.wv)){es='Escribiste la ventana con sus unidades originales. t debe estar en la unidad de la tasa ('+RU[q.rk].u.es+'). Piensa cuántos de esos caben en la ventana.';en='You wrote the window in its original units. t must be in the unit of the rate ('+RU[q.rk].u.en+'). Think about how many of those fit in the window.';}
      else if(q.t!==1&&Math.abs(tv-1/q.t)<=Math.max(0.006,0.004/q.t)){es='Parece que invertiste la conversión. Si la ventana es más corta que la unidad de la tasa, t debe ser menor que 1; si es más larga, mayor que 1.';en='It looks like you inverted the conversion. If the window is shorter than the unit of the rate, t must be less than 1; if longer, greater than 1.';}

    }else{
      if(Math.abs(lv-q.r)<=ltol){es='Usaste la tasa r sin ajustarla. λ = r × t, y aquí t no es 1.';en='You used the rate r without adjusting it. λ = r × t, and here t is not 1.';}
      else if(Math.abs(lv-q.r*q.wv)<=0.03*Math.max(1,q.r*q.wv)){es='Multiplicaste r por la ventana sin convertirla. Usa t, la ventana en la unidad de la tasa.';en='You multiplied r by the window without converting it. Use t, the window in the unit of the rate.';}
      else if(Math.abs(lv-q.r/q.t)<=0.03*Math.max(1,q.r/q.t)){es='Dividiste entre t. La fórmula es λ = r × t: multiplicas.';en='You divided by t. The formula is λ = r × t: you multiply.';}
      else{es='t está bien. Ahora multiplica la tasa r por t.';en='t is right. Now multiply the rate r by t.';}
    }
    if(st.tries>=3){
      st.ok=true;st.tv=clean(q.t);st.lv=clean(q.lam);
      sayB(host,st,'warm','Solución: '+why.es+' λ = '+clean(q.r)+' × '+clean(q.t)+' = '+clean(q.lam)+'.','Solution: '+why.en+' λ = '+clean(q.r)+' × '+clean(q.t)+' = '+clean(q.lam)+'.');
      render();return;
    }
    sayB(host,st,'miss',es,en);
  }
  widgets.push(render);render();
}

/* ══════════════════════════════════════════════════════════════════════════
   WIDGET 2 and 4 · Formula builder (Mode B · tap or drag tiles into slots)
   cfg.mixed=false : lambda given, build P(X = k)          (10 rounds)
   cfg.mixed=true  : decide adjustment, lambda, build, P   (8 rounds)
   ══════════════════════════════════════════════════════════════════════════ */
function wFormula(rng,host,cfg){
  var mixed=cfg.mixed,NR=cfg.NR,pool={_s:[],_p:[]};
  var mk=function(sEs,sEn,wEs,wEn,pEs,pEn,oEs,oEn,wnEs,wnEn){
    return function(l,d,k){
      return {es:sEs+' '+clean(l)+' '+wEs+' '+pEs+', '+oEs.replace('#',d)+'. ¿Cuál es la probabilidad de que el número de '+wEs+' '+wnEs+' sea exactamente '+k+'?',
              en:sEn+' '+clean(l)+' '+wEn+' '+pEn+', '+oEn.replace('#',d)+'. What is the probability that the number of '+wEn+' '+wnEn+' is exactly '+k+'?'};
    };
  };
  var TPL=shuffle([
    mk('Una tienda en línea recibe en promedio','An online store receives an average of','pedidos','orders','por hora','per hour','según el registro de las últimas # semanas','according to the record of the last # weeks','en una hora','in one hour'),
    mk('Un centro de atención registra en promedio','A contact center records an average of','llamadas','calls','por hora','per hour','con datos de # días','with data from # days','en una hora','in one hour'),
    mk('Una aseguradora recibe en promedio','An insurer receives an average of','reclamaciones','claims','por día','per day','con base en # meses de historial','based on # months of history','en un día','in one day'),
    mk('Una carretera tiene en promedio','A road has an average of','baches','potholes','por kilómetro','per kilometer','tras inspeccionar # kilómetros','after inspecting # kilometers','en un kilómetro','in one kilometer'),
    mk('Una fábrica sufre en promedio','A factory suffers an average of','paros de máquina','machine stops','por semana','per week','con registros de # semanas','with records of # weeks','en una semana','in one week'),
    mk('Un libro tiene en promedio','A book has an average of','errores tipográficos','typographical errors','por página','per page','tras revisar # páginas','after reviewing # pages','en una página','on one page'),
    mk('Un banco rechaza en promedio','A bank rejects an average of','cheques','checks','por día','per day','según los últimos # días hábiles','according to the last # business days','en un día','in one day'),
    mk('Un almacén recibe en promedio','A warehouse receives an average of','camiones','trucks','por hora','per hour','con una muestra de # horas','with a sample of # hours','en una hora','in one hour')
  ],rng);
  var KB=shuffle([0,1,2,3,3,4,4,5,2,6],rng),SEQ=['hm','s1','dd','hm','dh','sp','s2','wd','q15','hh'];
  function tilesFor(q,vals){
    var out=[],seen={};
    vals.forEach(function(v){var key=String(+v.toFixed(6));if(!seen[key]&&out.length<4){seen[key]=1;out.push(v);}});

  var R=[],i;
  for(i=0;i<NR;i++){

      var lam=pick([1.5,2,2.5,3,3.5,4,4.5,5],rng),k=KB[i%KB.length];
      if(k===lam)k=k+1;

      var nSel=q.set.length,nComp=KM+1-nSel;
      var note=(nSel>nComp+1)?{es:' Nota: sumaste '+nSel+' barras; con el complemento bastaban '+nComp+' (1 menos la suma de las barras no marcadas).',en:' Note: you added '+nSel+' bars; with the complement only '+nComp+' were needed (1 minus the sum of the unmarked bars).'}:{es:'',en:''};
      sayB(host,st,'good','✓ Correcto. La probabilidad es '+fx(q.truth,4)+'. Interpretación: en aproximadamente '+pc(q.truth,1)+' de las horas se registrarán '+q.es+' '+q.noun.es+'.'+note.es,
                         '✓ Correct. The probability is '+fx(q.truth,4)+'. Interpretation: in about '+pc(q.truth,1)+' of hours '+q.en+' '+q.noun.en+' will be recorded.'+note.en);
      render();return;
    }
    st.tries++;
    if(!selOK){
      if(missing.length+extra.length<=2){es='Tu selección difiere del evento en muy pocas barras. Revisa las fronteras: "al menos" y "a lo sumo" incluyen el valor mencionado; "más de" y "menos de" no lo incluyen.';en='Your selection differs from the event in very few bars. Check the boundaries: "at least" and "at most" include the stated value; "more than" and "fewer than" do not.';}
      else{es='Traduce la frase a una desigualdad sobre k y marca todos los valores que la cumplen.';en='Translate the phrase into an inequality on k and mark every value that satisfies it.';}
    }else if(Math.abs(ps-(1-q.truth))<=0.0011){es='Ese valor es la probabilidad del evento contrario. Tu selección es correcta: revisa qué grupo de barras sumaste.';en='That value is the probability of the opposite event. Your selection is correct: check which group of bars you added.';}
    else if(ps<0||ps>1){es='Una probabilidad debe estar entre 0 y 1. Revisa la suma.';en='A probability must lie between 0 and 1. Recheck the sum.';}
    else{es='Tu selección es correcta. Suma las probabilidades de las barras marcadas (tabla inferior) o usa el complemento: 1 menos la suma de las barras no marcadas.';en='Your selection is correct. Add the probabilities of the marked bars (table below) or use the complement: 1 minus the sum of the unmarked bars.';}
    if(st.tries>=3){
      st.ok=true;st.sel={};q.set.forEach(function(x){st.sel[x]=true;});
      sayB(host,st,'warm','Solución: las barras del evento son '+q.set.join(', ')+' (y la cola despreciable si el evento es abierto). La probabilidad es '+fx(q.truth,4)+'. Compara con tu selección y con el método de suma o complemento que elegiste.',
                         'Solution: the bars of the event are '+q.set.join(', ')+' (plus the negligible tail if the event is open ended). The probability is '+fx(q.truth,4)+'. Compare with your selection and with the sum or complement method you chose.');
      render();return;
    }
    sayB(host,st,'miss',es,en);
  }
  widgets.push(render);redraws.push(draw);render();
}

function buildLesson(rng) {
  /*
   * CONCEPT ARC
   * topic        : Distribución de Poisson: contar eventos en el tiempo y el espacio (primera exposición)
   * prerequisite : El estudiante conoce probabilidad básica y la idea de promedio; la distribución binomial le sirve de contraste.
   * sequence     : 1. Qué es Poisson y cuándo se usa: conteo en una ventana, independencia, promedio estable (P1)
   *                2. La fórmula pieza por pieza y cómo armarla con fichas (P2)
   *                3. Cuando la ventana cambia: λ = r × t, práctica de ajuste y práctica mixta de planteamiento (P3, P4)
   *                4. Más de un valor: a lo sumo, al menos, entre, con acumuladas y complemento (P5)
   *                Evaluación final: P6 a P10 exigen todo el proceso (ajustar, plantear, calcular, interpretar)
   * why_this_order: Primero se decide si el modelo aplica (1), luego se aprende la fórmula aislada con λ ya dado (2), después se agrega la única complicación de unidades (3) y solo al final se pasa de un valor a rangos (4).

    '<div class="rules-grid">'+
      '<div class="rcard"><div class="rname">'+T('1 · Es un conteo en una ventana','1 · A count in a window')+'</div><div class="rnote">'+T('Se cuenta cuántas veces ocurre algo dentro de un tiempo o espacio, sin un número fijo de intentos.','We count how many times something happens inside a time or space, with no fixed number of trials.')+'</div></div>'+
      '<div class="rcard"><div class="rname">'+T('2 · Independencia','2 · Independence')+'</div><div class="rnote">'+T('Que ocurra un evento no cambia la probabilidad de que ocurra otro.','One event happening does not change the chance of another happening.')+'</div></div>'+

             'The most common confusion is with the binomial distribution. The difference: in the binomial there is a fixed number of trials (for example, of 40 invoices, how many contain an error) and the count never exceeds that number; in the Poisson there are no numbered trials, only a window, and the count can grow without a cap.')+'</p>'+

  /* ═══════════════════════ CONCEPT 2 · the formula piece by piece ═══════════════════════ */
  var l2=pick([2,2.5,3,3.5,4],rng),k2=pick([1,2,3,4],rng);
  if(k2===l2)k2=k2+1;
  var e2=Math.exp(-l2),lk2=Math.pow(l2,k2),kf2=fct(k2),p2=pmf(l2,k2),s2=pick(SUBJ,rng);
  addSection(function(lg){

      '<tr><td>e</td><td>'+T('Constante matemática, aproximadamente 2.71828','Mathematical constant, approximately 2.71828')+'</td><td>'+T('Tecla e<sup>x</sup> de la calculadora','The e<sup>x</sup> key of the calculator')+'</td></tr>'+
      '<tr><td>k!</td><td>'+T('k factorial: k × (k − 1) × … × 1, y por definición 0! = 1','k factorial: k × (k − 1) × … × 1, and by definition 0! = 1')+'</td><td>'+T('Se calcula a partir de k','Computed from k')+'</td></tr></table></div>'+

  (function(){

      e:{es:'La ventana (una hora) coincide con la unidad del promedio, así que λ = '+clean(lam)+' y k = '+k+'. P(X = '+k+') = '+fr('e<sup>−'+clean(lam)+'</sup> · '+clean(lam)+'<sup>'+k+'</sup>',k+'!')+' = '+o[0]+'. Interpretación: en aproximadamente '+pc(ans,1)+' de las horas habrá exactamente '+k+'. Los otros valores acumulan hasta k (P(X ≤ '+k+')) o corresponden a k + 1 y k − 1.',
         en:'The window (one hour) matches the unit of the average, so λ = '+clean(lam)+' and k = '+k+'. P(X = '+k+') = '+fr('e<sup>−'+clean(lam)+'</sup> · '+clean(lam)+'<sup>'+k+'</sup>',k+'!')+' = '+o[0]+'. Interpretation: in about '+pc(ans,1)+' of the hours there will be exactly '+k+'. The other values accumulate up to k (P(X ≤ '+k+')) or correspond to k + 1 and k − 1.'},
      oEs:o,oEn:o
    },rng,true);
  })();

  /* ═══════════════════════ CONCEPT 3 · adjusting lambda ═══════════════════════ */
  var poolC={_s:[],_p:[]};
  var rowsR=['hm','dd','dh'].map(function(ty){return lamRound(rng,ty,poolC);});
  var xw=lamRound(rng,pick(['hm','hm','dh'],rng),poolC);
  var kx=Math.max(1,Math.round(xw.lam)+pick([-1,0,1],rng));
  if(Math.abs(kx-xw.lam)<1e-9)kx++;
  var ex=Math.exp(-xw.lam),lkx=Math.pow(xw.lam,kx),kfx=fct(kx),px=pmf(xw.lam,kx);

  });
  function fillRows(html,lg){
    return html.replace(/@RU@([a-z0-9]+)@/g,function(m,k){return RU[k][lg];}).replace(/@W@([a-z]+)@([0-9.]+)@/g,function(m,k,w){return wtxt(parseFloat(w),k)[lg];});
  }
  addSection(function(lg){
    var T=function(a,b){return lg==='es'?a:b;};
    var xs=rateSent(xw),xwt=winTxt(xw);
    return ''+
    '<div class="stag">'+T('Concepto 3 de 4','Concept 3 of 4')+'</div>'+
    '<h2>'+T('Cuando la ventana cambia: cómo ajustar λ','When the window changes: how to adjust λ')+'</h2>'+

    var q=lamRound(rng,'hm',poolF),r=q.r,m=q.wv,lam=q.lam,k=Math.max(3,Math.round(lam)+pick([2,3],rng));
    var good=1-cdf(lam,k-1),bad=1-cdf(r,k-1);
    var oEs=['Debió ajustar la tasa a la ventana: λ = '+r+' × '+fr(m,60)+' = '+clean(lam)+', no '+r,
             'Debió usar 1 − F('+k+') en lugar de 1 − F('+(k-1)+'), porque el evento incluye a '+k,
             'Debió usar la binomial, porque el complemento no aplica en distribuciones de Poisson',
             'Debió multiplicar P(X = '+k+') por el número de valores posibles, que es infinito'];
    var oEn=['It should have adjusted the rate to the window: λ = '+r+' × '+fr(m,60)+' = '+clean(lam)+', not '+r,
             'It should have used 1 − F('+k+') instead of 1 − F('+(k-1)+'), because the event includes '+k,
             'It should have used the binomial, because the complement does not apply to Poisson distributions',
             'It should have multiplied P(X = '+k+') by the number of possible values, which is infinite'];
    addProb({
      t:{es:'Detecta el error en el procedimiento',en:'Spot the error in the procedure'},
      q:{es:'Un analista dice: "Llegan en promedio '+r+' clientes por hora. Para la probabilidad de que en '+m+' minutos lleguen al menos '+k+', tomo λ = '+r+' y calculo 1 − F('+(k-1)+') = '+fx(bad,4)+'." ¿Cuál es el error en su procedimiento?',en:'An analyst says: "An average of '+r+' customers arrive per hour. For the probability that at least '+k+' arrive in '+m+' minutes, I take λ = '+r+' and compute 1 − F('+(k-1)+') = '+fx(bad,4)+'." What is the error in this procedure?'},
      h:{es:'Revisa por separado dos cosas: si la desigualdad "al menos" está bien traducida y si λ corresponde a la ventana pedida.',en:'Check two things separately: whether the "at least" inequality is translated correctly and whether λ corresponds to the requested window.'},
      e:{es:'"Al menos '+k+'" sí se traduce como 1 − F('+(k-1)+'), y el complemento sí se puede usar con Poisson. El fallo está en λ: la ventana es de '+m+' minutos, así que λ = '+clean(lam)+' y la probabilidad correcta es 1 − F('+(k-1)+') = '+fx(good,4)+', no '+fx(bad,4)+'. Usar λ = '+r+' equivale a calcular la probabilidad para una hora completa.',
         en:'"At least '+k+'" is indeed translated as 1 − F('+(k-1)+'), and the complement can be used with a Poisson. The flaw is in λ: the window is '+m+' minutes, so λ = '+clean(lam)+' and the correct probability is 1 − F('+(k-1)+') = '+fx(good,4)+', not '+fx(bad,4)+'. Using λ = '+r+' amounts to computing the probability for a full hour.'},
      oEs:oEs,oEn:oEn
    },rng,false);
  })();

  /* P10 · between a and b (gated) */
  (function(){
    var q=lamRound(rng,pick(['hh','sp','wd','dd'],rng),poolF),lam=q.lam,a=Math.max(1,Math.round(lam)-1),b=a+pick([2,3],rng);
    var ans=cdf(lam,b)-cdf(lam,a-1),w1=cdf(lam,b)-cdf(lam,a),w2=cdf(lam,b-1)-cdf(lam,a-1),w3=pmf(lam,a)+pmf(lam,b),sc=scnFor(q,'esté entre '+a+' y '+b+' (ambos incluidos)','is between '+a+' and '+b+' (both included)'),why=tWhy(q);
    var o=distinctN([ans,w1,w2,w3],function(v){return fx(v,4);},0.0001,0.9999);
    addProb({
      t:{es:'Entre dos valores',en:'Between two values'},
      q:sc,
      h:{es:'Ajusta λ. Después decide qué dos acumuladas restar para que ambos extremos queden dentro del evento.',en:'Adjust λ. Then decide which two cumulatives to subtract so that both ends stay inside the event.'},
      e:{es:why.es+' Entonces λ = '+clean(q.r)+' × '+clean(q.t)+' = '+clean(lam)+'. P('+a+' ≤ X ≤ '+b+') = F('+b+') − F('+(a-1)+') = '+fx(cdf(lam,b),4)+' − '+fx(cdf(lam,a-1),4)+' = '+o[0]+'. Interpretación: en aproximadamente '+pc(ans,1)+' de las ventanas habrá de '+a+' a '+b+'. Restar F('+a+') dejaría fuera el '+a+'; usar F('+(b-1)+') dejaría fuera el '+b+'; y sumar solo los extremos ignora los valores intermedios.',
         en:why.en+' So λ = '+clean(q.r)+' × '+clean(q.t)+' = '+clean(lam)+'. P('+a+' ≤ X ≤ '+b+') = F('+b+') − F('+(a-1)+') = '+fx(cdf(lam,b),4)+' − '+fx(cdf(lam,a-1),4)+' = '+o[0]+'. Interpretation: in about '+pc(ans,1)+' of the windows there will be '+a+' to '+b+'. Subtracting F('+a+') would leave out '+a+'; using F('+(b-1)+') would leave out '+b+'; and adding only the ends ignores the intermediate values.'},
      oEs:o,oEn:o
    },rng,true);
  })();
}
