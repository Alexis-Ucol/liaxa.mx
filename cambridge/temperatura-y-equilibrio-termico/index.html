<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Temperatura y Equilibrio Térmico</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Temperatura y Equilibrio Térmico</div>
    <div class="wcourse" id="wcourse-el">Física · 2° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Temperatura y Equilibrio Térmico</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="sbtn" id="dlBtn" onclick="generatePDF()" style="max-width:280px;margin:0 auto;">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   CENTRALIZED SCHOOL CONFIG (Rule 16) — ships UNBRANDED (Rule 11).
   The ONLY rebranding point. build_all.py substitutes these exact fields
   (BRAND_FIELDS / RGB_FIELDS / logo*) downstream; :root/dark stay as fallback.
   Neutral defaults below == the static :root/dark values, so unbranded == no-op.
   ══════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:'#c0202a', primaryDark:'#490a0e', primaryBg:'#f6e7e8',
  accent:'#f5c800', accentBg:'#fff8db',
  darkPrimary:'#c94049', darkPrimaryDark:'#e97179', darkPrimaryBg:'#3b0a0e',

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);

  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');

}

async function generatePDF() {
  var btn = document.getElementById('dlBtn');
  btn.textContent = 'Generando PDF…';
  btn.disabled = true;

  var jspdf   = window.jspdf;
  var doc     = new jspdf.jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });
  var PW      = 215.9;
  var M       = 18;
  var TW      = PW - M * 2;
  var PH      = doc.internal.pageSize.height;
  var name    = studentData.name;
  var group   = studentData.group;
  var total   = problems.length;
  var pct     = Math.round(correctCount / total * 100);
  var dateStr = new Date().toLocaleString('es-MX', { dateStyle:'long', timeStyle:'short' });

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS — INJECTION BLOCK ─────────────────────────────────────────
  //   Match these RGB values to --green and --gold above.
  //   PRIMARY  → pBR, pBG, pBB
  //   ACCENT   → pAR, pAG, pAB
  // ──────────────────────────────────────────────────────────────────────────
  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;  // PRIMARY (from SCHOOL, Rule 16)
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;   // ACCENT (from SCHOOL, Rule 16)

  function pdfText(html) {
    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')

  // ── Per-problem pages ──

    // ── SAVE / SHARE — iOS-safe download (LIAXA iOS PDF fix, Rule 12) ─────────
  //   iOS Safari ignores the <a download> attribute, so a plain download fails
  //   silently on iPhone/iPad. iOS -> native share sheet (-> "Save to Files"),
  //   with an inline-open fallback; everything else -> <a download> click.
  //   Runs synchronously off the tap so iOS accepts navigator.share().
  var _fname   = 'fis2_t04_g02_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf';
  var _pdfBlob = doc.output('blob');

  function _restorePdfBtn(){ btn.innerHTML = '\u2b07 &nbsp;' + t('btn-pdf'); btn.disabled = false; }
  function _openPdfInline(b){
    var u = URL.createObjectURL(b);
    var w = window.open(u, '_blank');
    if (!w) { window.location.href = u; }
    setTimeout(function(){ URL.revokeObjectURL(u); }, 60000);
  }

  var _isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
               (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  if (_isIOS) {
    var _pdfFile = new File([_pdfBlob], _fname, { type:'application/pdf' });
    if (navigator.canShare && navigator.canShare({ files:[_pdfFile] })) {
      navigator.share({ files:[_pdfFile], title:_fname })
        .then(_restorePdfBtn)
        .catch(function(e){
          if (e && e.name === 'AbortError') { _restorePdfBtn(); return; }
          _openPdfInline(_pdfBlob); _restorePdfBtn();
        });
      return;
    }
    _openPdfInline(_pdfBlob); _restorePdfBtn();
    return;
  }

  var _dlUrl = URL.createObjectURL(_pdfBlob);
  var _dlA   = document.createElement('a');
  _dlA.href  = _dlUrl; _dlA.download = _fname;
  document.body.appendChild(_dlA); _dlA.click();
  setTimeout(function(){ document.body.removeChild(_dlA); URL.revokeObjectURL(_dlUrl); }, 200);
  _restorePdfBtn();
}

function addProblem(rng, spec){
  var idx = problems.length;
  var correctVal = spec.options[spec.correct];
  var sh = shuffle(spec.options, rng);
  var prob = {
    title: spec.title,
    questionText: spec.q,
    fn: '',
    hint: spec.hint || '',
    explanation: spec.exp || '',
    options: sh,
    correctIdx: sh.indexOf(correctVal),
    showWork: false,
    studentChoice: null,
    pendingChoice: null
  };
  problems.push(prob);
  buildOneCard(prob, idx);
}


/* ══════════════════════════════════════════════════════════════════════════
   buildLesson  ::  concepto -> manipulativo -> problema, alternados (Rule 1)
   ══════════════════════════════════════════════════════════════════════════ */
function buildLesson(rng){
  injectGuideCSS();

  /* ── Apertura ── */
  sec(
    L({ es:'Punto de partida', en:'Starting point' }),
    L({ es:'Dos bancas del mismo salón', en:'Two benches in the same room' }),
    '<p>' + L({
      es:'En el patio hay una banca de metal y otra de madera, una junto a la otra, bajo la misma sombra desde la mañana. Al sentarse, la de metal se siente helada y la de madera no. Si se apoya un termómetro sobre cada una, los dos marcan el mismo número.',
      en:'In the schoolyard there is a metal bench and a wooden one, side by side, in the same shade since the morning. When you sit down, the metal one feels freezing and the wooden one does not. If a thermometer is placed on each of them, both read the same number.'
    }) + '</p>' +
    '<p>' + L({
      es:'Las dos cosas son ciertas al mismo tiempo, así que la piel y el termómetro no están informando de lo mismo. Esta guía se dedica a separar esas dos ideas: qué es exactamente la temperatura y qué ocurre entre dos cuerpos que se tocan hasta que dejan de cambiar.',
      en:'Both things are true at the same time, so your skin and the thermometer are not reporting the same thing. This guide is about separating those two ideas: what temperature exactly is, and what happens between two bodies in contact until they stop changing.'
    }) + '</p>' +
    '<div class="callout"><p><strong>' + L({ es:'Idea clave: ', en:'Key idea: ' }) + '</strong>' + L({
      es:'la temperatura describe qué tan rápido se agitan las partículas de un cuerpo, en promedio. La sensación de frío o de calor describe otra cosa: hacia dónde y qué tan rápido está pasando energía entre ese cuerpo y tu mano.',
      en:'temperature describes how fast the particles of a body jiggle, on average. The feeling of cold or heat describes something else: which way and how fast energy is passing between that body and your hand.'
    }) + '</p></div>'
  );

  /* ══ CONCEPTO 1 ══ */
  var s1 = sec(
    L({ es:'Concepto 1', en:'Concept 1' }),
    L({ es:'Qué mide realmente un termómetro', en:'What a thermometer really measures' }),
    '<p>' + L({
      es:'Las partículas de cualquier material están en movimiento permanente: vibran, giran y chocan entre ellas. No todas se mueven igual de rápido en un instante dado, unas van más aprisa y otras más despacio. La temperatura no describe a ninguna partícula en particular: describe el promedio de todas.',
      en:'The particles of any material are in permanent movement: they vibrate, spin and collide with one another. They do not all move equally fast at a given instant, some go faster and others slower. Temperature does not describe any particular particle: it describes the average of all of them.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Temperatura', en:'Temperature' }), L({ es:'rapidez promedio', en:'average speed' }), L({ es:'qué tan agitada está cada partícula, en promedio, sin importar cuántas haya', en:'how agitated each particle is on average, no matter how many there are' })) +
      rcard(L({ es:'Energía térmica', en:'Thermal energy' }), L({ es:'suma de todo', en:'sum of everything' }), L({ es:'el movimiento de todas las partículas juntas, así que depende de cuánto material hay', en:'the movement of all the particles together, so it depends on how much material there is' })) +
      rcard(L({ es:'Subir la temperatura', en:'Raising the temperature' }), L({ es:'agitar más', en:'more agitation' }), L({ es:'entra energía y las partículas se mueven más rápido en promedio', en:'energy comes in and the particles move faster on average' })) +
    '</div>' +
    '<div class="callout"><p>' + L({
      es:'Por eso una chispa de bengala puede estar a cientos de grados y no lastimar la piel, mientras que una taza de agua a noventa grados sí produce una quemadura. La chispa tiene partículas muy agitadas, pero son poquísimas; la taza tiene partículas menos agitadas y muchísimas más. Temperatura alta y mucha energía térmica no son lo mismo.',
      en:'That is why a sparkler spark can be at hundreds of degrees and not hurt your skin, while a cup of water at ninety degrees does cause a burn. The spark has very agitated particles, but very few of them; the cup has less agitated particles and far more of them. High temperature and a lot of thermal energy are not the same thing.'
    }) + '</p></div>'
  );
  w1(rng, widgetHost(s1, 'w_boxes'));
  addProblem(rng, mkP1(rng));
  addProblem(rng, mkP2(rng));

  /* ══ CONCEPTO 2 ══ */
  var s2 = sec(
    L({ es:'Concepto 2', en:'Concept 2' }),
    L({ es:'Sentir no es medir', en:'Feeling is not measuring' }),
    '<p>' + L({
      es:'La piel no tiene forma de saber la temperatura de lo que toca. Lo único que detecta es si está ganando o perdiendo energía, y qué tan rápido lo hace. Si el objeto le quita energía se percibe frío; si le entrega energía se percibe caliente; si no hay intercambio apreciable no se percibe ningún cambio.',
      en:'Skin has no way of knowing the temperature of what it touches. All it detects is whether it is gaining or losing energy, and how fast. If the object takes energy away it is perceived as cold; if it delivers energy it is perceived as hot; if there is no appreciable exchange no change is perceived.'
    }) + '</p>' +
    '<p>' + L({
      es:'Un termómetro resuelve el problema de otra manera. Se pone en contacto con el objeto y se deja ahí hasta que su propio líquido o su propio sensor deja de cambiar. Lo que muestra entonces es su propia temperatura, y esa lectura sirve porque para ese momento ya coincide con la del objeto.',
      en:'A thermometer solves the problem in another way. It is put in contact with the object and left there until its own liquid or its own sensor stops changing. What it shows then is its own temperature, and that reading is useful because by then it already matches the temperature of the object.'
    }) + '</p>' +
    '<div class="callout"><p>' + L({
      es:'De ahí sale una regla práctica que se olvida seguido: una lectura tomada antes de que el termómetro deje de moverse no es la temperatura del objeto, es una etapa intermedia del propio termómetro.',
      en:'From this comes a practical rule that is often forgotten: a reading taken before the thermometer stops moving is not the temperature of the object, it is an intermediate stage of the thermometer itself.'
    }) + '</p></div>'
  );
  w2(rng, widgetHost(s2, 'w_buckets'));
  addProblem(rng, mkP3(rng));
  addProblem(rng, mkP4(rng));

  /* ══ CONCEPTO 3 ══ */
  var s3 = sec(
    L({ es:'Concepto 3', en:'Concept 3' }),
    L({ es:'Hacia dónde va la energía cuando dos cuerpos se tocan', en:'Where energy goes when two bodies touch' }),
    '<p>' + L({
      es:'En la frontera entre dos cuerpos en contacto, sus partículas chocan sin parar. En cada choque entre una partícula veloz y una lenta, la veloz sale un poco más lenta y la lenta sale un poco más rápida. Repetido millones de veces, el resultado siempre apunta en la misma dirección: la energía pasa del cuerpo de mayor temperatura al de menor temperatura.',
      en:'At the boundary between two bodies in contact, their particles collide non stop. In each collision between a fast particle and a slow one, the fast one comes out a bit slower and the slow one a bit faster. Repeated millions of times, the result always points the same way: energy passes from the body at higher temperature to the one at lower temperature.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Lo que viaja', en:'What travels' }), L({ es:'energía', en:'energy' }), L({ es:'el frío no se transmite; lo que se transfiere siempre es movimiento de partículas', en:'cold is not transmitted; what is transferred is always particle movement' })) +
      rcard(L({ es:'La dirección', en:'The direction' }), L({ es:'de mayor a menor', en:'higher to lower' }), L({ es:'la decide la diferencia de temperaturas, no el tamaño de los cuerpos', en:'it is set by the temperature difference, not by the size of the bodies' })) +
      rcard(L({ es:'La rapidez', en:'The rate' }), L({ es:'depende del material', en:'depends on the material' }), L({ es:'el metal deja pasar energía mucho más rápido que la madera o el plástico', en:'metal lets energy through much faster than wood or plastic' })) +
    '</div>' +
    '<div class="callout"><p>' + L({
      es:'Con esas tres ideas juntas se explica la banca del patio. El metal y la madera están a la misma temperatura, pero el metal saca energía de la mano mucho más rápido, y la piel traduce esa rapidez como más frío.',
      en:'With those three ideas together the schoolyard bench is explained. Metal and wood are at the same temperature, but metal draws energy out of your hand much faster, and skin translates that rate as colder.'
    }) + '</p></div>'
  );
  w3(rng, widgetHost(s3, 'w_flow'));
  addProblem(rng, mkP5(rng));
  addProblem(rng, mkP6(rng));

  /* ══ CONCEPTO 4 ══ */
  var s4 = sec(
    L({ es:'Concepto 4', en:'Concept 4' }),
    L({ es:'El equilibrio térmico y dónde queda la temperatura final', en:'Thermal equilibrium and where the final temperature lands' }),
    '<p>' + L({
      es:'El intercambio de energía entre dos cuerpos en contacto no dura para siempre. Mientras uno tenga mayor temperatura que el otro, la transferencia continúa y la diferencia se va reduciendo. Cuando los dos llegan a la misma temperatura la transferencia neta se detiene, y se dice que alcanzaron el equilibrio térmico.',
      en:'The exchange of energy between two bodies in contact does not last forever. As long as one is at a higher temperature than the other, the transfer continues and the difference shrinks. When the two reach the same temperature the net transfer stops, and they are said to have reached thermal equilibrium.'
    }) + '</p>' +
    '<p>' + L({
      es:'Detenerse no significa quedarse quieto. Las partículas siguen chocando en la frontera y sigue pasando energía en los dos sentidos, solo que ahora pasa lo mismo de ida que de vuelta, así que ninguna de las dos temperaturas cambia.',
      en:'Stopping does not mean going still. The particles keep colliding at the boundary and energy keeps passing both ways, only now the same amount goes each way, so neither temperature changes.'
    }) + '</p>' +
    '<div class="callout"><p>' + L({
      es:'La temperatura final siempre queda entre las dos iniciales, nunca fuera. Y no cae a media distancia salvo que haya la misma cantidad del mismo material de los dos lados: el cuerpo con más material cambia poco su temperatura y arrastra al otro hacia la suya.',
      en:'The final temperature always lands between the two starting ones, never outside. And it does not fall halfway unless there is the same amount of the same material on both sides: the body with more material changes its temperature little and drags the other one towards its own.'
    }) + '</p></div>'
  );
  w4(rng, widgetHost(s4, 'w_mix'));
  addProblem(rng, mkP7(rng));
  addProblem(rng, mkP8(rng));

  /* ══ CIERRE ══ */
  sec(
    L({ es:'Cierre', en:'Closing' }),
    L({ es:'Leer los datos y poner a prueba una afirmación', en:'Reading the data and testing a claim' }),
    '<p>' + L({
      es:'Las dos últimas situaciones no traen ideas nuevas: traen registros y afirmaciones de otras personas. Lee con calma qué se midió, durante cuánto tiempo y qué se está afirmando antes de elegir.',
      en:'The last two situations bring no new ideas: they bring records and other people claims. Read carefully what was measured, for how long, and what is being claimed before choosing.'
    }) + '</p>'
  );
  addProblem(rng, mkP9(rng));
  addProblem(rng, mkP10(rng));
}


/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 1  ::  Dos cajas de particulas con termometro
   La lectura depende de la rapidez promedio, no de cuantas particulas hay.
   ══════════════════════════════════════════════════════════════════════════ */
function w1(rng, host){
  var NA = ri(rng, 10, 20), SA = ri(rng, 3, 7);
  function tempOf(s){ return 5 + s * 10; }
  var TA = tempOf(SA);
  var NB = ri(rng, 8, 24), SB = ri(rng, 2, 8);

  var WN = {
    more:{ es:'más partículas que A', en:'more particles than A' },
    less:{ es:'menos partículas que A', en:'fewer particles than A' },
    equal:{ es:'la misma cantidad de partículas que A', en:'the same number of particles as A' }
  };
  var WT = {
    more:{ es:'una temperatura mayor que la de A', en:'a higher temperature than A' },
    less:{ es:'una temperatura menor que la de A', en:'a lower temperature than A' },
    equal:{ es:'exactamente la misma temperatura que A', en:'exactly the same temperature as A' }
  };
  var ALL = [
    { n:'more', t:'equal' },
    { n:'less', t:'more'  },
    { n:'more', t:'less'  },
    { n:'equal', t:'less' }
  ];
  var R = shuffle(ALL, rng).slice(0, 3);
  var rd = 0, tries = 0, locked = false, done = false;

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Dos cajas de partículas', en:'Two particle boxes' }) + '</div>' +
    '<div class="gw-q" data-r="task"></div>' +
    '<canvas class="gw-cvs" data-r="cvs"></canvas>' +
    '<div class="gw-slab"><span class="gw-cl">' + L({ es:'partículas en B', en:'particles in B' }) + '</span>' +
      '<input type="range" min="6" max="30" step="1" data-r="sn"><span class="gw-val" data-r="nv"></span></div>' +
    '<div class="gw-slab"><span class="gw-cl">' + L({ es:'rapidez en B', en:'speed in B' }) + '</span>' +
      '<input type="range" min="1" max="9" step="1" data-r="ss"><span class="gw-val" data-r="sv"></span></div>' +
    '<div class="gw-mini" data-r="live"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Comprobar', en:'Check' }) + '</button>' +
      '<span class="gw-val" data-r="cnt"></span></div>' +
    '<div class="gw-fb"></div>';

  var cv = host.querySelector('[data-r="cvs"]'),
      ctx = cv.getContext('2d'),
      elN = host.querySelector('[data-r="sn"]'),
      elS = host.querySelector('[data-r="ss"]'),
      elNV = host.querySelector('[data-r="nv"]'),
      elSV = host.querySelector('[data-r="sv"]'),
      elT = host.querySelector('[data-r="task"]'),
      elL = host.querySelector('[data-r="live"]'),
      elC = host.querySelector('[data-r="chk"]'),
      elK = host.querySelector('[data-r="cnt"]');

  var W = 0, H = 0, dpr = window.devicePixelRatio || 1, last = 0;
  var PA = [], PB = [];

  function grow(arr, n){
    while (arr.length > n) arr.pop();
    while (arr.length < n){
      var a = rng() * 6.283;
      arr.push({ x:0.1 + rng() * 0.8, y:0.1 + rng() * 0.8, vx:Math.cos(a), vy:Math.sin(a) });
    }
  }
  grow(PA, NA); grow(PB, NB);

  function move(arr, sp, dt){
    var f = sp * 0.00006 * dt, k, p;
    for (k = 0; k < arr.length; k++){
      p = arr[k];
      p.x += p.vx * f; p.y += p.vy * f;
      if (p.x < 0.04){ p.x = 0.04; p.vx = -p.vx; }
      if (p.x > 0.96){ p.x = 0.96; p.vx = -p.vx; }
      if (p.y < 0.06){ p.y = 0.06; p.vy = -p.vy; }
      if (p.y > 0.94){ p.y = 0.94; p.vy = -p.vy; }
    }
  }

  function fit(){
    var r = cv.getBoundingClientRect();
    if (!r.width) return false;
    var w = Math.round(r.width), h = Math.round(r.height);
    if (w !== W || h !== H){ W = w; H = h; cv.width = w * dpr; cv.height = h * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
    return true;
  }

  function box(x, y, bw, bh, arr, temp, cnt, label){
    ctx.strokeStyle = cssv('--border'); ctx.lineWidth = 2;
    ctx.strokeRect(x, y, bw, bh);
    ctx.fillStyle = label === 'A' ? cssv('--green') : cssv('--gold');
    var k, p;
    for (k = 0; k < arr.length; k++){
      p = arr[k];
      ctx.beginPath();
      ctx.arc(x + 6 + p.x * (bw - 12), y + 6 + p.y * (bh - 12), 4.2, 0, 6.2832);
      ctx.fill();
    }
    ctx.font = '11px "IBM Plex Mono", monospace';
    ctx.textAlign = 'center';
    ctx.fillStyle = cssv('--text');
    ctx.fillText(label + ': ' + temp + ' °C', x + bw / 2, y - 8);
    ctx.fillStyle = cssv('--text3');
    ctx.font = '10px "IBM Plex Mono", monospace';
    ctx.fillText(cnt + L({ es:' partículas', en:' particles' }), x + bw / 2, y + bh + 15);
    var barW = bw * Math.max(0.06, Math.min(1, temp / 100));
    ctx.fillStyle = label === 'A' ? cssv('--green') : cssv('--gold');
    ctx.fillRect(x, y + bh + 22, barW, 5);
    ctx.strokeStyle = cssv('--border'); ctx.lineWidth = 1;
    ctx.strokeRect(x, y + bh + 22, bw, 5);
    ctx.textAlign = 'left';
  }

  function render(){
    if (!fit()) return;
    ctx.clearRect(0, 0, W, H);
    var bw = Math.min((W - 46) / 2, 150), bh = H - 78, y = 26;
    var x1 = W / 2 - bw - 8, x2 = W / 2 + 8;
    box(x1, y, bw, bh, PA, TA, NA, 'A');
    box(x2, y, bw, bh, PB, tempOf(SB), NB, 'B');
  }

  function frame(ts){
    if (!document.body.contains(host)) return;
    if (!last) last = ts;
    var dt = Math.min(45, ts - last); last = ts;
    move(PA, SA, dt); move(PB, SB, dt);
    render();
    requestAnimationFrame(frame);
  }

  function cmp(a, b){ return a > b ? 'more' : (a < b ? 'less' : 'equal'); }

  function liveTxt(){
    var TB = tempOf(SB);
    var cn = cmp(NB, NA), ct = cmp(TB, TA);
    var mn = { more:{ es:'más partículas que A', en:'more particles than A' },
               less:{ es:'menos partículas que A', en:'fewer particles than A' },
               equal:{ es:'igual cantidad de partículas que A', en:'the same number of particles as A' } }[cn];
    var mt = { more:{ es:'marca más que A', en:'reads higher than A' },
               less:{ es:'marca menos que A', en:'reads lower than A' },
               equal:{ es:'marca lo mismo que A', en:'reads the same as A' } }[ct];
    elL.innerHTML = L({ es:'Ahora B tiene ', en:'Right now B has ' }) + L(mn) +
      L({ es:' y su termómetro ', en:' and its thermometer ' }) + L(mt) +
      ' (' + TB + ' °C ' + L({ es:'contra', en:'against' }) + ' ' + TA + ' °C).';
  }

  function drawTask(){
    elT.innerHTML = L({ es:'Ajusta la caja B para que tenga ', en:'Adjust box B so that it has ' }) +
      L(WN[R[rd].n]) + L({ es:' y ', en:' and ' }) + L(WT[R[rd].t]) + '.';
    elK.textContent = L({ es:'ajuste ', en:'setting ' }) + (rd + 1) + L({ es:' de 3', en:' of 3' });
  }

  function fixIt(){
    var want = R[rd];
    NB = want.n === 'more' ? Math.min(30, NA + 6) : (want.n === 'less' ? Math.max(6, NA - 6) : NA);
    SB = want.t === 'more' ? Math.min(9, SA + 2) : (want.t === 'less' ? Math.max(1, SA - 2) : SA);
    grow(PB, NB);
    elN.value = NB; elS.value = SB;
    elNV.textContent = NB; elSV.textContent = SB;
    liveTxt();
  }

  function advance(){
    rd++;
    if (rd >= 3){
      done = true;
      elC.textContent = L({ es:'Completado', en:'Completed' });
      elC.className = 'gw-btn solved';
      elK.textContent = '';
      say(host, 'good', L({
        es:'En los tres ajustes el termómetro de B se movió solo cuando cambiaste la rapidez de sus partículas. Agregar o quitar partículas cambió cuánto material hay en la caja, y con ello la energía total, pero nunca la lectura del termómetro.',
        en:'In all three settings the thermometer of B moved only when you changed the speed of its particles. Adding or removing particles changed how much material is in the box, and with it the total energy, but never the thermometer reading.'
      }));
      return;
    }
    locked = false; tries = 0;
    drawTask(); liveTxt();
    elC.textContent = L({ es:'Comprobar', en:'Check' });
    elC.className = 'gw-btn';
    say(host, '', L({ es:'Ajuste nuevo. Mueve los dos controles y observa qué le pasa a cada termómetro.', en:'New setting. Move both controls and watch what happens to each thermometer.' }));
  }

  function close(cls, txt){
    locked = true;
    elC.textContent = rd === 2 ? L({ es:'Terminar', en:'Finish' }) : L({ es:'Siguiente ajuste', en:'Next setting' });
    elC.className = 'gw-btn solved';
    say(host, cls, txt);
  }

  function check(){
    if (done) return;
    if (locked){ advance(); return; }
    var TB = tempOf(SB);
    var want = R[rd], okN = cmp(NB, NA) === want.n, okT = cmp(TB, TA) === want.t;
    if (okN && okT){
      close('good', L({ es:'Así es. A tiene ', en:'That is it. A has ' }) + NA + L({ es:' partículas a ', en:' particles at ' }) + TA +
        L({ es:' °C y B tiene ', en:' °C and B has ' }) + NB + L({ es:' partículas a ', en:' particles at ' }) + TB +
        L({ es:' °C. La lectura de cada caja salió de la rapidez de sus partículas; cuántas hay no aparece en el termómetro.',
            en:' °C. Each box reading came out of the speed of its particles; how many there are does not show up on the thermometer.' }));
      return;
    }
    tries++;
    if (tries >= 3){
      fixIt();
      close('warm', L({
        es:'Así queda el ajuste que se pedía. Conviene fijarse en lo que acaba de pasar: el termómetro solo respondió al control de rapidez. La cantidad de partículas cambia cuánto material hay, no qué tan agitado está.',
        en:'This is the setting that was asked for. It is worth noticing what just happened: the thermometer only responded to the speed control. The number of particles changes how much material there is, not how agitated it is.'
      }));
      return;
    }
    var msg;
    if (!okT){
      if (want.t === 'equal') msg = { es:'Los dos termómetros todavía marcan distinto. Mueve la rapidez de B hasta que su lectura coincida con la de A.', en:'The two thermometers still read differently. Move the speed of B until its reading matches A.' };
      else if (want.t === 'more') msg = { es:'B todavía no supera a A en el termómetro. Para subir esa lectura hay que agitar más sus partículas.', en:'B still does not beat A on the thermometer. To raise that reading its particles have to jiggle more.' };
      else msg = { es:'B todavía no queda por debajo de A en el termómetro. Para bajar esa lectura hay que agitar menos sus partículas.', en:'B is still not below A on the thermometer. To lower that reading its particles have to jiggle less.' };
    } else {
      if (want.n === 'equal') msg = { es:'La lectura ya es la correcta. Falta que las dos cajas tengan la misma cantidad de partículas.', en:'The reading is right already. What is missing is for both boxes to hold the same number of particles.' };
      else if (want.n === 'more') msg = { es:'La lectura ya es la correcta. Ahora B necesita más partículas que A, y verás que eso no mueve el termómetro.', en:'The reading is right already. Now B needs more particles than A, and you will see that this does not move the thermometer.' };
      else msg = { es:'La lectura ya es la correcta. Ahora B necesita menos partículas que A, y verás que eso tampoco mueve el termómetro.', en:'The reading is right already. Now B needs fewer particles than A, and you will see that this does not move the thermometer either.' };
    }
    say(host, 'miss', L(msg));
  }

  elN.addEventListener('input', function(){
    if (done || locked){ elN.value = NB; return; }
    NB = parseInt(elN.value, 10); grow(PB, NB); elNV.textContent = NB; liveTxt();
  });
  elS.addEventListener('input', function(){
    if (done || locked){ elS.value = SB; return; }
    SB = parseInt(elS.value, 10); elSV.textContent = SB; liveTxt();
  });
  elC.addEventListener('click', check);

  elN.value = NB; elS.value = SB;
  elNV.textContent = NB; elSV.textContent = SB;
  drawTask(); liveTxt();
  say(host, '', L({
    es:'La caja A está fija. Mueve los controles de B y fíjate cuál de los dos hace que su termómetro se mueva.',
    en:'Box A is fixed. Move the controls of B and notice which of the two makes its thermometer move.'
  }));
  requestAnimationFrame(frame);
}


/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 2  ::  Las tres cubetas
   La sensacion depende de con que temperatura llega la mano.
   ══════════════════════════════════════════════════════════════════════════ */
function w2(rng, host){
  var BK = [
    { k:'f', nm:{ es:'fría', en:'cold' },      T: ri(rng, 5, 11) },
    { k:'t', nm:{ es:'tibia', en:'lukewarm' }, T: ri(rng, 26, 30) },
    { k:'c', nm:{ es:'caliente', en:'hot' },   T: ri(rng, 42, 47) }
  ];
  function bk(k){ for (var i = 0; i < BK.length; i++) if (BK[i].k === k) return BK[i]; return null; }
  var HD = { i:{ T:33, at:null }, d:{ T:33, at:null } };
  function sens(h){
    if (!h.at) return 'air';
    var d = bk(h.at).T - h.T;
    if (d > 1.2) return 'hot';
    if (d < -1.2) return 'cold';
    return 'same';
  }
  var SENSTX = {
    hot:{ es:'siente el agua caliente', en:'feels the water hot' },
    cold:{ es:'siente el agua fría', en:'feels the water cold' },
    same:{ es:'no siente ningún cambio', en:'feels no change at all' },
    air:{ es:'está fuera del agua', en:'is out of the water' }
  };

  var TK = [
    {
      q:{ es:'Consigue que las dos manos estén dentro de la misma cubeta y que cada una reporte una sensación distinta.',
          en:'Get both hands inside the same bucket, each reporting a different sensation.' },
      ok:function(){ return HD.i.at && HD.i.at === HD.d.at && sens(HD.i) !== sens(HD.d); },
      nudge:function(){
        if (!HD.i.at || !HD.d.at) return { es:'Todavía hay una mano fuera del agua. Las dos tienen que terminar dentro de la misma cubeta.', en:'One hand is still out of the water. Both have to end up inside the same bucket.' };
        if (HD.i.at !== HD.d.at) return { es:'Cada mano está en una cubeta distinta. Júntalas en una sola, pero piensa antes de dónde conviene que venga cada una.', en:'Each hand is in a different bucket. Bring them into a single one, but think first about where each should be coming from.' };
        return { es:'Las dos manos llegaron con casi la misma temperatura de piel, así que reportan lo mismo. Mándalas un rato a cubetas distintas y regrésalas después a la misma.', en:'Both hands arrived with almost the same skin temperature, so they report the same thing. Send them to different buckets for a while and bring them back to the same one afterwards.' };
      },
      fix:function(){ HD.i.T = bk('f').T; HD.d.T = bk('c').T; HD.i.at = 't'; HD.d.at = 't'; },
      why:{ es:'Las dos manos están en la misma agua y aun así una la reporta caliente y la otra fría. La sensación no informa de la temperatura del agua, informa de hacia dónde está pasando energía entre el agua y cada mano.',
            en:'Both hands are in the same water and still one reports it hot and the other cold. Sensation does not report the temperature of the water, it reports which way energy is passing between the water and each hand.' }
    },
    {
      q:{ es:'Consigue que la mano derecha reporte que el agua de la cubeta tibia se siente fría.',
          en:'Get the right hand to report that the water in the lukewarm bucket feels cold.' },
      ok:function(){ return HD.d.at === 't' && sens(HD.d) === 'cold'; },
      nudge:function(){

      },
      fix:function(){ HD.i.T = bk('t').T; HD.d.T = bk('t').T; HD.i.at = 't'; HD.d.at = 't'; },

            en:'When skin and water reach the same temperature there is no net transfer between them any more, and without transfer there is no feeling of cold or heat. That is exactly thermal equilibrium.' }
    },
    {
      q:{ es:'Consigue que la mano izquierda esté en la cubeta caliente y no perciba ningún cambio.',
          en:'Get the left hand into the hot bucket without it perceiving any change.' },
      ok:function(){ return HD.i.at === 'c' && sens(HD.i) === 'same'; },
      nudge:function(){
        if (HD.i.at !== 'c') return { es:'La mano izquierda tiene que estar dentro de la cubeta caliente.', en:'The left hand has to be inside the hot bucket.' };
        return { es:'Mientras la piel siga más fría que el agua vas a percibir calor. Déjala ahí hasta que su lectura alcance a la del agua.', en:'While the skin stays colder than the water you will perceive heat. Leave it there until its reading catches up with the water.' };
      },
      fix:function(){ HD.i.T = bk('c').T; HD.i.at = 'c'; },
      why:{ es:'La misma agua caliente que se percibía intensa al principio deja de percibirse cuando la piel llega a su temperatura. El agua no cambió: cambió la diferencia entre las dos.',
            en:'The same hot water that felt intense at first stops being felt once the skin reaches its temperature. The water did not change: what changed was the difference between the two.' }
    }
  ];
  var R = shuffle(TK, rng).slice(0, 3);
  var rd = 0, tries = 0, locked = false, done = false;

  function tiles(hand){
    var out = '', ks = ['f', 't', 'c'];
    for (var i = 0; i < ks.length; i++){

  }

    '<div class="gw-grid" data-r="gd">' + tiles('d') + '</div>' +
    '<div class="gw-mini" data-r="live" style="margin-top:.6rem"></div>' +

      '<span class="gw-val" data-r="cnt"></span></div>' +
    '<div class="gw-fb"></div>';

  var cv = host.querySelector('[data-r="cvs"]'),
      ctx = cv.getContext('2d'),
      elT = host.querySelector('[data-r="task"]'),
      elL = host.querySelector('[data-r="live"]'),
      elC = host.querySelector('[data-r="chk"]'),
      elK = host.querySelector('[data-r="cnt"]');

  var W = 0, H = 0, dpr = window.devicePixelRatio || 1, last = 0, tm = 0, acc = 0;

  function fit(){
    var r = cv.getBoundingClientRect();
    if (!r.width) return false;
    var w = Math.round(r.width), h = Math.round(r.height);
    if (w !== W || h !== H){ W = w; H = h; cv.width = w * dpr; cv.height = h * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
    return true;
  }

  function bucketBox(i){
    var gap = 12, bw = (W - gap * 4) / 3;
    return { x: gap + i * (bw + gap), y: 58, w: bw, h: H - 92 };
  }

  function render(){
    if (!fit()) return;
    ctx.clearRect(0, 0, W, H);
    var i, b, r;
    for (i = 0; i < 3; i++){
      b = bucketBox(i); r = BK[i];
      ctx.strokeStyle = cssv('--border'); ctx.lineWidth = 2;
      ctx.strokeRect(b.x, b.y, b.w, b.h);
      ctx.fillStyle = r.k === 'c' ? cssv('--gold-bg') : (r.k === 'f' ? cssv('--green-bg') : cssv('--surface'));
      ctx.fillRect(b.x + 2, b.y + b.h * 0.28, b.w - 4, b.h * 0.72 - 2);
      ctx.strokeStyle = r.k === 'c' ? cssv('--gold') : cssv('--green'); ctx.lineWidth = 1.6;
      ctx.beginPath();
      for (var q = 0; q <= b.w - 4; q += 4){
        var yy = b.y + b.h * 0.28 + Math.sin(q / 13 + tm * 1.6 + i) * 2.2;

    }
    ['i', 'd'].forEach(function(id, n){
      var h = HD[id], px, py;
      if (h.at){
        var idx = h.at === 'f' ? 0 : (h.at === 't' ? 1 : 2);
        var bb = bucketBox(idx);
        px = bb.x + bb.w * (n === 0 ? 0.32 : 0.68);
        py = bb.y + bb.h * 0.66 + Math.sin(tm * 2 + n) * 2;
      } else {
        px = W * (n === 0 ? 0.3 : 0.7);
        py = 24;
      }
      ctx.fillStyle = n === 0 ? cssv('--green') : cssv('--gold');
      ctx.beginPath(); ctx.arc(px, py, 13, 0, 6.2832); ctx.fill();
      ctx.fillStyle = cssv('--surface');
      ctx.font = 'bold 11px "IBM Plex Mono", monospace';
      ctx.textAlign = 'center';
      ctx.fillText(n === 0 ? 'I' : 'D', px, py + 4);
      ctx.fillStyle = cssv('--text2');
      ctx.font = '10px "IBM Plex Mono", monospace';
      ctx.fillText(Math.round(h.T) + ' °C', px, py + 26);
    });
    ctx.textAlign = 'left';
  }

  function liveTxt(){
    function one(id, lbl){
      var h = HD[id];
      var place = h.at ? (L({ es:'en la cubeta ', en:'in the ' }) + L(bk(h.at).nm) + L({ es:'', en:' bucket' })) : L({ es:'en el aire', en:'in the air' });
      return lbl + ': ' + Math.round(h.T) + ' °C, ' + place + ', ' + L(SENSTX[sens(h)]) + '.';
    }
    elL.innerHTML = one('i', L({ es:'Izquierda', en:'Left' })) + ' ' + one('d', L({ es:'Derecha', en:'Right' }));
  }

  function frame(ts){
    if (!document.body.contains(host)) return;
    if (!last) last = ts;
    var dt = Math.min(45, ts - last); last = ts; tm += dt / 1000; acc += dt;
    if (!locked && !done){
      ['i', 'd'].forEach(function(id){
        var h = HD[id], tgt = h.at ? bk(h.at).T : 33;

      });

    render();
    requestAnimationFrame(frame);
  }

  function drawTask(){
    elT.innerHTML = L(R[rd].q);

  }

  function advance(){

  function close(cls, txt){

    elC.className = 'gw-btn solved';
    say(host, cls, txt);
  }

  function check(){
    if (done) return;
    if (locked){ advance(); return; }
    if (R[rd].ok()){
      close('good', L(R[rd].why));
      return;
    }
    tries++;
    if (tries >= 3){
      R[rd].fix();
      liveTxt();
      close('warm', L({ es:'Así se logra. ', en:'This is how it works out. ' }) + L(R[rd].why));
      return;
    }
    say(host, 'miss', L(R[rd].nudge()));
  }

  host.querySelectorAll('.gw-tile').forEach(function(b){
    b.addEventListener('click', function(){
      if (done || locked) return;
      var hand = b.getAttribute('data-hand'), where = b.getAttribute('data-b');
      HD[hand].at = (where === 'out') ? null : where;
      host.querySelectorAll('.gw-tile[data-hand="' + hand + '"]').forEach(function(o){ o.classList.remove('on'); });
      b.classList.add('on');
      liveTxt();
    });
  });
  elC.addEventListener('click', check);

  drawTask(); liveTxt();
  say(host, '', L({
    es:'Cada mano tarda unos segundos en acercarse a la temperatura del agua en la que está. Puedes moverlas de cubeta cuantas veces quieras.',
    en:'Each hand takes a few seconds to approach the temperature of the water it is in. You can move them between buckets as many times as you like.'
  }));
  requestAnimationFrame(frame);
}

    locked = true;
    elC.textContent = rd === 2 ? L({ es:'Terminar', en:'Finish' }) : L({ es:'Siguiente situación', en:'Next situation' });
    elC.className = 'gw-btn solved';
    say(host, cls, txt);
  }

  function check(){
    if (done) return;
    if (locked){ advance(); return; }
    var s = R[rd];
    if (!choice){ say(host, 'miss', L({ es:'Todavía no eliges ninguna dirección.', en:'You have not picked a direction yet.' })); return; }
    if (choice === s.dir){ close('good', L(s.why)); return; }
    tries++;
    if (tries >= 3){
      choice = s.dir;
      elO.querySelectorAll('.gw-tile').forEach(function(o){ o.classList.toggle('on', o.getAttribute('data-d') === s.dir); });
      liveTxt();
      close('warm', L({ es:'Así ocurre en realidad. ', en:'This is what actually happens. ' }) + L(s.why));
      return;
    }
    var msg;
    if (s.dir === 'none'){
      msg = { es:'Vuelve a comparar las dos lecturas del dibujo: si marcan lo mismo, ninguna de las dos direcciones puede ganarle a la otra.',
              en:'Compare the two readings in the drawing again: if they read the same, neither direction can win over the other.' };
    } else if (choice === 'none'){
      msg = { es:'Las dos lecturas son distintas, así que el intercambio no puede estar detenido todavía. Elige una dirección.',
              en:'The two readings are different, so the exchange cannot have stopped yet. Pick a direction.' };
    } else {
      msg = { es:'Elegiste la dirección contraria. Fíjate cuál de los dos marca más grados: la energía nunca viaja por sí sola hacia el que ya está más caliente.',
              en:'You picked the opposite direction. Look at which of the two reads more degrees: energy never travels on its own towards the one that is already hotter.' };
    }
    say(host, 'miss', L(msg));
  }

  elC.addEventListener('click', check);
  drawTask(); liveTxt();
  say(host, '', L({
    es:'Puedes cambiar de dirección las veces que quieras antes de comprobar; el dibujo muestra al instante lo que estás afirmando.',
    en:'You can change direction as many times as you like before checking; the drawing shows at once what you are claiming.'
  }));
  requestAnimationFrame(frame);
}


/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 4  ::  El vaso y la olla
   Predecir donde queda la temperatura final cuando las cantidades difieren.
   ══════════════════════════════════════════════════════════════════════════ */
function w4(rng, host){
  var RT = shuffle([2, 3, 5], rng);
  var rd = 0, tries = 0, locked = false, done = false;
  var ratio = 3, Tbig = 0, Tsml = 0, Teq = 0, LO = 0, HI = 0, pred = 0, curB = 0, curS = 0, mixing = false;

  function newRound(){
    ratio = RT[rd % RT.length];
    var hotBig = rng() < 0.5;
    var Thot = ri(rng, 62, 88), Tcold = ri(rng, 6, 28);
    Tbig = hotBig ? Thot : Tcold;
    Tsml = hotBig ? Tcold : Thot;
    Teq = Math.round((ratio * Tbig + Tsml) / (ratio + 1));
    LO = Math.min(Tbig, Tsml) - 12; HI = Math.max(Tbig, Tsml) + 12;
    pred = ri(rng, LO, HI);
    curB = Tbig; curS = Tsml; mixing = false;
  }
  newRound();

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'El vaso y la olla', en:'The glass and the pot' }) + '</div>' +
    '<div class="gw-q" data-r="task"></div>' +
    '<canvas class="gw-cvs tall" data-r="cvs"></canvas>' +
    '<div class="gw-line">' +
      '<button class="gw-btn" data-r="dn">−1 °C</button>' +
      '<span class="gw-val" data-r="pv"></span>' +
      '<button class="gw-btn" data-r="up">+1 °C</button>' +
    '</div>' +
    '<div class="gw-mini" data-r="live" style="margin-top:.6rem"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Mezclar', en:'Mix them' }) + '</button>' +
      '<span class="gw-val" data-r="cnt"></span></div>' +
    '<div class="gw-fb"></div>';

  var cv = host.querySelector('[data-r="cvs"]'),
      ctx = cv.getContext('2d'),
      elP = host.querySelector('[data-r="pv"]'),
      elU = host.querySelector('[data-r="up"]'),
      elD = host.querySelector('[data-r="dn"]'),
      elT = host.querySelector('[data-r="task"]'),
      elL = host.querySelector('[data-r="live"]'),
      elC = host.querySelector('[data-r="chk"]'),
      elK = host.querySelector('[data-r="cnt"]');

  var W = 0, H = 0, dpr = window.devicePixelRatio || 1, last = 0, dragging = false;
  var PADL = 26, PADR = 26;

  function fit(){
    var r = cv.getBoundingClientRect();
    if (!r.width) return false;
    var w = Math.round(r.width), h = Math.round(r.height);
    if (w !== W || h !== H){ W = w; H = h; cv.width = w * dpr; cv.height = h * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
    return true;
  }

  function sx(tv){ return PADL + (tv - LO) / (HI - LO) * (W - PADL - PADR); }
  function xToT(x){ return LO + (x - PADL) / (W - PADL - PADR) * (HI - LO); }

  function vessel(x, w, hgt, tv, label, sub, tok){
    var yb = H - 88, yt = yb - hgt;
    ctx.strokeStyle = cssv(tok); ctx.lineWidth = 2.2;
    ctx.strokeRect(x, yt, w, hgt);
    ctx.fillStyle = cssv(tok === '--bad' ? '--gold-bg' : '--green-bg');
    ctx.fillRect(x + 2, yt + 2, w - 4, hgt - 4);
    ctx.fillStyle = cssv('--text');
    ctx.font = 'bold 12px "IBM Plex Mono", monospace';
    ctx.textAlign = 'center';
    ctx.fillText(Math.round(tv) + ' °C', x + w / 2, yt + hgt / 2 + 4);
    ctx.fillStyle = cssv('--text3');
    ctx.font = '10px "IBM Plex Sans", sans-serif';
    ctx.fillText(label, x + w / 2, yt - 8);
    ctx.fillText(sub, x + w / 2, yb + 14);
    ctx.textAlign = 'left';
  }

  function render(){
    if (!fit()) return;
    ctx.clearRect(0, 0, W, H);
    var wBig = Math.min(120, W * 0.3), wSml = wBig / Math.sqrt(ratio);
    var hBig = 84, hSml = 84 / Math.sqrt(ratio) + 18;
    vessel(W * 0.26 - wBig / 2, wBig, hBig, curB,
      L({ es:'recipiente grande', en:'large container' }),
      ratio + L({ es:' partes de agua', en:' parts of water' }), '--green');
    vessel(W * 0.72 - wSml / 2, wSml, hSml, curS,
      L({ es:'recipiente pequeño', en:'small container' }),
      L({ es:'1 parte de agua', en:'1 part of water' }), '--bad');
    var ly = H - 34;
    ctx.strokeStyle = cssv('--border'); ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(PADL, ly); ctx.lineTo(W - PADR, ly); ctx.stroke();
    ctx.font = '9px "IBM Plex Mono", monospace';
    ctx.textAlign = 'center';
    [[curB, L({ es:'grande', en:'large' }), '--green'], [curS, L({ es:'pequeño', en:'small' }), '--bad']].forEach(function(m){
      var X = sx(m[0]);
      ctx.fillStyle = cssv(m[2]);
      ctx.beginPath(); ctx.arc(X, ly, 3.6, 0, 6.2832); ctx.fill();
      ctx.fillStyle = cssv('--text3');
      ctx.fillText(m[1], X, ly + 13);
    });
    var px = sx(pred);
    ctx.fillStyle = cssv('--gold');
    ctx.beginPath();
    ctx.moveTo(px, ly - 5); ctx.lineTo(px - 6, ly - 15); ctx.lineTo(px + 6, ly - 15);
    ctx.closePath(); ctx.fill();
    ctx.fillText(pred + ' °C', px, ly - 19);
    ctx.textAlign = 'left';
  }

  function frame(ts){
    if (!document.body.contains(host)) return;
    if (!last) last = ts;
    var dt = Math.min(45, ts - last); last = ts;
    if (mixing){
      curB += (Teq - curB) * Math.min(1, dt / 700);
      curS += (Teq - curS) * Math.min(1, dt / 700);
    }
    render();
    requestAnimationFrame(frame);
  }

  function liveTxt(){
    var lo = Math.min(Tbig, Tsml), hi = Math.max(Tbig, Tsml);
    var m;
    if (pred <= lo || pred >= hi){
      m = { es:'Tu marcador quedó fuera del intervalo de las dos temperaturas iniciales.', en:'Your marker landed outside the interval of the two starting temperatures.' };
    } else if (Math.abs(pred - Tbig) < Math.abs(pred - Tsml)){
      m = { es:'Tu marcador está más cerca del recipiente grande que del pequeño.', en:'Your marker is closer to the large container than to the small one.' };
    } else if (Math.abs(pred - Tbig) > Math.abs(pred - Tsml)){
      m = { es:'Tu marcador está más cerca del recipiente pequeño que del grande.', en:'Your marker is closer to the small container than to the large one.' };
    } else {
      m = { es:'Tu marcador está justo a media distancia entre los dos.', en:'Your marker is exactly halfway between the two.' };
    }
    elL.innerHTML = L(m);
  }

  function setPred(v){
    if (locked || done) return;
    pred = Math.max(LO, Math.min(HI, Math.round(v)));
    elP.textContent = pred + ' °C';
    liveTxt();
  }

  function ptrX(e){
    var r = cv.getBoundingClientRect();
    var s = e.touches ? e.touches[0] : e;
    return s.clientX - r.left;
  }

  function drawTask(){
    elT.innerHTML = L({ es:'Los dos recipientes tienen agua y se van a vaciar juntos en un termo aislado. El grande lleva ',
                        en:'Both containers hold water and are about to be poured together into an insulated flask. The large one holds ' }) +
      ratio + L({ es:' veces más agua que el pequeño. Arrastra el marcador sobre la línea hasta la temperatura en la que crees que van a terminar los dos.',
                  en:' times more water than the small one. Drag the marker along the line to the temperature where you think both will end up.' });
    elK.textContent = L({ es:'mezcla ', en:'mix ' }) + (rd + 1) + L({ es:' de 3', en:' of 3' });
  }

  function advance(){
    rd++;
    if (rd >= 3){
      done = true;
      elC.textContent = L({ es:'Completado', en:'Completed' });
      elC.className = 'gw-btn solved';
      elK.textContent = '';
      say(host, 'good', L({
        es:'En las tres mezclas la temperatura final quedó entre las dos iniciales y del lado del recipiente con más agua. Tener más material no da mayor temperatura: da más peso a la hora de decidir dónde se encuentran las dos.',
        en:'In all three mixes the final temperature landed between the two starting ones and on the side of the container with more water. Having more material does not give a higher temperature: it gives more weight when deciding where the two meet.'
      }));
      return;
    }
    locked = false; tries = 0;
    newRound(); drawTask();
    elP.textContent = pred + ' °C';
    liveTxt();
    elC.textContent = L({ es:'Mezclar', en:'Mix them' });
    elC.className = 'gw-btn';
    say(host, '', L({ es:'Mezcla nueva, con otra proporción y otras temperaturas iniciales.', en:'New mix, with a different proportion and different starting temperatures.' }));
  }

  function close(cls, txt){
    locked = true; mixing = true;
    elC.textContent = rd === 2 ? L({ es:'Terminar', en:'Finish' }) : L({ es:'Siguiente mezcla', en:'Next mix' });
    elC.className = 'gw-btn solved';
    say(host, cls, txt);
  }

  function check(){
    if (done) return;
    if (locked){ advance(); return; }
    var lo = Math.min(Tbig, Tsml), hi = Math.max(Tbig, Tsml);
    if (Math.abs(pred - Teq) <= 2){
      close('good', L({ es:'Muy bien colocado. El agua del recipiente grande es ', en:'Very well placed. The water in the large container is ' }) + ratio +
        L({ es:' veces más que la del pequeño, así que su temperatura se mueve poco y la del pequeño da un salto largo. Los dos se encuentran cerca de ',
            en:' times more than in the small one, so its temperature moves little while the small one takes a long jump. The two meet close to ' }) + Tbig + L({ es:' °C.', en:' °C.' }));
      return;
    }
    tries++;
    if (tries >= 3){
      pred = Teq; elP.textContent = pred + ' °C'; liveTxt();
      close('warm', L({ es:'Ahí quedan los dos. El punto de encuentro siempre cae entre ', en:'That is where both end up. The meeting point always falls between ' }) + lo +
        L({ es:' °C y ', en:' °C and ' }) + hi +
        L({ es:' °C, y se corre hacia el lado del recipiente con más agua, porque ese aporta más partículas al reparto.',
            en:' °C, and it shifts towards the side of the container with more water, because that one brings more particles to the sharing.' }));
      return;
    }
    var msg;
    if (pred <= lo || pred >= hi){
      msg = { es:'Ninguno de los dos puede terminar fuera del intervalo: el caliente solo puede bajar y el frío solo puede subir. Mete el marcador entre las dos marcas.',
              en:'Neither can end up outside the interval: the hot one can only come down and the cold one can only go up. Bring the marker between the two marks.' };
    } else if (Math.abs(pred - Tbig) > Math.abs(pred - Teq)){
      msg = { es:'Vas en el intervalo correcto, pero el recipiente grande manda más en el resultado. Acerca el marcador a su temperatura.',
              en:'You are in the right interval, but the large container has more say in the result. Move the marker closer to its temperature.' };
    } else {
      msg = { es:'Te acercaste demasiado al recipiente grande: el pequeño también aporta algo y corre el punto de encuentro hacia su lado. Sepáralo un poco.',
              en:'You went too close to the large container: the small one contributes something too and shifts the meeting point towards its side. Move it away a little.' };
    }
    say(host, 'miss', L(msg));
  }

  cv.addEventListener('mousedown', function(e){ dragging = true; setPred(xToT(ptrX(e))); });
  cv.addEventListener('mousemove', function(e){ if (dragging) setPred(xToT(ptrX(e))); });
  cv.addEventListener('mouseup', function(){ dragging = false; });
  cv.addEventListener('mouseleave', function(){ dragging = false; });
  cv.addEventListener('touchstart', function(e){ e.preventDefault(); dragging = true; setPred(xToT(ptrX(e))); }, { passive:false });
  cv.addEventListener('touchmove', function(e){ e.preventDefault(); if (dragging) setPred(xToT(ptrX(e))); }, { passive:false });
  cv.addEventListener('touchend', function(){ dragging = false; });
  elU.addEventListener('click', function(){ setPred(pred + 1); });
  elD.addEventListener('click', function(){ setPred(pred - 1); });
  elC.addEventListener('click', check);

  drawTask();
  elP.textContent = pred + ' °C';
  liveTxt();
  say(host, '', L({
    es:'Arrastra el dedo o el cursor sobre el dibujo para mover el marcador, o ajústalo grado por grado con los botones.',
    en:'Drag your finger or the cursor over the drawing to move the marker, or adjust it degree by degree with the buttons.'
  }));
  requestAnimationFrame(frame);
}


/* ══════════════════════════════════════════════════════════════════════════
   PROBLEMAS GRADUADOS  ::  10 slots, cada uno con su pool de variantes
   (Rule 4: texto, estructura y respuesta correcta definidos por variante)
   ══════════════════════════════════════════════════════════════════════════ */
function build(rng, title, pool){
  var v = pk(rng, pool);
  return {
    title: L(title),
    q: L(v.q),
    hint: L(v.hint),
    exp: L(v.exp),
    options: v.options.map(function(o){ return L(o); }),
    correct: v.correct
  };
}

          en:'A thermometer reads 70 °C inside a cup of tea and 20 °C inside a glass of tap water. In terms of the particle model, what is the difference between the two liquids?' },

            en:'With the same number of particles, the only thing that tells the two jars apart is how fast they move. Since temperature describes precisely that average speed, the jar with faster particles is the one at the higher temperature.' }

      q:{ es:'Las chispas que saltan de una bengala alcanzan cientos de grados y, si tocan la piel por un instante, apenas se sienten. Una taza con agua a 90 °C, en cambio, provoca una quemadura seria. ¿Cuál es la mejor explicación de esta diferencia?',

        { es:'El vaso está más caliente porque su agua se reparte entre menos partículas', en:'The glass is hotter because its water is shared among fewer particles' }
      ],
