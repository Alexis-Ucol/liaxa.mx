<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Regiones Sísmicas y Volcánicas en México y el Mundo</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; text-align: justify; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Regiones Sísmicas y Volcánicas en México y el Mundo</div>
    <div class="wcourse" id="wcourse-el">Geografía · 1° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Regiones Sísmicas y Volcánicas en México y el Mundo</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="sbtn" id="dlBtn" onclick="generatePDF()" style="max-width:280px;margin:0 auto;">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   CENTRALIZED SCHOOL CONFIG (Rule 16) — ships UNBRANDED (Rule 11).
   The ONLY rebranding point. build_all.py substitutes these exact fields
   (BRAND_FIELDS / RGB_FIELDS / logo*) downstream; :root/dark stay as fallback.
   Neutral defaults below == the static :root/dark values, so unbranded == no-op.
   ══════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:'#243c6c', primaryDark:'#14223f', primaryBg:'#e9edf4',
  accent:'#9cb4cc', accentBg:'#e7edf3',
  darkPrimary:'#5575b4', darkPrimaryDark:'#839fd7', darkPrimaryBg:'#121d34',

function getAttemptKey(name, group){ return 'geo1_t04_g02__att__' + (name+'__'+group).replace(/\s+/g,'_'); }
function nextAttempt(name, group){ var k=getAttemptKey(name,group),n=0; try{n=parseInt(localStorage.getItem(k)||'0',10)||0;}catch(e){} n++; try{localStorage.setItem(k,String(n));}catch(e){} return n; }
function currentAttempt(name, group){ var k=getAttemptKey(name,group); try{return parseInt(localStorage.getItem(k)||'1',10)||1;}catch(e){return 1;} }

var studentData   = {};
var problems      = [];

/* ================================================
   SESSION PERSISTENCE  (localStorage)
   ================================================ */
function lsKey() {
  var n = (studentData.name  || '').trim();
  var g = (studentData.group || '').trim();
  return 'geo1_t04_g02__' + (n + '__' + g).replace(/\s+/g, '_');
}

function saveSession() {
  if (!studentData.name) return;
  var drawings = [], texts = [], photos = [];
  problems.forEach(function(p, i) {
    var dc = document.getElementById('dc' + i);
    if (dc && dc.width) {
      var blank = document.createElement('canvas');
      blank.width = dc.width; blank.height = dc.height;
      drawings.push(dc.toDataURL() === blank.toDataURL() ? null : dc.toDataURL('image/png'));
    } else { drawings.push(null); }
    var ta = document.getElementById('ta' + i);
    texts.push(ta ? ta.value : '');
    var pp = document.getElementById('pp' + i);
    photos.push((pp && pp.src && pp.src.indexOf('data:') === 0) ? pp.src : null);
  });
  var state = {
    name: studentData.name, group: studentData.group,
    answeredCount: answeredCount, correctCount: correctCount,
    choices: problems.map(function(p) { return p.studentChoice; }),
    drawings: drawings, texts: texts, photos: photos
  };
  try { localStorage.setItem(lsKey(), JSON.stringify(state)); } catch(e) {}
}

function loadSession(name, group) {
  var key = 'geo1_t04_g02__' + (name + '__' + group).replace(/\s+/g, '_');
  try { var r = localStorage.getItem(key); return r ? JSON.parse(r) : null; } catch(e) { return null; }
}

function restoreSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  var saved = loadSession(name, group);
  if (!saved) return;
  document.getElementById('restoreBar').style.display = 'none';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = currentAttempt(name, group);
  buildLesson(seededRng(name + group + att));
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
  saved.choices.forEach(function(choice, idx) {
    if (choice !== null && choice !== undefined) confirmMC(idx, choice);
  });
  setTimeout(function() {
    if (saved.drawings) {
      saved.drawings.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var dc = document.getElementById('dc' + i);
        if (!dc || !dc.width) return;
        var img = new Image();
        img.onload = function() {
          var dpr = window.devicePixelRatio || 1;
          dc.getContext('2d').drawImage(img, 0, 0, dc.width / dpr, dc.height / dpr);
        };
        img.src = dataUrl;
      });
    }
    if (saved.texts) {
      saved.texts.forEach(function(text, i) {
        if (!text) return;
        var ta = document.getElementById('ta' + i);
        if (ta) ta.value = text;
      });
    }
    if (saved.photos) {
      saved.photos.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var pp = document.getElementById('pp' + i);
        if (!pp) return;
        pp.src = dataUrl; pp.style.display = 'block';
        var pz = document.getElementById('pz' + i);
        if (pz) pz.style.opacity = '0.4';
      });
    }
  }, 300);
}

function dismissRestore() {
  document.getElementById('restoreBar').style.display = 'none';

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

async function generatePDF() {
  var btn = document.getElementById('dlBtn');
  btn.textContent = 'Generando PDF…';
  btn.disabled = true;

  var jspdf   = window.jspdf;
  var doc     = new jspdf.jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });
  var PW      = 215.9;
  var M       = 18;
  var TW      = PW - M * 2;
  var PH      = doc.internal.pageSize.height;
  var name    = studentData.name;
  var group   = studentData.group;
  var total   = problems.length;
  var pct     = Math.round(correctCount / total * 100);
  var dateStr = new Date().toLocaleString('es-MX', { dateStyle:'long', timeStyle:'short' });

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS — INJECTION BLOCK ─────────────────────────────────────────
  //   Match these RGB values to --green and --gold above.
  //   PRIMARY  → pBR, pBG, pBB
  //   ACCENT   → pAR, pAG, pAB
  // ──────────────────────────────────────────────────────────────────────────
  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;  // PRIMARY (from SCHOOL, Rule 16)
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;   // ACCENT (from SCHOOL, Rule 16)

  function pdfText(html) {
    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/\u2192/g,'->').replace(/\u2212/g,'-').replace(/\u00b2/g,'^2')
      .replace(/\u00b3/g,'^3').replace(/\u00d7/g,'x').replace(/\u00f7/g,'/')
      .replace(/\u2260/g,'!=').replace(/\u2264/g,'<=').replace(/\u2265/g,'>=')
      .replace(/\u221a/g,'sqrt').replace(/\u03c0/g,'pi').replace(/\u2026/g,'...')
      .replace(/\s+/g,' ').trim();
  }

  // ── PORTADA: orange line / white logo strip / orange line / blue band ──
  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,2,'F');   // top accent line
  doc.setFillColor(255,255,255); doc.rect(0,2,PW,26,'F');                               // white logo strip
  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,28,PW,2,'F');  // bottom accent line
  doc.setFillColor(pBR,pBG,pBB); doc.rect(0,30,PW,34,'F');       // blue header band

  if (SCHOOL.logoLeftB64) {
    var fmtL = SCHOOL.logoLeftB64.indexOf('/9j/') > -1 ? 'JPEG' : 'PNG';
    try { doc.addImage(SCHOOL.logoLeftB64, fmtL, M, 4, 48, 22); } catch(e) {}
  }
  if (SCHOOL.logoRightB64) {
    var fmtR = SCHOOL.logoRightB64.indexOf('/9j/') > -1 ? 'JPEG' : 'PNG';
    try { doc.addImage(SCHOOL.logoRightB64, fmtR, 130, 4, 48, 22); } catch(e) {}
  }

  var lx = PW - M - 36;
  var ly = 10;
  doc.setDrawColor(pBR,pBG,pBB); doc.setLineWidth(0.7);
  doc.lines([[2.57-1.03,4.63-6.17],[4.11-2.57,5.14-4.63],[5.66-4.11,2.57-5.14]], lx+1.03, ly+6.17);
  doc.setFillColor(pAR,pAG,pAB); doc.circle(lx+5.66, ly+2.57, 0.9, 'F');
  doc.setDrawColor(pAR,pAG,pAB); doc.setLineWidth(0.7);
  doc.line(lx+8.23, ly+1.54, lx+8.23, ly+7.2);
  doc.setTextColor(pBR,pBG,pBB); doc.setFontSize(11); doc.setFont('helvetica','bold');
  doc.text('LIAXA', lx+10, ly+6.8);

  doc.setTextColor(232,238,247); doc.setFontSize(19); doc.setFont('helvetica','bold');
  doc.text(t('wtitle'), M, 49);
  doc.setTextColor(150,165,200); doc.setFontSize(8); doc.setFont('helvetica','normal');
  doc.text(dateStr, M, 59);

  // ── Student info card (name + group only — código goes to footer) ──
  doc.setFillColor(237,240,245); doc.roundedRect(M,72,TW,20,3,3,'F');
  doc.setTextColor(130,140,160); doc.setFontSize(8.5); doc.setFont('helvetica','bold');
  doc.text('ALUMNO', M+4, 79); doc.text('GRUPO', 130, 79);
  doc.setTextColor(20,24,32); doc.setFontSize(11); doc.setFont('helvetica','bold');
  doc.text(name, M+4, 87); doc.text(group, 130, 87);

  // ── Score box ──
  var sc = pct>=70?[26,106,74]:pct>=50?[224,123,26]:[176,48,16];
  doc.setFillColor(255,255,255); doc.roundedRect(M,100,TW,34,4,4,'F');
  doc.setDrawColor(sc[0],sc[1],sc[2]); doc.setLineWidth(0.8);
  doc.roundedRect(M,100,TW,34,4,4,'S');

  doc.rect(M,142,TW,8,'F'); doc.text('RESUMEN DE PROBLEMAS', M+4, 148);

    doc.roundedRect(M,sy,TW,10,2,2,'F');
    doc.setFillColor(ok?26:176, ok?106:48, ok?74:16);
    doc.circle(M+6, sy+5, 2.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(7); doc.setFont('helvetica','bold');
    doc.text(ok?'✓':'✗', M+4.5, sy+6.5);
    doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('helvetica','normal');
    doc.text('Problema '+(i+1)+': '+pdfText(prob.title), M+12, sy+6.5);
    doc.setTextColor(ok?26:176, ok?106:48, ok?74:16);
    doc.text(ok?'Correcto':'Incorrecto', PW-M-24, sy+6.5);
    sy += 12;
  });

  // ── Per-problem pages ──
  for (var i = 0; i < problems.length; i++) {
    var prob = problems[i];
    doc.addPage();
    var wy = 0;

    doc.setFillColor(pBR,pBG,pBB); doc.rect(0,0,PW,20,'F');
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,3,'F');
    doc.setTextColor(pAR,pAG,pAB); doc.setFontSize(7); doc.setFont('helvetica','normal');
    doc.text(t('wcourse')+'  ·  '+t('wtitle'), M, 10);
    doc.setTextColor(232,238,247); doc.setFontSize(10.5); doc.setFont('helvetica','bold');
    doc.text('Problema '+(i+1)+' de '+total+'  ·  '+pdfText(prob.title), M, 17);
    wy = 25;

    var qRaw = pdfText(prob.questionText);
    doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var qLines = doc.splitTextToSize(qRaw, TW-10);
    var qBoxH  = 8 + qLines.length*5 + 3;
    doc.setFillColor(237,240,245); doc.roundedRect(M,wy,TW,qBoxH,2,2,'F');
    doc.setTextColor(pBR,pBG,pBB); doc.setFontSize(6.5); doc.setFont('helvetica','bold');
    doc.text('PREGUNTA', M+4, wy+6);
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var qy = wy+12;
    qLines.forEach(function(ln,li){ doc.text(ln, M+4, qy+li*5); });
    wy += qBoxH + 4;

    var isOk   = document.getElementById('pc'+i).classList.contains('ok');
    var chosen = prob.studentChoice != null ? pdfText(prob.options[prob.studentChoice]||'-') : '-';
    var corr   = pdfText(prob.options[prob.correctIdx]||'');
    var expRaw = pdfText(prob.explanation||'');
    doc.setFontSize(8.5); var chLines = doc.splitTextToSize('Alumno: '+chosen, TW-18);
    doc.setFontSize(8);   var coLines = doc.splitTextToSize('Correcto: '+corr, TW-18);
    doc.setFontSize(7.5); var exLines = doc.splitTextToSize('Solución: '+expRaw, TW-18).slice(0,4);
    var ansBoxH = 8 + chLines.length*5.5 + coLines.length*5 + exLines.length*5 + 6;
    doc.setFillColor(isOk?232:255, isOk?240:232, isOk?232:228);
    doc.roundedRect(M,wy,TW,ansBoxH,2,2,'F');
    doc.setFillColor(isOk?26:176, isOk?106:48, isOk?74:16);
    doc.circle(M+7, wy+8, 3.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(9); doc.setFont('helvetica','bold');
    doc.text(isOk?'✓':'✗', M+5.2, wy+10.5);
    var ay = wy+7;
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','bold');
    chLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5.5); });
    ay += chLines.length*5.5 + 3;
    doc.setTextColor(26,106,74); doc.setFontSize(8); doc.setFont('helvetica','normal');
    coLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    ay += coLines.length*5 + 3;
    doc.setTextColor(90,85,80); doc.setFontSize(7.5);
    exLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    wy += ansBoxH + 5;

    doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
    doc.setFontSize(7); doc.setFont('helvetica','bold');
    doc.rect(M,wy,TW,8,'F'); doc.text('TRABAJO DEL ALUMNO', M+4, wy+5.5);
    wy += 11;

    var dc = document.getElementById('dc'+i);
    if (dc) {
      try {
        var imgD = dc.toDataURL('image/png');
        var ar   = dc.height / dc.width;
        var iw   = TW;
        var ih   = Math.min(iw * ar, 68);
        doc.addImage(imgD, 'PNG', M, wy, iw, ih);
        wy += ih + 4;
      } catch(e) {}
    }

    var ta = document.getElementById('ta'+i);
    if (ta && ta.value.trim()) {
      if (wy > PH-30) { doc.addPage(); wy = 20; }
      doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('courier','normal');
      var taLines = doc.splitTextToSize(ta.value, TW);
      taLines.slice(0,16).forEach(function(ln) {
        if (wy > PH-15) { doc.addPage(); wy = 20; }
        doc.text(ln, M, wy); wy += 5;
      });
      wy += 2;
    }

    var pp = document.getElementById('pp'+i);
    if (pp && pp.src && pp.src.indexOf('data:') === 0) {
      if (wy > PH-55) { doc.addPage(); wy = 20; }
      try { doc.addImage(pp.src, 'JPEG', M, wy, TW, 68); wy += 72; } catch(e) {}
    }
  }

  // ── Footer on every page ──
  var pages = doc.internal.getNumberOfPages();
  for (var p = 1; p <= pages; p++) {
    doc.setPage(p);
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0, PH-3, PW, 3, 'F');
    doc.setTextColor(130,140,160); doc.setFontSize(6.5); doc.setFont('helvetica','normal');
    doc.text(name+'  ·  '+group+'  ·  Código: '+code+'  ·  Página '+p+'/'+pages,
      PW/2, PH-5, {align:'center'});
  }

    // ── SAVE / SHARE — iOS-safe download (LIAXA iOS PDF fix, Rule 12) ─────────
  //   iOS Safari ignores the <a download> attribute, so a plain download fails
  //   silently on iPhone/iPad. iOS -> native share sheet (-> "Save to Files"),
  //   with an inline-open fallback; everything else -> <a download> click.
  //   Runs synchronously off the tap so iOS accepts navigator.share().
  var _fname   = 'geo1_t04_g02_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf';
  var _pdfBlob = doc.output('blob');

  function _restorePdfBtn(){ btn.innerHTML = '\u2b07 &nbsp;' + t('btn-pdf'); btn.disabled = false; }
  function _openPdfInline(b){
    var u = URL.createObjectURL(b);
    var w = window.open(u, '_blank');
    if (!w) { window.location.href = u; }
    setTimeout(function(){ URL.revokeObjectURL(u); }, 60000);
  }

  var _isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
               (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  if (_isIOS) {
    var _pdfFile = new File([_pdfBlob], _fname, { type:'application/pdf' });
    if (navigator.canShare && navigator.canShare({ files:[_pdfFile] })) {
      navigator.share({ files:[_pdfFile], title:_fname })
        .then(_restorePdfBtn)
        .catch(function(e){
          if (e && e.name === 'AbortError') { _restorePdfBtn(); return; }
          _openPdfInline(_pdfBlob); _restorePdfBtn();
        });
      return;
    }
    _openPdfInline(_pdfBlob); _restorePdfBtn();
    return;
  }

  var _dlUrl = URL.createObjectURL(_pdfBlob);
  var _dlA   = document.createElement('a');
  _dlA.href  = _dlUrl; _dlA.download = _fname;
  document.body.appendChild(_dlA); _dlA.click();
  setTimeout(function(){ document.body.removeChild(_dlA); URL.revokeObjectURL(_dlUrl); }, 200);
  _restorePdfBtn();
}

function mcSpec(v){
  return { title:L(v.title), q:L(v.q), fn:'', options:L(v.opts), correct:v.ci, hint:L(v.hint), exp:L(v.exp), showWork:false };

    body +

}

function addProblem(rng, spec){
  var idx = problems.length;
  var correctVal = spec.options[spec.correct];
  var sh = shuffle(spec.options, rng);
  var prob = {
    title: spec.title,
    questionText: spec.q,
    fn: spec.fn || '',
    hint: spec.hint || '',
    explanation: spec.exp || '',
    options: sh,
    correctIdx: sh.indexOf(correctVal),
    showWork: !!spec.showWork,
    studentChoice: null,
    pendingChoice: null
  };
  problems.push(prob);
  buildOneCard(prob, idx);
}

/* ══════════════════════════════════════════════════════════════════════════
   buildLesson :: concepto -> manipulativo -> problema, alternados (Rule 1)
   ══════════════════════════════════════════════════════════════════════════ */
function buildLesson(rng){
  injectGuideCSS();

  /* ── Apertura ── */
  sec(
    L({ es:'Punto de partida', en:'Starting point' }),
    L({ es:'Un mapa que se dibuja solo', en:'A map that draws itself' }),
    '<p>' + L({
      es:'Imagina que tomas un planisferio en blanco y marcas con un punto rojo cada sismo registrado durante un año, y con un punto naranja cada volcán activo del planeta. Al terminar no tendrías una nube de puntos repartidos por todos lados: tendrías líneas. Líneas largas, delgadas y sorprendentemente ordenadas que recorren el borde del océano Pacífico, cruzan el sur de Europa y Asia, y bajan por el centro del Atlántico. El resto del mapa quedaría casi vacío.',
      en:'Imagine you take a blank world map and mark with a red dot every earthquake recorded during one year, and with an orange dot every active volcano on the planet. When you finish you would not have a cloud of dots spread everywhere: you would have lines. Long, thin and surprisingly tidy lines that run around the edge of the Pacific Ocean, cross southern Europe and Asia, and go down the middle of the Atlantic. The rest of the map would be almost empty.'
    }) + '</p>' +
    '<div class="callout"><p><strong>' + L({ es:'Idea clave: ', en:'Key idea: ' }) + '</strong>' + L({
      es:'esas líneas no son casualidad ni castigo. Son el dibujo de los bordes de las placas tectónicas asomando en la superficie. En esta guía vas a aprender a leer ese mapa: reconocer las grandes regiones sísmicas y volcánicas del mundo, entender por qué unas tienen volcanes y otras no, ubicar las regiones activas de México y decidir qué hace una comunidad con esa información.',
      en:'those lines are neither chance nor punishment. They are the drawing of the edges of the tectonic plates showing at the surface. In this guide you will learn to read that map: to recognize the great seismic and volcanic regions of the world, to understand why some have volcanoes and others do not, to locate the active regions of Mexico and to decide what a community does with that information.'
    }) + '</p></div>'
  );

  /* ══ CONCEPTO 1 :: los grandes cinturones del mundo ══ */
  var s1 = sec(
    L({ es:'Concepto 1', en:'Concept 1' }),
    L({ es:'Los tres grandes cinturones del planeta', en:'The three great belts of the planet' }),
    '<p>' + L({
      es:'Cuando los geógrafos reunieron los registros de sismos y volcanes de todo el mundo, descubrieron que casi todos caben en tres franjas. La primera y más activa es el Cinturón de Fuego del Pacífico, una herradura de unos cuarenta mil kilómetros que arranca en Nueva Zelanda, sube por Indonesia, Filipinas, Japón y las Kuriles, cruza por Alaska y las islas Aleutianas y baja por California, México, Centroamérica, Perú y Chile. Ahí se concentra alrededor de tres cuartas partes de los volcanes activos del planeta y la gran mayoría de los sismos más fuertes.',
      en:'When geographers gathered the records of earthquakes and volcanoes from all over the world, they found that almost all of them fit into three strips. The first and most active is the Pacific Ring of Fire, a horseshoe of some forty thousand kilometres that starts in New Zealand, goes up through Indonesia, the Philippines, Japan and the Kuriles, crosses Alaska and the Aleutian islands and comes down through California, Mexico, Central America, Peru and Chile. It concentrates about three quarters of the active volcanoes on the planet and the vast majority of the strongest earthquakes.'
    }) + '</p>' +
    '<p>' + L({
      es:'La segunda franja es el cinturón Mediterráneo-Transasiático, también llamado Alpino-Himalayo. Va del Mediterráneo hacia el este: Italia, Grecia, Turquía, Irán, el norte de la India y el Himalaya. Es la segunda región sísmica del mundo, aunque tiene bastantes menos volcanes activos que la primera. La tercera franja es la más discreta: recorre el fondo del océano Atlántico de norte a sur siguiendo la dorsal Mesoatlántica, y aunque tiembla todo el tiempo, casi nadie lo nota porque ocurre bajo el mar. Solo emerge en un lugar habitado, Islandia, que por eso es una isla llena de volcanes y aguas termales.',
      en:'The second strip is the Mediterranean and Trans Asian belt, also called Alpine and Himalayan. It runs from the Mediterranean eastwards: Italy, Greece, Turkey, Iran, northern India and the Himalaya. It is the second seismic region of the world, although it has far fewer active volcanoes than the first. The third strip is the most discreet one: it runs along the floor of the Atlantic Ocean from north to south following the Mid Atlantic ridge, and although it shakes all the time, almost nobody notices because it happens under the sea. It surfaces at only one inhabited place, Iceland, which is why it is an island full of volcanoes and hot springs.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Cinturón de Fuego', en:'Ring of Fire' }), L({ es:'rodea el Pacífico', en:'surrounds the Pacific' }), L({ es:'la mayoría de volcanes activos y sismos fuertes', en:'most active volcanoes and strong earthquakes' })) +
      rcard(L({ es:'Mediterráneo-Transasiático', en:'Mediterranean and Trans Asian' }), L({ es:'del sur de Europa al Himalaya', en:'from southern Europe to the Himalaya' }), L({ es:'muchos sismos, pocos volcanes activos', en:'many earthquakes, few active volcanoes' })) +

      es:'Dos regiones pueden temblar con la misma frecuencia y no tener nada más en común. Lo que las distingue es la manera en que se tocan las placas en ese punto, y cada manera deja huellas distintas en el paisaje. Donde una placa oceánica se hunde bajo otra aparece siempre la misma combinación: una fosa marina profunda frente a la costa, una hilera de volcanes tierra adentro y sismos que se originan cada vez más profundo conforme uno se aleja del mar. Japón, Chile, Indonesia y la costa del Pacífico mexicano repiten ese mismo patrón.',
      en:'Two regions can shake with the same frequency and have nothing else in common. What tells them apart is the way the plates meet at that point, and each way leaves different marks on the landscape. Where an oceanic plate sinks beneath another one, the same combination always appears: a deep sea trench off the coast, a line of volcanoes inland and earthquakes that start deeper and deeper as one moves away from the sea. Japan, Chile, Indonesia and the Mexican Pacific coast repeat that same pattern.'

      en:'Where two continental blocks collide the scene changes completely. Neither one sinks, because both are thick and light, so the rocks fold and pile up into the highest mountains in the world. There are many earthquakes, nearly all shallow, but practically no active volcanoes: without a plate going down, no magma is produced. The Himalaya is the greatest example, and on its summits appear rocks that were once at the bottom of the sea. In contrast, where plates pull apart, as in the Atlantic ridge or in Iceland, new crust is born, there are volcanoes of runny lava and earthquakes that are almost never destructive. And where plates only scrape sideways, as in California, there are faults visible on the ground and frequent shallow earthquakes, but very few volcanoes.'

      es:'Existe una excepción que conviene conocer: los puntos calientes. Son columnas de material caliente que ascienden en pleno interior de una placa, lejos de cualquier borde, y perforan la corteza formando islas volcánicas. Hawái, en medio del océano Pacífico, es el caso más conocido, y sus islas se alinean porque la placa fue pasando por encima del mismo punto durante millones de años.',

      es:'México forma parte del Cinturón de Fuego, pero eso no significa que todo el país tiemble igual. La actividad se concentra donde el territorio se acerca a un borde de placa. Frente a las costas de Jalisco, Colima, Michoacán, Guerrero, Oaxaca y Chiapas corre la Fosa Mesoamericana: ahí las placas de Cocos y de Rivera se hunden bajo la Norteamericana, y ese contacto genera los sismos más frecuentes y más fuertes del país. Por eso esa franja costera se clasifica como región de peligro sísmico alto.',
      en:'Mexico is part of the Ring of Fire, but that does not mean the whole country shakes the same. Activity concentrates where the territory comes close to a plate boundary. Off the coasts of Jalisco, Colima, Michoacan, Guerrero, Oaxaca and Chiapas runs the Middle America Trench: there the Cocos and Rivera plates sink beneath the North American one, and that contact generates the most frequent and strongest earthquakes in the country. That is why that coastal strip is classified as a region of high seismic hazard.'
    }) + '</p>' +
    '<p>' + L({
      es:'Hay una segunda región activa en el extremo opuesto del país. En el norte de Baja California, la placa del Pacífico se desliza de lado respecto a la Norteamericana a lo largo de un sistema de fallas emparentado con la de San Andrés, y ahí también se registran sismos importantes aunque no haya fosa ni volcanes. En el otro extremo del mapa, la península de Yucatán y buena parte del norte interior quedan lejos de cualquier borde activo y se consideran de peligro bajo. Entre ambos extremos está el centro del país, de peligro intermedio.',

      en:'Distance to the boundary does not explain everything. Mexico City is hundreds of kilometres from the coast and still suffers important damage, because part of it was built on the soft sediments of a former lake. That ground behaves like jelly and amplifies the movement of the waves arriving from the Pacific. Two neighbouring districts, one on rock and one on the old lake, can experience the same earthquake very differently.'

      es:'Si marcas en un mapa de México los volcanes activos, verás que no están repartidos: forman una banda que atraviesa el centro del país de oeste a este, desde Nayarit y Jalisco hasta Veracruz. Esa banda se llama Eje Neovolcánico Transversal y en ella están el Citlaltépetl o Pico de Orizaba, que es la cumbre más alta del territorio, el Popocatépetl, el Iztaccíhuatl, el Nevado de Toluca, el Paricutín y el Volcán de Colima. Existe además un arco volcánico en el sur, en Chiapas, con el Chichonal y el Tacaná.',
      en:'If you mark the active volcanoes on a map of Mexico, you will see they are not scattered: they form a band crossing the centre of the country from west to east, from Nayarit and Jalisco to Veracruz. That band is called the Trans Mexican Volcanic Belt and it holds Citlaltepetl or Pico de Orizaba, the highest summit in the territory, Popocatepetl, Iztaccihuatl, Nevado de Toluca, Paricutin and the Colima volcano. There is also a volcanic arc in the south, in Chiapas, with Chichonal and Tacana.'

      en:'The band exists because the Cocos plate sinks beneath the continent and, at a certain depth, causes the formation of magma that rises and comes out through the centre of the country. The volcanic region runs parallel to the boundary, not to political borders, and that is why it crosses several states without respecting their limits. Note that the Yucatan peninsula, Baja California and the northeastern plains have no active volcanoes: there is no plate sinking beneath them.'

      en:'Living near a volcano has real advantages: ash produces very fertile soils and underground heat is used as energy. That is why the slopes of Popocatepetl and the Colima volcano have been inhabited for centuries. Living together is organized with a volcanic alert light that translates what the instruments record into concrete actions for the communities, from normal monitoring to evacuation.'

    L({ es:'Concepto 5', en:'Concept 5' }),
    L({ es:'Lo que sí se puede decidir', en:'What can actually be decided' }),

      es:'Nadie puede predecir el día ni la hora de un sismo, y nadie puede mover una placa. Sin embargo, el mapa de bordes está trazado con precisión y eso permite saber dónde es más probable el peligro. A partir de ahí, casi todo lo que ocurre después depende de decisiones humanas: cómo se construye, dónde se construye, si la población sabe qué hacer y si existe un sistema de aviso. Japón y Chile registran sismos enormes con frecuencia y, gracias a normas de construcción estrictas, alerta temprana y simulacros practicados por todos, muchos de esos eventos dejan daños mucho menores de lo esperable.',
      en:'Nobody can predict the day or the hour of an earthquake, and nobody can move a plate. However, the map of boundaries is drawn with precision and that makes it possible to know where the danger is most likely. From there, almost everything that happens next depends on human decisions: how it is built, where it is built, whether the population knows what to do and whether a warning system exists. Japan and Chile record enormous earthquakes frequently and, thanks to strict building rules, early warning and drills practised by everyone, many of those events leave far less damage than would be expected.'
    }) + '</p>' +
    '<p>' + L({
      es:'A esa manera de vivir informados se le llama cultura de la prevención, y se organiza en tres momentos. Antes: conocer las zonas seguras de la casa y de la escuela, preparar una mochila con lo indispensable, acordar un punto de reunión y tomarse en serio los simulacros. Durante: mantener la calma, alejarse de lo que pueda caer y quedarse en la zona segura hasta que termine el movimiento. Después: revisar si hay olor a gas antes de encender cualquier cosa, no saturar la red telefónica y estar atento a las réplicas y a los avisos oficiales. La alerta sísmica funciona porque la señal viaja mucho más rápido que las ondas y regala segundos valiosos a las ciudades alejadas del epicentro.',
      en:'That way of living informed is called a culture of prevention, and it is organized in three moments. Before: knowing the safe zones at home and at school, preparing a bag with the essentials, agreeing on a meeting point and taking drills seriously. During: staying calm, moving away from anything that could fall and staying in the safe zone until the movement ends. After: checking for a smell of gas before switching anything on, not saturating the phone network and staying alert to aftershocks and official notices. The seismic alert works because the signal travels much faster than the waves and gives valuable seconds to cities far from the epicentre.'
    }) + '</p>'

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 1 :: Traza el Cinturón de Fuego
   ══════════════════════════════════════════════════════════════════════════ */

    { k:'jap', ring:true, n:{ es:'Japón y las islas Kuriles', en:'Japan and the Kurile islands' },

    { k:'nzl', ring:true, n:{ es:'Nueva Zelanda', en:'New Zealand' },
      w:{ es:'Buena elección: marca el extremo sur de la herradura, con volcanes y sismos frecuentes.',

    { k:'mex', ring:true, n:{ es:'Costa del Pacífico de México y Centroamérica', en:'Pacific coast of Mexico and Central America' },

    { k:'him', ring:false, n:{ es:'Himalaya y Nepal', en:'The Himalaya and Nepal' },

    { k:'ama', ring:false, n:{ es:'Llanura amazónica de Brasil', en:'The Amazon plain of Brazil' },

    { k:'sah', ring:false, n:{ es:'Desierto del Sahara', en:'The Sahara desert' },

  var order = shuffle(R, rng);
  var TARGET = 7, tries = 0, done = false;

  }).join('');
  var slots = '';

    '<div class="gw-grid">' + tiles + '</div>' +

  );

  say(host, '', fbInit);

    var hits = 0;
    R.forEach(function(r){ if (sel[r.k] && r.ring) hits++; });
    host.querySelectorAll('.rgs-s').forEach(function(s, i){ s.classList.toggle('lit', i < hits); });
    var c = document.getElementById(host.id + '_c');
    if (c) c.textContent = hits + ' / ' + TARGET;
    return hits;

      b.classList.remove('on');

    if (done) return;
    var hits = paint(), extra = [];
    R.forEach(function(r){ if (sel[r.k] && !r.ring) extra.push(r); });
    if (hits === TARGET && extra.length === 0) {
      done = true;
      host.querySelectorAll('.gw-tile').forEach(function(b){ b.disabled = true; });
      var bt = host.querySelector('[data-act="chk"]'); bt.disabled = true; bt.classList.add('solved');
      say(host, 'good', L({

      }));

      msg = L({ es:'Hay una marca que no rodea el Pacífico: ', en:'There is one mark that does not surround the Pacific: ' }) + L(extra[0].n) + '. ' + L(extra[0].w);

  var CASES = [
    { k:'sub', place:{ es:'Costa de Chile', en:'Coast of Chile' },
      c:[ { es:'Frente al litoral hay una fosa marina de más de seis mil metros de profundidad.', en:'Off the shore there is a sea trench more than six thousand metres deep.' },
          { es:'Tierra adentro se alinea una cadena de volcanes activos paralela a la costa.', en:'Inland a chain of active volcanoes lines up parallel to the coast.' },
          { es:'Los sismos se originan cada vez más profundo conforme uno se aleja del mar.', en:'Earthquakes start deeper and deeper as one moves away from the sea.' } ],
      why:{ es:'La combinación de fosa, arco de volcanes y sismos cada vez más profundos solo la produce una placa oceánica que se hunde bajo otra.',
            en:'The combination of trench, volcanic arc and deeper and deeper earthquakes is produced only by an oceanic plate sinking beneath another.' } },
    { k:'dor', place:{ es:'Islandia', en:'Iceland' },
      c:[ { es:'Una cordillera submarina emerge y forma la isla.', en:'A submarine range surfaces and forms the island.' },
          { es:'El terreno se agrieta y las dos mitades se apartan unos centímetros cada año.', en:'The ground cracks and the two halves move apart a few centimetres each year.' },
          { es:'Hay volcanes con lava muy fluida y aguas termales, pero casi ningún sismo destructivo.', en:'There are volcanoes with very runny lava and hot springs, but almost no destructive earthquakes.' } ],
      why:{ es:'Lo decisivo es que el terreno se separa y nace corteza nueva: eso solo ocurre en una dorsal, y aquí asoma sobre el nivel del mar.',
            en:'The decisive point is that the ground pulls apart and new crust is born: that happens only at a ridge, and here it rises above sea level.' } },
    { k:'col', place:{ es:'Himalaya', en:'The Himalaya' },
      c:[ { es:'Están las montañas más altas del planeta y en sus cumbres hay rocas que se formaron en el mar.', en:'The highest mountains on the planet are here and on their summits there are rocks that formed in the sea.' },
          { es:'Los sismos son frecuentes y casi todos superficiales.', en:'Earthquakes are frequent and nearly all shallow.' },
          { es:'No hay ningún volcán activo a lo largo de la cadena.', en:'There is no active volcano along the range.' } ],
      why:{ es:'Montañas altísimas con rocas marinas levantadas y sin volcanes: ninguna placa se hundió, las dos se plegaron hacia arriba.',
            en:'Very high mountains with lifted marine rocks and no volcanoes: neither plate sank, both folded upwards.' } },
    { k:'tra', place:{ es:'California', en:'California' },
      c:[ { es:'Una falla larguísima cruza el terreno y desplaza caminos, cercas y cauces de ríos.', en:'A very long fault crosses the ground and shifts roads, fences and river beds.' },
          { es:'Los sismos son frecuentes y se originan a poca profundidad.', en:'Earthquakes are frequent and start at shallow depth.' },
          { es:'No hay fosa marina frente a la costa ni una hilera de volcanes activos.', en:'There is no sea trench off the coast and no line of active volcanoes.' } ],
      why:{ es:'Sismos superficiales con una falla visible en tierra, pero sin fosa ni volcanes: las placas se rozan de lado sin hundirse.',
            en:'Shallow earthquakes with a fault visible on land, but no trench and no volcanoes: the plates scrape sideways without sinking.' } },
    { k:'hot', place:{ es:'Islas de Hawái', en:'The Hawaiian islands' },
      c:[ { es:'Son islas volcánicas en medio del océano, a miles de kilómetros del borde de placa más cercano.', en:'They are volcanic islands in the middle of the ocean, thousands of kilometres from the nearest plate boundary.' },
          { es:'Las islas se alinean y son más antiguas conforme se avanza hacia el noroeste.', en:'The islands line up and get older as one moves to the northwest.' },
          { es:'La lava es muy fluida y los sismos son pequeños.', en:'The lava is very runny and the earthquakes are small.' } ],
      why:{ es:'Volcanes lejos de cualquier borde y una hilera de islas cada vez más antiguas: la placa se desplaza sobre una columna caliente fija.',
            en:'Volcanoes far from any boundary and a row of islands getting older: the plate moves over a fixed hot column.' } }
  ];
  var rounds = shuffle(CASES, rng).slice(0, 3);
  var ri = 0, tries = 0, done = false;

  var optHTML = OPT.map(function(o){
    return '<button class="gw-tile" data-k="' + o.k + '"><span class="gw-key">' + L(o.n) + '</span></button>';
  }).join('');

  shell(host,
    L({ es:'Detective de regiones', en:'Region detective' }),
    L({ es:'Tres expedientes sin nombre. Deduce qué tipo de región describe cada uno.', en:'Three unnamed files. Work out what kind of region each one describes.' }),
    L({ es:'Lee las tres pistas y elige. Si fallas, la pista que te delata aparece abajo.', en:'Read the three clues and choose. If you miss, the clue that gives it away appears below.' }),
    '<div class="gw-num" id="' + host.id + '_r"></div>' +
    '<div id="' + host.id + '_clues"></div>' +
    '<div class="gw-lbl">' + L({ es:'Tu veredicto', en:'Your verdict' }) + '</div>' +
    '<div class="gw-grid">' + optHTML + '</div>'
  );

  function render(){
    var cs = rounds[ri];
    document.getElementById(host.id + '_r').textContent =
      L({ es:'Expediente ' + (ri + 1) + ' de 3', en:'File ' + (ri + 1) + ' of 3' });
    document.getElementById(host.id + '_clues').innerHTML = cs.c.map(function(x, i){
      return '<div class="gw-clue"><b>' + (i + 1) + '</b><span>' + L(x) + '</span></div>';
    }).join('');
    host.querySelectorAll('.gw-tile').forEach(function(b){ b.classList.remove('on', 'good'); b.disabled = false; });
    say(host, '', L({ es:'Fíjate sobre todo en si hay fosa, si hay volcanes y a qué profundidad tiemblan.', en:'Look above all at whether there is a trench, whether there are volcanoes and how deep it shakes.' }));
  }
  function finish(){
    done = true;
    host.querySelectorAll('.gw-tile').forEach(function(b){ b.disabled = true; });
    say(host, 'good', L({
      es:'Tres expedientes resueltos. Guarda el método: fosa y arco de volcanes indican hundimiento; separación indica dorsal; montañas altas sin volcanes indican choque de continentes; falla en tierra sin volcanes indica roce lateral; y volcanes en medio de una placa indican punto caliente.',
      en:'Three files solved. Keep the method: trench and volcanic arc mean sinking; separation means a ridge; high mountains without volcanoes mean continents colliding; a fault on land without volcanoes means lateral scraping; and volcanoes in the middle of a plate mean a hot spot.'
    }));
  }
  function advance(){
    ri++; tries = 0;
    if (ri >= rounds.length) { finish(); return; }
    setTimeout(render, 900);
  }
  host.querySelectorAll('.gw-tile').forEach(function(b){
    b.addEventListener('click', function(){
      if (done) return;
      var cs = rounds[ri];
      if (b.dataset.k === cs.k) {
        b.classList.add('good');

        say(host, 'good', '<b>' + L(cs.place) + '.</b> ' + L(cs.why));
        advance();
        return;
      }
      tries++;
      if (tries >= 3) {
        host.querySelectorAll('.gw-tile').forEach(function(x){
          x.disabled = true;
          if (x.dataset.k === cs.k) x.classList.add('good');
        });
        say(host, 'warm', '<b>' + L(cs.place) + '.</b> ' + L(cs.why));
        advance();
        return;
      }
      say(host, 'miss', L(GEN[b.dataset.k]));
    });
  });
  render();
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 3 :: Clasificador de regiones sísmicas de México
   ══════════════════════════════════════════════════════════════════════════ */
function w3(rng, host){
  var Z = ['A', 'M', 'B'];
  var ZN = {
    A:{ es:'Peligro alto', en:'High hazard' },
    M:{ es:'Peligro intermedio', en:'Intermediate hazard' },
    B:{ es:'Peligro bajo', en:'Low hazard' }
  };
  var P = [
    { k:'gro', z:'A', n:{ es:'Costa de Guerrero', en:'Coast of Guerrero' },
      w:{ es:'Guerrero mira directamente a la Fosa Mesoamericana, a pocos kilómetros de su litoral.',
          en:'Guerrero looks straight at the Middle America Trench, a few kilometres from its shoreline.' } },
    { k:'oax', z:'A', n:{ es:'Costa de Oaxaca', en:'Coast of Oaxaca' },
      w:{ es:'Frente a Oaxaca la placa de Cocos se hunde bajo el continente sin pausa.',
          en:'Off Oaxaca the Cocos plate sinks beneath the continent without pause.' } },
    { k:'chs', z:'A', n:{ es:'Costa de Chiapas', en:'Coast of Chiapas' },
      w:{ es:'En Chiapas se juntan tres placas y el borde queda muy cerca del territorio.',
          en:'In Chiapas three plates meet and the boundary lies very close to the territory.' } },
    { k:'mxl', z:'A', n:{ es:'Mexicali, norte de Baja California', en:'Mexicali, northern Baja California' },
      w:{ es:'Por ahí pasa el sistema de fallas emparentado con la de San Andrés: no hay fosa, pero sí borde de placa.',
          en:'The fault system related to the San Andreas runs through there: no trench, but a plate boundary all the same.' } },
    { k:'cmx', z:'M', n:{ es:'Ciudad de México', en:'Mexico City' },
      w:{ es:'Está lejos del borde, pero su suelo blando de antiguo lago amplifica las ondas que llegan de la costa.',
          en:'It is far from the boundary, but its soft former lake ground amplifies the waves arriving from the coast.' } },
    { k:'pue', z:'M', n:{ es:'Puebla', en:'Puebla' },
      w:{ es:'Queda en el centro del país, a media distancia entre el borde del Pacífico y el interior estable.',
          en:'It lies in the centre of the country, halfway between the Pacific boundary and the stable interior.' } },
    { k:'yuc', z:'B', n:{ es:'Península de Yucatán', en:'Yucatan peninsula' },
      w:{ es:'Es una plataforma caliza alejada de cualquier borde de placa activo.',
          en:'It is a limestone platform far from any active plate boundary.' } },
    { k:'chi', z:'B', n:{ es:'Interior de Chihuahua', en:'Interior of Chihuahua' },
      w:{ es:'Está en pleno interior de la placa Norteamericana, muy lejos de sus bordes.',
          en:'It lies in the middle of the North American plate, very far from its edges.' } }
  ];
  var order = shuffle(P, rng);
  var state = {}, tries = 0, done = false;

  var tiles = order.map(function(p){
    return '<button class="gw-tile" data-k="' + p.k + '"><span class="gw-key">' + L(p.n) + '</span>' +
           '<span class="gw-sub" data-role="z">' + L({ es:'sin clasificar', en:'not classified' }) + '</span></button>';
  }).join('');

  shell(host,
    L({ es:'Clasificador de regiones sísmicas', en:'Seismic region classifier' }),
    L({ es:'Reparte estos ocho lugares de México según su peligro sísmico.', en:'Sort these eight places in Mexico by their seismic hazard.' }),
    L({ es:'Cada toque cambia la clasificación del lugar: alto, intermedio, bajo y de nuevo sin clasificar.', en:'Each tap changes the classification of the place: high, intermediate, low and back to not classified.' }),
    '<div class="zbar">' +
      '<div class="zb a"><b id="' + host.id + '_A">0</b>' + L(ZN.A) + '</div>' +
      '<div class="zb m"><b id="' + host.id + '_M">0</b>' + L(ZN.M) + '</div>' +
      '<div class="zb b"><b id="' + host.id + '_B">0</b>' + L(ZN.B) + '</div>' +
    '</div>' +
    '<div class="gw-grid">' + tiles + '</div>' +
    '<div class="gw-row"><button class="gw-btn" data-act="chk">' + L({ es:'Revisar el mapa', en:'Review the map' }) + '</button></div>'
  );
  say(host, '', L({ es:'Antes de decidir, piensa en qué tan cerca está cada lugar de un borde de placa.', en:'Before deciding, think about how close each place is to a plate boundary.' }));

  function counts(){
    var c = { A:0, M:0, B:0 };
    Object.keys(state).forEach(function(k){ if (state[k]) c[state[k]]++; });
    ['A', 'M', 'B'].forEach(function(z){
      var e = document.getElementById(host.id + '_' + z);
      if (e) e.textContent = c[z];
    });
  }
  function paintTile(b, z){
    b.classList.remove('zA', 'zM', 'zB');
    var sub = b.querySelector('[data-role="z"]');
    if (!z) { sub.textContent = L({ es:'sin clasificar', en:'not classified' }); return; }
    b.classList.add('z' + z);
    sub.textContent = L(ZN[z]);
  }
  function reveal(){
    done = true;
    host.querySelectorAll('.gw-tile').forEach(function(b){
      var p = P.filter(function(x){ return x.k === b.dataset.k; })[0];
      state[p.k] = p.z; paintTile(b, p.z); b.disabled = true;
    });
    counts();
    var bt = host.querySelector('[data-act="chk"]'); bt.disabled = true; bt.classList.add('solved');
    say(host, 'good', L({
      es:'Mapa corregido. La regla de fondo: peligro alto donde el territorio toca un borde de placa activo, sea una fosa o un sistema de fallas; peligro bajo en el interior de la placa; e intermedio en el centro del país, donde además pesa el tipo de suelo.',
      en:'Map corrected. The underlying rule: high hazard where the territory touches an active plate boundary, whether a trench or a fault system; low hazard inside the plate; and intermediate in the centre of the country, where the type of ground also counts.'
    }));
  }

  host.querySelectorAll('.gw-tile').forEach(function(b){
    b.addEventListener('click', function(){
      if (done) return;
      var p = P.filter(function(x){ return x.k === b.dataset.k; })[0];
      var cur = state[p.k] || null;
      var next = cur === null ? 'A' : (cur === 'A' ? 'M' : (cur === 'M' ? 'B' : null));
      state[p.k] = next;
      paintTile(b, next);
      counts();
      say(host, next ? 'warm' : '', L(p.w));
    });
  });

  host.querySelector('[data-act="chk"]').addEventListener('click', function(){
    if (done) return;
    var wrong = P.filter(function(p){ return state[p.k] !== p.z; });
    if (wrong.length === 0) {
      done = true;
      host.querySelectorAll('.gw-tile').forEach(function(b){ b.disabled = true; });
      var bt = host.querySelector('[data-act="chk"]'); bt.disabled = true; bt.classList.add('solved');
      say(host, 'good', L({
        es:'Mapa completo y correcto. Observa que el peligro no depende del tamaño del estado ni de su población: depende de la distancia a un borde activo y del suelo sobre el que se construye.',
        en:'Map complete and correct. Notice that hazard does not depend on the size of the state or its population: it depends on the distance to an active boundary and on the ground it is built on.'
      }));
      return;
    }
    tries++;
    if (tries >= 3) { reveal(); return; }
    var w = wrong[0];
    var hint = state[w.k] ? L({ es:'Revisa ', en:'Check ' }) + L(w.n) + ': ' + L(w.w)
                          : L({ es:'Todavía falta clasificar ', en:'Still to classify: ' }) + L(w.n) + '. ' + L(w.w);
    say(host, 'miss', L({ es:'Hay ' + wrong.length + ' lugares por ajustar. ', en:'There are ' + wrong.length + ' places to adjust. ' }) + hint);
  });
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 4 :: Semáforo de alerta volcánica
   ══════════════════════════════════════════════════════════════════════════ */
function w4(rng, host){
  var ACT = {
    v:{ tag:{ es:'Verde', en:'Green' }, li:{
        es:['Vigilancia permanente del volcán con instrumentos', 'Las comunidades hacen su vida normal', 'Se conocen las rutas de evacuación y el punto de reunión'],
        en:['Permanent monitoring of the volcano with instruments', 'Communities go about their normal life', 'Evacuation routes and the meeting point are known'] } },
    a:{ tag:{ es:'Amarillo', en:'Yellow' }, li:{
        es:['Vigilancia reforzada y avisos frecuentes a la población', 'Se respeta el radio de seguridad alrededor del cráter', 'Las familias preparan su mochila y repasan la ruta de salida'],
