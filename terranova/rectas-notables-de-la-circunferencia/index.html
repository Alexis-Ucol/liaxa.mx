<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rectas Notables de la Circunferencia</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }

/* ── GUIDE WIDGETS (circunferencia: compás, cuerda, recta, trazos, centro) ── */
.iw-tag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.4rem; }
.iw-box { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; padding:1rem; }
.iw-instr { font-size:.88rem; color:var(--text2); margin-bottom:.7rem; }
.rondas { font-family:'IBM Plex Mono',monospace; font-size:.7rem; color:var(--text3); letter-spacing:.08em; text-transform:uppercase; margin-bottom:.45rem; }
.rfb { font-size:.84rem; margin-top:.6rem; min-height:1.35rem; color:var(--text2); }
.rfb b { color:var(--green-dark); }
.okmsg { color:var(--ok); font-weight:700; }
.rverify-btn { background:var(--green); color:#fff; border:none; border-radius:8px; padding:.6rem 1.2rem; font-size:.86rem; font-weight:600; cursor:pointer; min-height:44px; margin-top:.7rem; font-family:inherit; }
.rverify-btn:hover { background:var(--green-dark); }
.goalbar { font-size:.83rem; color:var(--text2); background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.45rem .7rem; margin-bottom:.65rem; }
.gcanvas { display:block; width:100%; height:240px; border:1px solid var(--border); border-radius:8px; background:var(--surface); touch-action:manipulation; }
.krow { display:flex; align-items:center; gap:.6rem; margin-top:.7rem; flex-wrap:wrap; }
.krow input[type=range] { flex:1; min-width:150px; accent-color:var(--green); height:34px; }
.kval { font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:.95rem; color:var(--green); min-width:62px; text-align:right; }
.livelbl { margin-top:.55rem; font-size:.88rem; color:var(--text2); }
.livelbl b { color:var(--green-dark); }
.statline { margin-top:.35rem; font-size:.84rem; color:var(--text3); }
.namegrid { display:grid; grid-template-columns:repeat(3,1fr); gap:.5rem; margin-top:.7rem; }
.namebtn { min-height:44px; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.82rem; font-weight:600; cursor:pointer; font-family:inherit; padding:.4rem; }
.namebtn:hover { border-color:var(--green); color:var(--green); }
.defgrid { display:grid; grid-template-columns:repeat(2,1fr); gap:.6rem; margin:1rem 0; }
.defcell { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.75rem; border-top:3px solid var(--green); }
.defname { font-size:.72rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.25rem; }
.deftxt { font-size:.82rem; color:var(--text2); }
.stepslist { margin:.9rem 0 0; padding-left:1.1rem; }
.stepslist li { font-size:.86rem; color:var(--text2); margin-bottom:.35rem; }
@media (max-width:600px) {
  .defgrid { grid-template-columns:1fr; }
  .namegrid { grid-template-columns:repeat(2,1fr); }
  .gcanvas { height:215px; }
}
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Rectas Notables de la Circunferencia</div>
    <div class="wcourse" id="wcourse-el">Matemáticas · 1° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Rectas Notables de la Circunferencia</div>

function getAttemptKey(name, group){ return 'liaxa_mat1_t10_g01__att__' + (name+'__'+group).replace(/\s+/g,'_'); }
function nextAttempt(name, group){ var k=getAttemptKey(name,group),n=0; try{n=parseInt(localStorage.getItem(k)||'0',10)||0;}catch(e){} n++; try{localStorage.setItem(k,String(n));}catch(e){} return n; }

var studentData   = {};

function lsKey() {
  var n = (studentData.name  || '').trim();
  var g = (studentData.group || '').trim();
  return 'liaxa_mat1_t10_g01__' + (n + '__' + g).replace(/\s+/g, '_');
}

function saveSession() {
  if (!studentData.name) return;
  var drawings = [], texts = [], photos = [];
  problems.forEach(function(p, i) {
    var dc = document.getElementById('dc' + i);
    if (dc && dc.width) {
      var blank = document.createElement('canvas');
      blank.width = dc.width; blank.height = dc.height;
      drawings.push(dc.toDataURL() === blank.toDataURL() ? null : dc.toDataURL('image/png'));
    } else { drawings.push(null); }
    var ta = document.getElementById('ta' + i);
    texts.push(ta ? ta.value : '');
    var pp = document.getElementById('pp' + i);
    photos.push((pp && pp.src && pp.src.indexOf('data:') === 0) ? pp.src : null);
  });
  var state = {
    name: studentData.name, group: studentData.group,
    answeredCount: answeredCount, correctCount: correctCount,
    choices: problems.map(function(p) { return p.studentChoice; }),
    drawings: drawings, texts: texts, photos: photos
  };
  try { localStorage.setItem(lsKey(), JSON.stringify(state)); } catch(e) {}
}

function loadSession(name, group) {
  var key = 'liaxa_mat1_t10_g01__' + (name + '__' + group).replace(/\s+/g, '_');
  try { var r = localStorage.getItem(key); return r ? JSON.parse(r) : null; } catch(e) { return null; }
}

function restoreSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  var saved = loadSession(name, group);
  if (!saved) return;
  document.getElementById('restoreBar').style.display = 'none';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = currentAttempt(name, group);
  buildLesson(seededRng(name + group + att));
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
  saved.choices.forEach(function(choice, idx) {
    if (choice !== null && choice !== undefined) confirmMC(idx, choice);
  });
  setTimeout(function() {
    if (saved.drawings) {
      saved.drawings.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var dc = document.getElementById('dc' + i);
        if (!dc || !dc.width) return;
        var img = new Image();
        img.onload = function() {
          var dpr = window.devicePixelRatio || 1;
          dc.getContext('2d').drawImage(img, 0, 0, dc.width / dpr, dc.height / dpr);
        };
        img.src = dataUrl;
      });
    }
    if (saved.texts) {
      saved.texts.forEach(function(text, i) {
        if (!text) return;
        var ta = document.getElementById('ta' + i);
        if (ta) ta.value = text;
      });
    }
    if (saved.photos) {
      saved.photos.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var pp = document.getElementById('pp' + i);
        if (!pp) return;
        pp.src = dataUrl; pp.style.display = 'block';
        var pz = document.getElementById('pz' + i);
        if (pz) pz.style.opacity = '0.4';
      });
    }
  }, 300);
}

function dismissRestore() {
  document.getElementById('restoreBar').style.display = 'none';
}

function checkForSavedSession() {
  var name  = document.getElementById('sName').value.trim();

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

async function generatePDF() {
  var btn = document.getElementById('dlBtn');
  btn.textContent = 'Generando PDF…';
  btn.disabled = true;

  var jspdf   = window.jspdf;
  var doc     = new jspdf.jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });
  var PW      = 215.9;
  var M       = 18;
  var TW      = PW - M * 2;
  var PH      = doc.internal.pageSize.height;
  var name    = studentData.name;
  var group   = studentData.group;
  var total   = problems.length;
  var pct     = Math.round(correctCount / total * 100);
  var dateStr = new Date().toLocaleString('es-MX', { dateStyle:'long', timeStyle:'short' });

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS — INJECTION BLOCK ─────────────────────────────────────────
  //   Match these RGB values to --green and --gold above.
  //   PRIMARY  → pBR, pBG, pBB
  //   ACCENT   → pAR, pAG, pAB
  // ──────────────────────────────────────────────────────────────────────────
  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;  // PRIMARY (from SCHOOL, Rule 16)
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;   // ACCENT (from SCHOOL, Rule 16)

  function pdfText(html) {
    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/\u2192/g,'->').replace(/\u2212/g,'-').replace(/\u00b2/g,'^2')
      .replace(/\u00b3/g,'^3').replace(/\u00d7/g,'x').replace(/\u00f7/g,'/')
      .replace(/\u2260/g,'!=').replace(/\u2264/g,'<=').replace(/\u2265/g,'>=')
      .replace(/\u221a/g,'sqrt').replace(/\u03c0/g,'pi').replace(/\u2026/g,'...')
      .replace(/\s+/g,' ').trim();
  }

  // ── PORTADA: orange line / white logo strip / orange line / blue band ──
  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,2,'F');   // top accent line
  doc.setFillColor(255,255,255); doc.rect(0,2,PW,26,'F');                               // white logo strip
  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,28,PW,2,'F');  // bottom accent line
  doc.setFillColor(pBR,pBG,pBB); doc.rect(0,30,PW,34,'F');       // blue header band

  // ── PDF LOGO INJECTION BLOCK ─────────────────────────────────────────────
  //   When injecting logos, replace the two placeholder lines below with:
  //     var logoLeftB64  = 'data:image/png;base64,...';   // from LOGOS_MASTER.HTML
  //     var logoRightB64 = 'data:image/png;base64,...';   // from LOGOS_MASTER.HTML

  doc.lines([[2.57-1.03,4.63-6.17],[4.11-2.57,5.14-4.63],[5.66-4.11,2.57-5.14]], lx+1.03, ly+6.17);

    doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
    doc.setFontSize(7); doc.setFont('helvetica','bold');
    doc.rect(M,wy,TW,8,'F'); doc.text('TRABAJO DEL ALUMNO', M+4, wy+5.5);
    wy += 11;

    var dc = document.getElementById('dc'+i);
    if (dc) {
      try {
        var imgD = dc.toDataURL('image/png');
        var ar   = dc.height / dc.width;
        var iw   = TW;
        var ih   = Math.min(iw * ar, 68);
        doc.addImage(imgD, 'PNG', M, wy, iw, ih);
        wy += ih + 4;
      } catch(e) {}
    }

    var ta = document.getElementById('ta'+i);
    if (ta && ta.value.trim()) {
      if (wy > PH-30) { doc.addPage(); wy = 20; }
      doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('courier','normal');
      var taLines = doc.splitTextToSize(ta.value, TW);
      taLines.slice(0,16).forEach(function(ln) {
        if (wy > PH-15) { doc.addPage(); wy = 20; }
        doc.text(ln, M, wy); wy += 5;
      });
      wy += 2;
    }

    var pp = document.getElementById('pp'+i);
    if (pp && pp.src && pp.src.indexOf('data:') === 0) {
      if (wy > PH-55) { doc.addPage(); wy = 20; }
      try { doc.addImage(pp.src, 'JPEG', M, wy, TW, 68); wy += 72; } catch(e) {}
    }
  }

  // ── Footer on every page ──
  var pages = doc.internal.getNumberOfPages();
  for (var p = 1; p <= pages; p++) {
    doc.setPage(p);
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0, PH-3, PW, 3, 'F');
    doc.setTextColor(130,140,160); doc.setFontSize(6.5); doc.setFont('helvetica','normal');
    doc.text(name+'  ·  '+group+'  ·  Código: '+code+'  ·  Página '+p+'/'+pages,
      PW/2, PH-5, {align:'center'});
  }

  doc.save('mat1_t10_g01_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf');
  btn.innerHTML = '⬇ &nbsp;Descargar Resultados PDF';
  btn.disabled  = false;
}

/* ================================================
   buildLesson: Rectas notables de la circunferencia (1o de Secundaria)
   Interleaved: idea -> manipulativo -> problema(s). Cards built inline.
   ================================================ */
function buildLesson(rng) {
  var LB = document.getElementById('lessonBody');
  LB.innerHTML = '';
  problems = [];

  /* ============================================================
     HELPERS
     ============================================================ */
  function T(o){
    if (o === undefined || o === null) return '';
    if (typeof o === 'string' || typeof o === 'number') return o;
    return (o[LANG] !== undefined ? o[LANG] : o.es);
  }
  function ri(a,b){ return a + Math.floor(rng()*(b-a+1)); }
  function shufA(arr){
    var a = arr.slice(), i, j, t;
    for (i=a.length-1;i>0;i--){ j=Math.floor(rng()*(i+1)); t=a[i]; a[i]=a[j]; a[j]=t; }
    return a;
  }
  function sec(tag, title, html){
    var d = document.createElement('div');
    d.className = 'section';
    d.innerHTML = '<div class="stag">'+tag+'</div><h2>'+title+'</h2>'+(html||'');
    LB.appendChild(d);
    return d;
  }
  function widget(kind){
    var d = document.createElement('div');
    d.className = kind + 'wrap section';
    d.setAttribute('data-widget', kind);
    d.id = 'w' + kind;
    LB.appendChild(d);
    return d;
  }
  function cssv(n){
    try { var v = getComputedStyle(document.documentElement).getPropertyValue(n); return v ? v.trim() : ''; }
    catch(e){ return ''; }
  }
  function fitCv(cv){
    var dpr = window.devicePixelRatio || 1;
    var w = cv.clientWidth || 320;
    var h = cv.clientHeight || 220;
    cv.width  = Math.round(w*dpr);
    cv.height = Math.round(h*dpr);
    var ctx = cv.getContext('2d');
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,w,h);
    return { ctx:ctx, w:w, h:h };
  }
  function dot(ctx, x, y, r, col){
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
  }
  function label(ctx, s, x, y, col, w, h){
    ctx.fillStyle = col;
    ctx.font = '600 13px "IBM Plex Sans", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(s, Math.max(18, Math.min(w-18, x)), Math.max(14, Math.min(h-5, y)));
  }
  function num(x){ return String(Math.round(x*10)/10); }
  function addProb(spec){
    var so  = shufA(T(spec.options));
    var cor = T(spec.correct);
    problems.push({
      title: T(spec.title),
      questionText: T(spec.q),
      fn: '',
      hint: T(spec.hint),
      explanation: T(spec.exp),
      options: so,
      correctIdx: so.indexOf(cor),
      showWork: !!spec.showWork,
      studentChoice: null,
      pendingChoice: null
    });
    buildOneCard(problems[problems.length-1], problems.length-1);
  }

  /* ============================================================
     SEEDED VALUES (drawn once, in a fixed order)
     ============================================================ */
  var v1 = Math.floor(rng()*2), v2 = Math.floor(rng()*2), v3 = Math.floor(rng()*2);
  var v4 = Math.floor(rng()*2), v5 = Math.floor(rng()*2), v6 = Math.floor(rng()*2);
  var v7 = Math.floor(rng()*2), v8 = Math.floor(rng()*2), v9 = Math.floor(rng()*2);
  var v10 = Math.floor(rng()*2);

  var r1  = 2*ri(2,5);      // radio 4..10 (P1 variante A)
  var D1  = 2*ri(4,9);      // diametro 8..18 (P1 variante B)
  var r2  = ri(5,9);        // radio (P2)
  var e2  = ri(1,3);        // diferencia (P2)
  var r3  = 2*ri(3,6);      // radio 6..12 (P3 variante A)
  var L3  = 2*ri(5,9);      // cuerda mayor 10..18 (P3 variante B)
  var r4  = ri(8,10);       // radio (P4)
  var c4a = ri(1,3);        // distancia cercana (P4)
  var c4b = ri(5,7);        // distancia lejana (P4)
  var r5  = ri(6,10);       // radio (P5)
  var d5  = ri(2,5);        // distancia menor que r5 (P5)
  var r6  = 2*ri(2,6);      // radio 4..12 (P6 variante B)
  var k9  = ri(5,9);        // OP (P9)
  var L10 = 2*ri(4,9);      // diametro 8..18 (P10)

  var kA  = ri(3,6);        // manipulativo 1: punto P cercano
  var kB  = ri(7,10);       // manipulativo 1: punto P lejano
  var Dw  = 2*ri(3,5);      // manipulativo 1: diametro pedido
  var R3w = ri(4,7);        // manipulativo 3: radio

  /* ============================================================
     IDEA 1
     ============================================================ */
  sec(T({es:'Idea 1', en:'Idea 1'}),
      T({es:'La circunferencia, su centro y su radio', en:'The circle, its centre and its radius'}),
      '<p>'+T({
        es:'Clava un alfiler en una hoja, amarra un hilo y gira un lápiz manteniendo el hilo estirado. El lápiz deja una línea cerrada: esa línea es la circunferencia. El alfiler queda en el centro y el largo del hilo es el radio, la distancia que hay del centro a cualquier punto de la línea. La circunferencia es solo la línea; toda la región encerrada dentro de ella es el círculo.',
        en:'Pin a needle into a sheet of paper, tie a thread to it and turn a pencil keeping the thread stretched. The pencil leaves a closed line: that line is the circle. The needle sits at the centre and the length of the thread is the radius, the distance from the centre to any point of the line. The circle is only that line; the whole region enclosed inside it is the disc.'
      })+'</p>'+
      '<p>'+T({
        es:'Como todos los puntos de la circunferencia están a la misma distancia del centro, el radio sirve para ubicar cualquier otro punto de la hoja: si está más cerca del centro que el radio, cae dentro; si está a la misma distancia, cae sobre la circunferencia; si está más lejos, queda fuera. Y si un trazo sale de un punto de la circunferencia, cruza el centro y llega hasta el otro lado, se llama diámetro: está hecho de dos radios seguidos.',
        en:'Since every point of the circle is the same distance from the centre, the radius lets you place any other point on the sheet: if it is closer to the centre than the radius, it falls inside; if it is at the same distance, it falls on the circle; if it is farther, it stays outside. And if a segment starts at a point of the circle, crosses the centre and reaches the other side, it is called a diameter: it is made of two radii in a row.'
      })+'</p>'+
      '<div class="defgrid">'+
        '<div class="defcell"><div class="defname">'+T({es:'Radio',en:'Radius'})+'</div><div class="deftxt">'+T({es:'Del centro a un punto de la circunferencia. Es la abertura del compás.',en:'From the centre to a point of the circle. It is the compass opening.'})+'</div></div>'+
        '<div class="defcell"><div class="defname">'+T({es:'Diámetro',en:'Diameter'})+'</div><div class="deftxt">'+T({es:'De un lado al otro pasando por el centro. Son dos radios seguidos.',en:'From one side to the other through the centre. It is two radii in a row.'})+'</div></div>'+
      '</div>'+
      '<div class="callout"><p>'+T({
        es:'Con el compás no hace falta medir punto por punto: la abertura se mantiene fija mientras giras, y por eso la línea sale pareja.',
        en:'With a compass you do not need to measure point by point: the opening stays fixed while you turn, and that is why the line comes out even.'
      })+'</p></div>');

  /* ---- MANIPULATIVO 1: abre el compas ---- */
  (function(){
    var wrap = widget('compas');
    var MAXR = 11;
    var TASKS = shufA([ {k:'p', v:kA}, {k:'d', v:Dw}, {k:'p', v:kB} ]);
    var st = { r:0, rad:2, tries:0, done:false, lock:false };

    function task(){ return TASKS[st.r]; }
    function want(){ var t = task(); return t.k === 'd' ? t.v/2 : t.v; }
    function startRad(){ var wv = want(); return wv > 4 ? Math.max(1, wv-3) : Math.min(MAXR, wv+3); }

    function draw(){
      var cv = document.getElementById('cpCv'); if (!cv) return;
      var g = fitCv(cv), ctx = g.ctx, w = g.w, h = g.h;
      var s = Math.min(w*0.40, h*0.40)/MAXR;
      var cx = w/2, cy = h*0.44;
      var colC = cssv('--green'), colA = cssv('--gold'), dk = cssv('--green-dark');
      var txt = cssv('--text'), sub = cssv('--text3'), bd = cssv('--border');
      var t = task(), i;

      ctx.strokeStyle = bd; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+MAXR*s,cy); ctx.stroke();
      for (i=1;i<=MAXR;i++){ ctx.beginPath(); ctx.moveTo(cx+i*s,cy-3.5); ctx.lineTo(cx+i*s,cy+3.5); ctx.stroke(); }

      ctx.strokeStyle = colC; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(cx,cy,st.rad*s,0,Math.PI*2); ctx.stroke();

      ctx.lineCap = 'round';
      ctx.strokeStyle = colA; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+st.rad*s*0.62, cy-st.rad*s*0.78); ctx.stroke();
      dot(ctx,cx,cy,4,colC);
      label(ctx,'O',cx-14,cy+18,txt,w,h);
      label(ctx, st.rad+' cm', cx+st.rad*s*0.34, cy-st.rad*s*0.50-6, colA, w, h);

      if (t.k === 'p'){
        dot(ctx, cx+t.v*s, cy, 5, dk);
        label(ctx,'P', cx+t.v*s, cy-12, txt, w, h);
      } else {
        var y2 = cy + Math.min(h*0.34, 66);
        ctx.strokeStyle = dk; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(cx-t.v*s/2, y2); ctx.lineTo(cx+t.v*s/2, y2); ctx.stroke();
        label(ctx, t.v+' cm', cx, y2+18, sub, w, h);
      }
    }
    function statTxt(){
      var t = task();
      if (t.k === 'p'){
        if (st.rad < t.v) return T({es:'P queda fuera de la circunferencia.', en:'P is outside the circle.'});
        if (st.rad === t.v) return T({es:'P queda justo sobre la circunferencia.', en:'P sits exactly on the circle.'});
        return T({es:'P queda dentro del círculo.', en:'P is inside the disc.'});
      }
      if (2*st.rad < t.v) return T({es:'El diámetro trazado todavía es menor que la marca.', en:'The drawn diameter is still shorter than the mark.'});
      if (2*st.rad === t.v) return T({es:'El diámetro trazado coincide con la marca.', en:'The drawn diameter matches the mark.'});
      return T({es:'El diámetro trazado ya pasó de la marca.', en:'The drawn diameter has gone past the mark.'});
    }
    function goalTxt(){
      var t = task();
      return t.k === 'p'
        ? T({es:'El punto P está a '+t.v+' cm del centro O. Deja el compás de modo que la circunferencia pase justo por P.',
             en:'Point P is '+t.v+' cm from centre O. Set the compass so the circle passes exactly through P.'})
        : T({es:'Traza una circunferencia cuyo diámetro mida '+t.v+' cm, igual que la marca de abajo.',
             en:'Draw a circle whose diameter measures '+t.v+' cm, the same as the mark below.'});
    }
    function updLbl(){
      var a = document.getElementById('cpSv'); if (a) a.textContent = st.rad+' cm';
      var b = document.getElementById('cpVal'); if (b) b.textContent = (2*st.rad)+' cm';
      var c = document.getElementById('cpStat'); if (c) c.textContent = statTxt();
    }
    function render(){
      if (st.done){
        wrap.innerHTML =
          '<div class="iw-tag">'+T({es:'Abre el compás', en:'Open the compass'})+'</div>'+
          '<div class="iw-box"><div class="rfb"><span class="okmsg">'+T({
            es:'Listo: ya puedes trazar una circunferencia tanto si te dan el radio como si te dan el diámetro o un punto por donde debe pasar.',
            en:'Done: you can now draw a circle whether you are given the radius, the diameter or a point it must pass through.'
          })+'</span></div></div>';
        return;
      }
      wrap.innerHTML =
        '<div class="iw-tag">'+T({es:'Abre el compás', en:'Open the compass'})+'</div>'+
        '<div class="iw-box">'+
          '<div class="rondas">'+T({es:'Ronda',en:'Round'})+' '+(st.r+1)+' / 3</div>'+
          '<div class="iw-instr iw-sub">'+T({
            es:'Mueve el control para abrir o cerrar el compás y observa hasta dónde llega la circunferencia.',
            en:'Move the control to open or close the compass and watch how far the circle reaches.'
          })+'</div>'+
          '<div class="goalbar">'+goalTxt()+'</div>'+
          '<canvas class="gcanvas" id="cpCv"></canvas>'+
          '<div class="krow"><input type="range" min="1" max="'+MAXR+'" value="'+st.rad+'" oninput="cpSlide(this.value)"><span class="kval" id="cpSv">'+st.rad+' cm</span></div>'+
          '<div class="livelbl">'+T({es:'Diámetro de esa circunferencia: ', en:'Diameter of that circle: '})+'<b id="cpVal">'+(2*st.rad)+' cm</b></div>'+
          '<div class="statline" id="cpStat">'+statTxt()+'</div>'+
          '<button class="rverify-btn" onclick="cpChk()">'+T({es:'Verificar',en:'Check'})+'</button>'+
          '<div class="rfb" id="cpFb"></div>'+
        '</div>';
      draw();
    }
    function adv(ms){
      st.lock = true;
      setTimeout(function(){
        st.r++; st.tries = 0; st.lock = false;
        if (st.r >= 3) st.done = true; else st.rad = startRad();
        render();
      }, ms);
    }
    window.cpSlide = function(val){
      if (st.done || st.lock) return;
      st.rad = parseInt(val,10) || 1;
      draw(); updLbl();
    };
    window.cpChk = function(){
      if (st.done || st.lock) return;
      var fb = document.getElementById('cpFb'); if (!fb) return;
      var t = task(), wv = want();
      if (st.rad === wv){
        fb.innerHTML = '<span class="okmsg">'+(t.k === 'p'
          ? T({es:'Correcto: la abertura del compás es exactamente la distancia de O a P, así que P quedó sobre la circunferencia.',
               en:'Correct: the compass opening is exactly the distance from O to P, so P ended up on the circle.'})
          : T({es:'Correcto: con un radio de '+wv+' cm el trazo mide '+t.v+' cm de lado a lado.',
               en:'Correct: with a radius of '+wv+' cm the drawing measures '+t.v+' cm from side to side.'}))+'</span>';
        adv(1600); return;
      }
      st.tries++;
      if (st.tries >= 3){
        st.rad = wv; draw(); updLbl();
        fb.innerHTML = t.k === 'p'
          ? T({es:'Así queda: el radio vale lo mismo que la distancia de O a P, '+wv+' cm.',
               en:'Here it is: the radius equals the distance from O to P, '+wv+' cm.'})
          : T({es:'Así queda: el radio es la mitad del diámetro pedido, '+wv+' cm.',
               en:'Here it is: the radius is half of the requested diameter, '+wv+' cm.'});
        adv(2600); return;
      }
      fb.textContent = (st.rad < wv)
        ? (t.k === 'p'
            ? T({es:'Todavía no: la circunferencia se queda corta y P sigue fuera. Abre más el compás.',
                 en:'Not yet: the circle falls short and P is still outside. Open the compass more.'})
            : T({es:'Todavía no: de lado a lado llevas '+(2*st.rad)+' cm y hacen falta '+t.v+' cm. Abre más el compás.',
                 en:'Not yet: from side to side you have '+(2*st.rad)+' cm and '+t.v+' cm are needed. Open the compass more.'}))
        : (t.k === 'p'
            ? T({es:'Te pasaste: la circunferencia rebasa a P y ahora P quedó dentro. Cierra un poco el compás.',
                 en:'Too far: the circle goes past P and now P is inside. Close the compass a little.'})
            : T({es:'Te pasaste: de lado a lado llevas '+(2*st.rad)+' cm y solo se piden '+t.v+' cm. Cierra un poco el compás.',
                 en:'Too far: from side to side you have '+(2*st.rad)+' cm and only '+t.v+' cm are asked for. Close the compass a little.'}));
    };
    st.rad = startRad();
    render();
  })();

  /* ---- PROBLEMA 1 ---- */
  addProb(v1 === 0 ? {
    title:{es:'Del centro al borde', en:'From the centre to the rim'},
    q:{es:'Para trazar una circunferencia se abre el compás '+r1+' cm y se apoya la punta en el punto O. ¿Cuánto mide el diámetro de la circunferencia que queda dibujada?',
       en:'To draw a circle the compass is opened '+r1+' cm and its point is placed at O. How long is the diameter of the circle that gets drawn?'},
    options:{es:[(2*r1)+' cm', r1+' cm', (r1/2)+' cm', (4*r1)+' cm'],
             en:[(2*r1)+' cm', r1+' cm', (r1/2)+' cm', (4*r1)+' cm']},
    correct:{es:(2*r1)+' cm', en:(2*r1)+' cm'},
    hint:{es:'La abertura del compás es el radio, y el diámetro está formado por dos radios seguidos, uno de cada lado del centro.',
          en:'The compass opening is the radius, and the diameter is made of two radii in a row, one on each side of the centre.'},
    exp:{es:'La abertura del compás es el radio: '+r1+' cm. El diámetro son dos radios seguidos, '+r1+' cm más '+r1+' cm, es decir '+(2*r1)+' cm.',
         en:'The compass opening is the radius: '+r1+' cm. The diameter is two radii in a row, '+r1+' cm plus '+r1+' cm, that is '+(2*r1)+' cm.'},
    showWork:true
  } : {
    title:{es:'La medida de lado a lado', en:'The measure from side to side'},
    q:{es:'Una circunferencia dibujada en el pizarrón mide '+D1+' cm de lado a lado, pasando por su centro. ¿Con qué abertura de compás se trazó?',
       en:'A circle drawn on the board measures '+D1+' cm from side to side, passing through its centre. What compass opening was used to draw it?'},
    options:{es:[(D1/2)+' cm', D1+' cm', (D1-2)+' cm', (2*D1)+' cm'],
             en:[(D1/2)+' cm', D1+' cm', (D1-2)+' cm', (2*D1)+' cm']},
    correct:{es:(D1/2)+' cm', en:(D1/2)+' cm'},
    hint:{es:'La abertura del compás es el radio, y el radio cabe exactamente dos veces en la medida de lado a lado.',
          en:'The compass opening is the radius, and the radius fits exactly twice into the side to side measure.'},
    exp:{es:'La medida de lado a lado pasando por el centro es el diámetro, '+D1+' cm. El radio es la mitad, así que el compás se abrió '+(D1/2)+' cm.',
         en:'The side to side measure through the centre is the diameter, '+D1+' cm. The radius is half of it, so the compass was opened '+(D1/2)+' cm.'},
    showWork:true
  });

  /* ---- PROBLEMA 2 ---- */
  addProb(v2 === 0 ? {
    title:{es:'Un punto en la hoja', en:'A point on the sheet'},
    q:{es:'Una circunferencia tiene centro O y radio '+r2+' cm. En la misma hoja hay un punto P que está a '+(r2+e2)+' cm de O. ¿Dónde queda P?',
       en:'A circle has centre O and radius '+r2+' cm. On the same sheet there is a point P that is '+(r2+e2)+' cm from O. Where does P lie?'},
    options:{es:['Fuera del círculo','Dentro del círculo, sin tocar la circunferencia','Sobre la circunferencia','No se puede saber sin conocer el diámetro'],
             en:['Outside the disc','Inside the disc, without touching the circle','On the circle','It cannot be known without the diameter']},
    correct:{es:'Fuera del círculo', en:'Outside the disc'},
    hint:{es:'Compara la distancia de P al centro con el radio de la circunferencia.',
          en:'Compare the distance from P to the centre with the radius of the circle.'},
    exp:{es:'Todos los puntos de la circunferencia están a '+r2+' cm del centro. P está a '+(r2+e2)+' cm, es decir más lejos que esa distancia, así que queda fuera.',
         en:'Every point of the circle is '+r2+' cm from the centre. P is '+(r2+e2)+' cm away, farther than that distance, so it lies outside.'},
    showWork:false
  } : {
    title:{es:'Un punto en la hoja', en:'A point on the sheet'},

          '<div class="krow"><input type="range" min="-4" max="4" value="'+st.t+'" oninput="ctSlide(this.value)"><span class="kval" id="ctSv">'+num(Rcur())+' cm</span></div>'+
          '<div class="livelbl">'+T({es:'Radio de la circunferencia: ', en:'Radius of the circle: '})+'<b id="ctVal">'+num(Rcur())+' cm</b></div>'+
          '<div class="statline" id="ctStat">'+statTxt()+'</div>'+
          '<button class="rverify-btn" onclick="ctChk()">'+T({es:'Verificar',en:'Check'})+'</button>'+
          '<div class="rfb" id="ctFb"></div>'+
        '</div>';
      draw();
    }
    function updLbl(){
      var a = document.getElementById('ctSv'); if (a) a.textContent = num(Rcur())+' cm';
      var b = document.getElementById('ctVal'); if (b) b.textContent = num(Rcur())+' cm';
      var c = document.getElementById('ctStat'); if (c) c.textContent = statTxt();
    }
    function adv(ms){
      st.lock = true;
      setTimeout(function(){
        st.r++; st.tries = 0; st.lock = false;
        if (st.r >= 3) st.done = true; else st.t = startT();
        render();
      }, ms);
    }
    window.ctSlide = function(val){
      if (st.done || st.lock) return;
      st.t = parseInt(val,10) || 0;
      draw(); updLbl();
    };
    window.ctChk = function(){
      if (st.done || st.lock) return;
      var fb = document.getElementById('ctFb'); if (!fb) return;
      var o = rd();
      if (st.t === o.t0){
        fb.innerHTML = '<span class="okmsg">'+T({
          es:'Correcto: desde este centro las distancias a A, a B y a C son iguales, así que los tres puntos quedaron sobre la misma circunferencia.',
          en:'Correct: from this centre the distances to A, to B and to C are equal, so the three points ended up on the same circle.'
        })+'</span>';
        adv(1800); return;
      }
      st.tries++;
      if (st.tries >= 3){
        st.t = o.t0; draw(); updLbl();
        fb.innerHTML = T({
          es:'Así queda: solo esta posición del centro deja a los tres puntos sobre la misma circunferencia.',
          en:'Here it is: only this position of the centre leaves the three points on the same circle.'
        });
        adv(2800); return;
      }
      fb.textContent = (dC() > Rcur())
        ? T({es:'Todavía no: C quedó fuera, así que la circunferencia debe crecer de ese lado. Mueve el centro hacia '+(o.t0 > st.t ? 'arriba' : 'abajo')+'.',
             en:'Not yet: C is outside, so the circle has to grow on that side. Move the centre '+(o.t0 > st.t ? 'up' : 'down')+'.'})
        : T({es:'Todavía no: C quedó dentro, así que la circunferencia se pasó. Mueve el centro hacia '+(o.t0 > st.t ? 'arriba' : 'abajo')+'.',
             en:'Not yet: C is inside, so the circle overshot. Move the centre '+(o.t0 > st.t ? 'up' : 'down')+'.'});
    };
    st.t = startT();
    render();
  })();

  /* ---- PROBLEMA 8 ---- */
  addProb(v8 === 0 ? {
    title:{es:'Los tres juegos del parque', en:'The three rides in the park'},
    q:{es:'En un parque hay tres juegos que no están alineados y se quiere pintar en el piso un círculo cuyo borde pase exactamente por los tres. ¿Cuántos círculos distintos cumplen esa condición?',
       en:'In a park there are three rides that are not in line and a circle is to be painted on the ground so that its rim passes exactly through the three of them. How many different circles meet that condition?'},
    options:{es:['Exactamente uno','Ninguno','Exactamente dos','Una cantidad infinita'],
             en:['Exactly one','None','Exactly two','Infinitely many']},
    correct:{es:'Exactamente uno', en:'Exactly one'},
    hint:{es:'El centro tendría que quedar a la misma distancia de los tres juegos a la vez.',
          en:'The centre would have to be the same distance from all three rides at once.'},
    exp:{es:'El borde pasa por los tres juegos solo si el centro está a la misma distancia de los tres, y con tres puntos que no están alineados existe un único lugar así. Ese centro y esa distancia dan una sola circunferencia.',
         en:'The rim passes through the three rides only if the centre is the same distance from all three, and with three points that are not in line there is a single such place. That centre and that distance give a single circle.'},
    showWork:false
  } : {
    title:{es:'Dos puntos marcados', en:'Two marked points'},
    q:{es:'En una hoja están marcados dos puntos, A y B, y se quiere trazar una circunferencia que pase por los dos. ¿Dónde puede estar su centro?',
       en:'Two points, A and B, are marked on a sheet and a circle is to be drawn passing through both of them. Where can its centre be?'},
    options:{es:['En cualquier punto de la mediatriz de AB','Solamente en el punto medio de AB','En cualquier punto de la recta que pasa por A y por B','En cualquier punto de la hoja'],
             en:['At any point of the perpendicular bisector of AB','Only at the midpoint of AB','At any point of the line through A and B','At any point of the sheet']},
    correct:{es:'En cualquier punto de la mediatriz de AB', en:'At any point of the perpendicular bisector of AB'},
    hint:{es:'A y B son puntos de la circunferencia, así que el centro tiene que quedar a la misma distancia de los dos.',
          en:'A and B are points of the circle, so the centre has to be the same distance from both.'},
    exp:{es:'Como A y B están sobre la circunferencia, el centro queda a la misma distancia de los dos, y todos esos lugares forman la mediatriz de AB. Por eso hay muchísimas circunferencias que pasan por A y por B.',
         en:'Since A and B are on the circle, the centre is the same distance from both, and all those places form the perpendicular bisector of AB. That is why there are a great many circles passing through A and B.'},
    showWork:false
  });

  /* ---- PROBLEMA 9 ---- */
  addProb(v9 === 0 ? {
    title:{es:'La abertura exacta', en:'The exact opening'},
    q:{es:'Se quiere trazar una circunferencia con centro en O que pase por el punto P. Al medir con la regla, de O a P hay '+k9+' cm. ¿Con qué abertura hay que abrir el compás?',
       en:'A circle with centre O is to be drawn passing through point P. Measuring with a ruler, from O to P there are '+k9+' cm. What opening should the compass be set to?'},
    options:{es:[k9+' cm', (2*k9)+' cm', (k9+2)+' cm', (k9-2)+' cm'],
             en:[k9+' cm', (2*k9)+' cm', (k9+2)+' cm', (k9-2)+' cm']},
    correct:{es:k9+' cm', en:k9+' cm'},
    hint:{es:'Todos los puntos de la circunferencia quedan a una misma distancia del centro, y esa distancia es la abertura del compás.',
          en:'Every point of the circle is at one same distance from the centre, and that distance is the compass opening.'},
    exp:{es:'Para que P quede sobre la circunferencia, la distancia del centro a P tiene que ser el radio, así que el compás se abre '+k9+' cm.',
         en:'For P to lie on the circle, the distance from the centre to P has to be the radius, so the compass is opened '+k9+' cm.'},
    showWork:true
  } : {
    title:{es:'De un punto al diámetro', en:'From a point to the diameter'},
    q:{es:'Se traza una circunferencia con centro en O que pasa por el punto P, y de O a P hay '+k9+' cm. ¿Cuánto mide el diámetro de esa circunferencia?',
       en:'A circle with centre O is drawn passing through point P, and from O to P there are '+k9+' cm. How long is the diameter of that circle?'},
    options:{es:[(2*k9)+' cm', k9+' cm', (4*k9)+' cm', (2*k9-2)+' cm'],
             en:[(2*k9)+' cm', k9+' cm', (4*k9)+' cm', (2*k9-2)+' cm']},
    correct:{es:(2*k9)+' cm', en:(2*k9)+' cm'},
    hint:{es:'Primero decide qué papel juega la distancia de O a P y después usa que el diámetro son dos radios seguidos.',
          en:'First decide what role the distance from O to P plays and then use that the diameter is two radii in a row.'},
    exp:{es:'La distancia de O a P es el radio, '+k9+' cm, porque P está sobre la circunferencia. El diámetro son dos radios seguidos: '+(2*k9)+' cm.',
         en:'The distance from O to P is the radius, '+k9+' cm, because P lies on the circle. The diameter is two radii in a row: '+(2*k9)+' cm.'},
    showWork:true
  });

  /* ---- PROBLEMA 10 ---- */
  addProb(v10 === 0 ? {
    title:{es:'Del diámetro a otro punto', en:'From the diameter to another point'},
    q:{es:'AB es un diámetro de una circunferencia de centro O y mide '+L10+' cm. C es otro punto cualquiera de la misma circunferencia. ¿Cuánto mide el segmento OC?',
       en:'AB is a diameter of a circle with centre O and measures '+L10+' cm. C is any other point of the same circle. How long is segment OC?'},
    options:{es:[(L10/2)+' cm', L10+' cm', (2*L10)+' cm', (L10/2-1)+' cm'],
             en:[(L10/2)+' cm', L10+' cm', (2*L10)+' cm', (L10/2-1)+' cm']},
    correct:{es:(L10/2)+' cm', en:(L10/2)+' cm'},
    hint:{es:'Fíjate en qué une el segmento OC y recuerda que el diámetro está formado por dos radios seguidos.',
          en:'Look at what segment OC joins and remember that the diameter is made of two radii in a row.'},
    exp:{es:'OC va del centro a un punto de la circunferencia, así que es un radio. El radio es la mitad del diámetro, y la mitad de '+L10+' cm es '+(L10/2)+' cm.',
         en:'OC goes from the centre to a point of the circle, so it is a radius. The radius is half the diameter, and half of '+L10+' cm is '+(L10/2)+' cm.'},
    showWork:true
  } : {
    title:{es:'La recta que apenas la roza', en:'The line that barely grazes it'},
    q:{es:'Una circunferencia tiene un diámetro de '+L10+' cm. ¿A qué distancia de su centro debe pasar una recta para tocarla en un solo punto?',
       en:'A circle has a diameter of '+L10+' cm. How far from its centre must a straight line pass in order to touch it at a single point?'},
    options:{es:[(L10/2)+' cm', L10+' cm', (2*L10)+' cm', '0 cm'],
             en:[(L10/2)+' cm', L10+' cm', (2*L10)+' cm', '0 cm']},
    correct:{es:(L10/2)+' cm', en:(L10/2)+' cm'},
    hint:{es:'Una recta toca en un solo punto cuando su distancia al centro es igual al radio, y el radio es la mitad del diámetro.',
          en:'A line touches at a single point when its distance to the centre equals the radius, and the radius is half the diameter.'},
    exp:{es:'El radio es la mitad del diámetro: la mitad de '+L10+' cm es '+(L10/2)+' cm. La recta toca en un solo punto justo cuando pasa a esa distancia del centro.',
         en:'The radius is half the diameter: half of '+L10+' cm is '+(L10/2)+' cm. The line touches at a single point exactly when it passes at that distance from the centre.'},
    showWork:true
  });
}
</script>

<!-- LIAXA ANALYTICS -->
<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbykkuJ_apGq3vALIFd4mr3acu81c7K4OKxW-DZ-i52Ceyl3lOanXMdvbS9SIXPrLQBm/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'Rectas Notables de la Circunferencia';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
