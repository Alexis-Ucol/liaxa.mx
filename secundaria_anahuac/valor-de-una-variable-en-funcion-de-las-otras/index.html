        '</div>'+
      '</div>'+
    '</div>'+
    '<button class="rverify-btn" onclick="reflSave()">'+(es?'Guardar en el cuaderno':'Save to the notebook')+'</button>'+
    '<div class="rfb" id="reflFb"></div>';
  document.getElementById('lessonBody').appendChild(wrap);

  window.reflTab = function(which, btn){
    ['type','draw'].forEach(function(k){
      var pnl = document.getElementById('refl_'+k);
      if (pnl) pnl.classList.toggle('active', k === which);
    });
    wrap.querySelectorAll('.wtab').forEach(function(b){ b.classList.remove('active'); });
    btn.classList.add('active');
    if (which === 'draw') setTimeout(function(){ var c = document.getElementById('reflCv'); if (c && !c.width) initCanvas(c); }, 60);
  };
  window.reflSave = function(){
    var ta = document.getElementById('reflTa');
    var n = ta ? ta.value.trim().length : 0;
    var fb = document.getElementById('reflFb');
    fb.innerHTML = '<span style="color:var(--ok);font-weight:600;">✓ '+(n > 60
      ? (es ? 'Guardado. Tu explicación ya distingue qué medidas mandan y cuál queda determinada.' : 'Saved. Your explanation already tells which measurements command and which one is left determined.')
      : (n > 0
        ? (es ? 'Guardado. Si le agregas un ejemplo con números, tu idea se sostiene sola.' : 'Saved. If you add an example with numbers, your idea holds up on its own.')
        : (es ? 'Guardado. Lo que dibujaste también cuenta como respuesta.' : 'Saved. What you drew also counts as an answer.')))+'</span>';
  };
}

/* ══════════════════════════════════════════════════════════════════════
   GRADED PROBLEM BUILDER (inline, one card at a time)
   ══════════════════════════════════════════════════════════════════════ */
function addProblem(rng, spec){
  var sh = shuffleOpts(spec.options, spec.correct, rng);
  problems.push({
    title: spec.title,
    questionText: spec.q,
    fn: '',
    options: sh.opts,
    correctIdx: sh.idx,
    hint: spec.hint,
    explanation: spec.exp,
    showWork: !!spec.showWork,
    studentChoice: null,
    pendingChoice: null
  });
  var idx = problems.length - 1;
  buildOneCard(problems[idx], idx);
}

/* ══════════════════════════════════════════════════════════════════════
   buildLesson: concept, manipulative, graded problem, interleaved
   ══════════════════════════════════════════════════════════════════════ */
function buildLesson(rng) {
  problems = [];
  WIDGET_REDRAW = [];
  var lb = document.getElementById('lessonBody');
  lb.innerHTML = '';
  var es = (LANG === 'es');
  var C  = es ? 'Concepto ' : 'Concept ';

  /* ── CONCEPT 1 ───────────────────────────────────────────────── */
  addSection(C + '1',
    es ? 'Toda la figura cabe en una igualdad' : 'The whole figure fits into one equality',
    (es
    ? '<p>Cuando una figura se describe con letras, cada letra guarda el lugar de una medida que todavía no tiene número. El área de un rectángulo se obtiene multiplicando su base por su altura, y esa misma idea sostiene el volumen de un prisma: el área de la base, multiplicada por lo alto que sea el cuerpo. Escribirlo con letras no complica nada, al contrario, permite hablar de todos los rectángulos y de todos los prismas al mismo tiempo.</p>'
    + '<p>Lo interesante aparece cuando se mira la igualdad completa. Dentro de una fórmula conviven varias variables amarradas por un mismo signo igual, y eso significa que no todas pueden elegirse libremente. Si conoces todas menos una, la que falta ya no tiene margen: su valor queda decidido por las demás. Un envase de volumen fijo lo muestra bien, porque en cuanto se fijan el largo y el ancho, la altura deja de ser una decisión y pasa a ser una consecuencia.</p>'
    : '<p>When a figure is described with letters, each letter holds the place of a measurement that has no number yet. The area of a rectangle comes from multiplying its base by its height, and that same idea supports the volume of a prism: the area of the base, multiplied by how tall the solid is. Writing it with letters complicates nothing; on the contrary, it lets you speak about every rectangle and every prism at the same time.</p>'
    + '<p>The interesting part appears when you look at the whole equality. Inside a formula several variables live tied together by one equals sign, and that means they cannot all be chosen freely. If you know all of them but one, the missing one has no room left: its value is decided by the others. A container with a fixed volume shows this well, because as soon as the length and the width are set, the height stops being a decision and becomes a consequence.</p>')
    + '<div class="rules-grid">'
    + '<div class="rcard"><div class="rname">'+(es?'Rectángulo':'Rectangle')+'</div><div class="rform">A = b · h</div><div class="rnote">'+(es?'La base y la altura deciden el área.':'The base and the height decide the area.')+'</div></div>'
    + '<div class="rcard"><div class="rname">'+(es?'Triángulo':'Triangle')+'</div><div class="rform">A = '+fx('b · h','2')+'</div><div class="rnote">'+(es?'La mitad del rectángulo que lo envuelve.':'Half of the rectangle that wraps it.')+'</div></div>'
    + '<div class="rcard"><div class="rname">'+(es?'Prisma':'Prism')+'</div><div class="rform">V = B · h</div><div class="rnote">'+(es?'El área de la base, repetida a lo alto.':'The base area, repeated upwards.')+'</div></div>'
    + '<div class="rcard"><div class="rname">'+(es?'Cilindro':'Cylinder')+'</div><div class="rform">V = π · r² · h</div><div class="rnote">'+(es?'La base circular, repetida a lo alto.':'The circular base, repeated upwards.')+'</div></div>'
    + '</div>'
    + '<div class="callout"><p><strong>'+(es?'Lo que conviene notar:':'Worth noticing:')+'</strong> '+(es
      ? 'una fórmula no obliga a conocer todas sus letras. Basta con conocer todas menos una para que la última quede determinada.'
      : 'a formula does not force you to know all of its letters. Knowing all but one is enough for the last one to be determined.')+'</p></div>');

  buildCaja(rng);

  /* ── PROBLEM 1 ── escribir la expresión que representa la figura ── */
  var P1V = [
    { es:{ t:'La caja sin tapa',
           q:'Una caja de cartón sin tapa tiene el fondo rectangular, de x cm de largo por y cm de ancho, y sus paredes miden h cm de alto. ¿Cuál expresión representa el área de cartón que se necesita para armarla?',
           o:['xy + 2xh + 2yh','2xy + 2xh + 2yh','xy + 4xh','xy + xh + yh'],
           a:'xy + 2xh + 2yh',
           h:'La caja tiene un fondo y cuatro paredes. Dos de esas paredes son iguales entre sí y miden x por h, y las otras dos miden y por h. Suma el fondo con las cuatro paredes.',
           e:'El fondo aporta xy. Las dos paredes largas aportan xh cada una y las dos paredes cortas aportan yh cada una, así que el cartón necesario es xy + 2xh + 2yh. La expresión con dos veces xy correspondería a una caja que además llevara tapa.' },
      en:{ t:'The box with no lid',
           q:'A cardboard box with no lid has a rectangular bottom, x cm long by y cm wide, and its walls are h cm tall. Which expression represents the area of cardboard needed to build it?',
           o:['xy + 2xh + 2yh','2xy + 2xh + 2yh','xy + 4xh','xy + xh + yh'],
           a:'xy + 2xh + 2yh',
           h:'The box has a bottom and four walls. Two of those walls are equal to each other and measure x by h, and the other two measure y by h. Add the bottom to the four walls.',
           e:'The bottom contributes xy. The two long walls contribute xh each and the two short walls contribute yh each, so the cardboard needed is xy + 2xh + 2yh. The expression with two lots of xy would belong to a box that also carried a lid.' } },
    { es:{ t:'El prisma de base triangular',
           q:'Un prisma recto tiene como base un triángulo cuya base mide b cm y cuya altura mide a cm. El prisma tiene L cm de largo. ¿Cuál expresión representa su volumen?',
           o:[fx('b · a · L','2'),'b · a · L',fx('b · a','2'),fx('(b + a) · L','2')],
           a:fx('b · a · L','2'),
           h:'El volumen de un prisma es el área de su base multiplicada por lo largo que sea el cuerpo. Aquí la base es un triángulo, así que primero calcula el área de ese triángulo.',
           e:'El área del triángulo de la base es b por a repartido entre dos. Al multiplicar esa área por el largo L se obtiene el volumen del prisma, que es b por a por L repartido entre dos. La expresión sin el dos correspondería a un prisma de base rectangular.' },
      en:{ t:'The prism with a triangular base',
           q:'A right prism has as its base a triangle whose base measures b cm and whose height measures a cm. The prism is L cm long. Which expression represents its volume?',
           o:[fx('b · a · L','2'),'b · a · L',fx('b · a','2'),fx('(b + a) · L','2')],
           a:fx('b · a · L','2'),
           h:'The volume of a prism is the area of its base multiplied by how long the solid is. Here the base is a triangle, so first work out the area of that triangle.',
           e:'The area of the triangular base is b times a shared between two. Multiplying that area by the length L gives the volume of the prism, which is b times a times L shared between two. The expression without the two would belong to a prism with a rectangular base.' } },
    { es:{ t:'La lata completa',
           q:'Una lata tiene forma de cilindro, con radio r cm y altura h cm, y está cerrada por arriba y por abajo. ¿Cuál expresión representa el área total de lámina que la cubre?',
           o:['2πr² + 2πrh','πr² + 2πrh','2πr² + πrh','πr² + πrh'],
           a:'2πr² + 2πrh',
           h:'La lámina cubre dos círculos iguales y una pared curva. Si esa pared se desenrollara quedaría un rectángulo cuya base es el contorno del círculo y cuya altura es la de la lata.',
           e:'Cada tapa circular aporta πr² y son dos tapas, de modo que aportan 2πr². La pared desenrollada es un rectángulo de base 2πr y altura h, es decir 2πrh. Sumadas, la lámina total es 2πr² + 2πrh.' },
      en:{ t:'The complete can',
           q:'A can has the shape of a cylinder, with radius r cm and height h cm, and it is closed at the top and at the bottom. Which expression represents the total area of metal sheet covering it?',
           o:['2πr² + 2πrh','πr² + 2πrh','2πr² + πrh','πr² + πrh'],
           a:'2πr² + 2πrh',
           h:'The sheet covers two equal circles and one curved wall. If that wall were unrolled it would leave a rectangle whose base is the outline of the circle and whose height is the height of the can.',
           e:'Each circular lid contributes πr² and there are two lids, so they contribute 2πr². The unrolled wall is a rectangle with base 2πr and height h, that is 2πrh. Added together, the total sheet is 2πr² + 2πrh.' } }
  ];
  var p1 = P1V[Math.floor(rng()*P1V.length)][LANG];
  addProblem(rng, { title:p1.t, q:p1.q, hint:p1.h, exp:p1.e, options:p1.o, correct:p1.a, showWork:false });

  /* ── PROBLEM 2 ── medida que falta en un prisma ── */
  var P2P = [ {a:8,b:5,c:6}, {a:9,b:4,c:7}, {a:12,b:5,c:4}, {a:7,b:6,c:5} ];
  var n2 = P2P[Math.floor(rng()*P2P.length)];
  var V2 = n2.a*n2.b*n2.c;
  var p2v = (rng() < 0.5) ? 'alt' : 'anc';
  var p2o, p2c;
  if (p2v === 'alt'){
    p2c = n2.c + ' cm';
    p2o = [ p2c, (n2.b*n2.c) + ' cm', (n2.a*n2.c) + ' cm', (V2 - n2.a*n2.b) + ' cm' ];
  } else {
    p2c = n2.b + ' cm';
    p2o = [ p2c, (n2.b*n2.c) + ' cm', (n2.a*n2.b) + ' cm', (V2 - n2.a*n2.c) + ' cm' ];
  }
  addProblem(rng, {
    title: es ? 'La caja de la mudanza' : 'The moving box',
    q: (p2v === 'alt'
      ? (es
        ? 'Una caja con forma de prisma rectangular mide '+n2.a+' cm de largo y '+n2.b+' cm de ancho. Su volumen es de '+V2+' cm³. ¿Cuánto mide su altura?'
        : 'A box shaped like a rectangular prism is '+n2.a+' cm long and '+n2.b+' cm wide. Its volume is '+V2+' cm³. How tall is it?')
      : (es
        ? 'Una caja con forma de prisma rectangular mide '+n2.a+' cm de largo y '+n2.c+' cm de alto. Su volumen es de '+V2+' cm³. ¿Cuánto mide su ancho?'
        : 'A box shaped like a rectangular prism is '+n2.a+' cm long and '+n2.c+' cm tall. Its volume is '+V2+' cm³. How wide is it?')),
    hint: es
      ? 'El volumen de un prisma sale de multiplicar tres medidas. Si ya conoces dos de ellas, multiplícalas primero y pregúntate por cuál número habría que multiplicar ese producto para llegar al volumen.'
      : 'The volume of a prism comes from multiplying three measurements. If you already know two of them, multiply those first and ask yourself which number that product would have to be multiplied by to reach the volume.',
    exp: (p2v === 'alt'
      ? (es
        ? 'Las dos medidas conocidas forman una cara de '+n2.a+' por '+n2.b+', es decir '+(n2.a*n2.b)+' cm². El volumen es esa cara repetida a lo alto, así que la altura es el cociente del volumen entre esa área y mide '+n2.c+' cm.'
        : 'The two known measurements form a face of '+n2.a+' by '+n2.b+', that is '+(n2.a*n2.b)+' cm². The volume is that face repeated upwards, so the height is the volume divided by that area and measures '+n2.c+' cm.')
      : (es
        ? 'Las dos medidas conocidas forman una cara de '+n2.a+' por '+n2.c+', es decir '+(n2.a*n2.c)+' cm². El volumen es esa cara repetida hacia el fondo, así que el ancho es el cociente del volumen entre esa área y mide '+n2.b+' cm.'
        : 'The two known measurements form a face of '+n2.a+' by '+n2.c+', that is '+(n2.a*n2.c)+' cm². The volume is that face repeated towards the back, so the width is the volume divided by that area and measures '+n2.b+' cm.')),
    options: p2o, correct: p2c, showWork: true
  });

  /* ── CONCEPT 2 ───────────────────────────────────────────────── */
  addSection(C + '2',
    es ? 'Despejar es deshacer, en el orden contrario' : 'Rearranging is undoing, in reverse order',
    (es
    ? '<p>Despejar una letra significa dejarla sola de un lado de la igualdad, sin nada que la acompañe. La única regla es que todo lo que se haga de un lado tiene que hacerse también del otro, porque de lo contrario la igualdad se rompe. A partir de ahí se trata de deshacer: lo que multiplica se retira dividiendo, lo que divide se retira multiplicando, lo que suma se retira restando y lo que está elevado al cuadrado se retira con una raíz.</p>'
    + '<p>El orden importa cuando hay una operación envolviendo a otra. En el área de un rectángulo, la base y la altura solo se multiplican, así que retirar cualquiera de las dos funciona igual de bien. En cambio, en un perímetro escrito como dos por la suma de la base y la altura, ese dos envuelve a toda la suma, y hay que deshacerlo antes de tocar lo que está adentro. Conviene mirar la fórmula de afuera hacia adentro y preguntarse qué operación es la última que se aplicó.</p>'
    : '<p>Isolating a letter means leaving it alone on one side of the equality, with nothing keeping it company. The only rule is that whatever is done on one side must also be done on the other, because otherwise the equality breaks. From there it is a matter of undoing: what multiplies is removed by dividing, what divides is removed by multiplying, what adds is removed by subtracting and what is squared is removed with a root.</p>'
    + '<p>Order matters when one operation wraps another. In the area of a rectangle the base and the height only multiply, so removing either of the two works equally well. In a perimeter written as two times the sum of the base and the height, however, that two wraps the whole sum, and it has to be undone before touching what is inside. It helps to read the formula from the outside inwards and ask which operation was the last one applied.</p>')
    + '<div class="callout"><p><strong>'+(es?'Antes de mover nada:':'Before moving anything:')+'</strong> '+(es
      ? 'mira qué está acompañando a la letra que quieres sola y con qué operación llegó ahí. Esa operación es la que hay que deshacer.'
      : 'look at what is keeping company with the letter you want alone and which operation brought it there. That operation is the one to undo.')+'</p></div>');

  buildDespeje(rng);

  /* ── PROBLEM 3 ── elegir la expresión despejada ── */
  var P3V = [
    { es:{ t:'La altura del triángulo',
           q:'De un triángulo se conocen el área A y la base b, y se quiere calcular su altura. ¿Cuál expresión entrega esa altura?',
           o:[fx('2 · A','b'),fx('A','b'),fx('A','2 · b'),'2 · A · b'],
           a:fx('2 · A','b'),
           h:'El área de un triángulo es la mitad del producto de la base por la altura. Deshaz primero esa mitad y después retira la base.',
           e:'Al multiplicar el área por dos desaparece la mitad y queda el producto de la base por la altura. Como la base multiplica a la altura, se retira dividiendo, de manera que la altura es el doble del área repartido entre la base.' },
      en:{ t:'The height of the triangle',
           q:'For a triangle the area A and the base b are known, and its height is wanted. Which expression delivers that height?',
           o:[fx('2 · A','b'),fx('A','b'),fx('A','2 · b'),'2 · A · b'],
           a:fx('2 · A','b'),
           h:'The area of a triangle is half the product of the base and the height. Undo that half first and then remove the base.',
           e:'Multiplying the area by two makes the half disappear and leaves the product of base and height. Since the base multiplies the height, it is removed by dividing, so the height is twice the area shared by the base.' } },
    { es:{ t:'La altura de la lata',
           q:'De un cilindro se conocen el volumen V y el radio r, y se quiere calcular su altura. ¿Cuál expresión entrega esa altura?',
           o:[fx('V','π · r²'),fx('V','2 · π · r'),fx('V','π · r'),'V · π · r²'],
           a:fx('V','π · r²'),
           h:'El volumen de un cilindro es el área de su base circular multiplicada por la altura. Escribe primero cuánto vale esa área de la base y después retírala.',
           e:'La base circular tiene área π por el radio al cuadrado, y esa área multiplica a la altura para dar el volumen. Como multiplica, se retira dividiendo, de modo que la altura es el volumen repartido entre π por el radio al cuadrado.' },
      en:{ t:'The height of the can',
           q:'For a cylinder the volume V and the radius r are known, and its height is wanted. Which expression delivers that height?',
           o:[fx('V','π · r²'),fx('V','2 · π · r'),fx('V','π · r'),'V · π · r²'],
           a:fx('V','π · r²'),
           h:'The volume of a cylinder is the area of its circular base multiplied by the height. Write down what that base area is worth first and then remove it.',
           e:'The circular base has area π times the radius squared, and that area multiplies the height to give the volume. Since it multiplies, it is removed by dividing, so the height is the volume shared by π times the radius squared.' } },
    { es:{ t:'La altura desde el perímetro',
           q:'De un rectángulo se conocen el perímetro P y la base b, y se quiere calcular su altura. ¿Cuál expresión entrega esa altura?',
           o:[fx('P','2')+' − b',fx('P − b','2'),fx('P','2 · b'),'P − 2 · b'],
           a:fx('P','2')+' − b',
           h:'El perímetro recorre dos bases y dos alturas. Ese dos envuelve a toda la suma, así que hay que deshacerlo antes de descontar la base.',
           e:'Al repartir el perímetro entre dos queda la suma de una base y una altura. De esa suma se descuenta la base y aparece la altura sola. Restar la base antes de repartir entre dos deja mal la cuenta, porque el perímetro contiene dos bases y no una.' },
      en:{ t:'The height from the perimeter',
           q:'For a rectangle the perimeter P and the base b are known, and its height is wanted. Which expression delivers that height?',
           o:[fx('P','2')+' − b',fx('P − b','2'),fx('P','2 · b'),'P − 2 · b'],
           a:fx('P','2')+' − b',
           h:'The perimeter walks two bases and two heights. That two wraps the whole sum, so it must be undone before discounting the base.',
           e:'Sharing the perimeter between two leaves the sum of one base and one height. From that sum the base is discounted and the height appears alone. Subtracting the base before sharing between two spoils the count, because the perimeter contains two bases and not one.' } }
  ];
  var p3 = P3V[Math.floor(rng()*P3V.length)][LANG];
  addProblem(rng, { title:p3.t, q:p3.q, hint:p3.h, exp:p3.e, options:p3.o, correct:p3.a, showWork:false });

  /* ── PROBLEM 4 ── medida que falta en un triángulo ── */
  var P4B = [ {b:12,h:14,A:84}, {b:16,h:9,A:72}, {b:20,h:13,A:130}, {b:8,h:15,A:60} ];
  var P4H = [ {b:15,h:12,A:90}, {b:9,h:16,A:72}, {b:13,h:20,A:130}, {b:7,h:8,A:28} ];
  var p4v = (rng() < 0.5) ? 'base' : 'alt';
  var n4 = (p4v === 'base') ? P4B[Math.floor(rng()*P4B.length)] : P4H[Math.floor(rng()*P4H.length)];
  var p4c, p4o;
  if (p4v === 'base'){
    p4c = n4.b + ' cm';
    p4o = [ p4c, (n4.A/n4.h) + ' cm', (n4.A/(2*n4.h)) + ' cm', (n4.A - n4.h) + ' cm' ];
  } else {
    p4c = n4.h + ' cm';
    p4o = [ p4c, (n4.A/n4.b) + ' cm', (n4.A/(2*n4.b)) + ' cm', (n4.A - n4.b) + ' cm' ];
  }
  addProblem(rng, {
    title: es ? 'El triángulo del taller' : 'The triangle in the workshop',
    q: (p4v === 'base'
      ? (es
        ? 'Una pieza triangular de madera tiene un área de '+n4.A+' cm² y su altura mide '+n4.h+' cm. ¿Cuánto mide su base?'
        : 'A triangular piece of wood has an area of '+n4.A+' cm² and its height measures '+n4.h+' cm. How long is its base?')
      : (es
        ? 'Una pieza triangular de madera tiene un área de '+n4.A+' cm² y su base mide '+n4.b+' cm. ¿Cuánto mide su altura?'
        : 'A triangular piece of wood has an area of '+n4.A+' cm² and its base measures '+n4.b+' cm. How tall is it?')),
    hint: es
      ? 'El área de un triángulo se quedó a la mitad del producto de sus dos medidas. Repara esa mitad antes de retirar la medida que ya conoces.'
      : 'The area of a triangle stayed at half the product of its two measurements. Repair that half before removing the measurement you already know.',
    exp: (p4v === 'base'
      ? (es
        ? 'Al duplicar el área se recupera el producto completo de base por altura, que vale '+(2*n4.A)+'. Al repartir ese producto entre la altura de '+n4.h+' cm queda la base, que mide '+n4.b+' cm.'
        : 'Doubling the area recovers the complete product of base and height, worth '+(2*n4.A)+'. Sharing that product by the height of '+n4.h+' cm leaves the base, which measures '+n4.b+' cm.')
      : (es
        ? 'Al duplicar el área se recupera el producto completo de base por altura, que vale '+(2*n4.A)+'. Al repartir ese producto entre la base de '+n4.b+' cm queda la altura, que mide '+n4.h+' cm.'
        : 'Doubling the area recovers the complete product of base and height, worth '+(2*n4.A)+'. Sharing that product by the base of '+n4.b+' cm leaves the height, which measures '+n4.h+' cm.')),
    options: p4o, correct: p4c, showWork: true
  });

  /* ── CONCEPT 3 ───────────────────────────────────────────────── */
  addSection(C + '3',
    es ? 'De la letra al número, sin perder nada en el camino' : 'From letter to number, without losing anything on the way',
    (es
    ? '<p>Una vez que la letra quedó sola, entra la parte más silenciosa del trabajo: sustituir los datos y operar sin perder ninguno. Los tropiezos más frecuentes no están en la fórmula sino en el traslado. Se olvida el dos del triángulo, se divide entre una medida que no era la indicada, o se resta cuando en realidad había que repartir. Conviene escribir el despeje antes de tocar la calculadora y solo entonces poner los números en su lugar.</p>'
    + '<p>Las unidades ayudan a detectar errores sin necesidad de revisar toda la cuenta. Una longitud se mide en centímetros, un área en centímetros cuadrados y un volumen en centímetros cúbicos. Si al buscar una altura el resultado aparece acompañado de centímetros cuadrados, algo se quedó a medio camino, porque ese número seguramente es el área de la base y no la medida que se estaba buscando.</p>'
    : '<p>Once the letter is alone, the quietest part of the work begins: substituting the data and operating without losing any of it. The most frequent slips are not in the formula but in the transfer. The two of the triangle gets forgotten, a division is made by the wrong measurement, or a subtraction happens where sharing was needed. It helps to write the rearrangement down before touching the calculator and only then put the numbers in their place.</p>'
    + '<p>Units help you catch errors without reviewing the whole calculation. A length is measured in centimetres, an area in square centimetres and a volume in cubic centimetres. If while looking for a height the result turns up carrying square centimetres, something stopped halfway, because that number is most likely the base area and not the measurement you were after.</p>')
    + '<div class="callout"><p><strong>'+(es?'Prueba rápida:':'Quick test:')+'</strong> '+(es
      ? 'toma el resultado y regrésalo a la fórmula original. Si la igualdad se cumple, la medida encontrada es la correcta.'
      : 'take the result and put it back into the original formula. If the equality holds, the measurement you found is the right one.')+'</p></div>');

  buildMatch(rng);

  /* ── PROBLEM 5 ── altura a partir del perímetro ── */
  var P5P = [ {P:46,b:15,h:8}, {P:58,b:19,h:10}, {P:64,b:13,h:19}, {P:72,b:25,h:11} ];
  var n5 = P5P[Math.floor(rng()*P5P.length)];
  var p5c = n5.h + ' cm';
  var p5o = [ p5c, (n5.P - n5.b) + ' cm', (n5.P/2) + ' cm', (n5.P - 2*n5.b) + ' cm' ];
  addProblem(rng, {
    title: es ? 'El marco de la fotografía' : 'The photograph frame',
    q: (es
      ? 'Un marco rectangular necesita '+n5.P+' cm de moldura para rodear la fotografía por completo, y la base del marco mide '+n5.b+' cm. ¿Cuánto mide su altura?'
      : 'A rectangular frame needs '+n5.P+' cm of moulding to surround the photograph completely, and the base of the frame measures '+n5.b+' cm. How tall is it?'),
    hint: es
      ? 'La moldura recorre dos bases y dos alturas. Quítale al total lo que se llevan las dos bases y fíjate en cuántas alturas quedan repartidas en lo que sobra.'
      : 'The moulding walks two bases and two heights. Take away from the total what the two bases carry off and notice how many heights are shared in what is left.',
    exp: (es
      ? 'Las dos bases se llevan '+(2*n5.b)+' cm de la moldura. Los '+(n5.P - 2*n5.b)+' cm restantes se reparten entre las dos alturas iguales, de modo que cada altura mide '+n5.h+' cm.'
      : 'The two bases carry off '+(2*n5.b)+' cm of the moulding. The remaining '+(n5.P - 2*n5.b)+' cm are shared between the two equal heights, so each height measures '+n5.h+' cm.'),
    options: p5o, correct: p5c, showWork: true
  });

  /* ── PROBLEM 6 ── base menor de un trapecio ── */
  var P6P = [ {A:90,h:9,B:12,b:8}, {A:96,h:8,B:15,b:9}, {A:120,h:10,B:15,b:9}, {A:105,h:7,B:18,b:12} ];
  var n6 = P6P[Math.floor(rng()*P6P.length)];
  var p6c = n6.b + ' cm';
  var p6o = [ p6c, (2*n6.A/n6.h) + ' cm', (n6.A/n6.h) + ' cm', (2*n6.A/n6.h + n6.B) + ' cm' ];
  addProblem(rng, {
    title: es ? 'El terreno con forma de trapecio' : 'The trapezium shaped plot',
    q: (es
      ? 'Un terreno con forma de trapecio tiene un área de '+n6.A+' cm² en el plano, una altura de '+n6.h+' cm y su base mayor mide '+n6.B+' cm. ¿Cuánto mide su base menor?'
      : 'A trapezium shaped plot has an area of '+n6.A+' cm² on the plan, a height of '+n6.h+' cm and its longer base measures '+n6.B+' cm. How long is its shorter base?'),
    hint: es
      ? 'El área de un trapecio toma las dos bases juntas, las promedia y multiplica por la altura. Recupera primero cuánto suman las dos bases y después descuenta la que ya conoces.'
      : 'The area of a trapezium takes both bases together, averages them and multiplies by the height. Recover first how much the two bases add up to and then discount the one you already know.',
    exp: (es
      ? 'Al duplicar el área y repartir entre la altura se recupera la suma de las dos bases, que vale '+(2*n6.A/n6.h)+' cm. Como la base mayor mide '+n6.B+' cm, a la base menor le corresponden '+n6.b+' cm.'
      : 'Doubling the area and sharing by the height recovers the sum of the two bases, worth '+(2*n6.A/n6.h)+' cm. Since the longer base measures '+n6.B+' cm, the shorter base is left with '+n6.b+' cm.'),
    options: p6o, correct: p6c, showWork: true
  });

  /* ── CONCEPT 4 ───────────────────────────────────────────────── */
  addSection(C + '4',
    es ? 'Cuando una medida crece, otra tiene que ceder' : 'When one measurement grows, another has to give way',
    (es
    ? '<p>Hay situaciones en las que el resultado no cambia aunque las medidas sí. Un envase que siempre debe contener la misma cantidad de líquido tiene el volumen amarrado, y esa amarra obliga a las demás medidas a acomodarse entre ellas. Si el envase se hace más ancho, tiene que hacerse más bajo, porque de otro modo cabría más líquido del permitido. La misma escena ocurre en un rectángulo de área fija: alargar la base obliga a recortar la altura.</p>'
    + '<p>El acomodo no siempre es parejo, y eso depende de cómo aparece cada letra en la fórmula. Una medida que aparece multiplicando una sola vez influye de manera directa, mientras que una medida elevada al cuadrado pesa mucho más, porque cualquier cambio suyo se aplica dos veces. Por eso, en un cilindro, tocar el radio sacude el volumen bastante más que tocar la altura, aunque ambas parezcan medidas del mismo tipo.</p>'
    : '<p>There are situations where the result does not change even though the measurements do. A container that must always hold the same amount of liquid has its volume tied down, and that tie forces the other measurements to settle among themselves. If the container is made wider, it has to become shorter, because otherwise more liquid than allowed would fit. The same scene happens in a rectangle of fixed area: lengthening the base forces the height to be trimmed.</p>'
    + '<p>The settling is not always even, and that depends on how each letter appears in the formula. A measurement that appears multiplying only once influences things directly, while a squared measurement weighs much more, because any change of its own is applied twice. That is why, in a cylinder, touching the radius shakes the volume considerably more than touching the height, even though both look like measurements of the same kind.</p>')
    + '<div class="callout"><p><strong>'+(es?'Para tenerlo a la mano:':'Worth keeping close:')+'</strong> '+(es
      ? 'antes de calcular, pregúntate qué queda fijo en la situación. Lo que se mantiene igual es lo que obliga a las demás medidas a moverse.'
      : 'before calculating, ask yourself what stays fixed in the situation. What stays the same is what forces the other measurements to move.')+'</p></div>');

  buildReflect(rng);

  /* ── PROBLEM 7 ── cómo responde el resultado a un cambio ── */
  var P7V = [
    { es:{ t:'El radio que se duplica',
           q:'Una fábrica cambia el diseño de una lata cilíndrica: duplica el radio y deja la altura tal como estaba. ¿Qué le ocurre al volumen de la lata?',
           o:['Se multiplica por cuatro','Se multiplica por dos','Se multiplica por ocho','Se multiplica por dieciséis'],
           a:'Se multiplica por cuatro',
           h:'En el volumen de un cilindro el radio aparece elevado al cuadrado, así que su cambio se aplica dos veces mientras la altura permanece intacta.',
           e:'El área de la base depende del radio al cuadrado, de modo que al duplicar el radio esa área queda cuatro veces mayor. Como la altura no cambió, el volumen crece exactamente en esa misma proporción y queda multiplicado por cuatro.' },
      en:{ t:'The radius that doubles',
           q:'A factory changes the design of a cylindrical can: it doubles the radius and leaves the height exactly as it was. What happens to the volume of the can?',
           o:['It is multiplied by four','It is multiplied by two','It is multiplied by eight','It is multiplied by sixteen'],
           a:'It is multiplied by four',
           h:'In the volume of a cylinder the radius appears squared, so its change is applied twice while the height stays untouched.',
           e:'The base area depends on the radius squared, so doubling the radius makes that area four times larger. Since the height did not change, the volume grows in exactly that same proportion and ends up multiplied by four.' } },
    { es:{ t:'La arista que se triplica',
           q:'Un cubo de madera se rehace con una arista tres veces más larga que la original. ¿Qué le ocurre a su área total?',
           o:['Se multiplica por nueve','Se multiplica por tres','Se multiplica por veintisiete','Se multiplica por seis'],
           a:'Se multiplica por nueve',
           h:'El área total de un cubo depende del área de una cara, y esa cara es un cuadrado cuya medida cambia en las dos direcciones a la vez.',
           e:'Cada cara es un cuadrado, así que al triplicar la arista su área queda nueve veces mayor. Como el cubo sigue teniendo seis caras iguales, el área total también queda multiplicada por nueve. El veintisiete correspondería al volumen, donde el cambio se aplica tres veces.' },
      en:{ t:'The edge that triples',
           q:'A wooden cube is remade with an edge three times longer than the original one. What happens to its total area?',
           o:['It is multiplied by nine','It is multiplied by three','It is multiplied by twenty seven','It is multiplied by six'],
           a:'It is multiplied by nine',
           h:'The total area of a cube depends on the area of one face, and that face is a square whose measurement changes in both directions at once.',
           e:'Each face is a square, so tripling the edge makes its area nine times larger. Since the cube still has six equal faces, the total area is also multiplied by nine. Twenty seven would belong to the volume, where the change is applied three times.' } },
    { es:{ t:'Las tres medidas que se duplican',
           q:'Una caja con forma de prisma rectangular se rehace duplicando su largo, su ancho y su altura. ¿Qué le ocurre a su volumen?',
           o:['Se multiplica por ocho','Se multiplica por dos','Se multiplica por cuatro','Se multiplica por seis'],
           a:'Se multiplica por ocho',
           h:'El volumen de un prisma reúne las tres medidas en un mismo producto, y aquí las tres cambiaron al mismo tiempo.',
           e:'El volumen es el producto de las tres medidas, y cada una quedó al doble, así que el producto queda multiplicado por dos tres veces seguidas, es decir por ocho. El cuatro correspondería a duplicar solo dos de las tres medidas.' },
      en:{ t:'The three measurements that double',
           q:'A box shaped like a rectangular prism is remade by doubling its length, its width and its height. What happens to its volume?',
           o:['It is multiplied by eight','It is multiplied by two','It is multiplied by four','It is multiplied by six'],
           a:'It is multiplied by eight',
           h:'The volume of a prism gathers the three measurements into one product, and here all three changed at the same time.',
           e:'The volume is the product of the three measurements, and each one was doubled, so the product is multiplied by two three times over, that is by eight. Four would belong to doubling only two of the three measurements.' } }
  ];
  var p7 = P7V[Math.floor(rng()*P7V.length)][LANG];
  addProblem(rng, { title:p7.t, q:p7.q, hint:p7.h, exp:p7.e, options:p7.o, correct:p7.a, showWork:false });

  /* ── PROBLEM 8 ── lado de una base cuadrada ── */
  var P8P = [ {s:10,h:5,V:500}, {s:6,h:7,V:252}, {s:8,h:6,V:384}, {s:12,h:3,V:432} ];
  var n8 = P8P[Math.floor(rng()*P8P.length)];
  var p8c = n8.s + ' cm';
  var p8o = [ p8c, (n8.s*n8.s) + ' cm', (2*n8.s) + ' cm', (n8.s*n8.s/2) + ' cm' ];
  addProblem(rng, {
    title: es ? 'La torre de base cuadrada' : 'The tower with a square base',
    q: (es
      ? 'Una torre de juguete tiene forma de prisma con base cuadrada y mide '+n8.h+' cm de alto. Su volumen es de '+n8.V+' cm³. ¿Cuánto mide el lado de su base?'
      : 'A toy tower has the shape of a prism with a square base and stands '+n8.h+' cm tall. Its volume is '+n8.V+' cm³. How long is the side of its base?'),
    hint: es
      ? 'Reparte primero el volumen entre la altura: ese cociente es el área de la base. Como la base es un cuadrado, su área es el lado multiplicado por sí mismo.'
      : 'Share the volume by the height first: that quotient is the base area. Since the base is a square, its area is the side multiplied by itself.',
    exp: (es
      ? 'Al repartir el volumen entre la altura queda el área de la base, que vale '+(n8.s*n8.s)+' cm². Como esa base es un cuadrado, el lado es el número que multiplicado por sí mismo da '+(n8.s*n8.s)+', es decir '+n8.s+' cm.'
      : 'Sharing the volume by the height leaves the base area, worth '+(n8.s*n8.s)+' cm². Since that base is a square, the side is the number which multiplied by itself gives '+(n8.s*n8.s)+', that is '+n8.s+' cm.'),
    options: p8o, correct: p8c, showWork: true
  });

  /* ── PROBLEM 9 ── qué le pasa a la otra variable ── */
  var P9V = [
    { es:{ t:'La lata de siempre',
           q:'Una lata cilíndrica debe contener siempre la misma cantidad de jugo. En un rediseño se decide fabricarla con un radio mayor. ¿Qué ocurre entonces con su altura?',
           o:['Tiene que disminuir para que quepa la misma cantidad de jugo','Tiene que aumentar para que quepa la misma cantidad de jugo','Se queda igual, porque la cantidad de jugo no cambió','Se duplica, sin importar cuánto creció el radio'],
           a:'Tiene que disminuir para que quepa la misma cantidad de jugo',
           h:'El volumen quedó amarrado y es el producto del área de la base por la altura. Piensa qué debe pasar con uno de los factores cuando el otro crece y el producto no puede moverse.',
           e:'Al crecer el radio, la base de la lata abarca más superficie. Como el volumen es el producto de esa base por la altura y ese producto debe seguir valiendo lo mismo, la altura tiene que bajar para compensar el crecimiento de la base.' },
      en:{ t:'The same old can',
           q:'A cylindrical can must always hold the same amount of juice. In a redesign it is decided to manufacture it with a larger radius. What happens then to its height?',
           o:['It has to decrease so that the same amount of juice fits','It has to increase so that the same amount of juice fits','It stays the same, because the amount of juice did not change','It doubles, no matter how much the radius grew'],
           a:'It has to decrease so that the same amount of juice fits',
           h:'The volume is tied down and it is the product of the base area and the height. Think about what must happen to one factor when the other grows and the product cannot move.',
           e:'As the radius grows, the base of the can covers more surface. Since the volume is the product of that base and the height and that product must keep the same worth, the height has to come down to compensate for the growth of the base.' } },
    { es:{ t:'El cartel de área fija',
           q:'Un cartel rectangular debe tener siempre la misma área impresa. Para colocarlo en otro muro se decide alargar su base. ¿Qué ocurre entonces con su altura?',
           o:['Tiene que disminuir para que el área siga siendo la misma','Tiene que aumentar para que el área siga siendo la misma','Se queda igual, porque el área no cambió','Se reduce a la mitad, sin importar cuánto creció la base'],
           a:'Tiene que disminuir para que el área siga siendo la misma',
           h:'El área quedó amarrada y es el producto de la base por la altura. Piensa qué debe pasar con uno de los factores cuando el otro crece y el producto no puede moverse.',
           e:'El área del cartel es la base multiplicada por la altura, y ese producto no puede cambiar. Si la base se alarga, la altura tiene que reducirse en la proporción justa para que el producto siga valiendo lo mismo.' },
      en:{ t:'The poster with a fixed area',
           q:'A rectangular poster must always have the same printed area. To place it on another wall it is decided to lengthen its base. What happens then to its height?',
           o:['It has to decrease so that the area stays the same','It has to increase so that the area stays the same','It stays the same, because the area did not change','It is cut in half, no matter how much the base grew'],
           a:'It has to decrease so that the area stays the same',
           h:'The area is tied down and it is the product of the base and the height. Think about what must happen to one factor when the other grows and the product cannot move.',
           e:'The area of the poster is the base multiplied by the height, and that product cannot change. If the base is lengthened, the height has to be reduced in the right proportion so that the product keeps the same worth.' } },
    { es:{ t:'El depósito de siempre',
           q:'Un depósito con forma de prisma de base cuadrada debe almacenar siempre la misma cantidad de agua. Se decide construirlo con un lado de base mayor. ¿Qué ocurre entonces con su altura?',
           o:['Tiene que disminuir para que quepa la misma cantidad de agua','Tiene que aumentar para que quepa la misma cantidad de agua','Se queda igual, porque la cantidad de agua no cambió','Se triplica, sin importar cuánto creció el lado de la base'],
           a:'Tiene que disminuir para que quepa la misma cantidad de agua',
           h:'El volumen quedó amarrado y es el producto del área de la base por la altura. Piensa qué debe pasar con uno de los factores cuando el otro crece y el producto no puede moverse.',
           e:'Al crecer el lado, la base cuadrada abarca más superficie. Como el volumen es esa base multiplicada por la altura y debe seguir valiendo lo mismo, la altura tiene que bajar para compensar el crecimiento de la base.' },
      en:{ t:'The same old tank',
           q:'A tank shaped like a prism with a square base must always store the same amount of water. It is decided to build it with a longer base side. What happens then to its height?',
           o:['It has to decrease so that the same amount of water fits','It has to increase so that the same amount of water fits','It stays the same, because the amount of water did not change','It triples, no matter how much the base side grew'],
           a:'It has to decrease so that the same amount of water fits',
           h:'The volume is tied down and it is the product of the base area and the height. Think about what must happen to one factor when the other grows and the product cannot move.',
           e:'As the side grows, the square base covers more surface. Since the volume is that base multiplied by the height and it must keep the same worth, the height has to come down to compensate for the growth of the base.' } }
  ];
  var p9 = P9V[Math.floor(rng()*P9V.length)][LANG];
  addProblem(rng, { title:p9.t, q:p9.q, hint:p9.h, exp:p9.e, options:p9.o, correct:p9.a, showWork:false });

  /* ── PROBLEM 10 ── cadena completa sobre un cubo ── */
  var P10P = [ {a:4,A:96,V:64}, {a:5,A:150,V:125}, {a:7,A:294,V:343}, {a:8,A:384,V:512} ];
  var n10 = P10P[Math.floor(rng()*P10P.length)];
  var p10v = (rng() < 0.5) ? 'vol' : 'area';
  var p10c, p10o;
  if (p10v === 'vol'){
    p10c = n10.V + ' cm³';
    p10o = [ p10c, (n10.a*n10.a) + ' cm³', (2*n10.a*n10.a) + ' cm³', (12*n10.a) + ' cm³' ];
  } else {
    p10c = n10.A + ' cm²';
    p10o = [ p10c, (n10.a*n10.a) + ' cm²', (4*n10.a*n10.a) + ' cm²', (12*n10.a) + ' cm²' ];
  }
  addProblem(rng, {
    title: es ? 'El cubo de la vitrina' : 'The cube in the display case',
    q: (p10v === 'vol'
      ? (es
        ? 'Un cubo de acrílico está forrado por completo y el forro cubre '+n10.A+' cm² de superficie. ¿Cuál es el volumen del cubo?'
        : 'An acrylic cube is completely covered and the cover takes up '+n10.A+' cm² of surface. What is the volume of the cube?')
      : (es
        ? 'Un cubo de acrílico tiene un volumen de '+n10.V+' cm³. ¿Cuánta superficie cubre el forro que lo envuelve por completo?'
        : 'An acrylic cube has a volume of '+n10.V+' cm³. How much surface does the cover that wraps it completely take up?')),
    hint: (p10v === 'vol'
      ? (es
        ? 'Un cubo tiene seis caras cuadradas iguales. Reparte la superficie entre esas caras para conocer el área de una sola, deduce de ahí cuánto mide la arista y solo entonces arma el volumen.'
        : 'A cube has six equal square faces. Share the surface among those faces to know the area of a single one, work out the edge from there and only then build the volume.')
      : (es
        ? 'En un cubo las tres medidas son iguales, así que la arista es el número que multiplicado por sí mismo tres veces da el volumen. Con esa arista calcula el área de una cara y recuerda que las caras son seis.'
        : 'In a cube the three measurements are equal, so the edge is the number which multiplied by itself three times gives the volume. With that edge work out the area of one face and remember there are six faces.')),
    exp: (p10v === 'vol'
      ? (es
        ? 'Al repartir la superficie entre las seis caras queda '+(n10.a*n10.a)+' cm² por cara. Como cada cara es un cuadrado, la arista mide '+n10.a+' cm, y al multiplicar esa arista por sí misma tres veces resulta un volumen de '+n10.V+' cm³.'
        : 'Sharing the surface among the six faces leaves '+(n10.a*n10.a)+' cm² per face. Since each face is a square, the edge measures '+n10.a+' cm, and multiplying that edge by itself three times gives a volume of '+n10.V+' cm³.')
      : (es
        ? 'La arista es el número que multiplicado por sí mismo tres veces da el volumen, es decir '+n10.a+' cm. Cada cara mide entonces '+(n10.a*n10.a)+' cm², y como el cubo tiene seis caras iguales el forro cubre '+n10.A+' cm².'
        : 'The edge is the number which multiplied by itself three times gives the volume, that is '+n10.a+' cm. Each face then measures '+(n10.a*n10.a)+' cm², and since the cube has six equal faces the cover takes up '+n10.A+' cm².')),
    options: p10o, correct: p10c, showWork: true
  });
}
</script>

<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbykkuJ_apGq3vALIFd4mr3acu81c7K4OKxW-DZ-i52Ceyl3lOanXMdvbS9SIXPrLQBm/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'Valor de una Variable en Función de las Otras';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
