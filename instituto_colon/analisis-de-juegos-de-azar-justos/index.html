/* ══════════════════════════════════════════════════════════════════════
   GUIDE CONTENT — juegos de azar justos: equiprobabilidad, reparto de la
   certeza, premios que compensan y juegos de dos etapas.
   Helpers, manipulatives and buildLesson (interleaved concept -> widget ->
   graded problem). Everything bilingual; every value comes from the seed.
   ══════════════════════════════════════════════════════════════════════ */
function addSection(tag, title, html){
  var d = document.createElement('div');
  d.className = 'section';
  d.innerHTML = '<div class="stag">'+tag+'</div><h2>'+title+'</h2>'+html;
  document.getElementById('lessonBody').appendChild(d);
}
function shuffleOpts(opts, correct, rng){
  var a = opts.slice();
  for (var i = a.length-1; i > 0; i--){ var j = Math.floor(rng()*(i+1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
  return { opts:a, idx:a.indexOf(correct) };
}
function shufflePerm(n, rng){
  var a = []; for (var i = 0; i < n; i++) a.push(i);
  for (var k = n-1; k > 0; k--){ var j = Math.floor(rng()*(k+1)); var t = a[k]; a[k] = a[j]; a[j] = t; }
  return a;
}
/* ── fraction helpers (Rule 13: stacked display, never an inline slash) ── */
function gcdOf(a, b){ a = Math.abs(a); b = Math.abs(b); while (b){ var t = a % b; a = b; b = t; } return a || 1; }
function frac(n, d){
  var g = gcdOf(n, d), nn = n/g, dd = d/g;
  if (dd === 1) return String(nn);
  return '<span class="mf-outer"><span class="mf-num">'+nn+'</span><span class="mf-den">'+dd+'</span></span>';
}
function fracRaw(n, d){
  return '<span class="mf-outer"><span class="mf-num">'+n+'</span><span class="mf-den">'+d+'</span></span>';
}
/* casillas de la rejilla de 36 parejas ordenadas que dan la suma s */
function cntSum(s){ return 6 - Math.abs(7 - s); }

function addProblem(rng, spec){
  var sh = shuffleOpts(spec.options, spec.correct, rng);
  problems.push({
    title: spec.title,
    questionText: spec.q,
    fn: '',
    options: sh.opts,
    correctIdx: sh.idx,
    hint: spec.hint,
    explanation: spec.exp,
    showWork: !!spec.showWork,
    studentChoice: null,
    pendingChoice: null
  });
  var idx = problems.length - 1;
  buildOneCard(problems[idx], idx);
}

/* ══════════════════════════════════════════════════════════════════════
   MANIPULATIVE 1 — Báscula de equiprobabilidad
   Situations arrive one at a time; the student sends each one to a bin and
   the widget answers with the reason, never with a bare cross.
   ══════════════════════════════════════════════════════════════════════ */
function buildEquiprob(rng){
  var es = (LANG === 'es');
  var BINS = es ? ['Todos pesan igual','Unos pesan más que otros'] : ['All weigh the same','Some weigh more than others'];
  var ITEMS = [
    { es:'Girar una ruleta dividida en ocho sectores del mismo tamaño y anotar el sector que señala la flecha.',
      en:'Spin a wheel divided into eight sectors of the same size and write down the sector the arrow points to.', bin:0,
      wes:'Los ocho sectores ocupan exactamente la misma porción de la ruleta.',
      wen:'The eight sectors take up exactly the same portion of the wheel.' },
    { es:'Lanzar dos dados y anotar la suma de las dos caras.',
      en:'Roll two dice and write down the sum of the two faces.', bin:1,
      wes:'La suma 7 se forma con seis parejas de caras y la suma 12 con una sola.',
      wen:'The sum 7 is formed by six pairs of faces and the sum 12 by only one.' },
    { es:'Sacar una ficha de una bolsa con 4 fichas rojas y 9 fichas azules y anotar el color.',
      en:'Draw a token from a bag with 4 red tokens and 9 blue tokens and write down the colour.', bin:1,
      wes:'Hay más fichas azules dentro de la bolsa, así que ese color aparece con más frecuencia.',
      wen:'There are more blue tokens inside the bag, so that colour shows up more often.' },
    { es:'Lanzar una moneda equilibrada y anotar la cara que queda arriba.',
      en:'Toss a balanced coin and write down the face that ends up on top.', bin:0,
      wes:'Las dos caras llegan al lanzamiento en las mismas condiciones.',
      wen:'Both faces arrive at the toss under the same conditions.' },
    { es:'Lanzar dos monedas a la vez y anotar cuántas águilas salieron.',
      en:'Toss two coins at once and write down how many heads came up.', bin:1,
      wes:'Una sola águila se obtiene de dos maneras distintas y dos águilas de una sola.',
      wen:'Exactly one head is obtained in two different ways and two heads in only one.' },
    { es:'Elegir al azar una de veinte fichas numeradas del 1 al 20 y anotar el número.',
      en:'Pick at random one of twenty tokens numbered 1 to 20 and write down the number.', bin:0,
      wes:'Las veinte fichas entran al sorteo en igualdad de condiciones.',
      wen:'The twenty tokens enter the draw under equal conditions.' },
    { es:'Girar una ruleta en la que el sector rojo ocupa la mitad del disco y los otros cuatro sectores se reparten el resto.',
      en:'Spin a wheel where the red sector takes up half the disc and the other four sectors share the rest.', bin:1,
      wes:'El sector rojo abarca más superficie que cualquiera de los otros cuatro.',
      wen:'The red sector covers more surface than any of the other four.' }
  ];
  var st = { seq:shufflePerm(ITEMS.length, rng), i:0, tries:0, right:0, lock:false, done:false };

  var wrap = document.createElement('div');
  wrap.className = 'iwrap section';
  wrap.setAttribute('data-widget','equiprobabilidad');
  wrap.id = 'wEquiprob';
  document.getElementById('lessonBody').appendChild(wrap);

  function cur(){ return ITEMS[st.seq[Math.min(st.i, ITEMS.length-1)]]; }
  function render(){
    if (st.done){
      wrap.innerHTML =
        '<div class="iw-tag">'+(es?'Báscula de resultados':'Outcome scale')+'</div>'+
        '<div class="cls-done">🎉 '+(es?'Las siete situaciones quedaron pesadas.':'All seven situations have been weighed.')+' '+st.right+' / '+ITEMS.length+'</div>';
      return;
    }
    var it = cur();
    wrap.innerHTML =
      '<div class="iw-tag">'+(es?'Báscula de resultados':'Outcome scale')+'</div>'+
      '<div class="iw-sub">'+(es
        ? 'Imagina que anotas el experimento muchísimas veces. Pregúntate si cada resultado de la lista aparecería más o menos la misma cantidad de veces, y toca el platillo que le corresponde.'
        : 'Imagine writing the experiment down a great many times. Ask yourself whether every outcome on the list would show up roughly the same number of times, and tap the tray it belongs to.')+'</div>'+
      '<div class="iw-prog">'+(st.i+1)+' / '+ITEMS.length+'</div>'+
      '<div class="cls-card">'+it[LANG]+'</div>'+
      '<div class="cls-bins">'+
        '<button class="cls-bin" onclick="eqPick(0)">'+BINS[0]+'</button>'+
        '<button class="cls-bin" onclick="eqPick(1)">'+BINS[1]+'</button>'+
      '</div>'+
      '<div class="rfb" id="eqFb"></div>';
  }
  function advance(){
    st.i++; st.tries = 0; st.lock = false;
    if (st.i >= ITEMS.length) st.done = true;
    render();
  }
  window.eqPick = function(bi){
    if (st.lock || st.done) return;
    var it = cur(), fb = document.getElementById('eqFb');
    if (bi === it.bin){
      st.right++; st.lock = true;
      fb.innerHTML = '<span style="color:var(--ok);font-weight:700;">✓ '+(es?'Así es. ':'That is it. ')+it[es?'wes':'wen']+'</span>';
      setTimeout(advance, 1300);
      return;
    }
    st.tries++;
    if (st.tries >= 3){
      st.lock = true;
      fb.innerHTML = (es?'Va en <b>':'It goes in <b>')+BINS[it.bin]+'</b>. '+it[es?'wes':'wen'];
      setTimeout(advance, 2500);
      return;
    }
    fb.textContent = (it.bin === 0)
      ? (es ? 'Vuelve a intentar: revisa si cada resultado que se anota ocupa la misma porción del total.'
            : 'Try again: check whether every outcome being written down takes up the same portion of the whole.')
      : (es ? 'Vuelve a intentar: busca un resultado que se pueda formar de más maneras o que ocupe más espacio que otro.'
            : 'Try again: look for an outcome that can be formed in more ways or that takes up more room than another.');
  };
  render();
}

/* ══════════════════════════════════════════════════════════════════════
   MANIPULATIVE 2 — Reparte las sumas
   The eleven sums of two dice are shared between two players. Every tap
   moves a sum from one side to the other and the bar redraws at once, so
   the student sees that eleven sums are NOT eleven equal shares.
   ══════════════════════════════════════════════════════════════════════ */
function buildReparto(rng){
  var es = (LANG === 'es');
  var st = { own:[], tries:0, done:false };
  for (var s = 2; s <= 12; s++) st.own.push(rng() < 0.5 ? 0 : 1);
  var wrap = document.createElement('div');
  wrap.className = 'iwrap section';
  wrap.setAttribute('data-widget','reparto');
  wrap.id = 'wReparto';
  document.getElementById('lessonBody').appendChild(wrap);

  function casillasA(){
    var n = 0;
    for (var i = 0; i < 11; i++) if (st.own[i] === 0) n += cntSum(i+2);
    return n;
  }
  if (casillasA() === 18) st.own[0] = 1 - st.own[0];

  function render(){
    var A = casillasA(), B = 36 - A;
    var chips = '';
    for (var i = 0; i < 11; i++){
      var c = cntSum(i+2);
      var cls = 'sp-chip ' + (st.own[i] === 0 ? 'pa' : 'pb') + (st.done ? ' lock' : '');
      chips += '<button class="'+cls+'" onclick="spTap('+i+')">'+(i+2)+
               '<small>'+c+(es?' casillas':' cells')+'</small></button>';
    }
    wrap.innerHTML =
      '<div class="iw-tag">'+(es?'Reparte las sumas':'Share out the sums')+'</div>'+
      '<div class="iw-goal">'+(es
        ? 'Reparte las once sumas para que Ana y Beto tengan la misma cantidad de casillas.'
        : 'Share the eleven sums so that Ana and Beto end up with the same number of cells.')+'</div>'+
      '<div class="iw-sub">'+(es
        ? 'La rejilla de dos dados tiene 36 parejas. Cada suma vale las casillas que aparecen debajo de ella. Toca una suma para pasarla al otro jugador.'
        : 'The two dice grid has 36 pairs. Each sum is worth the cells shown under it. Tap a sum to move it to the other player.')+'</div>'+
      '<div class="sp-grid">'+chips+'</div>'+
      '<div class="sp-bar"><div class="sp-a" style="width:'+(A/36*100)+'%"></div><div class="sp-b" style="width:'+(B/36*100)+'%"></div></div>'+
      '<div class="sp-legend"><span><span class="sp-key ka"></span>Ana '+A+' / 36</span><span><span class="sp-key kb"></span>Beto '+B+' / 36</span></div>'+
      (st.done ? '' : '<button class="rverify-btn" onclick="spCheck()">'+(es?'Verificar':'Check')+'</button>')+
      '<div class="rfb" id="spFb"></div>';
  }
  window.spTap = function(i){
    if (st.done) return;
    st.own[i] = 1 - st.own[i];
    render();
    var A = casillasA(), d = A - 18, fb = document.getElementById('spFb');
    if (d === 0) fb.textContent = es ? 'Los dos platillos quedaron parejos. Confirma tu reparto.'
                                     : 'Both trays are level now. Confirm your split.';
    else if (d > 0) fb.textContent = es ? 'A Ana le sobran '+d+' casillas. Pásale a Beto una suma que valga '+d+' casillas, o dos sumas que juntas las valgan.'
                                        : 'Ana has '+d+' cells too many. Move to Beto a sum worth '+d+' cells, or two sums worth that together.';
    else fb.textContent = es ? 'A Ana le faltan '+(-d)+' casillas. Quítale a Beto una suma que valga '+(-d)+' casillas, o dos que juntas las valgan.'
                             : 'Ana is '+(-d)+' cells short. Take from Beto a sum worth '+(-d)+' cells, or two that are worth that together.';
  };
  window.spCheck = function(){
    if (st.done) return;
    var A = casillasA(), fb = document.getElementById('spFb');
    if (A === 18){
      st.done = true; render();
      document.getElementById('spFb').innerHTML = '<span style="color:var(--ok);font-weight:700;">🎉 '+(es
        ? '18 casillas para cada uno. El juego quedó justo, y observa que no fue repartiendo las once sumas por mitades.'
        : '18 cells each. The game is fair now, and notice that it did not come from splitting the eleven sums in half.')+'</span>';
      return;
    }
    st.tries++;
    if (st.tries >= 3){
      for (var i = 0; i < 11; i++) st.own[i] = (i >= 2 && i <= 5) ? 0 : 1;
      st.done = true; render();
      document.getElementById('spFb').innerHTML = (es
        ? 'Este reparto sí es justo: las sumas 4, 5, 6 y 7 valen 3 + 4 + 5 + 6 = 18 casillas, y las siete sumas restantes valen las otras 18. Cuatro sumas contra siete, y aun así el juego es parejo.'
        : 'This split is fair: the sums 4, 5, 6 and 7 are worth 3 + 4 + 5 + 6 = 18 cells, and the remaining seven sums are worth the other 18. Four sums against seven, and the game is still level.');
      return;
    }
    fb.textContent = (A > 18)
      ? (es ? 'Todavía no. Ana va arriba: busca del lado verde la suma más gorda y pásala.' : 'Not yet. Ana is ahead: find the fattest sum on the green side and move it across.')
      : (es ? 'Todavía no. Beto va arriba: busca del lado dorado la suma más gorda y pásala.' : 'Not yet. Beto is ahead: find the fattest sum on the golden side and move it across.');
  };
  render();
}

/* ══════════════════════════════════════════════════════════════════════
   MANIPULATIVE 3 — Ajusta el premio
   Unequal chances, adjustable payoff. The two point bars move while the
   slider moves, so the compensation idea is seen before it is calculated.
   ══════════════════════════════════════════════════════════════════════ */
function buildPremio(rng){
  var es = (LANG === 'es');
  var POOL = [ {r:8,a:4,pA:5}, {r:9,a:3,pA:4}, {r:10,a:5,pA:6}, {r:6,a:4,pA:6}, {r:8,a:6,pA:9}, {r:12,a:4,pA:3} ];
  var order = shufflePerm(POOL.length, rng);
  var st = { r:0, pB:1, tries:0, lock:false, done:false };

  var wrap = document.createElement('div');
  wrap.className = 'iwrap section';
  wrap.setAttribute('data-widget','premio');
  wrap.id = 'wPremio';
  document.getElementById('lessonBody').appendChild(wrap);

  function data(){ return POOL[order[st.r]]; }
  function fair(){ var d = data(); return d.r * d.pA / d.a; }

  function render(){
    if (st.done){
      wrap.innerHTML =
        '<div class="iw-tag">'+(es?'Ajusta el premio':'Tune the prize')+'</div>'+
        '<div class="cls-done">🎉 '+(es?'Las tres bolsas quedaron equilibradas.':'All three bags are balanced.')+'</div>';
      return;
    }
    var d = data(), n = d.r + d.a;
    st.pB = 1; st.tries = 0; st.lock = false;
    wrap.innerHTML =
      '<div class="iw-tag">'+(es?'Ajusta el premio':'Tune the prize')+'</div>'+
      '<div class="iw-prog">'+(st.r+1)+' / 3</div>'+
      '<div class="iw-goal">'+(es
        ? 'Decide cuántos puntos gana Beto para que ninguno de los dos salga ganando a la larga.'
        : 'Decide how many points Beto wins so that neither of them comes out ahead in the long run.')+'</div>'+
      '<div class="iw-sub">'+(es
        ? 'La bolsa tiene '+d.r+' fichas rojas y '+d.a+' fichas azules. Ana gana '+d.pA+' puntos cuando sale roja y Beto gana los puntos que le pongas cuando sale azul. De cada '+n+' partidas se espera que '+d.r+' salgan rojas y '+d.a+' azules.'
        : 'The bag holds '+d.r+' red tokens and '+d.a+' blue tokens. Ana wins '+d.pA+' points when red comes out and Beto wins the points you set when blue comes out. Out of every '+n+' games, '+d.r+' are expected to be red and '+d.a+' blue.')+'</div>'+
      '<div class="iw-ctrl">'+
        '<span class="iw-lbl">'+(es?'Premio de Beto':'Beto prize')+'</span>'+
        '<input type="range" id="pmRange" min="1" max="24" step="1" value="1" oninput="pmSet(this.value)">'+
        '<span class="iw-val" id="pmVal">1</span>'+
      '</div>'+
      '<div class="bal-row"><span class="bal-name">Ana</span><div class="bal-track"><div class="bal-fill fa" id="pmBarA"></div></div><span class="bal-num" id="pmNumA"></span></div>'+
      '<div class="bal-row"><span class="bal-name">Beto</span><div class="bal-track"><div class="bal-fill fb" id="pmBarB"></div></div><span class="bal-num" id="pmNumB"></span></div>'+
      '<div class="iw-read" id="pmRead"></div>'+
      '<button class="rverify-btn" onclick="pmCheck()">'+(es?'Verificar':'Check')+'</button>'+
      '<div class="rfb" id="pmFb"></div>';
    paint();
  }
  function paint(){
    var d = data(), tA = d.r * d.pA, tB = d.a * st.pB, mx = Math.max(tA, tB, 1);
    var vv = document.getElementById('pmVal'); if (vv) vv.textContent = st.pB;
    var rr = document.getElementById('pmRange'); if (rr) rr.value = st.pB;
    document.getElementById('pmBarA').style.width = (tA/mx*100)+'%';
    document.getElementById('pmBarB').style.width = (tB/mx*100)+'%';
    document.getElementById('pmNumA').textContent = tA;
    document.getElementById('pmNumB').textContent = tB;
    document.getElementById('pmRead').innerHTML = (es
      ? 'De cada '+(d.r+d.a)+' partidas: Ana acumula '+tA+' puntos y Beto '+tB+' puntos.'
      : 'Out of every '+(d.r+d.a)+' games: Ana piles up '+tA+' points and Beto '+tB+' points.');
    var fb = document.getElementById('pmFb');
    if (fb && !st.lock){
      if (tB === tA) fb.textContent = es ? 'Las dos barras miden lo mismo. Confirma tu premio.' : 'Both bars are the same length. Confirm your prize.';
      else if (tB < tA) fb.textContent = es ? 'Beto todavía se queda corto por '+(tA-tB)+' puntos. Sube su premio.' : 'Beto is still '+(tA-tB)+' points short. Raise the prize.';
      else fb.textContent = es ? 'Beto se pasó por '+(tB-tA)+' puntos. Baja su premio.' : 'Beto has gone '+(tB-tA)+' points over. Lower the prize.';
    }
  }
  window.pmSet = function(v){ if (st.lock || st.done) return; st.pB = parseInt(v,10); paint(); };
  function advance(){ st.r++; if (st.r >= 3) st.done = true; render(); }
  window.pmCheck = function(){
    if (st.lock || st.done) return;
    var d = data(), fb = document.getElementById('pmFb'), f = fair();
    if (st.pB === f){
      st.lock = true;
      fb.innerHTML = '<span style="color:var(--ok);font-weight:700;">✓ '+(es
        ? 'Equilibrado: '+d.r+' × '+d.pA+' = '+d.a+' × '+f+'. El color menos frecuente paga más y eso empareja el juego.'
        : 'Balanced: '+d.r+' × '+d.pA+' = '+d.a+' × '+f+'. The rarer colour pays more and that levels the game.')+'</span>';
      setTimeout(advance, 2000);
      return;
    }
    st.tries++;
    if (st.tries >= 3){
      st.lock = true; st.pB = f; paint();
      fb.innerHTML = (es
        ? 'El premio justo era '+f+' puntos, porque '+d.r+' × '+d.pA+' = '+(d.r*d.pA)+' y '+d.a+' × '+f+' = '+(d.a*f)+'.'
        : 'The fair prize was '+f+' points, because '+d.r+' × '+d.pA+' = '+(d.r*d.pA)+' and '+d.a+' × '+f+' = '+(d.a*f)+'.');
      setTimeout(advance, 2600);
      return;
    }
    var tB = d.a * st.pB, tA = d.r * d.pA;
    fb.textContent = (tB < tA)
      ? (es ? 'Todavía no. La barra dorada es más corta: el premio de Beto tiene que subir.' : 'Not yet. The golden bar is shorter: Beto needs a bigger prize.')
      : (es ? 'Todavía no. La barra dorada es más larga: el premio de Beto tiene que bajar.' : 'Not yet. The golden bar is longer: Beto needs a smaller prize.');
  };
  render();
}

/* ══════════════════════════════════════════════════════════════════════
   MANIPULATIVE 4 — Diseña el juego de dos giros
   Two wheels, two sliders. The product and the complement are recomputed
   on every slider move, so the student watches a rule instead of reading it.
   ══════════════════════════════════════════════════════════════════════ */
function buildDosEtapas(rng){
  var es = (LANG === 'es');
  var TARGETS = [16, 8, 24, 32];
  var SOL = { 16:[4,4], 8:[2,4], 24:[4,6], 32:[4,8] };
  var order = shufflePerm(TARGETS.length, rng);
  var st = { r:0, k1:1, k2:1, tries:0, lock:false, done:false };

  var wrap = document.createElement('div');
  wrap.className = 'iwrap section';
  wrap.setAttribute('data-widget','dosetapas');
  wrap.id = 'wDosEtapas';
  document.getElementById('lessonBody').appendChild(wrap);

  function target(){ return TARGETS[order[st.r]]; }
  function render(){
    if (st.done){
      wrap.innerHTML =
        '<div class="iw-tag">'+(es?'Diseña el juego de dos giros':'Design the two spin game')+'</div>'+
        '<div class="cls-done">🎉 '+(es?'Los tres encargos quedaron armados.':'All three orders have been built.')+'</div>';
      return;
    }
    st.k1 = 1; st.k2 = 1; st.tries = 0; st.lock = false;
    wrap.innerHTML =
      '<div class="iw-tag">'+(es?'Diseña el juego de dos giros':'Design the two spin game')+'</div>'+
      '<div class="iw-prog">'+(st.r+1)+' / 3</div>'+
      '<div class="iw-goal">'+(es
        ? 'Arma un juego en el que ganar los dos giros valga exactamente '+fracRaw(target(),64)+'.'
        : 'Build a game in which winning both spins is worth exactly '+fracRaw(target(),64)+'.')+'</div>'+
      '<div class="iw-sub">'+(es
        ? 'Cada ruleta tiene 8 sectores iguales. Mueve las barras para decidir cuántos sectores dorados lleva cada una. Se gana el juego solo si las dos flechas caen en dorado.'
        : 'Each wheel has 8 equal sectors. Move the sliders to decide how many golden sectors each one carries. The game is won only if both arrows land on gold.')+'</div>'+
      '<div class="iw-ctrl"><span class="iw-lbl">'+(es?'Ruleta 1':'Wheel 1')+'</span><input type="range" id="deR1" min="1" max="8" step="1" value="1" oninput="deSet(1,this.value)"><span class="iw-val" id="deV1">1</span></div>'+
      '<div class="iw-ctrl"><span class="iw-lbl">'+(es?'Ruleta 2':'Wheel 2')+'</span><input type="range" id="deR2" min="1" max="8" step="1" value="1" oninput="deSet(2,this.value)"><span class="iw-val" id="deV2">1</span></div>'+
      '<div class="iw-read" id="deRead"></div>'+
      '<button class="rverify-btn" onclick="deCheck()">'+(es?'Verificar':'Check')+'</button>'+
      '<div class="rfb" id="deFb"></div>';
    paint();
  }
  function paint(){
    document.getElementById('deV1').textContent = st.k1;
    document.getElementById('deV2').textContent = st.k2;
    var r1 = document.getElementById('deR1'); if (r1) r1.value = st.k1;
    var r2 = document.getElementById('deR2'); if (r2) r2.value = st.k2;
    var both = st.k1 * st.k2, none = (8-st.k1) * (8-st.k2);
    document.getElementById('deRead').innerHTML =
      (es ? 'Dorado en los dos giros: ' : 'Gold on both spins: ') + fracRaw(both,64) + ' = ' + frac(both,64) +
      '<br>' + (es ? 'Dorado al menos una vez: ' : 'Gold at least once: ') + fracRaw(64-none,64) + ' = ' + frac(64-none,64);
    var fb = document.getElementById('deFb');
    if (fb && !st.lock){
      var t = target();
      if (both === t) fb.textContent = es ? 'Coincide con el encargo. Confirma tu diseño.' : 'It matches the order. Confirm your design.';
      else if (both > t) fb.textContent = es ? 'Tu juego reparte premio con demasiada frecuencia. Quita sectores dorados de alguna ruleta.' : 'Your game pays out too often. Take golden sectors off one of the wheels.';
      else fb.textContent = es ? 'Tu juego reparte premio muy pocas veces. Agrega sectores dorados a alguna ruleta.' : 'Your game pays out too rarely. Add golden sectors to one of the wheels.';
    }
  }
  window.deSet = function(which, v){
    if (st.lock || st.done) return;
    if (which === 1) st.k1 = parseInt(v,10); else st.k2 = parseInt(v,10);
    paint();
  };
  function advance(){ st.r++; if (st.r >= 3) st.done = true; render(); }
  window.deCheck = function(){
    if (st.lock || st.done) return;
    var t = target(), fb = document.getElementById('deFb'), both = st.k1 * st.k2;
    if (both === t){
      st.lock = true;
      fb.innerHTML = '<span style="color:var(--ok);font-weight:700;">✓ '+(es
        ? st.k1+' de 8 por '+st.k2+' de 8 deja '+both+' parejas doradas entre las 64 posibles.'
        : st.k1+' out of 8 times '+st.k2+' out of 8 leaves '+both+' golden pairs among the 64 possible ones.')+'</span>';
      setTimeout(advance, 2000);
      return;
    }
    st.tries++;
    if (st.tries >= 3){
      st.lock = true; st.k1 = SOL[t][0]; st.k2 = SOL[t][1]; paint();
      fb.innerHTML = (es
        ? 'Un diseño que cumple el encargo es '+SOL[t][0]+' y '+SOL[t][1]+' sectores dorados, porque '+SOL[t][0]+' × '+SOL[t][1]+' = '+t+' parejas doradas de 64.'
        : 'One design that meets the order is '+SOL[t][0]+' and '+SOL[t][1]+' golden sectors, because '+SOL[t][0]+' × '+SOL[t][1]+' = '+t+' golden pairs out of 64.');
      setTimeout(advance, 2600);
      return;
    }
    fb.textContent = (both > t)
      ? (es ? 'Todavía no: te pasaste del encargo por '+(both-t)+' parejas doradas.' : 'Not yet: you are over the order by '+(both-t)+' golden pairs.')
      : (es ? 'Todavía no: te faltan '+(t-both)+' parejas doradas para llegar al encargo.' : 'Not yet: you are '+(t-both)+' golden pairs short of the order.');
  };
  render();
}

/* ══════════════════════════════════════════════════════════════════════
   buildLesson — concepto -> manipulativo -> problema(s), sin lotes
   ══════════════════════════════════════════════════════════════════════ */
function buildLesson(rng) {
  problems = [];
  var lb = document.getElementById('lessonBody');
  lb.innerHTML = '';
  var es = (LANG === 'es');
  var C  = es ? 'Concepto ' : 'Concept ';

  /* ── CONCEPTO 1 ──────────────────────────────────────────────── */
  addSection(C + '1',
    es ? 'Cuando no todos los resultados pesan lo mismo' : 'When not every outcome weighs the same',
    (es
    ? '<p>Antes de decidir si un juego es justo hay que responder una pregunta previa: la lista de resultados que se anotan, ¿está formada por resultados que pesan lo mismo? En una ruleta de sectores iguales o en un dado bien hecho la respuesta es sí, y entonces cada resultado se lleva la misma tajada de la certeza. Esos son los resultados equiprobables.</p>'
    + '<p>La trampa aparece cuando lo que se anota no es el resultado bruto del experimento sino algo construido a partir de él, como la suma de dos dados o el color de una ficha. Al lanzar dos dados hay 36 parejas ordenadas y todas ellas sí pesan lo mismo, pero las once sumas que producen no: la suma 7 se arma con seis parejas y la suma 12 con una sola. Contar once resultados y suponer que cada uno vale una onceava parte es el error más común de todo el tema. La regla práctica es siempre la misma: bajar hasta la lista de casos que sí son equiprobables y contar ahí.</p>'
    : '<p>Before deciding whether a game is fair, an earlier question must be answered: is the list of outcomes being written down made of outcomes that weigh the same? On a wheel of equal sectors or on a well made die the answer is yes, and then every outcome takes the same slice of certainty. Those are equiprobable outcomes.</p>'
    + '<p>The trap appears when what is written down is not the raw result of the experiment but something built from it, such as the sum of two dice or the colour of a token. Rolling two dice gives 36 ordered pairs and all of them do weigh the same, but the eleven sums they produce do not: the sum 7 is built from six pairs and the sum 12 from a single one. Counting eleven outcomes and assuming each one is worth an eleventh is the most common mistake in the whole topic. The practical rule is always the same: go down to the list of cases that really are equiprobable and count there.</p>')
    + '<div class="rules-grid">'
    + '<div class="rcard"><div class="rname">'+(es?'Equiprobables':'Equiprobable')+'</div><div class="rform">'+(es?'mismo tamaño':'same size')+'</div><div class="rnote">'+(es?'Sectores iguales, caras de un dado, fichas numeradas.':'Equal sectors, faces of a die, numbered tokens.')+'</div></div>'
    + '<div class="rcard"><div class="rname">'+(es?'No equiprobables':'Not equiprobable')+'</div><div class="rform">'+(es?'distinto tamaño':'different size')+'</div><div class="rnote">'+(es?'Sumas de dos dados, colores de una bolsa desigual.':'Sums of two dice, colours of an uneven bag.')+'</div></div>'
    + '<div class="rcard"><div class="rname">'+(es?'La rejilla':'The grid')+'</div><div class="rform">6 × 6 = 36</div><div class="rnote">'+(es?'Las parejas ordenadas de dos dados sí pesan igual.':'The ordered pairs of two dice do weigh the same.')+'</div></div>'
    + '<div class="rcard"><div class="rname">'+(es?'La lista corta':'The short list')+'</div><div class="rform">'+(es?'11 sumas':'11 sums')+'</div><div class="rnote">'+(es?'Once resultados que no valen lo mismo entre sí.':'Eleven outcomes that are not worth the same as one another.')+'</div></div>'
    + '</div>');

  buildEquiprob(rng);

  /* ── PROBLEMA 1 ── reconocer resultados no equiprobables (conceptual) ── */
  var P1V = [
    { es:{ t:'La lista que engaña',
           q:'De los siguientes experimentos, ¿en cuál los resultados que se anotan NO son igualmente posibles entre sí?',
           o:['Lanzar dos dados y anotar la suma de las dos caras','Girar una ruleta dividida en ocho sectores iguales y anotar el sector','Elegir al azar una de veinte fichas numeradas y anotar el número','Lanzar una moneda equilibrada y anotar la cara que queda arriba'],
           a:'Lanzar dos dados y anotar la suma de las dos caras',
           h:'Para cada experimento pregúntate de cuántas maneras distintas se puede obtener cada resultado de la lista. Si un resultado admite más maneras que otro, la lista deja de ser pareja.',
           e:'Los otros tres experimentos anotan directamente algo que ya venía repartido en partes iguales, así que cada resultado pesa lo mismo. La suma de dos dados no: hay parejas de caras que producen una misma suma y otras sumas que solo se consiguen de una manera, de modo que las once sumas cargan pesos distintos.' },
      en:{ t:'The list that misleads',
           q:'Of the following experiments, in which one are the outcomes being written down NOT equally possible among themselves?',
           o:['Rolling two dice and writing down the sum of the two faces','Spinning a wheel divided into eight equal sectors and writing down the sector','Picking at random one of twenty numbered tokens and writing down the number','Tossing a balanced coin and writing down the face that ends up on top'],
           a:'Rolling two dice and writing down the sum of the two faces',
           h:'For each experiment ask yourself in how many different ways every outcome on the list can be obtained. If one outcome allows more ways than another, the list stops being even.',
           e:'The other three experiments write down directly something that already came shared into equal parts, so every outcome weighs the same. The sum of two dice does not: some pairs of faces produce one same sum while other sums are only reached in one way, so the eleven sums carry different weights.' } },
    { es:{ t:'Siete contra doce',
           q:'Al lanzar dos dados muchas veces, la suma 7 aparece bastante más seguido que la suma 12. ¿Cuál es la razón?',
           o:['Porque seis parejas de caras dan 7 y una sola pareja da 12','Porque el 7 admite dos caras iguales y el 12 no admite esa posibilidad','Porque las once sumas son igualmente posibles y el 7 ocupa el lugar central','Porque en una serie larga cada suma tiende a compensar a sus sumas vecinas'],
           a:'Porque seis parejas de caras dan 7 y una sola pareja da 12',
           h:'Escribe todas las parejas ordenadas que producen cada una de las dos sumas y compara cuántas hay de cada tipo dentro de las 36 posibles.',
           e:'La rejilla de dos dados tiene 36 parejas ordenadas igualmente posibles. Seis de ellas suman 7 y solamente la pareja de dos seises suma 12, así que la primera suma ocupa seis veces más casillas. Ni el lugar que ocupa la suma en la lista ni una supuesta compensación tienen algo que ver.' },
      en:{ t:'Seven against twelve',
           q:'When two dice are rolled many times, the sum 7 shows up considerably more often than the sum 12. What is the reason?',
           o:['Because six pairs of faces give 7 and a single pair gives 12','Because 7 allows two equal faces and 12 does not allow that possibility','Because the eleven sums are equally possible and 7 takes the central place','Because in a long series each sum tends to compensate its neighbouring sums'],
           a:'Because six pairs of faces give 7 and a single pair gives 12',
           h:'Write out all the ordered pairs that produce each of the two sums and compare how many there are of each kind among the 36 possible ones.',
           e:'The two dice grid has 36 equally possible ordered pairs. Six of them add up to 7 and only the pair of two sixes adds up to 12, so the first sum takes six times as many cells. Neither the place the sum takes on the list nor a supposed compensation has anything to do with it.' } },
    { es:{ t:'Tres colores desiguales',
           q:'Una bolsa tiene fichas de tres colores y no hay la misma cantidad de fichas de cada color. Se saca una ficha y se anota su color. ¿Qué se puede afirmar de ese experimento?',
           o:['Que los tres colores no son igualmente posibles, aunque cada ficha sí lo sea','Que los tres colores son igualmente posibles porque cualquiera de ellos puede salir','Que cada ficha deja de ser igualmente posible en cuanto se anota solo el color','Que los tres colores son igualmente posibles porque solo hay tres resultados distintos'],
           a:'Que los tres colores no son igualmente posibles, aunque cada ficha sí lo sea',
           h:'Separa dos listas: la de las fichas que hay dentro de la bolsa y la de los colores que se anotan. Fíjate en cuál de las dos está formada por elementos del mismo peso.',
           e:'Todas las fichas entran al sorteo en las mismas condiciones, así que la lista de fichas sí es pareja. Los colores, en cambio, agrupan cantidades distintas de fichas, y un color con más fichas se lleva una tajada mayor. Que solo haya tres nombres posibles no reparte nada en tercios.' },
      en:{ t:'Three uneven colours',
           q:'A bag holds tokens of three colours and there is not the same number of tokens of each colour. One token is drawn and its colour is written down. What can be stated about that experiment?',
           o:['That the three colours are not equally possible, even though each token is','That the three colours are equally possible because any of them can come out','That each token stops being equally possible as soon as only the colour is written down','That the three colours are equally possible because there are only three different outcomes'],
           a:'That the three colours are not equally possible, even though each token is',
           h:'Separate two lists: the tokens inside the bag and the colours being written down. Look at which of the two is made of items of the same weight.',
           e:'Every token enters the draw under the same conditions, so the list of tokens is even. The colours, on the other hand, group different amounts of tokens, and a colour with more tokens takes a bigger slice. Having only three possible names does not share anything into thirds.' } }
  ];
  var p1 = P1V[Math.floor(rng()*P1V.length)][LANG];
  addProblem(rng, { title:p1.t, q:p1.q, hint:p1.h, exp:p1.e, options:p1.o, correct:p1.a, showWork:false });

  /* ── PROBLEMA 2 ── medir una suma dentro de la rejilla ── */
  var s2 = [5,6,8,9][Math.floor(rng()*4)];
  var c2 = cntSum(s2), u2 = Math.ceil(c2/2);
  var v2 = Math.floor(rng()*2);
  if (v2 === 0){
    addProblem(rng, {
      title: es ? 'El peso de una suma' : 'The weight of one sum',
      q: es ? 'Se lanzan dos dados de seis caras y se anota la suma. ¿Cuál es la probabilidad de que la suma sea '+s2+'?'
            : 'Two six sided dice are rolled and the sum is written down. What is the probability that the sum is '+s2+'?',
      hint: es ? 'Recorre la rejilla de las 36 parejas ordenadas, marca las que dan esa suma y divide esa cuenta entre 36.'
               : 'Go through the grid of the 36 ordered pairs, mark the ones that give that sum and divide that count by 36.',
      exp: es ? 'Las parejas ordenadas que suman '+s2+' son '+c2+' de las 36 igualmente posibles, así que la probabilidad vale '+fracRaw(c2,36)+' = '+frac(c2,36)+'. Repartir la certeza entre las once sumas o contar solo las parejas sin orden lleva a valores distintos y equivocados.'
              : 'The ordered pairs adding up to '+s2+' are '+c2+' out of the 36 equally possible ones, so the probability is '+fracRaw(c2,36)+' = '+frac(c2,36)+'. Sharing certainty among the eleven sums or counting only the unordered pairs leads to different and wrong values.',
      options: [frac(c2,36), frac(1,11), frac(u2,21), frac(c2+1,36)],
      correct: frac(c2,36), showWork:true });
  } else {
    addProblem(rng, {
      title: es ? 'Casillas de la rejilla' : 'Cells of the grid',
      q: es ? 'La rejilla de dos dados de seis caras tiene 36 parejas ordenadas. ¿Cuántas de esas parejas dan como suma '+s2+'?'
            : 'The grid of two six sided dice has 36 ordered pairs. How many of those pairs give '+s2+' as their sum?',
      hint: es ? 'Fija la cara del primer dado en 1, 2, 3 y así hasta 6, y revisa en cada caso si existe una cara del segundo dado que complete la suma pedida.'
               : 'Fix the face of the first die at 1, 2, 3 and so on up to 6, and check in each case whether there is a face of the second die that completes the required sum.',
      exp: es ? 'Recorriendo el primer dado cara por cara aparecen '+c2+' parejas ordenadas que suman '+s2+'. Cada pareja con caras distintas cuenta dos veces, una por cada orden, y por eso la cuenta de parejas sin orden ('+u2+') se queda corta.'
              : 'Going through the first die face by face gives '+c2+' ordered pairs adding up to '+s2+'. Every pair with different faces counts twice, once for each order, and that is why the count of unordered pairs ('+u2+') falls short.',
      options: [String(c2), String(c2+1), String(c2-1), String(u2)],
      correct: String(c2), showWork:true });
  }

  /* ── CONCEPTO 2 ──────────────────────────────────────────────── */
  addSection(C + '2',
    es ? 'Un juego justo parte la certeza por la mitad' : 'A fair game splits certainty down the middle',
    (es
    ? '<p>Un juego entre dos personas que reparten el mismo premio es justo cuando las dos tienen la misma probabilidad de ganar. Como los dos conjuntos de resultados ganadores no pueden ocurrir al mismo tiempo, son mutuamente excluyentes, y para medir la probabilidad de cada jugador basta con sumar las casillas favorables antes de dividir entre el total. Además, ganar y no ganar son eventos complementarios: sus probabilidades cierran la certeza completa, así que en un juego justo cada jugador se lleva exactamente la mitad.</p>'
    + '<p>Lo delicado es que repartir la misma cantidad de resultados no reparte la misma probabilidad. Si Ana se queda con cuatro sumas de dos dados y Beto con siete, el juego puede ser perfectamente justo, porque lo que se reparte son las 36 casillas de la rejilla y no los once nombres de las sumas. Por eso conviene decidir siempre con la lista de resultados equiprobables enfrente.</p>'
    : '<p>A game between two people sharing the same prize is fair when both have the same probability of winning. Since the two sets of winning outcomes cannot happen at the same time, they are mutually exclusive, and to measure each player probability it is enough to add the favourable cells before dividing by the total. Besides, winning and not winning are complementary events: their probabilities close up the whole certainty, so in a fair game each player takes exactly half.</p>'
    + '<p>The delicate part is that sharing the same amount of outcomes does not share the same probability. If Ana keeps four sums of two dice and Beto seven, the game may be perfectly fair, because what is being shared are the 36 cells of the grid and not the eleven names of the sums. That is why the decision should always be made with the list of equiprobable outcomes in front of you.</p>')
    + '<div class="rules-grid">'
    + '<div class="rcard"><div class="rname">'+(es?'Mutuamente excluyentes':'Mutually exclusive')+'</div><div class="rform">'+(es?'se suman los casos':'cases are added')+'</div><div class="rnote">'+(es?'Dos sumas distintas nunca salen en el mismo lanzamiento.':'Two different sums never come up in the same roll.')+'</div></div>'
    + '<div class="rcard"><div class="rname">'+(es?'Complementarios':'Complementary')+'</div><div class="rform">'+(es?'ganar y no ganar':'win and not win')+'</div><div class="rnote">'+(es?'Entre los dos cubren toda la certeza.':'Between them they cover the whole certainty.')+'</div></div>'
    + '<div class="rcard"><div class="rname">'+(es?'Juego justo':'Fair game')+'</div><div class="rform">18 / 36</div><div class="rnote">'+(es?'Mitad y mitad de las casillas, no de los nombres.':'Half and half of the cells, not of the names.')+'</div></div>'
    + '<div class="rcard"><div class="rname">'+(es?'Bolsa pareja':'Even bag')+'</div><div class="rform">'+(es?'mismos colores':'equal colours')+'</div><div class="rnote">'+(es?'Se agregan o se retiran fichas hasta emparejar.':'Tokens are added or removed until the counts match.')+'</div></div>'
    + '</div>');

  buildReparto(rng);

  /* ── PROBLEMA 3 ── regla de la suma con eventos mutuamente excluyentes ── */
  var PAIRS = [[5,9],[6,8],[4,10],[6,9],[5,8]];
  var pr = PAIRS[Math.floor(rng()*PAIRS.length)];
  var ca = cntSum(pr[0]), cb = cntSum(pr[1]), cmax = Math.max(ca,cb);
  var v3 = Math.floor(rng()*2);
  if (v3 === 0){
    addProblem(rng, {
      title: es ? 'Dos sumas para Ana' : 'Two sums for Ana',
      q: es ? 'En un juego se lanzan dos dados. Ana gana si la suma es '+pr[0]+' o si la suma es '+pr[1]+', y en cualquier otro caso gana Beto. ¿Cuál es la probabilidad de que gane Ana?'
            : 'In a game two dice are rolled. Ana wins if the sum is '+pr[0]+' or if the sum is '+pr[1]+', and in any other case Beto wins. What is the probability that Ana wins?',
      hint: es ? 'Las dos sumas no pueden salir en el mismo lanzamiento, así que cuenta por separado las casillas de cada una, súmalas y divide ese total entre las 36 parejas de la rejilla.'
               : 'The two sums cannot come up in the same roll, so count the cells of each one separately, add them and divide that total by the 36 pairs of the grid.',
      exp: es ? 'La suma '+pr[0]+' ocupa '+ca+' casillas y la suma '+pr[1]+' ocupa '+cb+', y como nunca coinciden en un mismo lanzamiento las casillas se suman: '+ca+' + '+cb+' = '+(ca+cb)+' de 36, es decir '+frac(ca+cb,36)+'. Multiplicar las dos cuentas mide otra cosa, y quedarse con una sola suma deja fuera la mitad del evento de Ana.'
              : 'The sum '+pr[0]+' takes '+ca+' cells and the sum '+pr[1]+' takes '+cb+', and since they never coincide in one same roll the cells are added: '+ca+' + '+cb+' = '+(ca+cb)+' out of 36, that is '+frac(ca+cb,36)+'. Multiplying the two counts measures something else, and keeping only one sum leaves out half of the event of Ana.',
      options: [frac(ca+cb,36), frac(2,11), frac(ca*cb,36), frac(cmax,36)],
      correct: frac(ca+cb,36), showWork:true });
  } else {
    addProblem(rng, {
      title: es ? 'Las casillas de Ana' : 'The cells of Ana',
      q: es ? 'En un juego se lanzan dos dados y Ana gana si la suma es '+pr[0]+' o si la suma es '+pr[1]+'. ¿Cuántas de las 36 parejas ordenadas de la rejilla hacen ganar a Ana?'
            : 'In a game two dice are rolled and Ana wins if the sum is '+pr[0]+' or if the sum is '+pr[1]+'. How many of the 36 ordered pairs of the grid make Ana win?',
      hint: es ? 'Cuenta primero las parejas de una suma y luego las de la otra. Como ninguna pareja puede pertenecer a las dos, las dos cuentas se juntan sumando.'
               : 'Count first the pairs of one sum and then those of the other. Since no pair can belong to both, the two counts are put together by adding.',
      exp: es ? 'La suma '+pr[0]+' aporta '+ca+' parejas y la suma '+pr[1]+' aporta '+cb+'. Los dos eventos son mutuamente excluyentes, así que Ana gana en '+ca+' + '+cb+' = '+(ca+cb)+' parejas, y las '+(36-(ca+cb))+' restantes hacen ganar a Beto.'
              : 'The sum '+pr[0]+' contributes '+ca+' pairs and the sum '+pr[1]+' contributes '+cb+'. The two events are mutually exclusive, so Ana wins in '+ca+' + '+cb+' = '+(ca+cb)+' pairs, and the remaining '+(36-(ca+cb))+' make Beto win.',
      options: [String(ca+cb), String(ca*cb), String(cmax), String(36-(ca+cb))],
      correct: String(ca+cb), showWork:true });
  }

  /* ── PROBLEMA 4 ── emparejar una bolsa desigual ── */
  var BAGS = [{r:9,a:5},{r:10,a:6},{r:12,a:7},{r:8,a:3},{r:11,a:4}];
  var bg = BAGS[Math.floor(rng()*BAGS.length)];
  var dif = bg.r - bg.a;
  var v4 = Math.floor(rng()*2);
  if (v4 === 0){
    addProblem(rng, {
      title: es ? 'Emparejar la bolsa' : 'Evening out the bag',
      q: es ? 'Una bolsa tiene '+bg.r+' fichas rojas y '+bg.a+' fichas azules. Se saca una ficha al azar: Ana gana si sale roja y Beto gana si sale azul. ¿Cuántas fichas azules hay que agregar a la bolsa para que el juego sea justo?'
            : 'A bag holds '+bg.r+' red tokens and '+bg.a+' blue tokens. One token is drawn at random: Ana wins if it is red and Beto wins if it is blue. How many blue tokens must be added to the bag so that the game is fair?',
      hint: es ? 'El juego se empareja cuando las dos cantidades de fichas coinciden. Plantea cuántas azules faltan para alcanzar la cantidad de rojas y resuelve esa diferencia.'
               : 'The game evens out when the two token counts match. Set up how many blue ones are missing to reach the red count and work out that difference.',
      exp: es ? 'Para que las dos probabilidades valgan '+frac(1,2)+' hacen falta tantas azules como rojas, es decir '+bg.r+'. Como ya hay '+bg.a+', se agregan '+bg.r+' menos '+bg.a+' = '+dif+' fichas azules, y la bolsa termina con '+bg.r+' de cada color.'
              : 'For both probabilities to be worth '+frac(1,2)+' there must be as many blue tokens as red ones, that is '+bg.r+'. Since there are already '+bg.a+', you add '+bg.r+' minus '+bg.a+' = '+dif+' blue tokens, and the bag ends up with '+bg.r+' of each colour.',
      options: [dif+(es?' fichas azules':' blue tokens'), (bg.r+bg.a)+(es?' fichas azules':' blue tokens'), bg.r+(es?' fichas azules':' blue tokens'), (2*dif)+(es?' fichas azules':' blue tokens')],
      correct: dif+(es?' fichas azules':' blue tokens'), showWork:true });
  } else {
    addProblem(rng, {
      title: es ? 'Retirar del color abundante' : 'Removing from the abundant colour',
      q: es ? 'Una bolsa tiene '+bg.r+' fichas rojas y '+bg.a+' fichas azules. Se saca una ficha al azar: Ana gana si sale roja y Beto gana si sale azul. Sin agregar nada, ¿cuántas fichas rojas hay que retirar para que el juego sea justo?'
            : 'A bag holds '+bg.r+' red tokens and '+bg.a+' blue tokens. One token is drawn at random: Ana wins if it is red and Beto wins if it is blue. Without adding anything, how many red tokens must be removed so that the game is fair?',
      hint: es ? 'El juego se empareja cuando las dos cantidades de fichas coinciden. Plantea cuántas rojas sobran respecto de las azules y resuelve esa diferencia.'
               : 'The game evens out when the two token counts match. Set up how many red ones are in excess compared with the blue ones and work out that difference.',
      exp: es ? 'Para que las dos probabilidades valgan '+frac(1,2)+' deben quedar tantas rojas como azules, es decir '+bg.a+'. Como hay '+bg.r+', se retiran '+bg.r+' menos '+bg.a+' = '+dif+' fichas rojas, y la bolsa termina con '+bg.a+' de cada color.'
              : 'For both probabilities to be worth '+frac(1,2)+' there must be as many red tokens left as blue ones, that is '+bg.a+'. Since there are '+bg.r+', you remove '+bg.r+' minus '+bg.a+' = '+dif+' red tokens, and the bag ends up with '+bg.a+' of each colour.',
      options: [dif+(es?' fichas rojas':' red tokens'), (bg.r+bg.a)+(es?' fichas rojas':' red tokens'), bg.r+(es?' fichas rojas':' red tokens'), (2*dif)+(es?' fichas rojas':' red tokens')],
      correct: dif+(es?' fichas rojas':' red tokens'), showWork:true });
  }

  /* ── CONCEPTO 3 ──────────────────────────────────────────────── */
  addSection(C + '3',
    es ? 'Premios desiguales para posibilidades desiguales' : 'Uneven prizes for uneven chances',
    (es
    ? '<p>Hasta aquí la justicia se buscó igualando las probabilidades, pero muchos juegos reales no lo permiten: una bolsa tiene más fichas de un color, una ruleta tiene un sector más ancho. En esos casos todavía queda una salida. Si el resultado poco frecuente paga más, la ventaja de uno se compensa con el tamaño del premio del otro, y a la larga ninguno de los dos sale ganando.</p>'
    + '<p>La manera de comprobarlo es mirar una tanda larga de partidas en lugar de una sola. Si de cada 12 partidas se esperan 8 rojas y 4 azules, se comparan los puntos acumulados por cada jugador en esas 12 partidas. Cuando los dos montones quedan del mismo tamaño el juego es justo, y cuando uno queda más alto la diferencia dice exactamente cuánto se lleva de más quien tiene la ventaja.</p>'
    : '<p>So far fairness was reached by evening out the probabilities, but many real games do not allow that: a bag has more tokens of one colour, a wheel has a wider sector. In those cases there is still a way out. If the infrequent outcome pays more, the advantage of one player is compensated by the size of the prize of the other, and in the long run neither of them comes out ahead.</p>'
    + '<p>The way to check it is to look at a long run of games instead of a single one. If out of every 12 games 8 red and 4 blue are expected, the points piled up by each player over those 12 games are compared. When both piles end up the same size the game is fair, and when one is taller the difference says exactly how much extra the player with the advantage takes.</p>')
    + '<div class="rules-grid">'
    + '<div class="rcard"><div class="rname">'+(es?'La tanda larga':'The long run')+'</div><div class="rform">'+(es?'partidas esperadas':'expected games')+'</div><div class="rnote">'+(es?'De cada 12 partidas, 8 rojas y 4 azules.':'Out of every 12 games, 8 red and 4 blue.')+'</div></div>'
    + '<div class="rcard"><div class="rname">'+(es?'Montón de puntos':'Pile of points')+'</div><div class="rform">'+(es?'veces × premio':'times × prize')+'</div><div class="rnote">'+(es?'Cada jugador acumula lo suyo en esa tanda.':'Each player piles up their own over that run.')+'</div></div>'
    + '<div class="rcard"><div class="rname">'+(es?'Juego justo':'Fair game')+'</div><div class="rform">'+(es?'montones iguales':'equal piles')+'</div><div class="rnote">'+(es?'El color raro paga más y empareja.':'The rare colour pays more and evens things out.')+'</div></div>'
    + '<div class="rcard"><div class="rname">'+(es?'La ventaja':'The advantage')+'</div><div class="rform">'+(es?'diferencia de montones':'gap between piles')+'</div><div class="rnote">'+(es?'Dice cuántos puntos de más se lleva alguien.':'It says how many extra points somebody takes.')+'</div></div>'
    + '</div>');

  buildPremio(rng);

  /* ── PROBLEMA 5 ── fijar el premio justo ── */
  var GAMES = [{r:8,a:4,pA:5},{r:9,a:3,pA:4},{r:10,a:5,pA:6},{r:6,a:4,pA:6},{r:8,a:6,pA:9},{r:12,a:4,pA:3}];
  var gm = GAMES[Math.floor(rng()*GAMES.length)];
  var nTot = gm.r + gm.a, fairB = gm.r * gm.pA / gm.a;
  addProblem(rng, {
    title: es ? 'El premio que empareja' : 'The prize that evens out',
    q: es ? 'Una bolsa tiene '+gm.r+' fichas rojas y '+gm.a+' fichas azules. Se saca una ficha, se anota el color y se devuelve. Ana gana '+gm.pA+' puntos cada vez que sale roja y Beto gana cierto número de puntos cada vez que sale azul. ¿Cuántos puntos debe ganar Beto para que el juego sea justo?'
          : 'A bag holds '+gm.r+' red tokens and '+gm.a+' blue tokens. One token is drawn, its colour is written down and it is put back. Ana wins '+gm.pA+' points every time red comes out and Beto wins a certain number of points every time blue comes out. How many points must Beto win so that the game is fair?',
    hint: es ? 'Piensa en una tanda de '+nTot+' partidas, en la que se esperan '+gm.r+' rojas y '+gm.a+' azules. Calcula el montón de puntos de Ana en esa tanda e iguala el de Beto a esa misma cantidad para despejar su premio.'
             : 'Think of a run of '+nTot+' games, in which '+gm.r+' red and '+gm.a+' blue are expected. Work out the pile of points of Ana over that run and set the pile of Beto equal to that same amount to clear his prize.',
    exp: es ? 'En una tanda de '+nTot+' partidas Ana acumula '+gm.r+' × '+gm.pA+' = '+(gm.r*gm.pA)+' puntos. Beto solo cobra en '+gm.a+' de esas partidas, así que su premio debe cumplir '+gm.a+' × premio = '+(gm.r*gm.pA)+', de donde el premio vale '+fairB+' puntos. Usar el total de fichas en lugar de las rojas, o pagar lo mismo a los dos, deja el juego desequilibrado.'
            : 'Over a run of '+nTot+' games Ana piles up '+gm.r+' × '+gm.pA+' = '+(gm.r*gm.pA)+' points. Beto only collects in '+gm.a+' of those games, so his prize must satisfy '+gm.a+' × prize = '+(gm.r*gm.pA)+', which gives a prize of '+fairB+' points. Using the total of tokens instead of the red ones, or paying both the same, leaves the game unbalanced.',
    options: [fairB+(es?' puntos':' points'), gm.pA+(es?' puntos':' points'), (gm.pA+(gm.r-gm.a))+(es?' puntos':' points'), ((gm.r+gm.a)*gm.pA/gm.a)+(es?' puntos':' points')],
    correct: fairB+(es?' puntos':' points'), showWork:true });

  /* ── PROBLEMA 6 ── medir la ventaja de un juego desequilibrado ── */
  var dd = 2 + Math.floor(rng()*2);
  var pB6 = fairB - dd;
  var totA6 = gm.r * gm.pA, totB6 = gm.a * pB6, vent = totA6 - totB6;
  addProblem(rng, {
    title: es ? 'De cuánto es la ventaja' : 'How big the advantage is',
    q: es ? 'En la misma bolsa de '+gm.r+' fichas rojas y '+gm.a+' azules, con devolución después de cada extracción, Ana gana '+gm.pA+' puntos por cada roja y Beto gana '+pB6+' puntos por cada azul. En una tanda de '+nTot+' partidas, con '+gm.r+' rojas y '+gm.a+' azules esperadas, ¿cuántos puntos acumula Ana por encima de Beto?'
          : 'In the same bag of '+gm.r+' red tokens and '+gm.a+' blue ones, putting each token back after the draw, Ana wins '+gm.pA+' points per red one and Beto wins '+pB6+' points per blue one. Over a run of '+nTot+' games, with '+gm.r+' red and '+gm.a+' blue expected, how many points does Ana pile up above Beto?',
    hint: es ? 'Calcula el montón de cada jugador multiplicando las veces que cobra por lo que cobra cada vez, y después resta el montón menor del mayor.'
             : 'Work out the pile of each player by multiplying the times they collect by what they collect each time, and then subtract the smaller pile from the bigger one.',
    exp: es ? 'Ana acumula '+gm.r+' × '+gm.pA+' = '+totA6+' puntos y Beto acumula '+gm.a+' × '+pB6+' = '+totB6+' puntos, así que la ventaja es '+totA6+' menos '+totB6+' = '+vent+' puntos en esa tanda. Sumar los dos montones o quedarse con el montón completo de uno solo de los jugadores responde a otra pregunta.'
            : 'Ana piles up '+gm.r+' × '+gm.pA+' = '+totA6+' points and Beto piles up '+gm.a+' × '+pB6+' = '+totB6+' points, so the advantage is '+totA6+' minus '+totB6+' = '+vent+' points over that run. Adding the two piles or keeping the whole pile of just one of the players answers a different question.',
    options: [vent+(es?' puntos':' points'), totA6+(es?' puntos':' points'), (totA6+totB6)+(es?' puntos':' points'), totB6+(es?' puntos':' points')],
    correct: vent+(es?' puntos':' points'), showWork:true });

  /* ── CONCEPTO 4 ──────────────────────────────────────────────── */
  addSection(C + '4',
    es ? 'Cuando ganar exige pasar dos filtros' : 'When winning means passing two filters',
    (es
    ? '<p>Los juegos de feria casi nunca se resuelven de un solo golpe: hay que acertar en una ruleta y además en un dado, o repetir el intento varias veces. Cuando las dos etapas son independientes, es decir cuando lo que pasa en la primera no cambia las posibilidades de la segunda, la lista de resultados equiprobables ya no tiene 8 casos sino 8 por 6, y las parejas ganadoras se cuentan multiplicando las opciones ganadoras de cada etapa.</p>'
    + '<p>Ese producto explica por qué exigir dos condiciones a la vez siempre estrecha el premio: la rama ganadora cabe dentro de cada etapa por separado. Y para preguntas del tipo ganar al menos una vez conviene dar la vuelta y medir el evento complementario, el de fallar en todos los intentos, que sí es una sola rama fácil de contar. Lo que sobra de la certeza es la respuesta buscada.</p>'
    : '<p>Fairground games are almost never settled in one stroke: you have to hit a wheel and also a die, or repeat the attempt several times. When the two stages are independent, meaning that what happens in the first one does not change the chances of the second, the list of equiprobable outcomes no longer holds 8 cases but 8 times 6, and the winning pairs are counted by multiplying the winning options of each stage.</p>'
    + '<p>That product explains why demanding two conditions at once always narrows the prize: the winning branch fits inside each stage on its own. And for questions of the kind winning at least once it pays to turn things around and measure the complementary event, failing on every attempt, which is a single branch that is easy to count. What is left over from certainty is the answer being looked for.</p>')
    + '<div class="rules-grid">'
    + '<div class="rcard"><div class="rname">'+(es?'Dos etapas':'Two stages')+'</div><div class="rform">8 × 6 = 48</div><div class="rnote">'+(es?'Las parejas de la lista completa se multiplican.':'The pairs of the complete list are multiplied.')+'</div></div>'
    + '<div class="rcard"><div class="rname">'+(es?'Rama ganadora':'Winning branch')+'</div><div class="rform">'+(es?'ganadoras × ganadoras':'winners × winners')+'</div><div class="rnote">'+(es?'Se cuentan las parejas que cumplen las dos cosas.':'The pairs meeting both conditions are counted.')+'</div></div>'
    + '<div class="rcard"><div class="rname">'+(es?'Complemento':'Complement')+'</div><div class="rform">'+(es?'lo que sobra':'what is left')+'</div><div class="rnote">'+(es?'Al menos una vez se mide por el lado de fallar siempre.':'At least once is measured through failing every time.')+'</div></div>'
    + '<div class="rcard"><div class="rname">'+(es?'Efecto embudo':'Funnel effect')+'</div><div class="rform">'+(es?'cada filtro estrecha':'each filter narrows')+'</div><div class="rnote">'+(es?'Más etapas dejan una rama más delgada.':'More stages leave a thinner branch.')+'</div></div>'
    + '</div>');

  buildDosEtapas(rng);

  /* ── PROBLEMA 7 ── regla del producto en un juego de feria ── */
  var KM = [[3,2],[4,2],[5,2],[3,3]];
  var km = KM[Math.floor(rng()*KM.length)];
  var k7 = km[0], m7 = km[1], win7 = k7*m7;
  var v7 = Math.floor(rng()*2);
  if (v7 === 0){
    addProblem(rng, {
      title: es ? 'Los dos filtros del puesto' : 'The two filters of the stall',
      q: es ? 'Un puesto de feria pide dos cosas para entregar el premio: la flecha de una ruleta de 8 sectores iguales debe caer en uno de los '+k7+' sectores dorados y, además, un dado de seis caras debe mostrar un número menor o igual que '+m7+'. Las dos etapas son independientes. ¿Cuál es la probabilidad de ganar el premio?'
            : 'A fairground stall asks for two things before handing over the prize: the arrow of a wheel with 8 equal sectors must land on one of the '+k7+' golden sectors and, on top of that, a six sided die must show a number less than or equal to '+m7+'. The two stages are independent. What is the probability of winning the prize?',
      hint: es ? 'Arma la lista completa de resultados equiprobables combinando cada sector con cada cara del dado, cuenta cuántas de esas combinaciones cumplen las dos condiciones y compara esa cuenta con el total.'
               : 'Build the complete list of equiprobable outcomes by combining every sector with every face of the die, count how many of those combinations meet both conditions and compare that count with the total.',
      exp: es ? 'La lista completa tiene 8 × 6 = 48 combinaciones igualmente posibles y las ganadoras son '+k7+' × '+m7+' = '+win7+', así que la probabilidad vale '+fracRaw(win7,48)+' = '+frac(win7,48)+'. Sumar las probabilidades de las dos etapas mide ganar en alguna de ellas, y quedarse con una sola etapa ignora el otro filtro.'
              : 'The complete list has 8 × 6 = 48 equally possible combinations and the winning ones are '+k7+' × '+m7+' = '+win7+', so the probability is '+fracRaw(win7,48)+' = '+frac(win7,48)+'. Adding the probabilities of the two stages measures winning in one of them, and keeping only one stage ignores the other filter.',
      options: [frac(win7,48), frac(3*k7+4*m7,24), frac(k7,8), frac(m7,6)],
      correct: frac(win7,48), showWork:true });
  } else {
    addProblem(rng, {
      title: es ? 'Salir sin premio' : 'Leaving with no prize',
      q: es ? 'Un puesto de feria entrega premio solo si la flecha de una ruleta de 8 sectores iguales cae en uno de los '+k7+' sectores dorados y además un dado de seis caras muestra un número menor o igual que '+m7+'. Las dos etapas son independientes. ¿Cuál es la probabilidad de quedarse sin premio?'
            : 'A fairground stall hands over a prize only if the arrow of a wheel with 8 equal sectors lands on one of the '+k7+' golden sectors and a six sided die also shows a number less than or equal to '+m7+'. The two stages are independent. What is the probability of leaving with no prize?',
      hint: es ? 'Quedarse sin premio y ganar son eventos complementarios. Mide primero el que resulta más fácil de contar dentro de la lista de 48 combinaciones y aprovecha que entre los dos cierran la certeza completa.'
               : 'Leaving with no prize and winning are complementary events. Measure first the one that is easier to count inside the list of 48 combinations and use the fact that between them they close up the whole certainty.',
      exp: es ? 'Las combinaciones ganadoras son '+k7+' × '+m7+' = '+win7+' de 48, así que las que no dan premio son 48 menos '+win7+' = '+(48-win7)+', es decir '+frac(48-win7,48)+'. Fallar en las dos etapas a la vez es apenas una parte de todas las formas de perder, porque también se pierde acertando una sola.'
              : 'The winning combinations are '+k7+' × '+m7+' = '+win7+' out of 48, so the ones giving no prize are 48 minus '+win7+' = '+(48-win7)+', that is '+frac(48-win7,48)+'. Failing both stages at once is only part of all the ways of losing, because you also lose by hitting just one of them.',
      options: [frac(48-win7,48), frac(win7,48), frac((8-k7)*(6-m7),48), frac(8-k7,8)],
      correct: frac(48-win7,48), showWork:true });
  }

  /* ── PROBLEMA 8 ── al menos una vez, por el complemento ── */
  var k8 = [2,3,5,6][Math.floor(rng()*4)];
  var miss8 = (8-k8)*(8-k8);
  var v8 = Math.floor(rng()*2);
  if (v8 === 0){
    addProblem(rng, {
      title: es ? 'Dos oportunidades de ganar' : 'Two chances to win',
      q: es ? 'Un juego permite girar dos veces una ruleta de 8 sectores iguales, de los cuales '+k8+' son dorados. Los dos giros son independientes y se gana con obtener dorado al menos una vez. ¿Cuál es la probabilidad de ganar?'
            : 'A game allows two spins of a wheel with 8 equal sectors, of which '+k8+' are golden. The two spins are independent and winning means getting gold at least once. What is the probability of winning?',
      hint: es ? 'Ganar al menos una vez agrupa varios casos, así que conviene medir primero el evento complementario, el de fallar en los dos giros, y restarlo de la certeza completa.'
               : 'Winning at least once groups several cases, so it is better to measure first the complementary event, failing on both spins, and subtract it from the whole certainty.',
      exp: es ? 'Fallar en un giro deja '+(8-k8)+' sectores de 8, y como los giros son independientes fallar en los dos ocupa '+(8-k8)+' × '+(8-k8)+' = '+miss8+' parejas de las 64 posibles. Ganar al menos una vez es lo que sobra: 64 menos '+miss8+' = '+(64-miss8)+', es decir '+frac(64-miss8,64)+'. Multiplicar los aciertos mide ganar en los dos giros, que es un evento mucho más estrecho.'
              : 'Failing on one spin leaves '+(8-k8)+' sectors out of 8, and since the spins are independent failing on both takes '+(8-k8)+' × '+(8-k8)+' = '+miss8+' pairs out of the 64 possible ones. Winning at least once is what is left over: 64 minus '+miss8+' = '+(64-miss8)+', that is '+frac(64-miss8,64)+'. Multiplying the hits measures winning on both spins, which is a far narrower event.',
      options: [frac(64-miss8,64), frac(k8,8), frac(k8*k8,64), frac(miss8,64)],
      correct: frac(64-miss8,64), showWork:true });
  } else {
    addProblem(rng, {
      title: es ? 'Irse con las manos vacías' : 'Going home empty handed',
      q: es ? 'Un juego permite girar dos veces una ruleta de 8 sectores iguales, de los cuales '+k8+' son dorados. Los dos giros son independientes. ¿Cuál es la probabilidad de fallar en los dos giros?'
            : 'A game allows two spins of a wheel with 8 equal sectors, of which '+k8+' are golden. The two spins are independent. What is the probability of failing on both spins?',
      hint: es ? 'Cuenta cuántos sectores hacen fallar un giro y arma la lista de las 64 parejas de sectores que producen los dos giros seguidos.'
               : 'Count how many sectors make one spin fail and build the list of the 64 pairs of sectors produced by the two spins in a row.',
      exp: es ? 'Cada giro falla con '+(8-k8)+' de los 8 sectores, y al ser independientes las parejas que fallan dos veces son '+(8-k8)+' × '+(8-k8)+' = '+miss8+' de 64, es decir '+frac(miss8,64)+'. Las '+(64-miss8)+' parejas restantes corresponden a ganar al menos una vez, que es el evento complementario.'
              : 'Each spin fails with '+(8-k8)+' of the 8 sectors, and being independent the pairs that fail twice are '+(8-k8)+' × '+(8-k8)+' = '+miss8+' out of 64, that is '+frac(miss8,64)+'. The remaining '+(64-miss8)+' pairs correspond to winning at least once, which is the complementary event.',
      options: [frac(miss8,64), frac(64-miss8,64), frac(k8*k8,64), frac(8-k8,8)],
      correct: frac(miss8,64), showWork:true });
  }

  /* ── PROBLEMA 9 ── condiciones de un juego justo (conceptual) ── */
  var P9V = [
    { es:{ t:'La condición que decide',
           q:'Dos jugadores compiten por un mismo premio en un juego de azar. ¿Qué condición basta para afirmar que ese juego es justo?',
           o:['Que la certeza quede repartida en dos mitades iguales entre los dos jugadores','Que cada jugador tenga asignada la misma cantidad de resultados ganadores','Que ningún jugador pueda ganar dos partidas seguidas dentro de la misma serie','Que los dos jugadores tengan al menos un resultado ganador entre los posibles'],
           a:'Que la certeza quede repartida en dos mitades iguales entre los dos jugadores',
           h:'Recuerda que ganar y no ganar son eventos complementarios, así que las dos probabilidades cierran la certeza completa. Pregúntate entonces cuánto le toca a cada quien cuando nadie tiene ventaja.',
           e:'Si el premio es el mismo para los dos, la justicia depende únicamente de que las dos probabilidades de ganar coincidan, y como entre las dos cubren toda la certeza cada una vale la mitad. Repartir la misma cantidad de nombres de resultados no garantiza nada cuando esos resultados no pesan lo mismo.' },
      en:{ t:'The condition that decides',
           q:'Two players compete for one same prize in a game of chance. Which condition is enough to state that the game is fair?',
           o:['That certainty ends up shared into two equal halves between the two players','That each player is assigned the same amount of winning outcomes','That no player can win two games in a row inside the same series','That both players have at least one winning outcome among the possible ones'],
           a:'That certainty ends up shared into two equal halves between the two players',
           h:'Remember that winning and not winning are complementary events, so the two probabilities close up the whole certainty. Then ask yourself how much each one gets when nobody has an advantage.',
           e:'If the prize is the same for both, fairness depends only on the two probabilities of winning matching, and since between them they cover the whole certainty each one is worth half. Sharing the same amount of outcome names guarantees nothing when those outcomes do not weigh the same.' } },
    { es:{ t:'Cuatro sumas contra siete',
           q:'En un juego con dos dados, Ana gana con cuatro de las once sumas posibles y Beto con las siete restantes. ¿Es posible que ese juego sea justo?',
           o:['Sí, si las cuatro sumas de Ana ocupan la mitad de las casillas de la rejilla','No, porque Beto tiene asignadas casi el doble de sumas que Ana','Sí, siempre que las cuatro sumas de Ana sean las más pequeñas de la lista','No, porque un juego justo exige repartir las once sumas en partes iguales'],
           a:'Sí, si las cuatro sumas de Ana ocupan la mitad de las casillas de la rejilla',
           h:'Compara la lista de las once sumas con la lista de las 36 parejas ordenadas y decide en cuál de las dos hay que hacer el reparto para medir bien.',
           e:'Lo que se reparte no son los nombres de las sumas sino las 36 parejas ordenadas, que sí pesan lo mismo entre sí. Unas cuantas sumas centrales concentran muchas casillas, de modo que cuatro sumas bien elegidas pueden alcanzar exactamente 18 casillas y dejar el juego parejo.' },
      en:{ t:'Four sums against seven',
           q:'In a game with two dice, Ana wins with four of the eleven possible sums and Beto with the remaining seven. Is it possible for that game to be fair?',
           o:['Yes, if the four sums of Ana take up half the cells of the grid','No, because Beto is assigned almost twice as many sums as Ana','Yes, as long as the four sums of Ana are the smallest ones on the list','No, because a fair game requires sharing the eleven sums into equal parts'],
           a:'Yes, if the four sums of Ana take up half the cells of the grid',
           h:'Compare the list of the eleven sums with the list of the 36 ordered pairs and decide in which of the two the sharing must be done in order to measure correctly.',
           e:'What is being shared are not the names of the sums but the 36 ordered pairs, which do weigh the same as one another. A few central sums concentrate many cells, so four well chosen sums can reach exactly 18 cells and leave the game level.' } },
    { es:{ t:'Un juego con premios distintos',
           q:'En un juego de azar, un jugador gana bastante más seguido que el otro. ¿Qué tendría que ocurrir para que el juego siga siendo justo?',
           o:['Que el jugador que gana pocas veces reciba un premio mayor, en la proporción que empareje los puntos acumulados','Que el jugador que gana más seguido ceda algunos de sus resultados ganadores al otro jugador','Que los dos jugadores reciban el mismo premio, porque la ventaja se corrige sola en una serie larga','Que el jugador que gana pocas veces reciba un premio mayor, sin importar cuál sea la diferencia de premios'],
           a:'Que el jugador que gana pocas veces reciba un premio mayor, en la proporción que empareje los puntos acumulados',
           h:'Imagina una tanda larga de partidas y calcula los puntos que acumularía cada jugador multiplicando las veces que cobra por lo que cobra cada vez.',
           e:'La justicia se recupera cuando los dos montones de puntos de una tanda larga quedan del mismo tamaño, y eso ocurre con una proporción precisa entre los premios. Un premio mayor elegido al azar puede quedarse corto o pasarse, y las diferencias no se corrigen solas al repetir el juego.' },
      en:{ t:'A game with different prizes',
           q:'In a game of chance, one player wins considerably more often than the other. What would have to happen for the game to remain fair?',
           o:['That the player who wins seldom receives a bigger prize, in the proportion that evens out the piled up points','That the player who wins more often gives up some of their winning outcomes to the other player','That both players receive the same prize, because the advantage corrects itself over a long series','That the player who wins seldom receives a bigger prize, no matter what the difference between prizes is'],
           a:'That the player who wins seldom receives a bigger prize, in the proportion that evens out the piled up points',
           h:'Picture a long run of games and work out the points each player would pile up by multiplying the times they collect by what they collect each time.',
           e:'Fairness is recovered when the two piles of points of a long run end up the same size, and that happens with one precise proportion between the prizes. A bigger prize chosen at random may fall short or overshoot, and the gaps do not correct themselves by repeating the game.' } }
  ];
  var p9 = P9V[Math.floor(rng()*P9V.length)][LANG];
  addProblem(rng, { title:p9.t, q:p9.q, hint:p9.h, exp:p9.e, options:p9.o, correct:p9.a, showWork:false });

  /* ── PROBLEMA 10 ── decidir si una regla parte la rejilla por mitad ── */
  var P10V = [
    { es:{ t:'Par contra impar en el producto',
           q:'Se lanzan dos dados de seis caras y se multiplica el resultado de las dos caras. Ana gana si el producto es par y Beto gana si el producto es impar. ¿Cuál es la probabilidad de que gane Beto?',
           h:'Un producto resulta impar únicamente cuando ninguno de los dos factores aporta un factor par. Cuenta cuántas caras impares tiene cada dado y arma con ellas las parejas ganadoras dentro de las 36.',
           e:'El producto es impar solo si las dos caras son impares, y cada dado tiene 3 caras impares, así que hay 3 × 3 = 9 parejas de las 36, es decir '+frac(9,36)+'. Las 27 restantes contienen al menos un número par y hacen ganar a Ana, de modo que el juego está lejos de ser justo.',
           o:[frac(9,36), frac(1,2), frac(27,36), frac(1,3)], a:frac(9,36) },
      en:{ t:'Even against odd in the product',
           q:'Two six sided dice are rolled and the results of the two faces are multiplied. Ana wins if the product is even and Beto wins if the product is odd. What is the probability that Beto wins?',
           h:'A product turns out odd only when neither factor contributes an even factor. Count how many odd faces each die has and build the winning pairs with them inside the 36.',
           e:'The product is odd only if both faces are odd, and each die has 3 odd faces, so there are 3 × 3 = 9 pairs out of the 36, that is '+frac(9,36)+'. The remaining 27 contain at least one even number and make Ana win, so the game is far from fair.',
           o:[frac(9,36), frac(1,2), frac(27,36), frac(1,3)], a:frac(9,36) } },
    { es:{ t:'Caras repetidas',
           q:'Se lanzan dos dados de seis caras. Ana gana si las dos caras muestran el mismo número y Beto gana en cualquier otro caso. ¿Cuál es la probabilidad de que gane Ana?',
           h:'Escribe las parejas ordenadas en las que el segundo dado repite lo que mostró el primero y divide esa cuenta entre las 36 parejas de la rejilla.',
           e:'Hay una sola pareja repetida por cada número del dado, así que las parejas ganadoras de Ana son 6 de las 36, es decir '+frac(6,36)+'. El juego reparte la certeza en '+frac(1,6)+' contra '+frac(5,6)+', muy lejos de la mitad que exigiría un juego justo.',
           o:[frac(6,36), frac(1,36), frac(1,12), frac(12,36)], a:frac(6,36) },
      en:{ t:'Repeated faces',
           q:'Two six sided dice are rolled. Ana wins if both faces show the same number and Beto wins in any other case. What is the probability that Ana wins?',
           h:'Write the ordered pairs in which the second die repeats what the first one showed and divide that count by the 36 pairs of the grid.',
           e:'There is a single repeated pair for each number of the die, so the winning pairs of Ana are 6 out of the 36, that is '+frac(6,36)+'. The game shares certainty as '+frac(1,6)+' against '+frac(5,6)+', very far from the half a fair game would require.',
           o:[frac(6,36), frac(1,36), frac(1,12), frac(12,36)], a:frac(6,36) } },
    { es:{ t:'Sumas altas',
           q:'Se lanzan dos dados de seis caras y se anota la suma. Ana gana si la suma es mayor que 8 y Beto gana en cualquier otro caso. ¿Cuál es la probabilidad de que gane Ana?',
           h:'Enumera las sumas que cumplen la condición, cuenta por separado las casillas de cada una de ellas y junta esas cuentas antes de dividir entre 36.',
           e:'Las sumas mayores que 8 son 9, 10, 11 y 12, con 4, 3, 2 y 1 casillas, y como son mutuamente excluyentes se suman: 10 casillas de 36, es decir '+frac(10,36)+'. Tratar las cuatro sumas como si valieran lo mismo entre las once posibles da un valor equivocado.',
           o:[frac(10,36), frac(4,11), frac(6,36), frac(5,36)], a:frac(10,36) },
      en:{ t:'High sums',
           q:'Two six sided dice are rolled and the sum is written down. Ana wins if the sum is greater than 8 and Beto wins in any other case. What is the probability that Ana wins?',
           h:'List the sums meeting the condition, count the cells of each one separately and put those counts together before dividing by 36.',
           e:'The sums greater than 8 are 9, 10, 11 and 12, with 4, 3, 2 and 1 cells, and being mutually exclusive they are added: 10 cells out of 36, that is '+frac(10,36)+'. Treating the four sums as if they were worth the same among the eleven possible ones gives a wrong value.',
           o:[frac(10,36), frac(4,11), frac(6,36), frac(5,36)], a:frac(10,36) } }
  ];
  var p10 = P10V[Math.floor(rng()*P10V.length)][LANG];
  addProblem(rng, { title:p10.t, q:p10.q, hint:p10.h, exp:p10.e, options:p10.o, correct:p10.a, showWork:true });
}
</script>

<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbyytGUdwxVpgXSHoXM1ISKh036P3GlF1BmF6aVRCR3DLpmtgefG09htw_l5IJW3UwoG/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var body = JSON.stringify({school:school,event:ev,module_id:moduleId,
      session_id:sessionId,elapsed_sec:Math.round((Date.now()-openedAt)/1000)});
    if(ev==='module_close'&&navigator.sendBeacon){
      navigator.sendBeacon(GAS_URL,new Blob([body],{type:'application/json'}));
    }else{
      fetch(GAS_URL,{method:'POST',body:body,headers:{'Content-Type':'application/json'},keepalive:true}).catch(function(){});
    }
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
