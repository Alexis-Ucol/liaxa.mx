<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Defender los Derechos Humanos Hoy</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:100px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 76px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }

/* ── WIDGETS (concept manipulatives) ── */
.wgt { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.1rem; margin:1.1rem 0; }
.wgt-h { font-family:'Crimson Pro',serif; font-size:1.1rem; font-weight:700; margin-bottom:.2rem; }
.wgt-q { font-size:.82rem; color:var(--text3); margin-bottom:.85rem; }
.wmsg { margin-top:.75rem; padding:.6rem .85rem; border-radius:0 8px 8px 0; border-left:3px solid var(--border); background:var(--surface2); color:var(--text2); font-size:.83rem; }
.wmsg.ok   { background:var(--ok-bg);   color:var(--ok);    border-left-color:var(--ok); }
.wmsg.warn { background:var(--gold-bg); color:var(--text2); border-left-color:var(--gold); }
.wbtn { margin-top:.75rem; margin-right:.4rem; background:var(--green); color:#fff; border:none; border-radius:8px; padding:.55rem 1.1rem; font-size:.83rem; font-weight:600; cursor:pointer; min-height:44px; }
.wbtn:hover { background:var(--green-dark); }
.wbtn.alt { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.wprog { font-size:.72rem; color:var(--text3); margin-top:.55rem; }
.wcase { background:var(--surface2); border-radius:8px; padding:.75rem .9rem; font-size:.86rem; color:var(--text); margin-bottom:.55rem; border-left:3px solid var(--green); }
.wsub { font-size:.74rem; color:var(--text3); margin:.5rem 0 .2rem; text-transform:uppercase; letter-spacing:.07em; }
.chips { display:flex; flex-wrap:wrap; gap:.45rem; margin:.6rem 0; }
.chip { border:1.5px solid var(--border); border-radius:22px; padding:.4rem .85rem; font-size:.8rem; cursor:pointer; background:var(--surface2); color:var(--text2); min-height:44px; display:flex; align-items:center; transition:all .14s; }
.chip:hover { border-color:var(--green); }
.chip.sel  { border-color:var(--green); background:var(--green-bg); color:var(--green-dark); font-weight:600; }
.chip.good { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.chip.miss { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.chip.used { opacity:.5; }

/* cadena: interdependencia de derechos */
.crow { display:grid; grid-template-columns:1fr; gap:.35rem; padding:.6rem .7rem; border:1px solid var(--border); border-radius:9px; margin-bottom:.5rem; background:var(--surface2); cursor:pointer; transition:all .16s; min-height:44px; }
.crow:hover { border-color:var(--green); }
.crow.sel { border-color:var(--green); background:var(--green-bg); }
.crow.good { border-color:var(--ok); background:var(--ok-bg); }
.crow.miss { border-color:var(--bad); background:var(--bad-bg); }
.cname { font-size:.85rem; font-weight:600; }
.cwhy  { font-size:.74rem; color:var(--text3); }
.ctrack { position:relative; height:14px; border:1px solid var(--border); border-radius:6px; background:var(--surface); overflow:hidden; }
.cfill { height:100%; width:0%; background:var(--green); transition:width .3s; }
.cfill.down { background:var(--bad); }
.cfill.hold { background:var(--ok); }

/* semaforo de casos */
.tri { display:flex; gap:.45rem; flex-wrap:wrap; margin-top:.5rem; }
.tribtn { flex:1 1 30%; border:1.5px solid var(--border); border-radius:9px; padding:.5rem .6rem; font-size:.79rem; cursor:pointer; background:var(--surface2); color:var(--text2); min-height:44px; transition:all .14s; }
.tribtn:hover { border-color:var(--green); }
.tribtn.sel { border-color:var(--green); background:var(--green-bg); color:var(--green-dark); font-weight:600; }
.tribtn.good { border-color:var(--ok); background:var(--ok-bg); color:var(--ok); }
.tribtn.miss { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }

/* meters: constructor de argumentos */
.wcols { display:grid; grid-template-columns:repeat(3,1fr); gap:.7rem; }
.colh { font-size:.7rem; text-transform:uppercase; letter-spacing:.07em; color:var(--text3); margin-bottom:.35rem; }
.optbox { border:1.5px solid var(--border); border-radius:9px; padding:.5rem .65rem; font-size:.78rem; cursor:pointer; background:var(--surface2); color:var(--text2); margin-bottom:.4rem; transition:all .14s; }
.optbox:hover { border-color:var(--green); }
.optbox.sel { border-color:var(--green); background:var(--green-bg); color:var(--green-dark); font-weight:600; }
.mtr { margin-bottom:.5rem; }
.mtrlbl { display:flex; justify-content:space-between; font-size:.73rem; color:var(--text3); margin-bottom:.2rem; }
.mtrtrack { height:12px; border:1px solid var(--border); border-radius:6px; background:var(--surface2); overflow:hidden; }
.mtrfill { height:100%; width:0%; background:var(--gold); transition:width .3s; }
.mtrfill.ok { background:var(--ok); }

/* sliders: presupuesto de derechos */
.sldrow { margin-bottom:.75rem; }
.sldlbl { display:flex; justify-content:space-between; gap:.5rem; font-size:.79rem; color:var(--text2); margin-bottom:.25rem; }
.sldrow input[type=range] { width:100%; accent-color:var(--green); height:26px; }
.sldnote { font-size:.72rem; color:var(--text3); }
.metrics4 { display:grid; grid-template-columns:repeat(4,1fr); gap:.5rem; margin-top:.8rem; }

/* ruta: ordena los pasos */
.seq { display:flex; flex-wrap:wrap; gap:.35rem; margin:.5rem 0; min-height:1.9rem; }
.seqitem { background:var(--green-bg); color:var(--green-dark); border-radius:6px; padding:.3rem .6rem; font-size:.74rem; font-weight:600; }
.step { border:1.5px solid var(--border); border-radius:9px; padding:.55rem .75rem; font-size:.81rem; cursor:pointer; background:var(--surface2); color:var(--text2); margin-bottom:.4rem; transition:all .14s; min-height:44px; }
.step:hover { border-color:var(--green); }
.step.done { border-color:var(--ok); background:var(--ok-bg); color:var(--ok); opacity:.6; cursor:default; }
@media (max-width:600px) {
  .wcols { grid-template-columns:1fr; }
  .metrics4 { grid-template-columns:repeat(2,1fr); }
  .wgt { padding:.85rem; }
  .tribtn { flex:1 1 100%; }
}

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Defender los Derechos Humanos Hoy</div>
    <div class="wcourse" id="wcourse-el">Formación Cívica y Ética · 3° de Secundaria</div>

    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">

    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>

        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>

          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }

        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->

    <div class="hlogos">

function applyUIStrings(){
  var map = { 'wtitle-el':'wtitle','wcourse-el':'wcourse','lbl-name-el':'lbl-name','lbl-group-el':'lbl-group',

function setLang(l){
  LANG = l;
  try { localStorage.setItem(LANG_KEY, l); } catch(e){}
  var be=document.getElementById('btn-es'); if(be) be.classList.toggle('active', l==='es');
  var bn=document.getElementById('btn-en'); if(bn) bn.classList.toggle('active', l==='en');
  document.documentElement.setAttribute('lang', l);
  applyUIStrings();
  if (studentData.name && document.getElementById('lessonScreen').style.display !== 'none') {
    var prev = problems.map(function(p){ return p.studentChoice; });
    problems = []; answeredCount = 0; correctCount = 0;
    document.getElementById('lessonBody').innerHTML = '';
    var res = document.getElementById('s_results'); res.style.display='none'; res.classList.remove('vis');
    buildLesson(seededRng(studentData.name + studentData.group + currentAttempt(studentData.name, studentData.group)));
    var obs = new IntersectionObserver(function(entries){ entries.forEach(function(e){ if(e.isIntersecting) e.target.classList.add('vis'); }); }, { threshold:0.05 });
    document.querySelectorAll('.section').forEach(function(s){ obs.observe(s); });
    prev.forEach(function(ch, idx){ if(ch!==null && ch!==undefined) confirmMC(idx, ch); });
    if (answeredCount === problems.length && problems.length > 0) {
      res.style.display='block'; setTimeout(function(){ res.classList.add('vis'); }, 50);
    }
  }
}
/* ── Attempt counter + seed (Rule 4): seed = name+group+attempt ── */
function getAttemptKey(name, group){ return 'fce3_t02_g01__att__' + (name+'__'+group).replace(/\s+/g,'_'); }
function nextAttempt(name, group){ var k=getAttemptKey(name,group),n=0; try{n=parseInt(localStorage.getItem(k)||'0',10)||0;}catch(e){} n++; try{localStorage.setItem(k,String(n));}catch(e){} return n; }
function currentAttempt(name, group){ var k=getAttemptKey(name,group); try{return parseInt(localStorage.getItem(k)||'1',10)||1;}catch(e){return 1;} }
/* ================================================
   STATE
   ================================================ */
var studentData   = {};
var problems      = [];

/* ================================================
   SESSION PERSISTENCE  (localStorage)
   ================================================ */
function lsKey() {
  var n = (studentData.name  || '').trim();
  var g = (studentData.group || '').trim();
  return 'fce3_t02_g01__' + (n + '__' + g).replace(/\s+/g, '_');
}

function saveSession() {
  if (!studentData.name) return;
  var drawings = [], texts = [], photos = [];
  problems.forEach(function(p, i) {
    var dc = document.getElementById('dc' + i);
    if (dc && dc.width) {
      var blank = document.createElement('canvas');
      blank.width = dc.width; blank.height = dc.height;
      drawings.push(dc.toDataURL() === blank.toDataURL() ? null : dc.toDataURL('image/png'));
    } else { drawings.push(null); }
    var ta = document.getElementById('ta' + i);
    texts.push(ta ? ta.value : '');
    var pp = document.getElementById('pp' + i);
    photos.push((pp && pp.src && pp.src.indexOf('data:') === 0) ? pp.src : null);
  });
  var state = {
    name: studentData.name, group: studentData.group,
    answeredCount: answeredCount, correctCount: correctCount,
    choices: problems.map(function(p) { return p.studentChoice; }),
    drawings: drawings, texts: texts, photos: photos
  };
  try { localStorage.setItem(lsKey(), JSON.stringify(state)); } catch(e) {}
}

function loadSession(name, group) {
  var key = 'fce3_t02_g01__' + (name + '__' + group).replace(/\s+/g, '_');
  try { var r = localStorage.getItem(key); return r ? JSON.parse(r) : null; } catch(e) { return null; }
}

  if (!saved) return;
  document.getElementById('restoreBar').style.display = 'none';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = currentAttempt(name, group);
  buildLesson(seededRng(name + group + att));
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
  saved.choices.forEach(function(choice, idx) {

        if (ta) ta.value = text;

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

               (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  if (_isIOS) {
    var _pdfFile = new File([_pdfBlob], _fname, { type:'application/pdf' });
    if (navigator.canShare && navigator.canShare({ files:[_pdfFile] })) {
      navigator.share({ files:[_pdfFile], title:_fname })
        .then(_restorePdfBtn)

          _openPdfInline(_pdfBlob); _restorePdfBtn();

/* Shuffles options (Rule 7) keeping ES/EN aligned, then builds the card inline (Rule 1/5). */
function addProblem(v, rng){
  var n = v.options.es.length, idx = [], k;
  for (k = 0; k < n; k++) idx.push(k);
  for (k = n - 1; k > 0; k--) {
    var j = Math.floor(rng() * (k + 1));
    var tmp = idx[k]; idx[k] = idx[j]; idx[j] = tmp;
  }
  var langOpts = (LANG === 'es') ? v.options.es : v.options.en;
  var prob = {
    title:        v.title[LANG],
    questionText: v.stmt[LANG],
    fn:           v.fn || '',
    hint:         v.hint[LANG],
    explanation:  v.explanation[LANG],
    options:      idx.map(function(o){ return langOpts[o]; }),
    correctIdx:   idx.indexOf(v.correct),
    showWork:     !!v.showWork,
    studentChoice:null, pendingChoice:null
  };
  problems.push(prob);
  buildOneCard(prob, problems.length - 1);
}

/* Four distinct numeric options, correct first (shuffled later by addProblem). */
function numOpts(correct, cands){
  var out = [String(correct)], i, v;
  for (i = 0; i < cands.length && out.length < 4; i++) {
    v = String(cands[i]);
    if (cands[i] > 0 && out.indexOf(v) < 0) out.push(v);
  }
  var extra = 1;
  while (out.length < 4) { v = String(correct + extra); if (out.indexOf(v) < 0) out.push(v); extra++; }
  return out;
}

function cadRender(){
  if (!CAD) return;
  var box = document.getElementById('cadBox');
  if (!box) return;
  var h = '', i, k, done = (CAD.revealed || CAD.solved);
  for (k = 0; k < CAD.order.length; k++) {
    i = CAD.order[k];
    var it = CAD.set.items[i], cls = 'crow', fcls = 'cfill', w = CAD.sel[i] ? 100 : 22;
    if (done) {
      cls += it.falls ? ' good' : '';
      fcls += it.falls ? ' down' : ' hold';
      w = it.falls ? 100 : 22;
    } else if (CAD.judged && CAD.sel[i] && !it.falls) { cls += ' miss'; fcls += ' down'; }
    else if (CAD.judged && CAD.sel[i] && it.falls)    { cls += ' good'; fcls += ' down'; }
    else if (CAD.sel[i]) { cls += ' sel'; fcls += ' down'; }
    var show = done || (CAD.judged && CAD.sel[i]);
    h += '<div class="' + cls + '" onclick="cadTap(' + i + ')">' +
        '<div class="cname">' + (LANG === 'es' ? it.es : it.en) + '</div>' +
        (show ? '<div class="cwhy">' + (LANG === 'es' ? it.wes : it.wen) + '</div>' : '') +
        '<div class="ctrack"><div class="' + fcls + '" style="width:' + w + '%"></div></div>' +
      '</div>';
  }
  box.innerHTML = h +
    '<div class="' + CAD.mcls + '">' + (CAD.msg || S('Cada derecho que tocas se marca como parte de la cadena. Puedes cambiar de opinión cuantas veces quieras antes de comprobar.',
                                                     'Each right you tap gets marked as part of the chain. You can change your mind as often as you like before checking.')) + '</div>' +
    (done ? '' : '<button class="wbtn" onclick="cadCheck()">' + S('Comprobar la cadena','Check the chain') + '</button>' +
                 '<button class="wbtn alt" onclick="cadClear()">' + S('Empezar de nuevo','Start over') + '</button>');
}
function cadTap(i){
  if (!CAD || CAD.revealed || CAD.solved) return;
  CAD.sel[i] = !CAD.sel[i];
  CAD.judged = false;
  CAD.msg = CAD.sel[i]
    ? S('Agregaste ' + (LANG === 'es' ? CAD.set.items[i].es : CAD.set.items[i].en) + ' a la cadena.',
        'You added ' + (LANG === 'es' ? CAD.set.items[i].es : CAD.set.items[i].en) + ' to the chain.')
    : S('Quitaste ese derecho de la cadena.', 'You removed that right from the chain.');
  CAD.mcls = 'wmsg';
  cadRender();
}
function cadClear(){
  if (!CAD || CAD.revealed || CAD.solved) return;
  var i;
  for (i = 0; i < CAD.sel.length; i++) CAD.sel[i] = false;
  CAD.judged = false;
  CAD.msg = S('Cadena vacía. Vuelve a elegir.','Empty chain. Choose again.');
  CAD.mcls = 'wmsg';
  cadRender();
}
function cadCheck(){
  if (!CAD || CAD.revealed || CAD.solved) return;
  var i, miss = [], extra = [], hit = 0, need = 0;
  for (i = 0; i < CAD.set.items.length; i++) {
    var it = CAD.set.items[i];
    if (it.falls) need++;
    if (it.falls && CAD.sel[i]) hit++;
    if (it.falls && !CAD.sel[i]) miss.push(it);
    if (!it.falls && CAD.sel[i]) extra.push(it);
  }
  CAD.judged = true;
  if (miss.length === 0 && extra.length === 0) {
    CAD.solved = true;
    CAD.msg = S('Cadena completa: los ' + need + ' derechos marcados caen juntos. Los derechos humanos son interdependientes, así que atacar uno solo alcanza a varios a la vez.',
                'Complete chain: the ' + need + ' marked rights fall together. Human rights are interdependent, so hitting only one reaches several at once.');
    CAD.mcls = 'wmsg ok';
    cadRender();
    return;
  }
  CAD.tries++;
  if (CAD.tries >= 3) {
    CAD.revealed = true;
    for (i = 0; i < CAD.set.items.length; i++) CAD.sel[i] = CAD.set.items[i].falls;
    CAD.msg = S('Cadena completa: caen ' + need + ' derechos, y los otros dos se sostienen porque no dependen de lo que se bloqueó. Ese arrastre entre derechos se llama interdependencia.',
                'Complete chain: ' + need + ' rights fall, and the other two hold because they do not depend on what was blocked. That pull between rights is called interdependence.');
    CAD.mcls = 'wmsg warn';
    cadRender();
    return;
  }
  var parts = [];
  parts.push(S('Llevas ' + hit + ' de ' + need + ' derechos de la cadena.',
               'You have ' + hit + ' of ' + need + ' rights in the chain.'));
  if (extra.length) parts.push(S('Marcaste ' + (LANG === 'es' ? extra[0].es : extra[0].en) + ', pero ese se sostiene: ' + (LANG === 'es' ? extra[0].wes : extra[0].wen) + '.',
                                 'You marked ' + (LANG === 'es' ? extra[0].es : extra[0].en) + ', but that one holds: ' + (LANG === 'es' ? extra[0].wes : extra[0].wen) + '.'));
  if (miss.length) parts.push(S('Falta al menos uno: ' + miss[0].ces + '.',
                                'At least one is missing: ' + miss[0].cen + '.'));
  CAD.msg = parts.join(' ');
  CAD.mcls = 'wmsg warn';
  cadRender();
}

/* ================================================
   WIDGET 2 - SEMAFORO DE CASOS
   Three rounds, a different case each round (Rule 8, B). The student judges
   whether the situation is a valid limit, a right recognized without the
   conditions to use it, or a direct denial. Wrong choice gives the criterion
   that separates the three; reveal inside the round after the third try.
   ================================================ */
var SEM = null;
var SEMCATS = [
  { k:'limite', es:'Límite válido', en:'Valid limit' },
  { k:'sinbase', es:'Reconocido, sin condiciones', en:'Recognized, without conditions' },
  { k:'negado', es:'Derecho negado', en:'Right denied' }
];

/* ================================================

   Sliders move a fixed amount across four measures. Coverage recalculates on
   every input and the message names which right is short and by how much.

var PRE = null;
function buildPresupuesto(rng){
  var items = [
    { es:'Bebederos con agua potable', en:'Drinking water fountains' },
    { es:'Rampas y señalización accesible', en:'Ramps and accessible signage' },
    { es:'Materiales en lengua indígena', en:'Materials in an Indigenous language' },
    { es:'Becas de transporte', en:'Transport grants' }
  ];
  var needs = [40, 30, 20, 10], i;
  for (i = needs.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = needs[i]; needs[i] = needs[j]; needs[j] = tmp;
  }
  var alloc = [], total = 0;
  for (i = 0; i < items.length; i++) { items[i].need = needs[i]; alloc.push(0); total += needs[i]; }
  PRE = { items:items, alloc:alloc, total:total, tries:0, revealed:false, solved:false, msg:null, mcls:'wmsg' };
  return '<div class="wgt" id="wPre">' +
      '<div class="wgt-h">' + S('Reparte el presupuesto','Split the budget') + '</div>' +
      '<div class="wgt-q">' + S('Hay ' + total + ' mil pesos para cuatro medidas y cada una necesita una cantidad distinta para quedar completa. Mueve las barras y observa la cobertura.',
                                'There are ' + total + ' thousand pesos for four measures and each one needs a different amount to be complete. Move the bars and watch the coverage.') + '</div>' +
      '<div id="preBox"></div>' +
    '</div>';
}
function preRender(){
  if (!PRE) return;
  var box = document.getElementById('preBox');
  if (!box) return;
  var used = 0, i, short = [], h = '';
  for (i = 0; i < PRE.items.length; i++) used += PRE.alloc[i];
  var left = PRE.total - used;
  for (i = 0; i < PRE.items.length; i++) {
    var it = PRE.items[i], a = PRE.alloc[i];
    var cov = Math.min(100, Math.round(a / it.need * 100));
    if (a < it.need) short.push({ n:(LANG === 'es' ? it.es : it.en), d:it.need - a });
    h += '<div class="sldrow">' +
        '<div class="sldlbl"><span>' + (LANG === 'es' ? it.es : it.en) + '</span><span class="cval">' + a + S(' mil',' thousand') + '</span></div>' +
        '<input type="range" min="0" max="50" step="10" value="' + a + '" oninput="preSet(' + i + ',this.value)">' +
        '<div class="sldnote">' + S('Cobertura: ','Coverage: ') + cov + '%' + (a > it.need ? S(' (sobra dinero aquí)',' (money left over here)') : '') + '</div>' +
      '</div>';
  }
  var mh = '<div class="metrics4">';
  for (i = 0; i < PRE.items.length; i++) {
    var c2 = Math.min(100, Math.round(PRE.alloc[i] / PRE.items[i].need * 100));
    mh += '<div class="metric"><div class="mlbl">' + S('Medida ','Measure ') + (i + 1) + '</div>' +
      '<div class="mnum ' + (c2 === 100 ? 'cs' : 'ps') + '">' + c2 + '%</div></div>';
  }
  mh += '</div>';
  var done = PRE.revealed || PRE.solved;
  box.innerHTML = h + mh +
    '<div class="' + PRE.mcls + '">' + (PRE.msg || S('Cada medida se completa con una cantidad distinta, y el dinero es exactamente el que alcanza si nada se desperdicia.',
                                                     'Each measure is completed with a different amount, and the money is exactly enough if nothing is wasted.')) + '</div>' +
    (done ? '' : '<button class="wbtn" onclick="preCheck()">' + S('Aprobar el presupuesto','Approve the budget') + '</button>') +
    '<div class="wprog">' + S('Sin asignar: ','Unassigned: ') + left + S(' mil de ',' thousand of ') + PRE.total + S(' mil',' thousand') + '</div>';
}
function preSet(i, v){
  if (!PRE || PRE.revealed || PRE.solved) return;
  PRE.alloc[i] = parseInt(v, 10) || 0;
  var used = 0, k;
  for (k = 0; k < PRE.alloc.length; k++) used += PRE.alloc[k];
  if (used > PRE.total) {
    PRE.msg = S('Vas ' + (used - PRE.total) + ' mil pesos arriba de lo que hay. Para dejar así esta medida, tendrías que quitarle a otro derecho.',
                'You are ' + (used - PRE.total) + ' thousand pesos above what exists. To leave this measure like that, you would have to take from another right.');
    PRE.mcls = 'wmsg warn';
  } else {
    var it = PRE.items[i];
    PRE.msg = PRE.alloc[i] >= it.need
      ? S('Esa medida ya queda completa con ' + it.need + ' mil.', 'That measure is already complete with ' + it.need + ' thousand.')
      : S('A esa medida le faltan ' + (it.need - PRE.alloc[i]) + ' mil para quedar completa.',
          'That measure is ' + (it.need - PRE.alloc[i]) + ' thousand short of being complete.');
    PRE.mcls = 'wmsg';
  }
  preRender();
}
function preCheck(){
  if (!PRE || PRE.revealed || PRE.solved) return;
  var i, bad = [], used = 0;
  for (i = 0; i < PRE.items.length; i++) {
    used += PRE.alloc[i];
    if (PRE.alloc[i] !== PRE.items[i].need) bad.push({ n:(LANG === 'es' ? PRE.items[i].es : PRE.items[i].en), d:PRE.items[i].need - PRE.alloc[i] });
  }
  if (bad.length === 0) {
    PRE.solved = true;
    PRE.msg = S('Presupuesto aprobado: las cuatro medidas llegan al 100 por ciento y no sobra un peso. Un presupuesto es siempre una decisión sobre qué derechos se garantizan primero.',
                'Budget approved: the four measures reach 100 per cent and not a peso is left over. A budget is always a decision about which rights get guaranteed first.');
    PRE.mcls = 'wmsg ok';
    preRender();
    return;
  }
  PRE.tries++;
  if (PRE.tries >= 3) {
    PRE.revealed = true;
    var txt = [];
    for (i = 0; i < PRE.items.length; i++) {
      PRE.alloc[i] = PRE.items[i].need;
      txt.push((LANG === 'es' ? PRE.items[i].es : PRE.items[i].en) + ': ' + PRE.items[i].need);
    }
    PRE.msg = S('Reparto que cubre todo, en miles de pesos, ' + txt.join(', ') + '. Cuando el dinero alcanza justo, dejar a una medida corta significa dejar a alguien fuera.',
                'The split that covers everything, in thousands of pesos, ' + txt.join(', ') + '. When the money is just enough, leaving one measure short means leaving somebody out');
    PRE.mcls = 'wmsg warn';
    preRender();
    return;
  }
  var over = used > PRE.total;
  var first = null;
  for (i = 0; i < bad.length; i++) if (bad[i].d > 0) { first = bad[i]; break; }
  PRE.msg = over
    ? S('Asignaste ' + (used - PRE.total) + ' mil más de lo que hay. Baja donde sobra antes de subir donde falta.',
        'You assigned ' + (used - PRE.total) + ' thousand more than what exists. Lower where there is a surplus before raising where there is a gap.')
    : (first ? S('Falta cobertura en ' + first.n + ': le hacen falta ' + first.d + ' mil pesos.',
                 'Coverage is missing in ' + first.n + ': it needs ' + first.d + ' thousand pesos more.')
             : S('Sobra dinero en alguna medida. Revisa cuál pasó de lo que necesitaba.',
                 'There is a surplus in one measure. Check which one went past what it needed.'));
  PRE.mcls = 'wmsg warn';
  preRender();
}
/* ================================================
   WIDGET 5 - RUTA DE EXIGENCIA
   The student taps the steps in order. A step out of place explains what has to
   happen before it and the sequence resets, so the route can be rebuilt as many
   times as needed. Reveal on the third failed attempt (Rule 8, A).
   ================================================ */
var RUT = null;
function buildRuta(rng){
  var sets = [
    [ { es:'Nombrar el derecho afectado y decir a quiénes alcanza el problema.',
        en:'Name the affected right and say who the problem reaches.',
        bes:'primero hay que nombrar de qué derecho se trata, porque sin eso no se sabe qué se va a exigir',
        ben:'first the right at stake has to be named, because without that nobody knows what is being demanded' },
      { es:'Escuchar a las personas afectadas y acordar con ellas qué se va a exigir.',
        en:'Listen to the affected people and agree with them on what will be demanded.',
        bes:'antes de escuchar hay que saber cuál es el derecho en juego',
        ben:'before listening you need to know which right is at stake' },
      { es:'Reunir evidencia: fechas, cifras, fotografías y testimonios.',
        en:'Gather evidence: dates, figures, photographs and testimonies.',
        bes:'la evidencia se reúne después de acordar qué se va a exigir, para que sirva a esa exigencia',
        ben:'evidence gets gathered after agreeing what will be demanded, so that it serves that demand' },
      { es:'Presentar la exigencia por escrito ante la autoridad que puede resolverla.',
        en:'Present the demand in writing before the authority that can resolve it.',
        bes:'una exigencia sin evidencia se responde con una negativa y ahí se acaba',
        ben:'a demand with no evidence gets answered with a refusal and there it ends' },
      { es:'Dar seguimiento público al compromiso y revisar los resultados.',
        en:'Follow up publicly on the commitment and review the results.',
        bes:'no hay nada que seguir hasta que exista un compromiso de la autoridad',
        ben:'there is nothing to follow up until a commitment from the authority exists' } ],
    [ { es:'Identificar qué derecho se está quedando sin cumplir en la colonia.',
        en:'Identify which right is going unfulfilled in the neighborhood.',
        bes:'todo empieza por identificar el derecho, porque de ahí sale la obligación que se va a reclamar',
        ben:'everything starts by identifying the right, because that is where the obligation to claim comes from' },
      { es:'Reunir a las vecinas y vecinos afectados y definir juntos la petición.',
        en:'Bring together the affected neighbors and define the request together.',
        bes:'reunir a la gente sirve cuando ya se sabe qué derecho está en juego',
        ben:'bringing people together works once it is known which right is at stake' },
      { es:'Documentar el problema con fotografías, fechas y el número de familias afectadas.',
        en:'Document the problem with photographs, dates and the number of affected families.',
        bes:'se documenta lo que el grupo acordó reclamar, no cualquier cosa',
        ben:'what gets documented is what the group agreed to claim, not just anything' },
      { es:'Entregar la petición firmada en la oficina que tiene la obligación de responder.',
        en:'Hand in the signed request at the office that has the duty to answer.',
        bes:'sin documentos la oficina archiva la petición sin revisarla',
        ben:'with no documents the office files the request away without reviewing it' },
      { es:'Verificar en la colonia si la respuesta se cumplió y hacerlo saber.',
        en:'Check in the neighborhood whether the answer was carried out and make it known.',
        bes:'solo se puede verificar el cumplimiento de una respuesta que ya se recibió',
        ben:'you can only verify the fulfilment of an answer that has already arrived' } ]
  ];
  var steps = sets[Math.floor(rng() * sets.length)];
  var order = [], i;
  for (i = 0; i < steps.length; i++) order.push(i);
  for (i = order.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = order[i]; order[i] = order[j]; order[j] = tmp;
  }
  RUT = { steps:steps, order:order, placed:[], tries:0, revealed:false, solved:false, msg:null, mcls:'wmsg' };
  return '<div class="wgt" id="wRuta">' +
      '<div class="wgt-h">' + S('Ordena la ruta de exigencia','Put the route in order') + '</div>' +
      '<div class="wgt-q">' + S('Toca los pasos en el orden en que conviene darlos. Si uno llega antes de tiempo, la ruta se reinicia y puedes volver a armarla.',
                                'Tap the steps in the order they should be taken. If one arrives too early the route resets and you can build it again.') + '</div>' +
      '<div id="rutBox"></div>' +
    '</div>';
}
function rutRender(){
  if (!RUT) return;
  var box = document.getElementById('rutBox');
  if (!box) return;
  var h = '<div class="seq">', i, k;
  if (!RUT.placed.length) h += '<div class="seqitem">' + S('La ruta está vacía','The route is empty') + '</div>';
  for (k = 0; k < RUT.placed.length; k++) h += '<div class="seqitem">' + (k + 1) + '</div>';
  h += '</div>';
  var done = RUT.revealed || RUT.solved;
  for (k = 0; k < RUT.order.length; k++) {
    i = RUT.order[k];
    var used = RUT.placed.indexOf(i) >= 0;
    h += '<div class="step' + (used ? ' done' : '') + '"' + (used || done ? '' : ' onclick="rutTap(' + i + ')"') + '>' +
      (used ? (RUT.placed.indexOf(i) + 1) + '. ' : '') + (LANG === 'es' ? RUT.steps[i].es : RUT.steps[i].en) + '</div>';
  }
  box.innerHTML = h +
    '<div class="' + RUT.mcls + '">' + (RUT.msg || S('El orden importa tanto como el contenido: escuchar después de decidir ya no cambia nada.',
                                                    'The order matters as much as the content: listening after deciding changes nothing anymore.')) + '</div>' +
    (done ? '' : (RUT.placed.length ? '<button class="wbtn alt" onclick="rutUndo()">' + S('Quitar el último','Remove the last one') + '</button>' : '')) +
    '<div class="wprog">' + S('Pasos colocados: ','Steps placed: ') + RUT.placed.length + S(' de ',' of ') + RUT.steps.length + '</div>';
}
function rutTap(i){
  if (!RUT || RUT.revealed || RUT.solved) return;
  if (RUT.placed.indexOf(i) >= 0) return;
  if (i === RUT.placed.length) {
    RUT.placed.push(i);
    if (RUT.placed.length === RUT.steps.length) {
      RUT.solved = true;
      RUT.msg = S('Ruta completa. Identificar, escuchar, documentar, presentar y dar seguimiento: exigir un derecho es un procedimiento, no un arranque de coraje.',
                  'Route complete. Identify, listen, document, present and follow up: demanding a right is a procedure, not a burst of anger.');
      RUT.mcls = 'wmsg ok';
    } else {
      RUT.msg = S('Paso ' + RUT.placed.length + ' en su lugar. Sigue con el que viene después.',
                  'Step ' + RUT.placed.length + ' in place. Continue with the one that comes next.');
      RUT.mcls = 'wmsg';
    }
    rutRender();
    return;
  }
  RUT.tries++;
  if (RUT.tries >= 3) {
    RUT.revealed = true;
    RUT.placed = [];
    var k;
    for (k = 0; k < RUT.steps.length; k++) RUT.placed.push(k);
    RUT.msg = S('Esta es la ruta en orden. Cada paso prepara al siguiente: quien salta la escucha exige algo que nadie pidió, y quien salta la evidencia recibe una negativa.',
                'This is the route in order. Each step prepares the next: whoever skips the listening demands something nobody asked for, and whoever skips the evidence gets a refusal.');
    RUT.mcls = 'wmsg warn';
    rutRender();
    return;
  }
  RUT.placed = [];
  RUT.msg = S('Ese paso llega después: ' + RUT.steps[i].bes + '. La ruta se reinició.',
              'That step comes later: ' + RUT.steps[i].ben + '. The route was reset.');
  RUT.mcls = 'wmsg warn';
  rutRender();
}
function rutUndo(){
  if (!RUT || RUT.revealed || RUT.solved) return;
  RUT.placed.pop();
  RUT.msg = S('Quitaste el último paso. Puedes volver a colocarlo cuando quieras.',
              'You removed the last step. You can place it again whenever you like.');
  RUT.mcls = 'wmsg';
  rutRender();
}
/* ================================================
   buildLesson - concepts, manipulatives and the 10 graded problems, interleaved
   ================================================ */
function buildLesson(rng) {
  problems = []; answeredCount = 0; correctCount = 0;
  document.getElementById('lessonBody').innerHTML = '';

  /* ── CONCEPTO 1 ─────────────────────────────────────────────── */
  addSection(S('CONCEPTO 1','CONCEPT 1'),
    '<h2>' + S('Un acuerdo que sostiene a todas las personas','An agreement that holds up every person') + '</h2>' +
    '<p>' + S('Los derechos humanos no son una lista de buenos deseos: son el acuerdo mínimo al que llegaron las sociedades después de comprobar, a un costo altísimo, lo que ocurre cuando la dignidad de alguien se deja a votación. Por eso se dice que son valores compartidos. No los concede una autoridad ni se ganan con buena conducta: se reconocen porque la persona existe.',
              'Human rights are not a list of good wishes: they are the minimum agreement societies reached after learning, at a very high cost, what happens when the dignity of somebody is put to a vote. That is why they are called shared values. No authority grants them and nobody earns them through good behavior: they are recognized because the person exists.') + '</p>' +
    '<p>' + S('De ese acuerdo se desprenden cuatro rasgos que conviene tener a la mano en cualquier discusión. Son universales, porque alcanzan a toda persona sin condición alguna. Son interdependientes, porque cada uno depende de los demás para funcionar. Son indivisibles, porque no se puede cumplir la mitad y considerar el trabajo terminado. Y son progresivos, porque lo que ya se logró no se puede recortar después: eso último se llama no regresividad.',
              'Four features follow from that agreement, and they are worth keeping at hand in any discussion. They are universal, because they reach every person without any condition. They are interdependent, because each one depends on the others in order to work. They are indivisible, because you cannot fulfil half of them and call the job done. And they are progressive, because what has already been achieved cannot be cut back later: that last part is called non regression.') + '</p>' +
    '<div class="callout"><p><strong>' + S('Dignidad: ','Dignity: ') + '</strong>' +
      S('el valor que tiene una persona por el hecho de ser persona, sin depender de su utilidad, su origen, su comportamiento ni la opinión que otros tengan de ella. Es el punto de partida de todo el acuerdo.',
        'the worth a person has for the simple fact of being a person, without depending on their usefulness, their origin, their behavior or the opinion others hold of them. It is the starting point of the whole agreement.') + '</p></div>' +
    '<div class="rules-grid">' +
      '<div class="rcard"><div class="rname">' + S('Universalidad','Universality') + '</div><div class="rform">' + S('¿alcanza a toda persona?','does it reach everyone?') + '</div><div class="rnote">' + S('Nadie queda fuera por su origen o su conducta.','Nobody is left out for their origin or conduct.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Interdependencia','Interdependence') + '</div><div class="rform">' + S('¿qué otros arrastra?','which others does it drag?') + '</div><div class="rnote">' + S('Si uno cae, varios caen con él.','If one falls, several fall with it.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Indivisibilidad','Indivisibility') + '</div><div class="rform">' + S('¿se cumple completo?','is it fulfilled in full?') + '</div><div class="rnote">' + S('No hay derechos de primera y de segunda.','There are no first class and second class rights.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Progresividad','Progressivity') + '</div><div class="rform">' + S('¿avanza o retrocede?','does it advance or go back?') + '</div><div class="rnote">' + S('Lo ya logrado no se recorta después.','What is already achieved is not cut back later.') + '</div></div>' +
    '</div>' +
    buildCadena(rng));
  cadRender();

  /* ── PROBLEMA 1 ─────────────────────────────────────────────── */
  addProblem(pick([
    { title:{ es:'El arrastre entre derechos', en:'The pull between rights' }, showWork:false,
      stmt:{ es:'En un debate escolar, alguien propone atender primero el derecho al agua y dejar la educación para el año siguiente, porque son asuntos separados. Otra persona responde que el orden es imposible de sostener. ¿Qué razón da mejor sustento a esa respuesta?',
             en:'In a school debate, somebody proposes handling the right to water first and leaving education for next year, because they are separate matters. Another person answers that such an order cannot hold. Which reason best supports that answer?' },
      options:{ es:[
        'Que la falta de agua ya está afectando la asistencia y el aprendizaje, así que retrasar la educación no la deja intacta sino que la deteriora.',
        'Que la educación siempre es más importante que el agua y por eso debería resolverse antes que cualquier otra necesidad.',
        'Que las autoridades escolares no tienen facultades para decidir el orden en que se atienden los problemas de la comunidad.',
        'Que atender dos asuntos al mismo tiempo resulta más económico que atender uno primero y el otro después.' ],
        en:[
        'That the lack of water is already affecting attendance and learning, so delaying education does not leave it untouched but damages it.',
        'That education is always more important than water and should therefore be settled before any other need.',
        'That school authorities have no power to decide the order in which community problems are addressed.',
        'That handling two matters at the same time turns out cheaper than handling one first and the other later.' ] },
      correct:0,
      hint:{ es:'Revisa si los dos derechos del caso funcionan por separado o si uno ya está arrastrando al otro.',
             en:'Check whether the two rights in the case work separately or whether one is already dragging the other.' },
      explanation:{ es:'Los derechos humanos son interdependientes: el agua sostiene la salud, y la salud sostiene la asistencia a clase. Posponer la educación no la congela en su lugar, la empeora mientras el agua falta. Las otras opciones inventan una jerarquía, cambian el tema a las facultades de la autoridad o convierten el problema en un cálculo de costos.',
                    en:'Human rights are interdependent: water sustains health, and health sustains attendance in class. Postponing education does not freeze it in place, it makes it worse while water is missing. The other options invent a hierarchy, shift the topic to the powers of the authority, or turn the problem into a cost calculation.' } },
    { title:{ es:'El arrastre entre derechos', en:'The pull between rights' }, showWork:false,
      stmt:{ es:'Una autoridad municipal afirma que ya cumplió con los derechos de la niñez porque construyó escuelas, aunque en la mitad de las colonias no hay drenaje ni agua entubada. ¿Qué objeción desarma mejor esa afirmación?',
             en:'A town authority claims it has already fulfilled the rights of children because it built schools, even though half the neighborhoods have no drainage and no piped water.  Which objection best dismantles that claim?' },
      options:{ es:[
        'Que el derecho a la educación no queda cumplido cuando las condiciones de salud y saneamiento impiden que la niñez llegue y permanezca en la escuela.',
        'Que construir escuelas es siempre más costoso que instalar drenaje, así que el gasto se hizo en el orden equivocado.',
        'Que las obras de drenaje corresponden al gobierno estatal y no a la autoridad municipal que hizo la afirmación.',
        'Que la autoridad debió consultar a los padres de familia antes de decidir en qué colonias construir las escuelas.' ],
        en:[
        'That the right to education is not fulfilled when health and sanitation conditions keep children from reaching school and staying there.',
        'That building schools is always more expensive than installing drainage, so the spending was done in the wrong order.',
        'That drainage works belong to the state government and not to the town authority that made the claim.',
        'That the authority should have consulted parents before deciding in which neighborhoods to build the schools.' ] },
      correct:0,
      hint:{ es:'Pregúntate si un derecho se puede declarar cumplido mientras otro que lo sostiene sigue sin cumplirse.',
             en:'Ask whether a right can be declared fulfilled while another one that sustains it remains unfulfilled.' },
      explanation:{ es:'La indivisibilidad y la interdependencia impiden dar por terminado un derecho aislado. Un edificio escolar sin agua ni saneamiento en el entorno produce ausencias y enfermedades, de modo que la educación queda a medias. Las demás objeciones discuten costos, competencias o consulta, y ninguna toca el punto de fondo.',
                    en:'Indivisibility and interdependence make it impossible to declare an isolated right finished. A school building with no water or sanitation around it produces absences and illness, so education stays half done. The other objections argue about costs, jurisdiction or consultation, and none of them touches the core point.' } }
  ], rng), rng);

  /* ── PROBLEMA 2 ─────────────────────────────────────────────── */
  addProblem(pick([
    { title:{ es:'Universales, sin condiciones', en:'Universal, with no conditions' }, showWork:false,
      stmt:{ es:'En una mesa de debate, un participante sostiene que quien comete un delito pierde sus derechos humanos y que por eso da igual cómo se le trate en prisión. ¿Cuál respuesta se apoya en la universalidad de los derechos?',
             en:'At a debate table, one participant argues that whoever commits a crime loses their human rights, and that therefore it does not matter how they are treated in prison. Which answer rests on the universality of rights?' },
      options:{ es:[
        'Una condena limita la libertad de tránsito por un tiempo y con reglas, pero no autoriza tortura ni tratos que anulen la dignidad de la persona.',
        'Los derechos humanos se conservan solo mientras la persona demuestre buena conducta durante el tiempo que dure su condena.',
        'Cada país decide con libertad cuáles derechos conserva una persona sentenciada, porque se trata de un asunto interno.',
        'Los derechos humanos protegen a la víctima del delito, y por eso la persona sentenciada queda fuera de esa protección.' ],
        en:[
        'A sentence limits freedom of movement for a time and under rules, but it does not authorize torture or treatment that cancels the dignity of the person.',
        'Human rights are kept only while the person shows good conduct throughout the length of their sentence.',
        'Each country freely decides which rights a sentenced person keeps, because it is an internal matter.',
        'Human rights protect the victim of the crime, and that is why the sentenced person falls outside that protection.' ] },
      correct:0,
      hint:{ es:'Distingue entre restringir un derecho concreto con reglas y retirarle a alguien la condición de persona.',
             en:'Tell apart restricting one concrete right under rules from stripping somebody of their standing as a person.' },
      explanation:{ es:'La universalidad significa que los derechos no se pierden por la conducta: alcanzan a toda persona por el hecho de serlo. Una sentencia restringe derechos determinados, como la libertad de tránsito, con reglas y por un tiempo, y deja intactos la vida, la integridad y la salud. Las otras opciones condicionan los derechos a la conducta, a la voluntad de cada gobierno o al lugar de la persona en el conflicto.',
                    en:'Universality means rights are not lost through conduct: they reach every person for being one. A sentence restricts specific rights, such as freedom of movement, under rules and for a time, and leaves life, integrity and health untouched. The other options make rights conditional on conduct, on the will of each government, or on the place of the person in the conflict.' } },
    { title:{ es:'Universales, sin condiciones', en:'Universal, with no conditions' }, showWork:false,
      stmt:{ es:'En una discusión sobre migración, alguien afirma que la atención médica de urgencia debería reservarse a quien tenga papeles en regla. ¿Cuál respuesta se apoya en la universalidad de los derechos?',
             en:'In a discussion about migration, somebody claims emergency medical care should be reserved for those with papers in order. Which answer rests on the universality of rights?' },
      options:{ es:[
        'La atención de urgencia se debe a cualquier persona que la necesite, porque el derecho a la salud no depende de la situación migratoria.',
        'La atención debería darse primero a quien haya vivido más años en el país y después a las personas recién llegadas.',
        'Cada hospital puede fijar sus propias reglas de acceso según los recursos con los que cuente ese mes.',
        'La atención de urgencia se debe solo a quien pueda comprobar que aporta al sostenimiento del sistema de salud.' ],
        en:[
        'Emergency care is owed to any person who needs it, because the right to health does not depend on migration status.',
        'Care should be given first to whoever has lived in the country longest and afterwards to newly arrived people.',
        'Each hospital may set its own access rules according to the resources it has that month.',
        'Emergency care is owed only to those who can prove they contribute to sustaining the health system.' ] },
      correct:0,

             en:'Check whether the option sets any prior condition for a person to receive care.' },
      explanation:{ es:'Universalidad quiere decir sin condiciones: ni papeles, ni antigüedad, ni aportación económica. Las otras tres opciones introducen un requisito, y en el momento en que un requisito decide quién recibe atención de urgencia, el derecho deja de ser universal y se vuelve un premio.',
                    en:'Universality means with no conditions: no papers, no seniority, no economic contribution. The other three options introduce a requirement, and the moment a requirement decides who receives emergency care, the right stops being universal and turns into a prize.' } }
  ], rng), rng);

  /* ── CONCEPTO 2 ─────────────────────────────────────────────── */
  addSection(S('CONCEPTO 2','CONCEPT 2'),
    '<h2>' + S('Por qué defenderlos sigue siendo un reto','Why defending them is still a challenge') + '</h2>' +
    '<p>' + S('Casi todos los derechos que hoy discutimos ya están escritos. El reto de las sociedades actuales no es escribirlos otra vez, sino cerrar la distancia entre el texto y la vida diaria. Esa distancia se abre por varias vías: discriminación que decide quién entra primero, desigualdad económica que vuelve impagable lo que la ley promete, información falsa que circula más rápido que la verificada, violencia que silencia a quien reclama, y decisiones de presupuesto que recortan lo que ya se había logrado.',
              'Almost every right we discuss today is already written down. The challenge of current societies is not to write them again, but to close the distance between the text and daily life. That distance opens along several routes: discrimination that decides who goes in first, economic inequality that makes what the law promises unaffordable, false information that travels faster than verified information, violence that silences whoever complains, and budget decisions that cut back what had already been achieved.') + '</p>' +
    '<p>' + S('Para discutir con precisión conviene separar tres situaciones que suelen confundirse. Hay límites válidos: restricciones escritas en una norma, con una razón proporcional, que protegen otros derechos y dejan el derecho en pie. Hay derechos reconocidos sin condiciones para ejercerlos: nadie los niega, pero faltan la rampa, el intérprete, el transporte o el dinero. Y hay negaciones directas: alguien cierra la puerta por una razón que ninguna norma respalda.',
              'To discuss with precision it helps to separate three situations that often get mixed up. There are valid limits: restrictions written into a rule, with a proportionate reason, that protect other rights and leave the right standing. There are rights recognized without the conditions to exercise them: nobody denies them, but the ramp, the interpreter, the transport or the money is missing. And there are direct denials: somebody closes the door for a reason no rule backs.') + '</p>' +
    '<div class="callout"><p><strong>' + S('Proporcionalidad: ','Proportionality: ') + '</strong>' +
      S('una restricción solo se sostiene si es la medida más pequeña que resuelve el problema. Si existe una forma menos costosa para el derecho, la restricción amplia no se justifica.',
        'a restriction only holds up if it is the smallest measure that solves the problem. If a less costly way for the right exists, the broad restriction is not justified.') + '</p></div>' +
    buildSemaforo(rng));
  semRender();

  /* ── PROBLEMA 3 ─────────────────────────────────────────────── */

    '<p>' + S('Debatir no es ganar una discusión a gritos ni repetir lo que uno ya pensaba. Una intervención que se sostiene tiene tres piezas. La postura afirma algo que se puede revisar y con lo que se puede estar en desacuerdo. La evidencia es un dato verificable que sostiene esa postura. El fundamento nombra la obligación o el derecho en el que se apoya, no la buena voluntad de nadie.',

  addSection(S('CONCEPTO 4','CONCEPT 4'),
    '<h2>' + S('Exigir: obligaciones, presupuesto y no regresividad','Demanding: duties, budget and non regression') + '</h2>' +
    '<p>' + S('Frente a cada derecho hay cuatro obligaciones de la autoridad. Respetar: no estorbar ni dañar. Proteger: impedir que otras personas o empresas lo dañen. Garantizar: poner las condiciones materiales para ejercerlo, es decir la rampa, el intérprete, el agua, el transporte. Promover: informar y formar para que la gente sepa que tiene ese derecho y cómo reclamarlo.',

    '<p>' + S('Garantizar cuesta, y ahí aparece el presupuesto. Un presupuesto no es una lista técnica: es la decisión sobre qué derechos se cumplen primero y quién espera. La regla que acota esa decisión es la no regresividad: lo que ya se logró no se puede recortar, salvo que la autoridad demuestre que usó todos los recursos a su alcance, que la medida es temporal y que no carga el ajuste sobre quienes están en mayor desventaja.',
