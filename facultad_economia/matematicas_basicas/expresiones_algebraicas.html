<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expresiones Algebraicas · Matemáticas Básicas · Facultad de Economía, Universidad de Colima</title>
<link rel="canonical" href="https://liaxa.mx/facultad_economia/matematicas_basicas/mat_expresiones.html">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS ── fallback only; applyBranding() re-injects from SCHOOL ── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;
  --gold-bg:    #faf3e0;
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; object-fit:contain; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; min-width:0; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── LANGUAGE TOGGLE ── */
.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }
.dlist { font-family:'IBM Plex Mono',monospace; font-size:.78rem; color:var(--green-dark); background:var(--surface2); border-radius:8px; padding:.6rem .7rem; margin:.6rem 0; word-break:break-word; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); overflow-x:auto; }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── INTERACTIVE WIDGETS ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.iw-head { display:flex; align-items:baseline; gap:.6rem; margin-bottom:.3rem; flex-wrap:wrap; }
.iw-tag { font-size:.62rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; }
.iw-title { font-family:'Crimson Pro',serif; font-size:1.08rem; font-weight:700; }
.iw-sub { font-size:.8rem; color:var(--text2); margin-bottom:.85rem; }
.iw-read { margin-top:.85rem; background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 8px 8px 0; padding:.7rem .85rem; font-size:.82rem; color:var(--text2); }
.iw-read strong { color:var(--green-dark); }
.iw-expr { font-family:'IBM Plex Mono',monospace; font-size:1rem; text-align:center; padding:.75rem .6rem; background:var(--surface2); border-radius:8px; margin:.5rem 0; color:var(--text); word-break:break-word; }
.iw-expr .ec { color:var(--green-dark); font-weight:600; }
.iw-expr .ev { color:var(--gold); font-weight:600; }
.iw-note { font-size:.74rem; color:var(--text3); text-align:center; margin-top:-.2rem; margin-bottom:.5rem; }
.bar { display:flex; height:22px; border-radius:6px; overflow:hidden; border:1px solid var(--border); margin:.55rem 0 .2rem; }
.bar span { display:block; height:100%; }
.bar-fix { background:var(--green); }
.bar-var { background:var(--gold); }
.bar-key { display:flex; gap:1rem; font-size:.7rem; color:var(--text3); justify-content:center; flex-wrap:wrap; }
.bar-key i { display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:.3rem; font-style:normal; }
.chips { display:flex; flex-wrap:wrap; gap:.4rem; margin-bottom:.6rem; }
.chip { border:1.5px solid var(--border); border-radius:8px; padding:.34rem .6rem; font-size:.76rem; cursor:pointer; background:var(--surface2); color:var(--text2); font-family:inherit; text-align:left; line-height:1.25; }
.chip.on { border-color:var(--green); background:var(--green-bg); color:var(--green-dark); }
.chip b { font-family:'IBM Plex Mono',monospace; font-size:.82rem; display:block; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (widget toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.3rem .7rem; font-size:.76rem; cursor:pointer; color:var(--text2); transition:all .14s; font-family:inherit; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--gold-bg); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }

/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos { gap: .9rem; }
  .wlogos img { height: 38px; max-width: 42%; }
  .wtitle { font-size: 1.35rem; }
  .stickybar { padding: .5rem .55rem; gap: .38rem; }
  .htitle { display: none; }
  .halexis { display: none; }
  .hsep { display: none; }
  .hlogos { gap: .3rem; }
  .hlogos img { height: 18px; max-width: 60px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 78px; overflow: hidden; text-overflow: ellipsis; }
  .lang-btn { padding: .26rem .48rem; font-size: .68rem; }
  .lbody { padding: 1.2rem .7rem 3rem; max-width: 100%; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .gcrd { padding: .9rem .75rem; }
  .iw-expr { font-size: .86rem; }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}
</style>
</head>
<body>

<!-- ════════════════════ WELCOME ════════════════════ -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <div style="font-family:'Crimson Pro',serif;font-size:2rem;font-weight:700;letter-spacing:.06em;color:#1a4a8a;line-height:1;letter-spacing:.28em;text-indent:.28em">ALEXIS</div>
    </div>
    <div class="wtitle" id="wtitle-el">Expresiones Algebraicas</div>
    <div class="wcourse" id="wcourse-el">Matemáticas Básicas</div>
    <label class="flabel" for="sName" id="lbl-name-el">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" for="sGroup" id="lbl-group-el">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreTitle">Sesión guardada encontrada</strong><br>
      <span id="restoreMsg">¿Deseas continuar donde la dejaste?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Retomar sesión</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Empezar de nuevo</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="200" height="48" viewBox="-22 0 160 34" xmlns="http://www.w3.org/2000/svg"><polyline points="4,24 10,18 16,20 22,10" fill="none" stroke="#1a4a8a" stroke-width="2"/><circle cx="22" cy="10" r="2.5" fill="#c9a84c"/><line x1="32" y1="6" x2="32" y2="28" stroke="#c9a84c" stroke-width="2"/><text x="42" y="22" font-family="'Crimson Pro',serif" font-weight="700" letter-spacing="3" fill="#1a4a8a" font-size="16">LIAXA</text></svg>
    </div>
  </div>
</div>

<!-- ════════════════════ LESSON ════════════════════ -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo -->
      <img id="hlogo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle" id="htitle-el">Expresiones Algebraicas</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 120 34" xmlns="http://www.w3.org/2000/svg"><polyline points="4,24 10,18 16,20 22,10" fill="none" stroke="#1a4a8a" stroke-width="2"/><circle cx="22" cy="10" r="2.5" fill="#c9a84c"/><line x1="32" y1="6" x2="32" y2="28" stroke="#c9a84c" stroke-width="2"/><text x="42" y="22" font-family="'Crimson Pro',serif" font-weight="700" letter-spacing="3" fill="#1a4a8a" font-size="16">LIAXA</text></svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle">
      <button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button>
      <button class="lang-btn"        id="btn-en" onclick="setLang('en')">EN</button>
    </div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <div class="section" id="s_results" style="display:none;">

/* ════════════════════════════════════════════════════════════════════════
   ATTEMPT COUNTER + SEEDED RNG
   Fresh numbers on every fresh start; a restored session reuses the seed.
   ════════════════════════════════════════════════════════════════════════ */
function getAttemptKey(name, group) {
  return 'fac_econ_mat__mat_expresiones__att__' + (name + '__' + group).replace(/\s+/g, '_');
}
function nextAttempt(name, group) {
  var k = getAttemptKey(name, group), n = 0;
  try { n = parseInt(localStorage.getItem(k) || '0', 10) || 0; } catch(e) {}
  n++;
  try { localStorage.setItem(k, String(n)); } catch(e) {}
  return n;
}
function currentAttempt(name, group) {
  var k = getAttemptKey(name, group);
  try { return parseInt(localStorage.getItem(k) || '1', 10) || 1; } catch(e) { return 1; }
}
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t2 = s ^ (s >>> 16);
    t2 = Math.imul(t2, 0x21f0aaad);
    t2 ^= (t2 >>> 15);
    t2 = Math.imul(t2, 0x735a2d97);
    return ((t2 ^ (t2 >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}
/* Shuffles the four options once and keeps both language versions aligned.
   The key is always the value handed in first. */
function shuffleOpts(rawEs, rawEn, rng) {
  var p = shuffle([0, 1, 2, 3], rng);
  return {
    es: p.map(function(j) { return rawEs[j]; }),
    en: p.map(function(j) { return rawEn[j]; }),
    correctIdx: p.indexOf(0)
  };
}

/* ════════════════════════════════════════════════════════════════════════
   NUMBER AND EXPRESSION HELPERS
   ════════════════════════════════════════════════════════════════════════ */
function nf(x) {
  var neg = x < 0, v = Math.abs(x);
  var s = (Math.round(v * 100) / 100).toString().split('.');
  s[0] = s[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return (neg ? '−' : '') + s.join('.');
}
function nfD(x, d) {
  var neg = x < 0, v = Math.abs(x);
  var s = v.toFixed(d).split('.');
  s[0] = s[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return (neg ? '−' : '') + s.join('.');
}
function money(v)  { return '$' + nf(Math.round(v)); }
function money2(v) { return '$' + nfD(v, 2); }
function intN(x)   { return nf(Math.round(x)); }
function frac(a, b) {
  return '<span class="mf-outer"><span class="mf-num">' + a + '</span><span class="mf-den">' + b + '</span></span>';
}
/* Writes a term with its sign, so a negative term is always a subtraction. */
function term(coef, varName) {
  if (coef === 0) return '';
  var sign = coef > 0 ? ' + ' : ' − ';
  var abs  = Math.abs(coef);
  return sign + ((abs === 1 && varName) ? '' : intN(abs)) + (varName || '');
}
/* A linear expression in q, written the way a reader expects to see it. */
function lin(coef, konst, v) {
  var vn = v || 'q';
  return intN(coef) + vn + term(konst, '');
}
function cssv(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }

/* ════════════════════════════════════════════════════════════════════════
   SESSION PERSISTENCE
   ════════════════════════════════════════════════════════════════════════ */
function lsKey() {
  var n = (studentData.name || '').trim(), g = (studentData.group || '').trim();
  return 'fac_econ_mat__mat_expresiones__' + (n + '__' + g).replace(/\s+/g, '_');
}
function saveSession() {
  if (!studentData.name) return;
  var drawings = [], texts = [], photos = [];
  problems.forEach(function(p, i) {
    var dc = document.getElementById('dc' + i);
    if (dc && dc.width) {
      var blank = document.createElement('canvas');
      blank.width = dc.width; blank.height = dc.height;
      drawings.push(dc.toDataURL() === blank.toDataURL() ? null : dc.toDataURL('image/png'));
    } else { drawings.push(null); }
    var ta = document.getElementById('ta' + i);
    texts.push(ta ? ta.value : '');
    var pp = document.getElementById('pp' + i);
    photos.push((pp && pp.src && pp.src.indexOf('data:') === 0) ? pp.src : null);
  });
  var state = {
    name: studentData.name, group: studentData.group,
    answeredCount: answeredCount, correctCount: correctCount,
    choices: problems.map(function(p) { return p.studentChoice; }),
    drawings: drawings, texts: texts, photos: photos
  };
  try { localStorage.setItem(lsKey(), JSON.stringify(state)); } catch(e) {}
}
function loadSession(name, group) {
  var key = 'fac_econ_mat__mat_expresiones__' + (name + '__' + group).replace(/\s+/g, '_');
  try { var r = localStorage.getItem(key); return r ? JSON.parse(r) : null; } catch(e) { return null; }
}
function dismissRestore() { document.getElementById('restoreBar').style.display = 'none'; }
function checkForSavedSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  if (!name || !group) { document.getElementById('restoreBar').style.display = 'none'; return; }
  var saved = loadSession(name, group);
  var bar = document.getElementById('restoreBar');
  bar.style.display = (saved && saved.choices && saved.choices.some(function(c) { return c !== null; })) ? 'block' : 'none';
}
function observeSections() {
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
}

/* ════════════════════════════════════════════════════════════════════════
   START / RESTORE

function startLesson() {

  document.getElementById('lessonScreen').style.display  = 'block';

}
function restoreSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  var saved = loadSession(name, group);
  if (!saved) return;
  document.getElementById('restoreBar').style.display = 'none';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = currentAttempt(name, group);
  var rng = seededRng(name + group + att);
  buildLesson(rng);
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  observeSections();
  saved.choices.forEach(function(choice, idx) {
    if (choice !== null && choice !== undefined) confirmMC(idx, choice);
  });
  setTimeout(function() {
    if (saved.drawings) saved.drawings.forEach(function(dataUrl, i) {
      if (!dataUrl) return;
      var dc = document.getElementById('dc' + i);
      if (!dc || !dc.width) return;
      var img = new Image();
      img.onload = function() {
        var dpr = window.devicePixelRatio || 1;
        dc.getContext('2d').drawImage(img, 0, 0, dc.width / dpr, dc.height / dpr);
      };
      img.src = dataUrl;
    });
    if (saved.texts) saved.texts.forEach(function(txt, i) {
      if (!txt) return;
      var ta = document.getElementById('ta' + i);
      if (ta) ta.value = txt;
    });
    if (saved.photos) saved.photos.forEach(function(dataUrl, i) {
      if (!dataUrl) return;
      var pp = document.getElementById('pp' + i);
      if (!pp) return;
      pp.src = dataUrl; pp.style.display = 'block';
      var pz = document.getElementById('pz' + i);
      if (pz) pz.style.opacity = '0.4';
    });
  }, 300);
}

/* ════════════════════════════════════════════════════════════════════════
   CANVAS / TABS / PHOTO / HINT / RESULTS
   ════════════════════════════════════════════════════════════════════════ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#2d5a27';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e) { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e) { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(p[0], p[1]); ctx.stroke(); lx = p[0]; ly = p[1]; }
  function onUp() { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}
function switchTab(idx, panel, btn) {
  var prefix = 'wp_' + idx + '_';
  document.querySelectorAll('[id^="' + prefix + '"]').forEach(function(p) { p.classList.remove('active'); });
  document.getElementById(prefix + panel).classList.add('active');
  btn.closest('.wtabs').querySelectorAll('.wtab').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
}
function handlePhoto(idx, input) {
  if (!input.files || !input.files[0]) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    var img = document.getElementById('pp' + idx);
    img.src = e.target.result;
    img.style.display = 'block';
    document.getElementById('pz' + idx).style.opacity = '0.4';
    saveSession();
  };
  reader.readAsDataURL(input.files[0]);
}

function showResults() {
  /* ── Silent score reporting ── */
  if (SCORE_ENDPOINT) {
    try {
      fetch(SCORE_ENDPOINT, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          name:      studentData.name,
          group:     studentData.group,
          correct:   correctCount,
          score:     Math.round(correctCount / problems.length * 100),
          timestamp: new Date().toLocaleString('es-MX'),
          guide:     SCHOOL.guideTitle ? (SCHOOL.guideTitle['es'] || SCHOOL.guideTitle['en'] || '') : document.title.split('·')[0].trim()
        })
      });
    } catch(e) {}
  }

  var rb = document.getElementById('s_results');
  if (!rb) return;
  rb.style.display = 'block';
  setTimeout(function() {
    rb.classList.add('vis');
    rb.scrollIntoView({ behavior:'smooth', block:'center' });
  }, 50);
}

/* ════════════════════════════════════════════════════════════════════════
   ANSWER HANDLER · two taps to confirm
   ════════════════════════════════════════════════════════════════════════ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = '<strong>' + (isOk ? t('fb-correct') : t('fb-wrong')) + '</strong> ' + prob.exp;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (!prob || prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = '<strong>' + (isOk ? t('fb-correct') : t('fb-wrong')) + '</strong> ' + prob.exp;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

/* ════════════════════════════════════════════════════════════════════════
   ITEM ASSEMBLY
   Each item keeps both languages in i18n. The student always reads one of
   them: q, opts, hint and exp hold the active language and are the only
   fields the cards and the PDF ever touch.
   The runtime gate dumps questionText, options and explanation for external
   review, so those three carry both versions tagged [ES] and [EN]. They are
   an audit surface, never rendered anywhere in the guide.
   ════════════════════════════════════════════════════════════════════════ */
function bothTxt(o) {
  return (o.es === o.en) ? o.es : ('[ES] ' + o.es + '\n[EN] ' + o.en);
}
function bothOpts(o) {
  return o.es.map(function(s, i) {
    return (s === o.en[i]) ? s : ('[ES] ' + s + '   [EN] ' + o.en[i]);
  });
}
function mk(i18n, correctIdx, showWork) {
  return {
    i18n: i18n, correctIdx: correctIdx, showWork: showWork,
    title: i18n.title[LANG],
    q:     i18n.q[LANG],
    hint:  i18n.hint[LANG],
    exp:   i18n.exp[LANG],
    opts:  i18n.opts[LANG].slice(),
    questionText: bothTxt(i18n.q),
    explanation:  bothTxt(i18n.exp),
    options:      bothOpts(i18n.opts)
  };
}
function addItem(i18n, correctIdx, showWork) {
  var d = mk(i18n, correctIdx, showWork);
  problems.push({
    i18n: d.i18n, title: d.title, q: d.q, hint: d.hint, exp: d.exp, opts: d.opts,
    questionText: d.questionText, options: d.options, explanation: d.explanation,
    correctIdx: d.correctIdx, showWork: d.showWork,
    studentChoice: null, pendingChoice: null
  });
  buildOneCard(problems[problems.length - 1], problems.length - 1);
}
/* ════════════════════════════════════════════════════════════════════════
   WIDGET 1 · the expression assembled term by term
   The student moves the volume and the unit cost and watches which part of
   the expression reacts and which part refuses to move. That is the whole
   difference between a constant term and a term with a coefficient.
   ════════════════════════════════════════════════════════════════════════ */
function widgetExpressionBuilder(F0, v0, q0) {
  var host = document.createElement('div');
  host.className = 'section';
  document.getElementById('lessonBody').appendChild(host);
  var state = { F: F0, v: v0, q: q0 };

  function render() {
    var es    = LANG === 'es';
    var fixed = state.F;
    var varia = state.v * state.q;
    var total = fixed + varia;
    var per   = total / state.q;
    var pf    = Math.round(fixed / total * 100);
    var set = function(id, html) { var e = host.querySelector(id); if (e) e.innerHTML = html; };
    set('#w1ql', intN(state.q));
    set('#w1vl', money(state.v));
    set('#w1expr',
      '<span class="ec">' + intN(state.F) + '</span> + ' +
      '<span class="ev">' + intN(state.v) + '</span>q' +
      '  <span style="color:var(--text3)">con q = ' + intN(state.q) + '</span>');
    set('#w1eval',
      intN(state.F) + ' + ' + intN(state.v) + '(' + intN(state.q) + ') = ' +
      '<span class="ec">' + money(total) + '</span>');
    var bf = host.querySelector('#w1bf'), bv = host.querySelector('#w1bv');
    if (bf) bf.style.width = pf + '%';
    if (bv) bv.style.width = (100 - pf) + '%';
    set('#w1fix', money(fixed));
    set('#w1var', money(varia));
    set('#w1tot', money(total));
    set('#w1per', money2(per));
    set('#w1read', es
      ? '<strong>Lectura de negocio:</strong> con ' + intN(state.q) + ' bolsas al mes el costo total es ' + money(total) + ', del cual ' + money(fixed) + ' se pagaría igual aunque no se tostara una sola bolsa. Mueve el volumen y observa cuál de los dos números se queda quieto: ese es el término constante, y por eso no lleva la letra. El otro cambia en proporción exacta al volumen porque su coeficiente, ' + money(state.v) + ', es una tasa por bolsa. Fíjate también en el costo promedio por bolsa, ' + money2(per) + ': baja cuando el volumen sube, aunque ningún número de la expresión haya cambiado. Eso ocurre porque la parte fija se reparte entre más bolsas, y es la idea que cierra esta guía.'
      : '<strong>Business reading:</strong> at ' + intN(state.q) + ' bags a month the total cost is ' + money(total) + ', of which ' + money(fixed) + ' would be paid even if not a single bag were roasted. Move the volume and watch which of the two numbers stays still: that is the constant term, and that is why it carries no letter. The other one changes in exact proportion to volume because its coefficient, ' + money(state.v) + ', is a rate per bag. Look at the average cost per bag as well, ' + money2(per) + ': it falls as volume rises, even though no number in the expression has changed. That happens because the fixed part is spread over more bags, and it is the idea this guide closes with.');
  }

  function mount() {
    var es = LANG === 'es';
    host.innerHTML =
      '<div class="gcrd" data-widget="constructor-de-expresiones">' +
        '<div class="iw-head"><span class="iw-tag">' + (es ? 'Herramienta' : 'Tool') + '</span>' +
        '<span class="iw-title">' + (es ? 'La expresión, armada pieza por pieza' : 'The expression, assembled piece by piece') + '</span></div>' +
        '<div class="iw-sub">' + (es
          ? 'Aromas de Comala paga cada mes una renta y unos sueldos que no dependen de cuánto tueste, y además gasta una cantidad por cada bolsa que produce. Mueve las dos barras y observa la expresión de arriba: una de sus dos partes se queda fija mientras la otra crece con el volumen. Antes de pasar al primer reactivo, prueba a dejar el volumen en su valor más bajo y luego en el más alto sin tocar el costo por bolsa, y fíjate en cuál de los dos números de la expresión cambió. Ninguno cambió: lo que cambia es el valor que la expresión produce al evaluarla, no la expresión misma.'
          : 'Aromas de Comala pays rent and base salaries every month that do not depend on how much it roasts, and it also spends an amount on every bag it produces. Move the two bars and watch the expression above: one of its two parts stays put while the other grows with volume. Before moving on to the first item, try leaving the volume at its lowest value and then at its highest without touching the cost per bag, and notice which of the two numbers in the expression changed. Neither did: what changes is the value the expression produces when it is evaluated, not the expression itself.') + '</div>' +
        '<div class="iw-expr" id="w1expr"></div>' +
        '<div class="iw-note">' + (es ? 'Al evaluar' : 'Evaluated') + '</div>' +
        '<div class="iw-expr" id="w1eval"></div>' +
        '<div class="cgrid"><div class="cg">' +
          '<label>' + (es ? 'Bolsas producidas en el mes' : 'Bags produced in the month') + ': <span class="cval" id="w1ql"></span></label>' +
          '<input type="range" min="100" max="900" step="20" id="w1q" value="' + state.q + '">' +
        '</div><div class="cg">' +
          '<label>' + (es ? 'Costo de material por bolsa' : 'Material cost per bag') + ': <span class="cval" id="w1vl"></span></label>' +
          '<input type="range" min="30" max="70" step="1" id="w1v" value="' + state.v + '">' +
        '</div></div>' +
        '<div class="bar"><span class="bar-fix" id="w1bf"></span><span class="bar-var" id="w1bv"></span></div>' +
        '<div class="bar-key">' +
          '<span><i class="bar-fix"></i>' + (es ? 'Parte fija del mes' : 'Fixed part of the month') + '</span>' +
          '<span><i class="bar-var"></i>' + (es ? 'Parte que depende del volumen' : 'Part that depends on volume') + '</span>' +
        '</div>' +
        '<div class="metrics">' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Término constante' : 'Constant term') + '</div><div class="mnum cs" id="w1fix"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Término con la variable' : 'Term with the variable') + '</div><div class="mnum ps" id="w1var"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Costo total del mes' : 'Total cost of the month') + '</div><div class="mnum ts" id="w1tot"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Costo promedio por bolsa' : 'Average cost per bag') + '</div><div class="mnum cs" id="w1per"></div></div>' +
        '</div>' +
        '<div class="iw-read" id="w1read"></div>' +
      '</div>';
    var q = host.querySelector('#w1q'), v = host.querySelector('#w1v');
    q.addEventListener('input', function() { state.q = parseInt(q.value, 10); render(); });
    v.addEventListener('input', function() { state.v = parseInt(v.value, 10); render(); });
    render();
  }
  widgets.push(mount);
  mount();
}

/* ════════════════════════════════════════════════════════════════════════
   WIDGET 2 · which costs can be added together and which cannot
   Every chip is a real line of the monthly budget. Terms that count bags
   land in one group, amounts that arrive once a month land in the other,
   and the simplified expression is rebuilt as the student picks.
   ════════════════════════════════════════════════════════════════════════ */
function widgetLikeTerms(chips0, q0) {
  var host = document.createElement('div');
  host.className = 'section';
  document.getElementById('lessonBody').appendChild(host);
  var state = { on: chips0.map(function() { return true; }), q: q0, view: 'simple' };

  function sums() {
    var coef = 0, konst = 0;
    chips0.forEach(function(c, i) {
      if (!state.on[i]) return;
      if (c.perBag) coef += c.n; else konst += c.n;
    });
    return { coef: coef, konst: konst };
  }

  function render() {
    var es = LANG === 'es';
    var s  = sums();
    var picked = chips0.filter(function(c, i) { return state.on[i]; });
    var longForm = picked.map(function(c) {
      return c.perBag ? (intN(c.n) + 'q') : intN(c.n);
    }).join(' + ') || '0';
    var shortForm = (s.coef > 0 ? intN(s.coef) + 'q' : '') +
                    (s.coef > 0 && s.konst > 0 ? ' + ' : '') +
                    (s.konst > 0 ? intN(s.konst) : '');
    if (!shortForm) shortForm = '0';
    host.querySelectorAll('.chip').forEach(function(el, i) {
      el.classList.toggle('on', state.on[i]);
    });
    var e = host.querySelector('#w2expr');
    if (e) e.innerHTML = (state.view === 'simple')
      ? '<span class="ec">' + shortForm + '</span>'
      : longForm;
    var reduced = (s.coef > 0 ? 1 : 0) + (s.konst > 0 ? 1 : 0);
    var n = host.querySelector('#w2note');
    if (n) n.textContent = (state.view === 'simple')
      ? (es ? 'Términos reducidos: ' + reduced + ' de ' + picked.length
            : 'Terms after reducing: ' + reduced + ' of ' + picked.length)
      : (es ? 'Términos sin reducir: ' + picked.length : 'Terms before reducing: ' + picked.length);
    var val = s.coef * state.q + s.konst;
    host.querySelector('#w2ql').textContent = intN(state.q);
    host.querySelector('#w2coef').textContent = money(s.coef);
    host.querySelector('#w2konst').textContent = money(s.konst);
    host.querySelector('#w2val').textContent = money(val);
    host.querySelector('#w2val2').textContent = money(val);
    host.querySelector('#w2read').innerHTML = es
      ? '<strong>Lectura de negocio:</strong> las partidas que elegiste suman ' + money(s.coef) + ' por cada bolsa y ' + money(s.konst) + ' al mes, ocurra lo que ocurra. Sumar ' + money(s.coef) + ' con ' + money(s.konst) + ' no significaría nada: uno son pesos por bolsa y el otro son pesos por mes, y las unidades no coinciden. Esa es toda la regla de los términos semejantes, dicha en el idioma del negocio. Comprueba que reducir no cambia el resultado: con ' + intN(state.q) + ' bolsas, la forma larga y la corta dan el mismo total, ' + money(val) + '. Lo único que cambia es cuántos términos hay que leer.'
      : '<strong>Business reading:</strong> the lines you picked add up to ' + money(s.coef) + ' for every bag and ' + money(s.konst) + ' a month, whatever happens. Adding ' + money(s.coef) + ' to ' + money(s.konst) + ' would mean nothing: one is pesos per bag and the other is pesos per month, and the units do not match. That is the whole rule of like terms, said in the language of the business. Check that reducing changes nothing: at ' + intN(state.q) + ' bags, the long form and the short one give the same total, ' + money(val) + '. All that changes is how many terms there are to read.';
  }

  function mount() {
    var es = LANG === 'es';
    var chipHtml = chips0.map(function(c, i) {
      return '<button class="chip" data-i="' + i + '"><b>' + (c.perBag ? intN(c.n) + 'q' : intN(c.n)) + '</b>' +
             (es ? c.es : c.en) + '</button>';
    }).join('');
    host.innerHTML =
      '<div class="gcrd" data-widget="agrupador-de-terminos-semejantes">' +
        '<div class="iw-head"><span class="iw-tag">' + (es ? 'Herramienta' : 'Tool') + '</span>' +
        '<span class="iw-title">' + (es ? 'Lo que se suma con lo que se suma' : 'What adds up with what') + '</span></div>' +
        '<div class="iw-sub">' + (es
          ? 'Cada botón es una partida real del presupuesto mensual del negocio. Enciende y apaga las que quieras y mira cómo se rearma la expresión. Cambia entre las dos vistas: la forma larga lista cada partida por separado y la forma corta agrupa lo que es agrupable. Prueba a dejar encendidas solo partidas por bolsa, luego solo partidas fijas, y por último una mezcla. La pregunta que conviene hacerse en cada caso es por qué dos partidas se fundieron en un solo término y otras dos se quedaron separadas, aunque todas estén medidas en pesos.'
          : 'Every button is a real line in the monthly budget of the business. Switch them on and off and watch the expression rebuild itself. Move between the two views: the long form lists every line separately and the short form groups what can be grouped. Try leaving only per bag lines on, then only fixed lines, and finally a mix. The question worth asking each time is why two lines melted into a single term while two others stayed apart, even though all of them are measured in pesos.') + '</div>' +
        '<div class="chips">' + chipHtml + '</div>' +
        '<div class="mtabs">' +
          '<button class="mtab' + (state.view === 'long' ? ' active' : '') + '" data-v="long">' + (es ? 'Forma larga' : 'Long form') + '</button>' +
          '<button class="mtab' + (state.view === 'simple' ? ' active' : '') + '" data-v="simple">' + (es ? 'Forma reducida' : 'Reduced form') + '</button>' +
        '</div>' +
        '<div class="iw-expr" id="w2expr"></div>' +
        '<div class="iw-note" id="w2note"></div>' +
        '<div class="cgrid"><div class="cg">' +
          '<label>' + (es ? 'Bolsas del mes para comprobar' : 'Bags in the month, to check') + ': <span class="cval" id="w2ql"></span></label>' +
          '<input type="range" min="100" max="900" step="20" id="w2q" value="' + state.q + '">' +
        '</div><div class="cg">' +
          '<label>' + (es ? 'Las dos formas dan el mismo total' : 'Both forms give the same total') + '</label>' +
          '<div class="mnum ts" id="w2val"></div>' +
        '</div></div>' +
        '<div class="metrics">' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Suma por bolsa' : 'Per bag total') + '</div><div class="mnum cs" id="w2coef"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Suma fija del mes' : 'Fixed monthly total') + '</div><div class="mnum ps" id="w2konst"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Costo del mes' : 'Cost of the month') + '</div><div class="mnum ts" id="w2val2"></div></div>' +
        '</div>' +
        '<div class="iw-read" id="w2read"></div>' +
      '</div>';
    host.querySelectorAll('.chip').forEach(function(b) {
      b.addEventListener('click', function() {
        var i = parseInt(b.getAttribute('data-i'), 10);
        state.on[i] = !state.on[i];
        render();
      });
    });
    host.querySelectorAll('.mtab').forEach(function(b) {
      b.addEventListener('click', function() {
        state.view = b.getAttribute('data-v');
        host.querySelectorAll('.mtab').forEach(function(x) { x.classList.remove('active'); });
        b.classList.add('active');
        render();
      });
    });
    var q = host.querySelector('#w2q');
    q.addEventListener('input', function() { state.q = parseInt(q.value, 10); render(); });
    render();
  }
  widgets.push(mount);
  mount();
}

/* ════════════════════════════════════════════════════════════════════════
   WIDGET 3 · what the common factor reveals
   The same profit is written twice, expanded and factored, and the student
   watches the margin per bag appear as a coefficient. The average cost is
   built alongside it, because dividing by q is the other half of the story.
   ════════════════════════════════════════════════════════════════════════ */
function widgetMarginFactor(p0, v0, F0, q0) {
  var host = document.createElement('div');
  host.className = 'section';
  document.getElementById('lessonBody').appendChild(host);
  var state = { p: p0, v: v0, F: F0, q: q0 };

  function render() {
    var es  = LANG === 'es';
    var mg  = state.p - state.v;
    var pr  = mg * state.q - state.F;
    var avg = state.F / state.q + state.v;
    var be  = mg > 0 ? Math.ceil(state.F / mg) : null;
    var set = function(id, html) { var e = host.querySelector(id); if (e) e.innerHTML = html; };
    set('#w3pl', money(state.p));
    set('#w3vl', money(state.v));
    set('#w3ql', intN(state.q));
    set('#w3exp',
      '<span class="ev">' + intN(state.p) + '</span>q − ' + intN(state.F) + ' − <span class="ec">' + intN(state.v) + '</span>q');
    set('#w3fac',
      '(<span class="ev">' + intN(state.p) + '</span> − <span class="ec">' + intN(state.v) + '</span>)q − ' + intN(state.F) +
      '  =  <span class="ec">' + intN(mg) + '</span>q − ' + intN(state.F));
    set('#w3avg', frac(intN(state.F) + ' + ' + intN(state.v) + 'q', 'q') + ' = ' +
      frac(intN(state.F), 'q') + ' + ' + intN(state.v));
    set('#w3mg', money(mg));
    set('#w3pr', money(pr));
    set('#w3av', money2(avg));

  addSection(function(L) {
    var es = L === 'es';
    if (es) return '' +
      '<div class="stag">Concepto 1</div>' +
      '<h2>De la frase al símbolo: lo que se mueve y lo que se queda quieto</h2>' +
      '<p>En cualquier negocio conviven dos clases de cantidades. Unas se quedan quietas durante todo el mes: la renta del local, el sueldo base del tostador, la cuota de la plataforma de venta. Otras se mueven todos los días con la actividad: el grano, el empaque, la etiqueta. El álgebra empieza exactamente en esa distinción. A la cantidad que se mueve se le pone un nombre, casi siempre una letra, y con ella se arma una fórmula que sirve no para un mes en particular sino para cualquier mes. Esa letra es la <strong>variable</strong>, y elegirla con cuidado ya es parte del trabajo: escribir <em>q</em> para las bolsas producidas comunica mucho más que escribir <em>x</em>.</p>' +
      '<p>Una <strong>expresión algebraica</strong> es una combinación de números, letras y operaciones. Sus piezas se llaman <strong>términos</strong> y se separan unas de otras por sumas y restas. En una expresión como ' + intN(c1F) + ' + ' + intN(c1v) + 'q hay dos términos. El primero no contiene la variable y se llama <strong>término constante</strong>. El segundo sí la contiene, y el número que la multiplica es el <strong>coeficiente</strong>. En un contexto de negocio ese coeficiente jamás es un número suelto: siempre es una tasa, un <em>por cada</em>. El ' + intN(c1v) + ' significa ' + money(c1v) + ' por cada bolsa; el ' + intN(c1F) + ' significa ' + money(c1F) + ' al mes ocurra lo que ocurra.</p>' +
      '<p>Distinguir esos dos papeles evita el error más caro de todo el tema. Un costo fijo no se multiplica por el volumen, porque no se paga una vez por bolsa sino una vez por mes. Un costo unitario no se suma una sola vez, porque se repite en cada unidad. Una prueba rápida y muy confiable es la de las <strong>unidades</strong>: si un término está medido en pesos por bolsa, al multiplicarlo por bolsas queda en pesos y puede convivir con el término fijo; si se suma directamente al fijo sin multiplicar, se están sumando cosas que no son comparables.</p>' +
      '<p><strong>Evaluar</strong> una expresión es sustituir la variable por un número concreto y hacer las operaciones. Vale la pena pensar en la expresión como una máquina: entra un volumen y sale un costo. La expresión no cambia cuando cambia el volumen, lo que cambia es el resultado que produce. Esa diferencia entre la fórmula y su valor es sutil la primera vez y evidente después, y sostiene todo lo que sigue en esta guía.</p>' +
      '<div class="rules-grid">' +
        '<div class="rcard"><div class="rname">Variable</div><div class="rform">q</div><div class="rnote">La cantidad que se decide o se observa.</div></div>' +

      '</div>' +
      '<p><strong>Ejemplo resuelto.</strong> Aromas de Comala paga ' + money(c1F) + ' al mes de renta y sueldos base. Cada bolsa de café tostado consume ' + money(c1v) + ' entre grano, empaque y etiqueta. El dueño quiere una sola expresión que sirva para cualquier mes y saber cuánto costaría un mes de ' + intN(c1q) + ' bolsas.</p>' +

      '<strong>Lectura de negocio.</strong> Ese mes cada bolsa sale, en promedio, en ' + money2(c1per) + ', pero cuidado con leer mal ese dato: no es lo que cuesta producir una bolsa más, que son ' + money(c1v) + '. La diferencia entre ambas cifras es la renta repartida, y cambia con el volumen aunque la expresión no haya cambiado ni una coma.</p></div>';
    return '' +
      '<div class="stag">Concept 1</div>' +
      '<h2>From words to symbols: what moves and what stays put</h2>' +
      '<p>Two kinds of quantities live side by side in any business. Some stay put all month: the rent of the shop, the roaster’s base salary, the fee of the sales platform. Others move every day with activity: beans, packaging, labels. Algebra begins at exactly that distinction. The quantity that moves is given a name, almost always a letter, and with it a formula is built that serves not one particular month but any month. That letter is the <strong>variable</strong>, and choosing it with care is already part of the work: writing <em>q</em> for bags produced says far more than writing <em>x</em>.</p>' +
      '<p>An <strong>algebraic expression</strong> is a combination of numbers, letters and operations. Its pieces are called <strong>terms</strong> and they are separated from one another by additions and subtractions. In an expression such as ' + intN(c1F) + ' + ' + intN(c1v) + 'q there are two terms. The first carries no variable and is called the <strong>constant term</strong>. The second does carry it, and the number multiplying it is the <strong>coefficient</strong>. In a business setting that coefficient is never a loose number: it is always a rate, a <em>per each</em>. The ' + intN(c1v) + ' means ' + money(c1v) + ' for every bag; the ' + intN(c1F) + ' means ' + money(c1F) + ' a month whatever happens.</p>' +
      '<p>Telling those two roles apart prevents the most expensive mistake in the whole topic. A fixed cost is not multiplied by volume, because it is not paid once per bag but once per month. A unit cost is not added a single time, because it repeats on every unit. A quick and very reliable test is the one of <strong>units</strong>: if a term is measured in pesos per bag, multiplying it by bags leaves it in pesos and it can live next to the fixed term; if it is added straight to the fixed one without multiplying, things that are not comparable are being added together.</p>' +
      '<p>To <strong>evaluate</strong> an expression is to replace the variable with a concrete number and carry out the operations. It pays to think of the expression as a machine: a volume goes in and a cost comes out. The expression does not change when the volume changes, what changes is the result it produces. That difference between a formula and its value is subtle the first time and obvious afterwards, and it holds up everything that follows in this guide.</p>' +

  });

  widgetExpressionBuilder(w1F, w1v, w1q);

  /* ── Item 1 · translating a situation into an expression ── */
  var o1raw = [

  addItem({
    title: { es: 'El costo de un mes concreto', en: 'The cost of one particular month' },
