<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aritmética y Números Reales · Matemáticas Básicas · Facultad de Economía, Universidad de Colima</title>
<link rel="canonical" href="https://liaxa.mx/facultad_economia/matematicas_basicas/mat_aritmetica.html">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS ── fallback only; applyBranding() re-injects from SCHOOL ── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;
  --gold-bg:    #faf3e0;
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; object-fit:contain; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; min-width:0; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── LANGUAGE TOGGLE ── */
.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }
.dlist { font-family:'IBM Plex Mono',monospace; font-size:.78rem; color:var(--green-dark); background:var(--surface2); border-radius:8px; padding:.6rem .7rem; margin:.6rem 0; word-break:break-word; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); overflow-x:auto; }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── INTERACTIVE WIDGETS ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.iw-head { display:flex; align-items:baseline; gap:.6rem; margin-bottom:.3rem; flex-wrap:wrap; }
.iw-tag { font-size:.62rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; }
.iw-title { font-family:'Crimson Pro',serif; font-size:1.08rem; font-weight:700; }
.iw-sub { font-size:.8rem; color:var(--text2); margin-bottom:.85rem; }
.iw-canvas { display:block; width:100%; border-radius:8px; background:var(--surface2); }
.iw-read { margin-top:.85rem; background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 8px 8px 0; padding:.7rem .85rem; font-size:.82rem; color:var(--text2); }
.iw-read strong { color:var(--green-dark); }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (widget toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.3rem .7rem; font-size:.76rem; cursor:pointer; color:var(--text2); transition:all .14s; font-family:inherit; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--gold-bg); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }

/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos { gap: .9rem; }
  .wlogos img { height: 38px; max-width: 42%; }
  .wtitle { font-size: 1.35rem; }
  .stickybar { padding: .5rem .55rem; gap: .38rem; }
  .htitle { display: none; }
  .halexis { display: none; }
  .hsep { display: none; }
  .hlogos { gap: .3rem; }
  .hlogos img { height: 18px; max-width: 60px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 78px; overflow: hidden; text-overflow: ellipsis; }
  .lang-btn { padding: .26rem .48rem; font-size: .68rem; }
  .lbody { padding: 1.2rem .7rem 3rem; max-width: 100%; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .gcrd { padding: .9rem .75rem; }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}
</style>
</head>
<body>

<!-- ════════════════════ WELCOME ════════════════════ -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <div style="font-family:'Crimson Pro',serif;font-size:2rem;font-weight:700;letter-spacing:.06em;color:#1a4a8a;line-height:1;letter-spacing:.28em;text-indent:.28em">ALEXIS</div>
    </div>
    <div class="wtitle" id="wtitle-el">Aritmética y Números Reales</div>
    <div class="wcourse" id="wcourse-el">Matemáticas Básicas</div>
    <label class="flabel" for="sName" id="lbl-name-el">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" for="sGroup" id="lbl-group-el">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreTitle">Sesión guardada encontrada</strong><br>
      <span id="restoreMsg">¿Deseas continuar donde la dejaste?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Retomar sesión</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Empezar de nuevo</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="200" height="48" viewBox="-22 0 160 34" xmlns="http://www.w3.org/2000/svg"><polyline points="4,24 10,18 16,20 22,10" fill="none" stroke="#1a4a8a" stroke-width="2"/><circle cx="22" cy="10" r="2.5" fill="#c9a84c"/><line x1="32" y1="6" x2="32" y2="28" stroke="#c9a84c" stroke-width="2"/><text x="42" y="22" font-family="'Crimson Pro',serif" font-weight="700" letter-spacing="3" fill="#1a4a8a" font-size="16">LIAXA</text></svg>
    </div>
  </div>
</div>

<!-- ════════════════════ LESSON ════════════════════ -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo -->
      <img id="hlogo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle" id="htitle-el">Aritmética y Números Reales</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 120 34" xmlns="http://www.w3.org/2000/svg"><polyline points="4,24 10,18 16,20 22,10" fill="none" stroke="#1a4a8a" stroke-width="2"/><circle cx="22" cy="10" r="2.5" fill="#c9a84c"/><line x1="32" y1="6" x2="32" y2="28" stroke="#c9a84c" stroke-width="2"/><text x="42" y="22" font-family="'Crimson Pro',serif" font-weight="700" letter-spacing="3" fill="#1a4a8a" font-size="16">LIAXA</text></svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle">
      <button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button>
      <button class="lang-btn"        id="btn-en" onclick="setLang('en')">EN</button>
    </div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="dlbtn" id="dlBtn" onclick="generatePDF()">Descargar resultados en PDF</button>
    </div>
  </div>
</div>

<script>

/* ── Score reporting ─────────────────────────────────────────────────────────
   Sends grade silently to Google Sheet when student finishes.
   Set SCORE_ENDPOINT = '' to disable without breaking anything.
   ──────────────────────────────────────────────────────────────────────────── */
var SCORE_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzIje7cRD7iI77G2-t6LMJEHtvjnwrFOJXsbbLe_4phhI7h9AhjL2HoIil1C-IoEn8T/exec';
/* ════════════════════════════════════════════════════════════════════════
   SCHOOL CONFIG · edit ONLY this block to rebrand for a different school
   ════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:      '#1a4a8a',
  primaryDark:  '#0f2d5a',
  primaryBg:    '#e8edf5',
  accent:       '#c9a84c',
  accentBg:     '#faf3e0',
  pBR: 26,  pBG: 74,  pBB: 138,
  pAR: 201, pAG: 168, pAB: 76,
  darkPrimary:     '#4a7abf',
  darkPrimaryDark: '#7aaae0',
  darkPrimaryBg:   '#0e1e38',
  darkAccent:      '#d4b86a',

function getAttemptKey(name, group) {

}
function nextAttempt(name, group) {

  try { n = parseInt(localStorage.getItem(k) || '0', 10) || 0; } catch(e) {}
  n++;
  try { localStorage.setItem(k, String(n)); } catch(e) {}
  return n;
}

  var k = getAttemptKey(name, group);
  try { return parseInt(localStorage.getItem(k) || '1', 10) || 1; } catch(e) { return 1; }
}
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t2 = s ^ (s >>> 16);
    t2 = Math.imul(t2, 0x21f0aaad);
    t2 ^= (t2 >>> 15);
    t2 = Math.imul(t2, 0x735a2d97);
    return ((t2 ^ (t2 >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}
/* Shuffles the four options once and keeps both language versions aligned. */
function shuffleOpts(rawEs, rawEn, rng) {
  var p = shuffle([0, 1, 2, 3], rng);
  return {
    es: p.map(function(j) { return rawEs[j]; }),
    en: p.map(function(j) { return rawEn[j]; }),
    correctIdx: p.indexOf(0)
  };
}

function nf(x) {
  var neg = x < 0, v = Math.abs(x);
  var s = (Math.round(v * 10) / 10).toString().split('.');
  s[0] = s[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return (neg ? '−' : '') + s.join('.');
}
function nfD(x, d) {
  var neg = x < 0, v = Math.abs(x);
  var s = v.toFixed(d).split('.');
  s[0] = s[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return (neg ? '−' : '') + s.join('.');
}
function money(v)  { return '$' + nf(Math.round(v)); }
function money2(v) { return '$' + nfD(v, 2); }
function dec1(x)   { return x.toFixed(1); }
function dec2(x)   { return x.toFixed(2); }
function dec4(x)   { return x.toFixed(4); }
/* Rate written the way a report quotes it: 16 and not 16.00, 7.5 and not 7.50. */
function pctS(x) {
  var v = Math.round(x * 1000000) / 10000;
  if (Math.abs(v - Math.round(v)) < 1e-9) return String(Math.round(v));
  return String(Math.round(v * 100) / 100);
}
/* Rate as an option value, always two decimals so four choices stay distinct. */
function pct2(x)   { return (x * 100).toFixed(2) + '%'; }
function pct1(x)   { return nfD(x * 100, 1) + '%'; }
function pct0(x)   { return nf(Math.round(x * 100)) + '%'; }
function intN(x)   { return nf(Math.round(x)); }
function cssv(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
/* Money on a chart axis, where the value may legitimately be negative. */
function moneyAx(v) { return v < 0 ? '−$' + nf(Math.round(-v)) : '$' + nf(Math.round(v)); }

/* Units and periods, named in the language of the reader. */
function boxesEs(x) { return intN(x) + ' cajas'; }
function boxesEn(x) { return intN(x) + ' boxes'; }
function itemsEs(x) { return intN(x) + ' partidas'; }
function itemsEn(x) { return intN(x) + ' line items'; }
function ptsEs(x)   { return nf(Math.round(x * 100)) + ' puntos porcentuales'; }
function ptsEn(x)   { return nf(Math.round(x * 100)) + ' percentage points'; }
/* A month result named by what it actually is, profit or loss. */
function resultEs(v) { return v >= 0 ? money(v) + ' de utilidad' : money(-v) + ' de pérdida'; }
function resultEn(v) { return v >= 0 ? money(v) + ' of profit'   : money(-v) + ' of loss'; }
/* A deviation named by its direction, so no minus sign ever touches a peso sign. */
function devEs(v) { return v >= 0 ? money(v) + ' por encima del presupuesto' : money(-v) + ' por debajo del presupuesto'; }
function devEn(v) { return v >= 0 ? money(v) + ' over budget' : money(-v) + ' under budget'; }

/* ── 1 · THE LEDGER AND THE ORDER OF THE OPERATIONS ───────────────────────
   A month of a small firm is one arithmetic expression, and the parentheses
   in it are not decoration: they say which subtraction happens before which
   multiplication. Read the same figures in the wrong order and the month
   changes its result without a single peso having moved.                  */
function unitMargin(p, v)   { return p - v; }
function netUnits(q, r)     { return q - r; }
function monthResult(p, v, q, r, F) { return (p - v) * (q - r) - F; }
/* The same month with the returns never taken out of the units, which is
   the most common way the expression gets read wrong. */
function resultIgnoringReturns(p, v, q, F) { return (p - v) * q - F; }
/* Returns credited at the full price while the roasting cost stays booked. */
function resultReturnsAtPrice(p, v, q, r, F) { return p * (q - r) - v * q - F; }
/* The volume at which the month stops losing, once the returns are allowed for. */
function breakEvenBoxes(F, p, v, r) { return p <= v ? null : F / (p - v) + r; }
/* The change from one year to the next. Subtracting a loss adds to the gap,
   and that is the whole point of the sign rule. */
function yearChange(now, before) { return now - before; }

/* ── 2 · PARTS WRITTEN THREE WAYS ────────────────────────────────────────
   A fraction, a decimal and a percentage are the same part of the same
   base. Trouble starts when two percentages that hang from different bases
   are added as though they hung from the same one.                        */
function afterDiscount(L, d)        { return L * (1 - d); }
function chainPrice(L, d1, d2)      { return L * (1 - d1) * (1 - d2); }
function addedDiscountPrice(L, d1, d2) { return L * (1 - d1 - d2); }
function singleEquivalent(d1, d2)   { return 1 - (1 - d1) * (1 - d2); }
function withTax(x, iva)            { return x * (1 + iva); }
/* The invoice a clerk produces when the tax is taken from the list price
   instead of from the discounted base. */
function taxOnListTotal(L, q, d, iva) { return L * q * (1 - d + iva); }
function pointsGap(m1, m0)   { return m1 - m0; }
function relativeRise(m1, m0) { return m0 === 0 ? null : (m1 - m0) / m0; }

/* ── 3 · ORDER, DISTANCE AND ROUNDING ────────────────────────────────────
   Absolute value is not a sign eraser, it is the distance between the plan
   and the fact. Signed deviations add up to a comfortable number because
   an overspend and a saving cancel; distances refuse to cancel.           */
function deviation(real, budget)    { return real - budget; }
function absDeviation(real, budget) { return Math.abs(real - budget); }
function relDeviation(real, budget) { return budget === 0 ? null : (real - budget) / budget; }
function withinTolerance(real, budget, tol) { return Math.abs(real - budget) <= tol * budget; }
function roundTo(x, dec) { var f = Math.pow(10, dec); return Math.round(x * f) / f; }
/* The largest error one rounding can hide, and the largest the whole ledger
   can hide if every rounding happens to go the same way. */
function maxRoundingStep(dec)     { return 0.5 / Math.pow(10, dec); }
function worstAccumulated(n, dec) { return n * maxRoundingStep(dec); }
/* What the accumulated gap typically looks like when the roundings fall on
   both sides and cancel one another. */
function typicalAccumulated(n, dec) { return Math.sqrt(n) * maxRoundingStep(dec) * 0.577; }

/* ── 4 · EXACT DECIMALS, REPEATING DECIMALS AND THE LEFTOVER CENT ────────
   Every fraction of two whole numbers closes into an exact decimal or
   repeats forever, and which one it does is decided by the denominator
   alone. A share that repeats forever has to be cut somewhere, and the
   cut leaves a cent that belongs to somebody.                             */
function gcdInt(a, b) {
  a = Math.abs(Math.round(a)); b = Math.abs(Math.round(b));
  while (b) { var tmp = a % b; a = b; b = tmp; }
  return a || 1;
}
function isTerminating(M, n) {
  var d = n / gcdInt(M, n);
  while (d % 2 === 0) d /= 2;
  while (d % 5 === 0) d /= 5;
  return d === 1;
}
function exactShare(M, n)          { return n <= 0 ? null : M / n; }
function paidShare(M, n, dec) {
  var f = Math.pow(10, dec);
  return Math.floor(M / n * f + 1e-9) / f;
}
function shareLeftover(M, n, dec)  { return M - paidShare(M, n, dec) * n; }
/* The average yearly rate of two years is a root, and a root of a rational
   number is almost never rational: it gets approximated, never written out. */
function geoMean2(a, b)  { return Math.sqrt((1 + a) * (1 + b)) - 1; }
function arithMean2(a, b) { return (a + b) / 2; }
function totalGrowth(a, b) { return (1 + a) * (1 + b) - 1; }
function decimalKindEs(M, n) { return isTerminating(M, n) ? 'decimal exacto' : 'decimal periódico'; }
function decimalKindEn(M, n) { return isTerminating(M, n) ? 'an exact decimal' : 'a repeating decimal'; }

/* ════════════════════════════════════════════════════════════════════════
   OPTION BUILDERS · the key is always the first value handed in
   ════════════════════════════════════════════════════════════════════════ */
/* Four distinct numbers, each rendered once per language and kept aligned.
   The key is always the first value handed in. */
function valOpts2(correct, wrongs, fmtEs, fmtEn, rng) {
  var seen = {}, vals = [];
  function add(v) {
    if (typeof v !== 'number' || !isFinite(v)) return;
    var s = fmtEn(v);
    if (seen[s]) return;
    seen[s] = 1; vals.push(v);
  }
  add(correct);
  for (var i = 0; i < wrongs.length && vals.length < 4; i++) add(wrongs[i]);
  for (var j = 1; vals.length < 4 && j < 900; j++) {
    add(correct * (1 + j * 0.11 * (j % 2 ? 1 : -1)));
  }
  for (var k = 1; vals.length < 4 && k < 900; k++) add(correct + k * 0.41);
  return shuffleOpts(vals.map(fmtEs), vals.map(fmtEn), rng);
}
function valOpts(correct, wrongs, fmt, rng) {
  return valOpts2(correct, wrongs, fmt, fmt, rng);
}

function observeSections() {
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
}

function startLesson() {

  var group = document.getElementById('sGroup').value.trim();
  var err   = document.getElementById('startErr');
  if (!name || !group) { err.textContent = t('err-fields'); return; }
  err.textContent = '';

  answeredCount = 0; correctCount = 0;
  var att = nextAttempt(name, group);
  var rng = seededRng(name + group + att);
  buildLesson(rng);
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  observeSections();
}
function restoreSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  var saved = loadSession(name, group);
  if (!saved) return;
  document.getElementById('restoreBar').style.display = 'none';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = currentAttempt(name, group);
  var rng = seededRng(name + group + att);
  buildLesson(rng);
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  observeSections();
  saved.choices.forEach(function(choice, idx) {
    if (choice !== null && choice !== undefined) confirmMC(idx, choice);
  });
  setTimeout(function() {
    if (saved.drawings) saved.drawings.forEach(function(dataUrl, i) {
      if (!dataUrl) return;
      var dc = document.getElementById('dc' + i);
      if (!dc || !dc.width) return;
      var img = new Image();
      img.onload = function() {
        var dpr = window.devicePixelRatio || 1;
        dc.getContext('2d').drawImage(img, 0, 0, dc.width / dpr, dc.height / dpr);
      };
      img.src = dataUrl;
    });
    if (saved.texts) saved.texts.forEach(function(txt, i) {
      if (!txt) return;
      var ta = document.getElementById('ta' + i);
      if (ta) ta.value = txt;
    });
    if (saved.photos) saved.photos.forEach(function(dataUrl, i) {
      if (!dataUrl) return;
      var pp = document.getElementById('pp' + i);
      if (!pp) return;
      pp.src = dataUrl; pp.style.display = 'block';
      var pz = document.getElementById('pz' + i);
      if (pz) pz.style.opacity = '0.4';
    });
  }, 300);
}

function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#2d5a27';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e) { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e) { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(p[0], p[1]); ctx.stroke(); lx = p[0]; ly = p[1]; }
  function onUp() { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}
function switchTab(idx, panel, btn) {
  var prefix = 'wp_' + idx + '_';
  document.querySelectorAll('[id^="' + prefix + '"]').forEach(function(p) { p.classList.remove('active'); });

function showResults() {

/* ════════════════════════════════════════════════════════════════════════
   ANSWER HANDLER · two taps to confirm
   ════════════════════════════════════════════════════════════════════════ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = '<strong>' + (isOk ? t('fb-correct') : t('fb-wrong')) + '</strong> ' + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (!prob || prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = '<strong>' + (isOk ? t('fb-correct') : t('fb-wrong')) + '</strong> ' + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

/* ════════════════════════════════════════════════════════════════════════
   CANVAS PRIMITIVES FOR THE WIDGETS
   ════════════════════════════════════════════════════════════════════════ */
function fitCanvas(cv, h) {
  var dpr = window.devicePixelRatio || 1;
  var w = Math.max(240, cv.clientWidth || cv.parentNode.clientWidth || 300);
  cv.style.height = h + 'px';
  cv.width  = Math.round(w * dpr);
  cv.height = Math.round(h * dpr);
  var ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  return { ctx: ctx, w: w, h: h };
}
function palette() {
  return {
    green: cssv('--green'), dark: cssv('--green-dark'), tint: cssv('--green-bg'),
    gold: cssv('--gold'), bad: cssv('--bad'), border: cssv('--border'),
    text: cssv('--text'), text2: cssv('--text2'), text3: cssv('--text3')
  };
}
function kindColor(P, kind) {
  if (kind === 'gold') return P.gold;
  if (kind === 'bad')  return P.bad;
  if (kind === 'tint') return P.tint;
  if (kind === 'soft') return P.text3;
  return P.dark;
}
/* Plots any curve given as a function of a quantity, a price or a count.
   A running balance, a distance to the budget and the value of one share
   as the partners multiply are all the same picture to this routine.
     opts.marks  points worth naming, such as the volume that breaks even
     opts.band   the stretch of the horizontal axis worth highlighting
     opts.hline  a reference amount drawn as a horizontal line
     opts.asym   the limit a curve approaches without reaching
     opts.at     where the student is standing right now                     */
function drawCurveChart(g, xMin, xMax, series, opts) {
  var ctx = g.ctx, P = palette(), W = g.w, H = g.h, i;
  var padL = 56, padR = 12, padT = 18, padB = 28;
  opts = opts || {};
  var fmtY  = opts.fmtY || function(v) { return intN(v); };
  var fmtX  = opts.fmtX || function(v) { return intN(v); };
  var STEPS = 140;
  var yLo = null, yHi = null;
  function note(v) {
    if (typeof v !== 'number' || !isFinite(v)) return;
    if (yLo === null || v < yLo) yLo = v;
    if (yHi === null || v > yHi) yHi = v;
  }
  series.forEach(function(s) {
    for (i = 0; i <= STEPS; i++) note(s.f(xMin + (xMax - xMin) * i / STEPS));
  });
  note(opts.yFloor); note(opts.yCeil);
  if (opts.hline) note(opts.hline.y);
  if (opts.asym)  note(opts.asym.y);
  if (yLo === null) { yLo = 0; yHi = 1; }
  if (yHi - yLo < 1) yHi = yLo + 1;
  var pd = (yHi - yLo) * 0.10;
  yLo -= pd; yHi += pd;
  function X(v) { return padL + (v - xMin) / (xMax - xMin) * (W - padL - padR); }
  function Y(v) { return H - padB - (v - yLo) / (yHi - yLo) * (H - padT - padB); }
  function Yc(v) { return Math.max(padT - 10, Math.min(H - padB + 10, Y(v))); }

  if (opts.band && opts.band.to > opts.band.from) {
    var b1 = X(Math.max(xMin, opts.band.from)), b2 = X(Math.min(xMax, opts.band.to));
    if (b2 > b1) {
      ctx.save();
      ctx.fillStyle = P.tint;
      ctx.fillRect(b1, padT - 8, b2 - b1, H - padB - padT + 8);
      ctx.restore();
    }
  }
  ctx.strokeStyle = P.border; ctx.lineWidth = 1;
  ctx.fillStyle = P.text3; ctx.font = '9px "IBM Plex Mono", monospace';
  for (i = 0; i <= 3; i++) {
    var gv = yLo + (yHi - yLo) * i / 3;
    ctx.beginPath(); ctx.moveTo(padL, Y(gv)); ctx.lineTo(W - padR, Y(gv)); ctx.stroke();
    var gl = fmtY(gv);
    ctx.fillText(gl, Math.max(1, padL - 4 - ctx.measureText(gl).width), Y(gv) + 3);
  }
  if (yLo < 0 && yHi > 0) {
    ctx.save();
    ctx.strokeStyle = P.text3; ctx.lineWidth = 1.4; ctx.setLineDash([3, 3]);
    ctx.beginPath(); ctx.moveTo(padL, Y(0)); ctx.lineTo(W - padR, Y(0)); ctx.stroke();
    ctx.restore();
  }
  if (opts.asym) {
    ctx.save();
    ctx.strokeStyle = P.bad; ctx.lineWidth = 1.3; ctx.setLineDash([5, 4]);
    ctx.beginPath(); ctx.moveTo(padL, Y(opts.asym.y)); ctx.lineTo(W - padR, Y(opts.asym.y)); ctx.stroke();
    ctx.restore();
    if (opts.asym.label) {
      ctx.fillStyle = P.bad; ctx.font = '600 9px "IBM Plex Sans", sans-serif';
      ctx.fillText(opts.asym.label, padL + 4, Math.max(10, Y(opts.asym.y) - 4));
    }
  }
  if (opts.hline) {
    ctx.save();
    ctx.strokeStyle = P.gold; ctx.lineWidth = 1.5; ctx.setLineDash([6, 3]);
    ctx.beginPath(); ctx.moveTo(padL, Y(opts.hline.y)); ctx.lineTo(W - padR, Y(opts.hline.y)); ctx.stroke();
    ctx.restore();
    if (opts.hline.label) {
      ctx.fillStyle = P.gold; ctx.font = '600 9px "IBM Plex Sans", sans-serif';
      var hw = ctx.measureText(opts.hline.label).width;
      ctx.fillText(opts.hline.label, W - padR - hw - 2, Math.max(10, Y(opts.hline.y) - 4));
    }
  }
  series.forEach(function(s) {
    ctx.strokeStyle = kindColor(P, s.kind); ctx.lineWidth = 2.2;
    ctx.beginPath();
    var started = false;
    for (i = 0; i <= STEPS; i++) {
      var xv = xMin + (xMax - xMin) * i / STEPS;
      var yv = s.f(xv);
      if (typeof yv !== 'number' || !isFinite(yv)) { started = false; continue; }
      var px = X(xv), py = Yc(yv);
      if (!started) { ctx.moveTo(px, py); started = true; } else { ctx.lineTo(px, py); }
    }
    ctx.stroke();
  });
  (opts.marks || []).forEach(function(m) {
    if (typeof m.x !== 'number' || !isFinite(m.x) || m.x < xMin || m.x > xMax) return;
    var cx = X(m.x), cy = Yc(m.y);
    ctx.save();
    ctx.strokeStyle = kindColor(P, m.kind || 'gold'); ctx.lineWidth = 1.4; ctx.setLineDash([4, 3]);
    ctx.beginPath(); ctx.moveTo(cx, H - padB); ctx.lineTo(cx, cy); ctx.stroke();
    ctx.restore();
    ctx.fillStyle = kindColor(P, m.kind || 'gold');
    ctx.beginPath(); ctx.arc(cx, cy, 4.2, 0, Math.PI * 2); ctx.fill();
    if (m.label) {
      ctx.font = '600 10px "IBM Plex Sans", sans-serif';
      var mw = ctx.measureText(m.label).width;
      ctx.fillText(m.label, Math.min(Math.max(2, cx - mw / 2), W - mw - 2), Math.max(10, cy - 9));
    }
  });
  if (typeof opts.at === 'number' && opts.at >= xMin && opts.at <= xMax) {
    ctx.save();
    ctx.strokeStyle = P.bad; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(X(opts.at), H - padB); ctx.lineTo(X(opts.at), padT - 6); ctx.stroke();
    ctx.restore();
  }
  ctx.strokeStyle = P.border; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(padL, padT - 8); ctx.lineTo(padL, H - padB); ctx.lineTo(W - padR, H - padB); ctx.stroke();
  ctx.fillStyle = P.text3; ctx.font = '9px "IBM Plex Mono", monospace';
  [xMin, (xMin + xMax) / 2, xMax].forEach(function(v) {
    var lab = fmtX(v), lw = ctx.measureText(lab).width;
    ctx.fillText(lab, Math.min(Math.max(1, X(v) - lw / 2), W - lw - 1), H - padB + 13);
  });
  var legX = padL + 4;
  ctx.font = '600 9.5px "IBM Plex Sans", sans-serif';
  series.forEach(function(s) {
    if (!s.label) return;
    ctx.fillStyle = kindColor(P, s.kind);
    ctx.fillRect(legX, 9, 9, 3);
    ctx.fillText(s.label, legX + 12, 13);
    legX += 12 + ctx.measureText(s.label).width + 12;
  });
  if (opts.xLabel) {
    ctx.fillStyle = P.text3; ctx.font = '9px "IBM Plex Sans", sans-serif';
    var xl = opts.xLabel;
    ctx.fillText(xl, W - padR - ctx.measureText(xl).width, H - 3);
  }
}

  }
  function update() {
    var es = LANG === 'es';

    var r = Math.min(state.r, q);
    var cm  = unitMargin(p, v);
    var nq  = netUnits(q, r);

    function bal(k) {
      if (k <= 0) return 0;

    host.querySelector('#g1gap').textContent = money(Math.abs(gap));
    host.querySelector('#g1steps').textContent = es

        'salen ' + money(F) + ' de gastos fijos  ·  ' +
        'el mes cierra en ' + resultEs(res)
      : 'In come ' + money(p * q) + ' from the ' + boxesEn(q) + ' invoiced  ·  ' +

        'out goes ' + money(v * nq) + ' of roasting and packing for the ' + boxesEn(nq) + ' the customer kept  ·  ' +
        'out go ' + money(F) + ' of fixed expenses  ·  ' +

      ], {

        xLabel: (es ? 'movimientos del mes, en orden' : 'movements of the month, in order')

      ], {

      });

      ? '<strong>Lectura de negocio:</strong> cada caja deja ' + money(cm) + ' después de pagar su propio tueste y empaque, y las ' + boxesEs(r) + ' devueltas reducen a ' + boxesEs(nq) + ' las que de verdad dejaron margen. Sobre esa base el mes cierra en ' + resultEs(res) + '. ' +
        (gap === 0
          ? 'Con cero devoluciones las dos lecturas coinciden, y por eso el error de orden pasa años sin notarse en una empresa que no acepta devoluciones.'
          : 'Quien ignora las devoluciones reporta ' + resultEs(ign) + ', una diferencia de ' + money(Math.abs(gap)) + ' que no viene de ningún dato equivocado sino de haber multiplicado antes de restar. ') +
        'La cifra que conviene fijar es el volumen de equilibrio: con estos gastos fijos hacen falta ' + (be === null ? 'un margen positivo' : boxesEs(be)) + ' facturadas para no perder, y esa cuenta ya trae dentro las devoluciones esperadas. Nota que el resultado se puede leer de dos maneras equivalentes, movimiento por movimiento o margen por caja, y que ambas dan lo mismo porque la resta se distribuye sobre el producto. Lo que nunca es equivalente es cambiar el orden entre una resta y una multiplicación.'
      : '<strong>Business reading:</strong> each box leaves ' + money(cm) + ' after paying for its own roasting and packing, and the ' + boxesEn(r) + ' returned bring down to ' + boxesEn(nq) + ' the ones that really left a margin. On that basis the month closes at ' + resultEn(res) + '. ' +
        (gap === 0
          ? 'With no returns at all the two readings agree, which is why an ordering mistake can go unnoticed for years in a company that takes nothing back.'
          : 'Whoever ignores the returns reports ' + resultEn(ign) + ', a difference of ' + money(Math.abs(gap)) + ' that comes from no wrong figure at all but from multiplying before subtracting. ') +
        'The number worth fixing in mind is the break-even volume: with these fixed expenses ' + (be === null ? 'a positive margin' : boxesEn(be)) + ' have to be invoiced in order not to lose, and that count already carries the expected returns inside it. Notice that the result can be read in two equivalent ways, movement by movement or margin per box, and that both give the same figure because subtraction distributes over the product. What is never equivalent is swapping the order of a subtraction and a multiplication.';
  }
  widgets.push(mount);
  mount();
}

/* ════════════════════════════════════════════════════════════════════════
   WIDGET 2 · two discounts that refuse to be added

function widgetDiscount(L0, d10, d20, q0) {

  function mount() {

          : 'Café de Colima gives the chains a volume discount and then another one for paying on the spot. The first view holds the volume discount fixed and moves the prompt-payment one along the axis. The green line is the price actually charged, applying the second discount to whatever the first one left; the grey line is the price you get by adding the two percentages and taking them off in one go. Start with small discounts and the two almost coincide, which is why this mistake survives so long inside price lists. Raise them and the gap opens; push them to the extreme and the grey line crosses zero, which is a promise to give the coffee away and pay for delivering it, while the green line never reaches zero however many discounts are chained. That is the idea of the block: each percentage hangs from a different base, and the second discount hangs from an amount the first one already shrank. The second view carries the whole order through to the invoice, with the sixteen percent tax, and compares the correct total against the one produced by charging the tax on the list price.') + '</div>' +
        '<div class="mtabs">' + tabs + '</div>' +
        '<div class="cgrid"><div class="cg">' +
          '<label>' + (es ? 'Precio de lista de la caja' : 'List price of the box') + ': <span class="cval" id="g2Ll"></span></label>' +
          '<input type="range" min="200" max="900" step="10" id="g2L" value="' + state.L + '">' +
        '</div><div class="cg">' +
          '<label>' + (es ? 'Descuento por volumen' : 'Volume discount') + ': <span class="cval" id="g2d1l"></span></label>' +
          '<input type="range" min="0" max="40" step="1" id="g2d1" value="' + Math.round(state.d1 * 100) + '">' +
        '</div></div>' +
        '<div class="cgrid"><div class="cg">' +
          '<label>' + (es ? 'Descuento por pago inmediato' : 'Prompt-payment discount') + ': <span class="cval" id="g2d2l"></span></label>' +
          '<input type="range" min="0" max="30" step="1" id="g2d2" value="' + Math.round(state.d2 * 100) + '">' +
        '</div><div class="cg">' +
          '<label>' + (es ? 'Cajas del pedido' : 'Boxes in the order') + ': <span class="cval" id="g2ql"></span></label>' +
          '<input type="range" min="20" max="200" step="10" id="g2q" value="' + state.q + '">' +
        '</div></div>' +
        '<canvas class="iw-canvas" id="g2cv"></canvas>' +
        '<div class="dlist" id="g2steps"></div>' +
        '<div class="metrics">' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Precio tras el primer descuento' : 'Price after the first discount') + '</div><div class="mnum ts" id="g2p1"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Precio final por caja' : 'Final price per box') + '</div><div class="mnum cs" id="g2p2"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Descuento único equivalente' : 'Single equivalent discount') + '</div><div class="mnum ps" id="g2eq"></div></div>' +

          '<div class="metric"><div class="mlbl">' + (es ? 'Total del pedido con impuesto' : 'Order total with tax') + '</div><div class="mnum cs" id="g2tot"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Error del impuesto sobre lista' : 'Error of taxing the list price') + '</div><div class="mnum ts" id="g2terr"></div></div>' +
        '</div>' +
        '<div class="iw-read" id="g2read"></div>' +
      '</div>';
    host.querySelectorAll('.mtab').forEach(function(b) {
      b.addEventListener('click', function() {

        host.querySelectorAll('.mtab').forEach(function(x) { x.classList.remove('active'); });
        b.classList.add('active');
        update();

    host.querySelector('#g2L').addEventListener('input',  function() { state.L  = parseInt(this.value, 10); update(); });

    host.querySelector('#g2terr').textContent = money2(Math.abs(bad - tot));
    host.querySelector('#g2steps').textContent = es

    var g = fitCanvas(host.querySelector('#g2cv'), 185);
    if (state.view === 'cadena') {
      drawCurveChart(g, 0, 0.40, [
        { f: function(x) { return L * (1 - d1) * (1 - x); }, kind: 'green', label: (es ? 'Precio encadenado' : 'Chained price') },
        { f: function(x) { return L * (1 - d1 - x); },       kind: 'soft',  label: (es ? 'Precio sumando los descuentos' : 'Price adding the discounts') }
      ], {
        fmtY: function(y) { return moneyAx(y); }, fmtX: function(x) { return pct0(x); },
        hline: { y: p2, label: (es ? 'precio de hoy' : 'price today') },

        'El producto de los dos factores de descuento es siempre mayor que uno menos la suma, y por eso el descuento encadenado siempre resulta menor que la suma de los porcentajes. ' +
        'En la vista de la factura, el total correcto de ' + money2(tot) + ' sale de aplicar el impuesto sobre la base ya descontada. Calcularlo sobre el precio de lista infla el pedido en ' + money2(Math.abs(bad - tot)) + ', y la diferencia crece exactamente en proporción al descuento concedido, así que el error castiga justo a los clientes que más compran.'
      : '<strong>Business reading:</strong> with ' + pct0(d1) + ' and ' + pct0(d2) + ' chained, the customer does not receive ' + pct0(d1 + d2) + ' but ' + pct2(eq) + '. The difference of ' + pct2(err) + ' looks small and on this order of ' + boxesEn(q) + ' it is worth ' + money2(Math.abs(L * q * ((d1 + d2) - eq))) + ', which is money somebody has to absorb when the invoice does not match the quotation. ' +

  }
  widgets.push(mount);
  mount();

function widgetDeviation(P0, R0, n0, tol0) {
  var host = document.createElement('div');
  host.className = 'section';
  document.getElementById('lessonBody').appendChild(host);
  var state = { view: 'distancia', P: P0, R: R0, n: n0, tol: tol0 };
  function mount() {
    var es = LANG === 'es';
    var MODES = [
      { id: 'distancia', es: 'La distancia al presupuesto', en: 'The distance to the budget' },
      { id: 'redondeo',  es: 'El redondeo que se acumula',  en: 'The rounding that piles up' }
    ];
    var tabs = MODES.map(function(m) {
      return '<button class="mtab' + (m.id === state.view ? ' active' : '') + '" data-m="' + m.id + '">' + m[LANG] + '</button>';
    }).join('');
    host.innerHTML =
      '<div class="gcrd" data-widget="valor-absoluto-desviaciones-y-redondeo-acumulado">' +
        '<div class="iw-head"><span class="iw-tag">' + (es ? 'Herramienta' : 'Tool') + '</span>' +
        '<span class="iw-title">' + (es ? 'Qué tan lejos quedó del plan' : 'How far it landed from the plan') + '</span></div>' +
        '<div class="iw-sub">' + (es
          ? 'La contralora de Café de Colima revisa una partida del presupuesto. La primera vista dibuja la distancia entre lo gastado y lo presupuestado: es una uve con el vértice apoyado justo en el presupuesto, porque gastar de más y gastar de menos son la misma distancia medida hacia lados opuestos. La franja verde es la tolerancia que la empresa acepta y la línea dorada marca su altura. Arrastra el gasto real de un extremo al otro y observa que la uve nunca baja de cero: una distancia no tiene signo, y esa es la razón de que las desviaciones se sumen en valor absoluto cuando se quiere saber qué tan desordenado estuvo el mes. Si se sumaran con signo, un ahorro en una partida taparía un sobregiro en otra y el reporte diría que todo salió según el plan. La segunda vista cambia de escala y va a la letra chica: el sistema redondea cada renglón de la factura al peso, y cada redondeo esconde hasta medio peso. Mueve el número de partidas y compara la línea dorada, que supone que todos los redondeos se van hacia el mismo lado, con la verde, que es lo que suele pasar cuando se compensan entre sí.'
          : 'The controller at Café de Colima is reviewing one budget line. The first view draws the distance between what was spent and what was planned: a V with its vertex resting exactly on the budget, because overspending and underspending are the same distance measured towards opposite sides. The green band is the tolerance the company accepts and the gold line marks its height. Drag the actual spend from one end to the other and notice that the V never drops below zero: a distance carries no sign, and that is why deviations are added in absolute value when the question is how disorderly the month really was. Added with their signs, a saving on one line would bury an overspend on another and the report would say everything went to plan. The second view changes scale and goes to the small print: the system rounds every line of the invoice to the peso, and each rounding hides up to half a peso. Move the number of line items and compare the gold line, which assumes every rounding falls the same way, with the green one, which is what usually happens when they cancel one another out.') + '</div>' +
        '<div class="mtabs">' + tabs + '</div>' +
        '<div class="cgrid"><div class="cg">' +

          '<div class="metric"><div class="mlbl">' + (es ? 'Redondeo acumulado en el peor caso' : 'Worst-case accumulated rounding') + '</div><div class="mnum cs" id="g3rnd"></div></div>' +

    host.querySelectorAll('.mtab').forEach(function(b) {

        b.classList.add('active');
        update();
      });
    });
    host.querySelector('#g3P').addEventListener('input', function() { state.P = parseInt(this.value, 10); update(); });
    host.querySelector('#g3R').addEventListener('input', function() { state.R = parseInt(this.value, 10); update(); });
    host.querySelector('#g3t').addEventListener('input', function() { state.tol = parseInt(this.value, 10) / 100; update(); });
    host.querySelector('#g3n').addEventListener('input', function() { state.n = parseInt(this.value, 10); update(); });
    update();
  }
  function update() {
    var es = LANG === 'es';
    var P = state.P, R = state.R, tol = state.tol, n = state.n;
    var dev = deviation(R, P);
    var abs = absDeviation(R, P);
    var rel = relDeviation(R, P);
    var ok  = withinTolerance(R, P, tol);
    var cap = tol * P;
    var worst = worstAccumulated(n, 0);
    var typical = typicalAccumulated(n, 0);
    host.querySelector('#g3Pl').textContent = money(P);
    host.querySelector('#g3Rl').textContent = money(R);
    host.querySelector('#g3tl').textContent = pct0(tol);
    host.querySelector('#g3nl').textContent = es ? itemsEs(n) : itemsEn(n);

    host.querySelector('#g3in').textContent  = ok ? (es ? 'dentro' : 'inside') : (es ? 'fuera' : 'outside');
    host.querySelector('#g3cap').textContent = money(cap);
    host.querySelector('#g3rnd').textContent = money2(worst);
    host.querySelector('#g3steps').textContent = es
      ? 'El presupuesto de la partida es ' + money(P) + ' y se ejerció ' + money(R) + '  ·  ' +

        'la distancia al plan es ' + money(abs) + ', que sobre la base presupuestada representa ' + pct2(Math.abs(rel)) + '  ·  ' +
        'la tolerancia del ' + pct0(tol) + ' admite hasta ' + money(cap)
      : 'The budget for the line is ' + money(P) + ' and ' + money(R) + ' was spent  ·  ' +
        'the deviation came out ' + devEn(dev) + '  ·  ' +
        'the distance to the plan is ' + money(abs) + ', which against the budgeted base is ' + pct2(Math.abs(rel)) + '  ·  ' +
        'the ' + pct0(tol) + ' tolerance allows up to ' + money(cap);
    var g = fitCanvas(host.querySelector('#g3cv'), 185);
    if (state.view === 'distancia') {
      drawCurveChart(g, P * 0.4, P * 1.8, [
        { f: function(x) { return Math.abs(x - P); }, kind: 'green', label: (es ? 'Distancia al presupuesto' : 'Distance to the budget') }
      ], {
        yFloor: 0, fmtY: function(y) { return money(y); }, fmtX: function(x) { return money(x); },
        band: { from: P * (1 - tol), to: P * (1 + tol) },
        hline: { y: cap, label: (es ? 'tolerancia' : 'tolerance') },
        marks: [{ x: P, y: 0, label: (es ? 'presupuesto' : 'budget'), kind: 'gold' }],
        at: R,
        xLabel: (es ? 'gasto real de la partida' : 'actual spend on the line')
      });
    } else {
      drawCurveChart(g, 1, Math.max(50, n), [
        { f: function(x) { return worstAccumulated(x, 0); },   kind: 'gold',  label: (es ? 'Si todos se van al mismo lado' : 'If every rounding falls one way') },
        { f: function(x) { return typicalAccumulated(x, 0); }, kind: 'green', label: (es ? 'Cuando se compensan' : 'When they cancel out') }
      ], {
        yFloor: 0, fmtY: function(y) { return money2(y); }, fmtX: function(x) { return intN(x); },
        at: n,
        xLabel: (es ? 'renglones redondeados al peso' : 'lines rounded to the peso')
      });
    }
    host.querySelector('#g3read').innerHTML = es
      ? '<strong>Lectura de negocio:</strong> la partida quedó ' + devEs(dev) + ', o sea a una distancia de ' + money(abs) + ' del plan, que sobre la base presupuestada es ' + pct2(Math.abs(rel)) + ' y ' + (ok ? 'cabe dentro de la tolerancia del ' + pct0(tol) + ', así que no dispara ninguna alarma.' : 'rebasa la tolerancia del ' + pct0(tol) + ', que admitía cuando mucho ' + money(cap) + '.') +
        ' Las dos cifras dicen cosas distintas y hay que reportar las dos: los pesos dicen cuánto dinero hay que conseguir y el porcentaje dice qué tan mal se estimó. Una partida chica puede desviarse mucho en porcentaje y no mover la caja; una partida grande puede desviarse poco en porcentaje y llevarse el presupuesto entero. ' +
        'En la letra chica, redondear al peso ' + itemsEs(n) + ' puede mover hasta ' + money2(worst) + ' si todos los redondeos se van al mismo lado, mientras que lo típico es del orden de ' + money2(typical) + '. Ninguna de las dos cifras es despreciable cuando la tolerancia es de ' + money(cap) + ', y de ahí la regla práctica del bloque: se redondea al final del cálculo, nunca en cada renglón.'
      : '<strong>Business reading:</strong> the line came out ' + devEn(dev) + ', that is, at a distance of ' + money(abs) + ' from the plan, which against the budgeted base is ' + pct2(Math.abs(rel)) + ' and ' + (ok ? 'fits inside the ' + pct0(tol) + ' tolerance, so it triggers no alarm.' : 'breaks the ' + pct0(tol) + ' tolerance, which allowed at most ' + money(cap) + '.') +
        ' The two figures say different things and both belong in the report: the pesos say how much money has to be found and the percentage says how badly the estimate was made. A small line can deviate enormously in percentage terms and never move the bank account; a large line can deviate slightly in percentage terms and swallow the whole budget. ' +
        'In the small print, rounding ' + itemsEn(n) + ' to the peso can move as much as ' + money2(worst) + ' if every rounding falls the same way, while the typical figure is of the order of ' + money2(typical) + '. Neither number is negligible when the tolerance is ' + money(cap) + ', and hence the practical rule of this block: round at the end of the calculation, never on every line.';
  }
  widgets.push(mount);
  mount();
}

/* ════════════════════════════════════════════════════════════════════════
   WIDGET 4 · the share that does not close, and the cent left over
   ════════════════════════════════════════════════════════════════════════ */
function widgetShare(M0, n0, dec0, k0) {
  var host = document.createElement('div');

  document.getElementById('lessonBody').appendChild(host);

  function mount() {

    var MODES = [
      { id: 'reparto', es: 'El sobrante repartición tras repartición', en: 'The leftover payout after payout' },

    ];
    var tabs = MODES.map(function(m) {

    host.innerHTML =
      '<div class="gcrd" data-widget="reparto-decimal-exacto-o-periodico-y-el-centavo-sobrante">' +
        '<div class="iw-head"><span class="iw-tag">' + (es ? 'Herramienta' : 'Tool') + '</span>' +
        '<span class="iw-title">' + (es ? 'La parte que no cierra' : 'The share that will not close') + '</span></div>' +
        '<div class="iw-sub">' + (es
          ? 'Café de Colima reparte el excedente del mes entre sus socios y el sistema paga con dos decimales, porque no existe la moneda de medio centavo. La segunda vista es la que conviene abrir primero: dibuja cuánto le toca a cada socio según cuántos socios haya, y marca en dorado los repartos que caen en un decimal exacto. Notarás que son pocos y que siguen un patrón, porque una fracción cierra en decimales solo cuando su denominador reducido se arma con doses y cincos, los factores de nuestro sistema de numeración. Con cualquier otro denominador el decimal se repite para siempre y hay que cortarlo en algún lado. La primera vista muestra qué pasa cuando se corta: cada reparto deja un sobrante que se queda en la cuenta de la empresa, y la línea verde lo acumula mes con mes. La línea gris es la alternativa de redondear hacia arriba, donde el que pone la diferencia es la empresa en lugar de los socios. Sube el número de socios y mira crecer las dos: el centavo es minúsculo, y multiplicado por socios y por meses deja de serlo.'
          : 'Café de Colima splits the surplus of the month among its partners and the system pays to two decimals, because there is no half-cent coin. The second view is the one to open first: it draws how much each partner receives depending on how many partners there are, and marks in gold the splits that land on an exact decimal. You will notice there are few of them and that they follow a pattern, because a fraction closes in decimals only when its reduced denominator is built out of twos and fives, the factors our numbering system runs on. With any other denominator the decimal repeats forever and has to be cut somewhere. The first view shows what happens when it is cut: every payout leaves a remainder sitting in the company account, and the green line accumulates it month after month. The grey line is the alternative of rounding up, where the company rather than the partners covers the difference. Raise the number of partners and watch both grow: the cent is minuscule, and multiplied by partners and by months it stops being so.') + '</div>' +
        '<div class="mtabs">' + tabs + '</div>' +
        '<div class="cgrid"><div class="cg">' +
          '<label>' + (es ? 'Excedente por repartir' : 'Surplus to be split') + ': <span class="cval" id="g4Ml"></span></label>' +
          '<input type="range" min="60000" max="600000" step="10000" id="g4M" value="' + state.M + '">' +
        '</div><div class="cg">' +
          '<label>' + (es ? 'Socios entre los que se reparte' : 'Partners it is split among') + ': <span class="cval" id="g4nl"></span></label>' +
          '<input type="range" min="2" max="24" step="1" id="g4n" value="' + state.n + '">' +
        '</div></div>' +
        '<div class="cgrid"><div class="cg">' +
          '<label>' + (es ? 'Decimales que el sistema paga' : 'Decimals the system pays') + ': <span class="cval" id="g4dl"></span></label>' +
          '<input type="range" min="0" max="4" step="1" id="g4d" value="' + state.dec + '">' +
        '</div><div class="cg">' +
          '<label>' + (es ? 'Repartos en el año' : 'Payouts in the year') + ': <span class="cval" id="g4kl"></span></label>' +
          '<input type="range" min="1" max="12" step="1" id="g4k" value="' + state.k + '">' +
        '</div></div>' +
        '<canvas class="iw-canvas" id="g4cv"></canvas>' +
        '<div class="dlist" id="g4steps"></div>' +
        '<div class="metrics">' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Parte exacta de cada socio' : 'Exact share of each partner') + '</div><div class="mnum ts" id="g4ex"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Parte que el sistema paga' : 'Share the system pays') + '</div><div class="mnum cs" id="g4pd"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Sobrante de este reparto' : 'Leftover of this payout') + '</div><div class="mnum ps" id="g4lo"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Sobrante del año' : 'Leftover for the year') + '</div><div class="mnum ps" id="g4yr"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Tipo de decimal' : 'Kind of decimal') + '</div><div class="mnum ts" id="g4kd"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Repartos que cierran exacto' : 'Splits that close exactly') + '</div><div class="mnum cs" id="g4ct"></div></div>' +
        '</div>' +
        '<div class="iw-read" id="g4read"></div>' +
      '</div>';
    host.querySelectorAll('.mtab').forEach(function(b) {
      b.addEventListener('click', function() {
        state.view = b.getAttribute('data-m');
        host.querySelectorAll('.mtab').forEach(function(x) { x.classList.remove('active'); });
        b.classList.add('active');
        update();
      });
    });
    host.querySelector('#g4M').addEventListener('input', function() { state.M = parseInt(this.value, 10); update(); });
    host.querySelector('#g4n').addEventListener('input', function() { state.n = parseInt(this.value, 10); update(); });
    host.querySelector('#g4d').addEventListener('input', function() { state.dec = parseInt(this.value, 10); update(); });
    host.querySelector('#g4k').addEventListener('input', function() { state.k = parseInt(this.value, 10); update(); });
    update();
  }
  function update() {
    var es = LANG === 'es';
    var M = state.M, n = state.n, dec = state.dec, k = state.k;
    var ex = exactShare(M, n);
    var pd = paidShare(M, n, dec);
    var lo = shareLeftover(M, n, dec);
    var up = Math.ceil(M / n * Math.pow(10, dec) - 1e-9) / Math.pow(10, dec) * n - M;
    var exact = isTerminating(M, n);
    var count = 0, exactList = [], i;
    for (i = 2; i <= 24; i++) { if (isTerminating(M, i)) { count++; if (exactList.length < 6) exactList.push(i); } }
    host.querySelector('#g4Ml').textContent = money(M);
    host.querySelector('#g4nl').textContent = intN(n) + (es ? ' socios' : ' partners');
    host.querySelector('#g4dl').textContent = intN(dec) + (es ? ' decimales' : ' decimals');

    host.querySelector('#g4pd').textContent = money2(pd);
    host.querySelector('#g4lo').textContent = money2(lo);
    host.querySelector('#g4yr').textContent = money2(lo * k);
    host.querySelector('#g4kd').textContent = es ? decimalKindEs(M, n) : decimalKindEn(M, n);
    host.querySelector('#g4ct').textContent = intN(count) + (es ? ' de 23' : ' of 23');
    host.querySelector('#g4steps').textContent = es
      ? 'Se reparten ' + money(M) + ' entre ' + intN(n) + ' socios  ·  ' +
        'la parte exacta vale ' + dec4(ex) + ' y es ' + decimalKindEs(M, n) + '  ·  ' +
        'el sistema paga ' + money2(pd) + ' a cada uno  ·  ' +
        'quedan sin repartir ' + money2(lo) + ' en este reparto y ' + money2(lo * k) + ' en el año'
      : 'A total of ' + money(M) + ' is split among ' + intN(n) + ' partners  ·  ' +
        'the exact share is ' + dec4(ex) + ' and it is ' + decimalKindEn(M, n) + '  ·  ' +
        'the system pays ' + money2(pd) + ' to each  ·  ' +
        'that leaves ' + money2(lo) + ' unsplit in this payout and ' + money2(lo * k) + ' over the year';
    var g = fitCanvas(host.querySelector('#g4cv'), 185);
    if (state.view === 'reparto') {
      drawCurveChart(g, 0, 12, [
        { f: function(x) { return lo * x; },  kind: 'green', label: (es ? 'Sobrante acumulado' : 'Leftover accumulated') },
        { f: function(x) { return -up * x; }, kind: 'soft',  label: (es ? 'Si se redondeara hacia arriba' : 'If it were rounded up') }
      ], {
        fmtY: function(y) { return y < 0 ? '−$' + nfD(-y, 2) : '$' + nfD(y, 2); }, fmtX: function(x) { return intN(x); },
        at: k,
        xLabel: (es ? 'repartos hechos en el año' : 'payouts made in the year')
      });
    } else {
      drawCurveChart(g, 2, 24, [
        { f: function(x) { return M / x; }, kind: 'green', label: (es ? 'Parte de cada socio' : 'Share of each partner') }
      ], {
        yFloor: 0, fmtY: function(y) { return money(y); }, fmtX: function(x) { return intN(x); },
        marks: exactList.map(function(d) { return { x: d, y: M / d, label: intN(d), kind: 'gold' }; }),
        at: n,
        xLabel: (es ? 'número de socios entre los que se reparte' : 'number of partners it is split among')
      });
    }
    host.querySelector('#g4read').innerHTML = es
      ? '<strong>Lectura de negocio:</strong> repartir ' + money(M) + ' entre ' + intN(n) + ' socios da una parte de ' + dec4(ex) + ', que es ' + decimalKindEs(M, n) + '. ' +
        (exact
          ? 'Este reparto cierra exacto y no deja sobrante, que es la excepción y no la regla: de los 23 repartos posibles entre dos y veinticuatro socios, solo ' + intN(count) + ' cierran así con este monto.'
          : 'Como el decimal no cierra, el sistema corta en ' + intN(dec) + ' decimales y paga ' + money2(pd) + ' a cada socio, con lo que quedan ' + money2(lo) + ' sin repartir. Con ' + intN(k) + ' repartos al año el residuo llega a ' + money2(lo * k) + '.') +
        ' Ese sobrante no se evapora ni se puede ignorar: o se le asigna a un socio bajo una regla escrita, o se acumula en una cuenta que el auditor va a encontrar. Redondear hacia arriba tampoco lo resuelve, solo cambia de bolsillo: entonces es la empresa la que pone ' + money2(up) + ' por reparto. La lección aritmética es que la escritura decimal es una herramienta de nuestro sistema de numeración y no una propiedad del número, y que toda fracción termina o se repite, sin una tercera posibilidad.'
      : '<strong>Business reading:</strong> splitting ' + money(M) + ' among ' + intN(n) + ' partners gives a share of ' + dec4(ex) + ', which is ' + decimalKindEn(M, n) + '. ' +
        (exact
          ? 'This split closes exactly and leaves nothing over, which is the exception rather than the rule: of the 23 possible splits between two and twenty-four partners, only ' + intN(count) + ' close that way with this amount.'
          : 'Since the decimal never closes, the system cuts at ' + intN(dec) + ' decimals and pays ' + money2(pd) + ' to each partner, which leaves ' + money2(lo) + ' unsplit. With ' + intN(k) + ' payouts a year the residue reaches ' + money2(lo * k) + '.') +
        ' That leftover neither evaporates nor can be ignored: either it is assigned to one partner under a written rule, or it accumulates in an account the auditor will find. Rounding up does not solve it either, it only changes whose pocket it comes from: then it is the company that puts in ' + money2(up) + ' per payout. The arithmetic lesson is that decimal writing is a tool of our numbering system rather than a property of the number, and that every fraction either terminates or repeats, with no third possibility.';
  }
  widgets.push(mount);
  mount();
}

    i18n: i18n, correctIdx: correctIdx, showWork: showWork,
    title: i18n.title[LANG], questionText: i18n.q[LANG],
    hint: i18n.hint[LANG], explanation: i18n.exp[LANG],

  };
}
function frac(a, b) {
  return '<span class="mf-outer"><span class="mf-num">' + a + '</span><span class="mf-den">' + b + '</span></span>';
}
/* The saving of the third line and the two overspends are drawn apart, and
   for one pair of draws the saving lands exactly on their sum. That would
   leave two identical options, so the saving is moved one step. */
function fixSaving(a, b, c) { return (c === a + b) ? c + 4000 : c; }

function buildLesson(rng) {
  problems = []; sectionDefs = []; widgets = [];

      '<p>Los conjuntos numéricos no se estudian por gusto de clasificar; cada uno entra al negocio cuando el anterior se queda corto. Los <strong>naturales</strong> cuentan cajas, clientes y días, y no admiten nada por debajo de cero. Los <strong>enteros</strong> aparecen la primera vez que hay una pérdida, un retiro o una devolución, porque el signo no es un adorno sino una dirección. Los <strong>racionales</strong> llegan con el primer precio partido, la primera participación de un socio y la primera tasa, ya que toda razón entre dos enteros vive ahí. Y los <strong>irracionales</strong> se cuelan en cuanto se saca una raíz, por ejemplo al buscar la tasa media de dos años de crecimiento. Todos juntos forman los <strong>números reales</strong>, que son los puntos de una recta sin huecos: cualquier cantidad medible de la empresa está en algún punto de ella.</p>' +

      '<p>El porcentaje trae siempre una base escondida, y ahí empiezan casi todos los errores del bloque. Cuando alguien dice que dio un descuento del quince por ciento, la cifra no significa nada hasta saber quince por ciento <strong>de qué</strong>. Dos porcentajes que cuelgan de bases distintas no se pueden sumar, igual que no se suman dos fracciones con distinto denominador sin convertirlas antes. Es la misma regla vestida de otra manera, y es la que se rompe todos los días en las listas de precios.</p>' +
      '<p>El caso que más aparece en la práctica es el <strong>descuento encadenado</strong>. Un descuento por volumen seguido de otro por pago inmediato no equivale a la suma de los dos, porque el segundo se aplica sobre lo que quedó del primero y no sobre el precio de lista. Cada descuento es en realidad un factor que multiplica: quitar el diez por ciento es multiplicar por nueve décimos. Encadenar descuentos es multiplicar factores, y el producto de dos factores menores que uno siempre resulta mayor que uno menos la suma de los dos descuentos. Por eso el descuento único equivalente siempre queda por debajo de la suma.</p>' +
      '<p>Falta una distinción que un reporte mal escrito confunde a diario: <strong>puntos porcentuales</strong> contra <strong>por ciento</strong>. Si el margen sube de doce a quince, subió tres puntos porcentuales, y en términos relativos subió la cuarta parte de donde estaba. Las dos frases son correctas y dicen cosas muy distintas; escribir una en el lugar de la otra es la forma más barata de exagerar un resultado. Termina el bloque una observación tranquilizadora: como el descuento y el impuesto son factores que multiplican, el orden entre ellos no altera el total, aunque la ley sí exija calcular el impuesto sobre la base ya descontada.</p>' +
      '<div class="rules-grid">' +
        '<div class="rcard"><div class="rname">Parte de una cantidad</div><div class="rform">' + frac('parte', 'todo') + '</div><div class="rnote">Fracción, decimal y porcentaje.</div></div>' +
        '<div class="rcard"><div class="rname">Quitar un descuento</div><div class="rform">precio · (1 − d)</div><div class="rnote">El descuento es un factor.</div></div>' +
