/* ================================================
   buildLesson — concept, manipulative, graded problems, interleaved (Rule 1)
   ================================================ */
function buildLesson(rng) {
  problems = []; answeredCount = 0; correctCount = 0;
  document.getElementById('lessonBody').innerHTML = '';

  /* ── CONCEPTO 1 ─────────────────────────────────────────────── */
  addSection(S('CONCEPTO 1','CONCEPT 1'),
    '<h2>' + S('Una norma no vale por quién la firma','A rule is not valid because of who signs it') + '</h2>' +
    '<p>' + S('En cualquier lugar donde convive gente hay normas: el salón, el equipo, la casa, el país. Sirven para que la convivencia no dependa de quién grita más fuerte. Pero existir no las vuelve justas. Ha habido normas escritas, votadas y firmadas que dejaban a personas enteras fuera de la escuela, del voto o de un trabajo, y por eso hoy se juzga a cada norma por lo que produce, no por el sello que trae.',
              'Anywhere people live together there are rules: the classroom, the team, the household, the country. They exist so that living together does not depend on who shouts loudest. But existing does not make them just. There have been rules that were written, voted on and signed and still shut whole groups of people out of school, out of the vote or out of a job, and that is why every rule is judged today by what it produces, not by the stamp it carries.') + '</p>' +
    '<p>' + S('Para juzgar una norma hay cuatro preguntas que se pueden hacer siempre, sin importar si se trata del reglamento de un club o de una ley del país. Se refieren a su finalidad, a quiénes alcanza, a cuánto castiga y a quién pudo opinar antes de que existiera. Una norma orientada a la igualdad, la libertad, la justicia y los derechos humanos responde bien a las cuatro.',
              'To judge a rule there are four questions you can always ask, whether it is a club\'s regulations or a national law. They are about its purpose, about who it reaches, about how much it punishes and about who could speak before it existed. A rule oriented toward equality, freedom, justice and human rights answers all four well.') + '</p>' +
    '<div class="rules-grid">' +
      '<div class="rcard"><div class="rname">' + S('Finalidad','Purpose') + '</div><div class="rform">' + S('¿qué protege?','what does it protect?') + '</div><div class="rnote">' + S('Toda norma debe poder decir qué problema resuelve o qué derecho cuida.','Every rule must be able to say which problem it solves or which right it protects.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Igualdad','Equality') + '</div><div class="rform">' + S('¿a quién obliga?','whom does it bind?') + '</div><div class="rnote">' + S('Quienes están en la misma situación reciben el mismo trato.','Those in the same situation get the same treatment.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Proporción','Proportion') + '</div><div class="rform">' + S('¿cuánto castiga?','how much does it punish?') + '</div><div class="rnote">' + S('La consecuencia se mide con la falta, no con el enojo de quien sanciona.','The consequence is measured against the offense, not against the anger of whoever sanctions.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Participación','Participation') + '</div><div class="rform">' + S('¿quién opinó?','who had a say?') + '</div><div class="rnote">' + S('Quienes van a cumplirla pudieron hablar antes de que se aprobara.','Those who will follow it could speak before it was approved.') + '</div></div>' +
    '</div>' +
    '<div class="callout"><p><strong>' + S('Ojo: ','Careful: ') + '</strong>' +
      S('que una mayoría apruebe algo lo vuelve válido, no necesariamente justo. Ninguna votación puede quitarle a un grupo un derecho que los demás conservan.',
        'A majority approving something makes it valid, not necessarily just. No vote can take from one group a right that everyone else keeps.') + '</p></div>' +
    buildNrm(rng));
  nrmRender();

  /* ── PROBLEMA 1 ─────────────────────────────────────────────── */
  addProblem(pick([
    { title:{ es:'La credencial olvidada', en:'The forgotten ID card' }, showWork:false,
      stmt:{ es:'Un grupo propone que quien olvide su credencial se quede fuera de la escuela el día completo. La medida alcanzaría a cualquier estudiante sin excepción, se explicó su propósito y se consultó a todos los grupos antes de proponerla. Aun así, la propuesta no se sostiene. ¿Por qué?',
             en:'A class proposes that anyone who forgets their ID card stays out of school for the whole day. The measure would reach any student without exception, its purpose was explained and every class was consulted before proposing it. Even so, the proposal does not hold up. Why?' },
      options:{ es:[
        'Porque perder el día entero de clases por un olvido menor es una consecuencia que no guarda relación con el tamaño de la falta.',
        'Porque la medida alcanzaría por igual a cualquier estudiante y una norma debe distinguir siempre entre unos casos y otros.',
        'Porque haber consultado a los grupos no basta: una norma escolar solo puede nacer de una propuesta de la dirección.',
        'Porque identificar a quien entra al plantel no protege nada y por lo tanto la propuesta carece de finalidad.' ],
        en:[
        'Because losing the whole school day over a small oversight is a consequence that bears no relation to the size of the offense.',
        'Because the measure would reach every student equally and a rule must always distinguish between some cases and others.',
        'Because consulting the classes is not enough: a school rule can only come from a proposal by the principal\'s office.',
        'Because identifying who enters the school protects nothing and therefore the proposal has no purpose.' ] },
      correct:0,
      hint:{ es:'Tres de las cuatro preguntas quedan bien respondidas en el enunciado. Fíjate en la única que el texto no menciona: la relación entre lo que se hizo y lo que se paga.',
             en:'Three of the four questions are well answered in the statement. Look at the only one the text does not mention: the relation between what was done and what is paid.' },
      explanation:{ es:'El enunciado ya resuelve la finalidad, la igualdad de trato y la participación. Lo que queda sin justificar es el peso de la consecuencia: un olvido de un objeto se paga con un día completo sin clases, es decir, con la pérdida de un derecho mucho mayor que la falta cometida.',
                    en:'The statement already settles purpose, equal treatment and participation. What remains unjustified is the weight of the consequence: forgetting an object is paid for with a full day without classes, that is, with the loss of a right far greater than the offense committed.' } },
    { title:{ es:'La escolta de la cabecera', en:'The flag escort from downtown' }, showWork:false,
      stmt:{ es:'Una asamblea escolar aprueba por amplia mayoría que solo puedan integrar la escolta quienes vivan en la cabecera municipal, porque así llegan más temprano a los ensayos. ¿Cuál es el problema de fondo de esa norma?',
             en:'A school assembly approves by a large majority that only those living in the municipal seat may join the flag escort, because that way they arrive earlier to rehearsals. What is the underlying problem with that rule?' },
      options:{ es:[
        'Separa a estudiantes que están en la misma situación usando el domicilio, que no dice nada sobre su capacidad para la tarea.',
        'Fue aprobada por amplia mayoría, y las decisiones de una asamblea escolar requieren siempre la unanimidad de quienes asisten.',
        'No fija ninguna consecuencia para quien la incumpla, y sin sanción escrita ninguna norma puede considerarse válida.',
        'La escolta es una actividad voluntaria y por esa razón no puede quedar regulada mediante una norma escrita.' ],
        en:[
        'It separates students who are in the same situation using their address, which says nothing about their ability for the task.',
        'It was approved by a large majority, and school assembly decisions always require unanimity from those attending.',
        'It sets no consequence for whoever breaks it, and without a written sanction no rule can be considered valid.',
        'The flag escort is a voluntary activity and for that reason it cannot be governed by a written rule.' ] },
      correct:0,
      hint:{ es:'Pregúntate si vivir lejos cambia en algo lo que la escolta exige, y si el número de votos puede reparar esa distinción.',
             en:'Ask whether living far away changes anything about what the escort requires, and whether the number of votes can repair that distinction.' },
      explanation:{ es:'Quien vive lejos puede desempeñar la tarea igual que quien vive cerca: el domicilio no tiene relación con lo que la escolta exige. La norma toma un rasgo ajeno a la actividad y lo convierte en un filtro, y la amplitud de la votación no corrige eso, porque ninguna mayoría vuelve justo un trato desigual sin razón.',
                    en:'Someone living far away can do the task just as well as someone living nearby: the address has nothing to do with what the escort requires. The rule takes a trait unrelated to the activity and turns it into a filter, and the size of the vote does not fix that, because no majority makes unequal treatment without reason just.' } }
  ], rng), rng);

  /* ── PROBLEMA 2 ─────────────────────────────────────────────── */
  addProblem(pick([
    { title:{ es:'Los viernes de la cancha', en:'Court Fridays' }, showWork:false,
      stmt:{ es:'En una asamblea escolar, la mayoría vota que el equipo de futbol de las alumnas pueda usar la cancha únicamente los viernes, mientras el resto de los equipos la usa cualquier día. Alguien responde que el resultado de la votación no vuelve justa esa norma. ¿Qué sostiene esa respuesta?',
             en:'At a school assembly, the majority votes that the girls\' football team may use the court only on Fridays, while the other teams use it any day. Someone answers that the result of the vote does not make that rule just. What supports that answer?' },
      options:{ es:[
        'Una mayoría puede decidir cómo se organiza el uso de la cancha, pero no puede retirarle a un grupo un acceso que los demás conservan sin una razón que lo explique.',
        'Las votaciones de una asamblea escolar carecen de validez mientras la dirección del plantel no las autorice por escrito antes de realizarse.',
        'Para que una votación escolar sea válida deben participar en ella todas las personas inscritas en el plantel, sin ninguna ausencia.',
        'La cancha es un espacio de uso común y por esa razón ninguna norma de la escuela puede regular los horarios en que se ocupa.' ],
        en:[
        'A majority can decide how the court\'s use is organized, but it cannot withdraw from one group an access everyone else keeps without a reason that explains it.',
        'School assembly votes have no validity while the principal\'s office has not authorized them in writing beforehand.',
        'For a school vote to be valid, every person enrolled in the school must take part in it, with no absences.',
        'The court is a shared space and for that reason no school rule can regulate the hours in which it is used.' ] },
      explanation:{ es:'Una asamblea puede repartir horarios, turnos y responsabilidades: eso es organizar. Lo que no puede hacer es dejar a un grupo con menos acceso que el resto cuando nada en la situación lo justifica. Contar votos define quién decide; no convierte en justa una decisión que recorta el derecho de unos cuantos.',
                    en:'An assembly can distribute hours, turns and responsibilities: that is organizing. What it cannot do is leave one group with less access than the rest when nothing in the situation justifies it. Counting votes defines who decides; it does not turn into justice a decision that cuts back the right of a few.' },
      hint:{ es:'Separa dos cosas: lo que una mayoría puede organizar y lo que ninguna mayoría puede quitar.',

      explanation:{ es:'Obligar a alguien siempre cuesta algo: aquí, quince minutos de su tiempo cada mañana. Ese costo necesita una razón que se pueda revisar y discutir. La costumbre explica de dónde viene la práctica, pero no dice qué se gana ni qué se cuida con ella, y por eso no alcanza para sostener una norma.',
                    en:'Obliging someone always costs something: here, fifteen minutes of their time every morning. That cost needs a reason that can be reviewed and discussed. Custom explains where the practice comes from, but it does not say what is gained or protected by it, and that is why it is not enough to sustain a rule.' },

             en:'Go back to the first of the four questions: before obliging, you must be able to say what for.' },

  ], rng), rng);

  /* ── CONCEPTO 2 ─────────────────────────────────────────────── */
  addSection(S('CONCEPTO 2','CONCEPT 2'),
    '<h2>' + S('Crear una norma es un recorrido','Creating a rule is a route') + '</h2>' +
    '<p>' + S('Una norma no aparece cuando alguien la escribe. Aparece al final de un recorrido que empieza mucho antes: hay que nombrar el problema que afecta a alguien, escuchar a quienes quedarán obligados, poner el acuerdo por escrito, llevarlo al lugar donde puede decidirse, darlo a conocer y volver a mirarlo cuando ya está funcionando. Ese mismo recorrido sirve para el reglamento de un salón y para una ley del país; cambia el tamaño, no los pasos.',
              'A rule does not appear when someone writes it. It appears at the end of a route that starts much earlier: you have to name the problem affecting someone, listen to those who will be bound, put the agreement in writing, take it to the place where it can be decided, make it known and look at it again once it is running. That same route works for a classroom code and for a national law; the size changes, not the steps.') + '</p>' +
    '<p>' + S('Cada paso sostiene al siguiente. Escuchar antes de redactar es lo que permite que el texto prevea obstáculos que desde un escritorio no se ven. Publicar antes de aplicar es lo que hace que la norma sea exigible: nadie puede cumplir lo que no conoce. Y fijar una fecha de revisión es lo que la mantiene viva, porque una norma que nunca se revisa termina defendiendo lo que ya no existe.',
              'Each step holds up the next. Listening before drafting is what lets the text foresee obstacles that cannot be seen from a desk. Publishing before applying is what makes the rule enforceable: nobody can follow what they do not know. And setting a review date is what keeps it alive, because a rule that is never reviewed ends up defending something that no longer exists.') + '</p>' +
    '<div class="callout"><p><strong>' + S('Lo importante: ','What matters: ') + '</strong>' +
      S('saltarse un paso no acelera la norma, la debilita. Casi siempre el paso que se salta es el de escuchar, y casi siempre ahí aparece después el problema.',
        'Skipping a step does not speed a rule up, it weakens it. The step skipped is almost always listening, and that is almost always where the problem shows up later.') + '</p></div>' +
    buildRut(rng));
  rutRender();

  addProblem(pick([

             en:'One afternoon a school\'s office drafts and approves the rule that every assignment must be submitted online before ten on Sunday night. Two weeks later it discovers that some students have no connection at home and are piling up unsubmitted work. What best explains what happened?' },
      options:{ es:[
        'La norma se redactó y aprobó sin escuchar a quienes iban a cumplirla, y por eso el texto no pudo prever un obstáculo que ellos conocían de sobra.',
        'La norma se publicó en el tablero de la entrada en lugar de difundirse por el medio que el estudiantado revisa todos los días.',

        'The rule was drafted and approved without listening to those who would have to follow it, so the text could not foresee an obstacle they knew all too well.',

      explanation:{ es:'El obstáculo no era un secreto: quienes no tienen conexión en casa lo saben todos los días. Nadie se los preguntó, así que el dato nunca llegó a la mesa donde se redactó el texto. Por eso la consulta no es un gesto de cortesía: es el paso que le da a la norma la información que desde un escritorio no se ve.',
                    en:'The obstacle was no secret: those without a connection at home live with it every day. Nobody asked them, so the fact never reached the table where the text was drafted. That is why consultation is not a courtesy: it is the step that gives the rule the information a desk cannot see.' },
      hint:{ es:'Pregúntate quién tenía la información que faltaba y en qué momento del recorrido debió haber entrado.',
             en:'Ask who had the missing information and at which moment of the route it should have entered.' },

    { title:{ es:'Sanciones por un texto que nadie leyó', en:'Sanctions from a text nobody read' }, showWork:false,
      stmt:{ es:'Un reglamento escolar se discute y se aprueba correctamente en el consejo, pero nunca se publica ni se lee en los salones. A la semana siguiente se sanciona a varios estudiantes por incumplirlo. ¿Cuál es la falla?',
             en:'A school code is discussed and properly approved by the council, but it is never posted or read in the classrooms. The following week several students are sanctioned for breaking it. What is the flaw?' },
      options:{ es:[
        'Se exigió el cumplimiento antes de que quienes debían cumplirlo pudieran conocerlo, y una norma que no se difunde todavía no es exigible.',
        'Se sancionó a varios estudiantes al mismo tiempo, cuando cada incumplimiento debe resolverse en un procedimiento distinto y separado.',
        'Se aprobó el reglamento durante la primera semana del ciclo escolar, que es un periodo reservado a la organización de los grupos.',
        'Se aplicaron las sanciones por parte del personal docente y no por el consejo que discutió y aprobó el texto del reglamento.' ],
        en:[

        'The code was approved during the first week of the school year, a period reserved for organizing the classes.',
        'The sanctions were applied by teaching staff and not by the council that discussed and approved the text of the code.' ] },
      explanation:{ es:'El consejo hizo bien su parte: discutió y aprobó. Lo que faltó fue el paso siguiente, que convierte al texto en algo que se puede exigir. Sin difusión, la persona sancionada es castigada por no adivinar, y una norma que castiga a quien no podía conocerla trabaja contra el fin que dice perseguir.',
                    en:'The council did its part: it discussed and approved. What was missing was the next step, the one that turns the text into something enforceable. Without publication, the sanctioned person is punished for not guessing, and a rule that punishes whoever could not know it works against the aim it claims to pursue.' },
      hint:{ es:'Piensa qué tuvo que ocurrir entre la aprobación y la primera sanción para que el reclamo fuera legítimo.',
             en:'Think about what had to happen between approval and the first sanction for the demand to be legitimate.' },

  addSection(S('CONCEPTO 3','CONCEPT 3'),
    '<h2>' + S('La misma regla no siempre produce igualdad','The same rule does not always produce equality') + '</h2>' +
    '<p>' + S('Hay una idea muy repetida: si la norma dice exactamente lo mismo para todas las personas, ya es igualitaria. Suena razonable y a veces es falso. Cuando la gente parte de condiciones distintas, una exigencia idéntica conserva la distancia con la que empezaron: quien tenía todo lo necesario cumple sin esfuerzo y quien no lo tenía queda incumpliendo, aunque el texto no lo mencione.',
              'There is a very repeated idea: if the rule says exactly the same thing for everyone, it is already egalitarian. It sounds reasonable and it is sometimes false. When people start from different conditions, an identical requirement preserves the gap they began with: whoever had everything they needed complies effortlessly and whoever did not ends up in breach, even though the text never mentions them.') + '</p>' +
    '<p>' + S('Por eso una norma orientada a la igualdad conserva la misma meta y el mismo derecho para todas las personas, y ajusta el camino de quien viene con menos. Cuando ese ajuste queda escrito en la norma deja de depender de la buena voluntad de alguien: se vuelve exigible. Y cuando un texto redactado en términos neutrales termina dejando fuera siempre al mismo grupo, hay que revisarlo, porque una norma también discrimina por sus efectos y no solo por sus palabras.',
              'That is why a rule oriented toward equality keeps the same goal and the same right for everyone, and adjusts the path of whoever comes with less. When that adjustment is written into the rule it stops depending on somebody\'s goodwill: it becomes enforceable. And when a text written in neutral terms keeps leaving out the same group, it has to be reviewed, because a rule can also discriminate through its effects and not only through its words.') + '</p>' +
    '<div class="rules-grid">' +
      '<div class="rcard"><div class="rname">' + S('Misma meta','Same goal') + '</div><div class="rform">' + S('para todas las personas','for everyone') + '</div><div class="rnote">' + S('Nadie recibe una versión rebajada del derecho.','Nobody gets a watered down version of the right.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Ajuste escrito','Written adjustment') + '</div><div class="rform">' + S('no favor personal','not a personal favor') + '</div><div class="rnote">' + S('Lo que está en la norma se puede exigir; lo que depende del ánimo, no.','What is in the rule can be demanded; what depends on a mood cannot.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Sin señalar','No singling out') + '</div><div class="rform">' + S('sin listas visibles','no public lists') + '</div><div class="rnote">' + S('Un apoyo que expone a quien lo recibe agrega una carga nueva.','Support that exposes whoever receives it adds a new burden.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Efecto real','Real effect') + '</div><div class="rform">' + S('¿quién queda fuera?','who is left out?') + '</div><div class="rnote">' + S('Un texto neutral puede excluir siempre al mismo grupo.','A neutral text can keep excluding the same group.') + '</div></div>' +
    '</div>' +
    buildEqu(rng));
  equRender();

  addSection(S('CONCEPTO 4','CONCEPT 4'),
    '<h2>' + S('Redactar también es decidir','Drafting is deciding too') + '</h2>' +
    '<p>' + S('Llega el momento de escribir el acuerdo, y ahí se juega más de lo que parece. Una cláusula aplicable dice cuatro cosas: a quién obliga, qué exige, en qué momento o plazo, y qué ocurre si no se cumple. Con esas cuatro, cualquiera puede saber si cumplió, y quien aplica la norma no tiene margen para inventar.',
              'The moment comes to write the agreement, and more is at stake there than it seems. An applicable clause says four things: whom it binds, what it demands, at what moment or deadline, and what happens if it is not met. With those four, anyone can tell whether they complied, and whoever enforces the rule has no room to improvise.') + '</p>' +
    '<p>' + S('Una redacción vaga parece inofensiva porque suena amable, pero traslada la decisión a quien vigila ese día: la misma conducta se sanciona o se perdona según quién esté. Y una cláusula excluyente falla al revés, porque se aplica perfectamente bien, solo que contra alguien que no debía quedar fuera. Redactar bien es evitar las dos.',
              'Vague wording looks harmless because it sounds friendly, but it hands the decision to whoever is on watch that day: the same conduct gets sanctioned or forgiven depending on who is there. And an excluding clause fails the other way around, because it is applied perfectly well, only against someone who should not have been left out. Drafting well means avoiding both.') + '</p>' +
    '<div class="callout"><p><strong>' + S('Prueba rápida: ','Quick test: ') + '</strong>' +
      S('lee la cláusula como si tuvieras que aplicarla mañana a alguien que no te cae bien. Si podrías sancionar o perdonar a tu gusto, el texto está incompleto.',
        'Read the clause as if you had to apply it tomorrow to someone you dislike. If you could sanction or forgive as you please, the text is incomplete.') + '</p></div>' +
    buildMsa(rng));
  msaRender();

  /* ── PROBLEMA 7 ─────────────────────────────────────────────── */
  addProblem(pick([
    { title:{ es:'Alterar el orden', en:'Disturbing order' }, showWork:false,
      stmt:{ es:'El borrador de un reglamento incluye esta cláusula: "Se sancionará a quien altere el orden dentro del plantel". Una compañera advierte que así redactada resulta riesgosa. ¿Qué riesgo concreto genera esa redacción?',
             en:'The draft of a code includes this clause: "Anyone disturbing order inside the school shall be sanctioned." A classmate warns that written that way it is risky. What concrete risk does that wording create?' },
      options:{ es:[
        'Quien vigila decide en cada caso qué cuenta como alterar el orden, de modo que la misma conducta puede sancionarse o pasarse por alto según quién esté a cargo.',
        'La sanción prevista puede resultar demasiado leve frente a las conductas más graves que llegaran a presentarse dentro del plantel.',
        'El estudiantado deja de leer el reglamento cuando encuentra cláusulas redactadas con expresiones tan breves como esta.',
        'La cláusula pierde vigencia de manera automática si no se vuelve a discutir al inicio de cada ciclo escolar en el consejo.' ],
        en:[
        'Whoever is on watch decides case by case what counts as disturbing order, so the same conduct can be sanctioned or overlooked depending on who is in charge.',
        'The sanction foreseen may turn out to be too mild for the most serious conduct that could occur inside the school.',
        'Students stop reading the code when they come across clauses written with expressions as brief as this one.',
        'The clause automatically loses force if it is not discussed again at the start of each school year by the council.' ] },
      explanation:{ es:'La cláusula no dice qué conductas quedan prohibidas ni qué sanción corresponde, así que el contenido lo pone quien la aplica en ese momento. Dos estudiantes que hicieron lo mismo pueden terminar con resultados distintos, y eso rompe justamente el trato igual que la norma debía garantizar.',
                    en:'The clause does not say which conduct is forbidden or which sanction applies, so its content is supplied by whoever enforces it at that moment. Two students who did the same thing can end up with different outcomes, and that breaks precisely the equal treatment the rule was supposed to guarantee.' },
      hint:{ es:'Imagina que dos personas hacen exactamente lo mismo en días distintos y las revisa personal distinto.',
             en:'Imagine two people doing exactly the same thing on different days and being reviewed by different staff.' },
      correct:0 },
    { title:{ es:'Cuatro formas de decir lo mismo', en:'Four ways of saying the same thing' }, showWork:false,
      stmt:{ es:'El comité quiere una cláusula sobre la entrega de las llaves del laboratorio y tiene cuatro versiones sobre la mesa. ¿Cuál está lista para aplicarse tal como está escrita?',
             en:'The committee wants a clause on returning the lab keys and has four versions on the table. Which one is ready to be applied exactly as written?' },
      options:{ es:[
        'La persona que solicita las llaves las devuelve al final de la sesión al responsable del laboratorio; si no lo hace, no puede solicitarlas de nuevo hasta entregarlas.',
        'Las llaves del laboratorio se manejarán con la responsabilidad que corresponde a un espacio con equipo delicado y de uso compartido.',
        'Se procurará que las llaves del laboratorio regresen a su lugar dentro de un tiempo prudente después de cada sesión de trabajo.',
        'Únicamente el estudiantado con promedio sobresaliente podrá solicitar las llaves del laboratorio durante el presente ciclo escolar.' ],
        en:[
        'Whoever requests the keys returns them to the lab supervisor at the end of the session; if they do not, they cannot request them again until they hand them in.',
        'The lab keys shall be handled with the responsibility appropriate to a space with delicate, shared equipment.',
        'It shall be sought that the lab keys return to their place within a reasonable time after each work session.',
        'Only students with outstanding grades may request the lab keys during the present school year.' ] },
      explanation:{ es:'La primera versión dice a quién obliga, qué debe hacer, en qué momento y qué ocurre si no lo hace: con eso cualquiera puede verificar el cumplimiento. Las dos siguientes dejan el contenido a la interpretación de quien vigile, y la última se aplicaría sin problema, pero condiciona el acceso a un rasgo que nada tiene que ver con devolver unas llaves.',
                    en:'The first version says whom it binds, what they must do, at what moment and what happens if they do not: with that, anyone can verify compliance. The next two leave the content to the interpretation of whoever is watching, and the last one would be applied without trouble, but it ties access to a trait that has nothing to do with returning keys.' },
      hint:{ es:'Busca la única versión en la que sabrías, sin preguntarle a nadie, si alguien cumplió o no.',
             en:'Look for the only version where you would know, without asking anyone, whether someone complied or not.' },
      correct:0 }
  ], rng), rng);

  /* ── PROBLEMA 8 ─────────────────────────────────────────────── */
  addProblem(pick([
    { title:{ es:'Falta un elemento', en:'One element is missing' }, showWork:false,
      stmt:{ es:'Una propuesta señala con precisión a quién obliga, qué debe hacerse y en qué plazo, pero no dice nada sobre lo que ocurre si alguien no cumple. El comité duda si eso importa. ¿Qué consecuencia tiene esa omisión?',
             en:'A proposal states precisely whom it binds, what must be done and by when, but says nothing about what happens if someone does not comply. The committee wonders whether that matters. What consequence does that omission have?' },
      options:{ es:[
        'El cumplimiento queda a voluntad de cada quien y, cuando alguien incumpla, la respuesta se improvisará caso por caso sin un criterio previo.',
        'La propuesta pierde su carácter obligatorio y se convierte automáticamente en una recomendación dirigida a toda la comunidad escolar.',
        'La propuesta no puede someterse a votación mientras no se le agregue una consecuencia, sin importar lo demás que contenga su texto.',
        'La propuesta obligará únicamente a quienes hayan participado en la reunión donde se discutió y aprobó su contenido.' ],
        en:[
        'Compliance is left to each person\'s will and, when someone breaches it, the response will be improvised case by case with no prior criterion.',
        'The proposal loses its binding character and automatically becomes a recommendation addressed to the whole school community.',
        'The proposal cannot be put to a vote until a consequence is added to it, no matter what else its text contains.',
        'The proposal will bind only those who took part in the meeting where its content was discussed and approved.' ] },
      explanation:{ es:'Sin consecuencia previsible, quien cumple lo hace por decisión propia y quien no cumple espera a ver qué pasa. El día que alguien incumpla, la respuesta se decidirá en ese momento, con el riesgo de que dos casos iguales terminen distintos. Escribir la consecuencia antes es lo que evita esa improvisación.',
                    en:'Without a foreseeable consequence, whoever complies does so by personal decision and whoever does not waits to see what happens. The day someone breaches it, the response will be decided on the spot, risking two identical cases ending differently. Writing the consequence beforehand is what prevents that improvisation.' },
      hint:{ es:'Piensa qué ocurre el primer día en que alguien no cumple y nadie sabe qué corresponde hacer.',
             en:'Think about what happens on the first day someone does not comply and nobody knows what should follow.' },
      correct:0 },
    { title:{ es:'La cláusula que sobra', en:'The clause that does not belong' }, showWork:false,
      stmt:{ es:'El borrador del reglamento del laboratorio de cómputo tiene cuatro cláusulas. Tres pueden aplicarse sin problema y una debe retirarse porque deja fuera a un grupo sin una razón relacionada con la actividad. ¿Cuál debe retirarse?',
             en:'The draft code for the computer lab has four clauses. Three can be applied without trouble and one must be withdrawn because it leaves a group out for a reason unrelated to the activity. Which one must be withdrawn?' },
      options:{ es:[
        'El acceso a las computadoras queda reservado al estudiantado que no haya reprobado ninguna materia durante el ciclo en curso.',
        'Cada grupo utiliza el laboratorio en el horario publicado en la puerta y lo deja libre al terminar su sesión de trabajo.',
        'La persona responsable del laboratorio publica el primer lunes de cada mes el horario asignado a los seis grupos del plantel.',
        'Quien dañe un equipo por descuido participa en su reparación durante el mes siguiente junto con la persona responsable.' ],
        en:[
        'Access to the computers is reserved for students who have not failed any subject during the current school year.',
        'Each class uses the lab during the schedule posted on the door and leaves it free when its work session ends.',
        'The lab supervisor posts on the first Monday of each month the schedule assigned to the six classes in the school.',
        'Whoever damages equipment through carelessness takes part in its repair during the following month together with the supervisor.' ] },
      explanation:{ es:'Haber reprobado una materia no dice nada sobre el uso cuidadoso de una computadora, y convierte una herramienta de estudio en un premio que se le quita justo a quien más la necesita para ponerse al día. Las otras tres reparten horarios, publican información y fijan una consecuencia proporcional a un daño: todas se pueden aplicar sin excluir a nadie.',
                    en:'Having failed a subject says nothing about careful use of a computer, and it turns a study tool into a prize taken away from precisely those who most need it to catch up. The other three distribute schedules, publish information and set a consequence proportional to damage: all of them can be applied without excluding anyone.' },
      hint:{ es:'Revisa cuál de las cuatro condiciona el acceso a un rasgo que no tiene relación con usar bien el equipo.',
             en:'Check which of the four ties access to a trait unrelated to using the equipment properly.' },
      correct:0 }
  ], rng), rng);

  /* ── PROBLEMA 9 ─────────────────────────────────────────────── */
  addProblem(pick([
    { title:{ es:'La escalera de un solo sentido', en:'The one way staircase' }, showWork:false,
      stmt:{ es:'Una norma escolar obliga a subir y bajar la escalera principal en un solo sentido. Se creó para evitar empujones en el cambio de clase y lo consiguió, pero hoy provoca que un grupo del último piso llegue tarde a todas sus clases de la tarde. ¿Qué procede hacer con esa norma?',
             en:'A school rule requires the main staircase to be used in one direction only. It was created to avoid shoving between classes and it worked, but today it makes a top floor class arrive late to all its afternoon lessons. What should be done with that rule?' },
      options:{ es:[
        'Llevarla al órgano que la aprobó con el registro de lo que está produciendo y ajustar su texto para conservar el fin sin ese efecto.',
        'Mantenerla sin cambio alguno, porque una norma pierde autoridad frente a la comunidad si se modifica antes de completar un ciclo escolar.',
        'Dejar de aplicarla en el tramo donde provoca retrasos y seguir aplicándola con normalidad en el resto de las escaleras del plantel.',
        'Sustituirla por una recomendación general de circular con cuidado, para que cada grupo resuelva el traslado como mejor le funcione.' ],
        en:[
        'Take it to the body that approved it with a record of what it is producing and adjust its text to keep the aim without that effect.',
        'Keep it unchanged, because a rule loses authority before the community if it is modified before completing a school year.',
        'Stop applying it on the stretch where it causes delays and keep applying it normally on the rest of the staircases.',
        'Replace it with a general recommendation to move carefully, so each class solves its own commute as best suits them.' ] },
      explanation:{ es:'La norma sigue sirviendo para lo que se creó, así que no hay razón para tirarla ni para cambiarla por una recomendación que no obliga a nadie. Lo que apareció es un efecto que nadie previó, y el camino es el mismo que la creó: presentar lo que está ocurriendo donde se decidió y corregir el texto. Dejar de aplicarla por tramos, en cambio, sería aplicarla distinto a personas que están en la misma situación.',
                    en:'The rule still serves what it was created for, so there is no reason to scrap it or swap it for a recommendation that binds nobody. What appeared is an effect nobody foresaw, and the way forward is the same one that created it: present what is happening where it was decided and fix the text. Dropping it in some stretches, on the other hand, would mean applying it differently to people in the same situation.' },
      hint:{ es:'Distingue entre una norma que falló en su propósito y una que cumple su propósito pero produce un efecto que nadie había visto.',
             en:'Distinguish between a rule that failed at its purpose and one that meets its purpose but produces an effect nobody had seen.' },
      correct:0 },
    { title:{ es:'El argumento de la asamblea', en:'The argument for the assembly' }, showWork:false,
      stmt:{ es:'Un grupo quiere cambiar una norma del reglamento y tiene una sola intervención en la asamblea para convencer al resto. ¿Qué argumento tiene más fuerza para lograr la transformación de esa norma?',
             en:'A class wants to change a rule in the code and has a single turn to speak at the assembly to convince the rest. Which argument has the most force to bring about that change?' },
      options:{ es:[
        'Mostrar con casos concretos que la norma produce hoy un efecto contrario al fin que la justificó y presentar un texto alterno ya redactado.',
        'Recordar que la norma lleva muchos años vigente y que las cosas han cambiado bastante desde el momento en que se aprobó.',
        'Señalar que a la mayor parte del grupo la norma le resulta incómoda de cumplir en la práctica cotidiana de cada semana.',
        'Advertir que si la norma no se modifica el grupo dejará de cumplirla a partir del lunes siguiente a la asamblea.' ],
        en:[
        'Show with concrete cases that the rule today produces an effect contrary to the aim that justified it, and present an alternative text already drafted.',
        'Recall that the rule has been in force for many years and that things have changed quite a bit since it was approved.',
        'Point out that most of the class finds the rule uncomfortable to follow in everyday practice each week.',
        'Warn that if the rule is not modified the class will stop complying with it from the Monday after the assembly.' ] },
      explanation:{ es:'La asamblea puede comprobar dos cosas: qué está produciendo la norma y qué se propone en su lugar. Ese par convierte una molestia en una propuesta discutible. La antigüedad no dice si funciona, la incomodidad tampoco basta porque casi toda norma incomoda a alguien, y anunciar que se dejará de cumplir sustituye la discusión por una amenaza.',
                    en:'The assembly can check two things: what the rule is producing and what is proposed in its place. That pair turns an annoyance into a debatable proposal. Age does not say whether it works, discomfort is not enough either because almost every rule inconveniences someone, and announcing that it will not be followed replaces discussion with a threat.' },
      hint:{ es:'Piensa qué puede verificar la asamblea por sí misma y qué solo expresa el malestar de quien habla.',
             en:'Think about what the assembly can verify for itself and what only expresses the speaker\'s discomfort.' },
      correct:0 }
  ], rng), rng);

  /* ── PROBLEMA 10 ────────────────────────────────────────────── */
  addProblem(pick([
    { title:{ es:'Cuatro maneras de intentarlo', en:'Four ways of trying' }, showWork:false,
      stmt:{ es:'En una secundaria, el reglamento impide que el estudiantado del turno vespertino use la sala de cómputo, y un grupo quiere cambiarlo. ¿Cuál de estas formas de participar tiene más posibilidades de transformar realmente la norma?',
             en:'In one secondary school, the code keeps afternoon-shift students from using the computer room, and a class wants to change that. Which of these ways of taking part has the best chance of actually transforming the rule?' },
      options:{ es:[
        'Llevar al consejo una propuesta escrita con quién, qué, cuándo y qué pasa si no se cumple, respaldada por lo que dijeron quienes van a cumplirla.',
        'Reunir firmas anónimas y dejarlas en la dirección sin especificar qué parte del reglamento se pide modificar ni con qué texto.',
        'Convencer en privado a la persona con más autoridad del plantel para que modifique el reglamento sin pasar por el consejo escolar.',
        'Dejar de cumplir la norma en grupo hasta que alguien note el problema y decida por su cuenta corregir el reglamento vigente.' ],
        en:[
        'Take to the council a written proposal with who, what, when and what happens if it is not met, backed by what those who will follow it said.',
        'Gather anonymous signatures and leave them at the office without specifying which part of the code should change or with what text.',
        'Privately convince the person with most authority in the school to modify the code without going through the school council.',
        'Collectively stop following the rule until someone notices the problem and decides on their own to fix the current code.' ] },
      explanation:{ es:'La propuesta escrita llega al lugar donde puede decidirse, dice exactamente qué se cambia y trae la voz de quienes quedarán obligados: es discutible, verificable y aprobable. Las firmas sin contenido no dicen qué votar, el arreglo en privado esquiva al órgano que da validez al acuerdo, y el incumplimiento colectivo no crea ninguna norma nueva.',
                    en:'The written proposal reaches the place where it can be decided, says exactly what changes and carries the voice of those who will be bound: it is debatable, verifiable and approvable. Signatures with no content do not say what to vote on, a private arrangement bypasses the body that gives the agreement its validity, and collective non compliance creates no new rule.' },
      hint:{ es:'Busca la opción que llega al lugar donde se decide y que ya trae un texto que la asamblea pueda discutir.',
             en:'Look for the option that reaches the place where decisions are made and already brings a text the assembly can discuss.' },
      correct:0 },
    { title:{ es:'La propuesta del comité', en:'The committee proposal' }, showWork:false,
      stmt:{ es:'Un comité estudiantil prepara una norma para el uso del comedor escolar. Quiere que además de funcionar, esté orientada a la igualdad y a los derechos de todo el estudiantado. ¿Qué debe asegurar antes de llevarla al consejo?',
             en:'A student committee is preparing a rule for the use of the school dining hall. It wants the rule not only to work but to be oriented toward equality and the rights of every student. What must it make sure of before taking it to the council?' },
      options:{ es:[
        'Que persiga un fin claro, obligue igual a quienes están en la misma situación, prevea una consecuencia proporcional y recoja lo que dijeron quienes tendrán que cumplirla.',
        'Que su redacción sea breve, que use un lenguaje formal y que se presente firmada por la mayor cantidad posible de estudiantes del plantel.',
        'Que coincida con las normas de comedor que aplican otras escuelas de la zona y que se presente al inicio del ciclo escolar.',
        'Que incluya sanciones severas desde el primer incumplimiento para que el estudiantado la tome en serio desde el primer día.' ],
        en:[
        'That it pursues a clear aim, binds equally those in the same situation, foresees a proportional consequence and gathers what those who must follow it said.',
        'That its wording is brief, that it uses formal language and that it is presented signed by as many students in the school as possible.',
        'That it matches the dining hall rules applied by other schools in the area and that it is presented at the start of the school year.',
        'That it includes severe sanctions from the very first breach so that students take it seriously from day one.' ] },
      explanation:{ es:'Esas cuatro condiciones son las que hacen que una norma se sostenga frente a quien tenga que cumplirla y frente a quien tenga que aplicarla. La brevedad, el parecido con otras escuelas o la firma de muchas personas pueden ayudar a que se apruebe, pero no dicen nada sobre si es justa, y las sanciones severas desde el primer incumplimiento rompen precisamente la proporción entre la falta y su consecuencia.',
                    en:'Those four conditions are what make a rule hold up before whoever must follow it and whoever must enforce it. Brevity, resemblance to other schools or many signatures may help it get approved, but they say nothing about whether it is just, and severe sanctions from the first breach break precisely the proportion between the offense and its consequence.' },
      hint:{ es:'Descarta lo que solo ayuda a que la norma sea aprobada y quédate con lo que la vuelve justa para quien la cumplirá.',
             en:'Rule out what only helps the rule get approved and keep what makes it just for whoever will follow it.' },
      correct:0 }
  ], rng), rng);

  /* ── CIERRE ─────────────────────────────────────────────────── */
  addSection(S('CIERRE','CLOSING'),
    '<h2>' + S('Lo que queda en las manos','What stays in your hands') + '</h2>' +
    '<p>' + S('Una norma es una decisión sobre cómo van a convivir personas concretas. Por eso puede leerse, discutirse y cambiarse: se sostiene si protege algo, si obliga igual a quienes están igual, si castiga en la medida de la falta y si quienes van a cumplirla pudieron hablar antes. Cuando alguna de esas cuatro falla, no hace falta esperar: hay un recorrido para proponer otra cosa, y empieza por escribirla bien.',
              'A rule is a decision about how specific people will live together. That is why it can be read, discussed and changed: it holds up if it protects something, if it binds equally those who are equal, if it punishes in proportion to the offense and if those who must follow it could speak first. When one of those four fails, there is no need to wait: there is a route for proposing something else, and it starts by writing it well.') + '</p>' +
    '<div class="callout"><p><strong>' + S('Para llevarte: ','To take with you: ') + '</strong>' +
      S('participar en la creación de una norma no es solo votarla. Es nombrar el problema, escuchar a quien la va a cumplir, redactarla de modo que nadie pueda aplicarla a su gusto y volver a revisarla cuando ya esté funcionando.',
        'Taking part in creating a rule is not only voting on it. It is naming the problem, listening to whoever will follow it, drafting it so nobody can apply it as they please and reviewing it again once it is running.') + '</p></div>');
}
</script>

<!-- LIAXA ANALYTICS -->
<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbyytGUdwxVpgXSHoXM1ISKh036P3GlF1BmF6aVRCR3DLpmtgefG09htw_l5IJW3UwoG/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var body = JSON.stringify({school:school,event:ev,module_id:moduleId,
      session_id:sessionId,elapsed_sec:Math.round((Date.now()-openedAt)/1000)});
    if(ev==='module_close'&&navigator.sendBeacon){
      navigator.sendBeacon(GAS_URL,new Blob([body],{type:'application/json'}));
    }else{
      fetch(GAS_URL,{method:'POST',body:body,headers:{'Content-Type':'application/json'},keepalive:true}).catch(function(){});
    }
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
</body>
</html>
