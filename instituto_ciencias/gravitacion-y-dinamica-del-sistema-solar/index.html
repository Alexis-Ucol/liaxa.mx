      q: L({ es: 'En un planeta recién explorado cada kilogramo pesa ' + nf(g1) + ' N. Allí, una caja de suministros marca ' + nf(pw) + ' N en la báscula. En la Tierra cada kilogramo pesa 9.8 N. ¿Qué masa tiene la caja y cuánto pesaría en la Tierra?',
             en: 'On a newly explored planet every kilogram weighs ' + nf(g1) + ' N. There, a supply crate reads ' + nf(pw) + ' N on the scale. On Earth every kilogram weighs 9.8 N. What mass does the crate have and how much would it weigh on Earth?' }),
      options: o, correct: o[0],
      hint: L({ es: 'Primero averigua cuántos kilogramos hay: reparte el peso medido entre lo que pesa un kilogramo allí. Después usa esa masa con el valor de la Tierra.',
                en: 'First find how many kilograms there are: share the measured weight between what one kilogram weighs there. Then use that mass with the value for the Earth.' }),
      exp: L({ es: nf(pw) + ' ÷ ' + nf(g1) + ' = ' + nf(m) + ' kg, y esa masa viaja igual a todas partes. En la Tierra: ' + nf(m) + ' × 9.8 = ' + nf(m * 9.8) + ' N.',
               en: nf(pw) + ' ÷ ' + nf(g1) + ' = ' + nf(m) + ' kg, and that mass travels the same everywhere. On Earth: ' + nf(m) + ' × 9.8 = ' + nf(m * 9.8) + ' N.' })
    };
  }
  var vv = pick([7.9, 8.4, 9.6, 10.5], rng), falta = Math.round((11.2 - vv) * 10) / 10;
  var o2 = [
    L({ es: 'Le faltan ' + nf(falta) + ' km/s, y mientras tanto sigue girando alrededor de la Tierra sin escapar.',
        en: 'It is short of ' + nf(falta) + ' km/s, and meanwhile it keeps circling the Earth without escaping.' }),
    L({ es: 'Le faltan ' + nf(falta) + ' km/s, y mientras tanto cae de inmediato de vuelta al suelo.',
        en: 'It is short of ' + nf(falta) + ' km/s, and meanwhile it drops at once back to the ground.' }),
    L({ es: 'Le faltan ' + nf(falta * 2) + ' km/s, y mientras tanto sigue girando alrededor de la Tierra.',
        en: 'It is short of ' + nf(falta * 2) + ' km/s, and meanwhile it keeps circling the Earth.' }),
    L({ es: 'Le sobran ' + nf(falta) + ' km/s, y por eso ya se aleja de la Tierra para no volver.',
        en: 'It has ' + nf(falta) + ' km/s to spare, and that is why it is already leaving the Earth for good.' })
  ];
  return {
    title: L({ es: 'A un paso de escapar', en: 'One step from escaping' }),
    showWork: true,
    q: L({ es: 'Una nave que ya gira en una órbita baja enciende motores y alcanza ' + nf(vv) + ' km/s. Para soltarse de la Tierra y no volver necesita llegar a 11.2 km/s. ¿Qué le falta y qué hace mientras tanto?',
           en: 'A ship already circling in a low orbit fires its engines and reaches ' + nf(vv) + ' km/s. To break free of the Earth and not come back it needs to reach 11.2 km/s. What is it short of and what does it do meanwhile?' }),
    options: o2, correct: o2[0],
    hint: L({ es: 'Compara las dos rapideces restando la que lleva de la que necesita. Con menos de la necesaria, pero con la suficiente para no caer, la trayectoria se cierra sobre sí misma.',
              en: 'Compare the two speeds by taking the one it has from the one it needs. With less than the needed one, but enough not to fall, the path closes on itself.' }),
    exp: L({ es: '11.2 − ' + nf(vv) + ' = ' + nf(falta) + ' km/s. Con esa rapidez la nave describe una órbita más alargada que antes, pero cerrada: sigue atada a la Tierra hasta que consiga los ' + nf(falta) + ' km/s que le faltan.',
             en: '11.2 − ' + nf(vv) + ' = ' + nf(falta) + ' km/s. With that speed the ship traces a more stretched orbit than before, but a closed one: it stays tied to the Earth until it gets the ' + nf(falta) + ' km/s it is short of.' })
  };
}

/* ══════════════════════════════════════════════════════════════════════════
   buildLesson: conceptos, manipulativos y problemas intercalados
   ══════════════════════════════════════════════════════════════════════════ */
function buildLesson(rng){

  sec(
    L({ es: 'Punto de partida', en: 'Starting point' }),
    L({ es: 'Una sola atracción sostiene todo el vecindario', en: 'One single pull holds the whole neighbourhood' }),
    '<p>' + L({
      es: 'El Sistema Solar no está sujeto con cables. Ocho planetas, cientos de lunas, millones de rocas y un cometa que vuelve cada tanto se mueven todos por la misma razón: se atraen. Esa atracción, la gravitación, es la que mantiene a la Tierra dando vueltas al Sol, a la Luna dando vueltas a la Tierra y a tus pies pegados al suelo mientras lees esto.',
      en: 'The Solar System is not held together with cables. Eight planets, hundreds of moons, millions of rocks and a comet that comes back now and then all move for the same reason: they attract each other. That pull, gravitation, is what keeps the Earth going around the Sun, the Moon going around the Earth and your feet stuck to the ground while you read this.'
    }) + '</p>' +
    '<p>' + L({
      es: 'En esta guía vas a mover dos cuerpos hasta conseguir una atracción exacta, a pesar la misma caja en cuatro mundos distintos, a lanzar una sonda una y otra vez hasta dejarla en órbita o hacerla escapar, a ordenar planetas por la duración de su año y a colocar la Luna en el punto donde se levantan las mareas más grandes.',
      en: 'In this guide you will move two bodies until you get an exact pull, weigh the same crate on four different worlds, launch a probe again and again until you leave it in orbit or make it escape, order planets by the length of their year, and place the Moon at the point where the biggest tides rise.'
    }) + '</p>' +
    '<div class="callout"><p><strong>' + L({ es: 'Idea clave: ', en: 'Key idea: ' }) + '</strong>' + L({
      es: 'la gravitación depende de dos cosas, la masa de los cuerpos y la distancia entre ellos, y con esas dos se explica desde el peso de una mochila hasta la duración del año de Saturno.',
      en: 'gravitation depends on two things, the mass of the bodies and the distance between them, and with those two everything is explained, from the weight of a backpack to the length of the year of Saturn.'
    }) + '</p></div>'
  );

  /* ══ CONCEPTO 1 ══ */
  sec(
    L({ es: 'Concepto 1', en: 'Concept 1' }),
    L({ es: 'De qué depende la atracción', en: 'What the pull depends on' }),
    '<p>' + L({
      es: 'Cualquier par de cuerpos con masa se atrae, siempre, en los dos sentidos y con la misma intensidad de ida que de vuelta. La Tierra tira de ti y tú tiras de la Tierra exactamente igual de fuerte. Lo que decide qué tan grande es ese tirón son solo dos cosas: cuánta masa tiene cada cuerpo y qué tan lejos están uno del otro.',
      en: 'Any pair of bodies with mass attract each other, always, both ways and with the same strength there and back. The Earth pulls on you and you pull on the Earth exactly as hard. What decides how big that pull is comes down to just two things: how much mass each body has and how far apart they are.'
    }) + '</p>' +
    '<p>' + L({
      es: 'Con la masa la cuenta es directa: al doble de masa, el doble de atracción; al triple, el triple. Con la distancia la cuenta es más brusca, porque la distancia entra multiplicada por sí misma. Al doble de distancia la atracción no baja a la mitad, baja a la cuarta parte. Al triple de distancia baja a la novena. Y al revés: acercarse a la mitad de la distancia multiplica la atracción por cuatro.',
      en: 'With mass the count is direct: at twice the mass, twice the pull; at three times, three times as much. With distance the count is sharper, because distance goes in multiplied by itself. At twice the distance the pull does not drop to half, it drops to a quarter. At three times the distance it drops to a ninth. And the other way round: closing to half the distance multiplies the pull by four.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es: 'Más masa', en: 'More mass' }), L({ es: 'atracción más grande', en: 'bigger pull' }), L({ es: 'la masa entra tal cual: dos veces más masa, dos veces más atracción', en: 'mass goes in as it is: twice the mass, twice the pull' })) +
      rcard(L({ es: 'Más distancia', en: 'More distance' }), L({ es: 'atracción mucho menor', en: 'far smaller pull' }), L({ es: 'la distancia entra multiplicada por sí misma y por eso desploma el tirón', en: 'distance goes in multiplied by itself and so it collapses the pull' })) +
      rcard(L({ es: 'Siempre en pareja', en: 'Always a pair' }), L({ es: 'tirón de ida y de vuelta', en: 'pull there and back' }), L({ es: 'los dos cuerpos se atraen con la misma intensidad, aunque uno sea enorme', en: 'both bodies attract with the same strength, even if one is huge' })) +
    '</div>' +
    '<div class="callout"><p>' + L({
      es: 'En el medidor de abajo puedes cambiar la masa de uno de los cuerpos y la distancia entre los dos. La flecha y el número responden al instante: se te pedirá una marca concreta y tendrás que buscar la combinación que la consigue.',
      en: 'On the meter below you can change the mass of one of the bodies and the distance between the two. The arrow and the number respond at once: you will be asked for a definite reading and you will have to find the combination that gets it.'
    }) + '</p></div>'
  );
  wFuerza(rng);
  addProb(mkP1(rng), rng);
  addProb(mkP2(rng), rng);

  /* ══ CONCEPTO 2 ══ */
  sec(
    L({ es: 'Concepto 2', en: 'Concept 2' }),
    L({ es: 'Masa y peso no son la misma cosa', en: 'Mass and weight are not the same thing' }),
    '<p>' + L({
      es: 'La masa dice cuánta materia tiene un cuerpo. Se mide en kilogramos y es la misma en el laboratorio, en la Luna o flotando dentro de una nave. El peso es otra cosa: es la fuerza con la que un mundo tira de esa masa, se mide en newtons y cambia según dónde estés parado.',
      en: 'Mass says how much matter a body has. It is measured in kilograms and it is the same in the laboratory, on the Moon or floating inside a ship. Weight is something else: it is the force with which a world pulls on that mass, it is measured in newtons and it changes depending on where you are standing.'
    }) + '</p>' +
    '<p>' + L({
      es: 'Cada mundo tira de cada kilogramo con una intensidad propia, que depende de la masa del mundo y de su tamaño. Por eso una misma caja marca cifras muy distintas en la báscula según el suelo en el que la apoyes, aunque nadie le haya quitado ni añadido materia.',
      en: 'Each world pulls on each kilogram with a strength of its own, which depends on the mass of the world and on its size. That is why one same crate reads very different figures on the scale depending on the ground you rest it on, even though nobody has taken matter from it or added any.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es: 'Luna', en: 'Moon' }), '1.6 N', L({ es: 'lo que pesa un kilogramo apoyado en el suelo lunar', en: 'what one kilogram weighs resting on the lunar ground' })) +
      rcard(L({ es: 'Marte', en: 'Mars' }), '3.7 N', L({ es: 'poco más del doble que en la Luna, y aun así menos de la mitad que aquí', en: 'a bit over twice the Moon, and still less than half of here' })) +
      rcard(L({ es: 'Tierra', en: 'Earth' }), '9.8 N', L({ es: 'el valor con el que estás acostumbrado a pesar las cosas', en: 'the value you are used to weighing things with' })) +
      rcard(L({ es: 'Júpiter', en: 'Jupiter' }), '24.8 N', L({ es: 'medido en lo alto de sus nubes, porque suelo firme no tiene', en: 'measured at the top of its clouds, because firm ground it has none' })) +
    '</div>' +
    '<div class="callout"><p>' + L({
      es: 'La báscula de abajo lleva la misma carga de un mundo a otro. Elige el mundo, ajusta los kilogramos y fíjate en cuál de los dos números cambia y cuál se queda quieto.',
      en: 'The scale below carries the same load from one world to another. Choose the world, adjust the kilograms and watch which of the two numbers changes and which stays put.'
    }) + '</p></div>'
  );
  wBascula(rng);
  addProb(mkP3(rng), rng);
  addProb(mkP4(rng), rng);

  /* ══ CONCEPTO 3 ══ */
  sec(
    L({ es: 'Concepto 3', en: 'Concept 3' }),
    L({ es: 'Caer sin llegar nunca al suelo', en: 'Falling without ever reaching the ground' }),
    '<p>' + L({
      es: 'Si lanzas una piedra hacia adelante, cae. Si la lanzas más fuerte, cae más lejos. La Tierra, mientras tanto, es redonda: su superficie se curva hacia abajo conforme te alejas. Existe entonces una rapidez a la que la piedra cae exactamente lo mismo que la superficie se aparta por debajo de ella. Esa piedra ya no llega nunca al suelo: está en órbita.',
      en: 'If you throw a stone forward, it falls. If you throw it harder, it falls farther away. The Earth, meanwhile, is round: its surface curves downwards as you move away. So there is a speed at which the stone falls exactly as much as the surface moves away beneath it. That stone never reaches the ground again: it is in orbit.'
    }) + '</p>' +
    '<p>' + L({
      es: 'Un cuerpo en órbita no ha dejado de caer ni ha escapado de la atracción: cae todo el tiempo y por eso gira. Cerca de la Tierra esa rapidez de lado vale unos 7.7 km/s. Por debajo de ella la trayectoria se cierra contra el suelo. Por encima, la órbita se alarga cada vez más. Y pasando de unos 11 km/s el cuerpo ya no vuelve: se marcha para siempre. Lo mismo, con otras cifras, vale para cualquier planeta y para cualquier luna.',
      en: 'A body in orbit has not stopped falling nor escaped the pull: it falls all the time and that is why it circles. Near the Earth that sideways speed is worth about 7.7 km/s. Below it the path closes against the ground. Above it, the orbit stretches more and more. And past about 11 km/s the body does not come back: it leaves for good. The same, with other figures, holds for any planet and any moon.'
    }) + '</p>' +
    '<div class="callout"><p>' + L({
      es: 'El lanzador de abajo suelta una sonda a la altura de una órbita baja y dibuja al instante el camino completo que seguirá. Se te pedirán tres resultados distintos: consíguelos moviendo solo la rapidez de salida.',
      en: 'The launcher below releases a probe at the height of a low orbit and draws at once the whole path it will follow. You will be asked for three different outcomes: get them by moving only the release speed.'
    }) + '</p></div>'
  );
  wLanzador(rng);
  addProb(mkP5(rng), rng);
  addProb(mkP6(rng), rng);

  /* ══ CONCEPTO 4 ══ */
  sec(
    L({ es: 'Concepto 4', en: 'Concept 4' }),
    L({ es: 'Más lejos del Sol, año más largo', en: 'Farther from the Sun, longer year' }),
    '<p>' + L({
      es: 'El Sol concentra casi toda la masa del Sistema Solar, así que es él quien manda. Un planeta cercano siente un tirón enorme y necesita moverse muy rápido para no caer; uno lejano siente un tirón débil y le basta con moverse despacio. A eso se suma que el camino de vuelta al Sol es mucho más largo cuanto más lejos se está.',
      en: 'The Sun holds almost all the mass of the Solar System, so it is the one in charge. A close planet feels an enormous pull and needs to move very fast in order not to fall; a far one feels a weak pull and moving slowly is enough. On top of that, the path back around the Sun is much longer the farther away you are.'
    }) + '</p>' +
    '<p>' + L({
      es: 'Las dos cosas empujan en la misma dirección: los planetas lejanos recorren más camino y además lo recorren más despacio, de modo que su año dura muchísimo más que el nuestro. Mercurio, pegado al Sol, termina su año en 88 días. Neptuno, en la orilla del sistema, necesita 165 años terrestres para dar una sola vuelta.',
      en: 'Both things push the same way: far planets cover more path and they also cover it more slowly, so their year lasts far longer than ours. Mercury, glued to the Sun, finishes its year in 88 days. Neptune, at the edge of the system, needs 165 Earth years to make a single turn.'
    }) + '</p>' +
    '<div class="callout"><p>' + L({
      es: 'Abajo tienes varios planetas revueltos, cada uno con su distancia al Sol medida en unidades astronómicas, donde una unidad es la distancia de la Tierra al Sol. Ordénalos del año más corto al año más largo tocando dos para intercambiarlos.',
      en: 'Below you have several planets in a jumble, each with its distance to the Sun measured in astronomical units, where one unit is the distance from the Earth to the Sun. Order them from the shortest year to the longest by tapping two to swap them.'
    }) + '</p></div>'
  );
  wOrden(rng);
  addProb(mkP7(rng), rng);

  /* ══ CONCEPTO 5 ══ */
  sec(
    L({ es: 'Concepto 5', en: 'Concept 5' }),
    L({ es: 'La Tierra, la Luna y el mar', en: 'The Earth, the Moon and the sea' }),
    '<p>' + L({
      es: 'La Luna es el caso más cercano de todo lo anterior. Da una vuelta a la Tierra en unos 27 días y tarda ese mismo tiempo en girar sobre sí misma, así que siempre nos muestra la misma cara. El ciclo de fases dura un poco más, 29.5 días, porque mientras la Luna da su vuelta la Tierra también avanza alrededor del Sol y la alineación tarda un poco más en repetirse.',
      en: 'The Moon is the closest case of everything above. It goes once around the Earth in about 27 days and takes that same time to spin on itself, so it always shows us the same face. The cycle of phases lasts a little longer, 29.5 days, because while the Moon makes its turn the Earth also advances around the Sun and the lining up takes a bit longer to repeat.'
    }) + '</p>' +
    '<p>' + L({
      es: 'Esa misma atracción tira también del agua de los océanos y levanta dos abultamientos, uno del lado que mira a la Luna y otro del lado opuesto. La Tierra gira por debajo de ellos y por eso en casi todas las costas hay dos mareas altas al día. El Sol también tira, con menos fuerza por lo lejos que está. Cuando el Sol y la Luna quedan alineados con la Tierra, los dos tirones se suman y las mareas son las más grandes del mes; cuando forman ángulo recto, se estorban y las mareas quedan pequeñas.',
      en: 'That same pull also tugs at the water of the oceans and raises two bulges, one on the side facing the Moon and another on the opposite side. The Earth spins underneath them and that is why on almost every coast there are two high tides a day. The Sun pulls too, with less force because of how far it is. When the Sun and the Moon line up with the Earth, the two pulls add up and the tides are the biggest of the month; when they make a right angle, they get in each other way and the tides stay small.'
    }) + '</p>' +
    '<div class="callout"><p>' + L({
      es: 'En el tablero de abajo mueves la Luna a lo largo de su recorrido de 29.5 días. Verás girar el abultamiento del océano y podrás leer la fase y el tipo de marea que resulta en cada punto.',
      en: 'On the board below you move the Moon along its journey of 29.5 days. You will see the bulge of the ocean turn and you will be able to read the phase and the kind of tide that results at each point.'
    }) + '</p></div>'
  );
  wMareas(rng);
  addProb(mkP8(rng), rng);

  /* ══ CIERRE ══ */
  sec(
    L({ es: 'Cierre', en: 'Closing' }),
    L({ es: 'Todo junto', en: 'Everything together' }),
    '<p>' + L({
      es: 'Lo que sigue mezcla distancias, rapideces y pesos en situaciones que ocurren de verdad ahí arriba.',
      en: 'What comes next mixes distances, speeds and weights in situations that really happen up there.'
    }) + '</p>'
  );
  addProb(mkP9(rng), rng);
  addProb(mkP10(rng), rng);
}

/* ══ MANIPULATIVO 1 · MEDIDOR DE ATRACCIÓN ═════════════════════════════════
   El alumno mueve la masa de uno de los cuerpos y la distancia entre los dos.
   La flecha del tirón y la marca del medidor responden al instante. Tres
   encargos con pista direccional y revelado al tercer intento.
   ═══════════════════════════════════════════════════════════════════════════ */
function wFuerza(rng){
  var host = iw('gravity', 'wFzaW');
  var TG = shuffle([100, 150, 200, 300, 500], rng).slice(0, 3);
  var SOL = { 100: [4, 2], 150: [6, 2], 200: [8, 2], 300: [3, 1], 500: [5, 1] };
  var st = { m: 3, d: 3, r: 0, tries: 0, done: false };
  function F(){ return 100 * st.m / (st.d * st.d); }
  function tgt(){ return TG[Math.min(st.r, TG.length - 1)]; }

  host.innerHTML =
    '<div class="iw-tag">' + L({ es: 'Medidor de atracción', en: 'Attraction meter' }) + '</div>' +
    '<div class="iw-task" id="wFzaTask"></div>' +
    '<div class="iw-cv"><canvas id="wFzaCv"></canvas></div>' +
    '<div class="ctrl"><label>' + L({ es: 'Masa del cuerpo pequeño', en: 'Mass of the small body' }) + ': <b id="wFzaML"></b> ' +
      L({ es: 'unidades', en: 'units' }) + '</label>' +
      '<input type="range" id="wFzaM" min="1" max="10" step="1" value="3" oninput="wFzaIn()"></div>' +
    '<div class="ctrl"><label>' + L({ es: 'Distancia entre los dos', en: 'Distance between the two' }) + ': <b id="wFzaDL"></b> ' +
      L({ es: 'unidades', en: 'units' }) + '</label>' +
      '<input type="range" id="wFzaD" min="1" max="6" step="1" value="3" oninput="wFzaIn()"></div>' +
    '<div class="readout">' +
      '<div class="ro"><div class="ro-l">' + L({ es: 'Masa', en: 'Mass' }) + '</div><div class="ro-v" id="wFzaRm"></div></div>' +
      '<div class="ro"><div class="ro-l">' + L({ es: 'Distancia', en: 'Distance' }) + '</div><div class="ro-v" id="wFzaRd"></div></div>' +
      '<div class="ro"><div class="ro-l">' + L({ es: 'Atracción', en: 'Pull' }) + '</div><div class="ro-v" id="wFzaRf"></div></div>' +
    '</div>' +
    '<button class="rverify-btn" onclick="wFzaCheck()">' + L({ es: 'Comprobar', en: 'Check' }) + '</button>' +
    '<div class="rfb" id="wFzaFb"></div>';

  function arrow(c, x, y, len, dir){
    c.beginPath(); c.moveTo(x, y); c.lineTo(x + len * dir, y); c.stroke();
    c.beginPath();
    c.moveTo(x + len * dir, y);
    c.lineTo(x + (len - 7) * dir, y - 4);
    c.lineTo(x + (len - 7) * dir, y + 4);
    c.closePath(); c.fill();
  }

  function draw(){
    var cv = document.getElementById('wFzaCv'); if (!cv) return;
    var rect = cv.getBoundingClientRect();
    var dpr = window.devicePixelRatio || 1;
    var W = Math.round(rect.width || 320), H = 200;
    cv.width = W * dpr; cv.height = H * dpr;
    var c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, W, H);
    var cy = 84, x0 = 44, x1 = x0 + 40 + (st.d / 6) * (W - x0 - 96);
    var f = F(), rel = Math.min(1, f / 500);

    c.strokeStyle = CV('--border'); c.lineWidth = 1;
    c.setLineDash([5, 5]);
    c.beginPath(); c.moveTo(x0, cy); c.lineTo(x1, cy); c.stroke();
    c.setLineDash([]);
    c.fillStyle = CV('--text3'); c.font = '10px IBM Plex Sans, sans-serif'; c.textAlign = 'center';
    c.fillText(st.d + ' ' + L({ es: 'unidades de distancia', en: 'units of distance' }), (x0 + x1) / 2, cy - 30);

    c.fillStyle = CV('--green');
    c.beginPath(); c.arc(x0, cy, 24, 0, Math.PI * 2); c.fill();
    c.fillStyle = CV('--rock');
    var rr = 5 + st.m * 1.3;
    c.beginPath(); c.arc(x1, cy, rr, 0, Math.PI * 2); c.fill();

    var len = 8 + 44 * rel;
    c.strokeStyle = CV('--gold'); c.fillStyle = CV('--gold'); c.lineWidth = 2.5;
    arrow(c, x0 + 27, cy, len, 1);
    arrow(c, x1 - rr - 3, cy, len, -1);

    c.fillStyle = CV('--text3'); c.font = '10px IBM Plex Sans, sans-serif';
    c.textAlign = 'left'; c.fillText(L({ es: 'cuerpo grande', en: 'big body' }), 8, cy + 46);
    c.textAlign = 'right'; c.fillText(L({ es: 'cuerpo pequeño', en: 'small body' }), W - 8, cy + 46);

    var bx = 24, bw = W - 48, by = 158;
    c.fillStyle = CV('--surface'); c.fillRect(bx, by, bw, 14);
    c.strokeStyle = CV('--border'); c.lineWidth = 1; c.strokeRect(bx, by, bw, 14);
    c.fillStyle = CV('--gold'); c.fillRect(bx, by, bw * rel, 14);
    if (!st.done){
      var tx = bx + bw * Math.min(1, tgt() / 500);
      c.strokeStyle = CV('--bad'); c.lineWidth = 2;
      c.beginPath(); c.moveTo(tx, by - 5); c.lineTo(tx, by + 19); c.stroke();
      c.fillStyle = CV('--bad'); c.font = '10px IBM Plex Sans, sans-serif'; c.textAlign = 'center';
      c.fillText(L({ es: 'pedido', en: 'asked' }), tx, by - 9);
    }
    c.fillStyle = CV('--text3'); c.font = '10px IBM Plex Sans, sans-serif'; c.textAlign = 'left';
    c.fillText(L({ es: 'marca del medidor', en: 'meter reading' }), bx, by - 9);
  }

  function paint(){
    document.getElementById('wFzaML').textContent = st.m;
    document.getElementById('wFzaDL').textContent = st.d;
    document.getElementById('wFzaRm').textContent = st.m;
    document.getElementById('wFzaRd').textContent = st.d;
    document.getElementById('wFzaRf').textContent = nf(F());
    document.getElementById('wFzaTask').textContent = st.done
      ? L({ es: 'Tablero libre: prueba a dejar la masa quieta y mover solo la distancia, y fíjate en lo rápido que se desploma la marca.',
            en: 'Free board: try leaving the mass still and moving only the distance, and watch how fast the reading collapses.' })
      : L({ es: 'Encargo ' + (st.r + 1) + ' de 3: ajusta la masa y la distancia hasta que el medidor marque ' + tgt() + ' unidades.',
            en: 'Task ' + (st.r + 1) + ' of 3: adjust the mass and the distance until the meter reads ' + tgt() + ' units.' });
    draw();
  }

  window.wFzaIn = function(){
    st.m = parseInt(document.getElementById('wFzaM').value, 10);
    st.d = parseInt(document.getElementById('wFzaD').value, 10);
    paint();
  };
  window.wFzaCheck = function(){
    var fb = document.getElementById('wFzaFb');
    if (st.done){
      fb.textContent = L({ es: 'La marca actual es ' + nf(F()) + ' unidades, con masa ' + st.m + ' y distancia ' + st.d + '.',
                           en: 'The current reading is ' + nf(F()) + ' units, with mass ' + st.m + ' and distance ' + st.d + '.' });
      return;
    }
    var T = tgt(), f = F();
    if (Math.round(f) === T){
      st.r++; st.tries = 0;
      if (st.r >= TG.length) st.done = true;
      paint();
      document.getElementById('wFzaFb').innerHTML = '<span class="okfb">🎉 ' + (st.done
        ? L({ es: 'Los tres encargos resueltos. La misma marca se consigue con muchas parejas de masa y distancia, y siempre por la misma razón.',
              en: 'All three tasks solved. The same reading can be got with many pairs of mass and distance, and always for the same reason.' })
        : L({ es: 'Exacto. Ahora fíjate: hay más de una pareja de masa y distancia que da esa misma marca.',
              en: 'Exactly. Now notice: there is more than one pair of mass and distance giving that same reading.' })) + '</span>';
      return;
    }
    st.tries++;
    if (st.tries >= 3){
      var s = SOL[T];
      st.m = s[0]; st.d = s[1];
      document.getElementById('wFzaM').value = st.m;
      document.getElementById('wFzaD').value = st.d;
      var msg = L({ es: 'Con masa ' + st.m + ' y distancia ' + st.d + ' el medidor marca ' + T + ': la masa multiplica y la distancia reparte dos veces.',
                    en: 'With mass ' + st.m + ' and distance ' + st.d + ' the meter reads ' + T + ': mass multiplies and distance shares out twice.' });
      st.r++; st.tries = 0;
      if (st.r >= TG.length) st.done = true;
      paint();
      fb.textContent = msg;
      return;
    }
    fb.textContent = (f < T)
      ? L({ es: 'Marca ' + nf(f) + ', por debajo de lo pedido: acerca los cuerpos o dale más masa al pequeño.',
            en: 'It reads ' + nf(f) + ', under what was asked: bring the bodies closer or give the small one more mass.' })
      : L({ es: 'Marca ' + nf(f) + ', por encima de lo pedido: sepáralos más o quítale masa al pequeño.',
            en: 'It reads ' + nf(f) + ', over what was asked: pull them farther apart or take mass off the small one.' });
  };

  paint();
  setTimeout(draw, 200);
  setTimeout(draw, 800);
}

/* ══ MANIPULATIVO 2 · BÁSCULA DE MUNDOS ════════════════════════════════════
   La misma carga viaja de un mundo a otro. Los kilogramos no se mueven; los
   newtons sí. Tres encargos de peso, con pista direccional y revelado.
   ═══════════════════════════════════════════════════════════════════════════ */
function wBascula(rng){
  var host = iw('scale', 'wBscW');
  var WD = [
    { es: 'Luna', en: 'Moon', g: 1.6 },
    { es: 'Marte', en: 'Mars', g: 3.7 },
    { es: 'Tierra', en: 'Earth', g: 9.8 },
    { es: 'Júpiter', en: 'Jupiter', g: 24.8 }
  ];
  var TG = [], usados = {};
  for (var i = 0; i < 3; i++){
    var wi = Math.floor(rng() * WD.length);
    var mm = 15 + 5 * Math.floor(rng() * 16);
    while (usados[wi + '_' + mm]) { mm = mm + 5 > 95 ? 15 : mm + 5; }
    usados[wi + '_' + mm] = 1;
    TG.push({ w: wi, m: mm, p: Math.round(mm * WD[wi].g) });
  }
  var st = { w: 2, m: 50, r: 0, tries: 0, done: false };
  function peso(){ return st.m * WD[st.w].g; }
  function tgt(){ return TG[Math.min(st.r, TG.length - 1)]; }

  function render(){
    host.innerHTML =
      '<div class="iw-tag">' + L({ es: 'Báscula de mundos', en: 'Scale of worlds' }) + '</div>' +
      '<div class="iw-task" id="wBscTask"></div>' +
      '<div class="wbtns">' + WD.map(function(w, wi){
        return '<button class="wbtn' + (wi === st.w ? ' on' : '') + '" onclick="wBscW(' + wi + ')">' + L(w) + '</button>';
      }).join('') + '</div>' +
      '<div class="ctrl"><label>' + L({ es: 'Carga sobre la báscula', en: 'Load on the scale' }) + ': <b id="wBscML"></b> kg</label>' +
        '<input type="range" id="wBscM" min="10" max="100" step="5" value="' + st.m + '" oninput="wBscIn()"></div>' +
      '<div class="barwrap"><div class="bar" id="wBscBar"></div></div>' +
      '<div class="readout">' +
        '<div class="ro"><div class="ro-l">' + L({ es: 'Masa', en: 'Mass' }) + '</div><div class="ro-v" id="wBscRm"></div></div>' +
        '<div class="ro"><div class="ro-l">' + L({ es: 'Cada kilogramo pesa', en: 'Each kilogram weighs' }) + '</div><div class="ro-v" id="wBscRg"></div></div>' +
        '<div class="ro"><div class="ro-l">' + L({ es: 'La báscula marca', en: 'The scale reads' }) + '</div><div class="ro-v" id="wBscRp"></div></div>' +
      '</div>' +
      '<button class="rverify-btn" onclick="wBscCheck()">' + L({ es: 'Comprobar', en: 'Check' }) + '</button>' +
      '<div class="rfb" id="wBscFb"></div>';
    paint();
  }

  function paint(){
    var p = peso();
    document.getElementById('wBscML').textContent = st.m;
    document.getElementById('wBscRm').textContent = st.m + ' kg';
    document.getElementById('wBscRg').textContent = nf(WD[st.w].g) + ' N';
    document.getElementById('wBscRp').textContent = nf(Math.round(p * 10) / 10) + ' N';
    document.getElementById('wBscBar').style.width = Math.min(100, p / 2480 * 100) + '%';
    document.getElementById('wBscTask').textContent = st.done
      ? L({ es: 'Tablero libre: deja los kilogramos quietos y cambia de mundo, para ver cuál de los dos números se mueve.',
            en: 'Free board: leave the kilograms still and change world, to see which of the two numbers moves.' })
      : L({ es: 'Encargo ' + (st.r + 1) + ' de 3: elige mundo y carga hasta que la báscula marque ' + nf(tgt().p) + ' N.',
            en: 'Task ' + (st.r + 1) + ' of 3: choose world and load until the scale reads ' + nf(tgt().p) + ' N.' });
  }

  window.wBscW = function(wi){
    st.w = wi;
    var btns = host.querySelectorAll('.wbtn');
    for (var i = 0; i < btns.length; i++) btns[i].classList.toggle('on', i === wi);
    paint();
  };
  window.wBscIn = function(){
    st.m = parseInt(document.getElementById('wBscM').value, 10);
    paint();
  };
  window.wBscCheck = function(){
    var fb = document.getElementById('wBscFb'), p = peso();
    if (st.done){
      fb.textContent = L({ es: 'Ahora mismo ' + st.m + ' kg pesan ' + nf(Math.round(p * 10) / 10) + ' N en ' + L(WD[st.w]) + '.',
                           en: 'Right now ' + st.m + ' kg weigh ' + nf(Math.round(p * 10) / 10) + ' N on ' + L(WD[st.w]) + '.' });
      return;
    }
    var T = tgt();
    if (Math.abs(p - T.p) <= 2){
      st.r++; st.tries = 0;
      if (st.r >= TG.length) st.done = true;
      paint();
      document.getElementById('wBscFb').innerHTML = '<span class="okfb">🎉 ' + (st.done
        ? L({ es: 'Los tres encargos resueltos. La misma marca se alcanza con poca carga en un mundo que tira fuerte o con mucha carga en uno que tira flojo.',
              en: 'All three tasks solved. The same reading is reached with a small load on a world that pulls hard or a big load on one that pulls softly.' })
        : L({ es: 'Esa es la marca. Fíjate en que los kilogramos de la carga no cambiaron al cambiar de mundo.',
              en: 'That is the reading. Notice that the kilograms of the load did not change when you changed world.' })) + '</span>';
      return;
    }
    st.tries++;
    if (st.tries >= 3){
      st.w = T.w; st.m = T.m;
      var msg = L({ es: 'Con ' + T.m + ' kg en ' + L(WD[T.w]) + ' la báscula marca ' + nf(T.p) + ' N, porque allí cada kilogramo pesa ' + nf(WD[T.w].g) + ' N.',
                    en: 'With ' + T.m + ' kg on ' + L(WD[T.w]) + ' the scale reads ' + nf(T.p) + ' N, because there each kilogram weighs ' + nf(WD[T.w].g) + ' N.' });
      st.r++; st.tries = 0;
      if (st.r >= TG.length) st.done = true;
      render();
      document.getElementById('wBscFb').textContent = msg;
      return;
    }
    fb.textContent = (p < T.p)
      ? L({ es: 'La báscula marca ' + nf(Math.round(p * 10) / 10) + ' N, menos de lo pedido: sube la carga o pásate a un mundo que tire más fuerte.',
            en: 'The scale reads ' + nf(Math.round(p * 10) / 10) + ' N, less than asked: raise the load or move to a world that pulls harder.' })
      : L({ es: 'La báscula marca ' + nf(Math.round(p * 10) / 10) + ' N, más de lo pedido: baja la carga o pásate a un mundo que tire más flojo.',
            en: 'The scale reads ' + nf(Math.round(p * 10) / 10) + ' N, more than asked: lower the load or move to a world that pulls more softly.' });
  };

  render();
}

/* ══ MANIPULATIVO 3 · LANZADOR ORBITAL ═════════════════════════════════════
   La sonda se suelta a la altura de una órbita baja con la rapidez de lado que
   elija el alumno. La trayectoria se integra paso a paso y se dibuja completa:
   cae, gira o escapa. Tres encargos con pista direccional y revelado.
   ═══════════════════════════════════════════════════════════════════════════ */
function wLanzador(rng){
  var host = iw('launch', 'wLzrW');
  var RP = 45.5, R0 = 48.5, GM = 7.7 * 7.7 * R0;
  var VESC = Math.sqrt(2 * GM / R0);
  var KM = 6371 / 45.5;
  var TG = shuffle(['cae', 'orbita', 'escapa'], rng);
  var FIX = { cae: 7.2, orbita: 8.4, escapa: 11.4 };
  var st = { v: 7.0, r: 0, tries: 0, done: false };

  function nombre(k){
    if (k === 'cae') return L({ es: 'cae al suelo', en: 'falls to the ground' });
    if (k === 'escapa') return L({ es: 'escapa y no vuelve', en: 'escapes and does not come back' });
    return L({ es: 'queda girando en órbita', en: 'stays circling in orbit' });
  }
  function tgt(){ return TG[Math.min(st.r, TG.length - 1)]; }

  function sim(v){
    var x = 0, y = -R0, vx = v, vy = 0, dt = 0.03, pts = [[x, y]], hit = false, mx = R0;
    for (var i = 0; i < 6000; i++){
      var r = Math.sqrt(x * x + y * y);
      var a = -GM / (r * r * r);
      vx += a * x * dt; vy += a * y * dt;
      x += vx * dt; y += vy * dt;
      r = Math.sqrt(x * x + y * y);
      if (r > mx) mx = r;
      if (i % 4 === 0) pts.push([x, y]);
      if (r < RP){ hit = true; pts.push([x, y]); break; }
      if (r > 1500) break;
    }
    return { pts: pts, hit: hit, mx: mx };
  }
  function apogeo(v){
    var inv = 2 / R0 - v * v / GM;
    if (inv <= 0) return Infinity;
    return 2 / inv - R0;
  }
  function outcome(v, s){
    if (s.hit) return 'cae';
    if (v >= VESC) return 'escapa';
    return 'orbita';
  }

  host.innerHTML =
    '<div class="iw-tag">' + L({ es: 'Lanzador orbital', en: 'Orbital launcher' }) + '</div>' +
    '<div class="iw-task" id="wLzrTask"></div>' +
    '<div class="iw-cv"><canvas id="wLzrCv"></canvas></div>' +
    '<div class="ctrl"><label>' + L({ es: 'Rapidez de lado al soltarla', en: 'Sideways speed at release' }) + ': <b id="wLzrVL"></b> km/s</label>' +
      '<input type="range" id="wLzrV" min="7" max="12" step="0.1" value="7" oninput="wLzrIn()"></div>' +
    '<div class="readout">' +
      '<div class="ro"><div class="ro-l">' + L({ es: 'Rapidez', en: 'Speed' }) + '</div><div class="ro-v" id="wLzrRv"></div></div>' +
      '<div class="ro"><div class="ro-l">' + L({ es: 'Punto más alto', en: 'Highest point' }) + '</div><div class="ro-v" id="wLzrRa"></div></div>' +
      '<div class="ro"><div class="ro-l">' + L({ es: 'Resultado', en: 'Outcome' }) + '</div><div class="ro-v" id="wLzrRo"></div></div>' +
    '</div>' +
    '<button class="rverify-btn" onclick="wLzrCheck()">' + L({ es: 'Comprobar', en: 'Check' }) + '</button>' +
    '<div class="rfb" id="wLzrFb"></div>';

  function draw(){
    var cv = document.getElementById('wLzrCv'); if (!cv) return;
    var rect = cv.getBoundingClientRect();
    var dpr = window.devicePixelRatio || 1;
    var W = Math.round(rect.width || 320), H = 250;
    cv.width = W * dpr; cv.height = H * dpr;
    var c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, W, H);
    var s = sim(st.v), cx = W / 2, cy = H / 2 + 10;
    var far = RP;
    for (var i = 0; i < s.pts.length; i++){
      far = Math.max(far, Math.abs(s.pts[i][0]), Math.abs(s.pts[i][1]));
    }
    var k = Math.max(0.02, Math.min(1, (H / 2 - 16) / far));

    c.fillStyle = CV('--green');
    c.beginPath(); c.arc(cx, cy, RP * k, 0, Math.PI * 2); c.fill();
    c.strokeStyle = CV('--sea'); c.lineWidth = 1;
    c.beginPath(); c.arc(cx, cy, R0 * k, 0, Math.PI * 2); c.stroke();

    c.strokeStyle = CV('--gold'); c.lineWidth = 2;
    c.beginPath();
    c.moveTo(cx + s.pts[0][0] * k, cy + s.pts[0][1] * k);
    for (var j = 1; j < s.pts.length; j++) c.lineTo(cx + s.pts[j][0] * k, cy + s.pts[j][1] * k);
    c.stroke();

    var last = s.pts[s.pts.length - 1];
    c.fillStyle = CV('--bad');
    c.beginPath(); c.arc(cx + last[0] * k, cy + last[1] * k, 4, 0, Math.PI * 2); c.fill();
    c.fillStyle = CV('--text3'); c.font = '10px IBM Plex Sans, sans-serif'; c.textAlign = 'center';
    c.fillText(L({ es: 'suelta aquí', en: 'released here' }), cx, cy - R0 * k - 8);
    c.textAlign = 'left';
    c.fillText(L({ es: 'la escala se ajusta sola al tamaño del recorrido', en: 'the scale adjusts itself to the size of the path' }), 8, H - 8);
  }

  function paint(){
    var s = sim(st.v), out = outcome(st.v, s), ap = apogeo(st.v);
    document.getElementById('wLzrVL').textContent = nf(st.v);
    document.getElementById('wLzrRv').textContent = nf(st.v) + ' km/s';
    document.getElementById('wLzrRo').textContent = nombre(out);
    document.getElementById('wLzrRa').textContent = (out === 'cae')
      ? L({ es: 'choca', en: 'impact' })
      : (out === 'escapa' ? L({ es: 'se va', en: 'leaves' })
                          : nf(Math.round((ap - RP) * KM / 100) * 100) + ' km');
    document.getElementById('wLzrTask').textContent = st.done
      ? L({ es: 'Tablero libre: sube la rapidez de poco en poco desde 7.6 km/s y mira cómo la órbita se va estirando hasta romperse.',
            en: 'Free board: raise the speed little by little from 7.6 km/s and watch the orbit stretch until it breaks open.' })
      : L({ es: 'Encargo ' + (st.r + 1) + ' de 3: consigue que la sonda ' + nombre(tgt()) + '.',
            en: 'Task ' + (st.r + 1) + ' of 3: get the probe to ' + nombre(tgt()) + '.' });
    draw();
  }

  window.wLzrIn = function(){
    st.v = Math.round(parseFloat(document.getElementById('wLzrV').value) * 10) / 10;
    paint();
  };
  window.wLzrCheck = function(){
    var fb = document.getElementById('wLzrFb');
    var s = sim(st.v), out = outcome(st.v, s);
    if (st.done){
      fb.textContent = L({ es: 'A ' + nf(st.v) + ' km/s la sonda ' + nombre(out) + '.',
                           en: 'At ' + nf(st.v) + ' km/s the probe ' + nombre(out) + '.' });
      return;
    }
    var T = tgt();
    if (out === T){
      st.r++; st.tries = 0;
      if (st.r >= TG.length) st.done = true;
      paint();
      document.getElementById('wLzrFb').innerHTML = '<span class="okfb">🎉 ' + (st.done
        ? L({ es: 'Los tres encargos resueltos. Entre caer y escapar solo hay unos pocos km/s de diferencia.',
              en: 'All three tasks solved. Between falling and escaping there are only a few km/s of difference.' })
        : L({ es: 'Conseguido. Cambia la rapidez poco a poco y busca el punto exacto en el que el resultado cambia.',
              en: 'Done. Change the speed little by little and look for the exact point where the outcome changes.' })) + '</span>';
      return;
    }
    st.tries++;
    if (st.tries >= 3){
      st.v = FIX[T];
      document.getElementById('wLzrV').value = st.v;
      var msg = L({ es: 'A ' + nf(st.v) + ' km/s la sonda ' + nombre(T) + '. Por debajo de 7.6 km/s la caída gana; pasando de 10.9 km/s ya no vuelve.',
                    en: 'At ' + nf(st.v) + ' km/s the probe ' + nombre(T) + '. Below 7.6 km/s the fall wins; past 10.9 km/s it does not come back.' });
      st.r++; st.tries = 0;
      if (st.r >= TG.length) st.done = true;
      paint();
      fb.textContent = msg;
      return;
    }
    var subir = (T === 'escapa' && out !== 'escapa') || (T === 'orbita' && out === 'cae');
    fb.textContent = subir
      ? L({ es: 'Ahora la sonda ' + nombre(out) + ': te falta rapidez de lado, sube el control.',
            en: 'Right now the probe ' + nombre(out) + ': you are short of sideways speed, raise the control.' })
      : L({ es: 'Ahora la sonda ' + nombre(out) + ': llevas demasiada rapidez de lado, baja el control.',
            en: 'Right now the probe ' + nombre(out) + ': you carry too much sideways speed, lower the control.' });
  };

  paint();
  setTimeout(draw, 200);
  setTimeout(draw, 800);
}

/* ══ MANIPULATIVO 4 · ORDENAR POR LA DURACIÓN DEL AÑO ══════════════════════
   Planetas revueltos, cada uno con su distancia al Sol. El alumno toca dos
   fichas para intercambiarlas hasta dejar el año más corto arriba.
   ═══════════════════════════════════════════════════════════════════════════ */
function wOrden(rng){
  var host = iw('order', 'wOrdW');
  var POOL = [
    { es: 'Mercurio', en: 'Mercury', ua: 0.39, an: L({ es: '88 días', en: '88 days' }) },
    { es: 'Venus', en: 'Venus', ua: 0.72, an: L({ es: '225 días', en: '225 days' }) },
    { es: 'Tierra', en: 'Earth', ua: 1, an: L({ es: '365 días', en: '365 days' }) },
    { es: 'Marte', en: 'Mars', ua: 1.52, an: L({ es: '687 días', en: '687 days' }) },
    { es: 'Júpiter', en: 'Jupiter', ua: 5.2, an: L({ es: '11.9 años', en: '11.9 years' }) },
    { es: 'Saturno', en: 'Saturn', ua: 9.5, an: L({ es: '29.5 años', en: '29.5 years' }) },
    { es: 'Urano', en: 'Uranus', ua: 19.2, an: L({ es: '84 años', en: '84 years' }) }
  ];
  var EV = shuffle(POOL, rng).slice(0, 5).sort(function(a, b){ return a.ua - b.ua; });
  var perm = shuffle([0, 1, 2, 3, 4], rng);
  if (perm.every(function(e, i){ return e === i; })) { var t0 = perm[0]; perm[0] = perm[4]; perm[4] = t0; }
  var st = { o: perm, sel: null, tries: 0, done: false };

  function render(){
    var chips = st.o.map(function(ei, pos){
      var cls = 'tl-chip' + (st.sel === pos ? ' sel' : '') + (st.done ? ' locked' : '');
      return '<div class="' + cls + '" onclick="wOrdTap(' + pos + ')">' +
        '<span class="tl-num">' + (pos + 1) + '</span> ' + L(EV[ei]) +
        '<span class="tl-far">' + nf(EV[ei].ua) + ' UA' + (st.done ? ' · ' + EV[ei].an : '') + '</span></div>';
    }).join('');
    host.innerHTML =
      '<div class="iw-tag">' + L({ es: 'Del año más corto al más largo', en: 'From the shortest year to the longest' }) + '</div>' +
      '<div class="iw-task">' + (st.done
        ? L({ es: 'Este es el orden. Junto a cada planeta aparece ahora cuánto dura su año.',
              en: 'This is the order. Next to each planet you can now see how long its year lasts.' })
        : L({ es: 'Coloca arriba el planeta cuyo año dura menos. Toca dos fichas para intercambiarlas.',
              en: 'Put at the top the planet whose year lasts the least. Tap two chips to swap them.' })) + '</div>' +
      '<div class="tl-list">' + chips + '</div>' +
      (st.done ? '' : '<button class="rverify-btn" onclick="wOrdCheck()">' + L({ es: 'Comprobar', en: 'Check' }) + '</button>') +
      '<div class="rfb" id="wOrdFb"></div>';
  }

  window.wOrdTap = function(pos){
    if (st.done) return;
    if (st.sel === null) st.sel = pos;
    else if (st.sel === pos) st.sel = null;
    else { var t = st.o[st.sel]; st.o[st.sel] = st.o[pos]; st.o[pos] = t; st.sel = null; }
    render();
  };
  window.wOrdCheck = function(){
    var ok = st.o.every(function(ei, pos){ return ei === pos; });
    if (ok){
      st.done = true; render();
      document.getElementById('wOrdFb').innerHTML = '<span class="okfb">🎉 ' +
        L({ es: 'Orden correcto. Cuanto más lejos del Sol, más largo el año, sin una sola excepción.',
            en: 'Correct order. The farther from the Sun, the longer the year, without a single exception.' }) + '</span>';
      return;
    }
    st.tries++;
    if (st.tries >= 3){
      st.o = [0, 1, 2, 3, 4]; st.done = true; render();
      document.getElementById('wOrdFb').textContent =
        L({ es: 'Este es el orden correcto: coincide exactamente con el orden de las distancias al Sol.',
            en: 'This is the correct order: it matches exactly the order of the distances to the Sun.' });
      return;
    }
    var bad = 0;
    for (var i = 0; i < st.o.length; i++){ if (st.o[i] !== i){ bad = i; break; } }
    document.getElementById('wOrdFb').textContent =
      L({ es: 'Aún no. Revisa la ficha del lugar ' + (bad + 1) + ': compara su distancia al Sol con la de la ficha que tiene debajo.',
          en: 'Not yet. Check the chip in place ' + (bad + 1) + ': compare its distance to the Sun with the one of the chip below it.' });
  };

  render();
}

/* ══ MANIPULATIVO 5 · TIERRA, LUNA Y MAREAS ════════════════════════════════
   El alumno recorre los 29.5 días del ciclo. El abultamiento del océano gira
   con la Luna y el tablero informa la fase y el tamaño de la marea. Tres
   encargos con pista direccional y revelado al tercer intento.
   ═══════════════════════════════════════════════════════════════════════════ */
function wMareas(rng){
  var host = iw('tides', 'wMarW');
  var CIC = 29.5;
  var FASES = [
    L({ es: 'luna nueva', en: 'new moon' }),
    L({ es: 'creciente', en: 'waxing crescent' }),
    L({ es: 'cuarto creciente', en: 'first quarter' }),
    L({ es: 'gibosa creciente', en: 'waxing gibbous' }),
    L({ es: 'luna llena', en: 'full moon' }),
    L({ es: 'gibosa menguante', en: 'waning gibbous' }),
    L({ es: 'cuarto menguante', en: 'last quarter' }),
    L({ es: 'menguante', en: 'waning crescent' })
  ];
  var TASKS = [
    { d: 0, t: L({ es: 'coloca la Luna entre el Sol y la Tierra, donde los dos tirones se suman', en: 'place the Moon between the Sun and the Earth, where the two pulls add up' }) },
    { d: 14.5, t: L({ es: 'coloca la Tierra entre el Sol y la Luna, la otra alineación del ciclo', en: 'put the Earth between the Sun and the Moon, the other lining up of the cycle' }) },
    { d: 7.5, t: L({ es: 'coloca la Luna donde su tirón y el del Sol forman ángulo recto y las mareas quedan pequeñas', en: 'place the Moon where its pull and the one of the Sun make a right angle and the tides stay small' }) },
    { d: 22, t: L({ es: 'vuelve a dejar las mareas pequeñas, ahora en la otra mitad del recorrido', en: 'leave the tides small again, now on the other half of the journey' }) }
  ];
  var TG = shuffle(TASKS, rng).slice(0, 3);
  var st = { i: 10, r: 0, tries: 0, done: false };
  function dia(){ return st.i / 2; }
  function ang(d){ return (180 - 360 * d / CIC) * Math.PI / 180; }
  function fase(d){ return FASES[Math.round(d / CIC * 8) % 8]; }
  function marea(d){
    var ca = Math.abs(Math.cos(ang(d)));
    if (ca > 0.9) return L({ es: 'viva (la más grande)', en: 'spring (the biggest)' });
    if (ca < 0.35) return L({ es: 'muerta (la más pequeña)', en: 'neap (the smallest)' });
    return L({ es: 'intermedia', en: 'in between' });
  }
  function tgt(){ return TG[Math.min(st.r, TG.length - 1)]; }
  function dist(a, b){
    var e = Math.abs(a - b) % CIC;
    return Math.min(e, CIC - e);
  }

  host.innerHTML =
    '<div class="iw-tag">' + L({ es: 'Tierra, Luna y mareas', en: 'Earth, Moon and tides' }) + '</div>' +
    '<div class="iw-task" id="wMarTask"></div>' +
    '<div class="iw-cv"><canvas id="wMarCv"></canvas></div>' +
    '<div class="ctrl"><label>' + L({ es: 'Día del ciclo', en: 'Day of the cycle' }) + ': <b id="wMarDL"></b></label>' +
      '<input type="range" id="wMarD" min="0" max="59" step="1" value="10" oninput="wMarIn()"></div>' +
    '<div class="readout">' +
      '<div class="ro"><div class="ro-l">' + L({ es: 'Día', en: 'Day' }) + '</div><div class="ro-v" id="wMarRd"></div></div>' +
      '<div class="ro"><div class="ro-l">' + L({ es: 'Fase', en: 'Phase' }) + '</div><div class="ro-v" id="wMarRf"></div></div>' +
      '<div class="ro"><div class="ro-l">' + L({ es: 'Marea', en: 'Tide' }) + '</div><div class="ro-v" id="wMarRm"></div></div>' +
    '</div>' +
    '<button class="rverify-btn" onclick="wMarCheck()">' + L({ es: 'Comprobar', en: 'Check' }) + '</button>' +
    '<div class="rfb" id="wMarFb"></div>';

  function draw(){
    var cv = document.getElementById('wMarCv'); if (!cv) return;
    var rect = cv.getBoundingClientRect();
    var dpr = window.devicePixelRatio || 1;
    var W = Math.round(rect.width || 320), H = 250;
    cv.width = W * dpr; cv.height = H * dpr;
    var c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, W, H);
    var cx = W * 0.62, cy = H / 2 + 4, RE = 24;
    var RO = Math.max(60, Math.min(100, W * 0.4 - 18));
    var d = dia(), a = ang(d);
    var mx = cx + RO * Math.cos(a), my = cy - RO * Math.sin(a);

    c.fillStyle = CV('--gold');
    c.beginPath(); c.arc(-12, cy, 36, 0, Math.PI * 2); c.fill();
    c.strokeStyle = CV('--gold'); c.lineWidth = 1.5;
    [-30, 0, 30].forEach(function(dy){
      c.beginPath(); c.moveTo(28, cy + dy); c.lineTo(50, cy + dy); c.stroke();
      c.beginPath(); c.moveTo(50, cy + dy); c.lineTo(43, cy + dy - 4); c.lineTo(43, cy + dy + 4); c.closePath(); c.fill();
    });
    c.fillStyle = CV('--text3'); c.font = '10px IBM Plex Sans, sans-serif'; c.textAlign = 'left';
    c.fillText(L({ es: 'luz y tirón del Sol', en: 'light and pull of the Sun' }), 6, cy + 58);

    c.strokeStyle = CV('--border'); c.lineWidth = 1;
    c.setLineDash([4, 4]);
    c.beginPath(); c.arc(cx, cy, RO, 0, Math.PI * 2); c.stroke();
    c.setLineDash([]);

    c.fillStyle = CV('--sea');
    c.beginPath(); c.ellipse(cx, cy, RE * 1.62, RE * 1.1, -a, 0, Math.PI * 2); c.fill();
    c.fillStyle = CV('--green');
    c.beginPath(); c.arc(cx, cy, RE, 0, Math.PI * 2); c.fill();
    c.fillStyle = CV('--surface'); c.font = 'bold 9px IBM Plex Sans, sans-serif';
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(L({ es: 'Tierra', en: 'Earth' }), cx, cy);
    c.textBaseline = 'alphabetic';

    c.fillStyle = CV('--sea'); c.font = '9px IBM Plex Sans, sans-serif'; c.textAlign = 'center';
    var bx = cx + Math.cos(a) * RE * 1.95, by = cy - Math.sin(a) * RE * 1.95;
    var bx2 = cx - Math.cos(a) * RE * 1.95, by2 = cy + Math.sin(a) * RE * 1.95;
    c.fillText(L({ es: 'marea alta', en: 'high tide' }), bx, by);
    c.fillText(L({ es: 'marea alta', en: 'high tide' }), bx2, by2);

    c.fillStyle = CV('--wire');
    c.beginPath(); c.arc(mx, my, 10, 0, Math.PI * 2); c.fill();
    c.fillStyle = CV('--gold');
    c.beginPath(); c.arc(mx, my, 10, Math.PI / 2, Math.PI * 1.5); c.closePath(); c.fill();
    c.strokeStyle = CV('--border'); c.lineWidth = 1.5;
    c.beginPath(); c.arc(mx, my, 10, 0, Math.PI * 2); c.stroke();
    c.fillStyle = CV('--text3'); c.font = '10px IBM Plex Sans, sans-serif'; c.textAlign = 'center';
    c.fillText(L({ es: 'Luna', en: 'Moon' }), mx, my - 15);
  }

  function paint(){
    var d = dia();
    document.getElementById('wMarDL').textContent = nf(d);
    document.getElementById('wMarRd').textContent = nf(d);
    document.getElementById('wMarRf').textContent = fase(d);
    document.getElementById('wMarRm').textContent = marea(d);
    document.getElementById('wMarTask').textContent = st.done
      ? L({ es: 'Tablero libre: recorre el ciclo entero y observa que el abultamiento del océano siempre apunta hacia la Luna, gire donde gire.',
            en: 'Free board: run through the whole cycle and see that the bulge of the ocean always points towards the Moon, wherever it turns.' })
      : L({ es: 'Encargo ' + (st.r + 1) + ' de 3: ' + tgt().t + '.',
            en: 'Task ' + (st.r + 1) + ' of 3: ' + tgt().t + '.' });
    draw();
  }

  window.wMarIn = function(){
    st.i = parseInt(document.getElementById('wMarD').value, 10);
    paint();
  };
  window.wMarCheck = function(){
    var fb = document.getElementById('wMarFb'), d = dia();
    if (st.done){
      fb.textContent = L({ es: 'Día ' + nf(d) + ': ' + fase(d) + ', con marea ' + marea(d) + '.',
                           en: 'Day ' + nf(d) + ': ' + fase(d) + ', with ' + marea(d) + ' tide.' });
      return;
    }
    var T = tgt();
    if (dist(d, T.d) <= 1){
      st.r++; st.tries = 0;
      if (st.r >= TG.length) st.done = true;
      paint();
      document.getElementById('wMarFb').innerHTML = '<span class="okfb">🎉 ' + (st.done
        ? L({ es: 'Los tres encargos resueltos. Las mareas grandes y las pequeñas se turnan cada semana y media, siguiendo a la Luna.',
              en: 'All three tasks solved. Big tides and small ones take turns every week and a half, following the Moon.' })
        : L({ es: 'Ahí está. Fíjate hacia dónde apunta el abultamiento del océano respecto de la línea que va al Sol.',
              en: 'There it is. Notice where the bulge of the ocean points with respect to the line going to the Sun.' })) + '</span>';
      return;
    }
    st.tries++;
    if (st.tries >= 3){
      st.i = Math.round(T.d * 2);
      document.getElementById('wMarD').value = st.i;
      var msg = L({ es: 'Es el día ' + nf(T.d) + ' del ciclo: ' + fase(T.d) + ', con marea ' + marea(T.d) + '.',
                    en: 'It is day ' + nf(T.d) + ' of the cycle: ' + fase(T.d) + ', with ' + marea(T.d) + ' tide.' });
      st.r++; st.tries = 0;
      if (st.r >= TG.length) st.done = true;
      paint();
      fb.textContent = msg;
      return;
    }
    var fwd = ((T.d - d) % CIC + CIC) % CIC;
    fb.textContent = (fwd <= CIC / 2)
      ? L({ es: 'Todavía no: ahora hay ' + fase(d) + ' y marea ' + marea(d) + '. Avanza unos días más en el ciclo.',
            en: 'Not yet: right now there is ' + fase(d) + ' and ' + marea(d) + ' tide. Move a few more days along the cycle.' })
      : L({ es: 'Todavía no: ahora hay ' + fase(d) + ' y marea ' + marea(d) + '. Retrocede unos días en el ciclo.',
            en: 'Not yet: right now there is ' + fase(d) + ' and ' + marea(d) + ' tide. Go back a few days along the cycle.' });
  };

  paint();
  setTimeout(draw, 200);
  setTimeout(draw, 800);
}
</script>

<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbykkuJ_apGq3vALIFd4mr3acu81c7K4OKxW-DZ-i52Ceyl3lOanXMdvbS9SIXPrLQBm/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';

  var moduleTitle = 'Gravitación y Dinámica del Sistema Solar';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
