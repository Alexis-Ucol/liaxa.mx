<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Principio de Pascal: Frenos Hidráulicos y Elevadores</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Principio de Pascal: Frenos Hidráulicos y Elevadores</div>
    <div class="wcourse" id="wcourse-el">Física · 2° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Principio de Pascal: Frenos Hidráulicos y Elevadores</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="sbtn" id="dlBtn" onclick="generatePDF()" style="max-width:280px;margin:0 auto;">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   CENTRALIZED SCHOOL CONFIG (Rule 16) — ships UNBRANDED (Rule 11).
   The ONLY rebranding point. build_all.py substitutes these exact fields
   (BRAND_FIELDS / RGB_FIELDS / logo*) downstream; :root/dark stay as fallback.
   Neutral defaults below == the static :root/dark values, so unbranded == no-op.
   ══════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:'#c0202a', primaryDark:'#490a0e', primaryBg:'#f6e7e8',
  accent:'#f5c800', accentBg:'#fff8db',
  darkPrimary:'#c94049', darkPrimaryDark:'#e97179', darkPrimaryBg:'#3b0a0e',

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');

  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');

}

async function generatePDF() {
  var btn = document.getElementById('dlBtn');
  btn.textContent = 'Generando PDF…';
  btn.disabled = true;

  var jspdf   = window.jspdf;
  var doc     = new jspdf.jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });
  var PW      = 215.9;
  var M       = 18;
  var TW      = PW - M * 2;
  var PH      = doc.internal.pageSize.height;
  var name    = studentData.name;
  var group   = studentData.group;
  var total   = problems.length;
  var pct     = Math.round(correctCount / total * 100);
  var dateStr = new Date().toLocaleString('es-MX', { dateStyle:'long', timeStyle:'short' });

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS — INJECTION BLOCK ─────────────────────────────────────────
  //   Match these RGB values to --green and --gold above.
  //   PRIMARY  → pBR, pBG, pBB
  //   ACCENT   → pAR, pAG, pAB
  // ──────────────────────────────────────────────────────────────────────────
  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;  // PRIMARY (from SCHOOL, Rule 16)
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;   // ACCENT (from SCHOOL, Rule 16)

  function pdfText(html) {
    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')

function L(o){ return (o && o[LANG] !== undefined) ? o[LANG] : (o ? o.es : ''); }
function ri(rng, a, b){ return a + Math.floor(rng() * (b - a + 1)); }

function cssv(n){ var v = getComputedStyle(document.documentElement).getPropertyValue(n); return (v || '').trim() || '#000000'; }

var GW_DRAWS = [];
function fitCanvas(c){
  var dpr = window.devicePixelRatio || 1;
  var w = c.clientWidth || 320;
  var h = c.clientHeight || 230;
  if (c.width !== Math.round(w * dpr) || c.height !== Math.round(h * dpr)) {
    c.width = Math.round(w * dpr); c.height = Math.round(h * dpr);
  }
  var ctx = c.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  return { ctx: ctx, w: w, h: h };
}
function regDraw(fn){ GW_DRAWS.push(fn); setTimeout(fn, 140); setTimeout(fn, 520); }
(function(){
  var to = null;
  window.addEventListener('resize', function(){
    clearTimeout(to);
    to = setTimeout(function(){ GW_DRAWS.forEach(function(f){ try{ f(); }catch(e){} }); }, 120);
  });
})();

function arrowUp(ctx, x, y0, y1, wdt, color){
  ctx.strokeStyle = color; ctx.lineWidth = wdt;
  ctx.beginPath(); ctx.moveTo(x, y0); ctx.lineTo(x, y1 + 9); ctx.stroke();
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.moveTo(x, y1); ctx.lineTo(x - 7, y1 + 11); ctx.lineTo(x + 7, y1 + 11);
  ctx.closePath(); ctx.fill();
}
function arrowRight(ctx, x0, x1, y, wdt, color){
  ctx.strokeStyle = color; ctx.lineWidth = wdt;
  ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1 - 8, y); ctx.stroke();
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.moveTo(x1, y); ctx.lineTo(x1 - 10, y - 6); ctx.lineTo(x1 - 10, y + 6);
  ctx.closePath(); ctx.fill();
}

  var idx = problems.length;

  var prob = {
    title: spec.title,
    questionText: spec.q,

    correctIdx: sh.indexOf(correctVal),

   Dos deslizadores, fuerza y area de apoyo. El bloque se hunde en la espuma
   segun la presion que ejerce. Tres metas de presion, muchas combinaciones
   posibles para cada una, retroalimentacion que dice hacia donde moverse.

function w1(rng, host){
  var metas = shuffle([3, 4, 5, 6, 8, 10], rng).slice(0, 3);
  var r = 0, tries = 0, done = false;
  var F = 40, A = 10;

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Mesa de presión', en:'Pressure table' }) + '<span class="gw-tag" id="w1tag"></span></div>' +
    '<div class="gw-q" id="w1q"></div>' +
    '<div class="gw-mini">' + L({
      es:'El bloque descansa sobre espuma. Mueve los deslizadores y observa cuánto se hunde: el hundimiento sigue a la presión, no a la fuerza.',
      en:'The block rests on foam. Move the sliders and watch how deep it sinks: the sinking follows the pressure, not the force.'
    }) + '</div>' +
    '<canvas class="gw-cvs" id="w1c"></canvas>' +
    '<div class="gw-slab"><span class="gw-cl">' + L({ es:'Fuerza', en:'Force' }) + '</span><input type="range" id="w1F" min="10" max="120" step="10" value="40"><span class="gw-sv" id="w1Fv">40 N</span></div>' +
    '<div class="gw-slab"><span class="gw-cl">' + L({ es:'Área de apoyo', en:'Contact area' }) + '</span><input type="range" id="w1A" min="2" max="20" step="2" value="10"><span class="gw-sv" id="w1Av">10 cm²</span></div>' +
    '<div class="gw-out">' +
      '<div class="gw-cell"><div class="gw-cn">' + L({ es:'Fuerza', en:'Force' }) + '</div><div class="gw-cv" id="w1o1">40 N</div></div>' +
      '<div class="gw-cell"><div class="gw-cn">' + L({ es:'Área', en:'Area' }) + '</div><div class="gw-cv" id="w1o2">10 cm²</div></div>' +
      '<div class="gw-cell"><div class="gw-cn">' + L({ es:'Presión', en:'Pressure' }) + '</div><div class="gw-cv" id="w1o3">4 N/cm²</div></div>' +
    '</div>' +
    '<div class="gw-row"><button class="gw-btn" id="w1k">' + L({ es:'Comprobar', en:'Check' }) + '</button></div>' +
    '<div class="gw-fb"></div>';

  var cv = host.querySelector('#w1c');
  function pres(){ return F / A; }
  function fmt(x){ return (Math.round(x * 10) / 10).toString().replace('.', ','); }
  function fmtEn(x){ return (Math.round(x * 10) / 10).toString(); }
  function pstr(){ return (LANG === 'es' ? fmt(pres()) : fmtEn(pres())) + ' N/cm²'; }

  function draw(){
    var g = fitCanvas(cv), ctx = g.ctx, W = g.w, H = g.h;
    var groundY = H * 0.60;
    ctx.fillStyle = cssv('--green-bg');
    ctx.fillRect(0, groundY, W, H - groundY);
    ctx.strokeStyle = cssv('--border'); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, groundY); ctx.lineTo(W, groundY); ctx.stroke();
    var sink = Math.min(pres() * 5.5, H - groundY - 14);
    var bw = Math.max(24, Math.min(A * 9, W - 60));
    var bh = 42;
    var bx = W / 2 - bw / 2, by = groundY - bh + sink;
    ctx.fillStyle = cssv('--surface2');
    ctx.fillRect(bx - 2, groundY, bw + 4, sink);
    ctx.fillStyle = cssv('--green');
    ctx.fillRect(bx, by, bw, bh);
    arrowUp(ctx, W / 2, by - 56, by - 6, Math.max(2, F / 14), cssv('--gold'));
    ctx.font = '11px "IBM Plex Sans", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = cssv('--gold');
    ctx.fillText(F + ' N', W / 2, by - 62);
    ctx.fillStyle = cssv('--text3');
    ctx.fillText(L({ es:'base de ', en:'base of ' }) + A + ' cm²', W / 2, Math.min(groundY + sink + 16, H - 6));
    ctx.textAlign = 'left';
    ctx.fillStyle = cssv('--text3');
    ctx.fillText(L({ es:'espuma', en:'foam' }), 8, groundY + 16);
  }
  regDraw(draw);

  function live(){
    host.querySelector('#w1Fv').textContent = F + ' N';
    host.querySelector('#w1Av').textContent = A + ' cm²';
    host.querySelector('#w1o1').textContent = F + ' N';
    host.querySelector('#w1o2').textContent = A + ' cm²';
    host.querySelector('#w1o3').textContent = pstr();
    draw();
    if (done) return;
    var m = metas[r], p = pres();
    if (Math.abs(p - m) < 0.0001) {
      say(host, 'good', L({
        es:'Justo en la meta: ' + m + ' N/cm². Confirma con el botón.',
        en:'Right on target: ' + m + ' N/cm². Confirm with the button.'
      }));
    } else if (p < m) {
      say(host, 'warm', L({
        es:'Vas en ' + pstr() + ' y la meta es ' + m + ' N/cm². Te falta presión: sube la fuerza o reduce el área de apoyo.',
        en:'You are at ' + pstr() + ' and the target is ' + m + ' N/cm². You need more pressure: raise the force or shrink the contact area.'
      }));
    } else {
      say(host, 'warm', L({
        es:'Vas en ' + pstr() + ' y la meta es ' + m + ' N/cm². Te pasaste: baja la fuerza o reparte el peso en más área.',
        en:'You are at ' + pstr() + ' and the target is ' + m + ' N/cm². Too much: lower the force or spread the weight over more area.'
      }));
    }
  }
  function showRound(){
    tries = 0;
    host.querySelector('#w1tag').textContent = L({ es:'Ronda ', en:'Round ' }) + (r + 1) + '/3';
    host.querySelector('#w1q').innerHTML = L({
      es:'Meta: deja el bloque ejerciendo <span class="gw-cv">' + metas[r] + ' N/cm²</span> sobre la espuma.',
      en:'Goal: leave the block pressing with <span class="gw-cv">' + metas[r] + ' N/cm²</span> on the foam.'
    });
    live();
  }
  function nextRound(){
    r++;
    if (r >= 3){
      done = true;
      host.querySelector('#w1tag').textContent = L({ es:'Mesa dominada', en:'Table mastered' });
      host.querySelector('#w1k').disabled = true;
      host.querySelector('#w1k').classList.add('solved');
      say(host, 'good', L({
        es:'Ya viste que la misma fuerza hunde más cuando se apoya en menos área: lo que hunde al bloque es la presión.',
        en:'You have seen that the same force sinks deeper when it rests on less area: what sinks the block is the pressure.'
      }));
      return;
    }
    showRound();
  }
  host.querySelector('#w1F').oninput = function(){ F = parseInt(this.value, 10); live(); };
  host.querySelector('#w1A').oninput = function(){ A = parseInt(this.value, 10); live(); };
  host.querySelector('#w1k').onclick = function(){
    if (done) return;
    var m = metas[r];
    if (Math.abs(pres() - m) < 0.0001){
      say(host, 'good', L({
        es:'Correcto: ' + F + ' N repartidos en ' + A + ' cm² dan ' + m + ' N/cm².',
        en:'Correct: ' + F + ' N shared over ' + A + ' cm² give ' + m + ' N/cm².'
      }));
      setTimeout(nextRound, 1100);
      return;
    }
    tries++;
    if (tries >= 3){
      var a2 = 2, f2 = m * 2;
      while (f2 > 120 || f2 < 10){ a2 += 2; f2 = m * a2; }
      say(host, 'miss', L({
        es:'Una combinación que sirve: ' + f2 + ' N sobre ' + a2 + ' cm², porque esa fuerza repartida en esa área deja ' + m + ' N/cm². Hay varias más.',
        en:'One combination that works: ' + f2 + ' N over ' + a2 + ' cm², because that force shared over that area leaves ' + m + ' N/cm². There are several more.'
      }));
      setTimeout(nextRound, 2900);
      return;
    }
    live();
  };
  showRound();
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 2 :: CIRCUITO DE FRENOS
   Un deslizador para la fuerza del pedal. El liquido encerrado transmite la
   misma presion a las cuatro ruedas, pero cada piston recibe una fuerza
   distinta porque su area es distinta. Metas sobre la balata delantera.
   ══════════════════════════════════════════════════════════════════════════ */
function w2(rng, host){
  var AM = 4, AF = 12, AR = 8;
  var metas = shuffle([48, 72, 96, 120, 144, 180], rng).slice(0, 3);
  var r = 0, tries = 0, done = false;
  var Fp = 16;

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Circuito de frenos', en:'Brake circuit' }) + '<span class="gw-tag" id="w2tag"></span></div>' +
    '<div class="gw-q" id="w2q"></div>' +
    '<div class="gw-mini">' + L({
      es:'El pistón del pedal cubre 4 cm², cada pistón delantero 12 cm² y cada trasero 8 cm². Pisa con el deslizador y observa los tres marcadores.',
      en:'The pedal piston covers 4 cm², each front piston 12 cm² and each rear one 8 cm². Press with the slider and watch the three readings.'
    }) + '</div>' +
    '<canvas class="gw-cvs" id="w2c"></canvas>' +
    '<div class="gw-slab"><span class="gw-cl">' + L({ es:'Fuerza en el pedal', en:'Force on the pedal' }) + '</span><input type="range" id="w2F" min="4" max="80" step="4" value="16"><span class="gw-sv" id="w2Fv">16 N</span></div>' +
    '<div class="gw-out">' +
      '<div class="gw-cell"><div class="gw-cn">' + L({ es:'Presión en el líquido', en:'Pressure in the fluid' }) + '</div><div class="gw-cv" id="w2p">4 N/cm²</div></div>' +
      '<div class="gw-cell"><div class="gw-cn">' + L({ es:'Balata delantera', en:'Front pad' }) + '</div><div class="gw-cv" id="w2f">48 N</div></div>' +
      '<div class="gw-cell"><div class="gw-cn">' + L({ es:'Balata trasera', en:'Rear pad' }) + '</div><div class="gw-cv" id="w2r">32 N</div></div>' +
    '</div>' +
    '<div class="gw-row"><button class="gw-btn" id="w2k">' + L({ es:'Comprobar', en:'Check' }) + '</button></div>' +
    '<div class="gw-fb"></div>';

  var cv = host.querySelector('#w2c');
  function P(){ return Fp / AM; }
  function Ff(){ return P() * AF; }
  function Fr(){ return P() * AR; }

  function draw(){
    var g = fitCanvas(cv), ctx = g.ctx, W = g.w, H = g.h;
    var pipeY = H * 0.52;
    var mx = 54, rx = W - 54;
    ctx.strokeStyle = cssv('--green'); ctx.lineWidth = 7;
    ctx.beginPath();
    ctx.moveTo(mx, pipeY); ctx.lineTo(rx, pipeY);
    ctx.moveTo(rx, pipeY); ctx.lineTo(rx, H * 0.24);
    ctx.moveTo(rx, pipeY); ctx.lineTo(rx, H * 0.80);
    ctx.stroke();
    ctx.fillStyle = cssv('--green-dark');
    ctx.fillRect(mx - 16, pipeY - 22, 18, 44);
    arrowRight(ctx, mx - 46, mx - 20, pipeY, Math.max(2, Fp / 9), cssv('--gold'));
    ctx.font = '11px "IBM Plex Sans", sans-serif';
    ctx.textAlign = 'left';
    ctx.fillStyle = cssv('--gold');
    ctx.fillText(Fp + ' N', 6, pipeY - 26);
    ctx.textAlign = 'center';
    ctx.fillStyle = cssv('--text3');
    ctx.fillText(L({ es:'pedal', en:'pedal' }), mx - 12, pipeY + 40);
    ctx.fillStyle = cssv('--green-dark');
    ctx.fillText(P() + ' N/cm²', (mx + rx) / 2, pipeY - 14);
    ctx.fillStyle = cssv('--text3');
    ctx.fillText(L({ es:'misma presión en todo el líquido', en:'same pressure everywhere in the fluid' }), (mx + rx) / 2, pipeY + 22);
    function pad(y, area, force, lbl){
      var hgt = area * 2.6;
      ctx.fillStyle = cssv('--green-dark');
      ctx.fillRect(rx - 9, y - hgt / 2, 18, hgt);
      arrowRight(ctx, rx + 12, rx + 12 + Math.max(10, Math.min(force / 5, 34)), y, Math.max(2, force / 26), cssv('--gold'));
      ctx.textAlign = 'right';
      ctx.fillStyle = cssv('--text2');
      ctx.fillText(lbl, rx - 14, y - 4);
      ctx.fillStyle = cssv('--gold');
      ctx.fillText(force + ' N', rx - 14, y + 11);
    }
    pad(H * 0.24, AF, Ff(), L({ es:'delantera', en:'front' }));
    pad(H * 0.80, AR, Fr(), L({ es:'trasera', en:'rear' }));
  }
  regDraw(draw);

  function live(){
    host.querySelector('#w2Fv').textContent = Fp + ' N';
    host.querySelector('#w2p').textContent = P() + ' N/cm²';
    host.querySelector('#w2f').textContent = Ff() + ' N';
    host.querySelector('#w2r').textContent = Fr() + ' N';
    draw();
    if (done) return;
    var m = metas[r], d = Ff();
    if (d === m){
      say(host, 'good', L({
        es:'La balata delantera ya recibe ' + m + ' N. Confirma con el botón.',
        en:'The front pad now receives ' + m + ' N. Confirm with the button.'
      }));
    } else {
      say(host, 'warm', L({
        es:'La delantera recibe ' + d + ' N y la meta es ' + m + ' N: ' + (d < m ? 'pisa más fuerte' : 'suelta un poco el pedal') + '. Fíjate en que la trasera cambia junto con ella, aunque nunca son iguales.',
        en:'The front one receives ' + d + ' N and the goal is ' + m + ' N: ' + (d < m ? 'press harder' : 'ease off the pedal a little') + '. Notice the rear one changes along with it, though they are never equal.'
      }));
    }
  }
  function showRound(){
    tries = 0;
    host.querySelector('#w2tag').textContent = L({ es:'Ronda ', en:'Round ' }) + (r + 1) + '/3';
    host.querySelector('#w2q').innerHTML = L({
      es:'Meta: consigue que cada balata delantera reciba <span class="gw-cv">' + metas[r] + ' N</span>.',
      en:'Goal: make each front pad receive <span class="gw-cv">' + metas[r] + ' N</span>.'
    });
    live();
  }
  function nextRound(){
    r++;
    if (r >= 3){
      done = true;
      host.querySelector('#w2tag').textContent = L({ es:'Circuito dominado', en:'Circuit mastered' });
      host.querySelector('#w2k').disabled = true;
      host.querySelector('#w2k').classList.add('solved');
      say(host, 'good', L({
        es:'La presión llegó igual a las cuatro ruedas en todas las rondas; lo que cambió la fuerza de cada balata fue el área de su pistón.',
        en:'The pressure reached all four wheels equally in every round; what changed the force on each pad was the area of its piston.'
      }));
      return;
    }
    showRound();
  }
  host.querySelector('#w2F').oninput = function(){ Fp = parseInt(this.value, 10); live(); };
  host.querySelector('#w2k').onclick = function(){
    if (done) return;
    var m = metas[r];
    if (Ff() === m){
      say(host, 'good', L({
        es:'Correcto: con ' + Fp + ' N en el pedal la presión es ' + P() + ' N/cm² y cada pistón delantero de 12 cm² recibe ' + m + ' N.',
        en:'Correct: with ' + Fp + ' N on the pedal the pressure is ' + P() + ' N/cm² and each 12 cm² front piston receives ' + m + ' N.'
      }));
      setTimeout(nextRound, 1200);
      return;
    }
    tries++;
    if (tries >= 3){
      var need = m / 3;
      say(host, 'miss', L({
        es:'La respuesta era ' + need + ' N en el pedal: esa fuerza sobre 4 cm² da ' + (need / AM) + ' N/cm², y esa presión sobre los 12 cm² del pistón delantero deja ' + m + ' N.',
        en:'The answer was ' + need + ' N on the pedal: that force on 4 cm² gives ' + (need / AM) + ' N/cm², and that pressure on the 12 cm² front piston leaves ' + m + ' N.'
      }));
      setTimeout(nextRound, 3000);
      return;
    }
    live();
  };
  showRound();
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 3 :: GATO HIDRAULICO DEL TALLER
   El piston chico mide 5 cm2. El alumno elige el area del piston grande y la
   fuerza que aplica, pero cada ronda le pone un limite de fuerza: la unica
   salida es agrandar el piston grande. La carga sube en pantalla si lo logra.
   ══════════════════════════════════════════════════════════════════════════ */
function w3(rng, host){
  var A1 = 5;
  var pool = [
    { W:600, max:60 }, { W:480, max:40 }, { W:900, max:80 },
    { W:750, max:75 }, { W:400, max:50 }, { W:640, max:80 }
  ];
  var rondas = shuffle(pool, rng).slice(0, 3);
  var r = 0, tries = 0, done = false;
  var F1 = 20, A2 = 10;

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Gato hidráulico del taller', en:'Workshop hydraulic jack' }) + '<span class="gw-tag" id="w3tag"></span></div>' +
    '<div class="gw-q" id="w3q"></div>' +
    '<div class="gw-mini">' + L({
      es:'El pistón chico mide 5 cm². Ajusta tu empuje y el tamaño del pistón grande; la carga sube sola cuando la fuerza que sale alcanza su peso.',
      en:'The small piston measures 5 cm². Set your push and the size of the big piston; the load rises on its own once the output force reaches its weight.'
    }) + '</div>' +
    '<canvas class="gw-cvs" id="w3c"></canvas>' +
    '<div class="gw-slab"><span class="gw-cl">' + L({ es:'Tu empuje', en:'Your push' }) + '</span><input type="range" id="w3F" min="10" max="100" step="5" value="20"><span class="gw-sv" id="w3Fv">20 N</span></div>' +
    '<div class="gw-slab"><span class="gw-cl">' + L({ es:'Pistón grande', en:'Big piston' }) + '</span><input type="range" id="w3A" min="10" max="60" step="5" value="10"><span class="gw-sv" id="w3Av">10 cm²</span></div>' +
    '<div class="gw-out">' +
      '<div class="gw-cell"><div class="gw-cn">' + L({ es:'Presión', en:'Pressure' }) + '</div><div class="gw-cv" id="w3p">4 N/cm²</div></div>' +
      '<div class="gw-cell"><div class="gw-cn">' + L({ es:'Fuerza de salida', en:'Output force' }) + '</div><div class="gw-cv" id="w3o">40 N</div></div>' +
      '<div class="gw-cell"><div class="gw-cn">' + L({ es:'Veces que multiplica', en:'Times it multiplies' }) + '</div><div class="gw-cv" id="w3k">2</div></div>' +
    '</div>' +
    '<div class="gw-row"><button class="gw-btn" id="w3b">' + L({ es:'Intentar levantar', en:'Try to lift' }) + '</button></div>' +
    '<div class="gw-fb"></div>';

  var cv = host.querySelector('#w3c');
  function P(){ return F1 / A1; }
  function F2(){ return P() * A2; }
  function lifted(){ return F2() >= rondas[Math.min(r, 2)].W && F1 <= rondas[Math.min(r, 2)].max; }

  function draw(){
    var g = fitCanvas(cv), ctx = g.ctx, W = g.w, H = g.h;
    var baseY = H * 0.80;
    var lx = 46, rxc = W * 0.68;
    var w1w = 22, w2w = Math.max(30, Math.min(A2 * 2.6, W * 0.34));
    ctx.strokeStyle = cssv('--green'); ctx.lineWidth = 8;
    ctx.beginPath(); ctx.moveTo(lx, baseY); ctx.lineTo(rxc, baseY); ctx.stroke();
    var up = lifted() ? 26 : 0;
    var y1 = baseY - 44 + (lifted() ? 22 : 0);
    var y2 = baseY - 40 - up;
    ctx.fillStyle = cssv('--green');
    ctx.fillRect(lx - w1w / 2, y1, w1w, baseY - y1);
    ctx.fillRect(rxc - w2w / 2, y2, w2w, baseY - y2);
    ctx.fillStyle = cssv('--green-dark');
    ctx.fillRect(lx - w1w / 2 - 3, y1 - 8, w1w + 6, 8);
    ctx.fillRect(rxc - w2w / 2 - 3, y2 - 8, w2w + 6, 8);
    arrowUp(ctx, lx, y1 - 62, y1 - 14, Math.max(2, F1 / 11), cssv('--gold'));
    ctx.font = '11px "IBM Plex Sans", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = cssv('--gold');
    ctx.fillText(F1 + ' N', lx, y1 - 68);
    var cw = Math.max(70, w2w + 16), chh = 30;
    ctx.fillStyle = lifted() ? cssv('--ok') : cssv('--text3');
    ctx.fillRect(rxc - cw / 2, y2 - 8 - chh, cw, chh);
    ctx.fillStyle = cssv('--surface');
    ctx.fillText(rondas[Math.min(r, 2)].W + ' N', rxc, y2 - 8 - chh / 2 + 4);
    ctx.fillStyle = cssv('--text3');
    ctx.fillText(A1 + ' cm²', lx, baseY + 16);
    ctx.fillText(A2 + ' cm²', rxc, baseY + 16);
    ctx.textAlign = 'left';
    ctx.fillStyle = cssv('--green-dark');
    ctx.fillText(L({ es:'aceite encerrado', en:'trapped oil' }), 8, baseY + 32);
  }
  regDraw(draw);

  function live(){
    host.querySelector('#w3Fv').textContent = F1 + ' N';
    host.querySelector('#w3Av').textContent = A2 + ' cm²';
    host.querySelector('#w3p').textContent = P() + ' N/cm²';
    host.querySelector('#w3o').textContent = F2() + ' N';
    host.querySelector('#w3k').textContent = (A2 / A1);
    draw();
    if (done) return;
    var R = rondas[r];
    if (F1 > R.max){
      say(host, 'warm', L({
        es:'Estás empujando con ' + F1 + ' N y solo puedes dar ' + R.max + ' N. Baja tu empuje y gana fuerza por el otro lado: agranda el pistón grande.',
        en:'You are pushing with ' + F1 + ' N and you can only give ' + R.max + ' N. Lower your push and win force on the other side: enlarge the big piston.'
      }));
    } else if (F2() < R.W){
      say(host, 'warm', L({
        es:'La salida da ' + F2() + ' N y la carga pesa ' + R.W + ' N. Falta: agranda el pistón grande o aprovecha hasta ' + R.max + ' N de empuje.',
        en:'The output gives ' + F2() + ' N and the load weighs ' + R.W + ' N. Not enough: enlarge the big piston or use up to ' + R.max + ' N of push.'
      }));
    } else {
      say(host, 'good', L({
        es:'La salida ya da ' + F2() + ' N con un empuje permitido. Confirma con el botón.',
        en:'The output already gives ' + F2() + ' N with an allowed push. Confirm with the button.'
      }));
    }
  }
  function showRound(){
    tries = 0;
    host.querySelector('#w3tag').textContent = L({ es:'Ronda ', en:'Round ' }) + (r + 1) + '/3';
    host.querySelector('#w3q').innerHTML = L({
      es:'Meta: levanta una carga de <span class="gw-cv">' + rondas[r].W + ' N</span> empujando con <span class="gw-cv">' + rondas[r].max + ' N</span> como máximo.',
      en:'Goal: lift a load of <span class="gw-cv">' + rondas[r].W + ' N</span> pushing with at most <span class="gw-cv">' + rondas[r].max + ' N</span>.'
    });
    live();
  }
  function nextRound(){
    r++;
    if (r >= 3){
      done = true;
      host.querySelector('#w3tag').textContent = L({ es:'Gato dominado', en:'Jack mastered' });
      host.querySelector('#w3b').disabled = true;
      host.querySelector('#w3b').classList.add('solved');
      say(host, 'good', L({
        es:'En las tres cargas ganaste fuerza sin empujar más fuerte: lo que la multiplicó fue la diferencia entre las áreas de los dos pistones.',
        en:'With all three loads you gained force without pushing harder: what multiplied it was the difference between the areas of the two pistons.'
      }));
      return;
    }
    showRound();
  }
  host.querySelector('#w3F').oninput = function(){ F1 = parseInt(this.value, 10); live(); };
  host.querySelector('#w3A').oninput = function(){ A2 = parseInt(this.value, 10); live(); };
  host.querySelector('#w3b').onclick = function(){
    if (done) return;
    var R = rondas[r];
    if (lifted()){
      say(host, 'good', L({
        es:'Arriba: ' + F1 + ' N sobre 5 cm² dan ' + P() + ' N/cm², y esa presión sobre ' + A2 + ' cm² empuja con ' + F2() + ' N.',
        en:'Up it goes: ' + F1 + ' N on 5 cm² give ' + P() + ' N/cm², and that pressure on ' + A2 + ' cm² pushes with ' + F2() + ' N.'
      }));
      setTimeout(nextRound, 1400);
      return;
    }
    tries++;
    if (tries >= 3){
      var minA = Math.ceil((A1 * R.W / R.max) / 5) * 5;
      say(host, 'miss', L({
        es:'Con un pistón grande de ' + minA + ' cm² y un empuje de ' + R.max + ' N la salida alcanza la carga. Cuanto más grande el pistón de salida, más se multiplica la fuerza.',
        en:'With a big piston of ' + minA + ' cm² and a push of ' + R.max + ' N the output reaches the load. The bigger the output piston, the more the force is multiplied.'
      }));
      setTimeout(nextRound, 3200);
      return;
    }
    live();
  };
  showRound();
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 4 :: LA CADENA DEL FRENADO
   Ordena lo que pasa desde que el pie toca el pedal hasta que la rueda se
   detiene. Se tocan dos pasos para intercambiarlos; el orden correcto se
   revela al tercer intento fallido.
   ══════════════════════════════════════════════════════════════════════════ */
function w4(rng, host){
  var PASOS = [
    { es:'El pie empuja el pedal y el pistón del cilindro maestro avanza', en:'The foot pushes the pedal and the master cylinder piston moves forward' },
    { es:'El líquido encerrado queda sometido a una presión mayor', en:'The trapped fluid is put under a higher pressure' },
    { es:'Esa presión viaja por los ductos y llega igual a las cuatro ruedas', en:'That pressure travels along the pipes and arrives equally at the four wheels' },
    { es:'El pistón de cada rueda empuja las balatas contra el disco', en:'The piston at each wheel pushes the pads against the disc' },
    { es:'La fricción de las balatas frena el giro de la rueda', en:'The friction of the pads slows the turning of the wheel' }
  ];
  var orden = shuffle([0, 1, 2, 3, 4], rng);
  if (orden.every(function(v, i){ return v === i; })) { var tmp = orden[0]; orden[0] = orden[2]; orden[2] = tmp; }
  var sel = null, tries = 0, done = false;

  function render(){
    var chips = orden.map(function(ei, pos){
      var cls = 'tl-chip' + (sel === pos ? ' sel' : '') + (done ? ' lock' : '');
      return '<div class="' + cls + '" data-pos="' + pos + '"><span class="tl-num">' + (pos + 1) + '</span> ' + PASOS[ei][LANG] + '</div>';
    }).join('');
    host.innerHTML =
      '<div class="gw-h">' + L({ es:'La cadena del frenado', en:'The braking chain' }) + '<span class="gw-tag">' + (done ? L({ es:'Cadena armada', en:'Chain assembled' }) : '') + '</span></div>' +
      '<div class="gw-q">' + L({ es:'Ordena lo que ocurre, del primer momento al último.', en:'Put in order what happens, from the first moment to the last.' }) + '</div>' +
      '<div class="gw-mini">' + L({
        es:'Toca un paso y luego otro para intercambiarlos. Puedes reacomodarlos las veces que quieras antes de comprobar.',
        en:'Tap one step and then another to swap them. You can rearrange them as often as you like before checking.'
      }) + '</div>' +
      '<div class="tl-list">' + chips + '</div>' +
      '<div class="gw-row"><button class="gw-btn" id="w4k"' + (done ? ' disabled' : '') + '>' + L({ es:'Comprobar', en:'Check' }) + '</button></div>' +
      '<div class="gw-fb"></div>';
    host.querySelectorAll('.tl-chip').forEach(function(ch){
      ch.onclick = function(){
        if (done) return;
        var pos = parseInt(ch.getAttribute('data-pos'), 10);
        if (sel === null) sel = pos;
        else if (sel === pos) sel = null;
        else { var t = orden[sel]; orden[sel] = orden[pos]; orden[pos] = t; sel = null; }
        var fbEl = host.querySelector('.gw-fb');
        var fbTxt = fbEl ? fbEl.innerHTML : '';
        var fbCls = fbEl ? fbEl.className : 'gw-fb';
        render();
        var nf = host.querySelector('.gw-fb');
        if (nf){ nf.className = fbCls; nf.innerHTML = fbTxt; }
      };
    });
    var kb = host.querySelector('#w4k');
    if (kb) kb.onclick = check;
  }
  function check(){
    if (done) return;
    var ok = orden.every(function(ei, pos){ return ei === pos; });
    if (ok){
      done = true; sel = null; render();
      say(host, 'good', L({
        es:'Así es: el pie da la fuerza, el líquido reparte la presión y cada rueda la convierte otra vez en fuerza.',
        en:'That is it: the foot gives the force, the fluid shares out the pressure and each wheel turns it back into force.'
      }));
      return;
    }
    tries++;
    if (tries >= 3){
      orden = [0, 1, 2, 3, 4]; done = true; sel = null; render();
      say(host, 'miss', L({
        es:'Este es el orden. Fíjate en que la presión aparece antes de que las balatas se muevan: primero se aprieta el líquido, después empuja.',
        en:'This is the order. Notice that the pressure appears before the pads move: first the fluid is squeezed, then it pushes.'
      }));
      return;
    }
    var bad = 0;
    for (var i = 0; i < orden.length; i++){ if (orden[i] !== i){ bad = i; break; } }
    render();
    say(host, 'warm', L({
      es:'Todavía no. Revisa el paso número ' + (bad + 1) + ': pregúntate qué tuvo que pasar antes para que ese paso fuera posible.',
      en:'Not yet. Look at step number ' + (bad + 1) + ': ask yourself what had to happen before for that step to be possible.'
    }));
  }
  render();
}

    '<p>' + L({
      es:'Esta guía sirve para entender cómo lo hacen. Vas a medir presiones, a armar un circuito de frenos, a probar un gato hidráulico del taller y a decidir qué tamaño de pistón conviene en cada caso.',

    '<p>' + L({
      es:'Cuando empujas algo, lo que importa no es solo cuánta fuerza haces, sino en cuánta superficie la aplicas. Un mismo empujón puede no dejar marca si se apoya en una tabla ancha y perforar la tierra si se apoya en la punta de una estaca.',
      en:'When you push something, what matters is not only how much force you make, but over how much surface you apply it. The same push may leave no mark when it rests on a wide board and pierce the ground when it rests on the tip of a stake.'
    }) + '</p>' +
    '<p>' + L({
      es:'A esa fuerza repartida se le llama presión, y se mide en fuerza por unidad de superficie. En esta guía trabajamos con newtons sobre centímetro cuadrado: decir que un bloque ejerce 5 N/cm² significa que a cada centímetro cuadrado de su base le tocan 5 newtons.',
      en:'That shared out force is called pressure, and it is measured as force per unit of surface. In this guide we work with newtons over square centimetre: saying that a block exerts 5 N/cm² means that each square centimetre of its base gets 5 newtons.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Fuerza', en:'Force' }), L({ es:'newton (N)', en:'newton (N)' }), L({ es:'el empujón completo, sin decir en qué superficie se aplica', en:'the whole push, without saying over which surface it is applied' })) +
      rcard(L({ es:'Área de apoyo', en:'Contact area' }), L({ es:'centímetro cuadrado', en:'square centimetre' }), L({ es:'la superficie donde el cuerpo realmente toca al otro', en:'the surface where the body actually touches the other' })) +
      rcard(L({ es:'Presión', en:'Pressure' }), L({ es:'N/cm²', en:'N/cm²' }), L({ es:'lo que le toca a cada centímetro cuadrado del apoyo', en:'what falls on each square centimetre of the contact' })) +
    '</div>' +
    '<div class="callout"><p>' + L({
      es:'Por eso los esquís no se hunden en la nieve y un tacón delgado sí marca el pasto: el peso puede ser parecido, lo que cambia es entre cuántos centímetros cuadrados se reparte.',
      en:'That is why skis do not sink into the snow while a thin heel does mark the grass: the weight can be similar, what changes is how many square centimetres it is shared over.'
    }) + '</p></div>'
  );
  w1(rng, widgetHost(s1, 'gwA', 'pressure'));
  addProblem(rng, mkP1(rng));
  addProblem(rng, mkP2(rng));

  /* ══ CONCEPTO 2 ══ */
  var s2 = sec(
    L({ es:'Concepto 2', en:'Concept 2' }),
    L({ es:'El principio de Pascal', en:'The Pascal principle' }),
    '<p>' + L({
      es:'Blaise Pascal descubrió algo que parece magia y es pura geometría del líquido: cuando se aplica una presión a un líquido encerrado, esa presión llega igual a todos los puntos del líquido y a las paredes que lo contienen. No se debilita con la distancia ni se reparte entre las salidas.',
      en:'Blaise Pascal discovered something that looks like magic and is pure geometry of the liquid: when a pressure is applied to a trapped liquid, that pressure reaches every point of the liquid and the walls containing it equally. It does not weaken with distance nor split between the outlets.'
    }) + '</p>' +
    '<p>' + L({
      es:'Funciona porque un líquido prácticamente no se comprime: al empujarlo no se aplasta, sino que pasa el empujón adelante. Un gas haría lo contrario, se encogería primero y transmitiría después, y por eso los frenos usan líquido y no aire.',
      en:'It works because a liquid practically does not compress: when pushed it is not squashed, it passes the push forward instead. A gas would do the opposite, it would shrink first and transmit later, and that is why brakes use liquid and not air.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Se transmite', en:'What is transmitted' }), L({ es:'la presión', en:'the pressure' }), L({ es:'llega completa a cada punto del líquido encerrado', en:'it arrives complete at every point of the trapped liquid' })) +
      rcard(L({ es:'No se transmite igual', en:'Not transmitted equally' }), L({ es:'la fuerza', en:'the force' }), L({ es:'cada pistón produce la suya según el área que tenga', en:'each piston produces its own according to its area' })) +
      rcard(L({ es:'Requisito', en:'Requirement' }), L({ es:'líquido encerrado', en:'trapped liquid' }), L({ es:'sin fugas y sin burbujas de aire dentro del sistema', en:'with no leaks and no air bubbles inside the system' })) +
    '</div>' +
    '<div class="callout"><p>' + L({
      es:'En el circuito de frenos que sigue, un solo deslizador maneja el pedal. Observa que el número de la presión es el mismo en todo el líquido mientras las dos balatas reciben fuerzas distintas.',
      en:'In the brake circuit below, a single slider handles the pedal. Notice that the pressure figure is the same throughout the fluid while the two pads receive different forces.'
    }) + '</p></div>'
  );
  w2(rng, widgetHost(s2, 'gwB', 'hydraulic'));
  addProblem(rng, mkP3(rng));
  addProblem(rng, mkP4(rng));

  /* ══ CONCEPTO 3 ══ */
  var s3 = sec(
    L({ es:'Concepto 3', en:'Concept 3' }),
    L({ es:'Elevadores y gatos: multiplicar la fuerza', en:'Lifts and jacks: multiplying the force' }),
    '<p>' + L({
      es:'Si la presión llega igual a los dos extremos del líquido, basta con darles áreas distintas para que las fuerzas sean distintas. Un pistón chico recibe un empujón modesto y produce cierta presión; el pistón grande recibe esa misma presión sobre una cara mucho más ancha y devuelve una fuerza mucho mayor.',
      en:'If the pressure reaches both ends of the liquid equally, giving them different areas is enough for the forces to be different. A small piston receives a modest push and produces a certain pressure; the big piston receives that same pressure over a much wider face and gives back a much larger force.'
    }) + '</p>' +
    '<p>' + L({
      es:'Cuántas veces se multiplica la fuerza depende de cuántas veces cabe el área del pistón chico en la del grande. No importa la diferencia en centímetros cuadrados, importa esa razón. Así trabajan el gato del taller, el elevador de la agencia y la prensa que compacta la basura.',
      en:'How many times the force is multiplied depends on how many times the area of the small piston fits into the big one. The difference in square centimetres does not matter, that ratio does. This is how the workshop jack, the dealership lift and the press that compacts rubbish all work.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Pistón chico', en:'Small piston' }), L({ es:'entra la fuerza', en:'force goes in' }), L({ es:'ahí empuja la persona y nace la presión del sistema', en:'that is where the person pushes and the system pressure is born' })) +
      rcard(L({ es:'Pistón grande', en:'Big piston' }), L({ es:'sale la fuerza', en:'force comes out' }), L({ es:'la misma presión sobre más área da más fuerza', en:'the same pressure over more area gives more force' })) +
      rcard(L({ es:'Cuánto multiplica', en:'How much it multiplies' }), L({ es:'la razón de áreas', en:'the ratio of areas' }), L({ es:'cuántas veces cabe el área chica en la grande', en:'how many times the small area fits into the big one' })) +
    '</div>'
  );
  w3(rng, widgetHost(s3, 'gwC', 'lift'));
  addProblem(rng, mkP5(rng));
  addProblem(rng, mkP6(rng));

  /* ══ CONCEPTO 4 ══ */
  var s4 = sec(
    L({ es:'Concepto 4', en:'Concept 4' }),
    L({ es:'Los frenos hidráulicos del auto', en:'The hydraulic brakes of a car' }),
    '<p>' + L({
      es:'El freno de un auto es el mismo principio puesto a trabajar cuatro veces a la vez. El pie empuja el pedal, el pedal mueve el pistón del cilindro maestro y el líquido de frenos queda sometido a una presión mayor. Esa presión recorre los ductos y aparece igual en el pistón de cada rueda.',
      en:'The brake of a car is the same principle put to work four times at once. The foot pushes the pedal, the pedal moves the master cylinder piston and the brake fluid is put under a higher pressure. That pressure runs along the pipes and appears equally at the piston of every wheel.'
    }) + '</p>' +
    '<p>' + L({
      es:'Cada pistón de rueda convierte esa presión otra vez en fuerza y aprieta las balatas contra el disco; la fricción hace el resto. Como los pistones delanteros suelen ser más grandes, reciben más fuerza que los traseros aunque la presión sea idéntica. Y si entra aire, que sí se comprime, parte del recorrido del pedal se gasta en aplastar la burbuja y el frenado se siente blando.',
      en:'Each wheel piston turns that pressure back into force and squeezes the pads against the disc; friction does the rest. Since the front pistons are usually bigger, they receive more force than the rear ones even though the pressure is identical. And if air gets in, which does compress, part of the pedal travel is spent squashing the bubble and the braking feels soft.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Cilindro maestro', en:'Master cylinder' }), L({ es:'donde nace la presión', en:'where the pressure is born' }), L({ es:'el pedal empuja su pistón y aprieta el líquido', en:'the pedal pushes its piston and squeezes the fluid' })) +
      rcard(L({ es:'Ductos', en:'Pipes' }), L({ es:'la reparten', en:'they share it out' }), L({ es:'llevan la misma presión a las cuatro ruedas', en:'they carry the same pressure to the four wheels' })) +
      rcard(L({ es:'Pistón de rueda', en:'Wheel piston' }), L({ es:'la vuelve fuerza', en:'it turns it into force' }), L({ es:'aprieta las balatas contra el disco que gira', en:'it squeezes the pads against the turning disc' })) +
      rcard(L({ es:'Aire en el ducto', en:'Air in the pipe' }), L({ es:'enemigo del freno', en:'enemy of the brake' }), L({ es:'se comprime y roba parte del recorrido del pedal', en:'it compresses and steals part of the pedal travel' })) +
    '</div>'
  );
  w4(rng, widgetHost(s4, 'gwD', 'timeline'));
  addProblem(rng, mkP7(rng));
  addProblem(rng, mkP8(rng));

  /* ══ CONCEPTO 5 ══ */
  sec(
    L({ es:'Concepto 5', en:'Concept 5' }),
    L({ es:'Lo que se gana en fuerza se paga en recorrido', en:'What is gained in force is paid in travel' }),
    '<p>' + L({
      es:'El gato hidráulico no regala nada. El aceite que sale del cilindro chico es exactamente el que entra al grande, y al llegar tiene que repartirse en una cara mucho más ancha. Por eso la carga sube apenas un poco cada vez que la palanca baja bastante.',
      en:'The hydraulic jack gives nothing away. The oil leaving the small cylinder is exactly the oil entering the big one, and on arrival it has to spread over a much wider face. That is why the load rises just a little each time the lever goes down a long way.'
    }) + '</p>' +
    '<p>' + L({
      es:'La proporción es la misma en los dos lados de la cuenta: si la fuerza se multiplica cinco veces, el recorrido se divide entre cinco. Eso explica por qué hay que bombear muchas veces para levantar un auto y por qué el pedal del freno se hunde un poco antes de que las balatas aprieten.',
      en:'The proportion is the same on both sides of the account: if the force is multiplied five times, the travel is divided by five. That explains why you have to pump many times to raise a car and why the brake pedal sinks a little before the pads squeeze.'
    }) + '</p>'
  );
  addProblem(rng, mkP9(rng));

  /* ══ CIERRE ══ */
  var s6 = sec(
    L({ es:'Cierre', en:'Closing' }),
    L({ es:'Todo junto', en:'Everything together' }),
    '<p>' + L({
      es:'Lo que sigue reúne las dos caras del mismo principio: el aparato que levanta y el que detiene, los dos con un líquido encerrado repartiendo presión.',
      en:'What follows brings together the two faces of the same principle: the device that lifts and the one that stops, both with a trapped liquid sharing out pressure.'
    }) + '</p>'
  );
  w5(rng, widgetHost(s6, 'gwE', 'reflect'));
  addProblem(rng, mkP10(rng));
}
</script>

<!-- LIAXA ANALYTICS -->
<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbzLGV15JRTPs9bbSvHRLfgOXeT9oUExDf1AH546WOwq5tYxXSdhX212OWi_bTJfMGx9/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'Principio de Pascal: Frenos Hidráulicos y Elevadores';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
