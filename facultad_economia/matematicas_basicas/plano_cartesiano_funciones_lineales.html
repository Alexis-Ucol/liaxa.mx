  var w1x  = pick([420, 640, 880], rng);
  var w1y  = pick([-12000, 8000, 16000], rng);
  var p1q  = pick([320, 380, 450], rng);
  var p1L  = pick([6400, 7500, 9200], rng);
  var p2b  = pick([3000, 3400, 3800], rng);
  var p2r  = pick([16, 20, 24], rng);
  var p2x  = pick([55, 70, 85], rng);

  /* ── Concepto 2 · pendiente y ordenada al origen ── */
  var c2b  = pick([2800, 3200, 3600], rng);
  var c2m  = pick([18, 22, 26], rng);
  var c2x1 = pick([40, 55, 70], rng);
  var c2dx = pick([25, 35, 45], rng);
  var c2x2 = c2x1 + c2dx;
  var c2y1 = c2b + c2m * c2x1;
  var c2y2 = c2b + c2m * c2x2;
  var w2b  = pick([2600, 3000, 3400], rng);
  var w2m  = pick([14, 20, 26], rng);
  var w2x  = pick([40, 72, 104], rng);
  var p3b  = pick([2600, 3100, 3700], rng);
  var p3m  = pick([17, 21, 27], rng);
  var p3x1 = pick([30, 40, 50], rng);
  var p3dx = pick([20, 25, 40], rng);
  var p3x2 = p3x1 + p3dx;
  var p3y1 = p3b + p3m * p3x1;
  var p3y2 = p3b + p3m * p3x2;
  var p3dy = p3m * p3dx;
  var p4b  = pick([2900, 3300, 3900], rng);
  var p4m  = pick([19, 23, 28], rng);

  /* ── Concepto 3 · leer la recta sobre el plano ── */
  var c3p  = pick([120, 135, 150], rng);
  var c3v  = pick([52, 60, 70], rng);
  var c3m  = c3p - c3v;
  var c3be = pick([650, 800, 950], rng);
  var c3F  = c3m * c3be;
  var c3ex = pick([150, 220, 300], rng);
  var c3q  = c3be + c3ex;
  var w3p  = pick([110, 130, 155], rng);
  var w3v  = pick([50, 60, 75], rng);
  var w3F  = pick([26000, 38000, 50000], rng);
  var w3q  = pick([300, 600, 900], rng);
  var p5m  = pick([44, 52, 65], rng);
  var p5be = pick([700, 850, 1000], rng);
  var p5F  = p5m * p5be;
  var p5v  = pick([38, 45, 55], rng);
  var p5p  = p5v + p5m;
  var p6m  = pick([46, 58, 70], rng);
  var p6be = pick([650, 800, 950], rng);
  var p6F  = p6m * p6be;
  var p6ex = pick([120, 180, 250], rng);
  var p6q  = p6be + p6ex;

  /* ── Evaluacion final ── */
  var p7v0 = pick([49000, 55000, 63000], rng);
  var p7s  = pick([1200, 1500, 1800], rng);
  var p7k  = pick([14, 18, 24], rng);
  var p8b  = pick([2500, 2900, 3500], rng);
  var p8m  = pick([9, 12, 15], rng);
  var p8x1 = pick([300, 400, 500], rng);
  var p8dx = pick([150, 200, 250], rng);
  var p8x2 = p8x1 + p8dx;
  var p8y1 = p8b + p8m * p8x1;
  var p8y2 = p8b + p8m * p8x2;
  var p10m  = pick([42, 55, 68], rng);
  var p10be = pick([720, 880, 1050], rng);
  var p10F  = p10m * p10be;
  var p10v  = pick([36, 47, 58], rng);
  var p10p  = p10v + p10m;

  /* ═══════════════════════ CONCEPTO 1 ═══════════════════════ */
  addSection(function(L) {
    var es = L === 'es';
    if (es) return '' +
      '<div class="stag">Concepto 1</div>' +
      '<h2>El plano cartesiano: dos números que cuentan una historia completa</h2>' +
      '<p>Un negocio produce todos los meses una avalancha de datos sueltos, y sueltos no sirven de nada. El plano cartesiano es la herramienta que los ordena. Se trazan dos rectas numéricas perpendiculares, el <strong>eje horizontal</strong> y el <strong>eje vertical</strong>, que se cruzan en un punto llamado <strong>origen</strong>. A partir de ahí, cualquier pareja de cantidades relacionadas se convierte en un <strong>punto</strong>, y un montón de datos se convierte en una figura que se puede mirar de un vistazo.</p>' +
      '<p>La pareja se escribe entre paréntesis y se llama <strong>par ordenado</strong>. La palabra ordenado no está de adorno: el primer número siempre se mide sobre el eje horizontal y el segundo siempre sobre el vertical. Escribirlos al revés no es un descuido menor, es afirmar otra cosa. En Transportes El Volcán la primera coordenada cuenta las entregas del mes y la segunda el resultado en pesos, así que el par (' + intN(c1be) + ', 0) dice que con esa cantidad de entregas el mes cerró en ceros, mientras que (0, ' + intN(c1be) + ') diría que sin hacer una sola entrega la empresa ganó ' + money(c1be) + ', que es una historia distinta y bastante inverosímil.</p>' +
      '<p>Los dos ejes parten el plano en cuatro <strong>cuadrantes</strong>. En el primero las dos coordenadas son positivas, en el segundo la primera es negativa y la segunda positiva, en el tercero las dos son negativas y en el cuarto la primera es positiva y la segunda negativa. Un negocio de reparto vive solamente en el primero y el cuarto, porque las entregas no pueden ser negativas; en cambio el resultado sí, y un mes con muchas entregas y números rojos aparece como un punto por debajo del eje horizontal. Esa es una de las razones por las que la gráfica se lee más rápido que la tabla: la pérdida no se busca entre las cifras, se ve caer.</p>' +
      '<p>Cuando los datos que se grafican son de la forma cantidad producida contra dinero, aparece casi siempre una regularidad muy útil: los puntos se acomodan sobre una <strong>línea recta</strong>. Eso ocurre porque cada entrega adicional agrega siempre lo mismo, ni más ni menos, y esa constancia es la firma de una relación lineal. Antes de estudiar la recta conviene aprender a colocar y leer los puntos uno por uno, porque cualquier error de lectura en el plano se arrastra después a todo lo demás.</p>' +
      '<div class="rules-grid">' +
        '<div class="rcard"><div class="rname">Par ordenado</div><div class="rform">(entregas, resultado)</div><div class="rnote">El orden decide el significado.</div></div>' +
        '<div class="rcard"><div class="rname">Eje horizontal</div><div class="rform">' + intN(c1be) + ' entregas</div><div class="rnote">Lo que se trabajó en el mes.</div></div>' +
        '<div class="rcard"><div class="rname">Eje vertical</div><div class="rform">' + money(c1r3) + '</div><div class="rnote">Cómo cerró la caja.</div></div>' +
        '<div class="rcard"><div class="rname">Bajo el eje</div><div class="rform">resultado negativo</div><div class="rnote">El mes terminó en rojo.</div></div>' +
      '</div>' +
      '<p><strong>Ejemplo resuelto.</strong> Transportes El Volcán cobra ' + money(c1p) + ' por entrega y gasta ' + money(c1v) + ' de gasolina, casetas y empaque en cada una. Los gastos que se pagan aunque las camionetas no salgan suman ' + money(c1F) + ' al mes. El gerente quiere llevar tres meses al plano para ver la temporada de un vistazo.</p>' +
      '<div class="callout"><p><strong>Paso 1.</strong> Se decide qué va en cada eje. Las entregas del mes van en el horizontal porque son la cantidad que se mueve por decisión de la empresa, y el resultado en pesos va en el vertical porque depende de ellas.<br>' +
      '<strong>Paso 2.</strong> Cada entrega deja ' + money(c1m) + ' después de pagar su propia gasolina, así que el resultado del mes es lo que aportan todas las entregas menos los ' + money(c1F) + ' fijos.<br>' +
      '<strong>Paso 3.</strong> En el mes flojo hubo ' + intN(c1q1) + ' entregas. Faltaron ' + intN(c1d1) + ' para cubrir el gasto fijo, así que el mes cerró con una pérdida de ' + money(c1r1) + ' y su punto es (' + intN(c1q1) + ', −' + money(c1r1) + '), por debajo del eje horizontal.<br>' +
      '<strong>Paso 4.</strong> En el mes de en medio hubo exactamente ' + intN(c1be) + ' entregas y el resultado fue cero, de modo que su punto (' + intN(c1be) + ', $0) cae justo sobre el eje horizontal.<br>' +
      '<strong>Paso 5.</strong> En el mes bueno hubo ' + intN(c1q3) + ' entregas, ' + intN(c1d3) + ' por encima del equilibrio, y el resultado fue ' + money(c1r3) + ', con su punto (' + intN(c1q3) + ', ' + money(c1r3) + ') por encima del eje.<br>' +
      '<strong>Lectura de negocio.</strong> Los tres puntos suben de izquierda a derecha y cruzan el eje horizontal en ' + intN(c1be) + ' entregas. Ese cruce tiene nombre en la empresa: es el volumen a partir del cual el mes deja de costar dinero.</p></div>';
    return '' +
      '<div class="stag">Concept 1</div>' +
      '<h2>The Cartesian plane: two numbers that tell a whole story</h2>' +
      '<p>A business produces an avalanche of loose data every month, and loose data is of no use. The Cartesian plane is the tool that orders it. Two perpendicular number lines are drawn, the <strong>horizontal axis</strong> and the <strong>vertical axis</strong>, meeting at a point called the <strong>origin</strong>. From there, any pair of related quantities becomes a <strong>point</strong>, and a heap of data becomes a picture that can be taken in at a glance.</p>' +
      '<p>The pair is written in brackets and is called an <strong>ordered pair</strong>. The word ordered is not decoration: the first number is always measured along the horizontal axis and the second always along the vertical one. Writing them the other way round is not a small slip, it states something else. At Transportes El Volcán the first coordinate counts the deliveries of the month and the second the result in pesos, so the pair (' + intN(c1be) + ', 0) says that at that number of deliveries the month closed at zero, while (0, ' + intN(c1be) + ') would say that without a single delivery the company made ' + money(c1be) + ', which is a different and rather unlikely story.</p>' +
      '<p>The two axes cut the plane into four <strong>quadrants</strong>. In the first both coordinates are positive, in the second the first is negative and the second positive, in the third both are negative, and in the fourth the first is positive and the second negative. A delivery business lives only in the first and the fourth, because deliveries cannot be negative; the result, however, can be, and a month with many deliveries and red numbers shows up as a point below the horizontal axis. That is one of the reasons the graph reads faster than the table: the loss is not hunted for among the figures, it is seen dropping.</p>' +
      '<p>When the data being plotted has the shape quantity produced against money, a very useful regularity almost always appears: the points settle along a <strong>straight line</strong>. That happens because every additional delivery adds always the same amount, no more and no less, and that constancy is the signature of a linear relation. Before studying the line it pays to learn to place and read the points one by one, because any misreading on the plane is dragged into everything that follows.</p>' +
      '<div class="rules-grid">' +
        '<div class="rcard"><div class="rname">Ordered pair</div><div class="rform">(deliveries, result)</div><div class="rnote">The order decides the meaning.</div></div>' +
        '<div class="rcard"><div class="rname">Horizontal axis</div><div class="rform">' + intN(c1be) + ' deliveries</div><div class="rnote">The work done in the month.</div></div>' +
        '<div class="rcard"><div class="rname">Vertical axis</div><div class="rform">' + money(c1r3) + '</div><div class="rnote">How the till closed.</div></div>' +
        '<div class="rcard"><div class="rname">Below the axis</div><div class="rform">negative result</div><div class="rnote">The month ended in the red.</div></div>' +
      '</div>' +
      '<p><strong>Worked example.</strong> Transportes El Volcán charges ' + money(c1p) + ' per delivery and spends ' + money(c1v) + ' on fuel, tolls and packaging on each one. The expenses paid even if the vans never leave add up to ' + money(c1F) + ' a month. The manager wants to take three months to the plane to see the season at a glance.</p>' +
      '<div class="callout"><p><strong>Step 1.</strong> Decide what goes on each axis. The deliveries of the month go on the horizontal one because they are the quantity the company moves by its own decision, and the result in pesos goes on the vertical one because it depends on them.<br>' +
      '<strong>Step 2.</strong> Every delivery leaves ' + money(c1m) + ' after paying for its own fuel, so the result of the month is what all the deliveries contribute minus the ' + money(c1F) + ' of fixed expense.<br>' +
      '<strong>Step 3.</strong> In the slow month there were ' + intN(c1q1) + ' deliveries. That fell ' + intN(c1d1) + ' short of covering the fixed expense, so the month closed with a loss of ' + money(c1r1) + ' and its point is (' + intN(c1q1) + ', −' + money(c1r1) + '), below the horizontal axis.<br>' +
      '<strong>Step 4.</strong> In the middle month there were exactly ' + intN(c1be) + ' deliveries and the result was zero, so its point (' + intN(c1be) + ', $0) falls right on the horizontal axis.<br>' +
      '<strong>Step 5.</strong> In the good month there were ' + intN(c1q3) + ' deliveries, ' + intN(c1d3) + ' above break even, and the result was ' + money(c1r3) + ', with its point (' + intN(c1q3) + ', ' + money(c1r3) + ') above the axis.<br>' +
      '<strong>Business reading.</strong> The three points climb from left to right and cross the horizontal axis at ' + intN(c1be) + ' deliveries. That crossing has a name inside the company: it is the volume from which the month stops costing money.</p></div>';
  });

  widgetTablero(w1x, w1y);

  /* ── Reactivo 1 · leer un punto del tablero ── */
  var o1es = [
    'Que en marzo se hicieron ' + intN(p1q) + ' entregas y aun así el mes cerró con una pérdida de ' + money(p1L) + '.',
    'Que en marzo se hicieron ' + intN(p1q) + ' entregas y el mes cerró con una ganancia de ' + money(p1L) + '.',
    'Que en marzo hubo una pérdida de ' + money(p1q) + ' y se hicieron ' + intN(p1L) + ' entregas, porque el primer número del par siempre es el dinero.',
    'Que marzo quedó fuera del plano, porque un punto con una coordenada negativa no se puede dibujar.'
  ];
  var o1en = [
    'That in March ' + intN(p1q) + ' deliveries were made and even so the month closed with a loss of ' + money(p1L) + '.',
    'That in March ' + intN(p1q) + ' deliveries were made and the month closed with a profit of ' + money(p1L) + '.',
    'That in March there was a loss of ' + money(p1q) + ' and ' + intN(p1L) + ' deliveries were made, because the first number of the pair is always the money.',
    'That March fell outside the plane, because a point with a negative coordinate cannot be drawn.'
  ];
  var o1 = shuffleOpts(o1es, o1en, rng);
  addItem({
    title: { es: 'Un punto por debajo del eje', en: 'A point below the axis' },
    q: { es: 'En el tablero mensual de Transportes El Volcán el eje horizontal cuenta las entregas del mes y el eje vertical el resultado en pesos. El mes de marzo aparece marcado como el punto (' + intN(p1q) + ', −' + money(p1L) + '). ¿Qué está diciendo ese punto sobre marzo?',
        en: 'On the monthly board of Transportes El Volcán the horizontal axis counts the deliveries of the month and the vertical axis the result in pesos. The month of March is marked as the point (' + intN(p1q) + ', −' + money(p1L) + '). What is that point saying about March?' },
    hint: { es: 'Lee las dos coordenadas por separado y recuerda cuál eje le toca a cada una. Después fíjate en el signo de la segunda: hacia arriba del eje horizontal están los meses buenos y hacia abajo los malos.',
            en: 'Read the two coordinates separately and remember which axis belongs to each. Then look at the sign of the second one: above the horizontal axis lie the good months and below it the bad ones.' },
    opts: { es: o1.es, en: o1.en },
    exp: { es: 'La primera coordenada se mide sobre el eje horizontal, que en este tablero cuenta entregas, así que ' + intN(p1q) + ' es el trabajo hecho en marzo. La segunda se mide sobre el eje vertical, que cuenta pesos, y viene con signo negativo, de modo que el mes cerró con una pérdida de ' + money(p1L) + '. Hubo actividad y aun así faltó dinero, que es exactamente el caso del cuarto cuadrante. La opción de la ganancia lee bien las cantidades pero ignora el signo, y ese descuido convierte un mes malo en uno bueno. La opción que pone el dinero primero invierte el par ordenado y termina afirmando que se hicieron ' + intN(p1L) + ' entregas, un volumen que la empresa no alcanza ni en temporada alta. Y la que dice que el punto no se puede dibujar confunde una coordenada negativa con un dato imposible: el plano está hecho justamente para admitir números negativos.',
           en: 'The first coordinate is measured along the horizontal axis, which on this board counts deliveries, so ' + intN(p1q) + ' is the work done in March. The second is measured along the vertical axis, which counts pesos, and it carries a minus sign, so the month closed with a loss of ' + money(p1L) + '. There was activity and money still ran short, which is exactly the case of the fourth quadrant. The profit option reads the amounts correctly but ignores the sign, and that slip turns a bad month into a good one. The option that puts the money first reverses the ordered pair and ends up claiming that ' + intN(p1L) + ' deliveries were made, a volume the company does not reach even in the high season. And the one saying the point cannot be drawn confuses a negative coordinate with an impossible figure: the plane exists precisely to hold negative numbers.' }
  }, o1.correctIdx, false);

  /* ── Reactivo 2 · que par pertenece a la tabla ── */
  var p2y  = p2b + p2r * p2x;
  var o2es = [
    '(' + intN(p2x) + ', ' + money(p2y) + ')',
    '(' + intN(p2x) + ', ' + money(p2r * p2x) + ')',
    '(' + intN(p2x) + ', ' + money(p2b * p2x) + ')',
    '(' + money(p2y) + ', ' + intN(p2x) + ')'
  ];
  var o2en = o2es;
  var o2 = shuffleOpts(o2es, o2en, rng);
  addItem({
    title: { es: 'El par que sí pertenece a la tabla', en: 'The pair that does belong in the table' },
    q: { es: 'Los repartidores de Transportes El Volcán cobran una base de ' + money(p2b) + ' a la semana más ' + money(p2r) + ' por cada entrega realizada. El jefe de ruta quiere llevar al plano la semana de un repartidor que hizo ' + intN(p2x) + ' entregas, con las entregas en el eje horizontal y el pago en el vertical. ¿Cuál de estos pares ordenados corresponde a esa semana?',
        en: 'The drivers of Transportes El Volcán are paid a base of ' + money(p2b) + ' a week plus ' + money(p2r) + ' for every delivery made. The route manager wants to take to the plane the week of a driver who made ' + intN(p2x) + ' deliveries, with deliveries on the horizontal axis and pay on the vertical one. Which of these ordered pairs matches that week?' },
    hint: { es: 'El pago de la semana tiene dos partes: una que se cobra aunque no salga la camioneta y otra que crece con cada entrega. Calcula primero la parte que crece y súmale la que no cambia. Y antes de elegir, revisa que el primer número del par sean las entregas.',
            en: 'The pay for the week has two parts: one collected even if the van never leaves and one that grows with every delivery. Work out the growing part first and add the part that never changes. And before choosing, check that the first number of the pair is the deliveries.' },
    opts: { es: o2.es, en: o2.en },
    exp: { es: 'Las ' + intN(p2x) + ' entregas aportan ' + money(p2r * p2x) + ' y a esa cantidad se le suma la base de ' + money(p2b) + ', así que el pago de la semana es ' + money(p2y) + ' y el par correcto es (' + intN(p2x) + ', ' + money(p2y) + '). La opción de ' + money(p2r * p2x) + ' se queda solo con la parte variable y deja al repartidor sin su base, que es lo que cobra pase lo que pase. La de ' + money(p2b * p2x) + ' multiplica la base por las entregas, como si cada entrega volviera a pagar la semana completa, y por eso da una cifra desproporcionada. La última opción tiene los dos números correctos pero en el orden equivocado: colocada así en el plano, mandaría el punto a ' + money(p2y) + ' entregas, un valor que no cabe en el eje horizontal de ninguna semana real.',
           en: 'The ' + intN(p2x) + ' deliveries contribute ' + money(p2r * p2x) + ' and to that amount the base of ' + money(p2b) + ' is added, so the pay for the week is ' + money(p2y) + ' and the right pair is (' + intN(p2x) + ', ' + money(p2y) + '). The option of ' + money(p2r * p2x) + ' keeps only the variable part and leaves the driver without the base, which is what is collected whatever happens. The one of ' + money(p2b * p2x) + ' multiplies the base by the deliveries, as if every delivery paid the whole week again, which is why it gives a figure out of all proportion. The last option has both numbers right but in the wrong order: placed like that on the plane it would send the point to ' + money(p2y) + ' deliveries, a value that fits on the horizontal axis of no real week.' }
  }, o2.correctIdx, true);

  /* ═══════════════════════ CONCEPTO 2 ═══════════════════════ */
  addSection(function(L) {
    var es = L === 'es';
    if (es) return '' +
      '<div class="stag">Concepto 2</div>' +
      '<h2>La pendiente y la ordenada al origen: los dos números que definen una recta</h2>' +
      '<p>Cuando los puntos de un negocio caen sobre una recta, esa recta queda descrita por completo con dos números y ninguno más. El primero es la <strong>ordenada al origen</strong>, que es la altura a la que la recta corta el eje vertical, es decir el valor que toma la cantidad medida cuando la otra vale cero. El segundo es la <strong>pendiente</strong>, que mide cuánto sube o baja la recta por cada unidad que se avanza hacia la derecha. En la vida de la empresa el primero suele ser la parte fija de una cuenta y el segundo la parte que se repite en cada unidad.</p>' +
      '<p>La pendiente se calcula comparando dos puntos cualesquiera de la recta: se mira cuánto cambió la cantidad vertical y se reparte ese cambio entre lo que cambió la horizontal. Escrito como cociente queda ' + frac('cambio vertical', 'cambio horizontal') + ', y en el caso del pago de un repartidor eso se lee como ' + frac('cambio del pago', 'cambio de las entregas') + '. El resultado no depende de qué par de puntos se elija, y esa independencia es justamente lo que distingue a una recta de cualquier otra curva.</p>' +
      '<p>El signo de la pendiente se lee antes que su tamaño. Si es positiva la recta sube hacia la derecha y la cantidad vertical crece con la horizontal, como el pago con las entregas. Si es negativa la recta baja, y eso describe todo lo que se agota o se deprecia: el valor contable de una camioneta, las cajas del almacén, el saldo de un préstamo que se va pagando. Si es cero la recta queda horizontal y la cantidad vertical no responde a la horizontal, que es la forma gráfica del sueldo fijo o de cualquier gasto que no depende del volumen.</p>' +
      '<p>Con los dos números en la mano la relación se escribe como una <strong>regla de correspondencia</strong>: se parte de la ordenada al origen y se le suma la pendiente multiplicada por la cantidad horizontal. Conviene desconfiar de dos errores muy frecuentes. Uno es intercambiar los papeles, poniendo de base lo que es tarifa por unidad; el resultado se dispara o se desploma y basta probar con un valor conocido para descubrirlo. El otro es leer la pendiente como si fuera un total: la pendiente nunca es lo que se pagó, es lo que se agrega al pasar de una unidad a la siguiente.</p>' +
      '<div class="rules-grid">' +
        '<div class="rcard"><div class="rname">Ordenada al origen</div><div class="rform">' + money(c2b) + '</div><div class="rnote">La altura de arranque de la recta.</div></div>' +
        '<div class="rcard"><div class="rname">Pendiente</div><div class="rform">' + money(c2m) + ' por entrega</div><div class="rnote">Lo que sube al avanzar una unidad.</div></div>' +
        '<div class="rcard"><div class="rname">Cómo se calcula</div><div class="rform">' + frac('cambio vertical', 'cambio horizontal') + '</div><div class="rnote">Dos puntos bastan.</div></div>' +
        '<div class="rcard"><div class="rname">Signo</div><div class="rform">sube, baja o se aplana</div><div class="rnote">Positiva, negativa o cero.</div></div>' +
      '</div>' +
      '<p><strong>Ejemplo resuelto.</strong> Un repartidor de Transportes El Volcán entregó ' + intN(c2x1) + ' paquetes en una semana y cobró ' + money(c2y1) + '. A la siguiente entregó ' + intN(c2x2) + ' y cobró ' + money(c2y2) + '. El área de nómina quiere reconstruir cómo está armado ese pago.</p>' +
      '<div class="callout"><p><strong>Paso 1.</strong> Se anotan los dos datos como puntos del plano, con las entregas en el eje horizontal y el pago en el vertical.<br>' +
      '<strong>Paso 2.</strong> Se mide el cambio de cada coordenada. El pago subió ' + money(c2y2 - c2y1) + ' y las entregas subieron ' + intN(c2dx) + '.<br>' +
      '<strong>Paso 3.</strong> Se reparte el cambio del pago entre el cambio de las entregas y la pendiente resulta ' + money(c2m) + ' por entrega. Ese es el pago variable.<br>' +
      '<strong>Paso 4.</strong> Para hallar la ordenada al origen se regresa a uno de los puntos: en la semana de ' + intN(c2x1) + ' entregas la parte variable fue ' + money(c2m * c2x1) + ', y como el pago total fue ' + money(c2y1) + ', la base debe ser ' + money(c2b) + '.<br>' +
      '<strong>Comprobación.</strong> Con la otra semana la cuenta cierra igual: ' + money(c2b) + ' de base más ' + money(c2m * c2x2) + ' de parte variable dan ' + money(c2y2) + '.<br>' +
      '<strong>Lectura de negocio.</strong> La base de ' + money(c2b) + ' es lo que la empresa paga aunque la ruta se caiga, y los ' + money(c2m) + ' por entrega son lo que cuesta cada paquete adicional. Esa separación es la que permite presupuestar una semana antes de que ocurra.</p></div>';
    return '' +
      '<div class="stag">Concept 2</div>' +
      '<h2>Slope and intercept: the two numbers that define a line</h2>' +
      '<p>When the points of a business fall along a line, that line is fully described by two numbers and no more. The first is the <strong>intercept</strong>, the height at which the line cuts the vertical axis, that is the value taken by the measured quantity when the other one is zero. The second is the <strong>slope</strong>, which measures how much the line rises or falls for every unit moved to the right. In the life of a company the first is usually the fixed part of an account and the second the part that repeats on every unit.</p>' +
      '<p>The slope is worked out by comparing any two points of the line: look at how much the vertical quantity changed and share that change out over how much the horizontal one changed. Written as a quotient it is ' + frac('vertical change', 'horizontal change') + ', and in the case of a driver’s pay that reads as ' + frac('change in pay', 'change in deliveries') + '. The result does not depend on which pair of points is chosen, and that independence is exactly what tells a line apart from any other curve.</p>' +
      '<p>The sign of the slope is read before its size. If it is positive the line rises to the right and the vertical quantity grows with the horizontal one, as pay does with deliveries. If it is negative the line falls, and that describes everything that runs out or depreciates: the book value of a van, the boxes in the store, the balance of a loan being paid off. If it is zero the line is flat and the vertical quantity does not respond to the horizontal one, which is the graphical shape of a fixed salary or of any expense that does not depend on volume.</p>' +
      '<p>With both numbers in hand the relation is written as a <strong>rule of correspondence</strong>: start from the intercept and add the slope multiplied by the horizontal quantity. It pays to distrust two very frequent mistakes. One is swapping the roles, putting as a base what is a rate per unit; the result shoots up or collapses and testing one known value is enough to expose it. The other is reading the slope as if it were a total: the slope is never what was paid, it is what gets added on moving from one unit to the next.</p>' +
      '<div class="rules-grid">' +
        '<div class="rcard"><div class="rname">Intercept</div><div class="rform">' + money(c2b) + '</div><div class="rnote">The starting height of the line.</div></div>' +
        '<div class="rcard"><div class="rname">Slope</div><div class="rform">' + money(c2m) + ' per delivery</div><div class="rnote">What it rises over one unit.</div></div>' +
        '<div class="rcard"><div class="rname">How it is found</div><div class="rform">' + frac('vertical change', 'horizontal change') + '</div><div class="rnote">Two points are enough.</div></div>' +
        '<div class="rcard"><div class="rname">Sign</div><div class="rform">rises, falls or flattens</div><div class="rnote">Positive, negative or zero.</div></div>' +
      '</div>' +
      '<p><strong>Worked example.</strong> A driver at Transportes El Volcán delivered ' + intN(c2x1) + ' parcels in one week and was paid ' + money(c2y1) + '. The next week they delivered ' + intN(c2x2) + ' and were paid ' + money(c2y2) + '. The payroll office wants to reconstruct how that pay is built.</p>' +
      '<div class="callout"><p><strong>Step 1.</strong> Write the two figures as points of the plane, with deliveries on the horizontal axis and pay on the vertical one.<br>' +
      '<strong>Step 2.</strong> Measure the change in each coordinate. Pay rose ' + money(c2y2 - c2y1) + ' and deliveries rose ' + intN(c2dx) + '.<br>' +
      '<strong>Step 3.</strong> Share the change in pay out over the change in deliveries and the slope comes to ' + money(c2m) + ' per delivery. That is the variable pay.<br>' +
      '<strong>Step 4.</strong> To find the intercept go back to one of the points: in the week of ' + intN(c2x1) + ' deliveries the variable part was ' + money(c2m * c2x1) + ', and since total pay was ' + money(c2y1) + ', the base has to be ' + money(c2b) + '.<br>' +
      '<strong>Check.</strong> The other week closes the same way: ' + money(c2b) + ' of base plus ' + money(c2m * c2x2) + ' of variable part give ' + money(c2y2) + '.<br>' +
      '<strong>Business reading.</strong> The base of ' + money(c2b) + ' is what the company pays even if the route falls through, and the ' + money(c2m) + ' per delivery is what every extra parcel costs. That separation is what makes it possible to budget a week before it happens.</p></div>';
  });

  widgetRecta(w2b, w2m, w2x);

  /* ── Reactivo 3 · la pendiente a partir de dos puntos ── */
  var p3a1 = Math.round(p3y1 / p3x1);
  var p3a2 = Math.round(p3y2 / p3x2);
  var o3es = [ money(p3m), money(p3dy), money(p3a2), money(p3a1) ];
  var o3en = o3es;
  var o3 = shuffleOpts(o3es, o3en, rng);
  addItem({
    title: { es: 'Lo que agrega cada entrega', en: 'What every delivery adds' },
    q: { es: 'La nómina de Transportes El Volcán registró dos semanas del mismo repartidor. En una hizo ' + intN(p3x1) + ' entregas y cobró ' + money(p3y1) + '; en la otra hizo ' + intN(p3x2) + ' entregas y cobró ' + money(p3y2) + '. Llevados al plano, los dos datos caen sobre una misma recta. ¿Cuánto se le agrega al pago por cada entrega adicional?',
        en: 'The payroll office of Transportes El Volcán recorded two weeks of the same driver. In one they made ' + intN(p3x1) + ' deliveries and were paid ' + money(p3y1) + '; in the other they made ' + intN(p3x2) + ' deliveries and were paid ' + money(p3y2) + '. Taken to the plane, both figures fall on one line. How much is added to the pay for every extra delivery?' },
    hint: { es: 'Compara las dos semanas midiendo el cambio de cada coordenada por separado: cuánto subió el pago y cuántas entregas más se hicieron. La cantidad que buscas reparte el primero de esos cambios entre el segundo, no entre el total de una sola semana.',
            en: 'Compare the two weeks by measuring the change in each coordinate separately: how much the pay went up and how many more deliveries were made. The amount you are after shares the first of those changes out over the second, not over the total of a single week.' },

      '<h2>Leer la recta: dónde corta los ejes y dónde se cruza con otra</h2>' +
      '<p>Trazar la recta es la mitad del trabajo; la otra mitad es leerla. Hay tres lugares del dibujo que concentran casi toda la información que un dueño necesita. El primero es el punto donde la recta corta el <strong>eje vertical</strong>: ahí la cantidad horizontal vale cero, y en una cuenta de costos ese punto es el gasto que se paga aunque no haya un solo movimiento. El segundo es el punto donde la recta corta el <strong>eje horizontal</strong>: ahí la cantidad vertical vale cero, y en una cuenta de resultados ese punto es el volumen a partir del cual la empresa deja de perder. El tercero es cualquier punto intermedio, que se obtiene sustituyendo un valor en la regla y sirve para responder preguntas del tipo cuánto sale si hago tanto.</p>' +
      '<p>Cuando se dibujan <strong>dos rectas en el mismo plano</strong>, la comparación entre ellas se vuelve casi automática. La recta que va por encima en un tramo es la que da la cantidad mayor en ese tramo, y el punto donde se cruzan es el único lugar donde las dos coinciden. Si una recta representa el ingreso y la otra el costo total, el cruce es el punto de equilibrio y la distancia vertical entre las dos, medida en cualquier volumen, es el resultado del mes: hacia arriba ganancia, hacia abajo pérdida.</p>' +
      '<p>Dos rectas con la misma pendiente nunca se cruzan, porque suben al mismo ritmo y conservan siempre la misma separación. Eso también tiene lectura de negocio: si dos proveedores cobran exactamente lo mismo por unidad y solo difieren en la cuota fija, el más caro será más caro en todos los volúmenes y no hay decisión que tomar. La decisión aparece cuando las pendientes son distintas, porque entonces existe un volumen en el que la ventaja cambia de bando.</p>' +
      '<p>Al leer una gráfica conviene revisar dos cosas antes de sacar conclusiones. Primero, hasta dónde llega el tramo con sentido: la recta se puede prolongar en el papel indefinidamente, pero una empresa con seis camionetas no puede hacer diez mil entregas al mes por más que la recta lo permita. Segundo, si el resultado que se lee es una cantidad que se cuenta en piezas enteras; en ese caso el punto exacto que da la cuenta casi nunca cae en un entero y hay que decidir hacia dónde se ajusta según lo que pida la situación.</p>' +

      '<h2>Reading the line: where it cuts the axes and where it meets another</h2>' +
      '<p>Drawing the line is half the job; the other half is reading it. Three places in the picture hold almost all the information an owner needs. The first is the point where the line cuts the <strong>vertical axis</strong>: there the horizontal quantity is zero, and in a cost account that point is the expense paid even with no movement at all. The second is the point where the line cuts the <strong>horizontal axis</strong>: there the vertical quantity is zero, and in a results account that point is the volume from which the company stops losing. The third is any point in between, obtained by substituting a value into the rule, and it answers questions of the kind how much do I get if I do so many.</p>' +
      '<p>When <strong>two lines are drawn on the same plane</strong>, comparing them becomes almost automatic. The line running above over a stretch is the one giving the larger quantity over that stretch, and the point where they cross is the only place where the two agree. If one line stands for revenue and the other for total cost, the crossing is the break even point and the vertical distance between them, measured at any volume, is the result of the month: upwards a profit, downwards a loss.</p>' +
      '<p>Two lines with the same slope never cross, because they rise at the same rate and always keep the same separation. That has a business reading too: if two suppliers charge exactly the same per unit and differ only in the fixed fee, the dearer one will be dearer at every volume and there is no decision to make. The decision appears when the slopes differ, because then there is a volume at which the advantage changes sides.</p>' +

           en: 'The line starts at ' + money(p7v0) + ', which is the intercept, and falls ' + money(p7s) + ' every month, so its slope is negative. Over ' + intN(p7k) + ' months it accumulates a drop of ' + money(p7s * p7k) + ', and taking that off the initial value leaves the height at ' + money(p7val) + '. The option of ' + money(p7v0 + p7s * p7k) + ' adds the drop instead of subtracting it and describes a van that gains value with use. The one of ' + money(p7v0 - p7s) + ' takes off a single month rather than the ' + intN(p7k) + ' that went by, a slip that shows up as soon as the answer is tested at month one. And the one of ' + money(p7s * p7k) + ' gives the accumulated loss instead of the value left: it is how far the line came down, not the height where it now sits.' }
  }, o7.correctIdx, true);

        en: 'Transportes El Volcán is comparing two workshops for the maintenance of its vans. Workshop A charges a monthly fee of ' + money(p9FA) + ' plus ' + money(p9c) + ' for every service carried out. Workshop B charges a monthly fee of ' + money(p9FB) + ' plus ' + money(p9c) + ' for every service. The manager draws both cost lines on one plane. From how many services a month onwards is it worth changing workshop?' },

           en: 'Both lines have the same slope, ' + money(p9c) + ' per service, so they rise at the same rate and the separation between them stays at ' + money(p9dF) + ' at every volume. Two parallel lines do not cross, and without a crossing there is no volume at which the advantage changes sides: workshop B is cheaper from the first service and stays cheaper for good. The option of ' + intN(p9n1) + ' services shares the difference in fees out over the cost per service as if there were a saving per unit to pay off, but here the saving per service is zero. The one of ' + intN(p9n2) + ' services shares the fee of workshop A out over that same cost per service, mixing a monthly fee with a unit rate that is not even the one telling the two workshops apart. And the last option assumes the crossing moves with the volume, when what changes with volume is the height of the lines, not their tilt.' }
  }, o9.correctIdx, false);

/* ════════════════════════════════════════════════════════════════════════
   LANGUAGE
   Switching rebuilds visible text only. The numbers were drawn once by the
   seeded rng and never change with the language.
   ════════════════════════════════════════════════════════════════════════ */
function applyUIStrings() {
  var set = function(id, txt) { var e = document.getElementById(id); if (e) e.textContent = txt; };
  var ph  = function(id, txt) { var e = document.getElementById(id); if (e) e.placeholder = txt; };
  set('wtitle-el',    SCHOOL.guideTitle[LANG]);
  set('wcourse-el',   SCHOOL.courseName[LANG]);
  set('htitle-el',    SCHOOL.guideTitle[LANG]);
  set('lbl-name-el',  t('lbl-name'));
  set('lbl-group-el', t('lbl-group'));
  set('startBtn',     t('btn-start'));
  set('restoreTitle', t('restore-title'));
  set('restoreMsg',   t('restore-msg'));
  set('restoreBtn',   t('btn-restore'));
  set('dismissBtn',   t('btn-dismiss'));
  set('dlBtn',        t('btn-pdf'));
  ph('sName',  t('ph-name'));
  ph('sGroup', t('ph-group'));
  var ll = document.getElementById('logo-left');  if (ll) ll.alt = SCHOOL.logoLeftAlt;
  var lr = document.getElementById('logo-right'); if (lr) lr.alt = SCHOOL.logoRightAlt;
}
/* Rebuilds the visible text of every card without touching the numbers. */
function applyProblemLang() {
  problems.forEach(function(p, i) {
    var card = document.getElementById('pc' + i);
    if (!card || !p.i18n) return;
    p.title = p.i18n.title[LANG];
    p.q     = p.i18n.q[LANG];
    p.hint  = p.i18n.hint[LANG];
    p.exp   = p.i18n.exp[LANG];
    p.opts  = p.i18n.opts[LANG].slice();
    var ti = card.querySelector('.ptitle'); if (ti) ti.textContent = p.title;
    var st = card.querySelector('.pstmt');  if (st) st.innerHTML = p.q;
    var hb = card.querySelector('.hintbox'); if (hb) hb.innerHTML = p.hint;
    var hbtn = card.querySelector('.hintbtn'); if (hbtn) hbtn.textContent = t('btn-hint');
    card.querySelectorAll('.mcopt').forEach(function(o, oi) {
      if (p.opts[oi] !== undefined) o.innerHTML = p.opts[oi];
    });
    var tabs = card.querySelectorAll('.wtab');
    if (tabs.length === 3) {
      tabs[0].textContent = t('tab-draw');
      tabs[1].textContent = t('tab-type');
      tabs[2].textContent = t('tab-photo');
    }
    var tools = card.querySelectorAll('.tbtn2');
    if (tools.length === 3) {
      tools[0].textContent = t('tool-pen');
      tools[1].textContent = t('tool-mark');
      tools[2].textContent = t('tool-erase');
    }
    var clr = card.querySelector('.clrbtn'); if (clr) clr.textContent = t('tool-clear');
    var ta  = card.querySelector('.wtextarea'); if (ta) ta.placeholder = t('ph-work');
    var pzt = card.querySelector('.pztxt'); if (pzt) pzt.textContent = t('ph-photo');
    var lab = card.querySelector('.pbody > div:last-child > div:first-child');
    if (lab) lab.textContent = t('lbl-answer');
    var fb = card.querySelector('.mcfb');
    if (fb && fb.classList.contains('show')) {
      var isOk = (p.studentChoice === p.correctIdx);
      fb.innerHTML = '<strong>' + (isOk ? t('fb-correct') : t('fb-wrong')) + '</strong> ' + p.exp;
    }
  });
}
function setLang(l) {
  LANG = l;
  try { localStorage.setItem(LANG_KEY, l); } catch(e) {}
  document.documentElement.setAttribute('lang', l);
  var be = document.getElementById('btn-es'), bn = document.getElementById('btn-en');
  if (be) be.classList.toggle('active', l === 'es');
  if (bn) bn.classList.toggle('active', l === 'en');
  applyUIStrings();
  applySectionLang();
  applyProblemLang();
  widgets.forEach(function(f) { try { f(); } catch(e) {} });
  document.querySelectorAll('#lessonBody .section').forEach(function(s) { s.classList.add('vis'); });
}
(function() {
  try { var stored = localStorage.getItem(LANG_KEY); if (stored === 'es' || stored === 'en') LANG = stored; } catch(e) {}
  document.addEventListener('DOMContentLoaded', function() {
    document.documentElement.setAttribute('lang', LANG);
    var be = document.getElementById('btn-es'), bn = document.getElementById('btn-en');
    if (be) be.classList.toggle('active', LANG === 'es');
    if (bn) bn.classList.toggle('active', LANG === 'en');
    applyUIStrings();
  });
})();

async function generatePDF() {
  var btn = document.getElementById('dlBtn');
  btn.textContent = t('pdf-busy');
  btn.disabled = true;

  var jspdf   = window.jspdf;
  var doc     = new jspdf.jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });
  var PW      = 215.9;
  var M       = 18;
  var TW      = PW - M * 2;
  var PH      = doc.internal.pageSize.height;
  var name    = studentData.name;
  var group   = studentData.group;
  var total   = problems.length;
  var pct     = Math.round(correctCount / total * 100);
  var dateStr = new Date().toLocaleString(LANG === 'es' ? 'es-MX' : 'en-US', { dateStyle:'long', timeStyle:'short' });

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;

  /* Flattens the fraction markup into a slash before the tags are stripped,
     so a rational expression stays readable in the printed sheet. */
  function pdfText(html) {
    if (!html) return '';
    return html
      .replace(/<span class="mf-den">/g, ' / ')
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/’/g, String.fromCharCode(39))
      .replace(/→/g,'->').replace(/−/g,'-').replace(/²/g,'^2')
      .replace(/³/g,'^3').replace(/×/g,'x').replace(/÷/g,'/')
      .replace(/≠/g,'!=').replace(/≤/g,'<=').replace(/≥/g,'>=')
      .replace(/√/g,'sqrt').replace(/π/g,'pi').replace(/…/g,'...')
      .replace(/·/g,'*').replace(/\s+/g,' ').trim();
  }

  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,2,'F');
  doc.setFillColor(255,255,255); doc.rect(0,2,PW,26,'F');
  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,28,PW,2,'F');
  doc.setFillColor(pBR,pBG,pBB); doc.rect(0,30,PW,34,'F');

  var fmtL = SCHOOL.logoLeftB64.indexOf('/9j/') > -1 ? 'JPEG' : 'PNG';
  var fmtR = SCHOOL.logoRightB64.indexOf('/9j/') > -1 ? 'JPEG' : 'PNG';
  try { doc.addImage(SCHOOL.logoLeftB64,  fmtL, M,  4.0, 22, 22); } catch(e) {}
  try { doc.addImage(SCHOOL.logoRightB64, fmtR, 48, 4.5, 48, 21); } catch(e) {}

  var lx = PW - M - 36;
  var ly = 10;
  doc.setDrawColor(pBR,pBG,pBB); doc.setLineWidth(0.7);
  doc.lines([[2.57-1.03,4.63-6.17],[4.11-2.57,5.14-4.63],[5.66-4.11,2.57-5.14]], lx+1.03, ly+6.17);
  doc.setFillColor(pAR,pAG,pAB); doc.circle(lx+5.66, ly+2.57, 0.9, 'F');
  doc.setDrawColor(pAR,pAG,pAB); doc.setLineWidth(0.7);
  doc.line(lx+8.23, ly+1.54, lx+8.23, ly+7.2);
  doc.setTextColor(pBR,pBG,pBB); doc.setFontSize(11); doc.setFont('helvetica','bold');
  doc.text('LIAXA', lx+10, ly+6.8);

  doc.setTextColor(240,244,238); doc.setFontSize(14); doc.setFont('helvetica','bold');
  doc.text(SCHOOL.guideTitle[LANG], M, 49);
  doc.setTextColor(198,214,192); doc.setFontSize(8); doc.setFont('helvetica','normal');
  doc.text(dateStr, M, 59);

  doc.setFillColor(237,240,245); doc.roundedRect(M,72,TW,20,3,3,'F');
  doc.setTextColor(130,140,160); doc.setFontSize(8.5); doc.setFont('helvetica','bold');
  doc.text(t('pdf-student'), M+4, 79); doc.text(t('pdf-group'), 130, 79);
  doc.setTextColor(20,24,32); doc.setFontSize(11); doc.setFont('helvetica','bold');
  doc.text(name, M+4, 87); doc.text(group, 130, 87);

  var sc = pct>=70?[26,106,74]:pct>=50?[224,123,26]:[176,48,16];
  doc.setFillColor(255,255,255); doc.roundedRect(M,100,TW,34,4,4,'F');
  doc.setDrawColor(sc[0],sc[1],sc[2]); doc.setLineWidth(0.8);
  doc.roundedRect(M,100,TW,34,4,4,'S');
  doc.setTextColor(sc[0],sc[1],sc[2]); doc.setFontSize(40); doc.setFont('helvetica','bold');
  doc.text(pct+'%', PW/2, 124, {align:'center'});
  doc.setTextColor(130,140,160); doc.setFontSize(8.5); doc.setFont('helvetica','normal');
  doc.text(correctCount+' '+t('pdf-score')+' '+total+' '+t('pdf-questions'), PW/2, 131, {align:'center'});

  doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
  doc.setFontSize(7); doc.setFont('helvetica','bold');
  doc.rect(M,142,TW,8,'F'); doc.text(t('pdf-summary'), M+4, 148);
  var sy = 154;
  problems.forEach(function(prob, i) {
    if (sy + 12 > PH - 15) {
      doc.addPage(); sy = 20;
      doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
      doc.setFontSize(7); doc.setFont('helvetica','bold');
      doc.rect(M,sy,TW,8,'F'); doc.text(t('pdf-summary2'), M+4, sy+6);
      sy += 12;
    }
    var ok = document.getElementById('pc'+i).classList.contains('ok');
    doc.setFillColor(ok?232:255, ok?240:232, ok?232:228);
    doc.roundedRect(M,sy,TW,10,2,2,'F');
    doc.setFillColor(ok?26:176, ok?106:48, ok?74:16);
    doc.circle(M+6, sy+5, 2.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(7); doc.setFont('helvetica','bold');
    doc.text(ok?'v':'x', M+4.5, sy+6.5);
    doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('helvetica','normal');
    doc.text(t('pdf-item')+' '+(i+1)+': '+pdfText(prob.title), M+12, sy+6.5);
    doc.setTextColor(ok?26:176, ok?106:48, ok?74:16);
    doc.text(ok?t('pdf-ok'):t('pdf-bad'), PW-M-24, sy+6.5);
    sy += 12;
  });

  for (var i = 0; i < problems.length; i++) {
    var prob = problems[i];
    doc.addPage();
    var wy = 0;

    doc.setFillColor(pBR,pBG,pBB); doc.rect(0,0,PW,20,'F');
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,3,'F');
    doc.setTextColor(pAR,pAG,pAB); doc.setFontSize(7); doc.setFont('helvetica','normal');
    doc.text(SCHOOL.courseName[LANG]+'  ·  '+SCHOOL.guideTitle[LANG], M, 10);
    doc.setTextColor(240,244,238); doc.setFontSize(10.5); doc.setFont('helvetica','bold');
    doc.text(t('pdf-item')+' '+(i+1)+' '+t('pdf-of')+' '+total+'  ·  '+pdfText(prob.title), M, 17);
    wy = 25;

    var qRaw = pdfText(prob.q);
    doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var qLines = doc.splitTextToSize(qRaw, TW-10);
    var qBoxH  = 8 + qLines.length*5 + 3;
    doc.setFillColor(237,240,245); doc.roundedRect(M,wy,TW,qBoxH,2,2,'F');
    doc.setTextColor(pBR,pBG,pBB); doc.setFontSize(6.5); doc.setFont('helvetica','bold');
    doc.text(t('pdf-question'), M+4, wy+6);
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var qy = wy+12;
    qLines.forEach(function(ln,li){ doc.text(ln, M+4, qy+li*5); });
    wy += qBoxH + 4;

    var isOk   = document.getElementById('pc'+i).classList.contains('ok');
    var chosen = prob.studentChoice != null ? pdfText(prob.opts[prob.studentChoice]||'') : '';
    var corr   = pdfText(prob.opts[prob.correctIdx]||'');
    var expRaw = pdfText(prob.exp||'');
    doc.setFontSize(8.5); var chLines = doc.splitTextToSize(t('pdf-yours')+chosen, TW-18);
    doc.setFontSize(8);   var coLines = doc.splitTextToSize(t('pdf-key')+corr, TW-18);
    doc.setFontSize(7.5); var exLines = doc.splitTextToSize(t('pdf-sol')+expRaw, TW-18).slice(0,4);
    var ansBoxH = 8 + chLines.length*5.5 + coLines.length*5 + exLines.length*5 + 6;
    doc.setFillColor(isOk?232:255, isOk?240:232, isOk?232:228);
    doc.roundedRect(M,wy,TW,ansBoxH,2,2,'F');
    doc.setFillColor(isOk?26:176, isOk?106:48, isOk?74:16);
    doc.circle(M+7, wy+8, 3.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(9); doc.setFont('helvetica','bold');
    doc.text(isOk?'v':'x', M+5.2, wy+10.5);
    var ay = wy+7;
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','bold');
    chLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5.5); });
    ay += chLines.length*5.5 + 3;
    doc.setTextColor(26,106,74); doc.setFontSize(8); doc.setFont('helvetica','normal');
    coLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    ay += coLines.length*5 + 3;
    doc.setTextColor(90,85,80); doc.setFontSize(7.5);
    exLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    wy += ansBoxH + 5;

    var dc = document.getElementById('dc'+i);
    if (dc) {
      doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
      doc.setFontSize(7); doc.setFont('helvetica','bold');
      doc.rect(M,wy,TW,8,'F'); doc.text(t('pdf-work'), M+4, wy+5.5);
      wy += 11;
      try {
        var imgD = dc.toDataURL('image/png');
        var ar   = dc.height / dc.width;
        var iw   = TW;
        var ih   = Math.min(iw * ar, 68);
        doc.addImage(imgD, 'PNG', M, wy, iw, ih);
        wy += ih + 4;
      } catch(e) {}
    }

    var ta = document.getElementById('ta'+i);
    if (ta && ta.value.trim()) {
      if (wy > PH-30) { doc.addPage(); wy = 20; }
      doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('courier','normal');
      var taLines = doc.splitTextToSize(ta.value, TW);
      taLines.slice(0,16).forEach(function(ln) {
        if (wy > PH-15) { doc.addPage(); wy = 20; }
        doc.text(ln, M, wy); wy += 5;
      });
      wy += 2;
    }

    var pp = document.getElementById('pp'+i);
    if (pp && pp.src && pp.src.indexOf('data:') === 0) {
      if (wy > PH-55) { doc.addPage(); wy = 20; }
      try { doc.addImage(pp.src, 'JPEG', M, wy, TW, 68); wy += 72; } catch(e) {}
    }
  }

  var pages = doc.internal.getNumberOfPages();
  for (var p = 1; p <= pages; p++) {
    doc.setPage(p);
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0, PH-3, PW, 3, 'F');
    doc.setTextColor(130,140,160); doc.setFontSize(6.5); doc.setFont('helvetica','normal');
    doc.text(name+'  ·  '+group+'  ·  '+t('pdf-code')+code+'  ·  '+t('pdf-page')+p+'/'+pages,
      PW/2, PH-5, {align:'center'});
  }

  var _fn = SCHOOL.filePrefix + '_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf';
  var _pdfBlob = doc.output('blob');
  var _blobUrl = URL.createObjectURL(_pdfBlob);
  var _a = document.createElement('a');
  _a.href = _blobUrl;
  _a.download = _fn;
  document.body.appendChild(_a);
  _a.click();
  setTimeout(function(){ document.body.removeChild(_a); URL.revokeObjectURL(_blobUrl); }, 200);
  btn.textContent = t('btn-pdf');
  btn.disabled  = false;
}
</script>
</body>
</html>
