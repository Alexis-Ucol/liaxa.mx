<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ciclos del Carbono y Nitrógeno y Calentamiento Global</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Ciclos del Carbono y Nitrógeno y Calentamiento Global</div>
    <div class="wcourse" id="wcourse-el">Biología · 1° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Ciclos del Carbono y Nitrógeno y Calentamiento Global</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="sbtn" id="dlBtn" onclick="generatePDF()" style="max-width:280px;margin:0 auto;">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   CENTRALIZED SCHOOL CONFIG (Rule 16) — ships UNBRANDED (Rule 11).
   The ONLY rebranding point. build_all.py substitutes these exact fields
   (BRAND_FIELDS / RGB_FIELDS / logo*) downstream; :root/dark stay as fallback.
   Neutral defaults below == the static :root/dark values, so unbranded == no-op.
   ══════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:'#1a3a6b', primaryDark:'#0f2444', primaryBg:'#e8edf5',
  accent:'#c9a84c', accentBg:'#f7f1e3',
  darkPrimary:'#4a78bf', darkPrimaryDark:'#7aa2e0', darkPrimaryBg:'#0e1f38',

/* ── Attempt counter + seed (Rule 4): seed = name+group+attempt ── */
function getAttemptKey(name, group){ return 'bio1_t07_g03__att__' + (name+'__'+group).replace(/\s+/g,'_'); }
function nextAttempt(name, group){ var k=getAttemptKey(name,group),n=0; try{n=parseInt(localStorage.getItem(k)||'0',10)||0;}catch(e){} n++; try{localStorage.setItem(k,String(n));}catch(e){} return n; }
function currentAttempt(name, group){ var k=getAttemptKey(name,group); try{return parseInt(localStorage.getItem(k)||'1',10)||1;}catch(e){return 1;} }
/* ================================================
   STATE
   ================================================ */
var studentData   = {};
var problems      = [];

/* ================================================
   SESSION PERSISTENCE  (localStorage)
   ================================================ */
function lsKey() {
  var n = (studentData.name  || '').trim();
  var g = (studentData.group || '').trim();
  return 'bio1_t07_g03__' + (n + '__' + g).replace(/\s+/g, '_');
}

function saveSession() {
  if (!studentData.name) return;
  var drawings = [], texts = [], photos = [];
  problems.forEach(function(p, i) {
    var dc = document.getElementById('dc' + i);
    if (dc && dc.width) {
      var blank = document.createElement('canvas');
      blank.width = dc.width; blank.height = dc.height;
      drawings.push(dc.toDataURL() === blank.toDataURL() ? null : dc.toDataURL('image/png'));
    } else { drawings.push(null); }
    var ta = document.getElementById('ta' + i);
    texts.push(ta ? ta.value : '');
    var pp = document.getElementById('pp' + i);
    photos.push((pp && pp.src && pp.src.indexOf('data:') === 0) ? pp.src : null);
  });
  var state = {
    name: studentData.name, group: studentData.group,
    answeredCount: answeredCount, correctCount: correctCount,
    choices: problems.map(function(p) { return p.studentChoice; }),
    drawings: drawings, texts: texts, photos: photos
  };
  try { localStorage.setItem(lsKey(), JSON.stringify(state)); } catch(e) {}
}

function loadSession(name, group) {
  var key = 'bio1_t07_g03__' + (name + '__' + group).replace(/\s+/g, '_');
  try { var r = localStorage.getItem(key); return r ? JSON.parse(r) : null; } catch(e) { return null; }
}

function restoreSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  var saved = loadSession(name, group);
  if (!saved) return;
  document.getElementById('restoreBar').style.display = 'none';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = currentAttempt(name, group);
  buildLesson(seededRng(name + group + att));
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
  saved.choices.forEach(function(choice, idx) {
    if (choice !== null && choice !== undefined) confirmMC(idx, choice);
  });
  setTimeout(function() {
    if (saved.drawings) {
      saved.drawings.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var dc = document.getElementById('dc' + i);
        if (!dc || !dc.width) return;
        var img = new Image();
        img.onload = function() {
          var dpr = window.devicePixelRatio || 1;
          dc.getContext('2d').drawImage(img, 0, 0, dc.width / dpr, dc.height / dpr);
        };
        img.src = dataUrl;
      });
    }
    if (saved.texts) {
      saved.texts.forEach(function(text, i) {
        if (!text) return;
        var ta = document.getElementById('ta' + i);
        if (ta) ta.value = text;
      });
    }
    if (saved.photos) {
      saved.photos.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var pp = document.getElementById('pp' + i);
        if (!pp) return;
        pp.src = dataUrl; pp.style.display = 'block';
        var pz = document.getElementById('pz' + i);
        if (pz) pz.style.opacity = '0.4';
      });
    }
  }, 300);
}

function dismissRestore() {
  document.getElementById('restoreBar').style.display = 'none';
}

function checkForSavedSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  if (!name || !group) { document.getElementById('restoreBar').style.display = 'none'; return; }
  var saved = loadSession(name, group);
  var bar = document.getElementById('restoreBar');
  bar.style.display = (saved && saved.choices && saved.choices.some(function(c){ return c !== null; })) ? 'block' : 'none';
}

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

async function generatePDF() {
  var btn = document.getElementById('dlBtn');

  btn.disabled = true;

  var jspdf   = window.jspdf;
  var doc     = new jspdf.jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });
  var PW      = 215.9;
  var M       = 18;
  var TW      = PW - M * 2;
  var PH      = doc.internal.pageSize.height;
  var name    = studentData.name;
  var group   = studentData.group;
  var total   = problems.length;
  var pct     = Math.round(correctCount / total * 100);
  var dateStr = new Date().toLocaleString('es-MX', { dateStyle:'long', timeStyle:'short' });

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS — INJECTION BLOCK ─────────────────────────────────────────
  //   Match these RGB values to --green and --gold above.
  //   PRIMARY  → pBR, pBG, pBB
  //   ACCENT   → pAR, pAG, pAB
  // ──────────────────────────────────────────────────────────────────────────
  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;  // PRIMARY (from SCHOOL, Rule 16)
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;   // ACCENT (from SCHOOL, Rule 16)

  function pdfText(html) {
    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/\u2192/g,'->').replace(/\u2212/g,'-').replace(/\u00b2/g,'^2')
      .replace(/\u00b3/g,'^3').replace(/\u00d7/g,'x').replace(/\u00f7/g,'/')
      .replace(/\u2260/g,'!=').replace(/\u2264/g,'<=').replace(/\u2265/g,'>=')
      .replace(/\u221a/g,'sqrt').replace(/\u03c0/g,'pi').replace(/\u2026/g,'...')
      .replace(/\s+/g,' ').trim();
  }

  // ── PORTADA: orange line / white logo strip / orange line / blue band ──

    doc.setTextColor(255,255,255); doc.setFontSize(9); doc.setFont('helvetica','bold');
    doc.text(isOk?'✓':'✗', M+5.2, wy+10.5);
    var ay = wy+7;

    chLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5.5); });
    ay += chLines.length*5.5 + 3;
    doc.setTextColor(26,106,74); doc.setFontSize(8); doc.setFont('helvetica','normal');
    coLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    ay += coLines.length*5 + 3;
    doc.setTextColor(90,85,80); doc.setFontSize(7.5);
    exLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    wy += ansBoxH + 5;

    doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
    doc.setFontSize(7); doc.setFont('helvetica','bold');
    doc.rect(M,wy,TW,8,'F'); doc.text('TRABAJO DEL ALUMNO', M+4, wy+5.5);
    wy += 11;

    var dc = document.getElementById('dc'+i);
    if (dc) {
      try {
        var imgD = dc.toDataURL('image/png');

      });

      try { doc.addImage(pp.src, 'JPEG', M, wy, TW, 68); wy += 72; } catch(e) {}
    }
  }

  // ── Footer on every page ──
  var pages = doc.internal.getNumberOfPages();
  for (var p = 1; p <= pages; p++) {
    doc.setPage(p);
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0, PH-3, PW, 3, 'F');

      PW/2, PH-5, {align:'center'});
  }

  doc.save('bio1_t07_g03_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf');
  btn.innerHTML = '⬇ &nbsp;Descargar Resultados PDF';
  btn.disabled  = false;
}

/* ══════════════════════════════════════════════════════════════════════════
   GUÍA :: Ciclos del carbono y del nitrógeno y calentamiento global.
   El carbono que va y viene entre el aire y los seres vivos, el balance entre
   lo que entra y lo que sale, la manta de gases que retiene calor, el camino
   del nitrógeno y las bacterias que lo hacen aprovechable, el exceso que
   termina en el agua y en el aire, y las prácticas de consumo detrás de todo.
   Bilingüe (Rule 10), variantes por semilla (Rule 4), manipulativos marcados

function L(o){ return (o && o[LANG] !== undefined) ? o[LANG] : (o ? o.es : ''); }
function ri(rng, a, b){ return a + Math.floor(rng() * (b - a + 1)); }
function pk(rng, a){ return a[Math.floor(rng() * a.length)]; }
function gcd(a, b){ while (b){ var t = a % b; a = b; b = t; } return a; }

function say(host, cls, msg){
  var e = host.querySelector('.gw-fb');
  if (!e) return;
  e.className = 'gw-fb' + (cls ? ' ' + cls : '');
  e.innerHTML = msg;
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 1 :: la balanza del carbono
   Dos platillos: lo que se manda al aire y lo que se retira del aire. El
   alumno sube o baja fuentes y superficie verde con los botones y la balanza
   se inclina al instante, con el sobrante de carbono escrito debajo. Tres
   lugares distintos, cada uno con sus propias cantidades.
   ══════════════════════════════════════════════════════════════════════════ */
function wBalanza(rng, host){
  var SCENES = [
    { lugar:{ es:'un pueblo junto al bosque', en:'a village next to the forest' },
      src:{ es:'camión de carga', en:'freight lorry' }, srcs:{ es:'camiones', en:'lorries' },
      abs:{ es:'hectárea de bosque', en:'hectare of forest' }, abss:{ es:'hectáreas de bosque', en:'hectares of forest' } },
    { lugar:{ es:'una ciudad de la costa', en:'a coastal city' },
      src:{ es:'fábrica', en:'factory' }, srcs:{ es:'fábricas', en:'factories' },
      abs:{ es:'hectárea de manglar', en:'hectare of mangrove' }, abss:{ es:'hectáreas de manglar', en:'hectares of mangrove' } },
    { lugar:{ es:'una colonia con parque', en:'a neighbourhood with a park' },
      src:{ es:'casa que quema gas', en:'house burning gas' }, srcs:{ es:'casas que queman gas', en:'houses burning gas' },
      abs:{ es:'hilera de árboles', en:'row of trees' }, abss:{ es:'hileras de árboles', en:'rows of trees' } },
    { lugar:{ es:'un valle agrícola', en:'a farming valley' },
      src:{ es:'tractor', en:'tractor' }, srcs:{ es:'tractores', en:'tractors' },
      abs:{ es:'hectárea de selva baja', en:'hectare of dry forest' }, abss:{ es:'hectáreas de selva baja', en:'hectares of dry forest' } }
  ];
  var PAIRS = [[2,3],[3,4],[2,5],[3,5],[4,6],[5,6],[4,5]];
  var rounds = shuffle(SCENES, rng).slice(0, 3);
  var data = [];
  for (var k = 0; k < 3; k++){
    var pr = shuffle(PAIRS, rng)[0];
    var pe = pr[0], pa = pr[1];
    if (rng() < 0.5){ var sw = pe; pe = pa; pa = sw; }
    var c0 = ri(rng, 2, 6), b0 = ri(rng, 1, 5);
    if (pe * c0 === pa * b0) b0 = b0 + 1;
    var g = gcd(pe, pa);
    data.push({ pe:pe, pa:pa, c0:c0, b0:b0, cSol:pa / g, bSol:pe / g });
  }
  var round = 0, c = 1, b = 1, tries = 0, revealed = false, done = false;

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'La balanza del carbono', en:'The carbon balance' }) + '</div>' +
    '<div class="gw-q" data-r="q"></div>' +
    '<div class="gw-mini">' + L({
      es:'De un lado está el carbono que se manda al aire cada año y del otro el que se retira del aire. Sube o baja cada lado con los botones y mira cómo se inclina la balanza. Cuando creas que quedó nivelada, usa el botón de comprobar.',
      en:'On one side is the carbon sent into the air each year and on the other the carbon taken out of the air. Raise or lower each side with the buttons and watch how the balance tips. When you think it is level, use the check button.'
    }) + '</div>' +
    '<div class="bl-stage">' +
      '<div class="bl-post"></div>' +
      '<div class="bl-beam" data-r="beam">' +
        '<div class="bl-pan l" data-r="panL"><div class="bl-plbl">' + L({ es:'Al aire', en:'Into the air' }) + '</div><div class="bl-pval" data-r="valL"></div></div>' +
        '<div class="bl-pan r" data-r="panR"><div class="bl-plbl">' + L({ es:'Fuera del aire', en:'Out of the air' }) + '</div><div class="bl-pval" data-r="valR"></div></div>' +
      '</div>' +
    '</div>' +
    '<div class="bl-ctl">' +
      '<div class="bl-side">' +
        '<span class="bl-sname" data-r="nameL"></span>' +
        '<div class="bl-cnt"><button class="gw-btn" data-r="cMinus">&#8722;</button><span class="bl-num" data-r="cNum"></span><button class="gw-btn" data-r="cPlus">+</button></div>' +
      '</div>' +
      '<div class="bl-side">' +
        '<span class="bl-sname" data-r="nameR"></span>' +
        '<div class="bl-cnt"><button class="gw-btn" data-r="bMinus">&#8722;</button><span class="bl-num" data-r="bNum"></span><button class="gw-btn" data-r="bPlus">+</button></div>' +
      '</div>' +
    '</div>' +
    '<div class="bl-net" data-r="net"></div>' +
    '<div class="gw-row">' +
      '<button class="gw-btn" data-r="check">' + L({ es:'Comprobar', en:'Check' }) + '</button>' +
      '<button class="gw-btn" data-r="next" style="display:none">' + L({ es:'Siguiente lugar', en:'Next place' }) + '</button>' +
    '</div>' +
    '<div class="gw-fb"></div>';

  var q = host.querySelector('[data-r="q"]'), beam = host.querySelector('[data-r="beam"]'),
      panL = host.querySelector('[data-r="panL"]'), panR = host.querySelector('[data-r="panR"]'),
      valL = host.querySelector('[data-r="valL"]'), valR = host.querySelector('[data-r="valR"]'),
      nameL = host.querySelector('[data-r="nameL"]'), nameR = host.querySelector('[data-r="nameR"]'),
      cNum = host.querySelector('[data-r="cNum"]'), bNum = host.querySelector('[data-r="bNum"]'),
      net = host.querySelector('[data-r="net"]'),
      cMin = host.querySelector('[data-r="cMinus"]'), cPls = host.querySelector('[data-r="cPlus"]'),
      bMin = host.querySelector('[data-r="bMinus"]'), bPls = host.querySelector('[data-r="bPlus"]'),
      bChk = host.querySelector('[data-r="check"]'), bNxt = host.querySelector('[data-r="next"]');

  function render(){
    var sc = rounds[round], d = data[round];
    var emis = c * d.pe, absor = b * d.pa, diff = emis - absor;
    q.textContent = L({
      es:'Lugar ' + (round + 1) + ' de 3: ' + L(sc.lugar),
      en:'Place ' + (round + 1) + ' of 3: ' + L(sc.lugar)
    });
    valL.textContent = emis;
    valR.textContent = absor;
    nameL.innerHTML = L({
      es:'Cada ' + L(sc.src) + ' manda ' + d.pe + ' toneladas al año',
      en:'Each ' + L(sc.src) + ' sends up ' + d.pe + ' tonnes a year'
    });
    nameR.innerHTML = L({
      es:'Cada ' + L(sc.abs) + ' retira ' + d.pa + ' toneladas al año',
      en:'Each ' + L(sc.abs) + ' takes out ' + d.pa + ' tonnes a year'
    });
    cNum.textContent = c;
    bNum.textContent = b;
    var ang = Math.max(-12, Math.min(12, diff * 1.4));
    beam.style.transform = 'translateX(-50%) rotate(' + (-ang) + 'deg)';
    panL.style.transform = 'rotate(' + ang + 'deg)';
    panR.style.transform = 'rotate(' + ang + 'deg)';
    panL.className = 'bl-pan l' + (diff > 0 ? ' heavy' : '');
    panR.className = 'bl-pan r' + (diff < 0 ? ' heavy' : '');
    if (diff > 0){
      net.innerHTML = L({
        es:'Con ' + c + ' ' + L(sc.srcs) + ' y ' + b + ' ' + L(sc.abss) + ' se quedan ' + diff + ' toneladas de carbono de más en el aire cada año.',
        en:'With ' + c + ' ' + L(sc.srcs) + ' and ' + b + ' ' + L(sc.abss) + ', ' + diff + ' extra tonnes of carbon stay in the air each year.'
      });
    } else if (diff < 0){
      net.innerHTML = L({
        es:'Con ' + c + ' ' + L(sc.srcs) + ' y ' + b + ' ' + L(sc.abss) + ' se retiran ' + (-diff) + ' toneladas más de las que se mandan al aire.',
        en:'With ' + c + ' ' + L(sc.srcs) + ' and ' + b + ' ' + L(sc.abss) + ', ' + (-diff) + ' tonnes more are taken out than are sent into the air.'
      });
    } else {
      net.innerHTML = L({
        es:'Con ' + c + ' ' + L(sc.srcs) + ' y ' + b + ' ' + L(sc.abss) + ' entra y sale la misma cantidad: el aire no gana ni pierde carbono.',
        en:'With ' + c + ' ' + L(sc.srcs) + ' and ' + b + ' ' + L(sc.abss) + ' the same amount goes in and out: the air neither gains nor loses carbon.'
      });
    }
    cMin.disabled = (c <= 0 || revealed || done);
    cPls.disabled = (c >= 12 || revealed || done);
    bMin.disabled = (b <= 0 || revealed || done);
    bPls.disabled = (b >= 12 || revealed || done);
    bChk.disabled = (revealed || done);
    bNxt.style.display = revealed ? 'inline-block' : 'none';
  }

  function step(which, delta){
    if (revealed || done) return;
    if (which === 'c') c = Math.max(0, Math.min(12, c + delta));
    else b = Math.max(0, Math.min(12, b + delta));
    render();
  }

  function newRound(){
    var d = data[round];
    c = d.c0; b = d.b0; tries = 0; revealed = false;
    render();
    say(host, '', L({
      es:'Prueba primero con un solo botón y observa hacia dónde se va la balanza antes de tocar el otro lado.',
      en:'Try one button first and watch which way the balance goes before touching the other side.'
    }));
  }

  cMin.addEventListener('click', function(){ step('c', -1); });
  cPls.addEventListener('click', function(){ step('c', 1); });
  bMin.addEventListener('click', function(){ step('b', -1); });
  bPls.addEventListener('click', function(){ step('b', 1); });

  bChk.addEventListener('click', function(){
    if (revealed || done) return;
    var sc = rounds[round], d = data[round];
    var emis = c * d.pe, absor = b * d.pa, diff = emis - absor;
    if (diff === 0 && emis > 0){
      revealed = true; render();
      say(host, 'good', L({
        es:'🎉 Balanza nivelada: ' + emis + ' toneladas entran al aire y ' + absor + ' salen del aire cada año. Mientras las dos cantidades se parezcan, la cantidad de carbono del aire se queda igual.',
        en:'🎉 The balance is level: ' + emis + ' tonnes go into the air and ' + absor + ' come out of it each year. While the two amounts match, the carbon in the air stays the same.'
      }));
      return;
    }
    if (diff === 0){
      say(host, 'warm', L({
        es:'Los dos lados están en cero. Sube al menos una fuente y una superficie verde para poder comparar.',
        en:'Both sides are at zero. Raise at least one source and one green area so there is something to compare.'
      }));
      return;
    }
    tries++;
    if (tries >= 3){
      revealed = true; c = d.cSol; b = d.bSol; render();
      say(host, 'miss', L({
        es:'Así queda nivelada: ' + d.cSol + ' ' + L(sc.srcs) + ' mandan ' + (d.cSol * d.pe) + ' toneladas y ' + d.bSol + ' ' + L(sc.abss) + ' retiran las mismas ' + (d.bSol * d.pa) + '. Hay dos maneras de nivelarla: mandar menos al aire o dejar más superficie que lo retire.',
        en:'This is how it levels off: ' + d.cSol + ' ' + L(sc.srcs) + ' send up ' + (d.cSol * d.pe) + ' tonnes and ' + d.bSol + ' ' + L(sc.abss) + ' take out the same ' + (d.bSol * d.pa) + '. There are two ways to level it: send less into the air or keep more area that takes it out.'
      }));
      return;
    }
    if (diff > 0){
      say(host, 'warm', L({
        es:'Todavía pesa más el lado del aire por ' + diff + ' toneladas. Quita alguna fuente o suma superficie verde y vuelve a comprobar.',
        en:'The air side still weighs ' + diff + ' tonnes more. Remove a source or add green area and check again.'
      }));
    } else {
      say(host, 'warm', L({
        es:'Ahora se retiran ' + (-diff) + ' toneladas de más. Baja un poco la superficie verde o suma una fuente y vuelve a comprobar.',
        en:'Now ' + (-diff) + ' tonnes too many are being taken out. Lower the green area a little or add a source and check again.'
      }));
    }
  });

  bNxt.addEventListener('click', function(){
    if (!revealed) return;
    if (round >= 2){
      done = true; revealed = false; render();
      say(host, 'good', L({
        es:'En los tres lugares el aire solo se queda igual cuando lo que entra y lo que sale se parecen. Quemar combustible sube un lado y cortar árboles baja el otro, y las dos cosas dejan carbono de más en el aire.',
        en:'In all three places the air only stays the same when what goes in and what comes out match. Burning fuel raises one side and cutting trees lowers the other, and both leave extra carbon in the air.'
      }));
      return;
    }
    round++; newRound();
  });

  newRound();
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 2 :: la manta de gases
   Una casa con sus prácticas de un año. El alumno toca las que va a cambiar y
   la manta de arriba adelgaza al momento, con los kilogramos que faltan para
   llegar a la meta escritos abajo. Dos casas distintas.
   ══════════════════════════════════════════════════════════════════════════ */
function wManta(rng, host){
  var HOUSES = [
    { casa:{ es:'la casa de la esquina', en:'the house on the corner' },
      items:[
        { es:'Ir en coche a todos lados, incluso a la tienda de la cuadra', en:'Driving everywhere, even to the shop on the block', kg:900 },
        { es:'Tirar a la basura la comida que sobra cada semana', en:'Throwing away the leftover food every week', kg:340 },
        { es:'Dejar luces y pantallas encendidas todo el día', en:'Leaving lights and screens on all day', kg:260 },
        { es:'Comprar fruta traída de muy lejos todo el año', en:'Buying fruit brought from far away all year round', kg:180 },
        { es:'Calentar agua de más y dejar correr la llave', en:'Heating extra water and leaving the tap running', kg:120 }
      ] },
    { casa:{ es:'la casa junto a la escuela', en:'the house next to the school' },
      items:[
        { es:'Llevar el coche solo, con un asiento ocupado, todos los días', en:'Taking the car alone, one seat used, every day', kg:820 },
        { es:'Mandar toda la basura orgánica al relleno sanitario', en:'Sending all the organic waste to the landfill', kg:400 },
        { es:'Cambiar de ropa y aparatos aunque los de casa sirvan', en:'Replacing clothes and devices while the ones at home still work', kg:300 },
        { es:'Usar el aire acondicionado con las ventanas abiertas', en:'Running the air conditioning with the windows open', kg:210 },
        { es:'Comprar bebidas en envase de un solo uso a diario', en:'Buying drinks in single use containers every day', kg:140 }
      ] }
  ];
  var rounds = shuffle(HOUSES, rng).slice(0, 2);
  var order = [], goals = [];
  for (var k = 0; k < rounds.length; k++){
    order.push(shuffle([0, 1, 2, 3, 4], rng));
    var tot = 0;
    for (var j = 0; j < rounds[k].items.length; j++) tot += rounds[k].items[j].kg;
    goals.push({ total:tot, meta:Math.round(tot * (rng() < 0.5 ? 0.55 : 0.6) / 10) * 10 });
  }
  var round = 0, sel = [], tries = 0, revealed = false, done = false;

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'La manta de gases', en:'The blanket of gases' }) + '</div>' +
    '<div class="gw-q" data-r="q"></div>' +
    '<div class="gw-mini">' + L({
      es:'Toca las prácticas que esta casa va a cambiar este año. La franja de arriba es la manta que retiene calor: adelgaza en cuanto tocas algo. Puedes tocar y destocar las veces que quieras hasta bajar de la meta.',
      en:'Tap the practices this house is going to change this year. The strip above is the blanket that holds heat in: it thins as soon as you tap something. You can tap and untap as often as you like until you get under the target.'
    }) + '</div>' +
    '<div class="mn-sky">' +
      '<div class="mn-blanket" data-r="blanket"></div>' +
      '<div class="mn-cap" data-r="cap"></div>' +
      '<div class="mn-bar"><div class="mn-fill" data-r="fill"></div></div>' +
      '<div class="mn-meta"><span data-r="now"></span><span data-r="goal"></span></div>' +
    '</div>' +
    '<div class="mn-grid" data-r="grid"></div>' +
    '<div class="gw-row">' +
      '<button class="gw-btn" data-r="check">' + L({ es:'Comprobar', en:'Check' }) + '</button>' +
      '<button class="gw-btn" data-r="next" style="display:none">' + L({ es:'Siguiente casa', en:'Next house' }) + '</button>' +
    '</div>' +
    '<div class="gw-fb"></div>';

  var q = host.querySelector('[data-r="q"]'), grid = host.querySelector('[data-r="grid"]'),
      blanket = host.querySelector('[data-r="blanket"]'), cap = host.querySelector('[data-r="cap"]'),
      fill = host.querySelector('[data-r="fill"]'), nowEl = host.querySelector('[data-r="now"]'),
      goalEl = host.querySelector('[data-r="goal"]'), bChk = host.querySelector('[data-r="check"]'),
      bNxt = host.querySelector('[data-r="next"]');

  function current(){
    var it = rounds[round].items, g = goals[round], out = g.total;
    for (var i = 0; i < it.length; i++) if (sel.indexOf(i) >= 0) out -= it[i].kg;
    return out;
  }

  function render(){
    var h = rounds[round], g = goals[round], it = h.items, now = current();
    q.textContent = L({
      es:'Casa ' + (round + 1) + ' de ' + rounds.length + ': ' + L(h.casa),
      en:'House ' + (round + 1) + ' of ' + rounds.length + ': ' + L(h.casa)
    });
    grid.innerHTML = order[round].map(function(i){
      var on = sel.indexOf(i) >= 0;
      return '<button class="mn-card' + (on ? ' on' : '') + '" data-i="' + i + '"><span>' + L(it[i]) + '</span>' +
             '<span class="mn-kg">' + it[i].kg + ' kg</span></button>';
    }).join('');
    grid.querySelectorAll('.mn-card').forEach(function(btn){
      btn.addEventListener('click', function(){
        if (revealed || done) return;
        var i = parseInt(btn.getAttribute('data-i'), 10);
        var at = sel.indexOf(i);
        if (at >= 0) sel.splice(at, 1); else sel.push(i);
        render();
        var v = current();
        if (v > g.meta){
          say(host, '', L({
            es:'La casa va en ' + v + ' kilogramos al año. Todavía te faltan ' + (v - g.meta) + ' para llegar a la meta.',
            en:'The house is at ' + v + ' kilograms a year. You are still ' + (v - g.meta) + ' above the target.'
          }));
        } else {
          say(host, '', L({
            es:'La casa va en ' + v + ' kilogramos al año, ' + (g.meta - v) + ' por debajo de la meta. La manta quedó más delgada.',
            en:'The house is at ' + v + ' kilograms a year, ' + (g.meta - v) + ' below the target. The blanket is thinner now.'
          }));
        }
      });
    });
    var frac = now / g.total;
    blanket.style.height = Math.round(8 + frac * 34) + 'px';
    fill.style.width = Math.round(frac * 100) + '%';
    fill.className = 'mn-fill' + (now > g.meta ? ' hot' : '');
    cap.textContent = L({
      es:'Mientras más gases suelta la casa, más gruesa queda la manta y más calor se queda abajo.',
      en:'The more gases the house releases, the thicker the blanket gets and the more heat stays below.'
    });
    nowEl.textContent = L({ es:'Ahora: ' + now + ' kg al año', en:'Now: ' + now + ' kg a year' });
    goalEl.textContent = L({ es:'Meta: ' + g.meta + ' kg al año', en:'Target: ' + g.meta + ' kg a year' });
    bChk.disabled = (revealed || done);
    bNxt.style.display = revealed ? 'inline-block' : 'none';
  }

  function bestSet(){
    var it = rounds[round].items, g = goals[round];
    var idx = it.map(function(_, i){ return i; }).sort(function(a, c){ return it[c].kg - it[a].kg; });
    var out = [], acc = g.total;
    for (var i = 0; i < idx.length && acc > g.meta; i++){ out.push(idx[i]); acc -= it[idx[i]].kg; }
    return out;
  }

  function newRound(){
    sel = []; tries = 0; revealed = false;
    render();
    say(host, '', L({
      es:'Fíjate en los kilogramos de cada práctica antes de elegir: no todas pesan lo mismo.',
      en:'Look at the kilograms of each practice before choosing: they do not all weigh the same.'
    }));
  }

  bChk.addEventListener('click', function(){
    if (revealed || done) return;
    var g = goals[round], now = current();
    if (now <= g.meta){
      revealed = true; render();
      say(host, 'good', L({
        es:'🎉 Lo lograste: la casa pasó de ' + g.total + ' a ' + now + ' kilogramos al año. Con menos gases en el aire la manta se queda más delgada y retiene menos calor.',
        en:'🎉 You did it: the house went from ' + g.total + ' to ' + now + ' kilograms a year. With fewer gases in the air the blanket stays thinner and holds less heat.'
      }));
      return;
    }
    tries++;
    if (tries >= 3){
      revealed = true; sel = bestSet(); render();
      say(host, 'miss', L({
        es:'Con estos cambios se llega: la casa queda en ' + current() + ' kilogramos al año. Empezar por las prácticas que más pesan hace la mayor parte del trabajo.',
        en:'These changes get there: the house ends at ' + current() + ' kilograms a year. Starting with the practices that weigh most does most of the work.'
      }));
      return;
    }
    say(host, 'warm', L({
      es:'Todavía estás ' + (now - g.meta) + ' kilogramos arriba de la meta. Revisa cuál de las prácticas que dejaste sin tocar es la que más pesa.',
      en:'You are still ' + (now - g.meta) + ' kilograms above the target. Look at which of the practices you left untouched weighs most.'
    }));
  });

  bNxt.addEventListener('click', function(){
    if (!revealed) return;
    if (round >= rounds.length - 1){
      done = true; revealed = false; render();
      say(host, 'good', L({
        es:'Las dos casas bajaron sin quedarse sin nada: lo que cambió fue el modo de moverse, de comer y de tirar. Ahí es donde una práctica de consumo se convierte en kilogramos de gases.',
        en:'Both houses came down without going without: what changed was how they travel, eat and throw things away. That is where a consumption habit turns into kilograms of gases.'
      }));
      return;
    }
    round++; newRound();
  });

  newRound();
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 3 :: el camino del nitrógeno
   Los pasos del ciclo llegan desordenados y el alumno los acomoda tocando dos
   para intercambiarlos. Al comprobar, el comentario le señala el primer paso
   que quedó fuera de lugar y le pregunta qué tuvo que pasar antes.
   ══════════════════════════════════════════════════════════════════════════ */
function wCiclo(rng, host){
  var STEPS = [
    { es:'Las bacterias del suelo y de las raíces rompen el nitrógeno del aire y lo dejan en una forma que la raíz sí puede tomar.',
      en:'Bacteria in the soil and in the roots break apart the nitrogen from the air and leave it in a form the root can take.' },
    { es:'La planta toma ese nitrógeno por la raíz y con él arma sus hojas, sus tallos y sus semillas.',
      en:'The plant takes that nitrogen in through its root and builds leaves, stems and seeds with it.' },
    { es:'El animal se come la planta y ese mismo nitrógeno pasa a formar parte de su cuerpo.',
      en:'The animal eats the plant and that same nitrogen becomes part of its body.' },
    { es:'Los restos y los desechos caen al suelo y los descomponedores sueltan otra vez el nitrógeno que traían.',
      en:'Remains and waste fall to the soil and decomposers release the nitrogen they carried.' },
    { es:'Otras bacterias del suelo devuelven parte de ese nitrógeno al aire y la vuelta queda cerrada.',
      en:'Other bacteria in the soil return part of that nitrogen to the air and the loop is closed.' }
  ];
  var st = { order:shuffle([0, 1, 2, 3, 4], rng), sel:null, tries:0, done:false };
  if (st.order.every(function(v, i){ return v === i; })){ var t0 = st.order[0]; st.order[0] = st.order[4]; st.order[4] = t0; }

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'El camino del nitrógeno', en:'The path of nitrogen' }) + '</div>' +
    '<div class="gw-q">' + L({ es:'Acomoda la vuelta completa, del primer paso al último', en:'Arrange the whole loop, from the first step to the last' }) + '</div>' +
    '<div class="gw-mini">' + L({
      es:'Toca un paso y luego otro para intercambiarlos de lugar. Pregúntate siempre qué tuvo que pasar antes para que el siguiente sea posible.',
      en:'Tap one step and then another to swap their places. Always ask what had to happen first for the next one to be possible.'
    }) + '</div>' +
    '<div class="nq-list" data-r="list"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="check">' + L({ es:'Comprobar', en:'Check' }) + '</button></div>' +
    '<div class="gw-fb"></div>';

  var list = host.querySelector('[data-r="list"]'), bChk = host.querySelector('[data-r="check"]');

  function render(){
    list.innerHTML = st.order.map(function(ei, pos){
      var cls = 'nq-chip' + (st.sel === pos ? ' sel' : '') + (st.done ? ' lock' : '');
      return '<div class="' + cls + '" data-pos="' + pos + '"><span class="nq-num">' + (pos + 1) + '</span><span>' + L(STEPS[ei]) + '</span></div>';
    }).join('');
    list.querySelectorAll('.nq-chip').forEach(function(ch){
      ch.addEventListener('click', function(){
        if (st.done) return;
        var pos = parseInt(ch.getAttribute('data-pos'), 10);
        if (st.sel === null){
          st.sel = pos; render();
          say(host, '', L({
            es:'Paso marcado. Ahora toca el lugar donde debería ir.',
            en:'Step marked. Now tap the place where it should go.'
          }));
        } else if (st.sel === pos){
          st.sel = null; render();
          say(host, '', L({ es:'Marca quitada.', en:'Mark removed.' }));
        } else {
          var a = st.order[st.sel];
          st.order[st.sel] = st.order[pos];
          st.order[pos] = a;
          st.sel = null; render();
          say(host, '', L({
            es:'Listo, quedaron intercambiados. Puedes seguir moviendo los que quieras.',
            en:'Done, they are swapped. You can keep moving whichever you like.'
          }));
        }
      });
    });
    bChk.disabled = st.done;
  }

  bChk.addEventListener('click', function(){
    if (st.done) return;
    var ok = st.order.every(function(ei, pos){ return ei === pos; });
    if (ok){
      st.done = true; render();
      say(host, 'good', L({
        es:'🎉 Ese es el camino: el nitrógeno del aire llega al suelo por las bacterias, sube a la planta, pasa al animal, vuelve al suelo con los restos y regresa al aire. Ninguna parte se puede saltar.',
        en:'🎉 That is the path: nitrogen from the air reaches the soil through bacteria, goes up into the plant, passes to the animal, comes back to the soil with the remains and returns to the air. No part can be skipped.'
      }));
      return;
    }
    st.tries++;
    if (st.tries >= 3){
      st.order = [0, 1, 2, 3, 4]; st.done = true; render();
      say(host, 'miss', L({
        es:'Este es el camino completo. Fíjate en que cada paso deja el nitrógeno en el sitio y en la forma que necesita el paso siguiente.',
        en:'This is the whole path. Notice how each step leaves the nitrogen in the place and in the form the next step needs.'
      }));
      return;
    }
    var bad = 0;
    for (var i = 0; i < st.order.length; i++){ if (st.order[i] !== i){ bad = i; break; } }
    say(host, 'warm', L({
      es:'Todavía no. Mira el paso número ' + (bad + 1) + ': pregúntate si el nitrógeno ya llegó a donde ese paso lo necesita, o si algo tenía que ocurrir antes.',
      en:'Not yet. Look at step number ' + (bad + 1) + ': ask whether the nitrogen has already reached where that step needs it, or whether something had to happen first.'
    }));
  });

  render();
  say(host, '', L({
    es:'Empieza por decidir cuál es el único paso que puede ir primero.',
    en:'Start by deciding which is the only step that can go first.'
  }));
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 4 :: la dosis de fertilizante
   Una barra deslizante mueve los kilogramos de nitrógeno por hectárea. La
   cosecha y lo que se va al arroyo responden al momento. La meta de cada
   ronda es la dosis más alta que la planta todavía aprovecha entera.
   ══════════════════════════════════════════════════════════════════════════ */
function wDosis(rng, host){
  var SCENES = [
    { cultivo:{ es:'el maizal', en:'the maize field' }, agua:{ es:'el arroyo', en:'the stream' } },
    { cultivo:{ es:'la parcela de trigo', en:'the wheat plot' }, agua:{ es:'la laguna', en:'the lagoon' } },
    { cultivo:{ es:'el huerto de jitomate', en:'the tomato plot' }, agua:{ es:'el canal de riego', en:'the irrigation canal' } }
  ];
  var rounds = shuffle(SCENES, rng).slice(0, 3);
  var knees = [];
  for (var k = 0; k < 3; k++) knees.push(ri(rng, 6, 13) * 10);
  var round = 0, dose = 0, tries = 0, revealed = false, done = false;

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'La dosis de fertilizante', en:'The fertiliser dose' }) + '</div>' +
    '<div class="gw-q" data-r="q"></div>' +
    '<div class="gw-mini">' + L({
      es:'Mueve la barra y observa las dos consecuencias al mismo tiempo. Busca la dosis más alta que la planta todavía aprovecha entera, sin mandar nada al agua, y comprueba.',
      en:'Move the slider and watch both consequences at the same time. Look for the highest dose the plant still uses up completely, without sending anything to the water, and then check.'
    }) + '</div>' +
    '<div class="ds-row">' +
      '<div class="ds-head"><span>' + L({ es:'Nitrógeno aplicado por hectárea', en:'Nitrogen applied per hectare' }) + '</span><span class="ds-val" data-r="val"></span></div>' +
      '<input type="range" min="0" max="200" step="10" value="0" data-r="slider">' +
    '</div>' +
    '<div class="ds-out">' +
      '<div class="ds-box"><div class="ds-lbl" data-r="lbA"></div><div class="ds-num" data-r="numA"></div><div class="ds-bar"><div class="ds-fill" data-r="fillA"></div></div></div>' +
      '<div class="ds-box"><div class="ds-lbl" data-r="lbB"></div><div class="ds-num" data-r="numB"></div><div class="ds-bar"><div class="ds-fill" data-r="fillB"></div></div></div>' +
    '</div>' +
    '<div class="ds-live" data-r="live"></div>' +
    '<div class="gw-row">' +
      '<button class="gw-btn" data-r="check">' + L({ es:'Comprobar', en:'Check' }) + '</button>' +
      '<button class="gw-btn" data-r="next" style="display:none">' + L({ es:'Siguiente parcela', en:'Next plot' }) + '</button>' +
    '</div>' +
    '<div class="gw-fb"></div>';

  var q = host.querySelector('[data-r="q"]'), sld = host.querySelector('[data-r="slider"]'),
      val = host.querySelector('[data-r="val"]'), lbA = host.querySelector('[data-r="lbA"]'),
      numA = host.querySelector('[data-r="numA"]'), fillA = host.querySelector('[data-r="fillA"]'),
      lbB = host.querySelector('[data-r="lbB"]'), numB = host.querySelector('[data-r="numB"]'),
      fillB = host.querySelector('[data-r="fillB"]'), live = host.querySelector('[data-r="live"]'),
      bChk = host.querySelector('[data-r="check"]'), bNxt = host.querySelector('[data-r="next"]');

  function render(){
    var sc = rounds[round], knee = knees[round];
    var cosecha = Math.round(Math.min(dose, knee) / knee * 100);
    var fuga = Math.max(0, dose - knee);
    q.textContent = L({
      es:'Parcela ' + (round + 1) + ' de 3: ' + L(sc.cultivo),
      en:'Plot ' + (round + 1) + ' of 3: ' + L(sc.cultivo)
    });
    val.textContent = dose + ' kg';
    sld.value = String(dose);
    sld.disabled = (revealed || done);
    lbA.textContent = L({ es:'Cosecha', en:'Harvest' });
    numA.textContent = cosecha + ' %';
    fillA.style.width = cosecha + '%';
    fillA.className = 'ds-fill';
    lbB.textContent = L({ es:'Nitrógeno que llega a ' + L(sc.agua), en:'Nitrogen reaching ' + L(sc.agua) });
    numB.textContent = fuga + ' kg';
    fillB.style.width = Math.min(100, Math.round(fuga / 80 * 100)) + '%';
    fillB.className = 'ds-fill' + (fuga > 40 ? ' bad' : (fuga > 0 ? ' warn' : ''));
    if (dose === 0){
      live.textContent = L({
        es:'Sin nada de nitrógeno la planta se queda amarilla y pequeña, y el agua sigue limpia.',
        en:'With no nitrogen at all the plant stays yellow and small, and the water stays clean.'
      });
    } else if (dose < knee){
      live.textContent = L({
        es:'La planta aprovecha todo lo que le pones y la cosecha va en ' + cosecha + ' por ciento. Si subes un poco más, sube la cosecha y el agua sigue limpia.',
        en:'The plant uses everything you give it and the harvest is at ' + cosecha + ' per cent. If you go a little higher, the harvest rises and the water stays clean.'
      });
    } else if (dose === knee){
      live.textContent = L({
        es:'La cosecha llegó a su máximo y nada se está yendo al agua.',
        en:'The harvest has reached its maximum and nothing is going into the water.'
      });
    } else {
      live.textContent = L({
        es:'La cosecha ya no sube, pero ahora se van ' + fuga + ' kilogramos a ' + L(sc.agua) + ' con la lluvia y el riego.',
        en:'The harvest no longer rises, but now ' + fuga + ' kilograms go into ' + L(sc.agua) + ' with the rain and the watering.'
      });
    }
    bChk.disabled = (revealed || done);
    bNxt.style.display = revealed ? 'inline-block' : 'none';
  }

  function newRound(){
    dose = 0; tries = 0; revealed = false;
    render();
    say(host, '', L({
      es:'Sube de poco en poco y detente en cuanto la cosecha deje de responder.',
      en:'Go up bit by bit and stop as soon as the harvest stops responding.'
    }));
  }

  sld.addEventListener('input', function(){
    if (revealed || done) return;
    dose = parseInt(sld.value, 10);
    render();
  });

  bChk.addEventListener('click', function(){
    if (revealed || done) return;
    var sc = rounds[round], knee = knees[round];
    if (dose === knee){
      revealed = true; render();
      say(host, 'good', L({
        es:'🎉 Esa es la dosis: ' + knee + ' kilogramos por hectárea dan la cosecha completa y no dejan nitrógeno suelto. Cada kilogramo de más ya no alimenta a la planta, se va a ' + L(sc.agua) + '.',
        en:'🎉 That is the dose: ' + knee + ' kilograms per hectare give the full harvest and leave no loose nitrogen. Every extra kilogram no longer feeds the plant, it goes into ' + L(sc.agua) + '.'
      }));
      return;
    }
    tries++;
    if (tries >= 3){
      revealed = true; dose = knee; render();
      say(host, 'miss', L({
        es:'La dosis justa era ' + knee + ' kilogramos por hectárea: es el punto donde la cosecha deja de subir. Antes de ahí falta alimento; después de ahí solo sobra nitrógeno para el agua.',
        en:'The right dose was ' + knee + ' kilograms per hectare: it is the point where the harvest stops rising. Before it there is not enough food; after it there is only spare nitrogen for the water.'
      }));
      return;
    }
    if (dose < knee){
      say(host, 'warm', L({
        es:'Todavía puedes subir: la cosecha va en ' + Math.round(dose / knee * 100) + ' por ciento y el agua sigue limpia.',
        en:'You can still go up: the harvest is at ' + Math.round(dose / knee * 100) + ' per cent and the water is still clean.'
      }));
    } else {
      say(host, 'warm', L({
        es:'Te pasaste: la cosecha ya está al máximo y ' + (dose - knee) + ' kilogramos se están yendo al agua. Baja la barra y vuelve a comprobar.',
        en:'You have gone too far: the harvest is already at its maximum and ' + (dose - knee) + ' kilograms are going into the water. Lower the slider and check again.'
      }));
    }
  });

  bNxt.addEventListener('click', function(){
    if (!revealed) return;
    if (round >= 2){
      done = true; revealed = false; render();
      say(host, 'good', L({
        es:'En las tres parcelas la cosecha tiene un techo y el nitrógeno de más no desaparece: termina en el agua, donde alimenta a las algas en vez de al cultivo.',
        en:'In all three plots the harvest has a ceiling and the extra nitrogen does not disappear: it ends up in the water, where it feeds the algae instead of the crop.'
      }));
      return;
    }
    round++; newRound();
  });

  newRound();
}

function addProblem(rng, v){
  var idx = problems.length;
  var opts = L(v.opts).slice();
  var correctVal = opts[v.ci];
  var sh = shuffle(opts, rng);
  var prob = {
    title: L(v.title),
    questionText: L(v.q),
    fn: '',
    hint: L(v.hint),
    explanation: L(v.exp),
    options: sh,
    correctIdx: sh.indexOf(correctVal),
    showWork: !!v.showWork,
    studentChoice: null,
    pendingChoice: null
  };
  problems.push(prob);
  buildOneCard(prob, idx);
}

function buildLesson(rng){
  injectGuideCSS();

  /* ── Apertura ── */

    '<p>' + L({
      es:'El carbono que hoy está en tu mano estuvo antes en el aire, y antes en una hoja, y antes en el aire otra vez. Lo mismo pasa con el nitrógeno de tus músculos: salió del aire, pasó por unas bacterias, subió por la raíz de una planta y llegó a tu plato. Ninguno de esos materiales se fabrica ni se destruye, solo cambia de sitio, una y otra vez.',
      en:'The carbon in your hand today was in the air before, and in a leaf before that, and in the air again before that. The same goes for the nitrogen in your muscles: it came out of the air, went through some bacteria, rose through the root of a plant and reached your plate. None of those materials is made or destroyed, it only changes place, over and over.'
