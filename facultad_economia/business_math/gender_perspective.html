      '<h2>La misma nómina contiene dos brechas</h2>' +
      '<p>Cuando una empresa audita sus sueldos suele encontrarse con dos resultados que parecen contradictorios y no lo son. El primero es que dentro de cada puesto se paga prácticamente lo mismo a hombres y mujeres. El segundo es que el promedio de la empresa muestra una brecha grande. La reacción habitual es sospechar de la aritmética, y la aritmética está bien. Lo que ocurre es que los dos resultados miden cosas distintas, y separarlas es la tarea central del análisis de datos con perspectiva de género.</p>' +
      '<p>La brecha que una empresa reporta es una comparación de dos promedios, y un promedio depende de dos cosas: de cuánto paga cada puesto y de cuánta gente hay en cada puesto. Si las mujeres están concentradas en los niveles que pagan menos, su promedio será menor aunque en cada nivel cobren exactamente igual. A esa parte la llamamos <strong>brecha de estructura</strong>, y no habla de sueldos: habla de puestos. La parte que queda cuando se compara a personas del mismo nivel es la <strong>brecha del mismo puesto</strong>, y esa sí habla de sueldos.</p>' +
      '<p>Hay un detalle técnico que conviene no pasar por alto porque cambia los números de un informe. Las dos brechas no se suman. Si dentro del nivel se paga un cinco por ciento menos y además la estructura aporta otro diez por ciento, la brecha total no es quince por ciento sino un poco menos, porque la segunda se aplica sobre lo que la primera ya redujo. Se combinan como se combinan dos descuentos sucesivos, y por eso quien reparte una brecha reportada sumando sus partes siempre se pasa. Para brechas chicas la diferencia es de décimas y para brechas grandes es de puntos enteros.</p>' +
      '<p>Que las dos partes se puedan separar tiene una consecuencia práctica que va más allá del reporte, porque cada una se corrige con una palanca distinta y en un plazo distinto. La del mismo puesto se cierra con una revisión de tabulador: se identifica, se cuesta y se paga, y el efecto aparece en la siguiente nómina. La de estructura no se cierra con dinero, porque no hay nadie mal pagado en ella; se cierra revisando quién es considerado para las vacantes de arriba, y su efecto tarda años en llegar al promedio. Una empresa que solo mide la primera puede anunciar equidad salarial con toda honestidad y seguir teniendo una brecha grande el año siguiente.</p>' +

      '</div>' +

      '<div class="stag">Concept 2</div>' +
      '<h2>One payroll contains two gaps</h2>' +
      '<p>When a company audits its salaries it usually meets two results that look contradictory and are not. The first is that within each post women and men are paid practically the same. The second is that the company average shows a large gap. The usual reaction is to suspect the arithmetic, and the arithmetic is fine. What is happening is that the two results measure different things, and separating them is the central task of data analysis with a gender perspective.</p>' +
      '<p>The gap a company reports is a comparison of two averages, and an average depends on two things: how much each post pays and how many people sit in each post. If women are concentrated in the levels that pay less, their average will be lower even where every level pays them exactly the same. That part is the <strong>structural gap</strong>, and it does not speak about pay: it speaks about posts. What remains once people of the same level are compared is the <strong>same post gap</strong>, and that one does speak about pay.</p>' +
      '<p>There is a technical detail worth not skipping, because it changes the numbers in a report. The two gaps do not add. If within the level five percent less is paid and the structure contributes another ten percent, the total gap is not fifteen percent but slightly less, because the second applies to what the first has already reduced. They combine the way two successive discounts combine, which is why anyone splitting a reported gap by adding its parts always overshoots. For small gaps the difference is tenths and for large ones it is whole points.</p>' +

      '<h2>Una desventaja pequeña, repetida muchas veces</h2>' +
      '<p>Las dos secciones anteriores dejaron una pregunta abierta. Si buena parte de la brecha salarial de una empresa viene de cómo están repartidos los puestos, entonces hay que entender cómo se produce ese reparto, y ahí la fotografía del organigrama es un dato engañoso. Ver que la dirección de una empresa es mayoritariamente masculina no dice si en cada promoción hubo un trato desigual grande, pequeño o ninguno. Para saberlo hay que mirar el proceso que llevó hasta ahí, y ese proceso es una sucesión de decisiones parecidas.</p>' +
      '<p>El modelo más simple que captura lo esencial es este. Una generación entra a la empresa con cierta proporción de mujeres. En cada ronda de promociones, la probabilidad de que una mujer sea promovida es una fracción de la probabilidad de que lo sea un hombre; llamemos <strong>tasa relativa</strong> a esa fracción. Si vale uno, el proceso es neutro y la proporción se sostiene nivel por nivel. Si vale menos que uno, la proporción de mujeres respecto de hombres se multiplica por esa misma fracción en cada paso. Lo importante es la palabra multiplica: la desventaja no se resta una vez, se aplica una vez por nivel.</p>' +
      '<p>De ahí sale el resultado que hace útil este modelo. Una tasa relativa que a nadie le parecería alarmante, revisada de una en una, produce al cabo de cuatro o cinco niveles una diferencia que a todos les parece inexplicable. La caída es más rápida al principio y se va aplanando, porque cuando quedan muy pocas mujeres arriba ya no hay mucho más que perder. Y funciona en sentido contrario con la misma fuerza: una tasa relativa por encima de uno sostenida durante varios ciclos mueve la proporción de arriba mucho más de lo que sugiere el tamaño del ajuste.</p>' +
      '<p>Este modelo aísla un mecanismo, y conviene ser preciso sobre lo que sí y lo que no permite afirmar. Lo que muestra es aritmética: una desventaja repetida se acumula de forma multiplicativa, así que una empresa puede terminar con muy pocas mujeres en la dirección sin que ninguna decisión individual haya sido llamativa, y la proporción final no sirve para medir qué tan desigual fue cada paso. Lo que no muestra es la causa. Una tasa relativa menor que uno puede venir de criterios que premian la disponibilidad continua, de trayectorias interrumpidas por el trabajo de cuidados, de una rotación distinta entre grupos o de decisiones concretas de quienes promueven. El dato dice dónde mirar, no por qué ocurre; separar esas dos afirmaciones es lo que distingue un análisis serio de un alegato.</p>' +

      '<p><strong>Ejemplo resuelto.</strong> Una empresa de servicios financieros en Colima contrata cada año una generación de analistas donde ' + pct1(c3s0) + ' son mujeres, prácticamente la mitad. La empresa tiene cuatro niveles por encima del de entrada y la dirección está formada por ' + intN(c3posts) + ' puestos. El área de talento midió las tasas de promoción de los últimos ciclos y encontró que las mujeres son promovidas a ' + dec2(c3rel) + ' veces la tasa de los hombres, una diferencia que ningún comité consideró significativa cuando se revisó ronda por ronda.</p>' +

      '<div class="stag">Concept 3</div>' +
      '<h2>A small disadvantage, repeated many times</h2>' +
      '<p>The two previous sections left a question open. If much of the pay gap of a company comes from how the posts are shared out, then how that sharing out is produced has to be understood, and there the photograph of the organisation chart is a misleading figure. Seeing that the senior level of a company is mostly male does not say whether each promotion involved unequal treatment that was large, small or absent. Knowing that means looking at the process that led there, and that process is a succession of similar decisions.</p>' +
      '<p>The simplest model that captures what matters is this one. An intake joins the company with a certain share of women. In every promotion round, the chance that a woman is promoted is a fraction of the chance that a man is; call that fraction the <strong>relative rate</strong>. If it equals one, the process is neutral and the share holds level by level. If it is below one, the number of women per man is multiplied by that same fraction at every step. The important word is multiplied: the disadvantage is not subtracted once, it is applied once per level.</p>' +

      '<div class="stag">Concepto 4</div>' +
      '<h2>Cuándo una diferencia es una diferencia</h2>' +
      '<p>Los tres conceptos anteriores trabajan con datos que la empresa tiene completos: la nómina entera, el organigrama entero. Buena parte del análisis con perspectiva de género, sin embargo, se hace con encuestas, y una encuesta no observa a toda la plantilla sino a una parte. Eso cambia la naturaleza de lo que se puede afirmar. Si en una muestra el sesenta por ciento de los hombres y el cincuenta y cuatro de las mujeres dicen que los criterios de promoción son claros, la pregunta seria no es qué significan esos seis puntos, sino si esos seis puntos habrían aparecido otra vez con otra muestra.</p>' +
      '<p>La razón es que un porcentaje medido en una muestra es una estimación y trae consigo un margen. Ese margen tiene dos propiedades que conviene tener presentes. La primera es que depende del tamaño de la muestra a través de una raíz, así que reducirlo a la mitad exige cuadruplicar el número de encuestas, y por eso las encuestas de personal se vuelven caras justo cuando se les pide precisión. La segunda es que casi no depende del tamaño de la plantilla: una muestra de mil personas mide con parecida precisión a una empresa de cinco mil que a una de cincuenta mil, un hecho que sorprende a casi todos los que aprueban el presupuesto.</p>' +
      '<p>La pieza que hay que añadir aquí es que <strong>la diferencia entre dos porcentajes es más incierta que cada uno por separado</strong>. Ambos se estiman con error y los dos errores entran en la cuenta, de modo que el margen de la diferencia es mayor que el de cualquiera de las dos cifras. De ahí sale un criterio de lectura muy útil en la práctica: si el intervalo de la diferencia contiene al cero, la encuesta no permite afirmar que los dos grupos respondan distinto. No demuestra que respondan igual, que es una afirmación distinta y más fuerte; simplemente no alcanza para distinguirlos.</p>' +
      '<p>Conviene cerrar con la advertencia que más informes arruina, porque no es de aritmética. Todo este cálculo supone que quien respondió es representativo de la plantilla. En encuestas de clima laboral esa suposición suele ser más frágil que el margen mismo: las personas más incómodas con el tema responden en distinta proporción que las demás, y ningún tamaño de muestra corrige eso. Una encuesta con treinta por ciento de respuesta y un margen de dos puntos es más engañosa que una con margen de cinco puntos y participación completa, porque el margen mide solo el error de haber preguntado a unos y no a otros al azar, no el error de que hayan contestado unos y no otros por decisión propia.</p>' +

      '<div class="stag">Concept 4</div>' +
      '<h2>When a difference is really a difference</h2>' +
      '<p>The three previous concepts work with data the company holds in full: the whole payroll, the whole organisation chart. A good part of analysis with a gender perspective, however, is done with surveys, and a survey does not observe the whole staff but a part of it. That changes the nature of what can be claimed. If in a sample sixty percent of the men and fifty four percent of the women say the promotion criteria are clear, the serious question is not what those six points mean, but whether those six points would have appeared again with a different sample.</p>' +
      '<p>The reason is that a percentage measured in a sample is an estimate and carries a margin. That margin has two properties worth keeping in mind. The first is that it depends on the size of the sample through a root, so halving it means quadrupling the number of responses, which is why staff surveys get expensive exactly when precision is asked of them. The second is that it barely depends on the size of the staff: a sample of one thousand people measures a company of five thousand about as precisely as one of fifty thousand, a fact that surprises almost everyone who approves the budget.</p>' +
      '<p>The piece to add here is that <strong>the difference between two percentages is more uncertain than either one alone</strong>. Both are estimated with error and both errors enter the account, so the margin of the difference is larger than the margin of either figure. Out of that comes a reading rule that is very useful in practice: if the range of the difference contains zero, the survey does not allow anyone to claim that the two groups answer differently. It does not prove they answer the same, which is a different and stronger claim; it simply does not reach far enough to tell them apart.</p>' +
      '<p>It is worth closing with the warning that ruins the most reports, because it is not about arithmetic. All of this calculation assumes that whoever answered is representative of the staff. In workplace surveys that assumption is usually more fragile than the margin itself: the people most uncomfortable with the subject answer in a different proportion from everyone else, and no sample size corrects that. A survey with thirty percent response and a margin of two points is more misleading than one with a margin of five points and full participation, because the margin measures only the error of having asked some people and not others at random, not the error of some people having answered and others not by their own choice.</p>' +

    q: { es: 'Una comercializadora de Villa de Álvarez hizo una encuesta piloto sobre percepción de equidad y obtuvo que responde que sí el ' + pct0(p10pm) + ' de los hombres y el ' + pct0(p10pw) + ' de las mujeres. La dirección quiere repetirla en firme el año próximo con muestras del mismo tamaño en cada grupo, y le pide al área de análisis un margen de error de la diferencia de a lo más ' + ptsEs(p10e) + ' al 95 por ciento de confianza. Tomando los porcentajes del piloto como referencia para la planeación, ¿cuántas personas hay que encuestar?',
        en: 'A distribution company in Villa de Álvarez ran a pilot survey on perceptions of equity and found that ' + pct0(p10pm) + ' of the men and ' + pct0(p10pw) + ' of the women answer yes. Management wants to run it for real next year with samples of the same size in each group, and asks the analysis team for a margin of error on the difference of at most ' + ptsEn(p10e) + ' at 95 percent confidence. Taking the pilot percentages as the reference for planning, how many people have to be surveyed?' },
    opts: { es: o10.es, en: o10.en },
    hint: { es: 'Este es el cálculo del margen de error hecho al revés: en lugar de partir del tamaño de la muestra para obtener el margen, se parte del margen deseado para obtener el tamaño. Recuerda que en la diferencia entran las incertidumbres de los dos grupos y que el margen crece con el factor de confianza, de modo que ese factor aparece al cuadrado cuando se despeja el tamaño.',
            en: 'This is the margin of error calculation run backwards: instead of starting from the size of the sample to obtain the margin, it starts from the desired margin to obtain the size. Remember that the uncertainties of both groups enter the difference and that the margin grows with the confidence factor, so that factor appears squared once the size is isolated.' },
    exp: { es: 'Con los porcentajes del piloto, alcanzar un margen de ' + ptsEs(p10e) + ' al 95 por ciento de confianza requiere ' + peopleEs(s10n) + '. La opción de ' + peopleEs(s10n90) + ' usa el factor del 90 por ciento de confianza en lugar del que pidió la dirección, y produce una encuesta que se queda corta justo en el nivel de exigencia acordado. La de ' + peopleEs(s10one) + ' toma en cuenta la incertidumbre de un solo grupo, con lo que subestima el tamaño necesario alrededor de la mitad y llevaría a repetir el piloto con el mismo problema. Y la de ' + peopleEs(2 * s10n) + ' duplica el resultado correcto por contar los dos grupos, cuando la cifra calculada ya es por grupo: encuestar de más no invalida el estudio, pero cuesta el doble sin ganar precisión sobre lo pedido. Conviene añadir dos observaciones al oficio: como el margen baja con la raíz del tamaño, exigir la mitad de margen habría multiplicado por cuatro esta cifra, y ningún tamaño de muestra corrige que respondan en distinta proporción unos grupos que otros.',
           en: 'With the pilot percentages, reaching a margin of ' + ptsEn(p10e) + ' at 95 percent confidence requires ' + peopleEn(s10n) + '. The option of ' + peopleEn(s10n90) + ' uses the factor for 90 percent confidence instead of the one management asked for, and produces a survey that falls short at exactly the standard agreed. The one of ' + peopleEn(s10one) + ' takes in the uncertainty of a single group, which understates the size needed by about half and would repeat the pilot with the same problem. And the one of ' + peopleEn(2 * s10n) + ' doubles the correct result by counting the two groups, when the figure computed is already per group: surveying more does not invalidate the study, but it costs twice as much without gaining precision beyond what was asked. Two remarks belong in the memo: since the margin falls with the root of the size, asking for half the margin would have multiplied this figure by four, and no sample size corrects for some groups answering in a different proportion from others.' }
  };
  var d10 = mk(q10i, o10.correctIdx, true);
  problems.push({ i18n: d10.i18n, title: d10.title, questionText: d10.questionText, options: d10.options, correctIdx: d10.correctIdx, explanation: d10.explanation, hint: d10.hint, showWork: true, studentChoice: null, pendingChoice: null });
  buildOneCard(problems[problems.length - 1], problems.length - 1);
}

function applyUIStrings() {
  var set = function(id, txt) { var e = document.getElementById(id); if (e) e.textContent = txt; };
  var ph  = function(id, txt) { var e = document.getElementById(id); if (e) e.placeholder = txt; };
  set('wtitle-el',    SCHOOL.guideTitle[LANG]);
  set('wcourse-el',   SCHOOL.courseName[LANG]);
  set('htitle-el',    SCHOOL.guideTitle[LANG]);
  set('lbl-name-el',  t('lbl-name'));
  set('lbl-group-el', t('lbl-group'));
  set('startBtn',     t('btn-start'));
  set('restoreTitle', t('restore-title'));
  set('restoreMsg',   t('restore-msg'));
  set('restoreBtn',   t('btn-restore'));
  set('dismissBtn',   t('btn-dismiss'));
  set('dlBtn',        t('btn-pdf'));
  ph('sName',  t('ph-name'));
  ph('sGroup', t('ph-group'));
  var ll = document.getElementById('logo-left');   if (ll) ll.alt = SCHOOL.logoLeftAlt;
  var lr = document.getElementById('logo-right');  if (lr) lr.alt = SCHOOL.logoRightAlt;
}
/* Rebuilds the visible text of every card without touching the numbers. */
function applyProblemLang() {
  problems.forEach(function(p, i) {
    var card = document.getElementById('pc' + i);
    if (!card || !p.i18n) return;
    p.title        = p.i18n.title[LANG];
    p.questionText = p.i18n.q[LANG];
    p.hint         = p.i18n.hint[LANG];
    p.explanation  = p.i18n.exp[LANG];
    p.options      = p.i18n.opts[LANG].slice();
    var ti = card.querySelector('.ptitle'); if (ti) ti.textContent = p.title;
    var st = card.querySelector('.pstmt');  if (st) st.innerHTML = p.questionText;
    var hb = card.querySelector('.hintbox'); if (hb) hb.innerHTML = p.hint;
    var hbtn = card.querySelector('.hintbtn'); if (hbtn) hbtn.textContent = t('btn-hint');
    card.querySelectorAll('.mcopt').forEach(function(o, oi) {
      if (p.options[oi] !== undefined) o.innerHTML = p.options[oi];
    });
    var tabs = card.querySelectorAll('.wtab');
    if (tabs.length === 3) {
      tabs[0].textContent = t('tab-draw');
      tabs[1].textContent = t('tab-type');
      tabs[2].textContent = t('tab-photo');
    }
    var tools = card.querySelectorAll('.tbtn2');
    if (tools.length === 3) {
      tools[0].textContent = t('tool-pen');
      tools[1].textContent = t('tool-mark');
      tools[2].textContent = t('tool-erase');
    }
    var clr = card.querySelector('.clrbtn'); if (clr) clr.textContent = t('tool-clear');
    var ta  = card.querySelector('.wtextarea'); if (ta) ta.placeholder = t('ph-work');
    var pzt = card.querySelector('.pztxt'); if (pzt) pzt.textContent = t('ph-photo');
    var lab = card.querySelector('.pbody > div:last-child > div:first-child');
    if (lab) lab.textContent = t('lbl-answer');
    var fb = card.querySelector('.mcfb');
    if (fb && fb.classList.contains('show')) {
      var isOk = (p.studentChoice === p.correctIdx);
      fb.innerHTML = '<strong>' + (isOk ? t('fb-correct') : t('fb-wrong')) + '</strong> ' + p.explanation;
    }
  });
}
function setLang(l) {
  LANG = l;
  try { localStorage.setItem(LANG_KEY, l); } catch(e) {}
  document.documentElement.setAttribute('lang', l);
  var be = document.getElementById('btn-es'), bn = document.getElementById('btn-en');
  if (be) be.classList.toggle('active', l === 'es');
  if (bn) bn.classList.toggle('active', l === 'en');
  applyUIStrings();
  applySectionLang();
  applyProblemLang();
  widgets.forEach(function(f) { try { f(); } catch(e) {} });
  document.querySelectorAll('#lessonBody .section').forEach(function(s) { s.classList.add('vis'); });
}
(function() {
  try { var stored = localStorage.getItem(LANG_KEY); if (stored === 'es' || stored === 'en') LANG = stored; } catch(e) {}
  document.addEventListener('DOMContentLoaded', function() {
    document.documentElement.setAttribute('lang', LANG);
    var be = document.getElementById('btn-es'), bn = document.getElementById('btn-en');
    if (be) be.classList.toggle('active', LANG === 'es');
    if (bn) bn.classList.toggle('active', LANG === 'en');
    applyUIStrings();
  });
})();

/* ════════════════════════════════════════════════════════════════════════
   PDF
   ════════════════════════════════════════════════════════════════════════ */
async function generatePDF() {
  var btn = document.getElementById('dlBtn');
  btn.textContent = t('pdf-busy');
  btn.disabled = true;

  var jspdf   = window.jspdf;
  var doc     = new jspdf.jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });
  var PW      = 215.9;
  var M       = 18;
  var TW      = PW - M * 2;
  var PH      = doc.internal.pageSize.height;
  var name    = studentData.name;
  var group   = studentData.group;
  var total   = problems.length;
  var pct     = Math.round(correctCount / total * 100);
  var dateStr = new Date().toLocaleString(LANG === 'es' ? 'es-MX' : 'en-US', { dateStyle:'long', timeStyle:'short' });

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;

  function pdfText(html) {
    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/→/g,'->').replace(/−/g,'-').replace(/²/g,'^2')
      .replace(/³/g,'^3').replace(/×/g,'x').replace(/÷/g,'/')
      .replace(/≠/g,'!=').replace(/≤/g,'<=').replace(/≥/g,'>=')
      .replace(/√/g,'sqrt').replace(/π/g,'pi').replace(/…/g,'...')
      .replace(/μ/g,'mu').replace(/σ/g,'sigma').replace(/α/g,'alpha').replace(/β/g,'beta')
      .replace(/₀/g,'0').replace(/₁/g,'1').replace(/₂/g,'2').replace(/·/g,'*')
      .replace(/\s+/g,' ').trim();
  }

  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,2,'F');
  doc.setFillColor(255,255,255); doc.rect(0,2,PW,26,'F');
  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,28,PW,2,'F');
  doc.setFillColor(pBR,pBG,pBB); doc.rect(0,30,PW,34,'F');

  var fmtL = SCHOOL.logoLeftB64.indexOf('/9j/') > -1 ? 'JPEG' : 'PNG';
  var fmtR = SCHOOL.logoRightB64.indexOf('/9j/') > -1 ? 'JPEG' : 'PNG';
  try { doc.addImage(SCHOOL.logoLeftB64,  fmtL, M,  4.0, 22, 22); } catch(e) {}
  try { doc.addImage(SCHOOL.logoRightB64, fmtR, 48, 4.5, 48, 21); } catch(e) {}

  var lx = PW - M - 36;
  var ly = 10;
  doc.setDrawColor(pBR,pBG,pBB); doc.setLineWidth(0.7);
  doc.lines([[2.57-1.03,4.63-6.17],[4.11-2.57,5.14-4.63],[5.66-4.11,2.57-5.14]], lx+1.03, ly+6.17);
  doc.setFillColor(pAR,pAG,pAB); doc.circle(lx+5.66, ly+2.57, 0.9, 'F');
  doc.setDrawColor(pAR,pAG,pAB); doc.setLineWidth(0.7);
  doc.line(lx+8.23, ly+1.54, lx+8.23, ly+7.2);
  doc.setTextColor(pBR,pBG,pBB); doc.setFontSize(11); doc.setFont('helvetica','bold');
  doc.text('LIAXA', lx+10, ly+6.8);

  doc.setTextColor(240,244,238); doc.setFontSize(13); doc.setFont('helvetica','bold');
  doc.text(SCHOOL.guideTitle[LANG], M, 49);
  doc.setTextColor(198,214,192); doc.setFontSize(8); doc.setFont('helvetica','normal');
  doc.text(dateStr, M, 59);

  doc.setFillColor(237,240,245); doc.roundedRect(M,72,TW,20,3,3,'F');
  doc.setTextColor(130,140,160); doc.setFontSize(8.5); doc.setFont('helvetica','bold');
  doc.text(t('pdf-student'), M+4, 79); doc.text(t('pdf-group'), 130, 79);
  doc.setTextColor(20,24,32); doc.setFontSize(11); doc.setFont('helvetica','bold');
  doc.text(name, M+4, 87); doc.text(group, 130, 87);

  var sc = pct>=70?[26,106,74]:pct>=50?[224,123,26]:[176,48,16];
  doc.setFillColor(255,255,255); doc.roundedRect(M,100,TW,34,4,4,'F');
  doc.setDrawColor(sc[0],sc[1],sc[2]); doc.setLineWidth(0.8);
  doc.roundedRect(M,100,TW,34,4,4,'S');
  doc.setTextColor(sc[0],sc[1],sc[2]); doc.setFontSize(40); doc.setFont('helvetica','bold');
  doc.text(pct+'%', PW/2, 124, {align:'center'});
  doc.setTextColor(130,140,160); doc.setFontSize(8.5); doc.setFont('helvetica','normal');
  doc.text(correctCount+' '+t('pdf-score')+' '+total+' '+t('pdf-questions'), PW/2, 131, {align:'center'});

  doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
  doc.setFontSize(7); doc.setFont('helvetica','bold');
  doc.rect(M,142,TW,8,'F'); doc.text(t('pdf-summary'), M+4, 148);
  var sy = 154;
  problems.forEach(function(prob, i) {
    if (sy + 12 > PH - 15) {
      doc.addPage(); sy = 20;
      doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
      doc.setFontSize(7); doc.setFont('helvetica','bold');
      doc.rect(M,sy,TW,8,'F'); doc.text(t('pdf-summary2'), M+4, sy+6);
      sy += 12;
    }
    var ok = document.getElementById('pc'+i).classList.contains('ok');
    doc.setFillColor(ok?232:255, ok?240:232, ok?232:228);
    doc.roundedRect(M,sy,TW,10,2,2,'F');
    doc.setFillColor(ok?26:176, ok?106:48, ok?74:16);
    doc.circle(M+6, sy+5, 2.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(7); doc.setFont('helvetica','bold');
    doc.text(ok?'v':'x', M+4.5, sy+6.5);
    doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('helvetica','normal');
    doc.text(t('pdf-item')+' '+(i+1)+': '+pdfText(prob.title), M+12, sy+6.5);
    doc.setTextColor(ok?26:176, ok?106:48, ok?74:16);
    doc.text(ok?t('pdf-ok'):t('pdf-bad'), PW-M-24, sy+6.5);
    sy += 12;
  });

  for (var i = 0; i < problems.length; i++) {
    var prob = problems[i];
    doc.addPage();
    var wy = 0;

    doc.setFillColor(pBR,pBG,pBB); doc.rect(0,0,PW,20,'F');
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,3,'F');
    doc.setTextColor(pAR,pAG,pAB); doc.setFontSize(7); doc.setFont('helvetica','normal');
    doc.text(SCHOOL.courseName[LANG]+'  ·  '+SCHOOL.guideTitle[LANG], M, 10);
    doc.setTextColor(240,244,238); doc.setFontSize(10.5); doc.setFont('helvetica','bold');
    doc.text(t('pdf-item')+' '+(i+1)+' '+t('pdf-of')+' '+total+'  ·  '+pdfText(prob.title), M, 17);
    wy = 25;

    var qRaw = pdfText(prob.questionText);
    doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var qLines = doc.splitTextToSize(qRaw, TW-10);
    var qBoxH  = 8 + qLines.length*5 + 3;
    doc.setFillColor(237,240,245); doc.roundedRect(M,wy,TW,qBoxH,2,2,'F');
    doc.setTextColor(pBR,pBG,pBB); doc.setFontSize(6.5); doc.setFont('helvetica','bold');
    doc.text(t('pdf-question'), M+4, wy+6);
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var qy = wy+12;
    qLines.forEach(function(ln,li){ doc.text(ln, M+4, qy+li*5); });
    wy += qBoxH + 4;

    var isOk   = document.getElementById('pc'+i).classList.contains('ok');
    var chosen = prob.studentChoice != null ? pdfText(prob.options[prob.studentChoice]||'') : '';
    var corr   = pdfText(prob.options[prob.correctIdx]||'');
    var expRaw = pdfText(prob.explanation||'');
    doc.setFontSize(8.5); var chLines = doc.splitTextToSize(t('pdf-yours')+chosen, TW-18);
    doc.setFontSize(8);   var coLines = doc.splitTextToSize(t('pdf-key')+corr, TW-18);
    doc.setFontSize(7.5); var exLines = doc.splitTextToSize(t('pdf-sol')+expRaw, TW-18).slice(0,4);
    var ansBoxH = 8 + chLines.length*5.5 + coLines.length*5 + exLines.length*5 + 6;
    doc.setFillColor(isOk?232:255, isOk?240:232, isOk?232:228);
    doc.roundedRect(M,wy,TW,ansBoxH,2,2,'F');
    doc.setFillColor(isOk?26:176, isOk?106:48, isOk?74:16);
    doc.circle(M+7, wy+8, 3.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(9); doc.setFont('helvetica','bold');
    doc.text(isOk?'v':'x', M+5.2, wy+10.5);
    var ay = wy+7;
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','bold');
    chLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5.5); });
    ay += chLines.length*5.5 + 3;
    doc.setTextColor(26,106,74); doc.setFontSize(8); doc.setFont('helvetica','normal');
    coLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    ay += coLines.length*5 + 3;
    doc.setTextColor(90,85,80); doc.setFontSize(7.5);
    exLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    wy += ansBoxH + 5;

    var dc = document.getElementById('dc'+i);
    if (dc) {
      doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
      doc.setFontSize(7); doc.setFont('helvetica','bold');
      doc.rect(M,wy,TW,8,'F'); doc.text(t('pdf-work'), M+4, wy+5.5);
      wy += 11;
      try {
        var imgD = dc.toDataURL('image/png');
        var ar   = dc.height / dc.width;
        var iw   = TW;
        var ih   = Math.min(iw * ar, 68);
        doc.addImage(imgD, 'PNG', M, wy, iw, ih);
        wy += ih + 4;
      } catch(e) {}
    }

    var ta = document.getElementById('ta'+i);
    if (ta && ta.value.trim()) {
      if (wy > PH-30) { doc.addPage(); wy = 20; }
      doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('courier','normal');
      var taLines = doc.splitTextToSize(ta.value, TW);
      taLines.slice(0,16).forEach(function(ln) {
        if (wy > PH-15) { doc.addPage(); wy = 20; }
        doc.text(ln, M, wy); wy += 5;
      });
      wy += 2;
    }

    var pp = document.getElementById('pp'+i);
    if (pp && pp.src && pp.src.indexOf('data:') === 0) {
      if (wy > PH-55) { doc.addPage(); wy = 20; }
      try { doc.addImage(pp.src, 'JPEG', M, wy, TW, 68); wy += 72; } catch(e) {}
    }
  }

  var pages = doc.internal.getNumberOfPages();
  for (var p = 1; p <= pages; p++) {
    doc.setPage(p);
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0, PH-3, PW, 3, 'F');
    doc.setTextColor(130,140,160); doc.setFontSize(6.5); doc.setFont('helvetica','normal');
    doc.text(name+'  ·  '+group+'  ·  '+t('pdf-code')+code+'  ·  '+t('pdf-page')+p+'/'+pages,
      PW/2, PH-5, {align:'center'});
  }

  var _fn = SCHOOL.filePrefix + '_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf';
  var _pdfBlob = doc.output('blob');
  var _blobUrl = URL.createObjectURL(_pdfBlob);
  var _a = document.createElement('a');
  _a.href = _blobUrl;
  _a.download = _fn;
  document.body.appendChild(_a);
  _a.click();
  setTimeout(function(){ document.body.removeChild(_a); URL.revokeObjectURL(_blobUrl); }, 200);
  btn.textContent = t('btn-pdf');
  btn.disabled  = false;
}
