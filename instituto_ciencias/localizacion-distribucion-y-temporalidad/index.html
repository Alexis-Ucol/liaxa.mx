function buildLesson(rng){
  injectGuideCSS();

  /* ── Apertura ── */
  sec(
    L({ es:'Punto de partida', en:'Starting point' }),
    L({ es:'Tres preguntas que sostienen un mapa', en:'Three questions that hold up a map' }),
    '<p>' + L({
      es:'Frente a cualquier mapa se pueden hacer tres preguntas distintas. ¿Dónde está esto exactamente? ¿Cómo se reparte por el terreno? ¿Desde cuándo se ve así? Cada pregunta usa una herramienta diferente del estudio del espacio geográfico: la localización, la distribución y la temporalidad. Con las tres juntas se pasa de mirar un dibujo a leer un espacio vivo.',
      en:'Facing any map, three different questions can be asked. Where exactly is this? How is it spread across the ground? Since when has it looked like this? Each question uses a different tool from the study of geographic space: location, distribution and temporality. With the three together you move from looking at a drawing to reading a living space.'
    }) + '</p>' +
    '<div class="callout"><p><strong>' + L({ es:'Idea clave: ', en:'Key idea: ' }) + '</strong>' + L({
      es:'localizar responde dónde, la distribución responde cómo se reparte, la diversidad responde en qué se diferencian los sitios, la temporalidad responde desde cuándo y la interacción responde quién cambia a quién. Son cinco lentes sobre el mismo espacio.',
      en:'locating answers where, distribution answers how it is spread, diversity answers how sites differ, temporality answers since when, and interaction answers who changes whom. They are five lenses on the same space.'
    }) + '</p></div>'
  );

  /* ══ CONCEPTO 1 :: localización ══ */
  var s1 = sec(
    L({ es:'Concepto 1', en:'Concept 1' }),
    L({ es:'Localizar: decir dónde de dos maneras', en:'Locating: saying where in two ways' }),
    '<p>' + L({
      es:'Hay dos maneras de decir dónde está algo. La localización relativa usa referencias cercanas: junto al manantial, dos calles arriba del mercado, del lado donde sale el Sol. Es la forma más antigua y sigue siendo la más usada en la vida diaria; los pueblos originarios de México ubicaban sus sitios con los cerros, los ríos, los vientos y el rumbo del amanecer, y así organizaban la siembra y la traza de sus poblados.',
      en:'There are two ways of saying where something is. Relative location uses nearby references: next to the spring, two streets above the market, on the side where the Sun rises. It is the oldest form and it is still the most used in daily life; the original peoples of Mexico located their sites with the hills, the rivers, the winds and the bearing of sunrise, and that is how they organized sowing and the layout of their settlements.'
    }) + '</p>' +
    '<p>' + L({
      es:'La localización absoluta usa una malla de líneas imaginarias que cubre toda la Tierra. Las líneas horizontales, los paralelos, se cuentan desde el ecuador y dan la latitud, hacia el norte o hacia el sur. Las verticales, los meridianos, se cuentan desde el meridiano de Greenwich y dan la longitud, hacia el este o hacia el oeste. Con esos dos datos, un punto queda señalado sin necesidad de ninguna referencia cercana.',
      en:'Absolute location uses a mesh of imaginary lines covering the whole Earth. The horizontal lines, the parallels, are counted from the equator and give the latitude, towards the north or the south. The vertical ones, the meridians, are counted from the Greenwich meridian and give the longitude, towards the east or the west. With those two figures, a point is marked without needing any nearby reference.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Latitud', en:'Latitude' }), L({ es:'0 a 90', en:'0 to 90' }), L({ es:'se cuenta desde el ecuador, norte o sur', en:'counted from the equator, north or south' })) +
      rcard(L({ es:'Longitud', en:'Longitude' }), L({ es:'0 a 180', en:'0 to 180' }), L({ es:'se cuenta desde Greenwich, este u oeste', en:'counted from Greenwich, east or west' })) +
      rcard(L({ es:'Relativa', en:'Relative' }), L({ es:'referencias', en:'references' }), L({ es:'junto a, frente a, arriba de', en:'next to, in front of, above' })) +
      rcard(L({ es:'Absoluta', en:'Absolute' }), L({ es:'coordenadas', en:'coordinates' }), L({ es:'un solo punto en toda la Tierra', en:'a single point on the whole Earth' })) +
    '</div>' +
    '<div class="callout"><p>' + L({
      es:'Las dos formas ubican el mismo sitio y ninguna sustituye a la otra: la relativa sirve para llegar caminando, la absoluta sirve para que alguien de otro país encuentre el punto en un mapa.',
      en:'Both forms locate the same site and neither replaces the other: the relative one helps you get there on foot, the absolute one lets someone from another country find the point on a map.'
    }) + '</p></div>'
  );
  w1(rng, widgetHost(s1, 'w_coord'));
  addProblem(rng, mkP1(rng));
  addProblem(rng, mkP2(rng));

  /* ══ CONCEPTO 2 :: distribución ══ */
  var s2 = sec(
    L({ es:'Concepto 2', en:'Concept 2' }),
    L({ es:'Distribución: cómo se reparte lo que hay', en:'Distribution: how what exists is spread out' }),
    '<p>' + L({
      es:'La distribución describe la forma en que los elementos se reparten sobre el espacio. Las mismas veinte casas pueden quedar apretadas en una manzana, alineadas a lo largo de un camino o separadas una de otra por varios kilómetros. Nada cambió en la cantidad, cambió el acomodo, y ese acomodo explica cómo vive la gente y qué tan lejos le queda el agua, la escuela o el transporte.',
      en:'Distribution describes the way elements are spread over space. The same twenty houses can end up packed into one block, lined up along a road, or separated from one another by several kilometres. Nothing changed in the amount, the arrangement changed, and that arrangement explains how people live and how far the water, the school or the transport is for them.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Concentrada', en:'Clustered' }), L({ es:'todo junto', en:'all together' }), L({ es:'ocupa una zona pequeña del mapa', en:'takes up a small zone of the map' })) +
      rcard(L({ es:'Lineal', en:'Linear' }), L({ es:'en fila', en:'in a row' }), L({ es:'sigue un río, un camino o una costa', en:'follows a river, a road or a coast' })) +
      rcard(L({ es:'Dispersa', en:'Scattered' }), L({ es:'separada', en:'separated' }), L({ es:'se reparte por todo el terreno', en:'spread across the whole ground' })) +
      rcard(L({ es:'Densidad', en:'Density' }), L({ es:'por km2', en:'per km2' }), L({ es:'cuánto hay en cada unidad de superficie', en:'how much there is in each unit of surface' })) +
    '</div>' +
    '<div class="callout"><p>' + L({
      es:'La densidad es la medida numérica de la distribución: reparte la cantidad total entre la superficie que ocupa y permite comparar dos lugares de tamaño distinto con una sola cifra.',
      en:'Density is the numeric measure of distribution: it splits the total amount over the surface it occupies and lets two places of different size be compared with a single figure.'
    }) + '</p></div>'
  );
  w2(rng, widgetHost(s2, 'w_dist'));
  addProblem(rng, mkP3(rng));
  addProblem(rng, mkP4(rng));

  /* ══ CONCEPTO 3 :: diversidad ══ */
  var s3 = sec(
    L({ es:'Concepto 3', en:'Concept 3' }),
    L({ es:'Diversidad: comparar con un criterio', en:'Diversity: comparing with a criterion' }),
    '<p>' + L({
      es:'Dos localidades separadas por unos cuantos kilómetros pueden tener lluvias distintas, cultivos distintos y lenguas distintas. Esa variedad es la diversidad del espacio geográfico, y se estudia comparando. Para comparar hace falta elegir un criterio: el clima, el cultivo principal, la lengua que se habla. Al aplicar un criterio se ve qué sitios se parecen y se pueden agrupar, y al cambiar el criterio el grupo cambia aunque las localidades sean las mismas.',
      en:'Two localities a few kilometres apart can have different rainfall, different crops and different languages. That variety is the diversity of geographic space, and it is studied by comparing. To compare you need to choose a criterion: the climate, the main crop, the language spoken. Applying a criterion shows which sites resemble each other and can be grouped, and changing the criterion changes the group even though the localities are the same.'
    }) + '</p>' +
    '<div class="callout"><p>' + L({
      es:'Por eso una misma comunidad aparece en varios mapas a la vez: en el del clima templado, en el del café y en el de las lenguas originarias. Cada mapa contestó una pregunta diferente sobre ella.',
      en:'That is why one community appears on several maps at once: on the temperate climate map, on the coffee map and on the indigenous languages map. Each map answered a different question about it.'
    }) + '</p></div>'
  );
  w3(rng, widgetHost(s3, 'w_crit'));
  addProblem(rng, mkP5(rng));

  /* ══ CONCEPTO 4 :: temporalidad y cambio ══ */
  var s4 = sec(
    L({ es:'Concepto 4', en:'Concept 4' }),
    L({ es:'Temporalidad: el espacio tiene fecha', en:'Temporality: space has a date' }),
    '<p>' + L({
      es:'Ningún espacio geográfico está terminado. El bosque que hoy cubre una ladera puede ser una parcela en veinte años, y el arroyo que hoy pasa por la orilla del pueblo puede haber corrido antes por otro cauce. La temporalidad es la mirada que compara el mismo espacio en momentos distintos para medir qué cambió, cuánto cambió y a qué ritmo.',
      en:'No geographic space is finished. The forest that today covers a hillside may be a plot in twenty years, and the stream that today runs along the edge of the town may have flowed through another channel before. Temporality is the view that compares the same space at different moments to measure what changed, how much it changed and at what pace.'
    }) + '</p>' +
    '<p>' + L({
      es:'El ritmo importa tanto como el cambio. Un derrumbe modifica una ladera en una noche; la erosión que forma esa misma ladera trabaja durante siglos. Para comparar ritmos se reparte el cambio total entre el tiempo transcurrido, por año o por década, y así dos periodos se vuelven comparables.',
      en:'The pace matters as much as the change. A landslide modifies a hillside in one night; the erosion that forms that same hillside works for centuries. To compare paces, the total change is divided by the time elapsed, per year or per decade, and in that way two periods become comparable.'
    }) + '</p>' +
    '<div class="callout"><p>' + L({
      es:'Una década son diez años. Comparar por década sirve para ver de golpe si el cambio se aceleró o se frenó, incluso cuando los periodos tienen distinta duración.',
      en:'A decade is ten years. Comparing by decade helps you see at a glance whether the change sped up or slowed down, even when the periods last different amounts of time.'
    }) + '</p></div>'
  );
  w4(rng, widgetHost(s4, 'w_time'));
  addProblem(rng, mkP6(rng));
  addProblem(rng, mkP7(rng));

  /* ══ CONCEPTO 5 :: interacción ══ */
  var s5 = sec(
    L({ es:'Concepto 5', en:'Concept 5' }),
    L({ es:'Interacción: quién cambia a quién', en:'Interaction: who changes whom' }),
    '<p>' + L({
      es:'La interacción es la relación de ida y vuelta entre la sociedad y la naturaleza. La gente abre caminos, siembra, construye y saca agua; el relieve, la lluvia y el suelo responden y, a su vez, obligan a la gente a cambiar lo que hace. Casi nunca es un solo paso: es una cadena en la que cada eslabón necesita que el anterior ya haya ocurrido.',
      en:'Interaction is the two-way relationship between society and nature. People open roads, sow, build and draw water; the relief, the rain and the soil respond and, in turn, force people to change what they do. It is almost never a single step: it is a chain in which each link needs the previous one to have already happened.'
    }) + '</p>' +
    '<div class="callout"><p>' + L({
      es:'Reconstruir el orden de la cadena es lo que permite explicar y no solo describir. Cuando el orden queda claro, también queda claro en qué eslabón conviene actuar.',
      en:'Rebuilding the order of the chain is what allows you to explain and not only describe. When the order is clear, it is also clear at which link it is worth acting.'
    }) + '</p></div>'
  );
  w5(rng, widgetHost(s5, 'w_inter'));
  addProblem(rng, mkP8(rng));

  /* ══ CIERRE :: sin explicación previa ══ */
  sec(
    L({ es:'Cierre', en:'Closing' }),
    L({ es:'Dos situaciones sin pistas previas', en:'Two situations with no prior clues' }),
    '<p>' + L({
      es:'Las dos situaciones que siguen llegan sin aviso de cuál mirada les toca. Lee con calma, decide qué se está preguntando y responde.',
      en:'The two situations that follow arrive with no notice of which view they belong to. Read calmly, decide what is being asked and answer.'
    }) + '</p>'
  );
  addProblem(rng, mkP9(rng));
  addProblem(rng, mkP10(rng));
}
/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 1 :: Coloca el punto en la malla de coordenadas
   ══════════════════════════════════════════════════════════════════════════ */
function w1(rng, host){
  var POOL = [
    { lat:20, lon:-100,
      clue:{ es:'El punto está 20 grados al norte del ecuador y 100 grados al oeste del meridiano de Greenwich.',
             en:'The point is 20 degrees north of the equator and 100 degrees west of the Greenwich meridian.' },
      why:{ es:'La latitud se cuenta hacia arriba desde el ecuador y la longitud hacia la izquierda desde Greenwich: quedó en el hemisferio norte y en el hemisferio occidental.',
            en:'Latitude is counted upward from the equator and longitude leftward from Greenwich: it ended up in the northern and western hemispheres.' } },
    { lat:0, lon:30,
      clue:{ es:'El punto cae justo sobre el ecuador, 30 grados al este de Greenwich.',
             en:'The point falls right on the equator, 30 degrees east of Greenwich.' },
      why:{ es:'Sobre el ecuador la latitud vale cero, así que solo se mueve la longitud, y hacia el este se avanza a la derecha del meridiano cero.',
            en:'On the equator latitude is zero, so only longitude moves, and going east means moving right of the zero meridian.' } },
    { lat:-30, lon:-60,
      clue:{ es:'El punto está 30 grados al sur del ecuador y 60 grados al oeste de Greenwich.',
             en:'The point is 30 degrees south of the equator and 60 degrees west of Greenwich.' },
      why:{ es:'Al sur del ecuador la latitud baja y al oeste de Greenwich la longitud va a la izquierda: hemisferio sur y hemisferio occidental.',
            en:'South of the equator latitude goes down and west of Greenwich longitude goes left: southern and western hemispheres.' } },
    { lat:40, lon:0,
      clue:{ es:'El punto está sobre el meridiano de Greenwich, 40 grados arriba del ecuador.',
             en:'The point is on the Greenwich meridian, 40 degrees above the equator.' },
      why:{ es:'Sobre Greenwich la longitud vale cero, de modo que el punto solo sube por el paralelo 40 del hemisferio norte.',
            en:'On Greenwich longitude is zero, so the point only rises along parallel 40 of the northern hemisphere.' } },
    { lat:-10, lon:120,
      clue:{ es:'El punto está 10 grados al sur del ecuador y 120 grados al este de Greenwich.',
             en:'The point is 10 degrees south of the equator and 120 degrees east of Greenwich.' },
      why:{ es:'Una latitud pequeña deja el punto muy cerca del ecuador, y 120 grados al este lo llevan lejos, hacia el borde derecho de la malla.',
            en:'A small latitude leaves the point very close to the equator, and 120 degrees east carry it far, towards the right edge of the mesh.' } },
    { lat:50, lon:-20,
      clue:{ es:'El punto está 50 grados al norte del ecuador y 20 grados al oeste de Greenwich.',
             en:'The point is 50 degrees north of the equator and 20 degrees west of Greenwich.' },
      why:{ es:'La latitud alta lo acerca al borde superior y la longitud pequeña lo deja apenas a la izquierda del meridiano cero.',
            en:'The high latitude brings it near the top edge and the small longitude leaves it just left of the zero meridian.' } }
  ];
  var R = shuffle(POOL, rng).slice(0, 3);
  var lat = ri(rng, -4, 4) * 10, lon = ri(rng, -12, 12) * 10;
  var rd = 0, tries = 0, locked = false, done = false;

  var glines = '';
  [16.666, 33.333, 66.666, 83.333].forEach(function(p){ glines += '<div class="gw-hl" style="top:' + p + '%"></div>'; });
  [16.666, 33.333, 66.666, 83.333].forEach(function(p){ glines += '<div class="gw-vl" style="left:' + p + '%"></div>'; });

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Coloca el punto con sus coordenadas', en:'Place the point with its coordinates' }) + '</div>' +
    '<div class="gw-q" data-r="clue"></div>' +
    '<div class="gw-mini">' + L({ es:'Mueve los dos deslizadores hasta que el punto quede donde dice la pista.', en:'Move the two sliders until the point sits where the clue says.' }) + '</div>' +
    '<div class="gw-plane">' + glines +
      '<div class="gw-eq"></div><div class="gw-mer"></div>' +
      '<div class="gw-tag" style="top:2px;left:4px" data-r="tN"></div>' +
      '<div class="gw-tag" style="bottom:2px;left:4px" data-r="tS"></div>' +
      '<div class="gw-tag" style="bottom:2px;right:4px" data-r="tE"></div>' +
      '<div class="gw-tag" style="top:2px;right:4px" data-r="tW"></div>' +
      '<div class="gw-goal" data-r="goal"></div>' +
      '<div class="gw-dot" data-r="dot"></div>' +
    '</div>' +
    '<div class="gw-read" data-r="read"></div>' +
    '<div class="gw-hemi" data-r="hemi"></div>' +
    '<div class="gw-lbl" data-r="llat"></div>' +
    '<input class="gw-range" type="range" min="-60" max="60" step="10" data-r="slat">' +
    '<div class="gw-lbl" data-r="llon"></div>' +
    '<input class="gw-range" type="range" min="-150" max="150" step="10" data-r="slon">' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Comprobar', en:'Check' }) + '</button></div>' +
    '<div class="gw-fb"></div>';

  var elClue = host.querySelector('[data-r="clue"]'),
      elDot  = host.querySelector('[data-r="dot"]'),
      elGoal = host.querySelector('[data-r="goal"]'),
      elRead = host.querySelector('[data-r="read"]'),
      elHemi = host.querySelector('[data-r="hemi"]'),
      elSlat = host.querySelector('[data-r="slat"]'),
      elSlon = host.querySelector('[data-r="slon"]'),
      elChk  = host.querySelector('[data-r="chk"]');
  host.querySelector('[data-r="tN"]').textContent = L({ es:'norte', en:'north' });
  host.querySelector('[data-r="tS"]').textContent = L({ es:'sur', en:'south' });
  host.querySelector('[data-r="tE"]').textContent = L({ es:'este', en:'east' });
  host.querySelector('[data-r="tW"]').textContent = L({ es:'oeste', en:'west' });
  host.querySelector('[data-r="llat"]').textContent = L({ es:'Latitud', en:'Latitude' });
  host.querySelector('[data-r="llon"]').textContent = L({ es:'Longitud', en:'Longitude' });

  function fLat(v){
    if (v === 0) return L({ es:'0° ecuador', en:'0° equator' });
    return Math.abs(v) + '° ' + (v > 0 ? 'N' : 'S');
  }
  function fLon(v){
    if (v === 0) return L({ es:'0° Greenwich', en:'0° Greenwich' });
    return Math.abs(v) + '° ' + (v > 0 ? 'E' : L({ es:'O', en:'W' }));
  }
  function hemis(){
    var a = lat > 0 ? L({ es:'hemisferio norte', en:'northern hemisphere' }) : (lat < 0 ? L({ es:'hemisferio sur', en:'southern hemisphere' }) : L({ es:'sobre el ecuador', en:'on the equator' }));
    var b = lon > 0 ? L({ es:'hemisferio oriental', en:'eastern hemisphere' }) : (lon < 0 ? L({ es:'hemisferio occidental', en:'western hemisphere' }) : L({ es:'sobre el meridiano cero', en:'on the zero meridian' }));
    return a + ' · ' + b;
  }
  function draw(){
    elDot.style.left = ((lon + 150) / 300 * 100) + '%';
    elDot.style.top  = ((60 - lat) / 120 * 100) + '%';
    elSlat.value = lat; elSlon.value = lon;
    elRead.textContent = fLat(lat) + '   ' + fLon(lon);
    elHemi.textContent = hemis();
    elClue.innerHTML = L(R[rd].clue);
  }
  function showGoal(){
    elGoal.style.left = ((R[rd].lon + 150) / 300 * 100) + '%';
    elGoal.style.top  = ((60 - R[rd].lat) / 120 * 100) + '%';
    elGoal.style.display = 'block';
  }
  function advance(){
    rd++;
    elGoal.style.display = 'none';
    if (rd >= 3){
      done = true;
      elSlat.disabled = true; elSlon.disabled = true;
      elChk.textContent = L({ es:'Completado', en:'Completed' });
      elChk.className = 'gw-btn solved';
      say(host, 'good', L({
        es:'Tres puntos localizados con solo dos datos. Así funciona la localización absoluta: una latitud y una longitud señalan un único sitio en toda la Tierra.',
        en:'Three points located with only two figures. That is how absolute location works: one latitude and one longitude mark a single site on the whole Earth.'
      }));
      return;
    }
    locked = false; tries = 0;
    elChk.textContent = L({ es:'Comprobar', en:'Check' });
    elChk.className = 'gw-btn';
    say(host, '', L({ es:'Nueva pista. Vuelve a mover los deslizadores.', en:'New clue. Move the sliders again.' }));
    draw();
  }
  function close(cls, txt){
    locked = true;
    elChk.textContent = rd === 2 ? L({ es:'Terminar', en:'Finish' }) : L({ es:'Siguiente pista', en:'Next clue' });
    elChk.className = 'gw-btn solved';
    draw();
    say(host, cls, txt);
  }
  function check(){
    if (done) return;
    if (locked){ advance(); return; }
    var dl = R[rd].lat - lat, dn = R[rd].lon - lon;
    if (dl === 0 && dn === 0){ close('good', L(R[rd].why)); return; }
    tries++;
    if (tries >= 3){
      lat = R[rd].lat; lon = R[rd].lon;
      showGoal();
      close('warm', L({ es:'Aquí estaba el punto. ', en:'Here was the point. ' }) + L(R[rd].why));
      return;
    }
    var parts = [];
    if (dl > 0) parts.push(dl + L({ es:' grados hacia el norte', en:' degrees towards the north' }));
    if (dl < 0) parts.push((-dl) + L({ es:' grados hacia el sur', en:' degrees towards the south' }));
    if (dn > 0) parts.push(dn + L({ es:' grados hacia el este', en:' degrees towards the east' }));
    if (dn < 0) parts.push((-dn) + L({ es:' grados hacia el oeste', en:' degrees towards the west' }));
    say(host, 'miss', L({
      es:'El punto está en ' + fLat(lat) + ' y ' + fLon(lon) + '. Te faltan ' + parts.join(L({ es:' y ', en:' and ' })) + '.',
      en:'The point is at ' + fLat(lat) + ' and ' + fLon(lon) + '. You still need ' + parts.join(' and ') + '.'
    }));
    draw();
  }

  elSlat.addEventListener('input', function(){
    if (done || locked){ elSlat.value = lat; return; }
    lat = parseInt(elSlat.value, 10); draw();
  });
  elSlon.addEventListener('input', function(){
    if (done || locked){ elSlon.value = lon; return; }
    lon = parseInt(elSlon.value, 10); draw();
  });
  elChk.addEventListener('click', check);
  say(host, '', L({ es:'Lee la pista, coloca el punto y comprueba.', en:'Read the clue, place the point and check.' }));
  draw();
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 2 :: Tablero de distribución (concentrada, lineal, dispersa)
   ══════════════════════════════════════════════════════════════════════════ */
function w2(rng, host){
  var MODES = {
    con:{ need:6,
      q:{ es:'Acomoda 6 caseríos con una distribución concentrada.', en:'Arrange 6 hamlets with a clustered distribution.' },
      why:{ es:'Concentrada: los seis caseríos caben en un bloque pequeño del mapa. Así se ven los pueblos que crecieron alrededor de un solo manantial o de una plaza.',
            en:'Clustered: the six hamlets fit inside a small block of the map. That is how towns that grew around a single spring or a square look.' },
      sol:[6,7,8,11,12,13] },
    lin:{ need:5,
      q:{ es:'Acomoda 5 caseríos con una distribución lineal.', en:'Arrange 5 hamlets with a linear distribution.' },
      why:{ es:'Lineal: los cinco quedan sobre una misma fila o columna. Así se acomodan las casas que siguen un río, una carretera o la orilla del mar.',
            en:'Linear: the five sit on the same row or column. That is how houses following a river, a road or the seashore are arranged.' },
      sol:[10,11,12,13,14] },
    dis:{ need:5,
      q:{ es:'Acomoda 5 caseríos con una distribución dispersa.', en:'Arrange 5 hamlets with a scattered distribution.' },
      why:{ es:'Dispersa: ninguno toca a otro y ocupan filas y columnas distintas. Así viven los ranchos separados por parcelas y cerros.',
            en:'Scattered: none touches another and they occupy different rows and columns. That is how ranches separated by plots and hills live.' },
      sol:[0,2,14,21,23] }
  };
  var ORD = shuffle(['con','lin','dis'], rng);
  var on = [], i, rd = 0, tries = 0, locked = false, done = false;
  for (i = 0; i < 25; i++) on.push(false);

  var sq = '';
  for (i = 0; i < 25; i++) sq += '<button class="gw-sq" data-i="' + i + '"></button>';

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Tablero de distribución', en:'Distribution board' }) + '</div>' +
    '<div class="gw-q" data-r="task"></div>' +
    '<div class="gw-mini">' + L({ es:'Toca una casilla para poner un caserío y tócala de nuevo para quitarlo.', en:'Tap a square to place a hamlet and tap it again to remove it.' }) + '</div>' +
    '<div class="gw-board">' + sq + '</div>' +
    '<div class="gw-count" data-r="cnt"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Comprobar', en:'Check' }) + '</button>' +
      '<button class="gw-btn" data-r="clr">' + L({ es:'Vaciar tablero', en:'Empty board' }) + '</button></div>' +
    '<div class="gw-fb"></div>';

  var elTask = host.querySelector('[data-r="task"]'),
      elCnt  = host.querySelector('[data-r="cnt"]'),
      elChk  = host.querySelector('[data-r="chk"]'),
      elClr  = host.querySelector('[data-r="clr"]'),
      sqs    = host.querySelectorAll('.gw-sq');

  function mode(){ return MODES[ORD[rd]]; }
  function cells(){
    var out = [], k;
    for (k = 0; k < 25; k++) if (on[k]) out.push({ r:Math.floor(k / 5), c:k % 5, k:k });
    return out;
  }
  function stats(){
    var cs = cells(), rows = {}, cols = {}, k, j, adj = false;
    var rmin = 9, rmax = -1, cmin = 9, cmax = -1;
    for (k = 0; k < cs.length; k++){
      rows[cs[k].r] = 1; cols[cs[k].c] = 1;
      if (cs[k].r < rmin) rmin = cs[k].r;
      if (cs[k].r > rmax) rmax = cs[k].r;
      if (cs[k].c < cmin) cmin = cs[k].c;
      if (cs[k].c > cmax) cmax = cs[k].c;
      for (j = k + 1; j < cs.length; j++){
        if (Math.abs(cs[k].r - cs[j].r) + Math.abs(cs[k].c - cs[j].c) === 1) adj = true;
      }
    }
    return { n:cs.length, nr:Object.keys(rows).length, nc:Object.keys(cols).length,
             sr:(rmax < 0 ? 0 : rmax - rmin + 1), sc:(cmax < 0 ? 0 : cmax - cmin + 1), adj:adj };
  }
  function okNow(){
    var s = stats(), m = mode();
    if (s.n !== m.need) return false;
    if (ORD[rd] === 'con') return s.sr <= 3 && s.sc <= 3;
    if (ORD[rd] === 'lin') return s.nr === 1 || s.nc === 1;
    return !s.adj && s.nr >= 3 && s.nc >= 3;
  }
  function paint(){
    var k;
    for (k = 0; k < 25; k++){
      sqs[k].className = 'gw-sq' + (on[k] ? ' on' : '');
    }
    var s = stats();
    elTask.innerHTML = L(mode().q);
    elCnt.textContent = s.n + L({ es:' de ', en:' of ' }) + mode().need +
      L({ es:' caseríos · abarcan ', en:' hamlets · they span ' }) + s.sr +
      L({ es:' filas y ', en:' rows and ' }) + s.sc + L({ es:' columnas', en:' columns' });
  }
  function advance(){
    rd++;
    if (rd >= 3){
      done = true;
      elChk.textContent = L({ es:'Completado', en:'Completed' });
      elChk.className = 'gw-btn solved';
      elClr.disabled = true;
      say(host, 'good', L({
        es:'Con la misma cantidad de caseríos salieron tres mapas distintos. La distribución no habla de cuántos hay, habla de cómo se reparten.',
        en:'With the same number of hamlets three different maps came out. Distribution is not about how many there are, it is about how they are spread.'
      }));
      return;
    }
    locked = false; tries = 0;
    var k; for (k = 0; k < 25; k++) on[k] = false;
    elChk.textContent = L({ es:'Comprobar', en:'Check' });
    elChk.className = 'gw-btn';
    paint();
    say(host, '', L({ es:'Tablero vacío y nueva consigna.', en:'Empty board and a new instruction.' }));
  }
  function close(cls, txt){
    locked = true;
    elChk.textContent = rd === 2 ? L({ es:'Terminar', en:'Finish' }) : L({ es:'Siguiente consigna', en:'Next instruction' });
    elChk.className = 'gw-btn solved';
    say(host, cls, txt);
  }
  function nudge(){
    var s = stats(), m = mode();
    if (s.n < m.need) return L({ es:'Te faltan ' + (m.need - s.n) + ' caseríos por colocar.', en:'You still need to place ' + (m.need - s.n) + ' hamlets.' });
    if (s.n > m.need) return L({ es:'Tienes ' + (s.n - m.need) + ' caseríos de más: quita los que sobran.', en:'You have ' + (s.n - m.need) + ' hamlets too many: remove the extras.' });
    if (ORD[rd] === 'con') return L({
      es:'Tus caseríos se extienden por ' + s.sr + ' filas y ' + s.sc + ' columnas. Acércalos hasta que todos quepan en un cuadro de tres por tres.',
      en:'Your hamlets stretch over ' + s.sr + ' rows and ' + s.sc + ' columns. Bring them closer until they all fit in a three by three square.'
    });
    if (ORD[rd] === 'lin') return L({
      es:'Ocupas ' + s.nr + ' filas y ' + s.nc + ' columnas distintas. Deja los cinco en una sola fila o en una sola columna.',
      en:'You occupy ' + s.nr + ' different rows and ' + s.nc + ' different columns. Leave the five in a single row or a single column.'
    });
    if (s.adj) return L({ es:'Dos de tus caseríos quedaron pegados. Sepáralos por lo menos una casilla.', en:'Two of your hamlets ended up touching. Separate them by at least one square.' });
    return L({
      es:'Solo usas ' + s.nr + ' filas y ' + s.nc + ' columnas: se ven agrupados. Repártelos por lo menos en tres filas y tres columnas.',
      en:'You only use ' + s.nr + ' rows and ' + s.nc + ' columns: they look grouped. Spread them over at least three rows and three columns.'
    });
  }
  function check(){
    if (done) return;
    if (locked){ advance(); return; }
    if (okNow()){ close('good', L(mode().why)); return; }
    tries++;
    if (tries >= 3){
      var k, sol = mode().sol;
      for (k = 0; k < 25; k++) on[k] = false;
      for (k = 0; k < sol.length; k++) on[sol[k]] = true;
      paint();
      for (k = 0; k < sol.length; k++) sqs[sol[k]].className = 'gw-sq on hint';
      close('warm', L({ es:'Así queda. ', en:'This is how it looks. ' }) + L(mode().why));
      return;
    }
    say(host, 'miss', nudge());
  }

  sqs.forEach(function(b){
    b.addEventListener('click', function(){
      if (done || locked) return;
      var k = parseInt(b.dataset.i, 10);
      on[k] = !on[k];
      paint();
      say(host, '', okNow() ? L({ es:'El acomodo ya cumple la consigna. Comprueba para confirmarlo.', en:'The arrangement already meets the instruction. Check to confirm it.' })
                            : nudge());
    });
  });
  elClr.addEventListener('click', function(){
    if (done || locked) return;
    var k; for (k = 0; k < 25; k++) on[k] = false;
    paint();
    say(host, '', L({ es:'Tablero vacío. Empieza de nuevo cuando quieras.', en:'Empty board. Start again whenever you want.' }));
  });
  elChk.addEventListener('click', check);
  paint();
  say(host, '', L({ es:'Coloca los caseríos y comprueba el acomodo.', en:'Place the hamlets and check the arrangement.' }));
}
/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 3 :: Filtro de criterios (diversidad y agrupación)
   ══════════════════════════════════════════════════════════════════════════ */
function w3(rng, host){
  var VAL = {
    tem:{ es:'clima templado', en:'temperate climate' },
    cal:{ es:'clima cálido', en:'warm climate' },
    sec:{ es:'clima seco', en:'dry climate' },
    caf:{ es:'café', en:'coffee' },
    mai:{ es:'maíz', en:'maize' },
    can:{ es:'caña', en:'sugar cane' },
    nah:{ es:'náhuatl', en:'Nahuatl' },
    zap:{ es:'zapoteco', en:'Zapotec' },
    esp:{ es:'español', en:'Spanish' }
  };
  var LOCS = [
    { n:'Agua Verde',  clima:'tem', cultivo:'caf', lengua:'nah' },
    { n:'El Pedregal', clima:'cal', cultivo:'can', lengua:'esp' },
    { n:'Los Sauces',  clima:'tem', cultivo:'mai', lengua:'nah' },
    { n:'Tepetate',    clima:'sec', cultivo:'mai', lengua:'esp' },
    { n:'La Cañada',   clima:'tem', cultivo:'caf', lengua:'zap' },
    { n:'Peña Blanca', clima:'cal', cultivo:'caf', lengua:'esp' }
  ];
  var CRIT = [
    { key:'clima', val:'tem',
      q:{ es:'Agrupa las localidades donde el clima es templado.', en:'Group the localities where the climate is temperate.' },
      why:{ es:'Con el criterio del clima templado quedan tres localidades en el mismo grupo, aunque siembren cosas distintas y hablen lenguas distintas.',
            en:'With the temperate climate criterion three localities end up in the same group, even though they sow different things and speak different languages.' } },
    { key:'cultivo', val:'caf',
      q:{ es:'Agrupa las localidades donde el cultivo principal es el café.', en:'Group the localities where the main crop is coffee.' },
      why:{ es:'El criterio del cultivo arma otro grupo: entran localidades de clima templado y de clima cálido, porque ahora lo que importa es lo que se siembra.',
            en:'The crop criterion builds another group: localities of temperate and of warm climate come in, because now what matters is what is sown.' } },
    { key:'lengua', val:'nah',
      q:{ es:'Agrupa las localidades donde se habla náhuatl.', en:'Group the localities where Nahuatl is spoken.' },
      why:{ es:'El criterio de la lengua deja fuera a vecinas muy parecidas en clima y cultivo: cada criterio recorta el mapa de otra manera.',
            en:'The language criterion leaves out neighbours that are very similar in climate and crop: each criterion cuts the map in another way.' } },
    { key:'cultivo', val:'mai',
      q:{ es:'Agrupa las localidades donde el cultivo principal es el maíz.', en:'Group the localities where the main crop is maize.' },
      why:{ es:'Dos localidades con climas distintos comparten el mismo cultivo, así que un criterio puede unir sitios que en otro mapa quedarían separados.',
            en:'Two localities with different climates share the same crop, so a criterion can join sites that another map would keep apart.' } },
    { key:'clima', val:'cal',
      q:{ es:'Agrupa las localidades donde el clima es cálido.', en:'Group the localities where the climate is warm.' },
      why:{ es:'El grupo del clima cálido es más pequeño que el del templado: la diversidad se nota justo en ese desequilibrio.',
            en:'The warm climate group is smaller than the temperate one: diversity shows precisely in that imbalance.' } }
  ];
  var R = shuffle(CRIT, rng).slice(0, 3);
  var ROWS = shuffle(LOCS, rng);
  var sel = [], i, rd = 0, tries = 0, locked = false, done = false;
  for (i = 0; i < ROWS.length; i++) sel.push(false);

  var rowsHtml = '';
  for (i = 0; i < ROWS.length; i++){
    rowsHtml += '<button class="gw-tr" data-i="' + i + '">' +
      '<span class="gw-tn">' + ROWS[i].n + '</span>' +
      '<span class="gw-td">' + L(VAL[ROWS[i].clima]) + ' · ' + L(VAL[ROWS[i].cultivo]) + ' · ' + L(VAL[ROWS[i].lengua]) + '</span>' +
      '</button>';
  }

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Filtro de criterios', en:'Criterion filter' }) + '</div>' +
    '<div class="gw-q" data-r="task"></div>' +
    '<div class="gw-mini">' + L({ es:'Toca las localidades que cumplen el criterio. Toca otra vez para sacarlas del grupo.', en:'Tap the localities that meet the criterion. Tap again to take them out of the group.' }) + '</div>' +
    '<div class="gw-tbl">' + rowsHtml + '</div>' +
    '<div class="gw-count" data-r="cnt"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Comprobar', en:'Check' }) + '</button></div>' +
    '<div class="gw-fb"></div>';

  var elTask = host.querySelector('[data-r="task"]'),
      elCnt  = host.querySelector('[data-r="cnt"]'),
      elChk  = host.querySelector('[data-r="chk"]'),
      trs    = host.querySelectorAll('.gw-tr');

  function matches(k){ return ROWS[k][R[rd].key] === R[rd].val; }
  function paint(){
    var k, n = 0;
    for (k = 0; k < ROWS.length; k++){
      trs[k].className = 'gw-tr' + (sel[k] ? ' on' : '');
      if (sel[k]) n++;
    }
    elTask.innerHTML = L(R[rd].q);
    elCnt.textContent = n + L({ es:' localidades en el grupo', en:' localities in the group' });
  }
  function okNow(){
    var k;
    for (k = 0; k < ROWS.length; k++) if (sel[k] !== matches(k)) return false;
    return true;
  }
  function nudge(){
    var k;
    for (k = 0; k < ROWS.length; k++){
      if (sel[k] && !matches(k)) return L({
        es:'Incluiste ' + ROWS[k].n + ', y su dato es ' + L(VAL[ROWS[k][R[rd].key]]) + '. Sácala del grupo.',
        en:'You included ' + ROWS[k].n + ', and its value is ' + L(VAL[ROWS[k][R[rd].key]]) + '. Take it out of the group.'
      });
    }
    var falta = 0;
    for (k = 0; k < ROWS.length; k++) if (!sel[k] && matches(k)) falta++;
    if (falta > 0) return L({
      es:'Van bien las que elegiste, pero todavía faltan ' + falta + ' que cumplen el criterio.',
      en:'The ones you chose are fine, but ' + falta + ' more that meet the criterion are still missing.'
    });
    return L({ es:'Revisa el grupo con calma.', en:'Look over the group calmly.' });
  }
  function advance(){
    rd++;
    var k;
    for (k = 0; k < ROWS.length; k++) sel[k] = false;
    if (rd >= 3){
      done = true;
      elChk.textContent = L({ es:'Completado', en:'Completed' });
      elChk.className = 'gw-btn solved';
      paint();
      say(host, 'good', L({
        es:'Las seis localidades nunca cambiaron y aun así formaron tres grupos distintos. Eso es la diversidad: el criterio decide qué se parece a qué.',
        en:'The six localities never changed and still they formed three different groups. That is diversity: the criterion decides what resembles what.'
      }));
      return;
    }
    locked = false; tries = 0;
    elChk.textContent = L({ es:'Comprobar', en:'Check' });
    elChk.className = 'gw-btn';
    paint();
    say(host, '', L({ es:'Nuevo criterio, mismas localidades.', en:'New criterion, same localities.' }));
  }
  function close(cls, txt){
    locked = true;
    elChk.textContent = rd === 2 ? L({ es:'Terminar', en:'Finish' }) : L({ es:'Siguiente criterio', en:'Next criterion' });
    elChk.className = 'gw-btn solved';
    say(host, cls, txt);
  }
  function check(){
    if (done) return;
    if (locked){ advance(); return; }
    if (okNow()){ close('good', L(R[rd].why)); return; }
    tries++;
    if (tries >= 3){
      var k;
      for (k = 0; k < ROWS.length; k++){
        sel[k] = matches(k);
      }
      paint();
      for (k = 0; k < ROWS.length; k++) if (sel[k]) trs[k].className = 'gw-tr on mark';
      close('warm', L({ es:'Este es el grupo. ', en:'This is the group. ' }) + L(R[rd].why));
      return;
    }
    say(host, 'miss', nudge());
  }

  trs.forEach(function(b){
    b.addEventListener('click', function(){
      if (done || locked) return;
      var k = parseInt(b.dataset.i, 10);
      sel[k] = !sel[k];
      paint();
      say(host, '', okNow() ? L({ es:'El grupo ya coincide con el criterio. Comprueba para confirmarlo.', en:'The group already matches the criterion. Check to confirm it.' }) : nudge());
    });
  });
  elChk.addEventListener('click', check);
  paint();
  say(host, '', L({ es:'Lee el criterio y arma el grupo.', en:'Read the criterion and build the group.' }));
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 4 :: Deslizador del tiempo (temporalidad y ritmo de cambio)
   ══════════════════════════════════════════════════════════════════════════ */
function w4(rng, host){
  var YRS = [1970, 1980, 1990, 2000, 2010, 2020];
  var u = 100 * ri(rng, 2, 4);
  var fast = ri(rng, 1, 3);
  var tail = 100 * ri(rng, 3, 8);
  var drops = [], i;
  for (i = 0; i < 5; i++) drops.push(i === fast ? u * 2 : u);
  var B0 = tail; for (i = 0; i < 5; i++) B0 += drops[i];
  var bosque = [B0];
  for (i = 0; i < 5; i++) bosque.push(bosque[i] - drops[i]);
  var gbase = 10 * ri(rng, 2, 5);
  var C0 = 10 * ri(rng, 6, 12);
  var casas = [C0];
  for (i = 0; i < 5; i++) casas.push(casas[i] + (i === fast ? gbase * 4 : gbase));

  var k1 = ri(rng, 2, 4), X = bosque[k1] + 50;
  var k3 = ri(rng, 2, 4), M = casas[k3] - 5;
  var TASKS = [
    { ans:k1,
      q:{ es:'Coloca el año en que el bosque quedó por primera vez con menos de ' + mil(X) + ' hectáreas.',
          en:'Place the year when the forest was first left with less than ' + mil(X) + ' hectares.' },
      why:{ es:'Ese es el primer momento de la serie en que el bosque baja de ' + mil(X) + ' hectáreas. Antes de ese año todavía estaba por encima.',
            en:'That is the first moment in the series when the forest drops below ' + mil(X) + ' hectares. Before that year it was still above.' } },
    { ans:fast + 1,
      q:{ es:'Coloca el año en que termina la década con la pérdida de bosque más rápida.',
          en:'Place the year that ends the decade with the fastest forest loss.' },
      why:{ es:'En esa década se perdieron ' + mil(u * 2) + ' hectáreas, el doble que en cualquier otra. Ahí el cambio se aceleró y las casas también crecieron más.',
            en:'In that decade ' + mil(u * 2) + ' hectares were lost, twice as many as in any other. There the change sped up and the houses also grew more.' } },
    { ans:k3,
      q:{ es:'Coloca el año en que el número de casas pasó por primera vez de ' + mil(M) + '.',
          en:'Place the year when the number of houses first went past ' + mil(M) + '.' },
      why:{ es:'Ese es el primer año de la serie con más de ' + mil(M) + ' casas: el crecimiento del caserío también tiene fecha.',
            en:'That is the first year of the series with more than ' + mil(M) + ' houses: the growth of the settlement also has a date.' } }
  ];
  var cur = 0, rd = 0, tries = 0, locked = false, done = false;

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Deslizador del tiempo', en:'Time slider' }) + '</div>' +
    '<div class="gw-q" data-r="task"></div>' +
    '<div class="gw-mini">' + L({ es:'Mueve el año y observa cómo cambian el bosque y las casas de la misma comunidad.', en:'Move the year and watch how the forest and the houses of the same community change.' }) + '</div>' +
    '<div class="gw-year" data-r="yr"></div>' +
    '<div class="gw-bars">' +
      '<div class="gw-brow"><div class="gw-bh"><span data-r="l1"></span><span class="gw-val" data-r="v1"></span></div>' +
        '<div class="gw-btrk"><div class="gw-bfil gr" data-r="b1"></div></div></div>' +
      '<div class="gw-brow"><div class="gw-bh"><span data-r="l2"></span><span class="gw-val" data-r="v2"></span></div>' +
        '<div class="gw-btrk"><div class="gw-bfil hs" data-r="b2"></div></div></div>' +
    '</div>' +
    '<input class="gw-range" type="range" min="0" max="5" step="1" data-r="sl">' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Comprobar', en:'Check' }) + '</button>' +
      '<span class="gw-val" data-r="dec"></span></div>' +
    '<div class="gw-fb"></div>';

  var elTask = host.querySelector('[data-r="task"]'),
      elYr   = host.querySelector('[data-r="yr"]'),
      elV1   = host.querySelector('[data-r="v1"]'),
      elV2   = host.querySelector('[data-r="v2"]'),
      elB1   = host.querySelector('[data-r="b1"]'),
      elB2   = host.querySelector('[data-r="b2"]'),
      elSl   = host.querySelector('[data-r="sl"]'),
      elChk  = host.querySelector('[data-r="chk"]'),
      elDec  = host.querySelector('[data-r="dec"]');
  host.querySelector('[data-r="l1"]').textContent = L({ es:'Bosque (hectáreas)', en:'Forest (hectares)' });
  host.querySelector('[data-r="l2"]').textContent = L({ es:'Casas', en:'Houses' });

  function draw(){
    elSl.value = cur;
    elYr.textContent = YRS[cur];
    elV1.textContent = mil(bosque[cur]);
    elV2.textContent = mil(casas[cur]);
    elB1.style.width = (bosque[cur] / B0 * 100) + '%';
    elB2.style.width = (casas[cur] / casas[5] * 100) + '%';
    elTask.innerHTML = L(TASKS[rd].q);
    if (cur === 0) elDec.textContent = L({ es:'inicio de la serie', en:'start of the series' });
    else elDec.textContent = L({
      es:'en esta década se perdieron ' + mil(bosque[cur - 1] - bosque[cur]) + ' ha',
      en:'in this decade ' + mil(bosque[cur - 1] - bosque[cur]) + ' ha were lost'
    });
  }
  function advance(){
    rd++;
    if (rd >= 3){
      done = true; elSl.disabled = true;
      elChk.textContent = L({ es:'Completado', en:'Completed' });
      elChk.className = 'gw-btn solved';
      say(host, 'good', L({
        es:'El mismo espacio, cinco décadas y tres respuestas distintas. La temporalidad no solo dice que algo cambió: dice cuándo y a qué ritmo.',
        en:'The same space, five decades and three different answers. Temporality does not only say that something changed: it says when and how fast.'
      }));
      return;
    }
    locked = false; tries = 0;
    elChk.textContent = L({ es:'Comprobar', en:'Check' });
    elChk.className = 'gw-btn';
    say(host, '', L({ es:'Nueva consigna sobre la misma serie de años.', en:'New instruction about the same series of years.' }));
    draw();
  }
  function close(cls, txt){
    locked = true;
    elChk.textContent = rd === 2 ? L({ es:'Terminar', en:'Finish' }) : L({ es:'Siguiente consigna', en:'Next instruction' });
    elChk.className = 'gw-btn solved';
    draw();
    say(host, cls, txt);
  }
  function nudge(){
    var ans = TASKS[rd].ans;
    if (rd === 0){
      if (bosque[cur] >= X) return L({
        es:'En ' + YRS[cur] + ' el bosque todavía cubre ' + mil(bosque[cur]) + ' hectáreas. Avanza el año.',
        en:'In ' + YRS[cur] + ' the forest still covers ' + mil(bosque[cur]) + ' hectares. Move the year forward.'
      });
      return L({
        es:'En ' + YRS[cur] + ' ya está por debajo, pero un año anterior también lo estaba. Regresa el deslizador.',
        en:'In ' + YRS[cur] + ' it is already below, but an earlier year was below too. Move the slider back.'
      });
    }
    if (rd === 1){
      if (cur === 0) return L({
        es:'1970 es el inicio de la serie y no cierra ninguna década. Elige el año en que termina un periodo.',
        en:'1970 is the start of the series and does not close any decade. Choose the year that ends a period.'
      });
      return L({
        es:'Entre ' + YRS[cur - 1] + ' y ' + YRS[cur] + ' se perdieron ' + mil(bosque[cur - 1] - bosque[cur]) + ' hectáreas. Busca una década con una pérdida mayor.',
        en:'Between ' + YRS[cur - 1] + ' and ' + YRS[cur] + ' ' + mil(bosque[cur - 1] - bosque[cur]) + ' hectares were lost. Look for a decade with a bigger loss.'
      });
    }
    if (casas[cur] <= M) return L({
      es:'En ' + YRS[cur] + ' hay ' + mil(casas[cur]) + ' casas, todavía no pasa de ' + mil(M) + '. Avanza el año.',
      en:'In ' + YRS[cur] + ' there are ' + mil(casas[cur]) + ' houses, still not past ' + mil(M) + '. Move the year forward.'
    });
    return L({
      es:'En ' + YRS[cur] + ' ya pasa de ' + mil(M) + ', pero un año anterior también. Regresa el deslizador.',
      en:'In ' + YRS[cur] + ' it is already past ' + mil(M) + ', but an earlier year was too. Move the slider back.'
    });
  }
  function check(){
    if (done) return;
    if (locked){ advance(); return; }
    if (cur === TASKS[rd].ans){ close('good', L(TASKS[rd].why)); return; }
    tries++;
    if (tries >= 3){
      cur = TASKS[rd].ans;
      close('warm', L({ es:'Este es el año. ', en:'This is the year. ' }) + L(TASKS[rd].why));
      return;
    }
    say(host, 'miss', nudge());
  }

  elSl.addEventListener('input', function(){
    if (done || locked){ elSl.value = cur; return; }
    cur = parseInt(elSl.value, 10);
    draw();
  });
  elChk.addEventListener('click', check);
  draw();
  say(host, '', L({ es:'Recorre los años y comprueba cuando lo tengas.', en:'Run through the years and check when you have it.' }));
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 5 :: Cadena de interacción sociedad y naturaleza

  var CHAINS = [

        { es:'Al vender más, las familias amplían la superficie sembrada.', en:'Selling more, families widen the sown area.' },
        { es:'El monte que rodeaba al pueblo se reduce y llega menos agua al manantial.', en:'The woodland around the town shrinks and less water reaches the spring.' },
        { es:'La comunidad decide dejar una franja de monte sin tocar alrededor del manantial.', en:'The community decides to leave an untouched strip of woodland around the spring.' }
      ],
      why:{ es:'El camino no cambió el clima ni el relieve, pero cambió lo que la gente podía vender, y eso terminó cambiando el monte y el agua.',
            en:'The road did not change the climate or the relief, but it changed what people could sell, and that ended up changing the woodland and the water.' } }
  ];
  var R = shuffle(CHAINS, rng);
  var rd = 0, placed = 0, tries = 0, locked = false, done = false;
  var order = shuffle([0, 1, 2, 3, 4], rng);

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Arma la cadena de interacción', en:'Build the interaction chain' }) + '</div>' +
    '<div class="gw-q" data-r="task"></div>' +
    '<div class="gw-mini">' + L({ es:'Toca los pasos en el orden en que ocurren. Si te equivocas, la cadena te dice qué falta antes.', en:'Tap the steps in the order they happen. If you slip, the chain tells you what is missing first.' }) + '</div>' +
    '<div class="gw-chain" data-r="chain"></div>' +
    '<div class="gw-pool" data-r="pool"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="undo">' + L({ es:'Quitar el último', en:'Remove the last' }) + '</button>' +
      '<button class="gw-btn" data-r="nxt" style="display:none"></button></div>' +
    '<div class="gw-fb"></div>';

  var elTask  = host.querySelector('[data-r="task"]'),
      elChain = host.querySelector('[data-r="chain"]'),
      elPool  = host.querySelector('[data-r="pool"]'),
      elUndo  = host.querySelector('[data-r="undo"]'),
      elNxt   = host.querySelector('[data-r="nxt"]');

  function render(){
    var st = R[rd].steps, i, h = '';
    elTask.innerHTML = L({ es:'Cadena: ', en:'Chain: ' }) + L(R[rd].title);
    for (i = 0; i < placed; i++){
      h += '<div class="gw-link"><span class="gw-lnum">' + (i + 1) + '</span><span>' + L(st[i]) + '</span></div>';
    }
    elChain.innerHTML = h;
    h = '';
    for (i = 0; i < order.length; i++){
      var idx = order[i];
      if (idx < placed) continue;
      h += '<button class="gw-tile" data-i="' + idx + '"' + (locked ? ' disabled' : '') + '>' + L(st[idx]) + '</button>';
    }
    elPool.innerHTML = h;
    elPool.querySelectorAll('.gw-tile').forEach(function(b){
      b.addEventListener('click', function(){ tap(parseInt(b.dataset.i, 10)); });
    });
    elUndo.disabled = (placed === 0 || locked || done);
  }
  function finishRound(cls, txt){
    locked = true;
    elNxt.style.display = 'inline-block';
    elNxt.textContent = rd === R.length - 1 ? L({ es:'Terminar', en:'Finish' }) : L({ es:'Siguiente cadena', en:'Next chain' });
    elNxt.className = 'gw-btn solved';
    render();
    say(host, cls, txt);
  }
  function tap(idx){
    if (locked || done) return;
    if (idx === placed){
      placed++;
      render();
      if (placed === R[rd].steps.length){ finishRound('good', L(R[rd].why)); return; }
      say(host, '', L({
        es:'Eslabón ' + placed + ' en su sitio. ¿Qué ocurre justo después?',
        en:'Link ' + placed + ' in place. What happens right after?'
      }));
      return;
    }
    tries++;
    if (tries >= 3){
      placed = R[rd].steps.length;
      render();
      finishRound('warm', L({ es:'Esta es la cadena completa. ', en:'This is the full chain. ' }) + L(R[rd].why));
      return;
    }
    if (idx < placed) return;
    say(host, 'miss', L({
      es:'Ese paso necesita que antes ocurra otra cosa. Busca el eslabón que explica por qué llegaría a pasar.',
      en:'That step needs something else to happen first. Look for the link that explains why it would come to happen.'
    }));
  }
  elUndo.addEventListener('click', function(){
    if (locked || done || placed === 0) return;
    placed--;
    render();
    say(host, '', L({ es:'Quitaste el último eslabón. Puedes volver a elegir.', en:'You removed the last link. You can choose again.' }));
  });
  elNxt.addEventListener('click', function(){
    rd++;
    if (rd >= R.length){
      done = true;
      elNxt.style.display = 'none';
      elUndo.disabled = true;
      say(host, 'good', L({
        es:'Dos cadenas, el mismo patrón: la sociedad cambia la naturaleza, la naturaleza responde y la sociedad vuelve a decidir.',
        en:'Two chains, the same pattern: society changes nature, nature responds and society decides again.'
      }));
      return;
    }
    placed = 0; tries = 0; locked = false;
    order = shuffle([0, 1, 2, 3, 4], rng);
    elNxt.style.display = 'none';
    render();
    say(host, '', L({ es:'Otra cadena. Empieza por el primer eslabón.', en:'Another chain. Start with the first link.' }));
  });
  render();
  say(host, '', L({ es:'Elige el paso que ocurre primero.', en:'Choose the step that happens first.' }));
}

      en:'First multiply 10 × ' + e.n + ' = ' + (10 * e.n) + ' and then add that result: ' + e.y0 + ' + 10 × ' + e.n + ' = ' + (e.y0 + 10 * e.n) + '.'
    }),

  };

function mkP7(rng){
  if (rng() < 0.5){
    var d = gen(rng, function(r){
      var per = ri(r, 15, 40), E = 100 * ri(r, 8, 15);
      var x1 = ri(r, 4, 9), x2 = ri(r, 4, 9);
      return { per:per, E:E, S:E + 30 * per, vals:[per, per * 10, per + x1, per - x2] };
    });
    return {
      title: L({ es:'Ritmo de la pérdida de bosque', en:'Pace of the forest loss' }),
      q: L({
        es:'En 1990 el bosque de una comunidad cubría ' + mil(d.S) + ' hectáreas y en 2020 cubría ' + mil(d.E) + ' hectáreas. La pérdida fue la misma cada año. ¿Cuántas hectáreas de bosque se perdieron cada año?',
        en:'In 1990 the forest of a community covered ' + mil(d.S) + ' hectares and in 2020 it covered ' + mil(d.E) + ' hectares. The loss was the same every year. How many hectares of forest were lost each year?'
      }),
      hint: L({
        es:'Obtén primero la pérdida total del periodo y después repártela entre los años que transcurrieron.',
        en:'First get the total loss of the period and then share it out among the years that passed.'
      }),
      exp: L({
        es:'La pérdida total fue ' + mil(d.S) + ' − ' + mil(d.E) + ' = ' + mil(30 * d.per) + ' hectáreas en 30 años, y repartida por año da ' + mil(30 * d.per) + ' ÷ 30 = ' + d.per + '.',
        en:'The total loss was ' + mil(d.S) + ' − ' + mil(d.E) + ' = ' + mil(30 * d.per) + ' hectares in 30 years, and shared by year it gives ' + mil(30 * d.per) + ' ÷ 30 = ' + d.per + '.'
      }),
      options: nums(d.vals), correct: 0, showWork: true
    };
  }
  var e = gen(rng, function(r){
    var perDec = 100 * ri(r, 2, 8), P0 = 100 * ri(r, 5, 12);
    return { perDec:perDec, P0:P0, P1:P0 + 4 * perDec, vals:[perDec, perDec * 4, perDec + 100, perDec - 100] };
  });
  return {
    title: L({ es:'Crecimiento por década', en:'Growth by decade' }),
    q: L({
      es:'Una localidad tenía ' + mil(e.P0) + ' habitantes en 1980 y llegó a ' + mil(e.P1) + ' habitantes en 2020. El aumento se repartió por igual entre las cuatro décadas del periodo. ¿Cuántos habitantes aumentó en cada década?',
      en:'A locality had ' + mil(e.P0) + ' inhabitants in 1980 and reached ' + mil(e.P1) + ' inhabitants in 2020. The increase was spread evenly across the four decades of the period. How many inhabitants did it grow in each decade?'
    }),
    hint: L({
      es:'Calcula primero el aumento total y después divídelo entre el número de décadas que cabe en el periodo.',
      en:'First work out the total increase and then divide it by the number of decades that fit in the period.'
    }),
    exp: L({
      es:'El aumento total fue ' + mil(e.P1) + ' − ' + mil(e.P0) + ' = ' + mil(4 * e.perDec) + ' habitantes en cuatro décadas: ' + mil(4 * e.perDec) + ' ÷ 4 = ' + e.perDec + '.',
      en:'The total increase was ' + mil(e.P1) + ' − ' + mil(e.P0) + ' = ' + mil(4 * e.perDec) + ' inhabitants across four decades: ' + mil(4 * e.perDec) + ' ÷ 4 = ' + e.perDec + '.'
    }),
    options: nums(e.vals), correct: 0, showWork: true
  };
}

function mkP8(rng){

function mkP10(rng){
  if (rng() < 0.5){
    var d = gen(rng, function(r){
      var E = pk(r, [10, 15, 20, 25, 30]), C = ri(r, 4, 9);
      return { E:E, C:C, vals:[E * C, E + C, E * (C - 1), E * (C + 1)] };
    });
    return {
      title: L({ es:'Del mapa al terreno', en:'From the map to the ground' }),
      q: L({
        es:'En un mapa, un centímetro representa ' + d.E + ' kilómetros del terreno. Dos ciudades aparecen separadas por ' + d.C + ' centímetros en ese mapa. ¿Cuántos kilómetros hay entre las dos ciudades?',
        en:'On a map, one centimetre represents ' + d.E + ' kilometres of ground. Two cities appear ' + d.C + ' centimetres apart on that map. How many kilometres are there between the two cities?'
      }),
      hint: L({
        es:'Cada centímetro del papel vale la misma cantidad de kilómetros, así que basta repetir ese valor tantas veces como centímetros haya.',
        en:'Each centimetre of paper is worth the same number of kilometres, so it is enough to repeat that value as many times as there are centimetres.'
      }),
      exp: L({
        es:'Cada centímetro vale ' + d.E + ' km y hay ' + d.C + ' centímetros: ' + d.E + ' × ' + d.C + ' = ' + (d.E * d.C) + '.',
        en:'Each centimetre is worth ' + d.E + ' km and there are ' + d.C + ' centimetres: ' + d.E + ' × ' + d.C + ' = ' + (d.E * d.C) + '.'
      }),
      options: nums(d.vals), correct: 0, showWork: true
    };
  }
  var e = gen(rng, function(r){
    var E = pk(r, [10, 15, 20, 25]), C = ri(r, 4, 12);
    return { E:E, C:C, D:E * C, vals:[C, C * 2, C + E, E] };
  });
  return {
    title: L({ es:'Del terreno al mapa', en:'From the ground to the map' }),
    q: L({
      es:'Una carretera mide ' + mil(e.D) + ' kilómetros. En un mapa, cada centímetro representa ' + e.E + ' kilómetros del terreno. ¿Cuántos centímetros mide esa carretera en el mapa?',
      en:'A road measures ' + mil(e.D) + ' kilometres. On a map, each centimetre represents ' + e.E + ' kilometres of ground. How many centimetres does that road measure on the map?'
    }),
    hint: L({
      es:'Averigua cuántas veces cabe en la carretera la cantidad de kilómetros que vale un centímetro.',
      en:'Work out how many times the number of kilometres worth one centimetre fits into the road.'
    }),
    exp: L({
      es:'Los kilómetros del terreno se reparten entre los que vale cada centímetro: ' + mil(e.D) + ' ÷ ' + e.E + ' = ' + e.C + '.',
      en:'The kilometres of ground are divided by those each centimetre is worth: ' + mil(e.D) + ' ÷ ' + e.E + ' = ' + e.C + '.'
    }),
    options: nums(e.vals), correct: 0, showWork: true
  };
}

<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbykkuJ_apGq3vALIFd4mr3acu81c7K4OKxW-DZ-i52Ceyl3lOanXMdvbS9SIXPrLQBm/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'Localización, Distribución y Temporalidad';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
